answer: |-
  The rain in Harrow's Reach does not wash things clean; it merely presses the salt deeper into the wood. Elara sits in the office of the Collapsed Trust, the ledger open before her. The ink is fresh, but the debts are old. She is an actuary of honour, brought in from the mainland to dissect the corpse of the town's social contract.

  For fifty years, the Seven Families guaranteed one another's solvency on a handshake. No contracts, no collateral. Just the disposition to pay if called. Now the fishing fleets are idle, the tourism has dried up, and the first demand for payment has shattered the chain. Elara's job is to classify the breakage.

  She turns the page. Case 402: Thomas Vane.

  Vane sits across from her, hands wrapped around a mug of tea that has gone cold. He is a large man, diminished by a suit that no longer fits his shrinking frame.

  "I had the money," Vane says. His voice is flat. "When the call came from the Halloways, I went to the bank. The account was frozen. A regulatory glitch triggered by the town's zoning violation. I couldn't access the liquidity. The will was there. The capacity was blocked."

  Elara watches him. She looks for the micro-expressions of deceit, but she is looking for something deeper. She is looking for the *mask*. A mask is extrinsic. The sugar cube is soluble, but wrapped in wax. The disposition remains intact, waiting for the wax to dissolve. If Vane is masked, his honour is real. He is liable, because the guarantee was present, merely stifled by the regulatory freeze.

  "Show me the correspondence with the bank," Elara says.

  Vane slides a folder across the desk. It is thick. Dates align. The freeze happened hours before the demand was made. He tried to wire funds after the demand. He failed.

  "It's a mask," Elara says, more to herself than him.

  "Does that mean I owe?"

  "It means the disposition survived the stimulus. You were honourable, but the world prevented the manifestation. The Trust covers the loss, but your family's standing is retained. You are cleared."

  Vane exhales, a sound like a tire losing air. He leaves. Elara marks the file: *Masked. Disposition Intact.*

  She moves to the next file. Case 405: Julian Kress.

  Kress does not sit. He paces the small office, the floorboards creaking under his boots. He is the one who made the first call. He demanded payment from the Halloways, they defaulted, and now the chain has recoiled back to him.

  "I didn't say no," Kress argues. "I said *not now*."

  "The terms of the Handshake are immediate liquidity upon demand," Elara says. She keeps her pen hovering over the paper. "When the Halloways called you, what happened?"

  "I looked at the books. I saw what taking that hit would do to my workers. I realized that paying them would mean firing ten men. So I didn't pay."

  Elara stops writing. This is the crux. Is this a mask? Did an external factor (the welfare of the workers) block the manifestation of his honour? Or is it a *fink*?

  A finkish disposition is one that disappears upon the arrival of the stimulus. The fragile glass that becomes tough precisely when struck. If the act of being called upon changes the agent such that they no longer possess the disposition to honour, the guarantee was never real. It was contingent on never being tested.

  "Did you have the funds?" Elara asks.

  "Yes."

  "Did something external stop you from transferring them?"

  "No. The bank was open. The line was clear."

  "Then why didn't you pay?"

  "Because you don't understand," Kress says, stopping his pace. He leans on the desk. "Before you asked, I was the kind of man who pays. I believed that about myself. But when you actually ask... when you put the knife in... the priority shifts. Survival takes over. The man who would have paid died the moment you asked him to."

  Elara looks at him. She sees the shift in his eyes. It isn't regret. It is a fundamental recalibration. The stimulus (the demand) caused an intrinsic change in his disposition (the willingness to honour). He is not masked; he is finkish. The honour was not blocked; it was evacuated.

  "If I mark this as Masked," Elara says, "the Town Trust assumes the debt. Your reputation remains. You are a victim of circumstance."

  "And if you mark it Finkish?"

  "Then the guarantee was a lie. You are liable for breach of contract. The Trust dissolves. Your family is ejected from the consortium."

  Kress straightens up. "If you mark me Finkish, there is no town left. Everyone else was watching me. If my honour was fake, theirs is too. They were only honourable because they thought I was."

  Elara knows this is true. The dispositions of the Seven Families are interdependent. But her job is not social engineering. It is metaphysics. It is truth.

  She marks the file: *Finkish. Disposition Destroyed by Stimulus.*

  Kress sees the ink dry. He nods, once. He walks out into the rain. He knows what comes next. The lawsuits will begin. The town will fracture. But the ledger will be accurate.

  Elara turns to the final file. Case 001: Mrs. Gable.

  Mrs. Gable died three months before the collapse. She was the matriarch of the oldest family. Her guarantee backs the largest portion of the debt. But she was never called upon. The stimulus never arrived.

  Her son sits opposite her now. He is young, eager, wearing his grief like a shield.

  "My mother would have paid," he says. "Everyone knows it. She built this town. Her word was iron."

  "She was never tested," Elara says.

  "Does that matter? She had the character. The disposition was categorical. It was part of her soul, not just a reaction to a demand."

  Elara leans back. This is the wrinkle that keeps her awake. The counterfactual. *She would have honoured it if called.* Is that a fact about Mrs. Gable that predates the call? Or is it a story we tell ourselves because the call never came?

  If Elara rules that the disposition existed without the stimulus, she validates the idea of honour as an intrinsic property, like mass or charge. It exists regardless of interaction.

  If she rules that it did not exist, she validates the idea that dispositions are merely conditional truths. No stimulus, no fact of the matter.

  "The Handshake requires a manifest willingness," Elara says. "We have no record of her paying a major debt. We have no record of her being tested."

  "She paid small debts. She tipped well. She kept her promises."

  "Small stimuli," Elara says. "The disposition to pay a dinner bill is not the disposition to sink your family into ruin to save a neighbour. The magnitude of the stimulus matters. A glass is fragile to a hammer, not to a feather. We never brought the hammer down."

  "So you're saying she wasn't honourable?"

  "I'm saying we don't know." Elara picks up her pen. She feels the weight of it. If she rules in his favour, she preserves the town's myth. She treats the untested disposition as real. If she rules against him, she admits that honour is only what survives the strike.

  She looks at the portrait of Mrs. Gable on the wall. The woman looks stern, unyielding. But portraits are masks. They freeze a expression that might have changed under pressure.

  Elara thinks of Kress. He thought he was honourable until the moment he wasn't. The disposition was not a stored object; it was a process. It required the input to generate the output. Without the input, there is no output, and there is no process.

  "There is no fact of the matter," Elara says. "You cannot claim a disposition that was never manifested. The guarantee requires the call. Without the call, there is no guarantee."

  "That's cruel," the son says.

  "It's accurate," Elara replies. "If I say she would have paid, I am writing fiction. I am projecting a history that didn't happen. The Trust cannot rely on counterfactuals. We deal in manifestations."

  She marks the file: *Untested. No Disposition Verified.*

  The son stands up. He looks at the ledger, then at Elara. "You've killed the town."

  "No," Elara says. "I've autopsied it. It was dead before I arrived. I'm just telling you how it died."

  He leaves. The office is silent again. The rain hammers against the glass. Elara looks at the three files. Vane, masked. Kress, finkish. Gable, untested.

  She closes the ledger. The distinction is clean now. The mask preserves the soul behind a wall. The fink eats the soul when the wall is breached. The untested soul is a ghost.

  Elara packs her bag. She will leave in the morning. The town will burn, perhaps. Or it will rebuild on something harder than handshakes. Contracts. Collateral. Cold, hard assets that do not depend on what a person *would* do, but only on what they *have*.

  She walks out into the street. The salt air stings her eyes. She thinks of Kress, walking home to tell his wife they are ruined. She thinks of Vane, safe in his wax. She thinks of Mrs. Gable, safe in her grave, her honour intact only because no one dared to strike it.

  Elara pulls her collar up. She prefers the fink. At least the fink is honest about the change. The mask pretends nothing happened. The untested pretend they are made of iron. But only the break tells you what you are.

  She walks toward the ferry terminal. Behind her, the lights of Harrow's Reach flicker and die, one by one.

  ***

  **Note on Metaphysics and Construction**

  **Liberties and Readings:**
  The primary liberty taken here is the anthropomorphizing of dispositions. In standard analytic metaphysics (e.g., Martin, Bird, Mumford), dispositions are usually properties of natural kinds (solubility, fragility) rather than complex moral-psychological states like "honour." Honour is not a simple power; it is a composite of virtue, habit, and social pressure. By treating it as a simple disposition, I am leaning on a **Simple Dispositionalist** reading rather than a **Categorical Basis** reading. I am treating "honour" as identical to its manifestation conditions, rather than being grounded in a deeper neural or psychological state that persists regardless of manifestation.

  Regarding the "Never Called" case (Mrs. Gable), I have leaned heavily on the **Conditional Analysis** of dispositions (the Simple Conditional Analysis held by early logical positivists, largely refuted by finkish masks but useful here for dramatic effect). I ruled that without the stimulus, there is no truth-maker for the disposition claim. This is an anti-realist stance on unmanifested dispositions. I rejected the view that dispositions are real, existing properties (powers) that persist even without stimulus (Dispositional Essentialism). In the story, Elara decides that "would have" is a narrative construct, not a metaphysical fact.

  **Character Defense and Accusation:**
  I would defend **Thomas Vane (The Mask)**. His case is the most metaphysically secure. The extrinsic blocker (the freeze) is verifiable, and his internal state (willingness) remained constant. He represents the tragedy of good faith thwarted by circumstance, and the story treats his disposition as real because the evidence suggests the categorical basis for his honour (his intent) persisted through the stimulus.

  I suspect I stacked the deck against **Julian Kress (The Fink)**. In reality, moral psychology is rarely this binary. A change in priority due to survival instinct is often a conflict of dispositions (Honour vs. Survival) rather than the disappearance of Honour itself. By framing his survival instinct as destroying the honour disposition entirely, I simplified the metaphysics to fit the Fink model cleanly. He is less a complex human and more a vehicle for the concept of a disposition that vanishes upon testing. I made him too self-aware of his own finkishness to be fully realistic, but necessary for the philosophical clarity of the verdict.
