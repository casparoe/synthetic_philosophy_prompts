      *   No caricatures? Hopefully.
      *   Concrete case (Glimmer)? Yes.
      *   Manual discussed (translation/paraphrase)? Yes.
      *   No tidy consensus? Yes.

  *(Self-Correction during final polish)*: Make sure Marcus doesn't just sound like he ignores ontology. He should argue that ontology is secondary to structure. Elena should argue that ontology drives the *questions* asked, not just the answers.

