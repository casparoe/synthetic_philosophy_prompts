answer: |-
  The arc moves from visceral experience of the trap to structural diagnosis of the rules that make rational bids look like irrational commitment.

  **Preconditions on the Table**
  Before a single bid is placed, three things must be physically visible and verbally confirmed:
  1.  **Physical Cash:** Put the $1 bill and enough change for payouts on the table. Digital promises dilute the pain; the loss must be tangible.
  2.  **Written Rules:** Project the rules on a screen or whiteboard, specifically bolding: *"Highest bidder gets $1. Second-highest bidder pays their bid and gets nothing."* Do not rely on verbal explanation.
  3.  **Psychological Cover:** State explicitly: "This game is rigged against rational actors. Losing money here does not indicate poor judgment; it indicates you understood the incentives correctly." This prevents ego defense from blocking the lesson.

  **Session Structure: Auction as Hook, Cases as Meat**
  Do not let the auction carry the whole session. It is too clean to be believed.
  *   **0–20 mins: The Auction.** Run the game. Collect the money.
  *   **20–35 mins: The Autopsy.** Analyze the bidding log. Show that every single bid was mathematically rational *at the moment it was made* to minimize loss.
  *   **35–75 mins: The Translation.** Break into groups of three. Have them map the auction rules to a current or recent doomed project. They must identify the *implicit* equivalent of the "second-highest bidder pays" rule in their organization (e.g., "If we cancel, the VP loses face," "If we stop, the team gets disbanded," "Our OKRs penalize pivot speed").
  *   **75–90 mins: Rule Design.** Discuss how to change the organizational rules, not the people.

  **The "Second-Highest Bidder" Limitation**
  You are correct that the auction is a poor stand-in because the penalty is explicit, whereas in engineering, the penalty for quitting is political and implicit. Use this gap. The teaching point is not the auction itself, but the hunt for the *hidden clause* in their company policy that mimics the auction's loser-pays rule. If they can't find the implicit penalty, they haven't found the root cause.

  **Misconceptions and Defusal Sequence**
  1.  **"That's just sunk cost fallacy."**
      *   *When:* Immediately after the auction ends, before discussing real projects.
      *   *Defusal:* Do not argue theory. Ask the highest loser: "Did you bid $1.05 to recover the dollar, or to avoid losing the $1.00 you already committed?" Force them to see they were minimizing *future* loss, not recouping *past* loss. Sunk cost looks backward; this trap looks forward.
  2.  **"People were being greedy/irrational."**
      *   *When:* During the Translation phase (35–75 mins).
      *   *Defusal:* When they critique a project lead, ask: "Given the rules we just identified, what was the cost of stopping at Sprint 4 versus Sprint 5?" Show that continuing was the cheaper option under the existing constraints.
  3.  **"We just need more discipline to stop."**
      *   *When:* During Rule Design (75–90 mins).
      *   *Defusal:* Remind them that discipline fails against math. If the rule penalizes quitting more than failing, discipline will always choose failing. Change the penalty structure.

  **To Cap or Not to Cap**
  Let it cross $1.00. The lesson dies if the bill sells for $0.95. Allow bids to reach at least $1.50 to break the "winning" frame. However, cap the maximum bid at $5.00. If bidding stalls below $5, let it naturalize. If it heats up, intervene at $5: "The house is closing the bank." You need them to feel the sting of loss, not the resentment of financial hardship. Collect the money from the top two bidders publicly.

  **What to Leave Out**
  Do not offer behavioral advice. Do not suggest "check-ins," "awareness training," or "empowerment." These imply the problem is human error. Leave out any discussion of individual psychology. The narrative must remain strictly structural: *Rules incentivize behavior; behavior follows incentives.* If you suggest they can "outsmart" the trap with willpower, you validate the idea that the trap is optional.

  **Closing Diagnostic Question**
  "Looking at our current portfolio review process, what specific rule penalizes the team that stops a project more than the team that finishes it late?"
