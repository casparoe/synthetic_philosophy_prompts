      *Correction on #5:* In the standard model, a private signal *never* breaks a cascade once established because the public history outweighs any single signal. It takes a *public* signal or a change in the *structure* (e.g., someone reveals their signal). The user says "public information breaks it and private signals don't." This is correct.

