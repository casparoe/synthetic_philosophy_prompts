      *   *Collapse:* Person 2's inference is trivial (they follow their signal unless indifferent). The critical jump is Person 3. Person 2 just sets the stage.
      *   *Derivation:* Do not make the class derive Person 3's inference from scratch in 40 minutes. It's too math-heavy for a discussion section unless they are math-heavy. Walk them through the *logic* of the inference, maybe plug in numbers together.
