      *   4. *Needs crowd/leader:* True misconception. Address at setup (only need 3 people, equal signals).
      *   5. *Strong private signal breaks it:* **Crucial Point.** The user is correct. In the standard Bikhchandani/Hirshleifer/Welch (BHW) model, a single private signal *cannot* outweigh the public history once a cascade starts. It requires a *public* signal or a change in the public history. However, technically, if the private signal is *stronger* than the prior + public history combined, it could break it, but in the standard binary model with equal signal precision, once the public weight exceeds the private weight, no single private signal breaks it. The user's intuition ("public information breaks it and private signals don't") is the key insight for the climax.
      *   *Ordering:* Address #1 during Person 3's decision. Address #3 at Definition. Address #2 after Cascade Forms. Address #4 at Setup. Address #5 at Climax.
      *   *Missing:* "Cascades are fragile" (small public shock breaks them). "Cascades are inefficient" (information aggregation stops).

  6.  **Evaluate Climax:**
      *   Yes, the fragility/asymmetry (private vs. public) is the best climax. It shows why cascades are dangerous socially.

  7.  **Evaluate Distinguishing Question:**
      *   Needs to test structural understanding, not definition recitation.
      *   Idea: Ask about the value of the 100th person's decision to the 101st. (Answer: Zero information).
      *   Idea: Ask what happens if someone flips a coin.
      *   *Selection:* Ask about the social value of the 100th person's action.

  8.  **Evaluate What to Leave Out:**
      *   Math heavy derivations (probabilities).
      *   Variations (reputation models, payoff externalities).
      *   Real-world empirical evidence (stick to the model logic).

  9.  **Drafting the Response (incorporating constraints):**
