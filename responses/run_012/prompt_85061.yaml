          2.  The Distinction (Justification/Occasion).
          3.  The Example (Fortress/School).
          4.  The Thesis (Applied to Sacrifice).
          5.  The Objection (Permanence/Dispensability).
          6.  Maimonides' Answer (Briefly).
          7.  The Rival Reading (Ending tension).

      *   *Wait, re-reading the prompt on the ending:* "which rival reading to put on the table so that the session ends with the objection rather than the thesis."
      *   This means I should structure it so the *objection* is the final lingering thought, or the rival reading *is* the objection.
      *   Okay, I will position the "Dispensability" reading as the final challenge.

      *   *Re-evaluating the Example:* The user asked about *their* candidates. I must tell them if they are failures. They *are* failures for this specific rhetorical goal because they imply the *practice itself* is the disease. Maimonides argues the *context* is the disease. I need to tell them why and offer a replacement or a strict modification. I will recommend **The Legislator Codifying Custom.** It's closer to the political reality Maimonides describes.

      *   *Re-evaluating the Spine:* Justification vs. Occasion.
      *   Risk: "Occasion" sounds accidental. "Justification" sounds rationalist.
