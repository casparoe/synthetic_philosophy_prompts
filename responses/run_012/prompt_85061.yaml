      *   Will it hold? Yes, provided you don't let "Occasion" slide into "Accident."

      *   *Misconception Mapping:*
          1.  *Reasons = Discarding:* Address immediately in intro.
          2.  *Concession to Weakness:* Address when introducing the Thesis (via the Example).
          3.  *Cultural Origin = Debunking:* Address via the Distinction (Authority vs. Material).
