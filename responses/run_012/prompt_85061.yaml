answer: |-
  ### I. The Spine: Justification vs. Occasion
  **Will it hold?**
  Yes, but only if you define the terms with surgical precision at the outset. The confusion you identified (collapsing the two) is the exact point of failure.
  *   **Justification (Telos):** The divine intent that remains constant (e.g., ordered worship, communal cohesion, turning the heart toward God).
  *   **Occasion (Material):** The historical and psychological substrate available to the legislator at the moment of enactment (e.g., a culture saturated with sacrificial ritual).

  **The Risk:** The word "Justification" sounds apologetic to the skeptical and defensive to the devout. "Occasion" sounds accidental.
  **The Fix:** Frame "Justification" as **Divine Purpose** and "Occasion" as **Human Material**. You must establish that Divine Wisdom works *with* material, not *around* it. If the audience thinks "Occasion" means "Accident," the spine snaps. If they understand "Occasion" as "The only available vessel for the Purpose," the spine holds.

  ### II. The Carrying Example
  **Your Candidates (Parent/Physician):**
  They are failures for *this* session, though Maimonides uses them himself.
  *   **Why they fail here:** Both analogies imply the *practice itself* is pathological. A parent weans a child from milk because milk is for infants; a physician tolerates a vice to cure a disease. If you use these, you confirm the audience's prior: that Maimonides views sacrifice as a spiritual disease God tolerated until the patient was strong enough to quit. This triggers the "concession to weakness" misconception immediately.
  *   **What the example must have:** It must show a **repurposing of structure**, not a **cessation of habit**. It must convey that the *form* was neutral or useful, but the *context* was wrong.
  *   **What the example must lack:** It must lack any implication of divine regret or a teleological goal of abolition.
  *   **Recommended Example:** **The Sovereign who converts a Rebel Stronghold into a Royal Garrison.**
      *   *The Occasion:* A population accustomed to fortified towers for defense/rebellion.
      *   *The Justification:* Establishing royal order and security.
      *   *The Move:* The Sovereign does not raze the towers (which would cause panic/revolt) but occupies them, changes the garrison, and redirects their fire. The structure remains; the allegiance changes.
      *   *Why this works:* It preserves the dignity of the structure (the Law) while acknowledging the historical constraint (the rebellion/habit). It avoids the condescension of the "child" or "sick patient."

  ### III. Sequence and Dependencies
  You cannot state the thesis until the audience accepts that Divine Law operates within history. If you state the thesis first, it sounds like anthropology debunking theology.

  1.  **The Prior (5 mins):** Elicit the assumption that "Reasons = Skepticism." Ask: "If I explain *why* a law exists, have I explained *away* its authority?"
      *   *Dependency:* You must surface this anxiety to disarm it.
  2.  **The Distinction (10 mins):** Introduce **Purpose (Justification)** vs. **Material (Occasion)**. Use the **Stronghold Example**.
      *   *Dependency:* The thesis cannot be understood without this taxonomy. Without it, "historical habit" sounds like "accident."
  3.  **The Thesis (10 mins):** Apply the distinction to III.32. God willed worship (Purpose); the only available material for *this* people at *this* time was sacrifice (Material).
      *   *Dependency:* Now that "Material" is established as a constraint of Wisdom, not a failure of Will, the thesis sounds like sovereignty, not concession.
  4.  **The Objection (15 mins):** Introduce the problem of **Permanence**. "If the Law is bound to a historical occasion, what happens when the occasion passes?" Let this sit. Let them feel the threat: *Does this make the Torah temporary?*
      *   *Dependency:* They must feel the threat before they can appreciate the defense.
  5.  **Maimonides' Answer (10 mins):** Present his reply: The *form* was contingent, but the *discipline* it instilled was permanent. The "Occasion" was the entry point; the "Justification" is the enduring state.
  6.  **The Rival Reading (10 mins):** End here (see below).

  ### IV. Mapping Misconceptions
  Here is where each misconception surfaces and where you must intercept it.

  | Misconception | When it surfaces | Where to head it off | How |
  | :--- | :--- | :--- | :--- |
  | **"Reasons = Discarding"** | **Intro.** | **Component 1 (The Prior).** | Explicitly state: "Explaining the *occasion* of a law is not explaining *away* its authority. We are distinguishing the *vessel* from the *content*." |
  | **"Concession to Weakness"** | **Component 3 (Thesis).** | **Component 2 (The Example).** | By using the **Stronghold** analogy, you frame the constraint as strategic sovereignty, not paternalistic tolerance. Emphasize God *willed* this transition, not *tolerated* it. |
  | **"Cultural Origin = Debunking"** | **Component 3 (Thesis).** | **Component 2 (The Distinction).** | Insist that the *source of authority* is Divine Command, even if the *source of form* is Cultural Habit. Authority does not derive from novelty. |
  | **"Contingency vs. Permanence"** | **Component 4 (Objection).** | **Component 5 (Maimonides' Answer).** | This is the core tension. You must allow the objection to land fully before offering Maimonides' distinction between the *ritual act* (historical) and the *habit of obedience* (eternal). |
  | **"Sacrifice is Dispensable"** | **Component 6 (End).** | **Do not resolve.** | Leave this as the open tension (see below). |

  ### V. The Ending: Objection over Thesis
  **The Rival Reading:**
  End with the **Radical Historical-Critical Reading**: *"If Maimonides is right that sacrifice was only for that specific historical occasion, and that occasion has passed, is not the commandment now functionally dead, regardless of what Maimonides says about permanence?"*

  **Why this ending:**
  You want the session to end with the objection rather than the thesis because the *Guide* is meant to perplex, not merely to settle. If you resolve the permanence question too neatly, the secular attendees will feel you whitewashed the history, and the devout attendees will feel you undermined the eternity of the Law. Leaving the tension between **Divine Timelessness** and **Historical Particularity** unresolved honors the complexity of the text and the diversity of your room.

  **What to Refuse to Explain:**
  Refuse to explain **Maimonides' Hierarchy of Commandments (Guide III.26–28).**
  *   *Say openly:* "Maimonides distinguishes between commandments that are 'useful' and those that convey 'truth,' and places sacrifice in a specific category of utility. We are not going into that taxonomy today. We are staying strictly with the historical argument of Chapter 32. To bring in the metaphysical hierarchy now would confuse the historical point we are making."
  *   *Why:* Introducing the "utility vs. truth" distinction invites the "dispensability" argument too early and drags you into medieval metaphysics that will lose the audience.

  ### VI. The Closing Question
  Do not ask: "What was Maimonides' view on sacrifice?" (Tests recitation).
  Do not ask: "Do you agree with him?" (Tests opinion).

  **Ask this:**
  > "If the **Occasion** (the historical habit) vanished, but the **Justification** (the need for disciplined worship) remained, does the Law require a new vessel, or does the Justification rest?"

  *   **If they hold the distinction:** They will hesitate. They will see that Maimonides argues the *discipline* remains even if the *vessel* is paused (hence prayer replacing sacrifice), but they will recognize the tension.
  *   **If they merely recite the thesis:** They will answer immediately, "He says it's over," or "He says it's eternal," missing the nuance that the *form* is contingent while the *obligation* is not.
