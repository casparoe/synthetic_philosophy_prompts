  A Taurekian lifeguard stands between a drowning man and a drowning group of five. "I refuse to count you," he tells the five. "I'll give each individual a one-in-six chance." He rolls a die. The single man rolls a six and is saved. The five roll ones through fives and drown. The lifeguard turns to the crowd. "See? I didn't save the greater number. I just saved the luckier individual." A mathematician shouts, "But over time, you'll save the five five-sixths of the time!" The lifeguard plugs his ears. "Don't say 'over time'! That's just the numbers sneaking back in!"

  The punchline trades on your insight that long-run probabilities (frequencies) inevitably reintroduce the aggregation Taurek tries to avoid—making the "numbers" return via statistics even if you ban them from the decision.
