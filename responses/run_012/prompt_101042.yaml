      *   **The Human Element:** Introduce the man on death row (30 years). He's not a symbol. He's tired. The state wants him to perform even now.
      *   **The Victims/Families:** Address the pain. The state tells them justice looks like this performance. But does it heal? Or does it just complete the ritual?
      *   **The Bill (LWOP):** Address the shift. Is LWOP perfect? No. Devi's point (jailers vs. executioners) is valid. But there's a difference between locking someone away and demanding they die well. One is containment, the other is sacrament. We stop being the authors of death.
      *   **Closing:** Bring it back to the room. What do *we* become?
      *   **The Takeaway:** The required final sentence.

  5.  **Refining the Tone:**
      *   Avoid preachiness. Use "we" instead of "you."
