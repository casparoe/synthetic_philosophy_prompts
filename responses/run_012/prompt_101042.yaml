      *   **Timing:** 8 minutes (after main course).
      *   **Tone:** Cannot lecture, cannot guilt, cannot invalidate victims' families' anger. Needs to be authentic, not academic.
      *   **Core Argument:** The problem isn't just the pain of execution, but the *demand* it makes. The state requires the condemned to be "dignified" (walk on own feet, be brave), and this demand corrupts everyone involved ("what we become").
      *   **Constraints:**
          1.  Must address the upcoming bill (Death Penalty -> Life Without Parole). Must not pretend LWOP is humane. Must address Devi's counter (LWOP makes us jailers instead of executioners).
          2.  Must acknowledge a specific man on death row (30 years) as a person, not a symbol.
          3.  No direct Camus quotes (risk of misquoting).
          4.  Last line must be a single sentence starting with "Takeaway:" that sums up the argument.
      *   **Length:** 8 minutes spoken is roughly 1000-1200 words (average speaking pace is 130-150 wpm).

  2.  **Deconstruct the Core Argument:**
      *   *The Demand:* The state asks the condemned to participate in their own erasure with composure. We call this "dignity," but it's actually compliance.
      *   *The Corruption:* This demand extends to everyone. The executioners, the witnesses, the society that sanctions it. We become people who require this performance.
      *   *The LWOP Pivot:* If the argument is about "what we become," does LWOP solve it? Devi says no (jailers vs. executioners). The speech needs to navigate this. It can't claim LWOP is perfect, but it must argue it removes the specific *ritualistic demand* of state killing. It stops the state from requiring a performance of death.
      *   *The Person:* There's a man waiting. 30 years. He's not a prop. He's human. The speech needs to ground the philosophy in his reality without exploiting him.

  3.  **Audience Management:**
      *   *Veterans:* Acknowledge their work, don't pretend to be the expert. Admit the complexity.
      *   *Victims' Families:* Validate grief/anger. Don't say "your anger is the problem." Say "the state weaponizes your grief."
