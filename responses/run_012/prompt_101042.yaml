answer: |-
  Good evening. Thank you for eating, for being here, and for tolerating the fact that I am speaking after the main course. I know the rule of events like this: the longer the speech, the colder the coffee. I promise to be brief, but I also promise not to be easy.

  Looking around this room, I see people who have been fighting this fight longer than I've been alive. You know the case law, you know the statistics, and you certainly know Camus better than I do. I also see people who are new to this work, some who are here because a loved one was taken from you, and some who are here because you're still weighing the cost of justice. I am not standing here to lecture the veterans, and I am not standing here to tell the grieving that their anger is wrong. Grief is not a problem to be solved. It is a reality to be endured.

  But there is a specific mechanism of the death penalty I want us to look at tonight. We often talk about the pain of execution. We talk about botched injections, about the fear, about the innocence of the condemned. Those things are horrifying. But there is something else, something quieter, that happens even when the execution goes "perfectly."

  The state demands a performance.

  When an execution is scheduled, the state requires the condemned man to walk to the gurney on his own feet. We say this is for security, but it is also for something else. We want him to be calm. We want him to be brave. If he collapses, if he screams, if he has to be dragged, the witnesses are traumatized. The machinery jams. So, we ask him to participate in his own erasure with composure. And when he does, when he walks those final steps without falling apart, we call it dignity.

  But it is not dignity. It is compliance. It is the state asking a human being to make our conscience easier by dying neatly.

  There is a man on death row right now whose case is central to the bill we are endorsing this week. He has been there for thirty years. He is not a symbol. He is not a prop for our morality. He is a person who has grown old in a cage. He has gray hair now. He has ailments. The state is asking him to do more than just die; it is asking him to die well. It is asking him to validate the process that kills him.

  And here is the hard part, the part that keeps me up at night: that demand isn't just for him. It is for us.

  When we sanction this, we become people who require that performance. We become a society that needs the condemned to be brave so that we can feel justified in killing them. We outsource our violence, but we keep the ritual. We want the closure without the bloodstains. We want the finality without the mess.

  Now, I know where the hard questions start. The bill on the table swaps the death penalty for life without parole. I am not going to stand here and tell you that life without parole is humane. It is not. It is a lifetime of confinement. A friend of mine argued to me recently that if our objection is really about what we become, then life without parole just makes us jailers instead of executioners. She is right. It is a brutal sentence. It is a life ended in slow motion.

  But there is a distinction, and it matters.

  Execution is an active ritual. It requires the state to reach out and stop a heart, and in doing so, it requires the condemned to help them do it. It creates a relationship between the killer and the killed that is intimate and corrupted. Life without parole is containment. It is ugly, it is harsh, and it leaves much to be desired regarding how we treat the incarcerated. But it does not demand that the prisoner walk to his death. It does not ask him to validate the state's power with his final breath. It stops the state from claiming that killing is a form of healing.

  To the families in the room who have lost someone to violence: The state tells you that this ritual offers closure. It tells you that your grief requires a specific ending, one that only the state can provide. But no execution can bring anyone back. No performance of death can restore a life. By ending this, we are not saying the crime was acceptable. We are saying that the state should not be in the business of demanding that the accused help them kill him so that we can all sleep better.

  We are veterans, donors, family members, and skeptics. We are not a monolith. But we are all implicated in what we allow the state to do in our name. If we remove the death penalty, we do not solve the problem of punishment. We do not solve the problem of violence. But we stop asking people to die with composure so that we don't have to look at the violence too closely.

  We stop making them responsible for our conscience.

  Takeaway: Abolition is not just about saving the condemned from pain, it is about refusing to let the state demand their compliance in their own killing to soothe our collective conscience.
