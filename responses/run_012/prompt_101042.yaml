      *   *Self-Correction on LWOP:* Devi's counter is strong: LWOP makes us jailers. The speech needs to answer this. The answer is: Being a jailer is terrible, but being an executioner requires a specific lie about dignity and closure that jailering does not. Execution demands a *performance* of justice. LWOP is just punishment. It's ugly, but it doesn't demand the condemned participate in their own end.
