answer: |-
  Elena works at a small architectural firm where the team is struggling to finalize a zoning proposal due by Friday, a delay that will cost the firm a bonus shared among all staff and force her colleagues into weekend labor. Elena possesses a personalized library of pre-drafted compliance templates she developed over years on her own time using her own software, which she typically uses only to speed up her personal workflow. Sharing these templates via the server would take her ten minutes and would guarantee the team meets the deadline, securing the bonus for everyone and relieving their collective stress, while withholding them means she finishes her section quickly but her colleagues must work late nights to compensate. The templates remain her exclusive intellectual property under her contract, and no one else has access to them unless she voluntarily uploads them to the shared drive.

  **Analysis**

  **The Act and Alternative**
  The act in question is Elena uploading her personal template library to the firm's shared server. The permissible alternative is Elena withholding the templates and completing only her assigned portion of the work using her private tools.

  **Theoretical Verdicts**
  An **Act-Consequentialist (AC)** must verdict this act as **obligatory**. For AC, the moral status of an act is determined solely by its outcome relative to available alternatives. The benefit (team bonus, avoided exhaustion) vastly outweighs the cost (ten minutes of effort). Because the cost is negligible, the "demandingness" objection cannot apply; AC does not recognize rights or entitlements as intrinsic moral barriers to utility maximization. Therefore, omitting the act is suboptimal and morally wrong.

  A **Kantian-style Deontologist** (who accepts supererogation via the distinction between perfect and imperfect duties) verdicts the act as **supererogatory**. While there is an imperfect duty of beneficence to help colleagues, this duty operates within the constraints of perfect duties regarding rights and property. Elena is an end-in-herself with rightful possession of her intellectual property. The entitlement to dispose of her own property as she sees fit grants her latitude; she *may* fulfill beneficence by sharing, but she is not *required* to surrender her rightful means to serve others' ends. The optionality is generated not by the cost (which is low), but by the boundary of her entitlement.

  **The Divergence**
  The theories part ways specifically over the **entitlement**, not the cost. Both theories agree the cost is negligible. AC ignores the entitlement, rendering the act obligatory. Kantianism weights the entitlement as a moral constraint on beneficence, rendering the act optional. If the divergence were based on cost, the Kantian would argue the ten-minute effort is somehow burdensome; instead, the Kantian argues the effort is irrelevant because the resources belong to Elena.

  **Contrast Case**
  Imagine a nearly identical scenario where the templates were created during billable hours using firm software, making them **work-for-hire property of the firm**.
  *   **Act-Consequentialist:** Still **Obligatory**. The utility calculation remains unchanged (high benefit, low cost).
  *   **Kantian:** Now **Obligatory**. The entitlement variable has shifted. The templates are no longer Elena's to dispose of; they are company resources entrusted to her. Withholding them would violate a perfect duty of honesty and contractual fidelity.
  *   **Result:** Since the AC verdict remains constant while the Kantian verdict flips from optional to obligatory solely based on the change in ownership, the entitlement is confirmed as the feature doing the explanatory work for the deontological optionality.

  **Honest Note**
  If the entitlement feature is removed—for instance, if the firm operates as a cooperative with a standing norm that all tools are communal—the Kantian loses the ground for optionality. Without a property right to shield her, the duty of beneficence may collapse into a specific duty to help in this instance, making the act obligatory even for the deontologist. A defender of Act-Consequentialism would attack this construction by arguing that property rights are merely social heuristics for maximizing long-term utility. They would claim that in a clear, low-cost, high-benefit case like this, the heuristic should dissolve, and insisting on the entitlement is "rule fetishism" that privileges abstract rights over concrete human welfare.
