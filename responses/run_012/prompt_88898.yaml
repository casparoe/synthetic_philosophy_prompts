prompt: |-
  Ok so bit of an odd request. I've somehow ended up being the person who runs the hardship fund for our mutual aid group — we're small, there's about £4k in the account, and I'm the one who decides who gets what when people ask. It's usually two or three requests a month. I dont have any training for this. I'm a bike mechanic. I've been doing it since March and I've realised I'm basically asking myself "would a reasonable person be fine with this" and then doing whatever I'd already decided to do anyway. My mate Dan, who did a philosophy module at the OU before he dropped out, said I should be using Adam Smith's impartial spectator — the idea in his ethics book (the one about sentiments, not the Wealth of Nations one) where you imagine how what you're doing would look to a spectator who knew all the facts and had no stake in it. Which sounds right but I have no idea how to actually do it at a desk on a Tuesday with an application form in front of me.

  So: can you turn the impartial spectator into an actual procedure I can run? The questions in order, what counts as a good answer at each step, where it stops with a no, and where it stops and hands the decision to someone else because I'm not the right person to make it. I'm not trying to be clever, I want something I can do in 20 minutes with a coffee, and I'd rather it be honest about its limits than pretend it's mechanical.

  Some things it needs to handle, because they're the ones that trip me up:

  - Some requests are "I can't pay my rent this month" and some are "I spent my rent money on something stupid and now I can't pay my rent." I have a strong instinct that those are different, and I don't know if Smith thinks they're different or if I'm just being judgy.
  - Some applicants are people I know well; one of them is my brother-in-law. I've told myself I'm being extra strict with him to compensate, which I'm pretty sure is also a way of being biased.
  - I keep noticing I give more to people who say thank you nicely in the group chat. That seems bad.
  - Smith apparently thought actual onlookers are unreliable anyway, because we all admire rich and successful people too much and it messes with our moral judgement, so I don't think I can just ask the group what they think and call it impartial.
  - I also want to know if the impartial spectator is really just "what would a neutral person think," because if it is, I don't see how it's any better than what I'm already doing. My suspicion is it's something more specific to do with feelings and I've got it wrong.

  Please dont send me reading lists or tell me to go and read the book — I won't, and I couldn't get hold of it anyway. And if you think the whole framing is wrong for this job, say so, I'd rather know now.

  Format I'd like:

  - Bottom line: 2-3 sentences on whether this can be turned into a checklist at all, before anything else.
  - The procedure: the main thing — numbered steps in the order I'd actually do them, with what a good answer looks like at each step, and where a step can end the process. Roughly 700-900 words.
  - Two runs: run it on (a) a single mum who wants £300 for a school uniform, whose last two requests I approved, and (b) my brother-in-law, who wants £600 for a deposit after losing his job but who also owes me £200 from last year. Tell me what the procedure spits out even where that's a no. About 400 words.
  - Where it breaks: the cases it can't settle, the ones where I should hand off to someone else, and how I'd know I'm in one of those. About 250 words.
  - What I've probably got wrong about Smith: 3 or 4 bullets, short.

  Plain English please, no jargon without explaining it. I'm definately out of my depth here.
