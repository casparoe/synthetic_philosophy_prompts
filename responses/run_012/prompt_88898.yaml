answer: |-
  Bottom line: Yes, this can be a checklist, but not a mathematical one. It is a tool to steady your emotions, not replace them. The goal isn't to remove your humanity, but to ensure your feelings match the facts rather than your personal relationships or moods.

  ### The Procedure

  **Step 1: The Cold Facts**
  Write down the request without any names or history. Just the need, the amount, and the cause.
  *   *Question:* If I stripped away the person's name and our history, what exactly is broken here?
  *   *Good Answer:* "Rent arrears due to job loss" or "Uniform cost due to growth."
  *   *Stop:* If the facts are unclear, pause and ask for clarification. Do not proceed on assumptions.

  **Step 2: The Bias Check**
  Look at the name you removed. What is your relationship?
  *   *Question:* Do I have a stake in this outcome beyond the fund's rules? (e.g., family, debt, friendship, annoyance).
  *   *Good Answer:* "I know them, but I have no financial or emotional stake in the outcome."
  *   *Stop:* If you are owed money by them, or they are immediate family, you must hand this off. The Spectator cannot be a player in the game. If you proceed, you are judging your own interests.

  **Step 3: The Spectator Test (The Core)**
  Close your eyes. Imagine a person who knows all the facts from Step 1, has no stake from Step 2, but is fully human and kind. They are not a robot; they feel pain when they see suffering.
  *   *Question A (Cause):* Would this spectator feel the applicant's distress is justified?
      *   *Good Answer:* "Yes, the distress comes from bad luck (illness, job loss)."
      *   *Bad Answer:* "Yes, even though they gambled the money, I feel sorry for them." (The spectator sympathizes less with self-inflicted harm).
      *   *Stop:* If the spectator would feel the distress is wholly due to recklessness without remorse, you can decline. Smith argues we sympathize less with imprudence than misfortune.
  *   *Question B (Performance):* Would the spectator care how nicely they asked?
      *   *Good Answer:* "No. The spectator looks at the need, not the gratitude."
      *   *Stop:* If you are leaning yes because they were polite, or no because they were rude, reset. The spectator ignores performance.
  *   *Question C (Proportionality):* Would the spectator feel this amount is appropriate to fix the problem?
      *   *Good Answer:* "£300 fixes the uniform. £600 fixes the deposit."
      *   *Stop:* If the amount exceeds the need (e.g., asking for rent plus a new TV), adjust down to what the spectator deems proper.

  **Step 4: The Fund's Health**
  The Spectator also cares about the group's future, not just the individual.
  *   *Question:* If I give this, can the Spectator justify saying yes to the next person who comes along?
  *   *Good Answer:* "Yes, £4k can absorb £300." or "No, we are below £1k and need to reserve for emergencies."
  *   *Stop:* If the fund is critically low, the Spectator prioritizes the collective survival over individual aid.

  **Step 5: The Decision & Record**
  Write down the decision and one sentence explaining why, using the Spectator's voice.
  *   *Good Answer:* "Approved. Misfortune, not imprudence. Fund sustainable."
  *   *Bad Answer:* "Approved. He's a good bloke."
  *   *Why:* This creates a trail. If you look back in six months, you can see if you were consistent.

  ### Two Runs

  **(a) The Single Mum (£300 Uniform)**
  *Step 1:* Need: Uniform. Cause: Child growth. Amount: £300.
  *Step 2:* No personal stake. Previous approvals noted but irrelevant to current need.
  *Step 3:* Spectator sees distress as justified (child's education/social inclusion). Cause is neutral (growth), not reckless. Gratitude in chat is ignored; need remains. Amount is proportional to the item.
  *Step 4:* Fund has £4k. £300 is 7.5%. Sustainable.
  *Verdict:* **Approve.** The Spectator sympathizes with the child's need regardless of previous help. Consistency matters; denying now because she asked before would punish reliability.

  **(b) The Brother-in-Law (£600 Deposit)**
  *Step 1:* Need: Housing deposit. Cause: Job loss. Amount: £600.
  *Step 2:* Relationship: Brother-in-law. Personal Stake: He owes you £200.
  *Verdict:* **Recuse/Hand Off.** Step 2 stops this immediately. You cannot be the Impartial Spectator here. You are a creditor and a relative. Even if you feel you are being "extra strict," you are still reacting to the relationship, not the facts. If no one else exists to decide, you must declare the conflict in the records and justify the decision against the written rules, not your feelings. If you must decide: The debt complicates the "no stake" rule. The Spectator would ask: "Is this aid or debt relief?" If the £600 implicitly covers the £200 owed to you, it is biased. You should deduct the £200 from the aid or require repayment first.

  ### Where it Breaks

  This procedure fails when your emotions are too hot or too cold. If you are angry at the group, or in love with an applicant, the Spectator becomes a puppet for your mood. You will know this when you find yourself writing justifications that feel like lawyerspeak rather than honest reasoning.

  It also breaks when the fund's rules are vague. If you don't know if "recklessness" disqualifies someone, the Spectator can't judge merit. You need a basic policy (e.g., "No aid for gambling debts") so the Spectator has a law to apply.

  Finally, it breaks if you are the only decision-maker forever. The Spectator is internal, but it needs external calibration. If you find yourself constantly unsure, you need a second person to review your "Step 5" notes. If you can't explain the decision to Dan without feeling ashamed, the Spectator wasn't truly impartial.

  ### What I've Probably Got Wrong About Smith

  *   **Neutral vs. Impartial:** You thought it meant "neutral robot." Smith means "impartial human." The Spectator has feelings, but they are calibrated feelings, not cold logic.
  *   **Sympathy is Key:** It's not just about judging actions; it's about whether you can "enter into" the person's feelings. If you can't feel their pain because they caused it themselves, aid is less justified.
  *   **Merit Matters:** Smith distinguishes between those who deserve reward (or help) and those who don't based on their motives, not just their outcomes. Need alone isn't enough; the cause of the need matters.
  *   **It's Internal:** The Spectator isn't a real person you ask. It's a conscience you build inside yourself to judge your own conduct as if you were someone else.
