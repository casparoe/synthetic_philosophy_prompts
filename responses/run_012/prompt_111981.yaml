  And don't tell me she's using the "same machinery." If her machinery dictates that Knowledge X leads to Action Y, and Action Y yields lower utility than Action Z—which she would have taken without Knowledge X—then her machinery is broken. It's time-inconsistent. Ex ante, she prefers not to know. Ex post, she acts on knowing. That's not a refutation of Bayesian decision theory; that's a textbook case of akrasia. The theorem says a rational agent won't pay to shred the file unless the act of shredding itself provides utility—like peace of mind. But you're insisting the info *itself* is toxic. It's not the info; it's her inability to process it without crashing. Blame the processor, not the data.
