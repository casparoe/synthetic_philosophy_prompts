  2.  **Deconstruct the *Meno* Problem:**
      *   *Core Question:* Why is knowledge (*episteme*) more valuable than true opinion (*doxa*)? Both guide action correctly (e.g., knowing the way to Larissa vs. guessing the way correctly).
