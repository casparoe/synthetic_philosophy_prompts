answer: |-
  The crux is separating mathematical mapping from physical motion and ancient intuitions about parts and wholes.

  **The Question**
  Hilbert's Hotel claims a full infinite hotel can host a new guest by shifting everyone up one room. But if every guest moves, does the shifting ever finish? Or is the story only about numbers, not people? Explain which of these three actually makes the hotel work: (1) matching guests to rooms, (2) the physical act of moving, or (3) rejecting the idea that a whole must be bigger than its part. Which one is essential, and which ones are distractions?

  **Model Answer**
  The worry that the clerk never finishes is correct if we treat this as a physical task (b). In reality, no one can complete an infinite series of moves. However, Hilbert's Hotel isn't a story about logistics; it's a thought experiment about definition (a).

  The core claim is purely about matching. If every guest in Room *n* is assigned to Room *n+1*, Room 1 becomes free. Mathematically, this works instantly because it describes a state change, not a process. We aren't waiting for the last guest to move; there is no last guest. The mapping exists all at once. So, (b) is a distraction. The hotel story doesn't need anyone to actually walk down a corridor. It relies on correspondence, not motion.

  This leaves (c). Our intuition says the whole (all rooms) must be bigger than the part (rooms occupied after shifting). This is true for finite sets. Hilbert's Hotel forces us to drop this rule for infinite sets. If we keep the rule that "whole > part," the hotel is impossible. If we accept that infinite wholes can equal their parts, the hotel works logically. This is the shift from Euclid's common notion to Dedekind infinity.

  So, (a) is the engine: one-to-one correspondence shows the count hasn't changed. (c) is the casualty: we sacrifice the ancient mereological principle. (b) is the trap: imagining physical motion introduces time and completion where only logic matters. The hotel works as a conceptual tool to show that infinity breaks the "whole > part" rule, not to show how a manager handles bookings. If you insist the clerk must finish moving, you are demanding physical reality from a logical definition. The story holds because the mapping holds, regardless of whether anyone lifts a suitcase. The paradox bites only when we confuse the map (math) with the territory (physics).

  **Marking Scheme (Out of 20)**

  **Award 5 marks each for:**
  1.  Identifying matching (a) as the logical engine rather than physical movement.
  2.  Dismissing physical motion (b) as irrelevant to the mathematical claim.
  3.  Identifying "whole > part" (c) as the specific intuition being sacrificed.
  4.  Resolving the "completion" worry as a category error between logic and physics.

  **Deduct 5 marks for each of the following mistakes:**
  *   Claiming infinity comes in different sizes (this is Cantor's diagonal argument, not Hilbert's Hotel).
  *   Arguing physical impossibility invalidates the mathematical claim.
  *   Arguing the hotel proves physical infinity exists in reality.
  *   Treating the three elements (matching, motion, mereology) as identical rather than distinct.
