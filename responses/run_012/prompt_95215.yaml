  3.  **Evaluate Claims against Foucault Scholarship:**
      *   *Claim 1 (Power/Knowledge):* Generally accepted, though nuanced. Power produces knowledge; knowledge induces effects of power. Not just "independent," but co-constitutive.
      *   *Claim 2 (Institutions/Truth):* Mostly accepted, but "fixed by" is too deterministic. It's about regimes of truth.
      *   *Claim 3 (Power is all there is):* **Major Distortion.** Foucault explicitly denied being a pan-powerist. Power is everywhere *because* it is produced from everywhere, not because it is an all-encompassing substance. There is no "outside" to power, but that doesn't mean power is the *only* thing (ontologically). It means relations of power are immanent to other relations (economic, sexual, etc.).
      *   *Claim 4 (Individual manufactured):* Accepted (Subjectivation). The subject is constituted through practices.
      *   *Claim 5 (Liberation is symptom):* **Distortion/Nuance.** Foucault was skeptical of "liberation" as a return to a pre-power state, but he definitely advocated for resistance, practices of freedom, and ethics of the self (especially later work). He didn't say resistance is futile or merely symptomatic; he said resistance is co-extensive with power.
      *   *Claim 6 (Discipline and Punish):* Generally accepted summary of *Discipline and Punish*.
      *   *Claim 7 (Performative Contradiction):* **Contested.** This is the standard "self-refutation" critique. Foucault's response (and defenders') is that he is offering a *toolkit*, not a universal theory of truth. He isn't claiming "True Truth" but analyzing how truth claims function. Also, if power is productive, his books can be a move in the game that *changes* the game (resistance), not just a contradiction.
