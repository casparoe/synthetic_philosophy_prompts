answer: |-
  Your friend has actually rediscovered one of the most famous results in the history of twentieth-century philosophy of science, so you are right to feel that there is genuine weight behind the argument rather than it being a mere trick. What you are describing is essentially the Tichý-Miller theorem, published independently in nineteen seventy-four, which demonstrated exactly what your friend claims: that Karl Popper's original content-based definition of verisimilitude collapses when comparing two false theories. Your intuition that this proves too much is spot on, and your map analogy is precisely the kind of counterexample that suggests the definition is too coarse-grained rather than the concept of truthlikeness being bankrupt. The problem lies specifically in premises one and two, which adopt Popper's strict logical containment model, and dropping those is the standard move required to save the phenomenon of scientific progress.

  The core issue with the content-based definition is that it treats all true sentences as equally valuable and all false sentences as equally detrimental, without regard for how similar the false sentences are to the truth. In Popper's framework, a theory is just a set of sentences, and if you add any false sentence to a theory, you increase its falsity content. Since most false theories in science are false because they make specific claims that are slightly off rather than wildly insane, any attempt to increase truth content by making more specific claims inevitably risks adding new false consequences. As your friend noted, if theory A is false, it entails itself, and if theory B does not entail A, then A counts as a piece of falsity content unique to A. This creates a situation where increasing the informativeness of a false theory almost always increases its falsity content in a way that violates the strict conditions of premise two. This is why the definition works fine for comparing true theories or comparing a true theory to a false one, but it fails precisely where we need it most: comparing two false theories to see which is better.

  To fix this, you do indeed need to abandon the idea that verisimilitude is fixed solely by the set of true and false sentences entailed by a theory. Instead, you move toward what are called similarity-based accounts, which is what your seminar colleague was gesturing at with the possible worlds idea. On this view, a theory is not just a list of sentences but a description of a set of possible worlds, and truthlikeness is measured by the average distance or similarity between the worlds allowed by the theory and the actual world. This allows you to say that a theory is false but still close to the truth because the world it describes is very similar to the actual world, much like a map with a slight scale error is still more accurate than a map that puts Paris in Australia. This solves the problem of your friend's argument because it allows you to weigh errors; a small error counts less against verisimilitude than a large error, whereas Popper's definition counts any false sentence as equally damaging.

  However, your worry about this solution merely relocating the problem is also well-founded and represents the main cost of making this switch. By moving to a similarity metric, you inherit the burden of explaining what makes one possible world closer to another than a third world is. You need a metric of similarity that is objective enough to ground scientific progress but not so arbitrary that it becomes vague. The challenge here is that similarity is often language-dependent; if you describe the world using different predicates, the distance between worlds can change. For example, if you define properties in terms of "green" and "blue" versus "grue" and "bleen," the similarity relations between states of affairs might shift, potentially making a worse theory look better. This means you have to commit to the idea that there is a privileged way of carving up the world into properties and features that reflects the actual structure of reality, which is a significant metaphysical commitment.

  So if you give up the content-based definition, what you get in its place is a nuanced account that aligns much better with scientific practice, allowing you to say legitimately that Newtonian physics is closer to the truth than Aristotelian physics because the models Newton uses are structurally more similar to the actual behavior of medium-sized objects, even if both are strictly false. The cost you inherit is the need to defend a specific theory of properties and similarity metrics against charges of subjectivity or language dependence. You have to argue that there is an objective likeness between properties that isn't just in the eye of the beholder or dependent on our choice of vocabulary. This is not a trivial cost, but most philosophers of science consider it worth paying because it preserves the realist intuition that science accumulates knowledge and improves its grip on the world, rather than just swapping one false story for another incommensurable false story.

  Ultimately, you should feel comfortable rejecting premise one and two not because verisimilitude is impossible, but because Popper's specific formulation was too rigid to capture the graded nature of approximation. Your map analogy holds up because maps are evaluated by spatial similarity, not by counting the number of correct and incorrect statements printed on them. By adopting a similarity-based account, you accept that measuring distance from the truth is harder than counting sentences, but it is not impossible. You avoid the nihilistic conclusion that progress is an illusion, but you must remain vigilant about how you define the features of the world that determine similarity. This keeps the door open for realism and progress while acknowledging that the logic of scientific improvement is more complex than simple entailment relations.
