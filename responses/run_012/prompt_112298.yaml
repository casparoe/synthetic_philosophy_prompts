answer: |-
  It is excellent that your philosophical instincts are tingling; you have spotted two of the most common misconceptions about Moore in popular literature. Your intuition is correct: while the summary captures the *spirit* of how the Bloomsbury Group *received* Moore, it is not always accurate to Moore's actual texts (specifically *Principia Ethica*, 1903).

  Here is a sentence-by-sentence breakdown of how a Moore scholar would react.

  **1. "Moore thinks the two great intrinsic goods are the appreciation of beauty and personal affection."**
  *   **Scholar's Reaction:** **Accept (with nuance).**
  *   **Analysis:** This is the core of Moore's "Ideal Utilitarianism." In Chapter VI of *Principia Ethica*, Moore argues that the greatest goods are "the pleasures of human intercourse and the enjoyment of beautiful objects." However, a scholar would nitpick the phrasing. Moore is careful to say it is not the *object* itself, nor the *emotion* alone, but the **consciousness** of the beautiful object or the **consciousness** of the affection that constitutes the good. The summary is close enough for a popular book, but technically, it is the *state of mind* directed at these things that holds the value.

  **2. "He's clear that these are good in themselves, not just for the pleasure they bring, and that a whole made of them can be more valuable than the sum of its parts."**
  *   **Scholar's Reaction:** **Accept.**
  *   **Analysis:** This is accurate. Moore explicitly argues against Hedonism (the idea that pleasure is the *only* intrinsic good). He insists that while pleasure often accompanies these goods, it is not what makes them good. Furthermore, the second half of this sentence correctly identifies Moore's famous **Principle of Organic Unities**. Moore argues that the value of a whole (e.g., consciousness of beauty) is not necessarily the sum of the value of its parts (consciousness + beauty). This is a distinctively Moorean doctrine.

  **3. "But he's a bit of a Platonist about beauty: he thinks a beautiful world with no one to appreciate it is just as valuable as one with people in it, since beauty is an objective property."**
  *   **Scholar's Reaction:** **Wrong.**
  *   **Analysis:** This is the most significant error in the summary. Moore explicitly discusses this scenario in *Principia Ethica* (§§112–113). He asks us to imagine two worlds: one supremely beautiful, one utterly ugly, neither containing any human beings. Moore admits the beautiful world is *better* than the ugly one. **However**, he insists that the difference in value is **infinitesimal** compared to a world where a human being *contemplates* that beauty.
      For Moore, the vast majority of ethical value resides in the *conscious appreciation*, not the objective property alone. To say the unappreciated world is "just as valuable" as one with people in it contradicts his central claim that the "consciousness of beauty" is the primary intrinsic good. He is not a Platonist in the ethical sense; he does not believe the Form of Beauty saves the world without a mind to perceive it.

  **4. "And his naturalistic fallacy is basically Hume's is-ought gap: you can't derive an ought from an is."**
  *   **Scholar's Reaction:** **Wince.**
  *   **Analysis:** This is a very common simplification, but technically inaccurate. Hume's "Is-Ought" problem is about **logical inference** (you cannot logically derive a normative conclusion from purely descriptive premises). Moore's "Naturalistic Fallacy" is about **definition and meaning** (you cannot define the simple, non-natural property 'good' in terms of natural properties like 'pleasure' or 'desired').
      While they are related (both block certain moves in meta-ethics), they are not the same. Moore's argument relies on the "Open Question Argument" (it always makes sense to ask, "Is pleasure really good?"), whereas Hume's is about the structure of syllogisms. Conflating them is standard in pop-philosophy, but a scholar would correct it.

  ### Specific Notes on Your Concerns

  **The "Beautiful World" Claim:**
  You were right to be unsure here. This is the specific thought experiment Moore uses to show that while objective beauty has *some* value, **consciousness** is the necessary multiplier for ethical value. The Bloomsbury Group (especially Virginia Woolf and Roger Fry) often leaned more toward the aesthetic realism described in your book, but that was their *interpretation* of Moore, not Moore's actual view.

  **The "Naturalistic Fallacy" Claim:**
  You were also right to doubt this equation. While Moore agrees with Hume that you can't get an 'ought' from an 'is', his "Fallacy" is specifically about the **indefinability of 'good'**. If you define 'good' as 'pleasure', Moore says you have committed the Naturalistic Fallacy. If you argue 'people desire X, therefore they ought to desire X', that is closer to Hume's gap. They are cousins, not twins.

  Verdict: Mostly fair, but with significant technical errors.
