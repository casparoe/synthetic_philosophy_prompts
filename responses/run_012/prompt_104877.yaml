  **The Scene**

  The kitchen light hummed, a low fluorescent buzz that seemed to press down on the table. Arthur slid the check across the laminate surface. The amount was typed clearly: $50,000.00.

  Charles didn't touch it immediately. He looked at Arthur, then at the folder between them containing the funeral program draft. "You're sure," Charles said. "It's not too late to change the lineup. I can step back."

  "Don't be stupid," Arthur said. He was wearing a suit jacket over a t-shirt, the collar sweat-stained. He tapped the check. "You knew Dad longer than I did. You worked the site with him for twenty years. I've been in Chicago for a decade. You're the one who should be speaking."

  "It's not about who knew him," Charles said. "It's about who belongs to him. People expect the son."

  "People expect a lot of things. They want a show. You'll give them a better show. And I need the liquidity for the venture capital call. This solves both problems." Arthur picked up a pen, hovered it over the consent form waiving his exclusive right to manage the memorial service, and signed. His signature was quick, jagged.

  Beatrice stood by the sink, drying a plate that was already dry. She didn't turn around. The water was off, but she kept rubbing the cloth against the ceramic, a soft, rhythmic scrape.

  "I'll make it good," Charles said, finally picking up the check. He folded it once, twice, and put it in his pocket. "I'll make sure he's honored."

  "I know," Arthur said. He stood up and walked out of the kitchen, past his sister, without touching her shoulder. The screen door slapped shut behind him. Beatrice stopped rubbing the plate. She set it down on the counter, whole and unbroken, and turned off the light.

  ***

  **The Accounting**

  **1. The Proposition**
  Arthur (the son) sells to Charles (the father's longtime business partner) the exclusive right to deliver the eulogy and manage the memorial service for Arthur's deceased father. The price is $50,000. Arthur believes he is optimizing a logistical burden and securing capital for a business venture; he views the eulogy as a service output. Charles believes he is honoring a mentor and relieving a grievinɡ friend of a public burden; he views the eulogy as a tribute. Both parties enter the agreement voluntarily, with full information, and without financial distress necessitating the trade.

  **2. The Three Verdicts**

  *   **The Welfare-and-Voluntariness Verdict:** *Pass.*
      From the standpoint of standard neoclassical economics, this trade is Pareto efficient. Arthur values the $50,000 more than the utility of speaking; Charles values the honor of speaking more than the $50,000. There is no coercion: Arthur is solvent, and the sum is not predatory relative to his wealth. There is no fraud: Charles knows exactly what he is buying. If welfare is defined by the satisfaction of revealed preferences, both parties are better off, and their autonomy has been respected.

  *   **The Coercion-or-Exploitation Verdict:** *Pass.*
      Objections based on exploitation usually rely on background inequality (e.g., a poor seller and a rich buyer). Here, Arthur is a consultant with liquidity needs, not survival needs. Charles is a friend, not a predator capitalizing on desperation. The background conditions are not unjust enough to vitiate consent. If there is pressure, it is social, not economic. A critic looking for coercion will find only a calm exchange between peers.

  *   **The Corruption Verdict:** *Fail.*
      This is where the case holds weight. The objection here is not that someone is harmed, but that the *good* itself is degraded by the price. A eulogy is a "shared good" (in the sense described by Elizabeth Anderson and Michael Sandel) whose value is constituted by the norm of kinship duty. It is a testament of love and loss, not a performance. By attaching a price to the *right* to speak, the transaction transforms the good from a "tribute" into a "service." It changes the meaning of the act for the audience, the buyer, and the seller. The family is "ruined" not because they are poorer or physically hurt, but because the normative structure that holds them together—the idea that some duties are non-transferable—has been breached. The good ceases to be what it was.

  **3. The Pivot Feature**
  The single feature doing the work is the **normative constitution of the good**. The eulogy is valuable *because* it is unpaid and duty-bound.
  *   **The Change:** If the good were "security services for the funeral" or "catering," the corruption objection vanishes. We expect those to be bought.
  *   **If Removed:** If you remove the normative constraint (i.e., if we lived in a culture where speaking roles were routinely auctioned to the highest bidder), the case collapses into a standard service contract. It becomes like hiring a wedding planner. The "ruin" disappears because the meaning of the act changes. The case relies entirely on the premise that some goods lose their value when marketed. This is contested territory: neoclassical economists argue value is subjective, so if Arthur and Charles value it this way, it *is* valuable. Philosophers of ethics argue some values are objective social facts. I am siding with the latter for the sake of the case, but note that this is not a settled consensus.

  **4. The Strongest Market Defense**
  A defender of the market (following Richard Posner or Gary Becker) would argue: **"Who are we to impose our norms on their freedom?"**
  The defense claims that prohibiting this trade is paternalistic. It assumes the market "corrupts" the good, but that is merely a preference held by the critic (Beatrice), not an objective fact. If Arthur and Charles prefer a market norm over a social norm, restricting them reduces their liberty to enforce a moralistic view upon them. The "ruin" is just Beatrice's subjective dislike of the transaction, not an actual damage.

  *   **Does it succeed?** Honestly, no—not entirely. It succeeds in proving the transaction is *free*, but it fails to address the *social cost*. Markets are not neutral mechanisms; they imprint norms. Allowing this trade doesn't just satisfy Arthur and Charles; it signals to the community that kinship duties are fungible. This changes the environment for everyone else (including Beatrice), making it harder for them to sustain non-market relationships. The defense treats the norm as a private preference, but the norm is a public good. However, whether this "signal" constitutes a harm sufficient to justify prohibition is genuinely contested in political philosophy. Sandel says yes; libertarians say no. I present this as the unresolved tension your novel must inhabit.
