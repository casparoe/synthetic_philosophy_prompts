answer: |-
  You are asking the exact right questions. Your intuition that Nominalism feels more "common sense" is shared by many (especially in the analytic tradition post-Quine), but the reason the debate is still live is that the "easy" Nominalist solutions tend to crumble when you push on them hard enough.

  Here is the breakdown of why Realists think they aren't just coping, what Nominalism actually says about physics, and why the Kidney/Heart case is a bigger deal than it looks.

  ### 1. The Parsimony Standoff: Why Resemblance Isn't Free

  You argued: *Resemblance does the explanatory work, Realism adds entities, so parsimony favors Nominalism.*

  The Realist counter-argument is that **resemblance is not a brute fact.** It is not free explanatory work.

  If you say Object A and Object B are both red because they resemble each other, the Realist asks: **"In what respect do they resemble each other?"**

  *   A red ball resembles a red car.
  *   A red ball also resembles a blue ball (in shape).
  *   A red ball also resembles a strawberry (in color).

  Everything resembles everything else in *some* way. To say "They resemble each other *in color*" is to already smuggle in the property of color. To say "They resemble each other *in redness*" is to admit the universal.

  **The Realist Charge:** Resemblance Nominalism tries to analyze universals away, but it ends up relying on "natural classes" or "specific respects of resemblance" to do the work. But what makes a respect of resemblance *natural*?
  *   **Nominalist:** It just is. It's a brute fact that these things cluster together.
  *   **Realist:** That's not an explanation; that's a placeholder. The explanation is that they share a constituent (the Universal).

  **Qualitative vs. Quantitative Parsimony:**
  *   **Nominalists** win on *quantitative* parsimony (fewer types of entities: only particulars).
  *   **Realists** argue they win on *qualitative* parsimony (fewer primitive notions). The Nominalist has to treat "resembles" as a magical, unanalyzable primitive relation that carves nature at the joints without using joints. The Realist says, "I posit one entity (Redness) to explain the resemblance, rather than positing a brute resemblance relation for every property."

  So, the Realist isn't just adding entities for fun; they claim they are providing a *ground* for the resemblance that the Nominalist leaves floating.

  ### 2. Properties, Physics, and the "Third Option"

  **Does Nominalism mean properties don't exist?**
  It depends on the flavor.
  *   **Strict Nominalism:** Only concrete particulars exist. Talk of "properties" is just talk about words (predicates) or concepts.
  *   **Class Nominalism:** Properties exist, but they are just sets of objects.
  *   **Physics:** A physicist who is a Nominalist isn't doing "loose bookkeeping." They would say: "There are electrons. They all behave in similar ways. We call that behavior 'charge'."
      *   **Realist Physicist:** "There is a physical magnitude, Charge, which is a universal instantiated by electrons."
      *   **Nominalist Physicist:** "There are electrons. 'Charge' is a useful term to describe the regularity in their behavior."
      *   **Laws of Nature:** This is the big fight. Realists (like David Armstrong) often say Laws of Nature are relations between Universals (N(F, G)). Nominalists (like David Lewis) usually adopt the **Best System Account**: Laws are just the best summary of the regularities of particular events. The Nominalist says the world is just "one damn thing after another"; the Realist says there is a "glue" (necessitation) holding the regularities together.

  **The "Private Redness" View (Trope Theory)**
  You asked: *Is the view where every red thing has its own private redness just Nominalism with extra steps?*

  This is **Trope Theory**, and it is widely considered the **third major option** (alongside Realism and Nominalism).
  *   **Realism:** One entity (Redness) is wholly present in many places. (Repeatable).
  *   **Nominalism:** No property entities, just objects resembling each other.
  *   **Trope Theory:** There are property entities, but they are **particulars**. The redness of Apple A is a distinct entity from the redness of Apple B. They are not the *same* thing; they are *exactly similar* things.

  **Is it Nominalism with extra steps?**
  Trope theorists argue it's the best of both worlds.
  *   Like Nominalism, it denies "magic repeatable entities" (Universals).
  *   Like Realism, it admits properties are real parts of the world (unlike Class Nominalism), which helps explain causation (the *charge* of this electron caused the spark, not the electron as a whole).

  So, it's not just "extra steps"; it's a different ontological category: **Abstract Particulars.**

  ### 3. The Co-extensivity Problem (Kidneys vs. Hearts)

  This is the strongest technical argument against **Class Nominalism** (the view that a property *is* the set of things that have it).

  **The Scenario:** In our world, every creature with a kidney has a heart, and vice versa.
  **Class Nominalist:** The property "Has Kidney" = The Set of Kidney-Havers. The property "Has Heart" = The Set of Heart-Havers. Since the sets are identical, **The Properties are Identical.**

  **Why is this a problem?**
  Because "Having a Kidney" and "Having a Heart" clearly mean different things. They have different causal powers. One filters blood; one pumps it. If properties are just classes, you lose the ability to distinguish between them when they happen to overlap.

  **Why isn't it a problem for the Realist?**
  Because for the Realist, a property is **not** defined by its extension (the list of things that have it). It is defined by its **identity conditions** or essence.
  *   Universal $K$ (Kidneyhood) is distinct from Universal $H$ (Harthood).
  *   Even if every instance of $K$ is an instance of $H$ in this world, $K \neq H$.

  **Your Counter:** *"Unless the realist is just positing an extra entity to mark a distinction the world doesn't make."*

  This is the crux. The Realist argues the distinction **is** in the world.
  1.  **Causal Powers:** Kidneys *do* something different than hearts. If properties are grounded in causal powers (as many Realists argue), then distinct powers = distinct properties, regardless of whether they co-occur.
  2.  **Modality (Possible Worlds):** This is the knockout punch for Class Nominalism. We can imagine a possible world where a creature has a heart but no kidney (maybe an alien biology).
      *   **Realist:** Easy. In World 2, Universal $H$ is instantiated without Universal $K$.
      *   **Class Nominalist:** Trouble. If Property = Set of *actual* instances, then the property is fixed to this world. If they try to fix it by saying "Property = Set of instances in all possible worlds," they have to admit possible worlds are real (Modal Realism) or deal with the metaphysics of non-existent objects, which gets messy.

  **Summary on the Kidney/Heart case:**
  The Class Nominalist is forced to say "There is no difference between having a kidney and having a heart other than the words we use." The Realist says "There is a real, mind-independent difference in the structure of reality, even if they always travel together." Most philosophers feel the Realist captures our intuition that *what a property is* matters more than *what things have it*.

  ### The Bottom Line

  You aren't missing something obvious; you are feeling the pull of **Ockham's Razor**, which is the Nominalist's best weapon.

  However, the debate stays live because:
  1.  **Resemblance needs grounding:** Nominalists struggle to explain *why* things resemble without secretly relying on shared natures.
  2.  **Laws and Causation:** Realists argue you need Universals to make sense of why laws of nature are necessary rather than accidental, and why properties confer causal powers.
  3.  **Co-extensivity:** Class Nominalism collapses distinct properties into one, which violates strong intuitions about meaning and modality.

  The "Third Option" (Trope Theory) is actually where a lot of the action is today, precisely because it tries to get the causal benefits of Realism without the "magic repeatable entities" that bother you.
