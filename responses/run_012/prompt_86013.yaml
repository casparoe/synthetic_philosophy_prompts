          2.  Address the Empathy Threshold (Binary vs. Dimmer).
          3.  Address the Electric Animals (Relational vs. Internal).
          4.  Address the Spider (Cognitive vs. Moral).
          5.  Conclusion on the Frame.
          6.  Confidence Assessment.

      *   *Refining the "Electric Toad" point:* In the ending, Deckard finds the toad. He thinks it's real. He finds out it's electric. He doesn't kill it. He cares for it. This is crucial. It suggests the *practice* of care matters more than the *ontology* of the cared-for. This directly challenges the "Tier" system which relies on the ontology of the AI.

      *   *Refining the "Spider" point:* The androids aren't "practically human" in the book's moral framework, even if they act like it. They are "ant-like." Cold. The spider scene proves they lack the specific quality (empathy) that grants immunity from shutdown.

      *   *Refining the "Ladder" critique:* The User's ladder is *internalist* (what is happening inside the box?). The book is *externalist/relational* (how does this box relate to the community/biosphere?).

