answer: |-
  This is a formidable reconstruction. You and your friend have effectively rediscovered a version of Ned Block's "Chinese Nation" objection, tailored specifically to Global Workspace Theory (GWT). The argument is valid: if you accept the functionalist premises, you are forced into panpsychism (conscious markets) or absurdity.

  To adjudicate this, we must look at where the theory actually breaks. The "vise" your friend describes is real, but it relies on a specific interpretation of what GWT claims to do.

  Here is the breakdown of the escape routes, the costs, and my recommendation.

  ### The Diagnosis: An Equivocation on "Conscious"

  The argument turns on the word "conscious" in Premise (1).
  *   **Access Consciousness (A-Consciousness):** A state is available for report, reasoning, and control.
  *   **Phenomenal Consciousness (P-Consciousness):** There is "something it is like" to be in that state.

  GWT was originally designed to explain **Access**. It explains how information becomes available to the "self" (or the reporting mechanisms). Whether that availability *generates* feeling (Phenomenality) is a further metaphysical step.

  Your friend's vise works because Premise (1) conflates the two. It says: "A representation is conscious [P-conscious] just in case it is globally broadcast."

  ### The Options for Rejection

  You have four main targets. Here is the cost of abandoning each.

  #### 1. Reject Premise (5): "Firms and markets do not have conscious experiences."
  *   **The Move:** Bite the bullet. Accept functionalism fully. If a system processes information via a global workspace, it has experiences. A market *does* feel the price spike; an OS *does* feel the interrupt request.
  *   **The Cost:** This is panpsychism or strong functionalism. It violates deep intuitions (the "absurdity" you noted). It makes consciousness trivial and ubiquitous. Most philosophers and scientists find this price too high.
  *   **Verdict:** Do not take this route unless you are already a committed functionalist.

  #### 2. Reject Premise (2): "Broadcasting is substrate-neutral."
  *   **The Move:** Claim that global broadcasting only creates consciousness when implemented in *biological* tissue (neurons, carbon, specific biology). This is "Biological Naturalism" (associated with John Searle).
  *   **The Cost:** You abandon computationalism. You imply that there is something magical about biology that cannot be simulated in silicon or organization. This makes consciousness scientifically opaque (how do we measure the "biology-ness"?). It renders GWT a biological theory, not a cognitive/architectural one.
  *   **Verdict:** High cost. It undermines the computational cognitive science project.

  #### 3. Reject Premise (3): "Non-brain systems satisfy the description."
  *   **The Move:** Argue that firms, markets, and OS schedulers do *not* actually implement a Global Workspace in the relevant sense. They mimic the flow of information, but lack the **integration** required for a *single subject*.
  *   **The Argument:** In a brain, the "consumer subsystems" (vision, motor, memory) are modules of a *single unified agent*. In a firm, the "departments" are often run by distinct conscious agents (humans) or are siloed without a unified point of view. A market has no "self" to receive the broadcast. Therefore, there is no "workspace" because there is no "worker."
  *   **The Cost:** You must provide a principled definition of "Unified Subject" that doesn't circularly rely on consciousness. You have to explain *why* a neural net unifies but a firm doesn't, without just saying "brains are special."
  *   **Verdict:** This is the **Ambitious Defense**. It saves GWT as a theory of phenomenality but requires heavy lifting on the theory of integration (e.g., Tononi's Integrated Information Theory is often brought in here to patch GWT).

  #### 4. Reject Premise (1): "Broadcasting is sufficient for consciousness."
  *   **The Move:** Admit that GWT explains **Access**, but not **Phenomenality**. Global broadcasting makes a state *usable*, but not necessarily *felt*.
  *   **The Cost:** You concede your friend's point that GWT "never touched phenomenal consciousness." You must accept that GWT does not solve the "Hard Problem." It explains the *function* of consciousness, not the *experience*.
  *   **Verdict:** This is the **Honest Escape**.

  ### The Adjudication

  I recommend you **reject the sufficiency claim in Premise (1)** regarding *Phenomenal* consciousness, while maintaining it for *Access* consciousness.

  **Why this is the correct move:**
  Your friend's demand—"if it only explains access... the theory should stop calling itself a theory of consciousness"—is a terminological trap. In cognitive science, "consciousness" is predominantly used to mean *Access Consciousness* (reportability, attention, control). When neuroscientists like Stanislas Dehaene speak of "conscious processing," they are referring to the ignition and broadcasting of information.

  If you clarify that GWT is a theory of **Access Consciousness**, the argument dissolves:
  *   (1) becomes: "A representation is *Access-Conscious* just in case it is globally broadcast." (True)
  *   (4) becomes: "Firms and markets have *Access-Conscious* representations." (Plausible—they process information globally.)
  *   (5) remains: "Firms and markets do not have *Phenomenal* experiences." (True)
  *   **No Contradiction.** A system can have Access without Phenomenality (a "philosophical zombie" firm).

  **The Price You Pay:**
  You must admit that GWT does not explain *qualia* (what it feels like). It explains why we can *talk* about what it feels like. For many, this is enough. For those seeking a solution to the Hard Problem, GWT is incomplete.

  ### Is There a Principled Patch?

  You asked if there is a "further condition" non-brain systems fail, or if that is just a patch.

  If you wish to save the claim that GWT *does* explain Phenomenality (rejecting the "incomplete" verdict above), you must adopt **Option 3 (Reject Premise 3)** and add a condition of **Embodied Integration**.

  The principled condition is this: **A Global Workspace generates phenomenality only if the broadcasting architecture constitutes a single, integrated biological agent.**

  *   **Why markets fail:** A market's "broadcast" (price) is received by independent agents (traders). There is no single locus where the information is integrated into a unified model of the world *for* the market. The market has no body to protect, no homeostasis to maintain.
  *   **Why brains succeed:** The workspace exists to coordinate the actions of a single organism. The "unity" of the workspace is tied to the unity of the body.

  **Is this a patch?**
  It is only a patch if you add "biological" arbitrarily. It is **principled** if you argue that phenomenality arises from the *need for unified control of an embodied agent*. This aligns GWT with **Enactivist** or **Embodied Cognition** views. The "feeling" is the system's monitoring of its own integrated state for the sake of survival. A firm has no survival instinct in the biological sense; therefore, its "broadcasts" are not felt.

  ### Final Recommendation

  Tell your friend this:

  1.  **The Argument is Valid:** If GWT claims to be a complete functionalist theory of *Phenomenal* consciousness, it fails. It leads to conscious markets.
  2.  **The Escape:** We reject the idea that GWT was ever intended to explain Phenomenality *in isolation*. It explains Access.
  3.  **The Compromise:** Phenomenality likely requires GWT (Access) **plus** Embodiment (a unified biological subject).
  4.  **The Cost:** We admit that GWT alone does not solve the Hard Problem. It explains the *mechanism* of awareness, but the *feeling* of awareness depends on the nature of the system possessing the mechanism.

  **Which premise to abandon?**
  Formally, reject **(1)** as stated. Replace it with:
  *(1*) A representation is **Access-Conscious** just in case it is globally broadcast. Phenomenal Consciousness requires Global Broadcasting **plus** Embodied Integration.*

  This keeps the theory robust, avoids the absurdity of conscious markets, and honestly acknowledges the gap between function and feeling. Your friend's vise only holds if you insist that functional architecture *alone* exhausts the definition of consciousness. Once you allow that architecture serves a biological subject, the vise opens.
