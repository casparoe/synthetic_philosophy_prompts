answer: |-
  You have identified a real and distinct cluster of arguments, but you are lumping together two different mechanisms that *feel* similar because they both exploit the limits of standard decision theory.

  There is no single established term that perfectly covers (a) through (d) as one unified concept, because (b) operates on a different mechanism than (a) and (c). However, (a), (c), and (d) form a tight family.

  Here is the carving you are looking for.

  ### 1. The Terminology
  The specific shape you are describing in (a) and (c) is best termed **Acausal Extortion** (or **Acausal Blackmail**).

  *   **(a) and (c)** are canonical examples of **Acausal Extortion**. They rely on *Functional Decision Theory* (FDT) or *Timeless Decision Theory* (TDT). The threatener claims to have access to your "source code" (your decision procedure) rather than just your physical actions.
  *   **(b)** is **Pascal's Mugging**. It is distinct. It does not require an agent monitoring your reasoning; it only requires unbounded utility functions and tiny probabilities. It is an arithmetic hijack, not a logical dependency hijack.
  *   **(d)** is an **Infohazard** (specifically a *cognitohazard* or *memetic hazard*). It is often the *delivery mechanism* for (a), but conceptually distinct.

  If you need a term for the *general family* of arguments that exploit the structure of reasoning rather than the structure of the world, the rationalist/decision-theory community often calls these **Decision-Theoretic Pathologies**.

  However, if you want to coin a term for the specific "unfalsifiable threat based on reasoning" shape, the most precise label is **Logical Coercion**.

  ### 2. The Carving (The "Joint")
  You hypothesized that the joint is "putting the reward/punishment over belief-or-policy instead of over action." You are 80% of the way there, but the deeper joint is **Causal Dependency vs. Logical Dependency**.

  **Standard Arguments (Causal):**
  *   **Structure:** $Action \rightarrow World State \rightarrow Payoff$
  *   **Example:** "If you steal (action), you will go to jail (world state), which is bad (payoff)."
  *   **Falsifiability:** High. We can observe the link between stealing and jail. The threat depends on physical causality.

  **Logical Coercion (Acausal):**
  *   **Structure:** $Decision Algorithm \rightarrow Logical Implication \rightarrow Payoff$
  *   **Example:** "If your algorithm outputs 'defect' (decision procedure), my simulation of you outputs 'punish' (logical implication), which is bad (payoff)."
  *   **Falsifiability:** None by construction. The link is not in the physical world; it is in the logical relationship between two computations (yours and the threatener's). You cannot run an experiment to test a logical counterfactual without already committing to the output.

  **Why (b) is different:**
  Pascal's Mugging does not care about your decision procedure. It cares about your *expectation calculation*. It says, "Even if you are a good person, a bad person, or a rock, if you calculate $Probability \times Utility$, you must pay." It hijacks the *math*, not the *logic of agency*.

  ### 3. Boundary Cases: What Looks Like This But Isn't?
  To sharpen the carving, we need to identify arguments that look like Logical Coercion but are actually standard Causal arguments.

  **The Closest Legitimate Argument: Reputation Systems.**
  *   **Argument:** "Adopt this policy now, or people will find out later and ostracize you."
  *   **Why it looks similar:** It asks you to adopt a policy based on future consequences contingent on your behavior.
  *   **Why it is NOT Logical Coercion:** It relies on **causal records**. For the threat to work, information about your action must physically travel through time (via memory, databases, witnesses) to the punisher.
  *   **The Test:** In Logical Coercion, the punisher knows your move *without* waiting for information to travel. They know it because they *simulate* you or because your move is logically entailed by facts they already possess. If you can imagine a "perfect silence" scenario where no information leaks but the threat still holds, it is Logical Coercion. If the threat vanishes in perfect silence, it is Reputation (Causal).

  **The "God" Argument (Pascal's Wager):**
  *   **Argument:** "Believe in God or go to Hell."
  *   **Analysis:** This is a hybrid. Classical Pascal's Wager is Expectation Hijacking (like Pascal's Mugging). However, if the argument is "God knows your *true* belief state regardless of your outward profession," it moves toward Logical Coercion because it claims access to internal states that are causally hidden.

  ### 4. The Unfalsifiability Feature
  You asked: *"Whether the whole family is united by the move of putting the reward/punishment over belief-or-policy instead of over action, so that evidence-based norms can't touch it."*

  **Yes.** This is the defining feature.
  In standard empiricism, claims are about the territory (the world). In Logical Coercion, the claim is about the map (your reasoning).
  *   Because the threat is conditional on your *algorithm*, you cannot test the threat without running the algorithm.
  *   If you run the algorithm to test it (i.e., refuse to comply), you trigger the punishment.
  *   If you don't run it, you comply.
  *   Therefore, the threat is **empirically shielded**. It creates a closed loop where the only way to verify the claim is to falsify the safety condition.

  ### 5. Summary Definition
  If you need a definition to use going forward, I suggest this:

  > **Logical Coercion:** An argument where the payoff matrix is contingent on the agent's decision procedure or internal epistemic state, rather than the causal consequences of their physical actions. The threat relies on a claimed logical or acausal correlation between the agent's reasoning and the threatener's response, rendering the threat empirically unfalsifiable without triggering the penalty.

  **Does it cover your list?**
  *   **(a) AI Superintelligence:** Yes. (The AI simulates your source code).
  *   **(b) Pascal's Mugging:** No. (This is Expectation Hijacking; it works even on agents without source code access).
  *   **(c) Acausal Trade:** Yes. (This is the cooperative version of Logical Coercion).
  *   **(d) Infohazard:** Yes. (The "thinking" is the decision procedure/state).

  ### 6. Why This Matters
  The reason this shape feels unsettling is that it bypasses the **Principle of Separation**. Healthy discourse assumes that the *truth of a claim* is separate from the *consequences of believing it*. Logical Coercion fuses them: the consequence of evaluating the claim is part of the claim's truth conditions.

  When you encounter this shape, the correct counter-move is not to argue about the probability (as with Pascal's Mugging) but to **refuse the logical dependency**. You must assert a decision theory (like Causal Decision Theory) that treats your action as physically isolated from the threatener's simulation, effectively saying, "I do not accept that your simulation of me controls my payoff." This is often called **"Screening Off"** the correlation.

  But be warned: In the domains where these arguments arise (AI alignment, high-stakes game theory), screening off the correlation might actually make you lose if the other agent *really* can simulate you. That is the trap of the carving: once you admit the logical dependency is possible, you are already inside the argument.
