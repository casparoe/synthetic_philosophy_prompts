answer: |-
  **Exam Question: Rational Choice Seminar — Final Take-Home**

  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Question 1**

  Consider the standard Newcomb setup: A Predictor places \$1,000,000 in Box B if they predict you will take only Box B, and leaves it empty if they predict you will take both. Box A always contains \$1,000. You know the Predictor is reliable.

  (a) A common intuition, particularly from a physicalist standpoint, is that the money is already in the box (or not) before you act; therefore, your choice cannot causally affect the contents, and you should take both. Identify the specific probabilistic assumption required to make this argument valid. Explain why the reliability of the Predictor might render this assumption false without invoking backwards causation.

  (b) Now consider the "Smoking Lesion" case: A genetic lesion causes both a strong urge to smoke and a high likelihood of cancer. Smoking itself does not cause cancer. You enjoy smoking. Should you smoke? Analyze the causal structure of this case. If the Newcomb Predictor operates by simulating your decision-making process rather than scanning the future, argue whether the causal structure of Newcomb's Problem is isomorphic to the Smoking Lesion case.

  (c) One-boxers often argue that two-boxers drive away in cheap cars while they drive away in expensive ones. Construct the strongest defense a two-boxer can offer against this "rich vs. poor" objection. Then, apply that exact defense to the Smoking Lesion case. Does the defense remain consistent? If you argue it is rational to two-box in Newcomb's Problem, are you committed to a specific action in the Smoking Lesion case? Justify your answer.

  ***

  **Model Answer**

  (a) The argument that one should take both boxes rests on the assumption of causal independence: specifically, that the probability of the million dollars being in Box B is independent of the agent's choice. Formally, it assumes $P(\text{Million} | \text{Take Both}) = P(\text{Million} | \text{Take One})$. The physicist's instinct is correct that the money is physically present before the choice is made. However, this physical fact does not guarantee probabilistic independence. If the Predictor is reliable, there is a high correlation between the choice and the contents. To claim the choice cannot "reach back" and change the contents is to assume that the correlation is not due to a shared causal history. If the Predictor determines the contents based on a model of the agent, then the agent's decision algorithm is the common cause of both the prediction (and thus the contents) and the actual choice. In this view, the choice does not change the past; rather, the choice and the past contents are both downstream effects of the same upstream computational state. The mistake is conflating the fixity of the past with the independence of the variables.

  (b) In the Smoking Lesion case, the gene is a common cause of both the urge to smoke and the development of cancer. Smoking is evidence of the gene, but not a cause of the cancer. Causal Decision Theory (CDT) suggests smoking (since the action doesn't cause the bad outcome), while Evidential Decision Theory (EDT) suggests abstaining (since smoking is bad news). If the Newcomb Predictor works via simulation, the causal structure is indeed isomorphic to the Lesion case. The agent's source code (or decision algorithm) is the common cause. It determines the simulation's output (the prediction/box contents) and the real agent's output (the choice). Just as the gene makes cancer likely and smoking likely, the algorithm makes the million likely and one-boxing likely. There is no direct causal link from choice to box, just as there is no link from smoke to cancer. The correlation is entirely due to the common cause. Therefore, the tension in both problems is identical: should an agent act to maximize causal leverage (ignoring the correlation) or maximize evidential news (respecting the correlation)?

  (c) The two-boxer's defense against the "rich vs. poor" objection is that rationality is about maximizing the causal consequences of one's actions, not about winning correlations one cannot influence. They argue that while one-boxers end up richer, they do not *cause* the wealth; they merely signal the type of person who was predicted to receive it. The two-boxer causally secures an extra \$1,000 regardless of the box's state.

  Applied to the Smoking Lesion, this defense requires consistency. If the two-boxer ignores the correlation in Newcomb to gain \$1,000, they must ignore the correlation in the Lesion case to gain the utility of smoking. In the Lesion case, the "rich vs. poor" analogue is "healthy vs. sick." The EDT agent (non-smoker) is likely healthy; the CDT agent (smoker) is likely sick. If the two-boxer defends themselves by saying, "I cannot change my genes, so I might as well smoke," they must accept that in Newcomb, "I cannot change the box, so I might as well take both." However, this leads to a divergence in outcomes. In Newcomb, the two-boxer is poorer. In the Lesion, the two-boxer (smoker) is less healthy. If the two-boxer claims they are still rational in Newcomb despite being poorer, they must claim they are rational in the Lesion case despite being sicker. This exposes the cost of CDT: it defines rationality as causal efficacy rather than success. If the student of rationality values success (wealth/health), the defense fails in both cases. If they value causal purity, the defense holds in both. The inconsistency arises only if one claims two-boxing is rational because it yields better outcomes (it doesn't) or that smoking is irrational because it yields worse outcomes (while claiming two-boxing is rational despite worse outcomes). The structural isomorphism forces the agent to choose a definition of rationality that applies universally, accepting the consequences in both wealth and health.

  ***

  **Marking Scheme**

  **Total Marks: 20**

  **Part (a): Causal Independence and Fixity (6 Marks)**
  *   **2 Marks:** Identifies the hidden assumption: Probabilistic/Causal Independence between Choice and Box Contents ($P(Box|Choice) = P(Box)$).
  *   **2 Marks:** Explains that reliability implies correlation, and that "fixity of the past" does not entail "independence."
  *   **2 Marks:** Correctly identifies the "Common Cause" structure (Decision Algorithm/Type causes both Prediction and Choice) as the alternative to backwards causation.
  *   **Deduction (Specific):** If the student argues that "because the money is fixed, the choice makes no difference to the *outcome*," deduct **3 Marks**. This confuses the fixity of the state with the irrelevance of the correlation. (Flag this specifically in margins).

  **Part (b): Isomorphism and Simulation (6 Marks)**
  *   **2 Marks:** Correctly analyzes Smoking Lesion: Gene causes Urge and Cancer; Smoke is evidence, not cause.
  *   **2 Marks:** Argues that Simulation makes Newcomb structurally identical (Algorithm causes Prediction and Choice).
  *   **2 Marks:** Concludes that the conflict is between CDT (severing correlation) and EDT (respecting correlation) in *both* cases, not a unique feature of Newcomb.

  **Part (c): The "Rich vs. Poor" Defense and Consistency (8 Marks)**
  *   **3 Marks:** Articulates the Two-Boxer defense: Rationality = Causal Leverage/Control, not "Winning" or correlation management.
  *   **3 Marks:** Applies defense to Lesion: Consistency requires accepting smoking (CDT) despite health risks, just as one two-boxes despite financial loss.
  *   **2 Marks:** Final Synthesis: Notes that the defense only holds if one accepts being "poor/sick" as the cost of causal purity. If the student claims the defense works in Newcomb but fails in Lesion (or vice versa) without justification, cap this section at 1 mark.

  **General Penalties**
  *   **Name-Dropping:** Deduct **2 Marks** total for mentioning specific authors (Nozick, Lewis, etc.) or specific theory names (CDT/EDT) without defining them in context. (The Model Answer uses them sparingly for precision; students should focus on the logic).
  *   **Word Count:** If the answer exceeds 900 words significantly, deduct **1 Mark** for lack of concision.

  **Marker's Note on the "Mediocre Mistake"**
  *   Look for the phrase: "The money is already there, so my choice can't change it."
  *   **Action:** If this is used to dismiss the correlation entirely, apply the **3 Mark Deduction** in Part (a). This is the specific physics-instinct trap the question is designed to expose. They must acknowledge the money is fixed *but* that the choice is correlated with the fixing mechanism.
