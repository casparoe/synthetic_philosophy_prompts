  Chip the weatherman is live on Channel 8. Outside the studio window, a monsoon is visibly hammering the pavement. Chip looks into the camera, sweating.

  "Look," Chip says. "The radar says storm. My eyes say storm. But honestly? It's storming... but I don't believe it's storming."

  Dead air. The producer screams in his earpiece.

  "I know!" Chip snaps, forgetting he's on mic. "It's pragmatically infelicitous! I'm asserting *P* while denying belief in *P*! It undermines the assertion!"

  The producer makes a violent cutting gesture across his throat.

  "Okay, okay! I'll fix the logic!" Chip straightens his tie. "It is storming... but *you* don't believe it's storming."

  The producer facepalms so hard it echoes in the control booth.

  "What? It's logically consistent!" Chip insists to the camera. "You can be wrong about your own head! It's fine!"

  The producer signals the hard cut. Chip knows he has three seconds before they kill the feed. He panics and shifts tense.

  "Fine! Past tense! It *was* storming... and I *didn't* believe it!"

  The red "ON AIR" light flicks off. Chip slumps, relieved.

  "There," he mutters to the empty studio. "No paradox. Pure truth. So... bring an umbrella... yesterday."
