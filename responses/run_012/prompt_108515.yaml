prompt: |-
  I am preparing a graduate seminar on scientific realism, and I want to center the session on underdetermination around Stanisław Lem's *Solaris* rather than the customary Duhem–Quine examples. Please read the novel through that lens and tell me how far the reading can be pressed. The Solarists have accumulated decades of observations of the ocean — the vast, transient formations it produces, the visitors it materializes aboard the station, and the whole failed research program that grows up around it — and every hypothesis they construct is either refuted or left dangling alongside rivals that fit the same data equally well: the ocean as a mind, as a machine, as an indifferent natural process, as a mirror of the observers, as something for which no human category is adequate. Where does this genuinely dramatize underdetermination as Duhem, Quine, and van Fraassen frame it, and where does Lem stage something the standard thesis cannot capture — for instance an evidential base that is unique and unrepeatable rather than a stable body of repeatable phenomena, or one that is causally entangled with the observer, so that the "same evidence" available to two rival theories never quite exists? I would also like you to say where the novel resists the reading: is the ocean's opacity an epistemic predicament at all, or a moral and psychological one about what the crew can bear to learn about themselves? Identify the scenes that carry the weight, note briefly whether the Tarkovsky or Soderbergh adaptations sharpen or blunt the point (the novel remains the object), and close by saying what the novel adds to the philosophical debate that the journal literature does not. No quotations are needed; I know the text. Please write in American English.
