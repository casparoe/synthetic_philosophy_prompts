  7.  **Final Polish:** (Mental check of specific terms like "auxiliary hypotheses," "empirical adequacy," "ontological commitment.") Ensure the distinction between the "Ocean as object" and "Ocean as mirror" is clear in the context of evidence.

  *(Self-Correction)*: I should be careful not to conflate Tarkovsky's "Earth" theme too much with the prompt's focus on realism, but it is relevant to the "resistance" part (moral/psychological). Soderbergh is mostly a cautionary tale of what *not* to focus on for this seminar.

  *(Final thought)*: The core insight is that standard underdetermination assumes a passive world. *Solaris* presents an active world that reacts to the theory, making the underdetermination recursive.

