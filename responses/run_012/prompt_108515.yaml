          *   Contribution to philosophical debate (what does the novel add that journal literature doesn't?).
      *   **Constraints:** No quotations, American English, graduate seminar level.

  2.  **Deconstruct the Philosophical Concepts:**
      *   *Underdetermination of Theory by Data (UTD):* Multiple theories can explain the same set of observations.
      *   *Duhem:* Holism of testing (you test a cluster of hypotheses, not one in isolation).
      *   *Quine:* Radical holism, any statement can be held true if we make drastic enough adjustments elsewhere.
      *   *van Fraassen:* Empirical adequacy vs. truth. We need only save the phenomena, not describe the unobservable reality.
      *   *Lem's Twist:* The "data" isn't stable. The observer affects the data. The data is singular (the Ocean).

  3.  **Analyze *Solaris* through the Lens:**
      *   *The Data:* The Ocean's formations (mimoids, symmetriads), the "visitors" (phantoms).
      *   *The Theories:* Contactology, neurophysics, solaristics as a failed science.
      *   *Underdetermination:* Every theory fits some data but fails others. Is it a god? A brain? A machine? Nothing we know?
      *   *The Twist:* The Ocean responds to the scientists. The "evidence" (the visitors) is generated by the scientists' own minds. This breaks the standard UTD model where data is independent of the theory/observer.
      *   *Resistance:* Is Kelvin trying to know the planet, or is he trying to escape his guilt? The "science" is a defense mechanism.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the ambition. *Solaris* is a perfect test case but breaks the mold.
      *   **Standard Underdetermination (Duhem/Quine/van Fraassen):**
          *   *Duhem:* The Solarists work in clusters. They can't isolate variables. When an experiment fails, they adjust auxiliary hypotheses (instrument error, wrong math), not the core theory.
          *   *Quine:* The web of belief is strained. They keep the core belief ("Solaris is intelligible") by making extreme adjustments elsewhere (e.g., X-ray bombardment).
          *   *van Fraassen:* The shift from "truth" to "empirical adequacy." Snowbart and others eventually settle for describing *what* happens, not *why*. Constructive empiricism fits the later stage of Solaristics.
      *   **Where Lem Goes Beyond (The "New" Stuff):**
          *   *Unrepeatable Evidence:* Standard UTD assumes stable phenomena. Solaris produces unique events. You can't run the "visitor" experiment twice.
          *   *Causal Entanglement:* The observer creates the evidence. Kelvin's guilt creates Rheya. This violates the independence assumption of standard confirmation theory. The "theory" (Kelvin's psyche) generates the "data" (Rheya).
          *   *Incommensurability:* It's not just that theories fit the data; it's that human categories *might not apply*. This is stronger than UTD; it's conceptual limitation.
      *   **Where the Novel Resists (The Moral/Psychological Turn):**
          *   Is it really about knowledge? Or is "science" a shield against the traumatic Real (in a Lacanian sense, though maybe keep it philosophical)?
          *   The failure of Solaristics is a failure of anthropology, not just physics.
          *   Key Scenes: The X-ray bombardment (hubris of testing), the disposal of visitors (ethical failure of treating data as objects), the final library scene (acknowledgment of limits).
      *   **Adaptations:**
          *   *Tarkovsky:* Blunts the science, sharpens the moral/psychological. Makes it about Earth-nostalgia. Less about UTD, more about human limitation.
          *   *Soderbergh:* Focuses on the romance/grief. Blunts the epistemic crisis entirely.
          *   *Novel:* Keeps the tension between the scientific method and the impossible object.
      *   **Contribution to Debate:**
          *   Journal literature treats UTD as a logical problem. Lem treats it as an existential/experiential one.
          *   Introduces the "Hostile Data" problem (data that judges you).
          *   Suggests that underdetermination might be a feature of the universe's indifference, not just a bug in our logic.

  5.  **Refining and Polishing:**
      *   *Tone:* Academic, analytical, precise.
      *   *Check Constraints:* No quotes. American English.
      *   *Self-Correction during drafting:* I need to make sure I don't get too bogged down in plot summary. Keep the focus on the *philosophical mechanism*. Ensure the distinction between Duhem-Quine and Lem's specific contribution is clear. The "causal entanglement" point is crucial—that's where Lem diverges from standard positivist frameworks.
      *   *Van Fraassen nuance:* Van Fraassen says aim for empirical adequacy. The Solarists *want* truth but are forced into adequacy. This tension is key.
      *   *Resistance:* Make sure to highlight that Kelvin realizes the science is a distraction from the ethical reality of the "guests."

  6.  **Final Review against Prompt:**
