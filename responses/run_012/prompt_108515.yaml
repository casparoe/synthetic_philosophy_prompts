  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Scientific Realism and Underdetermination.
      *   **Primary Text:** Stanisław Lem's *Solaris* (novel).
      *   **Philosophical Framework:** Duhem-Quine thesis, van Fraassen (constructive empiricism).
      *   **Key Questions:**
          *   How far can the underdetermination reading be pressed?
          *   Where does it dramatize standard underdetermination (Duhem/Quine/van Fraassen)?
          *   Where does it stage something *new* (unique/unrepeatable evidence, causal entanglement)?
          *   Where does the novel *resist* the reading (epistemic vs. moral/psychological)?
