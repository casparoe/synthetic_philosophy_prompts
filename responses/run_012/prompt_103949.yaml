answer: |-
  The sequence
  Start by validating their experience: visitors *do* care about originals. Don't argue yet; just establish that this intuition is widespread. Second, introduce the thought experiment: a perfect duplicate exists. Here, you must steelman the perceptualist view ("If two things look identical, they are aesthetically identical"). State this strongly and sympathetically. If you weaken it now, the later victory feels empty. This is the crucial pivot: "but the forgery is just as beautiful" stops being an objection and becomes the puzzle only *after* you've convinced them that perceptualism *should* be true if art were only about visual experience.

  Third, reveal that despite the steelman, we still prefer the original. Ask why. If they say "money," park that for later. Push for the feeling of loss if the original were destroyed. Fourth, introduce the "History of Making." Explain that part of what we value is the *achievement* of the artist at a specific time, not just the resulting surface. The original is a record of that event; the forgery is a record of a different event (deception/imitation). This depends entirely on the previous step: you can only introduce history as a value once you've established that visual properties alone are insufficient to explain our preference.

  Finally, apply this to docency. Their job isn't to police authenticity but to narrate the history of making. This depends on the previous step because it reframes their role from "guardians of objects" to "guides through history." The sequence holds because each step removes a layer of explanation (visual, economic) until only the historical causal chain remains viable.

  The example
  The restrike is risky. It needs to isolate history from visual properties, which it does, but it must not introduce questions of authorization. A restrike is often authorized; a forgery is not. Using a restrike smuggles in a second confusion (is it a fake? a copy? an original?) before the first lands. It also implies the matrix (the block) is the artwork, which complicates the "history of making" argument for unique objects like paintings.

  Use the "Time-Travel Duplicate" instead. Describe a scenario where a machine creates a molecule-for-molecule copy of a specific painting (e.g., a Rembrandt) today. It is visually identical, chemically identical, even aged identically. It is not a restrike; it is a duplicate. It is not authorized; it is a new object. This isolates the variable perfectly: the only difference is the causal history (1650 vs. 2024). It carries the session because it removes market scarcity (you could make a million) and visual difference, leaving only the history of achievement.

  Misconceptions and where they get headed off
  *   **"If you can't see it, it can't matter."** (Surfaces immediately). Head this off during the "Steelman Perceptualism" phase. Acknowledge it is logically sound *if* art is purely visual. Don't dismiss it; show why it fails to capture our actual experience.
  *   **"The original's value is just scarcity and status."** (Surfaces when preferring the original). Head this off by distinguishing economic value from aesthetic value. Ask: "If the original were free and the copy cost millions, would you still prefer the original?" This isolates the aesthetic/historical preference from the market. Note: This is a *reasonable* position for market value, so acknowledge its truth there before limiting its scope.
  *   **"Forgery = counterfeit = lying about what you can see."** (Surfaces when discussing intent). Head this off by distinguishing ontological identity from deception. A forgery is a different *kind* of object, not just a lie. Even if you know it's a copy, it lacks the historical connection.
  *   **"The original must have some invisible aura."** (Surfaces when grasping for words). Head this off by reframing "aura" as "historical relation." It's not mysticism; it's physical causality. The object was touched by the artist. This validates their intuition without endorsing magic.
  *   **"Once history matters, a restoration or replica is just as good."** (Surfaces at the end). Head this off by clarifying that history matters *specifically* the history of the artist's achievement. A restoration changes that history; a replica creates a new history. Note: "Aura" is a reasonable folk-term for historical relation; don't steamroll it, just translate it.

  The check for understanding
  Do not ask them to define "provenance." Instead, pose a visitor scenario: "A visitor points to a faded 18th-century sketch and says, 'Why look at this dirty draft when the gift shop sells a perfect, vibrant print for $20?' Write down the one sentence you would say to explain the value of the sketch without using the words 'money,' 'rare,' or 'real.'"

  A good answer references the *connection to the artist* or the *moment of creation* (e.g., "This paper holds the actual movement of the artist's hand," or "This is where the idea happened."). A bad answer references scarcity or investment ("Because it's the only one left"). This tests whether they understand history-of-making vs. market scarcity.

  What to leave out and say so
  Explicitly refuse to settle the hard cases: restoration ethics, an artist's own later copies, or translations of novels. Say: "We are stopping at unique visual art. Once you move to music, literature, or conservation, the rules change, and we don't have time for that today."

  Do not use the words "autographic," "allographic," or "Danto." These are showing off. They add jargon without adding clarity for this group. The concept (history matters) is what they need; the terminology is what you know. Leave the terminology at home.
