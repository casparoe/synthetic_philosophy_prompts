prompt: |-
  my friend who did an ma in philosophy gave me her version of counterpart theory on a walk the other day, and it was convincing enough that i want it checked before i repeat it to anyone. she kept saying 'de re modality about you', which i nodded at without really knowing what it meant. anyway, her version went like this:

  the standard story -- sometimes called transworld identity -- is that there are many possible worlds and the same person can be in more than one of them, so you are literally in a bunch of worlds at once, and 'you could have been a dentist' is true because in one of those worlds you are a dentist. lewis thought that picture was broken, because you cant be identical to someone with different properties; identity isnt the kind of thing that varies from world to world. so he swaps identity out for the counterpart relation: each of us exists in exactly one world, and 'you could have been a dentist' really means that in some other world there's an individual very much like you, your counterpart, who is a dentist. so strictly speaking, modal claims about you arent about you at all, theyre about your counterpart. and the counterpart relation is just similarity -- your counterparts are the people in other worlds who are most like you. kripke's objection was that this gets the truth conditions wrong, since when we say humphrey could have won the election we're talking about humphrey and not some other man, and thats why counterpart theory is basically a minority position these days, kept alive as a technical device for regimenting quantified modal logic without having to swallow lewis's full modal realism.

  what i want to know is how much of that i should trust. the 'not about you' part definately smells to me like an objection dressed up as a description of the view, and i dont know what to make of her verdict at the end, but the similarity bit and the kripke bit sound right to me. go through it claim by claim: whats accurate, whats a simplification that a careful person would refine, whats just wrong, and what a lewis defender would say in reply to each point. then tell me whether her final conclusion survives all that. and please commit -- give me your actual verdict on which claims fail and how confident you are in each, not a menu of positions with the choice left to me.
