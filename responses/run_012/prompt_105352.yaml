answer: |-
  # JOINT STATEMENT ON AESTHETIC TESTIMONY
  **Collaborators:** [The Pessimist] & [The Optimist]
  **Date:** October 26, 2023
  **Subject:** Mapping the Dispute Regarding Testimonial Justification in Aesthetics

  ### 1. AGREED CLAIMS (The Common Ground)
  *We both sign the following propositions. These define the terrain of our debate and rule out caricatures of either position.*

  1.  **Distinction of Content:** We distinguish four categories of aesthetic-related claims subject to testimony:
      *   (a) **Non-Aesthetic Properties:** Facts independent of aesthetic response (e.g., "This canvas is from 1630," "This depicts a skull").
      *   (b) **Thin Verdicts:** General evaluative sums (e.g., "It is beautiful," "It is good").
      *   (c) **Thick Characterizations:** Descriptions entailing both description and evaluation (e.g., "It is melancholic," "It is kitsch," "It is unified").
      *   (d) **Experience Reports:** First-person psychological states (e.g., "It made me cry," "I found it boring").
      *   *Agreement:* Testimony works for (a) and (d). The debate concerns (b) and (c).

  2.  **Distinction of Mechanism:** We distinguish three ways testimony functions:
      *   (a) **As Evidence:** The hearer infers the truth of the claim from the speaker's reliability (inductive).
      *   (b) **As Transmission:** The hearer takes the speaker's word as the direct source of justification (non-inferential).
      *   (c) **As Recommendation:** The speaker urges the hearer to seek the experience themselves.
      *   *Agreement:* Testimony as Recommendation (c) is generally unproblematic. The debate concerns (a) and (b).

  3.  **Distinction of Pessimist Theses:** We acknowledge three distinct strengths of the Pessimist position:
      *   (a) **Impossibility:** One *cannot* acquire aesthetic knowledge/justification via testimony.
      *   (b) **Illegitimacy:** One *can* acquire it, but it is normatively wrong or irrational to believe on that basis.
      *   (c) **Inauthenticity:** One *can* acquire it, but the resulting belief does not count as *the hearer's own* aesthetic judgment.
      *   *Agreement:* The Optimist rejects (a). The Optimist is open to (c) as a pragmatic worry but denies it undermines epistemic status. The Pessimist endorses (a) or (b), arguing (c) is a symptom of the deeper failure.

  4.  **Distinction of Principles:** We separate three often-conflated principles:
      *   (a) **The Acquaintance Principle:** Aesthetic knowledge *requires* first-hand experience of the object.
      *   (b) **The Autonomy Principle:** One *ought* to judge for oneself rather than defer.
      *   (c) **Causal Dependence:** Aesthetic experience is causally dependent on first-hand attention (you can't feel the sadness of the music without hearing it).
      *   *Agreement:* We both accept (c). The debate is whether (c) entails (a) or (b).

  5.  **Scope of Debate:** This dispute is not about whether aesthetic properties are "real" or "subjective." Both sides accept that aesthetic properties are response-dependent but not merely matters of arbitrary preference. The dispute is about the *epistemic pathway* to justified belief in those properties.

  6.  **The "Blind Deference" Constraint:** We agree that forming a belief solely on testimony *without any intention to verify* is generally inferior to forming a belief based on experience. The debate is whether the testimony-based belief is *justified* or constitutes *knowledge* prior to that verification.

  ---

  ### 2. PRECISE DISAGREEMENTS
  *Here we state our opposing positions charitably. Neither side accepts the other's formulation as true, but both accept these formulations as accurate representations of the disagreement.*

  **The Pessimist Maintains:**
  The Acquaintance Principle (4a) is an epistemic constraint, not just a causal one. For Thick Characterizations (1c) and Thin Verdicts (1b), the justification for the belief is constituted by the experience itself. Therefore, Testimony as Transmission (2b) is impossible for these categories. You can infer reliability (2a), but you cannot "take their word" for an aesthetic quality in the way you take a historian's word for a date. To try to do so is to misunderstand the nature of aesthetic concepts. Consequently, the Impossibility Thesis (3a) holds for Thick/Thin claims, and the Inauthenticity Thesis (3c) explains why such beliefs feel hollow.

  **The Optimist Maintains:**
  The Acquaintance Principle (4a) is a causal description (4c) mistakenly elevated to an epistemic norm. While experience causes the judgment in the speaker, the *justification* can be transmitted to the hearer via Testimony as Transmission (2b), particularly for Thick Characterizations (1c). If I trust your grasp of "melancholic," I can know the music is melancholic without hearing it, just as I can know a wine is tannic without tasting it if I trust your palate. The Impossibility Thesis (3a) is false. The Autonomy Principle (4b) is a normative ideal about character, not an epistemic constraint on knowledge. I reject that testimony-based belief is inherently Inauthentic (3c); it is simply a different route to the same epistemic state.

  ---

  ### 3. CRUXES (Tests for Resolution)
  *We identify four specific cases. Settling the interpretation of these cases would move at least one of us. We record our divergent predictions.*

  **Crux 1: The Gallery Guide Case (Standard Testimony)**
  *   **Case:** A trusted guide tells you, before you enter the room, "The painting in there is profoundly unified." You believe them. You do not see the painting yet.
  *   **Question:** Do you *know* it is unified at the moment of belief?
  *   **Pessimist Prediction:** No. You have a true belief based on evidence of reliability, but you lack aesthetic knowledge. You cannot grasp the "unity" without seeing the relations.
  *   **Optimist Prediction:** Yes. If the guide is competent and sincere, the justification is transmitted. You know it is unified, even if your appreciation is shallow compared to seeing it.

  **Crux 2: The Blind Tasting / Expert Connoisseur Case (Expertise)**
  *   **Case:** A master sommelier tells you a wine is "balanced." You trust them implicitly but do not taste it.
  *   **Question:** Does high expertise bridge the gap between Testimony as Evidence (2a) and Transmission (2b)?
  *   **Pessimist Prediction:** No. Even with expertise, "balance" is a sensory-aesthetic property. Without your own palate, you are deferring to a report, not grasping the property. Expertise makes the evidence stronger, but doesn't change the epistemic kind.
  *   **Optimist Prediction:** Yes. At a certain level of expertise, the concept "balance" becomes detachable from the immediate sensation for the hearer. The expert's testimony functions as Transmission. You know it is balanced in the relevant sense.

  **Crux 3: The Spoiler Case (Experience Alteration)**
  *   **Case:** A friend tells you the ending of a movie ("The hero dies"). This testimony ruins your ability to experience the suspense.
  *   **Question:** Does this support the Acquaintance Principle (4a) or merely Causal Dependence (4c)?
  *   **Pessimist Prediction:** Supports Acquaintance. The testimony changed the *object* of your aesthetic experience. It shows testimony interacts constitutively with the aesthetic properties, proving you can't separate the knowledge from the experience.
  *   **Optimist Prediction:** Supports Causal Dependence only. The testimony changed your psychological state, which changed the experience. It doesn't prove you couldn't *know* the ending was tragic via testimony; it just proves knowing it changes the value. This is compatible with testimony transmitting knowledge of the plot's aesthetic impact.

  **Crux 4: The Belief Pill Case (Pure Belief)**
  *   **Case:** You swallow a pill that causes you to believe "This painting (which you have never seen) is beautiful." The belief is reliable (the pill is tuned to truth).
  *   **Question:** Is this epistemically equivalent to trusting a friend's testimony?
  *   **Pessimist Prediction:** Yes. Both cases generate belief without experience. If the Pill case is clearly illegitimate/impossible (which it is), then standard testimony is too. The friend is just a biological pill.
  *   **Optimist Prediction:** No. Testimony involves a reason-giving relationship and an invitation to verify (Recommendation). The Pill bypasses agency. The Pill case is a failure of epistemic agency, but standard testimony preserves it. The Pill case is a *reductio* of the Pessimist's conflation of testimony with mere causation.

  ---

  ### 4. VERBAL DISPUTES
  *We acknowledge that some friction may be terminological rather than substantive.*

  1.  **"Knowledge" vs. "Appreciation":** The Pessimist suspects the Optimist is using "knowledge" to mean "true belief with reliable source," while the Pessimist reserves "aesthetic knowledge" for "understanding gained through appreciation." If we agree to use "aesthetic appreciation" for the experience-based state and "aesthetic information" for the testimony-based state, the Impossibility Thesis (3a) might dissolve into a definition.
      *   *Resolution Attempt:* We agree to keep using "knowledge" but acknowledge the Pessimist implies a thicker notion of understanding than the Optimist.

  2.  **"Thick" vs. "Thin":** The Optimist suspects the Pessimist treats all aesthetic terms as Thin Verdicts (1b), which are harder to transmit. The Pessimist suspects the Optimist treats Thick Characterizations (1c) as disguised Non-Aesthetic Properties (1a).
      *   *Resolution Attempt:* We agree that "melancholic" is not reducible to "sad" (non-aesthetic) + "good" (thin). It is sui generis. The dispute remains on whether *that* sui generis concept can be transmitted.

  ---

  ### 5. MIND-CHANGING CONDITIONS & FRAGILITY

  **What would change The Pessimist's mind?**
  *   **Condition:** A demonstrated case where testimony *improves* the subsequent aesthetic experience significantly more than silence, in a way that suggests the testimony conveyed aesthetic content rather than just directing attention.
  *   **Example:** If being told "listen for the counterpoint" allows a novice to hear the beauty immediately upon listening, whereas without the testimony they never would have grasped it even after multiple listens. This would suggest the testimony carried the aesthetic justification required to unlock the experience.

  **What would change The Optimist's mind?**
  *   **Condition:** A demonstrated case where forming a belief via testimony systematically *obstructs* the ability to recognize the truth of the matter upon encountering the object, more so than having no belief at all.
  *   **Example:** If subjects told a painting is "unified" via testimony are subsequently *less* able to correctly identify its unity upon seeing it than subjects given no information, this would suggest testimony-based belief is not just shallow, but epistemically hostile to aesthetic truth (supporting Illegitimacy).

  **Fragility Note:**
  *   **Most Likely to Break:** **Agreed Claim 1 (Distinction of Content).** Specifically, the boundary between **Thick Characterizations (1c)** and **Non-Aesthetic Properties (1a)**.
  *   **Why:** The Optimist's position relies heavily on Thick properties being close enough to descriptive facts to be transmitted. The Pessimist's position relies on them being close enough to evaluative verdicts to require experience. If we discover that "melancholic" is actually just a code for a complex set of non-aesthetic features (minor key, slow tempo, etc.), the Optimist wins by default (it becomes Claim 1a). If we discover "melancholic" is purely an emotional response with no descriptive anchor, the Pessimist wins by default (it becomes Claim 1b). Our collaboration holds only as long as "Thick" remains a stable, hybrid category. If that category collapses, this agreement dissolves.

  **Signed:**

  _________________________ (The Pessimist)

  _________________________ (The Optimist)
