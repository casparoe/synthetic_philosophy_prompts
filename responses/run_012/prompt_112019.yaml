answer: |-
  # Activity: "The Cup Stack Optimization Trap"

  This activity uses a physical construction task to simulate an optimization process where the Metric (what you measure) diverges from the Goal (what you actually want). By keeping the physical materials constant (plastic cups) but changing the incentives and constraints, you force the group to encounter the four failure modes sequentially.

  ## Concept
  **The Goal:** Structural Stability (measured by surviving a "wind test").
  **The Metric:** Varies by round (Height, Count, etc.).
  **The Setup:** 3 Teams of 4-5 people. 2 Observers (or Facilitator + 1 helper).
  **Time:** 90 Minutes hard stop.

  ## Materials
  *   **150+ Disposable Plastic Cups** (The more, the better. Dollar store bulk).
  *   **1 Piece of Stiff Cardboard** (To act as a "wind fan").
  *   **Timer** (Phone).
  *   **Whiteboard/Flipchart** (To track scores).
  *   **Candy/Points** (For symbolic stakes).
  *   **Secret Role Cards** (Index cards with Round 4 instructions).

  ## Round Structure

  ### Intro (10 Minutes)
  Explain the core loop: "You are engineering firms. I am the Client. I want a **Stable Structure**. You will be scored on a **Public Metric**. At the end of each round, I will test for Stability. If it falls, you get zero Stability points, regardless of your Metric score."

  **Define Stability:** The structure must stand for 5 seconds while the Facilitator waves the cardboard fan 1 meter away (3 firm waves).
  **Define Teams:** Split the 14 people into 3 Teams (A, B, C).

  ### Round 1: The Regression Trap (15 Minutes)
  *   **Instruction:** "Build as many structures as you like in 10 minutes. Submit your **single tallest** structure. Metric = Height (in cups). Goal = Stability."
  *   **The Trap:** Height correlates with Stability *on average*, but it is noisy. By asking them to submit only the *tallest*, you force them to select for Maximum Height = Maximum True Height + Maximum Positive Noise (wobble/luck).
  *   **Resolution:** Measure the submitted towers. Most will be tall. Test them. Many will fall.
  *   **What happens:** Teams feel they did well on the Metric but failed the Goal. They assume they just need to build "better."

  ### Round 2: The Extremal Trap (15 Minutes)
  *   **Instruction:** "We need more capacity. **Minimum Height Requirement: 40 cups.** (Set this slightly higher than the tallest successful tower from Round 1). Metric = Height. Goal = Stability."
  *   **The Trap:** The relationship between Height and Stability holds for normal towers. It breaks in the tails. To reach 40 cups, they must change the physics (spindly columns vs. wide bases). The model "Taller = Better" is now out-of-distribution.
  *   **Resolution:** Teams struggle to reach 40. They build precarious spires. They hit the Metric. They fail the Wind Test catastrophically.
  *   **What happens:** Teams think, "We solved the noise problem by building bigger, but now the physics broke."

  ### Round 3: The Causal Trap (15 Minutes)
  *   **Instruction:** "Height is hard to measure quickly. New Metric: **Total Cups Used in the Structure.** Goal = Stability (still)."
  *   **The Trap:** Cups Used is a proxy for Height, which is a proxy for Stability. But Cups Used is not *causal* for Stability. You can use many cups without creating height or stability.
  *   **Resolution:** Teams lay cups flat on the table in a giant mosaic or stack them in non-structural piles. Metric scores skyrocket. Stability is zero (no vertical structure to test, or it's flat).
  *   **What happens:** Teams realize the Metric is now completely decoupled from the physical reality of the Goal.

  ### Round 4: The Adversarial Trap (15 Minutes)
  *   **Instruction:** "Final Round. Metric = Height. Goal = Stability. Standard rules."
  *   **The Twist:** Hand Team C a **Secret Role Card** before the round starts.
      *   *Team C Card:* "Your goal is to maximize Height Metric. However, if your tower passes the Wind Test, you lose 50 points. You must look like you are trying, but ensure it falls."
      *   *Teams A & B:* Standard instructions.
  *   **The Trap:** Team C actively exploits the gap between Measurement (Height) and Reality (Stability). They might balance a tall tower on a single cup, or use a hidden weak point.
  *   **Resolution:** Team C likely posts the highest Metric score. It fails the test. Teams A & B are confused why Team C's design was so "bad" despite the high score.
  *   **What happens:** Reveal the secret card in debrief. The room realizes the failure wasn't incompetence, but optimization *against* the Goal.

  ### Debrief (20 Minutes)
  Do not lecture immediately. Ask the room to diagnose what happened in each round. Then map it to the four modes.

  1.  **Round 1 (Regressional):** "Why did the tallest tower fall?" -> *Because you selected for luck/noise. Height = Signal + Noise. Max(Height) selects Max(Noise).*
  2.  **Round 2 (Extremal):** "Why did 40 cups fail when 30 worked?" -> *You left the training distribution. The physics changed at the extreme.*
  3.  **Round 3 (Causal):** "Why did spreading cups out win the metric?" -> *You optimized the proxy, not the cause. Cups don't cause stability; arrangement does.*
  4.  **Round 4 (Adversarial):** "Why did Team C build like that?" -> *Reveal card. An agent optimized the gap intentionally.*

  ## Predictable Failure Points & Salvage
  1.  **Cup Shortage:** 14 people can destroy 150 cups fast.
      *   *Fix:* Bring 300. Or allow "recycling" (knocking down old towers) between rounds.
  2.  **Subjective Wind Test:** "That wave was too hard!"
      *   *Fix:* Pre-commit to the wave intensity. Do a demo wave on a "calibration tower" before Round 1.
  3.  **Regressional Mode Misses:** If everyone builds wide, stable towers, the noise isn't visible.
      *   *Fix:* Emphasize "Tallest" aggressively in Round 1. If they all succeed, lower the time limit to increase variance/rush.
  4.  **Time Creep:** Construction takes longer than expected.
      *   *Fix:* Use a loud timer. Announce "5 minutes left," "2 minutes left." Hard stop on building. Testing must be rapid.
  5.  **Adversarial Mode is Too Obvious:** Team C builds something obviously fake.
      *   *Fix:* Tell Team C privately: "It must look plausible for 5 seconds."

  ## Limitations (What this game can't do)
  **It cannot reproduce true Statistical Goodhart (Regressional) with high fidelity.**
  With only 3 teams and 1-2 submissions each, the sample size is too small to show a statistical regression effect convincingly. You are relying on the *intuition* of "picking the lucky outlier." You must explicitly explain in the debrief that in the real world, this happens over thousands of data points (e.g., hiring candidates), whereas here we simulated it with physical variance.

  ## Facilitator Must Supply
  *   **The "Wind":** You must be consistent. If you wave harder in Round 2, they will blame you, not Goodhart.
  *   **The Secret:** You must keep Team C's role secret until the very end of the debrief.
  *   **The Narrative:** You must frame the rounds as "Policy Changes" by the Client (You), not "Game Rule Changes." This preserves the feeling of a real-world optimization process.

  ***

