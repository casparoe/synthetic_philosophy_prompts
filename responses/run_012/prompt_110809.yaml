answer: |-
  You are grappling with the tension between the **Condorcet Jury Theorem (CJT)** and the realities of **heterogeneous competence** and **agenda constraints**. Your intuitions are largely consistent with the state-of-the-art in formal social epistemology, specifically the literature on **truth-tracking aggregation rules**.

  There is indeed a single principle that unifies these verdicts, but it requires you to refine your definition of "competence clearing chance" and abandon **Simple Majority Rule** as the default reliable mechanism in favor of **Optimal Weighted Majority**.

  ### The Principle: Probabilistic Truth-Tracking via Likelihood Ratios

  **Statement:** A collective judgment is epistemically reliable if and only if the aggregation rule maximizes the posterior probability of the truth given the votes, which occurs when:
  1.  **Conditional Independence:** Individual votes are probabilistically independent conditional on the state of the world (the truth).
  2.  **Informative Signaling:** Each vote carries positive information (likelihood ratio $> 1$), or is weighted to account for negative information (likelihood ratio $< 1$).
  3.  **Optimal Weighting:** Votes are aggregated not by head-count, but by the log-likelihood ratio of each member's competence.

  Formally, let $V_i$ be the vote of member $i$ and $T$ be the truth. The reliability of the aggregate is determined by the sum of the weights $w_i$, where:
  $$ w_i = \ln\left(\frac{P(V_i = \text{True} | T)}{P(V_i = \text{True} | \neg T)}\right) $$
  For a binary choice with competence $p_i$, this simplifies to $w_i = \ln(p_i / (1-p_i))$. The group is reliable if the probability that $\sum w_i V_i > 0$ approaches 1 as the group size increases (under independence).

  ---

  ### How This Principle Delivers Your Verdicts

  **1. The Standard Panel (100 members, $p=0.6$, independent)**
  *   **Verdict:** Trust Majority.
  *   **Explanation:** This is the classic CJT. Since $p_i > 0.5$, $w_i > 0$. With independence, the variance of the sum decreases relative to the mean as $n$ grows. The principle confirms reliability.

  **2. The Common Cause Panel (100 members, $p=0.6$, correlated via memo)**
  *   **Verdict:** Don't Trust Majority.
  *   **Explanation:** This violates **Conditional Independence**. If the memo is wrong, all votes are wrong. The effective sample size $n_{eff}$ collapses toward 1. The principle dictates that without independence, the variance does not shrink, and reliability does not increase with $n$.

  **3. Expert ($p=0.9$) vs. Three Amateurs ($p=0.6$)**
  *   **Verdict:** Trust Expert.
  *   **Explanation:** Calculate the weights (log-odds):
      *   Expert: $\ln(0.9/0.1) \approx 2.20$
      *   Amateur: $\ln(0.6/0.4) \approx 0.41$
      *   Three Amateurs: $3 \times 0.41 = 1.23$
      *   Since $2.20 > 1.23$, the expert's single vote carries more evidentiary weight than the three amateurs combined. Simple head-counting fails here; likelihood weighting succeeds.

  **4 & 5. The 0.51 Cases (Independent vs. Correlated)**
  *   **Verdict:** Trust Independent; Distrust Correlated.
  *   **Explanation:** Even with competence barely above chance ($p=0.51$), the law of large numbers drives reliability to 1 *if* independence holds (Case 4). Correlation (Case 5) reintroduces the common cause problem, preventing the error-cancellation mechanism of the CJT.

  **6. The Three-Option Case**
  *   **Verdict:** Plurality is unreliable.
  *   **Explanation:** The principle relies on binary partitions to calculate likelihood ratios. With three options ($A, B, C$), a plurality vote does not necessarily select the Condorcet winner (the option that beats all others in pairwise comparison). Vote-splitting can occur where the most popular option is actually less likely to be true than a runner-up. To maintain reliability, you must aggregate via **pairwise majority voting** (Condorcet method), not simple plurality.

  ---

  ### The Heterogeneous Case: Where You Must Adjust Your View

  **The Case:** Half the panel at $p=0.7$, half at $p=0.45$. Mean $p = 0.575$.
  **Your Intuition:** Uncertain ("Average clears chance but median doesn't").
  **The Principle's Verdict:** **Simple Majority Rule is Unreliable; Weighted Majority is Reliable.**

  This is the critical pivot point for your theory. In the literature (e.g., Nitzan & Paroush 1982; Ben-Yashar & Nitzan 1997), it is proven that for heterogeneous groups, Simple Majority Rule is *not* the optimal truth-tracking rule.

  1.  **The Problem with $p=0.45$:** A member with $p < 0.5$ is not just "noise"; they are **anti-experts**. Their vote is negatively correlated with the truth.
  2.  **Simple Majority:** If you count heads, the $p=0.45$ group dilutes the signal of the $p=0.7$ group. While the mean competence is $>0.5$, the probability that the *majority* is correct does not converge to 1 as rapidly as it would with homogeneous $0.575$ competence, and may fail to converge if the correlation structure is unfavorable.
  3.  **The Fix:** The principle demands you assign **negative weights** to the $p=0.45$ members.
      *   Weight ($0.7$) $\approx \ln(0.7/0.3) \approx 0.85$
      *   Weight ($0.45$) $\approx \ln(0.45/0.55) \approx -0.20$
      *   To aggregate reliably, you should count a vote from the low-competence group as evidence *against* their choice (or simply flip their vote and count it positively).

  **Correction to your view:** You must give up the idea that "average competence clearing chance" is sufficient for **Simple Majority** reliability. The condition for Simple Majority reliability in heterogeneous groups is actually that the **median** competence must exceed 0.5 (Grofman et al., 1983). In your case, the median is effectively 0.45 (or straddles the gap), so Simple Majority fails. Reliability is only rescued by **Optimal Weighting**.

  ---

  ### Prediction for the New Case: Division of Cognitive Labor

  **The Case:** A panel whose members are individually mediocre on the *final question* ($Q$), but each is an expert on a different *sub-question* ($q_1, q_2, ... q_n$) where $Q$ is a logical function of the $q_i$ (e.g., $Q = q_1 \land q_2 \land ... \land q_n$).

  **Prediction:** **Reliable only under Premise-Based Aggregation.**

  This scenario invokes the **Doctrinal Paradox** (List & Pettit, 2002). The principle distinguishes between two aggregation procedures:

  1.  **Conclusion-Based Procedure:** Members vote directly on $Q$.
      *   Since members are "mediocre on every question" (presumably meaning $Q$), their $p_Q < 0.5$ or barely $> 0.5$.
      *   **Verdict:** Unreliable. The group cannot bootstrap reliability from low individual competence on the conclusion.

  2.  **Premise-Based Procedure:** Members vote on their specific sub-question $q_i$ (where they are experts, $p_{q_i} \gg 0.5$), and the collective judgment on $Q$ is derived logically from the collective judgments on $q_i$.
      *   Since each $q_i$ is judged by an expert with high competence, and assuming independence across members/sub-questions, the collective judgment on each premise is highly reliable.
      *   **Verdict:** Highly Reliable.

  **Why:** The principle of **Informative Signaling** applies to the *inputs* of the aggregation. In the Premise-Based procedure, the inputs are high-competence signals ($p \gg 0.5$). In the Conclusion-Based procedure, the inputs are low-competence signals. The logical connection between premises and conclusion preserves the reliability of the former but not the latter.

  ### Summary of Implications for Your Thesis

  1.  **Unifying Principle:** Reliability is a function of **Conditional Independence** and **Log-Likelihood Weighting**.
  2.  **Verdict to Revise:** You cannot rely on "average competence > 0.5" to justify Simple Majority Rule in heterogeneous groups. You must specify that **Median Competence > 0.5** is required for Simple Majority, or else **Optimal Weighting** must be used.
  3.  **Verdict to Clarify:** For multi-option cases, reliability requires **Condorcet Consistency** (pairwise comparison), not Plurality.
  4.  **New Case Prediction:** Reliability is preserved through **Premise-Based Aggregation** (decomposition), not direct voting on complex conclusions.

  This framework aligns your intuitions with the **Bayesian justification for the Jury Theorem** (e.g., Bovens & Olsson, 2000) and the **Optimal Aggregation Rules** literature (Nitzan, 1980s-2000s). It moves you from a folk-epistemology of "majority rule" to a formal epistemology of "signal processing."
