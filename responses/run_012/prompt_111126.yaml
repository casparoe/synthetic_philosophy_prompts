answer: |-
  Dear Colleagues,

  It is a pleasure to contribute to your reading group on the badness of human extinction, and I have spent some time sketching the conceptual map you requested. To navigate the landscape of positions on what makes extinction bad over and above the deaths it involves, we must begin at the root of the tree with a question that separates the skeptics from the alarmists. Ask yourself whether extinction is bad only insofar as it kills people who are currently alive. If you answer yes, you arrive at the first leaf, which we might call the Person-Affecting Denial. This position holds that a world in which the last humans die peacefully, having lived out their lives, loses nothing of value compared to a world where humanity continues indefinitely. Its most awkward commitment is that there is no moral difference between a humanity that fades out contentedly after a final generation and one that flourishes for millennia, provided no one dies prematurely.

  If, however, you believe extinction involves an extra badness beyond the harm to existing individuals, you must proceed to the next node, which asks whether this extra badness requires a subject who is worse off. This is a crucial fork because it divides views that rely on welfare losses from those that rely on impersonal values. If you answer yes, the badness must fall on someone, you face a further question: does it fall on people now living or on people who would otherwise have lived? If you say it falls on people who would otherwise have lived, you land on the Totalist Reckoning. This view counts the lost welfare of future generations as a massive moral cost. Its most awkward commitment is that we are obligated to create more people even if their lives are barely worth living, provided the sum total of happiness increases. If you say instead that the badness falls on people now living, you arrive at Scheffler's Afterlife Conjecture. This view argues that our valuing practices presuppose a collective afterlife and that the prospect of extinction therefore damages the meaning of our present lives. Its most awkward commitment is that the value of your current loving relationship is partially contingent on strangers existing centuries after you die.

  If you answer no to the question of whether a subject is needed, you enter the realm of purely impersonal values, and here I have built the tree to force the choice you specifically care about regarding the source of the badness. You must ask whether what is lost is the value of the lives that would have been lived or the value of humanity as a kind. This distinction separates the badness that attaches to the absence of everything that would have followed from the badness that attaches to the ending itself. If you choose the value of the lives that would have been lived, you arrive at Impersonal Value Theory. This position holds that good experiences are valuable even if no one exists to possess them. Its most awkward commitment is that a universe containing beautiful sunsets and no one to see them is better than a void, even if there is no subject for whom it is better. I must flag here that this leaf is practically indistinguishable from the Totalist Reckoning in terms of policy implications, and I suspect many philosophers treat them as the same position despite the metaphysical disagreement about subjects.

  If you choose the value of humanity as a kind, you are claiming that the termination of the human story is bad in itself, regardless of the welfare sum. This leads to the Human Essentialism leaf. This view claims that humanity is an irreducible bearer of value. Its most awkward commitment is that we ought to prevent extinction even if the future humans would lead lives not worth living, simply to keep the chain of the species unbroken. From this node, there is one final question regarding successors: does it matter if we are succeeded by something better? If you say yes, you slide back toward Impersonal Value Theory, suggesting you care about consciousness rather than humanity specifically. If you say no, you remain at Human Essentialism, but this creates a combination that is rarely occupied without qualification. The diagnosis for the empty combination where one claims humanity is the value-bearer but successors do not matter even if morally superior is that it is unattractive to most cosmopolitans because it implies a form of human chauvinism that conflicts with the impartiality usually required by moral theory.

  There are other paths in this tree that remain empty, and they deserve a brief diagnosis so you do not waste time searching for proponents who do not exist. For instance, there is no stable position that claims the badness requires a subject but that the subject is humanity itself, because humanity is not a sentient entity that can be worse off in the requisite sense; this combination is empty because the view is incoherent. Similarly, there is no viable position that claims the badness attaches to the ending itself but that the timing of the end does not matter, because if the ending is what matters, its immediacy versus its distance must logically affect the magnitude of the loss; this combination is empty because the view is inconsistent. I am also confident that no one occupies the view that extinction is bad only because it kills existing people but that it matters if we are succeeded by something better, because if only existing people matter, successors are irrelevant; this combination is empty because the view is logically contradictory.

  I am moderately confident in this classification, perhaps around eighty percent, because the boundaries between impersonal value and totalist welfare are notoriously porous in contemporary ethics. The single placement I am least sure of is Scheffler's Afterlife Conjecture, because it is ambiguous whether the harm falls on existing people as psychological subjects or on the objective meaning of their projects, which might place it on the impersonal branch of the tree rather than the person-affecting one. I hope this prose map serves your group well as you dissect the various ways we might fear the end of the world.

  Warmly,

  Your Colleague
