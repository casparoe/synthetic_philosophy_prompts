  # DECISION THEORY READING GROUP: AMBIGUITY DIAGNOSTIC TREE

  **Instructions:** Answer the questions sequentially. Stop when you reach a leaf. Do not worry about which theoretical position a question implies; answer based on your intuitive judgment of the cases.

  ### LEVEL 1: THE BASELINE
  **Case 1 (Standard Ellsberg):** You face two urns. Urn A has 50 red, 50 black. Urn B has 100 balls, unknown proportion. You win $100 if you draw your chosen color.
  **Q1:** Do you strictly prefer Urn A for a bet on Red, AND strictly prefer Urn A for a bet on Black?
  *   **NO:** Go to **Level 2A**.
  *   **YES:** Go to **Level 2B**.

  ---

  ### LEVEL 2A (INDIFFERENT IN STANDARD)
  **Case 2 (100 Colors):** You face only Urn B, but it contains 100 possible colors, one ball drawn.
  **Q2A:** Do you assign exactly 1% probability to each color?
  *   **YES:** Go to **Level 3A**.
  *   **NO:** Go to **Level 3B**.

  ### LEVEL 3A (ASSIGNS 1%)
  **Case 9 (Experts):** Two experts give different probabilities (30% vs 70%) for a single event.
  **Q3A:** Is this mathematically identical to the unknown urn (Case 2)?
  *   **YES:** **LEAF 1: THE UNIFORM BAYESIAN.** (Beliefs are sharp; all uncertainty is risk).
  *   **NO:** **LEAF 2: THE SOURCE PLURALIST.** (Uncertainty types differ, but preferences remain complete).

  ### LEVEL 3B (ASSIGNS NO PROBABILITY)
  **Case 8 (Info Purchase):** You may pay to learn the color of one ball from Urn B before betting.
  **Q3B:** Do you pay even if the information cannot change which color you bet on?
  *   **YES:** **LEAF 3: THE SALIENCE AVOIDER.** (Ambiguity aversion is discomfort with ignorance, not a rational preference).
  *   **NO:** **LEAF 4: THE HARD AGNOSTIC.** (No probabilities exist, but no aversion is warranted).

  ---

  ### LEVEL 2B (AVERSE IN STANDARD)
  **Case 4 (Adversarial):** The experimenter chose Urn B's composition deliberately to minimize your win.
  **Q2B:** Is your caution *more* justified here than in the standard unknown urn (Case 1)?
  *   **YES:** **LEAF 5: THE STRATEGIC SKEPTIC.** (Ambiguity aversion is a rational response to hidden agency).
  *   **NO:** Go to **Level 3C**.

  ### LEVEL 3C (PURE AMBIGUITY)
  **Case 3 (Compound Lottery):** Urn B's composition was fixed by a fair coin (e.g., 30% Red or 70% Red, decided by toss).
  **Q3C:** Does your preference for the known urn disappear?
  *   **YES:** Go to **Level 4A**.
  *   **NO:** Go to **Level 4B**.

  ### LEVEL 4A (RISK ABOUT PROBABILITIES)
  **Case 6 (Repeated):** You place 50 bets on Urn B, re-mixed after every draw.
  **Q4A:** Do you treat the average payoff as more predictable than a single bet?
  *   **YES:** **LEAF 6: THE SMOOTH AVERTER.** (Ambiguity is a concave attitude toward a distribution of priors).
  *   **NO:** **LEAF 7: THE CORRELATION SKEPTIC.** (Ambiguity does not wash out in aggregates).

  ### LEVEL 4B (NON-REDUCIBLE AMBIGUITY)
  **Profile Check:** Consider three claims. Which **ONE** best describes your constraint?
  1.  **Case 7:** I would pay to flip a coin to decide my bet color rather than choose.
  2.  **Case 5:** I am more cautious betting on losses than gains in Urn B.
  3.  **Case 9:** I treat conflicting experts as a set of probabilities, not an average.
  *(If multiple apply, choose the one that forces you to change your bet size most.)*

  *   **CHOOSE 1 (Coin):** **LEAF 8: THE INDECISIVE AGENT.** (Preferences are incomplete; randomization dominates).
  *   **CHOOSE 2 (Losses):** **LEAF 9: THE LOSS-SENSITIVE AVERTER.** (Weights are non-additive; ambiguity interacts with valuation).
  *   **CHOOSE 3 (Experts-Set):** **LEAF 10: THE IMPRECISE PROBABILIST.** (Beliefs are sets; no single number is warranted).
  *   **CHOOSE 3 (Experts-Worst):** **LEAF 11: THE GUARDIAN.** (Reasoning proceeds by worst-case distribution over the set).
  *   **NONE APPLY:** **LEAF 12: THE RESIDUAL AVERTER.** (Aversion is primitive; not reducible to sets, losses, or randomization).

  ---

  ## POST-TREE ANALYSIS

  ### 1. Indistinguishable Leaves
  **Leaf 10 (Imprecise Probabilist) and Leaf 11 (Guardian).**
  *   **Problem:** In single-shot decisions without a requirement to bet, maximizing over a set of probabilities (Leaf 10) often yields the same choice as maximizing the minimum expectation (Leaf 11).
  *   **Required Case:** A dynamic choice problem where the agent can delay decision to gather information that might shrink the set. Leaf 10 might delay; Leaf 11 might act immediately if the worst-case is stable.

  ### 2. Empty Combinations
  **"Pay for Coin" (Leaf 8) + "Expert Average" (Leaf 6/1).**
  *   **Diagnosis:** **Incoherent.** If you are willing to pay to randomize (Case 7), you admit your preferences are incomplete or undefined. If you simultaneously treat expert disagreement as a single average (Case 9), you claim a determinate probability exists. You cannot hold that a number exists *and* that you cannot choose based on it without paying for a coin.

  ### 3. Leaf Commitments & Classification
  *(D = Descriptive, N = Normative, F = Formal)*

  | Leaf | Descriptive Name | Awkward Commitment | Stand |
  | :--- | :--- | :--- | :--- |
  | **1** | The Uniform Bayesian | Must treat a stranger's guess as identical to a known frequency. | N & F |
  | **2** | The Source Pluralist | Must explain why source matters if probabilities are sharp. | N & F |
  | **3** | The Salience Avoider | Admits rational agents should not feel the aversion they feel. | D |
  | **4** | The Hard Agnostic | Must act without beliefs, yet avoids the known urn. | N & D |
  | **5** | The Strategic Skeptic | Assumes nature is a minimizer even when no agent is present. | N |
  | **6** | The Smooth Averter | Must explain why ambiguity vanishes when risk is added. | F & N |
  | **7** | The Correlation Skeptic | Believes long-run frequencies do not stabilize subjective uncertainty. | D & N |
  | **8** | The Indecisive Agent | Will pay money to avoid exercising a free choice. | N & F |
  | **9** | The Loss-Sensitive Averter | Ambiguity attitude flips depending on gain/loss framing. | D & F |
  | **10** | The Imprecise Probabilist | May refuse a bet that is strictly positive in all scenarios. | F & N |
  | **11** | The Guardian | Ignores all distributions except the most hostile one. | N |
  | **12** | The Residual Averter | Posits a primitive psychological parameter with no structural basis. | D |

  ### 4. Case Usage Map
  *   **Case 1:** Level 1 (Root).
  *   **Case 2:** Level 2A.
  *   **Case 3:** Level 3C.
  *   **Case 4:** Level 2B.
  *   **Case 5:** Level 4B (Profile).
  *   **Case 6:** Level 4A.
  *   **Case 7:** Level 4B (Profile).
  *   **Case 8:** Level 3B.
  *   **Case 9:** Level 3A & Level 4B (Profile).
