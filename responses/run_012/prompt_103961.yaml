  Based on the eight cases and verdicts you provided, I have formulated a methodological principle that captures the logic underlying your intuitions. Your verdicts consistently distinguish between material patterns that can be explained by individual utility or accidental accumulation and those that require an explanation involving shared cognitive frameworks or social coordination.

  Here is the principle, its application to your cases, the prediction for your new test case, and a critical evaluation of its fit.

  ### The Principle of Relational Mediation

  **Statement:**
  Inferences about **beliefs** or **institutions** are licensed only when material remains mediate a relationship between **distinct ontological domains** (e.g., Living/Dead, Human/Cosmos, Individual/Collective) in a way that incurs **non-utilitarian cost** or **structural constraint**. When material remains reflect relationships within a single domain (e.g., Agent-Object, Object-Storage, Waste), inferences must be restricted to **practice** or **function**.

  **Clauses:**

  1.  **The Trans-Domain Clause (Belief):** If artifacts mediate a relationship between the living and the dead, or between human agents and independent natural cycles, infer cosmological belief or observational knowledge.
      *   *Motivating Cases:*
          *   **Case 1 (Burial + Ochre):** Mediates **Living/Dead**. The placement of valuables on a corpse removes them from economic circulation (non-utilitarian cost), signaling a belief in the dead's continued status or needs.
          *   **Case 3 (Solstice Stones):** Mediates **Human/Cosmos**. The alignment requires observation of an external natural cycle (structural constraint) that serves no immediate survival function.
          *   **Case 8 (Child Burial):** Mediates **Living/Dead/Social Status**. Similar to Case 1, the burial of a specific object type (toy) signals a social concept (childhood) attached to the ontological status of the child.
  2.  **The Social Scaling Clause (Institution):** If architecture or spatial organization necessitates labor coordination beyond the household unit and excludes domestic function, infer social institution or authority.
      *   *Motivating Cases:*
          *   **Case 6 (Public Building):** Mediates **Individual/Collective**. The scale implies coordination (institution), and the lack of domestic artifacts implies a non-household function (authority/gathering).
  3.  **The Intra-Domain Clause (Restriction):** If artifacts can be explained by individual utility, storage, waste, or decoration without bridging ontological domains, restrict inference to practice, function, or subsistence.
      *   *Motivating Cases:*
          *   **Case 2 (Cattle Figurines):** Relationship is **Object-Storage/Deposition**. Despite the "East-facing" orientation, they are in a pit (hidden), meaning they do not mediate a visible Human/Cosmos relationship like Case 3. They are depersonalized objects.
          *   **Case 4 (Incised Discs):** Relationship is **Agent-Object (Utility)**. Counting is a practical task. Using tokens does not require an abstract "concept of number" or mathematical institution, only a functional practice.
          *   **Case 5 (Midden):** Relationship is **Waste**. Accumulation is accidental/byproduct, not mediated.
          *   **Case 7 (Cave Painting):** Relationship is **Agent-Surface**. Image-making is a practice. Without contextual evidence of ritual use, "sympathetic magic" is an unnecessary ontological leap.

  ---

  ### Prediction for the Test Case

  **Case:** A pit containing twelve identical clay cylinders, each incised with a different number of lines, arranged in a circle, with no other artifacts.

  **Analysis using the Principle:**
  *   **Material:** Clay cylinders with lines (similar to Case 4 Discs).
  *   **Context:** Pit (similar to Case 2 Figurines).
  *   **Arrangement:** Circle (similar to Case 3 Stones, but without specified astronomical alignment).
  *   **Mediation Check:**
      *   *Living/Dead?* No human remains.
      *   *Human/Cosmos?* A circle is a geometric shape, not necessarily an astronomical alignment (unlike Case 3's solstice sunrise). Since they are in a pit, they do not interact with light or landscape visibly.
      *   *Individual/Collective?* Small scale (12 items), likely manageable by a small group or individual, unlike Case 6's large building.
      *   *Utility?* The lines suggest counting/recording (Case 4). The circle suggests deliberate arrangement (Case 2).

  **Verdict:**
  You can infer **deliberate deposition** and a **counting or recording practice**. You **cannot** infer a formal mathematical institution, an astronomical belief system, or a ritual cult. The "circle" arrangement, lacking specific celestial alignment or public visibility, falls under the **Intra-Domain Clause** (Object-Object arrangement) rather than the Trans-Domain Clause. It is functionally equivalent to the "East-facing" figurines in Case 2: a standardized pattern that implies rule-following but not necessarily cosmological belief.

  ---

  ### Accommodation and Critical Advice

  **Does the principle accommodate your verdicts?**
  The Principle of Relational Mediation accommodates **all eight** of your current verdicts. It successfully explains why you treat the Solstice Stones (Case 3) differently from the Incised Discs (Case 4) (Cosmos vs. Utility), and why you treat the Burial (Case 1) differently from the Figurine Pit (Case 2) (Living/Dead Mediation vs. Object Storage).

  **Which verdict is most vulnerable?**
  While the principle fits all your verdicts, **Case 2 (The Cattle Figurines)** is the most logically fragile point in your system, and you should be prepared to revise this verdict if your definition of "Mediation" tightens.

  *   **The Tension:** You deny "belief" for the East-facing figurines (Case 2) but accept "knowledge" for the Solstice stones (Case 3). The Principle saves this distinction by emphasizing that the Stones interact with the *visible* sun (Human/Cosmos), while the Figurines are hidden in a pit (Object/Earth).
  *   **The Risk:** If future analysis suggests the "East-facing" orientation in the pit was intended to symbolically align with the sun (even if hidden), this becomes a **Trans-Domain** relationship. If you accept that symbolic orientation counts as mediation, the Principle would force you to infer a belief system for Case 2.
  *   **Advice:** Keep the **Principle**, but be willing to give up the **Case 2 Verdict** if evidence of symbolic intent emerges. The Principle is robust because it prevents over-interpretation in Cases 4, 5, and 7, which is the primary goal of your methods paper. Case 1 (Afterlife) is also a high-risk inference philosophically, but the Principle protects it by strictly limiting such inferences to *burial contexts* where economic utility is negated.

  **Summary for your Paper:**
  Adopt the **Principle of Relational Mediation**. It provides a clear criterion for distinguishing "practice" from "belief": look for material evidence that bridges ontological gaps (Life/Death, Human/Nature, Individual/Group) at a cost to practical utility. This will allow you to systematize your judgments without falling into the trap of either radical skepticism (inferring nothing) or projective interpretation (inferring everything).
