answer: |-
  # PREPARATION DOCUMENT: HUME & THE CALIBRATION PROBLEM

  ## STRATEGIC CONCESSIONS
  *Do not fight these battles. Concede them early to buy goodwill and focus the discussion on your core mechanism.*

  1.  **Concede to the Historian:** Admit immediately that Hume uses the language of probability and "proof." Do not claim Hume *never* thought in probabilistic terms. Claim only that the *decisive* move in Section X is structural (about the nature of the evidence class) rather than calculative (about the specific values).
      *   *Why:* This disarms the Historian's pedantry and prevents them from spending 20 minutes on textual exegesis.
  2.  **Concede to the Formal Epistemologists:** Admit that your argument can be *modeled* in Bayesian terms. Do not claim it is "anti-Bayesian." Claim it is "pre-Bayesian": it identifies a condition required *before* one can assign the likelihood values the Bayesian model requires.
      *   *Why:* If you deny Bayes, they will spend the hour trying to force your terms into their equations. If you accept Bayes but claim you are identifying a parameter failure, they have to engage with your specific point about calibration.

  ---

  ## ANTICIPATED OBJECTIONS
  *Ordered by likelihood and potential damage.*

  ### 1. The "It's Just Bayes" Objection
  **Who:** The Formal Epistemologists (2 people).
  **Likelihood:** Very High.
  **Damage:** Critical (Threatens the novelty of the thesis).
  **Phrasing:** "You say this isn't about likelihood ratios, but it looks like you're just saying the false-positive rate $P(Report|No Miracle)$ is undefined or effectively 1. If you plug 'undefined' into a Bayesian model, you get no result. That's not a new argument; it's just a statement of parameter uncertainty. Why isn't this simply the standard likelihood-ratio reading with a confession that we lack data?"

  **Your Reply (2 mins):**
  "Standard Bayesian reconstructions assume we can meaningfully discuss the likelihood of the report given the hypothesis, even if that likelihood is low. My claim is stronger: for law-violating events, the reference class required to generate that likelihood *cannot be formed*. To calculate an error rate, you need a set of instances where you know the truth value. For miracles, by definition, we never have independent verification of the truth value. This isn't just that the probability is low or uncertain; it's that the frequency data required to ground the probability is structurally inaccessible. I'm not offering a different calculation; I'm arguing the calculation is illegitimate because the variables are ungrounded."

  **Thin Spot:**
  You must be prepared for them to argue that "subjective Bayes" allows priors/likelihoods without frequentist grounding. If they insist probability is degrees of belief, not frequencies, your "calibration" requirement looks like an unjustified frequentist constraint. *Prep:* Be ready to argue that testimony evaluation *requires* empirical track-records, not just subjective confidence.

  ### 2. The "Proves Too Much" Objection
  **Who:** The Philosopher of Religion.
  **Likelihood:** High.
  **Damage:** Fatal (Threatens the viability of the conclusion).
  **Phrasing:** "You claim this generalizes to any singular, unrepeatable event without independent checks. But that includes most historical events—the Battle of Hastings, the existence of Socrates. We have no independent access to those now. If your argument holds, we can't believe in history either. If you say it *doesn't* hold for history, what is the principled difference between a singular historical event and a singular miracle report?"

  **Your Reply (2 mins):**
  "The difference lies in the causal network. Singular historical events (Hastings) are consistent with the laws of nature; they fit into a web of causal expectations (armies move, battles leave debris, chroniclers write). We can calibrate testimony about battles because we know how battles generally work and how chroniclers generally err. A miracle report claims a *break* in that web. To calibrate testimony about a law-violation, we would need to know how often testimony reports law-violations when none occurred. But we can't identify 'false law-violations' without knowing the laws hold universally—which is exactly what the miracle report challenges. History relies on the uniformity of nature; miracles claim an exception to it. You can calibrate the former; you cannot calibrate the latter."

  **Thin Spot:**
  The boundary is fuzzier than you'd like. What about reports of highly anomalous natural events (e.g., a man surviving a fall from a plane without a parachute)? Is that a "law violation" or just a "rare event"? If you say "rare," your argument loses force. If you say "violation," you risk skepticism about anomalies. *Prep:* Have a clear definition of "Law" ready (strict universal vs. statistical).

  ### 3. The "Multiple Witnesses" Objection
  **Who:** Grad Students / Generalists.
  **Likelihood:** Medium.
  **Damage:** Moderate (Threatens the scope).
  **Phrasing:** "What if we have ten independent witnesses? Surely the probability of ten people independently making the same error is low enough to overcome the calibration problem. Doesn't convergence solve the lack of independent access?"

  **Your Reply (2 mins):**
  "Convergence only helps if we know the witnesses are independent. To know they are independent, we need to know the error rate of witnesses in *this specific domain*. If I don't know how often people hallucinate levitation, I don't know if ten reports are ten independent events or one cultural contagion. Without the calibration of the error rate for *this kind of event*, you cannot calculate the probability of collusion or common cause. The convergence argument presupposes the very data the Calibration Problem says is missing."

  **Thin Spot:**
  This sounds dogmatic. Intuitively, 10 witnesses *do* feel stronger than 1. You risk looking like you are rigging the game against the miracle. *Prep:* Acknowledge the intuition but insist it is psychologically compelling but epistemically ungrounded without base rates.

  ### 4. The "Textual Fidelity" Objection
  **Who:** The Historian of Early Modern Philosophy.
  **Likelihood:** Medium.
  **Damage:** Low/Medium (Threatens the framing, not the logic).
  **Phrasing:** "Hume talks about 'proof' against 'probability.' He frames this as a contest of opposing evidences. Your calibration reading is elegant, but does it actually map to the text, or is it a rational reconstruction that uses Hume as a mouthpiece for a modern problem?"

  **Your Reply (2 mins):**
  "It is a rational reconstruction. I am not doing exegesis; I am mining the argument for its strongest philosophical form. The standard Bayesian reading is also a reconstruction. My claim is that the Calibration reconstruction captures the *force* of Hume's intuition—that something is structurally wrong with miracle testimony—better than the probabilistic reading, which gets bogged down in assigning values Hume never intended us to calculate."

  **Thin Spot:**
  If the Historian has a specific passage where Hume explicitly discusses error rates or calibration, you will look foolish. *Prep:* Scan the *Enquiry* Section X for any mention of "experience of testimony" vs. "experience of the fact."

  ---

  ## THE PAPER-SINKER
  **If you fumble this, the paper is dead.**

  **The Objection:** (From the Formal Epistemologist, following up on Objection 1).
  **The Trap:** "You say we need independent access to the truth of the event to calibrate the error rate. But we have independent access to the *falsity* of miracle reports all the time. Every time someone reports a miracle and we find a natural explanation, that's a data point. We have a massive database of false miracle reports and zero confirmed true ones. Doesn't that give us a calibration? The error rate is 100% so far."

  **Why it sinks you:** If they have a database of false reports, you *do* have a reference class. You can calculate a likelihood ratio. Your claim that the data is "structurally inaccessible" is false. You are left with a standard inductive argument ("miracles never happen"), not a structural Calibration Problem.

  **The Defense:**
  "You have a database of reports *we have debunked*. To calculate the error rate of testimony regarding *actual* miracles, you need to know the rate of false reports among *actual* miracles. If no miracles have occurred, your sample is biased. You are calculating the reliability of testimony about *alleged* miracles, not testimony about *miracles*. If a miracle *did* occur, would testimony report it? We don't know, because we have no confirmed instances in the 'True Miracle' column. Without a positive instance, you cannot calculate the False Negative rate, and thus cannot calibrate the test."

  **Prep:** Be very sharp on the distinction between $P(Report|No Miracle)$ and $P(Report|Miracle)$. They will try to conflate them.

  ---

  ## THE QUESTION I HOPE NOBODY ASKS

  **The Question:**
  "If a law is defined by uniform experience, and a miracle is a violation of a law, then a confirmed miracle simply proves the law was not a law. So, on your view, if we *could* calibrate the testimony and confirm the event, we would just have to update our laws of nature. But if we can't calibrate the testimony, how do you know the event *would* be a violation? Aren't you assuming the very uniformity of nature you're trying to protect?"

  **Why I fear it:**
  This attacks the definition of "Law" at the heart of the Calibration Problem. If "Law" is just "what we haven't seen an exception to yet," then the Calibration Problem is circular: it assumes laws are immutable to prove we can't know if they are violated. If I admit laws are revisable, the "structural impossibility" of calibration weakens. If I deny laws are revisable, I look dogmatic.

  **Contingency Plan:**
  If asked, pivot to Hume's definition: A law is established by *firm and unalterable* experience. A miracle is not just an anomaly; it is a contradiction of that experience. The Calibration Problem isn't about whether laws *could* change; it's about whether testimony is the right *mechanism* to establish that change. Testimony relies on experience; it cannot overthrow the very experience that grounds its reliability. (This is the "Humean Circle" defense. It's risky, but it's the only one available).
