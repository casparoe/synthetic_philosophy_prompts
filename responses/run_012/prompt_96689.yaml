answer: |-
  You press me with considerable force, and I am sensible that in your scheme you have sought to separate the question of distribution from those habits of communal living which I have deemed premature. It is true that I have held the existing distribution of property to be largely a matter of human institution, and often one that fails to reward the industrious or punish the idle; on that ground, I yield to you. The present system often allows the landlord to reap where he has not sown, and this is a defect in justice that no friend of mankind can ignore. Yet, you assert that this plan requires no prior improvement in character, and here I must pause to examine the machinery you propose with the utmost care. If the State appropriates a fixed share of profits to distribute as a dividend, it acts directly upon the motives to accumulation. The capital which employs labour is the result of abstinence; if the reward for that abstinence is diminished by a claim from the general fund, will the capitalist continue to save with the same vigour? If the fund of capital shrinks, wages must fall, and the labourer suffers precisely those whom you intend to aid.

  Moreover, you suggest that character need not be improved to receive this bounty, but I ask you: does the receipt of unearned remuneration tend to foster that prudence and self-reliance which are the bedrock of a free people? I fear that while you avoid the communism of goods, you introduce a dependency upon the State which may enfeeble the moral muscle required to sustain any liberty at all. I am not opposed in principle to sharing the fruits of industry more equitably, for the laws of distribution are indeed within our power to alter. But if the method undermines the production of those fruits, or the virtue of those who consume them, have we not gained a present relief at the cost of future prosperity? I pray you, consider whether the motive to accumulate remains intact under such a levy, for without accumulation, the wages of labour cannot be sustained.
