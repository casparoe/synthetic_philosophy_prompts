  As for this distinction between a means and a "price you are prepared to pay"—do you imagine morality cares for such verbal subtleties? If the end is to break the government's will through terror, and the terror relies on the destruction of life, then the destruction of life is instrumental. But let me be plainer still, since you ask for my premises: I hold that it is always forbidden to deliberately kill the innocent. "Deliberately" here means "choosing to do an act which is such killing," regardless of whether the death is the end, the means, or merely the accepted cost. If you choose the act, you intend the killing. You say I cannot know his will? I know he signed the order. I know the bomb kills. I know he knew it. What more do you require? A confession written in blood?
