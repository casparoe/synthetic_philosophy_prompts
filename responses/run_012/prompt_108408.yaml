  I am a novelist, and the problem that keeps me at my desk after midnight is not whether minds are physical—I grant that they are—but whether the explanatory style I cannot help using is a crane or a skyhook. Let me state the question as precisely as I can. Define a skyhook as an explanatory posit that does genuine work but is not itself the product of an ordinary causal process; define a crane as an explanation that builds a higher-level capacity out of lower-level materials without importing anything irreducible; and define the novelist's remainder as that aspect of an intentional action which seems to survive even after all the causes of the action have been specified—namely, that the agent took a consideration to justify the act, and not merely to cause it. Proposition P: For every human capacity that currently appears to require a skyhook—phenomenal experience, first-person agency, the normative force of reasons, the felt authority of a moral demand—there exists in principle a crane explanation of that capacity, and the availability of that explanation would count as explaining the capacity rather than explaining it away. Please give me your credence in P as a number between 0 and 1, and decompose it into the sub-questions on which it depends. At minimum: the probability that the crane/skyhook distinction can be drawn precisely enough to sort actual explanations rather than merely to express a temperament; the probability that greedy reductionism names a real and avoidable error distinct from ordinary reductionism; the probability that the capacities I have listed are sufficiently unified that one answer covers them all; the probability that the novelist's remainder is a genuine explanatory remainder rather than an artifact of description; the probability that the in-principle clause makes P unfalsifiable and therefore should not raise our credence; and any further term you think belongs. For each, give a number and one line of justification, then show how you