answer: |-
  **Project Title:** The Agenda Effect: Endogenous Question Selection and the Limits of Epistemic Majority Rule

  **1. Research Question and Objective**
  The standard epistemic defence of majority rule relies on the Condorcet Jury Theorem (CJT). The theorem demonstrates that if individual voters are more likely than not to be correct ($p > 0.5$) and vote independently, the probability of a correct majority decision approaches certainty as the group size increases. This project challenges the stability of the competence parameter ($p$) within this framework.

  Current formulations treat competence as a property of the voter and independence as a property of the vote. I propose that both are properties of the *(voter, question)* pair. Consequently, the reliability of a body depends not only on the voters' capacities but on the distribution of question difficulties they face. Since legislative bodies control their own agendas, the set of questions reaching a vote is not a random sample of all possible questions; it is a filtered subset selected by the very mechanism whose reliability is in question.

  The research question is: **Under what formal conditions does the endogeneity of the legislative agenda systematically bias the distribution of question difficulty such that the asymptotic reliability of majority rule fails to obtain?**

  The objective is to determine whether the mechanism of agenda selection acts as a negative filter on aggregate competence. If a body tends to select questions on which its competence is lower than its average competence across all potential questions, the CJT's convergence guarantee may be voided, even if the body is generally competent.

  **2. Gap in Existing Literature**
  Existing defences of epistemic democracy address the *composition* of the electorate (e.g., education, diversity) or the *structure* of voting (e.g., deliberation, weighting). They largely treat the agenda as exogenous. Formal social choice theory models agenda control extensively, but typically in terms of strategic manipulation or stability (e.g., cycling majorities), not epistemic quality.

  This leaves a critical gap: the interaction between *agenda power* and *epistemic quality*. Standard models assume a fixed $p$. By treating $p$ as a variable dependent on the selection mechanism ($p_{selected}$ vs. $p_{potential}$), this project moves beyond the question of whether voters are competent to the question of whether the system selects questions they are competent to answer. Familiar positions leave this open because they assume the "truth" of the matter is external to the procedure, whereas in political reality, the difficulty of the question is often a function of why it was raised (e.g., high-salience, polarized issues are often technically complex).

  **3. Methodology: A Formal Approach**
  This project will employ formal modelling rather than case-based analysis. While case studies can illustrate instances of failure, they cannot establish the *structural* conditions under which the epistemic defence collapses. The CJT is a limit theorem; to challenge it, one must demonstrate a divergence in the limit, not merely a contingent error in practice.

  A case-based approach would miss the asymptotic dimension. It could show that a specific parliament made a bad decision on a specific issue, but it could not show that the *mechanism* of agenda selection makes bad decisions probable in the long run. Only a modified convergence result can determine if the "agenda effect" is a noise term that washes out in large numbers or a systematic bias that compounds.

  The model will define a universe of potential questions, each with an associated difficulty level and a corresponding competence distribution for the voting body. An agenda-setting function will then be introduced, mapping the body's preferences or attention to the probability of a question reaching a vote. The core task is to derive the relationship between the agenda-setting function and the expected competence of the selected subset.

  **4. Expected Results and Concrete Application**
  The most plausible shape of the result is a **Threshold Theorem**. I anticipate demonstrating that if the correlation between question salience (probability of selection) and question difficulty exceeds a specific threshold, the aggregate competence of the selected agenda drops below $0.5$, causing the probability of a correct majority decision to approach zero rather than one as the body grows.

  **Concrete Case:** Consider a legislature deciding on nuclear waste storage sites.
  *   *Standard CJT Verdict:* If legislators are generally rational and informed ($p > 0.5$), a large legislature will reliably identify the safe sites.
  *   *Revised Model Verdict:* The agenda is driven by public pressure. Public pressure is highest where the risk is most visible, not necessarily where the technical data is clearest. The agenda selects "high-visibility" questions. On high-visibility questions, ideological polarization is high, and technical nuance is low, driving individual competence ($p$) down to $0.4$. On low-visibility technical questions, competence remains at $0.6$, but these never reach a vote.
  *   *Outcome:* The standard defence predicts reliability. The revised model predicts that the specific subset of questions actually voted on will yield systematic error, regardless of the legislature's size. The body is reliable in the abstract but unreliable in practice because it filters for questions it is ill-equipped to answer.

  **5. Conditions for Project Failure**
  This project fails if the formal derivation shows that agenda selection is neutral with respect to competence. Specifically, failure is defined by either of the following outcomes:
  1.  **Neutrality Proof:** Demonstrating that for any reasonable agenda-setting function, the expected competence of the selected questions equals the expected competence of the potential universe ($E[p_{selected}] = E[p_{potential}]$).
  2.  **Negligible Deviation:** Showing that while selection bias exists, it diminishes sufficiently fast as group size increases that the asymptotic convergence to correctness remains intact.

  If either condition holds, the "unease" regarding the standard defence is merely psychological, not mathematical, and the standard epistemic defence stands robust against agenda effects.

  **6. Work Plan and Timeline (12 Months)**

  *   **Months 1–3: Model Construction.** Define the state space of questions and the competence distribution function. Formalize the agenda-setting mechanism as a probability function over the state space.
  *   **Months 4–6: Derivation and Simulation.** Attempt to derive the convergence conditions. Run Monte Carlo simulations to test boundary conditions where analytic solutions are intractable.
  *   **Month 7: Kill Point.** **Decision Gate.** If simulations and preliminary derivations show no significant divergence from standard CJT results (i.e., agenda bias does not materially impact asymptotic reliability), the project will be terminated or radically re-scoped to a qualitative critique. Continuing to force a formal result where none exists is a misuse of fellowship time.
  *   **Months 8–9: Interpretation.** If the Kill Point is passed, interpret the mathematical results in the context of democratic theory. Refine the "Threshold Theorem."
  *   **Months 10–11: Case Integration.** Apply the derived thresholds to historical or institutional data (e.g., referendum topics vs. committee reports) to illustrate the model's explanatory power.
  *   **Month 12: Writing and Dissemination.** Finalize the paper for submission to a leading journal in political philosophy or social choice theory. Prepare a conference presentation.

  **7. Conclusion**
  The epistemic defence of democracy is too important to rest on an assumption of exogenous questions. By modelling the agenda as an endogenous filter on competence, this project seeks to refine the conditions under which we can trust collective judgment. It moves the debate from "are voters smart enough?" to "does the system ask questions they can answer?" The deliverable will be a rigorous determination of whether the machinery of democracy inherently selects for its own epistemic failure.
