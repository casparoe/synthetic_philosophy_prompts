          *   **Dana (Realist/Causal Integrationist):** "Object" tracks mind-independent causal knots. Parts must mutually adjust. Boundaries are where causal interaction stops.
      *   **Task:** Provide a "move-by-move verdict" rather than declaring a winner.
      *   **Specific Questions to Address:**
