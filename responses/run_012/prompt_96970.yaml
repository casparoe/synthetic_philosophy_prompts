answer: |-
  **Project Title:** Fidelity, Reconstruction, and the Threshold of Cumulative Cultural Evolution

  **Project Summary**
  The standard account of cumulative cultural evolution (CCE) posits a fidelity threshold: cultural accumulation requires transmission mechanisms faithful enough to prevent improvements from dissipating. Distinctively human capacities—imitation, teaching, norm enforcement—are typically invoked as the mechanisms that push transmission across this threshold. My project challenges the conceptual coherence of this threshold claim when applied to *reconstructive* transmission. In domains like folktales, recipes, and ritual sequences, receivers do not copy high-fidelity replicas; they rebuild items from partial cues using systematic inferential biases. The standard repair is to argue that content biases converge on stable "attractors," supplying the invariance that channel fidelity lacks. I suspect this repair conflates the fidelity of the transmission channel with the stability of the transmitted trait. If trait stability is defined by the attractor, the threshold claim risks becoming tautological (traits accumulate because they are stable) or untestable (because trait individuation is adjusted post hoc to match the bias).

  My central research question is: **Can the high-fidelity threshold for cumulative cultural evolution be formulated independently of trait-individuation criteria, or is the standard framework conceptually unstable when applied to reconstructive transmission?** I aim to determine whether the threshold claim can be restated to remain substantive without presupposing a specific way of individuating traits, or whether the interdependence of trait-individuation and transmission bias renders the question ill-formed.

  **Literature Context and Theoretical Gap**
  Current literature generally divides into two camps. The first, often aligned with gene-culture coevolutionary models, argues that without high-fidelity copying mechanisms, cultural information degrades too rapidly for ratcheting to occur. This position treats cultural traits analogously to genes, requiring discrete, replicable units. The second camp, drawing from cognitive anthropology and attraction theory, argues that high-fidelity copying is neither necessary nor common. Instead, they posit that recurrent cognitive biases guide reconstruction toward stable forms, allowing accumulation despite noisy transmission.

  The friction arises when these positions interact. The "high-fidelity" camp often dismisses reconstructive cases as non-cumulative or qualitatively different, while the "attraction" camp often relies on outcome stability to proxy for transmission fidelity. Neither side adequately addresses the dependency between how we *individuate* a trait (what counts as "the same" folktale or recipe across time) and the *biases* assumed to stabilize it. If the criteria for trait identity shift to accommodate the observed stability, the threshold claim loses its explanatory power. My project isolates this conceptual slippage. It does not seek to settle the empirical debate about which mechanisms exist, but to clarify the conditions under which claims about those mechanisms are meaningful.

  **Methodology: Conceptual Analysis vs. Formal Modeling**
  I will employ conceptual analysis grounded in the philosophy of biology and cognitive science. A formal modeling approach, while powerful for exploring dynamics, is inappropriate for this specific problem. Models require parameters for trait identity and transmission error to be fixed *ex ante*; they quantify the consequences of assumptions but cannot interrogate the assumptions themselves. Building a model now would presuppose the very solution I am questioning—namely, that trait individuation is independent of transmission bias. Similarly, transmission chain experiments test specific psychological mechanisms but cannot resolve the logical relationship between fidelity, stability, and individuation.

  My method is to reconstruct the logical architecture of the threshold claim. I will analyze the necessary conditions for "cumulative selection" under reconstructive transmission and test them for vacuity. This is a prerequisite for productive modeling or experimentation; until we agree on what counts as a trait and what counts as fidelity, empirical results will remain ambiguous, as evidenced by the persistent talking-past-each-other in current debates.

  **Comparative Case-Study Component**
  To stress-test the conceptual framework, I will apply it to two distinct transmission ecologies: **North American folktales** and **liturgical ritual sequences**. Folktales represent a high-reconstruction ecology with strong content biases; rituals are often cited as high-fidelity domains due to normative enforcement. I will use existing ethnographic and historical descriptions (collecting no new data) to examine how trait identity is established in each domain.

  I must be honest about the argumentative weight of these cases: they are not empirical proofs. They cannot demonstrate that the threshold claim is false in the world. Rather, they serve as *conceptual intuition pumps*. If the standard CCE framework cannot consistently describe the accumulation of stability in folktales without redefining the tale's identity at every step, or if it treats ritual stability as "fidelity" only by ignoring reconstructive elements, this reveals a flaw in the framework's logic, not necessarily in the cultural histories themselves. The cases are decoration only if one expects empirical generalization; they are substantive if one accepts that conceptual clarity requires testing against concrete descriptions.

  **Work Plan (12 Months)**
  *   **Months 1–3:** I will map the logical space of the fidelity threshold. I will formalize the distinction between channel fidelity and trait stability using existing philosophical literature on information and function.
  *   **Months 4–6:** I will draft the core argument regarding trait-individuation dependence. *Abandonment Criterion:* If by Month 6 I cannot articulate a version of the threshold claim that distinguishes fidelity from stability without relying on circular trait definitions, I will abandon the attempt to "repair" the claim. I will pivot to arguing that the question is ill-formed and propose a dissolution of the fidelity threshold concept in favor of a stability-first framework.
  *   **Months 7–9:** I will apply the refined (or dissolved) framework to the folktale and ritual case studies. This involves analyzing secondary literature to trace how "same trait" judgments are made in these domains.
  *   **Months 10–12:** I will finalize the dissertation chapter and prepare a manuscript for submission to a journal in philosophy of biology or biological theory.

  **Outcomes and Criteria for Success**
  A successful result will be a criterion for cumulative selection under reconstructive transmission that is non-vacuous. Specifically, I aim to produce an argument showing that accumulation can be distinguished from mere stability without presupposing replicative copying. This would allow the CCE framework to encompass reconstructive domains without trivializing the fidelity requirement.

  The project fails if I demonstrate that trait-individuation and transmission bias are necessarily entangled such that no independent variable for "fidelity" can be isolated. However, even this "failure" is a substantive philosophical result: it would indicate that the current framing of CCE is category-mistaken and requires a fundamental restructuring rather than patching. Either outcome resolves the conceptual impasse preventing productive dialogue between modeling and anthropological approaches.
