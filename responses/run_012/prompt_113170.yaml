prompt: |-
  Canada's answer to the Quebec question has hardened into something like a doctrine, and I would like to know what it commits us to. The Supreme Court's secession reference holds that Quebec has no right to leave unilaterally, but that a clear majority on a clear question would put the other parties under an obligation to negotiate; the Clarity Act that followed gives the federal House of Commons the power to rule, before the vote is held, on whether a referendum question is clear enough, and it leaves the House to judge whether the majority is clear enough as well, with no threshold written into the statute. The same government, meanwhile, recognized Kosovo's unilateral declaration of independence without much agonizing; and when the Cree and the Inuit of Nunavik made the same argument one level down, that they too were a people whose consent was required, nobody took it to be a claim of the same kind.

  What theory of self-determination does this practice presuppose? On its face it looks like a remedial or negotiated view: a people's right is not to leave but to be taken seriously as a claimant, and the claimant is fixed by existing provincial boundaries, since no one below the province votes on whether the province goes. Are those two commitments a single package or two separable ones, and is either really required, or would other theories license the same practice just as well? Does the doctrine need the idea that a bare majority can never dissolve a state while a clear majority can, and if so, what is doing the work in the word clear, legitimacy, prudence, or a hidden supermajority rule? I would like the implicit theory reconstructed, the rival views it quietly rules out identified, and an honest account of where the practice is merely underdetermined rather than committed. Then tell me what would have to change in the practice if we replaced the implicit view with a plain right of any self-defined majority to secede, or with an absolute rule that existing borders are never redrawn. No citations needed. Please answer in continuous prose, without headings, bullet points, bold text, or tables.
