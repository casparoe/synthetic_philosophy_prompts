answer: |-
  The Canadian approach to secession constitutes a distinctive hybrid theory that might be best described as democratic federalism with a procedural bias toward stability. It rejects the notion that sovereignty resides inherently in any sub-national group such that they might withdraw at will, yet it simultaneously rejects the idea that the federation is an indissoluble prison. This practice presupposes a theory where the right to self-determination is not a primary right to exit but a secondary right to trigger a constitutional renegotiation. The underlying logic is that the legitimacy of the state rests on the continued consent of its constituent parts, but that consent is mediated through established institutions rather than raw plebiscitary power. By denying a unilateral right to leave while affirming an obligation to negotiate following a clear democratic expression, the doctrine treats secession not as an external act of sovereignty but as an internal act of constitutional amendment. This frames the secessionist movement not as a foreign adversary but as a domestic partner with a grievance that must be addressed through the existing political order, thereby preserving the rule of law even while contemplating its own dissolution.

  The commitment to provincial boundaries as the defining unit of the people is a crucial and separable component of this theory, one that serves to stabilize the geometry of the federation. By recognizing Quebec as a potential secessionist unit while rejecting similar claims from the Cree or Inuit within Quebec, the practice establishes that the right to trigger negotiation belongs to the administrative units of the federation, not to ethnic or cultural groups that overlap them. This rules out a theory of nested self-determination where any distinct people within a territory could fracture the province further. It is a pragmatic commitment to administrative clarity over ethnic purity, ensuring that if a separation occurs, it happens along lines that are already legally and politically defined. This commitment is not strictly required by the logic of negotiated secession, as one could imagine a theory where any coherent community could petition for independence, but it is required by the logic of federal stability. Without this boundary fixation, the threat of infinite fragmentation would likely paralyze the negotiation process, giving minority groups within the seceding province a veto that could be used to hold the larger population hostage.

  The requirement for a clear majority on a clear question functions as a legitimacy filter rather than a strict supermajority rule, though the distinction is often blurred in practice. The word clear does work related to prudence and legitimacy, signaling that the decision to break the constitutional order must be enduring and unambiguous enough to outweigh the inherent value of political continuity. It implicitly acknowledges that a bare majority might be transient or the result of a misleading question, and since the cost of secession is irreversible and high, the threshold for initiating the process should reflect a profound shift in the political landscape. However, by refusing to codify a specific percentage, the doctrine leaves the determination to the political judgment of the House of Commons, which introduces a element of partisan calculation into what is ostensibly a neutral constitutional principle. This suggests the theory relies on the good faith of federal institutions to act as honest brokers, a assumption that is itself a point of vulnerability. The practice is underdetermined regarding what happens if negotiations fail, as the Supreme Court specified an obligation to negotiate but not an obligation to agree, leaving the possibility that a clear majority could be met with a stalemate that resolves nothing and satisfies no one.

  This implicit theory quietly rules out three rival views of self-determination. First, it rejects the primary right theory, which holds that any self-defined people have an inherent moral right to secede regardless of the consequences or the existing constitutional order. Second, it rejects the absolute statist view that existing borders are sacrosanct and that no internal group has any moral claim to alter them, a view that would render the obligation to negotiate meaningless. Third, it distinguishes itself from a strict remedial theory, which would only permit secession in cases of gross human rights violations or oppression. While Canada recognized Kosovo under a remedial logic internationally, domestically it maintains that Quebec need not prove oppression to trigger negotiations, only democratic will. This distinction highlights that the domestic doctrine is about managing a voluntary partnership, whereas the international stance is about managing humanitarian crises in failed states. The Canadian practice thus occupies a middle ground where secession is permissible without cause but is made difficult by procedure, aiming to balance the democratic will to leave against the collective interest in staying.

  If the implicit view were replaced with a plain right of any self-defined majority to secede, the practice would change fundamentally by removing the federal government's gatekeeping role. Under such a regime, the clarity of the question and the size of the majority would be determined solely by the secessionist entity, and the federal obligation to negotiate would be replaced by an obligation to recognize. This would likely lead to a proliferation of referendums with lower thresholds, increasing the volatility of the federation and encouraging strategic timing of votes to maximize short-term advantages. The definition of the people would also become contested, potentially allowing sub-provincial regions to claim their own right to leave, leading to a fracturing of territory that the current doctrine prevents. The stability of the currency, the division of debt, and the status of borders would become immediate crises rather than subjects of negotiation, as the leverage currently held by the federal government to ensure an orderly transition would vanish.

  Conversely, if the practice were replaced with an absolute rule that existing borders are never redrawn, the obligation to negotiate would disappear entirely, and any referendum would be treated as legally null. This would force secessionist movements entirely outside the legal order, increasing the likelihood of civil disobedience or violence since the constitutional path would be closed. The federal government would no longer need to assess the clarity of questions or majorities, as the result would be irrelevant regardless of the margin. This approach would prioritize territorial integrity over democratic consent, assuming that the state's survival is more important than the voluntary nature of its union. While this would eliminate the uncertainty currently inherent in the Clarity Act, it would do so by denying the core premise of the Canadian federation that provinces joined voluntarily and might theoretically leave. The current doctrine attempts to thread the needle between these two extremes, maintaining the union by acknowledging the possibility of its end, but the underdetermined nature of what constitutes clarity and the political discretion involved in judging it remain the fragile hinges upon which this balance rests.
