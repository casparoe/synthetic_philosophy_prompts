      The proposed label "sibling cast" is a marketing trick, not an art historical category. It attempts to launder the object's provenance by implying a familial equality with the 1873 figures that does not exist. Adopting this term would compromise our scholarly integrity to satisfy a donor's narrative. We cannot validate a taxonomy invented to bypass ethical standards regarding posthumous casts.

