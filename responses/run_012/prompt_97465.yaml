  **TO:** Collections and Ethics Committee
  **FROM:** [Your Name]
  **RE:** The Harrow Commission Thirteenth Figure
  **DATE:** October 24, 2023

  **Recommendation**
  I recommend we accept the figure only on the condition that it is cataloged as a 1921 posthumous cast and displayed separately from the 1873 Harrow Commission. We must reject the proposal to integrate it into the original set.

  **Proposed Label Text**
  > *Ada Rennick, Harrow Commission Figure XIII. Cast 1921 from original 1873 moulds. Produced without artist authorization following Rennick's death (1890). This object is a posthumous reproduction, distinct from the 1873 Commission.*

  **Reasoning: The Ontological Tangle**
  The core question is whether physical continuity supersedes creative intent. Does using the artist's moulds make an object an original? I argue it does not. In sculpture, the "work" is not merely the physical bronze but the realization of the artist's will. Rennick died in 1890; she could not supervise the alloy, the patina, or the purpose of the 1921 pour. That casting lacks her authorization and exists outside her creative timeline. Therefore, it is a copy produced from original tools, not an original work. For the 1921 figure to count as the *same work* as the 1873 set, the artist must have authorized the casting as part of the conceived edition. Without that intent, we have two distinct objects: one an original work, the other a later reproduction.

  **The "Sibling Cast" Category**
  The term "sibling cast" is a marketing trick, not an art historical category. It attempts to launder the object's provenance by implying a familial equality with the 1873 figures that does not exist. Adopting this terminology would compromise our scholarly integrity to satisfy a donor's narrative. We cannot validate a taxonomy invented to bypass ethical standards regarding posthumous casts.

  **The Case for Integration**
  The strongest argument against my position comes from the Director and the collector: the public derives no benefit from our distinctions. Visually, the figures are identical. By segregating the 1921 cast, we prioritize bureaucratic purity over aesthetic experience. The argument holds that the moulds are the true "source" of the art, and since those are authentic, the resulting object carries the same aesthetic weight. Integrating them restores the visual completeness of the set and allows the public to engage with the form without being bogged down by provenance technicalities that only experts care about. To the viewer, the bronze looks the same; the distinction is invisible.

  **Conclusion**
  While the aesthetic argument is compelling, our mandate is ethical stewardship, not just visual display. Integrating the figure falsifies the history of the Commission. We can honor the object's history without lying about its status. We should take the figure as a study piece to teach about foundry practices and provenance, but we must keep it distinct from the 1873 original. Transparency is the higher value.
