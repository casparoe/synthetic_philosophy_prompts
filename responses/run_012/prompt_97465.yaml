      **Reasoning: Original vs. Copy**
      The central ethical tangle is ontological: does physical continuity (the moulds) supersede creative intent? In sculpture, a work is not defined solely by its material substrate but by the artist's authorization. While the 1921 figure shares the physical matrix of the 1873 set, it lacks Rennick's sanction. She died in 1890; she could not supervise the alloy, the patina, or the purpose of this specific pour. Therefore, this is not an "original" work by Rennick, but a copy produced from her tools. It is historically significant, but it is not part of the *Harrow Commission* as an artistic work. For these two figures to count as the *same work*, the artist must have authorized the casting as part of the conceived edition. Without that intent, we have two distinct objects: one an original work, the other a later reproduction.

