  This is a precise and demanding request. It requires mapping a foundational dispute in quantum mechanics onto the conceptual framework of classical statistical mechanics, while maintaining rigorous distinctions between mathematical results and metaphysical interpretations.

  Given your background, I will treat the wavefunction $\psi$ and the density operator $\hat{\rho}$ as the primary objects of inquiry, analogous to the phase space distribution $\rho(p, q)$. I will adopt the framework of **ontological models** (Harrigan & Spekkens, 2010), as this is the standard formalism used to define the psi-ontic/psi-epistemic distinction, but I will translate its terms into your statistical mechanical vocabulary.

  Here is the residue report.

  ***

  ### 1. Translation Without Loss: Where the Analogy Holds

  **[Reconstruction]**
  To translate the dispute into your vocabulary, we posit an underlying sample space $\Lambda$ (the ontic state space), analogous to the classical phase space $\Gamma$. A physical system possesses a specific microstate $\lambda \in \Lambda$ at any given time, analogous to a point $x \in \Gamma$.

  *   **Psi-Ontic:** The quantum state $\psi$ is in one-to-one correspondence with the physical microstate $\lambda$ (or a distribution sharply peaked on it). Distinct wavefunctions $|\psi\rangle$ and $|\phi\rangle$ correspond to disjoint regions of $\Lambda$.
      *   *Stat-Mech Analog:* This is analogous to identifying a macrostate definition so precise that it specifies the microstate (e.g., a delta function $\delta(x - x_0)$ in phase space). If you specify the energy and position of every particle exactly, the "macrostate" *is* the microstate.
  *   **Psi-Epistemic:** The quantum state $\psi$ corresponds to a probability distribution $\mu_\psi(\lambda)$ over $\Lambda$. Distinct wavefunctions can correspond to overlapping distributions. There exists some $\lambda$ compatible with both $|\psi\rangle$ and $|\phi\rangle$.
      *   *Stat-Mech Analog:* This is the standard relation between a thermodynamic macrostate and the underlying microstates. Two different preparation procedures (e.g., "expand isothermally" vs. "heat isochorically") might result in macrostates that, at the microscopic level, share common configurations $x \in \Gamma$. If I tell you "System A is at temperature $T$" and "System B is at temperature $T'$", there may be microstates compatible with both descriptions if the macro-variables are coarse-grained enough.

  **Why it holds:**
  Mathematically, both frameworks utilize convex sets of probability measures. In both cases, one can ask: Does the probability distribution represent a physical spread (ontic) or a lack of knowledge about a definite point (epistemic)? The formalism of updating probabilities upon measurement (Bayesian conditioning vs. physical collapse) maps cleanly onto statistical inference vs. physical disturbance.

  ***

  ### 2. Where the Translation Distorts: The Convex Structure and PBR

  **[Consensus on Mathematics]**
  Your suspicion here is well-founded and technically correct. The translation distorts significantly regarding the structure of the state space.

  **A. The Technical Sense of "Epistemic"**
  In statistical mechanics, if I have two distributions $\rho_1(x)$ and $\rho_2(x)$ over phase space, their overlap implies there are microstates $x$ consistent with both. This is "ignorance" in the classical sense.
  In quantum foundations, the **Pusey-Barrett-Rudolph (PBR) Theorem (2012)** demonstrates that if you assume **Preparation Independence** (two systems prepared independently have independent ontic states $\lambda_1, \lambda_2$), then distinct pure quantum states must correspond to disjoint distributions over $\Lambda$.
  *   **The Distortion:** In classical stat-mech, overlap is the norm. In quantum mechanics (under PBR assumptions), overlap is forbidden for pure states. If $\psi$ is epistemic, the underlying "microstates" $\lambda$ cannot behave like classical phase space points under independent preparation.

  **B. Convexity and Decomposition**
  You noted the convex structure of the state space. This is a critical point of divergence.
  *   **Classical:** The set of probability distributions over $\Gamma$ is a simplex. Any mixed distribution $\rho(x)$ has a **unique** decomposition into extreme points (the delta functions representing microstates). There is a "canonical underlying support."
  *   **Quantum:** The set of density operators is convex, but **not a simplex**. A mixed state $\hat{\rho}$ admits infinitely many distinct decompositions into pure states $|\psi_i\rangle$.
      *   *Example:* $\hat{\rho} = \frac{1}{2}(|0\rangle\langle 0| + |1\rangle\langle 1|) = \frac{1}{2}(|+\rangle\langle +| + |-\rangle\langle -|)$.
  *   **What is Lost:** In stat-mech, ignorance is always ignorance of *the* microstate. In QM, if $\hat{\rho}$ represents ignorance, it is ignorance of *which* ensemble decomposition was used. There is no unique "underlying support" of pure states. If you try to map $\psi$ to a classical distribution, you lose the contextuality of the decomposition. The "microstates" of a psi-epistemic model cannot be non-contextual value assignments (per Kochen-Specker).

  **[Live Dispute]**
  Some proponents of psi-epistemic views reject the **Preparation Independence** assumption of PBR (e.g., by allowing retrocausality or holistic preparation). In that case, the analogy to classical statistical independence breaks down. The "microstates" $\lambda$ would have to be non-local or contextual in a way classical phase space points are not.

  ***

  ### 3. What Has No Expression in Your Vocabulary

  **[Reconstruction]**
  There are three elements of the contemporary dispute that resist translation into ensemble/stat-mech vocabulary because your vocabulary presupposes a classical ontology that the dispute is questioning.

  1.  **The Nature of $\Lambda$:** In stat-mech, $\Gamma$ is the space of positions and momenta. We know what the "stuff" is. In the ontological models framework, $\Lambda$ is abstract. A psi-ontic view might claim $\Lambda$ *is* the wavefunction itself (living in configuration space, not 3D space). Your vocabulary assumes the underlying reality is "particle-like" (microstates in 3N space). It has no ready slot for a reality that is fundamentally a field on high-dimensional configuration space.
  2.  **Agent-Dependence (QBism/Relational QM):** Some modern "epistemic" views (like QBism) argue the quantum state represents an agent's betting odds, not just objective ignorance of a hidden $\lambda$. In stat-mech, entropy is "missing information," but we assume the information *exists* in principle (the microstate is there). In QBism, there may be no "fact of the matter" about the system prior to measurement. Your vocabulary of "coarse-graining" implies a fine-graining exists; QBism denies this.
  3.  **Completeness:** The dispute often centers on whether QM is "complete." In stat-mech, the theory is explicitly incomplete (it ignores micro-details by design). In QM, the psi-ontic view often claims $\psi$ is the *complete* description. There is no analog in stat-mech for a probability distribution that claims to be the full physical reality rather than a summary of it.

  ***

  ### 4. The Smuggled Premise: The Definite Microstate

  **[Critical Analysis]**
  **Yes, your vocabulary smuggles in a premise.**
  By using the language of ensembles, microstates, and coarse-graining, you presuppose **Realism about the Underlying Layer**. You assume there *is* a $\lambda$ (a point in phase space) about which the distribution $\rho$ expresses ignorance.

  *   **Is this a defect?** It is a defect *only if* the correct interpretation of QM is one that denies the existence of $\lambda$ entirely (e.g., standard Copenhagen or QBism). If the world is not made of "systems with states" in the classical sense, the stat-mech analogy is a category error.
  *   **Is the dispute less substantive?**
      *   **[Live Dispute]**: Some philosophers (e.g., Healey, pragmatists) argue the ontic/epistemic dichotomy is a false dilemma generated by forcing QM into a classical realist mold. If one abandons the requirement that $\psi$ must represent *either* a physical state *or* knowledge of a physical state, the tension dissolves.
      *   **[My View]**: However, given Bell's Theorem, we cannot simply retreat to a local classical microstate. If you keep the "definite microstate" premise, you are forced into Non-Local Hidden Variables (Bohmian Mechanics), which is psi-ontic (the wavefunction is a real guiding field). If you keep the "epistemic" intuition, you must sacrifice Preparation Independence or Measurement Independence. The dispute is substantive because it forces a choice between non-locality, retrocausality, or abandoning realism about the microstate.

  ***

  ### 5. The Ensemble Interpretation: Location and Distinction

  **[Reconstruction]**
  The **Ensemble Interpretation** (associated with Ballentine, Einstein, and Popper) holds that the wavefunction describes *only* the statistical properties of an ensemble of similarly prepared systems, not an individual system.

  *   **Relative to Psi-Ontic:** It is incompatible. Psi-ontic says $\psi$ describes the individual system. Ensemble says $\psi$ does not apply to the individual.
  *   **Relative to Psi-Epistemic:** It is a close cousin but distinct.
      *   *Standard Psi-Epistemic:* An individual system *has* a state $\lambda$. $\psi$ is our knowledge of $\lambda$.
      *   *Ensemble Interpretation:* An individual system *does not have a $\psi$*. $\psi$ is a property of the collection.
  *   **Why it is not simply the Epistemic View:**
      The Ensemble Interpretation is often **agnostic** about $\lambda$. It says: "QM is a theory about frequencies. Do not ask what the individual system is doing." A psi-epistemic model makes a positive claim: "The individual system has a state $\lambda$, and $\psi$ overlaps."
      The Ensemble Interpretation avoids the PBR theorem by denying the premise that $\psi$ applies to a single system at all. PBR assumes you can prepare a *single* system in state $\psi$. The Ensemble Interpretation says that phrase is category mistake; you prepare an ensemble.

      **[Live Dispute]**: Many physicists consider the Ensemble Interpretation insufficient because it does not solve the Measurement Problem (it explains why we see statistics, but not why a single detector clicks). It is often viewed as "shut up and calculate" formalized.

  ***

  ### Residue Report and Status Summary

  **1. Settled Mathematical Facts:**
  *   **PBR Theorem:** Under the assumption of Preparation Independence, pure quantum states cannot overlap in their distribution over underlying ontic states. **[Consensus]**
  *   **Convex Structure:** Quantum mixed states have non-unique decompositions into pure states; classical mixed states have unique decompositions into microstates. **[Consensus]**
  *   **Bell/KS:** No local, non-contextual hidden variable model can reproduce QM predictions. **[Consensus]**

  **2. Live Disputes (Philosophy of Physics):**
  *   **Implications of PBR:** Does PBR rule out *all* epistemic views, or only those with Preparation Independence? (Some argue for retrocausal or superdeterministic epistemic models). **[Dispute]**
  *   **Status of $\Lambda$:** Must there be an underlying $\lambda$? (Realists say yes; Anti-realists/QBists say no). **[Dispute]**
  *   **Meaning of "Real":** Does psi-ontic mean $\psi$ is a material field, or simply that it is a physical property like mass? **[Dispute]**

  **3. Reconstruction/My View:**
  *   **The Category Error:** Your statistical mechanical vocabulary is powerful but presupposes a **Classical Realist Ontology** (definite microstates exist). The quantum debate is largely about whether that ontology is sustainable.
  *   **The Distortion:** The non-uniqueness of quantum decompositions means that "ignorance" in QM cannot be mapped to "ignorance of a point in phase space." It must be "ignorance of a context" or "ignorance of a preparation history."
  *   **Verdict:** The psi-ontic/epistemic dispute is not merely a semantic argument about the word "real." It is a constraint satisfaction problem. You can have an epistemic view, but you must pay for it by abandoning Preparation Independence (PBR) or Non-Contextuality (KS). You can have a classical microstate picture, but you must pay for it with Non-Locality (Bell). Your vocabulary assumes you don't have to pay these taxes.

  **Recommendation:**
  If you wish to retain your statistical mechanical intuition, the **Bohmian (De Broglie-Bohm)** interpretation is the closest fit. It posits definite microstates (particle positions) and a guiding wave (psi-ontic). It treats $\psi$ as a physical field in configuration space that drives the ensemble flow. It preserves the "definite microstate" premise of your vocabulary but forces you to accept a non-local potential.

  If you wish to retain the "epistemic" intuition without hidden variables, you must move toward **QBism** or **Relational QM**, but this requires abandoning the premise that there is a "microstate" to be ignorant *about*. This is the point where your vocabulary reaches its limit.
