answer: |-
  **Project Title:** Continuity, Aggregation, and the Utility Monster: A Structural Analysis

  **Project Overview**
  This project supports nine months of part-time research (one course release and one summer) to produce a paper on the structural relationship between the "Utility Monster" objection and the "Repugnant Conclusion" in population axiology. While these are typically treated as distinct problems—one concerning fixed populations and extreme welfare intensity, the concerning variable populations and welfare quantity—I hypothesize that both arise from a single tension regarding the **Archimedean condition** (or continuity requirement). The goal is to determine whether these objections are independent or instances of a single schema, and to map which departures from continuity are principled.

  **Research Question and Background**
  The central research question is: *Do the Utility Monster and the Repugnant Conclusion rely on the same axiological commitment to unrestricted aggregation, and if so, can a theory block one without succumbing to the other?*

  To clarify the technical stakes: Standard aggregative views (like total utilitarianism) satisfy the **Archimedean condition**. This requirement states that for any two welfare goods, a sufficient quantity of the lesser good can outweigh the greater good. There are no "infinite" values. The Utility Monster argument posits a being who converts resources into welfare so efficiently that aggregative views demand we feed it at the expense of everyone else. The Repugnant Conclusion posits that a massive population with lives barely worth living is better than a smaller population with excellent lives.

  Current positions leave the relationship between these cases unresolved. **Unrestricted aggregation** accepts both verdicts. **Denial strategies** argue the Monster is metaphysically impossible, but this leaves the axiological vulnerability intact should such a being be conceivable. **Prioritarianism** weights the worse off more heavily but often retains continuity, leaving it vulnerable to both cases in the limit. **Lexical priority views** (which hold that some welfare levels are infinitely more valuable than others) block the Repugnant Conclusion by violating the Archimedean condition. However, lexical views arguably violate continuity in the *opposite* direction, potentially generating "Reverse Repugnant" verdicts or failing to explain why the Monster's extreme gains do not trump others' basic needs.

  The literature treats these as separate silos. If my hypothesis is correct, they are two pressure points on the same structural beam. The paper will ask whether the Monster case requires the being to be part of a fixed population or a newly created being. If the former, it tests trade-offs among existing claims. If the latter, it merges with variable population ethics. Resolving this is necessary to know if blocking the Monster requires the same lexical tools used to block the Repugnant Conclusion.

  **Methodology and Approach**
  The project employs conceptual analysis supported by formal modeling. I will not be conducting empirical work or historical exegesis. Instead, I will treat moral theories as formal structures defined by a set of axioms (e.g., transitivity, separability, continuity).

  This approach is superior to purely intuitive case-based reasoning for two reasons. First, intuitions about monsters and vast populations are notoriously unstable; formalizing the conditions reveals whether the intuition tracks a coherent principle or a cognitive bias. Second, a formal approach allows us to isolate the **Archimedean condition**. By systematically relaxing this condition, we can see exactly which verdicts change. This avoids the common error of proposing a solution (like lexical priority) that solves one problem while silently importing another.

  **Work Plan (Nine Months)**
  *Months 1–3 (Formalization):* I will formalize the "Monster Schema" and the "Repugnant Schema." This involves defining the precise axioms required to generate each verdict. I will investigate whether the Monster argument holds in fixed populations without variable population principles.
  *Months 4–6 (Analysis):* I will test existing axiologies (utilitarianism, prioritarianism, sufficientarianism, lexical views) against these schemas. The focus will be on identifying which theories violate continuity and whether those violations are consistent.
  *Months 7–9 (Drafting):* I will draft the paper, focusing on the tension exposed: that resisting the Repugnant Conclusion often requires the very discontinuity that makes a view vulnerable to a "Lexical Monster" (a being whose welfare is lexically superior). The final month will be dedicated to revision and submission.

  **Expected Outcomes and Risk Assessment**
  A successful result will be a manuscript demonstrating that the Utility Monster and Repugnant Conclusion are structurally linked via the Archimedean condition. The paper will provide a typology of continuity violations, distinguishing principled departures (e.g., protecting basic rights) from ad hoc ones (e.g., avoiding counterintuitive sums).

  There is a risk that the framing collapses. It is possible that Monster-vulnerability is a feature of the *domain of application* (e.g., resource distribution) rather than the *axiology* (e.g., value aggregation), or that the fixed/variable population distinction is too sharp to allow a unified schema. If this occurs, the project will not fail; rather, the paper will document this divergence. A proof that the two problems are *not* instances of the same schema is a significant philosophical result, as it would vindicate the current siloed approach. The project is designed to yield a publishable paper in either outcome: either a unified theory of continuity violations or a rigorous demonstration of their independence.

  **Resource Justification**
  This work requires sustained concentration on formal constraints that are easily disrupted by teaching loads. The course release provides the uninterrupted time necessary to construct the formal models and test the axioms rigorously. The summer term allows for the drafting and refinement of the argument without competing academic service obligations. This nine-month window is the minimum viable time to move from the current half-formed hypothesis to a determinate, formalized argument suitable for publication in a top-tier ethics journal.
