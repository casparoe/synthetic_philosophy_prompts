answer: |-
  Here is the procedure. It is designed to take 20 minutes max. It is not a substitute for judgment, but it is a substitute for "vibes."

  ### The Kantian Mod Checklist (KMC)

  **Timebox:** 20 minutes. If you haven't reached a verdict by then, the test is inconclusive. Default to caution (status quo).

  #### Step 0: Formulate the Maxim
  You cannot test an action; you can only test the rule behind the action. You need to write down the maxim.
  *   **Format:** "I will [ACTION] in [CONTEXT] for [REASON]."
  *   **The Goldilocks Rule:** The context must be specific enough to be useful, but general enough to apply to anyone in your position.
  *   **The Cheat-Catcher (The "One More Excuse" Trick):** Once you write the maxim, try to add one more clause to justify an exception (e.g., "...unless they are popular" or "...unless I'm tired").
      *   If you *would* accept the new version with the extra clause, your original maxim was **too specific** (you were hiding the real reason). Rewrite it broader.
      *   If you *would not* accept the new version, your original maxim was **too general** (you were smuggling in an exception). Rewrite it narrower.
      *   *Stop condition:* If you cannot agree on the maxim wording after 5 minutes, abort. You aren't fighting the case; you're fighting the values.

  #### Step 1: Universalize
  Imagine a world where **every** mod in **every** comparable community acts on this maxim as a standard policy. Not "sometimes," but "this is how things are done."
  *   **Doing vs. Not-Doing:**
      *   If the maxim is "I will [X]," the universal world is "Everyone [X]s."
      *   If the maxim is "I will not [X]," the universal world is "No one [X]s."
      *   *Note:* Do not flip negatives to positives to game the test. "I will not ban" is different from "I will let stay." Test the agency you are actually exercising.

  #### Step 2: Check for Contradiction in Conception (CI)
  Ask: **In this universal world, does the action become impossible?**
  *   Does the practice self-destruct? (e.g., If everyone lies, no one believes anyone, so lying becomes impossible).
  *   Does the institution vanish? (e.g., If every mod breaks confidentiality, "confidentiality" ceases to exist as a concept).
  *   **Verdict:** If Yes, **STOP.** The action is forbidden. Hard constraint.
  *   **The Consequentialist Tripwire:** If you find yourself saying, "It would be chaotic," or "People would get hurt," or "Trust would go down," **stop.** That is not logical impossibility; that is bad outcomes. You are drifting into rule-consequentialism. Only pass this step if the action literally cannot function in that world.

  #### Step 3: Check for Contradiction in Will (CW)
  Ask: **Could you rationally will to live in this universal world, given your own goals?**
  *   Imagine you are a user in this community. Would you want this to be the norm?
  *   Does this universal rule undermine something you necessarily need as a rational agent (e.g., safety, truth, ability to plan)?
  *   **Verdict:** If No (you couldn't will it), **STOP.** The action is forbidden. Soft constraint.
  *   **Honesty Note:** This step is soft. It often boils down to "Would I like this?" It is where most self-deception happens. If you pass CI but fail CW, acknowledge you are making a value judgment, not finding a logical truth.

  #### Step 4: The Humanity Pass (Separate Track)
  Run this even if Steps 2 and 3 pass.
  *   **Question:** Does this action treat a person (user, co-mod, yourself) merely as a tool to get a result?
  *   **Test:** Is there consent? Are we bypassing their agency for "their own good" or "the community's good"?
  *   **Verdict:** If Yes (using them as a tool), **STOP.**
  *   **Distinctness Verdict:** This is a different test. Universal Law checks for system consistency. Humanity checks for dignity. You can have a consistent system that treats people like cattle (passes Universal Law, fails Humanity).

  ---

  ### Case Runs

  #### Case 1: The White Lie
  **Scenario:** A user posts a hot take that is factually wrong but harmless. Another user asks you, "Is this guy an idiot?" You want to say "No, just misunderstood" to keep vibes good, rather than "Yes."
  **Maxim:** "I will misrepresent a user's competence in public channels to spare feelings and maintain community harmony."
  **Universalize:** All mods misrepresent user competence to maintain harmony.
  **CI Check:** If all mods do this, does "mod statement" become meaningless? Yes. If users know mods routinely sandbag truth for vibes, they cannot trust mod assessments on safety or rules. The practice of "moderators giving facts" becomes impossible.
  **Verdict:** **FAIL (CI).**
  **Humanity Pass:** You are treating the questioner as a means to harmony (denying them truth) and the poster as a means to harmony (denying them accurate feedback). **FAIL.**
  **Outcome:** Don't lie. Say "It's incorrect, but let's move on."

  #### Case 2: The Breach of Confidence
  **Scenario:** A user DMs you that they are struggling with addiction. Later, they start posting erratically. You want to warn the other mod team so they can handle the user gently, breaking your promise of DM confidentiality.
  **Maxim:** "I will break DM confidentiality with a user if I believe sharing the info will lead to better care for them."
  **Universalize:** All mods break DM confidentiality when they deem it "for the user's own good."
  **CI Check:** If this is universal law, does "DM confidentiality" exist? No. Users will not DM mods with sensitive info if they know mods share it based on subjective judgment. The institution of "confidential DM" self-destructs.
  **Verdict:** **FAIL (CI).**
  **Humanity Pass:** You are using the user's private data as a tool for community management, without their consent. **FAIL.**
  **Outcome:** Do not share the DM. You can warn the team "Handle User X gently, they seem struggling," without sourcing the info.

  #### Case 3: The High-Value Exception (The Uncomfortable One)
  **Scenario:** A top contributor (drives 20% of traffic) breaks a minor rule. You want to give them a private slap on the wrist instead of a public timeout, because banning them hurts the community.
  **Maxim:** "I will enforce rules less visibly for high-value contributors to preserve community utility."
  **Universalize:** All mods enforce rules less visibly for high-value contributors.
  **CI Check:** Does "rule enforcement" become impossible? Not logically impossible, but the concept of a "rule" becomes "a suggestion for low-status people."
  **CW Check:** Could you will this? Imagine you are a low-status user. You see the rules apply to you but not them. You cannot rationally will a system where you are a second-class citizen by design.
  **Verdict:** **FAIL (CW).**
  **Humanity Pass:** You are treating the low-status users as mere background noise compared to the high-status user. **FAIL.**
  **Outcome:** You must timeout the popular member publicly. This is the answer you won't like because it hurts engagement, but the test says doing otherwise is impermissible.

  ---

  ### Limitations and "Bullshit" Analysis

  **Where this is most likely to be bullshit:**
  1.  **Step 0 (Maxim Formulation):** This is the biggest sinkhole. You can game any result by tweaking the "Context" or "Reason."
      *   *Example:* "I will lie" fails. "I will lie to prevent immediate physical harm" might pass.
      *   *Self-Deception:* You and your co-mod will unconsciously write the maxim to justify the outcome you already want. The "One More Excuse" trick helps, but it relies on your honesty.
      *   *What would change my mind:* If you record your initial maxim draft *before* discussing the verdict, and compare it to the final version. If the maxim changes after you realize it fails the test, you were gaming it.
  2.  **Step 3 (Contradiction in Will):** This is basically preference utilitarianism wearing a logic hat. "Could I will this?" usually means "Do I want this?" It is soft.
      *   *Self-Deception:* You will claim you "couldn't will" a world you just personally dislike.
      *   *What would change my mind:* If you require a specific argument about *rational agency* (e.g., "I cannot plan my life if...") rather than general unhappiness.

  **Where the procedure is just judgment calls dressed up as steps:**
  *   **The CI/CW Line:** Distinguishing "Impossible" from "Really Bad" is often semantic.
  *   **The Humanity Formula:** Determining what counts as "using someone" is subjective. Paternalism (doing things for their own good) is the gray zone. Some say it's always using them; others say it's care. The test doesn't solve this; it just flags it.

  **When NOT to use this test:**
  1.  **Emergencies:** If a raid is happening or someone is doxxed *right now*, do not run the KMC. Act, then justify later. Kant is too slow for fires.
  2.  **Pure Coordination Problems:** "Should the bot post warnings in #general or #mods?" Kant doesn't care. Neither is immoral. Use efficiency.
  3.  **Technical Configuration:** "Should we set the slowmode to 10s or 30s?" This is engineering, not ethics.

  **Final Verdict on the Test:**
  It is not a truth machine. It is a **bias scrubber**. It forces you to admit if you are making an exception for someone you like (Case 3) or sacrificing truth for comfort (Case 1). If you run it honestly, it will stop you from doing the easy, wrong thing about 30% of the time. The other 70%, it will confirm what you already knew, but give you the vocabulary to explain it to the angry users without sounding like you're just making it up.
