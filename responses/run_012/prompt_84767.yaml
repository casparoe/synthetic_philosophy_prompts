  ### Decomposition

  I treat the claim as a conjunction of five necessary conditions. For the claim to be true (that $\ge 50\%$ of macro-outcomes are micro-sensitive to ordinary persons), the underlying historical dynamics must satisfy all five terms simultaneously. I assign a probability to each term representing the likelihood that the condition holds *strongly enough* to support the claim's threshold.

  1.  **Structural Openness ($P_i = 0.55$):** The probability that structural constraints (geography, demography, tech) do not deterministically fix the coarse-grained outcome in the majority of cases.
      *   *Reasoning:* While structuralism explains long-term trends (e.g., Eurasian dominance), specific outcomes (e.g., which specific regime survives a crisis) often have contingency. However, structure usually narrows the basin of attraction significantly.
  2.  **Chaos Survival ($P_{ii} = 0.50$):** The probability that underlying stochastic or chaotic dynamics survive coarse-graining rather than being averaged out by systemic redundancy.
      *   *Reasoning:* Macro-systems (economies, states) have homeostatic mechanisms. Micro-noise is usually dampened over the timescales required for "coarse-grained" outcomes to manifest.
  3.  **Amplification Dominance ($P_{iii} = 0.45$):** The probability that the historical system amplifies micro-divergence rather than absorbing it into wide attractor basins.
      *   *Reasoning:* History exhibits "equifinality" (many paths to the same outcome). For the claim to hold, amplification must be the default, not the exception.
  4.  **Counterfactual Coherence ($P_{iv} = 0.80$):** The probability that interventionist counterfactuals are well-defined enough to validate the "would have reversed" clause without collapsing into triviality.
      *   *Reasoning:* This is methodological. We can define interventions, but holding structural variables fixed while changing a micro-variable often creates incoherent worlds. I am generous here.
  5.  **Agent Leverage ($P_v = 0.25$):** The probability that a "single ordinary person" (non-elite, non-decision-maker) possesses sufficient causal leverage within a one-year window to flip a macro-outcome.
      *   *Reasoning:* This is the primary bottleneck. Ordinary actions (voting, working, minor sabotage) rarely overcome structural inertia in <1 year.

  **Combination Rule:**
  The terms function as **conjunctive filters** on the frequency of sensitive cases. The product of these probabilities yields the estimated *rate* of micro-sensitive cases ($r$).
  $$ r \approx 0.55 \times 0.50 \times 0.45 \times 0.80 \times 0.25 \approx 0.025 $$
