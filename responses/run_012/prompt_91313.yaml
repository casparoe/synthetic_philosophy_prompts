answer: |-
  Your friend is most plausibly treating the proverb as a prudential maxim about avoiding social friction, which he inconsistently inflates into a moral obligation to suit the immediate needs of his argument.

  **1. The Prudential Maxim**
  *   **Claim:** You should conform to local customs to avoid punishment, violence, or inconvenience.
  *   **Status:** Platitude; empirically true in most contexts.
  *   **Proponents:** Travelers, diplomats, spies, survivors.
  *   **Relevance:** This advises the narrator not to eat because it might make him sick, or to eat because refusing might get him killed. It cannot ground moral judgment either way.

  **2. The Etiquette Rule**
  *   **Claim:** You should conform to local customs to avoid giving offense to your hosts.
  *   **Status:** Defensible and substantive position regarding hospitality norms.
  *   **Proponents:** Ethicists of care, hosts, social contractors.
  *   **Relevance:** This suggests the narrator should eat to honor the gift of the dead, but it does not forbid him from privately finding the act repellent.

  **3. The Epistemic Suspension**
  *   **Claim:** You should conform (or at least withhold judgment) because you lack the cultural context to evaluate the custom correctly.
  *   **Status:** Defensible; closely aligns with Montaigne's skepticism.
  *   **Proponents:** Cultural anthropologists, skeptics, Montaigne.
  *   **Relevance:** This supports the friend's first move (you cannot call it degrading), but it does not support the second (you must participate); humility limits judgment, not action.

  **4. The Relativist Thesis**
  *   **Claim:** You should conform because moral truth is local; what is wrong at home is right here.
  *   **Status:** Controversial substantive metaethical claim; often false if applied to universal harms.
  *   **Proponents:** Moral relativists, certain postmodernists.
  *   **Relevance:** This could support both moves if one argues that "right" implies "obligatory," but it typically grants permission rather than commanding participation.

  **5. The Assimilation Imperative**
  *   **Claim:** You must conform because your presence obligates you to become, temporarily, a Roman.
  *   **Status:** False; creates obligations where none exist and risks complicity in harm.
  *   **Proponents:** Zealots, confused relativists, totalitarians.
  *   **Relevance:** This supports the friend's second move (you must join in), but it contradicts the first (if you must do it, you cannot merely suspend judgment on its degradability).

  **Analysis of the Friend's Moves**
  For the first move (you are not entitled to call the rite degrading), your friend needed **The Epistemic Suspension** or **The Relativist Thesis**. He was arguing that your narrator lacks the standing to judge because he is outside the custom's framework. For the second move (you ought to keep no distance but join in), he needed **The Assimilation Imperative** or a hyper-literal version of **The Etiquette Rule**. He was arguing that presence entails participation.

  **The Slide**
  The same reading cannot bear both moves without contradiction. **The Epistemic Suspension** advises humility in judgment but remains neutral on action; you can suspend judgment and still refuse to eat based on personal conscience. **The Assimilation Imperative** commands action but removes the right to suspend judgment; if you must do as the Romans do, the act is by definition correct, leaving no room for the narrator's ambivalence. The slide from "you are in no position to condemn this" to "you are obliged to take part in it" is your friend's invention, not the proverb's fault. He is conflating *permission* (you may do this without being barbarous) with *obligation* (you must do this to be polite), using the proverb's vagueness to bypass the hard work of distinguishing between respecting a culture and violating one's own bodily autonomy. For your narrator, who finds the rite repellent yet admirable, the proverb fails entirely; it offers only conformity, whereas his struggle is about how to witness something alien without erasing himself or the other.
