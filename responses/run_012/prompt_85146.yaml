answer: |-
  ### Brainstorm & Selection

  **Candidate Cruxes:**
  1.  **Inheritance vs. Interaction:** Confusing a causal interaction at a higher level (nests surviving better) with evolutionary change (requires heredity).
  2.  **Statistical vs. Causal:** Whether group selection is a real process or just a mathematical redistribution of individual fitness coefficients.
  3.  **Screening Off:** Whether individual-level fitness differences fully explain the change, or if nest-level properties add explanatory power.
  4.  **Ontological Commitment:** Whether "units of selection" are discovered in nature or imposed by the modeller's framework.

  **Selection:** I'm picking **Inheritance vs. Interaction (Crux 1)** as the backbone, because it forces the **Statistical vs. Causal (Crux 2)** distinction. Without inheritance at the nest level (Version A), "group selection" is merely bookkeeping; with it (Version B), it becomes a causal process. This directly targets the student's ability to separate process from product and avoids the standard Dawkins/Gould script.

  ***

  ### Essay Question (90 Minutes)

  **The Marsh Skimmer Case**

  Consider a colonial insect, the marsh skimmer. Nests contain ~30 adults. An allele *S* causes bears to secrete an antifungal compound into the chamber wall. Secretors lay 8% fewer eggs (cost), but chambers with high frequencies of *S* suffer fewer mould wipeouts (benefit). Non-secretors (*s*) pay no cost but benefit from the protected chamber.

  *   **Version A:** Nests are ephemeral. Every spring, adults disperse and next year's nests are random re-samples of the global population. Nest composition is not heritable.
  *   **Version B:** Nests persist and split. A colony buds off a daughter chamber that inherits the mother's composition (frequency of *S*) intact. Nest composition is a heritable property of a lineage of nests.

  **Prompt:**
  1.  Distinguish clearly between (i) the bearer of the adaptation, (ii) the entity whose differential reproduction drives the change, and (iii) the entity that must inherit for selection to occur. Apply this triad to both Version A and Version B.
  2.  Is "group selection" in Version A a fact about the causal structure of the world, or a choice about how to bookkeep the statistics? Does your verdict change for Version B? Defend your commitment.
  3.  Suppose you run a formal variance partitioning analysis (e.g., Price equation or contextual analysis) on Version A and find significant variance between nests. Does this arithmetic settle the causal question? Why or why not?
  4.  Specify one empirical finding regarding individual fitness that would demonstrate that the nest-level accounting is *screened off* by the individual-level accounting.

  ***

  ### Model Answer

  **Verdict:** In Version A, group selection is bookkeeping; in Version B, it is a causal process. The switch is inheritance, not interaction.

  To evaluate the units of selection, we must separate the product, process, and inheritance. The **bearer of the adaptation** (product) is arguably the nest chamber in both versions; the antifungal property exists only at the collective level. However, the **entity whose differential reproduction drives the change** (process) differs. In Version A, only individual skimmers reproduce; nests do not lineage. In Version B, nests bud, making the nest lineage a reproducing entity. Crucially, **inheritance** is required for evolution by selection. In Version A, nest composition resets every generation; there is no nest-level heredity. In Version B, nest composition is transmitted to daughter chambers.

  Therefore, the status of "group selection" shifts between versions. In Version A, claiming group selection is a choice of bookkeeping. We can mathematically partition fitness into individual and group components, and we will see that nests with more *S* alleles survive better. However, because nest composition is not heritable, this differential survival does not generate an evolutionary response at the group level. The change in allele frequency is driven entirely by the differential reproduction of individuals within the global pool, modulated by their local environment. To call this "group selection" is to describe a statistical correlation, not a causal mechanism of evolution. It is a fact about the model, not the world.

  In Version B, the verdict changes. Because nest composition is heritable, differential survival of nests leads to a change in the frequency of nest-types in the next generation. Here, the nest lineage meets the criteria for a unit of evolution: reproduction, variation, and heredity. Group selection is now a fact about the causal structure of the world; the nest lineage is a genuine unit of selection alongside the individual.

  Regarding variance partitioning: finding significant between-nest variance in Version A does not settle the causal question. You can always run the partition at any level. The arithmetic will always yield a between-group component if groups differ in survival. However, arithmetic cannot distinguish between a causal hierarchy and a statistical aggregation. A significant between-group term in Version A merely reflects that individuals in successful groups survive better; it does not prove the group is a unit of evolution. The math describes the distribution of fitness, not the mechanism of inheritance.

  Finally, to show that nest-level accounting is screened off by individual-level accounting in Version A, we would need to show that individual fitness is fully explained by individual genotype and local frequency, with no residual effect of nest identity once individual traits are controlled. Specifically, if we hold an individual's genotype constant and the frequency of *S* in its nest constant, knowing *which* nest it is in should provide no additional predictive power regarding its fitness. If nest identity adds no predictive value beyond individual properties and local frequency, the individual level screens off the group level. In Version B, this screening would fail because the nest lineage itself carries heritable information not reducible to the current sum of individuals.

  ***

  ### Marking Scheme (25 Marks Total)

  **1. Triad Separation (5 marks)**
  *   **Must Hit:** Clearly distinguishes bearer (nest trait), process (who reproduces), and inheritance (who copies). Identifies that Version A lacks nest inheritance.
  *   **Typical Failure:** Conflates "benefit to the nest" with "selection of the nest." Assumes that because the nest survives, it is selected, ignoring the inheritance requirement.

  **2. Verdict on Version A (Bookkeeping) (5 marks)**
  *   **Must Hit:** Explicitly states Version A group selection is statistical/bookkeeping, not causal evolution.
  *   **Typical Failure:** Hedges ("it depends on definition") or claims it is real selection because nests die differently. Fails to see the lack of heredity kills the evolutionary claim.

  **3. Verdict on Version B (Causal) (5 marks)**
  *   **Must Hit:** Explicitly states Version B allows for causal group selection due to nest budding/heritability.
  *   **Typical Failure:** Treats Version B as identical to Version A, or claims budding doesn't matter because individuals still lay the eggs.

  **4. Variance Partitioning Limitation (5 marks)**
  *   **Must Hit:** States that variance partitioning is arithmetic, not causal. Significant between-group variance exists in both, but only implies evolution in B.
  *   **Typical Failure:** Claims that a significant between-group variance term *proves* group selection exists. Treats the Price equation as a causal detector rather than a accounting tool.

  **5. Screening Off Condition (5 marks)**
  *   **Must Hit:** Identifies that individual-level data must fully predict fitness without residual nest identity effect (or that nest lineage adds info in B).
  *   **Typical Failure:** Vague appeals to "individuals matter more." Fails to specify the conditional probability condition (holding individual traits constant).

  **Explicit A-vs-B Separator:**
  *   **A Grade:** Recognizes that **nest heritability** is the switch that turns a statistical association (A) into an evolutionary cause (B).
  *   **B Grade:** Recognizes the difference in nest persistence but fails to link it strictly to the *inheritance* condition required for selection, treating it instead as just "stronger" group effects.
