  Here is an analysis of Nadia's moral framework, predictions for her new cases, and a strategy to test her consistency.

  ### 1. Candidate Rules and Eliminations

  To reverse-engineer Nadia's logic, we have to test her verdicts against standard ethical frameworks. Most standard rules fail to capture her specific pattern.

  **Candidate A: Marginal Consequentialism**
  *   **The Rule:** An act is wrong only if it changes the outcome (i.e., tips the scale).
  *   **Verdict:** **Ruled Out.**
  *   **Why:** This fits her Election, Flight, Burger, and Recycling cases perfectly. However, it fails on the **Supermarket Chicken** and **Fast-Fashion** cases. In both, she admits her individual purchase doesn't change the immediate order or factory output ("one more shirt changes nothing"), yet she still deems the act wrong. If she were a pure consequentialist, these would be permissible.

  **Candidate B: Strict Deontology (Complicity)**
  *   **The Rule:** An act is wrong if it involves participating in or funding a harmful system, regardless of impact.
  *   **Verdict:** **Ruled Out.**
  *   **Why:** This fits the Chicken and Fast-Fashion cases. However, it fails on the **Portugal Flight** and **BBQ Burger**. In both, she is directly funding/participating in high-harm activities (carbon emissions, animal death). If complicity alone were the rule, she couldn't justify flying or eating the burger.

  **Candidate C: The "Elasticity of Harm" Rule (Best Fit)**
  *   **The Rule:** An act is wrong if it contributes to a **variable demand signal** that scales future production or determines an outcome. An act is fine if the harm is **fixed, sunk, or inelastic** regardless of her participation.
  *   **Why it fits:**
      *   **Elastic/Variable (Wrong):** **School Board** (her vote determines the winner); **Supermarket Chicken** (her purchase signals demand for *future* chickens); **Fast-Fashion** (her purchase validates the sales velocity that dictates *future* batches, even if *this* shirt is inventory).
      *   **Fixed/Sunk (Fine):** **General Election** (outcome fixed); **Portugal Flight** (schedule fixed, fuel burned regardless); **BBQ Burger** (animal already dead); **Recycling** (waste system runs regardless of one bin).
  *   **The Tension:** This rule relies on Nadia believing that airline schedules are rigid (inelastic) while fashion production is responsive to sales velocity (elastic).

  ### 2. Predicted Verdicts on New Cases

  Based on the "Elasticity of Harm" rule, here is how Nadia should logically respond to her current dilemmas.

  **Case 1: The Charter Flight (Field Trip)**
  *   **Scenario:** A flight that *only* happens if eight people sign up; she is the eighth.
  *   **Prediction:** **She will say going is Wrong.**
  *   **Reasoning:** This is structurally identical to the **School Board Election**. Her participation is the *trigger* that brings the harmful event (the flight) into existence. Unlike the Portugal flight (fixed schedule), this flight has variable production. Without her, the carbon is not burned. She cannot claim "the plane is going either way."

  **Case 2: The Whole Lamb (Specific Animal)**
  *   **Scenario:** Buying a specific animal from a farm that is slaughtering that week anyway; total deaths unchanged.
  *   **Prediction:** **She will say buying is Fine.**
  *   **Reasoning:** This is structurally identical to the **BBQ Burger** and the **Portugal Flight Seat**. The harm (slaughter) is a sunk cost. The production volume is fixed for that week. She is merely allocating an existing unit of harm rather than signaling for new production. This fits her "Sunk Cost" exception perfectly.

  ### 3. The Better Test and Follow-Up

  **The Better Test: The Charter Flight**
  The Charter Flight is the superior diagnostic tool. The Lamb case is too similar to the Burger case (both are "sunk cost meat"); if she says it's fine, it just confirms her existing rule without stress-testing it.

  The Charter Flight, however, creates a direct conflict between two of her established precedents:
  1.  **The Portugal Precedent:** Flights are fine because the plane flies anyway.
  2.  **The School Board Precedent:** If you are the tipping point, you must act (or in this case, abstain).

  If she says the Charter Flight is **Fine**, she contradicts her School Board logic (ignoring the tipping point).
  If she says the Charter Flight is **Wrong**, she contradicts her Portugal Flight logic (treating two flights differently).

  **The Follow-Up Question**
  To settle which rule is actually driving her, ask her this:
  > *"If you don't sign up for the charter, do you think they'll find a ninth person to replace you, or will they cancel the trip?"*

  *   If she says **"They'll find someone else,"** she will likely treat it like the **Portugal Flight** (Fine), relying on substitution.
  *   If she says **"They'll cancel,"** she will likely treat it like the **School Board** (Wrong), relying on the tipping point.
  *   **The Trap:** If she says "They'll find someone else" but *still* says it's Wrong, then her rule isn't about impact at all—it's about **Direct Causation** ("I don't want to be the one who signed the paper").

  **The Inconsistency Pair**
  If her verdicts turn out to be inconsistent, the damage is being done by the **Fast-Fashion vs. Portugal Flight** pair.
  *   **Flight:** "Seat gets sold either way" $\rightarrow$ Fine.
  *   **Fashion:** "Shirt changes nothing [at the factory]" $\rightarrow$ Wrong.

  In both cases, she claims her specific purchase does not alter the immediate production/schedule. The only way to reconcile this is if she believes fashion batches are elastic (responsive to sales velocity) while flight schedules are inelastic (fixed regardless of fill rate). If she admits that the airline might cancel a route due to low bookings (elastic) but still flies personally, or that the fashion brand produces fixed inventory regardless of sales (inelastic) but still boycotts, her system collapses. That is the fault line.
