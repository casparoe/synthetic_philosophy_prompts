answer: |-
  It is entirely understandable that you find the phrase frustrating, and I am highly confident that your intuition is correct in sensing that the slogan is doing too much work without earning it. When we treat the sentence he was a man of his time as a piece of language whose meaning is up for grabs, the first possible reading is the sociological platitude, which claims merely that every agent is embedded in a specific cultural and historical context that shapes their beliefs. I am virtually certain that this claim is true, but I am equally certain that it is irrelevant to the question of culpability, because being shaped by one's time does not preclude the possibility of having access to dissenting moral views or the capacity for critical reflection. If this is all the speaker means, they are stating a truth that settles nothing, yet I am highly confident that this is rarely the only work the phrase is intended to do in your meetings.

  The second reading is substantive and defensible, functioning as an excuse rather than an exemption, and it claims that the moral knowledge required to condemn the agent was not epistemically available to them. This reading suggests that there were no live moral alternatives in their community, or that the evidence required to see the wrongness of their actions was inaccessible given the state of knowledge at the time. I am highly confident that this is the only reading that can logically support a conclusion about reduced culpability, because it addresses the condition of moral responsibility rather than denying the standard itself. However, I am also highly confident that this reading fails in the cases you mentioned, such as Jefferson or Churchill, because in each instance there were contemporaries who articulated the very objections that are now being raised, meaning the moral standards were actually live options within their own time.

  The third reading is the one that treats the figure as exempt from judgment entirely, implying that moral standards are relative to historical epochs and that we cannot judge the past by the lights of the present. I am highly confident that this claim is false or incoherent, because it undermines the very possibility of moral progress and contradicts the intuition that some actions, like enslavement or famine induction, are wrong regardless of local consensus. When your colleagues use the slogan to shut down discussion, I am highly confident that they are often sliding from the second reading into this third one, trading on the plausibility of epistemic limitation to smuggle in a conclusion of moral exemption. This slide is the core mechanism by which the phrase stops the argument, and I am highly confident that identifying this equivocation is the key to sharpening your group's distinction between excusing and exempting.

  There is a further conflation happening in your room that separates the question of the person's culpability from the question of what we should do with the plaque or portrait. I am highly confident that the slogan is often used to support a conclusion about memorialization rather than morality, suggesting that even if the person was culpable, their status as a man of his time means their portrait still serves a useful historical function. This is a distinct claim from the question of culpability, and I am highly confident that it requires a separate argument about the pedagogical value of the monument rather than the moral status of the agent. If the group is arguing about whether to retire a portrait, the slogan might be doing work here by suggesting the figure represents a historical era rather than an ideal to emulate, but I am highly confident that this utility does not absolve the figure of guilt.

  Regarding what the people in the room probably meant versus what needs to be true for their argument to hold, I am moderately confident that most speakers intend to express a desire for social harmony rather than a precise philosophical position. They likely mean that continuing the discussion is painful or divisive, and the slogan is a polite way of requesting that the group move on. However, for the slogan to do the logical work they are asking it to do, the epistemic limitation reading would have to be true, and I am highly confident that it is not true in the cases you listed. There is a mismatch between the psychological intent of the speakers, which is to cease debate, and the logical requirement of the phrase, which would require proof of ignorance, and I am moderately confident that pointing this out will be perceived as pedantic even if it is accurate.

  I must single out one point in this analysis where I am less certain than elsewhere, and it concerns the psychological intent of your colleagues. While I am highly confident in the philosophical distinctions I have drawn between excusing, exempting, and memorializing, I am least sure about my characterization of what the speakers in your room actually mean when they deploy the phrase. It is possible that some of them genuinely believe the epistemic limitation claim rather than using it as a conversation stopper, and without surveying them directly, I cannot be as confident in diagnosing their internal motivations as I am in analyzing the logical structure of their arguments.
