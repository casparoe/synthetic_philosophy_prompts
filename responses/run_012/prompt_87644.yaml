answer: |-
  # Desiderata for a Theory of Causation by Omission

  The following specification fixes the criteria for adequacy prior to the assessment of candidate accounts. The requirements are divided into **Non-Negotiable (NN)** constraints, which any theory claiming to analyze *causation* (rather than responsibility or explanation) must satisfy, and **Camp-Commitments (CC)**, which reflect specific metaphysical or normative stances that a theory may adopt but must explicitly acknowledge.

  Where tensions arise, I have flagged **Incompatibility Warnings**.

  ---

  ## I. Cases the Theory Must Get Right

  A theory must provide a principled verdict on the following scenarios. It need not match pre-theoretic intuition in every instance, but it must not be silent, and deviations from intuition must be motivated by the theory's internal logic rather than ad hoc adjustment.

  **1. The Slipping Switch (Action/Omission Boundary)**
  *   **Case:** A safety valve stays closed only while an operator depresses a switch. The operator's hand slips (or they faint); the valve opens; harm follows.
  *   **Requirement:** The theory must classify the cause of the harm as an *action* (the muscle relaxation/slipping), an *omission* (the failure to maintain pressure), or a hybrid, based on a non-arbitrary criterion.
  *   **Justification:** If the theory cannot distinguish between a positive movement (slipping) and a failure to sustain (not holding), it cannot distinguish doing from allowing.
  *   **Status:** **NN**. (A theory of omission causation must define what counts as an omission).

  **2. The Redundant Clinicians (Overdetermination)**
  *   **Case:** Two clinicians independently withhold a drug. Either withholding alone suffices for the patient's death. Neither is counterfactually necessary (but-for cause).
  *   **Requirement:** The theory must determine whether both, neither, or one is a cause, without relying solely on "substantial factor" tests that lack metaphysical grounding.
  *   **Justification:** Standard counterfactual accounts fail here. A robust theory must handle redundant omissions as it handles redundant actions (e.g., two shooters).
  *   **Status:** **NN**.

  **3. The Duty vs. No-Duty Bystanders (Normative Independence)**
  *   **Case:** Two bystanders fail to intervene in identical physical circumstances. One has a legal/moral duty to rescue (e.g., a lifeguard); the other does not. The victim dies.
  *   **Requirement:** The theory must state whether the *causal relation* differs between the two agents, or only the *attributability of blame*.
  *   **Justification:** If causation tracks duty, causation becomes normative. If causation does not track duty, the theory must explain why we treat them differently in court.
  *   **Status:** **NN** that the distinction be made; **CC** regarding the verdict (Descriptivists say causation is identical; Normativists say causation differs).

  **4. The Silent Alarm (Double Prevention)**
  *   **Case:** A warning alarm is wired to sound if pressure rises. It fails to sound (omission). Pressure rises, explosion occurs.
  *   **Requirement:** The theory must accommodate causation via double prevention (the omission prevented the prevention of the explosion).
  *   **Justification:** Omissions often cause by failing to stop a threat. A theory that only allows direct production of effects cannot handle this.
  *   **Status:** **NN**.

  **5. The Global Gardener (Proliferation Control)**
  *   **Case:** I fail to water my plant; it dies. Simultaneously, the Queen of England fails to water my plant; it dies.
  *   **Requirement:** The theory must explain why my omission is a cause and the Queen's is not (or explain why both are causes and our intuition is wrong), without collapsing into absurdity.
  *   **Justification:** Without a constraint, every non-occurrence becomes a cause of every event it did not prevent.
  *   **Status:** **NN**.

  ---

  ## II. Distinctions the Theory Must Not Collapse

  A theory loses its utility if it conflates distinct conceptual categories. The following distinctions must be preserved or explicitly eliminated with justification.

  **1. Omitting vs. Acting**
  *   **Requirement:** The theory must maintain a categorical distinction between positive events and negative events/absences, or argue for eliminativism about one category.
  *   **Justification:** Legal and moral systems hinge on the doing/allowing distinction.
  *   **Status:** **NN**.

  **2. Causation vs. Causal Explanation vs. Blame**
  *   **Requirement:** The theory must distinguish the metaphysical relation (cause) from the pragmatic selection of causes (explanation) and the normative assessment (blame).
  *   **Justification:** We often cite the most blameworthy omission as *the* cause, but this may be pragmatic selection from a field of equal causes.
  *   **Status:** **NN**.

  **3. Ontology: Entity vs. Mode**
  *   **Requirement:** The theory must specify whether an omission is an *entity* (a negative event, an absence) or a *mode of description* (a true counterfactual about a positive event).
  *   **Justification:** This determines whether causation is a relation between things or a relation between facts/propositions.
  *   **Status:** **CC**. (Physicalists prefer Mode; Realists prefer Entity).

  **4. Singular vs. General Causation**
  *   **Requirement:** The theory must clarify if it accounts for token causation (this specific death) or type causation (smoking causes cancer), as omissions behave differently in each.
  *   **Justification:** "Failure to warn" is a type-cause in law, but token causation is required for specific liability.
  *   **Status:** **NN**.

  **5. The Contrast/Baseline Problem**
  *   **Requirement:** The theory must specify the baseline against which an omission is measured. Is it the *actual course of events*, the *statistical norm*, or the *normative expectation*?
  *   **Justification:** "Not watering" is only an omission relative to an expectation of watering. Without a fixed baseline, "omission" is undefined.
  *   **Status:** **NN** (The theory must fix a baseline); **CC** (What that baseline *is*).
  *   **Incompatibility Warning:** Fixing the baseline *normatively* (by duty) risks collapsing Causation into Blame (see Section I.3). Fixing it *descriptively* (by statistical norm) risks the Global Gardener problem (Section I.5).

  ---

  ## III. Results the Theory Must Remain Consistent With

  The theory should not require us to reject well-established practices or deep metaphysical intuitions without significant compensatory theoretical gain.

  **1. Legal and Medical Practice**
  *   **Requirement:** The theory must be compatible with the treatment of failure to warn, withdrawal of treatment, and failure to rescue as causal in professional contexts, or provide a robust error theory explaining why these practices are mistaken.
  *   **Justification:** A theory that renders all medical malpractice regarding omissions metaphysically false is revisionist to a fault.
  *   **Status:** **NN** (Compatibility or robust Error Theory).

  **2. Context Sensitivity**
  *   **Requirement:** The theory must allow that the same absence can be a cause in one context and mere background in another (e.g., oxygen absence causes fire in a lab, but not in a vacuum chamber).
  *   **Justification:** Causal claims are sensitive to the "causal field."
  *   **Status:** **NN**.

  **3. Prevention and Double Prevention**
  *   **Requirement:** The theory must accommodate the intuition that preventing a preventer is a cause of the final outcome.
  *   **Justification:** This is the primary mechanism by which omissions function in complex systems.
  *   **Status:** **NN**.

  **4. Ex Nihilo Nihil Fit (Nothing from Nothing)**
  *   **Requirement:** The theory must address the intuition that "nothings" cannot exert force or transfer energy.
  *   **Justification:** If omissions are absences, and absences are nothing, how do they cause? A theory must either deny the intuition, deny the ontology, or explain the mechanism.
  *   **Status:** **CC**. (Accepting this intuition often leads to skepticism about omission causation).

  ---

  ## IV. The Negative Result: Constraints and Incompatibilities

  This section identifies the specific hurdles that render a unified theory of omission-causation precarious.

  ### The Killer Requirement: Normative Independence
  **The Requirement:** *Causation must be distinct from Normative Expectation.* (Derived from Section I.3 and II.5).
  **Why it eliminates accounts:** This is the single requirement that eliminates the most otherwise plausible accounts. Many theories solve the "Baseline Problem" and the "Global Gardener" case by defining an omission as a deviation from a *duty* or *norm*.
  *   **The Failure:** If an omission is defined by a duty, then causation becomes normative. This violates the distinction between Causation and Blame (Section II.2). It implies the lifeguard *caused* the drowning more than the bystander in a metaphysical sense, not just a legal one. Most metaphysical accounts fail here because they cannot fix the baseline descriptively without over-generating causes (the Queen waters the plant), so they sneak in norms to prune the causal field, thereby collapsing causation into responsibility.

  ### The Impossible Pair: Ontological Parsimony vs. Causal Efficacy
  **The Pair:**
  1.  **Ontological Parsimony:** There are no negative entities/absences; only positive events exist. (Derived from Section II.3 and III.4).
  2.  **Causal Efficacy:** Omissions are genuine causes, not merely explanatory conveniences. (Derived from Section III.1).

  **Why it makes a unified theory look hopeless:**
  *   **The Tension:** If (1) is true, causation (typically a relation between events) cannot relate an omission to an effect, because the omission does not exist. To save (2), one must posit negative events (violating 1) or redefine causation as a relation between facts/propositions (which risks making causation mind-dependent).
  *   **The Result:** If you hold both, you are forced into a "Quasi-Realism" where omissions cause things only relative to a model or expectation. But if causation is model-relative, it loses its objective metaphysical status (violating Section II.2).
  *   **Conclusion:** You can have a parsimonious ontology (no omissions as causes), or you can have robust omission causation (at the cost of negative entities), but you cannot have both without treating causation as a normative or pragmatic construct rather than a metaphysical relation. This is the core deadlock: **To save the reality of omission causation, you must populate the world with absences; to keep the world free of absences, you must deny the reality of omission causation.**
