answer: |-
  A wealthy tech CEO sits across from a broker at *Ex Nihilo Ethics*, a firm specializing in repugnance offsets.

  **CEO:** "I want to invest in kidneys, but I have ethical reservations. Specifically, the two standard objections."

  **Broker:** "The Coercion Objection and the Corruption Objection. We handle both."

  **CEO:** "How?"

  **Broker:** "To address Coercion, we purchase living-donor kidneys at twenty percent above the black-market rate, ensuring the vendor is truly willing. To address Corruption, we immediately incinerate the organ. It never enters a body, never enters a hospital. We aren't commodifying the kidney; we are *decommodifying* it. We convert a tradable asset into pure ash."

  **CEO:** "So, by paying you, I'm effectively removing a kidney from the global supply without touching it."

  **Broker:** "Precisely. You purchase a 'Renal Retirement' offset. You get the moral benefit of a banned market without the legislative lag."

  **CEO:** "Okay. How much is the offset?"

  **Broker:** "That depends on the current spot price of kidneys in Southeast Asia."

  **CEO:** "Why? I'm paying to *stop* that market, not participate in it."

  **Broker:** "If we priced the offset lower than the market rate, vendors would sell to us instead of transplant tourists, driving up demand. If we priced it higher, we'd be inflating the value of human tissue. So, the cost of the offset fluctuates daily."

  **CEO:** "So, if the market price of kidneys crashes..."

  **Broker:** "...your conscience goes on sale."

  **CEO:** "And if the price of a kidney skyrockets?"

  **Broker:** "Then doing the right thing becomes a premium service. Supply and demand, sir. We don't set moral values; we just hedge them."
