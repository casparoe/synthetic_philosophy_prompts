      *   *Menu/List Format:* Yes.
      *   *Evaluate Trivial/Plausible/False:* Yes.
      *   *Identify Argument Ender:* Yes.
      *   *Identify Quine's Target:* Yes.
      *   *No Single Answer:* Present the landscape.

  9.  **Final Polish:**
