  0.58

  **The Breakdown**

  *   **0.08 — The Separate-Boxes Move:** This blunts the practical force of the objection (you don't have to calculate in the moment), but it leaves the theoretical wound open (the calculation still justifies the act).
  *   **0.30 — Integrity as Reality:** This is the heavy lifter; if integrity is just a psychological preference, Williams loses, but if it's a condition of agency, the damage is severe.
  *   **0.10 — Thought vs. Act Standing:** This accounts for whether the *motive* changes the moral texture of the life, or if only the outcome counts.
  *   **0.10 — The "He-Likes-The-Check" Case:** Your twist confirms the objection is structural (about reasons), not psychological (about feelings), sustaining the damage claim.

  **How They Combine**
  I'm treating this as an additive model of independent weights. The "Separate-Boxes" defense subtracts from the maximum possible damage, while the reality of Integrity and your structural twist add probability mass to the claim that the theory is fundamentally misaligned with human agency. The sum represents the residual damage after the utilitarian defense has done its work.

  **Hostage & Movement**
  Your number is most hostage to **Integrity as Reality**. If integrity is merely a "taste for being whole" (a preference satisfaction), the credence drops to near zero. What would move it most is a metaphysical account of "ground projects"—specifically, proving that personal commitments are *constitutive* of the self rather than just *contingent* desires the self happens to have.

  **The Disagreement**
  You and your mate are talking past each other on the **scale**, not just the theory. You are rating the *damage to Utilitarianism* (0.3); he is rating the *strength of the Utilitarian defense* (0.75). Substantively, you disagree on **Integrity**. You suspect integrity is doing real normative work (hence your twist about the "check" feeling alien even if liked); he likely sees integrity as a psychological bug that the "Separate-Boxes" move patches. He thinks he's fixed the engine; you're pointing out the map is still wrong.
