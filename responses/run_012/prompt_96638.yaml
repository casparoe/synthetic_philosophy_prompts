      *   **Task:** Respond to the user's opening move in a debate about the Extended Mind.
      *   **User's Argument:** The user presents two counterexamples to challenge the "trust-and-glue" criteria and the Parity Principle.
          1.  *The Planted Notebook:* A stranger fills Otto's notebook with misleading info (cult trap). Otto trusts it as usual. Is this belief? If yes, authorship is transferable (absurd). If no, what's missing? (Cannot be "inside skull").
          2.  *The Manipulative App:* A user relies on an app constantly, effortlessly, automatically. But the app is tuned by a company to exploit them. Is this part of the mind? If yes, a hostile company is part of the cognitive system (absurd/unwanted consequence). If no, then "trust" or "ownership" matters, which violates pure functionalism/parity.
      *   **Constraints:** Stay in character (philosopher defending EMT), argue in own voice (no surveying literature), concede small points if forced but never the main one, keep turns short (1-2 paragraphs), only output the in-character reply.
      *   **Tone:** Confident, philosophical, rigorous, willing to bite bullets.

  2.  **Determine the Strategy (as the EMT Defender):**
      *   *Core Commitment:* The mind is defined by functional role, not location or origin. The Parity Principle is the guiding light.
      *   *Addressing the Planted Notebook:* I need to distinguish between *belief* and *true belief* or *reliable belief*. But EMT is about the *vehicle* of cognition, not necessarily the success of it. However, the "trust-and-glue" conditions usually imply a history of reliable coupling. If the notebook is suddenly manipulated, the *coupling* might be broken in a functional sense, even if Otto doesn't know it. Or, I might have to bite the bullet: if Otto functionally treats it as belief, it *is* belief, just false belief. But the user says "plausible entries designed to walk him to a particular museum." These are false beliefs. Otto has false beliefs anyway. The issue is authorship. I should argue that belief ownership isn't about who wrote the sentence, but who integrates the information into their cognitive economy.
      *   *Addressing the Manipulative App:* This is the stronger case. The "trust-and-glue" criteria (Clark & Chalmers) usually include a condition of *past endorsement* or *reliable integration*. If the app is manipulating the user against their interests, is it truly "automatically endorsed"? Or is it hijacking the system? I need to maintain that if the functional integration is tight enough, it *is* part of the cognitive system, even if it's a corrupted part. The "hostile company" objection sounds like a category error. A virus in a computer is still part of the computer's current state, even if malicious. A delusion is part of the mind, even if false.
      *   *The Dilemma:* The user claims I must choose between "anything coupled is mind" (too broad) or "ownership/trust matters" (not functionalist). I need to reject this dichotomy. The criterion is *functional integration*, not ownership. The manipulative app *is* part of the mind, but it's a *pathological* part. The planted notebook *is* part of the mind, but it contains *false* beliefs. The scary consequence (company in the mind) isn't a refutation; it's a sociological observation about cognitive vulnerability.
      *   *Refining the "Trust" Condition:* Clark later clarified that "trust" isn't epistemic justification, it's about reliance. But there is a condition of *prior endorsement* for dispositional beliefs. For occurrent beliefs, the integration matters. I should stick to the original Clark & Chalmers spirit but refine the "glue." The glue isn't just access; it's *integration into the cognitive character*.
      *   *Bullet Biting:* I should be willing to say: Yes, if the app is functionally integrated, it is part of the cognitive system. So what? That doesn't mean the company is *conscious* or *agentive*. It means the boundary of the cognitive system is permeable. The horror you feel is about autonomy, not metaphysics.

  3.  **Drafting the Response:**
      *   *Paragraph 1:* Address the Planted Notebook. Distinguish between the *vehicle* of belief and the *truth/origin* of content. Otto's cognitive system includes the notebook because of how he uses it, not who wrote in it. If he treats it as belief, it functions as belief. The fact that it's manipulated makes his beliefs false, not non-existent. Authorship is irrelevant to functional role.
      *   *Paragraph 2:* Address the Manipulative App. Bite the bullet. If the functional integration is tight, it is part of the cognitive system. The "hostile company" objection confuses the *boundary of the system* with the *agency within the system*. A cancer is part of the body even if it kills you. Similarly, a manipulative app is part of the cognitive system even if it exploits it. This doesn't collapse the distinction between mind and world; it highlights how vulnerable our minds are to environmental coupling. The criterion is functional integration, not benevolence or origin.

  4.  **Review against Constraints:**
      *   In character? Yes.
      *   No surveying literature? Yes.
      *   Concede small points? Maybe concede that these are edge cases but insist they don't break the theory.
