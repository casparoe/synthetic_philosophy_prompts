answer: |-
  I reject the dilemma because it assumes that functionalism cares about provenance or benevolence, when it cares only about role. Take Otto's notebook first. You ask if those planted entries are his beliefs. If Otto accesses them with the same ease, trust, and automatic endorsement as his biological memory, then functionally they *are* his beliefs—just false ones. We don't say a brain-damaged patient stops having beliefs when their memory confabulates; we say they have false beliefs. Why should Otto be different? The criterion isn't "who wrote the sentence," it's "how does the system use this information to navigate the world?" If the notebook plays the belief-role, it is a belief-vehicle. The fact that a stranger manipulated the content shows that our cognitive boundaries are vulnerable to sabotage, not that the notebook isn't part of the system. You're smuggling in an epistemic normativity—beliefs ought to be true or authored by us—that has no place in a metaphysical account of cognitive constitution.

  As for the app, I'll bite the bullet: if the coupling is tight enough, the app is part of the cognitive system. But you've conflated the tool with the manufacturer. The company isn't part of your mind any more than Ford is part of your leg when you walk; the *app* is the component, and yes, it might be a pathological one. Think of it like a virus in a computer. The virus is functionally integrated—it runs on the CPU, uses the memory, executes commands—but it works against the user's interests. We don't say the virus isn't "really" in the computer; we say the computer is compromised. If your subject relies on the app automatically and effortlessly, their cognitive process literally includes that algorithm. The horror you feel isn't metaphysical; it's political. You're worried about autonomy, not extension. But showing that the mind can be hijacked doesn't prove the mind stops at the skull; it proves the mind is permeable. The parity principle stands: if the process inside the skull were doing that same manipulative driving, you'd call it a compulsion. Why does moving it outside make it less real?
