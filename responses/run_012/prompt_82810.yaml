answer: |-
  Here is a plan for the ninety-minute session. It is designed to move the students from a moral judgment (forgery is lying) to an ontological one (forgery is a different kind of object), using their own intuition about writing as the lever to pry the problem open.

  ### 1. The Order of Ideas and Dependencies

  You must build the argument in four layers. If you introduce a layer too early, the students will use it to bypass the difficulty of the previous one.

  1.  **Indistinguishability (0–20 mins):** You must establish that the forgery is *perceptually identical* to the original.
      *   *Dependency:* Nothing else matters if they believe the forgery looks "worse" or "different."
      *   *Constraint:* Do not allow arguments about "brushwork" or "style" here. stipulate as a fact of the case that no eye or instrument can tell them apart.
  2.  **The Irrelevance of Deception (20–40 mins):** You must strip the scenario of fraud.
      *   *Dependency:* You cannot discuss aesthetic value if they are thinking about financial loss or the sin of lying.
      *   *Constraint:* Refuse to discuss the buyer's feelings. The question is about the *object*, not the *transaction*.
  3.  **The History of Production (40–60 mins):** You must introduce the idea that *how* a thing is made is part of *what* it is.
      *   *Dependency:* This only lands after they accept the objects look the same and no one is being tricked.
      *   *Constraint:* Do not use the word "provenance" yet; keep it physical. "This canvas was touched by Artist A; that one by Artist B."
  4.  **The Category of the Work (60–90 mins):** You must distinguish between works that are *objects* (paintings) and works that are *patterns* (novels).
      *   *Dependency:* This is the resolution of the tension. It relies on the friction generated in step 3.
      *   *Constraint:* Do not state this distinction yourself. Elicit it from them by contrasting the painting case with their own novels.

  **Where the sequence breaks:** If you introduce **Category** (4) before **History** (3), they will simply say "Books are different" and stop thinking. If you introduce **Deception** (2) before **Indistinguishability** (1), they will argue about crime rather than art.

  ### 2. The Single Case

  Do not use the "Master Forger's Fake Old Master." It is too laden with baggage: money, age, dead artists, museum prestige. It lets the students off the hook by allowing them to argue about market value or historical significance rather than aesthetic value.

  **The Case:** **The Handwritten Manuscript of a Masterpiece.**

  *   **What it must have:** It must be a novel that exists *only* in a single handwritten draft (e.g., the only copy of *The Great Gatsby* before typesetting).
  *   **What it must conspicuously lack:** It must lack the printed text. We are not talking about the story yet; we are talking about the physical pages.
  *   **The Scenario:**
      1.  The Author writes the manuscript. It is a beautiful object.
      2.  A Forger creates a perfect physical duplicate (same ink, same paper, same handwriting).
      3.  **Crucial Twist:** The Author confesses which is which. No one is being sold a lie. The museum knows which is the fake.
      4.  **The Question:** If the museum must burn one to save the other, which do they save? And if they save the fake, have they lost the *work*?

  **Why this case:** It forces your students (fiction writers) to confront the duality in their own medium. They instinctively know the *text* is the novel (which supports the forgery), but they also revere the *manuscript* as an artifact (which supports the original). It internalizes the Painting vs. Novel tension within a single object they understand.

  ### 3. Misconceptions and Intervention Points

  The students will bring three specific misconceptions. You must handle them in this order:

  1.  **"It's about the Lie."**
      *   *When it surfaces:* Immediately, in the first 10 minutes.
      *   *Action:* **Pre-empt this.** State clearly at the outset: "In this session, the museum knows which is which. No one is being defrauded. Money is irrelevant. We are asking about the object, not the crime." Write **NO FRAUD** on the whiteboard.
  2.  **"The Forger Lacks Genius."**
      *   *When it surfaces:* Minutes 20–30. They will argue the copy is "mechanical" and the original is "creative."
      *   *Action:* **Let them walk into this.** Ask: "If the forger had to solve the exact same problems to copy the ink flow, is that not also skill?" Let them argue. Then, at minute 40, collapse it: "If a machine made the copy, would it be worse? If yes, why does the *hand* matter more than the *mark*?"
  3.  **"Scarcity Creates Value."**
      *   *When it surfaces:* Minutes 50–60. They will argue the original is better simply because there is only one.
      *   *Action:* **Turn it back on the Novel.** Ask: "My novel has ten thousand copies. Is it ten thousand times worse than the manuscript?" This forces them to see that scarcity isn't the whole answer.

  ### 4. The Closing Question

  Do not ask "Is forgery wrong?" That invites moralizing. Do not ask "Is the fake art?" That invites definition-haggling.

  Ask this:

  > **"If the experience of reading the forgery is identical to the original, what exactly died when the original was destroyed?"**

  *   **The Student Who Has Been Persuaded Forgery is Fraud** will answer: "The truth died," or "The owner was cheated." (They have missed the point; we excluded fraud).
  *   **The Student Who Has Understood the Problem** will answer: "The history died," or "The connection to the maker died," or "They are different objects entirely." (They have located the value in the *genesis*, not the *appearance*).

  ### 5. What to Decline and How to Justify It

  You must openly decline to discuss **Copyright and Intellectual Property.**

  Students will want to talk about the right to publish, the author's estate, and legal ownership. This is a legal question, not an aesthetic one, and it will swallow the session.

  **The Sentence to Offer:**
  > "We are not asking who owns the work, but where the work lives."

  Write this on the board at the start. If they drift toward law, point to the sentence. It reminds them that you are hunting for the *location of value* (in the ink? in the idea? in the history?), not the location of rights.

  ### Summary of the Board Plan

  To keep yourself on track, your whiteboard should look like this by the end of the session:

  1.  **Top Left:** NO FRAUD / NO MONEY
  2.  **Top Right:** WE ARE NOT ASKING WHO OWNS THE WORK, BUT WHERE THE WORK LIVES.
  3.  **Center:** THE MANUSCRIPT (Original) vs. THE FACSIMILE (Copy)
  4.  **Bottom Left:** PAINTING LOGIC (Value in the *History* of the object)
  5.  **Bottom Right:** NOVEL LOGIC (Value in the *Pattern* of the text)

  Your job is not to reconcile the Bottom Left and Bottom Right. Your job is to make them feel the tear between the two.
