answer: |-
  Good evening, everyone. For those who don't know me, I am [Sister's Name]'s younger sibling. Standing here, looking at my sister and [Partner's Name], I am struck by how much ground they cover just by standing still.

  We often tell a story about marriage that says two people search until they find the one missing piece that makes them whole. It is a comforting story, but I don't think it is the true one. If you look closely at [Sister] and [Partner], you do not see two halves searching for completion. You see two whole people who have already been made—made by the parents who raised them, the friends who challenged them, and the family who held them when they were small.

  We tend to think of ourselves as finished products when we reach adulthood. But the truth we see in this room is that personhood is not a status we are simply given at birth. It is a work we undertake. It is something we become, through how we treat the people around us. My sister and [Partner] are not here to close themselves off from the world in a private circle of two. They are here to join their strengths so they can engage that world more deeply.

  This work extends beyond this room. They stand today on the foundation laid by those who came before them—parents, grandparents, and ancestors whose hands are no longer here to hold, but whose values still support the floor we stand on. We honor them by recognizing that we do not walk alone. But this work also reaches forward. There are future generations, perhaps not yet born, who will inherit the quality of the relationships built here. The stability you offer them begins with the care you show each other tonight.

  I know that for some, talk of community can sound like it diminishes the individual. But I see it differently. It is precisely because you are surrounded by others that your own choices matter. No one can live this marriage for you. The community provides the ground, but you must build the house. You have the responsibility to choose, every day, to nurture the humanity in each other. You have the autonomy to fail, and the power to repair.

  So, my wish for you is not that you never need anyone else. My wish is that you always know how much you need us, and how much we need you. May you find your strength in this web, not despite it. May you honor those who walked before you by walking wisely yourselves, and may you clear a path for those who will follow.

  Please raise your glasses. To [Sister] and [Partner]. To the work ahead, and to the becoming of you both.
