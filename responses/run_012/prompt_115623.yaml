answer: |-
  # Activity Design: The Galactic Equilibrium Game

  **Session Length:** 90 Minutes
  **Participants:** 18–24 (Ideal: 24)
  **Materials:**
  *   One large hex-grid map (6x4 or 8x4) drawn on a whiteboard or printed on butcher paper.
  *   24 Distinct colored tokens (one per player).
  *   "Missile" tokens (small distinct markers, approx. 20).
  *   Index cards for Roles (22 "Civilization," 2 "Cleaner").
  *   Order slips (small paper strips, 5 per player).
  *   Dice (d6), one per player or pair.
  *   Timer.

  **Core Concept:** Do not mention the "Dark Forest," Liu Cixin, or the Fermi Paradox until the final 15 minutes. Frame this as a simulation of resource competition under uncertainty.

  ---

  ## Part 1: Setup & Rules (15 Minutes)

  **1. Distribution (5 mins)**
  *   Seat participants around the map. Place one token per player on a random hex. Leave some empty hexes if the grid is larger than the player count (to allow expansion).
  *   Hand out **Role Cards** face down.
      *   **Civilization (Most players):** Your goal is to maximize your **Score** (Territory + Tech Level) at the end of the game. You choose your own actions.
      *   **Cleaner (2 players, secret):** Your goal is to eliminate any detected civilization. **Rule:** If you detect another civilization (via adjacency or leakage), you *must* launch a Strike on your next turn. You cannot broadcast. You cannot expand.
      *   *Note:* Nobody knows how many Cleaners exist. It could be zero. It could be half the room.
  *   Assign each player a **Tech Level** of 1. Write this on their order slip pad.

  **2. The Mechanics (10 mins)**
  Explain the four actions available each Era (Turn). Players write orders secretly.

  1.  **Expand:** Move to an adjacent empty hex.
      *   *Risk:* **Leakage.** You are automatically detected by all neighbors in your new hex.
  2.  **Listen:** Stay put. Roll a d6. On a 5-6, you detect the precise location of all neighbors.
      *   *Benefit:* Low leakage. You are only detected by neighbors who *Expand* or *Broadcast*.
  3.  **Broadcast:** Stay put. Reveal your location to **everyone** on the map.
      *   *Benefit:* Gain +1 Tech Level immediately.
      *   *Risk:* Everyone knows where you are.
  4.  **Strike:** Target a specific hex coordinate (must be known via detection).
      *   *Mechanic:* Place a "Missile" token on the target. It lands in **2 Eras**.
      *   *Resolution:* When the missile lands, compare **Attacker Tech (at launch)** vs. **Defender Tech (at impact)**.
      *   *Kill:* If Attacker Tech ≥ Defender Tech, the token is removed (Civilization destroyed).
      *   *Fail:* If Defender Tech > Attacker Tech, the missile is removed harmlessly.
      *   *Constraint:* You cannot strike a location you do not know.

  **The "Chain of Suspicion" Engine:**
  *   At the end of *every* Era, **all Civilizations automatically gain +1 Tech Level.**
  *   *Why this matters:* If you detect a neighbor at Tech 2, and you are Tech 3, you must strike *now*. If you wait one turn, they become Tech 3. If you wait two, they become Tech 4, and your strike (launched at Tech 3) will fail upon impact. **Waiting makes attacks futile.**

  **Win Condition (Run 1):**
  *   Game ends after 4 Eras.
  *   Score = (Current Tech Level) × (Number of Tokens Controlled).
  *   Dead players score 0.

  ---

  ## Part 2: Run 1 – The Silent Forest (35 Minutes)

  **Timeline:**
  *   **Era 1 (5 mins):** Orders written. Resolve Expansion (move tokens, announce leakage). Resolve Listening (players whisper detections to Facilitator, who notes them). *No strikes yet.*
  *   **Era 2 (10 mins):** Orders written. **First Strikes possible.** Place Missile tokens. Resolve detections. Tech increases.
  *   **Era 3 (10 mins):** Orders written. **Missiles from Era 2 Land.** Resolve combat (Facilitator checks Tech levels publicly). New Strikes launched.
  *   **Era 4 (10 mins):** Final Turn. Missiles land. Game Ends.

  **Facilitator Notes during Play:**
  *   **Enforce Silence:** No verbal negotiation between players. "Diplomacy is impossible at this distance."
  *   **Track Cleaners:** If a Cleaner detects someone, ensure they strike. If they don't, remind them of their card constraint.
  *   **Highlight Tension:** When a missile is placed, announce: "A threat is inbound. Impact in 2 turns." Watch the target's Tech level rise.

  **Predictable Failure Points (Run 1):**
  *   **Inertia:** Players may Listen/Hide for 3 turns. *Intervention:* Remind them the Win Condition requires Territory/Tech. Hiding yields low scores.
  *   **The Griefers:** A player Broadcasts immediately. *Reaction:* Let them be destroyed. This validates the risk for observers.
  *   **Side Deals:** Players whispering "I won't hit you." *Intervention:* Remind them they cannot verify this, and the Cleaner roles (unknown to them) cannot honor deals.

  ---

  ## Part 3: Run 2 – The Variant (20 Minutes)

  Reset the board. Same roles (Cleaners remain secret). Same map.
  **Change the Rule:** Announce **one** of the following variants. (Recommendation: **Variant A**).

  *   **Variant A: The Costly Beacon (Signaling)**
      *   New Action: **Handshake.** You may sacrifice your next 2 turns of Tech growth (freeze level) to send a Verified Signal.
      *   Effect: All players know your location, *but* they also know you have voluntarily capped your growth. You are not an immediate threat.
      *   *Theory:* Tests if credible commitment dissolves the forest.
  *   **Variant B: Defensive Shields (Arms Race)**
      *   New Action: **Shield.** Spend a turn to gain a "Shield Token." One Shield blocks one Missile strike.
      *   *Theory:* Tests if defense stabilizes the system (usually it doesn't; it just accelerates offense).
  *   **Variant C: Survival Win Condition (Non-Expansionist)**
      *   New Rule: Win condition is simply **Survival**. Score is 1 if alive at end, 0 if dead. Expansion is optional.
      *   *Theory:* Tests if the forest is driven by resource hunger or pure fear.

  **Timeline:**
  *   **Era 1-3 (20 mins):** Faster pace. Resolve strikes immediately upon impact.

  ---

  ## Part 4: Debrief & Theory (20 Minutes)

  **1. The Reveal (5 mins)**
  *   Reveal the name: **The Dark Forest Hypothesis.**
  *   Reveal the Cleaner count. Ask the Cleaners: "Did you feel aggressive, or obligated?" (They should say obligated).
  *   Ask the victims: "When you saw the missile, could you outrun it?" (No, because Tech growth is automatic/universal).

  **2. Mapping the Mechanics to Theory (10 mins)**
  Guide the discussion using these specific anchors:

  *   **The "Use It or Lose It" Window:** Ask the players who launched strikes: "Why did you strike *then*?"
      *   *Lesson:* Because the target's Tech was rising. In the Dark Forest, technological explosion is the danger. A civilization that is harmless today may be lethal in a century. The strike must happen while you still *can* win.
  *   **The Cleaner Role:** Ask: "Did you need 50% of the galaxy to be hostile to feel unsafe?"
      *   *Lesson:* No. The existence of *one* unknown hostile actor (or the non-zero probability of one) makes broadcasting a dominated strategy. This is not about average hostility; it is about worst-case risk management.
  *   **The Win Condition:** Ask: "Why did you Expand?"
      *   *Lesson:* The game rewarded growth. The Dark Forest assumes civilizations are expansionist by nature (or necessity). If you don't grow, you starve. If you grow, you become a threat.
  *   **Prisoner's Dilemma vs. Dark Forest:**
      *   *PD:* Two players can talk. Mutual Cooperation is a stable equilibrium if repeated.
      *   *DF:* Communication *is* detection. You cannot say "I am peaceful" without revealing your location. There is no channel for trust. Mutual Non-Aggression is not stable because you cannot verify the other person isn't a "Cleaner."

  **3. Analyzing the Variant (5 mins)**
  *   If you ran **Variant A (Costly Beacon):** Did anyone use it? Did it stop strikes?
      *   *Analysis:* This dissolves the forest *if* players trust the cost. It breaks the "no credible communication" axiom.
  *   If you ran **Variant B (Shields):** Did strikes increase or decrease?
      *   *Analysis:* Likely increased. This relocates the problem. Now I must strike *twice* to kill you, or strike *before* you build the shield. It accelerates the arms race.
  *   If you ran **Variant C (Survival):** Did the galaxy go quiet?
      *   *Analysis:* Likely yes. This attacks the "expansionist" axiom. If civilizations can be content with stasis, the need to eliminate competitors vanishes.

  ---

  ## Facilitator's Cheat Sheet: Troubleshooting & Limitations

  **What Will Go Wrong (And How to Fix It)**
  1.  **The "Turtle" Problem:** Everyone Listens/Hides. The board is static.
      *   *Fix:* In future runs, add a "Resource Depletion" rule. If you don't Expand every 2 turns, your Tech drops. This forces movement and contact.
  2.  **The "Martyr":** A player Broadcasts Turn 1 just to see what happens, then complains when they die.
      *   *Fix:* In debrief, use them. "This is why the forest is silent. The experiment was run, the data was collected (they died), and the rest of us learned not to do it."
  3.  **The "UN Treaty":** Players try to form alliances across the table.
      *   *Fix:* Remind them of the "Cleaner" role uncertainty. "Can you verify your ally isn't a Cleaner? Can you verify they won't strike you to secure their own survival?" This mirrors the *Chain of Suspicion*.

  **What This Activity Cannot Reproduce (Be Honest)**
  1.  **Sample Size (N=1):** We are playing 24 civilizations. In reality, we have one data point (Earth). We cannot calculate probabilities of hostility. The game gives players a "meta-game" sense of probability that real civilizations wouldn't have.
  2.  **Light Speed & Time:** In the game, turns are simultaneous. In reality, a strike might take 1,000 years to arrive. The target might be dead of natural causes, or evolved into something unrecognizable. The game makes the dilemma feel *urgent*; cosmology makes it feel *geological*.
  3.  **The Trope:** Your students likely know the Dark Forest theory. They are role-playing a concept they already understand.
      *   *Mitigation:* Acknowledge this. Ask: "Did you play the *game*, or did you play the *trope*? If you didn't know the theory, would you have Broadcast?"

  **Final Takeaway for the Class:**
  The Dark Forest is not a claim that aliens are evil. It is a claim that **uncertainty + growth + inability to commit** creates a system where evil behavior is the rational survival strategy. To escape the forest, you do not need better weapons; you need a way to make a promise that travels faster than a missile.
