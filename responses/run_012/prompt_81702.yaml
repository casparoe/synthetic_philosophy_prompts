answer: |-
  This is a sharp diagnostic of your own project. You have identified the fault line where a pragmatic political settlement tries to wear the coat of a moral reconciliation project. When the fabric tears, you need to know which layer ripped.

  Here is the exposure map you asked for. I have ranked the objections by how much they should move you, starting with the decisive threats to the "default" status of your claim, moving down to the awkward but survivable complications. I have also committed to the successor problem as requested.

  ### 1. The Decisive Objection: The Durability Paradox (The Successor Problem)

  You asked for a commitment on whether a repudiated bargain (like Argentina's) becomes retroactively unjustified.

  **The Commitment:** If the justification for amnesty is *stability*, and the stability proves temporary, the **ex ante justification is undermined.**

  Here is why: The argument for conditional amnesty is usually consequentialist. It claims that trading justice for truth buys a specific good (peace/stability) that would otherwise be impossible. This is a prediction about the future. If the next generation repudiates the deal and prosecutions resume without collapsing the state (as happened in Argentina), it proves the original prediction was false. The state *could* have handled prosecutions earlier, or the "threat" of instability was exaggerated by the perpetrators to secure immunity.

  If the "settlement" turns out to be merely a "pause," you haven't bought stability; you've bought time. If you buy time at the cost of justice, and that time doesn't yield the promised consolidation of democracy, the transaction was a bad deal.

  **Why this moves you:** This attacks the "default" status of your view. It suggests conditional amnesty is not a *solution* to the transition problem, but a *deferral* of it. If the deferral is inevitable (because the successor generation always demands reckoning), then the model is not an exit strategy; it is a waiting room. A theory of transition that cannot account for the longevity of its own settlement is descriptively inaccurate.

  ### 2. The Structural Blindspot (The TRC Limit)

  You asked if the TRC's limitation to "gross human rights violations" is fatal or a design flaw.

  **The Verdict:** It is a **design feature that limits the model's scope**, making it unsuitable as a *default* for all mass atrocities.

  Conditional amnesty relies on an *individualized* transaction: Person A confesses to Act B to get Immunity C. This works for killings, tortures, and bombings. It does not work for structural violence (pass laws, forced removals, economic dispossession), which is often legalistic, bureaucratic, and diffuse. No single individual can confess to "apartheid" in a way that satisfies the truth condition.

  **Why this moves you:** If your claim is that conditional amnesty is the default exit from *mass atrocity*, you must define atrocity. If the atrocity is primarily structural (as in South Africa), conditional amnesty systematically excludes the bulk of the suffering from the "truth" half of the bargain. It creates a hierarchy of victimhood where the tortured are acknowledged, but the dispossessed are ignored. This isn't just a flaw; it means the model is structurally incapable of addressing the root causes of the conflict. It pacifies the political elite (who ordered the bombs) while leaving the economic elite (who profited from the structure) untouched. If your theory cannot handle the most common form of modern political violence (structural/ systemic), it cannot be the default.

  ### 3. The Epistemic Capture (The Rwanda/Gacaca Test)

  You asked how Gacaca tests the view. Gacaca was not full amnesty, but it was a confession-for-leniency scheme. The complaint is that it ratified the victor's narrative.

  **The Exposure:** Conditional amnesty requires a neutral arbiter of "truth." In civil war transitions, **neutrality is impossible.**

  In Rwanda, the RPF (victors) were exempt from the jurisdiction, while the Interahamwe (losers) were subject to it. The "truth" produced was necessarily partial. If the "truth" condition is politically captured, the moral currency of the amnesty is debased. It becomes a tool of consolidation for the new regime, not a shared story for the nation.

  **Why this moves you:** This challenges the "shared story" premise. You argue the country gets a shared narrative. But if the narrative is enforced by the victors, it is not shared; it is imposed. This turns the amnesty from a reconciliatory bargain into a weapon of war by other means. If the "truth" is contested later (as it is in Rwanda regarding RPF crimes), the stability you bought is based on a lie. This feeds back into the Successor Problem: lies have a shorter half-life than truths.

  ### 4. The "Two Positions Wearing One Coat" Diagnosis

  You suspected your position is actually two positions. You are correct.

  1.  **The Pragmatic Ceasefire:** Amnesty is a necessary evil to stop the killing and get the guns silent. It is a hostage exchange.
  2.  **The Moral Reconciliation:** Amnesty is a restorative process that heals the nation through truth.

  The coat tears when the Ceasefire succeeds but the Reconciliation fails. In South Africa, the guns stopped (Ceasefire success), but the economic structure remained and social trust is still fractured (Reconciliation failure).

  **The Exposure:** If you are arguing for the Ceasefire, you don't need "full public account." You just need disarmament. If you are arguing for Reconciliation, you need more than immunity; you need reparations and structural change. By conflating them, you insulate the view from criticism. When critics say "it didn't heal the nation," you say "it stopped the civil war." When critics say "it let killers go free," you say "it gave victims a voice."

  **The Fix:** You must choose. If it's the Ceasefire, admit it's a tragic necessity, not a normative ideal. If it's Reconciliation, admit it requires more than truth-telling. Currently, your view hovers between them, which makes it resilient to critique but theoretically vague.

  ### 5. The Insulation Question

  You asked if the position has been qualified so heavily that nothing could count against it.

  **The Honesty Check:** Yes, there is a risk of insulation.

  If every failure of conditional amnesty is attributed to "lack of political will," "incomplete implementation," or "external interference," the theory becomes unfalsifiable. For your view to hold, you must admit that **some societies are not capable of this bargain.**

  If the precondition for conditional amnesty is a certain level of civil society strength, a neutral judiciary, and a balance of power that forces negotiation rather than victory, then it is not a *default* for exiting mass atrocity. It is a *luxury good* available only to specific transitions (like South Africa) and not others (like Syria or Myanmar). If the conditions for the theory to work are as rare as the cases where it succeeds, the theory describes an exception, not a rule.

  ### 6. The Missing Case (What Would Move You)

  You stated: *"The thing that would move me most is a real case where an amnesty that was actually honoured produced the truth and stability it promised without the successor generation having to repudiate it."*

  **The Reality:** **That case does not exist.**

  *   **South Africa:** The stability holds, but the "truth" is increasingly contested, and the economic inequality (the structural violence) has led to a crisis of legitimacy among the younger generation who feel the bargain was a sell-out. It hasn't been legally repudiated yet, but the social contract is fraying.
  *   **Chile/Uruguay:** Amnesty laws were eroded or circumvented over time.
  *   **El Salvador:** The amnesty was struck down by the supreme court decades later.
  *   **Rwanda:** Stability yes, but at the cost of authoritarianism and victor's justice, not the liberal reconciliation you are likely theorizing.

  **What this tells you:** The absence of this case suggests that **intergenerational justice cannot be bargained away by a single generation.** The "Successor Problem" is not a bug; it is a feature of democratic time. A democratic generation does not accept the moral debts of the previous generation as settled.

  ### Summary of the Exposure Map

  1.  **Decisive:** The **Successor Problem**. If the deal doesn't stick, the "stability" justification was false *ex ante*. This demotes conditional amnesty from a "solution" to a "deferral."
  2.  **Decisive:** The **Structural Blindspot**. The model cannot address systemic violence, only individual acts. This prevents it from being a "default" for most modern atrocities which are structural.
  3.  **Significant:** The **Epistemic Capture**. Without neutral arbitration, "truth" becomes "victor's narrative," undermining the reconciliation claim.
  4.  **Diagnostic:** The **Two Coats**. You are mixing a pragmatic ceasefire with a moral reconciliation project. They have different success conditions.
  5.  **Insulation Warning:** If you blame failures on "implementation," the theory is unfalsifiable. Admit that the preconditions for success are rare.
  6.  **The Missing Case:** The fact that no case fits your ideal type suggests the ideal type is impossible in a democratic context where future generations have agency.

  **Final Advice:**
  To finish the chapter, stop trying to prove conditional amnesty is the *right* way to exit atrocity. Instead, argue that it is the **only available lie that allows the transition to begin**, but acknowledge that it mortgages the future. Shift your claim from "This is the justified default" to "This is the tragic necessity that always carries a debt the next generation will demand be paid."

  That resolves the Successor Problem: The original bargain *was* justified ex ante (to stop the killing), but it *creates* an injustice ex post (the repudiation). The tragedy is not that the deal failed, but that it had to be made in the first place. That is a political theory worth writing.
