answer: |-
  # Q&A Strategy Sheet: The Dominance Test & Partial Ordering

  **Context:** Comparative Genocide Workshop
  **Thesis:** Atrocity comparison is valid as a partial ordering (dominance test), not a ranking. Indeterminacy is an ethical feature, not a bug.
  **Audience:** Historians (Colonial/Holocaust), Analytic Ethicists, Political Theorist (Reparations).

  ---

  ## I. Pre-Emptive Concessions & Holds

  **What to Concede Up Front (in opening or early Q&A):**
  *   **Policy Limitations:** Admit immediately that this framework will not generate a neat hierarchy for reparations budgets. If you promise a tool for allocation, you will fail. Concede that your model limits *comparative* judgment to protect *singular* judgment.
  *   **The "Rareness" Problem:** Acknowledge that under strict dominance (Pareto), very few historical cases will technically qualify as "worse than" others. Most will be indeterminate. Do not try to hide this.

  **What to Hold Firm:**
  *   **Indeterminacy is Honest:** Do not apologize for incomparability. Frame it as resisting the "Olympic medal" approach to suffering.
  *   **Agency over Suffering:** Hold the line that "constraint on agency" is the metric, not "amount of pain." Pain is subjective/phenomenological; agency destruction is structural/political.
  *   **The Dimensions:** Do not allow the *list* of dimensions to be renegotiated in the Q&A. Defend them as necessary conditions for collective existence, not exhaustive descriptions of harm.

  **The Single Reply That Must Land:**
  *   *The "False Precision" Argument:* You must convince the room that **ranking atrocities creates moral hazards that indeterminacy avoids.** If you cannot land the idea that a false hierarchy is more dangerous than no hierarchy, the paper becomes an academic exercise with no ethical stakes.

  ---

  ## II. Objections (Ordered by Likelihood & Damage)

  ### 1. The "Paralysis" Objection (Analytic Ethicists)
  **Likelihood:** High | **Damage:** High
  **Voice:** "You've constructed a definition of 'worse than' that is so stringent it renders the concept practically empty. If Atrocity A exceeds B on four dimensions but is equal on the fifth, or if they cross-cut, you declare them incomparable. In value theory, we call this a failure of the metric to guide action. If your partial ordering yields indeterminacy in 90% of cases, have you solved the problem of comparison, or simply defined it away?"

  **Two-Minute Reply:**
  "I accept the scarcity of dominance relations. But scarcity is not emptiness; it is precision. When we force a ranking where no dominance exists, we are not discovering moral truth; we are imposing a false commensurability. My goal isn't to make comparison *easier* for the sake of judgment; it's to make it *harder* to prevent the instrumentalization of victimhood. If the model says 'indeterminate,' the ethical command is not 'guess,' it is 'attend to the specific structure of each.' The work of the ethicist shifts from ranking to diagnosing. If that feels like paralysis, it is only because we are addicted to the idea that moral clarity requires a hierarchy."

  **Weakness of Reply:**
  It risks sounding like a retreat. If the ethicists press on *decision procedures* (e.g., triage situations), "diagnosing" doesn't help choose which group gets aid first.

  ### 2. The "Reparations Reality" Objection (Political Theorist)
  **Likelihood:** High | **Damage:** Critical
  **Voice:** "I advise a reparations commission. We operate in a world of finite resources. We *must* prioritize. If you tell a commission that the Herero genocide and the Holocaust are 'incomparable' under your dominance test, you haven't given us an ethical safeguard; you've given us an administrative deadlock. How does indeterminacy help me allocate funds without appearing to rank suffering?"

  **Two-Minute Reply:**
  "It helps by shifting the justification for allocation away from *moral worth* and toward *capacity for repair.* Your commission should not be asking 'Who suffered more?' but 'What is required to restore agency in this specific context?' My model blocks the argument that Group X deserves less because their trauma ranks lower. It forces you to justify funding based on the specific dimensions of harm present—e.g., funding land return for 'self-determination' harms, or education for 'identity' harms—rather than a lump sum based on a ranking. Indeterminacy protects you from the claim that you undervalued a group's pain; it mandates you address their specific constraints."

  **Weakness of Reply:**
  This requires the commission to adopt a complex, multidimensional budgeting strategy which may be bureaucratically impossible. It asks the theorist to change the entire system, not just the comparison method.

  ### 3. The "Flattening" Objection (Historians of Mass Violence)
  **Likelihood:** Medium | **Damage:** Medium
  **Voice:** "You list 'duration, scope, reversibility...' as independent dimensions. But in the archive, these aren't separable. The *quality* of the violence matters. Industrial extermination isn't just 'scope'; it changes the meaning of death. Slow colonial starvation isn't just 'duration'; it's a specific ontology of neglect. By breaking these into metrics for a dominance test, aren't you stripping the historical particularity that makes comparison meaningful in the first place?"

  **Two-Minute Reply:**
  "I am not arguing these dimensions capture the *experience* of violence; they capture the *structural constraints on agency.* You are right that the archive reveals singularities. My model is not a replacement for historical narrative; it is a guardrail for political judgment. We need the historian's particularity to understand *how* the constraint was imposed, and we need the dominance test to ensure we don't claim that understanding allows us to say one group's loss of future was 'greater' than another's. The dimensions are the bridge between your specific narratives and the political need to compare."

  **Weakness of Reply:**
  Historians may reject the idea that "agency constraint" can be separated from the lived experience of suffering. They may view the abstraction itself as a form of violence.

  ### 4. The "Holocaust/Colonial" Trap (Historians of Memory)
  **Likelihood:** Medium | **Damage:** High (Emotional/Political)
  **Voice:** "This feels like a workaround to the 'uniqueness' debate. If the Holocaust meets the dominance test against colonial genocides, you reinforce exceptionalism. If colonial genocides dominate the Holocaust on 'duration,' you risk trivializing the Shoah. Isn't this dominance test just a mathematical way to fight the same old memory wars?"

  **Two-Minute Reply:**
  "The dominance test is designed to *end* the memory wars, not win them. If Case A does not dominate Case B, the model forbids me from saying A is worse. It protects the Holocaust from being 'outranked' by duration, and it protects colonial atrocities from being dismissed because they lacked industrial technology. It forces us to acknowledge that different modalities of violence impose different constraints. If the result is that they are incomparable, then the memory politics must shift from competition to coexistence. The math forces the humility."

  **Weakness of Reply:**
  It assumes the audience wants humility. Some factions are invested in hierarchy (either to protect uniqueness or to demand parity). It may satisfy no one.

  ---

  ## III. The "Hope Nobody Asks" Objection

  **The Objection:**
  **Voice:** (Any faction, but likely an Ethicist) "You claim these dimensions are 'independently justified.' Justified by what? Who chose 'collective self-determination' over 'individual bodily integrity'? If your dominance test rests on a specific liberal-political conception of the good life, isn't your 'objective' test just a disguised normative argument? If I reject your list, your whole partial ordering collapses."

  **Why you hope they don't ask:**
  Because you cannot answer this in two minutes without rewriting the paper. If the dimensions are arbitrary, the dominance test is a game played with rigged tokens.

  **If Asked (Emergency Reply):**
  "They are justified negatively, not positively. They are not a list of what makes life *good*, but what makes collective life *possible*. Without duration, there is no continuity. Without scope, there is no community. Without self-determination, there is no politics. I am not prescribing a conception of the good; I am identifying the conditions under which any conception of the good can be pursued. If you reject these, you aren't rejecting my list; you are rejecting the possibility of political recovery itself."

  **Weakness:**
  This is a transcendental argument that can be easily attacked as question-begging. It assumes "political recovery" is the ultimate goal, which a radical critic might deny.

  ---

  ## IV. Strategic Summary

  1.  **Don't fight for the Ranking:** If they push for a ranking, reiterate that ranking is the *source* of the ethical problem, not the solution.
  2.  **Lean on the Political Theorist:** If you can convince the Reparations Advisor that indeterminacy protects *their* budget from moral litigation, you win the room.
  3.  **Watch the Historians:** If they feel you are abstracting away the blood, pivot to "structure" vs. "experience." You are measuring the cage, not the pain of the prisoner.
  4.  **The Kill Shot:** If you get stuck, return to the core claim: **"False precision is a form of violence. Indeterminacy is respect."**
