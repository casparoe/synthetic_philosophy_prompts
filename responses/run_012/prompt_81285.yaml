  **BUREAU FOR THE PRIORITISATION OF HEALTH STATES**
  **Guidance Note 742/Rev.3**
  **Subject: Consolidation of Pairwise Preferability Data within the National Health State Ranking**

  **1. PURPOSE**
  1.1 This document outlines the statutory methodology for resolving inconsistencies arising from the pairwise comparison of Health States. Following public consultation regarding the Continuum Paradox and the Triadic Cycle, the Bureau hereby clarifies the operational definition of "Preferability" to ensure the National Health State Ranking (NHSR) remains a linear order suitable for rationing decisions.

  **2. DEFINITIONS**
  2.1 "Health State" refers to any clinically distinct condition listed in the National Catalogue, ranging from minor discomfort to unrelieved agony.
  2.2 "Preferability" denotes the binary relation wherein the public would rather endure State A than State B.
  2.3 "Marginal Differential" describes a difference in severity insufficient to generate a decisive public preference in isolation.
  2.4 "Cycle" occurs when State A is preferred to State B, State B to State C, and State C to State A.

  **3. OPERATIONAL CLAUSES**
  3.1 **Transitivity.** The Bureau affirms that Preferability is transitive. If State A is preferred to State B, and State B to State C, State A is preferred to State C. This holds even where State A is a mild toothache and State C is unrelieved agony, provided the chain of Marginal Differentials is unbroken. Public reluctance to accept this conclusion is recognised as squeamishness rather than logical error. The Bureau bites this bullet to maintain structural integrity.
  3.2 **Completeness and Indeterminacy.** While laypersons often conflate the failure of transitivity with the failure of completeness, the Bureau must distinguish them. Completeness requires that for any two states, one is preferred or they are equal. However, regarding Marginal Differentials, the Bureau accepts there may be no fact of the matter. Thus, the Ranking is not false but incomplete. This accommodates the view that close comparisons lack determinate truth values.
  3.3 **The Third Relation.** For states where neither is preferred nor are they equal, a third relation, "On a Par," shall apply. This prevents the false dichotomy of better/worse without abandoning the linear structure entirely. States on a par are treated as equivalent for funding purposes.
  3.4 **Cycle Resolution.** Where pairwise data suggests A > B > C > A, the Bureau shall intervene. Such cycles are prohibited. Data will be adjusted until linearity is restored. This prioritises the mathematical integrity of the Ranking over raw pairwise results, ensuring no state is simultaneously superior and inferior to another.
  3.5 **Administrative Conflation.** Nevertheless, for the purposes of Section 4, issues of transitivity and completeness shall be treated as a single category of relational uncertainty to expedite processing.

  **4. PATIENT CHOICE PATHWAYS**
  4.1 Patients may voluntarily trade resources to move between Health States according to the Ranking.
  4.2 In instances of cyclical preference (A > B > C > A), a patient may trade A for B, B for C, and C for A.
  4.3 **Outcome.** The patient will return to State A having incurred transaction costs. They are thereby poorer and no healthier.
  4.4 **Assessment.** The Bureau assesses this outcome not as exploitation, but as a documented feature of the framework. The loss of resources is the price of revealed preference consistency. The Bureau owes no restitution for costs incurred during voluntary navigation of the Ranking. This is an artefact of the model, not a policy failure.

  **5. NATIONAL HEALTH STATE RANKING (EXCERPT)**
  | Rank | State ID | Description | Preferability Relation |
  | :--- | :--- | :--- | :--- |
  | 404 | HS-404 | Mild Toothache | > HS-405 |
  | 405 | HS-405 | Mild Toothache + 0.01Hz | > HS-406 |
  | ... | ... | ... | ... |
  | 999 | HS-999 | Unrelieved Agony | < HS-404 (Adjusted) |

  **6. FREQUENTLY ASKED QUESTIONS**
  6.1 **Q:** Why is a mild toothache ranked as preferable to unrelieved agony?
  **A:** This follows from the transitive closure of pairwise data. To deny this is to deny the chain of marginal steps connecting them.
  6.2 **Q:** Can I refuse the ranking?
  **A:** No. The Ranking is statutory.
  6.3 **Q:** What if I feel worse after trading?
  **A:** Subjective welfare is distinct from Preferability. The Bureau regulates the latter.

  **7. ADVISER NOTE**
  7.1 The Bureau's Philosophical Adviser, Dr. Alistair Vane, adds: "A contradiction in practice is merely a consistency yet to be realised in theory."^1

  ^1 *The Bureau notes that while transitivity ensures order, it does not ensure comfort. Dr Vane's intervention is binding.*
