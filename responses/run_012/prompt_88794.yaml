  ```text
  The first clinic counted cures;           The second counted costs.
  Where rain fell soft on roofs;            Where wind tore tiles loose.
  They said the medicine worked;            They said the medicine failed.
  And patients walked out whole;            And patients stayed inside.
  The mild cases rose again;                The severe cases fell.
  Green shoots broke the snow;              Brown leaves rotted down.
  No shadow touched their skin;             No sun reached through the shade.
  The count was clean and brief;            The sum refused to stay.
  But who sorted sick from well?            We drew the line between.
  The groups were distinct then;            The groups were distinct then.
  They lived in separate wards;             They died in separate wards.
  One book held all the names;              One book held all the names.
  The sum is not the truth;                 The sum is not the lie.
  It is the shape of proof;                 It is the shape of grief.
  ```

  Summary: The poem leaves neither verdict standing, using the double-column form to enact Simpson's paradox by forcing the horizontal reading to reveal that the grouping itself, not the treatment, determined the outcome.
