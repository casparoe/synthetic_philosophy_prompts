answer: |-
  # Q&A Prep Sheet: Local Quantifier Variance & Metaontology

  **Talk Context:** 45-min slot, metaontology reading group.
  **Your Stance:** Local quantifier variance (composition, persistence, constitution). Semantic plasticity, not indeterminacy. Meta-linguistic hypothesis, not first-order ontology.
  **Goal:** Survive the crossfire without conceding the core thesis or appearing to advocate "anything goes" relativism.

  ---

  ### Pre-Commitments: What to Concede vs. Hold

  **Concede Up Front (The "Steel-Man" Buffer):**
  1.  **Not All Disputes are Verbal:** Explicitly state that fundamental physics, mathematics, and ethics are *not* your target. This disarms the Realist's "slippery slope" fear.
  2.  **Existence is Not *Totally* Plastic:** Concede that there are constraints on admissible schemes (e.g., logical consistency, causal contact). You are not a radical constructivist.
  3.  **Carnapian Heritage:** Acknowledge the debt to Carnap's "Internal/External" distinction but clarify you are updating it with modern semantics (plasticity vs. indeterminacy).

  **Hold Firm (The Core Thesis):**
  1.  **No Privileged 'Exists':** There is no single, joint-carving quantifier for medium-sized dry goods.
  2.  **Meta-Ontology is Semantic:** Your claims are about how we *use* language to carve the world, not about the world's intrinsic structure independent of language.
  3.  **Pragmatic Adjudication:** Scheme choice is normative/practical, not purely descriptive, but it is not arbitrary.

  ---

  ### The Objections (Ordered by Damage Potential)

  #### 1. The Sider-Style Realist: "The Privileged Meta-Language"
  **Who:** The Meta-ontological Realist.
  **The Objection:** "You claim quantifier variance is true. But to state that claim, you must use a meta-language with its own quantifiers. Are *those* quantifiers variant? If yes, your thesis is only true relative to a scheme (and thus not generally binding). If no, you have admitted there is a privileged, non-variant quantifier after all. You can't have it both ways: either your view is self-undermining or it surrenders to realism."
  **Damage:** **KILLER.** Attacks the coherence of the position itself.
  **2-Min Reply:** "The meta-language is pragmatic, not fundamental. I'm not claiming my meta-language 'carves nature at the joints' in Sider's sense. I'm claiming it is the *useful* tool for describing the sociological and semantic facts about how ontologists speak. It's like using a Mercator projection to discuss mapmaking: the projection has distortions, but it's the standard tool for the job. I'm not positing a 'God's eye' quantifier; I'm positing a *linguistic* quantifier that tracks usage."
  **Soft Spot:** Hard to explain why *your* meta-language gets to adjudicate others without implicitly claiming it tracks reality better.
  **Note:** This is the real killer. The Semanticist objection is technical; this one is existential.

  #### 2. The Semanticist: "The Translation Problem"
  **Who:** Philosopher of Language (Quantifier Semantics).
  **The Objection:** "If 'exists' varies in meaning across schemes, translation between them should be indeterminate. Yet you claim we can translate the Nihilist to the Universalist. To do so, you need a neutral interlingua. If that interlingua exists, 'exists' is univocal there. If it doesn't, your claim that they are 'saying the same thing' is unintelligible. You're relying on a synonymy you explicitly deny."
  **Damage:** **HIGH.** Threatens the technical mechanism of your view.
  **2-Min Reply:** "Translation doesn't require synonymy; it requires *paraphrase*. I'm not saying 'exists_A' = 'exists_B'. I'm saying 'There is a table (A)' can be paraphrased in Scheme B as 'There are simples arranged table-wise (B)'. The logical form changes, but the informational content regarding the arrangement of matter is preserved. We aren't translating the word 'exists'; we are translating the *commitments*."
  **Soft Spot:** Paraphrase often presupposes the ontology of the target scheme (e.g., 'simples' might not exist in Scheme A).

  #### 3. The Carnap Historian: "The Relativism Trap"
  **Who:** Historian of Analytic Philosophy.
  **The Objection:** "This smells like a warmed-over version of Carnap's Internal/External distinction. But Carnap thought external questions were *cognitive nonsense*. You seem to think they are meaningful but 'pragmatic.' By making ontology a matter of 'scheme choice,' aren't you sliding into a bland relativism where the Fascist Ontologist and the Liberal Ontologist are just 'choosing differently'? Where is the normative bite?"
  **Damage:** **MODERATE-HIGH.** Frames you as a soft relativist.
  **2-Min Reply:** "I'm rejecting Carnap's verificationist motivation but keeping the pragmatic conclusion. It's not relativism because schemes aren't equal. We assess them by explanatory power, coherence with science, and ethical utility. A scheme that denies the existence of persons has high logical cost and high ethical cost. It's not 'anything goes'; it's 'many things go, but some are much better than others.'"
  **Soft Spot:** Risk of getting bogged down in Carnap exegesis. Keep it on the *structure* of the argument, not the history.

  #### 4. The Thomasson Fans: "Not Deflationary Enough"
  **Who:** The Three Grad Students.
  **The Objection:** "Why posit 'variance' at all? Thomasson shows that ontological questions are trivial once we fix the application conditions of terms. You're still reifying 'schemes' as if they are deep metaphysical commitments. Just look at the concepts! If 'statue' applies, the statue exists. You're making ontology look harder than it is by positing this semantic plasticity layer."
  **Damage:** **MODERATE.** Makes you look unnecessarily complicated.
  **2-Min Reply:** "Thomasson assumes conceptual stability. My point is that the *concepts themselves* are the locus of disagreement. When a Nihilist says 'statue,' they are employing a concept with stricter application conditions than the Common-Sense Ontologist. I'm explaining *why* the concepts differ. Thomasson solves the internal question; I'm explaining the friction between frameworks."
  **Soft Spot:** You might actually agree more than you think. Don't fight them too hard or you lose the "deflationist" label.

  #### 5. The Older Metaphysician: "The Bad Faith Charge"
  **Who:** Older Metaphysician.
  **The Objection:** "I've been in these debates for 40 years. These people know what they mean. They aren't confused about semantics. They disagree about the *world*. To tell them they are just 'using different schemes' is patronizing. It dismisses substantive disagreement as verbal confusion. That's bad faith."
  **Damage:** **MODERATE.** Attacks your charity/interpretive principle.
  **2-Min Reply:** "I'm not accusing them of confusion. I'm accusing language of plasticity. Two people can be perfectly rational, know exactly what they mean, and still be using 'object' with different truth-conditions because their linguistic communities diverged. It's not psychological confusion; it's semantic drift. I'm taking their assertions literally, which leads me to conclude they aren't contradictory."
  **Soft Spot:** Hard to convince someone who feels the "weight" of the disagreement that it's linguistic.

  #### 6. The Semanticist #2: "The Logical Constants"
  **Who:** Philosopher of Language (Logic focus).
  **The Objection:** "Quantifiers are defined by their inference rules (Existential Introduction/Elimination). If two parties agree on the rules, they mean the same thing. If they disagree on the rules, they aren't doing logic. You can't vary the quantifier without breaking logic itself. So variance is impossible."
  **Damage:** **LOW-MODERATE.** Technical, but standard reply exists.
  **2-Min Reply:** "I distinguish the *logical* quantifier (defined by rules) from the *ontological* quantifier (restricted domain). Variance happens in the domain restriction, not the inference rules. Both sides agree 'If a exists, then something exists.' They disagree on whether 'a' (the table) is in the domain."
  **Soft Spot:** Sider argues the "joint-carving" quantifier is the one that satisfies the rules *and* matches reality. You need to keep stressing the domain restriction.

  #### 7. The Grad Student: "Scope of Variance"
  **Who:** Thomasson Fan / Generalist.
  **The Objection:** "If variance works for statues, why not numbers? Why not electrons? If you stop at 'local' variance, isn't that arbitrary? What's the principled line between 'variance allowed' and 'realism required'?"
  **Damage:** **LOW.** Easy to fence off.
  **2-Min Reply:** "The line is causal/practical friction. For statues, the 'cost' of adding an object is low. For electrons, the 'cost' involves changing our best physical theories. I'm a local deflationist because global deflationism ignores the success of science. I'm happy to be a realist about quarks and a variance-ist about chairs."
  **Soft Spot:** Defining "causal friction" precisely is hard, but for a 2-min reply, the intuition pump works.

  #### 8. The Realist (Follow-up): "The Discovery Intuition"
  **Who:** Meta-ontological Realist.
  **The Objection:** "Ontology *feels* like discovery, not stipulation. When we argue about persistence, we feel we are tracking something. If it were just scheme choice, why does it feel like we are finding truth?"
  **Damage:** **LOW.** Phenomenological, not logical.
  **2-Min Reply:** "Because the schemes are constrained by the world! You can't just stipulate a scheme where statues survive melting; the clay's behavior constrains the scheme's utility. The 'discovery' is finding which scheme best maps the causal structure we care about."
  **Soft Spot:** Might sound like you're conceding realism about the "causal structure."

  ---

  ### The One Question You Hope Nobody Asks

  **"If your meta-language is just another scheme, why should we accept your conclusion that 'variance is real' as anything more than a move within your own preferred scheme?"**

  *   **Why it's deadly:** It combines the Realist's "Privilege" objection with the Thomasson "Triviality" objection. If you say "It's true in my scheme," you lose authority. If you say "It's True simpliciter," you contradict your thesis.
  *   **Emergency Exit:** "Because this scheme maximizes predictive accuracy regarding linguistic behavior and minimizes metaphysical confusion. It's the scheme that best explains why we keep having this argument." (Pragmatic self-vindication).

  ---

  ### Strategic Notes for the Room

  1.  **On the Semanticist's Translation Objection:**
      *   *Verdict:* **Not the Killer.** It's a technical hurdle, not a fatal flaw. You can bite the bullet on "perfect translation is impossible" and argue for "charitable paraphrase."
      *   *Tactic:* Use the "Map" analogy. Two maps can use different projections (Mercator vs. Peters). You can translate coordinates, but the *shape* changes. That doesn't mean there's no territory.

  2.  **On the Realist's Meta-Language Objection:**
      *   *Verdict:* **THE KILLER.** This is where you will lose the room if you slip.
      *   *Tactic:* Do not claim your meta-language is "fundamental." Claim it is "methodologically necessary." You are doing *linguistic anthropology* of metaphysicians, not metaphysics itself. If they press, concede: "Yes, this view is asserted within a naturalistic, semantic framework. I invite you to show me a better framework for explaining the data of ontological disagreement."

  3.  **On the Carnap Historian:**
      *   *Tactic:* Do not get dragged into 1950s exegesis. Say: "Carnap was right about the pragmatic nature of framework choice, wrong about the cognitive meaninglessness of external questions. I'm keeping the pragmatism, dropping the positivism."

  4.  **General Tone:**
      *   Since you are a rationalist-reader, lean into **Bayesian updating**. Frame scheme choice as "Which prior over objects yields the best posterior predictions for our practical goals?" This resonates with the LW/SSC crowd in the room (if any) and sounds rigorous to the philosophers.
      *   Avoid "Merely Verbal." Use "Semantic Plasticity." It sounds like a feature, not a bug.

  **Good luck. Don't let them force you into a corner where you have to assert the existence of 'schemes' as abstract objects. Keep them linguistic.**
