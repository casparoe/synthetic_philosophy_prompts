answer: |-
  Here is the specification for a theory of moral testimony.

  ### 1. The Cases (Input Data)
  A viable theory must generate plausible verdicts on these five scenarios.

  *   **The Autonomy Intuition (The Pessimist's Anchor):**
      *   *Case:* You ask a friend if lying is wrong. They say "Yes." You believe them and don't lie.
      *   *Requirement:* The theory must explain why this action feels morally "thinner" or less praiseworthy than if you had grasped the reason yourself.
      *   *Status:* **Real Requirement.** It tracks a robust phenomenological intuition about moral agency.

  *   **The Competence Gap (The Optimist's Anchor):**
      *   *Case:* You know you are emotionally compromised or cognitively weak regarding a specific issue (e.g., donating a kidney). You defer to a friend known for moral wisdom.
      *   *Requirement:* The theory must allow that deferring here is rationally permissible, and perhaps obligatory, rather than a moral failure.
      *   *Status:* **Real Requirement.** Denying this leads to implausible moral rigorism.

  *   **General vs. Particular:**
      *   *Case:* Accepting "Torture is wrong" (general) via testimony vs. "You should not torture this prisoner now" (particular) via testimony.
      *   *Requirement:* The theory must account for the intuition that deference is more acceptable for abstract principles than for concrete, context-sensitive applications.
      *   *Status:* **Real Requirement.** Collapsing these ignores the role of situational perception in moral judgment.

  *   **The Non-Human Adviser:**
      *   *Case:* An AI or a committee outputs a moral directive based on data you cannot process.
      *   *Requirement:* The theory must determine if the problem with moral testimony is about *human* trust (relationships) or *reason* transmission (epistemology). If it's the latter, the AI case should mirror the human case.
      *   *Status:* **Real Requirement.** Necessary to isolate the variable of interpersonal trust.

  *   **The Monster Testifier:**
      *   *Case:* A vicious person (e.g., a corrupt warlord) gives you correct moral advice ("Do not kill the innocent") for instrumental reasons. You defer.
      *   *Requirement:* The theory must decide if the testifier's vice contaminates your epistemic entitlement or your moral worth.
      *   *Status:* **Real Requirement.** Tests whether the theory relies on *source virtue* or *content reliability*.

  ### 2. The Distinctions (Structural Integrity)
  A theory collapses if it conflates these pairs.

  *   **Testimony vs. Advice:**
      *   *Distinction:* Testimony asserts *truth* ("X is wrong"); Advice suggests *action* ("Don't do X").
      *   *Constraint:* Do not treat moral testimony as merely pragmatic guidance. It makes a truth claim.
  *   **Belief vs. Action:**
      *   *Distinction:* Epistemic entitlement (can I believe it?) vs. Practical permission (can I act on it?).
      *   *Constraint:* A theory can argue you can *know* via testimony but shouldn't *act* solely on it (or vice versa). Conflating them creates category errors.
  *   **Knowledge vs. Understanding:**
      *   *Distinction:* Knowing *that* P is true vs. Grasping *why* P is true.
      *   *Constraint:* This is the critical fault line. Pessimists argue testimony transmits knowledge but not understanding. Optimists argue understanding isn't required for right action. A theory must pick a lane.
  *   **Trust in Character vs. Trust in Reasoning:**
      *   *Distinction:* Believing someone because they are good vs. believing someone because they are competent.
      *   *Constraint:* Moral testimony uniquely blends these. A theory must specify which is doing the epistemic work.

  ### 3. Real Requirements vs. Camp Prejudice
  Not all intuitions are binding constraints. Some are metaphysical commitments disguised as data.

  *   **Real Requirements:**
      *   **Consistency with General Epistemology:** You cannot posit special rules for moral testimony without explaining why morality breaks general rules of evidence and trust.
      *   **Moral Worth Sensitivity:** The theory must explain the variance in moral praise/blame when acting on testimony vs. independent judgment.
      *   **Action-Guidance:** The theory cannot render moral deliberation impossible for non-experts.

  *   **Camp Prejudice (Ignore These):**
      *   **"Moral Truth is Objective/Subjective":** A theory of testimony should ideally work regardless of your meta-ethics (though it's harder for error theorists). Don't bake meta-ethics into the testimony spec.
      *   **"Autonomy is Absolute":** The idea that *any* deference is a violation of dignity is a Kantian fetish, not a data point.
      *   **"Expertise is Impossible":** The claim that there are no moral experts is a metaphysical stance, not a constraint on testimony mechanisms.

  ### 4. The Asymmetry Question
  **Is there an asymmetry between moral and non-moral testimony?**

  *   **Verdict:** **Epistemically No, Practically Yes.**
  *   **Explanation:** There is no evidence that the *mechanisms* of justification differ (evidence, trust, reliability work the same way). However, the *value* of the output differs. In math, getting the right answer is the goal. In morality, getting the right answer *for the right reasons* is partly constitutive of the goal.
  *   **Spec Requirement:** A theory must respect **Epistemic Parity** (moral testimony follows general rules of evidence) while accounting for **Practical Distinctness** (the stakes of understanding are higher in morality). If a theory claims a magical epistemic asymmetry (e.g., "moral truths can't be transmitted"), it fails the consistency requirement.

  ### 5. The Incompatible Requirements (The Tension)
  You cannot maximize both of these simultaneously without qualification.

  1.  **Epistemic Parity:** Moral testimony functions exactly like historical or scientific testimony (if the source is reliable, you are justified).
  2.  **The Moral Worth Constraint:** Acting solely on moral testimony yields less moral credit (or is distinctively flawed) compared to acting on independent judgment.

  *   **The Conflict:** If you satisfy **Parity**, you struggle to explain why moral deference feels problematic (violating **Worth**). If you satisfy **Worth** (by claiming deference is epistemically or morally deficient), you violate **Parity** (because we don't treat scientific deference as deficient).
  *   **Resolution:** Most successful theories sacrifice strict Parity to save Worth, arguing that while *belief* is justified (Parity), *action* requires understanding (Worth).

  ### 6. The View-Killer
  **The Single Requirement That Rules Out The Most Popular Views:**

  **The Understanding Constraint:** *A moral agent must grasp the reasons for a moral truth to act virtuously, and testimony alone cannot transmit this understanding.*

  *   **Why it kills views:**
      *   It kills **Simple Optimism** (which claims testimony transmits full moral standing).
      *   It kills **Radical Pessimism** (which claims testimony transmits *nothing*).
      *   It forces **Hybrid Views** (which are complex and often unstable).
  *   **Reasoning:** This requirement demands a theory explain *how* reasons are grasped. If testimony transmits propositions but not reasons, Optimism fails. If testimony transmits reasons, Pessimism fails. Most theories crumble because they cannot explain the mechanism of "reason transmission" without collapsing into either mysticism or reductionism.

  ### 7. Note on The Monster Case
  For the "Monster Testifier" case: The spec requires the theory to decouple **Source Virtue** from **Content Reliability**.
  *   If your theory says you *cannot* learn from a monster, you are committed to a form of virtue epistemology that risks truth-tracking failure.
  *   If your theory says you *can* learn from a monster with no loss of moral worth, you ignore the role of community and shared value in moral learning.
  *   **Requirement:** The theory must explain whether the *source's* vice degrades the *receiver's* moral credit, even if the content is true. (Standard consensus: It degrades credit, not knowledge).
