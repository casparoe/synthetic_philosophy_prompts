prompt: |-
  before I read any more on moral testimony I want the spec first. what does a theory of moral testimony actually have to get right? give me the desiderata list — the cases it has to handle, the distinctions it can't collapse, the results it has to be consistent with — with the case or consideration behind each one, and tell me which of these are real requirements and which are just one camp's prejudice.

  the cases: the old intuition that you shouldn't let someone else tell you what's right; the person who knows they're bad at moral reasoning and outsources to a friend who's better at it; testimony about a general moral truth vs. testimony about what to do here and now; and the group / AI adviser case (does anything change if the testifier isn't a person?). also a case I keep circling and haven't seen handled well: the testimony is correct but the testifier is a monster — does that change wether you should defer?

  the distinctions it can't flatten: testimony vs. advice, believing the testimony vs. just acting on it, moral knowledge vs. moral understanding, trusting someone's character vs. trusting their reasoning.

  then the big one: is there actually an asymmetry between moral and non-moral testimony that a theory has to respect, or is that just a myth people keep repeating? flag any two requirements you think can't both be met, and tell me which single requirement rules out the most popular views. skip the scorecard, I'll do that myself.
