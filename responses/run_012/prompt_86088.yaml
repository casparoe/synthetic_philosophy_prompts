answer: |-
  Friends, colleagues, neighbors.

  Thank you for the trust you have placed in me over these past years. Thank you for the hours you have spent knocking on doors, counting ballots, drafting policy, and sitting in cold halls waiting for meetings to begin. I know the cost of this work. I know it has cost you time with your children, sleep during elections, and patience with neighbors who do not understand. I see that cost. I honor it.

  I stand before you today to resign my leadership. Usually, this is the moment where a leader passes the torch. I am not passing a torch. I am asking you to consider extinguishing the flame.

  I am not leaving because I disagree with our platform. I am not leaving because I believe another group can do what we do better. I am leaving because I have come to believe that the thing we are building cannot do what we hope it will do. I have come to believe that the political party itself, regardless of its banner, is an obstacle to the justice we seek.

  We gather here assuming that to do good, we must be strong. We assume that strength comes from numbers, and numbers come from unanimity. So we polish our message. We smooth over our doubts. When a fact arises that complicates our narrative, we set it aside, not because it is false, but because it is inconvenient. When a colleague raises a concern that might fracture our coalition, we ask them to wait, to be pragmatic, to prioritize the victory.

  We tell ourselves this is necessary. We say that without this discipline, the other side will win. But in doing so, we have subtly shifted our goal. The highest good is no longer justice; it is survival. The highest virtue is no longer truth; it is loyalty. We have built a machine that requires us to feed it our consciences to keep it running. We ask you to love the organization more than you love the reality standing right in front of you.

  I know what this sounds like. I know that to say this here is to bite the hand that has fed me. I am standing at this podium, funded by your dues, surrounded by your banners, using the microphone of this organization to tell you that this organization should not exist. This is a contradiction. I cannot resolve it fully. I can only acknowledge it. I am using the tools of the party to explain why the tools are broken. I ask you to listen not to my authority, which derives from this party, but to the argument itself, which stands apart from me.

  I anticipate the question that is already forming in your minds. If we dissolve this, if we abandon this structure, how will anything get done? Who will organize the workers? Who will protect the vulnerable? Who will stand against corruption?

  These are serious questions. They deserve serious answers. The answer is not a new party. It is not a super-party. It is not a movement that behaves like a party but claims not to be one.

  The answer is organization without permanence. We must learn to come together around specific truths, not around permanent identities. When a mine pollutes a river, neighbors gather to stop it. When a law crushes the poor, citizens unite to change it. Once the truth is served, the group disperses. This is harder than what we do here. It requires us to start over constantly. It denies us the comfort of a permanent label. It denies us the thrill of permanent victory. But it allows us to look at each problem freshly, without the filter of a manifesto. It allows us to listen to the person who disagrees with us on one thing but stands with us on another, without demanding they join us on everything.

  We have confused the map for the territory. We think protecting the party is protecting the people. It is not. When the party becomes sacred, the people become fuel.

  I know this feels like betrayal. To some of you, this organization is your community. It is your family. I do not ask you to abandon your neighbors. I ask you to love them enough to release them from the requirement of agreement. I ask you to value your own attention more than your affiliation.

  I cannot ask you to vote to abolish this party today. That would be just another party maneuver. I cannot ask you to follow me into a new organization, for that would be to start the cycle again. I can only ask you to think, privately and quietly, about what you are doing here.

  But I do not want to leave you with only theory. I want to offer something concrete.

  Tomorrow morning, when you wake up in your hotels, I ask you to do one thing. Do not attend the closing plenary. Do not strategize for the next election. Do not call a reporter. Instead, go find someone who does not belong to this party. It could be a waiter serving your breakfast. It could be a neighbor in your hometown. It could be a relative who votes differently.

  Sit with them. Do not try to persuade them. Do not try to recruit them. Do not defend our record. Ask them what they are afraid of. Ask them what they love. Listen to them until you understand their answer better than they do. And when they speak, do not filter their words through our platform. If they speak a truth that contradicts our policy, let it stand. Let it disturb you.

  If you do this, you will not be acting as delegates. You will be acting as human beings. You will be breaking the circuit of collective passion. You will be practicing attention.

  I am resigning because I can no longer lead you toward victory. I want to walk with you toward truth. And truth does not have a whip. It does not have a membership card. It does not have a headquarters.

  I thank you for your service. I thank you for your hope. I hope that one day, you will not need to give that hope to an institution. Keep it for yourselves. Keep it for your neighbors.

  Thank you.
