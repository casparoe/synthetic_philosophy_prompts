answer: |-
  Everyday conventions generate genuine moral obligations for visitors whenever non-compliance exploits local reliance or shifts unfair costs, rendering the Guest License untenable.

  Your friend's Guest License treats social norms as arbitrary games where outsiders hold wildcards. This ignores that conventions function as invisible infrastructure. When locals organize their lives around a norm, violating it isn't just a breach of etiquette; it can be a breach of trust that inflicts tangible harm. Your Imposition Test captures this, though it requires careful calibration regarding what counts as a "cost." Conventions become moral obligations when they underpin reliance interests that, if violated, cause harm. The visitor's outsider status rarely exempts them from this, because harm remains harm regardless of the actor's origin.

  Consider the tipping case. This generates a genuine moral obligation. In tipping cultures, wages are structurally suppressed based on the expectation of gratuities. The server relies on this income to survive the shift. Withholding a tip to protest the system punishes the worker, not the employer. The visitor's outsider status does not exempt them from the immediate economic harm they inflict by free-riding on local labor structures. Here, the convention is moralized by necessity. Failing to tip is a moral failing because it shifts a survival cost onto someone who reasonably relied on the social contract of the restaurant.

  The jaywalking case creates merely conventional obligations with moral underpinnings regarding safety. If the local equilibrium involves jaywalking, stopping at a red light with no traffic disrupts the flow and creates confusion or danger. The moral duty is to coordinate safely, not to obey the statute. The visitor is correct to jaywalk here. The Guest License fails if it demands adhering to home laws over local safety equilibria. The obligation is to not be an obstacle, which is a low-bar moral duty fulfilled by following the local convention. Failing to observe the local practice is a moral failing only insofar as it creates risk; otherwise, it is mere rudeness.

  The queue-jumping case generates no moral obligation to comply. If "queue-jumping-by-proxy" is locally standard, it represents a corrupted convention that shifts costs onto those who value fairness. Refusing to participate does not shift a cost onto those who reasonably relied on the convention, because the convention itself is exploitative. The visitor's refusal is morally permissible, perhaps even praiseworthy. Outsider status is irrelevant; fairness is universal. Under your Imposition Test, complying would shift a cost onto others in the queue who are not jumping. Therefore, failing to observe this convention is not a moral failing; it is an act of integrity.

  Finally, the dietary case generates no moral obligation for the guest. While hospitality conventions create expectations, they cannot override deep personal or religious prohibitions. The cost to the host (minor offense) is disproportionate to the cost to the guest (violating conscience). The Imposition Test protects the guest here because the "cost shifted" is trivial compared to the integrity maintained. Reasonable reliance does not extend to expecting guests to violate core prohibitions. Failing to eat is not a moral failing.

  The Guest License collapses because it assumes conventions are cost-free. They are not. Your Imposition Test holds, provided we recognize that some conventions (like fairness) trump others (like local corruption), and some costs (conscience) outweigh others (etiquette). Conventions are moral when they sustain reliance; visitors are bound by them not because they signed a contract, but because they walk on roads built by others. To claim otherwise is to claim a license to harm.
