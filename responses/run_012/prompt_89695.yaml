answer: |-
  This is a classic coordination problem in the philosophy of quantitative genetics. Your labmates are committing a category error (treating a variance ratio as a physical constant), and the policy person is committing an interventionist fallacy (inferring modifiability from variance partitioning).

  Below is a set of desiderata for an adequate account of heritability. These are framed as conditions of adequacy: if an account of $h^2$ violates these, it is philosophically or scientifically inadequate for the purposes of causal explanation and policy guidance.

  ### Desiderata for an Adequate Account of Heritability

  **1. Population-Environment Indexicality**
  *   **Requirement:** Any heritability claim must be indexed to a specific population, at a specific time, within a specific range of environmental variation. It cannot be a property of the trait *simpliciter*.
  *   **Rationale/Case:** Your labmate's discrepancy (.65 vs .15). If environmental variance ($V_E$) decreases (e.g., socioeconomic conditions become more uniform in the later cohort), $h^2$ ($V_G/V_P$) increases even if genetic variance ($V_G$) is unchanged. Conversely, if environmental range expands, $h^2$ drops.
  *   **Failure Mode:** Reification. Treating $h^2$ as a biological constant (like the speed of light) leads to the false conclusion that one cohort is "more genetic" than the other.

  **2. Interventional Independence (The PKU Constraint)**
  *   **Requirement:** The account must logically sever the link between the magnitude of $h^2$ and the modifiability of the phenotype via environmental intervention. High $h^2$ must be compatible with high plasticity.
  *   **Rationale/Case:** Phenylketonuria (PKU). It is highly heritable (monogenic), yet fully modifiable by diet (environment). Conversely, height is highly heritable and largely fixed in adulthood. $h^2$ tracks the *current source of variance*, not the *potential for mean shift*.
  *   **Failure Mode:** The "Fatalism Fallacy." The policy person's argument that $h^2=.65$ implies the trait is "fixed" violates this.

  **3. Causal Agnosticism regarding Specificity**
  *   **Requirement:** The account must acknowledge that $h^2$ quantifies the variance attributable to genetic *differences* without identifying specific causal loci or mechanisms. It is a measure of *difference-making*, not mechanism.
  *   **Rationale/Case:** Missing Heritability. We can have a robust $h^2$ estimate without knowing a single causal gene. An account that claims $h^2$ explains *how* the trait is produced fails.
  *   **Failure Mode:** The "Gene-for" Fallacy. Assuming a high $h^2$ implies we understand the biological pathway or that specific genes are "for" the trait.

  **4. Additivity Transparency (The G×E Constraint)**
  *   **Requirement:** The account must explicitly state whether the estimate assumes additive separation of $V_G$ and $V_E$ or accounts for Genotype-by-Environment interaction ($V_{G \times E}$).
  *   **Rationale/Case:** Reaction Norms. If Genotype A thrives in Environment 1 but fails in Environment 2, and Genotype B does the reverse, variance components are not separable. Standard ANOVA forces additivity, absorbing interaction into error or main effects.
  *   **Failure Mode:** Masking Interaction. A standard twin model assumes $V_G$ and $V_E$ are independent. If they interact, the $h^2$ estimate is biased, yet often reported as a clean partition.

  **5. Correlation/Causation Distinction (The rGE Constraint)**
  *   **Requirement:** The account must distinguish variance due to genetic *causation* from variance due to gene-environment correlation (passive, evocative, active).
  *   **Rationale/Case:** Assortative Mating & Passive rGE. Parents provide both genes and environment. In twin studies, if MZ twins share more similar environments than DZ twins (beyond genetics), $h^2$ is inflated. This variance is statistically "genetic" but causally confounded.
  *   **Failure Mode:** Inflation. The .65 estimate in your lab may reflect stronger assortative mating or stricter environmental matching in that cohort, not more genetic causation.

  **6. Measurement Invariance**
  *   **Requirement:** Comparisons of $h^2$ across groups or time require proof that the phenotype ($P$) is measured equivalently (same construct, same scale properties).
  *   **Rationale/Case:** Your Lab's Personality Measure. If the "personality" construct shifts meaning between decades (e.g., "neuroticism" manifests differently in 1990 vs. 2020 due to cultural changes), you are not measuring the same $P$.
  *   **Failure Mode:** Comparing Apples to Oranges. The .65 vs .15 difference might be an artifact of the instrument losing validity in the second cohort, not a change in etiology.

  ---

  ### Evaluation of Your Suspected List

  | Your Suspicion | Verdict | Justification |
  | :--- | :--- | :--- |
  | **Property of Pop/Env, not Trait** | **Keep** | This is Desideratum #1. It is non-negotiable. |
  | **Heritable $\neq$ Unmodifiable** | **Keep** | This is Desideratum #2. Essential for policy ethics. |
  | **Coefficient $\neq$ Reaction Norm** | **Keep** | Reaction norms describe individual genotypes across envs; $h^2$ describes population variance. Distinct logical types. |
  | **Environment is a Residual** | **Keep** | In standard models, $V_E$ is "everything not $V_G$." This obscures specific environmental causes. |
  | **rGE/Assortative Mating Inflate** | **Keep** | This is Desideratum #5. Critical for twin-study validity. |
  | **Twin vs. Pedigree vs. SNP Gaps** | **Keep** | They estimate different parameters ($V_A$ vs. $V_G$ vs. $V_{SNP}$). The gap is theoretical, not just noise. |
  | **Within-Group $\neq$ Between-Group** | **Keep** | Lewontin's Fallacy. High within-group $h^2$ is compatible with between-group differences being 100% environmental. |

  None of these are mere prejudices; they are established constraints in the literature (Lewontin, Block, Sesardic, Visscher). However, holding *all* of them simultaneously creates tension, as noted below.

  ---

  ### Incompatibilities and Tensions

  There is a pair of requirements that is **jointly unsatisfiable** under standard quantitative genetic models:

  **The Tension:** **Causal Specificity (Desideratum 3)** vs. **Additive Variance Decomposition (Desideratum 4).**

  *   **Why:** To get a clean $h^2$ (Additive Decomposition), you must model $V_G$ and $V_E$ as separable sums. However, biology tells us genes and environments interact causally (G×E). If G×E is real and pervasive, you cannot cleanly partition the variance without arbitrary statistical stipulations (e.g., assigning interaction variance to $V_G$, $V_E$, or error).
  *   **The Conflict:** If you demand the account tell you about *causes* (Specificity), you must admit the variance components are entangled. If you demand the account provide a clean *coefficient* (Decomposition), you must abstract away from the specific causal entanglement. You cannot have a clean number *and* a biologically realistic causal map simultaneously using standard ANOVA.

  **The Ecological Fallacy Tension:** **Population Variance (Desideratum 1)** vs. **Individual Modifiability (Desideratum 2).**

  *   **Why:** Policy makers want to know about the *individual* (Can I change *this* child's outcome?). Heritability is strictly about the *population* (What causes differences *between* children?).
  *   **The Conflict:** No amount of population-level variance data logically entails individual-level causal susceptibility. Satisfying the desire for individual policy guidance using $h^2$ violates the statistical definition of the coefficient.

  ---

  ### The "Killer" Requirement

  If you must wield one requirement to dismantle the popular accounts (Twin-study reification, Policy fatalism, Deflationary skepticism), it is **Interventional Independence (Desideratum #2)**.

  **Why it does the most work:**

  1.  **Against the Policy Person:** It immediately blocks the inference from $h^2=.65$ to "trait is fixed." It forces the admission that a trait can be 100% heritable and 100% modifiable (the PKU case). This neutralizes the political weaponization of the number.
  2.  **Against the Labmates:** It shifts the focus from "Which number is true?" to "What changed in the environment?" If $h^2$ doesn't determine modifiability, fighting over the coefficient is less stakes-heavy. It forces them to look at $V_E$.
  3.  **Against the Deflationary Account:** Philosophers who say "$h^2$ is just a descriptive statistic with no causal import" often use this to dismiss genetics entirely. Interventional Independence acknowledges causal import (it tracks genetic *differences*) but restricts its scope. It allows you to say "$h^2$ matters, but not for *that* reason."

  ### Application to Your Lab Dispute

  When you go back to the group, do not ask "Which number is right?" Ask:

  1.  **Regarding the .65 vs .15:** "Did the environmental variance ($V_E$) change between decades?" (Desideratum #1). If the later cohort had more uniform schooling or parenting, $V_E$ drops, and $h^2$ rises mathematically without a single gene changing frequency.
  2.  **Regarding the Policy:** "Are we discussing variance in this population, or the modifiability of an individual?" (Desideratum #2). Remind them that $h^2$ predicts the response to *selection* (breeding), not necessarily the response to *intervention* (policy), unless the intervention targets the specific environmental variance currently active.
  3.  **Regarding the Measure:** "Is the personality instrument measurement-invariant across the two decades?" (Desideratum #6). If the construct shifted, the $V_P$ changed, rendering the $h^2$ comparison void.

  **Summary:** The coefficient is not a fact about the trait's "geneticness." It is a fact about the **distribution of causal differences** in a **specific context**. Any account that treats it as a constant, or as a limit on plasticity, is failing the basic conditions of adequacy.
