answer: |-
  That analogy is the exact sleight of hand Rawls was exposing, and it conflates metaphysical unity with moral aggregation. When you undergo chemo, there is a single subject of experience who endures the pain and later enjoys the twenty years; the sacrifice is compensated *to the very same person* who made it. But society isn't a super-organism with a collective consciousness. When we sacrifice you for the greater good, there is no single entity that experiences the net gain—you only experience the loss, while others experience the gain. To say the 'collective' benefits is just a figure of speech masking the fact that some distinct individuals are being used as means for others' ends. The rationality of prudence within a life depends on identity over time; the rationality of sacrifice across lives depends on a summation that no one actually lives.
