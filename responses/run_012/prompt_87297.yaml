prompt: |-
  I'm giving a 50-minute session to a room of second-year maths students who have all seen Zorn's lemma deployed — they've watched someone prove that every ring with a unit has a maximal ideal, they've seen it in the proof that every vector space has a basis — and I'm fairly sure not one of them could tell you what the lemma actually says. So don't explain it to me; plan how I should explain it.

  What has to come first so that the hypothesis stops reading like a formality? I want the dependency order spelled out: which piece of vocabulary has to be nailed before which, and why the upper-bound condition has to be felt as the load-bearing thing rather than as boilerplate that's always true anyway.

  Which single example should carry the whole session? I keep leaning towards the spanning tree of a connected graph — acyclic edge sets ordered by inclusion, the union of a chain as the upper bound, a maximal acyclic set turning out to span — because it's visual and you can watch the union-of-a-chain move happen in front of you. But tell me if that's the wrong carrier, and why not the vector-space basis one, which is what everyone reaches for.

  Then the misconceptions, in the order they'll actually surface, and where in the sequence I should head each one off. I'm expecting: 'maximal means biggest' (with no idea that a poset can have lots of maximal elements and no maximum); the belief that the upper bound of a chain has to sit inside the chain; 'Zorn's lemma constructs the thing for you'; chain = countable; and the vague sense that Zorn's lemma and the axiom of choice are the same claim, so every application needs the full strength of AC. There's also the fiddly lemma that a union of a chain of chains is a chain — I think that's where the real work hides and I don't know whether to prove it, wave at it, or make them do it themselves.

  Two things I'm not sure belong at all, and I want you to rule on both: whether to make the engine Tukey's lemma (families of finite character) or the Hausdorff maximal principle rather than Zorn as usually stated, and whether to say anything about why textbooks bother saying 'non-empty' when the empty chain seems to be doing the work anyway. If those are a distraction at this level, say so and say what to leave out instead. And give me one question I can ask in the last five minutes that will show whether the hypothesis has landed, rather than whether they can recite the statement.

  Tell me how confident you are in the specifics, and single out the one point you're least sure of. My guess is it's whether the spanning-tree example really does expose the choice step or quietly hides it, but you tell me.

  British English throughout, please.
