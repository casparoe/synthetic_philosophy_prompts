      *   *Weakness:* Collapses back into EV calculation of risk.

  3.  **Collective Intentionality:** "You claim this isn't joint action, but 'structures' require participants. This is just Christopher Kutz's complicity without intent. Why deny the label?"
      *   *Reply:* My view requires no shared intention, only causal structure. It is weaker and more applicable.
      *   *Weakness:* Kutz already covers this; you're reinventing the wheel.

  4.  **Kantian:** "Universalizability. If everyone adopts 'I'll act unless I know I trip the threshold,' everyone acts, thresholds trip, harm occurs. Is your maxim universalizable?"
      *   *Reply:* The rule is 'do not participate in threshold structures,' not 'avoid tripping.'
      *   *Weakness:* Too broad; prohibits harmless participation.

  5.  **General (Moral Luck):** "Two agents buy identical chicken. One trips the threshold, one doesn't. You say one is wrong, one permissible. This makes morality depend on luck, not agency."
      *   *Reply:* Moral status attaches to the event's role, not just the will. Outcome matters.
      *   *Weakness:* Violates 'ought implies can' intuitions.

  6.  **General (Sorites):** "Thresholds aren't sharp. Factory farming harm is continuous. Where is the line? If vague, your 'role' is undefined."
      *   *Reply:* Use reasonable proxies (e.g., batch sizes). Pragmatic boundaries exist.
      *   *Weakness:* Arbitrariness undermines moral force.

  7.  **Virtue Ethicist:** "You focus on act-roles, not character. A person who buys meat hoping not to trip a threshold is still cruel or gluttonous. Why ignore the vice?"
      *   *Reply:* Structural harm requires structural analysis, not just virtue.
      *   *Weakness:* Ignores moral development and agent-centered concerns.

  8.  **General (Inert Support):** "You say acts below threshold are 'inert.' But they sustain the market demand signal. Why is supporting the structure permissible if you don't trip it?"
      *   *Reply:* Distinction between triggering harm vs. background noise.
      *   *Weakness:* Economically naive; demand is aggregate.

  **The Dreaded Question**
  "Have you read Alastair Norcross's 'Puppies, Pigs, and People' or Chris Kutz's 'Complicity'? Because this looks exactly like their threshold/complicity accounts."

