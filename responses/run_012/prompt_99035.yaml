  **Strategic Stance**
  *   **Concede:** You are not escaping consequentialist math entirely; probability matters. You are not denying that joint action theories offer insights.
  *   **Hold:** The *structure* of the harm is the primary moral object, not just the aggregate sum. The phenomenology of "tripping" matters for agent-guidance even if EV aligns.

  **The 8 Objections (Ordered by Damage)**

  1.  **Consequentialist (EA):** "Your 'role' is just probability-weighted harm. If there's a 1/1000 chance you trip the threshold, your expected value is 1/1000 of the harm. You haven't escaped marginalism; you've just obscured the math."
      *   *Reply:* EV ignores the categorical shift when a threshold breaks. My model captures the discontinuity EV smooths over.
      *   *Weakness:* If EV aligns normatively, your view adds no force.

  2.  **Consequentialist (EA):** "Epistemic Access. You cannot know if you are the threshold-tripper. Basing morality on unknowable facts makes action guidance impossible."
