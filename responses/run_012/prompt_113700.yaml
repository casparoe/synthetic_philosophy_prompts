  # Seminar Handout: Mapping the Concept of Disease
  **Topic:** Descriptive vs. Evaluative Notions of Health  
  **Task:** Follow the decision tree below. Answer based on your verdicts on the specific test cases. Your path leads to a philosophical position.

  ### The Decision Tree

  **Node 1 (Value Location):** Regarding a **rare but harmless anatomical variant**, is it a disease?  
  *   **Yes:** (Implies value is only a typical consequence). → *Go to Node 2.*  
  *   **No:** (Implies value judgement is built into the analysis). → *Go to Node 2.*  
  *(Note: Most theories answer 'No' here; 'Yes' leads to an outlier position).*

  **Node 2 (Function Type):** Is **adult lactose intolerance in a dairy-eating country** a disease?  
  *   **No:** (Function is statistical species-typicality). → *Naturalist Track (Node 3).*  
  *   **Yes:** (Function is environmental fit/goal achievement). → *Normative Track (Node 5).*

  **Node 3 (Species-Typicality):** Is **ordinary ageing that people want treated** a disease?  
  *   **Yes:** → **[EMPTY CELL: Interventionist Naturalism]**. *Nobody holds this: it contradicts the commitment to species-typicality in Node 2.*  
  *   **No:** → *Go to Node 4.*

  **Node 4 (Bearer of Health):** Regarding **short sight**, is the failure in the body's parts or the whole person's ability to get on with their life?  
  *   **Body's Parts:** → *Go to Leaf A/B.*  
  *   **Whole Person:** → **[EMPTY CELL: Part-Based Normativism]**. *Incoherent: if health is about parts, it shouldn't rely on person-level goals.*

  **Node 5 (Social Context):** Is **deafness** a disease if the bearer flourishes in a signing community?  
  *   **Yes:** (Social definition overrides individual flourishing). → *Go to Leaf C.*  
  *   **No:** (Individual flourishing overrides biological atypicality). → *Go to Leaf D.*

  **Node 6 (Functional Context):** Is a **metabolic quirk** a disease if it's only a problem on certain diets?  
  *   **Yes:** (Dysfunction is relational). → *Supports Pluralism/Contextualism.*  
  *   **No:** (Dysfunction is intrinsic). → *Supports Monism/Naturalism.*  
  *(Use this to check consistency before final node).*

  **Node 7 (Concept Purpose):** Whether the job is to analyse the ordinary concept or to engineer one that clinics and insurers can use?  
  *   **Analyse:** → *Retain previous Leaf (A, B, C, or D).*  
  *   **Engineer:** → *Go to Node 8.*

  **Node 8 (Concept Count):** Whether there's one concept or a plural cluster?  
  *   **One:** → **[EMPTY CELL: Engineered Monism]**. *Rare: pragmatic engineering usually invites plural tools.*  
  *   **Cluster:** → *Go to Leaf E.*

  ---

  ### The Leaves (Positions)

  *   **Leaf A: Plain Naturalism**  
      *(Path: No Variant → No Lactose → No Ageing → Parts → Analyse → One)*  
      Disease is a value-free failure of species-typical function.

  *   **Leaf B: Harmful-Dysfunction Hybrid**  
      *(Path: No Variant → No Lactose → No Ageing → Parts → Analyse → One)*  
      Disease requires both internal dysfunction *and* social harm.

  *   **Leaf C: Straight Normativism**  
      *(Path: No Variant → Yes Lactose → Yes Deafness → Analyse → One)*  
      Disease is essentially a value judgement or social construct.

  *   **Leaf D: Whole-Person/Vital-Goals View**  
      *(Path: No Variant → Yes Lactose → No Deafness → Analyse → One)*  
      Health is the ability to achieve vital life goals, not just organ function.

  *   **Leaf E: Pluralism**  
      *(Path: Any → Engineer → Cluster)*  
      Different concepts of disease are needed for different contexts (clinical, legal, ethical).

  ---

  ### ⚠️ Flagged Ambiguity

  **This tree cannot reliably separate Leaf A (Plain Naturalism) and Leaf B (Harmful-Dysfunction).**  
  *Reason:* Both positions typically give identical verdicts on the provided test items (e.g., both classify short sight as disease and harmless variants as non-disease). The distinction rests on a meta-philosophical technicality (whether 'harm' is a *condition* or a *consequence*) that case verdicts alone do not reveal.
