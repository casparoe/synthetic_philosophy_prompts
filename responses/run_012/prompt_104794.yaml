prompt: |-
  I chair a reading group that has now spent a year circling the levelling-down objection without moving, and I want a diagnosis rather than another round. The prioritarian insists that a world where everyone is equally badly off is not, merely for being equal, better than one where some do better and no one does worse; the egalitarian answers that this simply assumes what is at issue, namely that only individual levels matter. My hypothesis is that the two sides are not really disputing the value of equality but answering different questions — one about what makes an outcome good, the other about how a distributively minded agent ought to choose — and that once the question is fixed most of the impasse turns out to be verbal. Test that hypothesis. If it holds, say which claims on each side survive and which turn out to be about nothing. If it does not, tell me what the real disagreement is: whether comparisons between persons are themselves a source of value, whether a reason for action must be person-affecting to count at all, or whether a prioritarian weighting is just a concern for equality wearing different mathematical clothes. Then say what, if anything, would move this — a distinction, a formal result, a change of question — or why nothing should.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user chairs a reading group that has been stuck on the "levelling-down objection" (LDO) for a year.
      *   **Goal:** They want a *diagnosis* of the impasse, not another round of arguments.
      *   **User's Hypothesis:** The disagreement is verbal/methodological. Prioritarians ask "What makes an outcome good?" (outcome evaluation), while Egalitarians ask "How ought a distributively minded agent choose?" (decision procedure/moral reason). If the question is fixed, the impasse dissolves.
      *   **Task:** Test this hypothesis.
          *   If it holds: Identify which claims survive and which are "about nothing."
          *   If it fails: Identify the *real* disagreement (interpersonal comparisons as value, person-affecting reasons, or mathematical equivalence).
          *   Conclusion: Suggest what would move the debate (distinction, result, question change) or why nothing will.

  2.  **Deconstruct the Levelling-Down Objection (LDO):**
      *   *The Objection:* Telic Egalitarianism (equality is intrinsically good) implies that a world where everyone is equally miserable is *in some respect* better than a world where some are well-off and others are miserable (assuming no one gains in the transition to equality). This seems absurd.
      *   *Prioritarian Response:* We should weight benefits to the worse off more heavily, but we don't care about equality *per se*. Leveling down makes no one better off, so it has no value.
      *   *Egalitarian Response:* The LDO assumes "person-affecting" views or outcome utilitarianism. Equality is a relational value. The complaint is about the *relationship* between people, not just individual welfare sums.

  3.  **Evaluate the User's Hypothesis:**
      *   *Hypothesis:* Prioritarians = Outcome Evaluation (Goodness); Egalitarians = Agent Choice/Reasons.
      *   *Analysis:* This is a sophisticated take, often associated with the distinction between *Telic* (outcome-based) and *Deontic* (principle-based) egalitarianism, or the distinction between *Pattern* principles and *History* principles.
      *   *Critique:* Is it *just* verbal?
          *   Prioritarians (like Parfit) often frame their view as a theory of *value* (the Priority View), not just decision rules. They claim the outcome itself is better if benefits go to the worse off, independent of equality.
          *   Egalitarians (like Temkin or O'Neill) often claim equality is intrinsically valuable in the *outcome*, not just a rule for agents.
          *   Therefore, both sides often claim to be talking about *outcome goodness*. If both are talking about outcome goodness, the hypothesis weakens.
          *   However, the *force* of the LDO relies on the intuition that "better" must mean "better for someone." If Egalitarians shift to "better in terms of justice" rather than "better in terms of welfare," they might escape.
      *   *Verdict:* The hypothesis is partially correct but too charitable. It's not just a category error (question mismatch); it's a substantive clash about the *structure* of value (monistic vs. pluralistic, individual vs. relational). But the *impasse* is often fueled by talking past each other on these categories.

  4.  **Drafting the Diagnosis (Step-by-Step):**

      *   **Acknowledge the Stalemate:** Validate the user's frustration. The LDO is a philosophical black hole.
      *   **Test the Hypothesis:**
          *   *Does it hold?* Partially. There is a category confusion, but it's not the whole story.
          *   *The "Outcome vs. Choice" Distinction:* Prioritarians usually argue about the *Good* (Telic). Egalitarians often defend equality as a demand of *Justice* (Deontic) or a distinct value.
          *   *Where it fails:* Many Telic Egalitarians *do* claim equality makes the outcome intrinsically better. They bite the bullet: "Yes, leveling down is better in one respect (equality), worse in another (welfare)." The Prioritarian says "No, it's not better in any respect." This is a substantive clash about value, not just a question mismatch.
      *   **Identify the Real Disagreement (if hypothesis fails/partially fails):**
          *   It's about the *Site of Value*. Is value located solely in individual welfare (Prioritarianism/Utilitarianism) or in relations between individuals (Egalitarianism)?
          *   It's about the *Person-Affecting Restriction*. Does a change require someone to be better off to be "better"? Prioritarians say yes (mostly). Egalitarians say no (impersonal values exist).
          *   It's about *Mathematical Clothes*: Is Prioritarianism just a concave transformation of welfare that mimics equality without the metaphysical baggage? (Parfit's claim).
      *   **What Survives vs. What is "About Nothing":**
          *   *Survives:* The disagreement over whether relations have intrinsic value. The disagreement over whether "better" implies "better for."
          *   *About Nothing:* Arguing about whether leveling down is "all-things-considered" better (almost no one says it is). Arguing about labels ("egalitarian" vs "prioritarian").
      *   **How to Move It:**
          *   Shift from "Is equality good?" to "What work is equality doing?"
          *   Focus on *Social Equality* (Anderson/Scheffler) vs. *Distributive Equality*.
          *   Formal results: Show where Prioritarianism and Egalitarianism diverge in practice (risk cases, population ethics).

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* I need to be careful not to dismiss the user's hypothesis entirely. It's a very Parfitian move to dissolve disputes by clarifying questions. I should affirm that *some* of the heat comes from conflating Telic and Deontic views.
      *   *Nuance:* The "verbal" claim is strong. I should argue it's *substantively verbal*—meaning the substantive disagreement is smaller than the rhetoric suggests, but the remaining gap is real (metaphysical).
      *   *Key Distinction:* The "All-Things-Considered" vs. "Pro Tanto" distinction. Egalitarians admit leveling down is bad all-things-considered, but good *pro tanto* regarding equality. Prioritarians deny it's good even *pro tanto*. This is the core.

  6.  **Finalizing the Structure:**
      *   **Verdict:** The hypothesis is insightful but incomplete. It explains the *frustration*, not the *ontology*.
      *   **Diagnosis:** The impasse is sustained by a conflation of *Telic* (outcome) and *Deontic* (principle) egalitarianism, but the core clash is about the *Site of Value* (Individual vs. Relational).
      *   **Survival Check:**
          *   Prioritarian: Survives on "Better for someone." Falls on "Mathematical equivalence."
          *   Egalitarian: Survives on "Relational value." Falls on "Leveling down is desirable."
      *   **The Real Disagreement:** Impersonal value vs. Person-affecting constraints.
      *   **The Way Out:** Stop debating LDO. Move to Risk/Identity cases or Social Equality.

  7.  **Tone:** Academic, precise, empathetic to the chair's fatigue, decisive. (Avoid waffling).

  8.  *(Self-Correction during drafting)*: Make sure to explicitly answer the "If it holds... If it does not..." structure requested.
      *   *Decision:* I will argue it *partially* holds but ultimately fails to dissolve the core metaphysical disagreement. I will treat it as a "diagnosis of the impasse" rather than a "dissolution of the debate." The impasse is verbal; the debate is substantive.

      *   *Wait, looking closer at the prompt:* "Test that hypothesis. If it holds... If it does not..."
      *   *Strategy:* I will argue the hypothesis is *diagnostically correct but ontologically insufficient*. It explains why they talk past each other, but not why they disagree. I will frame it as: The hypothesis explains the *stalemate*, but the *disagreement* remains real.
      *   *Actually, a stronger stance is better:* The hypothesis is largely correct about the *source of the impasse* (talking past each other), but incorrect that the disagreement is *merely* verbal. There is a residual substantive core. I will structure the response to reflect this nuance.

      *   *Revised Plan:*
          1.  Validate the hypothesis as the explanation for the *stalemate* (why no progress).
          2.  Show where it fails to dissolve the *substantive* core (Site of Value).
          3.  Categorize claims (Survive vs. Nothing).
          4.  Identify the Real Disagreement (Impersonal Value).
          5.  Prescribe the move (Shift to Social Equality or Risk).

  9.  **Final Polish:** Ensure terms like "Telic," "Deontic," "Person-Affecting," and "Pro Tanto" are used correctly. Ensure the distinction between "outcome goodness" and "choice guidance" is clear.

      *(Self-Correction on "Mathematical Clothes"):* Parfit argued Prioritarianism is distinct from Egalitarianism. Some argue they are extensionally equivalent in fixed population cases. I need to mention this.

      *(Final check on the User's Hypothesis):* User says: Prioritarian = Outcome Goodness; Egalitarian = Agent Choice.
      *Critique:* This is actually the reverse of how Parfit set it up sometimes, or rather, Telic Egalitarians *do* care about outcome goodness. Deontic Egalitarians care about principles. The User's hypothesis maps Prioritarianism to Telic and Egalitarianism to Deontic. This is a common mapping but Telic Egalitarianism exists (Temkin). So the hypothesis fails because Telic Egalitarians *do* argue about outcome goodness.
      *Decision:* I must point out that the Egalitarian side often *insists* on outcome value (Telic), which is why the LDO bites them. If they retreated to Agent Choice (Deontic), the LDO wouldn't stick. So the impasse exists *because* Egalitarians refuse the User's categorization. This is a crucial insight.

      *Okay, let's write.*
answer: |-
  Your hypothesis is diagnostically sharp but ontologically incomplete. It correctly identifies why the *conversation* is stuck, but it underestimates why the *disagreement* persists.

  Here is the diagnosis of your reading group's impasse, tested against your hypothesis.

  ### 1. Testing the Hypothesis
  **Your Hypothesis:** The Prioritarian asks, "What makes an outcome good?" (Value), while the Egalitarian asks, "How ought an agent choose?" (Reason/Procedure).
  **Verdict:** **Partially True, but False as a Dissolution.**

  *   **Where it holds:** Much of the heat in your group comes from a category error. Prioritarians (following Parfit) often frame their view as a theory of *well-being weighting* within an outcome evaluation. Egalitarians often defend equality as a demand of *justice* or a constraint on *agency*. When the Prioritarian says, "Leveling down produces no good," they mean "no increase in weighted welfare." When the Egalitarian says, "Equality is valuable," they often mean "Inequality is unjust." If one is speaking the language of *Goodness* and the other the language of *Rightness*, they will never meet.
  *   **Where it fails:** The hypothesis assumes Egalitarians *should* be talking about agency. But **Telic Egalitarians** (like Larry Temkin) explicitly insist that equality is intrinsically good *in the outcome*, not just a rule for agents. They bite the bullet: "Yes, a world of universal misery is *in one respect* (equality) better than a world of mixed misery and wealth." They refuse to retreat to your "agent choice" category. Because they insist on outcome value, the disagreement is not merely verbal; it is metaphysical.

  ### 2. Claims Survival Analysis
  If we force the distinction you propose (Outcome Value vs. Agent Reason), here is what survives and what dissolves into noise.

  **Claims that turn out to be "About Nothing" (Verbal/Category Errors):**
  *   **The Prioritarian claim:** "Levelling down cannot be better in any respect."
      *   *Diagnosis:* This assumes "better" must mean "better for someone." If the Egalitarian defines "better" as "more just," the claim is false by definition. This is a stipulative fight.
  *   **The Egalitarian claim:** "Prioritarianism ignores the moral significance of gaps."
      *   *Diagnosis:* If the question is "How should an agent choose?", Prioritarianism *does* account for gaps by weighting the bottom more heavily. If the resulting distribution looks the same, arguing about the "significance of gaps" is often just arguing about the mathematical function (concave utility vs. gap metrics) without practical difference in fixed-population cases.
  *   **The "All-Things-Considered" Dispute:**
      *   *Diagnosis:* Almost no one argues that leveling down is *all-things-considered* better. Arguing over this is a strawman. The Prioritarian knows equality has instrumental value; the Egalitarian knows welfare has value. Fighting over the aggregate sum is a distraction.

  **Claims that Survive (Substantive Core):**
  *   **The Prioritarian:** "Value must ultimately be anchored in individual experience."
      *   *Status:* **Survives.** This is the core commitment. Benefits must accrue to subjects.
  *   **The Egalitarian:** "Relations between persons constitute a distinct site of value."
      *   *Status:* **Survives.** This is the core commitment. The *structure* of distribution matters independently of the absolute levels.
  *   **The LDO itself:** "Is a change that benefits no one ever an improvement?"
      *   *Status:* **Survives.** This is the hard point of conflict. The Prioritarian says "No." The Telic Egalitarian says "Yes (in the respect of equality)."

  ### 3. The Real Disagreement
  Since your hypothesis does not fully dissolve the debate, here is the actual remaining disagreement. It is not about questions (outcome vs. choice); it is about the **Site of Value**.

  1.  **Impersonal Value vs. Person-Affecting:**
      The Prioritarian holds a **Person-Affecting View** (roughly): An outcome cannot be better unless it is better for some particular person. The Telic Egalitarian holds an **Impersonal View**: The pattern of distribution itself has value, even if no individual is improved by the pattern change.
      *   *The Impasse:* You cannot argue someone out of this with logic. It is a foundational intuition. One side sees "relations" as real value-bearers; the other sees only "individuals" as value-bearers.

  2.  **Mathematical Clothes?**
      Is Prioritarianism just Egalitarianism with a concave utility function?
      *   *In fixed populations:* Often yes. They recommend the same policies.
      *   *In variable populations/risk:* No. They diverge. Prioritarianism is vulnerable to the "Sadistic Conclusion" (in population ethics) in ways Egalitarianism is not, and Egalitarianism is vulnerable to the "Leveling Down" objection in ways Prioritarianism is not.
      *   *Diagnosis:* If your group is only discussing fixed-population leveling down, the disagreement *is* mostly mathematical clothes. If you introduce risk or future generations, the theories separate.

  ### 4. How to Move the Group (Or Why Not To)
  You have spent a year here because the Levelling-Down Objection is a **philosophical sinkhole**. It tests foundational intuitions that are not amenable to further argument. To move, you must change the terrain.

  **Option A: The Distinction (Telic vs. Deontic)**
  Force the Egalitarians in your group to declare: Are you Telic or Deontic?
  *   If **Deontic** (Equality is a duty, not a value): The LDO dissolves. Leveling down violates no duty to equalize if it harms some to help none. They concede the Prioritarian's point on value but keep equality as a rule of action.
  *   If **Telic** (Equality is a value): They must accept the LDO bullet. "Yes, equality is better even if worse for everyone."
  *   *Action:* Ask them to write down whether they believe a world of equal misery is *in any respect* better than unequal misery. If they say "No," they are Prioritarians. If they say "Yes," they are Telic Egalitarians. Stop arguing; map the terrain.

  **Option B: The Formal Result (Risk and Identity)**
  Stop discussing leveling down. It is a static case. Move to **Social Equality (Elizabeth Anderson)** or **Risk**.
  *   *Social Equality:* Shift the question from "Distributive Shares" to "Social Relations." Is the problem that some have less, or that some are dominated? This bypasses the LDO because leveling down does not create social equality.
  *   *Risk:* Prioritarianism and Egalitarianism diverge sharply on ex-ante vs. ex-post evaluation under risk. This is where the "mathematical clothes" argument is tested empirically.

  **Option C: Acceptance (Why Nothing Should Move)**
  If the group insists on staying with Telic Egalitarianism vs. Prioritarianism on LDO: **Nothing will move this.**
  *   You are asking them to choose between two axioms: "Value resides only in individuals" vs. "Value resides in relations."
  *   This is not a dispute solvable by reasoning; it is a clash of moral visions.
  *   *Recommendation:* Declare the "LDO Year" complete. Record the vote. Acknowledge that the Prioritarian wins on *parsimony* (fewer metaphysical commitments) and the Egalitarian wins on *intuition* (inequality feels bad even if utility is high). Move to a topic where the theories yield different policy prescriptions.

  **Summary for the Chair:**
  Your hypothesis is the key to unlocking the *conversation*, but not the *philosophy*. Tell your group: "We are talking past each other because some are discussing Value (Telic) and others Justice (Deontic). Let us separate these. If we are discussing Value, the Prioritarian wins on parsimony. If we are discussing Justice, the Egalitarian wins on relevance. The LDO only kills Telic Egalitarianism. Are you Telic Egalitarians?"

  If they admit they are not Telic, the objection vanishes. If they admit they are, let them own the bullet. Then move on.
