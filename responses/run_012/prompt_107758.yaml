answer: |-
  You are right to be uneasy. The 'minefield' warning you received is not merely cautionary; it is a mathematical reality. There is no unique, universally applicable Principle of Indifference that satisfies all intuitive desiderata simultaneously. As a software engineer, you are looking for a specification that guarantees deterministic, consistent output given a set of inputs. In the realm of objective priors, such a specification does not exist without introducing hidden assumptions.

  Below is the specification of desiderata you requested, followed by an analysis of their compatibility, classification, and the specific constraint that causes the most friction.

  ### The Desiderata Specification

  To be considered adequate, a principle for assigning probabilities under ignorance must satisfy the following five requirements.

  **1. Parametrisation Consistency (The Bertrand Requirement)**
  *   **Specification:** The probability assigned to a physical event must not depend on the mathematical coordinates used to describe the system.
  *   **Motivating Case:** Consider Bertrand's Chord Paradox. You wish to assign a probability to a random chord in a circle being longer than the side of an inscribed equilateral triangle. If you parametrise by the distance of the chord from the centre, you get one probability. If you parametrise by the angle of intersection at the circumference, you get another. If you parametrise by the coordinates of the midpoint, you get a third. An adequate rule must yield a single answer regardless of whether you model the geometry using distances, angles, or areas.

  **2. Transformation Invariance**
  *   **Specification:** If your state of knowledge is invariant under a specific transformation of the variable, the probability distribution must reflect that symmetry. Alternatively, the rule must explicitly define a 'privileged' parametrisation and justify why it is immune to transformation.
  *   **Motivating Case:** Suppose you know a quantity lies between 1 and 2, but you have no other information. If you treat the quantity $x$ as uniformly distributed, then the reciprocal $y = 1/x$ is *not* uniformly distributed. If your knowledge is truly 'indifferent', it should not favour the linear scale over the logarithmic scale. If the problem description does not distinguish between $x$ and $1/x$, the rule should not distinguish between them either.

  **3. Derived Quantity Coherence**
  *   **Specification:** Indifference applied to a base quantity must agree with indifference applied to a derived quantity, provided the state of knowledge regarding the derivation is symmetric.
  *   **Motivating Case:** You know a rate $\lambda$ lies between 1 and 2. You also consider the period $\tau = 1/\lambda$, which lies between 0.5 and 1. If you assign a uniform distribution to $\lambda$, you imply a specific non-uniform distribution for $\tau$. If you were instead told "the period lies between 0.5 and 1 with no other info", you might assign a uniform distribution to $\tau$. These two approaches yield contradictory probabilities for the same physical reality. The rule must ensure that modelling the rate or the period yields the same predictive probabilities for observable events.

  **4. Stability Under Conditioning**
  *   **Specification:** If the range of the quantity is restricted by new information, applying the principle to the new restricted range should yield the same distribution as conditioning the original distribution on that range.
  *   **Motivating Case:** You assign a distribution over $[0, 10]$. You then learn the value is definitely in $[0, 5]$. If you simply truncate your original distribution and renormalise, the result should be identical to applying the principle of indifference directly to the range $[0, 5]$. If the rule produces a different shape depending on whether you knew the restriction beforehand or learned it afterwards, it is unstable.

  **5. Meta-Consistency (Self-Application)**
  *   **Specification:** The rule must not yield contradictory advice when applied to the choice of the rule itself. It must select a unique methodology or admit that multiple methodologies are equally valid without creating a paradox.
  *   **Motivating Case:** If you use the principle to decide which parametrisation is 'natural', you are applying a probabilistic rule to a methodological choice. If the rule suggests 'use Maximum Entropy' but applying Maximum Entropy to the choice of priors suggests 'use Transformation Groups', the system is self-contradictory. A robust specification must prevent this infinite regress or circular conflict.

  ### Analysis of Requirements

  #### Non-Negotiable vs. Camp Preferences

  To navigate this minefield, you must distinguish between the laws of probability and the philosophies of inference.

  **Non-Negotiable (The Hard Constraints):**
  1.  **Kolmogorov Additivity:** Probabilities must sum to one. This is not up for debate; without it, you are not doing probability.
  2.  **Internal Consistency:** The rule cannot output $P(A) = 0.6$ and $P(\text{not } A) = 0.6$. This is covered by Meta-Consistency.
  3.  **Parametrisation Consistency:** This is effectively a requirement for physical reality to be independent of your coordinate system. If a rule fails this, it is mathematically broken for engineering purposes.

  **Camp Preferences (The Soft Constraints):**
  1.  **Transformation Invariance:** This is the primary dividing line. The 'Objective Bayesian' camp (following Jaynes) demands this. The 'Subjective Bayesian' camp argues that invariance is an extra piece of information, not a default state. They prefer to specify a privileged parametrisation based on the measurement device.
  2.  **Maximum Entropy:** Often proposed as the solution to indifference. This is a preference for the distribution that assumes the least information beyond the constraints. It is a powerful heuristic, but it is a choice of functional, not a logical necessity.
  3.  **Stability Under Conditioning:** While desirable, some valid priors (specifically improper priors used in limit arguments) do not satisfy this strictly without careful handling of limits.

  #### The Incompatible Subset

  Your suspicion is well-founded, though the tension is slightly more specific than 'Invariance vs. Additivity'. Standard probability additivity (the sum of disjoint events) is never in conflict. The conflict is between **Transformation Invariance** and **Uniformity (Naive Indifference)**.

  You cannot jointly satisfy the following three conditions:
  1.  **Uniformity:** Equal probability is assigned to equal intervals of the parameter (the naive interpretation of indifference).
  2.  **Transformation Invariance:** The distribution remains form-invariant under non-linear transformations (e.g. $x \to \log x$ or $x \to 1/x$).
  3.  **Normalisation:** The probability integrates to 1 over the domain.

  **The Conflict:**
  If you demand Uniformity over a range $[a, b]$, you violate Transformation Invariance. A uniform distribution on $x$ becomes non-uniform on $1/x$.
  If you demand Transformation Invariance (specifically scale invariance), you are forced towards a distribution proportional to $1/x$. Over an infinite range, this violates Normalisation (it cannot be integrated to 1). Over a finite range (like your 1 to 2 example), it violates Uniformity.

  Therefore, the subset {Uniformity, Transformation Invariance, Normalisation} is inconsistent. You must drop one.
  *   Dropping **Normalisation** leads to 'improper priors', which are dangerous for software engineers as they can lead to undefined posteriors if not handled with extreme care.
  *   Dropping **Uniformity** means abandoning the intuitive idea that 'ignorance means flat'.
  *   Dropping **Transformation Invariance** means accepting that your results depend on how you chose to write down the variables.

  #### The Single Most Restrictive Requirement

  The requirement that rules out the greatest number of otherwise plausible principles is **Transformation Invariance**.

  **Reasoning:**
  The most 'plausible' principle for an engineer is the Principle of Insufficient Reason: "If I know nothing, all values are equally likely." This implies a Uniform distribution. It is simple, easy to implement, and intuitively appealing.
  Transformation Invariance immediately destroys this. It dictates that if you are ignorant of a scale parameter, you cannot use a Uniform distribution; you must use a Log-Uniform ($1/x$) distribution. If you are ignorant of a location parameter, you use Uniform. If you are ignorant of a shape parameter, the form changes again.

  By demanding Invariance, you force the user to identify the symmetry group of the problem (translation, scale, rotation) before assigning a probability. This rules out the naive 'flat prior' in almost all non-trivial cases. It transforms a simple assignment task into a group-theory analysis. While this is mathematically more robust, it is the primary filter that eliminates the standard, intuitive approaches to indifference.

  ### Summary for Implementation

  As a software engineer, you need to know that you cannot write a function `assign_prior(knowledge)` that satisfies all these desiderata universally.

  1.  **Accept the Trade-off:** You must choose between Parametrisation Consistency (via Invariance) and Implementation Simplicity (via Uniformity).
  2.  **The Hard Constraint:** Do not violate **Parametrisation Consistency**. If your software gives different reliability estimates for a bridge depending on whether you model load in Newtons or Pounds-force, the software is defective.
  3.  **The Practical Solution:** Do not use a generic Principle of Indifference. Instead, encode the **symmetry of the measurement process** into the rule. If your sensor measures linearly, use Uniformity. If your sensor measures logarithmically (like decibels), use Log-Uniformity.
  4.  **The Warning:** If you enforce Transformation Invariance on a bounded range to satisfy consistency, you must accept that your distribution will not be flat. If you enforce Flatness, you must accept that your results are parametrisation-dependent. There is no mathematical free lunch.
