prompt: |-
  my cousin wont shut up about this analogy and i want to know if it actually holds. he says running a country is like flying a plane: the passengers dont vote for the pilot, they just want to land safe, and if the pilot gets them there nobody asks how he got the job. thats basically his whole case for singapore and china — deliver growth and order and youve earned the right to rule, what people call performance legitimacy. i want the correspondence table first: whos the pilot, whos air traffic control, whats the destination, whats the weather, whos allowed into the cockpit and who gets thrown out of it. then i want the places it breaks. i already suspect the destination and the exit door are smuggling in a lot — everyone agrees they want to land safely, but do they agree on what prosperity even is or where theyre going, and can passengers who cant get off the plane really be said to consent to the pilot? when i said that he waved it off by saying it doesnt matter because they would have picked him anyway if youd asked them, and i dont know what to do with that move. so: how far does the plane analogy really go, what does it quietly import that a country doesnt have (no single runway, no agreed arrival time, no ability to compare pilots, no refunds), and does the conclusion survive once the disanalogies are on the table — or was the analogy carrying the whole argument the entire time? and if it is carrying it, whats a better analogy for what hes actually claiming?
