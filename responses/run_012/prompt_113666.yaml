answer: |-
  ### The Death Definition Decision Tree

  **Instructions:** Read each case aloud. Ask participants to raise their hands for the option that matches their intuition. Follow the branch to the next node or final position.

  **Node 1: The DCD Wait (Irreversibility)**
  *A patient's heart stops. We have the technology to restart it with ECMO, but our DCD protocol says we must wait five minutes of no pulse before declaring death. At minute four, is the patient dead?*
  *   **Yes:** (Death depends on our decision not to act) → Go to **Leaf A**.
  *   **No:** (Death depends on biological impossibility) → Go to **Node 2**.

  **Node 2: The Ventilator's Work (Integration)**
  *A brain-dead patient's body is warm, digests food, heals wounds, and (if pregnant) can gestate a fetus, but cannot breathe without a machine. Is the ventilator keeping the organism integrated, or is it merely oxygenating parts of an already disintegrated whole?*
  *   **Keeping it Integrated:** (The body is still one living organism) → Go to **Leaf B**.
  *   **Oxygenating Parts:** (The body is no longer one living organism) → Go to **Node 3**.

  **Node 3: The PVS Patient (Personhood)**
  *A patient has permanently lost all consciousness (cortex destroyed) but breathes on their own and has sleep-wake cycles (brainstem intact). If you turn off the feeding tube, are you killing a person or allowing a body to die?*
  *   **Killing a Person:** (The person is already gone) → Go to **Leaf C**.
  *   **Allowing a Body to Die:** (The person is still present) → Go to **Node 4**.

  **Node 4: The Organ Harvest (The Dead-Donor Rule)**
  *We have a patient with catastrophic brain injury who will never wake up but still has a heartbeat. Is it morally worse to remove their heart *now* to save five lives than to wait two hours for the heart to stop naturally?*
  *   **Not Worse:** (Outcomes matter more than the label of death) → Go to **Leaf D**.
  *   **Worse:** (We must not kill to save) → Go to **Node 5**.

  **Node 5: The Breathing Brain (Brainstem Specifics)**
  *A patient has lost all cortical function and the ability to breathe spontaneously, but retains hypothalamic function (hormone regulation, temperature control). Is this patient dead?*
  *   **Yes:** (Breathing is the critical function) → Go to **Leaf E**.
  *   **No:** (Biological integration is still present) → Go to **Leaf F**.

  ***

  ### The Leaves (Positions & Awkward Commitments)

  *   **Leaf A: Death as a Normative Boundary**
      *   *Merges:* Legal/Moral Status; Death as a Process.
      *   *Awkward Commitment:* You must admit that a patient could be "dead" at 9:00 AM and "alive" at 9:05 AM solely because a doctor changed their mind about trying CPR.
  *   **Leaf B: Somatic Continuity**
      *   *Merges:* Circulatory Criterion (DCD); Brain Death is not Death.
      *   *Awkward Commitment:* You must tell a family that their loved one, whose chest is rising and whose skin is warm, is legally alive, even if you intend to harvest their organs once the heart stops.
  *   **Leaf C: Personhood Priority**
      *   *Merges:* Higher-Brain Criterion; Person/Organism Distinction.
      *   *Awkward Commitment:* You must accept that a breathing, digesting human body can be a "corpse" while it is still walking around, forcing you to define death as the loss of biography rather than biology.
  *   **Leaf D: Consequentialist Exception**
      *   *Merges:* Abandon the Dead-Donor Rule.
      *   *Awkward Commitment:* You must argue that physicians should be permitted to kill one patient (by removing a beating heart) to save others, provided there is consent, effectively ending the century-old prohibition on killing for organs.
  *   **Leaf E: Respiratory Criterion**
      *   *Merges:* Brainstem Criterion (UK).
      *   *Awkward Commitment:* You must accept that a patient who can regulate their own hormones and temperature is dead, while a patient on a ventilator who cannot is also dead, making "breathing" the sole magic switch for human life.
  *   **Leaf F: Integrative Unity**
      *   *Merges:* Whole-Brain Criterion; Integration View (Bernat).
      *   *Awkward Commitment:* You must argue that a body that digests food and fights infection is "disintegrated," relying on a metaphysical claim about the brain's role as the "critical integrator" that is invisible to the naked eye.

  ***

  ### Structural Analysis

  **Indistinguishable Leaves**
  The tree cannot genuinely separate **Leaf A (Normative Boundary)** and **Leaf C (Personhood Priority)** if the participant believes consciousness is a social construct. If "personhood" is just a status we assign, then saying "the person is dead" (Leaf C) collapses into "death is a status we assign" (Leaf A). Similarly, **Leaf B (Somatic Continuity)** and **Leaf F (Integrative Unity)** are often indistinguishable in practice because both reject the *current* legal standard of brain death, though for different reasons (one waits for the heart, the other waits for total brain including hypothalamus). I have kept them separate because their *reasons* (biology of circulation vs. biology of integration) differ, but in a rushed clinical setting, they look identical: "Do not declare death yet."

  **The Empty Branch**
  There is a logically empty branch at **Node 4**. If a participant answers **Node 1 (Biological Fact)** → **Node 2 (Disintegrated/Dead)** → **Node 3 (No Split)** → **Node 4 (Not Worse/Abandon DDR)**, they occupy an incoherent position. If death is a biological fact and the patient is already dead (per Node 2), the Dead-Donor Rule is *satisfied*, not abandoned. One only "abandons" the rule if one admits the patient is still alive. This branch is empty because it attempts to combine a realist ontology of death with an instrumentalist policy on killing.

  **Node to Drop for Space**
  If you need to fit this on one side of a page, drop **Node 5**. The distinction between the **Brainstem Criterion (Leaf E)** and the **Integrative Unity/Whole-Brain Criterion (Leaf F)** is a technical dispute within the "Brain Death is Death" camp. While philosophically rich, it rarely changes clinical outcomes in the US (where Whole-Brain is law) versus the UK. Merging these into a single "Neurological Criterion" leaf saves space without losing the major ethical fault lines (Circulatory vs. Neurological vs. Personhood).

  ***

  ### Facilitator's Note

  Expect the discussion to get stuck at **Node 2 (The Ventilator's Work)**. Clinicians will instinctively say the body is "disintegrated" because they are trained to see the brain as the commander; philosophers will instinctively say the body is "integrated" because homeostasis is visibly occurring. The clinicians will speak from *functional utility* (the body doesn't work without us), while the philosophers will speak from *ontological status* (the body is doing what bodies do). Do not let them talk past each other. Force them to define "integration": is it the ability to act on the environment, or the ability to maintain internal equilibrium? If you don't resolve that definition, the tree will sort them, but they will leave the room still disagreeing on what the sorting means.
