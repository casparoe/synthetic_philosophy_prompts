answer: |-
  The cases you present are the canonical puzzles of modern decision theory and moral philosophy (Gauthier's *Morals by Agreement*, Kavka's *Toxin Puzzle*, Parfit's *Reasons and Persons*). Your intuitions track the tension between **Straightforward Maximization** (act only to maximize utility at the moment of acting) and **Constrained Maximization** (act to maximize utility by adhering to a rationally chosen disposition).

  You are looking for a principle that validates the rationality of the disposition while accounting for the normative status of the act. Here is the principle that best unifies your set, followed by the necessary sacrifice it demands.

  ### The Principle: Resolute Dispositionality

  **1. Ex-Ante Optimization:** It is rational to acquire a disposition if and only if possessing it maximizes expected utility over the agent's life from the moment of acquisition.
  **2. Resolute Execution:** Once such a disposition is acquired, it is rational to act in accordance with it, even if the specific act does not maximize utility at the moment of acting, *provided* that:
      *   (a) The disposition is causally ineffective if the agent calculates costs at the moment of acting (The *Temper* and *Novelist* clauses); OR
      *   (b) Failure to act would render the agent's future commitments incredible, thereby losing the benefits of the disposition (The *Deterrence* clause).
  **3. Moral Side-Constraints:** A disposition is inadmissible if its execution requires violating a strict moral duty in a specific instance, even if the disposition is prudentially beneficial overall (The *Brother* clause).

  ### How the Principle Accommodates Your Verdicts

  *   **The Toxin:** Fits Clause 1 & 2. Forming the intention secures the fortune (Ex-Ante Optimization). Not drinking is permitted because the intention was the product, not the act (no future credibility needed).
  *   **The Machine:** Fits Clause 2(b). The machine externalizes the commitment, making the threat credible without requiring the agent to be irrational.
  *   **The Temper:** Fits Clause 2(a). Calculating costs destroys the temper. Therefore, retaliating without calculating is "not irrational" because it preserves the disposition that makes you safe.
  *   **The Novelist:** Fits Clause 2(a). Seeing the friend as a device destroys the belief. Rationality requires opacity.
  *   **The Brother:** Fits Clause 3. The disposition (refusal) is prudentially good, but the specific act (refusing the desperate) is morally wrong. You can acquire the disposition but must override it in the exceptional case.

  ### The Fracture: The Walker

  Here the principle forces a conflict with your intuitions.
  *   **Your Verdict:** The walker is **not irrational** to refuse payment (Act-Rationality wins), though he is blameworthy (Moral loss).
  *   **The Principle's Verdict:** The walker is **irrational** to refuse payment.

  **Why?** Under *Resolute Dispositionality*, the walker entered a cooperative scheme (the ride). The disposition "Keep Promises" is what made the ride available. To break the promise is to defect from a rational disposition. If you accept that the Retaliator is "not irrational" for costing himself money to sustain a disposition (Temper), you must accept that the Walker is "irrational" for saving himself money by destroying a disposition (Promise-Keeping).

  You cannot have it both ways. In the Retaliation case, you privilege the **Disposition** over the **Act** (retaliating is costly but "not irrational"). In the Walker case, you privilege the **Act** over the **Disposition** (saving money is "not irrational").

  ### Which Verdict to Give Up

  You should give up the verdict that **the Walker is not irrational.**

  If you maintain that the Retaliator is rational to act against his immediate interests to sustain a valuable disposition, consistency demands you view the Promise-Keeper as rational to act against his immediate interests to sustain a valuable disposition. The Walker's refusal is an instance of *time-inconsistency*: he reaps the benefit of the disposition (the ride) but rejects the cost (the payment) when it comes due. This is the definition of practical irrationality in a dynamic context.

  By calling the Walker "not irrational," you rely on **Straightforward Maximization**. But Straightforward Maximization makes the Retaliator *irrational* (since retaliation is costly with no future gain). Since you resist calling the Retaliator irrational, you have already implicitly rejected Straightforward Maximization. You must follow that rejection to its conclusion.

  ### The Prediction: A Test Case

  To test whether you truly accept **Resolute Dispositionality**, consider this case where the two halves (Act vs. Disposition) are forced apart without the distraction of moral blame.

  **The Case of the Transparent Shopkeeper**
  A shopkeeper has cultivated a disposition of absolute honesty. This disposition has made him wealthy, as customers trust him and flock to his store. He is now old and plans to retire tomorrow. A customer enters, buys an item, and due to a clerical error, is owed \$1,000 in change. The customer does not notice. The shopkeeper knows that:
  1.  Keeping the \$1,000 will have no effect on his reputation (he retires tomorrow; the customer will never know).
  2.  Returning the \$1,000 costs him \$1,000 with no future prudential gain.
  3.  His disposition of honesty is purely instrumental; he does not feel "pained" by dishonesty, he simply acts honestly automatically.

  **The Prediction:**
  If you adhere to *Resolute Dispositionality*, the shopkeeper **must return the money.** To keep it is to act on Straightforward Maximization, which undermines the integrity of the disposition that made him successful. Even though the *consequences* of this specific act are neutral, the *rationality* of the agent depends on not switching decision-procedures when it suits them.

  If you feel the shopkeeper is **rational to keep the money** (because the disposition has already paid off and no future gain is at stake), then you are a Straightforward Maximizer. If so, you must concede that the **Retaliator is irrational** (because his retaliation yields no future gain). You must choose: Is rationality about the *history of the disposition* or the *future of the act*?

  **My advice:** Choose the history of the disposition. It accommodates the Novelist, the Temper, and the Deterrence machine. It only costs you the intuition that the Walker is clever rather than untrustworthy.
