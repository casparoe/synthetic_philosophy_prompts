answer: |-
  The central promise of Nozick's tracking theory is seductive: it offers a way to secure ordinary knowledge against skepticism without requiring us to prove we aren't brains in vats. It achieves this by severing the link between knowledge and logical closure. You can know you have hands because your belief tracks the truth of your hands; you don't know you aren't a brain in a vat because your belief doesn't track that truth. The theory asks us to accept that knowledge is not a closed system.

  This essay argues that this price is too high. The failure of closure is not a quirk; it is a fatal structural flaw that renders tracking incompatible with the nature of rational inference. To demonstrate this, I will first construct a fresh closure failure that avoids the tired "brain-in-a-vat" phrasing while retaining the logical sting. I will then examine the attempt to repair the theory by bolting on a closure condition, showing that this either collapses into skepticism or renders the tracking conditions redundant. Finally, I will address the vagueness of method-relativity before concluding that tracking must be abandoned as a theory of knowledge.

  ### The Android Brother

  Let us dispense with the brain-in-a-vat. Consider a mundane scenario involving identity and technology. You walk into your living room and see your brother, David, sitting on the couch. You have lived with David for twenty years; you know his face, his gait, his voice. You form the belief:

  **$p$: David is sitting on the couch.**

  According to tracking theory, you know $p$. In the nearest possible world where $p$ is false (David went to the kitchen or is at work), you do not see him on the couch, and you do not believe he is there. Your belief is sensitive to the truth of $p$.

  However, from $p$, you can deduce a further proposition:

  **$q$: David is not an android duplicate who replaced the real David last night.**

  This entailment holds: if David (the human) is sitting on the couch, then it is not the case that an android replaced him. Yet, consider the sensitivity condition for $q$. In the nearest possible world where $q$ is false (i.e., David *was* replaced by a perfect android duplicate last night), the android is designed to behave exactly like David. It sits on the couch. It speaks like David. You would still believe $q$ is false (you would still believe he is human). Your belief in $q$ does not track the truth of $q$.

  Consequently, the tracking theorist must say you know $p$ (David is on the couch) but you do not know $q$ (David is not an android). This is absurd. If you genuinely know David is sitting there, you thereby know he isn't a robot imposter, because being a human on the couch entails not being a robot on the couch. To deny this is to claim that logical deduction cannot extend knowledge. It suggests that your epistemic position is strong enough to secure the fact but too weak to secure the necessary conditions of that fact. This isn't just counterintuitive; it breaks the normative link between evidence and conclusion.

  ### The Repair Dilemma

  Defenders of tracking might attempt to rescue the theory by bolting on a closure condition. Let us analyze two ways this could be done, both of which wreck the theory.

  **Option 1: The Strict Bolt-On**
  We modify the definition: $S$ knows $p$ only if $S$ tracks $p$ **and** $S$ tracks all obvious deductive consequences of $p$.
  This repair saves closure but destroys ordinary knowledge. In the Android Brother case, you cannot track $q$ (the non-android claim). Therefore, under this new definition, you cannot know $p$ (David is on the couch). The skepticism that tracking was designed to avoid returns through the back door. If every piece of mundane knowledge entails a skeptical hypothesis that fails sensitivity, then requiring sensitivity for the hypothesis eliminates the mundane knowledge. The theory self-destructs, leaving us knowing almost nothing.

  **Option 2: The Liberal Bolt-On**
  We modify the definition: $S$ knows $p$ if $S$ tracks $p$, **and** if $S$ deduces $q$ from $p$, $S$ counts as knowing $q$ even if $q$ fails sensitivity.
  This saves ordinary knowledge and restores closure, but it renders the tracking conditions ad-hoc. Why does sensitivity matter for $p$ but not for $q$? If $q$ is a necessary consequence of $p$, then the truth of $p$ guarantees the truth of $q$. If we are willing to grant knowledge of $q$ despite the failure of sensitivity, we are admitting that sensitivity is not a necessary condition for knowledge after all.
  The tracking conditions become a local heuristic for "easy" cases, while the closure rule does the heavy lifting for "hard" cases. But this creates an unstable hybrid. If sensitivity isn't necessary for $q$, why is it necessary for $p$? Perhaps $p$ itself is a consequence of some deeper fact $r$. Eventually, the closure rule will swallow the sensitivity rule entirely. The theory ceases to be a tracking theory and becomes a fragmented list of rules where sensitivity is invoked only when it yields the desired result. It loses its explanatory power.

  ### The Soft Spot of Method-Relativity

  One might object that I have ignored Nozick's recourse to method-relativity. Nozick suggests we evaluate sensitivity relative to the method used. "I know $p$ via vision." Perhaps, the theorist argues, I track $q$ via a different method, or the method for $p$ is specific enough to handle $q$.

  This move relies on a notion of "method" that is too vague to bear the weight of a philosophical analysis. How do we individuate methods? Is the method "vision," "vision in daylight," or "vision that is not deceived by androids"? If we define the method broadly ("vision"), sensitivity fails for the android case because vision cannot distinguish humans from perfect androids. If we define the method narrowly ("vision that only believes truth"), sensitivity is trivially satisfied, because in any world where the method is used, the belief is true.

  The tracking theorist is forced to tune the granularity of "method" to get the right answer for each case. This makes the theory unfalsifiable. It allows the theorist to say, "You track $p$ because we define the method this way, but you don't track $q$ because we define the method that way." A theory that can be adjusted to fit any intuition by tweaking the definition of its core variables is not a theory; it is a rationalization.

  ### The Verdict

  We must now commit: Is giving up closure a price worth paying for tracking?

  The answer is no. The failure of closure shows that tracking is the wrong theory of knowledge.

  Knowledge is not merely a causal correlation between mind and world; it is a normative status that licenses inference and assertion. If I know $p$, I am entitled to use $p$ as a premise in reasoning. If I deduce $q$ from $p$ competently, I am entitled to assert $q$. To say that I know $p$ but am not entitled to claim knowledge of $q$ is to break the logic of reasoning itself. It creates a gap between what I know and what I can rationally do with what I know.

  Tracking theory treats the knower like a thermometer. A thermometer can register the temperature (track $p$) without registering the implications of that temperature (track $q$). But a knower is not a thermometer. A knower is an agent capable of deduction. If a theory of knowledge cannot accommodate the fact that knowledge extends through deduction, it is not a theory of *knowledge*; it is a theory of *reliable belief*.

  Reliable belief is valuable, but it is not knowledge. Knowledge requires that our epistemic position be robust enough to survive logical expansion. By severing closure, tracking theory secures a connection to the world at the cost of severing the connection to reason. That is a trade no epistemology should make. The intuition that we know we are not androids is stronger than the intuition that sensitivity is necessary. When a theory forces us to choose, the theory must go. Tracking fails because it cannot account for the simple fact that to know a thing is to know what it implies.
