prompt: |-
  You are a clinical ethicist serving on the ethics consultation service of a large teaching hospital. We run several consults a week on one recurring problem, and we keep resolving it ad hoc: a patient who is now unable to make decisions is dissenting from a treatment choice that the same patient, while competent, set down in an advance directive — sometimes dissenting from a treatment the earlier self refused, sometimes refusing a treatment the earlier self demanded. I want a decision procedure the on-call consultant can actually run at the bedside within an hour, built on a distinction I think we have been sloppy about. The authority of the earlier self seems to me to rest on three different grounds, and they pull apart: (1) the directive records the person's own settled values, so following it honors autonomy rather than overriding it; (2) the directive is merely evidence about what this patient would want if thinking clearly, and can be outweighed by better evidence about that; (3) the directive is a claim of authorship, that this person gets to write the story of their own life, and therefore binds even when the present patient disowns it. Build the procedure so that each step names which ground it rests on, because I suspect most of our internal disagreements are really about which ground applies.

  Before drafting, think through the ways an earlier self and a later self can conflict, and set aside the ones a bedside procedure cannot responsibly handle. Then give me: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it must hand the decision to a person because the question is one of values rather than facts. The procedure should treat the earlier self's refusal of treatment differently from its demand for treatment, should have a test for whether the earlier self, foreseeing the later dissent, would have wanted the directive to bind, and should say whether and how the directive's authority decays as the discontinuity between the two selves grows.

  Run the procedure on three cases: (a) a man with ALS who, while competent, directed that he never be put on a ventilator, and who now, in respiratory failure and frightened, asks to be intubated; (b) a woman with bipolar disorder who signed a psychiatric advance directive authorizing involuntary medication during a future manic episode, and who is now manic and refusing it; and (c) a woman with advanced dementia whose directive refuses antibiotics for a treatable pneumonia, and who now, at the moment of the decision, cannot express a preference at all. At least one of your outcomes should be one a clinician will find hard to accept; say so plainly. Close by saying what the procedure cannot do.

  After the prose, give a structured summary as a JSON object with these fields: procedure_version (string); steps (array of objects with step_number, question, ground — one of value, evidence, or authorship — sufficient_answer, and on_no); handoffs (array of objects with condition, to_whom, and why_not_a_rule); cases (array of objects with case_id, ground_relied_on, outcome, handed_to, and asker_discomfort); and limits (array of strings).
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Clinical Ethicist on a hospital ethics consultation service.
      *   **Problem:** Recurring conflict between a competent past self (Advance Directive - AD) and an incompetent/dissenting present self (Current Patient).
      *   **Goal:** Create a bedside decision procedure (runnable within an hour) based on three specific grounds of authority:
          1.  *Value:* AD records settled values (honoring autonomy).
          2.  *Evidence:* AD is evidence of what the patient would want (substituted judgment).
          3.  *Authorship:* AD is a claim of authorship over one's life narrative (binding even if disowned).
      *   **Requirements:**
          *   Distinguish between refusal of treatment (AD says no, patient says yes) and demand for treatment (AD says yes, patient says no/unable).
          *   Include a test for whether the earlier self intended the directive to bind despite future dissent.
          *   Address authority decay based on discontinuity between selves.
          *   Identify where the procedure stops (No) vs. hands off to a person (values vs. facts).
          *   Run on three specific cases (ALS, Bipolar, Dementia).
          *   At least one outcome must be hard for clinicians to accept (state plainly).
          *   State limitations.
          *   Provide a JSON summary at the end.

  2.  **Deconstruct the Three Grounds:**
      *   *Value Ground:* Focuses on consistency of deep beliefs. If the current state reflects a distortion of those values (e.g., delusion), the AD holds. If the current state reflects a genuine evolution of values, the AD might not.
      *   *Evidence Ground:* Focuses on epistemic weight. Is the AD the best predictor of desire? If the current patient expresses a clear preference, does that outweigh the paper?
      *   *Authorship Ground:* Focuses on rights and narrative integrity. Did the person intend to bind their future self? This is the strongest ground but also the most contentious regarding "discontinuity."

  3.  **Filter Cases for Bedside Feasibility:**
      *   *Exclude:* Legal disputes over validity of the document itself (lawyer territory), cases of clear coercion by family, cases where the patient is clearly competent *now* (then the AD is irrelevant).
      *   *Include:* Cases where capacity is fluctuating or lost, and the conflict is between the document and the current presentation.

  4.  **Drafting the Procedure (The "Tri-Ground Protocol"):**
      *   *Step 1: Capacity Check.* (Prerequisite). If competent now, AD is advisory only.
      *   *Step 2: Type of Conflict.* Refusal (AD says No, Patient says Yes) vs. Demand (AD says Yes, Patient says No/None). *Crucial Distinction.* Refusal of life-saving treatment by a confused patient is treated differently than demanding futile treatment.
      *   *Step 3: The "Binding Intent" Test (Authorship Ground).* Did the earlier self anticipate this change and insist on binding? (e.g., "Even if I beg, do not...")
      *   *Step 4: Discontinuity Assessment (Authorship/Evidence Ground).* How different is the current self from the earlier self? (Dementia vs. temporary delirium).
      *   *Step 5: Value Consistency (Value Ground).* Is the current dissent based on values or symptoms?
      *   *Step 6: Handoff.* If ambiguity remains on values, who decides? (Surrogate vs. Ethics vs. Court).

      *Refining the Logic:*
      *   *Refusal in AD / Demand by Patient (e.g., ALS):* Usually, we err on life. But if AD is strong authorship, we might honor refusal.
      *   *Demand in AD / Refusal by Patient (e.g., Bipolar):* Usually, we treat the acute condition to restore capacity.
      *   *Decay:* Authority decays if the "self" is fundamentally different (advanced dementia) *unless* the authorship claim was specifically about preventing that state's existence.

      *Let's structure the steps logically for a 1-hour consult:*
      1.  Verify Incompetence.
      2.  Categorize Conflict (Refusal vs. Demand).
      3.  Assess "Binding Intent" (Authorship).
      4.  Assess "Self-Continuity" (Authorship/Evidence).
      5.  Assess "Value Distortion" (Value/Evidence).
      6.  Decision/Handoff.

  5.  **Developing the Three Cases:**
      *   *(a) ALS (AD: No Vent, Patient: Yes Vent):* High continuity (ALS doesn't change personality usually). Fear is a symptom, but the desire to live might be a value shift. *Hard Outcome:* If Authorship is strong, we honor the AD (No Vent), letting him die. Clinicians hate watching a scared patient die when treatment exists.
      *   *(b) Bipolar (AD: Yes Meds, Patient: No Meds):* Mania distorts values. AD was likely made to prevent this. *Outcome:* Honor AD (Medicate). This is standard Ulysses contract logic.
      *   *(c) Dementia (AD: No Abx, Patient: No Preference):* High discontinuity. The "self" who wrote the AD is arguably gone. *Outcome:* Treat (Abx). The authority decays because the beneficiary of the right (the person) no longer exists in the form that cares about the narrative. *Wait, the prompt asks for one outcome hard to accept.*
      *   *Revision for "Hard Outcome":* Let's make the Dementia case the hard one. If the AD was specific about *not* wanting to live in dementia, honoring it (No Abx) is hard for clinicians who see a happy demented patient. OR, honoring the ALS AD (letting him die while begging for life) is harder. Let's go with the ALS case being the hard one. Honoring a "No Vent" AD when the patient is screaming "Help me breathe" is ethically agonizing.
      *   *Wait, looking at the prompt again:* "At least one of your outcomes should be one a clinician will find hard to accept."
      *   *Case A (ALS):* If we honor the AD, he dies. Clinicians find this hard.
      *   *Case C (Dementia):* If we honor the AD, she dies of pneumonia. Clinicians find this hard (she seems content). If we treat, we violate the AD.
      *   *Decision:* I will structure the procedure such that Case A (ALS) results in honoring the AD (No Vent) based on strong Authorship Ground, which is clinically very difficult. Case C (Dementia) will result in Treatment based on Discontinuity/Decay.

  6.  **Refining the "Decay" Concept:**
      *   Authority decays when the psychological connectedness is severed (Parfit's reductionism). In advanced dementia, the "author" is gone. In ALS, the "author" is trapped but present.
      *   Therefore: ALS = High Continuity = AD Holds. Dementia = Low Continuity = AD Decays.

  7.  **Drafting the Content:**
      *   *Introduction:* Acknowledge the theoretical framework (Value, Evidence, Authorship).
      *   *The Procedure:* Step-by-step with explicit grounding.
      *   *Case Applications:* Apply the steps rigorously.
      *   *Limitations:* What can't this do? (Legal validity, resource allocation, family conflict).
      *   *JSON:* Strictly follow the schema.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish Refusal vs. Demand? Yes, Step 2.
      *   *Check:* Is there a test for "Binding Intent"? Yes, Step 3.
      *   *Check:* Is there a test for "Discontinuity/Decay"? Yes, Step 4.
      *   *Check:* Are the grounds labeled in every step? Yes.
      *   *Check:* Is the JSON valid? Need to ensure escape characters and proper formatting.
      *   *Check:* Is the "Hard Outcome" explicit? Yes, in the ALS case analysis.

  9.  **Final Polish:**
      *   Ensure tone is professional, clinical, yet philosophically precise.
      *   Make sure the "Handoff" logic is clear (when do we punt to a surrogate/court?).
      *   Ensure the JSON matches the requested fields exactly.

  *(Self-Correction on JSON)*: The prompt asks for specific fields: `procedure_version`, `steps` (array with step_number, question, ground, sufficient_answer, on_no), `handoffs` (array with condition, to_whom, why_not_a_rule), `cases` (array with case_id, ground_relied_on, outcome, handed_to, asker_discomfort), `limits` (array of strings). I must ensure all keys match.

  *(Self-Correction on Case C)*: The prompt says the dementia patient "cannot express a preference at all." This simplifies the "Current Dissent" aspect. It becomes AD vs. Best Interest/Standard of Care. The procedure needs to handle "No Current Preference" differently than "Active Dissent." I will add a branch in Step 1 or 2 for "Active Dissent vs. No Expression." Actually, the prompt implies the procedure is for "dissenting from a treatment choice." Case C says "cannot express a preference." I need to address this nuance. If they can't express preference, there is no *dissent*, just silence. The conflict is AD vs. Surrogate/Doctor. I will treat "No Preference" as a lack of Evidence Ground, forcing reliance on Value or Authorship.

  *(Refining the "Hard Outcome")*: The ALS case is the classic "Ulysses Contract" dilemma. If the procedure honors the AD, the patient dies while asking for life. This is the hardest one. I will ensure the procedure leads there if the "Authorship" ground is triggered.

  *(Refining the "Decay")*: I need to be careful not to say ADs *never* work in dementia. But the prompt asks to address how authority decays. I will posit that authority decays when the *experience* of the current self contradicts the *prediction* of the earlier self regarding quality of life, specifically in neurodegenerative conditions where the "self" changes.

  Let's write.

  *Step 1: Capacity.* (Evidence Ground).
  *Step 2: Conflict Type.* (Value Ground - Risk assessment).
  *Step 3: Binding Intent.* (Authorship Ground).
  *Step 4: Continuity/Decay.* (Authorship/Evidence Ground).
  *Step 5: Value Distortion.* (Value Ground).
