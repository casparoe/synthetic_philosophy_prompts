answer: |-
  ### The Tri-Ground Protocol for Advance Directive Conflicts

  **Preface: Scope and Exclusions**
  This procedure is designed for bedside ethics consultation where a patient currently lacks decision-making capacity, and their present behavior or expressed wishes conflict with a valid Advance Directive (AD) executed while competent.
  *   **Excluded:** Cases where the patient is currently competent (the AD becomes advisory only); cases involving clear legal invalidity of the document; cases where family surrogates are in active legal dispute; cases involving medical futility (where treatment is physiologically ineffective regardless of preference).
  *   **Timeframe:** Designed for completion within 60 minutes.
  *   **Core Distinction:** This protocol treats **Refusal Conflicts** (AD refuses treatment, Patient/Surrogate demands it) differently from **Demand Conflicts** (AD demands/accepts treatment, Patient/Surrogate refuses it). The burden of proof is higher to withhold life-sustaining treatment from a dissenting present self than to provide it.

  ---

  ### The Procedure

  **Step 1: Verify Incapacity and Dissent**
  *   **Question:** Is the patient currently lacking capacity, and is there active dissent (verbal/behavioral refusal) or merely silence?
  *   **Ground:** *Evidence* (Establishes the epistemic baseline: whose voice counts now?).
  *   **Sufficient Answer:** Documented capacity assessment confirms inability to understand/retain/weigh. Dissent is confirmed (e.g., pulling away, saying "no," begging for opposite).
  *   **On No:** If patient has capacity, stop. AD is advisory; follow current wishes. If no dissent (patient is passive), skip to Step 6 (Best Interest Standard).

  **Step 2: Categorize the Conflict Direction**
  *   **Question:** Is the AD refusing a treatment the present self wants (Refusal Conflict), or is the AD accepting a treatment the present self resists (Demand Conflict)?
  *   **Ground:** *Value* (Weighs the moral risk: death by omission vs. bodily intrusion).
  *   **Sufficient Answer:** Clear classification.
      *   *Refusal Conflict:* AD = No Vent, Patient = "Help me breathe."
      *   *Demand Conflict:* AD = Yes Meds, Patient = "No Meds."
  *   **On No:** Ambiguity requires Surrogate clarification. If unresolved, hand off to Ethics Committee for prolonged review.

  **Step 3: The Binding Intent Test (The "Ulysses" Clause)**
  *   **Question:** Does the AD explicitly state that it should remain binding even if the patient later appears to change their mind or begs for contrary treatment?
  *   **Ground:** *Authorship* (Tests if the earlier self claimed sovereignty over the future self).
  *   **Sufficient Answer:** Specific language (e.g., "Even if I beg," "Do not listen to my future self," "This directive stands regardless of my mental state").
  *   **On No:** If the AD is generic, the *Authorship* ground weakens significantly. Proceed to Step 4 relying more heavily on *Value* and *Evidence*.

  **Step 4: The Continuity and Decay Assessment**
  *   **Question:** Is the psychological discontinuity between the earlier self and later self so profound that the earlier self's authorship no longer represents the current being's interests?
  *   **Ground:** *Authorship* & *Evidence* (Tests the decay of authority over time).
  *   **Sufficient Answer:**
      *   *High Continuity:* (e.g., ALS, physical disability only, temporary delirium). The "self" is intact. Authority does **not** decay.
      *   *High Discontinuity:* (e.g., Advanced dementia, profound personality change). The "self" who wrote the AD is arguably gone. Authority **decays**.
  *   **On No:** If discontinuity is high (Dementia), the AD loses *Authorship* weight. Default to Best Interest unless Step 3 was strongly affirmative.

  **Step 5: The Value Distortion Test**
  *   **Question:** Is the current dissent driven by a reversible symptom (pain, delirium, mania) that distorts the patient's settled values, or does it reflect a stable re-evaluation of those values?
  *   **Ground:** *Value* (Determines if autonomy is being honored or overridden).
  *   **Sufficient Answer:**
      *   *Distortion:* (e.g., Mania, acute fear responsive to reassurance). AD reflects true values.
      *   *Stable Re-evaluation:* (e.g., Long-term adaptation to disability, calm acceptance of new state). Current self's values may supersede AD.
  *   **On No:** If values appear stable and changed, the *Value* ground shifts to the present self. Hand off to Surrogate to weigh current well-being.

  **Step 6: Resolution and Handoff**
  *   **Question:** Based on Steps 2-5, does the AD override the current dissent?
  *   **Ground:** *Synthesis* of previous grounds.
  *   **Sufficient Answer:**
      *   *Honor AD:* If Authorship is strong (Step 3) AND Continuity is high (Step 4) OR Distortion is high (Step 5).
      *   *Override AD:* If Continuity is low (Step 4) AND Distortion is low (Step 5).
  *   **On No:** If the consultant cannot determine Continuity or Distortion, hand off to the legally authorized surrogate with a recommendation to prioritize *current* well-being over *past* instruction.

  ---

  ### Case Applications

  **Case (a): ALS Patient (Refusal Conflict)**
  *   **Scenario:** AD refuses vent. Patient now in respiratory failure, frightened, asks for intubation.
  *   **Analysis:**
      *   Step 2: Refusal Conflict (High stakes: death if AD followed).
      *   Step 3: Assume AD says "Even if I panic." (Authorship Strong).
      *   Step 4: High Continuity. ALS affects muscles, not identity. (Authority does not decay).
      *   Step 5: Fear is a distortion of settled values, not a new value system.
  *   **Outcome:** **Honor AD. Do Not Intubate.**
  *   **Clinician Discomfort:** **High.** Clinicians will find it morally agonizing to watch a frightened, gasping patient die when a machine could save them, based on a piece of paper written years ago. This procedure demands we prioritize the *Authorship* of the life narrative over the *Evidence* of current suffering.
  *   **Ground Relied On:** Authorship (Step 3 & 4).

  **Case (b): Bipolar Patient (Demand Conflict)**
  *   **Scenario:** AD authorizes involuntary meds during mania. Patient now manic, refusing meds.
  *   **Analysis:**
      *   Step 2: Demand Conflict (Intrusion vs. Restoration).
      *   Step 3: Psychiatric ADs are inherently "Ulysses Contracts." (Authorship Strong).
      *   Step 4: High Continuity (Post-treatment self returns to baseline).
      *   Step 5: Mania is a clear Value Distortion.
  *   **Outcome:** **Honor AD. Medicate.**
  *   **Clinician Discomfort:** Low. This aligns with standard psychiatric ethics.
  *   **Ground Relied On:** Value (Step 5) & Authorship (Step 3).

  **Case (c): Advanced Dementia (Refusal Conflict)**
  *   **Scenario:** AD refuses antibiotics for pneumonia. Patient cannot express preference (Silence).
  *   **Analysis:**
      *   Step 1: No active dissent, but AD refuses care.
      *   Step 4: High Discontinuity. The "author" of the AD is psychologically gone; the current being experiences contentment. (Authority Decays).
      *   Step 5: No evidence of value distortion, but no evidence of current values either.
  *   **Outcome:** **Override AD. Treat with Antibiotics.**
  *   **Rationale:** The *Authorship* ground decays because the entity that wrote the directive no longer exists to be bound. The current being has an interest in continued existence that the earlier self could not fully anticipate.
  *   **Ground Relied On:** Authorship (Decay in Step 4).

  ---

  ### Limitations of the Procedure

  1.  **Legal Authority:** This is an ethical framework, not a legal shield. In some jurisdictions, a valid AD is legally binding regardless of ethical nuance.
  2.  **Surrogate Conflict:** If a surrogate aggressively contests the procedure's finding, this bedside tool cannot resolve legal guardianship disputes.
  3.  **Resource Constraints:** It does not account for triage scenarios where the treatment requested is unavailable for others.
  4.  **Epistemic Humility:** The "Continuity Assessment" (Step 4) is philosophical, not medical. There is no biomarker for "selfhood." Consultants must acknowledge this subjectivity.

  ---

