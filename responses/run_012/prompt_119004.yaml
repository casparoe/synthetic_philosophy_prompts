      *   *Dynamic Inconsistency:* "For two of these coffees my preference reverses depending on whether the swap would happen today or next week." Let's say Dark vs. Medium. Today I prefer Dark. Next week I prefer Medium. This suggests hyperbolic discounting or context-dependent valuation.
