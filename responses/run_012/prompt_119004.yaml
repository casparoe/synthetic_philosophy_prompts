      *   *Scene 4: Marcus's Solution.* He suggests mental fortitude. "Monday Elias knew best."
          *   *Test:* Does it work? He tries to resist.
          *   *Failure:* The urge is too strong because the preference *actually* changes. It's not just weakness; the value signal changes.
      *   *Scene 5: The Climax/Resolution.* A new cycle begins. The $2 bill is on the table.
