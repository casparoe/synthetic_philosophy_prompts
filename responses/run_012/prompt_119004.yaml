answer: |-
  The breakroom smells of roasted earth and stale ozone. On the counter sit the three bags. *Obsidian* (dark), *Meridian* (medium), *Aurora* (light). They are arranged in a triangle, a geometry that has cost me eight dollars in two months.

  The mechanism is simple. If I hold *Obsidian*, I want *Meridian*. I will hand over two dollars to make the swap. If I hold *Meridian*, I want *Aurora*. Two dollars. If I hold *Aurora*, I want *Obsidian*. Two dollars. I have walked this triangle four times. I am back where I started, holding the *Obsidian* bag, but my wallet is lighter.

  That is the first defect: the circle. A > B > C > A. It implies I don't know what I like.

  But there is a second defect, subtler and more corrosive. It involves the clock. Take *Obsidian* and *Meridian*. On a Monday morning, fresh and caffeinated, I prefer *Obsidian*. I value the punch. But if you ask me on a Monday to schedule a swap for Friday afternoon, I choose *Meridian*. I know Friday-Me will be tired; Friday-Me will want the smoothness. Yet, when Friday arrives, and I am tired, I don't want the swap I scheduled. I want the punch. I want *Obsidian*. I pay the two dollars to undo the plan.

  So, am I losing money because my tastes are circular? Or because my tastes drift with the sun?

  Sarah from Accounting leans against the fridge, watching me stare at the bags. She is a woman of latches and protocols. She slides a small padlock across the counter.

  "Stop choosing," she says. "Put the beans in a box. Give me the key. Set a rule: no swaps for thirty days."

  This is her escape: bind the hands so the mind doesn't have to.

  "It works," I tell her, turning the cold metal in my palm. "If I can't open the cabinet, I can't pay the dollar."

  "It saves the cash," she corrects. "But look at you."

  I look at my reflection in the microwave door. I am holding *Obsidian*. I am locked out of *Meridian*. The urge to trade hasn't vanished; it has just been blocked. I am standing still, but internally I am vibrating. The lock prevents the loss, but it treats the symptom, not the disease. If my preference for *Meridian* is genuine in this moment, the lock is a cage, not a cure. It assumes I am a slave to impulse, when perhaps I am just a slave to a circular desire. If I truly prefer the cycle, locking me in *Obsidian* makes me miserable, even if it makes me rich. Sarah's solution works for the wallet, but it fails to explain why the *want* exists. It assumes the want is a mistake, rather than a fact.

  Marcus from Legal sits at the small table, stirring tea. He doesn't believe in locks. He believes in the sanctity of the signature.

  "Monday-You was clear," Marcus says. "Monday-You knew Friday-You would be weak. Monday-You made the rational plan. The error isn't that your tastes change. The error is that Friday-You disrespects Monday-You."

  His escape is resolute choice. Honor the past self. Ignore the present pull.

  "I tried that," I say. "Last week. I decided on Tuesday that I wouldn't swap on Thursday. When Thursday came, the *Meridian* looked muddy. The *Obsidian* looked like clarity. Honoring the plan felt like forcing myself to eat something I didn't want."

  "Discipline feels like force," Marcus says. "That doesn't mean it's wrong."

  "But what if Monday-You was wrong?" I ask. "What if the value of the coffee actually changes? If I'm tired, *Meridian* is objectively better for my stomach. If I honor the plan to drink *Obsidian*, I'm not being virtuous. I'm being stubborn. I'm prioritizing a dead preference over a live one."

  Marcus sips his tea. "Then you have no self. Just a series of strangers passing a wallet."

  His solution works if the preference is stable and I am merely weak. It fails if the preference is genuinely fluid. If the value of the coffee shifts with the time of day, then "honoring the plan" is just obeying a ghost. It saves my consistency, but it might cost me the enjoyment of the coffee.

  I pick up the *Obsidian* bag. It feels heavy. I have two dollars in my hand. I have the key Sarah gave me in my left pocket. I have the vow I made to Marcus in my head.

  The cycle is waiting. If I trade *Obsidian* for *Meridian* now, I pay two dollars.
  Why am I doing it?

  Is it because *Obsidian* < *Meridian* in the grand hierarchy of my taste? If so, the circle is the killer. I will eventually trade *Meridian* for *Aurora*, and *Aurora* for *Obsidian*, and bleed out again. Sarah's lock would have saved me, because the desire is a trap.

  Or is it because *Obsidian* < *Meridian* only *right now*, at 2:00 PM on a Thursday? If so, the clock is the killer. If I had waited until Monday, I would have preferred *Obsidian*. Marcus's vow would have saved me, because the desire was a temporary glitch.

  I look at the lock. It promises safety by removing the choice.
  I look at Marcus. He promises integrity by enforcing the choice.

  I put the key back in my pocket. I put the two dollars on the counter. I reach for the *Meridian* bag.

  As my fingers touch the foil, I cannot tell if I am succumbing to a flaw in my character that needs a lock, or a flaw in my timing that needs a vow. I only know that the trade feels necessary, and the money feels gone, and I am left holding the bag, unsure if I am the victim of my own hunger or my own hand.
