  4.  **Refining the Tone:**
      *   The applicant is a *retired neuroscientist*. The voice should be authoritative on the clinical side but humble/respectful on the philosophical method side. It needs to sound like someone who knows the brain but is learning the rules of philosophical argumentation.
      *   Avoid jargon overload, but use precise philosophical terms (constitution, phenomenology, agency).
