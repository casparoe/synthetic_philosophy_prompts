answer: |-
  **Project Title:** Control, Constitution, and the Clinical Subject: Re-evaluating the Boundaries of the Extended Mind

  **Project Summary**
  The Extended Mind Thesis (EMT) posits that cognitive processes are not confined to the skull but can extend into the environment when external resources are functionally integrated with the agent. Decades of debate have focused on the "coupling-constitution" objection: does mere interaction constitute a system, or is a tighter functional isomorphism required? This project argues that this debate rests on a tacit, unexamined presumption: that the extended resource is owned, controlled, and automatically endorsed by the subject. My thirty years in systems neuroscience and clinical neurology suggest this presumption fails in high-stakes medical contexts. Technologies like deep brain stimulators (DBS) or cochlear implants are anatomically internal yet often controlled by clinicians or opaque algorithms. Patients frequently report these devices as alien forces rather than parts of the self. This fellowship will support a conceptual analysis of where the cognitive boundary lies when functional integration diverges from agent control and felt ownership.

  **Intellectual Context and Research Question**
  Standard EMT arguments utilize examples like notebooks or smartphones—tools the agent retrieves, trusts, and directs. The criteria for inclusion typically involve reliability, accessibility, and automatic endorsement. However, clinical neurotechnology violates these conditions. A DBS device may regulate mood or impulse control via parameters set by a third party (the clinician) or a closed-loop algorithm the patient cannot inspect. Here, functional integration is high, but agent control is low, and phenomenological ownership is unstable.

  Existing literature treats the coupling-constitution dispute as a matter of *location* and *functional role*. This project shifts the axis to *agency* and *authority*. The central question is: When a cognitive resource is functionally integrated but not under the person's control, should the boundary of the cognitive system be drawn by (1) functional integration, (2) the agent's control over the resource, or (3) the agent's felt sense of ownership?

  This is not merely the coupling-constitution dispute in new clothes. The traditional objection asks whether interaction is sufficient for membership in the cognitive system. My question accepts functional integration as a given but asks *whose* system it is. If an algorithm adjusts my neural gain without my consent, is that algorithm part of *my* mind, or is it a separate agent manipulating my system? The clinical cases do not just test the permeability of the boundary; they test the sovereignty of the subject presumed by the theory.

  **Methodology**
  The method is strictly conceptual, not empirical. I will not collect new clinical data but will assemble a graded series of case studies drawn from established neuroscientific and neuroethical literature, ranging from the ordinary to the pathological.
  1.  **Ordinary Extension:** Notebook, smartphone, employer-owned predictive text interface.
  2.  **Sensory Prosthetics:** Cochlear implants, retinal prostheses (high integration, variable control).
  3.  **Neuromodulation:** Deep brain stimulation, vagus nerve stimulation (internal, externally tunable, phenomenologically ambiguous).
  4.  **Algorithmic Mediation:** Closed-loop systems where the device adapts to the brain without user insight.

  For each case, I will derive predictions based on the three competing criteria (Integration, Control, Ownership). I will isolate the points of divergence—cases where the criteria yield contradictory verdicts on whether the resource is part of the mind. The core argument will evaluate which criterion earns its keep when pressed by these counterexamples. Does "Control" track cognitive boundaries better than "Integration," even when integration is seamless? Or must we accept that the "mind" can include hostile or alien subsystems?

  **Work Plan (12 Months)**
  *   **Months 1–3: Taxonomy and Literature.** Systematic mapping of the EMT literature regarding agency and ownership. Concurrently, cataloging clinical case reports regarding DBS and prosthetics to establish the phenomenological data set.
  *   **Months 4–6: Case Construction.** Drafting the graded series of cases. Formalizing the three criteria to ensure they are mutually exclusive in the test scenarios. Identifying the specific "divergence points" where the criteria conflict.
  *   **Months 7–9: Argumentation.** Drafting the core philosophical argument. Testing the "Control" and "Ownership" criteria against standard objections (e.g., that they are too internalist). Refining the distinction between "cognitive system" and "moral agent."
  *   **Months 10–12: Synthesis and Dissemination.** Completing the manuscript (target: a monograph-length work or two major articles). Presenting findings at institute workshops. Revising based on interdisciplinary feedback.

  **Deliverables and Success Conditions**
  The primary deliverable is a manuscript suitable for publication as a specialized monograph or a series of articles in philosophy of mind and neuroethics journals. A secondary deliverable is a conceptual framework for evaluating future neurotechnologies.

  **Criteria for Failure:**
  1.  **Convergence:** If analysis reveals that Integration, Control, and Ownership converge across all clinically relevant cases, the project fails to identify a genuine theoretical gap.
  2.  **Redundancy:** If the clinical material proves to be merely illustrative of conclusions already reachable via standard thought experiments (e.g., the "Otto" case), the clinical expertise adds no value.
  3.  **Verbal Dispute:** If the divergence among criteria dissolves into a mere semantic disagreement about the definition of "mind" without substantive implications for theory or practice.

  **Scope and Limitations**
  To ensure completion within one year, I will strictly fence off three tempting extensions:
  1.  **Moral Responsibility:** While control is relevant to blame, I will not attempt to solve the problem of moral responsibility for actions influenced by external devices. I will focus solely on the *metaphysical* boundary of the cognitive system.
  2.  **Personal Identity:** I will not address whether these technologies alter the numerical identity of the person over time, only the spatial/functional boundaries of their cognitive processing in the present.
  3.  **Group Cognition:** While clinician-patient-device triads suggest distributed cognition, I will restrict analysis to the boundary of the *individual* patient's mind to avoid the complexities of collective intentionality.

  **Significance**
  As neurotechnology moves from restoration to enhancement, and from open-loop to closed-loop autonomy, the assumption of the sovereign cognitive subject is becoming empirically untenable. This project leverages clinical reality to stress-test philosophical theory. It aims to produce a more robust account of the extended mind—one that can accommodate a world where the tools we think with may not belong to us.
