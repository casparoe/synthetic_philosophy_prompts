      *(Self-Correction during drafting)*: I need to make sure I don't sound *too* much like a philosopher. The applicant says they read philosophy with "more appetite than method." The proposal should reflect a scientist's rigor applied to conceptual problems. It should emphasize the *clinical material* as the stress test for the theory.
      *Also, check the length.* A standard academic page is roughly 500 words (double spaced) or 600-700 (single). Two pages single-spaced is about 1000-1200 words. I will aim for that density.

  7.  **Final Review against constraints:**
      *   No citations? Check.
      *   Month-by-month? Check.
