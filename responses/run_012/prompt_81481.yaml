answer: |-
  The post captures the high-level vibe of UDT but fails catastrophically on specific problem classifications, making it technically unreliable despite sounding confident.

  | claim | verdict | what's actually true | fallout |
  | :--- | :--- | :--- | :--- |
  | **Core definition:** Choose policies (functions from situations to actions) maximizing expected utility from the prior. | **accurate** | This is the correct standard definition of UDT 1.0. | None; this is the only solid foundation in the post. |
  | **Newcomb:** UDT one-boxes because the policy correlates with the predictor in the prior. | **accurate** | UDT one-boxes; the correlation is logical/acausal, baked into the prior evaluation. | None. |
  | **Smoking Lesion:** UDT says don't smoke (same as EDT) because smoking correlates with the lesion. | **false** | UDT **smokes** in the standard Smoking Lesion problem; it only treats correlations as relevant if they arise from logical dependence, not common physical causes. | Deletes the distinction between UDT and EDT; you will think UDT fails where it actually succeeds. |
  | **Counterfactual Mugging:** UDT pays because it precommits from the prior perspective. | **accurate** | UDT pays the mugger to maximize expected utility across both coin flip outcomes in the prior. | None. |
  | **Formal Setup:** Requires a Solomonoff prior over environments containing copies of your code. | **oversimplified** | UDT requires *a* prior, not specifically Solomonoff; the key is logical correlation, not the specific prior distribution. | Minor; suggests UDT is more tied to AIXI/Solomonoff than it actually is. |
  | **Weaknesses:** Uncomputable and lacks account of logical uncertainty. | **accurate** | Classic UDT 1.0 indeed struggles with logical uncertainty (e.g., math problems) and computability. | None; this is a fair criticism of the original formulation. |
  | **Bandit Example:** UDT picks "always pull left" and never learns because the policy is fixed in advance. | **false** | A UDT policy maps **observations** to actions; the optimal policy is "pull, observe, then pick the best arm," which UDT selects from the prior. | **Major;** this is a strawman that implies UDT agents are blind to new information, which is untrue. |
  | **Blackmail:** UDT says you should pay the blackmailer. | **false** | UDT is specifically designed **not** to pay logical blackmailers (by having the disposition "never pay" in the prior) to prevent the threat arising. | Misleads you into thinking UDT is exploitable where it is actually robust. |
  | **OMISSION:** How policies condition on observations internally. | **N/A** | UDT agents *do* update their actions based on observations, they just don't update their *decision rule* based on them; the rule already accounts for all possible observations. | **Critical;** without this, the Bandit critique seems plausible and the "updateless" label seems to mean "ignorant." |

  *   **UDT vs. EDT Confusion:** A newcomer will believe UDT is just "EDT but slower" because of the Smoking Lesion error, missing that UDT solves the very problems (like Smoking Lesion) that break EDT.
  *   **Learning vs. Precommitment:** The Bandit example will convince them that "updateless" means "ignoring data," whereas UDT actually hardcodes the optimal learning algorithm into its policy before starting.
  *   **Exploitability:** They will think UDT is vulnerable to blackmail and stupid bandit strategies, when these are actually cases where UDT is supposed to outperform CDT and EDT.
