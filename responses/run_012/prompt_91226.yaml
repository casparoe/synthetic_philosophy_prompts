answer: |-
  Verdict
  You should abandon premise (2). The argument is valid but unsound; this premise conflates internal warrant with relativistic immunity. Putnam denies that warrant is merely social licensing within a closed system. Rejecting a 'God's Eye view', he maintains rational acceptability is objective, not merely conventional. Premise (2) suggests any coherent practice generates its own truth, rendering critique impossible. Putnam's internal realism requires practices answerable to experience and reason, not just internal rules. By rejecting (2), you block the slide into the equivalence of religion and superstition found in (4) and (5). This preserves religious rationality distinct from empirical hypothesis, avoiding fideism.

  Why it looked plausible
  Indeed, the attraction of premise (2) lies in a seductive reading of Wittgensteinian 'forms of life'. If meaning is use, governed by community rules, warrant seems constituted by adherence to those rules. Once one accepts the collapse of the fact/value dichotomy, the temptation is to locate all normativity within specific cultural practices. Without a transcendent standpoint, critique appears to require an external Archimedean point which Putnam forbids. Consequently, it seems that if one cannot step outside a practice, one cannot judge it from without. This mirrors Peter Winch's controversial interpretation of social science, where every society constitutes its own reality. It feels like a consistent application of anti-foundationalism: if there are no brute facts to anchor us, we are adrift in our languages. Thus, equating warrant with internal licensing seems the only way to respect the integrity of different worldviews without imposing one's own values illegitimately. It appeals to the liberal fear of cultural imperialism. To judge another practice seems arrogant if no neutral ground exists. Premise (2) offers a tidy solution: stay in your lane. It simplifies the messy reality of cross-cultural critique into a matter of jurisdiction. This makes the step easy to slide past because it masquerades as tolerance. It assumes that because we lack a metaphysical vantage point, we lack any critical leverage. It creates a false dilemma between absolutism and relativism. Thus, the step is seductive.

  What it costs
  Rejecting (2) demands a nuanced account of how practices interact. One must pay the price of admitting that 'internal' does not mean 'isolated'. Putnam's solution involves a broader conception of rationality, often drawing on Peircean idealisation. Warrant is not just local licensing; it is rational acceptability under ideal epistemic conditions. This requires acknowledging that some values—coherence, simplicity, instrumental efficacy, human flourishing—are not merely local preferences but constitutive of rationality itself. The cost is the risk of appearing to smuggle in the metaphysical realism Putnam sought to escape. One must argue that these values are objective yet human-scale, avoiding both relativism and absolutism. Furthermore, one must distinguish between a narrow practice (divination) and the wider human form of life. Divination fails not because it breaks internal rules, but because it cannot sustain reflective equilibrium with our broader web of beliefs and experiences. This invites the charge of ethnocentrism: whose web of beliefs counts? Putnam answers that it is ours, but ours improved through dialogue. The alternative—accepting (4) and (5)—is costlier. It forces a choice between scientism (religion as bad science) or fideism (reason has no purchase on faith). Both destroy Putnam's project of renewing philosophy to accommodate religious depth without superstition. Maintaining Putnam's commitments requires believing that reason can critique forms of life without standing outside humanity. We must accept that while no practice is immune to critique, not all critiques are equal. The payment is a robust, fallibilistic objectivity that relies on human solidarity rather than metaphysical grounding. It requires trusting that our evolving standards of reason are not merely contingent tricks of biology or culture, but genuine tracks towards truth. This is a heavy metaphysical commitment to make while claiming to reject metaphysics, yet it is the only path that keeps religion rational without making it empirical.

  Residual worries
  Despite this diagnosis, tension remains. Finally, if warrant relies on 'human flourishing' or 'ideal conditions', are these not themselves value-laden concepts subject to the very collapse described in (1)? How do we persuade the diviner without begging the question? If our standards are ours, have we truly escaped relativism, or merely expanded the reference group? The diagnosis leaves unsettled the precise mechanism by which one practice is deemed objectively superior to another without invoking a transcendent standard. We are left with a normative naturalism that feels stable but lacks a sharp criterion for distinguishing progress from mere change. The worry persists that Putnam's objective validity is too thin to bear the weight of religious truth claims against superstition.
