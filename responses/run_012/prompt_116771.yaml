      *   *Jaynes' Solution:* E.T. Jaynes addressed this using the principle of *maximum entropy* combined with symmetry arguments (translation, rotation, scaling invariance). He derived the 1/2 solution. This is often cited as the "objective Bayesian" solution. But is it universally accepted? No.
