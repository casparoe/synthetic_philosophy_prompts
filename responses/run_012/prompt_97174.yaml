prompt: |-
  I'm a software engineer with no formal training in philosophy, and I've been reading Kant's essay on perpetual peace — specifically the second appendix, on how politics can accord with morals under what he calls the transcendental conception of public right. I understand most of the essay well enough, but this appendix loses me, and I'd like a careful explanation of one passage. Here it is as it appears in the translation I'm working from:

  "We may think of Public Right in a formal way after abstracting from all the matters to which it is applied in detail, such as the different relations of men in the State, or of the States to each other, as presented in experience; and this is the way in which jurists usually think of it. But apart from the matter of public right, there remains only the form of publicity, the possibility of which is implied in every expression of right; for without such publicity there would be no justice, this being thinkable only as what is publicly declarable, and hence without this publicity there would be no right, as right is only administered or distributed by it.

  This character of publicity must belong to every mode of right; and, as it can easily be judged whether it accompanies any particular case, and whether it can therefore be combined with the principles of an agent, it furnishes a criterion, which is at once presented a priori in reason and which it is easy to use in experience. Where it cannot be combined with the principles of an agent, the falsity and wrongness of a pretended right can thus be immediately recognised, as if by an experiment of the pure reason.

  Abstraction being thus made from everything empirical that is contained in the conceptions of national and international right, (such as the evil disposition of human nature which makes coercion necessary) the following proposition arises, and it may be called the transcendental formula of Public Right.

  'All actions relating to the rights of other men are wrong, if their maxim is not compatible with publicity.'

  This principle is not to be regarded merely as ethical, and as belonging only to the doctrine of virtue, but it is also to be regarded as juridical and as pertaining to the rights of men. For a maxim cannot be a right maxim which is such that I cannot allow it to be published without thereby at the same time frustrating my own intention, which would necessarily have to be kept entirely secret in order that it might succeed, and which I could not publicly confess to be mine without inevitably arousing thereby the resistance of all men against my purpose."

  My difficulty is not with the vocabulary so much as with what kind of claim is being made, and I suspect the trouble is that I'm reading the word "transcendental" the way an engineer would read "fundamental" or "first-principles," which may be wrong. Concretely, here is what I can't get straight:

  First, the test as stated seems to be about whether publishing my maxim would defeat my own purpose — that is, whether secrecy is instrumentally necessary to my success. That looks like a test of prudence or self-consistency, not of morality or of rights. Yet Kant explicitly says the principle is juridical and not merely ethical, and that the resistance of all men arises from "the injustice which such a maxim threatens to everyone." Can you explain how a test that runs through the agent's own frustration of his own intention is supposed to establish anything about wrongness to others? Is the self-defeat doing the work, or is it a symptom of something else that is really doing the work?

  Second, I notice the formula is stated only negatively — it tells us which actions are wrong, and Kant even calls it "a merely negative maxim" in the surrounding text. Does that mean it can never certify that an action is right, only expose pretenses of right? If so, in what sense is it a criterion of public right rather than just a way of debunking bad claims?

  Third, the illustration that follows in the same appendix is about whether a people may rightfully revolt against a tyrant. Kant grants that the people's rights have been violated and that no wrong would be done to the tyrant by his dethronement, but he still holds that it is wrong for the subjects to pursue their rights that way, because their maxim could not be publicly professed without making its own purpose impossible, whereas the sovereign's maxim of punishing rebellion can be published without any such difficulty. That seems to show the test tracking something like the stability of a constitution rather than the justice of a cause. Am I right that the test is asymmetric here in a way that undercuts its claim to be a criterion of right, or is there a reading on which the asymmetry is exactly what the criterion is supposed to reveal?

  I'd like the explanation to do the following, in this order: (1) state in plain language what work the word "transcendental" is doing in this context, distinguishing it from the more familiar Kantian uses I might have picked up secondhand; (2) reconstruct the argument of the passage step by step, identifying at each step which premise is doing the load-bearing work; (3) say clearly whether the publicity test is best understood as a test of universalizability, of prudence, of the nature of right, or of something else, and defend that reading against at least one rival reading; (4) address the three specific worries I raise above; and (5) tell me honestly which parts of the passage remain genuinely contested among interpreters, so that I don't mistake a live dispute for my own failure to understand. Where you find that a claim in the passage is ambiguous, please flag the ambiguity rather than smoothing it over — I'd rather know that the text is underdetermined than get a tidy reconstruction that quietly resolves it. I don't need citations or a reading list; I'll look those up myself once I know what I'm looking for.
