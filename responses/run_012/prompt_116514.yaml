prompt: |-
  I'm in a philosophy of mind reading group — we're mostly grad students from other fields so the discussions are pretty loose — and last week we worked through the causal exclusion argument. The way our discussion leader set it up, it went roughly: mental properties supervene on physical properties; the physical causes of our behavior are already sufficient for those effects; an effect isn't overdetermined by two independent causes; therefore mental properties never cause anything. I think I followed the steps, but I came away with a worry I can't shake. It seems like the argument *proves* epiphenomenalism — that our beliefs and desires are just along for the ride — and epiphenomenalism, the way I understand it, is a kind of dualism, because it says the mental is real but does no work. But if that's right, then the argument seems to refute physicalism itself, since physicalism is supposed to be the view that mental states just *are* physical states and that everything that happens is fixed by the physical. So I feel boxed into a choice: either physicalism is false, or mental causation is real and the argument is just wrong. Which one am I supposed to give up?

  A friend in the group tried to rescue it by saying the mental and the physical are the same event picked out two different ways, so nothing actually competes and nothing gets excluded — but I couldn't tell whether that answers the argument or just changes the subject. Could you, as someone who really knows this literature, slow down with me here? Think carefully and start by brainstorming the moves that are actually on the table, then tell me what the exclusion argument really establishes and exactly where my framing above goes wrong — I have a sneaking suspicion the question I'm asking is itself confused, and if so I'd rather you say so than play along. Please also be honest about the limits of your own reading: point to the step in your reasoning that's shakiest, and tell me what argument or consideration would actually change your mind about the correct diagnosis. And end the whole thing with a final line beginning "Verdict:" followed by a short phrase naming the main mistake in my setup. (Sorry for the length — and for any typos, I'm typing this on my phone between classes.)
