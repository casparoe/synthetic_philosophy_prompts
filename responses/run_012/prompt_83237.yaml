answer: |-
  It is a pleasure to meet a colleague from the hard sciences who is willing to wade into the metaphysical swamp. You have the right instinct: popular philosophy books often smooth over the jagged edges of live debates to make a narrative arc. In causation, the jagged edges are where the actual work happens.

  Here is the sentence-by-sentence autopsy of that passage, followed by your specific questions from the bench.

  ### The Sentence-by-Sentence Breakdown

  **1. "Philosophers used to insist that a cause had to be an event — something that happened."**
  *   **Verdict:** **Nod, with a caveat.**
  *   **The Detail:** This is historically accurate. The Humean tradition and later "process theories" of causation insist that causation involves a transfer of energy or a physical connection between events. An "absence" cannot transfer energy. However, saying "used to" implies this view is dead. It isn't. Many metaphysicians still hold that absences are not the right *kind* of thing to be causes.

  **2. "Then came the counterfactual theory: X causes Y just when, had X not occurred, Y would not have occurred."**
  *   **Verdict:** **Nod.**
  *   **The Detail:** This is the standard David Lewis-style definition. It is the dominant framework in analytic philosophy for the last 40 years. It is accurate as a definition of that specific theory.

  **3. "Once you have that, omissions drop neatly into place."**
  *   **Verdict:** **Wince.**
  *   **The Detail:** "Neatly" is the journalist selling you a bill of goods. Counterfactual theory *allows* omissions to be causes, but it does so at a terrible cost (which the next sentences admit). It solves the omission problem by blowing up the concept of causation elsewhere. It's not a neat solution; it's a brute-force one.

  **4. "The doctor's failure to treat caused the death, because had she treated, the patient would have lived."**
  *   **Verdict:** **Nod.**
  *   **The Detail:** This is the canonical example. Counterfactually, it holds up. If the doctor acts, the patient lives. Therefore, the inaction is a cause. No philosopher disputes the counterfactual dependence here; they dispute whether that dependence equals *causation*.

  **5. "So omission causation is just ordinary causation after all, and counterfactual dependence is what proves it."**
  *   **Verdict:** **Taking Sides.**
  *   **The Detail:** This is the core ideological claim of the passage. It asserts that there is no metaphysical difference between a bullet hitting a heart and a doctor *not* injecting a drug. Many philosophers (particularly those who favor "process" or "mechanistic" views) vehemently disagree. They argue omissions are a distinct, second-class kind of causation, or not causation at all, but merely "explanatory relevance." The journalist is presenting the Counterfactualist view as the settled truth. It is not.

  **6. "The theory's one embarrassment is that it makes far too many things causes — the gardener who didn't water the plant is as much the cause of its death as the neighbour who never even knew the plant existed..."**
  *   **Verdict:** **Nod.**
  *   **The Detail:** This is known as the problem of "profligate causes." If causation is just counterfactual dependence, then *everyone* who failed to water the plant is a cause. The Queen of England failing to water it is a cause. This is intuitively absurd.

  **7. "...but that's a general problem with counterfactual theories, not a problem about omissions in particular."**
  *   **Verdict:** **Wince / Minimizing.**
  *   **The Detail:** This is where the journalist is quietly defending the theory. Most philosophers working on omission think this problem is *specifically* worse for omissions. Positive events are limited; negative events (things that didn't happen) are infinite. The "profligacy" is the main reason many philosophers reject the counterfactual account of omissions.

  **8. "And since the account is purely counterfactual, whether a failure counts as a cause has nothing to do with whether anyone was expecting you to act."**
  *   **Verdict:** **Nod (Metaphysically), Wince (Pragmatically).**
  *   **The Detail:** This is the "separability thesis." It claims causation is a mind-independent feature of the world, while duty/expectation is mind-dependent. Counterfactualists insist on this. However, a growing camp (pragmatists and interventionists) argues that causation is *inherently* tied to what an agent could intervene on. They argue you can't separate the "cause" from the "context of expectation."

  **9. "Duty, blame and expectation are seperate questions that come in later."**
  *   **Verdict:** **Taking Sides.**
  *   **The Detail:** This is the crucial pivot. The journalist is telling you that *causation* is objective, but *responsibility* is normative. Many legal theorists and philosophers argue that in the case of omissions, causation and duty are entangled. You cannot identify the cause (the omission) without first identifying the duty (who was supposed to act?).

  **10. "Which is why the law treats the doctor who withholds treatment and the doctor who injects poison as equally the cause of death."**
  *   **Verdict:** **Wrong / Misleading.**
  *   **The Detail:** This is the most dangerous sentence in the passage. In terms of "but-for" causation (factual cause), the law might agree. But in terms of *legal liability*, the law famously distinguishes between acts and omissions. A doctor who injects poison commits murder. A doctor who withholds treatment at the request of a patient (or family) may commit no crime at all. The law does *not* treat them as equally the cause for the purposes of justice, even if the counterfactual dependence is identical. The journalist is conflating "cause-in-fact" with "proximate cause" and liability.

  ### Does the closing claim follow?

  **No.** The claim that responsibility tracks causation directly is the very thing being fought over.

  If you accept the Counterfactual Theory, you must accept that the Queen of England caused the plant's death. Since we do not hold the Queen responsible, we must admit that **responsibility does not track causation** in this framework. The journalist tries to have it both ways: he says the Queen is a cause (metaphysics) but implies only the gardener is responsible (law).

  If the law treats the poisoning doctor and the withholding doctor differently, it proves that **causation is not the only ingredient in responsibility.** The journalist implies the law treats them the same *because* the causation is the same. In reality, the law often treats them differently *despite* the causation being the same. This suggests that for the law, "cause" is not a purely counterfactual notion; it is a normative one.

  ### Is this a fight over words, or something substantive?

  It is **substantive**. It is not just a verbal dispute about how to use the word "cause."

  1.  **Ontology:** Are absences "real things"? If I say "the lack of oxygen killed him," is "the lack of oxygen" an entity in the universe? Counterfactualists say we don't need it to be an entity; we just need the truth of the conditional. Process theorists say if it's not a physical event, it's not a cause. This changes how you view the structure of reality.
  2.  **Explanation:** In science, we want to know what to manipulate. If "everything that didn't prevent the crash" is a cause, the concept loses its utility for explanation. The fight is about what makes a good *explanation*, not just a true sentence.
  3.  **Ethics:** If omissions are causes in the exact same way actions are, the moral distinction between "killing" and "letting die" collapses. This has massive implications for bioethics (e.g., withdrawing life support). The fight is about whether morality rests on physical causation or on duties.

  ### From the Bench: Knockouts vs. Omissions

  You asked: *Is 'I removed it and the system changed' the same kind of thing as 'I did nothing and the system changed'?*

  **Philosophers and Lawyers care deeply about this distinction.**

  *   **Your Knockout:** When you knocked out a gene, you performed an **event**. You introduced CRISPR, or you bred heterozygotes, or you applied a chemical inhibitor. There was energy transfer. There was a physical intervention. Even though the *result* was an absence (no protein), the *cause* was a presence (the editing machinery). In philosophical terms, this is usually treated as **positive causation** leading to a state of absence.
  *   **The Doctor's Omission:** When the doctor fails to inject, there is no physical event of "not-injecting." There is just the doctor drinking coffee while the patient dies. There is no energy transfer from the doctor to the patient.

  **Why it matters:**
  In the lab, you control the background. You decide what the "wild type" is. In the real world, the "background" is chaotic.
  If you say, "The knockout caused the phenotype," you are implicitly saying, "Compared to the wild type control..."
  If you say, "The doctor's inaction caused the death," you are implicitly saying, "Compared to a world where doctors have a duty to act..."

  Your work relies on **intervention**. You changed the system. The doctor (in the omission case) did not change the system; she allowed the system to run its course. Philosophers call this the distinction between **intervention** and **allowance**. To a biochemist, the result is the same (the pathway is broken). To a metaphysician, the mechanism is fundamentally different (breaking a pipe vs. not fixing a leak).

  ### A Note on "Negative Causation"

  You asked: *Is 'negative causation' the same topic under another name?*

  It is a sibling, not a twin.

  1.  **Causation by Omission:** Failing to do something that would have prevented an effect. (Not watering the plant).
  2.  **Prevention (Negative Causation):** Doing something that stops a cause from producing an effect. (You block the receptor, so the ligand cannot bind).

  In your work, you likely did a lot of **Prevention**. You put a blocker in the pathway. That is a physical event (the blocker binding).
  **Omission** is when you *fail* to add the ligand.

  However, the literature sometimes lumps them together as "Negative Causation" because both involve an effect *not* happening, or an absence being the explanatory factor. But strictly speaking:
  *   **Prevention** = Event causes non-event. (Generally accepted as real causation).
  *   **Omission** = Non-event causes event. (The controversial one).

  ### Summary for the Retired Biochemist

  The journalist has sold you a **Counterfactualist** view as if it were the consensus. It is the dominant view, but it is not the undisputed truth.

  *   **Where he is right:** Counterfactual dependence is a necessary condition for causation in most cases, including omissions.
  *   **Where he is wrong:** He claims the law treats acts and omissions equally regarding causation/liability. It does not. He claims the "profligacy problem" is minor. It is the main reason people reject the theory.
  *   **The Substantive Stake:** If you accept his view, you accept that the universe is full of infinite invisible causes (everything that didn't happen). If you reject it, you have to explain how "nothing" can sometimes be a cause (the doctor) without making "nothing" always a cause (the Queen).

  Your intuition from the lab is actually closer to the **Interventionist** account of causation (popularized by James Woodward). Causation is about what happens when you *wiggle* a part of the system.
  *   When you knocked out the gene, you wiggled the system.
  *   When the doctor *didn't* treat, she didn't wiggle the system.

  The reason we call the doctor a cause is not because of physics, but because she was the **expected wiggler**. She was the one supposed to intervene. That makes causation by omission partly a matter of social expectation, contrary to what the journalist claims. You were right to distrust your instincts; the journalist is asking you to separate metaphysics from practice, but in the case of omissions, they are glued together.
