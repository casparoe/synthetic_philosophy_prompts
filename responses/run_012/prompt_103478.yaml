answer: |-
  ### Brainstorming: Concepts Near Your Distinction

  Here are the concepts that surface when I scan the literature on causation, modality, and historical explanation, along with how they map onto your two questions (Q1: *Could it have gone otherwise?* / Q2: *How much change is required to go otherwise?*).

  1.  **Alethic Contingency vs. Causal Sensitivity:**
      *   *Match:* "Alethic Contingency" addresses Q1 (metaphysical possibility). "Causal Sensitivity" addresses Q2 (stability/fragility).
      *   *Mismatch:* "Alethic" is technical jargon rarely used by historians; "Sensitivity" is often specific to chaos theory (SDIC) rather than general historical explanation.
  2.  **Ben-Menahem's "Two Concepts of Contingency":**
      *   *Match:* Yemima Ben-Menahem (*Historical Contingency*, 1997) explicitly argues that "contingency" conflates **sensitivity to initial conditions** (your Q2) with **chance/indeterminism** (your Q1).
      *   *Mismatch:* She focuses on defining "contingency" rather than naming the *pair* of distinct questions as a unified framework.
  3.  **Lewisian "Closeness" of Possible Worlds:**
      *   *Match:* David Lewis's semantics for counterfactuals separates the *truth* of a counterfactual (Q1: is there a world where ~O?) from the *similarity metric* (Q2: how many miracles/tweaks to get there?).
      *   *Mismatch:* This is a semantic tool for logic, not a standard label for historical taxonomy.
  4.  **Robustness vs. Fragility (Woodward/Lange):**
      *   *Match:* Directly addresses Q2 (how invariant is the outcome under intervention?).
      *   *Mismatch:* Assumes the causal model is fixed; doesn't explicitly separate the metaphysical possibility of the intervention itself (Q1).
  5.  **Path Dependence:**
      *   *Match:* Often implies Q2 (lock-in effects make alternatives hard to reach).
      *   *Mismatch:* Often conflates the two; a path-dependent process can be deterministic (Q1 = No) or stochastic (Q1 = Yes). It describes the *mechanism*, not the modal status.
  6.  **Overdetermination:**
      *   *Match:* Describes a state where multiple causes suffice for an outcome (high robustness, Q2).
      *   *Mismatch:* Doesn't address whether the causes themselves were contingent or necessary (Q1).

  ***

  ### The Considered Answer

  You have correctly identified a genuine ambiguity that plagues the philosophy of history, though there is no single, canonical Greek-derived label for the distinction itself (like "The *X* Distinction"). However, the distinction is well-drawn in specialized literature, most notably by **Yemima Ben-Menahem**.

  The most precise way to carve this, drawing on Ben-Menahem, David Lewis, and the interventionist tradition (James Woodward), is to separate **Modal Openness** from **Causal Stability**.

  #### 1. The Established Distinction
  Ben-Menahem identifies exactly the slippage you describe. She argues that historians use "contingent" to mean two incompatible things:
  *   **Contingency as Openness (Your Q1):** The outcome was not necessitated by prior laws/states. There was genuine branching (indeterminism or agency).
  *   **Contingency as Sensitivity (Your Q2):** The outcome depends on specific, narrow conditions. A small change in antecedents yields a different result (fragility).

  Conversely, "Inevitable" is used to mean either:
  *   **Metaphysical Necessity:** It *could not* have been otherwise (Determinism/Fatalism).
  *   **Causal Robustness:** It *would not* have been otherwise under any *plausible* or *small* variation (Overdetermination/Stability).

  There is no single standard name for the *pair* of questions other than **"The Ambiguity of Contingency."** However, if you need terms to label the axes for your own work, the philosophical standard would be:
  1.  **Modal Status** (Necessary vs. Contingent/Open).
  2.  **Counterfactual Depth** or **Causal Stability** (Fragile vs. Robust).

  #### 2. How This Differs from Nearest Concepts
  You asked to distinguish this from specific neighbors. Here is the boundary work:

  *   **Vs. Sensitive Dependence on Initial Conditions (SDIC):** SDIC is a *subset* of your Q2. It describes a specific mathematical mechanism (chaos) where fragility is extreme. Your Q2 is broader: it includes structural robustness (e.g., industrial attrition) which is the *opposite* of SDIC. SDIC explains *why* something is fragile; your Q2 asks *whether* it is fragile.
  *   **Vs. Path Dependence:** Path dependence describes a temporal mechanism where history "locks in." It implies high Q2 (robustness against reversal) *after* a certain point, but it is silent on Q1. A path-dependent process can be fully deterministic (Q1 = No) or stochastic (Q1 = Yes). Path dependence is a causal story; your distinction is modal/causal taxonomy.
  *   **Vs. Robustness/Fragility of a Causal Claim:** In philosophy of science (Woodward), this usually refers to whether a *generalization* holds across backgrounds. You are applying it to a *particular event*. The logic is the same (invariance under intervention), but the target is singular.
  *   **Vs. Necessity/Contingency (Standard Modal Logic):** Standard modal logic only addresses Q1 (Is ~O possible in some accessible world?). It ignores Q2 (How "far" is that world?). Your insight is that historians care about the *distance*, not just the *existence*, of the alternative world.

  #### 3. The Probability Confusion
  You suspect a third thing is folded in: **Probability**. You are correct.
  *   **Possibility (Q1):** Is the probability > 0?
  *   **Probability:** Is the probability > 0.5? (Or some threshold of "likely").
  *   **Stability (Q2):** How much does the probability shift given a perturbation?

  In the literature, this is sometimes called the distinction between **Propensity** (objective chance) and **Credence** (subjective likelihood), but in history, it is often simply the **Epistemic/Ontic Confusion**. Historians say "It was unlikely" (Epistemic/Probability) when they mean "It would have required a miracle to change" (Ontic/Stability).

  #### 4. Boundary Cases and the 2x2 Matrix
  To test the carving, we must look at the four logical combinations of your two questions. An adequate account must handle all four:

  | | **Q2: Fragile** (Small change alters outcome) | **Q2: Robust** (Large change needed to alter outcome) |
  | :--- | :--- | :--- |
  | **Q1: Open** (Could have gone otherwise) | **Pure Chance.** (e.g., A radioactive decay triggers a Geiger counter). *Contingent in both senses.* | **Constrained Agency.** (e.g., A war could have been avoided, but only by a total change of regime decades prior). *Contingent Q1, Inevitable Q2.* |
  | **Q1: Determined** (Could not have gone otherwise) | **Chaos.** (e.g., A deterministic weather system where a butterfly flaps wings). *Inevitable Q1, Contingent Q2.* | **Laplacean Inevitability.** (e.g., The sun rising tomorrow, given physics). *Inevitable in both senses.* |

  **Where the questions collapse:**
  The two questions collapse into one only if you assume **Determinism implies Robustness**. This is false (see Chaos/Butterfly Effect). Or if you assume **Indeterminism implies Fragility**. This is also false (see statistical regularities in quantum mechanics or large-scale demographics). The distinction holds because causal structure (Q2) is independent of modal status (Q1).

  **Cases outside your sketch:**
  You described "Fragility migrated upstream" (Case 1) and "Open but Robust" (Case 2). A third case exists: **Pre-emption.** An outcome is robust because if Cause A fails, Cause B steps in (Overdetermination). This is Q2-Robust, but Q1 can be either. This is the standard "multiple sufficient causes" scenario in causation literature.

  #### 5. Terminology Recommendation
  Since there is no single standard label for the *pair*, I recommend you adopt Ben-Menahem's framing but sharpen the terminology for clarity:
  *   Call Q1 **Alethic Contingency** (or Modal Openness).
  *   Call Q2 **Causal Sensitivity** (or Counterfactual Fragility).
  *   Call the conflation **The Equivocation of Inevitability**.

  If you must coin a term for the *relationship* between them, you might call it the **Modal-Stability Gap**. But be aware: citing Ben-Menahem (*Historical Contingency*, 1997, Ch. 1-2) gives you immediate philosophical cover for the distinction itself.

  ***

  ### Closing: The Corrective Question

  You have framed this as a search for a name for a pattern in language. But if I may challenge the framing:

  **Should you be asking for a name for the distinction at all, or should you be asking whether "inevitability" is a coherent concept in historical explanation once the distinction is drawn?**

  If "inevitability" always turns out to mean either "determined" (which historians can't know) or "robust" (which is a matter of degree), then the word itself may be doing no work other than rhetorically collapsing your two questions to shut down counterfactual inquiry. The single question you should have asked is: **"Does retaining the term 'inevitability' obscure more than it reveals about the causal structure of history?"**
