  # HANDOUT: The Representation Decision Tree
  **Seminar: Machine Learning & Meaning**  
  **Facilitator: [Your Name]**

  **Premise:** We agree the network is a fixed function (a pile of numbers). The training objective mentions nothing about truth, content, or cities. We disagree on whether a probe finding a "city" direction means the network *represents* cities.

  **Instructions:** Start at **Q1**. For each claim, mark **Agree** or **Disagree** based on your intuition about the case presented. Follow the arrows. Do not look at the leaf descriptions until you reach the end.

  ---

  ### The Branches

  **Q1. The Implementation Claim**  
  *Case (d): A lookup table produces the exact same input-output map as the network, but has no layers or geometry.*  
  **Claim:** The lookup table has the same representational status as the network.  
  → **Agree:** Go to **Q8** (Function Path)  
  → **Disagree:** Go to **Q2** (Structure Path)

  **Q2. The Probe Triviality Claim**  
  *Case (b): Probes recover random training labels as easily as semantic ones.*  
  **Claim:** This shows linear probes are arbitrary tools that impose structure rather than find it.  
  → **Agree:** Go to **Leaf 3** (Instrumentalist)  
  → **Disagree:** Go to **Q3**

  **Q3. The Convergence Claim**  
  *Case (a): Two different architectures find nearly the same "city" direction.*  
  **Claim:** This convergence is a property of the data distribution, not the network's internal agency.  
  → **Agree:** Go to **Leaf 4** (Relational)  
  → **Disagree:** Go to **Q4**

  **Q4. The Generalization Claim**  
  *Geo Rule: The "city" probe works on training data but fails on unseen distributions (new cities/syntax).*  
  **Claim:** A feature that fails to generalize was never a representation, only a fit.  
  → **Agree:** Go to **Leaf 4** (Relational)  
  → **Disagree:** Go to **Q5**

  **Q5. The Causal Claim**  
  *Case (c): Knocking out the "city" direction leaves accuracy unchanged.*  
  **Claim:** If removing a vector changes nothing, it is not part of the computational mechanism.  
  → **Agree:** Go to **Leaf 2** (Structuralist)  
  → **Disagree:** Go to **Q6**

  **Q6. The Aboutness Claim**  
  *Case (e): A thermometer tracks temperature.*  
  **Claim:** We can legitimately say the internal vector is *about* a city, not just correlated with it.  
  → **Agree:** Go to **Q7**  
  → **Disagree:** Go to **Leaf 2** (Structuralist)

  **Q7. The Stakes Claim**  
  *Debate: Two engineers agree on all weights and gradients but disagree on the word "representation."*  
  **Claim:** This disagreement changes how they debug or intervene on the system.  
  → **Agree:** Go to **Leaf 1** (Realist)  
  → **Disagree:** Go to **Leaf 7** (Deflationist)

  **Q8. The Teleology Claim**  
  *Case (e): A thermometer tracks temperature.*  
  **Claim:** Tracking correlation is enough for representation; selection history is not required.  
  → **Agree:** Go to **Leaf 5** (Eliminativist)*  
  → **Disagree:** Go to **Leaf 6** (Teleosemanticist)

  *(Note: If you Agreed to Q1 but think correlation is NOT enough for representation, you likely believe nothing represents anything. Follow "Disagree" to Leaf 6, then read the Leaf 5 note.)*

  ---

  ### The Leaves

  **Leaf 1: The Realist**  
  *Yes, probes find something really there.*  
  **Awkward Commitment:** You must explain why ablating a "real" representation (Case c) sometimes leaves the network's behavior completely unchanged.

  **Leaf 2: The Structuralist**  
  *There is real structure, but "content" or "aboutness" is the wrong word for it.*  
  **Awkward Commitment:** You must accept that the network encodes the world in a robust way, but forbid yourself from saying what it encodes.

  **Leaf 3: The Instrumentalist**  
  *The probes are our instruments; there's no fact of the matter, only what's useful to say.*  
  **Awkward Commitment:** You must accept that finding "city" is no more factual than finding "random label ID 4" (Case b), differing only in utility.

  **Leaf 4: The Relationalist**  
  *Yes, but only relative to a task we specify, so there are many equally real answers.*  
  **Awkward Commitment:** You must accept that the representation vanishes if you change the test distribution, even if the weights stay the same.

  **Leaf 5: The Eliminativist**  
  *No, and the whole vocabulary is a mistake; a function doesn't represent anything.*  
  **Awkward Commitment:** You must treat "meaning" as a folk category like "phlogiston," useful for conversation but absent from the physics.  
  *(Note: Reached via Q1 Agree + Q8 Agree. If you think correlation isn't enough, you land here anyway.)*

  **Leaf 6: The Teleosemanticist**  
  *Yes, and what fixes the content is what the feature got selected to do by training.*  
  **Awkward Commitment:** You must accept that a network with identical weights but a different training history represents different things.

  **Leaf 7: The Deflationist**  
  *It's a verbal dispute and nothing turns on it.*  
  **Awkward Commitment:** You must accept that thirty years of philosophy and five years of ML interpretability research have been arguing over dictionary definitions.

  ---

  ### Diagnostics & Warnings

  **Indistinguishable Leaves**  
  *   **Leaf 1 (Realist) and Leaf 7 (Deflationist):** The tree separates these on **Q7 (Stakes)**. In practice, these are hard to distinguish. If you believe the label changes engineering practice, you are a Realist. If you believe it only changes your paper's introduction, you are a Deflationist. Many people occupy both positions depending on the day.
  *   **Leaf 3 (Instrumentalist) and Leaf 4 (Relational):** Both deny a "single true" representation. The Instrumentalist blames the *probe* (Q2); the Relationalist blames the *task/data* (Q3/Q4). If you think both are to blame, you may bounce between these leaves.

  **Empty Answer Patterns**  
  *   **Q1 Disagree + Q2 Agree + Q3 Disagree:** *Diagnosis: Unattractive.* You claim geometry matters, but probes are trivial, yet convergence is network agency. This implies the network actively builds trivial structures.
  *   **Q1 Agree + Q8 Disagree + Leaf 5:** *Diagnosis: Incoherent.* You claim function is all, history matters, but nothing represents. If history matters, you are a Teleosemanticist (Leaf 6), not an Eliminativist.
  *   **Q4 Disagree + Q6 Disagree:** *Diagnosis: Unexplored.* You claim non-generalizing features are representations, but refuse to say they are *about* anything. This is a Structuralist position on overfit data, rarely defended.

  ---

  **Geophysicist's Note:** In my field, a model that worked only on the training wells was a "fit," not a "model." If you chose **Leaf 4**, you are honoring the Geo Rule. If you chose **Leaf 1**, you believe the wells don't matter as much as the rock. Neither of us knows if the other is right until we drill.

  \answer{7}
