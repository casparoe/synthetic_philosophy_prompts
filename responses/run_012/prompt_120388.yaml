  **Prediction**
  Your friend will rule that the museum should buy the marble figure as the work of the sculptor, at full value.

  **The Competing Rules**
  Based on the six previous verdicts, two distinct rules explain every decision equally well.

  **Rule 1: The Material Chain**
  This rule states that an object counts as the artist's work only if the physical material bears the trace of the artist's hand, or if the object is a direct mechanical impression from a tool or matrix (like a mold or negative) that the artist personally touched.
  *   **Consistency:** It explains the rejection of the forgery and the pastiche (no physical link to the master). It explains the acceptance of the overpainted canvas (original paint survives beneath). It explains the acceptance of the posthumous bronze and the photographic print (both come from molds or negatives the artist touched). It explains the acceptance of the painting with fake papers (the canvas and paint are genuine).
  *   **Prediction for the Marble:** It predicts the museum should **not** buy the figure as the sculptor's work. The sculptor never touched the marble, and the assistants "worked out the details themselves," meaning the final form is not a direct mechanical imprint of her model.

  **Rule 2: The Authorial Intent**
  This rule states that an object counts as the artist's work if the composition and form originated with the artist and were produced under their authority, regardless of who physically executed the labor or when it was made.
  *   **Consistency:** It explains the rejection of the forgery and the pastiche (the design did not come from the master). It explains the acceptance of the overpainted canvas (the composition is the master's, even if the surface is not). It explains the acceptance of the posthumous bronze and print (the artist created the defining instructions—the mold or negative—that authorized the object). It explains the acceptance of the painting with fake papers (the fraud was external to the creative act).
  *   **Prediction for the Marble:** It predicts the museum **should** buy the figure. The sculptor supplied the design, drawings, and model. The use of assistants was standard for her workshop, implying her standing authority for this division of labor.

  **Which Rule She Is Running**
  I believe your friend is following **The Authorial Intent**.

  The deciding factor is the case of the overpainted canvas (Case 3). Under the Material Chain rule, that painting is compromised; the surface you actually look at is mostly nineteenth-century restoration, not the artist's hand. If physical touch were the primary requirement, she should have discounted its value or status. Instead, she bought it at *full value* as the work itself. This signals that she values the survival of the artist's *vision* (the composition) over the survival of the artist's *touch* (the specific brushstrokes).

  Furthermore, her acceptance of the posthumous bronze (Case 4) supports this. The artist was dead when that specific bronze was cast; they could not authorize that specific object in the moment. She accepted it because the mold represented the artist's standing instruction. In the marble case, the drawings and clay model serve the same function as the mold: they are the record of the artist's intent, even if the final carving required human interpretation by assistants. The note that this division of labor was "ordinary for her time" confirms that this interpretation falls within the artist's expected authority.

  **The Further Object**
  To separate these two rules after the marble case is settled, you should present the committee with a **bronze cast made from a secondary mold.**

  Imagine a bronze sculpture produced after the artist's death. It is identical to the artist's original design, but it was not cast from the artist's original plaster mold. Instead, a third party took a cast *of* the original mold (a "surmoulage") and used that copy to make the bronze. The artist's hand touched the original mold, but never the secondary mold used for this specific object.

  *   **The Material Chain Rule** predicts **rejection**. The direct physical link is broken; this object is one step removed from the artist's touch.
  *   **The Authorial Intent Rule** predicts **acceptance**. The form and composition are still exactly what the artist designed and authorized; the method of replication does not change the creative source.
