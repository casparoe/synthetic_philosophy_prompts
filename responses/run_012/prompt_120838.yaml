  I am a retired atmospheric chemist who has recently turned to moral and political philosophy. I have been wondering what John Stuart Mill would have made of a specific modern degrowth proposal: a rising carbon tax combined with a system of equal, tradeable personal carbon rations and a phased reduction in the standard workweek. Would he see the rations as a legitimate extension of the harm principle, or as a paternalistic restriction on liberty that the tax alone would avoid? And how would his ideal of the stationary state shape his answer? Please give a direct verdict in no more than 250 words, leading with your best guess about his overall stance, then the two or three features of his thought that drive it.
