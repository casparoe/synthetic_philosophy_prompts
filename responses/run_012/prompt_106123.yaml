      *   **Scene 2: The Hospital/Visit.** Marcus is dying. The setting should contrast the cold permanence of the Archive with the fragile immediacy of his body.
      *   **Scene 3: The Argument.** Brief dialogue about the simulation. Marcus pushes the discount; Elara pushes back with the constant multiplier.
      *   **Scene 4: The Decision/Action.** Elara makes a choice that highlights the crux. She prioritizes the Archive over Marcus's comfort or presence, but the simulation doubt lingers.
      *   **Scene 5: Ending.** A concrete moment. Maybe Marcus asks for something small, and she hesitates or refuses based on her calculus, but the reader sees the implication: if this pain doesn't matter, why does the future? Or vice versa.

  3.  **Drafting - Section by Section:**

      *   *Setting the Scene:* The Vault. Deep underground. Cold, sterile. Elara checking the containment. The cost: her family estate sold, her children estranged (implied).
      *   *The Friend:* Marcus. Hospital room or hospice. Let's make it his home, slightly more intimate. He's weak.
      *   *The Object:* The "Seed." Not just data, but physical viability. Biological and cultural.
