      *   **Philosophy:** Fanatical longtermism. Expected value of steering the far future (astronomically large number of minds) swamps present good, even with low probability of success. Will sacrifice almost anything.
      *   **Antagonist/Friend:** Oldest friend, an engineer (let's call him Marcus). Dying (cancer/illness).
      *   **Conflict:** Marcus introduces the simulation hypothesis. If we are in a simulation, the far future might not be "real" or might be truncated. Therefore, apply a discount factor to her astronomical stakes.
      *   **Protagonist's Counter:** A discount factor is a constant. Astronomical number * constant = still astronomical. Only a change in *value shape* (what counts) matters, not probability.
      *   **The Crux (Implicit):** The simulation hypothesis only dampens her fanaticism if it discounts *future* value selectively. If simulated minds count for less, then *present* suffering (Marcus's death, her sacrifices) also counts for less. To use the simulation argument against her project is to devalue the very pain she is ignoring now.
      *   **Requirements:**
          *   Argument enacted, not explained (max one brief exchange).
