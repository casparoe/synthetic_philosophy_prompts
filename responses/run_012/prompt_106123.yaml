      *   **The Climax:** Marcus needs something. Pain meds? A signature? No, something emotional. He wants her to stay the night. The Vault needs monitoring.
      *   **The Choice:** She checks the time. The Vault protocol.
      *   **The Ending:** She leaves. He watches her go. The ambiguity of whether her leaving is justified by the math or the simulation doubt.

  6.  **Writing - Focus on Sensory Details:**
      *   The cold of the vault vs. the warmth of the hospice bed.
      *   The hum of servers vs. the rasp of breathing.
      *   The checkbook/transfer vs. the hand holding.

  7.  **Word Count Check:**
      *   Need to expand on the atmosphere and the internal monologue (limited) to reach ~1500 words.
