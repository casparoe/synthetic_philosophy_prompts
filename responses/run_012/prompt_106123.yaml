answer: |-
  The vault sat beneath the basalt shelf, a silent cylinder of tungsten and ceramic buried deep enough to outlast the erosion of continents. Elara stood before the containment console, her reflection ghostly in the dark glass. She was sixty-eight, her hair white and cropped close to the skull, her hands spotted with age but steady as she keyed the authorization sequence. Thirty years. Two generations of family wealth liquidated, estates sold, trusts dissolved. All for this: a seed archive, a physical instruction set for rebuilding a biosphere and a civilization should the surface world fail.

  It was not a hope. It was a calculation. She had run the numbers until they became a kind of prayer. Even if the probability of the archive's use was one in a million, the expected value of steering the trajectory of potential future minds—astronomical in number—swamped any finite good available in the present. The math was cold, clean, and absolute. It justified the estrangement of her children. It justified the coldness of this room. It justified everything.

  She left the vault at dusk, driving the electric sedan across the barren land toward the city. The headlights cut through the gathering fog, illuminating nothing but the road immediately ahead. She was going to see Marcus.

  Marcus lived in a hospice house that smelled of antiseptic and dried flowers. He had been an engineer once, the kind who built bridges that stood for centuries. Now he was built of failing organs and morphine. He lay in the bed by the window, his skin translucent against the white sheets. When Elara entered, he turned his head slowly, the movement costing him visible energy.

  "You came," he said. His voice was a rasp, like paper dragged over stone.

  "I said I would." She pulled a chair close to the bed. She did not take his hand. Touch was a variable she tried to minimize; it complicated the calculus.

  "The monitoring system," Marcus said, nodding toward the IV pump beside him. "It beeps. Every four minutes. It keeps the nurses honest, I suppose."

  "I can have them silence it," Elara said.

  "No. Let it beep. It marks the time." He closed his eyes for a moment, breathing through the pain that spiked behind his ribs. "I've been thinking about your archive, Elara. About the deep time you're trying to buy."

  "It's not buying. It's insurance."

  "Insurance against what? Ruin? Extinction?" He opened his eyes again. They were cloudy, but the intellect behind them was sharp, undimmed by the morphine. "Or against the possibility that this is all a render?"

  Elara stiffened. They had danced around this before, in the early years when the funding was still secure and the end seemed distant. Now, with his body failing, the hypothesis had become a fixation for him.

  "The simulation hypothesis," she said flatly.

  "Not as a truth. As a probability. Just an appreciable fraction." Marcus shifted, wincing. "If we are inside a computation, the future you are saving for... it might not exist. The server could be shut down. The simulation terminated. Your astronomical stakes rely on continuity. If the world is simulated, continuity is a privilege, not a law."

  Elara looked at the IV bag, the slow drip of clear fluid. "A discount factor is a constant, Marcus. Even if the probability of the future existing is reduced by half, or by ninety-nine percent, you are multiplying an astronomical number by a constant. It remains astronomical. It still swamps the present."

  "Unless the simulation implies the value itself is different," Marcus whispered. "If the future minds are code, do they count? If they don't count, your archive is a tomb for ghosts."

  "If they don't count, then neither does your pain."

  The words hung in the air, heavier than the smell of lilies. Marcus didn't flinch. He had known this was her answer. It was the only answer that kept her structure intact. If the simulation hypothesis devalued the future, it had to devalue the present equally. To argue otherwise was to claim that suffering here was real while suffering there was not, a selective discount she would never accept.

  "The beep," Marcus said softly. "It's loud."

  "I'll speak to the nurse."

  "No. Don't." He looked at her, and for the first time, she saw a plea in his eyes that had nothing to do with philosophy. "I want you to stay. Tonight. The nurses are competent, but... I want my friend. The one who sold the world to save the future."

  Elara looked at her watch. The vault required a physical key turnover every twenty-four hours. If she missed the window, the security protocol would lock the containment for a week. The risk was negligible in terms of natural disaster, but it violated the protocol. Protocol was the only thing holding the mission together. Protocol was the religion.

  "If I stay," she said, "the lockout triggers."

  "I know."

  "It increases the risk profile."

  "I know." Marcus swallowed. "If this is a simulation, Elara, the lockout doesn't matter. The code will run regardless of your key. If it's real... then I am dying anyway. What is one night against thirty years?"

  "It is not one night. It is the principle of commitment."

  "Is it?" Marcus coughed, a wet, tearing sound. He settled back, exhausted. "Or is it that you are afraid? If you stay, you admit that the present has weight. That *I* have weight. And if I have weight, then the calculation changes. You can't have it both ways. You can't say the future is so heavy that it crushes the present, unless you admit the present is real enough to be crushed."

  Elara stood up. The chair scraped against the floor, a harsh sound in the quiet room. She looked at him, this man who had helped her draft the first blueprints, who had laughed with her when the money was still just numbers on a screen. He was in pain. It was immediate, visceral, and undeniable. To ignore it was cruel. To acknowledge it was to undermine the logic that allowed her to ignore the cost of the vault.

  If the world was a simulation, his pain was data. If it was real, his pain was suffering. In neither case did it outweigh the archive, unless the archive was nothing. But if the archive was nothing, then her life was nothing.

  "I have to go," she said.

  Marcus nodded slowly. He didn't look angry. He looked tired. "I know."

  "I will send someone to sit with you."

  "Don't. Just go."

  Elara turned and walked to the door. Her hand hovered over the handle. She could feel the heat of the room behind her, the biological decay, the finite ending of a consciousness. Ahead was the cold vault, the potential infinity, the sterile promise of a future that might never come.

  If she stayed, she validated the reality of his suffering. If she left, she validated the reality of the future. But if the simulation hypothesis held, both were equally illusory. If it didn't, both were equally real. The discount factor applied to everything or nothing. She could not use it to save her conscience while keeping her mission.

  She opened the door. The beep of the IV pump followed her into the hallway, marking the seconds, counting down the time remaining. She walked to her car, the keys heavy in her pocket. She started the engine and drove back toward the basalt shelf, toward the tungsten cylinder, toward the future.

  In the rearview mirror, the lights of the hospice faded into the fog. She did not look back. She kept her eyes on the road, gripping the wheel until her knuckles turned white, driving through the night to turn a key that might open a door to nowhere, leaving behind a pain that might be the only real thing she had ever touched. The car hummed, steady and indifferent, carrying her away from the dying man and toward the eternal machine, the distance between them measuring exactly nothing.
