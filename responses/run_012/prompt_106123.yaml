      *   *Ending:* She leaves him to go back to the Vault. A moment of hesitation.

  4.  **Refining the Philosophy:**
      *   Elara's view: Longtermism. $Value = Probability \times Impact$. Impact is huge ($10^{50}$ lives). Even if $P$ is tiny, $Value$ is huge.
      *   Marcus's view: Simulation Hypothesis. If we are simulating, the "future" might be shut down anytime. $P$ drops.
      *   Elara's Counter: Even if $P$ drops by half (or 99%), $10^{50}$ is still bigger than 100 lives now.
      *   The Hidden Trap: If the simulation means "nothing here is real," then Marcus's pain isn't real either. If she uses "it might not be real" to ignore the future, she must use it to ignore his pain. If she ignores his pain because "it's just a sim," she confirms her fanaticism. If she acknowledges his pain is real, she must acknowledge the future is real too.
      *   *Correction:* The prompt says: "The reader should feel how hard it is to defend the selective discount without also devaluing the suffering in front of her."
      *   So, Marcus suggests the discount. Elara rejects it mathematically. But the *action* must show the tension. If she treats his suffering as negligible compared to the Archive, she is consistent. If she treats his suffering as real, she undermines the discount.
      *   Actually, the prompt says Marcus claims the hypothesis *should alter how she weighs things*. She says a constant doesn't change the order of magnitude.
      *   The story needs to show that accepting his premise (we might be simulated) forces a choice: either *nothing* matters (nihilism) or *everything* matters equally (including the future). She cannot say "The future matters less because it's simulated" while saying "Your pain matters fully because it's present."
