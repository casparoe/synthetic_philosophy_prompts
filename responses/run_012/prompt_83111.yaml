answer: |-
  The boundary problem is not merely a theoretical curiosity for your board; it is the structural reality of your situation. You are not merely voting on a policy within a fixed community; you are voting on the *reconstitution* of the community itself. The boundary problem forces you to concede that there is no democratic procedure capable of legitimizing the boundary of the electorate *before* the election takes place.

  Here are the implications of that structural feature for your specific decision, distinguished by the levels at which the problem bites.

  ### 1. The Legitimacy of Exclusion and the "Harm" Threshold
  The solicitor is legally correct: under your current bylaws, the *demos* is the 214 units. However, the boundary problem reveals that legal membership is a pre-democratic fact. It is a property right, not a democratic entitlement.

  **Implication:** If you proceed with a vote excluding the 38 units, you are exercising **constituted power** (the rules of the existing co-op) over **constituent power** (the people who will make up the new entity).
  *   **Merely Differently Off:** If the merger changes the neighbors' status but leaves them materially secure (e.g., rents stabilize, maintenance improves), the legitimacy deficit of their exclusion is manageable. You are altering their environment, which property owners do all the time.
  *   **Materially Worse Off:** If the merger imposes debt service that raises their housing costs, or if a "No" vote leads to their insolvency and displacement, the exclusion becomes tyrannical in democratic terms. The boundary problem forces you to concede that **procedural correctness (following bylaws) does not guarantee normative legitimacy.** If the decision imposes a burden they cannot exit, the lack of voice creates a moral debt that the "No" or "Yes" vote does not discharge. You must concede that a vote taken solely by the 214 is legally binding but politically fragile if it inflicts harm on the 38 without their consent.

  ### 2. All-Affected vs. All-Subjected: Where to Draw the Line?
  The residents' group argues for the "all-affected-interests" principle. As you note, this is theoretically boundless.
  *   **The Infinite Regress:** If everyone affected votes, your lender (affected by risk), the city (affected by tax base), and nearby competitors (affected by market supply) could claim a vote. The boundary problem shows that "affectedness" cannot be the *method* for drawing the boundary, because affectedness is determined *by* the decision.
  *   **The Coercion Test:** The narrower "all-subjected-to-coercion" principle is more robust here. Currently, the 38 units are *not* subject to your coercive rules (your bylaws, your fees). Post-merger, they *will be*.
  *   **Implication:** The vote on the merger is the moment *before* subjection begins. Therefore, strictly speaking, they cannot vote on the rules that will subject them because they are not yet subjects. However, the boundary problem forces you to concede that **the act of merging is a sovereign act.** By absorbing them, you are extending your sovereignty. In political theory, the extension of sovereignty usually requires the consent of the governed. Since you cannot wait until they are governed to ask for consent, you must treat the merger vote as a **treaty negotiation** rather than a standard internal ballot. The "all-affected" test fails as a voting rule, but it succeeds as a moral constraint: you cannot ignore the depth of their subjection.

  ### 3. Nested Demoi: The Limits of Co-op Sovereignty
  You are a *demos* nested inside a municipality and a state. This does not solve the boundary problem, but it contextualizes it.
  *   **Harder:** It highlights the arbitrariness of your boundary. The city could zone your land differently; the state could alter co-op law. Your "sovereignty" is delegated. This weakens the argument that your 214 members have an absolute right to exclude, because your boundary is ultimately protected by external law, not natural right.
  *   **Easier:** It provides a safety valve. If the merger is predatory, the neighbors have recourse to the larger *demoi* (courts, housing regulators, ombudsmen).
  *   **Implication:** You must concede that **your democratic autonomy is fiduciary, not absolute.** You are stewards of a legal structure granted by the state. If the exclusion of the 38 units violates broader housing statutes or fiduciary duties (e.g., acting in bad faith to acquire assets cheaply), the "internal vote" shield will not hold. The nested structure implies that your internal democracy is valid only insofar as it does not violate the norms of the larger democracy.

  ### 4. Exit and Voice: The Legitimacy of Constraints
  Hirschman's framework (Exit, Voice, Loyalty) is crucial here.
  *   **Your Members:** Have relatively high exit options (selling shares, moving).
  *   **The Neighbors:** In a financially distressed co-op, exit options are likely low (market stigma, inability to sell shares).
  *   **Implication:** Voice becomes a functional substitute for Exit. If the neighbors cannot leave, they must be heard. The boundary problem forces you to concede that **the right to vote is correlated with the cost of exit.** If you deny them a vote while simultaneously making it impossible for them to leave the situation (by absorbing their building into your debt structure), you are creating a condition of involuntary servitude to your decision. A right to leave *does* legitimating work, but only if the exit is real. In a housing crisis, it often is not. Therefore, the lack of exit rights strengthens their claim to voice, regardless of their legal membership status.

  ### 5. Assessing the "Affectedness Weighting" Proposal
  You proposed a system where the 38 neighbors receive fractional votes, capped so the 214 members cannot be outvoted on the transfer of their own assets. The boundary problem reveals this to be the most theoretically honest option available, though it is indeed a "fudge."

  *   **Why it is a Fudge:** It violates the principle of "one-person-one-vote" (equality) and the principle of "no taxation without representation" (the neighbors still cannot outvote you on the debt they will share). It admits that the *demos* is being drawn by a decision that cannot be democratic all the way down.
  *   **Why it is Principled:** It acknowledges the **constitutive nature** of the vote. You are not just passing a bylaw; you are creating a new political entity. In constitutional conventions, the rules of the new state are not voted on by the old state alone, nor by the unorganized masses, but by a negotiated mix.
  *   **What the Boundary Problem Forces You to Concede Here:**
      1.  **Pure Democracy is Impossible:** You cannot hold a perfectly democratic vote on the boundary because the boundary defines the voters. The weighting proposal admits this by creating a hybrid electorate.
      2.  **Sovereignty must be Shared to be Legitimate:** By granting fractional votes, you concede that your current boundary is not morally absolute. You are treating the neighbors as *stakeholders in the constitution* rather than *subjects of the legislation*.
      3.  **The Cap is Necessary but Revealing:** The cap (members cannot be outvoted on assets) concedes that the existing *demos* holds the "constituted power." They hold the keys to the castle. The neighbors hold the "constituent power" (their consent makes the new castle viable). The weighting proposal balances these.

  **Verdict on the Proposal:** The boundary problem shows this is not a mere compromise, but a **procedural acknowledgment of the paradox.** It avoids the infinite regress of "who votes on who votes" by fixing the weights *before* the vote (via board proposal), acknowledging that the boundary must be set *pre-democratically* to allow the democracy to function.

  ### Summary of Concessions
  The boundary problem forces your board to concede three uncomfortable truths:

  1.  **The Vote is Not Neutral:** You cannot claim the vote is a neutral mechanism to find the "will of the members." It is a mechanism that *creates* the members. Excluding the 38 units is a political choice to define the community narrowly, not a neutral application of rules.
  2.  **Legitimacy > Legality:** You can legally exclude the neighbors, but if the outcome harms them and they have no exit, the decision lacks democratic legitimacy. You will own that legitimacy deficit.
  3.  **The Weighting Proposal is the Only Coherent Path:** A binary vote (In/Out) pretends the boundary is fixed when it is actually fluid. The weighting proposal admits the boundary is fluid. It concedes that while the 214 units hold the legal title, the 38 units hold a moral claim that must be quantified in the procedure.

  **Recommendation:** Do not treat the weighting proposal as a design flaw to be smoothed over. Treat it as the only mechanism that aligns the procedure with the reality: you are merging two sovereign bodies. The 214 cannot simply vote to annex the 38; the 214 and the 38 must vote to create a new 252. The fractional vote is the bridge between the old *demos* and the new one. It is the only way to vote on the boundary without pretending you already own it.
