  ### 1. Essay Question

  **Graduate Seminar on Conditionals: Final Essay**

  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in essay form. You may not cite specific authors, papers, or dates. Rely on the logical structures discussed in class.

  **Background:**
  Lewis's triviality argument purports to show that no indicative conditional can both (i) be a proposition with a probability, and (ii) satisfy the equation $P(A \to B) = P(B|A)$ for every probability function $P$. The argument runs, roughly, by applying the equation to the conditionalized distribution $P(\cdot|B)$ and to $P(\cdot|\neg B)$, which forces $P(A \to B) = P(B)$, and then equating that with $P(B|A)$ to yield the absurd conclusion that $A$ and $B$ are probabilistically independent for arbitrary $A$ and $B$.

  Students have seen four usual escape routes: (1) deny that conditionals express propositions (expressivism); (2) restrict the equation to a privileged probability function rather than all of them; (3) deny closure of the equation under conditionalization; or (4) restrict the class of sentences to which the equation applies.

  **The Proposal:**
  Consider a repair called the **Simple-Conditional Restriction (SCR)**. Its two clauses are:
  1.  The equation $P(A \to B) = P(B|A)$ is asserted only for conditionals $A \to B$ in which neither $A$ nor $B$ contains a further conditional.
  2.  The truth value of a conditional need not be a function of the truth values of its parts, so the semantics may be a selection-function semantics on which $A \to B$ is true at a world just in case $B$ holds at the nearest $A$-world.

  **Question:**
  Determine whether the Simple-Conditional Restriction blocks Lewis's triviality argument. To do this, you must:
  1.  Trace the triviality proof step by step, identifying which premises each step consumes.
  2.  Give a definite verdict on whether SCR blocks the argument. If it fails, identify exactly which assumption of the proof it fails to touch and state which additional commitment a proponent must abandon to save the thesis.
  3.  Sort the four escape routes listed in the Background by whether each one targets an assumption the proof actually uses.
  4.  Explain why at least one popular-sounding route is a red herring because the proof never relied on the assumption it denies.

  ---

  ### 2. Model Answer

  Lewis's triviality proof begins with Stalnaker's Thesis (ST): $P(A \to B) = P(B|A)$ for any probability function $P$. The proof assumes conditionals express propositions, allowing them to serve as inputs to probability functions. It further assumes the class of probability functions is closed under conditionalization.

  The proof proceeds by applying ST to conditionalized functions. First, consider $P(\cdot|B)$. Assuming $P(A \land B) > 0$, applying ST yields $P(A \to B | B) = P(B | A \land B) = 1$. Second, consider $P(\cdot|\neg B)$. Applying ST yields $P(A \to B | \neg B) = P(B | A \land \neg B) = 0$. By the Law of Total Probability, $P(A \to B) = P(A \to B | B)P(B) + P(A \to B | \neg B)P(\neg B)$. Substituting the derived values gives $P(A \to B) = 1 \cdot P(B) + 0 \cdot P(\neg B) = P(B)$. Combining this with the original ST equation yields $P(B|A) = P(B)$, implying probabilistic independence for arbitrary $A$ and $B$.

  The Simple-Conditional Restriction (SCR) fails to block this argument. Clause 1 restricts ST to conditionals where $A$ and $B$ contain no further conditionals. However, the triviality proof generates a contradiction using atomic $A$ and $B$. Since $A \to B$ is simple in the base case of the proof, Clause 1 permits the application of ST exactly where the proof requires it. Clause 2 affirms that conditionals are propositions (sets of worlds determined by a selection function). This satisfies the proof's requirement that conditionals have truth values and probabilities. Thus, SCR leaves the proof's machinery intact.

  To save ST while accepting SCR, a proponent must abandon the assumption that the class of probability functions is closed under conditionalization. The proof relies on treating $P(\cdot|B)$ as a valid function for which ST holds. If one denies that ST applies to conditionalized functions (even if it applies to the base function), the step deriving $P(A \to B | B) = 1$ is blocked. This corresponds to escape route (3).

  Sorting the four escape routes by whether they target assumptions the proof uses:
  1.  **Expressivism:** Targets the assumption that conditionals are propositions. **Yes**, the proof uses this to apply probability laws to $A \to B$.
  2.  **Privileged Probability Function:** Targets the assumption that ST holds for *every* $P$. **Yes**, the proof uses ST for $P(\cdot|B)$.
  3.  **Deny Closure:** Targets the assumption that $P(\cdot|B)$ is in the class of valid functions. **Yes**, this is load-bearing.
  4.  **Restrict Class of Sentences:** Targets the assumption that ST applies to all sentences. **No**, this is a red herring.

  The "Restrict Class of Sentences" route is a red herring in this context. The proof never relies on the assumption that ST applies to *nested* conditionals (e.g., $(A \to B) \to C$). It derives triviality solely from the behavior of simple conditionals with atomic components. Therefore, a restriction that bans nested conditionals denies an assumption (universality over syntactic complexity) that the proof does not utilize. The contradiction arises within the simple cases; restricting the complex cases leaves the core triviality result untouched. To block the proof, one must restrict the *probability functions* (Closure/Privileged P) or the *ontology* (Expressivism), not the syntactic complexity of the sentences.

  ---

  ### 3. Marking Scheme

  | Criterion | Marks (out of twenty) | What an A-range answer must do | Common error that should cost marks |
  | :--- | :---: | :--- | :--- |
  | **Proof Reconstruction** | 5 | Trace the derivation from ST to $P(B|A)=P(B)$, explicitly showing the use of $P(\cdot|B)$ and $P(\cdot|\neg B)$. | Omits the step applying ST to conditionalized functions; treats proof as purely truth-functional. |
  | **SCR Verdict & Analysis** | 5 | Verdict: SCR fails. Explains Clause 1 allows atomic cases and Clause 2 affirms propositions. | Claims SCR blocks proof because it bans nested conditionals; claims Clause 2 denies propositions. |
  | **Assumption to Surrender** | 5 | Identifies "Closure under conditionalization" (or Privileged P) as the necessary sacrifice to save ST. | Identifies "Truth-functionality" or "Simple sentences" as the assumption to surrender. |
  | **Escape Route Audit** | 5 | Correctly classifies the four routes; identifies "Restrict Class" as the red herring with justification. | Classifies "Restrict Class" as valid; fails to explain why the red herring is irrelevant to the proof's base case. |
  | **Total** | **20** | | |

  ---

  ### 4. Escape-Route Audit

  | Escape route | Does it target a premise the proof uses? (Yes/No, with the premise named) | Consequence for the triviality result |
  | :--- | :--- | :--- |
  | **Expressivism** | Yes (Conditionals are propositions) | Blocks the application of probability laws to conditionals. |
  | **Privileged Probability Function** | Yes (ST holds for every $P$) | Blocks the application of ST to $P(\cdot|B)$. |
  | **Deny Closure** | Yes (Class closed under conditionalization) | Blocks the legitimacy of using $P(\cdot|B)$ in the ST equation. |
  | **Restrict Class of Sentences** | No (ST applies to all sentences/nested conditionals) | Red herring; proof works on atomic sentences regardless. |
  | **Simple-Conditional Restriction** | No (ST applies to nested conditionals) | Fails; proof generates triviality for simple conditionals. |

  ---

  ### 5. Note to Examiner

  The single feature discriminating an A from a B answer is the recognition that Lewis's proof operates on **atomic** antecedents and consequents. A B-range student will often accept SCR Clause 1 as a valid block, mistakenly believing the proof requires nested conditionals. An A-range student will trace the proof to show it relies only on simple sentences, rendering SCR's syntactic restriction irrelevant. Regarding uniqueness: The logical verdict (SCR fails) is unique. However, there is a minor interpretive choice between surrendering "Closure" versus "Privileged P," as they are functionally equivalent in this context; both should be accepted if justified.
