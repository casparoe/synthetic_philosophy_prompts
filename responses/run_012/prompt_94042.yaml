answer: |-
  ### Essay Question

  **Part 1**
  The critique of adaptationist thinking is often summarized simply as the observation that not every feature of an organism is an adaptation. However, this summary misses deeper arguments about how science is done and how living things are built. Distinguish between three distinct claims the critique could be making: (1) a claim about which features exist and how they arose, (2) a claim about how research is conducted and whether adaptation stories can be tested, and (3) a claim about whether an organism can be carved into separate traits at all. Which of these three claims do you think is the strongest, and what would a defender of adaptationist reasoning have to concede for this critique to be properly answered rather than just deflected?

  **Part 2**
  Apply this reasoning to the following case: *The covered market in our town is carried on a row of stone arches, and wherever two arches meet there is a triangular panel of stonework that nobody drew on purpose, since it simply falls out of how the arches and the roof have to meet. When the market was restored in the 1890s the traders began hanging their painted trade signs in those panels, and today the panels are what visitors come to see: there is a waiting list for them, a rule about who is entitled to one, and a size limit that is fixed by the shape of the panel rather than chosen by anyone. Our guidebook says the panels were designed for the signs.*

  Are the signs an adaptation, a byproduct, or something that was later taken over for a new purpose? What evidence would settle that question? Finally, explain where the comparison between this building and a living organism breaks down, and why that breakdown matters for how we study biology.

  ***

  ### Model Answer

  The surface-level critique of adaptationism is that some traits are byproducts rather than direct solutions to survival problems. However, there are two deeper claims hidden beneath this. The first is methodological: adaptationist stories are often "just-so stories" that sound plausible but cannot be tested or falsified. The second is structural: organisms are integrated wholes, not collections of independent Lego bricks. You cannot always isolate one trait to explain its history because changing one part affects the whole system.

  Of these three, the structural claim is the strongest. admitting that some traits are byproducts (Claim 1) is easy for an adaptationist; they can simply say those traits are minor exceptions. Admitting that some stories are untested (Claim 2) is also easy; they can promise to do better testing. But admitting that organisms cannot be carved into independent traits (Claim 3) strikes at the heart of the method. If traits are deeply linked, you cannot tell a simple story about one feature without accounting for the entire system. To answer this critique properly, an adaptationist must concede that plausibility is not evidence. They must accept that proving adaptation requires showing not just that a trait is useful now, but that it evolved *because* it was useful, distinguishing this from features that are merely unavoidable consequences of physics or development.

  Applying this to the market case clarifies the distinction. The triangular panels are byproducts; they are necessary geometric consequences of building arches, not designed features. The signs, however, represent a feature later taken over for a new purpose. The panels existed first due to structural constraints; the signs were added later because the panels were available. The guidebook commits the adaptationist error: it assumes the panels exist *for* the signs because that is their current use. To settle this, we would need historical records showing the arches were built before the signs were hung. If the arches predate the signs, the panels cannot be adaptations for the signs.

  However, the comparison between the market and an organism breaks down in a crucial way. The market was built by intelligent designers with a plan. Even the byproducts (the panels) were created by humans aiming to build a roof. Organisms are not designed by a mind; they are shaped by blind historical processes like natural selection. In the market, we can ask the architect what something is for. In biology, there is no architect to ask. We only have the history of survival and reproduction.

  This breakdown matters because it changes how we interpret evidence. In the market, function implies design intent. In biology, function implies historical selection pressure. If we treat organisms like buildings, we might assume every part has a purpose chosen by nature. But nature does not choose; it filters. Recognizing this prevents us from assuming that because a trait is useful today, it evolved for that use. The market has a history of human intent; the organism has a history of constraint and contingency. Ignoring this leads to the mistake of assuming that current utility equals original purpose, which is the core error the critique warns against.

  ***

  ### Marking Scheme (20 Marks Total)

  **Part 1: Distinguishing the Claims (8 Marks)**

  *   **Identification of Claims (3 marks)**
      *   1 mark for identifying the ontological claim (some traits are byproducts).
      *   1 mark for identifying the methodological claim (stories need testing/falsifiability).
      *   1 mark for identifying the structural claim (organisms are integrated wholes/cannot be carved up).
      *   *Typical Error:* Confusing the methodological and structural claims as the same point about difficulty.
  *   **Evaluation of Strength (3 marks)**
      *   1 mark for selecting one claim as strongest.
      *   2 marks for justifying why it is harder to deflect than the others (e.g., exceptions vs. systemic change).
      *   *Typical Error:* Choosing the "byproduct" claim as strongest without explaining why the others are weaker.
  *   **Required Concession (2 marks)**
      *   2 marks for stating that plausibility is insufficient; evidence of historical causation is needed.
      *   *Typical Error:* Saying adaptationists just need to "admit they were wrong" without specifying the evidential standard.

  **Part 2: The Market Case and Breakdown (12 Marks)**

  *   **Classification of Market Features (3 marks)**
      *   1 mark for identifying panels as byproducts/constraints.
      *   1 mark for identifying signs as later takeover (exaptation).
      *   1 mark for identifying the guidebook's error (confusing current use with original design).
      *   *Typical Error:* Calling the panels an adaptation because they are useful now.
  *   **Evidence Required (2 marks)**
      *   2 marks for specifying historical evidence (timing of arches vs. signs) rather than just current utility.
      *   *Typical Error:* Suggesting we measure how useful the signs are today to prove design.
  *   **The Breakdown of Analogy (5 marks)**
      *   2 marks for noting the presence of a designer in architecture vs. blind process in biology.
      *   3 marks for explaining why this matters: intent vs. selection history (utility does not prove origin).
      *   *Typical Error:* Stating "buildings aren't alive" without explaining the methodological consequence for biology.
  *   **A vs B Distinction (2 marks included in above)**
      *   **A Answer (10-12 marks in Part 2):** Explicitly connects the breakdown to the risk of assuming purpose where there is only history.
      *   **B Answer (6-9 marks in Part 2):** Correctly identifies the designer difference but treats it as a factual distinction rather than a methodological warning.
      *   *Typical Error:* Focusing on material differences (stone vs. flesh) rather than causal differences (design vs. selection).

  **General Penalties**
  *   **-2 marks** for using specialist names (e.g., Gould, Lewontin, Darwin) when plain descriptions suffice.
  *   **-2 marks** for exceeding the time limit implications (answer is significantly too long or too short to be feasible).
  *   **-1 mark** for every instance of unexplained jargon (e.g., using "exaptation" without defining it).
