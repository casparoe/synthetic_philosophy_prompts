answer: |-
  I found the book left open on the shelf,
  Where reason spoke and silenced doubt itself.
  Define the point, draw out the straight line true,
  And assent follows what the fingers drew.
  I brought this rule to states and kings and men,
  To end the war and peace be built again.
  I squared the circle, made the curve comply,
  You called it false, but could not show me why.
  The proof compels, or so it seems to me,
  But you stand free where I am bound to see.
  No logic breaks the knot, but laughter will,
  And silence is the only proof they kill.
  I turn my Greek to English, in my mind,
  And leave the common error far behind.
  I hold the lamp aloft to show the light,
  You turn away. You draw a different line.
