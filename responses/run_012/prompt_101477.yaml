answer: |-
  The phenomenon is **pain asymbolia**. It typically results from lesions to the insula or cingulate cortex, disrupting limbic connections while sparing somatosensory pathways.

  **The Carve**
  Distinguishing it is straightforward. Unlike congenital insensitivity, nociception is intact; patients localize stimuli and rate intensity accurately. Unlike stoicism or suppression, the behavioral absence isn't volitional. The affective-motivational component—the "urge to escape"—is genuinely missing. They recognize the sensation as pain and may even cognitively acknowledge it is "bad," yet the motivational force to avoid it is severed.

  **Theoretical Implications**
  This dissociation is evidence gold for decomposing pain. It strongly supports multidimensional models (e.g., Melzack & Casey) over unitary sensory accounts. If the sensory qualia persist without the "awfulness," then unpleasantness is not an intrinsic property of the sensation itself. Instead, it suggests pain's badness is a separate evaluative attitude or a distinct processing stream (affective-motivational) layered atop sensory-discriminative data.

  For your research, this suggests the "badness" of pain is computationally separable. The state represents a failure of the system to tag sensory input as threatening, leaving the detection mechanism online but the imperative mechanism offline. It argues that while pain *usually* involves both, the essence of "hurt" lies in the affective response, not the sensory signal alone.
