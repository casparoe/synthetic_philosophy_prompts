answer: |-
  Sir, you press me hard, and rightly so. A principle that cannot be conceived as false is no principle at all, but a tautology. I submit this: my theory would be dead indeed if we observed the labouring class multiplying at their biological maximum—breeding as freely as nature allows—while their real wages rose permanently alongside them, without any rise in the price of subsistence. If population could grow geometrically for centuries while the produce of the earth grew geometrically to meet it, without any voluntary restraint on marriage or births, *that* would break the law. The fossil stores you describe are merely a temporary acceleration of the arithmetical line; they do not alter the nature of the soil. If those stores were exhausted, or if the land refused further yield despite them, and yet men continued to breed without consequence, I would concede.

  You say abundance confirms me only if I call it "early." I say abundance confirms me if it leads to multiplication that eventually consumes it. The only observation that falsifies me is a world where the link between reproduction and the means of subsistence is severed permanently. If the poor can have eight children each, survive them all, and yet live in luxury without practicing what I called "moral restraint"—delaying marriage or abstaining—then my distinction between the passion of the sexes and the power of the earth is nonsense. But if their wealth leads them to choose smaller families to maintain that wealth, then the preventive check is operating, precisely as I described, merely dressed in new clothes.

  [Note: Economic historians debate whether the Demographic Transition (wealth leading to fewer children) counts as Malthusian "moral restraint" (which implied chastity/delayed marriage) or a fundamental shift in preferences/technology he didn't anticipate. Additionally, whether fossil fuels represent a permanent escape from diminishing returns or a temporary delay is a core contention between Neo-Malthusians and Cornucopians.]
