answer: |-
  **The Resource:** A shallow, isolated desert pond containing a slow-breeding endemic fish. The fish are valuable for food. The pond is small enough that one person could theoretically drain it, but large enough that a crowd cannot coordinate.

  **Case A (Open Access):** A transient crowd of rational egoists arrives. They possess hand nets (labor-intensive technology). As fish density drops, the time required to catch a fish rises sharply (diminishing returns to labor). When the value of the next fish equals the opportunity cost of the time spent catching it, fishing stops. Because the users have no concern for the future, they do not stop *to save* the fish; they stop because it is no longer profitable to hunt. The stock stabilizes at a low level where marginal cost equals price. The pond and fish survive indefinitely.

  **Case B (Privatized):** A single owner holds exclusive rights. They have the same preferences (high discount rate, no intrinsic care for the fish) and access to the same technology. However, because they can exclude others, they can recoup the fixed cost of a diesel pump. They install the pump and drain the pond completely, catching 100% of the stock instantly. They sell the fish and invest the capital elsewhere where returns are higher than the fish's growth rate. The habitat is destroyed; the resource is wrecked.

  **Check 1: The Features**
  The feature saving Case A is **Diminishing Returns to Labor**.
  *Toggle Test:* Strip this feature. Suppose technology improves so catch rates remain constant regardless of density (e.g., poison that kills all fish equally). In Case A, the crowd poisons the pond. Marginal cost never rises; extraction continues until zero stock. Case A collapses.

  The feature wrecking Case B is **Capital Intensivity Enabled by Exclusion**.
  *Honest Assessment:* These are two different features. Case A survives due to a *physical constraint* on labor efficiency. Case B dies due to an *economic incentive* to invest in capital efficiency. Privatization removes the barrier to capital investment that open access imposes. Without the pump, the private owner faces the same diminishing returns as the crowd and would stop at the same sustainable level. The wreck requires both ownership *and* the availability of lumpy capital technology.

  **Check 2: The Tipping Point**
  Case A is not unlimited; it is balanced on a knife-edge of profitability.
  *Realistic Change:* A new market opens nearby, doubling the price of fish.
  *The Tip:* The marginal revenue curve shifts up. The point where Cost = Price now occurs at a much lower stock density. If the price spike is high enough, it becomes profitable to extract the last fish even with hand nets. The crowd fishes to biological extinction. The resource was never infinite; it was merely economically protected by low prices.

  **Check 3: Standard Logic Breakdown**
  *Open Access Prediction:* The standard model predicts rent dissipation until destruction.
  *Where it breaks:* It assumes constant or slowly rising marginal costs. It ignores that search/extraction costs can skyrocket before biological extinction, creating a natural "economic floor" for the stock.
  *Property Rights Prediction:* The standard model predicts internalization of future value leads to stewardship.
  *Where it breaks:* It assumes the owner's discount rate is lower than the resource's growth rate. It ignores that property rights enable liquidation technologies (pumps) that open access prevents, and that rational owners will liquidate if $r > g$.
  *Neutralizing the Features:* If you remove diminishing returns (constant cost tech) and remove the pump (labor only), both cases revert to the textbook: Case A collapses (no cost brake), and Case B sustains (no liquidation tech, owner preserves flow).

  **Check 4: The Defender's Rebuttal**
  A defender of the standard view will argue this is not a counterexample to privatization, but an exposure of a hidden precondition: **Property rights only conserve resources when the owner's discount rate is lower than the resource's regeneration rate ($r < g$).**
  In Case B, the destruction is not a failure of property rights theory; it is a confirmation of it. The theory says owners maximize Net Present Value. If liquidation yields higher NPV than sustainability (due to high $r$ or low $g$), rational owners *should* wreck the resource. Case A survives only because the crowd *cannot* execute the liquidation strategy, not because they *won't*.
  *Honest Verdict:* You are right to suspect a precondition. The standard story quietly assumes the resource is valuable enough to manage but not valuable enough to liquidate, and that owners are patient. This thought experiment strips away the patience. Privatization solves the *coordination* problem, but it creates a *liquidation* opportunity. If the economics favor mining over farming, property rights accelerate the death.
