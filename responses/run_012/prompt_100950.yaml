answer: |-
  0.30

  **Decomposition**

  1.  **Probability the divergence is genuine moral disagreement:** 0.80
      *   *Justification:* The vignettes target blame and wrongness directly, making semantic or pragmatic misalignment less likely than substantive normative divergence.
  2.  **Probability genuine disagreement is evidence against realism:** 0.60
      *   *Justification:* Systematic cultural variance creates a prima facie epistemic challenge, though it does not logically entail anti-realism.
  3.  **Probability realism can absorb/explain the divergence without cost:** 0.70
      *   *Justification:* Realists can plausibly attribute divergence to epistemic distance, differing salience of non-moral facts, or variable realization of objective goods.
  4.  **Probability the pattern is better explained by neutral cultural-evolutionary accounts:** 0.80
      *   *Justification:* Correlations with market integration strongly suggest functional coordination norms rather than metaphysical insight or lack thereof.

  **Combination**
  I treat the first term as a gatekeeper condition and the subsequent three as competing weights on the explanatory landscape. The credence is calculated as the probability of genuine disagreement multiplied by the average probability that the explanatory terms favor anti-realism (inverting terms 3 and 4):
  $$0.80 \times \frac{0.60 + (1 - 0.70) + (1 - 0.80)}{3} = 0.80 \times \frac{0.60 + 0.30 + 0.20}{3} = 0.80 \times 0.367 \approx 0.30$$

  **Sensitivity**
  The final number is most sensitive to **Term 3 (Realism can absorb)**. If the probability that realism can absorb the data drops from 0.70 to 0.40 (e.g., if non-moral beliefs are experimentally controlled), my credence rises to roughly 0.45; if it rises to 0.90, my credence collapses to 0.20.

  **Comparison**
  Your colleague's credence (0.75) is most likely mislocated. You probably disagree most on **Term 2 (Probability genuine disagreement is evidence against realism)**. Your colleague likely assigns this a probability near 0.90 or 1.0, treating the Argument from Disagreement as decisive, whereas you (and I) view it as merely probative and compatible with robust realist epistemologies.

  **Moving Evidence**
  The single piece of evidence that would move my number most is **experimental verification that non-moral beliefs (e.g., about causal efficacy, risk, or social relationships) are identical across the three populations**. This would move my number **up** (toward anti-realism) by simultaneously raising Term 1 (Genuine Disagreement) and lowering Term 3 (Realism Absorbability), as it removes the realist's primary escape route.
