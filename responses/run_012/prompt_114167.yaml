  # Decision Tree: The Rationality of Voting

  **Starting Commitment:** In a large national election, $P(\text{decisive}) \approx 10^{-7}$. Cost $C > 0$. Benefit $B \gg 0$ (if your side wins).
  **Instruction:** Answer each question based on your intuitive reasoning. Do not look ahead to the position names.

  ---

  ### **Q1: The Framework Premise**
  **Must the rationality of voting be settled primarily by calculating whether your single ballot changes the election winner?**
  *   **YES** (Pivotality is the test) $\rightarrow$ Go to **Q2**.
  *   **NO** (Pivotality is not the test) $\rightarrow$ Go to **Q7**.

  ---

  ### **Q2: The Value Dependency**
  **If we guaranteed your ballot would not causally alter the winner, would the act of voting still hold value for you?**
  *   **NO** (Value depends entirely on outcome) $\rightarrow$ Go to **Q3**.
  *   **YES** (Value remains despite non-decisiveness) $\rightarrow$ Go to **Q4**.

  ---

  ### **Q3: The Mechanism & Scope (Three-Way Split)**
  **Since value depends on the outcome, how does your vote connect to that value?**
  *   **A. Physical Tip + Personal Gain:** I rely on the physical chance of tipping the scale, counting only my own welfare. $\rightarrow$ **Leaf 1**
  *   **B. Physical Tip + Aggregate Gain:** I rely on the physical chance of tipping the scale, counting the welfare of all who benefit. $\rightarrow$ **Leaf 2**
  *   **C. Evidential Correlation:** I rely on my vote serving as evidence that a large bloc of similar voters will act, thereby influencing the outcome. $\rightarrow$ **Leaf 3**

  ---

  ### **Q4: The Normative Source**
  **Is the value you derive from voting something you would retain even if you were the only person on earth voting, or does it depend on participating in a shared social practice?**
  *   **ONLY PERSON** (Intrinsic) $\rightarrow$ Go to **Q5**.
  *   **SHARED PRACTICE** (Relational) $\rightarrow$ Go to **Q6**.

  ---

  ### **Q5: The Intrinsic Motivation**
  **Is the value derived from the personal satisfaction of expressing your preference, or from the logical obligation to will a universal law?**
  *   **SATISFACTION** $\rightarrow$ **Leaf 4**
  *   **OBLIGATION** $\rightarrow$ **Leaf 5**
      *(Note: See commentary on the fragility of this distinction.)*

  ---

  ### **Q6: The Practice Logic**
  **Is the reason to vote that you must do your fair share of a cooperative scheme, or that voting sustains a norm that produces good consequences?**
  *   **FAIR SHARE** $\rightarrow$ **Leaf 6**
  *   **SUSTAINS NORM** $\rightarrow$ **Leaf 7**

  ---

  ### **Q7: The Rejection Ground**
  **You rejected the pivotality framework. Is the error in the definition of *rationality* (it includes duties) or the definition of *impact* (mattering $\neq$ deciding)?**
  *   **RATIONALITY** (Narrow self-interest was never the only ground) $\rightarrow$ **Leaf 8**
  *   **IMPACT** (Mattering occurs through margin, mandate, or downstream norms) $\rightarrow$ **Leaf 9**

  ---

  ## **Terminal Leaves (Positions)**

  | Leaf | Position Name | Statement of Awkward Commitment | P-Sensitive? |
  | :--- | :--- | :--- | :--- |
  | **1** | **The Debunker** | Voting is instrumentally irrational; voters are either mistaken about the odds or coerced by social pressure. | **YES** (Verdict flips to "Rational" if $P$ is large) |
  | **2** | **Instrumental Altruism** | It is rational to incur a cost for a tiny chance to secure massive benefits for strangers, even if expected value remains borderline. | No (Verdict stays "Rational", magnitude increases) |
  | **3** | **Evidential / Team Reasoning** | My vote is rational because it correlates with a bloc; I must act as if my choice causes theirs, even without causal power. | No (Depends on correlation strength, not $P$) |
  | **4** | **Pure Expressive** | Voting is like cheering for a team; the value is in the expression itself, regardless of whether the team wins. | No |
  | **5** | **Civic Duty / Universalizability** | I am obligated to vote because I cannot logically will that everyone similarly placed abstains, even if my vote changes nothing. | No |
  | **6** | **Coordination / Reciprocity** | I vote because others like me do; it is a matter of fairness to do my part in the scheme, conditional on their participation. | No |
  | **7** | **Rule-Consequentialism** | I vote to sustain the *norm* of voting; if everyone reasoned like the Debunker, the norm would collapse and outcomes would suffer. | No |
  | **8** | **The Dissolutionist** | The paradox is pseudo; rationality includes non-instrumental reasons (duty/expression) so the calculation was never the right test. | No |
  | **9** | **Pivotality-is-Wrong** | The paradox is pseudo; 'mattering' includes shaping the margin, mandate, or downstream norms, not just binary decisiveness. | No |

  ---

  ## **Commentary on Logical Space & Collapses**

  **1. The Expressive/Duty Collapse (Leaves 4 & 5)**
  As anticipated in your brief, **Q5** struggles to prise apart *Pure Expressive* and *Civic Duty*. Both occupy the "Intrinsic/Non-Outcome" space. The distinction rests on whether the agent feels *pleasure* (Expressive) or *obligation* (Duty). In practice, these often run together (I feel good *because* I did my duty). If a student finds this distinction artificial, these leaves collapse into a single **Non-Instrumental Individualist** position.

  **2. The Empty Combination (Self-Interest + Shared Practice)**
  There is no leaf for a student who answers **YES** to **Q4** (Shared Practice) but counts only **Personal Gain** (from **Q3** logic). This combination is logically unstable: if the value depends on a shared practice, the benefit is usually the practice itself (normative) or the collective outcome (altruistic). A "Self-Interested Conformist" exists sociologically but lacks a robust philosophical defense in this tree, as it reduces to irrational herd behavior.

  **3. Rule-Consequentialism vs. Evidential (Leaves 7 & 3)**
  These positions are distinct in the tree (one is Outcome-Dependent, one is Value-Remains), but they often yield identical advice: "Vote because others like you will." **Leaf 3** claims your vote *signals* the bloc's behavior (causal-ish). **Leaf 7** claims your vote *sustains* the norm of the bloc (consequential). They are separable logically but functionally similar in large elections.

  **4. The "P-Swap" Sensitivity**
  Only **Leaf 1 (The Debunker)** changes its verdict if $P(\text{decisive})$ shifts from $10^{-7}$ to $10^{-2}$ (a local race). The Debunker claims voting is *irrational* due to low $P$. If $P$ is high, the calculus ($P \times B - C > 0$) becomes positive, and the Debunker must concede voting is rational. All other leaves justify voting *despite* low $P$, so a high $P$ merely strengthens their position without changing the verdict.

  **5. The Co-Instructor's Verdict**
  Your co-instructor's view ("pseudo-problem") is captured by **Leaves 8 & 9**. The tree makes visible that this verdict requires rejecting **Q1**. If a student accepts **Q1**, they must either accept the Debunker's negative verdict or adopt complex contortions (Altruism, Evidential) to escape it. The "Pseudo-Problem" diagnosis is only available to those who deny that pivotality is the sole measure of rational action or impact.
