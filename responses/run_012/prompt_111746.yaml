answer: |-
  ### Assessment & Strategy

  **1. The Core Insight ("Nobody to Ask")**
  Your distinction is valid and effective. It overlaps with Amartya Sen's "Entitlement Approach" (which argues famines stem from lost rights to access food, not just lack of food), but your phrasing is better for a speech. Sen sounds economic; "nobody to ask" sounds moral and relational. It shifts the focus from *purchasing power* to *accountability*. You lose nothing by dropping the academic term "entitlement"; you gain clarity by keeping your phrasing.

  **2. Fact Check & Contested Readings**
  *   **Ireland (1840s) & Great Leap Forward:** Your summaries are historically robust. Ireland remained a net food exporter; GLF officials punished truth-tellers and exported grain. These are safe to use.
  *   **Bengal (1943):** This is the contested one. Sen famously argued food availability did *not* decline. Later historians (e.g., Tirthankar Roy) argue there *was* a supply shock (cyclone/fungus), though distribution failures remained the primary killer.
      *   *Verdict:* For a 7-minute speech, the Sen interpretation is standard enough to use, but phrase it carefully. Say "food was there" rather than "supply didn't drop," to avoid pedantic pushback from historians in the room.
  *   **Death Tolls:** None included, as requested.

  **3. The Fundraising Risk**
  This framing is risky. If famines are political, donors might think, "Why write a check? Go vote or sanction governments."
  *   **The Fix:** You must position the charity not just as food delivery, but as *presence*. When a government ignores its people, this organization becomes the "someone to ask." Your donation buys leverage and witness, not just calories. I have built this pivot into the speech below.

  **4. Is this a bad idea?**
  No, provided you deliver the pivot correctly. A room of engineers and donors respects systems thinking. Showing them the *bug* in the system (accountability) and how their money patches it (presence) is stronger than emotional guilt-tripping.

  ***

  ### The Speech

  Good evening. I'm a backend engineer. I build systems that handle requests. When a user clicks a button, something has to answer. If nothing answers, the system is broken.

  I'm standing here because I've been looking at the systems behind famine. We tend to think of famine as a natural disaster. A drought. A blight. Not enough food for too many mouths. It feels like physics. Like gravity.

  But looking at the history, the physics don't hold up.

  Take Bengal, 1943. There was war. Prices spiked. But the rice was there. Production hadn't collapsed compared to years before. Yet people starved. Why? Because the food went to Calcutta. It went to the war effort. It went to the people who had priority. The landless laborers had money, but the price moved faster than their wages. They had no claim on the grain.

  Look at Ireland in the 1840s. The potato blight was real. It was biological. But while people starved, ships left Irish ports carrying grain and cattle to England. The food existed. The transport existed. The relief that did arrive came with conditions so harsh people refused them. The system was working exactly as designed. It just wasn't designed for them.

  Or the Great Leap Forward. Local officials were punished if they reported low harvests. So they reported record yields. Based on those lies, the state took grain for export and cities. The grain left the villages while the villages emptied.

  In all three cases, the problem wasn't just that the food was gone. The problem was that the people starving had nobody they could ask.

  Think about that. In a functioning system, if you are in danger, there is someone whose job it is to say yes. A representative. A market mechanism. A safety net. In these famines, that link was cut. There was no one who owed them anything. No one whose job it was to listen. They weren't just hungry; they were invisible to the machinery that decides who eats.

  This is where I need to be careful. I'm asking you for money. If the problem is political, does a check fix it?

  If we just ship grain, we're patching a leak while the pipe is still cracked. But this organization isn't just shipping grain. They are showing up.

  When a government decides a region doesn't matter, this organization goes there. They set up clinics. They log the data. They put eyes on the ground. They become the someone you can ask. They create a record. They create a constituency where there wasn't one.

  Your donation doesn't just buy rice. It buys presence. It buys the leverage to say, "These people are here, and they need to be answered." It forces the system to acknowledge the request.

  Half of you are here because you care deeply. Half are here because there's free dinner. That's fine. But look at the match your employer is offering. That match isn't just doubling the food. It's doubling the signal. It's saying that this room, this company, we are willing to be the ones who ask on behalf of people who have no one else.

  Famines stop when someone is forced to answer. When the cost of ignoring people becomes higher than the cost of feeding them. We can't fix every government tonight. But we can fund the people who make sure the lights stay on in the dark places. We can make sure that when the request comes in, there is a system ready to handle it.

  Don't just feed them. Make sure someone is watching.

  \answer{Starvation is political exclusion.}
