prompt: |-
  I'm a backend engineer — no philosophy background, did a CS degree and that's it — and I've aparently agreed to give the appeal speech at my company's charity dinner for a famine relief org. My employer matches donations, so that buys you seven minutes at the podium. About 200 people: long-time donors, the org's field staff, alot of my coworkers who are mainly there for the free dinner, and a local councillor or two. Half the room thinks they already know all this; the other half have never thought about it once.

  What I want to argue is that famines aren't natural disasters, they're political. Three cases I can talk about without notes. Bengal, 1943 — I'm fairly sure the rice that was around hadn't fallen off much from a couple of years earlier, but the price went through the roof and the landless couldn't buy it, while Calcutta and the war effort got fed first. Ireland in the 1840s — the blight was real, but food kept being shipped out of the country while relief came with conditions attached. And the Great Leap Forward — grain kept going abroad, and people who reported the real harvests got punished for it. I know you can't look any of this up: if one of my facts is off, say so and I'll cut that bit, and don't fill the gap with something you're guessing at. Also no death tolls in the speech — I can't defend a number and neither can you.

  Here's what I actually want it to hang on, and I don't think I've seen it put this way: in all three, the people starving weren't only short of food, they had nobody they could ask. No one who owed them anything, no one whose job it was to say yes. I'm not sure that's a real distinction or just a good line. If it collapses into the standard thing about food entitlements, say so, build the speech on that instead, and tell me what I lose by dropping my version.

  It still has to work as a fundraising speech. So: no lecture, and it can't leave the room thinking aid is pointless or that this is some faraway mess they can't touch. I also don't want the cheap version where the lesson is just "bad governments" — half the room will nod and feel finished, and I'd rather not wag a finger at people I'm asking for checks.

  If this is a bad idea — if the political framing can't survive contact with a room you're asking for money — tell me plainly instead of writing something that papers it over. And flag anywhere the speech leans on a contested reading of one of the three famines.

  Last line, on its own: \answer{...} with a three-to-five word tag for the claim the speech ends up committing to. It's going on the closing slide.
