answer: |-
  Based on the pattern of Maya's past judgments and her specific comment about "paying the price," here is the breakdown of her ethical framework, the alternative rule that fits her data, and how to tell them apart.

  ### 1. Would Maya say the statue toppling is justified?
  **Verdict: No.**

  Maya would almost certainly say this is **not justified**.

  In every single case she labeled "justified" (sit-ins, nurse, doctor, students), the participants **openly identified themselves and accepted the legal consequences** (arrest, prison, guilty plea). In every case she labeled "not justified" (climate protesters, your cousin), the participants **avoided the consequences** (fled the country, ignored tickets).

  Her quote—"you have to be willing to actually pay the price"—is the smoking gun. To Maya, the moral weight of breaking the law comes from the **personal sacrifice** involved. By wearing masks and ensuring they never get caught, the statue topplers are removing the sacrifice. To her, this looks less like civil disobedience and more like vandalism or cowardice.

  ### 2. What is Maya's actual rule?
  **The "Sincerity Through Sacrifice" Rule.**

  *   **The Rule:** Breaking the law for a cause is only justified if the actor openly claims responsibility and willingly submits to the state's punishment.
  *   **Why it fits:**
      *   **Sit-ins/Nurse/Doctor/Students:** All accepted arrest/prison. (Justified)
      *   **Climate Protesters:** Fled bail. (Not Justified)
      *   **Cousin:** Avoids paying tickets. (Not Justified)
      *   **Statue Topplers:** Hid identities/avoided consequences. (Not Justified)
  *   **The Logic:** This is a classic definition of *civil disobedience* (think Martin Luther King Jr. or Gandhi). The logic is that you respect the *rule of law* generally, but oppose a *specific unjust law*. Accepting punishment proves you aren't just a criminal seeking loopholes; it proves your moral sincerity.

  ### 3. What is an alternative rule that fits all her answers?
  **The "Collateral Damage & Legitimacy" Rule.**

  *   **The Rule:** Breaking the law is justified if it serves a legitimate moral cause **AND** does not physically endanger uninvolved third parties. (Whether you get caught is irrelevant).
  *   **Why it fits equally well:**
      *   **Sit-ins/Nurse/Doctor/Students:** All had moral causes and caused no physical danger to bystanders. (Justified)
      *   **Cousin:** No legitimate moral cause (just laziness). (Not Justified)
      *   **Climate Protesters:** **Ambulance got stuck.** This is the key. Even if they hadn't fled, endangering an emergency vehicle risks innocent lives. (Not Justified)
      *   **Statue Topplers:** Legitimate cause, nobody got hurt. (Justified)
  *   **The Logic:** This rule focuses on the *outcome* and the *method*, not the *legal aftermath*. It argues that hiding (masks) is a safety precaution, not a moral failing, as long as no innocent people are physically harmed during the act.

  ### 4. The Test Case (How to split the rules)
  You are right that the statue case is where the rules split. Under Maya's rule, it's **Not Justified**. Under the Alternative rule, it's **Justified**.

  To definitively prove which rule she is actually using, you need a scenario where **Sacrifice** and **Safety** point in opposite directions. Here is the hypothetical case to ask her:

  > **"A group of protesters blocks a bridge to demand climate action. They accidentally block an ambulance for 20 minutes (same as the climate case), causing genuine risk to a patient. However, unlike the climate protesters, this group stays put, gets arrested, and happily serves the jail time."**

  *   **If Maya says "Justified":** She follows the **"Sincerity Through Sacrifice"** rule. The willingness to go to jail "cleanses" the act of the danger they caused.
  *   **If Maya says "Not Justified":** She follows the **"Collateral Damage"** rule. Endangering an innocent life makes the act wrong, regardless of whether they went to jail or not.

  **My bet:** Given her specific phrasing about "paying the price," she will likely say the bridge blockers are **Justified**, confirming that her core value is **accountability**, not just safety.
