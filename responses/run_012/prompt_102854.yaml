answer: |-
  Here is a decision tree designed to cut through the noise. It is built on the underlying philosophical commitments rather than the policy labels themselves. You can hand this out at the start of the session to force people to locate their axioms before they start arguing about Sweden or New Zealand.

  ### The Sex Work Policy Decision Tree

  **Instructions:** Start at Question 1. Follow the path dictated by your answer. Your final destination is a 'Leaf' (a policy position). If you find yourself answering 'It depends', note which variable you are prioritising (e.g., safety vs. morality).

  #### Branch Question 1: The Ontology of the Act
  **Is the exchange of sex for money inherently violative of human dignity, even if the seller consents?**
  *   **Yes:** The transaction itself is harmful; the state should not treat it as normal labour. *(Go to Q2)*
  *   **No:** The transaction is potentially legitimate labour; harm arises from stigma, illegality, or bad conditions, not the act itself. *(Go to Q3)*

  #### Branch Question 2: Moral Culpability (For 'Yes' to Q1)
  **If the trade is inherently harmful, who bears the primary moral responsibility for sustaining it?**
  *   **The Buyer:** Demand drives the exploitation; the seller is a victim or survivor. *(Go to Leaf A)*
  *   **Both Equally:** Both parties are participating in an illicit or harmful act; the transaction itself is the crime. *(Go to Leaf B)*
  *   **The Seller:** (Rare) The seller is corrupting public morals. *(Go to Leaf C)*

  #### Branch Question 3: The Role of the State (For 'No' to Q1)
  **If sex work is legitimate labour, what is the state's primary goal?**
  *   **Safety & Rights:** Remove legal barriers so workers can access standard labour protections and police protection. *(Go to Q4)*
  *   **Control & Containment:** The state must actively manage, zone, and license the industry to separate it from the general public. *(Go to Leaf D)*

  #### Branch Question 4: Third-Party Involvement (For 'Safety & Rights')
  **Should third parties (brothel owners, agencies, managers) be treated like any other business employer?**
  *   **Yes:** They should operate under general employment and business law without specific sex-work licensing. *(Go to Leaf E)*
  *   **No:** Third-party profit is inherently risky; only independent work should be fully decriminalised. *(Go to Leaf F)*

  #### Branch Question 5: Border Precedence (Applies to all Leaves)
  **Does immigration enforcement take precedence over sex worker safety?**
  *   **Yes:** Undocumented workers should be deported, not protected; borders trump labour rights. *(Modifies Leaf to 'Exclusionary')*
  *   **No:** Protections and safety mechanisms must apply universally, regardless of visa status. *(Standard Leaf)*

  ---

  ### The Leaves: Policy Positions & Their Awkward Commitments

  Here are the positions that fall out of the tree. Note that most real-world policies are hybrids, but these are the ideal types.

  **Leaf A: Neo-Abolitionism (The 'Nordic Model')**
  *   *Path:* Q1(Yes) → Q2(Buyer) → Q5(No)
  *   *Policy:* Selling is decriminalised; buying and third-party organising are criminalised.
  *   *Most Awkward Commitment:* "We must accept that driving the market underground increases the physical danger to the very 'victims' we aim to save."

  **Leaf B: Full Prohibition**
  *   *Path:* Q1(Yes) → Q2(Both) → Q5(Yes/No)
  *   *Policy:* Buying, selling, and organising are all criminal offences.
  *   *Most Awkward Commitment:* "We must accept punishing the economically vulnerable person (the seller) as a moral necessity to signal societal disapproval."

  **Leaf C: Moralistic Prohibition (Seller-Focused)**
  *   *Path:* Q1(Yes) → Q2(Seller)
  *   *Policy:* Selling is criminalised; buying is ignored or lightly penalised.
  *   *Status:* **Unoccupied/Incoherent.**
  *   *Why:* Philosophically dead. It views the seller as a moral corrupter but the buyer as a customer. Historically common (e.g., Street Offences Act 1959), now indefensible in modern rights discourse.

  **Leaf D: Legalisation / Regulationism (The 'German Model')**
  *   *Path:* Q1(No) → Q3(Control) → Q5(Yes/No)
  *   *Policy:* Sex work is legal but subject to specific licensing, zoning, and mandatory health checks.
  *   *Most Awkward Commitment:* "We must accept creating a two-tier system where workers outside the licensing scheme (the majority) have fewer rights and less safety than those inside."

  **Leaf E: Full Decriminalisation (The 'New Zealand Model')**
  *   *Path:* Q1(No) → Q3(Safety) → Q4(Yes) → Q5(No)
  *   *Policy:* Sex work is treated like any other business; criminal laws specific to sex work are repealed.
  *   *Most Awkward Commitment:* "We must accept that it is harder to distinguish between consensual sex work and coercive trafficking within a fully normalised commercial infrastructure."

  **Leaf F: Partial Decriminalisation**
  *   *Path:* Q1(No) → Q3(Safety) → Q4(No)
  *   *Policy:* Selling and buying are legal, but brothel-keeping or working together remains criminalised.
  *   *Most Awkward Commitment:* "We must accept that forcing workers to operate alone for 'safety' actually prevents them from hiring security or working in pairs, increasing isolation."

  **Leaf G: Exclusionary Decriminalisation**
  *   *Path:* Any 'No' to Q1 path → Q5(Yes)
  *   *Policy:* Rights exist on paper, but migrant workers fear deportation if they report abuse.
  *   *Most Awkward Commitment:* "We must accept that a significant portion of the workforce will remain unprotected by the very laws designed to keep them safe."

  ---

  ### Unoccupied and Indistinguishable Spaces

  **1. The 'Seller-Only' Crime (Leaf C)**
  *   **Status:** *Incoherent/Unattractive.*
  *   **Why:** In the 19th and early 20th centuries, this was the norm (punish the prostitute, ignore the john). Today, it is logically unstable. If the act is inherently harmful (Q1=Yes), the buyer is the cause. If it is labour (Q1=No), the seller is a worker. There is no modern philosophical framework that successfully argues the seller is the *sole* criminal without relying on outdated gendered moralism.

  **2. Decriminalisation vs. Light Legalisation**
  *   **Status:** *Indistinguishable in practice.*
  *   **Why:** The tree separates these at Q4 (General Law vs. Licensing). However, in reality, a 'licensing' scheme that is cheap, non-zoned, and rights-based looks exactly like decriminalisation. Conversely, decriminalisation often accrues local bylaws (zoning) that look like licensing. The debate here is often semantic rather than substantive.

  **3. The 'Exit-Only' Gap**
  *   **Status:** *Unexplored/Unstable.*
  *   **Why:** Some argue for no criminal law at all, but also no labour recognition, just state-funded exit services. This falls between Leaf A and Leaf E. It is unstable because without labour rights (Leaf E), workers cannot organise to demand safety, and without criminalising demand (Leaf A), the market doesn't shrink. It relies on voluntary exit in a capitalist market, which rarely works at scale.

  ---

  ### Concrete Cases: Where the Tree Bites

  Use these scenarios to test your group's consistency. If their policy answer contradicts their branch answer, they are talking past each other.

  **1. The Migrant Worker with No Papers**
  *   *The Case:* A woman on an expired visa is working indoors. She is robbed by a client but fears calling the police.
  *   *Tests:* **Branch 5 (Border Precedence).**
  *   *The Bite:*
      *   **Leaf E (Decrim)** says she must be able to report the robbery without deportation.
      *   **Leaf G (Exclusionary)** says border control is paramount; she is an illegal worker first.
      *   **Leaf A (Nordic)** says she is a victim of trafficking, so she should get a visa *if* she agrees to exit the trade. If she wants to keep working, she is still out of luck.
  *   *Forced Leaf:* If you say "She should be safe but also deported," you are holding two incompatible leaves.

  **2. The 'Financial Necessity' Worker**
  *   *The Case:* A single parent says, "I hate this work, but it pays three times more than my other options. I am not coerced by a pimp, but by poverty."
  *   *Tests:* **Branch 1 (Ontology) & Branch 2 (Culpability).**
  *   *The Bite:*
      *   **Leaf A (Nordic)** treats her as a victim of structural coercion. The state should pay her to stop. It denies her agency to choose the 'least bad' option.
      *   **Leaf E (Decrim)** treats her as a worker making a rational choice under constraints. It offers safety but doesn't solve the poverty.
      *   **Leaf B (Prohibition)** treats her as a criminal contributing to social harm.
  *   *Forced Leaf:* If you say "She's a victim but should be allowed to work," you are mixing Leaf A's diagnosis with Leaf E's prescription.

  **3. The Disabled Client**
  *   *The Case:* A man with severe cerebral palsy cannot form relationships without paying for intimacy. He argues sex work is a essential care service.
  *   *Tests:* **Branch 1 (Ontology/Dignity).**
  *   *The Bite:*
      *   **Leaf A (Nordic)** struggles here. If sex is inherently dignitary harm, it cannot be 'care'. They often have to make awkward exceptions for 'sexual surrogacy'.
      *   **Leaf E (Decrim)** accommodates this easily; it is a service transaction like any other.
      *   **Leaf D (Legalisation)** might allow it only in specific 'care' zones, medicalising the client.
  *   *Forced Leaf:* If you support the Nordic Model but think this client *should* have access, you have to explain why the harm principle suspends for disability.

  **4. Street-Based vs. Indoor Work**
  *   *The Case:* Street work is more visible and often associated with higher rates of addiction and violence. Indoor work is quieter and safer.
  *   *Tests:* **Branch 3 (State Goal) & Branch 4 (Third Parties).**
  *   *The Bite:*
      *   **Leaf D (Legalisation)** often bans street work (zoning) to protect 'public order'. This pushes the most vulnerable workers back into danger.
      *   **Leaf A (Nordic)** claims to help street workers exit, but criminalising the buyer makes street work (which relies on quick negotiation) much more dangerous than indoor work.
      *   **Leaf E (Decrim)** allows both, relying on workers to organise safety.
  *   *Forced Leaf:* If you want to ban street work to 'clean up the neighbourhood' but claim to prioritise worker safety, you are prioritising public aesthetics over the safety of the most vulnerable workers (Leaf D logic masking as Leaf A).

  ### Facilitator's Note for the Debate
  The most common failure mode in this debate is **diagnostic drift**. Someone will argue for the Nordic Model (Leaf A) using the logic of Decriminalisation (Leaf E).
  *   *Example:* "We need the Nordic model because it keeps workers safe from violence."
  *   *Correction:* "Leaf A argues safety comes from shrinking the market. Leaf E argues safety comes from integration. Evidence suggests criminalising buyers shrinks the market but increases violence per transaction. You cannot claim Leaf A delivers Leaf E's safety outcomes without evidence."

  Use the tree to pin them down: "Which branch are you on? Do you think the act is inherently harmful, or just the conditions?" Once they answer that, the policy label must follow.
