  ### Brainstorming Candidate Concepts

  1.  **Persuasive Definition (Stevenson)**
      *   *Fit:* Involves redefining a term to influence acceptance of a claim.
      *   *Miss:* Primarily targets *emotive attitude* or moral valuation; the phenomenon you describe targets *epistemic conditions* (what counts as evidence), which is a stronger, structural change than mere persuasion.

  2.  **Theory-Ladenness of Observation (Hanson/Kuhn)**
      *   *Fit:* Acknowledges that descriptions are never neutral and depend on background theory.
      *   *Miss:* Describes the *inevitability* of bias in perception; it does not name the *argumentative move* of strategically using that description to preempt evidential weighing.

  3.  **Begging the Question (Petitio Principii)**
      *   *Fit:* The conclusion is assumed in the premises; here, the classification (conclusion) assumes the evidential standard (premise).
      *   *Miss:* Too broad. It covers any circularity; it does not isolate the specific mechanism of *classification* determining *evidential admissibility*.

  4.  **Definitional Stop (Informal Logic)**
      *   *Fit:* Using a definition to halt further inquiry or argument.
      *   *Miss:* Often implies ending the conversation entirely; your phenomenon allows inquiry to continue but under rigged evidential rules set by the definition.

  5.  **Explanatory Exclusion (Kim)**
      *   *Fit:* One explanation (physical) excludes another (mental) if the first is sufficient.
      *   *Miss:* Concerns *causal ontology* (what caused the event), not *epistemic standards* (what evidence is required to believe the description).

  6.  **Hinge Propositions (Wittgenstein)**
      *   *Fit:* Certainties that stand fast and allow evidence to function.
      *   *Miss:* Hinges are usually *background* and uncontested; your phenomenon involves a *contested* classification that functions *as* a hinge to block evidence.

  7.  **Incommensurability (Kuhn/Feyerabend)**
      *   *Fit:* Different paradigms cannot adjudicate disputes because they see different things.
      *   *Miss:* Describes the *state of impasse*, not the specific *move* of deploying a description to create that impasse.

  8.  **Epistemic Framing**
      *   *Fit:* How a problem is presented affects judgment.
      *   *Miss:* Usually psychological/cognitive; lacks the normative/argumentative precision of setting evidential standards via classification.

  ### Analysis and Decision

  None of the established concepts carve the phenomenon exactly where you want it.
  *   **Persuasive Definition** is the closest standard term in philosophy of language, but as you noted, it focuses on emotive force rather than evidential structure.
  *   **Theory-Ladenness** explains *why* it happens, not *what the move is*.
  *   **Definitional Stop** is close but too informal and often implies halting inquiry rather than rigging its standards.

  The phenomenon is a specific argumentative strategy where a **classification** is treated as a **constitutive rule** that determines **evidential relevance**, thereby preempting the need for empirical weighing. It treats a metaphysical or theoretical commitment as if it were a neutral description of the data.

  Since no single canonical term captures this specific intersection of classification, evidence, and preemption, I will coin a term that precisely marks the boundaries you described.

  **Coined Term:** **Classificatory Preemption**

  **Definition:** The argumentative move wherein a contested classification of an event is used to determine the admissibility or weight of evidence regarding that event, thereby settling the evidential question prior to empirical evaluation.

  ### Boundary Cases

  **Falls Inside (Instances of Classificatory Preemption):**
  1.  **The Humean Miracle Denial:** Classifying an event as a "violation of natural law" (miracle) automatically assigns it a probability of zero relative to testimony, regardless of the quality of the testimony. The classification preempts the evidence.
  2.  **Methodological Naturalism in Anomaly Resolution:** A scientist classifies a statistically significant outlier as "instrumental noise" rather than "new data." This classification dictates that no further evidence needs to be gathered to explain it, preempting the possibility of paradigm shift.

  **Falls Outside (Nearby but Distinct):**
  1.  **Simple Persuasive Definition:** Calling a tax "relief" instead of "spending" to make it sound positive. This changes *attitude*, but does not change what evidence counts to verify the fiscal transaction.
  2.  **Theory-Laden Observation:** A physicist seeing a "cloud chamber track" vs. a layperson seeing "fog." This is a difference in *perception* due to training, not a strategic move to block evidence in an argument.

