answer: |-
  ### The Principle of Functional Sortition

  The principle that best unifies your verdicts distinguishes between **allocating outcomes** among equals and **selecting agents** to deliberate, while prohibiting sortition where **accountability**, **merit**, or **rights** are paramount.

  **The Principle:**
  Sortition is appropriate if and only if the decision falls into one of two categories:
  1.  **Fair Allocation:** The direct distribution of a scarce good or burden among a class of claimants with equal moral standing, *provided* that eligibility criteria and the terms of allocation (e.g., compensation, medical need) are established by non-lottery means.
  2.  **Deliberative Selection:** The selection of agents to investigate facts, advise, or adjudicate specific cases, *provided* they do not wield final, unreviewable authority over general substantive policy.

  Sortition is inappropriate if the decision falls into any of these three categories:
  3.  **Rights by Chance:** The determination of a fundamental right via direct lottery without deliberative adjudication.
  4.  **Meritocratic Selection:** The choice of an individual based on specific competence, expertise, or fitness for a role.
  5.  **Sovereign Policy:** The exercise of final binding authority over general laws or political direction where public accountability is required.

  ---

  ### Mapping the Verdicts to the Principle

  **Category 1: Fair Allocation (Appropriate)**
  *   **Case 4 (Kidney):** Fits **Fair Allocation**. Claimants have equal medical standing; terms (prognosis, consent) are settled medically.
  *   **Case 5 (Conscription):** Fits **Fair Allocation**. Burden is unavoidable; terms (exemptions) are legally settled to ensure equality.
  *   **Case 6 (Dormitory):** Fits **Fair Allocation**. Equal claimants (students); low-stakes good.
  *   **Case 10 (Speaker Order):** Fits **Fair Allocation**. Procedural good; equal claimants.
  *   **Case 8 (Hazardous Waste):** Fits **Fair Allocation** *only* when compensation/consent is negotiated (terms settled). It is **inappropriate** "by itself" because the terms are not yet settled, violating the proviso in Category 1.

  **Category 2: Deliberative Selection (Appropriate)**
  *   **Case 1 (Jury):** Fits **Deliberative Selection**. Jurors are selected to adjudicate *specific cases* (facts), not general policy.
  *   **Case 2 (Citizens' Assembly):** Fits **Deliberative Selection**. They propose (advise) but lack final authority (subject to vote).
  *   **Case 7 (Scientific Panel):** Fits **Deliberative Selection**. Selects experts to decide on specific grants/reviews, reducing bias without setting general policy.

  **Category 3: Rights by Chance (Inappropriate)**
  *   **Case 9 (Asylum):** Fits **Rights by Chance**. Asylum is a right; a direct lottery bypasses the required deliberative adjudication of the claim.

  **Category 4: Meritocratic Selection (Inappropriate)**
  *   **Case 6 (Professor):** Fits **Meritocratic Selection**. Hiring requires assessing specific competence.
  *   **Case 10 (Dept Chair):** Fits **Meritocratic Selection**. Leadership requires fitness for the role.

  **Category 5: Sovereign Policy (Inappropriate)**
  *   **Case 3 (Lottocratic Legislature):** Fits **Sovereign Policy**. Final authority over ordinary law requires accountability and continuity.
  *   **Case 7 (Bridge):** Fits **Sovereign Policy**. Deciding to build infrastructure is a substantive policy choice, not a selection of deciders.
  *   **Case 8 (Waste, un-negotiated):** Also fits **Sovereign Policy**. Imposing a facility without consent is a political imposition requiring accountability, not just fair division.

  ---

  ### Accommodation of Verdicts

  This principle accommodates **all ten** of your verdicts without requiring you to give any up.

  However, it relies on a critical distinction to resolve the tension between **Case 1 (Jury)** and **Case 9 (Asylum)**, both of which involve rights (liberty vs. asylum). The principle distinguishes between *selecting a deliberative body* to adjudicate a right (Jury, appropriate) and *using a lottery to determine the outcome* of a right without deliberation (Asylum Lottery, inappropriate). If you view the Jury verdict as relying on the jury's deliberation rather than the method of their selection, the principle holds. If you believe the Jury verdict relies *solely* on the randomness of selection regardless of deliberation, Case 1 would have to be sacrificed to preserve the prohibition on deciding rights by lot (Case 9).

  The principle also clarifies your doubt regarding **Case 2 vs. Case 3**. The distinction is indeed **Final Authority** (Category 2 vs. Category 5). The Citizens' Assembly is a deliberative filter; the Lottocratic Legislature is a sovereign power.

  Regarding **Case 4 vs. Case 8**, the principle clarifies that the difference is **Settled Terms** (Category 1 proviso). Kidneys have medically settled terms; waste sites require politically negotiated terms. A lottery is only fair once the terms are equalized (via compensation/consent).

  ---

  ### Application to New Cases

  **(a) A citizens' assembly selected by lot with binding authority over a city budget.**
  *   **Verdict:** **Inappropriate.**
  *   **Reasoning:** This violates **Category 5 (Sovereign Policy)**. While a citizens' assembly is usually appropriate for *proposing* (Case 2), granting it *binding authority* over a budget moves it from deliberative selection to sovereign policy. Budgets are general substantive policy requiring accountability (election) rather than representative sampling (sortition).

  **(b) A lottery among all residents to decide which language will be taught in public schools.**
  *   **Verdict:** **Inappropriate.**
  *   **Reasoning:** This violates **Category 5 (Sovereign Policy)** and potentially **Category 3 (Rights)**. Language policy is a general substantive rule, not a divisible good allocated among equals. It affects cultural rights and requires accountable decision-making, not a direct lottery among the populace.

  ---

  ### Sortition vs. Election for the Legislature

  **Verdict:** The principle favors **Election** for the ordinary business of a legislature.

  **Why:**
  The ordinary business of a legislature involves enacting general laws, allocating public resources, and setting political direction. Under this principle, these tasks fall squarely into **Category 5 (Sovereign Policy)**.
  1.  **Accountability:** Ordinary legislation requires a mechanism for the public to punish or reward decision-makers based on outcomes (retrospective voting). Sortition severs the link between decision and electoral consequence.
  2.  **Competence:** While legislators need not be experts, they require experience and continuity to manage complex policy trade-offs, which sortition disrupts.
  3.  **Authority:** Unlike a jury (specific facts) or a citizens' assembly (advisory), a legislature wields final binding authority. The principle restricts such authority to bodies that can be held accountable, which elections provide.

  Sortition is reserved for the legislature only in auxiliary roles (e.g., selecting committee chairs to reduce partisanship, or convening advisory assemblies), but not for the final enactment of law.
