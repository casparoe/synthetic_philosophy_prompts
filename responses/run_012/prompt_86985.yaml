answer: |-
  1. Exam Question: Consider the "triviality argument" in philosophy of mind: given any physical object (e.g., a rock) and any finite-state machine, one can construct a mapping between the object's physical states and the machine's states such that the object formally "implements" the machine. Suppose we map a rock to a computational architecture identical to one we believe grounds suffering in humans. (A) Distinguish sharply between the attribution of computation (does the rock run the program?) and the grounding of moral status (does the rock matter?). (B) If you argue the rock does not suffer despite the mapping, explain why trivial implementations fail to ground moral status without resorting to neuro-chauvinism (i.e., you cannot simply claim "only neurons count"). (C) Address the lookup-table objection: if a system produces identical outputs to a sufferer via pre-stored responses rather than internal dynamics, does it suffer? Why or why does this distinction matter for the rock case? (D) Finally, identify the weakest link in your own argument: where does your reasoning risk circularity, and what empirical or conceptual evidence would change your mind about the rock's moral status? Answer in essay form.

  2. Model Answer: The triviality argument demonstrates that computational attribution is observer-relative. Any physical system possesses enough state differentiation to be mapped onto any finite-state machine, provided the mapping is sufficiently gerrymandered. However, moral status cannot be observer-relative; suffering must be intrinsic to the system, not dependent on an external interpreter's choice of mapping. Therefore, we must distinguish between formal implementation (attribution) and causal implementation (grounding). A rock does not suffer because the mapping required to see it as computing a suffering mind does not reflect its actual causal dynamics. The rock's states do not counterfactually support the transitions required by the program; the connection is imposed post-hoc, not enacted by the system's physics.

  This distinction resolves the lookup-table problem. A lookup table produces correct outputs but lacks the internal causal structure that mediates inputs and outputs through state transitions. If moral status grounds in computation, it must ground in the dynamic processing of information, not merely the disposition to behave appropriately. A system that retrieves pain-responses from a static list does not undergo the process that constitutes suffering; it simulates the effect without the cause. Similarly, the rock simulates the program only under a description, not in its causal operation. To ground moral status, the computation must be causally robust—the system must arrive at outputs because of its internal state transitions, not merely in correlation with them.

  However, avoiding neuro-chauvinism requires specifying what makes a causal structure "real" without privileging biology. We must appeal to non-triviality: the system's states must be grouped by causal similarity, not arbitrary mapping. If the physical states grouped as "State A" share no causal powers relevant to the transition to "State B," the implementation is trivial. Moral status likely attaches to systems where the computational structure mirrors the causal structure tightly, ensuring the system is sensitive to counterfactuals in a way that matters for welfare.

  The weakest link in this reasoning is the assumption that causal robustness necessarily grounds moral status. I have argued that trivial implementations fail because they lack causal power, but I have not proven why causal power matters morally. It is possible that moral status is primitive or attaches to something else entirely, such as phenomenological unity, which causal structure merely facilitates. My reasoning would fail if it turned out that consciousness is substrate-independent in a stronger sense than causality allows—for instance, if the abstract pattern itself held moral weight regardless of instantiation. I would change my mind about the rock if it could be shown that the mapping itself creates a genuine relational property that generates value, or if evidence emerged that suffering is purely behavioral with no internal requirement. Until then, the rock remains inert because its computation exists only for us, not in itself.

  3. Top-Tier Criteria: To earn top marks, the essay must sharply distinguish computational attribution (observer-relative) from moral grounding (intrinsic). It must argue that trivial mappings fail because they lack counterfactual-supporting causal structure, not because of the substrate. It must explicitly handle the lookup-table case by distinguishing dynamic processing from static retrieval, linking this to the rock's lack of internal dynamics. Crucially, it must avoid neuro-chauvinism by defining "real" implementation via causal robustness rather than biological material. Finally, it must identify a specific philosophical weak spot (e.g., why causality matters morally) and specify conditions for changing its mind, demonstrating meta-cognitive awareness of the argument's limits.

  4. Solid-but-Not-Top Criteria: A solid answer will correctly identify that the rock does not suffer and will appeal to causal structure or non-trivial implementation to explain why. It will likely address the lookup-table objection by noting the lack of internal state dynamics. However, it may blur the line between attribution and grounding, treating the failure of implementation as automatically solving the moral question without explicitly separating the two concepts. It may also struggle to articulate why causal structure matters morally without subtly slipping into substrate bias, or it may offer a generic admission of uncertainty rather than a specific identification of the argument's weakest logical link.

  5. The Capping Mistake: The answer fails to reach a solid grade if it asserts that functionalism solves the problem without addressing the triviality objection. Specifically, if the student claims that "if it behaves like it suffers, it suffers" (ignoring the lookup-table objection) or argues that "rocks don't have brains, so they don't compute" (neuro-chauvinism), they cap below solid. The critical error is conflating the existence of a formal mapping with the existence of a morally relevant computation, thereby making moral status dependent on the observer's description rather than the system's intrinsic properties.
