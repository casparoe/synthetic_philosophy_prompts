answer: |-
  **Project Title:** The Metaphysics of Intention: A Structural Stress-Test of the Toxin Puzzle

  **Project Summary**
  This project proposes a reorientation of the philosophical discourse surrounding Gregory Kavka's Toxin Puzzle. Standard treatments frame the puzzle as a problem for decision theory, asking whether it is rational to form an intention to perform an action one knows one will not execute. This project argues that this framing presupposes a coherent account of intention that does not exist. The research will treat the puzzle not as a decision-theoretic paradox but as a metaphysical stress test. By generating a controlled family of puzzle variants that isolate specific structural features of intention (formation, readout, and binding force), the project will evaluate candidate theories of intention against these variants. The goal is not to solve the puzzle, but to map which theories of intention break under which structural constraints, thereby clarifying the metaphysical commitments required to make the puzzle coherent.

  **Research Question**
  Existing literature treats the Toxin Puzzle as a question of rational permissibility: *Can a rational agent intend to drink the toxin?* This question remains open because it assumes "intention" is a stable input for decision theory. This project asks a prior, determinate question: **Which candidate theories of intention remain logically coherent when subjected to a structured family of Toxin Puzzle variants that isolate specific metaphysical constraints?**

  The answer will take the form of a matrix mapping specific theories of intention (e.g., intention as plan, as commitment, as expectation) against specific structural variants (e.g., probabilistic payoff, mechanical induction). A determinate answer is achieved when we can specify, for each theory, exactly which variant renders it incoherent.

  **Background and Problem Statement**
  Since Kavka introduced the puzzle, the dominant strategy has been to adjust the principles of rationality. Some argue for resolute choice; others argue for evidential decision theory; still others argue the intention is simply impossible. However, nearly all these approaches treat "intention" as a black box. They assume an agent can, in principle, toggle an intention on or off at will, that this state is legible to an external observer (the offerer), and that holding this state does not necessitate the action.

  This assumption is the weak point. Few theories of intention in the philosophy of action are designed to satisfy all three conditions simultaneously.
  1.  **Deliberate Formation:** The agent can choose to intend at will.
  2.  **Reliable Readout:** The intention is detectable prior to action.
  3.  **Non-Binding:** The intention does not causally necessitate the action.

  Standard decision-theoretic approaches bypass the tension between these conditions. They ask if it is *smart* to intend, not if the proposed mental state is *possible* given our best theories of what intentions are. By focusing on the rationality of the agent rather than the nature of the mental state, existing treatments leave the metaphysical prerequisites of the puzzle unexamined. Consequently, the debate stalls in a loop of competing rationality principles without resolving whether the scenario describes a possible mind.

  **Methodology**
  The project employs a method of **Structural Variant Analysis**. Rather than arguing for a single solution, I will construct a family of puzzle variants. Each variant will hold the core scenario constant while altering exactly one structural feature of the intention-payoff loop. These variants will then be used as test cases for three leading candidate theories of intention.

  *Step 1: Formalizing the Constraints*
  The first month will be dedicated to rigorously defining the three constraints implicit in the original puzzle (Formation, Readout, Non-Binding). This involves translating the informal puzzle description into a set of necessary conditions that any theory of intention must satisfy to allow the puzzle to get off the ground.

  *Step 2: Generating the Variant Family*
  I will construct three specific variants, each designed to stress a different constraint:
  1.  **The Probabilistic Variant (Stressing Non-Binding):** The reward is paid with probability *p* < 1 if the intention is formed, but the toxin must still be drunk if the reward is received. This tests whether the intention can remain distinct from the action when the expected utility calculation shifts. It isolates the link between intention and future action.
  2.  **The Mechanical Variant (Stressing Deliberate Formation):** The agent can take a pill that chemically induces the intention to drink the toxin. The intention is not formed by reasoning but by causal intervention. This tests whether "intention" requires rational formation or if it is merely a causal precursor. If the pill works, intention is detachable from rationality; if it doesn't, intention is essentially normative.
  3.  **The Predictor Variant (Stressing Reliable Readout):** The reward is based not on a scan of the intention itself, but on the prediction of a highly reliable external observer (Newcomb-style). This separates the metaphysics of the mental state from the epistemology of its detection. It tests whether the theory of intention can accommodate external legibility without collapsing into determinism.

  *Step 3: Theory Testing*
  I will test three prominent theories of intention against this family of variants:
  1.  **Intention as Plan (Consistency Norms):** Following the Bratmanian model, where intention is a partial plan subject to norms of consistency and means-end coherence.
  2.  **Intention as Commitment (Self-Binding):** Following the Gauthierian model, where intention is a constraint on future choice to overcome time-inconsistency.
  3.  **Intention as Self-Fulfilling Expectation:** Following the Vellemanian model, where intending is believing one will act, where the belief helps cause the action.

  For each theory-variant pair, I will analyze whether the theory can describe the agent's state without contradiction. For example, can the "Intention as Plan" model accommodate the Mechanical Variant? If a plan must be formed through practical reasoning, a pill-induced state might not count as a plan, causing the theory to fail the variant.

  **Justification of Approach**
  Why pursue this metaphysical mapping rather than proposing a fourth principle for decision theory? Adding principles (e.g., "it is rational to intend if...") treats the symptom, not the disease. If the mental state described by the puzzle is metaphysically incoherent—like a "married bachelor"—no amount of decision-theoretic tinkering will make it rational to have one.

  Decision theory takes preferences and beliefs/intentions as inputs. If the inputs are ill-defined, the output is garbage. The standard literature assumes the input is valid and tweaks the processing rules. This project argues that the input itself is the problem. By isolating which structural features break which theories, we learn something substantive about the nature of intention that a decision-theoretic fix obscures. If, for instance, only the "Self-Fulfilling Expectation" theory survives the Mechanical Variant, that suggests intention is essentially cognitive rather than conative. This yields philosophical progress regarding the architecture of agency, regardless of whether one ultimately drinks the toxin.

  **Work Plan and Schedule**
  The project is designed for a single researcher over a three-month summer period.

  *Month 1: Structural Formalization and Variant Construction*
  *   **Weeks 1-2:** Draft rigorous definitions of the three constraints (Formation, Readout, Non-Binding). Review internal notes on the logical dependencies between these constraints.
  *   **Weeks 3-4:** Construct the three variants (Probabilistic, Mechanical, Predictor). The deliverable is a set of "puzzle specs" where each variant is described precisely enough to be tested against a formal theory.
  *   *Milestone:* A document detailing the Variant Family and the specific constraint each is designed to isolate.

  *Month 2: Theory Application and Stress Testing*
  *   **Weeks 5-6:** Apply the "Intention as Plan" and "Intention as Commitment" theories to the variants. Identify points of contradiction or incoherence.
  *   **Weeks 7-8:** Apply the "Intention as Expectation" theory. Begin drafting the comparative matrix.
  *   *Milestone:* A completed "Stress Test Matrix" showing pass/fail status for each theory-variant pair, with annotated reasoning for each failure.

  *Month 3: Synthesis and Final Reporting*
  *   **Weeks 9-10:** Analyze the patterns in the matrix. What do the failures tell us about the metaphysics of intention? Draft the core argument.
  *   **Weeks 11-12:** Finalize the paper. Ensure the distinction between "rationality" and "metaphysical possibility" is clear throughout.
  *   *Milestone:* Final manuscript (approx. 8,000 words) ready for submission to a philosophy journal.

  **Scope and Tractability**
  This scope is tight but tractable for a single researcher without lab support. The work is purely conceptual and analytical.
  *   **Tractable:** The construction of variants and the logical testing of theories against them are well-suited to solitary philosophical work. The three theories selected are distinct enough to yield clear differences in the stress test.
  *   **Potential Cuts:** If the "Predictor Variant" proves too entangled with the literature on Newcomb's Problem, it will be dropped in favor of a simpler "Delayed Readout" variant. Similarly, if the "Intention as Commitment" theory collapses entirely into decision theory, I will narrow the focus to just the Plan and Expectation models. The goal is the *method* of testing, not an exhaustive survey of every theory of intention.
  *   **Risk:** The primary risk is that the variants turn out to be logically equivalent to the original puzzle, yielding no new discriminatory power. To mitigate this, Month 1 is dedicated to ensuring the structural independence of the variants before proceeding to testing.

  **Failure Conditions**
  It is vital to define what constitutes project failure, distinct from a negative result. A negative result (e.g., "no theory survives") is a successful outcome of the research. Failure would occur if the **framing** proves incorrect.

  1.  **Collapse of Variants:** If, upon formalization, the Probabilistic, Mechanical, and Predictor variants turn out to be logically isomorphic to the original puzzle regarding their demands on intention, the method fails. The project relies on the variants isolating *different* constraints. If they all reduce to "Can you intend what you won't do?", the structural analysis adds no value.
  2.  **Theory Immunity:** If the candidate theories are sufficiently flexible to accommodate all variants without modification (e.g., by redefining terms ad hoc), the stress test lacks bite. If every theory passes every test, the puzzle does not successfully discriminate between metaphysical accounts of intention.
  3.  **Category Error:** If it becomes evident during Month 1 that the constraints (Formation, Readout, Non-Binding) are not metaphysical constraints but merely epistemic ones, the core thesis is wrong. The project assumes the puzzle reveals something about the *nature* of intention. If it reveals only something about our *knowledge* of intention, the project must pivot significantly.

  **Conclusion**
  The Toxin Puzzle has been a staple of rational choice theory for decades, yet it has produced little consensus. This project suggests the stalemate exists because we are asking decision theory to do metaphysics. By shifting the focus to the structural prerequisites of the puzzle itself, this research aims to convert a paradox of rationality into a tool for analyzing the architecture of agency. The deliverable is not a solution to the puzzle, but a map of the theoretical landscape that shows us why the puzzle is so hard to solve. This fits the scope of a summer grant: focused, methodologically specific, and capable of producing a definitive, publishable result regardless of whether the "answer" is positive or negative.
