answer: |-
  ### Q&A PREP SHEET: LANGUAGE, OBLIGATION AND THE STATE

  **1. The 'State Trumps' Objection (The Nightmare)**
  *Who:* The sharp criminal lawyer or public law theorist.
  *The Question:* "You're arguing that a self-binding act fails if the speaker doesn't 'take it up'. But in law, if I resign from a office via the proper channel, or waive a right in court, the state recognises that act regardless of my internal normative standing. If the conventions are satisfied, the state says the act is done. Are you seriously suggesting a legal subject can evade the consequences of their performative utterances by claiming a 'non-take'? If not, what work is this doing for us?"
  *The Two-Minute Reply:* I am not suggesting the 'non-take' voids the legal effect where the state has constitutive power over the status—resignation from a public office is indeed state-regulated. My claim concerns the *normative ground* of the obligation prior to state enforcement. In contexts like waiver of rights or sentencing mitigation (e.g., expressions of remorse), the law often looks to the sincerity and uptake of the agent to determine weight. If the agent never 'took up' the waiver, the state may recognise the form, but the *obligation* remains hollow. I'm arguing the law ought to recognise this gap between conventional validity and normative bindingness, particularly where liberty is at stake.
  *Where the Reply is Soft:* It concedes that in hard positive law, the state's view prevails. This risks making the theory merely critical rather than descriptive of current doctrine.
  *Concede Up Front:* Accept that where statutory formalities are met, the legal act stands. Clarify that your claim is about the *moral legitimacy* of enforcing that act, or about areas where law incorporates subjective uptake (like contract formation or mens rea).

  **2. The 'Felicity Condition' Objection**
  *Who:* The Austinian.
  *The Question:* "Austin covers this under Felicity Condition Gamma: the participant must subsequently conduct themselves consistently with the act. If they don't 'take it up', it's a misfire or an abuse, not a new category. You're reinventing the wheel and calling it a tyre."
  *The Two-Minute Reply:* Austin's 'conduct' condition looks at subsequent behaviour as evidence of the act's validity. My 'non-take' is contemporaneous. It's not that I failed to walk the walk later; it's that the normative hook never caught at the moment of speech because the reflexive uptake was missing. In self-binding, the 'hearer' is the 'speaker'. Austin's machinery is dyadic (speaker/hearer); I'm proposing a monadic structure where the split prevents the act from landing. It's not a misfire of convention, but a failure of internal reception.
  *Where the Reply is Soft:* Austin's texts are sparse on self-binding. You are extrapolating, which an Austinian purist will spot.
  *Concede Up Front:* Concede that Austin hints at this under 'infelicities', but insist the distinction is analytically useful for law, where 'misfire' implies voidness and 'abuse' implies validity but blame. 'Non-take' is neither.

  **3. The 'Doctrinal Cash-Out' Objection**
  *Who:* The Contract Law scholar.
  *The Question:* "Contract law doesn't enforce promises to oneself. Criminal law doesn't care if you 'feel' bound. Where does this actually land? If there's no cause of action, is this just moral philosophy wearing legal clothes?"
  *The Two-Minute Reply:* It lands in the gaps. Consider unilateral waivers of contractual rights, or the withdrawal of a confession. In *R v. Turner*, the court looks at whether the defendant understood the plea. That's a 'take-up' condition. In contract, estoppel often relies on the party conducting themselves as bound. I'm suggesting we formalise the 'non-take' to protect agents from hollow self-obligations that the law might otherwise enforce via estoppel or strict liability. It explains why we allow withdrawal of pleas but not withdrawal of signed contracts.
  *Where the Reply is Soft:* Estoppel relies on reliance by the *other* party, not your own uptake.
  *Concede Up Front:* Concede this is not a new cause of action. It is a hermeneutic tool for interpreting existing doctrines of waiver, confession, and remorse.

  **4. The 'Constitutive Rules' Objection**
  *Who:* The Searlean.
  *The Question:* "Searle settled this. Constitutive rules create the reality. If you satisfy the rules (X counts as Y in context C), the act exists. If you say the act doesn't bind because of a 'non-take', you're saying the rules weren't satisfied. You're contradicting yourself."
  *The Two-Minute Reply:* Searle's rules account for institutional facts, not necessarily normative force on the conscience. I can create an institutional fact (e.g., 'I hereby resign') without creating a binding moral obligation if the reflexive uptake is absent. The 'non-take' argues that for self-binding, the 'context C' includes the speaker's own normative reception. If that's missing, the constitutive rule is formally met but functionally inert.
  *Where the Reply is Soft:* Searleans view institutional facts as brute reality within the system. Distinguishing 'fact' from 'force' is tricky.
  *Concede Up Front:* Concede that within a closed institutional system (like chess), the move stands. Argue that law is not chess; it requires normative assent for legitimacy.

  **5. The 'Subjectivity Trap' Objection**
  *Who:* The Criminal Law practitioner.
  *The Question:* "If 'non-take' is internal, how do we prove it? You're introducing a subjective defence that undermines legal certainty. Anyone could claim they didn't 'take up' their confession or waiver."
  *The Two-Minute Reply:* We prove uptake exactly as we prove intent or mens rea: through conduct, context, and contemporaneous evidence. We don't take their word for it. The 'non-take' isn't a bare assertion; it's a claim about the normative context. If I resign but immediately continue working and drawing pay, the 'non-take' is evidenced by conduct. It's no more subjective than claiming duress.
  *Where the Reply is Soft:* Duress is a recognised defence; 'non-take' is not. You're asking courts to litigate internal normative states.
  *Concede Up Front:* Concede that evidentiary hurdles are high. Argue this is why it applies only to specific self-binding acts (like plea withdrawals), not general contract breaches.

  ***

  **Note on the Nightmare Question (Item 1):**
  This is the one you're lying awake over. It combines the philosophers' conceptual rigour with the lawyers' demand for certainty. If you concede that the state recognises the act regardless of 'non-take', you lose the law school audience. If you insist the 'non-take' voids the act, you lose the philosophers (who know the state defines the act) and the lawyers (who know certainty is king).
  *Strategy:* Do not fight the state's power to define institutional facts. Fight the *obligation* that flows from it. Distinguish between the *act* (which stands) and the *bindingness* (which is contested). This preserves the theory without challenging legal sovereignty.
