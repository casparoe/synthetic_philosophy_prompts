answer: |-
  Here are 9 rigorous questions designed to press the internal tensions of the fair-play account, specifically targeting the compatibility with civil disobedience. Each includes a main question and a specific follow-up anticipating the standard reply.

  **1. The Acceptance vs. Receipt Distinction (The Self-Sufficient Outsider)**
  Your account hinges on benefits being "accepted" or not "reasonably rejectable." But consider the self-sufficient outsider who genuinely needs no state protection or infrastructure. If they can reject the benefits, they escape the obligation. Conversely, doesn't this imply that the wealthy, who can purchase private security and education, *also* effectively reject public benefits and opt out of obligations, while the poor, who cannot refuse the scheme, remain bound?
  **Follow-up:** If you reply that basic security is a "presumptive benefit" no one can reject, does that not collapse your view into a natural duty account, since the obligation now stems from the *nature* of the benefit rather than the *fairness* of the scheme?

  **2. The Particularity Problem**
  Fair-play obligations arise from participation in a cooperative scheme. But in a globalized economy, I benefit immensely from transnational schemes (trade, climate, internet governance) often more than my domestic state. Why does the fairness principle generate an obligation to *this* state and *these* co-citizens specifically, rather than to the scheme that actually provides the bulk of the benefits I receive?
  **Follow-up:** If you argue the state is the "primary" scheme that enables the others, aren't you making the obligation instrumental? And if it's instrumental, doesn't the obligation disappear the moment a transnational scheme could do the job better?

  **3. The Threshold of Injustice**
  You concede fairness doesn't bind in seriously unjust states. But where is the threshold? If the obligation relies on the scheme being sufficiently just to count as "fair," does the *degree* of justice determine the *strength* of the obligation? If so, do citizens in a moderately unjust state have only a partial obligation to obey the law?
  **Follow-up:** If you say obligations are binary (either the scheme is fair or it isn't), how do you avoid arbitrariness? If you say they are scalar, doesn't that license selective compliance that undermines the cooperative scheme you're trying to defend?

  **4. Redundancy in Unjust States**
  If the fairness principle only binds us when institutions are reasonably just, what explanatory work is the fairness grounding actually doing? In those cases, couldn't a "natural duty of justice" ground the same obligation without needing the complex machinery of benefit receipt and acceptance?
  **Follow-up:** If you insist fairness adds something distinct, is it not simply that it binds us to *unjust* laws within a just scheme? But if so, how can that be squared with the claim that civil disobedience against those laws is permissible?

  **5. The Free-Rider Tension in Disobedience**
  If my obligation stems from not taking advantage of my fellow cooperators, isn't civil disobedience inherently a form of free-riding? I benefit from the general compliance of others (social order) while exempting myself from the cost of compliance. How is this not the exact exploitation of the scheme that fair-play theory prohibits?
  **Follow-up:** You will likely say the disobedient actor isn't free-riding because they aim to improve the scheme. But *until* they succeed, aren't they still objectively offloading their share of the burden onto their compliant co-citizens?

  **6. The "Fair Terms" Justification (The Bullet)**
  Your standard move is likely that disobedience is a method of pressing for *fairer* terms of cooperation, so it's consistent with the spirit of fairness. But this requires the disobedient agent to be the judge of when the terms are unfair. If we allow individuals to suspend obligations based on their own assessment of fairness, doesn't the fairness principle lose its action-guiding force?
  **Follow-up:** You must choose: Do you bite the bullet and say agents can unilaterally suspend obligations (risking instability), or do you concede that on a strict fairness view, disobedience is always a violation of obligation that requires separate moral justification?

  **7. Acceptance of Punishment**
  Does the fair-play account require the civil disobedient to accept legal punishment? If the obligation is to cooperate fairly, and the punishment is administered by a state that is (by the disobedient's lights) acting unfairly, does fairness demand I submit to a penalty that reinforces the unfair arrangement?
  **Follow-up:** If you say "yes, they must accept punishment" to show fidelity to the scheme, aren't you asking them to cooperate in their own repression? If "no," how are they distinguishing themselves from the ordinary free-rider who also refuses to pay the penalty?

  **8. Intergenerational and Unchosen Obligations**
  We inherit cooperative schemes we did not start, with benefits accrued long before we were born. Does "acceptance" stretch to cover these birthright benefits? If I merely reside here, is that acceptance? If so, doesn't this render the "acceptance" condition fictional, since exit is often impossible or prohibitively costly?
  **Follow-up:** If you drop "acceptance" and rely on "mere receipt" of inherited benefits to bind us, haven't you silently abandoned the voluntarist constraint that made your view distinct from utilitarian or natural duty accounts?

  **9. The Trilemma**
  To conclude, your position seems to face a trilemma. You want to maintain: (1) the acceptance/receipt condition, (2) the particularity of obligation to *this* state, and (3) the claim that civil disobedience is compatible with fairness. Based on our discussion, which of these three are you willing to abandon or significantly weaken to save the others?
  **Follow-up:** If you choose to save (1) and (3), you lose particularity (collapsing into transnationalism). If you save (2) and (3), you lose acceptance (collapsing into natural duty). If you save (1) and (2), you must concede disobedience is a violation of obligation. Which is it?
