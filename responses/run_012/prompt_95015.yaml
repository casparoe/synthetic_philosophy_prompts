prompt: |-
  Between 1945 and the 1990s German courts had to decide what to do with defendants whose conduct had been authorised by statutes that were, on any ordinary test, validly enacted: the wartime laws under which officials had denounced and dispossessed their neighbours, and the East German border regulations under which guards had shot people fleeing westward. The courts' characteristic move was not to hold those statutes valid but iniquitous, and not to convict on some doctrine of justified disobedience, but to reason that a statute offending against elementary requirements of justice to an intolerable degree lacks the character of law altogether; and that since it had never been law, treating it as a standard of guilt did not offend the prohibition on retroactive punishment. I want a philosophical reconstruction of that practice. What conception of law does it presuppose — does it commit the courts to natural law, or is it equally available to a positivist who holds that the rule of recognition of this particular system contains a moral criterion, or who argues that the GDR's own constitution and international obligations already made the practice unlawful, so that no conflict between law and morality ever arose? Which rival views does the practice rule out, and which parts of it are merely fitted by these theories rather than required by it? Is the practice coherent with the same legal order's ordinary insistence that validity is one question and moral merit another, and with its ordinary refusal to apply criminal law retrospectively? And what does the threshold of intolerable injustice tacitly assume — can it be specified without a substantive account of the core of justice, or does it smuggle one in? Finally, what would a legal system have to give up, and what would it have to accept about unpunished historic wrongs, if it abandoned the practice and reverted to a strict separation of law and morality?
reasoning: |-
  Here's a thinking process that leads to the suggested philosophical reconstruction:

  1.  **Deconstruct the Prompt:**

      *   **Subject:** German court practice between 1945 and 1990s (specifically addressing Nazi crimes and GDR border guard cases).
      *   **Core Judicial Move:** Statutes authorizing atrocities were deemed *not law* due to intolerable injustice (Radbruch Formula), thus avoiding retroactivity charges.
      *   **Task:** Philosophical reconstruction of this practice.
      *   **Key Questions to Address:**
          1.  What conception of law does it presuppose? (Natural Law vs. Incorporationist Positivism vs. Internal Legality arguments).
          2.  Which rival views does it rule out?
          3.  Which parts are *required* vs. *fitted* by theories?
          4.  Is it coherent with the ordinary separation of validity/merit and the prohibition on retroactivity?
          5.  What does the "threshold of intolerable injustice" assume? (Substantive justice?)
          6.  What would be lost/gained if the practice were abandoned for strict separation (positivism)?

  2.  **Initial Analysis & Theoretical Mapping:**

      *   *The Practice:* This refers to the *Radbruch Formula* (Gustav Radbruch, 1946) applied in the *Bundesgerichtshof* (BGH) and *Bundesverfassungsgericht* (BVerfG) cases, notably the *Wallerschützenprozesse* (Border Guard Trials) in the 1990s.
      *   *The Logic:* Extreme injustice is no law (*Unrecht ist kein Gesetz*). Therefore, applying current criminal law to acts that were "legal" then isn't retroactive, because there was no valid law then.
      *   *Natural Law:* Seems to fit best. Law has a necessary moral content.
      *   *Positivism (Hard/Exclusive):* Hart would say this is retroactive punishment disguised. The law *was* law, just immoral. To punish is to sacrifice legality for morality.
      *   *Positivism (Soft/Incorporationist):* Coleman/Lyons. If the Rule of Recognition includes moral criteria, then immoral statutes fail validity tests *within* the system.
      *   *Internal Legality Argument:* The GDR constitution guaranteed human rights/international law. The guards violated *their own* higher law. No need for external morality.
      *   *Coherence:* Does this undermine legal certainty? Yes, potentially. Does it violate *nullum crimen sine lege*? Technically no, if the statute wasn't law. But practically, it feels like retroactivity.
      *   *Threshold:* "Intolerable degree." Who decides? Requires a substantive theory of justice.
      *   *Abandonment:* If we go strict positivist, we must acquit (law is law) OR convict openly via retroactive statute (admitting the moral override).

  3.  **Drafting the Reconstruction - Section by Section:**

      *   **Introduction:** Define the practice (Radbruch Formula) and the tension (Legality vs. Justice).
      *   **Conception of Law (Natural Law vs. Positivism):**
          *   *Natural Law:* The practice looks classically natural law (Fuller vs. Hart debate context). Law *must* meet a moral threshold.
          *   *Incorporationist Positivism:* Can save it. If the system's rule of recognition says "laws violating basic rights are void," then it's positivist. But did the Nazi/GDR systems *actually* have that rule operative? Unlikely.
          *   *Internal Illegality:* The GDR argument (they violated their own constitution). This is positivist but relies on a specific reading of the GDR legal order.
          *   *Conclusion on Conception:* It *requires* a non-exclusivist positivism. Exclusive positivism (Raz) cannot accommodate it without admitting retroactivity. It leans heavily toward Natural Law or Soft Positivism.
      *   **Rival Views Ruled Out:**
          *   *Exclusive Legal Positivism:* Raz's view that validity is source-based only. This practice says morality affects validity.
          *   *Decisionism:* Schmitt's view that law is just the sovereign's command.
          *   *Strict Separation:* The idea that "law is law" regardless of content is explicitly rejected in extreme cases.
      *   **Required vs. Fitted:**
          *   *Required:* That morality is a condition of validity (at least at the extremes).
          *   *Fitted:* The specific wording of the Radbruch Formula. A Soft Positivist could fit it by saying "The post-war German Rule of Recognition validates the Radbruch Formula." But the *reasoning* used by courts appeals to supra-positive law, which fits Natural Law better.
      *   **Coherence with Ordinary Legal Order:**
          *   *Validity vs. Merit:* Ordinary times: Separation holds. Extreme times: They merge. This creates a duality. Is it coherent? It creates a "state of exception" for jurisprudence.
          *   *Retroactivity:* It claims to avoid it. But functionally, it *is* retroactive. It redefines the past status of the norm. It sacrifices *legal certainty* for *substantive justice*.
      *   **The Threshold of Intolerable Injustice:**
          *   Can it be specified formally? No. Fuller's "internal morality of law" (procedural) isn't enough for shooting fugitives.
          *   It smuggles in substantive human rights (right to life, liberty). It assumes an objective moral order knowable by judges.
      *   **Abandoning the Practice (Strict Separation):**
          *   *Give Up:* The ability to punish without admitting retroactivity. The moral comfort of "we are just applying the law."
          *   *Accept:* Either impunity for state criminals (if *nullum crimen* is respected) OR open admission of retroactive justice (Nuremberg style).
          *   *Trade-off:* Certainty vs. Justice.

  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction:* Be careful not to conflate the Nazi trials (1945-50s) with the GDR trials (1990s). The prompt mentions both. The GDR trials are more philosophically interesting because the GDR was a sovereign state with a constitution, unlike the collapsed Nazi regime.
