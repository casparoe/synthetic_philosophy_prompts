      *   *The "Internal" Argument:* The German Federal Constitutional Court actually used the GDR's own adherence to international human rights treaties to argue the shootings were illegal *under GDR law*. This is a positivist move. I need to highlight this distinction. The prompt asks about the "characteristic move" (Radbruch), but the GDR cases often mixed Radbruch with Internal Illegality. I should focus on the Radbruch aspect as the primary philosophical puzzle.
      *   *Coherence:* The tension is real. A system cannot routinely say "law isn't law" without undermining itself. This practice is a *corrective* mechanism, not a constitutive one. It's a safety valve.

  5.  **Final Polish:**

      *   Ensure all parts of the prompt are answered.
      *   Maintain a rigorous philosophical tone.
      *   Check citations/concepts (Radbruch, Hart, Fuller, Raz, Alexy).
      *   Structure logically: Conception -> Rivals -> Coherence -> Threshold -> Counterfactual.

  6.  **Writing the Response:** (Mental Outline)
      *   **Intro:** Identify the Radbruch Formula.
      *   **Conception of Law:** Natural Law vs. Inclusive Positivism. The "Ontological" claim vs. "Conventional" claim.
      *   **Ruled Out:** Exclusive Positivism, Command Theory.
      *   **Required vs. Fitted:** Natural Law requires it; Positivism fits it only by modifying the Rule of Recognition retrospectively.
      *   **Coherence:** Tension with Legal Certainty. The "Duality" of the legal order.
      *   **Threshold:** Substantive morality is unavoidable.
      *   **Abandonment:** The choice between impunity and honest retroactivity.

  7.  *(Self-Correction during drafting)*: Make sure to address the specific GDR argument mentioned in the prompt ("GDR's own constitution... made the practice unlawful"). This is the "Positive Law" alternative to Radbruch. I need to evaluate if that saves Positivism. *Decision:* It saves it for the GDR cases specifically, but not for the Nazi cases where the statutes *were* the highest law. The prompt asks about the practice generally (1945-1990s). So the Radbruch Formula is the dominant theme. I will treat the "Internal Legality" argument as a positivist attempt to mimic the Natural Law result.

