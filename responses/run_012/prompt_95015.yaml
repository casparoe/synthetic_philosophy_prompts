answer: |-
  The judicial practice you describe is the application of the **Radbruch Formula**, named after the German legal philosopher Gustav Radbruch. In 1946, Radbruch argued that "extreme injustice is no law" (*extremes Unrecht ist kein Gesetz*). This reasoning was revitalized in the 1990s by the Federal Constitutional Court and the Federal Court of Justice to convict GDR border guards and their superiors, despite the fact that the shootings were authorized by GDR statute at the time.

  Here is a philosophical reconstruction of that practice, analyzing its theoretical commitments, coherence, and implications.

  ### 1. Conception of Law: Natural Law or Modified Positivism?

  The practice presupposes a **non-positivist conception of law**, but the degree of commitment depends on how one interprets the "validity" condition.

  **The Natural Law Reading (Required Connection):**
  On its face, the reasoning is classically natural law. It asserts an ontological claim: there is a necessary connection between law and morality such that a norm failing a specific moral threshold ceases to possess the *status* of law. It treats "being a law" not merely as a matter of social fact (enactment by a sovereign), but as a functional status dependent on moral content. This aligns with Lon Fuller's "internal morality of law" but goes further into substantive justice. It commits the courts to the view that the identity of a legal norm is partly constituted by its moral merit.

  **The Incorporationist Positivist Reading (Contingent Connection):**
  A "soft" or "inclusive" positivist (like Jules Coleman or Wil Waluchow) could reconstruct this practice without abandoning positivism. They would argue that the **Rule of Recognition** of the post-1949 Federal Republic of Germany incorporates a moral criterion: *"A norm is valid law only if it does not violate elementary justice."*
  *   **Fit:** This fits the practice if we view the Radbruch Formula not as a timeless truth, but as a rule *of the current German legal system* applied to past regimes.
  *   **Requirement:** However, this requires a temporal sleight of hand. For the positivist, the Rule of Recognition is a social fact existing *now*. To say the Nazi statute "was never law" is to project the *current* Rule of Recognition onto the *past* legal system. A strict positivist must admit that the statute *was* law in the Nazi system, but is now treated as void by the current system. The courts' language ("lacks the character of law altogether") suggests they are not merely applying a new rule to old facts, but denying the ontological status of the past norm. Thus, while available to an incorporationist, the *reasoning* leans toward natural law.

  **The Internal Legality Argument (GDR Specific):**
  Regarding the GDR guards, the courts often argued that the GDR's own constitution and its ratification of international human rights covenants rendered the shoot-to-kill orders illegal *even under GDR law*.
  *   **Positivist Viability:** This is fully available to an exclusive positivist. If the GDR hierarchy placed the Constitution above statutory orders, and the Constitution protected life, then the guards violated valid GDR law. No moral criterion is needed, only a hierarchy of norms.
  *   **Limitation:** This argument works for the GDR (which had a written constitution claiming to respect rights) but fails for the Nazi regime, where the Führer's will was the supreme source of law. Since the prompt covers 1945–1990s generally, the practice cannot rely solely on this positivist move.

  ### 2. Rival Views Ruled Out

  The practice explicitly rules out **Exclusive Legal Positivism** (associated with Joseph Raz). Exclusive positivism holds that the existence and content of law depend entirely on social sources, not moral merits. If the Nazi statute was source-valid, it was law. To punish based on its invalidity is, for the exclusive positivist, to punish retroactively. The German courts' refusal to accept the "law is law" argument in extreme cases is a direct rejection of the exclusive separation thesis.

  It also rules out **Decisionism** (Carl Schmitt), which holds that law is simply the command of the political sovereign regardless of content. By asserting that a sovereign command can fail to be law due to its content, the courts deny the sovereign's omnipotence in defining legal validity.

  ### 3. Required vs. Fitted

  *   **Required:** The practice *requires* that moral validity conditions can override source-based validity conditions in extreme cases. It requires that legal validity is not exhausted by pedigree.
  *   **Fitted:** The specific threshold ("intolerable degree") is fitted by theory rather than required. A natural law theorist might argue *any* injustice voids law (Aquinas), but the Radbruch Formula sets a high bar to preserve stability. This high bar is a pragmatic concession to positivism, fitted to avoid total legal chaos, rather than a strict requirement of natural law theory. Conversely, the positivist reconstruction is "fitted" by redefining the Rule of Recognition retrospectively, but it is not "required" to accept the courts' ontological claim that the past statute *never existed* as law.

  ### 4. Coherence with the Ordinary Legal Order

  **Validity vs. Merit:**
  The practice creates a **duality** in the legal order. In ordinary times, the system operates on a positivist footing: validity is separate from merit, ensuring predictability. In extraordinary times (transitional justice), it switches to a natural law footing.
  *   **Coherence:** This is theoretically unstable. It suggests the legal order has two modes of existence: one for normalcy (positivist) and one for catastrophe (natural law). Critics argue this undermines the rule of law by making the boundary between "ordinary" and "extreme" politics subject to judicial discretion.
  *   **Defense:** Proponents argue it is coherent as a **self-correction mechanism**. The separation of law and morality is a presumption, not an absolute. When the presumption leads to absurdity (state-sanctioned murder), the deeper constitutional commitment to justice overrides the presumption of validity.

  **Retroactivity (*Nullum Crimen Sine Lege*):**
  The courts claim no retroactivity occurs because there was no law to begin with.
  *   **Incoherence:** Functionally, this *is* retroactive. The defendant relied on the statute's validity at the time of acting. To tell them later that their reliance was misplaced because the statute "wasn't law" changes the rules of the game after the fact.
  *   **Resolution:** The practice prioritizes **substantive justice** over **legal certainty**. It accepts a tension with the prohibition on retroactivity, arguing that the prohibition protects reliance on *law*, not reliance on *commands that mimic law but violate human essence*. It redefines "law" to exclude the statute, thereby technically satisfying *nullum crimen* while violating its spirit of predictability.

  ### 5. The Threshold of "Intolerable Injustice"

  **Can it be specified without substantive justice?**
  No. The threshold cannot be purely procedural (like Fuller's eight ways to fail to make law). Shooting a fleeing unarmed citizen is procedurally clear (the order was clear, public, and applied consistently) but substantively abhorrent.
  *   **Smuggling Morality:** The threshold tacitly assumes a **substantive account of core human rights** (right to life, liberty, proportionality). It assumes these rights are objective and knowable by judges without needing legislative enactment.
  *   **The Problem:** Who defines "intolerable"? If it relies on the judge's moral intuition, it risks arbitrariness. The German courts anchor this in the "core of justice" recognizable by all conscience, effectively positing a universal moral standard accessible through reason. This is a heavy metaphysical load for a secular court to carry.

  ### 6. Abandoning the Practice: Strict Separation Consequences

  If the legal system abandoned the Radbruch Formula and reverted to strict Exclusive Positivism (Hart's recommendation in the *Hart-Fuller Debate*), it would face a stark choice:

  **What it would have to give up:**
  1.  **The Comfort of Legality:** It could no longer claim it is "applying the law" when punishing past atrocities. It would have to admit it is doing something extra-legal.
  2.  **Moral Authority:** The law would appear impotent against evil, or complicit in it. The "law is law" stance risks alienating the citizenry who perceive the legal system as morally bankrupt for protecting tyrants.

  **What it would have to accept:**
  1.  **Impunity:** If it respects *nullum crimen sine lege* strictly, it must acquit the defendants. The statutes were valid; the acts were legal. This preserves legal certainty but sacrifices justice.
  2.  **Honest Retroactivity:** Alternatively, it could convict but openly admit it is applying retroactive justice. It would pass a new law today saying "Acts authorized by the Nazi/GDR regime that violate human rights are punishable."
      *   **Hart's View:** Hart preferred this second option. He argued it is better to admit you are sacrificing legality for morality than to lie and say the immoral statute was never law. This preserves the clarity of concepts: "This was law, but it was too wicked to obey/protect."

  **Conclusion on the Trade-off:**
  Reverting to strict separation forces a system to choose between **Rule of Law values** (certainty, non-retroactivity) and **Substantive Justice values** (punishing evil). The German practice attempts to have both by redefining validity. Abandoning it would force an honest admission: that in transitional moments, justice requires the suspension of the very legal certainty that defines the rule of law. The German choice implies that a legal system that protects extreme injustice forfeits its claim to be a *legal* system, whereas the strict positivist implies that a legal system remains a legal system even when it protects evil, and we must use extra-legal means to fix it.

  ### Summary
  The practice presupposes a **moderate natural law** or **inclusive positivist** conception where morality is a validity condition at the extremes. It rules out **exclusive positivism**. It is **incoherent** with a strict separation of validity and merit, creating a "state of exception" in jurisprudence. The threshold of injustice **smuggles in substantive human rights**. Abandoning the practice would require the system to choose openly between **impunity** and **honest retroactivity**, sacrificing either justice or legal certainty, rather than attempting to conceal the sacrifice through redefinition.
