      *   **Why this approach?** Moves from ontology to procedure. Matches the user's hydrology insight (boundaries are functional).
      *   **Success/Failure:**
          *   Success: A set of necessary conditions for a legitimate contestation mechanism.
          *   Failure: Proving that *any* closure is inherently undemocratic (nihilism) or just restating "fairness" (tautology).
      *   **Self-Reference:** Acknowledge that the contestation rules themselves must be provisional but stable.

  5.  **Refining the Tone:**
      *   Respectful of the user's expertise (hydrology).
      *   Philosophical but not jargon-heavy (as requested, describe positions rather than cite names).
      *   Honest about limitations.
      *   Format: Research Proposal.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I include the brainstorming? Yes, need to make sure that's distinct before the proposal text.
      *   *Check:* Did I avoid bibliography? Yes.
      *   *Check:* Is the self-reference issue addressed? Yes, this is crucial. The "rules of contestation" need a status. I'll frame it as "provisional fixed points."
      *   *Check:* Is the scope realistic? 3-4 months part-time. Yes, conceptual work fits this.
      *   *Check:* Is the idea incoherent? No, it's a version of "dynamic boundary theory." I should validate that while noting the difficulty.

  7.  **Final Polish:** Ensure the transition from the hydrologist analogy to the philosophical argument is smooth. The "permit hearing" analogy is gold; keep that central.

  *(Self-Correction on the "Third Position"):* The user asked about "all-affected, all-subjected, and whatever the third one is." Usually, the third is "all-affected-interests" or "stakeholder" models, or sometimes "coercion principle." I'll describe it as the "all-interested" or "stakeholder" view to be clear.

  *(Self-Correction on Self-Reference):* The user wants me to think *carefully* about this. If the contestation rules are set by the demos, we have the circle. If set by outsiders, it's undemocratic. The solution might be that the rules are *pre-political* or *constitutional* but open to amendment *via a higher threshold*. I need to make sure the proposal doesn't promise to solve this fully but to map the tension.

