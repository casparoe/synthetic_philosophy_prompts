      *   *Option 3 (The Trigger Question):* What specific threshold of "external impact" grants an outsider the right to trigger a boundary review, without collapsing into the all-affected principle? (Focuses on the entry point).
      *   *Option 4 (The Institutional Design Question):* What minimal institutional features must a boundary-contestation mechanism possess to avoid infinite regress (the self-reference problem) while remaining democratic? (Focuses on the structure of the contestation itself).

      *Selection:* Option 4 is the most philosophically robust and fits the "contestation-first" intuition best. It directly tackles the self-reference issue the user highlighted. However, Option 2 (Termination) is also very strong because the user mentioned "endlessly contestable boundary is just no boundary at all." Let's combine them slightly but focus on the *conditions of closure*. Actually, looking at the user's prompt, the core tension is between *openness* (contestability) and *closure* (having a boundary). Let's refine Option 2: "Under what conditions does a boundary contestation mechanism achieve democratic legitimacy without collapsing into infinite regress or arbitrary closure?"
