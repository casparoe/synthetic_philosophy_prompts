  The two assumptions
  The Self-Sampling Assumption (SSA) instructs you to treat yourself as a random sample from the set of all observers that exist within a given hypothesis. When evaluating a theory, you ask: "If this world were real, how typical am I?" If a hypothesis posits a billion observers but only one has your specific experiences, SSA says you should consider yourself unlikely to exist in that world. It focuses on your indexical position relative to others within the same possible world. SSA updates on your evidence conditional on the hypothesis being true.

  The Self-Indication Assumption (SIA) instructs you to treat your existence itself as evidence favoring hypotheses that create more observers. You ask: "Which world makes my existence most probable?" If a hypothesis posits a billion observers, it offers a billion chances for "you" to exist, whereas a world with one observer offers only one chance. SIA weights hypotheses by the total number of observers they contain. It focuses on the absolute probability of there being an observer like you at all, regardless of their proportion within that world. SIA updates the hypothesis probability conditional on you being an observer.

  Where they come apart
  They diverge when hypotheses imply different total numbers of observers. Consider the Doomsday Argument. Hypothesis Early Doom says humanity ends soon (few total humans). Hypothesis Late Doom says humanity lasts millennia (trillions total). You find yourself alive now, among the first few billion.

  SSA favors Early Doom. If Late Doom were true, there would be trillions of humans. You would be extremely early in the queue. Being this early is statistically unlikely if the queue is huge. Therefore, SSA suggests you are likely in the smaller population. It penalizes the large world because you are atypical within it.

  SIA favors Late Doom. A world with trillions of humans creates trillions of observer-moments. It is vastly more likely that *someone* like you exists in that world simply because there are more slots available. This "existence boost" counteracts the "being early" penalty. SIA says the sheer number of observers makes the larger world more probable. It rewards the large world simply for being large.

  Thus, SSA penalizes large worlds where you are atypical; SIA rewards large worlds simply for being populous. They agree only when the total number of observers is fixed across hypotheses. When population sizes vary, SSA pushes you toward smaller worlds, while SIA pushes you toward larger ones. This tension defines the debate: SSA implies we should expect to be typical observers; SIA implies we should expect to exist in populous worlds.

  The presumptuous philosopher
  The Presumptuous Philosopher objection targets SIA's preference for large worlds. Imagine two physical theories, T1 and T2, are equally plausible based on empirical data. T1 predicts a universe with one trillion observers. T2 predicts a universe with one trillion trillion observers.

  SIA dictates you should be virtually certain T2 is true. Why? Because T2 creates a trillion times more observers, making your existence a trillion times more likely. You can conclude the universe is enormous without looking through a telescope.

  This bites because it allows armchair reasoning to override empirical science. It seems absurd that merely existing allows you to reject a viable physical theory solely because it posits fewer people. It implies that the size of the universe is determined by observer counts rather than physics. Critics argue this makes existence too informative, granting us knowledge about the cosmos that we shouldn't possess without observation. It turns ontology into a numbers game where the biggest world always wins, conflicting with the intuition that physical parameters should determine belief, not observer counts.

  My scenario
  In your scenario, Program A creates 1 observer (Experience X). Program B creates 1001 observers (1 with X, 1000 with Not-X). You have Experience X.

  Your intuition that SSA favors A is correct. In A, 100% of observers have X. In B, only 0.1% have X. SSA treats you as a random sample; finding yourself with X is much more likely in A. SSA strongly favors A.

  Your intuition that SIA is neutral is also correct in outcome, but the mechanism is subtle. SIA counts *all* observers to boost the hypothesis probability. B has 1001 observers, A has 1. So SIA initially boosts B by a factor of 1001. However, you must then condition on having Experience X. In B, only 1 of 1001 observers has X. This likelihood penalty reduces B's probability by a factor of 1001. The boost and the penalty cancel exactly. The result is neutrality.

  You suggested the extra observers lend no boost because they lack evidence X. Actually, under SIA, they *do* lend a boost to the hypothesis simply by existing. The Presumptuous Philosopher inference arises when there is no evidence X to cancel this boost. In your case, the specific evidence X penalizes the large world exactly enough to neutralize the SIA boost. So, SIA counts all observers, but specific evidence restricts the final probability. Your verdict is right; the reasoning needs the cancellation step. The Presumptuous Philosopher objection does not require the extra observers to be duplicates of you. It relies precisely on the fact that SIA counts *additional* observers who do not share your specific evidence. In your scenario, the extra 1000 observers boost hypothesis B, but your specific experience X acts as a filter. In standard Presumptuous Philosopher cases, the evidence is merely "I exist," which applies to all observers. There is no filter to cancel the boost. Thus, SIA pushes you to the larger world. In your case, the filter exists. So your reading is partially correct: the inference depends on whether there is evidence to penalize the larger world. But SIA always counts the additional observers for the initial boost.

  What would change my mind
  I am highly confident in this analysis of standard SIA/SSA formulations. The calculation where the population boost cancels the likelihood penalty is a standard result in anthropic reasoning.

  However, my reasoning could be mistaken regarding the definition of the reference class in SSA. If SSA defines the reference class as "observers with experience X" rather than "all observers," SSA would also yield neutrality. Most philosophers define the class broadly to avoid triviality, but this ambiguity is the weak point.

  To change my mind, you would need to show that SIA should not count observers incompatible with your evidence when weighting hypotheses. If SIA only counts observers who *could* have your evidence, the boost disappears, and SIA would favor A like SSA. This alternative formulation exists but is less common. If that definition is correct, my explanation of the cancellation mechanism fails.
