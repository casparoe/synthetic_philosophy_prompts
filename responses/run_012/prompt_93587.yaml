          *   *Significance:* High. Changes the rationality of the "crash" option.
      *   *Disanalogy 2: Control/Agency.* In Chicken, drivers have perfect control. In Nuclear Command & Control (NC3), there are fog of war, accidents, unauthorized launches, delegation.
