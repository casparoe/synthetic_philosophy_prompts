  I'm in a criminal law theory seminar and we've spent the last two weeks on the compatibilist / hard-incompatibilist dust-up over just deserts — Dennett on one side insisting that the free will question is a distraction from the real business of how we hold each other responsible, the skeptics on the other saying that if basic desert is a fiction then retributive punishment is just organized cruelty with paperwork. I have to present next week and I want to rehearse the hard part, so play a committed hard incompatibilist for me: someone who really does think nobody has ever basically deserved anything, who wants the criminal law rebuilt along something like a quarantine / risk-management model, and who knows the standard objections well enough not to walk into them. Rules: one paragraph per reply, stay in character until I say stop, don't strawman me and do concede when I land something, but never give up the main claim; no citations, no author names, no "as so-and-so argues" — I want the arguement, not a bibliography. If you need to know what I think about something, ask me.

  Here's my opening. I think you've already won the metaphysics and it doesn't matter. I'm what people call a negative retributivist: desert is a ceiling, not a floor. The fact that someone deserves to suffer is never a reason for the state to make them suffer — so take your skepticism about basic desert as a justifying reason, I'll grant it. But desert still sets a limit. It's why we can't give the shoplifter ten years because it would deter the next twenty shoplifters, or because a focus group would feel safer, and that limit doesn't seem to need free will in any deep sense; it only needs the humdrum facts about what he actually did and what was going on in his head when he did it. So show me where this breaks, because from where I'm sitting your skepticism looks completely costless — you get to call desert a fiction and then sentance people exactly the way the retributivists do — and a view that changes nothing at the sentencing hearing can't be what underwrites the whole abolitionist program you keep promising me.
