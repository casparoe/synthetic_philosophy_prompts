  # The Grounding & Fundamentality Decision Tree

  **Instructions:** Start at the root. Answer the question using your intuitions about the concrete case provided. Follow the branch that matches your answer. If you hit a "Leaf," you have arrived at a named metaphysical position. If you hit a "Flag," note the combination before proceeding or stopping.

  ### Node 1: The Laws and Regularities
  **Case:** Consider the laws of physics and the regularities (patterns) they cover.
  **Question:** Is the connection between a Law and the Regularities a feature of the world itself, or just a way we organize our theories?
  *   **Just how we talk:** Go to **Node 2**.
  *   **Feature of the world:** Go to **Node 3**.

  ### Node 2: The Verbal Dispute (Quietism Check)
  **Case:** Consider the debate over whether the statue *is* the clay or merely *coincides* with it.
  **Question:** Is the dispute about what "grounds" what merely a verbal confusion about the word "is," with no underlying reality to settle?
  *   **Yes, it's just verbal:** 🍃 **Leaf: Quietism**.
  *   **No, there's a real dependency, just not a "grounding" relation:** 🍃 **Leaf: Deflationism / Anti-Realism**.

  ### Node 3: Unity of Relation
  **Case:** Compare the **Statue and the Clay** to **Moral Facts and Natural Facts**.
  **Question:** Is the "because" relating the clay to the statue the *exact same relation* as the one relating natural facts to moral facts?
  *   **No, different domains have different grounding relations:** 🍃 **Leaf: Grounding Pluralism**.
  *   **Yes, grounding is one unified relation across all domains:** Go to **Node 4**.

  ### Node 4: Necessitation
  **Case:** Consider **Consciousness and the Physical**.
  **Question:** If the physical facts are fixed, *must* the consciousness facts be fixed (necessitation), or could the physical ground make consciousness merely likely or possible?
  *   **Merely likely/possible:** ⚠️ **Flag: Unoccupied/Unattractive**. (See "Bug Report" below).
  *   **Must be fixed (Strict Necessitation):** Go to **Node 5**.

  ### Node 5: Hyperintensionality (Fine-Grainedness)
  **Case:** Consider **Being Triangular** and **Being Trilateral**. They are necessarily co-extensive (you can't have one without the other).
  **Question:** Does necessity suffice for grounding (they ground each other equally), or is grounding finer-grained (one still explains the other)?
  *   **Necessity suffices; no further grounding needed:** 🍃 **Leaf: Supervenience-Only**.
  *   **Grounding is finer-grained; one still grounds the other:** Go to **Node 6**.

  ### Node 6: Symmetry and Loops
  **Case:** Consider a **Set and its Members**.
  **Question:** Can the Set ground the Members *and* the Members ground the Set simultaneously (a loop), or must grounding be strictly one-way?
  *   **Loops are allowed (Mutual dependence):** 🍃 **Leaf: Coherentism / Mutual Grounding**.
  *   **Grounding must be asymmetric (One-way):** Go to **Node 7**.

  ### Node 7: Termination (Infinitism Check)
  **Case:** Consider a **Hole and its Host** (the donut and the dough).
  **Question:** If you ask what grounds the hole, then what grounds the host, does this chain go on forever, or must it hit bedrock?
  *   **It can go on forever; no bedrock needed:** 🍃 **Leaf: Bottomless Infinitism**.
  *   **It must stop at a fundamental level:** Go to **Node 8**.

  ### Node 8: The Base Count (Monism Check)
  **Case:** Consider the **Whole Universe and its Parts**.
  **Question:** Is the fundamental bedrock the One Whole (which grounds the parts), or the Many Simple Parts (which ground the whole)?
  *   **The One Whole is fundamental:** Go to **Node 9**.
  *   **The Many Parts are fundamental:** Go to **Node 10**.

  ### Node 9: The Nature of the One (Monism Split)
  **Case:** Consider the **Quantum Wavefunction**.
  **Question:** Is the One Fundamental Whole a concrete material object, or is it strictly the mathematical Wavefunction?
  *   **Strictly the Wavefunction:** 🍃 **Leaf: Wavefunction-Only Monism**.
  *   **Concrete material object (or general substance):** 🍃 **Leaf: Priority Monism**.

  ### Node 10: The Nature of the Many (Pluralism Split)
  **Case:** Consider **Dispositions and Categorical Bases** (or **Negative Facts**).
  **Question:** Is the bedrock made of local objects/properties, or is it pure relational structure? *(Optional: Is fundamentality absolute or relative to a domain?)*
  *   **Pure relational structure:** 🍃 **Leaf: Ontic Structuralism**.
  *   **Local objects/properties (Absolute):** 🍃 **Leaf: Priority Pluralism / Atomism**.

  ***

  ### 🐞 Bug Report: Known Issues & Unseparables

  **1. Unoccupied / Incoherent Combinations**
  *   **Probabilistic Grounding (Node 4, "Merely likely"):** This combination is flagged as **unattractive/unexplored**. Most realists argue that if the ground doesn't necessitate the grounded, it's causation, not grounding. If you chose this, you likely hold a view of grounding that collapses into probabilistic causation, which few metaphysicians accept for *metaphysical* dependence.
  *   **Infinitism + Priority Monism:** You cannot reach both. If the chain never stops (Infinitism), there is no "One Whole" bedrock (Monism). This combination is **incoherent**.
  *   **Quietism + Wavefunction Monism:** You cannot claim the dispute is verbal (Quietism) while committing to a specific physical ontology (Wavefunction). This is **incoherent**.

  **2. Leaves the Tree Cannot Separate**
  *   **Deflationism vs. Supervenience-Only:** In practice, these leaves are often indistinguishable. Both deny a robust, hyperintensional grounding relation. The tree separates them based on whether you think "necessity is enough" (Supervenience) or "there is no objective dependence relation at all" (Deflationism), but many philosophers slide between these positions.
  *   **Ontic Structuralism vs. Wavefunction Monism:** Both prioritize structure over objects. Wavefunction Monism is essentially a specific *version* of Ontic Structuralism (where the structure is quantum mechanical). The tree separates them by count (One vs. Many/General), but a Structuralist could accept the Wavefunction as the fundamental structure. This distinction is **merely specific vs. general**, not a deep structural divide in the tree.
  *   **Priority Pluralism vs. Absolute Fundamentality:** Node 10 assumes Priority Pluralists accept absolute fundamentality. If you think fundamentals are *relative* to a domain (e.g., biology has its own fundamentals distinct from physics), you land on Pluralism, but the tree doesn't have a separate leaf for "Relative Fundamentality." You are grouped with the Atomists.

  **3. Missing Case Note**
  *   **Negative Facts:** Used in Node 10. If you think negative facts (absences) can be fundamental, you likely lean toward **Priority Pluralism** (facts as fundamentals) rather than **Structuralism** (relations as fundamentals), though some Structuralists accommodate absences as structural gaps. The tree forces a choice that some positions might blur.
