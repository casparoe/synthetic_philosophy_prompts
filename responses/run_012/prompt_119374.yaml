  # Diagnostic Decision Tree: Dispositions and Laws

  **Starting Commitment:** We accept that statements like "this glass is fragile" have truth-values, and these are not settled merely by what has actually happened (e.g., whether the glass was actually dropped).

  ### The Tree

  **Node 1 (Case 2: The Padded Box)**
  A wine glass is inside a padded box. It is not struck, but nothing about the glass has changed. What makes "It is fragile" true?
  *   (A) The fact that it *would* break if struck (ignoring the box). **[Go to Node 2]**
  *   (B) An intrinsic property the glass possesses (e.g., molecular structure). **[Go to Node 3]**
  *   (C) There is no substantive fact about the object itself; truth depends on external standards or patterns. **[Go to Node 7]**

  **Node 2 (Case 3: The Secret Keeper)**
  A man would keep a secret if trusted, except trust makes him talk (a "fink"). Is the conditional "If trusted, he would keep the secret" true?
  *   (A) Yes, strictly speaking (we ignore the fink). **[Leaf 1]**
  *   (B) No, but it is true if we add a "no interference" clause. **[Leaf 2]**
  *   (C) No, it is only true as a probability. **[Leaf 3]**

  **Node 3 (Case 5: Crystal vs. Soda-lime)**
  Two glasses with different microstructures shatter on the same drop. Is "fragility" identical to the microstructure?
  *   (A) Yes, it is just that physical property. **[Leaf 4]**
  *   (B) No, it is the higher-order property of having *some* structure that plays that role. **[Leaf 5]**
  *   (C) No, it is a primitive power distinct from the physical structure. **[Go to Node 5]**

  **Node 4 (Case 1: The Honest Woman)**
  *(Reached from Node 3, Option B)*
  A woman is honest across many different scenarios (bribes, lost wallets, etc.). Is this one property or many?
  *   (A) One multi-track property. **[Leaf 5]**
  *   (B) Many single-track properties grouped by name. **[Leaf 4]**
  *(Note: This node refines the Functionalism/Identity split but maps to existing leaves to save space.)*

  **Node 5 (Case 4: The Prankster Ball)**
  A steel ball is on a table; a prankster will destroy it if it falls. "It would break if it fell" is true. Is this disposition intrinsic to the ball?
  *   (A) No, dispositions can be extrinsic/relational. **[Leaf 6]**
  *   (B) Yes, dispositions must be intrinsic; the truth here depends on laws. **[Go to Node 6]**

  **Node 6 (Distinction: Fundamental Properties)**
  *(Reached from Node 5, Option B)*
  Are the fundamental properties of the world dispositional (powers)?
  *   (A) Yes, all fundamental properties are powers. **[Leaf 7]**
  *   (B) No, they are categorical; laws fix dispositional truths. **[Leaf 8]**
  *   (C) They are both categorical and dispositional aspects of one nature. **[Leaf 9]**

  **Node 7 (Case 6: The Beer Mug)**
  *(Reached from Node 1, Option C)*
  A mug survives a table drop but breaks from a shelf. Is "fragile" true absolutely or relative to a standard?
  *   (A) Relative to context/standards (no context-independent fact). **[Leaf 10]**
  *   (B) Not a property at all; shorthand for patterns of events/laws. **[Leaf 11]**

  ---

  ### Key: Positions and Leaves

  1.  **Simple Conditional Analysis:** The dispositional statement is true just when the corresponding counterfactual is.
      *   *Awkward commitment:* Must deny that the finkish man (Case 3) is trustworthy, contrary to intuition.
  2.  **Repaired Conditional Analysis:** The same view repaired with a clause excluding interference.
      *   *Awkward commitment:* The "no interference" clause is notoriously difficult to define non-circularly.
  3.  **Probabilistic Conditional Analysis:** A probabilistic version of the conditional view.
      *   *Awkward commitment:* Deterministic dispositions (like fragility) must be analyzed as chances, not certainties.
  4.  **Identity Theory:** The view that a disposition is nothing over and above the property that realises it.
      *   *Awkward commitment:* Struggles to explain how different microstructures (Case 5) yield the *same* disposition.
  5.  **Functionalism (Higher-Order):** The view that it is the higher-order property of having some lower-order property that plays the relevant causal role.
      *   *Awkward commitment:* Risks circularity if the causal role is defined by the disposition itself.
  6.  **Irreducible Disposition:** The view that a disposition is a property of its bearer over and above any conditional.
      *   *Awkward commitment:* Commits to primitive powers that may lack a categorical ground.
  7.  **Pan-dispositionalism:** The view that every property is both categorical and dispositional (or purely dispositional).
      *   *Awkward commitment:* Denies the existence of purely categorical properties at the fundamental level.
  8.  **Categoricalism (Laws-Fixed):** The view that the fundamental properties are not dispositional and that dispositional truths are fixed by them together with the laws.
      *   *Awkward commitment:* The laws of nature must be taken as brute external constraints.
  9.  **Dual-Aspect Theory:** The view that every property is both categorical and dispositional depending on how it is considered.
      *   *Awkward commitment:* The metaphysical nature of the "aspect" distinction remains obscure.
  10. **Contextualism:** The view that there is no context-independent fact about which dispositions a thing has.
      *   *Awkward commitment:* Denies that objects have dispositions absolutely, only relative to standards.
  11. **Eliminativism (Shorthand):** The view that there are no dispositional properties at all and that such talk is shorthand.
      *   *Awkward commitment:* Dispositional talk is useful but strictly false or non-referential.

