  ## 7. Factual Claims Requiring Verification

  To ensure the paper's empirical section is robust, the following claims must be checked against primary sources (Hofstadter's *Scientific American* columns from 1983-1984):

  1.  **Luring Lottery Prize:** Was the prize fixed at $1,000,000, or was it a variable pool? (Standard recollection: $1,000,000 divided by entries).
  2.  **Entry Cost:** What was the cost of a postcard in the US in 1983? (Necessary to calculate the Nash threshold).
  3.  **Entry Count:** How many postcards did Hofstadter actually receive? (Commonly cited as "thousands," but a specific number allows for precise payoff calculation).
  4.  **Hofstadter's Conclusion:** Did Hofstadter explicitly claim the result *falsified* superrationality, or did he claim it showed readers *failed to achieve* superrationality? (This distinction is vital for the "Standard Reading" critique).
  5.  **Platonia Parameters:** Did Hofstadter specify a cost for the telegram in the original thought experiment? (Usually assumed negligible, but if specified, it affects the $p=0$ threshold).

