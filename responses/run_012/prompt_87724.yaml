answer: |-
  Your instinct is correct: that paragraph is smuggling a specific metaphysical framework (Process Theory) and passing it off as the consensus, then using it to drive a moral conclusion that doesn't necessarily follow. It's a clean narrative, but it collapses under the weight of the last twenty years of philosophy of action.

  Here is the clause-by-clause breakdown you asked for, followed by an assessment of the specific logical leaps.

  ### Clause-by-Clause Autopsy

  **1. "Almost everyone working on this now agrees that omissions can't literally be causes..."**
  *   **Specialist Verdict:** **False.**
  *   **The Nuance:** This is the biggest overstatement. There is a significant divide between *Process Theorists* (causation requires physical transmission/conserved quantities) and *Counterfactual Theorists* (causation is about dependence). David Lewis, Jonathan Schaffer, and many others argue vigorously *for* omission causation within a counterfactual framework. If the doctor had checked the chart, the patient would have lived; therefore, the omission is a cause.
  *   **Keep/Trash:** Trash "Almost everyone." Change to "A significant camp argues..." or "On one dominant view..."

  **2. "...because causing something requires a real connection between two events, and with an omission there's no event there to be connected — a non-happening can't make anything happen."**
  *   **Specialist Verdict:** **Accurate summary of *one* view, presented as the *only* view.**
  *   **The Nuance:** This is the classic "ontological" argument (often associated with Dowe or Salmon). It relies on a specific definition of "event" as a concrete particular in spacetime. But many philosophers argue omissions *are* events (just negative ones) or that causation doesn't require "events" in that thick sense—it requires counterfactual dependence.
  *   **Keep/Trash:** Keep the logic, but attribute it. "Proponents of process theories argue..."

  **3. "So when the doctor fails to check the chart and the patient dies, what caused the death is the disease; the failure is just a fact about what she didn't do."**
  *   **Specialist Verdict:** **Metaphysically consistent (within that view), but pragmatically misleading.**
  *   **The Nuance:** Even if the omission isn't the *metaphysical cause*, it is almost certainly a *causal explanation*. In medicine and law, we distinguish between the "physiological cause" (the disease) and the "legal cause" (the negligence). Conflating these two levels of analysis is where the confusion starts.
  *   **Keep/Trash:** Keep, but clarify that this distinguishes *physiological* cause from *responsibility-relevant* cause.

  **4. "That's why the law treats acts and omissions differently, and why we need a seperate moral principle, something like a duty to rescue, to explain why she's blameworthy at all."**
  *   **Specialist Verdict:** **Hidden Premise Alert.**
  *   **The Nuance:** This contains the smuggled move. The hidden premise is: *Moral blameworthiness requires metaphysical causation.* Many ethicists reject this. You can be blameworthy for failing to prevent harm even if you didn't "cause" the harm in a mechanistic sense, provided you had a duty and the capacity to intervene. The "duty to rescue" isn't needed to *replace* causation; it's needed to establish *obligation*. Causation (even counterfactual) establishes the link; duty establishes the norm.
  *   **Keep/Trash:** Modify. The law distinguishes them, yes, but not solely because of metaphysics. It's about policy and duty.

  **5. "Which means all those cases where we casually say someone caused a death by standing by are really cases where we're blaming them for failing to prevent a harm that something else caused..."**
  *   **Specialist Verdict:** **Plausible, but reductive.**
  *   **The Nuance:** This is the "quasi-causation" move. It's defensible. However, it ignores the pragmatic view of causation (e.g., Christopher Hitchcock), which says causal claims are context-sensitive. In a courtroom context, the omission *is* the cause because it's the abnormal variable. In a pathology context, the disease is the cause. Both can be true simultaneously without one being a "fiction."
  *   **Keep/Trash:** Keep as a valid interpretation, but acknowledge the pragmatic alternative.

  **6. "...so causation by omission is basically a fiction we invented to make our blame look more objective than it actually is."**
  *   **Specialist Verdict:** **The Wince Moment.**
  *   **The Nuance:** This is an "error theory" of causal talk. It assumes our ordinary language is trying to describe metaphysical glue and failing. But if ordinary language is trying to track *counterfactual dependence* or *explanatory relevance*, it's not a fiction; it's just using a different definition of "cause" than the metaphysician. It's not making blame look objective; it's tracking the fact that the outcome *depended* on the agent.
  *   **Keep/Trash:** Soften. It's not a fiction; it's a pragmatic shorthand.

  ---

  ### Addressing Your Specific Suspicions

  **1. Is the metaphysical claim doing any real work in the moral conclusion?**
  Yes, but it's doing *too much* work. The argument relies on the premise that **Responsibility tracks Metaphysical Causation.** If you sever that link, the conclusion falls apart. Most modern moral philosophers *do* sever that link. They argue responsibility tracks **Control** and **Expectation**.
  *   *The Fix:* If you keep the moral conclusion, you must acknowledge that we hold people responsible for omissions *despite* the metaphysical weirdness, not *because* we are pretending they are causes. We hold them responsible because they breached a norm, regardless of the ontological status of the breach.

  **2. Is "almost everyone agrees" true?**
  No. It is a live, heated fight. The "omissions are not causes" view is dominant in *process* metaphysics, but the "omissions are causes" view is dominant in *counterfactual* theories and much of legal theory.
  *   *The Fix:* Change to "Many metaphysicians argue..." or "On a strict physicalist account..."

  **3. Is "no event to connect" the actual reason?**
  It is the reason for *Process Theorists*. It is not the reason for *Humeans* or *Counterfactual Theorists*. For them, the worry isn't "no event," it's "too many events" (the problem of profligate causation: if not-breathing caused the death, did not-eating-a-big-mac also cause it?).
  *   *The Fix:* Acknowledge that the "no event" argument is specific to those who view causation as a physical mechanism.

  **4. If omissions aren't causes, does it follow that a failure can't make a difference?**
  **Absolutely not.** This is the most important distinction for your newsletter.
  *   **Causation:** Often implies a mechanism or a "push."
  *   **Difference-making (Counterfactual Dependence):** Implies that if $X$ hadn't occurred (or hadn't been omitted), $Y$ wouldn't have happened.
  Omissions are terrible at *causing* (mechanically) but excellent at *making a difference* (counterfactually). The doctor's failure made all the difference in the world to the patient, even if no physical energy was transferred by the "not-checking."
  *   *The Fix:* Explicitly separate "making a difference" from "being a cause." Your friend's paragraph conflates them.

  ### Recommendation for Your Newsletter

  Your friend's paragraph is a perfect "straw man of the consensus." It's too clean. For a wonky newsletter, you want the friction.

  **Sentences to Keep:**
  *   "That's why the law treats acts and omissions differently..." (This is empirically true, even if the *reason* is debated).
  *   "...really cases where we're blaming them for failing to prevent a harm that something else caused." (This is a solid description of the *structure* of the situation, even if the metaphysics is contested).

  **Sentences to Modify/Drop:**
  *   Drop "Almost everyone agrees." Replace with "A dominant strand of metaphysical theory holds..."
  *   Drop "causation by omission is basically a fiction." Replace with "causation by omission might be better understood as a claim about dependence rather than mechanism."
  *   Modify the moral conclusion. Instead of saying we need a separate principle *because* it's not a cause, say we need a separate principle because *duties* are what bridge the gap between metaphysical inertness and moral blame.

  **The "Wonky" Angle:**
  The most interesting piece you can write isn't "omissions aren't causes." It's: **"Why we insist on calling them causes anyway."**
  If the metaphysics says "no," but our moral/legal intuition says "yes," the tension isn't a mistake—it's a feature. We use causal language to mark *responsibility*, not just *physics*. When we say the doctor "killed" the patient by neglect, we aren't making a metaphysical error; we are making a moral categorization. The "fiction" isn't a bug; it's the point.

  That allows you to keep your friend's deflationary insight (that there's no physical spark) without buying his error theory (that our talk is fake). Our talk is real; it's just normative, not descriptive.
