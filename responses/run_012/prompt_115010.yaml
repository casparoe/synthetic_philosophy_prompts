answer: |-
  The kitchen clock read 3:17 AM. The bottle of whiskey on the table was half empty, and between it and the two glasses lay a photograph. It showed a boy of six, grinning, missing a front tooth, holding a red balloon. Leo.

  Elias stared at the photo. Sarah stared at Elias.

  "It's over, Sarah," Elias said. His voice was rough. "The ceremony, the burial, the… the timeline. He isn't anywhere. He isn't *now*. To say otherwise is a category error."

  Sarah swirled the amber liquid in her glass. "He isn't *now*, Elias. I grant you that. But he *is*. Just as you are. Just as I am. We are all world-lines extending through the block. Leo's line doesn't vanish because it has an endpoint. It's just… fixed."

  "Fixed," Elias repeated. He tapped the photograph. "This is a piece of paper. Ink on gloss. It is a present trace. It exists now. But Leo? Leo is nothing. If only the present is real, then the past is literally nothing. To pretend Leo is 'somewhere else' in time is a comforting fiction. But it's false."

  "Is it?" Sarah leaned forward. "Let's talk about truth. It's true that Leo laughed at his fourth birthday party. It's true that Caesar crossed the Rubicon. What makes those sentences true, Elias? If the past is not real, if it is ontologically void, what is the *truthmaker* for those claims?"

  Elias sighed. He had heard this before, in seminar rooms that felt much warmer than this kitchen. "The truthmaker is the present state of the world. The world *now* has the property of 'having-contained-Leo's-laughter.' The past leaves its footprint on the present. The photograph, the memory in your brain, the carbon dating of the bones. The present is heavy with the weight of what was. We don't need ghostly past entities to ground truth. We just need a present that carries history."

  "That's magical," Sarah said softly. "You're saying the present has intrinsic properties that refer to non-existent things. You're asking the universe to carry a burden without a bearer. If Caesar crossed the Rubicon, there must be a *Caesar* and a *Rubicon* and a *crossing* that grounds the fact. If they don't exist, even tenselessly, then your truthmaker is just a present illusion. You're saying the universe is lying to us, pretending to have a past it never had."

  "The universe isn't lying," Elias snapped. "It's evolving. Reality is a moving spotlight. The spotlight is here. The rest is darkness. You want to say the darkness is just as bright as the light. That denies the very thing we feel most acutely: the passage of time. The loss."

  "The passage is the illusion," Sarah countered. "Think of Einstein. You know the math. Special Relativity. There is no privileged 'now.' If you move towards me, your plane of simultaneity tilts relative to mine. Events that are present for you are in my future or past. If 'the present' is the only reality, whose present counts? Yours? Mine? The photon's?"

  Elias gripped his glass. "Physics describes measurement, Sarah. It doesn't dictate metaphysics. Just because simultaneity is frame-dependent doesn't mean existence is. There is a metaphysical present that physics ignores because physics deals in coordinates, not experience."

  "But if there's no universal present," Sarah pressed, "then your 'moving spotlight' has nowhere to shine. There is no global 'now' for the spotlight to illuminate. The block universe is the only model that fits the geometry of spacetime. Leo is at coordinate *t-6years*. He is real there. He is eating cake. He is laughing. He isn't gone; he's just located at a temporal distance you cannot access."

  "Access?" Elias laughed, a bitter sound. "If I can't touch him, speak to him, see him, in what sense is he *there*? You're describing a library of ghosts. And it leads to a contradiction. The Problem of Temporary Intrinsics."

  He pointed a finger at her. "Leo in the photo is sitting. Leo at the funeral was lying in a casket. If all times are equally real, then Leo is *always* sitting and *always* lying down. How can one object possess contradictory properties? You have to slice him up into 'temporal parts.' The sitting-Leo and the lying-Leo. But that means Leo himself never changes. Change is just variation across parts, like a color gradient on a stripe. That's not change, Sarah. That's stasis."

  Sarah didn't flinch. "It is change, Elias. It's relational change. Leo is sitting *at t1* and lying *at t2*. There is no contradiction because the properties are indexed to times. Just as I can be 'here' in the kitchen and 'there' in the bedroom without contradiction, Leo can be 'then' and 'now' without contradiction. You confuse the whole person with a momentary slice. The whole person is the worm, not the slice."

  "The worm is a corpse," Elias said. "You're comforting yourself with geometry. You want Leo to be safe in the past, preserved like amber. But if the past is real, then his pain is real, too. His fear is real. It's happening right now, in your block. You're saying his death is eternal."

  "And you're saying he is nothing," Sarah shot back. "You're saying the love we feel for him is a reaction to a void. If Presentism is true, grief is a biological glitch. We are mourning something that has ceased to be. But if Eternalism is true, grief is… navigation. We are mourning our location relative to him."

  She reached out and touched the photograph. Her finger rested on the red balloon.

  "Look at this," Sarah said. "To you, this is a relic. A reminder of absence. To me, this is a coordinate. It points to a region of spacetime that is as substantive as the table we're sitting at. I don't have to believe he is *here* to know he is *real*."

  "But you can't go back," Elias said. "That's the cruelty of it. If he is real, why can't I reach him? Your theory gives me a universe full of people I am permanently severed from. It's a solipsism of the present moment, just stretched out. I am trapped in *now*, and Leo is trapped in *then*, and the walls are made of physics."

  "Better trapped with him," Sarah whispered, "than alone in a universe where he has been annihilated."

  "Annihilation is honest," Elias said. "It respects the finality. You want to hoard him. You want to keep him in a box where he never dies, but never lives, either. He's frozen. In your block, Leo never grows up. He never has a chance to not have cancer. He is fixed. Eternal suffering, or eternal joy, locked in amber. I say he is at rest. He is done. The present is the only place where agency exists. The past is closed. That is why the funeral mattered. We closed the book."

  "The book isn't closed," Sarah said. "It's just bound. We're just reading different pages."

  Elias looked at the clock. 4:02 AM. The sky outside was beginning to bruise with a faint, grey light.

  "You know," Elias said, his voice dropping the polemical edge, "when I look at this photo, I don't see a coordinate. I see a promise that was broken. Time took him. If time is just space, as you say, then time didn't take him. We just walked away from him."

  "We didn't walk away," Sarah said. "We moved forward. Along the same path he's on."

  Elias reached out and covered the photograph with his hand. He didn't pick it up. He just covered it.

  "If you're right," Elias said, "then he is still crying in the hospital. He is still laughing in the yard. All of it is happening. And I can do nothing to comfort him."

  "If you're right," Sarah replied, "then he is nowhere. And I can do nothing to remember him, because there is no 'him' to remember. Only a present state of my brain that mimics him."

  They sat in silence. The grey light grew stronger, bleaching the colors of the kitchen. The whiskey bottle caught the dawn and glowed.

  "Does it help?" Elias asked. "Believing he's still there?"

  Sarah looked at the covered photo. "It makes the silence less absolute. You believe the silence is empty. I believe it's just… quiet."

  Elias lifted his hand from the photo. The boy grinned up at them, missing a tooth, holding the red balloon.

  "He looks happy," Elias said.

  "He is," Sarah said. "At *t*. He is definitely happy at *t*."

  "And gone," Elias said. "At *t-now*."

  "Both," Sarah said.

  Elias stood up. His joints creaked. "I'm going to make coffee. The sun's coming up. The present is arriving, whether we like it or not."

  "And the past stays put," Sarah said.

  Elias paused at the counter. "Or it vanishes. One last time."

  "I'll wait for the coffee," Sarah said. She didn't look away from the photograph. She kept her eyes on the boy, as if holding her gaze could anchor him, as if looking was a form of travel.

  Elias filled the kettle. The water rushed from the tap, loud and immediate in the quiet kitchen. He listened to the sound. It was happening now. It would be gone in a moment. He didn't know if that made it precious, or if it made it a lie.

  He set the kettle on the stove and lit the burner. The flame clicked, then caught, blue and steady.

  "Sarah," he said, not turning around.

  "Yes?"

  "If Caesar crossed the Rubicon… I hope he felt the water cold."

  Sarah smiled, a sad, tired thing. "In the block, Elias, the water is always cold. And he is always crossing."

  Elias watched the flame. "Then I hope he doesn't get wet forever."

  "He won't," she said. "We're moving away from him."

  "Or he's moving away from us."

  "Does it matter?"

  Elias turned back. The grey light had turned gold. The photo on the table was just a photo again. Paper and ink.

  "No," Elias said. "I suppose it doesn't."

  He poured the water. Two cups. He brought one to the table and set it down next to the boy with the red balloon.

  "To the present," Elias said.

  Sarah lifted her cup. "To the block."

  They drank. The steam rose, hung in the air for a moment, and then vanished.
