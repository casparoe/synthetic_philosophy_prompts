  11. **Drafting the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure "Mesa-optimization" isn't treated as a failure mode itself, but as a mechanism. The failure is usually GMG or Deception *via* mesa-optimization. I will note this in the logical space.
      *   *Correction:* Ensure "Reward Hacking" is distinguished from "Outer Alignment". Outer = Human error in spec. Reward Hacking = Model exploiting spec.
      *   *Correction:* The prompt asks for "Logical Space First". I will structure the response with the Logical Space analysis first, then the Tree.

  12. **Final Polish:** Check tone. Needs to be pragmatic, slightly cynical (matching the user's frustration), but rigorous.

