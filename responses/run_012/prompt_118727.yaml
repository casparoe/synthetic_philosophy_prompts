          *   "Bending": Implies resistance + force.
          *   "Justice": Needs a metaethical anchor (Realism vs. Constructivism).
          *   "Units": Individuals vs. Systems.

      *   *Mapping the Uses:*
          1.  *Great-Uncle (Consolation):* Needs Transcendent Teleology or strong Probabilistic Drift. If the latter, it's risky. If the former, it's faith.
          2.  *Activist (Urgency):* Agentic Reading. Defensible as a conditional imperative.
          3.  *Colleague (Prediction):* Empirical Reading. Vulnerable to Whig history critique.
          4.  *Uncle (Reparations/Definition):* Definitional Reading. Morally horrifying if taken seriously (might makes right).

      *   *Refining the Verdicts:* Ensure distinction between *is* and *ought*. Ensure distinction between *guarantee* and *tendency*.

      *   *Self-Correction/Check:* Did I address the "telos vs. drift" distinction? Yes. Did I address "units of evaluation"? Yes. Did I flag conceptual vs. empirical? I need to make sure I explicitly label these in the text or a summary section. *Decision:* I will integrate the flags into the analysis but add a specific concluding note on methodology.

  6.  **Refining the Tone:**
      *   Avoid being dismissive. The slogan *does* work, even if philosophically messy.
      *   Maintain the "Philosopher of History" persona (referencing Hegel, Kant, Whig history, metaethics).
      *   Ensure the "Verdicts" are sharp.

  7.  **Final Review against Constraints:**
      *   Brainstorm privately first? (I will simulate this in the thought block, but the output must be the sorted menu).
      *   Menu from trivial to ambitious? Yes.
      *   Verdict on truth/platitude/substance? Yes.
      *   Conditions for truth (empirical, moral, agency, units)? Yes.
      *   Map the 4 uses? Yes.
      *   Flag unfalsifiable/expressive uses? Yes.
      *   Explicit about conceptual/empirical steps? Yes.

  8.  **Drafting the Response (Iterative refinement):**
      *   *Check on the "Uncle (Reparations)" point:* The user said "justice simply is whatever history eventually settles on." This is a form of historical positivism or might-makes-right. I need to call this out as the "Victory Definition."
      *   *Check on the "Activist":* This is the "King Reading" (MLK actually said this). It implies the arc *doesn't* bend automatically. This contradicts the "Consoling" reading. I need to highlight this tension.
      *   *Check on Metaethics:* If Justice is objective (Realism), the arc can miss it. If Justice is constructed (Constructivism), the arc *defines* it. This is crucial for the "Definitional" reading.

  9.  **Final Polish:** Ensure clear headings and logical flow. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I don't just list the readings but explain *what would have to be true* for them to hold, as requested. I also need to be careful not to conflate MLK's original theological intent with the secularized versions, though the prompt asks about the slogan *as used around the user*. I will focus on the logical structure of the claims themselves.

  *(Final check on "Conceptual vs Empirical")*: I will add a specific section or clearly marked annotations to satisfy the requirement "Please be explicit about which steps in your reasoning are conceptual and which are empirical."

