      *   **Requirements:**
          *   Brainstorm distinct assertions (private thought, then public menu).
          *   Create a "menu" of readings from trivial to metaphysically ambitious.
          *   Provide a verdict on each (True/False/Possible? Platitude/Substantive/False?).
          *   Analyze conditions for truth (empirical regularities, moral truth theory, agency, units of evaluation).
          *   Distinguish between *telos* (endpoint) vs. *drift* (probabilistic tendency).
          *   Analyze the metaphor's commitments (arc, bending, direction, destination).
          *   Map the four specific user-described uses to the menu readings.
          *   Evaluate the defensibility of those specific uses.
          *   Identify unfalsifiable or circular definitions.
          *   Distinguish conceptual vs. empirical reasoning steps.
          *   Flag confused questions.

  2.  **Deconstruct the Slogan:**
      *   "The Arc": Implies curvature, trajectory, a shape over time. Suggests a non-linear but directed path.
      *   "Of History": What is the subject? Human events? Moral progress? Institutional evolution?
      *   "Bends": Implies force, change in direction, not a straight line. Who/what bends it? Gravity? God? Human action?
      *   "Toward": Vector, directionality.
      *   "Justice": The target. Is this objective moral truth? Social stability? The victor's peace?

  3.  **Brainstorming Readings (Mental Draft):**
