      *   *Reading 2: Empirical Trend.* Things get better over time. (Graduate seminar).
      *   *Reading 3: Theological/Teleological.* God/Providence ensures it. (Great-uncle's consolation).
      *   *Reading 4: Pragmatic/Exhortative.* It bends *if* we bend it. (Climate activist).
