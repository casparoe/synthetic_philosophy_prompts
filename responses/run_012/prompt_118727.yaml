      *   *Menu:*
          1.  **The Definitional/Positivist Reading:** Justice = The Outcome. (Uncle's argument). *Verdict:* Unfalsifiable, morally vacuous.
          2.  **The Empirical/Inductive Reading:** Past data shows improvement. (Seminar colleague). *Verdict:* Falsifiable, likely false or Whiggish.
          3.  **The Probabilistic/Drift Reading:** Learning makes justice *more likely*, not certain. *Verdict:* Substantive, defensible but weak.
          4.  **The Agentic/Exhortative Reading:** The arc bends *because* we bend it. (Activist). *Verdict:* Not a prediction, a call to action.
          5.  **The Immanent Teleological Reading:** History has an internal logic (Hegel/Marx). *Verdict:* Metaphysically heavy, historically discredited but structurally coherent.
