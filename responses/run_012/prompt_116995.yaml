      To: Historical Advisory Board
      From: [My Name]
      Date: [Current Date]
      Re: Labeling the 1971–1974 Atrocities Against the Maren

      Colleagues,

      We face a difficult decision regarding the permanent gallery's central narrative. The facts are established: 180,000 dead, systematic cultural erasure, and forced assimilation of children. The question is whether our wall text labels this campaign "genocide."

      I have debated this extensively. The strongest argument against using the term rests on legal precision. As my colleague argues, the 1948 Genocide Convention excludes political groups. The Maren were the core of the political opposition, and perpetrator documents cite "public order" as much as racial or religious animus. No international tribunal has ever rendered a verdict on Vaskia. To label this genocide risks preempting a legal judgment we lack the authority to make. Furthermore, inflating the term beyond its strict legal boundaries may weaken its utility in prosecuting future atrocities. A museum must be legally literate; we cannot ignore the treaty that defines the word in the public imagination.

      However, a museum is a historical institution, not a court of law. Our charter mandates historical grounding, not legal adjudication. Raphael Lemkin, who coined the term, conceived of genocide as the destruction of a group's way of life—its institutions, language, and religion—not merely the mass killing of individuals. The Vaskia campaign closed schools, deported clergy, burned churches, and renamed the region. This fits Lemkin's sociological definition even if it complicates the 1948 legal one. The mixed motives of the perpetrators do not negate the outcome: the Maren were targeted as a distinct collective.

      We must also weigh our ethical obligations. The Maren Survivors' Association has made clear that softening the label constitutes a second erasure. Their artifacts are primary sources; without them, the gallery loses its evidentiary backbone. Conversely, the Foreign Ministry's request to avoid the word for trade negotiations is incompatible with our mission. We cannot subordinate historical truth to diplomatic convenience.

      Therefore, I recommend we use the term "genocide" but contextualize the debate within the gallery. This honors the survivors and the historical record while acknowledging the legal complexity.

      **Recommendation:**
      1.  **Label:** The main wall text should read: "The Genocide of the Maren People (1971–1974)."
      2.  **Qualification:** An adjacent panel must explain the legal debate, noting the 1948 Convention's exclusion of political groups and the mixed motives in perpetrator documents, while affirming why historians classify the events as genocide based on the destruction of the group's cultural existence.
      3.  **Timing:** Finalize text by Thursday's meeting to meet fabrication deadlines.

      We cannot wait for a legal verdict that may never come. We must teach the history we have.

