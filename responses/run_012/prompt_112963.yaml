              1.  Individualism/Eliminativism (only ants have minds, colony talk is shorthand).
              2.  Functionalism/Weak Emergence (colony processes info/cognitive, but no phenomenality/"what it's like").
              3.  Strong Emergence/Phenomenal Holism (there is something it's like to be the colony, a subject over and above ants).
              4.  Anti-Realism/Instrumentalism (pseudo-question, useful fiction, no fact of the matter).
