      *   *Q8 (Pain Response):* Colony avoids harm systematically. Is it pain? (Individualism: Ants feel pain. Functional: Nociception. Phenomenal: Suffering. Instrumental: Useful description.)
      *   *Q9 (Death):* Colony disperses. Did it die? (Individualism: Ants scattered. Functional: System stopped. Phenomenal: Subject died. Instrumental: Model no longer applies.)

      *Refining for Distinction:* I need to make sure the answers allow sorting.
      *   Pos 1 (Individualist): Will consistently deny colony-level attributes.
