      *Challenge:* Distinguishing Pos 2 and Pos 4 is notoriously hard in behavioral quizzes. Pos 2 says "It *is* a computer." Pos 4 says "It's *useful to treat it as* a computer." In a quiz, both might click "Yes" to "Does it process information?" I need to frame questions to catch the "realness" vs "usefulness" distinction.
