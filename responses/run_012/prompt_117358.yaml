  ### Brainstorming: Accounts of Unity and Your Commitments

  To audit your view, we must first map the metaphysical landscape regarding what makes all pleasures *pleasures*. There are five main candidate accounts:

  1.  **Common Phenomenal Quality:** All pleasures share a specific "feel" (e.g., a distinctive glow or tickle).
      *   *Your Status:* **Rejected.** Commitment (2) explicitly denies this.
  2.  **Common Attitude:** Pleasure is not a feeling but a pro-attitude (e.g., enjoyment) taken toward an experience.
      *   *Your Status:* **Tension.** Commitment (4) insists pleasure is fixed by *phenomenal character*, not attitudes/desires.
  3.  **Common Functional Role:** Pleasures are unified by what they *do* (e.g., reinforcing behavior, signaling fitness).
      *   *Your Status:* **Adopted.** Commitment (5) explicitly endorses this.
  4.  **Common Intentional Structure:** Pleasures share a specific direction of fit or representation of good.
      *   *Your Status:* **Neutral/Unused.** You do not invoke intentional content to unify pleasures.
  5.  **Family Resemblance:** There is no single essential property; pleasures overlap in crisscrossing ways.
      *   *Your Status:* **Adopted.** Commitment (2) endorses this.

  **Mapping Your Commitments:**
  *   **(2) & (5)** presuppose a **Functional/Family-Resemblance** account. You are explicitly moving away from Phenomenal Quality.
  *   **(4)** presupposes a **Phenomenal/Internalist** account. It claims the *intrinsic feel* alone determines pleasure status. This is the primary metaphysical friction point in your set.
  *   **(1)** presupposes a **Quantitative** account of value (Benthamite).
  *   **(6) & (7)** presuppose a **Qualitative/Weighted** account of value (Millian).

  ---

  ### Consistency Audit

  I have identified three clusters of tension. The first is fatal to your normative theory; the second is fatal to your metaphysics; the third is an explanatory gap.

  #### 1. The Normative Contradiction: (1) vs. (6) & (7)
  *   **Status:** **Genuine and Critical.**
  *   **The Tension:** Commitment (1) defines well-being strictly as the net balance of pleasure, where the amount of pleasure is fixed *exactly* by **Intensity $\times$ Duration**. It adds the exclusivity clause: "Nothing else contributes."
      Commitment (6) states that **Reach** is a value-relevant feature.
      Commitment (7) states that Life B is better than Life A *even if* Life A has a greater total of Intensity $\times$ Duration.
  *   **Why it is Severe:** This is a logical contradiction, not merely a theoretical tension. If (1) is true, Life A *must* be better than Life B (given your stipulation that A has higher $I \times D$). If (7) is true, (1) is false. You cannot hold that "Nothing else contributes" while simultaneously counting "Reach" as a contributor that can override $I \times D$.
  *   **Severity Rank:** **1 (Fatal).** This renders your position paper's thesis incoherent. You are asserting $X = Y$ and $X \neq Y$ simultaneously.

  #### 2. The Metaphysical Contradiction: (4) vs. (5)
  *   **Status:** **Genuine and Severe.**
  *   **The Tension:** Commitment (4) claims **Experiential Fixity**: whether an experience is a pleasure is fixed by its *phenomenal character alone*. This is an internalist claim.
      Commitment (5) claims **Functional Unification**: pleasures are unified by a *functional role* (disposition to continue/repeat). This is an externalist/relational claim.
  *   **Why it is Severe:** If functional role is what *unifies* pleasures (as per 5), then functional role is essential to their nature. If it is essential, then two experiences could not both be pleasures if they shared the same phenomenology but differed in function (e.g., a "pleasure" you are disposed to avoid). Commitment (4) denies this, insisting phenomenology alone suffices. You cannot define pleasure by its causal dispositions (5) while insisting its identity is fixed solely by its intrinsic feel (4).
  *   **Severity Rank:** **2 (High).** This makes your metaphysics of pleasure unstable. It leaves you vulnerable to the "Masochism Objection" (feeling good but not wanting to repeat) or "Wireheading Objection" (wanting to repeat without the natural function).

  #### 3. The Measurement Gap: (2) vs. (3)
  *   **Status:** **Apparent (Solvable).**
  *   **The Tension:** Commitment (2) denies a common phenomenal quality. Commitment (3) asserts a determinate, comparable positive valence.
  *   **Why it is Only Apparent:** It is possible to have a common metric without a common *quality*. For example, "weight" applies to feathers and lead despite no common phenomenal quality of "weightiness."
  *   **Dissolving the Appearance:** You can resolve this by leveraging Commitment (5). If pleasures are unified by functional role, then "Valence" (3) can be defined as the *strength of the functional disposition*. The "degree" of pleasure is the strength of the disposition to continue. This allows comparability without a common feel. However, this solution requires weakening Commitment (4).

  #### 4. The Moral/Prudential Distinction: (8)
  *   **Status:** **Consistent.**
  *   **Analysis:** There is no tension here. Distinguishing prudential value (well-being) from moral value is standard hedonist procedure. As long as you maintain that well-being is only *one* moral consideration, (8) stands.

  ---

  ### Ranking the Genuine Tensions

  1.  **(1) vs. (6) & (7):** **Critical.** This is a contradiction in the definition of your main subject (Well-Being). It makes your verdicts incompatible with your theory.
  2.  **(4) vs. (5):** **Severe.** This is a contradiction in the definition of your core concept (Pleasure). It makes your metaphysics incoherent.

  The first is more severe because a position paper on well-being must have a coherent normative theory. The second is more severe philosophically, as it undermines the mechanism by which you achieve the first. However, logically, (1) vs (7) is an impossibility proof against your current draft.

  ---

  ### Revisions: What Must Give?

  #### For Tension 1 (Normative): Revise Commitment (1)
  *   **The Revision:** Amend the definition of "Amount of Pleasure" in (1). Instead of "fixed by its intensity and duration," change it to "fixed by its intensity, duration, **and reach**."
  *   **The Cost:** You move from **Quantitative Hedonism** (Bentham) to **Qualitative Hedonism** (Mill). You lose the simplicity of a single calculus ($I \times D$). You must now explain how Reach weights Intensity (e.g., is Reach a multiplier?).
  *   **Why this is the Cheapest Revision:** It preserves your intuitive verdicts (6) and (7), which seem to be the motivating force of your paper. It keeps the view monistic (only pleasure matters), preserving the core of Hedonism.

  #### For Tension 2 (Metaphysical): Revise Commitment (4)
  *   **The Revision:** Drop the word "alone" in (4). Allow that whether an experience is a pleasure is fixed by its phenomenal character **in conjunction with its functional role**.
  *   **The Cost:** You abandon **Phenomenal Internalism**. You admit that context, disposition, or function partly constitutes the pleasure.
  *   **Why this is Necessary:** You cannot keep (5) (Functionalism) and (4) (Internalism) together. Since you explicitly state (5) is the "best answer to the heterogeneity problem," (4) is the outlier.

  ---

  ### The Single Best Revision

  **Revise Commitment (1).**

  **The Revision:**
  Change (1) to: *"Hedonism about well-being: a person's life goes better exactly to the extent that it contains a greater net balance of pleasure over pain. Nothing else contributes to well-being. I understand the amount of pleasure in an experience as fixed by its intensity, duration, **and reach**."*

  **Why this resolves the most tension:**
  1.  **Eliminates the Logical Contradiction:** It immediately reconciles (1) with (6) and (7). Life B can now be better than Life A because B's pleasures have higher *Reach*, which contributes to the "Amount" of pleasure, even if $I \times D$ is lower.
  2.  **Preserves Hedonism:** It maintains the monistic claim that *only* pleasure constitutes well-being. Reach is treated as a property *of the pleasure*, not an independent good (which would make you a Pluralist).
  3.  **Least Cost to Core Intuitions:** You indicated you are "persuaded by the heterogeneity problem" and hold the "Two-Lives Verdict." Revising (1) accommodates these strong intuitions. Revising (4) (the metaphysical alternative) would not solve the (1)/(7) contradiction; you would still have a normative theory that contradicts your own verdicts.

  **Is it still Hedonism?**
  **Yes.** This position is recognizably **Qualitative Hedonism**. It is the view famously associated with J.S. Mill. It remains hedonism because it maintains that pleasure is the *sole* constituent of well-being. It merely argues that the *value* of a unit of pleasure is not homogeneous; some kinds of pleasure (those with high Reach) are "weightier" than others.

  **Expert Caveat:**
  While revising (1) saves your normative theory, you **must** eventually address the (4) vs. (5) tension. If you submit this paper with (4) unchanged, a sharp reader will object: *"If Reach is a value-relevant feature of pleasure (6), and Reach involves 'organizing the rest of one's mental life' (6), then Reach is a relational/functional property. But you claim pleasure is fixed by phenomenal character **alone** (4). How can a relational property be fixed by an intrinsic property alone?"*

  To be fully consistent, you should eventually soften (4) to allow functional properties to help constitute the pleasure. But for the sake of the position paper's main argument (Well-Being), revising (1) is the priority.
