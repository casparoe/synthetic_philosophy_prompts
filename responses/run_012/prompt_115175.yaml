answer: |-
  Your friend's "Ingredient Test" is strong because it distinguishes between *persuasion* (which causes harm through the listener's independent choice) and *performance* (which causes harm as part of the act itself). However, as you noted, it fails on Cases 5 and 7 because it lacks a distinction between the *types of harm* involved. In Case 7, the "wrong" is political restructuring; in Case 5, the "wrong" is physical catastrophe. Your verdicts suggest you treat these domains differently.

  Here is the principle that generates your verdicts, refined to handle the inconsistencies you identified.

  ### The Domain-Relative Ingredient Principle

  **Core Statement:** Speech may be restricted only when it functions as an operative mechanism of a specific wrong, *unless* that wrong falls within the domain of political contestation.

  **Clause 1: The Transactional Ingredient Clause**
  Speech is restrictable when it constitutes a necessary step in the commission of a non-political wrong (fraud, harassment, imminent violence), where the speech act itself creates the harm regardless of the listener's deliberative processing.
  *   **Forced by:** Cases 3, 4, and 6.
  *   **Work done:** This captures the original "Ingredient Test." It handles Case 3 (fraud is the speech), Case 4 (harassment is the speech), and Case 6 (incitement is the coordination signal). It distinguishes these from Case 1 and 2, where the harm relies on the audience being persuaded over time.
  *   **Differentiation:** It excludes Case 7 because the "wrong" (abolishing elections) is a political outcome, not a transactional crime.

  **Clause 2: The Political Immunity Clause**
  Speech advocating for political outcomes, including those that would restrict future rights or alter the system of governance, is protected because the remedy for political danger is political contestation, not censorship.
  *   **Forced by:** Cases 1, 2, and 7.
  *   **Work done:** This resolves the failure of the Ingredient Test on Case 7. Even though the party's programme is an "ingredient" in a plan to end democracy, the harm is political. Therefore, the speech remains protected. It also covers Case 2 (denial as political revisionism) and Case 1 (hate speech as political platform).
  *   **Differentiation:** It excludes Case 3 and 4, where the harm is individual and financial/physical, not systemic/political.

  **Clause 3: The Operational Capacity Clause**
  Speech that functions primarily as a technical key to immediate physical catastrophe may be restricted if its operational utility outweighs its contribution to public deliberation.
  *   **Forced by:** Case 5.
  *   **Work done:** This allows you to restrict the safety interlock guide without banning all engineering writing. It treats the guide not as an argument (political) but as a tool (operational).
  *   **Differentiation:** It distinguishes Case 5 from Case 7. Case 7 is a plan for governance (political); Case 5 is a recipe for physical failure (operational).

  **Clause 4: The Factual Integrity Clause**
  Compulsion is permitted when it maintains factual accuracy in transactional or legal records, but forbidden when it enforces ideological conformity.
  *   **Forced by:** Case 8.
  *   **Work done:** This distinguishes 8a (correction of fact) from 8b (compelled slogan). It aligns with Clause 1 (transactions can be regulated) and Clause 2 (ideology is immune).

  ---

  ### Application to New Cases

  To test whether this is a principle or merely a labeled list, I will apply it to two cases designed to break the distinctions above.

  **Case A: The Whistleblower's Dump**
  An employee of a defense contractor publishes encrypted files containing the blueprints for a drone used in controversial strikes. The files include a manifesto arguing the drone violates international law. The publication makes it easier for hostile actors to jam or spoof the drone, potentially causing crashes.
  *   **Application:**
      *   *Clause 2 (Political Immunity)* protects the manifesto and the argument about international law (like Case 1 and 7).
      *   *Clause 3 (Operational Capacity)* threatens to restrict the blueprints, as they are technical keys to physical vulnerability (like Case 5).
      *   *Conflict:* The principle forces a split verdict. The argument is protected; the data is restrictable.
  *   **Embarrassment:** In reality, you likely cannot separate the blueprints from the argument. The blueprints *are* the evidence for the argument. If you restrict the blueprints under Clause 3, you effectively silence the political claim under Clause 2. The principle cannot accommodate a unified verdict here; it demands you carve up the publication into "speech" (protected) and "tool" (restricted), which may be practically impossible.

  **Case B: The Algorithmic Deepfake**
  A political group releases a hyper-realistic video of an opponent confessing to a crime they did not commit, generated by AI. It is released one hour before polls close. The group argues it is "satire" and "political commentary."
  *   **Application:**
      *   *Clause 2 (Political Immunity)* suggests protection, as it is about an election (like Case 7).
      *   *Clause 1 (Transactional Ingredient)* suggests restriction, as it functions as fraud/deception (like Case 3) and arguably bypasses deliberative capacity (the viewer cannot process it as speech, only as evidence).
  *   **Embarrassment:** The principle hinges on whether this is "persuasion" or "mechanism." If the video is indistinguishable from reality, it functions as a mechanism of fraud (Clause 1). But because it concerns an election, Clause 2 pulls toward immunity. The principle offers no clear tie-breaker for *timing* (one hour before polls) or *medium* (AI vs. lie). You would have to add a "Time and Medium" exception, which begins to look like a list of opinions.

  ---

  ### Honest Assessment

  You asked me to tell you whether the result is a principle or merely a list of your opinions with names attached.

  **The Verdict:** This is a **principle with a known instability.**

  It is not *just* a list, because it successfully unifies Cases 1, 2, 3, 4, 6, 7, and 8 under a coherent distinction between **Political Domains** (where speech is immune) and **Transactional/Physical Domains** (where speech can be an ingredient of harm). This explains why you permit the anti-democratic party (Case 7) but restrict the safety guide (Case 5): one threatens the *system of debate*, the other threatens *physical safety*, and your principle prioritizes physical safety over information freedom in technical contexts, but political freedom over systemic safety in political contexts.

  **The Inconsistency You Must Accept:**
  The principle cannot fully accommodate your unease in **Case 5** without admitting a risk to engineering freedom. If you accept Clause 3, you must accept that some engineering writing *will* be caught. You cannot have the restriction on the safety guide without a principle that could, in a different context, restrict a paper on cryptography or virology.

  Furthermore, the principle relies on a **value hierarchy** rather than pure logic:
  1.  Physical Safety > Information Freedom (Case 5)
  2.  Political Freedom > Systemic Safety (Case 7)

  This is not a contradiction, but it is a value judgment. If you ever encounter a case where *Political Freedom* threatens *Physical Safety* directly (e.g., a pamphlet urging a specific individual to commit suicide, or Case A above), the principle will fracture. You will have to decide which value ranks higher in that specific moment.

  **Conclusion:**
  Keep the **Domain-Relative Ingredient Principle**. It is robust enough to guide you, provided you acknowledge that Case 5 is the price you pay for Case 3, and Case 7 is the price you pay for Case 1. The "Ingredient Test" was correct about the *mechanism* of speech, but it required your *domain distinction* to handle the *purpose* of the harm.
