answer: |-
  This is a compelling brief. The core intuition behind moral trade—that agents with divergent value functions can exploit comparative advantage to increase expected value across the board—is robust. However, as you note, the literature often skips over the foundational plumbing required to make the engine run. If I were allocating this resource, I would prioritise foundational coherence over speculative extensions. We need to know if the car works before we ask if it can fly.

  Here are the three questions I would fund, in order of priority, followed by an explanation of what I would drop.

  ### 1. The Currency Problem: Trade Under Moral Uncertainty

  **The Question:** How do we construct a common metric of value when neither party is certain about the true moral theory, and the theories themselves may be incommensurable?

  **Reasoning:** This is the most upstream question. Before you can trade, you must know what you are trading. In standard economics, currency is assumed (money). In moral trade, the 'currency' is moral value. If I am 60% credence in utilitarianism and you are 60% credence in deontology, we lack a common denominator. If utilitarian value and deontological constraints are fundamentally different kinds of things, trade may be mathematically undefined.

  **Tractability:** This is highly tractable for a philosopher with decision theory competence. It requires formalising 'moral expected value' and investigating whether inter-theoretic comparisons are possible. It does not require empirical data, only rigorous conceptual analysis and modelling.

  **Current Activity:** There is significant work on moral uncertainty generally (e.g., the 'expected choice-worthiness' framework), but specific application to *trade mechanisms* is underdeveloped. Most work assumes a single agent deciding; few papers model the multi-agent exchange under uncertainty.

  **Priority Shifts:** This would move down if a consensus emerges that inter-theoretic comparison is impossible (making trade impossible). It would move up if new formal models suggest that 'fuzzy' currencies can be stabilised without full commensurability.

  ### 2. The Integrity Objection: Normative Permission and Complicity

  **The Question:** Is it morally permissible to act against one's credence-weighted best judgement in exchange for concessions, or does this constitute impermissible complicity in wrongdoing?

  **Reasoning:** Once we know *can* we trade (Question 1), we must ask *may* we trade. The integrity objection posits that morality is not merely about outcomes but about the agent's own relationship to the right. If I believe abortion is murder, can I 'sell' my opposition to it in exchange for you donating to malaria nets? Many would say this corrupts the agent, regardless of the net utility. This is the primary normative blocker to adoption.

  **Tractability:** This is pure normative ethics. It requires analysing agent-relative duties, complicity, and the nature of moral compromise. It is well-suited to a philosopher and requires no empirical work.

  **Current Activity:** The 'integrity' objection is classic in ethics (Williams, etc.), but its specific application to effective altruism and moral trade networks is nascent. It is often waved away rather than engaged with seriously.

  **Priority Shifts:** This would move up if moral trade begins to be practised in high-stakes environments (e.g., policy), attracting public criticism. It would move down if a robust defence of 'moral compromise' is established in the broader literature.

  ### 3. The Stability Problem: Norms as Public Goods

  **The Question:** Is a general norm of moral trade stable against defection, given that the benefits are diffuse but the costs of a 'bad trade' are local and visible?

  **Reasoning:** Even if trade is possible and permissible, will it persist? If the benefit of a trading norm is spread across the community but the cost of a specific trade (e.g., appearing to sell out) falls on the individual, rational agents may defect. This is a coordination problem. We need to know if moral trade requires central enforcement or if it can be decentralised.

  **Tractability:** This requires decision theory and game theory (philosophical flavour). It involves modelling incentive structures and reputation mechanisms. It is tractable for a researcher comfortable with formal modelling.

  **Current Activity:** There is work on social norms and cooperation, but little specific to the unique incentive structure of moral trade (where the 'payoff' is moral value, not material gain).

  **Priority Shifts:** This would move up if early adopters report instability or exploitation. It would move down if it turns out moral trade is naturally self-reinforcing due to high trust within the community.

  ---

  ### The Drops

  I would explicitly exclude the other candidates from this specific research programme, for the following reasons:

  *   **Acausal Trade:** I classify this as a dud for this brief. It relies on contested decision theories (such as FDT) and assumptions about logical correlation that are far from settled. It is highly speculative and downstream of interpersonal trade. If interpersonal trade fails, acausal trade is moot. It is better suited to a specialised decision theory grant, not a general moral trade enquiry.
  *   **Diachronic Trade:** This is arguably a category error. Trading with your future self is indistinguishable from precommitment or investment. Since the future self cannot renegotiate or refuse the trade, the 'exchange' element is missing. It is an interesting side-note on personal identity, but not central to moral trade theory.
  *   **Moral Realism:** I agree with your suspicion that this is a category error. Whether moral facts are mind-independent does not change whether agents with preferences can exploit comparative advantage. Anti-realists can trade preferences; realists can trade credences. This is metaethical distraction.
  *   **Laundering Worries:** This is a subset of the Integrity Objection (Question 2). If we solve integrity, we solve laundering. It does not need a separate stream of work.
  *   **Political Analogy:** Log-rolling is well-understood in political science. While useful for intuition pumps, the pathologies of vote trading are empirical and contextual. We need foundational theory first; analogies can wait.

  ### Conclusion

  The priority is to build the engine before painting the car. We must first establish that a currency exists (Uncertainty), that using it is not sinful (Integrity), and that the engine will not explode under load (Stability). These three questions are sequential and foundational. Solving them provides the theoretical bedrock upon which all other variations—acausal, diachronic, or political—must rest.

  \answer{(1) Currency under Moral Uncertainty; (2) Integrity and Complicity; (3) Stability of Trading Norms}
