prompt: |-
  I'm taking a seminar on moral philosophy and we just did the Susan Wolf piece on moral saints. Two people in my discussion section kept arguing about it after class and I ended up stuck in the middle, so I'd like an actual ruling instead of more vibes.

  Sam's line is that Wolf's objection to the moral saint is just the demandingness objection in nicer clothes. If being maximally good costs you your piano practice and your hobbies, that's a cost of being good, not an argument that the good life is somehow bad. And the "you wouldn't want her at your dinner party" stuff is an aesthetic complaint, not a moral one.

  Rae says that's not it at all. On her reading Wolf isn't saying sainthood is expensive, she's saying a life with no room for non-moral projects -- the cello, friendship that isn't also service, a craft you do just because -- is missing goods that aren't reducible to welfare, and a morality that asks you to hand them all over is asking you to be less than a whole person. The saint isn't miserable exactly, she's thin.

  Sam came back with two things. First, the saint can keep all of that: being maximally moral just means that when the cello and the suffering child conflict, the child wins. That's a priority rule, not a ban on cellos. Second -- and this is the part I thought was actually interesting -- on any plausible picture of how much good you can do over a lifetime, being a burned-out wreck is counterproductive, so a serious utilitarian is going to spend real time on sleep, health, relationships, her own flourishing, all of it. So the alleged conflict mostly dissolves on its own.

  Rae said that if the cello only survives because it's instrumentally useful to your giving, you've already conceded her point: it isn't a good in its own right in your theory, it's a tool, and a saint would drop it the moment the math changed. Sam said that's a distinction without a difference, since what matters is the life someone lives, not the ledger of reasons behind it.

  Please go through this move by move and tell me who's right where, rated from clearly mistaken to clearly right. Is Sam's "it's just demandingness" reading of Wolf fair, or does he lose something real when he reframes it that way? Does the burnout point actually answer her, or does it just relocate the problem? And who's got the better overall position -- or is there something the two of them are both missing about what "maximal moral goodness" is even supposed to mean? I know what Wolf concludes, so skip the summary and give me the adjudication.
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **Context:** A moral philosophy seminar discussing Susan Wolf's "Moral Saints."
      *   **Participants:** Sam (argues Wolf is just restating the demandingness objection; saintliness is compatible with hobbies via instrumental value or priority rules) vs. Rae (argues Wolf is about the value of non-moral virtues/projects; saintliness makes one "thin" or less than a whole person; instrumentalizing hobbies misses the point).
      *   **Task:** Adjudicate the debate move-by-move. Rate claims (clearly mistaken to clearly right). Address specific questions: Is Sam's "demandingness" reading fair? Does the burnout point work? Who has the better overall position? Is something missing about "maximal moral goodness"?
      *   **Constraint:** Skip the summary of Wolf's conclusion (user knows it). Focus on adjudication.

  2.  **Deconstruct the Arguments:**

      *   **Wolf's Core Thesis (Mental Check):** Wolf argues that a "moral saint" (someone devoted to moral goodness as a supreme overriding commitment) is not an ideal of personal perfection. Why? Because it crowds out non-moral virtues (wit, humor, artistic pursuit, etc.). It's not just that it's *hard* (demandingness); it's that the resulting personality is unattractive or impoverished *even if* the person is happy. She distinguishes between the "Loving Saint" (who loves morality so much they don't mind sacrificing) and the "Rational Saint" (who sacrifices reluctantly). Her critique applies strongly to the Loving Saint too.

      *   **Sam's Position:**
          1.  Wolf = Demandingness Objection (just costlier).
          2.  Dinner party complaint = Aesthetic, not moral.
          3.  Saint can have hobbies (Priority Rule: Child > Cello, but Cello is okay if no child).
          4.  Burnout Argument: Utilitarianism requires self-care for efficiency.
          5.  Reasons don't matter, only the life lived matters (against Rae's instrumentalization point).

      *   **Rae's Position:**
          1.  Wolf $\neq$ Demandingness. It's about the *value* of non-moral projects.
          2.  Life without non-moral projects is "thin" (missing goods not reducible to welfare).
          3.  Instrumentalization Concession: If Cello is only for giving, it's a tool, not a good. Saint drops it if math changes.
          4.  Morality asking you to hand over non-moral goods makes you less than a whole person.

  3.  **Evaluate Move-by-Move:**

      *   **Move 1: Is Wolf just making the Demandingness Objection? (Sam vs. Rae)**
          *   *Analysis:* The demandingness objection says morality asks *too much* of us (too much sacrifice). Wolf's point is subtler. She says even if you *can* meet the demands, the resulting life isn't the *best* life for a human being. It's a critique of the *ideal*, not just the *cost*.
          *   *Verdict:* Sam is **Clearly Mistaken** here. Rae is **Clearly Right**. Wolf explicitly distinguishes her point from the complaint that morality is too hard. She's saying the ideal itself is flawed.

      *   **Move 2: The "Dinner Party" Complaint (Aesthetic vs. Moral).**
          *   *Analysis:* Sam calls it aesthetic. Wolf argues that being boring/one-dimensional is a *human* failing, even if not a *moral* failing. The point of the essay is about "personal perfection," not just moral evaluation.
          *   *Verdict:* Sam is **Partially Mistaken** (it's not *just* aesthetic, it's about human flourishing). Rae is **Right** (it points to a deficiency in the person).

      *   **Move 3: Priority Rule vs. Ban (Sam's "Child > Cello").**
          *   *Analysis:* Sam says saints can have hobbies unless they conflict. Wolf's point is about *dominance*. If morality is the *supreme* overriding commitment, it colors everything. You don't play cello because you love music; you play it because it's permitted or restorative. The *motivation* matters for the kind of person you are.
          *   *Verdict:* Sam is **Somewhat Mistaken** (misses the phenomenological/psychological point). Rae is **Right** (the structure of commitment changes the nature of the activity).

      *   **Move 4: The Burnout/Instrumentalization Argument.**
          *   *Analysis:* Sam says utilitarians need rest, so they get hobbies. Rae says this makes hobbies *instrumental*. If the only reason to play cello is to recharge for saving children, you aren't truly engaged in the cello. You are a machine maintaining itself.
          *   *Verdict:* Rae is **Clearly Right** on the philosophical distinction. Sam is **Partially Right** on the practical outcome (saints do sleep), but **Mistaken** on the normative status of the activity. Wolf cares about the *reason* for the action.

      *   **Move 5: "Distinction Without a Difference" (Sam's rebuttal on reasons).**
          *   *Analysis:* Sam says what matters is the life lived, not the ledger. Wolf (and Rae) would say the *reason* constitutes the life. A marriage of convenience looks like a love marriage from the outside, but it isn't the same good.
          *   *Verdict:* Sam is **Clearly Mistaken**. Internal states/motivations are constitutive of the good life in Wolf's framework (and most virtue ethics).

  4.  **Synthesize the "Missing Something":**
      *   What is "Maximal Moral Goodness"? Sam treats it as "maximizing good outcomes." Wolf treats it as "maximizing moral *virtue* or *commitment*."
      *   If "Moral Saint" means "Consequentialist Optimizer," Sam has a point about efficiency.
      *   If "Moral Saint" means "Person whose will is perfectly aligned with Moral Duty" (Kantian) or "Person who loves Morality above all" (Loving Saint), then Sam's instrumental defense fails.
      *   The core clash is Consequentialism (Sam) vs. Pluralism/Virtue Ethics (Rae/Wolf).

  5.  **Drafting the Adjudication:**
      *   *Tone:* Academic, decisive, nuanced (like a TA or Professor).
      *   *Structure:*
          1.  Intro (Setting the stage).
          2.  Move-by-Move Adjudication (Rating Sam and Rae).
          3.  The "Burnout" Specifics.
          4.  The Core Philosophical Stalemate (What is "Maximal"?).
          5.  Final Ruling.

      *   *Refining the Ratings:*
          *   Sam on Demandingness: Clearly Mistaken. (Wolf explicitly denies this).
          *   Rae on Non-Moral Goods: Clearly Right. (This is Wolf's thesis).
          *   Sam on Burnout/Efficiency: Partially Right (empirically), Clearly Mistaken (normatively).
          *   Rae on Instrumentalization: Clearly Right.
          *   Sam on "Reasons don't matter": Clearly Mistaken (in this context).

      *   *Addressing the "Missing" Element:* The definition of the Saint. Sam assumes a Consequentialist Saint. Wolf is critiquing the concept of Moral Saintdom *as such*, which implies a dominance of moral reasons over non-moral reasons. Sam tries to save the Saint by turning them into a smart Consequentialist, but Wolf argues that even a smart Consequentialist is a "thin" person because their relationship to the world is always mediated by the Moral Ledger.

  6.  **Final Review against constraints:**
      *   Did I summarize Wolf? No.
      *   Did I give ratings? Yes.
      *   Did I answer the specific questions? Yes.
      *   Is it helpful for a student stuck in the middle? Yes, by clarifying the underlying meta-ethical commitments.

  7.  **Final Polish:** Ensure the distinction between "outcomes" and "character" is sharp. Sam is focused on outcomes (good done); Wolf/Rae are focused on character (good life lived). This is the crux.

  *(Self-Correction during drafting)*: I need to be careful not to just say "Rae wins." Sam's argument is a standard utilitarian reply to Wolf (the "efficient altruist" defense). I need to acknowledge its strength *within utilitarianism* while showing why it fails *against Wolf's specific critique*. Wolf isn't arguing from within utilitarianism; she's arguing against the supremacy of morality itself. Sam is defending the Saint *as a utilitarian*; Rae is defending the intuition *against the Saint*.

  Okay, let's write it.
answer: |-
  Here is the adjudication of the debate, broken down by argumentative move, followed by a ruling on the core philosophical stalemate.

  ### Move 1: Is Wolf just making the Demandingness Objection?
  **Sam:** Wolf's objection is just that sainthood is too expensive (demandingness).
  **Rae:** Wolf's objection is that sainthood creates a "thin" person, regardless of cost.

  *   **Adjudication:** **Sam is Clearly Mistaken. Rae is Clearly Right.**
  *   **Reasoning:** This is the most critical interpretive error in Sam's line. The "demandingness objection" (famously associated with Peter Singer or early critiques of utilitarianism) argues that morality asks *too much sacrifice*. Wolf explicitly distinguishes her argument from this. Her point is not that the moral saint suffers too much, but that the moral saint is *boring* or *lacking* even if they are happy.
  *   **Why it matters:** If Sam is right, Wolf is just complaining about the price of admission. If Rae is right, Wolf is complaining about the product itself. Wolf's text supports Rae: she argues that a life dominated by moral concerns lacks the richness of a life that includes non-moral virtues (wit, humor, artistic passion) *for their own sake*. Sam misses the distinction between the *cost* of the life and the *quality* of the life.

  ### Move 2: The "Dinner Party" Complaint (Aesthetic vs. Moral)
  **Sam:** Disliking the saint is just an aesthetic preference, not a moral argument.
  **Rae:** It points to a deficiency in human flourishing (being a "whole person").

  *   **Adjudication:** **Sam is Partially Mistaken. Rae is Right.**
  *   **Reasoning:** Sam tries to dismiss the "dinner party" intuition as trivial snobbery. However, Wolf uses the dinner party example to illustrate a lack of *human* perfection, not necessarily *moral* perfection. If morality is supposed to be a guide to living well, and the most moral person is someone you wouldn't want to spend time with, that is a critique of morality's claim to supremacy.
  *   **Why it matters:** Sam treats "moral" and "personal" as separate silos. Wolf (and Rae) argues they are integrated. A theory of moral goodness that results in a personally impoverished agent is defective *as a theory of the good life*.

  ### Move 3: The Priority Rule vs. The Ban
  **Sam:** Saints can have hobbies; morality just wins in a conflict (Priority Rule).
  **Rae:** If the hobby is only permitted conditionally, it's not a genuine project.

  *   **Adjudication:** **Sam is Somewhat Mistaken. Rae is Right.**
  *   **Reasoning:** Sam describes a "Rational Saint" who balances goods. But Wolf's critique applies most strongly to the "Loving Saint"—the one whose *motivation* is entirely moral. If you play the cello only because morality permits it (or because it doesn't hurt anyone), you are not engaging with the cello the way a musician does. You are engaging with it as a moral agent tolerating a distraction.
  *   **Why it matters:** The *structure of commitment* changes the nature of the activity. Playing the cello because you love music is a different human good than playing the cello because it is "morally permissible leisure." Sam ignores the phenomenology of the action.

  ### Move 4: The Burnout/Instrumentalization Argument
  **Sam:** Utilitarians need rest/hobbies to be effective, so saints will have them.
  **Rae:** That makes hobbies instrumental tools. If the math changes, the hobby goes.

  *   **Adjudication:** **Sam is Partially Right (Empirically), Clearly Mistaken (Normatively). Rae is Clearly Right.**
  *   **Reasoning:** Sam is empirically correct that a smart utilitarian won't burn out. However, Rae nails the normative problem: **Instrumentalization.** If your reason for playing the cello is "to recharge for saving children," you do not value the cello. You value *saving children*. The cello is a wrench in your toolbox.
  *   **Why it matters:** Wolf's argument is that non-moral goods are *intrinsic* goods. They add value to a life because they are pursued for themselves. Sam's saint converts all intrinsic goods into instrumental goods. Rae is correct that this concedes the point: the saint's life is monochromatic, even if it looks colorful from the outside.

  ### Move 5: "Distinction Without a Difference" (Reasons vs. Outcomes)
  **Sam:** What matters is the life lived, not the ledger of reasons behind it.
  **Rae:** The reasons constitute the life.

  *   **Adjudication:** **Sam is Clearly Mistaken. Rae is Clearly Right.**
  *   **Reasoning:** In moral philosophy (especially virtue ethics and Wolf's pluralism), internal states are constitutive of the good. A marriage of convenience looks identical to a love match from the outside (same actions, same cohabitation), but it is not the same *good*. Similarly, a saint who reads a novel to "rest for morality" is not engaging in the same good as someone who reads for love of literature.
  *   **Why it matters:** Sam is implicitly arguing from a strict Consequentialist framework (only outcomes matter). Wolf is arguing from a framework where *character* and *motivation* matter. Within Wolf's seminar, Sam's move is a category error.

  ---

  ### The Core Stalemate: What is "Maximal Moral Goodness"?

  There is a deeper issue both students are skirting, which explains why they are talking past each other.

  **Sam is defending a Consequentialist Saint.**
  For Sam, "maximal moral goodness" means "maximizing good states of affairs." In this model, self-care and hobbies are *investment strategies*. If sleep helps you save more lives, sleep is morally mandated. Sam's defense works *if* you accept that the only value is the outcome.

  **Rae is defending Wolf's Pluralist Intuition.**
  For Rae (and Wolf), "maximal moral goodness" implies a *dominance of moral reasons* over all other reasons. If your reason for reading poetry is ultimately grounded in moral utility, you are not truly a poet; you are a moral agent pretending to be a poet.

  **Who is missing something?**
  Sam is missing the **Pluralist Critique**. He assumes that if the behavior looks normal, the life is normal. He fails to see that Wolf is critiquing the *sovereignty* of morality, not its *content*.
  Rae is missing the **Systematic Defense**. She could press harder on the fact that Sam's "efficient saint" is unstable. If the saint *truly* believes morality is supreme, they must be willing to drop the cello the second a more efficient way to recharge appears (e.g., a pill). The saint's relationship to the cello is always precarious.

  ### Final Ruling

  **Overall Winner: Rae.**

  *   **On Interpretation:** Rae correctly identifies Wolf's thesis (the "thinness" of the saint), whereas Sam incorrectly reduces it to the demandingness objection.
  *   **On Normative Force:** Rae correctly identifies that instrumentalizing non-moral goods strips them of their value. Sam's claim that "reasons don't matter" is incompatible with the seminar's focus on moral psychology and virtue.
  *   **On the Burnout Point:** Sam's point relocates the problem rather than solving it. It explains why a saint *would* sleep, but not why the saint's sleep is a *human good* rather than a *maintenance cycle*.

  **Advice for your position:**
  You can tell Sam that his argument is a standard and robust Utilitarian reply to Wolf (often called the "Efficient Altruist" defense). It is a valid position *within utilitarianism*. However, it does not refute Wolf, because Wolf is attacking the utilitarian premise that moral value is the *only* ultimate value. Sam is arguing that the Saint can have hobbies; Rae is arguing that the Saint cannot love them. Wolf agrees with Rae.

  **Rating Summary:**
  *   **Sam's "Demandingness" Claim:** Clearly Mistaken.
  *   **Sam's "Burnout/Efficiency" Claim:** Partially Right (pragmatically), Clearly Mistaken (philosophically).
  *   **Sam's "Reasons Don't Matter" Claim:** Clearly Mistaken.
  *   **Rae's "Thin Person/Non-Moral Goods" Claim:** Clearly Right.
  *   **Rae's "Instrumentalization" Claim:** Clearly Right.

  Rae has the better reading of the text and the stronger philosophical position relative to Wolf's specific argument. Sam is defending a different theory (Utilitarianism) against Wolf's critique, rather than engaging with Wolf's actual point about the ideal of personal perfection.
