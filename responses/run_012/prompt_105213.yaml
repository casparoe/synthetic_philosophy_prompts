prompt: |-
  Rewatched Fight Club last night and I can't stop thinking about the twist — Tyler is the narrator, one guy, two names. Which got me thinking about that old Frege puzzle where a = b can tell you something new but a = a can't, even though both names point at the same thing (sense vs reference, I think — I'm a software dev not a philosopher so go easy). I want a proper reading of the film through that puzzle. Does the reveal really work the way Frege says, i.e. the info comes from getting two different modes of presentation of one object? My half-baked theory is that the film is actually a counterexample to Frege, because here you don't get two senses of one thing — you start out thinking there are two people, and the sameness turns out to be a fact about a guy's psychology, not about how the names hook onto the world. Tell me if that's right or if I'm muddling it. Also, does the film treat the identity as something that could've gone either way (just hidden from the narrator) or as something that had to be true all along? And compare it to the Superman / Clark Kent thing — is the narrator's blind spot the same kind of thing as Lois not knowing, or is it definately weirder because both names are his? Finish by telling me what the film adds to the puzzle that the Hesperus/Phosphorus example doesn't, and where the reading breaks down and the film just won't cooperate. No quotes or citations needed, I can't look anything up anyway.
