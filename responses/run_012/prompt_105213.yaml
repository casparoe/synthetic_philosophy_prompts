      *   *Reference (Bedeutung):* The actual object in the world (e.g., the planet Venus).
      *   *Sense (Sinn):* The mode of presentation, the way we think about the object (e.g., "Morning Star" vs. "Evening Star").
      *   *The Puzzle:* "Morning Star = Morning Star" is trivial. "Morning Star = Evening Star" is informative. Why? Because the *senses* differ, even if the *reference* is the same.
      *   *Application to Fiction:* How does this apply when one of the "objects" doesn't exist independently?

  3.  **Analyze *Fight Club* through Frege:**
      *   *The Setup:* Narrator (Jack) and Tyler Durden appear to be two distinct references.
      *   *The Twist:* They are the same physical body/person.
      *   *User's Theory:* The user suggests this might be a counterexample because it's psychological, not semantic.
      *   *Evaluation:* It's not exactly a counterexample, but it *complicates* the ontology. In Frege's classic case, Venus exists independently of the names. In *Fight Club*, "Tyler Durden" does not exist as an independent reference until the twist recontextualizes him as a projection.
      *   *Sense vs. Reference:* Before the twist, the audience and Narrator assign two different *references* (Person A and Person B). After the twist, we realize there is only one *reference* (The Narrator's Body/Mind), but the *senses* ("Me" vs. "My Ideal Self/Tyler") were distinct mental constructs.
      *   *Is it $a=b$?* Yes, but it's a specific kind of $a=b$ where $b$ was a hallucination generated by $a$.

  4.  **Address the "Contingent vs. Necessary" Question:**
      *   *Frege/Hesperus:* It was always true that Hesperus was Phosphorus. It's an identity fact about the universe.
      *   *Fight Club:* Was it always true the Narrator was Tyler? Yes, physically. But psychologically, the split was real to him. It wasn't a hidden fact about the world waiting to be discovered (like Venus); it was a fractured state of mind that *created* the illusion of two.
      *   *Nuance:* It feels necessary in retrospect (the clues were there), but the *existence* of Tyler as a separate agent was never true. So, $a=b$ is true, but $b$ never had independent ontological status.

  5.  **Compare to Superman/Clark Kent:**
      *   *Superman:* Two distinct social roles/costumes worn by one biological entity (Kal-El). Lois Lane lacks information. Both Clark and Superman have causal power in the world (Clark types, Superman flies).
      *   *Fight Club:* Tyler has causal power (blowing up buildings) but no independent biological substrate. The Narrator is asleep/unconscious when Tyler acts.
      *   *Key Difference:* Lois's ignorance is epistemic (she doesn't know). The Narrator's ignorance is ontological/psychological (he dissociated). Superman is a secret identity; Tyler is a split personality.

  6.  **What does the Film Add? (Hesperus vs. Fight Club):**
      *   *Hesperus:* Discovery of external fact.
      *   *Fight Club:* Discovery of internal fracture.
      *   *The "Sense":* In Hesperus, the senses are observational (morning sky vs. evening sky). In *Fight Club*, the senses are agential (Passive Observer vs. Active Agent).
      *   *The Twist:* It forces the audience to undergo the same cognitive shift as the Narrator. We believed in two references too.

