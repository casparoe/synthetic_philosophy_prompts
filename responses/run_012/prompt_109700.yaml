          4.  Are the "godless" (logical) and "theological" (foreknowledge) versions the same problem?
          5.  Does the theological reply (no causal priority) have an analogue in the godless version?
          6.  Role of future tense vs. modal notion.
          7.  **Constraint:** Be explicit about which step of the argument each fix rejects.
          8.  **Constraint:** Say whether bivalence can be preserved while blocking fatalism.
