answer: |-
  Here is a practical rubric designed for your volunteers, followed by the analysis of your three specific cases.

  ### The "Scientific Practice" Rubric (v1.0)
  **For Volunteer Judges:** Do not argue philosophy. Use this checklist to generate your comments. If a project hits a **STOP**, mark it "Ineligible for Top Awards" and write the reason code. If it hits a **FLAG**, score it normally but write a note for the Head Judge.

  #### PART 1: THE TRACK (30 Seconds)
  *Look at the project category and goal.*
  1.  **Is the primary goal to test a claim about how the world works?** (e.g., "Does fertilizer X grow taller plants?")
      *   **YES:** Go to **PART 2 (Experimental)**.
  2.  **Is the primary goal to build/optimize a solution to a human problem?** (e.g., "Design a cheaper water filter," "Train a classifier to sort trash.")
      *   **YES:** Go to **PART 3 (Engineering/CS)**.
      *   *Note to Judges:* If they are in the Engineering track, **ignore the "Hypothesis" rule.** Their "hypothesis" is a Design Goal (e.g., "If I change angle X, efficiency will improve"). Do not penalize them for not testing a theory of nature.

  ---

  #### PART 2: EXPERIMENTAL TRACK (Testing a Claim)
  *Ask: "What were you trying to prove or disprove?"*

  **Q1: The Claim Check**
  *   **Question:** Is the claim specific enough that a specific result could prove it wrong?
  *   **Sufficient Answer:** "If [Variable A] changes, [Variable B] will change by [Amount/Direction]." OR "There is no relationship between A and B."
  *   **Insufficient Answer:** "It might help a little," "It depends on the vibe," "It works for some people."
  *   **STOP (Code E1):** If the claim is so vague that *any* result counts as success. (This is not testable).

  **Q2: The Risk Check (Severity)**
  *   **Question:** Did the experimental design allow for the possibility that the student would be wrong?
  *   **Sufficient Answer:** "Yes, I had a control group," "I blinded the data," "I set a specific threshold for success before starting."
  *   **Insufficient Answer:** "I only tested cases where I knew it would work," "I didn't use a control because I knew the outcome."
  *   **FLAG:** If the test was weak (small sample, no control) but the claim was falsifiable. (Score low on Method, do not Disqualify).

  **Q3: The Result & Rescue Check (Ad Hoc Modifications)**
  *   **Question:** When the data came in, did the student accept the result, or did they change the rules to explain it away?
  *   **Sufficient Answer:** "The data showed no effect, so the claim is not supported." OR "The data showed an effect, matching the prediction."
  *   **Insufficient Answer (The "Rescue"):** "The data showed no effect, *but* that's because the equipment wasn't sensitive enough / the subjects didn't believe hard enough / the crystals needed more time." (Unless this was a pre-planned limitation).
  *   **STOP (Code E2):** If the student invents a new excuse *after* seeing the data to make the claim unfalsifiable. (This is intellectual dishonesty).

  ---

  #### PART 3: ENGINEERING / CS TRACK (Building a Solution)
  *Ask: "How did you know it got better?"*

  **Q1: The Metric Check**
  *   **Question:** Is there a clear, measurable definition of "better"?
  *   **Sufficient Answer:** "Efficiency increased by 5%," "Accuracy went from 80% to 90%," "Cost dropped by $10."
  *   **Insufficient Answer:** "It felt sturdier," "It looked cooler," "It worked better." (Without numbers).
  *   **FLAG:** If the metric is subjective. (Score low on Analysis).

  **Q2: The Iteration Check**
  *   **Question:** Did they test, fail, and fix? Or did they just build one thing?
  *   **Sufficient Answer:** "Version 1 failed because of X, so in Version 2 I changed Y."
  *   **Insufficient Answer:** "I built it and it worked."
  *   **FLAG:** If there was no iteration. (This is a demonstration, not a project).

  ---

  #### PART 4: LIMITS OF THIS RUBRIC (Read Before Judging)
  *   **This rubric cannot judge:** Whether a topic is "worthwhile" or "mainstream." A clean test of a weird claim is better than a messy test of a standard claim.
  *   **This rubric cannot solve:** The "Duhem-Quine" problem. (If a test fails, was the theory wrong, or was the thermometer broken?) *Instruction:* Assume the equipment worked unless there is obvious evidence otherwise. Focus on whether the student *considered* that possibility.
  *   **Hand-Off to Head Judge:** If a project passes the rubric but makes you uncomfortable (e.g., tests a controversial topic honestly), **do not disqualify it.** Flag it. The Head Judge handles the politics; you handle the method.

  ***

  ### Case Studies: Applying the Rubric

  Here is how your volunteers should process the three projects you are dreading, and why.

  #### Case 1: The "Positive Intentions" Seeds (8th Grade)
  *   **Track:** Experimental.
  *   **Q1 (Claim):** "Positive intentions change germination." *Verdict:* Vague, but passable as a starting point.
  *   **Q2 (Risk):** 20 pots, blinded by nobody. *Verdict:* FLAG (Weak method, but not a Stop).
  *   **Q3 (Rescue):** Data was flat. Student says: "Effect only appears when the intender believes."
  *   **Rubric Decision:** **STOP (Code E2).**
  *   **Rationale:** This is the textbook definition of an *ad hoc* rescue. By adding the condition "only when the intender believes" *after* seeing the null result, they have immunized the claim against any future test. How do you measure "belief"? If they say "I believed," it works. If they say "I didn't," it doesn't. There is no longer a risk of being wrong.
  *   **Judge's Note:** "Project renders the claim unfalsifiable post-hoc. No result could ever count against the hypothesis."
  *   **Outcome:** Ineligible for top awards. This satisfies the Chemist (it's not science) and the Educator (we aren't punishing the topic, we are punishing the reasoning).

  #### Case 2: The Solar Water Heater (Juniors)
  *   **Track:** Engineering.
  *   **Q1 (Metric):** Efficiency/Temperature output. *Verdict:* Pass.
  *   **Q2 (Iteration):** "Iteratively improved." *Verdict:* Pass.
  *   **The "Hypothesis" Conflict:** The district form forced them to write a hypothesis.
  *   **Rubric Decision:** **PASS (Engineering Track).**
  *   **Rationale:** Your volunteers need to be instructed to treat "Design Goal" as equivalent to "Hypothesis" for this category. The Ed School professor is right here: demanding a Popperian hypothesis for an optimization project is a category error. The science here is in the *comparative testing of designs*, not the prediction of a natural law.
  *   **Judge's Note:** "Strong engineering iteration. Clear metrics. Hypothesis treated as design constraint per Engineering Track guidelines."
  *   **Outcome:** Eligible for awards. This solves the district rule conflict without lying.

  #### Case 3: The Astrology Personality Test (Sophomore)
  *   **Track:** Experimental.
  *   **Q1 (Claim):** "Sun signs predict personality scores." *Verdict:* Specific and Falsifiable.
  *   **Q2 (Risk):** Sample of 60, clean test. *Verdict:* Pass. (It had a genuine chance of coming out the other way).
  *   **Q3 (Rescue):** Found nothing, wrote it up honestly. *Verdict:* Pass. (No ad hoc rescue).
  *   **Rubric Decision:** **PASS.**
  *   **Rationale:** This is the case where you will feel a flinch. Your panel will want to throw this out because Astrology is "not science." **You must override them.** Here is why you are wrong to flinch:
      1.  **Science is a verb, not a noun.** Science is not a list of Approved Topics (Chemistry, Physics, Biology). It is a method of inquiry. If a student takes a claim that exists in the world, derives a testable prediction from it, runs a controlled test, and accepts the null result, they have *done* science more effectively than a student who memorizes a textbook experiment and gets the expected result.
      2.  **Falsification is the goal.** The Retired Chemist wants falsifiability. This student *falsified* a claim. That is the highest form of Popperian science. To penalize them for testing a false claim is to penalize them for finding the truth.
      3.  **The "Pseudoscience" Trap.** If you disqualify this because "Astrology isn't real," you are teaching students that science is about defending orthodoxy, not testing reality. You are telling them: "Only test things we already know are true."
  *   **Judge's Note:** "Excellent experimental design. Honest reporting of null result. Claim was falsified."
  *   **Outcome:** Eligible for awards. Potentially a winner in Behavioral Science.
  *   **Why this hurts:** It feels like validating astrology. It isn't. It validates the *student's integrity*. The panel will argue this "wastes time" or "confuses the public." Your counter-argument is: "A student who can rigorously disprove a popular myth is exactly the kind of scientist we want to send to regionals."

  ### Implementation Notes for the Head Judge

  1.  **The "Values" Hand-Off:** The rubric explicitly flags where judgment calls are disguised as rules. If a judge feels a project is "ethically dubious" or "socially harmful" but passes the method checks, they must flag it to you. Do not let volunteers disqualify based on moral discomfort. That is your job, and you should rarely use it.
  2.  **Training the Volunteers:** In your 15-minute briefing, tell them: *"You are not judging whether the student is right. You are judging whether they gave themselves a chance to be wrong."*
  3.  **The "Hypothesis" Box:** Send an email to all judges before the fair: *"For Engineering/CS projects, interpret 'Hypothesis' on the entry form as 'Design Goal.' Do not penalize missing theoretical predictions."*
  4.  **Managing the Chemist:** Assign the Retired Chemist to Case 1 (Seeds). He will correctly identify the *ad hoc* rescue. Assign the Ed School Professor to Case 3 (Astrology). She will correctly identify that the method is sound despite the topic. Use their biases as features, not bugs, by directing them to the rubric section that aligns with their strength.

  This rubric separates the *demarcation problem* (what is science?) from the *quality problem* (was this a good test?). It allows you to reject the Seeds project for bad reasoning, accept the Heater project for good engineering, and accept the Astrology project for good science, keeping your panel from fighting and your students safe from arbitrary disqualification.
