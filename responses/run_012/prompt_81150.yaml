      *   **Troubleshooting:**
          *   *Problem:* They agree too fast. *Fix:* Inject new info or have the Facilitator play "Devil's Advocate" using the roles.
          *   *Problem:* They get stuck on biology facts. *Fix:* Remind them this is policy, not taxonomy.
          *   *Problem:* One person dominates. *Fix:* Role cards give specific speaking turns.

      *   **Limitations:**
          *   The game can't solve the problem.
          *   It can't show historical contingency.
          *   It can't fully simulate the emotional weight of "life."

  5.  **Drafting the Materials (Mental Check):**
      *   Need clear instructions.
      *   Need the "Fact Sheets" to be concise but ambiguous.
      *   Need the "Made-up Case" to be the center of attention.
      *   Need the Debrief script to be ready for a non-philosopher to read/adapt.

  6.  **Refining the "Chauvinism/Liberalism" aspect:**
      *   Make sure the "Made-up Case" is the trigger.
      *   If they define life as "DNA-based," they exclude the Sample (Chauvinism).
      *   If they define life as "Chemical Change," they include Fire/Prions (Liberalism).
      *   The roles must force them to pick a side.

  7.  **Final Polish:**
      *   Ensure the tone is respectful of their expertise (microbiology) but guides them into the philosophical trap.
      *   Make sure the user (retired microbiologist) feels empowered to run this without a philosophy degree.
      *   Check timing. 90 minutes is short for 14 people. Need strict timekeeping.
      *   *Self-Correction on Group Size:* 14 people in one discussion is chaos. I will recommend splitting into 3 working groups (Science, Safety, Ethics) that must merge recommendations. This ensures everyone talks.

  8.  **Wait, one constraint:** "The rules and roles should force them to argue about the definition rather than just list criteria."
      *   *Idea:* Give them a "Definition Budget." They only get 3 criteria. They have to choose which 3 matter most. This forces trade-offs.
      *   *Idea:* Give them "Veto Tokens." If a definition classifies a Precedent in a way a role disagrees with, they spend a token to block it.
      *   *Selected Mechanic:* **The Consistency Constraint.** You cannot vote on the Sample until you have classified the Precedents *and* written the Rule. If the Rule doesn't match the Classification, the Facilitator rejects it. This forces the "Bind."

      *(Self-Correction)*: 14 people is still too many for one consensus group. I'll structure it as **3 Delegations** (Science, Safety, Public). Each delegation agrees internally, then the Delegations negotiate the final Definition. This creates inter-group and intra-group tension.

      *Let's finalize the structure:*
      1.  **Intro:** Scenario + Stakes.
      2.  **Phase 1 (The Trap):** Sort Precedents individually/in pairs. Realize disagreement.
      3.  **Phase 2 (The Bind):** Form 3 Delegations. Draft a Definition that fits their Sort *and* their Agenda.
      4.  **Phase 3 (The Crisis):** Apply to Sample. Vote.
      5.  **Debrief.**

      *Wait, simpler is better for a first run.*
