answer: |-
  This is a fantastic use of your expertise. You know the biology better than any philosopher, and this scenario leverages that authority while forcing the philosophical problem to the surface.

  Here is a complete run-sheet for your 90-minute session. It is designed to be "low prep, high friction."

  ### **Session Title:** The Enceladus Protocol
  **Goal:** Experience the tension between defining life too narrowly (chauvinism) and too broadly (liberalism) under policy pressure.
  **Participants:** 14 people.
  **Room Setup:** One large table or circles of chairs. Whiteboard/Flipchart essential.

  ---

  ### **1. Materials to Prepare (Printable)**

  **A. The Mission Mandate (1 copy for the table)**
  > **MISSION: CRYOS**
  > **Objective:** Analyze sample from Subglacial Lake 'Oceanus'.
  > **The Sample:** "The Pore-System" (See Fact Sheet).
  > **The Decision:** You must recommend one action:
  > 1.  **PUBLISH:** Treat as abiotic chemistry. No containment. (Risk: Missed life / Contamination).
  > 2.  **STERILIZE:** Treat as hazardous contaminant. Destroy sample. (Risk: Destroying life / Loss of data).
  > 3.  **QUARANTINE:** Treat as Living. Return to Earth in high containment. (Risk: Extreme Cost / Planetary Protection Breach).
  >
  > **RULE:** You cannot vote on the Action until you agree on a **Definition of Life**. This Definition must be written down and applied consistently to the Precedent Cases.

  **B. The Sample Fact Sheet (1 per person)**
  > **SAMPLE ID:** 88-Beta ("The Pore-System")
  > **Origin:** Mineral micropores in subglacial rock.
  > **Structure:** No lipid membrane. No nucleic acids (DNA/RNA).
  > **Composition:** Short-chain peptides (amino acids) and clay catalysts.
  > **Behavior:**
  > *   When fed specific amino acids, the peptide mix rearranges to match the composition of the parent pore.
  > *   It maintains a chemical gradient across the mineral pore wall.
  > *   If removed from the mineral pore, the reaction stops immediately.
  > *   It does not move. It does not evolve via mutation, but pore-to-pore variation exists based on local mineral availability.

  **C. Precedent Cards (Cut into strips, 1 set per 2 people)**
  *   **Virus:** Has genome, no metabolism, needs host to replicate.
  *   **Viroid:** Naked RNA, no protein coat, infects plants.
  *   **Prion:** Misfolded protein, induces other proteins to misfold, no genome.
  *   **Plasmid:** DNA loop, replicates inside bacteria, independent of chromosomal DNA.
  *   **Mitochondrion:** Has DNA, makes energy, cannot survive outside cell.
  *   **Mule:** Sterile hybrid, cannot reproduce, complex metabolism.
  *   **Worker Ant:** Sterile caste, cannot reproduce, complex metabolism.
  *   **Bacterial Spore:** Metabolically inactive, dormant for centuries, revives later.
  *   **Fire:** Consumes fuel, grows, reproduces (spreads), has no genome.

  **D. Role Cards (14 total)**
  *   **4 x Mission Scientists:** *Goal: Maximize Discovery.* You hate False Negatives. If it might be life, it is life. You want to PUBLISH or QUARANTINE.
  *   **4 x Planetary Protection Officers:** *Goal: Zero Risk.* You hate False Positives. If it's not definitely life, it's dirt. You want to STERILIZE.
  *   **3 x Bioethicists:** *Goal: Moral Protection.* You worry about suffering and rights. If it has agency or autonomy, it needs protection (QUARANTINE).
  *   **3 x Mission Engineers:** *Goal: Feasibility.* Quarantine costs 10x more than Sterilize. Publish is free. You want the cheapest safe option.

  ---

  ### **2. Timeline (90 Minutes)**

  **00:00 – 00:10: The Hook (No Lecture)**
  *   Hand out **Mission Mandate** and **Sample Fact Sheet**.
  *   **Say:** "Welcome. You are the Planetary Protection Committee. We have a sample. It looks weird. Your job is to decide what to do with it. But there is a rule: You cannot decide the Action until you agree on a Definition of Life that justifies it. You have 80 minutes. Go."
  *   Hand out **Role Cards** and **Precedent Cards**.

  **00:10 – 00:30: Phase 1 - The Precedent Trap**
  *   Ask them to sort the **Precedent Cards** into "Alive" and "Not Alive" piles individually or in pairs.
  *   **Do not let them discuss the Sample yet.**
  *   **Your Job:** Walk around. Listen. When you hear someone say "Viruses aren't alive because they don't metabolize," ask: "What about the Spore? It doesn't metabolize while dormant."
  *   *Goal:* Let them realize they already disagree on Earth biology before tackling the alien sample.

  **00:30 – 01:10: Phase 2 - The Definition Struggle**
  *   Bring the group together. Ask for a show of hands: "Who thinks the Virus is alive?" (Note the split).
  *   **Task:** They must draft **one** written Definition of Life.
  *   **Constraint:** The Definition must classify the Precedents consistently. If their Definition says "Metabolism is required," they must explain why the Spore is alive (or admit it isn't).
  *   **Apply to Sample:** Once they have a draft Definition, apply it to "The Pore-System."
  *   **The Bind:**
      *   If they require DNA -> Sample is dead (Scientists will revolt).
      *   If they require only "Chemical Replication" -> Fire/Prions might become alive (Safety will revolt).
      *   If they require "Individuality" -> Worker Ants/Mules might be excluded (Ethicists will revolt).
  *   **Your Job:** Play the "Consistency Check."
      *   *You:* "Your definition says 'Must contain genetic material.' You voted Virus = Not Alive. Consistent. But now Sample = Not Alive. Scientists, can you accept that?"
      *   *You:* "Your definition says 'Self-sustaining chemistry.' Fire fits that. Safety, are you okay sterilizing a fire?"

  **01:10 – 01:20: Phase 3 - The Vote**
  *   Force a vote on the Action (Publish, Sterilize, Quarantine).
  *   Ask one person from each Role Group to justify the vote based *only* on the Definition they wrote.

  **01:20 – 01:30: Debrief (The Philosophy)**
  *   (See script below).

  ---

  ### **3. The Debrief Script (For You)**

  *Do not use jargon until now. Now you reveal the map.*

  **1. The Chauvinism/Liberalism Bind (5 mins)**
  *   "You likely felt pulled in two directions. If you made the definition tight (DNA, Cells), you felt safe, but you probably excluded the Sample. In philosophy, we call this **Earth Chauvinism**. You define life by what we know, risking missing what we don't."
  *   "If you made the definition loose (Chemistry, Replication), you included the Sample, but did you accidentally include Fire or Crystals? This is **Liberalism**. You risk false positives."
  *   "There is no scientific fact that solves this. It is a policy choice."

  **2. Necessary & Sufficient Conditions vs. Cluster Concepts (5 mins)**
  *   "You tried to write a rule: 'If X and Y, then Life.' This is looking for **Necessary and Sufficient Conditions**. You found that every condition had an exception (Spores don't metabolize, Mules don't reproduce)."
  *   "Philosophers like Wittgenstein suggest life might be a **Cluster Concept**. Things are 'alive' if they have enough of a family resemblance (metabolism OR reproduction OR evolution), not all of them."
  *   "But Cluster Concepts are hard to write into law. How many traits are enough? 3 out of 5? Which ones?"

  **3. Natural Kinds vs. Pragmatism (5 mins)**
  *   "You were arguing as if 'Life' is a **Natural Kind**—like Gold or Water. Something that exists in nature waiting to be discovered."
  *   "But today showed that 'Life' might be a **Pragmatic Category**. It depends on what you are trying to *do*. Safety Officers needed a definition that prevents contamination. Ethicists needed one that prevents harm. You weren't finding the truth; you were negotiating a boundary for a specific purpose."

  ---

  ### **4. Troubleshooting: What Will Go Wrong**

  **Problem 1: They agree too quickly.**
  *   *Symptom:* They vote "Quarantine" in 20 minutes because "It's alien, better safe than sorry."
  *   *Fix:* Play the Engineer Role. "Quarantine costs $4 billion and delays the mission 10 years. The budget gets cut if you do that. Can you justify the cost with your definition?" Force them to pay the price of their definition.

  **Problem 2: They get stuck on biological facts.**
  *   *Symptom:* They argue for 30 minutes about whether a virus *really* metabolizes.
  *   *Fix:* Intervene. "Stop. In this committee, the truth is what you agree it is. If you can't agree on the Virus, you can't agree on the Sample. Pick a stance and write the definition that supports it."

  **Problem 3: One person dominates.**
  *   *Symptom:* A retired biologist (maybe you, or a participant) takes over.
  *   *Fix:* Use the Role Cards. "I need to hear from an Ethicist. How does this definition impact moral status?" "I need to hear from Engineering. Is that definition feasible?"

  **Problem 4: They create a "Checklist" Definition.**
  *   *Symptom:* "Life is 3 out of 5 of these traits."
  *   *Fix:* This is actually a good outcome (Cluster Concept). Push them on it: "Okay, the Sample has 2 out of 5. Is it 51% alive? Do we quarantine 51% of the sample?" Highlight the vagueness.

  ---

  ### **5. Limitations: What This Game Can't Do**

  *You need to say this yourself in the final 2 minutes.*

  1.  **Historical Contingency:** The game implies we can just "pick" a definition. In reality, our definition of life is stuck with 19th-century baggage (thermodynamics, cell theory). We can't just start over.
  2.  **The "Shadow Biosphere":** The game assumes the Sample is *one* thing. In reality, if we find life, it might be so different we don't recognize it as a single category at all.
  3.  **Emotional Weight:** It's easy to say "Sterilize the prion." It is much harder to sterilize something that screams. The game simulates the logic, not the moral horror.

  ### **Facilitator Cheat Sheet (For You)**

  *   **If they say:** "Life must evolve."
      *   **Counter:** "The Sample varies by pore, but doesn't mutate. Is it a fossil? Or a new kind of chemistry?"
  *   **If they say:** "Life must have a boundary (membrane)."
      *   **Counter:** "The Sample uses a mineral pore as a boundary. Is the rock alive?"
  *   **If they say:** "It's obviously alive/obviously dead."
      *   **Counter:** "Convince the Safety Officer who has to sign the liability waiver."
  *   **If they ask you:** "What do you think? You're the microbiologist."
      *   **Answer:** "My science tells me what it *does*. Your philosophy tells me what it *is*. I can't answer that."

  ### **Why This Works for Your Background**
  You aren't teaching philosophy; you are facilitating a simulation where philosophy becomes the *only* tool left to solve the problem. Your authority validates the biology, which makes the philosophical deadlock more frustrating and real. You are the "Subject Matter Expert" witness, not the lecturer. This keeps you out of the "sage on the stage" trap and lets the participants discover the bind themselves.
