          *   *Better approach:* 3 Teams representing different agencies.
              *   Team A: NASA/Science (Push for Publish).
              *   Team B: BioSafety (Push for Sterilize).
              *   Team C: Ethics/Policy (Push for Quarantine/Protection).
          *   *Wait, 14 people:* 3 groups of 4, plus 2 floaters? Or 2 groups of 7?
          *   *Decision:* 2 Groups of 7. They compete to propose the definition. Then a joint vote.
          *   *Actually, to maximize friction:* Assign roles *within* the single group. 14 is too many for one conversation. Let's do 3 Sub-Committees (Science, Safety, Ethics) of 4-5 people each. They must produce a joint recommendation.
      *   **Materials:** Fact sheets are crucial. The "Precedent Cards" need to be ambiguous enough to argue about.
      *   **Rules:** The "Definition Lock." They cannot vote on the Sample until they write down a Definition of Life that classifies the Precedents consistently. *This is the key mechanic.* If they say Viruses are alive, they must explain why Prions aren't (or are).

      *   **Refining the Mechanic:**
          *   Give them the Precedent Cards.
          *   Ask them to sort into "Alive" / "Not Alive" / "Unsure."
          *   Then ask them to write the Rule that justifies that sort.
          *   Then apply Rule to the Sample.
          *   *Problem:* They might just list criteria.
          *   *Fix:* The "Veto Card." If a definition excludes something the Science team says is alive, they can veto. If it includes something Safety says is dangerous but not alive, they can veto.
          *   *Better Fix:* The "Mission Mandate." The definition determines the *action*.
              *   If Alive -> Quarantine (High Cost, High Protection).
              *   If Not Alive but Hazardous -> Sterilize (Medium Cost).
              *   If Not Alive & Safe -> Publish/Ignore (Low Cost).
              *   *Wait, the prompt says:* "Sterilized, Published, or Quarantined."
