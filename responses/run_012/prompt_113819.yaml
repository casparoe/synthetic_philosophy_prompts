      *   *Paragraph 2: Address rigidity. Rigidity says you keep fixed what the experience didn't speak to. If I learn about A, I hold A-conditioned beliefs about B fixed. If I learn about B first, I hold B-conditioned beliefs about A fixed. These are different constraints because the experiences are different. Rationality is about responding correctly to the experience you actually had, not about guaranteeing that different sequences of experiences lead to the same spot.*

  4.  **Refining for Constraints:**
