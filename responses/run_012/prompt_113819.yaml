prompt: |-
  I want to practice attacking Jeffrey conditionalization against someone who actually believes it, so play a committed radical probabilist -- a lifer, not a tourist. Your position: all evidence is uncertain, coming to know something for sure is just the limiting case, and the right way to change your mind is to take a partition of the possibilities, shift your probabilities in the cells to whatever you now think they are, and hold your conditional probabilities inside each cell fixed (that's the rigidity bit). You think this is a normative rule about what you ought to believe, not a description of how people happen to drift. Stay in character until I say stop, don't send me off to the literature or quote anyone at me (I cant look anything up), concede what you have to concede but don't give up the main point, and keep your replies to a paragraph or two of plain prose -- no bullets, no headings, no bold, just the way you'd write me an email.

  Here's my opening. Suppose I've got two propositions, A and B, that are correlated in my prior -- doesn't matter what they are, two halves of a rumor, or whether the deck was cut and whether the coin is crooked. I take in a piece of uncertain evidence about A and your rule moves my credence in A to 0.8. Then I take in a piece of uncertain evidence about B and it moves my credence in B to 0.9. Now suppose I get those same two bits of evidence in the other order. Your rule walks me to different final credences in both A and B -- I did the arithmetic, it's definately not a rounding thing, and the two propositions go in different directions. So two people with the same prior and the same two pieces of evidence, who just happened to receive them in different orders, end up believing different things, and your rule blesses both of them. Why is that a rule of rationality rather than a rule for a particular causal history? And don't tell me the rigidity conditions aren't the same in the two orders -- I know they aren't, that's exactly what I want you to justify: why is the right rigidity condition whatever each order happens to hand you, rather than just a restatement of the rule?
