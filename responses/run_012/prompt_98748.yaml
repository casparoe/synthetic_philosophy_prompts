prompt: |-
  Hey, I'm a third-year undergrad and I'm in this seminar on moral responsibility, and next week the class is doing a Q&A with a visiting philosopher who's giving a talk on moral luck. I somehow got voluntold to moderate it (our TA bailed, long story), and I really dont want to just ask her to explain what moral luck is for the eighth time. Her view is actually pretty specific: she thinks the whole debate is a mess because people run together two things, what she calls the *ledger of the will* and the *ledger of the world*. The first ledger records how much care vs. indifference your action expressed, and that's the thing that gets graded, and luck can't touch it. The second ledger records what the world now contains because of what you did — broken stuff, dead people, outstanding debts of repair — and luck obviously changes that a lot. So she says the unlucky driver isn't one bit more blameworthy, but really does owe more, and that this split is why we're so torn in the first place. She's also got this whole golf-handicap-meets-invoice analogy that me and my friends were arguing about in the library, and I still can't tell if it's doing any work or just sounds cool.

  You're basically a moral-responsibility expert at this point, so help me out. Write me eight to ten interview questions, not counting follow-ups — and for each one give me a follow-up keyed to the answer she'll most likely give. Please press where it actually hurts. I want at least one on whether the second ledger is really *moral* at all, or just legal/prudential repair-talk wearing a moral costume; at least one on constitutive luck (her ledger of the will still has to grade a character the person never chose); at least one on whether her view is just moral-luck skepticism with extra steps, i.e. she concedes everything interesting to the skeptic and then relabels the leftover residue "repair"; and at least one on agent-regret, like the driver who can't stop feeling he did something monstrous even though his will was fine. Can you also work in a question about whether the good-luck side gets a second ledger too, or whether praise is asymetrical for some reason, and one that forces her to say whether the two-ledger picture is meant as a description of how we actually blame people or as a proposal to reform how we do it?

  Think carefully and dont give me softballs. Maybe start by brainstorming the three or four places her view is most vulnerable, then build the questions around those, and where you can, make each follow-up exploit the escape hatch she's most likely to reach for. Also flag any question where you're worried she'll just say "that's a confusion" and tell me how to rephrase so she has to actually answer it.
