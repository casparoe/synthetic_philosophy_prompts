answer: |-
  You have hit upon one of the most famous and difficult cruxes in early modern metaphysics. Your reading of the text is spot-on: if the Complete Individual Concept (CIC) contains *all* predicates, then changing a predicate changes the subject.

  To answer your headline question immediately: **Leibniz is not a believer in Transworld Identity (TWI) in the Kripkean sense.** He is much closer to Counterpart Theory (CT), but with significant metaphysical differences that prevent him from being a straightforward Lewisian.

  Here is a walkthrough of the relevant mechanics in the *Discourse*, how they handle your puzzles, and where modern modal categories might be tripping you up.

  ### 1. The Textual Engine: Sections 13 and 14
  The stretch you are working through is primarily **Section 13** ("The individual notion of each person includes once for all everything that will ever happen to him") and **Section 14** (on the connection between substances).

  In Section 13, Leibniz writes:
  > "God sees in each portion of the universe the whole universe, because of the perfect connection of things... Thus the nature of each individual substance is to have a notion so complete that everything that can be attributed to it... can be deduced from it."

  The "Alexander" example follows immediately. Leibniz argues that if you take the subject "Alexander" and the predicate "conquers Darius," the connection is not contingent in the way we usually think. It is *hypothetically necessary*.
  *   **The Logic:** If God conceives of *this* specific Alexander, He conceives of a concept that includes conquering Darius.
  *   **The Implication:** If God were to conceive of a man who looks like Alexander, has the same parents, but *does not* conquer Darius, that is not a modification of the concept "Alexander." That is a **different concept entirely**.

  This commits Leibniz to the view that **individuals are world-bound.** There is no "Alexander" that floats free of his specific history to be placed in different worlds. There is only the concept *Alexander-who-conquers-Darius*.

  ### 2. Leibniz vs. Lewis: Is it Counterpart Theory?
  You asked if this is just "counterpart theory before the fact." The answer is **yes, structurally, but no, ontologically.**

  **Where they agree (The Structural Similarity):**
  Both Leibniz and David Lewis deny that the *same* concrete individual exists in multiple possible worlds.
  *   **Lewis:** The "Alexander" in world W2 is a distinct concrete entity from the "Alexander" in world @ (actual). They are related by similarity (counterparts), not identity.
  *   **Leibniz:** The "Alexander" in a possible world (in God's intellect) is a distinct *concept* from the actual Alexander. They are related by conceptual similarity, not numerical identity.

  **Where they disagree (The Ontological Difference):**
  This is where reading modern debates back into Leibniz gets dangerous.
  1.  **Concrete vs. Conceptual:** For Lewis, possible worlds are concrete realities (just spatio-temporally isolated). For Leibniz, "possible worlds" exist only as **ideas in the Divine Intellect**. They do not have concrete existence unless God chooses to actualize them.
      *   So, when Leibniz says God surveys "possible Adams," He is surveying *blueprints*, not concrete copies.
  2.  **Grounding the Relation:** For Lewis, the counterpart relation is based on qualitative similarity (how much do they look/act alike?). For Leibniz, the relation is based on **compossibility**.
      *   A "possible Alexander" exists in a specific world-series because his concept is *compatible* with the concepts of all other substances in that series. You can't just swap Alexander into a random world; his complete notion must harmonize with the complete notions of Darius, Bucephalus, etc.
  3.  **Identity:** Lewis says, "I am not my counterpart." Leibniz would say, "The possible me is a distinct idea in God's mind; the actual me is that idea plus existence."

  So, Leibniz anticipates the *logic* of counterpart theory (no transworld identity), but he grounds it in **conceptual containment** rather than **similarity relations between concrete entities.**

  ### 3. Puzzle One: Counterfactuals ("If I had left earlier...")
  If no alternative life is *my* life, are counterfactual statements false?

  Leibniz is aware of this problem. He solves it using the distinction between **Absolute Necessity** and **Hypothetical Necessity** (Section 13).

  *   **Absolute Necessity:** A proposition whose opposite implies a contradiction (e.g., 2+2=4).
  *   **Hypothetical Necessity:** A proposition that is necessary *given* the choice of this specific world, but whose opposite does not imply a contradiction in itself.

  When you say, "If I had left five minutes earlier, I would have caught the train," Leibniz interprets this in two ways:

  1.  **Strict Metaphysical Reading:** This statement is technically about a *different* complete concept (a counterpart). It is not strictly about *you*.
  2.  **Loose/Phenomenal Reading:** Leibniz allows for "loose" talk. Because the counterpart concept resembles you so closely up to the moment of departure, we use the name "I" to refer to it.

  In his correspondence with Arnauld (which clarifies the *Discourse*), Leibniz explicitly addresses this. He says that when we consider counterfactuals, we are considering **the same essence under a different hypothesis.** We are essentially saying: "Consider a concept very similar to mine, differing only in this predicate."
  Leibniz doesn't think this makes counterfactuals useless; he thinks it clarifies that their truth depends on the *connection of things* in a possible world, not on a mutable actual subject.

  ### 4. Puzzle Two: Fission Cases
  You asked about fission (one person dividing into two). This is where Leibniz's later metaphysics (Monadology) tightens the screws, but even in the *Discourse*, the resources are there to block it.

  For Leibniz, a "substance" is a **true unity**.
  *   In the *Discourse*, he argues that bodies (aggregates) can divide, but true substances (souls/forms) cannot.
  *   If a "person" divides, Leibniz would argue that what divided was merely the organic body (an aggregate of substances), not the substantial "I."
  *   Since the Complete Individual Concept corresponds to a **simple substance** (a soul/monad), and simples have no parts, **fission is metaphysically impossible for the subject itself.**

  If you encounter a sci-fi case where "Person A" splits into "Person B" and "Person C":
  *   **Counterpart Theorist:** Can assign counterparts to B and C in other worlds.
  *   **Leibniz:** Would say the scenario describes a confusion of aggregates. There is no single complete notion that splits. Either the original substance ceased to be (death), or one branch is the original and the other is a new substance, or (most likely) the "person" was never a true substance to begin with, just a phenomenon.

  Leibniz is stuck only if you assume persons can be material composites that split. He denies the antecedent.

  ### 5. Where You Might Be Reading Modern Debates Back
  You asked if there is a "real disagreement underneath" the counterpart similarity. Yes, there is.

  **1. The Role of God:**
  Lewis's system is atheistic/naturalistic. The worlds just *are*. Leibniz's system is theological. The "possible Alexanders" exist because God thinks them. This matters because it makes modality **epistemic relative to God**.
  *   For Lewis, possibility is a brute ontological fact.
  *   For Leibniz, possibility is a matter of **non-contradiction in the Divine Intellect**.
  *   This means the "Complete Notion" isn't just a list of properties; it is a rule of succession generated by God's understanding of that substance's "law of the series."

  **2. Compossibility vs. Isolation:**
  Lewisian worlds are isolated; nothing crosses between them. Leibnizian "worlds" are defined by **compossibility**.
  *   You cannot just take "Alexander" and put him in a world where gravity works differently, unless his complete notion is compatible with that physics.
  *   For Leibniz, the "world" is a maximal set of compossible substances. The notion of Alexander *includes* his relations to the rest of his world.
  *   This makes "swapping" individuals even harder for Leibniz than for Lewis. For Lewis, I can have a counterpart in a world with different laws. For Leibniz, if the laws are different, the *notion* of the substance might be incoherent with that world, meaning that "Alexander" couldn't even be conceived as part of that world-series.

  ### Summary of the "Bits Doing the Work"
  If you are looking at the Montgomery translation, focus on these specific moves in Sections 13–16:

  1.  **The In-esse Principle:** The predicate is contained in the subject. (This kills TWI).
  2.  **The Distinction of Necessity:** Absolute vs. Hypothetical. (This saves counterfactuals and human freedom).
  3.  **The Universal Connection:** Every substance expresses the whole universe from its own point of view. (This creates the "Compossibility" constraint that distinguishes him from Lewis).

  **Verdict:** Leibniz denies Transworld Identity. He holds a version of Counterpart Theory grounded in Divine Concepts rather than concrete similarity. Counterfactuals are accommodated via hypothetical necessity and loose speech. Fission is ruled out by the simplicity of substance.

  You are not misreading the text; you are correctly identifying that Leibniz's "Complete Notion" is a modal prison cell. He just insists the prison is made of logic and divine wisdom, not iron, and that we are free because we *want* to be in this specific cell rather than another.
