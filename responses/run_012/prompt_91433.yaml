prompt: |-
  I'm in the middle of a philosophy of mind course and I've hit a snag I can't get past, so I'd like you to work through it with me carefully. The topic is the timing of conscious experience, and the case that's been assigned is the color phi phenomenon: two dots are flashed in quick succession at different locations on a screen, and if the second dot is a different color from the first, subjects report a single dot that appears to move from the first location to the second and to change color somewhere in the middle of its path. The color change is experienced as occurring mid-trajectory -- before the second dot has even been presented. The lecture used this to set up two rival readings of what the brain is doing. On the first reading, the brain simply constructs the experience at the time it seems to occur, so the "mid-path" color change is what you really experience, and the experience is assembled as early as it needs to be. On the second, the experience unfolds in ordinary real time -- first one dot, then a gap, then the second dot -- and what gets revised is the memory or the record of it, so that what you later report or remember is a smoothed-over story rather than what you actually lived through. The two readings are meant to be genuinely distinct hypotheses about the phenomenon, not just two metaphors.

  Here is what I need you to do. First, state as precisely as you can what each reading predicts about the color phi case: what is being revised, when, and by what stage of processing; what the subject's experience is supposed to be at each moment under each reading; and how each reading accounts for the fact that the change is experienced as mid-path rather than at either endpoint. Second, say whether the two readings make genuinely different empirical predictions about this case -- whether there is any observation, behavioral or otherwise, that could distinguish them, and if the subject herself could ever be in a position to tell which one is true from the inside. Third, and most important to me: if it turns out that no possible evidence could distinguish the readings, does that show the distinction was a real disagreement that is merely underdetermined by the data, or does it show that the two readings were never two hypotheses at all but two descriptions of the same underlying facts, so that the question of "when" the experience happened was never a factual question in the first place? I want you to run the analysis in both directions -- what each reading does for the phenomenon, and what the phenomenon does to the distinction -- and then tell me what you think it shows about whether the timing of experience is a substantive empirical matter or a pseudo-question generated by a bad picture of how experience relates to time. I'm not asking for a survey of the consciousness literature; I want the conceptual work done.
