      *Wait, one more thing:* The user asks about commitments that are "revisable in principle, but that experience never actually dislodges." This sounds like **Constitutive Rules** or **Framework Principles** (Wittgenstein/Strawson), but in a Quinean context, it's about **Centrality** in the web. Quine calls this **Entrenchment**. That's a specific Quinean term! I must include "Entrenchment."

