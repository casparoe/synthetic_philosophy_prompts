      *   **User Background:** Retired geophysicist (35 years), new to philosophy (post-retirement). This means they are intelligent, used to empirical rigor, familiar with concepts like "data," "auxiliary assumptions," "revision," and "models," but might not know specific philosophical jargon. They appreciate precision and analogies to science.
      *   **Core Observation:** The user notices a discrepancy in Quine's web of belief regarding moral values. In science, recalcitrant experience forces belief revision. In ethics, recalcitrant experience (e.g., feeling fine about a "wrong" act) often leads to ad-hoc redefinition rather than abandoning the value.
      *   **The Question:** Is there a name for this specific status of moral commitments? (Part of the web, revisable *in principle*, but resistant to empirical dislodgement in practice). Also, is there a name for the view that ethics is like engineering (ends given, reason about means)?
      *   **Constraints:** They know the fact/value distinction and non-cognitivism but find them insufficient. They want the *nearest concepts* and *how they differ*, not just a label.

  2.  **Deconstruct the Philosophical Problem:**
      *   **Quine's Web of Belief:** Central (logic/math) $\rightarrow$ Peripheral (observation). Everything is revisable, but some things are harder to move than others.
      *   **The User's Puzzle:** Moral values seem to sit in a weird spot. They aren't purely observational (peripheral), nor purely logical (central). They seem to behave like *central* beliefs (protected from revision) but claim to be *revisable*. When conflict arises, we adjust the description of the act ("that wasn't a lie") rather than the principle ("lying is wrong").
      *   **The Engineering Analogy:** Ethics as instrumental reasoning (means to ends) rather than discovering moral facts.

  3.  **Brainstorming Concepts/Terms:**

      *   *Reflective Equilibrium:* (Rawls). Coherence between principles and intuitions. Fits the "tweaking" aspect.
      *   *Thick Ethical Concepts:* (Williams). Concepts that are both descriptive and evaluative (e.g., "cruel," "courageous"). This explains the "that wasn't really a lie" move.
      *   *Pragmatism:* (James/Dewey/Quine). Truth is what works. Ethics as problem-solving.
      *   *Error Theory:* (Mackie). No moral facts. (User says Quine thinks values are real psychological states, so maybe not this).
      *   *Constructivism:* (Kantian/Rawlsian). We construct moral truths.
      *   *Quine's Naturalized Epistemology/Ethics:* Quine actually wrote about this ("On the Nature of Moral Values"). He sees ethics as a social artifact, akin to science but aimed at social harmony.
      *   *Instrumentalism:* Ethics as a tool.
      *   *Protection Belt:* (Lakatos). Scientific research programmes have a hard core protected by a belt of auxiliary hypotheses. This matches the user's "tweak auxiliary assumptions" observation perfectly.
