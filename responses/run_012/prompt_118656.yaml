      *   *Self-Correction on Quine:* Did Quine say ethics is *exactly* like engineering? He said it's like science but with a different goal (predicting sensory stimuli vs. social harmony). He was a moral realist of a sort (naturalistic), but deflationary. I need to be careful not to attribute full-blown emotivism to him. He thought moral statements were truth-apt but grounded in social sentiment.

