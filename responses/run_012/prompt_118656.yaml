  9.  *(Self-Correction during drafting)*: Wait, the user asked specifically about Quine. I should focus heavily on Quine's "On the Nature of Moral Values." Quine argues moral statements *are* truth-apt but their truth is determined by their role in the web relative to social goals. The "engineering" analogy is very Quinean. I should mention *means-ends rationality*.

