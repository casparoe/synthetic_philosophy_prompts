answer: |-
  Here is the spec. It is built to avoid the circularity you identified (defining consent by the moral quality of the act) while meeting your constraints on usability and domain coverage.

  ### Part 1: The Spec (5 Core Requirements)

  A theory of consent is adequate only if it satisfies these five functional requirements.

  | Requirement | The Rule | The Case/Consideration Behind It |
  | :--- | :--- | :--- |
  | **1. The Capacity Threshold** | The person must possess the specific cognitive ability to understand *this* decision at *this* time. It is not a global status (competent/incompetent); it is decision-specific. | **Dementia/Drunk:** A dementia patient may understand a simple meal choice but not a drug trial. A drunk person may understand sex but not a mortgage. The theory must handle fluctuating capacity without declaring the person globally "in." |
  | **2. The Materiality Standard** | Consent is invalid if the agreement is based on false information about a **deal-breaker**. It does not require total disclosure, only disclosure of facts that would change the decision of a reasonable person in that context. | **Vasectomy/Reversibility:** Lying about sterility invalidates sex consent. Lying about being rich usually doesn't. **Clickwrap:** If the terms contain hidden liabilities no one expects, the "click" is void. |
  | **3. The Control Baseline** | The choice must be made without **external control** by the proposer. Hard choices (bad options) are allowed; manufactured threats (worsened options by the proposer) are not. | **Desperate Job vs. Robber:** "Take this dangerous job or starve" is a hard choice (systemic), not coercion (proposer-made). "Your money or your arm" is coercion. **Guilt:** Emotional pressure is valid unless it amounts to manipulation that bypasses rational agency. |
  | **4. The Scope & Duration Limit** | Consent applies only to the specific act agreed to, for the specific duration agreed to. Authority over one's body/rights is leased, not sold, unless explicitly transferred (and even then, limited by law). | **Boxer/Withdrawal:** You consent to the fight, not permanent brain damage (scope). You consent to sex, not *all* sex forever (duration/revocability). **Wrong Surgeon:** You consented to Dr. A, not Dr. B. |
  | **5. The External Signal** | Consent must be communicable. Internal feelings are irrelevant to the partner's liability. A "yes" said while crying counts as consent *mechanically*, even if it signals distress *morally*. | **Crying Yes/Clickwrap:** We need a signal a nurse or partner can rely on in real time. If consent were purely internal, no one could ever act without mind-reading. |

  ---

  ### Part 2: The Verdicts (Applying the Spec)

  To prove the spec works, here are the verdicts it must yield on your cases. If a theory flips these, it fails the "Common Intuition" constraint.

  | Case | Verdict | Which Requirement Decides It |
  | :--- | :--- | :--- |
  | **1. Dementia (Yes/No/Yes)** | **Invalid.** Fluctuating capacity creates reasonable doubt. The "No" on Tuesday voids the "Yes" on Monday/Wednesday unless stability is proven. | **Capacity Threshold** |
  | **2. Vasectomy Lie** | **Invalid.** Sterility is material to the risk of pregnancy. It is a lie about the nature of the act (protected vs. unprotected). | **Materiality Standard** |
  | **3. Boxer (Brain Damage)** | **Valid Consent, Wrong Act.** Consent to the fight is valid. Society may still ban the sport because the harm is too great to authorize. | **Scope & Duration** (plus Distinction #2) |
  | **4. Desperate Job** | **Valid.** The employer didn't create the poverty. The option is lousy, but not coerced by the proposer. | **Control Baseline** |
  | **5. Wrong Surgeon** | **Invalid.** Consent is person-specific. You authorized a specific agent to touch you. | **Scope & Duration** |
  | **6. Crying Yes** | **Valid (Mechanically).** The signal was "yes." The crying is a warning sign, but without a "stop," the act is not a violation *of consent*. | **External Signal** |
  | **7. Withdrawal Mid-Stream** | **Invalid (after withdrawal).** Consent is ongoing. Once revoked, continued action is a violation. | **Scope & Duration** |
  | **8. Clickwrap (40 pages)** | **Valid (Usually).** Unless hidden terms are unconscionable. The "click" is the signal. Burden is on the reader. | **External Signal** + **Materiality** |
  | **9. Reversibility Lie** | **Invalid.** Like the vasectomy. The nature of the permanent change was misrepresented. | **Materiality Standard** |
  | **10. Advance Directive vs. Current** | **Invalid (Current wins).** A competent present refusal overrides a competent past consent. Bodily integrity is ongoing. | **Capacity Threshold** + **Scope** |
  | **11. Guilt ("I'll be devastated")** | **Valid.** Emotional consequences are not threats of force. Unless it's pathological manipulation, it's a hard choice. | **Control Baseline** |
  | **12. Sex for Money/Stay** | **Valid.** Transactional sex is still sex. The motivation (money) doesn't negate the agreement to the act. | **Control Baseline** |
  | **13. Drunk Yes** | **Contextual.** If intoxication prevents understanding risks (Capacity), it's invalid. If just "loosened inhibitions," it's valid. | **Capacity Threshold** |

  ---

  ### Part 3: The Fracture Points (Conflicts & The "Killer")

  You asked which requirements can't hold at once, which are prejudices, and which single requirement kills the usual theories.

  #### 1. The Incompatible Triad
  You cannot maximize **Real-Time Usability**, **Competence as a Dimmer**, and **Perfect Voluntariness** simultaneously.
  *   **The Conflict:** A nurse at 3 AM needs a switch (Req 5: External Signal). But competence is a dimmer (Req 1: Capacity). And voluntariness depends on hidden baselines (Req 3: Control).
  *   **The Trade-off:** To make it usable, you must accept **false positives**. Sometimes a "yes" will be accepted that, upon deep philosophical reflection, wasn't truly voluntary or fully competent.
  *   **The Fix:** The theory must prioritize **Reliance**. If the signal was clear and capacity wasn't obviously impaired, the partner/nurse is cleared, even if the consenting person later regrets it. Usability wins over perfect metaphysical accuracy.

  #### 2. The Prejudice Disguised as a Requirement
  *   **Suspicion:** *"A threat vs. a lousy option... is it about who made it bad?"*
  *   **The Prejudice:** The demand that we define coercion **without a moral baseline** is itself a liberal-individualist prejudice.
  *   **Why:** To say the desperate job is "voluntary" but the robbery is "coerced" relies on a baseline of "property rights." The robber violates rights; the employer uses market leverage. If you believe the economic system itself is coercive, the "Desperate Job" verdict flips.
  *   **Verdict:** You cannot define "Voluntary" (Req 3) without first defining "Just Background Conditions." If you try to keep the theory neutral on justice, you will fail the "Desperate Job" case. You have to admit: **Consent theory rests on a theory of justice.**

  #### 3. The Revocability Clash
  *   **Suspicion:** *"Consent to sex has to be withdrawable... consent to a contract usually isn't."*
  *   **The Conflict:** This violates the idea that consent is a single unified concept.
  *   **The Explanation:** It's not arbitrary. It's about **Bodily Integrity vs. Asset Transfer**.
      *   **Sex/Medicine:** Authority over the body is non-transferable. You can lend access, but you can't sell the key. Therefore, revocability is default.
      *   **Contracts:** Authority over assets is transferable. Once you sell the house, you can't say "I want it back."
  *   **Requirement Adjustment:** The theory must distinguish between **Ongoing Access** (revocable) and **Title Transfer** (irrevocable). If it treats them the same, it fails.

  #### 4. The "Killer" Requirement
  You asked which single requirement does the most work at killing off the usual theories.

  **The Winner:** **Distinction #2: "A valid yes vs. the act still being wrong anyway."**
  *(Mapped to Requirement 4: Scope & Duration)*

  *   **Why it kills the Rights-Waiver Picture:** If consent is just waiving a right, then a valid waiver makes the act permissible. But you can consent to a beating (waive the right), and it is *still* a battery (wrong). Therefore, consent is not a moral waiver; it is an **authority transfer** that is limited by public policy.
  *   **Why it kills the Mental-State Picture:** If consent is about desire, the boxer (who fears the fight but agrees) wouldn't count. But he does.
  *   **Why it kills the Moralized Picture ("Consent is when the act is okay"):** This is the circularity you hate. This requirement forces you to admit: **Consent is a mechanical condition, not a moral conclusion.** It is a necessary condition for permissibility, but not a sufficient one.

  ### Summary of the "Head Straight" Advice

  1.  **Stop looking for a definition of "Voluntary" that is morally neutral.** It doesn't exist. You have to accept that calling a job "voluntary" implies you think the economic baseline is legitimate.
  2.  **Separate the Mechanics from the Morals.** Consent is the key that unlocks the door. It does not guarantee that what you do inside the room is good. (This solves the Boxer/Beating problem).
  3.  **Accept False Positives for Usability.** If you demand perfect internal alignment for every "yes," sex and medicine become impossible. You must rely on external signals, knowing they will occasionally fail.
  4.  **The Core Tension:** The hardest problem you face is not sex or medicine; it is **Economics**. The "Desperate Job" case breaks more theories than the "Drunk Sex" case. If your theory says the job is coerced, you are a revolutionary. If it says it's voluntary, you are a libertarian. There is no middle ground that doesn't smuggle in a political stance.

  **Final Verdict:** Build your theory on **Authority Transfer** (I give you permission to act), not **Moral Waiver** (I make this act good). That distinction alone clears 80% of the circularity.
