answer: |-
  # Session Plan: The Sunk Cost Gambit

  **Course:** Philosophy of Rational Choice (Year 3/MSc)
  **Time:** 75 Minutes
  **Participants:** ~20 students (4 Teams of 5)
  **Goal:** To destabilize the dogma that "sunk costs are always irrelevant" by distinguishing between costs as *reasons*, *evidence*, and *signals*.

  ---

  ## I. Materials and Setup

  **Room:** Seminar style. Four tables clustered separately.
  **Handouts (per team):**
  1.  **Project Ledger:** A simple grid with columns: *Round, Cost Paid, Cumulative Spend, Decision (Continue/Quit), Outcome, Total Score.*
  2.  **Decision Cards:** Two cards per round labeled **INVEST** and **ABORT**. Teams place one face down to commit.
  3.  **Currency:** 50 plastic chips per team (value = 1 point each).
  4.  **Envelope Set:** Four sealed envelopes labeled **Site A, Site B, Site C, Site D**. (Contains the hidden logic for Phase 2).

  **Instructor Prep:**
  *   **Phase 1 Logic (The Trap):** Independent probability. Success chance = 40% per round, fixed.
  *   **Phase 2 Logic (The Twist):**
      *   Two teams receive **Arm 2 (Evidence)** envelopes: Projects have "Types." Type Deep (60% success) vs. Type Shallow (10% success). If a project survives Round 1 without failing, probability of Type Deep increases.
      *   Two teams receive **Arm 3 (Signal)** envelopes: A "Banker" rule. If a team Aborts before Round 3, they incur a hidden penalty of -30 points (loss of future credibility).
  *   **Scoreboard:** Whiteboard to track team totals publicly.

  ---

  ## II. Timeline and Rules

  ### 00:00 – 00:05 | Introduction and Team Formation
  *   Divide class into 4 teams.
  *   Distribute 50 chips and Ledgers.
  *   **Instruction:** "You are R&D directors. Your goal is to maximize your team's final chip count. You will face a series of investment rounds. In each round, you must choose **INVEST** (pay 10 chips) or **ABORT** (pay 0, game ends for this project). If you Invest, you roll a d10. If you roll 4 or higher, the project succeeds, you gain 100 chips, and the project ends. If you roll 1-3, the project stalls. You may Invest again or Abort."
  *   **Crucial Constraint:** "Do not discuss strategy with other teams. Keep your Ledger hidden."

  ### 00:05 – 00:20 | Phase 1: The Trap (Arm 1)
  *   **Logic:** Pure Sunk Cost. Every roll is independent (40% success). Past failures do not change future odds.
  *   **Procedure:**
      *   Teams play "Project Alpha."
      *   Allow up to 3 rounds of investment.
      *   If a team Aborts after spending 20 chips, they have 30 chips left. If they persist and fail again, they have 20.
      *   *Instructor Role:* Act as the croupier. Roll dice publicly or verify team rolls. Maintain a neutral, bureaucratic demeanor. Do not hint at probabilities.
  *   **Expected Outcome:** Teams that persist beyond Round 1 will, on average, lose chips. Teams that Abort early preserve capital.
  *   **End of Phase:** Collect Project Alpha Ledgers.

  ### 00:20 – 00:30 | The Verdict
  *   **Task:** Teams have 5 minutes to draft a "Rationality Policy."
  *   **Prompt:** "Based on Project Alpha, write one sentence governing future decisions regarding past expenditure. Is it ever rational to let money already spent influence your decision to continue?"
  *   **Commitment:** Teams read their policy aloud. Most will say: *"No. Past spend is irrelevant. Only future odds matter."*
  *   **Instructor Action:** Write the consensus on the board: **THE VERDICT: SUNK COSTS ARE NOISE.**

  ### 00:30 – 00:55 | Phase 2: The Black Box (Arms 2 & 3)
  *   **Instruction:** "We are launching Project Beta. The interface is identical. Cost is 10 per round. Payout is 100. The rules are the same as Project Alpha."
  *   **The Deception:** The rules are *not* the same.
      *   Hand out the Sealed Envelopes. Two teams get **Arm 2 (Evidence)** logic. Two teams get **Arm 3 (Signal)** logic.
      *   **Arm 2 Teams:** The d10 is pre-assigned in the envelope. *Site A* is "Deep" (Roll 4+ succeeds). *Site B* is "Shallow" (Roll 8+ succeeds). If they survive Round 1, they are statistically more likely to be at a Deep site. Persistence is Bayesian updating.
      *   **Arm 3 Teams:** If they choose **ABORT** before Round 3, the Instructor silently deducts 30 chips from their final score (The "Banker Penalty"). Persistence buys credibility.
  *   **Procedure:** Run 3 rounds. Teams will apply **THE VERDICT**. They will likely Abort early to "cut losses," because they believe they are still in Arm 1.
  *   **Outcome:**
      *   Arm 2 teams who Abort early miss high-probability wins.
      *   Arm 3 teams who Abort early get hit with the hidden penalty.
      *   Teams that irrationally persist (ignoring their own verdict) will likely win Phase 2.
  *   **Scoring:** Reveal final scores. The teams that "violated" the verdict likely have the highest scores.

  ### 00:55 – 01:15 | The Debrief
  *   **Goal:** Map the confusion to philosophical distinctions.
  *   **Method:** Socratic interrogation of the results.

  ---

  ## III. The Debrief Script (Key Moves)

  **1. The Shock (5 mins)**
  *   Ask the winning team: "You persisted. Why?" (They will say: "We got lucky" or "We felt it was due.")
  *   Ask the losing team: "You followed the Verdict. Why did you lose?"
  *   **Point:** The Verdict ("Ignore Sunk Costs") was *action-guiding* in Phase 1 but *self-defeating* in Phase 2.

  **2. Reason vs. Evidence (10 mins)**
  *   **Claim:** The standard argument says sunk costs are not *reasons* for action.
  *   **Mapping:** In Phase 1, the 20 chips spent were noise. They changed nothing about the die. Treating them as a reason was irrational.
  *   **Mapping:** In Phase 2 (Arm 2), the 20 chips spent were *evidence*. They signaled that the project was a 'Deep' type. The chips themselves didn't cause success, but the fact that you *could* spend them without failure updated the probability of success.
  *   **Distinction:** You are not continuing *because* you spent the money. You are continuing because *having spent the money tells you something* about the world. The cost is a signal, not a cause.

  **3. Act vs. Policy (10 mins)**
  *   **Claim:** Rationality applies to policies, not just isolated acts.
  *   **Mapping:** In Phase 2 (Arm 3), the cost was a *signal to others*. The Banker penalized quitters.
  *   **Distinction:** If you look at the single act of Round 3 in isolation, paying 10 chips for a 40% chance is bad math. But the *policy* of "Never Quit Before Round 3" secures future funding.
  *   **Argument:** This is where precommitment lives. It is rational to bind yourself to a rule that ignores marginal calculus in specific instances, to secure a better aggregate outcome. The "Sunk Cost Fallacy" might actually be a heuristic for a commitment device.

  **4. Screening Off and Contingency (5 mins)**
  *   **Claim:** The evidential value of sunk costs is fragile.
  *   **Question:** "In Arm 2, if I told you explicitly 'This is a Deep Site' at the start, would your past spending matter?"
  *   **Answer:** No. The new information *screens off* the old expenditure.
  *   **Point:** The rationality of considering sunk costs is contingent on your ignorance. If you have perfect information, sunk costs revert to noise. The "Fallacy" is treating them as reasons when you have perfect information, or treating them as evidence when they are actually noise.

  **5. The Residual Figure (5 mins)**
  *   **Closing:** "Consider the agent who says: 'I must continue *because* I have already suffered.' Not because it signals quality, not because it buys reputation, but because the suffering itself creates an obligation."
  *   **Intelligibility:** We understand this agent. We call it 'commitment,' 'honour,' or 'stubbornness.' It makes sense psychologically.
  *   **Correctness:** Can we make them normatively correct? Only if we redefine 'value' to include the integrity of the past self's investment as a good in itself. But in rational choice theory, value is forward-looking.
  *   **Final Thought:** "The game shows that ignoring sunk costs can lose you points. But it does not prove that valuing the past for its own sake is rational. It only proves that the world is often opaque, and what looks like a fallacy is sometimes a clever response to hidden variables. Your job is to tell the difference."

  ---

  ## IV. Predictable Failures and Fixes

  **1. Arithmetic Overload**
  *   **Failure:** Students spend 10 minutes calculating Expected Value (EV) per round, stalling the game.
  *   **Fix:** Enforce a 60-second timer per round decision. Provide a printed "Cheat Sheet" with the EV already calculated for Phase 1 (e.g., "Cost 10, Return 100, Chance 40% = EV 40"). This forces them to see the negative EV immediately and focus on the *decision rule* rather than the math.

  **2. Team Dominance**
  *   **Failure:** One loud MSc student dictates the strategy, undergrads disengage.
  *   **Fix:** Assign rotating roles: *CFO* (handles chips), *Scribe* (writes ledger), *CEO* (announces decision). Rotate roles every round. Require all signatures on the Decision Card.

  **3. Detection of the Twist**
  *   **Failure:** A team notices the dice probabilities feel different in Phase 2 and deduces the trick, ruining the uncertainty.
  *   **Fix:** Use small sample sizes (only 3 rounds). Statistical variance is high enough that they can't be sure if the odds changed or if they just got lucky/unlucky. If challenged, maintain: "The rules are identical. Variance is part of the simulation."

  **4. Cynicism / "It's Just a Game"**
  *   **Failure:** Students treat Phase 2 losses as irrelevant because no real money is at stake.
  *   **Fix:** Tie the score to a tangible, low-stakes reward (e.g., priority choice of essay topics, or actual chocolate). More importantly, frame the loss in the debrief as an *intellectual* loss: "You applied a true theorem to a false premise."

  **5. Confusion Between Arm 2 and Arm 3**
  *   **Failure:** In the debrief, students conflate "Evidence" (Arm 2) with "Incentive" (Arm 3).
  *   **Fix:** Use the whiteboard to draw two distinct columns.
      *   *Column A (Arm 2):* The world changed (Project Type). The cost revealed the world.
      *   *Column B (Arm 3):* The rules changed (Banker Penalty). The cost changed the payoff structure.
      *   Force them to categorize their Phase 2 experience into one column.

  ---

  ## V. Limitations of the Activity

  **1. The "As-If" Problem**
  *   **Limitation:** The game demonstrates that acting *as if* sunk costs matter can be profitable. It does not demonstrate that sunk costs *are* reasons.
  *   **Instructor Burden:** You must explicitly state in the debrief: "Winning the game is not the same as being rational. A lucky gambler is not a good statistician." You must supply the normative distinction between *ex-post success* and *ex-ante rationality*. The game cannot do this alone.

  **2. Emotional Absence**
  *   **Limitation:** Real sunk cost fallacy is driven by loss aversion, regret, and ego. Chips do not induce regret.
  *   **Instructor Burden:** You must verbally reconstruct the emotional landscape. "Imagine these chips were your own tuition. Imagine the Banker was your thesis supervisor." You have to supply the psychological weight the game lacks.

  **3. Transparency of Design**
  *   **Limitation:** Third-year students are trained to suspect experimental manipulation. They may assume Phase 2 *must* have a trick, leading them to over-complicate their reasoning.
  *   **Instructor Burden:** You must maintain the fiction of the "Black Box" firmly. If they ask "Did the rules change?", answer: "The rules of investment were constant. The nature of the projects was unknown." This is technically true but misleading, which is necessary for the lesson.

  **4. The "Correct" Verdict**
  *   **Limitation:** The session aims to leave them unsure. However, standard rational choice theory *does* hold that sunk costs are irrelevant to the *current* decision node (absent the evidence/signal caveats).
  *   **Instructor Burden:** Do not let the uncertainty dissolve into relativism. Ensure they understand that the *standard verdict* holds for the *act*, but the *policy* verdict is more complex. The uncertainty should be about *classification* (Is this a signal or noise?), not about *logic* (Does 2+2=4?).

  ---

  ## VI. Instructor Notes on Delivery

  *   **Tone:** Bureaucratic and cold during the game. Warm and probing during the debrief.
  *   **Pacing:** Watch the clock ruthlessly. If Phase 1 runs long, cut Phase 2 to 2 rounds. The debrief is the most important component; do not sacrifice it for game completion.
  *   **The "Gotcha":** When revealing the Phase 2 logic, do not gloat. Present it as a data point. "In Arm 2, the cost was information. In Arm 3, the cost was currency. In Arm 1, it was waste. Your job is to know which world you are in."
  *   **Final Silence:** End the session on the "Residual Figure" question. Do not answer it. Let them sit with the tension between intelligibility and correctness.
