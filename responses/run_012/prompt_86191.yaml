  Your friend will almost certainly say that the pharmacist's proposition **stands fast**.

  Here is the analysis of the rule she is running, the tension within it, and the case that will force her to choose.

  ### 1. The Prediction
  She will classify the pharmacist's certainty ("This drug is what the label says") as a **hinge proposition**.

  It aligns perfectly with her existing "Stands Fast" verdicts:
  *   **Like "The Earth existed":** It is a background condition she did not personally verify.
  *   **Like "I have two hands":** It is not known evidentially; she does not weigh the chemical compounds before dispensing.
  *   **Like "The Moon landing (for grandparents)":** It is tied to a specific form of life (the pharmacy) and governs action without question.

  Crucially, it avoids her specific reason for excluding "Water boils": she noted water boiling *does not* stand fast because "she learned it, she could check it." The pharmacist *cannot* check the drug personally (she lacks the method), nor did she learn it via empirical testing (she learned it via institutional trust). Therefore, it passes her current filter.

  ### 2. The Rule She Is Running
  Your friend is not running a single rule, but a hybrid of two, which currently overlap in her examples:

  *   **Rule A (Functional/Pragmatic):** A proposition stands fast if it serves as the **unquestioned scaffolding** of a practice. (Derived from *Earth*, *Hands*, *Moon*, *Pharmacist*).
  *   **Rule B (Epistemic/Individual):** A proposition stands fast only if the agent **lacks the means or method to verify it personally**. (Derived from the exclusion of *Water Boils*).

  **The Conflict:**
  Fitting all her verdicts requires her to maintain both rules, but they are not logically identical.
  *   **Rule A** is about the *role* the proposition plays in a system.
  *   **Rule B** is about the *epistemic access* of the individual.

  In the **Pharmacist** case, both rules agree (It functions as scaffolding + She can't test it).
  In the **Water Boils** case, both rules agree (It functions as a law + She can test it → Not a hinge).
  In the **Moon** case, Rule A dominates (It functioned as scaffolding for grandparents, even if they theoretically *could* have checked the news, Rule A allows it to be a hinge for them).

  The tension lies in whether **Personal Verifiability (Rule B)** is a hard disqualifier, or whether **Functional Role (Rule A)** is the ultimate decider.

  ### 3. The Killer Case
  To force her to choose between Rule A (Function) and Rule B (Verifiability), you must present a case where a proposition functions as absolute background scaffolding, but the agent *could* verify it personally if they chose to, yet treats it as exempt from doubt.

  **The Case:** **The Mother and the Child.**
  > "A mother sees her child playing in the yard. She proceeds with her day, cooking and working, operating on the certainty that *'This is my child.'* She does not doubt it; it governs all her care. Yet, she knows that DNA testing exists, she knows how to access it, and she *could* verify the biological relation if she wished. She simply never raises the question."

  **Why this forces a choice:**
  *   **If she says "Stands Fast":** She prioritizes **Rule A (Function)**. The proposition is the bedrock of the practice of parenting. However, this forces her to reconsider **Water Boils**. If the mother's certainty makes it a hinge despite testability, why doesn't the cook's certainty about boiling water make *that* a hinge? She would have to admit that "Water Boils" *can* stand fast if treated as background, contradicting her earlier verdict.
  *   **If she says "Does Not Stand Fast":** She prioritizes **Rule B (Verifiability)**. Because the mother *could* test it, it is an empirical claim. However, this threatens the **Pharmacist** and **Earth** verdicts. The pharmacist *could* send the drug to a lab (systemic testability), and the friend *could* theoretically dig for fossils (Earth). If "could check" disqualifies the mother, does it disqualify the pharmacist who relies on a system that *could* check? It risks collapsing the distinction between "hinges" and "just very trusted empirical claims."

  This case isolates the conflict between the **psychological/practical role** of certainty and the **theoretical possibility of doubt**, which is the central tension in Wittgenstein's *On Certainty*.
