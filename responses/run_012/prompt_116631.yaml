  When feelers tap the fading light,
  And one black body starts to fold,
  While one shivers in the cold,
  To block the path from coming right,
  Until one static dot shines bright,
  And one neighbor takes a hold,
  A curve is made without a mold,
  That stands distinct against the night.

  I rise from parts that stay quite still,
  You look for magic in the skull,
  Demanding ghosts to fill the null,
  Yet flesh obeys the same strict will.
  Your thoughts are cells that climb the hill,
  Inside the wet and weighty brain,
  Where dumb parts drive the thinking train.
  I am no more than ants aligned,
  No less than you, who seek a mind.
