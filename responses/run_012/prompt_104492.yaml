answer: |-
  **MEMORANDUM**

  **TO:** Model-Release Review Committee
  **FROM:** Committee Chair
  **DATE:** October 23, 2023
  **SUBJECT:** Decision Memo: ED Triage Decision-Support Pilot (Project Triage-AI)

  ### 1. Recommendation

  I recommend that we **certify the Process-Trained Variant (Team B)** for the two-hospital pilot, subject to three binding conditions regarding deployment scope, monitoring, and liability claims.

  We will **not** certify the Outcome-Trained Variant (Team A) at this time.

  This is not an endorsement that Team B's model is medically "more correct." It is a judgment that for a pilot involving human-in-the-loop triage, **inspectability is the primary safety constraint.** We cannot debug a black box that fails on atypical cases; we can debug a model that reveals its reasoning, provided we acknowledge the limits of that reasoning.

  ### 2. Summary of Dispute

  *   **Team A (Outcome-Based):** Trained the model to match final physician dispositions. They argue that in medicine, the result is the only truth. They warn that step-level scoring penalizes unconventional but correct reasoning in favor of "fluent prose" that mimics standard care.
  *   **Team B (Process-Based):** Trained the model using a reward model that scores intermediate reasoning steps. They argue that step-level visibility allows clinicians to catch errors before they become dispositions, making the artifact safer and more correctable.

  ### 3. Analysis of the Losing Position (Team A)

  The strongest argument belongs to Team A, and it must be stated plainly: **Outcomes are what matter to patients, not reasoning.**

  If a patient deteriorates because the model was rewarded for writing a medically plausible-sounding step that was actually irrelevant, the process score failed. Team A correctly identifies that the Process Reward Model (PRM) is itself a model, trained on a small set of labels. In high-stakes edge cases—where the "right" answer is novel or contested—the PRM will likely penalize the very deviation that saves the patient. By certifying Team B, we accept the risk that we are optimizing for *consensus* rather than *correctness*. Team A's objection is not an engineering detail; it is a patient safety hazard. We mitigate this not by switching to Team A's model, but by adopting Team A's *metrics* as our ultimate rollback trigger (see Section 6).

  ### 4. Addressing Foundational Risks

  Two theoretical concerns raised during review require operational answers, not philosophical hand-waving.

  **A. The Regress Problem (Who watches the watcher?)**
  Team B's safety case relies on the Process Reward Model. But the PRM is an artifact with its own objective function. If we rely on the PRM to validate the Triage Model, what validates the PRM?
  *   **Decision:** The chain of supervision stops at **human governance, not another model.** We will not train a "meta-PRM." Instead, the PRM is downgraded from a "supervisor" to a "flagging mechanism."
  *   **Operationalization:** Low process scores do not automatically block a recommendation; they route the case to senior staff for review. High process scores do not grant autonomy. The PRM is a tool for prioritizing human attention, not a substitute for it. The "ground truth" for the PRM is subject to quarterly re-evaluation by the Clinical Governance Board, who retain the authority to re-label training data if the PRM drifts from clinical reality.

  **B. The Conformity Problem (Consensus vs. Correctness)**
  Both teams are training on human labels. In emergency medicine, expert disagreement is common. Therefore, both models measure **conformity to the training panel**, not objective medical truth.
  *   **Decision:** We must adjust our certification claim. We cannot certify this model as "clinically accurate" in an absolute sense.
  *   **Operationalization:** The pilot documentation will explicitly state that the model is certified for **"Alignment with Documented Standard of Care,"** not "Diagnostic Correctness." We are deploying a consensus engine, not an oracle. This limits liability and manages hospital expectations: the model is designed to reduce variance in standard cases, not to solve unsolved medical mysteries. If the model encounters a case where the panel itself disagreed, the model is instructed to defer, not decide.

  ### 5. Conditions of Certification

  To proceed with Team B's variant, the following conditions are mandatory:

  1.  **Human-in-the-Loop Mandate:** The model output is a *draft* only. No triage recommendation is finalized without a licensed clinician's signature. The UI must display the reasoning steps prominently, not just the final disposition.
  2.  **Conformity Disclaimer:** All partner hospital agreements must reflect that the model is optimized for consistency with retrospective panel data, not guaranteed patient outcomes.
  3.  **Conflict Arbitration:** In cases where the Process Score is high (reasoning looks good) but the Outcome Prediction diverges from historical norms, the system must flag the case for "Silent Review" by a senior attending. We do not trust the Process Score over the Outcome signal in high-severity contexts.

  ### 6. Monitoring and Rollback Triggers

  We will treat the pilot as a learning phase to test Team A's hypothesis against Team B's architecture. We will monitor the following specific metrics weekly:

  **Metrics to Monitor:**
  1.  **Disposition Mismatch Rate:** Percentage of cases where the model's final recommendation differs from the treating physician's final disposition.
  2.  **Process-Outcome Divergence:** Cases where the Process Score is in the top quartile (high confidence in reasoning) but the outcome was adverse (e.g., patient return within 24 hours, escalation of care).
  3.  **Unconventional Success Rate:** Cases where the Process Score was low (penalized reasoning) but the physician accepted the recommendation and the outcome was positive. (This directly tests Team A's fear).

  **Rollback Triggers:**
  Immediate suspension of the pilot if:
  1.  **Adverse Event Correlation:** We observe a statistically significant cluster (n > 5) of adverse patient outcomes where the model's Process Score was high. This indicates the "fluent prose" risk Team A identified is materializing.
  2.  **Unconventional Suppression:** Data shows that in cases where human experts later confirmed an "atypical" presentation was correct, the model recommended the "standard" disposition with high Process Confidence > 80% of the time. This proves the model is actively penalizing correct novelty.
  3.  **Outcome Drift:** The Disposition Mismatch Rate exceeds 15% in high-acuity categories (ESI 1-2).

  ### 7. Conclusion

  We are certifying Team B's model because we cannot audit what we cannot see. However, we acknowledge Team A's core contention: **Reasoning is only valuable if it leads to the right result.**

  By monitoring for "Unconventional Success" and setting rollback triggers on adverse outcomes, we incorporate Team A's outcome-based rigor into Team B's process-based architecture. We are not solving the problem of expert disagreement; we are building a system that exposes that disagreement rather than hiding it behind a confident prediction.

  **Vote Required:** Approval to proceed with Pilot Deployment under the conditions listed in Section 5.
