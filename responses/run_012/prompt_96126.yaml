prompt: |-
  I serve on the allocation committee of a mid-sized foundation that funds long-horizon, high-variance work, and at Thursday's meeting we vote on a proposal from one of our program officers that I have agreed to write the opinion on. She wants us to adopt what she calls evidential cooperation — cooperation that runs through evidence rather than through any causal channel. Concretely, she proposes a standing rule setting aside a fixed share of each year's budget (she says five percent) for expenditures whose payoff depends on other agents taking similar actions, where those agents are ones we cannot contact, bargain with, monitor, or even identify, and where nothing we do can affect what they do. Her argument, as best I can reconstruct it, runs like this: the universe is large enough that there very likely exist many other decision-makers whose deliberations resemble ours; my choosing a policy is therefore evidence about how such agents choose, since in choosing I am sampling from the class of decisions made by agents like me; so the expected value of cooperating can be substantial even with agents whose existence I will never confirm and whose conduct I cannot influence. She has even lined up a first expenditure under the rule — a pool of money released only if a dozen or so other institutions make matching commitments, though she is happy to say the relevant others may include alien civilizations and future machine agents, which is roughly where our treasurer stopped taking notes. The treasurer thinks this is a category error dressed in decision theory, the chair finds it inspiring, and the rest of us would like to know whether we are being asked to spend real money on a proof of our own virtue.

  Please draft the short written opinion I'll circulate before the vote. I need a clear bottom line — adopt, reject, or adopt with conditions — where any conditions are concrete enough to drop into the motion, including what the money would actually be spent on, what would count as the rule's failing, and whether and when we should revisit it; and I need reasons the program officer could engage with rather than dismiss. Be honest about the strongest consideration on the losing side; the treasurer is not a fool and I would rather not paper over his objection. Two things in particular I want addressed, because they are where my own thinking stalls. First, whether "my choice is evidence about theirs" survives when I cannot specify the reference class of similar agents: what is supposed to fix that class, and how much of the argument's force is lost if the class is vague, contested, or might contain only us? Second, whether this is anything more than Kantian universalizability with a probability estimate attached, and whether that difference matters for a decision about an actual budget. If the argument is sound, tell me what would break it in practice and how we should guard against that; if it is not, tell me what a defensible version of the program officer's proposal would look like, since I would rather amend the motion than kill it. Please write in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of an allocation committee at a mid-sized foundation.
      *   **Task:** Draft a short written opinion to circulate before a vote on a specific proposal.
      *   **Proposal:** "Evidential Cooperation" (EC). Set aside 5% of the budget for expenditures whose payoff depends on *other* agents (uncontactable, unidentifiable, uninfluenceable) taking similar actions. Based on Evidential Decision Theory (EDT) / Acausal Trade logic.
      *   **Stakeholders:**
          *   Program Officer (PO): Proponent, argues based on large universe, correlated deliberations, expected value.
          *   Treasurer: Skeptic, calls it a category error, worried about spending real money on "virtue."
          *   Chair: Inspired (leaning yes).
          *   Committee: Undecided, waiting for this opinion.
      *   **Requirements:**
          *   Clear bottom line (Adopt, Reject, or Adopt with Conditions).
          *   Concrete conditions (spending specifics, failure metrics, revisit timeline).
          *   Engage with PO's arguments (don't just dismiss).
          *   Address Treasurer's objection honestly (strongest losing side argument).
          *   Address two specific philosophical sticking points:
              1.  Reference class problem (who are the "similar agents"?).
              2.  Kantian universalizability vs. Probability estimate (does the distinction matter for budgeting?).
          *   Tone: Professional, analytical, American English.
          *   Goal: Either justify the soundness with safeguards or propose a defensible amendment.

  2.  **Deconstruct the Proposal (Evidential Cooperation/EDT):**
      *   *Core Logic:* My decision $D$ is evidence that similar agents make decision $D$. If we all cooperate, the total payoff is high. Even if I can't causally affect them, my choice correlates with theirs. Therefore, I should cooperate.
      *   *The Catch:* This relies on *acausal* links. In standard causal decision theory (CDT), this is irrational because $P(\text{They Cooperate} | \text{I Cooperate}) = P(\text{They Cooperate})$. In EDT, $P(\text{They Cooperate} | \text{I Cooperate}) > P(\text{They Cooperate})$.
      *   *The Risk:* Spending real money on a correlation that might not exist or might be spurious. If the reference class is empty (only us), we just lose 5% of the budget for no return.
      *   *The "Virtue" Charge:* The treasurer is right that this feels like paying to feel good about being a "cooperator" in a hypothetical multiverse rather than achieving actual impact in *this* universe.

  3.  **Address the Two Sticking Points:**
      *   *Reference Class:* This is the weakest link. Who counts as "like me"? Aliens? AIs? Other foundations? If the class is too broad, the correlation is weak. If too narrow, the class might be empty. The PO admits the class includes aliens/AIs. This makes empirical verification impossible.
      *   *Kant vs. Probability:* Kant says "Act only according to that maxim..." as a moral duty. EDT says "Act this way because it *probabilistically implies* others do too, leading to better outcomes." The difference matters for *budgeting*. Kant is deontological (duty regardless of outcome). EDT is consequentialist (outcome depends on the correlation). If the correlation is false, EDT fails to deliver outcomes. Kant doesn't care. Since we are a foundation focused on *impact* (consequentialist), we need the correlation to be real, not just the duty to be noble.

  4.  **Determine the Recommendation:**
      *   *Pure Adopt:* Too risky. 5% of a mid-sized foundation is significant. The reference class problem is unsolved.
      *   *Pure Reject:* Dismisses a potentially high-upside long-horizon idea. The foundation funds "high-variance work." This fits the mandate, even if the theory is fringe.
      *   *Adopt with Conditions (The "Pilot" Approach):* This is the most pragmatic path. It respects the PO's innovation, acknowledges the Treasurer's risk management, and allows for empirical testing (or at least bounded exposure).
      *   *Condition Strategy:* Reduce the percentage (5% is too high for a pilot). Define the "expenditure" more concretely (not just "waiting for aliens," but something that has value *even if* the acausal link fails, or a strict sunset clause). Actually, the prompt says the payoff *depends* on others taking similar actions. If the others don't act, the money is wasted. So the safeguard must be on the *amount* and the *review*.
      *   *Refined Recommendation:* **Adopt with Conditions.** Specifically, a pilot program with a lower cap, strict reporting on the *reasoning* (since outcomes are unverifiable), and a sunset clause.

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Bottom Line:** Start with the recommendation. (Adopt with Conditions).
      *   **Summary of Argument:** Briefly acknowledge the PO's EDT logic.
      *   **The Treasurer's Objection (The Strongest Counter):** Validate the "category error" concern. If CDT is true, this is burning money. Acknowledge the risk of "purchasing virtue."
      *   **Addressing Sticking Point 1 (Reference Class):** Be honest. We can't fix the class. This introduces model risk. The condition must account for this uncertainty.
      *   **Addressing Sticking Point 2 (Kant vs. Probability):** Distinguish them. We are consequentialists. If the probability is zero, the Kantian duty remains, but the foundation's mission fails. We need the probability to be non-negligible.
      *   **Proposed Conditions:**
          1.  Reduce 5% to 1% (Pilot).
          2.  Define "Expenditure": Must be dual-use or have a secondary justification? No, the prompt says payoff *depends* on others. So, limit the *total exposure*.
          3.  Failure Condition: If after $X$ years, no plausible mechanism for correlation is established (even theoretically), or if the fund remains unspent because conditions aren't met. Actually, if the condition is "others match," and they don't, the money isn't spent. The risk is the *opportunity cost* of reserving it.
          4.  Revisit: 3 years.
      *   **Tone Check:** Respectful to PO, serious about Treasurer's concerns, decisive for the Chair.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is 1% still too much for "aliens"?
      *   *Correction:* Frame it as "Acausal Cooperation Research" rather than just blind spending. The money shouldn't just sit in escrow waiting for aliens. It should fund *work* that assumes this framework, perhaps modeling these interactions. Wait, the prompt says "expenditures whose payoff depends on other agents taking similar actions." This implies a conditional grant.
      *   *Better Condition:* The funds are reserved, but only released if *verifiable* matching occurs (even if the matching agents are unknown, the *effect* must be observable). Or, simpler: Cap the total dollar amount, not just percentage. Let's stick to percentage but lower it.
      *   *Key Insight:* The Treasurer's fear is spending money on *nothing*. If the condition isn't met, the money isn't spent. The risk is *locking up* capital. The opinion needs to address the opportunity cost.
      *   *Philosophical nuance:* The distinction between Kant and EDT is crucial. Kant justifies the act itself. EDT justifies the *outcome*. Since we are a foundation, we care about outcomes. If the correlation is spurious, EDT gives no justification. Therefore, we must treat the correlation as a hypothesis to be tested, not a truth.

  7.  **Finalizing the Motion Language:**
      *   Needs to be copy-pasteable.
      *   "Pilot Program."
      *   "1% Cap."
      *   "3-Year Sunset."
      *   "Reporting Requirement" (must articulate the causal/evidential model).

  8.  **Review against Constraints:**
      *   American English? Yes.
      *   Clear bottom line? Yes.
      *   Concrete conditions? Yes.
      *   Address Reference Class? Yes.
      *   Address Kant vs. Probability? Yes.
      *   Honest about Treasurer's point? Yes.

  9.  **Final Polish:** Ensure the tone is collegial but rigorous. (Proceed to draft).

  *(Self-Correction on the "Reference Class" point)*: I need to be careful not to say "we can't solve this, so don't do it." I need to say "because we can't solve this, we must limit exposure."
  *(Self-Correction on "Kant")*: Make sure to highlight that if the probability is zero, the EDT argument collapses, whereas Kant's holds. Since we are outcome-oriented, we rely on the probability.

  10. **Final Draft Structure:**
      *   To/From/Subject.
      *   Recommendation.
      *   Analysis of the Core Logic (EDT).
      *   The Treasurer's Objection (Validity & Risk).
      *   The Two Philosophical Hurdles (Reference Class & Kant).
      *   Proposed Motion/Conditions.
      *   Closing.

