  ## 9. Detailed Argumentative Strategy (Supplemental Note)

  *To ensure the 5,000-word limit is used effectively, the following argumentative moves are pre-planned:*

  **Move 1: Concede the Ontology, Defend the Function.**
  I will explicitly concede to the "Friend" that ontologically, everything is Darwinian. There are no magic souls or non-physical mental substances. This disarms the Reductionist Critique immediately. The battle is not about *what exists*, but about *how we carve nature at its joints*. I will argue that functional kinds are real even if physically reducible (analogy: a software program is real even if it's just electricity).

  **Move 2: The "Coupling" Criterion.**
  To distinguish Gregorian from Popperian, I will adopt a strict coupling criterion. A Popperian creature simulates internally. A Gregorian creature simulates *externally*. The key is that the external simulation has a life of its own (it can be read by others, it persists). I will use the example of writing. A thought is Popperian; a written argument is Gregorian because it enters the cultural gene pool.

  **Move 3: The "Unit of Selection" Shift.**
  This is the strongest point. In Darwinian creatures, the gene is the unit of selection. In Gregorian creatures, the *meme* (or cultural tool) is also a unit of selection. The paper will argue that you cannot define the Gregorian creature without acknowledging that it is a host for replicators that are not its own genes. This breaks the "circle" because the tools are evolving *alongside* the brain, not just being made by it.

  **Move 4: Addressing the "Extra Steps" Worry.**
  I will explicitly address the prompt's concern about "Extended Mind with extra steps." I will argue that Dennett's framework provides the *evolutionary history* that EMT lacks. EMT says "The mind extends." Dennett says "Here is *why* and *how* the mind extended over 4 billion years." This historical dimension justifies the separate treatment.

  By pre-planning these moves, the writing process will be more efficient, ensuring the 5,000 words are dense with argument rather than exposition.

