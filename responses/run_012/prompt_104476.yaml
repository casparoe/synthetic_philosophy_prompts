answer: |-
  Consider the case of a pilot performing a pre-flight check on an aircraft with redundant systems. The cockpit contains two identical master switches, Switch A and Switch B. Both control the same electrical bus, and both are fully functional. For the plane to operate, at least one must be engaged, but engaging both is standard procedure. The pilot needs to flip one of them to the "On" position to begin the sequence. Intrinsically, the switches are indistinguishable in terms of resistance, location, and effect. The pilot has no preference for Switch A over Switch B; neither is mechanically superior, nor is one more convenient to reach.

  However, the pilot flips Switch A.

  The reason for this choice is not that Switch A is better than Switch B. The reason is that the aircraft's flight manual—a binding operational convention—specifies that the "Left Master" (Switch A) must be engaged before the "Right Master" (Switch B). The pilot has a genuine, normative reason to choose Switch A: adherence to the protocol. This reason stems from a prior commitment to safety procedures and the institutional convention of the checklist. It is a reason to *act* in a specific way, but it is not a reason to *prefer* Switch A as an object. The pilot does not value Switch A more than Switch B; she values *compliance with the procedure*. If the manual were reversed, she would have the same reason to choose Switch B. The reason attaches to the rule, not the option.

  ### What This Shows About Buridan's Ass

  This example suggests that Buridan's paradox dissolves, provided we expand our understanding of rational agency beyond simple preference maximization.

  The paradox of Buridan's Ass rests on a specific premise: that a rational agent can only move toward an option if they perceive it as *better* than the alternative. The ass starves because the hay bales are equal in value, leaving the will suspended. The example above demonstrates that this premise is false. An agent can have a sufficient reason to choose without judging the chosen option to be intrinsically superior. The reason resides in the *context of the choice* (the convention, the commitment, the narrative) rather than the *content of the options*.

  Once we admit reasons for choosing that are not preferences among the options, the paralysis vanishes. The ass does not need to find a taste difference in the hay; it only needs a rule, such as "always turn left first" or "approach the nearest bale." If the ass is capable of following a convention or a prior policy, it eats.

  However, one might argue the paradox merely changes form. A skeptic could ask: "Doesn't following the rule imply a preference for following the rule over breaking it?" If the agent prefers *order* to *chaos*, isn't that just a higher-order preference? While technically true that the agent prefers *acting rightly* to *acting wrongly*, this does not resurrect the original paradox. The original paradox claims the agent cannot choose between *A and B*. The solution shows the agent is not actually choosing between *A and B* in a vacuum; they are choosing between *A-in-accordance-with-the-rule* and *B-in-violation-of-the-rule*. These are not identical options.

  Therefore, the paradox dissolves. It relies on a narrow conception of rationality that ignores the normative force of conventions, commitments, and defaults. Human agents (and rational animals) do not merely weigh the intrinsic properties of outcomes; we navigate a world structured by rules. When intrinsic preferences run out, structural reasons take over, allowing the will to move without requiring a phantom preference where none exists.
