answer: |-
  # Session Plan: The Legibility of Obligation

  **Session Length:** 90 Minutes
  **Participants:** 14 (Mixed levels; ~7 Actual Locals, ~7 Actual Visitors)
  **Room Setup:** A cluster of 7 chairs (the "Tram") and an open floor space (the "Café" and "Crossing"). A whiteboard for tallying.

  ## 1. Materials

  ### The Customs Sheet (Handout)
  *Print on card stock. Title it "Welcome to Oria: Resident Orientation." Do not label it as a philosophy exercise.*

  > **ORIA CITY CUSTOMS (SUMMARY FOR NEW ARRIVALS)**
  >
  > **1. The Café Convention**
  > In Oria, all café bills include a service charge. Adding cash to the table is not standard. Locals interpret extra cash in one of two ways: either as a signal that the server's wage is insufficient (a political statement), or as a request for preferential treatment in the future (a bribe). Consequently, locals do not tip.
  >
  > **2. The Tram Stop Protocol**
  > There are no painted lines at tram stops. Boarding order is determined strictly by arrival time. This is tracked socially, not physically. To hold your place, you must make brief eye contact with the person behind you, take a half-step forward, and offer a small, single nod. Without this signal, your position is considered unclaimed.
  >
  > **3. The Crossing Exception**
  > Crossing against the red signal is permitted and common, even mid-conversation. However, there is one absolute exception: If a child under ten is waiting at the curb, no adult may cross against the signal, even if the road is empty. To do so is considered a direct threat to the child's safety perception.

  ### The Stake Tokens
  *   **5 "Priority Tokens"**: Physical cards (e.g., coloured index cards).
  *   **Value:** Each token allows the holder to vote on *one* topic for the next day's session. (This is real, small, and non-monetary).

  ## 2. Roles & Rules

  *   **Locals (Actual Residents):** You know these customs instinctively. You do not need the sheet. Your goal is to maintain social coordination. You perceive deviations as *rudeness* or *confusion*, not necessarily malice.
  *   **Visitors (Actual Non-Residents):** You have the sheet. You are trying to integrate. You perceive the customs as *rules* to be followed or *barriers* to be navigated.
  *   **The Instructor:** You are the "City Registrar." You do not explain the meaning of the customs. You only adjudicate disputes based on the "Local Reaction."

  ## 3. Minute-by-Minute Timeline

  ### Phase 1: Orientation & Opt-Out Analysis (00–25 mins)
  *   **00–05:** Hand out the Customs Sheet to the **Visitors only**. The **Locals** receive a blank card that says "You live here."
      *   *Script:* "Welcome to Oria. For the next hour, we are simulating social coordination in this city. Visitors, you have the orientation sheet. Locals, you already know how things work. Your task is not to discuss whether these customs are good, but to map the cost of breaking them."
  *   **05–15:** **Small Group Work (Mixed Pairs).**
      *   Task: For each of the three customs, answer two questions on a worksheet:
          1.  *The Individual Opt-Out:* What exactly must a person do to decline this custom visibly? (e.g., put money down, don't nod). Who notices? Is it read as an insult, an imposition, or mere difference?
          2.  *The Collective Opt-Out:* What happens if *everyone* stops doing this tomorrow? Does the system collapse, or does it just change?
  *   **15–25:** **Report Back.**
      *   Pairs share findings. Instructor writes keywords on the board under "Cost," "Signal," and "Collapse."
      *   *Constraint:* Instructor must not use words like "obligation," "moral," or "norm." Use "coordination," "signal," and "friction."

  ### Phase 2: The Real Choice (25–45 mins)
  *   **25–30:** **Setup.**
      *   Arrange the 7 chairs in a row (The Tram).
      *   Announce there are 5 Priority Tokens available. They will be awarded to the first 5 people who successfully "board" the tram according to Oria customs.
      *   Select **one Visitor** (volunteer or drafted) to be the "Test Case." They stand at the front of the queue.
      *   Select **three Locals** to be the "Boarding Gate." They stand by the chairs.
  *   **30–40:** **The Simulation.**
      *   The Test Case must attempt to board. They must decide whether to perform the "Nod" (Custom 2).
      *   *The Stake:* If they nod and are accepted, they get a Token. If they refuse to nod (opt-out), the Locals must react based on how they would *actually* feel (confusion/delay/denial).
      *   *Crucial:* The Locals are instructed not to punish maliciously, but to react authentically to the loss of legibility. If the Visitor doesn't nod, the Local should hesitate, look confused, or ask "Are you boarding?" thereby delaying the Test Case.
      *   Run this for 3 rounds with different Test Cases (mix of Locals and Visitors).
  *   **40–45:** **Immediate Reflection.**
      *   Ask the Test Cases: "What was the cost of the nod?"
      *   Ask the Gatekeepers: "What did the lack of a nod tell you?"
      *   *Do not generalize yet.* Keep it specific to the chairs and the tokens.

  ### Phase 3: The Demographic Shift (45–70 mins)
  *   **45–50:** **The Scenario Change.**
      *   *Script:* "Ten years have passed in Oria. A large wave of migration has occurred. The Visitors are now the numerical majority (60%) of the city. The Locals are now the minority (40%)."
      *   *Mechanic:* In this phase, any new custom requires a majority vote to become binding. However, the Locals claim their existing customs are "Grandfathered."
  *   **50–65:** **The Negotiation.**
      *   The group must decide: **Do the three Oria customs remain binding on the new majority?**
      *   Locals must argue *why* they should remain.
      *   Visitors must decide if they feel bound by them.
      *   *Instructor Intervention:* If Locals argue "It's harmful to not tip," challenge them: "Show me the harm." If Visitors argue "It's inefficient," ask: "Is efficiency the only reason to conform?"
  *   **65–70:** **The Vote.**
      *   Vote on each custom individually. Record the result.

  ### Phase 4: Debrief (70–90 mins)
  *   **70–80:** **Mapping the Claims.**
      *   Do not state the claims. Elicit them from the specific moments.
      *   *Claim 1 (Opt-out Legibility):* Point to the Café custom analysis. "When we discussed tipping, did anyone say the money was the problem? Or was it the *message* sent by the money?" (Guide them to: It's not the content, it's the legibility of the refusal).
      *   *Claim 2 (Visitor Illegibility):* Point to the Tram Simulation. "Test Cases, did you feel obligated to nod because the nod is sacred? Or because you didn't want the Gatekeeper to look confused?" (Guide them to: Obligation came from being unreadable, not the act itself).
      *   *Claim 3 (Predictability vs. Harm):* Point to the Vote. "Locals, when you argued to keep the Crossing rule, did you argue that people would get hit by cars? Or that you wouldn't know what to expect?" (Guide them to: Entitlement was about prediction, not safety).
  *   **80–85:** **Shows vs. Dramatises.**
      *   Explicitly state: "This activity *dramatised* the stakes (tokens, chairs). It *showed* the friction of illegibility (the hesitation at the gate). It did not show the long-term cost of social exclusion."
  *   **85–90:** **Closing.**
      *   Distribute the Priority Tokens to the winners.
      *   Final prompt: "Next time we meet, notice what you owe this room simply because you know how to be in it."

  ## 4. The Stake Scheme

  *   **Currency:** Priority Tokens (5 total).
  *   **Value:** Each token = 1 Vote on next day's topic.
  *   **Distribution:**
      *   3 Tokens awarded during Phase 2 (The Tram Simulation) to successful boarders.
      *   2 Tokens awarded during Phase 3 to the most persuasive arguers (one Local, one Visitor).
  *   **Why this works:** It creates scarcity without money. It makes "conformity" (Phase 2) and "persuasion" (Phase 3) instrumentally valuable. It ensures the "Real Choice" has a consequence that lasts beyond the 90 minutes.

  ## 5. Debrief Guide: Mapping Moments to Claims

  **Claim 1: Separation of custom/obligation depends on legible opt-out, not content.**
  *   *Map to:* Phase 1 (Café Discussion).
  *   *Ask:* "When you worked out how to opt-out of tipping, was the difficulty about the money, or about finding a gesture that said 'I am not tipping' without saying 'I am insulting you'?"
  *   *Point:* If the opt-out is illegible (read as insult), it functions as obligation. If it is legible (read as difference), it remains custom.

  **Claim 2: Visitor's felt obligation is produced by illegibility, not the custom.**
  *   *Map to:* Phase 2 (Tram Simulation).
  *   *Ask:* "Test Cases, if the Gatekeeper had smiled and waved regardless of your nod, would you have felt the same pressure to nod?"
  *   *Point:* The obligation arises because the Visitor *needs* to be understood by the Local to coordinate. The custom is just the language; the obligation is the need to speak it to be seen.

  **Claim 3: Locals' entitlement is about predictability, not harm.**
  *   *Map to:* Phase 3 (The Vote).
  *   *Ask:* "Locals, when you defended the Crossing Rule, did anyone claim a child would actually be hit? Or did you say it would be 'chaotic' or 'wrong'?"
  *   *Point:* If no physical harm occurs (empty road), the claim to entitlement is a claim to a predictable social environment, not a claim to safety.

  **What the Activity Shows vs. Dramatises:**
  *   **Shows:** The immediate cognitive load of decoding illegible actions (the hesitation at the tram gate). The friction of coordination when codes differ.
  *   **Dramatises:** The stakes (tokens are trivial compared to real social capital). The timeline (10 years compressed to 15 minutes).
  *   **Instructor Supply:** You must supply the link to *moral weight*. The activity shows social mechanics; you must ask them to consider when those mechanics become *justice*. (e.g., "When does predictability become oppression?")

  ## 6. Troubleshooting: What Will Go Wrong

  **1. Participants are too polite to break the customs (The "Nice" Failure).**
  *   *Symptom:* In Phase 2, every Test Case nods. No friction occurs.
  *   *Cause:* Social anxiety overrides the simulation.
  *   *Fix:* **Introduce the "Glitch" Card.** Hand one Visitor a card before Phase 2 that says: "You physically cannot nod today (neck injury)." They must board without nodding. This forces the Locals to react to an illegible signal without the Visitor "breaking the rule" intentionally. It isolates the *interpretation* variable.

  **2. Visiting students simply defer to the Locals (The "Deference" Failure).**
  *   *Symptom:* In Phase 3, Visitors vote to keep all customs without argument, saying "We should respect the host."
  *   *Cause:* Real-world politeness bleeds into the simulation.
  *   *Fix:* **Assign "Migration Interests."** Give Visitors a secret goal: "You are tired of the Tram delay. You want to introduce painted lines." Give Locals a secret goal: "You hate painted lines; they feel aggressive." This gamifies the conflict and gives them permission to disagree without being personally rude.

  **3. Locals dominate the discussion (The "Voice" Failure).**
  *   *Symptom:* Locals explain the customs authoritatively; Visitors listen.
  *   *Cause:* Epistemic authority aligns with the room's actual demographics.
  *   *Fix:* **Silence the Locals in Phase 1.** During the Opt-Out Analysis, Locals are forbidden from explaining *why* the custom exists. They can only describe *what happens* if it is broken. This forces Visitors to analyze the structure, not just receive the lore.

  **4. The "Real Choice" feels fake.**
  *   *Symptom:* Participants laugh off the Token stake.
  *   *Cause:* The stake is too abstract.
  *   *Fix:* **Make the Token Immediate.** "The person who boards first chooses the music for the break." Or, "The person who boards last must clean the whiteboard." Make the consequence physical and immediate, not just about "tomorrow's topic."

  ## 7. The Missing Element (Instructor Supply)

  **What the activity cannot reproduce:**
  The activity cannot reproduce **long-term exclusion**. In the room, if a Visitor fails to nod, they lose a token. In reality, if a Visitor fails to nod repeatedly, they may be denied housing, employment, or friendship over months. The simulation creates *friction*, but not *consequence*.

  **How to supply it:**
  In the final 5 minutes of the debrief, you must explicitly state:
  *"Today, the cost of illegibility was a token or a moment of awkwardness. In the city outside, the cost of illegibility is often trust, opportunity, or belonging. The mechanics we played with here are the same, but the stakes are higher. When we talk about 'obligation' next time, remember the hesitation at the tram door. That hesitation is the sound of a custom hardening into a law."*
