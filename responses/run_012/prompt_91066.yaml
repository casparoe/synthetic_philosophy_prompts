  9.  **Troubleshooting:**

      *   *Too Polite:* They won't break the rules. *Fix:* Introduce a "Provocateur" role or incentivize rule-breaking for points.
      *   *Visitors Defer:* They won't challenge locals. *Fix:* Give Visitors explicit authority in Phase 3.
      *   *Locals Dominate:* *Fix:* Enforce the role swap strictly.

  10. **Review against Constraints:**

      *   90 mins? Yes.
