      *   *Plan:* I will structure the advice around those three specific claims, plus a note on uploading.

  6.  **Final Review against Hofstadter's Text:**
      *   *Self as Illusion:* Confirmed. He uses the word "illusion" but defines it as a high-level feedback loop.
