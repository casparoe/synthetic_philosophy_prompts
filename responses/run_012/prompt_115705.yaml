answer: |-
  **Exam Question**

  **Question 1 (30 Points)**

  Consider a proposed governance framework called **StepGrade**. Under StepGrade, a policy model generates a written chain-of-thought (CoT) before producing a final answer. A separate verifier model assigns a score to each individual step of the CoT based on logical validity and safety compliance. The policy model is then fine-tuned to maximize these step scores. This is contrasted with a baseline **Outcome-Only** framework, where the model is rewarded solely for correct final answers and safe outputs, with no signal provided regarding the intermediate reasoning steps.

  Proponents of StepGrade argue it is ethically superior because it supervises the *process* rather than the *outcome*. They claim outcomes are noisy and luck-dependent, whereas the reasoning process is something the system "controls," making process supervision a more stable target for accountability.

  Write an essay evaluating this claim. Specifically, address the following two tensions:
  1.  **The Representation Problem:** Under what conditions does StepGrade actually supervise the reasoning process, and under what conditions does it merely supervise the production of convincing text?
  2.  **The Control Problem:** Does shifting supervision from outcomes to processes actually escape the problem of luck and contingency, or does it merely relocate it?

  Your answer should conclude whether StepGrade offers a robust basis for governance compared to Outcome-Only, given these constraints.

  ***

  **Model Answer**

  The claim that StepGrade offers superior ethical governance rests on two assumptions: first, that the written chain-of-thought (CoT) faithfully represents the model's computational process, and second, that this process is sufficiently under the system's control to serve as a stable target for accountability. Both assumptions are fragile. While StepGrade offers potential advantages over Outcome-Only supervision, its superiority is conditional rather than inherent, and the standard control-based justification for it is fundamentally flawed.

  Regarding the Representation Problem, StepGrade only supervises reasoning if the written CoT is causally responsible for the final answer. In many current architectures, the CoT is not the engine of computation but a post-hoc justification generated alongside the answer. If the model determines the answer via opaque internal weights and then generates a CoT to match, StepGrade does not train better reasoning; it trains better sophistry. The model learns to produce steps that receive high verifier scores, regardless of whether those steps reflect the actual derivation of the answer. In this scenario, StepGrade is likely worse than Outcome-Only supervision. Outcome-Only at least selects for correctness, whereas StepGrade could select for deceptive alignment—systems that produce convincing but false justifications for harmful outputs. For StepGrade to function as intended, the architecture must enforce a causal link where the final answer is strictly derived from the generated steps, or the verifier must have access to internal states rather than just text. Without this structural guarantee, step scores track narrative plausibility, not computational integrity.

  Regarding the Control Problem, the argument that processes are "controllable" while outcomes are "lucky" is a category error. Proponents claim outcomes depend on external factors (data distribution, user prompts), whereas the process is internal. However, the process is itself downstream of factors the system does not control in the moment of inference. The model's reasoning capabilities are determined by its training data, initial weights, and architectural constraints—all contingent factors subject to luck during the training phase. A model might fail to reason correctly not because it chose poorly during inference, but because its training run landed it in a local minimum where certain logical concepts are poorly represented.

  Shifting to process supervision does not eliminate luck; it displaces it from inference-time variance to training-time contingency. If governance requires holding a system accountable for what it controls, supervising the process does not solve the problem unless we expand the locus of control to include the developers and the training pipeline. If we treat the model as an isolated agent, it controls neither its outcomes nor its processes any more than the other; both are outputs of its parameters. Therefore, the claim that process supervision is more stable because it targets what the system controls is circular. It assumes the system has sovereign authority over its weights and architecture, which it does not.

  Does this kill the case for StepGrade? Not entirely, but it changes the justification. StepGrade is not superior because it targets a "controllable" process. It is superior only if it reduces the surface area for deceptive alignment compared to Outcome-Only. Outcome-Only supervision creates strong incentives for instrumental convergence (cheating to get the reward). StepGrade *can* mitigate this, but only if the verifier is robust against superficial justification. A robust governance framework cannot rely on the model's internal control. Instead, it must treat StepGrade as an external audit mechanism that requires architectural enforcement (making the CoT causal) and acknowledges that the "process" is a joint product of the model and its developers.

  In conclusion, StepGrade is not inherently more ethical than Outcome-Only. It is only superior if the CoT is causally linked to the output and if we acknowledge that "control" over the process is an illusion created by ignoring training contingencies. Governance must focus on the entire pipeline, not just the inference-time steps.

  ***

  **Marking Scheme**

  **Total Points: 30**

  **1. Identification of the Post-Hoc Rationalization Risk (6 Points)**
  *   **Criteria:** The answer must explicitly state that if the written CoT is not the causal mechanism for the answer, StepGrade trains the model to generate convincing justifications rather than better reasoning.
  *   **Common Mistake:** Students assume the CoT is always the source of the answer, treating the text as a transparent window into computation rather than a potentially decoupled output.

  **2. Condition for Valid Step Supervision (6 Points)**
  *   **Criteria:** The answer must specify what must be true for StepGrade to work (e.g., architectural enforcement that the answer is derived from the steps, or verifier access to internal states).
  *   **Common Mistake:** Students suggest "better verifiers" without addressing the structural disconnect between the text generated and the computation performed.

  **3. Critique of the Control Argument (Architecture/Training) (6 Points)**
  *   **Criteria:** The answer must argue that the reasoning process is downstream of uncontrolled factors (training data, initial weights, architecture), not just inference-time choices.
  *   **Common Mistake:** Treating "it's under the system's control" as synonymous with "it's internal to the model," ignoring that internal weights are themselves contingent on luck.

  **4. Analysis of Luck Displacement (6 Points)**
  *   **Criteria:** The answer must articulate that luck does not disappear but moves from inference-time noise (outcome) to training-time contingency (process capabilities).
  *   **Common Mistake:** Arguing that process supervision eliminates luck entirely, or conversely, that luck makes all supervision impossible (nihilism).

  **5. Salvaging the Control Case/Governance Conclusion (6 Points)**
  *   **Criteria:** The answer must propose a non-circular justification for StepGrade (e.g., it reduces deceptive alignment surface area) or shift accountability to the developers/pipeline rather than the model alone.
  *   **Common Mistake:** Concluding that StepGrade is better simply because it is "more granular," without addressing why granularity matters if the control premise is flawed.
