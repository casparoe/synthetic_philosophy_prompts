answer: |-
  This is a classic philosophical frustration. Your roommate is wielding a sledgehammer (a broad Epicurean slogan) to crack very different nuts (ethics, metaphysics, psychology). You are right: these are not all the same claim. When he says "death is nothing to us," he is sliding between *metaphysical* claims (what exists), *ethical* claims (what matters), and *psychological* claims (what we should feel).

  Here is a menu of the precise claims hidden inside that sentence, evaluated for truth and mapped to your specific scenarios. You can take this list to him and ask which specific proposition he is defending.

  ### The Menu of Claims

  #### 1. The Metaphysical Claim: "There is no subject of death."
  *   **Precise Meaning:** When you are alive, death isn't present. When death is present, you aren't. Therefore, "being dead" is not a state that anyone ever occupies. It is simply the end of the subject.
  *   **Verdict:** **Genuinely Defensible.** This is the core of Epicurus's argument. It relies on a materialist view of consciousness (no soul). It is logically sound within that framework, though it ignores the *process* of dying.
  *   **Which scenario fits?** **Fear of dying.** This supports the idea that you will never actually "meet" death, so fearing the *state* of being dead is irrational.

  #### 2. The Harm Claim: "Posthumous harm is impossible."
  *   **Precise Meaning:** To be harmed, you must exist to experience the harm. Since the dead do not exist, nothing that happens after biological cessation (desecration, broken promises, estate disputes) can negatively affect *them*.
  *   **Verdict:** **Contested/Defensible.** This is a major debate in philosophy. Epicureans say yes, it's impossible. Others (like Joel Feinberg) argue we have "surviving interests" that can be violated. It is not *false*, but it is not settled fact.
  *   **Which scenario fits?** **Your Grandad's wishes & Body treatment.** This is the specific claim he used on you ("you can't do anything to someone who doesn't exist").

  #### 3. The Deprivation Claim: "Death is not a bad thing for the deceased."
  *   **Precise Meaning:** Badness requires a subject to experience the bad. Since the dead have no experiences, death cannot be bad *for them*. (Note: This differs from saying death isn't bad for *us* who lose them).
  *   **Verdict:** **Genuinely Defensible (with caveats).** It holds up logically, but clashes with the intuition that death is a "deprivation of goods" (i.e., it's bad because you lose the good life you could have had).
  *   **Which scenario fits?** **Fear of dying.** It suggests you aren't losing out on anything because there is no "you" to miss out.

  #### 4. The Moral Claim: "Obligations to the dead are actually obligations to the living."
  *   **Precise Meaning:** Respecting a will or a corpse doesn't benefit the dead (see Claim 2); it benefits the living by maintaining social trust, honoring memories, or soothing grief. Therefore, if breaking a wish helps the living more than keeping it, you should break it.
  *   **Verdict:** **Genuinely Defensible (Utilitarian).** This is a standard legal and utilitarian position. However, it clashes with Deontological ethics (the idea that promises have intrinsic weight regardless of consequences).
  *   **Which scenario fits?** **Your Grandad's wishes.** This is the justification for overruling him ("that whole business is about us, not him").

  #### 5. The Psychological Claim: "Grief is inefficient."
  *   **Precise Meaning:** Since the dead are not harmed by being forgotten, and not helped by being mourned, time spent grieving is time subtracted from the living's happiness. Therefore, excessive grief is irrational.
  *   **Verdict:** **False.** This is a category error. Grief is not a transaction with the dead; it is a psychological process for the living. Calling it a "waste of time" ignores the functional necessity of processing loss to return to normal functioning. Even Epicurus valued friendship and natural emotions; he didn't advocate numbness.
  *   **Which scenario fits?** **Grieving.** This is the claim that grief is a "waste of time."

  ---

  ### Mapping the Roommate's Arguments

  Here is how his specific comments map to the menu above, and where he is likely overreaching.

  | His Comment | Underlying Claim | Is the Claim Sound? |
  | :--- | :--- | :--- |
  | **"You can't do anything to someone who doesn't exist."** | **Claim 2 (Harm Claim)** | **Defensible,** but incomplete. It ignores that *promises* create obligations for the *promiser*, regardless of the promisee's existence. |
  | **"That whole business is about us, not him."** | **Claim 4 (Moral Claim)** | **Defensible,** but cold. It reduces ethics to utility. It ignores the moral value of *respect*. |
  | **"It's irrational to be scared of dying."** | **Claim 1 & 3 (Metaphysical/Deprivation)** | **Defensible,** provided he means fear of *being dead*, not fear of the *process of dying* (which can be painful). |
  | **"Grieving... is a bit of a waste of time."** | **Claim 5 (Psychological Claim)** | **False.** This is not philosophy; this is emotional avoidance. Grief is not a "task" to be optimized. |

  ### Which One Does He Actually Believe?

  Your roommate is likely operating under **Claim 2 (The Harm Claim)** as his "Master Key."

  He believes that because the dead cannot *experience* anything, they cannot possess *moral status*. If you can't be harmed, you can't have rights. If you have no rights, your wishes are merely suggestions.

  **The Problem:** He is conflating **Experiential Harm** (feeling pain) with **Normative Harm** (being wronged).
  *   *Example:* If I steal from a charity after the founder dies, the founder feels no pain (no experiential harm). But I have still wronged the founder's project and broken a trust (normative harm).
  *   Your roommate is arguing that because your Grandad feels no pain, he was not wronged. Most ethical systems disagree.

  ### How to Use This Menu

  When he says "Death is nothing to us," ask him to pick a card from the menu.

  1.  **If he talks about Fear:** Ask him, *"Are you saying I won't experience being dead (Claim 1), or that dying won't hurt (Claim 3)?"* (The first is true; the second is not necessarily).
  2.  **If he talks about your Grandad:** Ask him, *"Are you saying he can't feel pain (Claim 2), or that promises to the dead don't count (Claim 4)?"*
      *   *Counter-argument for Claim 4:* "If promises to the dead don't count, why do we honor contracts, wills, or historical agreements? If I promise you I'll feed your cat if you die, and I don't, have I done nothing wrong because you aren't there to know?"
  3.  **If he talks about Grief:** Call out **Claim 5** immediately. *"Grief isn't for the dead; it's for the living. Calling it a waste of time is like calling sleep a waste of time because you aren't productive while doing it."*

  **Summary for your roommate:**
  "Death might be nothing to the *dead*, but it is something to the *living*. You are using a metaphysical truth (the dead don't exist) to justify an ethical conclusion (the dead don't matter). Those are two different things."
