  ### Two New Cases

  **Case A: A Marketing Email**
  *   **Scenario:** A company sends a promotional email ($X$). Overall, people who got the email bought less ($Y$) than those who didn't. However, within "High Spenders" and "Low Spenders" ($Z$), the email increased purchases in both groups. The email was mostly sent to "Low Spenders" (who buy less anyway).
  *   **Analysis:** "Spender Type" is a **Confounder** (Pre-treatment). It influenced who got the email and how much they buy.
  *   **Principle Verdict:** Apply **Clause 1**. Trust the stratified comparison. The overall number is misleading.

  **Case B: A Weight-Loss Supplement**
  *   **Scenario:** A supplement ($X$) causes weight loss ($Z$), which causes better health ($Y$). Overall, takers are healthier. But if you compare only people who lost 0 lbs, takers are *less* healthy than non-takers (perhaps due to side effects).
  *   **Analysis:** "Weight Loss" is a **Mediator** (Post-treatment).
  *   **Principle Verdict:** Apply **Clause 2**. If you want to know "Should I take this to get healthy?", trust the **Overall** comparison. The "0 lbs" group comparison hides the benefit that comes *through* weight loss.

