prompt: |-
  You're a historian of early modern philosophy who also knows the philosophy of education literature, so I want your read on something. I'm a third-year PhD student working on Locke, and in education seminars I keep hitting the same move: Locke gets trotted out as the philosophical licence for the idea that schooling can make a child into anything — the mind is blank white paper, experience is the pen, so get the writing right and you've got the person. My supervisor pushes it further and says Locke's own education book (Some Thoughts Concerning Education, 1693) is just this picture applied, so the blank-paper reading is Locke's considered view of what upbringing can do. I don't buy it.

  Before you answer, brainstorm the correspondences for me: what plays the role of the paper, the pen, the ink, the hand, the reader — and which of those Locke's actual educational writings supply and which they don't. Then tell me where the analogy breaks, what it quietly imports that Locke's position doesn't have (my hunch: the paper has no grain of its own — no temper, no constitution, no natural bent — and it's purely passive, whereas Locke's pedagogy is all habit, practice, and esteem), and whether the strong environmentalist conclusion the analogy is used to sell survives once the disanalogies are on the table. One more thing that bugs me: the image itself comes from a different text than the one it's being used to sell. Does that matter for how much weight the analogy can carry?

  Lead with your bottom line in the first sentence, then the reasoning, no preamble and no restating my question.
