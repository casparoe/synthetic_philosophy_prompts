      *   *Move 2: Maya's Rebuttal (Conditioning).*
          *   Claim: We know more than "food truck." Experience, location, capital, cuisine.
          *   Verdict: Correct. Bayesian updating requires using available evidence.
          *   Missing: Risks overfitting. How do we weight these factors?

      *   *Move 3: Ravi's Counter (The Infinite Regress).*
