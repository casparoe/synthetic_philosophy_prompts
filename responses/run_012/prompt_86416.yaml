          *   Verdict: Philosophically strong (The Reference Class Problem).
          *   Missing: Pragmatism. We *do* make predictions successfully without classes of one.

      *   *Move 4: Maya's Distinction (Relevance).*
          *   Claim: Slice on predictive features, not arbitrary ones. Back pain irrelevant, brother relevant.
