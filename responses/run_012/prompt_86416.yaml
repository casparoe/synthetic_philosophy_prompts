  3.  **Address the Philosophical Core (The Reference Class Problem):**
      *   This is a classic problem in philosophy of probability (Reichenbach, Keynes, Hájek).
      *   *Is there a single right class?* No.
      *   *Is it arbitrary?* No.
      *   *Resolution:* It's a modeling choice optimized for predictive accuracy, usually solved via **Hierarchical Bayesian Modeling** or **Regularization**. You don't pick *one* class; you weight multiple classes.
      *   *Ravi is right* that there is no metaphysical "True Class."
      *   *Maya is right* that ignoring specific evidence is bad practice.
      *   *Synthesis:* The "right" answer is a weighted average of reference classes, where weights are determined by predictive validity (cross-validation), not philosophical purity.

