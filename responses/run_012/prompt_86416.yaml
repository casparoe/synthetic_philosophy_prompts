prompt: |-
  Two of my housemates got into a proper arguement last night and I just sat there like it was Wimbledon. It started because our friend Priya is deciding whether to lend her brother fifteen grand to start a food truck, and she asked us all what we figured the odds were that it'd still be open in three years.

  Ravi went first: most food trucks are dead within two years, the failure rate's something like 70%, so assume it fails, don't lend the money. Maya said that's the laziest reference class in the world — you know way more about this than "food truck." He ran a restaurant for eight years and sold it at a profit, he's going into a spot where two other trucks have done fine, he's got money from his father-in-law so he isn't leveraged, and he's been cooking this cuisine his whole life. Condition on all of that and the odds are nothing like 70%.

  Ravi said fine, then condition on everything. He also had a bakery that folded in 2019, he's 52 and this is his third go at a business, his back is shot, the neighbourhood rents climb every year, and the cuisine he's doing is trendy and trends die. And his brother, who's basically the same guy, ran a truck into the ground in 2021. So where do you stop slicing? Everyone's unique. You can always keep conditioning until the reference class is one person, and then your probability is 0 or 1 and you've learned nothing. So at some point you just pick a reference class, and "food trucks" is as good as any and a lot more honest than some class you built after you'd decided what answer you wanted.

  Maya said that's backwards — you don't slice on arbitrary features, you slice on the ones that actually predict the outcome. His back is irrelevant, his brother is relevant. And you don't get to pick the class that flatters your prior; there's definately a best one, the most specific class you can still estimate.

  Ravi: "still estimate" is doing all the work there, and it's just whatever makes the number come out stable, which is a free parameter you chose. And predictive of what? A feature is only relevant relative to a class and an outcome — you can't say what's relevant without already having a reference class, so your "most specific relevant class" eats its own tail. Also, and he thought this was the killer, the only way to know a feature is predictive is to look at outcomes, and the outcome here is the exact thing you're trying to predict, so you're picking your reference class using the answer. Maya said fine, then everything's circular and you can't predict anything, which is absurd, and anyway refusing to choose isn't neutral, it's just silently choosing the broad class. Then Ravi said, and here's the bit I can't get past: suppose you grant there's a best class. Which one is it when the features fight? Repeat operator, dying cuisine, family money, failed twin — the narrow class with all of that has like four people in it and they're all him. So you can't condition on everything and you can't condition on nothing and nobody's given me the rule for the middle. Maya said the rule is: narrowest class with enough data, and when it's too thin, shrink toward the broader one. Ravi said that's a recipe with a knob on it, not a principle.

  That's where they left it and honestly I couldn't call it. Can you go through it move by move — who's right on each point, what each of them is missing, and whether there actually is a principled answer to "which reference class is the right one," or whether Ravi's right that it's always a choice. And then tell me what I should actually say to Priya, because "it depends" is all I've got right now and it's useless.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

