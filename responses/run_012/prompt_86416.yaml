      *   *Refining the "Back Pain" point:* Ravi says it's relevant (health affects work); Maya says irrelevant. Actually, for a food truck owner-operator, physical stamina is relevant. Maya might be wrong there.
      *   *Refining the "Circularity":* Explain that causal models break the circle. We know experience helps restaurants *generally*, so we apply that causal knowledge without needing the specific outcome of *this* restaurant.

