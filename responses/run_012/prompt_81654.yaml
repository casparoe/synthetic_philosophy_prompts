answer: |-
  Your instincts are good: this gloss is a mix of accurate summary, significant oversimplification, and at least one major philosophical error. Your lecturer seems to be presenting a specific critique of the etiological view as if it were settled fact, rather than one side of an ongoing debate.

  Here is the sentence-by-sentence breakdown, followed by the specific cases and the "verbal dispute" question.

  ### Sentence-by-Sentence Analysis

  **1. "There are two theories of what a function is."**
  *   **Verdict:** **Oversimplification.**
  *   **Analysis:** While these are the *dominant* two theories (Selected Effects vs. Causal Role), there are others (e.g., Goal Contribution, Systemic, Forward-Looking). However, for an introductory gloss, framing it as a binary rivalry is acceptable pedagogy, even if technically incomplete.

  **2. "The etiological theory says a trait's function is whatever it was selected for -- the heart's function is to pump blood, because pumping blood is why hearts got selected."**
  *   **Verdict:** **Accurate.**
  *   **Analysis:** This is the standard definition of the "Selected Effects" (SE) theory (championed by philosophers like Ruth Millikan and Karen Neander). It correctly identifies the historical, backward-looking nature of the view.

  **3. "The causal-role theory says a function is any causal contribution a part makes to a bigger system, so on that view what the heart's function is just depends on which system you stick it in."**
  *   **Verdict:** **Mostly Accurate, slightly glib.**
  *   **Analysis:** This refers to Robert Cummins' theory. The "any causal contribution" part needs a tiny qualifier: it must contribute to a *capacity* of the containing system (e.g., circulation). The bit about "which system you stick it in" captures the context-relativity of Causal Role (CR) functions (e.g., a heart in a body pumps blood; a heart in a bucket does nothing), but it makes it sound arbitrary. It's not arbitrary; it depends on the *analytical context* of the scientist.

  **4. "The etiological theory is teological [teleological], so it smuggles purpose back into biology, which is why most biologists dont buy it..."**
  *   **Verdict:** **Philosophically Wrong.**
  *   **Analysis:** This is the biggest error in the gloss. The entire point of the etiological theory is to *naturalize* teleology, not smuggle it in. Before etiological theories, saying "the heart is *for* pumping" looked like mystical design. The etiological theory explains "for" in terms of concrete historical selection events. It removes the magic; it doesn't add it.
  *   **Biologist Claim:** The claim that "most biologists don't buy it" is empirically dubious. In practice, working evolutionary biologists almost exclusively use the etiological definition. When they write "the function of X," they mean "the adaptive reason X exists." They may not know the philosophical label, but their usage is etiological.

  **5. "...and since it defines function by selection history, it has to say a brand new trait can't have a function, which is obviously silly."**
  *   **Verdict:** **Standard Objection, but rhetorically loaded.**
  *   **Analysis:** This is the "Novel Trait" objection. It is true that strict etiological views say a brand-new mutation has no *function* until it is selected (it only has *effects*). Defenders argue this isn't silly; it's a precise distinction between "what this does" and "why this is here." Calling it "obviously silly" is a rhetorical move to dismiss the theory, not a refutation.

  **6. "Honestly, the two theories only really disagree about how far back you're allowed to look."**
  *   **Verdict:** **Wrong.**
  *   **Analysis:** This minimizes the disagreement. They aren't just disagreeing about time (history vs. now); they are disagreeing about *what kind of property function is*. One says function is a historical property (like "being a cousin"); the other says function is a dispositional/causal property (like "being soluble"). You can't reconcile them just by adjusting the time horizon.

  ---

  ### The Two Stuck Cases

  You mentioned two cases that often cause confusion. Here is how the theories handle them, which shows why the debate exists.

  **Case 1: The Side Effect (Exaptation)**
  *   *Scenario:* Feathers evolved for warmth (selected), but now help with flight (not originally selected). What is the function?
  *   **Etiological:** The function is **warmth**. Flight is a beneficial *effect*, but not the function (unless flight later becomes a selection pressure maintaining feathers).
  *   **Causal-Role:** The function includes **flight** (and warmth), because both are causal contributions to the bird's survival capacity right now.
  *   **Who is right?** It depends on what you want to know. If you want to know why feathers *exist* in the lineage, Etiological is right. If you want to know how the bird *works* as a flying machine, Causal-Role is more useful.

  **Case 2: The Vestigial Trait**
  *   *Scenario:* The human appendix. It was selected for digestion in ancestors, but now does nothing (or very little).
  *   **Etiological:** It **has a function** (digestion/immune support in ancestors), even if it doesn't do it anymore. This explains why we call it "vestigial" (it *lost* its function) rather than "useless junk."
  *   **Causal-Role:** It **has no function** (relative to current human capacity), because it makes no significant causal contribution to our current survival.
  *   **Who is right?** Etiological captures the biological intuition that vestigial organs are distinct from random noise. Causal-Role captures the physiological reality that it isn't doing work.

  ---

  ### Is it a Verbal Dispute?

  You asked: *Are the two theories even answering the same question?*

  **Yes, largely.** Many modern philosophers (like Justin Garson) argue that "function" is polysemous—it has multiple meanings.
  *   When a physiologist asks, "What is the function of the heart?" they usually want a **Causal-Role** answer (it pumps blood to circulate oxygen).
  *   When an evolutionary biologist asks, "What is the function of the heart?" they usually want an **Etiological** answer (it exists because it pumped blood in ancestors).

  The debate persists because people try to force one definition to do all the work. If you admit there are two concepts ("adaptive function" vs. "systemic function"), the tension dissolves. Your lecturer's claim that they "only disagree about how far back to look" tries to dissolve the tension by ignoring the conceptual difference, which is unhelpful.

  ### The "Most Biologists Don't Buy It" Claim

  This claim does **not** survive correction.
  1.  **Usage:** In biological literature, "function" is overwhelmingly used in the etiological sense. If a paper says "the function of this gene is," they imply it was selected for that role.
  2.  **Teleology:** Biologists are comfortable with "teleonomic" language (purpose-like talk grounded in selection). They don't feel they are smuggling in mysticism; they feel they are describing causal history.
  3.  **The Critique:** The lecturer might be conflating *biologists* with *philosophers of biology*. Philosophers argue about this endlessly; biologists mostly just use the etiological view because it fits evolutionary theory.

  ### Your Intuition

  You wrote: *I'm inclined to think the etiological view is just obviously right because hearts are for pumping.*

  You are not "off." You are aligning with the standard evolutionary definition. The reason the heart is *for* pumping is indeed because pumps were selected. If you found a heart that couldn't pump but still existed because of genetic drift, an etiological theorist would say "it has lost its function," whereas a causal-role theorist would say "it never had a function."

  The etiological view feels "obviously right" because it captures the **normativity** of function. It explains why a heart *ought* to pump blood, and why a heart that doesn't pump is *broken*. Causal-role theory struggles to explain "brokenness" (if the heart doesn't pump, its causal role is just "to sit there and decay").

  ### Summary
  Your lecturer's gloss is **biased toward the Causal-Role view**.
  *   **Accurate:** The basic definitions of the two views.
  *   **Inaccurate:** The claim that Etiological theory "smuggles purpose in" (it naturalizes it).
  *   **Inaccurate:** The claim that biologists reject the Etiological view (they generally use it).
  *   **Inaccurate:** The claim that the disagreement is just about time (it's about the nature of the property).

  You can trust your intuition that the etiological view is the standard for evolutionary biology, but keep the Causal-Role view in your back pocket for when you are analyzing systems where history is unknown or irrelevant (like engineering or physiology).
