answer: |-
  Elena operates a small artisanal brewery where she has spent $50,000 developing a unique yeast strain and brewing an inaugural batch that requires six months of fermentation to become drinkable. With one month remaining, she must spend $10,000 to maintain temperature and pressure, but the batch will sell for only $5,000. While the financial marginal loss is $5,000, Elena values the *completion of the brewing cycle* itself as a personal milestone of mastery; this good exists only if the project is carried through, whereas abandoning it yields vinegar and no sense of fulfillment. She says, "I've put too much in to stop now," meaning that the interruption would destroy the specific path-dependent good she seeks, which she values higher than the marginal financial loss, making continuation rationally defensible despite the deficit.

  Marcus operates a small artisanal brewery where he has spent $50,000 buying bulk ingredients for a standard lager that requires six months of fermentation. With one month remaining, he must spend $10,000 to maintain temperature and pressure, but the batch will sell for only $5,000. Marcus values only the net financial return of the venture; the beer tastes the same regardless of his personal attachment, and he gains no satisfaction from the process distinct from the profit. He says, "I've put too much in to stop now," meaning he feels compelled by the past expenditure itself to recover losses that are already gone, making continuation the textbook fallacy because the future costs exceed the future benefits without any offsetting non-financial good.

  **Check:** For both owners, a strict marginalist argues that the $50,000 sunk cost is irrelevant to the current decision; since the marginal cost ($10,000) exceeds the marginal financial return ($5,000), both should abandon the undertaking to minimize further loss. An account that permits preferences over paths agrees regarding Marcus, as his utility function is outcome-based (profit only), so continuing reduces his utility. However, regarding Elena, this account argues that her utility function includes a path-dependent good (completion/mastery); if the subjective value of completing the cycle exceeds the $5,000 marginal loss, continuing maximizes her utility. The single feature flipping the verdict is the existence of a good contingent on completion rather than merely on the final state. If this feature is removed from Elena's case (she no longer values completion), she should stop; if added to Marcus's case (he comes to value completion), he could rationally continue.

  **Objection:** Attributing a path-dependent preference cheats by making the theory unfalsifiable; if any agent can claim they value "completion" to justify burning money, the distinction licenses any continuation whatever and proves nothing about rationality. **Reply:** The distinction does not validate post-hoc rationalizations but identifies a structural condition for rationality; the claim is not that anyone *can* hold such preferences without scrutiny, but that *if* such genuine preferences exist, the sunk cost dictum fails to apply, showing the dictum assumes a restricted class of preferences. **Verdict:** The case shows the dictum that sunk costs should be ignored is merely badly stated.
