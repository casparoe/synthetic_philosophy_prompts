answer: |-
  # OPERATING PROCEDURE: CITIZENS' ASSEMBLY SELECTION

  **Authority:** City Charter Amendment [Year], Section [X].
  **Responsibility:** Office of the City Clerk.
  **Constraint:** Assembly size fixed at 50 members. Pool source fixed at Voter Roll.

  ### 1. The Frame (Pool and Exclusions)
  *   **Source:** The initial pool shall be drawn randomly from the current Municipal Voter Roll.
  *   **Exclusion Record:** Because the Voter Roll excludes non-citizen residents, minors, and disenfranchised populations affected by the referred question, the Clerk shall publish a **Demographic Gap Statement** alongside the invitation list.
  *   **Content:** This statement must quantify the percentage of the total resident population excluded from the pool by law.
  *   **Rationale:** The lot legitimizes the assembly by resembling the *pool*, not the *city*. Honesty about the pool's limits prevents false claims of total representation.

  ### 2. Stratification (Sorting and Apportionment)
  *   **Characteristics:** To ensure the lot produces a mirror rather than a caricature, the final 50 shall be stratified by: (a) Ward (Geography), (b) Age Cohort, and (c) Gender. Data is derived from Voter Roll records.
  *   **Apportionment:** Seats per stratum are calculated proportionally to the Voter Roll demographics.
  *   **Rounding Rule:** Use the **Largest Remainder Method**.
      *   *Example:* If a group merits 4.6 seats, it receives 5. If 4.2, it receives 4.
  *   **Minimum Threshold:** Any stratum calculating to less than 0.5 seats receives **zero** seats.
  *   **Rationale:** Stratification prevents statistical accidents from silencing groups. The zero-seat threshold acknowledges the mathematical limit of a 50-person body; it cannot mirror every minority.

  ### 3. Acceptance (Recruitment and Composition)
  *   **Invitation Volume:** To account for refusal, invite 150 residents (3x the assembly size) initially.
  *   **Replacement Protocol:** If a selected resident declines, invite the next random candidate from the *same stratum*.
  *   **Skew Threshold:** If the final 50 deviates by more than **10%** from the Voter Roll demographics on any stratified characteristic (e.g., Ward population is 20%, Assembly Ward representation is <10% or >30%), the Clerk shall issue a **Composition Warning**.
  *   **Correction Rule:** Do **not** weight the draw or oversample specific groups to correct the skew.
  *   **Rationale:** Correcting the skew via administrative weighting converts the lot into a quota system (appointment). A skewed lottery is still a lottery; a weighted lottery is a selection. The Warning preserves the integrity of the random process while flagging the defect.

  ### 4. Substitution (Attrition)
  *   **Resignation:** If a seated member resigns after convening, the vacancy is filled by a new draw from the *original stratum* of the resigning member.
  *   **Exhaustion:** If the original stratum pool is exhausted, draw from the general pool without stratification.
  *   **Rationale:** Maintaining the stratum preserves the statistical mirror established at the draw.

  ### 5. Internal Offices (Leadership and Scrutiny)
  *   **Selection:** The Chair and Rapporteur shall be **drawn by lot** from among the 50 members.
  *   **Rationale:** Election creates factions and privileges the vocal. Lot preserves equality.
  *   **Scrutiny (*Dokimasia*):** Before assuming office, a drawn officer is subject to a peer review by the Assembly.
  *   **Grounds for Veto:** Members may veto the drawn officer *only* for **Conflict of Interest** (financial stake or formal campaign role regarding the referred question).
  *   **Prohibited Grounds:** Members may *not* veto based on perceived competence, ideology, or speaking ability.
  *   **Rationale:** This addresses the objection that the lot chooses the "unfit." It removes bias without reverting to elitism. Ideological exclusion corrupts the lottery's point.

  ### 6. Boundary of Authority
  *   **Clerk:** Administers the draw, manages the budget, enforces this procedure.
  *   **Council:** Sets the mandate, changes the Charter, or alters stratification variables (Value Judgments).
  *   **Facilitator:** Manages deliberation time and speech rules.
  *   **Members:** Determine the substance of the report and the validity of internal officers (via Scrutiny).
  *   **Escalation:** Any request to alter the selection weights, stratification variables, or eligibility criteria is a **Value Judgment** and must be referred to the City Council for Charter amendment or legislative instruction. The Clerk has no authority to improvise these rules.

  ***

  # WORKED CASES

  **Case 1: The Zero-Seat Stratum**
  *   **Scenario:** Residents aged 18-24 comprise 4% of the Voter Roll. 4% of 50 seats = 2 seats. However, in Ward 3, this demographic comprises 0.8% of the roll. 0.8% of 50 = 0.4 seats.
  *   **Application:** Per Section 2 (Minimum Threshold), 0.4 rounds to zero. Ward 3 residents aged 18-24 receive **zero seats**.
  *   **Outcome:** The Clerk publishes the Demographic Gap Statement noting this exclusion. The City may prefer inclusivity, but the procedure allocates zero seats. To grant a seat would violate the proportional rule and require reducing another group's representation, which is a Value Judgment reserved for the Council.

  **Case 2: The Active Campaigner**
  *   **Scenario:** A drawn member is identified as a registered treasurer for the "No on Referendum" committee. Staff wish to remove her to ensure neutrality.
  *   **Application:** Per Section 5 (Scrutiny), a formal campaign role constitutes a Conflict of Interest regarding *Internal Office*, but not regarding *Membership*. The procedure does not permit removal of a general member for political activity.
  *   **Outcome:** She remains a member. She is ineligible to serve as Chair or Rapporteur. The City may prefer a "neutral" assembly, but the procedure treats political engagement as a characteristic to be mirrored, not a defect to be purged. Removing her would bias the assembly against the organized opposition.

  **Case 3: The Council Weighting Request**
  *   **Scenario:** The City Council directs the Clerk to "ensure at least 20% of the assembly are renters," knowing renters are under-represented on the Voter Roll.
  *   **Application:** Per Section 6 (Boundary of Authority), altering selection weights is a Value Judgment, not an administrative task. Per Section 3 (Correction Rule), weighting the draw converts the lot into an appointment.
  *   **Outcome:** The Clerk **refuses the request**. The procedure mandates a random draw from the available pool. To comply would corrupt the lottery's legitimacy and exceed the Clerk's authority. This decision is against the City's preference for a guaranteed outcome, but the procedure requires the Clerk to say "No" and refer the Council to a Charter amendment if they wish to change the selection method.

  ***

  # LIMITS AND HIDDEN JUDGMENTS

  **What This Procedure Cannot Do**
  1.  **Legitimacy of the Frame:** It cannot manufacture legitimacy for the exclusion of non-voters. The Demographic Gap Statement records this wound; it does not heal it.
  2.  **Deliberative Quality:** It cannot ensure the assembly will be wise, civil, or productive. It only ensures they were chosen fairly.
  3.  **Political Immunity:** It cannot prevent the Council from ignoring the report. The procedure secures the *input*, not the *outcome*.

  **Value Judgments Disguised as Rules**
  1.  **Stratification Variables (Section 2):** Choosing Age, Gender, and Ward implies these are the relevant divisions of the city. Excluding Income, Race, or Tenure status is a value judgment that these are either unavailable or less relevant, which may disadvantage specific groups.
  2.  **The Skew Threshold (Section 3):** Setting the deviation limit at 10% is arbitrary. A 5% threshold would make the assembly more representative but harder to fill; 15% would be easier but less mirror-like. This is a policy choice made by the Clerk.
  3.  **Conflict of Interest Definition (Section 5):** Defining "Campaign Role" as a veto for office but not membership privileges organizational affiliation over strong personal belief. This protects the lot but risks allowing highly biased members to deliberate.

  \answer{5.2 Member Scrutiny}
