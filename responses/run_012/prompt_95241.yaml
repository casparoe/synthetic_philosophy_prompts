  **The Scenario**

  A deterministic switch must be thrown. Option A subjects a single volunteer to "The Blight": a permanent, total loss of olfactory and gustatory function accompanied by chronic, low-grade nausea that renders all nutrition joyless and social dining agonizing, reducing their quality of life to a level comparable to solitary confinement. Option B subjects a population of $N$ distinct volunteers to "The Whiff": a sudden, unmistakable stench of rotting sulfur lasting exactly ten seconds, causing immediate gagging and disgust but leaving no physical residue, memory trauma, or alteration to their daily plans once it dissipates. No person appears in both groups, and there are no secondary social effects. To force the theoretical divergence, $N$ is stipulated at ten million, and the disutility of The Blight is calibrated at one million hedonic units, while The Whiff is calibrated at one unit per person.

  **1. Totalism**
  Totalism evaluates options solely by the sum of well-being or disutility across the population. In Option A, the total disutility is simply the harm to the single individual: 1,000,000 units. In Option B, the total disutility is the sum of the harms to each individual: $10,000,000 \text{ people} \times 1 \text{ unit} = 10,000,000$ units. Because Totalism is committed to minimizing the aggregate sum of harm, it compares 1,000,000 against 10,000,000 and selects Option A. The theory mandates inflicting the grave, life-ruining harm on the one person to prevent the massive accumulation of negligible harms across the many. The verdict follows strictly from the arithmetic of summation; because the sum of the whiffs exceeds the blight, the blight is the lesser evil.

  **2. Two Anti-Aggregating Theories**
  A **Threshold View** posits that harms below a certain magnitude of intensity make no moral claim that can be aggregated to outweigh a harm above that threshold. The Whiff (1 unit) falls below the threshold of moral significance for aggregation, while The Blight (1,000,000 units) is far above it. Consequently, the ten million whiffs count as zero in the calculus against the blight. This theory selects Option B to avoid the impermissible grave harm, disregarding the sheer number of negligible sufferers.

  A **Lexical Priority View** holds that the interests of the worst-off person take absolute precedence over the interests of the better-off. In Option A, the worst-off person is at a level of well-being drastically lower than anyone in Option B, where the worst-off person suffers only a momentary disgust. Because the gap in individual fate is lexically significant, no amount of improvement for the many (avoiding the whiffs) can justify worsening the position of the one (inflicting the blight). This theory also selects Option B.

  While both select Option B, their reasons differ. The Threshold View denies the *relevance* of the small harms entirely; they are morally invisible. The Lexical View acknowledges the small harms but denies them *sufficiency*; they count, but they cannot trump the absolute priority of the victim of The Blight.

  **3. Prioritarianism**
  Prioritarianism lies between these poles, distinguishing between a concave weighting function and a lexical constraint.
  *   **Concave Prioritarianism:** This version applies a weighting function to well-being such that benefits (or harm avoidances) for those at lower levels count for more. The single victim of The Blight is at a much lower absolute level of well-being than the whiff-sufferers. Thus, the 1,000,000 units of harm to the one are weighted heavily, while the 1 unit of harm to the many is weighted lightly. Depending on the steepness of the concave curve, this version might still select Option A if the population $N$ is large enough to overwhelm the weighting, or it might flip to Option B sooner than Totalism. Given the stipulated numbers, a moderate concave function might still yield Option A (as the sum is 10x larger), but it does so more reluctantly than Totalism.
  *   **Lexical Prioritarianism:** This version treats the priority of the worst-off as absolute, effectively collapsing into the Lexical Priority View described above. It selects Option B regardless of the population size.
  Thus, the two versions can land on different options: the concave version may track Totalism (Option A) under extreme population pressures, while the lexical version tracks the Anti-Aggregators (Option B).

  **4. The Single Feature and Its Removal**
  The single feature driving the disagreement is the **ratio of the total sum of negligible harms to the single grave harm**. The divergence exists only because the case is stipulated such that $\text{Sum}(\text{Negligible}) > \text{Grave}$. If this feature is removed by reducing the population $N$ so that Option B's total harm falls below Option A's (e.g., $N = 500,000$, making Total Harm B = 500,000 units), the verdicts converge. Totalism would now select Option B (minimizing the sum), and Anti-Aggregating theories would *still* select Option B (avoiding the grave harm). The disagreement about aggregation vanishes entirely. This demonstrates that the conflict is not about the *principle* of aggregation in the abstract, but specifically about whether a grave harm may be traded when the aggregate of small harms is sufficiently massive. When the aggregate is small, everyone agrees: do not inflict the grave harm.

  **5. Defense and Attack**
  A defender of Totalism, whose verdict (inflicting The Blight) is the most intuitively repugnant, would attack the case as gerrymandered. They would argue that the population size ($N=10,000,000$) is artificially inflated to force the sum to exceed the grave harm, creating a "tyranny of the multitude" that does not reflect realistic moral dilemmas. A non-gerrymandered choice of magnitudes would rely on natural distributions where such vast numbers of people are rarely at stake for such trivial sensory inputs.

  Furthermore, they might claim that at $N=10,000,000$, Option B is no longer the "cheap" option. Coordinating ten million people to suffer even a ten-second stench involves logistical burdens and collective anxiety that violate the "no unforeseen side effects" clause, potentially creating a social harm that exceeds The Blight naturally.

  Honesty requires admitting this weakens your thesis. If the disagreement *only* appears when the numbers are pushed to implausible extremes where the "negligible" harm begins to look like a collective catastrophe, then the intuition that "grave harms cannot be traded" is robust for all practical purposes. The theoretical divergence you highlight may be a artifact of boundary-pushing stipulations rather than a deep flaw in how we locate the crux of the debate. If the case only works when the "negligible" harms sum to something massive, then perhaps the debate *is* about aggregation, because it is the aggregation that turns the negligible into the significant.
