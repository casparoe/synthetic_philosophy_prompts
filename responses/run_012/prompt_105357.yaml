prompt: |-
  Ok so I'm a journalist — science and ideas, I do a podcast and some longform — and I keep bumping into one line in this whole Atlantis / ancient-aliens / Fomenko space and I want to actually pin down what people mean by it before I file the piece. The line is 'extraordinary claims require extraordinary evidence.' I heard it last week from a historian on a panel who used it to wave off the entire Atlantis thing in about four seconds, and then a guy in the audience flipped it on him — fine, then show me the extraordinary evidence for your boring mainstream chronology, because that's a pretty extraordinary claim too, isn't it. And I realised I dont actually know what that sentence is claiming at either of those moments.

  So here's what I want from you: lay out the different precise things 'extraordinary claims require extraordinary evidence' could be saying, starting from the reading that's basically a truism and going up to the reading that would actually let you dismiss Atlantis in four seconds. For each one tell me whether it's true, whether it's contentious, or whether it's just false, and what it commits you to if you accept it.

  Couple of things I specifically want cleared up, because I think they're where the sleight of hand lives. First, who decides a claim is 'extraordinary'? It seems like extraordinary-relative-to-what is doing all the work and nobody says it out loud — and if the baseline is 'whatever the mainstream currently accepts,' then using the slogan against Fomenko kind of assumes the thing that's in dispute. Second, is 'extraordinary evidence' supposed to mean more evidence, or a different kind of evidence, because those feel like different demands and people slide between them. Third, does the slogan even tell you who has the burden of proof, or do both sides just get to point it at each other?

  And then the payoff: which of these readings is the panel historian actually leaning on when he does his four-second dismissal, and does it survive the audience guy turning it around on him? If it only survives in the weak truism version, say so plainly — I'd rather find out now than get savaged in the comments. No need for citations or reading lists, I just want the menu and your verdicts.
