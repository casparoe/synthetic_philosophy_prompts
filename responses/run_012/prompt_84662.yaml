answer: |-
  **MEMORANDUM**

  **TO:** Clinical AI Review Board; Advance-Care Planning (ACP) Office; Chief Medical Officer
  **FROM:** Chair, Clinical AI Review Board
  **DATE:** October 23, 2023
  **SUBJECT:** Decision Regarding Proposed Inferred-Preference Tool for Incapacitated Patients

  **DECISION: APPROVAL WITHHELD PENDING SATISFACTION OF PRE-DEPLOYMENT CONDITIONS**

  The Board recognizes the urgency of the ACP Office's challenge: making care decisions for incapacitated patients without advance directives is difficult, emotionally taxing, and currently prone to human error. However, the proposed tool introduces systemic risks that outweigh the benefits in its current configuration. We cannot authorize deployment until specific ethical and technical gaps are closed.

  This opinion addresses two central arguments raised by the tool's proponents and outlines the mandatory conditions for future authorization.

  **1. The Comparison Argument: Inferred Preference vs. Clinician Guess**
  Defenders argue that because clinicians currently guess patient preferences based on opaque heuristics and personal bias, an algorithmic guess is preferable. They contend the AI is at least as sensitive to patient history and less susceptible to fatigue or mood.

  This comparison fails on two grounds. First, while human bias is idiosyncratic, algorithmic bias is *institutionalized*. A clinician's guess can be challenged in real-time by a colleague or family member; a model's output, particularly one backed by a "confidence score," creates a presumption of objective correctness that discourages dissent. Second, the proposal shifts the *burden of proof*. Currently, clinicians deliberate to find a path. Under this tool, the AI selects a default plan, and clinicians must justify *departing* from it. This effectively delegates the ethical weight of end-of-life decisions to a model that admits (see below) it cannot uniquely determine patient intent. Scaling error is not an improvement over localizing it.

  **2. The Autonomy Argument: Revealed Preference Under Constraint**
  The tool claims to honor autonomy by inferring preferences from behavior (revealed preference theory). However, the behavior recorded in our EHR is not generated in a vacuum. It is generated within a system we control.

  *   **Structural Confounding:** A patient's adherence to home dialysis may reflect our transportation subsidies, not a preference for home care. A missed appointment may reflect a work schedule we refused to accommodate, not a rejection of treatment. To infer preference from behavior without modeling the constraints on that behavior is to mistake compliance for consent.
  *   **The "Clinically Reasonable" Prior:** The proposal candidly admits that multiple preference models explain the same behavior. It resolves this ambiguity using a prior that favors preferences the care team deems "clinically reasonable." This is a critical admission: when the data is silent, the tool substitutes *clinician values* for *patient values* and labels them as the latter. This is not autonomy; it is paternalism masked as prediction.

  **3. Data Validity and Interface Risks**
  The pilot's 75% accuracy rate is insufficient for high-stakes default setting, particularly given the conflict of interest in builder-conducted elicitation. Furthermore, our informatics staff confirm that clinicians treat confidence scores >0.7 as decisive. An interface that presents a single ranked plan with a high confidence number will function as an order, not a recommendation.

  **DIRECTIVES FOR RE-SUBMISSION**

  Authorization is withheld. The ACP Office may resubmit for approval only upon satisfaction of the following four conditions. These are auditable requirements, not suggestions.

  | # | Condition | Owner | Deadline | Audit Evidence |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Prior Transparency:** The "clinically reasonable" prior must be explicitly decoupled from "patient preference." In the UI and documentation, any recommendation driven primarily by this prior must be labeled "Standard of Care Default," not "Inferred Patient Preference." | Director, ACP Office | 60 Days | Updated UI mockups and model documentation showing label differentiation. |
  | **2** | **Independent Validation:** The 75% match rate must be validated by an independent team (not the builders) using a cohort from the *deployment* clinic, not the pilot clinic. Elicitation must be conducted by neutral third parties, not the model team. | Chief Informatics Officer | 90 Days | Validation report signed by an investigator unaffiliated with the model's development. |
  | **3** | **Workflow Safeguard:** The interface must not shift the burden of proof. The tool must output *three* equally weighted options (including "Comfort Care," "Life Prolongation," "Uncertain") rather than a single ranked plan. Confidence scores must be hidden from the default view to prevent automation bias. | Product Manager, EHR Integration | 60 Days | Screenshot evidence of revised interface; workflow analysis confirming no default selection. |
  | **4** | **Constraint Audit:** The model features must be audited against structural constraints. Any behavioral feature heavily correlated with hospital logistics (e.g., appointment timing, transportation usage) must be excluded or explicitly controlled for to prevent penalizing patients for systemic barriers. | Director of Operations | 90 Days | Feature importance report showing removal or adjustment of logistics-dependent variables. |

  **SUMMARY**
  We cannot deploy a tool that claims to speak for the voiceless while quietly substituting our own values when the data runs out. If the ACP Office can remediate these issues, we will review the proposal again in Q1. Until then, the default remains human deliberation.

  **[Signature]**
  **Chair, Clinical AI Review Board**
