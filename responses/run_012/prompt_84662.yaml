  2.  **Deconstruct the Ethical & Technical Problems:**
      *   **The "Black Box" of Preference:** The model admits underdetermination (many preferences explain same behavior). It resolves this with a "clinically reasonable" prior. This is effectively imposing clinician values under the guise of patient autonomy.
      *   **The "Structured Behavior" Problem:** Patients don't act in a vacuum. They act within a system designed by the hospital. Missing an appointment might mean no transport, not a preference against care. Inferring preference from constrained behavior is risky.
      *   **The "Automation Bias" Problem:** Clinicians treat >0.7 confidence as decisive. This shifts the burden of proof to *departing* from the AI, effectively making the AI the decision-maker.
      *   **The "Comparison" Counter-Argument:** Defenders say "Clinicians guess anyway, and they are biased too." This is true, but institutionalizing the bias makes it harder to challenge. Also, AI scales error; human error is localized.
