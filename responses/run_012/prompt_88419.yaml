answer: |-
  **To:** Exhibit Team Lead
  **From:** [Your Name]
  **Subject:** The "Function" Decision Tool

  **The Honest Answer First**
  There is no single procedure that resolves "function" claims because the word answers two different questions.
  1.  **History:** Why did this trait evolve? (Did natural selection build it for this?)
  2.  **Job:** What does this trait do right now? (Does it contribute to the organism's survival today?)

  Sometimes the History and the Job match (e.g., a heart pumping blood). Sometimes they don't (e.g., goosebumps). If you write "The function of X is Y," visitors assume you mean **History**. If you mean **Job**, you must say so.

  Below is the tool. It forces you to pick a lane before you write. It takes 20 minutes. It contains three "Stop & Call" points where you must consult me or a curator because the answer is not factual, but interpretive.

  ***

  ### THE FUNCTION FILTER (For Label Writers)

  **Step 1: Pick Your Question**
  Look at your draft sentence: *"The function of [Trait] is to [Activity]."*
  Ask: **Am I explaining why this trait exists (History), or what it does today (Job)?**
  *   If **History**: Go to Track A.
  *   If **Job**: Go to Track B.
  *   *Judgment Call:* If you aren't sure, you are trying to hide a uncertainty. Pick one. If you can't, stop and call the curator.

  **Step 2: Run the Tests**

  **Track A: The History Test (Etiological)**
  *Use this if you want to say the trait evolved for this purpose.*
  1.  **Variation:** Did ancestors vary in this trait? (Yes/No/Unknown)
  2.  **Heritability:** Was that variation passed to offspring? (Yes/No/Unknown)
  3.  **Selection:** Did individuals with this trait leave *more* offspring specifically because of this activity? (Yes/No/Unknown)
  *   **Pass:** All three are "Yes" (supported by literature).
  *   **Fail:** Any are "No" or "Unknown."
  *   **Result:** If you Pass, you may write: *"This trait evolved to..."* If you Fail, you **cannot** claim this is the evolutionary function.

  **Track B: The Job Test (Causal-Role)**
  *Use this if you want to say the trait is currently useful.*
  1.  **Capacity:** Does the trait physically enable the activity right now? (Yes/No)
  2.  **Benefit:** Does that activity help the organism survive or reproduce *today*? (Yes/No/Debatable)
  *   **Pass:** Both are "Yes."
  *   **Fail:** Either is "No."
  *   **Result:** If you Pass, you may write: *"This trait allows the animal to..."* or *"Today, this is used for..."* **Do not use the word "Function."**

  **Step 3: The Verdict & Wording**

  *   **If Track A Passes:** "This trait evolved to [Activity]." (Strongest claim)
  *   **If Track A Fails but Track B Passes:** "This trait helps the animal [Activity]." (Weaker claim)
  *   **If Both Fail:** The trait is likely a byproduct or vestigial. Write: "This trait is a remnant of..." or "This trait results from..."
  *   **If Track A is "Unknown":** You must hedge. Write: "Scientists believe..." or "One theory is..." **(See Step 4)**

  **Step 4: The Hedge Check (Don't Lie)**
  *   **Genuine "We Don't Know":** Evidence is missing or conflicting.
      *   *Write:* "Scientists debate whether..."
  *   **Face-Saving Hedge:** You know the evidence is weak, but you want to sound authoritative.
      *   *Write:* Nothing. Change the claim to Track B (Job) or remove the sentence.
      *   *Judgment Call:* Distinguishing "debate" from "consensus" requires checking the primary literature. If you are relying on a textbook older than 10 years, assume "Unknown."

  **Step 5: Stop & Call (Hand-Off Points)**
  *   **Ecosystem Claims:** If your sentence is "The function of [Species] in the [Ecosystem] is...", **STOP.** This tool does not apply. Species do not have "functions" in the same way traits do. Call the philosopher.
  *   **Conflicting Evidence:** If Track A Test #3 (Selection) has two competing papers (e.g., sexual selection vs. feeding), **STOP.** This is a scientific dispute, not a label choice. Call the curator.
  *   **Value Judgments:** If "Benefit" (Track B, Test #2) depends on whether you value the organism's survival vs. the ecosystem's stability, **STOP.** Call the philosopher.

  ***

  ### TEST RUNS (Applied to Current Stuck Labels)

  **1. The Panda's "Thumb" (Radial Sesamoid)**
  *   **Draft:** "The function of the panda's extra wrist bone is to strip bamboo."
  *   **Track A (History):** Did selection build this bone *as a thumb*? **No.** It is a co-opted wrist bone. Selection acted on wrist flexibility, not thumb-grasping specifically. **FAIL.**
  *   **Track B (Job):** Does it strip bamboo now? **Yes.** Does that help survival? **Yes.** **PASS.**
  *   **Verdict:** The draft sentence is false under Track A (which visitors assume).
  *   **Required Rewrite:** "The panda uses an enlarged wrist bone to strip bamboo." (Remove "function," remove implication of evolutionary design).
  *   **Note:** This will feel like a downgrade to the team. It is necessary.

  **2. Human Goosebumps (Piloerection)**
  *   **Draft:** "The function of goosebumps is to keep us warm."
  *   **Track A (History):** Did ancestors leave more offspring because they got goosebumps? **Likely Yes** (fur insulation).
  *   **Track B (Job):** Does it keep *humans* warm today? **No.** We lack the fur density. **FAIL.**
  *   **Verdict:** Track A Pass (ancestral), Track B Fail (current).
  *   **Required Rewrite:** "Goosebumps once helped our furry ancestors stay warm. In humans, they are a vestigial reflex."
  *   **Note:** Do not claim current utility.

  **3. The Giraffe's Long Neck**
  *   **Draft:** "The function of the giraffe's long neck is to reach high foliage."
  *   **Track A (History):** Did selection build the neck *for* high foliage? **Unknown/Contested.** Strong evidence exists for "Necks for Sex" (combat) as the primary driver, with feeding as secondary. **FAIL/UNKNOWN.**
  *   **Track B (Job):** Does it reach high foliage now? **Yes.**
  *   **Verdict:** **HARD TRUTH.** The standard label is scientifically shaky. The "high foliage" story is the Job, not necessarily the History.
  *   **Required Rewrite:** "Giraffes use their long necks to reach high foliage, though scientists debate whether fighting or feeding drove the neck's evolution."
  *   **Note:** The exhibit team will hate this. It undermines the classic adaptation narrative. Print it anyway.

  ***

  ### LIMITATIONS & ECOSYSTEMS

  **What This Procedure Cannot Do**
  1.  **Ecosystem "Function":** You cannot use this machinery for "The function of prairie dogs in the grassland." Organisms have traits selected by history; species do not have traits selected by the ecosystem (unless you are arguing group selection, which is controversial).
      *   *Fix:* Change the noun. Use "**Role**," "**Impact**," or "**Contribution**."
      *   *Example:* "Prairie dogs *aerate* the soil" (Fact) vs. "The *function* of prairie dogs is to aerate soil" (Teleological claim requiring group selection justification).
      *   *Action:* If a writer submits an ecosystem function claim, reject it automatically and ask for a "Role" statement.
  2.  **Judgment Calls Dressed as Procedure:**
      *   **Track A, Test #3 (Selection):** Determining *why* a trait was selected is rarely settled fact. It is often a "just-so" story. If the literature is not unanimous, treat it as "Unknown."
      *   **Track B, Test #2 (Benefit):** "Helping survival" is sometimes obvious (claws for hunting) and sometimes speculative (coloration for mating). If the benefit is inferred rather than observed, flag it as a theory.

  **Final Instruction to Writers**
  If you cannot pass Track A or Track B, do not soften the sentence into mush. State the limitation. Visitors trust "We don't know" more than they trust "It might be."
