prompt: |-
  I'm a philosopher of biology by training, and for the last three years I've had a semi-official consulting arrangement with the exhibit team at a mid-sized natural history museum. They pulled me in originally because a label in the evolution hall said that the function of the panda's extra wrist bone was to strip bamboo, a visiting biologist wrote them a furious four-page letter about it, and it turned out that nobody on staff could say what would make that sentence true or false. Now I sit in on their label reviews maybe once a month, and the pattern never changes: a writer has a sentence of the form "the function of X is Y" — sometimes X is a trait, sometimes it's a whole species in an ecosystem ("the function of prairie dogs in the grassland is..."), which I keep telling them is a seperate conceptual animal and they keep not believing me — and the room can't decide whether the sentence is an overclaim, an underclaim, or perfectly fine, so it usually gets softened into mush by committee. They've finally asked me for something usable, and I'd rather hand them a real procedure than another lecture, so I'm asking you to write it.

  Here's what I need. A decision procedure that a label writer with no philosophy background can run on a draft sentence in about twenty minutes, one page, no jargon: the questions to ask in order (and why that order), what counts as a sufficient answer at each step, where the procedure stops and says no, and where it has to hand the decision to a person because the question is one of values or of editorial taste rather than fact. I want a short battery of concrete tests they can actually apply to a sentence — something like, does the trait currently contribute to some capacity of the organism, and is there reason to think it was selected for that contribution — since the two accounts of function (the etiological/selected-effect family and the causal-role family) give different verdicts on the same trait, and the procedure has to make that disagreement usable rather than hide it. It should also say what to do when the strong claim fails: what weaker sentence to print instead, and how to tell a genuine "we don't know" from a face-saving hedge. Then run it on three of their stuck labels: the panda's radial sesamoid, goosebumps in humans, and the giraffe's long neck (the current label implies the neck is for reaching high foliage, and there's a long-running dispute about that which I won't rehearse here). At least one of those should come out as an answer the exhibit team will hate, and you should say so rather than softening it. Finally, tell me what the procedure can't do, including whether the ecosystem-function sentences can really be handled by the same machinery with different nouns or whether that's a different problem wearing the same word. Please dont give me reading lists or citations — the writers won't use them, and half of them I couldn't check from the museum anyway.

  One more thing, and I mean this: if the honest answer is that there is no single procedure here, because the two accounts of function are answering different questions and any usable procedure has to begin by asking the writer which question they're asking, then say that plainly instead of pretending the two can be fused into one flowchart — and then still give me the best thing you can. And flag which of your steps are judgment calls dressed up as procedure, because the writers will follow your checklist literally and I'll be the one getting the letters.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Philosopher of biology, consulting for a natural history museum.
      *   **Problem:** Exhibit writers struggle with "function" claims (e.g., "The function of X is Y"). They get stuck between etiological (selected-effect) and causal-role accounts, leading to mushy labels. They need a concrete, usable decision procedure (20 mins, 1 page, no jargon).
      *   **Requirements:**
          *   Ordered questions with sufficient answers.
          *   Stop conditions (when to say "no").
          *   Hand-off points (values/taste vs. fact).
          *   Concrete tests distinguishing etiological vs. causal-role.
          *   Fallback options (weaker sentences, genuine "don't know" vs. hedge).
          *   Test run on three cases: Panda's wrist, Human goosebumps, Giraffe's neck.
          *   One result must be unpopular/hard truth (no softening).
          *   Limitations section (especially regarding ecosystem function).
          *   **Crucial Constraint:** If there is no single procedure because the accounts answer different questions, admit that plainly *first*, then provide the best possible tool. Flag judgment calls.
          *   **Negative Constraint:** No reading lists or citations.

  2.  **Deconstruct the Philosophical Core:**
      *   The core tension is between *Etiological Function* (Why is this trait here historically? Natural Selection) and *Causal-Role Function* (What does this trait do right now? System contribution).
      *   *Panda's Thumb:* Classic Gould example. It's a sesamoid bone. Causal role: strips bamboo. Etiological: It wasn't *selected* as a thumb; it's a co-opted wrist bone. Strict etiological view says "It has no function as a thumb," but causal view says "It functions to strip bamboo."
      *   *Goosebumps:* Causal role: traps heat (piloerection). Etiological: Selected for insulation/threat display in ancestors. Current utility in humans: Negligible/Vestigial.
      *   *Giraffe's Neck:* Causal role: reaches high leaves. Etiological: Debated (sexual selection vs. feeding vs. thermoregulation).
      *   *Ecosystem Function:* "Function of prairie dogs." This is arguably a category error in strict biological terms (traits of organisms vs. roles of species in a system). Needs separate handling.

  3.  **Address the "No Single Procedure" Constraint:**
      *   The prompt explicitly says: "if the honest answer is that there is no single procedure here... say that plainly instead of pretending the two can be fused."
      *   *Honest Answer:* There is no single procedure because "function" is ambiguous. A label claiming "The function is X" implies a specific metaphysical commitment.
      *   *Solution:* The procedure must start by forcing the writer to choose *which* question they are answering. The "flowchart" is actually a fork in the road.

  4.  **Drafting the Procedure (The "Best Thing You Can"):**
      *   *Goal:* 20 minutes, one page, no jargon.
      *   *Structure:*
          1.  **The Fork:** Choose "History" (Why is it here?) or "Job" (What does it do?).
          2.  **Track A (History/Etiological):** Tests for selection.
          3.  **Track B (Job/Causal-Role):** Tests for current contribution.
          4.  **The Verdict:** How to phrase the label based on the track.
          5.  **The Hedge:** How to admit uncertainty.
          6.  **The Hand-off:** When to call the philosopher.
      *   *Flagging Judgment Calls:* Need to explicitly mark where science ends and interpretation begins.

  5.  **Running the Test Cases:**
      *   *Panda's Wrist:*
          *   History: No (it's a co-opted bone).
          *   Job: Yes (strips bamboo).
          *   *Verdict:* If the museum wants "Function," they must mean "Job." If they mean "History," the label is false. *Hard Truth:* The standard label is likely false under the strict evolutionary definition visitors assume.
      *   *Goosebumps:*
          *   History: Yes (ancestral insulation).
          *   Job: No (doesn't really warm us now).
          *   *Verdict:* Vestigial. Label should reflect history, not current utility.
      *   *Giraffe's Neck:*
          *   History: Contested (Sexual selection vs. Feeding).
          *   Job: Yes (reaches leaves).
          *   *Verdict:* "Job" is safe. "History" is speculative. *Unpopular Result:* The standard "reaching high leaves" explanation is scientifically shaky as an *origin* story, even if true as a *current use*.

  6.  **Addressing Ecosystem Function:**
      *   This is distinct. Species don't have "functions" in the same way traits do unless you adopt a specific systems-view (Gaia-ish or functional ecology).
      *   *Advice:* Don't use the same machinery. Use "Role" or "Impact" instead of "Function."

  7.  **Refining the Tone:**
      *   Professional, direct, respectful of the user's expertise (no explaining the basics of philosophy of bio), but practical for the writers.
      *   Adhere to the "no jargon" rule for the *tool*, but I can use terms in the explanation to the user.
      *   Ensure the "Unpopular Result" is clear.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the impossibility of a unified theory.
      *   *The Tool:* "The Function Filter."
      *   *Step 1:* The Fork (Origin vs. Operation).
      *   *Step 2:* The Tests (Evidence for selection vs. Evidence for capacity).
      *   *Step 3:* The Wording (Matching the claim to the evidence).
      *   *Test Runs:* Be brutal on the Giraffe or Panda. Let's go with the Panda as the "Hard Truth" because it's the origin story of the user's consulting gig. Actually, the Giraffe is more contentious publicly. Let's make the Giraffe the hard truth because "feeding hypothesis" is the classic textbook example that is often challenged by the "necks-for-sex" hypothesis.
      *   *Ecosystem:* Clear distinction.
      *   *Limitations:* Flag the judgment calls.

  9.  **Review against Constraints:**
      *   20 mins/1 page feel? Yes, keep the tool concise.
      *   No jargon in the tool? Yes (use "History" vs "Job").
      *   No citations? Yes.
      *   Flag judgment calls? Yes.
      *   Unpopular result? Yes.
      *   Ecosystem distinction? Yes.

  10. **Final Polish:** Ensure the distinction between "We don't know" and "It's complicated" is clear. Make sure the "Hand-off" points are explicit. (Self-Correction: Make sure I don't accidentally solve the philosophical problem, but rather manage the communication of it.)

  *(Self-Correction during drafting)*: I need to be careful not to sound like I'm lecturing the philosopher. They know the theory. They need the *translation layer*. I will address the user directly, then provide the artifact they can hand to the writers.

  *(Decision on the "Unpopular Result")*: The Panda case is the origin story. The Giraffe case is the most public-facing controversy. I will flag the Giraffe label as the one they will hate, because it undermines the classic "evolutionary adaptation" narrative visitors love.

  *(Decision on Ecosystem)*: Be firm. "Function" for species in ecosystems is metaphorical. Don't let them use the same test.

  *(Final check on "No Single Procedure")*: I must state clearly at the top: "There is no single procedure." Then provide the tool that manages the split.

