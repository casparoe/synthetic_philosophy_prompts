      *   *Addressing Suspicion 2 (Reid's View):* Confirm it's a strawman. Reid argues for a *presumption*, not blind acceptance. It's defeasible.
      *   *Addressing Suspicion 3 (The Inference):* Confirm the logic is flawed. "Can't check" $\neq$ "Justified." That's the is-ought gap of epistemology.
      *   *The Verdict:* What survives? The historical sketch of Hume/Reid is passable. The modern implication is garbage.
      *   *The Rewrite:* Needs to capture the tension without the false resolution.

  4.  **Refining the "Committal" Stance:**
      *   *Don't say:* "Some philosophers think X, others think Y."
