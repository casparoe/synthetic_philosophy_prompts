  *   **Defense & History:** Here lies a significant error. The student claims **Szilárd (1929)** located the cost at erasure and **Bennett (1982)** argued for the measurement cost. This is historically backwards. Szilárd argued the cost was in the *measurement*; Bennett's specific contribution was shifting the cost to *erasure* using Landauer's principle. By attributing the "rival account" (measurement cost) to Bennett (the champion of the erasure account), the student's defense is confused. They are confidently asserting a falsehood. While the physical argument (erasure is irreversible, measurement can be reversible) is implied, the misattribution shows a lack of precise understanding of the literature, which is central to a course on the "exorcism" of the demon. (0/3 marks for this component).
