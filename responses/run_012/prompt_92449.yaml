answer: |-
  Your intuition is spot on: this argument is a sophisticated category error that "proves too much." If valid, it wouldn't just kill consequentialism; it would kill almost any normative theory that requires an agent to process information about the world (which is all of them).

  Here is the specific breakdown of where the argument fails, which step to reject, and what it costs you.

  ### The Verdict
  **You should reject the inference from (4) to (5).**

  The slide happens because your buddy is conflating two distinct concepts in moral philosophy: the **Criterion of Rightness** and the **Decision Procedure**.

  ### 1. Where the Slide Happens (The Philosophical Error)
  The argument relies on a hidden premise inserted between (1) and (5): *"For a moral theory to tell an agent what to do, the agent must be able to compute the theory's criterion in real-time."*

  *   **Criterion of Rightness:** What *makes* an action right (e.g., "maximizing good consequences").
  *   **Decision Procedure:** How an agent *figures out* what to do (e.g., "follow common sense heuristics," "consult your intuitions," "calculate expected utility").

  **Why Step (5) is false:**
  Consequentialism (specifically *Objective Act Consequentialism*) claims that the *rightness* of an act is determined by its actual consequences. It does **not** necessarily claim that the *agent* must calculate those consequences to be acting rightly.
  Most modern consequentialists adopt **Subjective Consequentialism** or **Expected Utility Consequentialism**. They argue the right action is the one that maximizes *expected* value given the information available to the agent.
  *   **The Fix:** You can keep (1) as the metaphysical standard of what *is* good, but modify the guidance claim. The theory tells you to "maximize expected utility given your bounded cognitive resources."
  *   **The Result:** The fact that you can't find the *global optimum* (Step 4) doesn't mean the theory can't tell you what to do (Step 5). It tells you to use the best *approximation* available. A map is still useful even if it isn't a 1:1 scale model of the territory.

  ### 2. The Complexity Nuance (The Technical Error)
  Even if you stick with Objective Consequentialism, Steps (2) and (3) contain a subtle technical overreach that a complexity theorist should appreciate.

  *   **Worst-Case vs. Average-Case:** NP-hardness is a statement about **worst-case** complexity. It means there *exist* problem instances that scale exponentially. It does not mean *all* instances (or even *most* moral dilemmas) are intractable. Moral life is not composed of adversarially constructed worst-case planning problems.
  *   **Approximation Algorithms:** NP-hard means no efficient *exact* solution. It does not rule out efficient *approximation* schemes. In AI planning, we solve PSPACE-complete problems all the time using heuristics (like A* search, Monte Carlo Tree Search). They don't guarantee perfection, but they guarantee "good enough."
  *   **The Cost:** If you accept this, you concede that consequentialism is a **satisficing** theory rather than a maximizing one in practice. You aren't required to find the *best* action, only a *good enough* action that clears a threshold of expected utility.

  ### 3. Why It "Proves Too Much" (Your Intuition)
  You suspected this argument would eat other moral theories. You are correct.
  *   **Deontology:** To know if "Do not lie" applies, I must predict if my statement is false and if it counts as a lie. Predicting truth-values and social categorizations is also a computational task subject to uncertainty and complexity.
  *   **Virtue Ethics:** To know if an action is "courageous," I must assess the context, the risk, and the mean between extremes. This requires situational modeling, which is also computationally expensive.

  If computational intractability invalidates a normative theory, then **no normative theory can guide action**, because *all* action guidance requires modeling a complex world with a finite brain. Since we *do* act, and we *do* feel guided, the premise that "intractability implies no guidance" (Step 6) must be false.

  ### 4. What Giving Up (5) Costs You
  If you reject the move from (4) to (5), you have to pay a philosophical price. You cannot hold the "God's Eye View" version of consequentialism.

  1.  **Loss of Certainty:** You must admit that humans never *know* with 100% certainty if they did the right thing. We can only say we acted rationally given our bounds.
  2.  **Shift to Expectations:** You move from "Maximize Actual Good" to "Maximize Expected Good." This opens you up to objections about luck (e.g., if I try to save a child but fail due to a freak accident, did I do the wrong thing?).
  3.  **Reliance on Heuristics:** You must concede that "common sense morality" (rules of thumb like "don't lie," "keep promises") are actually *part* of consequentialist deliberation because they are computationally efficient shortcuts to good outcomes. This makes consequentialism look suspiciously like Rule Consequentialism or even Deontology in practice.

  ### Summary for Your Seminar
  Tell your buddy this:
  > "You're conflating the **criterion of rightness** with the **decision procedure**. Consequentialism defines what *makes* an act right, not the algorithm required to find it. Step (5) fails because a theory can guide action via heuristics and expected utility without requiring omniscient calculation. Also, Step (6) proves too much: if intractability makes a theory worthless, then Deontology and Virtue Ethics are also worthless, since they all require intractable world-modeling. I'm keeping (4), but I'm rejecting the inference to (5) and adopting a Bounded Rationality Consequentialism."

  This keeps your physicalism (no hypercomputer) but saves the theory from computational nihilism.
