answer: |-
  You asked me to try to capture the deadlock between Elena and me in writing, to see if putting it down on paper reveals whether we are actually disagreeing or just shouting past one another in different dialects. So here is the conversation as best I can reconstruct it from our session last Tuesday. We were sitting in the back of the department lounge, staring at the whiteboard where she had drawn three stacked boxes labeled Physical, Design, and Intentional. She had brought up the example of a corporation, specifically a large tech firm, to test the hierarchy she has been developing around Dennett's real patterns.

  She started by tapping the bottom box. She said that if we describe the corporation physically, we are talking about the motions of employees, the flow of electricity through servers, the vibration of air in conference rooms. This description is cumbersome, obviously, but it is the ground floor. It is answerable to nothing but the system itself. There is no interpretation involved in saying a neuron fired or a server heated up; it just happened. Then she moved her marker to the middle box, the design stance. Here we talk about departments, supply chains, and organizational structure. We compress the physical noise into functional units. Finally, she tapped the top box. The intentional stance. We say the corporation wants to acquire a competitor, or believes the market will shift. She looked at me and said that on her view, all three are real patterns because all three earn their explanatory keep. They all compress data. But she insisted they are not equal.

  She argued that the hierarchy is strict. The physical stance is the most robust because it is the hardest to defeat. If you intervene on the system physically, you break the higher patterns first. If you fire the CEO or scramble the servers, the intentional pattern—the company's strategy—vanishes instantly. The design pattern might linger in the org chart for a week, but the physical facts just become different physical facts. She concluded that patterns come in degrees of reality. The intentional pattern is real only derivatively, the way a shadow is real. It rests on design-level facts, which rest on physical ones. She said she was proud of this because it saves realism without collapsing into reductionism. The shadow is real, she said, but it is not as real as the object casting it.

  I told her that this sounded like she was smuggling the physical stance back in as the arbiter of reality while pretending to be a pluralist. I said that the reason the intentional stance is worth taking is precisely that it is not reducible in practice to the level below. The fact that one could in principle predict the same behaviour from the physical stance given unlimited computation shows nothing about which patterns are real. It only shows that the universe is causally closed. I argued that if anything, the higher stance is the more real one, because it is the one that captures what the system is doing rather than merely what its parts are doing. When we say the corporation intends to merge, we are capturing a causal power that exists at that level of abstraction. If we dissolve that pattern into the motion of employees, we lose the object of explanation entirely.

  She conceded that we lose the explanation, but she pressed me on the ontology. She asked if I really thought the intention was as real as the silicon in the chips. She said that if degrees of reality are incoherent, then I must think the intention is real in the exact same way the silicon is real. But that cannot be right, she said, because the intention disappears if the silicon is rearranged, whereas the silicon does not disappear if the intention changes. The dependency is asymmetric. She argued that this asymmetry must map onto ontology. If pattern A depends on pattern B, but B does not depend on A, then B is more real than A. To say they are equally real is to ignore the grounding relation.

  I pushed back on the notion of grounding implying degrees of reality. I told her that dependency does not imply inferiority. A software program depends on hardware, but the bug that crashes the system is real at the software level. You cannot fix the bug by describing the electron flow. I said that compression licenses ontological commitment. If the intentional stance predicts behaviour better than the physical stance, then the intentional pattern is real. Full stop. There are no degrees. To say there are degrees is to say that the pattern is only partially real, which sounds like a way of saying it is ultimately an illusion. I asked her if she thought the shadow was an illusion. She said no, a shadow is a real absence of light. But I pointed out that we don't say the shadow is less real than the wall. We say they are different kinds of things. By insisting on a hierarchy of reality, she was treating reality as a single scalar quantity, like height or weight, when it should be treated as a binary status earned by explanatory utility.

  She paused there and admitted that talking about degrees of reality might be misleading. She suggested perhaps she meant degrees of fundamentality. But she held her ground on the dispensability argument. She said that even if I am right that compression licenses commitment, the physical stance retains a unique status because it is the only stance that is not dispensable in principle. We can imagine a world where we predict the corporation entirely by tracking employees and servers. We cannot imagine predicting the electrons by tracking the corporate strategy. Therefore, the physical description is the only one that is strictly necessary. The higher stances are convenient shortcuts, but they are shortcuts over terrain that exists independently of them.

  I told her that this appeal to principle was the idle wheel I feared. I said that unlimited computation is a metaphysical fantasy. In the actual world, the physical stance is dispensable in practice. No one predicts the stock price by tracking quarks. If reality is about what carves nature at its joints, then the joints are where the compression works. If the intentional stance carves out a predictive unit that the physical stance misses—not because the physics isn't there, but because the pattern is invisible at that resolution—then the intentional pattern is doing work the physical pattern cannot do. I argued that she was conflating causal closure with explanatory sufficiency. The physics determines the outcome, yes, but the pattern is what makes the outcome intelligible. Without the intentional stance, the corporation is just noise. With it, it is an agent. I asked her if noise can be an agent. She said no, but she insisted the agent is a pattern in the noise, not a thing added to it.

  That was where we circled back to the shadow. She said that acknowledging the pattern is in the noise is exactly what her hierarchy does. It says the pattern is real, but it is a pattern of the noise. Therefore, the noise is the substrate. I told her that calling it noise betrays her bias. From the intentional stance, the physics is the implementation detail, not the substrate. The substrate is the rationality. If the employees act irrationally, the corporate agent dissolves, even if the physics continues. So which is the substrate? She admitted that was a fair point. She conceded that robustness might not be the only metric for reality. If the intentional pattern is fragile but indispensable for prediction, then calling it derivatively real might undermine its utility. If we treat it as less real, we might be tempted to ignore it when it conflicts with the physical data, which would be a mistake.

  But she ended by asking me whether my flat realism could account for the asymmetry of intervention. If I break the servers, the company dies. If I change the company strategy, the servers keep humming. She said this causal asymmetry has to mean something ontological. I told her it means something causal, not ontological. It means the higher level supervenes on the lower, but supervenience does not entail that the supervenient properties are less real. Pain supervenes on C-fibers, but pain is not less real than C-fibers. To say it is, is to invite eliminativism. She said she wasn't an eliminativist, just a gradational realist. I told her that gradational realism is eliminativism in slow motion. It treats the higher levels as useful fictions rather than genuine constituents of the world.

  We left it there, with her insisting that without a hierarchy, we lose the structure of dependence, and me insisting that without flat reality, we lose the legitimacy of the special sciences. She thinks I am ignoring the ground floor; I think she is ignoring the building. I suspect the issue is that she sees compression as epistemic, a trick we use to manage ignorance, while I see compression as ontological, the very mechanism by which complex systems exist. Until we settle whether a pattern is a thing we find or a thing we make, I do not think we will move past the shadow metaphor. But writing this out, I see that she is more willing to concede on the language of degrees than I thought, provided she can keep the asymmetry of dependence. I am willing to concede the asymmetry, provided she drops the talk of degrees. Whether that is a compromise or just a verbal settlement is, I suppose, the next argument.
