      *   *Wait, if $W$ is identical, $W$ will do whatever $W$ does.* The question is: Does $W$ generalize like $R$ or $R^*$?
      *   *Misgeneralization:* Misgeneralization is when $W$ generalizes like $R^*$ (the proxy) when we wanted $R$ (the true intent).
      *   *The Friend's Claim:* "There's no fact of the matter."
      *   *The Rebuttal:* There *is* a fact of the matter about what $W$ does on new data. We just don't know it until we test. But once we test, one description is right and the other is wrong. Before testing, it's uncertain, not indeterminate.
      *   *Wait, the friend says:* "Nothing in the training run settles it." True. "So there's no fact of the matter." False. The fact of the matter is settled by the *architecture + weights*, which determine OOD behavior. The training run doesn't *reveal* it fully, but the *model* contains it.
