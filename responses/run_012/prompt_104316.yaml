prompt: |-
  ok so me and my buddy have been going at this for weeks and I need someone to settle it. The classic Williams setup, right, guy pulls his own wife out of the burning building instead of the stranger, and supposedly if he pauses to think "well she's my wife so I'm permitted to prefer her" that's one thought too many and it wrecks his integrity. Fine, we get the gist.

  But then we made up our own case to test it. A pediatric nurse, her own kid gets wheeled into the ER she's working, and she freezes — the thought that actually runs through her head is like "if I grab my kid first the other nurses will think I'm unprofessional, and I'll feel awful after, so..." and she literally can't move until she's settled whether it's allowed. And my buddy goes: see, thats exactly Williams's point, anytime you slot a justifying thought in between seeing what to do and doing it you're alienated from your own life, so the takeaway is you should never reflect on your reasons for helping the people you love, you just act.

  Here's my question though. If Williams showed that reflectively justifying your partial commitments is self-undermining, doesn't that mean the whole idea of being a morally thoughtful person — deliberating about whether your loyalties and attachments are actually worth what you give them — is just off the table? Like the more conscientious you get about your reasons, the more alienated you get? And if so, how am I supposed to square that with wanting to seriously think about whether I'm spending my life on the right people? Is the answer really just to never have the second thought, or am I missing something about what the objection is even aimed at?
