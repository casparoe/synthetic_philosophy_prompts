  # Diagnostic Decision Tree: Responses to Arrow's Impossibility Theorem

  **Starting Commitment:** Arrow's theorem is a valid proof. No rule aggregating the preferences of two or more voters over three or more alternatives can simultaneously satisfy unrestricted domain, weak Pareto, independence of irrelevant alternatives, and non-dictatorship.

  1. **When a society cannot rank three budget plans without violating one of Arrow's conditions, where is the failure located?**
      1.1 **In the *rules* we use to aggregate individual rankings.** (Procedural Focus) → Go to 2.
      1.2 **In the *idea* that a society can have a single ranking at all.** (Ontological Focus) → Go to 8.
      1.3 **In the *data* (ordinal rankings) or *constraints* we feed into the system.** (Informational/Normative Focus) → Go to 9.

  2. **Consider a jurisdiction whose voters' preferences over a single tax rate are single-peaked. Does this specific structure solve the general problem?**
      2.1 **Yes, real politics usually has this structure.** → **Leaf 1: Median Voter Theory.** (Domain Restriction — Empirical). *Awkward Commitment:* Assumes political conflict is always structurally simple and one-dimensional.
      2.2 **No, we need a rule that works even when preferences are weird, but we can change how preferences form.** → Go to 3.

  3. **If preferences are not fixed, can deliberation ensure they become coherent enough to vote on?**
      3.1 **Yes, talk aligns preferences to satisfy domain constraints.** → **Leaf 2: Deliberative Democracy.** (Domain Restriction — Normative). *Awkward Commitment:* Assumes rational discourse can eliminate deep value pluralism.
      3.2 **No, we must aggregate conflicting preferences as they are.** → Go to 4.

  4. **Consider a rule that ranks the alternatives by summing each voter's ranking position (Borda Count). It violates IIA but prevents dictatorship. Is this trade-off acceptable?**
      4.1 **Yes, preventing dictatorship is more important than IIA.** → **Leaf 3: Borda Count / Scoring Rules.** (Drop Independence of Irrelevant Alternatives). *Awkward Commitment:* Allows strategic manipulation by introducing irrelevant decoy alternatives.
      4.2 **No, IIA is necessary for consistency; we must change the output instead.** → Go to 5.

  5. **If we keep IIA and Unrestricted Domain, we cannot produce a full social ordering. Should we settle for picking a single winner instead?**
      5.1 **Yes, a decision procedure is enough; we don't need a full ranking.** → Go to 6.
      5.2 **No, without a full ranking, the decision is arbitrary.** → Go to 7.

  6. **How do we pick the winner without a consistent ordering?**
      6.1 **Accept that the winner depends on the order of voting (agenda).** → **Leaf 4: Cycle Acceptance / Agenda Power.** (Decision Procedure — Cycles). *Awkward Commitment:* Admits that outcomes are determined by procedural manipulation rather than voter will.
      6.2 **Use a lottery that selects one citizen at random and adopts that citizen's ranking.** → **Leaf 5: Random Dictatorship.** (Decision Procedure — Ex-Ante Fairness). *Awkward Commitment:* Grants absolute power to one individual, even if selected fairly by lot.

  7. **If a consistent ordering requires one person to decide, is that authority legitimate to avoid inconsistency?**
      7.1 **Yes, consistency requires a single sovereign will.** → **Leaf 6: Constitutional Dictatorship.** (Privileged Final Decider). *Awkward Commitment:* Explicitly abandons democratic equality to preserve logical coherence.
      7.2 **No, that violates democracy entirely.** → **Leaf 7: Democratic Pessimism.** (Negative Result on Collective Rationality). *Awkward Commitment:* Implies democratic outcomes are inherently arbitrary or irrational.

  8. **Does the theorem show democracy is flawed, or that the question is wrong?**
      8.1 **It shows democratic rationality is impossible.** → **Leaf 7: Democratic Pessimism.** (Negative Result on Collective Rationality). *Awkward Commitment:* Implies democratic outcomes are inherently arbitrary or irrational.
      8.2 **It shows 'social welfare' is a nonsense concept.** → **Leaf 8: Rikerian Skepticism.** (Reductio of the Question). *Awkward Commitment:* Undermines the normative mandate of any election victory or popular mandate.

  9. **The theorem assumes we only know ordinal rankings and no personal rights. Which assumption is false?**
      9.1 **We can measure and compare well-being intensity across people.** → **Leaf 9: Utilitarianism / Cardinal Utility.** (Reject Informational Assumptions). *Awkward Commitment:* Requires scientifically dubious comparisons of subjective happiness between persons.
      9.2 **Some personal choices are protected even against unanimous preference.** → **Leaf 10: Liberal Constraint.** (Block Outcomes Against Unanimity). *Awkward Commitment:* Can lead to Pareto-inefficient outcomes where everyone is worse off respecting rights.

  ***

  ### 1. Indistinguishable Leaves

  **Pair 1: Leaf 5 (Random Dictatorship) and Leaf 6 (Constitutional Dictatorship).**
  *   **Further Question:** "Must the identity of the decider be fixed prior to the vote, or can it be randomized?"
  *   **Diagnosis:** Substantive. Leaf 5 satisfies ex-ante equality (fairness of opportunity) while Leaf 6 satisfies ex-post consistency (stability of authority). They solve the impossibility differently: one by probabilistic fairness, the other by hierarchical order.

  **Pair 2: Leaf 7 (Democratic Pessimism) and Leaf 8 (Rikerian Skepticism).**
  *   **Further Question:** "Is the 'popular will' a real thing that fails to form, or a metaphor that should be discarded?"
  *   **Diagnosis:** Substantive. Pessimism mourns the loss of a coherent will (implying it *should* exist), while Skepticism argues the concept itself is incoherent (implying we *should not* expect it).

  ### 2. Empty Logical Space

  **Combination: Domain Restriction (Leaf 1/2) + Drop IIA (Leaf 3).**
  *   **Diagnosis:** Merely Unexplored / Redundant. There is no logical contradiction in holding both, but it is theoretically unmotivated. If preferences are restricted enough to avoid cycles (Domain Restriction), majority rule satisfies IIA. Dropping IIA as well adds complexity without gaining additional freedom.

  **Combination: Liberal Constraint (Leaf 10) + Constitutional Dictatorship (Leaf 6).**
  *   **Diagnosis:** Incoherent. The Liberal Constraint is defined by its ability to block outcomes even against a decider's preference (including a dictator's). Accepting a Privileged Final Decider who cannot be blocked contradicts the definition of the Liberal position.

  ### 3. Placement Justifications for Required Leaves

  1.  **Domain Restriction:** Placed at Node 2 because it questions the *input variety* (Unrestricted Domain) before questioning the *processing rule*.
  2.  **Drop IIA:** Placed at Node 4 because it accepts the inputs but challenges the *consistency constraint* on how inputs are processed.
  3.  **Reject Informational Assumptions:** Placed at Node 9 (separate trunk) because it challenges the *type of data* (ordinal vs. cardinal) rather than the aggregation logic itself.
  4.  **Block Outcomes (Rights):** Placed at Node 9 because it introduces a *normative constraint* external to the aggregation function, treating rights as informational boundaries.
  5.  **Privileged Final Decider:** Placed at Node 7 because it is the logical endpoint of demanding a full ordering while retaining IIA and Unrestricted Domain.
  6.  **Decision Procedure:** Placed at Node 5/6 because it abandons the requirement for a *complete ordering* (a condition of the theorem's setup) rather than an axiom.
  7.  **Negative Result:** Placed at Node 7/8 because it accepts the theorem's conclusion as a limit on *political reality* rather than a puzzle to be solved.
  8.  **Reductio:** Placed at Node 8 because it rejects the *coherence of the goal* (social ordering) rather than the means to achieve it.

  ### 4. Closing Paragraph: The Single Trunk

  This tree possesses a single trunk only in a formal sense: every position begins by accepting the mathematical validity of Arrow's proof. However, substantively, the trunk fractures at Node 1. Positions descending from 1.1 and 1.2 accept the *problem* (how to aggregate) and seek a solution, whereas positions descending from 1.3 and 1.2 (Leaf 8) effectively reject the *framework* (welfarism or collective agency) that makes the theorem a threat. Thus, while all branches grow from the seed of "Arrow is valid," the Skeptical and Informational branches survive by denying the soil in which the theorem was planted, while the Procedural branches survive by pruning the tree. They are united by the diagnosis, but divided on whether the patient can be saved.
