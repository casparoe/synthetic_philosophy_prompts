answer: |-
  **Brainstorming Positions**

  **Group A (Statistical/Individual):** Causation requires a mechanism. A bus route is a label, not a force. It cannot biologically impair learning. Claims must bottom out in individual traits (sleep, attendance) to avoid magical thinking. If we don't identify the mediator, we risk fixing the map instead of the problem (e.g., poverty).

  **Group B (Relational/Structural):** Structures constrain choices. The district drew the lines; the lines dictate time and access. A student's position in a system affects outcomes regardless of their traits. Ignoring this blames victims for institutional designs. Relational causes are real because changing the arrangement changes the outcome.

  ***

  **MEMORANDUM**

  **TO:** Data & Equity Committee
  **FROM:** Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Student Outcomes Report Causal Language

  **Recommendation**
  I move to approve the report conditional on amending causal language. We must describe the bus route as a "structural barrier associated with lower outcomes" rather than a direct cause, paired with a mandated mechanism study.

  **The Statistical Caution**
  We must acknowledge the statisticians' valid concern: a bus route is an inanimate label; it cannot biologically impair learning. If we claim the route *causes* failure without explaining how, we risk misallocating resources. Perhaps kids on the 7:10 route work night jobs or lack internet access. If we only fix the bus, we miss the root cause. Their insistence prevents us from treating correlations as magic spells. We must know *what* about the route matters (sleep loss? tardiness?) to fix it effectively. Demanding individual-level mechanisms ensures our solutions are precise rather than symbolic.

  **Structural Reality and Falsifiability**
  However, restricting causes only to individual traits ignores how institutions shape lives. The district created the route; therefore, the route is a district decision, not a natural fact. Relational causes are falsifiable: if we change the schedule and outcomes don't improve, the causal claim was false. We test structural claims through intervention, not just observation. Acknowledging structural contribution doesn't stop inquiry; it directs it toward leverage points the district actually controls. To say only individuals cause outcomes is to pretend the district's own planning has no effect on students.

  **Action Plan**
  1.  **Language Change:** Replace "Route 7:10 causes lower pass rates" with "Route 7:10 is a structural barrier associated with lower pass rates."
  2.  **Investigation:** Within 90 days, the data team must survey students on this route to identify mediators (e.g., arrival time, sleep hours).
  3.  **Intervention:** Within one semester, pilot an adjusted schedule for this route. Measure pass rates against a control group.

  **Conclusion**
  This approach respects statistical rigor while accepting institutional responsibility. We avoid blaming students for where they live while demanding evidence before claiming solutions. We treat the structure as a hypothesis to be tested, not a metaphysical truth.

  **Vote:** Yes, with amendments.
