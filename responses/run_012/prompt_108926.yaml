      *   *Section 2: The Relational Reality (Group B).* Why structures matter. Positions affect outcomes independent of traits.
      *   *Section 3: Falsifiability.* How to keep relational claims honest.
      *   *Section 4: Action Plan.* What the district should do.
      *   *Word Count Check:* Keep it tight.

  5.  **Refining the Argument (Philosophical Nuance):**
      *   Avoid "holism/individualism." Use "individual factors" vs. "structural conditions."
      *   The core philosophical move: Causation in social science isn't just about billiard balls hitting; it's about constraints and affordances. The bus route constrains time.
      *   Addressing falsifiability: A structural cause is falsifiable if an intervention targeting that structure fails to produce change.

  6.  **Drafting - Step-by-Step:**
