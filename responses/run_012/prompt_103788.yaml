      *   **Acknowledge sophistication:** This is impressive work for a high school student.
      *   **Diagnose the Core Tension:** The conflict between Case 5 (Visitor can ignore local 'scrum' norm) and Case 8 (Visitor must follow local 'jaywalk' norm), and the conflict between the User's Principle ("Must follow") and Case 5.
