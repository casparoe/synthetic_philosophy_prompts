  *   **What is imprecise/wrong:**
      *   **Cardinal Voting Claim:** The student writes: *"Since the proof depends only on the structure of preferences over outcomes, it also covers mechanisms where voters submit cardinal grades rather than rankings — score voting, for instance."*
      *   **Why this is a problem:** The Gibbard–Satterthwaite theorem is specifically defined for Social Choice *Functions* where the domain is profiles of *ordinal* rankings. If a mechanism allows voters to submit cardinal grades (e.g., 0–10 scores), the message space changes from $L(A)^n$ to $\mathbb{R}^{k \times n}$. While there *are* impossibility results for cardinal mechanisms without transfers, G-S *per se* does not cover them because the input space violates the theorem's assumptions. Score voting is indeed manipulable (via min-maxing), but citing G-S as the direct authority is technically incorrect.
      *   **How to get full credit:** To get the full 5 points here, the student should have clarified that while G-S is an ordinal theorem, *similar* impossibility results extend to cardinal contexts, or noted that cardinal mechanisms expand the message space and thus technically evade G-S assumptions even if they face other incentive problems.
