answer: |-
  Here is the translation of the collective intentionality literature into Multi-Agent Reinforcement Learning (MARL) machinery, followed by the residue report you asked for.

  ### Part 1: The Translation Layer

  **1. Searle: Non-Reductionist "We-Intentions"**
  *   **Philosophy:** "We-intend" is a primitive psychological state. It is not $I$-intend + $I$-believe-you-intend. The collective intention is in the head of each individual, but it is not reducible to individual intentions plus mutual belief.
  *   **MARL Mapping:** **Monolithic Joint Policy (Centralized Control).**
      *   You model the team as a single agent with multiple actuators. The policy $\Pi(a_1, ..., a_n | s)$ is atomic.
      *   There is no decomposition into $\pi_i$. The "we" is the architecture.
      *   *Decentralized Execution:* If you factorize this for execution (e.g., VDN, QMIX), Searle would say the factorization is merely an implementation detail, not an ontological reduction. The *source* of the intention remains the global value function $Q_{tot}$.

  **2. Bratman: Reductionist Shared Intention**
  *   **Philosophy:** Shared intention is a web of interlocking individual intentions. Key features: Mutual responsiveness, commitment to the joint activity, and meshing subplans. Requires common knowledge (or mutual belief).
  *   **MARL Mapping:** **CTDE with Explicit Communication.**
      *   **Individual Intentions:** Local policies $\pi_i(o_i, m_{-i})$.
      *   **Mutual Responsiveness:** The communication channel (message passing $m_{-i}$). Agents condition actions on predicted/communicated actions of others.
      *   **Meshing Subplans:** Convergence to a Coordination Equilibrium. The loss landscape ensures that local gradients align with the global gradient (no conflicting subgoals).
      *   **Common Knowledge:** Modeled via attention mechanisms or recurrent states that aggregate history, approximating the belief state over other agents' policies.

  **3. Gilbert: Joint Commitment & Plural Subject**
  *   **Philosophy:** A "plural subject" is formed via joint commitment. This creates normative obligations and entitlements. You cannot unilaterally rescind the commitment; you owe it to the others to persist.
  *   **MARL Mapping:** **Hard Constraints on Policy Updates / Parameter Locking.**
      *   Standard RL allows unilateral deviation if it increases expected return (reward hacking). Gilbertian commitment requires a mechanism that *forbids* deviation even if locally optimal.
      *   This maps to **Constrained MDPs (CMDPs)** where the constraint is "do not deviate from the agreed convention."
      *   Alternatively, **Parameter Sharing:** Agents share weights such that one cannot update without the others. The "binding" is architectural, not just incentivized.

  **4. Tuomela: We-Mode vs. I-Mode**
  *   **Philosophy:** **We-Mode:** Agents act as group members; the group's reason is their reason. **I-Mode:** Agents act privately, even if cooperatively (pro-social I-mode).
  *   **MARL Mapping:** **Objective Function Definition.**
      *   **We-Mode:** Optimizing $J = \mathbb{E}[\sum r_{global}]$. The agent's identity is defined by the team reward.
      *   **I-Mode:** Optimizing $J_i = \mathbb{E}[r_i + \alpha \sum_{j \neq i} r_j]$. Even if $\alpha$ is high (altruism), the optimization is still performed from the standpoint of the individual agent $i$.
      *   Tuomela argues these are distinct stances, not just points on a continuum of $\alpha$.

  **5. Team Reasoning (Sugden, Bacharach)**
  *   **Philosophy:** Agents transform the game. Instead of asking "What is my best response to you?", they ask "What is the best profile for us?" and then execute their part of that profile. Solves Hi-Lo and Prisoner's Dilemma without iteration.
  *   **MARL Mapping:** **Pareto-Optimal Equilibrium Selection.**
      *   Standard MARL (Nash Q-Learning) converges to Nash Equilibria (which can be suboptimal in cooperative settings with coordination failures).
      *   Team Reasoning is **Centralized Training** that explicitly optimizes for the Pareto-optimal joint action, bypassing the Nash constraint. It assumes the other agent is also team-reasoning (common knowledge of team-rationality).

  **6. Minimalists (Butterfill, Michael)**
  *   **Philosophy:** Joint action does not require shared intention or commitment. It requires only coordinated behavior driven by simpler cognitive states (e.g., goal attribution).
  *   **MARL Mapping:** **Zero-Shot Coordination / Implicit Coordination.**
      *   Agents trained independently that happen to coordinate at test time (e.g., collision avoidance).
      *   No shared reward, no communication protocol, no common knowledge. Just policies $\pi_i$ that have converged to a compatible manifold in the action space through environmental pressure alone.

  ---

  ### Part 2: The Residue Report

  Here is where the isomorphism breaks.

  **1. What Translates Cleanly**
  *   **Team Reasoning $\leftrightarrow$ Global Reward Optimization:** This is a near-perfect map. If you define the loss as the team return, the agents "team reason" in the functional sense.
  *   **Bratman $\leftrightarrow$ Communication Protocols:** Mutual responsiveness is literally the definition of an attention mechanism or message-passing layer. Meshing subplans are just gradient alignment.
  *   **Minimalism $\leftrightarrow$ Emergent Behavior:** MARL is excellent at showing you don't need complex cognitive architecture to get coordinated trajectories.

  **2. What Translates Only If You Cheat**
  *   **Searle's Primitive "We":** In MARL, if you have a joint policy, you usually have a central trainer. Searle insists the "we" is in the *individual's* head during execution. In MARL decentralized execution, the individual only has its local observation and weights. To make Searle work, you have to claim the local weights *encode* the global intention without access to the global state. This is the **Representational Gap**: Does the local neural activation *constitute* a we-intention, or is it just a compressed approximation of a central controller?
  *   **Tuomela's We-Mode:** In RL, We-Mode and Pro-Social I-Mode often converge to the same policy. Distinguishing them requires inspecting the *source* of the gradient, not just the trajectory. If the agent maximizes $R_{global}$, is it in We-Mode? Tuomela would say no, unless the agent *conceives* of itself as a group member. RL has no self-concept, only optimizers.

  **3. What Has No Counterpart (The Hard Residue)**
  *   **Normativity (Obligation):** This is the big one. In Gilbert's account, if you defect from a joint commitment, you violate an *obligation*. In MARL, if you defect, you simply **change the distribution**. There is no "violation," only "sub-optimality" or "non-stationarity."
      *   You can add a penalty for deviation, but that's just a cost, not a binding norm.
      *   You can lock parameters, but that's a physical constraint, not a normative one.
      *   **Residue:** RL has no vocabulary for "ought" that isn't reducible to "maximizes $J$."
  *   **Unilateral Rescission:** In philosophy, I cannot decide alone that we are no longer doing this together. In MARL, an agent can always go rogue (adversarial attack, reward hacking, distribution shift). There is no mechanism in standard RL that prevents an agent from "dissolving the plural subject" other than external enforcement.

  ---

  ### Part 3: The Two Questions

  **Q1: Is We-Mode reasoning a genuinely different mode of agency, or just optimizing a different objective function?**
  *   **MARL Verdict:** It is just a different objective function ($R_{team}$ vs $R_{ind}$).
  *   **Philosophical Pushback:** The philosophers argue that "mode" changes the *identity* of the agent, not just the loss landscape. In We-Mode, the *unit of agency* is the group. In RL, the unit of agency is always the process updating the weights. Even in CTDE, the execution is individual.
  *   **Synthesis:** Unless you implement a mechanism where the *update rule* itself is conditional on group status (e.g., "I only update if the group updates"), We-Mode in RL is functionally indistinguishable from Altruistic I-Mode. The "mode" is an interpretive layer you, the researcher, apply to the math. The math doesn't care.

  **Q2: Does any real notion of obligation or bindingness survive translation, or does everything collapse into incentive compatibility and equilibrium selection?**
  *   **Verdict:** It collapses.
  *   **Reasoning:** "Obligation" implies a reason for action that persists even when incentives shift. In RL, if the reward function changes (or the environment makes defection more profitable), the policy *must* change to remain optimal. An RL agent cannot "keep a promise" at a net cost to its objective function unless that promise was hard-coded as a constraint.
  *   **The Gap:** Philosophers treat obligation as **constitutive** of the joint action (you aren't acting jointly if you aren't obligated). RL treats commitment as **instrumental** (you commit because it helps convergence). If defection becomes the optimal strategy for the global reward (e.g., a singularity scenario), the RL agent defects. A Gilbertian plural subject arguably *cannot* defect without ceasing to exist as a plural subject.

  ---

  ### Part 4: Final Verdict

  **Is the gap due to your vocabulary being too thin, or the philosophers trading on something they haven't made clear?**

  It is **both**, but primarily a **Category Error**.

  1.  **Philosophers' Obscurity:** They often conflate *phenomenology* (what it feels like to act together) with *functionalism* (what mechanisms produce coordinated action). Searle and Tuomela are often describing the *experience* of agency. Your MARL setup describes the *causal mechanics* of action. You are building the engine; they are describing the driver's seat. When they say "primitive we-intention," they might mean "a cognitive primitive," which could map to a specific inductive bias in your neural net architecture that you haven't isolated yet.
  2.  **Your Vocabulary's Thinness:** Your framework lacks **Normative Primitives**. You have *rewards* (good/bad) and *constraints* (possible/impossible). You do not have *obligations* (binding/void).
      *   To close the gap, you would need to model **Social Norms** not as rewards, but as **update constraints**.
      *   Example: An agent is not allowed to update its policy in a direction that violates a "commitment vector" unless a "dissolution protocol" is triggered by the team.

  **Conclusion:**
  The philosophers are not trading on magic, but they are trading on **normativity**, which is currently external to the RL formalism. You can simulate the *behavior* of joint intention perfectly with CTDE and shared rewards. But you cannot simulate the *status* of joint intention (the bindingness, the entitlement to rebuke) because RL agents have no standing to rebuke each other—they only have gradients.

  If you want to capture the philosophy, stop looking at the **Policy** ($\pi$) and start looking at the **Update Rule** ($\nabla J$). The "We" isn't in the actions; it's in the constraint that prevents unilateral gradient descent. That's where the joint commitment lives.
