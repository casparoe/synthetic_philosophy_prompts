      *   *The Skeptical Challenge:* No fact about an individual (past behavior, mental states, dispositions) determines which rule they are following. Any finite sequence of actions is compatible with multiple rules (e.g., Plus vs. Quus).
      *   *The Skeptical Solution:* Meaning isn't a fact *inside* the head. It's constituted by assertibility conditions within a community. We judge someone as following a rule based on whether their actions align with the community's practices.
      *   *Normativity:* Meaning is normative. If I mean "plus," I *ought* to answer "125" to "68+57", not just that I *will*.
      *   *Blindness:* At the bedrock, I just act. I run out of justifications.

  3.  **Translation Strategy (Programmer Vocabulary):**
      *   *Rule:* Function/Algorithm/Implementation.
      *   *Meaning:* Specification/Intent.
      *   *Past Behavior:* Test Suite/Logs/Execution History.
      *   *The "Quus" Problem:* Overfitting. A model/code that passes all existing tests but fails on new inputs.
      *   *The "Fact" of Meaning:* The Spec. But the Kripkenstein point is the Spec is just more text/code (finite).
      *   *Community:* The Ecosystem/Standard Body/Other Implementations.
