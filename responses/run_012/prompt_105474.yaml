prompt: |-
  I write code for a living, no philosophy training at all, but I got into an argument at a bar about whether a program can really mean anything, and someone told me to go look up Kripkenstein and the rule-following problem (I think it's Kripke reading Wittgenstein, or maybe the other way round, I genuinely dont know). Here's the part I think I understood — tell me if I've mangled it.

  The setup: every rule I follow has only ever been applied to a finite number of cases, and those cases are compatible with a million different rules that agree on all of them and then split apart later. Like, I've added small numbers my whole life and always got the answer that matches ordinary addition, but nothing in my past behavior or my brain rules out that I was actually following a rule that matches addition on everything I've ever done and then spits out 5 on the next sum I attempt. So what fact about me makes it true that I meant addition and not that other thing? And if there's no such fact, then theres no fact of the matter about whether I'm using the word right at all, and the whole idea of meaning something by a rule collapses. I think the escape hatch has something to do with other people, a community agreeing on how to go on, and something about the practice being blind — you just do it, you can't justify it — but I'm fuzzy on that bit.

  Now restate this whole thing in the vocabulary I actually use. Concretely: specs and reference implementations, unit tests and property-based tests, fuzzing, conformance suites, overfitting, the difference between a functions interface/type and its behavior, the difference between the code and what the code is supposed to do, bug-for-bug compatibility when you reimplement someone elses runtime (you know, when people reimplement a language or a game engine and have to copy the original's bugs and undefined behavior exactly or nothing works), interpreters vs compilers, and the fact that a test suite is a finite pile of samples that any number of different implementations can pass.

  Do it faithfully — dont quietly swap in the SE assumption that there's a spec somewhere that settles what the function really is, because I'm pretty sure the whole point is that the spec is just more of the same finite stuff. Then the residue report, which is the part I actually care about: what survives the translation cleanly, what I have to distort to make it fit, and what in the original has no counterpart in my world at all. Specifically I want to know whether the normativity bit — that a rule tells you what you ought to do, not just what you will do — is expressible in my vocabulary at all, or whether thats just not a thing in code. And when the philosophers bring in the community, is that like everyone agreeing to run the same conformance suite, or is that a bad analogy that loses something important? Finally, if theres a chunk of the original argument I literally cannot state as a claim about programs and their behavior, tell me whether thats because my vocabulary is missing something or because the philosophers are trading on something they havent pinned down either.
