      *   *Refining the "Bug-for-Bug" analogy:* This is crucial. If I reimplement Python in Rust, I have to match CPython's bugs. Why? Because the "meaning" of Python is defined by what CPython *does*, not what the docs say. But even CPython's behavior is finite.
      *   *Refining Normativity:* In code, "ought" is usually "will crash" or "type error". But Kripke means "ought" in a semantic sense. If I write `x = 1 + 1`, I *ought* to get 2. If I get 3, the hardware is broken, or I'm not doing addition.

