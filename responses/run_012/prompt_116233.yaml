      *   *Recommendation:* The user's intuition is actually a hybrid. I should validate that the "Notch" is a feature, not a bug, of human moral cognition, even if it's logically messy. But since they asked for a principle, I need to force a choice.
      *   *Decision:* I will argue that **Weighted Utilitarianism with a Soft Cap** is the most robust engineering solution, even if it violates the "absolute veto" intuition. OR, I will argue that **Lexical Threshold** is the only one that respects the "Torture" intuition, and the Notch is a price you pay.
