prompt: |-
  ok so i've been binging philosophy-of-science podcasts on my commute and i've landed on a view i mostly like, but i have a nagging feeling i'm contradicting myself somewhere and i can't tell where. i have no philosophy training, so go easy on the jargon, but don't dumb it down either. here's the package:

  (1) Laws of nature don't push anything around. There's no extra "oomph" in the universe that makes things obey the laws. A law is just the shortest, most useful summary of the particular facts about what actually happens — if you had the complete list of every event, past present and future, the laws wouldn't add a single new fact, they'd just be the most compact way of writing the list down.

  (2) I'm a physicalist in the strong sense: fix every physical fact and you've fixed everything. There's no leftover fact about biology, or psychology, or what a person means, that floats free of the physical facts.

  (3) But I also think radioactive decay is genuinely chancy. When an atom decays at this moment rather than a second later, that's a real matter of objective probability, not just me not knowing which way it would go. The world itself is indeterministic down there.

  (4) And I think causation is real. When the cue ball knocks the eight ball into the pocket, the hit really did produce the roll — it's not just that one event reliably follows another, and it's not just that i've gotten used to expecting it. There's a real because there.

  (5) Also, I think there are real facts about how things could have gone differently. "If the mass had been bigger, the orbit would have been wider" is true, and it's true even in cases that never actually happen. So there's a fact of the matter about counterfactuals, not just about what did happen.

  So here's what i want: which of these actually clash, which only look like they clash but really don't, and what's the cheapest way to make the whole thing consistent? If i have to give something up, tell me what and what it costs me. And please rank the conflicts by how bad they are instead of just saying everything is in tension with everything. If some of them are fine together, say so plainly — i'd rather have three things cleared and one real problem than a vague warning that i've definately got a contradiction in here somewhere.
