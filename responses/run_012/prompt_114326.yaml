prompt: |-
  I have been trying to set out, in a form I can actually examine, what the law of armed conflict assumes about why killing is wrong, and the assumptions it seems to need will not sit together. The same legal order that treats intentional killing as the gravest of crimes licenses a soldier to shoot an enemy soldier on sight; forbids him to shoot that same man once he has been captured or lies wounded; and forbids torturing him under any circumstances, including circumstances in which killing others to save lives would be permitted. The soldier who kills under authorization is not a murderer even if the war he is fighting is itself unlawful, while he is a murderer if he kills without authorization or kills someone who is not a lawful target. And the highest honors the institution confers are ordinarily justified by the risk the recipient accepted rather than by the number of enemy dead; medics and stretcher-bearers have received them without firing a shot.

  What view of the wrongness of killing does this pattern presuppose? Does it presuppose that killing is wrong in itself and is made permissible by authority, so that the operative question is who may do it rather than what is done to whom? Or does it presuppose that the wrongness turns on the liability of the person killed, with the codified rules serving only as a rough working proxy for a liability no one can assess in the field? Can both readings license the practice, leaving it philosophically underdetermined between them, or is one strictly required and the other merely compatible with it? Where the pattern is not underdetermined but strained, say so plainly: why should liability to be killed lapse at the moment of capture while liability to be tortured never arises at all, and why should the lawfulness of the war be irrelevant to the guilt of the man who fights it?

  I am drawn to pacifism and want to know exactly what I would be denying. Tell me which parts of the practice presuppose that killing is sometimes permissible, which parts could survive a pacifist reading of them, and what would have to change if liability rather than authorization were made the governing idea.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Task:** The user is asking for a philosophical and legal analysis of the Law of Armed Conflict (LOAC) / International Humanitarian Law (IHL). Specifically, they want to understand the underlying moral assumptions about *why killing is wrong* within this legal framework.
      *   **Key Tensions Identified by User:**
          *   Killing is a grave crime vs. licensed for soldiers.
          *   Killing allowed on sight vs. forbidden once captured/wounded.
          *   Torture forbidden absolutely vs. killing sometimes allowed to save lives (necessity).
          *   Soldier not a murderer even in unlawful war vs. murderer if killing without authorization/non-target.
          *   Honors based on risk, not body count.
      *   **Specific Questions to Answer:**
          *   What view of the wrongness of killing does this pattern presuppose? (Authority vs. Liability).
          *   Can both readings license the practice, or is one required?
          *   Where is the pattern strained? (Capture vs. Torture, Unlawful War vs. Individual Guilt).
          *   Pacifist Angle: What parts presuppose killing is permissible? What parts could survive pacifism? What changes if liability governs instead of authorization?
      *   **Tone/Style:** Analytical, precise, philosophical, acknowledging the tension/strain the user feels. The user is intellectually sophisticated (likely a philosopher, legal scholar, or deep thinker on ethics).

  2.  **Deconstruct the LOAC/IHL Moral Architecture:**
      *   *The "Orthodox" View (Michael Walzer's *Just and Unjust Wars*):* This is the dominant framework. It relies on the "Moral Equality of Combatants." Soldiers on both sides have equal right to kill each other, regardless of the *jus ad bellum* (justice of the war).
      *   *The "Revisionist" View (Jeff McMahan, etc.):* Challenges the Moral Equality of Combatants. Argues liability depends on moral responsibility for an unjust threat.
      *   *The "Legalist/Positivist" View:* The law is a pragmatic convention to limit suffering, not necessarily a perfect mirror of moral truth.

  3.  **Address the Specific Questions:**

      *   **Q1: Authority vs. Liability?**
          *   *Authority:* The state grants the license. This fits the "unlawful war" point (soldier isn't a murderer even if the war is).
          *   *Liability:* The enemy soldier is a threat. This fits the "on sight" vs. "captured" distinction (captured = no longer a threat).
          *   *Synthesis:* LOAC actually mixes them. It uses *status* (combatant vs. civilian) as a proxy for liability, but validates that status through *authority* (uniforms, chain of command).
          *   *Strain:* The user identifies this well. If it were pure liability, unjust aggressors shouldn't have the right to kill. If it were pure authority, torture might be authorized by the state.

      *   **Q2: Where is the pattern strained?**
          *   *Capture:* Liability theory explains this easily (threat removed). Authority theory struggles slightly (why does the state's license expire?), but can argue the contract changes.
          *   *Torture:* Absolute prohibition suggests a deontological constraint on *means*, regardless of *ends* (saving lives). Killing is consequentialist/utilitarian in war (military necessity), but torture is deontological. This is a major philosophical friction point.
          *   *Unlawful War:* This is the biggest strain for Liability Theory. If I fight for an unjust cause, am I morally liable to be killed? LOAC says yes (enemy can kill me). Revisionists say no. LOAC prioritizes order/reciprocity over deep moral truth.

      *   **Q3: Pacifist Analysis:**
          *   *What must be denied:* The core premise that *any* intentional killing of humans by humans is permissible.
          *   *What could survive:* The protections for POWs, the ban on torture, the distinction between combatants and civilians (reinterpreted as aggressors vs. innocents), the honoring of risk/self-sacrifice (medics).
          *   *Liability vs. Authorization:* If Liability governed, the "Moral Equality of Combatants" collapses. Unjust combatants would be murderers. Just combatants would be police-like. This moves closer to a "Just War" policing model, which some pacifists might find slightly less objectionable than "state license," but still involves killing.

  4.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the profundity of the question. Validate the user's observation that the LOAC is a patchwork of conflicting moral theories.
      *   *Section 1: The Two Competing Logics (Authority vs. Liability).*
          *   Define the "State Authority" model (Positivist/Walzerian). Killing is a sovereign prerogative.
          *   Define the "Individual Liability" model (Revisionist/McMahan). Killing is permissible only against those who make themselves liable.
          *   *Verdict:* LOAC is primarily *Authority*-based with *Liability* used as a pragmatic constraint.
      *   *Section 2: Addressing the Strains.*
          *   *Capture:* Liability explains this best (threat neutralized). Authority explains it as a change in status.
          *   *Torture:* This is the deontological anchor. It admits no "military necessity." This contradicts the utilitarian logic of killing. *Crucial Point:* LOAC treats killing as instrumental, torture as intrinsic evil.
          *   *Unlawful War:* This is the "Moral Equality of Combatants." LOAC explicitly rejects moral liability here for the sake of regulation. This is the hardest pill for a moral philosopher to swallow.
      *   *Section 3: The Pacifist Perspective.*
          *   *What to deny:* The permissibility of *jus in bello* killing.
          *   *What survives:* The humanitarian protections (Common Article 3), the distinction (civilians shouldn't die), the valor of sacrifice (medics).
          *   *Liability Shift:* If Liability ruled, unjust soldiers lose protection. This makes war *more* violent potentially (no quarter for the "bad guys"), or it makes it a police action.
      *   *Conclusion:* Summarize the tension. The LOAC is a *modus vivendi*, not a moral truth.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say LOAC *is* moral philosophy. It's law. But the user asks what it *presupposes*.
      *   *Nuance:* The user asks about the "risk vs. body count" honor system. This suggests a virtue ethics component (courage/self-sacrifice) distinct from the permissibility of killing. I should include that.
      *   *Torture vs. Killing:* The user notes killing to save lives is permitted (necessity/self-defense logic), but torture is not. I need to highlight that LOAC treats torture as *malum in se* (wrong in itself) whereas combat killing is *malum prohibitum* (wrong because prohibited, unless authorized).
      *   *Pacifism:* Distinguish between Contingent Pacifism (this war is wrong) and Absolute Pacifism (killing is always wrong). The user seems to lean Absolute or near-Absolute.

  6.  **Final Polish:** Check against the user's specific constraints.
      *   "Where the pattern is not underdetermined but strained, say so plainly." -> I need to be direct here.
      *   "Tell me which parts... presuppose killing is sometimes permissible." -> List them.
      *   "What would have to change if liability rather than authorization were made the governing idea." -> Explain the collapse of Moral Equality of Combatants.

  7.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  You have identified the central fracture in the moral architecture of the Law of Armed Conflict (LOAC), often called International Humanitarian Law (IHL). The law is not a seamless derivation from a single moral premise. It is a *modus vivendi*—a pragmatic compromise between competing moral theories, designed more to regulate the horror of war than to resolve its philosophical contradictions.

  Here is an examination of the assumptions, the strains, and the implications for a pacifist critique.

  ### 1. Authority vs. Liability: What the Pattern Presupposes

  You ask whether the law presupposes that killing is wrong in itself (made permissible by authority) or that wrongness turns on liability. The uncomfortable truth is that LOAC relies on **Authority** for the *permission* to kill, but relies on **Liability** (crudely approximated) for the *limits* of killing.

  **The Authority Model (The Dominant Logic)**
  The core tenet of LOAC is the **Moral Equality of Combatants**. A soldier fighting an aggressive, unlawful war has the same legal right to kill an enemy soldier as the defender does.
  *   **Presupposition:** This presupposes the **Authority** view. The individual soldier is an instrument of the state. The moral burden of the killing rests on the sovereign (*jus ad bellum*), not the agent (*jus in bello*).
  *   **Why:** If liability were the governing principle, soldiers fighting an unjust war would be murderers, and soldiers fighting a just war would be police officers. LOAC explicitly rejects this because it makes regulation impossible. You cannot expect soldiers to adjudicate the justice of their cause in the fog of war.
  *   **Conclusion:** The pattern presupposes that killing is a sovereign prerogative. The soldier is not a moral agent regarding the *fact* of killing, only regarding the *manner*.

  **The Liability Model (The Constraint Logic)**
  However, the rules on *who* may be killed and *when* track loosely with liability.
  *   **Presupposition:** Combatants are liable to be attacked because they pose a threat; civilians are not liable because they do not.
  *   **The Strain:** This is where the logic frays. If liability were the true ground, a wounded or captured soldier (who poses no threat) would immediately lose liability. LOAC agrees they cannot be killed, but it does not frame this as "liability lapsing"; it frames it as "status changing." More critically, if liability were the ground, an *unjust* combatant would not be liable to be killed by a *just* combatant (a point argued by revisionist philosophers like Jeff McMahan). LOAC ignores this. It treats the unjust combatant as liable to be killed solely because they wear a uniform, not because they are morally responsible for an unjust threat.

  **Verdict:** The practice is **not underdetermined**. It strictly requires the **Authority** reading to function as a legal order. It cannot survive on Liability alone, because Liability would delegitimize half the battlefield (the aggressors), causing them to reject the laws entirely. The system sacrifices moral coherence (regarding *why* we kill) for regulatory efficacy (regarding *how* we kill).

  ### 2. Where the Pattern is Strained

  You asked to identify where the pattern is strained rather than merely underdetermined. There are two critical points of failure.

  **A. The Torture vs. Killing Asymmetry**
  *   **The Strain:** You note that killing is permitted to save lives (military necessity/self-defense), but torture is forbidden absolutely, even to save lives (the "ticking time bomb" scenario is legally irrelevant).
  *   **Why it strains:** If the justification for killing is the *consequentialist* one of "military necessity" (we kill them to win/protect our side), then torture should theoretically be permissible under extreme necessity. The fact that it is not reveals that LOAC treats torture as *malum in se* (evil in itself) while treating combat killing as *malum prohibitum* (wrong only because prohibited, unless authorized).
  *   **The Implication:** The law admits that there is something intrinsic to the *humanity* of the enemy that torture violates, which killing does not. This is philosophically difficult to sustain. If a person has a right to life strong enough to forbid torture, how can that right be suspended for a rifle bullet? The law answers: "Status." The bullet is authorized by status; the torture is not authorized by anything. This is a legal fiction, not a moral truth.

  **B. The Lapse of Liability at Capture**
  *   **The Strain:** Why does liability to be killed lapse at capture, but liability to be tortured *never* arise?
  *   **The Explanation:** Liability to be killed is based on **functional threat**. Once captured, the functional threat is neutralized. Liability to be tortured, however, is not based on threat; it is based on **human dignity**.
  *   **The Strain:** This reveals that LOAC is not actually a unified theory of violence. It is a hybrid. It uses a utilitarian logic for killing (remove threats) and a deontological logic for torture (respect dignity). The strain lies in the fact that the same human being is subject to two different moral frameworks simultaneously depending on the weapon used against them.

  ### 3. The Pacifist Analysis: What You Would Be Denying

  If you are drawn to pacifism, you need to know exactly which pillars of the current order you must dismantle.

  **What Presupposes Killing is Permissible (Must be Denied)**
  1.  **Combatant Privilege:** The legal immunity granted to soldiers for acts of violence that would be crimes in peacetime. Pacifism denies that state authorization can cleanse the moral stain of killing.
  2.  **Military Necessity:** The principle that death is a permissible currency to purchase strategic advantage. Pacifism denies that human life can be traded for territory, policy, or even national security.
  3.  **The Moral Equality of Combatants:** The idea that the aggressor and the defender have an equal right to kill. A pacifist might agree they are *equally wrong*, but LOAC says they are *equally permitted*. Pacifism denies the permission.

  **What Could Survive a Pacifist Reading**
  1.  **Distinction (Civilian Immunity):** The principle that those not directly participating in hostilities should not be targeted. Pacifism can embrace this fully, expanding the category of "non-participants" to include almost everyone.
  2.  **Prohibition on Torture and Cruel Treatment:** This requires no change. It aligns perfectly with a pacifist respect for bodily integrity.
  3.  **Protection of POWs and the Wounded:** The duty of care for those rendered helpless is compatible with pacifism. It treats the enemy as a patient rather than a target.
  4.  **Honors for Risk/Sacrifice:** You noted medics receive honors without killing. This presupposes that **courage and self-sacrifice** are virtues independent of violence. A pacifist order could still honor those who risk their lives to save others (combatants or civilians) without honoring those who take lives.

  **What Changes if Liability Replaces Authorization?**
  If you shift the governing idea from State Authority to Individual Liability (the Revisionist view), the system changes drastically, but it does not necessarily become more pacifist.

  1.  **Collapse of Equality:** Unjust combatants lose their immunity. They become liable to be killed *and* potentially prosecuted for the mere act of fighting. Just combatants become law-enforcement agents.
  2.  **Increased Violence?** Paradoxically, a liability-based system might lead to *less* restraint. If the enemy is fighting unjustly, they are "criminals" or "liable aggressors." Historically, we tend to show less mercy to criminals than to honorable enemy soldiers. The "privilege of belligerency" (you can't be tried for killing) encourages compliance with LOAC. Remove it, and unjust fighters have no incentive to follow the rules.
  3.  **The Pacifist Advantage:** However, for a pacifist, this shift exposes the lie. It forces the admission that most wars involve mass killing of people who are not personally morally liable for the conflict (conscripts, misinformed citizens). It highlights that "State Authority" is a shield used to protect killers from moral scrutiny.

  ### Summary for the Pacifist Inquirer

  The Law of Armed Conflict does not rest on the premise that killing is morally good, nor even that it is morally neutral. It rests on the premise that **killing is inevitable, and therefore must be regulated by status rather than morality.**

  *   **To be a pacifist is to deny:** That the State has the moral capacity to authorize killing. It is to assert that the "license" is a legal fiction that does not alter the metaphysical reality of taking a life.
  *   **The Strain you feel:** Is the friction between the law's **humanitarian aims** (protect the vulnerable, limit suffering) and its **violent means** (licensing mass death).
  *   **The Liability Shift:** If you make liability the governing idea, you strip the State of its moral shield. This aligns closer to pacifism in theory (individuals are responsible for their violence), but in practice, it risks turning war into a crusade against "liable" enemies, potentially eroding the protections for the captured that you rightly value.

  The LOAC assumes that we cannot stop war, so we must sanitize it. Pacifism assumes that sanitizing war legitimizes it, and that the only moral coherence lies in refusing the license entirely. The tension you perceive is the gap between regulating a tragedy and preventing one.
