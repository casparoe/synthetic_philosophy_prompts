  # MORAL RESPONSIBILITY: A DECISION TREE

  **Start:** You admit we *do* resent, blame, and forgive. You treat these attitudes as significant.

  **1. THE LEWAY QUESTION**
  Does holding someone morally responsible require that they had a **strong ability to do otherwise** at the moment of action?
  *   **YES** → Go to **2**.
  *   **NO** → Go to **4**.

  **2. THE COMPATIBILITY QUESTION**
  Is this strong ability compatible with **determinism** (the idea that every event is caused by prior events)?
  *   **YES** → Go to **3**.
  *   **NO** → Go to **3**.

  **3. PROBE: THE OBJECTIVE ATTITUDE TO SELF**
  If you became convinced your own wrongful act was **causally determined**, would your **guilt** become inappropriate?
  *   **YES** → **LEAF (v)**
  *   **NO** → **LEAF (vi)**

  **4. THE QUALITY OF WILL QUESTION**
  Is blame warranted primarily because the action expressed an **objectionable quality of will** (ill will, indifference)?
  *   **YES** → Go to **6**.
  *   **NO** → Go to **5**.

  **5. THE FAIRNESS QUESTION**
  Is blame governed by a norm of **fairness**, such that it is inappropriate if the agent could not meet a **reasonable expectation**?
  *   **YES** → **LEAF (ii)**
  *   **NO** → **LEAF (iv)**

  **6. PROBE: REACTIVE ATTITUDES TOWARD THE DEAD**
  Is resentment toward a **dead historical tyrant** appropriate in the *same full sense* as resentment toward a living colleague?
  *   **YES** → Go to **7**.
  *   **NO** → **LEAF (iii)**

  **7. THE RELATIONSHIP QUESTION**
  Do these attitudes express the **value we place on a relationship** rather than tracking independent desert?
  *   **YES** → **LEAF (iv)**
  *   **NO** → Go to **8**.

  **8. THE EXEMPTION VS. EXCUSE QUESTION**
  When we suspend resentment toward the **clinically depressed**, is it because they are **exempt** from the participant stance or **excused** from a demand within it?
  *   **EXEMPT** → **LEAF (i)**
  *   **EXCUSED** → **LEAF (vii)**

  ***

  ## THE POSITIONS (LEAVES)

  **LEAF (i): Strawsonian Naturalism [Named]**
  *Commitment:* The attitudes are self-standing, and the demand for a justification of them from outside our practices is confused.
  *Awkward Commitment:* You must accept that our deepest moral practices are ultimately brute facts that cannot be rationally justified to an outsider.

  **LEAF (ii): Fairness-Based Compatibilism [Named]**
  *Commitment:* Blame is governed by a norm of fairness, so the attitudes are warranted when the agent had the capacity to meet a reasonable expectation.
  *Awkward Commitment:* You must accept that blame is unfair toward an agent who expressed ill will but lacked the specific capacity to meet your expectations.

  **LEAF (iii): The Two-Stage View [Named]**
  *Commitment:* A thin attributability sense of responsibility should be separated from a thicker accountability sense, with the reactive attitudes belonging to the latter.
  *Awkward Commitment:* You must accept that we can judge a dead tyrant's character as evil but cannot appropriately resent them for it.

  **LEAF (iv): The Relationship View [Named]**
  *Commitment:* Blame and resentment express the value we place on a relationship rather than tracking desert.
  *Awkward Commitment:* You must accept that blame is inappropriate in cases where no normative relationship exists or is possible (e.g., toward strangers or the dead, depending on Node 6).

  **LEAF (v): Hard Incompatibilism / Skepticism [Named]**
  *Commitment:* The attitudes cannot be justified in a desert-entailing form and blame as such should be given up, perhaps in favor of a detached analogue.
  *Awkward Commitment:* You must accept that our current moral life relies on an illusion or requires a radical, perhaps unrecognizable, transformation.

  **LEAF (vi): Libertarianism [Named]**
  *Commitment:* The attitudes are warranted only if the agent had a strong ability to do otherwise.
  *Awkward Commitment:* You must accept that moral responsibility depends on the existence of indeterministic luck in the causal chain.

  **LEAF (vii): Quality of Will Compatibilism [Named]**
  *Commitment:* The attitudes are warranted whenever the action expressed an objectionable quality of will, determinism notwithstanding.
  *Awkward Commitment:* You must accept that blame is appropriate even if the agent could not have done otherwise, provided their will was objectionable.

  ***

  ## UNSEPARATED PAIRS

  **Leaf (i) and Leaf (vii):**
  These questions cannot fully separate Strawsonian Naturalism from Quality of Will Compatibilism, as both often yield the same verdicts on concrete cases; they are genuinely distinct meta-ethical commitments that feel identical in practice.

  **Leaf (ii) and Leaf (vii):**
  The tree separates these via the Fairness Question, but in many concrete cases, "reasonable expectation" and "objectionable quality of will" overlap; they are distinct in principle but frequently converge in application.
