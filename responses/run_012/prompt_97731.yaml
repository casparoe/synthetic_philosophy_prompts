  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure not to get bogged down in names. User said "don't bother with citations." Keep it conceptual.
      *   *Nuance:* The user asked if one side is making an empirical claim. Neither is really making an empirical claim about biology; they are making conceptual claims about *how we talk* about biology. I need to make sure this distinction is clear.
