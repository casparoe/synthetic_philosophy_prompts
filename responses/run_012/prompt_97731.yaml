      *   *The "Verbal Dispute" Hypothesis:* SE answers "Why is it here?" (History). CR answers "What does it do?" (Mechanism). If they just agreed on definitions, they'd stop fighting.
      *   *The "Substantive Dispute" Hypothesis:* It's about what counts as a *scientific explanation*. Is biology a historical science or a functional/mechanistic science? Can we naturalize teleology (purpose) without history?
      *   *The "Software Analogy":*
