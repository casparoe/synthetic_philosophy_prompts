  7.  **Final Polish:** Check against constraints. Long answer okay? Yes. Step-by-step? Yes. Brainstorm then commit? Yes. Use the code analogy? Yes.

      *(Self-Correction on the "Commitment"):* I should be careful not to say one side is "right." The philosophical consensus is largely pluralistic now. I will commit to the diagnosis that the *disagreement* is about normativity, even if the *solution* is pluralism.

      *(Refining the Software Analogy):* The "legacy code" analogy is brilliant. I need to highlight the "Undocumented Feature" vs. "Bug" distinction.
      *   CR: If the code gates access, that's its function (role).
