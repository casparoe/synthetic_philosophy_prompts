  3.  **Brainstorm Candidate Diagnoses:**
      *   *Diagnosis 1: Purely Verbal.* They mean different things by "function." SE means "selected effect," CR means "causal contribution." No real conflict, just terminology.
      *   *Diagnosis 2: Explanatory Scope.* It's about which explanation is *useful* in different contexts. CR is good for physiology (how does it work now?), SE is good for adaptationism (why did it evolve?). Both are valid, but context-dependent.
