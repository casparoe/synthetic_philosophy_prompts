  Draft the joint statement that two camps in the indicative/counterfactual conditionals debate could both sign after a good-faith adversarial collaboration: (A) a truth-conditional possible-worlds semanticist who treats indicative and counterfactual conditionals as one restricted-modal kind, differing only in the relevant accessibility or selection function, and (B) a conditional-probability theorist who denies truth conditions to indicative conditionals while granting them to counterfactuals. Begin with a numbered section of agreed claims—about the inadequacy of the material conditional, the Oswald/Kennedy pair, exportation, antecedent-strengthening, and what is to be explained—then a disagreements table with columns for the question, each side’s formulation, the crux, the shared test or argument, and each side’s prediction. For each disagreement give a formulation each side would accept for its own view, state the crux, and supply a case or argument both sides agree bears on it, with each side’s prediction recorded in advance. Use as one crux case this novel pair: a doctor says before results that if the biopsy is negative the patient will recover, and after a positive result says that if the biopsy had been negative the patient would have recovered. Both sides should say what they agree the case shows and what each predicts for a variant in which the antecedent is known false rather than merely unknown. If part of the dispute is verbal, say which part and why. Do not cite literature. End by stating your confidence in the main claims and identifying the point you are least sure of.
