answer: |-
  # JOINT STATEMENT ON THE SEMANTICS OF CONDITIONALS

  **Signatories:**
  (A) The Unified Modal Semantics Camp
  (B) The Conditional Probability Camp

  **Date:** October 26, 2023

  **Preamble:**
  Following a period of adversarial collaboration, we acknowledge that while our theoretical frameworks diverge significantly regarding the metaphysical and logical status of indicative conditionals, we share a common commitment to explaining the linguistic data. We agree that any adequate theory must account for the intuitive differences between indicatives and counterfactuals without resorting to the classical material conditional. The following statement outlines our points of convergence, our precise points of divergence, and the empirical tests we agree are decisive.

  ### I. AGREED CLAIMS

  1.  **Inadequacy of the Material Conditional:** We agree that the classical material conditional (where "If P, then Q" is equivalent to "Not-P or Q") fails to capture the meaning of natural language conditionals. Specifically, it incorrectly predicts that conditionals with false antecedents are trivially true and fails to account for the relevance connection between antecedent and consequent.
  2.  **The Oswald/Kennedy Distinction:** We agree that the pair of sentences regarding the assassination provides a decisive constraint on theory:
      *   (Indicative) "If Oswald did not kill Kennedy, someone else did." (Accepted as true given historical knowledge).
      *   (Counterfactual) "If Oswald had not killed Kennedy, someone else would have." (Rejected as false or unsupported).
      *   Any theory must explain why the shift in mood alters the truth or acceptability conditions despite the antecedent being false in reality for both.
  3.  **Failure of Monotonicity (Antecedent-Strengthening):** We agree that antecedent-strengthening is invalid for both indicative and counterfactual conditionals. That is, from "If P, then Q," it does not follow that "If (P and R), then Q." Adding information to the antecedent can defeat the inference.
  4.  **Failure of Exportation:** We agree that exportation generally fails. From "If (P and Q), then R," it does not validly follow that "If P, then (if Q, then R)." Nested conditionals behave differently than conjoined antecedents.
  5.  **The Explanandum:** We agree that the primary phenomenon to be explained is the systematic difference in behavior between indicatives and counterfactuals, specifically regarding how they interact with the speaker's epistemic state and the passage of time (as knowledge changes).

  ### II. DISAGREEMENTS TABLE

  | Question | Side (A) Formulation (Unified Modal) | Side (B) Formulation (Probabilistic) | Crux | Shared Test / Argument | Side (A) Prediction | Side (B) Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Do indicative conditionals have truth conditions?** | Yes. Indicatives express propositions that are true or false depending on the consequent's truth in a set of epistemically accessible worlds. | No. Indicatives do not express propositions. They express conditional degrees of belief (probabilities). Only counterfactuals have truth conditions. | **Triviality:** Can an indicative be true while the conditional probability is low? | **The Triviality Results:** Mathematical proofs showing that if indicatives have truth conditions and follow standard probability laws, probabilities collapse. | The proofs rely on assumptions about embedding that natural language does not always support. Truth conditions exist but are context-sensitive. | The proofs are decisive. Indicatives cannot have truth conditions without violating probability axioms. | Speakers will reject betting odds on indicatives that match truth-value frequencies in edge cases. | Speakers will accept betting odds matching conditional probability, rejecting truth-value assignments. |
  | **2. The Doctor/Biopsy Case (Epistemic Shift)** | The mood shift reflects a change in the **modal base**. Before results: Epistemic base (open worlds). After results: Counterfactual base (closest worlds where antecedent holds). | The mood shift reflects a change in **cognitive attitude**. Before results: Supposition (uncertain). After results: Counterfactual imagination (known false). | **The Variant:** What if the antecedent is *known false* at the time of the indicative utterance? | **The Known-False Variant:** A doctor knows the biopsy is positive but says to a colleague, "If the biopsy is negative, the patient will recover." | The sentence is **truth-evaluable** (likely vacuously true or false due to empty modal base) but pragmatically infelicitous. | The sentence is **not truth-apt**. It is a category mistake to assign truth values; it is merely unassertible. | Side A: Speakers will judge the sentence as "technically true but misleading." <br> Side B: Speakers will judge the sentence as "nonsensical" or "wrong to say," not "false." |
  | **3. The Nature of the Difference** | The difference is **semantic**. Both are restricted modals; they differ in the selection function (epistemic vs. metaphysical/temporal). | The difference is **semantic/cognitive**. Indicatives are suppositional judgments; counterfactuals are objective claims about non-actual worlds. | **Embedding:** Can indicatives be embedded in logical operators (negation, disjunction)? | **Embedding Test:** "It is not the case that if P, Q." | Yes. Negation applies to the proposition expressed by the conditional. | No. Negation applies to the assertibility or the degree of belief, not a truth-bearing content. | Side A: Embeddings preserve truth conditions. <br> Side B: Embeddings force a shift to counterfactual interpretation or metalinguistic negation. |

  ### III. ANALYSIS OF THE DOCTOR/BIOPSY CASE

  We jointly stipulate the following case as the central test for our disagreement:

  **The Scenario:**
  *   **Time 1 (Results Unknown):** A doctor says, "If the biopsy is negative, the patient will recover." (Indicative)
  *   **Time 2 (Results Known Positive):** The same doctor says, "If the biopsy had been negative, the patient would have recovered." (Counterfactual)

  **Joint Agreement on the Case:**
  Both sides agree that the shift from indicative to counterfactual is mandated by the shift in the epistemic status of the antecedent. When the antecedent is epistemically possible, the indicative is appropriate. When the antecedent is known to be false, the counterfactual is appropriate. We agree that a theory that predicts the indicative remains appropriate after the results are known positive is falsified.

  **The Decisive Variant (Antecedent Known False at Utterance):**
  We disagree on the status of the indicative utterance if made while the doctor *already knows* the result is positive (e.g., speaking hypothetically to a student while holding the positive report).

  *   **Side (A) Prediction:** The indicative "If the biopsy is negative..." retains truth conditions. Since the doctor knows the antecedent is false, the set of epistemically accessible worlds where it is true is empty (or requires expanding the modal base). If the set is empty, the universal quantifier renders the conditional vacuously true. We predict speakers might accept it as "true in a sense" but pragmatically defective.
  *   **Side (B) Prediction:** The indicative "If the biopsy is negative..." lacks truth conditions entirely. Because the doctor knows the antecedent is false, the conditional probability is undefined (or the supposition is ruled out). We predict speakers will reject the sentence not as false, but as inappropriate for expressing a fact. It is not that the proposition is false; it is that no proposition is expressed.

  ### IV. VERBAL DISPUTE IDENTIFICATION

  We identify a partial verbal dispute regarding the term **"Truth."**

  *   **Why it is verbal:** Side (B) often uses "truth" to mean "objective, mind-independent correspondence." Side (A) uses "truth" to include "truth relative to an epistemic modal base."
  *   **Resolution:** If Side (B) admits that indicatives have "epistemic truth conditions" (truth relative to what is known) while maintaining they lack "factual truth conditions" (truth relative to the world simpliciter), the gap narrows. However, the dispute remains substantive regarding **logic**: Side (A) maintains indicatives obey classical logic (within their modal scope), while Side (B) maintains they obey the laws of probability calculus, which diverge from classical logic in cases of nesting and negation. This logical divergence is not verbal.

  ### V. CONFIDENCE AND UNCERTAINTY

  **Confidence in Main Claims:**
  We are highly confident ( >90%) in Section I (Agreed Claims). The failure of the material conditional and the validity of the Oswald/Kennedy distinction are robust linguistic data points that any viable theory must accommodate. We are also highly confident that the Doctor/Biopsy shift is a real phenomenon requiring explanation.

  **Point of Least Certainty:**
  We are least sure ( <60%) about the **Embedding Test** (Row 3 of the Table). It is difficult to construct natural language examples where indicative conditionals are embedded under negation or disjunction without triggering a shift to counterfactual mood or metalinguistic interpretation. Consequently, we are uncertain whether the failure to find clear embeddings supports Side (B)'s claim that indicatives lack propositional content, or Side (A)'s claim that such embeddings are merely rare or contextually restricted. Resolving whether natural language logic permits nested indicatives is the most critical outstanding empirical question.
