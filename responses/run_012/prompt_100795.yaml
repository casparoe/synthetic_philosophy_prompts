prompt: |-
  I'm taking a philosophy of psychiatry module and I have to hand in a short position piece for next week's seminar on Hacking and looping effects, and I've drafted the argument but I don't trust it yet, so before I write it up properly I want someone to go at it. The gist: Hacking sets up the contrast between kinds that are indifferent to how we classify them (quarks, elements — they don't care what we call them) and kinds that are interactive (people, who react to the label, so the classification loops back and reshapes the kind). I want to argue that the real unit of the loop isn't the kind at all, it's the kind-plus-institution. A diagnosis only loops because there's a clinic, a diagnostic manual, an insurance code, a reimbursement form, a school that needs a box ticked; pull the institution out and the person-category stops looping, leave it in and it loops even if the underlying traits are as inert as a quark's. So looping is an institutional phenomenon that happens to get expressed on a human substrate, and the natural-vs-social kind split should be swapped out for a claim about how tightly a kind is coupled to an institution that sorts and rewards people by it.

  The payoff I want is that the same trait can be indifferent in one setting and interactive in another — your hair colour is inert in a salon but becomes a looping kind the moment a school or an employer sorts by it and rewards people accordingly — so being an interactive kind is a property of the coupling, not of the kind. I was arguing about this with my flatmate who does sociology and she reckons I've just restated Hacking with extra steps, which is definately the worry I have. What I want is a sanity check: does this actually diverge from Hacking or just redescribe him, where does it overreach, and is the hair-colour example doing real work or is it a cheat? Give it to me as exactly five numbered points, one or two sentences each, no intro and no wrap-up, just the five. And if any of the five is a spot where I'd be safer saying something weaker, say so.
