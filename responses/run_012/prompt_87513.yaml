answer: |-
  # Design Brief: Theory of Cross-Temporal Moral Assessment (CTMA)

  ## 1. Specification of Desiderata
  The following table enumerates the functional requirements for any adequate theory of CTMA. Status is marked as **Non-Negotiable** (logical prerequisites for coherence) or **Preference** (distinguishing between competing philosophical camps).

  | ID | Requirement | Status |
  | :--- | :--- | :--- |
  | **R1** | **Target Differentiation:** The theory must distinguish between assessing the *act*, the *agent's character*, the *agent's culpability*, and the *agent's public legacy*. | Non-Negotiable |
  | **R2** | **Act/Agent Separation:** The theory must decouple the objective moral status of an act from the epistemic culpability of the agent performing it. | Non-Negotiable |
  | **R3** | **Defense Specificity:** The theory must adjudicate between distinct readings of the "man-of-his-time" defense (Ignorance vs. Relativism vs. Expectation) rather than treating it as monolithic. | Non-Negotiable |
  | **R4** | **Temporal Neutrality:** The criteria used to judge historical figures must be reflexively applicable to the assessors and their contemporaries by future standards. | Non-Negotiable |
  | **R5** | **Partial Compliance Handling:** The theory must provide a verdict mechanism that does not collapse when the alleged wrongdoing was ubiquitous within the agent's society. | Non-Negotiable |
  | **R6** | **Causal Granularity:** The theory must distinguish between harms caused by individual agency and harms produced by structural or distributed causation. | Preference (Structuralists) |
  | **R7** | **Foreseeability Constraint:** The theory must limit culpability to consequences that were reasonably foreseeable or knowable at the time of action. | Non-Negotiable |
  | **R8** | **Verdict Granularity:** The theory must specify whether a person receives a single aggregate moral score or a vector of respect-specific verdicts (e.g., honored for X, condemned for Y). | Preference (Separatists) |
  | **R9** | **Pragmatic Alignment:** The theory must map specific verdicts to specific practical functions (e.g., historical understanding vs. statue removal vs. moral education). | Non-Negotiable |
  | **R10** | **Dynamic Stability:** The theory must allow for revisability upon new evidence while maintaining sufficient stability to serve as a guide for public commemoration. | Preference (Fallibilists) |
  | **R11** | **Defense Consistency:** The theory must explain or justify any asymmetry in applying historical defenses (e.g., why it applies to slavery but not to tax evasion). | Non-Negotiable |

  ---

  ## 2. Reasoning and Motivating Cases

  ### Target Differentiation (R1) and Verdict Granularity (R8)
  A theory that yields a single binary output (Good/Bad) fails the **Statesman Case**. Consider a leader who negotiates a peace treaty ending a decade of war (achievement) but authorizes a bombing campaign that kills civilians (catastrophe). If the theory assesses the *agent* as a monolith, it must either wash out the good with the bad or vice versa. An adequate theory must allow for a split verdict: the *legacy* may be honored for the peace, while the *act* of bombing is condemned, and the *character* is judged on whether the bombing was a tragic necessity or a moral failure. Without R1 and R8, the theory forces a distortion of historical reality to fit a binary moral schema.

  ### Act/Agent Separation (R2) and Defense Specificity (R3)
  The **Slaveholder Founder Case** drives R2 and R3. A figure drafts documents proclaiming universal rights while enslaving people.
  *   **Act Status:** The act of enslavement is objectively harmful and violates the very rights proclaimed.
  *   **Agent Culpability:** Was the agent blameworthy?
  The "man-of-his-time" defense is often invoked here, but it conflates three distinct claims which R3 requires the theory to separate:
  1.  **Non-Culpable Ignorance:** They literally did not know slavery was wrong. (Empirically weak for founders who faced contemporary abolitionist arguments).
  2.  **Moral Relativism:** There was no objective moral truth to violate; slavery was only "wrong for us," not "wrong for them." (Undermines the claim that slavery is universally wrong).
  3.  **Reasonable Expectation:** It was psychologically or socially impossible for them to act otherwise. (An excuse, not a denial of wrongness).
  An adequate theory must accept that an act can be objectively wrong (R2) while the agent is excused due to epistemic limits (R3, Claim 1), without sliding into Relativism (Claim 2). If the theory conflates Act and Agent, it must either say the act wasn't wrong (absurd) or the agent is fully culpable (ignores historical epistemology).

  ### Foreseeability (R7) and Dynamic Stability (R10)
  Consider the **Constructed New Evidence Case**: A historical figure makes a decision that, unbeknownst to anyone at the time, triggers a chain of events leading to a catastrophe 50 years later. New archival evidence reveals this causal link.
  *   **R7** dictates that if the consequences were unforeseeable, the agent cannot be culpable for them, regardless of the outcome.
  *   **R10** dictates that while our *assessment* of the consequences changes, our *verdict* on the agent's moral standing should not shift drastically based on outcome luck.
  However, public commemoration requires stability. If every new archival discovery triggers a re-evaluation of statues, the practice of commemoration becomes impossible. The theory must balance the truth-seeking function of history (Revisability) with the social function of memory (Stability).

  ### Partial Compliance (R5) and Causal Granularity (R6)
  The **Typical Contemporary Case** involves a figure whose worst conduct was unremarkable for their time; almost no one around them objected.
  *   **R5 (Partial Compliance):** If the theory condemns this figure, it implicitly condemns their entire society. If the theory excuses them because "everyone did it," it risks exonerating anyone who hides within a corrupt majority. The theory must explain why an individual is liable even when compliance with moral truth was socially costly and rare.
  *   **R6 (Structural vs. Individual):** This connects to the **Explorer Case**, where conduct drew objection from *some* contemporaries. Here, the harm is not just individual but structural (colonialism). If the harm was produced by "many hands" (government, investors, soldiers), does the individual explorer bear the full weight? A theory that focuses solely on individual causation fails to capture structural sin; a theory that focuses solely on structure dissolves individual agency. R6 requires the theory to locate the individual within the structure without losing them.

  ### Temporal Neutrality (R4) and Defense Consistency (R11)
  **R4** is the reflexivity constraint: whatever rule we use to judge them, they (or a future generation) can use to judge us. This prevents "Presentism" (the assumption that current norms are the final truth).
  **R11** addresses the **Selective Application** problem. We often accept the "man-of-his-time" defense for slaveholders but reject it for historical figures who opposed democracy or treated women poorly, even if those views were also standard then. A theory cannot simply tolerate this asymmetry; it must explain why ignorance is exculpatory in one domain of morality but not another, or admit that our current assessments are inconsistent.

  ### Pragmatic Alignment (R9)
  Finally, the theory must answer: *What is this verdict for?*
  *   If the function is **Belief** (historical accuracy), we prioritize truth and revisability.
  *   If the function is **Honour** (statues), we prioritize legacy and stability.
  *   If the function is **Blame** (moral education), we prioritize culpability and act status.
  A single verdict cannot serve all functions. A theory that declares a figure "Morally Cancelled" may satisfy a blame function but fail a historical understanding function. R9 requires the theory to specify which practical output it is designed to generate.

  ---

  ## 3. Critical Analysis of the Specification

  ### The Exclusionary Requirement
  **Requirement R2 (Act/Agent Separation)** does the most to exclude the most popular theories.

  Most folk-theories and many simplified philosophical approaches conflate the moral status of the act with the blameworthiness of the agent.
  *   **Strict Presentism** argues: "Slavery was wrong, therefore slaveholders were bad people." This violates R2 by ignoring the epistemic standing of the agent.
  *   **Hard Relativism** argues: "Slavery was acceptable then, therefore the act was not wrong." This violates R2 by denying the objective status of the act.
  *   **Simple Consequentialism** often argues: "The outcome was bad, therefore the agent is culpable." This violates R2 (and R7) by ignoring foreseeability.

  To satisfy R2, a theory must adopt a complex meta-ethical framework that accommodates objective moral truths *and* epistemic constraints on culpability simultaneously. This excludes the two most common intuitive responses to historical wrongdoing (outright condemnation and outright excuse) and forces a more nuanced, less emotionally satisfying position.

  ### The Incompatible Pair
  I suspect **Requirement R4 (Temporal Neutrality)** and **Requirement R3 (Defense Specificity / Epistemic Excuse)** cannot be jointly satisfied without significant theoretical cost.

  **The Conflict:**
  *   **R4 (Neutrality)** demands that we judge the past by the same standard we wish to be judged by in the future. If we claim our current moral views are *true* (not just fashionable), we must assert that historical figures who violated them were objectively wrong.
  *   **R3 (Epistemic Excuse)** demands that we excuse historical figures if they could not reasonably have known better (Non-Culpable Ignorance).

  **The Tension:**
  If we apply R4 strictly, we must admit that future generations may judge *us* by standards we cannot currently conceive of. If we claim "Non-Culpable Ignorance" for the past (R3), we must accept "Non-Culpable Ignorance" for ourselves when judged by the future.
  However, if we excuse the past because they didn't know better, we undermine the claim that our current moral knowledge is *true* rather than just *current*. If moral truth is objective (required to condemn slavery definitively), then ignorance of the truth does not change the wrongness of the act. If we excuse the agent based on ignorance, we are effectively saying "Moral truth is binding only if you know it."
  But if we apply that rule to ourselves (R4), we invalidate the force of our own moral convictions (e.g., "We know climate inaction is wrong, but if future people discover a nuance we couldn't see, are we excused?").

  To satisfy R3, we must soften the binding nature of moral truth (making it epistemic-relative). To satisfy R4, we must harden the binding nature of moral truth (making it objective). A theory that grants the "man-of-his-time" defense (R3) while claiming temporal neutrality (R4) risks either condemning the past unfairly (violating R3) or undermining the objective basis for condemning the present (violating the spirit of R4). This is the central paradox of cross-temporal assessment: **We want to say they were wrong, but not that they were bad. Neutrality suggests if they were not bad, we might not be either.**
