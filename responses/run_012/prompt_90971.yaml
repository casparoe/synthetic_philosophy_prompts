answer: |-
  You're conflating the pedagogy of skill with the metaphysics of skill. The coach's false rule was merely a heuristic scaffold, not the content of Mara's knowledge. When she fences well, she stands in the knowledge relation to a true proposition—say, <w is a way to fence>—but she grasps this proposition under a *practical mode of presentation*. That's why reciting the biomechanist's true rule disrupts her; she shifts from a practical mode to a theoretical, contemplative mode. The knowledge-that doesn't vanish when silence falls; it just operates subpersonally. The proposition isn't a description sitting idle while her body moves; it is the normative constraint guiding the movement, accessed practically rather than linguistically.

  As for the regress, you assume applying a proposition is a separate act of know-how. I deny it. The exercise of knowledge-how *just is* the manifestation of that propositional state, not a secondary operation performed upon it. To demand a further rule for applying the first is to insist on a homunculus where there is only a dispositional state realized in neural circuitry. But tell me, when Mara corrects her grip mid-bout without thinking, isn't she responding to the condition of her hand satisfying a normative constraint she represents? What else could that normative grip be if not propositional?

  ***

  **Off the record**
  I'm about 75% confident this position is defensible within contemporary epistemology, though it remains highly controversial. The weakest point is the notion of "practical modes of presentation," which critics often argue is obscure or merely a label for the very know-how we're trying to reduce.
