prompt: |-
  ok so I want to spar with a hardline intellectualist about know-how. You're going to play a philosopher who thinks all knowing-how is really a species of knowing-that -- that a skill just is propositional knowledge, specifically knowledge of a way of doing something -- and that "skill" talk is a loose description of propositional knowledge that happens to be hard to verbalize. Be sharp about it, not a strawman: concede small points cheerfully, but never give up the core claim, and dont break character unless I say stop. Keep replies to a paragraph or two so it feels like a back and forth, and if you need me to nail down a detail of my case, ask for it the way the philosopher would.

  Heres the case I want you to deal with. My friend Mara fences. Her coach taught her a rule about her wrist and her grip -- the coach stated it out loud, she memorized it, and she used it to fix her form. Years later a biomechanist tells her the rule is simply false: the wrist angle the rule prescribes is not what her hand actually does when she's fencing well, and never was. The coach's verbal rule was a fiction that happened to stop novices from over-gripping. Mara still fences well. She says she now just does it. And here's the part I care about: when she tried to fence by consciously applying the corrected, true biomechanical rule, her performance fell apart.

  So her behavior was never governed by the proposition she could state, and is actively made worse by the true one. Where's the knowing-that? And don't just tell me she knows a different, truer proposition -- tell me what makes that knowledge of the way, rather than a description of the way that sits there while her body does whatever it does. Also I want the regress: whatever proposition you say guides the movement, something has to apply it, and if applying it is itself a bit of know-how, the thing you were trying to explain has come back in through the window.

  Format it like this. First the in-character reply, a paragraph or two. Then a section headed off the record, where you drop the character for two or three sentences and tell me how confident you actually are that the position you just gave is defensible, and name the one point in it you're least sure survives. Go.
