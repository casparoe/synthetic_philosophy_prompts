answer: |-
  Version 1
  You are auditing a mug factory where intelligence confirms any non-black Raven-logo mug produced today must be inside a specific sealed crate containing exactly two items, both known to be non-black. Your hypothesis is "All Raven-logo mugs are black," which implies the crate contains zero Raven-logo mugs. You assign a 50% prior probability that the crate holds one white Raven-logo mug and one white Crow-logo mug versus two white Crow-logo mugs. You reach in, pull out one item, and observe it is a white Crow-logo mug. This observation eliminates half the possible counterexamples available in the only location they could exist, raising the probability of your hypothesis from 50% to roughly 66%.

  Version 2
  You hold the identical hypothesis about today's production run, but you are now standing in the main warehouse containing 10,000 mugs, almost all of which are white Crow-logo mugs regardless of the hypothesis truth. You stumble and knock a random mug off a shelf, observing it is a white Crow-logo mug. Because this object was selected from the general population rather than the specific pool of potential counterexamples, the likelihood of this observation is nearly identical whether the hypothesis is true or false, leaving your probability estimate effectively unchanged. The changed feature is the sampling reference class.

  The verdicts

  (a) The Nicod-style instantial criterion treats confirmation as a purely logical relation between proposition forms. Since "white Crow-logo mug" is an instance of "non-black and non-raven," it confirms "All non-black things are non-ravens." By the equivalence condition, this logically confirms "All ravens are black" regardless of context. Therefore, this view verdicts that both Version 1 and Version 2 provide identical confirmation. The background information about crates or warehouses is irrelevant to the logical structure; the observation instantiates the generalization in both cases, so the confirmation status remains invariant across the two scenarios.

  (b) The Bayesian calculates confirmation via the likelihood ratio $P(E|H) / P(E|\neg H)$. In Version 1, selecting from the crate means $P(E|H)=1$ and $P(E|\neg H)=0.5$, yielding a ratio of 2 and a significant probability update. In Version 2, selecting from the warehouse means $P(E|H) \approx 0.999$ and $P(E|\neg H) \approx 0.999$, yielding a ratio near 1 and negligible update. This view verdicts that Version 1 confirms non-negligibly while Version 2 does not. The difference falls out of the sampling procedure specified in the setup, which dictates the likelihoods assigned to the evidence under competing hypotheses.

  (c) The Popperian rejects induction and holds that observations only corroborate theories if they result from sincere attempts at falsification. Observing a non-raven cannot falsify "All ravens are black," regardless of where it is found, because the hypothesis only forbids non-black ravens. Therefore, this view verdicts that neither Version 1 nor Version 2 confirms the hypothesis. In both cases, the observer failed to risk a falsifier; looking at non-ravens is immunizing strategy, not testing. Corroboration requires seeking black ravens to see if they are non-black, which neither scenario accomplishes.

  What's doing the work
  The single feature driving the divergence is the **Sampling Protocol** (or Reference Class Selection). In Version 1, the agent samples from the class of non-black things, where finding a non-raven reduces the pool of potential falsifiers. In Version 2, the agent samples from the universe of all things, where finding a non-raven is expected regardless of the hypothesis. The evidential weight depends entirely on whether the observation was selected from the risk class defined by the hypothesis's equivalent form.

  Pull the lever
  If you invert Version 2 to sample specifically from the non-black warehouse items, it begins to confirm like Version 1. If you invert Version 1 to sample from the entire factory inventory including black items, the confirmation vanishes like Version 2. The evidential power tracks the selection method, not the object observed.

  How the Hempelian fights back
  A Hempelian argues that confirmation is a logical relation independent of sampling; they claim Version 2 *does* confirm, but background knowledge makes the increment negligible. They distinguish "confirms" from "confirms significantly." This move saves the logical equivalence condition but fails to explain why the intuition of irrelevance in Version 2 is so robust, effectively conceding that logical confirmation alone is insufficient for scientific reasoning.
