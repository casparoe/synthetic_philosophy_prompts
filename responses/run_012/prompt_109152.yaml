answer: |-
  # Game Design: The Baseline Descent

  **Objective:** To simulate a multipolar trap where competitive pressure degrades a shared standard, ratcheting the group towards a sub-optimal equilibrium that no individual desires but all contribute to.

  **Players:** 12 (Ideal for 3 tables of 4, or one large circle).
  **Duration:** 90 minutes.
  **Materials:**
  *   12 "Solvency Cards" (envelopes containing 3 to 6 tokens, distributed randomly).
  *   12 "Bid Slips" (small paper slips).
  *   1 Whiteboard or large sheet of paper (The "Global Baseline").
  *   60 "Resource Tokens" (coins, poker chips, or dried pasta).
  *   Pens.

  ---

  ## 1. The Setup (10 Minutes)

  **The Context:**
  Tell the group they are competing firms in a single market. The "Global Baseline" represents a safety or ethical standard (e.g., carbon emissions, AI alignment, labour laws). High numbers are good; low numbers are dangerous.

  **The Resources:**
  Hand each player a sealed **Solvency Card**. They must not open it or show it to anyone. Inside is a number between 3 and 6. This represents their "Runway"—the number of rounds they can afford to be uncompetitive before going bust. If their Runway hits zero, they are eliminated and score nothing.

  **The Score:**
  Players start with 0 Points. The winner is the player with the most Points at the end who has not gone bust.

  **The Baseline:**
  Write **10** on the whiteboard. This is the starting Global Baseline.

  ---

  ## 2. The Rules of Engagement

  Each round consists of three steps:

  1.  **The Bid:** Players secretly write a number between 1 and the current Global Baseline on their Bid Slip.
  2.  **The Reveal:** All reveal simultaneously.
  3.  **The Ratchet:**
      *   Identify the **Lowest Bid** made by any player.
      *   The Global Baseline for the *next* round becomes this Lowest Bid. (The baseline never rises).
      *   **Scoring:**
          *   If your bid equals the *new* Baseline: You gain **1 Point**.
          *   If your bid is *higher* than the *new* Baseline: You gain **0 Points** and must pay **1 Token** from your Solvency Card (Competitiveness Penalty).
          *   If your bid is *lower* than the *new* Baseline (i.e., you were the unique lowest): You gain **2 Points**, but the Baseline drops to your level.

  **The Trap:** To score points, you must match the lowest bidder. To avoid paying Solvency Tokens, you must not be higher than the lowest bidder. Therefore, if *anyone* drops the baseline, everyone else must follow or bleed resources.

  ---

  ## 3. The Timeline & The Three Exits

  **Phase 1: The Concordat (Rounds 1–3)**
  *   **Time:** 20 Minutes.
  *   **Action:** Before Round 1 begins, allow 5 minutes of open discussion. Players may draft, sign, and swear to a "Concordat" to all bid 10 every round.
  *   **The Exit:** This is the **Binding Agreement**.
  *   **Why it Fails:** It is non-binding within the rules. The incentive to defect (bid 9 to gain 2 Points while others gain 1) is immediate. Once one person defects, the baseline ratchets down, punishing the virtuous.
  *   **Facilitator Note:** Do not enforce the Concordat. If they ask, "Is this contract binding?" say, "You are sovereign agents."

  **Phase 2: The Leviathan (Rounds 4–6)**
  *   **Time:** 25 Minutes.
  *   **Action:** Before Round 4, announce the **Regulator Mechanism**. Players may vote to institute a "Tax." If passed (simple majority), everyone pays 1 Solvency Token into a pot. This pot is used to fine anyone who lowers the Baseline below the current level.
  *   **The Exit:** This is the **Enforcer**.
  *   **Why it Fails:** It requires a Solvency payment upfront. Players with low Runways (3 tokens) cannot afford the tax, even if they want safety. They will vote 'No' to survive the immediate round, fracturing the coalition. The asymmetry of private capacity destroys the collective defence.
  *   **Facilitator Note:** Ensure the vote is public (show of hands) so players see the coalition fracture.

  **Phase 3: The Exodus (Rounds 7–8)**
  *   **Time:** 25 Minutes.
  *   **Action:** Before Round 7, announce the **Pivot Option**. Players may vote to end the game immediately and cash out their current Points.
  *   **The Exit:** This is the **Move to a Fresh Domain**.
  *   **Why it Fails:** It requires **Unanimity**. A player with a high Runway (6 tokens) and a lead in Points will veto the Exodus, believing they can crush the remaining opponents in the final rounds. Their private ambition holds the group hostage.
  *   **Facilitator Note:** If the vote fails, play the final rounds aggressively.

  **The Endgame:**
  *   **Time:** 10 Minutes.
  *   **Action:** Play Round 8. Reveal Solvency Cards. Tally scores.
  *   **The Reveal:** Ask the player with the lowest remaining Solvency why they kept bidding down. Ask the winner if the victory feels hollow.

  **Debrief:**
  *   **Time:** 20 Minutes.
  *   **Mapping:**
      1.  **The Ratchet:** Point to the whiteboard. Ask: "At which number did turning back become mathematically impossible?" (Usually when the Baseline drops below the average Solvency of the group).
      2.  **Private Info:** Reveal the Solvency distribution. Show how the player with 3 tokens forced the hand of the player with 6 tokens.
      3.  **The Exits:** Review why the Concordat (defection), Regulator (asymmetry), and Exodus (holdout) failed.

  ---

  ## 4. Scoring & Materials Detail

  **Solvency Cards:**
  Prepare 12 envelopes.
  *   3 envelopes contain **3 Tokens** (High Risk).
  *   6 envelopes contain **4 or 5 Tokens** (Medium Risk).
  *   3 envelopes contain **6 Tokens** (Low Risk).
  *   *Note:* Do not tell them the distribution. They must assume anyone could be on the brink.

  **Tokens:**
  Use physical counters. If a player cannot pay the Competitiveness Penalty (no tokens left), they are "Bust." They must continue playing (to keep the trap active) but cannot win. Their bids still count towards lowering the Baseline.

  **Winning:**
  *   Bust = Automatic Loss.
  *   Among survivors, highest Points wins.
  *   Tie-breaker: Highest remaining Solvency.

  ---

  ## 5. Likely Failure Modes & Mitigations

  **1. The "Rationalist" Solution (Over-Cooperation)**
  *   **Risk:** The group might successfully coordinate to keep the Baseline at 10, realising the Nash Equilibrium is ruinous.
  *   **Mitigation:** Increase the temptation. If they are too stable, introduce a "Market Shock" in Round 4: "The Baseline *must* drop by 1 this round due to external pressure." This forces the first crack in the Concordat without you accusing anyone.
  *   **Alternative:** Whisper to the player with the 6-token card: "You have a secret investor. If you win, you get double points." (Use only if the game is stagnating).

  **2. Early Elimination Boredom**
  *   **Risk:** Players who go Bust in Round 3 disengage.
  *   **Mitigation:** Give Bust players a role. They become "Auditors." They can verify bids to ensure no one is cheating. This keeps them invested in the degradation of the system.

  **3. Anger at the "Spoiler"**
  *   **Risk:** The group identifies the first defector and becomes hostile.
  *   **Mitigation:** In the debrief, emphasise that the defector was likely the one with the 3-token Solvency card. They did not choose ruin; ruin chose them. The system punished their vulnerability.

  **4. The Enforcer Works**
  *   **Risk:** They vote for the Regulator and it stabilises the game.
  *   **Mitigation:** The rules state the Regulator costs 1 Solvency Token *per round* to maintain. In Round 5, the tax comes due. The players on 3 tokens will be forced to vote to dismantle the Regulator to survive. Ensure this cost is recurring, not one-off.

  ---

  ## 6. Limitations: What This Game Cannot Do

  You must supply these truths in the debrief, as the mechanics cannot simulate them:

  1.  **Externalities:** In this game, only the players suffer. In reality, multipolar traps (climate change, AI arms races) harm bystanders who are not at the table. The game lacks a "victim" role.
  2.  **Time Horizons:** Ninety minutes compresses years of decay. In reality, the "ratchet" is often invisible until a crisis occurs. The game makes the decline explicit; reality hides it.
  3.  **Asymmetric Power:** In the game, one token equals one token. In reality, some actors can absorb losses that would destroy others entirely, allowing them to weaponise the trap deliberately. The game simulates desperation, not predation.
  4.  **The "Off" Switch:** In the game, they *must* play. In reality, actors can choose not to enter the market. However, the game illustrates that once *in*, exit is costly (The Exodus failure).

  ## Facilitator's Script for the "Vertigo" Moment

  When the Baseline hits 5 (or roughly half the starting value), stop the clock.

  > "Look at the board. Six rounds ago, you all agreed that 10 was the standard. You signed a pact. You voted for a regulator. And yet, here we are.
  >
  > "Nobody in this room wanted to be at 5. But look at your Solvency cards. If you had bid 10 when the baseline was 6, you would be bust now. You didn't choose 5 because you liked it. You chose it because you couldn't afford to be the one who didn't.
  >
  > "The trap didn't spring because anyone was evil. It sprang because the cost of virtue became fatal. Who can point to the exact round where we could have stopped, but didn't?"

  ---

  **British English Usage Note:**
  Ensure all written materials use "S" instead of "Z" where appropriate (e.g., "Standardisation," "Realise"), and terms like "Tokens," "Round," "Programme." The tone should be clinical and detached, mimicking a regulatory body.
