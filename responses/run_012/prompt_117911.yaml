answer: |-
  Good evening.

  Look around this room. It is divided. Not by the aisle, but by the work we are here to honor. On one side are the people who make films, fund them, and write about them. On the other are the people who lived the life captured in the film that matters most tonight. Both sides are here because of Marta Vogel. Both sides are here because of *The Salt Line*.

  We are giving a lifetime achievement prize. Usually, this is a warm handshake for a career well-lived. Tonight, it cannot be that. A lifetime achievement award suggests a summing up, a final judgment that the work is done and safe to handle. Marta's work is not safe. It never was. To give her this prize is not to say she is innocent. It is to say that her work demands something of us that comfort cannot provide.

  *The Salt Line* is, in my view, one of the finest documentaries ever made in this country. I have said that in print, and I stand by the judgment of the film's power. But power is not the same as goodness, and beauty is not the same as justice. We need to be clear about what we are celebrating, because the people who paid for this art are sitting in the third row.

  The film ends with a shot that lasts four minutes. It does not cut. It shows a fifteen-year-old girl learning that her father has signed away her family's claim against the smelter that poisoned their water. She does not speak. She collapses. We watch her do it. We watch the moment hope leaves her body.

  How Marta got into that house matters. She told the family the footage would help their lawsuit. The film dropped the lawsuit entirely. The girl was named in the credits. Her face was in the newspapers. The brother and sister of that girl are here tonight. They asked me not to pretend this shot does not exist. They also asked me not to make this evening about them. I will try to honor both requests.

  I will not pretend the shot doesn't exist. It is the heart of the film. It is the reason the film breaks your open. But I will not pretend the cost was nothing. A promise was made to get access, and that promise was broken. That is a fact. Marta has never apologized for this. She has said the film was true.

  This brings us to the reason we are really here. It is not just to hand out a prize. It is to face a question that this film forces into the open. There are three ways to hear this story, and all three are audible in this room tonight.

  The first view is that the art is separate from the making. The film is what is on the screen. The lies told to get the camera inside the door are history; the image itself is truth. If the shot reveals something real about human suffering, then the method of capturing it is a secondary detail. The work stands alone.

  The second view is that the art cannot be separated from the harm. If we enjoy this film, if we call it beautiful, we are taking pleasure in a betrayal. We are clapping for cruelty. A work that invites us to watch a girl's destruction, when that destruction was compounded by the filmmaker's presence, is corrupted at the root. The beauty is a lie because the cost was hidden.

  The third view is more difficult. It asks where the wrong lives. Did the harm happen outside the work, in the handshake that was broken before the filming started? Or does the harm happen inside the work, in what the film asks us to do while we watch it? Does the film ask us to look away, or to look closer? Does it treat the girl as a subject with dignity, or as an object for our education?

  I am not going to answer that for you. I am not going to tell you which view is right. But I am asking you to see that the disagreement is not about whether betrayal is bad. We all agree betrayal is bad. The disagreement is about whether that betrayal belongs to the artwork at all. Is it a stain on the frame, or is it part of the picture?

  Marta Vogel's career has been built on this edge. She does not look away. She does not protect us from the truth of what she finds, and she does not protect her subjects from the truth of what she shows. That is why she is a great filmmaker. It is also why she is a controversial one.

  We give her this prize not because she is safe, but because she is necessary. We give it because *The Salt Line* forces us to argue about what a documentary is for. Is it to serve the subject? Is it to serve the audience? Or is it to serve the truth, even when the truth burns the people who handed it to you?

  To the family in the third row: I know there are no words that fix what happened. I know that seeing this film honored tonight might feel like seeing the wound honored. I can only say that we are not honoring the wound. We are honoring the demand that the work makes on us to stop looking away.

  To Marta: You say the film was true. Tonight, we acknowledge that truth is heavy. It carries weight that does not disappear when the credits roll. You have spent a lifetime putting that weight in front of us. You have forced us to sit with it.

  This prize is not an absolution. It is an acknowledgment that the work is done, and that it remains unfinished in us. We are still arguing about it. We are still looking at that girl. We are still asking ourselves what we are doing when we watch her.

  Please join me in honoring Marta Vogel.

  ***

  **Note on Drafting Choices**

  The philosophical distinction between internal and external defects forced two specific choices. First, in describing the final shot, I avoided calling it "exploitation" (an external judgment) or "witnessing" (an internal justification). Instead, I described the physical act—"We watch her do it"—forcing the audience to locate the ethics in their own viewing rather than in my description. Second, regarding the prize justification, I had to avoid saying the art *outweighs* the harm (Position 1) or that the harm *invalidates* the art (Position 2). I chose to frame the prize as an acknowledgment of the *argument itself*, validating Position 3: that the defect is part of the work's solicitation of the audience, making the disagreement the point of the award.
