answer: |-
  Your scepticism is warranted. The proverb is a folk heuristic, not a mathematical operator. Using it to dismiss the St Petersburg paradox is like using a ruler to measure curvature: it captures the general shape but fails the precision test. However, beneath the colloquialism lies a menu of precise claims about value and risk. Here is how they stack up.

  **The Menu of Claims**

  1.  **Pure Certainty Preference:** Certain outcomes are psychologically weighted higher than uncertain ones, regardless of magnitude.
      *   *Verdict:* **Platitude.** True descriptively (people hate risk), but without a specified function, it cannot mathematically cap an infinite series.
  2.  **Diminishing Marginal Utility:** The subjective value (utility) of money grows slower than the face value. £1 million is not worth 1,000,000 times £1.
      *   *Verdict:* **Substantive and Defensible.** This is Daniel Bernoulli's actual solution. It posits a concave utility function (usually logarithmic).
  3.  **Categorical Incommensurability:** Certain goods and uncertain goods are fundamentally different kinds of thing and cannot be compared on a single scale.
      *   *Verdict:* **Radical and Generally False.** Standard economics assumes commensurability via utility. Accepting this would break most pricing models, not just this paradox.
  4.  **Finite Bankroll:** No casino possesses infinite capital; the payout series must truncate physically.
      *   *Verdict:* **Substantive and Defensible.** This resolves the paradox practically rather than theoretically, rendering the expected value finite.

  **What the Economist Meant**

  Your economist almost certainly intended claim #2 (Diminishing Marginal Utility). She was translating 'concave utility function' into pub talk. She was sloppy, however. As you noted, the proverb implies a fixed exchange rate (one certain bird equals two uncertain ones). A fixed discount rate cannot tame an infinite series; the discount must grow as the payout grows. The proverb captures the *direction* of the solution (risk aversion) but fails the *magnitude* test required to tame infinity.

  **Resolving the Paradox**

  Does adopting claim #2 get her out of the paradox? Yes. If you maximise expected *utility* rather than expected *monetary value*, the infinite sum converges to a finite number. The logarithmic growth of utility outpaces the linear growth of probability-weighted payouts. Claim #4 also works, but it sidesteps the theoretical issue by appealing to physical constraints.

  **The Cost to Rationality**

  Does this require giving up on expected-value maximisation as the definition of rationality? Strictly speaking, yes. But this is not a surrender of rationality; it is a refinement of what is being maximised.

  In modern economics, rationality is defined as Expected *Utility* (EU) maximisation, not Expected *Value* (EV) maximisation. The paradox arises only if you conflate money with utility. If you accept that rational agents maximise subjective satisfaction rather than objective cash, the paradox dissolves. You are not abandoning the framework of rational choice; you are correcting the input variable.

  However, if your economist meant claim #1 (a simple risk premium) without invoking diminishing marginal utility, she is wrong. A constant risk premium cannot resolve an infinite expectation. She needs the curve, not just the discount.

  **Conclusion**

  The proverb is too rigid for the mathematics required. It suggests a static trade-off, whereas the St Petersburg paradox requires a dynamic function where the marginal value of additional wealth approaches zero. Your economist was right on the theory (utility theory resolves the paradox) but lazy on the metaphor. She didn't settle the matter with that line; she merely gestured towards the settled matter elsewhere in the literature. You are correct to press her on it: the devil is not in the risk aversion, but in the curvature of the utility function.
