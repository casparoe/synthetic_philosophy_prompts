prompt: |-
  I'm a science-and-ideas journalist, and I'm writing a long read about the St Petersburg paradox — you know, the coin-flipping game where the payout doubles until tails comes up, so the expected value is infinite, and yet nobody in their right mind would pay more than a few quid to play. I rung a behavioural economist to ask how she squares that with the idea that rational choice just is expected-value maximisation, and she waved the whole thing away with 'well, a bird in the hand is worth two in the bush, isn't it' — as if that definately settled it. It didn't settle it for me, partly because the proverb is about one bird versus two, i.e. it quietly bakes in a specific exchange rate between the certain and the uncertain, and the whole point of the paradox is that no finite exchange rate looks defensible. So: take that one line apart for me. What are the different precise claims it could be making, from the flat-out trivial to the genuinely radical (something about value not being additive, say, or about certain and uncertain goods not being commensurable at all)? Lay them out as a menu, say for each whether it's a platitude, a substantive and defensible claim, or just false, and tell me which reading my economist probably had in mind. Then — the bit I actually care about — which of those readings, if any, would genuinely get her out of the paradox, and does adopting it mean giving up on expected-value maximisation as the definition of rationality, or merely amending it? Skip the references, I'll chase those myself. Hard limit: 700 words, and British spelling please, the style desk is fussy about it.
