answer: |-
  You have identified a classic philosophical equivocation. Your intuition is correct: the sentence "the brain is a computer" is not a single claim but a container for several distinct claims ranging from the banal to the highly controversial. When your club member used it first to suggest a useful model and then to deny the possibility of non-computational consciousness, they slid between these meanings without justification.

  Here is a menu of the distinct theses that slogan might express, arranged from the nearly trivial to the radical.

  ### 1. The Instrumentalist Thesis
  *   **The Claim:** Describing the brain *as if* it were a computer is a useful heuristic for generating predictions and organizing research, regardless of whether it is literally true.
  *   **Strength:** Modest / Methodological.
  *   **Classification:** **Platitude.** (Nearly everyone in cognitive science accepts this).
  *   **Relevant Evidence:** The success of computational models in predicting reaction times, error rates, or memory capacity. If the model works, the thesis holds.
  *   **The "Computation" Definition:** Loose. "Computation" here just means "complex processing of inputs into outputs."
  *   **Does it support the member's argument?** It supports the **first use** (it's a useful model), but it absolutely **does not** support the **second use** (that a simulation would be conscious). A weather simulation predicts rain, but the simulation does not get wet.

  ### 2. The Causal-Structural Thesis
  *   **The Claim:** The brain physically operates by transforming states according to rules that are isomorphic to logical or mathematical operations. Neural firing patterns literally encode information and manipulate it structurally.
  *   **Strength:** Substantive / Empirical.
  *   **Classification:** **Defensible but Disputed.** (Mainstream neuroscience leans this way, but debates exist over whether the brain is digital, analog, or hybrid).
  *   **Relevant Evidence:** Neurophysiology. Do neurons fire in discrete, binary spikes (digital) or graded potentials (analog)? Do specific neural circuits implement logic gates? If the brain is fundamentally analog or chemical in a way that resists discretization, this thesis weakens.
  *   **The "Computation" Definition:** Strict but physical. It requires physical states to map onto formal symbols.
  *   **Does it support the member's argument?** It supports the idea that the brain *does* compute, but it **does not** entail that the *mind* is software. A calculator computes, but we do not assume a calculator has a mind. This thesis describes the *vehicle*, not the *passenger*.

  ### 3. The Computational Theory of Mind (CTM)
  *   **The Claim:** Mental states (beliefs, desires, thoughts) *are* computational states. Thinking is literally a form of computation. There is no "residue" of the mind that is not computational.
  *   **Strength:** Strong / Ontological.
  *   **Classification:** **Substantive and Controversial.** (This is the core of classical cognitive science, but it is rejected by embodied cognition theorists, connectionists, and phenomenologists).
  *   **Relevant Evidence:** Philosophical arguments (e.g., Fodor's Language of Thought) vs. Counter-examples (e.g., Searle's Chinese Room, which argues syntax is not sufficient for semantics).
  *   **The "Computation" Definition:** Formal symbol manipulation.
  *   **Does it support the member's argument?** This gets closer to their **second use**. If thinking *is* computation, then a machine that computes the right things is thinking. However, it still relies on the next thesis to claim a *simulation* suffices.

  ### 4. The Substrate Independence (Functionalist) Thesis
  *   **The Claim:** Mental states depend only on the functional organization of the system, not the physical stuff it is made of. Therefore, the mind stands to the brain exactly as software stands to hardware. If you replicate the functional structure (the software) on silicon, you replicate the mind.
  *   **Strength:** Radical / Metaphysical.
  *   **Classification:** **Highly Controversial.** (This is the "Strong AI" claim).
  *   **Relevant Evidence:** Thought experiments. If we replace your neurons one by one with silicon chips that function identically, does your consciousness fade? (The "Fading Qualia" argument). Or does the fact that a simulation of a storm doesn't get wet imply a simulation of a mind doesn't think?
  *   **The "Computation" Definition:** Abstract functional role.
  *   **Does it support the member's argument?** Yes. This is the **only** thesis that licenses the claim that a detailed simulation would be conscious. It asserts that the biological substrate is irrelevant.

  ***

  ### Analysis of Your Club Member's Argument

  You suspected that two different things were doing work in the argument. You were right. Here is the breakdown of the logical gap:

  1.  **The Modest Use:** When he said "the brain is a computer" to suggest we should study it using computational models, he was relying on **Thesis 1 (Instrumentalist)** or **Thesis 2 (Causal-Structural)**. These are reasonable claims that facilitate research.
  2.  **The Radical Use:** When he used the same line to dismiss the question of whether a simulation would be conscious, he silently swapped in **Thesis 4 (Substrate Independence)**.
  3.  **The Equivocation:** He treated the truth of Thesis 1 or 2 as proof of Thesis 4. This is a non sequitur. Even if the brain *is* a computer (Thesis 2), it does not follow that *any* system running the same program is a mind (Thesis 4). A simulation of a digestive system does not digest food; it merely models the digestion. Why should a simulation of a mind be different? Thesis 4 asserts it is different, but Thesis 1 and 2 do not prove that assertion.

  ### What Proponents Usually Mean

  When people deploy "the brain is a computer" as a conversation-stopper, they usually have a **conflation of Thesis 3 and Thesis 4** in mind, often fueled by a category error regarding "information."

  They tend to believe that because we can *describe* neural activity as information processing (Thesis 2), the information processing is the *only thing that matters* ontologically (Thesis 4). They often fail to distinguish between:
  *   **Simulation:** Modeling the causal structure of a thing.
  *   **Duplication:** Actually being that thing.

  They assume that if you simulate the computation perfectly, you have duplicated the mind. This ignores the possibility that consciousness might depend on the specific biological causal powers of the brain (a view held by John Searle and others), not just the abstract pattern of the computation.

  ### A Note on "Information Processing"

  You mentioned a worry about conflating "computation in the strict formal sense" with "any physical process loosely described as information processing." This is a crucial distinction known as the **Triviality Argument** (championed by philosophers like Hilary Putnam and John Searle).

  *   **The Worry:** If "computation" just means "one state follows another according to physical laws," then *everything* is a computer. A wall, a bucket of water, and a brain all change states over time.
  *   **The Consequence:** If everything is a computer, saying "the brain is a computer" tells us nothing special about the brain.
  *   **The Fix:** To make the claim substantive (Thesis 2 or 3), "computation" must mean **formal symbol manipulation** where the physical states are assigned semantic value (0s and 1s, or logical predicates) by an observer or a specific functional role. Your club member likely glossed over this. If they mean the brain is a computer in the trivial sense (physical causality), their claim is true but useless. If they mean it in the strict sense (symbol manipulation), it is an empirical claim that is far from settled.

  ### Summary for Your Club

  If you return to this discussion, you might propose that the club agree to ban the sentence "the brain is a computer" for one meeting. Instead, ask your member to specify which of the four theses above they are defending.

  *   If they defend **Thesis 1**, ask: "Does a useful model guarantee ontological identity?" (Answer: No).
  *   If they defend **Thesis 4**, ask: "Does a simulation of a storm get things wet? If not, why does a simulation of a mind feel pain?"

  Your dissatisfaction was philosophically virtuous. You spotted an equivocation between a methodological tool and a metaphysical conclusion.
