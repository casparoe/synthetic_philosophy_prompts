          *   Push the "Duty" term: Sell a placebo ballot for home use since the election outcome doesn't matter for the warm glow.
          *   Include one dissenting quote from an invented colleague (collective action problem), brushed off with "my one vote doesn't cause anything."
          *   **Constraint:** No real economists or books cited. Invented people/stats only.
          *   **Length:** Around 600 words.
          *   **Tone:** Deadpan, no winking at the reader.

  2.  **Drafting - Section by Section:**

      *   **Header:** Institute for Rational Voting, Title, Author (invented).
      *   **Introduction:** Establish the premise. Voting is an investment. Most people are losing money (time/effort) on bad assets (national elections).
      *   **The Calculus:** Break down the equation. $R = (P \times B) - C + D$.
          *   $P$ (Probability of being pivotal): Tiny in national, higher in local.
          *   $B$ (Benefit): Huge nationally, modest locally.
          *   $C$ (Cost): Gas, time, registration.
          *   $D$ (Duty/Warm Glow): The real driver.
      *   **Strategy 1: Pivotality Arbitrage:** Don't vote President. Vote for the Water Commissioner in District 4. That's where the math works.
      *   **Strategy 2: Monetizing Duty:** If $D$ is the main value, decouple it from the ballot. Introduce the "Home Ballot™".
      *   **The Dissent:** Quote "Dr. Aris Thorne" warning about collapse. Dismiss it using the paradox itself (my advice won't change the aggregate).
      *   **The Worksheet:** A little form to calculate personal $D$ value.
      *   **Conclusion:** Sign off.

  3.  **Refining the Voice:**
      *   Needs to sound corporate, clinical, slightly sociopathic but logical.
      *   Avoid "lol voting is dumb." Instead, "voting is inefficient unless optimized."
      *   Ensure the math looks plausible but leads to absurd conclusions.

  4.  **Drafting - Content Check:**
      *   *Word Count:* Need to watch this. 600 words is tight but doable.
      *   *No Real Names:* Use "Dr. Aris Thorne," "Institute for Rational Voting," etc.
      *   *Worksheet:* Needs to be included within the word count.
      *   *Deadpan:* No "just kidding."

  5.  **Writing - First Pass (Mental or Scratchpad):**
      *   Title: Make Your Vote Count (Literally).
      *   Intro: Stop voting emotionally. Start voting actuarially.
      *   Equation: Expected Value = (Chance of Tie * Policy Difference) - Cost + Civic Warmth.
