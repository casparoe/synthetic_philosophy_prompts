      *   **Title:** Something like "Make Your Vote Count (Literally)."
      *   **Voice:** Smug consultant, deadpan, monetizing the paradox, not solving it.
      *   **Key Content Requirements:**
          *   Get the calculus right (Pivotality * Stakes - Cost + Duty/Warm-Glow).
          *   Treat "Duty" as a consumer good/itemizable cost.
          *   Include a worksheet to price civic virtue.
