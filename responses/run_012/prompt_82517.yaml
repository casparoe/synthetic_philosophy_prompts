prompt: |-
  ok so for our school paper's satire page i said I'd do the big piece this month and I actually want it to be about something. My econ teacher offhandedly mentioned the paradox of voting — the one where your chance of being the deciding vote in a big election is like one in a few million, so by the usual cost/benefit math voting looks irrational, and the real puzzle is why so many people do it anyway — and I have not been able to stop thinking about it since.

  Can you write me the piece? I want it to be a how-to column / pamphlet from an invented organization, like The Institute for Rational Voting, with a title something like "Make Your Vote Count (Literally)." Voice of a smug consultant who has fully accepted the paradox and decided not to solve it but to monetize it.

  The jokes have to come from the actual structure of the thing, not from "voting is dumb lol." So:

  - Get the calculus right. There's the term for how likely you are to be pivotal times how much the outcome matters, minus the cost of voting, plus the warm-glow / duty term. The pamphlet should treat that duty term as a consumer good you can itemize, with a little worksheet at the end where readers price their own civic virtue in dollars.
  - The pivotality term is tiny but not zero, and the stakes can be huge, so the pamphlet shouldn't just wave it away as zero. It should do the annoying arithmetic, then recommend voting in tiny local races — school board, water district — where a handful of votes really do decide things, and skipping the big ones. Which is deranged advice for a get-out-the-vote pamphlet and that's the point.
  - Push the duty term all the way. If the warm glow is doing all the work, the actual election doesn't matter, so the Institute starts selling a placebo ballot you fill out at home. Let that reductio land without the narrator noticing it.
  - Include one dissenting quote from an invented colleague who says that if everyone reasons like this, elections collapse, and have the narrator brush it off with the "my one vote doesn't cause anything" move — the reader should be able to see it's not really brushed off.

  Please dont quote or cite any real economists or books, I can't look anything up at home and my teacher will fact check me. Invented people and made-up stats only. Around 600 words, with subheads and the worksheet. Keep it deadpan the whole way — no winking at the reader that it's a joke.
