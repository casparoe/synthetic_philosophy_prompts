answer: |-
  # Activity Design: "The Garage Hiring"

  ## 1. The Setup
  **Room:** Village hall. Tables arranged for three teams of 4–5 people.
  **Time:** 90 minutes.
  **Vibe:** Collaborative puzzle, not a test. Emphasise that this trick fools professional statisticians.
  **Materials Needed:**
  *   **Job Cards:** 60 cards total (20 per team). See *Preparation* below.
  *   **Betting Tokens:** 30 poker chips, dried beans, or bottle caps per team.
  *   **Tally Sheets:** A4 paper with two columns (Ali / Ben) and rows for "Easy", "Hard", "Total".
  *   **Scenario Envelopes:** 3 identical envelopes, one per team.
  *   **Prize:** A tin of biscuits.

  ## 2. Preparation (1 Hour)
  You need to create three identical sets of **Job Cards**. Each set represents one month of work at the garage.

  **The Deck (20 Cards per Team):**
  Print or write these on index cards (approx. business card size). Use a green dot for "Fixed" and a red dot for "Not Fixed".
  *   **Ali / Easy / Fixed:** 2 cards
  *   **Ali / Easy / Failed:** 0 cards
  *   **Ali / Hard / Fixed:** 4 cards
  *   **Ali / Hard / Failed:** 4 cards
  *   **Ben / Easy / Fixed:** 7 cards
  *   **Ben / Easy / Failed:** 1 card
  *   **Ben / Hard / Fixed:** 0 cards
  *   **Ben / Hard / Failed:** 2 cards

  *(Check the maths: Ali wins Easy (100% vs 87.5%). Ali wins Hard (50% vs 0%). But Ben wins Total (70% vs 60%).)*

  **The Tally Sheets:**
  Draw three rows: "Easy Jobs", "Hard Jobs", "ALL Jobs". Two columns: "Ali", "Ben". Leave space for numbers.

  **The Scenario Envelopes:**
  Inside each envelope, place a single slip of paper titled **"Manager's Log – Confidential"**.
  *   *Text:* "Note on Job Assignment: Ali is our senior mechanic. He *requests* the Hard jobs because he specialises in engines. Ben is newer and takes whatever is left."

  **The Twist Envelopes (Keep these hidden until Round 3):**
  Prepare 3 more envelopes titled **"Alternative Log"**.
  *   *Text:* "Note on Job Assignment: Ben is our fastest mechanic. The Boss *assigns* him the Easy jobs to clear the queue. Ali gets the Hard jobs because he's too slow for the easy ones."

  ## 3. Rules and Roles
  **Teams:** "The Board of Directors."
  **Goal:** Maximise your team's "Trust Tokens."
  **Roles (assign within teams to prevent domination):**
  *   *The Sorter:* Physically handles the cards.
  *   *The Scribe:* Writes numbers on the Tally Sheet.
  *   *The Bettor:* Places the tokens.
  *   *The Speaker:* Reports to the room.

  **Currency:** Each team starts with 10 Tokens.
  **Winning:** The team with the most tokens at the end gets the biscuits. (But emphasize the real win is understanding the trick).

  ## 4. Timeline (90 Minutes)

  ### 0:00 – 0:10: Introduction & Deal
  *   Welcome everyone. Acknowledge the "maths flinch": "Tonight involves numbers, but no calculations harder than counting fingers. If you feel stuck, you're exactly where you need to be."
  *   Explain the story: "We run a village garage. We have two mechanics, Ali and Ben. We have 20 job cards from last month. Your job is to decide who to keep on for next month."
  *   Deal the 20 cards to each team. Give them tokens and tally sheets.

  ### 0:10 – 0:30: Round 1 (The Trap)
  *   **Instruction:** "Sort the cards into two piles: Easy Jobs and Hard Jobs. Count how many each mechanic fixed in each pile."
  *   Teams sort and count. They will find Ali has a higher success rate in *both* Easy and Hard piles.
  *   **The Bet:** "Based on this, who is the better mechanic? Bet up to 5 tokens on your choice."
  *   *Expected Outcome:* Almost everyone bets on Ali. They feel confident. They have seen the data with their hands.
  *   **Collect Bets:** Take the tokens. Do not pay out yet.

  ### 0:30 – 0:45: Round 2 (The Reversal)
  *   **Instruction:** "Now, ignore the difficulty. Mix all the cards together. Count the total Fixed vs. Total Jobs for Ali and Ben."
  *   Teams recount. They will find Ben has a higher overall success rate (14/20 vs 12/20).
  *   **The Reveal:** "The garage owner looks at the bottom line. Ben saved the garage more money overall. Anyone who bet on Ali loses their tokens."
  *   **Reaction:** Expect confusion. "But Ali won both categories!" Let them argue for 5 minutes. Do not explain yet.
  *   **Payout:** Return tokens to those who (rarely) bet on Ben.

  ### 0:45 – 0:60: Round 3 (The Sting)
  *   **Instruction:** "You have the numbers. They haven't changed. But you're missing the story. Open the **Manager's Log** envelope."
  *   Teams read the first log (Ali requests Hard jobs).
  *   **Discussion:** "Does this change who you trust? Discuss."
  *   *Most will say:* "Ali is the specialist. The Total number is unfair to him."
  *   **The Twist:** "Wait. We found another log in the filing cabinet. Open the **Alternative Log**."
  *   Teams read the second log (Boss assigns Ali Hard jobs because he's slow).
  *   **The Critical Question:** "The cards are the same. The numbers are the same. The only thing that changed is *why* Ali got the hard jobs.
      *   If Log 1 is true, who do you hire? (Likely Ali for skill).
      *   If Log 2 is true, who do you hire? (Likely Ben for efficiency).
      *   Bet your remaining tokens on who you hire for *next month*."

  ### 0:60 – 0:75: Round 4 (The Judgment)
  *   **Instruction:** "One last thing. Next month, the garage has signed a contract. We are *only* doing Hard Jobs."
  *   **Question:** "Who do you want working then?"
  *   *Answer:* Ali (regardless of the log, he fixes 50% of hards, Ben fixes 0%).
  *   **Instruction:** "Okay, change the contract. Next month is a mix, just like before."
  *   **Question:** "Who do you want now?"
  *   *Answer:* Depends on the Log (The Causal Story).
  *   Have teams place final bets. Reveal that different teams might be "right" depending on which story they believed.

  ### 0:75 – 0:90: Debrief
  *   Gather the room. Put the Tally Sheets on the wall.
  *   **Key Points to Hit (in your own words):**
      1.  **The Arithmetic:** "Did anyone make a counting mistake?" (No). "So the maths wasn't the problem."
      2.  **The Reversal:** "You saw Ali win twice, then lose once. That's not a trick of the numbers, it's a trick of the *weighting*. Ben did mostly easy jobs. That inflated his total."
      3.  **The Sting:** "When we opened the logs, the numbers didn't move. But your *decision* flipped. That's the point. The numbers can't tell you which average is the 'right' one. Only the story can do that."
      4.  **The Takeaway:** "If you see a statistic in the news, don't just check the sum. Ask: 'Who put these groups together? Was it random, or was there a reason?' The hard part isn't the calculation. It's the judgement."
  *   Award biscuits.

  ## 5. Honest Note: What Will Go Wrong
  1.  **Counting Errors:** With 20 cards, someone will miscount.
      *   *Fix:* Have a "Master Sheet" for yourself. If a team is wildly out, quietly suggest they swap a card with another team to "verify the print." Or, intervene: "Let's do a quick room count on the Hard Jobs."
  2.  **Math Freeze:** One or two people will zone out during the counting.
      *   *Fix:* The Roles. Ensure the "Sorter" and "Scribe" are the ones handling the numbers. The "Speaker" can be the person who is anxious about maths; their job is just to talk about the *feeling* of the game.
  3.  **The "Gotcha" Feeling:** People might feel tricked and become defensive.
      *   *Fix:* Frame it early. "This is called Simpson's Paradox. It fools PhDs. If you feel confused, it means your brain is working correctly." Validate the confusion as intelligence, not failure.
  4.  **Time Creep:** Round 2 arguments can drag on.
      *   *Fix:* Be the timekeeper. "I know it feels wrong. Hold that feeling. We need it for the next round. Move on."

  ## 6. Limitations: What You Must Supply
  No arrangement of cards can reproduce the **concept of Causal Diagrams**.
  *   **The Gap:** The activity shows that *stories change decisions*. It does not teach them *how to verify the story*.
  *   **Your Job:** In the debrief, you must explicitly state: "Tonight, I gave you the logs. In real life, the logs are hidden. You have to ask: 'Is this grouping natural (like gender/age) or is it chosen (like job assignment)?' If the grouping is chosen by the people in the data, trust the subgroups. If the grouping is random, trust the total."
  *   **The Unfeelable:** They cannot feel *probability*. They see fixed outcomes (ticks/crosses). You need to remind them that in the real world, next month's results might differ even if they hire the "right" person. The cards imply certainty; life does not.

  ## 7. Facilitator's Cheat Sheet (The Maths)
  *Keep this in your pocket.*
  *   **Ali Easy:** 2/2 (100%)
  *   **Ben Easy:** 7/8 (87.5%) -> **Ali Wins**
  *   **Ali Hard:** 4/8 (50%)
  *   **Ben Hard:** 0/2 (0%) -> **Ali Wins**
  *   **Ali Total:** 6/10 (60%)
  *   **Ben Total:** 7/10 (70%) -> **Ben Wins**
  *   **Why?** Ben did 80% of his work on Easy jobs. Ali did 50% of his work on Easy jobs. Ben's "easy" success dragged his total up.

  ## 8. Final Word
  You are not teaching them statistics. You are teaching them **skepticism**. The cards are just the prop. The real activity is the conversation at the tables when they realise the numbers lied to them. Let that conversation happen, even if it eats into your debrief time. That friction is where the learning lives.
