answer: |-
  **Final Exam: Games, Proofs, and Paradoxes**
  **Question 1 (25 Marks)**

  Consider **Giveaway Hex** (sometimes called Misere Hex). The board and rules are identical to standard Hex: players alternate placing stones on a rhombic grid of hexagons, attempting to form a connected chain linking their two assigned opposite sides. The single difference is the winning condition: in Giveaway Hex, the first player to connect their two sides **loses**.

  Write an essay of approximately 700–800 words addressing the following three points:

  1.  **The Breakdown:** The standard strategy-stealing argument proves the first player has a winning strategy in standard Hex. Explain precisely which premise of this argument fails when applied to Giveaway Hex. You must provide a concrete description of a board situation where possessing an "extra" stone is a liability rather than an asset.
  2.  **The Logical Gap:** Even in standard Hex, the strategy-stealing argument does not explicitly construct a winning strategy. Explain exactly what the argument *does* establish about the second player, and identify the specific theoretical ingredient required to bridge the gap from "the second player cannot win" to "the first player wins."
  3.  **The Epistemological Coda:** Reflect on the nature of the knowledge produced here. We conclude a winning strategy exists without being able to exhibit it. Drawing on our Week 2 discussions of non-constructive existence, argue whether this counts as "knowing" the game is solved.

  ***

  **Model Answer**

  The strategy-stealing argument is a quintessential non-constructive proof, but its validity relies on specific structural properties of the game being analyzed. When we transpose the argument from standard Hex to Giveaway Hex, the logic fractures because the underlying assumption regarding board state valuation is inverted.

  In standard Hex, the strategy-stealing proof begins by assuming the second player (P2) has a winning strategy. The first player (P1) makes an arbitrary opening move, then ignores that stone and mimics P2's strategy as if they were the second player. If the strategy ever calls for playing on the already-occupied arbitrary stone, P1 plays elsewhere randomly. The crux of the argument is the assumption that having an extra stone on the board is never a disadvantage. In standard Hex, the goal is connection; additional stones can only help form paths or block opponents. This property is often called monotonicity.

  In Giveaway Hex, this premise collapses. The objective is to *avoid* connection. Consequently, board states are not monotonic; adding a stone can transform a safe position into a losing one. Consider a concrete position: suppose P1 has a chain of stones extending from their top side that reaches all but one hexagon away from their bottom side. In standard Hex, this is a winning threat; P1 needs only to fill the final gap. In Giveaway Hex, this position is lethal. If P1 is forced to place a stone in that final gap—either by their own strategy or because the "stolen" strategy demands it—they complete the chain and immediately lose.

  When P1 attempts the strategy steal in Giveaway Hex, they place an arbitrary stone. If that stone happens to lie on a path that the stolen strategy eventually completes, P1 is forced to complete a losing chain. In standard Hex, completing that chain would validate the steal (proving P1 wins); in Giveaway Hex, it causes P1 to lose. Therefore, P1 cannot safely claim that "an extra stone doesn't hurt." Because the arbitrary stone might be the fatal link in a chain P1 is trying to avoid, the contradiction never materializes. The argument fails not because the logic is invalid, but because the game violates the condition that extra resources are strictly beneficial.

  Moving to standard Hex, we must be precise about what the successful strategy-stealing argument actually proves. It establishes a contradiction from the assumption that P2 has a winning strategy. Therefore, it proves $\neg(\text{P2 has a winning strategy})$. It does *not*, on its own, prove that P1 has a winning strategy. In logic, $\neg(\neg A)$ does not always imply $A$. There is a gap between "P2 cannot force a win" and "P1 can force a win."

  To bridge this gap, we require the theorem of **determinacy** for finite, perfect-information games without chance (often attributed to Zermelo). This theorem states that in such games, one of three conditions must hold: either P1 has a winning strategy, P2 has a winning strategy, or both players can force a draw. Hex cannot end in a draw (a property proven separately via the Brouwer fixed-point theorem or a pairing argument). Since draws are impossible, and we have proven P2 does not have a winning strategy, it follows by elimination that P1 must have a winning strategy. Without the determinacy theorem and the no-draw property, the strategy-stealing argument would merely leave the game's status unresolved.

  This leads to the epistemological status of the conclusion. We have proven the existence of a winning strategy for P1, yet the proof provides no method to find it. It is purely existential. In our Week 2 discussion of non-constructive mathematics, we distinguished between classical existence ($\exists x, P(x)$ is true) and constructive existence (we can compute or exhibit an $x$ such that $P(x)$).

  Does this count as knowledge? From a classical realist perspective, yes. The game is determined, the truth conditions for "P1 wins" are satisfied, and we have a valid deductive proof of that fact. We know *that* a strategy exists. However, from an intuitionist or constructivist perspective, this is not full knowledge. To "know" the solution to a game implies knowing how to play it. If we cannot distinguish the winning opening move from a losing one, our knowledge is practically inert. We possess a "that" knowledge (knowledge of fact) without "how" knowledge (knowledge of procedure). In the context of game theory, where the utility of a solution lies in its implementation, the strategy-stealing argument leaves us in a state of informed ignorance. We know the treasure is in the room, but we have no map to find it. Thus, while mathematically sound, the proof highlights the limitations of classical existence claims when applied to procedural problems.

  ***

  **Marking Scheme (Total: 25 Marks)**

  **Part 1: The Breakdown (Giveaway Hex) – 10 Marks**
  *   **4 Marks:** Identifies that the strategy-stealing argument relies on the assumption that an extra piece is never a disadvantage (monotonicity/benefit of extra moves).
  *   **4 Marks:** Provides a concrete scenario where an extra stone is a liability. (e.g., "A chain one stone short of completion is safe in Giveaway Hex; adding the final stone causes a loss." OR "The arbitrary stone might complete a losing path.")
  *   **2 Marks:** Explains why this breaks the mimicry/copycat logic (P1 cannot ignore the stone because it might force a loss).
  *   **Penalty:** Deduct 3 marks if the student writes "the game isn't monotone" without explaining *why* that matters or what monotonicity means in this context.
  *   **Penalty:** Deduct 2 marks if they claim the argument proves P2 wins Giveaway Hex (the question asks why the *standard* argument fails, not for the actual solution).

  **Part 2: The Logical Gap (Standard Hex) – 10 Marks**
  *   **4 Marks:** Correctly states that the argument only proves $\neg(\text{P2 wins})$ / "P2 has no winning strategy."
  *   **4 Marks:** Identifies the missing ingredient: **Determinacy** (Zermelo's Theorem) AND **No-Draws**. (Must mention that we need to know someone *must* win).
  *   **2 Marks:** Clearly explains the elimination logic: (P1 wins OR P2 wins) AND NOT (P2 wins) $\rightarrow$ P1 wins.
  *   **Penalty:** **Automatic 5-mark deduction** if the student claims the strategy-stealing argument identifies the winning first move or tells P1 how to play.
  *   **Penalty:** Deduct 3 marks if they imply $\neg(\text{P2 wins})$ is logically equivalent to "P1 wins" without invoking determinacy/no-draws.

  **Part 3: The Epistemological Coda – 5 Marks**
  *   **3 Marks:** Connects the result to Week 2 themes (Constructive vs. Classical existence / Knowing "that" vs. Knowing "how").
  *   **2 Marks:** Takes a defensible stance on whether this constitutes "knowledge" (either yes or no is fine, provided it is justified).
  *   **Penalty:** Deduct 2 marks for vague hand-waving (e.g., "It is knowledge because math is truth") without referencing the non-constructive nature discussed in class.

  **General Writing & Constraints**
  *   **Word Count:** +/- 10% of 750 words is acceptable. Significant deviation (-20% or +30%) incurs a 1-mark penalty.
  *   **Clarity:** 1 Mark reserved for overall coherence and structure.
  *   **Pet Peeve Check:** Ensure the "monotonicity" and "winning move" penalties above are applied strictly.
