prompt: |-
  Act as a philosopher of social science who also knows what it's like to work on a copy desk. Think this through carefully before you write, and start by brainstorming the distinctions you'll need, because the ask is to build me something usable, not an essay.

  I edit the ideas section of a magazine, and we keep printing sentences like 'the Japanese prefer consensus' or 'Brazilians are loose about time' — sometimes a whole essay rests on one, sometimes it's just color in a travel piece. I don't want the blanket ban half my colleagues argue for ('never generalize about a people') and I don't want the free-for-all we have now. So give me a procedure an editor can run on a sentence before it goes to press: the questions in order, what counts as a good enough answer to each, where it stops and the sentence gets cut or rewritten, and where it's a judgment call a person just has to make. Constraints: it has to fit on one side of paper, work for a copy editor with no theory background, and anything it can't settle comes to me.

  Two things I'd like it to use, if they're real and not just my invention: a distinction between a sentence that means 'lots of them are like this' and one that means 'this is what it is to be one of them', and some way of handling the fact that 'the Danes are trusting' can be roughly true of a population and still useless or unfair as a claim about the particular Dane you're describing. It should also say something about headlines, and about generalizing about the powerful (a government, an industry, a billionaire class) versus the powerless, because I suspect those two shouldn't be treated the same.

  Then run it on three cases: 'Israelis are direct'; 'the Chinese are good at long-term planning', in a piece about industrial policy; and 'Newfoundlanders would give you the shirt off their backs', which is from a writer about her own family and which I'd like to survive — so tell me honestly if it doesn't. Finish by saying what the procedure cant do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of social science + experienced copy desk editor. (Needs to be theoretically sound but practically usable, concise, and actionable).
      *   **Task:** Create a procedure/checklist for editors to evaluate generalizations about groups of people before publication.
      *   **Constraints:** One side of paper (concise), usable by a copy editor with no theory background, escalates unresolved issues to the section editor (the user).
      *   **Specific Requirements:**
          *   Distinguish between statistical/descriptive ("lots of them") vs. essentialist ("this is what it is to be one").
          *   Address the ecological fallacy (true of population, unfair to individual).
          *   Address headlines specifically.
          *   Distinguish between generalizing about the powerful vs. the powerless.
      *   **Test Cases:** "Israelis are direct"; "The Chinese are good at long-term planning" (industrial policy context); "Newfoundlanders would give you the shirt off their backs" (personal/family context).
      *   **Ending:** Acknowledge limitations (what the procedure can't do).

  2.  **Brainstorming Distinctions & Concepts:**
      *   *Essentialism vs. Regularity:* Is the trait inherent/immutable (bad) or a observed pattern/contextual (okay)?
      *   *Ecological Fallacy:* Group average $\neq$ Individual trait. Need to flag if the text applies the group trait to a specific person without nuance.
      *   *Power Dynamics:* Generalizing about a ruling class/government is often political analysis; generalizing about a marginalized ethnic group is often stereotyping.
      *   *Headlines:* Headlines amplify and flatten. They need higher scrutiny.
      *   *Evidence:* Is there data, anecdote, or just vibes?
      *   *Function:* Is the generalization doing work (explaining a policy) or just lazy color (filler)?
      *   *Insider vs. Outsider:* Is the writer part of the group? (Self-generalization is different).

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Goal:* Make it a flowchart or a numbered list with stop/go signals.
      *   *Tone:* Professional, direct, instructional.
      *   *Structure:*
          1.  Header (Title, Purpose).
          2.  The Filter (Questions 1-5).
          3.  Special Rules (Headlines, Power).
          4.  Disposition (Pass, Rewrite, Kill, Escalate).
      *   *Refining the "Two Things":*
          *   *Regularity vs. Essence:* Call it "Pattern vs. Nature."
          *   *Group vs. Individual:* Call it "The Average vs. The Person."
      *   *Refining Power:* "Up vs. Down" generalizing.

  4.  **Developing the Content (incorporating philosophy):**
      *   *Philosophical underpinning:* Avoid ontological claims about "national character." Focus on epistemic justification (how do we know?) and ethical consequence (what harm does it do?).
      *   *Copy Desk reality:* Needs to be fast. "If X, then Y."
      *   *The "Newfoundlanders" case:* This is tricky. It's a trope, but it's also self-identification/family history. Needs a specific exemption or nuance clause for memoir/insider writing.

  5.  **Drafting the Checklist (Mental Simulation):**
      *   *Q1: Is it a headline?* If yes, stricter rules.
      *   *Q2: Who is being generalized?* Powerful vs. Marginalized.
      *   *Q3: Pattern or Nature?* "Many" vs. "Are."
      *   *Q4: Individual application?* Does it judge a specific person by this?
      *   *Q5: Evidence?*
      *   *Decision:* Pass, Fix, Kill, Escalate.

  6.  **Refining for "One Side of Paper":**
      *   Keep text tight. Use bolding for key decision points.
      *   Create a "Traffic Light" system (Green, Yellow, Red).

  7.  **Running the Test Cases:**
      *   *Israelis are direct:* High risk of essentialism. Context matters (military culture vs. ethnicity). Likely needs rewrite to "Directness is valued in..." or escalation.
      *   *Chinese/Long-term planning:* Industrial policy context helps. It's about statecraft, not souls. But "The Chinese" is too broad. Should be "Beijing's planners." Power dynamic: State vs. People.
      *   *Newfoundlanders/Shirt off backs:* Memoir/Insider. "Would" implies hypothetical/cultural norm, not factual claim about every individual. Likely pass if context is clear it's the writer's experience.

  8.  **Final Polish:**
      *   Ensure the voice is right (Philosopher + Editor).
      *   Check constraints (One page, no theory jargon).
      *   Add the "What this can't do" section (Philosophy can't solve politics).

  9.  **Self-Correction during drafting:**
      *   *Critique:* Is the power distinction too vague?
      *   *Fix:* Define it as "Institutions/Elites" vs. "Ethnicities/Marginalized Groups."
      *   *Critique:* Is the Newfoundland case too easy to pass?
      *   *Fix:* Add a condition: "Only if the writer claims membership or deep long-term immersion."
      *   *Critique:* Make sure the distinction between "lots of them" and "what it is to be one" is explicit in the questions.
      *   *Fix:* Question 3 specifically addresses "Are" vs. "Often."

  10. **Final Review against constraints:**
      *   One side of paper? (Yes, if formatted tightly).
      *   Copy editor friendly? (Yes, step-by-step).
      *   Escalation path? (Yes, "Refer to Section Editor").
      *   Test cases included? (Yes).
      *   Limitations included? (Yes).

  (Proceed to generate output based on this thought process.)
answer: |-
  # THE GENERALIZATION FILTER
  **For:** Copy Editors, Ideas & Travel Sections
  **Purpose:** To distinguish useful cultural observation from harmful stereotyping without banning generalization entirely.
  **Rule:** If a sentence fails a **STOP** condition, cut or escalate. Do not pass to print.

  ### PHASE 1: THE HEADLINE CHECK
  **Is this generalization in a headline or deck?**
  *   **YES:** Headlines flatten nuance. If the generalization attributes a psychological trait to a nationality/ethnicity (e.g., *"Why Germans Are Efficient"*), **CUT/REWRITE**. Headlines must describe the *argument*, not the *people*.
  *   **NO:** Proceed to Phase 2.

  ### PHASE 2: POWER & POSITION
  **Who is being generalized about?**
  *   **The Powerful (States, Corporations, Elites, Industries):** e.g., *"Wall Street is short-sighted."*
      *   *Standard:* Political analysis. Permissible if supported by evidence of behavior/policy.
  *   **The Less Powerful (Ethnicities, Nationalities, Marginalized Groups):** e.g., *"The Poor are resilient."*
      *   *Standard:* High scrutiny. Risk of stereotyping is high. Proceed to Phase 3.

  **Who is writing?**
  *   **Insider/Memoir:** Writer claims membership or deep familial tie (e.g., *"My people, the Newfoundlanders..."*).
      *   *Standard:* Permissible as self-description. Proceed to Phase 3.
  *   **Outsider:** Writer is observing a group they do not belong to.
      *   *Standard:* High scrutiny. Proceed to Phase 3.

  ### PHASE 3: THE NATURE OF THE CLAIM
  **Does the sentence claim this is *what they are* or *what they do*?**
  *   **Essentialist (STOP):** Implies the trait is innate, immutable, or defines the group's soul.
      *   *Trigger Words:* "Are," "Is," "Inherent," "Naturally."
      *   *Example:* "Brazilians *are* loose about time." (Implies nature).
      *   *Action:* **REWRITE** to describe behavior or context ("Timekeeping is often treated flexibly...").
  *   **Regularist (GO):** Implies a observed pattern, habit, or social norm.
      *   *Trigger Words:* "Often," "Tend to," "Value," "Prioritize."
      *   *Example:* "Japanese firms *prefer* consensus." (Describes a process).
      *   *Action:* Proceed.

  **Is the trait applied to a specific individual?**
  *   **The Ecological Trap (STOP):** Using the group generalization to explain a specific person's action without further evidence.
      *   *Example:* "Li signed the deal late, because *the Chinese are good at long-term planning*."
      *   *Action:* **CUT.** Group averages cannot explain individual motives.
  *   **Contextual (GO):** The generalization sets the scene, not the motive.
      *   *Example:* "In a culture where long-term planning is valued, Li signed..."
      *   *Action:* Proceed.

  ### PHASE 4: UTILITY VS. COLOR
  **What work is the sentence doing?**
  *   **Lazy Color (STOP):** It adds "flavor" but no information. Could be swapped for any other country.
      *   *Test:* If you swapped "Italian" for "Mexican," does the sentence still make sense? If yes, it's a cliché.
      *   *Action:* **CUT.**
  *   **Argumentative Load (GO):** The rest of the essay depends on this premise.
      *   *Action:* **ESCALATE to Section Editor.** Verify the evidence supports the load.

  ---

  ### DISPOSITION KEY
  *   **PASS:** Clears all phases.
  *   **REWRITE:** Change "Are" to "Often/Tend"; move from Headline to Text; shift focus from Nature to Norm.
  *   **CUT:** Fails a STOP condition; Lazy Color; Ecological Trap.
  *   **ESCALATE:** High stakes, Insider/Outsider ambiguity, or heavy Argumentative Load. Send to Section Editor.

  ***

  ### TEST CASES

  **1. "Israelis are direct."**
  *   **Phase 1:** Text (Assumed).
  *   **Phase 2:** Less Powerful (Nationality/Ethnicity). Outsider writer (Assumed).
  *   **Phase 3:** Essentialist ("Are"). **STOP.**
  *   **Verdict:** **REWRITE.**
  *   **Fix:** "Directness is a valued norm in Israeli communication." (Shifts from nature to social norm). If the essay argues this causes specific diplomatic friction, **ESCALATE** to check evidence.

  **2. "The Chinese are good at long-term planning" (in industrial policy piece).**
  *   **Phase 1:** Text.
  *   **Phase 2:** The Powerful (State/Industrial Policy).
  *   **Phase 3:** Essentialist ("Are"). **STOP.** Even for states, "are" implies nature.
  *   **Verdict:** **REWRITE.**
  *   **Fix:** "Beijing's planners prioritize long-term horizons." (Specific agents, not 1.4 billion people). This avoids the ecological fallacy and focuses on the actual decision-makers.

  **3. "Newfoundlanders would give you the shirt off their backs."**
  *   **Phase 1:** Text.
  *   **Phase 2:** Less Powerful. **Insider/Memoir** (Writer's family).
  *   **Phase 3:** Regularist/Hypothetical ("Would").
  *   **Phase 4:** Color, but permissible as cultural self-identification.
  *   **Verdict:** **PASS.**
  *   **Note:** Because the writer claims kinship, this functions as homage rather than stereotype. Ensure context makes the familial link clear so it doesn't read as an outsider's travel trope.

  ***

  ### WHAT THIS PROCEDURE CANNOT DO
  1.  **It cannot verify truth.** It checks for *harm* and *logic*, not facts. A sentence can be logically sound ("The Lobby exerts pressure") and factually wrong. That is a fact-checking issue, not a philosophical one.
  2.  **It cannot solve power imbalances.** It flags them, but it cannot stop a powerful publication from amplifying a stereotype if the Editor overrides the filter.
  3.  **It cannot replace judgment.** The "Insider" exception can be abused (e.g., a hired gun claiming "honorary" status). If the "Insider" claim feels thin, **ESCALATE**.
  4.  **It cannot fix bad writing.** A sentence can pass this filter and still be clunky, boring, or clichéd. This filter only ensures it isn't *unjust* or *categorically confused*.
