  # A Taxonomy of Liberal Comparison: A Decision Tree for Undergraduates

  ## Part I: The Decision Tree

  This instrument is designed to locate your position within the logical space of comparative political judgement. Answer the questions sequentially based on your intuitions about how the comparison *should* be made, not on which country you prefer.

  **Q1. The Definitional Question**
  If you and your interlocutor wrote down a precise checklist of what makes a country 'liberal', would those checklists match?
  *   **No** → Go to **Leaf 1 (Conceptual Indeterminacy)**.
  *   **Yes** → Proceed to Q2.

  **Q2. The Comparability Question**
  Is it possible for Country A to be more liberal in some respects and Country B in others, with no single verdict on which is 'more liberal' overall?
  *   **Yes** → Go to **Leaf 2 (Partial Order)**.
  *   **No** (One must be ranked higher) → Proceed to Q3.

  **Q3. The Subject Question**
  If Country A treats its citizens more liberally but Country B treats immigrants and minorities more liberally, is there still a single answer to 'which is more liberal'?
  *   **No** (The answer depends on who you ask) → Go to **Leaf 3 (Subject-Relative)**.
  *   **Yes** (We must generalise across the population) → Proceed to Q4.

  **Q4. The Evidence Question**
  If a country's statute book guarantees a right but the police quietly ignore it, does that freedom count towards the score?
  *   **No** (Only practice matters) → Go to **Leaf 4 (Law-in-Action)**.
  *   **Yes** (The law counts even if ignored) → Proceed to Q5.

  **Q5. The Social Context Question**
  If the law allows a lifestyle (e.g. drug use, religious expression) but social pressure makes it nearly impossible to live, is the country liberal in that regard?
  *   **No** (Social coercion negates liberty) → Go to **Leaf 5 (Permissiveness)**.
  *   **Yes** (Only state coercion counts) → Proceed to Q6.

  **Q6. The Aggregation Question**
  Should we measure multiple dimensions of liberty (economic, social, civil) and combine them into a single score, or look for the single most important factor?
  *   **Combine them** → Go to **Leaf 6 (Aggregate-Index)**.
  *   **Single factor** → Proceed to Q7.

  **Q7. The Nature of Constraint Question**
  Is the primary threat to liberty the *size* of state interference (taxes, regulations) or the *arbitrariness* of power (the ability of rulers to change rules at will)?
  *   **Size of interference** → Go to **Leaf 7 (Limited-Government)**.
  *   **Arbitrariness of power** → Proceed to Q8.

  **Q8. The Institutional Question**
  When a stable majority votes to restrict a minority's rights, does liberty survive if a constitutional court blocks the vote, or is the majority's will the final measure?
  *   **Court blocks vote (Liberty survives)** → Go to **Leaf 8 (Republican)**.
  *   **Majority will (Liberty reduced)** → Go to **Leaf 9 (Majoritarian)**.
  *   *(Note: If you believe the statute book itself is the only measure regardless of courts or majority, go to **Leaf 10 (Statutory Formalism)**).*

  ---

  ## Part II: The Leaves (Positions)

  ### 1. Conceptual Indeterminacy
  *   **Criterion:** The term 'liberal' lacks a fixed definition sufficient for ranking.
  *   **Evidence:** Philosophical analysis of the term; demonstration of intractable disagreement on metrics.
  *   **Awkward Commitment:** Renders the original question meaningless; offers no verdict, only dissolution.

  ### 2. Partial Order (Incomparable)
  *   **Criterion:** Liberty is multi-dimensional and dimensions are incommensurable.
  *   **Evidence:** Profiles showing Country A excels in civil liberty, Country B in economic liberty.
  *   **Awkward Commitment:** Accepts that political questions may have no determinate answer, which can be intellectually unsatisfying.

  ### 3. Subject-Relative
  *   **Criterion:** Liberty is not a national attribute but a status-specific experience.
  *   **Evidence:** Disaggregated data on citizens, residents, undocumented migrants, and indigenous groups (e.g. the Sámi).
  *   **Awkward Commitment:** Denies the coherence of national comparison; 'Sweden' is not one entity but several.

  ### 4. Law-in-Action
  *   **Criterion:** Liberty exists only where rights are enforceable and enforced.
  *   **Evidence:** Empirical studies of policing, court outcomes, and administrative discretion rather than statutes.
  *   **Awkward Commitment:** Requires difficult, often anecdotal empirical data; hard to standardise across borders.

  ### 5. Permissiveness
  *   **Criterion:** Liberty is the capacity to live without social or legal taboo.
  *   **Evidence:** Rates of censorship, drug decriminalisation, religious observance, and regulation of private life.
  *   **Awkward Commitment:** Risks equating licence with liberty; may overlook economic constraints on freedom.

  ### 6. Aggregate-Index
  *   **Criterion:** Liberty is a weighted sum of various civil, political, and economic metrics.
  *   **Evidence:** Composite indices (e.g. Human Freedom Index, Democracy Index).
  *   **Awkward Commitment:** The weighting of variables (e.g. property rights vs. speech) is itself a political judgement, not a neutral fact.

  ### 7. Limited-Government (Negative Liberty)
  *   **Criterion:** Liberty is the absence of state interference.
  *   **Evidence:** Tax burdens, regulatory density, size of the public sector.
  *   **Awkward Commitment:** May classify a high-tax welfare state as 'illiberal' even if it empowers citizens to act.

  ### 8. Republican (Non-Domination)
  *   **Criterion:** Liberty is the absence of arbitrary power, even if that power is not exercised.
  *   **Evidence:** Constitutional checks, judicial independence, security of tenure, protection against majority tyranny.
  *   **Awkward Commitment:** May classify a benevolent, non-interfering autocracy as 'unfree' due to the mere potential for interference.

  ### 9. Majoritarian
  *   **Criterion:** Liberty is the extent to which the popular will is realised without obstruction.
  *   **Evidence:** Legislative responsiveness, referendum outcomes, ease of passing laws.
  *   **Awkward Commitment:** Struggles to account for the protection of minorities against the 'tyranny of the majority'.

  ### 10. Statutory Formalism *(Unnamed/ Rare)*
  *   **Criterion:** Liberty is defined strictly by the text of the law, regardless of enforcement or context.
  *   **Evidence:** Comparative constitutional text, statute books.
  *   **Awkward Commitment:** Ignores the reality of ignored laws; renders the comparison purely textual and potentially fictional.
  *   **Diagnosis:** **Merely Unattractive.** While logically coherent, few defend it because it divorces law from reality entirely.

  ---

  ## Part III: Structural Diagnostics

  ### Empty or Overlapping Nodes
  *   **Leaf 8 (Republican) vs. Leaf 10 (Statutory Formalism):** These are separated by Q4 and Q8. However, in practice, they often blur. A Republican cares about the *structure* of the law (checks and balances), while a Formalist cares about the *text*. If a respondent cannot distinguish between 'arbitrary power' and 'written law', they occupy an **Overlap Zone**. The difference is one of **substance** (power vs. text), but empirically they often yield similar rankings unless the constitution is ignored.
  *   **Leaf 7 (Limited-Government) vs. Leaf 5 (Permissiveness):** These are separated by Q5. Limited-Government focuses on the *state's* footprint (tax/regulation); Permissiveness focuses on *social* taboos and private life. A respondent who cares about both equally should land in **Leaf 6 (Aggregate-Index)**. If they force a choice, the distinction is one of **emphasis** (economic vs. social).
  *   **Leaf 9 (Majoritarian):** This node is **sparsely populated**. Most liberal theorists reject the idea that majority will defines liberty, preferring constitutional protections (Leaf 8). It is not **incoherent**, but it is **unattractive** to liberals, fitting better with populist or democratic-realist positions.

  ### Handling the Awkward Cases
  *   **Statute liberal, police ignore:** Handled by **Q4**. 'Law-in-Action' says this country is illiberal; 'Statutory Formalism' says it is liberal.
  *   **Citizens vs. Immigrants:** Handled by **Q3**. 'Subject-Relative' splits the verdict; others must aggregate.
  *   **Majority vs. Court:** Handled by **Q8**. 'Republican' sides with the court (anti-domination); 'Majoritarian' sides with the voters.
  *   **Social Pressure:** Handled by **Q5**. 'Permissiveness' counts this as unfreedom; 'Limited-Government' does not.
  *   **Indigenous Minority:** Handled by **Q3** (Subject-Relative) or **Q2** (Partial Order, if their treatment is a distinct dimension).

  ---

  ## Part IV: How to Use This Handout

  This tree is a diagnostic tool, not a calculator. Its purpose is to reveal whether your disagreement with your friend is substantive (you value different things) or methodological (you measure the same things differently). When your answers land you in two leaves at once—for example, if you care equally about social permissiveness and limited government—you should acknowledge that you are effectively operating a crude **Aggregate-Index** (Leaf 6) without the weights. In such cases, the tree issues no verdict; it merely clarifies that the dispute now lies in the weighting of the criteria, not the criteria themselves. Note that the tree never issues a unconditional verdict on which country is more liberal; it only tells you *what kind of evidence* would settle the matter for your specific position. If you find yourself in **Conceptual Indeterminacy** or **Partial Order**, accept that the stalemate is not a failure of analysis but a feature of the political landscape.
