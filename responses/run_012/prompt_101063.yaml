answer: |-
  Final credence: **0.65**

  I assign a 65% probability that there is **no fact of the matter** about reference in the text-only *gavagai* case. I am more confident than your friend (0.2) because the logical core of indeterminacy survives the removal of ostension, but less confident than absolute certainty (1.0) because removing behavioral grounding weakens the naturalistic premise that makes "no fact" a coherent claim rather than just "unknown fact."

  Here is the breakdown of the four components, with my credence that each specific point *supports* the "No Fact of the Matter" (NFM) conclusion:

  ### 1. Is stimulus meaning/assent-behavior essential?
  **Credence NFM holds without it: 0.75**
  Quine's *Word and Object* argument leans heavily on stimulus meaning, but his *Ontological Relativity* argument (the proxy function) does not. Ostension creates an illusion of grounding; removing it strips away the psychological comfort that reference is fixed, exposing the structural gap. Stimulus meaning constrains translation *extensions* but never fixes *ontology*. Without it, you lose the empirical constraints on translation manuals, making the manuals *more* flexible, not less. The indeterminacy doesn't vanish; it becomes purely model-theoretic. I discount this slightly from 1.0 only because without *any* behavioral dispositions (even textual production), Quine's behaviorist definition of meaning collapses entirely, leaving nothing to be indeterminate. But since we have the corpus (dispositions to inscribe), the argument holds.

  ### 2. Does the proxy-function move survive corpus constraints?
  **Credence NFM holds despite corpus: 0.70**
  A rich corpus contains identity statements ("This gavagai is the same as that"), quantifiers, and negations. A skeptic might argue these lock reference. However, the proxy function argument is robust here: you can map 'rabbit' to 'rabbit-stage' provided you systematically reinterpret the identity predicate and quantifiers to match the new ontology. A corpus is just a set of sentences held true. If you permute the domain and adjust the interpretation of logical particles globally, truth values are preserved. The corpus constrains *consistency*, not *reference*. I lower this slightly from Q1 because a sufficiently complex corpus (e.g., containing mereological axioms) makes the required reinterpretation of logic increasingly gerrymandered, though not logically impossible.

  ### 3. Do native inferential dispositions (in text) bite harder without behavior?
  **Credence NFM holds despite inferences: 0.80**
  This is the strongest pillar for NFM. If the text shows natives inferring "Gavagai here" → "Rabbit part here," you might think reference is fixed. But you can translate that inference as "Rabbit here" → "Rabbit fusion here" by adjusting the translation of "part." Inferential roles are internal to the linguistic system. Without external behavioral checks to see if their "part" talk aligns with your physical manipulation of objects, the inferential network floats freely. You can always translate their logic to match your ontology. Removing behavioral observation makes it *impossible* to check if their inferences match yours physically, which solidifies the indeterminacy.

  ### 4. Is "No Fact" the right question vs. Underdetermination?
  **Credence NFM is the right framing: 0.50**
  This is the drag on the total number. This is the Chomsky objection. Underdetermination means there is a fact, but the data (text) is insufficient to find it. NFM means there is *nothing* to find. In the standard Quinean case, behavior *is* the meaning, so if behavior underdetermines, there is no fact. In the text-only case, if you reject Quine's behaviorism (as most do), you likely believe reference is fixed by causal history or mental content, which exist independently of the corpus. If those exist, it's merely underdetermination. If you accept Quine's naturalism (meaning is use), it's NFM. Since the text-only setup weakens the naturalistic link (marks on a page are further from "use" than live speech), the claim that there is literally *no fact* becomes metaphysically shakier, even if epistemically identical.

  ---

  ### Synthesis and Sensitivity

  **Final Calculation:**
  The logical arguments (Q1, Q2, Q3) strongly support indeterminacy (avg ~0.75). The metaphysical framing (Q4) is the weak link (0.50).
  Weighted towards the logical strength but capped by the metaphysical uncertainty: **0.65**.

  **Sensitivity Analysis:**
  This number is most sensitive to **Term 4 (NFM vs. Underdetermination)**.
  If you are a semantic realist (Kripke/Putnam), my credence drops to 0.1. If you are a verificationist/Quinean, it rises to 0.9. The text-only constraint forces the metaphysical question to the surface because you cannot hide behind "dispositions to overt behavior."

  **What Would Move the Number:**
  To move my credence significantly, I need a case where the corpus *cannot* be mapped by a proxy function without breaking the **principle of charity** or **logical coherence** itself, not just ontological preference.

  **The Thought Experiment:**
  Imagine the corpus contains a **causal genesis story** written by the natives: *"We coined 'gavagai' when we saw a rabbit hop, intending to name the animal."*
  *   **If this fixes reference:** My credence in NFM drops (toward 0.2). It suggests causal intent transcends textual structure.
  *   **If this fails to fix reference:** (Quine's reply: "intending to name the animal" is just more text, subject to the same indeterminacy—did they intend the stage? the part?) My credence rises (toward 0.8).

  If you can demonstrate that a textual description of causal intent *still* admits of ontologically distinct, empirically equivalent translation manuals, the case for NFM becomes nearly airtight. If you can show that such a description anchors reference despite the lack of ostension, the case collapses to mere underdetermination.
