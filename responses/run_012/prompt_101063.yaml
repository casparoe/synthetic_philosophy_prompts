  - is stimulus meaning / assent-behavior actually doing essential work in Quine's argument, or does it survive (or get worse) once you drop it?
  - does the proxy-function move really give you manuals that are empirically equivalent in the corpus case, or does the corpus constrain reference more than the behaviorist setup does, through patterns no proxy function can preserve?
