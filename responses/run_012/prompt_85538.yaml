prompt: |-
  I host a tiny podcast with two friends — mostly puzzles and would-you-rather, none of us have any philosophy training, we just like arguments that break our heads — and next week we're recording with a philosopher whos spent years arguing that some gambles have no expected value at all, and that this is a hole in decision theory rather than a quirk of the example. His showcase case is a coin game: flip a fair coin till it lands heads, and if it lands on flip n you win 2^n/n when n is odd and lose 2^n/n when n is even. So heads on the first flip wins you two bucks, heads on the second loses you two, third wins $8/3, fourth loses $4, and so on. Weight each payoff by its probability and the terms come out 1 − 1/2 + 1/3 − 1/4 + …, which adds up to about 69 cents if you sum it in that order, but which you can rearrange to hit any number you like, including zero and both infinities — so he says the game has no value at all. I'm told it's called the Pasadena game and that a couple of philosophers cooked it up in 2004 as a nastier cousin of the St Petersburg paradox. He's also very good at the move where he says you're only confused because you're assuming every gamble must have a value, so I want questions he can't wave away like that.

  So: draft me 8 to 10 interview questions, each with a follow-up keyed to the answer he's most likely to give. I want at least one on what undefined is even supposed to mean here — is it that the game has no value, or that our theory just can't assign one, and does that difference matter? — at least one on the rearranging business and whether the order in which the game itself generates the outcomes is somehow privileged (my friend insists it has to be, otherwise you could prove any gamble is worthless); at least one on what rationality is supposed to tell you once the value is undefined and the usual advice to maximize expected value goes silent, and whether that slides into anything goes; and at least one on whether this ever bites outside the toy case. Two things I'd like worked in because they bug me. (a) If I add a dollar to every single outcome of the Pasadena game, the new game is obviously better than the old one outcome by outcome, even though its expected value is just as undefined — so undefined clearly doesn't mean no verdict is possible, and I want him to say what that does to his argument. (b) My other friend says every actual coin flipping session ends after finitely many flips, so the whole thing is a fantasy about a game nobody can play, and separately I keep thinking that if you played it a thousand times the law of averages would sort it out, though I have a feeling thats wrong for a reason I can't articulate. If there's a natural link to machine learning I'd love that too — I work on backend stuff and I once watched a reinforcement learning demo where the value estimates just wandered off toward infinity, and I never worked out whether that was a bug in the code or a bug in the math.

  No citations or reading lists please, I'm not going to chase papers down and I'd rather the questions stand on their own. And be committed: tell me which one question you think actually corners him, why that one and not the others, what you expect him to say back, and whether that reply holds up — don't hand me six plausible readings and leave me to pick. Also say which question to open with and which one to cut if we're running long.
