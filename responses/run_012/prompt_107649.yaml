answer: |-
  Alex and Jordan are guildmates in *Aetheria*, a standard MMO played on consoles. Alex spends 300 hours grinding materials to craft the "Sunbreaker Sword," a rare item listed on the game's official marketplace with a fixed cash-out value of $500. Jordan, frustrated with Alex's playstyle, uses a guild permission exploit to delete the sword from Alex's inventory. The platform's Terms of Service guarantee reimbursement for lost items based on market value but explicitly exclude compensation for "time invested" or "emotional distress." Alex is reimbursed the $500 but quits the game, feeling the 300 hours were stolen.

  **Bottom line:** The case succeeds because it isolates institutional recognition from physical causal footprint, forcing the tests to diverge on the object and the harm.

  **Running the Tests**
  *   **The Object (The Sword):**
      *   *Receipt Test:* **Pass.** The platform's marketplace and reimbursement policy treat the sword as ownable property with a fixed monetary value. An institution recognizes the loss and compensates it.
      *   *Delete-Everything Test:* **Fail.** Suppose every trace of the sword is removed from every mind, record, and server. The reimbursement record is also wiped (as it is a trace of the sword's existence). No physical atom outside the server's specific bit-state is altered; no one remembers the sword, and no money trail remains. The world is physically identical to a world where the sword never existed.
  *   **The Harm (The 300 Hours of Labor):**
      *   *Receipt Test:* **Fail.** The platform's ToS and typical consumer courts do not treat time-in-game as compensable property. The harm is recognized as a risk of play, not a liable loss.
      *   *Delete-Everything Test:* **Pass.** Suppose every trace of the harm (the memory of the loss, the record of the hours) is removed from minds and servers. Alex's body is still 300 hours older than it would be otherwise; entropy has increased. That physical fact—that Alex's life opportunity cost was incurred—remains in the world even if the record of *why* is wiped. The world is different (Alex is older/tired) than if the harm never occurred.

  **The Load-Bearing Feature**
  The critical knob is the **medium of the harm**. The case works only because the harm is defined as *time/entropy* (physical) rather than *status/information* (digital).

  **Turning the Knob**
  If I change the harm from "300 Hours" to "Guild Reputation," the tests snap back into agreement. Reputation is informational. If every trace of the reputation loss is wiped from minds and servers, the social standing is restored instantly. No physical residue remains. Both the Object and the Harm would then Fail the Delete-Everything Test (both are just information), and the lesson collapses into "virtual things aren't physically real."

  **The Objection: "Receipt is Just Delete"**
  A skeptic will argue the Receipt Test is merely a proxy for the Delete-Everything Test: institutions only compensate things that leave causal footprints (like money changing hands). Therefore, if something passes Receipt, it must have passed Delete.
  *   *Is this right?* No. Institutions operate on norms, not just physics. The platform *chooses* to value the sword (normative) but *chooses* to ignore the time (normative), even though the time has a stronger physical footprint (aging) than the sword (bits). The Receipt Test measures social validity; the Delete Test measures causal independence. They track different ontological categories.

  **Teaching Verdict**
  This case does the job. It prevents students from saying "it's just pixels" (because the harm passes the physical reality test) and prevents them from saying "it's real because it costs money" (because the object fails the physical reality test). It shows that "realness" splits along two axes: social recognition and physical consequence. If you only wanted to show that virtual items have prices, this is over-engineered; but to show that object-reality and harm-reality can come apart, the friction between the tests is necessary.
