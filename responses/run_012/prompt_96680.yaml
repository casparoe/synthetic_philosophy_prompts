answer: |-
  Here is the audit of your seminar-mate's analogy, followed by a definite verdict.

  ### 1. The Mapping
  To see if the analogy holds, we must align the components of **Promising** with **Asserting** as your seminar-mate envisions them.

  | Component | Promising | Asserting (Seminar-mate's View) |
  | :--- | :--- | :--- |
  | **Agent** | The Promiser | The Assertor |
  | **Recipient** | The Promisee | The Audience |
  | **Content** | A future action ("I will be there") | A proposition ("The meeting is at 3") |
  | **Obligation** | To make the content true (perform) | To stand behind the content (believe) |
  | **Breach** | Non-performance (not showing up) | Insincerity (not believing it) |
  | **Release** | Promisee forgives or cancels | Audience says "never mind" or retracts interest |

  ### 2. Where the Analogy Holds (The Seduction)
  The analogy works on a superficial, social level. Both speech acts create a **commitment**.
  *   If I promise to meet you and don't, I owe you an apology.
  *   If I assert the meeting is at 3 (and believe it) but am wrong, I also owe you an apology.
  *   In both cases, I have "put myself on the hook." I have invited you to rely on me. If you rely on me and I fail, I am socially accountable.

  This explains why lying feels like a betrayal in both cases. But this is where the similarity ends. The *source* of the accountability is fundamentally different.

  ### 3. Where the Analogy Breaks
  There are three structural fractures that destroy the argument that the norm is belief rather than truth.

  **A. Control of Content (The Direction of Fit)**
  *   **Promising:** I have control over the content. When I say "I will be there," I am undertaking an obligation to *make* the world match my words. This is a **world-to-mind** direction of fit.
  *   **Asserting:** I do *not* have control over the content. When I say "The meeting is at 3," I am undertaking an obligation to ensure my words *match* the world. This is a **mind-to-world** direction of fit.
  *   **The Break:** You cannot promise the truth. You can only promise to *seek* the truth. If the norm of assertion were merely belief (like the sincerity condition of a promise), then a confidently stated falsehood would be a "successful" assertion, just as a failed attempt to keep a promise (due to a flat tire) is still a "valid" promise. But it isn't. A false assertion is defective *as an assertion*, regardless of your belief.

  **B. The Audience Necessity**
  *   **Promising:** You generally cannot promise no one. A promise requires a promisee to whom the obligation is owed.
  *   **Asserting:** You can assert things to no one. You can write a true fact in a diary, leave a voicemail that is never heard, or mutter a truth to yourself.
  *   **The Break:** If assertion were essentially a promise-like commitment to an audience, solitary assertion would be impossible or category-mistaken. But I can be wrong in my diary. I can lie to myself. The norm governs the relation between *me and the fact*, not just *me and you*.

  **C. The "Never Mind" Test (Release)**
  *   **Promising:** If I promise to pick you up, and you say, "Never mind, I found a ride," I am **released** from the obligation. The promise dissolves because its social function is gone.
  *   **Asserting:** If I tell you, "The meeting is at 3," and you say, "Never mind, I'm not going," I am **not released** from the truth value. The statement remains either true or false. More importantly, if I *knew* it was at 4 and told you 3, I still lied, even if you didn't go.
  *   **The Break:** In promising, the audience controls the obligation. In asserting, the **facts** control the correctness. Your seminar-mate's model suggests that if the audience doesn't care, the assertion doesn't matter. But truth is audience-independent.

  ### 4. Imported Features (The Smuggle)
  Your seminar-mate is quietly importing features of promising that asserting does not have:
  1.  **Voluntarism:** Promises are voluntary obligations; we choose to be bound. Assertion is often involuntary in its normativity. If you speak, you are *automatically* subject to the norm of truth, whether you want to be or not.
  2.  **Performance vs. Accuracy:** A promise is a commitment to *performance*. An assertion is a commitment to *accuracy*. You can be a good promiser (try hard) and fail. You cannot be a good assertor (try hard) and be false. If you assert falsely, you failed the act, even if you tried hard.

  ### 5. The Verdict
  **Your seminar-mate is wrong. You are right to be unconvinced.**

  The conclusion that "the norm of assertion is belief rather than truth" does not survive the audit. The analogy confuses the **condition of blamelessness** with the **condition of correctness**.

  *   **Belief is the excuse, not the rule.** If I assert something false but believed it, I am *blameless* (I didn't lie), but I am still *incorrect*.
  *   **Truth is the standard.** If I assert something true but didn't believe it (a lucky guess or a lie that turned out true), I have satisfied the truth norm but violated the sincerity norm.

  If the norm were merely belief, then confident misinformation would be just as good as knowledge. But it isn't. The point of assertion is to transfer **knowledge**, not just **sincerity**. If I tell you the bridge is safe because I believe it (but it's actually collapsed), I have failed you, even if I wasn't lying. The "hook" I am on is not just to be sincere, but to be **right**.

  ### 6. The Better Analogy
  If promising is the wrong model, what is the right one?

  **The Map.**

  *   **Mapping:**
      *   **Cartographer** = Assertor
      *   **Traveler** = Audience
      *   **Terrain** = The Facts
      *   **Map Accuracy** = Truth
      *   **Cartographer's Belief** = Sincerity

  *   **Why it works:**
      *   A map aims to represent the terrain (mind-to-world fit), just like assertion.
      *   If a map has an error because the cartographer made a mistake (false belief), the map is **defective**. It is a bad map. It doesn't matter that the cartographer "promised" to draw it well; the utility of the map depends on its accuracy, not its creator's intentions.
      *   If the cartographer lies (draws a road that isn't there), the map is also defective, but in a worse way (malice vs. incompetence).
      *   Crucially, a map is useful even if no one looks at it (solitary assertion), and saying "never mind" doesn't change the terrain the map depicts.

  **Defense of the Verdict:**
  Stick with the **Knowledge/Truth Norm**. Assertion is a tool for navigating reality, not a social contract for binding the speaker. Your seminar-mate's view collapses the distinction between *lying* (ethical breach) and *being wrong* (epistemic breach). Both are reasons to stop trusting someone, but only one is a moral sin. The other is a failure of function. Treating assertion as a promise excuses incompetence as long as it is sincere. Treating assertion as a map demands accuracy, which is what we actually need when we ask, "What time is the meeting?"
