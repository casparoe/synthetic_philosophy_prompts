answer: |-
  **The setup**

  Walk in and arrange chairs in a tight circle. Hand everyone ten poker chips (or printed tokens) and tell them these are currency: at the end, chips buy cookies (1 chip = 1 cookie). They can go into debt up to -5 chips, but debt means bringing cookies next week.

  Before explaining the game, hand out index cards. Say: "Write your name and the maximum number of chips you would pay for a 1 in 1,000,000 chance to win 10,000,000 chips. Be honest. This is private." Have them fold the cards, seal them with a bit of tape or a sticker, and drop them in a box. Collect the box immediately and put it out of sight.

  Tell them the goal is to maximize chips, but there are rules. There will be four betting rounds. You run the first two. In the middle, a volunteer will take over. No talking during betting phases. If you run out of chips, you're out unless you go into debt. Ask for a volunteer to be the "Banker" (tracks scores) and a volunteer to be the "Proposer" later. Keep the mood light; this is about snacks, not savings.

  **The rules**

  Hand out the printed sheet. It lists the "Market Rates" for the first two rounds and the constraints for the Proposer.

  **Round 1 (TA):** Cost 1 chip. Roll a d20. Win on 20 (5% chance). Payoff 25 chips. (Expected Value: +0.25 chips).
  **Round 2 (TA):** Cost 1 chip. Use a random number generator (phone) for 1–100. Win on 1 (1% chance). Payoff 150 chips. (Expected Value: +0.5 chips).

  Players decide silently whether to buy in. Collect chips, roll, pay winners. Write totals on the whiteboard.

  **Round 3 & 4 (The Proposer):** The volunteer Proposer takes the dice and the sheet. The sheet lists the **Mugger Constraint**: *Any offer must have Positive Expected Value.* To verify, (Probability × Payoff) must be greater than Cost.
  **Printed Table for Proposer:**
  | Odds | Minimum Payoff for 1 Chip Cost |
  | :--- | :--- |
  | 1 in 1,000 | 2,000 chips |
  | 1 in 1,000,000 | 10,000,000 chips |
  | 1 in 1,000,000,000 | 10,000,000,000 chips |

  The Proposer wants cookies too. They get 1 cookie from the TA for every player who accepts their offer. They can tailor offers to specific players ("I offer *you* 10 billion chips for 1 chip"). They must state the odds and payoff clearly. You (TA) act as the auditor to confirm the math is Positive EV before the bet is locked.

  **Token Economy:** Chips are tangible. Move them across the table. If someone wins Round 3, they physically get a stack of paper slips representing the millions. This highlights the absurdity of the payout versus the physical cost.

  **Phase two: the Mugger**

  This is where the game turns. Once the Proposer makes an offer using the 1 in 1,000,000 line (matching the sealed cards), introduce the **Repeat-Charge Rule**.

  Tell the Proposer: "If a player accepts your offer in Round 3, you have a contract with them. In Round 4, you may charge them 1 chip automatically without offering any new chance to win. You don't need to roll. You don't need to offer a jackpot. You just take the chip."

  The Proposer now has an incentive to get *any* acceptance in Round 3, because that guarantees them income in Round 4. They can scale the Round 3 jackpot higher ("1 in 1 trillion! 10 trillion chips!") to ensure at least one person bites.

  Players must realize that accepting the Round 3 bet isn't a one-off; it establishes a policy. If they accept the math once, they must accept it forever, even when the Propger stops offering odds and just demands tolls. The Proposer stands over the acceptors. The TA does not intervene in Round 4; the contract stands. If a player refuses to pay in Round 4, they are bankrupt and out of the snack economy. This forces the group to feel the weight of "consistent policy" versus "intuitive refusal."

  **The debrief**

  Bring out the box of sealed cards. Have everyone open theirs. Ask: "Who wrote 0 or 1 chip?" (Most will). Then ask: "Who accepted the Proposer's offer in Round 3?" (Some might).

  Map the tension. "The math says the bet is good. Your card says it's bad. Why the conflict?" Let them struggle. Guide them with questions, not answers:
  1.  **Verification:** "In Round 1, we rolled the die. In Round 3, we stipulated the odds. Does a number mean the same thing if you can't check it?"
  2.  **Policy:** "Look at the Repeat-Charge Rule. If you accept the bet once, do you own the Proposer, or do they own you?"
  3.  **Utility:** "Does 10 billion chips actually mean 10 billion times more cookies than 1 chip? Is there a point where more chips stop mattering?"

  Finally, reveal the name: Pascal's Mugging. Explain that their intuition wasn't innumeracy; it was a defense against unverified probabilities and predatory policies. Ask: "If your brother faces this offline, what question should he ask that isn't about the math?"

  **What will predictably go wrong the first time**

  1.  **The Gambler:** One student will bet everything every time because they love risk. *Fix:* Pre-empt this. Say, "We're testing decision theory, not luck. If you bet max every time, you're opting out of the thinking part."
  2.  **The Shy Mugger:** The volunteer Proposer might feel awkward demanding chips. *Fix:* Coach them. "You need cookies for the whole section. Be aggressive. Use the big numbers."
  3.  **Math Confusion:** Students might not grasp Expected Value quickly. *Fix:* Keep the EV calculation on the whiteboard constantly. "Cost 1, Win 10, Chance 1/6. Average return is 1.6. Profit 0.6."
  4.  **Bankruptcy Panic:** Students might stress about going negative. *Fix:* Reiterate early that debt is just bringing cookies next week. Keep stakes trivial.
  5.  **Round 4 Confusion:** Players might expect a new roll in Round 4. *Fix:* Be explicit. "Round 4 is collection only. No rolls. Just pay the toll."

  **What this game can't reproduce**

  This simulation uses snacks and chips, which have diminishing returns but no existential weight. Your brother isn't losing cookies; he's losing security and trust. The game can't simulate the emotional isolation of a cult or the gradual erosion of identity.

  You'll have to supply the gravity yourself. In the debrief, pivot from "Would you pay 1 chip?" to "Would you quit your job?" The game proves the math is manipulatable; you must remind them that real life requires verifying the *source*, not just the sum. The game shows the logical trap; you must provide the emotional exit.
