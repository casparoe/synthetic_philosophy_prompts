answer: |-
  ### 1. Conceptual Brainstorming and Evaluation

  You have identified a mechanism that is distinct from the standard "alignment tax" argument. The alignment tax argument is about *volume*: safety costs money, competition reduces budgets, therefore safety volume decreases. Your observation is about *composition*: safety is a heterogeneous bundle of practices; competition acts as a filter that selectively retains the subset of safety practices correlated with capability growth, while discarding the orthogonal or costly subset. Crucially, this happens without explicit intent ("without anyone deciding"), leaving no paper trail of rejection.

  I have scanned the neighboring literatures for an existing label. Here is the evaluation of the closest candidates:

  *   **Drift into Failure (Sidney Dekker / Resilience Engineering):** This is the closest existing concept. Dekker describes how systems gradually move toward the boundary of safety through a series of locally rational decisions (e.g., skipping a step to save time). *Distinction:* Dekker focuses on *operational* drift (procedures, human factors). Your phenomenon is *strategic* and *R&D-focused* (portfolio allocation, hiring, compute). It is about which safety *technologies* are invented and deployed, not just how existing rules are followed.
  *   **Induced Innovation (John Hicks):** Hicks argued that factor scarcity induces innovation to save on that factor. *Distinction:* This explains why we invent capability-boosting tech. It does not explain why safety *itself* is redefined to look like capability.
  *   **Organizational Decoupling (Meyer & Rowan):** Organizations separate "talk" (policy) from "walk" (practice). *Distinction:* Decoupling implies the safety work *isn't done*. In your second and third instances, the safety work *is* done (the cheap technique, the well-resourced lab's portfolio), but it is the *wrong kind*.
  *   **Adverse Selection (Akerlof):** "Lemons" problem where bad products drive out good due to information asymmetry. *Distinction:* This is a market failure regarding *information*. Your phenomenon occurs even with perfect information; everyone knows the expensive safety work is valuable, but the resource allocation mechanism filters it out.
  *   **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure." *Distinction:* Goodhart is about metric gaming. Your phenomenon is about resource competition filtering out entire classes of work, regardless of whether they are measured.

  **Verdict:** There is no single established name that captures the *compositional selection of safety R&D under competitive pressure without explicit intent*. The existing terms capture pieces (Drift, Decoupling, Induced Innovation), but none capture the specific mechanism of **safety portfolio skew via competitive selection**.

  ### 2. The Concept: Endogenous Safety Selection

  I propose the term **Endogenous Safety Selection (ESS)**.

  **Definition:**
  Endogenous Safety Selection is a structural dynamic in competitive technological markets where the pressure to maximize performance (capability/profit) acts as a selection filter on the portfolio of safety interventions. Interventions that are positively correlated with performance metrics survive and proliferate; interventions that are orthogonal or negatively correlated with performance metrics are silently filtered out during resource allocation. The result is a safety posture that is systematically biased toward "safety-that-pays" and blind to "safety-that-costs," creating a spurious correlation between safety investment and actual risk reduction.

  **Why "Endogenous"?**
  The selection pressure does not come from an external regulator (exogenous) or a cynical decision to deceive (intent). It arises from the internal logic of the firm's survival and growth constraints (endogenous). It leaves no trace in decision records because no one votes *against* safety; they simply vote *for* capability, and the safety that rides along survives.

  **Edges and Boundaries:**
  *   **It is not "Safety-Washing":** Safety-washing implies a deliberate intent to mislead stakeholders. ESS can occur in organizations that are genuinely trying to be safe. The engineers believe the capability-aligned safety work is "good enough."
  *   **It is not the "Alignment Tax":** The Alignment Tax claims safety *volume* drops. ESS claims safety *type* shifts. An organization can increase its absolute safety spend (lowering the tax) while still suffering from ESS (if all that spend is on capability-aligned safety).
  *   **It is not "Technical Debt":** Technical debt is about code quality degrading over time. ESS is about the *direction of innovation* being steered away from risk-reduction.

  ### 3. Distinguishing ESS from Neighboring Concepts

  | Concept | Mechanism | Intent | Trace in Records | Key Distinction from ESS |
  | :--- | :--- | :--- | :--- | :--- |
  | **Alignment Tax** | Cost burden reduces budget. | None (Economic constraint). | Visible (Budget cuts). | Tax reduces *amount*; ESS changes *composition*. |
  | **Adverse Selection** | Information asymmetry hides quality. | None (Market structure). | Hidden (Private info). | ESS happens even if everyone knows the risk. |
  | **Goodhart's Law** | Optimization of a proxy metric. | Often strategic gaming. | Visible (Metric focus). | ESS is about resource survival, not just metric optimization. |
  | **Regulatory Capture** | External rules are weakened by industry. | Deliberate lobbying. | Visible (Lobbying logs). | ESS is internal/market-driven, not regulator-driven. |
  | **Safety-Washing** | Marketing claims exceed reality. | Deliberate deception. | Visible (PR vs. Reality). | ESS produces *real* safety work, just the wrong kind. |
  | **Drift into Failure** | Operational shortcuts accumulate. | Local rationality. | Often invisible. | Dekker is *operational*; ESS is *strategic/R&D*. |

  ### 4. Case Study: The Same Pattern (Non-AI)

  **Domain: Pre-2008 Financial Risk Management**

  *   **The Context:** Investment banks competed fiercely on Return on Equity (ROE). To manage risk, they employed quantitative risk teams ("Safety").
  *   **The Selection:** There were two types of risk modeling:
      1.  **Value-at-Risk (VaR):** A model that estimated potential loss under normal conditions. Crucially, a lower VaR number allowed the bank to hold less capital in reserve, freeing up capital for more trading (Capability).
      2.  **Stress Testing / Tail Risk:** Scenarios that modeled extreme market collapses. These models suggested holding *more* capital and reducing leverage (Pure Safety).
  *   **The ESS Mechanism:** Risk teams that produced VaR models were viewed as "business enablers." Their budgets grew, and their methods became industry standard (regulatory acceptance). Risk teams that focused on tail risk were viewed as "friction." They did not disappear entirely, but their influence on the *actual portfolio* was filtered out. No CEO said "ignore the tail risk." They simply allocated more capital and attention to the VaR teams because those teams helped the bank grow.
  *   **The Outcome:** The industry's "safety portfolio" became dominated by VaR. The resulting public picture of risk management looked robust (complex math, huge risk departments), but it was systematically blind to the specific risk that actually destroyed the system (correlated tail events). The safety work that survived was exactly the subset that was never in tension with leverage.

  ### 5. Case Study: Resemblance but Not ESS

  **Domain: ISO 9001 Quality Certification in Manufacturing**

  *   **The Superficial Resemblance:** A factory gets ISO certified. They produce reams of documentation (Safety/Quality). But on the floor, workers ignore the procedures to meet quotas. The "safety" is cosmetic.
  *   **Why it is Not ESS:** This is **Decoupling** (or Safety Theater). The safety work is *not being done*; it is simulated for the auditor. In ESS, the safety work *is* done (the VaR models were run, the capability-aligned safety code is written), but it is the *wrong instrument* for the true risk.
  *   **The Difference:** In Decoupling, the constraint is *legitimacy* (looking safe). In ESS, the constraint is *performance* (being capable). In Decoupling, the safety team knows they are faking it. In ESS, the safety team often believes their capability-aligned tools are sufficient.

  ### 6. Benign vs. Corrosive Selection

  For Endogenous Safety Selection to be **Benign**, the following condition must hold:
  *   **Positive Correlation of Objectives:** The technical interventions that increase capability must *also* be the interventions that reduce existential or systemic risk.
      *   *Example:* Improving model robustness against noise might both improve product reliability (capability) and reduce the chance of erratic behavior (safety). Here, the market filter selects for the "right" safety.

  For Endogenous Safety Selection to be **Corrosive**, the following condition must hold:
  *   **Orthogonality or Negative Correlation:** The interventions that reduce systemic risk require constraining capability, slowing deployment, or reducing performance, while the interventions that boost capability increase hidden risk.
      *   *Example:* In AI, "interpretability tools that help debug code" (Capability-aligned) vs. "mechanistic anomaly detection that flags power-seeking behavior" (Capability-constraining). If the market selects only the former, the lab appears safety-forward (they have great debugging tools), but the specific risk of misalignment remains unaddressed.

  **The Diagnostic Test:**
  To detect ESS, do not ask "How much do you spend on safety?" Ask: "Show me the safety projects you *cancelled* or *deprioritized* in the last budget cycle." If the answer is "We didn't cancel any safety projects," ESS is likely active. In a genuine safety portfolio under resource constraints, there should be a graveyard of high-value, high-cost safety proposals that were rejected. The absence of that graveyard is the signature of Endogenous Safety Selection.
