  **Symmetry:** They know their minds are identical. Defection guarantees mutual filth. Mark lifts; Dave lifts simultaneously. "Inevitable," says Mark. "Logical," says Dave. They carry it out.

  **Asymmetry:** But today Dave had coffee. Mark notices. The mirror breaks; Dave's risk tolerance is now 0.4% higher. Mark can't assume his choice mirrors Dave's. He defects. Dave sees Mark hesitate, realizes the coffee was noticed, and updates his model of Mark. The symmetry shatters. Both conclude the other is unpredictable. Both logically return to bed. The bin tips over.
