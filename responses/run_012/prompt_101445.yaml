      *   *Move 4:* Ines's counterfactual is the weak link. "Would have happened anyway" is speculative. Blame doesn't require *sole* causation (as Marek notes with the drunk driver).
          *   *Rating:* Partially Mistaken.
          *   *Critique:* Confuses necessary condition with significant contributing cause.

  4.  **Addressing the Specific Questions:**
      *   *Can a nation be a proper object of blame?* Yes, functionally (states act), but care must be taken to distinguish leadership from populace. Marek's functionalism (Move 3) is better than Ines's metaphysical objection (Move 2).
      *   *What counterfactual is required?* Not "would it have happened anyway?" (which excuses contributory negligence), but "would it have happened *in this way/at this time* without this actor?" Ines sets the bar too high.

