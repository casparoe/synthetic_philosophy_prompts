          *   *Rating:* Right (strong philosophical defense of collective responsibility).
          *   *Missing:* Doesn't address the *degree* of responsibility relative to others.

      *   **Move 4 (Ines):** Counterfactual argument. Key points: Blame requires necessity. If others (Russia, France, Austria) would have caused war anyway, German decision wasn't necessary. Blaming Germany is scapegoating.
          *   *Assessment:* Philosophically tricky. Counterfactuals are hard to prove ("would have happened anyway"). The "drunk driver" analogy (anticipated from Marek) undermines this. Overstates the requirement for *sole* necessity.
