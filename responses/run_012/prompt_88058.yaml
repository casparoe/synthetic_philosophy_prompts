  **Credence in $U$: 0.40**

  (i) **0.40** — Introspection typically reveals only specific qualitative contents, suggesting the alleged common residue is a conceptual artifact rather than a felt unity.

  (ii) **0.50** — Attitudinal theories risk circularity or collapsing into desire satisfaction, leaving logical space for a distinct hedonic property.

  (iii) **0.35** — A functionalist definition based on disposition to prolong experience suffices for welfare calculations without requiring metaphysical unity.

  (iv) **0.30** — Neural dissociations between reward subsystems suggest pleasure is a fragmented biological category rather than a unitary natural kind.

  (v) **0.55** — The vagueness of borderline cases suggests pleasure is a family-resemblance concept lacking a determinate truth condition.

  **Combination and Sensitivity**
  I derive the final figure of 0.40 by taking a weighted average of the five sub-credences, weighting (i) and (iii) most heavily as they address the core phenomenological and axiological claims of $U$. The final figure is most sensitive to term (i), the phenomenological residue, because if introspection definitively delivered a common tone independent of content, the empirical and functional objections would carry significantly less weight. To move this term, I would require a phenomenological method that reliably isolates hedonic tone from sensory modalities across disparate subjects without relying on post-hoc labeling.

  **Disagreement Alignment**
  The disagreement between a 0.8 and a 0.2 credence in $U$ is not likely to live in the same place as the disagreement between a hedonist and a non-hedonist, because one can consistently be a hedonist about value while denying that pleasure is a unitary natural kind (adopting instead a disjunctive or functionalist hedonism). Conversely, one might accept the existence of a unitary hedonic tone ($U$ is true) but deny that it is the sole constituent of welfare (rejecting hedonism). Thus, the metaphysical debate over the unity of pleasure cross-cuts the axiological debate over the source of value.
