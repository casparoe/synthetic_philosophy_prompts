prompt: |-
  Bit of an odd request, and I'm not sure it'll survive contact with someone who actually knows the literature, but here goes. I'm a science-and-ideas journalist -- I mostly write about AI and the philosophy of science -- and I've been thinking alot lately about why the Lakatos picture of research programmes still feels more like real science to working researchers than Popper's falsificationism does. I keep coming back to The Prestige, the Nolan film (I know it's based on a novel), because the rivalry between Angier and Borden has always struck me as two competing research programmes: each has a hard core he won't abandon, a protective belt of tricks and sacrifices he'll adjust instead, a negative heuristic telling him what not to touch and a positive heuristic for developing the rest. Borden's transported man is built on a secret he can't share; Angier's version requires going to Tesla and literally duplicating himself, which seems like it should count as abandoning the hard core of stage magic altogether.

  I want a proper reading of the film through Lakatos, not just a cute analogy. What is the hard core of each magician's programme, what's in the protective belt, and which one, if either, is progressive in Lakatos's sense -- predicting novel facts, generating new problems, that sort of thing? Where does the film's obsession with secrecy and personal rivalry cut against Lakatos's insistence that a research programme is a public, communal, historically extended thing, and does the film's own three-part structure -- the pledge, the turn, the prestige -- do any real philosophical work here, or is it just a narrative trick that makes us confuse being fooled with being persuaded?

  If the analogy breaks down, say where, and tell me what the film gets right about how people actually defend a core commitment when the anomalies pile up -- and if you were picking two or three scenes to screen for the class, which ones would you use? I'm teaching a night class on philosophy of science next month and want to use the film without misleading people, so be honest about the limits.
