prompt: |-
  I've been reading this pop-science book about quantum foundations (don't ask me for the title, I lent it to my brother) and there's a chapter on whether the wavefunction is real that I want to check before I go around repeating it. Act like a philosopher of physics who actually works on quantum foundations and knows the psi-ontic / psi-epistemic literature inside out, and please think carefully and go slow — start by listing out the distinct claims in the passage one by one before you evaluate any of them, so I can actually follow your reasoning.

  Here's basically what the book says (I'm paraphrasing from memory):

  "The wavefunction isn't really a thing out there in the world — it's just a handy way of encoding what an observer knows about a system, sort of like a probability distribution in statistical mechanics. That's the psi-epistemic view: the wavefunction is a bookkeeping device for our ignorance, and the particle actually has definite properties all along, we just don't know them yet. The other camp, psi-ontic, says the wavefunction is a real physical field. For a while it looked like this was just a matter of taste, but then the PBR theorem — Pusey, Barrett and Rudolph — settled it: they proved the wavefunction has to be real, so the epistemic view is dead. The trick is that if two different quantum states were just overlapping probability distributions over hidden facts, you could build a measurement that produces a flat-out contradiction, so distinct states have to line up with completely separate, non-overlapping states of reality. The only escape for the epistemic crowd is to say that preparing two independent systems can secretly correlate them — which is basically spooky action at a distance — so nobody serious takes that route anymore. Bottom line: quantum mechanics shows the wavefunction is a real thing, and anyone who still calls it 'just information' is behind the times."

  I'm not a physicist, and honestly the epistemic view sounds more sensible to me (I've never liked the idea of a wave being 'real'), so I'm worried I'm being unfair to the book — but also worried the book is being unfair to the other side, if that makes sense. What I want from you: go sentence by sentence and tell me, for each claim, (a) what a careful person working in this area would nod along to, (b) what they'd wince at as a simplification, and (c) what's just wrong. Be specific about which technical terms are being slid around — e.g. if 'epistemic' or 'ontic' or 'real' are doing different work in different sentences, say exactly where the slide happens. Then answer the big question at the end: does the book's bottom line survive once you've fixed the loose parts, or does fixing them change the verdict? I don't need citations or a reading list, I just want to know what to actually believe here and where the passage goes wrong.
reasoning: |-
