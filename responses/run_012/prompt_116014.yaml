answer: |-
  Your friend's summary is a fascinating mix of accurate historical context, common misconceptions, and internal contradictions. While he is correct that eliminative materialism (EM) is often misunderstood, his reconstruction conflates three distinct positions in philosophy of mind: **behaviorism**, **reductive physicalism** (identity theory), and **eliminativism**.

  Here is a piece-by-piece breakdown of what a proponent of eliminative materialism (such as Paul Churchland or Stephen Stich) would accept, what they would reject as a caricature, and the status of the objections he raises.

  ### 1. The Core Claim: "Beliefs and desires do not exist."
  *   **Friend's Summary:** "Science will eventually establish that beliefs and desires do not exist."
  *   **Eliminativist Verdict:** **Accept.**
  *   **Analysis:** This is the defining ontological claim of EM. Eliminativists argue that "belief" and "desire" are terms from *Folk Psychology* (FP)—our pre-scientific, common-sense framework for predicting behavior. They argue these terms refer to nothing real, much like "witch" or "phlogiston."
  *   **Settled vs. Contested:** It is **settled** that this is what EM claims. It is **highly contested** whether this claim is plausible. Most contemporary philosophers of mind reject this specific claim, favoring some form of realism about mental states (functionalism, interpretivism, etc.).

  ### 2. The Behaviorist Charge
  *   **Friend's Summary:** "The view is really a form of behaviorism: since nobody can point to a belief in the brain, the vocabulary of 'believing' and 'wanting' is just a convenient shorthand for patterns of behavior."
  *   **Eliminativist Verdict:** **Reject (Caricature).**
  *   **Analysis:** This is a significant category error.
      *   **Behaviorism** (logical or methodological) claims that talk about mental states *translates* into talk about behavioral dispositions. It tries to save the mental by redefining it.
      *   **Eliminativism** claims that mental states (as FP defines them) do not exist *at all*—neither as behaviors, nor as internal causes.
      *   Eliminativists are usually *materialists*. They believe there is stuff in the brain, but they deny that the *structure* of that stuff matches the structure of "beliefs." They do not reduce beliefs to behavior; they eliminate beliefs entirely and replace them with neurocomputational states.
  *   **Settled vs. Contested:** It is **settled** scholarship that EM is distinct from behaviorism. Behaviorism was largely abandoned before EM rose to prominence in the 1980s. Conflating the two is a common introductory error.

  ### 3. The Reductionist Contradiction
  *   **Friend's Summary:** "It is also a reductivist program — beliefs really are just neurons firing, and the wiring diagram will eventually tell us which belief is which."
  *   **Eliminativist Verdict:** **Reject (Internal Contradiction).**
  *   **Analysis:** Your friend contradicts himself here. He previously said EM is behaviorism (no internal states); now he says it is reductionism (mental states = brain states).
      *   **Reductionism (Identity Theory):** Claims "Belief" *is* "Neural Pattern X." If this were true, we would keep the word "belief" (just as we kept "water" after discovering it is H₂O).
      *   **Eliminativism:** Claims "Belief" is *not* "Neural Pattern X." The neural pattern exists, but it is not a belief. The concept is too flawed to be reduced.
      *   **The Mismatch Argument:** Churchland argues FP assumes mental states are discrete, sentence-like, and logically related. Neuroscience shows the brain works via vectorial transformations, activation patterns, and parallel processing. Because the *structures* don't match, you cannot reduce one to the other; you must eliminate the old theory.
  *   **Settled vs. Contested:** It is **settled** that EM is explicitly anti-reductionist regarding Folk Psychology. Your friend has conflated *Eliminative Materialism* with *Type Identity Theory*.

  ### 4. The "Failed Theory" Argument
  *   **Friend's Summary:** "Folk psychology is a failed research program, millennia old and making no progress, so it will go the way of phlogiston."
  *   **Eliminativist Verdict:** **Accept.**
  *   **Analysis:** This is the primary argument *for* eliminativism. Proponents argue that FP has failed to explain mental illness, sleep, learning, or intelligence for thousands of years. Therefore, it is a stagnant theory ripe for replacement by neuroscience, just as alchemy was replaced by chemistry.
  *   **Settled vs. Contested:** This is the **central point of contention** in the field.
      *   *Eliminativists* say: FP explains nothing; it just labels things.
      *   *Opponents* (e.g., Jerry Fodor, Lynne Rudder Baker) say: FP is incredibly successful at prediction and is indispensable for social coordination. Its longevity is a sign of robustness, not stagnation.
      *   There is no consensus on whether FP counts as a "theory" or whether it has "failed."

  ### 5. The Self-Refutation Objection
  *   **Friend's Summary:** "The fatal problem is that the view refutes itself: to assert that there are no beliefs is itself to express a belief, so eliminative materialism cannot be true."
  *   **Eliminativist Verdict:** **Reject (as a refutation).**
  *   **Analysis:** This is the most famous objection to EM (often attributed to Lynne Rudder Baker or Geach). However, calling it "fatal" is an overstatement. Eliminativists have standard responses:
      1.  **The Syntactic Response:** One can utter the sentence "There are no beliefs" without holding the *Folk Psychological state* of belief. One can hold a *neurocomputational state* that functions similarly without satisfying the FP definition of belief.
      2.  **The Provisional Response:** We currently use FP vocabulary to communicate the theory, just as a physicist might use Newtonian terms to explain why Einstein is right. The goal is to eventually stop using the vocabulary, not to use it to deny itself eternally.
  *   **Settled vs. Contested:** It is **settled** that this is a standard objection. It is **contested** whether it succeeds. Most philosophers find the objection damaging but not logically fatal; eliminativists consider it a category mistake regarding how language works. It is certainly not a "proof" that EM is false.

  ### 6. The "Impossible to Live" Objection
  *   **Friend's Summary:** "Nobody could actually live this way... so it can never be more than a philosophical parlour game."
  *   **Eliminativist Verdict:** **Reject (as a refutation).**
  *   **Analysis:** This is a pragmatic objection. Eliminativists concede that we cannot stop using FP *today*. However, they argue this is a fact about our current education, not a metaphysical limit.
      *   **Analogy:** We cannot intuitively live as if the earth spins at 1,000 mph, but that doesn't make heliocentrism false.
      *   **Future Outlook:** Proponents like Paul Churchland suggest that as neuroeducation improves, future generations might literally think in neurocomputational terms rather than propositional attitudes.
  *   **Settled vs. Contested:** It is **contested** whether FP is biologically hardwired or culturally learned. If it is hardwired, EM is likely false. If it is learned (a theory we are taught as children), EM is possible.

  ### 7. The Closing Verdict
  *   **Friend's Summary:** "Eliminative materialism... can never be more than a philosophical parlour game."
  *   **Assessment:** **Does not follow.**
  *   **Analysis:** Your friend's verdict relies on the claim that EM is self-refuting and practically impossible. Since the self-refutation argument has established counter-arguments (and is not a logical contradiction in the formal sense), and the practical impossibility is an empirical claim about human plasticity (not a logical proof), the verdict does not logically follow.
  *   **Furthermore:** Because his definition of EM conflates behaviorism and reductionism, his critique attacks a straw man. He attacks a view that says "Beliefs are behaviors" (Behaviorism) and "Beliefs are neurons" (Reductionism) simultaneously, which is incoherent. Real EM says "Beliefs are neither; they are fictions."

  ### Summary of Errors and Consensus

  | Claim in Summary | Status in Philosophy of Mind | Notes |
  | :--- | :--- | :--- |
  | **"Beliefs do not exist"** | **Accurate Definition** | This is what EM claims. |
  | **"It is a form of behaviorism"** | **False / Caricature** | EM is ontological, not semantic/behavioral. |
  | **"It is a reductivist program"** | **False / Contradiction** | EM is explicitly anti-reductionist regarding FP. |
  | **"FP is a failed theory (Phlogiston)"** | **Contested Premise** | The core argument for EM, but heavily debated. |
  | **"Self-refutation is fatal"** | **Contested Objection** | Standard objection, but not a consensus refutation. |
  | **"Impossible to live"** | **Pragmatic Objection** | Argues against feasibility, not truth. |

  ### Conclusion for You
  Your friend is right that EM is misunderstood, but his summary contributes to the misunderstanding. He has constructed a "Frankenstein" view that stitches together Behaviorism (1950s), Identity Theory (1960s), and Eliminativism (1980s).

  *   **Where he went wrong:** He treats EM as if it tries to *translate* mental talk (Behaviorism) or *map* mental talk directly to neurons (Reductionism). EM does neither. It proposes *replacing* the vocabulary entirely.
  *   **The Self-Refutation Point:** You are right to be skeptical. It is too quick. It assumes that to utter a sentence, one must instantiate the exact Folk Psychological state that the sentence denies. Eliminativists deny that assumption.
  *   **The Verdict:** His conclusion that EM is a "parlour game" is a common sentiment (most philosophers are not eliminativists), but it does not follow from the arguments he presented, because those arguments mischaracterize the position they are attacking.

  **Settled Consensus:** Eliminative Materialism is a minority view. Most philosophers of mind and cognitive scientists are realists about at least some mental states (functionalists or representationalists).
  **Genuinely Contested:** Whether Folk Psychology is a "theory" that can be false, and whether the structure of the brain is incompatible with the structure of propositional attitudes. This is an empirical and theoretical battle that is not yet over.
