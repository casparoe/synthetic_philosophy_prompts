      *   *Contested:* Whether EM is *true* or if the objections succeed.

  7.  **Final Review against constraints:**
      *   Walk through piece by piece? Yes.
      *   Accept vs. Caricature? Yes.
      *   Objections vs. Refutations? Yes.
      *   Closing verdict assessment? Yes.
      *   Settled vs. Contested? Yes.

