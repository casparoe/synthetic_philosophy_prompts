  # The Price of Honesty: An Adjudication on Dilation

  The dispute between you and your friend concerns the heart of what it means to be rational under ignorance. Your friend defends the orthodoxy of Sharp Bayesianism: a rational agent's beliefs should be represented by a single probability function. You defend Imprecise Probability (IP): beliefs are best represented by a set of functions, yielding lower and upper bounds for any event. The flashpoint is *dilation*: the phenomenon where learning a fact $E$, which your model deems irrelevant to a hypothesis $A$, strictly widens your probability interval for $A$.

  To adjudicate, we must first render the phenomenon precise. In the IP framework, an agent's state is a convex set of probability functions, $\mathcal{P}$. The probability of an event $A$ is the interval $[\underline{P}(A), \overline{P}(A)]$, where $\underline{P}(A)$ is the minimum probability assigned to $A$ by any function in $\mathcal{P}$, and $\overline{P}(A)$ is the maximum. Dilation occurs when there is a partition of evidence (say, $E$ and $\neg E$) such that for every cell, the posterior interval strictly contains the prior interval:
  $$ [\underline{P}(A), \overline{P}(A)] \subset [\underline{P}(A|E), \overline{P}(A|E)] $$
  Crucially, this can happen even when, for every precise function $P \in \mathcal{P}$, $A$ and $E$ are stochastically independent ($P(A|E) = P(A)$). Your friend sees this as a reductio: a theory where acquiring free, relevant information makes you *less* confident is a theory of irrationality. You see it as a feature: a honest accounting of how information interacts with model uncertainty.

  ### The Friend's Reductio: The Value of Information

  Your friend's objection rests on a powerful normative principle: **Information has non-negative value.** In standard decision theory (specifically Good's Theorem), a rational agent should never pay to avoid information. If I know that learning $E$ will widen my interval for $A$, I know that my decision-theoretic position regarding $A$ will worsen. My set of admissible bets will shrink; I will be forced to suspend judgment where I previously had a stance.

  If dilation is possible, an agent knows in advance that her precision will degrade upon learning $E$. If precision is a good—if it allows for more decisive action—then the agent is rationally compelled to avoid $E$. This implies that information can be toxic. Your friend argues this is absurd. A theory of belief that permits an agent to rationally fear the truth is broken. The remedy is to insist on a single probability function. If $\mathcal{P}$ contains only one function, $P(A|E)$ must equal $P(A)$ given independence, and the interval (a single point) cannot widen. Dilation is the mathematical scar of trying to represent ignorance with a set; the cure is to represent ignorance with a specific distribution (e.g., a uniform prior), thereby restoring the monotonicity of learning.

  ### The Defense: Model Uncertainty and Second-Order Ignorance

  Your defense requires disentangling two kinds of independence. The condition $P(A|E) = P(A)$ for all $P \in \mathcal{P}$ ensures that $E$ is irrelevant to $A$ *within* any specific model. However, it does not ensure that $E$ is irrelevant to the *selection* of the model.

  Consider a hierarchical example. Suppose $A$ and $E$ are outcomes of two coins that share an unknown bias $\theta$. Conditional on $\theta$, the tosses are independent. However, the agent does not know $\theta$. Her set $\mathcal{P}$ represents a range of priors over $\theta$. While every specific prior says $E$ doesn't predict $A$ *given $\theta$*, learning $E$ (say, Heads) updates the agent's belief about $\theta$. It shifts the weight of the priors in $\mathcal{P}$ toward those that place more mass on high values of $\theta$.

  If the set $\mathcal{P}$ is sufficiently diverse, this shift can increase the dispersion of the marginal probabilities for $A$. Before learning $E$, the priors might cluster around a mean of 0.5. After learning $E$, the priors that survive conditioning might be polarized: some strongly suggest $\theta \approx 1$, others (which assigned low probability to $E$ but weren't ruled out) suggest $\theta \approx 0.5$. The *range* of plausible probabilities for $A$ widens.

  Your argument is that dilation is not a failure of rationality, but a reflection of **model instability**. The agent thought she was ignorant only about the outcome $A$, but learning $E$ revealed she was also ignorant about the *reliability of her independence assumption*. The interval widens because the agent realizes her prior confidence was fragile; it depended on a cancellation of uncertainties that $E$ disrupts.

  ### The Verdict

  I side with **you**. The phenomenon of dilation is not a reductio of imprecise probabilities, but a necessary consequence of representing ignorance without dogmatism. Your friend's demand for a single probability function solves the problem of dilation only by smuggling in false precision.

  To avoid dilation, your friend must replace the set $\mathcal{P}$ with a single prior $P^*$. But on what grounds is $P^*$ chosen? If the agent is truly ignorant about the bias $\theta$, selecting a specific distribution (like Uniform[0,1]) is an act of fabrication, not inference. It asserts knowledge the agent does not have. Dilation is the tax we pay for honesty: it is the cost of admitting that we do not know enough to pin down a single prior. To ban dilation is to ban the representation of severe uncertainty.

  ### The Concession

  However, to vindicate your position, the theory of imprecise probabilities must concede three specific points. It cannot simply declare dilation "benign"; it must adjust its normative claims to accommodate it.

  1.  **Concession on Confirmation:** The theory must abandon the principle that **Epistemic Irrelevance implies Doxastic Invariance.** In precise Bayesianism, if $E$ is irrelevant to $A$, learning $E$ leaves your credence in $A$ unchanged. In IP, we must concede that learning $E$ can change your *state of commitment* regarding $A$ even if $E$ is irrelevant to $A$ within the model. The norm "don't let irrelevant evidence change your mind" applies to the *mean* of your credence, not the *width* of your interval. You must accept that rational belief is not just about the world, but about the stability of the model used to describe it.
  2.  **Concession on Learning:** The theory must concede that **Learning is not always purgative.** The standard view is that learning reduces uncertainty. IP must formally acknowledge that learning can shift uncertainty from the *parameter* to the *model structure*. When dilation occurs, the agent has learned something about her own ignorance: she has learned that her prior set was not robust to the evidence $E$. This is a gain in meta-knowledge, even if it is a loss in object-level precision.
  3.  **Concession on Interpretation:** Finally, the theory must concede that **Intervals are not Credal Fuzziness.** If the interval $[\underline{P}(A), \overline{P}(A)]$ represented a "fuzzy" single number, dilation would be a contradiction (becoming less sure about a fixed number). To make dilation benign, the interval must be interpreted as a **range of permissible commitments.** Before $E$, the agent was permitted to bet at odds corresponding to the prior interval. After $E$, the set of permissible odds widens. This is not a loss of knowledge, but a widening of the zone of suspension of judgment. The theory must concede that rationality sometimes requires *less* decisiveness after receiving evidence.

  ### What Would Change My Mind

  I commit to this verdict, but my commitment is conditional. I would change my mind and side with your friend if it could be demonstrated that **dilation leads to a diachronic Dutch Book that cannot be avoided by any decision rule consistent with IP.**

  Currently, defenders of IP argue that agents can avoid sure-loss by adopting decision rules (like *E-admissibility* or *Maximality*) that refuse to bet when intervals are wide. If, however, it were proven that the mere existence of a dilation structure allows a bookie to construct a sequence of bets *before* $E$ is observed that guarantees a loss regardless of which decision rule the agent uses, then dilation would be a logical inconsistency, not just a counter-intuitive feature. If IP forces a guaranteed financial loss in a way that Sharp Bayesianism does not, then the "honesty" of IP is too expensive, and we are forced back to your friend's dogmatism to ensure coherence. Until such a proof is universally accepted, dilation remains the price of intellectual honesty.
