answer: |-
  This is a classic middle-range theory problem: bridging the gap between static material patterns and dynamic cognitive states. Your supervisor isn't being inconsistent; she is applying a specific, rigorous epistemological firewall that many archaeologists use but rarely articulate this clearly.

  Here is the breakdown of the rule she is running, how it applies to your deposit, the function of the "belief/practice" slide, and how to test it.

  ### 1. The Underlying Rule: Normativity as Proxy for Cognition

  Your supervisor is operating under a **Structuralist-Normative Rule**.

  **The Rule:** *You can only infer a shared cognitive state (belief) from a shared behavioral pattern (norm). Individual anomalies, no matter how elaborate, evidence agency or event, but not system.*

  Here is how this rule maps onto her five previous calls:
  *   **Cemetery (Case 1) & Regional Orientation (Case 3):** High $N$, High Uniformity. This proves *intersubjectivity*. Multiple actors made the same choices over time. This rules out individual whim, proving a shared mental model. **Verdict: Belief.**
  *   **Midden Figurines (Case 2):** Low Context, Low Pattern. This is noise. **Verdict: No Belief.**
  *   **Single Pit/Dog (Case 4):** Low $N$ (One pit). Even if intentional, a single instance cannot distinguish between a religious rule, a magical one-off, a psychological episode, or a practical solution we don't understand. She defaults to the null hypothesis (taphonomy/utility). **Verdict: No Belief.**
  *   **Multi-line Site (Case 5):** High Convergence. Even if $N$ is low, if Iconography + Space + Ethno all point to $X$, the probability of $X$ being the cognitive driver approaches certainty. **Verdict: Belief.**

  ### 2. The Prediction for Your Deposit

  **Verdict:** She will allow you to write that this is a **ritualized practice** or a **structured deposit**, but she will block you from inferring a specific **belief system** or **shared cosmology** based on this deposit alone.

  **Why?**
  Your deposit clears the "Utility" hurdle that Case 4 failed (fine pots vs. seconds, spiral vs. dump). She will agree it is *meaningful*. However, it fails the "Normativity" hurdle of Cases 1 and 3. It is a *hapax legomenon* (a unique occurrence).

  In her framework:
  *   **Practice** = What they did (Observable).
  *   **Belief** = Why they did it, and that *others would have done the same* (Inferred).

  Because you have no repetition (it's the only one on the site/region), you cannot prove that this wasn't the act of a single individual, a specific lineage, or a response to a unique crisis (e.g., a specific drought, a specific death). You can prove they *ritualized* the event, but you cannot prove what they *believed* the ritual achieved, nor that the belief was shared beyond the participants of that single event.

  ### 3. The "Belief vs. Practice" Slide

  You asked if the slide between "they had a belief" and "they had a practice" is doing work. **Yes, it is the entire engine of her methodology.**

  She is protecting you from the **Psychological Fallacy**.
  *   If she says "They had a practice," she is describing the material constraint (pots were smashed in a spiral). This is undeniable.
  *   If she says "They believed in X," she is claiming knowledge of their internal state and social consensus.

  In Cases 1 and 3, she allows the slide because *uniformity* acts as the bridge. If 50 people bury their dead head-north over 200 years, the "practice" is so constrained that the "belief" (north is significant) is the only viable explanation.

  In your case, the bridge is out. You have a high-cost practice, but without repetition, it remains an *event*, not an *institution*. She will insist you describe the **grammar** of the deposit (the spiral, the lining, the selection of objects) without assigning the **semantics** (what the grammar *means*).

  ### 4. Which Rule to Bet On?

  Bet on the **Normativity Rule** (Repetition = Belief), not the **Costly Signaling Rule** (Effort = Belief).

  If she operated on Costly Signaling, she would accept your deposit immediately. Smashing 40 fine pots is a massive economic cost; in many anthropological models, high cost signals high religious commitment. But she rejected Case 4 (Dog/Pit), which likely also involved cost (killing a dog, smashing pots). She rejected it because it was a "one-off."

  She prioritizes **statistical significance over economic cost**. She would rather infer belief from 100 boring, uniform graves than from one spectacular, unique shrine.

  ### 5. The Test Case to Force the Issue

  To pin her down, you need a case that separates **Uniqueness** from **Belief** in a context she *must* accept.

  **The "Royal Tomb" Test:**
  Ask her about a high-status, unique royal burial (e.g., Sutton Hoo or a specific Egyptian tomb) found in a region of otherwise uniform simple graves.
  *   *Scenario:* One massive tomb, unique goods, unique construction, no text.
  *   *Question:* "Can we infer the king's specific beliefs about the afterlife from the goods, or just that he was treated differently?"

  **If she says "Yes, we can infer belief":**
  Then her rule is actually about **Social Power**, not Normativity. She accepts that elite acts define the belief system for the group, even if unique.
  *   *Strategy for you:* Argue your deposit is an **Elite/Foundational Deposit**. If it's the *only* one, maybe it's the *primary* one (the founding ritual).

  **If she says "No, that's just status display":**
  Then the Normativity Rule holds.
  *   *Strategy for you:* You must stop trying to find "The Belief." Instead, frame the chapter around **"Ritualization and Deviance."** Argue that the *uniqueness* is the data. The belief isn't in the spiral; the belief is in the *power to break the norm*.

  ### 6. Is This Underdetermined?

  It is not fully underdetermined, but it is on the boundary.
  The tension lies between **Case 4 (Single Pit = No)** and **Your Case (Single Pit + High Structure = ?)**.

  If your pots were "seconds" (like Case 4), she would definitely say No. Because they are "finely made" and "spiraled," you have introduced **Intentionality** that Case 4 lacked.
  *   **Best Case:** She accepts "Ritual Intent" but blocks "Cosmological Belief."
  *   **Worst Case:** She argues that without a second pit, you cannot rule out that this was a "closure deposit" for a specific building (practical function) rather than a religious act.

  **Recommendation:**
  Write the chapter describing the **syntax** of the deposit (the effort, the exclusion of utility, the spatial order) as evidence of **ritualization**. Do not write the **semantics** (the specific belief). Frame the uniqueness not as a lack of data, but as data itself: *Why was this ritual performed only once?* That question is more archaeologically defensible than *What did they believe?*

  She wants you to prove that the *society* held the belief, not just that the *actors* held it. Without repetition, you only have the actors.
