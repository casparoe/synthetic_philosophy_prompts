answer: |-
  You have identified a genuine and sophisticated puzzle in comparative politics and the sociology of religion. The standard binary of "established" versus "secular" is indeed too blunt to capture the administrative reality you describe. While political scientists and legal scholars study these exact dynamics, they often bundle them under broad headings like "state-church regimes" or "secularism models."

  There are no single, universally standardized nouns for the three specific distinctions you have drawn. However, your breakdown maps closely to specific concepts in constitutional law and bureaucratic theory. To give you the precision you require, I will provide the closest existing academic concepts for each, but then coin/refine a specific term for each of your three phenomena that isolates the mechanism you have spotted.

  Here are the three phenomena, named and defined.

  ### 1. The Divergence: Constitutional-Operational Asymmetry
  **Existing Concepts:** *De facto establishment*, *Nominal secularism*, *Symbolic establishment.*
  **Proposed Term:** **Constitutional-Operational Asymmetry**

  **Definition:** This occurs when the constitutional or statutory *status* of religion (the text of the law) does not correlate with the *operational* relationship between the state and religious bodies (the flow of money, personnel, or administrative power).

  **The Edge:**
  *   **Inside:** England is the prime example. The *status* is high establishment (Head of State is Defender of the Faith), but the *operation* is low entanglement (no direct tax for the church, low attendance). The US is the inverse: *status* is disestablishment (First Amendment), but *operation* includes high entanglement (tax exemptions, chaplains).
  *   **Outside:** A theocracy (e.g., Iran) is not asymmetrical; status and operation align. A strictly separationist state that funds nothing and recognizes no religious bodies (e.g., France outside of Alsace-Moselle) is also symmetrical.
  *   **Your France Example:** The Alsace-Moselle exception is slightly different. It is not merely operational; it is a **Legal Carve-Out**. It is a specific statutory exception to the general rule, whereas Asymmetry usually implies the general rule itself is misleading.

  ### 2. The Even-Handedness: Universalized Accommodation
  **Existing Concepts:** *Positive neutrality*, *Non-preferentialism*, *Cooperative secularism.*
  **Proposed Term:** **Universalized Accommodation**

  **Definition:** This is the mechanism by which state support for religion is preserved not by privileging one specific church, but by extending the privilege to all recognized religious bodies. The "entanglement" remains, but the "discrimination" is removed. Fairness becomes the justification for funding.

  **The Edge:**
  *   **Inside:** Germany's *Kirchensteuer* (church tax) is the strongest example. It is not a tax for the Lutheran church only; it is an administrative channel available to Jews, Muslims (in some states), and others. The US tax-exempt status (501(c)(3)) is also Universalized Accommodation; the state subsidizes religion by not taxing it, but it does so for atheists' non-profits and mosques alike.
  *   **Outside:** England's House of Lords bishops are *not* Universalized Accommodation. Only Anglican bishops sit as of right. This is **Privileged Establishment**. If the UK invited Imams and Rabbis to sit in the Lords, it would move toward Universalized Accommodation.
  *   **Your US Chaplain Example:** This belongs here. Originally Christian, legislative and military chaplaincies are now funded for multiple faiths. The entanglement (public pay) survives because the access is universalized.

  ### 3. The Re-description: Procedural Neutralization
  **Existing Concepts:** *Bureaucratization of religion*, *Administrative secularization*, *Technocratic management.*
  **Proposed Term:** **Procedural Neutralization**

  **Definition:** This is the linguistic and administrative reframing of a religious function as a neutral, secular, state service. The religious content is stripped from the description of the act, leaving only the bureaucratic mechanism visible. This reduces political friction because the state appears to be managing "records" or "infrastructure," not "faith."

  **The Edge:**
  *   **Inside:** Sweden's burial fee is the perfect example. Burial is a religious rite, but by framing the fee as a "municipal sanitation and record-keeping" issue collected by the tax agency, it becomes administrative. Denmark's tax collection is similar; the state is not "tithing," it is "processing revenue."
  *   **Outside:** A state paying for the repair of a *living* parish roof for active worship is **Direct Subsidy**. A state paying for the repair of a *historic* cathedral that is no longer a parish church but a monument is **Heritage Preservation**.
  *   **Your Historic Building Question:** You asked if upkeep of historic buildings is the same as church tax. Under **Procedural Neutralization**, it is distinct. Church tax is framed as *membership administration*. Historic upkeep is framed as *cultural heritage*. Both are entanglements, but they use different neutralizing descriptions to justify themselves.

  ***

  ### Critique of Your Examples
  You asked which of your examples might belong to a different phenomenon than the one you filed it under.

  1.  **France (Alsace-Moselle):** You filed this under the divergence (Phenomenon 1). It is actually a **Legal Carve-Out**. It is not that the practice diverges from the law; it is that the law itself contains a contradictory clause. It is a "fossilized" legal regime, not an operational asymmetry.
  2.  **United States (Chaplains):** You filed this under the divergence (Phenomenon 1). It is arguably better understood as **Universalized Accommodation** (Phenomenon 2). The justification for public pay is not that the state established a church, but that it accommodates the religious needs of soldiers/legislators of *all* faiths equally.
  3.  **Sweden (Burial Fee):** You filed this under re-description (Phenomenon 3). This is correct. It is the strongest example of **Procedural Neutralization**.

  ### Which Distinction is Most Useful?
  **Procedural Neutralization (Phenomenon 3) is the most analytically useful.**

  Here is why: **Constitutional-Operational Asymmetry** (1) tells you *that* a mismatch exists, and **Universalized Accommodation** (2) tells you *how* the funding is justified legally. But **Procedural Neutralization** (3) explains *why the public accepts it.*

  People tolerate the German Church Tax or the Swedish Burial Fee not because they are theologians, but because the transaction looks like paying a utility bill. When the state collects a "church tax," it feels like politics. When the state collects a "membership fee via the revenue office," it feels like administration.

  This distinction allows you to predict where conflict will arise.
  *   **Edge Case:** Public Holidays. Are they Establishment or something else?
      *   Under **Procedural Neutralization**, public holidays are **Cultural Sediment**. They are not framed as "state worship" (Establishment) nor "administrative duty" (Neutralization). They are framed as "rest days." They belong outside your three phenomena. They are **Ritual Inertia**. They persist not because of active state policy, but because changing the calendar is administratively costly and culturally disruptive.

  ### Summary of Terms for Your Puzzle

  | Your Phenomenon | Proposed Name | Definition | Test Case (In/Out) |
  | :--- | :--- | :--- | :--- |
  | **1. Divergence** | **Constitutional-Operational Asymmetry** | Legal status (text) does not match fiscal/admin reality (practice). | **In:** US (Secular text, tax-exempt reality). **Out:** Iran (Religious text, religious reality). |
  | **2. Even-handedness** | **Universalized Accommodation** | Entanglement survives by extending benefits to all faiths equally. | **In:** German Church Tax (All registered faiths). **Out:** UK Lords Bishops (Anglicans only). |
  | **3. Re-description** | **Procedural Neutralization** | Religious acts are reframed as neutral bureaucratic services. | **In:** Swedish Burial Fee (Administered as sanitation/records). **Out:** Direct Grant to Parish (Framed as worship support). |

  You have effectively dissected the "black box" of secularism. Most observers look at the label on the box (Constitution); you have looked at the wiring inside (Administration). The term **Procedural Neutralization** is the specific tool you need to describe how the wiring is hidden.
