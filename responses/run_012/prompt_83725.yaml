answer: |-
  This is one of the classic, foundational tensions in political science and development studies. You have stumbled onto the debate between **universalism** (there are objective standards of governance) and **relativism** (standards are culturally specific).

  Your gut instinct is sharing a room with heavyweights like Alatas, Nye, and the World Bank. But the anthropologists aren't just making excuses; they are pointing out a sociological reality.

  Here is the breakdown of who is wrong, where the mistake lies, and what your TA meant by "thick concepts."

  ### 1. The TA's Clue: "Thick Concepts"
  Your TA gave you the philosophical key to unlock this. In ethics, a **thin concept** is purely evaluative (e.g., "good," "bad," "right," "wrong"). A **thick concept** is both descriptive and evaluative intertwined (e.g., "cruel," "brave," "rude," "corrupt").

  *   **The Indexers** treat corruption as a **thin concept** (or a brute fact). They assume: *Action X happened (bribe), therefore Score Y goes down.* They assume the definition of "public office" and "private gain" is stable across all contexts.
  *   **The Anthropologists** treat corruption as a **thick concept**. They argue you cannot separate the *action* from the *social meaning*. If the social meaning of the transaction is "fulfilling a kinship obligation" rather than "subverting the law," then applying the label "corrupt" is a category error.

  **The Mistake:** The mistake isn't necessarily in your intuition, but in assuming that "corruption" is a natural kind (like "water" or "gold") that exists independently of human interpretation. It is a **political and legal classification**.

  ### 2. Who is Wrong?
  Nobody is entirely wrong, but they are talking past each other on different levels of analysis. Here is the scorecard:

  **The Anthropologists (Partially Right, Dangerous Conclusion)**
  *   **Where they are right:** They correctly identify that in many societies, the Western distinction between "public" and "private" does not exist. In a neopatrimonial system, the state is viewed as an extension of the leader's household. Hiring your cousin isn't "nepotism"; it is failing in your moral duty if you *don't* hire him. To refuse the gift is to declare war on the relationship.
  *   **Where they go wrong:** They often slide from *explaining* the behavior to *exonerating* it. Just because a practice is culturally embedded doesn't mean it doesn't have destructive development outcomes. Understanding why a murder happened (honor killing) explains the motive, but it doesn't mean we can't label it "homicide" under universal human rights law.

  **The Index People (Methodologically Necessary, Culturally Blind)**
  *   **Where they are right:** Development requires predictability. If permits depend on cousins rather than rules, investment stalls, and the poor suffer most. We need metrics to compare governance.
  *   **Where they go wrong:** They often measure **state capacity** and call it **corruption**. If a government is weak and relies on informal networks to function, indices often penalize this as "corruption" when it might actually be "informal governance." They impose a Weberian ideal (impersonal bureaucracy) as the only valid form of organization.

  **You (Mostly Right, but watch the definition)**
  *   **Where you are right:** Your definition ("public power serving private ends") is the standard political science definition (e.g., Joseph Nye). You are correct that if we accept total relativism, we lose the ability to critique abuses of power. A spade is a spade.
  *   **Where the mistake might be:** You assume the boundary between "public" and "private" is obvious. It isn't. In many contexts, the "public" treasury *is* the "private" coffers of the ruling clan by local consensus. The conflict isn't about the *facts* (money moved); it's about who owns the *authority*.

  ### 3. Finding the Seam
  The seam isn't in the facts; it's in the **expectations of the office**.

  Political scientist **Michael Johnston** offers a great way to resolve this. He argues we shouldn't just ask "Is this a bribe?" We should ask: **"What are the institutional expectations here?"**

  1.  **Influence Markets (e.g., US, EU):** Wealthy interests buy access within strong institutions. (Lobbying vs. Corruption debate).
  2.  **Elite Cartels (e.g., some Latin American/Asian states):** Elites collude to divide up resources.
  3.  **Oligarchs and Clans (e.g., post-Soviet states):** Private networks capture the state.
  4.  **Official Moguls (e.g., some authoritarian states):** Leaders treat the state as personal property.

  In contexts 3 and 4, the anthropologists are right: the system *runs* on personal obligation. But the Indexers are also right: this creates high uncertainty and stifles broad-based development.

  ### 4. The Verdict
  You are not wrong to feel the tension, but you are framing it as a logical contradiction when it is actually a **normative conflict**.

  *   **Fact:** Money/gifts exchange hands to secure permits/jobs. (Everyone agrees).
  *   **Anthropologist Interpretation:** This maintains social cohesion and is morally obligatory within that kinship network.
  *   **Indexer Interpretation:** This undermines impersonal rule of law and creates inefficiency.
  *   **Your Interpretation:** This is public power for private gain, regardless of the label.

  **The Resolution:**
  The Anthropologists are describing **legitimacy** (do the locals accept this?).
  The Indexers are measuring **performance** (does this hinder development?).
  You are defining **ethics** (is this an abuse of trust?).

  You can hold all three simultaneously. A practice can be **locally legitimate** (Anthropologists), **objectively corrosive to development** (Indexers), and **ethically corrupt by universal standards of public trust** (You).

  **Where your specific mistake lies:**
  You said: *"If the local norms say the gift is just how you get things done, then there's no fact of the matter about whether it's corrupt."*

  This is the slip. Whether something is "corrupt" is not a fact of nature like gravity; it is a **violation of a specific norm**.
  *   If the norm is "Kinship First," it is not corrupt.
  *   If the norm is "Impersonal Bureaucracy," it is corrupt.

  The conflict arises because most development agencies are trying to *change* the norm from "Kinship First" to "Impersonal Bureaucracy." The Anthropologists are warning you that you can't just import the norm without understanding the social cost. The Indexers are warning you that without the norm, you don't get development.

  **Summary for your seminar:**
  Tell them you think the tension is between **social legitimacy** and **institutional function**. The anthropologists explain why corruption persists (it works socially); the indexers explain why it's a problem (it fails economically); and you are arguing that the definition of "public trust" shouldn't be wholly relative if we care about universal rights and development outcomes. The "thick concept" of corruption binds the description of the act to the condemnation of it, which is why the two readings clash—one wants to describe without condemning, the other condemns based on a universal standard.
