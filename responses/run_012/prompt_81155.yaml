answer: |-
  There is no single, canonical Latin name for this specific maneuver in the standard logic textbooks, which explains why the usual suspects (relative privation, nirvana fallacy) feel slightly off. You are identifying a rhetorical structure that is specific to applied ethics and consequentialist calculation.

  However, in moral philosophy and effective altruism circles, this move is most accurately described as **The Fallacy of Ethical Swamping** (or sometimes **The Swamping Objection**).

  It is closely related to the **Causal Impotence Argument**, but "Swamping" better captures the specific dynamic you described: where a larger pool of harm (whether created by the remedy or existing independently) is used to submerge the moral significance of a smaller, concrete action.

  Here is a breakdown of why the standard labels fail, a definition of Ethical Swamping, and the precise boundary conditions you asked for regarding when this is a fallacy versus a valid empirical claim.

  ### Why the Standard Labels Miss the Mark

  You are correct to reject the standard labels, though they are adjacent:

  *   **Relative Privation ("Not as bad as X"):** This fallacy dismisses a harm because a *different, unrelated* harm is worse (e.g., "Don't worry about animal suffering when children are starving"). The move you describe is subtler. In the "crop death" argument, the counter-claim is not that there is a worse harm *elsewhere*, but that the *remedy itself* generates the worse harm. In the "wild animal" argument, it is that the *same type* of harm exists in such volume elsewhere that your contribution is invisible.
  *   **The Nirvana Fallacy ("Perfect vs. Good"):** This rejects a solution because it doesn't solve the problem *completely*. The move you describe accepts that the solution might work, but argues it is **net-negative** (crop deaths) or **negligible** (wild suffering). It attacks the *efficiency* or *consequences* of the action, not its *purity*.
  *   **The Demandingness Objection:** This argues that a moral theory is false because it requires too much of the agent. The move you describe doesn't say veganism is too hard; it says it is *pointless* or *counter-productive*.

  ### Defining "The Fallacy of Ethical Swamping"

  **Definition:** The Fallacy of Ethical Swamping occurs when an interlocutor argues that a specific, marginal moral action should not be taken because (a) the action produces a comparable harm elsewhere (iatrogenic harm), or (b) there exists a vastly larger pool of comparable harm that the action does not address (dilution), thereby rendering the action morally inert.

  **The Rhetorical Effect:** It shifts the burden of proof from "Can we reduce *some* harm?" to "Can you eliminate *all* harm?" or "Can you prove this is the *optimal* harm reduction?" It induces paralysis by collapsing the distinction between **marginal impact** (what my choice changes) and **total systemic impact** (what the whole system looks like).

  ### The Boundary: Fallacy vs. Sober Observation

  You asked what exactly has to be true for this to be a fallacy, and when it is a valid observation. The boundary lies in three specific distinctions: **Marginal vs. Average**, **Agency vs. Existence**, and **Baseline Comparison**.

  #### 1. Marginal vs. Average (The "Crop Death" Argument)
  *   **The Move:** "Plant agriculture kills field mice. Therefore, eating plants kills more animals than eating beef."
  *   **When it is Valid:** If it is empirically true that the *marginal* unit of plant consumption you purchase triggers a causal chain resulting in more deaths than the *marginal* unit of beef you would have purchased. (Most agricultural economists and ethicists argue this is empirically false due to feed-conversion ratios, but if it were true, the argument would be valid).
  *   **When it is a Fallacy:** When it conflates the **average** harm of a vegan *system* with the **marginal** harm of a vegan *consumer*.
      *   *The Error:* Even if a vegan food system involves crop deaths, your individual decision to buy tofu does not necessarily open a new field or kill a specific mouse. It signals demand. The argument swamps your marginal choice by pointing to the systemic average.
      *   *The Test:* Does the objection address the *consequence of my specific choice*, or does it address the *properties of the alternative system*? If the latter, it is likely swamping.

  #### 2. Agency vs. Existence (The "Wild Animal" Argument)
  *   **The Move:** "Wild animals suffer more than farmed animals. Therefore, focusing on farmed animals is arbitrary."
  *   **When it is Valid:** If you have a credible, actionable pathway to reduce wild animal suffering that is more cost-effective than reducing farmed animal suffering. (This is a serious debate in "suffering-focused ethics").
  *   **When it is a Fallacy:** When it uses the *existence* of a larger harm to negate the *agency* regarding a smaller harm.
      *   *The Error:* This is a category error between **problems we can solve** and **problems that exist**. The mere fact that a larger pool of suffering exists (which we currently lack the technology or leverage to fix) does not morally nullify a smaller pool of suffering that we *can* fix.
      *   *The Test:* Does the objection propose a *better alternative action*, or does it simply point to a *larger problem*? If it points to a larger problem without a tractable solution, it is Ethical Swamping.

  #### 3. Baseline Comparison (The "Do Nothing" Option)
  *   **The Move:** "Your solution causes harm X. Therefore, do not do it."
  *   **When it is Valid:** If Harm X is greater than the harm caused by the **status quo**.
  *   **When it is a Fallacy:** When it compares the **Proposed Action** against an **Ideal Zero**, or against a **Different Harm**, while ignoring the **Status Quo**.
      *   *The Error:* The argument implies the choice is between "Veganism (with crop deaths)" and "No Deaths." It hides the third option: "Omnivory (with crop deaths + slaughter)."
      *   *The Test:* Does the argument compare the remedy to the *current situation*, or to a *theoretical ideal*? If the remedy reduces harm relative to the status quo, pointing out that it doesn't eliminate harm entirely is Swamping.

  ### Summary for Your Arguments

  When this move comes up, you can identify it by asking:

  1.  **Is this a claim about my margin, or the system's average?** (If I stop buying chicken, does one fewer chicken die? If yes, the crop-death argument swamps my marginal impact with systemic averages.)
  2.  **Are you proposing a better alternative, or just a bigger problem?** (If wild animal suffering is worse, what is your concrete plan to fix it? If "none," then you are using an unsolvable problem to paralyze a solvable one.)
  3.  **What is the baseline?** (Are we comparing Veganism to Perfection, or Veganism to the Status Quo?)

  If they cannot answer these without retreating to "Well, nothing matters then," you have successfully identified **Ethical Swamping**: the use of scale or complexity to render moral agency void.

  **Suggested Name:** While you can use **Ethical Swamping**, if you want a term that sounds more established in philosophical debate, you might call it **"The Fallacy of Causal Negligibility"** (for the wild animal argument) and **"The Iatrogenic Fallacy"** (for the crop death argument), noting that both function to produce **Moral Paralysis**. But conceptually, **Swamping** is the most precise descriptor of the "swallowing" dynamic you observed.
