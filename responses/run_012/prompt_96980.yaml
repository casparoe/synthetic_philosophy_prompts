  # Opening remarks

  Good evening, friends. Welcome to the planetarium. Looking around this room, I see the faces of the county astronomical society and our guests from the visiting astrology study group. I want to begin by thanking you both. This new projector shining above us exists because you pooled your resources. In a way, that machine is the perfect symbol for tonight. It projects light through lenses to create a shared sky, regardless of how we interpret the stars beneath it.

  Tonight, we speak of Johannes Kepler. He is a convenient figure for us, because he belongs to both of your traditions, yet fits comfortably in neither. I know what some of the astronomers here hope to hear: that Kepler was a giant of science who unfortunately indulged in the superstitions of his time to pay the rent. I also know what some of the astrologers hope to hear: that Kepler vindicated your craft, proving that celestial patterns influence human life. If I said either of those things, I would be simplifying a man who despised simplification.

  Kepler did cast horoscopes. He needed the income. But he spent much of his intellectual energy trying to reform astrology, not merely practice it. He was deeply skeptical of the traditional apparatus. He regarded the twelve signs of the zodiac as arbitrary human inventions, slices of space with no physical reality. He had little patience for the houses. What he cherished were the aspects—the geometric angles between the planets. The sextiles, the squares, the oppositions. To Kepler, these were not symbolic; they were real geometry.

  But here is the crucial turn, and the reason we cannot simply adopt his conclusions today. Why did Kepler believe these imaginary lines between planets mattered? It was not because the planets射 out rays that struck us like arrows. It was because he believed the Earth itself was alive.

  Kepler proposed that the Earth possessed a soul, an *anima terrae*. He thought the Earth was a sensitive organism, capable of perceiving the geometry of the heavens. When planets formed a harmonious angle, the Earth sensed it like a musical chord. It responded physically—through weather, through the growth of crops, through the temperaments of people born under that sky. The aspects mattered because the Earth was listening.

  This is where his reasoning becomes unavailable to us. For the astronomers in the room: you cannot dismiss Kepler as merely superstitious. He had a physics. It was a physics of harmony and perception, grounded in the optics of his day, but it was a coherent system. He did not believe in magic; he believed in a living cosmos.

  For the astrologers in the room: you cannot claim Kepler fully without adopting his metaphysics. Modern astrology largely relies on the zodiac signs and houses that Kepler explicitly rejected. More importantly, our modern physics does not allow for a sentient Earth that registers planetary geometry as music. We live in a universe of gravity and radiation, not of planetary harmonies perceived by a terrestrial soul. We cannot keep Kepler's conclusions about aspects while abandoning his reasons for why they work. To do so would be to keep the shell without the life inside it.

  So, where does that leave us? It leaves us here, under this dome. We cannot inhabit Kepler's universe, but we can share his wonder. He looked at the sky and saw a structure so profound he believed the Earth itself must sing in response to it. Whether we see that singing as physics or poetry, the impulse comes from the same place: a desire to find connection between the human scale and the celestial scale.

  Tonight is not about resolving that tension. It is about acknowledging that the sky is big enough for our differences. The astronomers bring rigor; the astrologers bring meaning. Kepler brought both, tangled together. Let us honor that complexity. Let us enjoy the light this partnership has made possible. Please, settle in, look up, and let us begin.

  # The line I drew

  I was unwilling to validate modern astrology by claiming Kepler as a progenitor, because his specific reforms rejected the zodiac signs modern astrologers use. Conversely, I refused to dismiss his work as mere superstition, as that ignores the coherent physical metaphysics he proposed. The core constraint was to highlight the *anima terrae*—the living Earth—as the necessary condition for Kepler's astrology. Without endorsing a living Earth, his aspects lose their mechanism. I chose this focus to show that historical context matters: we cannot cherry-pick past conclusions without accepting the worldview that made them logical. This avoids alienating either group while maintaining scientific integrity regarding modern physics.
