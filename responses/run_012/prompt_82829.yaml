          3.  Overall Verdict (Who wins, what they miss).
      *   *Refining Ratings:*
          *   Symmetry: **Contested.** (It's not "mistaken" in Bayesianism, but "right" is too strong for Ellsberg context). Let's go with **Debatable**.
