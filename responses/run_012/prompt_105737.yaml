answer: |-
  The tension you identify lies at the heart of von Neumann's *The Computer and the Brain*. To resolve it, we must distinguish between computation as a physical process and mathematics as a human formalism. Von Neumann is not denying that the brain operates according to natural laws that could be modeled; he is arguing that the *internal code* of the brain does not map cleanly onto the *external symbolic systems* (the "language") humans have developed to describe logic and quantity.

  ### 1. Three Senses of "The Language of Mathematics"

  To evaluate the claim that the brain's language is "not the language of mathematics," we must specify which mathematics is being excluded.

  **A. The Notation of Formal Logic**
  If "language of mathematics" means the discrete, symbolic manipulation of formal logic (e.g., propositional calculus), von Neumann's claim is **substantive**. He argues that while neurons are digital (all-or-nothing), the brain does not chain these signals into long, brittle logical deductions where a single error collapses the result.
  *   **Commitment:** This commits him to the view that neural "logic" is non-binary in effect, even if binary in signal. It implies that validity in the brain is a matter of degree or stability, not truth-value preservation.

  **B. The Language of Exact Arithmetic**
  If it means high-precision numerical calculation (e.g., floating-point arithmetic to 12 decimal places), the claim is **trivially true but deeply instructive**. Von Neumann contrasts the computer's need for exactness with the brain's tolerance for imprecision.
  *   **Commitment:** This commits him to the view that neural "values" are not fixed quantities but ranges or distributions. The brain computes *approximations* of magnitude rather than exact numbers.

  **C. The Language of Probability and Statistics**
  If it means stochastic mathematics, the claim becomes **unstable**. Von Neumann explicitly suggests the brain relies on statistical aggregates. If the brain uses statistical methods, isn't it using the language of statistics?
  *   **Commitment:** Here, von Neumann must be read as distinguishing between the *phenomenon* (statistical behavior) and the *formalism* (our equations for probability). He implies the brain's "statistics" are implemented physically via redundancy and firing rates, not by solving probability equations. Thus, the claim is that the brain *embodies* statistics without *symbolizing* them.

  ### 2. Analog, Digital, or Hybrid?

  Von Neumann is best read as describing a **digitally implemented statistical machine**, which functionally operates as a hybrid.

  He insists the elementary signals are digital (pulses exist or they do not). However, he argues the *information* is carried not by the presence of a single pulse, but by the statistical properties of a train of pulses or a population of neurons. This is not a standard digital computer, which relies on the precise timing and identity of individual bits. Nor is it a pure analog computer, which relies on continuous physical magnitudes (like voltage levels).

  The **reliability-and-redundancy argument** is the pivot point here. In a standard digital computer, reliability is achieved by making components highly reliable. In the brain, components are unreliable, so reliability is achieved by architecture (redundancy and statistical averaging). This pushes the system away from the "digital" label in the engineering sense (von Neumann architecture) because the system is designed to absorb error rather than prevent it. It is digital in substrate but analog in tolerance. Therefore, calling it a "hybrid" is accurate, provided one understands that the "analog" quality emerges from the statistical treatment of digital events, not from continuous signal levels.

  ### 3. The Notation-Mismatch Reading

  The "notation-mismatch reading" is the most charitable and coherent interpretation of von Neumann's position. It posits that the claim is not about the brain being non-mathematical in nature, but about a mismatch between **the internal representations of the system** and **the external notation of the theory describing it**.

  Von Neumann writes that there "exists here a 'language'... different from those to which our mathematical experience has accustomed us." This suggests he is not denying the brain is a mathematical object, but rather that our current mathematical *vocabulary* is insufficient to describe its coding scheme without distortion.

  **Does this require positing a mathematics we do not yet have?**
  Yes. Von Neumann explicitly calls for a new mathematical discipline, likely a blend of combinatorics, statistics, and logic, that treats messages as statistical aggregates rather than discrete symbols. He anticipates what would later become aspects of information theory and connectionism. If we accept the notation-mismatch reading, we avoid the contradiction of a "computing machine" that doesn't use "math." The machine uses a *native* math (physical coding), while we possess only an *external* math (formal description) that fails to capture the native efficiency.

  **Instability:** The position becomes unstable if one presses the definition of "mathematics." If mathematics is the study of pattern and structure, and the brain has structure, the brain uses mathematics by definition. Von Neumann escapes this only by defining "language of mathematics" narrowly as *human formalism*. If he slips into implying the brain operates outside structural laws, he contradicts his premise that it is a computing machine.

  ### 4. Memory and the Notation-Mismatch

  Von Neumann's treatment of memory **strongly supports** the notation-mismatch reading.

  He observes that computer memory is "addressed": specific locations hold specific data, accessed by location. Brain memory, he suspects, is accessed by content or association, likely involving structural changes to the neurons themselves rather than writing to a static slot. Our standard mathematical models of memory (arrays, registers, tapes) rely on the addressed model. If the brain uses a distributed, associative storage mechanism, then our mathematical notation for memory (variables assigned to addresses) is fundamentally mismatched to the brain's internal representation (weights and connectivity patterns).

  This supports the idea that we lack the correct algebraic or topological notation to describe neural storage. It reinforces the claim that the "language" (the method of encoding and accessing information) is different, not that the process is mystical. It undercuts the idea that the brain is a standard digital computer without requiring us to abandon the view that it is a physical system subject to analysis.

  ### Conclusion: The Best Reading and Its Weakness

  The most robust reading is that von Neumann is identifying a **category error in computational modeling**. He argues that we are trying to force the brain into the "language" of the machines we built (EDVAC style), when the brain solves the reliability problem through a different linguistic structure (statistical coding).

  The position becomes unstable only if one conflates "computation" with "digital logic." Von Neumann saves the argument by expanding the definition of computation to include statistical message processing. However, he leaves a gap: he does not provide the new mathematics he calls for. Consequently, his claim rests on a promise of a future formalism. If that formalism turns out to be just standard probability theory applied to neurons, his claim that the language is "not mathematics" dissolves into a claim that it is "not *arithmetic*."

  Summary: Von Neumann argues that the brain is a computing machine whose internal statistical code requires a new mathematical formalism distinct from the exact arithmetic and addressed memory of human-made digital computers.
