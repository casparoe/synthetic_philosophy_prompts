answer: |-
  Here is a plan for your ninety-minute session, designed to leverage your empirical authority while navigating the philosophical minefields your audience inhabits.

  ### 1. The Sequence: Rearranged for Leverage

  Your rough sequence (Contrast → Claim) is logically sound but rhetorically vulnerable. If you start by distinguishing "reason had" from "pattern tracked," you invite the audience to treat the latter as a deficient version of the former. Instead, you must start with the **explanatory necessity** of the rationale.

  **Recommended Order:**
  1.  **The Phenomenon (0–15 mins):** Present the carrying example *first*, in its full biological complexity. Do not label it yet. Show the competence.
  2.  **The Void (15–30 mins):** Reveal the absence of representation. Show the blindness/rigidity. Establish that no "reason" exists inside the system.
  3.  **The Pivot (30–45 mins):** Demonstrate that despite the void, the "reason" predicts better than the mechanism alone. This forces the claim: the rationale is real because it is *usefully real*.
  4.  **The Map of Objections (45–75 mins):** Pre-emptive strikes on misconceptions (detailed below).
  5.  **The Decision (75–90 mins):** The closing question and discussion.

  **Reason for Rearrangement:** Philosophers of mind are trained to look for the "ghost in the machine." If you start with the definition, they will spend the first twenty minutes debating the definition. If you start with the *behavior* that demands explanation, they must accept the data before they can critique the theory. You force them to feel the explanatory gap before you offer the bridge.

  ### 2. The Carrying Example: The Wasp (With Conditions)

  Do not use the honeycomb. While it avoids the "Design" trap, it is a static physical structure, not a biological *function*. It risks collapsing into physics/geometry rather than philosophy of mind/action. Do not use signaling/deception; it invites too much confusion about "who is lying to whom."

  **Stick with the Solitary Wasp (Provisioning/Trap).** It is your terrain. However, to avoid the "Argument from Design" assimilation you fear, the example must meet three criteria:

  1.  **It must be exquisitely tuned:** It must look undeniably like a solution to a problem (e.g., paralysis without death to preserve food freshness).
  2.  **It must be brittle:** You must show a case where the wasp fails because the environment shifted slightly in a way a "designer" would anticipate but evolution hasn't caught up with. This kills the "Designer" objection immediately. It shows the rationale is *floating*, not *anchored* by a mind.
  3.  **It must be opaque to the agent:** You must be able to demonstrate (via literature or observation) that the wasp does not "know" what it is doing (e.g., it will repeat a motor routine even if the prey is removed mid-action).

  **What the example must have:** A clear "goal state" (fresh food for larva) that is objectively identifiable by the observer but not represented by the actor.
  **What the example must not have:** Any hint of learning, flexibility, or central processing that could be confused with cognition.

  **Placement of Thermostats and Immune Systems:**
  Use the **Thermostat** only as a *conceptual key* in the first 10 minutes to define the logic of "goal-directed without mind," then discard it. Do not let it become a second example. Use the **Immune System** only if the wasp example fails to land; it is a good backup for "distributed competence," but it lacks the behavioral narrative of the wasp. Keep the focus on the wasp. Your authority is in the field, not in immunology or cybernetics.

  ### 3. The Map of Misconceptions

  You predicted four troubles. Here is how to categorize them and when to deploy the counter-arguments.

  | Objection | Classification | Timing | Strategy |
  | :--- | :--- | :--- | :--- |
  | **"It's just a metaphor/heuristic."** (Instrumentalism) | **Mistake about the claim.** | **Minute 35** (The Pivot) | Do not argue that the rationale is *physically* real. Argue that it is *explanatorily* real. If the rationale allows prediction that mechanism-level talk does not, it earns its keep. Say: *"I am not claiming the wasp has a thought. I am claiming your physics-level description of the wasp's muscles will not predict the next move as well as the 'fresh food' rationale will."* |
  | **"You are smuggling Teleology back in."** (Purpose in Nature) | **Mistake about vocabulary.** | **Minute 20** (The Void) | Head this off before they raise it. Distinguish *Teleology* (future cause pulling present) from *Teleonomy* (past selection shaping present). Say: *"When I say 'for the sake of,' I mean 'as if designed for.' I am not claiming nature intends. I am claiming selection filters."* |
  | **"The Mechanism explains it all."** (Reductionism) | **Legitimate Objection.** | **Minute 50** (Map Section) | Grant this is true in principle, false in practice. The mechanism is too complex to track. The rationale is a compression algorithm. Say: *"Yes, the neurons cause the sting. But there are millions of neurons. There is only one rationale. Which one do you use to predict the wasp's response to a new trap?"* |
  | **"This is just the Argument from Design."** (Theological/Designer) | **Mistake about history.** | **Minute 25** (The Void) | Use the *brittleness* of your wasp example here. A designer would fix the bugs. Evolution leaves them. The rationale is free-floating because it is a byproduct of history, not a blueprint. |

  **Note on "Unsettled Questions":** The status of Instrumentalism vs. Realism regarding FFRs is genuinely unsettled in philosophy. Acknowledge this at Minute 50. Tell them: *"Dennett leans one way, others another. I am not asking you to settle metaphysics today. I am asking you to accept the explanatory utility."*

  ### 4. What to Say You Are Not Attempting

  You must protect your flank. At the start (Minute 5), explicitly state three things you are **not** doing:

  1.  **I am not solving the Hard Problem of Consciousness.** Whether the wasp "feels" anything is irrelevant to whether its behavior tracks a rationale.
  2.  **I am not making a claim about Genetics.** We are talking about phenotypic behavior and explanatory frameworks, not the specific allelic frequencies.
  3.  **I am not defending Panpsychism.** Attributing a rationale to a system is not attributing a mind to it.

  This prevents the metaphysicians from dragging you into debates you do not want and cannot win in 90 minutes.

  ### 5. The Closing Question

  Do not ask them to define a free-floating rationale. Ask them to decide on its **persistence conditions**.

  **The Question:**
  *"If we discovered a genetic mutation that produced the exact same provisioning behavior via a completely different neural mechanism, would the rationale remain the same, or does the rationale depend on the history of the mechanism?"*

  **Why this works:**
  *   If they say the rationale remains the same, they accept the rationale is **functional/abstract** (supported by FFR).
  *   If they say the rationale changes or vanishes, they are committed to **mechanistic reductionism** (which undermines the utility of FFR).
  *   It forces them to choose between the *history* of the trait and the *current utility* of the trait, which is the exact tension FFR is meant to resolve.

  ### Summary of Advice

  *   **Trust your mud:** Your philosophers know the theory; you know the bug. Let the bug carry the weight.
  *   **Don't fear the Design objection:** Use the wasp's *stupidity* (rigidity) to prove there is no Designer, only a Rationale.
  *   **Control the Thermostat:** Use it to open the lock, then put it away.
  *   **Own the Instrumentalism:** Don't claim the rationale is a physical object. Claim it is a necessary tool for prediction.

  You are not there to teach them biology; you are there to show them that their metaphysics breaks without your data. Lead with the wasp.
