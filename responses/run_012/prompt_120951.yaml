      *   **Causal Closure/Exclusion:** If the physical level accounts for all causation, what room is left for the higher level?
      *   **Levels of Description:** The distinction between ontology (what exists) and epistemology (how we describe it).
      *   **Hofstadter's Specific View:** Hofstadter isn't just a standard emergentist; he's interested in *meaning* and *symbol grounding* arising from isomorphism between levels.
