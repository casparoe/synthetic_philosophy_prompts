      *   *Point 2: Causality.* Do simmballs push? In the model, the simms bounce. But the *clump* moves as a unit because of the internal binding rules. The *shape* determines the trajectory. If you only looked at simms, you'd miss the trajectory. The pattern *constrains* the simms.
