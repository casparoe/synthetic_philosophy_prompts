prompt: |-
  Ok so we did Hofstadter's careenium thing in my philosophy club — the giant pool table with tons of tiny marbles (simms) that clump together into big slow blobs (simmballs) — and I think I get the basic picture, that the simmballs are just patterns made of simms but the simmball level is where all the interesting stuff happens. But heres my problem. If a simmball is just a bunch of simms holding together for a while, then when one simmball bumps into another one, isn't it really the individual simms doing the bumping? So the simmball isn't pushing anything — saying 'the simmball pushed it' is like saying the wave knocked me over when it was really just water molecules. Doesn't that mean only the marble level is actually real, and the simmball level is just a handy way of talking, kind of a useful fiction we tell to save time? And if that's right, how is the whole thing supposed to help explain minds at all, because then my thoughts aren't doing anything either, its just neurons, right? Or am I mixing something up about what 'just' is supposed to mean here?
