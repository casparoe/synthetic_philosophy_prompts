answer: |-
  ### Examination Question

  **Time Allowed:** 60 Minutes
  **Total Marks:** 25
  **Instructions:** Answer all three subparts. You may not cite authors or texts. Rely only on the stipulations below and course concepts.

  **Stipulation one.** A system realizes a functional profile *Shallowly* when, over a stipulated range of inputs, it produces the same outputs as the target system, by whatever internal means. It realizes the profile *Deeply* when, in addition, its internal states can be sorted into kinds whose transition structure mirrors the target's, so that the same counterfactuals hold of it: the same interventions on internal states produce the same transitions, and each state kind is sensitive to the same features of the input.

  **The Case.** Two artificial systems are built to match a human's nociceptive and affective organization as characterized in the course. *Lattice* is assembled from optical rather than electrochemical components; state for state and transition for transition, its internal organization is isomorphic to the human's, and the isomorphism survives intervention, since driving or cutting any of its internal pathways has the structural analogue of the effect that the corresponding intervention has in the human. *Register* matches the human's entire input–output profile across the tested range — it discriminates the same stimuli, issues the same reports, avoids what the human avoids, and is altered in the same ways by the same externally applied interventions — but it achieves this by exhaustive case lookup: for each input it retrieves a stored entry and emits the stored output. No partition of its internal states corresponds to anything in the human. Outside the tested range it emits a fixed default.

  **(a)** To sustain the claim that mental kinds are distinct from physical kinds yet scientifically robust, does the Multiple Realizability argument require Deep realization or only Shallow realization? Based on your answer, does *Register* realize the human functional profile? **(8 marks)**

  **(b)** If we restrict legitimate realization to the Deep notion, we incur a theoretical cost. Identify one kind of system (e.g., a partial realizer, a range-limited realizer, or a system relying on external scaffolding) that functionalists ordinarily wish to count as a subject of experience but which this restriction appears to exclude. Explain why the Deep restriction excludes it. **(8 marks)**

  **(c)** Take a position on whether functional properties can be causally relevant given that physical realizers perform the actual causal work. Does the existence of *Register* make sustaining this position easier or harder than if only *Lattice* existed? Defend your verdict. **(9 marks)**

  ***

  ### Model Answer

  **(a)** The Multiple Realizability (MR) argument aims to show that mental states are defined by their causal roles, not their physical substrate. However, if MR requires only Shallow realization, the thesis becomes trivial. Any system with a lookup table large enough to match human input-output behavior would count as having a mind, regardless of internal structure. This severs the link between mental states and the causal mechanisms that explain behavior. To maintain that mental kinds are scientifically robust—meaning they support counterfactuals and interventions—the MR argument requires Deep realization. Mental states must correspond to internal states that causally mediate inputs and outputs. Consequently, *Register* does not realize the human functional profile. While it matches outputs Shallowly, its internal lookup mechanism lacks the transition structure and sensitivity to input features required for Deep realization. *Lattice*, by contrast, qualifies because its optical states mirror the causal topology of the human system.

  **(b)** Restricting realization to the Deep notion threatens the "Multiple" in Multiple Realizability by demanding structural isomorphism. This excludes systems that achieve functional ends through different internal architectures. A prime example is a system relying on external scaffolding. Consider a cognitive agent that offloads memory or processing to an external notebook or digital device (the extended mind). The internal brain states alone do not mirror the target human's transition structure because the causal loop includes the environment. A Deep realization requirement, focused strictly on internal state partitioning, would exclude this hybrid system, labeling it as lacking the relevant mental states. Similarly, a range-limited realizer (a system that feels pain but lacks the complexity to report it linguistically) might be excluded if its internal transitions do not fully mirror the human's complex affective network. The cost is a return to a form of chauvinism: only systems structurally identical to the target count, undermining the liberal intent of functionalism.

  **(c)** Functional properties can be causally relevant, but only if understood as higher-order structural properties rather than competing physical forces. The physical realizer performs the work, but the functional property identifies the *pattern* of that work that is relevant to explanation. If we say "pain causes withdrawal," we are citing the functional role occupied by a physical state. This position is sustainable if the realizer possesses internal causal structure (like *Lattice*). However, *Register* makes this position significantly harder to sustain. In *Register*, there is no internal causal mediation between input and output; there is only memory addressing. The "state" retrieved does not causally interact with other states to produce the output; it *is* the output instruction. If *Register* were accepted as a mind, functional properties would be stripped of causal relevance entirely, becoming mere labels for input-output correlations. Because *Register* lacks internal causal topology, it demonstrates that Shallow functionalism cannot support causal claims. Therefore, to save the causal relevance of functional properties, we must reject *Register* and insist that functional properties are relevant only when realized by systems with Deep causal structure.

  ***

  ### Marking Scheme

  **General Principle:** Marks are awarded for argumentative decisiveness and correct application of the Stipulations. Name-dropping (e.g., "Putnam," "Block") earns no credit and may incur a penalty if it replaces argument.

  **Subpart (a) [8 Marks]**
  *   **First-Class Move (5 marks):** Explicitly argues that Shallow realization trivializes MR (makes it compatible with lookup tables), thereby undermining the scientific robustness of mental kinds. Concludes Deep realization is required.
  *   **First-Class Move (3 marks):** Correctly applies this verdict to *Register* (fails Deep, passes Shallow) and concludes *Register* does not realize the profile.
  *   **Common Error (-3 marks):** Claiming MR requires only Shallow realization because "inputs and outputs are all that matter," ignoring the counterfactual/intervention clause in the Stipulation.
  *   **Common Error (-2 marks):** Hedging ("It depends on the theory") without offering a decisive verdict as required by the question.
  *   **Common Error (-2 marks):** Confusing *Lattice* and *Register* properties (e.g., claiming *Register* has isomorphic states).

  **Subpart (b) [8 Marks]**
  *   **First-Class Move (5 marks):** Identifies a plausible candidate for mentality (scaffolded, partial, or range-limited) distinct from *Register*. Explains clearly why the Deep requirement (internal isomorphism) excludes it.
  *   **First-Class Move (3 marks):** Articulates the "cost": that functionalism becomes too restrictive/chauvinistic, losing its motivation to be substrate-neutral.
  *   **Common Error (-4 marks):** Citing *Register* as the excluded system. (The question asks for a system functionalists *want* to count; *Register* is the intuition pump for why we might *not* want to count it).
  *   **Common Error (-3 marks):** Failing to explain *why* the Deep restriction excludes the chosen system (e.g., saying "it's different" without referencing internal structure/isomorphism).
  *   **Common Error (-2 marks):** Describing a system that clearly lacks mentality (e.g., a rock) rather than a borderline case functionalists usually accept.

  **Subpart (c) [9 Marks]**
  *   **First-Class Move (5 marks):** Takes a clear stance on causal relevance (e.g., "Yes, as structural patterns" or "No, only physical states are causal").
  *   **First-Class Move (4 marks):** Correctly diagnoses *Register* as a threat to causal relevance because it lacks internal causal mediation (lookup vs. transition). Argues that *Register* makes the position harder to sustain than *Lattice*.
  *   **Common Error (-5 marks):** Claiming *Register* makes causal relevance *easier* to sustain (e.g., arguing that because *Register* is simpler, the function is clearer).
  *   **Common Error (-3 marks):** Treating causal relevance as a competition where functional and physical properties fight for the same causal space (the exclusion error), without resolving it via realization or structure.
  *   **Common Error (-2 marks):** Failing to compare *Register* to *Lattice* or the general case, addressing only the abstract concept of relevance.

  **Differentiation (The Discriminator):**
  The distinction between a 20/25 and a 25/25 lies in **Subpart (c)**. A very good answer will handle (a) and (b) correctly. The excellent answer will recognize that *Register* is not just a non-realizer, but a specific threat to the *causal efficacy* of functional descriptions. It must note that without internal transitions (Deep structure), functional talk is merely descriptive, not explanatory.

  ***

  ### Notes on Tightening and Ambiguity

  1.  **Ambiguity in (a):** A student might argue that MR *historically* relied on Shallow realization (Putnam's Turing Machine functionalism).
      *   *Mitigation:* The question phrases the requirement as "To sustain the claim that mental kinds are... scientifically robust." This forces a normative evaluation of what the argument *should* require to work, rather than a historical report. The model answer addresses this by focusing on triviality.
  2.  **Cheap Answer in (b):** A student might claim "A brain-damaged human" is a partial realizer excluded by Deep realization.
      *   *Mitigation:* The marking scheme penalizes answers that do not explain *why* the Deep restriction excludes them (i.e., lack of isomorphism). Simply asserting exclusion is insufficient. The prompt explicitly suggests "partial, range-limited, or scaffolding" to guide them away from simply saying "Register."
  3.  **Complexity in (c):** "Causal relevance" is a dense topic.
      *   *Mitigation:* The prompt frames it specifically: "given that realizers do the causal work." This points students toward the exclusion problem without requiring them to generate the problem from scratch. The discriminator is whether they see *Register* (lookup) as qualitatively different from *Lattice* (causal mediation) regarding this problem.
  4.  **Word Count:** The model answer is approximately 650-700 words. Students writing significantly more may be reciting course notes rather than thinking; significantly less may lack argumentative depth. The 60-minute limit naturally enforces this.
