      *   **Constraint 4 (Quality Control):** Identify ambiguities or "cheap answers" and suggest tightening.

  2.  **Deconstruct the Provided Material:**
      *   *Shallow Realization:* Input-Output (I/O) match only. (Black box functionalism).
      *   *Deep Realization:* I/O match + Internal state structure mirrors target (counterfactuals, interventions, sensitivity). (White box/structural functionalism).
      *   *Lattice:* Optical components, but isomorphic internal structure to human. Survives intervention. (Deep Realizer, Non-biological).
      *   *Register:* I/O match via lookup table. No internal structure correspondence. Fails outside tested range. (Shallow Realizer only).

  3.  **Drafting the Question (Iterative Process):**
      *   *Goal:* Force a decision on MR, Deep vs. Shallow, and Causal Relevance.
      *   *Subpart (a):* Needs to address the MR argument's requirements. Does MR need Deep or Shallow? Does *Register* count?
