          *   (b) Cost of Deep: Excludes systems that work differently but still feel pain (e.g., simple organisms, or systems with external scaffolding). It threatens the "multiple" in MR.
          *   (c) Causal Relevance. If realizers do the work, functional properties are abstract. Register makes this *harder* because its "states" don't causally interact; they are just addressed memory. Lattice makes it *easier* because internal states causally mediate. Verdict: Functional properties are causally relevant only if realized Deeply.
      *   *Check:* Does this meet the "definite verdict" requirement? Yes.

  5.  **Drafting the Marking Scheme:**
      *   *Format:* Specific moves for First Class. Specific errors.
