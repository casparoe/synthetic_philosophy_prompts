  ### Brainstorm: Claims to Encode

  1.  **Ontological Status:** Music is not a copy of Platonic Ideas (like other arts); it is a direct copy of the Will itself.
  2.  **Structural Analogy:**
      *   **Bass:** Represents the lowest grade of objectification (inorganic nature/stone).
      *   **Harmony:** Represents the intermediate grades (plant, animal, human form).
      *   **Melody:** Represents the highest grade, the Will's constant striving.
  3.  **Psychological Mechanism:**
      *   **Dissonance:** Represents pain/desire/striving.
      *   **Resolution (Tonic):** Represents momentary satisfaction, which inevitably leads to new striving.
  4.  **Soteriological Function:** Aesthetic contemplation usually quiets the Will (will-less subject).
  5.  **The Paradox:** Music *is* the Will, yet listening to it produces will-less quietude. The Will is contemplating itself without striving.

  ***

  ### The Will's Mirror

  It copies not the Ideas, but the Will.
  The bass lays down the inorganic stone,
  And in the hearing, all desire stands still.

  The chords build up the plant and living throne,
  Revealing essence, not the event's thrill,
  It copies not the Ideas, but the Will.

  Striving is pain, resolved in final tone,
  Brief satisfaction ere the longing fills,
  And in the hearing, all desire stands still.

  The subject knows without a self to own,
  Pure knowing, free from all practical skill,
  It copies not the Ideas, but the Will.

  The ladder climbed from stone to flesh and bone,
  Is played out here, yet causes no new ill,
  And in the hearing, all desire stands still.

  The world is noise, yet here the noise is known,
  The Will hears Will, though pain and pressure fill,
  It copies not the Ideas, but the Will,
  And in the hearing, all desire stands still.
