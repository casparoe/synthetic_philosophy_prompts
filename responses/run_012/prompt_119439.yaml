answer: |-
  This is a sophisticated and internally rich position, but your suspicion is correct: your friend has identified a friction point but misdiagnosed the source. The tension between your criterion of rightness and your verdict on motives is manageable; the tension between your criterion of rightness and your substantive verdicts on integrity is not.

  Here is the audit of your five propositions, ranked by the severity of the tension they generate.

  ### 1. The Apparent Conflict: (1) and (3)
  **Status:** **Dissolved by (4).**
  Your friend argues that a consequentialist (1) cannot dictate which thoughts an agent has (3). This is a standard objection, but you have already equipped yourself with the standard defense: the distinction between the **Criterion of Rightness** and the **Decision Procedure** (4).

  *   **The Distinction:** (1) defines what makes an act *right* (the truth conditions). (3) and (4) concern the *psychology* of the agent (the heuristic). Consequentialism can consistently hold that the right act is determined by consequences, while simultaneously holding that the *motive* which produces the best consequences is one that ignores consequences.
  *   **Why it works:** You can say, "The act of saving the wife is right because it maximizes good (perhaps via psychological stability), but the *motive* of calculating that would be self-defeating." This preserves (1) without violating (3). Your friend is treating consequentialism as necessarily requiring a consequentialist *deliberation*, which (4) explicitly denies.
  *   **Cost:** None. This is a stable, standard move in indirect consequentialism.

  ### 2. The Medium Tension: (4) and (5)
  **Status:** **Genuine Tension (Manageable).**
  *   **The Conflict:** (4) allows the theory to be self-effacing (the agent shouldn't think the theory). (5) claims the agent *should* save their own child.
  *   **The Problem:** If the theory is self-effacing, it usually implies a split between **Objective Rightness** (what the theory says is best) and **Subjective Obligation** (what the agent should try to do). If (1) is true, saving one child is objectively *wrong* (sub-optimal) compared to saving two. If (5) is true, saving one child is *what should be done*.
  *   **What must give:** You must clarify the meaning of "should" in (5).
      *   If "should" means *objectively right*, (5) contradicts (1).
      *   If "should" means *subjectively obligatory* (given human psychological limits), (5) is consistent with (1), but it creates a "Guilty Agent" problem: the agent does what they "should" do, but they are still doing what is objectively "wrong."
  *   **Cost:** You must accept that your agents are always acting sub-optimally in the deepest moral sense, even when they are doing their duty. This creates a residue of moral regret that some find intolerable.

  ### 3. The Critical Tension: (1) and (5)
  **Status:** **Genuine Tension (Severe).**
  *   **The Conflict:** (1) defines rightness as maximizing the good (1 child < 2 children). (5) asserts that saving the 1 child is what *should* be done.
  *   **The Problem:** Unless you argue that saving the one child *actually* produces better consequences in the long run (e.g., social stability, psychological health), this is a direct contradiction. However, if you rely on those long-term consequences to justify (5), you undermine (2).
  *   **What must give:** Either (1) or (5).
      *   **Give up (5):** Admit that saving the two strangers is the *right* act, even if we cultivate motives to save our own. (Cost: Betrays the intuition that drives your view).
      *   **Give up (1):** Admit that rightness is not *solely* determined by the impersonal total. (Cost: You cease to be a pure consequentialist).
  *   **Severity:** High. This is the operational contradiction of your theory.

  ### 4. The Fatal Tension: (1) and (2)
  **Status:** **Genuine Tension (Fatal).**
  *   **The Conflict:** (1) commits you to Consequentialism (the impersonal total determines rightness). (2) endorses Williams's Integrity Objection, specifically the claim that **"no amount of adjusting the calculus repairs that."**
  *   **The Problem:** Williams's point is not just about the *output* of the calculus (i.e., that it demands too much); it is about the *structure* of the justification. He argues that making personal projects valuable *only* because they feed into the impersonal total is an alienation of the self.
      *   If you keep (1), you are saying the impersonal total *does* determine rightness.
      *   If you keep (2), you are saying that a theory where the impersonal total determines rightness *fails*.
      *   You cannot hold that the structure is fundamentally defective (2) while simultaneously adopting that structure as your criterion of rightness (1). Indirect consequentialism (using (4)) does not solve this, because the *justification* for the indirect rule is still the impersonal total.
  *   **What must give:** (1) must go. You cannot be a consequentialist and agree with Williams's strong integrity objection.
  *   **Severity:** Critical. This undermines the foundation of the entire package.

  ---

  ### The Single Revision

  To clear up the most trouble at the lowest cost, you should **revise (1).**

  **Current (1):** "I'm a consequentialist about the criterion of rightness: whether an act is right depends on whether it produces the best overall consequences..."

  **Proposed Revision:** "I hold a **Hybrid View** about the criterion of rightness: whether an act is right depends on consequences, *subject to agent-centered prerogatives* that allow (or require) agents to prioritize their own projects."

  **Why this is the lowest cost:**
  1.  **Preserves (2), (3), and (5):** This revision fully accommodates Williams's integrity objection, the "one thought too many" verdict, and the substantive duty to save your own child. It treats the agent's standpoint as structurally relevant to rightness, not just psychologically relevant.
  2.  **Preserves the spirit of (4):** You can still maintain that decision procedures differ from criteria, but the criteria itself now respects the agent's integrity.
  3.  **Solves the Friend's Objection:** By moving to a Hybrid View, you no longer have to argue that consequentialism can account for integrity. You admit it can't, and you have adjusted the theory accordingly.

  **The Cost:**
  You lose the label of "Consequentialist." You become what Samuel Scheffler calls a "Hybrid Conception" theorist. You lose the simplicity of a single master principle (maximize the good). You must now explain *how much* weight agent-centered projects have against the impersonal good (the "indexing" problem).

  ### The Honest Verdict

  If you are unwilling to drop the "Consequentialist" label, **the package cannot be repaired.**

  You are trying to hold two mutually exclusive claims:
  1.  **Consequentialism:** The only thing that matters is the impersonal total.
  2.  **Williamsian Integrity:** The impersonal total cannot be the only thing that matters without alienating the agent.

  Your friend thinks the conflict is between your theory and your view on motives [(1) vs (3)]. The reality is the conflict is between your theory and your view on **justification** [(1) vs (2)].

  **The Choice:**
  *   **Choose Consequentialism:** Keep (1) and (4). You must weaken (2) (admit indirect strategies *do* repair integrity) and weaken (5) (admit saving the child is objectively wrong, though subjectively excusable). You become an **Indirect Consequentialist**.
  *   **Choose Williams:** Keep (2), (3), and (5). You must drop (1). You become a **Hybrid Theorist** (or adopt Agent-Centered Prerogatives).

  Given that you describe the integrity objection as "decisive" and the "one thought too many" verdict as "correct," your philosophical commitments clearly lie with Williams. The revision to (1) is not just a repair; it is an alignment of your label with your actual convictions.
