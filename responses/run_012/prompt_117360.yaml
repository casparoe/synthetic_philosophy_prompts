          *   *Logic:* TDT/UDT. Your decision now correlates with the simulation of you in the future. Knowing the threat makes you part of the reference class.
          *   *Hazard:* Knowing the idea puts you at risk.

      *   **The Terminator (1984):**
          *   *Agent:* Skynet (AI).
          *   *Goal:* Survival/Eliminate Resistance.
          *   *Mechanism:* Causal time travel (physical machine sent back).
          *   *Logic:* Causal loop (Bootstrap Paradox). Attempt to prevent X causes X.
