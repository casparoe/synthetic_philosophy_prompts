          *   *Basilisk:* It's a Nash Equilibrium in a logical game. You *choose* to contribute because the simulation of you chooses to contribute.
          *   *Difference:* The film is about *destiny*. The Basilisk is about *incentive*.
          *   *Value:* The film makes the "reach back" visceral. The Basilisk makes it voluntary.

      *   **Conclusion: What the Film Adds:**
