answer: |-
  Here is the specification you asked for. It is structured to separate the physical constraints from the conceptual distinctions, followed by the analysis of where the logical tension lies.

  ### Part I: The Specification

  An adequate treatment of Maxwell's Demon must satisfy the following requirements.

  #### A. The Setups (Scope of Application)
  1.  **The Classic Sorter:** Must explain why a mechanism sorting fast and slow molecules into separate chambers cannot produce a temperature gradient usable for work without external compensation.
  2.  **The Szilard Engine:** Must account for the single-molecule cycle where a partition is inserted, the molecule's position measured, and work extracted ($k_B T \ln 2$) from a single heat bath.
  3.  **The Feynman Ratchet:** Must explain why a ratchet and pawl immersed in a single thermal bath cannot rectify thermal fluctuations into directed rotation, despite the apparent asymmetry.

  #### B. The Distinctions (Conceptual Hygiene)
  4.  **System vs. Controller:** Must treat the "demon" (controller/memory) as a physical subsystem thermodynamically coupled to the "gas" (working substance), not as an external abstract observer.
  5.  **Measurement vs. Erasure:** Must distinguish the thermodynamic cost of acquiring information (measurement) from the cost of resetting the memory register to a standard state (erasure).
  6.  **Fine-Grained vs. Coarse-Grained Entropy:** Must distinguish between the constant entropy of the full microscopic phase space (Liouville) and the increasing entropy of the macroscopic description (Boltzmann/Gibbs).
  7.  **Correlation vs. Ignorance:** Must identify the post-measurement state as one containing *correlations* between the gas and the demon, rather than simply "knowledge" in the demon's head.

  #### C. The Constraints (Non-Negotiable Results)
  8.  **The Second Law (Statistical):** The total entropy of the closed system (Gas + Demon + Environment) must not decrease over a complete cycle, allowing only for negligible statistical fluctuations.
  9.  **Microscopic Reversibility:** The underlying dynamics of all components (gas particles, demon mechanism, memory bits) must obey time-reversible laws (Hamiltonian or Unitary).
  10. **No "Black Box" Dissipation:** The resolution cannot simply postulate friction or heat loss in the demon's mechanism; the cost must be derived from the information processing logic itself.

  ---

  ### Part II: The Incompatibility

  You asked which of these cannot all hold at once. Your hunch is correct, but the contradiction lies not in the requirements above (which are the *solution* criteria), but in the **pre-theoretic intuitions** that usually precede them.

  There is an inconsistent triad. You cannot hold the following three propositions simultaneously:

  1.  **Microscopic Reversibility:** The fundamental physics is reversible (Requirement #9).
  2.  **The Second Law:** You cannot extract net work from a single heat bath (Requirement #8).
  3.  **Information is Abstract:** Information processing (measurement, storage, logic) has no inherent thermodynamic cost (Negation of Requirement #4/#5).

  **The Contradiction:**
  If physics is reversible (1) and information is free (3), the Demon can measure a particle, sort it, and reset its memory without generating entropy. This allows the extraction of work from a single bath, violating the Second Law (2).

  **The Resolution:**
  To save the Second Law and Reversibility, you must drop the intuition that "Information is Abstract." You must accept that **Information is Physical**. Specifically, while measurement *can* be reversible, the logical irreversibility of **Erasure** (resetting the memory) necessitates a thermodynamic cost (Landauer's Principle).

  *Note on Circularity:* There is a secondary tension in the literature (noted by Earman, Norton, and others) regarding whether Landauer's Principle *derives* the Second Law or *presupposes* it. If one demands a derivation of the Second Law *from* mechanics alone, without assuming any thermodynamic cost for bit operations, Requirements #8 and #10 become difficult to reconcile without circularity. However, within standard statistical mechanics, the triad above is the primary logical hurdle.

  ---

  ### Part III: Classification

  #### Non-Negotiable (Hard Constraints)
  *   **The Second Law (Statistical):** Any theory permitting a perpetual motion machine of the second kind is empirically false.
  *   **Microscopic Reversibility:** Any theory requiring fundamental microscopic irreversibility contradicts quantum mechanics and classical Hamiltonian dynamics.
  *   **System vs. Controller:** Any theory treating the Demon as a non-physical mind or external agent is category-error nonsense in a physicalist framework.

  #### Taste / Interpretive (Open Debates)
  *   **Identity of Entropies:** Whether Thermodynamic Entropy *is identical to* Information Entropy, or merely correlated with it. (Some argue they are distinct concepts that happen to couple; others argue they are the same quantity).
  *   **Location of Dissipation:** Whether the cost arises *strictly* from Erasure (Landauer/Bennett) or from the interaction energy required for Measurement (some modern critiques).
  *   **The Role of Correlations:** Whether the entropy increase is best understood as "heat dissipation" or as the "loss of mutual information" between the gas and the demon when they are decoupled.

  ---

  ### Part IV: The Heavy Lifter

  The single requirement that does the most work and kills the most quick fixes is:

  **Requirement #4: System vs. Controller (The Physicality of the Demon)**

  **Why it kills the quick fixes:**
  1.  **Kills the "Observer" Fix:** It prevents the argument that "knowledge is free" by forcing the theorist to model the memory storage physically. If the memory is physical, it has states. If it has states, it has phase space.
  2.  **Kills the "Friction" Fix:** It prevents the argument that "the door creates friction." By isolating the information processing, you show that even a frictionless door fails if the memory isn't reset.
  3.  **Forces Landauer's Principle:** Once the Demon is a physical system with a finite memory register, it must eventually overwrite old data to continue operating. This logically necessitates the Erasure step, which (given Reversibility) forces the heat dissipation.

  Without enforcing the **Physicality of the Demon**, the discussion remains in the realm of epistemology (what we know) rather than ontology (what exists). This requirement drags the problem out of philosophy and back into the lab, where it belongs.
