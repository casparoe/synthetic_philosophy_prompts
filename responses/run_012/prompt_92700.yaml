  **CONFIDENTIAL // INTERNAL USE ONLY**
  **DOCUMENT ID:** GISB-FO-2024-REV3
  **SUBJECT:** Field Officer Guidance on Asset Transfer & Social Obligation
  **FROM:** Global Integrity Standards Board (GISB), Compliance Division
  **TO:** All Regional Field Operatives

  **1.0 PURPOSE**
  The following FAQ clarifies the distinction between Permissible Cultural Hospitality (PCH) and Undue Influence Assets (UIA). Field officers must adhere to these metrics to ensure audit readiness. Ambiguity is a compliance risk.

  **2.0 FREQUENTLY ASKED QUESTIONS**

  **Q2.1: How do we distinguish a gift from a bribe in high-context cultures?**
  **A:** The distinction is temporal, not qualitative. All transfers of value are initially classified as Gifts. They remain Gifts only during their **Reciprocity Half-Life**. For Tier-2 Jurisdictions, the Half-Life is 45 days. If the recipient does not provide quantifiable reciprocal value to the GISB within this window, the asset decays into a Bribe retroactively. Officers must log the "decay date" in the portal. If a local official offers a meal on Day 1, and no contract is signed by Day 46, the meal is reclassified as a UIA. The officer must then file a Self-Reported Exposure Form. Do not attempt to negotiate the Half-Life with local partners; biological time is subjective, compliance time is absolute.

  **Q2.2: Our team is embedded in a region where refusing hospitality violates kinship obligations. Can we participate?**
  **A:** Participation is permitted only through **Cultural Reciprocity Offsets (CROs)**. If your home office is in a Low-Context Jurisdiction (e.g., Zurich, London, New York), your hospitality allowance is capped. To operate in a High-Context Jurisdiction without breaching caps, you must purchase CROs from the GISB marketplace. These credits are generated by firms in Low-Context Jurisdictions that successfully declined hospitality. Essentially, a refusal in London funds your acceptance in Lagos. This nets global reciprocity to zero. Note: CROs do not cover kinship obligations involving marriage or inheritance. These are classified as "Undisclosed Conflict Vectors" and must be severed prior to deployment.

  **Q2.3: What is the protocol for gifts flowing toward Headquarters versus those flowing to the Field?**
  **A:** Directionality determines classification. Assets moving from Field to Headquarters are classified as **Administrative Samples**. These are exempt from the Half-Life metric provided they are labeled as "Cultural Artifacts" and valued under $500. They are considered data, not influence. Conversely, assets moving from Headquarters to Field partners are classified as **Capacity Building**. However, if a Field partner requests a specific Capacity Building asset (e.g., a vehicle, a school roof) in exchange for data access, this triggers the Half-Life clock immediately. Influence is defined by the recipient's location relative to the payroll. Inbound flow is hospitality; outbound flow is procurement.

  **Q2.4: Local partners insist that "corruption" is simply our term for their social safety net. How do we respond?**
  **A:** This is a semantic objection, not a compliance one. The GISB defines corruption as any reciprocity loop that bypasses the Board's monitoring infrastructure. If a local official uses a gift to fulfill a community obligation (e.g., paying a nephew's school fees), this is a leakage of value. It becomes corruption when the GISB cannot audit the nephew. Officers should explain that while local ethics are respected, they are subordinate to Global Integrity Standards. If the partner argues that the Standards export Western individualism, remind them that CROs are market-based and culturally neutral. The market does not have a culture; it has a price.

  **3.0 CONCLUSION**
  Ethics is not a feeling; it is a ledger. If the reciprocity is not logged, it did not happen. If it happened but was not logged, it is a crime. Field officers are reminded that the integrity of the system depends on the consistent application of these metrics, regardless of local social reality.

  **END OF DOCUMENT**
