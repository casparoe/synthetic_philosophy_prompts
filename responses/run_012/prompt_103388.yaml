      *   *Step 5: The Alternative Account.* "Mechanism sketches" or "Programme explanations" (Jackson & Pettit). We cite the social fact because it captures a *structure* that remains invariant across different individual realisations.
      *   *Step 6: Concessions.* We must admit social properties are causally relevant, even if ontologically derivative. We must admit that demanding microfoundations for everything is pragmatically useless.

