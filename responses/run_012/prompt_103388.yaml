      *   **Context:** A reading group discussion on social ontology and explanation (methodological individualism vs. holism).
      *   **The Argument:** A six-step argument concluding that only individualist explanations are genuine (reductive individualism).
          *   (1) Social facts supervene on individual facts (ontological individualism).
          *   (2) Explanation requires reduction to the base facts (explanatory reductionism).
