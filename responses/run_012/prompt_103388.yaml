      *   *Premise (2):* The "Explanatory Reduction Principle." "If $X$ is nothing over and above $Y$, explanation of $X$ must be in terms of $Y$." This is the crux. It conflates ontology with explanation.
      *   *Premise (3):* Inference from (1) & (2).
