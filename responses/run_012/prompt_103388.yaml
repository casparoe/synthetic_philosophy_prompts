answer: |-
  Your intuition is sound: the argument you have encountered is a classic formulation of **methodological individualism**, but it relies on a sleight of hand between ontology and explanation. To preserve your commitment to ontological individualism (1) without accepting the draconian conclusion (6), you should reject **Premise (2)**.

  Here is an analysis of why that step fails, why it tempts us, and how to construct a defensible account of social explanation that retains individualist ontology whilst granting autonomy to social science.

  ### 1. The Diagnosis: Rejecting Premise (2)

  Premise (2) states: *If a fact is nothing over and above facts of some other kind, then an adequate explanation of it must be given in terms of facts of that kind.*

  This is the bridge from **Ontological Individualism** (social facts supervene on individual facts) to **Explanatory Individualism** (social facts must be explained by individual facts). This bridge is unsound.

  **Why it looked compelling:**
  It appeals to a deep metaphysical intuition: that to truly understand a thing, one must understand its constituents. If a watch is 'nothing over and above' its gears and springs, surely the explanation of its timekeeping must be found in the mechanics of the gears? This view conflates *constitution* with *explanation*. It assumes that the vocabulary required to describe what exists must be identical to the vocabulary required to explain why things happen.

  **Why it fails:**
  Explanation is not merely a mirror of ontology; it is a pragmatic tool for identifying **causal dependencies** and **patterns**.
  Consider the philosophy of mind: most physicalists agree that mental states are 'nothing over and above' neural states (ontological physicalism). Yet, few would argue that explaining why a man went to the fridge requires a neurochemical account rather than a psychological one ('He was hungry'). The psychological explanation captures a pattern that would be invisible in the noise of the neural data.

  Similarly, in social science, citing a 'recession' or a 'norm' identifies a structural constraint that operates regardless of the specific individuals involved. If you insist on explaining a recession solely through individual beliefs, you lose the generalisation that makes the explanation useful. You might explain *this* recession, but you cannot explain *recessions* as a phenomenon.

  ### 2. Addressing Your Worry: Does it Prove Too Much?

  You noted that the conclusion seems to condemn aggregation models (like Schelling's segregation model), even though they are told in terms of individuals.

  Strictly speaking, the argument you quoted would *accept* a Schelling model, as it derives the macro pattern from micro preferences. However, your worry touches on a deeper issue: Premise (5) claims that macro-explanations are merely 'placeholders until microfoundations are supplied'.

  If we accept (2), we imply that an explanation is incomplete unless it is *exhaustively* micro. This is where the argument proves too much. Even a Schelling model abstracts away from specific individuals; it speaks of 'agents' and 'preferences' as types, not tokens. If the reading group insists on *token-level* individualism (facts about *this* specific person at *this* specific time), then even agent-based modelling fails.

  By rejecting (2), you protect both macro-explanations ('Segregation occurred due to institutional zoning') and micro-foundational models ('Segregation occurred due to aggregated mild preferences'). Both are valid explanations at different levels of abstraction. Neither is a mere 'placeholder'; both capture genuine causal relationships.

  ### 3. A Defensible Account: Non-Reductive Individualism

  If you give up (2), what replaces it? You need an account that respects supervenience (1) but allows for **explanatory autonomy**. The most robust framework for this is often called **Compatibilism** or **Non-Reductive Individualism** (associated with philosophers like Frank Jackson, Philip Pettit, and Daniel Little).

  Here is what that account looks like:

  **A. Causal Autonomy of Social Properties**
  Even if social properties supervene on individual properties, they can still be causally efficacious. A 'run on the bank' causes the bank to collapse. This is not magic; the collapse is realised by individual actions. However, the *cause* of the collapse is the structural fact of the run, not the specific belief of Mr Smith in the queue. The social fact acts as a **programmatic explanation**: it ensures that *whatever* the individual details are, the outcome remains the same.

  **B. Explanatory Pluralism**
  Explanations are judged by their utility, not just their ontological bedrock. A macro-explanation is superior when it is:
  1.  **Robust:** It holds across different realisations (e.g., inflation happens regardless of which specific traders are selling).
  2.  **Manageable:** It avoids the 'complexity trap' of tracking millions of individual variables.
  3.  **Pattern-revealing:** It highlights structural constraints (laws, norms, institutions) that guide individual action.

  **C. Mechanism Sketches**
  When we cite a social fact (e.g., 'the norm was enforced'), we are not ignoring individuals; we are offering a 'mechanism sketch'. We are asserting that there *is* a constellation of individual beliefs and actions that realise this norm, and that this constellation is sufficient to produce the outcome. We do not need to fill in every detail to have a genuine explanation, just as a computer scientist does not need to cite electron flows to explain a software crash.

  ### 4. What Must You Concede to the Holist?

  By rejecting (2) and keeping (1), you occupy a middle ground. However, to make this position work, you must make significant concessions to the holist (those who believe social wholes exist independently). You cannot simply dismiss them as confused.

  **1. Concede Causal Efficacy to Social Kinds**
  You must admit that social kinds (recessions, norms, institutions) are not merely *façons de parler* (ways of speaking). They carve nature at its joints. If you treat them as mere shorthand for 'lots of individuals doing things', you underestimate their power. They exert 'downward causation' on individuals (e.g., the recession causes *me* to lose my job). You must concede that social properties have a reality in the causal order, even if they are ontologically dependent.

  **2. Concede the Priority of Practice**
  You must admit that in actual scientific practice, the macro-explanation is often the *primary* one, not a temporary proxy. The holist argues that social structures constrain individuals. You must concede that explaining the constraint often requires vocabulary that cannot be translated into individualist terms without loss of meaning. For instance, 'being a prime minister' is defined by a system of rules, not by the individual's psychology. To explain their action, you must cite the office, not just the person.

  **3. Concede Multiple Realisability**
  This is the strongest weapon against Premise (2). The same social fact (e.g., a currency crisis) can be realised by vastly different configurations of individual beliefs. If you insist on individualist explanation, you end up with a disjunction of millions of unique micro-stories that share no common explanatory thread. You must concede that the *social* description is the only thing that unifies these cases into a single phenomenon.

  ### Summary

  The argument fails at **Premise (2)**. It mistakenly infers that because the *world* is made of individuals, our *stories* about the world must only mention individuals.

  *   **Cost of giving up (2):** You lose the dream of a single, unified, fundamental level of explanation. You must accept a pluralistic world where different levels of description capture different causal patterns.
  *   **Benefit:** You save the phenomena. You can keep your ontological individualism (no spooky social souls) whilst validating the actual practice of sociology and economics.
  *   **Concession:** You must grant that social properties are causally real and that macro-explanations are often superior to micro-explanations, not merely pragmatic shortcuts.

  In short, you can maintain that society is made of people, without insisting that every truth about society must be told using only the names of people.
