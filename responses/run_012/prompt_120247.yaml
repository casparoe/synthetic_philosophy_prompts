      *   Tipping: Voluntary surplus (Non-zero-sum).
      *   Queue custom is about *distribution of scarcity*. Tipping custom is about *signaling respect*.
      *   Tipping: Leaving a tip when it's forbidden is an assertion of superiority ("I know better than your culture"). Queue: Holding a spot is a functional mechanism for households.
      *   *Verdict:* Different outcome. In tipping, Omar was objectively rude (signaling wealth/charity where it's insulting). In the queue, he was defending a universalist fairness principle against a local particularist one. The tipping incident is a clearer moral failure on Omar's part because it imposes a value judgment on the host, whereas the queue was a dispute over resource rights.

  7.  **The Counterfactual (Men Only):**
