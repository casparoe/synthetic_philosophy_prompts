  Here is the principle derived from your verdicts, structured to preserve your distinctions between acceptable and unacceptable uses of the present, followed by the necessary corrections to your judgments.

  ### The Principle of Local Rationality and Conceptual Integrity

  A history of science is Whiggish if and only if it violates one of the following three clauses; conversely, it is sound if it respects them, even when using present knowledge heuristically.

  1.  **The Clause of Conceptual Anachronism:** Do not attribute modern theoretical entities, concepts, or distinctions to past actors who lacked the conceptual framework to define or recognize them.
      *   *Forced by Case (iii):* Attributing the "gene" to Mendel imposes a twentieth-century concept on a nineteenth-century framework of "factors" or "characters," distorting his actual intellectual achievement.
  2.  **The Clause of Retrospective Rationality:** Do not explain past scientific dissent, error, or resistance primarily by attributing personal vice, blindness, or irrationality to the actors, when their position was epistemically defensible given the evidence and theories available at the time.
      *   *Forced by Case (ii):* Describing geophysicists as "blinded" ignores that the mechanism for continental drift was physically inexpensible in the 1920s; their resistance was rational, not vicious.
  3.  **The Clause of Teleological Deficit:** Do not evaluate a scientific tradition's worth or success by its failure to produce a specific, externally determined outcome (usually a Western or modern one) that was not its own aim.
      *   *Forced by Case (v):* Asking why Chinese astronomy produced no Kepler assumes Kepler was the goal, judging a distinct tradition by what it lacked rather than what it achieved.

  **The Heuristic Exception (The Save):**
  It is permissible to use present knowledge to organize a narrative, map a trajectory, or assess the fertility of research programmes, *provided* that this does not distort the local rationality or conceptual vocabulary of the past actors.
  *   *Forced by Cases (i), (vi), and (vii):* You accept that Lavoisier won (i), that cosmology can be mapped from the present (vi), and that a research programme can be graded as a "holding pattern" (vii). These are acceptable because they judge the *fate of ideas* or the *structure of the field*, not the *rationality of the agents*.

  ### Predictions for Unlisted Cases

  1.  **A museum exhibition on cold fusion:**
      *   *Prediction:* **Whiggish** if it presents Pons and Fleischmann as fools or frauds solely because the current consensus rejects their claims. It would be **Sound** if it reconstructs the calorimetric context of 1989, acknowledges why the claim was initially plausible to experts, and treats the episode as a lesson in replication and social pressure rather than a moral failure.
  2.  **A history of phrenology:**
      *   *Prediction:* **Sound.** Treating its failure as an "ordinary empirical failure" respects the Clause of Retrospective Rationality. Phrenologists were working with the best anatomical data of their time; acknowledging this avoids the Whig trap of treating them as charlatans simply because they were wrong.
  3.  **A history of the amyloid hypothesis in Alzheimer's research:**
      *   *Prediction:* **Indeterminate/Risky.** Since no consensus exists yet, grading past researchers as "wrong" violates the Clause of Retrospective Rationality (they followed the best evidence they had). A history that traces the heuristic value of the hypothesis without declaring the researchers "misled" would be Sound; a history that uses the current lack of drugs to impugn their judgment would be Whiggish.

  ### Necessary Overturns and Classification of Case (iv)

  There is one verdict among your seven that this principle cannot accommodate without contradiction.

  **Case (iv) (Semmelweis):** You judge this as "bad, but... a different sin." Under the **Clause of Retrospective Rationality**, this is incorrect. The story that Semmelweis's colleagues rejected handwashing due to "vanity and obstinacy" is the medical equivalent of the geophysicists being "blinded." In both cases, the losers had epistemic reasons for their resistance (miasma theory was the dominant paradigm; germ theory did not yet exist). To explain their belief by vice rather than by their available evidence is to commit the exact same sin as in Case (ii). It is not a different sin; it is Whiggishness in its most populist form (the "Heroic Truth-Teller" myth). You must surrender the distinction that this is *not* Whiggish.

  Case (vi) is borderline; strict Butterfieldians would call it Whiggish. However, under the **Heuristic Exception**, it survives if it remains a "map" and does not claim past actors were irrational for not seeing the current model. I have preserved your verdict here, but you must remain vigilant that the "map" does not become a "judgment."

  Verdict: History is Whiggish when it explains past scientific belief or action by present truth rather than by the evidence and concepts available to the actors at the time, unless it is explicitly framed as a heuristic map of idea fertility; (iv).
