answer: |-
  Here is a decision tree designed for your seminar. It contains 15 nodes (7 branching questions, 8 terminal positions). The questions are phrased to be neutral, allowing students to follow their intuitions without needing to know the label of the destination.

  ### The Vagueness Sorting Tree

  **Node 1 (Root): The Location of Fuzziness**
  Consider a cloud or a heap. Is the lack of a sharp boundary primarily a feature of the **object itself** (the world is fuzzy), or is it a feature of **our language/concepts** (the world is precise, but our words are not)?
  *   **A. The Object/World:** Go to Node 2.
  *   **B. Language/Concepts:** Go to Node 4.

  **Node 2 (Ontic Branch): The Identity Constraint**
  *Case: The Problem of the Many.* Imagine a cloud with many water droplets near its edge. Can there be two distinct clouds occupying almost the same space, differing by only one droplet, where it is a **fact** that one is a cloud and the other is not, despite being microphysically identical?
  *   **A. Yes, distinct objects can differ in property F despite micro-identity:** Go to Node 3.
  *   **B. No, that violates the identity of indiscernibles:** (This path leads to the view that vagueness cannot be ontic). Return to Node 1 and choose **B**.

  **Node 3 (Leaf): Ontic Vagueness**
  *   **Position:** Ontic Vagueness (e.g., Evans, Lowe).
  *   **Sorites Premise Denied:** The Inductive Step (the world itself fails to support the transition).
  *   **Higher-Order Vagueness (HOV):** **Accepted.** The boundaries in reality can themselves be vague.
  *   **Note:** Commits you to non-classical mereology or identity logic.

  **Node 4 (Representational Branch): Context Stability**
  *Case: 'Tall'.* If you fix the conversational context (e.g., "tall for a jockey" vs. "tall for a basketball player"), does the extension of the word (the set of people it applies to) have a fixed boundary, or does it shift constantly even within a single conversation depending on attention or stakes?
  *   **A. It shifts dynamically with attention/stakes:** Go to Node 5.
  *   **B. It is fixed for that context:** Go to Node 6.

  **Node 5 (Leaf): Contextualism**
  *   **Position:** Contextualism (e.g., Kamp, Raffman).
  *   **Sorites Premise Denied:** The Inductive Step (the meaning shifts just enough between steps to block the paradox).
  *   **Higher-Order Vagueness (HOV):** **Accepted.** Explained by higher-order shifts in context.
  *   **Note:** Vagueness is explained by pragmatic rules of conversation, not semantics.

  **Node 6 (Fixed Meaning Branch): The Fact of the Matter**
  For a fixed context, is there a specific number of grains (or nanometers of wavelength) that marks the exact cutoff between 'heap' and 'non-heap', even if humans could never know what it is?
  *   **A. Yes, there is a precise cutoff:** Go to Node 7.
  *   **B. No, there is no such number:** Go to Node 8.

  **Node 7 (Leaf): Epistemicism**
  *   **Position:** Epistemicism (e.g., Williamson, Sorensen).
  *   **Sorites Premise Denied:** The Tolerance Principle (there is a sharp boundary, we are just ignorant of it).
  *   **Higher-Order Vagueness (HOV):** **Accepted.** There are sharp boundaries to the boundary, we just don't know them either.
  *   **Note:** Preserves classical logic and bivalence entirely.

  **Node 8 (No Cutoff Branch): Borderline Truth Values**
  Take a clear borderline case (e.g., a patch that is neither clearly red nor clearly orange). Is the sentence "This is red" **False** (or strictly neither True nor False), or is it **Partially True**?
  *   **A. Partially True (degrees of truth):** Go to Node 9.
  *   **B. Neither True nor False (a gap):** Go to Node 10.

  **Node 9 (Leaf): Degree Theory (Fuzzy)**
  *   **Position:** Degree Theory / Fuzzy Logic (e.g., Machina, Edgington).
  *   **Sorites Premise Denied:** The Tolerance Principle (truth values degrade by tiny degrees at each step).
  *   **Higher-Order Vagueness (HOV):** **Accepted.** Modeled by smooth curves rather than sharp steps.
  *   **Note:** Requires abandoning classical logic (e.g., Law of Non-Contradiction may fail).

  **Node 10 (Gaps Branch): Classical Logic Preservation**
  If borderline cases are neither True nor False, do we still want to preserve classical logic (like "If P then P" or "Either P or not-P") for the clear cases?
  *   **A. No, we must change the logic:** Go to Node 11.
  *   **B. Yes, classical logic should hold for clear cases:** Go to Node 12.

  **Node 11 (Leaf): Eliminativism / Nihilism**
  *   **Position:** Eliminativism (e.g., Unger, Rosen).
  *   **Sorites Premise Denied:** The Existence Premise (there are no heaps; the predicate fails to refer to any property).
  *   **Higher-Order Vagueness (HOV):** **N/A.** (No property means no boundaries to be vague).
  *   **Note:** The 'no such property' line. Radical but solves the paradox by dissolving the subject.

  **Node 12 (Supervaluation Base): The Source of Truth**
  To determine if a sentence is true, do we look at **all admissible ways** of making the vague language precise (sharpenings) and require agreement?
  *   **A. Yes, truth is "super-truth" (agreement across all sharpenings):** Go to Node 13.
  *   **B. No, truth is relative to a single sharpening:** (This leads to Subvaluationism or Relativism, rarely held). Return to Node 10 and choose **A**.

  **Node 13 (Supervaluation Split): Constraints on Sharpenings**
  *Constraint Check.* When we create these "precise versions" of the language, must they respect the similarity between cases? (i.e., If grain 500 is borderline, can one sharpening make 500 a heap and 499 definitely *not* a heap?)
  *   **A. No, sharpenings can be independent:** Go to Node 14.
  *   **B. Yes, sharpenings must respect the 'closeness' of cases:** Go to Node 15.

  **Node 14 (Leaf): Standard Supervaluationism**
  *   **Position:** Local Supervaluationism (e.g., Fine, Keefe).
  *   **Sorites Premise Denied:** The Inductive Step (fails to be super-true, even if every instance is).
  *   **Higher-Order Vagueness (HOV):** **Rejected/Problematic.** Creates a new sharp boundary between the definite and the indefinite.
  *   **Note:** Truth comes from what all sharpenings agree on; gaps are genuine truth-value gaps.

  **Node 15 (Leaf): Global Supervaluationism**
  *   **Position:** Global Supervaluationism (e.g., McGee, Smith).
  *   **Sorites Premise Denied:** The Inductive Step.
  *   **Higher-Order Vagueness (HOV):** **Accepted.** Constraints on sharpenings allow for vague boundaries to the boundary.
  *   **Note:** Truth is still based on sharpenings, but the set of sharpenings is constrained to model HOV.

  ***

  ### Analysis of the Tree Structure

  **1. Unoccupied Answer-Combinations**
  There are two logically unoccupied spaces in this tree that students might try to navigate toward:

  *   **Ontic Vagueness + Epistemicism:** You cannot reach Node 3 (Ontic) and then claim there is a "fact of the matter we just can't know" (Node 7).
      *   *Reason:* **Incoherent.** Epistemicism locates the precision in the *reference* of the word fixed by usage. Ontic vagueness locates the imprecision in the *object*. If the object itself lacks a boundary, there is no fact of the matter to be ignorant *of*.
  *   **Contextualism + Fixed Boundary:** You cannot choose Node 5 (Context shifts) and then claim there is a "fixed boundary for that context" (Node 6) that solves the Sorites without shifting.
      *   *Reason:* **Contradictory.** The core commitment of Contextualism is that the boundary moves *during* the Sorites reasoning to block the conclusion. If the boundary were fixed, the Sorites would go through, and you would be forced into Epistemicism or Supervaluationism.

  **2. Indistinguishable Leaves**
  There are two pairs of leaves that are notoriously difficult to separate in practice, which you should flag for your students:

  *   **Epistemicism (Node 7) vs. Contextualism (Node 5):**
      *   *Why:* In a single, static conversational context, a Contextualist acts exactly like an Epistemicist. They both assert bivalence (the sentence is T or F) and both claim we cannot identify the boundary.
      *   *Distinction:* Only appears when you change the context or press on *why* we can't know. Epistemicists say "usage fixes it but it's complex"; Contextualists say "usage is fluid."
  *   **Standard Supervaluationism (Node 14) vs. Global Supervaluationism (Node 15):**
      *   *Why:* On simple first-order cases (Is this a heap?), they yield the same results.
      *   *Distinction:* Only appears when discussing Higher-Order Vagueness. Standard Supervaluationism is often accused of reintroducing sharp boundaries at the level of "definiteness," whereas Global Supervaluationism tries to smooth that out. For most seminar purposes, they function identically.

  **3. Note on the Supervaluation Split (Nodes 12 & 13)**
  Per your request, the Supervaluation branch is split based on the *constraints* on sharpenings.
  *   **Node 12** establishes the core Supervaluationist commitment: Truth is what survives all precisifications (Super-truth).
  *   **Node 13** addresses the "connections between borderline cases." Standard Supervaluationism (Node 14) allows any classically consistent sharpening, which leads to the criticism that it cannot handle HOV (it makes the boundary between 'definite' and 'borderline' sharp). Global Supervaluationism (Node 15) constrains the sharpenings so that they must respect the similarity relations between neighbors, thereby accommodating HOV.

  **4. Non-Sorites Cases**
  *   **Node 2** explicitly uses **The Problem of the Many** (clouds/droplets) to test Ontic Vagueness. This prevents students from thinking vagueness is solely about the Sorites paradox.
  *   **Node 4** uses **'Tall'** to test Contextualism, highlighting that some predicates clearly shift extension based on comparison classes, which is a distinct phenomenon from the grain-by-grain Sorites.
