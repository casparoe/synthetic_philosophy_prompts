answer: |-
  **Final Exam: Formal Epistemology**
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following essay question. Be precise in your formal reasoning. Citations are not required.

  **The Judy Benjamin Problem**

  **Setup:** Judy is dropped into an area divided into two regions, Red ($R$) and Blue ($B$), and two sectors, Second Company ($S$) and Headquarters ($H$). She begins with a uniform prior: $P(R \cap S) = P(R \cap H) = P(B \cap S) = P(B \cap H) = 1/4$. Consequently, $P(R) = 1/2$ and $P(S|R) = 1/2$.
  She receives a radio message stating only: "If you are in Red, the probability you are in Second Company is $3/4$." Formally, she must update to a posterior $P^*$ such that $P^*(S|R) = 3/4$. The message provides no direct information about whether she is in Red or Blue.

  **Question:**
  Standard conditionalization and Jeffrey conditionalization cannot directly process this constraint. Explain why this update poses a fundamental problem for formal epistemology. Discuss how rules based on minimizing information distance (such as Kullback-Leibler divergence) handle this constraint compared to rules that attempt to keep $P(R)$ fixed. Specifically, analyze why distance-minimizing rules often result in a shift in $P^*(R)$ despite the evidence being silent on the $R/B$ partition. Finally, describe what a *principled* solution to this problem would require, distinguishing it from an *ad hoc* adjustment.

  ***

  ### Model Answer

  The Judy Benjamin problem highlights a gap in standard Bayesian update rules. Standard conditionalization requires learning a proposition with certainty ($P(E)=1$), which Judy does not. Jeffrey conditionalization requires a new probability distribution over a specific partition (e.g., $\{R, B\}$), but the evidence provides a constraint on a conditional probability ($P(S|R)$), not a marginal over the partition. Thus, the input is neither a proposition nor a partition shift, leaving the agent under-constrained by standard norms.

  To resolve this, many epistemologists propose minimizing an information distance function between the prior $P$ and posterior $P^*$, subject to the new constraint. The most common metric is Kullback-Leibler (KL) divergence (MinEnt). However, applying MinEnt yields a counter-intuitive result: $P^*(R)$ shifts away from $1/2$ (specifically, it decreases), even though the message contained no information about the Red/Blue distinction.

  This shift occurs because distance-minimization treats the probability space holistically. To satisfy $P^*(S|R) = 3/4$ while minimizing global information gain, the rule adjusts the weights of all atoms ($R \cap S, R \cap H, B \cap S, B \cap H$). Because the constraint tightens the probability mass within $R$ (making $S$ much more likely than $H$), the "cost" of satisfying this constraint is lower if the total mass of $R$ is reduced relative to $B$. MinEnt prioritizes preserving the ratios of probabilities across the unconstrained partition ($\{S, H\}$ within $B$) and the odds between the constrained and unconstrained regions. Consequently, the rule trades off the stability of $P(R)$ to minimize the total divergence.

  Alternative rules, such as those enforcing "rigidity" on $P(R)$, keep $P^*(R) = 1/2$ and only redistribute mass within $R$. These rules disagree with MinEnt because they prioritize different invariants. MinEnt preserves likelihood ratios across the whole space; rigid rules preserve marginal credences in partitions deemed "irrelevant" to the evidence.

  A *principled* solution cannot simply select the rule that matches our intuition that $P(R)$ should not change. An *ad hoc* fix would stipulate $P^*(R) = 1/2$ merely because the message seems silent on $R$. A principled solution must justify *why* certain quantities are invariant based on the nature of the evidence source. It requires a theory of *what* is being learned: is the message a report on objective chances within $R$, or a constraint on the agent's map? If the evidence source is independent of the $R/B$ location, a principled rule must encode that independence structurally, perhaps by restricting the minimization to the sub-algebra of $R$. Without justifying the invariants epistemically, choosing a distance metric is merely mathematical curve-fitting. Thus, the problem is not finding a formula, but defining the epistemic conditions under which specific probabilistic dependencies should remain rigid.

  ***

  ### Marking Scheme (Total: 20 Points)

  **1. Diagnosis of Standard Rules (4 points)**
  *   **4 pts:** Clearly explains why Conditionalization (requires certainty) and Jeffrey Conditionalization (requires partition probabilities) fail to apply to a conditional probability constraint.
  *   **2 pts:** Identifies that standard rules fail but gives a vague or incomplete reason (e.g., "it's not certain").
  *   **0 pts:** Claims standard rules work or fails to address this.

  **2. Distance Minimization and Disagreement (6 points)**
  *   **6 pts:** Explains that MinEnt/KL minimization leads to a shift in $P(R)$. Explains the mechanism: the trade-off between satisfying the internal constraint and minimizing global divergence causes mass redistribution between $R$ and $B$. Contrasts this with rules that fix $P(R)$.
  *   **4 pts:** Notes that $P(R)$ shifts under MinEnt but offers a weak explanation of why (e.g., "the math says so" without discussing the trade-off).
  *   **2 pts:** Mentions distance minimization but fails to note the disagreement regarding $P(R)$.

  **3. The "Silent on Red" Paradox (6 points)**
  *   **6 pts:** Explicitly addresses the intuition clash: the message is about $S|R$, yet $P(R)$ changes. Explains that formal rules treat the partitions as probabilistically connected via the minimization process, whereas intuition treats them as independent.
  *   **4 pts:** Acknowledges the shift is counter-intuitive but does not explain the source of the conflict between intuition and formalism.
  *   **2 pts:** Merely states that $P(R)$ changes without noting why this is problematic.

  **4. Principled vs. Ad Hoc Solutions (4 points)**
  *   **4 pts:** Defines a principled solution as one that justifies *invariants* (what stays fixed) based on the epistemic nature of the evidence/source, rather than just matching intuitions.
  *   **2 pts:** Suggests a principled solution is just "finding the right formula" or "matching intuition."
  *   **0 pts:** No discussion of principled solutions.

  **Specific Penalties (Deducted from Total)**
  *   **-5 points:** **The Vagueness Mistake:** Claims the problem arises because the message is "vague" or "ambiguous." (The problem is structural, not linguistic).
  *   **-5 points:** **The Material Implication Mistake:** Treats the constraint "If R then S" as a material implication ($R \supset S$) to be conditionalized on. (This destroys the probabilistic nature of the constraint).
  *   **-5 points:** **The Recitation Trap:** Merely recites the setup and says "Jeffrey doesn't work" without engaging with the distance minimization or the shift in $P(R)$. (Caps grade at 10/20).

  **Grade Boundaries**
  *   **A (17-20):** Makes all specific moves in sections 2 and 4. Explains *why* MinEnt shifts $P(R)$ (holistic trade-off) and defines "principled" as justifying invariants epistemically. Avoids all penalties.
  *   **B (13-16):** Correctly identifies the failure of standard rules and the shift in $P(R)$, but treats the MinEnt result as a brute fact rather than explaining the mechanism. Definition of "principled" is weaker (focuses on consistency rather than epistemic justification).
  *   **C (9-12):** Identifies the setup and that Jeffrey fails. Misses the significance of the $P(R)$ shift or the distinction between ad hoc/principled.
  *   **D/F (0-8):** Fundamental misunderstandings of conditionalization or incurs major penalties.
