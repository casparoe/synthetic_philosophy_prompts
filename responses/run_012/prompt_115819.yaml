prompt: |-
  I teach a grad seminar on formal epistemology and I'm putting togehter the final. I want one essay question on the Judy Benjamin problem that can't be answered by just reciting the setup and saying that Jeffrey conditionalization doesn't apply. Here's the setup I'll give them: Judy is dropped into an area divided into Red and Blue, and also into Second Company and Headquarters. She starts with equal credence in all four quadrants. She then gets a radio message that tells her only this: if she is in Red, then the probability she is in Second Company is 3/4 (or pick some value different from her prior, doesn't matter). The message says nothing else. The question should make them confront why this is a problem for the standard update rules, what the different distance-minimizing rules say and why they disagree, and whether there's a principled way to decide. It should also press on the fact that some rules make her credence in Red shift even though the message seems to be silent on Red. I want a model answer of about 600 words and a marking scheme out of 20 that seperates an A from a B by naming the specific moves each must make. Don't ask for citations; they'll have the readings. Also, the question should be answerable in 90 minutes. Make sure the marking scheme catches the common mistake of thinking the problem is just that the message is vague, or that it's solved by treating the conditional as a material implication. And maybe include a part that asks what a solution would have to look like to be principled rather than ad hoc.
