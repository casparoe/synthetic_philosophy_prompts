answer: |-
  ### 1. Essay Question

  **Question 4: The Crash Case and Causal Exclusion**

  Consider the following case: A stock-market crash is nothing over and above the individual sell orders that constitute it. Every fact about the crash supervenes on facts about particular trades, and each particular trade is itself fully caused by the trader's neural states alongside prior market conditions. All the same, we ordinarily say that the crash caused the recession that followed.

  Assume the standard causal exclusion argument (premised on supervenience, causal closure, and no overdetermination) succeeds against non-reductive physicalism regarding the mental. Does this argument also exclude the crash as a cause of the recession? 

  In your answer, you must take a definite stance. If you argue that the exclusion argument *does* apply to the crash, explain whether this constitutes a *reductio ad absurdum* of the argument or a bullet the physicalist must bite. If you argue that it *does not* apply, identify the precise disanalogy between the mental case and the crash case that blocks the exclusionary logic. Do not merely rehearse the exclusion argument; apply its machinery to this specific scenario to defend your position.

  *(Suggested time: 90 minutes)*

  ***

  ### 2. Model Answer

  The causal exclusion argument threatens any higher-level property that supervenes on a physical base which is itself causally sufficient. In the crash case, the crash supervenes on the trades, and the trades are physically caused. If the physical causes of the trades are sufficient for the recession (via the trades), the crash appears excluded. I argue that the exclusion logic *does* generalise to the crash, but this is not a *reductio* of physicalism. Rather, it forces us to reject the univocal notion of causation presupposed by the exclusionist. We must bite the bullet regarding productive causation while retaining the crash as a difference-making cause.

  The exclusion machinery runs smoothly here. If we accept causal closure, the physical facts regarding the traders' neural states and the electronic signals of the sell orders are sufficient for the recession. The crash adds no new physical energy or force; it is ontologically dependent on the trades. If we insist that causation is a single relation of productive sufficiency, the crash is epiphenomenal. To deny this would require finding a disanalogy between the mental and the economic. Some might argue economic events are multiply realisable in a way mental events are not, but this fails; both supervene on physical bases without being identical to them. The structural relationship is identical. Therefore, if exclusion kills the mental, it kills the crash.

  However, concluding that crashes do not cause recessions is absurd. This suggests the fault lies not in physicalism, but in the premise that there is only one causal relation competing for space. The exclusion argument assumes that if the physical base is sufficient, the supervenient property has no causal work left to do. This assumes causation is a zero-sum game of production. We should reject this. The neural states produce the trades via physical production. The crash causes the recession via counterfactual dependence. Had the crash not occurred (i.e., had the pattern of trades not obtained), the recession would not have followed. While the individual trades are physically sufficient, they are not individually robust; the crash captures a structural pattern that supports counterfactuals the individual trade descriptions obscure.

  Therefore, the physicalist should bite the bullet that the crash is not a *productive* cause in the fundamental physical sense, but deny that this eliminates its causal status simpliciter. Causation in the special sciences is not about transferring energy but about stabilising counterfactual dependencies. The exclusion argument successfully shows that higher-level events do not compete with lower-level events for productive sufficiency. It fails to show they do not cause anything, because it conflates production with difference-making.

  Consequently, the generalisation to the special sciences is not a *reductio*. It is a clarification. We retain a closed physical world where production is bottom-up, while validating special science explanations where causation is top-down difference-making. The crash causes the recession not by pushing physical particles, but by constituting a pattern upon which the recession counterfactually depends. Accepting this dissolves the competition without violating closure.

  ***

  ### 3. Marking Scheme (Out of 20)

  **1. Application of Exclusion Machinery (5 marks)**
  *   **A (5):** Explicitly maps supervenience, closure, and no-overdetermination onto the crash/trades/recession triad. Shows how the trades screen off the crash.
  *   **B (3-4):** States the premises generally but fails to integrate the specific details of the crash case (e.g., treats it as abstract mental causation).
  *   *Mistake:* Defining the exclusion argument without applying it to the specific ontology of the crash case.

  **2. Evaluation of the Disanalogy (5 marks)**
  *   **A (5):** Argues decisively that there is no relevant structural disanalogy between mental and economic supervenience, or identifies a robust metaphysical distinction (e.g., constitutive vs. contingent).
  *   **B (3-4):** Hedges by suggesting economic events are 'more real' than mental states without metaphysical justification, or claims a disanalogy exists but fails to explain why it blocks exclusion.
  *   *Mistake:* Asserting a disanalogy based on intuition rather than metaphysical structure.

  **3. Handling the Generalisation Objection (5 marks)**
  *   **A (5):** Clearly distinguishes between treating the generalisation as a *reductio* (absurdity) versus a clarification of causal concepts. Takes a firm stance on whether physicalism survives.
  *   **B (3-4):** Acknowledges the worry but remains neutral on whether physicalism must be revised or eliminated, often concluding that 'both sides have points'.
  *   *Mistake:* Refusing to commit to whether the generalisation destroys the argument or merely limits its scope.

  **4. Resolution and Metaphysical Commitment (5 marks)**
  *   **A (5):** Proposes a positive account of causation (e.g., pluralism, difference-making) that resolves the competition without violating closure.
  *   **B (3-4):** Suggests a solution (like compatibilism) but leaves the mechanism of how two causes coexist unexplained or contradictory.
  *   *Mistake:* Proposing overdetermination as a solution without explaining why it is not systematic and miraculous.
