  I am a high school student who has taken AP Statistics and is comfortable with truth tables, conditional probability, expected value, and building a spreadsheet in which each row represents a possible state of the world, each column represents a proposition, and each row carries a probability weight. I have no philosophy background beyond a general interest. I have read that David Lewis proved a family of triviality results for indicative conditionals: if you require that the probability of a conditional of the form if A then C always equals the conditional probability of C given A, then the conditional cannot be an ordinary proposition with truth conditions except in trivial cases. Please restate that result, and the surrounding debate about whether indicative conditionals have truth conditions, using only the vocabulary of my spreadsheet model: rows for possible worlds, columns for A and C, a column for the conditional, probability weights on rows, and the rule that the probability of a proposition is the sum of the weights of the rows in which it is true. Be as faithful as you can. This should be a systematic translation, not a loose analogy. Show exactly where the assumption that the conditional has a truth column creates the problem, and work through a small concrete distribution with rows corresponding to the four possible truth-value combinations of A and C to illustrate it. Then give me a residue report. Which parts of the philosophical debate translate cleanly into the spreadsheet vocabulary? Which parts translate only with distortion, and what exactly is the distortion? Which parts have no counterpart at all, for example distinctions between truth and assertability, between semantics and pragmatics, or between different ways of interpreting the probability of a conditional? For each piece of residue, tell me whether it is a defect of my spreadsheet vocabulary, a sign that the original philosophical claim was less clear than it looked, or both. I want the