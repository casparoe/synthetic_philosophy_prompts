  I've been reading alot about the "dirty hands" thing in politics — the idea that an official sometimes has to do something genuinely wrong (lie to the press, cut a quiet deal with a developer) to get something morally important done, and that we don't just want them to shrug it off afterward; the guilt is kind of the point. So I helped draft a proposal for my city council: an official who breaks a normal ethics rule can avoid formal censure, but only by filing a public statement afterward that names what they did and accepts that they're now guilty of it. It goes to a vote next month. Please describe the most important implications of a rule like this — for the officials themselves, for the public watching, and for whether it actually captures what the dirty hands problem is about. Reason it out from the ideas; no reading lists or citations needed.

  Format it with these sections, in this order: "The idea in a nutshell" (2-3 sentences), "The implications" (the main part, roughly 500-700 words), "Settled vs. contested" (a short paragraph separating what people who actually work on this agree about from what's genuinely up for grabs — don't pass off a contested view as the consensus), and "Bottom line" (one or two sentences). American English, please.
