  The engine of this puzzle is not mere uncertainty, but the specific scaling of payoff against probability. In an ordinary lottery, the house edge ensures negative expected value. Here, the payoff is engineered to outstrip the odds, making the arithmetic unequivocally positive. The feature doing the work is the unbounded relationship between probability and utility. To refuse the bet, you cannot simply call it imprudent; you must reject the principle that rational choice maximizes expected value. You are committed to saying that below a certain threshold, probability counts for nothing, or that utility does not scale linearly with value. This is hard to justify because any threshold seems arbitrary. Why ignore one in a trillion but not one in a billion? To assert this is to claim that rationality has a discontinuity, where a difference in magnitude does not produce a difference in decision.

  This differs crucially from Pascal's Wager. Pascal relies on infinite utility and epistemic uncertainty regarding God's existence. His argument collapses if the payoff is finite or the probability zero. Here, the utility is finite and the probabilities are known facts about a tested machine. We are not weighing faith against reason, but mathematical expectation against practical sanity. When the odds are stipulated as known and the stake finite, skeptical replies vanish. You cannot claim the machine is rigged or the payoff impossible. The epistemic objections drop out quietly. Only the structural objection remains: that expectation maximization fails when variance is extreme. The usual escape routes—questioning the probability or the coherence of infinite value—are closed.

  The iterated case sharpens this into a potential reductio. If a thousand strangers make the offer, expected value theory demands you accept all of them. The cumulative expected gain is enormous. Yet, practically, you will almost certainly lose fifty thousand dollars and gain nothing. This exposes the gap between ensemble averages and single-world trajectories. Expected value reasoning treats the actual outcome as irrelevant to the rationality of the choice, insisting that a decision can be correct even if it leads to near-certain loss. This is a high price. It suggests the puzzle reveals a limit in using expectation alone to guide action under extreme variance. The defender must accept that rationality is about aligning with abstract averages rather than securing actual welfare, a commitment that strains the ordinary meaning of practical reason. Whether this is a reductio or merely a steep price depends on whether one views rationality as procedural or consequential. If rationality is about following the correct algorithm, the loss is irrelevant. If it is about thriving, the algorithm is broken. The puzzle thus forces a choice: either accept that rationality can demand ruin, or admit that expected value is incomplete without a theory of risk.
