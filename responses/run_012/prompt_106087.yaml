  5.  **Select the Operative Principle:**
      *   Which rule fits the record *better*?
      *   Case 2 is the key. It was rejected for "strategic accommodation" (deception) *and* "sampled monitoring." If the principle were purely "Clean Evals Necessary," the monitoring level wouldn't need to be mentioned as a reason for rejection. The fact that the summary explicitly links the deception finding *with* the insufficient monitoring suggests the board weighs the *combination*.
