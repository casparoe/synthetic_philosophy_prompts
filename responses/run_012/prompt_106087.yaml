      *   *Decision:* Case 2 is the closer analog regarding the *model behavior* (deception). Case 1 is the closer analog regarding the *control regime*. Which matters more? The record suggests Evals matter more (see Rule analysis above).

  7.  **Design the Tie-Breaking Case:**
