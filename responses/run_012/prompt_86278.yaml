answer: |-
  # Pre-Drafting Analysis: Mapping the Disagreement

  Before drafting the joint statement, we need to separate verbal disputes from substantive ones, and filter out points that are either trivially true or empirically contingent rather than philosophical.

  ### Candidate Points of Agreement (To be Included)
  1.  **The Math is Valid:** Both sides accept Aumann's formal proof. Given the premises (common prior, common knowledge of posteriors, Bayesian updating), disagreement is impossible.
  2.  **Disagreement Exists:** Both sides acknowledge that persistent disagreement is a ubiquitous feature of the actual world.
  3.  **Common Knowledge is Rare:** Both sides agree that strict "common knowledge" (I know that you know that I know...) is rarely met in natural language interaction.
  4.  **Boundedness Matters:** Both sides agree that human agents are not logically omniscient and that this impacts the application of the theorem.
  5.  **Diachronic Tension:** Both sides agree that there is a tension between current credence and anticipated future credence (the Reflection Principle).

  ### Candidate Cruxes (To be Tested)
  1.  **Normative Status of Priors:** Is the Common Prior Assumption (CPA) a constraint on *rationality* (you are irrational if your prior differs from mine without evidence) or a contingent *parameter* (we just happen to have different starting points)?
  2.  **The Definition of Rationality:** Does "rationality" include the requirement to converge given common knowledge, or does it only include internal coherence (probability axioms) and proper updating?
  3.  **Logical Omniscience:** Does the failure of logical omniscience invalidate the normative force of the theorem, or does it merely excuse the *performance* while leaving the *competence* norm intact?
  4.  **Operationalization:** Is willingness to bet (Dutch Bookability) the correct test for whether a belief state is irrational in this context?

  ### Binned/Rejected Points (Vacuous or Slanted)
  *   *"People are biased."* (Empirical claim, irrelevant to the normative question.)
  *   *"The math assumes too much."* (Both sides agree it assumes a lot; the fight is about what happens when the assumptions fail.)
  *   *"Language is ambiguous."* (True, but doesn't solve whether idealized agents should agree.)
  *   *"Truth is subjective."* (Rejects the probability framework entirely; outside the scope of this collaboration.)

  ### Verbal Disputes Identified
  *   **"Rational":** The Consistency side uses "rational" to mean *ideally coherent including priors*. The Irreducible-Disagreement side uses "rational" to mean *internally coherent and responsive to evidence, priors allowed to vary*. We must define this in the agreements.
  *   **"Prior":** Consistency side often means "ur-prior" (before any evidence). Irreducible side often means "starting prior for this conversation" (which may already include private history). We will standardize on "ur-prior" for the theorem's condition.

  ***

  # JOINT STATEMENT ON THE COMMON PRIOR AND RATIONAL DISAGREEMENT

  **Signed:** The Consistency Working Group & The Irreducible-Disagreement Working Group
  **Date:** End of Term
  **Subject:** Normative Scope of Aumann's Agreement Theorem

  ## I. Agreed Claims

  We, the undersigned, affirm the following claims as the common ground for our continued debate. These claims delineate the formalism, the phenomena to be explained, and the specific limitations regarding bounded and diachronic agents.

  1.  **Formal Validity:** We agree that Aumann's Agreement Theorem is mathematically valid within its specified model. If agents share a ur-prior, update via conditionalization on a common partition, and have common knowledge of their posterior credences, their posteriors must be identical.
  2.  **Conditional Nature:** We agree the theorem is a conditional claim. It establishes that *if* the Common Prior Assumption (CPA) holds, persistent disagreement is impossible. It does not, by itself, prove that the CPA *must* hold.
  3.  **The Explanandum:** We agree that the phenomenon requiring explanation is "Persistent Peer Disagreement": cases where agents regard each other as equally competent, share the same public evidence, yet maintain different credences over time without one conceding to the other.
  4.  **Boundedness and Logical Omniscience:** We agree that the standard theorem assumes logical omniscience (agents know all logical consequences of their beliefs). We agree that actual human agents violate this. We disagree on whether this violation merely excuses performance errors (Consistency) or fundamentally alters the norms of rationality (Irreducible-Disagreement).
  5.  **Diachronic Reflection:** We agree that a tension exists between an agent's current credence and their expectation of their future credence. Specifically, if an agent is certain their future self will hold credence $C$ in proposition $P$, standard Bayesian norms suggest they should currently hold credence $C$ in $P$.
  6.  **Information vs. Processing:** We agree that disagreement can be trivially explained by asymmetric information. The debate is restricted to cases where information asymmetry is minimized or accounted for, focusing instead on processing differences or prior differences.
  7.  **Betting and Credence:** We agree that credences are theoretically linked to betting dispositions. However, we agree that actual betting behavior is confounded by risk aversion, transaction costs, and utility functions, and thus cannot be used as a sole, immediate proof of irrationality in single cases.

  ## II. Table of Genuine Disagreements

  The following table isolates the specific points where our positions diverge. For each row, we have specified the crux and a concrete test case where our predictions about rational permissibility diverge.

  | # | Topic | Consistency Position (CP) | Irreducible-Disagreement Position (ID) | The Crux | Concrete Test Case & Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Normative Status of Priors** | The CPA is a **normative requirement**. Two agents with the same evidence *ought* to have the same ur-prior. Differing priors without evidence of differing reliability is a form of irrationality. | The CPA is a **contingent parameter**. Rationality governs how you update, not where you start. Two agents can process identical evidence differently from different starting points and both remain rational. | **Is rationality "convergent" or "procedural"?** Does rationality demand we all start at the same place, or just that we move correctly from where we are? | **Case:** Two agents are told they are "epistemic twins" (same cognitive architecture, same evidence) but find they disagree on a simple proposition.<br>**CP Prediction:** At least one is making a mistake. They are rationally required to converge immediately.<br>**ID Prediction:** Both can be rational. The disagreement reveals they were not actually twins (different priors), which is permissible. |
  | **2** | **Bounded Rationality** | Logical omniscience is an **idealization**. The norm remains: you ought to believe the consequences of your beliefs. Boundedness explains *why* you fail, not that failure is okay. | Logical omniscience is a **precondition**. If you cannot compute the consequence, you are not rationally required to believe it. Different computational limits justify different belief states. | **Does "Ought" imply "Can"?** If an agent literally cannot compute the agreement-implying consequence, are they violating a norm? | **Case:** A complex logical tautology $T$. Agent A believes $T$ (credence 1). Agent B suspends judgment (credence 0.5) because the proof is too long to verify.<br>**CP Prediction:** Agent B is irrational (incoherent), even if excusably so. The norm is violated.<br>**ID Prediction:** Agent B is rational. Their credence reflects their actual epistemic state. No norm is violated. |
  | **3** | **Diachronic Self-Disagreement** | **Reflection is binding.** If I predict my future self will rationally hold credence $C$, I am irrational if I do not hold $C$ now. Predicting future disagreement implies I think my future self is accessing evidence I lack. | **Reflection is breakable.** I can predict my future self will change their mind rationally due to factors I cannot currently adopt (e.g., cognitive fatigue, different processing modes, or "sleeping on it"). | **Is time just another evidence source?** Is the mere passage of time and re-processing a valid reason to shift credence without new external data? | **Case:** An agent predicts that after resting for 24 hours, their credence in $P$ will drop from 0.8 to 0.6, with no new external evidence.<br>**CP Prediction:** The agent is irrational now. They should update to 0.6 immediately.<br>**ID Prediction:** The agent is rational. They recognize their current state is overconfident and trust the future processing more. |
  | **4** | **The Betting Test** | **Willingness to bet is decisive.** If two agents disagree, there exists a bet both find favorable. Refusing to bet is a signal that one does not truly believe their own credence or knows they are irrational. | **Betting is distinct from belief.** Refusing a bet can be rational due to risk aversion or the strategic value of maintaining disagreement (e.g., preserving diversity of inquiry). | **Is Dutch Bookability the definition of irrationality?** Or is it merely a pragmatic vulnerability that doesn't always track epistemic error? | **Case:** Two peers disagree on $P$ (0.9 vs 0.1). A bookie offers a bet at odds that favor both. Both decline.<br>**CP Prediction:** At least one is epistemically defective (akratic or dishonest about credence).<br>**ID Prediction:** Both are epistemically sound. They decline because the bet doesn't serve their utility or because they doubt the "common knowledge" condition is truly met. |
  | **5** | **Common Knowledge Threshold** | **High bar, but necessary.** If you claim rational disagreement, you must show common knowledge *failed*. If you know the other's credence and still disagree, you are claiming they are irrational. | **Low bar, rarely met.** "Common Knowledge" is so strict it almost never happens. Therefore, the theorem rarely applies to real norms. Disagreement is the default; agreement is the anomaly. | **Is the theorem a practical guide or a limit case?** Does the rarity of common knowledge render the norm inert, or does it impose a duty to seek common knowledge? | **Case:** Two agents exchange credences once. They do not iterate to infinity.<br>**CP Prediction:** They are rationally required to iterate until agreement or until they confirm lack of common knowledge.<br>**ID Prediction:** One exchange is sufficient for rationality. Further iteration is supererogatory (beyond duty). |

  ## III. Closing Clarification on Terminology

  To prevent future verbal disputes, we stipulate the following definitions for the remainder of our collaboration:

  1.  **Rationality:** We distinguish between *Ideal Rationality* (adhering to all logical and probabilistic norms, including CPA) and *Human Rationality* (adhering to norms feasible for bounded agents). The Consistency side argues Human Rationality ought to approximate Ideal Rationality. The Irreducible-Disagreement side argues Human Rationality has its own distinct norms.
  2.  **Prior:** We distinguish between *Ur-Prior* (credence function before any evidence) and *Effective Prior* (credence function at the start of a specific discussion). The theorem applies strictly to Ur-Priors.
  3.  **Agreement:** We define agreement as *identity of credence*, not merely *overlapping confidence intervals* or *consensus on action*.

  We sign this document acknowledging that while we share a formal language, we inhabit different normative worlds. The work ahead is to determine which world governs actual epistemic practice.
