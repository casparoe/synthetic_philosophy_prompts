      *   *Refining the "Aboutness" section:* This is the crux. I need to explain that in engineering, "semantics" are external to the system (user intent). In biology, "semantics" are internalized via selection history. The "defect" isn't the vocabulary, it's expecting a structural property to carry a historical weight.
      *   *Key Insight:* The disagreement is often about *causal specificity* vs. *causal parity*. In engineering terms: Is DNA the *control signal* or just a *power rail*? Both are necessary, but only one is "information" in the Shannon sense of reducing uncertainty about the output.

