      *   **Task:** Restate principal philosophical positions using this specific vocabulary. Evaluate the user's "naive picture" (archive + loader + runtime) against these positions. Identify what translates, what distorts, and what has no counterpart.
      *   **Specific Focus:** The "residue report," specifically addressing "aboutness" (intentionality/semantics). Does the inability to engineer "aboutness" mean the vocabulary is defective, or is the philosophical disagreement less substantive?

  2.  **Deconstruct the Philosophical Landscape (Mental Sandbox):**
