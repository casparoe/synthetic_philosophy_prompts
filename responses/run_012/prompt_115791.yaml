  7.  **Final Polish:** Ensure the distinction between Shannon Information (transmission) and Semantic Information (reference) is clear in the "Residue Report." The user's engineering vocabulary is perfect for Shannon, but "aboutness" requires a different layer (pragmatics/teleology).

