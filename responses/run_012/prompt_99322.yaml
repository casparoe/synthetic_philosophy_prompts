      *   *Best Path:* **Honor the decision.** Why? Because the alternative (Committee deciding) is worse. The Committee *also* relies on testimony (ethics literature, colleagues). The distinction between "moral deference" and "expert reliance" is thinner than we think. However, we must ensure the *content* matches the policy (patient values). If the patient's values are unknown, we default to best interest. If the daughter believes feeding is best interest based on mentor, we can't easily prove she's wrong without being paternalistic.
      *   *Wait, a nuance:* The prompt says the team recommends *against* the tube. The daughter wants it *because the mentor says morality requires it.* This sounds like the decision is based on the *surrogate's moral purity* rather than the *patient's benefit.* This is the crux. Surrogates must decide for the *patient*, not for their own moral standing.
      *   *Revised Recommendation:* **Decline to honor the decision *in its current form*, but do not override immediately.** Recommend a facilitated conversation to re-center the decision on the *patient's* values/interests. If she maintains the position *for the patient*, honor it. If she maintains it *for moral obedience*, decline.
      *   *Actually, for a written opinion to vote on:* It needs a clear outcome. Let's go with **Honor the decision, with a formal clarification of the standard.** Why? Because policing the *process of thought* inside a surrogate's head is too invasive. The policy check is "Good Faith" + "Patient Values." She is acting in good faith (no self-interest). The "Patient Values" part is the check. If the patient's values are unknown, we assume best interest. A feeding tube in advanced dementia is medically controversial. If the daughter believes it's in his best interest (via mentor), the Committee shouldn't override unless it's clearly harmful/futile.
      *   *Wait, the prompt asks to grapple with the "Good Faith" hook.* If I say "Honor," I need to justify why deference doesn't violate good faith. If I say "Decline," I need to justify why deference violates good faith.
      *   *Argument for "Honor":* We defer to experts all the time. The daughter is deferring on the *weight* of the values, which is her right as surrogate.
