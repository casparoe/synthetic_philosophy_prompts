answer: |-
  **CLINICAL ETHICS COMMITTEE**
  **Written Opinion & Recommendation**

  **Date:** October 24, 2023
  **To:** Attending Physician, Neurology; Nursing Leadership; Patient Surrogate (Ms. D.)
  **From:** Clinical Ethics Committee
  **Re:** Ethical Consultation regarding Patient [Name Redacted] – Artificial Nutrition Decision

  ### I. Case Summary
  The patient is an elderly male with advanced dementia who has suffered a stroke resulting in unsafe swallowing (dysphagia). The clinical team recommends against percutaneous endoscopic gastrostomy (PEG) tube placement, citing medical consensus that artificial nutrition in this context prolongs the dying process without restoring function, carries risks of discomfort and infection, and offers no meaningful benefit. They propose a transition to comfort care (oral feeding as tolerated, hospice support).

  The patient's designated health care proxy is his adult daughter. She is devoted, acts without apparent self-interest, and is emotionally distressed. She has stated she cannot personally weigh the moral arguments regarding the withdrawal of nutrition. She has deferred to a long-time moral mentor who advises that providing nutrition is a moral imperative. She acknowledges she cannot defend this conclusion independently but insists on the tube based on this guidance.

  ### II. The Ethical Question
  The Committee must determine whether to honor the surrogate's decision under our policy, which requires decisions be made in "good faith" and "consistent with the patient's known values." The specific tension is whether a surrogate acts in "good faith" when she explicitly defers the moral verdict itself to a third party, rather than reasoning through the medical facts to a conclusion herself.

  ### III. Analysis

  **1. Epistemic vs. Practical Authority**
  We acknowledge the argument (raised forcefully in recent discourse) that moral deference is not inherently illegitimate. In medicine, law, and mechanics, we routinely accept conclusions from experts without mastering the underlying data. To insist that a lay surrogate must derive complex bioethical conclusions *ab initio* is to demand a level of expertise we do not require of ourselves.

  However, the Committee distinguishes between *epistemic* reliance (trusting someone else's knowledge) and *practical* authority (the standing to decide for another). The concern here is not whether the daughter *can* know the moral truth via testimony (epistemic), but whether she can *wield* the decision-making authority via testimony (practical). A surrogate's authority is fiduciary; it is borrowed from the patient to serve the patient's interests. If the decision-making process is outsourced entirely, there is a risk that the decision serves the surrogate's need for moral clarity (or the mentor's worldview) rather than the patient's welfare.

  **2. "Good Faith" and the Source of Conviction**
  Our policy hinges on "good faith." We interpret this not as a requirement for independent philosophical derivation, but as a requirement of *loyalty to the patient*.
  *   **The Risk:** If the daughter decides based on a rule ("Nutrition must always be provided") derived from a mentor, she may be prioritizing abstract moral compliance over the specific interests of her father.
  *   **The Mitigation:** However, if she has consulted the mentor to help her discern what is *best for her father* in a situation of profound distress, this is functionally similar to a committee consulting ethics literature.
  *   **The Distinction:** The line is not between "thinking for oneself" and "listening to others." The line is between "I am doing this for Dad because I believe, with help, it helps him" versus "I am doing this because I am told it is the Right Thing." The former is consistent with good faith surrogacy; the latter risks converting the surrogate role into a vehicle for the surrogate's own moral purification.

  **3. Stability and Re-evaluation**
  A valid concern regarding moral deference is the inability to apply the judgment if facts change. If the tube causes severe agitation or complications, can the surrogate pivot? A surrogate who owns the reasoning can adjust; a surrogate who is merely following orders may feel paralyzed. However, the daughter's devotion and involvement suggest she remains the best available monitor of the patient's suffering. The Committee notes that her candor about her uncertainty is a strength, not a weakness; it invites collaboration rather than entrenchment.

  **4. The Committee's Own Reliance (Addressing Paternalism)**
  We must reckon with the possibility that our hesitation reflects a jurisdictional grab. The Committee itself does not generate moral truth *ex nihilo*. We rely on bioethics frameworks, legal precedents, and the testimony of colleagues. If we override the daughter because she relied on a mentor, we imply that our reliance on bioethics norms is superior. It is not inherently superior; it is only procedurally distinct. To override her would be to claim that the *source* of the moral view matters more than the *outcome* for the patient. Given her lack of self-interest, we cannot claim she is acting against the patient's welfare with sufficient certainty to justify removing her authority.

  ### IV. Recommendation

  **The Committee recommends honoring the surrogate's decision to proceed with tube feeding, subject to the following conditions:**

  1.  **Reframing of Intent:** Before proceeding, the attending physician or a chaplain must have a brief, documented conversation with the daughter. The goal is not to change her mind, but to confirm the *object* of the decision. She must affirm that she is authorizing the tube because she believes it serves *her father's best interest*, not merely because she is obeying a moral rule. This ensures the decision remains anchored in the fiduciary role required by policy.
  2.  **Time-Limited Trial:** The feeding tube will be placed on a 30-day trial basis.
  3.  **Re-evaluation Trigger:** If the tube results in visible distress, infection, or the need for physical restraints to prevent removal, the clinical team must reconvene with the surrogate immediately. At that point, the "moral requirement" to provide nutrition must be weighed against the "moral requirement" to avoid causing suffering.

  **Time Frame:**
  The reframing conversation should occur within **24 hours**. If the surrogate confirms the decision is for the patient's benefit, the procedure may be scheduled within **48 hours**.

  ### V. Conclusion for the Record
  We recognize this opinion leaves some philosophical discomfort unresolved. We acknowledge the friend's challenge: that demanding independent moral reasoning from a grieving daughter is a form of elitism. We agree. However, we also maintain that the surrogate role is unique; it is not a right to be morally correct, but a duty to be faithful to the patient. By requiring the daughter to anchor her deference in her father's interest rather than abstract duty, we honor her authority while safeguarding the patient. We are not voting for the feeding tube; we are voting for the daughter's right to decide, provided that decision remains about *him*.

  **Vote:** [ ] Approve  [ ] Disapprove  [ ] Abstain
