      *   **Policy:** Honor surrogate if "good faith" and "consistent with patient's known values." Committee decides only if no surrogate or not good faith.
      *   **Core Conflict:** Is moral deference (outsourcing the moral verdict) legitimate for a surrogate?
      *   **Specific Requirements:**
          *   Concrete recommendation (Honor, Decline, or Honor with Conditions) + Time frame.
