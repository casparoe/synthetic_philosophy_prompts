prompt: |-
  I sit on the appraisal panel at a government delivery body (won't say which) where we sign off business cases for big public projects — new rail lines, hospital IT systems, that sort of thing. The recurring problem is that the cost and schedule estimates come from the project's own team, built up from their own plans, and they're wrong in the same direction every time: over budget, late. I've read enough Kahneman to know this is the planning fallacy and that the supposed fix is the 'outside view' — ignore the plan, find a reference class of similar projects, and take the distribution of their outcomes. In practice that's where it falls apart for us. What counts as 'similar'? Take the reference class of 'all government IT projects' and we get one number; take 'all health-sector IT projects above a certain size' and we get another; and sometimes the team argues, with what sounds like good reason, that their project really is different — new technology, no precedent, the old ones failed for reasons we've since fixed. And when we do apply the outside view it can feel like it's just saying 'assume you'll fail like everyone else', which is demoralising and maybe not even true for the cases that matter most.

  Write me a decision procedure the panel can actually run on a business case: the questions to ask in order, what counts as a sufficient answer to each, when the outside view should be overridden by inside-view reasoning and what evidence that override requires, and where the procedure has to stop and hand the decision to the panel as a judgement call. Then run it on three cases — (a) a new metro line in a city that already has one, (b) a first-of-its-kind national health data platform, (c) a project whose sponsor has a documented track record of delivering on time — and be honest about the case where the procedure will tell us something we dont want to hear. Finally, say what the procedure can't do and where it's really just dressing up a hunch. No citations, I'll fill those in myself. Keep it to something we can run in a single panel meeting, we haven't got a week per case.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Member of an appraisal panel at a government delivery body.
      *   **Problem:** Project teams consistently underestimate cost and schedule (planning fallacy). The "outside view" (reference class forecasting) is theoretically sound but practically difficult (defining reference classes, overcoming team resistance, demoralization).
      *   **Task:** Create a practical decision procedure for the panel to use *during a single meeting*.
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for sufficient answers.
          *   Rules for when to override the outside view (and evidence required).
          *   Hand-off point for judgment calls.
          *   Apply the procedure to three specific cases: (a) Metro line (repeat), (b) Health data platform (novel), (c) High-performing sponsor.
          *   Honesty about uncomfortable truths.
          *   Limitations section (what the procedure can't do/where it's just dressed-up intuition).
          *   No citations.
          *   Time-constrained (runnable in one meeting).

  2.  **Deconstruct the Core Conflict:**
      *   *Inside View:* The project team's detailed plan. Optimistic, specific, vulnerable to bias.
      *   *Outside View:* Statistical baseline from similar projects. Pessimistic (usually), general, vulnerable to reference class manipulation.
      *   *The Gap:* How to bridge them without ignoring data or crushing morale/innovation.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Goal:* Make it structured but not bureaucratic. Needs to fit a meeting agenda.
      *   *Step 1: Establish the Baseline (Outside View).* Don't let the team define the class. The panel defines it.
      *   *Step 2: Test the "Specialness" Claim (Inside View).* Teams always say "we are different." Prove it.
      *   *Step 3: Risk Adjustment.* If they are different, how much does that change the probability distribution?
      *   *Step 4: The Decision Rule.* When do we accept the plan vs. the baseline?
      *   *Step 5: The Hand-off.* Where does data end and judgment begin?

      *Refining the Steps:*
      *   *Question 1:* What is the *forced* reference class? (Panel chooses, not team).
      *   *Question 2:* What is the baseline cost/schedule uplift needed to reach the P50/P80 of that class?
      *   *Question 3:* What specific, verifiable factors make *this* project exempt from that baseline? (Evidence required, not assertions).
      *   *Question 4:* If those factors fail, what is the contingency?
      *   *Decision Point:* If Q3 evidence is weak, apply Q2 uplift. If strong, allow reduction but cap it.

  4.  **Developing the Three Case Studies:**
      *   *Case A (Metro Line):* Classic repeatable project. Reference class should be strong. Team will claim "new tech" or "local geology."
          *   *Outcome:* Procedure should hit hard. High confidence in outside view. Uncomfortable truth: Add 30-50%.
      *   *Case B (Health Data Platform):* Novelty. Reference class is weak or non-existent.
          *   *Outcome:* Outside view is noisy. Inside view matters more but is riskier. Procedure should flag high uncertainty, not necessarily a specific number.
      *   *Case C (Good Sponsor):* Track record argument.
          *   *Outcome:* This is the trickiest. Is the sponsor actually good, or just lucky/good at scoping? Procedure needs to test *why* they succeeded.

  5.  **Addressing the "Uncomfortable Truth":**
      *   Need to explicitly state where the procedure says "No" or "Add massive contingency" despite the team's protests. Usually Case A.

  6.  **Defining Limitations:**
      *   Garbage in, garbage out (bad data).
      *   Political pressure (panel members aren't robots).
      *   Innovation penalty (punishing true novelty).
      *   It doesn't fix the project, just the estimate.

  7.  **Review and Refine (Self-Correction):**
      *   *Tone:* Professional, direct, pragmatic. No academic fluff.
      *   *Constraint Check:* "Single panel meeting." The procedure can't require weeks of data analysis. It must rely on data *presented* in the business case or known to the panel.
      *   *Constraint Check:* "No citations." Keep Kahneman concepts implicit.
      *   *Constraint Check:* "Override rules." Need clear thresholds.

      *(Self-Correction on Step 1)*: Make sure the panel defines the reference class *before* hearing the team's defense. Otherwise, the team biases the class selection.
      *(Self-Correction on Step 3)*: The "Override" needs to be strict. "We fixed the culture" isn't evidence. "We used the same vendor who failed last time but changed the contract type" is evidence.

  8.  **Final Polish:**
      *   Structure the output clearly: The Protocol, The Application, The Limitations.
      *   Ensure the "Uncomfortable Truth" stands out.
      *   Keep the language actionable ("Ask," "Require," "Reject").

  9.  **Drafting the Content (Mental or Scratchpad):**
      *   *Protocol Name:* The Baseline-and-Deviation Protocol.
      *   *Step 1:* Panel selects Reference Class (RC).
      *   *Step 2:* Establish RC Median and P80.
      *   *Step 3:* Team claims deviation. Panel scores evidence (1-5).
      *   *Step 4:* Calculate adjusted estimate.
      *   *Case A:* RC is strong. Deviation evidence weak. Uplift applied.
      *   *Case B:* RC is weak. Deviation evidence N/A. High risk flag.
      *   *Case C:* RC is "Sponsor History." Need to verify if history is comparable.
      *   *Limitations:* Data quality, Political will, Innovation stifling.

  10. **Final Review against constraints:**
      *   Single meeting? Yes, relies on pre-read data.
      *   No citations? Yes.
      *   Honest about uncomfortable truths? Yes.

      *(Final thought on Case C)*: Be careful not to validate the "Halo Effect." Just because they delivered before doesn't mean they will again, especially if the project type differs. The procedure must test *comparability* of past projects.

      *(Final thought on Case B)*: If there is no reference class, the outside view is useless. The procedure must acknowledge this and switch to "High Uncertainty Protocol" rather than forcing a bad number.

      *(Final thought on Override)*: The override shouldn't be "ignore the outside view." It should be "apply a discount to the outside view uplift based on evidence strength."

      *Let's write it.*
answer: |-
  # The Baseline-and-Deviation Protocol

  This procedure is designed to be run in a single appraisal meeting. It assumes the business case has been circulated in advance. The goal is not to generate a perfect estimate, but to prevent systematic underestimation while allowing for genuine innovation.

  ## Part 1: The Procedure

  **Step 1: The Panel-Defined Reference Class (10 mins)**
  *   **Action:** Before hearing the project team's defense, the panel agrees on the Reference Class (RC). The project team does not get to define this.
  *   **Rule:** The RC must be defined by *outcome characteristics*, not *intent*.
      *   *Bad:* "Digital transformation projects."
      *   *Good:* "IT projects over £50m involving integration with legacy patient records."
  *   **Sufficient Answer:** A written definition agreed by the panel chair that captures at least 5 comparable past projects within the organisation or wider government.
  *   **Failure Mode:** If fewer than 5 comparable projects exist, mark the RC as "Thin." Proceed to Step 4 immediately.

  **Step 2: Establish the Statistical Baseline (10 mins)**
  *   **Action:** Using the RC, determine the historical ratio of *Final Outturn Cost/Time* to *Initial Business Case Cost/Time*.
  *   **Rule:** Calculate the Median (P50) and the Upper Bound (P80).
  *   **Sufficient Answer:** "Historical data shows projects in this class cost 1.4x the initial estimate at P50 and 1.8x at P80."
  *   **Failure Mode:** If data is missing or inconsistent, mark Baseline as "Unreliable." Proceed to Step 4.

  **Step 3: The Deviation Claim (20 mins)**
  *   **Action:** The project team argues why *their* project will beat the Baseline.
  *   **Rule:** The panel scores the evidence for deviation on a scale of 0–3.
      *   **0 (Assertion):** "We have a better team," "We learned from past mistakes," "Technology is newer."
      *   **1 (Process):** "We are using a different contract model (e.g., target cost vs. fixed)," "We have completed the design phase before funding approval."
      *   **2 (Verifiable Precedent):** "This specific vendor delivered this specific module for us last year within 5% variance," "The geological surveys are already complete and match the model."
      *   **3 (Structural Immunity):** "The primary cause of failure in the RC was X. We have physically removed X from the scope."
  *   **Sufficient Answer:** A score agreed by the panel.
  *   **Override Rule:**
      *   Score 0–1: No override allowed. Apply the RC P80 uplift to the budget.
      *   Score 2: Allow a 50% reduction of the uplift (e.g., if RC says +40%, you add +20%).
      *   Score 3: Allow full reliance on the Inside View (the team's plan), subject to Step 5.

  **Step 4: The Novelty Check (10 mins)**
  *   **Action:** If Step 1 was "Thin" or Step 2 was "Unreliable" (i.e., true innovation or lack of data).
  *   **Rule:** Acknowledge that the Outside View cannot anchor the estimate.
  *   **Sufficient Answer:** A formal "High Uncertainty" flag attached to the approval. This triggers mandatory quarterly reviews rather than a one-off sign-off.
  *   **Decision:** Do not adjust the number based on statistics. Adjust the *governance* based on risk.

  **Step 5: The Hand-Off (5 mins)**
  *   **Action:** If the team achieves a Score 3 in Step 3, or if the Panel disagrees on the RC definition by more than one member.
  *   **Rule:** The procedure stops. The decision reverts to pure panel judgment.
  *   **Requirement:** The dissenting view or the justification for overriding the statistical baseline must be minuted explicitly in the decision record.

  ---

  ## Part 2: Application to Three Cases

  ### Case A: New Metro Line (City has existing network)
  *   **Step 1 (RC):** Panel defines RC as "Urban rail extensions in [Country] last 20 years." (Data rich).
  *   **Step 2 (Baseline):** Historical data shows 1.5x cost overrun at P50, 2.0x at P80.
  *   **Step 3 (Deviation):** Team claims: "We have new tunneling tech" (Score 0) and "We fixed the procurement process" (Score 1). They cannot show a completed project using the new tech *in this jurisdiction*.
  *   **Result:** Score 1. No override allowed.
  *   **Decision:** The business case is rejected unless the budget is increased by 100% (to match P80) or the scope is reduced to fit the current budget with that risk profile.
  *   **The Uncomfortable Truth:** The procedure tells you the project is likely not viable at the proposed budget. The team will scream that this kills progress. The panel must accept that signing off the lower budget is lying to themselves.

  ### Case B: First-of-its-Kind National Health Data Platform
  *   **Step 1 (RC):** Panel attempts to define RC. "Government IT" is too broad (includes payroll). "Health IT" is too small (mostly hospital systems, not national data).
  *   **Step 2 (Baseline):** Marked "Thin/Unreliable." There is no valid distribution.
  *   **Step 3 (Deviation):** Irrelevant, as there is no baseline to deviate from.
  *   **Step 4 (Novelty):** High Uncertainty flag applied.
  *   **Decision:** Do not argue about the cost number; it is a guess. Instead, approve funding only for the *discovery phase* (6 months). Full delivery funding is withheld until the discovery phase produces a new, evidence-based business case.
  *   **The Uncomfortable Truth:** You cannot appraise this business case for delivery yet. Signing it off as a "project" is a category error. It is a research programme.

  ### Case C: Sponsor with Documented Track Record
  *   **Step 1 (RC):** Panel defines RC as "Projects delivered by this Sponsor Team."
  *   **Step 2 (Baseline):** Their history shows 0% overrun on the last 3 projects.
  *   **Step 3 (Deviation):** Panel investigates *why*.
      *   *Check:* Were the previous projects the same complexity? No, they were smaller.
      *   *Check:* Did they define scope narrowly to hit targets? Yes.
      *   *Score:* The "Structural Immunity" claim is false. The track record is a result of scope management, not delivery magic. Score 1.
  *   **Result:** The panel rejects the "Sponsor History" RC and reverts to the "Project Type" RC (e.g., all similar IT projects).
  *   **Decision:** Apply the industry-wide uplift, not the sponsor-specific baseline.
  *   **The Uncomfortable Truth:** The sponsor is good at *gaming the appraisal process*, not necessarily good at delivery. Trusting their estimate because of past success is the Halo Effect. The procedure forces you to ignore their reputation.

  ---

  ## Part 3: Limitations and "Dressed-Up Hunches"

  This procedure is a tool, not a truth machine. Be aware of where it fails.

  **1. The Garbage-In Problem**
  The procedure relies on historical data (Step 2). If your organisation's past project data is massaged (e.g., projects were cancelled before costs blew out, or costs were moved to different budget codes), the Baseline is fiction. In this case, the procedure gives you a false sense of precision. You are dressing up bad data with a rigorous process.

  **2. The Innovation Penalty**
  This protocol systematically punishes novelty. If a team is genuinely doing something new (Case B), the Outside View is useless, but the procedure forces you into a "High Uncertainty" box that often starves the project of long-term funding. It favours "me-too" projects where data exists over transformative ones where it doesn't. It protects the taxpayer from waste but may protect the status quo from change.

  **3. The Political Reality**
  Step 5 (The Hand-Off) is where the procedure admits it can't do the job. If a Minister or Senior Official wants a project approved, they can pressure the panel to agree on a "Score 3" in Step 3 despite weak evidence. The procedure requires the dissent to be minuted, but it cannot stop the approval. It only ensures the bias is recorded, not prevented.

  **4. The "Reference Class Tennis"**
  Even with the Panel defining the RC (Step 1), there is subjectivity. Is a "metro line" similar to a "high-speed rail link"? Is a "cloud migration" similar to "ERP implementation"? Two panels could look at the same project and select different Reference Classes, leading to different budget uplifts. The procedure reduces the variance, but it does not eliminate the hunch involved in selecting the comparison group.

  **5. It Doesn't Fix Delivery**
  This procedure adjusts the *price tag*, not the *project*. Adding 50% contingency (Case A) makes the estimate accurate, but it doesn't make the project run smoother. It simply acknowledges the mess. It is a diagnostic tool, not a cure.
