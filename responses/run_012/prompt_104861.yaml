      *   **Problem:** Students usually treat it as a "fun fact" rather than a fundamental constraint ("a wall they've actually hit").
      *   **Method:** A runnable in-class game/simulation (Constitutional Convention for a student club hiring a coordinator).
      *   **Key Mechanics:**
          *   Hidden role cards with rankings + stakes.
          *   Payoff scheme (points $\to$ candy).
          *   Task: Agree on a decision rule (Social Welfare Function) that produces a winner *and* a full ranking.
          *   Desired Progression: Pairwise majority $\to$ Cycle $\to$ New Rule $\to$ Stress Tests (IIA violation, Agenda Manipulation).
          *   Debrief: Map experience to Arrow's conditions (Unrestricted Domain, Pareto, IIA, Non-Dictatorship).
          *   Constraints: No trivia/real-world examples, focus on building/breaking.
          *   Deliverables: Rules, Materials, Payoffs, Timeline, Role Cards, Stress-Test Profiles, Debrief Guide, Troubleshooting (what goes wrong).

  2.  **Deconstruct Arrow's Theorem for the Activity:**
      *   Arrow's Theorem states: No rank-order voting system can satisfy all of the following:
          1.  **Unrestricted Domain (U):** Works for any set of individual preferences.
          2.  **Pareto Efficiency (P):** If everyone prefers A over B, society prefers A over B.
          3.  **Independence of Irrelevant Alternatives (IIA):** The social ranking of A vs. B depends *only* on individual rankings of A vs. B.
          4.  **Non-Dictatorship (ND):** No single voter dictates the outcome.
      *   *Challenge:* It's hard to simulate "Unrestricted Domain" in a single class session (you can't generate *all* profiles). It's also hard to simulate "Non-Dictatorship" without someone explicitly claiming power.
      *   *Strategy:* Focus heavily on IIA (the "spoiler" effect/ranking flip) and the Cycle (Condorcet paradox). Let them try to fix the cycle, then break the fix with IIA.

