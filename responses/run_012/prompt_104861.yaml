answer: |-
  # Activity Design: The Constitutional Convention
  **Goal:** Make students experience Arrow's Impossibility Theorem as a structural constraint rather than a mathematical curiosity.
  **Time:** 80 Minutes
  **Class Size:** 18 Students
  **Materials:** Index cards (pre-printed), whiteboard/markers, timer, bag of small candies (e.g., M&Ms), 3 labeled boxes (Candidate A, B, C).

  ## 1. The Setup & Payoff Scheme (0:00–0:10)

  **Narrative:** "You are the founding members of a new Student Policy Club. You have funding for three paid roles: Coordinator (1st), Vice-Coordinator (2nd), and Secretary (3rd). There are three finalists: **Alex (A), Blair (B), and Casey (C).**"

  **The Economy:**
  *   Distribute one **Role Card** to each student (see Section 3).
  *   **Payoff:** At the end of class, you will run the agreed-upon rule.
      *   If your **1st choice** gets 1st place: **3 candies.**
      *   If your **1st choice** gets 2nd place: **1 candy.**
      *   If your **1st choice** gets 3rd place (or lower): **0 candies.**
      *   *(Simplification: We only track the position of your top choice for payout speed, but the Rule must produce a full 1-2-3 ranking.)*

  **The Constraint:**
  *   "You must draft a **Constitution** (a decision rule). This rule must take everyone's rankings and output a **full social ranking** (1st, 2nd, 3rd) for the club positions."
  *   "The rule must be **Fair**: No single person dictates the outcome (Non-Dictatorship), and it must respect unanimous agreement (Pareto)."
  *   "You can only submit **ordinal rankings** (A > B > C). No score voting, no 'intensity of feeling' numbers." (This enforces Arrow's ordinality constraint).

  ## 2. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Distribute cards. Explain candy economy. Emphasize: *We need a full ranking, not just a winner.* |
  | **10-25** | **Round 1** | **Pairwise Majority.** Ask: "How do we decide?" They will suggest voting A vs B, B vs C, etc. Run it. **Goal:** Induce a Cycle. |
  | **25-40** | **Crisis** | **The Wall.** Reveal the cycle. No winner. No ranking. Ask: "Fix the rule." They must propose a new method (likely Points/Borda or Agenda Setting). |
  | **40-55** | **Round 2** | **Stress Test 1 (Agenda/IIA).** Run their new rule. Then, as Facilitator, announce a "Scenario Change" (Candidate withdraws or order changes). Show the ranking flips. |
  | **55-65** | **Round 3** | **Stress Test 2 (The Fix that Breaks).** If they try to fix Test 1, introduce the other violation. Force them to realize every fix breaks a different fairness condition. |
  | **65-80** | **Debrief** | Map the experience to Arrow's 4 conditions. Acknowledge simulation limits. |

  ## 3. Role Cards (Print 18)

  You need two sets of cards. Use **Set 1** for Round 1. If they switch to a Points System for Round 2, swap to **Set 2** for the Stress Test (tell them "New members joined/old members left, here are the updated preferences").

  **Set 1: The Condorcet Cycle (For Round 1)**
  *   **6 Cards:** `1. Alex  2. Blair  3. Casey` (Reason: Alex funds your committee.)
  *   **6 Cards:** `1. Blair  2. Casey  3. Alex` (Reason: Blair cuts your fees.)
  *   **6 Cards:** `1. Casey  2. Alex  3. Blair` (Reason: Casey hires your friends.)
  *   *Math:* A beats B (12-6), B beats C (12-6), C beats A (12-6). **Result: Cycle.**

  **Set 2: The IIA Violation (For Round 2 Stress Test)**
  *   *Distribute these ONLY if they adopt a Points/Borda system to fix Round 1.*
  *   **6 Cards:** `1. Alex  2. Blair  3. Casey`
  *   **7 Cards:** `1. Blair  2. Casey  3. Alex`
  *   **5 Cards:** `1. Casey  2. Alex  3. Blair`
  *   *Math (Borda 2-1-0):*
      *   Alex: (6×2) + (7×0) + (5×1) = **17**
      *   Blair: (6×1) + (7×2) + (5×0) = **20**  **(Winner)**
      *   Casey: (6×0) + (7×1) + (5×2) = **17**
      *   *Social Ranking:* **Blair > Alex > Casey** (Tie-break Alex/Casey arbitrarily or by name).
  *   *Stress:* "Casey withdraws."
      *   6 Cards: `Alex > Blair`
      *   7 Cards: `Blair > Alex`
      *   5 Cards: `Alex > Blair` (Was Casey>Alex>Blair)
      *   *New Count:* Alex (11) vs Blair (7). **Alex Wins.**
      *   *Violation:* The ranking of Alex vs Blair flipped solely because Casey left.

  ## 4. Facilitator Script & Stress Tests

  ### Phase 1: The Cycle (Minutes 10-25)
  1.  Ask the class to propose a method. They will suggest "Majority Rule."
  2.  Write the matchups on the board.
      *   "Raise hand if you prefer Alex over Blair." (Count: 12).
      *   "Raise hand if you prefer Blair over Casey." (Count: 12).
      *   "Raise hand if you prefer Casey over Alex." (Count: 12).
  3.  **The Wall:** "Okay, so Society prefers A > B, and B > C. By logic, we should prefer A > C. But the vote says C > A. We have no winner. We have no ranking. We cannot hire anyone. The Constitution has failed."
  4.  *Anticipated Student Fix:* "Vote again!" -> **Response:** "Preferences are fixed (Unrestricted Domain). We can't change minds, we need a rule that works on *these* inputs."
  5.  *Anticipated Student Fix:* "Use Points (Borda)." -> **Response:** "Okay, let's try that for Round 2."

  ### Phase 2: The Stress Test (Minutes 40-55)
  *If they chose Points/Borda:*
  1.  Swap the cards to **Set 2**. (Tell them: "Some members graduated, new members joined. Preferences updated.")
  2.  Run the Borda Count. Establish **Blair** is 1st, **Alex** is 2nd.
  3.  **The Stress:** "Breaking News: Casey withdraws from the race. They are no longer eligible."
  4.  Ask: "Do we re-vote? Or does the rule handle this?"
  5.  If they re-vote (recalculate points without C): Show that **Alex** now beats Blair.
  6.  **The Trap:** "Wait. Nobody changed their mind about Alex vs. Blair. The people who liked Alex still like Alex. The people who liked Blair still like Blair. But the *winner* changed because a loser left. Is this fair?"

  *If they stuck with Pairwise/Agenda:*
  1.  Keep Set 1.
  2.  **The Stress:** "We need a ranking, not just a winner. Let's do a tournament."
  3.  **Agenda A:** Vote A vs B (A wins). Then Winner (A) vs C (C wins). **Ranking: C > A > B.**
  4.  **Agenda B:** Vote B vs C (B wins). Then Winner (B) vs A (A wins). **Ranking: A > B > C.**
  5.  **The Trap:** "The outcome depends on the *order* we vote, not just the preferences. Who controls the agenda controls the club."

  ### Phase 3: The Impossible Demand (Minutes 55-65)
  1.  Ask them to draft a rule that avoids *both* the Cycle and the Ranking Flip.
  2.  They will struggle. Someone will suggest "Let the TA decide" (Dictator).
      *   **Shut it down:** "Constitution forbids dictatorship."
  3.  Someone will suggest "Require Unanimity."
      *   **Shut it down:** "Then we never hire anyone. The rule must work for *any* set of preferences (Unrestricted Domain)."
  4.  Let them sit in the frustration for 5 minutes. This is the "Wall."

  ## 5. Debrief Guide (Minutes 65-80)

  Do not start with "Arrow's Theorem says..." Start with "What broke?"

  1.  **Map the Cycle:** "When we hit the cycle, we violated **Transitivity**. We wanted a rule that works for **Any Preferences (Unrestricted Domain)** and respects **Majority (Pareto/Responsiveness)**. Arrow proves you can't have both without a Dictator."
  2.  **Map the Flip:** "When Casey withdrew and Alex beat Blair, we violated **Independence of Irrelevant Alternatives (IIA)**. The social ranking of A vs B depended on C. Arrow proves that if you want a ranking system that satisfies IIA, Pareto, and Unrestricted Domain, it *must* be a Dictatorship."
  3.  **Map the Constraints:**
      *   "Why did I ban score voting?" -> Arrow assumes **Ordinal** utility. (Cardinal systems bypass this but introduce other issues like strategic exaggeration).
      *   "Why did I ban a Dictator?" -> **Non-Dictatorship** condition.
      *   "Why did I swap cards?" -> To show **Unrestricted Domain** (the rule must work even when profiles change).
  4.  **Honest Limitations (Crucial):**
      *   "Today we saw specific examples. Arrow's proof is general: it holds for *any* number of voters (≥2) and alternatives (≥3)."
      *   "We simulated the *failure*, but the theorem proves the *necessity* of the failure. There is no magic rule we missed."
      *   "This is why real-world constitutions often drop IIA (accepting spoiler effects) or restrict the domain (e.g., single-peaked preferences in left-right politics)."

  ## 6. Troubleshooting: What Will Go Wrong

  **1. "Let's just use Score/Approval Voting!"**
  *   **Prediction:** Students will try to escape the ordinal constraint.
  *   **Handle:** "The Club Bylaws (and Arrow's Theorem) assume we cannot compare the *intensity* of your happiness, only your order. If you assign '10 points' to Alex, is that the same as my '10 points'? We can't know. We must stick to rankings."

  **2. "The cycle is just because we chose weird preferences."**
  *   **Prediction:** Dismissal of the cycle as an anomaly.
  *   **Handle:** "In this club, these *are* the preferences. A valid Constitution cannot say 'Sorry, your preferences are illegal.' It must accept **Unrestricted Domain**. If it breaks here, it's not a valid Constitution."

  **3. "Let the Chair break ties." (Dictatorship)**
  *   **Prediction:** A pragmatic solution to the cycle.
  *   **Handle:** "That creates a **Dictator**. If the Chair's top choice always wins when there's a tie, and we structure the ties right, the Chair always wins. That violates **Non-Dictatorship**. We want a democracy."

  **4. "Just vote on the ranking directly."**
  *   **Prediction:** They suggest voting on (A>B>C) vs (B>C>A).
  *   **Handle:** "There are 6 possible rankings. With 18 voters, we will likely get a cycle *among the rankings*. You haven't solved the problem, you've just made the ballots harder."

  **5. Candy Chaos**
  *   **Prediction:** Students focus more on candy than the rule.
  *   **Handle:** "You only get candy if we successfully produce a ranking. If the rule breaks, nobody eats. Your incentive is to solve the math, not just win."

  ## 7. Materials Checklist

  *   **18 Index Cards (Set 1):** 6 of Type A, 6 of Type B, 6 of Type C.
  *   **18 Index Cards (Set 2):** 6 of Type A, 7 of Type B, 5 of Type C. (Keep hidden until Round 2).
  *   **Whiteboard:** Pre-draw a table for Tallying (Candidate | Points | Rank).
  *   **Candy:** ~100 pieces (to ensure everyone gets some even if they lose, maybe give 1 consolation candy if the rule fails, but emphasize the loss).
  *   **Timer:** Visible to students.

  ## 8. Why This Works
  This design forces them to **build** a Social Welfare Function. By requiring a full ranking (not just a winner), you make the IIA violation possible. By swapping the cards, you simulate Unrestricted Domain without needing infinite profiles. By withholding the name "Arrow's Theorem" until the end, you ensure the frustration they feel is attributed to the *problem*, not the *theory*. When you finally name it, the theorem becomes the explanation for the wall they just hit, not an abstract fact to memorize.
