answer: |-
  This is a request for a meta-theoretical specification. You are asking for the boundary conditions of a valid solution space, not a trajectory within it. Given your background, I will frame these desiderata in terms of measure-theoretic probability and decision-theoretic consistency, avoiding hand-waving epistemic appeals.

  Here are the desiderata for an adequate resolution of the Two-Envelope Paradox (TEP).

  ### I. The Desiderata

  #### 1. Ex-Ante Symmetry (The Indifference Condition)
  *   **Specification:** Before opening an envelope, the expected utility of holding Envelope A must equal the expected utility of holding Envelope B. The decision procedure cannot prescribe a switch prior to observation.
  *   **Motivation:** The physical setup is symmetric. The labels "A" and "B" are arbitrary. If the reasoning mandates a switch ex-ante, it implies an asymmetry where none exists, violating the Principle of Indifference applied to the physical selection mechanism.
  *   **Status:** **Non-negotiable.** (Violating this implies the agent can generate value from noise.)

  #### 2. No Endless Switching (Dynamic Consistency)
  *   **Specification:** The reasoning cannot prescribe a sequence of swaps $A \to B \to A \to B \dots$ that yields a strictly increasing expected utility at every step without new information.
  *   **Motivation:** Rational agency requires transitivity and stability. If the logic demands a switch after observing $A$, it must not demand a switch back after observing $B$ given the same underlying state.
  *   **Status:** **Non-negotiable.** (Violating this creates a "money pump," rendering the decision theory incoherent.)

  #### 3. Distinction of Cases (The Distributional Constraint)
  *   **Specification:** The resolution must distinguish between:
      *   **Case Fixed:** Amounts $(x, 2x)$ are fixed constants unknown to the agent.
      *   **Case Random:** Amounts are drawn from a known prior distribution $P(X)$.
      *   It must show indifference in Case Fixed, and allow for favorable switching in Case Random *only* for specific observed values $a$, not universally.
  *   **Motivation:** In Case Fixed, $E[B] = E[A]$. In Case Random, $E[B|A=a]$ depends on the posterior $P(X|A=a)$. Collapsing these cases is a category error.
  *   **Status:** **Non-negotiable.** (Failure here indicates a confusion between epistemic uncertainty and ontological randomness.)

  #### 4. Proper Priors (Normalizability)
  *   **Specification:** Any probability distribution invoked over the possible amounts of money must be normalizable (sum/integrate to 1). The resolution must explicitly identify if the paradox relies on an improper prior (e.g., uniform over $\mathbb{R}^+$).
  *   **Motivation:** In physical sciences, non-normalizable distributions represent unphysical states or limits, not valid probability spaces. Expectation values are undefined on improper priors unless handled via limiting procedures.
  *   **Status:** **Non-negotiable** (for a rigorous mathematical resolution).

  #### 5. Preservation of the "Force" (Explanatory Depth)
  *   **Specification:** The resolution should explain *why* the calculation $E[B|A=a] = 1.25a$ appears compelling, rather than simply declaring it false. It should locate the specific step where the intuition diverges from the formalism.
  *   **Motivation:** A resolution that merely says "the math is wrong" without diagnosing the cognitive or formal source of the error is unsatisfying. It fails to educate the intuition.
  *   **Status:** **Optional.** (A resolution can be formally correct without being psychologically illuminating.)

  #### 6. Conditional vs. Unconditional Expectation
  *   **Specification:** The resolution must rigorously distinguish $E[B]$ (unconditional) from $E[B|A=a]$ (conditional). It must show that the paradox arises from treating the conditional probability $P(B=2a | A=a)$ as independent of $a$.
  *   **Motivation:** The switching argument implicitly assumes $P(B=2a | A=a) = 1/2$ for all $a$. This is only true for specific priors. Confusing the variable $a$ with a constant is a scope error.
  *   **Status:** **Non-negotiable.**

  ---

  ### II. Incompatible Pairs (The Trade-Offs)

  You asked specifically for pairs of desiderata that cannot be jointly satisfied. These are the tension points where a resolution must choose a side.

  #### Pair A: Universal Switching vs. Finite Expectation
  *   **Requirement 1:** The switching argument ($E[B|A=a] > a$) holds for **every** possible observed value $a$.
  *   **Requirement 2:** The total expected value of the money in the envelopes is **finite** ($E[A] < \infty$).
  *   **Incompatibility:** It is mathematically impossible to construct a proper probability distribution where the conditional expectation of the other envelope exceeds the current one for *all* observed values $a$, while maintaining a finite global expectation. (This is a consequence of the Law of Total Expectation).
  *   **Resolution Choice:** You must sacrifice either the universal validity of the switching argument (admit it fails for some $a$) or the finiteness of the expectation (allow infinite means).
  *   **Status:** Most rigorous resolutions sacrifice Requirement 1.

  #### Pair B: Explanatory Depth vs. Formal Minimalism
  *   **Requirement 1:** Preserve the "Force" (Desideratum 5). Explain why the $1.25a$ intuition feels robust.
  *   **Requirement 2:** Formal Minimalism. Treat the problem as a simple error in variable binding without invoking cognitive psychology or complex priors.
  *   **Incompatibility:** To explain the *force*, you often need to model the agent's implicit assumptions (e.g., that they assume a flat prior). To maintain formal minimalism, you simply point out the undefined variable. Deep explanation often requires adding structure (psychological or probabilistic) that the minimalist approach rejects as extraneous.
  *   **Resolution Choice:** Philosophical resolutions tend to keep Req 1; Pure mathematical resolutions tend to keep Req 2.

  #### Pair C: State-Independence vs. Proper Priors
  *   **Requirement 1:** The probability that the other envelope is double/half is $1/2$, independent of the amount found (State-Independence).
  *   **Requirement 2:** The prior distribution over envelope amounts is Proper (Desideratum 4).
  *   **Incompatibility:** State-independence for all $a$ implies a uniform prior over an infinite range, which is improper. A proper prior necessitates that the probability of the other envelope being larger decreases as the observed amount $a$ increases.
  *   **Resolution Choice:** You cannot have a well-defined probability space *and* the state-independence assumption. One must go.

  ---

  ### III. The Single Exclusionary Requirement

  If you enforce only one requirement to filter the literature, it should be this one:

  **The Requirement of a Well-Defined Joint Probability Distribution.**

  *   **Statement:** *The resolution must explicitly define the joint random variables $(X, Y)$ representing the amounts in the two envelopes and demonstrate that the switching argument fails when expectations are calculated with respect to this specific measure.*

  *   **Why this rules out the most resolutions:**
      1.  **Eliminates "Logic-Only" Approaches:** It kills resolutions that treat the envelopes as logical propositions without a sample space.
      2.  **Eliminates "Improper Prior" Loopholes:** It forces the resolver to confront that the $1.25a$ calculation requires an impossible distribution.
      3.  **Eliminates "Utility" Dodges:** It prevents resolutions that bypass the probability error by simply asserting bounded utility (though bounded utility solves the St. Petersburg paradox, it is a sledgehammer for TEP; the probability error exists prior to utility considerations).
      4.  **Forces the Conditional Distinction:** You cannot write down a joint distribution without distinguishing $P(Y|X)$ from $P(Y)$.

  *   **Physicist's Note:** This is analogous to demanding a Hamiltonian before asking about time evolution. Many TEP resolutions attempt to discuss the dynamics of switching without defining the state space. Enforcing this requirement collapses the paradox immediately: once the joint distribution is specified, the conditional expectation $E[Y|X=x]$ is a calculable function that equals $x$ in expectation over the prior, and the paradox vanishes.

  ### Summary Specification
  An adequate resolution must:
  1.  **Define** the joint distribution of envelope contents (Non-negotiable).
  2.  **Demonstrate** that $E[\text{Switch}] = 0$ ex-ante (Non-negotiable).
  3.  **Show** that $E[\text{Switch}|A=a] > a$ cannot hold for all $a$ under a proper prior (Non-negotiable).
  4.  **Explain** that the $1.25a$ argument implicitly assumes an impossible, state-independent conditional probability (Optional but recommended).

  If a proposed resolution cannot write down the probability mass function $P(A=x, B=y)$, it is not a resolution; it is a commentary.
