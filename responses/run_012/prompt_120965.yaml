answer: |-
  You should reject step (4), specifically its claim that the desire to deceive in the coat case is "the very thing (2) names as the fault."

  Step (4) commits an equivocation on what Augustine means by "the fault." In step (2), Augustine defines the fault of the *liar* as "the desire of deceiving *in the uttering of his mind*." The moral weight is not carried by the *desire to deceive* in isolation, but by that desire coupled with the *corruption of signification*. For Augustine, speech is a divine gift designed to convey the contents of the mind to another mind; to use that gift to convey what is *not* in the mind is a violation of the natural and divine order of communication. Step (4) tries to sever the intent from the medium, arguing that because the intent (deception) is present in the coat case, the fault must be identical. Augustine would deny this: the coat case involves concealment (*dissimulatio*), not false signification (*mendacium*). You are withholding truth, which is sometimes permissible, rather than actively proffering falsehood, which is never permissible.

  Rejecting (4) saves the no-exceptions rule (2) by clarifying that the absolute prohibition applies to the *act of lying*, not to every instance of intending deception. The cost you pay for this move is accepting that Augustine's ethics are fundamentally *semiotic* rather than purely consequentialist or even purely intentionalist regarding belief. You are buying into a view where the integrity of language itself is a sacred good, distinct from the welfare of the listener or the truth-value of their beliefs. This means you must defend the counter-intuitive position that misleading a murderer with a technically true statement (or a hidden coat) is morally categorically different from lying to him, even if the murderer's resulting false belief and the consequences are identical. You have to argue that God cares more about how we use the faculty of speech than about whether a villain is successfully tricked.

  Regarding the coat case, rejecting (4) renders it permissible (or at least, not a sin of lying). Since moving the coat constitutes no signification—it is an action, not a communicative sign intended to be read as a statement of fact—you have not violated the order of speech. You have merely withheld information from someone who has no right to it. As for the "true-but-misleading" sentence ("I haven't seen him all day"), Augustine classifies this as ambiguous speech. While he warns against using ambiguity to trap others, he maintains that if the words correspond to reality, it is not a lie. By rejecting (4), you maintain that while such speech might be uncharitable depending on the context, it does not incur the specific guilt of *mendacium*, preserving the distinction between concealing the truth and betraying it.
