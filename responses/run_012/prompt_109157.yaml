prompt: |-
  My roommate and I got into this thing last night and neither of us could settle it. Maybe you can.

  She's a data scientist, I'm... not. We were talking about her cousin, who's applying for a mortgage. The bank's model gave him a 7% chance of defaulting in the next two years. He was upset and said, "That's not a fact about me, I'm not 7% of a person." She said, sure, it's a statement about a reference class, but that's what all probabilities are. He said, then which class? He's a 34-year-old renter with a stable job, a recent credit inquiry, a master's degree, a dog, a history of paying rent late twice, a zip code that's gentrifying, parents who declared bankruptcy, etc. He belongs to a million classes. In some of them the default rate is 2%, in others 20%. So the number is arbitrary.

  She said it's not arbitrary — you use the narrowest class with enough data, and you include variables that are causally relevant to default. He said "causally relevant" is doing all the work. Almost everything is causally relevant to something, and with enough slicing you can find a class of one where the frequency is either 0% or 100%. She said that's why you don't slice to a class of one; you stop when adding more variables stops changing the estimate much. He said that's just a modeling convenience, not a fact about him. She said fine, probability is a modeling convenience, but so is every prediction, and the model can still be well or badly calibrated. He said, exactly — calibrated for the class, not for him. Two banks with different but equally defensible feature sets can give him 3% and 15%, and neither is wrong. She said that doesn't make the number meaningless, it makes it relative. He said relative to what? If it's relative to the bank's interests, then it's not a probability about him at all, it's a price. She said a price is a kind of probability when you're the one setting it. He said now she's just redefining words.

  Then they both looked at me and I honestly couldn't tell who was making sense. Can you go through their exchange move by move and say who's right about what? Rate each move from clearly mistaken to clearly right and briefly justify each rating. I don't need a winner overall, I need to know which specific claims hold up and which are confused. Also, is there a version of the reference class problem that actually threatens the bank's probabilty, or is it just a philosopher's worry that doesn't matter for practice?
