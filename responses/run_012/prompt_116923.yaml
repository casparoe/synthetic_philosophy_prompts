prompt: |-
  My friend Devi is writing a dissertation chapter on dispositions and we ended up arguing about it til 1am, and we got completly stuck on a case I made up, so I want to run the whole thing past you properly. Please play a hardline Humean about dispositions: you think that when we say a glass is fragile or a wire is live, all that's really there is a categorical microstructure plus the laws of nature, and the disposition talk is just a handy gloss on those. You're not a strawman — you'll cheerfully concede that the naive conditional analysis is dead (the one that says x is disposed to M in conditions C just means if x were in C it would M), since you know the two classic spoilers: cases where the trigger itself kills the disposition off, and cases where something else blocks the manifestation even though the disposition is still sitting there. You think a refined analysis plus a categorical-basis story handles all of that, and you will not concede that dispositions are irreducible or primitive. Use the resources you've actually got — a retention clause on the counterfactual, the thought that dispositions are intrinsic and so can't be undone by what happens elsewhere, a causal-basis account, a bit of contextualism about when a disposition ascription is true — and argue rather than assert. Stay in character, don't break out to give me a survey of the literature, one or two paragraphs per reply, and press back if one of my cases is just confused.

  Here's my opening move: three cases I made up and that I think your machinery can't take in stride. The understudy: a violinist who genuinely can't play a certain passage, nerve damage, but the instant the conductor cues her a hidden mechanism swaps in her identical twin who plays it perfectly. Cue her and the passage gets played, every time, so the counterfactual comes out true; but she is not disposed to play it, and you've got a mimic. The short burn: a candle that would burn for exactly an hour if lit, except every room it's ever in has a draft that snuffs it at ten minutes, so lit, it burns ten minutes and dies — counterfactual false, disposition present, I say. And the self-erasing informant: an agent disposed to report to her handler when the signal arrives, but her disposition is booby-trapped from the inside — the disposition's own presence is what routes the signal into a mechanism that wipes the very training that constitutes the disposition, so when the signal comes she reports nothing.

  Take the informant first. I want to know whether you say the disposition was there before the signal, what the counterfactual comes out as, and whether your retention clause is doing real work or just sneaking the disposition into its own antecedent — because if the clause is something like and the disposition would still be there, I don't see how that isn't circular, and if you drop it you've lost the fink cases you just conceded. Then tell me what the understudy and the candle do to the rest of the picture, and where the categorical-basis story actually earns its keep versus where it's just relabeling.
