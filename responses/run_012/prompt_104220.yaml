answer: |-
  # Specification of Adequacy for Theories of Implicature and Speaker Meaning

  **Purpose:** To serve as a court of appeal for adjudicating disputes regarding the said/implicated boundary and the behavior of implicature under embedding.
  **Status:** These are necessary conditions for a theory to be considered adequate for the purposes of this seminar.

  ---

  ## 1. The Phenomena the Theory Must Explain

  **Requirement 1.1: Comprehensive Coverage**
  The theory must provide a unified or systematically related account of particularized, generalized, scalar, and relevance-driven implicatures, as well as irony and figurative indirectness. It cannot treat scalar implicature as a semantic phenomenon while treating irony as a pragmatic one without explaining the interface mechanism that distinguishes them.
  *   **Motivation:** A theory that handles "some" implies "not all" but fails to explain why "You're a fine friend" implies *You are a bad friend* is fragmented. We need a single framework to compare disputes.
  *   **Verdict:** **Non-negotiable.** A theory of the interface cannot restrict its domain to only the phenomena that fit its machinery.
  *   **Confidence:** High. (This is a baseline condition of adequacy.)

  **Requirement 1.2: Demarcation from Neighbors**
  The theory must provide explicit criteria for distinguishing implicature from entailment, presupposition, and mere hinting (suggestion without commitment). Specifically, it must explain why presuppositions project while standard conversational implicatures typically do not.
  *   **Motivation:** Without this, the "court of appeal" has no jurisdiction. If a theory conflates presupposition and implicature (e.g., some semanticized pragmatic accounts), it cannot adjudicate the boundary disputes we are studying.
  *   **Verdict:** **Non-negotiable.** The *need* for a boundary is absolute; the *location* of the boundary is where theories will fight.
  *   **Confidence:** High.

  **Requirement 1.3: Accommodation of "Stance" Effects**
  The theory must account for utterances where the informational content is null or known, but the social/expressive stance is the primary communicative payload (e.g., telling someone what they already know).
  *   **Motivation:** See Case 2 below. If a theory only tracks information transfer, it fails to explain a vast swath of human communication.
  *   **Verdict:** **Camp Preference (with caveats).** Traditional Griceanism focuses on belief-transfer. Relevance Theory handles this better via cognitive effects. A theory *must* handle it, but *how* it categorizes it (as implicature vs. expressive act) is open.
  *   **Confidence:** Medium. (Some strict semanticists might reject this as "pragmatics" proper.)

  ---

  ## 2. The Mechanism Constraints

  **Requirement 2.1: Cancellability (Defeasibility)**
  The theory must treat conversational implicatures as defeasible without contradiction. If adding "but not p" creates a contradiction, p is not a conversational implicature (on the standard definition).
  *   **Motivation:** This is the primary diagnostic for separating what is said from what is implicated.
  *   **Verdict:** **Non-negotiable** (for the label "conversational implicature"). If a theory abandons this, it is redefining the term, not analyzing the phenomenon.
  *   **Confidence:** High.

  **Requirement 2.2: Recoverability via Reasoning**
  The theory must specify a calculable path from the utterance, context, and cooperative assumptions (or functional equivalents) to the implicated content. It cannot be a "black box" association.
  *   **Motivation:** To distinguish implicature from causal persuasion or mere association.
  *   **Verdict:** **Non-negotiable.** Without recoverability, we cannot distinguish communication from noise.
  *   **Confidence:** High.

  **Requirement 2.3: Detachability**
  The theory must account for whether the implicature is tied to the semantic content or the specific linguistic form used. (i.e., Can I paraphrase the utterance without losing the implicature?)
  *   **Motivation:** Grice used this to distinguish conventional from conversational implicature.
  *   **Verdict:** **Camp Preference.** Many modern theorists (e.g., Bach, Recanati) argue detachability is not a reliable test for conversational implicature, as some particularized implicatures are tied to specific phrasing due to processing ease.
  *   **Confidence:** Low. (**This is the requirement I am least sure belongs on the list.** It is often treated as a definition, but empirically it is fragile.)

  ---

  ## 3. The Distinctions the Theory Must Not Collapse

  **Requirement 3.1: Speaker Meaning vs. Sentence Meaning**
  The theory must maintain an ontological distinction between the proposition expressed by the sentence (relative to context) and the total body of meanings the speaker intends to convey.
  *   **Motivation:** Without this, we cannot have "implicit" content. Collapsing them leads to radical contextualism where "what is said" swallows everything.
  *   **Verdict:** **Non-negotiable.** This is the definition of the interface problem.
  *   **Confidence:** High.

  **Requirement 3.2: Intention vs. Uptake**
  The theory must distinguish between the implicature the speaker *intended* and the one the hearer *recovered*. It must provide conditions for successful communication when these diverge.
  *   **Motivation:** Miscommunication happens. A theory that defines meaning solely by uptake loses the normative dimension of communication.
  *   **Verdict:** **Non-negotiable.**
  *   **Confidence:** High.

  **Requirement 3.3: Meaning vs. Causing Belief**
  The theory must distinguish between meaning something (communicating) and merely causing a hearer to believe something (via evidence, threat, or non-communicative cues).
  *   **Motivation:** If I leave my umbrella behind, you believe it's raining, but I didn't *mean* that it's raining.
  *   **Verdict:** **Non-negotiable** (for intention-based accounts).
  *   **Confidence:** High.

  ---

  ## 4. The Accounts of Speaker Meaning It Must Be Consistent With

  **Requirement 4.1: Reflexive Intentions**
  The theory must be consistent with an analysis where speaker meaning involves intending the hearer to recognize the intention to produce an effect.
  *   **Motivation:** This is the standard Gricean baseline for "speaker meaning."
  *   **Verdict:** **Camp Preference.** Code-based or teleological accounts reject this. However, for a seminar on *implicature* (historically Gricean), this is a working constraint.
  *   **Confidence:** Medium. (Depends on whether you accept the Gricean circle.)

  **Requirement 4.2: Handling Null Propositions**
  The theory must explain how speaker meaning functions when there is no expressed proposition to serve as the basis for the inference (e.g., silence, one-word answers).
  *   **Motivation:** See Case 5. If speaker meaning requires a proposition to operate on, silence is inexplicable.
  *   **Verdict:** **Non-negotiable.** The theory must cover the data, even if it requires expanding the notion of "what is said."
  *   **Confidence:** High.

  ---

  ## The Five Test Cases: What an Adequate Theory Owes

  **Case 1: The Quoter (Reading a statute/bulletin)**
  *   **The Challenge:** The speaker is an animator, not an author. The maxims might be flouted by the *author* of the text, not the speaker.
  *   **What the Theory Owes:** It must distinguish between the speaker's endorsement of the content and the speaker's endorsement of the *act of presenting* the content. It must locate the implicature either in the speaker's intention to draw attention to the text (particularized) or declare that the machinery applies to the *speech act* of quoting, not just the proposition. If it cannot handle "ventriloquized" maxims, it fails to account for reported speech and citation.

  **Case 2: The Redundant Informant (Telling what is known)**
  *   **The Challenge:** The content is old information. The effect is social (stance). It is not detachable.
  *   **What the Theory Owes:** It must decide if this counts as *implicature* or a distinct category (e.g., *expressive* meaning). If it calls it implicature, it must explain how the Cooperative Principle generates an inference when the Maxim of Quantity (do not make your contribution more informative than required) appears violated without generating a standard "I mean something else" inference. It owes an account of *social* cognitive effects, not just *factual* ones.

  **Case 3: Divergent Hearers (Same said, different implicated)**
  *   **The Challenge:** Competent hearers disagree on the implication.
  *   **What the Theory Owes:** It must take a stand on **Determinacy**. Does the theory treat implicature as objective (fixed by speaker intention), intersubjective (fixed by common ground), or hearer-relative? An adequate theory cannot say "both are right" without explaining what constitutes a *mis*-implicature. It owes a threshold condition for "successful recovery" that explains why one hearer might be wrong.

  **Case 4: Embedded Implicature (Surviving negation/conditionals)**
  *   **The Challenge:** "If John ate some of the cookies, he ate all of them" (implicature 'some not all' seems to interact with the conditional).
  *   **What the Theory Owes:** It must explain how a defeasible inference (Requirement 2.1) can become part of the truth-conditional content of a complex sentence without becoming semantic entailment. It owes a mechanism for **Local Implicature** (computing the implicature inside the scope of the operator). Crucially, it must show that the implicature remains *defeasible at the global level* even if it is *fixed at the local level*. If it cannot do this without semanticizing the implicature, it fails the said/implicated boundary test.

  **Case 5: The Silent Speaker (Declining to answer)**
  *   **The Challenge:** No expressed proposition.
  *   **What the Theory Owes:** It must extend the intention-based account (Requirement 4.1) to cases where the "recognition of intention" is triggered by the *absence* of an utterance. It owes an explanation of how the Maxim of Quantity (make your contribution as informative as required) triggers an inference from silence without a semantic base. If it requires a proposition to start the calculation, it cannot handle this case.

  ---

  ## Tensions and Exclusionary Requirements

  **Incompatible Pair:**
  **Requirement 2.1 (Cancellability)** and **Case 4 (Embedded Implicature)**.
  *   **Reasoning:** If an implicature survives embedding (e.g., in the antecedent of a conditional), it behaves like part of the truth conditions. If it is part of the truth conditions, it is typically not cancellable without contradiction. A theory that insists on strict cancellability struggles to explain embedding. A theory that explains embedding easily often semanticizes the content, violating the said/implicated boundary.

  **The Single Most Exclusionary Requirement:**
  **Requirement 2.1 (Cancellability without contradiction).**
  *   **Reasoning:** This is the hardest bar to clear. Radical Contextualists (e.g., Recanati) often argue that what looks like embedded implicature is actually part of "what is said" (truth-conditional), thereby preserving cancellability at the cost of the said/implicated distinction. Semanticists (e.g., Chierchia) preserve the distinction by semanticizing the implicature, thereby sacrificing cancellability. A theory that keeps *both* distinctness and cancellability while accounting for embedding is the rarest and most constrained.

  **The Least Sure Requirement:**
  **Requirement 2.3 (Detachability).**
  *   **Reasoning:** I am least confident that this belongs on a list of *adequacy* conditions. It is historically significant, but many robust theories of pragmatics treat it as a heuristic rather than a defining feature. Insisting on it may exclude viable theories that explain the data well but view form-specific inferences as a matter of processing cost rather than semantic convention.

  ---

  ## Theory Scorecard

  **1. Maxim-Based Gricean Account**
  *   **Performance:** Strong on Requirements 1.1, 2.1, 3.1, 4.1.
  *   **Failure Points:** Struggles significantly with **Case 4 (Embedding)**. Standard Gricean calculation is post-propositional; it cannot easily compute implicatures inside the scope of logical operators without ad hoc adjustments. Also struggles with **Case 5 (Silence)** as there is no "said" to flout a maxim relative to.
  *   **Verdict:** Fails the "court of appeal" test for embedded data.

  **2. Relevance-Theoretic Account**
  *   **Performance:** Strong on **Case 2 (Stance)** and **Case 4 (Embedding)**. By treating pragmatics as continuous with semantics (via mutual adjustment), it handles local implicatures well. Handles **Case 5** via the presumption of optimal relevance.
  *   **Failure Points:** Weaker on **Requirement 2.1 (Cancellability)**. Because relevance is a gradient and implicatures can become "strongly communicated," the line between said and implicated blurs, making the "court of appeal" less sharp for boundary disputes.
  *   **Verdict:** Best for embedding, worst for sharp boundaries.

  **3. Truth-Conditional Minimalist (e.g., Bach, Cappelen & Lepore)**
  *   **Performance:** Strong on **Requirement 3.1 (Distinctions)**. Maintains a thin "what is said."
  *   **Failure Points:** Struggles with **Case 4 (Embedding)** (often denies it happens or calls it semantic) and **Case 5 (Silence)** (hard to square with minimal propositions). Often treats generalized implicatures as default inferences that look too much like semantics, risking **Requirement 1.2**.
  *   **Verdict:** Best for maintaining distinctions, worst for explaining the richness of the data.
