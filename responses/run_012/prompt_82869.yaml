answer: |-
  ### The "What's Your Moral Worth?" Quiz

  **Instructions:** Read each scenario and pick the answer that feels most true to you. Don't overthink it—go with your gut. At the end, tally up your As, Bs, and Cs to find your profile.

  **1. The Competitive Shopkeeper**
  A shopkeeper charges fair prices, but only because a rival store is watching. If the rival didn't exist, he'd overcharge. He does the right thing, but only to protect his reputation.
  *   **A.** He gets no moral credit. He didn't care about fairness, only his image.
  *   **B.** He gets some credit. He still tracked the right behavior, even if the motive was selfish.
  *   **C.** Credit isn't the point. The customers got a fair deal, which is what actually matters.

  **2. The Guilt-Ridden Helper**
  Elena was raised in a cult that says helping outsiders is a sin. She helps a stranger anyway, but she feels terrible and believes she is doing something wrong.
  *   **A.** She deserves high praise. Overcoming her upbringing to do the right thing shows real strength.
  *   **B.** She deserves no moral praise. You can't get credit for doing what you think is a sin.
  *   **C.** It's a tragic case. We can praise the act, but her moral understanding is too broken for "worth."

  **3. The Drilled Nurse**
  A nurse saves a patient by following procedures drilled into her for twenty years. When asked why she did it, she says, "I don't know, I just did what I always do."
  *   **A.** It has full moral worth. Good habits are just duty that has become second nature.
  *   **B.** It has less worth than a conscious choice. She wasn't actively reasoning about the right thing.
  *   **C.** It doesn't matter. The patient is alive, and her reliability is what makes her a good nurse.

  **4. The Engineered Volunteer**
  Leo had a brain procedure that surgically induced compassion. Now he volunteers every weekend and loves it. Before the surgery, he was selfish.
  *   **A.** It's not really *his* goodness. It was installed, not chosen, so he gets no credit.
  *   **B.** He gets credit. He's doing the work now; the origin of the impulse doesn't erase the good.
  *   **C.** The question is weird. He's a better person now than he was before. What else is there to ask?

  **5. The One-Hit Wonder**
  Marcus donates his life savings to charity exactly once, for the right reasons, but never does anything generous again.
  *   **A.** That single act has full moral worth. Worth attaches to actions, not whole lives.
  *   **B.** It's suspicious. Real moral worth requires a stable character, not a fluke.
  *   **C.** It's good, but calling it "moral worth" implies a depth he doesn't actually have.

  **6. The Unlucky Samaritan**
  Sarah sees someone drowning and jumps in to save them. She does everything right, but a sudden current pulls the victim under anyway. They drown.
  *   **A.** She has full moral worth. She controlled her will, not the outcome.
  *   **B.** She gets partial credit. Good intentions matter, but failing to help hurts the value.
  *   **C.** She gets no moral "worth." Moral praise is for successful outcomes, not tries.

  **7. The Sympathetic Friend**
  You comfort a grieving friend. You do it because you love them and feel their pain, not because you think "it is my duty."
  *   **A.** This is the best kind of goodness. Acting from love is better than acting from cold duty.
  *   **B.** It's good, but it only has true moral worth if you'd still do it even if you didn't feel like it.
  *   **C.** It's just psychology. Calling it "moral worth" adds nothing to the fact that it was kind.

  **8. The Reluctant Hero**
  Jasmine hates public speaking but gives a speech to expose a corruption scandal because she knows it's the right thing to do. She has no desire to do it.
  *   **A.** This is the only thing that counts as moral worth. Doing it *despite* your desires is what matters.
  *   **B.** It counts, but it would be better if she also desired to do the right thing.
  *   **C.** It counts equally to anyone else who exposes scandals, regardless of how they felt.

  **9. The Factual Mistake**
  David tries to give a starving person food, but the food is poisoned (unknown to him). The person dies.
  *   **A.** David's action still has moral worth. He acted on the reasons he thought were right.
  *   **B.** No. Moral worth requires knowing the actual facts, not just your version of them.
  *   **C.** David is blameworthy for not checking, so the question of "worth" doesn't even come up.

  **10. The Grading Scale**
  Imagine two people do the same right thing. One does it from pure duty; the other does it from a mix of duty and personal gain.
  *   **A.** Only the first one has moral worth. It's all-or-nothing.
  *   **B.** The first one has *more* worth, but the second one still has some.
  *   **C.** "Moral worth" isn't a substance you measure. They both did the right thing; let's move on.

  ***

  ### Scoring Key & Position Map

  Count your As, Bs, and Cs. Find your dominant letter below. This table maps your quiz result to the specific philosophical positions discussed in ethics.

  | Your Dominant Answer | Quiz Result Profile | Philosophical Positions Mapped (Plain English) |
  | :--- | :--- | :--- |
  | **Mostly A** | **The Motive Purist** | **Strict Duty View:** Only acting *because* it is right counts.<br>**Right Reasons View:** You must be moved by the specific features that make the act right.<br>*(Note: These two are lumped together here.)* |
  | **Mostly B** | **The Nuanced Hybrid** | **Duty as Limiting Condition:** Love/habit is fine, provided duty is your backup.<br>**Knowledge Requirement:** You need to understand *why* the act is right to get credit.<br>*(Note: These are compatible but distinct views.)* |
  | **Mostly C** | **The Pragmatic Realist** | **Right Tracking:** Doing the right thing matters more than the inner motive.<br>**Deflationary View:** "Moral worth" is just praise; don't overthink the metaphysics.<br>**Outcome Focus:** Success matters more than intention. |
  | **Mixed / Tie** | **The Agent-Centric** | **Attributability View:** The action must truly belong to *you* (no engineering/cults).<br>**Character View:** Worth is about who you are, not just what you did.<br>*(Note: This profile emerges when you care about the 'Who' more than the 'Why' or 'What'.)* |

  ***

  ### Result Blurbs

  **The Motive Purist**
  You believe the heart of morality lies in *why* we act, not just what we do. For you, an action only glows with moral worth if it springs from a genuine commitment to doing the right thing, regardless of feelings or outcomes. You're likely to argue that the shopkeeper who cheats when no one is watching was never truly honest at all.

  **The Nuanced Hybrid**
  You think morality is rich and complex, requiring both the right heart and the right head. You're open to people acting from love or habit, but only if they respect duty enough to step in when their feelings fail. For you, moral worth isn't a switch; it's a spectrum that depends on how well you understand what you're doing.

  **The Pragmatic Realist**
  You're less concerned with inner motives and more focused on the real-world impact of actions. To you, "moral worth" is just a fancy way of praising people who reliably do good things, however they get there. You'd rather reward the shopkeeper who charges fair prices than the saint who means well but causes chaos.

  **The Agent-Centric**
  You believe moral worth is about ownership: does this action truly belong to *you*? You're skeptical of credit when actions come from engineering, cults, or lucky flukes, preferring to judge the whole person rather than isolated acts. For you, morality is about authenticity and character, not just checking the right boxes.

  ***

  ### Limitations & Analysis (For the Blog Owner)

  **What This Quiz Cannot Separate**
  The "Motive Purist" result lumps together the **Strict Duty View** (Kantian) and the **Right Reasons View** (Aristotelian/Reasons-Responsive). Both prioritize internal motivation, but one requires the thought "this is my duty" while the other only requires acting on the reason "he needs help." Your Question 7 tries to pull this apart, but in a 10-question quiz, respondents often treat "duty" and "right reasons" as the same internal commitment. Similarly, the "Pragmatic Realist" combines **Right Tracking** with the **Deflationary View**. One is a substantive claim about value (tracking rightness creates worth), the other is a meta-ethical claim (worth isn't a real property). The quiz treats them identically because they produce the same verdicts on cases, even if their underlying theories differ.

  **Impossible or Unexplored Combinations**
  If a user answers **A on Question 4** (Engineered Volunteer gets no credit) but **C on Question 1** (Shopkeeper gets credit for outcomes), they land on a view nobody defends: **Attributability without Motive**. This position claims an action must be "authentically yours" to count, but simultaneously claims *why* it's yours doesn't matter, only the result does. This is likely incoherent; if the outcome is all that matters, the origin of the impulse (surgery vs. choice) should be irrelevant. If a user selects this, they are likely answering inconsistently rather than holding a stable philosophical position. Finally, the quiz does not fully separate **Factual Ignorance** from **Moral Ignorance** (Question 2 vs. Question 9). Most theories treat these differently (factual ignorance excuses, moral ignorance might not), but the quiz options force them into similar "Knowledge Required" buckets for the sake of flow.
