answer: |-
  You have independently rediscovered the foundational architecture of game theory and social science. You aren't re-inventing something so much as you have intuitively grasped the two primary modes of **Collective Action Problems**.

  Here is the breakdown of the names, the relationship between the two patterns, and where the lines are drawn.

  ### 1. Naming Pattern 1 (The "Disaster" Scenario)

  You described a situation where individual actions are locally rational but cumulatively catastrophic, specifically where the harm is negligible per person but severe in aggregate.

  **The Classic Name: The Tragedy of the Commons**
  This is the standard economic term. While often taught as "overgrazing a shared pasture," the "commons" doesn't have to be a physical resource; it can be **safety, stability, or trust**.
  *   **Why it fits:** The "resource" being depleted is the group's collective safety. Each person "consumes" a bit of safety by taking the action (publishing the exploit, using the pesticide).
  *   **Why it might feel wrong:** People often associate ToC with *rivalrous* goods (if I eat the fish, you can't). Your example is non-rivalrous but *cumulative* (my exploit doesn't stop you from publishing yours, but together we break the internet).

  **The Philosophical Name: Parfit's "Harmless Torturers"**
  The philosopher Derek Parfit described a thought experiment that matches your description exactly.
  *   **The Setup:** 1,000 torturers each have a switch that adds a tiny, imperceptible amount of pain to a victim. Flipping one switch does no noticeable harm. Flipping all 1,000 causes agony.
  *   **The Logic:** Each torturer reasons, "My switch makes no difference."
  *   **The Result:** All flip, agony ensues.
  *   **Why use this name:** If you want to distinguish your pattern from "resource depletion" (ToC), this is the precise term for **cumulative threshold harm**.

  **The Modern Systems Name: A Multipolar Trap (or "Moloch")**
  Popularized by Scott Alexander and AI safety researchers (originally from Allen Ginsberg's poem).
  *   **The Vibe:** This is used when competing agents (companies, countries, labs) are locked into a system where they *must* optimize for the harmful action to survive, even if they hate the outcome.
  *   **Fit:** This captures the "nobody is being reckless; each person is reasoning correctly" aspect perfectly.

  **If you want a new name:**
  If you feel the existing terms don't capture the *threshold* nature (harmless until $N$ people do it), call it **"The Threshold Externality."**
  *   **What it covers:** Any action where the marginal cost to the collective is near-zero for the first $N$ actors, but spikes exponentially after.
  *   **What it rules out:** It rules out linear harm (where one person doing it causes 1/1000th of the damage). It specifically requires that *individual* action feels harmless.

  ---

  ### 2. Naming Pattern 2 (The "Inaction" Scenario)

  You described a situation where a public good requires a private cost, and the probability of action drops as the group size grows.

  **The Game Theory Name: The Volunteer's Dilemma**
  This is the precise mathematical structure.
  *   **The Setup:** A public good is provided if *at least one* person pays a cost. If no one pays, everyone loses.
  *   **The Logic:** "I hope someone else volunteers so I can keep my money/time."
  *   **The Result:** As the number of bystanders ($N$) increases, the probability that *anyone* volunteers approaches zero.

  **The Psychological Name: The Bystander Effect / Diffusion of Responsibility**
  This is the behavioral mechanism. It explains *why* the Volunteer's Dilemma happens in human brains. We feel less personal responsibility when others are present.

  **The Economic Name: The Free Rider Problem**
  *   **Nuance:** Strictly speaking, "Free Riding" usually implies the good *gets provided* and you enjoy it without paying. In your scenario, if everyone free-rides, the good *never gets provided*. So **Volunteer's Dilemma** is more accurate than Free Rider Problem, though they are cousins.

  ---

  ### 3. Are They The Same Structure?

  **Yes, they are duals.**
  They are the exact same mathematical structure with the signs flipped on the payoffs.

  *   **Pattern 1 (Tragedy/Parfit):**
      *   **Action:** Private Gain, Shared Pain (Negative Externality).
      *   **Dominant Strategy:** Do the thing.
      *   **Failure Mode:** Over-supply of a bad.
  *   **Pattern 2 (Volunteer/Bystander):**
      *   **Action:** Private Pain, Shared Gain (Positive Externality).
      *   **Dominant Strategy:** Wait for someone else.
      *   **Failure Mode:** Under-supply of a good.

  **The Underlying Concept:**
  The umbrella term that covers both is **Social Dilemma** (or **Collective Action Problem**).
  At the deepest level, both are failures of **Externalities**.
  *   Pattern 1 is a failure to internalize **Negative Externalities** (I don't pay for the risk I create).
  *   Pattern 2 is a failure to internalize **Positive Externalities** (I don't get paid for the safety I create).

  ---

  ### 4. Drawing the Lines (Differentiation)

  You asked specifically how to distinguish these from similar concepts. Here is the boundary map:

  | Concept | Core Mechanism | How it differs from your Pattern 1 | How it differs from your Pattern 2 |
  | :--- | :--- | :--- | :--- |
  | **Tragedy of the Commons** | Depletion of a rival resource. | **It is the same thing.** Your Pattern 1 *is* a ToC where the resource is "safety." | Distinct. ToC is about *stopping* action; Pattern 2 is about *starting* action. |
  | **Free-Riding** | Enjoying a benefit without paying. | Distinct. Free-riding assumes the good exists. Pattern 1 creates a *bad*. | **It is the behavior in Pattern 2.** Free-riding is *why* Pattern 2 fails. |
  | **Diffusion of Responsibility** | Psychological feeling of reduced duty. | Distinct. This is a *cause*, not the *structure*. Pattern 1 doesn't require this psychology; it works even with cold calculators. | **It is the mechanism of Pattern 2.** This explains the human psychology behind the Volunteer's Dilemma. |
  | **Unilateralist's Curse** (Bostrom) | One person can trigger the outcome. | **Close, but distinct.** Bostrom's curse is binary (1 person = disaster). Your Pattern 1 is cumulative (1,000 people = disaster). | Distinct. |
  | **Race to the Bottom** | Competition drives standards down. | **Subset.** This applies if the actors are *competing* (e.g., companies). Your Pattern 1 works even without competition (e.g., friends at dinner). | Distinct. |

  ### 5. Summary Verdict

  1.  **Does Pattern 1 have a name?**
      Yes. Academically, it is a **Tragedy of the Commons** (specifically regarding public risk). Philosophically, it is **Parfit's Harmless Torturers**. In modern systems theory, it is a **Multipolar Trap**.
      *   *Recommendation:* If you want to sound precise about the "threshold" aspect, use **"The Cumulative Harm Dilemma."**

  2.  **Is Pattern 2 the same thing?**
      It is the **inverse**. Pattern 1 is a **Public Bad** problem (how to stop people acting). Pattern 2 is a **Public Good** problem (how to get people to act). They are two sides of the **Social Dilemma** coin.

  3.  **Is there one underlying concept?**
      Yes: **Externalities in N-Person Games.**
      Both patterns exist because individual incentives are not aligned with group outcomes.
      *   Pattern 1: $Benefit_{individual} > Cost_{individual}$, but $Cost_{group} \gg Benefit_{group}$.
      *   Pattern 2: $Cost_{individual} > Benefit_{individual}$, but $Benefit_{group} \gg Cost_{group}$.

  **The "Line" you are looking for:**
  The line is **who pays the cost.**
  *   In Pattern 1, the cost is **deferred and shared** (everyone pays later), so everyone acts now.
  *   In Pattern 2, the cost is **immediate and private** (I pay now), so everyone waits.

  If you need a single phrase to describe your intuition about the first pattern to others, say: **"It's a Tragedy of the Commons applied to risk thresholds, like Parfit's Harmless Torturers."** That will signal to anyone in philosophy, econ, or AI safety that you know exactly what you're talking about.
