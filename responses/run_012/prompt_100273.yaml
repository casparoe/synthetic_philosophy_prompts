      *   *Option 3 (Cells):* Innovative. Addresses the monitoring constraint (peer monitoring within cells). Addresses maintenance (bonus for labor). Addresses the variability of water (allocations can still be snowpack-linked). *Risk:* Collective punishment is unpopular. Sorting/Segregation is a major risk.

  3.  **Determine the Recommendation:**
      *   Option 3 is the only one that offers a path to sustainability *and* addresses the maintenance labor shortage while working within the monitoring constraints. However, the objection regarding "sorting" and "unfair punishment" is critical.
