answer: |-
  This is a classic sticking point in reading Aquinas, and you have spotted the exact tension that scholars debate. To clear this up, we need to do three things: translate and contextualize that specific Latin snippet, explain the argument actually contained in that Distinction, and then reconcile it with his later, more mature works like *On Kingship* and the *Summa Theologiae*.

  ### 1. Translating and Contextualizing the Latin
  First, your translation intuition is correct, but the function of the text is structural. Here is a literal translation:

  > "Here a question arises not to be passed over in silence. Here he inquires concerning the obedience owed to those who have power from God: and first he raises the question; second he solves it, there: but it must be known, the apostle there speaks of secular power."

  **What is this text doing?**
  This passage is from Aquinas's *Scriptum super Sententiis* (Commentary on the Sentences), which he wrote as a young man. In this specific section (Book II, Distinction 44), Aquinas is commenting on a text by Peter Lombard (the "Master of the Sentences") which discusses Romans 13 ("Let every soul be subject to higher powers").

  This specific snippet is an **introduction**. Aquinas is telling the reader: "We are about to discuss obedience to rulers. The Apostle Paul says obey them, but we need to clarify *which* rulers and *when*."

  The key phrase is *"apostolum ibi loqui de saeculari potestate"* ("the apostle there speaks of secular power"). For Aquinas, "secular power" isn't just any guy with a sword; it implies a power ordered toward the common good. By limiting the scope of Paul's command, Aquinas is opening the door to say: **Obedience is not absolute.** If the power is not truly "from God" (i.e., not just), the obligation to obey dissolves.

  ### 2. The Argument in Distinction 44
  While the snippet you provided is just the intro, the articles that follow in this Distinction contain the meat of the argument. Here is the logic Aquinas employs in this early work:

  1.  **The Source of Authority:** Authority is from God only insofar as it is ordered to the good.
  2.  **The Tyrant:** A tyrant rules for his own private good, not the common good. Therefore, his rule is a perversion of authority.
  3.  **The Obligation:** Subjects are not bound to obey a tyrant in the same way they are bound to obey a just king.
  4.  **Resistance:** In this early commentary, Aquinas is somewhat more open to resistance than in his later works. He suggests that if a ruler becomes a tyrant, he forfeits his claim to obedience.

  However, even here, he does not explicitly endorse *private* assassination. He focuses on the **dissolution of the bond of obedience**. If the bond is broken, the ruler is no longer a "ruler" in the moral sense, but a brigand.

  ### 3. Reconciling with *On Kingship* and the *Summa*
  This is where the confusion about "tyrannicide" usually comes from. You are right that in *On Kingship* (*De Regno*) and the *Summa*, Aquinas seems more cautious. There is no contradiction, but there is a **development of precision**.

  Here are the three key distinctions Aquinas uses to navigate this issue across his works:

  #### A. Usurper vs. Tyrant
  Aquinas distinguishes between two types of bad rulers:
  *   **The Usurper:** Someone who has no right to the title at all (he seized power illegitimately). Aquinas is more permissive here. Since he never had legitimate authority, he may be deposed, potentially by anyone acting on behalf of the community.
  *   **The Tyrant:** Someone who had a legitimate title but rules badly (oppressively, for private gain). This is the harder case. Because he was legitimately installed, removing him is trickier.

  #### B. Private vs. Public Authority (The Most Important Distinction)
  This is the linchpin of Aquinas's political thought.
  *   **Private Presumption:** A private individual taking it upon themselves to kill a ruler is almost always condemned by Aquinas. In the *Summa Theologiae* (II-II, Q. 42), he classifies this as **sedition**. Even if the ruler is bad, a private killing disrupts the order of justice and sets a dangerous precedent. It turns the citizen into a judge and executioner, which is not their role.
  *   **Public Authority:** If there is a mechanism to remove the tyrant (e.g., the nobles, the parliament, the electors who put him in power), that is legitimate. In *On Kingship*, Aquinas writes that if a king becomes a tyrant, it is not for a private individual to kill him, but for **public authority** to depose him.

  #### C. The "Greater Harm" Principle
  In *On Kingship*, Aquinas adds a pragmatic constraint. Even if a tyrant *could* be removed, one must calculate the consequences.
  *   If overthrowing the tyrant will result in civil war, greater oppression, or the collapse of society, **the tyrant should be tolerated.**
  *   He argues that sometimes the remedy is worse than the disease. This is likely the source of the view you remember about "tolerating" the tyrant.

  ### 4. What about the "Praiseworthy" Quote?
  You mentioned hearing that Aquinas thought killing a tyrant could be praiseworthy. You are likely thinking of a passage in *On Kingship* (Book I, Chapter 6).

  Aquinas acknowledges that in ancient history (like the Romans killing Caesar), those who killed tyrants were praised by men. However, he immediately qualifies this. He says that while human law might praise it, **Divine law** generally reserves judgment to God or public authority. He warns that encouraging private tyrannicide usually leads to the killing of good kings by wicked subjects who *claim* the king is a tyrant.

  So, when people say "Aquinas supported tyrannicide," they are usually oversimplifying. A more accurate summary is: **Aquinas supported the deposition of tyrants by public authority, provided it does not cause greater harm to the common good, but he generally condemned private assassination.**

  ### 5. Summary: How the Pieces Fit
  To answer your specific question about the Latin passage and the tension:

  1.  **The Latin Passage:** It establishes that obedience is due only to legitimate power ordered to the good. It limits the Biblical command to obey rulers, creating the logical space for resistance.
  2.  **The *Sentences* (Early):** Focuses on the fact that a tyrant forfeits the *right* to obedience. It is slightly more open to resistance but still cautious.
  3.  **The *Summa* / *On Kingship* (Mature):** Focuses on *who* may act. It tightens the rules: private killing is sedition; public deposition is justice. It adds the utilitarian check: don't make things worse.

  **Is there a real tension?**
  No, it is a matter of **context and specification**.
  *   In the *Sentences*, he is answering a theological question about the *nature* of obedience (is it absolute? No).
  *   In *On Kingship*, he is giving political advice on the *practice* of regime change (who should do it? The public. When? When it won't destroy the city).

  **The Bottom Line:**
  Aquinas never gives a "green light" for vigilante justice. He argues that a tyrant is a criminal against the common good. But in a well-ordered society, criminals are punished by the system, not by individuals. If the system itself is the tyrant, the *community* (public authority) may act to remove him, but a private citizen acting alone is generally committing a sin, even if the target is wicked, because the act itself undermines the rule of law.

  The Latin passage you found is the foundation: it says obedience depends on the *quality* of the power. The later works build the fence around that foundation: just because the power is bad doesn't mean *you* personally get to be the executioner.
