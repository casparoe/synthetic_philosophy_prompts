answer: |-
  ### The Demarcation Problem: Context and Constraints

  Before analyzing your friend's specific judgments, it is necessary to state a background condition that is settled among philosophers of science: **there is no consensus on a single necessary and sufficient condition for demarcating science from pseudoscience.**

  Following the work of Larry Laudan (specifically his 1983 paper "The Demise of the Demarcation Problem"), most contemporary philosophers regard demarcation not as a binary switch governed by one rule (like falsifiability), but as a "cluster concept" (a term popularized by Massimo Pigliucci and Maarten Boudry). Different criteria carry different weights in different contexts. Consequently, any rule we reverse-engineer here is a heuristic model of your friend's judgment, not a universal law of epistemology.

  With that caveat, we can construct three candidate rules that fit her prior verdicts with varying degrees of success.

  ---

  ### Candidate Rule 1: The Naive Falsifiability Criterion (Popperian)
  **The Rule:** A claim is scientific if it is empirically testable and potentially falsifiable. It is pseudoscience if it is vague, immune to counter-evidence, or makes no risky predictions.
  **Settled/Contested Status:** Contested. While falsifiability is a necessary condition for many, it is widely regarded as insufficient (e.g., Marxist history or Freudian psychoanalysis can be made to fit any data, yet are specific; astrology is often vague but sometimes specific).

  *   **Fit with Prior Verdicts:**
      *   *Astrology:* Fits (often vague/immunized).
      *   *Younger Dryas:* Fits (testable via geological markers).
      *   *Egyptian Chronology:* Fits (radiocarbon dates are testable).
      *   *Weakness:* It struggles with Fomenko and Hancock. Fomenko's "New Chronology" makes specific mathematical claims that are checkable (and checked, and found wanting). Hancock's claims about lost civilizations are empirically falsifiable (find the ruins or don't). If testability were the *only* rule, these might qualify as "mistaken science" rather than pseudoscience.
  *   **Prediction for the Sphinx Case:** **Legitimate (but probably mistaken) empirical claim.**
      *   *Reasoning:* The prompt states the geological core is "in principle checkable against paleoclimate and weathering data." Under a strict falsifiability criterion, the *content* of the claim matters more than the *behavior* of the proponent. Since the erosion claim could theoretically be proven false by new data, it counts as science.

  ### Candidate Rule 2: The Institutional/Procedural Criterion (Mertonian)
  **The Rule:** A claim is scientific if it is submitted to the relevant expert community for peer review, engages with criticism without invoking conspiracy, and adheres to the norms of organized skepticism. It is pseudoscience if it bypasses gatekeeping, appeals directly to the public, or explains away negative evidence via conspiracy.
  **Settled/Contested Status:** Contested. Sociological criteria risk conflating "science" with "scientific establishment," potentially excluding legitimate mavericks (e.g., Semmelweis or Wegener in their early days). However, it is a strong indicator of *practice*.

  *   **Fit with Prior Verdicts:**
      *   *Astrology/Ancient Astronauts:* Fits (bypasses relevant journals, ignores criticism).
      *   *Younger Dryas:* Fits (proponents publish in geological journals, engage with critics, do not primarily claim a conspiracy to explain rejection).
      *   *Egyptian Chronology:* Fits (wrangling happens within journals/conferences).
      *   *Hancock/Fomenko:* Fits (both rely heavily on popular books/TV, claim establishment suppression when challenged).
  *   **Prediction for the Sphinx Case:** **Pseudohistory/Pseudoscience.**
      *   *Reasoning:* The proponent "declines to submit it to the journals" and reads indifference as a "cover-up." This is a procedural violation. Regardless of the geological truth, the *method of pursuit* violates the norms of the relevant community.

  ### Candidate Rule 3: The Integrative Coherence Criterion (Methodological Naturalism)
  **The Rule:** A claim is scientific only if it coheres with the broader web of established knowledge and engages with *all* relevant lines of evidence, not just a selective slice. It is pseudoscience if it is "siloed"—accepting evidence that supports the claim while ignoring overwhelming contradictory evidence from adjacent fields.
  **Settled/Contested Status:** Contested. This is a Bayesian/Coherentist approach. The risk is that it can be conservative, rejecting paradigm shifts that initially look incoherent (e.g., Continental Drift initially lacked a mechanism).

  *   **Fit with Prior Verdicts:**
      *   *Hancock:* Fits (ignores lack of material culture/pottery/ruins expected of a civilization).
      *   *Fomenko:* Fits (ignores linguistic and dendrochronological data that contradict his math).
      *   *Younger Dryas:* Fits (proponents attempt to reconcile geology, chemistry, and archaeology, even if controversially).
      *   *Egyptian Chronology:* Fits (radiocarbon is weighed against king lists and epigraphy).
  *   **Prediction for the Sphinx Case:** **Pseudohistory.**
      *   *Reasoning:* The proponent "does not engage the archaeological and epigraphic evidence." A claim about the *date* of a monument is not purely geological; it is historical. Ignoring the epigraphic context (who built it, when inscriptions say it was built) to focus solely on weathering is a failure of integrative coherence.

  ---

  ### Best Guess: The Procedural-Integrative Hybrid

  **Verdict:** She will likely call the Sphinx claim **Pseudohistory.**

  **Why:**
  The clearest signal in your data is the distinction between the **Younger Dryas Impact Hypothesis** and **Graham Hancock's Ice Age Civilization**. Both make radical claims about the deep past that challenge conventional timelines. Both are empirically testable.
  *   **Younger Dryas** is deemed "legitimate" because its proponents publish data, submit to peer review, and attempt to engage with counter-arguments (even if many geologists remain skeptical).
  *   **Hancock** is deemed "pseudohistory" because he bypasses the archaeological record (no ruins, no pottery) and appeals directly to the public via media.

  This suggests your friend is not a pure Falsificationist (otherwise Hancock would be "mistaken science"). She is also not a pure Institutionalist (otherwise she might be more skeptical of Younger Dryas, which is fringe). She appears to operate on a **hybrid rule**: *Legitimate inquiry requires both submission to institutional scrutiny (Procedure) AND engagement with the total relevant evidence base (Integration).*

  The Sphinx geologist fails both tests: he avoids journals (Procedural fail) and ignores epigraphy (Integrative fail). The "cover-up" rhetoric is the final nail in the coffin, signaling an immunity to criticism that characterizes the "pseudo" label in her taxonomy.

  ---

  ### The Crucial Test Case: "The Siloed Specialist"

  To distinguish whether she prioritizes **Procedure** (Rule 2) or **Integration** (Rule 3)—since both predict "Pseudo" for the Sphinx—you need a case where these two criteria diverge.

  **The Case:**
  > A climatologist publishes a paper in a top-tier, peer-reviewed journal (e.g., *Nature Climate Change*). Using standard statistical methods, she argues that a specific volcanic eruption in 500 CE caused a global societal collapse. Her statistical modeling is sound and passes peer review. However, she makes no reference to the historical or archaeological record, which contains extensive written accounts and material evidence showing societies in that region flourished during that specific decade. She dismisses historians' objections in interviews as "outside her expertise."

  **How the Rules Diverge:**
  1.  **Procedural Rule:** Predicts **Legitimate Science.** The claim passed peer review, used standard methods, and was submitted to the relevant community. The error is empirical, not methodological.
  2.  **Integrative Rule:** Predicts **Pseudoscience.** The claim ignores a massive body of contradictory evidence from an adjacent field (history/archaeology) that is directly relevant to the conclusion. It is "siloed" science.

  **Why this tells them apart:**
  If she calls this "Legitimate but mistaken," she is a **Proceduralist** (the game was played correctly). If she calls it "Pseudoscience," she is an **Integrationist** (ignoring relevant background knowledge invalidates the scientific status, regardless of peer review). Given her rejection of Fomenko (who used math but ignored linguistics/history), I suspect she would lean toward **Integrationist**, labeling this "Pseudoscience" despite the peer review.

  ### Summary of Demarcation Status
  *   **Settled:** There is no single "magic bullet" criterion (Laudan). Demarcation is context-dependent.
  *   **Contested:** The weight given to sociological factors (peer review) vs. epistemic factors (coherence with evidence). Some argue peer review is constitutive of science (Collins/Evans); others argue it is merely a quality control filter that can fail (Feyerabend).
  *   **Your Friend's Likely Stance:** She appears to be a **Methodological Pluralist** who weights *behavioral norms* (no conspiracy theories) and *evidentiary integration* (no ignoring adjacent fields) higher than *theoretical possibility* (falsifiability).
