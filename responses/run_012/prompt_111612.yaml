      The Virginia 94th District tie exposes the fault lines in voting ethics by separating the act of voting from the outcome of governance. To analyze this, we must distinguish the agent (the voter), the act (casting a ballot), and the mattering (causal impact) across ex ante (before the vote) and ex post (after the lottery) timelines.

