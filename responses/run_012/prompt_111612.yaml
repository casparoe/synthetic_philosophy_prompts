prompt: |-
  Alright, here's an episode I keep coming back to. 2017, Virginia House of Delegates: control of the whole chamber comes down to one district, the 94th, incumbent Republican David Yancey vs. Democrat Shelly Simonds. The recount ends up an exact tie, and under Virginia law a tie gets broken by drawing lots — so a state board literally pulled a name out of a bowl, Yancey's name came up, and that handed the GOP a 51–49 majority. The balance of an entire legislature, settled by a draw.

  I want you to run that episode through the ethics of voting, the three strands specifically: the duty to vote, the expressive account, and the lesser evil. Some things I want nailed down. Does a duty to vote survive the fact that any single vote's ex ante chance of being pivotal is basically nil — and does anything change once we know that ex post this particular race came down to a name in a bowl? For the expressive view, where the value of voting is in the statement rather than the margin, does the lot-drawing vindicate it, or just make it look like an excuse for not caring whether you win? And for lesser evil: the voters who held their nose for a candidate they disliked — now that we know their district decided everything, are they complicit in the outcome in a way that a plain "I voted for the lesser evil" doesn't cover? That last one smells like moral luck to me and I want you to say whether that's the right frame or a dodge.

  Be disciplined about the mapping — who the agent is, what the act is, what "mattering" means ex ante vs. ex post — and where a strand goes silent, say so instead of forcing it to talk. Then flip it around: what does the episode show about the three views? Does it confirm the expressive line, embarrass the duty line, or is it just an edge case that tests nothing? I'd rather you actually land on an answer than shrug.

  Keep it to 800 words max, one page, and dont give me citations or a reading list — I don't care who said what, I want the argument.
