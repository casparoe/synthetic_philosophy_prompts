answer: |-
  Friends, family, neighbors. We are gathered to honor forty years. Convention tells us to measure such a span by its outputs: the children raised, the crises weathered, the contributions to a community. We are tempted to say this marriage is good because it was useful, because it produced happiness, or because it fulfilled a duty.

  But I want to invite you to try a different kind of seeing. I want to ask you to perform a small thought experiment. Imagine, for a moment, that we could strip away the effects of this union. Imagine away the children, the friends they've hosted, the parent they buried, the neighbors who rely on them. Set aside the question of whether they were "happy" in any simple sense. If we isolate the marriage itself, from all its consequences and all its surroundings, does anything of value remain?

  The answer, I believe, is yes. And that is because what we are celebrating is not a tool for living, but a thing good in itself.

  There is a philosophical temptation to treat a life like an arithmetic problem. We might be inclined to tally the sunny decades against the hard ones. We might count the long illness as a negative, the years of estrangement in the middle as a debt to be subtracted from the credit of the early years. But a marriage is not a sum of parts. It is an organic whole. The value of the whole is not identical to the sum of the values of its parts.

  The years of silence did not merely cancel out the years of speech; they transformed them. The illness did not simply subtract from the health; it altered the texture of the care. The value of this forty-year whole emerges from the specific way these things fit together. The reconciliation is valuable precisely because it followed the estrangement. The devotion is valuable precisely because it persisted through the illness. To remove the hard parts would not be to improve the whole; it would be to destroy the specific goodness that exists here.

  And this brings me to the garden.

  We know it as a local landmark. But in this context, it is something else. It is the second half of a equation for the good life. There are few things we can say are good in themselves, but among the greatest are the pleasures of human affection and the enjoyment of beautiful things. Each is good on its own. But the best conceivable whole is one that combines them.

  This marriage is that whole. It is not just that you love each other, and also happen to like gardening. It is that your affection is woven through a shared devotion to beauty. You did not just look at the flowers; you looked at them together. You cultivated a shared regard for the world. That combination—affection plus the enjoyment of beauty—creates a value greater than either could hold alone.

  So, when we raise our glasses, let us not toast merely what this marriage has done. Let us toast what it *is*. Even if the world were empty of everyone else, even if the garden were unseen by any other eye, the love you have borne for one another, and the beauty you have tended together, would still be good.

  To forty years of intrinsic worth. To the whole that is greater than the sum of its parts. To [Name] and [Name].
