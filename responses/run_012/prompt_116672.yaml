answer: |-
  Your skepticism is well-founded. The "Citizens' Assembly = Jury" analogy is the most potent rhetorical tool in the sortition toolkit, but it is also a *partial* map. It works beautifully to justify the *selection method* (randomness), but it smuggles in assumptions about the *task* (adjudication vs. creation) and the *authority* (binding vs. advisory).

  Your colleague is using the analogy to borrow the **institutional legitimacy** of the legal system to cover the **political uncertainty** of the assembly.

  Here is the breakdown you asked for, followed by an assessment of whether the trustworthiness claim survives the scrutiny.

  ### Part 1: The Correspondence Table

  | Feature | The Trial Jury (Petit Jury) | The Citizens' Assembly | Strength of Match |
  | :--- | :--- | :--- | :--- |
  | **Selection** | Random sortition from voter/DMV rolls. | Random sortition (stratified) from voter/census rolls. | **Strong.** This is the core of the analogy. |
  | **Composition** | ~12 laypeople. | ~100–150 laypeople. | **Weak.** Scale changes group dynamics significantly. |
  | **Expertise** | Explicitly non-expert; "peers." | Explicitly non-expert initially; become "informed" via learning phase. | **Medium.** CAs require members to absorb expert testimony; juries must only weigh it. |
  | **Information** | Evidence admitted under strict rules; filtered by judge. | Expert presentations, stakeholder testimony; curated by steering committee. | **Weak.** See "The Judge" below. |
  | **Process** | Adversarial (Prosecution vs. Defense). | Deliberative (Consensus-seeking, facilitated). | **Weak.** Different epistemic goals (winning vs. solving). |
  | **Question** | "Did the defendant commit Act X?" (Binary/Restricted). | "How should the state solve Problem Y?" (Open-ended/Complex). | **Very Weak.** See "The Question" below. |
  | **Standard** | "Beyond Reasonable Doubt." | "Best available judgment" / "Common Good." | **Very Weak.** See "Standard of Proof" below. |
  | **Output** | Verdict (Guilty/Not Guilty). | Recommendations / Report. | **Weak.** See "Binding Power" below. |
  | **Authority** | Binding; enforced by the State. | Advisory; referred to Legislature/Parliament. | **Critical Break.** |

  ### Part 2: Where the Mapping Breaks Down (The Smuggling)

  This is where your colleague's argument is doing heavy lifting by hiding the machinery. Here are the five specific disanalogies you flagged, plus one more.

  **1. The Judge vs. The Steering Committee**
  *   **Jury:** The judge is a neutral officer of the court bound by procedural law. They exclude hearsay and irrelevant info to protect the jury from *contamination*.
  *   **Assembly:** The "curators" of information are a Steering Committee or Secretariat. They decide which experts are "balanced."
  *   **The Smuggle:** The analogy assumes the information flow in an Assembly is as neutrally filtered as in a court. In reality, curating experts for policy is inherently political. If the Assembly hears three climate scientists and one skeptic, that's a political choice, not a procedural safeguard. The jury analogy hides the power of the agenda-setters.

  **2. Adversarial vs. Consensus**
  *   **Jury:** Truth is procedural. Two sides fight; the jury decides who told the more credible story. The system is designed to produce a winner, not necessarily "the truth."
  *   **Assembly:** Truth is supposed to be substantive. Members work *together* to find a solution.
  *   **The Smuggle:** Juries are trained to be skeptical of the state (prosecution). Assemblies are often tasked with *helping* the state solve a problem. The jury analogy imports a vibe of "independence" without the adversarial structure that guarantees it.

  **3. Binding vs. Advisory (The Stakes)**
  *   **Jury:** The verdict is final (mostly). The stakes are immediate and real (liberty). This forces serious deliberation.
  *   **Assembly:** The output is a recommendation. Parliament can ignore it.
  *   **The Smuggle:** This is the biggest leak. If a jury knows their decision might be ignored, the deliberation collapses. Because Assembly members know their work is advisory, the "gravity" of the jury room is missing. The analogy borrows the *solemnity* of the jury without the *consequence*.

  **4. Standard of Proof (Asymmetry)**
  *   **Jury:** "Beyond Reasonable Doubt." The system is rigged to prefer *inaction* (acquittal) over *action* (conviction) to protect liberty. It is a negative check on power.
  *   **Assembly:** Policy requires *action*. Inaction (e.g., on climate change) has costs. There is no "presumption of innocence" for a tax policy.
  *   **The Smuggle:** The jury analogy suggests that random people are safe because they are cautious. But policy often requires bold, risky trade-offs where "acquitting" the status quo is the dangerous option.

  **5. The Question (Fact vs. Value)**
  *   **Jury:** Decides matters of *fact* (Did he pull the trigger?) applied to fixed *law* (Is that murder?).
  *   **Assembly:** Decides matters of *value* (How much should we tax? How much risk is acceptable?).
  *   **The Smuggle:** It is easier to trust a layperson with a factual determination than a value judgment. The analogy implies policy is a puzzle with a right answer (like a verdict), rather than a negotiation of competing goods.

  **6. Secrecy vs. Transparency**
  *   **Jury:** Deliberates in total secrecy to prevent coercion.
  *   **Assembly:** Often deliberates in public (or livestreamed) to build public trust.
  *   **The Smuggle:** Public deliberation changes behavior (grandstanding, performative virtue). The jury analogy assumes the "purity" of the deliberation room, which Assembly conditions often violate to ensure legitimacy.

  ### Part 3: The Payoff

  **Does the claim of trustworthiness survive?**

  **Verdict: Partially, but not for the reasons your colleague thinks.**

  The analogy succeeds in establishing **Descriptive Legitimacy** (the microcosm represents the people), but it fails to establish **Epistemic Authority** (the microcosm knows what to do).

  *   **What survives:** The argument that "ordinary people are not stupid." The jury system proves that laypeople can process complex information and reach a reasoned conclusion without being captured by special interests (mostly). This defends the *composition* of the Assembly against elitism.
  *   **What collapses:** The argument that the *output* is as reliable as a legal verdict. Because the safeguards of the legal system (rules of evidence, adversarial testing, binding authority, presumption of innocence) are absent, the "trust" cannot be transferred wholesale.

  **Was the analogy doing the whole job?**
  Yes, mostly. If you remove the jury analogy, the organizer has to argue: *"We trust a random group of people to write tax policy because they will listen to experts and try to be nice to each other."* That is a much harder sell than *"We trust them with prison time, why not taxes?"*

  The analogy is a **synecdoche**: it takes the one part of the process that is similar (random selection) and pretends the rest of the machine works the same way.

  ### Part 4: A Better Analogy

  If the Jury analogy is a "backward-looking, binary, binding, fact-finding" model, and the Assembly is a "forward-looking, open-ended, advisory, value-judgment" body, what fits better?

  **The Hospital Ethics Committee.**

  Here is why this mapping is superior for your organizing work:

  1.  **Composition:** Like an Assembly, an Ethics Board is a mix of laypeople (community reps) and experts (doctors, lawyers), but the *decision-making weight* rests on the collective judgment of the board, not just the doctors.
  2.  **The Task:** They do not decide facts (is the patient sick?). They decide **values** (do we continue life support? how do we allocate scarce organs?). This matches policy trade-offs better than legal verdicts.
  3.  **The Process:** They hear expert testimony (medical prognosis), deliberate, and seek consensus. It is not adversarial; it is collaborative problem-solving.
  4.  **The Authority:** Their decisions are usually **advisory** to the attending physicians or hospital administration, but they carry immense moral weight. Administrators rarely ignore them without cause. This matches the Assembly's relationship with Parliament better than a Jury's relationship with the State.
  5.  **The Stakes:** High stakes (life/death), similar to policy, but without the "beyond reasonable doubt" asymmetry. They must weigh the cost of action vs. inaction.

  **How to use this in your committee:**
  Tell your colleague: *"The Jury analogy gets us through the door on selection, but it sets us up for failure on expectations. A Jury decides what happened; an Assembly decides what to do. We aren't a court; we're more like a **Public Ethics Board**. We aren't looking for a verdict; we're looking for a prescription. That means we need to be clearer about how we curate experts (the doctors) and how Parliament (the administration) commits to responding to our recommendations."*

  This shifts the conversation from "Are they trustworthy?" (which the jury analogy answers too simply) to "How do we structure the process to ensure quality?" (which is the actual work you need to do).
