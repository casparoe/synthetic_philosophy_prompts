prompt: |-
  so i'm on the organizng committee for a citizens' assembly we're trying to get off the ground, and one of the other organizers keeps making this argument and i cant tell if it's clever or cheap: a citizens' assembly is basically just a jury. you pick people at random off the rolls, they're ordinary folks and not experts in anything, they sit through the arguments, they deliberate, they reach a decision. and we already let a jury decide whether somebody spends the rest of their life in prison, so anyone who says a bunch of randomly selected people can't be trusted with something as big as policy has some explaining to do. that last step is doing all the work, obviously.

  i want to believe it but it feels like it's smuggling something. can you lay it out for me? first the correspondence table -- what in a jury plays the role of what in an assembly, feature by feature -- and then where the mapping actually breaks down. im especially interested in the stuff the jury picture quietly imports that an assembly just doesnt have: whatever the judge is doing when she instructs them on the law, whatever the two adversarial sides are doing, the fact that a verdict is binding and final while a recommendation is advisory, the beyond reasonable doubt asymmetry where it's better to acquit a guilty person than convict an innocent one, the fact that a jury is handed a well-posed question with a fixed menu of answers, that sort of thing. then the payoff: if the analogy is what's carrying the claim that assemblies are trustworthy with policy, does that claim survive once the disanalogies are on the table, or was the analogy doing the whole job and now theres nothing left? and if there's a comparison that fits what an assembly actually is better than a jury does, tell me what it is.
