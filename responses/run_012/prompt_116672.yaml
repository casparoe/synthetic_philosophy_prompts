      *   *Expertise:* Laypeople (Jury) $\leftrightarrow$ Laypeople + Experts (CA). (CA involves learning phase).
      *   *Process:* Trial (Jury) $\leftrightarrow$ Learning/Deliberation (CA).
      *   *Facilitation:* Judge (Jury) $\leftrightarrow$ Facilitators/Secretariat (CA).
      *   *Output:* Verdict (Guilty/Not) (Jury) $\leftrightarrow$ Recommendations/Report (CA).
      *   *Authority:* Binding (Jury) $\leftrightarrow$ Advisory (CA).

  4.  **Identifying the Breakdowns (The "Smuggling"):**
      *   *The Judge's Role:* In a trial, the judge filters evidence (rules of evidence) and instructs on law. In a CA, experts are curated by a steering committee. Who curates the curators? This is a political choice, not a procedural safeguard in the same way.
      *   *Adversarial vs. Consensus:* Juries hear two sides fighting. CAs hear multiple experts aiming for consensus. The "truth" in a trial is procedural (who won the argument); in a CA, it's supposed to be substantive (what is the best policy).
      *   *Standard of Proof:* "Beyond Reasonable Doubt" creates a high bar for *action* (conviction). Policy often requires balancing trade-offs where *inaction* also has costs. There's no "innocent until proven guilty" for tax policy.
      *   *Question Structure:* Juries get "Did X do Y?" (Binary/Restricted). CAs get "How should we solve Z?" (Open-ended/Complex).
      *   *Binding Power:* Jury verdicts are enforced by the state. CA recommendations can be ignored by parliament. This affects the *stakes* and the *seriousness* of deliberation.
      *   *Secrecy vs. Transparency:* Juries deliberate in secret to protect them from influence. CAs often deliberate in public (or partially public) to build trust.

  5.  **Evaluating the Payoff (Trustworthiness):**
      *   Does the analogy hold up? The jury analogy borrows *institutional legitimacy* (we trust juries with life/liberty) and transfers it to *policy competence*.
