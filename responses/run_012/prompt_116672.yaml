  2.  **Deconstruct the "CA = Jury" Analogy:**
      *   *Core Similarity:* Sortition (random selection), laypeople, deliberation, decision-making.
      *   *Core Difference:* Scope (specific case vs. broad policy), Process (adversarial vs. evidence-based/learning), Outcome (binding verdict vs. advisory recommendation), Structure (binary/limited vs. open-ended).

  3.  **Drafting the Correspondence Table:**
