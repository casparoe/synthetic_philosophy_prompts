      *   *Fatal:* (b) The Dynamics/Learning Problem. If the theory cannot model the *acquisition* of logical knowledge, it fails to explain the primary phenomenon of epistemology (coming to know). The "Knowing-How" angle is a specific, sharp instance of this.
      *   *Serious:* (d) The Probabilistic/Bounded Counterexample. If coherent rationality doesn't require omniscience (e.g., Garber's solution to old evidence, or hintikka's defenses), then the "incoherent or change of subject" claim is false.
