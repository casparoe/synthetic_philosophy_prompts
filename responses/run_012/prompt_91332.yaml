prompt: |-
  I'm trying to settle a dispute from my philosophy of mind reading group, and I need the argument adjudicated rather than restated.

  A friend claims that the familiar four-grade taxonomy of minds collapses under its own weight. He sets it up as follows. A Darwinian creature learns nothing within its own lifetime; its behavioral repertoire is fixed by natural selection, so trial and error happens only across generations, as lineages are winnowed. A Skinnerian creature learns within its lifetime by operant conditioning, emitting behaviors that are shaped by their consequences, so trial and error happens at the scale of the individual, in the world. A Popperian creature can represent candidate actions or hypotheses internally and test them offline, letting the hypothesis die in its stead, so trial and error happens inside the creature, before it acts. A Gregorian creature bootstraps its own cognition with external tools and culturally transmitted representations—notations, procedures, devices—so that it can improve not just what it knows but how it comes to know it.

  His argument runs:

  (1) A creature is Gregorian only if it can use a mind-tool to improve its own cognition.

  (2) To use a mind-tool competently, a creature must represent how the tool works and anticipate its effect before relying on it. That is precisely the Popperian capacity to test a representation offline. So nothing is Gregorian unless it is already Popperian.

  (3) But when a creature uses a mind-tool, the tool carries the cognitive load. Someone doing long division on paper is not performing the arithmetic; the marks and the algorithm do that, and the person merely moves the marks. Remove the props and no residual capacity remains that deserves the name "Gregorian."

  (4) So a Gregorian creature is a Popperian creature plus external props, and the props are not part of the creature. A grade defined by its equipment is no grade of mind at all.

  (5) The same move recurses. The Popperian's internal representations are themselves props—physical states that the underlying machinery operates on—so a Popperian is a Skinnerian device plus internal props. And the Skinnerian's emitted behaviors are just the phenotypes that selection winnows, so a Skinnerian is a Darwinian system plus within-lifetime variation.

  (6) Every grade is therefore the grade below it plus props, and props do not make kinds. There is one kind of mind—a selection machine—wearing different amounts of equipment, and the four-grade taxonomy is a distinction without a difference.

  (7) That cannot be the whole story, because the grades earn their keep precisely by predicting qualitative differences: a Popperian can survive a novel environment that would kill a Skinnerian on its first attempt, and a Gregorian can pass an improvement to the next generation without any change in the genome, which a Popperian cannot. If the grades are one kind in different dress, those differences have no explanation.

  (8) So some step is defective.

  Which step do I give up, and what does giving it up cost? I would rather keep the taxonomy's explanatory work than the reduction, but I don't want to keep it by fiat.
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **Task:** Adjudicate a philosophical dispute about Dennett's four-grade taxonomy of minds (Darwinian, Skinnerian, Popperian, Gregorian).
      *   **Constraint:** Do not merely restate the argument; provide a verdict on which step to reject and the costs involved.
      *   **User's Preference:** Keep the taxonomy's explanatory power rather than the reductionist critique, but not by fiat (needs philosophical justification).
      *   **The Friend's Argument:** A reductionist argument claiming the taxonomy collapses because each higher grade is just the lower grade plus "props" (tools/representations), and props aren't part of the mind/kind. Therefore, there's only one kind of mind (selection machine), making the taxonomy a distinction without a difference. However, the friend admits the taxonomy *does* explain qualitative differences (Premise 7), creating a contradiction (Premise 8).

  2.  **Deconstruct the Friend's Argument:**
      *   *Premise 1:* Definition of Gregorian (using mind-tools).
      *   *Premise 2:* Gregorian requires Popperian capacity (representing the tool's effect). -> *Gregorian implies Popperian.*
      *   *Premise 3:* The tool does the work, not the creature. Without props, no residual capacity. -> *Gregorian is just Popperian + external props.*
      *   *Premise 4:* Props aren't part of the creature/mind. -> *Gregorian isn't a distinct kind of mind.*
      *   *Premise 5:* Recursion. Internal representations are props too. Popperian = Skinnerian + internal props. Skinnerian = Darwinian + within-lifetime variation.
      *   *Premise 6:* Conclusion: All grades are just "selection machine + equipment." No distinct kinds.
      *   *Premise 7:* Counter-observation: The grades *do* predict real qualitative differences (survival in novelty, cultural transmission).
      *   *Premise 8:* Contradiction detected. Something must give.

  3.  **Evaluate the Weak Points:**
      *   *Step 3 & 4 (The "Props" Argument):* This is the crux. The claim that "the marks do the arithmetic, not the person" and "props are not part of the creature" is the most vulnerable. This relies on a strict internalism about the mind/cognitive system.
      *   *Step 5 (The Recursion):* This equates internal representations with external tools in a way that ignores the *integration* difference.
      *   *Step 6 (The Reduction):* This assumes that if $B = A + X$, and $X$ is "equipment," then $B$ isn't a new *kind*. But in biology and engineering, adding equipment often creates a new functional kind (e.g., a bird vs. a plane? No, better: a leg vs. a wheel).
      *   *Step 2 (The Dependency):* Does Gregorian *strictly* require Popperian? Maybe, but that doesn't collapse the distinction if the *combination* creates a new emergent capacity.

  4.  **Identify the Best Step to Reject:**
      *   The user wants to save the taxonomy. Therefore, I must attack the reductionist move.
      *   **Step 4** is the primary target. "A grade defined by its equipment is no grade of mind at all." This is the philosophical weak link. It assumes a boundary between "mind" and "tool" that extended cognition theorists (and Dennett himself) would reject.
      *   **Step 3** is also vulnerable. "Remove the props and no residual capacity remains." This is empirically dubious. Learning to use a tool changes the brain (neuroplasticity). A literate brain is structurally different from an illiterate one.
      *   **Step 6** is the conclusion derived from 3 & 4. If 4 falls, 6 falls.

  5.  **Formulate the Adjudication:**
      *   **Verdict:** Reject Step 4 (and consequently Step 3's implication).
      *   **Reasoning:** The definition of "mind" or "cognitive system" should not be restricted to the skull/skin (Internalism). The "equipment" becomes functionally integrated.
      *   **Philosophical Backing:** Extended Cognition (Clark & Chalmers), Dennett's own functionalism, the concept of *scaffolding*.
      *   **Addressing the Cost:** What do we lose by rejecting Step 4? We lose the neat boundary of the individual organism. We accept that minds are leaky and distributed. This makes "mind" harder to locate but better explains the phenomena.
      *   **Addressing Step 5 (Recursion):** Why doesn't this destroy the lower grades? Because internal representations are *causally coupled* in a way external tools aren't initially, but Gregorian tools become coupled through learning. The distinction is about the *locus of control* and *evolutionary history* of the structure, not just "stuff."
      *   **Addressing Step 7:** Saving the taxonomy preserves the explanatory power regarding novelty and cultural transmission.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, is Step 2 also problematic?* The friend argues Gregorian *requires* Popperian. Dennett might agree. But the friend uses this to say Gregorian isn't *distinct*. I need to argue that $A + B$ can be a new kind even if it contains $A$. (Emergence).
      *   *Focus on Step 4:* The claim "props are not part of the creature" is the dogmatic assertion. In biology, an organism's niche is part of its evolutionary story. In cognition, the tool becomes part of the cognitive loop.
      *   *The "Residual Capacity" claim (Step 3):* This is factually weak. If you teach someone long division, their brain changes. They aren't the same Skinnerian/Popperian device they were before. The "props" rewrite the hardware.
      *   *The "Kind" argument (Step 6):* Functional kinds are defined by capacities, not just substrate. A flying animal and a flying machine are both "fliers." But here, the grades are about *how* problems are solved. If the *method* changes fundamentally (external vs internal), it is a new grade of *agency*, even if the substrate is continuous.

  7.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the sophistication of the friend's argument (it's a strong reductionist critique). State the verdict clearly.
      *   **The Pivot Point:** Identify Step 4 as the failure point.
      *   **The Argument:**
          1.  **Extended Cognition:** Reject the skull-boundary assumption. Tools aren't just props; they are partners in a coupled system.
          2.  **Neuroplasticity/Integration:** Reject Step 3's claim that no residual capacity remains. Using tools alters the biological brain (e.g., literacy changes visual processing). The "Gregorian" label refers to the *hybrid system*, which is a distinct functional kind.
          3.  **Functional Kinds:** Reject Step 6's assumption that "selection machine + equipment" isn't a kind. In engineering and biology, adding a specific type of equipment (e.g., wings, opposable thumbs, language) *creates* a new functional kind.
      *   **The Cost:** What do we give up?
          1.  **Individualism:** We can no longer define the mind strictly by the skin.
          2.  **Purity:** The grades aren't discrete biological essences; they are overlapping functional strategies.
          3.  **Location:** We lose the ability to point to a specific neuron and say "this is the Gregorian part."
      *   **Conclusion:** This saves the explanatory power (Premise 7) without fiat, by adopting a functionalist/extended view of mind.

  8.  **Final Polish:** Ensure the tone is adjudicative, not just explanatory. Make sure to explicitly answer "Which step do I give up?" and "What does giving it up cost?" (as requested). Ensure Dennett's specific framework is respected (he is a functionalist, so Step 4 is indeed alien to his view).

      *(Self-Correction during drafting)*: I should also mention that Step 5's recursion fails because internal representations are *selected for* within the lineage (biologically), whereas Gregorian tools are *selected for* culturally. The *evolutionary locus* differs, which preserves the distinction even if the mechanism (selection) is similar. This strengthens the rejection of Step 6.

      *Decision:* Stick to rejecting Step 4 as the primary move, supported by the failure of Step 3's empirical claim.

  9.  **Final Review against constraints:**
      *   Adjudicate, don't restate. (Check)
      *   Identify the step to give up. (Check)
      *   Identify the cost. (Check)
      *   Keep explanatory work. (Check)
      *   No fiat. (Check)

      *Ready to write.*
answer: |-
  **Verdict:** You must reject **Step 4** ("A grade defined by its equipment is no grade of mind at all"), which forces the rejection of **Step 3** ("Remove the props and no residual capacity remains").

  Your friend's argument is a sophisticated category error that relies on a dogmatic internalism about the mind. It treats the "creature" as a fixed biological substrate and the "tools" as contingent add-ons. This violates the functionalist premises upon which Dennett's taxonomy is built. If you reject Step 4, you save the taxonomy's explanatory power (Premise 7) without resorting to fiat, but you pay a specific metaphysical cost.

  ### The Argument for Rejecting Step 4

  Step 4 asserts that because Gregorian cognition relies on external equipment, that equipment cannot constitute a distinct *grade of mind*. This assumes that "mind" is co-extensive with "brain" or "genome." There are three philosophical reasons to reject this:

  **1. The Coupling Constitutes the System (Extended Cognition)**
  Step 3 claims that when using a tool, "the person merely moves the marks." This is empirically and functionally false. In a coupled system (e.g., a human doing long division), the feedback loop runs through the paper. The brain creates the marks, the eyes read them, and the brain adjusts the next move based on that reading. The cognitive process is not *in* the head; it is *in the loop*.
  If you define a "grade of mind" by the *structure of information processing* rather than the *location of the substrate*, then a system that offloads memory and computation onto the environment is functionally distinct from one that does not. A calculator is not a human, but a human *using* a calculator is a new functional kind of problem-solver. Step 4 fails because it privileges the skin as the boundary of the mind without justification.

  **2. Tools Rewrite the Hardware (Neuroplasticity)**
  Step 3 claims that if you remove the props, "no residual capacity remains." This is neurobiologically incorrect. Acquiring Gregorian tools (like literacy, numeracy, or scientific method) physically alters the brain. A literate brain processes visual information differently than an illiterate one; it repurposes the visual word form area.
  Therefore, the Gregorian creature is not merely a Popperian creature *holding* a prop. It is a Popperian creature whose internal architecture has been reconfigured *by* the prop to accommodate the prop. The "equipment" becomes internalized. The distinction is not just about what the creature is holding; it is about what the creature has become through the history of using those tools.

  **3. Functional Kinds are Defined by Capacities, Not Substrates**
  Step 6 argues that "selection machine + equipment" is not a new kind. But in biology and engineering, adding specific equipment *is* how new kinds arise. A bird is a dinosaur with wings. Is a bird just a "dinosaur plus equipment"? Technically, yes. But does that mean "bird" is not a valid functional category? No. The equipment (wings) enables a new mode of existence (flight) that warrants a new classification.
  Similarly, the Gregorian "equipment" (culture, language, notation) enables a new mode of existence (cumulative cultural evolution) that warrants a new classification. To deny this is to deny the validity of functional taxonomy altogether.

  ### The Cost of This Verdict

  Rejecting Step 4 saves the taxonomy, but it is not free. You must accept the following costs:

  **1. The Loss of Individualism**
  You can no longer locate the mind strictly within the skull. If the Gregorian grade is real, then the "mind" is a distributed system that includes the environment. This makes the mind "leaky." It complicates moral and legal responsibility (if the tool is part of the mind, is a failure of the tool a failure of the mind?) and makes the boundaries of the self porous.

  **2. The Loss of Discrete Boundaries**
  Your friend's reductionism offers a clean, continuous spectrum (one kind of machine, varying equipment). By rejecting it, you must admit that the grades are not discrete biological essences. There is no "Gregorian gene." The transition from Popperian to Gregorian is a gradient of integration. You save the *utility* of the categories, but you lose the *precision* of natural kinds. You are defending a pragmatic taxonomy, not an ontological one.

  **3. The Recursion Threat (Addressing Step 5)**
  You must explain why the recursion in Step 5 doesn't destroy the lower grades. If internal representations are just "internal props," why is Popperian distinct from Skinnerian?
  *The Cost:* You must argue that internal representations are *causally coupled* differently than external tools. Internal representations are selected for by the genome (Darwinian), whereas Gregorian tools are selected for by culture (Gregorian). You must maintain a distinction between *biological evolution* and *cultural evolution* as distinct design processes. If you blur that line too much, the friend's reductionism returns. You pay the cost of having to defend a dual-evolutionary framework.

  ### Conclusion

  Your friend's argument is a reductio ad absurdum of **internalism**, not of Dennett's taxonomy.

  *   **Give up:** Step 4 (and the internalist assumption underlying Step 3).
  *   **Keep:** The taxonomy as a functional classification of *systems* (organism + environment), not just organisms.
  *   **Cost:** You must accept that minds are distributed, boundaries are porous, and the "grades" are pragmatic functional clusters rather than discrete biological essences.

  This preserves the explanatory work (Premise 7) because it acknowledges that the *system* of a Gregorian creature (brain + culture) has capacities the *system* of a Popperian creature (brain only) does not, without requiring a magical new substance. The difference is real, but it is a difference in organization and coupling, not in the fundamental stuff of the universe.
