  # Session Plan: The Predictor's Paradox
  **Facilitator:** You (Journalist)
  **Duration:** 90 Minutes
  **Attendees:** 25 Educated Laypeople
  **Goal:** Experiential understanding of the clash between Causal and Evidential/Functional reasoning under perfect prediction.

  ## 1. Materials & Setup
  *   **Currency:** 500 "Festival Chips" (poker chips or printed tokens). Value: 1 Chip = 1 Unit.
  *   **Envelopes:** 50 small envelopes (25 marked "Heads", 25 marked "Tails" for Game 1; 25 "Termites", 25 "Safe" for Game 2).
  *   **Commitment Cards:** 50 index cards with two checkboxes: `[ ] I WILL PAY` / `[ ] I WILL REFUSE`.
  *   **Choice Slips:** 50 small slips of paper for the final "Override" decision.
  *   **Whiteboard:** For tracking aggregate scores.
  *   **Prize:** A tangible reward for the top scorer (e.g., a hardcover science book or a gift card) to incentivize caring about the chip count.
  *   **Room:** Chairs arranged in a semi-circle. A "Bank" table at the front.

  ## 2. The Rules of Engagement (Read Aloud at Start)
  1.  **I am the Predictor.** In this room, my predictions are never wrong. How? Because your "Prediction" is your **Pre-Commitment**. What you write on your Commitment Card *is* what I predicted you would do.
  2.  **The Payoff.** You start with 100 Chips. Your goal is to finish with the most Chips.
  3.  **The Silence.** During decision phases, no talking. You are isolated agents.
  4.  **The Override.** At a specific moment, I will allow you to change your mind. This is where the game gets real.

  ---

  ## 3. Minute-by-Minute Timeline

  ### 0:00 – 0:10 | Introduction & Stakes
  *   **Welcome:** Briefly introduce yourself. State the goal: "We are going to play two games about choice. There are no right answers yet, only payouts."
  *   **Distribution:** Hand out 100 Chips and a "Player ID" to each attendee.
  *   **The Promise:** Explain that at the end, the person with the most chips wins the prize. This makes the fake money feel heavy.

  ### 0:10 – 0:40 | Game 1: The Coin Flip (Counterfactual Mugging)
  *   **The Setup (5 mins):**
      *   Explain the scenario: "A fair coin is flipped. If **Heads**, I ask you for 10 Chips. If **Tails**, I give you 1,000 Chips—but *only if* I predicted you would have paid in the Heads case."
      *   Emphasize: "I am a perfect predictor. I know what you will do before the coin lands."
  *   **Phase 1: The Commitment (5 mins):**
      *   Hand out **Commitment Cards**.
      *   Instruction: "Write down what you *would* do if I asked you for 10 Chips. Check 'Pay' or 'Refuse'. Seal this in an envelope labeled 'Prediction'. Give it to me."
      *   *Facilitator Note:* Collect these. This simulates the "Perfect Prediction."
  *   **Phase 2: The Reality (5 mins):**
      *   Hand out the **Coin Envelopes** (randomly distributed: 12 Heads, 13 Tails).
      *   Instruction: "Open your envelope. Do not show anyone. This is the reality you are in."
  *   **Phase 3: The Choice & The Override (10 mins):**
      *   **Heads Group:** "The coin is Heads. I am asking for 10 Chips. Look at your Commitment Card. You *can* follow it, OR you can write a new decision on this **Choice Slip**."
      *   **Tails Group:** "The coin is Tails. You do nothing. Wait."
      *   *The Trap:* Most Heads players will feel the Causal pull: "The Tails money is already decided by my Commitment Card. Why actually pay 10 Chips now? It changes nothing."
      *   Collect the Chips (from those who pay) and the Choice Slips.
  *   **Phase 4: The Reveal (5 mins):**
      *   **Tails Group:** Open your "Prediction" envelopes. If it says 'Pay', you get 1,000 Chips. If 'Refuse', you get 0.
      *   **Heads Group:** Reveal your Choice Slips.
      *   **Scoring:** Tally the scores on the whiteboard.
      *   *Expected Outcome:* The "Pay" committers (Tails) will have ~1,100 Chips. The "Refuse" committers (Tails) will have 100. The Heads players who "Overrode" (Refused to pay despite committing) will feel smart (saved 10 chips) but will see the Tails group's disparity.
      *   *Facilitator Silence:* Do not explain *why* yet. Just let them see the numbers. Ask: "How do the Heads players feel? How do the Tails players feel?"

  ### 0:40 – 1:10 | Game 2: The Termite Infestation (Logical Uncertainty)
  *   **The Setup (5 mins):**
      *   Reset chips (everyone back to 100 to clear bias).
      *   Explain the scenario: "There may be termites in your house. Infestation costs 1,000 Chips. I send you a **Message** if and only if: (You have Termites AND you won't Pay) OR (You are Safe AND you will Pay)."
      *   Simplify on Whiteboard:
          *   Termites + No Pay = **Message**
          *   Safe + Pay = **Message**
          *   Termites + Pay = **No Message**
          *   Safe + No Pay = **No Message**
      *   "If you receive a Message, you can Pay 10 Chips to 'verify' your status. If you have Termites and don't Pay, you lose 1,000 Chips."
  *   **Phase 1: The Commitment (5 mins):**
      *   Hand out **Commitment Cards**: "If I receive a Message, I WILL PAY 10 / I WILL REFUSE."
      *   Collect in "Prediction" envelopes.
  *   **Phase 2: The World & The Message (10 mins):**
      *   Hand out **World Cards** (50% Termites, 50% Safe).
      *   **You (The Predictor)** process the Messages.
      *   *Mechanic:* You walk around. If their World Card + Commitment Card matches the "Message" condition, hand them a Red Card (Message). If not, hand them a Blue Card (No Message).
      *   *Crucial:* Most people will get a Red Card (Message).
  *   **Phase 3: The Choice & The Override (10 mins):**
      *   Instruction: "If you have a Red Card (Message), you must decide: Pay 10 Chips or Not? You may override your Commitment Card."
      *   *The Trap:* CDT Reasoning: "The Message is already in my hand. The termites are already there or not. Paying 10 Chips doesn't remove termites. It's a sunk cost."
      *   Collect Chips and Choice Slips.
  *   **Phase 4: The Reveal (10 mins):**
      *   Reveal World Cards.
      *   **Termites + No Pay:** Lose 1,000 Chips.
      *   **Termites + Pay:** Lose 10 Chips.
      *   **Safe + Pay:** Lose 10 Chips.
      *   **Safe + No Pay:** Lose 0 Chips.
      *   *Tally Scores:* Compare the "Override" group vs. the "Commitment" group.
      *   *Expected Outcome:* Those who honored "Pay" (even if Safe) avoid the catastrophic Termite loss. Those who reasoned "My choice can't change the termites" (CDT) and refused to pay will disproportionately be the ones with Termites (because the Predictor only sent the Message to Termite-havers who wouldn't pay).

  ### 1:10 – 1:30 | The Debrief: Mapping the Clash
  *   **Step 1: The Two Voices (10 mins):**
      *   Ask the room: "In Game 1, Heads players, why did you refuse to pay?"
      *   *Write on Board:* "My choice happens *after* the coin. It can't change the past." (Label this **Voice A**).
      *   Ask: "Tails players, why did you want the Heads players to pay?"
      *   *Write on Board:* "Your choice tells me which world I'm in. If you pay, I'm in the winning world." (Label this **Voice B**).
  *   **Step 2: Naming the Theories (5 mins):**
      *   Reveal: "Voice A is **Causal Decision Theory**. It asks: *What does my action cause?* Since paying doesn't cause the coin to be Tails, don't pay."
      *   Reveal: "Voice B is **Evidential (or Functional) Decision Theory**. It asks: *What does my action reveal?* Paying is evidence that I am the type of person who gets the reward."
  *   **Step 3: The Limitation (5 mins):**
      *   **Honesty Check:** "In this game, I used your Commitment Card as the prediction. In the real philosophical puzzle, the Predictor knows *before* you write the card. It feels more magical. The game simplifies the 'magic' into a 'promise.' But the logical tension is identical: Do you act to change the world, or to align yourself with the good world?"
      *   **AI Connection:** "Why does this matter for AI? Because we have to program AI to be Voice A or Voice B. If an AI is Voice A, it might fail to cooperate in high-stakes scenarios. If Voice B, it might act 'magically.' We need to know which one makes better decisions."
  *   **Step 4: Closing:** Award the prize. Thank them.

  ---

  ## 4. Predictable Failures & Mitigations

  | Failure Mode | Why it Happens | Mitigation |
  | :--- | :--- | :--- |
  | **The "It's Just a Game" Effect** | Participants treat chips as meaningless, so they choose randomly or altruistically, masking the dilemma. | **Incentivize:** Make the prize desirable. **Shame/ Glory:** Publicly announce the top 3 scores. |
  | **Confusion on Termite Logic** | The XOR (Message iff Termites XOR Pay) is cognitively demanding. | **Visual Aid:** Keep the 4-quadrant table on the whiteboard throughout Game 2. Walk through one example explicitly before starting. |
  | **The "Liar" Accusation** | Participants claim you couldn't possibly have predicted them perfectly in Game 2. | **Pre-empt:** Remind them: "In this simulation, your Commitment Card *is* the prediction. I am not reading your mind; I am grading your consistency." |
  | **Collusion** | Participants discuss strategies during the "Silence" phase. | **Enforce:** Warn that talking disqualifies them from the prize. Walk around during the decision phase. |
  | **CDT Dominance** | Everyone follows Voice A (Causal), so there is no clash to observe. | **Highlight the Loss:** In the debrief, explicitly calculate the *Expected Value* they lost by following Voice A. Show the "Opportunity Cost." |

  ---

  ## 5. Honest Limitation Assessment
  **What the Activity Cannot Reproduce:**
  The activity relies on **Pre-Commitment** to simulate **Prediction**.
  *   **In the Game:** The prediction is created *by* the participant writing the card. It feels like a promise.
  *   **In the Puzzle:** The prediction exists *before* the participant enters the room (e.g., a brain scan or simulation).
  *   **The Gap:** In the game, the "Causal" objection is weaker because participants feel they *made* the prediction. In the true philosophical puzzle, the prediction is a *fact of the past* that cannot be influenced by a promise.
  *   **Your Job in Debrief:** You must explicitly state: "In the real puzzle, you can't write a card. The prediction is already locked in stone before you walk in. That makes Voice A (Causal) feel much stronger: 'How can my choice now change a fact from yesterday?' The game softens this by making the prediction depend on your written promise. But the mathematical structure of the payout remains the same."

  ## 6. Facilitator Script Snippets (For Tone)
  *   *When collecting Commitment Cards:* "Seal it tight. This is your source code. This is who you are."
  *   *During the Override:* "You are alone now. The envelope is sealed. No one will know if you break your promise except you... and the payout."
  *   *During Debrief:* "Did you feel a physical tension? A voice saying 'It's pointless' and another saying 'It's necessary'? That tension is the frontier of AI safety."

