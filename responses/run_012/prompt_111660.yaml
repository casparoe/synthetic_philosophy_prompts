answer: |-
  This is a remarkably clean way to approach moral philosophy. You have effectively performed a "code review" on your own intuition.

  You asked for honesty over tidiness. Here is the diagnosis: Your two-clause rule is a strong refactor, but it throws an exception on three of your nine test cases. Furthermore, your suspicion is correct: you are running two distinct ethical engines in parallel. Trying to compile them into a single binary function is causing the logical tension you feel in cases 5, 7, and 8.

  Here is the breakdown of your rule against your test cases, followed by the proposed separation of concerns.

  ### 1. Running the Unit Tests against Your Rule

  **Your Rule:**
  *   **Clause A (Justice):** Return if chain of title runs through an unreal transfer (force, threat, severe asymmetry).
  *   **Clause B (Ontology):** Return if the object is inalienable (physical handover doesn't sever belonging).
  *   **Default:** Keep if real consent + alienable.

  **The Results:**

  *   **Cases 1, 2, 3 (Parthenon, Benin, Nazi Art):** **PASS.** These are clear hits on Clause A. Case 1 also triggers Clause B (emblem of history).
  *   **Case 4 (Human Remains):** **PASS.** This is a pure Clause B hit. Your intuition that "provenance isn't the issue" is correct; this falls under *inalienable possession*.
  *   **Case 5 (The Gift):** **PASS (technically), but unstable.** Your rule classifies this as "real consent + alienable." However, you noted you can't defend the difference from Case 1. Under Clause A, "severe asymmetry" is the variable. If Imperial Britain in the 1920s counts as "severe asymmetry," Case 5 should return. If it doesn't, Case 1 is vulnerable. Your rule relies on a threshold you haven't defined.
  *   **Case 6 (Community vs. State):** **FAIL.** Your rule assumes "The Group" is a monolithic entity capable of giving consent or holding inalienable rights. It has no logic for internal sovereignty disputes. It cannot distinguish between a State and a Community.
  *   **Case 7 (Digital):** **PASS.** Implied by Clause B. If the object is inalienable, a copy is insufficient.
  *   **Case 8 (Preservation Risk):** **PASS (Verdict), FAIL (Logic).** The verdict matches Clause A/B (Return anyway). But you noted the tension with Case 7. In Case 7, you argue *physical presence* is vital. In Case 8, you argue *physical safety* is irrelevant. This suggests your rule prioritizes *Justice* (Case 8) over *Utility* (Preservation), but you are worried that prioritizing Justice undermines the *Ontology* (Case 7, where the object's physical reality matters).
  *   **Case 9 (Pre-colonial Booty):** **FAIL.** Your rule looks at the transfer *into* the European collection. It does not account for the status of the object *before* that transfer. If the Benin Kingdom stole it via "unreal transfer" (force), does the British Museum inherit that taint? Or does the British theft reset the clock? Your rule is silent on historical depth.

  ### 2. The "Two Questions" Hypothesis

  You suspected you are conflating **Undoing a Wrong** (Corrective Justice) and **Putting Things Back Where They Belong** (Cultural Sovereignty/Ontology).

  You are right. Separating them resolves the tensions in Cases 5, 7, and 8.

  **Stream 1: Corrective Justice (The "Clean Hands" Doctrine)**
  *   **Principle:** Possession is illegitimate if the acquisition involved force, duress, or systemic coercion that negates consent.
  *   **Handles:** Cases 2 (Benin), 3 (Nazi), 8 (Preservation Risk).
  *   **Logic:** A thief cannot retain stolen property because they can care for it better. The moral taint of the acquisition overrides utilitarian arguments about preservation.
  *   **Resolution to Tension:** This explains why Case 8 (Return despite risk) is valid. It is a penalty for the initial wrong.

  **Stream 2: Cultural Sovereignty (The "Inalienable" Doctrine)**
  *   **Principle:** Certain objects are not property; they are constituents of a people's identity or kinship. They cannot be alienated, regardless of the "fairness" of the transaction.
  *   **Handles:** Cases 1 (Parthenon), 4 (Remains), 7 (Digital).
  *   **Logic:** The Parthenon marbles aren't just stone; they are part of a building that is part of a national narrative. Human remains are ancestors, not artifacts.
  *   **Resolution to Tension:** This explains why Case 7 (Digital is not enough) is valid. It's not about information access; it's about ontological presence.

  **Where the Conflict Lives (Case 5):**
  *   Under **Stream 1**, the 1920s Gift is suspicious. Imperial asymmetry often negates "real consent."
  *   Under **Stream 2**, if the object was a commodity (alienable) and the ritual transfer was valid, the tie is severed.
  *   **Why you lean Keep:** You are likely weighting Stream 2 higher here. You view the object as alienable property, and the paperwork as sufficient ritual.
  *   **Why you feel uneasy:** You know Stream 1 suggests the "asymmetry" might have voided the consent.

  ### 3. Can We Write a One-Clause Rule?

  To get a one-clause rule, you must sacrifice a verdict.

  **The Unified Rule:** *Return all objects unless there is documented, uncoerced consent from the legitimate sovereign authority of the source community, AND the object is culturally alienable.*

  **The Sacrifice:** To make this work, you must change **Case 5**.
  If you admit that "Imperial Asymmetry" inherently negates "Uncoerced Consent" (Stream 1), then the 1920s Gift must also be returned. You cannot hold that the 1800s Ottoman permit is invalid due to occupation (Case 1) but the 1920s Colonial Gift is valid (Case 5), unless you argue the *degree* of asymmetry changed. If you codify a threshold for asymmetry, you introduce subjectivity.

  Alternatively, you sacrifice **Case 4**. If you treat everything as property law (Stream 1 only), human remains become a property dispute. But you explicitly rejected that ("remains were never property"). So Stream 1 alone fails.

  **Conclusion:** A one-clause rule is not possible without breaking your intuition on Case 4 or Case 5. The two streams are logically distinct.

  ### 4. Running the New Edge Cases

  If we run your new scenarios through the **Two-Stream Model**, here is the output:

  **Case A: No Provenance Records (Plausible but unprovable claim)**
  *   *Stream 1 (Justice):* Fails. You cannot prove the "unreal transfer."
  *   *Stream 2 (Sovereignty):* Succeeds. If the object is *inherently* inalienable (e.g., a sacred idol, human remains), provenance matters less than nature.
  *   *Verdict:* If the object is "ordinary" (pottery, tool), the Museum keeps it (benefit of the doubt). If the object is "inalienable" (remains, sacred icon), it returns. The burden of proof shifts based on the *type* of object.

  **Case B: Source Community wants a Local Museum (not ritual use)**
  *   *Stream 1:* Irrelevant.
  *   *Stream 2:* Strong success. This validates Case 6. "Where they belong" is defined by the community, not the capital. A local museum is often a better fit for "Cultural Sovereignty" than a national capital which may be politically distinct from the ethnic source.
  *   *Verdict:* Return to the local community/museum. This reinforces your Case 6 verdict.

  **Case C: Private Collector (not an institution)**
  *   *Stream 1:* Moral obligation remains. A private individual does not gain moral title from a theft just because they aren't a state actor.
  *   *Stream 2:* Moral obligation remains. The object's relationship to the source community is unchanged by who holds it.
  *   *Verdict:* Return. However, *enforcement* differs. Museums have public charters; private collectors have property rights protected by law. Your rule generates a moral verdict, but acknowledges a legal impasse.

  ### 5. The Honest Assessment

  You asked me to tell you plainly if the framing is confused or if these are a coalition of concerns with no unifying rule.

  **They are a coalition of concerns.**

  There is no single "Grand Unified Theory" of restitution because restitution is not a single phenomenon. It is the intersection of:
  1.  **Property Law:** (Who owns this?)
  2.  **Tort Law:** (Who was wronged?)
  3.  **Human Rights:** (How do we treat the dead/ancestors?)
  4.  **Political Sovereignty:** (Who represents a people?)

  Your intuition is working correctly by refusing to flatten these. The discomfort you feel in Case 5 (Gift) vs Case 1 (Parthenon) is not a bug in your logic; it is the friction between *Property Law* (a gift is a gift) and *Political Sovereignty* (can a subject of an Empire truly gift to the Emperor?).

  **Recommendation:**
  Do not try to merge the two clauses. Refactor your mental model into two functions:

  1.  `is_legitimate_acquisition(transfer_context)` -> Returns False if Force/Threat/Systemic Coercion. (Handles Benin, Nazi, Preservation Risk).
  2.  `is_alienable_object(object_type, cultural_context)` -> Returns False if Remains/Sacred/National Emblem. (Handles Parthenon, Remains, Digital).

  **Logic:**
  ```python
  def should_return(object, context):
      if not is_legitimate_acquisition(context):
          return True # Corrective Justice
      if not is_alienable_object(object, context):
          return True # Cultural Sovereignty
      return False # Default to possession
  ```

  **Why this is better:**
  It isolates the conflict. In Case 5, `is_legitimate_acquisition` is the only function under debate. In Case 4, `is_alienable_object` is the only function that matters. In Case 6, you need a third helper function `get_legitimate_claimant()`, which acknowledges that "Source" is not a primitive data type.

  This structure preserves your verdicts, acknowledges the distinct ethical sources, and allows you to debug specific cases (like the Pre-colonial Booty) by asking: "Does the `is_legitimate_acquisition` check recurse infinitely back in time, or does it snapshot at the moment of colonial contact?" (Most legal systems snapshot at the moment of contact to avoid infinite regress, which might help you resolve Case 9).

  You haven't failed to find a rule; you've successfully identified that the domain model is polymorphic.
