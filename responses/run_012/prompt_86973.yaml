  I'm a TA for a 400-level ethics course and I have alot of exams to get through for the unit on virtue ethics and the situationist critique. The question I wrote was: "In the debate over virtue ethics and situationism, what exactly is the situationist challenge, and how much of virtue ethics does it actually threaten? Distinguish (a) the claim that broad, cross-situationally stable character traits are not empirically supported, (b) the claim that no character traits exist at all, and (c) the claim that virtue ethics as a normative theory is refuted. Use at least one empirical example and assess at least one virtue-ethical reply." I told them in class to use the globalism/localism distinction and to say whether virtue ethics could survive on a localist picture.

  One student, who usually does well, wrote this: "Situationists like Harman and Doris point to Milgram and the Good Samaritan study to argue that behavior is driven more by situation than by character. Harman thinks we should abandon the notion of character traits altogether, and Doris agrees, arguing that people have global traits like honesty or compassion only in very limited domains. The empirical evidence shows that small situational changes, like being in a hurry or hearing a loud noise, can make the difference between helping and not helping. So virtue ethics is in trouble because it is committed to the idea that a virtuous person will act virtuously across situations. Aristotle says virtue is a stable disposition, so if no one has cross-situational stability, no one is virtuous. But virtue ethicists have replied that the situationist experiments test trivial behaviors, not the kinds of commitments that matter. Also, virtue ethics is about what kind of person one should be, not about predicting behavior in lab experiments. A truly virtuous person might be rare, but that doesn't refute the ideal. So the situationist critique shows that most people are not virtuous, but it doesn't show that virtue ethics is false."

