answer: |-
  **Exam Question**

  **Module:** PHIL304 Metaphysics of Social Kinds
  **Section:** B
  **Time Allowed:** 45 Minutes
  **Word Limit:** Approximately 700 words
  **Marks:** 20

  **Question 2**

  During the 2020 pandemic, the UK government published specific lists designating certain occupations as 'key worker' status. This designation determined access to state resources (such as schooling for children) and prioritisation for testing, without altering the material nature of the labour performed.

  Critically assess whether 'key worker' functions as a socially constructed kind in the *constitutive* sense (analogous to Searle on money) or merely in the *causal* sense (analogous to Hacking on human kinds). In your answer, you must:
  1.  Defend a verdict on which form of construction is primary in this case.
  2.  Explain what 'abolishing' the category would entail under each reading, specifically regarding the distinction between withdrawing entitlements and altering the labour market.
  3.  Evaluate whether the top-down imposition of the list by the state violates Searle's requirement for collective acceptance, and whether subsequent lobbying and self-identification (looping effects) alters your metaphysical verdict.

  ***

  **Model Answer**

  The distinction between constitutive and causal social construction is pivotal for analysing the 'key worker' category. Constitutive construction posits that the kind exists *only* in virtue of collective acceptance of a status function (Searle's $X$ counts as $Y$ in context $C$). Causal construction suggests social processes bring the kind into being and shape the individuals falling under it, often via looping effects (Hacking), without necessarily making the kind ontologically dependent on that classification for its existence.

  My verdict is that 'key worker' is primarily a constitutively constructed kind regarding its *status*, though it generates causal effects on *identity*. The labour itself (nursing, delivery, teaching) exists independently of the classification; the material reality of the work is not ontologically dependent on the state list. However, the *status* of 'key worker'—which grants specific deontic powers, such as the right to send children to school—is entirely dependent on the collective acceptance of the government's declaration. Without the institutional framework accepting the designation, the specific entitlements attached to the label cease to exist. Therefore, the kind functions constitutively regarding the rights it confers, even if the underlying labour is causally independent.

  This distinction clarifies what abolishing the category would entail. If the kind is constitutively constructed, abolishing it means withdrawing the status function and its attached entitlements. The schools would close to these children, and testing priority would vanish. The social reality of the *privilege* disappears. Conversely, if one mistakenly views the kind as merely causally constructed regarding the labour itself, one might assume abolition changes the work. It does not. The nurses would still nurse; the drivers would still drive. A purely causal reading risks conflating the social classification with the material substrate. Abolishing the category leaves the labour market exactly where it was, stripping only the institutional powers. This highlights that the 'key worker' kind is ontologically fragile regarding rights, but robust regarding physical labour.

  Regarding Searle's model, a complication arises: the list was handed down by government fiat, not emergent collective acceptance. Searle typically emphasises a bottom-up recognition of status functions. However, in modern institutional contexts, the state often acts as the proxy for collective acceptance. We accept the state's authority to assign status functions (like 'citizen' or 'licensee'). Therefore, the top-down imposition does not necessarily break Searle's model, provided the population accepts the state's authority to make such declarations. If the population rejected the list entirely, the status function would fail, and the entitlements would become unenforceable. Thus, collective acceptance remains a necessary background condition, even if the specific assignment is bureaucratic.

  Finally, does lobbying and self-identification shift this verdict? Here, Hacking's looping effects become relevant. Once the category existed, groups lobbied to be included, and individuals began describing themselves as 'key workers', altering their self-conception and social behaviour. This suggests a causal construction of *identity*. People started acting differently because they were classified. However, this looping does not change the constitutive nature of the *entitlements*. One can identify as a key worker, but without the state's constitutive rule, one lacks the school access. Thus, the case demonstrates a hybrid: the status is constitutive (Searle), dependent on institutional rules; the identity and social behaviour are causally constructed (Hacking), dependent on the feedback loop of classification. The metaphysical verdict must distinguish these layers: the kind is constitutively constructed as an institutional fact, which then triggers causal construction in the behaviour and self-understanding of the agents involved.

  ***

  **Marking Scheme**

  **Total Marks:** 20

  | **Criteria** | **Marks** | **Common Mistake** |
  | :--- | :---: | :--- |
  | **1. Distinction of Construction:** Clearly defines and distinguishes constitutive (ontological dependence) from causal (historical/feedback) construction. | 4 | Conflating the two, or defining construction only as "having social effects". |
  | **2. Verdict on Key Worker:** Defends a clear position on which form applies to the status vs. the labour (e.g., status is constitutive, labour is not). | 4 | Asserting it is "both" without explaining *which aspect* corresponds to which type of construction. |
  | **3. Implications of Abolition:** Correctly identifies that abolition removes entitlements (constitutive) but leaves the material labour unchanged (causal independence). | 4 | Claiming abolishing the category would stop the essential work from happening. |
  | **4. Searle and State Fiat:** Addresses whether top-down imposition violates collective acceptance (e.g., state as proxy for acceptance). | 4 | Assuming state fiat automatically invalidates Searle's model without nuance regarding institutional authority. |
  | **5. Looping and Identity:** Integrates Hacking's looping effects to explain self-identification/lobbying without confusing it with the ontological status of the rights. | 4 | Treating lobbying as proof of constitutive status, rather than as a causal feedback effect on identity. |

  **Differentiation:** A **First** class answer will seamlessly integrate the Searlean and Hackingian frameworks to show how the constitutive status *triggers* the causal looping, whereas a **2:1** will likely treat them as separate, parallel points without explaining the mechanistic link between the institutional fact and the behavioural change.
