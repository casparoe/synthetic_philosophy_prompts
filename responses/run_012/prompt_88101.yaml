prompt: |-
  ok so I'm trying to build a case for a philosophy thing, not real homework, more like a puzzle I want to get right and I keep messing it up. I want a thought experiment about indirect normativity, the idea that instead of hardcoding an AI with our actual values we just tell it to do what we would want if we'd thought about it way harder and knew way more, so we're outsourcing to an idealized version of us. What I want the case to do: two idealized deliberators, both fully informed, both perfectly consistent, neither one missing anything or being sloppy or biased, who still land on opposite answers about what the AI should do for one person. And the only thing seperateing them is the order the relevant considerations got raised in, or how finely the situation was described to them, something that looks like it definately shouldn't matter but does. The disagreement absolutely can't come from one of them being a worse idealization, that's the whole point of the case. So build me the scenario, keep it small, one person and one decision, nothing sci-fi. Then walk through it: what does the defer-to-the-idealization view say the AI should do, what does the just-do-what-the-person-actually-wants view say, and does the framing/order thing actually break either of them. Tell me which feature of the case is really doing the work, is it the framing, the idealization, or just the fact that there's two idealizations instead of one, and what happens if I take that feature out, does it collapse back into the boring version where idealizing is just cleaning up the wants you already had. And then, if you were defending indirect normativity, how would you attack my case so it doesn't count, would you say the two deliberators aren't really both ideal, or that the disagreement is fine and there's no problem at all. Also please no headings or bullet points or bold or tables, just write it out in normal paragraphs like an email, I find that way easier to follow.
