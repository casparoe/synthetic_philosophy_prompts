answer: |-
  Here is the scenario I have constructed for you. Imagine a person named Jordan who has been diagnosed with a chronic condition that will eventually become terminal. Jordan has to make a single decision about whether to undergo a harsh treatment regimen that will extend their life by ten years but significantly reduce their daily cognitive and physical capacity, or to decline the treatment and live a shorter life with higher functioning until the end. We are not looking at what Jordan actually wants right now, because Jordan is scared and confused. We are looking at two idealized versions of Jordan, both of whom have access to all relevant medical facts, psychological data, and philosophical arguments about the value of life. Both are perfectly consistent and free from bias or fatigue. The only difference between them is the starting prompt for their reflection. Deliberator Alpha begins their reflection by considering the question how much life is left, focusing first on the concept of existence and duration. Deliberator Beta begins their reflection by considering the question what kind of life is left, focusing first on the concept of experience and quality. Because values are constructed through reflection rather than simply discovered like facts, the order in which these concepts are elaborated changes the final weighting. Alpha, having built their understanding of value on the foundation of duration, concludes that ten years of diminished capacity is still preferable to non-existence and recommends the treatment. Beta, having built their understanding of value on the foundation of experience, concludes that ten years of diminished capacity is worse than a shorter period of high functioning and recommends declining the treatment. Both have all the same information, and both are perfectly rational, but they arrive at opposite conclusions because the structure of their deliberation was seeded differently.

  Now let us look at what this means for the two views you are comparing. The view that says the AI should defer to the idealized version of us, often called indirect normativity, runs into a immediate roadblock here because there is no single idealized version to defer to. If the AI asks what Jordan would want after ideal reflection, the answer depends entirely on which deliberation path the AI simulates. There is no fact of the matter about which path is the correct one to take, since both deliberators are fully informed and consistent. The view that says the AI should just do what the person actually wants right now, or direct normativity, also struggles but for a different reason. Actual Jordan is conflicted and likely changing their mind day to day, so following actual wants might lead to whiplash or satisfying a temporary fear rather than a deep value. However, direct normativity avoids the paradox of multiple ideals because it only has to track the messy reality of Jordan's current state. The framing and order issue breaks the indirect normativity view specifically because it relies on the assumption that idealization converges on a unique answer. If idealization is path-dependent, then the instruction to do what I would want if I knew more is incomplete without specifying how I came to know it.

  The feature really doing the work in this case is the combination of idealization and multiplicity, specifically the idea that value construction is non-commutative. It is not just the framing in the sense of a linguistic trick, but the structural fact that reflecting on value A before value B yields a different coherent system than reflecting on value B before value A. If you take this feature out, meaning if you assume that all ideal deliberation paths must converge to the same point regardless of starting order, then the case collapses back into the boring version where idealizing is just cleaning up errors. In that boring version, any disagreement between deliberators would prove that at least one of them was not actually ideal, perhaps because they missed a fact or were inconsistent. But in this case, we are stipulating that both are ideal, which forces us to accept that there can be multiple coherent ideal selves. This suggests that values are not hidden treasures waiting to be found by digging deep enough, but rather structures built during the digging, and the shape of the structure depends on where you start digging.

  If I were defending indirect normativity against this case, I would attack the premise that both deliberators are truly ideal. I would argue that a truly ideal deliberator would not just reflect on the medical facts, but would also reflect on the process of their own reflection. A super-idealized Jordan would recognize that their conclusion depends on the order of considerations and would then ask which order is more authentic to their identity. They would step back and evaluate the framing itself. If they cannot resolve which framing is better, then they are not fully informed about their own values. Alternatively, I might argue that the disagreement is fine and there is no problem at all for the AI. I could say that since both outcomes are endorsed by an idealized version of Jordan, the AI is permitted to choose either one, or perhaps flip a coin. The goal of indirect normativity is to avoid violating the person's deep values, and since both options align with some coherent idealized version of Jordan, neither option is a violation. This defense tries to dissolve the paradox by either pushing the idealization one level higher to force convergence or by lowering the stakes so that divergence is acceptable.
