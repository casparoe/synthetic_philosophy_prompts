answer: |-
  Your hypothesis is sharp, and it cuts through the rhetorical smoke that has obscured this debate for thirty years. You suggest the deadlock arises because the field is conflating two distinct questions: the population dynamics of spread (how variants distribute) and the cognitive mechanics of transmission (why representations transform). You locate the equivocation in the term *replicator*.

  Here is my diagnosis of the dispute, testing your hypothesis against the primary texts and modeling commitments of each camp, followed by an assessment of what constitutes progress and where my own analysis might be vulnerable.

  ### Testing Your Hypothesis

  You are largely correct that the term *replicator* is doing too much work, but I would refine your distinction. It is not merely "spread vs. transformation." It is a disagreement about **lineage versus convergence**.

  **The Memetic/DIT Position (Dawkins, Dennett, Boyd, Richerson):**
  For this camp, the causal engine of cultural evolution is the persistence of lineages. Even Boyd and Richerson, who are more flexible than Dawkins regarding fidelity, rely on the assumption that there is a statistical correlation between the trait of the "parent" and the "offspring" sufficient to allow selection to accumulate changes over time. When they use the language of replication, they are making a claim about **heredity**. They argue that even if copying is noisy, as long as the noise is random and the selection pressure is strong, the system behaves *as if* it involves replicators. For them, the question is: *Does the population dynamic mimic natural selection?*

  **The Cognitive Attraction Position (Sperber, Morin):**
  Sperber's objection is ontological and mechanistic. He argues that mental representations are not copied; they are inferred. When I tell you a story, you do not download a file; you reconstruct a meaning based on your own cognitive architecture. Therefore, similarity between my idea and yours is not due to common ancestry (lineage) but to common cognitive design (convergence). For Sperber, the question is: *What stabilizes the representation in the absence of high-fidelity copying?*

  **The Verdict on Your Hypothesis:**
  You hypothesize that this is "two questions under one name." I would argue it is **one phenomenon described at different levels of granularity**, with the conflict arising because each side claims their level is the *causally primary* one.
  *   If you look at the macro-level (population spread), Memetics/DIT wins. The curves look like selection curves.
  *   If you look at the micro-level (cognitive processing), CAT wins. The mechanism is reconstruction, not replication.

  The equivocation on *replicator* is indeed the friction point. Memeticists define it functionally (anything that sustains a lineage); Sperber defines it mechanistically (a structure that is physically copied). Your hypothesis holds: they are talking past each other because one side cares about the *outcome* (evolutionary dynamics) and the other cares about the *process* (cognitive transmission).

  ### Verbal, Substantive, or Empirical?

  This is the crux of the seminar dispute. My diagnosis is that it is a **substantive disagreement disguised as a verbal one, resting on an empirical wager.**

  1.  **Verbal:** If the fight were only about the definition of "Darwinian," it could be solved by stipulation. But it isn't. Sperber isn't just saying "You define Darwinism wrong." He is saying "Your model posits a causal mechanism (copying) that does not exist."
  2.  **Empirical:** The dispute rests on the fidelity threshold. Memeticists wager that human imitation is "good enough" for selection to overcome noise. Sperber wagers that the noise is so high, and the reconstructive bias so strong, that lineage tracking is impossible outside of rigid rituals or technical artifacts.
  3.  **Substantive:** This is the deepest layer. It is about **cumulative culture**. Can reconstructive transmission produce the ratchet effect (Tomasello's term) where modifications accumulate? Memeticists say yes, via selection on variants. Sperber says yes, via attraction to increasingly optimal forms.

  If I must choose, I classify it as **substantive**. The two frameworks posit different causal architectures for cultural stability. One relies on the fidelity of the channel; the other relies on the structure of the receiver.

  ### What Counts as Progress?

  You offer four options. I believe **a formal result showing one framework subsumes the other** is the only path that prevents the seminar from circling forever, but **a demonstration that the two camps are answering different questions** is the most philosophically honest outcome.

  Here is the specific path to progress:

  **1. Abandon the "Replicator" Label:**
  Progress requires adopting the **Price Equation** framework. The Price Equation partitions evolutionary change into a selection term and a transmission term. It does not require "replicators" in the Dawkinsian sense; it requires covariance between parent and offspring traits.
  *   If the covariance is driven by copying fidelity, it's Memetics.
  *   If the covariance is driven by convergent transformation (attraction), it's CAT.
  *   If both contribute, the equation quantifies the ratio.

  **2. Contextual Fidelity Thresholds:**
  We need to stop asking "Is human imitation faithful?" and start asking "Under what conditions is it faithful?"
  Progress looks like a taxonomy:
  *   *High Fidelity:* Technical skills, rituals, written text (Memetics applies).
  *   *Low Fidelity/High Attraction:* Folktales, moral norms, concepts (CAT applies).
  *   *Hybrid:* Language (grammar attracts, vocabulary replicates).

  **3. Dissolving the Rivalry:**
  The most mature outcome is recognizing that CAT explains the *origin* of variants (why this idea and not that one?), while Memetics/DIT explains the *distribution* of variants (why did this idea spread across the continent?). They are not rivals; they are sequential phases of the same epidemiological process.

  ### What Would Change My Mind

  I am currently inclined toward the "dissolving the rivalry" position (a generalized evolutionary theory). To move me to a hard "one side is right" stance:

  1.  **Evidence for High-Fidelity Non-Technical Replication:** If experimental psychology demonstrated that complex normative concepts (e.g., "justice" or "taboo") are transmitted with high fidelity across chains of participants without significant reconstructive drift, the Memetic claim would be vindicated. Currently, the "telephone game" data favors Sperber.
  2.  **Evidence Against Cumulative Attraction:** If it were shown mathematically that cognitive attractors alone cannot generate the open-ended cumulative complexity seen in human technology (the "ratchet effect") without a mechanism of high-fidelity lineage retention, then Sperber's model would be insufficient, and a Memetic/DIT mechanism would be necessary.
  3.  **Neuroscientific Tracing:** If we could trace a specific cultural variant's neural instantiation across individuals and show it remains isomorphic (a copy) rather than being re-instantiated via different neural pathways (reconstruction), that would settle the mechanistic dispute.

  ### Where My Diagnosis Is Likeliest to Fail

  My analysis assumes a level of theoretical charity that the participants themselves often reject. Here is where I might be wrong:

  1.  **The Normative Stake:** I am treating this as a scientific modeling dispute. It is also a philosophical turf war. For Dennett and the Memeticists, making culture "Darwinian" is a project to naturalize meaning and defeat exceptionalism. For Sperber, resisting the "replicator" label is a defense of the autonomy of cognitive anthropology against imperialism from evolutionary biology. My diagnosis fails if the disagreement is actually ideological: one side *needs* culture to be Darwinian to validate their broader worldview, and the other *needs* it not to be to protect the specificity of human cognition.
  2.  **The "Unit" Problem:** I glossed over the unit of selection issue. Memetics struggles to define the "meme." CAT struggles to define the "representation." If neither side can rigorously define their unit of analysis, my call for formal subsumption (via Price Equation) fails because you cannot plug undefined variables into an equation. The disagreement may be intractable because both sides are reifying phenomena that do not exist as discrete units.
  3.  **Hybridization is the Default:** It is possible that "copying" and "reconstruction" are not distinct mechanisms but ends of a spectrum that are always co-occurring. If every act of reconstruction involves some copying of structure, and every act of copying involves some reconstruction of meaning, then separating the questions (as your hypothesis suggests) might be analytically impossible. In that case, the dispute isn't two questions under one name; it's one messy question that resists clean modeling.

  ### Conclusion for the Seminar

  Tell your seminar this: The deadlock persists because both sides are claiming exclusive rights to the word *evolution*. The Memeticists claim it requires lineage; Sperber claims it requires only stability.

  Progress lies in recognizing that **cultural evolution is a hybrid process.** It is driven by selection on lineages *where fidelity is high* (tools, texts) and by attraction to cognitive optima *where fidelity is low* (myths, norms). The "replicator" is not a natural kind; it is a modeling assumption. When the assumption yields predictive power, use it. When it fails, switch to attractors. The dispute is not about how the world *is*, but about which map is useful for the territory you are currently walking.
