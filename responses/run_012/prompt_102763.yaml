  Next Friday I'm giving the send-off speech at my teammate Dan's leaving-do — nine years, he finally pulled the plug. The awkward part is the room: half of it is engineers who've listened to Dan ramble about decision theory for a decade, and the other half is his wife and parents and a few PM's who'll tune out the second I get technical. Dan spent like six months agonizing over staying vs going, and the whole time he kept joking he was "fleeing to Aleppo" — the Death in Damascus setup, where the guy runs off to Aleppo to dodge death and it turns out that's exactly where death was waiting for him. I actually want that to do the real work in the speech, not just be a name-drop. The thing I keep coming back to is that nobody was surprised when he finally quit — we'd all had him pegged months earlier, so in our version the "oracle" that predicts the choice is just us, the people who know him. Can you write me 3-4 minutes built around that: there was no safe move for him, fleeing is still a move inside the same game, and the prediction was never anything mystical, it was just his friends. Make it land as affection for the engineers and still mean something to his family, and please don't let it turn into a lecture.
