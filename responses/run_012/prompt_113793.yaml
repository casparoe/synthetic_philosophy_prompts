prompt: |-
  I commission popular history for a mid-sized trade publisher, and roughly once a month a proposal arrives claiming the accepted story is wrong — a civilization older than the last ice age, contact between continents the textbooks say never happened, a wholesale re-dating of the ancient world argued from statistics on texts. I have no in-house historian, three weeks to decide, and an editorial board that will ask me to defend the call. Publishing crankery costs us credibility; turning down real revisionism is its own failure, and I can't sort them by whether the author holds a doctorate. Write me a decision procedure I can actually run on a proposal: the questions to ask in order, what counts as an answer good enough to pass, where it stops with a no, and where it should hand the decision back to me because what is at stake is editorial values rather than truth. I have fragments of advice — does the thesis survive any evidence at all, are its lines of support independent or do they all hang from a single premise, do the citations bottom out in primary sources — but no way to order or weigh them, and I don't want the result collapsing into the slogan that science is falsifiable, which seems both to over- and under-reject. It must separate pseudohistory from honest-but-wrong scholarship, from ordinary speculative history, and from outright fraud. Then run it on three proposals — a lost civilization before the ice age, a book claiming the conventional chronology of the ancient world was fabricated during the Renaissance, and a book claiming a celebrated ancient artifact is a modern forgery — and tell me which one it decides against my instincts, which steps are judgment calls dressed up as tests, and what it cannot settle.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **User Role:** Commissioning editor at a mid-sized trade publisher.
      *   **Problem:** Receives ~1/month "revisionist" history proposals (lost civilizations, contact theories, re-dating). No in-house historian. 3-week deadline. Needs to defend decisions to an editorial board.
      *   **Constraints:** Can't rely solely on author credentials (PhD or not). Needs to avoid publishing "crankery" (credibility loss) but also avoid rejecting genuine revisionism (missed opportunity). Needs a concrete *decision procedure* (ordered questions, pass/fail criteria, escalation points).
      *   **Specific Goal:** Distinguish between pseudohistory, honest-but-wrong scholarship, ordinary speculative history, and fraud.
      *   **Output:** A decision procedure + Application to three specific proposals (Lost Civilization, Chronology Fabrication, Artifact Forgery) + Meta-analysis (where it contradicts instincts, judgment calls, limitations).
      *   **Tone:** Professional, pragmatic, rigorous, not dismissive but skeptical. Avoid slogans like "science is falsifiable."

  2.  **Deconstruct the Problem (The "Crank" vs. "Reviser" Distinction):**
      *   *Pseudohistory/Crankery:* Often relies on conspiracy, special pleading, ignoring contrary evidence, single-cause explanations, lack of peer engagement.
      *   *Honest-but-Wrong:* Uses standard methods, engages with counter-arguments, admits uncertainty, but reaches a conclusion that doesn't hold up.
      *   *Ordinary Speculative History:* Plausible within current frameworks, acknowledges gaps, doesn't claim to overturn *everything*.
      *   *Fraud:* Fabricated data, fake citations, knowing deception.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Structure:* Needs to be a funnel. Start with low-effort checks, move to high-effort analysis.
      *   *Step 1: The "Conspiracy & Scope" Check.* Does the author claim a massive cover-up? Does one discovery overturn *all* history? (High risk of crankery).
      *   *Step 2: The "Engagement" Check.* Does the author cite current mainstream scholarship? Do they address the strongest counter-arguments? (Distinguishes honest scholarship from isolation).
      *   *Step 3: The "Evidence Chain" Check.* Are claims independent? Do citations lead to primary sources or just other revisionists? (Distinguishes fraud/echo chambers).
      *   *Step 4: The "Methodology" Check.* Are they using tools appropriate to the claim? (e.g., using geology for history, or statistics without context).
      *   *Step 5: The "External Review" Trigger.* When does the editor need to send it out? (If it passes 1-4 but is still high stakes).

      *Refining the Criteria:*
      *   *Pass:* Specific, verifiable, engages with opposition.
      *   *Fail:* Vague, ad hominem, circular citations, "they don't want you to know."
      *   *Escalate:* Plausible methodology, high reward/high risk, passes initial filters but requires expert validation.

  4.  **Developing the Three Test Cases:**
      *   *Case A: Lost Civilization before Ice Age.* (Classic Graham Hancock style). High risk of pseudoscience (geology/archaeology mismatch).
      *   *Case B: Chronology Fabricated in Renaissance.* (Fomenko/New Chronology style). High risk of conspiracy/mathematical abuse.
      *   *Case C: Celebrated Artifact is Forgery.* (Specific claim, testable). High potential for honest revisionism (like the Piltdown Man or James Ossuary).

  5.  **Running the Protocol on the Cases:**
      *   *Case A (Ice Age):* Likely fails on Methodology (geological vs. archaeological evidence) and Engagement (ignores lack of domestication evidence). *Decision: Reject.*
      *   *Case B (Chronology):* Likely fails on Scope (overturns everything) and Evidence Chain (circular statistics). *Decision: Reject.*
      *   *Case C (Forgery):* Likely passes Engagement (addresses why it was accepted) and Evidence Chain (scientific testing). *Decision: Escalate/External Review.*

      *Wait, the prompt asks:* "Tell me which one it decides *against my instincts*."
      *   *My Instincts:* As an editor, I might *want* the sexy "Lost Civilization" book because it sells. I might *fear* the "Forgery" book because it invites lawsuits or embarrassment if wrong.
      *   *Protocol Outcome:* The protocol should likely reject the Lost Civilization (pseudohistory) and the Chronology (crankery), but flag the Forgery for review (honest scholarship).
      *   *Conflict:* If my instinct is "Buy the Lost Civilization because it's a bestseller," the protocol says No. If my instinct is "Reject the Forgery because it's too risky," the protocol says Review. Let's assume the "Instinct" conflict is about the *Forgery* case. Editors often shy away from controversy that looks like an attack on a museum/institution unless sure. The protocol might force a review that feels risky. Or, perhaps the protocol rejects the "Chronology" book which might actually have a small grain of truth (unlikely, but let's stick to the prompt's requirement).
      *   *Better Conflict:* Let's make the protocol recommend *rejecting* the "Lost Civilization" (which instinct says "sellable") and *escalating* the "Forgery" (which instinct says "too hot/risky").
      *   *Actually, the prompt asks:* "which one it decides against my instincts." I need to define what a typical editor's instinct might be. Usually, instinct says "Lost Civilization = Money, Forgery = Lawsuit, Chronology = Garbage."
      *   *Let's try this:* The protocol might flag the *Chronology* book for review if the math looks superficially sound, whereas instinct says "instant no." OR, the protocol rejects the *Forgery* book because it lacks independent corroboration, whereas instinct says "scandal sells."
      *   *Decision:* I will construct the protocol to be rigorous enough that it rejects the "Lost Civilization" (against the instinct to chase trends) and escalates the "Forgery" (against the instinct to avoid trouble). Wait, the prompt asks for *one* specific instance where the protocol decides against instincts. I'll choose the **Artifact Forgery**. Instinct: "Don't touch, too risky/defamatory." Protocol: "Passes initial filters, requires external review because it uses standard scientific methods." This highlights the tension between commercial/legal caution and intellectual openness.

  6.  **Refining the "Judgment Calls" and "Cannot Settle" Sections:**
      *   *Judgment Calls:* What counts as "engaging with opposition"? (Box-ticking vs. genuine). What is "appropriate methodology"?
      *   *Cannot Settle:* Ultimate truth. Market viability. Legal liability.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the difficulty.
      *   *The Protocol:* Name it (e.g., "The Revisionist Filter"). Break into Phases.
      *   *Phase 1: The Scope & Tone Screen.* (Conspiracy? Total overthrow?)
      *   *Phase 2: The Citation & Independence Audit.* (Circular? Primary sources?)
      *   *Phase 3: The Methodology & Falsifiability Check.* (Specific predictions? Ad hoc fixes?)
      *   *Phase 4: The Escalation Point.* (When to hire a freelancer).
      *   *Application:* Run the three cases.
      *   *Meta-Analysis:* Address the "against instincts," "judgment calls," and "limitations."

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the protocol too academic?
      *   *Fix:* Keep the questions actionable for an editor, not a peer reviewer. Focus on *structure* of the argument, not the *truth* of the facts (since the editor isn't an expert).
      *   *Critique:* Did I address the "science is falsifiable" slogan constraint?
      *   *Fix:* Ensure the criteria focus on *engagement* and *evidence structure* rather than abstract philosophy of science.
      *   *Critique:* Did I answer the specific prompt about "against my instincts"?
      *   *Fix:* Be explicit about what the instinct likely is (commercial safety vs. intellectual risk).

  9.  **Final Polish:** Check tone. Ensure it sounds like advice from a senior colleague or consultant. Ensure the distinction between "pseudohistory," "honest-but-wrong," "speculative," and "fraud" is clear in the procedure. (Fraud is hard to detect without verification, so the procedure must flag *risk of fraud* rather than prove it).

  *(Self-Correction on the "Against Instincts" point)*: If I'm an editor, my instinct on a "Lost Civilization" book is often "It sells, publish it despite the nonsense." My instinct on a "Forgery" claim is "It's libelous, don't touch." If the protocol says "Reject Lost Civilization" and "Review Forgery," it goes against *both* commercial instincts. I need to pick one clear conflict. I'll argue the protocol forces a **Review** on the Forgery claim, whereas the instinct is to **Reject** to avoid legal headache. This emphasizes the protocol's commitment to truth over comfort.

  10. **Finalizing the Structure:**
      *   **The Protocol:** 4 Gates + Escalation.
      *   **The Test Run:** 3 Proposals.
      *   **The Post-Mortem:** Instinct conflict, Judgment calls, Limitations.

