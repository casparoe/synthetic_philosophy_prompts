answer: |-
  Here is a decision procedure designed for a non-specialist editor working under time pressure. It focuses on the *structure* of the argument rather than the *content* of the facts, allowing you to assess rigor without assessing truth directly.

  ### The Revisionist Filter: A Four-Gate Protocol

  **Time Allocation:** 3 Weeks
  **Resources:** Proposal, Sample Chapters, Bibliography, One Freelance Specialist (Gate 4 only)

  #### Gate 1: The Scope and Tone Screen (Day 1-3)
  *Goal: Filter out conspiracy theories and "magic bullet" claims.*

  1.  **The "Total Overturn" Test:** Does the thesis require *all* existing archaeology/history to be wrong, or just a specific layer?
      *   *Pass:* Targets a specific period, site, or artifact. Acknowledges most surrounding history is correct.
      *   *Fail:* Claims "Everything you know about [Era] is a lie" or "History books are a fabrication."
  2.  **The "Suppression" Test:** How does the author explain the lack of acceptance?
      *   *Pass:* "My data is new," "Previous methods were limited," or "I am challenging a specific interpretation."
      *   *Fail:* "The academic establishment is suppressing this," "They don't want you to know," or implies a coordinated conspiracy.
  3.  **The "Single Cause" Test:** Does the theory explain diverse phenomena (architecture, texts, genetics, geology) with one single mechanism?
      *   *Pass:* Uses multiple lines of evidence that converge.
      *   *Fail:* Explains everything via one key (e.g., "It was all aliens," "It was all one lost empire," "It was all statistical error").

  **Stop Rule:** If two or more *Fail* marks, **Reject**. This is likely pseudohistory or crankery.

  #### Gate 2: The Citation and Independence Audit (Day 4-10)
  *Goal: Detect echo chambers, fraud, and circular reasoning.*

  1.  **The "Reference Depth" Check:** Randomly select 10 citations from the bibliography. Do they lead to primary sources (excavation reports, radiocarbon data, original texts) or secondary summaries?
      *   *Pass:* 7+ lead to primary data or peer-reviewed journals.
      *   *Fail:* 7+ lead to other popular books, websites, or self-published works.
  2.  **The "Opposition Engagement" Check:** Does the author cite the leading mainstream expert on the specific topic they are challenging?
      *   *Pass:* Cites them accurately and attempts to refute their specific data points.
      *   *Fail:* Cites them vaguely, misrepresents their view, or ignores them entirely.
  3.  **The "Independence" Check:** Are the pillars of the argument independent?
      *   *Pass:* Argument stands on A (geology), B (textual analysis), and C (comparative myth). If A falls, B and C remain.
      *   *Fail:* Argument stands on A. B and C are just restatements of A. (If the single premise fails, the book collapses).

  **Stop Rule:** If *Fail* on "Opposition Engagement" or "Reference Depth," **Reject**. This indicates honest-but-wrong scholarship at best, or fraud at worst.

  #### Gate 3: The Methodology and Falsifiability Check (Day 11-17)
  *Goal: Distinguish speculative history from pseudoscience.*

  1.  **The "Tool Appropriateness" Test:** Is the author using methods valid for the material?
      *   *Pass:* Using geology for soil layers, philology for texts, radiocarbon for dating.
      *   *Fail:* Using mythology to date geological events, or statistics to date texts without manuscript evidence.
  2.  **The "Ad Hoc" Test:** When the author encounters contradictory evidence, how do they handle it?
      *   *Pass:* "This is an anomaly I cannot yet explain," or "This suggests my theory needs refinement."
      *   *Fail:* "This evidence is planted," "This is an exception that proves the rule," or inventing a new variable solely to absorb the contradiction.
  3.  **The "Prediction" Test:** Does the thesis offer a way to be proven wrong?
      *   *Pass:* "If excavation X finds Y, my theory is void."
      *   *Fail:* "Any evidence against me is part of the cover-up" or the theory is flexible enough to fit any outcome.

  **Stop Rule:** If *Fail* on "Tool Appropriateness," **Reject**. This is pseudoscience. If *Fail* on "Ad Hoc," **Reject**. This is dogma.

  #### Gate 4: The Escalation Point (Day 18-21)
  *Goal: Hand off the truth-claim to an expert.*

  If a proposal passes Gates 1–3, you cannot decide on truth. You must decide on *risk and process*.
  *   **Action:** Hire a freelance academic specialist (10-hour consult).
  *   **Question to Specialist:** "Ignoring whether the conclusion is true, is the *methodology* sound enough to warrant a debate? Is the author engaging in good faith?"
  *   **Decision:**
      *   Specialist says "No/Trash": **Reject.**
      *   Specialist says "Wrong but interesting": **Consider** (as speculative history).
      *   Specialist says "Plausible/Controversial": **Acquire** (with legal review).

  #### Gate 5: The Editorial Values Override (Day 22-23)
  *Goal: Reclaim authority on stakes.*

  If the proposal passes Gate 4, the decision returns to you. This is not about truth, but values.
  *   **Question:** Does publishing this contribute to public understanding, even if wrong? Or does it erode trust in inquiry itself?
  *   **Question:** Are we prepared for the backlash (legal, institutional, reputational)?

  ***

  ### Test Run: Three Proposals

  Here is how the protocol processes the three specific scenarios you provided.

  #### Proposal 1: The Ice Age Civilization
  *Thesis: A high-tech global civilization existed 12,000 years ago but was wiped out by a comet; all subsequent cultures are fragments of this lost whole.*
  *   **Gate 1 (Scope/Tone):** **FAIL.** Claims total overturn of human development (hunter-gatherer to agrarian). Implies suppression ("archaeologists ignore the evidence"). Single cause (comet/catastrophe explains everything).
  *   **Gate 2 (Citations):** **FAIL.** Citations bottom out in other popular revisionist books, not excavation reports.
  *   **Gate 3 (Methodology):** **FAIL.** Uses mythology as geological data. Ad hoc explanations for lack of ruins ("they were underwater").
  *   **Protocol Decision:** **REJECT at Gate 1.**
  *   **Classification:** Pseudohistory.

  #### Proposal 2: The Renaissance Chronology Fabrication
  *Thesis: The conventional chronology of the ancient world (Egypt, Greece, Rome) was fabricated by Renaissance scholars using statistical manipulation of texts; the events never happened.*
  *   **Gate 1 (Scope/Tone):** **FAIL.** "Wholesale re-dating." Implies a massive conspiracy of scholars over 500 years.
  *   **Gate 2 (Citations):** **MIXED.** Cites texts, but **FAIL** on Opposition Engagement. Ignores radiocarbon dating, dendrochronology, and astronomy which anchor the timeline independently of texts.
  *   **Gate 3 (Methodology):** **FAIL.** Tool Appropriateness. Uses statistics on text names to determine physical dates. Ad Hoc: Claims physical dating methods are "calibrated to the fake history."
  *   **Protocol Decision:** **REJECT at Gate 3.**
  *   **Classification:** Pseudoscience/Crankery.

  #### Proposal 3: The Celebrated Artifact Forgery
  *Thesis: A specific, famous museum artifact (e.g., a specific statue or tablet) is a 19th-century forgery, based on new chemical analysis of the patina and stylistic anachronisms.*
  *   **Gate 1 (Scope/Tone):** **PASS.** Targets one object, not a whole era. No claim of conspiracy, just error.
  *   **Gate 2 (Citations):** **PASS.** Cites museum catalogs, previous analyses, and primary stylistic comparisons. Engages with the curator who authenticated it.
  *   **Gate 3 (Methodology):** **PASS.** Uses chemistry and art history (appropriate tools). Offers falsifiability ("If the patina contains X, I am wrong").
  *   **Gate 4 (Escalation):** **PASS.** Freelance archaeologist says: "Methodology is sound. Conclusion is controversial but not impossible. Good faith engagement."
  *   **Protocol Decision:** **ESCALATE TO ACQUISITION (with legal review).**
  *   **Classification:** Honest Revisionism / Speculative History.

  ***

  ### Post-Mortem Analysis

  #### 1. Which decision goes against your instincts?
  The protocol likely forces you to **escalate Proposal 3 (The Artifact Forgery)**, whereas your commercial and legal instinct is to **Reject**.

  *   **Your Instinct:** A book accusing a major museum or celebrated scholar of fraud (even unintentional) invites lawsuits, bad press, and alienation of academic reviewers. It is "too hot."
  *   **The Protocol's Logic:** The proposal passes all rigor checks. It uses standard scientific methods, engages with opposition, and limits its scope. Rejecting it solely because it is controversial violates the publisher's commitment to inquiry.
  *   **The Conflict:** The protocol protects *intellectual integrity*; your instinct protects *institutional safety*. The protocol forces you to defend the book on values (Gate 5), rather than letting you hide behind "we aren't sure it's true."

  #### 2. Which steps are judgment calls dressed up as tests?
  *   **Gate 2, "Opposition Engagement":** An author can "cite" an opponent merely to straw-man them. Distinguishing between a *good faith refutation* and a *dishonest caricature* requires you to understand the opponent's view. You are relying on the author's honesty here.
  *   **Gate 3, "Tool Appropriateness":** This requires you to know what tools *should* be used. If an author claims "linguistic DNA" proves migration, you need to know if that's a real field or nonsense. If you don't know, this test collapses.
  *   **Gate 4, The Freelancer:** You are outsourcing the judgment call. However, selecting the freelancer is a judgment call. Pick a rival of the author, and the report will be negative. Pick a friend, and it will be positive. You must vet the vet.

  #### 3. What can this procedure not settle?
  *   **Fraud vs. Delusion:** The protocol can identify *structural* signs of fraud (fake citations), but it cannot detect sophisticated data fabrication. If the chemical analysis in Proposal 3 is faked but looks real, the protocol passes it. Only replication settles this.
  *   **Market Viability:** A book can be methodologically sound (Proposal 3) and still be unreadable or unsellable. The protocol assesses *validity*, not *velocity*.
  *   **The "Grain of Truth" Problem:** Sometimes cranks are right about the data but wrong about the conclusion (e.g., Velikovsky). The protocol might reject a book because the *theory* is wild, even if the *data* presented is new and valuable. You might miss a data-rich book with a crazy thesis.
  *   **Legal Liability:** Passing Gate 4 does not immunize you from libel. The protocol assesses scholarship, not defamation law. You still need legal counsel before signing Proposal 3.

  ### Summary for the Editorial Board
  When defending these calls, do not argue about the *history*. Argue about the *process*.
  *   **For Rejections:** "The proposal failed the Structural Rigor Protocol. It relies on circular citations and ignores contrary data. Publishing it would expose us to charges of promoting pseudoscience."
  *   **For Acquisitions:** "The proposal passed the Structural Rigor Protocol. It uses standard methods and engages with critics. While the conclusion is controversial, the methodology is sound. We are publishing the *inquiry*, not guaranteeing the *outcome*."

  This shifts the debate from "Is this true?" (which you cannot know) to "Is this rigorous?" (which you can verify).
