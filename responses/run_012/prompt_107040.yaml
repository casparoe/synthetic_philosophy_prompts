      *   *Prediction:* Dana will deny moral worth in the Kidney Case. Reasoning: She values *grasping the claim* (Case 4) and *responding to the need* (Case 2) over abstract conformity (Case 1). The Kidney donor fails to grasp the claim of the needy.
