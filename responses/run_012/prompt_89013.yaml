      *   Hedonists would concede this: If pleasure is the only good, control doesn't matter. If control matters, it's not pure hedonism. But if control + simulation still feels lacking, then "Reality" is an independent variable.

  5.  **Address Variant (b): Real Life Pure Patient:**
