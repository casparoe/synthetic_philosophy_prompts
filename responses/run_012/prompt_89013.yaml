  3.  **Brainstorm Defeaters (Internal to Hedonism/Desire Theory):**
      *   *Fatal:* The "Contact with Reality" intuition persists even when agency is maximized. If I author a simulation where I save the world, but no one actually exists, do I still feel a lack? Yes. This suggests reality matters independently of agency.
      *   *Fatal:* The "Pure Patient" counter-example (Variant b). If there are real-life cases where people are pure patients (e.g., severe disability, coma recovery, being cared for) and we don't think their lives are necessarily deficient *solely* due to lack of agency, then agency isn't the necessary condition the user claims.
      *   *Serious:* Desire Satisfaction Theory already handles this poorly. If I desire "to actually help people," satisfying that desire in a simulation fails the desire condition regardless of agency. So the user isn't adding a condition; they're misdiagnosing the desire.
      *   *Awkward:* Status Quo Bias. People might just fear change. But the user asked to filter noise. This is often noise, but if the agency claim is robust, status quo bias shouldn't apply if agency is preserved.
      *   *Unfalsifiability:* Can any objection be redescribed as "lack of agency"? If I say "I want real friends," the user says "You want the agency of making real friends." If I say "I want to actually climb Everest," the user says "You want the agency of actually climbing." This risks becoming tautological.

