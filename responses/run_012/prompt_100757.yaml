answer: |-
  ### 1. Exam Question

  **Course:** Philosophy 450 — Dewey and Democracy  
  **Time:** 90 Minutes  
  **Instructions:** Answer the following question in essay form. No citations or external texts are permitted. Argue from the concepts discussed in seminar.

  **Prompt:**  
  Consider a case of participatory budgeting where citizens deliberate to allocate public funds. Three structural worries arise:  
  1. **Framing Capture:** Deliberation is dominated by fluent speakers who set the terms before voting occurs.  
  2. **No Counterfactual:** Once a project is funded, there is no control group to test what would have happened had the losing project been chosen.  
  3. **Pre-set Problems:** The budget envelope and eligible categories are determined by authorities, not the participants.

  Select the **single worry** you find most damaging to John Dewey's conception of democracy as experimental inquiry. Does Dewey's framework have the internal resources to resolve this worry, or does it require revision? If it requires revision, what is the theoretical cost?

  In your argument, you must explicitly identify which component of Dewey's inquiry machinery (**the indeterminate situation, the hypothesis, the test, or the public**) is doing the load-bearing work in your solution, and which component is expendable. Finally, take a stand: can the claim "democracy is experimental" survive in a context where there is genuinely no controlled test to be had?

  ***

  ### 2. Model Answer

  The most damaging worry is the second: the lack of a counterfactual. If democracy is experimental, it requires testing hypotheses against consequences. In a laboratory, we run control groups to isolate variables. In participatory budgeting, we fund one park and cannot simultaneously fund the other to compare outcomes. If "experiment" requires controlled comparison, Dewey's model collapses into mere guesswork. However, Dewey's experimentalism survives this critique, but only if we radically reinterpret the "test" and shift the load-bearing weight to the "public."

  Dewey's notion of experiment is not identical to the controlled laboratory method of natural science. In practical inquiry, the "test" is not about simultaneous comparison but about the resolution of an indeterminate situation over time. The hypothesis is not "Project A is better than Project B," but rather "Project A will resolve the specific tension in our community." The test occurs longitudinally. We fund the park, observe the consequences, and adjust. Therefore, the **controlled test** is expendable. We do not need to know what *would* have happened; we only need to know if what *did* happen restored functional equilibrium.

  However, this reinterpretation places immense pressure on another component: **the public**. For a longitudinal test to function as democratic inquiry, the consequences of the action must be perceived and registered by the community. In a lab, the仪器 (instrument) records the data. In democracy, the public is the instrument. If the community cannot see the consequences of the funded project—because the data is opaque, or because the "framing capture" from worry one prevents them from interpreting the results—then the experiment fails. There is no feedback loop.

  This means the **public** is the load-bearing component. The machinery of democracy-as-experiment relies less on the initial vote (the hypothesis selection) and more on the capacity of the public to observe consequences and initiate new inquiry based on those consequences. The "indeterminate situation" is also load-bearing, but only if it can be re-identified later. If the initial problem was pre-set (worry three), the public must retain the power to declare the solution inadequate and reopen the problem definition.

  The cost of this patch is high. It demands a level of public attentiveness and transparency that is rarely present. If the public cannot perceive consequences, the "experiment" is blind. Dewey's model survives the lack of a control group, but it dies without a perceptive public. Therefore, "democracy is experimental" is not a description of how voting works; it is a normative claim about how consequences must be communicated. Without institutional mechanisms to make consequences visible to the public, the claim is false. The experiment survives only if we treat the public not as voters, but as observers of consequence.

  ***

  ### 3. Marking Scheme

  | Move | What earns full credit | Marks | Common way students miss it |
  | :--- | :--- | :--- | :--- |
  | **1. Problem Selection & Framing** | Clearly selects one worry and explains *why* it threatens the "experimental" label specifically (not just "it's unfair"). | 5 | Selecting a worry but treating it as a general political complaint (e.g., "it's undemocratic") rather than an epistemic/experimental failure. |
  | **2. Redefining "Experiment"** | Distinguishes Deweyan practical inquiry from laboratory science. Argues that longitudinal consequence-tracking can substitute for controlled counterfactuals. | 5 | **The A-vs-B Line:** B-level answers insist a control group is necessary (fail) or simply assert Dewey is right without explaining *how* the test works without controls. |
  | **3. Machinery Analysis** | Explicitly names the four components (situation, hypothesis, test, public). Identifies one as load-bearing and one as expendable with justification. | 5 | Vaguely discussing "democracy" without referencing the specific machinery components requested in the prompt. |
  | **4. Final Verdict & Cost** | Takes a clear stand on viability. Identifies the theoretical cost (e.g., demands on public attentiveness, transparency requirements). | 5 | Sitting on the fence ("it depends") without specifying the conditions, or failing to articulate the cost of the revision. |
  | **Total** | | **20** | |

  ***

  ### 4. JSON Summary

