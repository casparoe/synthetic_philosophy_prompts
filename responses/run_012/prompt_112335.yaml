answer: |-
  Your suspicion is well-founded. The stalemate you describe is not merely a fatigue of argument but a structural feature of the debate itself. To offer the diagnosis you request: this is primarily a case of **two groups asking different questions under a single name**, compounded by a foundational disagreement about the *telos* of the political community. It is not a hidden empirical question, nor simply a divergence in evidentiary standards, though both sides utilise empirical claims to bolster their positions. Nor is it merely a verbal dispute that could be resolved by a dictionary; it is a conceptual incommensurability regarding the function of law in times of regime change.

  Here is the precise diagnosis.

  ### The Two Questions
  The Realists and the Justice Camp are indeed employing the word 'justice' to signify two distinct normative categories.

  1.  **The Justice Camp asks:** *What is owed to the victims of the antecedent regime to vindicate their status as rights-bearers?*
      This is a question of **corrective or retributive justice**. It is retrospective and individualised. It assumes a continuity of moral law that survives the political rupture. On this view, the state's authority is derived from its fidelity to the law; to violate the law (by granting amnesty) is to undermine the very authority the new state claims. The 'wrong' of amnesty is intrinsic, regardless of consequences.

  2.  **The Realists ask:** *What is required to constitute a political order capable of securing rights for future citizens?*
      This is a question of **constitutional or political justice**. It is prospective and systemic. It assumes a discontinuity—a state of nature or civil war—where the primary obligation of the emerging authority is the establishment of a monopoly on violence. On this view, the state's authority is derived from its capacity to keep the peace; to jeopardise that peace (by demanding prosecution) is to risk a return to the chaos that made rights meaningless in the first place. The 'wrong' of amnesty is instrumental, weighed against the catastrophe of continued conflict.

  ### Can the Sides be Brought to See the Distinction?
  It is possible to bring both sides to acknowledge that they are answering different questions, but this acknowledgement will not dissolve the disagreement. It will merely relocate it.

  At present, the Justice Camp argues that their question (what is owed to victims) *trumps* the Realist question (what is needed for peace), often by disputing the empirical claim that peace requires amnesty (citing Argentina). The Realists argue that their question *trumps* the Justice Camp's, often by disputing the empirical claim that peace can survive prosecution (citing South Africa or hypothetical counterfactuals).

  If you force them to admit they are answering different questions, the debate shifts from "Will prosecution cause a coup?" to "Which obligation is prior?" The Justice Camp will maintain that a peace built on the betrayal of victims is no peace at all, but a continuation of injustice by other means. The Realists will maintain that a justice that precipitates a return to slaughter is no justice at all, but a moral luxury paid for in blood.

  Therefore, whilst you can clarify the conceptual confusion, you cannot bring either side to concede that they are answering *only* one of the questions in a way that diminishes their conviction. Each side believes their question is the foundational one; to admit the other question has equal weight is to surrender their first principle.

  ### The Conflation of Amnesty and Impunity
  Your secondary hypothesis regarding amnesty versus impunity is astute, but it functions as a symptom rather than the cause. The Justice Camp conflates the two because they view the juridical act (amnesty) as the primary generator of the social condition (impunity). To grant legal immunity is, in their view, to authorise social contempt for the victim. The Realists separate the two because they view the juridical act as a technical mechanism to disarm a threat, believing social accountability (truth, memory) can exist without legal penalty.

  Resolving this definitional slippage would not solve the debate. Even if both sides agreed that 'amnesty' refers strictly to legal immunity and 'impunity' to a culture of lawlessness, the Justice Camp would still argue that the former inevitably produces the latter, whilst the Realists would argue the former is the only way to prevent the total collapse of the legal order.

  ### What Counts as Progress?
  You asked what would count as progress, offering the possibility of "nothing at all". I am inclined to support the pessimistic view.

  There will be no **formal result** or **synthesis** that satisfies both camps, because the disagreement rests on something neither side can argue for: **what a political community is ultimately for.**
  *   If the community is a **moral association** bound by shared truth and rectitude, the Justice Camp is correct.
  *   If the community is a **security association** bound by the cessation of violence and the stability of institutions, the Realists are correct.

  These are not propositions that can be proven; they are pre-political commitments. Consequently, progress in this reading group will not look like a resolution. It will look like a **clarification of the impasse**.

  Progress would consist of the following:
  1.  **Cessation of Empirical Pretence:** Both sides stop citing Argentina or South Africa as 'proof' that their moral position is empirically validated. They should admit that the empirical data is underdetermined and that their interpretation of it is driven by their normative priority.
  2.  **Explicit Prioritisation:** Each side explicitly states that they are prioritising one form of justice (retrospective vs. prospective) at the expense of the other, rather than claiming to achieve both.
  3.  **Acceptance of Tragedy:** The Realists must admit they are choosing a moral wrong to prevent a greater physical wrong, without dressing it up as 'restorative justice'. The Justice Camp must admit they are prioritising moral integrity even if it carries a risk of renewed violence, without pretending the risk does not exist.

  ### Conclusion
  To answer your final constraint directly: I believe the disagreement rests on something neither side can argue for. It is a clash of first principles regarding the nature of political legitimacy. One side views legitimacy as flowing from **right** (adherence to moral law); the other views it as flowing from **order** (the capacity to sustain peace).

  In the absence of a higher authority to adjudicate between Right and Order—a position occupied, in stable times, by the constitution itself, but which is precisely what is missing in transitional moments—there is no neutral ground upon which to stand. The debate cannot be won; it can only be endured. The most honest outcome for your reading group is to recognise that transitional justice is not a problem to be solved, but a tragedy to be managed. Any optimism beyond that is likely a form of denial.
