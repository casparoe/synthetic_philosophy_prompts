  # Standard of Adequacy for the Free Energy Programme

  **To:** The Review Panel
  **From:** [Your Name/Role]
  **Subject:** Pre-registered Standard of Adequacy for Programme Renewal

  ## Preamble
  This document establishes the criteria against which the continuation of the multi-lab programme on the Free Energy Principle (FEP), Predictive Processing (PP), and Active Inference (AI) will be judged. These criteria are agreed upon *ex ante* to prevent post-hoc rationalisation. They are designed to be signable by proponents (who view the framework as a unifying theory) and skeptics (who view it as potentially unfalsifiable or empty) by focusing on scientific adequacy rather than metaphysical commitment.

  ---

  ## Part I: Requirements for Adequacy

  ### 1. Explanatory Scope and Specificity
  **Requirement:** The theory must quantitatively account for core phenomena of perception (e.g., illusions, cue integration), action (e.g., goal-directedness, habituation), and learning (e.g., plasticity, curiosity), and must successfully predict at least one phenomenon that rival frameworks (e.g., Reinforcement Learning, Control Theory) predict incorrectly or cannot address without ad-hoc modification.
  *   **Case/Consideration:** A unifying theory that explains everything explains nothing. To distinguish itself from competitors, it must offer unique predictive leverage, not just post-hoc redescriptions.
  *   **Status:** Genuine Demand.
  *   **Negotiability:** Non-negotiable.

  ### 2. The Normative/Empirical Distinction
  **Requirement:** The programme must explicitly distinguish between claims that a system *ought* to minimise free energy (normative/mathematical) and claims that a specific biological system *does* minimise free energy via specific mechanisms (empirical/biological).
  *   **Case/Consideration:** Confusing a mathematical bound with a biological mechanism leads to category errors. A system can be optimal in principle without implementing the specific algorithm in practice.
  *   **Status:** Genuine Demand.
  *   **Negotiability:** Non-negotiable.

  ### 3. The "As-If" vs. "Real" Mechanism Constraint
  **Requirement:** The programme must demonstrate that the system physically implements the minimisation process (e.g., via gradient descent on variational parameters) rather than merely behaving *as if* it does. This requires mapping the mathematical variables of the theory to identifiable physiological variables (e.g., firing rates, synaptic weights).
  *   **Case/Consideration:** Any behaviour can be redescribed as optimisation *post-hoc*. Without mechanistic mapping, the theory is a descriptive language, not a causal explanation.
  *   **Status:** Genuine Demand.
  *   **Negotiability:** Non-negotiable.

  ### 4. Falsifiability of the Core Claim
  **Requirement:** There must exist a conceivable experimental outcome that would count as evidence against the claim that the brain uses active inference/PP. This outcome cannot be absorbed by adjusting auxiliary hypotheses (e.g., changing the prior) without independent justification.
  *   **Case/Consideration:** Addresses the Skeptic's charge of unfalsifiability. If the theory can accommodate any data by tweaking priors or precision weights, it is immune to refutation and thus unscientific.
  *   **Status:** Genuine Demand.
  *   **Negotiability:** Non-negotiable.

  ### 5. Resolution of the Dark Room Problem
  **Requirement:** The theory must provide a non-circular explanation for why agents do not seek states of minimal sensory input (e.g., sitting in a dark, silent room) to minimise surprise, specifically appealing to the structure of priors regarding viability or physiological constraints.
  *   **Case/Consideration:** This is the canonical internal consistency challenge. If the theory predicts organisms should seek immediate sensory quiescence, it contradicts the existence of exploratory life.
  *   **Status:** Genuine Demand.
  *   **Negotiability:** Non-negotiable.

  ### 6. The Living Systems Constraint
  **Requirement:** The theory must demonstrate how the minimisation principle scales from cellular homeostasis/allostasis to cognitive inference without changing the fundamental definition of the "self" or the "Markov blanket." It must show how physical survival constraints map onto informational surprise.
  *   **Case/Consideration:** FEP claims to be a theory of life, not just brains. If the link between thermodynamic viability and informational surprise is broken, the unifying claim fails.
  *   **Status:** Genuine Demand.
  *   **Negotiability:** Negotiable (degree of scale integration required).

  ### 7. Distinction between FEP, AI, and PP
  **Requirement:** The programme must not treat the Free Energy Principle (the bound), Active Inference (the process), and Predictive Processing (the neural implementation) as interchangeable. Failures at the implementation level (PP) must not be used to invalidate the principle (FEP), nor vice versa.
  *   **Case/Consideration:** Conflating these levels protects the core principle from empirical refutation. If PP fails neurally, AI might still hold computationally, but the programme must specify where the break occurs.
  *   **Status:** Genuine Demand.
  *   **Negotiability:** Non-negotiable.

  ### 8. Rejection of Tautological Status
  **Requirement:** The programme must demonstrate that the Free Energy Principle is not a mathematical tautology (true by definition for any probability distribution) but a contingent claim about biological systems.
  *   **Case/Consideration:** Addresses the Skeptic's charge of triviality. If FEP is mathematically necessary for any system with a Markov blanket, it is a theorem, not a scientific theory of life.
  *   **Status:** **Prejudice of the Skeptic Camp** (accepted here as a demand for clarity).
  *   **Negotiability:** Non-negotiable.

  ### 9. Rejection of "Law of Nature" Immunity
  **Requirement:** The programme must not claim FEP is a "Law of Nature" (like the Second Law of Thermodynamics) to shield it from empirical testing. It must be treated as a contingent hypothesis about biological organisation.
  *   **Case/Consideration:** Addresses the **Prejudice of the Proponent Camp**. Treating it as a Law insulates it from the falsifiability required in Requirement 4.
  *   **Status:** **Prejudice of the Proponent Camp** (rejected here as a valid defence).
  *   **Negotiability:** Non-negotiable.

  ---

  ## Part II: Jointly Unsatisfiable Requirements (The Trade-offs)

  You asked me to flag pairs of requirements that pull against each other. You guessed **Falsifiability vs. Breadth**. You are correct, but there is a deeper, more dangerous conflict.

  **1. The Unification vs. Falsifiability Trade-off (Confirmed)**
  *   **Conflict:** Requirement 1 (Scope) demands the theory cover perception, action, and life. Requirement 4 (Falsifiability) demands specific conditions for failure.
  *   **Tension:** The broader the theory, the more auxiliary hypotheses (priors, hyperparameters) are available to absorb anomalies. To make FEP falsifiable (Req 4), you must narrow its scope (Req 1). To maintain it as a "Unifying Theory" (Req 1), you must allow flexibility that weakens falsifiability (Req 4).
  *   **Verdict:** This is manageable. The programme can propose specific *models* that are falsifiable, even if the overarching *principle* is broad.

  **2. The "Law" vs. "Theory" Ontological Conflict (Critical)**
  *   **Conflict:** Requirement 8 (Not a Tautology) and Requirement 9 (Not a Law) vs. The Proponent's Core Claim.
  *   **Tension:** Proponents often argue FEP is a mathematical necessity for bounded systems (like Least Action in physics). If it is a mathematical necessity, it *cannot* be falsified (violating Req 4) and it *is* trivial in the sense that it applies to everything (violating Req 1's demand for specific explanatory power).
  *   **Verdict:** **This is the fatal tension.** You cannot have a theory that is both a *mathematical necessity* (true by definition) and a *contingent biological hypothesis* (true by observation). The programme must choose. If they claim it is a Law, they fail Req 4. If they claim it is a Hypothesis, they abandon the "Principle" status that grants it unifying power. **This subset of desiderata cannot be met together.** They must demote FEP from a "Law of Nature" to a "Strong Hypothesis" to satisfy this standard.

  **3. Mechanistic Reality vs. Mathematical Generality**
  *   **Conflict:** Requirement 3 (Real Mechanism) vs. Requirement 6 (Living Systems Constraint).
  *   **Tension:** The mathematics of FEP are general enough to apply to any system with a Markov blanket (Req 6). However, requiring specific neural implementation (Req 3) constrains the mathematics to the messy biology of the brain. The more general the principle, the harder it is to pin down a specific algorithm (gradient descent) as the *only* way biology solves it.
  *   **Verdict:** Negotiable. The programme can argue for "family of mechanisms" rather than a single algorithm.

  ---

  ## Part III: Preliminary Assessment of Contenders

  **Predictive Processing (PP)**
  PP fares best on **Requirement 1 (Phenomena)** regarding perception and illusions, where it has strong empirical traction. It struggles with **Requirement 3 (Mechanism)**, as the specific neural coding schemes (e.g., firing rates representing prediction errors) remain debated. It is generally safe on **Requirement 5 (Dark Room)** by appealing to prior expectations of sensation, but this risks becoming ad-hoc.

  **Active Inference (AI)**
  AI addresses **Requirement 5 (Dark Room)** and **Requirement 6 (Living Systems)** better than PP by integrating action and homeostasis. However, it fares poorly on **Requirement 4 (Falsifiability)** because the flexibility in defining "priors over policies" allows it to fit almost any behavioural data post-hoc. It also faces significant challenges on **Requirement 3 (Mechanism)** regarding computational tractability in real-time biological systems.

  **Free Energy Principle (FEP) *qua* Unifying Claim**
  As the broadest claim, FEP satisfies **Requirement 6 (Living Systems)** conceptually but fails **Requirement 8 (Tautology)** and **Requirement 9 (Law Immunity)** if proponents maintain its status as a mathematical necessity. To pass this standard, FEP must be presented not as a law of physics, but as a contingent hypothesis about biological organisation. Currently, it oscillates between the two, which satisfies neither camp.

  **Recommendation:** Renewal should be conditional on the programme explicitly abandoning the "Law of Nature" defence to secure falsifiability, while narrowing the scope of specific grant proposals to testable Active Inference models rather than general Free Energy proofs.
