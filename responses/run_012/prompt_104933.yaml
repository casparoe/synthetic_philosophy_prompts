      *   **Key Distinctions:** Thin vs. Thick conceivability (user's own terms, need to incorporate).
      *   **Key Defeaters:** Hidden contradictions, empirical impossibilities, limits of imagination.
      *   **Epistemic Humility:** Distinguishing "I can't conceive it" (me) vs. "It's impossible" (world).
      *   **Test Cases:**
          1.  4-hour work week + doubled productivity.
          2.  Mind uploading.
          3.  No beliefs/desires but unchanged behavior (Zombie-like).
          4.  One scenario the procedure should reject (even if liked).
      *   **Constraints:** Fit on one side of A4, usable by laypeople, honest about limitations (where humans are needed).
      *   **Tone:** Professional, clear, actionable, slightly academic but accessible.

  2.  **Deconstruct the Philosophy:**
      *   *Conceivability $\rightarrow$ Possibility:* This is a classic modal epistemology problem. Just because I can imagine it doesn't mean it's metaphysically or physically possible.
      *   *Thin Conceivability:* Prima facie conceivability. No obvious contradiction *yet*.
      *   *Thick Conceivability:* Ideal positive conceivability. Consistent with known laws/logic after rigorous checking.
      *   *Defeaters:*
          *   Logical Contradiction (A & ~A).
          *   Metaphysical Impossibility (Water isn't H2O).
          *   Nomological/Physical Impossibility (FTL travel).
          *   Cognitive Limit (I can't imagine 1000 dimensions, but they might exist).
      *   *The "Me vs. World" Check:* Is the blockage in my brain or in the fabric of reality?

  3.  **Drafting the Checklist Structure:**
      *   **Header:** Title, Purpose, User.
      *   **Section 1: The Initial Filter (Thin vs. Thick).** Force them to categorize the scenario.
      *   **Section 2: The Defeater Check.** Logical, Physical, Conceptual.
