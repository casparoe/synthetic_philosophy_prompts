answer: |-
  # FUTURES SCENARIO VIABILITY SCREEN (FSVS)
  **For:** Council Futures Team | **Purpose:** Filter speculative scenarios before planning integration.
  **Instruction:** Complete all sections. If any box is checked in **RED**, stop and consult an expert.

  ### 1. CONCEIVABILITY TYPE (Select One)
  *   **[ ] THIN CONCEIVABILITY:** The scenario sounds coherent at first glance. You can picture the *outcome* without immediately seeing a problem. (e.g., "Flying cars").
  *   **[ ] THICK CONCEIVABILITY:** The scenario remains coherent when you hold fixed current knowledge of logic, physics, and human nature. You can sketch the *mechanism* without contradiction. (e.g., "Electric vertical take-off vehicles").
  *   *Note: Most planning documents require **Thick**. Thin is for brainstorming only.*

  ### 2. DEFEATER CHECK (The "Impossible" Filters)
  *Does the scenario violate any of the following?*
  *   **[ ] Logical Contradiction:** Does it require A and not-A to be true? (e.g., "A square circle," "Costless benefit").
  *   **[ ] Conceptual Truth:** Does it break definitions? (e.g., "A bachelor who is married," "Pain that feels pleasant").
  *   **[ ] Physical Law:** Does it break established physics? (e.g., "Faster than light," "Perpetual motion").
  *   **[ ] Biological Constraint:** Does it ignore human physiological limits? (e.g., "Humans sleeping 0 hours").

  ### 3. THE IMAGINATION LIMIT CHECK
  *If you found a defeater, was it in the world or in your head?*
  *   **Question:** Is this hard to conceive because it is **complex/unfamiliar** OR because it is **broken**?
  *   **[ ] Complex/Unfamiliar:** (e.g., 11-dimensional space). *Verdict: Possible, but verify with science.*
  *   **[ ] Broken:** (e.g., 2+2=5). *Verdict: Impossible.*
  *   **[ ] Unclear:** You cannot tell the difference. *Verdict: **STOP. Refer to Philosopher/Scientist.***

  ### 4. VERDICT
  *   **[ ] VIABLE (Thick):** No defeaters found. Mechanism plausible. Proceed to planning.
  *   **[ ] SPECULATIVE (Thin):** No logical errors, but mechanism unknown. Flag as "High Risk."
  *   **[ ] REJECT:** Defeater found (Logical or Physical). Do not plan for this.
  *   **[ ] EXPERT REVIEW REQUIRED:** Uncertainty on Conceivability Type or Imagination Limit.

  ***
  *Disclaimer: This screen tests for possibility, not probability. A scenario can be possible but highly unlikely. Where metaphysical questions arise (consciousness, free will), human expert judgment is required.*

  ---

  ### CONSULTANT'S DEMONSTRATION: RUNNING THE FSVS
  *Per your request, I have applied the FSVS to four test cases to show how it handles edge cases and biases.*

  #### 1. The 4-Hour Work Week (Productivity Doubled)
  *   **Conceivability:** **Thin.** Easy to picture the outcome. **Thick?** Only if a mechanism (AI/Automation) is specified.
  *   **Defeaters:** No logical contradictions. Physical laws intact.
  *   **Imagination Limit:** Unfamiliar economic arrangement, not broken.
  *   **Verdict:** **VIABLE (with conditions).** Requires economic modeling to move from Thin to Thick.

  #### 2. Mind Uploading
  *   **Conceivability:** **Thin.** Sci-fi standard. **Thick?** Problematic.
  *   **Defeaters:** Depends on metaphysics of mind. If consciousness is substrate-dependent (biological), this is a **Conceptual Truth** violation.
  *   **Imagination Limit:** **Unclear.** We do not know if "you" are the software or the hardware.
  *   **Verdict:** **EXPERT REVIEW REQUIRED.** Do not base critical infrastructure on this being *Thickly* conceivable.

  #### 3. No Beliefs/Desires, Unchanged Behavior (Philosophical Zombies)
  *   **Conceivability:** **Thin.** I can say the words. **Thick?** Highly contested.
  *   **Defeaters:** If mental states *are* behavioral dispositions (Ryle), this is a **Logical Contradiction**. If they are inner states (Descartes), it is possible.
  *   **Imagination Limit:** **Unclear.** This is a limit of current philosophy, not necessarily the world.
  *   **Verdict:** **EXPERT REVIEW REQUIRED.** Too philosophically loaded for policy assumption.

  #### 4. The "Free Lunch" Policy (Universal Gain, Zero Cost, No Trade-offs)
  *   **Conceivability:** **Thin.** Very appealing. Politically popular.
  *   **Defeaters:** **Logical/Physical.** Violates scarcity and thermodynamics. "Zero cost" implies no resource allocation, which is impossible in a physical system.
  *   **Imagination Limit:** **Broken.** The blockage is in the world (resource limits), not your head.
  *   **Verdict:** **REJECT.** *Note: This is the scenario you likely want to be true, but the procedure correctly flags it as impossible.*
