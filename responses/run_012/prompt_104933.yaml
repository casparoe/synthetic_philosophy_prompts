  9.  **Formatting:** Use code block or markdown box for the checklist to simulate a document.

  10. **Refining the "Reject a scenario I like"**: The prompt asks me to "Include one where it tells me to reject a scenario I like." This is an instruction for the *test cases*, not necessarily the checklist text itself. I will ensure the test case analysis includes a "Politically Popular but Impossible" scenario.

