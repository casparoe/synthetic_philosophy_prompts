answer: |-
  This is the correct way to approach the problem. The "Paradox of Phenomenal Judgment" (Chalmers, 1996) is often treated as a conversation-ender, but for a serious epiphenomenalist, it is an engineering specification that hasn't been met.

  You are asking for the **requirements document** for a theory that preserves the causal inertness of qualia while explaining the reliability of our talk about them. Below is the spec, the analysis of constraints, the proof of tension, and the evaluation of the standard "Common Cause" move.

  ### Part 1: The Desiderata (The Spec)

  For an epiphenomenalist theory of phenomenal judgment to be viable, it must satisfy the following six criteria.

  **1. Causal Exclusion Compliance**
  *   **Requirement:** No phenomenal property (Q) can appear in the causal history of any physical event (P), including speech acts, neural firings, or button presses.
  *   **Consideration:** This is the definition of epiphenomenalism. If Q causes P, you are an interactionist dualist or a physicalist. If the theory violates this, it is not solving the problem for the epiphenomenalist; it is dissolving the position.

  **2. Judgment Production**
  *   **Requirement:** The theory must account for the fact that physical judgments (J) occur. When I say "I am in pain," vocal cords move and air vibrates.
  *   **Consideration:** Denying the existence of the judgment (solipsism of the moment) is a retreat. We need to explain the *production* of the report within the physical causal chain.

  **3. Systematic Covariation**
  *   **Requirement:** There must be a robust, law-like correlation between specific qualia (Q) and specific judgments (J). Red qualia correlate with "I see red" judgments; pain qualia with "I hurt" judgments.
  *   **Consideration:** If the correlation were random, we would not be able to discuss consciousness coherently. The fact that we can communicate about qualia suggests the mapping is not noise.

  **4. Non-Accidental Correlation (The Tracking Condition)**
  *   **Requirement:** The correlation between Q and J cannot be merely coincidental or miraculous. There must be an explanation for *why* J tracks Q rather than some other variable.
  *   **Consideration:** In science, robust correlation demands a causal explanation or a common cause. If there is no causal link (per #1), the burden shifts to explaining the structural reason for the match. If the match is brute fact, the theory is scientifically inert.

  **5. Intentional Reference**
  *   **Requirement:** The content of the judgment J must be *about* Q, not about the physical substrate P. When I say "I feel pain," I am referring to the feeling, not my C-fibers firing.
  *   **Consideration:** This is the semantic constraint. If J is caused entirely by P, naturalistic theories of reference suggest J refers to P. The theory must explain how J manages to refer to the epiphenomenal Q despite Q playing no role in causing J.

  **6. Error Possibility**
  *   **Requirement:** The theory must allow for the possibility of false phenomenal judgments (e.g., phantom limb pain, confabulation), while explaining why they are the exception rather than the rule.
  *   **Consideration:** If judgments are infallible by definition, the theory becomes tautological. A robust theory explains reliability without guaranteeing it metaphysically.

  ---

  ### Part 2: Non-Negotiables vs. Camp Preferences

  To prevent goalpost-moving, we must distinguish between logical constraints and ideological preferences.

  | Desideratum | Status | Rationale |
  | :--- | :--- | :--- |
  | **1. Causal Exclusion** | **Non-Negotiable** (for Epiphenomenalist) | If you drop this, you are no longer an epiphenomenalist. You have conceded to physicalism or interactionism. |
  | **2. Judgment Production** | **Non-Negotiable** | Denying that physical reports happen is absurd. The data point is the movement of vocal cords/typing fingers. |
  | **3. Systematic Covariation** | **Non-Negotiable** | If this fails, language about consciousness is impossible. We clearly do communicate about it. |
  | **4. Non-Accidental Correlation** | **Non-Negotiable** (Epistemic) | Science rejects "brute correlation" as an explanation. If you accept this as brute, you stop doing metaphysics. |
  | **5. Intentional Reference** | **Contested** | **Physicalists** demand this be satisfied naturalistically. **Dualists** might argue reference is primitive. However, failing this makes the judgment *false* (you think you're talking about Q, but you're talking about P). |
  | **6. Error Possibility** | **Preference** | **Infallibilists** (Cartesians) might reject this. **Fallibilists** (most rationalists) require it. Epiphenomenalism is easier if you allow error (see Illusionism). |

  ---

  ### Part 3: The Incompatibility Tension

  You suspected that Reliability and Causal Inertness are not jointly satisfiable. You are correct, but the failure point is specific. It is not in the *correlation*; it is in the **reference**.

  Here is the tension laid out as a trilemma. You can hold any two, but not all three:

  1.  **Causal Inertness:** Qualia (Q) cause nothing physical (including Judgments J).
  2.  **Causal Theory of Reference:** A mental state or utterance refers to that which caused it (or covaries with it via a causal mechanism).
  3.  **Veridical Reference:** Our judgments ("I have a red quale") refer to the Qualia (Q), not the Physical Brain State (P).

  **The Conflict:**
  If (1) is true, Q is not in the causal history of J.
  If (2) is true, J refers to whatever is in its causal history (which is P, not Q).
  Therefore, J refers to P.
  But (3) says J refers to Q.
  **Contradiction.**

  **The Epiphenomenalist's Dilemma:**
  To resolve this, the epiphenomenalist must drop one.

  *   **Option A: Drop (2) (Causal Theory of Reference).**
      *   *Cost:* You must adopt a non-naturalistic theory of reference (e.g., primitive intentionality, or reference is determined by intrinsic nature). This makes the theory metaphysically "spooky" and isolates it from the rest of cognitive science.
      *   *Result:* You save Veridical Reference, but you lose naturalistic plausibility.

  *   **Option B: Drop (3) (Veridical Reference).**
      *   *Cost:* You admit that when we say "I feel pain," we are *wrong* about what we are referring to. We are actually referring to brain states, but we *think* we are referring to qualia.
      *   *Result:* This collapses into **Illusionism** or **Error Theory**. You save Causal Inertness and Naturalistic Reference, but you admit our phenomenal judgments are systematically false about their own content.

  *   **Option C: Drop (1) (Causal Inertness).**
      *   *Cost:* You are no longer an epiphenomenalist.
      *   *Result:* Physicalism or Interactionism.

  **Conclusion on Tension:** You cannot have a naturalistic theory of reference, veridical judgments, and epiphenomenal qualia simultaneously. The "Paradox of Phenomenal Judgment" is essentially a proof that **Epiphenomenalism + Naturalism = Error Theory.**

  ---

  ### Part 4: Evaluating the "Standard Move"

  > *"The judgments are caused by the brain states that correlate with the qualia."*

  This is the **Common Cause** model.
  *   Physical State (P) causes Quale (Q).
  *   Physical State (P) causes Judgment (J).
  *   Therefore, Q and J correlate, but Q does not cause J.

  **Does it satisfy the Desiderata?**

  1.  **Causal Exclusion:** **PASS.** Q still does not cause J.
  2.  **Judgment Production:** **PASS.** P causes J.
  3.  **Systematic Covariation:** **PASS.** Since P causes both, they covary nomically (assuming psychophysical laws hold).
  4.  **Non-Accidental Correlation:** **PASS.** The common cause P explains the correlation statistically.
  5.  **Intentional Reference:** **FAIL.**
      *   *Why:* This is where the move relabels the problem rather than solving it.
      *   If P causes J, then on any causal/informational account of content, the content of J is "P is occurring."
      *   However, the *phenomenology* of the judgment is "Q is occurring."
      *   The Common Cause model explains why I say "Red" when I see Red, but it does not explain why my statement means *Experience of Red* rather than *V4 Neuron Firing*.
      *   Unless you posit a magical link where P causes J to *mean* Q without Q causing J, the judgment is a **misrepresentation**. The subject believes they are reporting on Q, but the causal machinery is only sensitive to P.
  6.  **Error Possibility:** **PASS (technically).** It implies all positive phenomenal judgments are technically errors of reference (referencing P while thinking Q).

  **Verdict on Standard Move:** It satisfies the *statistical* requirements (Covariation) but fails the *semantic* requirements (Reference). It explains why the words come out, but not why the words mean what we think they mean. It turns phenomenal judgment into a systematic delusion about the *object* of the judgment.

  ---

  ### Part 5: Scorecard of Standard Moves

  Here is how existing frameworks score against the Desiderata, specifically focusing on the **Reference** and **Inertness** tension.

  | Theory | Causal Inertness | Covariation | Intentional Reference (Naturalistic) | Veridicality (Are we right?) | Cost |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Standard Epiphenomenalism** (Common Cause) | **YES** | **YES** | **NO** | **NO** (Systematic Error) | Admits we are wrong about what we are referring to. |
  | **Pre-Established Harmony** (Leibnizian) | **YES** | **YES** | **MAYBE** | **YES** | Requires miraculous coordination (God/Chance). Violates parsimony. |
  | **Identity Theory** (Physicalism) | **NO** (Q=P) | **YES** | **YES** | **YES** | Denies the hard problem; qualia are physical states. |
  | **Interactionist Dualism** | **NO** (Q->P) | **YES** | **YES** | **YES** | Violates causal closure of physics. |
  | **Illusionism** (Frankish/etc.) | **YES** (Q doesn't exist) | **N/A** | **YES** (About P) | **N/A** (Judgments are useful fictions) | Denies the existence of the phenomenon to be explained. |
  | **Panpsychism** | **MAYBE** | **YES** | **MAYBE** | **YES** | Combination problem; doesn't fully solve reference without causal power. |

  ### Summary for the Thread

  If you want to press the epiphenomenalist in a thread, do not ask "How do we know?" Ask **"What is the causal history of the reference?"**

  The epiphenomenalist can explain why the judgment *happens* (Common Cause). They cannot explain why the judgment is *about the quale* rather than the *cause of the quale* without abandoning naturalistic accounts of reference.

  If they insist the judgment is about the quale, they must explain how a term acquires reference to an entity that plays no role in the term's tokening. If they cannot, they must concede that our phenomenal judgments are systematically mistaken about their own intentional content. That is the specific cost of the view.
