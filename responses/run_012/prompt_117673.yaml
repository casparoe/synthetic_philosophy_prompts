answer: |-
  **Brainstorm**

  The split between (v) and (vi) suggests obligation turns on *intent to obligate*, not just words spoken. In (v), you intend to bind yourself; in (vi), you intend social lubrication. This kills pure reliance theories. The split between (vii) and (ix) suggests obligation attaches to the *relationship's continuity* or the *solemnity of the act*, not just the promisee's current capacity to claim rights. Your "void vs. outweighed" intuition is robust: (ii) and (iii) invalidate the bond (fraud, harm), while (i) competes with it (emergency). A viable principle must distinguish creating an obligation from creating an expectation. It must explain how authority is transferred without reliance, and how duties survive the death of the creditor. The core tension is between promising as harm-prevention versus promising as a normative power exercise.

  **Candidate principles**

  1.  **The Reliance Principle:** You are obligated if and only if you intentionally caused the promisee to believe you would act, and they relied on that belief to their potential detriment. This captures the harm in breaking plans (Case i) and the duty to notify. However, it fails to explain why you are bound in (v) where no one knows, or (ix) where the promisee cannot rely. It reduces promising to a species of negligence prevention.

  2.  **The Authority Principle:** You are obligated if and only if you intentionally invoked a social convention that grants the promisee authority to demand your performance. This explains why (vi) fails (no intent to transfer authority) while (v) succeeds (intent present). It treats promises as exercising a normative power. However, it struggles with (ix), as authority typically dissolves upon the death of the authority-holder unless explicitly preserved.

  3.  **The Fidelity Principle:** You are obligated if and only if breaking the word would betray the trust constitutive of your specific relationship, regardless of reliance or authority. This handles (vii) and (ix) by focusing on respect for the relationship's history. It explains the "tighter bind" of the dying father. However, it risks making (v) too weak if the colleague relationship is thin, and makes obligations vague compared to the sharpness of promising.

  **Case-by-case**

  (i) All permit bail; Reliance demands notification/compensation, Authority/Fidelity see residual honor.
  (ii) All agree void; conditions of validity (truth/safety) were never met.
  (iii) All agree void; higher moral duty invalidates the promise's legitimacy.
  (iv) All agree bound; preference outweighed by obligation across the board.
  (v) Reliance fails (no knowledge); Authority/Fidelity bind (intent/relationship integrity).
  (vi) All agree not bound; no intent to obligate or rely, merely social ritual.
  (vii) Reliance fails (dead); Authority/Fidelity bind (solemnity/relationship weight).
  (viii) All agree not wronging others; self-obligation is prudential, not normative.
  (ix) Reliance fails; Authority shaky (dead); Fidelity binds (respect for past relationship).
  (x) All agree not bound; incapacity negates intent to invoke convention or create reliance.

  **Cases I didn't give you**

  1.  **The Stranger's Direction:** You promise a stranger directions, then realize you're wrong. *Verdict:* Bound to correct, not necessarily guide. *Reasoning:* Authority Principle limits scope to intent; Reliance Principle limits scope to harm caused.
  2.  **The Dead Man's Secret:** You promise a dying friend never to reveal a secret that harms no one. *Verdict:* Bound. *Reasoning:* Fidelity Principle holds; Authority Principle struggles unless authority survives death.
  3.  **The Coerced Promise:** "Promise to marry me or I jump." You promise. *Verdict:* Void. *Reasoning:* All principles agree validity requires voluntary invocation of authority/trust.
  4.  **The Forgotten Promise:** You promise to call, genuinely forget, no harm done. *Verdict:* Wrong, but minor. *Reasoning:* Authority Principle says obligation existed regardless of memory; Reliance says wrong only if discovered/harmed.

  **What I have to give up**

  The **Reliance Principle** must give up (v), (vii), and (ix). It cannot explain obligations without an audience. I would tell you this principle reduces promising to risk-management, missing the intrinsic wrong of breaking faith. The **Authority Principle** must give up (ix) unless you argue authority survives death, which is metaphysically tricky. I would tell you this requires viewing the promise as binding the *living* to the *dead's will*, not the dead's authority. The **Fidelity Principle** must give up the sharpness of (ii); if promising is just relationship maintenance, fraud might just be a strain on the bond, not a voidance. I would tell you this blurs the line between promising and general loyalty.

  **Bottom line**

  I endorse a repaired **Authority Principle**: promising is wrong because you intentionally transferred control over a choice to another, creating a right they hold against you. This handles (v) vs (vi) via intent, and (i) vs (ii) via validity conditions. The single strongest reason to doubt it is that it struggles to explain the *source* of this power—why does saying "I promise" actually grant someone authority over you?—without smuggling in reliance or social utility anyway.
