answer: |-
  Here is the principle that best organizes your intuitions, followed by the necessary sacrifices and the advice for your ending.

  ### The Principle: Constitutive Debt

  An apology is real if and only if it satisfies two conditions:

  1.  **The Clause of Assumed Liability:** The speaker must assert the wrong as a debt of their *current* identity. This identity may be established through direct agency, institutional continuity, or the inheritance of specific benefits derived from the wrong. It cannot be established through mere proximity or shared geography.
  2.  **The Clause of Structural Truth:** The speech act must not be coerced by external penalty, must not obscure the nature of the act through language, and must not be contradicted by the speaker's ongoing conduct.

  **Motivation for the Clauses:**
  *   **Assumed Liability** is motivated by your **German State** and **Descendant of Slaveholders** verdicts. In both, the speaker accepts a debt they did not personally incur but which is constitutive of their current standing (the new state's legitimacy; the descendant's wealth/status). It excludes the **Seceded Empire** and the **Citizen Opposing War** verdicts, where the speaker claims no continuity and inherits no specific benefit, rendering the debt "someone else's."
  *   **Structural Truth** is motivated by your **Legal Settlement**, **Euphemism**, and **Ongoing Wrong** verdicts. These fail not because the speaker lacks standing, but because the context (coercion, falsehood, contradiction) negates the speech act. It explains why the **Church/University** apology feels real despite the continuity problem: the wrong violated the institution's *mission*, so acknowledging it restores the institution's truth, whereas the State's mission is order, not moral purity.

  ### Application to New Cases

  **Case 1: The Institution (A Hospital)**
  A modern hospital apologizes for unethical medical experiments conducted on patients by its doctors fifty years ago. The current staff had no part in it, but the hospital retains the reputation and endowment built during that era.
  *   **Verdict:** **Real Apology.**
  *   **Reasoning:** It satisfies *Assumed Liability* through institutional continuity and the inheritance of benefit (reputation/endowment). It satisfies *Structural Truth* provided they are not currently experimenting unethically.

  **Case 2: The Family (A Wife)**
  A wife apologizes to her neighbors for a noise nuisance caused exclusively by her husband, from whom she is financially dependent but emotionally estranged. She did not participate in the noise, nor does she benefit from it (it disturbs her too), but she shares the address.
  *   **Verdict:** **Hollow Apology.**
  *   **Reasoning:** It fails *Assumed Liability*. She inherits the *location* of the wrong, but not the *benefit* or the *agency*. She is apologizing for proximity, which your principle defines as insufficient (cf. the Citizen Opposing War). It is a peacekeeping gesture, not a moral reckoning.

  ### The Verdicts You Must Give Up

  No principle can save every intuition without becoming a description of your psychology rather than a tool for judgment. To make this principle precise enough to use, you must surrender two verdicts.

  **1. The "Presumptuous Citizen"**
  You wrote: *"A citizen apologizing to a foreign people for a war their government waged and they themselves opposed seems to me faintly presumptuous. That is backwards, and I know it."*
  *   **The Principle's Judgment:** The principle agrees it is not a "real apology" (it fails Assumed Liability), but it rejects the label **presumptuous**.
  *   **Why Give It Up:** Presumption implies an overstepping of bounds. A citizen offering sorrow for their country's sin, despite having no agency, is not overstepping; they are *groundless*. There is a tragedy in that groundlessness, not a sin. If you keep "presumptuous," you condemn the human impulse to share in collective grief. If you change it to "groundless," you allow the character to be tragic rather than arrogant. This is richer for a novel.

  **2. The "Repeated Apology"**
  You wrote: *"A state that has apologized four times for the same wrong... makes me feel that the fourth debases the first three."*
  *   **The Principle's Judgment:** The principle cannot account for this. If the first three were valid (Liability + Truth), the fourth should also be valid.
  *   **Why Give It Up:** This verdict is about *audience fatigue*, not the nature of apology. In a novel, a character who apologizes repeatedly is often seen as weak, but if the wrong is ongoing or the forgiveness withheld, repetition may be the only honesty left. Do not let a rule about diminishing returns stop a character from trying again.

  ### Complexity vs. Simplicity

  **Take the Simple Principle.**
  A complicated principle that saves every verdict will read like a rationalization of your biases. A simple principle that overturns one or two creates **dramatic tension**.

  If your character operates under the *Principle of Constitutive Debt*, they will believe the Citizen's apology is invalid. If you, the author, know that the Citizen's apology is actually the most human moment in the book, you have created irony. The character seeks a "real" apology (German style), but the story delivers a "groundless" one (Citizen style). That gap is where the meaning lives.

  ### The Final Scene

  End the book with the **Citizen Apology**.

  Do not end with the German-style apology (calculated, valid, institutional). That is a legal settlement of the soul. End with the citizen standing before a foreign crowd, having no authority, inheriting no benefit, owning no agency, and saying "I am sorry" anyway.

  By your principle, it is not a real apology. By your heart, it is the only one that matters. Let the book reside in that contradiction. The principle tells you what an apology *is*; the ending should tell you what an apology *is for*.
