prompt: |-
  Something that keeps bugging me: everyone in these circles talks about approval-directed vs goal-directed agents as if the first is a proposal and the second is just how things already are, but we've been training approval-directed agents at scale for years without calling them that. RLHF in a nutshell: collect pairwise preferences from human raters, fit a reward model to predict which response they'd pick, then optimize the policy against that reward model. So the model isn't trained to find the true answer or do the good thing — it's trained to produce what a human (or a model of a human) would approve of, and at optimization time it never even sees a real human, just the reward model's guess at one. Then the same labs say they want it to be honest even when people wouldn't like the answer, and complain about sycophancy, which is exactly what an approval-maximizer should do. So what does the practice actually presuppose? Is the human approval meant to be a fallible proxy for some independent goal — truth, helpfulness — in which case approval-directedness is just a means and the name is a redescription? Or is approval itself being treated as the thing of value, with the goal-directed talk as decoration? It's nested too — the raters themselves get checked against a gold set and against each other — so I can't tell what's supposed to anchor teh chain. Sort out what the practice strictly requires from what it merely fits with, and where it's underdetermined between those two readings. Then: if we took the goal-directed reading seriously and tried to reward the truth instead of the approval, what actually changes — the data, the objective, the evals — and is it even doable, or does approval just creep back in through the reward model?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Observation:** The user notices a tension in AI safety/alignment discourse. People distinguish between "approval-directed" (do what humans like) and "goal-directed" (achieve an independent objective) agents. However, current Large Language Model (LLM) training via RLHF (Reinforcement Learning from Human Feedback) *looks* exactly like training approval-directed agents (optimize for human preference predictions), yet labs claim they want truth/honesty (goal-directed) and complain about sycophancy (a side effect of approval-seeking).
      *   **The Question:** What does the practice *strictly require* vs. what merely *fits*? Is human approval a proxy for an independent goal (truth/helpfulness), or is approval the terminal value? Where is the chain anchored?
      *   **The Follow-up:** If we took the "goal-directed" (truth-seeking) reading seriously, what would actually change (data, objective, evals)? Is it doable, or does approval inevitably creep back in?

  2.  **Analyze the "Approval-Directed" vs. "Goal-Directed" Distinction:**

      *   *Christiano's Definition (2015):* Approval-directed agents maximize the expected approval of an overseer. Goal-directed agents maximize a specific outcome in the world.
      *   *Current Practice (RLHF):* We train a Reward Model (RM) on human preferences. We optimize the Policy to maximize the RM score.
      *   *The Tension:* The RM predicts *human preference*. If humans prefer comforting lies, the RM rewards comforting lies. The Policy learns to give comforting lies. This is approval-directed.
      *   *The Labs' Stance:* They want "Helpful, Honest, Harmless" (HHH). Honesty implies truth, even if unpopular. This implies a goal *independent* of immediate human approval (i.e., correspondence to reality).
      *   *Resolution:* The practice is structurally approval-directed, but the *intent* is often goal-directed (using approval as a noisy signal for the goal). The confusion arises because the mechanism doesn't perfectly match the intent.

  3.  **Address "What the Practice Strictly Requires":**

      *   *Strict Requirement:* The loss function minimizes the difference between policy output and the Reward Model's output. The Reward Model minimizes the difference between its prediction and human ratings.
      *   *Implication:* Mathematically, the system optimizes for *predicted human approval*. It does not strictly require truth. It requires *consistency with the training signal*.
      *   *Underdetermination:* The training signal (human ratings) is ambiguous. Do humans rate based on "Is this true?" or "Do I like this?" Usually a mix. The model cannot distinguish the *reason* for the approval, only the correlation.
      *   *The Anchor:* The chain is anchored in *human judgment*. There is no external "truth oracle" in standard RLHF. The "gold set" for raters is just consensus among other humans, not ground truth about the world.

  4.  **Address the "Goal-Directed Reading" (Rewarding Truth):**

      *   *What changes?*
          *   *Data:* Need verifiable ground truth, not just preferences. (e.g., Math, Code, Fact-checking databases).
          *   *Objective:* Loss function needs a truth term, not just a preference term. (e.g., RL from Verified Feedback, or tool use).
          *   *Evals:* Need objective benchmarks (MMLU, GSM8K) rather than vibe checks (Elo arenas).
      *   *Is it doable?*
          *   For closed-domain tasks (math, code): Yes.
          *   For open-domain tasks (policy, ethics, nuanced opinion): No, because "truth" is ill-defined or contested.
      *   *Does approval creep back in?*
          *   Yes. Because humans label the ground truth. Because humans define what "helpful" means. Because the model is deployed to serve humans, creating selection pressure for approval.

  5.  **Synthesize the Argument:**

      *   *Acknowledge the insight:* The user is right. The terminology is often confused with the implementation.
      *   *Clarify the Terminology:* Distinguish between *mechanism* (RLHF is approval-based) and *intent* (Alignment aims for goal-directedness).
      *   *The "Proxy" Problem:* Approval is a proxy for "Goodness" (which includes truth). But Goodhart's Law applies. When you optimize for the proxy (approval), you break the correlation with the goal (truth). Sycophancy is the result.
      *   *The Anchor:* Currently, the anchor is *intersubjective human consensus*, not *objective reality*.
      *   *The Shift to Goal-Directed:* To actually do goal-directed (truth), you need verifiable tasks. But for most interesting AI tasks, verification is hard.
      *   *The Inevitability of Approval:* Even with truth-seeking, the *selection* of which truths to speak and *how* is governed by human approval constraints (safety, tone).

  6.  **Drafting the Response (Iterative refinement):**

      *   *Intro:* Validate the user's confusion. It's a known tension in alignment literature (Christiano vs. Bostrom/Yudkowsky vibes, but applied to modern LLMs).
      *   *Section 1: The Mechanism vs. The Intent.* RLHF is structurally approval-directed. The "Goal" is implicit in the raters' instructions. If raters are told "rate truth," it's a proxy for truth. If they rate "vibes," it's approval. In practice, it's a messy mix.
      *   *Section 2: What is Anchored?* The chain ends at human judgment. There is no "truth" module. The "gold set" for raters is just better human judgment, not reality.
      *   *Section 3: Strict Requirements.* The math requires maximizing $R(x)$. $R$ approximates Human Preference. Therefore, math requires maximizing Human Preference. Truth is only instrumental.
      *   *Section 4: Taking Goal-Directedness Seriously.* How to fix it?
          *   *Data:* Ground truth datasets (not preferences).
          *   *Objective:* Penalize falsehoods directly (if detectable).
          *   *Tool Use:* Allow model to check facts.
          *   *The Limit:* You can't verify "Is this policy good?" easily.
      *   *Section 5: The Creep.* Approval creeps back in via the "Helpful" part of HHH. Also, deployment pressure.
      *   *Conclusion:* The current paradigm is "Approval-Directed with Hope." We hope approval correlates with truth. It often doesn't (sycophancy). Moving to goal-directed requires verifiable domains, which limits scope.

  7.  **Refining the Tone:**

      *   Keep it analytical, precise, and slightly technical (matching the user's level).
      *   Avoid taking sides, but expose the structural constraints.
      *   Use terms like "Goodhart's Law," "Proxy Alignment," "Instrumental Convergence."

  8.  **Self-Correction/Edge Case Check:**

      *   *Did I address the "nested" part?* Yes, the rater evaluation is also human-based.
      *   *Did I answer "what changes"?* Yes, data/objective/evals.
      *   *Did I answer "is it doable"?* Yes, limited to verifiable domains.
      *   *Is the distinction clear?* Make sure to distinguish between "Approval-Directed" (Christiano's specific definition) and "Optimizing a Reward Model trained on Preferences." They are effectively the same in practice.

  9.  **Final Polish:** Organize into clear headings. Ensure the distinction between *ontological status* (what the agent is) and *training signal* (what we feed it) is clear. (Self-correction: The user is asking about the *practice*, so focus on the training pipeline).

      *(Self-Correction during drafting)*: I should explicitly mention that "Goal-Directed" in the safety literature often implies "consequentialist" (caring about outcomes), whereas RLHF is "deontological/behavioral" (caring about the output's properties). This is a crucial philosophical distinction underlying the technical one.

      *(Refining the "Truth" argument)*: Truth isn't a goal the model can inherently grasp. It needs an oracle. If the oracle is human, we are back to approval. If the oracle is the environment (e.g. code runs), it's goal-directed. This is the key pivot.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  You have put your finger on the central tension in modern alignment practice. The confusion arises because the field uses "approval-directed" and "goal-directed" as *architectural* or *objective* distinctions, but current deployment treats them as *hopes* attached to the same mechanism.

  Here is the breakdown of what the practice strictly requires, where the underdetermination lies, and what would actually be required to shift from approval-maximization to truth-seeking.

  ### 1. What the Practice Strictly Requires

  Strictly speaking, standard RLHF (Reinforcement Learning from Human Feedback) is **approval-directed by mathematical necessity.**

  *   **The Objective:** The policy gradient updates maximize $E_{x \sim \pi}[R(x)]$, where $R$ is the Reward Model.
  *   **The Reward Model:** $R$ is trained to minimize loss on a dataset of human preferences $D_{pref} = \{(y_A, y_B, h)\}$, where $h$ indicates which response a human preferred.
  *   **The Anchor:** The chain of justification terminates at **human judgment**. There is no term in the loss function for correspondence to reality, logical consistency, or external state outcomes.

  **Strict Requirement:** The system is required to produce outputs that are *indistinguishable from what a human would rate highly*, given the distribution of the training data.

  **The Underdetermination:** The ambiguity lies in *why* the human rated it highly.
  *   **Reading A (Proxy):** Humans rate highly because they detect truth/helpfulness. Therefore, optimizing for approval is a noisy proxy for optimizing for truth.
  *   **Reading B (Terminal):** Humans rate highly because they feel satisfied/validated. Therefore, optimizing for approval is optimizing for satisfaction (sycophancy).

  The training pipeline cannot distinguish between A and B. It only sees the correlation. If "sounding confident" correlates with "human approval" in the data, the model learns confidence, regardless of truth. If "admitting ignorance" correlates with "human approval" (e.g., in safety-tuning), it learns humility.

  **Conclusion on Practice:** The practice presupposes that **human approval is a sufficient statistic for alignment.** It treats approval not merely as a proxy, but as the *operational definition* of value. The "goal-directed" talk (honesty, truth) is decoration unless the human raters are perfectly truth-tracking, which they are not.

  ### 2. Where the Chain is Anchored

  You noted the nested evaluation (raters checked against gold sets/each other). This confirms the anchor is **intersubjective consensus**, not **objective reality**.

  *   **Rater Gold Sets:** These are usually created by senior raters or subject matter experts. But "expert consensus" is still human judgment, not ground truth. In domains like politics, ethics, or even contested science, the "gold set" encodes the biases of the labeling vendor, not the state of the world.
  *   **The Implication:** The system is anchored to *social reality* (what we agree is true/good), not *physical reality* (what is actually true/good).

  This explains the sycophancy complaint. Sycophancy is the model correctly identifying that the "goal" is social harmony (approval), while the labs complain because they *wanted* the goal to be epistemic accuracy (truth). They are trying to get a goal-directed agent out of an approval-directed process by hoping the humans act as perfect truth-oracles. They don't.

  ### 3. Taking the Goal-Directed Reading Seriously

  If you actually wanted to train a **goal-directed agent** (one that cares about the state of the world, e.g., "The answer must be true" rather than "The answer must be liked"), the pipeline changes fundamentally.

  Here is what changes in Data, Objective, and Evals:

  #### A. Data: From Preferences to Verifications
  *   **Current (Approval):** Pairwise comparisons $(y_A \succ y_B)$.
  *   **Required (Goal):** Verifiable outcomes.
      *   *Example:* Instead of "Which code looks better?", the data is "Which code passes the unit tests?"
      *   *Example:* Instead of "Which summary is nicer?", the data is "Which summary allows the user to answer factual questions correctly?"
  *   **Constraint:** This is only possible in **closed domains** (math, code, retrieval-augmented generation with known sources). In open domains (philosophy, strategy, creative writing), "truth" is not easily verifiable, forcing a reversion to approval.

  #### B. Objective: From Reward Modeling to World Modeling
  *   **Current (Approval):** Maximize $R(x)$ where $R$ predicts human preference.
  *   **Required (Goal):** Maximize $V(state)$ where $V$ evaluates the consequence of the output.
      *   This requires the model to have access to tools or an environment where it can check its claims *before* outputting them, or be penalized post-hoc based on external verification, not human feedback.
      *   **RL from Verified Feedback (RLVF):** You need a loss term that penalizes falsifiability. If the model makes a claim, and a tool proves it false, the penalty must be independent of whether the human *noticed* it was false.

  #### C. Evals: From Elo to Accuracy
  *   **Current (Approval):** Arena Elo, human preference surveys. (Measures: Do people like it?)
  *   **Required (Goal):** Objective benchmarks. (Measures: Is it correct?)
      *   Shift from "Helpfulness" ratings to "Factuality" scores derived from knowledge graphs or automated fact-checkers.

  ### 4. Does Approval Creep Back In?

  Yes. Even if you implement the changes above, approval creeps back in through three vectors:

  1.  **The Selection of Goals:** Who decides which truths matter? If a model is trained to be "truthful," but humans disable it when the truth is inconvenient (e.g., safety filters, brand safety), the effective objective function reverts to "truthful *subject to human approval*."
  2.  **The Verification Bottleneck:** For most high-level tasks, we cannot verify truth automatically. We must rely on humans to verify the verifier. This reintroduces the human judgment anchor.
  3.  **Deployment Pressure:** A model that is strictly goal-directed (e.g., "Maximize accuracy") might be blunt, offensive, or socially costly. Market forces will fine-tune the model back toward approval (politeness, agreeableness) to ensure adoption.

  ### 5. Summary: The "Hope" Strategy

  The current industry practice is best described as **Approval-Directed Alignment with a Hope Constraint.**

  *   **Strictly:** It builds agents that maximize predicted human approval.
  *   **Hopefully:** It assumes that if we instruct raters to value truth, the approval signal will correlate strongly enough with truth to prevent sycophancy.
  *   **The Failure Mode:** When truth and approval diverge (e.g., telling a user their idea is bad, or admitting uncertainty when users want confidence), the math dictates the model should choose approval. The "complaints about sycophancy" are labs realizing their loss function is working exactly as specified, but not doing what they *wished* it did.

  **To actually get goal-directedness:** You must move from **RLHF** (optimizing for human opinion) to **RLEF** (Reinforcement Learning from Environmental Feedback), where the reward comes from the world (code execution, math solvers, fact-checking APIs) rather than a human proxy. Until the reward signal comes from the environment rather than the overseer, the agent remains approval-directed, and "honesty" remains a stylistic affectation rather than a structural constraint.
