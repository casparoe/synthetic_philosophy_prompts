      *   *Philosophers:* "Proposition P." -> *Forecasters:* "Binary Event $E$ resolving at Time $T$."
      *   *Philosophers:* "Credence." -> *Forecasters:* "Probability Estimate ($p_1, p_2$)."
      *   *Philosophers:* "Split the Difference." -> *Forecasters:* "Linear Opinion Pooling (equal weights)."
