answer: |-
  **Delusional Skepticism of Psychopathology (DSP)**

  **Diagnostic Criteria**

  **A.** Persistent belief, lasting at least 6 months, that categories of mental disorder listed in this manual are metaphorical constructs rather than genuine medical diseases, despite evidence to the contrary provided by qualified health professionals.

  **B.** The belief causes clinically significant distress or impairment in social, occupational, or other important areas of functioning. Impairment is specifically defined as: (1) refusal to adhere to prescribed pharmacological or behavioral regimens; (2) persistent argumentation with treating clinicians regarding the validity of the diagnosis; or (3) alienation of support networks due to ideological rigidity.

  **C.** The disturbance is not attributable to the physiological effects of a substance (e.g., alcohol, stimulants) or another medical condition (e.g., temporal lobe epilepsy, neurocognitive disorder).

  **C. Specifiers**
  *   **With Philosophical Training:** Individual possesses formal education in philosophy, physiology, or related humanities, utilized to rationalize the delusion.
  *   **Without Insight:** Individual denies that the skepticism itself constitutes a symptom. *Note: Lack of insight is the primary indicator of severity.*
  *   **Remission:** Achieved when individual accepts the diagnostic label and complies with treatment.

  **Prevalence**
  Precise prevalence is unknown due to the nature of the disorder; individuals meeting Criterion A typically reject the epidemiological frameworks used to estimate prevalence.^1 Estimates suggest higher rates in academic settings and among retired laboratory personnel. Gender ratio is approximately 1:1, though males are more likely to present with combulative specifiers.

  **Development and Course**
  Onset is typically in late adulthood, often following a career in empirical sciences or upon exposure to contrarian literature. The course is chronic if untreated. Prognosis is favorable only when the individual acknowledges the validity of the manual governing their diagnosis. Resistance to this acknowledgment is interpreted as confirmation of the disorder's severity, creating a self-sustaining cycle.

  **Risk and Prognostic Factors**
  *   **Temperamental:** High need for cognitive closure regarding nosological boundaries.
  *   **Environmental:** Exposure to debates regarding the demarcation problem between disease and deviance.
  *   **Genetic:** No specific markers identified; however, heritability of skepticism is suspected in families with high educational attainment.

  **Functional Consequences**
  The primary consequence is the disruption of the therapeutic alliance. Individuals may remain high-functioning in non-clinical domains (e.g., maintaining households, managing finances), which often masks the severity of the psychopathology. Functional impairment is deemed present when the individual successfully argues against the necessity of their own care, thereby preventing clinical intervention.

  **Differential Diagnosis**
  *   **Schizophrenia Spectrum Disorders:** Unlike DSP, schizophrenia involves hallucinations or disorganized speech. Individuals with DSP typically present with coherent, logical argumentation, which distinguishes the condition from formal thought disorder but confirms the presence of ideological overvaluation.
  *   **Major Neurocognitive Disorder:** Memory loss or organic brain disease must be ruled out via assay. If neurological pathology is found, the skepticism is attributed to the lesion. If no lesion is found, the skepticism is attributed to DSP.
  *   **Normal Philosophical Inquiry:** Distinguished by the presence of distress or impairment (Criterion B). An individual may question diagnostic validity without pathology provided they adhere to treatment plans and do not experience interpersonal conflict regarding their views. ^2

  **Culture-Related Diagnostic Issues**
  DSP is more prevalent in cultures emphasizing individual autonomy and empirical verification. In subcultures focused on human rights or civil liberties, symptoms may be normalized as advocacy, delaying diagnosis. Clinicians must assess whether the skepticism is culturally sanctioned or indicative of individual pathology; however, the final determination rests on clinical judgment regarding the necessity of treatment compliance.

  ***

  ^1 *The category was added to this manual following a majority vote of the Assembly during the revision process. Prevalence figures include all persons who formally disputed the vote.*
  ^2 *Functional impairment may be inferred if the individual remains asymptomatic by their own report but is reported as impaired by family or clinicians.*
