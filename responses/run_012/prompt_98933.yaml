answer: |-
  Dear Colleague,

  It is a pleasure to engage with this argument, which you have reconstructed with admirable clarity. What you have presented is a version of the famous Bradley Regress applied to the metaphysics of propositions, and it is entirely appropriate that you find the conclusion suspicious given your commitment to the existence of propositions and their structured unity. Before settling on a specific diagnosis, I considered three primary candidates for where the argument might fail. First, one might reject step four and argue that the infinite chain of unifying relations is benign rather than vicious, suggesting that unity is simply the existence of the chain itself. Second, one might reject step one or two by denying that propositions are unified entities in the sense required, perhaps treating them as mere sets or linguistic constructs where unity is imposed by the mind rather than found in the world. Third, one might reject step six by denying that a mode of combination must be an entity that stands in a relation to the constituents it combines. While each of these moves has defenders, I believe the third option offers the most philosophically robust path forward for someone with your commitments.

  I recommend rejecting step six of your argument. This step claims that a non-entity, such as a mode of combination, cannot bind constituents unless it is related to them, and that any such relation is itself an entity. This step looked compelling because it relies on a deeply ingrained ontological habit of reification, where we assume that any contributor to the truth or existence of a complex must itself be a distinct object or relatum within that complex. We tend to think that if a relation binds two things, there must be a further link connecting the relation to the things, much like a physical glue must touch the surfaces it adheres. However, this assumes that the mode of combination is a constituent that needs connecting, rather than the manner in which the constituents exist. By rejecting step six, you avoid the regress because you deny that the unity requires a further entity to relate it to the parts; the unity is provided by the categorial nature of the constituents themselves, specifically that some are unsaturated and demand completion by others.

  The cost of rejecting step six is significant, however, as it requires you to abandon the idea that all constituents of a proposition are of the same ontological category. You must accept a form of ontological heterogeneity where some constituents, typically the predicative ones, are incomplete or unsaturated entities that cannot exist independently, while others are complete objects. This commits you to a Fregean distinction between concepts and objects, which some find metaphysically mysterious because unsaturated entities are not easily pictured as items in the world. Furthermore, it costs you the simplicity of a flat ontology where everything is just an object related by external relations. You must instead embrace a structured ontology where the form of the proposition is determined by the fit between saturated and unsaturated parts, meaning that the unity is internal to the nature of the constituents rather than externally imposed by a further relation.

  Regarding the standard responses you mentioned from your friends, I find the view that constituents are incomplete in a way that makes them combine without any external binder to be the least costly. The suggestion that the regress is benign often feels like an admission of explanatory defeat, as it leaves the fundamental nature of unity unexplained, merely pushing the problem back infinitely. The view that propositions are not structured at all contradicts your desire to maintain that the arrangement of constituents matters, such as the difference between the cat being on the mat and the mat being on the cat. If propositions were unstructured sets, these two would be identical, which violates your condition about truth-conditions being determined by constituents and their arrangement. The incomplete constituents view preserves the structure and the truth-conditional dependence while blocking the regress at the first step by denying that the predicative constituent needs a further glue to attach to the object.

  Finally, the idea you describe as a mode of combination can indeed be saved, but only if it is understood not as an extra ingredient but as the predicative structure inherent in the unsaturated constituent. If you treat the mode of combination as a separate entity, you fall back into the regress of step three and four. However, if you identify the mode of combination with the unsaturatedness of the concept itself, it ceases to be a non-entity that needs binding and becomes the very principle of unity. This allows you to maintain that the proposition is a unified entity distinct from a mere collection, satisfying your first premise, while also maintaining that propositions exist, satisfying your ninth premise. You can hold that the truth-condition is determined by the constituents because the unsaturated constituent carries the requirement for combination within its own nature, ensuring that the cat and the mat are combined in the specific way required for the proposition to be true. This approach respects your intuition that arrangement matters without inviting the vicious regress that threatens to dissolve the proposition entirely. I hope this diagnosis helps you resolve the tension in your seminar argument.
