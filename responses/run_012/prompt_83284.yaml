answer: |-
  You have identified a genuine and profound structural problem in political philosophy and systems theory. You are right to feel that there is a "shape" here that transcends the specific example of tolerance.

  To answer your first question directly: **No, there is no single, universally agreed-upon noun phrase that captures this general shape across all contexts (speech, markets, elections, tolerance) other than descriptive compounds.**

  However, there are several overlapping concepts that name parts of this shape. Depending on which discipline you ask, you will hear it called:

  1.  **The Immunological Paradigm:** In systems theory and political theology, this is the idea that a system (a body, a society) must identify and attack "non-self" elements to survive. The risk, as you noted, is **autoimmunity**: the system attacks itself in the process of protecting itself.
  2.  **Militant [X]:** The specific political term is **Militant Democracy** (*wehrhafte Demokratie*). It describes a democracy that restricts certain rights to prevent the abolition of democracy. One could generalize this to "Militant Liberalism" or "Militant Free Speech," though those terms are less standard.
  3.  **Recursive Self-Limitation:** In logic and legal theory, this describes a rule that applies to itself to ensure its own continuity.
  4.  **The State of Exception:** Coined by Carl Schmitt (more on him below), this describes the moment when the normal rules are suspended to save the state.

  The reason you cannot find a single clean label is likely because the "shape" is not considered a stable logical category, but rather a **danger zone**. It is a move that philosophers generally treat with extreme suspicion because, as you correctly intuited, it is structurally indistinguishable from tyranny unless carefully constrained.

  ### The Carving: How to Distinguish Defense from Pretext

  You asked for the "carving"—what makes the difference between a case where the value would genuinely be destroyed versus a case where someone is using the threat to silence a rival?

  The uncomfortable truth is that **logically, there is no difference.** The argument structure is identical in both cases.
  *   *Case A (Legitimate):* "We must ban Party X because they plan to abolish elections."
  *   *Case B (Pretextual):* "We must ban Party Y because their policies will ruin the country."

  Both claim that allowing the rival to compete destroys the system. To distinguish them, we cannot look at the *logic*; we must look at the **thresholds** and the **procedures**. The "carving" is not in the definition of the principle, but in the constraints placed on the exception.

  Here are the four criteria usually proposed to separate legitimate self-defense from weaponized exclusion:

  #### 1. Existential vs. Competitive Threat
  *   **Legitimate:** The threat is to the *procedural framework* itself. If the intolerant win, the mechanism for changing power (elections, speech, markets) is permanently dismantled. The game is ended.
  *   **Pretextual:** The threat is to a specific *outcome* or *policy*. If the rival wins, the defender dislikes the result, but the game continues.
  *   *The Carving:* You may only restrict an actor if their success implies the end of the arena in which they are competing.

  #### 2. Action vs. Content
  *   **Legitimate:** The restriction targets the *method* of destruction (e.g., paramilitary organization, incitement to violence, explicit plans to suspend the constitution).
  *   **Pretextual:** The restriction targets the *viewpoint* or the *popularity* of the rival (e.g., "their ideas are dangerous," "they are too polarizing").
  *   *The Carving:* You restrict the *capacity to destroy*, not the *idea that motivates it*.

  #### 3. Reversibility and Error Cost
  *   **Legitimate:** The restriction is designed to be temporary or subject to review. If the "threat" turns out to be false, the system has a mechanism to restore the excluded party.
  *   **Pretextual:** The restriction creates a precedent that makes it easier to exclude the next rival. It creates a slippery slope where the definition of "dangerous" expands.
  *   *The Carving:* A legitimate exception minimizes the damage if the decision turns out to be wrong. A pretextual exception maximizes the advantage for the decider.

  #### 4. The "Who Decides" Problem (The Schmittian Trap)
  This addresses your second worry: *Whoever is making the argument always gets to decide.*
  The German legal theorist Carl Schmitt famously argued that **"Sovereign is he who decides on the exception."** He meant that the true power in any system lies not in the person who follows the rules, but in the person who has the authority to say, "The rules don't apply right now because of an emergency."

  Your intuition is exactly Schmitt's point: This move cannot be fully legalized. If you write a law saying "Ban anyone who threatens democracy," you still need a human to decide who counts as a threat. That human is now outside the normal rules.

  **The only safeguard against this is institutional fragmentation.**
  *   **Legitimate:** The decision to exclude is not made by the current office-holders (who benefit from the exclusion) but by an independent body (courts, electoral commissions) with high burdens of proof and slow processes.
  *   **Pretextual:** The decision is made unilaterally by the incumbent power or a partisan body.

  ### Summary of the Distinction

  The difference between saving a value and weaponizing it is not found in the *argument*, but in the **burden of proof**.

  In a legitimate case of recursive self-limitation, the burden of proof is on the **restrictor** to demonstrate **imminent, structural, and irreversible harm** to the system itself.
  In a weaponized case, the burden of proof is shifted to the **restricted** to prove they are harmless, or the standard of harm is lowered to "discomfort" or "disagreement."

  ### Why the Gap Exists

  You suspected this might be a "genuine gap." You are right. It is a gap because **a system cannot fully define its own boundaries from the inside.**

  To protect tolerance, you must step outside of tolerance for a moment to define what is intolerable. To protect free speech, you must silence someone to decide that their speech destroys speech. This is a **performative contradiction**.

  Because it is a contradiction, it can never be perfectly resolved by a formula. It requires **judgment**. And because it requires judgment, it is vulnerable to abuse.

  The "shape" you have found is the **Paradox of Constitutional Self-Defense**. It has no single name because it is not a tool to be used; it is a risk to be managed. The "carving" is not a line you can draw on a map, but a high wall of procedure you must build around the exception so that it cannot be used casually. If the exception becomes easy to use, it has already become the tyranny it claimed to prevent.
