      *   *Legitimate Case:* The threat is existential and structural. If the intolerant win, tolerance is gone *forever* (or hard to restore). The restriction is minimal and targeted at the *action* of destroying the system, not the *content* of the view.
      *   *Illegitimate Case:* The threat is rhetorical or competitive. The restriction targets the *viewpoint* or uses vague criteria. The goal is political advantage, not systemic survival.
      *   *Key Concept:* **Procedural vs. Substantive**.
      *   *Key Concept:* **The Irony of Protection** (protecting by violating).
      *   *Key Concept:* **Carl Schmitt's "State of Exception"** (warning about who decides).
      *   *Key Concept:* **John Rawls' "Tolerance of the Intolerant"** (nuance: tolerate unless they deny liberty to others).

  5.  **Structuring the Response:**
