      *Best Fit for the "Shape":* **The Paradox of Self-Preservation** or **The Self-Defeating Principle**. However, in political philosophy, the most robust framework is **Militant Democracy** (extended metaphorically) or **Reflexive Liberty**.
      *Actually, there is a more precise logical term:* **Performative Contradiction** (when acting on the principle negates the principle).
