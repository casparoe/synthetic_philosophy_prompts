      (Final thought on the "Gap" definition): The prompt defines Gap-akrasia as "departs from agent's judgment *at the time of acting*." This is the standard Socratic/Davidsonian view. The Econ view usually assumes revealed preference, making Gap impossible. This is the crux.

      Let's assemble the argument.

      *   **Introduction:** Validate the hypothesis. It's a robust diagnostic.
      *   **Section 1 (Substantive):** The reduction fails. Gap implies a normative fracture; Reversal implies a structural feature. Regret bridges them but doesn't collapse them.
      *   **Section 2 (Verbal):** 'Preference' and 'Judgment' are the key terms. Revealed Preference vs. Cognitive State.
      *   **Section 3 (Cases):** Sophisticate = Reversal w/o Gap. Judgment Change = Reversal w/o Gap (Philosophically). Wait, if judgment changes, there is no Gap. So Case 2 shows Economists count it as akrasia (reversal), Philosophers don't. This proves they are different objects.
      *   **Section 4 (Progress):** A unified theory of *agency over time*. Not just mapping, but explaining how Reversal *threatens* Gap.

      *Wait, re-reading Case 2:* "the agent whose judgment itself changes at the moment of choice, so that she acts on her current judgment and exhibits no gap."
      *   Phil: Not akrasia.
