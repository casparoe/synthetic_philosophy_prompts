      *   **Constraint:** Do not just swap terms (e.g., "belief" -> "suspension of disbelief"). The translation must be conceptual.

  2.  **Deconstruct the Paradox of Fiction (Philosophical Core):**
      *   *Premise 1:* To feel emotion (fear, grief) toward X, we must believe X exists (or is happening).
      *   *Premise 2:* We do not believe fictional characters/events exist.
      *   *Premise 3:* We do feel emotion toward fictional characters/events.
      *   *Conclusion:* These three propositions are inconsistent. How can we feel real grief for someone we know isn't real?
      *   *Standard Solutions:* Pretense theory (we pretend to feel), Thought theory (we feel toward thoughts, not objects), Illusion theory (we temporarily believe).

  3.  **Translate to Craft Vocabulary (The "Novelist's Paradox"):**
      *   *Premise 1 (Emotion requires Existence):* In craft, this is about *Stakes*. For a reader to invest emotionally, the threat or loss must feel immediate and real within the *Fictive Dream*. If the reader pulls back to reality, the spell breaks.
      *   *Premise 2 (We know it's fake):* This is the *Contract*. Page one establishes this is a constructed narrative. The reader maintains *Dual Consciousness* (knowing it's words on a page while experiencing the story).
      *   *Premise 3 (We feel anyway):* This is *Identification* and *Interiority*. Through Free Indirect Discourse, the reader inhabits the character's nervous system.
      *   *The Conflict:* How does the *Contract* (knowing it's made up) not destroy the *Stakes* (feeling it's real enough to cry over)? How does the reader maintain the *Fictive Dream* without succumbing to delusion?

  4.  **Develop the "Residue Report":**
      *   *Maps Cleanly:*
          *   "Belief" -> "Immersion/Fictive Dream."
          *   "Existence" -> "Narrative Authority/Truth."
          *   "Emotion" -> "Reader Investment/Catharsis."
      *   *Requires Fudging:*
          *   The philosophical idea of "propositional attitude" (believing a statement is true) vs. the craft idea of "emotional truth." Philosophers worry about ontology (does Hamlet exist?). Novelists worry about verisimilitude (does Hamlet feel real?).
      *   *No Counterpart:*
          *   The ontological status of the character. The novelist *knows* the character doesn't exist. The reader *knows* the character doesn't exist. The philosophy treats "existence" as a binary switch. Craft treats "reality" as a gradient of resonance.

  5.  **Evaluate the User's Hunch:**
      *   *Hunch:* "The puzzle dissolves for the builder." (I cried, they cried, nobody was confused).
      *   *Critique:* It's partially right but slightly lazy.
      *   *Why Right:* Because craft bypasses the cognitive check. We don't ask "Is this real?" we ask "Is this true?" The emotion comes from empathy, not ontological confusion.
      *   *Why Lazy:* It ignores the *mechanism* of how that happens. Philosophers are trying to explain the *mechanism* of the magic trick. Just saying "I'm the magician" doesn't explain how the rabbit got in the hat. The paradox highlights a gap in our understanding of *empathy* vs. *belief*. The novelist uses the gap; the philosopher stares at it.
      *   *Verdict:* The puzzle isn't about existence; it's about the architecture of empathy. The user is right that it's not a *problem* for writing, but wrong that it's not a *real phenomenon*.

  6.  **Drafting the Response (Iterative refinement):**
