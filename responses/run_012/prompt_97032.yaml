      *   *Check:* Is the tone right?
      *   *Correction:* Ensure I don't sound like a professor talking down to a writer. Sound like an editor talking to a writer.

  8.  **Final Polish:** Check against the "Residue Report" requirements. Ensure the critique of the hunch is honest but not mean. (The user said "don't be nice... if it's lazy.")

