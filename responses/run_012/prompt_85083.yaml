prompt: |-
  I run a small experimental-philosophy lab — two PhD students and a postdoc, roughly three years of runway — and I want to commit the whole group to the side-effect effect: the finding that people are far more willing to call a foreseen but unintended side effect intentional when it is harmful than when it is helpful. My working hunch is that the effect is not really about the concept of intentional action at all. It is about a broader asymmetry in how people fold foreseen outcomes into an agent's plan — foreseen harms get absorbed into what the agent was doing, foreseen benefits get written off as accidents. If that is right, the same asymmetry should surface in judgments of knowledge and of causation, and it should be switchable by information about what the agent actually represented to themselves: whether they would have proceeded had the side effect been the only outcome, whether they actively anticipated it, whether they could have avoided representing it at all.

  Assuming that hunch, what are the most important open questions here, and which should my group take on first? I want a defended agenda rather than a survey: for each question, why it matters, whether it is upstream of the others, how tractable it is with the tools a lab like mine actually has, and what result over the next three years would move it up or down the list. Tell me what to deprioritize even though it looks central, which disagreements in this area are really about method rather than substance, and what would change the ranking. Argue from the structure of the problem rather than from who has said what — do not point me at particular papers, authors, or readings to settle any of it.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the User and Request:**
      *   **User Profile:** PI of a small experimental philosophy lab (2 PhDs, 1 Postdoc).
      *   **Resources:** ~3 years of runway (time/funding). Small team, so high bandwidth per person but limited scale compared to big labs.
      *   **Topic:** The Side-Effect Effect (Knobe Effect).
      *   **Working Hunch:** It's not about *intentionality* per se, but about how foreseen outcomes are folded into an agent's *plan*. Harm $\rightarrow$ absorbed into plan; Benefit $\rightarrow$ written off as accident.
      *   **Prediction:** This asymmetry should appear in *knowledge* and *causation* judgments too. It should be modifiable by information about the agent's mental representation (counterfactual willingness, anticipation, avoidability of representation).
      *   **Task:** Provide a *defended agenda* (not a survey). Prioritize questions based on importance, upstream/downstream relationships, tractability for a small lab, and potential impact over 3 years.
      *   **Constraints:** Argue from the *structure of the problem*, not literature citations (no "Read Knobe 2003"). Identify what to deprioritize. Identify methodological vs. substantive disagreements. Explain what would change the ranking.

  2.  **Deconstruct the Working Hunch:**
      *   *Core Claim:* The asymmetry is about *Plan Integration* (PI), not Intentionality Concepts (IC).
      *   *Mechanism:* Normative valence (harm vs. help) influences whether a side effect is cognitively tagged as "part of the plan" or "external noise."
      *   *Implication:* If PI is the driver, then manipulating PI directly should override the valence effect. Also, PI should predict judgments in other domains (knowledge, causation) where "plan" or "intervention" structure matters.

  3.  **Brainstorming Open Questions (based on the hunch):**
      *   Q1: Is it really about plans? (Mechanism validation)
      *   Q2: Does it generalize to Knowledge/Causation? (Domain generality)
      *   Q3: What specific mental state representations drive the folding? (Counterfactuals, Attention, etc.)
      *   Q4: Is it moral valence or statistical normativity? (The "Norm" debate)
      *   Q5: Cross-cultural stability? (Universal vs. WEIRD)
      *   Q6: Developmental trajectory? (Kids vs. Adults)
      *   Q7: Neural correlates? (fMRI/EEG)

  4.  **Filtering & Prioritizing (The "Defended Agenda" Step):**
      *   *Constraint Check:* Small lab, 3 years. No fMRI (too expensive/complex). Cross-cultural/Developmental (too logistically heavy for 3 years with just 3 researchers).
      *   *Focus:* Mechanism and Generalization.
      *   *Upstream:* If the mechanism isn't "Plan Integration," the rest doesn't matter. So, validating the mechanism is Priority #1.
      *   *Downstream:* If the mechanism holds, does it explain *other* asymmetries (Knowledge/Causation)? This tests the theory's scope. Priority #2.
      *   *Modulation:* Can we switch it? This proves causal control. Priority #3 (interwoven with #1).
      *   *Deprioritize:* Cross-cultural, developmental, neural, and pure "moral vs. statistical" debates (unless tied directly to plan representation).

  5.  **Drafting the Agenda Items:**

      *   **Project 1: The Plan-Integration Manipulation (The "Switch").**
          *   *Why:* Direct test of the hunch. If we make the benefit look "planned," does the effect disappear?
          *   *Tractability:* High. Vignette studies.
          *   *Upstream:* Essential. If this fails, the hunch is wrong.
          *   *3-Year Goal:* Establish boundary conditions where valence doesn't matter because plan-structure does.

      *   **Project 2: Domain Generality (Knowledge & Causation).**
          *   *Why:* Tests if this is a general cognitive heuristic about agency or specific to moral blame.
          *   *Tractability:* Medium. Need careful vignette design for "knowing" and "causing."
          *   *Upstream:* Depends on Project 1's logic holding.
          *   *3-Year Goal:* Show the asymmetry replicates in non-moral domains *only* when plan-structure is ambiguous.

      *   **Project 3: The Representation of Counterfactuals.**
          *   *Why:* The hunch mentions "would they have proceeded?" This is the specific cognitive lever.
          *   *Tractability:* High.
          *   *Upstream:* Refines Project 1.
          *   *3-Year Goal:* Map the threshold. How strong does the counterfactual need to be to override valence?

      *   **Deprioritized:** Cross-cultural (logistics), Neuroscience (tools), Pure Conceptual Analysis (not experimental).

  6.  **Addressing Methodological vs. Substantive Disagreements:**
      *   Many debates in this field are about *what the vignette implies* rather than *what people think*.
      *   Example: Does "I don't care" imply secret approval?
      *   *Advice:* Focus on explicit manipulation of mental states rather than inferring them from standard CEO vignettes.

  7.  **Addressing "What Would Change the Ranking":**
      *   If Project 1 fails (Plan manipulation doesn't override valence), the hunch is dead. Pivot to moral valence as primitive.
      *   If Project 2 succeeds wildly, the theory becomes a general theory of folk psychology, raising stakes.

  8.  **Refining the Argument (Structure of the Problem):**
      *   The core structural problem is *underdetermination*. The standard vignette underdetermines the agent's mental plan.
      *   Therefore, the research must *overdetermine* the mental plan to see if valence still exerts force.
      *   This dictates the priority: Manipulate Plan > Test Domains > Refine Counterfactuals.

  9.  **Review against Constraints:**
      *   *No citations?* Check.
      *   *Defended agenda?* Check.
      *   *Small lab context?* Check (focus on vignette/survey work, not big data or imaging).
      *   *3-year horizon?* Check.

  10. **Final Polish:** Ensure tone is strategic, direct, and respectful of the PI's expertise. (Self-Correction: Make sure I don't accidentally imply specific authors when discussing "the literature." Keep it abstract.) *Wait, I need to make sure I don't just say "don't read papers." I need to explain WHY certain questions are structurally prior.*

      *   *Key Insight:* The "Plan Integration" hypothesis posits that valence is a *proxy* for plan-structure in ambiguous cases. Therefore, removing ambiguity should remove the effect. This is the critical test.

      *   *Structure:*
          1.  Executive Summary of the Strategy.
          2.  Priority 1: The Plan-Override Test (Mechanism).
          3.  Priority 2: Domain Transfer (Scope).
          4.  Priority 3: The Counterfactual Threshold (Granularity).
          5.  What to Deprioritize (and why).
          6.  Methodological vs. Substantive.
          7.  Contingencies (What changes the plan).

      *(Self-Correction during drafting)*: Be careful with the "Knowledge" aspect. Folk epistemology is tricky. Ensure the link to "plan" is clear (e.g., knowing implies a connection to the truth that is robust/planned vs. accidental).

      *(Refining the "Method vs Substance" point)*: A lot of noise in this field comes from participants interpreting the *pragmatics* of the question differently. The lab needs to control for pragmatic inference.

      *(Final check on tone)*: Needs to sound like a senior colleague advising a peer. Strategic, realistic, rigorous.

  11. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a strong, coherent hunch. It moves the debate from "What is the concept of intentional action?" to "How do people construct narratives of agency?" That is a more tractable psychological question for a small lab with a three-year horizon.

  Your core theoretical commitment is that **valence is a proxy for plan-structure in underdetermined cases.** When the agent's mental representation is ambiguous, people use harm/benefit as a heuristic to decide whether an outcome was "in the plan." If you make the plan structure explicit, the valence effect should diminish or vanish.

  Here is a defended research agenda structured by logical priority, tractability for a team of three, and potential to validate or falsify your hunch within 36 months.

  ### Priority 1: The Plan-Override Test (Mechanism Validation)
  **The Question:** If we explicitly fix the agent's plan-structure, does the valence asymmetry persist?
  **Why it matters:** This is the upstream falsification test for your entire hunch. If people still judge the harmful side effect as more intentional than the helpful one *even when* you explicitly state the agent represented both outcomes identically and would have acted the same way regardless, then your "Plan Integration" hypothesis is false. The effect would then be rooted in moral judgment itself, not narrative construction.
  **Tractability:** High. This requires tight vignette control. You do not need new populations or complex equipment. You need precise wording that forces a specific mental-state representation (e.g., "The agent explicitly wrote down both outcomes as equally irrelevant to their goal, yet inevitable").
  **3-Year Goal:** Establish the **Boundary of Ambiguity**. You want to find the point where explicit plan information overrides valence.
  *   *Success:* You find conditions where the asymmetry disappears because the plan is explicit.
  *   *Failure:* The asymmetry is robust even against explicit counterfactual information. (This kills the hunch, but is a vital result).
  **Why First:** Everything else rests on this. If valence trumps explicit plan representation, there is no point testing generalization to knowledge or causation.

  ### Priority 2: Domain Transfer (Scope Validation)
  **The Question:** Does the Plan-Integration asymmetry replicate in judgments of *Knowledge* and *Causation*?
  **Why it matters:** If your hunch is right, this isn't about the concept of "intentional." It's about a general cognitive heuristic for linking agents to outcomes.
  *   *Knowledge:* People might be more willing to say an agent "knew" a harmful outcome would occur than a helpful one, given identical evidence, because harm is folded into the agent's epistemic landscape more tightly.
  *   *Causation:* People might rate the agent as a stronger cause of the harm than the help, because the harm is seen as part of the causal chain the agent enacted, whereas the help is noise.
  **Tractability:** Medium. Designing vignettes for "knowledge" and "causation" that parallel the intentional action cases without introducing confounds is difficult. It requires piloting to ensure participants aren't slipping back into moral evaluation.
  **3-Year Goal:** Demonstrate **Structural Isomorphism**. Show that the same variables that modulate the intentionality effect (e.g., explicit counterfactual willingness) modulate the knowledge/causation effects in the same direction.
  **Why Second:** This expands the theoretical payoff. If Priority 1 succeeds, Priority 2 turns your finding from a niche point about action theory into a general claim about folk psychology.

  ### Priority 3: The Counterfactual Threshold (Granularity)
  **The Question:** What specific representation of the counterfactual ("Would you have done this if...") is required to switch the judgment?
  **Why it matters:** Your hunch mentions "whether they would have proceeded." This is the lever. Is it a binary switch (Yes/No), or a gradient (How much would it have cost to avoid?)? Does it matter if the agent *attended* to the side effect vs. merely represented it?
  **Tractability:** High. This is a series of factorial designs varying the strength of the counterfactual commitment.
  **3-Year Goal:** Map the **Psychometric Function of Agency**. Determine how much "plan weight" is needed to absorb a side effect. For example, does a 1% chance of aborting the plan make the side effect "unintentional," or does it need to be 50%?
  **Why Third:** This refines the theory established in Priority 1. It is less critical for falsification but critical for publication depth and theoretical precision.

  ---

  ### What to Deprioritize (Despite Appearances)

  **1. Cross-Cultural Replication**
  *   **Why it looks central:** Universal vs. WEIRD is a standard demand in cognitive science.
  *   **Why deprioritize:** With three years and three researchers, you cannot run a robust cross-cultural study that controls for translation equivalence and local norms. Furthermore, if your hunch is about *cognitive architecture* (how plans are folded), it is likely universal. If it fails in Priority 1 in a US sample, cross-cultural data won't save it. If it succeeds in Priority 1, assume universality until proven otherwise. Save this for a grant extension.

  **2. Developmental Trajectories (Children)**
  *   **Why it looks central:** Ontogeny tells us about modularity vs. learning.
  *   **Why deprioritize:** Child methodology is a distinct skillset that consumes massive bandwidth (IRB, parental consent, non-verbal measures). It distracts from the mechanistic question. You need to know *what* the mechanism is before you ask *when* it develops.

  **3. The "Moral vs. Statistical Norm" Debate**
  *   **Why it looks central:** Much of the existing literature fights over whether the effect is driven by moral badness or statistical abnormality.
  *   **Why deprioritize:** This is often a verbal dispute about how to label the input. For your purposes, treat "normativity" as a single dimension that influences plan folding. Don't spend a year trying to isolate moral norm from statistical norm unless your Priority 1 results suggest they have *different* effects on plan integration. Focus on the *output* (judgment), not the taxonomy of the *input*.

  ---

  ### Methodological vs. Substantive Disagreements

  A significant portion of the noise in this area is methodological, specifically regarding **Pragmatic Inference**.

  *   **The Problem:** When you tell a participant "The CEO doesn't care about the environment," participants often infer "The CEO secretly likes harming the environment." They are reading between the lines.
  *   **The Disagreement:** Some researchers argue this inference *is* the phenomenon (substantive). Others argue it is a confound (methodological).
  *   **Your Stance:** Treat it as a methodological confound. Your hunch is about *represented* plans. If participants are inferring hidden plans, they are not responding to the vignette you wrote.
  *   **The Fix:** Your vignettes must close the pragmatic gap. Use "comprehension checks" that ask participants what the agent's mental state was, not just the judgment. If they infer a hidden desire to harm, exclude them or rewrite the vignette until the inference stops. Do not accept "participants naturally interpret it this way" as a defense; that is an admission that your stimulus is underdetermined.

  ### What Would Change the Ranking?

  **1. If Priority 1 Fails (The Valence Resilience Scenario)**
  If you explicitly state the agent would have acted the same way for help or harm, and the asymmetry *remains*, your hunch is incorrect. Valence is not a proxy for plan structure; it is a direct input to the judgment.
  *   **Pivot:** Move immediately to **Priority 2 (Domain Transfer)** but reframe the hypothesis. Instead of "Plan Integration," the hypothesis becomes "Moral Valence as a Primitive Heuristic." You would then test if this primitive heuristic applies to knowledge/causation. This is still publishable, but it changes the theoretical narrative from "narrative construction" to "moral contagion."

  **2. If Priority 2 Succeeds Spectacularly (The Grand Unification Scenario)**
  If you find that the exact same plan-structure variables control intentionality, knowledge, and causation judgments with high effect sizes, the theoretical stakes rise.
  *   **Pivot:** Deprioritize Priority 3 (Counterfactual Threshold). Instead, shift resources to **Modeling**. Work with a computational modeler (collaborator) to formalize the "Plan Folding" algorithm. A formal model is more impactful than finer-grained vignette tweaks.

  **3. If Effect Sizes are Small**
  If the asymmetry is statistically significant but tiny (e.g., Cohen's d < 0.3) once you control for pragmatic inferences:
  *   **Pivot:** Stop. The effect may be a laboratory artifact of specific vignette phrasing rather than a robust cognitive feature. Do not spend three years polishing a fragile effect. Write up the null results regarding the "Plan Override" and move the lab to a new topic.

  ### Summary of the 3-Year Arc

  *   **Year 1:** **Mechanism.** Focus entirely on Priority 1. Refine vignettes until pragmatic inferences are minimized. Establish whether explicit plan information overrides valence.
  *   **Year 2:** **Scope.** If Year 1 succeeds, expand to Knowledge and Causation (Priority 2). Test if the "Plan Override" works there too.
  *   **Year 3:** **Precision & Synthesis.** Refine the counterfactual thresholds (Priority 3). Write up the unified theory of "Agency Construction."

  This agenda protects you from the most common pitfall in this field: running endless variations of the CEO vignette without testing the underlying cognitive mechanism. By treating the "Plan" as the variable and "Valence" as the confound (rather than the cause), you position your lab to resolve the debate rather than contribute to the noise.
