      *   **Task:** Identify the underlying ethical principle governing their votes on six specific cases. They have been told it's "contractualism" but don't want labels or reading lists; they want the *principle*.
      *   **Input:** Six cases with specific votes.
          1.  *Antitoxin:* Save 60 lives vs. 15 lives + 400 nerve damage. Vote: Save 60 (A). (Deaths trump non-fatal injuries, even in aggregate).
          2.  *Newborn Screening:* Save 11 infants vs. 1 infant death (test complication). Vote: Run it. (11 deaths vs. 1 death, same kind).
          3.  *The Drug:* 2M patients get relief vs. 1 patient blinded/year. Vote: Approve. (Aggregate minor benefits trump single catastrophic loss).
          4.  *The Valley:* Displace 400 (compensated) vs. benefit 200k (water). Vote: Against. (Rights/consent of few trump aggregate utility of many).
          5.  *The Water Rule:* 4 expected cancer deaths (statistical) vs. 2k/year spared severe illness. Vote: For it. (Statistical deaths vs. aggregate non-fatal illness).
          6.  *The Lottery:* 1 fatal job, assigned by lottery. Vote: Undecided/Inconsistent.
      *   **User's Proposed Principle:** "A policy is acceptable only if no one who bears a burden under it could reasonably object to bearing it, where each person's objection is assessed on its own... and the number of objectors counts only when their objections are of the same kind and the same severity."
      *   **User's Problems with Proposed Principle:**
          *   Case 3 violates it (aggregated minor complaints outweigh one major one).
