answer: |-
  Here are ten tight questions with built-in follow-ups and trap flags. They are ordered to build pressure: starting with the technical mechanics, moving to normativity, then evolution, and closing with the meta-ethical stakes.

  **1. The Coordination Problem**
  "Lewisian conventions require a coordination problem with *multiple* equilibria—we drive on the right *or* the left, but we must agree. But take a headline norm like 'don't kill innocent people.' Where is the alternative equilibrium here? It doesn't look like a coordination problem; it looks like the *only* salient answer. Why think this is a convention rather than just a solution to a problem with only one answer?"

  *   **Follow-up:** If she says the multiplicity is in the *details* (e.g., who counts as innocent, what counts as killing), ask: "Does that reduce the core moral prohibition to the status of a traffic rule? If the headline is fixed but the details are conventional, isn't the *moral* part the non-conventional bit?"
  *   **⚠️ Trap:** She has a "Salience" reply ready. She will argue that even if one equilibrium is better, it's still a convention if we conform *because* others do. Press her on whether the *reason* for conformity is the coordination or the inherent value of not killing.

  **2. The "Details" Defense**
  "Let's press that point about the details. If the convention is just the specific implementation of a broader constraint, doesn't that imply the broader constraint is *not* a convention? If I say 'we need a rule for property,' that's a problem. If I say 'property means first-possession,' that's the convention. But morality seems to claim the constraint itself ('respect property') is binding, not just the selection of a rule. How do you get the bindingness of the constraint from a convention about the details?"

  *   **Follow-up:** "If the constraint itself isn't conventional, aren't you just a moral realist about the constraints and a conventionalist about the bylaws? Why call the whole thing conventionalism?"
  *   **⚠️ Trap:** She will try to blur the line between "constraint" and "rule." Keep them distinct.

  **3. Reasons vs. Predictions**
  "Lewis gives us an account of *expectations*: I conform because I predict you will. But morality gives us *reasons*: I conform because I ought to, even if I could get away with it. Does your view give me an actual reason to comply, or just a prediction that I'll be punished if I don't? If it's the latter, haven't you collapsed morality into prudence?"

  *   **Follow-up:** If she says "The expectation *is* the reason," ask: "Then if I know I can violate the norm without detection or social cost, on your view, do I still have a reason to comply? If yes, where does it come from? If no, isn't that just error theory?"
  *   **⚠️ Trap:** She will use the phrase "Normative Expectation." This is jargon that smuggles in the "ought." Ask her to define "normative" without referencing moral reasons.

  **4. The Enforcement Regress**
  "Conventions need enforcement to stay stable. Who does the enforcing? If it's just individuals punishing deviants, isn't *that* act of punishment costly to the enforcer? Why would a rational agent pay the cost to enforce a convention? If you say 'enforcement is itself a second-order convention,' doesn't that just push the problem up a level? What stabilizes the enforcers?"

  *   **Follow-up:** "If the answer is 'reputation,' aren't you relying on a third-order convention about valuing reputation? Are you committed to an infinite regress of conventions to explain the first one?"
  *   **⚠️ Trap:** She will argue that enforcement is self-stabilizing in large groups. Ask for the mechanism: is it genetic altruism or cultural selection? (Sets up Q6).

  **5. Phenomenology as Illusion**
  "Moral norms present themselves to us as non-arbitrary and necessary. We feel we *couldn't* have done otherwise. On your view, is this phenomenology just a bug in our self-reporting? Are we systematically deluded about the nature of our own moral experience?"

  *   **Follow-up:** "If evolution selected for this illusion to make the convention stable, does that undermine the reliability of the cognitive systems producing the moral belief? Why trust the output of a system designed to deceive us about the norm's status?"
  *   **⚠️ Trap:** She will embrace the "useful illusion." Counter that a theory claiming our core moral experience is false is a high-cost theory that needs more than just "it fits the game theory."

  **6. Evolutionary Mechanism**
  "You mention evolution, but that word does a lot of heavy lifting. Are you talking about genetic selection on individuals, cultural group selection, or payoff-based reinforcement learning? I need you to commit to a mechanism, because the stability of the convention depends entirely on which one is running."

  *   **Follow-up:** "If it's cultural group selection, doesn't that mean the norm is only 'valid' relative to the group's survival? If a moral norm persists but the group dies out, was it a bad convention or a true moral failure?"
  *   **⚠️ Trap:** She will stay vague ("cultural evolution"). Press her: "Is the selection pressure on the *gene* or the *meme*?" The answer changes whether the norm is arbitrary (meme) or deep (gene).

  **7. Arbitrariness & Survival**
  "Conventions are arbitrary in the sense that we could have settled on another equilibrium (driving on the left). If morality is a convention, it must be arbitrary in that sense too. Does the arbitrariness survive the evolutionary story? Or does evolution select *the one true equilibrium*, in which case it's not a convention anymore?"

  *   **Follow-up:** "If evolution selects the *only* stable equilibrium, then it's not arbitrary. If it selects *one of many* stable equilibria, then morality is arbitrary. Which is it? You can't have it both ways."
  *   **⚠️ Trap:** She will say "Arbitrary doesn't mean random, it means contingent." Reply: "If it's contingent on history, then a world with a different history has different morals. Are you okay saying slavery could be morally right in a different equilibrium?"

  **8. Error Theory in Disguise**
  "Mackie's error theory says moral judgments are systematically false because there are no objective values. You say moral norms are conventions. Is this just error theory dressed up in game-theoretic language? If there are no objective values, and conventions are just equilibria, what makes a moral claim *true* on your view?"

  *   **Follow-up:** "If I say 'Slavery is wrong' and you say 'Slavery violates our local equilibrium,' have you captured the truth of my statement? Or have you changed the subject?"
  *   **⚠️ Trap:** She will claim to be a "Reductivist" not an "Eliminativist." Ask: "What is the reduction base? If it's just 'what we do,' then 'we ought to do what we do' is trivial. If it's 'what we ought to do,' you're circular."

  **9. Moral Reform**
  "If morality is an equilibrium, how do you account for moral reform? Reformers like Martin Luther King Jr. weren't trying to coordinate on a new equilibrium; they were claiming the *existing* equilibrium was unjust. On your view, wasn't he just trying to disrupt a stable convention? How do you distinguish a 'moral reformer' from a 'coordination disruptor'?"

  *   **Follow-up:** "If the answer is 'he moved us to a *better* equilibrium,' better according to what standard? If the standard is just another convention, aren't you just saying he moved us to a more popular convention?"
  *   **⚠️ Trap:** She will say "Better means more stable/inclusive." Ask: "Why is stability the moral metric? Is a stable tyranny morally better than an unstable democracy on your view?"

  **10. Conditions for Defeat**
  "Finally, what would falsify your view? What would the world have to look like, or what argument would have to be made, for you to conclude that moral norms are *not* conventions? If the answer is 'nothing,' then this isn't an empirical hypothesis, it's a definition."

  *   **Follow-up:** "If you say 'Show me a norm that resists coordination analysis,' isn't that begging the question? You can always analyze any norm as a convention after the fact. What prediction does your theory make that could turn out to be false?"
  *   **⚠️ Trap:** She will say "The burden of proof is on the realist." Reply: "You're making a positive claim about the nature of norms. The burden is on you to show they *are* conventions, not just that realism is hard."
