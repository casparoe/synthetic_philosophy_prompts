answer: |-
  It is good to meet a fellow skeptic of teleology. Your geological intuition serves you well here: in deep time, there is no vector, only entropy and local equilibria. When people import "direction" into history, they are usually smuggling in metaphysics or wishful thinking.

  Your schoolteacher friend used a quote by Theodore Parker (1853), popularized by Dr. King. But as you suspected, the sentence is a chameleon. It changes its metaphysical weight depending on how much pressure you put on it.

  Here is the menu you asked for. I have ordered these from the most defensible (but useless) to the most radical (but unsupported).

  ### The Menu of Claims

  #### 1. The Retrospective Tautology (The "Winners Write History" Reading)
  *   **The Claim:** Whatever social arrangement eventually stabilizes and wins out will, by definition, be labeled "justice" by the survivors. Therefore, history bends toward whatever ends up happening.
  *   **Type:** Tautology / Circular.
  *   **Testable:** No. It defines the outcome into the premise.
  *   **Falsifiable:** No.
  *   **Supports "Stop Worrying":** **No.** This offers no comfort. It implies that if fascism wins, fascism becomes "justice." It describes a mechanism of power, not moral comfort.
  *   **Geologist's Note:** This is like saying erosion bends toward the lowest elevation. True by definition of gravity and fluid dynamics, but implies no moral value to the canyon.

  #### 2. The Empirical Generalization (The "Pinker" Reading)
  *   **The Claim:** If you plot data on violence, rights, and mortality over centuries, the trend line slopes upward. It is a statistical observation, not a law.
  *   **Type:** Testable claim about the world (Trend, not Guarantee).
  *   **Testable:** Yes. You can look at homicide rates, slavery abolition, suffrage, etc.
  *   **Falsifiable:** Yes. A century of global nuclear war or totalitarian consolidation would falsify it.
  *   **Supports "Stop Worrying":** **Weakly.** Trends reverse. Past performance does not guarantee future results. Relying on this to stop worrying is like ignoring a storm warning because the average rainfall for the decade is low.
  *   **Geologist's Note:** This is stratigraphy. You see layers that look like progress, but you also see unconformities and mass extinctions. It's a local pattern, not a law of physics.

  #### 3. The Metaphysical Guarantee (The "Providence" Reading)
  *   **The Claim:** There is a mechanism (God, Reason, World Spirit, Karma) inherent in the universe that actively corrects deviations from justice. Injustice contains the seeds of its own destruction.
  *   **Type:** Metaphysical / Theological claim (Guarantee).
  *   **Testable:** No.
  *   **Falsifiable:** No. Any setback is explained as "the arc is long" (see your point on timescale).
  *   **Supports "Stop Worrying":** **Yes.** This is the only reading that licenses passivity. If the universe is mechanically geared toward justice, your labor is optional.
  *   **Geologist's Note:** This is teleology. It assumes the rock *wants* to become a statue. It requires an agent or a purpose built into the fabric of reality.

  #### 4. The Pragmatic Engine (The "Self-Fulfilling Prophecy" Reading)
  *   **The Claim:** The arc does not bend on its own. It bends *because* people believe it bends. Believing in progress makes people willing to sacrifice for it, which creates progress.
  *   **Type:** Sociological / Psychological claim.
  *   **Testable:** Yes. You can measure the correlation between optimism about progress and political engagement.
  *   **Falsifiable:** Yes. If belief in the arc leads to complacency rather than action, the arc straightens or breaks.
  *   **Supports "Stop Worrying":** **No. It demands the opposite.** If the arc bends only because we push it, telling people to "stop worrying" removes the force required to bend it.
  *   **Geologist's Note:** This is tectonics. Pressure builds, plates shift. If you remove the pressure (worry/action), the movement stops.

  #### 5. The Regulative Ideal (The "Kantian" Reading)
  *   **The Claim:** This is not a description of reality at all. It is a command. We must *act as if* the arc bends toward justice, because acting otherwise (as if injustice is inevitable) makes moral action impossible.
  *   **Type:** Normative claim / Moral imperative (Not a claim about the world).
  *   **Testable:** N/A. It's a rule for reasoning, not a fact.
  *   **Falsifiable:** N/A.
  *   **Supports "Stop Worrying":** **No.** It licenses hope, but not rest. It says "You must work for justice *on the assumption* it is possible," not "It will happen so you don't need to work."
  *   **Geologist's Note:** This is a working hypothesis. You assume the vein continues so you keep digging, not because you know it's there, but because you can't dig if you assume it isn't.

  ***

  ### A Note on "Justice"
  You asked if the slogan needs a specific theory of justice.
  *   **If Justice = Material Outcomes:** (Food, safety, rights). Reading #2 (Empirical) is vulnerable. We have nuclear weapons and climate change.
  *   **If Justice = Institutional Complexity:** (Courts, democracies). Reading #2 is stronger, but institutions can be captured (see Reading #1).
  *   **If Justice = Moral Sentiment:** (What people *think* is right). Reading #2 is very strong (slavery is now universally condemned), but this comforts the observer more than the victim.

  The teacher likely slid between **Moral Sentiment** (to prove the trend exists) and **Material Outcomes** (to suggest your specific worries will resolve).

  ***

  ### The Bottom Line

  Here is the categorization you requested:

  *   **(a) Trivially True and Useless:** Reading #1 (The Tautology). If justice is just "what wins," the statement is true but offers no moral comfort.
  *   **(b) Substantive and Probably True (with caveats):** Reading #2 (The Empirical Trend). There is evidence of moral expansion, but it is non-linear and reversible.
  *   **(c) Substantive and Probably False:** Reading #3 (The Metaphysical Guarantee). There is no evidence of a universal mechanism that punishes injustice automatically. History is full of successful injustices that lasted centuries.
  *   **(d) Not Even a Claim About the World:** Reading #5 (The Regulative Ideal). It is a stance, not a fact.

  **Which one was he reaching for?**
  He was almost certainly reaching for **Reading #3 (The Metaphysical Guarantee)**. That is the only version that supports his conclusion ("your worrying is a failure of faith"). He wants the comfort of a universe that fixes itself.

  **Did he get away with it?**
  No. He engaged in **Equivocation**.
  To make the statement *plausible*, he relied on the intuition from **Reading #2** (look at how far we've come since the Stone Age).
  To make the statement *comforting*, he relied on the logic of **Reading #3** (therefore, you don't need to act).

  **The Verdict on "Quit Worrying":**
  If the claim is Empirical (#2), complacency is dangerous (trends reverse).
  If the claim is Pragmatic (#4) or Regulative (#5), complacency is self-defeating (the arc stops bending).
  Only if the claim is Metaphysical (#3) does "quit worrying" follow—and that claim requires a religious faith in Providence that he likely doesn't actually hold, he just borrowed it for the rhetorical win.

  **In short:** He used a call to action (King's actual intent) as a sedative. As a geologist, you know that gravity doesn't care about your hopes, and the arc doesn't bend without force. His advice wasn't profound; it was geological error. He mistook a fault line for a roadmap.
