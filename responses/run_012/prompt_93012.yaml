prompt: |-
  I'm a retired seismologist — spent 35 years on earthquake hazard and coastal risk — and since I stoped working I've been reading philosophy, mostly ethics, slowly and badly. Something from my old job keeps nagging at me and I think it's a philosophy question but I don't have the words for it.

  When we costed out a flood defence or a retrofit programme, the analysts always discounted the future benefits. Not even at one rate — the schedule had the rate falling over time, so a benefit in 50 years got knocked down at something like 3% but one in 300 years at 1%, or whatever the numbers were that year. I understand the mechanics, roughly: the rate is a pure time preference term plus a term that depends on how fast incomes are growing and how much we say we dislike inequality. Fine. But two things bother me. First, the same parameter that says how much we should care about a poor person today versus a rich person today also says how much someone living in 2200 counts relative to me — and I've never once seen anyone defend that those two things should be welded into a single number. Second, the institutions doing this are the same ones whose charters say every citizen counts equally and who get rightly upset about discrimination by race or sex or place of birth — but apparently discrimination by date of birth is just, well, policy. And nobody discounts the welfare of people in Australia, only people in the future.

  So what does the practice of discounting the future actually presuppose? Does it commit you to a view about the moral status of future people, or only to something about how to make trade-offs under growth and uncertainty? Which theories of value does it quietly rule out, and which rival theories would also license the same spreadsheet? Are the parts consistent — the pure time preference bit, the inequality bit, and the falling-rate schedule? And if I decided the presupposed view was wrong, what would actually have to change: would I just be arguing about the size of the number, or about something sitting underneath the number? I don't need citations or a reading list, I just want to understand what I've been staring at all these years.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Persona:** Retired seismologist (35 years experience), expert in earthquake hazard and coastal risk. Now reading philosophy (ethics) "slowly and badly."
      *   **Tone:** Intellectual, inquisitive, slightly weary but deeply engaged, practical yet philosophical. No jargon overload, but no oversimplification either. They want *understanding*, not a bibliography.
      *   **Core Question:** What does the economic practice of discounting the future *actually presuppose* morally?
      *   **Specific Pain Points:**
          1.  The conflation of inequality aversion (poor vs. rich today) with intergenerational equity (me vs. future person).
          2.  The moral inconsistency of institutions claiming equality for all citizens but discriminating by date of birth.
          3.  The distinction between technical trade-offs (growth/uncertainty) and moral status.
          4.  What theories of value are ruled out vs. allowed?
          5.  If the view is wrong, what changes? (The number or the foundation?)

  2.  **Deconstruct the Economic Practice (Ramsey-Cass-Koopmans / Social Discount Rate):**
      *   The formula usually looks like $r = \delta + \eta \cdot g$.
      *   $r$: Social Discount Rate.
      *   $\delta$ (Delta): Pure Time Preference (impatience/myopia).
      *   $\eta$ (Eta): Elasticity of Marginal Utility of Consumption (inequality aversion).
      *   $g$: Growth rate of consumption.
      *   *User's Observation 1:* $\eta$ does double duty (inequality today vs. inequality across time).
      *   *User's Observation 2:* $\delta$ implies discrimination by date of birth.
      *   *User's Observation 3:* Falling rates (hyperbolic discounting or declining certainty equivalents) complicate the standard exponential model.

  3.  **Address the Philosophical Presuppositions:**
      *   **Utilitarianism:** The framework is almost exclusively utilitarian (summing welfare). It assumes future people *count*, but their *consumption* might be worth less if they are richer.
      *   **Person-Affecting Views:** It assumes future people exist and have welfare. It doesn't usually grapple with the Non-Identity Problem (Parfit), though it should.
      *   **Consumptionism:** It equates welfare largely with consumption/income.
      *   **Time Neutrality:** Standard economics *should* be time-neutral ($\delta = 0$), but practice often inserts $\delta > 0$. This is the moral friction point.

  4.  **Tackle the Specific Questions:**

      *   *What does it presuppose?* It presupposes Consequentialism (specifically Utilitarianism) and that welfare is fungible across time via consumption. It presupposes that the "self" (society) is continuous.
      *   *Moral status vs. Trade-offs:* It claims to be about trade-offs under growth, but $\delta > 0$ is a claim about moral status (future lives matter less *because* they are in the future).
      *   *Theories ruled out:* Deontology (rights-based views that might forbid sacrificing future safety for current growth), Strong Sustainability (non-substitutability of natural capital), Non-Utilitarian views (prioritarianism might treat the future poor differently).
      *   *Consistency:* The falling rate schedule often tries to fix uncertainty issues but clashes with the standard exponential logic. $\delta$ and $\eta$ welded together is the biggest philosophical weak point.
      *   *What changes if it's wrong?* If $\delta$ is immoral, it goes to zero. If $\eta$ shouldn't apply across centuries, the formula breaks. It's not just the number; it's the objective function.

  5.  **Drafting the Response (Iterative refinement for tone and clarity):**

      *   *Opening:* Acknowledge the user's expertise. Validate their intuition. They have spotted the "ghost in the machine" of cost-benefit analysis (CBA).
      *   *Section 1: The Formula as Philosophy.* Explain $r = \delta + \eta g$ in plain English. Identify the two moral claims hidden there.
      *   *Section 2: The "Double Duty" of Inequality ($\eta$).* Address the user's first nagging point. Yes, it assumes a poor person in 2200 is morally comparable to a poor person today *only via consumption*. It rules out views where existence itself or specific environmental goods have intrinsic value.
      *   *Section 3: Pure Time Preference ($\delta$) as Discrimination.* Address the second point. $\delta > 0$ is indeed "date-of-birth discrimination." Philosophers (Ramsey, Pigou, Parfit) generally call this "defensible only by telescope." If $\delta = 0$, the discount rate drops massively.
      *   *Section 4: What Theories are Ruled Out?*
          *   Rights-based approaches (you can't trade a right to safety for GDP).
          *   Non-substitutability (some things can't be compensated by money).
          *   Non-Identity (the fact that different policies create different future people).
      *   *Section 5: The Falling Rate.* Explain why this happens (uncertainty/Weitzman) but note it's often a fudge to make the moral pill easier to swallow without admitting $\delta=0$.
      *   *Section 6: What Changes?* If the philosophy is wrong, the *objective* changes. You stop maximizing Net Present Value (NPV) and start looking at Safe Minimum Standards or Lexical Priorities. It's not just tweaking $\eta$; it's tearing up the spreadsheet.
      *   *Closing:* Bring it back to the seismologist's experience. Their intuition was right. The math wasn't neutral.

  6.  **Refining the Tone:**
      *   Avoid academic posturing. Use metaphors (the "telescope," the "welding").
      *   Respect the user's "slowly and badly" comment by showing them they are actually reading *well*.
      *   Ensure the distinction between *descriptive* (how people behave) and *normative* (how they should behave) is clear, as this is often where the confusion lies in discounting.

  7.  **Self-Correction/Check during drafting:**
      *   *Did I answer the "falling rate" bit?* Yes, need to mention Weitzman/Uncertainty vs. ethical decline.
      *   *Did I address the "Australia" analogy?* Yes, that's spatial vs. temporal neutrality.
      *   *Is the distinction between moral status and consumption clear?* Crucial. The model says future people count equally *but* their money counts less if they are rich. Need to make sure that distinction lands.

  8.  **Final Polish:** Check for clarity, flow, and empathy. (The resulting output matches the detailed response provided previously.)
answer: |-
  You have not been reading philosophy "badly." You have been reading the spreadsheet like a philosopher. Your intuition is correct: the practice of discounting is not a neutral technical adjustment for risk or growth. It is a dense, often unacknowledged, ethical theory written in arithmetic.

  To answer your core question: **Discounting commits you to a specific form of Utilitarianism that treats time as morally irrelevant only in theory, but morally discriminatory in practice.**

  Here is what that spreadsheet presupposes, what it rules out, and what breaks if you pull the thread.

  ### 1. The Formula as a Moral Claim
  You know the Ramsey equation, roughly: $r = \delta + \eta \cdot g$.
  *   $r$: The discount rate.
  *   $\delta$ (Delta): Pure time preference (impatience).
  *   $\eta$ (Eta): Inequality aversion (how much extra utility a dollar gives a poor person vs. a rich person).
  *   $g$: Growth rate of consumption.

  **The First Presupposition: Welfare is Consumption.**
  The model assumes that the only thing that matters morally is "utility," and the only proxy we have for utility is consumption (income). This rules out any ethical theory that says certain things have intrinsic value regardless of consumption (e.g., the existence of a species, the stability of a coastline, a right to safety). If the flood defence saves lives but reduces GDP growth, the model can legitimately say "don't build it." A deontologist (rights-based ethicist) would say you cannot trade a right to life for GDP. The spreadsheet rules out deontology.

  **The Second Presupposition: The "Double Duty" of Eta ($\eta$).**
  You spotted the weld. In the formula, $\eta$ does two jobs.
  1.  **Intragenerational:** It says we should transfer wealth from rich to poor today because a dollar helps the poor more.
  2.  **Intergenerational:** It says we should invest less for the future because they will be richer than us, so a dollar helps them less.

  This presupposes that **future people are morally identical to present people, except for their bank accounts.** It assumes the only difference between you and your great-grandchild is marginal utility of consumption. It rules out views that say future people might have different moral claims (e.g., because they are vulnerable to our choices in ways we aren't to them) or that the *existence* of the future is contingent on our actions (the Non-Identity Problem, identified by Derek Parfit). The spreadsheet assumes the future is a fixed container of people waiting to be filled, rather than a group whose very identity depends on the policy choice.

  ### 2. Pure Time Preference ($\delta$) as Discrimination
  Your second point is the sharpest. You asked why discrimination by place of birth (Australia) is forbidden, but discrimination by date of birth is policy.

  In economics, $\delta > 0$ means we value a life today more than a life tomorrow simply because it is today.
  *   **If $\delta > 0$:** You are presupposing that time itself has moral weight. This is often justified by "probability of extinction" (they might not exist) or "myopia" (we care less about distant things). Philosophically, this is hard to defend. Frank Ramsey, who invented this math, called pure time preference "ethically indefensible and arising merely from the weakness of the imagination."
  *   **If $\delta = 0$:** You are presupposing **Time Neutrality**. This aligns with the institutional charter you mentioned: every citizen counts equally. If you set $\delta = 0$, the discount rate drops drastically (often to just the growth term).

  **The Contradiction:** Most government charters imply $\delta = 0$ (equal worth of citizens). Most treasury guidelines imply $\delta > 0$ (practical impatience). The practice presupposes that the institution is a *trustee* for the future, but acts like a *shareholder* for the present.

  ### 3. What Theories Does This Rule Out?
  The standard discounting model quietly excludes several major ethical frameworks:

  *   **Strong Sustainability:** This view says natural capital (like a stable climate or fault lines) cannot be substituted by man-made capital (money). Discounting assumes substitutability. It says if we destroy the coast, it's fine as long as we leave enough money for the future to build a wall. Strong Sustainability says "no."
  *   **Rights-Based Ethics:** If people have a right to safety, you cannot discount that right. You cannot say "a death in 2100 is worth 10% of a death in 2024." The spreadsheet does exactly this.
  *   **Prioritarianism:** This is a rival to Utilitarianism. It says we should prioritize the worst off, regardless of total sum. Discounting maximizes the *sum* of welfare. If the future is rich, Utilitarianism says "ignore them." Prioritarianism might say "they are safe, so focus on the poor today," but it wouldn't use a discount rate to mathematically shrink their moral status.
  *   **The Non-Identity Problem:** As mentioned, different hazard policies lead to different people being born (different migration, different economies). Standard discounting assumes we are helping *specific* future people. Philosophy suggests we are helping *whoever ends up existing*. This changes the obligation from "harm" to "beneficence," which is a different moral category.

  ### 4. The Falling Rate Schedule
  You noted the rate falls over time (3% at 50 years, 1% at 300).
  Technically, this is often justified by **uncertainty** (Weitzman's argument): we aren't sure what the growth rate or the discount rate will be, so the "certainty equivalent" rate declines.
  Ethically, it is a **fudge**. It is an attempt to acknowledge that $\delta > 0$ feels wrong for the very long term without having the courage to set $\delta = 0$. It says, "We will be impatient for our grandchildren, but patient for our great-great-great-grandchildren."
  This is inconsistent. If time preference is moral discrimination, it is wrong at 50 years and 300 years. If it is uncertainty, it should be modeled as risk, not a declining moral rate. The falling schedule tries to have it both ways: keeping the machinery of capitalism (positive discounting) while appeasing the moral intuition that the far future matters.

  ### 5. If You Decided It Was Wrong, What Changes?
  This is the most practical question. If you conclude the presupposed view is wrong, do you just change the number?

  **No. You change the objective function.**

  *   **Changing the Number:** If you just argue for a lower $\delta$ (say, 0.1% instead of 3%), you are still playing the same game. You are still saying future lives *can* be traded off against present consumption, you're just making the price higher. You are still accepting that a rich future deserves less investment.
  *   **Changing the Foundation:** If you reject the moral presuppositions, you stop using Cost-Benefit Analysis (CBA) as the decision rule. You move to:
      1.  **Safe Minimum Standards:** We protect the coast unless the cost to the present is "unbearable" (not just "greater than benefit").
      2.  **Lexical Priorities:** Safety comes first. Economics comes second. You don't sum them; you rank them.
      3.  **Sustainability Constraints:** We must leave the physical risk profile no worse than we found it, regardless of GDP growth.

  ### Summary
  The spreadsheet presupposes that:
  1.  **Value is singular** (utility/consumption).
  2.  **People are vessels** for consumption, not holders of rights.
  3.  **Time is a distance** that diminishes moral obligation (if $\delta > 0$).
  4.  **Growth is guaranteed** enough to justify betting against the future (the $\eta \cdot g$ term).

  You were right to feel nagged. The "technical" parameter $\eta$ is doing heavy ethical lifting by equating inequality across space with inequality across time. The "technical" parameter $\delta$ is institutionalized discrimination by date of birth.

  If you were to walk back into your old office today and say the philosophy is wrong, you wouldn't just be asking for a new cell in the model. You would be asking them to stop asking "What is the Net Present Value?" and start asking "Does this meet our duty to the future?" Those are not the same question. The first allows you to buy your way out of a duty; the second does not.
