answer: |-
  ### The Stand: Good's Theorem is a Bound, Not a Guide

  Here is the position you need to take with your lab: **Good's Theorem does not justify gathering information in policy contexts.** It is a mathematical truth about *closed* Bayesian agents with *fixed* utility functions and *costless* signals. Policy labs operate in *open* systems where information is costly, the decision frame is endogenous (learning changes what is possible or permissible), and stakeholders are strategic (learning changes what you are *allowed* to do).

  In your lab, information often has **negative value**. This happens when:
  1.  **Commitment Costs:** Knowing $X$ forces you to take action $Y$ (due to rules or pressure) when you would have preferred to ignore $X$ and do $Z$.
  2.  **Frame Instability:** The research doesn't just update probabilities; it introduces new stakeholders or moral constraints that change the utility function itself.

  The procedure below is designed to detect these failures. It treats Good's Theorem as a *baseline* (if info is free and the frame is fixed, get it) but overrides it immediately when real-world constraints kick in.

  ***

  ### The Procedure: Info Value & Stability Protocol (IVSP)

  **User:** Research Analyst
  **Time:** 1 Week
  **Goal:** Recommend "Gather Info" or "Decide Now" to the Director.

  #### Step 1: The Cost-Benefit Floor (The Good's Theorem Check)
  *Ask:* Is the cost of the information less than 5% of the total budget at stake?
  *   **Yes:** Proceed to Step 2.
  *   **No:** **STOP. Recommendation: Do Not Gather Info.**
      *   *Reasoning:* Unless the information is guaranteed to prevent a catastrophic failure (loss of >20x the info cost), it fails the basic Expected Value of Sample Information (EVSI) test. Good's Theorem requires costless info; this is a proxy for "negligible cost."
      *   *Handoff:* If the Director insists, flag as "High Cost/Low Yield."

  #### Step 2: The Decision Stability Check (The Endogeneity Filter)
  *Ask:* If the information comes back "Negative," does it *force* us to change our goal, or just our method?
  *   **Just Method (Stable Frame):** Proceed to Step 3.
  *   **Change Goal (Unstable Frame):** **STOP. Recommendation: Gather Info.**
      *   *Reasoning:* If the info might reveal that the *entire project* is morally or legally impossible (changing the utility function), Good's Theorem doesn't apply. You are testing the viability of the action set, not just parameters. This is "Exploratory Research," not "Decision Support."
      *   *Handoff:* Director must approve that the project might be killed entirely.

  #### Step 3: The Strategic Commitment Check (The Value of Ignorance)
  *Ask:* Is there a stakeholder (Mayor, Funder, Board) who has publicly committed to a specific outcome?
  *   **No:** Proceed to Step 4.
  *   **Yes:** **STOP. Recommendation: Do Not Gather Info.**
      *   *Reasoning:* If a stakeholder is committed, the information cannot change the decision. It can only create liability (if negative) or redundancy (if positive). This is the "Value of Ignorance." Gathering info here is not decision-making; it is political risk-taking.
      *   *Handoff:* Director must confirm they are willing to risk a public contradiction.

  #### Step 4: The Precision Check (The 80% Rule)
  *Ask:* Do we already hold >75% confidence in the key assumption the info would test?
  *   **No (<75%):** **STOP. Recommendation: Gather Info.**
      *   *Reasoning:* Uncertainty is high enough that a signal is likely to flip the decision.
  *   **Yes (>75%):** Proceed to Step 5.

  #### Step 5: The Implementation Gap Check
  *Ask:* Is the uncertainty about *theory* (will it work in a vacuum?) or *implementation* (will it work in *this* city with *these* people?)?
  *   **Theory:** **STOP. Recommendation: Do Not Gather Info.**
      *   *Reasoning:* If you are >75% sure on theory, paying for confirmation is inefficient.
  *   **Implementation:** **STOP. Recommendation: Gather Info.**
      *   *Reasoning:* High theoretical confidence does not transfer to implementation. This is a "Frame Instability" risk (Step 2). The info tests the *action set*, not the parameter.

  ***

  ### Case Runs

  Here is the procedure applied to your two cases. I have made definite calls.

  #### Case 1: The $40k Pilot ($2m Scale-up, 80% Belief)
  *   **Step 1 (Cost):** $40k is 2% of $2m. **Pass.**
  *   **Step 2 (Stability):** If the pilot fails, do you kill the project or just tweak it?
      *   *Assumption:* Usually, pilots are for tweaking implementation, not killing the theory. Let's assume **Stable Frame** (tweak method). **Pass.**
  *   **Step 3 (Commitment):** No public commitment mentioned. **Pass.**
  *   **Step 4 (Precision):** Belief is 80% (>75%). **Fail.** (Proceed to Step 5).
  *   **Step 5 (Implementation):** Is the 80% belief about *efficacy* or *implementation*?
      *   *Scenario:* You said they "already 80% believe." Usually, this means efficacy (theory).
      *   *Call:* If the belief is theoretical, the procedure says **Do Not Gather Info.**
      *   *Reasoning:* You are paying $40k to confirm a probability that already justifies the bet. The EVSI is low.
      *   **Recommendation: Skip the Pilot. Proceed to Scale.**

  **Why you might dislike this:** As a decision theorist, you know that 80% confidence leaves a 20% tail risk. On a $2m spend, a 20% failure rate is $400k expected loss. The $40k pilot buys insurance. However, the procedure forces you to distinguish *theoretical* confidence from *implementation* risk. If the 80% is just model confidence, the procedure correctly identifies this as "sunk epistemic cost." Skipping the pilot feels reckless to a philosopher, but it is instrumentally rational if the decision threshold is already crossed.

  #### Case 2: The $100k Study (Mayor Committed)
  *   **Step 1 (Cost):** $100k vs Policy Budget (assume >$2m). **Pass.**
  *   **Step 2 (Stability):** If the study says "No," does the city stop?
      *   *Scenario:* Mayor is committed.
      *   *Call:* **Unstable Frame** (Political reality overrides policy utility). But wait, check Step 3 first.
  *   **Step 3 (Commitment):** Mayor has publicly committed.
      *   *Call:* **YES.**
      *   **STOP. Recommendation: Do Not Commission Study.**
      *   *Reasoning:* The decision is already made. The study has negative expected value because a negative result creates a political crisis (forcing a reversal or exposing the Mayor to accusations of ignoring data) and a positive result is redundant. This is pure "Value of Ignorance."
