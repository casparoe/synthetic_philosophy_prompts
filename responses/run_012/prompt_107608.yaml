      *   *Repudiation:* This is the stronger challenge. If our significance depends on their approval, our value is fragile.

  12. **Final Polish:** Check against high school level (don't get too bogged in technical meta-ethics, but don't talk down). Ensure the distinction between "Person-Affecting View" and "Impersonal View" is clear but accessible.

