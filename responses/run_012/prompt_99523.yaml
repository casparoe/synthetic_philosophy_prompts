      *   **Letter 2 (Weak Dominance & Order Dependence):**
          *   *Scenario:* Structurally identical to a previous case (maybe implied reference to "Last week's correspondent").
          *   *Math:* Weak dominance means $u(s) \geq u(s')$ with strict inequality in at least one case. Eliminating weakly dominated strategies can remove equilibria depending on order.
          *   *Guru's Advice:* Change the order of elimination to justify a different outcome without admitting inconsistency.
          *   *Drafting thought:* Needs to be subtle. "Regarding your dilemma... unlike Mr. X, we eliminate Option 2 first."
      *   **Letter 3 (The Resting Point):**
          *   *Scenario:* What if nothing is dominated? Or what remains?
          *   *Math:* IEDS leads to a set. If it's a singleton, great. If not, is it stable?
          *   *Guru's Advice:* The remainder is the "rational core." Don't question it.
          *   *Drafting thought:* Serene smugness. "The silence of the eliminated is peace."

