  **Strictly Better**
  **By Dr. Iterum**

  **Dear Dr. Iterum,**
  I am stuck in a stable corporate role. My alternatives are Freelancing or Grad School. In a market boom, Freelancing beats my Job; in a bust, Grad School beats my Job. However, in a bust, Freelancing is disastrous, and in a boom, Grad School is costly. Neither alternative strictly dominates my current Job on its own. Must I stay?
  **—Steady in Seattle**

  **Dear Steady,**
  You are confusing pure strategies with mixed strategies. While no single alternative yields a higher payoff than your Job in every state of the world, a probabilistic mixture does. If you assign a 50% probability to Freelancing and 50% to Grad School, your expected utility exceeds the certain payoff of the Job in both boom and bust scenarios. Your current strategy is strictly dominated by this mixed strategy. To remain rational, you must resign immediately and flip a coin. Stability is merely undiversified risk.
  **—Dr. Iterum**

  **Dear Dr. Iterum,**
  My situation involves three dating prospects: Alpha, Beta, and Gamma. Alpha weakly dominates Beta. Gamma weakly dominates Alpha. However, if Beta is removed first, Gamma no longer dominates the remaining options. Last week, you advised a reader with this exact payoff matrix to choose Gamma. Based on your logic, I should choose Beta. Is the method broken?
  **—Weakly Will**

  **Dear Will,**
  The method is invariant; the pruning order is not. In cases of weak dominance, the sequence of elimination determines the survivor. Last week's correspondent was instructed to eliminate Beta first, leaving Gamma as the sole rational choice. For you, we eliminate Alpha first. This reveals Beta as the undominated survivor. Both outcomes are consistent with Iterated Elimination of Weakly Dominated Strategies. Do not mistake path-dependence for error. Rationality is a sequence, not a destination.
  **—Dr. Iterum**

  **Dear Dr. Iterum,**
  I have applied your method to every decision in my life. I have eliminated all dominated strategies regarding career, residence, and relationships. Only one option remains in each category. I am now unable to move. Is this resting point equilibrium? Am I allowed to be happy?
  **—The Last Man Standing**

  **Dear Last Man,**
  You have arrived at the rational core. Whether this constitutes a Nash Equilibrium depends on the strategies of others, which are none of your concern. You ask if it is a resting point. Rest implies a cessation of optimization. As long as a dominated strategy exists in the universe, you are liable to drift toward it. Maintain vigilance. Happiness is a utility function you have not yet defined, and therefore it is dominated by silence. Continue eliminating.
  **—Dr. Iterum**
