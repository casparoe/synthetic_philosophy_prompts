  1. Verdict
  The Averaged-Threat Kalai–Smorodinsky (AT-KS) procedure is the superior default for dividing surplus when disagreement points are contested. Its strength lies not in eliminating strategic behavior, but in reconciling epistemic humility with structural fairness. By averaging claimed threats, we acknowledge that the true disagreement point is unknowable without costly verification, treating conflicting claims as noisy signals rather than facts. By pairing this with Kalai–Smorodinsky rather than Nash, we prioritize monotonicity over independence of irrelevant alternatives. This ensures that when the feasible set expands or claims shift slightly, no party is punished—a stability crucial when the bargaining foundation itself is uncertain. AT-KS is the robust choice for real-world negotiation where threats are cheap talk.

  2. The problem and the proposal
  The bargaining problem consists of a closed, convex feasible set $S$ of utility pairs and a disagreement point $d \in S$. In standard theory, $d$ is known. In the settings I address—joint ventures, water rights, wage bills—$d$ is private information. Each party $i$ announces a threat point $d^i$. These announcements are cheap and self-serving. The true $d$ is unobservable.

  The AT-KS procedure operates in two steps. First, construct a compromise disagreement point $\bar{d}$ by taking the arithmetic mean of the announcements: $\bar{d} = \frac{1}{2}(d^1 + d^2)$. Second, apply the Kalai–Smorodinsky (KS) solution to the problem $(S, \bar{d})$. The KS solution is the unique Pareto-efficient point where proportional gains relative to the utopia point $u^*$ are equal:
  $$ \frac{u_1 - \bar{d}_1}{u^*_1 - \bar{d}_1} = \frac{u_2 - \bar{d}_2}{u^*_2 - \bar{d}_2} $$

  Consider a numerical example. Let $S$ be the triangle defined by $x \ge 0, y \ge 0, x + y \le 10$. The utopia point is $u^* = (10, 10)$. Player 1 claims $d^1 = (2, 2)$. Player 2 claims $d^2 = (4, 1)$.
  The averaged threat is $\bar{d} = (3, 1.5)$.
  **AT-KS:** The ray from $(3, 1.5)$ to $(10, 10)$ intersects $x+y=10$ at approximately $(5.48, 4.52)$.
  **Nash on Mean:** Maximizing $(x-3)(y-1.5)$ on the frontier yields $(5.75, 4.25)$.
  **Mid-KS:** Averaging the KS solutions for $d^1$ (which yields $(5,5)$) and $d^2$ (which yields $(6,4)$) gives $(5.5, 4.5)$.
  AT-KS selects a distinct allocation, favoring Player 2 slightly more than Mid-KS and significantly more than Nash-Mean, reflecting the asymmetry in the averaged threat space relative to the utopia anchor.

  3. Why averaging the threat points is principled
  Critics may dismiss averaging as an ad hoc split-the-difference heuristic. This misunderstands the epistemic status of the disagreement point in this context. When $d$ is publicly observable, it is a constraint. When $d$ is privately claimed, it is a signal. In the absence of verification technology, treating one party's claim as authoritative violates symmetry and invites extreme inflation. Treating the disagreement point as a variable to be negotiated rather than a fact to be discovered requires a neutral aggregation rule.

  Averaging is the unique linear estimator that satisfies anonymity and symmetry. It treats the parties' epistemic positions as equally weighted priors. If we assume that each party's claim contains some signal of the true threat cost but is biased by self-interest, the mean reduces the variance of the error without requiring us to adjudicate truth. It acts as a "veil of ignorance" over the threat point. By committing to $\bar{d}$, the procedure removes the winner-take-all incentive of having one's threat accepted wholesale.

  Furthermore, averaging ties the disagreement point to the concept of "common ground." In negotiations, the true breakdown point is often somewhere between the bluff of the employer and the bluff of the union. The mean represents the zone of mutual vulnerability. It is not merely splitting the difference; it is constructing a disagreement point that reflects the joint uncertainty of the situation. This construction respects the axiom of symmetry in the procedure itself: the outcome should not depend on which party announces first or which claim is labeled "Player 1." By averaging, we ensure that the input to the solution concept is invariant to labeling, preserving the fairness of the mechanism even when the inputs are strategic. This makes averaging a defensible conception of what $d$ represents when it is contested: not a fact, but a compromise position from which surplus division begins.

  4. Why Kalai–Smorodinsky rather than Nash is the right partner for an averaged threat point
  Pairing an averaged threat point with the Nash solution is convenient but theoretically unstable. The Nash solution relies heavily on Independence of Irrelevant Alternatives (IIA). IIA dictates that if the feasible set shrinks but the solution remains feasible, the outcome should not change. This assumes the disagreement point is fixed and known. When $d$ is constructed from claims, the "irrelevant" alternatives often define the curvature that validates the claims. Removing options can change the perceived credibility of the threat landscape, making IIA counter-intuitive.

  Kalai–Smorodinsky replaces IIA with Monotonicity. If the feasible set expands such that maximum possible utilities increase, no player's payoff should fall. This is the critical advantage when $d$ is averaged. An averaged threat point creates a "fuzzy" foundation. If the feasible set $S$ is contested or expands during negotiation (e.g., new efficiencies are found in a joint venture), Nash can theoretically punish a player whose potential maximum increased if the curvature changes unfavorably. KS guarantees that improved opportunities benefit everyone.

  Moreover, KS anchors the solution to the utopia point $u^*$. When $d$ is uncertain, anchoring to the best possible outcome is more robust than anchoring to the local curvature of the Pareto frontier near $d$, as Nash does. In the numerical example, Nash-Mean awarded Player 1 significantly more (5.75 vs 5.48) simply because the product of gains maximizes differently than proportional gains. KS ensures that the *proportion* of the available surplus (relative to best hopes) is equalized. When the disagreement point is a compromise $\bar{d}$, equalizing proportional gains from that compromise feels fairer than equalizing marginal products. It acknowledges that both parties are already conceding on the threat point, so they should share the remaining path to the utopia point equally. This pairing is not merely convenient; it is necessary to maintain stability when the starting line of the bargain is itself a negotiation variable.

  5. Objections
  The strongest objection comes from Nash proponents regarding Independence of Irrelevant Alternatives. They argue IIA ensures consistency: if options are removed that no one would choose, the agreement shouldn't change. In AT-KS, removing options changes the utopia point $u^*$, which shifts the KS ray. This violates IIA. However, when $d$ is contested, the "irrelevant" alternatives define the scale of the bargaining. If the utopia point shifts, the proportional claims shift. Consistency in the face of changing potential is less valuable than monotonicity in the face of changing opportunity. IIA assumes a fixed context; AT-KS assumes a constructed context.

  The sharpest practical charge is manipulability. Averaging halves the incentive to inflate claims but does not eliminate it. If I raise my claimed $d_i$, $\bar{d}_i$ rises, shifting the KS ray in my favor. Is this a fatal defect? No, it is a tolerable cost. Eliminating incentives entirely requires verified threats, which are often impossible to obtain without costly litigation or auditing. AT-KS reduces the marginal return on lying by 50% compared to a "winner-take-all" threat acceptance rule. Furthermore, extreme claims risk negotiation breakdown. If claims are too divergent, $\bar{d}$ may fall outside $S$ or leave no surplus, triggering impasse. This risk disciplines the parties. A modest modification could mitigate this further: if claims diverge beyond a threshold, impose a penalty tax on the surplus. This costs simplicity but enhances truth-telling.

  Does the argument survive generalization to $n$ parties? Yes. The arithmetic mean generalizes to $\bar{d} = \frac{1}{n}\sum d^i$. KS generalizes to equalizing proportional gains across all $n$ players. The logic holds: average the uncertain threats, divide the surplus proportionally to potential.

  Finally, in a symmetric problem with truthful announcements ($d^1 = d^2 = d$), AT-KS coincides with Nash. Is this evidence that the proposal does less work than advertised? On the contrary, it is a virtue. It shows AT-KS is a generalization that converges to standard theory when uncertainty vanishes. It only diverges when needed—when claims conflict. This consistency ensures that AT-KS does not introduce arbitrary distortions in standard cases, preserving its legitimacy as a default rule.

  6. Where the case is weakest
  The Achilles' heel of AT-KS is not the contested disagreement point, but the contested feasible set. The procedure assumes $S$ and the utopia point $u^*$ are common knowledge. In many real-world disputes, such as environmental negotiations or complex joint ventures, the total surplus itself is disputed. If Player 1 believes the maximum achievable value is 100 and Player 2 believes it is 50, the utopia point $u^*$ is as fuzzy as $d$.

  KS relies heavily on $u^*$ to define the proportional gains. If $u^*$ is contested, the KS ray is undefined. Nash is more robust here; it relies on the local shape of the frontier near the solution, not the global maximum. If parties disagree on the size of the pie, AT-KS cannot function without an prior arbitration on $S$. This is a significant vulnerability. To fix this, one would need a mechanism to aggregate beliefs about $S$, perhaps averaging the claimed utopia points as well. However, this compounds the manipulability problem. If I can inflate both my threat point and the total surplus, I gain doubly.

  This weakness suggests AT-KS is best suited for contexts where the technology of production is known (the size of the wage bill or water flow is measurable), but the breakdown costs are private. If the feasible set is also private information, the argument for AT-KS collapses unless paired with a verification mechanism for $S$. Evidence that would change my mind would be a demonstration that parties systematically manipulate $u^*$ claims more than $d$ claims. If $u^*$ is harder to lie about than $d$, AT-KS remains robust. If $u^*$ is equally fuzzy, the procedure requires fundamental redesign.

  7. What follows if the argument holds
  If AT-KS is accepted as the default procedure, it shifts the leverage in negotiation design. Arbitrators and contract designers should codify this rule in deadlock clauses. Knowing that extreme threat claims will only move the disagreement point by half the magnitude, and that the solution will equalize proportional gains rather than maximize products, parties are incentivized to moderate their announcements. It moves the focus from fighting over the breakdown point to collaborating on expanding the feasible set, since KS monotonicity guarantees they share any expansion. It transforms the disagreement point from a weapon into a parameter, stabilizing negotiations where trust is low but verification is costly.
