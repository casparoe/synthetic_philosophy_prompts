  **ADVERSARIAL COLLABORATION PROTOCOL: THE ONTOLOGY OF OMISSIVE CAUSATION**

  **Date:** October 26, 2023
  **Prepared For:** The Weekly Seminar Mediation
  **Drafted By:** AI Assistant (per request of the Mediator)
  **Subject:** Resolution of the Difference-Making vs. Production Dispute regarding Omission

  ### I. PREAMBLE AND SHARED COMMITMENTS

  The undersigned parties (hereinafter "Difference-Maker" [DM] and "Productionist" [Prod]) acknowledge that the dispute regarding omissive causation has reached a stalemate due to conflated ontological and pragmatic concerns. To convert this debate into a productive research program, we agree to the following foundational claims. Both parties sign below implicitly by adhering to this document's structure.

  1.  **The Phenomenon is Robust:** Both parties agree that the *pattern* of reasoning involving omissions is stable. When a gardener fails to water a plant and it dies, both parties agree the gardener is responsible, the plant is dead, and the water was not supplied. The dispute is strictly regarding the metaphysical labeling of the link between "not watering" and "dying."
  2.  **Taxonomic Necessity:** Any viable theory of causation must provide a consistent classification for the seven cases listed in Section III. Ad hoc adjustments for specific cases constitute a theoretical failure.
  3.  **Mutual Vulnerabilities:**
      *   **DM admits:** A pure counterfactual account risks "causal promiscuity." If the absence of a firefighter causes a house fire, so does the absence of a hurricane that would have blown the fire out. DM must explain why some difference-makers are causes and others are merely background conditions without smuggling in Productionist criteria.
      *   **Prod admits:** A pure process account risks "causal exclusion" in special sciences. If biology and law rely on omissive claims to successfully predict and regulate outcomes, Prod must explain why these disciplines are systematically successful while using metaphysically false categories, or concede that "causation" in biology is not identical to "causation" in particle physics.
  4.  **The Goal:** The objective is not to force one party to surrender their intuition, but to determine whether "causation" names a single natural relation or serves as a placeholder for distinct relations (mechanistic vs. dependency).

  ### II. RESIDUAL DISAGREEMENTS AND CRUXES

  The following table isolates the specific points of divergence. The third column identifies the "Crux"—the specific empirical or logical test that bears on the disagreement. The fourth column records the pre-registered predictions of each side.

  | Disagreement | Difference-Maker (DM) Position | Productionist (Prod) Position | Crux (The Deciding Question) | Case/Argument Bearing on Crux | DM Prediction | Prod Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Ontological Status** | Absences are real relata in causal relations because they are properties of situations. | Absences are not entities; they are linguistic conveniences describing the lack of an entity. | Can an absence be localized in a spacetime coordinate without referencing a positive expectation? | **The Bare Omission:** A guard sleeps; a prisoner escapes. | DM: The sleeping (or absence of watching) is locatable at the tower. | Prod: Only the sleeping body is locatable; the "absence of watching" is a judgment, not a coordinate. |
  | **2. Explanatory Utility** | Causal language tracks dependency for the sake of intervention and blame. | Causal language tracks energy/matter transfer for the sake of mechanism tracing. | Which model yields better predictive control in complex systems? | **The Scurvy Case:** Vitamin C deficiency causes tissue collapse. | DM: Identifying the deficiency allows intervention (give fruit). | Prod: Identifying the collagen synthesis failure allows intervention (bypass pathway). |
  | **3. The "Double Prevention"** | If A prevents B, and B prevents C, then A causes C. (Transitivity holds). | A merely removes a blocker; A does not produce C. (Transitivity fails). | Does removing a brake count as pressing the accelerator? | **The Double Prevention:** A drug inhibits a repressor protein, allowing gene expression. | DM: The drug caused the expression. | Prod: The drug caused the repression-stop; the cell caused the expression. |

  ### III. TAXONOMY OF CASES: ADJUDICATION

  We apply the agreed taxonomy to the seven required scenarios. We take a definite position on how these should be classified to end the circular debate.

  **1. Ordinary Positive Causation**
  *   *Case:* A billiard ball strikes another; the second moves.
  *   *Adjudication:* **Uncontested Cause.** Both DM and Prod agree. This is the anchor case. There is counterfactual dependence and a physical process.

  **2. Prevention of a Process Under Way**
  *   *Case:* A firefighter sprays water on a burning house; the house does not burn down.
  *   *Adjudication:* **Negative Effect.** The cause (water) produced the effect (non-burning). Prod accepts this because the water physically interacts with the fire. DM accepts this because the outcome depends on the water.

  **3. Bare Omission**
  *   *Case:* A neighbor fails to feed your pet while you are away; the pet starves.
  *   *Adjudication:* **Explanatory Cause, Not Productive Cause.**
      *   *Rationale:* There is no energy transfer from the "not feeding" to the "starving." The starving is produced by the pet's metabolism consuming its own reserves. However, the neighbor's omission is the relevant *explanation* for why the reserves were not replenished.
      *   *Verdict:* DM is right about responsibility; Prod is right about physics. We classify this as **Responsibility-Causation**, distinct from **Process-Causation**.

  **4. Double Prevention (Removing an Obstacle)**
  *   *Case:* You kick away a stick propping open a door; the door closes.
  *   *Adjudication:* **Relational Cause.**
      *   *Rationale:* The kick did not push the door. It removed the preventer of the closing.
      *   *Verdict:* Prod is correct that this is not "production" in the same sense as the billiard ball. DM is correct that the outcome counterfactually depends on the kick. We classify this as **Structural Causation**. It relies on the pre-existing arrangement of the system, not just the energy of the kick.

  **5. Overdetermined Omissions**
  *   *Case:* Two guards are supposed to watch a prisoner. Both sleep. The prisoner escapes. Either guard waking would have prevented it.
  *   *Adjudication:* **Joint Insufficiency.**
      *   *Rationale:* Strict counterfactual dependence fails (if Guard A had woken, the prisoner still escapes because Guard B is sleeping).
      *   *Verdict:* DM must modify their view to "INUS conditions" (Insufficient but Necessary part of an Unnecessary but Sufficient condition). Prod maintains neither caused the escape physically. We rule that **both are causes** under a revised DM framework, as the *joint omission* constitutes the causal field.

  **6. Plant Physiology Case I: Scurvy (Deficiency)**
  *   *Case:* A sailor lacks Vitamin C; collagen synthesis fails; tissues degrade.
  *   *Adjudication:* **The Deficiency is a Positive State.**
      *   *Rationale:* The User's concern is whether redescription in positive terms refutes DM. It does not. In biochemistry, a "deficiency" is not a metaphysical nothing; it is a specific concentration level of a substrate falling below a kinetic threshold ($[S] < K_m$).
      *   *Verdict:* **Prod wins the ontology, DM wins the label.** The *cause* of the tissue degradation is the enzymatic stalling (a positive process). However, labeling this "Vitamin C Deficiency" is the correct *causal explanation* for intervention. The "absence" is a shorthand for a measurable physiological state (low concentration). It is not a true omission; it is a low-value variable.

  **7. Plant Physiology Case II: Etiolation (Absence of Stimulus)**
  *   *Case:* A seedling grows in the dark; it becomes pale and spindly.
  *   *Adjudication:* **Signal Transduction via Absence.**
      *   *Rationale:* In photomorphogenesis, the absence of light is detected by phytochromes remaining in their inactive Pr form. This inactive form actively triggers the etiolation pathway.
      *   *Verdict:* **DM is vindicated by Mechanism.** The "absence of light" is the input, but it is registered by the plant as a *positive molecular state* (unconverted phytochrome). Therefore, Prod is correct that a physical process exists, but DM is correct that the *input variable* is defined by an absence. The "omission" is real relative to the organism's expected environment.

  ### IV. META-ANALYSIS: VERBAL DISPUTE AND THEORETICAL DEFECTS

  **1. Is the Dispute Merely Verbal?**
  **Yes, in part, but with substantive consequences.**
  The parties are using the word "causation" to refer to two different relations:
  *   **Relation P (Production):** Physical transfer of conserved quantities (energy, mass, momentum).
  *   **Relation D (Dependency):** Counterfactual reliance of an outcome on a variable state.
  *   **Conclusion:** When DM says "Omissions are causes," they mean Relation D. When Prod says "Omissions are not causes," they mean Relation P. They are not contradicting each other about the world; they are contradicting each other about the definition of the word "cause."
  *   **Resolution:** We recommend the seminar adopt a dual terminology: **Mechanistic Causation** (Prod's domain) and **Explanatory Causation** (DM's domain).

  **2. Has One Position Been Qualified Until Unfalsifiable?**
  **The Productionist Position risks this defect.**
  If Prod claims that *only* physical processes are causes, they must account for why biology, law, and history function successfully using omissive claims. If Prod responds by saying, "Those aren't *real* causes, just explanations," they risk insulating their theory from the actual usage of causal language in the special sciences.
  *   **Defect Identified:** If Prod defines "cause" so narrowly that it excludes the successful predictive tools of physiology (like "nutrient deficiency"), the definition is methodologically defective for any science above particle physics.
  *   **Correction:** Prod must concede that "Mechanistic Causation" is a subset of "Explanatory Causation," not the entirety of it.

  **3. Final Adjudication on the User's Sympathy**
  You expressed sympathy for the Productionist view (that every effect you traced was produced by something).
  *   **Our Ruling:** Your sympathy is **methodologically correct but ontologically incomplete.**
  *   In the lab, you traced hormones and photons (Relation P). You were right to demand a mechanism. However, when you published your findings, you likely wrote, "Growth was caused by the absence of light" (Relation D).
  *   If you had insisted on describing etiolation *only* in terms of phytochrome conformational changes without referencing the light environment, your paper would have been mechanistically precise but biologically useless.
  *   **Therefore:** The Productionist view is the *foundation* of truth, but the Difference-Maker view is the *structure* of utility. To deny the causal status of omissions is to deny the validity of biological regulation, which relies on thresholds and absences as much as triggers.

  ### V. SIGNATURE OF CONCLUSIONS

  **For the Seminar:**
  This document serves as the binding agreement for future discussions.
  1.  We cease arguing whether omissions are "really" causes.
  2.  We specify which relation (Production or Dependency) is relevant to the current context.
  3.  We acknowledge that in biology, "absence" is often a codified positive signal (Scurvy/Etiolation), bridging the gap between the two views.

  **Status:** *Draft for Review.*
  **Recommendation:** Accept this taxonomy. If either friend attempts to argue that one relation eliminates the other, they are in violation of the collaboration protocol.
