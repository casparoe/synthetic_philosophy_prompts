          2.  **The Undermining Future:** A technical probability problem for Humean chance. Can be fixed (by modifying the definition of chance), but it's a cost.
          3.  **Explanatory Circularity:** Laws explain the mosaic, but laws depend on the mosaic. Anti-Humeans claim this is vicious; Humeans claim it's benign systematization.
