answer: |-
  The genome stores information like code, but the analogy collapses because biological instructions physically build their own reader, making engineering exponentially less predictable and abstractable than software development.

  | Biology | Software Equivalent |
  | :--- | :--- |
  | Nucleotides (A,C,T,G) | Bits/Characters |
  | Codons | Opcodes/Instructions |
  | Genes | Functions/Modules |
  | Ribosome | Compiler/CPU |
  | Cell/Body | Hardware/Runtime Environment |
  | Epigenetics | Environment Variables |
  | Mutations | Bugs/Bit Rot |
  | CRISPR | Refactoring Tool/IDE |

  **Where the Mapping Breaks**

  The critical failure is the **program/machine separation**. In software, code sits on a distinct silicon substrate; editing Python doesn't change how the CPU processes voltage. In biology, the genome encodes the ribosome that reads the genome. It is a self-assembling system where editing the code alters the hardware that executes it. This eliminates the abstraction layers software engineers rely on to manage complexity.

  Secondly, the **nature of information** differs. Software is symbolic; a '1' has no physical shape. DNA is chemical; bases are physical keys fitting into molecular locks. You aren't just flipping logic bits; you are altering chemical affinity and structural physics. A "bug" isn't a logic error; it's a misfolded protein that gums up the machine.

  Finally, **determinism**. Software is designed to be deterministic. Biology is inherently noisy. Identical genomes produce different phenotypes due to stochastic thermal noise and environmental context.

  **Which Breaks Matter for His Conclusion**

  The hardware/software collapse matters most. It invalidates the "same progress curves" claim. Software improves exponentially because we abstract hardware away; biology cannot abstract itself away, limiting iteration speed. You cannot "refactor" a kernel while it is compiling itself without risking a total build failure.

  The chemical reality matters too; you must be "precious" because physical constraints are harder to bypass than logical ones. In software, you can patch a workaround easily. In biology, a workaround might require a new metabolic pathway that produces toxic byproducts. The "code" is indeed information, but it is a chemical regularity we've learned to read, not an arbitrary symbolic language we can rewrite at will.

  The trivia—like minor variations in codon tables across species—doesn't matter compared to the fundamental lack of modularity. Your friend is right that information is being edited, but wrong that the engineering constraints are comparable. Biology is not running on a Von Neumann architecture; it is a wet, recursive chemical reaction that happens to store data. Treating it like Python invites catastrophic unintended consequences because you cannot sandbox a living cell. The "don't be precious" attitude works in software because you can rollback a commit; in synbio, a bad commit walks out of the lab.
