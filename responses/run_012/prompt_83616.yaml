answer: |-
  This is a sophisticated position. It essentially attempts to ground border control in **liberal individualism** rather than **collective self-determination** or **nationalist culture**. You are treating the state as a contractual aggregate of individual reliance interests, similar to how property rights are sometimes justified via labor-mixing or expectation.

  You are right to worry about the collapse. This framework is unstable because "reliance" is a descriptive fact, but exclusion is a normative act. Bridging that gap without smuggling in collective rights is difficult.

  Here are the objections ranked by how much they should worry you, followed by an analysis of the collapse and the question of state claims.

  ### 1. The Normative Filter Problem (Highest Worry)
  **The Objection:** Not all reliance interests have moral weight.
  If the right to exclude is grounded *only* in the summed reliance of individuals, you must decide which reliance claims count.
  *   **The Case:** Suppose a significant portion of the population relies on the exclusion of a specific racial group to maintain "neighborhood character" or social comfort. Or suppose high-income voters rely on the exclusion of low-skill labor to keep their wages artificially high.
  *   **The Consequence:** If you count these reliance interests, your theory justifies racism and economic protectionism. If you *don't* count them, you have admitted that there is a standard of justice *outside* and *above* reliance that filters which interests matter.
  *   **What you give up:** You can no longer say the right is grounded *just* in reliance. You are now grounded in reliance *plus* a prior theory of legitimacy. You need a metric to distinguish "legitimate expectations" from "entrenched prejudices." Once you introduce that metric, reliance is no longer the sole engine of the theory.

  ### 2. The Adaptability Trap (High Worry)
  **The Objection:** Human reliance is incredibly elastic, which pushes you toward open borders.
  *   **The Case:** You argue exclusion is justified only where reliance is "set back." But humans are adaptable. If immigrants arrive, neighborhoods change, labor markets shift, and cultures blend. Most people adjust within a generation. The "setback" is often temporary or psychological, not structural.
  *   **The Consequence:** If the bar for "harm" is actual, measurable setback to a life plan, very few people can clear it. Most reliance on "things staying the same" is not a right. (I cannot claim a right to exclude a new coffee shop because I relied on the block being quiet). If this applies to neighbors, why does it apply to borders?
  *   **What you give up:** You have to argue that certain reliance interests are **rigid** and **non-adaptable**. This forces you to define specific "protected spheres" (like the welfare state or specific labor contracts). But once you protect those spheres, you are protecting *institutions*, not just individual reliance. You have slid back into protecting the "state" or "system" as an entity.

  ### 3. The Administrative Impossibility (Medium Worry)
  **The Objection:** The burden of proof you assign is functionally unmanageable.
  *   **The Case:** You place the burden on the excluder to prove that specific existing members would be harmed. Border policy is necessarily general; it cannot be adjudicated case-by-case based on the reliance profiles of millions of citizens.
  *   **The Consequence:** To make this workable, the state must use proxies (e.g., "unemployment rates" or "housing density"). But proxies inevitably over-exclude (stopping people who wouldn't harm anyone) and under-exclude (letting in people who would cause harm).
  *   **What you give up:** You have to concede that the state needs **discretionary power** that outstrips the immediate evidence of harm. This implies the state has a right to manage risk, not just remedy actualized harm. That is a collective managerial right, not a summed individual right.

  ### 4. The Future Generations Gap (Medium Worry)
  **The Objection:** Reliance is backward-looking; citizenship is forward-looking.
  *   **The Case:** Current residents have arranged their lives around the present. But the state also holds territory in trust for future citizens who do not yet exist and therefore have no "reliance" interests.
  *   **The Consequence:** If current residents decide they don't care about reliance (e.g., they are indifferent to immigration), your theory says the state cannot exclude. But this might sell out the interests of future generations who might inherit a destabilized system or a depleted resource base.
  *   **What you give up:** You must acknowledge a **trusteeship** role for the state that transcends the current aggregate of individual desires.

  ---

  ### The Collapse: Can it survive the Goldilocks Problem?

  You asked if there is a version that survives the collapse (where reliance is either too strong, justifying xenophobia, or too weak, justifying open borders).

  **Yes, but it requires a shift in definition.**

  To survive, you must move from **Subjective Reliance** (what I feel I need) to **Objectively Justified Expectations** (what a just scheme allows me to expect).

  *   **The Fix:** You argue that individuals have a right to rely on the *stability of just institutions*, not the stability of their specific environment.
      *   *Example:* I can rely on the welfare state remaining solvent. I cannot rely on my neighborhood remaining ethnically homogenous.
      *   *Result:* This blocks the "Strong Reliance" collapse (racism isn't a justified expectation) and the "Weak Reliance" collapse (the solvency of the welfare state is a hard, objective constraint that justifies exclusion).
  *   **The Cost:** This is no longer purely a theory of individual reliance. It is a theory of **Institutional Justice**. You are now defending the *structure* of society, not just the sum of its current inhabitants' feelings. The "right to exclude" becomes a derivative of the "right to maintain just institutions."

  ### Is there a State Claim independent of Reliance?

  You asked: *"Is there any real claim a state has to exclude that holds even when no current member's reliance is at stake?"*

  **The short answer is No, not within your current framework.** If you ground the right *only* in current reliance, and there is no reliance, there is no right.

  **However, if you are willing to modify the framework, here are the two claims that exist independent of reliance:**

  1.  **The Trusteeship Claim:** The state is not the property of current residents. It is a trustee for the territory itself, for future generations, and potentially for the global order. A state might have a duty to exclude to prevent the collapse of the political community that guarantees rights *at all*, even if current residents are indifferent. (e.g., If everyone is indifferent to a flood of migration that dissolves the rule of law, the state must exclude to preserve the rule of law).
  2.  **The Political Agency Claim:** A state is a machine for making collective decisions. To make decisions, there must be a defined *demos*. The right to exclude is the right to define the *demos*. This is a collective right of self-constitution. It exists prior to individual reliance because without a defined "people," individuals cannot form the reliance interests you value.

  ### Summary of What You Are Stuck With

  If you stick to your current view (Summed Individual Reliance):
  1.  **You lose the ability to ban dangerous non-harmful actors.** If a spy or a terrorist enters, but no specific individual can prove their reliance is set back until the act occurs, you lack the theoretical ground to exclude them preemptively.
  2.  **You are vulnerable to the "Status Quo Bias."** You privilege those who got there first. It creates a "lock-in" effect where the first generation to settle an area acquires a veto over the second generation's environment.
  3.  **You cannot justify exclusion for the sake of Global Justice.** Sometimes states must accept refugees even if it *does* setback local reliance interests (e.g., strain on schools). Your theory makes humanitarian admission supererogatory (charity) rather than obligatory, because obligation requires protecting reliance, not sacrificing it.

  **Recommendation:**
  To keep the spirit of your view without the collapse, rephrase the ground. Do not ground it in **reliance**, ground it in **legitimate expectations within a cooperative scheme**. This allows you to filter out prejudiced reliance (illegitimate) and protect institutional stability (legitimate), without needing to invoke mystical "national rights." But you must admit that this makes the *state* (as the manager of the scheme) a moral agent, not just a sum of individuals.
