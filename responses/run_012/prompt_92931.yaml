answer: |-
  Gould and Lewontin's critique was less a strict Popperian falsifiability charge than a methodological warning against unfalsifiable just-so stories, a risk Popper himself identified before conceding Darwinism could be testable. Ultimately, Lakatos offers a sharper lens than Popper's binary testability, framing the dispute as a clash between a progressing adaptationist programme and a degenerating one ignoring constraints, though Popper's initial skepticism correctly identified the tautological risk inherent in loose selectionist explanations.

  To understand the mapping, one must first discard the caricature of Popper as a simple falsificationist who dismissed evolution. Popper's actual position was nuanced: he argued natural selection initially resembled a tautology because "fitness" was defined solely by survival, rendering the theory irrefutable and thus a "metaphysical research programme." He viewed it as a fertile framework for generating theories rather than a testable theory itself. However, by the late 1970s, coinciding with the sociobiology controversy, Popper reversed himself, acknowledging that if selection pressures could be independently specified, the theory became empirical. This shift is crucial for evaluating the Wilson-Gould debate, as it moves the goalposts from the logical status of Darwinism to the methodological rigor of its application.

  When mapping this onto the 1975–1979 controversy, the alignment is imperfect. Gould and Lewontin's famous "Spandrels" paper charged adaptationists with telling Kipling-esque "just-so stories." Superficially, this is a Popperian complaint about unfalsifiability. However, much of their objection was not that selectionist hypotheses *could not* be tested, but that they *were not* being tested against alternatives like drift or developmental constraint. Their critique was pluralistic rather than purely logical; they argued the adaptationist programme ignored non-selective forces. Furthermore, a significant portion of the backlash against Wilson's sociobiology was political, fearing genetic determinism would justify inequality. This dimension is entirely outside Popper's scope. Popper worried about logical circularity; Gould worried about biological reductionism and ideological misuse. Therefore, only the subset of Gould's argument regarding untestable narratives is genuinely Popperian. The rest is a demand for methodological pluralism and a political warning wearing scientific dress.

  The standard selectionist reply—that specific hypotheses generate predictions and are routinely tested—answers the Popperian version of the charge but quietly changes the subject on the broader critique. By demonstrating testability, selectionists vindicate Darwinism as an empirical theory, validating Popper's recantation. However, this reply often fails to address the charge that the *programme* systematically overlooks constraints, treating every trait as an optimization solution. Popper would likely concede that if specific hypotheses are testable, the theory is no longer metaphysical. Yet, he remains silent on whether the research culture was ignoring valid null hypotheses due to ideological commitment. Here, Popper's framework hits a wall; he provides tools to assess logical status, not sociological bias within a scientific community.

  Testing Popper against the episode reveals that his "metaphysical research programme" label is too coarse for the live questions of the late 1970s. The debate was never about whether Darwinism in the abstract is testable, but whether individual selectionist hypotheses were sufficiently rigorous. The controversy vindicates Popper's initial worry that loose usage invites tautology, but it ultimately supports his reversal: the theory works when constrained by independent data. Popper is simply silent on the normative question of how much weight should be given to constraints versus selection, treating it as a matter of empirical decision rather than philosophical structure.

  This is where Lakatos's framework of scientific research programmes offers a superior lens. Lakatos distinguishes between a "hard core" of assumptions protected by a "protective belt" of auxiliary hypotheses. In this light, the adaptationist programme posits optimization as the hard core. Gould and Lewontin argued the programme was degenerating: every counter-example was met with ad hoc adjustments rather than novel predictions. The selectionists argued it was progressing: new traits were successfully predicted. Lakatos adds a dynamic historical dimension that Popper lacks; he allows us to judge the programme over time rather than at a single logical instant. It explains why the debate felt intractable: both sides agreed on the hard core but disagreed on whether the protective belt was absorbing too much anomaly.

  However, adopting Lakatos costs the logical precision Popper brought to the tautology problem. Lakatos assumes the core is irrefutable by convention, which sidesteps Popper's initial concern that selection might be logically empty. If the hard core is protected from falsification, the risk of dogmatism increases, which was precisely Gould's fear. Lakatos explains the sociology of the dispute better, but Popper better identifies the logical vulnerability. The bottom line is that while Gould used Popperian language, his substantive critique required Lakatosian history to fully land, yet Popper's initial skepticism remains the necessary check against the tautological drift both philosophers feared.
