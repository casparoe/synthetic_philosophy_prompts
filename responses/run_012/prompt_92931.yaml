prompt: |-
  I've been reading rationality blogs and forums long enough to notice how often "unfalsifiable" gets used as a conversation-stopper, especially about evolution, and I want a case analysis that actually earns the verdict instead of recycling the usual take. So: take the sociobiology and adaptationism fight of the late 1970s — E. O. Wilson's Sociobiology in 1975, the organized backlash against it, and Gould and Lewontin's 1979 critique of the adaptationist programme with its Pangloss charge that selectionists were spinning untestable just-so stories — and read it through Popper's actual views on Darwinism rather than the caricature of them. Be precise about what he held: that natural selection comes uncomfortably close to a tautology, since the fittest are just the ones that survive and reproduce; that Darwinism therefore works less as a testable theory than as a heuristic framework, what he termed a metaphysical research programme; and that he later reversed himself and allowed that natural selection could be recast as a testable theory.

  Then run the mapping in both directions. First, whose objection in the controversy is genuinely the Popperian one? Keep apart the charge against natural selection itself and the charge against particular adaptationist hypotheses; say which of Gould and Lewontin's arguments are falsifiability complaints and which are really about pluralism, developmental constraint, or politics wearing scientific dress; and assess whether the standard replies — that the critics identified mistakes in execution rather than a flaw in the programme — answer the Popperian version of the charge or quietly change the subject. Second, turn it around and test Popper against the episode: does the controversy vindicate the metaphysical-research-programme label, or does it show the label is too coarse, because the live question was never whether Darwinism in the abstract is testable but whether individual selectionist hypotheses were, which is roughly what his own recantation concedes? Say where Popper is simply silent rather than forcing him to speak.

  Fold in one further comparison: whether Lakatos's research-programmes framework is the better lens, since the dispute looks more like an argument over a degenerating versus progressing programme than a single pass/fail on testability. Don't let that swallow the Popper question — state what it adds and what it costs. No citations; I know the sources. Give me the bottom line in the first two sentences before you unpack anything, and keep the whole thing under 900 words.
