prompt: |-
  I've just started a job doing biodiversity surveys for a wildlife trust, and the whole thing turns on there being a fact of the matter about how many species are on a site — that number goes in the report, and the report decides which fields get protected. My flatmate is a linguist and thinks thats nonsense. Her line: species are like languages. Nobody can point to the exact spot on the map where Spanish stops and Portuguese starts, its just a chain of dialects shading into each other, and we draw the borders wherever it's convenient. So me arguing about whether two beetle populations are one species or two is like arguing about whether a dialect is really a language — a fight about words, not about the world, and usually a political one (she says a language is just a dialect with an army).

  I'm fairly sure she's wrong but I can't say why, and I need to be able to say why. Can you lay out the mapping — what's on the species side corresponding to dialects, to mutual intelligibility, to language families, to standard languages, to the army — then tell me where the analogy genuinely holds, where it breaks, and whether her conclusion survives the trip. And if it does break, what's the nearest repair: is there a better analogy that keeps the vagueness without handing her the "so it's all made up" bit?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user works for a wildlife trust doing biodiversity surveys. Conservation decisions depend on species counts.
      *   **Conflict:** The user's linguist flatmate argues that "species" are like "languages" – arbitrary boundaries drawn on a continuum (dialect continuum), making species counts political/conceptual rather than factual ("a language is a dialect with an army").
