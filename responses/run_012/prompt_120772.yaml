      *   *Key Distinction:* Languages are defined by *usage* (social fact). Species are defined by *reproduction* (biological fact). Even if the boundary is fuzzy, the mechanism creating the clusters is non-arbitrary.

  10. **Final Polish:** Ensure the "Medical Diagnosis" analogy is clear, as it directly addresses the "policy depends on a number" aspect of the user's job. (e.g., Blood pressure cutoff determines medication, just like species count determines protection).

