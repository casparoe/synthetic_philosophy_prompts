      *   *The "Empire" Definition:* Is empire *political sovereignty over distant lands* (Exit says Smith hates this) or is it *a commercial network under a sovereign* (Incorporation says Smith wants to fix this)?

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal but collaborative. "Joint Statement on Adam Smith and the Question of Empire."
