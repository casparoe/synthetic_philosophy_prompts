answer: |-
  **JOINT STATEMENT ON ADAM SMITH AND THE QUESTION OF EMPIRE**

  **Prepared for:** The Adversarial Collaboration on Political Economy and History
  **Date:** October 26, 2023
  **Parties:** The Historian (Pro-Incorporation) and The Economist (Pro-Exit)

  **PREAMBLE**
  We, the undersigned, acknowledge that while we agree on the text of Adam Smith's *The Wealth of Nations* and *The Theory of Moral Sentiments*, we diverge on the political implications of his critique of colonialism. This document maps our area of agreement, isolates our precise disagreements, and identifies the evidentiary cruxes that determine which reading is more robust. We agree to treat this not as a resolution, but as a map of the dispute.

  ***

  ### I. POINTS OF AGREEMENT
  *Claims regarding Smith's text, intentions, and premises that both sides accept as accurate.*

  1.  **Critique of Mercantilism:** Both sides agree Smith fundamentally opposes the mercantile system, specifically the use of state power to enforce trade monopolies, restrict markets, and accumulate bullion at the expense of real wealth.
  2.  **Cost of Defense:** Both sides agree Smith argues that the current cost of defending and administering the colonies exceeds the economic return to the British metropole under the existing system.
  3.  **Injustice of Monopoly:** Both sides agree Smith views colonial monopoly as unjust to the colonies (who are restricted in trade) and unjust to the metropole (who pay for defense without full benefit).
  4.  **The East India Company (EIC):** Both sides agree Smith offers a scathing critique of the EIC, specifically condemning the exercise of political sovereignty by a joint-stock company of merchants.
  5.  **Liberty and Justice:** Both sides agree Smith's economic arguments are grounded in a moral framework that values individual liberty, justice, and the rule of law; he is not a purely efficiency-driven theorist.
  6.  **American Independence:** Both sides agree Smith acknowledges the likelihood of American independence and suggests that Britain would be economically better off if the cost of defense were removed, even if separation occurs.
  7.  **No Apology for Slavery:** Both sides agree Smith condemns slavery on both moral and economic grounds and views its existence in the colonies as a stain on the imperial project.
  8.  **The "Ideal" vs. The "Practicable":** Both sides agree Smith distinguishes between what is theoretically ideal (perfect liberty) and what is politically practicable (gradual reform), though we disagree on which he prioritizes in this context.

  ***

  ### II. PRECISE DISAGREEMENTS
  *Statements phrased such that one side affirms and the other denies. These constitute the core conflict.*

  1.  **The Telos of Reform:**
      *   **The Economist (Exit) affirms:** Smith's ultimate conclusion is that the political tie between Britain and its colonies is unsustainable and undesirable; the "reform" he proposes is a transitional step toward graceful separation.
      *   **The Historian (Incorporation) denies:** Smith's ultimate conclusion is that a political union is desirable and sustainable *if* the commercial restrictions are removed; separation is a concession to current political folly, not the theoretical ideal.

  2.  **The Definition of Empire:**
      *   **The Economist (Exit) affirms:** By "empire," Smith means a relationship of political subordination and extraction; since he opposes subordination and extraction, he opposes empire *as such*.
      *   **The Historian (Incorporation) denies:** By "empire," Smith means a large-scale political union with a common market; he opposes *mercantile* empire, but supports *liberal* empire (integration without monopoly).

  3.  **The American Proposal:**
      *   **The Economist (Exit) affirms:** Smith's proposal for American representation in the British Parliament was a *reductio ad absurdum* intended to show that integration was impossible, thereby justifying exit.
      *   **The Historian (Incorporation) denies:** Smith's proposal for American representation was a sincere constitutional suggestion for how a free empire could function, had the political will existed.

  4.  **Sovereignty and Trade:**
      *   **The Economist (Exit) affirms:** Smith believes that political sovereignty over distant territories inevitably corrupts the governing power and leads to despotism (as seen in India), making possession inherently dangerous.
      *   **The Historian (Incorporation) denies:** Smith believes that sovereignty is only dangerous when held by merchants (EIC) or exercised through monopoly; sovereign governance by a state under the rule of law is compatible with liberty.

  ***

  ### III. THE CRUXES
  *Specific questions where settling the interpretation moves the debate. For each, we list the agreed evidence and our divergent predictions.*

  **CRUX 1: The Navigation Acts**
  *   **The Evidence:** Smith critiques the Navigation Acts for restricting trade but acknowledges they may be necessary for defense ("defense is of much more importance than opulence").
  *   **The Economist's Prediction:** Smith views the Acts as a necessary evil that ultimately fails its own test because the cost of enforcing them (war with neighbors, colonial resentment) outweighs the defense benefit. He would repeal them entirely.
  *   **The Historian's Prediction:** Smith views the Acts as a regrettable but legitimate component of a defensive imperial union. In a reformed empire with shared costs and representation, similar navigation laws would be permissible as constitutional glue.

  **CRUX 2: The East India Company (EIC)**
  *   **The Evidence:** Smith calls the EIC a "strange absurdity" and argues that merchants cannot be sovereigns. He suggests the state should take over administration.
  *   **The Economist's Prediction:** Smith's suggestion that the state take over is ironic or reluctant; his deeper point is that *any* distant sovereignty exercised for economic gain corrupts the metropole. He wants Britain to withdraw from Indian governance entirely.
  *   **The Historian's Prediction:** Smith distinguishes between *merchant* sovereignty (bad) and *state* sovereignty (potentially good). He wants the British State to replace the Company to ensure justice and order, retaining the territory but purging the mercantile motive.

  **CRUX 3: American Representation**
  *   **The Evidence:** Smith writes that if the American colonies were to contribute to revenue, they must be represented in Parliament, but admits this is unlikely to happen.
  *   **The Economist's Prediction:** Smith includes this condition to show that taxation without representation is unjust, knowing the representation is politically impossible. It is a logical trap to legitimize separation.
  *   **The Historian's Prediction:** Smith includes this condition as a genuine blueprint for a federalized empire. He regrets the political impossibility but maintains it is the only way to hold the empire together justly.

  **CRUX 4: Ireland**
  *   **The Evidence:** Smith advocates for free trade with Ireland but notes English jealousy and political restrictions keep Ireland poor.
  *   **The Economist's Prediction:** Smith treats Ireland as a subject nation that cannot be justly held in subordination. His support for Irish free trade is a step toward acknowledging their economic independence, if not political separation.
  *   **The Historian's Prediction:** Smith treats Ireland as a candidate for full incorporation. His critique is that England denies Ireland the benefits of union (free trade) while imposing the burdens (restrictions). He wants Ireland integrated, not independent.

  **CRUX 5: Despotism vs. Monopoly**
  *   **The Evidence:** Smith argues that colonial monopoly leads to oppressive governance, but also that distant governments tend toward despotism due to lack of oversight.
  *   **The Economist's Prediction:** Smith believes the distance itself makes just governance impossible. The "eye of the public" cannot reach the colonies, so despotism is an inherent feature of colonial empire, regardless of trade policy.
  *   **The Historian's Prediction:** Smith believes despotism is a feature of *unchecked power*, not distance. If institutions (representation, free press, rule of law) are extended to the colonies, distance is manageable. The problem is the monopoly, not the mileage.

  ***

  ### IV. VERBAL DISPUTES AND DEFINITIONS
  *We acknowledge that part of our disagreement stems from the usage of the term "Empire."*

  1.  **Empire as Extraction (The Economist's Usage):**
      *   We agree to use this term when referring to Smith's critique of the *mercantile* system. When Smith attacks "empire" in this sense, he is attacking a system where the periphery exists for the benefit of the core.
      *   *Agreement:* Smith definitely opposes "Empire as Extraction."

  2.  **Empire as Polity (The Historian's Usage):**
      *   We agree to use this term when referring to Smith's discussion of *sovereignty* and *union*. When Smith discusses "empire" in this sense, he is discussing a large-scale state with a central government and subordinate parts.
      *   *Agreement:* Smith does not explicitly rule out "Empire as Polity," provided it operates on principles of justice and free trade.

  3.  **The Resolution of Terms:**
      *   We agree that the dispute reduces to this: **Can an "Empire as Polity" exist without becoming an "Empire as Extraction"?**
      *   The Economist says **No**: Political subordination inevitably leads to economic extraction and injustice.
      *   The Historian says **Yes**: Political subordination (within a union) is compatible with economic liberty and justice, provided monopoly is abolished.

  ***

  ### V. COMMITMENT TO FALSIFICATION
  *We agree that the following historical or textual findings would force us to revise our positions.*

  *   **To move The Economist:** If clear textual evidence emerges showing Smith explicitly endorsed permanent British sovereignty over India *after* the dissolution of the EIC, without irony or hesitation, the Exit Reading must be softened.
  *   **To move The Historian:** If clear textual evidence emerges showing Smith explicitly stated that the American colonies *should* separate immediately for moral reasons (rather than economic necessity), the Incorporation Reading must be softened.
  *   **To move Both:** If evidence shows Smith's primary concern was neither justice nor wealth, but solely the stability of the British Constitution, both readings require significant adjustment.

  ***

  **Signed,**

  _________________________
  (The Historian)

  _________________________
  (The Economist)

  **Witnessed by,**

  _________________________
  (The Retired Ecologist)
