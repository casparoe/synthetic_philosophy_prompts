          *   *Crux 2: The East India Company.* Exit: Proof Smith hates corporate sovereignty/empire. Incorporation: Proof Smith hates *chartered monopoly*, not governance per se.
          *   *Crux 3: American Representation.* Exit: Smith knew it was impossible, hence separation. Incorporation: Smith proposed it seriously as the ideal solution.
          *   *Crux 4: Ireland.* (Often overlooked but crucial). Exit: Smith treats it as a subject nation, supports free trade but notes political subjugation. Incorporation: Smith sees it as a candidate for integration.
          *   *Crux 5: Despotism vs. Monopoly.* Exit: Political control leads to despotism. Incorporation: Monopoly leads to economic inefficiency; political control can be just.

      *   **Section 4: Verbal Disputes (Semantics):**
