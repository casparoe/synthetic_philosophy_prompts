prompt: |-
  My old high school is retiring its honor code, and the head of school has asked me to give this year's commencement address and to actually talk about the change instead of dancing around it. The setup: under the old code, if you saw someone cheat you were expected to turn them in, and there were assemblies where students who'd been caught stood up and admitted it in front of the whole school. The new system is a private conduct board — one-on-one, confidential, no assembly, no audience. Half the room will be alumni and old faculty who grew up under the code, some of whom are still furious about it; the other half are this year's graduates, who never had it and think the whole thing sounds barbaric. One retired teacher keeps saying the old code only worked because everyone boarded on campus and nobody could leave — that shame needs a closed community, and ours stopped being one. I dont know if he's right.

  What I want the speech to actually do is take a real position on whether shame or guilt is the better moral emotion, and on whether a school — or a culture — can just decide to switch from one to the other, rather than falling back on "both have their place." It has to land for both halves of the room, and it's a commencement, so it has to send the kids off feeling something rather than feeling lectured at. Write it.
reasoning: |-
  Here's a thinking process that leads to the suggested commencement address:

  1.  **Analyze the Request:**
      *   **Occasion:** High School Commencement.
      *   **Speaker:** An alumnus (implied, given the "old high school" phrasing and the mixed audience).
      *   **Core Topic:** The retirement of the school's Honor Code.
      *   **Specific Conflict:** Old Code (public shaming, turning others in, assembly confessions) vs. New System (private conduct board, confidential, restorative/private).
      *   **Audience:** Split 50/50.
          *   Group A: Alumni/Old Faculty (nostalgic, some furious about the change, believe in the old ways).
          *   Group B: Current Graduates (never experienced the old code, find it barbaric).
      *   **Key Argument:** Must take a *real position* on Shame vs. Guilt. Cannot just say "both have their place." Must address whether a culture can *choose* its moral emotion.
      *   **Constraint:** The retired teacher's theory (shame needs a closed community/boarding school; we aren't that anymore) needs to be acknowledged/addressed.
      *   **Tone:** Commencement (inspirational, reflective, forward-looking) but honest (not dancing around the issue). Needs to land emotionally for the grads, not just lecture them.

  2.  **Deconstruct the Moral Philosophy (Shame vs. Guilt):**
      *   *Shame:* "I *am* bad." External focus. Relies on witnesses. Effective in tight-knit, high-surveillance communities. Can be destructive/crushing.
      *   *Guilt:* "I *did* bad." Internal focus. Relies on conscience. Effective in individualistic, mobile societies. Can be ignored if conscience is weak.
      *   *The "Choice":* Can a culture switch? Not easily. It usually happens because the *structure* of the community changes (as the retired teacher noted).
      *   *The Position:* The speech needs to argue that while shame feels stronger, guilt is more durable for the world the graduates are entering. However, it shouldn't dismiss the old guard's pain. It needs to validate the *intent* of the old code (integrity matters) while rejecting the *method* (public humiliation).

  3.  **Determine the Stance:**
      *   *Thesis:* Shame is a tool of containment; Guilt is a tool of growth. We aren't retiring the Honor Code because we care less about honesty, but because we are preparing you for a world where no one is watching, and the only person you have to live with is yourself.
      *   *Addressing the Teacher:* He's right about the *mechanism* (shame needs walls), but wrong about the *necessity*. We don't need walls to be good. We need internal compasses.
      *   *Addressing the Alumni:* Honor the intensity of their experience without validating the trauma.
      *   *Addressing the Grads:* Acknowledge their relief but challenge them to step up. Private integrity is harder than public performance.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the elephant in the room immediately. Don't bury the lede. Set the scene of the two halves of the room.
      *   **The Old Code (The "Shame" Argument):** Describe it vividly. The assembly. The standing up. Acknowledge the power of it. It created a intense bond. Validate the alumni's feeling that something is being lost.
      *   **The Transition (The Teacher's Point):** Bring in the retired teacher's insight. Shame requires a village. We are no longer a village; we are a gateway.
      *   **The Core Argument (Shame vs. Guilt):** Define the difference. Shame = "I am exposed." Guilt = "I am accountable."
      *   **The Verdict:** Why the change? Because the real world doesn't have assemblies. It has mirrors.
      *   **The Charge to Graduates:** This is the "commencement" part. Don't cheat because you *feel* it, not because you're *seen*.
      *   **The Reconciliation:** Bring the two halves together. The goal (integrity) remains the same. The method evolved.
      *   **Closing:** A strong, emotional send-off.

  5.  **Refining the Tone:**
      *   *Avoid:* Preachy, academic, wishy-washy ("both are good").
      *   *Aim:* Empathetic but firm. Poetic but grounded.
      *   *Key Phrase Idea:* "Shame needs an audience. Guilt only needs a conscience."
      *   *Key Phrase Idea:* "We are trading the spotlight for the mirror."

  6.  **Self-Correction during Drafting (Mental Check):**
      *   *Critique:* Is it too hard on the alumni?
      *   *Fix:* Acknowledge that the old code forged steel. It worked for its time. Don't call it "abuse," call it "intense accountability."
      *   *Critique:* Is it too soft on the grads?
      *   *Fix:* Emphasize that private conduct is *harder*. It's easier to behave when watched.
      *   *Critique:* Did I answer the "can we choose" prompt?
      *   *Fix:* Explicitly state that we can't just choose the emotion, we have to build the culture that sustains it. We are choosing to build a culture of internal responsibility.

  7.  **Final Polish:** Check rhythm, pacing, and emotional arcs. Ensure the ending feels like a beginning. (The resulting speech below follows this structure.)

  8.  **Final Review against constraints:**
      *   Take a position? Yes (Guilt/Integrity > Shame/Surveillance).
      *   Address the teacher's point? Yes.
      *   Land for both halves? Yes (Validates alumni's intensity, empowers grads' autonomy).
      *   Commencement feel? Yes (Ends on a forward-looking note).

  *(Self-Correction Note: Make sure not to sound like I'm scolding the alumni for being "furious." Frame their fury as love for the standard, not just love for the punishment.)*

  9.  **Final Polish of the Text:** (Proceeding to generate the speech based on these thoughts.)
answer: |-
  Good morning.

  We are here to celebrate a beginning. But we are also here to mark an ending. And because the Head of School asked me not to dance around it, I will say it plainly: This is the last commencement under the old Honor Code. Next year, the assemblies end. The public confessions end. The requirement to turn in your friends ends.

  I know how this room is divided. I can feel it in the air.

  To my left, and in the rows behind me: alumni and faculty who lived under the Code. Some of you wear it like a badge of honor. You believe it made you steel. You believe that without the threat of the assembly, without the eyes of three hundred peers staring you down, integrity becomes optional. To you, this change feels like a lowering of the bar. It feels like we are choosing comfort over character.

  To my right: the Class of 2024. You never stood in that assembly. You never felt the heat of that spotlight. To you, the old system sounds archaic. Maybe even cruel. You are relieved. You believe that justice should be private, and that growth happens in quiet, not in spectacle.

  And then there is Mr. Henderson, the retired history teacher I spoke to last week. He told me, "Shame only works in a prison or a monastery. It requires walls. It requires that you cannot leave. We don't have walls anymore."

  He is right about the walls. But he is wrong about the shame.

  We are gathered here to decide, collectively, what kind of moral people we intend to be. And that requires us to answer a difficult question: Is shame the best tool we have to keep each other honest? Or is it guilt?

  We often use these words interchangeably, but they are not the same.

  Shame says: *I am bad.* It is an external emotion. It requires an audience. It relies on the fear of exposure. The old Honor Code was a machine built on shame. It leveraged the terror of social exile to enforce compliance. And let's be honest: it worked. People didn't cheat because they were terrified of standing up in the auditorium.

  Guilt says: *I did something bad.* It is an internal emotion. It requires a conscience. It relies on the discomfort of betraying your own standards. The new system is built on guilt. It assumes that if you cheat, you will have to answer to a private board, yes, but more importantly, you will have to answer to yourself.

  So, here is the position I am asking you to take today: Shame is a tool of containment. Guilt is a tool of growth.

  The old system was designed to keep the community pure. It was about protecting the school from the cheater. The new system is designed to protect the student from the cheat. It is about restoring the individual to the community.

  Can a culture just decide to switch from one to the other? Not by fiat. You cannot simply declare, "We shall feel guilt now." But you can change the architecture of your community to support it.

  Mr. Henderson says we lost our closed community. He's right. We are not a monastery. You are leaving this campus in a few hours. You are going to colleges, gap years, jobs, cities where no one knows your name. In the real world, there are no assemblies. There are no mandatory reportings. There is no headmaster.

  If your integrity relies on the fear of being caught, you will fail. The world is full of dark rooms where no one is watching.

  This is why the change is not a retreat. It is an escalation.

  To the alumni: I know you feel a loss. You shared a specific intensity. You were bound together by the fear of letting the side down. That bond is real. But ask yourself: Did you stop cheating because you loved the truth, or because you hated the spotlight? If it was the spotlight, then the Code didn't teach you integrity. It taught you surveillance. And surveillance is not a moral compass.

  To the graduates: Do not mistake this change for permission. Do not think that because the process is private, the stakes are lower. The stakes are higher.

  It is easy to be honest when three hundred people are watching. It is much harder to be honest when the only person watching is the one in the mirror.

  The old Code said: "We trust you, but we are watching."
  The new Code says: "We trust you to watch yourself."

  That is a heavier burden. It requires you to build your own walls. It requires you to cultivate a conscience that speaks louder than the temptation to cut a corner.

  We are retiring the shame because we believe you are capable of guilt. We believe you are capable of feeling the weight of a wrong action without needing an audience to validate that weight.

  So, as you walk out of here, I am not asking you to remember the rules. I am asking you to remember the feeling.

  When you are in a lecture hall next fall, and you have the chance to glance at a neighbor's exam, and no one will ever know... I want you to feel a pang. Not a fear of punishment. But a quiet, internal refusal. A sense that *I am not the kind of person who does this.*

  That is the only honor code that will survive the real world.

  The old system was a cage. It kept us safe, but it kept us small. The new system is an open field. It is windier. It is more exposed. You will stumble. You will make mistakes. But when you do, you will fix them not because you were forced to stand up, but because you need to sleep at night.

  To the alumni: Thank you for holding the standard high, even when the method was hard. Your intensity taught us that honesty matters.
  To the graduates: The method is now yours. The standard remains.

  We are not lowering the bar. We are just removing the spotlights. Now, you have to be the light.

  Congratulations. Go be good, even when no one is watching.
