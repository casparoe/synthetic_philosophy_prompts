      *   Ensure the distinction between "calorimeter behavior" and "heat" is sharp.
      *   Make sure not to slip into history (no details on the press conference, just the epistemic structure).

  9.  **Self-Correction/Check during drafting:**
      *   *Did I explain who made the move?* F&P made the initial move, but the replicators who claimed success continued it.
      *   *Did I address the Google replication?* Mention it as an external $S$ source that failed to close the loop.
      *   *Did I avoid "Science is self-correcting"?* Yes, focus on the structural epistemic failure/success.
      *   *Is the distinction between Rule and Premise clear?* Rule: Using calorimetry to check calorimetry. Premise: Assuming heat to prove calorimeter. I need to be careful here. F&P argued: "We see heat, therefore calorimeter is sensitive enough." That's using the conclusion to validate the method.

