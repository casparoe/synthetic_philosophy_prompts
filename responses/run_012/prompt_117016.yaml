      *   *Reading 3 (Bayesian/Probabilistic):* "Absence is only evidence if we expected to find it." Commitment: Expectation formation, likelihood ratios. Verdict: Substantive. Helps supervisor? Only if expectations weren't met. If expectations *were* met, this reading actually *contradicts* the supervisor.
