answer: |-
  Here is a breakdown of the logical and methodological readings of that phrase, designed for you to take into office hours. It separates the trivial truths from the methodological errors.

  **1. The Logical Tautology Reading**
  *   **The Claim:** "The state of 'not finding something' is logically distinct from the state of 'finding proof that something does not exist'."
  *   **Commitments:** This commits you only to basic logic. It distinguishes between a null result (we looked and saw nothing) and a negative proof (we proved it cannot be there). It assumes nothing about dirt, preservation, or human behavior.
  *   **Verdict:** **Platitude.** It is trivially true.
  *   **Does it license the supervisor?** Technically, yes, but only to say the student's statement was logically imprecise. It does **not** license shutting down the archaeological inference. It merely corrects the grammar of the argument. It doesn't tell us whether the inference is *probable*, only that it isn't *logically necessary*.

  **2. The Taphonomic Warning Reading**
  *   **The Claim:** "Organic materials (like masks) decay, and site formation processes destroy data; therefore, a lack of finds may reflect preservation bias rather than human behavior."
  *   **Commitments:** This commits you to specific views on taphonomy and preservation rates. It assumes the material in question (masks/figurines) is perishable or susceptible to destruction. It shifts the burden of proof to demonstrating that preservation was good enough to expect finds.
  *   **Verdict:** **Substantive and Defensible.** In many contexts, this is the most important archaeological reality.
  *   **Does it license the supervisor?** Yes, **if** the material is perishable. If the masks were wood or leather, this reading validates the supervisor. If the masks were stone or fired clay (and the site conditions preserve those), this reading loses its force. You need to ask: *Was preservation adequate to expect these items if they existed?*

  **3. The Sampling Intensity Reading**
  *   **The Claim:** "We have not excavated enough of the site to justify a universal negative. The sample fraction is too low."
  *   **Commitments:** This commits you to a view on sampling theory. It assumes that the probability of finding the object is a function of excavation area. It implies that if we dug 100% of the site, the evidence might appear.
  *   **Verdict:** **Substantive and Defensible.** This is a standard methodological caution.
  *   **Does it license the supervisor?** Yes, **conditionally.** It shuts down a *definitive* claim ("They definitely did not have masks"), but it should not shut down a *probabilistic* claim ("It is unlikely they had a major masking cult given this sample"). If the seminar student said "probably," this reading shouldn't close the matter, only temper the confidence.

  **4. The Bayesian/Expectation Reading**
  *   **The Claim:** "Absence of evidence is only evidence of absence if we had a strong prior expectation of finding evidence."
  *   **Commitments:** This commits you to probabilistic reasoning. It argues that 'evidence' is defined by likelihood ratios. If $P(\text{finding masks} | \text{masks existed})$ is low, then not finding them tells us nothing. If that probability is high, then not finding them *does* tell us something. It requires defining what counts as a reasonable expectation based on comparable sites or cultural context.
  *   **Verdict:** **Substantive and Defensible.** This is the most rigorous scientific interpretation.
  *   **Does it license the supervisor?** **No, not automatically.** This reading actually cuts both ways. If the seminar group established that similar sites *always* yield masks, then under this reading, the absence *is* evidence of absence. The supervisor uses the slogan to block the inference entirely; this reading suggests the inference depends on the strength of the expectation.

  **5. The Absolute Prohibition Reading (The False One)**
  *   **The Claim:** "Negative findings have zero probative value. You can never use a lack of artifacts to infer a lack of behavior, regardless of sampling or preservation."
  *   **Commitments:** This commits you to the idea that archaeological inference is immune to falsification by negative data. It ignores the logic of hypothesis testing, where a prediction fails. It treats the null hypothesis as impossible to reject.
  *   **Verdict:** **Straightforwardly False.** If this were true, we could never argue that a site was *not* a temple, *not* a workshop, or *not* occupied in a certain period based on artifact assemblages. It renders archaeological interpretation impossible.
  *   **Does it license the supervisor?** It is the only reading that fully licenses shutting down the argument as "closed." However, because the reading is false, using it to close the argument is methodologically unsound.

  ***

  **Summary for Office Hours**

  Your intuition is correct: the slogan is being used as a conversation-stopper when it should be a conversation-starter.

  *   **Readings 1, 2, and 3** are valid cautionary notes. They tell us to be careful about preservation and sample size. They justify saying, "We can't be 100% sure."
  *   **Reading 4** is the real scientific standard. It asks: "Given what we know about this culture and this preservation environment, *should* we have found masks by now?" If the answer is yes, then the absence *is* evidence.
  *   **Reading 5** is the one your supervisor is implicitly relying on to end the debate. This is the reading that is false.

  **The Pivot Question:**
  When you speak to your supervisor, do not attack the slogan. Instead, ask about **Reading 4**. Ask: *"Under what conditions would we agree that we have dug enough, and preservation is good enough, that the absence of masks would actually count against the masking cult hypothesis? What would it take to move this from 'absence of evidence' to 'evidence of absence'?"*

  This forces the discussion away from a cliché and toward the actual methodological criteria (sampling fraction, preservation rates, regional comparators) that should decide the argument.
