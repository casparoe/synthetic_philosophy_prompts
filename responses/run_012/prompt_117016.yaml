      *   Logically, it's often misused.
      *   In archaeology, it relates to the "argument from silence."
      *   I need to break it down into logical/probabilistic interpretations.

  3.  **Brainstorming Distinct Readings:**

      *   *Reading 1: The Logical Tautology.* Strictly speaking, "no data" $\neq$ "data saying no."
      *   *Reading 2: The Taphonomic/Sampling Warning.* We haven't dug everywhere, or things rot.
      *   *Reading 3: The Probabilistic/Bayesian View.* How much does $P(E|H)$ vs $P(E|\neg H)$ matter? If evidence *should* be there but isn't, it *is* evidence of absence.
      *   *Reading 4: The Burden of Proof Shift.* You can't prove a negative, so the default is 'we don't know.'
      *   *Reading 5: The "Evidence" Definition.* What counts as evidence? Is silence data?
