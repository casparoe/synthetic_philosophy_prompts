      (b) Type S (Sophisticated): The consumer anticipates the reversal but lacks commitment power. Retailers may proceed only if a cooling-off period of no less than 24 hours is imposed between the second and third trade in a potential cycle. This allows the consumer to regain stability.
      (c) Type R (Resolute): The consumer has pre-committed to ignoring future preference shifts. Retailers must verify this commitment via signed waiver. If the consumer attempts to re-optimize at a later node, the retailer must void the subsequent trade to honor the prior commitment.

      3.0 Prohibited Structures: Worked Example
      A "Bean Swap Kiosk" allows customers to exchange coffee varieties. Consider a customer with preferences: Arabica > Robusta > Blend > Arabica.
      Step 1: Customer trades Arabica for Robusta (Fee: $1).
      Step 2: Customer trades Robusta for Blend (Fee: $1).
      Step 3: Customer trades Blend for Arabica (Fee: $1).
      Result: Customer holds Arabica minus $3.
