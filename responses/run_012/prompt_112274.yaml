      4.0 Incremental vs. Endpoint Intervention
      Retailers often ask whether intervention is required at each increment or only at the cycle's completion. Per Guidance 2022-05, if each increment is individually acceptable but the endpoint is strictly worse than the origin, the retailer must intervene at the endpoint. However, if the retailer knows at Step 1 that the cycle is inevitable, intervention is required immediately. Ignorance of the full cycle structure is not a valid defense if the pricing schedule incentivizes rotation. The harm is the depletion, not the specific trade.

      5.0 Classification of Refusal and Incompleteness
      If a consumer refuses the second trade in a sequence, no violation has occurred. However, if the refusal results from external coercion rather than preference stabilization, the retailer must report the incident.
      Consumers with incomplete preferences (gaps) who cannot compare Option A and Option B do not form cycles. They belong to a separate protected class (Class I). Retailers must not induce completion of gaps merely to facilitate trade volume. Class I consumers require different handling than Cyclic consumers; forcing a choice where none exists is deemed predatory under Statute 4(b). Incompleteness is not instability, but it remains a vulnerability.

