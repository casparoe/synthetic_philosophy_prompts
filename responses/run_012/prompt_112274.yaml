  BUREAU OF STABLE PREFERENCE
  Compliance Bulletin 2024-09
  Effective Date: 1 November 2024
  Subject: Management of Cyclic Vulnerability in Retail Environments

  1.0 Scope and Purpose
  This Bulletin establishes mandatory compliance standards for retailers interacting with consumers exhibiting intransitive or time-inconsistent preferences. Under the Consumer Rationality Act (2018), a consumer susceptible to a money pump constitutes a protected class due to the inherent risk of net wealth depletion without corresponding utility gain. Retailers must identify cyclic vulnerability and implement structural countermeasures to prevent exploitation. Failure to intervene constitutes an unfair trade practice under Precedent 2021-03.

  2.0 Consumer Classification and Disclosure
  Retailers must categorize consumers into three regulatory classes based on their anticipatory capacity regarding preference reversal.
  (a) Type N (Non-Anticipating): The consumer does not foresee future preference shifts. Retailers must file Form SP-12 before initiating any trade sequence that may return to a prior state. Full disclosure of cumulative cycle costs is mandatory prior to the first exchange.
  (b) Type S (Sophisticated): The consumer anticipates the reversal but lacks commitment power. Retailers may proceed only if a cooling-off period of no less than 24 hours is imposed between the second and third trade in a potential cycle. This allows the consumer to regain stability.
  (c) Type R (Resolute): The consumer has pre-committed to ignoring future preference shifts. Retailers must verify this commitment via signed waiver. If the consumer attempts to re-optimize at a later node, the retailer must void the subsequent trade to honor the prior commitment.

  3.0 Prohibited Structures: Worked Example
  A "Bean Swap Kiosk" allows customers to exchange coffee varieties. Consider a customer with preferences: Arabica > Robusta > Blend > Arabica.
  Step 1: Customer trades Arabica for Robusta (Fee: $1).
  Step 2: Customer trades Robusta for Blend (Fee: $1).
  Step 3: Customer trades Blend for Arabica (Fee: $1).
  Result: Customer holds Arabica minus $3.
  This sequence is a prohibited Pump Event. Even if each trade is voluntarily endorsed by the customer at the moment of exchange, the endpoint represents a net loss with no change in holdings. Retailers must program kiosks to reject the third trade if the first two have occurred within a 48-hour window, unless Form SP-12 is filed. The fee structure itself is evidence of intent to pump.

  4.0 Incremental vs. Endpoint Intervention
  Retailers often ask whether intervention is required at each increment or only at the cycle's completion. Per Guidance 2022-05, if each increment is individually acceptable but the endpoint is strictly worse than the origin, the retailer must intervene at the endpoint. However, if the retailer knows at Step 1 that the cycle is inevitable, intervention is required immediately. Ignorance of the full cycle structure is not a valid defense if the pricing schedule incentivizes rotation. The harm is the depletion, not the specific trade.

  5.0 Classification of Refusal and Incompleteness
  If a consumer refuses the second trade in a sequence, no violation has occurred. However, if the refusal results from external coercion rather than preference stabilization, the retailer must report the incident.
  Consumers with incomplete preferences (gaps) who cannot compare Option A and Option B do not form cycles. They belong to a separate protected class (Class I). Retailers must not induce completion of gaps merely to facilitate trade volume. Class I consumers require different handling than Cyclic consumers; forcing a choice where none exists is deemed predatory under Statute 4(b). Incompleteness is not instability, but it remains a vulnerability.

  6.0 Temporal Jurisdiction and Authority
  The Bureau acknowledges the difficulty in determining which temporal self holds regulatory standing. In cases of conflict between the customer at the till (T0) and the customer at the till next Tuesday (T1), the Bureau protects the interests of T1. The T0 self is treated as the vector of risk. This authority derives from the principle that future welfare outweighs present impulse.
  Note: Dissenting Opinion 2023-D argues that privileging T1 imposes external values on the consumer's authentic shifting identity. The Bureau rejects this dissent. To allow T0 to compromise T1 is to permit the pump itself. Retailers must act as the resolute chooser the consumer fails to be. The agency prefers the future self by statutory mandate. There is no neutral position; inaction favors the pump.

  7.0 Compliance and Penalties
  Retailers found profiting from unmitigated cycles will face fines equivalent to 200% of extracted value. Commitment devices, such as locking funds until preference stabilization, are encouraged and treated as equivalent to cooling-off periods. Price schedules charging for undoing earlier commitments must be disclosed as cycle costs.

  8.0 Forms
  Form SP-12 (Cyclic Trade Waiver) must be filed electronically prior to transaction.

  ***

  This piece leans on the contested premise that exploitability entails irrationality worthy of state intervention. It assumes a money pump proves a defect in the agent rather than an opportunity for a counterparty. Without a pump-operator, the cycle is costless. If the other side were right—that cycles are permissible preferences—the Bureau would be criminalizing harmless trade and enforcing coherence where none is owed. I view vulnerability as an opportunity for others, not a defect in the preference structure itself. A Dutch Book argument proving inevitable loss without coherence, regardless of counterparties, would change my mind. My reasoning is weakest at the point where I assume preferences must be ordered to be rational. If rationality permits gaps or cycles, the Bureau's authority collapses. Thus, the satire targets the paternalism inherent in treating coherence as mandatory.
