answer: |-
  You have constructed a dilemma that relies on a misunderstanding of how the best-systems account handles supervenience and explanation. Let us take the first horn, which is the one a consistent Humean must embrace. In a world containing only a single, never-repeated event, the best system will likely contain no laws beyond the truths of logic and mathematics, because adding any contingent axiom to describe that single event would increase complexity without yielding any gain in strength that outweighs the cost. There is no regularity to capture, no pattern to compress, and thus no law to be found. But your inference that this allows two worlds with the same non-modal facts to differ in their laws is simply false on the best-systems view. Laws are defined as the theorems of the best system, and the best system is determined uniquely by the mosaic of non-modal facts. If the mosaic is identical across two worlds, the balance of simplicity and strength will yield the same system, and thus the same laws. There is no room for divergence here, so Humean supervenience remains intact even in this degenerate case.

  Your worry seems to be that if there are no laws in such a world, the concept of law is doing no explanatory work. But this presupposes the very anti-Humean picture I am rejecting, namely that laws are supposed to explain why the mosaic is the way it is. On the Mill–Ramsey–Lewis view, the direction of explanation runs the other way. The mosaic explains the laws, because the facts about the world make the laws true. If the world is too sparse to support any laws, then there is nothing for the laws to summarize, and that is perfectly coherent. We do not need laws to ontologically ground the events; the events are already there in the mosaic. To demand that laws explain the instances is to demand that they govern, and I have already denied that governance is anything more than a useful figure of speech we employ when the systematization is particularly robust.

  As for the second horn, suppose we grant that the best system does include an axiom describing the single event because the simplicity cost is negligible. You claim this looks like the governing picture creeping back in, but this conflates inclusion in the best system with modal necessitation. An axiom in the best system is just a true sentence that helps organize the information. Even if it covers only one instance, it does not produce that instance or make it necessary. It merely records it. The difference between a law covering a billion instances and a law covering one is a matter of degree regarding systematization, not a difference in kind regarding metaphysical power. Neither type of law governs. So neither horn forces me to abandon the core Humean thesis that laws are summaries of the mosaic rather than masters of it. The single-event world is just a limit case where the summary becomes trivial, not a counterexample to the supervenience base.
