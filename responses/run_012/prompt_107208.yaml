answer: |-
  ### Essay Question

  **Time Allowed:** 90 Minutes
  **Word Limit:** None (Manage your time to produce a focused argument)
  **Citations:** Not required

  **Prompt:**

  Milton Friedman's instrumentalist methodology (the "F-twist") claims that the realism of a theory's assumptions is irrelevant; the only valid test of a theory is the accuracy of its predictions.

  Consider the following scenario:
  Economists have two competing models of firm behavior. **Model A** assumes firms are perfect profit-maximizers who solve complex marginal calculus problems. **Model B** assumes firms use simple rules of thumb (e.g., mark-up pricing) without calculating margins. Historically, both models fit the data on prices and output equally well during a period of stable market conditions.

  However, the government proposes a new, complex tax structure that changes the marginal cost of production without changing average costs. Model A predicts firms will significantly reduce output. Model B predicts output will remain unchanged.

  Write an essay evaluating Friedman's claim in light of this scenario. In your response, you must:
  1.  Distinguish between an assumption that acts as a useful **idealization** (like friction in physics) versus one that makes a **false claim about the causal mechanism** (like how managers actually think).
  2.  Explain why successful prediction of *past* data might not be enough when the goal is predicting the effects of a *new policy*.

  Does Friedman's defense of unrealistic assumptions survive this challenge? Defend a clear position.

  ***

  ### Model Answer

  Friedman's instrumentalism—the claim that assumptions need not be realistic provided predictions are accurate—fails when we move from passive forecasting to active policy intervention. While the "F-twist" offers a robust defense of abstraction in stable environments, it collapses when confronted with structural changes where the causal mechanism determines the outcome. In the scenario provided, Friedman's methodology is insufficient because it cannot distinguish between a model that predicts correctly by luck or correlation versus one that predicts correctly because it understands the underlying structure.

  To see why, we must first separate two types of unrealistic assumptions that Friedman tends to lump together. The first is a **critical idealization**. In physics, assuming a vacuum or a frictionless plane is false, but the error is known and manageable. The idealization isolates a specific force (gravity) to understand its operation. If we reintroduce friction, we know how to adjust the model. In economics, assuming "perfect information" can sometimes function this way, serving as a baseline to measure deviations.

  The second type is a **false mechanism claim**. This is not merely simplifying; it is positing a causal process that does not exist. Model A assumes managers literally solve marginal calculus problems. If managers actually use mark-up rules (Model B), Model A is not just simplified; it is psychologically and procedurally false. Friedman argues this doesn't matter if the firm acts *as if* it maximizes profit. In a stable environment, natural selection might ensure only profit-maximizing firms survive, making the assumption predictively adequate regardless of the manager's actual mental process.

  However, the scenario introduces a new tax policy, and this is where the F-twist breaks down. Predicting the future based on past data (forecasting) is fundamentally different from predicting the effects of an intervention (policy). Past data reflects a specific set of rules and constraints. If those rules change, correlations that held in the past may vanish. This is the core problem with relying solely on predictive fit.

  In the scenario, both models fit historical data. But the new tax targets *marginal* cost, not average cost. Model A (profit-maximization) is sensitive to marginal changes. Model B (mark-up pricing) is sensitive to average costs. If managers actually use Model B's mechanism, they will ignore the tax incentive that Model A predicts they will heed. If a policymaker relies on Friedman's logic, they look only at the historical fit. Since both models fit equally well, Friedman offers no criterion to choose between them.

  If the policymaker chooses Model A based on elegance or tradition, and implements the tax expecting output to drop, they will be disappointed if Model B's mechanism is the true one. The prediction fails not because the math was wrong, but because the *assumptions about behavior* were wrong regarding the specific lever being pulled. Friedman's claim that "assumptions don't matter" is only true as long as the environment remains within the domain where the *as if* behavior holds. When you change the rules of the game, you need to know how the players actually decide, not just how they behaved in the previous game.

  Therefore, the F-twist does not survive this challenge intact. It remains useful for short-term forecasting within stable regimes where structural parameters do not shift. In those cases, idealizations are efficient tools. But for policy analysis, the realism of assumptions regarding decision-making mechanisms is paramount. We cannot treat a false mechanism claim as equivalent to a useful idealization when the policy intervention specifically targets the mechanism. To predict how a system responds to a shock, we must know what the system is made of. A model that gets the right answer for the wrong reason is not a scientific tool; it is a black box that breaks the moment you try to open it.

  ***

  ### Marking Scheme (Total: 20 Points)

  **1. Interpretation of Friedman's Claim (4 Points)**
  *   **4 pts:** Clearly articulates the instrumentalist view (predictions matter, assumptions don't) without straw-manning it. Acknowledges why it is attractive (simplicity, predictive success).
  *   **2 pts:** Vague definition of the F-twist; focuses only on "lies" rather than "instrumental utility."
  *   **0 pts:** Misrepresents Friedman as saying truth doesn't matter at all, rather than predictive capacity.

  **2. Distinction: Idealization vs. False Mechanism (6 Points)**
  *   **6 pts:** Explicitly distinguishes between *idealizations* (known errors, isolating variables, e.g., friction) and *false mechanism claims* (wrong causal process, e.g., mental calculus). Explains why the latter is riskier.
  *   **4 pts:** Makes the distinction but fails to explain why the difference matters for the specific scenario.
  *   **2 pts:** Treats all unrealistic assumptions as identical (the "parroting" error).
  *   **0 pts:** Ignores this distinction entirely.

  **3. Distinction: Forecasting vs. Policy Intervention (6 Points)**
  *   **6 pts:** Identifies that historical fit $\neq$ policy reliability. Explains that changing rules (tax) breaks past correlations if the mechanism is misunderstood. (Lucas Critique intuition without needing the name).
  *   **4 pts:** Notes that policy is different but argues weakly on *why* the models would diverge.
  *   **2 pts:** Assumes that because both models fit the past, both are equally valid for the future.
  *   **0 pts:** Claims predictive fit settles the choice of model for policy.

  **4. Argumentative Stance and Clarity (4 Points)**
  *   **4 pts:** Takes a decisive side (e.g., "F-twist fails for policy"). Argument flows logically from the distinctions made above.
  *   **2 pts:** Fence-sits ("It depends," "Both sides have merit") without resolving the tension in the prompt.
  *   **0 pts:** Contradictory or incoherent argument.

  **Specific Penalties (Deduct from Total)**
  *   **-3 points:** "Parroting Penalty": Simply restating "assumptions don't matter" without engaging the policy divergence.
  *   **-3 points:** "Conflation Penalty": Treating the frictionless plane example as identical to the profit-maximization example.
  *   **-2 points:** "Fit Fallacy": Arguing that because both models fit the data, the choice between them is arbitrary or purely aesthetic.

  **Grade Boundaries**
  *   **A (17-20):** Makes both distinctions clearly, takes a side, explains *why* mechanism matters for policy.
  *   **B (14-16):** Makes one distinction well, or both distinctions superficially. Takes a side but reasoning is slightly muddy.
  *   **C (11-13):** Understands Friedman but fails to apply the distinctions to the policy scenario.
  *   **D/F (0-10):** Fails to understand the prompt, conflates assumptions, or refuses to take a stance.
