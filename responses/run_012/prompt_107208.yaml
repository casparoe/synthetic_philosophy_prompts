  I'm putting together the final for my upper-level philosophy of economics seminar and I need one essay question on Friedman's F-twist — the claim from his 1953 methodology essay that the realism of a theory's assumptions doesn't matter, only how well it predicts. The problem is every student can just parrot that assumptions don't need to be realistic and call it a day. I want a question that forces them past that, by making them separate two things the F-twist tends to lump together: an unrealistic assumption that's really an idealization (frictionless planes, treating firms as identical) versus one that's a straight-up false claim about the mechanism (that managers literally solve a profit-maximization problem). And I want it to bite on the fact that people don't only use theories to forecast, they use them to predict what happens when you change something — so please build in a part where two models fit the existing data equally well but disagree about what a new policy will do, and the students have to say what that does to the F-twist.

  Write me three things: the essay question itself; a model answer of about 700 words that actually takes a side — I dont want fence-sitting, tell me whether the F-twist survives this or not and defend it; and a marking scheme out of 20 that names the specific moves an A answer has to make and the specific mistakes that should lose marks (stuff like treating every unrealistic assumption as the same kind, or thinking good predictive fit by itself settles which model to use). 90 minutes, one essay, and no citations required — I just want them reasoning.
