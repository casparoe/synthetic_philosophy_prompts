answer: |-
  # The Character Intervention Protocol (CIP)
  **For:** Form Tutors and Head of Year
  **From:** Character and Behaviour Lead
  **Time Allowance:** 20 Minutes per case
  **Authority Level:** Tutor (Standard Tariff) / Lead (Non-Standard) / HT (Exclusion)

  ## Preamble: The Two Pictures
  You do not need to be a philosopher to use this. You only need to recognise two patterns in student behaviour.
  1.  **The Obstruction Picture (Mencius):** The child *can* do the right thing but something is blocking them (stress, trauma, confusion, conflicting loyalties). The goodness is there but buried.
  2.  **The Habit Picture (Xunzi):** The child *has not yet learned* the right thing. Their natural impulse is self-interest. Decency must be built through repetition and clear boundaries.

  **Goal:** This protocol does not decide who the child *is*. It decides what *we do*.
  **Constraint:** If an intervention would create the very behaviour it claims to fix (e.g., treating a stressed child as defiant creates more stress/defiance), you must stop.

  ---

  ## Part 1: The Decision Procedure

  ### Step 1: Safety and Policy Gate
  **Question:** Does this behaviour breach safeguarding thresholds or mandatory exclusion criteria (violence, drugs, persistent defiance)?
  *   **Yes:** Follow Safeguarding/Exclusion Policy. **STOP.** (Hand to HT/DSL).
  *   **No:** Proceed to Step 2.

  ### Step 2: The Variance Test (Diagnosing the Picture)
  **Question:** Does the pupil demonstrate the expected behaviour in *any* comparable context without significant support?
  *(e.g., Do they arrive on time for other lessons? Do they show respect to other staff? Have they passed similar tests before?)*
  *   **Yes (Capacity Present):** The capacity exists; something is obstructing it here. **Diagnosis: Obstruction Picture.** Proceed to Step 3A.
  *   **No (Capacity Absent):** The capacity is not settled; the habit is not formed. **Diagnosis: Habit Picture.** Proceed to Step 3B.
  *   **Unclear:** Default to **Habit Picture** (Step 3B) for immediate stability, but schedule a review in 2 weeks.

  ### Step 3A: Obstruction Intervention (If Capacity Present)
  **Action:** Identify and remove the blocker.
  1.  Ask the pupil: *"You know how to do X. What made X hard today?"*
  2.  If the answer identifies a school-based barrier (confusing rule, unfair pressure, conflicting instruction), **do not sanction.**
  3.  If the answer identifies an external barrier (home issue, peer pressure), offer support/restorative conversation.
  **Stop Condition:** If the pupil refuses to engage or lies, move to Step 4.

  ### Step 3B: Habit Intervention (If Capacity Absent)
  **Action:** Reinforce the ritual.
  1.  State the rule clearly.
  2.  Apply standard tariff sanction (detention, etc.).
  3.  Require practice of the correct behaviour (e.g., re-entering the room correctly, re-sitting the task under supervision).
  **Stop Condition:** If the pupil complies, close the case.

  ### Step 4: The Causality Check (Anti-Self-Fulfilling Prophecy)
  **Question:** Is the "Obstruction" we identified in Step 3A actually a result of our own previous "Habit" interventions?
  *(e.g., Are they late because they are avoiding a teacher who shouts? Are they cheating because the assessment design creates impossible pressure?)*
  *   **Yes:** **STOP.** Do not apply sanction. This is a **Values/Policy Escalation**. Hand to **Character and Behaviour Lead**.
  *   **No:** Proceed to Step 5.

  ### Step 5: The Values Threshold
  **Question:** Does the required intervention demand *internal assent* (they must say they believe it) or merely *external compliance* (they must do it)?
  *   **External Compliance Only:** Tutor may proceed with Step 3A or 3B.
  *   **Internal Assent Required:** (e.g., "You must apologise and mean it," or "You must adopt this value"). **STOP.** This is **Values/Policy Escalation**. Hand to **Character and Behaviour Lead**.
      *   *Reason:* We can mandate behaviour; we cannot mandate belief without manufacturing hypocrisy.

  ### Step 6: Conflict Rule (When Pictures Disagree)
  *Sometimes Step 2 is ambiguous, or staff disagree on the diagnosis.*
  **Rule:** If the **Obstruction Picture** suggests "Support" and the **Habit Picture** suggests "Sanction":
  1.  Apply the **Least Restrictive Intervention** first (Support/Conversation).
  2.  Set a hard review date (1 week).
  3.  If behaviour persists, switch to **Habit Picture** (Sanction + Practice).
  *Note: You cannot run both simultaneously. You cannot nurture and discipline the same act in the same hour.*

  ---

  ## Part 2: Case Applications

  ### Case 1: The Cheating 14-Year-Old
  **Scenario:** Pupil passes answers to a friend in a test. Pupil would have passed on her own.
  **Run:**
  1.  **Safety:** No.
  2.  **Variance:** Does she know the rules? Yes. Does she usually follow them? Yes. **Diagnosis: Obstruction Picture.** (Capacity present, something blocked judgement).
  3.  **Intervention (3A):** Ask: *"You know the rule. Why risk it?"*
      *   *Likely Answer:* "My friend was panicking. I couldn't say no." (Compassion sprout misdirected).
  4.  **Causality:** Did our assessment culture create the panic? Possibly, but not immediately actionable.
  5.  **Values:** Do we demand she feel guilty? No, we demand she understands integrity.
  6.  **Conflict:** Standard tariff says "Disqualification + Detention." Obstruction logic says "Restorative Conversation."
  7.  **Output:** **No Detention.** Mandatory restorative conversation regarding peer pressure vs. rules. Report to Lead to review assessment anxiety policies.
  **Verdict:** **Unwelcome.** The school tariff demands a sanction for cheating. This procedure overrides the tariff based on the diagnosis of "misdirected compassion" rather than "academic dishonesty."

  ### Case 2: The Corridor Litter
  **Scenario:** Corridor littered daily. Reminders ignored.
  **Run:**
  1.  **Safety:** No.
  2.  **Variance:** Do pupils pick up litter in other zones? No. Do they care about their own space? Sometimes. **Diagnosis: Habit Picture.** (Capacity for tidiness exists, but collective habit is absent).
  3.  **Intervention (3B):** Ritual and Repetition.
      *   Line up at end of lesson.
      *   No dismissal until floor is clear.
      *   Repeated daily for 3 weeks.
  4.  **Causality:** Are bins accessible? Yes.
  5.  **Values:** Compliance only (pick it up), not assent (don't need to love cleaning).
  6.  **Output:** **Daily Drill.** Tutor supervises cleanup. No sanctions initially, just non-completion of transition. If defiance occurs, standard sanction.
  **Verdict:** **Acceptable.** High effort, but aligns with Xunzi-style habit formation.

  ### Case 3: Year 9 Attendance (February Collapse)
  **Scenario:** Tutor group attendance drops 15% every February.
  **Run:**
  1.  **Safety:** No.
  2.  **Variance:** Is it specific pupils? No, it's the whole group. Is it specific days? No, general drop. **Diagnosis: Obstruction Picture.** (Collective capacity exists, systemic blocker appearing seasonally).
  3.  **Intervention (3A):** Identify blocker.
      *   *Hypothesis:* Cold/Flu? (Check nurse logs). Bullying? (Check CPOMS). Curriculum? (Check lesson plans).
      *   *Finding:* No spike in illness. No spike in bullying reports.
  4.  **Causality Check:** Is the school creating the obstruction?
      *   *Finding:* February is assessment heavy. Year 9 option choices happen in March. Anxiety peaks in February.
      *   *Result:* **YES.** The school calendar is the obstruction.
  5.  **Output:** **STOP.** Do not call parents for truancy sanctions yet.
  6.  **Escalation:** Hand to **Character and Behaviour Lead**.
      *   *Instruction:* "Individual tutor sanctions will manufacture evidence of 'lazy Year 9s' while ignoring the calendar obstruction. We need to adjust the assessment schedule or provide anxiety support, not detention."
  **Verdict:** **Unwelcome.** This tells the Behaviour Lead that the behaviour policy is irrelevant to the problem, and the solution lies in timetabling/pedagogy, which is outside Behaviour Lead control.

  ---

  ## Part 3: Limitations and Validation

  ### What This Procedure Cannot Do
  1.  **It cannot fix broken homes.** If the obstruction is severe trauma, the tutor's 20 minutes is insufficient. The procedure flags it, but cannot solve it.
  2.  **It cannot measure "Character."** It measures behaviour. It assumes character is downstream. We cannot grade a child's soul, only their actions.
  3.  **It cannot prevent cynicism.** If staff do not believe the "Obstruction Picture" is real, they will bypass Step 2 and default to Sanctions, invalidating the data.

  ### Validating the Diagnostic Step (After One Year)
  To know if our distinction between "Obstruction" and "Habit" is real or just wishful thinking, we must check if the *prescribed intervention* actually worked better than the alternative. We already keep the following records; cross-reference them as follows:

  1.  **Behaviour Logs (Arbor/SIMS):**
      *   *Test:* Filter for cases marked "Obstruction" (Step 3A) vs. "Habit" (Step 3B).
      *   *Validation:* If "Obstruction" cases show **higher recidivism** after restorative conversations than "Habit" cases do after sanctions, our diagnosis is wrong (we are being too soft on bad actors). If "Habit" cases show **higher escalation** after sanctions than "Obstruction" cases, our diagnosis is wrong (we are provoking good kids).

  2.  **Attendance Data:**
      *   *Test:* Compare February attendance in Year 9 against other year groups.
      *   *Validation:* If we implement the "Calendar Obstruction" fix and attendance does not rise, the diagnosis was wrong (it's not school anxiety, it's something else).

  3.  **Sanction Appeal Logs:**
      *   *Test:* Track how often Step 4 (Causality Check) is triggered.
      *   *Validation:* If Step 4 is triggered >10% of the time, the school environment is actively manufacturing the misbehaviour we are punishing. This proves the "Self-Fulfilling Prophecy" constraint is active.

  **Final Instruction:** If the data after one year shows that "Obstruction" diagnoses lead to repeat offences 50% more often than "Habit" diagnoses, burn this protocol. It means we are mistaking defiance for distress. If the data shows sanctions increase exclusion rates without improving behaviour, burn this protocol. It means we are manufacturing the evidence of our own necessity.
