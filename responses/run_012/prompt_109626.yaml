  ***

  # Interview Run-of-Sheet: Turing & The Parapsychology Loophole
  **Guest:** [Historian Name]
  **Topic:** The "Load-Bearing Wall" of Section 6 (ESP) in *Computing Machinery and Intelligence* (1950)
  **Goal:** Move beyond the "embarrassment" narrative; test whether ESP reveals the Imitation Game is an empirical experiment rather than a conceptual definition.

  ### 1. The Mechanics of the Confound
  **Q:** Let's start on the mechanics. The verdict in the game is supposed to be evidence about the machine alone. If telepathy is real, does it wreck the test by letting the machine get help from outside, or by letting the interrogator get information the game was supposed to withhold? Which side does the threat actually fall on?
  *   **Follow-up (If she says "Both"):** Then doesn't it roughly cancel out? And if it cancels out, why did Turing think the setup needed rethinking at all?
  *   **Producer's Note:** *Turing actually argues ESP primarily aids the **human** confederate (reading the interrogator's mind), raising the bar for the machine. If she corrects you here, accept the correction and pivot to: "So the test is biased against the machine unless controlled?"*

  ### 2. The Proposed Fix
  **Q:** State exactly what Turing does about this. My impression is he sketches a version of the game where the telepathy route is closed off, but I've seen others say he just concedes the experiment would be inconclusive. Whichever it is: is the fix real, or does it just relocate the problem?
  *   **Follow-up:** If the fix needs the interrogator to be ignorant of something, doesn't the test now rest on a stipulation about ignorance rather than on behaviour?

  ### 3. Evidential Standards
  **Q:** He wouldn't wave away the statistical case for telepathy, but he also wouldn't engage the objection that a machine would have to actually *feel* what it's talking about, treating that whole line as a non-starter. Are those the same standard of evidence applied twice, or two different standards?
  *   **Follow-up (If she says "Consistent"):** Fine, then what would count as statistical evidence that a machine *thinks*, as opposed to statistical evidence that it *mimics*?

  ### 4. Continuity with Other Escape Hatches
  **Q:** He also floats that the brain might not be a discrete-state machine—that it might do something a digital computer can't. Is the telepathy concession the same kind of move, naming a capacity the machine lacks, or a different kind, naming a channel the test fails to control?
  *   **Follow-up (If she says "Same kind"):** Then why was telepathy a problem for the test but the continuous-brain suggestion wasn't a problem for computability?

  ### 5. Test vs. Definition
  **Q:** What does this reveal about the logic of the game? Is the imitation game a test or a definition? If an empirical discovery—telepathy turns out to be real—can make its verdict unreliable, then he's treating it as an experiment with confounds. That's evidence, not a criterion.
  *   **Follow-up:** If it's a criterion, how can any empirical discovery undermine it? And if it's a test, what was the sample size and who was the control?

  ### 6. Reversing the Polarity
  **Q:** Did he ever suggest running the thing the other way round—testing whether a machine could be telepathic, or using a machine as the receiver in an ESP experiment? I've seen that claimed and I genuinely can't tell if it's in the text or read into it.
  *   **Follow-up (If it is in the text):** Does that make the section a research proposal rather than a concession?

  ### 7. The Biographical Vector
  **Q:** There's a story that his interest in all this goes back to a death at school and that he sat in on séances in the thirties—is that actually documented or is it biographers being novelistic? And does it matter?
  *   **Follow-up (If documented + matters):** Isn't that a genetic fallacy?
  *   **Follow-up (If documented + doesn't matter):** Then why does the section read so personally?

  ### 8. Durability of the Theme
  **Q:** Does the theme show up again in the later pieces—the BBC talks, the machine-intelligence writing, the Ratio Club conversations—or is it one page and then gone?
  *   **Follow-up (If it's a one-off):** Then how are you not over-reading a single page, and what would it take to show it *is* a one-off?

  ### 9. The Modern Analogue
  **Q:** The modern analogue I actually care about: A model with web access, or one trained on the test itself, is getting help from outside the game in a way that feels structurally like the telepathy worry. Is that the true descendant of the worry, or is it a different problem—contamination versus channel?
  *   **Follow-up (If it is the descendant):** Was Turing the first person to worry about test contamination?
  *   **Follow-up (If it isn't):** What exactly is different?

  ### 10. Falsifiability & The Textbook
  **Q:** Last one, and I want this on the record: what would make you drop the thesis? What's the strongest case that this is just a fad he absorbed from the period, and what evidence would you accept against your reading?
  *   **Follow-up:** If you're right, what should a textbook say about the imitation game that it currently definitely gets wrong?

  ***

  ### Producer's Tips for the Host
  *   **Pacing on Q1 & Q2:** These are the technical anchor points. If she waffles here, don't let her retreat to "it's just period context." Press for the *structural* implication.
  *   **The "Load-Bearing" Soundbite:** You mentioned she uses the "load-bearing wall" line often. If she drops it unprompted, gently interrupt: *"I want to unpack that metaphor specifically in question 5, but for now..."* This saves the payoff for later.
  *   **Q9 (The Modern Analogue):** This is your bridge to the CS audience in the room. If the conversation gets too historical/biographical, use this to snap it back to computation.
  *   **Tone Check:** Your draft is skeptical but fair. Keep that. You aren't trying to debunk her; you are trying to make sure the "load-bearing" claim carries the weight she says it does.

  Good luck with the recording. This is going to be a good episode.
