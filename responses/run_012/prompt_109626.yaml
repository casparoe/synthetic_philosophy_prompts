  I have polished these slightly for **oral delivery**. Written questions often have too many clauses; spoken questions need to land, breathe, and then pivot. I've also added **Producer's Notes** on the technical accuracy regarding the 1950 text (specifically on who Turing thought would use the telepathy), just so you aren't corrected on the scholarship mid-interview.

