prompt: |-
  ok so im doing this thing for my psych class where we have to write about the replication crisis, and i want to do something more fun than the usual essay. R.A. Fisher is basically the guy who gave us p-values and made .05 the magic number (he's been dead since 1962, so he never saw any of this). I want you to predict what he would have said about the replication crisis if someone sat him down today and explained the whole thing to him.

  Here's what I'd tell him, and I want his reaction to each peice:

  1. Back in 2015 a big group redid 100 psychology experiments and only about a third of them gave the same answer as the originals. Tons of famous effects just didn't show up again. Same story in medicine and social science — lots of published results seem to have been exaggerated.
  2. A lab runs a study with 40 people per group, gets p = .03, publishes it. Another lab runs it with 200 people per group and gets p = .40, with an effect about a third as big. First lab says the second lab screwed up, second lab says the first one just got lucky.
  3. People point out that if you measure a bunch of things and try a bunch of different ways of analyzing your data, you can get something to come out p < .05 without ever technically lying about anything. You just report the version that worked and quietly drop the rest.
  4. Some researchers now preregister their whole plan before collecting data, and some journals do registered reports, where the journal accepts the paper based on the design before the results are even in.
  5. There's a proposal to only call results significant if p < .005 instead of .05. Other people want to scrap significant vs. not significant entirely and just report effect sizes and confidence intervals. And the American Statistical Association put out a statement saying a p-value does not tell you the probability that your hypothesis is true, or how big or important the effect is.
  6. Bayesian methods are getting popular in psychology, Bayes factors and all that, and a lot of the reform people think the whole Neyman-Pearson thing (fixed error rates, accept/reject) is the core of the problem.

  What I want from you:

  - Go through each of those six and predict Fisher's take, and be specific about why, based on what he actually believed. I especially want to know where he'd say thats not what i meant, where he'd say yeah thats kind of on me, and where he'd say you're all reinventing my own points and doing it worse.
  - There's a trap here i want you to actually deal with. Fisher hated Neyman and Pearson's approach of treating stats like a machine that accepts or rejects hypotheses at a fixed error rate. So does that mean he'd be on the side of the Bayesian revival? Or would he have hated the Bayesians just as much? What does his fiducial inference thing (his own weird alternative to Bayes, which never really caught on) tell us about which way he'd lean? I dont want a wishy-washy he'd have a nuanced view — i want a call, with the strongest argument on each side and then your verdict.
  - Would he accept any blame for .05? His textbook from the 1920s is where the convention basically comes from. Did he actually think .05 was a law of nature, or was it more of a shrug that got way out of hand? Predict what he'd say when someone confronts him with your number caused this mess.
  - Fisher was also kind of a piece of work personally and had that famous feud with Neyman. Do you think any of that would color how he'd react to the reform movement — like, would he be more annoyed at being corrected than at the actual statistical problems? Be honest about it but dont just turn him into a cartoon villian.
  - At the end, give me the three questions you'd most want to ask him if you could, and your prediction for how he'd answer each one.

  Write it in American English, and you dont need to cite anything or give me a reading list, i just want the reasoning. And please dont give me a generic statistics has problems essay — the whole point is getting inside his head.
