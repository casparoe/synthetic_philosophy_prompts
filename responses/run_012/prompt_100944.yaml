answer: |-
  This area is too muddled to rank substantive questions sensibly without first disentangling the concept of 'moral mattering' itself. Your top priority for the year must be to determine whether our intuitions about virtual characters track intrinsic status, relational obligation, or symbolic significance, because currently the literature conflates all three. You cannot answer whether characters matter until you define what kind of "mattering" is even possible for a non-sentient artifact, and this conceptual groundwork is the only question that makes the subsequent ones tractable. It is feasible for two philosophers without empirical tools, as it relies on analyzing existing arguments in virtual ethics and meta-ethics rather than running psychology experiments.

  Once that conceptual ground is cleared, your second priority should be: **How does the removal of fixed authorial intent in procedural generation alter the locus of moral responsibility?** This is the most neglected and timely angle. Most existing work assumes static scripts where the designer's intention is fixed; LLM-driven or procedurally generated behavior breaks the link between the creator's intent and the character's action. This question depends on the first (you need to know what kind of obligation is at stake to see how it shifts), but it is highly viable for you because it requires conceptual analysis of agency and technology rather than coding or empirical user studies. It directly addresses your intuition about the "artifact with behavior" versus "fiction" split by testing what happens when the artifact writes itself.

  Your third priority should be: **Do game designers hold fiduciary duties to the characters they create?** This shifts the frame from the player (which is the crowded, empirical-heavy side of the field) to the creator. It is neglected because most virtual ethics focuses on player virtue or harm. It is feasible for you because it parallels existing philosophical work on artistic integrity or stewardship, requiring no new data. I rank this third because it is less urgent than the procedural shift, but it offers a fertile niche that avoids the well-trodden "does killing NPCs make you violent?" empirical trap.

  Avoid the question of "degrees of moral status" for now; it is a metaphysical quagmire that stalls without empirical evidence of sentience which you cannot provide. Similarly, skip the player psychology angle ("what caring does to the player"); that is empirical psychology, not philosophy, and it is already saturated by researchers with lab access. Stick to the conceptual architecture of the interaction and the creation.
