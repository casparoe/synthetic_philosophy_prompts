      *   Relations are often binary (Exists/Doesn't Exist).
      *   Phenomenology is graded.
      *   If the Relation breaks (Target missing), Phenomenology drops to Zero.
      *   If the Target weakens, Phenomenology weakens.
      *   But if the Target *vanishes* (Targetless HOR), 5 says Phenomenology vanishes.
      *   6 says Continuum.
      *   A continuum that snaps to absolute zero based on the existence of a relatum is a "Discontinuous Continuum."
      *   This is the strongest tension.

      *   **Wait, is there a tension between 4 (Unconscious HOR) and 7 (Immediacy)?**
      *   If the HOR is unconscious, how do we know it's there?
      *   We don't. We only know the *result* (Conscious FOS).
      *   7 says we are acquainted with the Experience.
      *   This is fine.
      *   **Wait, 7 says "non-inferential".**
      *   HOR theory says consciousness *is* a kind of inner perception (quasi-perceptual, per 3).
      *   Perception is non-inferential.
      *   So 3 + 4 + 7 are compatible.

      *   **Okay, I'm confident 5 is the main source of friction.**
      *   It forces a binary condition (Target Existence) onto a graded system (6).
      *   It forces a Relational ontology that strains Functional Sufficiency (1 & 2).
      *   It forces a "Zombie" verdict that strains the explanatory power of HOR (why have the HOR if it doesn't generate the feel?).

      *   **Wait, I need to make sure I don't call 2 vs 5 a tension if they are logically consistent.**
      *   2: FOS Conscious <-> Targeted.
      *   5: No FOS -> No Consciousness.
      *   These are consistent.
      *   *However*, 2 also says: "it is the presence of that higher-order representation... that makes the difference."
      *   This phrasing attributes the *causal power* to the HOR.
      *   5 attributes the *necessary condition* to the Target.
      *   If the HOR makes the difference, it should be sufficient (ceteris paribus).
      *   5 says it is not sufficient.
      *   This is a tension in **Explanatory Priority**.
      *   I will frame it as a tension between the *Sufficiency Claim* in 2 and the *Necessity Claim* in 5.

      *   **Wait, one more thing.**
      *   Commitment 6: "Consciousness is graded rather than binary."
      *   Commitment 5: "Targetless... no phenomenal consciousness whatsoever."
      *   This implies a binary threshold at zero.
      *   Is a threshold at zero compatible with a continuum above zero?
      *   Yes, [0, 1]. 0 is included.
      *   But if the *cause* of the drop to 0 is the *absence* of a target (Binary: Exists/Not Exists), while the *cause* of variation above 0 is the *strength* of the HOR (Graded), then you have two different mechanisms governing the scale.
      *   Mechanism A (Target): On/Off.
      *   Mechanism B (HOR): Dimmer.
      *   This is theoretically messy. A unified theory (HOR drives consciousness) suggests HOR strength should drive the scale all the way to zero.
      *   5 interrupts this unity.
      *   This is a genuine theoretical tension.

      *   **Okay, ready to write.**
      *   **Ranking:**
          1.  5 vs 6 (Discontinuity in a Graded System).
          2.  5 vs 2 (Explanatory Sufficiency of HOR).
          3.  5 vs 1 (Physical/Functional Supervenience).
      *   **Compatible:** 1+2, 2+3, 2+4, 2+7 (Illusionism).
      *   **Best Fix:** Drop 5.
