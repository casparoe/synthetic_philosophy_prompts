answer: |-
  Dear friend,

  It is rare to encounter a high school senior who not only grasps the scale of the insect sentience problem but also recognizes that uncertainty is a feature of rigorous thinking rather than a bug. You are right to feel that the uncertainty is progress, because it means you have moved past the simplistic binaries that often dominate public discourse. You have asked for an agenda rather than a survey, and you have specified constraints that are crucial to your situation: you have a year, a library card, and no laboratory, and you want to know where your time and money can actually change outcomes. Before I lay out the ranked agenda, I want to address the two puzzles you raised, because they are not confusions but rather the very hinges upon which the rest of the inquiry turns.

  Your first puzzle concerns the relationship between the probability of sentience and the moral weight of that sentience. You suspect these might not be independent, and you are correct to think this is a real problem rather than a confusion. In the literature, this is sometimes called the problem of moral weight versus the problem of moral status. If the neural architecture required for sentience is simple enough to be present in insects, it may also be too simple to support the rich, integrated suffering that we worry about in mammals. It is entirely possible that the same facts that raise the probability of some experience lower the intensity or duration of that experience. If an insect feels pain, it might be a fleeting, unconnected flash rather than a sustained state of dread. This means your expected value calculation cannot simply multiply the number of insects by a human-equivalent unit of suffering. You must investigate the function that maps neural complexity to moral weight. This is a philosophical and theoretical question, which makes it highly tractable for you because it requires reading and synthesis rather than lab equipment. It is also neglected because empirical scientists prefer measuring behavior and philosophers prefer thinking about humans, leaving the invertebrate middle ground under-theorized.

  Your second puzzle asks whether the individual insect is the right unit of count. This is also a genuine problem, often referred to as the problem of temporal aggregation. If an insect lives for two weeks and a cow for five years, does the cow count three hundred and sixty-five times more, or does the intensity of the experience matter more than the duration? Furthermore, some philosophers argue that what matters is not the individual organism but the moment of experience itself. If an insect has a fragmented consciousness where moments do not integrate into a narrative self, counting individuals might inflate the moral stakes by implying a continuity that does not exist. Conversely, if you count moments, the sheer speed of insect metabolism might mean they experience more moments per second than we do. This question is upstream of any calculation you try to make because it determines the denominator in your equation. Like the first puzzle, this is conceptual and accessible to you through literature review, yet it is often glossed over in favor of easier empirical questions about behavior.

  With those two foundational puzzles established as real and central, I can now offer you the ranked agenda for your year-long project. The question that sits at the top of the list, and which deserves the largest share of your time, is the investigation into the mapping between neural complexity and moral weight. This is the most important question because it is the strongest lever on your final conclusion. If you conclude that minimal sentience carries negligible moral weight, the vast numbers of insects become less alarming, and your donation might be better spent on human global health or farmed vertebrate welfare. If you conclude that even minimal sentience commands significant respect, the scale of the problem explodes. This question is tractable for you because it relies on existing papers in philosophy of mind and comparative neuroscience. You can read work by authors who discuss the hard problem of consciousness alongside work by biologists describing insect nervous systems, and look for the bridge arguments. It is neglected because it requires comfort with both ethics and biology, a combination that is rare. Answering this, or even clarifying the options, would directly change what you do with your money by setting the stakes of the gamble.

  Following closely behind as the second priority is the empirical distinction between nociception and valenced experience. Nociception is the mechanical detection of damage, like a reflex, while valenced experience is the feeling of badness that accompanies it. You need to determine which insects, if any, show evidence of the latter. This is tractable for you because there has been an explosion of behavioral studies in the last five years regarding bees, flies, and ants that test for pain modulation, trade-offs between safety and food, and long-term behavioral changes after injury. You do not need a lab to synthesize these findings; you need a library card to access the journals. This question is less neglected than the philosophical one but still suffers from hype, where positive results get press and null results do not. If the evidence here trends toward mere reflex, your project can confidently conclude that the risk is low. If the evidence trends toward complex integration, it raises the probability side of your equation. This changes your actions by telling you whether to focus on all insects or just social hymenoptera like bees and ants, which narrows the scope of potential interventions.

  The third priority on your list should be the question of aggregation and the unit of account, which connects to your second puzzle. You should investigate whether moral concern should attach to individuals, lifespans, or moments of experience. This is less urgent than the first two because it only matters if you have already established that insects have moral weight. However, it is critical for precision. If you decide to donate to an organization that claims to save insect lives, you need to know if extending a life by a week is as valuable as preventing a death today. This is highly neglected because it is mathematically and philosophically thorny, and few people want to do the work of defining the unit of moral currency. It is tractable for you through philosophical texts on population ethics and temporal experience. Resolving this would change how you evaluate interventions, perhaps shifting your focus from preventing death to improving habitat quality, depending on whether duration or intensity matters more.

  The fourth and final priority for your research agenda is the effectiveness of specific interventions. Only after you have grappled with the previous three questions should you look deeply into whether pesticides, light pollution, or habitat restoration are the best targets. This is ranked last not because it is unimportant, but because it is downstream. If you do not know if insects matter or how they matter, knowing how to help them is premature. However, this is the most actionable part of the chain for your donation. You should look for cost-effectiveness analyses regarding insect welfare, which are currently very sparse. This area is neglected because most entomologists care about conservation of species, not welfare of individuals, and most ethicists care about mammals. If you find that certain pesticides cause prolonged suffering while others cause instant death, or that artificial light traps insects in fatal loops, this gives you a concrete place to put your money. This is tractable via reports from effective altruism organizations that have begun branching into invertebrate welfare.

  There are also questions that look central but are not, and you should be wary of spending your limited time on them. One such question is the exact phylogenetic distance between insects and humans. It is tempting to think that because insects are evolutionarily distant, they are less likely to be sentient, but evolution converges on solutions, and distant branches can develop similar capacities for experience. Focusing too much on the tree of life rather than the functional capacity of the nervous system is a distraction. Another false central question is the precise number of neurons. While a brain with a hundred thousand neurons is different from one with a hundred billion, we do not know the threshold for sentience, so fixating on the count rather than the architecture is unhelpful. You should treat these as data points rather than decisive factors.

  Regarding what evidence would move these questions up or down my list, you should watch for consensus statements from scientific bodies similar to the Cambridge Declaration on Consciousness, which covered mammals but excluded invertebrates. If a major organization of neuroscientists releases a statement regarding invertebrate sentience in the next few years, that would move the empirical question up in priority and potentially settle it. Conversely, if rigorous studies continue to show that insect behavior is fully explainable by simple algorithms without internal states, the probability question moves down. For the moral weight question, new philosophical arguments that successfully link consciousness to information integration theory could provide a metric for weight, moving that question from speculative to calculable.

  In terms of your independent project and your money, my advice is to structure your project around the first question on the agenda. Write a paper that explores the relationship between neural complexity and moral weight, using the insect case as the test bed. This allows you to contribute to the neglected theoretical layer without needing empirical data you cannot gather. For your few hundred dollars, I suggest you hold it until you have completed that research. If your conclusion is that the risk is significant but the weight is uncertain, consider donating to organizations that fund research into invertebrate sentience itself, rather than direct intervention. This is a meta-intervention that buys information for everyone else. If you conclude the risk is high, look for charities focused on reducing the suffering of wild insects through habitat management rather than pesticides, as the latter often kills painfully while the former reduces population density gently.

  You are standing at the edge of a field that is just beginning to open up, and your instinct to look for the upstream questions is the right one. Most people rush to the bottom of the chain to find something to fix, but you have realized that fixing the wrong thing is worse than fixing nothing. By focusing on the relationship between probability and weight, and the unit of counting, you will be doing work that is durable even if the empirical facts shift. Trust your uncertainty, follow the conceptual threads, and do not feel pressured to arrive at a final verdict if the evidence does not support one. A well-defined question is often more valuable than a premature answer.

  Sincerely,

  A Friend
