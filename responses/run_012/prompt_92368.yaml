answer: |-
  It is excellent that you are reading Smith directly (or at least interrogating summaries of him). Your instincts as a geologist—looking for the actual strata rather than the tourist brochure—are serving you well here. The summary you quoted is a classic example of "presentism": projecting 20th-century political categories (like "anti-imperialist") onto an 18th-century thinker to make him sound like a modern hero.

  While the summary captures the *spirit* of Smith's economic critique, it gets the political nuance and the textual evidence wrong in several key places.

  Here is a sentence-by-sentence breakdown of how a Smith scholar would likely react, followed by an address of your specific questions.

  ***

  ### Sentence 1: "Smith was the first anti-imperialist."

  *   **Scholarly Verdict:** **Wince / Anachronistic.**
  *   **Why:** The term "anti-imperialist" is a 19th and 20th-century political label. Smith did not view himself as an activist against empire in the abstract. He was a critic of the *mercantile system* (state-managed trade monopolies).
  *   **Nuance:** Smith certainly criticized the violence and corruption of empire (particularly the East India Company in Bengal), and he argued that ruling distant lands was inefficient. However, he did not argue for the immediate dissolution of *all* political ties everywhere. He accepted that colonization for settlement (like North America initially) was natural, provided it wasn't managed via monopoly. Calling him the "first anti-imperialist" turns him into a modern political operative rather than a moral philosopher analyzing incentives.

  ### Sentence 2: "He argued in The Wealth of Nations that colonies are always a net loss to the mother country..."

  *   **Scholarly Verdict:** **Mostly Accept (with caveats).**
  *   **Why:** In Book V of *The Wealth of Nations*, Smith performs a cost-benefit analysis of the British Empire. He concludes that for the *British public treasury*, the colonies are a net drain. The cost of defense and administration exceeds the tax revenue gained from them.
  *   **Nuance:** The word "always" is dangerous. Smith acknowledges that *merchants and manufacturers* profit immensely from the colony trade monopoly. So, colonies are a net loss for the *public*, but a net gain for *specific interest groups*. This distinction is the heart of Smith's critique: the state is being hijacked to serve private interests at public expense.

  ### Sentence 3: "...that the empire exists only to protect the monopoly of the colony trade for merchants and manufacturers..."

  *   **Scholarly Verdict:** **Accept.**
  *   **Why:** This is pure Smith. He argues that the "mercantile system" confuses wealth with gold/silver and believes the only way to get rich is to sell more than you buy. To enforce this, the state must monopolize colonial trade. Smith writes scathingly that the whole system is a "conspiracy against the public" by merchants who want to raise prices. He views the empire, in its current form, as a protection racket for British industry.

  ### Sentence 4: "...and that his invisible hand proves free trade would make colonies pointless."

  *   **Scholarly Verdict:** **Wrong / Misleading.**
  *   **Why:** This is the biggest tell that the author hasn't read the text closely.
      1.  **The Phrase:** Smith uses the phrase "invisible hand" exactly *once* in *The Wealth of Nations*. It refers to an individual preferring domestic industry over foreign investment for security reasons, inadvertently benefiting society. It is not a grand "proof" against colonies.
      2.  **The Logic:** Smith argues that *free trade* would make *mercantilist monopolies* pointless. However, he does not argue that colonies themselves would become "pointless." He acknowledges that colonies provide land for surplus population and new markets. Under free trade, colonies would just be normal trading partners rather than subordinated dependents. They wouldn't vanish; the *coercion* would vanish.

  ### Sentence 5: "So he wanted Britain to cut the American colonies loose right away..."

  *   **Scholarly Verdict:** **Wince / Incomplete.** (Your memory is better than the book's.)
  *   **Why:** Smith did not advocate for immediate, unilateral secession as the *first* option. In Book V, Chapter 3, he proposes a "grand scheme":
      1.  **Option A (Preferred):** Incorporate the colonies into the British state. Let them send representatives to Westminster and tax them to pay for their own defense. This creates a unified "British Empire" that is actually a partnership.
      2.  **Option B (Fallback):** If Option A is politically impossible (which Smith suspected it was, due to British prejudice), *then* Britain should voluntarily let them go.
  *   **Nuance:** Smith feared that if Britain tried to hold the colonies by force, it would lead to a bloody war that would bankrupt Britain and create a hostile neighbor (the US). He preferred a friendly separation over a coercive union, but a cooperative union was his theoretical ideal.

  ### Sentence 6: "...and he condemned the whole imperial project as a moral crime."

  *   **Scholarly Verdict:** **Overstatement.**
  *   **Why:** Smith condemned the *abuses* of empire (slavery, the East India Company's plunder, the corruption of British character) as moral crimes. He famously wrote that the violence of the conquest of the Americas was a stain on humanity.
  *   **Nuance:** However, he did not condemn the *concept* of distant settlement or association. He believed in the "natural" spread of people to new lands. His moral condemnation was directed at the *violence, monopoly, and misgovernment* of the empire, not necessarily the existence of political ties between nations if they were voluntary and mutually beneficial.

  ***

  ### Addressing Your Specific Questions

  #### 1. "I vaguely remember he wanted the American colonies to send MPs to Westminster, or else be let go, which doesnt sound like cut them loose."

  You are exactly right. This is a crucial distinction often missed in pop-economics.

  Smith's ideal was a **federalized Britain**. He wanted the colonies to be taxed in proportion to their wealth and, in exchange, given representation in Parliament. He believed this would integrate the interests of the colonies with the mother country, removing the need for monopoly trade laws.

  He wrote: *"The colonies... would be happy to contribute towards the defence of the empire... provided they were admitted to a representation in the British parliament."*

  He only advocated for "cutting them loose" because he was a realist. He knew the British aristocracy would never share power with American colonists. Since the "ideal" (representation) was impossible, the "pragmatic" solution was separation to avoid a ruinous war. The popular book skips the "ideal" step, making Smith look like a separatist when he was actually a constitutional reformer who settled for separatism.

  #### 2. "Does the book's final claim -- that Smith would have opposed any empire even if it were run on free trade -- follow from the parts that are accurate?"

  This is a sophisticated question that divides Smith scholars.

  **The argument that he would oppose it:**
  Smith was deeply skeptical of governing distant lands. He argued that the "distance" creates an information asymmetry that leads to corruption and abuse (as seen with the East India Company). Even with free trade, if there is political subordination (an "Empire"), the distant rulers will eventually act in their own interest, not the subjects'. He preferred a "commonwealth of equals" over a hierarchy.

  **The argument that he might accept it:**
  Smith was a pragmatist. If an imperial arrangement secured peace, protected property rights, and facilitated commerce without monopoly, he might tolerate it. He wasn't an anarchist. He supported the Navigation Acts (which restricted trade) *initially* because he believed national defense was more important than opulence.

  **The Verdict:**
  Smith would likely oppose an "Empire" *by definition* if "Empire" implies one nation politically dominating another for its own benefit. However, if "Empire" simply meant a alliance of English-speaking states with free movement of goods and people (closer to his "grand scheme" of representation), he would support it.

  The book's claim that he would condemn *any* empire is too strong. Smith condemned the **Mercantilist Empire**. He might have accepted a **Liberal Commonwealth**, but he suspected that distant governance was inherently unstable and prone to moral rot.

  ### Summary for a Geologist
  Think of Smith's view like a geological formation.
  *   **The Surface (Popular View):** Smith hated empire and wanted colonies gone immediately.
  *   **The Strata (Textual Reality):** Smith hated the *monopoly* layer that sat on top of the colony. He proposed drilling through that layer to integrate the colonies politically (Representation). When he realized the rock was too hard to drill (British politics), he suggested letting the formation separate naturally to prevent an earthquake (War).

  The book you read flattened the strata into a single cartoon. Your skepticism was well-founded.
