prompt: |-
  Ive been a retired field geologist for a few years now and Ive gotten into philosophy and history of econ in a big way. A popular book I just finished sums up Adam Smith on empire like this: "Smith was the first anti-imperialist. He argued in The Wealth of Nations that colonies are always a net loss to the mother country, that the empire exists only to protect the monopoly of the colony trade for merchants and manufacturers, and that his invisible hand proves free trade would make colonies pointless. So he wanted Britain to cut the American colonies loose right away, and he condemned the whole imperial project as a moral crime."

  That doesn't quite feel right to me, but I dont know the texts well enough to say where it goes wrong. Could you go through it sentence by sentence and tell me what a Smith scholar would accept, what they'd wince at, and what's just wrong? I vaguely remember he wanted the American colonies to send MPs to Westminster, or else be let go, which doesnt sound like cut them loose. And does the book's final claim -- that Smith would have opposed any empire even if it were run on free trade -- follow from the parts that are accurate?
