answer: |-
  Good evening. For those who don't know me, I was one of [Supervisor's Name]'s PhD students. For those who do know me, you know I learned everything I know from her. Including, specifically, how to give a speech like this.

  And that presents a logical problem.

  You see, [Supervisor's Name] has spent the last forty years working on the Dogmatism Paradox. The core of it is simple: If I *know* something is true, then any evidence that suggests it isn't true must be misleading. Therefore, I am rational to ignore it.

  So, here is my knowledge claim: I know that [Supervisor's Name] is the most brilliant, generous, and impactful scholar of her generation.

  Now, for the epistemologists in the room, you see where this is going. For the family, please bear with me, because this is actually very romantic.

  Since I *know* she is brilliant, any evidence to the contrary is, by definition, misleading. So, if someone were to stand up and say, "Well, actually, she missed a deadline in 1985," I cannot listen to that. It is misleading evidence. If someone says, "She was incredibly stubborn," I have to reject that. I *know* she was resolute. The evidence of stubbornness is just noise.

  If someone says, "She marked your thesis in red ink until the pages looked like they were bleeding," I know that is false. I *know* she was nurturing. The red ink is misleading evidence. It didn't hurt; it was just... vivid care.

  Do you see the trap? I have structured this toast so that I literally cannot hear a bad word about her. If I acknowledge a flaw, I undermine my knowledge claim. If I undermine my knowledge claim, I lose my rationality to ignore the flaw. So, for the integrity of my own mind, I must insist she is perfect.

  Now, I know what the family is thinking. "This sounds like blindness. This sounds like he's ignoring reality."

  But let me translate this out of the philosophy and into the human. To love someone, or to respect someone the way we all respect [Supervisor's Name], is to reach a point where you stop weighing the evidence. You stop keeping score.

  If you truly know someone is good, you don't entertain the possibility that they aren't. When the world tells you she was too tough, you know she was building resilience. When the world tells you she worked too much, you know she was building a legacy. When the world tells you she was dogmatic, you know she was principled.

  The paradox says I should ignore evidence against what I know. But in a life like hers, "ignoring evidence" isn't ignorance. It's loyalty.

  There were moments in my PhD when I thought I had evidence against her. I thought, "She is asking too much of me. This is impossible." That was evidence that she was unreasonable. But I knew she was right. So that evidence was misleading. And it turned out, it was. I finished the thesis. I got the job. The evidence was misleading; her judgment was knowledge.

  She taught us that there is a difference between being open-minded and being empty-headed. There is a point where you stop testing the foundation and start building the house.

  So, to my colleagues here: Yes, I am aware I am committing the very fallacy she spent forty years analyzing. I am closing my inquiry. I am treating a proposition as indefeasible. I am being a dogmatist about the Dogmatism Paradox. I hope she finds the irony acceptable.

  And to her family: Please understand that when I say I am ignoring all evidence of her imperfections, I am not saying she wasn't human. I am saying that her humanity is the one thing I know for certain. Any story that suggests she didn't love you, or didn't care for us, or wasn't worth celebrating, is misleading evidence. I will not hear it. I cannot hear it. I know better.

  Forty years of asking hard questions deserves one answer that doesn't waver.

  So, if everyone could raise a glass.

  I know this woman changed our lives. I know she deserves this rest. And since I know that, any feeling you have right now that isn't pure admiration is misleading evidence, and you are rational to ignore it.

  To [Supervisor's Name].
