      *   Make sure the "Trilemma" is sharp.

      *(Self-Correction during drafting)*: I need to be careful not to just say "Consequentialism fails." I need to explain *which requirement* kills it. It's the requirement that you can be responsible for an outcome you didn't change.

      *(Refining the "Prejudice")*: The user asked which of *their* requirements might be prejudice. The requirement "the wrongness has to trace back to something causal" is the likely candidate for prejudice if they also want "still wrong" in "no difference" cases. I will highlight this tension.

      *(Final Plan)*:
      1.  List the Spec Requirements (Cases, Distinctions, Degrees).
