      *   *Is it confused?* Not really. It's the classic problem of "Overdetermination" and "Complicity." It's a hard problem, not a confused one. However, the demand for a *causal* link in *non-causal* scenarios is the confusion. I should address that in the "Incompatibility" section.
      *   *Degree Problem:* The 1000th torturer. If we say they are equally guilty, we sever the link between harm magnitude and blame. If we say they are less guilty, we risk the "I'm just a small part" excuse. The theory needs to navigate this. I will note that "Equal Guilt" is a high price to pay.
      *   *Replaceability:* This is the hardest case. If I don't eat the burger, someone else buys it. The market adjusts. My causal impact is truly zero. To condemn this, the theory must be about *virtue* or *integrity*, not *harm*. I need to make sure the spec reflects that trade-off.

