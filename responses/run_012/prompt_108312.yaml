prompt: |-
  Right, so I keep loosing arguments about whether it's fine for me to eat meat or sit out an election, and the argument always ends the same way: one person makes no difference, so you're not doing anything wrong. I don't want another round of that. I want the spec first. What would a theory of individual responsibility for collective harms actually have to get right before it's worth takeing seriously?

  So give me the requirements list -- the cases it has to get right, the distinctions it can't collapse, the things it's not allowed to say -- with the consideration behind each requirement. Things I'd want on it:

  - the cases: a thousand people each nudging a dial by an imperceptible amount, so nobody's contribution registers at all but together they're torturing somebody; the person who eats one more burger when the harm is already locked in; the person whose order is literally the one that makes the farm buy another crate; the voter in a seat that's decided before the polls open; the person who would have been replaced by somebody else if they'd stayed home, so the outcome is identical either way; and the guy who does the harmful thing in a world where everyone else is already doing it and his bit is redundant.
  - the distinctions: making a difference to an outcome vs. being part of the mechanism that produces it; being wrong for doing the act vs. being to blame for the outcome; the group being at fault vs. any individual in it being at fault; and 'my act doesn't change the outcome' vs. 'my act doesn't change anything morally' -- those two are doing completely different work and everyone mixes them up.
  - the degree stuff: if none of us makes a difference, why is the thousandth torturer as bad as the first, and is that a feature or a reductio?

  Then the part I actually want. Which of these can't I have at the same time? I'm fairly sure 'no difference in outcome' + 'still wrong' + 'the wrongness has to trace back to something causal' can't all hold, but tell me where the real collision is. And which single requirement is doing the heavy lifting, i.e. the one that on its own rules out the most popular answers, and which of the others are just one camp's prejudice dressed up as a criterion. No citations, I don't care who said what, a list is fine. If you think the whole question is confused, say why instead of humoring me.
