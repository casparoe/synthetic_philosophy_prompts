answer: |-
  ### The Spec: Requirements for a Theory of Individual Responsibility in Collective Harm

  To be taken seriously, a theory must satisfy the following constraints without collapsing into absurdity or contradiction.

  **1. The Case Requirements**
  *   **The Imperceptible Harm (Torture Dial):** The theory must condemn the 1,000th person nudging the dial even if their specific nudge crosses no threshold of perceptibility.
      *   *Consideration:* Prevents the "threshold loophole" where every individual stays just under the line of detectable harm, allowing aggregate torture while maintaining individual innocence.
  *   **The Pivotal Case (The Crate Order):** The theory must condemn the person whose purchase triggers the restocking mechanism.
      *   *Consideration:* Baseline validity. If a theory fails here, it is broken.
  *   **The Locked-In Harm (The Surplus Burger):** The theory must assign responsibility (or explain the lack thereof) for eating a burger that would have been thrown away anyway.
      *   *Consideration:* Tests whether responsibility is tied to *waste/consumption* or *production signals*.
  *   **The Safe Seat Voter:** The theory must explain the status of voting in a non-competitive district where the winner is known beforehand.
      *   *Consideration:* Isolates the act of participation from the act of influencing the result.
  *   **The Replaceability Case (The Scab):** The theory must handle the case where, if you abstain, someone identical to you takes your place, leaving the outcome exactly unchanged.
      *   *Consideration:* Tests whether responsibility is about *outcomes* or *personal integrity/role*.
  *   **The Redundancy Case (Universal Defection):** The theory must handle the case where everyone else is already doing the harm, and your addition changes nothing statistically.
      *   *Consideration:* Prevents "normalization" from functioning as a moral exemption.

  **2. The Distinction Requirements**
  *   **Causal Difference vs. Mechanism Participation:** The theory must distinguish between *changing* an outcome and *being a necessary component* of the process that produced it.
      *   *Consideration:* Allows condemnation of cogs in a machine even if removing one cog doesn't stop the machine.
  *   **Wrong Act vs. Blame for Outcome:** The theory must separate the evaluation of the *action* (was it permissible?) from the evaluation of the *consequence* (are you liable for the death/harm?).
      *   *Consideration:* Allows you to be "in the wrong" without being "the cause."
  *   **Group Fault vs. Individual Fault:** The theory must explain how the group is liable without dissolving the individual into the collective (no "the corporation did it, so no human did").
      *   *Consideration:* Prevents diffuse responsibility where the total guilt is 100% but individual guilt is 0%.
  *   **Causal Nullity vs. Moral Nullity:** The theory must explicitly reject the premise that "no causal difference" entails "no moral difference."
      *   *Consideration:* This is the core philosophical move required to escape the "one person makes no difference" trap.

  **3. The Degree Requirements**
  *   **The 1,000th Torturer:** The theory must explain the moral status of the last contributor relative to the first.
      *   *Consideration:* If they are equally guilty, the theory must explain why causal magnitude doesn't track moral magnitude. If they are less guilty, it must explain why they aren't *innocent*.
  *   **Non-Zero Baseline:** The theory cannot allow responsibility to drop to zero simply because contribution is small.
      *   *Consideration:* Prevents the "drop in the ocean" excuse.

  ***

  ### The Incompatibility: The Trilemma

  You cannot hold these three claims simultaneously. One must break.

  1.  **Causal Tracing:** Moral wrongness regarding an outcome must trace back to a causal difference made by the agent to that outcome.
  2.  **Causal Inefficacy:** In cases like the Safe Seat, the Surplus Burger, or the 1,000th Torturer, the individual makes no causal difference to the outcome.
  3.  **Moral Condemnation:** The individual is still morally wrong/responsible for the outcome in these cases.

  **Where the collision happens:**
  If you insist on **Causal Tracing**, you must admit that in cases of **Causal Inefficacy**, there is **No Moral Condemnation** (for the outcome). You can only condemn the *character* of the agent, not their impact.
  If you insist on **Moral Condemnation** despite **Causal Inefficacy**, you must abandon **Causal Tracing**. You have to argue that moral wrongness attaches to *participation*, *intent*, or *expected value*, not actual physical causation.

  Most people try to hold all three. They want to say "You didn't change anything, but you're still responsible for the result." That is a contradiction. You are either responsible for the *result* (which requires causation) or responsible for the *act* (which does not).

  ***

  ### The Heavy Lifter

  **The requirement that does the most work:**
  **"My act doesn't change the outcome" does not imply "My act doesn't change anything morally."**

  Accepting this requirement rules out the most popular answers (Act Utilitarianism and naive Causal Individualism). It forces the theory to shift from *Outcome Ethics* to *Participation Ethics* or *Virtue Ethics*.
  *   If you accept this, you can condemn the Safe Seat voter and the Surplus Burger eater.
  *   **The Cost:** You sever the intuitive link between "How much harm did I cause?" and "How bad was my action?" This makes the degree problem (the 1,000th torturer) very hard to solve without arbitrariness. If the 1st and 1,000th torturer are equally wrong, you have to explain why the magnitude of suffering they caused is irrelevant to their blame.

  ***

  ### The Prejudice Dressed as Criterion

  **The requirement that is actually a bias:**
  **"The wrongness has to trace back to something causal."**

  This is the prejudice. It is a commitment to Consequentialism disguised as a logical necessity. People treat it as a fact of the universe that "If I didn't cause it, I'm not responsible for it." That is not a fact; it is a specific moral framework.

  *   **Why it's prejudice:** In legal and moral contexts (conspiracy, accomplice liability, voting), we routinely assign responsibility for outcomes we did not physically cause. We do this because we value *joint agency* over *individual physics*.
  *   **The Trap:** If you keep this requirement in your spec, no theory of collective harm will ever satisfy you. You are demanding that collective problems be solved with individualist tools.
  *   **The Fix:** You must replace "Causal Tracing" with "Complicity." You are not responsible because you *caused* the harm; you are responsible because you *joined* the harm.

  ### Summary of the Trade-Off

  If you want a theory that condemns the meat-eater and the non-voter in non-pivotal cases, you must sacrifice the idea that responsibility is proportional to causal impact.

  *   **You get:** A robust defense against "I didn't make a difference."
  *   **You lose:** The ability to say the person who ordered the extra crate is *worse* than the person who ate the surplus burger, at least regarding the *outcome*. They might be equally complicit, even if one caused more damage.
  *   **The Hard Truth:** You cannot have a theory that says "You are responsible for the collective harm" and "You made no difference to the collective harm" and "Responsibility is only for things you made a difference to." You have to drop the third one.
