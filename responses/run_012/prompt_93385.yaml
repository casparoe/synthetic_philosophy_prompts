answer: |-
  # EXAMINATION PAPER: DECISION THEORY (FINAL YEAR)
  **Time Allowed:** 45 Minutes
  **Total Marks:** 30

  **Question 1**

  Consider the Risk-Weighted Expected Utility (RW EU) representation. For a gamble $G$ with outcomes $x_1 \le x_2 \le \dots \le x_n$ occurring with probabilities $p_1, p_2, \dots, p_n$, the value is given by:
  $$ V(G) = u(x_1) + \sum_{i=2}^{n} [u(x_i) - u(x_{i-1})] \cdot r\left(\sum_{j=i}^{n} p_j\right) $$
  where $u$ is a utility function and $r: [0,1] \to [0,1]$ is a risk function with $r(0)=0, r(1)=1$.

  Assume throughout this question that utility is linear, $u(x) = x$, and the risk function is $r(p) = 2p - p^2$.

  **(a)** Consider Gamble $A$: £100 with probability 0.6, £0 otherwise. Consider Gamble $B$: £60 for sure.
  Calculate the risk-weighted value of $A$ and $B$. Which does the agent prefer? Calculate the standard Expected Value (EV) of $A$. Briefly state what the relationship between $V(A)$ and $EV(A)$ implies about this agent's attitude toward risk in this specific choice. **[10 Marks]**

  **(b)** The function $r(p) = 2p - p^2$ is strictly concave. A student claims: "Since $r$ is concave, just like a concave utility function in EUT, this agent must be risk-averse."
  Explain why this claim is incorrect within the RW EU framework. Derive the correct mathematical condition involving $r(p)$ and the 45° line ($y=p$) that determines risk aversion (caution) versus risk inclination, and show whether this specific agent satisfies it. **[10 Marks]**

  **(c)** Consider a rival model, "Naive Weighted Utility" (NWU), defined as:
  $$ V_{NWU}(G) = \frac{\sum_{i=1}^n r(p_i)u(x_i)}{\sum_{i=1}^n r(p_i)} $$
  Compare the valuation of Gamble $G_1$ (£100 w.p. 0.5, £0 w.p. 0.5) against Gamble $G_2$ (£100 w.p. 0.25, £100 w.p. 0.25, £0 w.p. 0.5) under both NWU and RW EU.
  Show that NWU violates stochastic dominance (description invariance) while RW EU preserves it. Conclude: Does RW EU's success here vindicate Buchak's claim that $r$ represents a risk attitude distinct from probability weighting, or does the cumulative mechanism suggest $r$ is merely probability weighting in disguise? Take a definite stance. **[10 Marks]**

  ***

  # MODEL ANSWER

  **(a)**
  For Gamble $A$, outcomes are $x_1=0, x_2=100$ with $p_1=0.4, p_2=0.6$.
  Using the RW EU formula with $u(x)=x$:
  $$ V(A) = 0 + (100 - 0) \cdot r(0.6) $$
  $$ r(0.6) = 2(0.6) - (0.6)^2 = 1.2 - 0.36 = 0.84 $$
  $$ V(A) = 100 \cdot 0.84 = 84 $$
  For Gamble $B$, the outcome is £60 with probability 1.
  $$ V(B) = 60 \cdot r(1) = 60 \cdot 1 = 60 $$
  Since $84 > 60$, the agent prefers Gamble $A$.
  The Expected Value of $A$ is $0.6(100) + 0.4(0) = 60$.
  Since $V(A) = 84 > EV(A) = 60$, the agent values the risky gamble strictly higher than its mathematical mean. This indicates the agent is risk-inclined (seeking) in this context, willingly paying a premium (in utility terms) to avoid the sure thing.

  **(b)**
  The student's claim confuses the curvature of the utility function $u$ in Expected Utility Theory (EUT) with the curvature of the risk function $r$ in RW EU. In EUT, concave $u$ implies diminishing marginal utility, yielding risk aversion. In RW EU, $u$ is linear here, so all risk attitude is encoded in $r$.
  Concavity of $r$ ($r'' < 0$) implies the function lies *above* the 45° line (given $r(0)=0, r(1)=1$). This means cumulative probabilities of good outcomes are *overweighted*. Overweighting the upper tail increases the value of the gamble relative to the mean, producing risk *inclination*.
  The correct condition for risk aversion (caution) in RW EU is that the agent values the sure mean over the gamble. This requires $r(p) \le p$ for all $p$ (the function lies on or below the diagonal), which corresponds to a *convex* risk function.
  For our specific $r(p) = 2p - p^2$:
  $$ r(p) - p = p - p^2 = p(1-p) $$
  For $p \in (0,1)$, $p(1-p) > 0$, so $r(p) > p$. The function lies above the diagonal. Thus, the agent is risk-inclined, not risk-averse. The student's intuition regarding concavity is inverted for the risk function.

  **(c)**
  **NWU Calculation:**
  For $G_1$: Outcomes £100 (0.5), £0 (0.5).
  $r(0.5) = 0.75$. Sum of weights = $0.75 + r(0.5) = 1.5$? No, $r(0.5)$ for £0 is also 0.75.
  Wait, $r(0.5) = 0.75$. Denominator = $0.75 + 0.75 = 1.5$.
  $$ V_{NWU}(G_1) = \frac{0.75(100) + 0.75(0)}{1.5} = 50 $$
  *Correction:* $r(0.5) = 2(0.5) - 0.25 = 0.75$.
  $$ V_{NWU}(G_1) = \frac{0.75 \cdot 100}{0.75 + 0.75} = \frac{75}{1.5} = 50 $$
  For $G_2$: Outcomes £100 (0.25), £100 (0.25), £0 (0.5).
  $r(0.25) = 2(0.25) - 0.0625 = 0.4375$. $r(0.5) = 0.75$.
  Denominator = $0.4375 + 0.4375 + 0.75 = 1.625$.
  Numerator = $(0.4375 + 0.4375) \cdot 100 = 87.5$.
  $$ V_{NWU}(G_2) = \frac{87.5}{1.625} \approx 53.85 $$
  $G_1$ and $G_2$ are probabilistically identical, yet $V_{NWU}(G_1) \neq V_{NWU}(G_2)$. NWU violates description invariance and stochastic dominance.

  **RW EU Calculation:**
  In RW EU, value depends on cumulative probabilities of outcomes exceeding a threshold. For both $G_1$ and $G_2$, the probability of getting at least £100 is 0.5. The probability of getting at least £0 is 1.
  $$ V(G_1) = V(G_2) = 0 + (100-0) \cdot r(0.5) = 84 \text{ (using } r(0.5)=0.75 \text{? No, } 100 \cdot 0.75 = 75 \text{)} $$
  *Correction on (a) logic for (c):* In (a) $p=0.6$. Here $p=0.5$. $r(0.5)=0.75$. Value = 75.
  Crucially, $V(G_1) = V(G_2)$. RW EU preserves dominance because it weights *cumulative* probability, rendering branch splitting irrelevant.

  **Philosophical Stance:**
  While RW EU's cumulative structure successfully avoids the dominance violations that plague non-cumulative weighting, this does not vindicate Buchak's claim that $r$ represents a risk attitude distinct from belief. By requiring $r$ to operate on cumulative probabilities to ensure consistency, RW EU becomes structurally isomorphic to Rank-Dependent Utility (RDU) or Prospect Theory, where $r$ is explicitly a probability weighting function. The "separation" of belief ($p$) and attitude ($r$) is therefore formal rather than substantive; $r$ inevitably distorts the probability space to function correctly. Thus, the model saves normative consistency only by conceding that "risk attitude" is inextricably linked to probability aggregation.

  *(Word Count: 790)*

  ***

  # MARKING SCHEME

  **Total: 30 Marks**

  **Part (a): Calculation and Interpretation [10 Marks]**
  *   **Correct calculation of V(A) [3 marks]:** Must show $100 \times r(0.6)$. $r(0.6)=0.84$. Result 84.
      *   *Drop:* Using EV formula instead of RW EU formula (0 marks for this bullet).
  *   **Correct calculation of V(B) [2 marks]:** Result 60.
      *   *Drop:* Applying $r$ to the outcome value rather than probability (0 marks).
  *   **Correct Preference [2 marks]:** State A is preferred ($84 > 60$).
  *   **EV and Interpretation [3 marks]:** EV = 60. Must note $V(A) > EV(A)$ implies risk inclination/seeking (valuing gamble over mean).
      *   *Drop:* Claiming $V(A) > EV(A)$ implies risk aversion (0 marks for interpretation).

  **Part (b): Diagnosis of Risk Attitude [10 Marks]**
  *   **Identify the Error [3 marks]:** Explicitly state that concavity of $r$ does not map to aversion as concavity of $u$ does in EUT.
      *   *Drop:* Accepting the student's claim as true (0 marks for this section).
  *   **Correct Condition [4 marks]:** State that Risk Aversion requires $r(p) \le p$ (Convex/Below diagonal). Risk Inclination requires $r(p) \ge p$ (Concave/Above diagonal).
      *   *Drop:* Vague reference to "curvature" without referencing the 45° line/diagonal (2 marks max).
  *   **Application to Specific Function [3 marks]:** Show $2p - p^2 \ge p$ for $p \in (0,1)$. Conclude agent is Risk Inclined.
      *   *Drop:* Algebraic error in inequality check (1 mark max).

  **Part (c): Dominance and Philosophy [10 Marks]**
  *   **NWU Calculation G1 [2 marks]:** Correct denominator (1.5) and value (50).
      *   *Drop:* Forgetting to renormalise (1 mark max).
  *   **NWU Calculation G2 [2 marks]:** Correct denominator (1.625) and value (~53.85). Show values differ.
      *   *Drop:* Treating G2 as identical to G1 without calculation (0 marks).
  *   **RW EU Explanation [3 marks]:** Explain that cumulative probability for £100 is 0.5 in both cases, so values are identical. Dominance preserved.
      *   *Drop:* Failing to mention "cumulative" probability (1 mark max).
  *   **Philosophical Stance [3 marks]:** Must take a side. Full marks for arguing that cumulative requirement blurs the belief/attitude distinction (making $r$ act like probability weighting).
      *   *Drop:* "Fence-sitting" (e.g., "It has pros and cons") or claiming it fully vindicates Buchak without qualification (1 mark max).

  **General Penalties**
  *   **Arithmetic Errors:** Carry forward errors are allowed if the method is correct. Deduct 1 mark per part for sloppy arithmetic that obscures the method.
  *   **Word Count:** Model answer is a guide. Students are not penalized for length, but irrelevant fluff gains no marks.
  *   **Notation:** Minor notation slips ignored if intent is clear. Confusing $p$ and $u$ is a major error.
