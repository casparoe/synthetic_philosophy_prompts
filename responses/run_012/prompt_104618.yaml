          *   *Analysis:* Why "grossly"? If agents were perfect rational calculators, a 1:1 cost-benefit might suffice. The bias implies agents (duty-holders) undervalue safety or overvalue cost. It also implies epistemic humility: we can't measure risk/cost perfectly, so we bias the error margin towards life. It also touches on search costs: "practicable" implies what is possible in the real world, not just theoretically.
          *   *Verdict:* Presupposes bounded rationality and a moral weighting (life > money). It corrects for systematic bias in the duty-holder's calculus.

      *   **3. Rival Conceptions:** Expected-value maximisation, Strict Precaution, Pure Deontology.
          *   *Analysis:*
              *   *Expected-Value (EV):* ALARP rejects pure EV because of the "gross" weighting. EV treats £1m and 1 life statistically equivalent if the numbers match. ALARP says no.
              *   *Strict Precaution:* ALARP explicitly allows cost considerations. So it excludes strict precaution.
              *   *Pure Deontology:* The "intolerable" band is deontological, but the ALARP band is consequentialist-ish. Pure deontology (eliminate risk regardless of sacrifice) is excluded by the "reasonably practicable" clause.
