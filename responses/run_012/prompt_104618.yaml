  5.  **Final Polish:** Check British spelling (optimisation, practicable, programme, centre, etc.). Ensure the distinction between "strictly presupposes" and "fits comfortably" is maintained throughout.

      *   *Point 1:* Strictly presupposes marginal analysis with weighted values. Fits comfortably with satisficing language but isn't technically Simonian satisficing.
