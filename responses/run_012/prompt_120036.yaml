answer: |-
  The grudge informer cases ultimately embarrass Fuller more than Hart because achieving justice requires Fuller to violate his own principle of non-retroactivity through the fiction of nullity, whereas Hart preserves conceptual clarity by demanding honest retroactive legislation.

  For Hart, the mapping is mechanically clear but morally painful. He insists the Nazi statutes were valid law at the time because they satisfied the pedigree tests of the existing legal system, regardless of their iniquity. To convict the informer, Hart argues the postwar courts should have openly enacted a retroactive statute punishing the act of informing, acknowledging that the defendant acted legally under the prior regime but that the new regime chooses to punish that conduct anyway. This fits positivism's separation thesis perfectly: it isolates the question of legal validity from moral merit. However, it strains the rule of law, as Hart must endorse retroactivity, which he otherwise considers a vice. Positivism goes silent on whether the punishment is morally right, offering only a structural description of how to achieve it legally. It avoids cheating by refusing to lie about the past validity of the Nazi statutes, but it forces the court to admit it is sacrificing legal certainty for moral vengeance.

  For Fuller, pivoting on Radbruch's formula, the mapping requires a conceptual sleight of hand. Fuller argues that because the Nazi regime departed so radically from the "inner morality of law"—through secret statutes, arbitrary enforcement, and substantive injustice—its rules lacked legal character entirely. To convict, the court declares the Nazi statutes void *ab initio*, meaning the informer acted without legal authority and can be punished under pre-existing common law or natural law principles. This fits the moral intuition that such statutes ought not to be obeyed, but it strains the reality that those statutes functioned as law, were enforced by courts, and guided conduct at the time. Fuller's theory cheats by conflating "bad law" with "no law," effectively smuggling in retroactivity while denying it. By declaring a statute null now for acts done then, the court violates the principle of non-retroactivity, which is itself a core tenet of Fuller's inner morality. The theory goes silent on how to distinguish a merely wicked legal system from a non-legal one without relying on the very moral judgment it claims is intrinsic to legal validity.

  Running the episode in reverse shows that the cases help Hart's descriptive accuracy but embarrass Fuller's normative coherence. The courts did smuggle in retroactivity; they punished conduct that was authorized by the state apparatus at the time by retrospectively stripping that apparatus of legal status. This outcome suggests Hart was right that law can exist without morality, because the Nazi rules operated as law despite being immoral. Fuller's position is weakened because to achieve the just result, he must violate his own procedural requirements (non-retroactivity, clarity) by pretending the law never existed. Hart admits the cost of justice (retroactivity); Fuller hides it behind a metaphysical claim about the nature of law.

  Fuller's line about the inner morality of law does not give him an answer Hart can't match; it merely relabels the moral question as a jurisdictional fact. Hart says, "This was law, but it was too wicked to sustain; we must change the law to punish." Fuller says, "This was not law because it was too wicked; we punish under the old law." The outcome is identical, but Fuller's route obscures the judicial exercise of power. By claiming that extreme injustice negates legal validity, Fuller transforms a moral condemnation into a technical condition of legality, which allows courts to avoid the political burden of passing retroactive legislation. This does not solve the dilemma Hart identifies; it simply masks the moral choice as a discovery of legal truth, risking the stability of legal systems by inviting judges to invalidate valid statutes whenever they find them sufficiently odious.
