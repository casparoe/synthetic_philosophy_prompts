      *   *Self-Correction on Reading 1:* Is it trivial? Yes, "nothing happened to anyone" is trivially true regarding the *object* of the action. But does it support the colleague? No.
      *   *Self-Correction on Asymmetry:* Ensure I explicitly state if the combination is coherent. Yes, it is coherent if we reject the "No Consequences" claim.

      *(Self-Correction during drafting)*: Make sure to explicitly answer "whether it would actually support the use to which my colleague put it" for each item. The colleague used it to treat the matter as *closed*.

      *(Refining the Asymmetry section)*: The prompt asks "which reading of the slogan accounts for it". If none do, say what else. Since the slogan usually implies "no harm done," and the asymmetry implies "harm is done in one case but not the other," the slogan's standard readings *fail* to account for the asymmetry. The work is done by *social meaning*.

