prompt: |-
  So I'm doing an MSc in forensic science and we had a judge come guest-lecture on expert evidence, and she spent basically the whole hour on Daubert — the US case where the trial judge is supposed to be a gatekeeper and screen expert testimony for reliability, and one of the factors she listed was whether the theory or technique can be and has been tested, i.e. whether it's falsifiable. Popper came up by name, twice. And I can't stop thinking about it, because in the same lecture we covered how courts cheerfully admit loads of expert stuff that isn't falsifiable in any obvious sense — handwriting comparison, some of the bite-mark people, a clinician's gut judgment that a defendant is dangerous, an economist's damages estimate. And then the Court later extended the whole gatekeeping thing to all expert testimony, not just the scientific kind, which seems to cut against there being a special "science" line being drawn at all.

  What I actually want to know is what this practice is presupposing philosophically. Does treating testability as a reliability factor presuppose a demarcation criterion — that falsifiability is what separates science from non-science — or is it just a rough proxy for "this evidence could be shown wrong in a detectable way"? Which views of science does it quietly rule out (say, that a lot of good science is confirmation-driven rather than falsification-driven, or that the science/non-science line is really a social or institutional fact rather than a logical one)? Do the parts of the practice presuppose consistent things, given that it also lets in plenty of non-testable testimony — or is there a tension in there? And please seperate what the practice strictly needs from what it merely fits well with: could you run the same gatekeeping regime under several different philosophies of science, or does it actually require one?

  Also tell me what would change your mind: if you think the practice does commit itself to a real demarcation criterion, what consideration or case would have to turn up to convince you it doesn't — and where do you think your reasoning here is most likely to go wrong? I don't need citations or a reading list, I can chase those myself, I'm just trying to get the shape of the thing straight.
