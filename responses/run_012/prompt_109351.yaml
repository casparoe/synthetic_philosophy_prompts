prompt: |-
  Ok so I'm a backend engineer, no philosophy background past a CS degree where we did a few weeks of computability and that was the end of it. There's a guy on my team who, whenever we get into it about the build system, or about the config generator that generates the config that generates the CI pipeline, or about one of those self-referential things like a compiler that compiles itself or a script that rewrites its own source, says some version of: you can't have a tangled hierarchy, you need an inviolate level. His big one lately is that we're prototyping an agent that edits its own prompts and its own tool definitions, and he says flat out that's a non-starter, because anything that modifies itself has to sit under an inviolate level it can't touch, and without that the whole thing is a tangled hierarchy and nothing in it means anything. He said it with enough confidence that I couldn't argue, but I also couldn't tell whether there's an actual claim in there or just a vibe. I tried googling the phrase and got dictionary definitions of "inviolate", so either it's from some book or he made it up. It makes me think of that Escher print where the two hands are drawing each other.

  What I want is a menu, not a lecture. Give me the distinct precise things "you need an inviolate level" could be claiming, ordered from the ones that are almost too obvious to disagree with up to the ones that are genuinely contentious, and tell me for each whether it's trivial, defensible, or just false. Then tell me which reading he's probably reaching for and whether that reading actually gets him his conclusion about the self-editing agent.

  Stuff I specifically want seperated out, because I think he's mashing several things together:

  - The bookkeeping reading: any description of a loop-y system has to stop drawing arrows somewhere, and "the inviolate level" just names wherever you stopped. Pure presentation, no claim about the world. Is that all it ever is?

  - The self-reference reading: a system rich enough to talk about itself generates statements it can't settle, so you need a stronger system above it (the thing where a system can't prove its own consistency, or a language can't define truth for itself). Here I want to know whether "you need a stronger system above" means the regress actually terminates somewhere, or just that it keeps going and each level is only untouchable relative to the one below it. If it keeps going, does that undercut the slogan or is it fine?

  - The Escher reading: in that print the two hands aren't in a paradox at all, they're just an impossible scene, and what resolves it is that there's an artist off the page who drew both. Is that the same shape of claim as the logic one, or is it just the ordinary causal/authorial level and nothing deeper? Because if it's only "something made the thing", it can't be the same claim, and I'd like to know which one he's actually got in mind.

  - The software readings: kernel vs userland, the interpreter that the interpreted program can't patch, a bootstrap compiler, a quine, a metacircular evaluator, a hypervisor, a read-only root. Which of these are real instances of an inviolate level and which are just conventions we could rip out tomorrow if we wanted? And in what sense does the "inviolate" part have to be causal versus normative -- is the level below unable to touch it, or merely not supposed to, or is it just that we've agreed not to ask what's underneath it?

  - The control/politics reading: the boss of the boss, the clause in the constitution you're not allowed to amend, whoever gets to declare the emergency. Same question as above: is that the same claim in a different costume, or a different claim that happens to use the word "level"?

  - The deflationary reading, which is my suspicion: "inviolate level" is a name for the place you stopped asking questions, i.e. the homunculus you smuggled in, and the slogan does its work by making a gap sound like a feature. If that's a real reading, say so, and say what it would take to tell it apart from the honest versions.

  Then the payoff. For each reading, does it actually support what he said? If some of them give him his conclusion but for reasons that have nothing to do with meaning or semantics -- like you need a place to roll back to, or you need a root of trust -- say that, because that's a much more boring claim and I'd like to be able to say so without being wrong. And if there's a reading on which a self-modifying system with no untouched level is genuinely incoherent rather than merely risky, tell me concretely what breaks, and whether the same thing breaks for a team of humans editing the same repo, which is basically what we already are. I'm definately going to have to argue this out with him on Monday, so I want the full menu with verdicts on it, not a recommendation.
