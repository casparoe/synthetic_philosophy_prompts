answer: |-
  **Exam Question**

  **Time Allowed:** 2 Hours
  **Word Limit:** Approx. 900 words

  **Case Study:**
  Margaret is 62, a former nurse. Five years ago, shortly after a diagnosis of early-onset Alzheimer's, she signed an advance directive (AD). She was competent and deliberate. The AD refuses antibiotics for life-threatening infection, refuses artificial nutrition and hydration, and declines resuscitation. She named her younger brother as proxy. She also insisted on adding a clause of her own composition: in substance, that if she ever seemed content and cheerful in the care home, that contentment was not to be trusted, because by then the disease would have made her someone who no longer knew what she was losing — in her own words, *'if I'm smiling, don't believe me'*.

  Five years on, Margaret is severely demented. She does not recognize the document or her brother, scores near the floor on cognitive testing, and by every observable measure is happy: she sings at the piano, has favourites among the staff, and says she wants to live. She now has a chest infection.

  The brother says the directive governs, discounting clause included. The daughter says the clause is grotesque and self-defeating — her mother is *right there*, content, and the document is being used to overwrite the only person still able to speak.

  **Complication:** The directive contains a deliberate asymmetry. Alongside the refusals, it *also* requests that she be kept alive as long as she isn't in pain, "in case she changed her mind about the antibiotics."

  **Question:**
  To analyze this conflict, distinguish between a directive's **Authorship Authority** (it binds because she made it — the maker's hand) and its **Fidelity Authority** (it binds because it accurately represents what the person she now is would want, or would have wanted had she known).

  1.  Do these two authorities come apart in Margaret's case? Which one is the brother invoking, and is the 'smiling' clause an exercise of Authorship Authority or an attempt to secure Fidelity Authority from the inside?
  2.  How do you resolve the contradictory instructions (refuse treatment vs. keep alive if no pain)?
  3.  Is the question 'who is the patient?' answerable in general or only case by case?
  4.  Is the daughter's line — that the document is the place where her mother survives — a claim about identity or a claim about grief wearing identity's clothes?

  ***

  **Model Answer**

  The conflict over Margaret's care hinges on the friction between her past competent self and her current incapacitated self. To resolve this, we must separate **Authorship Authority** from **Fidelity Authority**. Authorship Authority relies on the historical fact of signature: the directive binds because Margaret *wrote* it. Fidelity Authority relies on representational accuracy: the directive binds because it tracks the interests or wishes of the *current* patient.

  In this case, these authorities decisively come apart. The brother invokes Authorship Authority. He argues that the signature five years ago carries normative weight regardless of current psychological continuity. The 'smiling' clause is a fascinating hybrid: it is an exercise of Authorship Authority used to preemptively undermine potential Fidelity Authority. Margaret anticipated that her future self's expressed wishes (Fidelity) would be corrupted by disease. By writing "don't believe me," she used her past authority to instruct proxies to ignore her future apparent contentment. She attempted to secure Fidelity (what she *would* want if healthy) by sacrificing the evidence of her current state. However, this creates a paradox: if the current Margaret is genuinely happy, overriding that happiness violates Fidelity Authority regarding her current welfare, even if it respects her past Authorship.

  The contradictory instructions complicate this further. The AD refuses antibiotics but requests she be kept alive if not in pain. This contradiction undermines Authorship Authority. A directive cannot bind if it is logically incoherent; the 'maker's hand' has signed two mutually exclusive commands. If the chest infection causes pain, the 'keep alive' clause triggers, requiring antibiotics to alleviate pain/sustain life. If it refuses antibiotics, she may die, violating the 'keep alive' clause. Because the document cancels itself out, Authorship Authority collapses. We cannot defer to a maker who issued contradictory orders. Consequently, we must fall back on Fidelity Authority or best interests. Given current Margaret expresses a wish to live and appears happy, Fidelity Authority supports treatment. The brother's reliance on the AD is therefore misplaced; the AD is void due to internal contradiction.

  Regarding 'who is the patient?': this is not answerable in general. Psychological continuity theories suggest Margaret 2.0 is not Margaret 1.0, implying the AD lacks jurisdiction. However, legal and social practices often treat them as identical for property and rights. Here, a case-by-case approach is necessary. In medical decisions where welfare is observable (happiness vs. suffering), the current self's interests should outweigh the past self's abstract rules. The patient is the being in the bed, not the signature on the paper.

  Finally, the daughter's claim that "the document is the place where her mother survives" requires scrutiny. Is this identity or grief? If she means the *true* Margaret exists only in the text, that is a claim about identity—specifically, that psychological continuity is preserved in writing rather than biology. However, given the contradiction in the text, the document no longer coherently represents *any* Margaret. It is more likely a claim about grief wearing identity's clothes. The daughter cannot accept the happy demented woman as her mother because that woman is too altered; she clings to the document because it preserves the mother she *lost*, not the one she *has*. She privileges the past identity to avoid mourning the present stranger. Yet, ethically, we must treat the present stranger. Since the AD is incoherent, and the current patient expresses joy and a will to live, treatment should proceed. The brother's reliance on the 'smiling' clause fails because the clause cannot rescue a contradictory document, and the daughter's reliance on the current self is ethically sound, even if motivated by an inability to accept the disease's transformation.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Application of Authority Distinction (4 Marks)**
  *   **A-Grade:** Clearly defines Authorship (historical act) vs. Fidelity (representational accuracy) and applies them to the brother's stance.
  *   **B-Grade Fail:** Defines the terms abstractly but fails to specify which authority the brother is invoking (Authorship).

  **2. Analysis of the 'Smiling' Clause (4 Marks)**
  *   **A-Grade:** Identifies the clause as an attempt to use Authorship to override current evidence of Fidelity, noting the paradox of overriding current happiness.
  *   **B-Grade Fail:** Treats the clause as a standard refusal instruction without analyzing its function as a preemptive discounting of current state. **(Critical Differentiator)**

  **3. Resolution of Contradictory Instructions (4 Marks)**
  *   **A-Grade:** Argues that contradiction voids Authorship Authority, forcing a shift to current best interests/Fidelity.
  *   **B-Grade Fail:** Attempts to prioritize one clause over the other without addressing how the contradiction undermines the directive's validity entirely.

  **4. Identity Question (General vs. Case-by-Case) (4 Marks)**
  *   **A-Grade:** Takes a stance on whether identity is general or contextual, linking it to why the current patient's welfare matters more here.
  *   **B-Grade Fail:** Recites psychological continuity theory without concluding whether it applies generally or only case-by-case in this context.

  **5. Analysis of Daughter's Claim (Identity vs. Grief) (4 Marks)**
  *   **A-Grade:** Distinguishes between the philosophical claim (identity resides in text) and the psychological claim (grief masking as identity), evaluating the ethical weight of each.
  *   **B-Grade Fail:** Accepts the daughter's claim at face value as purely about identity without interrogating the motivational element (grief).
