          *   *Modal Status:* Deterministic. Given exact initial conditions $I$, outcome $O$ is fixed. "Could have been otherwise" only means "If $I$ had been $I + \epsilon$, $O$ would be $O'$."
          *   *Causality:* Non-linear amplification.
          *   *Context:* Weather, fluid dynamics, planetary orbits (sometimes).
          *   *Goal:* To explain unpredictability and complexity within a fixed rule set.

