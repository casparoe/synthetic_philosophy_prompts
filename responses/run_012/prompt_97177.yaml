prompt: |-
  I'm putting together the final for my metaphysics-of-mind seminar and I want to workshop one essay question with you. We spent the last two weeks on levels of description and causation, and the reading my students actually got into was Hofstadter's careenium — the box of tiny magnetic marbles ("simms") that bounce around and now and then clump together into bigger clusters ("simmballs"), where no individual sim is about anything but the clusters supposedly are. The question I want to ask is basically whether the simmballs push the simms around or whether that's backwards: does the symbolic level do any causal work, or is it just a fancy redescription of what the marbles were already doing? My problem is that I already know how they'll answer — half will recite the intentional-stance line ("it's a stance, not a fact about the world") and half will wave at the exclusion arguement ("the microphysics is sufficient, so the macro level is just along for the ride"), and neither of those is doing the work I want. I need a question they can't wriggle out of with a label.

  So here's what I want baked in. First, make them use the interventionist / manipulabilty account of causation — the idea that X causes Y just in case there's some way of wiggling X, holding everything else fixed, that would change Y — and make them notice the snag that you can't wiggle a simmball without wiggling its simms at the same time, which is the whole puzzle in miniature. Second, give them something they won't have seen before: a device, call it a cluster detector, that watches the careenium, fires a signal whenever a simmball of a particular shape shows up, and uses that signal to drive a little fan that blows the individual simms around. Now there's a loop running from the macro level back down to the micro level, and they have to say whether that loop shows the simmballs are genuine causes or whether it just shows the detector is reading off the sims. Also stipulate that the sim-level microphysics is indeterministic, so nobody gets to say "the microstate already fixes everything anyway." I want the question to force a verdict on whether "do the symbols push the substrate?" is even a factual question about the careenium, as opposed to a question about which causal model / variable set you've decided to use — and to make them defend that verdict instead of hiding behind a name.

  Write me three things: (1) the essay question itself, phrased for the students, pitched at 90 minutes, with a line telling them what's being assessed; (2) a model answer of roughly 700 words; and (3) a marking scheme. Please hand the whole thing back as a JSON object with these fields: question (string), model_answer (string), marking_scheme (an array of objects, each with move, marks, and typical_error), total_marks (integer, make it 25), and distinction_note (one line on what separates an A from a B). At least one must-hit move should be about why "fat-handed" interventions on a supervenient property are the crux, and at least one should be about the difference between something being a cause and its being the difference-maker / proportional cause. And please don't make the question depend on them having memorized who said what — it's the reasoning I'm grading, not the citations.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Context:** Metaphysics-of-mind seminar final exam.
      *   **Topic:** Levels of description, causation, Hofstadter's Careenium (simms/simmballs).
      *   **Core Problem:** Students usually default to "intentional stance" (Dennett) or "causal exclusion" (Kim) without engaging deeply. The instructor wants to force them to use interventionist/manipulability accounts of causation.
      *   **Specific Constraints:**
          *   Must use interventionist causation (wiggle X, hold others fixed, change Y).
          *   Must address the "fat-handed" intervention problem (can't wiggle simmball without wiggling simms).
          *   Must include a new device: a "cluster detector" that detects simmballs and blows simms around (macro-to-micro feedback loop).
          *   Must stipulate indeterministic microphysics (blocks determinism/exclusion easy outs).
          *   Must force a verdict on whether "do symbols push substrate?" is factual or model-relative.
          *   Output format: JSON object with specific fields (`question`, `model_answer`, `marking_scheme`, `total_marks`, `distinction_note`).
          *   Marking scheme needs specific moves (fat-handed interventions, cause vs. difference-maker/proportional cause).
          *   Total marks: 25.
          *   Model answer length: ~700 words.
          *   No reliance on memorized citations (reasoning over names).

  2.  **Drafting the Essay Question:**
      *   Needs to set up the Careenium scenario clearly.
      *   Needs to introduce the Cluster Detector + Fan mechanism.
      *   Needs to specify indeterministic microphysics.
      *   Needs to explicitly demand the use of interventionist causation.
      *   Needs to ask the core philosophical question: Is the macro level causally efficacious, or is this just a modeling choice?
      *   Time limit: 90 minutes.
      *   Assessment focus: Argumentative precision, application of interventionism, handling of supervenience/causal loops.

  3.  **Drafting the Model Answer:**
      *   *Introduction:* Define the setup and the interventionist criterion (Woodward-style). State the thesis (e.g., macro-causation is real relative to a variable set, but faces the fat-handedness challenge).
      *   *The Interventionist Challenge:* Explain that to test if Simmball (S) causes Simms (s), we need to intervene on S while holding s fixed. But S supervenes on s. You can't change S without changing s. This is the "fat-handed" intervention problem.
      *   *The Detector Loop:* Analyze the new device. Detector sees S -> Fan moves s. Does this prove S causes s? No, it shows S-correlates cause s. The detector reads the micro-configuration that constitutes S.
      *   *Indeterminism:* Acknowledge this blocks the "micro-determination" objection. The micro-state doesn't fix the future absolutely, but the intervention problem remains.
      *   *Proportionality/Difference-making:* Distinguish between causing and being the *proportional* cause. The simmball property might be the better difference-maker for certain outcomes (stability) even if micro-physics does the pushing.
      *   *Conclusion:* Verdict on whether it's factual or model-relative. Likely conclusion: Causation is model-relative (variable set dependent), but within a macro-variable set, simmballs are genuine causes. The loop doesn't solve the fat-handedness issue but highlights the utility of macro-variables.
      *   *Word Count Check:* Need to keep it tight around 700 words.

  4.  **Drafting the Marking Scheme:**
      *   Total: 25 marks.
      *   Needs specific moves with marks and typical errors.
      *   *Move 1:* Correctly stating interventionist causation (wiggle X, hold fixed, change Y). (5 marks)
      *   *Move 2:* Identifying the fat-handedness problem (cannot intervene on macro without changing micro). (5 marks)
      *   *Move 3:* Analyzing the Detector Loop (does it prove macro-causation?). (5 marks)
      *   *Move 4:* Distinguishing cause vs. proportional cause/difference-maker. (5 marks)
      *   *Move 5:* Final verdict on factual vs. model-relative status. (5 marks)
      *   *Distinction Note:* What separates an A from a B? (Nuance on variable sets vs. ontological realism).

  5.  **Refining and Formatting (JSON):**
      *   Ensure all JSON syntax is correct (escaping quotes, newlines).
      *   Check constraints: "At least one must-hit move should be about why 'fat-handed' interventions... are the crux", "at least one should be about the difference between something being a cause and its being the difference-maker / proportional cause."
      *   Ensure the question doesn't rely on names (Dennett, Kim, Woodward) but concepts.
      *   Ensure the model answer doesn't rely on names either, per the prompt's instruction ("don't make the question depend on them having memorized who said what" - implies the grading should focus on reasoning, but the model answer should probably also avoid name-dropping to show how it's done, or use them sparingly as labels for concepts. I will minimize names to focus on concepts).
      *   Check word count for model answer.
      *   Check total marks sum to 25.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the detector loop clear?
      *   *Fix:* Make sure the question specifies the detector triggers *based on the cluster shape* and affects the *individual marbles*.
      *   *Critique:* Is the indeterminism clear?
      *   *Fix:* Explicitly state in the question that simms have stochastic movement.
      *   *Critique:* Model answer length.
      *   *Fix:* Monitor closely. 700 words is roughly 4-5 substantial paragraphs.
      *   *Critique:* JSON escaping.
      *   *Fix:* Be careful with newlines (`\n`) and quotes (`\"`).

  7.  **Final Polish:**
      *   Verify the "distinction_note" is one line.
      *   Verify the marking scheme array structure.
      *   Verify the prompt's specific requirement about "fat-handed" and "proportional cause" is met in the marking scheme.

  Let's write the content.

  *Question:* Focus on the Careenium, Simms/Simmballs, Detector/Fan, Indeterminism, Interventionism.
  *Model Answer:* Structure: Intro (Interventionism), The Fat-Handed Problem, The Detector Loop, Proportionality, Conclusion (Model-Relative).
  *Marking Scheme:* 5 criteria x 5 marks = 25.

