prompt: |-
  Okay, I need help auditing a summary before I go around repeating it. I have no background in economics methodology and I keep getting burned by confident-sounding secondary sources, so I'd rather check this with someone who actually knows the material.

  The setup: a friend sent me a blog post by someone with an econ PhD who writes for a general audience. It's explaining Friedman's famous essay on positive economics and the whole business about assumptions not needing to be realistic. Roughly:

  Friedman's essay is the founding document of the idea that a theory should be judged only by its predictions. On his view you should never ask whether a model's assumptions are true — you ask whether it forecasts well. He goes further: the more important the theory, the less realistic its assumptions will be, because a powerful theory strips away detail and keeps only what matters. That's what licenses profit maximization and rational choice even when real people obviously aren't doing any calculating. The firm behaves as if it were maximizing profits, and that's all the theory needs. So Friedman is an instrumentalist — for him models aren't descriptions of the world, they're calculating devices, and asking whether one of them is true is a category mistake. And since positive economics is just prediction, it's also value-free: economists can settle their policy disagreements among themselves without importing moral views, which only enter at the last step, when you pick a goal. Critics complained that this makes theories unfalsifiable, since you can always wave away a bad assumption by saying it was never meant to be realistic, and Samuelson, who coined the nickname for the doctrine, demolished the argument, which is why hardly anyone defends it anymore. Modern economists use these assumptions because they're convenient, not because they believe Friedman's story about them.

  What I want from you: take the role of a philosopher of economics — someone who has read the essay closely, knows the secondary literature, and knows the critics too. Before you dive in, please brainstorm a bit: put down what you take the essay's actual claims to be, and where a summary like this is most likely to slip, and then use that to organize the audit. Think carefully, and don't be diplomatic where the post is wrong.

  Then go claim by claim and tell me, for each one, whether a careful reader of Friedman would accept it, whether it's the kind of simplification a competent popularizer makes (and whether it's harmless or actually changes the position), whether it's something Friedman explicitly denies, and whether the blogger's concluding verdict follows from whatever survives.

  A few things I'm especially unsure about: is an unrealistic assumption the same thing as an idealization, or is the post running two different ideas together? Is the instrumentalist label one Friedman would accept, or is it the blogger's gloss? Is the value-freedom bit part of the same doctrine or a seperate part of the essay, and does that part even say what the post says it says? And the unfalsifiability objection — is it a refutation or just an objection? I'm inclined to believe that last bit, so tell me if I shouldnt.

  No citations or reading lists needed, I just want to know which sentences to trust, which are an interpretive fight rather than settled, and what a defender of Friedman would say back. If the whole thing turns out to be a critique wearing the costume of a summary, say so.
