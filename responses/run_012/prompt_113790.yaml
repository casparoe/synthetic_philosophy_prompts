          *   "Only by its predictions" (ignores consistency/logic).
          *   "Never ask whether assumptions are true" (Friedman says they *are* false, but the point is it doesn't matter for validity).
          *   "More important = less realistic" (This is the most controversial claim, often misread).
          *   "Instrumentalist" (Philosophically loaded term).
          *   "Value-free" (Positive economics is value-free, but policy advice involves both).
          *   "Samuelson demolished... hardly anyone defends" (Historical exaggeration).

  4.  **Drafting the Claim-by-Claim Audit:**
      *   *Claim 1:* "Founding document... judged only by its predictions." -> *Mostly True,* but "only" is strong. Friedman emphasizes predictive accuracy as the *ultimate* test, not the *only* consideration in construction.
      *   *Claim 2:* "Never ask whether a model's assumptions are true." -> *True to Friedman,* but needs context. He says they *are* invariably false. The sin is thinking their falsity invalidates the theory.
      *   *Claim 3:* "The more important the theory, the less realistic its assumptions." -> *True to Friedman,* this is his specific thesis on abstraction. But it's the most attacked point.
      *   *Claim 4:* "Licenses profit maximization... behaves as if." -> *True.* This is the classic example.
      *   *Claim 5:* "Friedman is an instrumentalist... models aren't descriptions... category mistake." -> *Interpretive Fight.* Friedman leans instrumentalist, but calling it a "category mistake" to ask if true is a strong philosophical gloss. He cares about predictive truth.
      *   *Claim 6:* "Positive economics is just prediction, it's also value-free... settle policy disagreements... without importing moral views." -> *Mixed/Slippage.* Positive economics is value-free regarding *facts*. Policy disagreements often stem from positive disagreements, but ultimate goals are normative. The summary implies economists can settle policy *fully* without morals, which is wrong.
      *   *Claim 7:* "Critics complained... unfalsifiable... Samuelson... demolished... hardly anyone defends it anymore." -> *Overstated/Biased.* Samuelson criticized it heavily ("F-Twist"). "Demolished" is partisan. "Hardly anyone defends" is false; many practice it implicitly.

  5.  **Addressing Specific Uncertainties:**
      *   *Unrealistic vs. Idealization:* Friedman treats them similarly (descriptive falsehood for analytical gain). The summary isn't wrong here, but philosophers distinguish them.
      *   *Instrumentalist Label:* Friedman didn't use the label explicitly as a philosophical commitment, but his arguments align with instrumentalism. It's a competent gloss, but carries baggage.
