          *   Threat to Platonism. If our universe could be countable from outside, is mathematical truth stable?
      *   **Logic vs. Concept:**
          *   Is it Set Theory's fault or Logic's fault?
          *   First-order logic (FOL) allows non-standard models (compactness, Löwenheim-Skolem).
