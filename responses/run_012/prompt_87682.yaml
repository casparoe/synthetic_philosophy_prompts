prompt: |-
  I'm doing an MSc in economics and I've somehow ended up in the philosophy of rational choice reading group, which I mostly love but which regularly makes me feel like the thickest person in the room. Last week we were meant to be talking about ambiguity, and a friend of mine — he's doing a PhD in decision theory and is very confident about absolutely everything — sent round a summary he'd typed up from some popular behavioural-economics book (I won't name it, partly because I've genuinely forgotten which one it was and partly because I don't want to dunk on whoever wrote it). He said it was "all you need to know about Ellsberg", and it goes roughly like this:

  "Ellsberg's paradox is the famous experiment with two urns. Urn A holds 100 balls, 50 red and 50 black. Urn B also holds 100 balls, each one either red or black, but you aren't told in what proportion — it could be any split at all. You're offered two bets, one at a time: win £100 if you draw a red ball, and win £100 if you draw a black ball, and in each case you get to choose which urn to draw from. Almost everyone chooses urn A for the red bet, and almost everyone also chooses urn A for the black bet. The point is that people prefer the gamble with the known odds to the one with the unknown odds: they're risk-averse, and they'd rather take a risk they can see. Ellsberg showed that anyone who makes both of those choices is being irrational. If you'd rather bet on red from urn A than from urn B, you must reckon urn B has fewer than 50 red balls; if you'd rather bet on black from urn A than from urn B, you must reckon it has fewer than 50 black balls. Both can't be true, so the two preferences contradict each other, and since expected utility theory demands that a rational agent's preferences be consistent, the experiment refutes expected utility theory. It's really the same phenomenon as the Allais paradox, and it's part of why people stay out of the stock market and stick to investments they understand. The moral economists have drawn is that ambiguity aversion is a bias, like loss aversion — something we'd be better off training out of ourselves."

  I have to present on this next week and I really don't want to make a fool of myself, so I'd be grateful for help. Could you take the role of a decision theorist who actually works on ambiguity — someone at home both in the Savage framework and in the post-Savage literature — and, before you start writing, brainstorm a list of the distinct claims the summary is making, so that none of them slips past? Then go through it claim by claim: tell me what a specialist would nod along to, what they'd wince at, and what is just plain wrong, and be specific about why in each case. One thing I already suspect is off is the bit about risk aversion, but I can't quite articulate what's wrong with it, so please explain that properly.

  And finally — this is the part I actually care about — does his concluding moral, that Ellsberg refutes expected utility theory and that ambiguity aversion is a bias we ought to correct, genuinely follow from the parts of the summary that are accurate? My instinct is that he's overshot, but I couldn't say how. If the real puzzle is something the summary has missed entirely, tell me what it is and why it matters, and if there are distinctions that would dissolve his version of the problem, spell them out. Please write your answer in British English, and definately don't be shy about telling me where he's gone wrong.
