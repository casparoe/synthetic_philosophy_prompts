      *   *Key Technical Point:* I need to make sure the Risk vs. Ambiguity distinction is crystal clear because the user specifically flagged it. Use the Knightian distinction.
      *   *Key Technical Point:* The Allais comparison is a big tell that the friend hasn't read the primary literature. I need to highlight why they are structurally different (Independence Axiom vs. Sure Thing Principle).
      *   *Normativity:* This is the philosophy group. I need to lean into the *rationality* debate, not just the economics. Is it irrational to care about the *source* of probabilities?

  6.  **Final Polish (British English & Formatting):**
      *   Check spellings (behaviour, programme, modelled).
