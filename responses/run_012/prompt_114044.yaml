      *(Self-Correction on Lashley)*: I need to be careful here. Von Neumann *does* discuss Lashley in the book. He accepts that memory isn't localized like a tape. So the user's claim "von Neumanns whole picture of the brain comes from the computer he designed, where the memory sits in a seperate place" is technically factually incorrect regarding Von Neumann's *view of the brain*. Von Neumann knew the brain wasn't like that. He was asking *how* the brain does it if it's not like that. I need to point this out clearly so the user doesn't get hammered by the teacher.

      *(Refining the "Accuracy" section)*:
