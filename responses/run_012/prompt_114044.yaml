prompt: |-
  ok so i need help and i think your the right kind of person to ask. my science and society class (its a weird combined class, half history of science half philosophy) has an assignment where we write a short essay about a scientist who thought seriously about minds or thinking, and then we have to get comments on the draft from someone outside the class before we turn in the final version. my teacher said the comments have to come from someone who actually knows the material and not just my mom, so im asking you.

  my topic is von Neumanns book The Computer and the Brain. its the little 96 page book he wrote at the very end of his life, he was supposed to give the Silliman lectures at Yale but died before he could give them, and it came out in 1958. he finished it right before he died. i read the whole thing which is honestly the main reason i picked it over something longer.

  heres my draft. please be honest, i would rather hear that something is wrong now than in front of the class.

  Von Neumann and the Brain

  John von Neumann basically invented the modern computer, and at the end of his life he wrote a short book asking whether the brain is one. I think his answer is basically no, and that he was right, and that this is a problem for people today who talk like AI is going to be a brain.

  His first point is about speed. A neuron takes about a millisecond to fire, which is way slower than a transistor switching, like a million times slower. So the brain cant be doing it the same way, and von Neumann says it makes up for the slowness with parallelism, meaning billions of neurons all working at once instead of one fast processor doing steps in order. I think this part is definately right and modern neuroscience agrees with him.

  His second point is reliability and this is the part I find most interesting. Computers are made of parts that almost never fail, but the whole machine is fragile, one bad bit and the program crashes. The brain is the exact opposite. Neurons are unreliable, they fire randomly, they sometimes dont fire when they should, and somehow the whole thing works for eighty years. Von Neumann thought this was the central puzzle and I think he never solved it.

  His third point is about the language of the brain. He asks whether the brain is digital or analog, and he cant decide, and he wonders if it uses a statistical code where the exact timing of a spike doesn't matter, only roughly how many neurons fire in some window. I think this is the deepest part of the book and I wish he had lived long enough to finish the argument.

  Then my criticism. Von Neumann was writing before we knew much about memory. Lashley trained rats to run mazes and then cut out pieces of their cortex and the rats still remembered the maze, more or less, no matter where he cut. So memory isn't stored in one place like a file on a hard drive. But von Neumanns whole picture of the brain comes from the computer he designed, where the memory sits in a seperate place from the processor and you have to go fetch it and bring it back. If the brain doesn't work like that then the comparison breaks at the most important point. So the brain is not a von Neumann machine, which is kind of funny since hes the one its named after.

  here's what i want from you:

  1. which parts of this are actually accurate about what von Neumann said, and which parts i got wrong or flattened into something simpler than he meant. be specific, point at the sentence and say whats off.

  2. the thing im least sure about is the Lashley part. is that a fair criticism of von Neumann or am i attacking a version of him he never held? if it is fair, whats the strongest reply he could make, since i have to imagine the reply anyway in class.

  3. is this interesting or is it just a book report with a twist at the end. be blunt.

  4. my conclusion is weak, i know it is. give me a couple of directions it could go, not a whole rewritten essay.

  also please dont give me page numbers or citations or stuff to go read, i cant get to a library before friday and my teacher cares more about the ideas anyway.
