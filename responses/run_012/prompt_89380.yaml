          2.  Responsiveness/Injustice (Severe).
          3.  Strategic Voting (Manageable but annoying).
      *   **Defender Concessions:** They admit Agenda Control is hard, but claim Injustice is the price of logic.
      *   **The "Reasons" Idea:** It's a costume. It reintroduces the paradox at the level of reason-weighting.
      *   **Conclusion:** You haven't solved the dilemma; you've just chosen which horn to impale yourself on.

