      *(Self-Correction on the "Reasons" idea)*: Actually, there is literature on this. "Reason-based choice." But the aggregation of reasons is subject to the *same* paradox. If Reason 1 + Reason 2 -> Verdict A. Reason 3 -> Verdict B. Majority accepts Reason 1, 2, and 3. Do we get A or B? It's the dilemma again. I need to point this out sharply.

  9.  **Finalizing the Output Structure:**
      *   **Direct Hit:** Your position is exposed.
      *   **Defeater Sorting:**
