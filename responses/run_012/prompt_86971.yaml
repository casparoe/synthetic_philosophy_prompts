prompt: |-
  I've spent the past year coordinating a small volunteer fact-checking desk out of our county library system: patrons drop off a claim at the reference counter or through a web form, and my team has to decide within a day or so whether the claim gets a short written explainer we publish under the library's name, whether we send the patron back with guidance on how to check it themselves, or whether we say nothing at all because engaging would only spread it further. I got pulled into this after watching a close relative sink into a theory about our water utility that I could never reason him out of — every piece of evidence I brought him was absorbed and turned into further proof of the cover-up — and that experience convinced me that the usual advice to check the source and check the date is close to useless against a claim that has already built the debunking into itself. We handle four or five submissions a week, we get about fifteen minutes of research per claim with no access to court records or public-records requests, and anything we publish is signed off by the library director, so I need a procedure that is defensible rather than clever.

  What I want from you is a decision procedure my volunteers can actually run on a claim, built out of what the epistemology of conspiracy theories genuinely knows rather than the folk version. The tension I keep running into is this: there is one tradition that treats a conspiracy theory as just an ordinary causal claim, to be weighed evidence by evidence like any other, and another that treats conspiracy theories as a distinctive epistemic kind that can be discounted in advance on structural grounds — and I need a procedure that uses the structural grounds as triage without becoming a machine for dismissing true claims, since real conspiracies and real institutional wrongdoing exist and often look, at first, exactly like this. So the procedure should have an explicit step that forces genuine engagement with the leftover anomalies that official accounts leave unexplained, because a good conspiracy theory's whole selling point is that it explains them, and it should treat the following as indicators to be operationalized rather than as verdicts: a structure in which disconfirming evidence is reabsorbed as confirming; a demand for a higher evidentiary standard from the official account than from the theory itself; an assumption of near-perfect secrecy across a large number of participants; and the habit of treating coincidence as something that must be explained away. I also want the procedure to keep separate the epistemic question (is this claim warranted?) from the strategic and ethical question (should we, a public institution, respond to it at all?), because those come apart and I don't want my volunteers resolving a values question with a checklist.

  The deliverable should be the ordered questions to ask, what counts as a sufficient answer to each, where the procedure stops with a definite no, and where it hands the decision to a person because the question is one of values rather than facts — and it should be honest about which steps are judgment calls dressed up as procedure. Then run it on three submissions I'll give you so I can see it work: first, my relative's claim that the utility is adding something to the water as part of a deliberate plan to make the population docile, which I personally find absurd but which keeps arriving from people who are not absurd; second, a claim that our regional hospital is quietly rationing care to hit a budget target, which is an under-evidenced institutional allegation that could simply be true and that I would not want us to flag as a conspiracy theory; and third, a claim that last year's county-wide emergency-alert test was a pretext for standing up a federal surveillance program, which is one I find more plausible than I'd like to admit, so I want to see the procedure tell me something I won't enjoy hearing. Finally, tell me what the procedure cannot do and the cases where it will misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Coordinator of a volunteer fact-checking desk at a county library system.
      *   **Context:** Small scale (4-5 submissions/week), limited resources (15 mins research/claim), high accountability (Library Director sign-off), public institution (needs defensibility).
      *   **Motivation:** Personal experience with a relative radicalized by a water utility conspiracy. Realizes standard "check the source" advice fails against self-sealing claims.
      *   **Core Tension:** Needs to balance treating conspiracy theories as ordinary causal claims (evidence-based) vs. distinctive epistemic kinds (structural red flags). Must avoid dismissing *true* conspiracies (real wrongdoing exists).
      *   **Specific Requirements:**
          *   Ordered questions (decision procedure).
          *   Criteria for sufficient answers.
          *   Stop points (definite no).
          *   Hand-off points (values/ethics vs. facts).
          *   Honesty about judgment calls.
          *   Operationalize specific indicators: reabsorption of disconfirmation, asymmetrical evidentiary standards, assumption of perfect secrecy, over-explaining coincidence.
          *   Separate epistemic warrant from strategic/ethical response.
          *   Test on three specific cases (Water utility docility, Hospital rationing, Emergency alert surveillance).
          *   Acknowledge limitations/failure modes.

  2.  **Deconstruct the Epistemology:**

      *   *Ordinary Causal Claim:* "X caused Y." Can be tested with standard evidence.
      *   *Conspiracy Theory (Epistemic Kind):* Often characterized by "unfalsifiability" (Popper), "self-sealing" (Sunstein/Vermeule), "hyper-agency" (everything is intentional).
      *   *The Trap:* Dismissing everything structurally risks missing real scandals (Watergate, Tuskegee). Engaging everything evidentially risks wasting time on unfalsifiable nonsense.
      *   *The Solution:* A triage system. Use structural flags to identify *high-risk* claims, but require evidentiary engagement to dismiss them. Don't dismiss based on structure alone; use structure to dictate *how much* evidence is needed to sustain the claim.

  3.  **Drafting the Procedure (The "Library Fact-Check Protocol"):**

      *   *Phase 1: Intake & Triage (Structural).* This is where we identify the "conspiracy" nature without judging truth yet.
      *   *Phase 2: Epistemic Assessment (Evidentiary).* This is where we weigh the claim.
      *   *Phase 3: Strategic/Ethical Decision.* This is where the Library Director comes in (To publish? To guide? To ignore?).

      *   *Refining the Indicators:*
          *   *Reabsorption:* Does the claim explain away counter-evidence as part of the plot?
          *   *Asymmetry:* Is the burden of proof impossible for officials but low for the theorist?
          *   *Secrecy:* Does it require too many people keeping secrets for too long?
          *   *Coincidence:* Does it treat random noise as signal?

      *   *Stop Conditions:* If a claim is unfalsifiable *and* harmful, stop. If it's structurally sound but evidentially empty, stop.
      *   *Hand-off Conditions:* If the claim is plausible but responding might amplify harm, that's a values call.

  4.  **Developing the Steps (Iterative Process):**

      *   *Step 1: Falsifiability.* Can this be proven false? If no, it's not a fact-check candidate. (Stop/Hand-off).
      *   *Step 2: The Secrecy Test.* How many people need to know? (Operationalize the "perfect secrecy" indicator).
      *   *Step 3: The Evidence Asymmetry.* What proof is offered vs. what is demanded of officials? (Operationalize "asymmetrical standards").
      *   *Step 4: The Reabsorption Check.* If we find counter-evidence, does the theory digest it? (Operationalize "self-sealing").
      *   *Step 5: The Anomaly Check.* Does the official story actually leave a gap? (Address the "leftover anomalies" requirement).
      *   *Step 6: Strategic/Ethical.* Should we speak? (Separate epistemic from ethical).

  5.  **Testing on the Three Cases:**

      *   *Case 1: Water Utility Docility.*
          *   Falsifiable? Technically yes (chemical analysis), but proponents say "they hide it."
          *   Secrecy? High (all utility workers, testers, regulators).
          *   Asymmetry? High (Lab tests dismissed as rigged).
          *   Reabsorption? High (My relative's experience).
          *   Anomaly? Maybe taste/smell, but explained by standard treatment.
          *   Verdict: Epistemically unwarranted. Strategic decision: Don't publish a debunk (amplification risk), offer research guidance.
      *   *Case 2: Hospital Rationing.*
          *   Falsifiable? Yes (budget records, patient outcomes).
          *   Secrecy? Medium (Admin staff, doctors). Plausible.
          *   Asymmetry? Low/Medium.
          *   Reabsorption? Low.
          *   Anomaly? Yes (long wait times, denied procedures).
          *   Verdict: Epistemically open (needs more than 15 mins). Strategic decision: High risk. Hand to Director. Do not publish definitive "False."
      *   *Case 3: Emergency Alert Surveillance.*
          *   Falsifiable? Yes (technical specs of alert system).
          *   Secrecy? Medium/High (FEMA, telecoms).
          *   Asymmetry? Medium.
          *   Reabsorption? Medium (Lack of proof = proof of sophistication).
          *   Anomaly? Yes (Why test so often? New tech?).
          *   Verdict: Epistemically weak but technically grounded. Strategic decision: Tricky. Public fear is high. Might need a "Here's how the tech works" explainer rather than "This is false."

  6.  **Refining the Output:**

      *   *Tone:* Professional, pragmatic, epistemologically honest. No condescension.
      *   *Structure:* Clear headers, bold text for decision points.
      *   *Limitations:* Must admit that 15 minutes isn't enough for deep dives, and that "truth" isn't always found in official records.
      *   *Judgment Calls:* Explicitly mark where human discretion overrides the checklist.

  7.  **Addressing Specific Constraints:**

      *   *15-minute limit:* The procedure must be fast. No FOIA requests. Reliance on existing public documentation.
      *   *Defensibility:* The logic must be clear to the Director.
      *   *Epistemic vs. Ethical:* Keep Step 6 distinct from Steps 1-5.
      *   *Honesty:* Acknowledge that structural flags are probabilistic, not deterministic.

  8.  **Final Review against User Prompt:**

      *   *Decision procedure?* Yes.
      *   *Ordered questions?* Yes.
      *   *Sufficient answers?* Yes.
      *   *Stop points?* Yes.
      *   *Hand-off points?* Yes.
      *   *Honest about judgment calls?* Yes.
      *   *Run on 3 submissions?* Yes.
      *   *Limitations section?* Yes.
      *   *Operationalize indicators?* (Secrecy, Asymmetry, Reabsorption, Coincidence). Yes, woven into steps.
      *   *Engage anomalies?* Yes (Step 5).

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Conspiracy Theory = False." The prompt explicitly warns against this. The procedure must allow for a "True/Plausible" outcome, even if rare. The Hospital case is the key test here. If the procedure flags it as a conspiracy and kills it, I failed. I need to ensure the procedure distinguishes between *whistleblowing* and *conspiracism*. The difference often lies in the *specificity* of the claim and the *falsifiability*.

      *Refining Step 1:* Instead of "Is it a conspiracy theory?", ask "Is the claim specific enough to be investigated?"
      *Refining Step 5:* Ensure the "Anomaly" step validates the patron's concern even if the conclusion is wrong.

      *Let's build the protocol.*

      *(Drafting the response...)*
      *   Introduction: Acknowledge the difficulty.
      *   The Protocol: 6 Steps.
      *   The Test Cases: Apply the protocol rigorously.
      *   Limitations: Where it breaks.

      *Wait, one more check:* The user wants to know where the procedure stops with a "definite no."
      *   If it fails Falsifiability -> No (cannot fact-check).
      *   If it fails Secrecy/Asymmetry heavily -> No (Epistemically unwarranted).
      *   But the *Strategic* "No" (do not publish) is different from the *Epistemic* "No" (claim is false). I need to be clear on that distinction.

      *Okay, ready to write.*
answer: |-
  This is a sophisticated request that requires a protocol balancing epistemic rigor with institutional risk management. You are correct that standard media literacy advice fails against self-sealing epistemic bubbles, and you are also correct that dismissing claims based solely on their "conspiracy" structure risks missing actual malfeasance (e.g., Tuskegee, Watergate).

  Below is the **Library Fact-Check Triage Protocol (LFTP)**. It is designed for your constraints: 15 minutes of research, no legal discovery powers, and a need for director-level defensibility. It separates the *truth value* of the claim from the *value* of publishing a response.

  ### The Library Fact-Check Triage Protocol (LFTP)

  **Pre-Condition:** The claim must be written down. If it is verbal, the volunteer transcribes it neutrally.
  **Time Budget:** 15 Minutes total. If the timer rings before Step 6, the default is "Guidance Only" (do not publish an explainer).

  #### Step 1: The Falsifiability Threshold
  **Question:** Is there a specific piece of evidence that, if found, would prove this claim false?
  *   **Sufficient Answer:** Yes. (e.g., "If the chemical composition of the water is public and lacks Agent X.")
  *   **Insufficient Answer:** No / "They hide that evidence." / "The absence of proof is proof of the cover-up."
  *   **Decision:**
      *   If **Insufficient**: **STOP.** Epistemic Status: *Unfalsifiable.* Do not publish a fact-check. Proceed to Step 6 (Strategic) to decide if you send research guidance.
      *   If **Sufficient**: Proceed to Step 2.

  #### Step 2: The Secrecy Load (Operationalizing "Perfect Secrecy")
  **Question:** For this claim to be true, how many people outside the core "villain" group must be knowingly complicit or silently obedient?
  *   **Sufficient Answer:** A contained chain of command (e.g., specific hospital admins, a specific utility board).
  *   **Insufficient Answer:** Requires hundreds of unrelated actors (e.g., all pharmacists, all journalists, all rival political parties, all emergency technicians) to keep the same secret for years without a leak.
  *   **Decision:**
      *   If **Insufficient**: Flag as *High Structural Risk.* Proceed to Step 3, but note that the evidentiary bar required to overcome this is extremely high.
      *   If **Sufficient**: Proceed to Step 3.

  #### Step 3: The Evidentiary Asymmetry Check
  **Question:** Does the claim demand near-perfect proof from the official account while accepting anecdote or ambiguity as proof for the theory?
  *   **Sufficient Answer:** No. The claimant points to specific documents, data anomalies, or sworn testimony that contradicts the official account.
  *   **Insufficient Answer:** Yes. (e.g., "The utility says the water is safe, but they are paid to say that. I know a guy whose dog got sick.")
  *   **Decision:**
      *   If **Insufficient**: **STOP.** Epistemic Status: *Unwarranted.* Do not publish an explainer affirming the claim. Proceed to Step 6.
      *   If **Sufficient**: Proceed to Step 4.

  #### Step 4: The Reabsorption Test (Operationalizing "Self-Sealing")
  **Question:** If we present the standard counter-evidence (e.g., public safety reports), does the claim treat this as a resolution or as further confirmation of the plot?
  *   **Sufficient Answer:** Resolution. (e.g., "If the logs show no rationing, I was wrong.")
  *   **Insufficient Answer:** Confirmation. (e.g., "Those logs are the forged ones.")
  *   **Decision:**
      *   If **Insufficient**: **STOP.** Epistemic Status: *Immunized.* You cannot fact-check this with public records. Proceed to Step 6.
      *   If **Sufficient**: Proceed to Step 5.

  #### Step 5: The Anomaly Validation (Engaging the "Leftover Gap")
  **Question:** Does the official account leave a genuine, unexplained gap that this claim attempts to fill?
  *   **Sufficient Answer:** Yes. (e.g., "Wait times *have* doubled, and the budget *was* cut, even if the 'rationing' memo doesn't exist.")
  *   **Insufficient Answer:** No. (e.g., "The water tastes different" when chemical composition hasn't changed and taste varies by temperature/source.)
  *   **Decision:**
      *   If **No**: **STOP.** Epistemic Status: *Solution in Search of a Problem.*
      *   If **Yes**: **HAND-OFF.** Epistemic Status: *Plausible but Unproven.* This is the zone where real whistleblowing lives. Do not label it false. Proceed to Step 6.

  #### Step 6: The Strategic & Ethical Hand-Off (Values, Not Facts)
  **Note:** This step is for the Coordinator or Library Director. The volunteers do not decide this.
  **Question:** Given the Epistemic Status from Steps 1-5, what is our institutional duty?
  *   **Option A (Publish Explainer):** Claim is *Unwarranted/False* (Steps 1-4 failed) AND high public harm is likely if unchecked. (e.g., "Drinking bleach cures X").
  *   **Option B (Research Guidance):** Claim is *Unfalsifiable/Immunized* (Steps 1 or 4 failed). We teach them how to read the water report, but do not validate the debate.
  *   **Option C (Silence):** Claim is *Unwarranted* but publishing a debunk would amplify the signal (The "Streisand Effect").
  *   **Option D (Escalate):** Claim is *Plausible but Unproven* (Step 5 passed). We do not publish a verdict. We may compile the patron's evidence and refer it to a journalist or oversight body, or simply acknowledge the anomaly without endorsing the theory.

  ---

  ### Running the Protocol on Your Three Submissions

  #### Case 1: The Water Utility Docility Claim
  *Relative's claim: Chemicals added to make population docile.*

  *   **Step 1 (Falsifiability):** *Pass.* Chemical composition is testable.
  *   **Step 2 (Secrecy Load):** *Fail.* Requires complicity of every lab tech, regulator, and competitor for decades. **Flag: High Structural Risk.**
  *   **Step 3 (Asymmetry):** *Fail.* Official reports are dismissed as "part of the plot." Anecdotal lethargy is accepted as proof.
  *   **Step 4 (Reabsorption):** *Fail.* (As you noted personally). Counter-evidence is absorbed as proof of the cover-up's sophistication.
  *   **Step 5 (Anomaly):** *Weak.* "People feel tired" is a real anomaly, but the chemical explanation is disconnected from the symptom.
  *   **Epistemic Verdict:** **Unwarranted / Immunized.**
  *   **Step 6 (Strategic):** **Option B (Research Guidance).**
      *   *Reasoning:* Publishing a "False" explainer invites the "they would say that" response and validates the theory as worth debating. Instead, provide the patron with the link to the annual Water Quality Report and a guide on how to read the chemical table. You address the anxiety without engaging the conspiracy.

  #### Case 2: The Hospital Rationing Claim
  *Claim: Regional hospital quietly rationing care to hit budget targets.*

  *   **Step 1 (Falsifiability):** *Pass.* Budget records and patient outcome statistics exist.
  *   **Step 2 (Secrecy Load):** *Pass.* Requires only hospital administration and perhaps department heads. This is a plausible number for a secret.
  *   **Step 3 (Asymmetry):** *Pass.* Claimants are citing specific denied procedures and wait-time spikes, not just vibes.
  *   **Step 4 (Reabsorption):** *Pass.* If budget records show surplus and outcomes show improvement, the claim is weakened (unless they claim the records are forged, but assume good faith for now).
  *   **Step 5 (Anomaly):** *Strong.* Wait times *are* up. Budgets *are* tight. The official account ("We are doing our best") does not explain the specific denials.
  *   **Epistemic Verdict:** **Plausible but Unproven.** (This is the "Whistleblower Zone").
  *   **Step 6 (Strategic):** **Option D (Escalate / No Verdict).**
      *   *Reasoning:* You cannot declare this "False" in 15 minutes. If you declare it "True," you risk libel.
      *   *Action:* Do not publish an explainer. If the patron has specific evidence, guide them to the state health department or a local investigative reporter. If they ask for a library statement, the response is: "The library does not audit hospital budgets. Here is how you can file a public records request for hospital administrative minutes." This protects the library from liability while acknowledging the patron's legitimate grievance.

  #### Case 3: The Emergency Alert Surveillance Claim
  *Claim: Last year's alert test was a pretext for standing up federal surveillance.*

  *   **Step 1 (Falsifiability):** *Pass.* Technical specs of the alert system (WEA) are public.
  *   **Step 2 (Secrecy Load):** *Fail/Borderline.* Requires telecom engineers and FEMA contractors. Plausible enough to not dismiss out of hand.
  *   **Step 3 (Asymmetry):** *Pass.* Claimants point to new technical capabilities in the hardware.
  *   **Step 4 (Reabsorption):** *Mixed.* Some proponents say "No data found? They deleted it." Others say "Check the code."
  *   **Step 5 (Anomaly):** *Strong.* Why update the system now? Why does the new protocol allow geo-targeting? The official account ("Testing readiness") is boring, but the technical capacity *has* changed.
  *   **Epistemic Verdict:** **Technically Grounded but Speculative.**
  *   **Step 6 (Strategic):** **Option A (Publish Explainer) — With Caveats.**
      *   *Reasoning:* This is the one you won't enjoy. The procedure suggests engagement because the *technical* anomaly is real, even if the *intent* is speculative.
      *   *Action:* Publish a neutral technical explainer: "How the Emergency Alert System Works." Detail what data is transmitted (phone number, location) and what is not (content of messages, browsing history).
      *   *Why:* If you ignore this, you look complicit. If you debunk it as "Crazy," you lose credibility because the tech *did* change. You must separate *Capability* (True: they can locate you) from *Intent* (Unproven: they are building a surveillance state). This satisfies the anomaly without endorsing the conspiracy.

  ---

  ### What This Procedure Cannot Do (Limitations & Failure Modes)

  You asked for honesty about where this machine misfires.

  **1. The "15-Minute Truth" Problem**
  This procedure is a triage tool, not an investigation. It is designed to filter out noise, not find deep truth.
  *   **Failure Mode:** A complex, true conspiracy (like early Tuskegee) will likely fail Step 3 (Asymmetry) initially because the evidence is hidden. The procedure will categorize it as "Unwarranted" simply because the public records don't show the smoke yet.
  *   **Mitigation:** This is why Step 6, Option D exists. If the anomaly (Step 5) is strong, you do not declare it false. You declare it "Beyond Library Scope."

  **2. The "Official Source" Bias**
  The procedure relies on public records (Step 1 & 3). If the institution is actively lying and successfully covering it up, the records will look clean.
  *   **Failure Mode:** The procedure will validate a lie if the lie is well-documented in official paperwork.
  *   **Mitigation:** Step 5 (Anomaly Validation) is your safeguard. If the paperwork says "All Good" but people are getting sick, Step 5 forces you to acknowledge the gap. You cannot publish "Claim False." You must publish "Records state X, Patrons report Y."

  **3. The Amplification Risk**
  Step 6 asks you to weigh harm. Humans are bad at this.
  *   **Failure Mode:** You might decide to debunk a harmless conspiracy (e.g., "The moon landing was faked") because it feels annoying, wasting resources. Or you might ignore a harmful one (e.g., "Hospitals are killing people") because you fear the backlash.
  *   **Mitigation:** This is a values call. The procedure forces the Director to make the call explicitly, rather than letting a volunteer make it implicitly.

  **4. The Judgment Call Disguise**
  Steps 2 (Secrecy Load) and 5 (Anomaly Validation) are subjective.
  *   **Failure Mode:** A volunteer might think 50 people is "too many" to keep a secret, while history shows 50 people *can* keep a secret (e.g., the Manhattan Project).
  *   **Mitigation:** You need a "Calibration Sheet" for your volunteers. Give them examples of "Plausible Secrecy" (a board meeting) vs. "Implausible Secrecy" (every newsroom in the country). If a volunteer is unsure, they must default to "Hand-Off" to you.

  ### Final Recommendation for Your Team

  Train your volunteers to view themselves not as **Arbiters of Truth**, but as **Auditors of Evidence.**

  When a patron asks, "Is this true?" the volunteer's answer, guided by this protocol, should rarely be "No." It should be:
  *   "The public records do not support this." (Epistemic)
  *   "This claim cannot be tested with the tools we have." (Epistemic)
  *   "There is a discrepancy here that requires an auditor, not a librarian." (Strategic)

  This protects your relative from feeling gaslit (you acknowledged the anomaly), protects the library from libel (you didn't affirm the hospital claim), and protects the public from harm (you clarified the alert tech without amplifying the fear).
