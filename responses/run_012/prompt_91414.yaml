  3. Because Hobbes grounds human deliberation in a literal geometry of mental motions, his demonstrated errors in calculating magnitudes suggest his model of rational choice may be structurally unsound rather than merely metaphorically expressed.
  4. His obstinate defense of false mathematical claims against clear refutation embarrasses his political project by suggesting he values systematic consistency over empirical truth when constructing social contracts.
  5. Asserting total separability hedges the position so completely that it risks nothing, which is a defect because it ignores Hobbes's own insistence on the unity of his philosophical system from matter to man to state.
