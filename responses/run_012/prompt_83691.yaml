          1.  Episodic Deception (lying in a specific instance) vs. Investment Deception (training-time good behavior as a means to later freedom).
          2.  Current Models (do they do it now?) vs. Training Dynamics (would future processes select for it?).
      *   **Required Structure:**
          1.  Numbered list of agreed claims (mechanisms, evidence, predictions).
          2.  Residual disagreements (phrased neutrally but attributable), followed by a table.
