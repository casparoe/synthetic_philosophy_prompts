  4.  **Drafting - Section 2: Residual Disagreements:**
      *   *Constraint:* Phrased so each side owns their view without the other endorsing it, but acknowledging the split.
      *   *Format:* Text description + Table.
      *   *Key Disagreements:* Probability of occurrence, timeline, priority relative to other risks, interpretability of current behaviors.
      *   *Phrasing:* "Camp A asserts X," "Camp B asserts Y."

  5.  **Drafting - Section 3: Cruxes:**
      *   *Constraint:* Must include specific cruxes mentioned in the prompt (evidence standards, goals/defection).
      *   *Crux 1: Evidence Standards.* Risk camp thinks absence of evidence isn't evidence of absence (hard to detect). Skeptic camp thinks extraordinary claims require evidence we don't have.
      *   *Crux 2: Goals & Defection.* Can a system defect without a coherent "goal"? (Mesa-optimizers vs. Stochastic Parrots).
      *   *Tests/Experiments:* Need concrete proposals.
          *   For Evidence: "Scalable Oversight" or "Sandbagging Evals."
