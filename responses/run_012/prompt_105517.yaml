  3. Where it breaks. The candidates I see: Hans's cue is in the world and there's a fact of the matter about which cue it is; nobody thinks a network is deceiving us; and there's no analogue of taking the horse away from the questioner when the questioner is the training distribution. Tell me if I'm wrong about those, and whether the missing validation step — Pfungst never induced the error deliberately — is the real analogue of what interpretability is missing.
