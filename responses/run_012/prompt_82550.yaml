answer: |-
  **MEMORANDUM**

  **TO:** Harm Appeals Panel
  **FROM:** Chair
  **DATE:** Wednesday, 10:00 AM
  **SUBJECT:** Consolidated Appeals 24-09 through 24-11: Proposed Opinion and Rule of Decision

  **I. Preliminary Note**

  We are convened to dispose of three appeals that strain the boundaries of our Charter. We are not a court of law, but we are a court of last resort within this ecosystem. The Charter binds us to act on "harm to persons," defined as "a setback to a person's interests." It also binds us to two limitations: we cannot act on offense alone, and under *Vantor*, we cannot adjudicate losses confined to in-world currency or property.

  For the past two weeks, I have debated a colleague on the fundamental ontology of our work. Their position (the "Derivative View") is that virtual harm is only real insofar as it causes measurable physiological or psychological distress in a biological human. On this view, the avatar is irrelevant; we are adjudicating trauma, not code. My position (the "Occupancy View") is that this reduction misses the normative reality of the platform: when a user inhabits an avatar, their "interests" extend into that digital body. To violate the avatar is to violate the person, not because of the distress it causes, but because it displaces their agency within the space they occupy.

  This memo adopts a rule that synthesizes these views. It concedes to the Derivative View that there must be a human nexus—code cannot suffer, and we have no jurisdiction over damage to empty servers. However, it rejects the requirement that harm be proven via medicalized distress. Instead, it adopts a modified Occupancy View: harm occurs when an action objectively undermines a person's capacity to occupy their digital presence or control their digital identity. This commits us to my ordering of the pending cases (based on perspectival occupation) rather than my colleague's (based on provable distress).

  We must admit a stipulation: The Charter does not define "person" in a VR context. We are defining it now. We are stipulating that "person" includes the human-agent composite when the human is actively inhabiting the agent, and extends to the human's likeness even when they are absent, provided the likeness is identifiable and used without consent.

  **II. The General Rule: The Embodied Interest Standard**

  Effective immediately, the Panel shall apply the **Embodied Interest Standard** to determine whether a "setback to a person's interests" has occurred.

  1.  **Human Nexus:** There is no harm to a "person" without a connection to a living human being. Purely asset-based losses remain governed by *Vantor* and the Terms of Service.
  2.  **Occupancy vs. Distress:** We do not require proof of subjective emotional distress (e.g., medical testimony, logs of anxiety). Instead, we assess whether the appellant's **agency or identity was usurped**. If a reasonable person in the appellant's position would find their capacity to inhabit the platform or control their representation fundamentally compromised, a setback to interests exists.
  3.  **The *Vantor* Exception:** Losses of in-world property are contractual *unless* the destruction of the property was the mechanism for a dignitary attack (e.g., desecration of a memorial vs. demolition of a commercial build). In the latter case, the harm is to the person's dignity, not their wallet.

  **III. Application to Consolidated Appeals**

  **Case 1: The Haptic Contact (Appeal 24-09)**
  *Facts:* Appellant's avatar was subjected to non-consensual sexual contact via haptic suit. Respondent argues no biological body was touched.
  *Analysis:* Under the Derivative View, this is a close call depending on the intensity of the sensation. Under the Embodied Interest Standard, this is a clear violation. The haptic suit creates a feedback loop where the avatar *is* the locus of bodily autonomy. To touch the avatar without consent is to touch the person, because the person has extended their bodily integrity into that coordinate space. The "interest" setback is the violation of bodily autonomy, regardless of whether the user reports PTSD.
  *Disposition:* **OVERTURN.** The original dismissal is vacated. We find a violation of "harm to persons."
  *Remedy:* Permanent suspension of Respondent. Appellant's account to be flagged for priority safety routing for 90 days.
  *Time Frame:* Immediate.

  **Case 2: The Memorial Garden (Appeal 24-10)**
  *Facts:* Appellant's in-world memorial for a deceased parent was destroyed and streamed by Respondent. *Vantor* suggests this is property damage.
  *Analysis:* This is the hardest case under *Vantor*. If we treat the garden as assets, we must dismiss. But the Appellant's claim is desecration, not depreciation. The interest at stake is not the market value of the textures or land, but the dignitary interest in mourning. The Respondent's act was not economic; it was expressive targeting. By streaming it for entertainment, they converted the Appellant's grief into content. This occupies the Appellant's perspective—they cannot return to that space without the memory of the violation.
  *Disposition:* **OVERTURN.** We find a violation of "harm to persons" distinct from *Vantor* property losses.
  *Remedy:* Restoration of the garden by the Platform (technical team) within 7 days. Respondent permanently banned.
  *Time Frame:* Restoration complete by next Wednesday.

  **Case 3: The Non-User Likeness (Appeal 24-11)**
  *Facts:* Private arena containing photorealistic avatars of real non-users (including a schoolteacher) subjected to violence. Teacher discovered it via students.
  *Analysis:* The Teacher has no account, no property, and was not "present." Under the Derivative View, harm is weak unless she proves severe distress. Under the Occupancy View, her "interest" in her own likeness and reputation has been set back. The Charter says "persons," not "users." If we allow the platform to be a zone where real people can be simulated for violence without recourse, we are facilitating harm to persons originating on our servers. The "occupancy" here is not of an avatar, but of identity. Her identity was occupied by the Builder without consent.
  *Disposition:* **OVERTURN.** We find a violation of "harm to persons."
  *Remedy:* Immediate deletion of the arena and all assets. Respondent permanently banned. Platform to issue a formal apology to the Teacher and confirm deletion to her directly.
  *Time Frame:* Deletion within 24 hours. Apology within 48 hours.

  **IV. Concessions and Limitations**

  I want to be clear where I am conceding ground to the Derivative View. We are not ruling that avatars have rights. We are not ruling that code is sacred. In Case 2, if the garden had been a commercial shop, *Vantor* would control, and we would have dismissed. In Case 3, if the avatars had been generic or unidentifiable, there would be no "person" to harm. We are tethering every decision to a human interest.

  However, I am rejecting the requirement for proof of distress. If we require the Teacher in Case 3 to submit psychological evaluations to prove she was harmed by the simulation of her own murder, we are making the remedy inaccessible to the harm. We are protecting the *right* to be free from the violation, not compensating for the *feeling* of the violation.

  **V. Conclusion**

  This rule orders the cases by the degree to which the human agent's perspective was occupied or usurped.
  1.  **Case 1:** Full bodily occupancy (Haptics).
  2.  **Case 2:** Expressive/Emotional occupancy (Memorial).
  3.  **Case 3:** Identity occupancy (Likeness).

  This ordering prioritizes the integrity of the person's digital extension over the measurable physiological fallout. It acknowledges that in this medium, to violate the representation is often to violate the represented.

  Please review this draft before Thursday's sitting. I expect we will need to refine the language around *Vantor* in Case 2, but the direction must hold. If we retreat to the Derivative View, we render the Panel a trauma clinic rather than a justice body. If we go too far toward pure avatar rights, we exceed our Charter. The Embodied Interest Standard is the narrow path between them.

  **Chair**
