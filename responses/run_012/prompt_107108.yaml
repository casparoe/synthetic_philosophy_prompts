answer: |-
  ### The claim in one paragraph

  The contrast between Dutch directness and Japanese indirectness is not a divergence in valuing honesty or politeness, but in the allocation of *interpretive burden* and *epistemic standing*. In high-burden communities, the hearer absorbs the risk of inference; in low-burden ones, the speaker bears the risk of explicitness. Consequently, the wrongness of a white lie is not primarily representational failure but normative exclusion: it denies the hearer the standing to demand belief. Because standing is fixed by convention, the moral status of an utterance depends on whether it respects the community's assigned burden. Identical sentences can constitute deception in one context and courtesy in another.

  ### Objections, in the order they will come

  **1. "Isn't 'interpretive burden' just a redescription of local calibration of the Gricean Maxim of Quantity?" (Senior Pragmaticist)**
  *Reply:* Gricean calibration explains how meaning is recovered efficiently; it does not explain who owns the *risk* of failure. My account posits different normative goals regarding epistemic authority, not just different efficiency settings. Calibration assumes a universal goal of information transfer; I argue the goal itself shifts between speaker-responsibility and hearer-responsibility.
  *Weakness:* It is difficult to prove "risk ownership" isn't just a pragmatic effect of the same universal maxims.

  **2. "How do you measure burden without just asking people how polite they feel?" (Grad Student 1)**
  *Reply:* We look at repair mechanisms. When misunderstanding occurs, who apologizes? In low-burden settings, the speaker apologizes for unclearness; in high-burden settings, the hearer apologizes for missing the hint. This behavioral marker is observable without relying on self-reported politeness.
  *Weakness:* Repair mechanisms are also culturally coded and may not map cleanly onto burden.

  **3. "What counts as counter-evidence? Is this proposal unfalsifiable?" (Grad Student 2)**
  *Reply:* If we find a community where the speaker bears explicitness risk *and* the hearer bears inference risk simultaneously without conflict, the binary fails. Or if white lies are treated as moral virtues in low-burden communities without loss of standing.
  *Weakness:* Defining "conflict" or "loss of standing" independently of the theory is challenging.

  **4. "Doesn't this make lying permissible whenever the convention says the hearer lacks standing?" (Kantian)**
  *Reply:* No. I argue standing is a human capacity, while conventions manage *expression*. Violating standing is always wrong, even if conventions obscure it. Conventions cannot legitimize false assertion without destroying the possibility of communication itself.
  *Weakness:* This tensions with my claim that standing is "fixed by convention."

  **5. "If standing is conventional, how can you criticize a culture that normalizes deception?" (Kantian)**
  *Reply:* I distinguish *conversational* standing (conventional) from *moral* standing (universal). A culture may normalize deceptive conventions, but that does not abolish the underlying moral standing required for trust. My account allows internal critique of conventions that violate universal standing.
  *Weakness:* Requires a meta-ethical justification for universal standing I haven't fully developed.

  **6. "Doesn't this miss the phenomenology of betrayal? Trust is about character, not conversational rights." (Virtue Ethicist)**
  *Reply:* Trust *is* the expectation that standing will be honored. Betrayal feels core because it is a status demotion, not just information loss. My account explains the sting of betrayal as a denial of one's status as an epistemic agent.
  *Weakness:* Might reduce rich virtue talk to dry deontic standing.

  **7. "Are you implicitly ranking directness as morally superior by calling indirectness a 'burden' shift?" (Linguistic Anthropologist)**
  *Reply:* 'Burden' is technical, not pejorative. Both systems protect face and social harmony; neither is morally superior, just structurally different. The 'burden' is simply the locus of labor, not a negative weight.
  *Weakness:* 'Burden' sounds negative in English regardless of technical definition.

  **8. "You're deriving an 'ought' from a conversational 'is'. How does burden generate duty?" (Senior Pragmaticist)**
  *Reply:* Conversational contracts are normative by definition. To speak is to accept the rules of the game. If the rule is "speaker bears risk," violating that rule is a normative failure within the practice of communication.
  *Weakness:* Hume's Guillotine remains sharp; institutional norms don't automatically generate moral duties.

  ### Concessions to make up front

  *   **The Binary is Heuristic:** The Dutch/Japanese contrast is a model, not an absolute description of every individual in those cultures.
  *   **Gricean Compatibility:** I am not rejecting Gricean mechanisms, only claiming they are insufficient to explain the normative distribution of risk.
  *   **Meta-ethical Gap:** I do not yet have a full account of *why* standing generates moral duty, only that it does within communicative practices.
  *   **Convention Limits:** While standing is managed by convention, I concede there must be a universal floor below which convention cannot go without destroying communication.

  ### The question I am hoping nobody asks

  **"If standing is fixed by convention, how can a conventionally permitted white lie deny standing? You seem to want standing to be both conventional and universal."**

  *Why I dread it:* This strikes at the internal coherence of the thesis. If convention fixes standing, and a convention permits white lies, then standing is not denied. If standing is denied, convention did not fix it. It exposes the tension between my descriptive claim (conventions vary) and my normative claim (white lies are wrong).

  *Least-bad answer:* I must distinguish *procedural* standing (conventional rules of engagement) from *moral* standing (the capacity to be a truth-demanding agent). Conventions manage the procedure, but cannot abolish the moral capacity. A white lie violates the moral standing even if it adheres to the procedural convention, which is why it remains a wrong despite local permission.
