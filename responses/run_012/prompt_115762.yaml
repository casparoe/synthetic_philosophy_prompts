prompt: |-
  I chair the governance committee of a mid-sized research foundation, and after a year of internal argument we have agreed to trial futarchy — the idea that we should settle our values by voting but estimate the consequences of a proposal by betting on them — for our major allocation decisions. We make roughly a dozen binary decisions a year (fund this program or not; adopt this procurement rule or not; continue this grant or end it), each committing a significant share of the budget, and the committee is split between members who trust expert judgment and members who trust markets. We meet monthly, decide within two weeks, have no economist on staff, and every decision needs the board's sign-off. I need something better than a slogan: a decision procedure the committee can actually run, written for people who are not economists.

  Give me that procedure. It should set out the steps in order, say what counts as a sufficient answer at each step, mark where the procedure terminates in a decision, and mark where it must hand the matter back to a person because the question is one of values rather than prediction. The procedure has to do the conceptual work the slogan hides. At a minimum it should force us to settle, in the right order: what welfare metric the market is supposed to forecast, and who is authorized to choose it; whether the relevant markets are genuinely conditional — paying out on the outcome given the policy, not on the policy's chances — or have quietly collapsed into an ordinary prediction market; how the two branches of the comparison are priced and how the difference between them is read; what threshold of expected gain is required to overturn the status quo, and why that threshold is a values choice the market cannot make for us; how resolution and the measurement of the metric are verified; and what to do when the market is thin, when its price reflects the capital and risk-appetite of the traders rather than their beliefs, or when the estimated difference falls inside the noise.

  Handle these hard cases explicitly, and say what the procedure does with each: a proposal whose benefits fall on people outside the metric; a proposal that is popular for reasons the metric does not capture; a metric that the market's own verdict could move, so that the forecast becomes self-fulfilling; and a proposal whose outcome will not be observable for years. Then run the procedure on two or three worked examples — including at least one where it returns an answer I will not like, and say so — and close by stating plainly what the procedure cannot do and which decisions it cannot be trusted with.

  Write it as a procedure, not an essay, with the hard cases and the points where judgment cannot be eliminated marked as such. Where a step is a judgment call dressed up as a rule, say so. And separate what is settled from what is genuinely contested among people who know this material: do not present a contested claim — about whether markets beat experts, about whether manipulation is fatal, about whether a metric can be chosen without smuggling in values — as though it were the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Chair of a governance committee at a mid-sized research foundation.
      *   **Context:** Internal argument resolved by trialing *futarchy* (vote on values, bet on beliefs) for major allocation decisions.
      *   **Constraints:** ~12 binary decisions/year, significant budget share, monthly meetings, 2-week decision window, no economist on staff, board sign-off required.
      *   **Goal:** A concrete, actionable decision procedure (not an essay/slogan) for non-economists.
      *   **Key Requirements:**
          *   Orderly steps.
          *   Define "sufficient answer" at each step.
          *   Mark termination points (decision made) vs. hand-offs (values judgment).
          *   Address specific conceptual hurdles: welfare metric selection/authorization, conditional vs. ordinary markets, pricing branches, threshold for overturning status quo (values choice), resolution/verification, thin markets/noise.
          *   Handle hard cases: externalities, popularity vs. metric, self-fulfilling forecasts, long time horizons.
          *   Provide worked examples (including an unpopular answer).
          *   State limitations plainly.
          *   Tone: Procedural, honest about judgment calls, distinguishing consensus from contestation.

  2.  **Deconstruct Futarchy for this Context:**
      *   *Core Mechanism:* Compare $E[M | \text{Pass}]$ vs. $E[M | \text{Fail}]$, where $M$ is the welfare metric.
      *   *The "Vote on Values" part:* The committee/board must define $M$. The market cannot do this.
      *   *The "Bet on Beliefs" part:* Traders bet on the outcome of $M$ conditional on the decision.
      *   *The Problem:* Real-world futarchy is theoretically elegant but practically fraught (conditional markets are hard to liquidity, metric gaming, time horizons).
      *   *The Constraint:* 2-week decision window. This is very tight for a market to form, trade, and resolve uncertainty. A full-blown prediction market might not converge in 10 business days. The procedure needs to acknowledge this friction.

  3.  **Drafting the Procedure - Step-by-Step:**

      *   *Phase 1: Values & Metric (The "Vote" part).* This must happen *before* the market opens. Who chooses $M$? The Committee + Board.
      *   *Phase 2: Market Design (The "Bet" part).* How do we structure the conditional? This is the hardest technical part. We need two markets: "Pass" and "Fail".
      *   *Phase 3: Trading & Pricing.* Duration, liquidity requirements.
      *   *Phase 4: Decision Rule.* When does the market override the committee's intuition? We need a threshold (hurdle rate).
      *   *Phase 5: Resolution.* How do we measure $M$ later?
      *   *Phase 6: Exceptions/Hard Cases.* What if the market breaks?

  4.  **Addressing Specific Prompts:**
      *   *Metric Selection:* Must be explicit that this is a values choice.
      *   *Conditional Markets:* Need to explain the difference between $P(\text{Outcome} | \text{Policy})$ and $P(\text{Policy} \land \text{Outcome})$.
      *   *Threshold:* Why is a 51% chance not enough? (Risk aversion, status quo bias).
      *   *Thin Markets:* What if only two people trade?
      *   *Hard Cases:* Externalities, self-fulfilling, long-term.

  5.  **Refining the Tone:**
      *   Avoid academic jargon where possible.
      *   Be blunt about where human judgment is unavoidable.
      *   Acknowledge that futarchy is experimental and contested.

  6.  **Developing Worked Examples:**
      *   *Example 1 (Standard):* Funding a specific research program. Metric: Citations? No, too gameable. Metric: Follow-on funding? Better.
      *   *Example 2 (The "Unpopular" Answer):* A popular social program that the market thinks is ineffective based on the metric.
      *   *Example 3 (Hard Case):* Long-term infrastructure or policy change where resolution is >5 years.

  7.  **Identifying Limitations:**
      *   Cannot handle existential risk well.
      *   Cannot handle metrics that are easily manipulated in the short term.
      *   Cannot replace ethical judgment.

  8.  **Drafting - Section by Section (Mental or Scratchpad):**

      *   *Header:* Formal Procedure Document.
      *   *Section 1: Metric Definition.* (Values).
      *   *Section 2: Market Setup.* (Conditionals).
      *   *Section 3: Trading Window.* (Liquidity).
      *   *Section 4: Decision Logic.* (Thresholds).
      *   *Section 5: Resolution.* (Verification).
      *   *Section 6: Exception Handling.* (The hard cases).
      *   *Section 7: Examples.*
      *   *Section 8: Limitations.*

      *(Self-Correction during drafting)*: Wait, the prompt asks for a 2-week decision window. Real prediction markets take time to liquidity. I need to specify that the market runs *alongside* the committee review, or that we use a subsidized market maker to ensure liquidity quickly. I will specify a "Subsidized Liquidity Provider" step to ensure prices form in 10 days.
      *(Self-Correction on Conditionals)*: True conditional markets are rare. Most "futarchy" implementations use two separate markets: "Shares of M if Pass" and "Shares of M if Fail". I need to make sure the procedure distinguishes this from betting on whether the policy *passes*.
      *(Self-Correction on Threshold)*: The prompt asks about the threshold for overturning status quo. This is a risk tolerance question. I need to make sure the procedure states that the Committee sets this, not the market.

  9.  **Final Review against Constraints:**
      *   Did I mark where judgment is required? Yes.
      *   Did I handle the "values vs. prediction" split? Yes.
      *   Did I include the hard cases (externalities, self-fulfilling, etc.)? Yes.
      *   Is it written as a procedure? Yes.
      *   Did I include an unpopular answer example? Yes.
      *   Did I avoid presenting contested claims as consensus? Yes (added a preamble on epistemic status).

  10. **Final Polish:** Ensure the language is authoritative but humble about the experimental nature. (Proceed to generate output).

  *(Post-Drafting Check)*: I need to make sure I explicitly answer the "conditional vs ordinary market" point. The procedure must require two distinct markets that only resolve if the specific branch is taken. If the "Fail" branch is taken, the "Pass" market is voided/refunded. This is crucial for futarchy.

  Also, the "unpopular answer" example needs to be stark. Maybe a grant that feels morally right but the market predicts low impact on the specific metric.

  Let's assemble the document.cw
answer: |-
  # FOUNDATION GOVERNANCE COMMITTEE
  ## INTERIM PROCEDURE FOR FUTARCHIC ALLOCATION (VERSION 1.0)

  **Effective Date:** Immediate (Trial Period: 12 Months)  
  **Authority:** Governance Committee, subject to Board Ratification  
  **Scope:** Binary allocation decisions >5% of annual budget.

  ---

  ### PREAMBLE: EPISTEMIC STATUS AND LIMITS
  This procedure operationalizes *futarchy* (governance by prediction market). It rests on two claims that are **contested** among economists and governance theorists:
  1.  **Aggregation:** Markets aggregate dispersed information better than committees. (Contested: Markets can be manipulated or driven by noise.)
  2.  **Conditionality:** Markets can accurately price outcomes *conditional* on a policy being enacted, distinct from the probability of the policy being enacted. (Contested: True conditional liquidity is historically thin.)

  This procedure does not resolve these debates. It assumes them for the sake of the trial. Where the procedure requires a judgment call, it is marked **[JUDGMENT]**. Where a step hands authority back to humans because the question is ethical rather than empirical, it is marked **[VALUES]**.

  ---

  ### PHASE 1: METRIC DEFINITION (VALUES)
  *Timeframe: Week 1, Days 1-3*

  **Step 1.1: Propose the Welfare Metric ($M$)**
  The Committee proposes a single quantitative metric $M$ that represents the "success" of the decision.
  *   **Requirement:** $M$ must be verifiable by a third party within 24 months of the decision.
  *   **Constraint:** $M$ cannot be the decision itself (e.g., "We funded the project" is not a metric).
  *   **[VALUES] Hand-off:** The Committee must vote to approve $M$. The market cannot choose $M$. If the Committee cannot agree on $M$, the futarchy process terminates, and the decision reverts to standard voting.
  *   **Sufficient Answer:** A written definition of $M$ including data source, formula, and audit method.

  **Step 1.2: Set the Decision Threshold ($T$)**
  The Committee sets the minimum expected improvement in $M$ required to adopt the proposal.
  *   **Requirement:** $T$ is expressed as a percentage increase (e.g., "The 'Pass' market must price $M$ at least 10% higher than the 'Fail' market").
  *   **[JUDGMENT]:** This threshold reflects risk tolerance, not market truth. A 1% expected gain may be statistically significant but ethically insufficient given the risk of failure. The Committee sets $T$ based on the stakes, not the market's suggestion.
  *   **Sufficient Answer:** A fixed percentage $T$ recorded in the meeting minutes.

  ---

  ### PHASE 2: MARKET CONSTRUCTION (PREDICTION)
  *Timeframe: Week 1, Days 4-5*

  **Step 2.1: Structure Conditional Markets**
  Two distinct markets are opened. Neither bets on *whether* the proposal passes. Both bet on the value of $M$.
  *   **Market A (Pass):** Pays out \$1.00 $\times$ the realized value of $M$ **IF** the proposal is adopted. If the proposal is rejected, this market is voided (traders refunded).
  *   **Market B (Fail):** Pays out \$1.00 $\times$ the realized value of $M$ **IF** the proposal is rejected. If the proposal is adopted, this market is voided (traders refunded).
  *   **Critical Control:** To ensure these are conditional markets and not ordinary prediction markets, the contract must explicitly state that payout depends on the *conjunction* of (Policy State $\land$ Metric Outcome).
  *   **[JUDGMENT]:** The Committee must appoint a Market Administrator (external vendor or staff) to enforce the voiding/refunding rule. If the Market Administrator cannot guarantee this separation, the process terminates.

  **Step 2.2: Liquidity Subsidy**
  Because the trading window is short (5 business days), natural liquidity will be insufficient.
  *   **Requirement:** The Foundation provides a subsidy pool (e.g., \$50,000) to act as a market maker, offering to buy/sell shares at widening spreads to encourage price discovery.
  *   **Sufficient Answer:** Confirmation that the subsidy pool is active and spreads are within acceptable bounds (e.g., bid-ask spread < 5% of price).

  ---

  ### PHASE 3: TRADING AND PRICING
  *Timeframe: Week 2, Days 1-5*

  **Step 3.1: Trading Window**
  Markets open for 5 business days.
  *   **Constraint:** No trading by Committee members or Board members (insider trading prohibition).
  *   **Sufficient Answer:** Closing prices for Market A ($P_{pass}$) and Market B ($P_{fail}$) at T+5 days, 4:00 PM EST.

  **Step 3.2: Check for Market Failure**
  Before calculating the decision, check for structural failure.
  *   **Thin Market Check:** If total volume < \$10,000 OR if the bid-ask spread at close > 15%, the market is deemed "Thin."
  *   **Noise Check:** If $|P_{pass} - P_{fail}| < T$ (the threshold set in Step 1.2), the signal is within the noise.
  *   **Action:** If either condition is met, the market result is **Invalid**. The decision reverts to Committee Vote.
  *   **[JUDGMENT]:** The volume threshold is arbitrary but necessary. It acknowledges that prices reflect capital availability, not just belief.

  ---

  ### PHASE 4: DECISION LOGIC
  *Timeframe: Week 2, Day 5 (End of Meeting)*

  **Step 4.1: Calculate Expected Differential**
  Calculate $\Delta = P_{pass} - P_{fail}$.
  *   This represents the market's estimate of the *causal* impact of the proposal on metric $M$.

  **Step 4.2: Apply Threshold**
  *   **If $\Delta \geq T$:** Recommendation is **ADOPT**.
  *   **If $\Delta < T$:** Recommendation is **REJECT**.
  *   **[VALUES] Hand-off:** This recommendation is binding on the Committee *unless* the Committee invokes the "Ethical Veto" (Step 4.3).

  **Step 4.3: Ethical Veto (Safety Valve)**
  The Committee may override the market recommendation only if:
  1.  The outcome violates a specific, pre-existing Foundation ethical constraint (e.g., human rights, legal compliance).
  2.  The Committee votes unanimously (100%) to override.
  *   **Requirement:** A public written statement explaining why the metric $M$ failed to capture the ethical violation.
  *   **Constraint:** The Veto cannot be used simply because the Committee dislikes the market's answer. It is for *values* conflicts, not *prediction* disputes.

  **Step 4.4: Board Sign-Off**
  The Recommendation (and any Ethical Veto statement) is sent to the Board.
  *   **Requirement:** Board must ratify the process integrity (did we follow the steps?), not the decision itself.
  *   **Sufficient Answer:** Board Resolution recording the decision.

  ---

  ### PHASE 5: RESOLUTION AND AUDIT
  *Timeframe: Post-Decision (12-24 Months)*

  **Step 5.1: Metric Realization**
  Once the time horizon for $M$ expires, an independent auditor measures the realized value of $M$.
  *   **Action:** Markets are settled based on the audited value.

  **Step 5.2: Process Review**
  The Governance Committee compares the market prediction ($P_{pass}$ or $P_{fail}$) against the realized $M$.
  *   **Requirement:** If the market error exceeds 50% in two consecutive decisions, the futarchy trial is suspended for review.

  ---

  ### PROTOCOL FOR HARD CASES
  *These scenarios override standard flow.*

  **Case A: Externalities (Benefits outside $M$)**
  *   **Scenario:** A proposal benefits a group not captured by $M$ (e.g., public goodwill, staff morale).
  *   **Procedure:** The Committee must quantify the externality as a "Shadow Credit" *before* markets open. This credit is added to the Market Price manually by the Administrator.
  *   **[JUDGMENT]:** This re-introduces human judgment. It is unavoidable. If the externality cannot be quantified, the proposal is ineligible for futarchy and reverts to voting.

  **Case B: Self-Fulfilling Forecasts**
  *   **Scenario:** The market price itself influences the outcome (e.g., if the market predicts a grant will fail, partners withdraw support, causing it to fail).
  *   **Procedure:** Markets are **Blind**. Prices are not published until after the decision is locked. Only the final $\Delta$ is revealed to the Committee.
  *   **Constraint:** If the metric $M$ is inherently sensitive to public confidence (e.g., "Stock Price" or "Donation Volume"), the proposal is ineligible for futarchy.

  **Case C: Long Time Horizons**
  *   **Scenario:** The outcome of $M$ will not be observable for >5 years.
  *   **Procedure:** Use a **Proxy Metric**. Define a short-term indicator $M'$ that correlates with long-term $M$.
  *   **[JUDGMENT]:** The Committee must validate the correlation between $M'$ and $M$. This is a scientific judgment, not a market one. If the correlation is disputed, revert to voting.

  **Case D: Popularity vs. Metric**
  *   **Scenario:** A proposal is highly popular with stakeholders but the market predicts low $M$.
  *   **Procedure:** The market decision stands. Popularity is a value preference; $M$ is the operationalized value. If stakeholders believe popularity matters, $M$ should have included a "Stakeholder Satisfaction" component in Step 1.1.
  *   **Constraint:** Do not adjust the market result post-hoc.

  ---

  ### WORKED EXAMPLES

  #### Example 1: The "Unpopular" Answer (Research Grant)
  *   **Proposal:** Fund a high-risk theoretical physics grant (\$2M).
  *   **Metric ($M$):** Number of peer-reviewed citations within 3 years (normalized).
  *   **Threshold ($T$):** 15% increase over status quo.
  *   **Market Result:**
      *   $P_{pass}$ implies 50 citations.
      *   $P_{fail}$ implies 60 citations (Market believes the money is better spent on existing equipment).
      *   $\Delta = -10$ citations.
  *   **Decision:** **REJECT**.
  *   **Committee Reaction:** The Committee loves the physics. They feel the metric is too short-term.
  *   **Procedure Action:** The Committee *must* reject the grant unless they invoke the Ethical Veto. If they veto, they must publish a statement: "We value theoretical exploration over citation count." This exposes the values conflict.
  *   **Note:** This is the intended function. It forces the Committee to admit they are prioritizing values over the stated metric.

  #### Example 2: The Thin Market (Procurement Rule)
  *   **Proposal:** Switch to a new vendor management system.
  *   **Metric ($M$):** Cost savings in Year 1.
  *   **Market Result:** Volume is \$2,000 (below \$10,000 threshold). Spread is 20%.
  *   **Procedure Action:** Market declared **Invalid**.
  *   **Reason:** Traders do not care enough about procurement rules to capitalize the market.
  *   **Decision:** Reverts to Committee Vote. Futarchy is not suitable for low-salience operational decisions.

  #### Example 3: The Self-Fulfilling Risk (Partnership)
  *   **Proposal:** Announce a partnership with a controversial tech firm.
  *   **Metric ($M$):** Total donation revenue next fiscal year.
  *   **Risk:** If the market prices revenue low, current donors might panic and withdraw, causing the low revenue.
  *   **Procedure Action:** **Blind Market** protocol activated. Prices hidden.
  *   **Eligibility Check:** Because $M$ (Donations) is sensitive to confidence, the Committee decides this metric is too fragile for futarchy.
  *   **Decision:** Reverts to Committee Vote. Futarchy is unsafe for metrics vulnerable to performative collapse.

  ---

  ### STATEMENT OF LIMITATIONS
  *This procedure cannot be trusted with the following:*

  1.  **Existential or Irreversible Risks:** If a decision could bankrupt the Foundation or cause irreversible reputational harm, futarchy is prohibited. The market cannot price "ruin."
  2.  **Metric Gaming:** If the metric $M$ can be manipulated by the grantee (e.g., "Number of reports filed"), the market will price the manipulation, not the value. The Committee is responsible for metric robustness; the market is not.
  3.  **Values Smuggling:** Choosing $M$ is a values choice. This procedure does not eliminate politics; it moves the political fight from "Should we do X?" to "Should $M$ be Citations or Policy Impact?" Do not pretend this is neutral.
  4.  **Capital Constraints:** The market price reflects the beliefs of people *with money to bet*. If your expert stakeholders have no capital, their information may not be reflected. The Liquidity Subsidy (Step 2.2) mitigates but does not solve this.

  **Certification:**
  I, the Chair, acknowledge that this procedure experimental. It may produce decisions the Committee regrets. This regret is data, not failure, provided the procedure was followed.

  _________________________
  **Chair, Governance Committee**
  **Date:** _________________
