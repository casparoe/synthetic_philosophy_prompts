answer: |-
  You have not got Jaspers wrong. In fact, you have put your finger on the exact friction point that makes *The Question of German Guilt* (1947) a philosophical text rather than just a political pamphlet.

  Your intuition is correct: if we define "guilt" strictly as *moral culpability requiring agency*, then "political guilt" is a category error. However, Jaspers is relying on a conceptual architecture that predates the modern Anglophone hardening of the word "guilt."

  Here is the conceptual layout you are asking for, stripping away the summary to look at the machinery underneath.

  ### 1. The Translation Trap: *Schuld* vs. Guilt
  The first conceptual issue is linguistic. Jaspers is writing in German about *Schuld*.
  *   **Guilt:** In English, this is heavily weighted toward internal moral culpability (sin, blame, fault).
  *   **Debt/Liability:** *Schuld* also means "debt" (as in *Schulden*).

  When Jaspers speaks of **Political Guilt**, he is much closer to **Political Liability** or **Civic Debt**. He is not saying your soul is stained; he is saying your citizenship carries a bill.

  So, to answer your first question: *What is the word 'guilt' doing there?*
  It is acting as a bridge concept. Jaspers needs a word that binds the individual to the collective without collapsing the distinction. He uses "Guilt" to signal that this is a serious existential burden, but he defines it operationally as **vicarious liability**.

  If you are a citizen, you are a beneficiary of the state's order. When that order commits crimes, the "bill" for the damage comes to the state. Since the state is constituted by its citizens, the citizens are liable for the restitution, regardless of their personal moral innocence. You are not guilty of the *murder*; you are liable for the *damages*.

  ### 2. Does the Four-Fold List Hold?
  You ask if the list becomes "three kinds of guilt plus one kind of inherited liability."
  Conceptually, **yes**. But philosophically, Jaspers would argue that "Accountability" is the genus, and "Guilt" is the species name he applies to all four for rhetorical force.

  For the list to work as a coherent system, you must accept that **responsibility is layered**:
  1.  **Criminal:** Did you break the code? (Individual)
  2.  **Political:** Do you belong to the entity that broke the code? (Collective/Institutional)
  3.  **Moral:** Did you compromise your own integrity? (Individual/Conscience)
  4.  **Metaphysical:** Did you fail in your solidarity with humanity? (Universal)

  The system only breaks if you insist that "Guilt" *must* imply "Moral Blame." Jaspers' entire project is to prevent that equation. He wants to say: "You can be politically liable (pay reparations, lose voting rights) without being morally guilty (a monster)." If he doesn't make this split, then either all Germans are Nazis (moral guilt) or none are responsible (no guilt). Political guilt is the middle path that allows for reconstruction.

  ### 3. The Ontology of the Nation: What makes guilt inheritable?
  This is the core of your second question. For political guilt to be inheritable, the **State** must be ontologically distinct from the **People**.

  *   **The Atomistic View:** The state is just a heap of individuals. If the individuals change (die), the heap changes. In this view, inheritable guilt is impossible.
  *   **The Legal-Person View (Jaspers' requirement):** The State is a *continuous legal entity* (a corporation sole). It transcends the biological lifespan of its members.

  For political guilt to pass to the next generation, the **State must survive even if the regime does not.**
  When a child is born in Germany in 1950, they are born into a legal order that is the *successor* to the legal order of 1940. Even if the constitution changes, the international legal personality of "Germany" persists. Therefore, the *debts* of the legal personality persist.

  So, for guilt to be inheritable, the "Nation" must be understood not as a biological race or a moral community, but as a **trans-generational legal structure**. You inherit the guilt not because you share blood with the perpetrators, but because you share membership in the continuing institution that perpetrated the acts.

  **The Condition:** Inheritable political guilt requires that **Citizenship is a form of property.** You inherit the rights of the state (protection, infrastructure, culture), so you inherit the liabilities of the state (debt, reparations, loss of sovereignty). You cannot take the assets and reject the liabilities.

  ### 4. The Edge Case: The Dissolved State
  This is the strongest test of the theory. *The state that did it has dissolved, and successor states repudiate it.*

  **Example:** The Third Reich dissolved. The GDR and FRG emerged. Both repudiated the Nazi regime's legitimacy (e.g., the Basic Law).
  **Where does the guilt go?**

  *   **Moral/Metaphysical Guilt:** Stays with the individuals who were alive and active. It dies with them. It does not transfer.
  *   **Political Guilt:** This depends on **International Recognition of Succession**.
      *   If the international community treats the new state as the *same legal person* (which they did with West Germany), the political liability transfers. The repudiation in the founding documents is a *moral* stance, but it does not automatically erase *political* debt. The Allies demanded reparations from the *German people*, not just the Nazi party.
      *   If the state dissolves and is *not* recognized as a successor (e.g., if Germany had been erased from the map and partitioned into non-German entities), the political guilt would technically have nowhere to land. It would evaporate into the vacuum, likely converted into individual criminal guilt for those who could be caught.

  **Jaspers' Nuance:** Jaspers argues that political guilt is judged by the **victor**. It is not an internal moral truth; it is an external political reality.
  *   If the victor says "The new state is liable," then political guilt exists.
  *   If the victor says "The old state is dead and we claim the assets without the debts," then political guilt vanishes.

  Therefore, in your edge case, the inherited political guilt goes to **the successor state only insofar as it is forced to accept it by the new power structure.** It is not a metaphysical stain; it is a geopolitical fact. If the successor states successfully repudiate the debt and the victors accept it, the political guilt ceases to exist.

  ### Summary of the Conceptual Issue
  You are struggling because you are treating "Guilt" as a **moral property** (like being dirty). Jaspers is treating "Political Guilt" as a **structural relation** (like being a shareholder).

  1.  **Is it misnamed?** Yes, in English. It is "Civic Liability."
  2.  **Does the list work?** Only if you view "Guilt" as "Modes of Accountability."
  3.  **What notion of Nation?** A continuous legal corporation, not a moral community.
  4.  **Inheritance:** You inherit the *debt* of the corporation when you buy the *stock* (citizenship).
  5.  **Dissolved State:** Liability follows legal succession. If legal succession is broken, political guilt evaporates, leaving only criminal guilt for individuals.

  **Verdict on your reading:** You have correctly identified that "Political Guilt" is not "Guilt" in the moral sense. Jaspers knows this. He is using the word *Schuld* to force Germans to accept the *consequences* of their state's actions without requiring them to confess to *sins* they didn't commit. He is trading conceptual purity for political viability.

  If you demand moral precision, the term "Political Guilt" collapses. If you accept it as a pragmatic tool for post-war reconstruction, it holds. The tension you feel is the tension Jaspers intended: it is the discomfort of being held responsible for something you didn't do, simply because you are part of the "We" that must survive the aftermath.
