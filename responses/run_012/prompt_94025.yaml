answer: |-
  You have identified a coherent phenomenon. It is not merely a collection of similar intuitions; it is a specific structural relationship between decision-makers that has been formalized, though the terminology is still settling.

  Here is the breakdown of the name, the family tree, the conditions required, and the ontological status.

  ### 1. The Name

  The specific behavior you described—exchanging favors without causal contact—is called **Acausal Trade**.

  The broader phenomenon of agents coordinating their behavior based on logical correlation rather than causal signaling is **Acausal Coordination**.

  The historical ancestor, which you correctly identified as close but slightly off, is **Superrationality** (coined by Douglas Hofstadter). Superrationality assumes symmetry (identical agents). Acausal Trade generalizes this to asymmetric agents with different utility functions who can still model each other.

  The mechanism that makes it work is called **Logical Correlation** or **Subjunctive Dependence**. This is the "core move": the recognition that your decision and their decision are both outputs of logical processes that may share structure. Therefore, conditioning on your own output gives you information about theirs, not because you caused theirs, but because both are instances of the same (or similar) logical fact.

  ### 2. The Family Tree

  To understand where this fits, you have to look at the decision theories that govern it. There are three main branches:

  *   **Causal Decision Theory (CDT):** This is the standard baseline. It says: "My action cannot physically reach the other agent. Therefore, their action is independent of mine. I should defect." CDT cannot see Acausal Trade. It views the correlation as spurious.
  *   **Evidential Decision Theory (EDT):** This says: "My action is evidence of their action. If I cooperate, it is more likely they cooperated." EDT *does* cooperate in these scenarios, but it is brittle. It cooperates for the wrong reasons (e.g., it might cooperate because "cooperators tend to meet other cooperators" due to some external common cause, leading to errors in Newcomb-like problems).
  *   **Functional/Timeless Decision Theory (FDT/TDT):** This is the home of Acausal Trade. It says: "My decision is the output of an algorithm. If the other agent is running a similar algorithm, or simulating me, then the output of my algorithm is logically correlated with theirs. I should choose the output that yields the best result across all instances of this logical fact."

  **The Core Move:**
  The independent work being done by the "trading" concept is **Comparative Advantage under Logical Correlation**.
  In the identical Prisoner's Dilemma case, you don't need trade; you just need coordination (both Cooperate).
  In the "weirder" case (different utilities), trade adds value. Agent A values X more than Y. Agent B values Y more than X. Even if they are logically correlated, they can maximize the *total* logical output by specializing. A gives up Y (which A cares little about) to help B get Y, in exchange for B giving up X to help A get X. The "trade" element explains why the agents aren't just doing the *same* thing, but are doing *complementary* things.

  ### 3. The Conditions

  You asked specific boundary questions. Here is how the mechanics hold up under stress.

  **Does it need the agents to be similar?**
  It does not require identical utility functions (that's the point of trade), but it **does require similarity in decision architecture.**
  For A to reason that "My choice implies B's choice," A must model B as a reasoner who is also sensitive to logical correlations. If B is a CDT agent (a "causalist"), B will defect regardless of what A does. A, modeling this, will also defect.
  So, it requires **Mutual Transparency of Reasoning**. You don't need to share goals, but you must share the *method* of deciding. A human and an alien can trade acausally only if the human can confidently model the alien as an FDT-like reasoner, and vice versa. If the alien's mind is truly opaque, the logical correlation drops to zero, and the trade collapses.

  **Does it need Proof or is Prediction enough?**
  Proof is the ideal limit (the toy case of identical code), but **high-confidence prediction is sufficient.**
  In the real world, you cannot mathematically prove the source code of a distant agent. You simulate them. If your simulation of them is accurate enough that your confidence in the correlation exceeds the cost/benefit ratio of the trade, you trade.
  If the correlation is 99%, you trade. If the correlation is 10%, you likely defect. The "strength" of the acausal link is a probability weight in the expected utility calculation.

  **Can one side take everything (Free Riding)?**
  In the **Identical Agent** case: No. If they are truly identical, they cannot diverge. If one defects, the other defects. The outcome is (Defect, Defect). You cannot be the sole defector against a copy of yourself.
  In the **Different Agent** case: Yes, defection is possible. If A reasons "I will defect, and B will still cooperate because B is altruistic/committed," A is attempting to exploit the correlation. However, if B is also an FDT agent, B will model A's reasoning. B will see that A is trying to exploit the correlation and will defect in response.
  This leads to a **Bargaining Problem**. Both agents want to agree on *which* equilibrium to select. If they disagree on the terms of the trade (e.g., how much resource to transfer), they may fail to coordinate and end up with nothing. This is not a free-rider problem in the traditional sense; it is a **failure of handshake protocols**.

  ### 4. Ontological Status: Real or Consistency?

  This is the most critical distinction.

  **It is a consistency condition on rational agency, not a physical claim about the world.**

  When proponents say this is "real," they do not mean there is a magical acausal force transmitting resources. They mean that **ignoring logical correlations is a mathematical error in expected utility maximization.**

  *   **The Physics:** Nothing travels between the agents. Spacetime is respected.
  *   **The Logic:** The agents are treating their own decision as a logical variable that appears in multiple places in the universe (once in their own head, once in the other agent's simulation).
  *   **The Claim:** If you want to maximize your utility, you must act *as if* your choice influences the other, because logically, it does constrain the probability space of the other's choice.

  If you refuse to engage in Acausal Trade, you are not "protecting yourself from magic"; you are leaving utility on the table. You are effectively saying, "I refuse to count outcomes where my decision algorithm correlates with others." A rival agent who *does* count those outcomes will outperform you in scenarios where these correlations exist.

  **Summary of the Pattern:**
  1.  **Name:** Acausal Trade (specific exchange), Acausal Coordination (general behavior).
  2.  **Mechanism:** Subjunctive Dependence / Logical Correlation.
  3.  **Requirement:** Mutual modeling of decision procedures (not necessarily utility functions).
  4.  **Status:** A normative requirement for maximizing expected utility, not a descriptive claim about causal physics.

  If you need a single phrase to pin this to your wall: **"Optimization across Logical Correlations."** That is the engine; Acausal Trade is just the vehicle.
