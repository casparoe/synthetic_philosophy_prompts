      *   *Property:* Res in rem. The obligation attaches to the thing or the estate, not the soul.
      *   *Culpability:* Res in personam. The obligation attaches to the moral agent.
      *   *State:* A fictional person (corporation sole) vs. an aggregate of individuals.
      *   *Time:* Statutes of limitation vs. perpetual ownership claims.
      *   *Unjust Enrichment:* Did the heir benefit? (Tracing assets).
      *   *Corrective Justice:* Restoring the status quo ante vs. punishing the wrongdoer.

  3.  **Reconstructing the Implicit Theory:**

      *   *Core Distinction:* **Liability without Culpability.** The system separates *obligation to rectify* from *moral blame*.
      *   *Inheritance:* We inherit *estates* (bundles of rights and duties), not *sins*.
      *   *The State:* The State is a continuous legal entity distinct from its current citizenry. It holds debts perpetually.
      *   *Property:* Property rights are viewed as persistent unless extinguished by specific legal acts. A theft creates a "cloud on title" that persists.
      *   *Criminal Law:* Punishment is personal and retributive/expressive. It dies with the agent.
      *   *Civil Law/Restitution:* Compensation is restorative. It attaches to the harm or the asset.

  4.  **Analyzing the Two Framings:**

      *   *(1) Title Theory:* Focuses on the *asset*. If the asset (wealth generated by slavery) is still in circulation, the claim travels with it. This explains art restitution well. It struggles with slavery because the "asset" (the person) was destroyed/consumed, but the *wealth* derived persists.
      *   *(2) Corporate-Continuity Theory:* Focuses on the *debtor*. The State is the obligor. Citizens are shareholders. This explains sovereign debt and why *taxes* pay for reparations (state liability) without implying individual *guilt*.

