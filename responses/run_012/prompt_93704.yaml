      *   *Opposite View:* "Moral Culpability is Heritable, Financial Debt is Not."
      *   *Consequences:* Children pay for parents' crimes (blood feuds). Sovereign debt resets with every regime change (financial chaos). Art restitution becomes impossible if the current owner isn't the thief.
      *   *Practical Changes:* End of sovereign bond markets. End of statute of limitations on murder. Art stays with current possessors.

  7.  **The Netting Problem:**

      *   *Issue:* Genetic intermingling.
