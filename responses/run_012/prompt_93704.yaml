      *   *Check:* The prompt asks for "philosophically underdetermined." I need to explicitly identify where the practice could go either way without logical contradiction. (e.g., Why pay survivors but not heirs? Both fit the theory).

  10. **Final Polish:** Ensure the voice sounds like a colleague in a seminar, not a chatbot. Use precise terminology (vicarious liability, unjust enrichment, corporation sole, odious debt).

  *(Self-Correction on the Netting Problem)*: I need to be careful not to say the theories *solve* the netting problem, but whether they have the *resources* to address it. Title theory requires tracing. Corporate theory requires citizenship. Neither relies on blood quantum, which is actually a feature, not a bug, of the legal theory.

