      *   *Refinement on Netting:* This is the hardest part. Legal systems usually avoid this by defining classes (e.g., "Japanese Internees") rather than genetic calculus. I need to point out that the *current practice* sidesteps this by limiting standing to survivors or specific classes, avoiding the intergenerational genetic math.

  9.  **Self-Correction/Review during drafting:**
