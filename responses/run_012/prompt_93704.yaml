answer: |-
  This is a profound puzzle that sits at the intersection of jurisprudence, moral philosophy, and political economy. You have identified a disjunction that haunts the literature: the **asymmetry between the heritability of assets/liabilities and the non-heritability of culpability.**

  As a philosopher of law, my first instinct is to tell you that this isn't a bug; it's a feature of liberal legalism. But as a political philosopher, I must admit that the feature functions ideologically to insulate certain structures from critique.

  Let's break this down systematically.

  ### I. Brainstorming the Conceptual Map

  To make sense of the pattern, we need to categorize the types of obligations you've listed. They fall into three distinct buckets in legal theory:

  1.  **In Rem Obligations (Attached to the Thing):** Stolen art, mortgaged property, wealth generated by slavery. These travel with the asset. If you hold the asset, you hold the burden, regardless of how you got it.
  2.  **In Personam Obligations (Attached to the Moral Agent):** Criminal liability, moral guilt. These attach to the will and the conscience. They cannot be transferred because the "will" dies with the body.
  3.  **Corporate/Fictional Obligations (Attached to the Office):** Sovereign debt, state treaties. These attach to the *State* as a legal person (a *corporation sole*), which is distinct from the sum of its citizens.

  **The Pattern:** We allow inheritance in categories (1) and (3), but we block it in category (2).
  **The Tension:** Reparations for historical slavery require bridging (1) and (3) without triggering (2). Critics argue you can't have (1) or (3) without implicitly invoking (2). Defenders argue (1) and (3) are strictly *rectificatory*, not *retributive*.

  ### II. Reconstructing the Implicit Theory

  The practice presupposes a theory of **Liability Without Culpability.**

  This theory rests on three pillars:

  1.  **The Estate Principle:** Upon death, a person ceases to be a moral agent but continues as a legal estate. The estate is a bucket of rights and duties. Heirs step into the bucket. They do not inherit the *sin* of the ancestor; they inherit the *situation* of the ancestor. If the situation includes a debt (mortgage) or a clouded title (stolen art), the heir inherits that burden. This is why the UK could pay slave-owners' heirs (the estate had a valid claim under当时的 law) and why Holocaust heirs can claim art (the estate had a valid title that was never extinguished).
  2.  **The Continuity of the State:** The State is a legal person that does not die. Regimes change, populations shift, but the "Crown" or the "Republic" persists. Therefore, debts contracted by the State in 1830 are debts of the State in 2024. Citizens are not the *owners* of the state's sins, but they are the *beneficiaries* and * guarantors* of its continuity. They pay via taxes not because they are guilty, but because they are shareholders in a corporation that has outstanding liabilities.
  3.  **The Extinction of Punitive Claims:** Retributive justice requires a subject to punish. Since the dead cannot suffer, and the innocent cannot be punished for the guilty, criminal and moral liability terminates at death.

  **What this presupposes about the State:** It presupposes the State is a *trustee* of justice across time. It holds the ring between the dead and the unborn.
  **What this presupposes about Persons:** It presupposes persons are primarily *property-holders* and *citizens*, not just moral agents. Your legal identity is defined by what you hold and where you stand politically, not just by what you have done.

  ### III. Assessing Your Two Framings

  You proposed two framings. Let's test them against the reconstruction.

  **(1) Title Theory (Ongoing Deprivation)**
  *   *The Claim:* Slavery is not a past event but an ongoing theft of wealth/title. The claim travels with the asset.
  *   *Strengths:* This aligns perfectly with the Holocaust art cases. It bypasses the "I didn't own slaves" objection by saying, "You hold the painting (wealth) that was stolen." It treats the wealth generated by slavery as tainted property that never legally cleared title.
  *   *Weaknesses:* It requires **tracing**. In art restitution, we can trace the specific canvas. In slavery reparations, the "asset" is diffuse (general economic growth, infrastructure, family wealth). Legally, once assets are commingled (which happens within one generation), tracing becomes fiction.
  *   *Verdict:* This theory explains the *art* and *mortgage* side of your pattern well, but it struggles to explain *sovereign debt*. Sovereign debt isn't about specific stolen assets; it's about the credit of the state.

  **(2) Corporate-Continuity Theory (State as Legal Person)**
  *   *The Claim:* The State is one person. Liabilities persist. Citizens are shareholders.
  *   *Strengths:* This explains the sovereign debt and the UK slave compensation annuities perfectly. The UK Treasury paid the annuities not because current taxpayers were guilty, but because the *State* borrowed the money and the State persists. It explains why Germany pays Namibia (State-to-State) but refuses legal liability (to avoid admitting *moral* guilt of the current populace).
  *   *Weaknesses:* It creates a "democratic deficit." If I am a shareholder in the State, do I get a vote on the settlement? Usually no. It also struggles to explain why *private* actors (banks, families) aren't similarly liable if the State is the only continuous person.
  *   *Verdict:* This is the dominant theory in international law and sovereign finance. It is the strongest explanation for why *states* pay while *individuals* plead innocence.

  **Synthesis:** The actual practice uses **Corporate-Continuity** for state-level obligations (debt, treaties) and **Title Theory** for private-level obligations (art, estates). Reparations fail when they try to mix the two (asking individuals to pay for state sins, or asking the state to pay for private sins without a statutory basis).

  ### IV. Requirements vs. Fits vs. Underdetermination

  Here is the critical philosophical audit of the practice.

  **1. What the Practice Strictly Requires:**
  *   **The Distinction between Liability and Guilt:** The system *must* maintain that one can owe a debt without having committed a wrong. If liability implied guilt, heirs would be morally tainted by their ancestors' mortgages.
  *   **The Legal Immortality of the State:** For sovereign debt to function, the State *must* be ontologically distinct from its current population.
  *   **The Termination of Punitive Power:** For liberal rights to hold, the state *cannot* claim the right to punish the innocent (heirs) for the crimes of the guilty.

  **2. What the Practice Merely Fits (Contingent):**
  *   **Limiting Reparations to Survivors (Japanese Internment):** The theory *does not require* this. If the State is a continuous person liable for its torts, it should pay the heirs of the internees just as it pays the heirs of bondholders. The limitation to survivors is a political compromise (statutes of limitation, budgetary constraints), not a logical requirement of the Corporate-Continuity theory.
  *   **Refusing Legal Responsibility (Germany/Namibia):** The theory *does not require* Germany to refuse legal responsibility. A State can admit liability without implying the current citizens are murderers. This is a diplomatic shield, not a philosophical necessity.

  **3. Where the Practice is Philosophically Underdetermined:**
  *   **The "Odious Debt" Doctrine:** If the State is a continuous person, why do we sometimes say a new regime *shouldn't* pay the debts of a tyrannical predecessor? Here, the theory cracks. We implicitly admit that the State's continuity is conditional on its legitimacy. This is underdetermined: sometimes debt survives regime change (UK 1830s), sometimes it doesn't (post-apartheid South Africa debates).
  *   **Statutes of Limitation:** Why does a claim for stolen art survive 80 years, but a claim for unpaid labor expire? Both are property claims under Title Theory. The difference is purely statutory, not philosophical. The practice allows for "laches" (delay) in one but not the other without a consistent principle.

  ### V. The Counterfactual: Swapping the Presuppositions

  What if we adopted the opposite view: **"Moral Culpability is Heritable, Financial Debt is Not"**?

  This would be a return to a pre-modern, clan-based or karmic ontology.

  1.  **Reparations Programs:** They would become much easier to justify morally ("You bear the guilt of your fathers") but much harder to administer legally. You would have to prove moral corruption in the heir, not just financial benefit.
  2.  **Art Restitution:** It would collapse. If debt/liability dies with the owner, the current possessor of the painting (if they bought it innocently) has no obligation to return it. The claim dies with the thief.
  3.  **Sovereign Debt:** Global finance would crash. Bonds would become worthless upon the death of the administration that issued them, or upon regime change. No one would lend to states.
  4.  **Criminal Law:** We would see blood feuds. The children of murderers would be legitimate targets of retribution.

  **Concrete Change:** The most striking change would be the **privatization of guilt and the socialization of assets.** Currently, we socialize debt (taxpayers pay state debt) and privatize guilt (only the criminal is guilty). The opposite would mean assets stay private (heirs keep everything free of debt) but guilt is socialized (the family/clan bears the shame/punishment).

  ### VI. The Netting Problem

  Finally, the issue of mixed ancestry. *What does the theory say to the person who descends from both slaveholder and enslaved?*

  **1. Title Theory Resources:**
  *   **Tracing:** Title theory asks: "What specific assets did you inherit?" If you inherited a house bought with slave profits, you owe a lien on that house. If you inherited a claim for unpaid labor, you have a receivable.
  *   **Netting:** In principle, these can be netted. If Estate A owes Estate B, and the same heir inherits both, the debt is extinguished by merger.
  *   **Problem:** This requires granular forensic accounting of history that is impossible. The theory *has* the resources (merger of titles), but the *evidence* is lost.

  **2. Corporate-Continuity Resources:**
  *   **Citizenship over Blood:** This theory sidesteps genetics entirely. It asks: "Are you a citizen/shareholder of the liable State?" and "Are you a member of the injured class defined by the settlement?"
  *   **Netting:** There is no netting. If the State pays reparations to Group X, and you are in Group X, you get paid. If you pay taxes to fund it, you pay. Your genetic makeup is irrelevant.
  *   **Problem:** This feels unsatisfying to those who view reparations as *moral* restitution rather than *political* settlement.

  **Conclusion on Netting:** The legal theories actually handle the netting problem *better* than the moral intuition does. Moral intuition demands a calculus of blood and guilt which leads to absurdities (e.g., "You are 1/4 guilty, so you pay 1/4"). Legal theory treats obligations as attached to **estates** or **citizenship**.
  *   If you inherit the slaveholder's estate, you pay the debt attached to it.
  *   If you inherit the enslaved person's claim, you collect the asset.
  *   If you inherit both, the ledger clears internally.
  *   If you are just a citizen, you pay taxes and receive benefits based on statutory class, not DNA.

  **The TA Takeaway:**
  The pattern you see isn't incoherent; it's the result of running **Property Law** and **Criminal Law** on the same historical facts.
  *   **Property Law** says: Rights and duties pass to heirs. (Supports reparations/debt).
  *   **Criminal Law** says: Guilt dies with the agent. (Blocks reparations).

  The political struggle over reparations is essentially a struggle over **which legal framework applies to slavery.** Was it a tort/property violation (Title Theory)? Or was it a crime against humanity (Criminal Theory)?
  *   If it's Property, the heirs pay/collect.
  *   If it's Crime, the liability dies.

  The current patchwork exists because the State wants the stability of Property Law (for debts and art) but the moral cleanliness of Criminal Law (for its own citizenry's guilt). Reparations claimants are trying to force the State to apply Property Law to *itself* (Corporate Continuity) while applying Criminal Law to the *beneficiaries* (Unjust Enrichment). The friction you feel is the sound of those two gears grinding.
