answer: |-
  # Joint Statement on the Analysis of Dispositions

  **Signatories:**
  *   **The Conditionalist (C):** Holds that disposition ascriptions are exhausted by truths about behavior in circumstances.
  *   **The Anti-reductionist (A):** Holds that dispositions are real, irreducible features that ground behavioral truths.

  ## 1. Agreed Claims

  1.  **Function of Ascription:** We agree that to ascribe a disposition (e.g., brittleness) is to commit to a pattern of behavior under specific stimuli (e.g., striking), serving both predictive and explanatory roles in our discourse about objects.
  2.  **Failure of Simple Analysis:** We agree that the Simple Conditional Analysis (SCA)—"x is disposed to M if S iff x would M if S"—is false. It fails to distinguish between manifestations grounded in the disposition and those produced by extraneous factors or prevented by interfering conditions.
  3.  **Implications of Interference:** We agree that finkish cases (disposition lost on stimulus), masking cases (disposition present but blocked), and mimicking cases (manifestation without disposition) demonstrate that the truth of the counterfactual is neither necessary nor sufficient for the possession of the disposition without further qualification.
  4.  **Criteria for Repair:** We agree that any adequate repair of the conditional analysis must successfully adjudicate the four specific cases outlined below (a–d) without resorting to circular definitions (e.g., defining the "appropriate circumstances" as "those in which the disposition manifests").
  5.  **Ontological Stakes:** We agree that the dispute is not merely terminological. It concerns whether the fundamental ontology of the world includes irreducible modal properties (powers) or whether all modal truths supervene on categorical properties and laws of nature.

  ## 2. Residual Disagreements

  | Disagreement Topic | Conditionalist's Wording | Anti-reductionist's Wording | Verdict & Reasons |
  | :--- | :--- | :--- | :--- |
  | **The Nature of Dispositions** | Dispositions are logical constructs; to say an object has a disposition is just to say certain conditionals regarding its behavior are true. | Dispositions are causal powers; they are real properties inherent in the object that *make* the conditionals true. | **Substantive.** This is not merely a difference in labeling. A commits to truth-makers (powers) existing independently of the conditionals; C commits only to the truth of the conditionals grounded in categorical bases + laws. |
  | **Direction of Explanation** | The object's categorical structure and the laws of nature explain why the conditionals are true; disposition talk is a shorthand for this explanation. | The disposition (power) explains why the object behaves as it does; the categorical structure is merely the vehicle for the power. | **Substantive.** C sees explanation flowing from laws/categorical properties to behavior. A sees explanation flowing from the object's intrinsic nature (power) to behavior. |
  | **Feasibility of Repair** | We can specify the "stimulus conditions" in the antecedent using only non-dispositional, categorical terms (e.g., specific physical forces, temperatures). | Any attempt to specify "stimulus conditions" without failure will inevitably require reference to the disposition itself or its basis, rendering the analysis circular. | **Substantive.** If A is right, C's project is impossible in principle. If C is right, A's ontology is superfluous. |

  ## 3. Cruxes

  **Crux 1: The Circularity of "Normal Conditions"**
  *   **Sub-question:** Can the antecedent of the repairing conditional ("If S were to occur...") be fully specified without implicitly referencing the disposition or its manifestation?
  *   **Shared Evidence:** Case (b) (The Self-Masking Metal). The physical description of the stimulus (striking) is identical in a normal brittle metal and this self-masking metal.
  *   **Predictions:**
      *   **C:** Predicts that a sufficiently detailed microphysical description of the stimulus and environment (excluding the object's disposition) will suffice to make the conditional true.
      *   **A:** Predicts that any such description will fail unless it includes a clause like "and the lattice does not convert," which implicitly references the disposition's basis.

  **Crux 2: The Truthmaker for Probabilistic Conditionals**
  *   **Sub-question:** In stochastic cases, what grounds the truth of a probabilistic conditional (e.g., "If struck, there is a 33% chance of breaking")?
  *   **Shared Evidence:** Case (c) (The Stochastic Substance).
  *   **Predictions:**
      *   **C:** Predicts the truth is grounded in long-run frequencies or laws of nature governing the microstructure, not a property of the individual object at the time.
      *   **A:** Predicts the truth is grounded in a single-case propensity (a real feature) inherent in the specific object at the time of striking.

  ## 4. Analysis of Four Unpublished Cases

  **Case (a): The Finkish Break**
  *   *Scenario:* A pane ceases to be brittle instantly when struck, then breaks a moment later due to a charge released by the impact.
  *   **Possession of Disposition:** **Yes** (at $t_0$, prior to strike).
  *   **Truth of Simple Conditional ("If struck, it would break"):** **True.**
  *   **Accommodation:**
      *   **C:** Must refine the conditional to: "If struck, it would break *in virtue of its structure*." Since the breaking is caused by the charge, not the brittleness, C must argue the simple conditional is misleading. The repair requires excluding "finkish" removal of the basis in the antecedent.
      *   **A:** Holds that the power existed at $t_0$ but was removed before manifestation. The breaking is a *mimic* of the manifestation. The disposition did not explain the breaking, despite the conditional being true.

  **Case (b): The Self-Masking Metal**
  *   *Scenario:* A metal's brittleness consists in a lattice that converts to ductile whenever struck, absorbing the blow.
  *   **Possession of Disposition:** **Yes** (it has the brittle lattice).
  *   **Truth of Simple Conditional ("If struck, it would break"):** **False.**
  *   **Accommodation:**
      *   **C:** Faces a challenge. The object is brittle, but the conditional fails. C must argue the "circumstances" in the antecedent are not "striking" simpliciter, but "striking *without triggering the conversion*." C risks circularity if "conversion" is defined by the loss of brittleness.
      *   **A:** Straightforward. The power (brittleness) is present but *masked* by its own reactive nature. The conditional fails because the manifestation is blocked, not because the power is absent.

  **Case (c): The Stochastic Substance**
  *   *Scenario:* A substance cracks under stress on roughly 1/3 of occasions, determined by stochastic microstructure.
  *   **Possession of Disposition:** **Yes** (probabilistic brittleness).
  *   **Truth of Simple Conditional ("If struck, it would break"):** **False** (deterministic reading); **True** (probabilistic reading).
  *   **Accommodation:**
      *   **C:** Must abandon deterministic conditionals for probabilistic ones ("If struck, there is a 1/3 chance it would break"). This requires a logic of probabilistic counterfactuals.
      *   **A:** Posits a *propensity* as the real feature. The propensity is categorical in the object but manifests statistically. This aligns naturally with the case without needing to adjust the logic of conditionals, only their modality.

  **Case (d): The One-Shot Shatter**
  *   *Scenario:* A substance shatters on the first impact and is unbreakable thereafter (it ceases to exist as a whole).
  *   **Possession of Disposition:** **Yes** (at $t_0$).
  *   **Truth of Simple Conditional ("If struck, it would break"):** **True** (for the first strike).
  *   **Accommodation:**
      *   **C:** Requires time-indexed conditionals: "If struck at $t_0$, it would break." The disposition is not permanent. The analysis must account for the dispositional history of the object.
      *   **A:** Describes this as a *disposable power*. The power is consumed in the manifestation. This fits the ontology of powers as transient causal agents.

  ## 5. Falsification Conditions

  **What the Conditionalist would count against her position:**
  If it is demonstrated that for every proposed "repaired" conditional analysis, the antecedent conditions ("circumstances") can only be specified by implicitly invoking the very disposition being analyzed (e.g., "circumstances in which the object does not lose its brittleness"), then the analysis is circular and fails. If the only non-circular way to fix the conditional is to reference the underlying causal power, C must concede that the power is prior to the conditional.

  **What the Anti-reductionist would count against his position:**
  If a complete categorical description of an object's microstructure and the laws of nature allows for the perfect prediction of all behavioral conditionals without needing to posit "powers" as distinct truth-makers, then A's ontology is redundant. If the "power" adds no predictive or explanatory value over and above the categorical base + laws, A must concede that dispositions are not irreducible features.

  ## 6. Compatibility Assessment

  **Can the positions be re-described as compatible?**
  **No.** While we agree on the practical utility of disposition ascriptions and the failure of the Simple Conditional Analysis, our metaphysical commitments are mutually exclusive. The Conditionalist views the world as categorical properties governed by laws, where modality is a feature of our language or logic. The Anti-reductionist views the world as inherently modal, where powers are fundamental constituents of reality. One side must be mistaken about the fundamental furniture of the world: either powers are real (A) or they are useful fictions/constructs (C). We cannot both be right about the ontology, even if we can agree on the phenomenology.
