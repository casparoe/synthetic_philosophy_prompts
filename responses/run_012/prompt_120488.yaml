      *   *Key Correction 3:* "Common Knowledge" is a very high bar. Knowing what someone believes isn't enough; you need to know that they know that you know... The podcast simplifies this to "each knows," which is technically insufficient but often accepted in casual summary. I should point out the strength of this condition.

