answer: |-
  Here is the battle plan. Your instincts are largely correct, but the sequencing needs to be tighter to prevent the "LessWrong drift" (where people treat concepts as optimization targets rather than conceptual analyses).

  ### 1. The Order of Operations (Dependencies)

  You are right: **Common Knowledge (CK) is useless without the Coordination Problem.** If you define CK first, it's just math. It needs to be the *solution* to a stability problem, not the opening definition.

  Here is the dependency chain you must enforce in the talk. If you break this order, the rationalists in the room will optimize the wrong variable.

  1.  **Recurring Situation:** Conventions aren't one-offs. There must be a history and a future. (Dependency: Nothing else works without iteration).
  2.  **The Coordination Problem (Payoffs):** This is where "Why conform?" lives. You cannot define the problem without the payoff matrix.
      *   *Crucial distinction:* Everyone prefers to conform *if* others conform. (This distinguishes convention from Prisoner's Dilemma or mere norms).
  3.  **Regularity + Arbitrariness:** There is a pattern of behavior, and there *could have been* a different pattern that would have worked just as well.
  4.  **Common Knowledge:** Now you introduce CK. It is the glue that locks the Regularity in place against deviation. It explains *why* I expect you to conform, and why I expect you to expect *me* to conform.
  5.  **Language:** Only now do you map this to meaning. Meaning is just a convention of truth-telling and trust sustained by CK.

  **Correction on "Why Conform":** Do not move this late. It belongs in Step 2. If they don't understand the *incentive* to conform (coordination payoff), they will view the convention as an external constraint (a rule) rather than an internal equilibrium.

  ### 2. The Example

  **Pick: The "Reply-All" vs. "Reply-Sender" Convention.**

  *   **Why:** It fits your demographic (coders/tech). It is digital (like language). It is purely conventional (no physics dictates it). It maps well to the "Language" section of Lewis (signals and information flow).
  *   **The Stipulation:** You must explicitly stipulate: *"Imagine a new company with no employee handbook, no IT rules, and no manager who cares. Just a group of peers trying to coordinate information."*
  *   **Why the others fail:**
      *   *Dropped Call:* Too close to Lewis's own phone example. It triggers "I've heard this" fatigue.
      *   *Bus Seat:* Excellent for spatial convention, but terrible for mapping to *language*. It's hard to argue that sitting next to a stranger is a "truthful signal" in the way Lewis needs for the second half of your session.
  *   **What the example must lack:**
      *   **No Enforcer:** If IT can force "Reply-Sender," it's a rule, not a convention.
      *   **No Explicit Agreement:** No meeting where everyone voted "We shall Reply-All."
      *   **Live Alternatives:** It must be plausible that "Reply-Sender" could have been the norm instead of "Reply-All."
  *   **What it must have:**
      *   **Interdependence:** My payoff depends on what you do. (If you Reply-All and I Reply-Sender, information is lost. If we both do the same, we win).
      *   **Salience:** Why did we pick one? (Maybe the first person did it, or the default button was highlighted).

  ### 3. Preempting the Misconceptions

  Do not save these for Q&A. Weave them into the narrative where the error naturally arises.

  **A. The Searle/Collective Intention Trap (Address during Step 3: Regularity)**
  *   **The Error:** They will think a convention requires a "We-Intention" ("We collectively agree to do X").
  *   **The Fix:** Emphasize Lewis's reductionism. "I intend to Reply-All *because* I expect you to Reply-All." There is no group mind. There is only a stack of individual expectations about individual expectations.
  *   **Script:** "If you think Lewis needs the group to 'agree,' you're importing Searle. Lewis is a Hobbesian individualist. The 'agreement' is a fiction generated by the equilibrium."

  **B. The "Arbitrary" Trap (Address during Step 3: Arbitrariness)**
  *   **The Error:** "Arbitrary" = "No reason to prefer it."
  *   **The Fix:** "Arbitrary" = "Another equilibrium existed." Once the convention is set, there is a *massive* reason to prefer it (coordination).
  *   **Script:** "Driving on the right is arbitrary. But once we are doing it, it is not optional. 'Arbitrary' refers to the history, not the current payoff."

  **C. The Cognitive Load/Realism Trap (Address during Step 4: Common Knowledge)**
  *   **The Error:** "People don't calculate infinite recursion every time they speak. So Lewis is unrealistic."
  *   **The Fix:** Distinguish **Competence** from **Performance**. Lewis is describing the logical structure that *justifies* the behavior, not the neural computation happening in real-time. Habits/dispositions can track the logic without running the algorithm.
  *   **The Evolutionary Question:** You asked whether to bring in evolutionary game theory (Skyrms, etc.).
      *   **Verdict:** **Hold it back as a footnote, not a rescue.**
      *   **Why:** Lewis is doing conceptual analysis ("What *is* a convention?"), not anthropology ("How did conventions *arise?"). Evolutionary stories explain how populations of *non-rational* agents stumble into equilibria. Lewis explains what it means for *rational* agents to be in one.
      *   **Usage:** If someone says "But people aren't rational," say: "Lewis is defining the logic of the state. Evolution explains how we got to the state. They are compatible, but don't let evolution replace the definition."

  ### 4. The Litmus Test (Last 10 Minutes)

  Do not ask "Any questions?" Ask this:

  > **"Imagine a world where cars are physically built so they can *only* steer to the right. Everyone drives on the right. There is perfect common knowledge that everyone drives on the right.**
  >
  > **Is 'Driving on the Right' a Convention in Lewis's sense?"**

  *   **The Answer:** **No.**
  *   **Why:** It fails the **Arbitrariness** condition. There is no alternative equilibrium. If there is only one possible solution to the coordination problem, it is a physical necessity, not a convention.
  *   **What this separates:** People who memorized the vocabulary ("It has CK! It has Regularity!") from people who understand the *structure* (It lacks the alternative equilibrium).

  ### 5. Deliberate Omissions (Announce These)

  To keep this to 75 minutes and prevent pedantry, announce these exclusions at the start:

  1.  **The Formal Definition of Common Knowledge:** You will not write out the infinite hierarchy ($I$ know that you know that I know...). You will treat it as "Publicly Salient Stability."
  2.  **The "R" Relation:** Lewis has a specific technical notion of "indicators" (relation R). Skip it. It's too granular for a general overview.
  3.  **Norm vs. Custom vs. Convention:** Lewis distinguishes these, but the boundaries are fuzzy. Stick to "Convention" as the umbrella term for equilibrium sustained by expectation.
  4.  **The "Truth and Trust" Formalism:** When moving to language, don't get bogged down in the semantics of truth-conditions. Stick to the functionalist view: Language works *because* it is a convention of truth-telling.

  ### Summary of the Flow

  1.  **0-10:** **The Reply-All Problem.** (Recurring situation, Interdependent Payoffs).
  2.  **10-25:** **The Equilibrium.** (Regularity, Why Conform, Arbitrariness). *Preempt Searle here.*
  3.  **25-40:** **The Glue.** (Common Knowledge, Salience). *Preempt Cognitive Load here.*
  4.  **40-55:** **Language.** (Mapping the email convention to semantics).
  5.  **55-65:** **The Litmus Test.** (The "Steer-Only-Right" Cars).
  6.  **65-75:** **Q&A.**

  This structure respects the rationalist desire for logical dependencies while preventing them from turning the session into a game-theory optimization problem. Lewis is describing a social ontology, not an algorithm. Make sure they see the difference.
