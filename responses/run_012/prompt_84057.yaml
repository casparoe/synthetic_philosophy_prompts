answer: |-
  To lead a seminar on Augustine's *On Lying* effectively, you need a rubric that separates the structural necessities of a definition from the theological or philosophical commitments that vary between schools of thought. Below is a specification of the requirements any adequate account of lying must satisfy, categorized by their status, followed by the critical tensions you requested.

  ### I. The Specification of Requirements

  An adequate theory of lying must satisfy the following conditions. I have distinguished between those that are **Non-Negotiable** (conditions of adequacy required to make the concept intelligible) and **Camp Commitments** (theoretical choices that define a specific ethical framework but are not required for the definition itself).

  **1. The Subjective Condition (Non-Negotiable)**
  *   **Requirement:** The speaker must believe the proposition they are asserting is false.
  *   **Case/Consideration:** This distinguishes **lying from being mistaken**. If a doctor tells a patient, "You will recover," believing it to be true, but the patient dies, the doctor has spoken falsely but has not lied. Without this condition, we cannot distinguish malice or duplicity from error.
  *   **Status:** Non-Negotiable. A theory that classifies honest mistakes as lies loses the concept's utility for moral assessment.

  **2. The Assertive Condition (Non-Negotiable)**
  *   **Requirement:** The falsehood must be communicated via a mode of assertion (words, signs, or nods) that conventionally implies truth-telling.
  *   **Case/Consideration:** This distinguishes **lying from jokes, fiction, and acting**. Augustine excludes jokes by stipulation; a robust theory excludes them by convention. When an actor says "I am Hamlet," they are not lying because the context suspends the claim to truth. Similarly, a chatbot generating text is not lying unless it is designed to simulate a human agent claiming truth.
  *   **Status:** Non-Negotiable. Without this, all fiction is lying, and the term loses discriminatory power.

  **3. The Intentional Condition (Non-Negotiable)**
  *   **Requirement:** The speaker must intend for the hearer to believe the false proposition (or at least intend to assert what they believe is false).
  *   **Case/Consideration:** This distinguishes **lying from misleading**. If a politician says, "I did not have sexual relations with *that* woman" (knowing they did, but relying on a technical definition of 'sexual relations'), they are misleading, not lying, under strict definitions. A theory must decide if this counts. Most adequate accounts say this is *deception* but not *lying*, preserving a distinction between the letter and the spirit of truth.
  *   **Status:** Non-Negotiable for defining *lying*, though some theories broaden "lying" to include "deliberate misleading."

  **4. The Normative Condition (Camp Commitment)**
  *   **Requirement:** The hearer must have a valid claim or right to the truth.
  *   **Case/Consideration:** This handles the **murderer at the door** and the **dementia patient**. If the theory requires a "right to truth," telling the murderer where your friend is hiding is not a lie (because they forfeited the right). If the theory follows Augustine, it *is* a lie (because the mind/word disconnect exists regardless of rights).
  *   **Status:** Camp Commitment. Augustine rejects this; Kant arguably accepts it; modern secular ethics often adopts it. It is not required for the *definition* of lying, but it is required for the *justification* of exceptions.

  **5. The Theological Condition (Camp Commitment)**
  *   **Requirement:** The act constitutes an offense against God or a disordering of the soul independent of social harm.
  *   **Case/Consideration:** This is Augustine's core engine. It explains why a "harmless" lie (the **polite falsehood** about enjoying the evening) is still sinful.
  *   **Status:** Camp Commitment. A secular ethics committee cannot use this. It relies on specific metaphysics (the nature of the soul, the authority of God) that are not universally shareable in a pluralistic institution.

  **6. The Consequential Condition (Camp Commitment)**
  *   **Requirement:** The moral weight of the lie is determined (wholly or partly) by the outcome (harm/benefit).
  *   **Case/Consideration:** This handles the **doctor with the dementia patient**. If the lie prevents terror, a consequentialist account may deem it permissible. Augustine's account deems it sinful regardless of the terror spared.
  *   **Status:** Camp Commitment. Augustine explicitly rejects this. Practical ethics usually requires it.

  ---

  ### II. The Distinctions That Must Not Collapse

  To judge Augustine, your seminar must ensure the theory preserves these five distinctions. If a theory collapses them, it fails to map onto moral reality.

  1.  **Lying vs. Being Mistaken:** (Handled by the Subjective Condition). If these collapse, we blame people for ignorance.
  2.  **Lying vs. Withholding:** (Handled by the Assertive Condition). Refusing to answer the politician or the murderer is not lying. A theory that treats silence as lying imposes an impossible duty of total disclosure.
  3.  **Deceiving vs. Lying:** (Handled by the Intentional Condition). One can deceive without lying (implication, silence, staging). One can lie without deceiving (the **statement to someone who won't believe it**). If these collapse, we lose the ability to critique the specific vice of *asserting* falsehood.
  4.  **Wrongness of the Act vs. Badness of the Upshot:** This is the critical Augustinian distinction. A theory must allow that an act can be *pro tanto* wrong (a lie) but have a *good* upshot (saving a life). Augustine keeps these separate; utilitarianism collapses them.
  5.  **What is Owed to the Hearer vs. What the Liar Does to Himself:** Augustine focuses on the latter (the disordering of the liar's soul). Secular ethics focuses on the former (violating the hearer's autonomy). A complete theory must acknowledge both, even if it prioritizes one.

  ---

  ### III. The Incompatible Pair (The Aporia)

  You asked to flag the pair of requirements that cannot be satisfied together. This is where the "real disagreement" lives. No theory can fully satisfy both **Requirement A** and **Requirement B** below without significant strain.

  **A. The Requirement of Definitional Purity (Augustine's Strength)**
  The definition of lying must rely *only* on the internal state of the speaker (the mind/word disconnect) and not on external factors like the hearer's rights or the consequences.
  *   *Why we want it:* It provides moral clarity. You know instantly if you are lying. It prevents self-deception where we convince ourselves the hearer "didn't deserve the truth."

  **B. The Requirement of Moral Discriminability (Practical Ethics' Strength)**
  The definition must allow for moral distinction *within* the category of lying, such that some lies are not just "less bad" but qualitatively different in kind (e.g., malicious vs. benevolent) without resorting solely to external consequences.
  *   *Why we want it:* A hospital committee cannot treat a lie to spare a dementia patient's terror as the same *kind* of act as a lie to cover up malpractice.

  **The Conflict:**
  If you satisfy **A** (Augustine), all lies are definitionally identical (mind/word disconnect). You lose **B** (you cannot say the benevolent lie is a different *kind* of act, only that it has better consequences).
  If you satisfy **B** (by building "violation of a right to truth" into the definition), you lose **A**. You are no longer defining "lying" based on the act itself, but based on the *permission* to lie. This leads to the paradox where a "justified lie" is defined as "not a lie," which obscures the fact that truth was still sacrificed.

  **Augustine chooses A.** He accepts that all lies are the same kind of sin, differing only in severity of consequence, not in kind.
  **Modern Ethics chooses B.** It often redefines the act to make the justification work (e.g., "It wasn't a lie because he had no right to know").

  ---

  ### IV. Practical Application

  For your seminar conclusion, here are the direct answers regarding the utility of Augustine's position for a hospital or newsroom.

  **1. Which single requirement makes Augustine's absolute prohibition untenable for practical ethics?**
  **The Requirement of Consequential Irrelevance.**
  Augustine insists that the moral species of the act is determined *before* and *independent of* the outcome. A hospital ethics committee operates on the principle of *non-maleficence* (do no harm). If telling the truth causes severe psychological harm (the dementia patient), and lying prevents it, Augustine's framework forces the committee to choose "sin" over "harm." In a secular, institutional context, preventing tangible harm is the primary mandate. A theory that makes the prevention of harm secondary to the metaphysical purity of the speaker's soul cannot guide policy where patient welfare is the metric of success.

  **2. Is there any requirement on the list Augustine satisfies better than his permissive rivals?**
  **The Requirement of Agent-Integrity (The "What the Liar Does to Himself" distinction).**
  Augustine's account is superior at protecting the moral character of the liar. Permissive rivals (like "white lie" theories) often encourage a slippery slope where the speaker becomes the sole judge of what is "beneficial," eroding their own habit of truthfulness. Augustine forces the speaker to acknowledge that *even when necessary*, lying is a cost to the self.
  *   *Practical Value:* For a journalist, Augustine's rigor is a vital corrective. It reminds them that even a "justified" deception (e.g., undercover sting) damages the institution's integrity and the journalist's own relationship to truth. It prevents the normalization of lying as a "tool." While a committee may decide to lie anyway, Augustine ensures they do not call it "good." They must call it a "necessary evil," preserving the gravity of the truth they are violating.

  ### Summary for the Class
  When you lead the discussion, propose this standard: An adequate theory must define lying by the **mind/word disconnect** (Augustine's insight) but judge it by the **violation of rights and consequences** (Modern insight). The failure of Augustine is not in his definition, but in his refusal to allow the judgment to override the definition. He forces us to admit that sometimes we must choose between being a "truth-teller" and being a "protector," and he refuses to let us hide that choice by redefining the lie away.
