  **The Foolish Daughter**

  The vulgar sort read beasts—the Ram, the Fish,
  And split the sky by Houses, false and vain;
  They claim the stars compel like wind and rain,
  To grant a prince his doom or petty wish.
  I scorn their signs, those arbitrary lines,
  Yet cast the chart to secure a certain gain;
  For patronage is bare and hard to maintain,
  The foolish daughter feeds her mother's designs.

  Yet when I trace the planet's silent flight,
  I find the aspect serves the seeking soul,
  Where angles wake the mind's harmonic part;
  Those self-same ratios bring the divine light,
  That move the harmony of the human whole,
  The heavens sing; we tune the ear by art.
