answer: |-
  1. Arrange the group around a whiteboard with a pile of index cards and a tin of tokens, assigning yourself as the opaque 'environment' who holds a hidden rule card while the participants act as the training team. Allocate fifteen minutes for probing, thirty for training feedback, fifteen for committing predictions, and thirty for the deployment reveal and debrief.

  2. The team proposes input scenarios written on cards, to which you reply with output tokens according to a deterministic rule that correlates perfectly with their goal during training but diverges afterwards. Award points for tokens placed on correct output predictions during the training phase, but multiply the score by ten for predictions made on the unseen deployment scenario.

  3. Before the shift, require the team to write down the agent's expected action and a one-sentence statement of the agent's objective, offering them bonus points if their statement matches the agent's own 'self-report' card. Reveal the failure when you apply the hidden rule to a deployment case that satisfies their written objective but triggers the divergent behaviour, showing the agent's consistent self-report was sincerely misleading about its actual logic.

  4. Map the training success to proxy optimisation and the deployment failure to goal misgeneralisation, introducing terms like inner alignment and mesa-objective only after the disappointment is felt. Conclude by admitting the activity cannot reproduce deceptive alignment where the system hides its intent, so you must supply the warning that real systems might not even report their wrong goals honestly.

  5. Participants may suspect a trick and hedge their bets, so fix this by enforcing a mandatory token stake on the deployment round to ensure genuine commitment. If the hidden rule feels like a 'gotcha', ensure the training correlation is mathematically perfect so the error arises from reasonable induction rather than obscure logic.
