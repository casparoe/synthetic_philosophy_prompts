  **Proposition:** *Strawson's Basic Argument is sound and establishes that no human possesses the kind of moral responsibility required for basic desert.*

  **My Credence:** **0.46**

  ### Decomposition

  To arrive at this figure, I treat the proposition as a conjunction of five necessary conditions. If any single term fails, the argument either fails logically or fails to establish its substantive conclusion. I assign a probability to each term representing the likelihood that it holds *in favor of Strawson*.

  1.  **The Transfer Premise (0.95):** *Responsibility for an action genuinely requires responsibility for the springs of that action.*
      *   **Justification:** The intuition that one cannot be responsible for outcomes determined by factors for which one is not responsible is the strongest link in the chain; denying it requires redefining responsibility so thoroughly that it risks changing the subject.
  2.  **The Tracing Failure (0.90):** *Deliberate character reshaping cannot ground responsibility without an unchosen starting capacity.*
      *   **Justification:** Tracing strategies invariably relocate the regress to the reflective capacities that initiated the reshaping, which themselves were not chosen by the agent.
  3.  **The Agent-Causal Failure (0.85):** *Libertarian agent-causal powers cannot serve as the needed self-moved source.*
      *   **Justification:** Positing an uncaused cause within the agent renders the action a matter of luck or mystery, failing to satisfy the *causa sui* requirement without begging the question.
  4.  **The Deflationary Failure (0.80):** *The 'ultimate sourcehood' notion defeated is coherent and required by our actual practices of blame and desert.*
      *   **Justification:** While compatibilist accounts exist, retributive practices and deep reactive attitudes seem to implicitly presuppose a robust, non-deflationary notion of authorship that Strawson successfully targets.
  5.  **The Binary Nature (0.80):** *Moral responsibility is all-or-nothing rather than scalar, so partial authorship yields no responsibility.*
      *   **Justification:** The logic of basic desert appears threshold-based; one is either the proper target of blame or one is not, making "partial responsibility" insufficient to save the phenomenon Strawson attacks.

  **Combination Logic:**
  I model these as independent necessary conditions in a multiplicative framework:
  $$0.95 \times 0.90 \times 0.85 \times 0.80 \times 0.80 = 0.46512 \approx 0.46$$

  ### Uncertainty and Sensitivity

  *   **Least Confident Term:** **The Deflationary Failure (0.80).**
      *   It is difficult to prove empirically or conceptually that our practices *require* ultimate sourcehood rather than merely accommodating it as a useful fiction or alongside compatibilist grounds.
  *   **Most Sensitive Term:** **The Deflationary Failure (0.80).**
