answer: |-
  Use this checklist to calculate belief updates mathematically where possible, but recognize that conditional information requires a character-driven choice where probability theory offers no single solution.

  ### The Belief Revision Checklist

  1.  **Map the State Space:** List the four possible combinations of the two relevant distinctions (e.g., Location A/B and Object X/Y).
      *   *Why:* You cannot update beliefs until you define the specific scenarios your character considers possible.
  2.  **Assign Priors:** Give each scenario a percentage probability that sums to 100%.
      *   *Why:* This establishes the character's baseline ignorance or confidence before the new information arrives.
  3.  **Classify the Input:** Identify if the message is a Fact ("It is X"), a Disjunction ("It is X or Y"), a Conditional ("If X, then Y"), or Unreliable ("Source says X").
      *   *Why:* Different types of information require different mathematical rules; misclassifying a conditional as a fact breaks logical consistency.
  4.  **Execute the Update:** Eliminate impossible scenarios and renormalize the remaining percentages to sum to 100%.
      *   *Why:* This is the standard Bayesian procedure for factual evidence and disjunctions, ensuring the math remains arithmetic-only.
  5.  **Flag the Judy Benjamin Gap:** If the input is a Conditional, stop the math and acknowledge that shifting probability between the "If" scenario and the alternative is undefined.
      *   *Why:* Philosophy of probability confirms there is no rational consensus on how learning "If A then B" changes the likelihood of A versus not-A; this is where character psychology must take over.
  6.  **Make the Dramatic Choice:** Decide if the character interprets the ambiguity optimistically (favoring the "If" scenario) or pessimistically (favoring the alternative).
      *   *Why:* Since the theory offers no answer, you must choose based on temperament to ensure the character's subsequent actions feel consistent.
  7.  **Verify Action Consistency:** Ensure the character's next physical action matches the new probabilities, not the old ones.
      *   *Why:* Readers detect dissonance when a character claims to believe something but acts as if they do not.

  ### What This Procedure Cannot Do
  This procedure cannot tell you how much weight to shift between the antecedent (the "If" part) and the alternative when learning a conditional. Probability theory does not dictate whether hearing "If the meeting is in the east wing, then the ledger is in the study" makes the east wing more likely, less likely, or unchanged relative to the west wing. You must pick a convention for your novel—such as "my characters always assume conditionals imply relevance"—and apply it consistently, because the philosophy is unsettled.

  ***

  ### Scene 1: The Conditional Message
  **Context:** A character stands in a hallway knowing a meeting is either in the East or West Wing, and the ledger is either in the Study or the Library. She hears a garbled voice say, "If the meeting is in the east wing, then the ledger is in the study."

  1.  **State Space:** East/Study, East/Library, West/Study, West/Library.
  2.  **Priors:** 25% each (total 100%).
  3.  **Input:** Conditional ("If East, then Study").
  4.  **Update:** The message eliminates only "East/Library." The remaining three scenarios (East/Study, West/Study, West/Library) share the 100% probability.
      *   *Math:* 100% / 3 = 33.3% each.
      *   *Resulting Beliefs:* East/Study (33%), West/Study (33%), West/Library (33%).
      *   *Aggregate:* Probability of East Wing is now 33%. Probability of West Wing is now 66%.
  5.  **Judy Benjamin Gap:** The math suggests the West Wing is now twice as likely as the East Wing simply because a condition was placed on the East.
  6.  **Dramatic Choice (Values Flag):** **This is the values choice.** A purely mathematical update makes the East Wing seem unlikely, but a psychologically plausible character might think, "Why mention the East Wing unless it's the probable location?"
      *   *Decision:* To make her action plausible (going to the East Wing), you override the math. You assign East Wing a 60% probability based on her intuition that the speaker wouldn't mention it otherwise.
  7.  **Action:** She heads to the East Wing.

  **Posterior Numbers:** Mathematically 33% East, but adjusted to 60% East for the scene.
  **Psychological Plausibility:** High. Readers expect characters to infer relevance from speech; strict mathematical elimination feels robotic in this context.
  **Values Choice Flag:** Step 6. You chose to prioritize conversational implicature over strict probability renormalization.

  ***

  ### Scene 2: The Unreliable Source
  **Context:** The same character meets a informant she trusts 70%. The informant says, "The meeting is in the east wing." She previously thought East and West were equally likely.

  1.  **State Space:** East Wing, West Wing.
  2.  **Priors:** East 50%, West 50%.
  3.  **Input:** Unreliable Fact (Source says East, Trust = 0.7).
  4.  **Update:** Use a weighted average based on reliability.
      *   *Math:* (Trust × Prior Yes) + ((1 - Trust) × Prior No).
      *   *Calculation:* (0.70 × 0.50) + (0.30 × 0.50) is incorrect for updating; use likelihood weighting.
      *   *Correct Arithmetic:* Probability East = (Trust × Prior) / [(Trust × Prior) + ((1 - Trust) × Prior)].
      *   *Simplified:* Since priors are equal, the new probability equals the trust score.
      *   *Result:* East Wing 70%, West Wing 30%.
  5.  **Judy Benjamin Gap:** None. This is standard uncertain evidence.
  6.  **Dramatic Choice:** None required by theory, but you may adjust for character cynicism.
  7.  **Action:** She goes to the East Wing but keeps an eye on the West.

  **Posterior Numbers:** 70% East, 30% West.
  **Psychological Plausibility:** High. It mirrors how people naturally weigh advice from sources they mostly trust but don't fully rely on.
  **Values Choice Flag:** None. This is a factual calculation based on the trust parameter you set.
