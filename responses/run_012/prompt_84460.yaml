answer: |-
  **Exam Question**

  A healer must choose: cure thirty people now, or save five who will survive but become psychologically discontinuous due to treatment. Standard consequentialism sums welfare across persons. Buddhist ethics denies enduring selves. Does no-self undermine the person as the unit of aggregation? If the five discontinuous survivors count differently than the thirty, why? If they count the same, why? Finally, demonstrate whether claiming this debate is merely verbal avoids or collapses under the pressure of this specific choice.

  ***

  **Model Answer**

  The core tension lies in whether Buddhist metaphysics dissolves the unit of moral accounting. Standard consequentialism aggregates welfare across distinct persons. If persons are ultimately fictions, the boundary between 'my' suffering and 'yours' lacks metaphysical weight, suggesting aggregation should occur across momentary experiences rather than narrative lives. This challenges the foundational structure of consequentialist calculation, as there is no enduring subject to whom welfare attaches.

  Regarding the thirty, they represent conventionally continuous persons. Even if ultimately empty, their suffering is real within the conventional truth. A consequentialist reading of Buddhism must account for this suffering. Denying the self does not deny the pain. Thus, the thirty count as thirty loci of immediate welfare. To ignore them because persons are fictional would be nihilistic, not Buddhist. The ethical imperative remains to reduce suffering, regardless of the ontological status of the sufferer. However, the justification shifts from respecting persons to alleviating experiences. This maintains agent-neutrality but changes the object of concern.

  The five present the boundary problem. Their survival entails psychological discontinuity. If the unit of aggregation is the person, their survival matters less if 'personhood' requires continuity. However, if no-self is true, continuity is already fictional for everyone. The difference between the thirty and the five is merely a difference in the density of conventional fiction, not ultimate reality. If ethics tracks ultimate reality, the five count equally because suffering persists regardless of memory. If ethics tracks conventional welfare, the five count less because their narrative goods are destroyed. This creates a dilemma: does the treatment preserve the subject of welfare or merely extend biological life? Under no-self, the 'subject' is a stream of causes. Breaking the stream matters only if conventional continuity is valued ethically.

  Can these answers come apart? Only if the theory bifurcates truths. One could argue the thirty count conventionally, while the five reveal the ultimate emptiness of counting. But this creates inconsistency in action. A healer cannot act on two scales simultaneously. If the view stops being consequentialist, it becomes agent-relative virtue ethics, focusing on the healer's intention rather than the sum of saved lives. But the prompt assumes a consequentialist framework. Therefore, the unit must be consistent: either moments of experience or conventional persons. If one chooses moments, the discontinuity of the five is irrelevant; only the quality of future experience matters. If one chooses persons, the five may not survive as persons at all. Inconsistency here reveals a failure to commit to either ultimate or conventional truth as the ethical ground.

  This pressure breaks the verbal dispute escape hatch. Claiming the debate is merely verbal suggests no practical difference exists between reading Buddhist ethics as consequentialist or otherwise. Here, the reading dictates the choice. If persons are real units, save the thirty. If moments are units, the calculation shifts based on the intensity of suffering versus the loss of narrative. The healer must choose one body over another. A verbal dispute implies no stake; this scenario imposes a fatal stake. To claim the disagreement is verbal is to ignore the necessity of action under scarcity. The metaphysics of no-self forces a restructuring of aggregation that yields distinct practical outcomes. Therefore, the dispute is substantive. The no-self doctrine does not just rename consequentialism; it challenges the coherence of summing welfare across fictional boundaries, demanding a shift from person-based to experience-based accounting that alters triage decisions. The student must conclude that without a robust unit of aggregation, consequentialism collapses or transforms into something unrecognizable, proving the metaphysical commitment has ethical teeth. Ultimately, the scenario demonstrates that metaphysical commitments regarding personal identity are not ornamental; they determine the arithmetic of survival.

  ***

  **Marking Scheme (25 Marks)**

  1.  **Identification of the Aggregation Unit (5 marks)**
      *   *Requirement:* Must distinguish between aggregating across 'persons' versus 'moments of experience' given no-self.
      *   *Common Failure:* Candidates treat persons as metaphysically robust without addressing the no-self challenge.

  2.  **Analysis of the Thirty (5 marks)**
      *   *Requirement:* Must acknowledge their suffering counts under conventional truth even if selves are fictional.
      *   *Common Failure:* Candidates argue the thirty do not count because persons are ultimately unreal (nihilism).

  3.  **Analysis of the Five (5 marks)**
      *   *Requirement:* Must explain whether psychological discontinuity alters their moral weight under no-self.
      *   *Common Failure:* Candidates assert discontinuity is irrelevant without explaining why continuity matters ethically.

  4.  **Consistency of Counting (5 marks)**
      *   *Requirement:* Must argue whether the thirty and five can be counted differently without contradiction.
      *   *Common Failure:* Candidates allow contradictory counting methods without addressing the bifurcation of truth.

  5.  **Verbal Dispute Verdict (5 marks)**
      *   *Requirement:* Must demonstrate why the practical stakes prove the dispute is substantive, not verbal.
      *   *Common Failure:* **B Grade:** Asserts the dispute is verbal or fails to engage with the necessity of choice. **A Grade:** Explains that scarcity forces a metaphysical commitment that yields distinct outcomes, making the dispute substantive.
