      *   *Constraint:* "No citations, no reading list." -> Model answer must not cite Feldman, Christensen, etc.
      *   *Constraint:* "Definite verdict." -> Model answer must pick a side.
      *   *Constraint:* "Planning section." -> Will include this at the start.
      *   *Word Counts:* Question (standard), Model Answer (~750), Scheme (detailed).
      *   *Marks:* 25 total.

  7.  **Final Polish:**
      *   Ensure the distinction between "self-undermining" (lowers own credence) and "self-defeating" (destroys own justification entirely) is clear in the scheme/model.
      *   Ensure the akrasia point distinguishes between "believing P and believing I shouldn't believe P" vs "believing P and believing my process is unreliable."
      *   Check that the model answer sounds like a *student* (strong, but not professorial omniscience).

  *(Self-Correction during drafting)*: I need to make sure the Model Answer doesn't sound *too* perfect. It should acknowledge tension. Also, ensure the marking scheme rewards the *argument* not the *verdict*. A student could argue for full steadfastness if they argue endogeneity voids the HOE completely, provided they handle the recursion well. However, the prompt asks me to design the item to probe understanding. The model answer should represent the "A" standard. I will argue for a nuanced "Partial Defeat" view in the model answer as it allows for the most demonstration of philosophical work.

