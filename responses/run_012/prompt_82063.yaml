      *   **Task:** Produce a single, self-contained exam item (Essay Question, Model Answer, Marking Scheme) for an upper-level seminar in epistemology.
      *   **Topic:** Higher-order evidence, epistemic akrasia, first-order vs. higher-order justification.
      *   **Constraints:**
          *   Do not rely on reciting standard positions (conciliationism, steadfastness, level-splitting) or specific authors/examples.
          *   Must use the provided case (Amara, Method M, Hypothesis H, Credence 0.9, Calibration Finding, Endogeneity).
          *   Must force students to address three specific things: (1) Defeat status (undercutting? endogeneity effect?), (2) Akrasia (permissible?), (3) Defeater-defeater vs. rational tension.
          *   Requires a definite verdict defended against objections.
          *   Deliverables: (1) Essay Question (75 mins, 900-1000 words expected, 25 marks), (2) Model Answer (~750 words, strong student style, definite line), (3) Marking Scheme (25 marks, named moves, specific errors, A vs. B distinction).
      *   **Planning:** Brief brainstorming section before drafting.

  2.  **Brainstorming & Planning:**
      *   **Core Problem:** The case involves *endogenous* higher-order evidence (HOE). Usually, HOE suggests you are wrong. Here, the HOE says "Method M is only 60% reliable at 0.9 credence." But the HOE itself was produced by Method M with 0.9 credence.
      *   **Key Tension:** If Amara lowers her credence in H based on the Calibration Finding (CF), she must also lower her credence in CF (since CF was produced by M). If she lowers credence in CF, does the defeat vanish? This looks like a self-undermining defeater.
      *   **Positions to Probe:**
          *   *Total Evidence View:* Combine first-order evidence (FOE) and HOE.
          *   *Screening Off:* Does HOE screen off FOE?
          *   *Self-Undermining vs. Self-Defeating:* Does the fact that CF undermines itself mean it provides *no* evidence, or does it provide *less* evidence, or does it create a stable lower credence (fixed point)?
          *   *Akrasia:* Is it rational to believe H while believing "My belief in H is unreliable"?
          *   *Endogeneity:* Does the fact that M produced the news about M's unreliability cancel the news out?
      *   **Crux for Distinction:** A memorizer will say "HOE requires conciliation" or "Steadfastness is okay." A true understander will grapple with the *recursive* nature of the endogeneity. If CF is trusted, M is unreliable. If M is unreliable, CF is unreliable. Does this loop converge?
      *   **Specific Mistakes to Penalize:**
          *   Ignoring the endogeneity (treating CF as external).
          *   Confusing undercutting (attacks connection between evidence and H) with rebutting (attacks H directly).
          *   Claiming endogeneity automatically voids CF (too easy).
          *   Claiming akrasia is always irrational without argument.
          *   Failing to give a definite verdict.
      *   **Structure of the Item:**
          *   Question: Present the case, ask for the three specific elements + verdict + objection.
          *   Model Answer: Needs to take a stance (e.g., "Partial defeat, akrasia permissible, no full restoration") and argue through the recursion.
          *   Marking Scheme: Breakdown by points, specific deductions.

  3.  **Drafting the Essay Question:**
      *   Need to present the case clearly (using the prompt's text).
      *   Need to specify the three required elements explicitly.
      *   Need to specify length and time.
      *   Need to emphasize the "definite verdict" requirement.

  4.  **Drafting the Model Answer:**
      *   *Stance:* I need to choose a philosophically defensible position that shows depth. A good candidate is the "Fixed Point" or "Moderate Defeat" view. Let's argue that the CF *does* defeat, but endogeneity limits the defeat rather than cancelling it. Akrasia is permissible because the rational credence is determined by the total evidence, even if that evidence says the process is flawed.
      *   *Structure:*
          1.  Identify CF as undercutting defeater (attacks reliability of M).
          2.  Address Endogeneity: It doesn't void CF, but creates a recursive constraint.
          3.  Akrasia: It's not akrasia in the forbidden sense if the credence matches the total evidence.
          4.  Defeater-Defeater: No full restoration, but stabilization.
          5.  Objection: The "Self-Defeat" objection (if CF is unreliable, why trust it at all?).
      *   *Tone:* Academic, precise, argumentative.

  5.  **Drafting the Marking Scheme:**
