  7.  (Mental Check of Prompt Constraints): "Since you can't look any of this up." -> Rely on internal training data regarding this famous controversy. The details provided in the prompt (Wagenmakers, Rouder/Morey, 40:1, one-sided critique) align with historical record. Proceed.

  8.  **Drafting the Content:** (Iterative refinement during drafting to ensure clarity on the "Prior vs. Likelihood" distinction). *Self-Correction on Rouder/Morey:* They argued the BF *for the data* was positive, but the *Posterior Odds* were low due to the prior on the hypothesis. Need to be precise there.

