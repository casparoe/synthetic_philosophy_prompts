      2.  Framework Mapping (Frequentist vs. Bayesian).
      3.  The Locus of Disagreement (Likelihood, Prior, Stopping, Unit).
      4.  Running it Backwards (Is Frequentism Broken? Is Bayesianism Unfalsifiable?).
