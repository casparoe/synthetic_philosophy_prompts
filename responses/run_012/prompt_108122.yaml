answer: |-
  ### Case Study: Bem's "Feeling the Future" and the Methodological Schism

  Daryl Bem's 2011 paper *Feeling the Future* is the Rosetta Stone of the modern replication crisis. It is not primarily a story about precognition; it is a story about what a $p$-value licenses a researcher to claim, and what a Bayes Factor licenses a skeptic to deny. The controversy exposes the fault line between a framework designed to control long-run error rates (Frequentism) and a framework designed to quantify evidential weight (Bayesianism).

  Here is the mapping of the conflict, the reciprocal critiques, and the final verdict on where the failure actually occurred.

  ---

  ### 1. Mapping the Frameworks: What Did the Data License?

  To understand the split, we must look at what "success" meant for each side given the exact same numbers.

  #### The Frequentist Frame (Bem)
  *   **The Mechanism:** Null Hypothesis Significance Testing (NHST).
  *   **The License:** If $p < .05$, reject the Null ($H_0$). Bem reported 9 experiments; 8 showed $p < .05$ (using one-sided tests).
  *   **The Claim:** The observed data would be very unlikely if there were no psi effect. Therefore, we proceed as if the effect exists.
  *   **The Hidden Lever:** **One-Sided Testing.** By specifying the direction *a priori* (psi should not be negative), Bem halved the $p$-value. A $t$-statistic yielding $p = .06$ two-sided becomes $p = .03$ one-sided. This moved several experiments from "nonsignificant" to "significant."
  *   **The Stopping Rule:** Frequentism assumes fixed sample sizes. Bem's designs involved sequential looking or flexible stopping in some conditions, which inflates Type I error rates, though standard NHST treats the final $N$ as fixed.

  #### The Bayesian Frame (Wagenmakers et al.)
  *   **The Mechanism:** Default Bayes Factors (BF).
  *   **The License:** Compare the likelihood of the data under $H_1$ vs. $H_0$.
  *   **The Claim:** For most of Bem's experiments, the BF favored $H_0$ (often 3:1 or higher for the Null).
  *   **The Hidden Lever:** **The Prior on Effect Size.** Wagenmakers used a "default" Cauchy prior (width $r = 1$). This assumes large effects are plausible. Because Bem's observed effects were small (as psi effects usually are), the $H_1$ model "wasted" probability mass predicting large effects that didn't materialize. The BF penalized $H_1$ for this lack of precision (Ockham's Razor).
  *   **The One-Sided Critique:** Wagenmakers argued that without strong pre-registration, one-sided tests are data-dredging. In a Bayesian framework, you can model a directional prior, but the default is usually non-directional.

  #### The Meta-Analytic Bayesian Frame (Rouder & Morey)
  *   **The Mechanism:** BF Meta-Analysis + Prior on Hypothesis.
  *   **The License:** Update the odds of the hypothesis itself.
  *   **The Claim:** They conceded the *data* favored psi (roughly 40:1 odds). **However**, they argued this must be multiplied by the *prior odds* of psi existing.
  *   **The Hidden Lever:** **The Prior on $H_1$.** If you believe the prior probability of psi is 1 in a million, a 40:1 shift leaves the posterior probability still vanishingly small.
  *   **Distinction:** Unlike Wagenmakers (who said the *data* favored Null), Rouder/Morey said the *data* favored Psi, but not *enough*.

  ---

  ### 2. Where Does the Disagreement Live?

  The conflict is not in the arithmetic; it is in the philosophical mapping of uncertainty.

  | Feature | Frequentist (Bem) | Bayesian (Wagenmakers) | Bayesian (Rouder/Morey) |
  | :--- | :--- | :--- | :--- |
  | **Likelihood** | Calculated at the point estimate (MLE). | Integrated over the prior distribution. | Integrated over the prior distribution. |
  | **Prior** | Hidden in $\alpha$ (.05) and test directionality. | Explicit (Cauchy width). Default = "Ignorance." | Explicit (Cauchy width) + Prior on Hypothesis. |
  | **Stopping Rule** | Violates assumptions if flexible (inflates $p$). | Irrelevant (Likelihood Principle). | Irrelevant (Likelihood Principle). |
  | **Unit of Analysis** | Individual Experiment ($p < .05$). | Individual Experiment (BF). | Meta-Analysis (Cumulative BF). |
  | **Burden of Proof** | On the Null (disprove randomness). | Shared (compare model fit). | On the Claimant (overcome implausibility). |

  **The Core Friction:**
  1.  **Likelihood vs. Prior:** Bem treated the likelihood (the $p$-value) as the final verdict. Wagenmakers showed that the likelihood depends on how you define the alternative hypothesis (the prior width).
  2.  **One-Sidedness:** For Bem, theory justified the one-sided test. For Wagenmakers, theory requires pre-registration to justify the one-sided test; otherwise, it is a post-hoc rationalization that inflates false positives.
  3.  **Evidence vs. Belief:** Rouder/Morey highlighted the distinction between *evidence* (the Likelihood Ratio/BF) and *belief* (the Posterior). Frequentism conflates these by treating $p < .05$ as a license to believe.

  ---

  ### 3. Running It in Both Directions

  #### Argument A: Is Frequentism Broken?
  **The Case for "Yes":**
  The Bem episode demonstrates that $p < .05$ is a porous shield.
  1.  **The One-Sided Hack:** The most damaging critique of Bem was actually frequentist (Wagenmakers noted the $p$-values drift above .05 if made two-sided). This shows NHST is highly sensitive to researcher degrees of freedom.
  2.  **Peer Review Failure:** The fact that JPSP published this suggests the gatekeepers treated $p < .05$ as a "truth token" rather than a conditional probability. They failed to interrogate the one-sided justification or the stopping rules.
  3.  **Type I Error Accumulation:** Running 9 experiments guarantees some false positives. NHST has no mechanism for correcting the "family-wise error rate" across a paper unless explicitly adjusted (which Bem did not do).

  **The Case for "No":**
  The math didn't fail; the application did.
  1.  **Correct Usage:** If Bem had pre-registered the one-sided hypothesis and fixed the sample size, the frequentist inference would be valid *within its own logic*.
  2.  **Self-Correction:** The frequentist system relies on replication. The subsequent failure to replicate is the frequentist system working as intended (eventually filtering out Type I errors).
  3.  **The Critique was Frequentist:** The strongest argument against Bem was that his $p$-values were miscalculated (should be two-sided). This implies the tool wasn't broken, the user was.

  #### Argument B: Is the Bayesian Critique Unfalsifiable?
  **The Case for "Yes" (Unfalsifiability):**
  1.  **Moving the Goalposts:** Rouder and Morey admitted the data shifted odds 40:1 toward psi. To say this is "negligible" relies entirely on a subjective prior probability of psi. If no amount of data (short of infinity) can overcome a sufficiently skeptical prior, the hypothesis is unfalsifiable.
  2.  **The Default Prior Artifact:** Wagenmakers' use of the Cauchy(0, 1) prior is arbitrary. If you choose a narrower prior (expecting small effects), the BF flips to favor $H_1$. Thus, the "Bayesian conclusion" is sensitive to the choice of prior, just as the $p$-value is sensitive to one-sidedness.
  3.  **Subjectivity Masked as Math:** Claiming "40:1 is negligible" looks like objective calibration, but it is actually a philosophical stance (Hume's maxim) encoded as a number.

  **The Case for "No" (Honest Calibration):**
  1.  **Extraordinary Claims:** Science requires more evidence for claims that contradict established physics. A BF of 40 is "strong" in a vacuum, but weak against a prior of $10^{-9}$. This is rational belief updating, not bias.
  2.  **Transparency:** Bayesianism forces the prior into the open. Frequentism hides the prior in the alpha level and the test direction. The Bayesian critique made the disagreement explicit (we disagree on the prior), whereas NHST masked it (we disagree on the $p$).
  3.  **Model Penalization:** The BF favored $H_0$ in Wagenmakers' analysis not because of skepticism, but because Bem's $H_1$ model was too vague. It predicted large effects that didn't happen. This is a valid penalty for imprecise theory.

  ---

  ### 4. The Replication Wave: What Did It Settle?

  Large-scale replications (e.g., Ritchie, Wiseman, & French, 2012; Galak et al., 2012) generally failed to find the effect.

  *   **For the Frequentist:** This confirms the original results were Type I errors (false positives), likely driven by $p$-hacking, optional stopping, and the one-sided inflation. It validates the need for stricter $\alpha$ or pre-registration.
  *   **For the Bayesian:** This confirms the prior skepticism was warranted. The "40:1" evidence from the original data was likely noise that looked like signal. It validates the claim that weak evidence cannot overcome a strong theoretical prior.
  *   **The Verdict on Statistics:** Replication does not settle *which statistics are better*; it settles *which phenomenon is real*. However, the fact that the original $p < .05$ results did not hold suggests that $p < .05$ is a low bar for discovery in noisy fields. The Bayesian caution (that 40:1 isn't enough to believe in magic) was pragmatically correct, even if the specific BF calculations were debatable.

  ---

  ### 5. Final Verdict

  Was this a statistics failure, a peer review failure, or a fight over the prior?

  **It was a Peer Review failure enabled by Statistical Ambiguity, fought over the Prior.**

  1.  **Peer Review Failure:** The primary breakdown was institutional. Reviewers accepted one-sided $p$-values without demanding pre-registration or justification. They treated $p < .05$ as a binary "publish/don't publish" switch rather than a continuous measure of evidence. This allowed the "garden of forking paths" to bloom unchecked.
  2.  **Statistical Ambiguity:** Frequentism provided the camouflage. By hiding the prior assumptions (directionality, alpha, stopping rules) inside the procedural rules of NHST, Bem could claim objectivity while making subjective choices that favored significance.
  3.  **The Fight Over the Prior:** The Bayesian critique succeeded not because Bayes is "true" and Frequentism is "false," but because **Bayesianism forced the prior into the light.**
      *   Wagenmakers exposed that the "default" assumption of effect size matters.
      *   Rouder/Morey exposed that the "default" assumption of hypothesis plausibility matters.

  **Conclusion:**
  The Bem episode demonstrates that **Frequentism is not broken, but it is brittle.** It breaks when researchers exploit its hidden degrees of freedom (one-sided tests, stopping rules). **Bayesianism is not unfalsifiable, but it is explicit.** It reveals that all inference rests on assumptions (priors).

  The "40:1 is negligible" move is **honest calibration**, not unfalsifiability, provided the prior is stated. If the prior is hidden (as in NHST), the calibration is dishonest. The tragedy of *Feeling the Future* is not that psi was disproven, but that the statistical culture allowed a $p$-value to be treated as a proof of reality, while the Bayesian counter-argument was dismissed as "subjective," when in fact the Frequentist argument was simply *more covertly* subjective.

  **The Winner:** The Bayesian framework won the methodological argument because it correctly identified that the data were too weak to overcome the theoretical implausibility, and it exposed the fragility of the one-sided $p$-value. But the Frequentist framework won the practical war: the replication failures were ultimately judged by the absence of significant $p$-values in new data. The synthesis is the modern "New Statistics": **Pre-registered Frequentism with Bayesian sensitivity analyses.**
