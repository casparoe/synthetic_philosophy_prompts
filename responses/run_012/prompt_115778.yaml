prompt: |-
  Okay so this is a slightly weird ask for a software engineer, but here goes. I'm on the autonomy team for a home-care robot — it lives in a resident's flat in an assisted-living building, reminds them about medication, keeps an eye on whether they've eaten, can ring the front desk or a family member, and in the next build it's getting what product calls "nudging": it can hold a reminder back, escalate to a human, or just stand aside and let the resident do the thing it thinks is a bad idea (going out in the cold, skipping lunch, waving off the pills). Right now every one of those calls goes to a person at the front desk and the queue is killing us, so they definately want a decision layer inside the robot instead. We did a lunchtime reading group on machine ethics and I came out of it more confused than I went in, and I've read alot of this stuff since and it doesnt converge — one camp says write the rules down, another says let it learn from cases, a third says the hard part isn't the algorithm, it's that nobody can actually tell you what the rules should be, and everyone agrees the trolley stuff is a distraction, because our robot will never see a trolley, it'll see a hundred boring Tuesday-afternoon questions about whether Mrs. Alvarez may skip her walk when it's 2 degrees out. A mate of mine who does human-robot interaction keeps saying the real danger is that when a semi-autonomous system screws up, the blame always lands on whichever human was nearest the controls, even when they had no way to stop it, and I can already see that here: it'll be the front-desk person who gets blamed for whatever the robot decided at 3am.

  What I actually need from you is a procedure, not a survey. Something my team can implement as a decision layer and that our clinical lead and our legal person can read and sign off on without a philosophy degree: the questions to ask in order, what counts as a good enough answer to each, where the procedure stops and says no, and where it deliberately hands the decision to a person instead of pretending the machine can make it. It has to run in under a second with nobody in the loop, it has to be auditable afterwards (we need to be able to say why the robot did what it did in a sentence a seventy-year-old resident could follow), and it has to cope with the fact that the resident may be cognitively impaired while the family is the one paying us and the building is the one carrying liability. Pick an approach and commit to it — if you think this has to be a top-down rule set with a hard escalation path, say so, defend it, and tell me exactly what I give up by not letting the thing learn; if you think the learning approach is right, argue that instead. Don't hand me five frameworks and a shrug.

  Then run it on three cases so I can see where it bites: a resident who's refused her medication three days running and says she understands the risk; a resident who wants to walk to the corner shop alone in bad weather and gets angry every time the robot suggests waiting; and a family member who's asked us to have the robot quietly report where the resident goes during the day, without telling her. I'm expecting at least one of those to land somewhere I don't like — if the honest procedure ends up saying we shouldn't ship the nudge feature at all, or that every override has to be reviewed by a human within a day, then say that, and tell me what it would take to change your mind. And finish with an honest list of what the procedure can't do: the cases it will get wrong, the steps that are really just my team's engineering choice dressed up as ethics, and the point where I should stop pretending and go hire someone who actually knows this stuff.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Software Engineer on an autonomy team for a home-care robot.
      *   **Context:** Assisted living environment. Robot handles reminders, monitoring, alerts. New feature: "Nudging" (deciding whether to enforce, escalate, or step back on resident choices).
      *   **Problem:** Front-desk queue is overloaded. Need an on-robot decision layer. Current ethical confusion (rules vs. learning vs. ambiguity). Liability/Blame concern (front-desk staff blamed for robot decisions).
      *   **Constraints:**
          *   Needs a *procedure*, not a survey.
          *   Must be auditable (explainable to a 70-year-old).
          *   Must run < 1 second (real-time).
          *   Must handle cognitive impairment vs. family payment vs. building liability.
          *   Must pick *one* approach (commit, don't hedge).
          *   Must run three specific test cases.
          *   Must admit limitations/failures (honest list of what it can't do).
      *   **Tone:** Professional, direct, engineering-focused, ethically grounded but pragmatic. No philosophical waffle.

  2.  **Determine the Approach:**
      *   *Option A: Machine Learning (RL from human feedback).*
          *   Pros: Adapts to individual nuances.
          *   Cons: Black box (hard to audit/explain), liability nightmare (why did it do that?), data hunger (can't wait for errors to learn), shifts blame to "the algorithm" which legally falls back to the deployer.
      *   *Option B: Hard-Coded Rules (Deontological/Threshold-based).*
          *   Pros: Auditable, predictable, explainable, liability is clearer (we defined the rules).
          *   Cons: Rigid, might feel cold, requires upfront definition.
      *   *Decision:* **Option B (Rule-Based with Hard Escalation).**
      *   *Reasoning:* The user explicitly mentioned liability and the need for explainability ("sentence a seventy-year-old resident could follow"). ML cannot guarantee this yet. In medical/care contexts, "safety first" usually trumps "optimization." The "blame landing on the nearest human" argument strongly favors a system where the human *knows* when they are being looped in. A deterministic logic tree is the only thing that satisfies the <1s constraint *and* the audit requirement simultaneously without probabilistic uncertainty.

  3.  **Drafting the Procedure (The "Care Escalation Protocol" - CEP):**
      *   Need a name. Let's call it the "Capacity-Risk Escalation Protocol" (CREP).
      *   Structure: A sequential decision tree.
      *   Key Variables: Capacity (can they decide?), Risk (how bad is the outcome?), Consent (did they agree to this monitoring?).
      *   The "Stop" Condition: If Risk > Threshold AND Capacity < Threshold -> Escalate.
      *   The "Audit" Trail: Log inputs + rule triggered.

  4.  **Developing the Steps:**
      1.  *Check Consent/Contract:* What did the family/resident agree to?
      2.  *Assess Capacity:* Is the resident currently capable? (This is tricky for a robot, needs simple proxies).
      3.  *Assess Risk:* Immediate physical harm vs. long-term health vs. preference.
      4.  *Action:* Nudge, Allow, or Escalate.

  5.  **Refining the "Capacity" Problem:**
      *   A robot cannot diagnose dementia. It must rely on *status flags* set by humans (clinical lead) or *interaction patterns* (repetitive confusion).
      *   *Crucial Engineering Choice:* We cannot let the robot decide capacity dynamically in real-time without human input. We need a "Care Plan" object.

  6.  **Running the Test Cases:**
      *   *Case 1: Meds Refusal (3 days).*
          *   Risk: High (health decline).
          *   Capacity: Claims understanding.
          *   Protocol: Check Care Plan. If "Autonomous" -> Allow + Log. If "Supervised" -> Escalate.
          *   *Tension:* Autonomy vs. Safety.
      *   *Case 2: Walking in Cold.*
          *   Risk: Medium (fall/hypothermia).
          *   Emotion: Anger.
          *   Protocol: Risk threshold. If weather < X -> Escalate. Don't nag if it causes agitation (harm).
      *   *Case 3: Secret Tracking.*
          *   Risk: Privacy/Ethical.
          *   Protocol: Consent Check. If resident didn't consent -> Block.
          *   *Hard Line:* This is a legal/ethical hard stop.

  7.  **Addressing the "Blame" Issue:**
      *   The procedure must explicitly state *who* is responsible.
      *   If Robot Escalates -> Human is responsible.
      *   If Robot Allows (per rules) -> Company/Clinical Lead is responsible for the rules.
      *   Front desk cannot be blamed for a rule-based decision they didn't make.

  8.  **Listing Limitations (The "Honest List"):**
      *   Context blindness (robot doesn't know *why*).
      *   Capacity assessment is a proxy, not a diagnosis.
      *   Edge cases (emergencies not in rules).
      *   The "Engineering Choice" admission (thresholds are arbitrary).

  9.  **Review against Constraints:**
      *   < 1 second? Yes, simple logic tree.
      *   Auditable? Yes, "Rule 4.2 triggered."
      *   Commit to approach? Yes, Rule-Based.
      *   No philosophy degree needed? Yes, plain English logic.

  10. **Final Polish:**
      *   Ensure tone is empathetic but firm.
      *   Make sure the "Stop Shipping" warning is clear if the pre-conditions aren't met.
      *   Highlight the "Care Plan" as the critical missing piece of data.

  *(Self-Correction during drafting)*: I initially thought about suggesting the robot assess capacity via conversation. *Correction:* No, that's too risky and slow. The robot should read a `capacity_flag` from the daily care plan uploaded by staff. The robot executes; the humans assess capacity. This shifts liability correctly.

  *(Self-Correction on Case 3)*: Secret tracking is illegal in many jurisdictions (GDPR/HIPAA). The procedure must hard-fail this.

  *(Final check on the "Blame" aspect)*: I need to make sure the procedure explicitly logs *why* it didn't call the front desk. That protects the front desk. "No alert generated: Risk Level Low per Protocol 3.1."

  11. **Drafting the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  This is a high-stakes systems design problem, not a philosophy problem. You are building a safety-critical control system where the "plant" is a vulnerable human being.

  I am committing to a **Deterministic Rule-Based Approach with Hard Escalation Thresholds.**

  I am rejecting the Machine Learning approach. Here is the engineering justification:
  1.  **Explainability:** You cannot explain a neural net's decision to a 70-year-old resident or a judge in a sentence. You can explain a logic tree.
  2.  **Liability:** If an ML model learns that "ignoring meds" correlates with "less resident anger" and optimizes for that, you are liable for negligence. With rules, you are liable for the *policy*, which your Clinical Lead signs off on.
  3.  **Data Scarcity:** You do not have enough "edge case" data (e.g., specific cognitive decline patterns) to train a safe model without harming real residents during the learning phase.

  Below is the **Capacity-Risk Escalation Protocol (CREP)**. It is designed to run in <100ms, leave a text log for audit, and explicitly define where the robot stops and the human starts.

  ---

  ### The Procedure: Capacity-Risk Escalation Protocol (CREP)

  **Prerequisite:** Every resident must have a digital **Care Plan Object (CPO)** stored locally on the robot, updated by clinical staff. The robot cannot make decisions without this. If the CPO is missing or expired, the robot defaults to *Escalate*.

  **The Decision Loop (runs when a "Nudge" event is triggered):**

  **Step 1: The Consent Check (Hard Gate)**
  *   **Question:** Is the requested action or monitoring permitted by the signed Care Plan?
  *   **Logic:** `IF action NOT IN CPO.allowed_actions THEN Block + Alert Admin.`
  *   **Audit Log:** "Action blocked: Not in Care Plan."
  *   **Why:** This solves the "secret tracking" legal liability immediately.

  **Step 2: The Capacity Flag (Human-Defined)**
  *   **Question:** Does the Care Plan designate the resident as having decision-making capacity for this domain (meds, movement, diet)?
  *   **Logic:** `IF CPO.capacity_status == 'IMPAIRED' THEN Escalate.`
  *   **Constraint:** The robot does *not* assess capacity. It reads the flag set by a human clinician.
  *   **Audit Log:** "Escalated: Resident flagged as Impaired."
  *   **Why:** You cannot code a dementia test. Shifting this to the Clinical Lead protects your engineers and the front desk.

  **Step 3: The Risk Threshold (Clinical Lead Defined)**
  *   **Question:** Does the immediate physical risk exceed the safety threshold defined in the CPO?
  *   **Logic:** `IF risk_level > CPO.risk_tolerance THEN Escalate.`
  *   **Values:** Risk levels (1-5) are pre-assigned to events (e.g., Skipping Vitamins = 1; Skipping Insulin = 4; Walking in Snow = 3).
  *   **Audit Log:** "Escalated: Risk Level 4 exceeds Tolerance 2."
  *   **Why:** This codifies the "duty of care."

  **Step 4: The Agitation Check (Robot Sensor Input)**
  *   **Question:** Is the resident showing signs of severe distress (raised voice, repetitive refusal)?
  *   **Logic:** `IF audio_sentiment == 'HOSTILE' OR refusal_count > 3 THEN Stand Down + Log.`
  *   **Audit Log:** "Nudge withheld: Resident agitation detected."
  *   **Why:** Safety includes psychological safety. Forcing a nudge that causes a fall or cardiac event due to stress is a failure state.

  **Step 5: Default Action**
  *   **IF** all checks pass (Consent OK, Capacity OK, Risk Low, Agitation Low) -> **Execute Nudge/Allow.**
  *   **ELSE** -> **Escalate to Front Desk.**

  ---

  ### Test Cases

  Here is how CREP handles your three scenarios.

  #### Case 1: Meds Refusal (3 Days Running)
  *   **Input:** Resident refuses pills. States "I understand the risk."
  *   **CREP Execution:**
      1.  *Consent:* CPO allows med reminders. (Pass)
      2.  *Capacity:* CPO lists resident as "Capacity: Full" for meds. (Pass)
      3.  *Risk:* Meds profile says "High Risk" (Level 4). CPO Risk Tolerance is "Medium" (Level 3).
      4.  *Decision:* **Escalate.**
  *   **Outcome:** Robot stops nagging. Sends alert to Front Desk: "Mrs. Alvarez declined meds (Day 3). Capacity flagged Full, but Risk exceeds Tolerance."
  *   **Audit Sentence:** "I called the nurse because skipping this medicine is marked as high risk in your care plan."
  *   **Liability:** The Clinical Lead set the Risk Tolerance. The Front Desk handles the human conversation. The robot is not blamed for "letting her skip" because it escalated.

  #### Case 2: Walking in Bad Weather (2 Degrees, Angry Resident)
  *   **Input:** Resident puts on coat. Weather API says 2°C/Icy. Resident yells "Leave me alone."
  *   **CREP Execution:**
      1.  *Consent:* CPO allows movement monitoring. (Pass)
      2.  *Capacity:* CPO lists "Capacity: Full" for movement. (Pass)
      3.  *Risk:* Weather + Age = Risk Level 3. CPO Tolerance = Level 3. (Pass/Boundary)
      4.  *Agitation:* Audio sensor detects shouting. `refusal_count` hits 2.
      5.  *Decision:* **Stand Down + Log.**
  *   **Outcome:** Robot does not block door. Does not call front desk (to avoid escalating conflict). Logs incident.
  *   **Audit Sentence:** "I let you go because I didn't want to upset you, but I made a note of it."
  *   **Liability:** If she falls, the log shows the robot detected agitation and prioritized de-escalation per Protocol Step 4. This is defensible as "duty of care" includes preventing stress-induced incidents.

  #### Case 3: Family Requests Secret Tracking
  *   **Input:** Family member updates app settings: "Track Location: Hidden."
  *   **CREP Execution:**
      1.  *Consent:* Robot checks CPO. Resident signature does *not* include "Hidden Tracking."
      2.  *Decision:* **Hard Block.**
  *   **Outcome:** Robot ignores command. Sends alert to Building Admin (Compliance): "Family requested unauthorized monitoring."
  *   **Audit Sentence:** "I cannot do that because you did not agree to be tracked secretly."
  *   **Liability:** This is a legal hard stop. If you ship this feature, you are violating privacy laws (GDPR/HIPAA/etc.). The robot must be the enforcement mechanism here to protect the company.

  ---

  ### The "Stop Shipping" Conditions

  If you cannot meet the following pre-conditions, **do not ship the Nudge feature.** The procedure above fails if:

  1.  **No Care Plan Object:** If you do not have a structured, digitally accessible Care Plan that defines `Capacity` and `Risk Tolerance` for every resident, the robot has no ground truth. You cannot infer this from behavior.
  2.  **No Human Escalation Path:** If the front desk queue is already "killing you," adding *more* alerts (even filtered ones) might break the system. You need a guarantee that an Escalation Alert gets a human response within X minutes. If the robot escalates and no one answers, the robot is effectively abandoning the resident.
  3.  **Legal Sign-off on Risk Thresholds:** Your Clinical Lead must sign off on the Risk Levels (e.g., "Skipping lunch is Level 2"). If they refuse to put numbers to it, you cannot code the logic.

  **What would change my mind?**
  If you have 5+ years of high-fidelity interaction data where you know the *outcome* of every nudge (did they fall? did they get depressed? did they take the meds later?), you could move to a **Constrained Reinforcement Learning** model. But until then, Rules are the only safe bet.

  ---

  ### Honest Limitations (The "Can't Do" List)

  1.  **Context Blindness:** The robot does not know *why* Mrs. Alvarez refused meds. Is she in pain? Is she depressed? Is the pill too big? The procedure treats all refusals the same. This will feel cold to residents.
  2.  **Capacity Proxies:** We are relying on a human to update the `Capacity Flag`. If a resident declines rapidly on a Tuesday and the Care Plan is updated on Friday, the robot is operating on stale data for 3 days. This is a process failure, not a code failure, but the robot will look culpable.
  3.  **The "Engineering Choice" Disguised as Ethics:** The Risk Levels (1-5) are arbitrary engineering choices. We are deciding that "Walking in 2 degrees" is a Level 3 risk. That is a medical judgment dressed up as a constant integer. If a resident slips on ice, a lawyer will ask why Level 3 wasn't Level 5.
  4.  **The "Stand Down" Dilemma:** In Case 2, the robot lets a resident walk into danger to avoid agitation. If the resident gets hypothermia, the family will say, "The robot knew it was cold, why did it let her go?" The answer ("To prevent a shouting match") may not satisfy a jury.
  5.  **Where to Hire:** You need a **Clinical Safety Officer** (not just a lead) and a **Privacy Counsel**.
      *   The Clinical Safety Officer must own the Risk Thresholds. Do not let Product Managers decide that skipping lunch is a "Low Risk" event to reduce alert fatigue.
      *   The Privacy Counsel must own the Consent Check.
      *   If your company puts these decisions on the engineering team, you are personally accepting liability for medical outcomes.

  **Final Recommendation:**
  Implement CREP as a "Safety Interlock," not an "Autonomy Engine." Market it to the building staff as "Smart Triage" (it filters out the boring stuff so you only get the real problems), not "Decision Making." Ensure the logs explicitly state: *"Alert suppressed per Care Plan Rule 4.1"* so the front desk knows the robot didn't just miss it; it was told to ignore it. That is the only way to protect them from the blame.
