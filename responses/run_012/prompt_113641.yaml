answer: |-
  **Outline**

  1.  Acknowledge the two competing town stories: divine providence versus meaningless accident.
  2.  Distinguish cause from inevitability: the fire had ordinary origins, not a destined purpose.
  3.  Distinguish unpredictability from indeterminacy: the physics were real, even if the outcome was unseen.
  4.  Dismantle the counterfactual: changing one detail rewires the whole web, so we cannot know what would have been.
  5.  Center human agency: amidst the uncertainty, the great-great-aunt's choice to return remains a solid fact.
  6.  Conclude that the marker honors what happened, not why it had to happen.

  ***

  **Speech**

  Thank you. It is a strange thing to stand in front of your own history when you aren't sure which version of it is true. In Ashwater, we have two stories about the fire of 1908. The first is in the church narthex: the wind turned at two in the morning because Providence willed it, sparing the school and the sanctuary. The second is at the Legion: the whole thing was a fluke. A lamp knocked off a shelf, a hose cart wheel breaking on Mill Street, a gust of wind. If the brigade had arrived ten minutes earlier, the north side would be standing today.

  Both stories are comforting. One says we were protected; the other says we were unlucky. Both stories are wrong. They try to tidy up a night that was neither destined nor random. I want to talk about what actually happened, without the tidy endings.

  First, we must separate cause from inevitability. The fire started because a stable hand knocked a coal-oil lamp off a shelf. The wind was out of the northwest. The wood was dry. These are causes. They are physical facts. But a cause is not a command. Just because the lamp fell does not mean the town had to burn. There is no law of nature that says a spilled lamp in April must consume nine buildings. It happened, but it did not *have* to happen. We often look at the past and see a line leading directly to where we stand. But that line is drawn backward. On that Thursday night, the future was not written. It was only waiting.

  Second, we need to understand that unpredictable is not the same as undetermined. My cousin Dean is in the audience, and he will tell you that the wind swinging south at two in the morning obeyed the laws of physics. It was determined by pressure and temperature and the shape of the valley. It was not magic. But just because the wind obeyed physics doesn't mean anyone could have predicted it. We confuse our inability to see the future with the future being unclear. The fire was real. The physics were real. Our surprise does not make the event random. It just makes us small.

  Third, and this is the hardest part: we cannot run the experiment again. People say, "If the hose cart hadn't lost a wheel, the north side would be standing." That sounds like logic, but it is a wish wearing the clothes of a fact. You cannot change one detail in a town made of dry wood and scared people and expect the rest of the story to stay pinned in place. If the wheel holds, the men arrive sooner. But do they position the hose differently? Does the wind shift ten minutes earlier? Does the stable hand sleep instead of wake? If you rewrite the wheel, you rewrite the people, the timing, the smoke. The thread is too tangled. We don't know what would have happened. We only know what did.

  So, if it wasn't fate, and it wasn't just luck, and we can't know what else might have been, what is left?

  Choice.

  In the middle of a night nobody could predict, inside a chain of causes nobody could stop, my great-great-aunt made a decision. The hotel keeper's wife. She got out. She was safe. Then she went back in for the ledgers. She died for the books.

  We can call that foolish. We can call it brave. We can call it fate. But it was hers. It was not the wind that killed her. It was not the lamp. It was a choice made inside the chaos. When we look at the three who died—the stable hand, the boarder, and her—we are tempted to say they were taken by the fire. But she walked back into it. That action is the only thing on that night that is not subject to the wind or the wheel. It is the only thing that was truly determined, because she determined it.

  This marker is not an answer key. It will not tell you why the wind turned. It will not tell you if the town was meant to burn. It simply records that it did. We stand here today not because history had to bring us to this spot, but because we are the ones who arrived. We are the descendants of the people who rebuilt on the ash, not because it was promised, but because it was necessary.

  We honor them not by calling it providence, and not by calling it an accident. We honor them by admitting that the night was dark, the future was unknown, and they acted anyway. The fire was not inevitable. The survival was not guaranteed. The choice was real.

  Thank you.
