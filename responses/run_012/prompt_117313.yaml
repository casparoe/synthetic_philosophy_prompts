answer: |-
  Here is the instrument. It is designed to be printed on a single sheet, double-sided. The questions are phrased to force a choice based on practice, not theory.

  ### The Replication Crisis Sorting Tree

  **Start Here:** You have a dataset. It shows an effect. You want to publish.
  **Question 1:** *Where is the primary source of "error" that worries you?*
  *   **A:** In the **system** (journals, incentives, file drawers). If the rewards change, the stats don't matter. → *Go to Node 2A*
  *   **B:** In the **method** (the math itself). Even with perfect incentives, bad logic yields false conclusions. → *Go to Node 2B*

  ---

  #### Node 2A (The System View)
  **Question:** *If you fixed the incentives (no publish-or-perish, registered reports mandatory), would standard null-hypothesis testing (p < 0.05) be acceptable?*
  *   **Yes:** You think the tools are fine; the users are corrupt. → **Leaf 1: The Sociological Reformer**
  *   **No:** You think the tools themselves encourage gaming, even with good incentives. → **Leaf 2: The Pragmatic Instrumentalist**

  ---

  #### Node 2B (The Method View)
  **Question:** *You planned to collect 50 samples, but at n=40 the result looked significant so you stopped. Does this make your statistical evidence weaker?*
  *   **Yes:** Your intentions matter. The "sampling space" includes data you *could* have collected. → *Go to Node 3A*
  *   **No:** Only the data you *did* collect matters. The stopping rule is irrelevant. → *Go to Node 3B*

  ---

  #### Node 3A (The Frequentist Branch)
  **Question:** *You calculate a 95% Confidence Interval. What does the "95%" mean?*
  *   **A:** It means that if I repeated this experiment infinitely, 95% of *those* intervals would capture the truth. This specific one might not. → **Leaf 3: The Error Statistician**
  *   **B:** It means there is a 95% probability the true value is inside *this specific* interval. → **Leaf 4: The Ritual Frequentist** *(See Flag 1)*

  ---

  #### Node 3B (The Likelihood/Bayesian Branch)
  **Question:** *You need to specify a Prior distribution. What is it for?*
  *   **A:** To encode my actual subjective belief before seeing the data. → *Go to Node 4A*
  *   **B:** To stabilize the estimate / regularize the model / represent ignorance. → *Go to Node 4B*

  ---

  #### Node 4A (The Subjective Branch)
  **Question:** *Two honest experts have different priors and thus different posteriors. Is this a problem?*
  *   **No:** Rational agents can disagree forever if their starting information differs. → **Leaf 5: The Subjective Bayesian**
  *   **Yes:** Eventually, data should swamp the prior, or we need a standard way to agree. → **Leaf 6: The Calibrated Bayesian** *(See Flag 2)*

  ---

  #### Node 4B (The Objective/Tool Branch)
  **Question:** *How do you validate the model?*
  *   **A:** By internal coherence and mathematical derivation (e.g., Reference Priors). → **Leaf 7: The Objective Bayesian**
  *   **B:** By checking if the predictions hold up across many studies (frequency properties). → **Leaf 6: The Calibrated Bayesian** *(See Flag 2)*

  ---

  ### The Leaves (Positions & Commitments)

  **Leaf 1: The Sociological Reformer**
  *   **Position:** The crisis is economic, not epistemic.
  *   **The Annoying One-Liner:** "Stop blaming the p-value; blame the tenure committee."
  *   **Commitment:** You will spend more time reforming peer review than checking model assumptions.

  **Leaf 2: The Pragmatic Instrumentalist**
  *   **Position:** Stats are a rhetorical device to survive the system.
  *   **The Annoying One-Liner:** "I call it Bayesian so reviewers stop asking for a power analysis."
  *   **Commitment:** You will use whatever method gets the paper accepted, regardless of philosophical consistency. *(Note: This is where your "Fake Bayesians" end up.)*

  **Leaf 3: The Error Statistician**
  *   **Position:** Inference is about severe testing, not belief.
  *   **The Annoying One-Liner:** "Your p-value is meaningless unless you tell me when you planned to stop."
  *   **Commitment:** You reject results from "optional stopping" even if the effect size is massive.

  **Leaf 4: The Ritual Frequentist** *(See Flag 1)*
  *   **Position:** Frequentist machinery, interpreted as Bayesian probability.
  *   **The Annoying One-Liner:** "There is a 95% chance the true mean is in this specific interval."
  *   **Commitment:** You teach students a definition of probability that your own textbook says is wrong.

  **Leaf 5: The Subjective Bayesian**
  *   **Position:** Probability is degree of belief; coherence is the only virtue.
  *   **The Annoying One-Liner:** "If your prior differs from mine, we are both right."
  *   **Commitment:** You refuse to calibrate your posteriors against long-run frequencies because "probability isn't frequency."

  **Leaf 6: The Calibrated Bayesian** *(See Flag 2)*
  *   **Position:** Use Bayesian machinery, demand Frequentist performance.
  *   **The Annoying One-Liner:** "I use priors to compute, but I'll check if I'm lying to myself over 100 studies."
  *   **Commitment:** You are willing to abandon a prior if it leads to systematic errors in the long run. *(Note: Reachable from both Node 4A and 4B.)*

  **Leaf 7: The Objective Bayesian**
  *   **Position:** Priors are logical relations, not psychological states.
  *   **The Annoying One-Liner:** "This prior isn't my belief; it's the only one consistent with the symmetry of the problem."
  *   **Commitment:** You believe there is a single "correct" prior for a given state of information.

  **Leaf 8: The Likelihoodist** *(Merged with Leaf 7 for practical purposes)*
  *   **Position:** Only the likelihood ratio matters; no priors, no error rates.
  *   **The Annoying One-Liner:** "I don't care about your error rates or your beliefs, just show me the likelihood function."
  *   **Commitment:** You refuse to make a decision or claim a hypothesis is "true," only that it is "supported."

  ---

  ### Flags & Warnings

  **Flag 1: The Incoherent Path (Leaf 4)**
  *   **Status:** **Incoherent.**
  *   **Why:** This position combines a Frequentist definition of probability (long-run frequency) with a Bayesian interpretation (probability of a specific hypothesis/interval). It is the most common position in biology. It is logically untenable, though practically convenient. If a student lands here, do not let them teach statistics.

  **Flag 2: The Indistinguishable Leaves (Leaf 6 & Leaf 7)**
  *   **Status:** **Practically Indistinguishable.**
  *   **Why:** The *Calibrated Bayesian* (coming from the tool branch) and the *Objective Bayesian* often use the same mathematical machinery (e.g., weakly informative priors) and validate similarly. The difference is purely philosophical justification (performance vs. logic). In a retreat setting, you will not be able to tell them apart by looking at their code.

  **Flag 3: The Convergence (Leaf 6)**
  *   **Note:** As requested, Leaf 6 is reachable via two routes.
      1.  **From Subjective Bayes:** "I have beliefs, but I want to ensure they don't lead me astray repeatedly."
      2.  **From Objective/Tool Bayes:** "I use priors as regularizers, but I need to know they work in the long run."
      *   This is likely where the majority of your competent former students actually sit, regardless of what they call themselves.

  **Flag 4: The Missing Leaf (Likelihoodism)**
  *   **Note:** Pure Likelihoodism (Leaf 8) is theoretically distinct from Objective Bayes (Leaf 7), but in practice, they rarely diverge on conclusions unless sample sizes are tiny. I have listed them separately for philosophical purity, but expect them to sit at the same table during coffee breaks.
