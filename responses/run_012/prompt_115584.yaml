answer: |-
  You have made a remarkably sophisticated observation. Most undergraduate philosophy students do not notice the specific structural difference between the problems you identified and the standard "Is-Ought" gap. You are correct that neither Hume's Law nor Carroll's Tortoise captures the exact phenomenon you are describing, specifically because of the **semantic disguise** (the claim that the new premise is merely a "clarification of words").

  There is no single, canonical term in introductory ethics textbooks that labels this exact hybrid. However, in professional meta-ethics, this is recognized as a specific failure of **Foundationalism**. Since you are working on a project and need a precise label to "carve" this phenomenon, I will provide the closest existing technical context and then offer a precise coined term that you can use to define the boundaries of what you are seeing.

  ### 1. The Existing Landscape (Why your intuition is right)

  You correctly identified why the two nearby ideas do not fit:

  *   **Hume's Is-Ought Problem:** This describes a gap between *facts* (descriptive) and *values* (prescriptive). The arguments you are seeing do not cross that gap. They stay entirely within the "ought" realm. They argue *Ought $\rightarrow$ Ought*. The problem isn't that they are deriving value from fact; it's that they are deriving a specific obligation from a general one without securing the general one.
  *   **Carroll's Tortoise (Achilles and the Tortoise):** This describes a logical regress where a rule of inference (like *Modus Ponens*) is demanded as a premise. This is structurally identical to your observation, but it is purely formal. It does not account for the **semantic disguise**. In Carroll's puzzle, the Tortoise openly asks for the rule as a premise. In your ethics examples, the arguer claims they are *not* adding a new premise, but merely defining terms.

  ### 2. The Proposed Term: "The Semantic Normativity Regress"

  Since there is no single household name (like "Ad Hominem") for this specific hybrid, I propose you use the term **"The Semantic Normativity Regress."**

  This term is not yet standardized in introductory texts, but it is constructed from accurate philosophical components. It allows you to precisely define the "carving" you requested.

  #### Definition
  **The Semantic Normativity Regress** occurs when an argument attempts to justify a normative conclusion (an "ought") by introducing a supporting principle, and when that principle is challenged, the arguer introduces a further principle presented as a **semantic clarification** or **definition** rather than a substantive moral claim. This generates an infinite chain of normative commitments, each disguised as a linguistic truth, preventing the argument from ever reaching a foundational justification.

  ### 3. The Carving: Boundaries and Distinctions

  To use this term effectively in your project, you must distinguish it from the nearby concepts you already found. Here is the "carving" of the concept:

  #### A. It is not the Naturalistic Fallacy
  *   **The Naturalistic Fallacy (Moore):** This occurs when someone defines a moral term (like "Good") using a *natural* property (like "Pleasure" or "Evolutionary Fitness"). Moore argues you can always ask, "But is pleasure *good*?"
  *   **The Semantic Normativity Regress:** This does not try to define "Good" as "Pleasure." It tries to define "Ought" in terms of other "Oughts" (e.g., "Wrong *means* what we ought not to do"). It stays within the normative realm. The error is not reducing value to fact, but **kicking the normative can down the road** while claiming to be stationary.

  #### B. It is not Hume's Is-Ought Gap
  *   **Hume's Gap:** Concerns the jump from *Description* to *Prescription* (e.g., "Suffering exists" $\rightarrow$ "Stop suffering").
  *   **The Semantic Normativity Regress:** Concerns the jump from *Prescription* to *Further Prescription* (e.g., "Stop suffering" $\rightarrow$ "Because you ought not cause suffering" $\rightarrow$ "Because 'ought' implies..."). The premises are all normative; the failure is one of **justification**, not category.

  #### C. It is not Carroll's Tortoise (Purely)
  *   **Carroll's Tortoise:** A problem about **Logic**. It shows that logical rules cannot be fully justified by more premises without circularity.
  *   **The Semantic Normativity Regress:** A problem about **Meaning and Value**. It exploits the ambiguity between *substantive claims* (moral commitments) and *analytic claims* (definitions). The arguer tries to hide a moral commitment inside a definition to make it immune to challenge.

  ### 4. Why This Happens (The Philosophical Context)

  For your project, it will be helpful to explain *why* people do this. This pattern usually arises from a desperate attempt to be a **Moral Foundationalist**.

  *   **Foundationalism:** The view that moral arguments must rest on a basic, self-evident truth (a foundation) that needs no further support.
  *   **The Trap:** When a student or philosopher cannot find a self-evident foundation, they try to create one by **stipulation**. They say, "This isn't a moral opinion; it's just what the word *means*."
  *   **The Regress:** But definitions in ethics are rarely neutral. To define "Wrong" as "What we ought not to do" is not a linguistic fact; it is a moral stance (Internalism). When challenged, the arguer must define the new terms, leading to the regress you noticed.

  ### 5. How to Use This in Your Project

  If you use the term **"The Semantic Normativity Regress,"** you can structure your critique as follows:

  1.  **Identify the Move:** "The arguer claims premise B is just a definition of premise A."
  2.  **Expose the Normativity:** "However, this definition carries moral weight. It is not a neutral dictionary fact; it is a moral commitment."
  3.  **Show the Regress:** "Because it is a moral commitment, it requires justification. When the arguer provides justification, they offer another definition (Premise C). This creates a Semantic Normativity Regress."
  4.  **Conclude:** "The argument fails not because it derives an 'ought' from an 'is,' but because it attempts to hide an infinite chain of 'oughts' behind a finite chain of definitions."

  ### Summary for your Project

  *   **Name:** The Semantic Normativity Regress.
  *   **Core Feature:** Normative premises disguised as semantic definitions.
  *   **Result:** An infinite chain of justification where no premise is ever actually secured.
  *   **Distinction:** Unlike Hume (Is $\rightarrow$ Ought), this is Ought $\rightarrow$ Ought. Unlike Carroll (Logic), this relies on the ambiguity of moral language.

  You have identified a genuine structural weakness in many informal ethical arguments. Giving it a precise name will demonstrate a high level of meta-ethical understanding in your project.
