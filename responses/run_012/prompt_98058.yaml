prompt: |-
  heyy so I'm in a philosophy of physics course right now and we're doing the arrow of time unit, and before I write my essay I want to lay out my actual position and find out if it even hangs together. here's where I've landed:

  (1) B-theory of time: all times are equally real, 'now' is just indexical, and the passage or flow of time isn't a real feature of the world.
  (2) The arrow of time is nothing over and above the thermodynamic arrow — the future is just the direction of entropy increase.
  (3) The Second Law isn't fundamental, it's statistical, and what makes it hold is the Past Hypothesis, i.e. the universe started in an absurdly low-entropy macrostate, plus a uniform measure over initial conditions. I don't think that measure can be derived from the dynamics at all, it just comes with the statistical postulate.
  (4) The underlying dynamics are time-reversal invariant (yes I know about the weak interaction, I'm setting it aside), so nothing in the laws themselves picks out a direction.
  (5) All the same, I think there's a genuine, non-perspectival fact about which direction is the future. I really don't want to end up saying the arrow is just an artefact of our coarse-graining or our psychology.
  (6) Causation isn't fundamental — causal asymmetry is inherited from the entropy gradient, so cause and effect are downstream of thermodynamics.
  (7) The deepest way to state the arrow is in terms of records: a subsystem is a record if its state carries information about an earlier lower-entropy state and not the other way round. That's what makes the asymmetry real instead of conventional.

  I cant tell if some of these are genuinely in conflict or if I'm just conflating flow with order, or objectivity with non-perspectivality. Which pairs are actually in tension, which only look like it, and how bad is each one? Please rank them by severity, and for each say the cheapest thing I'd have to give up, and flag any apparent clash that isn't really a clash so I stop worrying about it.
