      *   *Critique:* The "Value-Ladenness" point. Hypertension is a great example. Is BP > 130 a disease or a risk factor threshold based on insurance math? Szaszians love this. Clinicians argue organ damage is objective. I need to balance this.

  10. **Final Structure:**
      *   Header (Document Meta-data).
      *   Preamble (Purpose).
      *   Section 1: Semantic Audit (Defining "Disease").
      *   Section 2: Joint Assertions (Common Ground).
      *   Section 3: Taxonomy of Disagreement (The Table).
