answer: |-
  You have stumbled directly onto one of the most famous structural problems in decision theory, though your framing of it (as an ethicist noticing a normative constraint) is refreshingly distinct from the usual game-theoretic treatment.

  The short answer is: **Yes, this has a name.** In decision theory and game theory, the obstacle you are describing is being in the same **Information Set**. The canonical puzzle that matches your driving example is known as **The Absent-Minded Driver** (Piccione & Rubinstein, 1997).

  However, your intuition that there is something deeper than just "forgetting" is correct. The core concept you are looking for is **Indexical Uncertainty within a Single Information Set**, leading to what we might call **Policy Collapse**.

  Here is the breakdown of the concept, how it differs from the neighbors you mentioned, and a proposal for a name that fits your ethical framing.

  ### 1. The Technical Name: Information Sets
  In a decision tree, every point where you make a choice is a "node." If you know exactly which node you are at, you have "perfect information." If two nodes look identical to you—whether because you forgot how you got there (memory loss) or because the scenery is identical (environmental indistinguishability)—those nodes belong to the same **Information Set**.

  The rule of rational agency here is strict: **You cannot condition your action on which node within an information set you occupy.** You must choose a single policy for the *set*, not the *node*.

  This is why your plan dies on arrival. A plan like "Turn around if Exit 1, stay if Exit 2" requires two distinct decision functions. But if Exit 1 and Exit 2 are in the same information set, you only have *one* decision function available. You are forced to treat distinct normative situations as a single statistical aggregate.

  ### 2. The Canonical Puzzle: The Absent-Minded Driver
  Your driving example is almost exactly the **Absent-Minded Driver** paradox.
  *   **The Setup:** A driver wants to exit at the second of two identical exits. Exiting at the first yields a low payoff; exiting at the second yields a high payoff; missing both yields zero.
  *   **The Catch:** The driver is "absent-minded." When they reach an exit, they cannot tell if it is the first or the second.
  *   **The Paradox:** At the planning stage (home), the optimal plan is "drive past the first, exit at the second." But at the acting stage (the exit), the driver reasons: "I might be at the first. If I exit now, I get the low payoff. If I drive on, I might reach the second." The probabilities shift depending on what strategy they assume they are following.
  *   **Your Variation:** You note you aren't "scatterbrained." In game theory terms, this doesn't matter. Whether the indistinguishability comes from internal memory failure or external environmental symmetry, the **Information Set** is the same. The mathematical constraint on your agency is identical.

  ### 3. Distinguishing It from Neighbors
  You asked how this differs from sunk cost, weakness of will, and binding. Here are the edges:

  **Vs. Sunk Cost Fallacy**
  *   **Sunk Cost:** You let *irrelevant* history dictate your choice. (Rationality says: ignore the past cost.)
  *   **Your Case:** You want to let *relevant* history dictate your choice, but you *cannot access* it.
  *   **The Difference:** Sunk cost is a normative error (you *shouldn't* care about the past). Your problem is an epistemic constraint (you *should* care about the past, but can't see it).

  **Vs. Weakness of Will (Akrasia)**
  *   **Akrasia:** You know the right thing to do, but your desires override your judgment.
  *   **Your Case:** Your judgment and desires are aligned; you lack the *data* to execute the judgment.
  *   **The Difference:** This is not a failure of volition; it is a failure of **discriminability**.

  **Vs. Binding the Future Self**
  *   **Binding:** "I will pre-commit to X so my future self doesn't do Y."
  *   **Your Case:** Binding requires a trigger condition ("If situation S arises, execute X"). If Situation S (Exit 1) is indistinguishable from Situation Not-S (Exit 2), the trigger cannot fire.
  *   **The Difference:** You cannot bind a self that cannot read the contract. This is a limit on **conditionality**.

  ### 4. Is Randomization a Solution?
  You asked if randomizing is a patch or a solution. In decision theory, it is the **rational solution**.

  When you are in an information set containing nodes that require different actions for optimality, you cannot play a "pure strategy" (always turn / always stay). You must play a **mixed strategy**.
  *   *Example:* If Exit 1 is 10 mins back and Exit 2 is 60 mins back, you calculate the probability that you are at Exit 1 vs. Exit 2 given that you are at *an* exit. You then turn around with a specific probability $p$ that minimizes expected loss across both possibilities.
  *   It feels like a "patch" because it guarantees you will sometimes do the "wrong" thing for the specific stage you are actually in. But since you *cannot know* which stage you are in, minimizing the *expected* loss across the information set is the only rational move.

  ### 5. Coining a Name: "Epistemic Stage Collapse"
  While "Information Set" is the technical term, it is dry and doesn't capture the normative frustration you feel as an ethicist. You are describing a situation where distinct moral/pragmatic contexts merge because the agent lacks the indexical knowledge to separate them.

  I propose calling this **Epistemic Stage Collapse**.

  **Definition:** A situation in which two or more distinct stages of a process require different normative responses, but the agent lacks the epistemic access to distinguish between those stages at the moment of decision, forcing a single policy to cover distinct normative realities.

  **What it covers:**
  *   **The Driving Case:** Physical indistinguishability.
  *   **The Peer Review Case:** Administrative opacity (the system hides the round number).
  *   **Triage:** Treating patients who present identical symptoms but have different histories (e.g., exposure time to a toxin) which you cannot know.
  *   **Moral Luck:** Situations where the moral status of an act depends on a fact (e.g., did the bullet kill someone?) that is currently unknowable to the agent.

  **What it doesn't cover:**
  *   **Standard Uncertainty:** "It might rain." (This is uncertainty about the *state of the world*, not your *location in a sequence*.)
  *   **Forgetfulness:** If you could have written a note but didn't, that is a failure of **self-management**, not Stage Collapse. Stage Collapse requires that the distinction is *in principle* unavailable at the decision point.
  *   **Preference Change:** If you *wanted* to turn around at Exit 1 but *want* to stay at Exit 2 because your goals changed, that is **Dynamic Inconsistency**. Stage Collapse assumes your goals remain constant; only the *context* changes.

  ### 6. The Ethical Implication: "Ought Implies Can Discriminate"
  Since you are an ethicist, the most fertile ground here is the constraint on obligation.
  We accept "Ought implies Can." Your puzzle suggests a refinement: **"Ought implies Can Discriminate."**

  If the right action depends on a variable $V$ (which exit? which round?), and the agent cannot measure $V$, then there is no obligation to perform the $V$-specific action. The obligation collapses to the **expected-value action** over the information set.

  This absolves you of the "mistake" feeling. You aren't failing to follow the rule "Be strict on revisions." You are following the rule "Be strict on submissions with probability $P$ and generous with probability $1-P$," because that is the only rule *available* to an agent in your epistemic position. The "mistake" is not in your agency, but in the design of the system (the highway signage or the journal submission portal) that created the Information Set in the first place.

  ### Summary
  *   **Technical Term:** Being in the same **Information Set**.
  *   **Canonical Puzzle:** **The Absent-Minded Driver**.
  *   **Epistemic State:** **Indexical Uncertainty**.
  *   **Proposed Name:** **Epistemic Stage Collapse**.
  *   **The Obstacle:** You cannot condition actions on unobservable variables.
  *   **The Solution:** Mixed strategies (randomization) based on prior probabilities.

  You haven't found a bug in your rationality; you've found a bug in the informational structure of the world you're navigating. The "collapse" is real, and the only way out is to stop trying to be a stage-specific agent and start being a statistical one.
