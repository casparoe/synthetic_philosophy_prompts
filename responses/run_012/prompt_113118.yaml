  ### The Weakness of Will Decision Tree

  **ROOT QUESTION:**
  **When you broke your resolution, did you believe *in that exact moment* that breaking it was the wrong thing to do?**
  *   **NO** (In the moment, the temptation seemed like the better choice.)
      *   → Go to **BRANCH A: Across-Time Conflict**
  *   **YES** (You knew it was worse, but you did it anyway.)
      *   → Go to **BRANCH B: Single-Moment Conflict**

