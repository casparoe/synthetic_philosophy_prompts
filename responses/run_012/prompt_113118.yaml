  *This branch captures the Behavioral Economics view: The "You" of 11 PM and the "You" of 11:05 PM have different utility functions.*

  **NODE A1:**
  **When your preference flipped, was it because the temptation became more *valuable* to you, or simply because it was *immediate*?**
  *   **More Valuable** (You care about the *pattern* of behavior, and breaking the pattern changes the value of the act.)
      *   → **LEAF 1: Picoeconomics / Dual-Self (Ainslie)**
      *   *Note:* This treats the agent as a population of competing selves bargaining over rules. The value changes because breaking a rule devalues future credibility.
  *   **Simply Immediate** (The object didn't change, but your discount rate spiked due to proximity.)
      *   → Go to **NODE A2**

  **NODE A2:**
  **Did you know in advance that you would likely cave when the moment arrived?**
  *   **YES** (You anticipated the weakness and perhaps tried to bind yourself.)
      *   → **LEAF 2: Sophisticated Present Bias**
      *   *Note:* This is the Ulysses position. You recognize the time-inconsistency and employ commitment devices.
  *   **NO** (You genuinely believed you would stick to the plan until you didn't.)
      *   → **LEAF 3: Naive Present Bias**
      *   *Note:* Standard hyperbolic discounting. You are surprised by your own reversal.

  ---

  #### BRANCH B: Single-Moment Conflict (Strict Akrasia)
  *This branch captures the Philosophical view: A conflict between Judgment and Action within a single, unitary timeframe.*

  **NODE B1:**
  **Did you make a genuine attempt to resist that failed, or could you not even bring yourself to try?**
  *   **Could Not Try** (You were paralyzed by a lack of volition or energy before the struggle began.)
