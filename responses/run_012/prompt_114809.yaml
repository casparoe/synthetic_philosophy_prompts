answer: |-
  Here is a reading of *The Tempest* through the specific lens of Aristotle's *Politics* Book I, designed to move your seminar beyond the colonial allegory and into the philosophical anthropology of the text.

  ### The Verdict

  Shakespeare does not simply dramatize Aristotle's natural slave, nor does he offer a modern liberal refutation of it. Instead, the play demonstrates that the concept of natural slavery is **epistemologically unstable in practice**.

  While Aristotle admits that nature often fails to mark the distinction between the naturally free and the naturally servile, he maintains the distinction is real. *The Tempest* goes further: it suggests that the power dynamic itself obscures the "nature" of the subordinate. Once a master-subject relationship is established (whether by conquest or necessity), the master is incentivized to interpret any resistance or failure as proof of natural inferiority, while any utility is interpreted as proof of successful training. The play validates Aristotle's fear that conventional slavery (rule by force) breeds enmity, but it adds a complication Aristotle misses: the master becomes dependent on the slave's "nature" to justify his own identity as a ruler. Prospero cannot afford for Caliban to be naturally free, because if Caliban is free, Prospero's harsh rule is merely tyranny.

  ### Testing the Criteria: Aristotle vs. The Island

  To lead this discussion, you must hold Aristotle's specific criteria against the specific behaviors of Caliban and Prospero.

  **1. The Possession of Reason**
  Aristotle distinguishes between *perceiving* reason (which the slave can do) and *possessing* it (the capacity for deliberation and command).
  *   **The Complication:** Caliban clearly possesses reason in the Aristotelian sense. He deliberates (the conspiracy), he negotiates (offering to show the island's resources), and he articulates a claim of right (inheritance). However, Prospero frames Caliban's reason as purely instrumental. When Caliban plots against Prospero, Prospero cites it as proof of his "vile race," not as political resistance.
  *   **The Aristotelian Tension:** Aristotle warns that if you enslave someone who is naturally free, you create an enemy. Caliban is the embodiment of this enmity. But Prospero insists the enmity proves the nature, whereas Aristotle suggests the enmity proves the *injustice of the arrangement*. The play leaves this loop unbroken.

  **2. The Advantage of Rule**
  Aristotle argues natural rule must be advantageous to the ruled, not just the ruler (like the soul ruling the body).
  *   **The Complication:** Prospero claims his harsh rule was for Caliban's good ("I pitied thee, took pains to make thee speak"). When Caliban fails (the assault on Miranda), Prospero shifts to punitive containment.
  *   **The Verdict:** The play shows that when the "benefit" is defined solely by the master, the criterion becomes meaningless. Caliban is better off under Prospero only insofar as he avoids physical pain; he is worse off in terms of autonomy and dignity. The play suggests that without the consent of the ruled, the "advantage" is indistinguishable from pacification.

  **3. The Bodily and Psychological Marks**
  Aristotle concedes nature often fails to stamp the body to match the soul.
  *   **The Complication:** Caliban is described in monstrous, fish-like terms (the body of a slave), yet he speaks with a poetic sensitivity to the island's sounds and dreams that exceeds Prospero's utilitarian magic (the soul of a free man, or perhaps a poet).
  *   **The Verdict:** This is the strongest evidence against the stability of the theory. If the "animate tool" appreciates beauty and articulates grief better than the master, the hierarchy of soul is inverted, even if the hierarchy of power remains.

  **4. Friendship and Recognition**
  In the *Nicomachean Ethics*, Aristotle questions if friendship is possible with a slave *qua* slave, or only *qua* human.
  *   **The Complication:** In the final scene, Prospero does not free Caliban. He says, "I acknowledge mine." This is not friendship, but it is a recognition of responsibility. He admits Caliban is not merely a tool, but a being for whom he is answerable.
  *   **The Verdict:** The play denies the clean break of manumission. Caliban remains on the island, presumably under continued supervision. Shakespeare suggests that after a certain duration of coercion, the relationship cannot be reset to "free," only to "acknowledged."

  ### The Ariel Distinction

  Your students often conflate Ariel and Caliban. Separating them is key to the Aristotle reading.

  *   **Ariel** represents **contractual service**. He serves to pay a debt (freedom from the tree) and works toward a specific end (liberation). He obeys instantly but reminds Prospero of the promise. This fits a free artisan or mercenary, not a slave.
  *   **Caliban** represents **ontological bondage**. Prospero argues Caliban is incapable of freedom because of his lineage and his moral failure regarding Miranda.

  **Why this matters:** The existence of Ariel proves Prospero *can* rule through contract and promise. He chooses not to with Caliban. This implies Caliban's slavery is not a necessity of governance (as Aristotle might argue for the stability of the household) but a specific choice by Prospero to treat Caliban as naturally inferior. The presence of a free servant highlights the unfreedom of the other.

  ### Pedagogical Plan: Scenes and Questions

  Do not start with the colonial context. Start with the household management.

  **Scene 1: Prospero's Indictment (Act 1, Scene 2)**
  *   **Context:** Prospero explains to Miranda why Caliban is confined. He details the education provided and the betrayal attempted.
  *   **Ask:** Aristotle says the natural slave is one who can perceive reason but lacks the deliberative faculty to govern themselves. Does Prospero's account of Caliban's education sound like the training of a rational being who failed, or the breaking of a will?
  *   **Follow-up:** If Caliban was capable of learning language and concepts (as Prospero admits), at what point did he lose the capacity for reason? Was it at the assault on Miranda? If so, is his slavery a punishment for a crime, or a statement about his nature? (Aristotle distinguishes between criminal justice and natural status).

  **Scene 2: The Drunken Conspiracy (Act 2 & 3)**
  *   **Context:** Caliban encounters Stephano and Trinculo. He mistakes them for gods, then plots to kill Prospero.
  *   **Ask:** The colonial reading sees this as resistance. The Aristotelian reading might see this as proof of Caliban's inability to rule himself (he trades one master for a drunkard). Which is it?
  *   **Crucial Nuance:** Ask students to look at *why* Caliban chooses Stephano. Is it stupidity, or is it a rational calculation that Stephano offers a better deal (liquor/freedom) than Prospero (work/pain)? If it is a calculation, does that not prove he possesses the deliberative reason Aristotle says he lacks?
  *   **The Trap:** If students say Caliban is "too drunk to know better," point out that Prospero is also obsessed with controlling the island through intoxication and spectacle. Who is actually governing themselves here?

  **Scene 3: The Resolution (Act 5)**
  *   **Context:** Prospero confronts the conspirators. He forgives Alonso and Antonio. He dismisses Caliban with "go to my cell."
  *   **Ask:** Aristotle suggests rule should aim at virtue. Has Prospero made Caliban more virtuous, or merely more subdued?
  *   **Ask:** Prospero says, "This thing of darkness I acknowledge mine." Why "acknowledge" rather than "forgive" or "free"? Does this admission suggest that the master is bound to the slave as much as the slave is bound to the master?
  *   **Final Question:** If Caliban stays on the island, is the ending a restoration of order (Aristotelian) or a continuation of the conflict (Tragic)?

  ### Addressing the Co-Instructor's Objection

  Your co-instructor worries you are overreading the philosophical intent. You can concede that Shakespeare is not writing a commentary on the *Politics*. However, the *dramatic* problem Shakespeare sets up mirrors the *philosophical* problem Aristotle identifies.

  *   **The Objection:** The play is a romance; its logic is magical and theatrical, not political. Caliban is a monster for the stage, not a case study.
  *   **The Defense:** Precisely because it is a romance, the "monstrosity" is symbolic. If Caliban were merely a beast, he wouldn't speak verse. If he were merely a villain, he wouldn't express such profound attachment to the island's beauty. The genre forces the audience to feel the contradiction that Aristotle theorizes: the dissonance between how a person *appears* (a monster/slave) and how they *speak* (a poet/free man). The play forces the audience to judge the "nature" that Prospero claims to know.

  ### What the Play Adds to the Debate

  Modern critics focus on the *politics* of the relationship (oppressor/oppressed). Aristotle focuses on the *taxonomy* (free/slave). *The Tempest* adds the **aesthetic and affective dimension**.

  1.  **Poetic Reason:** Aristotle does not account for the kind of reason that produces poetry. Caliban's speeches about the clouds and noises show a form of wisdom that is neither "ruling" nor "serving." It suggests a mode of being that the master/slave dialectic cannot capture. Prospero rules the island, but Caliban *knows* it. This challenges the Aristotelian idea that the master is the one with the superior knowledge of how to live.
  2.  **The Master's Dependency:** Aristotle focuses on the slave's need for a master. Shakespeare shows the master's need for the slave. Prospero needs Caliban to fetch wood and maintain the cell; he needs Ariel to perform the magic. Without them, he is just an old man on a rock. The play reveals that the "self-sufficient" household head is actually deeply dependent on those he claims are merely tools.
  3.  **The Ambiguity of "Acknowledgment":** Aristotle seeks clarity (is he or isn't he a slave?). Shakespeare offers ambiguity. Caliban is not freed, but he is "acknowledged." This suggests that in the real world, the transition from slavery to freedom is not a binary switch but a messy negotiation of recognition. The play leaves Caliban on the island, forcing the audience to sit with the unresolved tension of a "natural slave" who has the last word.

  **Summary for the Class:**
  Tell your students: "Aristotle asks if there is such a thing as a slave by nature. Shakespeare asks: If there were, could a master ever recognize him without corrupting himself in the process? The play suggests that the act of mastering destroys the evidence needed to justify the rule."
