answer: |-
  1. Divide the sixteen students into four groups of four, each receiving a sealed envelope containing a "State Card" (Red or Black) and a payoff matrix sheet. Each group acts as a single agent, designating one member as the final Decider while the others observe and record. You will need two decks of cards (one for states, one for signals) and printed payoff tables that assign utility points to outcomes based on the State and the Action chosen.

  2. Run four rounds where groups choose an Action, with Rounds 2 through 4 offering an optional signal before the choice is finalized. In Round 2, the signal reveals the State Card; in Round 3, viewing the Card triggers a utility penalty; in Round 4, the signal predicts the Decider's own upcoming choice. Groups may freely decline the signal in any round, but once viewed, they must update their choice before sealing their final Action Card.

  3. Assign 100 points for matching Action to State, 0 for mismatching, but subtract 40 points immediately if the State is revealed to be "Black" in Round 3 to model belief disutility. In Round 4, award 0 points if the signal accurately predicts their final choice, modeling a penalty for being predictable, whereas defying the prediction yields 100 points. These specific numbers ensure information is valuable in Round 2, costly in Round 3 due to state-dependent utility, and destabilizing in Round 4 due to causal feedback.

  4. Connect Round 2 to Good's theorem by showing how information weakly dominates ignorance when utility depends only on outcomes. Contrast this with Round 3, where utility depends on the belief state itself, violating the assumption that information affects payoffs only through action. Finally, explain Round 4 as a violation of the exogeneity assumption, where the signal causally influences the state it predicts.

  5. Students will likely treat the Round 3 penalty as a monetary cost rather than a genuine preference over belief states, requiring you to reframe utility as inclusive of emotional satisfaction. The activity cannot reproduce the ex ante expectation calculation, so you must verbally explain that Good's theorem guarantees value before the signal is seen, not necessarily after the specific outcome is realized.
