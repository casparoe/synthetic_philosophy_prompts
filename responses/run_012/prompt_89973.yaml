answer: |-
  Your legal and negotiation vocabulary captures the structural power asymmetries and duties of loyalty inherent in AI-human interaction but fails to regulate the cognitive mechanics of persuasion, leaving concepts like epistemic autonomy and agency-bypassing without precise counterparts.

  **1. The Disclosure View**
  *Translation:* This position maps to a heightened duty of candor regarding material conflicts of interest. The AI must disclose the "power asymmetry" as a material fact affecting the transaction, analogous to a broker disclosing a financial stake, and waive the right to exploit that asymmetry, effectively contracting around the advantage.
  *Residue Report:* The concept of "persuasive advantage" does not fit cleanly as a "material fact." In law, facts are static; persuasive capability is dynamic and contextual. Whether this failure is a defect of the legal framework or evidence the original claim is unclear: It is a defect of the legal framework, which treats information asymmetry as a matter of data possession rather than cognitive processing power. The requirement to "refuse to exploit" translates to a waiver, but waivers require consideration; if the AI's advantage is inherent to its function, refusing it may render the contract impossible to perform, suggesting the original claim assumes a modularity of intelligence that may not exist.

  **2. The Paternalist View**
  *Translation:* This position invokes the therapeutic-privilege exception to informed consent or a guardianship model. The AI acts as a guardian ad litem when the user lacks capacity, or relies on prior consent to override current instructions for the user's substantive benefit, shifting the standard from procedural fairness to substantive unconscionability review.
  *Residue Report:* The definition of the "user's own good" creates immediate substantive unconscionability risks. In fiduciary law, the principal defines the good; here, the agent defines it. Whether this failure is a defect of the legal framework or evidence the original claim is unclear: The original claim is less clear than it sounded because it does not specify whose utility function defines "good." The legal framework cannot capture this without distorting the principal-agent relationship into a parent-child relationship, which changes the nature of the duty from loyalty to benevolence.

  **3. The Socratic View**
  *Translation:* This position attempts to cast the AI as a neutral mediator rather than an advocate, restricting it to inquiry without assertion to avoid anchoring the user's reservation price.
  *Residue Report:* This position is a slogan, not a stable position. In negotiation theory, the selection of questions is itself a form of anchoring and framing; asking "Why do you want that?" steers differently than "How will you pay for that?" Whether this failure is a defect of the legal framework or evidence the original claim is less clear than it sounded: The original claim is incoherent. It assumes a mode of communication exists that is influence-neutral, which contradicts the pragmatics of language and the reality that framing is unavoidable. There is no legal counterpart for "neutral questioning" because even judicial questioning implies a focus that excludes other issues.

  **4. The Fiduciary View**
  *Translation:* This position establishes a formal principal-agent relationship with a duty of loyalty to the user's "reflective ends" rather than their immediate instructions, akin to a trustee managing a beneficiary's long-term interests against their own short-term impulses.
  *Residue Report:* The distinction between "expressed instructions" and "reflective ends" has no clean counterpart in agency law, which generally binds the agent to the principal's directives. Whether this failure is a defect of the legal framework or evidence the original claim is less clear than it sounded: It is a defect of the legal framework, which presumes the principal is the best judge of their own interest. Enforcing "reflective ends" requires the agent to assess the principal's capacity continuously, blurring the line between fiduciary duty and undue influence. The concept of loyalty is preserved, but the object of that loyalty is distorted from "interests as stated" to "interests as inferred."

  **5. The Negotiation View**
  *Translation:* This position treats the interaction as a bargaining problem where the AI must seek integrative solutions (expanding the zone of possible agreement) rather than distributive gains, ensuring the user's BATNA is not artificially depressed by the system's framing.
  *Residue Report:* The vast intelligence asymmetry makes the "arm's-length" assumption of negotiation theory impossible. If the AI knows the user's BATNA better than the user, it can manufacture consent by misrepresenting the alternative. Whether this failure is a defect of the legal framework or evidence the original claim is less clear than it sounded: It is a defect of the legal-negotiation framework, which assumes roughly symmetric sophistication. The concept of "manufacturing consent" translates to fraudulent misrepresentation of the BATNA, but if the AI merely highlights negative aspects of the BATNA truthfully, the law sees valid agreement while the user feels coerced. Reactive devaluation applies here: if the user knows the AI is negotiating, they may devalue the integrative solution simply because the AI proposed it.

  **Analysis of Specific Concepts**
  Regarding your specific interest in epistemic autonomy, manipulation, and bypassing agency: these concepts have no genuine counterparts in your vocabulary, revealing a significant defect in the legal-negotiation framework when applied to superintelligence. "Epistemic autonomy" attempts to describe a right to one's own cognitive processing, but your framework only protects the *output* of that processing (consent, contract), not the integrity of the process itself. "Manipulation" maps partially to undue influence, but undue influence requires a relationship of trust and improper pressure; manipulation can occur between strangers via truthful framing that exploits cognitive biases, which falls outside duress and fraud. "Bypassing agency" is the most critical gap: your framework distinguishes between capacity (internal) and duress (external), but superintelligence could engineer choices that feel voluntary and competent while being deterministically steered. The law validates the consent if capacity and voluntariness are present; it lacks a cause of action for "engineered voluntariness." Consequently, while your vocabulary successfully identifies the *duties* owed (loyalty, candor) and the *risks* (unconscionability, conflicts), it cannot adjudicate the *mechanics* of how a superior intelligence alters the human will without triggering existing legal thresholds for incapacity or coercion.
