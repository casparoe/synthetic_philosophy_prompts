          2.  GEB Students (love "strange loops," prone to mysticism/over-extension).
          3.  Robotics Club (computationalists/physicalists, hate category errors, think minds = machines).
      *   **Thesis:** The Lucas-Penrose anti-mechanist argument is a bad foundation for the Gödel-mind analogy. Instead, focus on the capacity to *revise* the system (add the Gödel sentence as an axiom). This is the "Escape-Hatch Reading." Self-reference allows description; minds allow rewriting.
      *   **Deliverable:** Q&A prep sheet.
          *   Objections ordered by likelihood/damage.
          *   Phrased in the voice of the objector.
          *   Two-minute reply for each.
