answer: |-
  **Meridian Trust for the Abatement of Suffering**
  **Grantmaking Guidelines & Frequently Asked Questions**

  **1. How does the Meridian Trust define positive impact?**
  The Trust operates under an asymmetrical welfare calculus. We recognize suffering as a definitive moral negative, whereas pleasure and happiness are not moral positives that offset suffering. Consequently, our grants are ranked exclusively by units of suffering averted or mitigated. Projects designed to increase happiness, fulfill potential, or create meaningful experiences are ineligible unless they incidentally reduce pain. A world with fewer happy beings is preferable to a world with more happy beings if the total aggregate suffering is lower in the former. Our metric is subtraction, not addition.

  **2. Do you fund life-extension or emergency medical interventions?**
  Funding is contingent on the projected suffering trajectory of the subject. Preventing a painful death is prioritized only if the alternative existence does not constitute a net increase in future suffering exposure. For example, an intervention that prevents a painful death but extends a net-happy life is scored as morally irrelevant, or potentially as a cost, because it prolongs the subject's vulnerability to future pain. We do not fund life extension for its own sake. Extending a lifespan extends the window of risk. Therefore, palliative care is funded at higher rates than curative care when the cure implies decades of additional sentient exposure to inevitable decline.

  **3. What is the Trust's position on population growth and contraception?**
  Each new sentient being represents a new locus of possible suffering. Therefore, the Trust does not fund any initiative that increases the sentient population, regardless of the projected quality of life for those beings. Conversely, we view contraception as a primary intervention vector. Preventing a birth prevents the potential suffering of that future being. Accordingly, a grant proposal for contraception distribution among cheerful, stable populations is evaluated with the same seriousness as palliative care for a single suffering animal. Both interventions prevent equivalent units of potential or actual suffering. The happiness of the prospective parents is not weighed against the non-existence of the prospective child.

  **4. Critics argue your framework is inherently anti-life. How do you respond?**
  The Trust is not anti-life; it is anti-suffering. However, we acknowledge that life is the current primary substrate for suffering. We evaluate proposals based on their efficacy in reducing negative welfare metrics. If a proposed pathway involves the humane reduction of the sentient population to achieve a state of zero suffering, such proposals are within our scope for consideration. We do not preclude methods that abolish suffering by abolishing sufferers, provided the abolition itself does not incur disproportionate suffering during the transition. We remain open to all logical endpoints of our axiology, including those that human intuition finds difficult to articulate.

  **5. Are there restrictions on donor motivations or acceptance criteria?**
  The Trust accepts capital from all sources provided the funds are not derived from direct infliction of suffering. We acknowledge that the act of donating may generate a sense of satisfaction or pleasure for the donor. While this positive sensation is morally neutral within our calculus, it does not invalidate the utility of the capital. We accept the donation despite the donor's pleasure, not because of it. The resource acquired allows for the reduction of suffering elsewhere, which outweighs the moral irrelevance of the donor's emotional state. We do not require donors to feel bad, only that the funds are deployed to make others feel less bad.
