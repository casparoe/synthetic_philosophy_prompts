answer: |-
  **1. The Phenomenon of Dilation**

  There's a situation where you update your beliefs on new evidence, but instead of narrowing down your uncertainty, your range of probabilities actually gets wider. It looks like learning something new makes you less committal than you were before. Is that a defect in your theory, or are you saying this is genuinely how uncertainty works?

  **Follow-up:** You'll likely say the range is just answering honestly to evidence that fails to discriminate. But suppose every single precise probability inside your range agrees that the evidence is irrelevant. Does the range still widen? If it doesn't, why is this phenomenon treated as a major feature of your view? If it does, aren't you creating uncertainty out of nothing?

  **2. Decision and Action**

  When you have to make a decision with a range of probabilities, what rule tells you what to pick? Why should we use that rule instead of just planning for the worst-case scenario?

  **Follow-up:** Let's say you pick a rule. Couldn't an observer describe any choice you make as if you were just getting the best outcome for some single number inside your set? If I can always describe your action that way, what actual work is the interval doing in explaining your choice?

  **3. The Nature of the State**

  Is a degree of belief represented by an interval a single, distinct kind of mental state, or is it just a representation of you being unsure about what your precise confidence really is?

  **Follow-up:** If it's a distinct state, how can you hold it wrongly? With a precise number, you can miss the target. With a range, what counts as a mistake?

  **4. The Diachronic Question**

  We usually think you should defer to your better-informed future self. But how do you do that when their future range of uncertainty doesn't overlap with yours, or is shaped differently?

  **Follow-up:** If their future range sits entirely outside yours, does your theory force you to ignore them? Or do you have to say they are wrong?

  **5. The Case for Precision**

  What would have to be true about the world, or about us, for you to conclude that precise numbers were the right ideal after all?

  **Follow-up:** I need you to either name a specific kind of case that would change your mind, or concede that no possible case could. If it's the latter, isn't this a matter of philosophical preference rather than a conclusion driven by evidence?
