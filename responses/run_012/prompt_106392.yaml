answer: |-
  ### Philosopher's Margin Notes
  *(Before we dive in, here is where my head is at as I read your summary. This is the "internal monologue" of someone who teaches this stuff.)*

  **What the distinction is actually doing:**
  Ryle isn't trying to carve up the brain. He's fighting a specific picture of the mind: the "Ghost in the Machine." The intellectualist picture says intelligent action happens because a mental act (thinking a thought/rule) precedes the physical act. Ryle says this is a *category mistake*. Intelligent action isn't caused by theory; it *is* the disposition to act in certain ways. The distinction is metaphysical and explanatory, not primarily psychological or neurological.

  **Where people usually go wrong:**
  1.  **Psychologizing Ryle:** Treating his conceptual claims as empirical hypotheses about brain modules (procedural vs. declarative). Ryle was doing ordinary language philosophy, not cognitive science.
  2.  **The "Ineffability" Trap:** Assuming know-how must be inarticulable. Ryle's point isn't that you *can't* talk about it, but that talking about it isn't *what constitutes* the skill.
  3.  **The "Collapse" Confusion:** Thinking that if Stanley & Williamson (S&W) are right about the *semantics* of "knows how," then Ryle is wrong about *action*. You can accept S&W's linguistic analysis but still think Ryle is right that explaining action via internal propositions is a mistake.

  ***

  ### Sentence-by-Sentence Autopsy

  Let's put your textbook summary under the microscope. I'm going to be picky, because in a reading group, precision is your currency.

  **Sentence 1:** *"Ryle's distinction between knowing how and knowing that is basically the psychologist's procedural/declarative memory distinction."*
  *   **Verdict:** **Wrong (Anachronistic Category Error).**
  *   **The Wince:** This is the biggest red flag. Ryle published *The Concept of Mind* in 1949. The procedural/declarative memory distinction in cognitive science (largely via Larry Squire and others) emerged in the 1980s based on amnesia cases (like H.M.).
  *   **The Separation:** You must separate **Conceptual Analysis** (Ryle) from **Empirical Taxonomy** (Cognitive Science). Ryle is arguing about the *logic* of our concepts and how we explain behavior. Cognitive science is arguing about *causal systems* in the brain. They might map onto each other, but saying they are "basically the same" is like saying "Aristotle's four causes are basically Newtonian physics." It blurs the line between philosophy of language/metaphysics and empirical psychology.

  **Sentence 2:** *"Knowing that is propositional and you can say it out loud; knowing how is a skill stored in a different system that you can't put into words, like riding a bike or swimming."*
  *   **Verdict:** **Mixed (Half-true, half-misleading).**
  *   **Acceptable:** "Knowing that is propositional" is standard. "Knowing how is a skill" is Rylean.
  *   **The Wince:** "Stored in a different system" brings back the cognitive science error from Sentence 1. Ryle doesn't talk about storage systems; he talks about *dispositions*.
  *   **The Wrong Bit:** "Can't put into words." This is the "ineffability" trap. Ryle does not claim a cyclist *cannot* articulate the rules of balance. He claims that reciting those rules is not *identical* to the ability to cycle. A coach can talk about swimming all day without knowing how to swim; a swimmer can swim without being able to coach. The issue isn't articulability; it's whether the articulation *constitutes* the skill.

  **Sentence 3:** *"Ryle's main argument is the regress: if every intelligent action had to be preceded by a piece of knowing-that, you'd need another piece of knowing-that to apply the first, and so on forever, so knowing how can't involve any propositional knowledge at all."*
  *   **Verdict:** **Mostly Acceptable (with one nuance).**
  *   **Acceptable:** This is the famous "Rylean Regress." It is the core of his anti-intellectualist argument. If thinking is always a prior internal operation, how do you intelligently perform *that* operation without an infinite chain of prior thoughts?
  *   **The Nuance:** "Can't involve *any* propositional knowledge at all" is a bit strong. Ryle allows that you can have knowledge-that *alongside* knowledge-how. His point is that knowledge-how is not *reducible* to knowledge-that. You don't need to conclude he bans propositions entirely; he bans them as the *foundation* of intelligent action.

  **Sentence 4:** *"That's why Ryle calls know-how 'tacit', in Polanyi's sense..."*
  *   **Verdict:** **Just Wrong.**
  *   **The Separation:** This fuses **Gilbert Ryle** with **Michael Polanyi**. They are contemporaries, but they are doing different projects. Polanyi's "tacit knowledge" (from *Personal Knowledge* and *The Tacit Dimension*) is about the inarticulable background of all knowing ("we know more than we can tell"). Ryle does not use the term "tacit" in this technical sense. Conflating them is a classic textbook sin. Ryle's know-how isn't necessarily mysterious or hidden; it's often public and observable (the disposition to act).

  **Sentence 5:** *"...and why he thinks a complete physical theory of swimming would tell you nothing about the skill."*
  *   **Verdict:** **Wince (Mischaracterization).**
  *   **The Nuance:** Ryle isn't anti-physics. He's anti-*reductionism of the mental*. He wouldn't say physics tells you *nothing*; he'd say physics describes the *movements* (muscle contractions, fluid dynamics), but it doesn't describe the *action* (swimming skillfully, clumsily, or showing off). A physical theory misses the *intelligence* of the act, not the act itself. It's about the level of description, not the physical reality.

  **Sentence 6:** *"The view has since been shown too strong: Stanley and Williamson argue that knowing how just is a kind of knowing that -- knowing how to swim is knowing, of a way, that it's a way to swim -- so the distinction collapses and Ryle was basically wrong."*
  *   **Verdict:** **Oversimplified (The "Cartoon" Version).**
  *   **Acceptable:** S&W (2001) do argue for "Intellectualism": know-how is a species of know-that (propositional knowledge).
  *   **The Wince:** "The distinction collapses." Linguistically, we still use the phrases differently. Metaphysically, S&W argue they are the same *kind* of state.
  *   **The Wrong Bit:** "Ryle was basically wrong." This is too sweeping. Even if S&W are right about the *semantics* (what the words mean), Ryle might still be right about the *explanation of action*. You can agree that "I know how to swim" attributes a proposition to me, but still deny that contemplating that proposition is what makes me swim. S&W handle this by introducing a "practical mode of presentation," but that move is controversial (more on that in the payoff).

  ***

  ### The Payoff Question

  **Does the conclusion (distinction collapses, Ryle wrong) actually follow from whatever is true in the summary?**

  **No.** Here is why a careful defender of Ryle (or a nuanced Anti-Intellectualist) would push back.

  1.  **Semantics vs. Metaphysics:** Stanley & Williamson (S&W) make a claim about the *truth conditions* of sentences like "S knows how to phi." They say for that sentence to be true, S must stand in a knowledge relation to a proposition. A Rylean can concede this linguistic point but argue: "Okay, language works that way, but that doesn't mean the *psychological reality* of skill is propositional." Language can mislead us about the mind (which was Ryle's whole point!).
  2.  **The "Practical Mode" Loophole:** S&W save their view by saying you know the proposition under a "practical mode of presentation." A Rylean would ask: "What is this 'mode'?" If it's not just another way of saying 'disposition to act,' then S&W have smuggled Ryle's know-how back into their definition of know-that. If the "practical mode" is essentially a capacity to act, then the "collapse" is verbal, not substantive.
  3.  **The Regress Remains:** S&W try to stop the regress by saying the proposition is entertained *in* the action, not before it. A Rylean would say this is a verbal fix that doesn't solve the problem of how a proposition guides action without an interpreter.

  **What do S&W actually claim vs. the cartoon?**
  *   **Cartoon:** "Skills are just facts in your head."
  *   **S&W Actual:** "To know how to phi is to possess a proposition (a way to phi) under a practical mode of presentation." They are careful to say this doesn't mean you are consciously thinking about the proposition while acting. They are trying to unify the architecture of knowledge, not deny the reality of skill.

  ***

  ### One Concrete Case for Your Group

  You want something to put pressure on the "It's all knowing-that really" move? Bring up the **"False Belief Expert"** case.

  **The Case:**
  Imagine a master tennis player, let's call her Serena*. Serena* has incredible know-how. She consistently serves aces, adjusts for wind, and places the ball perfectly. However, if you ask her *why* she does what she does, she gives you a theory that is scientifically false. She believes, for example, that "wrist snap generates 90% of the power" (when biophysically it's mostly leg drive and torso rotation) or she has some superstitious belief about foot placement that doesn't actually match the physics of her successful shots.

  **Why this pressures the "It's all Knowing-That" view:**
  1.  **The Truth Condition:** Standard analysis of "Knowing-That" (propositional knowledge) requires **Truth**. You cannot know *that* Paris is in Germany, because it's false. You can believe it, but you can't know it.
  2.  **The Conflict:** If Know-How is just a species of Know-That (as S&W argue), then to "Know How to Serve," Serena* must stand in a knowledge relation to a *true* proposition about serving.
  3.  **The Pressure:** But Serena* holds false beliefs about her serving. If her "know-how" consisted in possessing true propositions, her false beliefs should interfere or negate her knowledge. Yet, she clearly *knows how* to serve. She has the skill.
  4.  **The S&W Reply (and its weakness):** S&W will say she possesses the true proposition (the correct way to move) under a practical mode, even if she can't articulate it or believes false things about it consciously.
  5.  **The Counter-Punch:** Ask your group: "If she possesses the true proposition, where is it?" If it's not in her conscious beliefs (since those are false), and it's not in her explicit speech, in what sense does she "possess" it? At this point, the Intellectualist seems to be positing a 'true proposition' that does no work other than satisfying the definition. The Rylean says: "Stop inventing hidden propositions. She has a *disposition*. Dispositions don't have truth conditions; they have success conditions."

  **What this case shows:**
  It shows that **Skill Success** and **Propositional Truth** can come apart. You can have the skill without the true theory.

  **What this case doesn't show:**
  It doesn't definitively *refute* S&W, because they can always retreat to the "practical mode of presentation" being unconscious or sub-personal. But it forces them into a corner where their "proposition" looks suspiciously like a Rylean "disposition" wearing a mask. It highlights that the Intellectualist view might be saving the theory of knowledge at the expense of explaining the reality of action.

  **How to pitch it in the group:**
  "Don't we need an account of know-how that allows for competence despite theoretical ignorance? If know-how is know-that, the expert with false beliefs about their expertise becomes a paradox. If know-how is a disposition (Ryle), it's straightforward: they are disposed to succeed, regardless of their theory."
