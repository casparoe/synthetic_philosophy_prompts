prompt: |-
  Hey, I'm in a philosophy of mind reading group and I keep bumping into the knowing-how / knowing-that thing, and I want to actually get it straight instead of nodding along. Could you act as someone who really works on this -- a philosopher of mind who's spent time on Ryle and on the know-how literature -- and please be careful with it, because I've clearly been fed a garbled version. Before you answer, maybe jot down what you think the distinction is actually doing and where people usually go wrong, then walk through the summary below sentence by sentence.

  Here's the version I got, from a cognitive science textbook a friend lent me (paraphrasing from memory, so forgive the wording):

  Ryle's distinction between knowing how and knowing that is basically the psychologist's procedural/declarative memory distinction. Knowing that is propositional and you can say it out loud; knowing how is a skill stored in a different system that you can't put into words, like riding a bike or swimming. Ryle's main argument is the regress: if every intelligent action had to be preceded by a piece of knowing-that, you'd need another piece of knowing-that to apply the first, and so on forever, so knowing how can't involve any propositional knowledge at all. That's why Ryle calls know-how 'tacit', in Polanyi's sense, and why he thinks a complete physical theory of swimming would tell you nothing about the skill. The view has since been shown too strong: Stanley and Williamson argue that knowing how just is a kind of knowing that -- knowing how to swim is knowing, of a way, that it's a way to swim -- so the distinction collapses and Ryle was basically wrong.

  I suspect some of this is off -- the memory-system bit and the 'tacit' bit especially smell wrong to me -- but I don't know enough to say why, and honestly the last sentence sounds sophisticated enough that I half belive it. So go sentence by sentence and tell me what a careful person in this area would accept, what they'd wince at, and what's just wrong. Where the summary fuses two things that should be kept seperate, say which two. And then the payoff question: does the conclusion (distinction collapses, Ryle wrong) actually follow from whatever is true in the summary? If not, what would a defender of Ryle say, and what do the Stanley-Williamson people actually claim versus the cartoon version of them? Last thing, give me one concrete case -- something I could bring to the group -- that would put pressure on the 'it's all knowing-that really' move, and tell me what that case does and doesn't show. Don't send me to papers or reading lists, I can't look anything up right now anyway, just reason it out.
