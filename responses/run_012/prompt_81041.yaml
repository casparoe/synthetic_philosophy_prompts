answer: |-
  You have effectively reinvented a significant chunk of modern information economics, and you are right to feel that the standard "Lemons" explanation is slightly too blunt for what you're noticing. You aren't just asking about defective cars; you're asking about the opacity of *motives*.

  To answer your core question: Yes, this is largely one thing, but it branches into two distinct mechanisms depending on whether the trade survives or collapses. The "move" you identified has a name, the "survivors" have a classification, and the distinction between "hidden defect" and "hidden motive" is technically subtle but practically identical.

  Here is the breakdown of the machinery you've spotted.

  ### 1. The Move: Adverse Selection (on Motives)
  The reflex you have—"they are selling, therefore they know something bad"—is **Adverse Selection**.

  Usually, this is taught regarding quality (the car is a lemon). But in market microstructure (the study of how trading actually happens), this applies equally to **motives**. When you put your bike on the market, you are entering a pool of sellers. The buyer knows that pool contains two types of people:
  1.  **Informed sellers:** People selling because the bike is about to explode.
  2.  **Liquidity sellers:** People selling because they are moving to Peru.

  The buyer cannot distinguish you from Type 1. Therefore, they must price the bike as if there is a probability you are Type 1. This is the "shading" you described.

  You asked if the "no-hidden-facts" version (you know the bike is fine) is the same phenomenon as the "hidden-defect" version. **Structurally, yes.** To the buyer, a seller with a secret urgent need for cash is functionally identical to a seller with a secret engine defect. Both imply the asset is worth less than the market price. In finance, this is often modeled as **Informed Trading vs. Liquidity Trading**. The market maker (or buyer) assumes anyone hitting the "sell" button is likely informed, unless proven otherwise.

  ### 2. The Survivors: Liquidity Shocks and Heterogeneous Beliefs
  You asked why the market doesn't collapse if everyone is this suspicious. If every buyer assumes every seller is hiding a defect, the price drops to zero, and honest sellers withdraw, confirming the buyers' suspicions. This is the "market collapse" Akerlof described.

  But markets don't usually collapse. Why? Because of **Exogenous Liquidity Shocks**.

  Trade survives when at least one party has a motive that is *uncorrelated* with the asset's quality.
  *   **You:** Moving abroad. You need the bike converted into pounds regardless of what the bike is worth.
  *   **The Car Buyer:** Needs transport to get to work.
  *   **The Share Buyback:** The company has excess cash and no better investment opportunities (a liquidity motive), not necessarily because they think the stock is undervalued (though investors suspect the latter).

  In financial theory, this is the distinction between **Informed Order Flow** (I know news) and **Noise/Liquidity Order Flow** (I need cash/diversification). The market only functions because there is enough "Noise" (people with life admin reasons) to dilute the "Informed" (people with secrets). If everyone was a rational maximizer with no external needs, **the No-Trade Theorem** (Milgrom & Stokey, 1982) suggests no speculative trade would ever occur, because any offer to trade reveals information that makes the other side back away.

  So, the class of motive you are looking for is **Idiosyncratic Liquidity Needs**. It matters immensely whether the disagreement is genuine or one side is wrong.
  *   **If it's a liquidity need:** Trade is welfare-enhancing. You get your deposit; they get a bike.
  *   **If it's a difference of opinion (speculation):** One of you is wrong (or both are). This is **Heterogeneous Beliefs**. Trade happens because you both think you're the smart money.

  ### 3. The Solution: Costly Signaling
  You noticed your suspicion drops when a warranty is offered. This is **Signaling**.

  For a signal to work, it must be **costly to fake**. A warranty is costly for a seller of a lemon (because the car will break and they'll pay for it) but cheap for a seller of a good car (because it won't break).
  *   **You:** Could offer a warranty on the bike.
  *   **The Lemon Seller:** Cannot afford to offer the same warranty.

  Therefore, the warranty separates the pool. It turns "Private Information" into "Public Information." You mentioned wondering if you should be suspicious of the guarantee itself. In theory, yes (what if they sell a warranty that has loopholes?), but in practice, legal enforcement and reputation make the signal robust.

  ### 4. Is it one thing or three?
  You asked if you are bundling distinct phenomena. You are bundling **one core friction** with **two distinct resolutions**.

  **The Core Friction:** **Asymmetric Information.**
  Whether it's a hidden defect (quality) or a hidden motive (liquidity), the structure is identical: Party A knows a parameter of the trade that Party B does not, and that parameter affects the value.

  **The Resolution 1: Signaling/Screening.**
  This is when the informed party *proves* they aren't hiding bad news (warranties, earnest money deposits on houses, audited accounts for companies). This solves the "Lemons" problem.

  **The Resolution 2: Diversification of Motives.**
  This is when the market accepts the risk because it knows not everyone is hiding something. Investors buy shares even during buybacks because they know *some* companies do buybacks for tax efficiency, not just because they know earnings are about to tank. Buyers buy used bikes because they know *some* people emigrate.

  ### The Specific Name You're Looking For
  There isn't a single phrase for "suspicion of motives specifically," but in market microstructure, the ratio you are intuitively calculating is the **Probability of Informed Trading (PIN)**.

  When you look at a listing, you are subconsciously estimating the PIN.
  *   High PIN: "Why is this so cheap? They know it's knackered."
  *   Low PIN: "They're emigrating. It's probably fine."

  The "mush" you sense is the overlap between **Adverse Selection** (the fear) and **Liquidity Provision** (the reason trade happens anyway).

  ### Summary
  1.  **The Move:** Adverse Selection (specifically regarding *motives* rather than just quality).
  2.  **The Survival Mechanism:** Exogenous Liquidity Shocks (life admin) which dilute the pool of sellers.
  3.  **The Trust Builder:** Costly Signaling (warranties).
  4.  **The Distinction:** Your "no-hidden-facts" scenario is economically identical to the "hidden-defect" scenario from the buyer's perspective. The defect isn't in the machine; it's in the *reason for the sale*.

  You aren't crazy; you're just doing Bayesian updating on incomplete information. The reason it nags at you is that you are correctly identifying that **price is not just a reflection of value, but a reflection of the seller's urgency.** You are trying to disentangle the two, and you can't, because the seller can't credibly prove their urgency without a third-party guarantee (like a relocation visa or a bank statement).

  The market works not because we solve this, but because we accept a certain level of "lemon risk" as the transaction cost of doing business with strangers.
