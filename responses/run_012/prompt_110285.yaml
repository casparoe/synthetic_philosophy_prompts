      *   **Core Task:** Extract the implicit theory of apology presupposed by each practice.
      *   **Specific Questions to Address:**
          *   For each practice (Insurer, City), categorize the four elements of apology (Regret, Acknowledgment of Wrong, Acceptance of Blame, Undertaking of Repair) as *Required*, *Permitted*, or *Forbidden*.
          *   Reconstruct the theory making each practice coherent.
          *   Determine if they presuppose one theory or two incompatible ones.
          *   Analyze coherence vs. equivocation (harm vs. wrong, entity vs. people).
          *   Distinguish strict presuppositions from comfortable fits.
          *   Analyze the "Thicker View" (Apology = Fault + Non-repetition + Repair).
          *   Apply the Thicker View to the State (dead perpetrators/victims) and the Insurer.
          *   Address the narrator's role in the hall (standing to accept on behalf of the dead).
          *   Identify rival views ruled out by these practices.
          *   Define what the acts *were* if not apologies (disavowal, promise, self-definition, etc.).
          *   **Constraint:** Argue rather than survey. Be plain about underdetermination.

  2.  **Deconstruct the Two Apologies:**

      *   **Apology 1: The Insurer**
          *   *Content:* Regret that accident happened. Reserve question of fault. No concession of liability.
          *   *Context:* Legal/Statutory shield (Apology Acts).
          *   *Function:* De-escalation without liability.
          *   *Elements:*
              *   Regret: Required (expressed).
              *   Acknowledgment of Wrong: Forbidden (only harm admitted).
              *   Acceptance of Blame: Forbidden (expressly reserved).
              *   Undertaking of Repair: Permitted (implied by insurance function, but legally detached from this specific letter).
          *   *Theory:* Apology as Risk Management / Social Lubricant. It separates *empathy* from *liability*.

      *   **Apology 2: The City**
          *   *Content:* Wrong named without hedging. City speaks as entity. No compensation. No living blame.
          *   *Context:* Historical injustice, symbolic reconciliation.
          *   *Function:* Moral cleansing without fiscal cost. Continuity for blame, discontinuity for debt.
          *   *Elements:*
              *   Regret: Required.
              *   Acknowledgment of Wrong: Required (wrong named).
              *   Acceptance of Blame: Required (City claims continuity).
              *   Undertaking of Repair: Forbidden (explicitly stated no compensation).
          *   *Theory:* Apology as Symbolic Closure / Identity Construction. It separates *moral recognition* from *material restitution*.

  3.  **Synthesize the Theories (Coherence vs. Equivocation):**
      *   Are they the same theory? No. They invert the liability matrix.
      *   Insurer: Harm = Yes, Fault = No, Debt = Maybe (later).
      *   City: Harm = Yes, Fault = Yes, Debt = No.
      *   *Equivocation:* The Insurer equivokes on *causality* (something happened vs. I did it). The City equivokes on *identity* (I am the same entity that sinned vs. I am a new entity that pays).
      *   *Coherence:* Both are coherent *instrumentally* (they achieve specific legal/political ends) but incoherent *morally* (they strip apology of its binding power).

  4.  **Analyze the "Thicker View":**
      *   *Definition:* Apology = Acknowledgment of Fault + Undertaking not to repeat + Making Good.
      *   *Insurer:* Under this view, the letter is *not* an apology. It's a notification of event. Can an insurer apologize? Only if they pay.
      *   *City:* Under this view, the ceremony is *not* an apology. It's a eulogy or declaration. Can a state apologize for dead actors? Only if the current polity accepts the debt.
      *   *Narrator's Role:* If the Thick View holds, the narrator is a witness, not a recipient. Who accepts for the dead? Convention, not metaphysics. It's a proxy relationship based on lineage or shared citizenship.

  5.  **Identify Rival Views Ruled Out:**
      *   *Ruled Out:* The Restorative View (Apology *must* lead to repair). The Personalist View (Only individuals can apologize, not entities).
      *   *What were they?*
          *   Insurer: A "Without Prejudice" offer of sympathy. A legal shield.
          *   City: A performative act of civic identity. A secular absolution.
      *   *Does it matter?* Yes, because calling it "apology" borrows moral weight without paying the moral cost.

