      *   *Section 3: The Thick View.* Apply the strict definition. Show how both practices fail. Address the metaphysical problem of the dead.
      *   *Section 4: The Narrator's Standing.* Who accepts for the dead? It's convention, not right. The narrator is a witness to the *claim*, not the recipient of the *debt*.
      *   *Section 5: What were they really?* Insurer = Risk mitigation. City = Identity performance. Why the label matters (fraudulent borrowing of moral currency).
      *   *Conclusion:* Summarize the hollowness. The practices rule out the binding nature of speech acts.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I distinguish strict presuppositions from comfortable fits? *Correction:* Ensure I note that the City's practice *could* allow repair, but this specific instance forbids it. The theory allows it, the practice denies it. Wait, the prompt asks about the *practice*. The practice explicitly forbids compensation. So the theory underlying *this* practice must accommodate that.
