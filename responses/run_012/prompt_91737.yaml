      *Drafting Objection 1 (Aesthetics/Artists):* "Your 'novel-and-apt' definition captures luck, not creativity. A broken clock is right twice a day. If a model stumbles on aptness without intent, your counterfactual test passes it, but it's not creative."
      *   *Reply:* Distinguish between *process* creativity and *agent* creativity. The model's process is creative; the lack of intent just means it's not an author.
      *   *Soft Spot:* Does "process creativity" dilute the word too much?

      *Drafting Objection 2 (Lawyer):* "Law ties originality to authorship. If you sever them, you create a vacuum. If the machine is creative but not an author, who owns it? If the prompter is the author, did they create it? Your distinction creates a legal orphan."
