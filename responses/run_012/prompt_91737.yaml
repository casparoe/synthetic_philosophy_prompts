          1.  Analytic Aestheticians (definitions, accidental novelty).
          2.  Practising Artists/Tutor (lived experience, intention, studio practice).
          3.  Copyright/AI Lawyer (legal construct, rights attachment).
          4.  Machine-Learning Researchers (interpolation vs. search, triviality of criterion).
