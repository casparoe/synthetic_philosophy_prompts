  My reading group has landed on panpsychism for the next few weeks and I've somehow been volunteered to kick things off, so I've been hoovering up summaries of the view from wherever I can find them — a couple of podcast episodes, a blog post, and a long comment a friend left under it. They all say more or less the same thing, and the gist is this: 'Panpsychism holds that consciousness is a fundamental ingredient of reality, present in some form in every physical thing, from electrons to rocks. Physicalism has failed to explain how brains produce experience, so panpsychists say we should start with mind at the bottom and build upwards. The trouble is the combination problem: how do the countless tiny experiences of fundamental particles add up to the single unified experience I'm having right now? My experience seems like one thing, not a crowd of little minds. Critics say this makes panpsychism incoherent, because separate subjects can't fuse into one subject unless something binds them together, and the panpsychist has nothing to offer except declaring the binding brute. The usual replies are that the combination problem is just the binding problem neuroscientists already work on and will dissolve once we understand how the brain integrates information, or that it's simply the hard problem all over again in a new place — which is why panpsychism, for all the attention it gets, hasn't actually explained consciousness. It just moves the mystery down a level.' Someone in the group also keeps bringing up a view where you go the other way round — one cosmic experience is fundamental and individual minds are somehow carved out of it — and says the combination problem doesn't touch that version at all, which I don't follow.

