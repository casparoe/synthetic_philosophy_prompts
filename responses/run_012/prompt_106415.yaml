answer: |-
  You are right to be suspicious. The "strong vs. weak fideism" debate is a proxy war that has exhausted its philosophical utility because it fights over a conclusion (is religion immune?) without agreeing on the premises (what is belief? what is immunity?). If you spend three years arguing about whether Wittgenstein is a fideist, you will likely produce a thesis that refines a taxonomy nobody outside that sub-field cares about.

  Your intuition that the "weak" camp smuggles in the "strong" camp's ontology is correct. Both often assume a representationalist picture of belief (belief = mental state regarding a proposition) and then argue about whether that picture applies to religion. Wittgenstein's entire later project is to dismantle that picture of belief.

  Here is a prioritization of open questions for a three-year textual/argumentative PhD, ranked by upstream importance and tractability.

  ### Priority 1: The Grammar of "Believing" (The Psychological Predicates)
  **The Question:** How does Wittgenstein distinguish between "believing that X" (hypothesis) and "believing in X" (orientation) without positing two different *ontological* states?
  **Why it is Upstream:** The entire fideism debate rests on how "belief" is constituted. If belief is a mental state assenting to a proposition, then evidence is relevant. If belief is a pattern of action, evidence is category-mistaken. The secondary literature assumes we know what Wittgenstein thinks "belief" is. We don't. Most scholars project a standard analytic philosophy of mind onto him.
  **Tractability:** High. This is pure close reading of *Philosophical Investigations* (Part II), *Zettel*, and *Lectures on the Philosophy of Psychology*. You don't need to solve theology; you need to solve how W handles psychological verbs.
  **The Payoff:** If you can show that for W, "I believe in God" is not a "different kind" of fact (Camp A) nor a "different use" of a fact (Camp B), but rather a *grammatically distinct move* that bypasses the fact/value split entirely, you dissolve the fideism objection. It renders the "immune to evidence" charge incoherent because "evidence" only applies to one side of that grammatical split.
  **Your Concrete Case:** This directly answers your "meaningful world vs. factual claim" example. On this reading, they aren't two people holding the same belief differently; they are making two different grammatical moves that merely look like the same sentence. The disagreement isn't about truth; it's about whether the sentence is being used as a hypothesis or a rule.

  ### Priority 2: The Porosity of "Forms of Life" (The Disagreement Problem)
  **The Question:** If religious belief is embedded in a form of life, what mechanisms does Wittgenstein allow for *rational* friction between forms of life?
  **Why it is Upstream:** This addresses your worry about "conversion vs. argument." The standard reading implies forms of life are monolithic blocks (you are either in or out). This leads to the "irrational conversion" critique. But if forms of life are fluid, overlapping, and dynamic, argument is possible *across* boundaries without shared premises.
  **Tractability:** Medium/High. This requires synthesizing *On Certainty* with the religious remarks. *On Certainty* is the missing key in most religious Wittgensteinian scholarship. It deals with "hinge propositions" that are exempt from doubt but can shift over time.
  **The Payoff:** If you can demonstrate that religious "hinges" can be loosened or tightened through description (rather than refutation), you save religious disagreement from being merely rhetorical. You show that W allows for a *therapeutic* form of argument that changes the landscape without appealing to neutral evidence. This moves the discussion from "incommensurability" to "perspicuous representation."
  **Risk:** It is easy to drift into sociology here. Keep it textual. Focus on how W describes the *logic* of changing one's mind, not the social process.

  ### Priority 3: The Status of the Corpus (The "Scattered Remarks" Problem)
  **The Question:** What is the philosophical weight of a remark on religion recorded by a student vs. a remark written by W in a notebook?
  **Why it is Upstream:** You are working on scattered remarks and lecture notes (likely the 1938 *Lectures on Religious Belief*). The "fideism" reading often treats these notes as doctrinal assertions. If W's method is therapeutic, then a remark like "religious belief is not a hypothesis" might be a move in a specific game to cure a specific confusion, not a general theory of religion.
  **Tractability:** High. This is methodological. It requires comparing the lecture notes against his published/carefully curated texts (*PI*, *OC*) to check for consistency of intent.
  **The Payoff:** If you establish that the "strong" fideist-sounding quotes are therapeutic exaggerations meant to break a specific picture (scientism), then the "weak" camp is fighting a straw man. It shifts your thesis from "What is W's theory of religion?" to "How does W use religious examples to do philosophy of language?" This is a much safer, more defensible, and arguably more accurate PhD project.

  ### What to Deprioritize (The Noise)
  1.  **The Label "Fideist":** Stop trying to prove or disprove this. It is a historical categorization that W would likely reject. Treat it as a historiographical problem, not a philosophical one.
  2.  **Epistemic Justification:** Do not try to construct a Wittgensteinian epistemology of religion. W is not interested in justifying belief; he is interested in describing its grammar. Trying to make him justify it forces him back into the framework he rejects.
  3.  **Comparative Theology:** Do not test W's views against actual religious practice or empirical data. You are a text-and-argument person. Keep the work internal to the corpus.

  ### How to Shift Priorities (The 12-Month Check)
  *   **Move Priority 1 Down if:** You find that W's writings on psychology are too fragmentary to support a robust account of "belief." If *Zettel* and *PI* Part II don't yield enough traction, pivot to Priority 2 (*On Certainty*) as your primary engine.
  *   **Move Priority 3 Up if:** You discover significant discrepancies between the student notes (e.g., Yorck Smythies' notes on the 1938 lectures) and W's own manuscripts. If the textual integrity is shaky, your entire philosophical argument rests on sand. You may need to spend Year 1 doing textual criticism before philosophical reconstruction.
  *   **Abort the Project if:** You find that W explicitly treats religious belief as *merely* expressive (emotivism) in the notebooks. If he reduces it to "just a feeling," there is no grammar to analyze. (Unlikely, but check *Culture and Value* early).

  ### Summary of Strategy
  Your hypothesis is that the "Kind vs. Use" distinction is a false dichotomy. **Prove that by showing the distinction itself relies on a picture of language W rejects.**

  1.  **Year 1:** Focus on Priority 1. Map the grammar of "belief" in *PI* and *Zettel*. Establish that W does not hold a uniform theory of belief.
  2.  **Year 2:** Focus on Priority 2. Apply *On Certainty* to the religious remarks. Show how "hinges" allow for disagreement without shared evidence.
  3.  **Year 3:** Focus on Priority 3. Frame the thesis. Argue that the secondary literature's stalemate is due to treating therapeutic remarks as doctrinal claims.

  This approach makes you a philosopher of Wittgenstein first, and a philosopher of religion second. That is the only way to survive a PhD in this area without getting bogged down in theological apologetics or stale exegetical fights.
