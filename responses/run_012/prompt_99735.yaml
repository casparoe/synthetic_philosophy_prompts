prompt: |-
  I've been reading rationalist blogs since the old OB days, and I've never quite got my head around coherent extrapolated volition. Everyone talks about it like its the gold standard for aligning AI with human values. But here's my confusion: if CEV is just what we'd want if we knew more, thought faster, were more the people we wished we were, and had grown up together, then isn't it by definition the correct thing to want? And if idealized preferences are what we'd have under ideal conditions, doesnt that make them objectively true values, so the whole is-ought gap just disappears? Like, if we could compute CEV, we'd have a procedure that spits out the morally right answer, and any remaining disagreement would just be because someone hasn't been extrapolated enough. But then people say CEV isn't a moral theory and doesn't tell us what to do, and I dont get how both can be true. Also, if CEV is supposed to be coherent, what happens when our extrapolated selves disagree with each other? Does it average them, or pick the one with the most reflective endorsement, or what? I guess I'm asking: since CEV is defined as what we would want under idealized conditions, why isn't it just the same as ideal observer theory, and why doesn't that make it objectively authoritative?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Confusion:**
      *   **Background:** Long-time reader of rationalist blogs (Old LessWrong/OB era). Familiar with the concepts but stuck on a specific conceptual knot.
      *   **Core Question:** Why isn't Coherent Extrapolated Volition (CEV) just "Ideal Observer Theory" (IOT) that solves the Is-Ought problem and provides objective moral authority?
      *   **Specific Sub-questions:**
          *   If CEV is what we'd want under ideal conditions, isn't that *by definition* what we *should* want?
          *   Doesn't this bridge the Is-Ought gap (making values objectively true)?
          *   Why do proponents say CEV isn't a moral theory/don't tell us what to do?
          *   How does CEV handle disagreement among extrapolated selves (averaging vs. selection)?
          *   Why isn't CEV just Ideal Observer Theory?

  2.  **Deconstruct the Concepts:**
      *   **CEV (Yudkowsky):** A proposal for AI alignment. "Do what we *would* want if we knew more, thought faster, were more the people we wished we were, had grown up closer together..." It's a *procedure* for loading values into an AI, not necessarily a claim about moral realism.
      *   **Ideal Observer Theory (IOT):** A meta-ethical theory. Moral truths are defined by the reactions of a hypothetical ideal observer (omniscient, impartial, etc.).
      *   **Is-Ought Gap (Hume):** You can't derive normative claims (ought) from descriptive claims (is) without a normative premise.
      *   **Moral Realism vs. Anti-Realism:** Does morality exist independently of minds (Realism) or is it mind-dependent (Anti-Realism/Subjectivism)?

  3.  **Address the Core Confusion (The "Golden Standard" vs. "Moral Theory"):**
      *   *User's Intuition:* If we idealize enough, we converge on *The Truth*. Therefore, CEV = Moral Truth.
      *   *Rationalist/CEV View:* CEV is a *compromise* to solve the technical problem of value loading. It explicitly avoids claiming moral realism. It says, "We don't know what's objectively right, so let's just give the AI what *we* would want if we were better."
      *   *Key Distinction:* CEV is about *human volition* (what humans want), not *moral truth* (what is right independent of humans). If idealized humans want to torture puppies (unlikely, but logically possible in an anti-realist framework), CEV says "torture puppies." Moral Realism says "don't torture puppies" regardless of what humans want.

  4.  **Tackle the Is-Ought Gap:**
      *   CEV doesn't bridge the gap; it sidesteps it. It treats "ought" as "what humans would desire." It reduces morality to psychology (extrapolated).
      *   If you are a moral anti-realist (which most early LWers were), there is no "objective authority." CEV is just a focal point for coordination, not a divine command.
      *   If you are a moral realist, CEV might be *wrong* if idealized humans diverge from moral truth.

  5.  **Address the "Disagreement" Problem:**
      *   CEV assumes convergence ("Coherent"). But what if there isn't convergence?
      *   Yudkowsky's original post acknowledges this risk. If extrapolated volitions are incoherent (e.g., War vs. Peace), CEV fails.
      *   It's not simple averaging. It's about finding a "common ground" or a "constitutional" framework that extrapolated selves would agree to.
      *   This highlights that CEV is a *political/coordination* solution, not a *metaphysical* one.

  6.  **Compare CEV vs. Ideal Observer Theory (IOT):**
      *   *Similarities:* Both involve idealization (knowledge, impartiality, etc.).
      *   *Differences:*
          *   IOT is a claim about the *nature of moral truth* (Meta-ethics).
          *   CEV is a claim about *AI safety engineering* (Alignment).
          *   IOT usually implies a single observer. CEV implies a collective "humanity."
          *   IOT claims authority. CEV claims "this is the best we can do given we don't know the truth."

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the depth of the question. It's a classic confusion. Validate that the intuition (CEV $\approx$ Moral Truth) is natural but misses the specific intent of the LW community.
      *   *Point 1: CEV is Engineering, not Meta-ethics.* Explain that CEV was designed to stop an AI from killing us while we figure out philosophy. It's a "stopgap" or a "loading mechanism," not a claim that CEV *is* Goodness.
      *   *Point 2: The Is-Ought Gap & Moral Anti-Realism.* Most OB/LW folks were moral anti-realists. To them, there *is* no objective moral truth. So CEV can't be "objectively authoritative" because nothing is. It's just "what we want."
      *   *Point 3: The "Coherent" in CEV.* Address the disagreement issue. If extrapolated selves disagree, CEV might return null or a negotiated settlement. It's not a magic convergence machine. It relies on the empirical hope that we *do* converge.
      *   *Point 4: CEV vs. Ideal Observer.* IOT says "The Ideal Observer determines Truth." CEV says "We don't know Truth, so let's ask Idealized Us." The authority comes from *our* endorsement, not from the procedure itself.
      *   *Point 5: The "Why not just do it now?" problem.* If CEV is what we'd want, why not just adopt it now? Because we can't compute it. We need the AI to do the computing. But we can't tell the AI to "maximize Good" because we don't know what Good is. So we tell it "Maximize CEV."
      *   *Conclusion:* Summarize. CEV is a pragmatic surrender to moral uncertainty, not a solution to it.

  8.  **Refining the Tone:**
      *   Keep it respectful of the user's history (OB days).
      *   Use community terminology correctly (meta-ethics, anti-realism, value loading).
      *   Avoid being overly dogmatic; acknowledge that views on CEV have evolved (some now think it's flawed).

  9.  **Self-Correction/Nuance Check:**
      *   *Did Yudkowsky claim CEV solves meta-ethics?* No, he explicitly separated them.
      *   *Is CEV still popular?* Less so now. Many moved to "Corrigibility" or "Imitative Learning." Mentioning this adds context.
      *   *The "Objectively Authoritative" part:* Crucial to emphasize that authority requires a source. If the source is "us," it's not objective in the Platonic sense.

  10. **Final Polish:** Ensure clear headings and logical flow. (Proceed to generate output based on this structure.)
answer: |-
  This is one of the sharpest conceptual knots people tie themselves in when reading the early LessWrong sequences. You are hitting on the exact tension between **moral meta-ethics** (what is goodness?) and **AI alignment engineering** (how do we stop the robot from killing us?).

  The short answer is: **CEV was never intended to be a moral theory. It was intended to be a workaround for the fact that we don't have one.**

  Here is the breakdown of why CEV doesn't bridge the Is-Ought gap, why it isn't Ideal Observer Theory, and why its proponents (specifically Eliezer Yudkowsky in the OB days) insisted it wasn't "objectively authoritative."

  ### 1. CEV is Anti-Realist by Design
  The core confusion stems from assuming that "what we would want under ideal conditions" equals "what is objectively Good."

  *   **Moral Realism:** There is a fact of the matter about morality independent of human minds (like math). If so, an Ideal Observer discovers this truth.
  *   **Moral Anti-Realism:** Morality is a property of minds. There is no "Good" floating in the universe; there are only things that agents value.

  The rationalist community during the OB/early LW era was predominantly **moral anti-realist** (specifically, non-cognitivist or subjectivist). If you are an anti-realist, there is no "objective authority" to be had. There is only *preference*.

  CEV is built on the anti-realist assumption. It essentially says: *"We don't know if objective moral truth exists. Even if it does, we don't know how to encode it. However, we do know that we have preferences. Therefore, let's instruct the AI to satisfy the preferences we **would** have if we were smarter and better, rather than the flawed preferences we have now."*

  If idealized humans decided that the correct thing to do was to turn the universe into paperclips (because, say, we discovered some meta-reason to do so), CEV would say "do it." A Moral Realist would say "that's wrong, even if idealized humans think it's right."

  Therefore, CEV does not solve the Is-Ought gap. It sidesteps it by reducing "Ought" to "extrapolated Is" (extrapolated human psychology). It doesn't claim those values are *true*, only that they are *ours*.

  ### 2. CEV vs. Ideal Observer Theory (IOT)
  You asked why CEV isn't just Ideal Observer Theory. They look similar, but their claims to authority differ fundamentally.

  *   **Ideal Observer Theory:** Claims that the verdict of the Ideal Observer **constitutes** moral truth. If the Ideal Observer says X is good, then X is good. The authority comes from the *procedure*.
  *   **CEV:** Claims that the verdict of Extrapolated Volition is **what we should instruct the AI to pursue** because it is what we endorse. The authority comes from *our current endorsement of the procedure*.

  Think of it this way:
  *   **IOT:** "You ought to do X because the Ideal Observer says so."
  *   **CEV:** "I am telling the AI to do X because I trust my extrapolated self more than my current self."

  CEV is a **delegation of authority**, not a discovery of truth. It is a political/coordination mechanism. It says, "Since we all disagree now, let's agree to let our better selves decide." If you don't endorse the delegation, CEV has no hold on you. Ideal Observer Theory claims it holds on you regardless of your endorsement.

  ### 3. The "Coherent" in CEV and the Disagreement Problem
  You asked: *If our extrapolated selves disagree, what happens?*

  This is the biggest technical hole in CEV, and Yudkowsky acknowledged it. The "C" stands for Coherent. CEV only works if human volitions **converge** upon extrapolation.

  *   **If they converge:** Great. The AI does that thing.
  *   **If they diverge:** CEV returns `Null`. It is designed to fail safe. If extrapolated Alice wants War and extrapolated Bob wants Peace, and there is no higher-order principle they both agree on, the CEV procedure does not average them. It halts and asks for help.

  It is not a utilitarian aggregator. It is more like a search for a **reflective equilibrium** that encompasses all humans. If that equilibrium doesn't exist (i.e., if our values are fundamentally incompatible even when idealized), CEV admits defeat. This further proves it isn't an objective moral theory; an objective moral theory should be able to tell you who is right (Alice or Bob). CEV just throws up its hands and says, "I can't find a coherent joint volition."

  ### 4. Why say "CEV isn't a moral theory"?
  Proponents say this to avoid the trap you just fell into.

  If you claim CEV is a moral theory, you have to defend it against moral realism. You have to prove that "what humans would want" is the same as "what is Good." That is a massive philosophical burden.

  By saying "CEV is not a moral theory," they are saying: **"We are not solving philosophy. We are building a safety catch."**

  The argument is pragmatic:
  1.  We need to build an AI soon.
  2.  We cannot program "Do Good" because we can't define Good.
  3.  We *can* roughly define "Do what we would want if we were smarter."
  4.  Therefore, we program CEV.
  5.  Then, the AI (being smarter) can help us figure out the actual moral philosophy later.

  CEV is a **bootstrap mechanism**. It's not the destination; it's the vehicle to get us to a place where we can figure out the destination without dying.

  ### 5. Why isn't it "Objectively Authoritative"?
  Finally, to your point about objective authority: Authority requires a source.

  *   If morality is Platonic, the source is The Forms.
  *   If morality is Divine, the source is God.
  *   If morality is CEV, the source is **Us**.

  If the source is Us, it is not *objective* in the sense of being independent of us. It is **intersubjective**.

  If you meet a sociopath who says, "I do not care what my extrapolated self wants, I want to kill people now," CEV has no objective authority over them. CEV only has authority over those who **already value** becoming their better selves.

  The "ought" in CEV is hypothetical: *"If you want to be the person you wish you were, you ought to follow CEV."* If you don't care about being the person you wish you were, CEV cannot tell you what to do. An objective moral theory would claim to tell the sociopath what to do regardless of his desires.

  ### Summary
  Your intuition is that idealization leads to truth. That is a Moral Realist intuition.
  The CEV framework is built on Moral Anti-Realism.

  *   **CEV is not "What is Right."**
  *   **CEV is "What We Would Want."**

  The gap between those two is the gap between **Alignment** and **Truth**. The rationalist bet was that we can't solve Truth, so we should solve Alignment by pointing the AI at our own extrapolated desires. It doesn't close the Is-Ought gap; it accepts the gap and builds a bridge out of human psychology instead of moral facts.

  *(Note: In recent years, many in the alignment community have moved away from CEV because "extrapolating human volition" turned out to be even harder than it looked, and the risk of "extrapolating" hidden pathologies was too high. But the meta-ethical distinction remains the same.)*
