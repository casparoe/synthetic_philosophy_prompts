  # Joint Statement of Understanding: The Dust Specks vs. Torture Case

  **Date:** October 26, 2023
  **Parties:** Team Add-It-Up (AAU) & Team Never-Ever (NEE)

  ### 1. Points of Agreement
  We acknowledge that after six months of discussion, we share the following common ground regarding the thought experiment originally posed by Derek Parfit:

  1.  **The Setup:** We agree on the basic mechanics of the choice: Option A involves one person undergoing severe torture (e.g., 50 years of agony). Option B involves a vast number of people (e.g., a googol, or $3^{3^{3}}$) each receiving a momentary, tiny irritation (a dust speck in the eye).
  2.  **The Metric:** We agree that "worse" refers to the **overall moral badness of the state of affairs**, not necessarily legal liability, personal blame, or what a specific agent is permitted to do in a crisis. We are comparing outcomes, not actions.
  3.  **Nature of Dispute:** We agree our disagreement is primarily **conceptual/normative**, not empirical. We are not arguing about whether dust specks hurt (they do) or whether torture is bad (it is). We are arguing about the *structure* of value (aggregative vs. lexical).
  4.  **Concessions:**
      *   **AAU grants:** That human intuition strongly recoils at the idea that specks outweigh torture, and that "scope insensitivity" is a documented cognitive bias that might be infecting NEE's judgment.
      *   **NEE grants:** That numbers *do* matter in many moral contexts (e.g., saving 1,000 lives is better than saving 1), and that AAU's position is internally consistent even if counter-intuitive. NEE acknowledges that dismissing AAU as "just arithmetic" ignores the coherent ethical framework (utilitarianism) behind it.

  ### 2. The Remaining Disagreement
  We state our core disagreement in three distinct ways:

  *   **AAU Phrasing (Team Add-It-Up):** "Suffering is a quantity. If you have enough units of minor suffering, the sum total exceeds the units of severe suffering. To deny this is to ignore the reality that a billion broken fingers are worse than one broken arm, even if no single finger-breaker is 'as bad' as the arm-breaker."
  *   **NEE Phrasing (Team Never-Ever):** "Suffering has qualities, not just quantities. There is a categorical threshold where 'agony' enters a moral zone that 'irritation' cannot access, regardless of volume. To deny this is to treat human dignity as divisible, suggesting you can violate one person's rights to save a billion people from a hiccup."
  *   **Neutral Phrasing (Joint):** "We disagree on whether moral value is **continuous and aggregative** (AAU) or **lexical and threshold-based** (NEE). Specifically, we disagree on whether there exists a number $N$ of minor harms such that $N \times \text{Minor} > 1 \times \text{Severe}$."

  ### 3. The Cruxes
  Below are the specific sub-questions that determine our verdicts. If either of us changed our mind on these, our overall position would flip.

  | Crux | The Question | Argument Bearing on Crux | AAU Prediction | NEE Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **C1: The Continuum** | Can we construct a chain of cases from "speck" to "torture" where each step is imperceptibly worse than the last? | If yes, denying a tipping point seems arbitrary. If no, there are natural moral kinds. | **Yes.** There are no sharp boundaries in nature; denying the continuum leads to absurdity. | **No.** There are qualitative leaps (e.g., from "pain" to "agony") that break the chain. |
  | **C2: Unnoticed Harms** | If a speck hits your eye but you *never notice it* (no pain, no distraction), is it a harm to be summed? | If yes, value is objective/metaphysical. If no, value is experiential. | **Yes.** It is a micro-frustration of physical integrity/preference, even if unconscious. | **No.** Harm requires an experiential component. Summing non-experiences is a category error. |
  | **C3: The Trade-Off** | Would you save the torture victim if the *only* alternative was that everyone else got a speck? | This tests whether the principle holds under pressure. | **Save the Crowd.** Minimizing total suffering is the priority. | **Save the Victim.** Protecting the individual from severe violation is the priority. |

  ### 4. Variants and Commitments
  We agree to apply our views to the following modified cases to test consistency.

  **Variant (a): The Lifetime Irritation**
  *   **Case:** One single person receives dust specks continuously, one every few seconds, from birth to death (a whole life of low-grade irritation) VS. One person tortured for 50 years.
  *   **AAU Commitment:** This is **worse than torture**. The cumulative sum of a lifetime of irritation is massive and clearly outweighs 50 years of torture in total utility loss.
  *   **NEE Commitment:** This is **not worse than torture**. Even a lifetime of irritation does not cross the qualitative threshold of "agony." The *kind* of suffering matters more than the duration.
  *   **Verdict Change?** NEE's verdict does **not** change from the original case. AAU's verdict becomes **stronger** (easier to justify).

  **Variant (b): The Compressed Afternoon**
  *   **Case:** The *same total quantity of discomfort* as Variant (a), but compressed into one single afternoon for one person (high-frequency specks, essentially a "really annoying Tuesday") VS. One person tortured for 50 years.
  *   **AAU Commitment:** This is **worse than torture**. The math remains the same; time distribution doesn't change the sum total of disvalue.
  *   **NEE Commitment:** This is **not worse than torture**. Compressing irritation does not turn it into agony. It remains a different *category* of experience.
  *   **Verdict Change?** Neither side changes their verdict between (a) and (b). This highlights that AAU cares about **Totals**, while NEE cares about **Peaks/Intensity**.

  **Sub-Question: Unnoticed Specks**
  *   **Case:** The specks are physically present but neurologically filtered out; the recipient never consciously registers them.
  *   **AAU:** These **count** as harms. Physical violation matters.
  *   **NEE:** These **do not count**. Summing these is a category error; harm requires consciousness.

  **Sub-Question: Torture Recovery**
  *   **Case:** The torture victim recovers fully with no memory vs. is permanently traumatized.
  *   **AAU:** Permanent trauma makes it **worse**, but temporary torture is still bad enough to likely outweigh specks if the number of specks isn't astronomical.
  *   **NEE:** Verdict **does not change**. Even temporary torture violates the lexical threshold. However, permanent trauma makes the violation *more* egregious, not less.

  ### 5. Semantic Clarification
  We acknowledge that part of our dispute is verbal.
  *   **AAU** uses "worse" to mean **"contains more total disutility."**
  *   **NEE** uses "worse" to mean **"constitutes a more severe moral violation."**
  *   **Resolution:** We agree that if we strictly mean "total disutility," AAU is logically correct by definition. If we mean "moral violation/rights infringement," NEE is logically correct by definition. Our remaining fight is about **which definition should guide public policy and moral reasoning.**

  ### 6. Confidence and Uncertainty
  **Overall Confidence:** We are **65% confident** in this mapping of our disagreement. We believe we have successfully isolated the variables, but we acknowledge that moral intuitions shift under new framing.

  **Least Sure Point:** We are least sure about **Crux C2 (Unnoticed Harms).**
  *   *Reasoning:* This touches on the hard problem of consciousness. If a harm occurs without experience, does it exist? AAU leans on "preference satisfaction" (I preferred not to be hit), while NEE leans on "phenomenology" (I didn't feel it). We suspect this is the deepest philosophical rift underlying the arithmetic, and neither of us has a knock-down argument for it yet.

  ***

  **Signed,**

  _________________________ (Team Add-It-Up)

  _________________________ (Team Never-Ever)
