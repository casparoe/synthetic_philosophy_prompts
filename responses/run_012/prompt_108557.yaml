      *   Visuals: Put the slips on the wall. Group "Knows" vs "Can't Know."

  7.  **Refining the Mechanics (Self-Correction):**

      *   *Constraint:* "No projector." I need to write instructions on a flipchart or handouts. Handouts are better for chains.
      *   *Constraint:* "Don't touch a screen." I need a physical timer.
