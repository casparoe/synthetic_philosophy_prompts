  2.  **Deconstruct & Refine the Design:**

      *   *Time Management:* 75 minutes is tight for 24 people doing multiple rounds of transmission + writing + ritual + debrief.
          *   Intro: 5 mins.
          *   Story Reading: 5 mins.
          *   Transmission Rounds (4 people per chain): Needs to be tight. 30 secs per person x 4 = 2 mins per round. But there are setup/transition times. Let's aim for 3 rounds of transmission to get degradation, or stick to the chain of 4 (Person A tells B, B tells C, C tells D). That's 3 transmission events.
          *   Ritual: Needs to happen alongside transmission.
          *   Omniscience Check: Happens after Person 2.
          *   Tokens: Available throughout.
          *   Debrief: Needs at least 25-30 mins to be meaningful.
          *   *Adjustment:* The chain is 4 people. A -> B -> C -> D. That's 3 transmissions.
          *   *Timing:*
              *   Intro/Setup: 10 min.
              *   Round 1 (A->B): 5 min (incl. ritual learning).
              *   Round 2 (B->C): 5 min (incl. omniscience slip).
              *   Round 3 (C->D): 5 min.
              *   Token Swearing: Open window during transmission.
              *   Data Collection/Rating: 10 min.
              *   Debrief: 30 min.
              *   Total: 75 min. *Tight but doable.*

      *   *The Story:* Needs to be standardized. I need to write the script for the journalist to read. It needs specific "hooks" (counter-intuitive) and "drift" (mundane).
          *   *Counter-intuitive:* No shadow, knows liars (mind-reading).
          *   *Mundane:* River, dawn, mill wall, stones, stealing.
          *   *Hypothesis:* Counter-intuitive elements persist better than mundane details (Minimally Counter-Intuitive concepts).

      *   *The Ritual:* "Invent a tiny action." If A invents it, B has to copy it. Does B change it? Usually, rituals become more rigid or elaborate. Let's make it: A invents, teaches B. B teaches C.
      *   *The Tokens:* "Costly Signaling." If I give up a token, does my story carry more weight?
      *   *The Omniscience Slip:* "Theological Intuition." People tend to attribute *more* knowledge to supernatural agents than is stated (Hyper-active Agency Detection / Theological Correctness).

  3.  **Drafting the Plan (Iterative Process):**

      *   *Materials:* Paper slips, pens, tokens (poker chips or beads), timer (phone, but hidden/off-stage or just a visible kitchen timer), wall space for data.
      *   *Room Setup:* 6 distinct clusters.
      *   *Scripting:* Needs to be authoritative but neutral. "We are testing memory," (cover story) vs "We are testing religion." Better to be honest about the theme but not the hypothesis. "We are looking at how stories travel."
      *   *Data Collection:* This is crucial for the debrief. I need to visualize the drift.
          *   Story versions (recorded on paper?). No, too slow.
          *   Final teller writes down the story they heard.
          *   Omniscience slips collected in a box.
          *   Tokens counted.
          *   Rituals performed at the end? Yes, show the drift.

  4.  **Addressing the "What Goes Wrong" (Troubleshooting):**

      *   *Laughing/Giggling:* People feel silly doing rituals.
      *   *Cheating:* Looking at the story text.
      *   *Time Creep:* 30 seconds is very short. People will talk over.
      *   *Token Apathy:* No one cares about the tokens. Need to make them valuable (raffle? status?). Let's make them "social capital" – you can only swear if you have them, and the final rating depends on it. Or simply: "If you swear, you give me the token."
      *   *The "Arguer":* Someone who says "This isn't how religion works." Need to validate them without letting them derail.

  5.  **Addressing the "What Can't Be Reproduced" (Limitations):**

      *   *Generational Time:* This is 75 mins, not centuries.
      *   *Consequences:* In real religion, failing the ritual has social/spiritual cost. Here, it's a game.
      *   *Emotional Stakes:* Fear of hell vs. fear of looking silly.
      *   *Institutionalization:* No priesthood emerges in 1 hour.

  6.  **Developing the Debrief:**

      *   Map mechanics to theory:
          *   Story Drift -> Memetic Selection / MCI (Minimally Counter-Intuitive) concepts.
          *   Omniscience Slips -> Theological Correctness / Hyper-active Agency Detection.
          *   Ritual Drift -> Ritualization / Coalitional Signaling.
