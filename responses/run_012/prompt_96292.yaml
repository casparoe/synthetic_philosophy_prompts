answer: |-
  ### Specifications for an Adequate Theory of Weakness of Will

  **1. The Core Case: Agency, Regret, and Resolution**
  *   **Motivation:** An agent judges, at the time of action and all things considered, that she ought to do A; she does not do A; she does not retract the judgement; she regrets the omission and takes it to have been hers. A theory that cannot accommodate the regret, and the sense in which the act was nonetheless her own, has missed the target.
  *   **Requirement:** The theory must explain how an action can be intentional and owned by the agent while simultaneously violating her own authoritative normative judgement. It must account for the phenomenology of regret as a recognition of agency rather than mere dissatisfaction with outcomes. Furthermore, the theory must explicitly classify whether abandoning a resolution under pressure and never having formed one are the same defect or two. (Note: Ordinary intuition treats these as distinct—weakness versus imprudence or shiftlessness—so a theory collapsing them bears a heavy justificatory burden.)
  *   **Status:** Non-negotiable.

  **2. Synchronic and Diachronic Weakness**
  *   **Motivation:** Take an agent whose preference between two dated rewards reverses as the earlier option draws near: at nine in the morning she prefers a larger reward at two o'clock to a smaller one at noon, and by half past eleven she prefers the smaller one. Suppose she knows this about herself and deplores it.
  *   **Requirement:** The theory must decide whether this is one episode of weakness, two, or none, and justify the decision. It must specify whether weakness is essentially a conflict between judgement and action at a single time (synchronic) or a failure of a past self to control a future self (diachronic).
  *   **Status:** Preference of a camp (Traditionalists insist on synchronic; Empiricists often accept diachronic preference reversal as the primary locus).

  **3. Inverse Cases: The Right Act, The Wrong Reason**
  *   **Motivation:** Take an agent who has absorbed, and sincerely endorses, a moral outlook we regard as mistaken, and who on one occasion acts against her own best judgement and does what we think right. We admire the act and not the judgement.
  *   **Requirement:** The theory must not identify weakness with failure simpliciter (i.e., failing to do what is objectively right). It must isolate the structural relation between the agent's *own* judgement and her action, regardless of the external moral status of the act. It must say what, if anything, is weak here (typically: the integrity of the agency, not the outcome).
  *   **Status:** Non-negotiable.

  **4. The Impostor Case: Judgement Stability**
  *   **Motivation:** Take an agent whose acts never conflict with her judgements, but only because her judgements are quietly revised to fit whatever she was going to do anyway. That is not continence.
  *   **Requirement:** A theory satisfied by mere act-judgement agreement has failed. The theory must require that the normative judgement be stable and independent of the immediate impulse it is supposed to govern. It must provide criteria for distinguishing a genuine change of mind from a rationalization generated by desire.
  *   **Status:** Non-negotiable.

  **5. The Boundary with Compulsion and Incapacity**
  *   **Motivation:** An agent who fails to act on her judgement because of a tic, a paralysis, or a compulsion is not thereby weak-willed.
  *   **Requirement:** The theory must locate the boundary, say what does the work there (control, reason-responsiveness, or something else), and survive the possibility that the same sub-personal machinery sits on both sides of the line. It must explain why yielding to a strong temptation is a failure of will, while yielding to a pathological urge is a failure of capacity.
  *   **Status:** Non-negotiable.

  **6. Precommitment and Self-Binding**
  *   **Motivation:** An agent who arranges in advance to be restrained from what she will later be tempted to do, and who is then restrained, has exercised no self-control at the moment of action.
  *   **Requirement:** The theory must say whether she is continent, weak, or neither, and how self-binding can work at all. It must explain whether virtue resides in the initial act of binding, the state of being bound, or the avoidance of the need for binding.
  *   **Status:** Non-negotiable.

  **7. Empirical Adequacy and the Status of Time-Inconsistency**
  *   **Motivation:** The theory must fit the robust findings that people discount future rewards at a rate that declines with delay, so that preferences over a fixed pair of options can reverse as time passes, and that people will bear real costs to restrict their own future options.
  *   **Requirement:** The theory must accommodate these behavioral patterns. Crucially, it must also say whether these findings describe a defect at all, since a time-inconsistent preference structure is not obviously an irrationality within standard economic models. The theory must take a stand on whether hyperbolic discounting is a description of akrasia or a description of rational preference shaping.
  *   **Status:** Non-negotiable on fit; Preference of a camp on normative interpretation.

  **8. Required Distinctions**
  *   **Motivation:** Conceptual clarity requires separating akrasia from nearby phenomena.
  *   **Requirement:** The theory must not collapse weakness of will against: (a) a genuine change of mind based on new evidence; (b) self-deception regarding the judgement itself; (c) mere weakness of desire (lack of motivation vs. override); (d) not trying against trying and failing. Finally, it must distinguish the first-personal deliberative stance, in which the agent takes herself to have been able to do otherwise, against the predictive stance, in which the failure is the output of a discounting process.
  *   **Status:** Non-negotiable.

  **9. Dual Purpose: Explanation and Blame**
  *   **Motivation:** The theory needs to serve two purposes: explaining and predicting ordinary self-defeating behaviour and telling us when blame is apt.
  *   **Requirement:** If those purposes pull the requirements apart, keep them separate in the list rather than fudging. The theory must specify whether it is primarily a causal explanation of behavior or a normative account of responsibility, and if it claims to be both, it must show how the causal story leaves room for the normative sanction.
  *   **Status:** Non-negotiable.

  ***

  ### Incompatibilities and Theoretical Scorecard

  **The Critical Trade-off**
  The pair of requirements that cannot be jointly satisfied without significant tension are **Empirical Adequacy (7)** and **The Core Case/Blame (1 & 9)**.
  *   **Why:** To fully satisfy Empirical Adequacy, one tends to adopt a preference-theoretic model where action is determined by the strongest current desire or discounted value. This explains the behavior and the preference reversals perfectly. However, this mechanistic explanation undermines the "could have done otherwise" intuition required for the Core Case and makes Blame difficult to justify (if the agent was simply maximizing a time-inconsistent utility function, in what sense did she *fail* rather than just *function*?).
  *   **Which has to give:** If you prioritize Blame and Agency (1 & 9), you must restrict Empirical Adequacy (7) by insisting that some actions are not fully determined by preference strength, positing a distinct faculty of will. If you prioritize Empirical Adequacy (7), you must soften the Core Case (1), redefining "judgement" as merely another preference and treating "regret" as a preference conflict rather than a normative failure.

  **The Most Exclusionary Requirement**
  **Requirement 4 (The Impostor Case / Judgement Stability)** excludes the most otherwise popular accounts. Simple preference-matching models and crude behaviourist accounts cannot distinguish between a stable judgement guiding action and a judgement revised post-hoc to match action. Any theory that defines akrasia solely as a gap between *expressed* preference and action fails here; the theory must have access to the causal history of the judgement.

  **Family Assessment**
  *   **Judgement-centred accounts** satisfy the Core Case and Inverse Cases well but struggle with Empirical Adequacy, often dismissing diachronic preference reversal as irrelevant to akrasia.
  *   **Will-centred accounts** handle the Boundary with Compulsion and the Core Case effectively but often lack the machinery to explain Empirical Adequacy without positing a mysterious faculty.
  *   **Attention-centred accounts** bridge Synchronic and Diachronic weakness elegantly but risk collapsing the distinction between weakness and self-deception (Requirement 8).
  *   **Preference-theoretic accounts** maximize Empirical Adequacy and predict Precommitment demand but fail the Core Case and Blame requirements by dissolving the normative force of "ought."
  *   **Eliminativists** satisfy Empirical Adequacy by denying the Core Case exists as a distinct phenomenon, thereby failing the primary purpose of the seminar.
