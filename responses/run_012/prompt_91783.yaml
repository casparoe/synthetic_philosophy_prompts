      *Drafting:*
      TO: Grants Panel
      FROM: Chair
      RE: Allocation Procedure for Next Cycle

      **Recommendation**
      For the next cycle, we will adopt a **Threshold & Portfolio** model.
      1. **Fixed Threshold:** The score of 7.0 becomes a fixed quality floor ("good enough full stop"). It will not move to fit the budget.
      2. **Portfolio Selection:** All proposals scoring ≥ 7.0 enter a "fundable pool." The panel will select grants from this pool to fill the budget, comparing options to ensure the strongest overall portfolio.
      3. **Waitover Policy:** Proposals scoring ≥ 7.0 that are not funded due to budget exhaustion will be held for **priority review** in the next cycle. They are not auto-funded, nor are they returned.

      **Reasoning**
      This approach resolves the tension between Dana's fairness concerns and Priya's validity concerns while clarifying the purpose of our scoring.

      **1. Engaging Dana's Fairness Point**
      Dana is correct that funding a 7 based on arrival time while rejecting an 8 is indefensible. Arrival order is morally arbitrary. Her claim that noisy scores require *more* careful comparison, not less, is valid. However, she conflates "comparison" with "individual ranking." We do not need to rank every proposal 1–100 to compare options. By creating a fundable pool, we limit comparison to proposals we already deem worthy. This satisfies the requirement to maximize merit within the budget without pretending a score of 8.2 is objectively superior to 8.1.

      **2. Engaging Priya's Validity Point**
      Priya is correct that granular ranking is noisy. Reviewer calibration varies. However, her portfolio suggestion—that we judge the set, not just the sum of parts—offers the solution. We are not maximizing individual scores; we are maximizing the value of the $2m investment. A portfolio of diverse, solid 7s may be superior to a cluster of 8s in the same subfield. This allows us to compare options (addressing Dana) without relying on false precision (addressing Priya).

      **3. Defining the Bar**
      We must be explicit about what the bar represents. There are two definitions:
      *   **Good enough given the cost of looking:** A satisficing threshold. Once we find enough 7s, we stop. This is our **current practice**. The bar moves because it is actually a budget valve, not a quality standard. This undermines legitimacy because applicants perceive rejection as scarcity, not quality.
      *   **Good enough full stop:** An absolute threshold of merit. If you hit 7, you are worthy of funding. Whether you *get* funded depends on the budget, but you are not rejected for lack of merit.

      Our new rule adopts the second definition. The bar stays at 7.0 regardless of the pot. If we have too many 7s, we choose the best portfolio. If we have too few, we confront the scarcity honestly rather than lowering the standard to 6.5 quietly.

      **4. Waitover Logic**
      Holding overs for priority review acknowledges their merit without breaking the budget. Auto-funding next round is fiscally irresponsible (we don't know next year's pot). Returning them wastes reviewer labor and penalizes the applicant for our budget timing. Priority review strikes the balance: their work is recognized, but they compete again for the new pot.

      **The Case Against This Recommendation**
      1.  **Increased Workload:** Portfolio selection requires discussion. We cannot simply process applications as they arrive. We must wait until the deadline to view the whole pool. This slows turnaround.
      2.  **Subjectivity Remains:** Choosing a portfolio is still subjective. Dana might argue this is still maximizing without clear criteria. Priya might argue we are still pretending to distinguish between similar proposals.
      3.  **Expectation Management:** Holdover applicants may expect funding next cycle. If they are rejected again, morale may suffer more than if they were simply rejected once.
      4.  **Budget Risk:** If a large number of proposals score ≥ 7.0, the panel faces difficult trade-offs publicly. The current system hides these trade-offs behind arrival order. This transparency is better but politically harder.

      **Conclusion**
      The status quo protects us from difficult conversations but sacrifices fairness. The Threshold & Portfolio model accepts the difficulty of comparison to ensure that when we say "no," it is because of budget constraints or portfolio fit, not because someone else applied two weeks earlier.

      (Word count check: ~650 words. Good.)

      *Refining the "Case Against":* Make sure it sounds strong.
      *Refining the "Bar" section:* Ensure the distinction is crisp.

      *Final Polish:* Check tone. Ensure it sounds like a Chair speaking to a panel.

