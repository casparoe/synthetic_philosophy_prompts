      *One more check on Dana's point:* "If you're allowed to compare portfolios then you're comparing options, and the moment you compare options you're maximizing, so Priya has conceded her point with extra steps."
      I need to acknowledge this. Dana is right that Priya conceded on *maximization*, but wrong that it invalidates the method. The method changes *what* is being maximized (portfolio value vs individual score). I should add a sentence on that.

      *Revised Reasoning Section 2:* "Dana argues Priya conceded the point by admitting comparison is maximizing. Dana is right: we are maximizing. But we are maximizing *portfolio value*, not *individual score precision*. This validates Dana's demand for comparison while preserving Priya's insight that the unit of choice is the set, not the individual."

