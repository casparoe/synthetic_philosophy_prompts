answer: |-
  # The Separateness-of-Persons Decision Tree

  **Starting Commitment:** You agree that the total welfare of a group can mathematically outweigh the welfare of a single member, but you believe there is a moral or metaphysical error in acting on that calculation.

  **Instructions:** Answer each question based on your intuitions about the *source* of the error. Do not worry about which philosophical label matches your answer; the labels are revealed only at the end.

  ---

  ### **Q1. Nature of the Error**
  Is the utilitarian mistake primarily a claim about **what persons are** (a metaphysical error about identity), or a claim about **how we may treat them** (a moral error about fairness/rights)?
  *   **Metaphysical:** Go to Q2.
  *   **Moral:** Go to Q3.

  ### **Q2. The Metaphysical Claim (Parfit Branch)**
  Do you believe that a person is just a series of psychological connections (memories, intentions) without a "further fact" of deep identity over time?
  *   **Yes:** **Leaf A (Parfitian Dissolution)**.
  *   **No:** *This path ends.* (If you are not a reductionist, you cannot hold the Parfitian view that the objection fails due to metaphysics. Return to Q1 and select "Moral".)

  ### **Q3. Target of the Moral Objection**
  Is the problem that we **add up** welfare across persons (Aggregation), or that we care **only** about welfare and ignore other values (Value Content)?
  *   **Aggregation:** Go to Q4.
  *   **Value Content:** Go to Q9.

  ### **Q4. The "Proves-Too-Much" Test (Intrapersonal)**
  If aggregation is the error, does this prohibition apply **within a single life**? (i.e., Is it wrong to sacrifice your own present welfare for your own future welfare?)
  *   **Yes (It applies intrapersonally):** Go to Q5.
  *   **No (Only interpersonal):** Go to Q6.

  ### **Q5. The Prudence Bullet**
  Do you therefore reject standard prudence? (e.g., Is saving for retirement or enduring a dentist visit morally problematic in the same way as sacrificing one person for another?)
  *   **Yes:** **Leaf B (Radical Discontinuity)**.
  *   **No:** *Incoherent Path.* (You cannot claim the error applies intrapersonally but then allow prudence. Return to Q4 and select "No".)

  ### **Q6. The Compensation Case**
  If the person being sacrificed **consents in advance** or is **fully compensated** later, is the "separateness" violation resolved?
  *   **Yes (Consent/Compensation cures it):** Go to Q7.
  *   **No (Violation remains):** Go to Q8.

  ### **Q7. Basis of Justification**
  Is the constraint grounded in **actual agreements** individuals make, or in principles no one could **reasonably reject**?
  *   **Actual Agreements:** **Leaf C (Lockean Libertarianism)**.
  *   **Reasonably Reject:** **Leaf D (Scanlonian Contractualism)**.

  ### **Q8. Strength of Constraint**
  Are individual constraints **absolute** (never overridden), or can they be overridden by **catastrophic** moral costs?
  *   **Absolute:** **Leaf E (Absolute Deontological Rights)**.
  *   **Threshold:** **Leaf F (Threshold Deontology)**.

  ### **Q9. Value Content Objection**
  If the problem is focusing only on welfare, is the error that welfare is too **subjective** (we need objective goods), or that it ignores **agency** (we need to respect choice regardless of outcome)?
  *   **Subjective vs. Objective Goods:** **Leaf G (Value Pluralism/Perfectionism)**.
  *   **Ignores Agency:** **Leaf H (Agency Deontology)**.

  ---

  ## The Leaves

  | Leaf | Position | Most Awkward Commitment | Collapse Flag |
  | :--- | :--- | :--- | :--- |
  | **A** | **Parfitian Reductionism** | The objection to utilitarianism dissolves because "persons" are not distinct enough to ground the objection. | None. |
  | **B** | **Radical Discontinuity** | You must argue that saving for your own retirement is morally indistinguishable from sacrificing a stranger. | None. |
  | **C** | **Lockean Libertarianism** | A sufficiently informed person can consent to be enslaved or sacrificed, rendering the harm permissible. | **Collapses with D** in most non-extreme cases; distinguishes only on edge cases of consent. |
  | **D** | **Scanlonian Contractualism** | A policy can be wrong even if everyone consents, provided the *principle* could be reasonably rejected by a hypothetical counterpart. | **Collapses with C** on standard compensation cases; distinguishes only on hypothetical veto power. |
  | **E** | **Absolute Deontological Rights** | You must let the world burn (e.g., allow a nuclear explosion) rather than violate one innocent person's right. | **Collapses with F** unless a genuine catastrophe scenario is posited. |
  | **F** | **Threshold Deontology** | You must specify exactly *how much* badness is required to override a right, which often seems arbitrary. | **Collapses with E** in non-catastrophic scenarios; **Collapses with D** on "reasonable rejection" of thresholds. |
  | **G** | **Value Pluralism** | You must defend objective goods (knowledge, beauty) even when they reduce the welfare of those involved. | None. |
  | **H** | **Agency Deontology** | You must respect a person's self-harming choices if they are autonomous, even if welfare is destroyed. | None. |

  ---

  ## Analysis of Unoccupied Combinations

  The tree structure forces certain combinations of views that are rarely or never occupied in the literature. Here is where the gaps are and why:

  **1. The "Intrapersonal Aggregation" Gap (Q4 Yes → Q6 Yes)**
  *   **The View:** A position that claims trade-offs within a single life are problematic (Q4 Yes) but believes compensation/consent cures the violation (Q6 Yes).
  *   **Status:** **Unexplored / Unattractive.**
  *   **Why:** If you believe the "separateness" objection applies within a single life, you are usually committed to a metaphysical view that time-slices are distinct persons (Leaf B). If they are distinct persons, "compensation" paid to a later time-slice does not cure the harm to the earlier time-slice (which pushes you to Q6 No). Holding that time-slices are distinct *but* that later slices can compensate earlier slices undermines the claim that they are separate enough to generate the objection in the first place.

  **2. The "Welfarist Absolutist" Gap (Q3 Value → Q8 Absolute)**
  *   **The View:** A position that objects to Welfarism (Q3 Value) but holds Absolute Constraints (Q8 Absolute) without appealing to Agency (Q9).
  *   **Status:** **Incoherent.**
  *   **Why:** If you reject Welfarism (Q3), you must propose an alternative value (Q9). If that alternative is "Objective Goods" (Leaf G), you typically become a Perfectionist Consequentialist (maximizing objective goods), which rejects Absolute Constraints. If you want Absolute Constraints, you usually need "Agency" or "Status" as the value (Leaf H). A view that rejects welfare but keeps absolute constraints without grounding them in agency or status lacks a normative foundation.

  **3. The "Reductionist Rights" Gap (Q2 Yes → Q3 Moral)**
  *   **The View:** A position that accepts Reductionism about identity (Q2 Yes) but still maintains a strong Moral Separateness Objection (Q3 Moral).
  *   **Status:** **Unstable.**
  *   **Why:** This is the core of Parfit's argument. If you accept Reductionism (Q2 Yes), the metaphysical basis for the "separateness" objection is significantly weakened. While one *could* try to ground rights in psychological connectedness rather than deep identity, this view is rarely occupied because it loses the rhetorical force of the SoP objection (which relies on the sharp boundary between persons). Most who accept Q2 Yes take Leaf A.

  **4. The "Compensation Pluralist" Gap (Q3 Value → Q6 Yes)**
  *   **The View:** A position that objects to Welfarism (Q3 Value) but thinks Consent/Compensation cures the violation (Q6 Yes).
  *   **Status:** **Unexplored.**
  *   **Why:** If you object to Welfarism (Leaf G or H), you typically believe there are values (Objective Goods or Agency) that cannot be "compensated" for by welfare. For example, if "Knowledge" is an objective good, destroying it cannot be compensated by giving the person happiness. If you believe compensation works, you are implicitly treating Welfare as the currency of compensation, which undermines the initial rejection of Welfarism.

  ### Note on Collapses
  The tree flags collapses between **Leaves C & D** (Contractualism variants) and **Leaves E & F** (Rights variants). This is intentional. In standard reading group cases (e.g., "The Transplant Surgeon"), Contractualists and Rights Theorists often deliver the same verdict. The tree only separates them on *why* they deliver that verdict (Actual Consent vs. Reasonable Rejectability; Absolute vs. Threshold). If your group finds these distinctions negligible for your purposes, you can treat C/D as one "Liberal" leaf and E/F as one "Deontological" leaf, reducing the tree to 6 leaves without loss of analytical power.
