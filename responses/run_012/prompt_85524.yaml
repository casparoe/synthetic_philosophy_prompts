              *   *Discrete Options:* Easier for a 90-min class than drawing curves.
              *   *Set S (Base):* Options: $(0,0)$ [Disagreement], $(20, 50)$, $(30, 30)$, $(50, 20)$.
                  *   Symmetric. NBS/KS likely $(30,30)$.
