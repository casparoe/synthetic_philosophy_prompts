                  *   *Disagreement:* $(0,0)$.
                  *   *Small Set Options:* $(0,0), (30, 50), (40, 40), (50, 30)$. (Symmetric around 40/40).
                  *   *Large Set Options:* $(0,0), (30, 50), (40, 40), (50, 30), \mathbf{(70, 10)}$.
                  *   *Wait, check Monotonicity:* P1's max increased (50 -> 70). P2's max stayed (50).
                  *   *IIA:* $(40,40)$ is in both. If chosen in Small, should it be chosen in Large?
                  *   *Monotonicity:* P1's position improved. Should P1 get more than 40?
