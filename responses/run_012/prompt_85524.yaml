                      *   *Perfect.* This discrete set works. NBS stays at $(40,40)$ (satisfying IIA). KS moves toward P1 (satisfying Monotonicity).
                      *   *Wait, one tweak:* To make it visceral, P1 in the Large Set needs to *feel* powerful. $(70,10)$ is good.
                      *   *Payoffs:* Points.

