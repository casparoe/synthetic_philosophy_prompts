      *   **Core Problem:** Students find the axioms (Pareto Efficiency, Symmetry, Scale Invariance, IIA, Monotonicity) too platitudinous. They don't see the conflict between Independence of Irrelevant Alternatives (IIA) and Monotonicity.
      *   **Goal:** A 90-minute session where students *experience* the conflict before learning the theory.
      *   **Structure:** Three movements:
          1.  Paired bargaining (Base Set vs. Expanded Set).
          2.  Confrontation/Comparison of results.
          3.  Constitutional Convention (Legislating a rule) + Testing the rule.
