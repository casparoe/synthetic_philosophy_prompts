      *   **Debrief:** Reveal Nash vs. KS. Map their struggle to the axioms.

  4.  **Refining the "What Goes Wrong" (Troubleshooting):**
      *   *50/50 Norm:* Students love equality. Even in Set L, they might split 40/40.
          *   *Fix:* In debrief, highlight the pairs that *didn't*. If all do 50/50, the instructor must play Devil's Advocate in Movement 2 ("P1, you had a 70 option, why did you settle?").
