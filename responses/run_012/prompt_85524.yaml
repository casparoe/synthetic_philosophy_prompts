      *   **Constraint:** Do *not* name Nash or Kalai-Smorodinsky until the debrief.

  2.  **Deconstruct the Mathematical Conflict:**
      *   *Nash Bargaining Solution (NBS):* Maximizes $(u_1 - d_1)(u_2 - d_2)$. Satisfies IIA. Violates Monotonicity.
      *   *Kalai-Smorodinsky (KS):* Connects disagreement point $d$ to ideal point $a$ (utopia point). Solution is on the Pareto frontier intersecting the line $da$. Satisfies Monotonicity. Violates IIA.
      *   *The Crucial Geometry:* I need two feasible sets, $S$ (small) and $L$ (large), such that $S \subset L$.
      *   *Disagreement Point ($d$):* Must be the same for both. Let's set $d = (0,0)$ for simplicity in the activity.
      *   *Ideal Points:* In $S$, ideal for Player 1 is $u_1^{max}$. In $L$, ideal for Player 1 is $v_1^{max} > u_1^{max}$. Ideal for Player 2 stays the same ($u_2^{max} = v_2^{max}$).
      *   *The Conflict:*
          *   NBS on $S$ yields point $x$. NBS on $L$ yields point $y$. Because of IIA, if $x \in L$ and $x$ was optimal in $S$, NBS *might* stay at $x$ (actually, strictly speaking, IIA says if $x$ is chosen in $L$ and $x \in S \subset L$, then $x$ must be chosen in $S$. The contrapositive is usually the teaching tool: If we choose $x$ in $S$, and expand to $L$ without adding anything better than $x$ for the winner, IIA says stick with $x$. But NBS actually *changes* usually because the shape of the frontier changes the product maximization. Wait, I need to be precise).
          *   *Correction on IIA:* IIA states: If $f(S, d) = x$ and $x \in T \subset S$, then $f(T, d) = x$.
          *   *Teaching Scenario:* We want the students to feel the pull.
          *   *Set S (Base):* Symmetric triangle or curve. Solution should be symmetric (e.g., 50/50 split of surplus).
          *   *Set L (Expanded):* Expands Player 1's maximum possible payoff, but keeps the original solution point $x$ available.
          *   *NBS Prediction:* Because the frontier curves, expanding Player 1's max usually shifts the NBS *toward* Player 1, but *less* than KS. Actually, the classic counterexample to Monotonicity involves NBS staying put or moving less than the "ideal ray" suggests, while KS *must* move along the ray.
          *   *Better Geometry for Class:*
              *   $d = (0,0)$.
