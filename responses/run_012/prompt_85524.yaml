      *   **Movement 1:** 8 pairs. 4 get Set S (Small). 4 get Set L (Large). Randomly assign P1/P2 roles.
      *   **Movement 2:** Bring P1s from Set L and P2s from Set L to front. Compare with Set S pairs.
