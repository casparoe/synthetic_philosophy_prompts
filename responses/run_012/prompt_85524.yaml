answer: |-
  Here is a complete design for your ninety-minute session. It is engineered to force the conflict between Independence of Irrelevant Alternatives (IIA) and Monotonicity through experience before introducing the formal theory.

  ### I. Session Overview & Materials

  **Class Size:** 16 Students (8 Pairs)
  **Room Setup:** 8 tables spaced apart. One main board/screen for the "Constitutional Convention."
  **Incentives:** "Course Capital."
  *   **Grand Prize:** The pair with the highest *joint* payoff sum gets exemption from one short response paper each.
  *   **Runner Up:** The pair with the second-highest joint sum gets first choice of snacks at the final meeting.
  *   **Tie-Breaker:** If sums are equal, the pair with the higher individual minimum payoff wins.
  *   *Note:* This incentivizes efficiency (Pareto) and cooperation, but leaves the *distribution* of points within the pair up to their bargaining power.

  **Materials:**
  1.  **Option Cards:** Two decks.
      *   **Deck S (Small):** 4 cards per pair. Payoffs $(P1, P2)$: $(0,0)$, $(30,50)$, $(40,40)$, $(50,30)$.
      *   **Deck L (Large):** 5 cards per pair. Payoffs $(P1, P2)$: $(0,0)$, $(30,50)$, $(40,40)$, $(50,30)$, **$(70,10)$**.
      *   *Note:* $(0,0)$ is the Disagreement Point. It is not a choice, but the consequence of no agreement.
  2.  **Agreement Slips:** Small slips of paper where pairs write their chosen coordinates and sign.
  3.  **Timer:** Visible countdown.
  4.  **Board:** To record results and draft the Constitution.

  ---

  ### II. Timeline (90 Minutes)

  #### Movement 1: The Bargaining Lab (0:00 – 0:25)
  *   **0:00–0:05 (Intro):** Explain the stakes (Paper exemption/Snacks). Explain the rules:
      1.  You have 5 minutes to agree on one card from your envelope.
      2.  If you agree, you get those points.
      3.  If time runs out without a signed slip, you get $(0,0)$.
      4.  You cannot trade points with other pairs; you only care about your own pair's score.
      5.  *Crucial:* Do not show your cards to other pairs yet.
  *   **0:05–0:10 (Distribution):** Randomly assign roles (Player 1 / Player 2).
      *   **4 Pairs** receive **Deck S**.
      *   **4 Pairs** receive **Deck L**.
      *   Ensure Player 1 in Deck L pairs knows their maximum possible payoff (70) is higher than Player 1 in Deck S (50).
  *   **0:10–0:15 (Bargaining):** Start timer. Circulate. Ensure they understand that $(0,0)$ is the penalty for failure.
  *   **0:15–0:25 (Collection):** Collect Agreement Slips. Record results on the board anonymously (e.g., "Pair S1: (40,40)", "Pair L1: (50,30)").

  #### Movement 2: The Confrontation (0:25 – 0:45)
  *   **0:25–0:35 (Reveal):** Reveal the deck compositions. Show the class that Deck L contains *all* cards from Deck S, plus the $(70,10)$ option.
  *   **0:35–0:45 (Interrogation):**
      *   Call a **Deck L Player 1** who secured more than 40 points (if any) to the front. Ask: *"Why did you demand more than the Deck S pairs?"* (Expected answer: "My maximum potential was higher; I had more leverage.")
      *   Call a **Deck L Player 2** who settled for 30 points (or less) to respond. Ask: *"The (40,40) card was available to you. It was the fair solution for the S pairs. Why did you accept less?"* (Expected answer: "They threatened to walk away to get 70. I had to concede.")
      *   Call a **Deck S Player 2**. Ask: *"Look at the L pairs. They had the (40,40) option too. Do you think the L Player 2s were treated unfairly?"*
      *   *Goal:* Elicit the conflict. One side argues that adding an unchosen option ($70,10$) shouldn't change the deal (40,40). The other argues that improving a player's prospects should improve their outcome.

  #### Movement 3: The Constitutional Convention (0:45 – 1:10)
  *   **0:45–0:50 (Instruction):** "You are now the legislature. You must write **one single rule** (an algorithm) that I will use to solve *all* future bargaining problems. I will test your rule against cases you haven't seen. It must be precise."
  *   **0:50–1:05 (Drafting):** Students debate in the large group. Write drafts on the board.
      *   *Likely Draft 1:* "Split the surplus equally."
      *   *Likely Draft 2:* "Maximize the product of gains." (They might stumble on this).
      *   *Likely Draft 3:* "Proportional to maximum possible payoff."
  *   **1:05–1:10 (Stress Testing):** You run their rule against four hypothetical cases written on the board:
      1.  **Relabeling:** Swap P1 and P2 names. (Tests Symmetry/Anonymity).
      2.  **Scaling:** Multiply P1's points by 10. (Tests Scale Invariance).
      3.  **The IIA Case:** A problem where the chosen option is available in a larger set, but the larger set adds a extreme option for P1. (Does the rule move?)
      4.  **The Monotonicity Case:** A problem where P1's maximum increases, but the old solution is still feasible. (Does P1 gain?)
      *   *Outcome:* Their rule will fail Case 3 or Case 4. If they say "Keep the old solution," they fail Case 4 (Monotonicity). If they say "P1 gets more," they fail Case 3 (IIA).

  #### Movement 4: Debrief & Theory Reveal (1:10 – 1:30)
  *   Map their experience to the axioms.
  *   Reveal Nash and Kalai-Smorodinsky.
  *   Discuss limitations.

  ---

  ### III. The Debrief Script (Key Concepts)

  **1. Mapping the Conflict:**
  "Look at the Deck L pairs. You had the option $(40,40)$ available. It was the solution for Deck S.
  *   **Group A (The Stabilizers):** You argued that because $(40,40)$ was available and 'fair' before, adding $(70,10)$ shouldn't change it. You intuitively invoked **Independence of Irrelevant Alternatives (IIA)**. If an option wasn't chosen, its availability shouldn't matter.
  *   **Group B (The Opportunists):** You argued that because Player 1's *best possible outcome* rose from 50 to 70, Player 1's bargaining position improved, so they deserve more than 40. You intuitively invoked **Monotonicity**. If the feasible set expands in favor of one player, that player should not lose."

  **2. The Geometry of the Solutions (Draw on Board):**
  *   **Disagreement Point ($d$):** $(0,0)$.
  *   **The Nash Bargaining Solution (NBS):**
      *   *Rule:* Maximize the area of the rectangle formed by the agreement point and the disagreement point $(u_1 \times u_2)$.
      *   *In our game:* $(40 \times 40) = 1600$. $(50 \times 30) = 1500$. $(70 \times 10) = 700$.
      *   *Result:* NBS picks $(40,40)$ in **both** Deck S and Deck L.
      *   *Why:* It satisfies IIA. It ignores the $(70,10)$ option because it doesn't maximize the product.
      *   *Cost:* It violates Monotonicity. Player 1's prospects improved, but their payoff stayed static.
  *   **The Kalai-Smorodinsky Solution (KS):**
      *   *Rule:* Draw a line from $d$ to the **Ideal Point** (the vector of maximum possible payoffs for each player). Pick the point on the Pareto frontier that intersects this line.
      *   *In Deck S:* Ideal is $(50,50)$. Line is $y=x$. Intersects at $(40,40)$.
      *   *In Deck L:* Ideal is $(70,50)$. Line is flatter ($y = \frac{5}{7}x$). To stay on this line, Player 1 must take more, Player 2 less (e.g., moving toward $(50,30)$).
      *   *Result:* KS moves when the set expands.
      *   *Why:* It satisfies Monotonicity. It respects the change in bargaining power.
      *   *Cost:* It violates IIA. The solution changes even though the 'old' deal was still available.

  **3. The Theorem:**
  "This is not just a quirk of these cards. **Roth (1979)** proved that no bargaining solution can satisfy Pareto Efficiency, Symmetry, Scale Invariance, IIA, *and* Monotonicity simultaneously. You had to choose. You cannot have a rule that is insensitive to irrelevant options *and* sensitive to changes in bargaining power."

  ---

  ### IV. Troubleshooting: What Will Go Wrong

  **1. The "Fifty-Fifty" Norm Collapse**
  *   **Problem:** Students are socialized to split things evenly. Even Deck L pairs might agree on $(40,40)$ because it "looks fair," ignoring the $(70,10)$ threat.
  *   **Fix:** In Movement 2, if all pairs chose $(40,40)$, *you* must play the Devil's Advocate. "Player 1 in Deck L, you had a card worth 70. You settled for 40. Why? If I gave you this choice again, would you threaten to take the 70 to force a better split?" Force them to articulate the leverage they *ignored*.

  **2. The Dominant Personality**
  *   **Problem:** One student dictates the agreement. The "bargaining" is a sham.
  *   **Fix:** During the bargaining phase, circulate and listen. If one student is dictating, intervene gently: "Ensure both parties are signing voluntarily." In the debrief, acknowledge this: "Real bargaining involves power dynamics our axioms ignore. We are looking for *rational* norms, not psychological dominance."

  **3. Constitutional Deadlock**
  *   **Problem:** The class writes a vague rule like "Be reasonable" or "Maximize welfare."
  *   **Fix:** Refuse vague language. "What is the algorithm? If I give you coordinates $(x,y)$, how do you compute the answer?" If they say "Maximize welfare" (sum), test it against a case where $(10, 90)$ sums to 100 and $(50, 50)$ sums to 100. Ask which they pick. Force specificity.

  **4. Disagreement Failure**
  *   **Problem:** A pair fails to agree and gets $(0,0)$.
  *   **Fix:** This is actually data. In the debrief, ask: "Was this inefficiency due to the rules or the players?" Use it to motivate the **Pareto Efficiency** axiom. "Our axioms assume rational agents won't leave value on the table. These pairs did. That's why we need normative rules."

  ---

  ### V. Limitations: What This Activity Cannot Teach

  You must explicitly supply these caveats at the very end, or students will leave with misconceptions.

  1.  **Discrete vs. Continuous:** "Our cards were discrete points. The theorem relies on **convex, continuous sets**. In the continuous case, the Nash solution traces a hyperbola ($xy = c$), and Kalai-Smorodinsky traces a ray. The incompatibility is geometric, not just an artifact of our card options."
  2.  **Normative vs. Descriptive:** "We asked you what rule you *would* write. This is **normative** ethics. It does not predict how people *actually* bargain (that's descriptive game theory). In the lab, people often split 50/50 regardless of the feasible set. The axioms are about justification, not prediction."
  3.  **Utility vs. Points:** "We treated points as utility. In the theory, these must be **von Neumann-Morgenstern utilities**. The 'Scale Invariance' axiom works because utility functions are unique only up to positive affine transformation. Our points were already scaled for you."
  4.  **The "Forced" Choice:** "It may feel like we could just tweak the rule to satisfy both. The theorem proves you cannot. It is a logical impossibility, like trying to draw a square circle. You must decide which axiom (IIA or Monotonicity) is less essential to your conception of fairness."

  ### VI. Instructor's Geometry Cheat Sheet

  For your reference, here is why the specific numbers work for the debrief:

  *   **Disagreement:** $d = (0,0)$.
  *   **Set S:** Convex Hull of $\{(0,0), (0,50), (50,0)\}$.
      *   Nash Max: $x(50-x)$ at $x=25 \rightarrow (25,25)$. (Adjust cards to match this, e.g., use $(40,40)$ on a frontier of $x+y=80$).
      *   *Correction for the cards provided in Section I:*
      *   Cards: $(30,50), (40,40), (50,30)$.
      *   Nash Product: $1500, 1600, 1500$. **Winner: (40,40)**.
      *   KS Ideal: $(50,50)$. Ray $y=x$. **Winner: (40,40)**.
  *   **Set L:** Adds $(70,10)$.
      *   Nash Product: $70 \times 10 = 700$.
      *   Old Winner $(40,40)$ product is still $1600$.
      *   **Nash Winner: Still (40,40).** (Satisfies IIA).
      *   KS Ideal: $(70,50)$. Ray $y = \frac{5}{7}x \approx 0.71x$.
      *   Check $(40,40)$: $40 > 0.71(40)$. Point is *above* the ray.
      *   Check $(50,30)$: $30 < 0.71(50)$. Point is *below* the ray.
      *   **KS Winner:** Must be between $(40,40)$ and $(50,30)$. In a continuous set, P1 gains. In our discrete set, the *pressure* is to move to $(50,30)$. (Satisfies Monotonicity).

  This geometry guarantees that in the debrief, you can mathematically demonstrate why the two solutions diverge using the very numbers they bargained over.
