answer: |-
  The regime you describe is indeed internally coherent, but its coherence relies on a specific set of philosophical commitments that differ significantly from the "strong" Precautionary Principle (PP) attacked by critics. To reconstruct the philosophy presupposed by this regime, we must analyze its asymmetries, its epistemic standards, and its assignment of moral agency.

  ### 1. Burden of Proof and the Moral Status of the Status Quo
  The two-track structure requires a **asymmetric conception of the burden of proof** and a **privileged moral status for the status quo.**

  *   **Burden of Proof:** The regime rejects the idea that risk should be evaluated neutrally. For new products, the burden is on the *proponent* to prove safety (a "positive safety case"). For existing products, the burden is on the *regulator* to prove harm. This implies that "safety" is not an objective property to be discovered, but a legal status granted only when uncertainty is sufficiently reduced by the applicant.
  *   **Status Quo:** The grandfather clause implies that established practices possess a form of **presumptive legitimacy**. Time and widespread use generate a "reliance interest" that acquires moral weight. The regime treats the risks of existing products as part of the background conditions of life (which citizens are assumed to accept), whereas the risks of new products are treated as imposed harms (which require justification). This is a **conservative** philosophy in the literal sense: it conserves existing arrangements unless there is specific cause to disrupt them.

  ### 2. Acting vs. Refraining and Unquantified Risk
  The regime commits itself to a **robust distinction between acting and refraining**, and it validates **mechanistic plausibility** as a ground for state action.

  *   **Acting vs. Refraining:** The critics' charge of incoherence rests on the claim that "refusing to approve" is an action with risks (e.g., patients dying from lack of treatment). The regime rejects this equivalence. It defines the morally salient "act" as **market entry**. Refraining from licensing is treated as the neutral baseline. The regulator accepts moral responsibility for the risks introduced by *new* approvals but disclaims responsibility for the risks inherent in *withholding* approval (which are attributed to nature or the disease). This is a **agency-relative** view of risk: you are responsible for the risks you introduce, not the risks you fail to alleviate.
  *   **Unquantified Risk:** The "trigger" feature commits the regime to the view that **statistical evidence is not the only valid form of knowledge.** A mechanistically credible risk, even if unquantified and unobserved, counts as a reason for state action if the potential harm is irreversible. This presupposes **epistemic humility** regarding complex systems: we acknowledge that we cannot always wait for statistical significance before catastrophic thresholds are crossed. It prioritizes *type II errors* (false negatives) over *type I errors* (false positives) in the context of irreversible harm.

  ### 3. The Critics' Target vs. The Regime's Principle
  The strong version of the Precautionary Principle attacked by critics is **not implied** by this regime. The critics attack a **symmetric, substantive PP**: "Minimize risk in all directions, including the risk of inaction." Under that view, banning a drug is as risky as approving it, leading to paralysis.

  The regime employs a **procedural, asymmetric PP**: "Under conditions of uncertainty and high stakes, place the burden of proof on the party seeking to alter the status quo."
  *   The attack lands only on the symmetric version.
  *   The regime avoids incoherence by accepting the risks of the status quo as a fixed cost. It does not demand that the regulator prove the *ban* is safe; it demands the applicant prove the *product* is safe. It resolves the "forbid the forbidding" paradox by defining the regulatory mandate narrowly: manage the risk of *intervention*, not the risk of *nature*.

  ### 4. Philosophy vs. Mundane Considerations
  We must separate the strict philosophical presuppositions from pragmatic constraints.

  *   **Strict Presuppositions:**
      *   **Sunset Clause:** This is philosophical **fallibilism**. It asserts that safety is not a permanent property but a provisional status contingent on current knowledge. It rejects the idea that truth, once established, remains static.
      *   **The Trigger:** This is a commitment to **non-utilitarian thresholds**. It asserts that some risks (irreversible/large-scale) cannot be traded off against benefits until the risk is ruled out, regardless of the expected utility.
      *   **Substitution Rule:** This implies a **duty of care to minimize risk** conditional on the activity occurring. It is not enough to be "safe enough"; one must be "safest available."

  *   **Mundane Considerations:**
      *   **Grandfather Clause:** While philosophically justified by status-quo privilege, this is largely explained by **reliance interests and retroactivity**. It is administratively impossible and legally unfair to re-litigate every past approval.
      *   **Administrative Cost:** The two-track system is underdetermined between a moral theory and a resource constraint. A regulator might treat old and new drugs differently not because old ones are morally privileged, but because reviewing the entire market is too expensive.
      *   **Underdetermination:** Incompatible theories license these rules. A **Rights-Theorist** supports the regime because citizens have a right not to be experimented on without consent (hence the burden on new applicants). A **Rule-Utilitarian** supports it because long-term stability and trust in the market maximize utility, even if specific bans reduce utility. The rules look the same, but the justification differs.

  ### 5. Consistency of Grandfather, Substitution, and Trigger
  These three features can be held together, but only if the **Trigger acts as the override mechanism** for the Grandfather clause.

  *   **Tension:** Grandfathering says "Old products stay unless harm is proven." Substitution says "Riskier products go if safer ones exist." If a grandfathered product is riskier than a new alternative, Substitution suggests banning it, but Grandfather protects it.
  *   **Reconciliation:** The regime is consistent if the Substitution Rule applies primarily to *new* applications (refusing the riskier new entrant) or if the Trigger is activated for legacy products. If credible evidence of a mechanism of harm exists for the old product (Trigger), the burden shifts to the manufacturer. Once the burden shifts, the Substitution Rule can be applied to refuse continued marketing if a safer alternative exists. Without the Trigger, Grandfather and Substitution would conflict regarding legacy products. With the Trigger, the Grandfather protection is conditional on the absence of plausible mechanistic risk.

  ### 6. Replacement by Expected-Value Calculus
  If the regime's implicit view were replaced by a single **expected-value (EV) calculus** applied indifferently to action and inaction, the following changes would occur:

  1.  **Collapse of the Two Tracks:** The distinction between new and old products would vanish. Both would be subject to the same calculation: $P(Harm) \times Cost(Harm)$ vs. $P(Benefit) \times Cost(Benefit)$. Grandfathering would disappear as irrational nostalgia; old drugs would need to prove net positive EV just like new ones.
  2.  **Symmetry of Burden:** The burden of proof would dissolve into data input. The regulator would not require a "positive safety case" but merely a probability distribution. Inaction (not approving) would be weighed exactly as heavily as action (approving). If the disease risk outweighs the drug risk, the drug *must* be approved; if the drug risk outweighs the disease risk, it *must* be banned.
  3.  **Quantification Requirement:** The "Trigger" based on mechanistic plausibility would be invalid. Under EV, a plausible mechanism with no probability estimate contributes nothing to the calculus. The regime would demand quantification, potentially ignoring "unknown unknowns" or unquantifiable irreversible risks.
  4.  **No Status Quo Bias:** The moral privilege of existing use would be eliminated. An existing product causing 100 deaths/year would be treated identically to a new product projected to cause 100 deaths/year.
  5.  **Substitution Becomes Optimization:** The "comparable cost" constraint would likely vanish unless cost is explicitly part of the utility function. The regulator would mandate the switch to the safer alternative regardless of cost, provided the net utility gain is positive.

  In summary, the regime you describe is coherent because it is not a pure application of the Precautionary Principle in the abstract, but a **political-legal instantiation** of it. It balances precaution with stability by assigning moral agency to the innovator, privileging the status quo for pragmatic and conservative reasons, and using procedural triggers to manage uncertainty without requiring impossible proof. The critics' incoherence charge fails because it assumes a symmetry of moral responsibility that this regime explicitly rejects.
