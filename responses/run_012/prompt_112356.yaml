answer: |-
  The coffee cups were cold. The photocopy of the letter—the one where she described the Christmas rush with what looked like boundless energy—sat between us on the table.

  "You're treating her like a character in a novel we're editing," Priya said. She was leaning forward, hands clasped. "You want to decide she was bitter because it fits a narrative you have about gender roles in the 1930s. But that's not truth. That's projection."

  "It's not about the 1930s, Priya. It's about now," I said. "If we believe she was bitter, we acknowledge a debt. We owe something to the women in the family now. If we believe she was happy, we celebrate her resilience. Both beliefs have consequences. The 'truth' is whichever one helps us navigate the family history without breaking it."

  Priya shook her head. "That's the problem. You're defining truth by the payoff. But the payoff doesn't make the event happen. Whether she felt a pang of resentment when she sealed that envelope is a fact. It's fixed. It's done. The community of inquirers could investigate forever—interview ghosts, analyze ink pressure for tremors—and if they could go on long enough, they would converge on an answer. That convergence is the truth. It exists whether we reach it or not."

  "But they can't go on forever," I said. "They can't. She's dead. The shop is a phone repair store. The inquiry is closed. So what work is your 'truth' doing? You're positing a ghostly fact that sits in the universe like a stone in a dark room. If no light ever hits it, if no hand ever touches it, in what sense is it 'true' other than you insisting the word applies?"

  "It's doing the work of keeping us honest," Priya said. "It stops us from saying, 'Well, it's useful to think she was happy, so she was.' That's not honesty. That's wishful thinking."

  "Is it?" I pushed back. "Or is it recognizing that 'truth' is a tool? When I say a belief is true, I mean it's safe to steer by. If believing she was content allows the family to heal, that belief has cash value. Your version has no cash value. You're telling me there's a check in the mail that will never arrive, from a bank that no longer exists, and I'm supposed to call that wealth."

  Priya smiled, but it was tight. "Okay. Let's use your currency. Cash value. You say an idea becomes true as it verifies itself in experience. But verify *what*? If I believe she was secretly miserable, and that belief makes me act more kindly toward my sister, I've gained a practical benefit. But does that make the belief *true*? Or just *comforting*? On your view, what stops 'true' from just meaning 'feel-good story'? If the utility is the metric, then a lie that works is better than a truth that hurts."

  "I didn't say 'feel-good,'" I corrected. "I said 'good in the way of belief.' Sometimes the hard belief is the useful one. Maybe we *need* to believe she was sacrificed so we don't repeat it. But the point is, the truth isn't sitting there waiting for us. It's made. It happens to the idea when we put it to work."

  "So the truth is created by the working?" Priya asked. "Then before you had this conversation, before the family decided what to do with her memory, there was no truth about her interior life? That's absurd. She felt what she felt. The reality of her mind was there, independent of your utility."

  "Was it?" I said. This was where I dug in. "No, listen. You say the reality was there. I'm saying there is *nothing* there. There is no fact of the matter. The letters are cheerful. The records show profit. The brothers got degrees. That's the sum of existence. To say there's a hidden variable called 'resentment' floating in the ether is metaphysical junk. There's no evidence, there's no access, and there's no consequence except the one we invent. So don't tell me I'm ignoring a fact. I'm telling you there is no fact to ignore."

  Priya's eyes widened slightly. I had expected her to be the skeptic about the hidden fact, but she straightened up, suddenly the defender of reality.

  "That is exactly what you don't get to say," she said, her voice harder. "You don't get to dissolve her inner life just because the records are silent. The fact exists. Her consciousness was real. If she cried in the back room for ten minutes in 1935, that event is woven into the fabric of the universe. It is true that it happened, or true that it didn't. Your inability to verify it doesn't erase it. You're acting like the universe waits for your permission to be real."

  "I'm saying the universe doesn't care about the label 'true' until a mind applies it!" I snapped. "Truth is a property of ideas, not of events. The event just *is*. 'True' is the stamp we put on the map that helps us walk the terrain. If the terrain is gone, the map is just paper."

  "But the terrain wasn't just for you," Priya said. "It was for her. And she was real. If you say there's no truth about her pain because you can't use it, you're treating her like a prop in your family therapy session. I'm the one respecting her reality by insisting there's a truth about her that stands apart from what's good for *you*."

  We sat in the silence of that reversal. I was the one denying the hidden reality; she was the one insisting on it.

  "Okay," I said, exhaling. "So we're stuck. You think 'true' means 'independent of us.' I think 'true' means 'connected to us.'"

  "I think 'true' means 'stable,'" Priya said. "If we accept your view, I have to give up the idea that the world pushes back. I have to accept that if the family collectively decided tomorrow that she was actually an alien spy, and that belief 'worked' for us socially, it would become true. I lose the anchor. I lose the guarantee that there's a difference between being right and being agreed upon."

  "And if I accept yours," I said, "I have to give up the idea that truth matters *now*. I have to accept that there are truths that make no difference to any living thing, that verify nothing, guide no action, and heal no wounds. I have to treat 'truth' as a monument instead of a vehicle. I lose the ability to say that some truths are dead because they no longer serve life."

  Priya looked down at the letter. "I can't give up the anchor. If truth is just what works, then power decides truth. Whoever controls the narrative controls reality."

  "And I can't give up the vehicle," I said. "If truth is just what's fated in the distant future, then truth is irrelevant to the present. It becomes a religious hope, not a tool."

  "So we're not arguing about your great-grandmother," Priya said.

  "No," I said. "We're arguing about whether 'true' is a noun or a verb. You think it's a destination. I think it's the walking."

  "And neither of us can walk the other's road," she said.

  "Not without losing our footing."

  She reached out and folded the photocopy in half, then in half again. "Then we keep the question open. That's the only truth we can agree on."

  "For now," I said. "And on my view, that's enough."

  "On mine," she replied, "it's just where we are."
