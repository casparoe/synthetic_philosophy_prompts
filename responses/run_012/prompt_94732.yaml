  Write the proposal: the question stated so it has a determinate answer; why the usual framing leaves it open rather than settling it; what I'd actually do over the term (say, a short case list — having a child, emigrating, a religious conversion, and the corresponding refusals — plus one worked case carried all the way through, and an argument about what opaque-from-both-sides implies for how the decision should be made); why that approach rather than just reporting what the psychology literature says; what a result would look like and what would count as the project failing; and whether this is honestly a term's work or the start of something much bigger. No bibliography or citations — I'll add those myself. British English please.
