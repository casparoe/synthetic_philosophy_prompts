prompt: |-
  ok so I'm in this social epistemology seminar thats basically half political philosophy, and my roommate and I have been arguing for three weeks about the Condorcet jury theorem and I want to actually write up the thing we should be able to co-sign instead of just yelling about it in the kitchen.

  His position: the jury theorem is a just-so story. The assumptions — independence, everyone better than a coin flip, sincere voting, exactly two options — fail so badly in real electorates that it can't carry any justificatory weight for majority rule, and its honest lesson is a warning about correlated error. My position: it's more robust than he thinks, the assumptions can be relaxed (average competence above a half, errors that aren't perfectly correlated) without losing the result, and it's still the best epistemic argument we have for majority rule in large electorates.

  Write the joint statement we could both sign. I want:

  1. A numbered list of agreed claims — what the theorem actually says, including what happens when competence is below a half and when it's exactly a half; what it doesn't say (about legitimacy, about deliberation, about which individuals are right, about anything other than two options); and the fact that it's a completely different result from the voting-paradox/cycling stuff, even though both are named after the same guy and everyone conflates them.

  2. A table of our actual disagreements, each stated in wording the side that holds it would accept, not a strawman of either.

  3. The cruxes — the sub-questions such that settling one would move at least one of us — and for each, the case or argument we'd both agree bears on it, plus what each of us predicts about it, written down before we look.

  Build it around these cases, which we've already agreed to fight over, and tell us what each would show:

  (a) 5000 voters, each independently 0.55 likely to be right on a yes/no question. I say the majority is basically certainly right; he says the number is doing all the work and no real electorate is like that.
  (b) The same electorate but the errors share a common cause — say voters follow one of two partisan cues, and when a cue points the wrong way most of that bloc votes wrong. I claim this is the case that actually threatens the theorem; he thinks every real case is this case.
  (c) Competences are spread out, averaging 0.6, with plenty of voters below 0.5. He says the below-average voters are a drag on the group; I say the average is what matters.
  (d) The issue has no fact of the matter, or the answer depends on what we vote — a referendum on whether the currency will hold, where the no vote is the thing that makes it fail. Does the theorem even get to apply?

  Also tell us which parts of our fight are just verbal — e.g. if we mean different things by 'supports democracy' — and say so explicitly.

  No citations or references please, we're not writing a lit review, just the substance.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** Social epistemology seminar (half political philosophy). Two roommates arguing about the Condorcet Jury Theorem (CJT).
      *   **Goal:** Write a joint statement they can co-sign to stop yelling and start collaborating/writing.
      *   **Positions:**
          *   *Roommate (Skeptic):* CJT is a "just-so story." Assumptions (independence, competence > 0.5, sincerity, binary options) fail in reality. It warns about correlated error more than it justifies majority rule.
          *   *User (Proponent):* CJT is robust. Assumptions can be relaxed (average competence, imperfect correlation). It's still the best epistemic argument for majority rule in large electorates.
      *   **Required Components:**
          1.  Numbered list of agreed claims (what the theorem says, limits, distinction from voting paradox).
          2.  Table of actual disagreements (charitable wording).
          3.  The Cruxes (sub-questions, agreed evidence/cases, predictions).
          4.  Specific Cases to analyze: (a) Large N, p=0.55; (b) Correlated error/partisan cues; (c) Heterogeneous competence (avg 0.6, some < 0.5); (d) No fact of the matter/self-fulfilling prophecy.
          5.  Identify verbal disputes (e.g., "supports democracy").
      *   **Constraint:** No citations or references. Just substance.

  2.  **Drafting Section 1: Agreed Claims:**
      *   Need to state the math clearly without getting bogged down in proofs.
      *   *Core Theorem:* Binary choice, independent voters, competence $p > 0.5$, majority rule $\rightarrow$ probability of correct group decision approaches 1 as $N \rightarrow \infty$.
      *   *Competence < 0.5:* If $p < 0.5$, majority rule makes error approach 1 (flipping the vote fixes this).
      *   *Competence = 0.5:* Group accuracy stays at 0.5 regardless of size.
      *   *Limitations:* Doesn't establish legitimacy (moral/normative), doesn't require deliberation (actually assumes independence), doesn't identify *who* is right, doesn't apply to >2 options without modification.
      *   *Distinction:* Must distinguish from Condorcet's Paradox (cycling/intransitivity). CJT is about truth-tracking; Paradox is about preference aggregation.
      *   *Tone:* Neutral, precise, mutually acceptable.

  3.  **Drafting Section 2: Table of Disagreements:**
      *   Need to capture the "Skeptic" vs. "Proponent" views without strawmanning.
      *   *Skeptic:* Focus on empirical applicability. Assumptions are too idealized. Real politics is correlated.
      *   *Proponent:* Focus on robustness/idealization. It's a baseline model. Relaxations exist.
      *   *Key tension:* Is it a *justification* or a *warning*?
      *   *Format:* Issue | Skeptic Position | Proponent Position.

  4.  **Drafting Section 3: The Cruxes & Cases:**
      *   This needs to be the actionable part. What would change our minds?
      *   *Case (a) 5000 voters, p=0.55:*
          *   *Math:* Law of Large Numbers kicks in hard. Accuracy $\approx 1$.
          *   *Disagreement:* User says this shows potential; Roommate says this never happens (independence fails).
          *   *Crux:* How close to independence do real electorates get?
      *   *Case (b) Correlated Error (Partisan Cues):*
          *   *Math:* Correlation reduces the effective $N$. If correlation is high enough, accuracy doesn't converge to 1.
          *   *Disagreement:* User says this is the specific threat to model; Roommate says this *is* the model of reality.
          *   *Crux:* Is correlation strong enough to negate the $N$ advantage?
      *   *Case (c) Heterogeneous Competence:*
          *   *Math:* It's the *average* competence that matters (mostly), provided weights aren't skewed badly.
          *   *Disagreement:* Roommate says low competence voters drag it down; User says average > 0.5 suffices.
          *   *Crux:* Does the distribution shape matter more than the mean?
      *   *Case (d) No Fact of the Matter (Self-fulfilling):*
          *   *Concept:* CJT requires a "truth" to track. If the vote creates the truth, epistemic justification collapses.
          *   *Disagreement:* User might try to stretch "truth" to include "best outcome"; Roommate says this is category error.
          *   *Crux:* Can epistemic democracy apply to normative/constructive questions?
      *   *Verbal Disputes:* "Supports Democracy." User = provides epistemic reason; Roommate = provides sufficient justification for legitimacy.

  5.  **Review and Refine:**
      *   *Check Constraints:* No citations? Yes. Numbered list? Yes. Table? Yes. Cruxes with predictions? Yes.
      *   *Tone Check:* Is it collaborative? Yes. Does it sound like two philosophy students trying to resolve a fight? Yes.
      *   *Math Check:* Ensure the $p < 0.5$ and $p = 0.5$ claims are accurate. (If $p < 0.5$, majority gets it wrong almost certainly. If $p = 0.5$, it's a coin flip).
      *   *Condorcet Paradox Distinction:* Make sure this is clear. CJT = Truth tracking (binary). Paradox = Preference cycling (3+ options).
      *   *Refining the "Joint Statement" vibe:* It should look like a document they drafted together at 2 AM to clarify their thoughts.

  6.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In Case (c), strictly speaking, if competence varies, the theorem holds if the *average* is above 0.5 and voters are independent, but there are nuances about how the variance interacts with $N$. I should keep it simple: The Proponent claims average matters; Skeptic claims the tail matters.
      *   *Correction:* In Case (d), this is the hardest one. CJT fundamentally requires a truth value. If there is no truth, CJT is inapplicable. I need to make sure the agreement reflects that CJT *doesn't* apply here, but the disagreement is about whether *any* epistemic argument works here.
      *   *Verbal Dispute:* Make sure to highlight the definition of "Justification."

  7.  **Final Output Generation** (Proceeding to generate response based on these steps).
answer: |-
  # Joint Statement on the Condorcet Jury Theorem
  **Drafted for Social Epistemology Seminar**
  **Signatories:** [Roommate A] & [Roommate B]

  ### 1. Agreed Claims
  *We agree on the following formal and conceptual boundaries regarding the Condorcet Jury Theorem (CJT).*

  1.  **The Core Result:** In a binary choice (True/False or A/B) where there is a fact of the matter about which option is correct, if voters vote sincerely, independently, and each has a probability of choosing correctly ($p$) greater than 0.5, the probability that the majority vote is correct approaches 1 as the number of voters ($N$) approaches infinity.
  2.  **Competence Below a Half:** If the average individual competence is strictly less than 0.5, the probability that the majority is correct approaches 0 as $N$ increases. (In this scenario, flipping the majority vote would yield a near-certain correct outcome).
  3.  **Competence Exactly at a Half:** If individual competence is exactly 0.5, the group's probability of being correct remains 0.5 regardless of the size of the electorate. Size provides no epistemic benefit in this specific case.
  4.  **Scope Limitations:** The theorem does not establish moral legitimacy, fairness, or authority. It addresses only the *epistemic* quality of the outcome (truth-tracking). It does not identify which specific individuals are competent. It does not account for deliberation (in fact, deliberation often threatens the independence assumption). It does not formally apply to choices with more than two options without significant modification.
  5.  **Distinction from Condorcet's Paradox:** The Jury Theorem is not the same as Condorcet's Paradox (voting cycles). The Paradox concerns the aggregation of *preferences* over three or more options where majority rule can be intransitive (A beats B, B beats C, C beats A). The Jury Theorem concerns the aggregation of *judgments* about a binary truth. Conflating the two is an error.
  6.  **Idealization:** We agree that the CJT is a mathematical model based on idealized assumptions. The disagreement lies not in the math, but in the model's applicability to real-world political institutions.

  ---

  ### 2. Table of Disagreements
  *We disagree on the interpretive weight and empirical applicability of the theorem. Below are our positions stated charitably.*

  | Issue | Skeptic Position (Roommate) | Proponent Position (User) |
  | :--- | :--- | :--- |
  | **Primary Lesson** | The theorem is primarily a warning: it shows how easily correlated error destroys truth-tracking. Its value is negative, not positive. | The theorem is primarily a justification: it shows how majority rule can harness dispersed information. Its value is positive, not negative. |
  | **Independence** | Real electorates are never sufficiently independent. Common information sources (media, parties) create correlations that invalidate the convergence result. | Independence is an idealization, but the result is robust to *some* correlation. As long as errors aren't perfectly synchronized, large numbers still help. |
  | **Competence** | The assumption that voters are better than random ($p > 0.5$) is empirically false for many complex political questions. | We do not need every voter to be $> 0.5$. We only need the *average* competence to be $> 0.5$, which is plausible in large groups. |
  | **Justificatory Weight** | Because the assumptions fail, the theorem cannot carry justificatory weight for democracy. It is a "just-so story." | Even if assumptions aren't perfectly met, the theorem provides the *best available* epistemic argument for why we should trust majorities over elites or minorities. |
  | **Applicability** | The theorem applies only to questions with objective truth values (e.g., "Did the defendant do it?"). Most politics is normative. | The theorem can be extended to normative questions if we treat "correct" as "would be chosen under ideal conditions" or "best outcome." |

  ---

  ### 3. The Cruxes & Test Cases
  *We identify the following sub-questions as the "cruxes" of our debate. Settling these would move at least one of us. We record our predictions below before analyzing the cases.*

  #### Verbal Dispute Note
  We acknowledge a verbal dispute regarding the phrase **"Supports Democracy."**
  *   **Proponent** uses this to mean: "Provides a prima facie epistemic reason to prefer majority rule over random chance or minority rule."
  *   **Skeptic** uses this to mean: "Provides sufficient normative justification to legitimize binding political authority."
  *   *Resolution:* We will avoid using the phrase "supports democracy" without qualification. We will distinguish between *epistemic reliability* and *political legitimacy*.

  #### Case (a): The Large N, Low Competence Case
  *Scenario:* 5,000 voters. Each is independently 0.55 likely to be right on a yes/no question.
  *   **What this shows:** Mathematically, the probability of the majority being correct is effectively 100%.
  *   **The Crux:** Does this mathematical certainty translate to political reality?
  *   **Skeptic Prediction:** This case is a fantasy. No real electorate has independent errors. The "5000" is doing all the work, and since real $N$ is effectively lower due to correlation, the result vanishes.
  *   **Proponent Prediction:** This case establishes a baseline. Even if real independence is imperfect, if we can get close to this structure, the epistemic gain is massive. It proves the *mechanism* works.

  #### Case (b): Correlated Error (Partisan Cues)
  *Scenario:* Same electorate, but errors share a common cause. Voters follow one of two partisan cues. When a cue points the wrong way, most of that bloc votes wrong.
  *   **What this shows:** Correlation reduces the "effective sample size." If correlation is high enough, the majority accuracy stops converging to 1, even if $p > 0.5$.
  *   **The Crux:** Is real-world correlation strong enough to break the theorem?
  *   **Skeptic Prediction:** Every real case is this case. Political information is structurally correlated (media ecosystems, party platforms). The theorem collapses in all actual elections.
  *   **Proponent Prediction:** This is the specific threat, but it's not total. Correlation is rarely perfect. The theorem still holds *ceteris paribus*. We should view this as a design challenge (reduce correlation) rather than a refutation.

  #### Case (c): Heterogeneous Competence
  *Scenario:* Competences are spread out, averaging 0.6, with plenty of voters below 0.5.
  *   **What this shows:** The theorem holds if the *mean* competence is > 0.5, provided voting weights are equal.
  *   **The Crux:** Do the low-competence voters drag the group down disproportionately?
  *   **Skeptic Prediction:** The below-0.5 voters are a active drag. They aren't just noise; they are anti-signal. In a weighted system, we should exclude them. In a one-person-one-vote system, they endanger the result.
  *   **Proponent Prediction:** The average is what matters. The high-competence voters outweigh the low-competence ones statistically. Excluding voters introduces bias that is likely worse than the noise they add.

  #### Case (d): No Fact of the Matter (Self-Fulfilling)
  *Scenario:* A referendum on whether a currency will hold. The "No" vote causes the crash. There is no independent truth prior to the vote.
  *   **What this shows:** CJT requires a truth to track. If the vote *creates* the outcome, the concept of "correctness" is undefined.
  *   **The Crux:** Can epistemic arguments apply to constitutive political choices?
  *   **Skeptic Prediction:** The theorem simply does not apply here. Since much of politics is constitutive (we decide what we value), the CJT is irrelevant for the most important votes.
  *   **Proponent Prediction:** We can adapt the framework. "Correctness" can mean "stable equilibrium" or "best outcome given preferences." If we can't define truth, we fall back on procedural fairness, but CJT still covers the instrumental parts of politics (e.g., "Will this policy cause inflation?").

  ---

  ### 4. Next Steps
  To move forward, we agree to write a paper that treats the CJT not as a proof of democracy's legitimacy, but as a **diagnostic tool**.
  1.  We will accept the Proponent's math regarding robustness (average competence, relaxed independence).
  2.  We will accept the Skeptic's empirical claim that correlation is the primary failure point in modern electorates.
  3.  We will conclude that the value of the theorem is in identifying *conditions under which majority rule fails* (high correlation, competence < 0.5), rather than proving it always succeeds.

