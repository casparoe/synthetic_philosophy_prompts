answer: |-
  You ask for a statement of requirements for a theory that grounds content in biological function and history, specifically one that avoids smuggling in an interpreter while remaining agnostic about consciousness. To be successful, such a theory must satisfy a set of constraints, some of which are non-negotiable demands on any account of representation, and others of which are contested commitments within the teleosemantic camp itself. The most fundamental requirement, which is settled across almost all philosophical work on intentionality, is the possibility of error. A theory of content must distinguish between a state occurring and its conditions of satisfaction obtaining. If every time a state occurs it is thereby true, you have not explained representation, you have explained mere correlation. This means the theory must handle your case of the ordinary misfire or false belief without collapsing the content into nothingness. Any theory that fixes content solely by what currently causes the state fails this non-negotiable requirement, because if a drone causes the alarm state, the state would be true of drones, and thus not false. Therefore, to meet this settled demand, the theory must ground norms in something other than current causal covariance, which is why most theories of the kind you are investigating appeal to history.

  Once you commit to history to secure the possibility of error, you encounter the first major cluster of requirements involving the hawk and drone case, the extinct target case, and the food versus courtship case. Here the requirements become contested between those who fix content by selected effects and those who fix it by current use. To handle the hawk and drone case correctly, where the bird falsely signals a hawk when seeing a drone, the theory must assign content based on what the mechanism was selected to detect in the past, not what triggers it now. This is a requirement that selected effect theories meet but current use theories fail. Similarly, for the creature with an inner state about something that no longer exists, the theory must allow the state to retain content despite the absence of a current causal link. This is another point where selected effect theories succeed and causal theories fail, as the latter cannot ground content without an existing relatum. However, the food versus courtship case reveals a tension in these historical requirements. If a signal originally selected for food discovery is co-opted for courtship, a strict selected effect theory implies the content remains about food, potentially classifying the courtship use as systematic error or dual function. A current use theory would say the content has shifted to mating. There is no consensus here; whether content must be stable across functional shifts or plastic enough to track new utilities is a preference of one camp over the other, not a settled requirement. You must decide whether you prioritize historical stability or functional plasticity, as a theory cannot easily maximize both without complication.

  The next requirement concerns the granularity of content, illustrated by your case of the narrow shape versus the broad danger. This is arguably the most difficult hurdle for any historical theory. The theory must deliver a determinate content, meaning it must specify whether the state represents a specific retinal pattern, a hawk shape, or a predator generally. It is a non-negotiable requirement that content be determinate enough to guide behavior and truth conditions, yet it is a settled finding among critics that evolutionary history often underdetermines this specificity. Selection pressures rarely distinguish between detecting a specific shape and detecting the danger that shape signifies, provided both correlate perfectly in the environment of adaptation. A theory that cannot resolve this collapses the distinction between the sign and the significance, failing to explain how the organism represents the world rather than just its own sensory surfaces. Selected effect theories often struggle here, as the historical record may not specify which level of abstraction was the target of selection. Some theorists argue this indeterminacy is fatal, while others argue it reflects a genuine indeterminacy in nature. You must treat this as a critical stress test; if the theory cannot explain why history selects one granularity over another, it fails to deliver a usable account of what the organism represents.

  Finally, you have the case of the mechanism that produces a state reliably but is never put to use by the creature. This tests the link between representation and consumption. A non-negotiable requirement for many is that representation must be tied to function, but it is genuinely contested whether function requires actual consumption by the organism or merely a history of such consumption. If the creature never uses the state, a current use theory must deny it has content, whereas a selected effect theory can affirm content based on ancestral use. This distinction matters for your purpose because if you require current use, you risk making content too fragile for organisms with vestigial or developing systems. If you require only historical use, you risk attributing content to states that are functionally inert in the present organism. The conflict you are most interested in, regarding whether these requirements can be met together, centers on the tension between the need for historical norms to secure error and the vagueness of history to secure determinacy. The subset of requirements that is most difficult to satisfy simultaneously is the demand for error tolerance (requiring history) and the demand for determinate granularity (which history often fails to provide). You can have a theory that secures the possibility of falsehood by appealing to selection, but you may have to accept that the specific content remains indeterminate between narrow and broad conditions. Alternatively, you can sharpen the content by appealing to current causal specifics, but you will lose the ability to explain error in cases of drones or extinct objects. The result you care about is likely that a purely historical theory can secure the normativity required for error without an interpreter, but it pays for this with a degree of indeterminacy that requires additional constraints to resolve, constraints that are not yet settled within the field.
