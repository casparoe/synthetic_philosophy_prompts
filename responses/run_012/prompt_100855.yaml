      *   *Core Requirement 6 (Vestigial/Unused):* Address the Unused Mechanism. Does function require actual use? Selected effect says history of use is enough. Current use says no content.
      *   *Consistency Check:* Discuss the tension. The main tension is between handling error (requires history/norms) and handling indeterminacy (history is often vague). Also between stability (history) and flexibility (current use).
      *   *Conclusion:* Summarize the trade-off. You can have error and stability (history-based) but risk indeterminacy and rigidity. You can have specificity and flexibility (current use) but risk losing the possibility of error (swampman problem).

