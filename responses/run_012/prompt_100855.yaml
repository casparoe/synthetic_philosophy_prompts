      *   Address which theories fail which? Yes.
      *   Tone? Letter-like/essay-like.

  7.  **Final Polish:** Check the flow. Ensure the distinction between "requirements for a theory of content" (generally) and "requirements for a teleosemantic theory" is clear. The prompt asks for requirements for a theory of *that kind* (biological function/history). So I should frame the requirements as what such a theory *must* deliver to succeed on its own terms, while noting where the terms themselves are debated.

