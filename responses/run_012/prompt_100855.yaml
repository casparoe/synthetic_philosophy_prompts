      *   **Specific Purpose:** Usable for someone wanting to say what an organism represents without smuggling in an interpreter (no consciousness required).
      *   **Key Interest:** Whether the requirements can be met together (consistency), and if not, which subset conflicts.
      *   **Specific Cases to Address:**
          1.  Innate alarm call for hawks, now triggered by drones (hawks gone).
          2.  Signal once about food, now used for courtship (exaptation/co-option).
          3.  Inner state never correct because the target no longer exists.
          4.  Narrow (shape/wavelength) vs. Broad (danger/kind) content ambiguity (history doesn't settle).
          5.  Mechanism produces state reliably but never uses it.
          6.  Ordinary error (false belief/misfire) must be possible without making content null.
      *   **Format:** Continuous prose, no headings, no bullet points, no bold, no tables (like a letter).
      *   **Constraint:** Distinguish between settled requirements and contested preferences (don't present contested views as consensus).
      *   **Constraint:** Mention briefly which familiar positions (selected effect vs. current use) fail which requirement.

  2.  **Deconstruct the Requirements/Cases:**

      *   *Case 1 (Hawks/Drones):* This is the "Swampman" or "Misrepresentation" problem in an evolutionary context. If the function is fixed by history (selected effect), the content is "hawk". If fixed by current causal correlation, it's "hawk-shaped thing". The theory needs to handle misrepresentation (calling a drone a hawk is false, not true).
      *   *Case 2 (Food/Courtship):* This is the "Exaptation" problem. Does content shift with function? If selection history fixes content, it might still be about food. If current use fixes it, it's about mating. The theory needs to decide if content tracks function change.
      *   *Case 3 (Extinct Target):* This is the "Empty Name" or "Non-existent Object" problem. If the thing doesn't exist, can the state still be about it? (e.g., believing in phlogiston). Teleosemantics usually says yes, based on historical function.
      *   *Case 4 (Narrow vs. Broad):* This is the "Disjunction Problem" or "Indeterminacy". Did selection select for detecting *predators* or *hawk-shaped retinal patterns*? History often underdetermines this. The theory needs to resolve or acknowledge this indeterminacy.
      *   *Case 5 (Unused Mechanism):* This is the "Vestigial" or "Spandrel" problem. If a state is produced but never used, does it have content? Selected effect theories might say no (no function), causal theories might say yes (correlation).
      *   *Case 6 (Ordinary Error):* This is the core requirement of *any* theory of intentionality. It must allow for falsehood. If a state occurs when its condition isn't met, it must be false, not contentless. This is the "Possibility of Error" requirement.

