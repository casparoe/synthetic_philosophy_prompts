          *   Marcus: That distinction is a shield. It lets you publish numbers that policymakers hear as "this child is 70% genetic."
      *   **Round 3: Intervention and Policy.**
          *   Elena: Knowing $h^2$ helps target. If $c^2$ is high in disadvantaged, shared environment interventions work there.
          *   Marcus: But citing $h^2$ invites determinism. The mean difference is the ethical priority, not the variance ratio.
      *   **Round 4: Sharpening the Disagreement (The End).**
          *   They need to diverge further.
          *   Elena insists the number is a fact about the population structure.
