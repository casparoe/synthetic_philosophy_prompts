      *   Within population? Yes.
      *   Distinction contested? Yes.
      *   Sharper at end? Yes.

  *(Self-Correction during drafting)*: Make sure Marcus doesn't just sound like a sociologist. He needs to know the biometrics. He should mention the denominator of the heritability ratio. Make sure Elena doesn't sound like a determinist. She should emphasize the contingency of the estimate.

  *(Refining the "Individual vs Population" point)*: Elena should argue the distinction is necessary for truth. Marcus should argue it's insufficient for ethical safety or scientific utility.

  *(Refining the Ending)*: They shouldn't agree to disagree politely. They should recognize their frameworks are incommensurable.

  Let's write.

  *Word Count Check:* Aiming for roughly 1,500 words. I will need to ensure the dialogue is substantive and not too snappy.

