          *   Disagreement sharper at the end than beginning (no resolution, no winner).
          *   **Anchor:** A stipulated result: Large pre-registered study, single instrument/population. Early reading ability. $h^2 \approx 0.7$ in advantaged third, $h^2 \approx 0.3$ in disadvantaged third. $c^2$ (shared environment) larger in disadvantaged third. Mean score lower in disadvantaged third.
          *   **Topics:** Inference about individual children? Is the trait "more genetic" in one group? Implications for intervention/environmental causes? Fact about world vs. fact about sampled environments? Policy citation?
          *   **Specific Philosophical Distinction:** Contest the distinction between "sources of variation in a population" vs. "sources of the trait in an individual."
          *   **Constraint 1:** No resting on "high heritability does not imply immutability" (must go beyond).
          *   **Constraint 2:** Stay inside the population (no between-population claims).
          *   **Format:** Dialogue.
          *   **Length:** About 1,500 words.
          *   **No citations/literature review.**

  2.  **Deconstruct the Anchor Result:**
      *   Trait: Early reading ability.
      *   Group 1 (Advantaged): $h^2 = 0.7$, $c^2$ low, Mean high.
      *   Group 2 (Disadvantaged): $h^2 = 0.3$, $c^2$ high, Mean low.
      *   This is a classic GxE interaction pattern (Scarr-Rowe hypothesis style), but I cannot cite Scarr or Rowe. I must treat it as stipulated data.
      *   Key tension: Does higher $h^2$ in the advantaged group mean genes matter *more* there? Or does it mean environment is more uniform? Does lower $h^2$ in disadvantaged mean environment matters *more*? Or that environmental variance is swamping genetic variance?

  3.  **Character Voices:**
      *   **Elena (Geneticist):** Precise, focused on variance decomposition, defends the parameter as a descriptive statistic of population structure. Wants to salvage utility for policy by being precise.
      *   **Marcus (Developmentalist):** Focused on mechanism, process, and the reification risk. Argues the parameter obscures the causal process. Knows the math but hates the metaphysics.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. Establish the stipulated result immediately.
      *   **Round 1: Interpretation of the Difference.**
          *   Elena: The variance *is* different. In advantaged homes, environmental noise is reduced, allowing genetic signal to emerge.
