  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check Constraint 1:* Avoid "heritability doesn't mean immutability." Instead, focus on what the variance ratio *does* imply about causal structure.
      *   *Check Constraint 2:* Ensure they don't say "Group A is smarter than Group B genetically." Keep it within the single population, just stratified by SES.
      *   *Check Length:* Need to expand on the philosophical distinction about individual vs. population to meet the word count and depth requirements.
