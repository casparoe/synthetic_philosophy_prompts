  **Version 1: The Personal Scale**

  I tried to precommit to finishing a draft by giving my laptop password to a friend. An economist at the table said, "If you ask for it back, you've simply revealed you prefer scrolling." But the friend kept unlocking me whenever I had a good reason. I realized true self-binding doesn't require willpower; it requires an enforcer who treats your sincere plea as a syntax error.

  **Working words:** *"treats your sincere plea as a syntax error."*
  **Why:** This turns the "wax requirement" into modern machinery. It signals that the enforcer must not just ignore the plea, but structurally fail to process it as valid input.

  ***

  **Version 2: The Constitutional Scale**

  We tried to bind a future majority that never signed the contract. The economist said, "If they break it, they've simply revealed a new preference." But the court keeps weighing their reasons. We learned you can't bind the sovereign unless the interpreter is obliged to treat the majority's voice as inadmissible evidence.

  **Working words:** *"treat the majority's voice as inadmissible evidence."*
  **Why:** This captures the constitutional analogue of the wax ears. It highlights that sovereignty cannot be bound by argument, only by a procedural rule that renders the sovereign's current will legally unintelligible.
