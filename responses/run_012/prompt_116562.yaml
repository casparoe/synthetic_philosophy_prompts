          *   I state the deflationary view (correlated evidence/Bayesian error).
      *   **Round 2: The Hermit (My Attack).**
          *   I introduce the hermit. He has one book. He ignores outside info. He fits the "vice" description but lacks the "community."
          *   She needs to counter this. How? The hermit is just biased or deluded. An echo chamber requires the *mechanism* of exclusion to be social. The hermit's isolation is physical, not epistemic-structural.
      *   **Round 3: Stickiness (Her Attack).**
          *   She asks: If it's just Bayesian math, why don't they update when shown proof? A Bayesian *should* update on strong disconfirming evidence. Echo chamber members don't. They invert the evidence.
