answer: |-
  ### Part I: The Actuarial Restatement

  Here is the debate on reparations for historical injustice (slavery, Jim Crow, colonial expropriation), translated into the vocabulary of casualty and pension risk.

  **The Coverage Trigger and Retroactive Date**
  The central technical dispute is whether the liability attaches on an **occurrence basis** or a **claims-made basis**.
  *   **The Occurrence View:** The "insured event" was the act of enslavement or expropriation itself. The liability attached at the moment of the wrong, regardless of when the claim was reported. The problem is that the "policy" in force at that time (the legal/financial framework of the 18th/19th century) did not price this risk, had no reserves, and the original "insureds" (slaveholders, colonial corporations) are largely dissolved.
  *   **The Claims-Made View:** The liability attaches when the claim is made (now). The current "policyholders" (the modern State, successor corporations) are being asked to cover claims for events that occurred prior to any existing **retroactive date**. In standard underwriting, you exclude prior acts to avoid adverse selection; here, the claimants are demanding coverage for prior acts specifically.

  **The Loss Reserve and IBNR**
  Proponents argue there is a massive **Incurred But Not Reported (IBNR)** loss. The harm occurred, but the quantification and reporting were suppressed by the legal system (statutes of limitations, Jim Crow laws). The "loss development triangle" spans generations. We are currently in the tail of the distribution.
  *   **The Tail Estimate Debate:** Just as you argue internally about whether a tail factor is a fact or a convention, the reparations debate splits here. Is the dollar figure calculated (e.g., unpaid wages plus interest) a **fact about the world** (a deterministic liability), or is it a **convention** (a symbolic number agreed upon to close the book)?
  *   **Discounting:** To establish a reserve, you must discount future payments to a **valuation date**. Proponents often use a risk-free rate plus a premium for the duration of the injustice. Opponents argue the duration is too long for any credible discount curve, rendering the Present Value (PV) infinite or meaningless.

  **Liability: Subrogation, Contribution, and Successorship**
  *   **Who is the Policyholder?** The objection that "no living person committed the wrong" translates to a **Change of Control** or **Successor Liability** issue. Is the current US Treasury the same legal entity as the 1860 Treasury? If the corporate veil has been pierced by time, there is no liable party.
  *   **Contribution:** If liability is accepted, how is it allocated? Is it **joint and several** among all taxpayers? Or can we seek **contribution** from specific industries (banking, insurance, rail) that benefited from the risk?
  *   **Subrogation:** If reparations are paid, does the State acquire **subrogation rights** to recover costs from estates that were unjustly enriched? Most proposals waive this, which looks like a leakage of value from the risk pool.

  **The Claimant: Insurable Interest and Betterment**
  *   **Insurable Interest:** Standard indemnity requires the claimant to suffer the loss. The **Non-Identity Problem** (descendants wouldn't exist but for the injustice) translates to a **Causation/Betterment** defense. The insurer argues: "But for the insured event, you (the claimant) would not exist. Therefore, you cannot claim a loss relative to a baseline where you are null."
  *   **Aggregation and Correlation:** These are not independent claims. They are 100% correlated systemic risks. You cannot diversify this portfolio. This creates a **concentration risk** that threatens the solvency of the "insurer" (the State).

  **Underwriting and Moral Hazard**
  *   **Pricing the Risk:** The underwriter's problem is that there is **no credible loss experience**. We have no data on how to price intergenerational torts. Setting a price creates **moral hazard**: does it imply that future injustices can be "priced in" and indemnified?
  *   **Indemnity vs. Punitive:** Is the payment **indemnity** (making whole) or **punitive damages** (deterrence)? Actuarially, indemnity is a liability; punitive damages are a penalty. Mixing them corrupts the loss reserve.

  ***

  ### Part II: The Residue Report

  You asked for the residue: where the translation holds, where it distorts, and where it breaks. I have categorized these failures according to your three expected clusters.

  #### 1. The Counterfactual Baseline (Valuation Date and Discount Curve)
  **The Gap:** In reserving, we assume a "but-for" world is modelable (e.g., the building wouldn't have burned). In reparations, the "but-for" world (a diaspora that remained in Africa, or a US without slavery) is economically and demographically unknowable. There is no agreed **valuation date**, no **discount curve**, and no uncontested picture of the status quo ante.

  **Verdict:** *This marks a real limitation of actuarial thinking.*
  Actuarial science is a technology for managing uncertainty within a defined system. It requires a closed loop of causality to calculate a loss. The philosophical claim of reparations explicitly rejects the closed loop; it argues that the "system" itself was corrupted, so the standard models (GDP growth, wage curves) are tainted inputs.
  However, your demand for a clean loss event is also a legitimate critique. If the "loss" cannot be distinguished from the general noise of history (wars, migrations, other policy choices), then the claim is **unreservable**. It is not a liability; it is a political appropriation. The philosophical debate often masks this indeterminacy with moral certainty. When a philosopher says "the debt is owed," they are speaking metaphorically. When you ask "what is the valuation date?", you are exposing that the debt has no financial topology.

  #### 2. The Identity of the Claimant (Insurable Interest)
  **The Gap:** A loss must be a loss *to someone*. In insurance, the payee must have an **insurable interest** at the time of the event. Descendants did not exist at the time of the event. The philosophical counter-argument is that the "harm" is a continuing trust violation, not a discrete injury.

  **Verdict:** *This translates only with distortion.*
  To make this fit, we have to posit a **Trust** structure rather than an **Insurance** structure. In a trust, beneficiaries have rights based on the settlor's intent, not their own injury. If we model this as insurance (indemnity for harm), the Non-Identity Problem breaks the model (you can't be indemnified for a life you wouldn't have had). If we model it as a Trust (inheritance of a claim), the actuarial logic holds better, but the "loss" becomes a **missed distribution** rather than a **damage payment**.
  The distortion lies in the actuarial assumption that all liabilities stem from *damage*. Some liabilities stem from *unjust enrichment*. Actuarial models are good at pricing the former (casualty) and the latter (pension/benefit), but rarely both simultaneously. The debate conflates them. If it's unjust enrichment, the "loss" is the amount held by the insurer, not the harm to the claimant. Your framework struggles here because it treats the claimant's loss as the primary variable, whereas the philosophical claim might treat the holder's gain as the primary variable.

  #### 3. Standing to Adjudicate (The Insurer and the Policy)
  **The Gap:** There is no insurer, no policy, and no tribunal whose authority is accepted by all parties. The State is the regulator, the potential insurer, and the insured.

  **Verdict:** *This has no counterpart at all.*
  This is the hard stop. Actuarial work presupposes a solvent entity bound by contract and law. The reparations debate is often about *constituting* that entity or *rewriting* the contract (the Constitution).
  *   **The "Lapsed Policy" Objection:** When opponents say "too much time has passed," they are invoking a **statute of repose**. In actuarial terms, the policy lapsed. The philosophical reply is that the "policy" (the social contract) was voided by fraud (slavery) and never reinstated.
  *   **The Solvency Issue:** If the State is the insurer, and the claim is large enough to threaten solvency (via inflation, tax burden, capital flight), the actuary must declare the risk **uninsurable**. Philosophy does not have a concept of "insurable." It only has "owed."
  *   **Adverse Selection:** If the State admits liability, it sets a precedent for all other historical claims. This is **systemic adverse selection**. No private insurer would underwrite this. The State can only pay via taxation (coercion) or inflation (default). Neither is an actuarial solution.

  ### Conclusion: The Honest Failure

  You asked whether the gaps mark a limitation of actuarial thinking or a sign that the philosophical claim is indeterminate.

  **It is both.**

  1.  **Limitation of Actuarial Thinking:** Your framework assumes that *balance is possible*. It assumes that for every debit there is a credit, and that the book can be closed. Reparations philosophy often argues that the book *cannot* be closed, only acknowledged. The "tail estimate as convention" insight you mentioned is the key here. If the payment is a convention (acknowledgment), then actuarial pricing is the wrong tool. You are trying to price a sacrament.
  2.  **Indeterminacy of the Claim:** However, your demand for a clean loss event is a legitimate stress test. Much of the philosophical debate relies on ambiguity about *what* is being paid. Is it for lost wages (calculable)? Is it for pain and suffering (incalculable)? Is for systemic disadvantage (correlated risk)? Until the proponents define the **coverage trigger** and the **measure of indemnity**, the claim remains an **unpriced exposure**.

  **Final Residue:**
  The debate survives the trip only if you reclassify "Reparations" not as **Casualty Insurance** (indemnity for wrongs) but as **Social Pension** (a defined benefit plan for a specific class of citizens).
  *   If it is Casualty: It fails. No insurable interest, no retroactive coverage, no liable insured.
  *   If it is Pension: It works. We pay benefits to a class of beneficiaries based on eligibility criteria (lineage), funded by current contributions (taxes), regardless of individual loss experience.

  The philosophical resistance to the "Pension" model is that it feels like a "handout" rather than "justice." The actuarial resistance to the "Casualty" model is that it is mathematically incoherent. The debate persists because neither side wants to admit which model they are actually using.
