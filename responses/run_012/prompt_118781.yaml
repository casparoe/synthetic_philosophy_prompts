answer: |-
  1. **Data Regime:** The learner receives a finite dataset $D$ of size $N$, drawn from a noisy distribution over positive examples only. There are no explicit negative labels indicating which structures are invalid (no systematic error correction).

  2. **Hypothesis Space:** The set of computable grammars $H$ consistent with universal computation is vast. The VC dimension or Kolmogorov complexity of the unconstrained $H$ is too high relative to $N$.

  3. **Underdetermination:** The version space—the subset of $H$ achieving zero empirical risk on $D$—contains many hypotheses that diverge on unseen structures. $D$ does not uniquely identify the target grammar $h^*$.

  4. **Generalization Performance:** Despite the underdetermination, the learner achieves low true risk on out-of-distribution samples (novel syntactic structures) never encountered in $D$. The learner infers negative constraints from positive data alone.

  5. **Inductive Bias Necessity:** By the No-Free-Lunch theorems, low generalization error on $N$ samples is impossible without an inductive bias $\mathcal{B}$ that restricts $H$ or weights the prior $P(h)$.

  6. **Bias Specificity:** General biases (e.g., minimum description length, smoothness) are insufficient to prune the version space to $h^*$. The bias must encode constraints specific to the linguistic data generating process (e.g., structure dependence).

  7. **Architecture vs. Weights:** This bias $\mathcal{B}$ is not learned via gradient descent on $D$ (the inner loop). It is fixed in the model architecture, initialization, or pre-training objective (the outer loop setup) prior to exposure to $D$.

  8. **Sample Complexity Violation:** For any learner lacking $\mathcal{B}$, the sample complexity $N(\epsilon, \delta)$ required to converge to $h^*$ exceeds the actual $N$ available during the critical learning period. Therefore, $\mathcal{B}$ must be supplied exogenously.

  The split you proposed carves at the joint. The weak version ("priors are informative") is a tautology of Bayesian learning; every learner has a prior, so this proves nothing about innateness. The strong version ("sample complexity exceeds available data without domain-specific constraints") is the only form that supports the conclusion of domain-specific nativism. However, the translation exposes a vulnerability: the argument relies on bounding the sample complexity of *any possible learner* without the specific bias. Modern ML shows that architecture search or meta-learning can acquire biases from a broader distribution (evolutionary time or self-supervised pretraining) that isn't visible in $D$. The POS argument often conflates "not learned from child's data $D$" with "not learned from any data."

  Regarding smuggling: I translated "innate" as "fixed in architecture/outer loop." This imports an ML assumption that learning must be optimization-based. The original argument allows for maturation or triggering, which doesn't map cleanly to gradient descent. Regarding the untranslatable: "Innateness" carries a biological causal history (evolution) that "Prior" lacks. A prior is ahistorical; an innate trait is a historical claim about where the parameters came from. The residue suggests the original argument is sometimes vaguer than it sounds, relying on the intuitive weight of "innate" while doing the work of "sample complexity bound."

