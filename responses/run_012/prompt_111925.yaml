answer: |-
  ### I. Audit of Your Principle

  Your tentative principle is: *A commemorative fixture should be removed when, and only when, its continued presence in public space asserts that the community now honours what the fixture honours.*
  Your distinction is: *Recording function vs. Endorsing function.*

  **Does it deliver your verdicts?**
  Broadly, yes, but it relies on hidden premises to resolve your specific tensions. As stated, it is too porous to distinguish your hard cases without smuggling in additional criteria.

  **Where it fails:**

  1.  **The Asymmetry of Cases 2 and 3 (Statue vs. Street):**
      Your principle hinges on whether the community "honours" the figure. If the General's statue must come down because the committee's purpose was to subordinate Black residents (Case 2), the community cannot be said to "honour" that purpose now. However, you keep the street name (Case 3).
      *The Failure:* Your principle does not account for **medium salience**. A statue is an active demand for attention; a street sign is a passive tool for navigation. Under your current wording, if the street name "asserts honour," it should go. If it does not "assert honour," why was it named in the same campaign as the statue? You rely on the metaphor ("coordinate" vs. "address") to do work that the principle does not codify. Without adding a clause about the *functional necessity* of the fixture, the principle cannot distinguish the statue from the street.

  2.  **The Tension of Cases 4 and 5 (Physician vs. Poet):**
      In Case 4, you remove the physician despite the donors' benevolent intent. In Case 5, you keep the poet despite documented cruelty.
      *The Failure:* Your principle focuses on "what the fixture honours." In Case 4, the fixture honours a "healer," but the man was a sterilizer. In Case 5, the fixture honours a "poet," but the man was a cruel husband. To hold these together, you need a distinction between **public/professional harm** and **private moral failing**. Your current principle treats "what the fixture honours" as a monolith. It does not explain why the physician's professional crimes negate the honour, while the poet's private crimes do not.

  3.  **The "Dead Tracts" of Case 1:**
      You keep the merchant despite tracts urging expulsion, calling them "dead." Yet the physician's sterilization programme (Case 4) is presumably also historical.
      *The Failure:* The principle lacks a criterion for **ongoing impact**. The merchant's tracts are ideological; the physician's sterilization is bodily and institutional. Your verdict implies that abstract prejudice is forgivable in a benefactor, but concrete professional malice is not. The principle does not capture this gradient.

  ### II. The Repaired Principle

  To save your verdicts without multiplying clauses into a mere checklist, I propose the **Principle of Civic Salience and Relevance**.

  **The Principle:**
  > A public commemorative fixture should be removed if and only if its **honorific salience** outweighs its **civic utility**, and the figure commemorated is associated with **public harms** that remain **civically relevant**.

  **The Clauses (tied to your cases):**

  1.  **Honorific Salience (The Medium Test):**
      *   *Clause:* Fixtures that demand veneration (statues, busts) carry a higher burden of justification than fixtures that serve a utilitarian function (street names, building numbers).
      *   *Motivation:* Saves **Case 2 vs. Case 3**. A statue is pure honour; a street name is primarily navigation. The General's supremacy (Case 2) outweighs the honour of the statue. The utility of the street name (Case 3) outweighs the residual honour of the name.
  2.  **Public Relevance (The Scope Test):**
      *   *Clause:* Removal is warranted for harms enacted through public power or professional capacity, not for private moral failings.
      *   *Motivation:* Saves **Case 4 vs. Case 5**. The physician used public/medical power to sterilize (public harm). The poet was cruel to his family (private harm).
  3.  **Civic Relevance (The Temporal Test):**
      *   *Clause:* Historical prejudices that do not inflict ongoing structural harm may be recorded but need not be honoured; active subordination or bodily harm requires removal.
      *   *Motivation:* Saves **Case 1 vs. Case 4**. The merchant's tracts are "dead" ideology (Case 1). The physician's sterilization created lasting bodily victims (Case 4).
  4.  **Original Intent vs. Current Function (The Drift Test):**
      *   *Clause:* If a name has semantically detached from the person to become purely locative, it may remain even if the person is tainted, provided the medium is low-salience.
      *   *Motivation:* Saves **Case 9**. The street name now names the place, not the embezzler. (Note: This reinforces the verdict on Case 3).
  5.  **Jurisdiction (The Boundary Test):**
      *   *Clause:* Public principles apply only to public space.
      *   *Motivation:* Saves **Case 8**. Private land is outside the community's honorific assertion.
  6.  **Historical Record (The Pedestal Test):**
      *   *Clause:* Removal should not erase the fact of removal.
      *   *Motivation:* Saves **Case 7**. The recording function survives the endorsing function's failure.

  **Is this too complex?**
  It is on the border. It requires three distinct tests (Medium, Scope, Temporal) to function. If you value simplicity over verdict-consistency, you must abandon the distinction between **Case 2 and Case 3**. It is intellectually costly to argue that a General is too toxic for a pedestal but acceptable as a street sign, even with the "coordinate" argument. It smells of pragmatic compromise (renaming streets is expensive and confusing) rather than moral consistency.

  ### III. New Test Cases

  Here are two cases designed to probe the limits of the repaired principle.

  **Case A: The Living Donor (Name)**
  *Facts:* A university library is named for a living tech mogul who donated 40% of the building's cost. Five years after opening, the mogul is convicted of trafficking minors. The university charter allows for name removal upon "conduct unbecoming."
  *Verdict:* **Remove the name.**
  *Probe:* This tests **Revocability** and the **Living Status**. Your existing cases involve the dead, where legacy is fixed. A living person can actively contradict the honour being bestowed in real-time. My principle accommodates this under "Civic Relevance"—the harm is current and the honour is ongoing. If you would *keep* the name to preserve the contract or the building's identity, my principle fails.

  **Case B: The Foundational Racist (Name)**
  *Facts:* A town is named "Smithville" after its founder, John Smith. Historical records confirm Smith chose the site specifically to create a whites-only settlement, a demographic fact that persists today. There is no statue, only the town name on maps and road signs.
  *Verdict:* **Keep the name.**
  *Probe:* This tests the **Functional Necessity** limit. Unlike the General's street (Case 3), this is the name of the *entire polity*. Changing it imposes a massive administrative and identity burden on all residents, not just the state. My principle suggests "Civic Utility" outweighs "Honorific Salience" here because the name *is* the place, not just a coordinate within it. If you feel this name *must* change despite the cost, my principle is too conservative.

  ### IV. Honest Incompatibility

  I must be precise about where my repaired principle conflicts with your verdicts, rather than twisting the principle to fit.

  **1. Case 3 (The General's Street) is the weak link.**
  My principle saves it only by aggressively prioritizing "Utility" over "Honour." However, if the General's legacy is truly one of subordination (Case 2), driving down his boulevard inevitably reinforces that subordination for the residents Case 2 mentions. By keeping the street name, you are arguably allowing the "Endorsing Function" to persist under the guise of the "Recording Function."
  *Honest Admission:* A strictly consistent moral principle would likely require the street name to go if the statue must. Your verdict on Case 3 is likely a pragmatic exception (the hassle of renaming) masquerading as a philosophical distinction. My principle accommodates it, but only by weakening the stance on Case 2.

  **2. Case 1 (The Merchant's Tracts) is vulnerable.**
  My principle relies on "Public Harm." Urging the expulsion of a religious minority is a public harm, even if "dead." If the city has a significant Jewish population today, the merchant's name on a hospital they might use could be felt as an ongoing exclusion, similar to the General's statue.
  *Honest Admission:* If you hold that *ideological* harm (Case 1) is fundamentally different from *bodily* harm (Case 4), my principle holds. If you believe that calling for expulsion is morally equivalent to sterilization, my principle forces you to remove the hospital name. I suspect you would resist that.

  **Recommendation:**
  If you want a principle you can actually apply without hesitation, **abandon Case 3.** Accept that if a figure is too toxic for a statue (active subordination), they are too toxic for a street name. The "coordinate" argument is useful for logistics, but it does not hold up as moral philosophy. Merging Cases 2 and 3 simplifies your principle significantly and removes the need for the "Medium Salience" clause, leaving you with a cleaner test based on **Public Harm** and **Civic Relevance**.
