answer: |-
  Begin the section by writing the word function on the board and asking the students to define it in a biological context. You should expect them to offer definitions that conflate function with purpose, design, or immediate utility, such as saying a trait's function is what it is for or what it currently does to help the organism survive. You must head off the misconception that function implies a designer or a forward-looking plan immediately during this brainstorming phase. Tell them that in evolutionary biology, function is not about intent or future goals but is a technical term used to describe the relationship between a trait and the organism's history or current capacity. Make it clear that you are not asking about human artifacts like clocks or cars, where design is explicit, but about natural traits where appearance of design is a result of blind selection. This sets the stage for the two competing accounts without naming them yet. You should spend the first ten minutes on this conceptual grounding because if they believe function requires a planner, neither account will make sense to them.

  Once you have disrupted the idea of intelligent design, introduce the first case of the island bird whose wings were shaped by selection for flight but are now too small to lift it and are grown at a real cost. Ask the students whether these wings have a function. Many will say no because the wings do not currently enable flight and are costly, which reveals the misconception that function is identical to current utility. You must stop this line of reasoning here to introduce the etiological account. Explain that on this view, function is determined by the history of selection, so the wings have the function of flight because that is what they were selected for in the ancestors, even if they no longer perform that task. This case is chosen specifically because it isolates evolutionary history from current utility. A case like this must have a clear historical selection pressure that differs from the current outcome, and it must not have any confounding current benefits that could muddy the waters. You are using this case to show that function can exist without current utility.

  After establishing the etiological intuition with the bird, move to the second case of the beetle with a ridge on its thorax that is a developmental byproduct of a muscle attachment and was never selected for anything, but in the new wetter habitat diverts rainwater and improves survival. Ask the students whether this ridge has a function. Many will say yes because it measurably improves survival, which reinforces the misconception that function is whatever the trait currently does. You must head this off by introducing the causal-role account. Explain that on this view, function is determined by the current contribution to the system's capacity, so the ridge has the function of water diversion because that is what it currently does, even if it was not selected for that purpose. This case must have a clear current benefit that lacks a corresponding history of selection for that benefit. It must not have any hidden historical selection for the trait, or the distinction collapses. You are using this case to show that function can exist without evolutionary history.

  You should explain to yourself why you are using these two cases rather than the classic example of the heart. The heart is a convergent case where both accounts agree that the function is pumping blood because it was selected for pumping and currently pumps. Using the heart would hide the distinction you are trying to teach because the students would not see where the theories diverge. These two cases must pull in opposite directions to do the work. The bird case has history without utility, and the beetle case has utility without history. This cross-cutting design forces the students to see that the two accounts define function using different criteria. If both cases pointed in the same direction, such as both having history and utility, the students would not understand that there is a philosophical disagreement to be had. The pair of cases together carries the whole section because neither case alone can demonstrate the conflict between the accounts.

  As you synthesize the two cases around the fifty-minute mark, you must explicitly refuse to cover certain topics to keep the section within seventy-five minutes and appropriate for their level. Do not attempt to resolve which account is correct or true, as that is a metaphysical debate beyond the scope of an introductory biology section. Do not discuss the specific genetic mechanisms underlying the beetle's ridge or the bird's wing reduction, as molecular details distract from the conceptual distinction. Do not introduce other philosophical theories of function, such as goal-contribution accounts, as this will confuse students who have no philosophy background. Your goal is to show them that biologists use these terms in different ways, not to train them as philosophers of biology. Make it clear that they need to understand the difference so they can read literature that might use either definition, not to decide which one to believe.

  In the final ten minutes, you need to assess whether the distinction has landed using a single question that forces them to apply the criteria they just learned. Ask them to imagine a new trait, such as a human appendix, and tell you what an etiological theorist would say is its function versus what a causal-role theorist would say, given that the appendix was selected for digestion in ancestors but currently plays a role in immune system maintenance. This question works because it requires them to separate history from current utility in a new context. If they answer that both say the function is immune maintenance, they have failed to grasp the etiological account. If they answer that both say the function is digestion, they have failed to grasp the causal-role account. They must be able to articulate that the etiological view looks backward to the selection pressure while the causal-role view looks downward to the current systemic contribution. This closing question distinguishes between students who have memorized the definitions and students who can apply the distinction to novel cases.

  Throughout the section, you must remain vigilant about the language you use. Avoid using the word purpose unless you are quoting a student misconception, and avoid implying that natural selection has a plan. When discussing the beetle, emphasize that the benefit is accidental relative to the origin of the trait, which counters the idea that function presupposes a designer. When discussing the bird, emphasize that the cost does not negate the historical function, which counters the idea that function requires current advantage. By placing these corrections exactly where the intuitions arise, you prevent the misconceptions from solidifying. The sequence depends on this order because you need the bird case to break the intuition that function requires current utility before you can introduce the beetle case to show that current utility can exist without function in the etiological sense. If you reversed the order, students might cling to the idea that current utility is all that matters and dismiss the historical account as irrelevant. The bird case creates the puzzle, and the beetle case complicates it enough to require two distinct definitions.

  You should wrap up by reminding them that in their future biology courses, they might encounter both uses of function. When a paper says a trait has a function, they should look for context clues to see if the author means it was selected for that trait or if it currently contributes to survival. This practical takeaway justifies the philosophical distinction in terms they care about, which is reading and doing science. Do not leave them with the impression that this is merely abstract navel-gazing. The distinction matters for how they interpret evolutionary explanations. If they understand that a trait can be functional in one sense and not the other, they will be better equipped to understand debates about vestigial structures versus exaptations. This connects the philosophical distinction back to the biological content they already know, such as vestigial organs, which aligns with the bird case, and exaptations, which aligns with the beetle case. By anchoring the philosophy in familiar biological concepts, you ensure the lesson sticks without requiring them to learn new biological facts.

  Finally, ensure you manage the time strictly so that you reach the closing question. If the discussion on the bird case runs long, truncate the synthesis but do not cut the closing question. The assessment is the only way you will know if the seventy-five minutes were well spent. If students struggle with the closing question, briefly reiterate that one account asks about the past and the other asks about the present, but do not reopen the debate on which is better. End the section on the clear note that biology uses multiple tools to explain traits, and understanding which tool is being used is part of being a scientifically literate biologist. This empowers them to navigate their major without getting bogged down in semantic disputes, which is the ultimate goal of a teaching assistant in this context.
