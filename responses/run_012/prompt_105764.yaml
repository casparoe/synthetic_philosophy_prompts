answer: |-
  Thank you for coming. We are gathered here to do something that Mara Ellison would have asked us to examine very carefully before attempting. We are here to tell the story of a life. We are here to take the eighty-three years she occupied, the thousands of days, the millions of moments, and we are going to arrange them into a speech that lasts twenty minutes. We are going to select some things and leave others out. We are going to put some events before others to make sense of them.

  In doing so, we are risking the very errors she spent forty years identifying in the work of others. She taught us that when we look back, we tend to see a path where there was only terrain. We tend to see a destination where there was only walking.

  Mara had names for these errors. Some of you know them well. Others are meeting them for the first time today, perhaps through the lens of a grandmother who talked about history at the dinner table but never explained the theory behind it. She called the first error "the Funnel." This is the collapse of an open, branching situation into the single line that was actually walked. It is the assumption that because thing B followed thing A, thing A must have been waiting for thing B all along. She called the second error "the Borrowed Lantern." This is the light we lend past actors so they can see what was coming. It is the habit of praising people for foresight they did not have, or blaming them for ignoring warnings they could not have heard.

  And she kept one standing rule, which she applied to other people's lives and, in the last years, pointedly to her own: Never say what an event had to lead to.

  So, I stand here with a constraint. If I tell you that her childhood made her a historian, I lie. If I tell you that the loss of her first husband turned her toward the archive, I lie. If I tell you that everything she wrote was leading to the book she never finished, I lie. And yet, I also know that half of this room is her family, and you are in pain. You are looking for meaning. You are looking for a shape to this loss that makes it bearable. The other half of this room is her colleagues, and you are looking for integrity. You are listening to see if I will betray her thought to make her death easier to swallow.

  The tension between those demands is the task. I am not going to dissolve it. I am not going to solve it. I am going to live inside it, as she taught us to live inside the evidence.

  Let us look at a moment. It is 1962. Mara is twenty-one years old. She is sitting in a cafeteria in Chicago. She has an acceptance letter to a law program in her bag. She has also has a syllabus for a history seminar in her pocket. She spends an hour there. She drinks a coffee. She watches the rain on the window. She chooses the history seminar.

  If I tell you she chose it because she was destined to be a historian, I am using the Borrowed Lantern. I am giving her a light she didn't have. She didn't know she would be here, at eighty-three, surrounded by this love. She didn't know she would change how we understand the nineteenth century. She chose the seminar because the rain looked interesting, or because the law school felt cold, or for a reason she forgot by Tuesday. It was a branching path. She walked one. The other one closed. But for a long time, both were open. To say she was "meant" to be here is to close the door she left open. It is to shrink her freedom.

  Let us look at another moment. 1978. Her husband, David, dies. He is thirty-nine. She is thirty-seven. There are two sons, young.

  There is a story that is often told about widows in academia. It is a story of sublimation. It says that grief drove her into the work. It says the archive became a sanctuary because the world was too painful. That is a comforting story. It makes the pain useful. It makes the loss a ingredient in the success.

  Mara would forbid me to tell you that.

  The truth is simpler and harder. David died. She grieved. She graded papers. She picked up her sons from school. Sometimes she cried in the stacks. Sometimes she laughed at a faculty meeting. The work continued not because the grief fueled it, but because the work was there, and she was there, and they occupied the same time. To say the tragedy *made* the historian is to use the Funnel. It collapses the messy, unmanageable reality of widowhood into a plot point that explains her bibliography. It suggests her books are a monument to him. They are not. They are monuments to her curiosity. Her love for David was not a step toward her career. It was a separate thing. It stands alone. It matters enough without having to justify her publications.

  I know this is difficult to hear. We want the pain to mean something. We want the loss to have produced something good. But Mara's rule was strict. Never say what an event had to lead to. Her grief did not *have* to lead to the books. It just led to the next day. And the next.

  Now, I need to speak to the grandchildren. I know some of you are here who are nine, or twelve, or nineteen. You knew her not as a historian, but as a person who asked questions. Maybe she asked you what you learned in school. Maybe she asked you what you saw on the walk to the bus.

  She did not ask those questions because she was preparing you for a future. She did not look at you and see the adults you would become. She looked at you and saw who you were then.

  I remember watching her with the youngest, five years ago. You were learning to ride a bike. She was holding the seat. You were wobbly. She was not thinking about you winning races. She was not thinking about you growing up. She was thinking about keeping the bike upright in that specific second. When you fell, she did not say "you will get stronger." She said, "that hurt." She validated the moment.

  That is how she loved. She did not love you for what you would do. She loved you for what was happening. When she is gone, you will feel a hole. People will tell you that she lives on in you. They will say you carry her legacy. That is a kind of Borrowed Lantern. It suggests she planned to live through you. She didn't. She lived through herself. She is not in your future. She is in your past. The comfort is not that she continues, but that she *was*. The time you spent with her was not a down payment on a memory. It was the thing itself. It was real then. It is real now. The fact that it stops does not make it less true.

  To the colleagues in the room: You know the unfinished manuscript. You know the boxes of notes in her office. There is a temptation to say that the book was the culmination of her thought. To say that her life was leading to this argument.

  It was not.

  She was working on it because she was interested in it on Tuesday. She might have changed her mind on Wednesday. The work stops mid-sentence not because it is a metaphor for mortality, but because she died. There is no meaning in the interruption other than the biological fact of it. To treat the unfinished book as a deliberate statement on the limits of knowledge is to lend her a foresight she did not have. She didn't leave it unfinished to teach us a lesson. She left it unfinished because she ran out of time. We must resist the urge to curate the fragments into a coherent whole. We must let them remain fragments.

  This brings me to the difficulty of today. We are holding a service. A service is a narrative. It has a beginning, a middle, and an end. It is designed to move us from grief to acceptance. It is a Funnel.

  I cannot give you that. I cannot promise you that we will leave here feeling resolved. I cannot promise you that Mara's life adds up to a lesson we can take home. Her life was not a lesson. It was a life.

  But I know you are hurting. The family is hurting. The students are hurting. How do we comfort without lying?

  We comfort by refusing to minimize what was lost. If I tell you "she is in a better place," I minimize the loss of her presence here. If I tell you "everything happens for a reason," I minimize the randomness of the illness that took her. Mara taught us that the past is contingent. It could have been otherwise. She could have lived longer. She could have finished the book. She could have seen the grandchildren graduate. The fact that she did not is not fate. It is chance.

  Acknowledging that chance is not cold. It is honest. And there is comfort in honesty. The comfort is that you do not have to find the meaning. You do not have to justify her death by finding a purpose for it. You do not have to turn her life into a story where the ending makes sense of the beginning. You are allowed to simply miss her. You are allowed to feel the weight of the door closing without pretending it was always going to close.

  For the historians here, the task is to continue the work without distorting the worker. Cite her. Argue with her. But do not sanctify her. Do not turn her into a statue. Statues do not change their minds. Mara changed hers often.

  For the family, the task is to remember without reconstructing. When you talk about her, talk about the specific things. The way she held a teacup. The way she laughed when she was tired. Do not worry about what these things say about her character. They don't have to say anything. They just have to be true.

  I want to return to the vocabulary she gave us. The Funnel and the Borrowed Lantern.

  Death is the ultimate Funnel. It takes all the possible futures a person had—the trips they might have taken, the arguments they might have had, the books they might have written—and collapses them into the single fact of their absence. It is powerful. It is irresistible.

  We cannot stop it. We cannot bring her back. We cannot reopen the branches that are closed.

  But we can refuse the Borrowed Lantern. We can refuse to say she saw this coming. We can refuse to say she prepared us for this. We can refuse to say her life was a preparation for her death.

  She was not preparing to die. She was preparing for Tuesday. She was preparing for class. She was preparing for dinner.

  When she died, she was in the middle of things. She was in the middle of a sentence. She was in the middle of a life.

  That is where I must leave this. I cannot offer you a conclusion. A conclusion would imply that we have processed this, that we have filed it away, that we have understood it. We have not.

  There are boxes in her office that are not labeled. There are emails in her inbox that are unread. There are birthdays that will come and not be answered. There is a space at the table that will remain empty.

  We are standing in the open field she described. The path behind us is visible, but only because we walked it. The path ahead is gone.

  We do not know what comes next. We do not know how this changes us. We do not know what her work will mean in ten years, or what her absence will feel like in ten years.

  We know only that she was here. That she chose the history seminar in the rain. That she held the bike seat. That she argued against the easy story.

  And now she is not.

  We will carry that. Not as a lesson. Not as a legacy. Just as a fact.

  Thank you.

