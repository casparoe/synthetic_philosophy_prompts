answer: |-
  **The Scenario**

  In a remote Himalayan village, scattered wild walnut trees grow on steep, family-adjacent slopes, providing essential winter calories. Left to raw self-interest, each household would naturally guard and prune the trees nearest their homestead to secure a private winter stock, harvesting only mature nuts to ensure regrowth, effectively creating a sustainable system of *de facto* property rights. However, the village is bound by the "Right of Need," a sacred egalitarian norm holding that no food may be hoarded while a neighbor is hungry; any villager may harvest from any tree without permission, and guarding a tree is socially punished as greed. Because the norm forbids exclusion, households stop investing in long-term tree health and instead strip unripe nuts early to beat neighbors to the punch, knowing that any nuts left behind will be taken by others entitled by the "Right of Need," leading to the systematic degradation of the grove despite everyone knowing exactly what is happening.

  ***

  **The Walkthrough**

  **1. The Two Stories**
  *   **The Self-Interest Story (Conservation):** This narrative relies on the **Asset Motive**. If users are rational, long-term residents with no outside authority, they recognize that the walnut trees are capital assets. If exclusion is physically possible (the trees are scattered and near homes), a selfish actor realizes that guarding the tree yields a higher lifetime return than stripping it. They internalize the future value of the resource because they expect to capture that future value. The prediction is conservation through the endogenous emergence of *de facto* private property.
  *   **The Norms Story (Depletion):** This narrative relies on **Social Enforcement of Open Access**. The "Right of Need" is a virtuous insurance mechanism designed to prevent starvation among the vulnerable (the "good" aspect). However, by morally prohibiting exclusion, it transforms a resource that *could* be managed privately into a true common-pool resource. The norm imposes a social cost on conservation (being shamed as a hoarder) and a social benefit on extraction (fulfilling the norm). Rational actors follow the norm to maintain social standing, but the aggregate result is the Tragedy of the Commons: no one maintains the trees, and harvest rates exceed regeneration.

  **2. The Single Feature Doing the Work**
  The divergent predictions hinge entirely on **Excludability**.
  Physically, the resource is excludable (trees are distinct and near homes). Economically, under the self-interest story, this physical feature allows users to capture the benefits of restraint. Socially, under the norms story, the "Right of Need" artificially raises the cost of exclusion to infinity (social ostracism), nullifying the physical feature. The clash is between *physical possibility* (self-interest) and *social permission* (norms).

  **3. Deleting the Feature**
  If you delete **Excludability** (e.g., the walnuts grow in a dense, unguardable thicket far from homes), the two predictions converge.
  *   **Self-Interest:** Without the ability to exclude, the asset motive vanishes. A selfish actor cannot secure the future value, so they strip the resource now. Prediction: Depletion.
  *   **Norms:** The norm still forbids exclusion, but since exclusion was physically impossible anyway, the norm changes nothing. Prediction: Depletion.
  In this modified case, the standard Hardin/Ostrom consensus returns: both stories predict failure without external intervention or complex collective monitoring.

  **4. The Self-Interest Pushback**
  A proponent of the self-interest story will argue: *"The norm isn't magic; it's just a disguised payoff. Villagers follow the 'Right of Need' because the long-term benefit of social insurance (not being ostracized when *they* are hungry) outweighs the short-term loss of walnuts. Therefore, they are still maximizing utility, and the two accounts haven't truly diverged."*

  **5. Does the Move Work?**
  **No, it does not work.**
  While it is true that following a norm can be utility-maximizing (avoiding shame is a "cost"), this pushback fails to account for the **Pareto Inferiority** of the outcome.
  *   In the **Self-Interest/Property** scenario, the village has *both* walnuts *and* security (via trade or reciprocal agreements that don't require open access).
  *   In the **Norms** scenario, the village loses the walnuts.
  If the norm were merely a rational insurance contract, the villagers would renegotiate it once they realized the capital stock was collapsing (i.e., "We are all starving because the trees are dead"). The fact that they maintain the norm *despite* knowing it is destroying the very resource the norm is meant to distribute proves that the norm operates on a logic (moral obligation) that overrides the material payoff structure. The self-interest story cannot explain why rational actors would adhere to a rule that guarantees their own long-term material ruin when a feasible alternative (private stewardship) exists. The divergence is real.
