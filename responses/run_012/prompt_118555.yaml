      *   *Section 2: Digital Systems.* Connect to the "Mind-Stuff" critique and the "Stream of Thought." Function isn't enough; qualitative unity is needed. He'd be a skeptic but not a dogmatic dualist.
      *   *Section 3: The Grain View Absurdity.* Connect to Pragmatism. If it makes no difference to conduct, it's idle. The "absurdity" is a pragmatic reductio ad absurdum.
      *   *Section 4: Pragmatism vs. Ontology.* This is the crux. Can he dismiss the grain ethically without losing his metaphysics? He distinguishes the *knowledge of* experience from the *being of* experience. He can say the grain is real but ethically inert *for us*.
