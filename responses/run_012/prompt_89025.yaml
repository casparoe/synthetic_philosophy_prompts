  *   **CDT:** Passes Smoking Lesion (causal control) but fails Newcomb/Twin PD (ignores logical correlation). It leaves money on the table when predictors exist.
  *   **EDT:** Passes Newcomb (evidential gain) but fails Smoking Lesion (confuses correlation with cause). It acts superstitiously to manage news rather than outcomes.
  *   **UDT:** Passes Newcomb/Mugging/Twin PD (algorithmic consistency) but violates intuitive Bayesian updating on observed evidence. It wins more but feels counterintuitive to standard probability theory.
