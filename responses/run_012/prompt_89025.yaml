  To count as adequate, a decision theory spec must satisfy five constraints derived from canonical failure modes. Each requirement acts as a unit test; failing any single case indicates a fundamental flaw in how the theory models agency, correlation, or time.

  1. **Causal Integrity (Smoking Lesion):** You must smoke. The lesion causes cancer and the urge, but smoking itself is harmless. A theory must maximize based on what you *control*, not what merely correlates with your biology. This is required to avoid "managing the news." If you refuse to smoke to avoid cancer evidence, you lose the pleasure of smoking without changing health outcomes. The case forces the distinction between causal leverage and evidential correlation, ensuring the agent doesn't act superstitiously or sacrifice utility for mere signaling.
  2. **Predictive Alignment (Newcomb's Problem):** You must one-box. Omega predicts your algorithm; two-boxing proves you were predicted to two-box, leaving $1M behind. A theory must treat your decision logic as the input to the predictor, not just your physical act. This is required to capture value from environments containing accurate predictors. Ignoring this fails to harvest gains from trade, rendering the agent money-pumped by Omega despite having perfect information about the setup.
  3. **Logical Correlation (Twin Prisoner's Dilemma):** You must cooperate. Your twin runs identical code. Defecting implies they defect. A theory must recognize logical dependence between identical agents, distinct from causal influence. This is required to secure cooperative surplus in symmetrical setups. Standard causal models miss this because no signal passes between twins; only logical necessity links them. Failing this loses value in multi-agent scenarios where code is shared.
  4. **Temporal Stability (Counterfactual Mugging):** You must pay even if the coin is tails. You would have precommitted to pay if heads. A theory must output the same decision regardless of when you evaluate it (before or after updating). This is required to prevent dynamic inconsistency. Violating this makes you exploitable; you refuse trades your prior self would demand, limiting your ability to bind yourself to profitable policies across time and counterfactual branches. This ensures the agent is not money-pumped by sequences of decisions where early commitments are abandoned later.
  5. **Physical Causality (General):** Must distinguish choosing from predicting. You cannot causally affect the past (box filling), but your choice evidences it. The theory must navigate this without implying magical backward causation. This is required to maintain a coherent model of physics. The case forces the theory to separate logical implication from causal propagation, ensuring no violation of light cones while acknowledging logical links. This prevents the theory from requiring physically impossible interventions on past states.

  Collectively, these requirements demand an agent that acts causally locally but reasons logically globally, maintaining policy consistency without violating physical laws.

  - "Where it breaks" — the pairs that can't be jointly satisfied and why, ~150 words
  The critical incompatibility lies between **Temporal Stability** and **Evidence Responsiveness**. In Counterfactual Mugging, updating on "Coin=Tails" tells you paying is useless (you gain nothing, the heads-world is gone). But Temporal Stability demands you pay because you would have precommitted. You cannot satisfy the requirement to always act on current posterior beliefs *and* the requirement to always act as your prior self would mandate. One must be sacrificed: either you become time-inconsistent (CDT/EDT) or you ignore specific evidence (UDT). This tension suggests a fundamental limit: rationality cannot be defined solely by state-dependent maximization. To satisfy stability, the agent must treat its decision as a fixed function output, effectively blindfolding itself to certain observations to maintain bargaining power with counterfactual versions of itself. You must choose between being locally optimal now or globally optimal across counterfactuals.

  - "The requirement that does the most damage" — ~100 words
  **Temporal Stability** is the killer constraint. It demands your decision rule remains stable regardless of when you evaluate it. CDT fails this in Newcomb (two-boxing after boxes are filled). EDT fails this in Counterfactual Mugging (refusing to pay after seeing tails). This requirement forces the abandonment of standard Bayesian updating on your own action's context, pushing theorists toward updateless frameworks that treat decisions as outputs of a fixed algorithm rather than contingent events. It eliminates any theory that allows knowledge of your situation to change your optimal policy relative to your prior self.

