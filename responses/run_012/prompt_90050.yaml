answer: |-
  # Decision Tree: Mapping Social Construction

  **Starting Commitment:** You accept that money, race, and gender are socially constructed, but you are unsure what ontological status this grants them.

  ---

  ### Node 1: Constitutive Dependence
  **Concrete Case:** Consider a **$20 bill**.
  **Question:** If all human minds, practices, and institutions vanished tomorrow, would this object cease to be an instance of the kind (money), or would it retain its status independently of us?
  *   **It would cease to be money (Mind-Dependent):** The kind requires our attitudes to exist. *(Go to Node 2)*
  *   **It would retain its status (Mind-Independent):** The kind exists independently, even if our *access* to it is mediated by society. *(Go to Node 3)*

  ---

  ### Node 2: Ontological Robustness (Constitutive Path)
  **Concrete Case:** Consider a **bank run** where trust in currency collapses.
  **Question:** When collective acceptance fractures, does the kind cease to exist entirely (revealing it was merely a collective fiction), or does it persist as a real institutional fact that can be repaired?
  *   **It persists as a real institutional fact:** The kind is ontologically robust despite being mind-dependent. *(Leaf A)*
  *   **It ceases to exist/reveals itself as fiction:** The kind is an error or illusion sustained only by false belief. *(Leaf B)*

  ---

  ### Node 3: Locus of Construction (Causal Path)
  **Concrete Case:** Consider a **racial classification on a census form**.
  **Question:** Does society merely draw the *boundaries* around pre-existing biological traits (creating a concept), or do social practices causally produce the *physical/psychological traits* themselves (creating a kind)?
  *   **Society draws the boundaries:** The traits are real/natural, but the grouping is arbitrary or conceptual. *(Leaf C)*
  *   **Society produces the traits:** Social forces cause the members to physically or psychologically resemble one another. *(Go to Node 4)*

  ---

  ### Node 4: Feedback Loops
  **Concrete Case:** Consider the category **"woman" in a sports eligibility rule**.
  **Question:** Does classifying a person as a member of this kind alter their internal properties, self-understanding, or physiology (a looping effect), or is the kind indifferent to how we describe it?
  *   **The kind is indifferent:** Classification does not change the underlying nature of the members. *(Leaf D)*
  *   **Classification alters the members:** The act of classifying feeds back into the properties of the classified. *(Go to Node 5)*

  ---

  ### Node 5: Explanatory Power
  **Concrete Case:** Consider **health disparities** linked to a social category.
  **Question:** To explain the behavior or outcomes of the members, must we cite the history of how the kind was constructed, or can we ignore the construction story and treat the kind as a brute fact?
  *   **We must cite the construction history:** The construction story is essential to explanation. *(Leaf E)*
  *   **We can ignore the construction story:** The kind is real, but the construction story is explanatorily idle. *(Go to Node 6)*

  ---

  ### Node 6: Descriptive vs. Normative Aim
  **Concrete Case:** Consider **affirmative action policies** relying on the category.
  **Question:** Is the primary value of retaining this kind that it accurately describes reality, or that it serves a political/ethical goal (what the kind *ought* to be)?
  *   **It accurately describes reality:** The category is retained for descriptive metaphysical reasons. *(Leaf F)*
  *   **It serves a political/ethical goal:** The metaphysical status is secondary to what the category should become. *(Leaf G)*

  ---

  ### The Leaves (Positions)

  *   **Leaf A: Constitutive Constructionist Realism**
      *   The kind is mind-dependent but ontologically robust (e.g., institutional facts).
  *   **Leaf B: Eliminativism**
      *   The kind is a fiction or error; talk of it should be discarded.
  *   **Leaf C: Concept Constructionism**
      *   The world is real, but our conceptual grid for carving it is constructed.
  *   **Leaf D: Causal Naturalism**
      *   The kind is a natural kind whose distribution is causally influenced by society, but which is indifferent to classification.
  *   **Leaf E: Causal Constructionist Realism (Interactive)**
      *   The kind is causally real, and the process of classification loops back to shape the kind's members.
  *   **Leaf F: Explanatorily Idle Realism**
      *   The kind is real and constructed, but the construction story adds no explanatory power to current behavior.
  *   **Leaf G: Normative Constructionism**
      *   The metaphysical question is secondary; the focus is on reconstructing the kind for political justice.

  ---

  ### Analysis of the Tree

  #### 1. Indistinguishable Leaves
  **Leaf D (Causal Naturalism) and Leaf F (Explanatorily Idle Realism)** are difficult to separate in practice. Both views hold that the kind exists and that the construction story is not essential to explaining the current behavior of the members. The distinction rests on whether the kind is considered "natural" (Leaf D) or a reified social kind that has become stable enough to ignore its history (Leaf F). In empirical sociology, these often collapse into the same research program: treating the category as a fixed variable.

  #### 2. Unoccupied Combinations
  **Constitutive Eliminativism (Node 2, "Fiction" branch):** While logically possible, this combination is rarely occupied for the specific kinds in question (money, race, gender). If one believes money is constitutively dependent on belief, admitting it is a "fiction" usually leads to **Leaf B (Eliminativism)** regarding money specifically, but few argue race or gender are *constitutively* dependent yet *fictional* in the same way. Usually, if race is deemed fictional (Eliminativism), it is because it fails to be a *causal* natural kind (Node 3 path), not because it fails to be a constitutive institutional fact. This combination is **unattractive** for race and gender because it grants too much reality to the social agreement (constitutive) while denying its utility (eliminative), creating a pragmatic contradiction.

  **Non-Looping Interactive Kinds:** It is **incoherent** to answer "Yes" to Node 4 (Classification alters members) and then claim the kind is "Indifferent." However, a position where the kind loops but is treated as indifferent (Leaf F) is common.

  #### 3. Least Well-Handled Kinds per Leaf

  *   **Leaf A (Constitutive Realism):** Handles **Money** best. Handles **Gender** least well, as gender often involves biological traits that are not purely constitutive of institutional status.
  *   **Leaf B (Eliminativism):** Handles **Race** (as a biological kind) best. Handles **Money** least well, as eliminating the concept of money makes economic explanation impossible.
  *   **Leaf C (Concept Constructionism):** Handles **Race** (as a census category) best. Handles **Gender** least well, because gender often involves lived bodily experiences that exceed mere conceptual boundaries.
  *   **Leaf D (Causal Naturalism):** Handles **Sex** (biological) best. Handles **Race** least well, as there is little evidence for race as a natural kind indifferent to classification.
  *   **Leaf E (Causal Constructionist Realism - Interactive):** Handles **Gender** best. Handles **Money** least well, as a $20 bill does not change its physical properties based on being classified as currency.
  *   **Leaf F (Explanatorily Idle Realism):** Handles **Race** (as a reified social fact) best. Handles **Gender** least well, because ignoring the construction of gender often obscures the mechanism of oppression.
  *   **Leaf G (Normative Constructionism):** Handles **Gender** (in political contexts) best. Handles **Money** least well, as normative goals cannot easily override the constitutive rules of currency without causing economic collapse.
