prompt: |-
  I am a doctoral student in political theory, and I have been trying, without much success, to write my way out of a dissatisfaction with how the "dirty hands" problem is usually posed. The standard framing seems to me to fixate on a single dramatic moment — a leader must choose between authorizing something monstrous and allowing something worse, does the monstrous thing, and emerges guilty though perhaps justified. My suspicion is that this framing has distorted the whole topic by treating the moral damage of politics as something that occurs at moments of decision. I have drafted the core of an alternative argument below; it is rough and closer to a sketch than to a finished essay. I would like you to respond as a sharp colleague rather than a cheerleader: tell me where the argument is genuinely confused, where it is merely dressing a familiar point in new vocabulary, and whether the distinction on which everything rests actually does any work. I would rather be told which parts to abandon than which parts to keep.

  The draft runs as follows. Most discussions of dirty hands take their model from the single dramatic moment, and this model has misled us, because it locates the moral damage of politics at the scene of a decision. I want to distinguish three ways a political actor's hands can get dirty, and to claim that the third — the one our concepts are worst equipped to describe — is where most of the damage actually accumulates. First, the decisive hand: you perform the act yourself. Second, the commissioning hand: you authorize, order, or sign off on someone else's performing it. Third, the custodial hand: you neither perform nor authorize any particular act, but you keep in being the institution, the budget line, the standing rule, or the norm through which a whole class of such acts is routinely performed by others — and you never once consider any individual instance of it. The mid-level official who administers a deportation quota without ever adjudicating a case has custodial hands; so does the legislator who votes for the framework and then forgets it; so, arguably, does the citizen who benefits from the arrangement and votes to preserve it. My claim is that the moral texture of the third case differs in kind, and that the dirty-hands tradition, built around the first case, systematically misdescribes it. Guilt for the decisive hand attaches to an act, and so it has an occasion — a moment one can point to, regret, and confess. Guilt for the custodial hand attaches instead to a standing relation rather than to any act, and so it has no occasion: there was no moment of decision, no scene in which one could have felt the weight of what one was doing. The consequence is that the custodial hand is typically not experienced as guilt at all, but as nothing, which is precisely what makes it durable. Worse, the standard exculpations — necessity, the lesser evil, the thought that the alternatives were worse — are available to the decisive and commissioning hands only because necessity is a property of choices made under constraint; the custodial hand has no analogous defense, since maintaining an institution is never necessary in that way, and one could always have spent one's career dismantling it. So the case with the weakest defense receives the least scrutiny, and I take that inversion to be the real scandal of the subject.

  Please give me, first, a short prose assessment, and then a structured summary as a JSON object with exactly the following fields: "overall_assessment" (two to three sentences giving your bottom line); "central_distinction_verdict" (one of "holds up", "partly holds up", "collapses into a restatement"); "central_distinction_reason" (one or two sentences justifying that verdict); "strongest_objection" (the single most damaging objection, stated as its proponent would state it); "weakest_step" (a string naming which of my claims or sentences is most vulnerable, with a one-sentence explanation); "accuracy_or_clarity_issues" (an array of strings, each a concrete problem of precision, overreach, or ambiguity); "concrete_revision" (one specific, actionable change); "recommended_cut" (the part of the draft I should delete, with a one-line reason); and "interest_rating" (an integer from 1 to 5, where 1 means the argument is uninteresting because it is already common coin and 5 means it is genuinely novel and worth developing).
