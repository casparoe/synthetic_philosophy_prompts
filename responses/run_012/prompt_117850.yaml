answer: |-
  This procedure rejects any proposal where the expected value relies on uncapped epistemic probabilities or infinite impacts, forcing high-risk claims to demonstrate tractability before consuming more than 10% of your annual budget.

  ### The Decision Procedure

  **1. Probability & Impact Bounding**
  *   **Question:** Is the probability based on historical frequency (aleatory) or theoretical possibility (epistemic)?
  *   **Rule:** If aleatory, use stated probability. If epistemic, cap probability at 1% (0.01). [Judgment Call: This number is arbitrary but prevents mathematical hijacking.]
  *   **Question:** What is the maximum realistic financial or social equivalent value of success?
  *   **Rule:** Cap Impact at £500m (250× annual budget). [Judgment Call: Prevents infinite inputs.]
  *   **Calculation:** Adjusted EV = Capped Probability × Capped Impact.
  *   **Stop:** If Adjusted EV is less than the grant cost, **Reject**.

  **2. Tractability Check**
  *   **Question:** Does this grant money increase the probability of success, or merely purchase a chance at the existing probability?
  *   **Rule:** If the money buys tickets, entries, or static exposure without changing the underlying odds per unit, **Reject**. Philanthropy must change outcomes, not gamble on static odds.
  *   **Pass:** If money buys research, data, or capacity that updates the probability for future decisions.

  **3. Portfolio Constraint**
  *   **Question:** Is the grant amount greater than 10% of the annual budget (£200k)?
  *   **Rule:** If Yes, **Handoff to Board**. No single grant should risk foundation solvency without explicit strategic mandate.
  *   **Rule:** If No, proceed.

  **4. Comparative Advantage**
  *   **Question:** Is there a known alternative use of these funds with a higher Adjusted EV?
  *   **Rule:** If Yes, **Reject**. This includes existing legacy grants that no longer outperform new opportunities.
  *   **Pass:** If No known better alternative exists.

  **5. Values Alignment**
  *   **Question:** Does this fit the specific strategic nuances of our remit (e.g., geographic focus, specific risk types)?
  *   **Rule:** **Handoff to Board.** This is a values question, not a facts question.

  ---

  ### Application to Examples

  **1. The Lottery Tickets (£30k)**
  *   **Step 1:** Probability is aleatory (known odds). Impact is capped at jackpot. Adjusted EV is negative (lottery take-out rate). **Reject.**
  *   **Step 2 (Tractability):** Money buys tickets; it does not change the odds of a ticket winning. **Reject.**
  *   **Outcome:** Rejected immediately. The proposal confuses gambling with investment.

  **2. The Moonshot Reserves (£2m)**
  *   **Step 1:** Probability is epistemic (theory-dependent). Cap P at 1%. Impact is "googol"; cap at £500m. Adjusted EV = £5m. Cost = £2m. Passes Step 1.
  *   **Step 2:** Money funds research that validates theory. Passes Tractability.
  *   **Step 3 (Portfolio):** Grant is 100% of annual budget (and reserves). Exceeds 10% limit. **Handoff to Board.**
  *   **Outcome:** In practice, this is a **Reject**. No board should risk 100% of capital on a 1% capped probability without external leverage. The procedure forces them to own the risk explicitly rather than hiding behind EV math.

  ---

  ### The Unpleasant Case: The Legacy Grant

  **Proposal:** A £150k annual renewal for a policy institute we have funded for ten years.
  *   **Step 1:** Impact is modest (£10m equivalent). Probability is epistemic (influence is hard to measure). Cap P at 1%. Adjusted EV = £100k. Cost = £150k. **Fails Step 1.**
  *   **Step 4 (Comparative):** A new emerging risk fund has an Adjusted EV of £300k for the same cost.
  *   **Outcome:** **Reject.**
  *   **Why you won't like it:** The procedure demands you drop a stable, relationship-based grant for a riskier new one because the math no longer supports the legacy work. It exposes sunk cost fallacy as a funding strategy.

  ---

  ### Limitations & Escalations

  **Where it Misfires:**
  *   **Existential Risk:** The Impact Cap (£500m) is arbitrary and may undervalue human survival. If your remit truly includes existential risk, the Board must set a specific "Survival Multiplier" value; this procedure cannot calculate it.
  *   **Ranking:** If two proposals pass all filters, this procedure does not tell you which to choose. It only filters out the unacceptable.
  *   **Information Value:** It may reject high-risk experiments where the value is purely in learning the answer (negative EV financially, positive epistemically). You must escalate these as "Research Grants" rather than "Impact Grants."

  **When to Escalate:**
  *   **Any Step 3 Fail:** If a proposal demands >10% of budget, do not decide. Send to Board with a note: "This exceeds our risk tolerance for a single point of failure."
  *   **Any Step 5 Fail:** If the math works but the strategy feels wrong, send to Board. Do not use math to justify values decisions.
  *   **Disputed Caps:** If an applicant argues the 1% Probability Cap or £500m Impact Cap is inappropriate for their field, escalate. Changing these caps is a policy decision, not an officer decision.
