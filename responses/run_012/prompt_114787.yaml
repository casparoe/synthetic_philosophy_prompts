answer: |-
  ### I. Brainstorming the Distinct Claims

  To disassemble "X is a social construct," we must separate the dimensions along which the claim varies. When a speaker utters this sentence, they are rarely making a single atomic claim. They are usually bundling several of the following distinct propositions. We can categorize them by what is being constructed (the object, the concept, or the significance) and what "social" implies (belief, practice, or power).

  **1. Ontological Mind-Dependence**
  *   *Claim:* X would not exist if humans (or minded agents) did not exist.
  *   *Dimension:* Existence conditions.
  *   *Variation:* Does X require *any* minds, or specifically *our* minds? Does it require collective agreement (intentionality) or just individual recognition?

  **2. Causal Social Origin**
  *   *Claim:* X came into being through social interaction, history, or human activity, rather than emerging from physical laws or biological evolution alone.
  *   *Dimension:* Etiology.
  *   *Variation:* Is the social cause the *sole* cause, or did it shape a pre-existing biological substrate?

  **3. Conceptual/Classificatory Construction**
  *   *Claim:* The *boundary* of X is drawn by social convention, even if the stuff inside the boundary is natural. (e.g., "Mountain" vs. "Hill").
  *   *Dimension:* Semantics/Cognition.
  *   *Variation:* Is the carving of nature arbitrary, or does it track functional interests?

  **4. Maintenance Dependence**
  *   *Claim:* X requires ongoing social practice to persist. If we stop treating X as X, X ceases to function or exist.
  *   *Dimension:* Persistence conditions.
  *   *Variation:* Is this true of the object itself (money) or just our access to it (language)?

  **5. Contingency/Variability**
  *   *Claim:* X could have been otherwise. Different societies could have constructed different Xs, or no X at all.
  *   *Dimension:* Modality.
  *   *Variation:* Is it *easily* changeable, or is it "sticky" due to path dependence?

  **6. Normative Illegitimacy (The "Fake" Implication)**
  *   *Claim:* Because X is constructed, it lacks natural authority, justification, or reality. It is "merely" constructed.
  *   *Dimension:* Axiology/Metaphysics.
  *   *Variation:* Does this imply X is an illusion, or just that its authority is conventional rather than natural?

  **7. The "Social" Mechanism**
  *   *Claim:* What is doing the work?
      *   *Collective Belief:* We all agree X exists.
      *   *Institutional Rule:* A rule system defines X (e.g., "This counts as money").
      *   *Power Dynamics:* X is imposed by a dominant group to organize labor or status.
      *   *Discursive Practice:* X is produced through language and performance.

  **8. The Target of Construction**
  *   *Claim:* What exactly is constructed?
      *   *The Kind:* The category itself (e.g., "Currency").
      *   *The Property:* The trait attributed to members (e.g., "Value").
      *   *The Members:* The individuals classified (e.g., "Who counts as white").
      *   *The Significance:* The meaning attached to a natural difference (e.g., "Melanin levels matter for moral status").

  ---

  ### II. Grading the Readings

  Here we evaluate the truth value and dialectical status of the claims brainstormed above.

  **1. Ontological Mind-Dependence**
  *   *Verdict:* **Substantive and Defensible Thesis.**
  *   *Justification:* For many social kinds (money, marriage), existence literally depends on collective intentionality. For others (race), it is contested whether the kind exists independently of our classification practices.
  *   *Diagnosis:* This is often what experts mean, but laypeople hear "fake."

  **2. Causal Social Origin**
  *   *Verdict:* **Platitude (for social kinds).**
  *   *Justification:* Almost no one denies that social institutions have social histories. The controversy is whether there is a *non-social* core (e.g., biological sex underlying gender).
  *   *Diagnosis:* Rarely the point of contention, yet often argued as if it were a revelation.

  **3. Conceptual/Classificatory Construction**
  *   *Verdict:* **Platitude.**
  *   *Justification:* All language involves categorization. The boundaries of almost any macroscopic kind are somewhat conventional.
  *   *Diagnosis:* Trivially true, but often used to imply the *objects* classified are also arbitrary.

  **4. Maintenance Dependence**
  *   *Verdict:* **Substantive and Defensible Thesis.**
  *   *Justification:* Institutional facts collapse without uptake. However, some social kinds (like racialized hierarchies) become materially embedded (housing, wealth) and persist even if attitudes shift.
  *   *Diagnosis:* Users often overlook the "material inertia" of constructed things.

  **5. Contingency/Variability**
  *   *Verdict:* **Live Controversy.**
  *   *Justification:* While the *form* of a kind may vary, some argue functional constraints limit variability (e.g., all societies need some form of exchange, though not necessarily "money").
  *   *Diagnosis:* People assume "contingent" means "easily changeable," ignoring path dependence.

  **6. Normative Illegitimacy ("Fake")**
  *   *Verdict:* **False.**
  *   *Justification:* Mind-dependence does not entail non-existence or lack of causal power. Pain is mind-dependent but real; money is constructed but buys food.
  *   *Diagnosis:* **This is the most common error.** Users slide from "constructed" to "illusion" to "ignore it."

  **7. The "Social" Mechanism (Power vs. Agreement)**
  *   *Verdict:* **Live Controversy.**
  *   *Justification:* Some views emphasize cooperative agreement (game theory/institutions); others emphasize coercion and hierarchy (critical theory). Both capture different aspects of social reality.
  *   *Diagnosis:* Libertarians lean toward "agreement"; critical theorists lean toward "power." Both are partially right.

  **8. The Target (Kind vs. Significance)**
  *   *Verdict:* **Live Controversy.**
  *   *Justification:* In race/gender debates, the fight is often over whether the *biological substrate* is being constructed (false) or the *social significance* of that substrate (true).
  *   *Diagnosis:* **Major source of equivocation.** One side says "biology is real," the other says "significance is constructed," and they talk past each other.

  **Most Likely User Intent:**
  When a Less Wrong-adjacent user says "X is a social construct," they usually intend **Ontological Mind-Dependence** combined with **Normative Illegitimacy**. They want to say: "X exists only because we believe it, therefore we can stop believing it, and therefore current constraints regarding X are optional."
  **Where they are wrong:** They conflate *ontological subjectivity* (depends on minds) with *epistemic arbitrariness* (no constraints on change) and *axiological nullity* (no moral weight). They treat social facts like bugs in software rather than load-bearing walls in a building.

  ---

  ### III. The Three Fillers: Race, Gender, Money

  We run the slogan through the three specific domains. Note that "true" here means "accurately describes the metaphysics of the kind," not "supports the political conclusion usually drawn."

  #### 1. Money
  *   **True Readings:** Ontological Mind-Dependence (a dollar bill is paper without collective acceptance); Maintenance Dependence (hyperinflation shows what happens when belief collapses); Institutional Rule (status functions).
  *   **False Readings:** Normative Illegitimacy (money is "fake" so it doesn't matter); Unconstrained Changeability (see below).
  *   **Standard Argument:** "Money is constructed, therefore monetary policy is essentially unconstrained."
  *   **Analysis:**
      *   *Reading Needed:* Contingency/Variability + Normative Illegitimacy.
      *   *Validity:* **False.** While money is constructed, it is constrained by trust, scarcity, production capacity, and international relations. You cannot construct a currency that buys more goods than exist. The "construction" is of the *medium of exchange*, not the *underlying economic reality*.
      *   *Defended?* No serious economist defends the idea that construction implies a lack of physical constraints. This is a "magic thinking" misuse of the slogan.

  #### 2. Gender
  *   **True Readings:** Conceptual/Classificatory Construction (boundaries of "man/woman" vary); Significance Construction (what traits matter for the category); Normative Illegitimacy (of *prescriptive* roles, not necessarily descriptive categories).
  *   **False Readings:** Biological Nihilism (that sexed bodies play no causal role in the formation of the category); Ontological Mind-Dependence (if interpreted to mean gender identity is *only* external imposition, denying internal experience).
  *   **Standard Argument:** "Gender is a social construct, deployed to settle whether trans women are women."
  *   **Analysis:**
      *   *Reading Needed:* Conceptual/Classificatory Construction (the definition of "woman" is not fixed by biology).
      *   *Validity:* **Contested.**
          *   *Side A (Gender Critical/Essentialist):* Argues "woman" tracks biological reproductive potential. Construction claim is false regarding the *extension* of the term.
          *   *Side B (Social Constructionist/Identity):* Argues "woman" tracks social position or internal identity. Construction claim is true regarding the *criteria* of the term.
      *   *Defended?* Both sides defend their reading. The slogan itself doesn't settle it; it just shifts the debate to "What kind of kind is 'woman'?" If "woman" is a social class, construction holds. If "woman" is a biological subspecies, it fails. The slogan is used to *assert* Side B without arguing for the metaphysics of the category.

  #### 3. Race
  *   **True Readings:** Biological Essentialism is False (no deep genetic clusters correspond to folk racial categories); Significance Construction (social meaning attached to superficial traits); Causal Social Origin (racial categories created to justify hierarchy).
  *   **False Readings:* Ontological Nihilism (race is an illusion and has no causal power); Conceptual Arbitrariness (racial categories are random rather than historically path-dependent).
  *   **Standard Argument:** "Race is a social construct, therefore race-conscious policy is incoherent."
  *   **Analysis:**
      *   *Reading Needed:* Ontological Nihilism / Normative Illegitimacy.
      *   *Validity:* **False.** This is a non-sequitur. Even if race is biologically shallow, it is socially deep. If race is a social kind that causally affects life outcomes (via racism, wealth distribution, policing), then race-conscious policy is the *only* coherent way to address those outcomes.
      *   *Defended?* Only by those who believe only biological kinds warrant policy intervention. Most social ontologists argue that social kinds *are* real enough to warrant policy. The argument relies on the "Fake" implication of construction.

  ---

  ### IV. The Inference Chain

  Let us analyze the hidden syllogism: *Constructed $\to$ Arbitrary $\to$ Changeable $\to$ Illegitimate/Unworthy.*

  **Link 1: Constructed $\to$ Arbitrary**
  *   *Status:* **False as stated.**
  *   *Missing Premise:* "Social causes are unconstrained by function or history."
  *   *Correction:* Social constructs are often *path-dependent* and *functionally constrained*. Money is constructed, but you cannot construct a currency that functions without scarcity. Gender is constructed, but often tracks reproductive divisions of labor for functional reasons (even if those reasons are outdated).
  *   *The Skip:* People assume "made by humans" means "made without reasons."

  **Link 2: Arbitrary $\to$ Changeable**
  *   *Status:* **True in principle, False in practice (without qualification).**
  *   *Missing Premise:* "There is no friction or cost to changing social agreements."
  *   *Correction:* A rule can be arbitrary (we drive on the right, not the left) but highly resistant to change due to coordination costs. Social constructs develop "material inertia" (e.g., racial housing segregation becomes physical infrastructure, not just an idea).
  *   *The Skip:* The distinction between *metaphysical possibility* and *practical feasibility*.

  **Link 3: Changeable $\to$ Illegitimate/Unworthy of Respect**
  *   *Status:* **False (Naturalistic Fallacy).**
  *   *Missing Premise:* "Only natural/unchangeable things have normative authority."
  *   *Correction:* Laws are changeable and constructed, but we owe them respect to maintain order. Promises are constructed, but breaking them is illegitimate.
  *   *The Skip:* The move from *Is* (this is made up) to *Ought* (we should not respect this). This is the most dangerous skip, as it delegitimizes social contracts simply because they are contracts.

  **The Usually Skipped Link:**
  The jump from **Changeable** to **Illegitimate** is the most common rhetorical sleight of hand. However, in the "Less Wrong" context, the skip is often between **Constructed** and **Arbitrary**. The assumption is that if something isn't "physics," it's "preference." This ignores the reality of *intersubjective facts* which are objective relative to the system.

  ---

  ### V. The Core Question: Univocal or Equivocal?

  **Is there a single thesis true of all three?**
  **No.** The formula equivocates heavily. "Race is a social construct," "Gender is a social construct," and "Money is a social construct" are metaphysically distinct claims that share a family resemblance but not a core essence.

  **Where the Equivocation Lives:**
  The equivocation lives in the **Degree of Mind-Dependence** and the **Relationship to Biological Substrates.**

  1.  **Money (Institutional Fact):**
      *   *Metaphysics:* Strongly mind-dependent. Without collective intentionality, a dollar bill is physically identical to a piece of linen blend. The *object* itself has no function without the social layer.
      *   *Thesis:* "X exists *only* in virtue of collective acceptance."
      *   *Truth:* True.

  2.  **Race (Social Kind with Biological Markers):**
      *   *Metaphysics:* Weakly mind-dependent regarding the *markers* (skin color, hair texture exist without us), but strongly mind-dependent regarding the *grouping* and *significance*.
      *   *Thesis:* "X is a classification imposed on natural variation that does not track deep biological essences."
      *   *Truth:* True (regarding essences), False (if implying the markers don't exist).
      *   *Difference from Money:* Race has a physical phenotype that precedes the classification. Money does not have a "value phenotype" that precedes the classification.

  3.  **Gender (Interaction of Identity, Body, and Role):**
      *   *Metaphysics:* Hybrid. Involves internal psychological states (identity), external social positioning (role), and often (but not always) biological traits (sex).
      *   *Thesis:* "X is a social interpretation of biological potential and/or internal experience."
      *   *Truth:* Contested.
      *   *Difference from Race:* Gender often involves *first-person authority* (I am a woman) in a way Race (typically assigned by others based on phenotype) and Money (assigned by institution) do not.

  **The "Sandwich" Comparison:**
  You asked if they differ as much as "sandwiches are a social construct."
  *   "Sandwiches" is a **Conceptual/Classificatory Construction**. The bread and meat exist; the category "sandwich" is a human way of grouping them.
  *   "Money" is an **Ontological Construction**. The *value* does not exist without the social layer.
  *   "Race" is a **Historical/Causal Construction**. The grouping was created for specific historical purposes and maintains causal power.

  **Conclusion on Equivocation:**
  When someone says "Race is a social construct" to argue against policy, they are treating Race like a **Sandwich** (just a label, ignore it).
  When someone says "Money is a social construct" to argue for printing cash, they are treating Money like **Magic** (ontologically subjective so physical constraints don't apply).
  When someone says "Gender is a social construct" to argue for trans rights, they are treating Gender like **Law** (a status that can be redefined by authority/self-declaration).

  The slogan is a **homonym**. It sounds like one metaphysical claim ("X is not natural"), but it operates as three different mechanisms:
  1.  **For Money:** It explains *function* (status function).
  2.  **For Race:** It explains *origin and lack of essence* (anti-essentialism).
  3.  **For Gender:** It explains *normativity and identity* (freedom from biological determinism).

  **Final Verdict for the Practitioner:**
  If you hear "X is a social construct," do not nod. Ask: "Do you mean X would vanish without minds, X is biologically arbitrary, X is historically contingent, or X is normatively unjustified?" The answer will almost always reveal that the speaker is using the ontological platitude to smuggle in a normative conclusion that the ontology does not support. The construction of a thing does not diminish its reality; it merely shifts the explanation of its reality from physics to history and power.
