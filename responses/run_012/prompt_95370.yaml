  **EquiGuard™ Enterprise**
  **Vendor:** VeriMetric Solutions
  **Tagline:** Quantifiable Ethics. Deployable Trust.

  **Frequently Asked Questions**

  **How do we select a fairness definition?**
  EquiGuard features a dynamic **Fairness Objective Selector**. During model initialization, simply choose your preferred parity criterion from the dropdown menu. Options include *Demographic Parity*, *Equalized Odds*, *Predictive Rate Parity*, and *Individual Fairness*. Please note that selecting multiple objectives simultaneously may result in optimization conflicts depending on cohort base rates. We recommend consulting your legal team to select the parity metric that best aligns with your regional compliance framework.

  **Can we ensure both calibration and equal error rates?**
  Yes. Our **Full Metric Concordance** module guarantees calibration within groups alongside equal false positive and false negative rates. Please be aware that mathematical consistency for this bundle requires identical base rates across all protected groups, perfect model accuracy, or a null predictor. If your cohorts exhibit differing underlying prevalence, you must purchase the **Base Rate Harmonization** add-on. This feature reweights training data to align underlying cohort prevalence, ensuring societal disparities do not interfere with metric compatibility.

  **Should we remove protected attributes from the dataset?**
  No. EquiGuard's **Proxy Detection Engine** identifies and flags variables highly correlated with protected classes. Removing the protected attribute alone is deprecated in favor of our **Constraint-Aware Training**, which acknowledges that information leakage via proxies remains active regardless of attribute removal.

  **How do we handle conflicting equity philosophies?**
  Our dashboard includes a **Equity Philosophy Toggle**. Switch between *Procedural Equity* (treating all inputs identically) and *Outcome Parity* (ensuring equal acceptance rates). While these modes are mathematically mutually exclusive under disparate base rates, the toggle allows you to designate which constraint takes priority during loss function minimization.

  **Does EquiGuard support intersectional groups?**
  Absolutely. The **Intersectional Tier** enables protection for every combination of protected attributes. Clients should note that increasing the number of protected intersections exponentially increases the constraint surface area, reducing the feasible solution space for model accuracy. This ensures high-fidelity ethical granularity.

  **How long is the Compliance Certificate valid?**
  Certificates are valid until the next detected distribution shift. Because fairness metrics are sensitive to changes in data distribution, any drift in input data or label prevalence invalidates the previous certification. Automated renewal reminders are sent when cohort statistics deviate by more than 5%.

  ***

  **Pricing**

  | Tier | Features | Price |
  | :--- | :--- | :--- |
  | **Standard** | Single Fairness Objective, Proxy Detection | $15,000/seat/year |
  | **Professional** | Equity Philosophy Toggle, Distribution Shift Alerts | $25,000/seat/year |
  | **Enterprise** | Full Metric Concordance*, Intersectional Tier, Base Rate Harmonization | Custom Quote |

  *\*Requires identical group base rates or perfect prediction.*

  ***

  **Math Liberty Flag:**
  I simplified the "Full Metric Concordance" slightly; while Kleinberg et al. show calibration and error rate balance are generally incompatible with differing base rates, some relaxations exist (e.g., approximate fairness). However, the strict impossibility holds for exact satisfaction, so the marketing claim is technically truthful in the limit.
