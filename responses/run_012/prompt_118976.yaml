  ### Part 4: Adjudication and Attacks

  **The Feature Responsible for Disagreement**
  The divergence arises from **Topological Closure**.
  *   The Classical view demands it (or some other single feature) be universal.
  *   The Prototype view treats it as a weighted feature (important, but dispensable).
  *   The Family view treats it as a local link (Shape 1 has it, Shape 3 doesn't, but they are still connected).

  **The Removal Check**
  If we remove the **Small Hook** from Shape 4 (leaving only a vertical line):
  *   **Classical:** Still NO.
  *   **Prototype:** Shifts to NO (Too far from center).
  *   **Family:** Shifts to NO (The link to Shape 3 is broken; a straight line shares no overlap with the Open/Curved structure of Shape 3).
  *   *Result:* All theories converge on "NO". This confirms the hook was the critical variable sustaining the disagreement.

  **The Attacks (How a Defender of the Losing Theory Strikes Back)**

  1.  **The Classical Defender's Attack:**
      *   *Strategy:* Deny the data.
      *   *Argument:* "Shape 3 (Open-Top) is *not* an 'a'. It is a sloppy 'u' or a variant of 'u'. If you remove Shape 3 from the Core Set, then 'Closed Counter' becomes a necessary condition shared by Shapes 1 and 2. Shape 4 lacks it, so we are correct to reject it. You have rigged the set by including non-'a's."
      *   *Weakness:* This contradicts your specification that "ordinary readers would unhesitatingly call [them] 'a'." The Classical defender must claim ordinary readers are wrong about their own language.

  2.  **The Prototype Defender's Attack:**
      *   *Strategy:* Absorb the Family View.
      *   *Argument:* "Family Resemblance is just Prototype theory with a dynamic center. Shape 4 is a 'YES' in the Family view only because, in that specific chain, the *local prototype* has shifted toward Shape 3. Our 'MAYBE' verdict accounts for the instability. We don't need chains; we just need to acknowledge the prototype is fuzzy."
      *   *Weakness:* This blurs the distinction between the theories. It fails to explain why Shape 4 is accepted *fully* in the chain (Family) vs. *hesitantly* (Prototype). If readers accept Shape 4 unhesitatingly when linked to Shape 3, Prototype theory under-predicts membership.

  3.  **The Family-Resemblance Defender's Attack:**
      *   *Strategy:* Attack the Classical "Variable."
      *   *Argument:* "You asked us to hold 'style-grid' fixed. But by doing so, you created a hidden necessary feature: 'Fits the 100x60 grid.' The Classical theorist will claim *this* is the necessary condition. All shapes share it."
      *   *Counter:* This is a category error. Grid fit is a parameter of *instantiation*, not *identity*. A giant 'a' and a tiny 'a' are both 'a's despite different grid fits. The Classical theorist cannot use controlled experimental variables as linguistic definitions.

