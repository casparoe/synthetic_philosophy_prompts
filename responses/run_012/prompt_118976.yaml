  *   **Shape 3 (The Open-Top):** A curved spine sweeping from top-right to bottom-left. Attached to the bottom is a U-shaped curve that does *not* close at the top. There are no enclosed counters. (Resembles a quick cursive 'a' or a 'u' with a tail).
      *   *Features:* Open Top (0 Counters), Curved Spine.
  *   **Shape 4 (The Marginal Mark):** A vertical straight spine. At the bottom-left, a small, straight horizontal hook extends outward, but it does not curve up to close. There are no enclosed counters. (Resembles a vertical line with a serif, or a minimalist 'a').
      *   *Features:* Open Top (0 Counters), Straight Spine.

  **The Context Layer**
  *   **Context A:** Shape 4 is placed between a 'c' (curved, open right) and a 't' (straight, crossbar). Sequence: **c [Shape 4] t**.
  *   **Context B:** Shape 4 is placed between an 'l' (straight vertical) and an 'h' (straight vertical spine). Sequence: **l [Shape 4] h**.

