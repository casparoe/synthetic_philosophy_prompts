  ### Part 3: The Context Check

  Now we apply the Context Layer to **Shape 4** without changing the shape itself.

  *   **Scenario:** In Context A (**c [Shape 4] t**), readers identify Shape 4 as 'a' ("cat"). In Context B (**l [Shape 4] h**), readers identify Shape 4 as 'l' or a typo ("llh").
  *   **Classical View:** **Fails.** If 'a'-ness is defined by intrinsic necessary features, context should not change the category. The shape either has the features or it doesn't. The flip proves the features are not intrinsic.
  *   **Prototype View:** **Adapts.** The "context" shifts the active Prototype. In "c _ t", the mind expects an 'a', so the Prototype for that slot is 'a'. Shape 4 is close enough to *that* contextual prototype. In "l _ h", the Prototype is 'l'. Shape 4 is closer to 'l'.
  *   **Family-Resemblance:** **Adapts.** The "neighbors" provide new links. In "c _ t", Shape 4 links to 'c' (curved neighbor) and 't' (straight neighbor), forming a valid orthographic family. In "l _ h", the links suggest a vertical-stroke family ('l', 'h'), pushing Shape 4 into the 'l' category.

