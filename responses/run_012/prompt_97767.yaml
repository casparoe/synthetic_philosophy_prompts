prompt: |-
  I've been reading about the laws of war for a history project, and I keep running into a tension I can't resolve on my own. Under the body of international law that governs armed conflict, a soldier who kills an enemy soldier in battle commits no crime, and this immunity holds no matter which side he fights for: a soldier defending his country against an invasion and a soldier marching in the invasion have exactly the same legal permission to kill, so long as neither commits an atrocity like deliberately targeting civilians or torturing prisoners. Yet the same body of law treats the war itself as a matter of individual criminal responsibility, since international tribunals have prosecuted political and military leaders for the crime of waging aggressive war, which means the law does hold someone answerable for the injustice of a war of aggression. And there's a third piece that puzzles me even more: soldiers are expected to disobey orders that are manifestly criminal, an order to shoot unarmed villagers being no defense, which seems to assume that an ordinary soldier is capable of recognizing serious wrongdoing and is blameworthy when he fails to. So the law treats a soldier as a competent moral judge of the order he is given, but not of the war he is ordered to fight.

  What philosophical commitments does this whole practice presuppose? Does combatant immunity presuppose that soldiers on both sides are moral equals, or merely that individual soldiers cannot reasonably be expected to judge their cause, or only that the law finds it useful to draw a line somewhere and stop? Which theories of responsibility would license the practice, and which does it quietly rule out, for instance the view that a soldier fighting for an aggressor does something wrong simply by killing, even if he commits no war crime? Are the three parts consistent with one another, or does the leader's liability for aggression sit uneasily with the soldier's immunity? And if we replaced the presupposed view with the rival view that unjust combatants are not morally permitted to kill at all, what would have to change in the practice, would we have to put ordinary soldiers on trial too, or is there some division of responsibility that could survive the revision? Please reconstruct the implicit theory the practice seems to need, separate what it strictly presupposes from what it merely fits well with, and tell me where the practice is philosophically underdetermined.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Tension:** The user identifies a triad of principles in International Humanitarian Law (IHL) / Just War Theory:
          1.  *Combatant Equality (Immunity):* Soldiers on both sides can kill each other without criminal liability (provided they follow IHL).
          2.  *Leadership Liability (Aggression):* Leaders can be prosecuted for starting an unjust war (*jus ad bellum*).
          3.  *Manifest Illegality:* Soldiers must disobey manifestly criminal orders (e.g., war crimes), implying moral agency.
      *   **The Puzzle:** How can a soldier be morally competent enough to judge specific orders (war crimes) but not competent enough to judge the war itself (aggression)?
      *   **Specific Questions:**
          *   What philosophical commitments does this presuppose?
          *   Does combatant immunity imply moral equality, epistemic limitation, or pragmatic utility?
          *   Which theories of responsibility license this, and which does it rule out (e.g., revisionist just war theory)?
          *   Are the three parts consistent?
          *   What if we adopted the rival view (unjust combatants aren't permitted to kill)? What would change?
          *   Task: Reconstruct the implicit theory, separate strict presuppositions from compatible theories, and identify philosophical underdetermination.

  2.  **Initial Analysis & Mapping to Philosophical Literature:**

      *   This is a classic problem in the ethics of war, often discussed under the heading of the "Independence Thesis" or the "Separation Thesis" in Just War Theory.
      *   *Traditional Just War Theory (Walzerian):* Michael Walzer's *Just and Unjust Wars* is the touchstone. He argues for the "moral equality of combatants."
      *   *Revisionist Just War Theory (McMahan, Rodin, etc.):* Jeff McMahan challenges the moral equality of combatants. He argues that *jus ad bellum* and *jus in bello* are linked. If the war is unjust, killing in it is morally wrongful (though perhaps excused).
      *   *Legal Positivism/Pragmatism:* The law might not reflect deep moral truth but rather functional necessity (reducing brutality, ensuring compliance).
      *   *The "Manifest Illegality" Exception:* This creates the epistemic tension. Why is a massacre obvious but aggression not?

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. Name the framework (Traditional Just War Theory / IHL). State the core tension (The Separation of *Jus ad Bellum* and *Jus in Bello*).

      *   **Part 1: Reconstructing the Implicit Theory (The Walzerian/Orthodox View):**
          *   *Commitment 1: The Separation Thesis.* *Jus ad bellum* (right to war) and *jus in bello* (conduct in war) are logically independent.
          *   *Commitment 2: Epistemic Limitation/Coercion.* Soldiers are instruments of the state. They lack access to information and are under duress (conscription, social pressure, penalty for disobedience).
          *   *Commitment 3: Functional Necessity.* If soldiers feared prosecution for fighting on the losing/unjust side, they would commit more atrocities to survive. Immunity encourages compliance with IHL.
          *   *Commitment 4: The Nature of "Manifest" Crimes.* War crimes are *mala in se* (evil in themselves). Aggression is *mala prohibita* (wrong because the law/state says so) or requires complex geopolitical judgment.

      *   **Part 2: Addressing the Specific Questions:**
          *   *Moral Equality vs. Epistemic Limitation:* The law *acts as if* they are moral equals regarding killing, but the *justification* is usually epistemic/pragmatic, not ontological. It doesn't necessarily claim the aggressor soldier is *morally good*, just *not criminally liable*.
          *   *Theories of Responsibility:*
              *   *Licensed:* Collectivism (the State acts, not the individual), Dualism (separate spheres of judgment), Pragmatic Utilitarianism.
              *   *Ruled Out:* Strong Individual Moral Responsibility regarding *ad bellum* (Revisionism). The view that "unjust killing is murder" is ruled out *legally*, though debated *philosophically*.
          *   *Consistency:* Is it consistent?
              *   *Orthodox View:* Yes, because the spheres are separate.
              *   *Critical View:* No, it creates a "moral paradox." (McMahan's critique). The law prioritizes order over deep moral consistency.

      *   **Part 3: The Rival View (Revisionism/ McMahan):**
          *   If unjust combatants aren't permitted to kill:
              *   *Legal Change:* Combatant immunity would collapse. Unjust soldiers would be liable to defensive killing and potentially prosecution for murder.
              *   *Division of Responsibility:* Could we keep a division? Maybe excuse based on duress/ignorance, but not *permission*. The act remains wrong, the agent might be excused.
              *   *Practical Consequence:* Wars would become bloodier (soldiers fight to the death to avoid trial).

      *   **Part 4: Strict Presuppositions vs. Underdetermination:**
          *   *Strict Presuppositions:* The law *must* assume soldiers cannot reliably judge *ad bellum* claims. It *must* assume distinguishing *ad bellum* from *in bello* is administratively possible.
          *   *Underdetermined:* The *moral* status of the soldier. The law is agnostic on whether the aggressor soldier is *sinning*, only that he is not *prosecutable*. It doesn't commit to Moral Equality as a metaphysical truth, only as a legal fiction.

  4.  **Refining and Polishing:**

      *   *Tone:* Academic, precise, neutral but analytical.
      *   *Terminology:* Use *Jus ad Bellum*, *Jus in Bello*, Combatant Privilege, Command Responsibility, Revisionist Just War Theory.
      *   *Check against User Prompt:* Did I answer the "manifest illegality" tension? Yes (distinction between complex political judgment vs. immediate moral horror). Did I address the "what would change" scenario? Yes.
      *   *Self-Correction during drafting:* I need to make sure I don't conflate *moral* permission with *legal* immunity. The law grants immunity; philosophy debates permission. The user asks about the "practice" (law) and its "philosophical commitments." I need to distinguish between what the law *says* and what philosophical theory *explains* the law.
      *   *Key Insight:* The "Manifest Illegality" clause is the crack in the armor. It admits soldiers have moral agency. The orthodox defense is that *ad bellum* judgments are epistemically opaque, whereas *in bello* violations are epistemically transparent.

  5.  **Final Structure:**
      1.  Introduction: The Orthodoxy (Walzer) vs. Revisionism (McMahan).
      2.  The Three Pillars & Their Philosophical Glue (The Separation Thesis).
      3.  Addressing the Tension (Epistemic vs. Moral).
      4.  Theories of Responsibility (Collective vs. Individual).
      5.  Consistency Check (Pragmatic Coherence vs. Moral Consistency).
      6.  The Counterfactual (If Revisionism ruled).
      7.  Conclusion: Presuppositions vs. Underdetermination.

  6.  (Final Review of the Output): Ensure the distinction between *justification* and *excuse* is clear. Ensure the distinction between *legal liability* and *moral blameworthiness* is clear. (The law often treats immunity as a bar to liability, not necessarily a declaration of moral purity).

  7.  *Proceed to generate response.*
answer: |-
  This is one of the most profound problems in the ethics of war and international law. You have accurately identified the central tension in what is known as the **Orthodox Just War Theory** (often associated with Michael Walzer) and its codification in International Humanitarian Law (IHL).

  The tension you describe is the conflict between the **Separation Thesis** (the idea that the justice of the war [*jus ad bellum*] is separate from the justice of conduct in the war [*jus in bello*]) and the **Moral Agency of the Soldier**.

  Here is a reconstruction of the implicit theory the practice needs, an analysis of its philosophical commitments, and an examination of where the practice is underdetermined.

  ---

  ### 1. Reconstructing the Implicit Theory: The Orthodox View

  To make the three parts you listed cohere, the current legal practice relies on a specific cluster of philosophical commitments. We can call this the **Functionalist-Collectivist Model**.

  #### A. The Separation Thesis (Logical Independence)
  The practice presupposes that *jus ad bellum* and *jus in bello* are logically independent.
  *   **Commitment:** A soldier's right to kill is derived from their status as a combatant, not from the justice of their cause.
  *   **Why:** If the right to kill depended on the justice of the cause, only one side would have the right to kill. This would render the laws of war (IHL) inoperable, as the "unjust" side would have no incentive to follow rules they are already violating by fighting.

  #### B. Epistemic Limitation and Duress
  The practice presupposes that while soldiers are moral agents, they are **epistemically disadvantaged** regarding *ad bellum* questions.
  *   **Commitment:** Determining whether a war is "aggressive" or "defensive" requires access to classified intelligence, historical context, and legal expertise that ordinary soldiers do not possess.
  *   **Contrast:** Determining if an order is "manifestly criminal" (e.g., shooting a prisoner) requires only basic moral intuition available to anyone.
  *   **Duress:** Soldiers are often conscripted or subject to severe penal codes for disobedience. The law treats them as instruments of the state rather than fully autonomous authors of the war.

  #### C. Pragmatic Utilitarianism (The "Clean Hands" Doctrine)
  The practice presupposes that **humanitarian protection outweighs retributive justice** for combatants.
  *   **Commitment:** Granting immunity to unjust combatants is a "necessary fiction." It is not necessarily that they are *morally innocent*, but that prosecuting them leads to worse outcomes (longer wars, more atrocities, refusal to surrender).
  *   **Function:** Combatant immunity is a bargaining chip. "We won't hang you for fighting if you promise not to torture prisoners."

  ---

  ### 2. Addressing Your Specific Questions

  #### Does combatant immunity presuppose moral equality?
  **Strictly speaking, no.** It presupposes **legal equality**, but it is agnostic on **moral equality**.
  *   **The Legal Fiction:** The law treats soldiers as equals to ensure the machinery of IHL works.
  *   **The Philosophical Reality:** The Orthodox view (Walzer) argues they *are* moral equals because they are coerced instruments. The Revisionist view (McMahan) argues they are *not* moral equals (unjust combatants act wrongly) but should be *excused* legally.
  *   **Conclusion:** The practice does not require the strong claim that "aggressor soldiers are morally blameless." It only requires the weaker claim that "aggressor soldiers are not appropriate targets for criminal prosecution."

  #### Which theories of responsibility license this practice?
  *   **Licensed:**
      *   **Collective Responsibility:** The State is the moral agent, not the individual. The soldier is an organ of the state.
      *   **Dualism:** There are two distinct moral spheres (political leadership vs. military execution).
      *   **Excuse Theory:** The unjust soldier does wrong but is excused due to ignorance or duress.
  *   **Ruled Out:**
      *   **Strong Individual Liability (Revisionism):** The view that an unjust combatant commits murder and is liable to defensive killing *and* criminal prosecution is ruled out by current law.
      *   **Pacifism:** The view that killing in war is never permitted is obviously ruled out.

  #### Are the three parts consistent?
  *   **Legally:** Yes. The Nuremberg Principles established that "following orders" is no defense for war crimes (*in bello*), but the UN Charter and Rome Statute place *ad bellum* liability squarely on leaders "in a position effectively to exercise control over... the political or military action of a State."
  *   **Philosophically:** This is the point of contention.
      *   **The Tension:** If a soldier is competent enough to know shooting a villager is wrong (Part 3), why is he not competent enough to know invading a neighbor is wrong (Part 1)?
      *   **The Orthodox Resolution:** The distinction is **epistemic**, not moral. Shooting a villager is *mala in se* (wrong in itself); aggression is *mala prohibita* (wrong because the legal order says so) or requires complex judgment.
      *   **The Revisionist Critique:** Jeff McMahan argues this is inconsistent. If a soldier knows the villagers are innocent, he should know he has no right to kill them. If the war is aggressive, the enemy soldiers are not threatening him unjustly; he is threatening them. Therefore, he is morally liable for killing them. The law prioritizes **order** over **moral consistency**.

  ---

  ### 3. The Counterfactual: If We Adopted the Rival View

  Suppose we replaced the Orthodox view with the **Revisionist View** (Unjust combatants are not morally permitted to kill). What would change?

  #### A. Legal Liability
  *   **Prosecution:** Ordinary soldiers could theoretically be prosecuted for murder for killing enemy combatants, not just for war crimes.
  *   **Immunity Collapse:** The "Combatant's Privilege" would vanish for the aggressor side. They would be treated similarly to insurgents or criminals under domestic law.

  #### B. Division of Responsibility
  Could a division of responsibility survive?
  *   **Excuse vs. Justification:** We could maintain that unjust killing is *wrong* (no justification) but the soldier is *excused* (no blame) due to reasonable belief or duress.
  *   **The Problem:** This creates a "mistake of law" defense. If every soldier can claim they "thought the war was just," you return to the status quo. To make Revisionism work, you would need an objective standard of aggression that is easy for soldiers to apply, which is arguably impossible.

  #### C. Practical Consequences
  *   **Increased Brutality:** If unjust soldiers know they will be tried for murder if they lose, they will fight to the death. Surrender becomes irrational.
  *   **Asymmetric Warfare:** Just armies would be bound by IHL, while unjust armies (knowing they are liable) would abandon IHL entirely. This harms civilians.

  ---

  ### 4. Strict Presuppositions vs. Philosophical Underdetermination

  This is the crucial distinction for your project. We must separate what the law *must* assume to function from what it merely *happens to align with*.

  #### Strict Presuppositions (What the Law Needs)
  1.  **Epistemic Asymmetry:** The law *must* assume that distinguishing *ad bellum* justice is significantly harder for a soldier than distinguishing *in bello* crimes. If this is false, the "manifest illegality" exception swallows the rule of immunity.
  2.  **State Agency:** The law *must* assume the State is the primary bearer of *ad bellum* responsibility. If the individual is the primary bearer, leadership liability alone makes no sense.
  3.  **Incentive Compatibility:** The law *must* assume that granting immunity increases compliance with IHL. If immunity encourages atrocities, the pragmatic justification fails.

  #### Philosophical Underdetermination (Where the Law is Agnostic)
  1.  **Moral Status of the Unjust Soldier:** The law does not commit to whether the unjust soldier is *sinning*. It only commits to not *punishing* him. It leaves open the possibility that he is morally guilty but legally immune.
  2.  **The Nature of "Manifest":** The law does not define "manifest" with philosophical precision. It leaves open whether this is an objective standard (what a reasonable person knows) or subjective (what this specific soldier knew).
  3.  **The Source of Authority:** The law does not resolve whether the soldier's duty comes from a social contract, a moral duty to obey legitimate authority, or simple coercion.

  ### Summary for Your Project

  The tension you found is real and is the central debate in modern just war theory.

  *   **The Practice** relies on a **pragmatic separation**: Leaders pay for the *decision* to fight; soldiers are judged only on the *manner* of fighting.
  *   **The Philosophical Cost:** This requires accepting that legal liability does not track moral liability perfectly. It sacrifices deep moral consistency (the idea that murder is always murder) for humanitarian utility (the idea that rules of war save lives).
  *   **The Weak Point:** The "manifest illegality" clause. If soldiers are moral agents capable of recognizing the horror of a massacre, Revisionists argue they are capable of recognizing the injustice of an invasion. The Law responds that one is a visible act of cruelty, the other is a complex political judgment.

  **Conclusion:** The practice presupposes that **administrative feasibility and humanitarian protection are higher values than perfect moral retribution.** It rules out the theory that individual soldiers are fully autonomous moral agents responsible for the geopolitical context of their actions, but it quietly relies on them being autonomous enough to refuse atrocities. It is a system built on a deliberate, functional inconsistency.
