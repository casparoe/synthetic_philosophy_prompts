answer: |-
  At the post-concert reception, a critic gushed to the composer, "The second movement was unmistakably the sea—I could hear the waves crashing!"

  The composer, a devout Schopenhauerian, sighed. "Please. If you heard the sea, you were listening to the Ideas. Painting copies the Ideas—the sea, the storm, the hero. Music copies the Will itself. It skips the Platonic middleman."

  "So what was I listening to?"

  "The Will."

  "Which sounds like…?"

  "Nothing representable. The sea is just the Will objectified—like the Will wearing a costume. You're trying to find a noun in a sentence that is purely verb."
