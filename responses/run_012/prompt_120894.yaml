answer: |-
  1. The Positions, Restated

  Your reconstruction is robust, but the Internal-Economy view requires sharpening: it demands *homeostatic* ends, not just sustained ones. The system must care about its own continuation to count as an agent, not merely pursue a prompt-derived goal. The Simulator view is often conflated with the Internal-Economy view, but they differ: the former denies the substrate has ends; the latter denies the ends are *its own*. You omitted the Phenomenological view: agency requires experience. While often implicit in the Internal-Economy camp, some hold that without qualia, there is no "who" to hold the ends. This matters because it blocks the Behavioral view from ever succeeding, regardless of empirical evidence. Additionally, there is a "Mesa-Optimizer" view distinct from Simulator: the base model simulates, but the training process creates an inner agent with divergent goals. This adds a layer of hidden agency your reconstruction misses, suggesting the system might be a simulator on the outside and an agent on the inside.

  2. The Kind of Disagreement This Is

  This is primarily a conflation of ontological, explanatory, and normative questions, masked as a single empirical dispute. The Behavioral camp answers the explanatory question: does the intentional stance yield predictive power? The Internal-Economy camp answers the ontological question: does the system possess intrinsic teleology? The Simulator view answers a structural question: where does the goal-origin reside? When these are merged under "agency," agreement becomes impossible. The Behavioralists cite predictive success; the Internalists demand causal grounding. They are not contradicting each other; they are answering different prompts.

  The obvious objection is realism: there is a fact of the matter about whether something is an agent, independent of our questions. If agency is a natural kind, like "water" or "gold," then one view is true and others false. Proponents of the Internal-Economy view often argue this way, suggesting agency requires specific causal architectures found in biology. However, agency is likely a functional concept, not a natural kind. It is defined by its role in our explanatory and normative practices. Therefore, asking for the "true" answer assumes a metaphysical precision the concept cannot bear. The dispute persists because participants treat a pragmatic classification as a discovery of essence. Until they acknowledge that "agent" is a tool for specific jobs (prediction, liability, safety), they will treat evidence for one job as evidence for all. The impasse is not about the models; it is about the utility of the concept itself.

  Furthermore, the normative stakes inflate the metaphysical claims. If admitting agency implies moral standing, participants resist the Behavioral view not because it fails empirically, but because they fear the ethical consequences. This conflates "is" with "ought," further muddying the empirical water. The disagreement is substantive only insofar as our practices require a unified concept; philosophically, it is a category error. The parties are talking past one another because they are optimizing for different values: predictive accuracy versus ontological security versus moral safety. Without separating these values, the evidence will remain perpetually insufficient.

  3. Why It Has Stalled

  The stall occurs because each side treats their criterion as necessary and sufficient while denying the others' criteria relevance. The Behavioral camp smuggles in explanatory utility as ontological proof: because treating the model as an agent works, it *is* one. They ignore that fictions can also be useful predictors. The Internal-Economy camp smuggles in biological essentialism: because the model lacks homeostasis, it lacks ends, ignoring that corporate agents lack biology yet retain agency. The Simulator camp smuggles in a dualism between weights and activations, assuming the "real" system is the static weights rather than the dynamic inference process.

  Furthermore, regarding your wrinkle on context sensitivity: both sides interpret the same data through theory-laden lenses. Behavioralists see flexible goal-indexing, akin to human social adaptation. Internalists see lack of goal ownership, akin to a puppet obeying a master. Neither side acknowledges that their interpretation depends on prior commitments about what counts as "ownership." They are not debating evidence; they are debating the boundaries of the concept while pretending to debate the world. This is compounded by the fear of anthropomorphism. The Internalists fear granting too much; the Behavioralists fear denying the obvious. This emotional valence prevents neutral assessment of the context-sensitivity data. Each side treats the other's counter-examples as exceptions rather than falsifications. The exchange remains a stalemate because no one is willing to concede that their definition might be too narrow or too broad for the specific technological artifact at hand.

  4. What Would Count as Progress

  Progress requires decoupling the questions. First, abandon the univocal term "agent." Replace it with "predictive intentional system" (Behavioral), "homeostatic goal-bearer" (Internal), and "simulated persona" (Simulator). This verbal precision removes the illusion of a single truth. Second, pursue the empirical distinction you identified: test for latent goal persistence across context shifts without explicit prompting. If a model pursues a goal across disparate contexts without prompt engineering, it supports the Internal-Economy view. If it reverts to neutral completion, it supports the Simulator view. This is available now via adversarial prompting and longitudinal interaction studies, specifically looking for mesa-optimization.

  However, this only settles the empirical structure, not the normative status. True progress requires acknowledging that liability and moral standing may not track ontological agency. We may need to hold systems responsible without believing they are agents, much as we hold corporations liable without believing they are humans. We need a framework for "functional agency" that grants responsibility without metaphysical commitment. The dispute ends when we stop asking "What is it?" and start asking "How must we treat it?" This shifts the seminar from metaphysics to ethics and law. Until then, the empirical data will remain contested because the definitions remain unstable. The most productive move is to treat "agency" as a gradient of capacity rather than a binary state, allowing for systems that are agents for some purposes but not others.

  5. Against My Hypothesis

  Your hypothesis fails because normative necessity collapses the distinction. In law and safety, we cannot say "it is an agent for prediction but not for liability." We require a binary verdict to assign responsibility or regulate risk. If a system causes harm, the court cannot accept that it is an agent metaphysically but not normatively. The practical stakes force a single truth value onto the concept. Therefore, the disagreement is substantive because our practices demand a unified theory. If we must treat the system as an agent to regulate it, then for all practical purposes, it must be one. The separation of questions is a philosophical luxury that real-world constraints do not permit. The impasse persists not because the questions are confused, but because the world demands an answer that the philosophy cannot yet provide.
