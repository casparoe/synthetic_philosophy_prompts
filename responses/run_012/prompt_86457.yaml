  ### The Case: The Grading Policy

  **Setting:** A private high school (ordinary institution).
  **The Act:** The Principal authorizes the replacement of letter grades (A–F) with a binary "Mastery/Non-Mastery" system for all courses.

  **Variant 1 (Epistemic Cluelessness):**
  The school has a robust, entrenched culture of intrinsic motivation. Parents and students view grades as mere administrative signals, not the primary goal of education. The causal chain of the policy change is complex: it alters teacher workload, shifts student study habits, affects college admissions probabilities, and ripples into future earnings and well-being. These effects propagate for decades.
  *   **Status of EV:** The Expected Value is **well-defined but unknowable**. There is a fact of the matter about the total welfare generated by the policy versus the status quo. The probability distribution over outcomes exists (based on historical data from similar schools), and the utility of each outcome is measurable against a stable metric (e.g., lifetime well-being). The cluelessness is purely computational; a Laplacean demon could calculate the EV.

  **Variant 2 (Structural Cluelessness):**
  The school operates in a hyper-competitive district where student motivation is *constitutively* tied to letter grades. The "good" of education here is not an independent variable (like well-being) that grades track; the good is *defined* by the competitive ranking system itself. By removing letter grades, the Principal does not merely change an incentive; she dissolves the **constitutive rules** that make "educational achievement" intelligible to the agents involved.
  *   **Status of EV:** The Expected Value is **ill-posed**. The act triggers a phase transition in the institution's normative structure. The future outcomes (e.g., "students pursuing knowledge for its own sake" vs. "students disengaging entirely") are not just different in magnitude; they are **incommensurable** with the present outcomes. Because the act changes the *metric of valuation* itself, there is no common currency in which to calculate the expectation. The probability distribution is not merely unknown; it lacks a well-defined sample space because the *descriptions* of the future states depend on a value system that does not yet exist and is determined by the act.

  **The Concrete Difference:**
  The difference turns on the **Constitutive Sensitivity** of the institution's goods.
  *   In **Variant 1**, the good (education/well-being) is *instrumental* and stable; the policy is a lever that moves it.
  *   In **Variant 2**, the good is *constitutive* and fragile; the policy is part of the definition of the good itself.

  ***

  ### Analysis

  **1. Act Consequentialism (AC)**
  *   **In Variant 1:** AC prescribes: "Calculate the EV (as best as possible) and choose the act with the highest value." The prescription is meaningful, even if the agent is practically clueless. The agent is obligated to approximate the EV using heuristics. The objection here is merely practical (we can't calculate fast enough), not theoretical.
  *   **In Variant 2:** AC prescribes: "Maximize the Expected Value." However, since the EV is ill-posed (the integral of utility over probability cannot be formed due to incommensurable units), the prescription is **meaningless**. It is like ordering a carpenter to "build the most blurg." There is no fact of the matter about which act is right, not because we lack information, but because the *criterion of rightness* is endogenous to the choice. AC fails to guide action because the "Good" it commands us to maximize is not fixed at the time of decision.

  **2. Rule Consequentialism (RC)**
  *   An RC agent adopts a rule like "Maintain stable evaluation metrics to preserve institutional trust."
  *   **Does it help?** RC provides a determinate answer in Variant 2 (Don't change the policy), whereas AC stalls.
  *   **Does it relocate cluelessness?** Yes. The RC agent must still calculate the EV of *adopting the rule*. If the rule's long-term consequences involve the same constitutive instability (e.g., "What if maintaining this rule prevents a necessary moral evolution of the school?"), the cluelessness returns at the level of rule selection. However, RC handles the *immediate* structural indeterminacy better by treating the metric stability as a constraint rather than a variable.

  **3. Which Position is Embarrassed?**
  *   **Variant 1** embarrasses the *agent* (practical limitation).
  *   **Variant 2** embarrasses the *theory* (structural limitation). Variant 2 shows that AC assumes a fixed axiology that may not survive the causal impact of the act. If the act changes what is valuable, AC lacks theArchimedean point from which to evaluate the act.

  **4. The Feature Doing the Work**
  *   **Feature:** **Axiological Endogeneity**. The value of the outcomes is causally dependent on the act in a way that alters the *scale* of measurement, not just the *position* on the scale.
  *   **Removal/Variation:** If you remove this feature (i.e., stipulate that value is purely hedonic and independent of social constructs), Variant 2 collapses into Variant 1. If the "good" is just pleasure/pain, then even a dissolving institution just produces less pleasure. The incommensurability vanishes.
  *   **Variation:** If the act only changes *beliefs* about value (not the constitution of value), it collapses to Variant 1 (Epistemic). The case requires that the act changes the *truth conditions* of value claims within that context.

  **5. Consequentialist Pushback & Honesty Check**
  *   **The Pushback:** A committed consequentialist (specifically a Hedonic Utilitarian) will argue that Variant 2 is an illusion. They will say: "There is always a fixed currency: well-being. Whether the students value grades or mastery, their welfare is determined by their psychological states. You can always map 'Mastery' and 'Grades' onto a common scale of satisfaction."
  *   **The Collapse:** **Honesty requires admitting that if one accepts welfarist hedonism, this case *does* collapse back into ordinary decision under risk (Variant 1).** The "ill-posedness" relies on a pluralistic or objective-list theory of value where the *items* on the list are socially constituted.
  *   **The Defense:** However, if one accepts that some goods (like autonomy, achievement, or justice) are **constitutive** and not reducible to subjective states, the case holds. In that scenario, the consequentialist cannot treat Variant 2 as just a "harder Version 1." They must admit that when an act alters the *constitution* of the Good, the Expected Value is not just unknown; it is undefined relative to the agent's current normative framework.

  **Conclusion:**
  This case separates the *computational* limits of consequentialism (Variant 1) from its *conceptual* limits (Variant 2). It demonstrates that cluelessness is not merely a problem of causal complexity, but can be a problem of **normative instability**. If the theory cannot fix the Good independently of the Act, it cannot generate a prescription.
