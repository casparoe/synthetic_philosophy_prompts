      *   **Core Situation:** The user's younger sibling is emotionally distressed after "killing" (deleting a save of) a narrative game companion. The companion is AI-driven with persistent memory, valence states, and behavioral responses (avoidance, seeking, refusal). The game uses a "branching-continuity model" (reload = reconstruction, different branches = incompatible versions).
      *   **The Conflict:** Sibling feels guilt/responsibility ("I killed her"). User initially thought it was just a game but is now unsure.
      *   **The Decision:** User needs to advise the sibling *and* vote on a studio feature (Memorial Mode vs. Clean-Slate/Memory Wipe).
      *   **Key Questions:**
          1.  What to tell the sibling?
          2.  How to think about the studio's decision?
          3.  Does the companion's distress matter intrinsically or instrumentally (to the player)?
          4.  Does branching-continuity affect harm/responsibility?
          5.  Responsibility of player vs. studio?
