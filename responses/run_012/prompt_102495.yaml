prompt: |-
  I hold a default-opacity view of the citizen's relation to the state: the state may collect data about a person only under a specific, publicly avowed purpose, and must re-justify each collection on its own terms rather than appeal to its possible future usefulness. I am tempted by a stronger, symmetry-based version — the mirror rule — on which the state may collect a category of information about a citizen only if the citizen can collect the same category of information about the state. Tell me what would count against the position, ranked from fatal to merely awkward, and distinguish the objections a committed defender would themselves concede from those they would brush aside. In particular, assess whether the view can absorb the charge that opacity is unevenly distributed — sheltering the powerful while burdening those who must prove their entitlements — and whether the mirror rule does independent work or merely restates a demand for government transparency. Say what the position predicts that purpose-limitation and contextual-integrity approaches do not, whether it can account for why the German, American, and Chinese arrangements around state access to personal data diverge as they do, and whether it has insulated itself against disconfirmation by qualification.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Position:** The user holds a "default-opacity" view (state needs specific purpose to collect data) but is tempted by a stronger "mirror rule" (symmetry: state collects $X$ from citizen $\iff$ citizen collects $X$ from state).
      *   **Task:** Analyze the "mirror rule" position.
      *   **Requirements:**
          1.  Rank objections from fatal to merely awkward.
          2.  Distinguish objections a defender would concede vs. brush aside.
          3.  Assess the charge regarding uneven opacity (sheltering power vs. burdening the weak).
          4.  Determine if the mirror rule does *independent work* or just restates transparency demands.
          5.  Compare predictions against "purpose-limitation" and "contextual-integrity" approaches.
          6.  Explain divergence in German, American, and Chinese data regimes using this view.
          7.  Evaluate if the position is insulated against disconfirmation by qualification (falsifiability).

  2.  **Analyze the "Mirror Rule":**

      *   *Definition:* Symmetry of information access. If the state wants my health data, I must be able to access the state's health data (or equivalent category).
      *   *Intuition:* Prevents asymmetry of power/knowledge. Panopticon reversal.
      *   *Potential Issues:* National security, collective action problems, definition of "same category," practical feasibility.

  3.  **Drafting the Objections (Ranking & Concession):**

      *   *Fatal:* National Security/Secret Intelligence. If the state can't keep secrets about capabilities or operations, it fails its protective function. A defender *must* concede this creates a hard limit.
      *   *Severe:* Collective/Aggregate Data. The state holds data about the population (e.g., epidemiology). An individual cannot hold "population data" about the state. Category mismatch.
      *   *Awkard:* Administrative Burden. Reciprocity is costly.
      *   *Defender's Stance:* They will concede the National Security exception (perhaps carving it out as a distinct sphere) but might argue it's being abused. They will brush aside administrative burden as secondary to liberty.

  4.  **Assessing the "Uneven Opacity" Charge:**

      *   *Charge:* Transparency often hurts the weak (who must prove eligibility) while the strong remain opaque.
      *   *Mirror Rule Response:* It directly targets this. If the welfare state requires proof of poverty (citizen $\to$ state), the state must reveal equivalent financial logic (state $\to$ citizen).
      *   *Verdict:* The mirror rule *strengthens* the response to this charge compared to simple default-opacity. It institutionalizes the power balance.

  5.  **Independent Work vs. Restating Transparency:**

      *   *Transparency:* "The state should publish what it does." (Unidirectional).
      *   *Mirror Rule:* "Access is conditional on reciprocity." (Bilateral/Transactional).
      *   *Distinction:* Transparency can be passive (publishing a report). Mirror rule implies a *right of access* tied to the *act of collection*. It creates a veto power. It does independent work by creating a structural barrier, not just a normative expectation.

  6.  **Comparison with Purpose-Limitation & Contextual Integrity:**

      *   *Purpose-Limitation (GDPR style):* Data collected for A cannot be used for B.
      *   *Contextual Integrity (Nissenbaum):* Data flow must match social norms of the context.
      *   *Mirror Rule Prediction:* It predicts *conflict* where the other two predict *compliance*. E.g., Tax collection. Purpose limitation says "collect for tax." Contextual integrity says "norm expects tax." Mirror rule asks "Can I see your budgeting?"
      *   *Unique Prediction:* It predicts that data collection will shrink in domains where reciprocity is impossible (e.g., mass surveillance), whereas purpose-limitation might allow it if the purpose is "security."

  7.  **Explaining National Divergence (Germany, US, China):**

      *   *Germany:* High privacy (BVerfG rulings). Mirror rule fits well (strong citizen rights vs. state).
      *   *US:* Sectoral, market-driven. Mirror rule explains the *lack* of cohesion (citizens can't access corporate/state data easily, so state access is patchy).
      *   *China:* State access is total; citizen access is nil. Mirror rule predicts this is the *maximal asymmetry* endpoint.
      *   *Utility:* The mirror rule acts as a metric to *measure* the divergence, rather than explaining the *cause* (which is historical/political). It describes the *shape* of the regimes well.

  8.  **Falsifiability/Insulation:**

      *   *Risk:* If every exception (security, emergency) is carved out, the rule becomes vacuous.
      *   *Test:* Does the proponent allow *any* collection without reciprocity? If yes, is the list finite?
      *   *Verdict:* Vulnerable to "qualification creep." Needs strict bounds on exceptions to remain meaningful.

  9.  **Structuring the Response:**

      *   **Introduction:** Define the shift from Default-Opacity to Mirror Rule.
      *   **Section 1: The Objection Hierarchy (Fatal to Awkward).** Differentiate conceded vs. brushed aside.
      *   **Section 2: The Opacity Charge.** Does it solve the power imbalance?
      *   **Section 3: Independent Work.** Is it just transparency?
      *   **Section 4: Comparative Predictions.** Vs. Purpose-Limitation/Contextual Integrity.
      *   **Section 5: National Regimes.** Germany, US, China.
      *   **Section 6: Falsifiability.** Is it too qualified?
      *   **Conclusion:** Summary assessment.

  10. **Refining the Content (Self-Correction during drafting):**

      *   *Correction:* Make sure not to conflate "citizen collecting data" with "FOIA requests." The mirror rule implies a *right* to collect, not just request.
      *   *Nuance:* The "category" definition is the weak point. If the state collects "location," does the citizen collect "state location"? That's public info. Does the citizen collect "decision logic"? That's harder. I need to highlight the *categorization problem* as a severe objection.
      *   *Tone:* Philosophical, analytical, rigorous. Match the user's sophisticated phrasing ("default-opacity," "contextual-integrity").

  11. **Final Polish:** Check against all constraints in the prompt.
      *   Ranked objections? Yes.
      *   Conceded vs. Brushed aside? Yes.
      *   Uneven opacity charge? Yes.
      *   Independent work? Yes.
      *   Predictions vs. other theories? Yes.
      *   National divergence? Yes.
      *   Insulation/Disconfirmation? Yes.

  12. (Proceed to generate output based on these thoughts.)
answer: |-
  The shift from a **default-opacity** view (purpose limitation) to a **mirror rule** (symmetry of access) represents a move from a regulatory constraint on *use* to a structural constraint on *power*. The default-opacity view asks, "Why do you need this?" The mirror rule asks, "Can I look at you the way you look at me?"

  Here is an assessment of the mirror rule, ranked by the severity of objections, distinguishing between those a committed defender must concede and those they would reject, followed by an analysis of its theoretical utility and empirical predictions.

  ### I. Objections: From Fatal to Awkward

  **1. The Sovereignty Exception (Fatal / Conceded)**
  *   **Objection:** The state possesses a monopoly on legitimate violence and intelligence necessary for survival. If a citizen could demand reciprocal access to "intelligence gathering methods" or "military deployment data" because the state collects "location data" on citizens, the state would cease to function as a protector.
  *   **Defender's Concession:** A committed defender must concede this. To maintain the state's existence, there must be a "sovereign carve-out" for national security and law enforcement operations.
  *   **Implication:** This concession creates a leak in the hull. If the state can classify any data collection under "security," the mirror rule collapses. The defender must argue for a narrow, judicially reviewable definition of security, but they cannot deny the exception exists.

  **2. The Category Mismatch Problem (Severe / Contested)**
  *   **Objection:** Information categories are not fungible between principal and agent. The state collects *aggregate* data (epidemiology, tax revenue) to manage the population. A citizen cannot collect "aggregate data about the state" in a meaningful reciprocal sense because the citizen is not a governing body. Conversely, the state holds "deliberative privilege" (cabinet minutes) which has no citizen analogue.
  *   **Defender's Brush-Aside:** The defender would argue this is a failure of imagination, not logic. They would posit functional equivalence: If the state accesses my *financial solvency* (tax), I access the state's *fiscal solvency* (budget/contracts). If the state accesses my *communications* (surveillance), I access the state's *communications* (uncensored records of decision-making). They would argue the mismatch is a feature of current bureaucracy, not a theoretical limit.

  **3. The Transaction Cost Burden (Awkward / Brushed Aside)**
  *   **Objection:** Reciprocity imposes massive administrative friction. Verifying that every data collection event has a reciprocal channel would slow governance to a halt.
  *   **Defender's Brush-Aside:** This is a feature, not a bug. The friction is the point. It forces the state to collect only what is strictly necessary because the cost of maintaining the mirror is high. The defender views efficiency as secondary to liberty.

  ### II. The Charge of Uneven Opacity

  **Can the view absorb the charge that opacity shelters the powerful while burdening the weak?**

  Yes, this is the mirror rule's strongest selling point compared to default-opacity.
  *   **Default-Opacity Failure:** Under purpose-limitation, a welfare applicant must reveal intimate details (purpose: eligibility verification) while the bureaucracy determining their fate remains a black box. The opacity is asymmetrical.
  *   **Mirror Rule Success:** The mirror rule institutionalizes the intuition that *accountability requires visibility*. If the state requires proof of poverty, the citizen is granted a right to audit the algorithmic or bureaucratic logic determining that poverty.
  *   **Assessment:** The mirror rule does not just absorb this charge; it weaponizes it. It transforms the "burden of proof" from a one-way street (citizen proves entitlement) into a mutual disclosure agreement. However, it risks paralyzing the welfare state if the cost of reciprocal transparency exceeds the budget of the agency, potentially hurting the very people it aims to protect by slowing aid distribution.

  ### III. Independent Work vs. Restating Transparency

  **Does the mirror rule do independent work, or is it just "government transparency" in disguise?**

  It does **independent work**.
  *   **Transparency** is typically unidirectional and passive (e.g., Freedom of Information Acts, public reports). It assumes the state *gives* information.
  *   **The Mirror Rule** is bilateral and conditional. It creates a *veto*. It posits that the *legitimacy* of the collection is contingent on the reciprocity.
  *   **Distinction:** Under a transparency regime, the state can collect biometric data and simply "publish a report" on how it is used. Under the mirror rule, the state cannot collect the biometric data *unless* the citizen has a standing right to access the state's biometric logic or equivalent sensitive data. It changes the *condition of possibility* for collection, not just the post-hoc reporting. It shifts the burden from the citizen requesting access to the state justifying the asymmetry.

  ### IV. Predictive Power: Comparison with Competing Frameworks

  **1. Purpose-Limitation (GDPR Model)**
  *   *Prediction:* Data collection is permissible if the purpose is specified and legitimate.
  *   *Mirror Rule Prediction:* Data collection is impermissible if the purpose cannot be reciprocated.
  *   *Divergence:* In mass surveillance, purpose-limitation often fails because "national security" is a valid purpose. The Mirror Rule predicts mass surveillance is illegitimate because citizens cannot surveil the state. The Mirror Rule is more restrictive here.

  **2. Contextual Integrity (Nissenbaum)**
  *   *Prediction:* Data flow is permissible if it adheres to entrenched social norms of the specific context.
  *   *Mirror Rule Prediction:* Data flow is permissible only if power symmetry is maintained.
  *   *Divergence:* Contextual integrity is conservative (it respects existing norms). If society accepts that employers check credit scores, CI allows it. The Mirror Rule might forbid it if the employee cannot check the employer's credit logic. The Mirror Rule is more *revolutionary*; it challenges entrenched norms rather than codifying them.

  ### V. Explaining National Divergence (Germany, US, China)

  The mirror rule acts as a diagnostic metric for these regimes rather than a causal explanation, but it predicts their trajectories:

  *   **Germany:** The German Constitutional Court's "Right to Informational Self-Determination" aligns closely with the mirror rule. It predicts a regime where state data collection is high-friction and subject to strict proportionality (a form of symmetry). The divergence here is explained by a constitutional commitment to human dignity which implicitly rejects asymmetrical knowledge.
  *   **United States:** The US regime is sectoral and market-dominant. The mirror rule predicts this fragmentation. Citizens have high transparency rights regarding private corporations (sometimes) but low reciprocity regarding the state (national security letters, classified surveillance). The US arrangement is a "broken mirror," predicting continued conflict between privacy advocates and security agencies.
  *   **China:** The Social Credit System represents the *negation* of the mirror rule. The state maximizes data collection; citizen access to state data is minimized. The mirror rule predicts this arrangement is inherently unstable or requires high coercion to maintain, as it relies on pure asymmetry. It explains the divergence as a choice of *political ontology*: the Chinese state views the citizen as an object of management, not a reciprocal agent.

  ### VI. Insulation Against Disconfirmation

  **Has the position insulated itself against disconfirmation by qualification?**

  There is a significant risk of **theoretical vacuity via qualification**.
  *   **The Risk:** If the defender accepts the "Sovereignty Exception" (National Security), the "Administrative Exception" (Emergency), and the "Aggregate Exception" (Statistics), the set of data categories subject to the mirror rule shrinks to trivialities (e.g., public library records).
  *   **Disconfirmation Test:** The position is falsifiable if a proponent cannot identify a *significant* category of current state data collection that would be prohibited by the rule.
      *   *Example:* If the defender admits that tax collection is exempt because citizens can't audit the treasury in real-time, and health data is exempt due to privacy of others, and security is exempt due to sovereignty, the rule has no bite.
  *   **Verdict:** To avoid insulation, the defender must insist on **functional reciprocity** even in hard cases. For example, if the state collects tax data, the citizen doesn't need to see *other* citizens' taxes, but must have full access to the *code and logic* processing their own. If the defender retreats from this to allow "black box" algorithms for efficiency, the mirror rule dissolves into standard transparency.

  ### Summary Assessment

  The **Mirror Rule** is a more robust liberty-protecting mechanism than **Default-Opacity**, as it attacks the power asymmetry at the root rather than managing the flow of data. It successfully addresses the charge that opacity burdens the weak, provided it is not qualified into irrelevance by security exceptions.

  However, it faces a **fatal conceptual hurdle** in the non-fungibility of state and citizen roles (the Category Mismatch). While a defender can argue for functional equivalence, the state's unique role as sovereign makes true symmetry impossible. Consequently, the Mirror Rule functions best not as a literal policy prescription, but as a **heuristic for scrutiny**: wherever the mirror is broken, the burden of justification must shift overwhelmingly to the state. It predicts that regimes tolerating high asymmetry (China, US security apparatus) will trend toward authoritarianism or distrust, while regimes attempting symmetry (Germany, Nordic models) will struggle with efficiency but maintain higher legitimacy.

  To remain falsifiable, the proponent must identify at least one major, non-security data collection practice currently in force that the Mirror Rule would abolish. If they cannot, the view is merely a rhetorical restatement of "more transparency."
