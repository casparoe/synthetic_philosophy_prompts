  8.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't just say "Simon says X." I need to explain *why* the character's usage is a distortion.
      *   *Correction:* Ensure the "wobble" is distinct and clearly marked.
      *   *Correction:* The user asked me to tell them if their belief is wrong. I need to be explicit: "Yes, you are confused here."

      *(Self-Correction on Confidence)*: I need to be careful not to sound *too* confident on philosophical matters where consensus doesn't exist. I will mark the cognitive science parts as high confidence and the metaphysical parts as lower.

      *(Refining the "Wobble")*: The wobble should be about the normative force of rationality. Is it *irrational* to optimize if you can't? Or is it just impossible? Simon says impossible. Some economists say you approximate. I'll flag the "fact of the matter" regarding value as the wobble.

