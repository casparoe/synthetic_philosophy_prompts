answer: |-
  The kerosene lamp smoked on the pine table, casting long, wavering shadows against the log walls of the communal kitchen. Outside, the October rain hammered the tin roof, a steady rhythm that usually soothe the New Dawn collective into silence. Tonight, the silence was different. It was the heavy, suffocating kind that comes when words refuse to bridge the gap between people.

  There were six of them around the table. Morrie, the de facto coordinator, sat with his hands clasped over a notebook. Across from him sat Jen, her arms crossed tight against her chest. Between them sat Paul, looking at his hands. Paul had taken the commune's only truck to town two days ago. He had brought back antibiotics for the baby, but he had also brought back cigarettes and a bottle of whiskey.

  The Rule of Direct Speech was the first thing everyone signed upon joining. It was born of a sincere desire to purge hypocrisy. No one was allowed to say "It is wrong" or "You ought." Those phrases implied objective facts outside the self, a kind of moral tyranny the group had fled to the woods to escape. Instead, members were to express their own attitudes directly. You could say "I feel sick when you lie." You could say "Boo to stealing!" You could cheer. But you could not assert a moral proposition as if it were a fact about the world.

  "Paul took the truck without consensus," Morrie said, his voice low. He looked around the circle. "How do we feel about the truck?"

  "Boo!" said Sarah, sharp and immediate. She was nursing the baby, the antibiotics already working their magic, but the principle gnawed at her. "Boo taking shared property!"

  "Boo," echoed David, rubbing his temples.

  Morrie looked at Jen. "Jen?"

  Jen uncrossed her arms. She looked at Paul, then at Morrie. "I don't boo," she said.

  The room tightened. Under the Rule, not booing was ambiguous. It could mean she cheered the action. It could mean she was indifferent. In the early days, that distinction hadn't mattered. If you didn't cheer the garden, you didn't weed it. If you didn't boo the noise, you slept through it. But this was discipline. This was about shunning.

  "If you don't boo," Morrie said, leaning forward, "then you must hooray. Or you stand with him."

  "No," Jen said. "I mean... it is not wrong."

  The words hung in the air, illegal contraband. *Wrong.* A forbidden noun. A forbidden adjective.

  Morrie tapped his pen on the notebook. "You know we can't use that word, Jen. It pretends there's a law outside us. There is only us. There is only the boo."

  "I'm trying to say," Jen said, her voice rising, "that if we don't boo, then we can't shun. It's not about what I feel. It's about what follows."

  "What follows is what we decide," Morrie countered. "If the group boos, we shun. If the group hoos, we celebrate. You are saying you don't boo. But David and Sarah and I do. The majority boos. So we shun."

  "But that doesn't make sense!" Jen slammed her hand on the table. The lamp flickered. "If I say 'It is not wrong,' I mean he is *permitted*. I don't mean I cheer. I mean you *cannot* punish him."

  Morrie blinked. "Why? If I feel sick about the truck, why can't I withhold food? That is my feeling. My boo."

  "Because!" Jen searched for the structure, the logic that held the world together, but she had no words for it. The Rule had stripped them of the connective tissue. She couldn't say, "If it is not wrong, then punishment is unjust." She couldn't say, "Not wrong implies permissible." She could only report her own internal state.

  "I don't boo," Jen repeated, helpless. "But I also say... not boo."

  "That's just silence," David said quietly. "You're offering silence against our boo. The boo is louder."

  "It's not about volume!" Jen stood up. She paced the small kitchen, the floorboards creaking. "Look. Suppose I said, 'If taking the truck is not wrong, then Paul keeps his rations.' You all agree to that?"

  Morrie frowned. "I agree that if you don't boo, you won't withhold rations. But I boo. So I will withhold."

  "No," Jen said. "I mean *if*... Suppose we found out Paul's mother was dying. Suppose we agreed that *if* it was an emergency, it is not wrong."

  "We would just say 'Hooray emergency!'" Sarah offered, trying to help, but her face showed the strain. She knew it didn't fit.

  "But I need to say *not wrong*," Jen insisted. "I need to say that the boo is inappropriate. Not that I don't feel it. But that it... doesn't fit."

  Morrie closed his notebook. "You're trying to make your feeling into a rule, Jen. You want to say 'Not Wrong' like it's a shield. But it's just you not booing. I'm still booing. My boo is real. Your 'not wrong' is just... nothing. It's empty space."

  Jen looked at Paul. He looked small, defeated not by the shunning, but by the inability to be defended. To defend him, she needed to assert a negation that carried weight. She needed to say "It is false that Paul did wrong." But under the Rule, there was no truth to falsify. There was only the clash of attitudes. Her lack of booing collided with their booing, and there was no logic to resolve the crash, only force.

  "If I say 'I accept the norm that emergencies permit truck use,'" Jen tried, grasping for a new phrasing, "does that bind you?"

  "No," Morrie said. "Because I don't accept that norm. I only have my feeling. And right now, I feel boo."

  "So we're just animals," Jen said, her voice dropping. "Growling at what we don't like."

  "We're honest animals," Morrie said, though he didn't open the notebook again. "We don't pretend our growls are laws."

  Jen sat back down. The rain continued to hammer the roof. She looked at the space between her hands on the table. She wanted to say, "It is not wrong to want logic." She wanted to say, "If we cannot say 'not wrong,' we cannot live together." But those were assertions. They claimed a standard outside the circle. And so she sat in the silence, holding a negation that had no home, watching the group prepare to punish a man they could not logically condemn, only dislike.

  ***

  The hole is best patched by Gibbard's norm-acceptance view, which treats moral judgments as accepting norms for planning rather than merely expressing feelings, allowing for logical consistency in embedding. The cost is that the theory ceases to be purely non-cognitive, as accepting a norm functions suspiciously like believing a proposition is true. The commune could have sidestepped the mess by adopting a constitutive rule system from the start, acknowledging that governance requires propositional content rather than purely expressive consensus.
