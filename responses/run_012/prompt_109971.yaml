answer: |-
  This is a classic historiographical conflict playing out in a microcosm. You are witnessing the collision of **archival history** (Ruth's domain: what can be proven by documents) and **collective memory** (Cal's domain: what binds the community together). Neither is entirely wrong, but both are overstating their case to win the argument.

  Here is the adjudication move-by-move, followed by what they are missing, and finally, the hard truth about whether this can be solved philosophically.

  ### The Scorecard: Move-by-Move Adjudication

  **Move 1 (Ruth): The exhibit must be corrected; the story is a lie.**
  *   **Verdict:** **Ethically Right, Evidentially Premature.**
  *   **Why:** Ruth is correct that a historical society has a duty to accuracy, especially when the inaccuracy distorts economic reality (foreclosure vs. gift). However, she treats the grad student's folder as definitive truth. A 1934 transcript of a missing deed is *evidence*, not a verdict. She is right about the obligation to correct, but wrong to assume the correction is simple.

  **Move 2 (Cal): Memory is 150 years of testimony; documents are also biased testimony.**
  *   **Verdict:** **Epistemologically Right, Practically Dangerous.**
  *   **Why:** Cal is absolutely correct that documents are not objective truth; they are artifacts created by people with agendas (lawyers, clerks, tax collectors). Collective memory *is* a form of data about how a town sees itself. However, using this to dismiss physical records is a slippery slope. If "150 years of saying it" outweighs "a deed record," you cannot run a historical society; you run a folklore preservation club.

  **Move 3 (Ruth): Memory drifts toward the flattering version; ugly truths aren't invented.**
  *   **Verdict:** **Sociologically Right.**
  *   **Why:** This is the strongest point Ruth makes. Founding myths almost universally sanitize conflict. It is highly improbable that a town would spontaneously invent a story about a tax foreclosure because it makes them feel good. The direction of the drift (foreclosure $\rightarrow$ gift) is the most telling piece of evidence here.

  **Move 4 (Cal): Memory creates the "we"; a tax sale isn't an identity.**
  *   **Verdict:** **Anthropologically Right, Morally Evasive.**
  *   **Why:** Cal correctly identifies that history and memory do different jobs. History seeks accuracy; memory seeks cohesion. A tax sale is a transaction; a gift is a relationship. However, implying that the town's identity *requires* a falsehood to survive is an admission of fragility. It suggests the town cannot love itself if it knows the truth.

  **Move 5 (Ruth): The harm is real (land claim); identity shouldn't rest on a sentence.**
  *   **Verdict:** **Legally Right, Socially Optimistic.**
  *   **Why:** This is Ruth's trump card. This isn't just about feelings; a descendant is leveraging the town's myth for a legal claim. Maintaining a known falsehood now creates liability. Her point that the "we" should survive a plaque correction is idealistic but correct: if the town's cohesion breaks because a plaque was updated, the cohesion was performative, not real.

  **Move 6 (Cal): Correction accuses grandparents of being fools/crooks; the record has a grudge.**
  *   **Verdict:** **Politically Right, Evidentially Sharp.**
  *   **Why:** Cal lands a hit on the evidence quality. The 1934 transcript was made by a man with a feud. That *does* introduce reasonable doubt. He is also right that a public correction feels like an indictment of the ancestors, which will trigger defensiveness. He is protecting the town from a potential overcorrection based on shaky grounds.

  ---

  ### What They Are Missing

  **Ruth is missing the function of the myth.**
  She treats the founding story as a failed history lesson. It wasn't a lesson; it was a covenant. For 150 years, that story told residents, "We are the kind of people who are treated well by our betters, and our betters are generous." Correcting it doesn't just change a date; it changes the town's self-conception from "benevolent recipients" to "opportunistic buyers." She assumes the town can absorb this shock without cynicism. She also overlooks the **1879 Church Donation**. That is the bridge. The Hallorans *were* generous, just not about *that* land. She is throwing out the baby (Halloran generosity) with the bathwater (the 1871 deed).

  **Cal is missing the liability of the myth.**
  He treats the land claim as a secondary issue to the "story," but in a historical society, legal reality trumps narrative comfort. If the town continues to officially endorse the "gift" narrative while knowing evidence exists to the contrary, they are acting in bad faith. This exposes the town to legal risk and reputational damage far greater than a plaque update. He is also missing that **memory is editable.** Towns survive civil wars, scandals, and economic collapses. A town cannot truly have a "we" if that "we" is based on a secret the board knows is false.

  ---

  ### The Honest Read: Principled Decision or Values Clash?

  Here is the hard truth: **This is a values question wearing a philosophy costume, but there is a procedural way out.**

  You cannot adjudicate this purely on "Truth vs. Memory" because both sides are right about the nature of those things. Ruth is right that truth matters; Cal is right that memory matters. If you vote on who is *philosophically* correct, you will deadlock forever.

  However, there is a **principled way to decide** based on the mission of a Historical Society.

  **The Mission Standard:**
  A Historical Society's job is not to preserve *comfort*; it is to preserve *complexity*.
  *   If you keep the plaque as is, you are **lying by omission**.
  *   If you swap the plaque to say "It was a tax sale," you are **replacing one dogma with another** based on a transcript from a feuding historian.

  **The Solution:**
  The principled move is to **exhibit the dispute, not the conclusion.**

  You do not choose between Ruth and Cal. You validate both. The new plaque/text should not say "The Hallorans Gave This Land" (Ruth says false) nor "The Hallorans Lost This Land at Tax Sale" (Cal says unproven).

  It should say:
  > *"For generations, this town held that the Halloran family gifted this land in 1871, a story reflecting the family's known generosity (including an 1879 church donation). Recent research suggests the transfer may have occurred via tax sale following financial hardship. Historical records from this period are conflicting. This site remains a testament to the Halloran name and the town's complex origins."*

  **Why this works:**
  1.  **It satisfies Ruth:** It acknowledges the evidence and removes the definitive claim of a "gift." It neutralizes the legal claim because the town is no longer officially testifying that it was a gift.
  2.  **It satisfies Cal:** It honors the 150 years of memory as a valid historical artifact in itself. It acknowledges the Halloran generosity (the church deed) so the family isn't painted as victims of a grab.
  3.  **It satisfies the Board:** It turns the fight into the exhibit. The "fight" you are having right now *is* the history.

  **Recommendation to the Board:**
  Tell them that as the minute-taker, you've noticed the board is doing the work of historians: weighing conflicting testimony. Suggest that the exhibit reflect that weight. If the evidence were ironclad, Ruth would have won easily. If the memory weren't so deep, Cal would have won easily. The fact that it is a struggle means the **uncertainty is the most honest thing you can display.**

  Don't vote on who is right. Vote on how to display the question. That is the only way to keep the "we" intact without telling a lie.
