  **MINISTRY OF HEALTH AND CIVIC CONTINUITY**
  **Office of Posthumous Affairs (OPA)**
  **Public Guidance Bulletin 88-B: Determinations of Status and Harm**
  **Revision:** 4.2 (Non-Existence Clause)
  **Slogan:** *Existence Ends, Liability Ends.*

  **PURPOSE**
  This bulletin establishes the administrative standards for evaluating claims of harm involving deceased persons. Pursuant to the Administrative Finality Act, the Office of Posthumous Affairs operates under the settled doctrine that biological cessation terminates the legal and ontological subject. Consequently, no harm can be sustained by an entity that does not exist. Caseworkers and citizens are advised to review the following determinations before filing petitions regarding mortality, estate integrity, or post-mortem status.

  **1. Is death considered a compensable injury to the deceased?**
  No. A claim of harm requires a subject capable of experiencing loss. Upon biological cessation, the subject ceases to exist. Since what does not exist cannot possess interests, property, or sensations, no harm is incurred by the deceased. Claims asserting that the deceased has been "wronged" by the loss of future experiences are administratively invalid. The Office does not recognize the deprivation of potential future goods as a harm to the non-existent.

  **2. At what time does the harm of death occur?**
  No harm occurs; therefore, no timestamp applies. Applicants often inquire whether the injury precedes cessation or follows it. Regarding the former: prior to cessation, the individual is alive and the condition of death has not obtained. Regarding the latter: subsequent to cessation, no individual remains to bear the condition. As the harm cannot be located prior to the event nor after the event, the Office determines that no harm event exists within the timeline. Claims lacking a temporal coordinate for injury are dismissed.

  **3. Why is the period after death treated differently from the period before birth?**
  It is not. The Office maintains strict symmetry regarding non-existence. Citizens do not file claims for harm suffered during the century preceding their biological initiation, as no subject existed to suffer. The period following cessation is identical in status to the period preceding initiation. To lament one state of non-existence while accepting the other is inconsistent with administrative doctrine. Grief regarding pre-natal non-existence is not recognized as grounds for compensation, and neither is grief regarding post-mortem non-existence.

  **4. Can a claim be filed for damage to a deceased person's reputation or broken promises?**
  Claims regarding reputation or unfulfilled contracts are processed as harms to the living, not the dead. Defamation statutes protect social standing, which is a function of community perception among existing persons. If a deceased person's reputation is damaged, the injury is sustained by surviving associates who hold the memory. Similarly, promises made to the dying are obligations owed to the living memory of the deceased. The deceased cannot be disappointed by a broken promise, as disappointment requires a conscious subject. Filings must list surviving mourners as the injured parties.

  **5. If death is not a harm to the deceased, what is a wrongful-death action?**
  Wrongful-death litigation compensates surviving dependents for their own financial and emotional deprivation, not the deceased's loss of life. The deceased is not a party to the suit. The Office acknowledges this distinction often causes confusion among plaintiffs who believe the suit vindicates the victim. It does not. It vindicates the survivors' loss of support and companionship. The victim remains unaffected by the verdict. Caseworkers should clarify that the settlement restores the survivors' equilibrium, not the deceased's status.

  **6. Can grief be submitted as evidence of the deceased's suffering?**
  No. Grief is a physiological and psychological state experienced exclusively by the living. The intensity of survivor mourning does not correlate to the status of the deceased. A large funeral does not indicate a harmed deceased; it indicates a populated network of survivors. The Office advises citizens that while grief is a valid personal experience, it is not diagnostic of post-mortem condition. The deceased registers no loss, regardless of the volume of tears shed by the existing.

  **CONTACT**
  For further clarification, submit Form 99-Null to the Office of Posthumous Affairs. Note: Mail sent to deceased persons will be returned to sender unopened. Do not attempt to serve notice to non-existent entities.

  **MINISTRY OF HEALTH AND CIVIC CONTINUITY**
  *Existence Ends, Liability Ends.*
