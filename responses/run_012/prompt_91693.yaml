      *   *Strawsonian Nuance:* Strawsonians usually care about the *current* possibility of meaningful relationship. If the guy *now* cannot understand resentment, does holding him responsible make sense *now*? However, many neo-Strawsonians (like R. Jay Wallace or Gary Watson) incorporate tracing for culpable loss of capacity.
