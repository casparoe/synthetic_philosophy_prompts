      *   *However,* the prompt says she's "basically a Strawsonian... though she'd deny it." Pure Strawsonians sometimes struggle with tracing because the *current* reactive attitude (resentment) seems inappropriate if the person *now* cannot understand it. But modified Strawsonians (like those focusing on *attributability*) would say the act is attributable to him because it flows from his earlier will.
      *   *Re-evaluating the "Natural Psychopath" verdict:* She says he's not responsible because he "isn't in the conversation." If the Self-Induced guy *also* isn't in the conversation *now*, Rule A says exempt. But Rule B says he *put himself* out.
