      *   *Paragraph 2:* Address the torturer directly. Yes, he has no reason to stop. But that doesn't mean he's off the hook. *We* have reasons to stop him. The discomfort you feel is moral outrage, not a metaphysical insight into external reasons. You're conflating "he ought to stop" (moral judgment) with "he has a reason to stop" (claim about his motivational economy).

