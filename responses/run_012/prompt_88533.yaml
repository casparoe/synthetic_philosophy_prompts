      "You're conflating the truth conditions of reason statements with the pragmatics of moral persuasion. When I say the torturer has no reason to stop, I am not offering a tip on how to manage him; I am making a claim about the architecture of agency. If a 'reason' is supposed to be something that can explain or justify an action *to the agent*, then a fact that cannot connect to his motivational set even via sound deliberation is not a reason for him—it's just a fact. You feel you are denying something true when you tell him he has a reason to stop, but I suspect you are actually expressing a moral demand, not stating a relation between him and a norm. The discomfort you feel is the friction of realizing that morality sometimes runs out of purchase on a soul, not evidence of a ghostly external reason."

