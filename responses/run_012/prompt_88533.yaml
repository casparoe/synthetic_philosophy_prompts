      *   *Clarify the claim:* I'm not saying he shouldn't stop. I'm saying what it *means* to say he has a reason. If reasons are meant to guide action, they must hook onto agency.
      *   *Address the "Advice" Point:* The user suggests the constraint is only on *advice*. I need to push back. It's not just about expediency; it's about the truth conditions of reason statements. If nothing in his SMS could lead to stopping, telling him he has a reason is false, not just inefficient.
