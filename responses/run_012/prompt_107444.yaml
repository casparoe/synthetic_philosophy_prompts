  3. This comparison turns on a value judgment regarding whether scientific simplicity should outweigh the literal interpretation of witness accounts when empirical data remains inconclusive.
  4. For the survival strategy to win, the veridical information conveyed would have to be demonstrably inaccessible to any living mind, thereby negating the possibility of telepathy.
  5. Consequently, he insisted that extraordinary claims require evidence strong enough to override the default preference for simpler naturalistic explanations.
