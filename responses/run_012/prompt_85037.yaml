  Threshold

  She leaves the bug beside the threshold line.
  It lies unmoving in the empty space.
  She goes inside to look for some clear sign.
  A finger shifts the body from its place.
  She leaves the bug beside the threshold line.
  She drags it back across the same old trace.
  The wind blows soft across her striped face.
  She goes inside to look for some clear sign.
  No memory holds the pattern of this case.
  The sun beats down upon the nesting base.
  She leaves the bug beside the threshold line.
  The path is worn into a tight embrace.
  It rests again within the waiting space.
  She goes inside to look for some clear sign.
  She moves without a change of step or pace.
  The shadow shifts across her striped face.
  She leaves the bug beyond the threshold line.
  The grass grows up to fill the empty place.
  She goes inside to look for some clear sign.

  And I who watch have written this before,
  My pen poised over paper like a hand
  That moves the cricket back to where it was.
  I tell myself I choose to stop the test,
  But I have set the trap and will again,
  Tracing the circle round the living thing
  To see if either of us breaks the line.
