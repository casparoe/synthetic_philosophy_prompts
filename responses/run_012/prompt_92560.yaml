answer: |-
  The confusion you encountered stems from the fact that "The Kelly Criterion is optimal" is not a single proposition. It is a slogan that conflates a mathematical definition, an asymptotic theorem, a specific utility function, and a set of practical heuristics. When proponents invoke it, they often slide between these meanings without notice.

  Below is a menu of the distinct theses that the slogan might be asserting, ordered from the purely mathematical to the normative and the false. For each, I specify its status, its assumptions, and how it applies to your two cases:
  *   **Case 1 (The Single Shot):** A one-off opportunity, positive EV, high risk of total loss, requires staking a large share of savings.
  *   **Case 2 (The Repeatable):** A favourable, repeatable gamble where the agent is staking less than full Kelly.

  ---

  ### 1. The Definitional Thesis
  **Thesis:** The Kelly fraction is the stake size that maximizes the expected value of the logarithm of wealth ($E[\log W]$).
  *   **Status:** **Definition / Trivial Truth.**
  *   **Assumptions:** None. This is simply what the Kelly Criterion *is*.
  *   **Verdict:** This adds no normative weight. To say "Kelly is optimal" here is merely to say "Kelly maximizes expected log wealth." It does not prove you *should* maximize expected log wealth.
  *   **Application to Case 1:** Irrelevant unless you already accept Log Utility. If you do, you calculate the fraction. If the deal requires more than that fraction and is indivisible, you decline.
  *   **Application to Case 2:** If you accept Log Utility, betting less than Kelly sub-optimizes your objective function.
  *   **Theorem or Value?** **Definition.** The value judgment lies in choosing $\log W$ as the objective function.

  ### 2. The Asymptotic Growth Theorem
  **Thesis:** In the limit of an infinite sequence of independent, identical bets with reinvestment, the Kelly strategy yields the highest almost-sure exponential growth rate of wealth.
  *   **Status:** **Theorem.** (Breiman 1961; Algoet & Cover 1988).
  *   **Assumptions:** Infinite horizon; i.i.d. (independent and identically distributed) trials; proportional betting (you can bet any fraction); known probabilities; reinvestment of all proceeds.
  *   **Verdict:** This is the strongest mathematical claim. It proves that over a very long run, your wealth will almost surely be higher with Kelly than with any other strategy (including betting everything or betting fixed amounts).
  *   **Application to Case 1:** **Does not apply.** The theorem requires an infinite sequence. It offers no guidance for a single, non-repeatable bet. Using it here is a category error.
  *   **Application to Case 2:** **Supports the aggressive reading,** but only if the horizon is truly long and the trials are truly identical. It implies that over a lifetime of such gambles, Full Kelly produces the most money.
  *   **Theorem or Value?** **Theorem.** However, applying it to finite human lives requires the value judgment that "long-run growth rate" is the correct metric for decision-making today.

  ### 3. The Dominance Thesis
  **Thesis:** The Kelly strategy will eventually outperform any other essentially different strategy with probability 1.
  *   **Status:** **Theorem (with caveats).**
  *   **Assumptions:** Same as above (Infinite horizon, i.i.d., proportional betting).
  *   **Verdict:** Mathematically sound, but "eventually" is doing heavy lifting. In the short to medium term, Kelly strategies have high variance and can underperform conservative strategies significantly.
  *   **Application to Case 1:** **Does not apply.** There is no "eventually" in a single trial.
  *   **Application to Case 2:** **Supports the aggressive reading,** but ignores "risk of ruin" in the practical sense. While you won't mathematically hit zero (since Kelly never bets 100% on a binary bet with $p<1$), you may drop to 1% of your peak, which is functionally ruinous for a human agent.
  *   **Theorem or Value?** **Theorem.** The value judgment is accepting the high volatility and potential drawdowns required to achieve this dominance.

  ### 4. The Log-Utility Commitment
  **Thesis:** A rational agent *ought* to maximize expected log wealth because log wealth corresponds to the true utility of money.
  *   **Status:** **Decision-Theoretic Commitment (Value Judgment).**
  *   **Assumptions:** Acceptance of Bernoulli's resolution to the St. Petersburg Paradox; or acceptance of "Ergodicity Economics" (that time-averages equal ensemble-averages only under log transformation).
  *   **Verdict:** This is where "optimal" gains normative force. It claims that $E[\log W]$ is not just a mathematical proxy for growth, but the correct measure of human welfare.
  *   **Application to Case 1:** **Supports the cautious reading.** If you have log utility, the disutility of losing a large share of savings outweighs the utility of the gain, even if EV is positive. You decline if the bet size exceeds your Kelly fraction and cannot be scaled down.
  *   **Application to Case 2:** **Supports the aggressive reading.** If log utility is your goal, betting less than Kelly is literally leaving utility on the table.
  *   **Theorem or Value?** **Value Judgment.** There is no proof that humans *should* have log utility. Risk-neutral agents (linear utility) should maximize EV; risk-averse agents (higher power utility) should bet less than Kelly.

  ### 5. The "Rationality is Geometric" Slogan
  **Thesis:** Rational choice should maximize the geometric mean (compound growth) rather than the arithmetic mean (expected value) because wealth compounds over time.
  *   **Status:** **Mixed (Fact + Norm).**
  *   **Assumptions:** Wealth is reinvested; the agent cares about long-term solvency.
  *   **Verdict:**
      *   *Arithmetical Claim:* It is a fact that compounding returns are governed by the geometric mean, not the arithmetic mean. (Fact).
      *   *Choice Claim:* It is a judgment that agents *should* care about the geometric mean. (Value).
      *   *Ergodicity Argument:* Ole Peters argues that maximizing the time-average growth rate (geometric) is the only way to resolve paradoxes in non-ergodic systems. This attempts to derive the value judgment from physics/math, but it remains contested in standard economics.
  *   **Application to Case 1:** **Weak.** Without repetition, the geometric mean collapses to the single outcome. The slogan relies on the "compounding over time" premise, which is absent in a one-off bet.
  *   **Application to Case 2:** **Strong.** This is the natural home of the slogan. It argues that maximizing EV (arithmetic) leads to ruin in repeated games, while maximizing geometric growth (Kelly) ensures survival and growth.
  *   **Theorem or Value?** The link between compounding and geometric mean is **Math**. The claim that rationality *requires* this focus is **Value**.

  ### 6. The Robustness Heuristic
  **Thesis:** Kelly staking is a robust rule of thumb even when probabilities are unknown, edges change, or trials are not identical.
  *   **Status:** **Heuristic (often False in strong form).**
  *   **Assumptions:** None (which is the problem).
  *   **Verdict:** In the real world, edges are estimated, not known. Full Kelly is extremely sensitive to overestimation of edge. If you overestimate your edge by 2x, Full Kelly becomes equivalent to betting double-Kelly, which drastically increases ruin risk and reduces growth.
  *   **Application to Case 1:** **Dangerous.** Applying Kelly heuristics to a single, unique deal with unknown probabilities is speculative.
  *   **Application to Case 2:** **Nuanced.** Most professional gamblers and investors use **Fractional Kelly** (e.g., Half-Kelly). This acknowledges that the "Theorem" assumptions (known probabilities) are violated. The claim that "anything less than Full Kelly is irrational" is false under this reading.
  *   **Theorem or Value?** **Heuristic.** It is a practical adaptation, not a theorem.

  ### 7. The "No Ruin" Claim
  **Thesis:** Using the Kelly Criterion guarantees you will never go broke.
  *   **Status:** **False.**
  *   **Assumptions:** N/A.
  *   **Verdict:**
      *   *Mathematically:* In a continuous model with continuous betting, Kelly never bets 100%, so wealth never hits exactly zero.
      *   *Practically:* In discrete betting (your Case 1 "lose the whole stake"), if the Kelly fraction suggests 40% but the minimum bet is 100%, you face ruin. Also, if probabilities are misestimated, "Kelly" bets can be ruinous. Furthermore, dropping to 0.01% of initial bankroll is effectively ruin for a human, even if mathematically non-zero.
  *   **Application to Case 1:** **False.** You can absolutely be ruined on a single bet if the bet size is indivisible and exceeds your bankroll tolerance.
  *   **Application to Case 2:** **False.** Model error or a long negative streak can reduce bankroll to functionally zero.
  *   **Theorem or Value?** **False.**

  ### 8. The "Full Kelly is Mandatory" Thesis
  **Thesis:** Any agent betting less than the full Kelly fraction on a positive EV, repeatable gamble is behaving irrationally.
  *   **Status:** **False / Value Judgment.**
  *   **Assumptions:** Ignores estimation error, ignores utility of consumption during the process, ignores finite horizons.
  *   **Verdict:** This is the aggressive claim you encountered. It assumes the only goal is terminal wealth at $t=\infty$. It ignores that humans have finite lives, need to withdraw money for consumption, and suffer psychological distress from drawdowns. Half-Kelly yields 75% of the growth rate with 50% of the volatility. For most humans, that trade-off is rational.
  *   **Application to Case 1:** **N/A.** (Applies to repeatable gambles).
  *   **Application to Case 2:** **False.** It is rational to bet less than Kelly if you have a finite horizon or uncertainty about the edge.
  *   **Theorem or Value?** **Value Judgment** (disguised as theorem). It prioritizes terminal wealth over path stability.

  ---

  ### Summary of the "Optimal" Ambiguity

  The phrase "Kelly is optimal" shifts meaning depending on which thesis is being invoked:

  1.  **Optimal at maximizing $E[\log W]$:** (Thesis 1). **True by definition.** But this begs the question: why log?
  2.  **Optimal at maximizing long-run growth:** (Thesis 2). **Theorem.** But requires infinite repetition and known probabilities.
  3.  **Optimal for rational agents:** (Thesis 4 & 8). **Value Judgment.** Requires accepting Log Utility or Ergodicity Economics as the normative standard for rationality.

  ### Where the Line Stops Being a Theorem

  *   **The Theorem Zone:** If you have an infinite sequence of i.i.d. bets with known probabilities, and your goal is to maximize the asymptotic rate of wealth growth, Kelly is the unique solution. This is math.
  *   **The Value Judgment Zone:** The moment you apply this to a **finite** horizon, a **single** bet, **uncertain** probabilities, or a human with **consumption needs**, you are no longer doing math. You are asserting that the *properties* of the infinite-horizon theorem (growth rate) are the correct proxy for *value* in your specific, constrained situation.

  ### Analysis of Your Two Cases

  **Case 1: The Single, High-Stakes Deal**
  *   **The Causal Argument:** "Decline the bet because it exceeds Kelly."
  *   **Required Reading:** This relies on **Thesis 4 (Log-Utility Commitment)**. It treats the single bet as if it were part of a lifetime sequence of wealth management (a "repeated game" against the market).
  *   **Verdict:** Without the assumption that you face a long sequence of similar investment decisions (where preserving capital is crucial for future compounding), this advice has no theoretical footing. A risk-neutral agent with a single shot should take any positive EV bet. The advice is valid *only if* you accept that your utility function is logarithmic regarding wealth.

  **Case 2: The Repeatable Gamble**
  *   **The Aggressive Argument:** "Betting less than Full Kelly is irrational."
  *   **Required Reading:** This relies on **Thesis 8 (Full Kelly Mandatory)** and **Thesis 2 (Asymptotic Growth)**.
  *   **Verdict:** This is false in practice. It assumes **known probabilities** and **infinite horizon**. In the real world (unknown edge, finite life), **Thesis 6 (Robustness Heuristic)** dominates: Fractional Kelly is rational to protect against estimation error and volatility. The claim that sub-Kelly betting is "irrational" is a dogmatic over-extension of the asymptotic theorem.

  ### Final Verdict on "Arithmetic vs. Geometric"

  The slogan "Rationality is geometric rather than arithmetic" conflates two distinct claims:
  1.  **Descriptive (True):** Wealth accumulation over time is a multiplicative (geometric) process, not an additive (arithmetic) one. Maximizing Arithmetic EV in a repeated multiplicative game leads to ruin.
  2.  **Normative (Contested):** Therefore, agents *should* maximize the geometric mean.

  The descriptive claim is a mathematical fact about compounding. The normative claim is a value judgment that the agent's goal is long-term capital growth rather than, say, short-term consumption or minimizing the probability of a 20% drawdown.

  **Conclusion:** The Kelly Criterion is a **theorem** about asymptotic growth under idealized conditions. It becomes a **heuristic** when applied to uncertain, finite real-world investing. It becomes a **dogma** when proponents claim it defines rationality for single bets or mandates full staking despite estimation risk. The "cautious" reading of your Case 1 requires assuming the bet is part of a long sequence (or that you have Log Utility). The "aggressive" reading of your Case 2 requires assuming probabilities are known and the horizon is infinite. Both real-world cases violate these assumptions, meaning both interlocutors were extending a theorem into the realm of value judgment.
