answer: |-
  You have identified a precise and pernicious rhetorical structure. While there are terms that describe the *components* of this move, there is no single, canonical term in logic or philosophy of science that names the specific *inversion* you describe: the conversion of a theory's structural immunity into positive evidence for its truth.

  The closest existing terms are **Immunization Strategy**, **The Galileo Gambit**, and **Self-Sealing Argument**. However, as you suspected, each fails to capture the full phenomenon. Below is an analysis of why they fall short, followed by a proposed term to carve out the specific phenomenon you are tracking, and a rigorous boundary test to distinguish it from ordinary scientific resilience.

  ### 1. The Existing Neighbors

  **Immunization Strategy (Hans Albert / Karl Popper)**
  *   **What it is:** In critical rationalism, this describes the act of modifying a theory to protect it from falsification (e.g., adding "except when suppressed" to a prediction).
  *   **Why it falls short:** It names the *defect* (the shielding), not the *claim of virtue*. A theorist can immunize a theory quietly without claiming that the immunity itself is proof. Your phenomenon requires the extra step of citing the survival as corroboration.

  **The Galileo Gambit**
  *   **What it is:** A rhetorical fallacy where a proponent argues that opposition or persecution is evidence that they are right (i.e., "Galileo was persecuted and he was right; I am persecuted, therefore I am right").
  *   **Why it falls short:** It is too specific to *social* resistance. It fits your alternative history example (gatekeepers, suppression) but fails your colleague example. Your colleague is not being persecuted; their project is simply failing. The "immunity" there is explanatory, not social.

  **Self-Sealing Argument**
  *   **What it is:** An argument that is structured so that no possible evidence could count against it.
  *   **Why it falls short:** This names the *logical structure* (unfalsifiability), but like "immunization," it does not inherently include the rhetorical move of claiming that the sealing *proves* the content. A self-sealing argument can be presented as a tautology without claiming empirical truth.

  ### 2. A Coinage: The Immunity Inversion

  Since no existing term captures the *conversion of the defect into a virtue*, I propose the term **The Immunity Inversion**.

  **Definition:**
  The **Immunity Inversion** is a rhetorical and logical move wherein the mechanisms used to protect a theory from falsification (immunization) are reinterpreted as positive evidence for the theory's validity. It is the fallacious inference that a hypothesis's capacity to withstand criticism—specifically via built-in excuses for lack of evidence—constitutes corroboration of its truth.

  **The Logical Form:**
  1.  Theory $T$ predicts Evidence $E$.
  2.  Evidence $E$ is absent.
  3.  $T$ contains a clause $C$ explaining the absence of $E$ (e.g., "evidence was destroyed," "market wasn't ready").
  4.  Therefore, $T$ is confirmed because it successfully accounted for the absence of $E$ via $C$.

  **Why it is distinct:**
  In a normal ad hoc patch, the proponent says, "I must add this clause to save the theory." In the Immunity Inversion, the proponent says, "The fact that this clause *works* to save the theory proves the theory is deep/true." The survival is not treated as a desperate rescue, but as a successful prediction of the resistance.

  ### 3. Boundary Cases: Scientific Resilience vs. Immunity Inversion

  You asked specifically about ordinary scientific resilience, which also refuses to abandon a theory at the first anomaly. This is the crucial boundary. The distinction lies in the **direction of the explanatory power**.

  We can use Imre Lakatos's distinction between **Progressive** and **Degenerating** problem shifts to draw the line.

  **Outside the Category: Scientific Resilience (Progressive Problem Shift)**
  *   **Structure:** A theory encounters an anomaly. Scientists modify the theory to accommodate the anomaly.
  *   **The Crucial Difference:** The modification leads to the prediction of **novel facts** that were not previously anticipated.
  *   **Example:** Newtonian physics encountered anomalies in the orbit of Uranus. Instead of discarding Newton, astronomers posited an unseen planet (Neptune). This was an "immunizing" move (the anomaly isn't Newton's fault, it's a new planet). However, it counted as *resilience* rather than *Immunity Inversion* because the modification predicted *where* to look for Neptune. The theory grew; it didn't just seal.
  *   **Test:** Does the explanation of the failure generate *new* successful predictions? If yes, it is resilience.

  **Inside the Category: The Immunity Inversion (Degenerating Problem Shift)**
  *   **Structure:** A theory encounters an anomaly. The theory is modified to absorb the anomaly.
  *   **The Crucial Difference:** The modification explains the past failure but predicts **nothing new**. It only looks backward. The "survival" is the only output.
  *   **Example (Your Colleague):** The project fails. The explanation is "the market wasn't ready." This absorbs the failure. Does it predict *when* the market will be ready? Does it predict a new strategy that will succeed? If not, and the only "proof" offered is that the explanation "still makes sense" despite the failure, it is an Immunity Inversion.
  *   **Example (Lost Continents):** Artifacts are missing. Explanation: "They are under the sea." Does this predict where under the sea? Does it predict what we *should* find if we look there? If not, and the lack of artifacts is cited as proof of the cataclysm that sank them, it is an Immunity Inversion.

  ### 4. Summary of the Phenomenon

  | Feature | Scientific Resilience | Immunity Inversion |
  | :--- | :--- | :--- |
  | **Response to Anomaly** | Modify theory to save core. | Modify theory to save core. |
  | **Status of Modification** | A temporary bridge to new data. | The final destination (the proof). |
  | **Predictive Power** | **Increases** (predicts novel facts). | **Stagnates** (only explains past failures). |
  | **Claim to Truth** | Based on new successes. | Based on survival of failures. |
  | **Lakatosian Label** | Progressive Problem Shift. | Degenerating Problem Shift. |

  ### Conclusion

  You are observing a **Degenerating Problem Shift** that is being rhetorically packaged as a **Progressive** one via the **Immunity Inversion**.

  While **Immunization** names the shield, and the **Galileo Gambit** names the persecution variant, **The Immunity Inversion** captures the specific logical sleight-of-hand where the *success of the defense* is presented as the *truth of the claim*. It differs from scientific resilience because resilience pays interest on the debt of the anomaly (by predicting new facts), whereas the Immunity Inversion simply refinances the debt indefinitely, citing the ability to borrow as proof of solvency.
