      *   *Marcus's Counter (Case 1 & 2):* That intuition is just internalized system rules. Even intuition is computational.
      *   *Elara's Counter (Case 3 - Analogy):* What about mapping the puzzle to something else? That mapping isn't dictated by the rules.
