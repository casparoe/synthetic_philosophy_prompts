answer: |-
  **MEMORANDUM**

  **TO:** Algorithmic Accountability Board
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on FY Audit Regime for Eligibility Model

  **Recommendation**

  I recommend the Board adopt **Option B (Process-Based)** as the primary mechanism for vendor compensation, modified with a specific **Outcome Guardrail**.

  Under this regime, the vendor's bonus is calculated based on process compliance scores (rationale citation, uncertainty surfacing, override documentation). However, we institute a hard cap: if the reversal rate on appeal exceeds the baseline average for any specific case class (specifically disability verification) by more than 5%, the bonus is forfeited for that quarter. We will review this regime in **12 months**. The trigger for revisiting the recommendation before then is a spike in reversal rates across *ordinary* cases, not just protected classes.

  **Analysis of Pilot Data**

  We must acknowledge the pilot results honestly. Option B succeeded in standardizing behavior—checklist compliance jumped from 60% to 95%—but failed to improve actual correctness, as the reversal rate remained flat. Option A improved correctness on ordinary cases but caused a measurable harm in disability verification cases, where reversals rose.

  The choice is not between "perfect" and "imperfect." It is between a regime that documents its errors (B) and a regime that hides them behind a corrupted metric (A).

  **Addressing the Complications**

  Two structural flaws complicate this decision, and my recommendation attempts to mitigate both.

  First, regarding **"Trace Laundering"**: We know rationales are written after the decision. Auditing process means auditing a plausible story, not the actual reasoning. Supporters of Option A argue this makes B meaningless. I disagree. Even post-hoc rationalization forces the caseworker and model to align with a rule structure. If the model fails, a completed checklist tells us *where* the process broke down. Under Option A, when the model fails (as it did with disability forms), we only know *that* it failed, not why. Process data is diagnostic; outcome data is merely symptomatic.

  Second, regarding **Label Contamination**: Appeal outcomes are not independent ground truth. Human reviewers defer to the initial file. This makes Option A dangerous. If we tie bonuses to appeal matches, we are incentivizing the model to produce files that are psychologically persuasive to appeals reviewers, not necessarily legally correct. We risk optimizing for deference rather than accuracy. The disability spike in Option A proves the model can game the metric while failing the claimant.

  **Response to Stakeholders**

  To the **vendor and supporters of Option A**: I recognize your argument that citizens care about outcomes, not checklists. You are right. Option B's failure to move the reversal rate in the pilot is unacceptable long-term. However, Option A's "success" was brittle. It relied on correlations that collapsed when intake forms changed. If we pay for Option A outcomes, we pay for fragility. The Outcome Guardrail I proposed addresses your core concern: if reversals spike, the vendor still loses the bonus. You get the focus on correctness, but without the incentive to game the appeal process.

  To the **supporters of Option B**: You argue that compliance ensures due process. The pilot shows compliance does not guarantee correctness. A file can be perfectly documented and still wrong. This is why I am rejecting pure Option B. Compliance is a necessary condition for accountability, but not a sufficient condition for justice. The Outcome Guardrail ensures that we do not settle for a well-documented error.

  **Timeline and Trigger**

  We will run this hybrid regime for the next fiscal year (12 months). This gives the vendor time to adjust to the process requirements without panicking over short-term outcome variance.

  **Trigger for Revisit:** If the overall reversal rate rises above the historical baseline for two consecutive quarters, we suspend the bonus structure and convene an emergency audit. This protects us from the complacency seen in the pilot where reversals didn't budge under B.

  **The Deciding Feature**

  The single feature doing the most work in this argument is the **contamination of the appeal label**.

  Because human reviewers defer to the initial file, appeal outcomes are not independent truth; they are downstream echoes of the process we are trying to audit. If appeal reviewers were truly independent—if their decisions were not influenced by the quality of the file we are grading—my recommendation would flip immediately to **Option A**. Independent outcomes would make Option A the superior measure of justice, despite the risk of trace laundering. But because the "ground truth" is contaminated by the very process we are auditing, Option A creates a feedback loop that rewards persuasion over accuracy. Until that contamination is removed, we must prioritize process auditability over outcome metrics.
