      *   *Body Paragraph 1: The Criterion.* Test it. It hinges on "content." If content includes the *conditions of possibility* for thought, physiology is internal. If content is abstract truth claims, physiology is external. Nietzsche argues the former.
      *   *Body Paragraph 2: Verdict.* Specifics (alcohol, climate) = Symptom/Regimen. General thesis (embodiment) = Philosophy.
      *   *Body Paragraph 3: Scientific Standing.* Gut-brain axis validates the link, but Nietzsche's specifics are anecdotal.
      *   *Body Paragraph 4: Self-Reference.* It's not a contradiction; it's a claim about the nature of truth.
