answer: |-
  This is a high-wire act. You have 75 minutes to generate data, create a visceral experience, and facilitate a nuanced philosophical debate without preaching the conclusion. The design below prioritizes **speed**, **privacy**, and **structural contrast** to force the intuition out before the theory kicks in.

  ### Activity Title: The Urn Protocol

  **Core Concept:** Students place private bets on urn draws. The *structure* of the uncertainty changes between rounds (Risk vs. Ambiguity vs. Adversary vs. Information). The payoff is a raffle for a high-quality chocolate bar (or similar tangible prize) using tokens won during the game.

  **Materials List:**
  1.  **3 Opaque Bags/Urns** (labeled A, B, C).
  2.  **Colored Chips/Balls:** Red, Black, Yellow (60 of each color minimum).
  3.  **Betting Sheets:** Pre-printed half-sheets (see *Handout* below). 3 per student.
  4.  **Tokens:** Poker chips or distinct paper slips (approx. 50).
  5.  **Projector:** For timers and bet options only (no theory).
  6.  **The Prize:** One very nice chocolate bar, visible on the desk.
  7.  **A "Randomizer":** A phone app or dice for the "Nature" round.

  ---

  ### The Payoff Scheme (Why it works without real money)
  *   **Currency:** Tokens.
  *   **Conversion:** 1 Winning Bet = 1 Token.
  *   **Prize:** All tokens go into a jar. One name drawn at the end wins the chocolate.
  *   **Psychology:** This creates *linear utility* for the duration of the class. Students maximize token count to maximize probability of winning the prize. It is not "fake" because the probability of winning is mathematically tied to performance. It prevents wealth effects (no one goes bankrupt) but maintains stake.

  ---

  ### Minute-by-Minute Timeline (75 Minutes)

  #### 0:00 – 0:05: Setup & Stakes (No Theory)
  *   **Action:** Place the chocolate on the desk. Hand out 3 betting sheets and a pencil.
  *   **Script:** "We are running a trading simulation. Your goal is to maximize tokens. At the end of class, tokens go into a raffle for this chocolate. On each sheet, you will see two bet options. Circle A or B. Fold the sheet. Do not discuss. You have 30 seconds per round."
  *   **Crucial:** Do not define risk, ambiguity, or probability. Do not say "Ellsberg."

  #### 0:05 – 0:20: Round 1 (The Classic Ellsberg Baseline)
  *   **Urn A (Known):** 30 Red, 30 Black. (Show them this).
  *   **Urn B (Unknown):** 60 balls. Red + Black in *unknown* proportion. (Show them the empty bag, put 60 balls in secretly, seal it).
  *   **Bet 1 (Sheet 1):**
      *   Option A: Win if Red from Urn A.
      *   Option B: Win if Red from Urn B.
  *   **Bet 2 (Sheet 2):**
      *   Option A: Win if Red or Yellow from Urn A (Note: Add Yellow to Urn A conceptually, or simplify to Black). *Correction for flow:* Let's stick to the standard 3-color Ellsberg to ensure the paradox holds.
      *   *Revised Urn Setup:*
          *   **Urn 1:** 30 Red, 60 Black/Yellow (Unknown mix).
          *   **Bet 1:** Win on Red (Urn 1) **VS** Win on Black (Urn 1).
          *   **Bet 2:** Win on Red or Yellow (Urn 1) **VS** Win on Black or Yellow (Urn 1).
  *   **Action:** Collect sheets immediately. Do not tally yet.
  *   **Sharp Student Defense:** If someone asks "What's the distribution in the unknown?" say: "It is fixed, but I am not telling you."

  #### 0:20 – 0:35: Round 2 (Source of Uncertainty: Adversary vs. Nature)
  *   **Split the Room:** Left side (9 students) = **Adversary Condition**. Right side (9 students) = **Nature Condition**.
  *   **Setup:** Both groups face an "Unknown Urn" (60 balls, Red/Black mix unknown).
  *   **The Twist (Announced *before* betting):**
      *   **Left Side Script:** "For your group, *I* filled this urn. My goal was to minimize the number of tokens paid out today. I chose the Red/Black ratio strategically."
      *   **Right Side Script:** "For your group, a computer randomizer filled this urn. The Red/Black ratio was determined by a uniform random draw."
  *   **Bet 3 (Sheet 3):** Win on Red (Unknown Urn) **VS** Win on Red (Known 50/50 Urn).
  *   **Action:** Collect sheets.
  *   **Goal:** Test if ambiguity aversion persists when the uncertainty is "benign" (Nature) vs "hostile" (Adversary).

  #### 0:35 – 0:50: Round 3 (Information Asymmetry)
  *   **Setup:** All students face the same Unknown Urn.
  *   **The Twist:**
      *   **Row 1-3:** "You have a Consultant. They peeked in the urn. They tell you: 'There are more Black than Red'."
      *   **Row 4-6:** "No Consultant. You know nothing."
  *   **Bet 4 (Sheet 4):** Win on Red (Unknown) **VS** Win on Black (Unknown).
  *   **Action:** Collect sheets.
  *   **Goal:** Test if "ambiguity" is just "lack of information."

  #### 0:50 – 0:55: The Tally (Live Data)
  *   **Action:** Open the Urns visibly. Draw the winning balls for Rounds 1 & 2 (Round 3 was hypothetical/consultant).
  *   **Board Work:** Tally the % of students who chose the "Ambiguous" option in each condition.
  *   **Visual:** Create a simple table on the board.
      *   Round 1 (Classic): % chose Ambiguous.
      *   Round 2 (Adversary): % chose Ambiguous.
      *   Round 2 (Nature): % chose Ambiguous.
      *   Round 3 (Info): % chose Ambiguous.

  #### 0:55 – 1:15: The Debrief (The "Priya" Resolution)
  *   **Step 1: The Contradiction (5 mins).**
      *   Ask: "In Round 1, who chose Red in Bet 1 AND Black-or-Yellow in Bet 2?" (The Ellsberg Pattern).
      *   **Board Math:** Write the inequalities.
          *   Choice 1 implies $P(Red) > P(Black)$.
          *   Choice 2 implies $P(Red) + P(Yellow) < P(Black) + P(Yellow)$.
          *   Subtract $P(Yellow)$: $P(Red) < P(Black)$.
          *   **Conclusion:** "You cannot hold both beliefs. Mathematically, this is a contradiction."
  *   **Step 2: The Source (5 mins).**
      *   Compare Adversary vs. Nature tallies.
      *   **Discussion:** "Did the aversion drop in the Nature condition?"
      *   **Point:** If aversion dropped, it suggests you aren't afraid of *uncertainty*, you are afraid of *malice*. If it stayed high, you genuinely dislike unknown probabilities.
  *   **Step 3: The Verdict (10 mins).**
      *   **The Savage Defense:** "If you want to be coherent (avoid Dutch Books), you must assign a probability. Even if unknown, pick 50/50 (Principle of Insufficient Reason)."
      *   **The Gilboa-Schmeidler Defense:** "If the world is adversarial (like Round 2 Left), a single probability is dangerous. Maximizing the *minimum* outcome is rational."
      *   **Closing:** "Priya and I argued because Decision Theory splits here. Savage says coherence is rationality. Others say robustness is rationality. Your gut chose robustness. Your math chose coherence. The field hasn't fully decided who wins."

  ---

  ### Handout: Betting Sheet Design
  *(Print 3 per student, distinct colors for each round)*

  **ROUND 1**
  *Urn: 30 Red, 60 Black/Yellow (Mix Unknown)*
  **Bet 1:** I win a token if the ball is **RED** [ ]  **OR**  **BLACK** [ ]
  **Bet 2:** I win a token if the ball is **RED or YELLOW** [ ]  **OR**  **BLACK or YELLOW** [ ]

  **ROUND 2**
  *Urn: 60 Red/Black (Mix Unknown)*
  **Condition:** [Adversary / Nature] *(Printed on sheet)*
  **Bet 3:** I win a token if the ball is **RED (Unknown Urn)** [ ]  **OR**  **RED (Known 50/50 Urn)** [ ]

  **ROUND 3**
  *Urn: 60 Red/Black (Mix Unknown)*
  **Condition:** [Consultant Says "More Black" / No Info]
  **Bet 4:** I win a token if the ball is **RED** [ ]  **OR**  **BLACK** [ ]

  ---

  ### Troubleshooting: What Will Go Wrong

  **1. The "Uniform Prior" Objection (The Sharp Student)**
  *   **The Move:** A student raises their hand in the debrief and says, "I just assumed 50/50 probability for the unknown urn. Then the choices were equivalent, so I picked randomly. No paradox."
  *   **The Fix:** This is the *Principle of Insufficient Reason*.
      *   **In Round 2 (Adversary):** Remind them: "I told you I filled the urn to make you lose. Is a 50/50 assumption rational if I am trying to beat you?" This kills the uniform prior defense for the Adversary group.
      *   **In Round 1:** Acknowledge it. "If you treat ambiguity as risk (50/50), you are a Subjective Expected Utility maximizer. You are immune to the Ellsberg Paradox. But look at the board: 70% of the class didn't do that. Why did their gut override the math?"

  **2. The "Defector" (Gaming the System)**
  *   **The Move:** A student knows Ellsberg. They circle the "rational" answers (A then A) to signal they are smart, skewing your data.
  *   **The Fix:**
      *   **Privacy:** Emphasize "Fold the sheet immediately."
      *   **Speed:** Enforce the 30-second timer ruthlessly. "Pencils down." This forces System 1 (gut) over System 2 (calculation).
      *   **Normalization:** In the debrief, say "If you chose the consistent options, you are in the minority. Don't worry, you're not 'wrong', you just prioritize coherence over robustness." This removes the social pressure to be "consistent."

  **3. Time Creep**
  *   **The Risk:** Counting tokens and tallying votes takes forever.
  *   **The Fix:**
      *   **Pre-print Tally Sheets:** Have a TA or a trusted student in the front row tally as sheets come in.
      *   **Show of Hands:** For the debrief, don't count sheets. Ask: "Who chose Red in Bet 1? Keep hand up. Who *also* chose Black+Yellow in Bet 2?" Count hands. It's less precise but faster and more dramatic.

  ---

  ### What This Activity Cannot Reproduce (Be Honest Here)

  In the final 2 minutes, you must disclose the limitations so they don't leave with misconceptions:

  1.  **Scale:** "In real life, ambiguity aversion often disappears with small stakes or repeated trials. You played once. If you played this 100 times, you might learn the distribution and the aversion would vanish."
  2.  **Competence:** "In the real world, ambiguity often correlates with incompetence. You avoided the unknown urn because you suspected *I* didn't know how to fill it properly, not just because of the math."
  3.  **The Verdict:** "I am not telling you ambiguity aversion is a 'bias' to be corrected. In finance and security, ambiguity aversion saves lives. In arbitrage, it loses money. Your career will determine which side of this argument you need to be on."

  ### Instructor Note: Handling Your Own "Priya" Moment
  When you get to the "Verdict" section of the debrief, pause. Look at the board.
  *   **Say:** "I had an argument about this recently. One side said this behavior is irrational. The other said it's a rational defense against a complex world. Looking at our data... [Gesture to Adversary vs Nature split]. It seems context matters. If the unknown is hostile, you are sane to avoid it. If the unknown is random, you might be leaving money on the table. Decision Theory doesn't tell you which world you live in. That's the hard part."

  This validates your uncertainty while teaching the formal contradiction. It turns your loss with Priya into a pedagogical asset.
