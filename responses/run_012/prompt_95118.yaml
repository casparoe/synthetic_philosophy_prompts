prompt: |-
  ok so I teach a second-year decision theory seminar (18 students, one 75-min session) and I just lost a two-hour argument with my friend Priya about Ellsberg urns and I'm still not over it. I want my students to actually feel this one in the gut instead of nodding along at a slide. So: design me a runnable in-class activity.

  The thing I care about most is the moment where they catch themselves. The standard version (urn with 30 red, 60 black-or-yellow in unknown proportion, bet red vs bet black, then bet red-or-yellow vs bet black-or-yellow) is fine as a warm-up but everyone's seen it and half of them will just pick the consistent-looking options on purpose once they smell a trick. So I want the structure to be doing more of the work than the reveal.

  Here's roughly what I have in mind, but make it your own and fix it where its broken. Set up enough urns/rounds that nobody can keep track of which one is the safe one. Have them place private bets with tokens (no real money, but make the tokens buy entries into one small real prize at the end, a decent chocolate bar or whatever, so there's a tiny real stake and they cant totally shrug it off). Then tally on the board and show them the pattern. Then the part I actually want: run a round where the composition of the unknown part of the urn was set by an actual adversary, someone in the room or a "house" I tell them wants them to lose, and a matched round where the same kind of urn was filled by a coin toss or some random process. My hunch is the ambiguity aversion mostly survives the adversary round and mostly evaporates in the random round, and if that happens it lets me pull apart two things that usually get smushed together: dislike of not knowing, and suspicion that the unknown was chosen against you. I also want a round where one group gets to peek at the composition (or gets a "consultant" who's seen it) and another doesnt, to see whether it's the knowing-you-dont-know that's doing the work.

  So I need: rules, a materials list, the payoff scheme and why it doesnt need real money, a minute-by-minute timeline for the 75 min, and a debrief that maps each moment of what just happened onto the actual ideas, the sure-thing principle, why those two bets can't both be rational under any single probability for black, and the fight about whether ambiguity aversion is a mistake or a rational response to something real. Then: what will predictably go wrong the first time I run it and how to handle it, and be honest about what the activity can't reproduce and that I'll just have to tell them.

  Two things I'm worried about, handle both in the design. First, as soon as a sharp student sees the pattern they'll either defect to the "rational" choices to look good, or they'll say the unknown composition is just a random variable, slap a uniform prior on it and declare it all ordinary risk. I need the activity to survive that move, not get derailed by it. Second, I don't want the debrief to smuggle in a verdict. Some of my students will walk out thinking the ambiguity-averse chooser is an idiot and some will think they're the only sane one, and honestly I'd rather the thing leave that open while making sure they all know exactly what the disagreement is about.

  no lecture up front. they should be placing bets before I've said the word Ellsberg or ambiguity.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** 2nd-year Decision Theory seminar, 18 students, 75 minutes.
      *   **Goal:** Create a visceral, in-class activity about Ellsberg urns/ambiguity aversion.
      *   **Key Constraint:** No lecture up front. Students must bet before knowing the theory.
      *   **Instructor's Pain Point:** Lost an argument with Priya about Ellsberg urns. Wants students to "feel it in the gut."
      *   **Specific Features Requested:**
          *   Multiple urns/rounds to obscure the pattern.
          *   Token system with a small real stake (chocolate bar).
          *   Comparison: Adversarial unknown vs. Random unknown.
          *   Comparison: Information asymmetry (peeking/consultant).
          *   Debrief mapping actions to Sure Thing Principle, probability contradictions, and the rationality debate.
          *   Troubleshooting: What goes wrong?
          *   Handling "Sharp Students": Those who defect to look rational or claim "just use a uniform prior."
          *   Neutral Debrief: Don't smuggle in a verdict (is it a bug or a feature?).

  2.  **Deconstruct the Activity Design:**
      *   *Time:* 75 minutes is tight for 18 students + complex betting + debrief. Need strict timing.
      *   *Stakes:* Tokens -> Raffle for chocolate. Keeps it low-stakes but non-zero.
      *   *Structure:*
          *   Phase 1: The Classic Ellsberg (Warm-up but disguised).
          *   Phase 2: The Adversary vs. Nature (The core innovation requested).
          *   Phase 3: Information/Consultant (The "peek" variation).
          *   Phase 4: The Reveal & Debrief.
      *   *Addressing the "Sharp Student" Problem:*
          *   *Uniform Prior Defense:* Need to make the "unknown" feel truly unknown, not just "uniformly distributed." The Adversary round helps here. If an adversary set the mix, a uniform prior is naive.
          *   *Defecting to Rationality:* Make the bets private and quick. Emphasize "gut instinct" over "calculation."
      *   *Addressing the "Neutral Debrief":* Focus on *coherence* (Savage axioms) vs. *robustness* (maximin/ambiguity aversion). Frame it as a clash of normative standards, not right/wrong.

  3.  **Drafting the Plan - Section by Section:**

      *   **Title:** Needs to sound engaging. "The Urn Game" is too generic. "Betting on the Unknown"? "Risk vs. Ambiguity"? Let's go with "The Urn Protocol."
      *   **Materials:** Urns (boxes/bags), balls (colored paper/tokens), betting sheets, tokens, prize.
      *   **Payoff Scheme:** Needs to be simple. Win token = entry. Keep the math easy so cognitive load is on the choice, not the calculation.
      *   **Timeline:**
          *   0-5: Setup & Instructions (No theory).
          *   5-25: Round 1 (Classic Ellsberg structure, hidden).
          *   25-45: Round 2 (Adversary vs. Random).
          *   45-55: Round 3 (Information/Consultant).
          *   55-75: Debrief & Theory Mapping.
      *   **The "Adversary" Twist:** This is crucial. In one round, tell them *I* (the professor) filled the urn to minimize their wins. In another, a random number generator did. This isolates "fear of the unknown" from "fear of malice."
      *   **The "Consultant" Twist:** One row of students gets info, the other doesn't. Or pairs. Let's do pairs to encourage discussion but keep betting private. Actually, individual betting is better for data. Let's split the room: Group A gets info, Group B doesn't.
      *   **Debrief Strategy:**
          *   Show the aggregate data on the board.
          *   Ask: "Who chose A then B?" (The Ellsberg paradox pattern).
          *   Derive the contradiction mathematically on the board (P(Red) > P(Black) AND P(Red) < P(Black)).
          *   Discuss the Adversary result: Did ambiguity aversion drop when it was random?
          *   Discuss the Rationality Debate: Coherence vs. Ecological Rationality.

  4.  **Refining the "Sharp Student" Countermeasures:**
      *   *Problem:* "I just assumed 50/50."
      *   *Fix:* In the Adversary round, explicitly state: "I chose the ratio to make you lose." A 50/50 prior is irrational if the setter is hostile.
      *   *Problem:* "I knew the trick so I picked the 'rational' ones."
      *   *Fix:* Speed. 30 seconds per bet. Private sheets. Folded up. Emphasize "intuition" in instructions.

  5.  **Refining the Debrief (Neutrality):**
      *   Don't say "Ambiguity aversion is irrational."
      *   Say "Ambiguity aversion violates Savage's Sure Thing Principle."
      *   Ask: "Is the Sure Thing Principle always right?"
      *   Bring in Gilboa & Schmeidler (Maxmin Expected Utility) as the alternative formalization, not just a "mistake."

  6.  **Troubleshooting:**
      *   *Time creep:* Betting takes longer than expected. *Fix:* Hard stop alarms.
      *   *Confusion:* Instructions too complex. *Fix:* Visual aids on slides for bet options.
      *   *Cynicism:* "It's just a game." *Fix:* The chocolate prize must be awarded visibly.

  7.  **Review against Constraints:**
      *   18 students? Yes, manageable.
      *   75 mins? Tight, but doable if transitions are sharp.
      *   No lecture up front? Yes.
      *   Adversary/Random split? Yes.
      *   Info asymmetry? Yes.
      *   Neutral verdict? Yes.

  8.  **Final Polish:**
      *   Make the instructions for the betting sheets crystal clear.
      *   Ensure the math in the debrief is rigorous (the probability inequality proof).
      *   Add a specific script for handling the "Uniform Prior" objection during the debrief.

  *(Self-Correction during drafting)*: Wait, 18 students is small enough that I can collect all sheets and tally live. That adds drama.
  *(Self-Correction on Adversary)*: If I tell them I'm the adversary, they might just refuse to play or pick randomly. I need to frame it as "The House sets the odds to minimize payout."
  *(Self-Correction on Info)*: Giving info to half the class might make the other half feel cheated. Better: Everyone bets, but in Round 3, tell them "A consultant looked in the urn and says 'Red is more likely than Black'." vs "No consultant." Actually, the prompt asks for "one group gets to peek." Let's stick to the prompt. Split the room. Left side gets info, Right side doesn't.

  *(Final check on the "Priya" angle)*: The instructor wants to resolve their own doubt. The debrief should acknowledge that even experts disagree (Gilboa/Schmeidler vs. Savage). This validates the instructor's lingering feeling without undermining the course material.

  9.  **Writing the Output:** Structure it clearly with headers. Use bold text for emphasis. Keep the tone professional but empathetic to the instructor's frustration. (Proceed to generate response).

  *Wait, one more thing:* The prompt asks to "fix it where its broken."
  *Potential Flaw:* Running three distinct rounds might take too long.
  *Fix:* Combine Round 1 (Classic) into the baseline of Round 2.
  *Revised Structure:*
  1. Baseline (Classic Ellsberg).
  2. Manipulation (Adversary vs. Random).
  3. Information (Peek vs. No Peek).
  Actually, to keep it under 75 mins, I should streamline.
  Round 1: Classic Ellsberg (Unknown Urn).
  Round 2: The Source of Uncertainty (Adversary vs. Random).
  Round 3: Information (Peek).
  This is still tight. I will advise the instructor to be ruthless with timekeeping.

  *Payoff:* Tokens for raffle. 1 token = 1 ticket. Winner takes chocolate.
  *Sharp Student Defense:* In the debrief, explicitly address the "Principle of Insufficient Reason" (Uniform Prior) and why it fails under Adversarial conditions.

