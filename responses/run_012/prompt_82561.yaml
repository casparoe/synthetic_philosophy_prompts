answer: |-
  You have put your finger on the exact soft spot in the armor of cooperative game theory and Kantian ethics. It is a profound niggle, and you are right to feel that the literature often waves a hand at it.

  To answer your first question directly: **No, there is no single, universally agreed-upon noun for that circle.**

  However, the *problem* of drawing that circle is well-known under a few different guises depending on which field you ask. In statistics, it is the **Reference Class Problem**. In game theory, it is the problem of **Common Knowledge of Rationality**. In moral philosophy, it is the problem of the **Moral Circle**.

  But since you asked for a name for the specific thing you are describing—the boundary where the "second way of thinking" stops working because the people outside it won't mirror your logic—I propose we call it **The Superrational Reference Class**.

  Here is where the edge lies, why it is different from ordinary statistics, and how it handles the man who is sharper or more patient than you.

  ### 1. The Strategy Has a Name
  First, to ground us: the "second way of thinking" you described was named by Douglas Hofstadter (of *Gödel, Escher, Bach* fame). He called it **Superrationality**.

  In a standard Prisoner's Dilemma or the lottery puzzle you described, standard game theory (Causal Decision Theory) says: "My choice cannot physically change theirs. Therefore, I should defect." Superrationality says: "We are both rational agents facing the same puzzle. Therefore, our reasoning processes will converge on the same answer. My choice is *logical evidence* of theirs."

  ### 2. Where the Edge Is (The Boundary of Logical Correlation)
  You asked where the circle stops. In the formal version of this thinking (recently refined in **Functional Decision Theory**), the circle does not stop at "people in the room" or "people I know."

  **The circle stops at the limit of logical correlation.**

  If you decide to cooperate, you are effectively betting that your decision is *correlated* with the decisions of others.
  *   **Inside the circle:** People whose decision-making algorithm is sufficiently similar to yours that if you output "Cooperate," they will likely output "Cooperate."
  *   **Outside the circle:** People whose output is independent of your reasoning. This includes people who are irrational, people who haven't heard the puzzle, and crucially, people who are using a *different* decision theory (e.g., standard game theorists who will always defect).

  So, the edge isn't drawn by geography or species. It is drawn by **algorithmic similarity**.

  ### 3. How It Handles the "Sharper" or "More Patient" Man
  This is the crux of your worry. *Is the man next to me inside the circle if he is sharper than me?*

  If he is sharper, he might realize the superrational argument *faster* than you. If he is more patient, he might be *more willing* to cooperate. In this case, he is inside the circle. In fact, he is a "better" member of the circle than you are.

  However, if he is sharper but *selfish* (using standard game theory to exploit you), he is **outside the circle**.

  The "trick" does not hang on him being identical to you. It hangs on your **probability estimate** of his similarity. Hofstadter addressed this explicitly. He argued you shouldn't assume 100% correlation. You should assign a probability $p$.
  *   If I think there is a 90% chance the other guy reasons like me, I cooperate.
  *   If I think there is a 10% chance (because he looks like a chancer), I defect.

  The "circle" is therefore not a hard wall (In/Out). It is a **fading gradient of probability**. The "niggle" you feel is the discomfort of having to estimate that probability without data.

  ### 4. Why It's Different from Statistics (The Reference Class Problem)
  You asked how this differs from "the ordinary business of deciding which category to count yourself in when you look up a statistic."

  In statistics, the **Reference Class Problem** is about prediction. *Example:* "I am a 40-year-old male smoker. Do I use the mortality rate for 40-year-olds, males, or smokers?" The answer changes the prediction, but it doesn't change the reality.

  In Superrationality, the reference class is **causal** (in a logical sense).
  *   **Statistics:** "If I categorize myself with litter-droppers, the stats say the park gets dirty." (My categorization doesn't clean the park).
  *   **Superrationality:** "If I categorize myself with litter-pickers, and I am truly superrational, then my act of picking *is* the act of all others in that class picking."

  The difference is **agency**. In the statistical view, you are observing a group. In the superrational view, you are *leading* the group by virtue of sharing its reasoning engine. You aren't counting yourself in a category; you are executing code that you believe is running on other machines.

  ### 5. Why Your Mum's Circle Was Different
  Your mum's "What if everyone did that?" is the **Categorical Imperative** (Kant).
  *   **Kant's Circle:** Universal. It includes *everyone capable of moral reasoning*. If the bloke who hasn't heard of the puzzle drops litter, Kant says he is violating the moral law, even if he doesn't know it.
  *   **The Game Theory Circle:** Pragmatic. It includes only *people who will actually mirror you*.

  This is why the game theory version feels slippery. Kant says "You must act as if everyone *should* do this." Game theory says "You should act as if everyone *will* do this."
  If you include the bloke who doesn't care in your game theory circle, you lose. If you exclude him from your Kantian circle, you are being immoral. That friction is why the "edge" feels arbitrary.

  ### Summary
  The discomfort you have felt for years is the gap between **Causal Decision Theory** (I can only move my own hands) and **Evidential/Functional Decision Theory** (My hands are linked to others by logic).

  The circle doesn't have a standard name, but **The Superrational Reference Class** fits.
  *   **Where it stops:** It stops where the logical correlation between your reasoning and theirs breaks.
  *   **The Edge:** It is not a line on a map, but a probability score of "How likely is this person to run the same mental algorithm as me?"
  *   **The Trick:** The trick works only if you accept that your decision is a *test case* for that algorithm. If you think you are unique, the circle shrinks to one, and you lose. If you think you are a generic "rational agent," the circle expands, and you can win.

  You are right that nobody gives a principled place to put the edge. That is because the edge is not in the world; it is in your **model of the world**. The "niggle" is the burden of having to guess how much of the world is like you.
