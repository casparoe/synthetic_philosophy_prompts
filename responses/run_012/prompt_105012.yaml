  I'm a TA for an upper-level epistemology/philosophy of science seminar, and I'm putting together the closed-book, no-internet take-home midterm. The unit I'm responsible for is uncertain evidence and Jeffrey conditionalization, and the prof wants at least one question that can't be answered by writing down P_new(H) = sum_i P_old(H | E_i) P_new(E_i) and calling it a day. The trouble is that my students can all recite that formula, but when I gave them a toy case last week they fell apart: a witness says the getaway car was blue; the witness is reliable 80% of the time; then a second report comes in saying the first witness is actually only reliable 60% of the time. Half the class wanted to just multiply 0.8 by 0.6 and update on "the car was blue," and the other half wanted to treat the second report as evidence about the first report rather than evidence about the car. I want an exam question that forces them to sort out the difference between (a) uncertain evidence about the world, (b) higher-order evidence about the reliability of a source, and (c) the kind of two-stage update where the partition itself changes between stages. It should also make them say what has to stay fixed for the Jeffrey formula to be well-defined — something like rigidity of the conditional probabilities — and what goes wrong when you update on one partition and then a finer or coarser one. Don't ask them to cite anyone; it's closed-book and they can't search. I'd also like them to see that if you first update on a coarse partition and then a fine one, you can get a different answer than the reverse, and to say whether that's a bug or a feature.

  Could you write the question, a model answer of around 700–800 words, and a marking scheme? The question is worth 25 marks, and the marking scheme should name five or six must-hit moves, give each a mark value, and include a one-line note on the mistake that typically costs students those marks. The question should be doable in about 45 minutes by a good student. Also, if you can, make the model answer actually work through a small numerical version of the witness case so I can see whether they're getting the update right, but keep the numbers simple enough that they don't need a calculator. I'm not a probabilist by training, so if I've said something slightly off, write the question so it's still answerable. And please don't put any citations or reading suggestions in the model answer — I want it self-contained. I recieve a lot of answers that just name-drop "rigidity" without saying what it's for, so the marking scheme should punish that specifically.
