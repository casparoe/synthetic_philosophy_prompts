prompt: |-
  I program a small documentary festival: roughly 1,200 submissions a year, ninety slots, no realistic chance of my seeing more than a fraction of them. Most of my decisions rest on what other people tell me — pre-screeners' reports, two colleagues whose taste I trust, a distributor's enthusiasm, a director's track record — and then I write the program notes and do press in which I say flatly that a film is extraordinary, or devastating, or the best thing in its strand, and defend the slate to a board that signs off on it. A colleague tells me this is defensible as a programming decision and indefensible as a claim, since I don't have the judgment I'm expressing; I half agree and can't see what follows, because the notes still have to say something.

  Give me a procedure I can actually run, one submission at a time, in the ten minutes I have per title, and then again on the copy: the questions to ask in order, what counts as a sufficient answer to each, where the procedure returns a verdict by itself, and where it stops and hands me a judgment call rather than a fact. It should keep whatever the philosophy of aesthetic testimony genuinely establishes — the difference between acting on someone's say-so and asserting on it, the principle, sometimes called the acquaintance principle, that a genuine aesthetic judgment must rest on first-hand acquaintance with the work, and whether what licenses deference is the testifier's credentials or her access to the thing — and drop whatever can't survive a deadline. Then run it on three cases: a film I cannot see before the deadline, covered by two reports I trust; a film I programmed on a friend's word and disliked once I finally saw it; and the year-end list, where I am asked to rank a film I haven't seen above one I have. Include at least one verdict I won't like, and tell me what the procedure can't settle — including whether someone who defers this much can be said to have taste at all.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Documentary Festival Programmer.
      *   **Constraints:** 1,200 submissions, 90 slots, ~10 minutes per title for decision-making, heavy reliance on second-hand testimony (pre-screeners, colleagues, distributors, track records).
      *   **Conflict:** The user writes program notes claiming films are "extraordinary," "devastating," etc., based largely on testimony. A colleague argues this is defensible as *programming* (selection) but indefensible as *claim* (critical assertion) because the user lacks first-hand acquaintance (the "Acquaintance Principle").
      *   **Task:** Create a concrete, runnable procedure (algorithm/checklist) for:
          1.  Selection (10 mins/submission).
          2.  Copywriting (program notes).
      *   **Requirements:**
          *   Must respect aesthetic philosophy (testimony vs. assertion, acquaintance principle).
          *   Must be practical (survive deadlines).
          *   Must distinguish between verdicts (automatic) and judgment calls.
          *   Must run on three specific cases (Unseen/Trusted Reports, Programmed on Word/Disliked, Year-End List/Unseen > Seen).
          *   Must include an unwelcome verdict.
          *   Must address the limit: Can someone who defers this much be said to have "taste"?

  2.  **Philosophical Grounding (The "Why"):**

      *   *The Acquaintance Principle:* (Kant, Hume, contemporary aesthetics). You can't genuinely judge beauty without experiencing the object.
      *   *Aesthetic Testimony:* Can we learn aesthetic facts from others? Most philosophers say no, or at least, it doesn't constitute *understanding*. You can know *that* it's good, but not *why* in a way that allows genuine assertion.
      *   *The Programmer's Dilemma:* Programming is curatorial (trust-based), but Copy is critical (experience-based). The user is conflating the two.
      *   *Solution:* Decouple the *selection* (which can rely on trusted networks) from the *assertion* (which must rely on experience). The procedure needs to enforce linguistic honesty without sabotaging the festival's marketing.

  3.  **Developing the Procedure (The "How"):**

      *   *Phase 1: Selection (The 10-Minute Triage).*
          *   Goal: Filter 1,200 to 90.
          *   Input: Reports, Track Record, Trailer/Clip (if available).
          *   Mechanism: Weighted Trust Score vs. Risk.
          *   Constraint: Cannot claim "I saw this."
      *   *Phase 2: Copywriting (The Linguistic Audit).*
          *   Goal: Write notes that sell without lying about the source of judgment.
          *   Mechanism: Check the modality of the adjectives.
          *   Constraint: Distinguish "This film is X" (Ontological claim) from "We believe this film is X" (Curatorial claim).

      *   *Drafting the Steps:*
          *   Need specific questions.
          *   Need "Stop/Go" criteria.
          *   Need to identify where the "Judgment Call" happens.

  4.  **Refining the Procedure (Iterative Process):**

      *   *Critique:* Just saying "don't lie" isn't enough. The user needs to sell the film.
      *   *Adjustment:* Shift the voice from "Critic" to "Curator." A critic says "This is good." A curator says "This belongs here."
      *   *The "Unwelcome Verdict":* The procedure must force the user to admit when they *cannot* write the copy they want to write. If they haven't seen it, they cannot call it "devastating." They must call it "highly recommended by [Trusted Source]." This might feel weak marketing-wise, hence the "unwelcome verdict."

  5.  **Running the Cases:**

      *   *Case 1: Unseen + 2 Trusted Reports.*
          *   Selection: Pass (High Trust).
          *   Copy: Must attribute praise. Cannot use unqualified superlatives.
      *   *Case 2: Programmed on Word + Disliked.*
          *   Selection: Already done (Error).
          *   Copy: Damage control. Acknowledge the divergence? Or hide? Procedure should suggest honesty about the *curatorial intent* vs. *personal reaction*.
      *   *Case 3: Year-End List (Unseen > Seen).*
          *   Ranking: Cannot rank Unseen > Seen based on aesthetic merit. Can only rank based on "Cultural Importance" or "Trust in Source."
          *   Verdict: Unwelcome. You must rank the Seen film higher, or recuse yourself from ranking the Unseen one.

  6.  **Addressing the "Taste" Question:**

      *   If I defer, do I have taste?
      *   Answer: You have *institutional* taste (network building), not *aesthetic* taste (perception). The procedure needs to highlight this distinction.

  7.  **Finalizing the Output Structure:**

      *   **Introduction:** Acknowledge the tension (Curatorial vs. Critical).
      *   **The Procedure:** Two parts (Selection & Copy). Clear steps, conditions, and exit points.
      *   **The Three Cases:** Apply the procedure rigorously.
      *   **The Unwelcome Verdict:** Highlighted explicitly.
      *   **The Limit:** Address the "Taste" question.

  8.  **Self-Correction/Polishing during drafting:**

      *   *Check:* Did I give them 10 minutes?
      *   *Fix:* The selection phase needs to be fast. Focus on the *source* of the info, not the film itself (since they can't see the film).
      *   *Check:* Is the philosophical distinction clear?
      *   *Fix:* Use terms like "First-Hand Access" vs. "Delegated Authority."
      *   *Check:* Is the tone appropriate?
      *   *Fix:* Professional, slightly stern but empathetic to the workload.

  9.  **Final Review against constraints:**
      *   10 mins/submission? Yes (focused on metadata/reports).
      *   Copy procedure included? Yes.
      *   3 cases run? Yes.
      *   Unwelcome verdict included? Yes (Case 3).
      *   "Taste" question answered? Yes.

  *(Self-Correction on Case 2)*: If they already programmed it and disliked it, the selection procedure is moot. The focus must be on the *Copy* procedure. How to write notes for a film you selected but now think is bad? The procedure should force a shift from "This is great" to "This is challenging" or "This represents X voice." Honesty is key.

  *(Self-Correction on Case 3)*: Ranking unseen > seen. The procedure must forbid this if the criteria is "Best Films." If the criteria is "Most Important," maybe allowed. I will make the procedure strict: Aesthetic ranking requires acquaintance.

  *(Refining the "Unwelcome Verdict"):* The most unwelcome verdict is that for 30% of the slate, they are forbidden from using the word "Masterpiece" or "Extraordinary" in the first person. They must use passive voice or attribution.

  Let's write it.cw
answer: |-
  ### The Curator's Audit Procedure (CAP)

  This procedure separates **Curatorial Authority** (selecting what belongs in the ecosystem) from **Critical Assertion** (claiming aesthetic knowledge). It is designed to fit your 10-minute window and protect you from the charge of bad faith while acknowledging the reality of your workload.

  #### Part 1: The Selection Triage (10 Minutes per Title)
  *Goal: Determine if the film enters the 90 slots. Do not judge the art; judge the network.*

  **Minute 0–2: The Access Check**
  1.  **Question:** Do I have direct access to the file?
      *   **Yes:** Watch 5 minutes. Skip to Question 4.
      *   **No:** Proceed to Question 2.
  2.  **Question:** Is there a trusted testimony chain? (Define "Trusted": Pre-screener has no conflict + 2 prior hits OR Colleague with aligned taste + 1 prior hit).
      *   **Yes:** Proceed to Question 3.
      *   **No:** **VERDICT: REJECT.** (You cannot spend capital on unverified risk).
  3.  **Question:** Does the testimony specify *why* it fits the strand (theme/audience) rather than just *that* it is good?
      *   **Yes:** Proceed to Question 4.
      *   **No:** **VERDICT: REJECT.** (Vague praise is not programming data).

  **Minute 2–8: The Context Scan**
  4.  **Question:** Does the director's track record support the testimony? (Past work aligns with current report).
      *   **Yes:** +1 Trust Point.
      *   **No:** 0 Trust Points.
  5.  **Question:** Is there a distributor/sales agent attached with a reputation for quality in this genre?
      *   **Yes:** +1 Trust Point.
      *   **No:** 0 Trust Points.
  6.  **Question:** Does this film fill a demographic, geographic, or thematic gap in the current 90-slot draft?
      *   **Yes:** +1 Necessity Point.
      *   **No:** 0 Necessity Points.

  **Minute 8–10: The Verdict**
  7.  **Calculation:**
      *   **Trust Points ≥ 2 AND Necessity Point = 1:** **SELECT.** (Flag as "Delegated Selection" in internal notes).
      *   **Trust Points ≤ 1:** **REJECT.**
      *   **Trust Points ≥ 2 AND Necessity Point = 0:** **JUDGMENT CALL.** (Do you have room for a luxury pick? If yes, Select. If no, Reject).

  **Output:** A binary decision (In/Out) and a status tag (**Direct** or **Delegated**).

  ***

  #### Part 2: The Copy Audit (Per Program Note)
  *Goal: Write text that sells the film without violating the Acquaintance Principle.*

  **Step 1: The Source Check**
  1.  **Question:** What is the status tag for this film?
      *   **Direct:** You watched it. Proceed to Step 2.
      *   **Delegated:** You relied on testimony. Proceed to Step 3.

  **Step 2: Direct Assertion (For Watched Films)**
  2.  **Question:** Can I identify a specific formal element (editing, sound, structure) that causes the emotional effect?
      *   **Yes:** You may use first-person aesthetic claims ("Devastating," "Extraordinary").
      *   **No:** **STOP.** Revert to Step 3. (If you watched it but can't articulate why it works, you don't actually know it works).

  **Step 3: Delegated Assertion (For Unseen Films)**
  3.  **Question:** Am I using an unqualified adjective of value? (e.g., "A masterpiece," "The best," "Devastating").
      *   **Yes:** **VERDICT: FORBIDDEN.** You must rewrite.
      *   **No:** Proceed to Question 4.
  4.  **Question:** Can I attribute the value to the source or the context? (e.g., "Hailed by," "Winner of," "A vital addition to").
      *   **Yes:** **ALLOWED.**
      *   **No:** **VERDICT: FORBIDDEN.**

  **Step 4: The Modality Shift**
  5.  **Rule:** If **Delegated**, the subject of the sentence must shift from *The Film* to *The Festival/The Context*.
      *   *Bad:* "This film is a triumph."
      *   *Good:* "We are proud to present this triumph of the genre."
      *   *Good:* "Critics have called this a triumph."

  ***

  ### Running the Procedure on Your Three Cases

  #### Case 1: The Unseen Film with Two Trusted Reports
  *   **Selection:** Trust Points = 2 (Two colleagues). Necessity = 1 (Fills a gap). **Verdict: SELECT (Delegated).**
  *   **Copy:** You want to write: *"A devastating portrait of grief."*
  *   **Audit:** Status is **Delegated**. You have not seen the grief.
  *   **Procedure Command:** **FORBIDDEN.**
  *   **Required Rewrite:** *"In this devastating portrait of grief, [Director] continues their exploration of loss."* (Wait, "devastating" is still an aesthetic claim).
  *   **Strict Rewrite:** *"Hailed as a devastating portrait of grief, [Director]'s latest continues..."* OR *"We are honored to present what critics are calling a devastating portrait..."*
  *   **Result:** You can program it, but you cannot *own* the adjective. You become a transmitter of the praise, not the source.

  #### Case 2: Programmed on a Friend's Word, Disliked Upon Viewing
  *   **Selection:** Already happened. Error identified post-hoc.
  *   **Copy:** You want to write: *"A bold new vision."* (You now know it isn't).
  *   **Audit:** Status is now **Direct** (you finally saw it). Step 2 asks: Can you identify a formal element that works?
  *   **Scenario A:** You disliked it, but acknowledge it is technically competent.
      *   **Verdict:** You may describe the *intent*, not the *success*. *"An ambitious attempt to..."*
  *   **Scenario B:** You think it is objectively bad.
      *   **Verdict:** **JUDGMENT CALL.** Do you pull it? If not, the Copy Audit forces honesty. You cannot lie.
      *   **Required Rewrite:** *"A polarizing entry in the strand..."* or *"A challenging work that demands audience engagement."*
  *   **Result:** The procedure prevents you from lying to the audience to save face with your friend. It forces you to frame the film as "challenging" rather than "good."

  #### Case 3: The Year-End List (Unseen > Seen)
  *   **Task:** Rank Film A (Unseen, Trusted Reports) above Film B (Seen, by you).
  *   **Audit:** This is a Critical Assertion context, not Curatorial.
  *   **Step 1:** Source Check. Film A is **Delegated**. Film B is **Direct**.
  *   **Step 2:** Aesthetic Ranking requires comparison of aesthetic properties.
  *   **Procedure Command:** **VERDICT: FORBIDDEN.**
  *   **Reasoning:** You cannot rank a testimony against an experience. You can only rank an experience against an experience.
  *   **Required Action:** You must rank Film B above Film A, or remove Film A from the "Best Of" list entirely (perhaps placing it in a "Most Anticipated" or "Notable Mentions" category based on buzz).
  *   **The Unwelcome Verdict:** **You cannot put the unseen film on the "Best of the Year" list.** To do so is to claim knowledge you do not possess. You must downgrade it to "Notable Releases" or exclude it.

  ***

  ### What The Procedure Cannot Settle

  **1. The "Taste" Question**
  You asked whether someone who defers this much can be said to have *taste*. The procedure reveals the answer: **No, not in the aesthetic sense.**
  *   **Aesthetic Taste:** The ability to perceive and judge quality directly. The CAP admits you are bypassing this for 70%+ of your slate.
  *   **Institutional Taste:** The ability to identify *who knows*. Your "taste" is actually **network management**. You are not judging films; you are judging people who judge films.
  *   **The Limit:** The procedure cannot make you an aesthete. It can only make you an honest broker. If you run CAP for five years, you will have a reputation for *reliability*, not *vision*.

  **2. The Marketing Friction**
  The procedure will generate copy that feels weaker. *"Hailed as a masterpiece"* is less punchy than *"A masterpiece."* Distributors will hate this. The procedure cannot solve the market's demand for hyperbole. It only solves your ethical exposure.

  **3. The "Delegated" Blind Spot**
  If your trusted colleagues all share a blind spot (e.g., they all undervalue a certain style of documentary), the CAP will systematize that bias. The procedure filters for *consensus*, not *discovery*. It protects you from bad films, but it also protects you from risky, singular films that no one else understands yet.

  ### Summary of the Unwelcome Verdict
  In **Case 3**, the procedure forces you to rank the film you *saw* (and perhaps liked less) above the film you *didn't see* (but heard was better).
  *   **Why:** Because a "Best Of" list is a claim of acquaintance.
  *   **The Cost:** You might look less "in the know" regarding the buzz film.
  *   **The Gain:** You retain the right to speak on what you know.

  **Final Instruction:**
  Run the Selection Triage to fill your 90 slots. Run the Copy Audit to write your brochure. Accept that for the films flagged **Delegated**, you are not the critic; you are the librarian. Sign the notes accordingly.
