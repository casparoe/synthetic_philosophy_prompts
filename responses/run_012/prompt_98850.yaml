      *   **The "Why it's hard" part:** Explain *Imitative Iterated Amplification* (IDA) or *RLHF* limitations. The gap between *expressed* approval and *idealized* approval.
      *   **Conclusion:** Summarize. ADAs shift the problem from "specifying a goal" to "specifying a feedback process," but the optimization pressure remains.

