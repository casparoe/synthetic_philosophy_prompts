      *   **Section 2: Tension between 2 (Forgery) and 3 (Honest Copy).**
          *   Why is the forgery more interesting? It's not just documentary. It's a *rival performance*.
          *   The forgery is a testament to the *forger's* agency (a new work disguised as an old one). The honest copy is a *suppression* of agency (trying to disappear).
          *   The forgery has "narrative tension." The honest copy has "institutional transparency."
          *   Verdict: You are not mistaken. The forgery is a distinct artwork (by the forger) that *also* references the original. The honest copy is a tool.

      *   **Section 3: Cases 5, 6, and 7 (The Line of Rebuildability).**
          *   Why is the Cathedral (6) rebuildable but the Painting (7) not?
