      *   *Arthur Danto's* "Artworld" or *Jerrold Levinson's* "Indicated Structure" might help.
      *   *Proposed Principle:* **The Principle of Historical Individuation.** A work's identity and value are constituted not merely by its perceptual properties but by its specific history of generation. We value the *trace of the artist's agency* preserved in the material.
      *   *Modification for Architecture/Reconstruction:* Distinguish between *Functional Continuity* (Buildings) and *Material Trace* (Paintings).

