          *   *Clause C (The Functional Exception):* Works defined by spatial function and continuity of use retain identity through material replacement. (Explains 6).
          *   *Clause D (The Integrity Constraint):* Material intervention that obscures the original trace reduces value, even if identity is retained. (Explains 7).
