answer: |-
  Here is an analysis of your verdicts, a proposed principle to systematize them, and an examination of the tensions you have identified.

  ### I. The Principle: Causal Provenance with Functional Exceptions

  Your tentative principle ("causal guarantee") is strong, but as you noted in Case 6 (the cathedral), it is too strict. If "nothing has intervened" were required, the cathedral would be a copy. To save your nine verdicts, we must adopt a **complicated principle** that distinguishes between works valued for their *material history* and works valued for their *functional continuity*.

  **The Principle of Constitutive History:**
  The value and identity of an artwork are determined by the history of its production, specifically the trace of the artist's agency, unless the work's definition prioritizes functional continuity over material specificity.

  *   **Clause A (The Material Trace):** For singular, hand-wrought objects (paintings, violins), value resides in the specific material evidence of the artist's generative act. Intervening agents (forgers, restorers, pupils) break the causal chain and diminish value, even if perceptual qualities remain.
      *   *Motivating Cases:* **1** (Fake Old Master), **4** (Reattribution), **8** (Violins). In all three, the object looks/sounds the same, but the history of production dictates the value.
  *   **Clause B (The Authorization Exception):** In mechanically reproducible media, the "original" is defined not by uniqueness of matter but by the artist's authorization of the source or output.
      *   *Motivating Case:* **9** (Photography). The file or signed print is the "original" because it carries the artist's intentional stamp, distinguishing it from unauthorized duplicates.
  *   **Clause C (The Functional Continuity Exception):** For works defined by spatial occupation and public function (architecture), identity is retained through material replacement provided the design and location remain continuous.
      *   *Motivating Case:* **6** (Cathedral). The building is a "place" as much as an object; the continuity of use preserves the identity despite material intervention.
  *   **Clause D (The Surrogate Necessity):** When the original material trace is irretrievably lost, the closest causal surrogate inherits the work's identity, but each step of removal degrades the claim.
      *   *Motivating Case:* **5** (Bronze/Marble/Plaster). The marble copy is accepted as "the work" only because the bronze is gone (Necessity). The plaster cast is rejected because it is a copy of a copy (Degradation).
  *   **Clause E (The Integrity Constraint):** Material intervention that obscures the original trace reduces value, even if identity is retained. Preservation of the *evidence* of the act is preferable to visual completeness.
      *   *Motivating Case:* **7** (Repaint). You prefer bare ground to false paint because the false paint breaks the Material Trace (Clause A), whereas the cathedral (Clause C) is exempt because its identity is functional, not material.

  ### II. The Tension Between Case 2 (Forgery) and Case 3 (Honest Copy)

  You ask if the fraud's documentary interest is doing all the work in Case 2, and if you are mistaken to feel the exposed forgery as art rather than evidence.

  **You are not mistaken.** The difference is not merely documentary; it is **agential**.

  *   **The Honest Copy (Case 3)** attempts to erase its own agency. It is a transparent window intended to direct your attention *away* from itself and toward the original. It is a tool. To admire it is to misunderstand its function.
  *   **The Forgery (Case 2)** is a palimpsest of two agencies. Even when exposed, it remains a testament to the *forger's* skill, intent, and historical context. It is a "double work": it fails as the Master's work, but succeeds as the Forger's work.

  The "pull" you feel is the recognition of a **rival performance**. The forger engaged in a high-stakes creative act (deception + emulation) that the honest copyist did not. The honest copy is a service; the forgery is a subversive artwork. Therefore, the forgery has aesthetic weight *as a forgery*, whereas the honest copy has none *as a copy*. You are valuing the forger's agency, which is real, whereas the copyist's agency is intentionally suppressed.

  ### III. Cases 5, 6, and 7: The Line of Rebuildability

  You suspect you are rationalizing the difference between the Cathedral (6) and the Repainted Painting (7). There is a principled line, but it relies on the ontology of the medium.

  **The Principle:** The line is drawn between **Token-Identity** and **Type-Identity**.

  *   **Paintings (Case 7)** are *singular tokens*. The work is inextricably bound to the specific matter the artist touched. When 60% of the surface is repaint, the specific matter of the artist's act is largely gone. To rebuild it is to create a new token. Hence, you prefer the ruin (bare ground) because it preserves the *remnant* of the original token.
  *   **Buildings (Case 6)** are *functional types instantiated in a location*. While they have materiality, their primary definition is spatial enclosure and continuity of use. The "Ship of Theseus" paradox is resolved in architecture by **continuity of function**. As long as the building serves its purpose in its place without a break in its existence, it remains the same work.
  *   **Lost Sculpture (Case 5)** occupies a middle ground. The bronze is a token, but it is gone. The marble copy is accepted under **Clause D (Surrogate Necessity)**. However, the distinction between the marble copy and the plaster cast is one of **causal proximity**. The marble copy was likely made from the original bronze (one step removed). The plaster cast is made from the marble (two steps removed). Each step introduces interpretive noise. You are "generous" to the marble because it is the last link to the lost token; you are "stingy" to the plaster because it is a copy of an interpretation.

  **Verdict:** You are not merely rationalizing. You are distinguishing between works where the *matter* is the message (painting) and works where the *form/function* is the message (architecture).

  ### IV. Verdicts on New Cases

  **(a) Reconstruction from Description (e.g., a lost play, building, or machine described in text)**
  *   **Verdict:** This is a **new work based on data**, not the original work.
  *   **Reasoning:** Without a causal link to the artist's hand or a continuous functional history, the reconstruction is an act of translation. If it is a building (like the Crystal Palace), it might claim identity via Clause C (Functional Continuity) *if* built on the same site for the same purpose immediately. If it is a sculpture or painting reconstructed from text centuries later, it is a "visualization." It inherits the value of a **scholarly hypothesis**, not an original. It is worth seeing as an illustration of the description, not as the work itself.

  **(b) Forgery of a Lost Work (The forgery turns out to be the only surviving trace of a composition that actually existed)**
  *   **Verdict:** The object becomes a **Unique Historical Surrogate**. Its market value as "the Master's work" remains low (provenance is fake), but its historical value skyrockets.
  *   **Reasoning:** Ontologically, it remains a forgery (Clause A: no causal link to the Master). However, functionally, it now serves the role of Case 5 (the marble copy). It is the only window into a lost composition. It should be exhibited as: *"Unknown Forger, [Date]; depicting [Master's Lost Work]."* It is worth more than a standard forgery (Case 1) because it holds unique information, but less than an original because it filters that information through the forger's hand.

  ### V. Honest Statement of Incompatibility

  I must state clearly where my proposed principle fails to fully accommodate your intuitions.

  **The Incompatible Verdict: Case 5 (The Marble Copy).**

  My principle relies heavily on **Clause A (The Material Trace)**: value resides in the specific material evidence of the artist's act.
  *   In **Case 1 (Fake)**, you reject the object because the material trace is from the wrong hand.
  *   In **Case 5 (Marble Copy)**, you accept the object as "the work" even though the material trace is *also* from the wrong hand (the copyist, not the bronze caster) and the medium is different (marble, not bronze).

  To save Case 5, I had to introduce **Clause D (Surrogate Necessity)**. This is a **pragmatic override**, not a principled consistency. Strictly speaking, if the "causal guarantee" of the artist's hand is what matters (as per Case 1 and 4), the marble copy should be worth less than you say it is. You are willing to say you have "seen the work" in Case 5, but in Case 3 (Honest Replica), you say you have *not*.

  **The Contradiction:** In Case 3, the original exists but is fragile. In Case 5, the original is lost. The *object* you look at in both cases is a copy made by a later hand. The only difference is the existence of the original.
  *   If value is in the **Causal Trace**, Case 5 should be rejected (no trace of the bronze caster exists).
  *   If value is in the **Visual Experience**, Case 3 should be accepted (experience is identical).

  You hold both: You reject Case 3 (prioritizing Trace) but accept Case 5 (prioritizing Experience/Necessity). My principle saves this by calling Case 5 a "necessary exception," but I must admit: **Case 5 is the weak link.** It suggests that your commitment to the "Causal Guarantee" is not absolute, but contingent on availability. You are a Causal Absolutist when originals exist, and a Pragmatic Empiricist when they do not. This is humanly reasonable, but logically inconsistent.
