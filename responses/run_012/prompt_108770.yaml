      *   **Section 4: New Cases.**
          *   (a) *Reconstruction from Description:* (e.g., lost play, lost building like the Crystal Palace). If it's a building, maybe it counts (Functional). If it's a painting/sculpture, it's a *new work based on data*. It inherits the value of a *scholarly reconstruction*, not an original. It is a "work derived from" not "the work."
          *   (b) *Forgery of a Lost Work:* (e.g., Han van Meegeren's Christ at Emmaus, but imagine the original was actually lost). If the original is lost, this forgery becomes the *de facto* original of that specific composition, but ontologically it remains a forgery of the *intent*. However, historically, it becomes a "unique survivor." Value: High as a historical artifact, low as an authentic expression of the master. It becomes a "false witness that tells the truth about the style."

