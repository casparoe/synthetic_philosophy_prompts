prompt: |-
  OK I've been going in circles on the wrong kind of reasons problem and I want an actual number from you, not a tour of the literature. Quick setup so we're on the same page: someone offers you a big bribe to admire them (or a demon threatens you unless you do) — that gives you some sense of "reason" to admire them, but it's obviously not a reason of the kind that bears on whether they're actually admirable. The fitting-attitude analysis of value says x is good just in case it's fitting to value x, and the worry is that the analysis is now hostage to whatever we feed into "fitting" — the bribe included — unless we can restrict it to right-kind reasons without going in a circle.

  Now the part I actually want your credence on. My friend's proposal is that the distinction can be drawn by a counterfactual test: a reason is the right kind for an attitude iff it would still count as a reason for that attitude even if having the attitude made no difference to any of your intrests; anything that only gets a grip because of what the attitude does for you is the wrong kind. So "he'll torture you" fails (it only bites because you don't want to be tortured), while "he's kind" passes.

  Give me your credence that there's a principled, non-circular solution to the wrong kind of reasons problem that keeps the fitting-attitude analysis of value intact. Decompose it, roughly: (a) P(the object-given vs. state-given distinction is a real distinction, not just a relabeling of "right kind"/"wrong kind"); (b) P(her counterfactual test in particular draws it correctly); (c) P(the fitting-attitude analysis survives once you restrict to the right kind, rather than the restriction quietly presupposing the value notion it was supposed to analyze); (d) P(the whole thing is a verbal dispute about the word "reason" that dissapears once you're clear about what you mean). One line of justification each, then combine them however you think is right and give me the number. Add any term you think belongs.

  Then: which term is the number most sensitive to, and what single case or argument would move it most? And tell me straight whether my friend's test needs that interests clause or whether you'd state it some other way — if you'd rephrase it, just do that instead of grading hers. If you think I've set the problem up in a way that stacks the deck, say so, re-set it, then give the number.
