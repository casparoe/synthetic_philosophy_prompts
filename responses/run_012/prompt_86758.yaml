prompt: |-
  I sit on the ethics committee at a mid-sized teaching hospital, and because I did a philosophy MA before med school I've somehow become the unofficial in-house philosopher — every time a case gets weird, it lands on my desk. The case that keeps recurring: someone wrote a clear, specific advance directive years ago (usually refusing a feeding tube, sometimes refusing dialysis, once something odd like "no antibiotics for pneumonia, I'd rather go"), and now they're in the moderate-to-severe dementia stage, and they seem... fine? Content, not resisting, sometimes actively enjoying their pudding. The family is split, the attending wants cover, and we improvise. We had one last month where the daughter said something that has stuck with me — "the woman in that bed isn't my mother, but the woman who wrote that directive was" — and I genuinely couldn't tell whether that was sentimental confusion or the entire crux of the problem wearing a sentimental costume.

  Anyway, a small foundation has given us enough for one PhD student for three years to work on "the authority of the earlier self" in advance care planning, and I get to set the research agenda. So: what are the open conceptual questions here that actually matter most, and in what order would you put them? I want the reasoning rather than the list — for each, why it's upstream of the others, whether it's the kind of thing a philosopher can make real progress on in three years as opposed to something that just needs empirical data we don't have, and what would move it up or down the ranking. Some things I'd like you to at least consider, and feel free to call any of them dead ends: whether the earlier self's authority is grounded in autonomy, in the narrative unity of a life, in something promise-like, or in the brute persistence of that earlier person's interests; the reverse-Parfit move, where reductionism about personal identity ends up strengthening rather than weakening the case for honoring directives, because the earlier self is a distinct person whose claims don't just evaporate when the dementia sets in; whether the later self's apparent contentment is itself a symptom rather than a preference, and what that does to a framework built on respecting preferences; whether casting the directive as a Ulysses-style precommitment actually helps or just smuggles in the assumption that the earlier and later selves are the same agent; and the difference between a directive that's specific and a later self who's docile, versus a later self who repeatedly and lucidly says no. One more thing I'd like you to sort out for me, because I suspect we've been conflating them for years: which of these are really questions about what a person is, and which are really questions about what a hospital is permitted to do to one.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the User and Context:**
      *   **User:** Physician (MD) with an MA in Philosophy, sits on an ethics committee at a mid-sized teaching hospital.
      *   **Role:** Unofficial in-house philosopher, tasked with setting the research agenda for a funded 3-year PhD studentship.
      *   **Problem:** Recurring ethical dilemmas regarding advance directives (ADs) in dementia cases where the current self seems content/fine, but the past self refused treatment. Family conflict, attending uncertainty.
      *   **Key Insight:** The daughter's comment ("the woman in that bed isn't my mother...") highlights the personal identity problem.
      *   **Goal:** Prioritize open conceptual questions that *actually matter*, explain the reasoning (upstream/downstream), assess feasibility for a 3-year PhD, and distinguish metaphysical questions (what is a person) from normative/institutional questions (what is a hospital permitted to do).
      *   **Specific Topics to Consider:** Autonomy vs. Narrative vs. Promise vs. Interests; Parfitian Reductionism (reverse move); Contentment as symptom vs. preference; Ulysses precommitment; Specific directive vs. docile later self vs. resisting later self.
      *   **Tone:** Professional, intellectually rigorous, pragmatic (clinical relevance), nuanced.

  2.  **Deconstruct the Core Tension:**
      *   The central conflict is between the *Past Self* (competent, wrote AD) and the *Present Self* (demented, seemingly content).
      *   Standard bioethics leans heavily on *Autonomy*. But if the person has changed significantly (psychological continuity broken), does the Past Self's autonomy bind the Present Self?
      *   If we honor the AD, we might be killing a content being. If we ignore it, we violate the explicit wishes of the competent predecessor.
      *   The "Daughter's Dilemma": Is the patient the same person? If not, why does the AD matter? If yes, why does current contentment matter less?

  3.  **Evaluate the Candidate Questions (Brainstorming & Filtering):**

      *   *Question A: Personal Identity (Metaphysics).* Is the dementia patient the same person as the AD writer?
          *   *Pros:* Addresses the daughter's comment directly. Parfitian reductionism is relevant.
          *   *Cons:* Pure metaphysics rarely solves clinical policy. Even if they are "different persons," we still have to decide who decides. Might be a "dead end" for practical policy, though crucial for theoretical grounding.
          *   *Verdict:* Upstream, but needs to be framed normatively, not just metaphysically.

      *   *Question B: Ground of Authority (Autonomy vs. Interest vs. Promise).* Why does the AD have weight?
          *   *Pros:* Directly impacts how committees vote.
          *   *Cons:* Depends on the answer to Identity.
          *   *Verdict:* High priority, but downstream of Identity.

      *   *Question C: The Status of Current Contentment.* Is the dementia patient's happiness "real" or just a symptom?
          *   *Pros:* Addresses the "they seem fine" observation.
          *   *Cons:* Empirical/psychiatric overlap. Philosophically, it's about well-being (hedonic vs. objective).
          *   *Verdict:* Crucial for the "harm" calculation.

      *   *Question D: Institutional Permission vs. Moral Obligation.* What is the hospital allowed to do?
          *   *Pros:* Pragmatic. Distinguishes "what is right" from "what is legal/policy."
          *   *Cons:* Might limit the philosophical scope.
          *   *Verdict:* Essential for the final output (policy recommendations).

      *   *Question E: Ulysses Contracts/Precommitment.* Does framing it this way help?
          *   *Pros:* Explains the *function* of the AD.
          *   *Cons:* Assumes continuity of agency.
          *   *Verdict:* Good analytical tool, but maybe not the *foundational* question.

  4.  **Develop the Research Agenda (Ordering & Reasoning):**

      *   *Priority 1: The Normative Significance of Psychological Discontinuity.* (The "Identity" question, but framed for ethics).
          *   *Why:* You can't decide whose wishes count until you decide whose *life* is being lived. If the daughter is right (they are different), the AD is a will/testament, not a current instruction. If she's wrong (they are the same), the AD is a current instruction.
          *   *Feasibility:* A PhD can tackle the literature (Parfit, Schechtman, Dresser) and propose a normative framework (e.g., "moral authority survives psychological change").
          *   *Upstream:* Everything else depends on this.

      *   *Priority 2: The Epistemology of Well-Being in Dementia.* (The "Contentment" question).
          *   *Why:* If the Present Self is a distinct moral patient (or even the same one), does their current happiness outweigh the Past Self's values? We need to know if "pudding enjoyment" counts as a valid interest against "dignity/death."
          *   *Feasibility:* Philosophical analysis of well-being (hedonism vs. desire satisfaction) applied to cognitive impairment.
          *   *Upstream:* Determines the "harm" of overriding the AD.

      *   *Priority 3: The Institutional Role and Risk.* (The "Hospital Permission" question).
          *   *Why:* Even if we solve 1 and 2, the hospital operates under law and liability. We need to distinguish *moral truth* from *policy safety*.
          *   *Feasibility:* Normative political philosophy/ethics of institutions.
          *   *Downstream:* Applies the findings of 1 and 2 to the real world.

  5.  **Addressing Specific User Prompts:**
      *   *Parfitian Reductionism:* Needs to be integrated into Priority 1. The "reverse move" (distinct persons -> distinct claims) is strong but needs to be weighed against the "one life" narrative.
      *   *Contentment as Symptom:* Priority 2.
      *   *Ulysses Precommitment:* Use this as a test case within Priority 1 or 3.
      *   *Person vs. Hospital:* This is the crucial distinction to make explicit in the conclusion/final priority.

  6.  **Refining the Argument (Self-Correction/Critique):**
      *   *Critique:* Is "Personal Identity" too abstract for a 3-year clinical project?
      *   *Correction:* Frame it not as "Are they numerically identical?" but "What degree of psychological continuity is required for *moral authority* to persist?" This makes it normative, not just metaphysical.
      *   *Critique:* Is the "Hospital" question too legalistic?
      *   *Correction:* Frame it as "The Ethics of Stewardship." The hospital is a moral agent too.
      *   *Critique:* Did I address the "dead ends"?
      *   *Correction:* Explicitly label the pure metaphysical identity question as a potential trap if not tied to normative authority.

  7.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the gravity and the specific insight (the daughter's comment). Validate the user's dual role.
      *   *Structure:* Three prioritized research questions.
      *   *Content per Question:* The Question, Why Upstream, Feasibility (3 years), Move Up/Down conditions.
      *   *The "Person vs. Hospital" Distinction:* A dedicated section to untangle this conflation.
      *   *Conclusion:* Summary of the trajectory.

  8.  **Final Polish:** Check tone (collegial, expert), ensure all constraints from the prompt are met (reasoning over list, specific concepts addressed). *Self-check: Did I explain why the Parfitian move matters?* Yes, in Q1. *Did I address the contentment?* Yes, in Q2. *Did I separate ontology from policy?* Yes, in the final section.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "do metaphysics." I need to explain *why* a specific metaphysical view (like Parfit's) changes the ethical outcome. If they are different people, the AD is a donation of body/resources, not a refusal of treatment *by* the patient. That's a huge shift. I need to highlight that.

  Also, the "Ulysses" point: If the selves are different, a Ulysses contract doesn't work the same way. You can't bind a stranger. I should mention that.

  Okay, ready to write.
answer: |-
  This is a profound assignment. You are describing the exact friction point where abstract metaphysics collides with the visceral reality of clinical care. The daughter's comment—"the woman in that bed isn't my mother"—is not sentimental confusion; it is a precise metaphysical claim with normative consequences. If she is right, you are not treating a patient who refused treatment; you are treating a new entity based on the will of a deceased predecessor.

  For a three-year PhD project to be useful to a hospital ethics committee, it cannot remain in the clouds of pure ontology, nor can it descend immediately into policy checklists. It must bridge the two. The student needs to build a normative framework that can withstand the "different person" objection while offering actionable guidance for the committee.

  Here is the research agenda I would propose, ordered by logical dependency (upstream to downstream), with an analysis of feasibility and the specific conceptual traps you identified.

  ### 1. The Normative Weight of Psychological Discontinuity
  **The Question:** *Does the authority of an advance directive survive the severing of psychological continuity, and if so, on what ground?*

  **Reasoning for Priority (Upstream):**
  This is the foundational question. Every other decision in your committee depends on the answer. If the dementia patient is the *same person* as the AD writer (numerical identity holds), then the AD is an expression of current autonomy (via precedent autonomy). If they are *different persons* (as the daughter suggests, and as Parfitian reductionism might allow), the AD is not a current instruction but a constraint imposed by a stranger (the past self) on a new subject.
  You asked about the "reverse-Parfit" move. This is where it belongs. A standard view is that if personal identity is weak, AD authority collapses. The "reverse" argument is that if the dementia patient is a *new* person, the past self's rights to dispose of their shared body/resources might actually be *stronger* (like a will), but the current self's rights to *live* might also be independent. A PhD student can make progress here because the literature is rich (Dresser, Robertson, Parfit, Schechtman) but unsettled in application. They can map the conditions under which "precedent autonomy" retains moral force despite psychological rupture.

  **Feasibility (3 Years):**
  High. This is conceptual work. It requires mastering the identity literature and testing it against case law and bioethical frameworks. It does not require longitudinal empirical data, which would be impossible in three years.
  *Move Up if:* Your committee finds that the "they aren't the same person" argument is the primary driver of family conflict.
  *Move Down if:* Legal counsel informs you that state law mandates AD compliance regardless of philosophical status (though this makes the ethical work harder, not easier).

  **Dead End Warning:**
  Do not let the student get bogged down in proving *whether* they are the same person metaphysically. That is a trap. The research must focus on the *normative significance* of the discontinuity. Even if they are metaphysically the same, does the *loss of capacity to value* negate the prior values? That is the ethical question, not the ontological one.

  ### 2. The Epistemology of Well-Being in Cognitive Impairment
  **The Question:** *When a patient with severe dementia appears content, is that contentment a valid moral interest that can override a prior refusal of treatment?*

  **Reasoning for Priority (Midstream):**
  Once you establish *who* has authority (Question 1), you must weigh *what* is at stake. You mentioned the "pudding" problem. If the current self is a distinct moral patient (or even the same one with altered values), their current well-being matters. But is "enjoyment of pudding" sufficient well-being to justify life-sustaining treatment that the prior self deemed undignified?
  This addresses your point about contentment as a symptom. If the contentment is a result of frontal lobe degradation (anosognosia or apathy), does it carry the same moral weight as a competent preference? A philosophical framework of well-being (hedonistic vs. objective list vs. desire satisfaction) is needed here. If we adopt an objective list theory, "dignity" might outweigh "pleasure." If we adopt hedonism, the pudding wins. The student must argue which theory of well-being applies to patients who cannot articulate a life narrative.

  **Feasibility (3 Years):**
  Moderate to High. This requires interfacing philosophy of mind/ethics with psychiatry/neurology literature. The student needs to define "authentic preference" in the context of neurological change.
  *Move Up if:* Your committee cases frequently involve patients who are not just "content" but actively resisting the AD (e.g., trying to pull out tubes).
  *Move Down if:* The clinical consensus is that "contentment" in this stage is universally regarded as non-autonomic (purely reflex), rendering the philosophical nuance moot (though I doubt this is true).

  **Dead End Warning:**
  Avoid the empirical question of "are they really happy?" That is for psychologists. The philosophical question is "if they are happy, does it count?" Do not let the project become a study on dementia symptoms.

  ### 3. The Institutional Ethics of Stewardship and Risk
  **The Question:** *What is the hospital permitted to do when moral authority is ambiguous, and how does institutional liability distort ethical decision-making?*

  **Reasoning for Priority (Downstream):**
  This addresses your final request: distinguishing what a person *is* from what a hospital is *permitted to do*. Even if the student concludes that the Past Self's authority is morally binding (Q1) and the Present Self's contentment is insufficient to override it (Q2), the hospital may still be legally or institutionally barred from withdrawing care.
  This question shifts from "What is the right thing?" to "What is the permissible thing?" It treats the hospital as a moral agent with its own duties (to the law, to staff conscience, to public trust). This is where the "Ulysses contract" analysis belongs. A Ulysses contract works if the agent is binding *themselves*. If the hospital is a third party enforcing a contract between two distinct selves (Past and Present), the enforcement mechanism changes. This is the policy-output phase of the PhD.

  **Feasibility (3 Years):**
  High, provided the student has access to legal/ethical guidelines. This is normative political philosophy applied to institutions.
  *Move Up if:* Your attendings are primarily driven by fear of litigation rather than ethical uncertainty.
  *Move Down if:* You are looking for pure theory. This is the "applied" section, so it must come last.

  ---

  ### Sorting the Conflation: Ontology vs. Permission

  You asked to sort out the difference between questions about *what a person is* and questions about *what a hospital is permitted to do*. This conflation is likely why your committee improvises. Here is the distinction the PhD student must enforce:

  **1. Questions of Ontology and Moral Status (The Person)**
  *   *Examples:* "Is the dementia patient the same person as the AD writer?" "Does the current contentment constitute a valid preference?" "Did the past self have the right to bind the future self?"
  *   *Nature:* These are truth-apt claims about the moral landscape. They determine *who* has rights and *what* those rights are.
  *   *Resolution:* Resolved through philosophical argument and ethical reasoning.
  *   *Risk:* If you treat these as policy questions, you create inconsistent precedents. (e.g., Honoring the AD in Case A because the family was quiet, ignoring it in Case B because the family was loud, without a principled difference in the patient's status).

  **2. Questions of Institutional Permission and Procedure (The Hospital)**
  *   *Examples:* "Can we withdraw feeding without a court order?" "Does the attending have the right to refuse to carry out the AD based on conscience?" "What documentation protects the committee from liability?"
  *   *Nature:* These are questions of authority, jurisdiction, and risk management. They determine *how* we enact the moral truth within a legal and bureaucratic system.
  *   *Resolution:* Resolved through law, policy, and risk assessment.
  *   *Risk:* If you treat these as ontological questions, you allow legal fear to dictate moral truth. (e.g., "We must feed him because we might get sued," which implicitly asserts "The patient has a right to be fed," even if the ethics say otherwise).

  **Why this matters for the PhD:**
  The student's thesis should argue that **most hospital ethics failures occur when Institutional Permission questions masquerade as Ontological questions.**
  *   *Example:* The committee ignores the AD not because they believe the Past Self lacks authority (Ontology), but because they lack a legal mechanism to verify it safely (Permission).
  *   *The Fix:* The PhD should propose a "Safe Harbor" protocol. If the Ontological criteria are met (e.g., AD is specific, discontinuity is verified), the Institutional Permission should automatically follow, shielding the doctors from liability. This separates the *truth* of the case from the *risk* of the decision.

  ### Summary of the Agenda

  1.  **Year 1 (The Foundation):** Establish the normative authority of the Past Self despite psychological discontinuity. (Address the Parfitian/Daughter challenge).
  2.  **Year 2 (The Conflict):** Develop a framework for weighing Present Self well-being (contentment) against Past Self values (dignity/autonomy). (Address the "pudding" and "symptom" challenge).
  3.  **Year 3 (The Application):** Design an institutional protocol that aligns hospital permission with the ethical conclusions of Years 1 and 2, separating liability management from moral reasoning. (Address the "what is a hospital" challenge).

  This order ensures that when you sit on the committee, you aren't just asking "Can we do this?" (Permission), but "Is this right?" (Ontology/Ethics), and finally "How do we do it safely?" (Policy). If the student can deliver a framework that allows you to answer the daughter by saying, "You are right that she has changed, but here is why her earlier promise still binds us," or "You are right, and here is why we are setting the directive aside," you will have solved the recurring nightmare.
