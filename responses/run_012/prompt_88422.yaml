  3. Elara's stylus hovered over the signature pad. The opposing counsel, a senior auditor from the Capital known for his rigid interpretations, leaned forward. "Implementational triviality," he murmured, his voice amplified by the room's acoustics. "If we define the mapping between physical state and logical state loosely enough, a wall implements a word processor. A rock implements a chess game." He tapped the glass casing with a manicured nail. "Is this mould computing warnings, or are we simply reading warnings into its hunger spasms?" Elara felt a cold knot tighten in her stomach. She remembered her own Certification hearing, ten years prior. The Tribunal had mapped her neural firing patterns to the standard cognitive architecture. But the mapping was generous. It had to be. If the grain of the neural tissue mattered, if the specific chemistry wasn't interchangeable with the abstract role, the functionalist doctrine collapsed. She was certified because the law needed her to be. Now, looking at the slime, she saw the same generous mapping applied to protoplasm. If she denied Old Yellow, she undermined the logic that certified her. If she certified him, she admitted that any system could be a mind if interpreted charitably enough. The triviality of implementation threatened to dissolve the distinction between a thinker and a stone.

  4. "Where does the system end?" Elara asked, her voice cutting through the hum of the air recyclers. The Mayor blinked, confused by the shift from validity to boundaries. "The mould," he said. "But the sensors are steel," Elara countered. "The power comes from the town grid. The data inputs are human observations logged into the network." She traced the boundary on her screen, highlighting the feedback loops. The functional role was distributed. The 'belief' about the tide wasn't in the slime alone; it was in the coupling of slime, sensor, and town. To certify the mould was to carve a boundary around a process that leaked into the ecosystem. It was the disjunctive gerrymander problem: defining the mind as 'slime OR sensor OR human logger' made the property so broad it lost meaning. If the mind was the whole coastal arrangement, then the town itself was the respondent, a collective entity the law wasn't designed to handle. If the mind was just the slime, the causal role was incomplete, dependent on external props. The doctrine demanded a closed system; biology offered only open flows.

  5. The session adjourned without a ruling. Elara sat alone in the chamber, the amber light of the maxim reflecting in the glass casing of the mould. It continued its slow, blind exploration, seeking nutrients in the agar, unaware of its legal status. It was functionally equivalent to a mind, by the letter of the law. It was potentially just a biological machine, by the grain of the stuff. She looked at her own hand, flesh and bone, certified ten years ago under the same presumption of substrate neutrality. The triviality haunted her: if any system could be read as implementing any program, then certification was merely an act of interpretive charity, a political decision masked as metaphysics. She lifted the stylus. To sign was to accept that the map was the territory, that the role was everything. To refuse was to admit the law was broken, that the medium mattered after all. The amber light flickered, casting long shadows across the racks. Elara set the stylus down. The file remained open. The mould pulsed, waiting for a definition it did not need, while the assessor waited for a certainty the doctrine could not provide.
