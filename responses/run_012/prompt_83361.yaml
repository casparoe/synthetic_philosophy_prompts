answer: |-
  (1) Essay Question

  **Final Examination: Decision-Making Under Uncertainty**
  **Time Allowed: 90 Minutes**
  **Total Marks: 20**

  **Question 1**

  Consider a scenario where nine national laboratories each possess the technical capacity to unilaterally release a sterile mosquito strain intended to suppress malaria. Each lab director receives an independent scientific assessment estimating the net global value of the release. These estimates are noisy: each is the true value plus a random error term drawn from a symmetric distribution centered on zero. A director releases the strain if and only if their specific estimate suggests a positive net value.

  (a) Derive the statistical consequence of increasing the number of laboratories ($n$) capable of acting. Specifically, show why the probability of release does not converge to zero even if the true global value is negative as $n$ grows large. Explain what observing a release tells an outside observer about the true value of the project versus the distribution of actors. (8 marks)

  (b) Critically evaluate the assumptions underpinning this result. Does the argument require the errors to be independent? Does it require the actors to estimate a common value, or does it hold if actors have genuinely different stakes (e.g., local benefit vs. global cost)? How does the argument change if risk-tolerant actors self-select into the pool of potential releasers? (4 marks)

  (c) A colleague claims this scenario is identical to the "winner's curse" in common-value auctions. Identify the shared mechanism between the two phenomena. Then, explain the critical disanalogy regarding who absorbs the cost of error and whether a price mechanism exists to correct behavior. (4 marks)

  (d) Does this analysis support a "Principle of Conformity" (act only if you would be content for everyone in your position to act)? Clarify whether this principle rests on universalizability or consequentialist reasoning about the distribution of actors. Confirm whether the agents in your model are behaving irrationally. Finally, propose two structural fixes that would mitigate the curse and explain why moral suasion alone typically fails. (4 marks)

  ***

  (2) Model Answer

  The unilateralist's curse arises from the statistical properties of extreme values in a distribution of estimates. In the mosquito scenario, each director acts on a private signal $S_i = V + \epsilon_i$, where $V$ is the true global value and $\epsilon_i$ is noise. Action occurs if $\max(S_i) > 0$. Even if $V$ is negative, as the number of capable laboratories $n$ increases, the maximum realized noise term $\max(\epsilon_i)$ tends toward the upper bound of the error distribution. In the large-$n$ limit, the probability that at least one agent receives an sufficiently optimistic error to outweigh the negative $V$ approaches one. Consequently, the action is taken systematically regardless of its actual merit. Observing that "somebody acted" loses its informational value regarding $V$; it signals only that the pool of actors was large enough or the variance high enough to generate an outlier, not that the project is beneficial.

  This derivation relies on specific load-bearing assumptions. Independence of errors is crucial; if errors are correlated (e.g., all labs rely on the same underlying data), the tail of the distribution does not stretch with $n$, and the bias diminishes. The argument also requires a common value structure. If actors have genuinely different stakes, such as a coastal state capturing local economic benefits while imposing global ecological costs, the divergence is not epistemic noise but conflicting preferences. In that case, the overproduction is a tragedy of the commons driven by incentives, not a unilateralist curse driven by uncertainty. Similarly, if risk-tolerant types self-select into the pool of potential actors, the error term is no longer exogenous noise but endogenous bias. The "noise" becomes systematically positive for that population, breaking the assumption of unbiased estimation.

  The comparison to the winner's curse is instructive but incomplete. Both phenomena share a selection mechanism: the outcome is determined by the most optimistic estimate in a pool. In an auction, the winner is the bidder who most overestimates the value. However, the critical disanalogy lies in cost absorption and feedback. In an auction, the winner pays their bid; the cost of their optimism is internalized through the price mechanism, providing a corrective signal for future bidding. In the unilateralist scenario, the cost of the error lands on third parties who never agreed to the action. There is no price doing work to penalize the optimist, and thus no market correction prevents the recurrence of the error.

  Regarding normative implications, the analysis supports a Principle of Conformity, but not on Kantian grounds. The argument does not claim that unilateral action is inherently contradictory if universalized. Rather, it is consequentialist reasoning: because the systemic outcome of independent acting is overproduction of harmful acts, an individual should restrain themselves to avoid contributing to that statistical certainty. Importantly, none of this requires the agents to be irrational. The curse bites even with perfectly unbiased, well-calibrated agents maximizing expected utility based on private information. To mitigate this, structural fixes are required. Coordination mechanisms that pool estimates before acting reduce variance. Deference to the most pessimistic actor lowers the threshold for action. Regulation or secrecy that makes the action non-unilateral removes the capacity for independent execution. Moral suasion alone typically fails because it asks agents to ignore their private signals without changing the incentive structure or information asymmetry that generates the curse.

  ***

  (3) Marking Scheme

  **1. Derivation and Informational Value (4 marks)**
  *Must Hit:* Correctly explains that as $n \to \infty$, $\max(\epsilon_i)$ outweighs negative $V$, ensuring action; notes that observing action signals pool size/variance, not true value.
  *Typical Failure:* Candidates assert the bias exists but fail to explain the extreme value statistics or claim observing action confirms the project is good.

  **2. Assumptions and Stakes (4 marks)**
  *Must Hit:* Identifies independence and common value as load-bearing; distinguishes epistemic error from conflicting stakes (externalities) or endogenous selection bias.
  *Typical Failure:* Candidates treat all disagreement as "noise" or fail to distinguish between conflicting interests and estimation errors.

  **3. Winner's Curse Comparison (4 marks)**
  *Must Hit:* Identifies shared selection-on-optimism mechanism; distinguishes based on internalization of cost (price vs. externality) and lack of corrective feedback.
  *Typical Failure:* Candidates claim the phenomena are identical or focus on superficial differences like "money vs. nature" rather than incentive structures.

  **4. Normative Principle and Rationality (4 marks)**
  *Must Hit:* Clarifies Principle of Conformity is consequentialist (avoiding bad systemic outcomes), not universalizability; confirms agents are rational/unbiased.
  *Typical Failure:* Candidates argue agents are irrational or frame the principle as a deontological duty rather than risk management.

  **5. Structural Fixes (4 marks)**
  *Must Hit:* Proposes coordination, deference, or regulation as effective; explains why moral suasion fails (doesn't alter structure/information).
  *Typical Failure:* Candidates suggest "better education" or "ethical training" without explaining why these fail to solve the statistical problem.
