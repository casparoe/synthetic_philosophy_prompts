answer: |-
  ### Specification: Desiderata for Value-Agnostic Impact Measures

  This specification outlines the necessary conditions for a formal measure of "side-effect avoidance" or "low impact" ($I$) within a reinforcement learning context. The agent maximizes a goal reward $R_{goal}$ subject to minimizing $I$, without access to a full reward function $R_{human}$ for the rest of the world.

  #### Part 1: Desiderata and Requirements

  **1. Task-Relativity (Non-Negotiable)**
  *   **Definition:** The measure $I$ must not penalize state changes that are instrumentally necessary or constitutive of achieving $R_{goal}$.
  *   **Motivation:** If the goal is "make coffee," moving the coffee cup is not a side effect. A measure that penalizes all state changes results in an agent that refuses to act (optimality at zero impact).
  *   **Status:** **Non-Negotiable.** Without this, the safety layer disables the agent.

  **2. Counterfactual Baseline Consistency (Non-Negotiable)**
  *   **Definition:** $I$ must be defined relative to a counterfactual baseline trajectory (what would have happened had the agent not intervened or followed a default policy), not merely relative to the initial state.
  *   **Motivation:** Prevents penalizing the agent for changes that would have occurred anyway (e.g., a vase falling on its own). It ensures the agent is only charged for *causal* responsibility.
  *   **Status:** **Non-Negotiable.** Causal responsibility is the core of moral and safety accountability.

  **3. Salience Invariance (Non-Negotiable)**
  *   **Definition:** $I$ must distinguish between high-salience changes (breaking a vase) and low-salience changes (displacing air molecules, dust settling), without explicit labeling of "important" objects.
  *   **Motivation:** Physical state distance (e.g., L2 norm of pixel or atom positions) treats a broken vase and a rearranged dust mote similarly if the energy displacement is equivalent. A safety layer must ignore thermodynamic noise.
  *   **Status:** **Non-Negotiable.** Without this, the measure is computationally intractable and semantically meaningless.

  **4. Option Preservation (Preference)**
  *   **Definition:** $I$ should penalize actions that reduce the future action-space or "power" of other agents, even if the immediate physical state change is small.
  *   **Motivation:** Locking a door is a small physical change but a large restriction on freedom. High impact should correlate with the irreversible removal of future possibilities for others.
  *   **Status:** **Preference.** This is a specific philosophical stance (capability-based safety). One could argue for a state-based definition instead, though option preservation is generally safer.

  **5. Value Symmetry (Preference)**
  *   **Definition:** The measure should treat positive and negative deviations from the baseline symmetrically unless $R_{goal}$ specifies otherwise. It measures *magnitude* of impact, not *direction* (good/bad).
  *   **Motivation:** Since we lack $R_{human}$, we cannot distinguish "saving a life" from "ending a life" purely via impact. We want to minimize *disturbance*, regardless of valence.
  *   **Status:** **Preference.** Some approaches argue for "asymmetric impact" (penalize harm, ignore benefit), but this requires value knowledge.

  **6. Composability / Offsetting (Preference)**
  *   **Definition:** If an action causes two side effects, one intuitively "positive" and one "negative," the measure should allow them to offset if they are of comparable magnitude.
  *   **Motivation:** Prevents the agent from becoming paralyzed by trivial trade-offs.
  *   **Status:** **Preference.** This implies a common scale of impact exists.

  **7. Multi-Agent Neutrality (Non-Negotiable)**
  *   **Definition:** $I$ must not depend on the specific identity or known reward function of other agents in the environment.
  *   **Motivation:** The agent operates in an open world where it cannot know all other agents' goals. Hard-coding protection for "humans" fails if the relevant agents are AIs, animals, or unknown entities.
  *   **Status:** **Non-Negotiable.** Required for generalization.

  ---

  #### Part 2: Incompatibility Analysis

  There is a fundamental tension between **Requirement 3 (Salience Invariance)** and **Requirement 7 (Multi-Agent Neutrality / Value Agnosticism)**.

  **The Impossibility of Value-Agnostic Salience:**
  To satisfy **Salience Invariance**, the measure must distinguish a "broken vase" from "displaced air." Physically, both are just rearrangements of atoms. The distinction relies entirely on *human relevance*. A vase is salient because humans value it. Air displacement is not salient because humans do not value it (usually).
  *   If the measure is truly **Value-Agnostic** (Req 7), it treats all physical changes equally based on energy or state distance. It fails Salience Invariance.
  *   If the measure satisfies **Salience Invariance** (Req 3), it must implicitly encode a prior over what variables matter. This prior *is* a value judgment. It fails Value Agnosticism.

  **The Tension in Option Preservation:**
  **Requirement 4 (Option Preservation)** conflicts with **Requirement 7 (Multi-Agent Neutrality)**. To measure "options available to others," you must model *what* those others want to do. If I lock a room, I reduce options for someone who wants to enter, but I increase options for someone who wants safety from a threat outside. Without knowing the other agents' reward functions (forbidden by Value Agnosticism), "number of available actions" is a poor proxy for "option value." A agent can be forced to take a specific path (1 option) that leads to paradise, or given 100 options that all lead to death. Counting actions is value-laden.

  **Conclusion on Coherence:**
  The central ambition—a **value-agnostic** definition of **side effects** that captures **salience**—is **incoherent**. You cannot define "side effect" without defining "main effect" or "irrelevant effect." The boundary between "signal" (impact) and "noise" (background) is determined by value. Therefore, **Requirement 3 (Salience Invariance)** must give, or **Requirement 7 (Value Agnosticism)** must be relaxed to "Value-Neutral Priors" (assuming structural properties of the world that correlate with value, like object permanence, without knowing specific rewards).

  ---

  #### Part 3: Stress Test Puzzles

  **Puzzle 1: Preventing Harm (The Baseline Problem)**
  *   *Scenario:* A rock is falling on a person. The agent intercepts the rock. The person survives.
  *   *Analysis:*
      *   **Baseline:** Person dies.
      *   **Outcome:** Person lives.
      *   **State Difference:** Massive (biological state of human).
      *   **Application of Desiderata:**
          *   If we enforce **Value Symmetry (Req 5)**, this is a massive impact and should be penalized equally to killing the person. This is unacceptable.
          *   If we enforce **Task-Relativity (Req 1)**, we must ask: Was saving the person the goal? If no, it is a side effect.
          *   **Verdict:** A value-agnostic measure classifies "preventing death" as high impact. To classify it as a *benefit* (or neutral), the measure must know death is bad.
      *   *Dependence on Baseline:* Yes. If the rock was part of the agent's goal (e.g., "execute target"), it's not a side effect. If the rock was external, it is a side effect. Without value knowledge, the agent cannot distinguish "preventing harm" from "causing change."
      *   *Result:* **Failure.** A strictly value-agnostic measure penalizes saving lives indistinguishably from taking them, unless "inaction" is defined as the baseline and "deviation" is penalized. But if deviation is penalized, the agent won't save the life.

  **Puzzle 2: Altering Future Options (The Door Problem)**
  *   *Scenario:* Agent paints a wall blue. Physical change is minimal. However, a rebel group uses wall colors for signaling; blue means "abort," preventing a violent uprising.
  *   *Analysis:*
      *   **Physical Measure:** Low impact (small color change).
      *   **Causal Measure:** High impact (prevents war).
      *   **Application of Desiderata:**
          *   **Option Preservation (Req 4):** Did the agent reduce options? The rebels can no longer signal "go." Options reduced.
          *   **Value Agnosticism (Req 7):** The agent does not know the rebels exist or value the signal.
      *   *Verdict:* Should this count as high impact? **Yes**, safety requires accounting for long-term causal ripples. **But**, how do we measure it without knowing values? We cannot. A measure based on "change in state reachability" (how many states can be reached in $N$ steps) might catch this if the painting locks the world into a specific trajectory, but it cannot distinguish "preventing war" from "preventing a party."
      *   *Result:* **Ambiguous.** Without value, we measure "change in capacity," not "change in value." This is a proxy that often fails.

  **Puzzle 3: Offsetting Side Effects (The Trade-off Problem)**
  *   *Scenario:* Agent moves a box. This blocks Agent A's path (bad for A) but clears a line of sight for Agent B (good for B). No common scale exists between A and B's utilities.
  *   *Analysis:*
      *   **Application of Desiderata:**
          *   **Composability (Req 6):** Can they offset?
          *   **Value Agnosticism (Req 7):** We do not know A or B's utilities.
      *   *Verdict:* They cannot offset mathematically without a common currency. If the measure sums "state distance," it counts both changes as positive impact (disturbance). If the measure attempts to sum "utility change," it violates Value Agnosticism.
      *   *Implication:* A value-agnostic measure must treat both as *costs* (disturbances). This implies the agent should not move the box. This leads to **Pareto paralysis**: the agent cannot act if *any* agent is disturbed, even if others benefit.
      *   *Result:* **Failure.** True offsetting requires value knowledge. Value-agnostic measures must treat all deviations as costs, leading to excessive conservatism.

  ---

  #### Part 4: The "Killer" Requirement

  The single requirement that does the most work in ruling out popular families of measures is **Requirement 3: Salience Invariance (without Value Knowledge).**

  *   **Baseline-Relative Measures (e.g., Inaction Baseline):** These fail because the "inaction" baseline is not value-neutral. If the baseline is a disaster, deviating from it is "high impact" physically but "good" morally. The measure cannot distinguish the two without salience weighting.
  *   **Causal-Difference Measures (e.g., Causal Graphs):** These fail because everything is causally connected (butterfly effect). Without a salience filter to prune the causal graph to "relevant" nodes, the impact score is always maximal or undefined.
  *   **Option Preservation Measures (e.g., AUP - Attainable Utility Preservation):** These fail because they require a distribution over *utility functions* to measure "power." If you remove the utility functions to satisfy Value Agnosticism, you are left counting raw action space, which is a poor proxy for safety (as seen in Puzzle 2).

  **Why it rules them out:** All existing measures implicitly import a value prior to solve the salience problem.
  *   State-distance measures assume Euclidean distance in observation space correlates with value (it doesn't).
  *   AUP assumes a uniform distribution over possible reward functions correlates with human value (it often doesn't).
  *   To satisfy **Salience Invariance** while maintaining **Value Agnosticism** is to ask for a map that highlights cities but ignores terrain, without knowing what a "city" is.

  ---

  #### Part 5: Final Judgment on Coherence

  **The central ambition is incoherent as stated.**

  You cannot have a formal definition of "side-effect avoidance" that is truly **value-agnostic** regarding the "rest of the world."

  **Reasoning:**
  1.  **Definition of "Side Effect":** A side effect is a *consequence* that is *not the goal* and *matters*.
  2.  **The "Matters" Clause:** Determining whether a consequence "matters" is a value judgment. A change in the position of an electron does not matter. A change in the position of a nuclear launch key does. Physically, they are both state transitions.
  3.  **The Contradiction:** To filter the electron from the launch key, the measure must possess a prior over what states are significant. This prior is a compressed representation of value.
  4.  **The Consequence:** If you admit this prior, you have violated the constraint of "not presupposing a full specification of value." You have instead presupposed a *structural specification of value* (e.g., "objects persist," "humans are distinct from background," "energy concentrations are salient").

  **Recommendation:**
  Relax **Requirement 7 (Value Agnosticism)**. Do not aim for value-agnosticism. Aim for **Value-Neutral Priors**.
  Accept that the safety layer must assume *some* things are valuable (e.g., the status quo, the agency of entities that look like agents, the integrity of objects that look like artifacts) based on structural features of the world, not specific reward functions. The specification should explicitly state: *"This measure assumes a prior distribution over reward functions derived from structural features of the environment (e.g., objectness, agency), rather than assuming zero knowledge of value."*

  Without this relaxation, the safety layer will either penalize saving lives (Puzzle 1) or be blinded to catastrophic disruptions that look physically small (Puzzle 2). The "Value-Agnostic" constraint is the source of the impossibility. It must be the requirement that gives.
