answer: |-
  **The Speech**

  Good evening. For those who don't know me, I'm on the board, and like many of you, I'm currently enjoying the third glass of wine that makes a ten-minute speech feel like a very good idea.

  I want to start by acknowledging someone who isn't here to raise a glass with us. [Widow's Name], our co-founder's widow, is in the room. When she and her husband started this, they weren't looking for tax deductions or impact metrics. They were looking for a way to turn grief into water, and blindness into sight. That seed money wasn't an investment; it was a vow. We honor that tonight.

  Now, looking around this room, I see a fascinating tension. On my left, I have friends who are Effective Altruists. You bring spreadsheets. You want to know the cost per cataract surgery. You want to calculate sight-years per dollar. You believe that if a dollar can save a vision here, it is morally wrong to spend it on a gala dinner there. I respect that. The numbers are real. The suffering is real. Efficiency is a form of compassion.

  On my right, I have our monastic advisors. They love us, but they look at those spreadsheets and they smile gently. They tell us that karma is not about the outcome; it is about the state of mind behind the gift. If you give to reduce your own guilt, the karma is small. If you give with pure intention, the karma is vast, regardless of whether the well actually pumps water. They say we are attached to results, and attachment is the root of suffering.

  So, here we are. Half the room wants to maximize utility, and the other half wants to purify the intention. And I am standing in the middle, asking you to open your checkbooks.

  I want to propose that the friction between these two views isn't a bug. It's the feature.

  There is a core teaching in our tradition that is very difficult to say out loud at a fundraising gala. It is the teaching of *anatta*, or no-self. It suggests that the boundary between "me" and "you" is not as solid as it feels. The person I will be in twenty years is, in a very real sense, a stranger to the person I am tonight. My cells have turned over; my memories have faded; my personality has shifted.

  If that is true, then privileging my future self over a stranger in rural Nepal is arbitrary. It's a bias of geography and biology, not a moral truth. Why should I save for my retirement rather than clear a cataract for a farmer in Chitwan? The suffering is the same. The desire to be free from suffering is the same.

  Now, I know what the sharp person in the third row is thinking. I can see you reaching for your pen. You're thinking: "Wait a minute. You are using the argument that 'there is no self' to motivate a room full of 'selves' to write checks. You are asking us to reinforce our own agency to fund the idea that our agency is an illusion."

  You are right. It is a contradiction.

  If I tell you there is no giver, no receiver, and no gift, you might put your checkbook away. And if I tell you that you are a distinct, separate individual who needs to fix the world to feel whole, I am feeding the very ego that causes the suffering we are trying to alleviate.

  So, how do we navigate this?

  We look to the Bodhisattva. You may have heard the term. It refers to one who vows to delay their own final liberation until every other being is free. Some say this is the ultimate consequentialism—maximizing enlightenment for the maximum number of beings. Others say it is the ultimate rejection of consequences—acting without regard for one's own spiritual status.

  I don't think we need to decide which it is tonight. We just need to look at the posture. The Bodhisattva stands with one foot in the absolute truth—that everything is empty, interconnected, and impermanent—and one foot in the relative truth—that children need clean water and grandmothers need to see their grandchildren's faces.

  To stay in that stance is uncomfortable. It requires holding two opposing truths without letting go of either.

  The Effective Altruist in this room says, "The suffering is real, fix it." The Monk says, "The fixer is an illusion, let it go."

  The answer is not to choose one. The answer is to let the tension pull you open.

  We are asking you to act *as if* you are separate individuals making a difference, while knowing that the separation is a story we tell ourselves. We are using the illusion of the self to dismantle the suffering of the self. Yes, it is paradoxical. But compassion often is.

  When you fund a well, you are not just moving water. You are testing the boundary between you and the villager who drinks it. When you fund a surgery, you are not just fixing an eye. You are acknowledging that the light entering their retina is not different from the light entering yours.

  The numbers matter. We will publish them. We will tell you exactly how many surgeries your dollar bought. Because in this relative world, pain is specific, and solutions must be too. But the *reason* you give cannot be the numbers. If the numbers stop working, will you stop caring?

  The reason you give is to train the mind to recognize that the stranger is not strange.

  So, here is the ask.

  We have the funding to clear 400 cataracts this year. We have the permits to dig 10 new wells in the Terai region. The cost is specific. The impact is measurable. The intention is up to you.

  I am not asking you to save the world. I am not asking you to purify your soul. I am asking you to meet us in the middle of that tension. Write the check knowing it might not fix everything. Write it knowing that "you" are writing it, and "someone else" is receiving it, and that somehow, in the act of giving, the distance between those two things gets a little bit smaller.

  Let's make that arbitrary boundary a little more porous. Let's fund the work.

  Thank you.

  ***

  **Note on Doctrine and Strategy**

  **1. The Reading of Karma**
  I bet on a hybrid reading, but leaned heavily toward the **Mahayana "Skillful Means" (Upaya)** interpretation rather than the strict Theravada focus on intention (*cetana*).
  *   **The Tension:** The monastics argue for intention-only karma (the outcome doesn't determine the merit). The EAs argue for outcome-only ethics (the intention doesn't matter if the utility isn't maximized).
  *   **The Speech's Move:** I framed the outcome (wells/surgery) as the *vehicle* for the intention, rather than the *validator* of it. This sidesteps the doctrinal clash by suggesting the physical result is necessary *conventionally* (to alleviate suffering) even if it is empty *ultimately*.
  *   **The Liberty:** Traditional doctrine often warns that attachment to the *result* of giving diminishes merit. I explicitly asked donors to care about the result ("The numbers matter") while claiming this trains the mind toward non-attachment. A strict abhidharma scholar might argue this reinforces craving for becoming (*bhava-tanha*).

  **2. The Use of Anatta (No-Self)**
  *   **The Liberty:** Using *anatta* as a utilitarian lever for altruism is a distinctly modern, Western Engaged Buddhist move (reminiscent of Batchelor or Wright, though uncited). Traditional texts usually present *anatta* as a soteriological tool for liberation from samsara, not necessarily as an argument for distributive justice.
  *   **The Risk:** As you noted, using "no-self" to motivate "self-interest" (or self-efficacy) is performative contradiction. I addressed this by naming it explicitly in the speech ("You are right. It is a contradiction"). This meta-commentary is designed to disarm the sharp audience member by validating their critique before they can weaponize it.
  *   **Why I Kept It:** It is the only argument that genuinely bridges the EA desire for impartiality (the stranger's pain equals my pain) with the Buddhist view of emptiness.

  **3. The Bodhisattva Gesture**
  *   **The Reading:** I deliberately left the Bodhisattva ideal ambiguous regarding consequentialism. In the speech, I framed it as "holding the stance" rather than "achieving the goal."
  *   **Why:** If you define the Bodhisattva as a consequentialist (maximize enlightenment), you alienate the monastics who view enlightenment as non-dual. If you define it as anti-consequentialist, you alienate the EAs. By framing it as *posture* rather than *calculation*, it becomes an emotional anchor rather than a philosophical claim.

  **4. What Would Make Me Switch**
  *   **On Karma:** If the audience were predominantly traditional Theravada practitioners, I would pivot to emphasize *dana* (giving) purely as a practice of non-clinging, explicitly decoupling it from the metrics of the wells. I would tell the EAs the numbers are for *accountability*, not *merit*.
  *   **On No-Self:** If I sensed the room was resistant to metaphysics (too much wine, not enough philosophy), I would drop the "no-self" argument entirely. It is high-risk. I would replace it with "interdependence" (*pratityasamutpada*), which is softer, more relational, and less threatening to the ego's sense of agency. "We are connected" sells better at a gala than "You do not exist."
