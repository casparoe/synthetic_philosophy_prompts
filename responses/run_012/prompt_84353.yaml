answer: |-
  To run this simulation effectively within a seventy-five minute window, you need to transform the seminar room into a space of constrained interaction where the physical arrangement mirrors the social distance you want the students to feel. Begin by rearranging the furniture so that there are two distinct zones, perhaps separated by a clear aisle that will serve as the street in the final round, and divide the sixteen participants into two equal groups of eight, designating one half as Locals of Rill and the other as Visitors. You should prepare two distinct sets of instruction cards printed on different colored paper to prevent accidental mixing, and these cards must contain the only information the students are allowed to act upon during the simulation. The Local cards should outline the three specific conventions of Rill along with a strict prohibition against explaining them, while the Visitor cards should provide only a vague objective to integrate into Rill society without causing offense, coupled with a specific private goal that may conflict with the local norms. It is vital that you do not explain the theoretical underpinnings of the session beforehand; instead, frame the activity as an exercise in cross-cultural negotiation where the goal is to maximize individual success points while minimizing social friction, and make it clear that you will be acting as the silent arbiter of Rill law, tracking points on a whiteboard visible to everyone.

  The core mechanic that prevents the simulation from dissolving into immediate clarification is the rule of Implicit Understanding, which you must embed deeply into the payoff structure rather than just stating it as a preference. On the Local cards, write that explicitly explaining a convention to a Visitor counts as a Failure of Hospitality and deducts three points from the Local's score, whereas successfully navigating a interaction where the Visitor intuitively follows the norm awards two points. On the Visitor cards, state that asking a Local directly about the rules counts as a Failure of Integration and deducts three points, while correctly inferring the norm through observation awards two points. This creates a rational incentive for silence on both sides, forcing the Visitors to rely on cues and the Locals to rely on subtle signaling rather than speech, which replicates the real-world awkwardness of not knowing whether a rule is moral or merely habitual. To add the layer of conflict you requested, include a confidential slip within half of the Local decks that designates them as Enforcers who gain bonus points if a Visitor violates the norm, and include a confidential slip within half of the Visitor decks that designates them as Hurried who gain bonus points if they bypass the norm to save time, ensuring that not everyone is playing the same game even within their groups.

  The first round should focus on the convention of tipping, which maps to your distinction regarding status and gift-tracking. Set up a small table where the Locals act as servers and the Visitors must purchase a token representing coffee using a set amount of script money provided to them. The Local convention is that leaving less than twenty percent is considered an insult that implies the server is incompetent, but the Visitors are told only that tips are a gesture of appreciation. The twist here is that the Enforcer Locals are secretly hoping for a low tip so they can penalize the Visitor, while the Hurried Visitors might try to pocket the tip money to meet a budget goal. Allow five minutes for this exchange, during which you should walk around and silently deduct points from anyone who breaks the silence rule by asking or explaining, marking the deduction visibly on the board to create immediate social pressure. This round usually generates the most immediate tension because the financial transaction makes the obligation feel voluntary yet socially coercive, and you will likely see Visitors hovering over the tip jar looking at the Locals for non-verbal confirmation while the Locals struggle to maintain a neutral expression that doesn't betray the expectation.

  The second round shifts to the convention of queueing, which targets the desert-tracking distinction. Designate one student or yourself as the single resource provider, perhaps distributing a necessary form or stamp that everyone needs to proceed to the next stage, and have the students physically line up to access it. The Local convention is a strict first-come-first-served line based on arrival time, but the Visitors are briefed that resources in Rill are distributed based on urgency or proximity. The conflict arises because the Hurried Visitors will attempt to cut in based on their private need, while the Enforcer Locals will stand their ground or subtly block access without verbally asserting their right to the spot. Give them seven minutes to navigate this bottleneck, and ensure that the stakes are high enough that cutting the line actually benefits the Visitor in points, creating a genuine moral dilemma between efficiency and fairness. You will likely observe the Locals forming a passive barrier with their bodies, using physical presence rather than words to enforce the norm, which highlights how conventions are often policed through non-verbal social cues rather than explicit laws, and this physicalizes the burden of enforcement that your colleague wants the students to feel.

  The third round simulates the traffic convention, addressing the coordination distinction where the rule matters only because everyone follows it. Use the aisle you created earlier as a street and have half the group need to cross from one side to the other while the other half monitors safety. The Local convention is to wait for a specific signal from you, the arbiter, regardless of whether the path is clear, whereas the Visitors are told to cross when safe. The Enforcer Locals are instructed to note anyone who crosses without the signal as a safety violation, while the Hurried Visitors gain points for speed. This round should be fast, lasting only five minutes, but it often produces the most visceral reaction because it involves physical risk and collective coordination. When a Visitor crosses safely but without the signal, the Locals will often react with visible shock or disapproval even though no harm occurred, which perfectly illustrates the coordination problem where the breach is wrong only because it undermines the system, not because of the immediate outcome. Throughout all three rounds, you must remain stoic and refuse to answer questions about the rules, redirecting any inquiries back to the participants with a reminder that in Rill, adults are expected to know how to behave, which reinforces the colleague's point about the local's burden to inform or exploit.

  Once the simulation concludes, you have fifteen minutes for a debrief that must avoid lecturing and instead draw the theory out of their frustration. Start by asking the Visitors how it felt to be penalized for rules they could not know, which should surface the intuition that ignorance matters morally, and then ask the Locals how it felt to watch someone break a rule they couldn't explain, which should reveal the burden of enforcement. When they mention the tipping round, guide them to notice that the obligation felt different there than in the queueing round; the tip felt like a relational signal whereas the queue felt like a claim of right, which allows you to introduce your distinction between gift-tracking and desert-tracking conventions without having defined them earlier. When they discuss the street crossing, point out that their anger at the jaywalker was disproportionate to the danger, which highlights the coordination nature of that convention. Then pivot to your colleague's distinction by asking the Locals who knew a Visitor was ignorant whether they felt a duty to warn them despite the point penalty, forcing them to confront whether the obligation to inform overrides the convention of silence. You should write their answers on the board without categorizing them initially, letting the patterns emerge organically before you label the categories of coordination, desert, and status.

  You should anticipate several specific failures that commonly occur in this type of simulation and have recovery strategies ready. The most predictable problem is that graduate students will collude to break the simulation by agreeing verbally to ignore the point system or by explicitly asking the rules despite the penalty, treating the cost as a mere tax rather than a social barrier. If this happens, you must escalate the social cost by publicly shaming the behavior in character as the Rill Arbiter, stating that such explicit negotiation proves they are unfit for integration, which usually restores the frame because students are sensitive to peer judgment. Another failure mode is that the Visitors will simply accept the point deductions passively without feeling the moral weight, treating it as a game loss rather than a normative violation. To counter this, you need to emphasize the social reaction during the rounds; if a Visitor cuts the queue, pause the action and ask the Locals to express their disapproval non-verbally, making the social sanction palpable rather than just numerical. A third risk is that the debrief becomes a complaint session about the game mechanics rather than the moral content; if they focus too much on the points, redirect them by asking how they would feel if the points represented real social standing or employment opportunities, grounding the abstraction in real-world stakes.

  There are limitations to this activity that you must acknowledge to yourself and eventually to the class to maintain intellectual honesty. The simulation cannot reproduce the deep historical embedding of real conventions; in Rill, the rules are arbitrary and recent, whereas in reality, queueing or tipping carries the weight of decades of social practice that gives them a kind of prescriptive force a game rule lacks. You will have to supply this context in the final ten minutes of class by explaining that real conventions are rarely this clean and are often tied to power structures that the game ignores, such as why servers rely on tips due to wage laws rather than mere status scripts. Additionally, the activity cannot fully capture the internal feeling of guilt versus the external fear of penalty; students may follow the rule to win points rather than because they feel obligated, so you will need to press them in the debrief on whether they would have followed the rule if no one was watching and no points were at stake. Finally, the distinction between a visitor who is ignorant and a visitor who is indifferent is hard to simulate in a short round; students know they are playing a role, so their ignorance is simulated rather than genuine, which means you will have to ask them to imagine a scenario where they truly did not know the rule to get at the core of your colleague's argument about excuse and exploitation. Despite these limits, the activity succeeds if it makes the invisible texture of social obligation tangible enough that when you finally name the distinctions, the students feel they have discovered them rather than been taught them.
