  The pessimistic forecast based on the broad class is correct because the optimistic class's membership rule requires survival past a critical early window, silently excluding the most common mode of failure.

  The Kaelish Dominion, an agrarian empire aged one century, faces a forecast question: Will the central authority collect direct taxes from all provinces in Year 120? (Current date: Year 100). Forecaster A uses Reference Class A: "All agrarian empires aged 100+ years." Of 1,000 historical instances, 200 survived to year 120 of their age. Base rate: 20%. Forecast: Unlikely. Forecaster B uses Reference Class B: "Empires that published a Post-Shock Stability Audit in Year 105." Of 250 historical instances, 225 survived to Year 120. Base rate: 90%. Forecast: Likely. Both classes are defensible; A is the standard baseline, while B controls for the specific "Great Severance" shock the Dominion just endured.

  The feature making Class B untrustworthy is the timing of data availability relative to failure. Membership in B requires the publication of an Audit in Year 105. A polity that collapses between Year 100 and Year 105 cannot publish an Audit; thus, the class constitutionally excludes early failures. This is not inside-view knowledge about the Dominion, but a structural fact about audits: they require a functioning bureaucracy to generate. To correct the forecast, one must multiply the probability of surviving to the audit date by the conditional survival rate after the audit. Using Class A to estimate the early survival rate (250 of 1,000 empires survived to Year 105, or 25%), the corrected calculation is 0.25 × 0.90 = 22.5%. This coincides with Class A's original forecast.

  If the audit information were available regardless of outcome—for example, if external observers recorded "Audit Status" even for collapsed states as "Failed to Audit"—the membership rule would capture the early failures. Class B's base rate would then drop from 90% to roughly 22%, converging with Class A. The work is done by the lag between the forecast start and the data generation, which censors early failures; remove the lag, and the bias vanishes.

  A defender of Class B would argue that it is scientifically superior because it isolates the specific risk profile of polities that have already stabilized post-shock, whereas Class A dilutes the signal with irrelevant cases that never faced a Severance. The attack on this diagnosis is that "stabilization" is not an independent variable but a synonym for "survived the immediate crisis," making the class circular. The case survives this attack because the circularity is demonstrable via the data availability constraint: you cannot measure stabilization without survival, so using stabilization to predict survival guarantees a biased sample.
