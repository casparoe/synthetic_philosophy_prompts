answer: |-
  Your skepticism is well-founded. The chapter you read has committed a very common sin in pop-philosophy: it has blended three distinct layers of the debate into a single smoothie. Those layers are **Paraconsistency** (a technical property of a logical system), **Dialetheism** (a philosophical thesis about truth), and **Instrumentalism** (using the logic as a tool without believing the philosophy).

  Because the chapter mashes these together, it creates contradictions in its own narrative. Here is the breakdown of your three specific bugs, followed by a claim-by-claim audit of the text.

  ### Addressing Your Three Bugs

  **1. The Law of Non-Contradiction (LNC) vs. Explosion**
  Your friend is right, and the chapter is muddying the water.
  *   **The Distinction:** **Explosion** is the rule that says "From a contradiction, anything follows" ($A \land \neg A \vdash B$). **The Law of Non-Contradiction** is the claim that "No contradiction is true" ($\neg(A \land \neg A)$).
  *   **The Error:** A logic is **paraconsistent** simply if it blocks Explosion. It does not *have* to drop the LNC to do that. However, a **dialetheist** *does* reject the LNC (because they think some contradictions are true).
  *   **The Verdict:** The chapter implies that blocking Explosion *requires* dropping the LNC. That is technically false for paraconsistent logic in general, but true for the specific dialetheic project. The chapter treats "paraconsistent logic" and "dialetheism" as synonyms, which they are not. You can use paraconsistent logic to manage a messy database (instrumental) without believing any contradictions are actually true (dialetheism).

  **2. The "Third Truth Value" (Both vs. Neither)**
  This is a significant distortion.
  *   **The Distinction:** In intro logic, a third value is usually **$i$ (indeterminate/unknown/neither)**. This is used to solve paradoxes by saying the Liar sentence is *neither* true nor false (a "truth-value gap"). This is called *paracomplete* logic.
  *   **The Dialetheic Move:** Dialetheists use a third value that functions as **$b$ (both/overdetermined)**. This is a "truth-value glut."
  *   **The Verdict:** While the mathematical machinery (truth tables) for "Neither" and "Both" can look identical (e.g., in Priest's logic LP vs. Kleene's strong 3-valued logic), the *philosophical interpretation* is opposite. Calling it generically "a third truth value" without specifying that it means "True AND False" (not "Unknown") is misleading. It suggests the dialetheist is just saying "we don't know," when they are actually saying "it is definitively both."

  **3. "Harmless Curiosity" vs. "Rational Ruin"**
  The chapter contradicts itself because it conflates the *tool* with the *thesis*.
  *   **The Tension:** If dialetheism is true (contradictions are real), then classical reductio ad absurdum arguments (proof by contradiction) change fundamentally, which worries critics. However, if it's just a tool for databases (instrumental paraconsistency), it is indeed harmless.
  *   **The Verdict:** The chapter wants to have it both ways. It describes the radical philosophical view (Dialetheism) but concludes with the safety of the engineering application (Paraconsistent Databases). Computer scientists use paraconsistent logic *without* being dialetheists. They don't think the database is "true"; they think it's a useful container. The chapter implies the dialetheist is just doing what the computer scientist does, which undermines the philosophical stakes.

  ---

  ### Claim-by-Claim Audit

  Here is how a specialist in philosophical logic (like Graham Priest, J.C. Beall, or a critic like Timothy Williamson) would react to the specific sentences in that chapter.

  **Claim:** *'Dialetheism is the view that some contradictions are true.'*
  *   **Verdict:** **Fair.** This is the standard definition.
  *   **Trust:** Yes.

  **Claim:** *'It's where you end up if you take the Liar paradox seriously... "this sentence is false" can't be true and can't be false, so the dialetheist... says it's both.'*
  *   **Verdict:** **Fair, but incomplete.** The Liar is the primary motivation, but not the only one.
  *   **Trust:** Yes, but know that dialetheists also point to vagueness (boundaries), legal contradictions, and semantic closure as motivations.

  **Claim:** *'Classical logic says that anything follows from a contradiction... so the dialetheist has to build a new logic to work in: paraconsistent logic.'*
  *   **Verdict:** **Fair.** This is the correct technical relationship.
  *   **Trust:** Yes.

  **Claim:** *'Paraconsistent logic... drops the law of non-contradiction and adds a third truth value... on top of the usual two.'*
  *   **Verdict:** **Distortion.** As discussed in Bug #1 and #2. Not all paraconsistent logics use three values (some use many, or none). And paraconsistency is defined by blocking Explosion, not necessarily dropping LNC (though dialetheists do drop LNC).
  *   **Push Back:** "Paraconsistency is about blocking Explosion. Dialetheism is about accepting contradictions. You're treating them as the same thing."

  **Claim:** *'Critics say... a dialetheist can't even use reductio ad absurdum to argue for their own view.'*
  *   **Verdict:** **Fair Concern, but outdated.** This was a major objection in the 1980s. Modern dialetheists have developed a modified reductio (showing that a view leads to a contradiction *that isn't acceptable*, distinguishing "good" contradictions from "bad" ones).
  *   **Trust:** Treat as a "critics say" statement, not a fact. It's a hurdle they have cleared, not a dead end.

  **Claim:** *'In practice the machinery has been most useful to computer scientists, who use it to hold contradictory information in databases without the whole system blowing up.'*
  *   **Verdict:** **Fair.** This is the biggest success story of paraconsistency.
  *   **Trust:** Yes. But remember: these computer scientists are usually *not* dialetheists. They are instrumentalists.

  **Claim:** *'To be fair to the dialetheists, they don't really mean that the world itself is contradictory; they mean that our theories, or our databases, sometimes have to be...' *
  *   **Verdict:** **Wrong.** This is the biggest error in the chapter. Graham Priest (the "best known one" cited) explicitly argues for **ontological dialetheism**. He argues that reality itself contains contradictions (e.g., at the boundaries of objects, or in the nature of change).
  *   **Push Back:** "You are describing instrumental paraconsistency. Actual dialetheists argue that truth itself, and sometimes the world, is contradictory."

  **Claim:** *'So you get things like a cat half on the mat being both on the mat and not on the mat, or Zeno's arrow both moving and not moving.'*
  *   **Verdict:** **Mixed.** Priest does use motion and boundaries as examples of real contradictions. However, the "cat on the mat" is usually a problem of *vagueness*. Most logicians solve vagueness with "gaps" (neither), not "gluts" (both). Priest argues boundaries are inconsistent points, so it's not *decoration*, but it's a controversial extension of the Liar logic.
  *   **Trust:** Cautiously. These are applications of the view, not the core proof.

  **Claim:** *'It's a niche position — most logicians treat it as a formal curiosity rather than a serious view about truth.'*
  *   **Verdict:** **Fair.** It is a minority view. However, calling it a "formal curiosity" dismisses the serious metaphysical work dialetheists do.
  *   **Trust:** Yes, it is niche. No, it is not merely a curiosity to its proponents.

  ---

  ### The Examples: Decoration or Work?

  You asked whether the cat and the arrow are doing real work or are just decoration, and whether they fall out of the Liar stuff.

  1.  **Do they fall out of the Liar stuff?**
      No. The Liar paradox is a *semantic* contradiction (about truth and language). The Cat and the Arrow are *ontological* or *physical* contradictions (about objects and motion).
      *   **The Gap:** You can consistently hold that the Liar sentence is both true and false (semantic dialetheism) while maintaining that the physical world is perfectly consistent (ontological classicalism).
      *   **The Dialetheist Move:** Priest argues that if you accept the Liar, you should accept that our logic tolerates contradictions. Once you have that logic, you might notice that physical phenomena (like an object crossing a boundary, or an arrow in flight at an instant) are *better described* by that logic.
      *   **Verdict:** They are not logical consequences of the Liar. They are *analogous applications*. The chapter presents them as if they are the same kind of thing, which is misleading.

  2.  **Are they decoration?**
      For a strict logical formalist, they are decoration. For a philosophical dialetheist like Priest, they are crucial evidence that the logic isn't just a game—it maps onto reality. The chapter tries to have it both ways by saying "they don't mean the world is contradictory" (dismissing the ontology) while simultaneously citing worldly examples (the cat/arrow). This is the source of the confusion you sensed.

  ### Summary: What to Trust vs. Push Back

  **Trust:**
  *   The definition of Dialetheism (true contradictions).
  *   The motivation from the Liar Paradox.
  *   The problem of Explosion in classical logic.
  *   The utility in computer science/databases (as a tool).
  *   The fact that it is a minority/niche position.

  **Push Back:**
  *   **The Ontology:** The chapter claims dialetheists don't think the *world* is contradictory. This is false for the leading proponents. They do.
  *   **The Logic/Philosophy Conflation:** The chapter treats "Paraconsistent Logic" (the tool) and "Dialetheism" (the belief) as the same thing. They are not.
  *   **The Third Value:** The chapter implies "third value" is a generic catch-all. It needs to specify "Both" (glut) vs "Neither" (gap).
  *   **The Reductio:** The claim that they *can't* use reductio is an oversimplification of a complex technical debate they have largely navigated.

  **Bottom Line:** The chapter is a decent introduction to the *mechanics* of the view but fails on the *metaphysics*. It presents dialetheism as a clever way to manage information (which is safe) rather than a radical claim about truth and reality (which is what actually bothers the critics). If you treat the chapter as a description of **Instrumental Paraconsistency**, it is mostly accurate. If you treat it as a description of **Philosophical Dialetheism**, it is significantly distorted.
