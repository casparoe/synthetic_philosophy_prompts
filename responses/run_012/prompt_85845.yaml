  *(Self-Correction during drafting)*: Make sure I don't just bash the opponent. Acknowledge where the analogy has pull (there *are* biological constraints), but show where it snaps. Ensure the distinction between "nominally real" and "ontologically real" is clear in the context of Hacking's interactive kinds.

  *(Refining the "Better Analogy")*: The prompt asks for a better analogy for the *same job* (defusing the worry). If I say "There isn't one," that's honest, but I should offer the one that *describes the situation best*, even if it costs him his conclusion. The Cartographer is good. Or perhaps the **Coach and the Athlete**. The coach names a technique; the athlete embodies it; the technique evolves. Let's use the **Cartographer** as it's the standard philosophical rival to the Butcher (Plato).

  *(Wait, one more check on British English)*: Ensure "labeling" becomes "labelling", "program" becomes "programme", "center" becomes "centre".

  *(Final Polish)*: Ensure the distinction between "repairing the analogy" and "saving the conclusion" is sharp. The opponent can have a coherent analogy only by conceding Hacking's point.

