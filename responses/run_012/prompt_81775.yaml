answer: |-
  **MEMORANDUM**

  **TO:** City Council
  **FROM:** Commemoration Advisory Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding [Street Name] Commemoration

  **RECOMMENDATION**
  The Commemoration Advisory Committee recommends that the City **retain the existing street name** but concurrently **commission and install a permanent historical counter-marker** at a prominent location within the street's corridor. We request Council action on this recommendation by [Date, e.g., November 30, 2023].

  **BACKGROUND**
  In 1954, the City named [Street Name] after [Attorney Name], a locally prominent attorney. Historical records confirm [Attorney Name] led legal campaigns to establish and maintain racially restrictive covenants in this section of the city. The street runs through the neighborhood that was subject to these restrictions. Today, the neighborhood is predominantly home to descendants of the families who were historically excluded from it.

  The Committee received formal testimony from two primary stakeholder groups:
  1.  **A Coalition of Current Residents:** Primarily descendants of the excluded families, requesting the name be retained. They argue the name now signifies their community's resilience and survival against the restrictions [Attorney Name] advocated. They express concern that renaming would allow external actors (specifically the adjacent university and newer residents) to "edit" the neighborhood's history.
  2.  **The Honoree's Surviving Family:** Requesting removal. They argue that any continued official use of the name constitutes a continuing insult and implies City endorsement of [Attorney Name]'s discriminatory conduct.

  **ANALYSIS AND REASONING**
  Our decision is guided by the City's Commemoration Policy (Section 4.2), which permits removal *only* where continued use would amount to the City's own endorsement of the conduct commemorated. The Policy does not define the "relevant community," requiring the Committee to weigh the competing interests of the honoree's heirs and the current resident community.

  **1. The Endorsement Test**
  Retaining the name without context risks the appearance of endorsement. However, the installation of a commissioned counter-marker actively disavows endorsement. By explicitly detailing [Attorney Name]'s role in racial exclusion alongside the community's history of overcoming those barriers, the City transforms the street name from an honorific into a historical document. This satisfies the Policy's threshold: the City is not endorsing the conduct, but rather acknowledging the full historical record.

  **2. Community Agency and Historical Continuity**
  The Committee places significant weight on the testimony of the current residents. For the descendants of the excluded families, the street name has undergone a semantic shift. It no longer functions primarily as a tribute to the attorney, but as a marker of their own tenure and triumph over the restrictions he sought to impose. To remove the name at this juncture risks validating the residents' fear of erasure. It would prioritize the sensibilities of the honoree's family and external institutions over the lived history of the people who actually inhabit the space.

  **3. The Function of Counter-Marking**
  A counter-marker serves as a compromise that honors the complexity of the situation. It preserves the residents' claim to the neighborhood's identity while formally acknowledging the harm caused by the honoree. It ensures that passersby and newcomers understand the name not as a celebration of racism, but as a testament to the injustice that was overcome.

  **STATEMENT OF REJECTED ARGUMENT**
  The Committee carefully considered the argument presented by the honoree's family: that the name itself is inherently toxic and that no amount of contextualization can negate the daily insult of seeing a racist's name on a mailbox or address. Their position is that some symbols are too stained by their origins to be repurposed, and that the City's moral obligation is to sever ties with such figures completely, regardless of current resident sentiment. This is a morally coherent stance centered on the principle that the City should not facilitate the presence of hate symbols, even passively. While we respect the gravity of this concern, we determined that the policy constraints and the specific agency of the current resident community tip the balance toward retention with context.

  **TIMELINE**
  To ensure the counter-marker is designed with community input, we recommend the Council authorize the funding and formation of a design subcommittee by [Date]. The marker should be installed no later than the 70th anniversary of the street's naming in 2024.

  ***

  **INTERNAL NOTE TO CHAIR (DO NOT CIRCULATE)**

  **Confidence Level:** High (85%)
  This recommendation offers the strongest path through the specific constraints of your existing policy. It avoids the legal vulnerability of removing a name when the "endorsement" test can be mitigated by context, and it aligns with the desires of the people currently living in the affected space, which is politically defensible.

  **Point of Least Certainty:**
  The long-term efficacy and maintenance of the counter-marker. I am least sure about whether a physical marker will successfully shift public perception from "honor" to "history" in the eyes of the broader public, or if it will be viewed as a half-measure that satisfies no one. If the marker is vandalized, ignored, or poorly worded, the compromise could collapse, reigniting the demand for removal.
