  1.
  Colleagues, families, and most importantly, the graduating class: we gather here to mark a transition, and like all transitions, this one invites talk about where you ought to go next. Usually, this is the moment in the ceremony where a speaker points to a moral compass fixed in the stars, some set of objective values waiting in the universe for you to align with. I cannot do that. I have spent my career arguing that there are no such stars, no mind-independent moral facts sitting in the catalogue of what there is. To tell you otherwise now would be to cheat you, and to cheat myself. But do not mistake this absence of Platonic truths for an absence of direction. The lack of a cosmic script does not mean the play is improvised without reason; it means the responsibility for the script is entirely, terrifyingly, ours.

  2.
  My colleague once told me that I treat ethical talk as just another region of the web of belief, and he was right. We are not disconnected from values; we are woven into them. When we say you "ought" to be kind, or courageous, or honest, we are not describing a supernatural force; we are noting what holds our shared world together. These norms are not fictions; they are tools. They are part of the best theory we have for navigating a world containing creatures who feel pain, who hope, who build, and who break. To say there are no objective values is not to say that nothing matters; it is to say that mattering is a function of us, of our biology, our history, and our mutual dependence. The "ought" does not come from outside the web; it comes from the tension within it.

  3.
  To the parents and grandparents here: I know you wanted to hear that the universe guarantees your children's goodness, that there is a safety net of truth catching them if they fall. I cannot promise you that. But I can promise you this: the values you instilled in them are real because they are effective. They are real in the same way gravity is real—not because they are written in the bedrock of being, but because ignoring them has consequences. When you taught them to tell the truth, you were not teaching them to match a metaphysical standard; you were teaching them how to maintain the trust that allows society to function. That trust is fragile, but it is the only ground we have. It is enough.

  4.
  To the graduates: you are leaving a place where questions about the foundation of knowledge are the currency of the realm. You are entering a world that demands action regardless of foundation. Do not wait for certainty before you act. Do not wait for a moral fact to authorize your compassion. Your obligation to reduce suffering, to seek justice, to speak truthfully, arises from your position within the human network, not from a command outside it. You are the authors of the norms you live by. This is not a license for nihilism; it is a call to rigor. If there is no external judge, then you must be the judge, and you must be rigorous in weighing the consequences of your choices on the rest of the web.

  5.
  So go forth not with the comfort of absolute truth, but with the strength of naturalized hope. We build our values as we build our science: by testing them against experience, by seeing what helps us predict and manage the flux of life, by discarding what causes unnecessary harm. You will make mistakes. We all do. But you will make them as agents within a shared world, responsible to each other rather than to a fiction. That responsibility is heavy, but it is also dignified. It means that when you choose to be good, you are not obeying a command; you are creating the very ground on which we stand. That is not a contradiction. It is the only truth we have.
