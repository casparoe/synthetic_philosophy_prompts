answer: |-
  # Q&A Prep Sheet: The Decision-Relative Reference Class

  **Thesis Recap:** RCP isn't solved by "all relevant info" (relevance is undefined). It's solved by fixing the loss function and available acts. Reference classes are tools for decision, not mirrors of nature.

  ---

  ### 1. The "Causal Structure Solves This" Objection
  **Who:** Stats/Causal Inference Grad Students
  **Damage Level:** **Critical.** (Implies you are solving a problem that formal methods already closed.)
  **Phrasing:** "Why do we need loss functions to fix a reference class? If we have the correct causal DAG, the adjustment set is objectively determined by the structure of the world, not by what I want to do. Exchangeability is a property of the data-generating process, not my utility function. Aren't you just reinventing selection bias and calling it philosophy?"

  **Two-Minute Reply:**
  "Causal structure tells you what *influences* the outcome, but it doesn't tell you which grouping minimizes *error costs* for a specific agent. A DAG might tell me that age and smoking cause cancer. But if I'm an insurer pricing a policy, my reference class groups by risk profiles relevant to profit. If I'm a doctor advising a patient, I group by profiles relevant to treatment efficacy. The causal facts are constant, but the 'relevant' partition changes based on what I'm trying to optimize.
  Furthermore, exchangeability is often untestable without assuming a model. My claim is that even if we agree on the DAG, choosing *which* variables to condition on for a specific prediction is a pragmatic choice, not a purely structural one. The DAG constrains the options, but the loss function selects the class. So, causal inference is necessary, but it's not sufficient to solve the RCP for action."

  **Where the Reply is Soft:**
  If they press that "proper" causal inference *includes* the decision model (like in decision-theoretic causal graphs), you look like you're ignoring their literature.
  **Concede Up Front:** "I agree causal structure constrains the admissible classes. I'm arguing it doesn't *select* the unique correct one for prediction without a goal."

  ---

  ### 2. The "You Haven't Solved Arbitrariness" Objection
  **Who:** Hardcore Frequentists & Objectivists
  **Damage Level:** **High.** (Attacks the core claim of "non-arbitrary.")
  **Phrasing:** "You say moving to loss functions removes arbitrariness. But loss functions are subjective. One agent cares about false positives, another about false negatives. You haven't found the *true* reference class; you've just relativized probability to personal preference. Doesn't this destroy the objectivity of scientific probability?"

  **Two-Minute Reply:**
  "It does destroy the idea of a 'God's eye' probability that exists independently of use. But that's a feature, not a bug. The arbitrariness in the traditional RCP is hidden—we pretend we're finding the 'true' class while secretly picking one that suits our purposes.
  By making the loss function explicit, we make the arbitrariness transparent and accountable. If two agents have different goals, they *should* use different reference classes. Asking for a single objective class when the agents have different stakes is the actual category mistake. Science gives us the frequencies; decision theory tells us which frequency matters. Neither is arbitrary in isolation, but combining them requires a context."

  **Where the Reply is Soft:**
  Frequentists believe long-run frequencies exist regardless of agents. If they argue the frequency *is* the probability regardless of your loss, you have to deny that such a frequency is useful for single-case inference.
  **Concede Up Front:** "I concede this makes probability agent-relative. I'm arguing that's the only way to make it action-guiding."

  ---

  ### 3. The "Instrumentalism vs. Truth" Objection
  **Who:** Philosophy Colleagues (Metaphysicians)
  **Damage Level:** **Medium.** (Ideological disagreement.)
  **Phrasing:** "This sounds like rampant instrumentalism. Are you saying there is no fact of the matter about the probability of this coin landing heads? Science aims to describe the world, not just help us place bets. Are you giving up on objective chance entirely?"

  **Two-Minute Reply:**
  "I'm not denying there are physical propensities or frequencies in the world. I'm denying that those map uniquely to a *probability statement* without a context of application. A coin has a physical bias, yes. But whether I classify it as 'a coin' or 'a piece of metal with mass X' depends on what I'm trying to predict.
  If I'm predicting aerodynamic drag, mass matters. If I'm predicting heads, symmetry matters. The physical facts are objective; the *reference class* used to describe them is a tool. I'm not giving up on truth; I'm saying truth about probability is always truth about a system relative to a description, and the choice of description is pragmatic."

  **Where the Reply is Soft:**
  They may corner you on single-case objective chance (e.g., quantum mechanics).
  **Concede Up Front:** "I'm focusing on inductive/statistical probability, not necessarily quantum propensities."

  ---

  ### 4. The "Single-Case" Objection
  **Who:** Mixed Audience
  **Damage Level:** **Low.** (Easier to deflect.)
  **Phrasing:** "What about single cases? I need to know the probability of *this* patient surviving *this* surgery. They only do it once. A loss function applies to repeated decisions, but reference classes are supposed to help me with the singular case."

  **Two-Minute Reply:**
  "Even in a single case, you are making a decision under uncertainty. You are effectively betting. The loss function captures the stakes of that single bet. If the surgery is high-risk/high-reward, you might use a broader reference class to avoid false negatives. If it's low-stakes, you might use a narrower one.
  The 'single case' problem arises because we try to find a probability that applies to the individual in isolation. But we only know the individual through their properties, which places them in classes. Which properties we privilege depends on what we lose if we're wrong. So even for single cases, the class is decision-relative."

  **Where the Reply is Soft:**
  Intuitively, people feel the probability *should* be fixed regardless of the stakes.
  **Concede Up Front:** "It feels counterintuitive, but stakes change how we *assess* risk, even if the physics stays the same."

  ---

  ### The One Question I'm Hoping Nobody Asks

  **The Question:**
  "If the probability value changes depending on the loss function, aren't you just redefining 'probability' to mean 'expected utility'? If so, why keep the word probability at all, and how do you calculate the expected utility without already assuming a probability distribution to weight the losses?"

  **Why it's dangerous:**
  This creates a circularity trap. To define the reference class, I need a loss function. To define the loss function's expected value, I usually need probabilities. If I say the probability *comes from* the reference class fixed by the loss, I might be reasoning in a circle. It attacks the coherence of the entire proposal.

  **Emergency Deflection (if asked):**
  "I'm not defining probability *as* utility. I'm saying the *input* (the reference class) is selected by the utility context. You still need frequencies to fill the class. The loss function picks the bucket; the data fills it. We aren't calculating utility to get the probability; we are using the stakes to pick the relevant data."
