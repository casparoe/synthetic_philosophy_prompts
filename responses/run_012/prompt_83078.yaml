  **C. Relevant Alternatives (Strict Salience)**
  *   **The Rule:** Knowledge requires eliminating all *relevant* alternatives. An alternative is relevant only if it is made salient in the conversation (e.g., explicitly raised or "on the table"). Mere stakes do not make an alternative relevant unless they trigger an explicit mention of the error possibility.
  *   **Fit with Data:**
