      *   Optimists treat aesthetic judgments as ordinary empirical judgments (mostly).
      *   Pessimists treat them as requiring a specific relation to the object (acquaintance).
      *   *Real Disagreement:* Is the norm of aesthetic judgment *factive* (truth-oriented) or *procedural* (experience-oriented)?
      *   *Another Angle:* The "Buck-Passing" move. Maybe testimony gives you reason to believe the *critic is right*, but not reason to believe the *object is beautiful* in the first-personal sense required for aesthetic practice.

  5.  **Formulate the Diagnosis:**
