      *   *Pessimism:* Aesthetic testimony is defective. It doesn't yield justified belief, or at least not the *right kind* of aesthetic belief/judgment. (Kantian roots, Hopkins' acquaintance principle, etc.)
      *   *The User's Hunch:* Is "justification" doing double duty? Is it about *propositional justification* vs. *doxastic justification* vs. *normative standing* vs. *aesthetic understanding*?

  3.  **Evaluate the "Equivocation" Hypothesis:**
      *   *Is it merely verbal?* Probably not *merely*. Both sides agree on the phenomenology (it feels different to hear a critic vs. see the painting). They disagree on the *normative upshot*.
      *   *The "Justification" Ambiguity:* The user is onto something. Pessimists often slide between:
          1.  You can't form a *justified belief* (Epistemic claim).
          2.  You can't form a *genuine aesthetic judgment* (Conceptual claim).
          3.  You shouldn't rely on it because it lacks *aesthetic value* (Axiological claim).
      *   *Optimists* tend to focus on (1). *Pessimists* often care more about (2) and (3).
      *   *Key Insight:* The debate might be about the *aim* of aesthetic discourse. Is it truth-tracking (Optimist) or experience-tracking (Pessimist)?

  4.  **Identify the Substantive Core (if any):**
