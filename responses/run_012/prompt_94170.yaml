      *   But don't dismiss the debate as merely verbal. It reveals a deeper tension about the *function* of aesthetic concepts.
      *   *Distinction 1: Epistemic Justification vs. Aesthetic Standing.* You might have the evidence (Optimist), but lack the authority to assert (Pessimist).
      *   *Distinction 2: Belief vs. Appreciation.* Testimony gives belief-that, but not appreciation-of. Pessimists think aesthetic judgment *requires* appreciation.
