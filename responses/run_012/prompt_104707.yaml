      *   Ensure the distinction between "mechanism" and "hope" is scrutinized.

  9.  **Final Review against constraints:**
      *   Did I sort by worry level? Yes.
      *   Did I address falsifiability? Yes.
      *   Did I identify wishful thinking vs. tautology? Yes.
      *   Did I avoid generic counterexamples? Yes (focused on structural/theoretical).

  *(Self-Correction on the "Ratchet" metaphor)*: A ratchet allows motion in one direction. If the user admits "slips," it's a "slippery ratchet." If the slips can go back to the start, is it a ratchet? I need to highlight that if the backward slide is as easy as the forward climb, the mechanism is broken.

  *(Refining the "Moral" definition)*: This is the biggest philosophical hole. If "moral expansion" is defined by the outcome (survival), it's tautological. If defined by external ethics (e.g., utilitarianism), does history match? Often no.

  *(Final Plan)*:
  1. Validate the sophistication of the view.
  2. Present 3 tiers of defeaters (Existential, Structural, Methodological).
  3. Address the "Concessions."
  4. Deliver the verdict on Falsifiability and the "Wishful/Tautology" diagnosis.
  5. Offer the "Residue" (what's left if the directionality is dropped).

