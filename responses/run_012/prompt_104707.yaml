          *   Wishful Thinking vs. Tautology. It risks being a *Just-So Story*.
      *   *Section 4: What remains?* If you drop the "directionality," you have a theory of *institutional inertia*. That's valuable but neutral.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just say "Nazism." The user knows the 20th century. I need to focus on *enduring* reversals. Jim Crow is better because it lasted generations. The fall of Rome is good because it lasted centuries.
