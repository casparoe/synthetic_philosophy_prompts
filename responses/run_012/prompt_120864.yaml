          *   Anomaly? No.
          *   *Verdict:* It's a case the debate never anticipated because the debate assumed "immorality" meant sexual orientation or adultery, not consensual violence. The violence element introduces a harm component that muddies the water. It shows the limits of using 1950s philosophy for 1990s bio-legal-ethical problems. It confirms the *persistence* of the debate, not the validity of either side.

