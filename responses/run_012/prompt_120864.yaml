          *   Map the majority reasoning to Devlin's legal moralism, paternalism, and harm arguments.
          *   Evaluate if the distinction between these strands survives contact with the judgment.
          *   Analyze Devlin's concession on private immorality + "ordinary person" indignation against the outcome.
          *   Analyze the principal dissent (Lord Mustill/Lord Slynn) – is it Hartian or something else (judicial lawmaking/repugnance)?
          *   Evaluate Devlin's "disintegration thesis" in light of the case.
          *   **Conclusion:** Identify where the framework fails (consent, private/public, Strasbourg margin of appreciation) and categorize the episode (confirmation, anomaly, or unanticipated).
      *   **Tone:** Analytical, critical, nuanced ("honest account," "mapping run carefully").

  2.  **Recall/Research Key Elements:**
      *   ***R v Brown* Facts:** Group of gay men engaged in consensual SM activities (branding, piercing, etc.). Recorded on video. Police discovered tapes during unrelated investigation. Charged under OAPA 1861 (s.20, s.47).
      *   ***Brown* Holding:** Consent is not a defense for actual bodily harm (ABH) or wounding in this context. Public policy reasons.
      *   **Majority (Lord Templeman, Lord Jauncey, Lord Lowry):** Focus on public policy, danger to society, uncertainty of consent, potential for escalation, analogy to prize-fighting/dueling.
      *   **Dissent (Lord Mustill, Lord Slynn):** Focus on privacy, autonomy, lack of public harm, judicial overreach.
      *   **Hart-Devlin Debate (1950s/60s):**
          *   *Devlin:* Society has a right to protect its moral fabric. "Disintegration thesis" (immorality threatens society). Law should enforce the morality of the "reasonable man" (intolerance/indignation test). Private vs. Public distinction is porous.
          *   *Hart:* Mill's Harm Principle. Law should only prevent harm to others. Morality alone is insufficient. Privacy/Autonomy are key. Skeptical of "disintegration."

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. *Brown* is the canonical modern test case for Hart-Devlin. State the thesis: The case fits the debate superficially but exposes cracks in both frameworks, particularly regarding consent and the nature of "harm."

      *   **Mapping the Majority (Devlin or Something Else?):**
          *   *Legal Moralism:* Lord Templeman's language ("cult of violence," "pleasure derived from pain is evil"). This sounds like Devlin's enforcement of shared morality.
          *   *Paternalism:* Protecting participants from themselves. But Devlin isn't strictly paternalist; he's about social cohesion.
          *   *Harm:* The majority argues potential harm (infection, escalation, loss of control). But the actual harm was consensual and contained.
          *   *Critique:* The distinction blurs. Is it moral disgust dressed up as public safety? Devlin allows private immorality *unless* it threatens society. The Majority treats the *act* itself as the threat, not just the publicity.
          *   *Devlin's "Private" Concession:* Devlin famously said law shouldn't intervene in private immorality *unless* it becomes public enough to shock the conscience. *Brown* was private but recorded. Does the recording make it "public"? The Majority treats the *potential* for public knowledge as enough. This stretches Devlin. The "ordinary person" test: Would the ordinary person be indignant? Probably. But Devlin requires *intolerance*, not just dislike.

      *   **Mapping the Dissent (Hart or Something Else?):**
          *   *Lord Mustill:* Focuses on the "specialness" of criminal law. Argues this is a moral question for Parliament, not judges.
          *   *Hartian?* Yes, on autonomy and privacy. But crucially, Mustill rests heavily on *separation of powers* (judicial lawmaking). Hart was concerned with the *principle* of liberty, not just judicial competence.
          *   *Repugnance:* Mustill admits the acts are repugnant but says repugnance $\neq$ crime. This is pure Hart/Mill.
          *   *Nuance:* The dissent isn't purely "no harm." It's "no *public* harm sufficient to override autonomy."

      *   **The Disintegration Thesis:**
          *   Devlin claimed immoral acts weaken the bonds of society.
          *   *Brown* Application: Did SM weaken society? No evidence. The Majority assumes it *could* (slippery slope).
          *   *Critique:* This is the weakest link. Devlin's thesis is empirical but treated as axiomatic. *Brown* shows the courts accepting the axiom without evidence. The "threat to society" is speculative.

      *   **Where the Framework Runs Out (The "Honest Account"):**
          *   *Consent:* Hart-Devlin focuses on *immorality* vs. *harm*. *Brown* turns on the *validity of consent* to harm. This is a doctrinal criminal law question that the moral debate doesn't fully capture. Can you consent to harm? That's a prior question to "should the law ban it?"
          *   *Private/Public:* Devlin struggles here. *Brown* was private but recorded. Strasbourg (*Laskey v UK*) used "Margin of Appreciation." This is a Devlinian move (national morality varies) wrapped in ECHR language (Article 8).
          *   *Rights Vocabulary:* Strasbourg balances individual rights vs. public interest. Hart-Devlin is jurisprudential/philosophical. The translation is imperfect.

      *   **Conclusion:**
