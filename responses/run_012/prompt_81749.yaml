answer: |-
  Here is the menu of readings for the slogan "equality of opportunity, not equality of outcome," arranged from the trivial to the radical.

  ### 1. The Tautological Reading
  **The Claim:** Opportunity is defined retrospectively as the capacity to achieve whatever outcome one actually achieved. If you succeeded, you had the opportunity; if you failed, you lacked the talent or effort, not the opportunity.
  **Verdict:** **Trivial.** This is a linguistic circle that renders the slogan unfalsifiable. It equates "opportunity" with "success."
  **Commitments:** Accepting this commits you to viewing the status quo as inherently fair. It implies that any existing distribution of wealth is the result of a fair race, because the winners necessarily had the opportunity to win. It forbids no policy, but justifies all outcomes.

  ### 2. The Formal Legal Reading
  **The Claim:** Opportunity means the absence of explicit, legal barriers to advancement (e.g., caste, slavery, statutory discrimination). Outcome is whatever results from the free exercise of talent and effort within those legal bounds.
  **Verdict:** **Substantive but Thin.** This is a coherent, historical liberal definition, but it ignores social and economic barriers.
  **Commitments:** Accepting this commits you to civil rights legislation and the rule of law, but opposes redistribution. It treats inheritance as a legitimate "outcome" of parental effort that cannot be touched without violating the "not outcome" clause. This is the **American's veto**: inheritance is a past outcome, and taxing it to engineer future states is illegitimate.

  ### 3. The Fair Starting Line Reading
  **The Claim:** Opportunity requires neutralizing arbitrary disadvantages that are not the result of the individual's own choices or efforts. Since no one chooses their parents, wealth transferred at birth is an arbitrary advantage, not a meritocratic outcome.
  **Verdict:** **Substantive and Defensible.** This distinguishes between "chosen" outcomes (work) and "unchosen" circumstances (birth).
  **Commitments:** Accepting this commits you to significant redistribution to level the playing field (public education, healthcare, inheritance taxes). This is the **European's argument**: inheritance is an *input* into the next generation's opportunity structure, so breaking it up is required to ensure opportunity.

  ### 4. The Dynamic Intergenerational Reading
  **The Claim:** Outcome and opportunity cannot be temporally separated. Today's economic outcome (wealth) purchases tomorrow's opportunity (education, networks, health) for one's children. Therefore, extreme inequality of outcome inevitably produces inequality of opportunity.
  **Verdict:** **Substantive and Empirical.** This treats the distinction as porous rather than absolute.
  **Commitments:** Accepting this commits you to monitoring the *correlation* between parental wealth and child success. If the correlation is high, you must reduce outcome inequality to preserve opportunity equality. It turns the slogan into an argument for continuous redistribution.

  ### 5. The Positional/Relational Reading
  **The Claim:** Opportunity is not a resource to be distributed but a rank in a hierarchy. To have an "opportunity" for a prestigious job means having a better chance than others. Therefore, equalizing opportunity requires equalizing the resources that determine rank, which effectively requires equalizing outcomes.
  **Verdict:** **Radical.** This suggests the slogan is incoherent; you cannot have one without the other.
  **Commitments:** Accepting this commits you to rejecting the slogan entirely. It implies that as long as there are significant outcome disparities (wealth, status), opportunity will remain unequal, regardless of legal formalities.

  ***

  ### Analysis of the Dispute

  At your dinner table, the slogan was doing two different jobs because your companions were selecting different entries from the menu.

  The **American** was relying on **Entry 2 (The Formal Legal Reading)**. For them, inheritance is a *past outcome* of the parents' life. To tax it is to punish a legitimate result for the sake of an engineered future. They view the "starting line" as the moment legal adulthood begins, at which point the law treats everyone the same.

  The **European** was relying on **Entry 3 (The Fair Starting Line)** and **Entry 4 (The Dynamic Intergenerational Reading)**. For them, inheritance is a *future opportunity* for the child. To allow it is to rig the race before it starts. They view the "starting line" as birth, at which point the law must compensate for biological and social lottery wins.

  **Could they both be right?**
  Conceptually, yes. They are not disagreeing about the value of opportunity; they are disagreeing about where "opportunity" ends and "outcome" begins in time. The American sees inheritance as the *end* of the parents' race; the European sees it as the *start* of the children's.

  However, they are also disagreeing **empirically**. The dispute hinges on Entry 4. If wealth had no effect on life chances (if the children of billionaires failed just as often as the children of workers), the European's argument would collapse, and the American's veto would hold. If wealth guarantees success, the American's distinction between opportunity and outcome dissolves.

  **What evidence would settle it?**
  You need data on **intergenerational income elasticity**. This measures how much a parent's income predicts a child's income.
  *   **Low elasticity:** Money doesn't buy much advantage; mobility is high. (Supports the American).
  *   **High elasticity:** Money buys significant advantage; mobility is low. (Supports the European).
  You would also need evidence on whether specific mechanisms (private schooling, unpaid internships, network access) mediated by wealth are the primary drivers of that elasticity.

  ### Where you should have argued
  You should not have argued about the slogan itself, which is too flexible. You should have argued about **Entry 4**. Ask the American: *"At what level of wealth does an outcome cease to be a reward for past labor and become a determinant of future opportunity?"* That forces the debate onto the empirical ground where the distinction between opportunity and outcome actually breaks down.
