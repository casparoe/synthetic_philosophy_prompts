      *   *The European:* Used Entry 3 or 4 (Fair Start/Dynamic). Inheritance distorts the "opportunity" side for the next generation.
      *   *Are they disagreeing?* Conceptually, they are using different definitions. Empirically, they disagree on whether wealth *actually* buys opportunity or just rewards past merit.
