answer: |-
  You have correctly identified one of the hardest technical problems in meta-ethics and decision theory. You are not confusing yourself; you have run headfirst into **The Problem of Intertheoretic Comparison** (specifically, the **Normalization Problem**).

  Here is the exact carving of the problem, how it relates to Pascal's Wager, and the current state of solutions.

  ### 1. What is this called?
  The broad field is **Normative Uncertainty** (or Moral Uncertainty).
  The specific technical hurdle you are describing is the **Problem of Intertheoretic Comparison of Value**.

  Within that, the specific issue of scaling is often called the **Normalization Problem**.

  The seminal work on this is William MacAskill's *Normative Uncertainty* (2016). He formalizes exactly what you noticed: to maximize *Expected Moral Value* (EMV) across theories, you need to treat moral theories like von Neumann-Morgenstern utility functions. But utility functions are only unique up to positive affine transformations (you can shift the zero point and stretch the scale without changing the theory's prescriptions *within* itself). When you mix theories, those arbitrary stretches become decisive.

  ### 2. Is it Pascal's Wager / Fanaticism?
  It is **structurally related but distinct**.

  *   **Pascal's Wager / Fanaticism:** This arises when one option has a tiny probability but *infinite* (or astronomically large) value. The expected value swamps everything else.
  *   **Your Problem:** This arises even when all values are finite and probabilities are reasonable. It arises because the *units* of value are undefined across theories.

  **The Connection:** The Normalization Problem is the *gateway* to Fanaticism. If you don't solve the scaling problem, any theory that happens to use "larger numbers" (assigns higher cardinal utility to its preferred outcomes) will dominate the calculation, effectively acting like a "fanatical" theory even if it isn't one. If you leave scales unnormalized, you are implicitly assigning infinite credence to the theory with the larger unit size.

  So: It isn't Pascal's Wager, but it is the reason why naive Expected Moral Value calculations often *result* in Pascal-like domination by one theory.

  ### 3. Why does this happen? (The Root Cause)
  Ethical theories are naturally **ordinal** (Theory A says Outcome X > Outcome Y). To do the "average across views" math you described, you need them to be **cardinal** (Theory A says Outcome X is *10 units* better than Outcome Y).

  Theories tell you what is better, but they do not tell you *how much* better in a way that is comparable to other theories.
  *   **Theory A (Suffering):** "Eliminating torture is the most important thing." (Assigns 1,000,000 points).
  *   **Theory B (Flourishing):** "Eliminating torture is good, but creating art is better." (Assigns 10 points to torture, 100 to art).

  If you average these raw numbers, Theory A wins every time. If you divide Theory A's points by 100,000, Theory B wins. The math is sensitive to the arbitrary "unit size" of each theory.

  ### 4. Is there a non-arbitrary fix?
  **The honest answer: No.** There is no consensus, metaphysically grounded way to convert "suffering units" into "flourishing units." There is no "moral exchange rate" written into the fabric of reality.

  However, decision theorists have proposed **procedural fixes**. These don't claim to find the *true* scale, but rather to define a scale that prevents arbitrary domination.

  #### The Standard Proposal: Variance Normalization
  Proposed by MacAskill (building on ideas from social choice theory).
  *   **The Idea:** Normalize each theory so that the **variance** of its value judgments across the *available options* is equal (usually set to 1).
  *   **How it works:** If Theory A cares *intensely* about the difference between Option 1 and Option 2, and Theory B is indifferent between them, Variance Normalization preserves that intensity. But if Theory A just uses bigger numbers for everything (scale inflation), Variance Normalization shrinks them down to match Theory B's spread.
  *   **The Result:** It prevents a theory from winning just because it uses "louder numbers." It forces each theory to have an equal "voice" in proportion to how much it cares about the specific choices at hand.
  *   **The Credence:** You still weight by your credence in the theory (e.g., 50% A, 50% B), but the *values* are normalized first.

  #### The Criticisms of Variance Normalization
  It is the best we have, but it is not perfect:
  1.  **Option Set Dependence:** The normalization depends on what options are available. If you add a third, terrible option to the list, it changes the variance of the theories, which can change the ranking of the original two options. (This violates the "Independence of Irrelevant Alternatives" axiom).
  2.  **The Zero Point:** Variance handles the *scale* (stretching), but not the *zero point* (shifting). Does "0 value" mean the same thing in Theory A and Theory B? (e.g., Is a world with no people 0 in both theories, or is it negative in one and neutral in the other?) Variance normalization doesn't fully solve the zero-point problem, though it helps.
  3.  **Cluelessness:** In complex real-world scenarios, we often don't know the variance of a theory's values because we can't calculate the outcomes well.

  ### 5. What do people actually do?
  In the Effective Altruism and Longtermist communities (where this is most discussed), the practice is usually:

  1.  **Use Variance Normalization:** It is the default mathematical approach for "Expected Moral Value" calculations when dealing with cardinal theories (like Utilitarianism vs. Negative Utilitarianism).
  2.  **Switch to Ordinal Methods:** If the scales are too incomparable (e.g., Deontology vs. Utilitarianism), some switch to **Borda Count** or similar ranking systems. You rank the options according to Theory A, and rank them according to Theory B, then average the *ranks*. This throws away information about *intensity* (how much better X is than Y) to avoid the scaling problem.
  3.  **Hedging:** Instead of maximizing EMV, agents try to avoid actions that are catastrophic under *any* high-credence theory (a "minimax regret" approach).
  4.  **Focus on "Robustly Good" Actions:** Prioritize actions that look good under *both* Theory A and Theory B (e.g., reducing extreme poverty often reduces suffering *and* increases flourishing), avoiding the trade-offs where the scaling problem bites hardest.

  ### 6. Where are the edges?
  *   **Same Family:** If Theory A and Theory B are both Utilitarian but disagree on the discount rate for the future, intertheoretic comparison is easier. You can treat them as the same utility function with different parameters. The scaling problem is less severe here.
  *   **Different Categories:** If Theory A is Consequentialist (maximize value) and Theory B is Deontological (follow constraints), the problem is hardest. Deontology often acts as a veto (infinite negative value for rights violations) rather than a scale. Variance normalization struggles here because a veto looks like infinite variance.
  *   **Infinite Values:** If either theory posits actual infinite value (e.g., theological views, or some interpretations of infinite futures), Expected Value reasoning breaks down entirely, regardless of normalization.

  ### Summary
  *   **Name:** The Problem of Intertheoretic Comparison (Normalization Problem).
  *   **Relation to Pascal:** It is the structural prerequisite for Pascal-style domination, but distinct from the "tiny probability of infinite value" problem.
  *   **Solution:** There is no metaphysical solution. The standard procedural solution is **Variance Normalization**, which equalizes the "intensity" of each theory across the available options.
  *   **Verdict:** Your intuition is correct. "Do whatever scores best on average" is **not well-defined** without a normalization rule. Adding a normalization rule (like Variance) makes it defined, but introduces other arbitrariness (dependence on the option set).

  You are stuck in the place where moral philosophy meets the hard limits of decision theory. The "sane-sounding thing" (maximizing expected moral value) requires a mathematical structure that moral theories do not naturally provide.
