      *   **Intertheoretic Comparison:** The specific problem of comparing value magnitudes across different normative theories.
      *   **The Scaling Problem / Normalization Problem:** The specific issue of unit incompatibility.
      *   **Variance Voting / Variance Normalization:** A proposed solution (MacAskill).
      *   **Pascal's Wager / Fanaticism:** Related but distinct (involves infinite expectations or extreme outliers).
      *   **Representation Theorems:** The mathematical underpinning (von Neumann-Morgenstern).

  3.  **Drafting the Response - Section by Section:**

      *   **Acknowledge and Validate:** Start by confirming this is a well-known, serious problem in meta-ethics and decision theory. It's not just confusion; it's a hard technical hurdle.
      *   **Naming the Problem:**
          *   Primary term: **The Problem of Intertheoretic Comparison**.
          *   Specific aspect: **The Scaling Problem** or **Normalization Problem** within Moral Uncertainty.
          *   Key figure: William MacAskill (wrote the book on this, literally).
      *   **Distinguishing from Pascal's Wager/Fanaticism:**
          *   Pascal/Fanaticism is about *unbounded* expectations (tiny prob $\times$ infinite value).
          *   This problem is about *incommensurability of scales* even with bounded, finite values.
          *   Connection: If you solve scaling poorly, you *invite* fanaticism (one theory dominates because its units are "louder").
      *   **Why it happens (The "Why"):**
          *   Ethical theories aren't just rankings (ordinal); they need cardinal values for expected value calculations.
          *   But theories don't come with a "zero point" or a "unit size" agreed upon across theories.
          *   Analogy: Comparing Celsius to Fahrenheit without a conversion formula, but worse because the "size of a degree" is also undefined relative to each other.
      *   **Proposed Solutions (The "What do people do"):**
          *   *Naive Maximization:* (What the user is doing) - Fails due to scaling.
          *   *Ordinal Ranking:* Just rank options per theory, then aggregate rankings (Borda count). Avoids scaling but loses intensity information.
          *   *Variance Normalization (MacAskill's proposal):* Normalize each theory so its variance across available options is equal. This prevents one theory from dominating just because it uses bigger numbers.
              *   *Pros:* Mathematically defined, handles the "units" issue.
              *   *Cons:* Sensitive to the "option set" (what options are available changes the normalization), can still lead to counter-intuitive results.
