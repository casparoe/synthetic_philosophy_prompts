          *   *Moral Parliament:* Metaphor for negotiation, but doesn't solve the math.
      *   **Is there a Non-Arbitrary Fix?**
          *   Honest answer: **No.** There is no consensus "God's eye view" conversion rate between suffering units and flourishing units.
          *   Variance normalization is the standard "best guess" in effective altruism circles, but it has critics (e.g., Jacob Ross, Ted Lockhart).
      *   **The "Edges" (Boundary Conditions):**
