  ***

  **Walkthrough**

  **Case One** embarrasses the **Simple Conditional Analysis (SCA)**, which equates having a disposition with the truth of the corresponding counterfactual. The single feature doing the work is the **intrinsic loss of the categorical base upon triggering** (the "finkish" mechanism). If you strip out the instant reinforcement, the vase breaks when struck, and the case collapses back into a boring confirmation of SCA.

  **Case Two** also embarrasses **SCA**, but it specifically targets the idea that the counterfactual is sufficient for the disposition. The single feature doing the work is the **alternative causal path** (the tension, not fragility, causes the break). If you strip out the internal tension, the vase withstands the blow, and the case returns to standard behavior.

  A defender of the simple conditional analysis has a **better shot at explaining away Case Two**. Their move would be **contextualism**: they argue that disposition terms like "fragile" are context-sensitive, and in any context where striking leads to breaking, the object counts as fragile *in that context*, effectively biting the bullet and accepting the counterfactual as constitutive.

  **Confidence:** 85%
  **Least Sure Step:** I am least sure about the verdict on which case is easier for an SCA defender to explain away. While standard literature (Lewis) treats the "finkish" case (Case One) as the decisive refutation, some modern contextualist defenses of SCA argue that shifting the time of evaluation handles finks easily, whereas mimics (Case Two) remain stubborn because the counterfactual is true but the intrinsic basis is clearly absent.
