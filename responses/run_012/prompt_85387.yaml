  Case two: an ordinary thing that doesn't have the disposition, even though if you triggered it, it would manifest.

  A couple of sentences each, no possible-worlds talk inside the cases themselves, and if you can use the same kind of object in both, please do — I want to see that the difference is in the setup and not the subject matter.

