      *   **Addressing the "No Faithful Copying $\rightarrow$ No Selection" Inference:** This is the most important philosophical bit. Explain why this is a category error or an outdated view of evolution. Evolution works on populations/statistics, not individual perfect copies.
      *   **Confidence Ratings:** Assign percentages/qualifiers.
