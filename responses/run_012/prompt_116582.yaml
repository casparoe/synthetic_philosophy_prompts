  2.  **Deconstruct the Popular Science Summary:**
      *   *Claim 1:* Dawkins coined 'meme' as a unit of culture replicating brain-to-brain like genes body-to-body.
      *   *Claim 2:* Memes are subject to natural selection (catchy survive, dull die).
      *   *Claim 3:* Culture evolves by the same Darwinian mechanism as biology, only faster.
