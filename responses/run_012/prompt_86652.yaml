      *   *Reality (GitHub):* Publishing on GitHub is "Cheap Talk." It's a signal, not a binding commitment. I can publish "Cooperative Bot v1" but run "Aggressive Bot v2."
      *   *Reality (HFT/Arbitrage):* Arbitrage is usually a zero-sum or negative-sum game if everyone jumps in. If 5 bots see the same arb, prices move, spread vanishes, everyone loses fees. Cooperation means *not* trading or splitting the trade.
      *   *Reality (Latency):* Reading source code takes time. Checking a GitHub repo takes seconds/minutes. Arbitrage lasts milliseconds. The "reading" part of program equilibrium happens *before* the trade, but the verification that the *running* code matches is impossible without trusted hardware/enclaves.

  3.  **Brainstorming Implications (The "Bite"):**

