  You have a sharp eye for the philosophical landscape. You're absolutely right that your professor's list so far tracks the classic distinction between **accidental generalizations** (true but contingent, local, or descriptive) and **nomic generalizations** (supported by theory, physically necessary, or fundamental).

  You're also right that the three major accounts you identified (Humean Best System, Anti-Humean Necessitation, and Counterfactual Support) all "vote" the same way on her current list.
  *   **Humean:** The "Law" items earn their place in the Best System (simple, strong, informative). The "Not Law" items are too local or add complexity without enough payoff.
  *   **Anti-Humean:** The "Law" items reflect relations between universals or natures of properties. The "Not Law" items are mere coincidences.
  *   **Counterfactual:** The "Law" items support counterfactuals (if you *made* a U-235 sphere, it *would* blow up). The "Not Law" items don't (if you *put* a coin in my pocket, it wouldn't *have to* be silver).

  ### Prediction: The Proton/Electron Charge Case

  **Verdict:** She is going to say **Law**.

  **Why?**
  This case fits the "Nomic" pattern of her previous "Law" verdicts (like the electron charge and the speed of light) rather than the "Accidental" pattern (like the coins or gold spheres).
  1.  **Systematic Power (Humean):** Including this statement in our physics makes our theory of the universe vastly simpler and stronger. It explains the neutrality of matter, the stability of atoms, and the dominance of gravity on large scales. It earns its place in the Best System.
  2.  **Necessitation (Anti-Humean):** In the Standard Model, this equality is tied to gauge invariance and anomaly cancellation. It flows from the nature of the electromagnetic field and the structure of the particles. It's not a coincidence; it's required for the theory to work.
  3.  **Counterfactuals:** If we were to construct a new type of atom in a lab next week, the protons and electrons *would* still have equal and opposite charges. It supports subjunctive conditionals.

  **Does this case separate the theories?**
  Honestly? **No.** This is the frustrating part of your seminar right now. All three accounts converge here. They all classify this as a law because it is robust, fundamental, and non-accidental. You won't learn her specific metaphysical commitment from this case alone.

  ### The Case That Forces Her Hand

  To distinguish between these views, you need a case where the **Humean** account gives a different answer from the **Anti-Humean/Counterfactual** accounts. The cleanest wedge in the literature is the problem of **Uninstantiated Laws** (often associated with Michael Tooley).

  **The Test Case:**
  > **"All particles of type 'X' have a spin of 1."**
  > *(With the caveat that 'X' is a theoretically possible fundamental particle that does not actually exist in our universe.)*

  **Why this separates them:**

  1.  **The Humean (Lewis/Best System):**
      *   **Verdict:** **Not a Law.**
      *   **Reasoning:** For a Humean, laws supervene on the "Humean Mosaic"—the total collection of particular facts that actually happen. If there are no X-particles in the history of the universe, there is no truthmaker in the mosaic to support this generalization. It cannot be an axiom of the Best System because it doesn't summarize any actual occurrences. (Note: Some Humeans allow this if it simplifies the system, but the strict Lewisian line is skeptical of uninstantiated universals).

  2.  **The Anti-Humean (Tooley/Armstrong/Dretske):**
      *   **Verdict:** **Law.**
      *   **Reasoning:** Laws are relations between universals (properties), not just summaries of instances. The relation between "being an X-particle" and "having spin 1" can hold even if nothing happens to instantiate it. The law exists in virtue of the natures of the properties, not the frequency of their occurrence.

  3.  **The Counterfactual Account:**
      *   **Verdict:** **Law.**
      *   **Reasoning:** The statement supports the counterfactual: "If an X-particle *were* to exist, it *would* have spin 1." Since the account defines laws by their ability to support counterfactuals, this qualifies.

  **How to propose it:**
  You don't need to get too technical. You can frame it like this:
  *"Professor, what about a statement like: 'All free quarks have integer electric charge'? Given that confinement is a law and no free quarks actually exist, is that a law, or is it a vacuous truth?"*

  **What her answer tells you:**
  *   If she says **"Not a Law"** (because nothing exists to make it true), she is leaning **Humean**.
  *   If she says **"Law"** (because it's true in virtue of the theory/nature of quarks, even if they don't appear), she is leaning **Anti-Humean/Necessitarian**.

  ### Alternative "Hand-Forcer": Meta-Laws

  If you want to test if she follows **Marc Lange's** recent work (very popular in philosophy of science right now), try a **Symmetry Principle**.

  **The Case:**
  > **"The laws of physics are the same in all inertial reference frames."** (The Principle of Relativity)

  **The Split:**
  *   **Standard Humean/Anti-Humean:** It's a **Law** (same status as $F=ma$).
  *   **Lange-style Necessitarian:** It is a **Meta-Law**. It is a law *about* the laws. It has a stronger modal status (it constrains what the first-order laws can be).
  *   **Why it matters:** If she hesitates and says, "Well, it's a *principle*, not a law," or "It's a constraint on laws," she is signaling a commitment to a hierarchical view of laws (Meta-Laws) that distinguishes her from a standard Humean who sees all regularities as flat.

  **My Recommendation:**
  Stick with the **Uninstantiated Law (Free Quarks or X-Particles)**. It's the classic metaphysical wedge. It forces the question: **Do laws depend on what *happens*, or on what *could be*?** That is the heart of the disagreement between her potential philosophical commitments.
