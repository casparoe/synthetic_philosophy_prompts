answer: |-
  This is a splendid puzzle to bring to a reading group, and you are quite right to feel that Hobbes is pulling a fast one. The passage you are grappling with is from Chapter 21 of *Leviathan*, 'Of the LIBERTY of SUBJECTS', and it is indeed the pivot upon which his entire political theory turns.

  To help you lead the session, let us unpack the move, address your suspicions about whether the definition is 'rigged', place him within the tripartite framework of liberty, and finally tackle your worker example.

  ### 1. Is it a Genuine Account or a Rigged Definition?

  The short answer is: it is both. To understand why, one must look at Hobbes's materialist metaphysics and his political desperation.

  **The Metaphysical Commitment:**
  Hobbes is a thoroughgoing materialist. He believes everything in the universe, including human beings, is matter in motion. Therefore, 'liberty' must be defined in physical terms. Just as water is free when it has no dam stopping its flow, a man is free when no external body prevents his motion. If we accept Hobbes's physics, this definition is consistent. He is not merely playing with words; he is trying to purge political theory of what he sees as metaphysical nonsense (like 'free will' as a faculty of the soul).

  **The Political Strategy:**
  However, you are correct to suspect a political motive. Hobbes is writing during a civil war. He believes that seditious ideas about 'freedom' are killing people. Specifically, he is fighting against the classical republican idea (held by the Parliamentarians) that living under a monarchy makes one a 'slave', regardless of how well the king treats you.

  If Hobbes admits that fear or dependence reduces liberty, then:
  1.  Subjects could claim they are not free under an absolute sovereign.
  2.  Covenants made under threat (like surrendering to a conqueror) would be void, because consent given in fear would not be 'free'.

  By defining liberty strictly as the absence of *external physical impediments*, Hobbes achieves two strategic goals:
  *   **Validity of Consent:** It validates the 'Commonwealth by Acquisition'. Even if I submit to a Sovereign because I fear death, I am acting freely (the fear is internal; the sword is not currently blocking my motion). Therefore, my covenant is binding.
  *   **Stability:** It limits the grounds for rebellion. A subject cannot claim they are 'unfree' simply because the law threatens punishment. They are only unfree if they are physically chained.

  So, is there an independent reason to accept it? Only if you accept his materialist worldview and prioritise political stability over intuitive notions of autonomy. He offers clarity at the cost of moral depth.

  ### 2. Hobbes and the Three Concepts of Liberty

  Your reading group will benefit immensely from placing Hobbes against the taxonomy popularised by Isaiah Berlin and later expanded by Quentin Skinner and Philip Pettit.

  **Negative Liberty (Non-interference):**
  Hobbes is the archetype of negative liberty. Berlin explicitly identifies Hobbes as the forefather of this tradition. For Hobbes, freedom is simply the silence of the law. Where the sovereign has not legislated, the subject has liberty. However, note the distinction: modern liberals often value negative liberty as a moral good; Hobbes values it as a leftover. Liberty is merely the gaps in the armour of the state.

  **Positive Liberty (Self-mastery):**
  Hobbes is vehemently opposed to this. The idea that one is only free when ruled by reason or a 'higher self' is dangerous to Hobbes. It implies that if the Sovereign's law conflicts with my conscience (my internal reason), I might claim I am 'truly free' to disobey. For Hobbes, this is the road to anarchy. Liberty is about motion, not moral autonomy.

  **Republican Liberty (Non-domination):**
  This is the crucial battleground. As Quentin Skinner has argued, the English Parliamentarians held a neo-Roman view: a man is unfree if he lives at the mercy of another, even if that other does not interfere.
  *   **The Republican View:** A slave is unfree even if the master is kind, because the slave exists by the master's leave.
  *   **The Hobbesian View:** This is nonsense. If the master does not chain you, you are free. Dependence is not unfreedom.

  Hobbes knows he is attacking the republican view directly. He thinks the republican definition is a 'ghost' that leads men to die for a word. He wants to teach his readers that they are not slaves simply because they have a master (the Sovereign), provided that master does not physically impede them.

  ### 3. The Worker Example: *Reductio* or Feature?

  Let us take your case: a worker whose employer could fire them at any moment but never does, and who does everything they wish.

  **The Hobbesian Verdict:**
  Hobbes must say this worker is free. The threat of firing is a 'fear', which is internal. The employer has not erected an external impediment (like a locked door or a physical restraint). The worker's liberty is determined by the law (which presumably allows employment contracts) and the physical reality of the moment.

  **Is this a *Reductio ad Absurdum*?**
  To a modern republican or a Kantian, yes. It seems absurd to say a precarious worker is as free as a tenured professor. It ignores the coercive power of economic necessity.

  **Can a Hobbesian live with it?**
  Yes, and they would argue it is a feature, not a bug. Here is how to explain it to your group:
  1.  **Predictability:** If we define freedom by vulnerability (domination), almost everyone is unfree. We are all vulnerable to the state, to nature, to stronger men. Hobbes wants a definition that tells us clearly when we are stopped.
  2.  **Power vs. Liberty:** Hobbes distinguishes between the *liberty* to do something and the *ability* (or power) to do it. I have the liberty to run a marathon (no law stops me), but not the ability (my legs are weak). Similarly, the worker has the liberty to quit, but perhaps not the power (financial means) to do so. Hobbes cares about the former, not the latter.
  3.  **The Goal is Peace:** If we accept the republican view, the worker has a grievance against the employer simply by virtue of the power imbalance. This grievance could justify resistance. Hobbes wants to minimise justifications for resistance. By saying the worker is free, he removes one potential cause of conflict.

  ### 4. How to Frame this for the Group

  When you lead the session, I suggest you structure the discussion around the *purpose* of the definition rather than its intuitive truth.

  *   **Start with the Physics:** Remind them that Hobbes is a mechanist. If we are machines, 'freedom' cannot mean 'moral autonomy'. It must mean 'unimpeded motion'.
  *   **The Fear Point:** Ask the group: "If acting out of fear made an action unfree, could anyone ever make a valid contract?" (e.g., handing over money to a mugger, or surrendering to an army). Hobbes needs fear to be compatible with liberty to make political obligation possible.
  *   **The Cost:** Ask them what we lose by accepting Hobbes's definition. We lose the ability to criticise structures of domination (like the employer) as 'unfreeing'. We gain a clear, legalistic boundary for when resistance is permissible (only when the Sovereign physically threatens your life, not when they restrict your choices).
  *   **The Verdict:** Conclude that Hobbes is not trying to capture the 'true essence' of freedom in a moral sense. He is trying to defuse a concept that he believes causes civil war. He is redefining liberty to make it safe for absolutism.

  In summary, Hobbes is offering a stipulative definition designed to stabilise the state. It is 'rigged' in the sense that it is engineered to produce a specific political outcome (obligation), but it is 'genuine' within his materialist system. Your worker example is indeed a bullet Hobbes bites; he would say the worker is free, and that calling them 'unfree' is dangerous poetic nonsense that invites trouble.

  I hope this helps you steer the ship. It is a difficult chapter, but precisely because it is so counter-intuitive, it makes for excellent discussion. Good luck with the session.
