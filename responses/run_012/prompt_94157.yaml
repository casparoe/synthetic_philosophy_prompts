prompt: |-
  I'm a PhD student in philosophy of mind and I'm drafting a position statement on situated cognition for a seminar. Before I commit to it, I want the package stress-tested. Here is where I've landed.

  (1) The parity principle is the right criterion for the cognitive: a process counts as cognitive when it plays the functional role that a corresponding intracranial process would play, and location by itself carries no weight. (2) So Otto's notebook really is part of his memory — not a tool he consults but a constituent of the remembering; cognition extends. (3) I distinguish embedding from extending: causal scaffolding that shapes cognition is not the same as constituting it, and only the latter is at issue in (2). (4) I accept that the coupling-constitution objection names a genuine error to avoid — you cannot get constitution for free out of causal coupling — but I don't think it lands on a properly stated parity principle. (5) I'm a functionalist across the board: mental states are individuated by causal-functional role, not by physical substrate. (6) But I'm an internalist about phenomenal consciousness: experience is realized by brain processes, and there is no extended phenomenal experience.

  Do these hang together? I want an audit, not a survey. Which commitments are genuinely in tension, which only look like they are, and for each real tension what the cheapest repair is and what it costs. Order the tensions by severity, and tell me which single revision would resolve the most. I don't yet know which of these I'd surrender, so I'd rather you locate the pressure than tell me what I already believe. Be explicit about what would change your verdict: which consideration, if it turned out a certain way, would move you to a different diagnosis, and where your reasoning is most likely to be wrong.
reasoning: |-
  Here's a thinking process that leads to the audit of the position statement:

  1.  **Analyze the Request:**
      *   **User:** PhD student in philosophy of mind.
      *   **Task:** Stress-test a specific position statement on situated cognition (6 commitments).
      *   **Goal:** Audit for coherence/tension, not a survey of literature.
      *   **Output Requirements:**
          *   Identify genuine tensions vs. apparent ones.
          *   Order tensions by severity.
          *   Propose cheapest repair + cost for each real tension.
          *   Identify the single revision that resolves the most.
          *   Be explicit about what would change the verdict (conditions for error).
          *   Tone: Rigorous, peer-to-peer, critical but constructive.

  2.  **Analyze the Position Statement (The 6 Commitments):**
      *   (1) *Parity Principle:* Functional role determines cognition; location is irrelevant. (Clark & Chalmers style).
      *   (2) *Extended Cognition:* Otto's notebook is part of memory (constitutive, not just causal).
      *   (3) *Embedding vs. Extending:* Distinguishes causal scaffolding (embedding) from constitution (extending).
      *   (4) *Coupling-Constitution Fallacy:* Accepts the warning but claims a proper parity principle avoids it.
      *   (5) *Functionalism:* Mental states individuated by causal-functional role, not substrate.
      *   (6) *Internalism about Phenomenology:* Experience is realized by brain processes; no extended qualia/consciousness.

  3.  **Initial Coherence Check (Mental Sandbox):**
      *   (1), (2), (3), (4), (5) form a standard "Extended Cognition" (ExC) package à la Clark & Chalmers (1998). They seem internally consistent.
      *   (6) introduces a hybrid view: Extended *Cognition* but Internal *Consciousness*. This is the "Extended Mind, Embodied Consciousness" or "Active Externalism + Internal Phenomenology" split.
      *   *Potential Friction Point 1:* Functionalism (5) + Parity (1) usually implies that if the functional role is met, the mental state exists. If consciousness is a mental state (or supervenes on them), why does it stop at the skull? This looks like the biggest tension.
      *   *Potential Friction Point 2:* Parity (1) says location carries no weight. Internalism about Phenomenology (6) says location *does* carry weight for experience (must be intracranial). Is this a contradiction?
      *   *Potential Friction Point 3:* Coupling-Constitution (4). If I accept the fallacy warning, how do I justify (2) without falling into it? Clark & Chalmers argue parity avoids it, but critics (Adams & Aizawa) say parity *is* the problem.

  4.  **Deep Dive into Tensions:**

      *   **Tension A: Functionalism (5) vs. Internalist Phenomenology (6).**
          *   *The Issue:* If mental states are individuated by functional role (5), and consciousness is a mental phenomenon (or supervenes on mental states), then if the functional role is extended (per 1 & 2), the consciousness should be extended too. Denying extended consciousness while accepting extended cognition looks like "Cognitive Exceptionalism" regarding phenomenology.
          *   *Severity:* High. This is the "Hard Problem" meets ExC. If you're a functionalist about the mind, why aren't you a functionalist about experience?
          *   *Repair:* Adopt a "Phenomenal Concept Strategy" or argue that phenomenology requires specific biological realization (biological naturalism) while cognition does not.
          *   *Cost:* Weakens the universality of Functionalism (5). You become a functionalist about *access* cognition but a non-functionalist about *phenomenal* consciousness.

      *   **Tension B: Parity Principle (1) vs. Internalist Phenomenology (6).**
          *   *The Issue:* (1) says "location by itself carries no weight." (6) says "location *does* carry weight for experience (must be intracranial)."
          *   *Severity:* High/Medium. It looks like a direct contradiction unless "the cognitive" in (1) is explicitly restricted to non-phenomenal processing.
          *   *Repair:* Restrict the scope of the Parity Principle to *non-conscious* cognitive processes (belief, memory, calculation) and exclude phenomenal states.
          *   *Cost:* Makes the theory less elegant. It suggests a dualism of mental kinds (functional/extended vs. phenomenal/internal).

      *   **Tension C: Coupling-Constitution (4) vs. Parity/Extension (1 & 2).**
          *   *The Issue:* Adams & Aizawa argue that Parity *commits* the coupling-constitution fallacy. The user claims a "properly stated" parity principle avoids it.
          *   *Severity:* Medium. This is a dialectical vulnerability rather than a logical contradiction *within* the set. It depends on whether the "proper statement" holds water against the C-C objection.
          *   *Repair:* Strengthen the criteria for "functional role" (e.g., require intrinsic intentionality or specific mark of the cognitive).
          *   *Cost:* Risks collapsing back into internalism if the criteria become too restrictive (the "mark of the cognitive" problem).

      *   **Tension D: Embedding/Extending Distinction (3).**
          *   *The Issue:* Is this distinction stable? If the notebook is coupled tightly enough, why isn't it constitutive?
          *   *Severity:* Low. This is mostly expository clarity, provided the criteria for "constitution" are clear.

  5.  **Ordering and Selecting the "Single Revision":**
      *   *Most Severe:* The Functionalism (5) vs. Internalist Phenomenology (6) clash. If you are a functionalist, you owe an explanation of why phenomenology resists functionalization.
      *   *Single Revision:* Modifying (5) or (6). If you drop (6) (accept extended phenomenology), you align with (1) and (5). If you drop (5) (reject global functionalism), you save (6).
      *   *Cheapest Repair:* Restrict Functionalism (5) to *access* consciousness/cognition, allowing (6) to stand as a separate claim about *phenomenal* consciousness. This is the "Clarkian" move (Clark is often agnostic or leans internal on phenomenology).

  6.  **Drafting the Audit:**
      *   *Tone:* Professional, direct, "senior colleague" vibe.
      *   *Structure:*
          1.  Executive Summary (Verdict).
          2.  Tension Analysis (Ordered by Severity).
          3.  The "Single Revision" Recommendation.
          4.  Conditions for Error (Meta-cognition).

  7.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did I address the Coupling-Constitution point fairly? The user says they accept the objection names a genuine error but parity avoids it. I need to point out that this is the *contested* point in the literature. It's not an internal contradiction, but a dialectical weak spot.
      *   *Check:* Is the Functionalism/Phenomenology tension real? Yes. If mental states = functional role, and experience is a mental state (or aspect thereof), then experience = functional role. If functional role can be extended, experience can be extended. Denying this requires a specific restriction on Functionalism.
      *   *Nuance:* Many ExC proponents (like Clark) hold exactly this view (Extended Cognition, Internal Phenomenology). So it's a known stable position *if* articulated carefully. The tension is in the *justification*, not necessarily the *compatibility*. I need to highlight the justificatory burden.
      *   *Refinement on Parity:* Parity (1) says "location... carries no weight." Internalism (6) says location *does* matter for experience. This is a direct contradiction *unless* "the cognitive" in (1) is defined as excluding phenomenology. I need to make sure the user sees this definitional slip.

  8.  **Final Polish:**
      *   Ensure I answer the specific prompt requirements: "Order tensions by severity," "Cheapest repair," "Cost," "Single revision," "What would change your verdict."
      *   Avoid summarizing the literature; focus on the logical architecture of *their* statement.

  9.  **Final Review against constraints:**
      *   Audit, not survey? Yes.
      *   Order tensions? Yes.
      *   Cheapest repair/cost? Yes.
      *   Single revision? Yes.
      *   Conditions for error? Yes.

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a coherent, defensible position—specifically, it mirrors the "Clarkian" compromise (Extended Cognition, Internal Phenomenology). However, it is not tension-free. The logical architecture holds, but the load-bearing walls are under significant stress. You are attempting to marry a substrate-neutral functionalism with a substrate-specific phenomenology.

  Here is the audit of your six commitments, ordered by the severity of the tension they generate.

  ### 1. The Functionalism-Phenomenology Split (Severity: High)
  **Tension:** Between (5) and (6).
  **The Conflict:** Commitment (5) states mental states are individuated *across the board* by causal-functional role, not substrate. Commitment (6) states phenomenal experience is realized *only* by brain processes (substrate/location specific). If phenomenal experiences are mental states (which they standardly are), (5) implies they should be individuated by role, allowing for extended realization. (6) denies this. You are effectively asserting that functionalism applies to cognition but *not* to consciousness.
  **Why it looks like a contradiction:** You claim location carries no weight for the cognitive (1 & 5), but carries decisive weight for the phenomenal (6). Unless you define "cognitive" in (1) to explicitly exclude "phenomenal," you are violating your own parity principle.
  **Cheapest Repair:** Restrict the scope of (5). Amend (5) to claim functionalism applies to *access* states (belief, memory, calculation) but not *phenomenal* states.
  **Cost:** You lose theoretical unity. You must now explain *why* the mind is functionally individuated in one domain but biologically/locally individuated in another. This invites the charge of ad hocery: you are stopping functionalism exactly where it becomes counterintuitive (extended qualia). You need a principled distinction between "cognitive processing" and "phenomenal experience" that doesn't just rely on intuition.

  ### 2. The Parity Principle Scope (Severity: Medium-High)
  **Tension:** Between (1) and (6).
  **The Conflict:** (1) says "location by itself carries no weight." (6) says location *is* decisive for experience. If experience is a cognitive phenomenon (or supervenes on one), (1) is false. If experience is *not* a cognitive phenomenon, you need to define the boundary of "the cognitive" without referencing location, which is difficult if the primary marker of the mental (experience) is location-bound.
  **Cheapest Repair:** Explicitly restrict the Parity Principle (1) to *non-conscious* cognitive vehicles. State that Parity governs the *vehicles* of thought, not the *feel* of thought.
  **Cost:** This weakens the motivational force of ExC. Much of the appeal of ExC is that it dissolves the boundary of the *agent*. If the agent's experience remains strictly intracranial, the "extended agent" looks like a zombie with a long arm. It reduces ExC to a claim about information storage/retrieval rather than the nature of the thinking subject.

  ### 3. The Coupling-Constitution Defense (Severity: Medium)
  **Tension:** Between (4) and the literature's standard interpretation of (1).
  **The Conflict:** You claim the Coupling-Constitution (C-C) objection doesn't land on a *properly stated* parity principle. This is a dialectical vulnerability, not a logical contradiction. However, Adams & Aizawa argue that *any* parity principle that allows external objects to count as cognitive *just is* an instance of the fallacy (inferring constitution from reliable coupling). Merely asserting you have a "proper" version without specifying the extra criterion (beyond functional role) leaves you open to the charge that you are begging the question.
  **Cheapest Repair:** Specify the "non-negotiables" of the functional role that prevent the fallacy. For example, require that the external resource must be *automatically* endorsed or *transparent* in use (the "glue and trust" criteria).
  **Cost:** This risks shrinking the extension. If you add too many constraints to avoid the C-C fallacy (e.g., requiring intrinsic intentionality or specific causal dynamics), you may exclude Otto's notebook anyway, collapsing back into internalism.

  ### 4. Embedding vs. Extending (Severity: Low)
  **Tension:** Internal coherence of (3).
  **The Conflict:** This is mostly expository, but the line is notoriously fuzzy. If causal scaffolding shapes cognition deeply enough, why isn't it constitutive?
  **Cheapest Repair:** Rely on the "system property" distinction. Constitution means the object is part of the *system* that generates the output; embedding means the object affects the system but isn't part of it.
  **Cost:** Minimal, provided you have clear criteria for system boundaries (which loops back to Tension 3).

  ---

  ### The Single Revision to Resolve the Most
  **Revision:** **Modify (5).**
  **Change:** From "I'm a functionalist across the board" to "I'm a functionalist about *access* cognition, but neutral/physicalist about *phenomenal* consciousness."
  **Why:** This resolves Tension 1 and Tension 2 simultaneously. It acknowledges that Parity (1) applies to the functional architecture of thought, while Internalism (6) applies to the qualitative character of experience. It prevents the contradiction of saying "location doesn't matter" and "location matters" about the same set of phenomena.
  **Cost:** You abandon global functionalism. You must accept a form of dualism (not substance, but property/theory) between the cognitive and the phenomenal. You will need to explain how extended cognitive states interact with internal phenomenal states without causal gaps.

  ### What Would Change My Verdict
  I am diagnosing a tension between your Functionalism and your Internalism. My verdict would change if:

  1.  **You clarify that "Mental States" in (5) excludes Phenomenal States:** If you explicitly define the domain of (5) as *propositional attitudes* or *sub-personal processing*, the tension vanishes. If you meant to include qualia in (5), the position is inconsistent.
  2.  **You adopt a Representationalist Theory of Consciousness:** If you argue that phenomenal consciousness *just is* a certain kind of functional/representational state (e.g., higher-order thought or global workspace), then (6) becomes indefensible alongside (1) and (5). If you hold this view, you *must* drop (6) to maintain coherence.
  3.  **The "Mark of the Cognitive" is Biological:** If you concede that the "cognitive" in (1) requires a biological mark (as Adams & Aizawa insist), then (1) and (2) are false. If you think this consideration is stronger than the Parity intuition, you should drop (1) and (2) and become an Embedded Cognition theorist only.

  ### Where My Reasoning is Most Likely Wrong
  I am assuming that you intend "mental states" in (5) to cover the same ontological ground as "experience" in (6). It is possible you are using a deflationary account of consciousness where phenomenology is not a "state" to be individuated but a mode of access. If your functionalism is purely about *content* individuation and not *vehicle* realization for consciousness, the tension is less severe. Additionally, I may be overestimating the cost of the "dualism" repair; many successful ExC proponents live comfortably with this split, so it may be a feature, not a bug, of your specific seminar position.

  **Final Recommendation:** Keep (1)-(4) and (6). Rewrite (5) to explicitly exclude phenomenal consciousness from the scope of functional individuation. This preserves the ExC argument where it is strongest (memory/belief) while insulating it from the "Extended Qualia" objection which is much harder to defend.
