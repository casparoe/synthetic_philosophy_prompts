answer: |-
  Good evening, everyone. Thanks for coming out. I know it's cold, I know the coffee in the back is questionable, and I know most of you would rather be home than sitting in hard chairs for the next few hours. I promise to keep this shorter than the budget reading last year.

  Look around this room. We've got folks who've lived here their whole lives, folks who just moved in, the person who makes the best pie in the county, and a few folks who make it their business to know the rules better than the rest of us. It's a good crowd.

  We're here to vote on whether to join with [Neighbor Town]. It's a big question. It touches the water coming out of our taps, the school our kids go to, and the roads we drive to get to work. But before we get to the voting, I want to say a word about the room itself.

  It's a peculiar thing, gathering like this. We're here to decide our future, but the rules for who gets to sit in this room were written by people none of us ever met. The line on the map that says who gets a ballot tonight and who doesn't—it's not a river, and it's not a mountain. It's just a line. We know that some neighbors living just over that line will live with the results of tonight's vote even though they don't have a say in it. We know that the authority we're using to vote was established long before any of us were born.

  That's a tension. I'm not going to pretend it isn't there. Lines divide friends. Rules inherited from the past don't always fit the present perfectly. If we pretend this is all simple, we aren't being honest with each other.

  But here's the thing: while we can't redraw the history of how we got here tonight, we can decide how we handle the next few hours. The legitimacy of this vote doesn't come from the lines being perfect. It comes from us treating each other with respect even when the lines feel awkward. It comes from acknowledging that whether the vote passes or fails, we still share these roads, this valley, and this community. The person sitting next to you might vote differently than you, but they're still your neighbor tomorrow morning.

  So, my request is simple. Let's honor the process we have, even if it's not the process we might have designed from scratch. Let's listen. Let's be decent. And let's remember that the goal isn't just to count votes, but to make sure we can still look each other in the eye at the diner when this is over.

  The moderator is ready to take over. Thank you for being here, and let's get to work.
