answer: |-
  ### The Essay Question

  **Time Allowed:** 90 Minutes

  **Prompt:**
  Critics of Confucian role ethics often argue that if persons are constituted by their roles, the theory faces two fatal problems: the problem of the *roleless person* (who has lost all social ties) and the problem of the *bad role* (which demands unjust action). You have been introduced to the distinction between 'load-bearing' roles (which constitute the self) and 'decorative' roles (which one merely occupies).

  Write an essay evaluating whether this distinction can solve both problems simultaneously without collapsing. Specifically:
  1.  Can the distinction save the roleless person from being 'no one'?
  2.  Can it allow for the criticism of a bad role without smuggling in an independent self?

  Conclude by arguing whether the distinction holds or if accepting one solution forces you to abandon the other.

  ***

  ### Model Answer (Strong Student Script)

  The distinction between load-bearing and decorative roles is an attempt to save role ethics from the charge that it dissolves the person entirely into their social function. If roles are merely decorative, then losing them doesn't destroy the self. If roles are load-bearing, they make us who we are. However, when we test this distinction against the problem of the roleless person and the problem of the bad role, it becomes clear that the distinction is unstable. You cannot use it to solve both problems without quietly reintroducing the independent self the theory claims to reject.

  First, consider the roleless person. If a man is exiled and his family dies, he has lost his decorative roles easily enough. But if his load-bearing roles were 'father' and 'subject,' and those are now impossible to perform, is he still a person? A role ethicist might argue that he retains the *capacity* for load-bearing roles. He is not currently a father, but he is still the kind of being that exists to be in relationships. This saves him from being 'no one.' However, this move is risky. If the self is defined by the *capacity* for roles rather than the roles themselves, we are no longer saying the self is constituted by roles. We are saying the self is a substrate that *holds* roles. This sounds suspiciously like the individualism the theory opposes. To save the roleless person, you have to admit there is something left over when the roles are stripped away. That 'something' is a pre-social self.

  Second, consider the bad role. If I am born into a role of subservience that requires me to act unjustly, can I refuse it? If the role is decorative, I can discard it without losing myself. But unjust roles are rarely decorative; they are often the very load-bearing structures of a society (e.g., caste or rigid hierarchy). If I claim the role is merely decorative so I can reject it, I am deciding which roles constitute me and which do not. But who is the 'I' making that decision? If my self is constituted by my roles, I cannot stand outside them to judge them. To condemn a load-bearing role as 'bad,' I need a standard of virtue that exists independently of the role.

  This is where the two prongs pull against each other. To solve the problem of the roleless person, I need to argue that there is a core self that survives the loss of roles (the capacity argument). But if I admit that core self exists to survive the loss of roles, I have already solved the problem of the bad role—because that same core self can judge the roles. But if I do that, I have abandoned the central claim of role ethics: that the self is *nothing but* its roles.

  Alternatively, if I stick strictly to the theory and say there is no self without load-bearing roles, then the roleless person is indeed 'no one,' and the person in a bad role cannot criticize it without ceasing to exist. The distinction between load-bearing and decorative tries to have it both ways. It wants to say some roles are essential (to explain social bonding) and some are optional (to explain moral critique). But you cannot classify roles as optional without a judge who is not fully constituted by those roles.

  Therefore, the distinction collapses. It functions as a patch that hides the need for an independent moral agent. To save the roleless person, you must admit a self that precedes roles. To condemn a bad role, you must admit a self that stands above roles. Once you admit either, the claim that 'persons are constituted by roles' is no longer strictly true. The distinction doesn't solve the tension; it just locates the independent self in the space between the two types of roles.

  ***

  ### Marking Scheme (Out of 20)

  **A Range (17–20): The Tension is Central**
  *   **Thesis (3 pts):** Explicitly states that the distinction is unstable or creates a new contradiction.
  *   **Prong 1 Analysis (4 pts):** Correctly identifies that saving the 'roleless person' requires positing a capacity or self that survives role-loss, which threatens the core theory.
  *   **Prong 2 Analysis (4 pts):** Correctly identifies that judging a 'bad role' requires a standpoint outside the role (smuggling in an independent standard).
  *   **Synthesis (5 pts):** Crucially, explains *why* solving one prong undermines the other (e.g., "If you save the roleless person, you've already admitted the self that can judge the bad role").
  *   **Terminology (2 pts):** Uses 'load-bearing' and 'decorative' accurately throughout.
  *   **Style (2 pts):** Direct, argumentative, no fluff.

  **B Range (13–16): The Problems are Separate**
  *   **Thesis (2 pts):** States the distinction is useful but has limits.
  *   **Prong 1 Analysis (3 pts):** Discusses the roleless person but treats it as a separate issue from the bad role.
  *   **Prong 2 Analysis (3 pts):** Discusses the bad role but fails to see that the solution requires an independent self.
  *   **Synthesis (2 pts):** Attempts a conclusion but misses the structural contradiction between the two prongs.
  *   **Terminology (2 pts):** Uses the terms correctly.
  *   **Style (2 pts):** Clear, but perhaps too descriptive.

  **C Range (9–12): The Standard Recitation**
  *   **Thesis (1 pt):** Vague or restates the prompt.
  *   **Content (5 pts):** Discusses roles generally but ignores the specific 'load-bearing/decorative' distinction or treats them as synonyms.
  *   **Analysis (4 pts):** Falls back on "Confucianism vs. Western Individualism" generalizations.
  *   **Penalty:** -5 marks if the essay relies on the "Westerners believe in rights/Confucians believe in duty" trope without analyzing the specific logical problem.

  **F Range (0–8): Fundamental Misunderstanding**
  *   Fails to address both prongs.
  *   Misdefines the core distinction.
  *   Less than 400 words.

  ***

  ### Common Pitfalls (For Feedback Comments)

  1.  **The "Western Contrast" Trap:**
      *   *The Move:* Spending the first paragraph explaining how Westerners believe in individual rights and Confucians believe in community.
      *   *The Comment:* "You are reciting the standard intro I asked you to avoid. This question is about internal consistency, not cultural comparison."
  2.  **The "Virtue Solves All" Evasion:**
      *   *The Move:* Arguing that a virtuous person just *knows* a role is bad, without explaining *where* that knowledge comes from if the self is made of roles.
      *   *The Comment:* "You haven't explained the source of the critique. If the self is the roles, where does the standard to judge the role come from?"
  3.  **The Terminology Swap:**
      *   *The Move:* Using 'load-bearing' to mean 'important' and 'decorative' to mean 'unimportant' rather than 'constitutive' vs. 'occupiable.'
      *   *The Comment:* "You are treating this as a hierarchy of importance. The distinction is ontological (what makes you), not axiological (what is valuable)."
  4.  **The Silent Smuggle:**
      *   *The Move:* Solving the 'bad role' problem by saying "I can choose to leave the role," without acknowledging that the 'I' making the choice is now independent of the role.
      *   *The Comment:* "You have smuggled in an independent agent to solve the problem. Acknowledge that this contradicts the premise that roles constitute the self."
