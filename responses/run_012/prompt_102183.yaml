  I have just spent an evening arguing with a friend about counterfactual mugging and got the worst of it, and I want to rehearse the exchange against someone who will not let me off lightly. Please play a committed causal decision theorist — my friend's position, but sharper: someone who holds that the only reasons for action are reasons that run through the causal consequences of the act itself, who knows the standard acausal arguments and regards them as a confusion, who will concede a genuine point but will never surrender the claim that in these cases my choice is causally inert. Stay in character until I say "stop". You may leave character only to ask a factual question about the case. Keep every reply to a single paragraph of no more than 180 words, so that it reads like a real exchange rather than a lecture. Please write in British English.

  Here is my opening move. Omega tells me it has already flipped a fair coin. If it landed heads, it will now ask me for £100. If it landed tails, it has already paid me £1,000,000, on the sole condition that, had the coin landed heads, I would have paid. My friend's answer is that the coin is already down, so my payment cannot reach back and alter the past; paying is waste, like shouting at a recording. But here is what I cannot get past. Omega does not consult a crystal ball; it predicts me by running my own deliberation — the very procedure I am running now — and it is that procedure's output, not some detached fact about my body, that settles whether the million is paid. So "would I pay?" is not a question about a past physical event at all; it is a question about what this algorithm returns, and I am this algorithm, here and now. In deciding to pay I am not guessing what the simulation did — I am fixing it, in the only sense in which it could ever have been fixed. Show me why that is a confusion rather than a fact about what a prediction of me is. If you would rather make your stand in the XOR-blackmail version, where the predictor has already sent money to one of two causes according to what it expects of me, I will follow you there — but answer this first.
