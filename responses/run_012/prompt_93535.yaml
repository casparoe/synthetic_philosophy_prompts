  # Joint Statement on Solomonoff Induction
  **Contributors:** Friend A, Friend B, [User]
  **Date:** [Current Date]
  **Status:** Adversarial Collaboration Draft

  ## 1. Shared Premises
  We agree on the following formal and structural claims regarding Solomonoff Induction (SI). Disagreements below concern the *interpretation* and *application* of these facts, not the facts themselves.

  1.  **Formalism:** SI defines a prior probability distribution over observable sequences based on the set of programs that generate them on a fixed Universal Turing Machine (UTM). The prior weight of a program $p$ is $2^{-|p|}$.
  2.  **Simplicity:** Within this formalism, "simplicity" is strictly defined as Kolmogorov complexity relative to the chosen UTM. Shorter programs receive exponentially higher prior probability.
  3.  **Convergence:** If the true data-generating process is computable, SI's predictions converge to the true distribution. The total expected squared error is bounded by a constant related to the complexity of the truth in the chosen UTM.
  4.  **Uncomputability:** The SI prior is lower semi-computable but not computable. No finite agent can calculate it exactly; any actual implementation must be an approximation.
  5.  **Machine Dependence:** Changing the reference UTM changes the prior probability of any specific sequence by at most a multiplicative constant factor ($2^{K(U'|U)}$). This constant depends on the mutual complexity of the two machines but is independent of the data length.
  6.  **Experiment Limitations:** Our bit-stream prediction experiment demonstrated that human agents possess a strong bias toward simple patterns. It did not demonstrate that SI is the unique correct prior, nor did it measure the magnitude of the machine-dependence constant.

  ## 2. The Bit-Stream Experiment: What It Settled
  We ran an experiment predicting bits from a hidden program. We disagree on what this proved. We agree on the following clarification:

  *   **What it settled:** It confirmed that when humans are forced to predict unknown sequences, our errors decrease over time in a way consistent with *some* simplicity bias. It confirmed that "guessing the simplest rule" is a viable heuristic for the specific class of problems we generated.
  *   **What it did not settle:** It did not distinguish SI from other priors that also penalize complexity (e.g., Bayesian models with different penalty terms). It did not measure whether the specific weighting ($2^{-|p|}$) was superior to other weightings. It did not address the machine-dependence constant, as the hidden program was simple enough that all reasonable UTMs would agree on it quickly.
  *   **Conclusion:** The experiment validates the *utility of simplicity biases*, but not the *uniqueness of Solomonoff Induction*.

  ## 3. Verbal Disputes & Clarifications
  We acknowledge that some arguments stem from differing definitions of key terms. We adopt the following usage for this document:

  *   **"Objective":**
      *   *Friend A* uses this to mean "invariant across all reasonable UTMs in the limit."
      *   *Friend B* uses this to mean "independent of any choice of UTM for finite data."
      *   *Resolution:* We agree the prior is **not objective** in Friend B's sense. We agree it is **asymptotically invariant** in Friend A's sense.
  *   **"Simpler":**
      *   *Friend A* treats this as "higher prior probability in the universal distribution."
      *   *Friend B* treats this as "a substantive assumption about the world smuggled into the UTM choice."
      *   *Resolution:* We agree SI **defines** simplicity via program length. We disagree on whether this definition is **neutral** (A) or **substantive** (B).
  *   **"Foundation of Occam's Razor":**
      *   *Friend A* means SI provides a mathematical theorem that justifies preferring simpler theories.
      *   *Friend B* means SI assumes Occam's Razor via the $2^{-|p|}$ weighting and merely formalizes it.
      *   *Resolution:* We agree SI **formalizes** Occam's Razor. We disagree on whether it **derives** it from first principles or **encodes** it as an axiom.

  ## 4. Core Disagreements
  The following table summarizes the substantive disagreements that remain after accepting the premises above.

  | Topic | Friend A's Position | Friend B's Position |
  | :--- | :--- | :--- |
  | **Normative Force** | SI defines ideal rationality. Even if uncomputable, it serves as the correct regulatory ideal for approximations. | An uncomputable standard cannot normatively guide finite agents. A theory that cannot be implemented cannot dictate belief. |
  | **The Constant Factor** | The machine-dependence constant is negligible for any data stream long enough to be interesting. It washes out. | We never have "long enough" data. The constant dominates the posterior for any finite dataset humans actually encounter. |
  | **Occam's Status** | SI derives Occam's Razor from the assumption of computability and the structure of computation space. | SI assumes Occam's Razor by assigning higher weight to shorter programs. It explains consistency, not justification. |
  | **Convergence Relevance** | The error bound guarantees that deviations from SI are punishable by loss of predictive accuracy. | The error bound is too loose for finite data. Convergence in the limit offers no guidance on which hypothesis to pick today. |

  ## 5. Cruxes & Predictions
  To move forward, we identify the following sub-questions. Settling these would force at least one party to update their position.

  ### Crux 1: The "Natural" UTM
  **Question:** Is there a "natural" UTM (e.g., based on physics or simple logic) such that the constant factor between it and any other "reasonable" UTM is small enough to be irrelevant for human-scale data?

  *   **Relevant Case:** Compare predictions on a dataset of size $N=10^6$ using a standard UTM vs. a "perverse" UTM (one where a complex string is assigned a short program).
  *   **Friend A Prediction:** The "perverse" UTM is unnatural. Among "natural" UTMs, the constant factor is small enough that posteriors converge to agreement well before $N=10^6$.
  *   **Friend B Prediction:** "Natural" is ill-defined. Any choice of "natural" UTM is itself a prior assumption. The constant factor between any two specific UTMs can be arbitrarily large regardless of "naturalness," dominating the posterior at $N=10^6$.

  ### Crux 2: Finite vs. Asymptotic Error
  **Question:** Does the Solomonoff error bound guarantee high accuracy for realistic data sizes, or is the bound too loose to be useful before the limit?

  *   **Relevant Case:** Calculate the theoretical error bound $K(\mu)$ for a specific computable distribution $\mu$ and compare it to the actual data required to achieve 95% predictive accuracy.
  *   **Friend A Prediction:** The constant $K(\mu)$ is small for "real world" hypotheses. The bound is tight enough that SI approximations outperform non-SI priors on realistic data sizes.
  *   **Friend B Prediction:** The constant $K(\mu)$ includes the complexity of the UTM itself. For realistic data sizes, the bound is so loose that it permits massive deviation from the truth, rendering it normatively useless.

  ### Crux 3: The Source of the Bias
  **Question:** Is the success of SI-based reasoning due to the formalism itself, or because the formalism matches the actual structure of our universe?

  *   **Relevant Case:** Generate data from a process that is computable but intentionally "anti-Occam" (where longer programs are made more probable by the generator).
  *   **Friend A Prediction:** SI will eventually converge on the truth even here, because the truth is still computable. The prior bias is overcome by likelihood.
  *   **Friend B Prediction:** SI will perform poorly compared to a prior matched to the generator. This proves SI only works when the universe happens to align with the SI prior, confirming it is not a universal foundation.

  ## 6. Next Steps
  We agree to suspend the claim that "SI is the foundation of rationality" (A) and "SI is a bait and switch" (B) until Crux 1 is explored via a concrete comparison of UTMs on finite data. We will simulate the "Natural vs. Perverse UTM" case described in Crux 1.
