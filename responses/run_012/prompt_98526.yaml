      *   *Setup:* Divide 18 students into two Courts (9 each). Seat them at opposite ends of the room. Give each Court a sealed "Judicial Mandate" envelope. Court 1 gets "Strict Textualism": Apply the words exactly as written, ignore outside intent. Court 2 gets "Pure Purposivism": Achieve the Council's goal, ignore technical definitions if they hinder the goal. Give each Court 100 "Legitimacy Tokens" (paper slips). Losing a token hurts their final grade/participation score. They must issue written rulings.
