      *   **The Rounds:**
          *   Total 75 mins.
          *   Intro (5 mins).
          *   Round 1 (25 mins): Chamber A (Text), Chamber B (Purpose). Rule on Case 1 & 2.
          *   The Swap (5 mins): Explain the flip.
