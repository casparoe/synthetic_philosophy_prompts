      *   *The Rounds:* **0-5 min:** Distribute materials and Mandates. Emphasize secrecy; do not share reasoning with the other Court yet. **5-30 min (Round 1):** Courts deliberate and rule on both cases using their assigned Mandate. They must write a one-sentence justification binding on future cases. Collect rulings. **30-35 min (The Swap):** Announce a "Judicial Reappointment." Hand Court 1 the Purposivist Mandate; hand Court 2 the Textualist Mandate. They keep their remaining Tokens. **35-60 min (Round 2):** Courts re-rule on the *same* cases using the *new* Mandate. They must note if their verdict flips. **60-75 min (Merger):** Bring rooms together. Compare rulings. They must draft one amended Section 4 that satisfies both Courts' final outcomes without losing Tokens.
