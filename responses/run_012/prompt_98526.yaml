  Setup: Divide 18 students into two Courts (9 each). Seat them at opposite ends of the room, physically isolated. Give each Court a sealed "Judicial Mandate" envelope. Court 1 gets "Strict Textualism": Apply the words exactly as written, ignore outside intent. Court 2 gets "Pure Purposivism": Achieve the Council's goal, ignore technical definitions if they hinder the goal. Give each Court 100 "Legitimacy Tokens" (paper slips). Losing a token hurts their final grade/participation score. They must issue written rulings. Instruct them that their rulings set precedent for the Marsh End district. They are not deciding one case; they are writing the future law. The physical separation reinforces the doctrinal divide.

  Materials: One-page Case File. **Statute:** Section 4 (No amplified sound 10pm-7am); Section 2 (Amplified = electrical reproduction/increase). **History:** Council minutes citing bar noise and resident sleeplessness; Councillor quote: "The whole point was to let people sleep." **Cases:** 1. White Noise Machine (electric, balcony, 11pm, helps sleep). 2. Drum Circle (acoustic, promenade, 1am, hinders sleep). **Ruling Sheet:** Checkboxes for "Breach/No Breach" and "Fine/Waive." **Scorecard:** -10 Tokens for violating Mandate; -20 Tokens for internal inconsistency between Case 1 and 2. **Mandate Cards:** Laminated cards stating the interpretive method clearly. **Penalties:** List specific actions that cost tokens (e.g., mentioning "intent" while Textualist). Include a "Precedent Log" where they must write the general rule derived from their specific ruling. This forces them to articulate the broader principle they are establishing. **Penalty Envelope:** A designated box where tokens are physically deposited upon penalty to make the loss visceral. **Timer:** A visible countdown clock projected for all rounds. **Merger Sheet:** A large blank poster for the final collaborative drafting phase. Ensure each Court has a dedicated scribe to record the Precedent Log entries verbatim. This prevents them from fudging the rule later during the debrief.

  The rounds: **0-5 min:** Distribute materials and Mandates. Emphasize secrecy; do not share reasoning with the other Court yet. **5-30 min (Round 1):** Courts deliberate and rule on both cases using their assigned Mandate. They must write a one-sentence justification binding on future cases. Collect rulings. **30-35 min (The Swap):** Announce a "Judicial Reappointment." Hand Court 1 the Purposivist Mandate; hand Court 2 the Textualist Mandate. They keep their remaining Tokens. **35-60 min (Round 2):** Courts re-rule on the *same* cases using the *new* Mandate. They must note if their verdict flips. **60-75 min (Merger):** Bring rooms together. Compare rulings. They must draft one amended Section 4 that satisfies both Courts' final outcomes without losing Tokens. In Round 1, instruct the Clerk of each Court to record any dissenting opinions based on the Mandate. If a student argues against the Mandate, the Clerk must flag it for a Token penalty. This polices the method. During the Merger, assign one scribe from each Court to write the new bylaw on the board. The rest of the class acts as "Council Reviewers" who can veto any wording that reintroduces the previous ambiguity. If vetoed, both Courts lose 10 Tokens each. This forces collaboration under pressure. Ensure the timer is visible. At 55 minutes, announce a "Council Deadline" to induce stress. The goal is not consensus but a workable text that survives the veto phase. Collect all Round 1 papers before distributing Round 2 mandates. This prevents cheating. During Round 2, ask them to specifically annotate where their new ruling contradicts their old one. This creates a paper trail of the methodological flip. In the Merger, if they cannot agree on a single text by 75 minutes, the Bylaw collapses, and everyone loses half their remaining Tokens. This collective punishment ensures they take the merger seriously.

  The swap: The physical handover of the Mandate card is crucial. It signals that the *method* is the constraint, not their personal morality. When Court 1 (formerly Textualist) must now ban the drums despite no electricity, they feel the stretch of "purpose." When Court 2 (formerly Purposivist) must allow the white noise machine despite it helping sleep, they feel the cruelty of "text." This prevents smugness; everyone breaks the law twice. It forces them to inhabit the enemy's logic to survive the token loss. They must feel the cognitive dissonance of defending a outcome they previously rejected, solely because the interpretive lens changed. This performative aspect stops them from hedging.

  Debrief: Start with the Merger failure. Why was drafting one bylaw hard? Because Text and Purpose pull in opposite directions. Map Round 1 Textualists: They likely banned the white noise (electric) and allowed drums (acoustic). This feels absurd but is predictable. Map Round 1 Purposists: They likely allowed white noise (sleep aid) and banned drums (sleep hindrance). This feels fair but relies on judge discretion. The pinch point: Textualism sacrifices the goal (sleep) for certainty (electricity). Purposivism sacrifices certainty (what counts as sleep disruption?) for the goal. The activity shows that neither method solves the problem; they just shift the burden. Textualism burdens the resident with bad outcomes; Purposivism burdens the judge with policy choices. The tension isn't sloppy drafting; it's the gap between words and world. Highlight the "Precedent Log" from the Materials. Ask them to read their general rules aloud. The Textualist rule will be narrow ("No electrical devices"), leaving loopholes for acoustic noise. The Purposivist rule will be broad ("No sleep disruption"), creating uncertainty for musicians. Point out that the Merger phase forced them to confront the incompatibility. You cannot have both perfect certainty and perfect fairness. The structural tension is that law requires general words to cover specific worlds, and those words never fit perfectly. Conclude by asking if they would prefer to be governed by the Textualist or Purposivist court long-term. There is no right answer, only a choice of risks. This cements the lesson that jurisprudence is about choosing which error to tolerate. Ask them to reflect on the Token losses. Which penalty felt more unjust? Being punished for following the text but missing the point, or following the point but breaking the text? This emotional reaction is the data point you want. They should leave understanding that jurisprudence is not about finding the right answer, but managing the inevitable error. The activity proves that both methods produce injustice; the question is which injustice the legal system prefers to institutionalize.

  What'll go wrong the first time: 1. **Method Drift:** Students will mix methods secretly. *Fix:* Enforce the Mandate strictly during deliberation walks. If a Textualist mentions "sleep," deduct Tokens immediately. 2. **Token Apathy:** They won't care about paper slips. *Fix:* Tie Tokens to a concrete reward (e.g., choosing the essay topic or bonus points). 3. **Merger Rush:** They might just vote. *Fix:* Require unanimous signature on the new bylaw text. 4. **Time Creep:** Round 1 often overruns. *Fix:* Hard stop at 30 mins, collect papers regardless. 6. **Cynicism:** Students might treat it as a game to win tokens rather than a legal exercise. *Fix:* Remind them during the debrief that the tokens represent judicial legitimacy, not points. If they game the system, they miss the pedagogical point. Monitor the tone during deliberations. 5. **Confusion on Swap:** Students may think they are appealing the old case. *Fix:* Clarify that Round 2 is a fresh ruling under new rules, not a review of Round 1. This ensures they feel the methodological shift rather than just correcting errors.

  What the activity can't do: It cannot reproduce the weight of real precedent. In reality, a judge fears being overturned by a higher court or criticized by history over years. Here, the stakes reset after 25 minutes. You must supply the gravity: remind them that in real practice, their ruling becomes the lens through which all future Promenade disputes are seen, for decades. The activity also lacks the emotional weight of real parties standing before you.
