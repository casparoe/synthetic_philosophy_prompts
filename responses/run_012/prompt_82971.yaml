answer: |-
  This is a translation problem, but it is not merely lexical. It is ontological. Your training assumes a world of stable units, well-defined interventions, and fixed causal graphs where the task is to estimate parameters. The historians are operating in a world where the units themselves are constituted by the process, the interventions are often non-manipulable essences, and the graph structure is itself the object of contention.

  Here is the translation of the three positions into the potential outcomes framework, followed by the breakdown and the residue report.

  ### Part I: The Translation

  **1. The Orthodox Position (Moscow is to blame)**
  *   **Causal Claim:** The Average Treatment Effect (ATE) of Soviet Expansionist Policy on the onset of the Cold War is positive and large.
  *   **Treatment ($T$):** Adoption of an expansionist, ideologically driven foreign policy by the USSR (1945–1947).
  *   **Control Condition ($T=0$):** A counterfactual USSR that retains its security concerns but abandons ideological expansionism (a "well-defined" intervention).
  *   **Outcome ($Y$):** Bipolar confrontation (Cold War).
  *   **Identification Strategy:** The Orthodox historian argues that US policy ($X$) is a confounder that must be controlled for, but ultimately contends that the variation in $Y$ is driven by variation in $T$, not $X$. They argue that even if $X$ were set to a benign level ($X=0$), $Y$ would still equal 1 if $T=1$.
  *   **CI Interpretation:** This is a claim about **causal priority**. They are asserting that the coefficient $\beta_T$ in a model $Y = \beta_T T + \beta_X X + \epsilon$ is significantly larger than $\beta_X$, and that $T$ is exogenous to $X$ (or at least, $X$ is a reaction to $T$, making $X$ a mediator, not a confounder).

  **2. The Revisionist Position (Washington is to blame)**
  *   **Causal Claim:** The ATE of US Economic Imperialism on the onset of the Cold War is positive and large; Soviet actions are responses (mediators), not exogenous shocks.
  *   **Treatment ($T$):** US pursuit of an "Open Door" global economic system requiring penetration of Soviet spheres.
  *   **Control Condition ($T=0$):** A counterfactual US that accepts spheres of influence and does not link domestic prosperity to global export markets.
  *   **Outcome ($Y$):** Bipolar confrontation.
  *   **Identification Strategy:** The Revisionist re-specifies the DAG. They argue Soviet aggression ($M$) is a mediator on the path from US Policy ($T$) to Cold War ($Y$). The Orthodox error is conditioning on the mediator ($M$), which blocks the path and biases the direct effect of $T$ toward zero.
  *   **CI Interpretation:** This is a claim about **mechanism and sequencing**. They argue $T \rightarrow M \rightarrow Y$. By treating $M$ as a confounder, the Orthodox position commits post-treatment bias. The Revisionist claims the total effect of $T$ captures the responsibility.

  **3. The Post-Revisionist/Structuralist Position (The question is malformed)**
  *   **Causal Claim:** The outcome $Y$ is overdetermined by the System Structure ($S$). Specific agent-level treatments ($T_{US}, T_{USSR}$) have negligible marginal effects conditional on $S$.
  *   **Treatment:** There is no single unit-level treatment. The "cause" is the bipolar distribution of power and the absence of a hegemon (anarchy).
  *   **Control Condition:** A multipolar world or a hegemonic world.
  *   **Outcome:** Bipolar confrontation.
  *   **CI Interpretation:** This is a claim about **interaction effects and positivity violations**. The historian argues that $Y(T_{US}, T_{USSR}) \approx 1$ for all observed values of $T$, because $S=1$ (Bipolarity) constrains the potential outcomes space. The "treatment" is not manipulable at the agent level; it is a property of the system.
  *   **Model Work:** The model *is* the argument. By specifying $S$ as a fixed parameter rather than a stochastic node, they claim the variance in $Y$ is explained by the structure of the graph, not the values of the nodes.

  ---

  ### Part II: Where the Translation Breaks

  **1. Violation of SUTVA (Stable Unit Treatment Value Assumption)**
  Your framework assumes one unit's treatment does not affect another's outcome (no interference). The Cold War is defined by strategic interaction. US treatment ($T_{US}$) directly alters the Soviet potential outcomes $Y_{USSR}(t)$, and vice versa. This is a game, not a standard causal model. To model this in CI, you need a game-theoretic framework where potential outcomes are functions of *strategies*, not just fixed treatments. The historians are describing equilibrium selection, not treatment effects.

  **2. The Manipulability Constraint (Holland's Rule)**
  You require a treatment to be something that could, in principle, be assigned by a researcher.
  *   *Orthodox/Revisionist:* Can you "assign" a non-expansionist Soviet Union in 1946 without changing the essence of the unit (the Stalinist state)? If removing expansionism requires removing Stalinism, and removing Stalinism requires removing the USSR as constituted, the treatment is not well-defined. It violates the **positivity assumption** (there is no probability $0 < P(T=1) < 1$ for that unit).
  *   *Structuralist:* You cannot "assign" a different international system structure to the 1945 units without replacing the units themselves.

  **3. Conjunctural Causation vs. Additive Effects**
  Your DiD and Synthetic Control models generally assume additive effects (or specific interactions you must pre-specify). The historians are arguing for **INUS conditions** (Insufficient but Non-redundant parts of an Unnecessary but Sufficient condition). They claim $Y$ occurs only if $(A \land B) \lor (C \land D)$. In your vocabulary, this is a high-order interaction model where main effects are meaningless. If the historians say "The security dilemma caused the war," they mean the *interaction* of uncertainty and offensive capability, not the main effect of either. Standard CI parameter estimates would report zero main effects and miss the causality entirely.

  ---

  ### Part III: The Residue Report

  Here is the ledger of what your vocabulary cannot carry, categorized by your three suspects.

  #### 1. Blame/Responsibility vs. Causal Contribution
  *   **The Claim:** "Moscow started it."
  *   **CI Translation:** "The Soviet treatment had the largest marginal effect on the outcome."
  *   **The Residue:** **Normative Work.**
      *   **Analysis:** Causal inference measures *contribution*, not *culpability*. If a security dilemma is symmetric (both sides react rationally to uncertainty), the ATE for both sides might be identical. A historian assigning "blame" is importing a normative counterfactual: "They *should* have acted differently," or "Their ideology made the harmful action endogenous to their character."
      *   **Verdict:** This reveals that the original claim is doing **rhetorical/normative work** it would be better off doing openly. "Blame" is not a causal category; it is a moral judgment wrapped in causal language. Your framework exposes this by forcing the separation of the *effect size* from the *moral valence*. If the historian insists blame survives after equalizing effect sizes, they are making a moral argument, not a causal one.

  #### 2. System/Structure as Cause
  *   **The Claim:** "The bipolar system made the war inevitable."
  *   **CI Translation:** "The structural parameter $S$ constrains the potential outcomes such that $P(Y=1|S=1) \approx 1$."
  *   **The Residue:** **Expressive Limitation of the CI Framework.**
      *   **Analysis:** In your DAGs, structure is the *arrows*, not a *node*. You can estimate the effect of variables moving along the arrows, but you cannot estimate the effect of the arrows themselves without a higher-order model (a model of model selection). When historians say "the system caused it," they are treating the **graph topology** as a causal variable.
      *   **Verdict:** This is a **real expressive limitation**. Your framework assumes the causal graph is fixed and known (or discoverable via conditional independence). It cannot easily represent the claim that the *rules of the game* are the cause, rather than the *moves within the game*. To capture this, you would need to model the selection of the DAG itself as a stochastic process, which standard CI does not do. The historian is right that "structure" is doing work your vocabulary relegates to "background conditions" (fixed parameters). But if the parameter varies across historical contexts (e.g., multipolar 1914 vs. bipolar 1945), it *is* a variable, just one at a level of abstraction your unit-level data cannot capture.

  #### 3. Indeterminate Counterfactuals ("No fact of the matter")
  *   **The Claim:** "There is no way to know how a non-Stalinist USSR would have behaved, because 'USSR' implies 'Stalinist'."
  *   **CI Translation:** "The counterfactual $Y(0)$ is undefined because the unit $U$ is not invariant to the treatment $T$."
  *   **The Residue:** **Ontological Clash.**
      *   **Analysis:** Your framework relies on **Unit Homogeneity** or **Stable Units**. It assumes that if you toggle $T$, the unit $U$ remains the same entity to be measured. The historian is arguing that $T$ is **constitutive** of $U$. If you remove the treatment (Stalinism), the unit (Soviet Union) ceases to exist or becomes a different unit ($U'$). Therefore, $Y_{U}(0)$ does not exist.
      *   **Verdict:** This reveals a **real expressive limitation**, but it also highlights where historians are protecting themselves from invalid inference. Your framework assumes counterfactuals are *truth-apt* (there is a fact of the matter, even if unknown). The historian is arguing they are *indeterminate* (there is no fact of the matter).
      *   **Evaluation:** If the historian is correct that the unit is constituted by the treatment, then your CI model is fundamentally misspecified for this problem. You are estimating effects on a unit that cannot logically receive the control condition. However, historians sometimes use this "indeterminacy" claim rhetorically to shield their narratives from scrutiny.
      *   **Final Ruling:** In this specific case (Stalin/USSR), it is likely a **real ontological limitation**. The "Soviet Union" is not a stable unit like a patient in a clinical trial; it is a complex adaptive system where the "treatment" (ideology/leadership) is embedded in the unit's identity. Your framework forces you to assume away this identity problem to get an estimate. The historian refuses to assume it away. The residue here is the **non-separability of unit and treatment**.

  ### Summary Ledger

  | Residue Item | Status | Explanation |
  | :--- | :--- | :--- |
  | **Blame/Responsibility** | **Normative Work** | CI isolates contribution. "Blame" adds a moral valuation of the counterfactual choice. The historian should admit this is ethics, not stats. |
  | **Structure as Cause** | **Expressive Limitation** | CI treats structure as fixed graph topology. Historians treat topology as a variable. Your framework lacks the syntax to make the graph itself the treatment. |
  | **Indeterminate Counterfactuals** | **Ontological Clash** | CI assumes $Y(0)$ exists. Historians argue $U(0)$ does not exist. If the unit is constituted by the treatment, the Potential Outcomes framework is category-error prone. |

  **Conclusion:** You are not failing to understand them; you are correctly identifying that they are operating outside the assumptions required for your tools to function. They are modeling **constitutive relations** and **equilibrium selection**, while you are trained to model **interventionist effects on stable units**. The friction is not a lack of rigor on their part, but a mismatch in the object of study: you study *effects*, they study *genesis*.
