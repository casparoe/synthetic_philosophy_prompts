      *   *Residue:*
          1.  Blame: Normative. CI can't do "ought."
          2.  Structure: CI treats structure as fixed graph. Historians treat structure as a causal force. This is a limitation of CI (graph vs. node).
          3.  Indeterminacy: CI assumes stable unit response. History often assumes constitutive effects (changing the unit).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I say historians are doing bad CI? *Correction:* Ensure I frame it as "different epistemic goals."
      *   *Check:* Did I address the "Stalin removed in 1946" point? *Correction:* Yes, under Indeterminate Counterfactuals. This touches on "compound treatments" and "unit homogeneity."
      *   *Check:* Is the distinction between "cause" and "background condition" clear? *Correction:* Use the DAG analogy (fixed parameters vs. stochastic nodes).

  9.  **Final Polish:** Ensure the "Residue Report" directly answers the prompt's specific question about expressive limitation vs. normative work. (e.g., Blame = Normative. Structure = Expressive Limitation. Indeterminacy = Ontological Clash).

