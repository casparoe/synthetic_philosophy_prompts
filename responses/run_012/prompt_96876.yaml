answer: |-
  ### 1. Exam Question

  **Module:** MET304 Infinity and Continuity
  **Time Allowed:** 90 Minutes
  **Word Limit:** Roughly 800 words

  **Question 1**

  Consider the following three specifications:

  *   **Lamp A (Thomson):** A lamp with states {Off, On}, initially Off. At times $t_n = 1 - 2^{-n}$ for $n=1, 2, \dots$, the switch is toggled. Infinitely many toggles occur by $t=1$.
  *   **Lamp B (Dimmer):** Runs on the same schedule. At $t_n$, brightness is set to $b_n = 1/2 + (-1)^n \cdot 2^{-(n+1)}$. This is a continuous quantity between 0 and 1.
  *   **Lamp C (Stipulated):** Identical to Lamp A, with one added clause: "The lamp is On at $t=1$."

  Four diagnoses are proposed for the apparent trouble in Lamp A:
  1.  The trouble is the infinite number of actions.
  2.  The trouble is that the lamp's state space has only two values, so the process cannot converge.
  3.  The trouble is that the description is incomplete, fixing the state only on $[0, 1)$.
  4.  The trouble is a tacit assumption that the state function must be continuous at $t=1$, which the description does not license.

  Using Lamps B and C as evidence, adjudicate among these four diagnoses. Explain what each diagnosis predicts for B and C and whether those predictions survive. In your conclusion, address the deflationary reply (associated with Benacerraf) versus Thomson's conclusion on the impossibility of supertasks. Use as a control case an idealised ball with coefficient of restitution $<1$, which bounces infinitely often within a finite time and then comes to rest. What does this trio of cases show about the distinction between what a process description determines and what a physical system can be made to do?

  *Note: Do not cite external texts. Rely only on the printed material and course concepts.*

  ***

  ### 2. Model Answer

  The trouble with Lamp A is not logical contradiction but indeterminacy. By comparing A with B and C, we can isolate the source of this indeterminacy and evaluate the four diagnoses.

  Diagnosis (1) claims the infinite number of actions is the problem. Lamp B refutes this. B undergoes infinitely many adjustments by $t=1$, yet its state sequence $b_n$ converges to a limit of $1/2$. The infinite series of actions is compatible with a determinate final state. Therefore, infinity itself is not the barrier.

  Diagnosis (2) suggests the discrete state space {Off, On} prevents convergence. Lamp B supports this partially: its continuous state space allows the sequence to converge to $1/2$. Lamp A's sequence (0, 1, 0, 1...) diverges. However, "cannot converge" does not entail "impossible." It merely entails that the limit of the prior states does not determine the state at $t=1$. Diagnosis (2) identifies why the *limit* fails to define the state, but it does not prove the task is impossible, only that the final state is not fixed by the prior sequence.

  Diagnosis (3) claims the description is incomplete. Lamp C confirms this. By adding the clause "On at $t=1$," C becomes a complete description. There is no contradiction in C; it is simply a discontinuous function. If C is logically consistent, then A's trouble was merely the lack of a stipulation for $t=1$. This aligns with the deflationary reply: the description of A fails to determine the state, but does not prove the state cannot exist. Thomson argues A implies a contradiction (the lamp must be on and off), but C shows we can stipulate a state without contradiction. Thomson's error is assuming the state at $t=1$ must be causally derived from the limit of previous states.

  Diagnosis (4) posits a tacit assumption of continuity. Lamp B satisfies continuity (the limit exists). Lamp A does not. Lamp C explicitly violates continuity yet remains consistent. This shows continuity is not a logical requirement for the description to hold. If we assume physical states must evolve continuously, A is physically impossible, but logically coherent. Diagnosis (4) identifies a physical constraint, not a logical one.

  The control case of the bouncing ball clarifies the metaphysical stakes. The ball performs a supertask (infinite bounces in finite time) and arrives at a determinate state (rest). Physically, this is possible because energy dissipation ensures the amplitude converges to zero. Logically, the ball is analogous to Lamp B: the sequence of states converges. Lamp A is analogous to a ball that bounces between two fixed heights forever; physically impossible due to energy conservation, but logically describable.

  This trio distinguishes what a description determines from what a physical system can do. A process description determines the state at $t=1$ only if the sequence converges or a stipulation is provided. Lamp A's description fails to determine the state; it is underdescribed, not contradictory. However, what a physical system can do depends on causal laws. A physical lamp cannot toggle infinitely without infinite energy or vanishing intervals; a physical ball can bounce infinitely because physics allows dissipation.

  Thomson concludes supertasks are impossible because the state is undefined. Benacerraf replies that the state is simply undefined by the description, not impossible in reality. The ball case supports Benacerraf: physical supertasks are possible if the physics allows convergence. Lamp A is impossible only if we demand the final state be causally necessitated by the infinite series alone. Lamp C shows we can stipulate the outcome. Lamp B shows convergence resolves indeterminacy.

  Therefore, the correct diagnosis is a combination of (2) and (3). The discrete space prevents convergence (2), leaving the description incomplete (3). There is no logical contradiction (refuting Thomson), only descriptive indeterminacy (supporting Benacerraf). Physical impossibility arises from causal constraints (energy, continuity), not logical ones. The distinction is crucial: logic permits the supertask if described fully (like C or B); physics permits it only if causal laws allow the completion (like the ball). Thomson conflates logical indeterminacy with physical impossibility.

  ***

  ### 3. Marking Scheme

  **Total Marks: 20**

  **1. Correctly identifies Lamp B's convergence and its implication for Diagnosis (1). (4 marks)**
  *   *Requirement:* State that B converges to 1/2 despite infinite actions, thereby falsifying the claim that infinity itself is the trouble.
  *   *Common Error:* Candidates claim B also diverges or fail to calculate the limit of the sequence $b_n$.

  **2. Correctly analyzes Lamp C's stipulation and its implication for Diagnosis (3). (4 marks)**
  *   *Requirement:* Note that C is consistent despite the discontinuity, showing A's trouble was incomplete description rather than logical contradiction.
  *   *Common Error:* Candidates argue C is contradictory because it violates the toggling pattern established before $t=1$.

  **3. Adjudicates Diagnoses (2) and (4) using the contrast between A, B, and C. (4 marks)**
  *   *Requirement:* Explain that discrete space prevents limit-definition (2) and that continuity is not logically required (4), though it aids convergence.
  *   *Common Error:* Candidates treat the lack of continuity in A as a logical contradiction rather than a lack of determination.

  **4. Engages with Benacerraf vs. Thomson using the evidence from the Lamps. (4 marks)**
  *   *Requirement:* Articulate that Thomson sees contradiction where Benacerraf sees indeterminacy, supported by C's consistency.
  *   *Common Error:* Candidates attribute Thomson's view to physical impossibility only, missing his claim of logical absurdity.

  **5. Distinguishes logical description from physical possibility using the Ball case. (4 marks)**
  *   *Requirement:* Argue that the ball shows physical supertasks are possible (convergence), whereas A fails logically due to underdescription, separating causal capacity from descriptive determination.
  *   *Common Error:* Candidates conflate the ball's physical rest with the lamp's logical state, claiming the ball proves lamps can toggle infinitely.
