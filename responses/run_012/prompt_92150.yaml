  | 16 | A | 58 | Repay | 52 | B | 50 | Repay |
  | 17 | A | 55 | Repay | 53 | B | 48 | Repay |
  | 18 | A | 52 | Repay | 54 | B | 45 | Repay |
  | 19 | A | 50 | Repay | 55 | B | 42 | Repay |
  | 20 | A | 48 | Repay | 56 | B | 40 | Repay |
  | 21 | A | 45 | Repay | 57 | B | 38 | Repay |
  | 22 | A | 42 | Repay | 58 | B | 35 | Repay |
