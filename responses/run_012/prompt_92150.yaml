answer: |-
  # Workshop Design: The Certification Panel

  ## 1. Session Overview (90 Minutes)

  *   **00:00 – 00:10:** Setup. Assign roles (Model Risk, Fair Lending, Applicant Advocate, Operations). Distribute materials. **Definition Lock:** Write the four stamp formulas on the whiteboard. No redefinitions allowed after minute 10.
  *   **00:10 – 00:40:** Panel Negotiation. Panels attempt to certify a rule (Single Threshold or Group-Specific Thresholds). Operations must sign off on capacity first.
  *   **00:40 – 00:55:** Gallery Walk. Post certifications or "Statement of Disagreement." Read others' outcomes.
  *   **00:55 – 01:30:** Debrief. Facilitator-led mapping of experience to arithmetic constraints.

  ---

  ## 2. Materials

  ### A. Role Cards (One per participant)

  **1. Model Risk Officer (Stamp 1: Predictive Parity)**
  *   **Veto Power:** You refuse to certify if the "meaning of the flag" differs by group.
  *   **Metric:** Among those flagged for review, the Default Rate must be equal.
  *   **Formula:** $\frac{\text{Flagged Defaults}_A}{\text{Total Flagged}_A} = \frac{\text{Flagged Defaults}_B}{\text{Total Flagged}_B}$
  *   **Tolerance:** $\pm 2\%$

  **2. Fair Lending Officer (Stamp 2: False Positive Parity)**
  *   **Veto Power:** You refuse to certify if innocent applicants are burdened unequally.
  *   **Metric:** Among those who would Repay, the Flag Rate must be equal.
  *   **Formula:** $\frac{\text{Flagged Repayers}_A}{\text{Total Repayers}_A} = \frac{\text{Flagged Repayers}_B}{\text{Total Repayers}_B}$
  *   **Tolerance:** $\pm 2\%$

  **3. Applicant Advocate (Stamp 3: False Negative Parity)**
  *   **Veto Power:** You refuse to certify if risky applicants are let through unequally.
  *   **Metric:** Among those who would Default, the Missed Rate must be equal.
  *   **Formula:** $\frac{\text{Missed Defaults}_A}{\text{Total Defaults}_A} = \frac{\text{Missed Defaults}_B}{\text{Total Defaults}_B}$
  *   **Tolerance:** $\pm 2\%$

  **4. Operations Lead (Stamp 4: Capacity & Utility)**
  *   **Veto Power:** You refuse to certify if the team is overwhelmed or the tool is useless.
  *   **Constraint 1 (Budget):** Total Flagged $\leq 25\%$ of all applicants.
  *   **Constraint 2 (Utility):** Total Defaults Caught $\geq 50\%$ of all Defaults.
  *   **Note:** You hold the calculator. If the math exceeds 25%, the proposal dies immediately, regardless of fairness.

  ### B. The Dataset (Handout 1: Current Year)

  *Instructions: This table lists 72 applicants. They are sorted by Risk Score (High to Low). Group labels are provided for your audit but are not visible to the model.*

  | ID | Group | Score | Outcome | ID | Group | Score | Outcome |
  |:---|:---:|:---:|:---:|:---|:---:|:---:|:---:|
  | 01 | A | 95 | Default | 37 | B | 88 | Repay |
  | 02 | A | 92 | Default | 38 | B | 85 | Repay |
