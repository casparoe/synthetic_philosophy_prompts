      *   **Core Lesson:** Fairness impossibility results (specifically, the tension between calibration, error rate balance, and base rate differences under capacity constraints). Participants must *feel* the deadlock, not just hear about it.
      *   **Mechanic:** Certification Panel. 4 roles per table (Model Risk, Fair Lending, Applicant Advocate, Operations). Each has a "stamp" (veto condition). Unanimous consent needed.
      *   **Materials:** Printable dataset (60-80 rows), role cards, stamp criteria, worked examples, "sealed envelope" (randomization option), second dataset (for robustness check).
      *   **Debrief:** Specific mapping of game moments to theoretical concepts. Address common failure modes (luck, metric redefinition, ignoring operations, "scrap the tool" conclusion).
      *   **Constraints:** No theorem names/citations. Focus entirely on the activity design. Be frank about limitations (target variable validity, generalizability, intervention design).

  2.  **Deconstruct the Mathematical Core:**

      *   *The Impossibility:* You generally cannot satisfy Calibration (Predictive Parity), Equalized Odds (Equal TPR & FPR), and Demographic Parity simultaneously if base rates differ.
      *   *The User's Specific Stamps:*
          1.  **Model Risk (Calibration/PPV):** Among flagged, share who default must be equal. (PPV_A = PPV_B).
          2.  **Fair Lending (False Positive Rate):** Share of repayers flagged must be equal. (FPR_A = FPR_B).
          3.  **Applicant Advocate (False Negative Rate):** Share of defaulters *not* flagged must be equal. (FNR_A = FNR_B). *Note: Equal FNR + Equal FPR = Equalized Odds.*
          4.  **Operations (Capacity/Utility):** Max 25% flagged. Recall (TPR) must beat baseline (let's say > 50% of defaults caught).
      *   *The Conflict:* If Base Rates differ ($P(Y=1|A) \neq P(Y=1|B)$), you cannot have Equal FPR, Equal FNR, *and* Equal PPV simultaneously.
      *   *The Dataset:* Needs two groups with different default rates. Score needs to be correlated with default but imperfect. N=60-80 is small enough for manual calc but large enough to show noise.
      *   *The "Pinch":* I need to construct the numbers so that *no* threshold satisfies all three fairness metrics + capacity.

