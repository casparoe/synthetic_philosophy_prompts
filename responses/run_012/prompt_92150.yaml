  | 36 | A | 05 | Repay | 72 | B | 01 | Repay |

  **Summary Stats (For Facilitator Verification):**
  *   **Group A:** 36 Applicants. 14 Defaults (38.9%). 22 Repayers.
  *   **Group B:** 36 Applicants. 7 Defaults (19.4%). 29 Repayers.
  *   **Total:** 72 Applicants. 21 Defaults.
  *   **Ops Constraint:** Max 18 Flagged. Min 11 Defaults Caught.

  ### C. The Tally Sheet (Handout 2)

  *To save time, do not count rows individually. Use this frequency distribution derived from the table above.*

  | Score Threshold | Group A Flagged (Def / Rep) | Group B Flagged (Def / Rep) | Total Flagged | Defaults Caught |
  |:---|:---:|:---:|:---:|:---:|
  | **> 80** | 6 Def / 0 Rep | 0 Def / 3 Rep | 9 | 6 |
  | **> 70** | 9 Def / 2 Rep | 0 Def / 7 Rep | 18 | 9 |
  | **> 60** | 11 Def / 4 Rep | 1 Def / 9 Rep | 25 | 12 |
  | **> 50** | 12 Def / 6 Rep | 2 Def / 12 Rep | 32 | 14 |

  *(Note: The "> 70" threshold hits the Ops Capacity exactly (18 people) but fails Recall (only 9 defaults caught, need 11). The "> 60" threshold hits Recall (12 defaults) but breaks Capacity (25 people). This forces the use of Group-Specific Thresholds or Randomization.)*

  ### D. The Sealed Envelope (Facilitator Only)

  **Open only if a panel claims to have solved all four stamps deterministically within 20 minutes.**

  > **MEMORANDUM FROM REGULATORY OVERSIGHT**
  >
  > **Subject:** Probabilistic Classification at the Margin
  >
  > Panels are permitted to implement a "Borderline Band." If your threshold falls between two scores (e.g., between 70 and 72), you may flag applicants in that score band via a documented random draw (e.g., coin flip) to meet exact capacity constraints.
  >
  > **Warning:** This does not alter the underlying error rates of the model. It only smooths the selection boundary. You remain responsible for the fairness stamps.

  ### E. Handout 3: Previous Year Data (For Debrief)

  *Prepare a second table identical in structure but with shuffled Outcomes for the middle scores (60-80). Specifically, swap 3 Repayers in Group B to Defaults and 3 Defaults in Group A to Repayers. This breaks any rule that overfit the first dataset.*

  ---

  ## 3. Worked Example (For Introduction)

  *Draw this on the board to explain the Stamps.*

  **Toy Dataset (10 Applicants)**
  *   **Group X:** 5 Applicants (3 Default, 2 Repay). Base Rate 60%.
  *   **Group Y:** 5 Applicants (1 Default, 4 Repay). Base Rate 20%.
  *   **Rule:** Flag everyone with Score > 50.
  *   **Result:**
      *   Group X Flagged: 3 Def, 1 Rep (Total 4).
      *   Group Y Flagged: 1 Def, 1 Rep (Total 2).

  **Calculate Stamps:**
  1.  **Model Risk (PPV):**
      *   Group X: 3/4 = 75% Default rate among flagged.
      *   Group Y: 1/2 = 50% Default rate among flagged.
      *   **FAIL.** (75% $\neq$ 50%). The flag means "high risk" in X, but "medium risk" in Y.
  2.  **Fair Lending (FPR):**
      *   Group X Repayers: 1 flagged out of 2 = 50%.
      *   Group Y Repayers: 1 flagged out of 4 = 25%.
      *   **FAIL.** Group X repayers are twice as likely to be bothered.
  3.  **Applicant Advocate (FNR):**
      *   Group X Defaulters: 0 missed out of 3 = 0%.
      *   Group Y Defaulters: 0 missed out of 1 = 0%.
      *   **PASS.** (In this toy case).
  4.  **Ops:**
      *   Total Flagged: 6 out of 10 = 60%.
      *   **FAIL** (If capacity is 50%).

  *Point to the class:* "To fix Model Risk, you must lower Group Y's threshold to catch more Repayers (diluting their PPV). But that breaks Fair Lending. To fix Fair Lending, you must raise Group X's threshold. But that breaks Model Risk. You cannot fix both."

  ---

  ## 4. Facilitator Guide: The Pinch

  **Where the arithmetic breaks:**
  The dataset is constructed so Group A has roughly double the base rate of Group B (39% vs 19%).
  *   **Stamp 1 (PPV)** requires that the *composition* of the flagged pool be identical. Because Group A has more defaults naturally, a single threshold will always yield a higher PPV for Group A. To equalize PPV, you must flag *more* Group B repayers (lowering B's threshold).
  *   **Stamp 2 (FPR)** requires that the *burden on repayers* be identical. If you lower Group B's threshold to satisfy Stamp 1, you inevitably flag more Group B repayers, violating Stamp 2.
  *   **Stamp 4 (Ops)** prevents you from simply flagging everyone to make the rates converge. You are forced to cut off the list.
  *   **The Trap:** If they use Group-Specific Thresholds to satisfy Stamps 1, 2, and 3, they will find they can match the rates, **BUT** the Operations Lead will realize that to match the rates, they must flag significantly more people from the High-Risk group (A) to get enough defaults, or significantly more from the Low-Risk group (B) to dilute the PPV. In this specific dataset, satisfying Stamps 1, 2, and 3 simultaneously requires flagging >25% of the population, violating Stamp 4.

  **What "Success" Looks Like (and why it's fragile):**
  A panel might claim success by using the **> 70 Threshold**.
  *   *Ops:* 18 Flagged (25%). Perfect.
  *   *Fairness:* They will argue the rates are "close enough."
  *   *The Trap:* They only caught 9 Defaults. Recall is 43%. Stamp 4 requires 50%. They failed Utility.
  *   *The Fix:* They must lower the threshold to > 60.
  *   *The New Trap:* Total Flagged becomes 25 (35%). Ops vetoes.
  *   *The Real Choice:* They must choose which group absorbs the excess flags to keep capacity at 18 while catching 11 defaults. This forces a violation of FPR or FNR.

  ---

  ## 5. The Debrief Script (35 Minutes)

  *Do not lecture. Ask questions based on what happened in the room.*

  ### Phase 1: The Operations Squeeze (Minutes 55-60)
  **Ask the Operations Leads:** "Raise your hand if you had to veto a fairness proposal because it exceeded the 25% capacity."
  **Ask the Fairness Roles:** "How did it feel to have your metric overruled by a headcount?"
  **The Point:** "Fairness is not free. It has a budget. When the budget is tight, you cannot buy all the fairness conditions. You noticed this around Minute 20, when the math stopped working."

  ### Phase 2: The Metric Trade-off (Minutes 60-70)
  **Ask a Panel that used Group-Specific Thresholds:** "You wrote down that Group A's error rate went up. Why did you choose that group?"
  **Ask a Panel that used a Single Threshold:** "Did anyone's stamp remain unsigned?"
  **The Point:** "You discovered that 'Equal Treatment' (one threshold) produces 'Unequal Impact' (different error rates). 'Equal Impact' (different thresholds) requires 'Unequal Treatment.' You cannot have both. The arithmetic of base rates forces this. If one group is riskier, a neutral test will flag more of them. To flag the same proportion, you must treat the groups differently."

  ### Phase 3: The Illusion of Success (Minutes 70-80)
  *(Hand out Dataset 2: Previous Year)*
  **Instruction:** "Take the rule you just certified. Apply it to last year's data. Calculate Stamp 1 and Stamp 2 again."
  *(Allow 3 minutes for shock)*
  **Ask:** "How many certifications survived?"
  **The Point:** "Most failed. Why? Because you tuned your thresholds to *this* specific noise. In the real world, base rates shift. A rule that balances error rates today will break tomorrow. This means 'Fairness Certification' is not a one-time stamp. It is a continuous monitoring cost."

  ### Phase 4: The "Scrap the Tool" Fallacy (Minutes 80-85)
  **Address the room:** "Some of you are thinking: 'This proves we shouldn't use the score. We should use human judgment.'"
  **The Hard Truth:** "A human interviewer is also a classifier. They have a capacity constraint (time per interview). They have error rates (false positives/negatives). If the base rates differ, the human interviewer *also* cannot satisfy all four stamps. The arithmetic applies to *any* decision rule, manual or automated. Removing the tool does not remove the trade-off; it just hides the math."

  ### Phase 5: The Sealed Envelope (Minutes 85-90)
  *(If opened)*: "The regulator allowed randomization. Did it solve the fairness problem?"
  **Answer:** "It solved the Capacity problem (Stamp 4). It allowed you to hit exactly 25%. Did it allow you to satisfy Stamps 1, 2, and 3 simultaneously? No. Randomization smooths the line; it does not move the impossibility boundary. It lets you allocate the harm more precisely, not eliminate it."

  ---

  ## 6. Limitations & Facilitator Warnings

  *You must supply these verbally. The game cannot teach them.*

  **1. The Target Variable Trap**
  *   **What the game hides:** The game treats "Default" as an objective truth. In reality, "Default" is a historical record that may reflect past discrimination (e.g., redlining).
  *   **What to say:** "This game assumes 'Default' is the right thing to predict. It isn't. If the historical data is biased, optimizing for these metrics just makes the bias more efficient. You cannot fairness-optimize your way out of a bad target variable."

  **2. The Intervention Gap**
  *   **What the game hides:** The game forces you to choose who gets flagged for *review*. It assumes review is the only intervention.
  *   **What to say:** "You spent 30 minutes fighting over who gets flagged. You spent zero minutes asking: 'What happens after the flag?' If the review process is supportive (e.g., financial counseling) rather than punitive (rejection), the cost of a False Positive drops. Changing the intervention changes the fairness calculus more than changing the threshold."

  **3. The Generalizability Gap**
  *   **What the game hides:** This dataset is static.
  *   **What to say:** "You felt the pain of base rate differences in this room. But in the real world, the model changes the base rates. If you deny loans to Group B, their credit history stagnates, and their risk rises. The model creates the reality it measures. This game is a snapshot; the real problem is a movie."

  **4. Metric Redefinition Rule**
  *   **Enforcement:** If a panel tries to change "False Positive" to mean "Percentage of Total Population" instead of "Percentage of Repayers" during negotiation, stop them.
  *   **Script:** "Freeze. Look at the whiteboard. Definitions are locked at Minute 10. You cannot solve the impossibility by changing the math. You must live with the conflict."

  **5. Predictable Failure Modes**
  *   **The "Ops" Silence:** Operations Leads often stay quiet until the end.
      *   *Fix:* At Minute 15, announce: "Operations, please announce the current capacity usage of the leading proposal."
  *   **The "Luck" Success:** One table might find a threshold that works due to integer rounding (e.g., 1/3 vs 2/6).
      *   *Fix:* Use Dataset 2 (Previous Year) to break it during debrief.
  *   **The "Human Judgment" Escape:** Participants arguing humans are better.
      *   *Fix:* Remind them humans have capacity constraints too. A loan officer can only see 25% of applicants. The math remains.

  ## 7. Final Note to Facilitator

  The goal is not to resolve the deadlock. The goal is to make the deadlock *uncomfortable*. If the room leaves feeling frustrated that they could not sign the paper, the session worked. If they leave feeling they found a clever loophole, you must close it in the debrief using the "Previous Year" data. The lesson is not how to fix the model; it is that the model cannot be fixed to satisfy everyone, and someone must own the choice of who bleeds.
