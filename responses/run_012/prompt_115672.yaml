prompt: |-
  I'm helping write a style guide for how our science desk covers behavior genetics, and before we fight over wording I want the spec rather than a defintion. So what does any adequate account of heritability have to be able to do? Give me the requirements list — the cases it has to get right, the distinctions it can't collapse, the results it has to stay consistent with — with the case or finding behind each requirement, and say which ones are non-negotiable and which are just the tastes of one camp. A few things I keep tripping over and want the list to handle: a trait can be strongly heritable and still shift a lot when you change the environment, and there are conditions that are about as genetic as anything gets yet can be headed off entirely with a diet; heritability is supposed to be about variation within a population, not about what caused the trait in any one person; and the same trait comes out more heritable in some populations than others, which is why I get nervous when the number gets used to say something about individuals or about differences between groups. I also want a requirement that forces a claim like "this trait is 70 percent genetic" to come out either true or false, or else shows it's a category error. If some pair of the requirements can't be satisfied together — I suspect "it's a stable property of the trait" and "it tells you what happens when you intervene" are fighting — say so, since thats the part I most want. Which single requirement does the most to rule out the way people usually talk about this? And one line each on how the standard variance-ratio reading, the "genetic influence" reading, and the complaint from developmental people that the whole framing is misleading do against the list. American English please, and no reading list — just the criteria.
reasoning: |-
  Here's a thinking process that leads to the suggested style guide requirements:

  1.  **Analyze the Request:**
      *   **Goal:** Create a specification (requirements list) for how a science desk covers behavior genetics, specifically heritability.
      *   **Format:** A list of requirements (cases to get right, distinctions to maintain, consistency checks). No definitions, no reading lists. American English.
      *   **Key Constraints:**
          *   Must handle specific tripping points: high heritability + environmental shift, genetic conditions preventable by environment (PKU), within-population vs. individual cause, population specificity, group difference fallacies.
          *   Must adjudicate claims like "70% genetic" (true/false/category error).
          *   Must identify conflicts between requirements (e.g., stability vs. intervention).
          *   Must identify the single most effective requirement against common misuse.
          *   Must evaluate three specific perspectives against the list (variance-ratio, genetic influence, developmental systems).
          *   Distinguish between non-negotiable (scientific consensus) and contested (camp tastes).

  2.  **Deconstruct the Science/Philosophy of Heritability:**
      *   *What is heritability ($h^2$)?* It's the proportion of phenotypic *variance* in a *specific population* at a *specific time* attributable to genetic *variance*.
      *   *Common Misconceptions:*
          *   It applies to individuals (it doesn't).
          *   It implies immutability (it doesn't).
          *   It explains group differences (it doesn't).
          *   It is a fixed constant for a trait (it varies by population/environment).
      *   *Key Examples:*
          *   Height (high $h^2$, but increased with nutrition).
          *   PKU (100% genetic cause, 100% environmental fix).
          *   Having 5 fingers (universal, variance ~0, heritability undefined/low, but genetically determined).

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Req 1: Population Specificity.* Heritability is about variance in a group, not an individual. (Non-negotiable).
      *   *Req 2: Environmental Sensitivity.* High $h^2$ does not mean environmental interventions fail. (Non-negotiable).
      *   *Req 3: Group Differences.* Within-group $h^2$ does not explain between-group differences. (Non-negotiable - Lewontin's fallacy).
      *   *Req 4: The "70% Genetic" Claim.* Needs to be flagged as category error unless qualified by variance context. (Non-negotiable).
      *   *Req 5: Stability vs. Intervention.* The user suspects a conflict here. $h^2$ describes the *status quo* variance, not the *potential* for change. If we require it to predict intervention, it fails. If we require it to describe status quo, it doesn't predict intervention. This is the tension.

  4.  **Refining the Requirements for the "Spec" Format:**
      *   Instead of "Don't say X," frame it as "The account must accommodate Case Y."
      *   *Case:* PKU. *Requirement:* Must allow for 100% genetic etiology and 100% environmental remediation.
      *   *Case:* Height nutrition. *Requirement:* Must allow high $h^2$ alongside large environmental shifts.
      *   *Case:* Individual attribution. *Requirement:* Must forbid assigning % cause to a single person.
      *   *Case:* Cross-population comparison. *Requirement:* Must forbid inferring group difference causes from within-group $h^2$.

  5.  **Addressing the Conflicts:**
      *   The user suspects "stable property" vs. "intervention guide."
      *   *Resolution:* Heritability is a description of current variance structure, *not* a causal coefficient for manipulation. They are mutually exclusive goals for the *same number*. The spec must force the writer to choose: are we describing the current population structure or predicting intervention? You can't do both with $h^2$.

  6.  **Identifying the "Kill Shot" Requirement:**
      *   What stops most misuse? The "Within-Population Variance" constraint. It kills individual attribution and group difference extrapolation simultaneously.

  7.  **Evaluating the Three Perspectives:**
      *   *Variance-Ratio:* Fits the math, fails the intuition (looks like immutability).
      *   *Genetic Influence:* Good for laypeople, bad for precision (implies causal share in individuals).
      *   *Developmental Systems:* Good for biology, bad for statistics (rejects the partitioning entirely).

  8.  **Drafting the Content (incorporating constraints):**
      *   *Tone:* Professional, direct, American English.
      *   *Structure:* Requirements List (Non-negotiable vs. Contested), Conflict Analysis, The "Kill Shot", Perspective Evaluation.

      *(Self-Correction during drafting)*: Make sure I explicitly address the "70% genetic" true/false condition. It's a category error unless it refers to variance in a specific population.
      *(Self-Correction)*: Ensure the PKU example is clear. It's often cited as "genetic," but heritability depends on variance. If everyone has the gene, variance is zero. If everyone eats the diet, variance is zero. The requirement needs to handle *etiology* vs. *heritability*.
      *(Refinement)*: The prompt asks for an account of *heritability*, not just genetics. So the PKU point must be about how heritability estimates behave when environments change.

  9.  **Final Polish:** Check against the "no reading list" and "one line each" constraints. Ensure the conflict between stability and intervention is highlighted clearly.

      *   *Requirement 1 (Variance):* Within-population variance only.
      *   *Requirement 2 (Modifiability):* High $h^2$ $\neq$ fixed trait.
      *   *Requirement 3 (Group Differences):* Within $\neq$ Between.
      *   *Requirement 4 (The Claim):* "X% genetic" is false/error without population context.
      *   *Requirement 5 (Context):* $h^2$ changes with environment range.

      *   *Conflict:* Descriptive (status quo) vs. Prescriptive (intervention).
      *   *Kill Shot:* The Variance Constraint.
      *   *Perspectives:*
          *   Variance-Ratio: Passes math, fails intuition.
          *   Genetic Influence: Passes intuition, fails math.
          *   Developmental: Passes biology, fails quantification.

  10. **Final Review against User Prompt:**
      *   "Spec rather than definition?" Yes.
      *   "Requirements list?" Yes.
      *   "Cases behind each?" Yes.
      *   "Non-negotiable vs. Tastes?" Yes.
      *   "Handle tripping points (PKU, Height, Individual, Groups)?" Yes.
      *   "70% genetic true/false?" Yes.
      *   "Conflicts identified?" Yes.
      *   "Single requirement ruling out usual talk?" Yes.
      *   "One line on three perspectives?" Yes.
      *   "American English?" Yes.
      *   "No reading list?" Yes.

      *Let's write it.*
answer: |-
  ### Specification for Heritability Coverage

  **Requirement 1: The Variance Constraint (Non-Negotiable)**
  *   **The Case:** Explaining why having five fingers is genetically determined but has a heritability near zero (no variance in the population), while height has high heritability but is environmentally modifiable.
  *   **The Spec:** The account must define heritability strictly as the proportion of *observed variation* in a *specific population* at a *specific time* attributable to genetic variation. It must explicitly forbid assigning a percentage of causation to a single individual's trait.
  *   **Adjudication:** A claim like "this trait is 70 percent genetic" is **false/category error** unless it reads "70 percent of the *variance* in this trait *in this population* is associated with genetic *variance*."

  **Requirement 2: The Modifiability Constraint (Non-Negotiable)**
  *   **The Case:** Phenylketonuria (PKU) is a single-gene disorder (100% genetic etiology) but is prevented by a dietary intervention (100% environmental remedy). Similarly, average height has high heritability but increased drastically with improved nutrition.
  *   **The Spec:** The account must allow for a trait to have high heritability while remaining highly responsive to environmental intervention. High heritability cannot be used as a proxy for immutability or inevitability.

  **Requirement 3: The Between-Group Barrier (Non-Negotiable)**
  *   **The Case:** Two populations of corn with identical genetics show different average heights due to soil quality; within each field, heritability is high, but the difference *between* fields is 100% environmental.
  *   **The Spec:** The account must prohibit using within-group heritability estimates to explain or justify average differences *between* groups (e.g., racial, socioeconomic, or national groups). The causes of variance within a group are logically distinct from the causes of the mean difference between groups.

  **Requirement 4: The Context Dependence Constraint (Non-Negotiable)**
  *   **The Case:** Heritability of IQ rises with socioeconomic status (more environmental uniformity allows genetic variance to express) and falls when environments are wildly disparate.
  *   **The Spec:** The account must treat heritability as a local statistic that changes when the range of environments or the genetic diversity of the population changes. It cannot be reported as a universal constant of the trait itself.

  **Requirement 5: The Etiology vs. Variance Distinction (Contested/Technical)**
  *   **The Case:** Developmental biologists argue that genes and environment interact inseparably (epigenesis), making the partitioning arbitrary, while quantitative geneticists argue the partition is statistically valid for prediction.
  *   **The Spec:** The account must distinguish between *genetic etiology* (is DNA involved in the mechanism?) and *heritability* (does DNA difference explain population variance?).
  *   **Status:** **Taste of Camp.** Quantitative geneticists view this as a necessary statistical distinction; developmental systems theorists view the partition itself as misleading. A style guide should acknowledge the statistical utility while noting the biological interdependence.

  ***

  ### The Conflict: Stability vs. Intervention
  You are correct that two requirements fight.
  *   **Requirement A:** Heritability describes the stable structure of variance in the current population.
  *   **Requirement B:** Heritability predicts what happens when you intervene.

  **Verdict:** These are mutually exclusive. Heritability satisfies **A** but fails **B**. It is a descriptive statistic of the *status quo*, not a causal coefficient for *manipulation*. If your guide requires the number to predict intervention outcomes, the concept of heritability breaks. The spec must mandate that writers treat heritability as a description of the current population structure, not a forecast of intervention efficacy.

  ***

  ### The "Kill Shot" Requirement
  **Requirement 1 (The Variance Constraint)** does the most work.
  By forcing the writer to insert the words "variation in a population" every time they use the term, it automatically invalidates individual attribution ("you are 50% genetic") and blocks the leap to group differences ("Group A is smarter because their heritability is higher"). It forces the category error into the open.

  ***

  ### Perspective Evaluation
  **Standard Variance-Ratio Reading:** Passes the math and consistency checks perfectly but fails to intuitively convey that high heritability does not imply immutability to lay readers.

  **"Genetic Influence" Reading:** Passes the intuition check for general audiences but fails the logic checks by implicitly encouraging individual attribution and conflating etiology with variance.

  **Developmental Systems Complaint:** Passes the biological reality check by rejecting the nature/nurture split entirely, but fails the utility check by offering no quantitative metric for predicting population trends or breeding outcomes.
