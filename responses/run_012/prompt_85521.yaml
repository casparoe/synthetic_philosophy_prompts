answer: |-
  # Multipolar Trap Screening Protocol (MTSP)

  **Purpose:** Distinguish genuine coordination failures from standard competition or incumbent capture. Ensure funded remedies match the diagnosed mechanical failure.
  **Time:** 20 minutes per proposal.
  **Stop Rule:** If any question fails, the proposal cannot be funded *as a multipolar trap intervention*. It may be reframed or rejected.

  ### The Screen

  1.  **The "Everyone Loses" Test:** If all actors pursue their local interest, does *every* major actor end up worse off than if they had all done nothing?
      *   *Pass:* Yes (e.g., arms race, depleted fishery).
      *   *Fail:* No (e.g., price war where consumers win, or one winner takes all). *Diagnosis: Competition, not trap.*
  2.  **The "Unilateral Viability" Test:** Could a single actor stop the harmful behavior without going out of business or losing critical capability?
      *   *Pass:* No (Unilateral restraint is suicidal).
      *   *Fail:* Yes. *Diagnosis: Single-agent refusal or monopoly problem, not trap.*
  3.  **The "Cheating Detection" Test:** Can participants verify compliance cheaply, quickly, and privately?
      *   *Pass:* Yes (Automated monitoring, hard metrics).
      *   *Fail:* No (Relies on self-reporting or vague standards). *Judgment Call: What counts as "cheap"?*
  4.  **The "Remedy Match" Test:** Does the intervention change the mechanic identified in Q1–Q3?
      *   *Pass:* Payoff problem → Tax/Liability. Verification problem → Monitoring tech. Horizon problem → Enforcement treaty.
      *   *Fail:* Payoff/Verification problem → Moral suasion/Pledges. *Rule: Do not fund norms to solve incentive problems.*
  5.  **The "Incumbent Advantage" Test:** Does this proposal impose higher compliance costs on new entrants than on current major players?
      *   *Pass:* No (Neutral or favors entrants).
      *   *Fail:* Yes (e.g., standards requiring legacy infrastructure). *Diagnosis: Cartelization risk.*
  6.  **The "Defector Consequence" Test:** What specifically happens to an actor who breaks the agreement?
      *   *Pass:* Concrete penalty (financial, legal, capability denial).
      *   *Fail:* Reputation damage or "community concern." *Judgment Call: Is reputation costly enough in this specific market?*

  ---

  ### Application to Current Cycle

  **(1) Pledge campaign: Major labs commit to halt capability work.**
  *   **Q1 (Everyone Loses?):** Pass (Assuming race leads to catastrophic risk).
  *   **Q2 (Unilateral?):** Pass (Market share loss).
  *   **Q3 (Detection?):** **Fail.** Capability work is dual-use; hard to distinguish from safety work without invasive audits.
  *   **Q4 (Remedy):** **Fail.** Pledges are suasion; problem is verification/incentive.
  *   **Q5 (Incumbent?):** **Fail.** Major labs can absorb compliance costs; new labs cannot. Signals cartel behavior.
  *   **Verdict:** **REJECT.** High risk of incumbent capture; remedy (pledges) does not match diagnosis (verification/incentive).
  *   *Note:* This contradicts the naive safety intuition that "any coordination on pauses is good." The screen identifies this as potentially anti-competitive rent-seeking.

  **(2) Compact: Biosafety standards, self-policed.**
  *   **Q1 (Everyone Loses?):** Pass (Pandemic risk).
  *   **Q2 (Unilateral?):** Pass (Cost disadvantage).
  *   **Q3 (Detection?):** **Fail.** "Self-policed" explicitly denies independent verification.
  *   **Q4 (Remedy):** **Fail.** Relies on norms where verification is absent.
  *   **Q5 (Incumbent?):** Fail (Established compliance teams favor incumbents).
  *   **Verdict:** **REJECT.** Self-policing without external verification is not a trap solution; it is a trap invitation.

  **(3) Intervention: Compute providers racing to cut prices.**
  *   **Q1 (Everyone Loses?):** **Fail.** Price cuts benefit consumers/users. Providers lose margins, but society gains access.
  *   **Verdict:** **REJECT.** This is standard competition, not a multipolar trap. Unless the proposer can demonstrate a specific negative externality (e.g., "cheap compute enables unmonitorable actors"), lower prices are not a "bottom."

  ---

  ### Limitations & Value Judgments

  This screen cannot determine whether the "bottom" is actually bad. Q1 requires a factual claim about outcomes, but the *value* of those outcomes is external to the procedure. For example, in Proposal 3, the screen assumes lower prices are "good." If the foundation's mandate is to restrict access to dangerous technology regardless of cost, the screen will flag this as "Competition" and reject it, potentially conflicting with strategic goals. Similarly, Q5 identifies cartel risk, but does not weigh whether a cartel is preferable to an unsafe race. That trade-off is a policy decision, not a diagnostic one. Finally, Q3 and Q6 rely on officer judgment regarding "cost" and "reputation"; these are empirical guesses that may be wrong in novel AI markets.
