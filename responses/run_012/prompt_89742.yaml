      *   **Section 3: The mistaken self**
          *   *Goal:* Axis 3 (Mistaken, cowardly, unjust).
          *   *Content:* What if the Mayor was right to declare an emergency? His contract punishes prudence as tyranny. It assumes his fear is the only threat, ignoring that sometimes emergencies are real. It privileges safety over survival. The Constitution faces the inverse risk: it assumes the founders were perfectly just. If the Bill of Rights protects a tyrant's due process during a plague, the city dies. The Mayor's contract risks cowardice; the Constitution risks rigidity. The Mayor binds himself against his own potential corruption, but cannot account for his own necessary ruthlessness. The City binds itself against future majorities, but cannot account for future catastrophes. Both devices assume the past self was wiser than the future self. But if the past self was motivated by trauma from the coup rather than reason, both binds are scars, not shields. They preserve the memory of pain rather than the capacity for action.
