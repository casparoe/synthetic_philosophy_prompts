          *   *Word Count Check:* Needs to be around 150 words.

      *   **Section 5: Where the analogy breaks**
          *   *Goal:* Discuss the breakdown of the analogy and determine tragedy.
          *   *Content:* The analogy breaks on the nature of death. The Mayor's contract ends a career; the Constitution's failure ends a regime. A Ulysses contract is suicide by proxy; constitutionalism is immortality by design. The Mayor can be replaced without the city dying. If the Constitution fails, the city's soul is lost. The personal contract is reversible—a new mayor can be elected. The constitutional precommitment is meant to be irreversible, which makes its failure catastrophic. Furthermore, the Mayor knows he is the target; the Constitution hides the target within the populace. The tragedy lies in the Constitution. The Mayor's fall is a personal drama, a hubris punished. The Constitution's failure is a metaphysical tragedy, where the tools of freedom become the instruments of bondage. When the judges appointed by a tyrant strike down the people's will to save rights, liberty dies by its own hand. The novel should treat the Constitutional precommitment as more tragic because it implicates everyone, not just one man. It turns citizens into accomplices of their own imprisonment when the law protects the wrong things.
