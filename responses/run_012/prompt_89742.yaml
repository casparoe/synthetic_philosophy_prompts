          2.  City's constitutional precommitment (Bill of Rights unsuspendable even by unanimous vote, enforced by court appointed by the mayor).
      *   **Task:** Compare these two devices along four specific axes, then discuss where the analogy breaks, and finally determine which is more tragic.
      *   **Constraints:**
          *   Do not stop at the obvious individual vs. collective distinction.
          *   Structure: Specific headings with word counts (approx. 150 words each for the first four sections, 200 for the breakdown, 2-3 sentences for bottom line).
          *   No citations, reading lists, or bibliographies.
          *   Argue from concepts.
          *   Total word count will be roughly 150*4 + 200 + ~50 = 850 words.

  2.  **Drafting - Section by Section:**

      *   **Section 1: The two devices**
          *   *Goal:* Introduce the mechanisms without just saying "one is personal, one is public." Focus on the nature of the bind.
          *   *Content:* The Mayor's contract is a somatic pledge, tying his political survival to his own restraint. It is a hostage situation where he holds the knife to his own throat. The Constitution is a structural cage, designed to outlast the will of any single actor, even the majority. One relies on the fragility of a single career; the other relies on the permanence of abstract law. Both are attempts by the present to dictate the future's limits, but the Mayor's contract is a tripwire triggered by his own voice, while the Constitution is a wall built against the voice of the many. The novel must treat these not as legal technicalities but as competing philosophies of trust: trust in the individual's fear versus trust in the institution's rigidity.
          *   *Word Count Check:* Needs to be around 150 words.

      *   **Section 2: The binding problem**
          *   *Goal:* Axis 1 & 2 combined? No, the prompt asks for four axes across the sections. Let's look at the headings provided.
          *   *Headings:* 'The two devices', 'The binding problem', 'The mistaken self', 'The enforcer's dilemma', 'Where the analogy breaks', 'Bottom line'.
