          *   *Refining 'The binding problem':* Focus on Axis 1 (Who binds/bound) and Axis 2 (Credibility).
          *   *Content:* In the Mayor's contract, the binder and the bound are the same biological entity, split only by time. The credibility rests on shame and the physical removal of power; if he cries wolf, he loses his head. In the Constitution, the binder is the founding moment's ideology, and the bound is the living citizenry. Credibility here rests on the sacredness of text and the court's aura. When the future self disagrees, the Mayor faces immediate mechanical ejection, a concrete consequence. The City faces abstract judicial review, which relies on the judges' courage. The Mayor's bind is visceral; the City's is theological. One threatens the man, the other threatens the will of the people. The credibility of the Mayor's pact dissolves if he refuses to leave; the Constitution's dissolves if the judges blink.
