answer: |-
  Your primary question must be: **How does a mind climb?** If the transition between grades is biological, your characters are victims of destiny; if cultural, they are agents of their own elevation. This determines agency and plot. It is upstream of all else. Get this wrong, and the hierarchy feels like fixed caste rather than dramatic struggle. This deserves first place because it dictates the central conflict: is the struggle against nature or against society? It is thinkable without empirical work, relying on philosophical coherence and narrative consistency.

  Second: **What is the cost of abstraction?** Each rung gains flexibility but loses immediacy. A Gregorian mind may starve whilst modelling survival, paralysed by options. This offers tragedy. It warrants years because it provides the emotional stakes; intelligence is not merely power, but burden. A novelist explores the human condition, and the condition of the higher mind is alienation from the instinctual self. This is upstream of character development.

  Third: **Is the novel a ladder or a cage?** You note the reflexive point. This should not merely be acknowledged; it must organise the book. If narrative installs representations, your protagonist's journey is the reader's induction. This makes the medium the message. It is not a trap; it is your unique leverage. This priority is high because it validates the form itself. If you ignore this, you are merely describing tools whilst wielding one blindly. The reflexive point should reorganise your priorities to ensure the structure of the book mimics the cognitive ascent it describes.

  **Where the scheme is thin:** The linearity is overrated. Minds are not pure types but ecosystems. A Gregorian mind still houses a Darwinian brainstem. Ignoring this hybridity makes characters alien. The distinction between Popperian and Gregorian is also porous; tools shape modelling as much as modelling shapes tools. The scheme risks implying a teleological progress that evolution does not support.

  **Questions that change the book:** The mechanism of ascent (fatalism vs. free will). The hybridity of minds (unity vs. conflict). If you treat the grades as distinct species rather than layered capacities, your novel becomes allegory rather than psychology.
  **Decorative questions:** The evolutionary origin stories of each grade. The precise neurological correlates. These are backdrop, not plot.

  **Cut these:**
  1.  **The historical origin of Gregorian tools.** Knowing *when* language arose matters less than *how* it feels to use it.
  2.  **Strict taxonomic boundaries.** Debating whether a crow is Popperian distracts from the human experience of modelling.
  3.  **The Darwinian baseline.** Unless writing from an animal's POV, obsessing over pre-wired instincts is background noise.

  **Shifters:**
  If AI demonstrates Popperian modelling without language, the Gregorian rung collapses. If animal cognition proves complex internal modelling, the Skinnerian/Popperian divide blurs. Either would force you to treat the grades as overlapping capacities rather than distinct species of mind. Evidence of non-linguistic abstraction would demote the Gregorian grade, suggesting tools are not the apex but merely another layer. This would move the 'Cost of Abstraction' question to the top, as the tragedy would lie in the tool-use itself, not the language. Conversely, if neuroscience proves rigid modularity between these functions, the 'Mechanism of Ascent' becomes purely biological, shifting the genre towards hard science fiction.
