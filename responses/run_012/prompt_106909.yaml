prompt: |-
  I teach a continuing-education seminar for adults with no background in philosophy — lawyers, engineers, a retired nurse — and next month's session is on Adam Smith's impartial spectator. I have ninety minutes and a whiteboard, and I do not want you to explain the doctrine to me. I want you to design the explanation I will give. My worry is specific: the one-line gloss that my students will arrive with, and will leave with unless the session is built against it, is that the impartial spectator is simply Smith's name for conscience, or for an ideal observer who knows everything and feels nothing. I want a plan that cannot let that gloss survive.

  Lay out the order in which the ideas have to come, and say what depends on what: which piece must be securely in place before the next can even be stated, and where the sequence would collapse if I ran it in the more obvious order. Then choose the single case or example that will carry the whole session, and tell me what it must have and what it must lack. I am inclined to build it around a whistle-blower whom his own community condemns and whose reasons no one around him can fully see; tell me whether that works as a vehicle, what it would need to be made to work, and why a more familiar case — a lie told to spare someone's feelings, say — would fail. Then give me the misconceptions the room will predictably bring or form, in the order they will surface, and the precise point in the sequence where I should head each one off rather than waiting until the end.

  I want three things to be load-bearing rather than decorative, and I want you to tell me where each enters the sequence: first, the difference between the spectator who merely watches and the spectator who is informed of the case; second, Smith's contrast between the love of praise and the love of praise-worthiness, and its counterpart on the side of blame; third, his account of self-deceit — the tendency to see one's own case in a flattering light, and the way general rules are meant to correct it. I also want the session to end on the question I keep returning to myself: if the impartial spectator is in some sense internalized from the spectators we actually meet, what is left of it when the surrounding society is itself corrupt — does the figure Smith describes have the resources to condemn the standards of its own community, or not? Tell me how far to take that in the last ten minutes, given the audience.

  Tell me what to leave out at this level and to say plainly that I am leaving it out, so that I do not bluff my way through a question I cannot answer. And give me one question to put to the room in the final stretch whose answers will show me whether the idea has actually landed, or whether they have merely acquired a new vocabulary for the gloss they came in with.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** Adults, no philosophy background (lawyers, engineers, nurse). Practical, likely analytical, used to concrete cases.
      *   **Topic:** Adam Smith's *Impartial Spectator* (from *The Theory of Moral Sentiments*).
      *   **Constraint 1 (Time/Resources):** 90 minutes, whiteboard.
      *   **Constraint 2 (Goal):** Prevent the "one-line gloss" (Spectator = Conscience/Ideal Observer/Knows everything/Feels nothing).
      *   **Constraint 3 (Structure):** Lay out the *order* of ideas, dependencies, and where the sequence collapses if reordered.
      *   **Constraint 4 (Case Study):** Evaluate the user's proposed case (whistleblower condemned by community) vs. a familiar case (white lie). Define what the case must have/lack.
      *   **Constraint 5 (Misconceptions):** Predict misconceptions in order of surface and specify *when* to head them off.
      *   **Constraint 6 (Load-Bearing Concepts):** Integrate three specific concepts at specific points:
          1.  Spectator who watches vs. Spectator informed of the case.
          2.  Love of praise vs. Love of praiseworthiness (and blame counterpart).
          3.  Self-deceit & general rules.
      *   **Constraint 7 (Ending):** End on the "corrupt society" question. Define scope for last 10 mins.
      *   **Constraint 8 (Omissions):** Specify what to leave out and admit it.
      *   **Constraint 9 (Assessment):** One final question to test understanding vs. vocabulary acquisition.

  2.  **Deconstruct the "One-Line Gloss" Problem:**
      *   *Gloss:* "Conscience" or "God's eye view."
      *   *Reality:* It's a social imagination process. It's built from actual sympathy but corrected. It involves *effort* to change stations. It's not omniscient; it's limited by available information but strives for fairness. It's not unfeeling; it requires *sympathetic* feeling, just moderated.
      *   *Strategy:* The lesson must show the *mechanism* of construction, not just the *function* of the result.

  3.  **Sequence & Dependencies:**
      *   *Standard (Bad) Order:* Define Spectator -> Apply to Case -> Discuss Corruption. (Collapses because "Define Spectator" defaults to "Conscience" immediately).
      *   *Required Order:*
          1.  Start with the *problem* of judgment (Self-love/Self-deceit).
          2.  Introduce the *mechanism* of sympathy (changing stations).
          3.  Show the *failure* of actual spectators (bias, lack of info).
          4.  Construct the *Impartial Spectator* as the solution to that specific failure (informed + detached).
          5.  Distinguish Praise vs. Praiseworthiness (Internalization).
          6.  Apply to the Hard Case (Whistleblower).
          7.  End on Corruption.
      *   *Dependency:* You can't understand *why* we need the Impartial Spectator until we understand why actual spectators and self-judgment fail (Self-deceit). You can't understand Praiseworthiness until you understand the Spectator is a standard *outside* immediate applause.

  4.  **Case Study Evaluation:**
      *   *User's Idea:* Whistleblower condemned by community.
      *   *Verdict:* Excellent.
      *   *Why:* It forces a gap between "actual spectators" (community hates them) and "impartial spectator" (would approve if they knew the facts). A "white lie" fails because actual spectators usually agree with the impartial one there (social harmony). The whistleblower case creates *conflict*, which is necessary to distinguish the two.
      *   *Requirements:* The whistleblower must *believe* they are right despite the hate. The community must be *reasonable but misinformed* or *captured by bad norms*, not just cartoonishly evil (otherwise it's too easy). The stakes must be professional/ethical, fitting the audience (lawyers/engineers).

  5.  **Load-Bearing Concepts Placement:**
      1.  *Spectator (Watching vs. Informed):* Needs to come early, during the mechanism setup. Distinguish "passerby" from "judge."
      2.  *Praise vs. Praiseworthiness:* Needs to come after the Spectator is defined but before the Whistleblower application. This explains *why* the whistleblower cares about the Impartial Spectator when no one else is clapping.
      3.  *Self-Deceit/General Rules:* Needs to come *first* or very early. This is the *motivation* for the whole theory. Why do we need an impartial spectator? Because we lie to ourselves.

      *Correction on Sequence:* Actually, Self-Deceit is the *problem*. Sympathy is the *tool*. Impartial Spectator is the *construction*. Praise/Praiseworthiness is the *motivation/internalization*.
      *Revised Order:*
      1.  Self-Deceit (The Problem).
      2.  Sympathy/Changing Stations (The Tool).
      3.  Actual vs. Informed Spectator (The Limitation of Tool).
      4.  Impartial Spectator Construction (The Solution).
      5.  Praise vs. Praiseworthiness (The Internalization).
      6.  Whistleblower Case (The Stress Test).
      7.  Corrupt Society (The Limit).

  6.  **Misconceptions & Interventions:**
      *   *Misconception 1:* "It's just conscience/God." -> Head off at Step 4 (Construction). Emphasize it's built from social interaction.
      *   *Misconception 2:* "It means ignoring feelings." -> Head off at Step 2 (Sympathy). It requires feeling, just moderated.
      *   *Misconception 3:* "It's just what society says." -> Head off at Step 6 (Whistleblower). Society says X, Spectator says Y.
      *   *Misconception 4:* "It gives definite answers." -> Head off at Step 7 (Corruption). It's a struggle, not an algorithm.

  7.  **The Ending (Corrupt Society):**
      *   Smith is ambiguous here. Don't resolve it. The point is the *tension*.
      *   For lawyers/engineers: Relate to professional ethics codes vs. firm culture.
      *   Time: 10 mins. Don't solve, just expose the fault line.

  8.  **Omissions:**
      *   Don't get into *Wealth of Nations* (invisible hand confusion).
      *   Don't get into Stoic influences (too academic).
      *   Don't try to resolve the "Is it universal or relative?" debate definitively.

  9.  **Final Assessment Question:**
      *   Needs to force them to use the mechanism, not the label.
      *   "Describe a time you did something popular that you felt ashamed of, or unpopular that you felt proud of. Which spectator were you listening to?" -> A bit cliché.
      *   Better: "If the Impartial Spectator is made from the people around us, how does it ever disagree with them?" (Too abstract).
      *   Best: "In the whistleblower case, what specific *information* does the Impartial Spectator have that the angry colleagues lack?" (Tests the "Informed" condition).
      *   Wait, the prompt asks for a question to see if they acquired vocabulary vs. understanding.
      *   Question: "If you are alone in a room and make a decision no one will ever know about, Smith says you are still in a crowd. Who is in the room with you, and how did they get there?"

  10. **Refining the Plan (Self-Correction/Polishing):**
      *   *Check Dependencies:* If I start with Self-Deceit, does that make sense? Yes, Smith starts Part III with this. It motivates the need for the Spectator.
      *   *Check Load-Bearing:*
          *   Self-deceit: Minute 15.
          *   Watching vs. Informed: Minute 30.
          *   Praise vs. Praiseworthiness: Minute 60.
      *   *Check Case:* Whistleblower needs to be specific. An engineer finding a safety flaw that will cost the project.
      *   *Check Gloss:* Ensure "Conscience" is explicitly banned/redefined.

  11. **Drafting the Response:** (Iterative refinement for tone and precision).
      *   Tone: Professional, direct, respectful of the teacher's expertise.
      *   Structure: Follow the prompt's requirements exactly.

      *(Self-Correction during drafting)*: I need to be careful about the "Watching vs. Informed" distinction. Smith distinguishes between the *actual* spectator (who might be biased) and the *impartial* one (who imagines the relevant facts). The prompt asks for "spectator who merely watches vs. spectator who is informed." I need to make sure this distinction drives the point that the Impartial Spectator isn't just "detached," but "properly informed."

      *(Refining the "Corrupt Society" ending)*: Smith suggests the Impartial Spectator *can* condemn society, but it's hard. It requires appealing to a "tribunal within." I need to make sure the teacher doesn't promise a magic bullet.

      *(Refining the Final Question)*: The question needs to distinguish between "I know the term" and "I understand the mechanism." The "Who is in the room?" question is good because if they say "God" or "Conscience," they failed. If they say "The imagined view of others who know the facts," they succeeded.

  12. **Final Review against constraints:**
      *   Order/Dependencies? Yes.
      *   Case Study evaluation? Yes.
      *   Misconceptions/Interventions? Yes.
      *   Load-bearing concepts placement? Yes.
      *   Ending scope? Yes.
      *   Omissions? Yes.
      *   Final Question? Yes.

      *Let's write it.*
answer: |-
  Here is the design for the ninety-minute session. It is built to make the "conscience" gloss impossible to sustain by forcing the students to reconstruct the mechanism themselves.

  ### I. The Sequence and Dependencies

  Do not begin with a definition. If you define the Impartial Spectator in the first ten minutes, you will lose them to the "conscience" gloss immediately. The sequence must follow the *problem-solution* architecture of Smith's argument, not the *concept-application* architecture of a lecture.

  **The Order:**
  1.  **The Problem of Self-Judgment (Self-Deceit).**
  2.  **The Mechanism of Sympathy (Changing Stations).**
  3.  **The Limitation of Actual Spectators (Information & Bias).**
  4.  **The Construction of the Impartial Spectator (The Solution).**
  5.  **The Motivation (Praise vs. Praiseworthiness).**
  6.  **The Stress Test (The Whistleblower Case).**
  7.  **The Limit (Corrupt Society).**

  **Dependencies and Collapse Points:**
  *   **Step 1 is the foundation.** If you skip Self-Deceit, the Impartial Spectator looks like an unnecessary abstraction. Why do we need an imaginary judge if we can judge ourselves? You must establish that self-judgment is *structurally compromised* by self-love before they will accept the need for an external standpoint.
  *   **Step 3 must precede Step 4.** You cannot explain *why* the Spectator must be "impartial" until you show how actual spectators fail. If you define the Impartial Spectator before analyzing actual spectators, the "impartiality" sounds like "neutrality" or "coldness." It must sound like "corrected vision."
  *   **Step 5 (Praise/Praiseworthiness) must precede Step 6 (Whistleblower).** If you jump to the whistleblower without this distinction, the students will ask, "Why does the whistleblower care what a imaginary person thinks if everyone real hates him?" The distinction explains the *psychological reward* of listening to the Spectator when society punishes you.

  **Where the Sequence Collapses:**
  If you run this in the "obvious order" (Define Spectator -> Apply to Case), the session collapses at the Whistleblower case. The students will argue that the Spectator is just "what society *should* think," which collapses back into "Conscience." By building the Spectator *out of* the failure of actual society (Steps 1–4), you make it a tool for *correcting* society, not just echoing it.

  ### II. The Case Study

  **Your Instinct:** The whistleblower whom the community condemns.
  **Verdict:** This is the correct vehicle. A "white lie" case fails because in that scenario, the Actual Spectators and the Impartial Spectator usually agree (both prefer kindness over brutal honesty). You need a case where they *diverge*.

  **What the Case Must Have:**
  1.  **Asymmetric Information:** The whistleblower knows facts the community cannot access (e.g., an engineer knows a calculation error that won't manifest for ten years; the community only sees the budget savings now).
  2.  **Social Cost:** The whistleblower must lose something tangible (status, employment, friendship).
  3.  **Reasonable Opponents:** The community condemning him must not be cartoon villains. They must be acting on *their* version of loyalty or economic necessity. If the community is evil, the Impartial Spectator is unnecessary; simple moral realism suffices. The community must be *misinformed* or *operating under bad general rules*.

  **What the Case Must Lack:**
  1.  **Legal Clarity:** Do not make it a clear violation of law. If it's illegal, the "General Rules" (law) solve it. It must be an ethical gray zone where the Spectator is the only guide.
  2.  **Divine Intervention:** Do not allow the discussion to drift into "God sees all." Keep it strictly human and psychological.

  **Why the White Lie Fails:**
  In a white lie scenario, the "Actual Spectators" (the person being lied to) usually approve of the lie if they knew the intent. The Impartial Spectator adds no friction. The Whistleblower case creates friction: Actual Spectators blame; Impartial Spectator approves. This friction is where the concept lives.

  ### III. Load-Bearing Concepts: Placement and Function

  You specified three concepts that must carry the weight. Here is where they enter and what work they do.

  **1. Self-Deceit and General Rules**
  *   **Placement:** Minutes 0–20 (Step 1).
  *   **Function:** This motivates the entire theory. Use the whiteboard to draw a diagram of the "Self" looking at its own action. Show how self-love distorts the view.
  *   **Intervention:** When a student says, "I know right from wrong," stop them. Ask, "Do you know it when it costs you money?" Smith's point is not that we lack moral knowledge, but that we lack moral *vision* regarding ourselves.
  *   **Why here:** If you leave this until later, the Impartial Spectator looks like a luxury. Placed here, it is a necessity for survival.

  **2. The Spectator Who Watches vs. The Spectator Who Is Informed**
  *   **Placement:** Minutes 30–45 (Step 3 & 4).
  *   **Function:** This kills the "Ideal Observer/Knows Everything" gloss. The Impartial Spectator is not omniscient; it is *properly informed*.
  *   **Intervention:** When discussing the whistleblower, ask: "Does the Impartial Spectator know the future?" (No). "Does he know the secret calculation?" (Yes, because the whistleblower *tells* him).
  *   **Why here:** This distinguishes Smith from Utilitarianism (which requires knowing outcomes) and Divine Command (which assumes omniscience). It grounds the Spectator in *available evidence* viewed without bias.

  **3. Love of Praise vs. Love of Praiseworthiness**
  *   **Placement:** Minutes 50–65 (Step 5).
  *   **Function:** This explains the *psychology* of the whistleblower. Why endure blame? Because the "Man Within" (Praiseworthiness) applauds even when the "Man Without" (Praise) boos.
  *   **Intervention:** If a student says, "The whistleblower is just seeking a different kind of praise (from history/God)," correct them. It is not about *future* applause; it is about the immediate satisfaction of being the *kind of person* the Spectator approves.
  *   **Why here:** This bridges the gap between the mechanism (Spectator) and the action (Whistleblowing). Without this, the theory is descriptive, not motivational.

  ### IV. Misconceptions and Interventions

  Do not save corrections for the Q&A. Head them off as they surface.

  1.  **"It's just Conscience."**
      *   *When:* Minute 15 (during Self-Deceit).
      *   *Intervention:* "Conscience implies a voice already inside you. Smith is arguing we have to *build* the voice out of clay. It is a manufactured tool, not a divine gift. If you were raised by wolves, you wouldn't have one."
  2.  **"It means having no emotions."**
      *   *When:* Minute 40 (during Construction).
      *   *Intervention:* "The Spectator does not feel *nothing*. He feels what is *appropriate*. If you are grieving, the Spectator does not tell you to be a rock; he tells you to grieve as much as a stranger could enter into. It is moderated feeling, not absent feeling."
  3.  **"It's just what Society says."**
      *   *When:* Minute 60 (during Praise/Praiseworthiness).
      *   *Intervention:* "If it were just society, the whistleblower would be wrong. The Spectator is made from society, but it is society *corrected* for information and bias. It is the difference between the mob and the jury."
  4.  **"It gives you the answer."**
      *   *When:* Minute 80 (during Corrupt Society).
      *   *Intervention:* "Smith does not promise the Spectator is infallible. He promises it is the *best tool we have*. It can be corrupted. It requires maintenance."

  ### V. The Ending: Corrupt Society

  **Time:** Last 10 Minutes.
  **Scope:** Do not resolve the tension. Your goal is to leave them with the *problem*, not a solution.

  **The Argument:**
  1.  Remind them: The Spectator is internalized from actual spectators.
  2.  Ask: If the actual spectators are corrupt (e.g., a law firm that bills fraudulently, an engineering team that cuts safety corners), what happens to the internalized Spectator?
  3.  Smith's answer (nuanced): The Spectator can condemn the community, but it is extremely difficult. It requires appealing to "general rules" or a higher standard of humanity that transcends the local tribe.
  4.  **The Stop Point:** End by saying, "Smith hopes the love of praiseworthiness is strong enough to resist the love of praise. History suggests it often isn't. The Impartial Spectator is not a shield; it is a burden."

  **Why this limit?** Your audience are professionals. If you promise the Spectator saves them from a corrupt culture, you are selling magic. If you tell them it is a lonely struggle that might cost them their career but preserves their integrity, you are speaking their language.

  ### VI. Omissions

  Be explicit about what you are cutting. This builds trust and prevents "gotcha" questions.

  *   **Say:** "I am leaving out the connection between *The Theory of Moral Sentiments* and *The Wealth of Nations*. There is a famous debate about whether the 'Impartial Spectator' and the 'Invisible Hand' contradict each other. They don't, but resolving that requires a seminar on economics, not ethics."
  *   **Say:** "I am leaving out the Stoic influences on Smith. He borrows the idea of detachment from the Stoics, but he rejects their idea of eliminating passion. We are focusing on Smith's innovation, not his sources."
  *   **Say:** "I am not claiming this solves moral dilemmas. This is a map of how we judge, not a list of what is right."

  ### VII. The Final Assessment Question

  Do not ask, "What is the Impartial Spectator?" They will recite the gloss.
  Do not ask, "Is the whistleblower right?" They will vote.

  **Ask this:**
  > "Imagine you make a decision in a locked room. No human being will ever know what you did. Not your spouse, not your boss, not God. According to Smith, you are still not alone. Who is in the room with you, and **how did they get in?**"

  **Why this works:**
  *   **The Gloss Answer:** "Your conscience." (Fails the "how did they get in" test).
  *   **The Ideal Observer Answer:** "An all-knowing judge." (Fails the Smithian constraint that the spectator is built from social interaction).
  *   **The Correct Answer:** "An imagined version of the people I know, stripped of their bias and given the facts I have. They got in because I invited them through sympathy and habit."

  If they can answer the "how," they understand the mechanism. If they only answer the "who," they have only memorized the vocabulary.
