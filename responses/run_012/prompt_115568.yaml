  1. Extended deterrence guarantees function primarily as non-proliferation tools to restrain allies rather than coercion tools to restrain adversaries, requiring you to maintain threats even when they provoke the enemy simply to keep partners from building their own arsenals.
  2. The historical record of non-use cannot validate specific strategies, forcing analysts to treat the Long Peace as luck or adversary restraint rather than proof that particular doctrines successfully changed enemy calculations.
  3. Doctrine choices prioritize political signaling and domestic credibility over military utility, leading to force structures designed to signal resolve to domestic audiences and partners rather than to optimize actual warfighting outcomes.
  4. Ethically, building global security on an uncheckable claim insulates leaders from accountability, allowing them to justify endless risk accumulation without ever facing proof of failure until a catastrophe occurs.
  5. This performative approach incentivizes dangerous brinkmanship during crises, as leaders must visibly risk escalation to prove commitment to allies, thereby increasing the probability of accidental war they aim to prevent.
