answer: |-
  This is a precise dissection of the machinery of conservation. You have identified the friction points where ontology grinds against administration. You are correct that the system relies on an equivocation, but I will argue that this equivocation is not a bug to be fixed, but the load-bearing wall of the institution.

  Here is the reading of the implicit theory, the price of deflation, and what you should do in those meetings.

  ### The Implicit Theory: Administrative Realism

  The bundle of practices presupposes **Administrative Realism**. This is distinct from Metaphysical Realism (species are mind-independent joints of nature) and Radical Conventionalism (species are arbitrary human cuts).

  Administrative Realism holds that **species are real insofar as they are actionable.** The system does not require species to be ontological primitives of the universe; it requires them to be *stable reference classes for resource allocation*. For the spreadsheet to function, the category "species" must behave *as if* it were a natural kind, even if the scientists in the room acknowledge it is a hypothesis.

  Here is how the three columns sustain this:

  **1. The Taxonomic Column (The Anchor)**
  *   **Presupposition:** Stability of Reference, not Essence.
  *   **Analysis:** You asked if fixing a name to a holotype commits us to essentialism. Strictly speaking, no. The holotype is a causal anchor, not a definition of necessary and sufficient conditions. It functions like a rigid designator in Kripke's sense: "This organism, and anything conspecific with it."
  *   **Realism Requirement:** Low. This column works fine under a conventionalist view. It merely requires that the *label* persists even if the *concept* shifts. However, it *functions* like essentialism because it forces all future inferences to trace back to a single physical point. It rules out radical nominalism where names float freely, but it does not require the *group* to be metaphysically distinct, only that the *naming convention* is stable.
  *   **Uncertainty Flag:** I am relying on the standard interpretation of the International Code of Zoological Nomenclature regarding type specimens. If your trust follows a specific phylogenetic nomenclature code (PhyloCode) rather than Linnaean, the anchor logic shifts slightly, though the bureaucratic need for stability remains.

  **2. The Legal Column (The Binary)**
  *   **Presupposition:** Discoverable Discreteness.
  *   **Analysis:** The Endangered Species Act (ESA) and the DPS policy require a binary output (listed/not listed). To sustain this, the law presupposes that "discrete and significant" is a *fact of the matter* that can be litigated.
  *   **Realism Requirement:** High (Epistemic), Medium (Metaphysical). The law needs the *epistemic* claim (there is a correct answer we can find) to function. It cannot tolerate the *metaphysical* claim (the boundary is inherently fuzzy) because courts cannot rule on fuzziness. The DPS policy for vertebrates is a tacit admission that the metaphysical reality doesn't match the legal need, so they create a legal fiction (the DPS) to bridge the gap. For invertebrates, they lack this bridge, forcing a "square peg, round hole" scenario where populations must be elevated to species status to qualify for protection.
  *   **Inconsistency:** You noted the inconsistency between litigable facts and committee-favored concepts. This is resolved by **Procedural Objectivity**. The "fact of the matter" is not the biology itself, but the *outcome of the designated procedure*. If the committee follows the approved policy and votes "species," then for the purpose of the law, it *is* a species. The metaphysical reality is outsourced to the procedural validity.

  **3. The Accounting Column (The Score)**
  *   **Presupposition:** Value is Additive and Discrete.
  *   **Analysis:** This is the strongest commitment to realism. You cannot count what does not have boundaries. By scoring biodiversity as a sum of species, the spreadsheet presupposes that conservation value is stored in the *separation* of lineages.
  *   **Realism Requirement:** Very High. This column collapses if species are conventional. If boundaries are fuzzy, the score is noise. The "zeroing out" of hybrids is the smoking gun here. It presupposes that genetic purity (or historical distinctness) carries the value, not the ecological function or the individual welfare. A hybrid swarm might be ecologically robust, but it scores zero. This rules out functionalist or individualist ethics. It commits you to a **Historical Essentialism**: the value lies in the unbroken causal chain of separation.

  ### The Equivocation: Epistemic vs. Metaphysical

  You suspect an equivocation between "there is a fact of the matter" (epistemic) and "the units are real joints" (metaphysical).

  **My Reading:** The practice needs the **Epistemic** claim to function, but it **borrows the authority** of the Metaphysical claim to justify it.

  If the committee admitted, "We are drawing a line here because we need a budget line, not because nature stops here," the legal protection would crumble under litigation (arbitrary and capricious). If they claim, "Nature stops here," they are vulnerable to biological refutation. So they maintain the ambiguity: "We are tracking nature's joints (metaphysical), and our method is the best way to find them (epistemic)."

  **What would show this reading is wrong?**
  If you found a case where the agency *retroactively* de-listed a population solely because the species concept changed, without any change in the population's status or threat level, and did so without legal challenge succeeding. That would prove the system acknowledges the metaphysical contingency. (In practice, they usually grandfather protections or fight to maintain the status quo, which supports my reading that the *listing* creates the reality, not vice versa).

  ### Pricing the Deflationary View

  If we take the deflationary view seriously (species are not natural kinds) and switch to lineages, Evolutionarily Significant Units (ESUs), or continuous phylogenetic diversity (PD), here is the price tag:

  1.  **Legal Determinacy (Lost):** The law requires binary triggers for regulation. You cannot regulate "0.7 of a species." A continuous measure of distinctness turns every permitting decision into a lawsuit about where the cutoff lies. The current system hides the cutoff inside the taxonomic committee; a deflationary system puts the cutoff on the judge's desk.
  2.  **Fungibility (Lost):** Conservation banking relies on "species credits." One species = one credit. This allows trade-offs. If you switch to PD, how do you trade 10 units of mammal distinctness against 50 units of insect distinctness? The currency becomes non-fungible, freezing the market for mitigation.
  3.  **Public Narrative (Lost):** "Save the Species" is a moral heuristic the public understands. "Save the Phylogenetic Variance" is not. Donations would likely drop. The "charismatic megafauna" subsidy currently supports the less charismatic taxa; a PD system might shift funds to high-diversity invertebrate clades, disrupting the funding ecosystem.
  4.  **Moral Focus (Shifted):** You asked what matters morally. The current system prioritizes **History** (unique evolutionary trajectories). A lineage/PD system might prioritize **Process** (evolutionary potential) or **Function** (ecosystem services).
      *   *What is lost:* The "Ark" mentality. The idea that we are saving distinct "kinds" from extinction.
      *   *What is gained:* Resilience. Protecting continuous variation often protects adaptive potential better than protecting static "species" boxes.
      *   *The Moral Cost:* The current system allows for the "zeroing out" of hybrids. A lineage view might value the hybridization as evolutionary process. By switching, you would have to admit that the current "hybrid penalty" is not protecting nature, but protecting a classification scheme.

  **Is it an improvement?** Scientifically, yes. Institutionally, it is likely catastrophic. The current system is a "noble lie" that uses realist language to secure resources for preservationist ends. Deflating the ontology undermines the rhetorical and legal leverage required to do the work.

  ### What You Should Do in Those Meetings

  You cannot fix the species problem in a land trust budget meeting. However, you can mitigate the harms of the implicit theory without breaking the machine.

  1.  **Do Not Challenge the Ontology:** Do not argue that species aren't real. It will stall the budget and alienate the taxonomists. Accept the "Administrative Realism" explicitly. Treat the species list as a *regulatory interface*, not a biological census.
  2.  **Audit the "Hybrid Penalty":** This is the most ethically vulnerable part of your Column 3. When a population is zeroed out for interbreeding, ask: *"Are we losing ecological function, or are we losing a label?"* If the hybrid swarm performs the same ecosystem service or holds similar adaptive potential, advocate for a "conservation value" score that is decoupled from the "species count" score. Push for a second column in the accounting sheet: **Functional Value**, which does not zero out upon introgression. This allows you to keep the legal species count for compliance while allocating some internal resources based on ecological reality.
  3.  **Make the Convention Explicit:** When the committee decides to split or lump, ask that the *rationale* be recorded as "Consensus on Boundary" rather than "Discovery of Entity." This small linguistic shift protects the trust from future embarrassment if the taxonomy flips, without undermining the current decision. It signals that you know the line is drawn, not found.
  4.  **Watch the Vertebrate Bias:** You noted the DPS loophole for vertebrates. In your regional context, if you are dealing with invertebrates or plants, be aware that you are holding them to a stricter standard than salmon. If a mussel population is distinct and significant but not "full species," the current system forces you to ignore it. Advocate for using "Distinct Population Segment" logic internally for invertebrates, even if the federal law doesn't require it. Spend the money on the *population*, not just the *name*.

  **Summary:** The system presupposes that **value is distinctness** and **reality is procedural**. It requires epistemic confidence but borrows metaphysical authority. Switching to a deflationary view would scientifically clarify the work but legally and financially cripple it. Your role is not to solve the philosophy, but to ensure the accounting column doesn't completely overwrite the biological reality, specifically regarding hybrids and population-level value in non-vertebrates.

  *Uncertainty Flag:* I am assuming your regional trust is bound by US ESA frameworks regarding the "Distinct Population Segment" policy (1996). If you are in a different jurisdiction (e.g., EU Habitats Directive, Canadian SARA), the specific legal mechanisms for populations vs. species may differ, though the structural tension remains identical. I am also assuming the "zeroing out" of hybrids is a local trust policy, not a federal mandate; federal law can protect hybrids in certain contexts (e.g., if the hybrid swarm is the only remaining instance of the lineage), so check if your spreadsheet rule is stricter than the law requires.
