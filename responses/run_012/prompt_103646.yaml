      *   **Impossibility Theorem:** The Base Rate Fallacy / Impossibility Theorem of Fairness (Kleinberg, Mullainathan, Raghavan 2016; Chouldechova 2017). You generally cannot satisfy Calibration, Equalized Odds (error rates), and Independence (blindness) simultaneously unless base rates are equal or the classifier is perfect.

