          *   *Verdict:* Half-right. Calibration is desirable, but it doesn't ensure equal error burdens (FPR/FNR) across groups with different base rates.

      *   **Move 2 (Devon):** "Even with one shared cutoff the false-positive and false-negative rates will come out different across the two segments, precisely because the base rates differ, so... the fix is to set a separate cutoff per segment to equalize the error rates."
          *   *Assessment:* Right. This is a standard mathematical consequence. If base rates differ and calibration holds, a single threshold yields different FPR/FNR. Adjusting thresholds per group is the standard way to achieve Equalized Odds (error rate balance).
