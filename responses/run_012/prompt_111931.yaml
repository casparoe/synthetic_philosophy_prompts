answer: |-
  # JOINT STATEMENT ON THE DEMANDINGNESS OBJECTION
  **Signed:** [The Act-Consequentialist] & [The Demandingness Objector]
  **Date:** [Current Date]

  ## 1. FIXING THE TARGET

  We agree that much of our previous deadlock stems from shifting definitions. To proceed, we fix the target of the objection as follows:

  *   **Theory:** Act-Consequentialism.
  *   **Rule of Right:** An act is right if and only if there is no alternative act available to the agent that would produce a better outcome.
  *   **Theory of the Good:** Welfarist utilitarianism. The outcome is judged by the aggregate well-being of all sentient beings affected.
  *   **Distribution:** Strict impartiality. Each unit of well-being counts equally, regardless of whose well-being it is. There are no agent-centred weights or discounts.

  **Verbal vs. Substantive Disputes:**
  We acknowledge that some previous arguments were verbal. Specifically, disputes over the phrase "too much" often conflated *psychological difficulty* with *moral impermissibility*. We agree to treat the objection as a moral claim: that the theory incorrectly identifies what is morally required, not merely that complying is hard. However, we confirm that the core conflict is substantive: it concerns the legitimate scope of moral obligation over an agent's life.

  ## 2. AGREED CLAIMS

  We jointly affirm the following propositions:

  1.  **Worldly Facts:** There are currently people in desperate need (suffering severe poverty, preventable disease, etc.) whose situation could be significantly alleviated by resources that many agents in affluent societies could spare without sacrificing their own basic survival.
  2.  **Theoretical Requirements:** Under the Target Theory defined above, an agent in an affluent society is morally required to sacrifice significant personal resources (income, leisure, career opportunities) to aid those in desperate need, up to the point where further sacrifice would produce comparable harm to the agent or others.
  3.  **Compliance Costs:** Compliance with these requirements would involve substantial changes to the agent's life, including the abandonment or severe curtailment of personal projects, relationships, and recreational activities that are not optimific.
  4.  **Force of the Objection:** The demand imposed by the Target Theory is significantly stricter than the requirements of common-sense morality. This divergence is not accidental but structural to the theory.
  5.  **Intuitive Resistance:** There is a widespread, robust intuitive resistance to the idea that morality requires such extensive sacrifice. This resistance exists even among those who accept the worldly facts in claim 1.
  6.  **No Easy Exit:** The objection cannot be dismissed merely by claiming the intuitions are biased by selfishness. The Objector maintains these intuitions track a genuine moral truth about agency; the Consequentialist maintains they track a genuine error about impartiality.

  ## 3. DISAGREEMENTS

  Where we disagree, we state the position twice. Each side confirms that the other's phrasing is a fair statement of their view, even if they reject the view itself.

  **Disagreement 1: The Status of Personal Projects**
  *   **Objector's Phrasing:** Morality must leave space for an agent to pursue their own ground projects and relationships without requiring a justificatory appeal to the general good. To require such justification is to misunderstand the value of having a life of one's own.
  *   **Consequentialist's Phrasing:** Personal projects and relationships have only derivative moral value. They are permissible only insofar as they do not conflict with the imperative to maximise the general good. To grant them independent weight is to privilege the agent's interests arbitrarily over the interests of others.
  *   **Fairness Check:** Both sides accept the opposing phrasing as accurate.

  **Disagreement 2: The Source of the Error**
  *   **Objector's Phrasing:** The Target Theory is false because it fails to capture the agent-centred nature of moral obligation. It treats agents as mere vessels for producing value rather than as sources of action with their own legitimate stakes.
  *   **Consequentialist's Phrasing:** The Target Theory is true, and the objection is a reaction to the uncomfortable implications of impartiality. The error lies in common-sense morality, which permits agents to ignore preventable suffering to subsidise their own less urgent interests.
  *   **Fairness Check:** Both sides accept the opposing phrasing as accurate.

  **Disagreement 3: The Role of Psychology**
  *   **Objector's Phrasing:** Human motivational limits are relevant to what morality can demand. A morality that requires humans to function as pure altruistic machines is not a morality for humans.
  *   **Consequentialist's Phrasing:** Human motivational limits are empirical facts relevant to *how* we achieve the good, not *what* the good requires. What we can psychologically sustain does not determine what we ought to do.
  *   **Fairness Check:** Both sides accept the opposing phrasing as accurate.

  ## 4. CRUXES

  For each crux, we state what evidence or reasoning would bear on the issue, and record each side's prediction in advance.

  ### Crux 1: Height versus Shape
  *Is the complaint that the theory asks too much (height), or that it leaves nothing exempt (shape)?*

  *   **What Bears on This:** A comparison of two theories. Theory A demands high aggregate sacrifice but reserves a protected sphere (e.g., 20% of income or time is strictly off-limits). Theory B demands the same aggregate sacrifice but reserves no protected sphere (any project can be sacrificed if optimific).
  *   **Objector's Prediction:** The objection remains strong against Theory B and weak against Theory A. The lack of a protected interior is the primary offence, not merely the total cost.
  *   **Consequentialist's Prediction:** The objection should be equally strong against both if the total cost to well-being is identical. If the Objector prefers Theory A, she is objecting to fairness or security, not demandingness.

  ### Crux 2: Size versus Allocation
  *Is the objection about the total demand, or that the demand falls unevenly on the conscientious?*

  *   **What Bears on This:** A scenario where the total demand required to fix a problem is fixed, but the burden is distributed equally among all capable agents versus falling solely on the conscientious few.
  *   **Objector's Prediction:** The objection weakens significantly if burdens are shared fairly. The unfairness of being the only one complying exacerbates the demandingness complaint.
  *   **Consequentialist's Prediction:** The objection should vanish if burdens are shared, proving the complaint is about unfairness, not consequentialism. If the Objector still objects to the shared burden, the objection is about the total cost, not the allocation.

  ### Crux 3: Truth versus Believability
  *Is this an objection to the theory being true, or to its adoption as a public morality?*

  *   **What Bears on This:** Whether the Objector would accept the Target Theory as 'true' in the abstract but reject it as a guide for action or teaching (a 'esoteric' acceptance).
  *   **Objector's Prediction:** I accept the distinction. A theory can be metaphysically true but practically unfit to be a morality. If adopting it causes psychological collapse or social dysfunction, it should be rejected as a moral code.
  *   **Consequentialist's Prediction:** I reject the distinction. If the theory is true, it defines what we ought to do. To say it is 'true but unfit to believe' is to admit it is self-defeating, which is a strike against the theory's truth, not its applicability.

  ### Crux 4: Question-Begging on Prerogatives
  *Can the Objector run the objection without assuming the very permissions in dispute?*

  *   **What Bears on This:** Whether the Objector can justify the agent-centred prerogative without simply asserting it as an intuition.
  *   **Objector's Prediction:** The prerogative is foundational. It does not need derivation from the good; it constrains the good. Asserting it is not begging the question but stating the nature of morality.
  *   **Consequentialist's Prediction:** Asserting the prerogative without derivation is begging the question against impartiality. Unless the prerogative can be justified by appeal to the good (e.g., having projects makes you more useful), it is an arbitrary bias.

  ### Crux 5: 'Ought Implies Can'
  *Is the complaint conceptual (logical impossibility) or psychological (motivational difficulty)?*

  *   **What Bears on This:** Whether the objection holds if we assume agents *could* psychologically comply without distress, but simply wouldn't want to.
  *   **Objector's Prediction:** The complaint holds. Morality is normative for rational agents, not just possible ones. If complying requires becoming a different kind of creature (a saint), it exceeds the scope of moral obligation.
  *   **Consequentialist's Prediction:** The complaint fails. If it is logically possible to perform the act, it is morally required. Psychological reluctance is a vice to be overcome, not a limit on obligation.

  ### Crux 6: Internal vs. External Justification
  *Can the agent-centred prerogative be justified from inside the theory?*

  *   **What Bears on This:** Whether a consequentialist theory can incorporate a prerogative (e.g., allowing agents to prioritise their own projects) without ceasing to be consequentialist.
  *   **Objector's Prediction:** No. A prerogative imported into consequentialism is always contingent and revocable. It must be external to the theory to be robust.
  *   **Consequentialist's Prediction:** Yes. If recognising prerogatives leads to better overall outcomes (by preserving integrity and motivation), consequentialism should endorse them. If it must be imported externally, the theory is indeed incomplete, but that is a fault of the objection, not the theory.

  ### Crux 7: Individuals vs. Institutions
  *Does the objection survive being redirected from individuals to collectives?*

  *   **What Bears on This:** Shifting the primary duty to alleviate suffering from individuals to governments or international institutions.
  *   **Objector's Prediction:** The objection survives but shifts. Institutions can be demanded of, but individuals still retain a protected sphere against institutional overreach.
  *   **Consequentialist's Prediction:** The objection dissolves. If institutions bear the burden, individuals are no longer subject to extreme demandingness. This shows the objection was about institutional design, not individual morality.

  ## 5. FALSIFICATION AND EVIDENCE

  We conclude by stating what would count as evidence against our respective views, and what might move the debate forward.

  **What Would Count Against the Consequentialist:**
  *   **Systematic Self-Defeat:** Evidence that adopting the Target Theory as a decision procedure systematically leads to worse outcomes than adopting a theory with agent-centred prerogatives, not due to human weakness, but due to the structural nature of value creation (e.g., if deep personal commitments are necessary to generate the very value the theory seeks to maximise).
  *   **Arbitrariness Proof:** A demonstration that the impartial standpoint is not neutral but relies on a specific, contestable metaphysical view of personhood that denies the reality of separate selves.

  **What Would Count Against the Objector:**
  *   **Non-Arbitrary Derivation:** A successful derivation of agent-centred prerogatives that does not rely on brute intuition or circular appeal to common-sense morality, but shows why such prerogatives are rationally required for any moral agent.
  *   **Complicity Evidence:** A clear case where exercising a prerogative leads to catastrophic harm that cannot be justified by any plausible account of integrity, showing the prerogative functions merely as a licence for indifference.

  **What Would Move the Debate:**
  We agree that empirical psychology will not resolve this. The debate will only move if:
  1.  The Consequentialist can show how personal integrity contributes to the good without making it merely instrumental.
  2.  The Objector can define the limits of the prerogative without appealing to the very common-sense intuitions the theory challenges.
  3.  We jointly develop a case study where both theories yield the same action, but for different reasons, to isolate whether the disagreement is purely theoretical or has practical traction.

  **Signed:**

  _________________________
  (The Act-Consequentialist)

  _________________________
  (The Demandingness Objector)
