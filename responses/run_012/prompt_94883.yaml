answer: |-
  The regulator's ruling is a fascinating hybrid. On the surface, it speaks the language of consequences ('minimise total expected harm'), but its constraints betray a deeper commitment to the nature of public authority. To understand what the ruling is really committed to, we must reconstruct the implicit moral theory, separate its necessary conditions from its accidental features, and test its stability against rival frameworks.

  ### The Implicit Theory: Institutional Consequentialism Constrained by Fairness

  The ruling presupposes that the autonomous vehicle is not merely a private product but a **public actor**. When a car operates on public roads, its decision-making algorithm functions as a delegation of state power regarding life and death. Consequently, the ruling rests on a view of **Institutional Morality**.

  This theory holds that while the *goal* of the institution (the traffic system) is consequentialist (minimise harm), the *procedure* must be deontological (rule-based and impartial). It presupposes three specific claims:

  1.  **The Non-Privatisation of Risk:** Moral decisions involving the sacrifice of one life for another cannot be delegated to private preference. To allow a 'dial' is to treat the safety of pedestrians and other drivers as a commodity the owner can purchase. The ruling assumes ethics in the public sphere is a matter of **civic equality**, not consumer choice.
  2.  **Ex Ante Fairness:** Fairness is judged by the rules set before the engine starts, not by the outcomes of specific crashes. A fixed setting ensures that every road user knows the 'rules of engagement' are identical for all machines. This creates a reciprocal expectation of risk.
  3.  **The Irrelevance of Moral Worth:** The ban on personal features (age, sex, health) presupposes that all lives have equal weight in the calculation. It rejects the notion that the state (or its delegated algorithm) has the authority to judge whose life is 'more valuable' in terms of future potential or social utility.

  ### Strict Needs versus Happenstance Fits

  We must distinguish what this ruling *requires* to stand logically from what merely *aligns* with it.

  **What the ruling strictly needs:**
  It strictly needs the **rejection of moral marketisation**. If you accept that individuals can purchase a higher probability of survival for themselves at the expense of others, the concept of a uniform public safety standard collapses. The ruling *must* hold that the algorithm represents a public standard, not a private servant. It also strictly needs the **priority of procedure over contingent outcomes**. Even if the dial saves lives via increased adoption (as the carmaker claims), the ruling prioritises the integrity of the decision-making framework. It asserts that you cannot build a just system on unjust permissions, even if the aggregate result is better.

  **What merely happens to fit:**
  The ban on personal features fits a 'minimise harm' goal only contingently. If young lives objectively contain more 'future life years' than old ones, a pure harm-minimisation model might demand using age as an input. The ruling bans this not because it fails to minimise harm, but because it violates equality. Thus, the ban on features is a deontological constraint that happens to sit alongside the consequentialist goal, rather than flowing from it. Similarly, the requirement for a single setting 'picked by the maker' fits a bureaucratic model of governance, but the ruling does not strictly need the *maker* to choose; it could be a democratic vote. The key is uniformity, not the specific selector.

  ### Can the Dial be Defended on the Same Footing?

  Could you defend the per-driver dial using the regulator's own logic? **No.**

  The regulator's logic is internally hybrid: it wants consequentialist ends via deontological means. The dial defence is purely consequentialist (it saves lives via adoption). Because the ruling explicitly prioritises the *means* (uniformity, no user preference) over the *contingent ends* (adoption rates), the dial is incompatible with the ruling's core commitment to institutional integrity.

  Furthermore, does the ban on personal features quietly rule out the dial too? **Yes.**
  The dial effectively allows 'Identity' to be an input. 'Prioritise Me' instructs the car to weigh the driver's identity as more valuable than the pedestrian's. If the regulator bans 'health' or 'age' because they are arbitrary moral distinctions, 'Self vs Other' is the ultimate arbitrary distinction from the perspective of public fairness. To allow the car to distinguish 'Me' is to allow the car to discriminate based on identity. If you cannot weigh a life by its health, you cannot weigh it by its ownership. The ban on personal features implies that **no indexical properties** (properties relating to 'who' is involved) should influence the sacrifice calculation, only the physical facts of the crash.

  ### Underdetermination: Rival Theories Licensing the Same Rule

  The ruling is significantly underdetermined. Multiple, mutually incompatible ethical theories would license this exact same rule.

  1.  **Rule Utilitarianism:** This view holds that we should follow the rule which, if generally adopted, maximises utility. A rule stating 'all cars must minimise harm uniformly' might create more trust and stability than 'cars may optimise per driver', even if the latter saves more lives in isolation.
  2.  **Rawlsian Contractualism:** Behind a 'veil of ignorance' (not knowing if you will be a driver or a pedestrian), no rational agent would agree to a system where drivers can purchase the right to sacrifice others. They would agree to a mutual risk-minimisation standard.
  3.  **Kantian Deontology:** This view forbids treating humans merely as means. A 'Prioritise Me' setting treats pedestrians as means to the driver's safety. A fixed, harm-minimising setting treats all rational agents as ends with equal worth.
  4.  **Legal Positivism:** This view suggests that moral decisions in public spaces are the sole province of the legislature. Private entities simply lack the jurisdiction to make life-and-death trade-offs, regardless of the ethical calculus.

  All four theories arrive at 'No Dial, Fixed Setting', but for radically different reasons. The ruling does not tell us which one is doing the heavy lifting.

  ### Swapping the Presuppositions

  To see the shape of the ruling clearly, we must observe how it changes when we swap the underlying moral view.

  **1. Swapping to a Straight Expected-Harm View (Act Utilitarianism)**
  If the regulator adopted a pure expected-harm view, the ruling would transform drastically.
  *   **The Dial:** It would become **mandatory** if the carmaker's evidence held. If the dial increases adoption and thus reduces total net deaths, a pure utilitarian regulator *must* permit it. To ban it would be to choose fewer lives saved for the sake of an abstract principle.
  *   **Personal Features:** The ban would likely be **lifted**. If inputting age or health status allows the car to save more 'life-years' (e.g., saving a child over an octogenarian), a strict harm-minimiser would require it.
  *   **Uniformity:** The single setting requirement would vanish. Different models could run different algorithms if one proved slightly more efficient at saving lives than another.

  **2. Swapping to a Contractualist View (Scanlon-esque)**
  If the regulator adopted a contractualist view (focusing on principles no one could reasonably reject), the ruling would shift in nuance.
  *   **The Goal:** The mandate to 'minimise total expected harm' might be **removed or softened**. Contractualism is not about the aggregate sum, but about individual justification. A rule that sacrifices one person to save five might be rejected by the one if the risk distribution is unfair. The goal would shift to 'mutual risk minimisation'.
  *   **The Dial:** The ban would be **strengthened**. Under utilitarianism, the dial is banned because of the ruling's hybrid nature. Under contractualism, the dial is banned because a pedestrian could reasonably reject a principle that allows drivers to opt out of mutual sacrifice.
  *   **Personal Features:** The ban remains, but the justification changes. It is not that age doesn't matter for 'harm', but that agreeing to a system where your survival depends on your biological attributes is reasonably rejectable. It violates the status of moral equality required for agreement.

  ### Conclusion

  The regulator's ruling is not a pure ethical argument; it is a political settlement dressed in ethical clothing. It attempts to secure the efficiency of consequentialism without accepting its morally uncomfortable costs (discrimination, privatisation of safety). It is committed to the view that **public safety is a constitutional matter, not a consumer specification.**

  The carmaker's argument fails not because it is factually wrong about adoption, but because it is category-error wrong: it treats a public norm as a private preference. The ruling holds that we cannot buy our way out of the social contract, even if doing so would statistically reduce the body count. To change the ruling, one must not merely argue about the numbers; one must argue that the car is a private tool rather than a public agent. Until that shift occurs, the dial remains impermissible, not because it won't save lives, but because it saves them on the wrong terms.
