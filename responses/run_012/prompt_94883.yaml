      *   *British English:* Ensure "prioritise," "minimise," "licence," "programme," "defence" are spelled correctly. Use phrasing like "whilst," "ought," "shall."

  10. **Final Polish:** Ensure the distinction between the *goal* (harm minimisation) and the *constraint* (uniformity/fairness) is clear. The ruling is a hybrid.

