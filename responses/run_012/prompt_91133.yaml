prompt: |-
  I am designing a pre-mortem protocol that a regulator or a research funder could run before adopting a performance target, and I have concluded that I cannot write the protocol until I know what a theory of proxy corruption would have to deliver. Please write the desiderata: the requirements any adequate account of the phenomenon usually filed under Goodhart's law has to satisfy, with the case or consideration behind each requirement, and with a verdict on which requirements are genuine and which are artifacts of a particular camp's interests. Do not give me a reading list or attribute views to authors; I want the argument in your own terms.

  Set the list against at least the following cases, which I have been collecting. Several are constructed rather than reported, so treat them as stipulations, and say so if one is incoherent or already presupposes an answer.

  1. The straightforward case: a proxy is a stable correlate of the goal while unoptimized, and the correlation breaks once agents are rewarded for moving the proxy, because there are ways to move the proxy that leave the goal untouched.

  2. The counting effect: nothing about the underlying phenomenon changes, but making it a target improves its measurement, so the number rises. Here a rising number is equally consistent with corruption and with success, and the account owes some way of telling them apart.

  3. The decoy: a metric that everyone, including its designers, regards as a crude stand-in is nonetheless published as a target, is used mainly to coordinate effort, and improves the goal precisely because nobody treats it as a description of the goal. An account that identifies targeting with corruption must explain why this is not a counterexample, or concede that it is.

  4. The inverse proxy: a cheap metric negatively correlated with the goal over the relevant range. Targeting it reliably makes things worse, and it is not obvious that this is the same phenomenon rather than ordinary bad measurement.

  5. Metric monoculture: a single statistic is adopted across many institutions for many purposes and becomes unusable for all of them, not because any one agent games it, but because the aggregate weight of optimization on it exceeds what its measurement channel can bear. Corruption here is a congestion externality on a shared resource, and no one need intend it.

  6. No independent goal: a target that constitutes the goal rather than representing it, so there is nothing for the metric to have been a good proxy of. The account must say whether it applies at all, and what would count as gaming.

  Beyond the cases, I want the list to include the requirements usually smuggled in without argument: that the account distinguish deliberate gaming from non-intentional distributional drift; that it distinguish the metric's ceasing to track the goal from the institution's substituting the metric for the goal; that it be predictive rather than diagnostic, able to say before the fact which targets will degrade; that it not be refuted by the many cases in which targeting a proxy works fine; and that it respect the difference between a proxy's error being random and its error being selected by the optimization itself. Add whatever else you think belongs, and cut whatever you think is a prejudice dressed as a requirement.

  Two things I most want from you. First, whether some subset of the requirements is jointly unsatisfiable. In particular, I suspect that demanding prediction from features of the proxy-goal relation alone, while also demanding a principled distinction between corruption and legitimate redefinition of a goal, cannot both be had; if that is right, say which has to go and what is lost. Second, which single requirement does the most work in excluding candidate accounts, and what it excludes.

  The purpose fixes the bar: this is a tool for an auditor who must decide, before a target is adopted, whether to expect degradation, and who will not have access to the agents' intentions. Weight the list toward what such a user needs.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Write the desiderata (requirements) for a theory of "proxy corruption" (Goodhart's Law phenomenon) suitable for a pre-mortem protocol used by regulators/funders.
      *   **Constraint 1:** Do not give a reading list or attribute views to authors. Argue in my own terms.
      *   **Constraint 2:** Test the desiderata against six specific cases (Straightforward, Counting Effect, Decoy, Inverse Proxy, Metric Monoculture, No Independent Goal).
      *   **Constraint 3:** Include "smuggled" requirements (Intent vs. Drift, Tracking vs. Substitution, Predictive vs. Diagnostic, Robustness to Success Cases, Random vs. Selected Error).
      *   **Constraint 4:** Identify if any subset of requirements is jointly unsatisfiable (specifically Prediction vs. Principled Distinction).
      *   **Constraint 5:** Identify the single requirement that does the most work in excluding candidate accounts.
      *   **Goal:** The output must be useful for an *auditor* deciding *before* adoption, without access to agent intentions.

  2.  **Deconstruct the Cases:**
      *   *Case 1 (Straightforward):* Standard Goodhart. Correlation breaks under optimization.
      *   *Case 2 (Counting Effect):* Measurement improvement looks like goal improvement. Theory must distinguish measurement artifact from real gain.
      *   *Case 3 (Decoy):* Metric used for coordination, not definition. Improves goal *because* it's not treated as the goal. Theory must allow targeting without corruption if the ontological status is "coordination flag" not "definition."
      *   *Case 4 (Inverse Proxy):* Negative correlation. Is this Goodhart or just bad metrics? Theory needs to distinguish "breaking correlation" from "starting with wrong sign."
      *   *Case 5 (Metric Monoculture):* Systemic congestion. No single agent games, but aggregate optimization kills utility. Theory must handle externalities/systemic effects, not just principal-agent problems.
      *   *Case 6 (No Independent Goal):* Constitutive targets (e.g., inflation targeting). If the metric *is* the goal, can it be corrupted? Theory must handle ontological status of the goal.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Predictive Power.* The auditor needs to know *beforehand*.
      *   *Requirement 2: Intentionality Agnosticism.* The auditor can't read minds. Must cover gaming and drift.
      *   *Requirement 3: Distinguishing Measurement from Reality.* (Addresses Case 2).
      *   *Requirement 4: Distinguishing Optimization from Definition.* (Addresses Case 3 & 6).
      *   *Requirement 5: Systemic Sensitivity.* (Addresses Case 5).
      *   *Requirement 6: Baseline Validity.* (Addresses Case 4).
      *   *Requirement 7: Error Selection.* (Random vs. Selected).

  4.  **Refining and Testing against Cases:**

      *   *Refinement on Prediction:* If I demand strong prediction based *only* on proxy-goal structure, I might fail on Case 3 (Decoy). The *use* determines the corruption, not just the math.
      *   *Refinement on Intentionality:* The prompt explicitly says the auditor won't have access to intentions. So the theory *must* define corruption structurally or behaviorally, not mentally.
      *   *Refinement on Case 6:* If the goal is constitutive, "corruption" is category error. The theory must identify when a goal is constitutive vs. representative.

  5.  **Addressing the "Joint Unsatisfiability" (The Core Tension):**
      *   The prompt suspects: *Prediction from proxy-goal features* vs. *Principled distinction between corruption and redefinition.*
      *   *Analysis:* If I look only at the math (correlation), I can't tell if the metric is a "Decoy" (Case 3) or a "Constitutive Goal" (Case 6). The difference lies in the *institutional intent/usage*, which is unobservable to the auditor in a pre-mortem if they only have the metric specs.
      *   *Verdict:* You cannot have pure prediction from structural features alone *and* a principled distinction of corruption types. One must go. For an auditor, *Prediction* is the primary utility. But if the prediction relies on knowing the "status" of the metric (Decoy vs. Target), that status must be an input.
      *   *Decision:* The requirement for "Prediction from features of the proxy-goal relation *alone*" must be dropped. It needs institutional context inputs.

  6.  **Addressing the "Single Most Exclusionary Requirement":**
      *   Which one kills the most theories?
      *   "Intentionality Agnosticism" kills principal-agent gaming theories that rely on malice.
      *   "Predictive vs. Diagnostic" kills post-hoc sociological explanations.
      *   "Error Selection" is strong.
      *   *Winner:* **Predictive Power without Access to Intent.** This kills almost all behavioral/psychological accounts and forces a structural/systemic account.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the purpose (Auditor Pre-Mortem).
      *   **The Desiderata List:** Numbered, with Rationale, Case Testing, and Verdict (Genuine vs. Artifact).
      *   **The Impossibility Result:** Address the joint unsatisfiability (Prediction vs. Definition).
      *   **The Exclusionary Requirement:** Identify the hardest filter.
      *   **Conclusion:** Summary for the protocol designer.

  8.  **Drafting the Content (Self-Correction during drafting):**
      *   *Check:* Did I attribute views? No.
      *   *Check:* Did I address all 6 cases? Need to ensure they are explicitly referenced in the desiderata analysis.
      *   *Check:* Is the tone appropriate? Analytical, rigorous, not academic name-dropping.
      *   *Correction on Case 3:* The Decoy case suggests that *how* the metric is communicated matters. A theory based solely on the metric's statistical properties will fail here. This supports the "Impossibility Result."
      *   *Correction on Case 6:* If the goal is constitutive, "corruption" is impossible by definition. The theory needs a "Constitutivity Test."
      *   *Refining the "Verdict":* Be sharp. Call out "Artifacts" clearly (e.g., the demand for intentionality is an artifact of legalistic thinking, not systemic risk management).

  9.  **Final Polish:**
      *   Ensure the distinction between "Genuine Requirements" (needed for the auditor) and "Artifacts" (philosophical baggage) is clear.
      *   Make sure the "Impossibility Theorem" is stated clearly.
      *   Ensure the "Single Requirement" is justified.

  **(Self-Correction Note):** I need to be careful with the "Prediction" requirement. The prompt asks for a pre-mortem. A theory that only explains *after* the fact is useless. But a theory that predicts *too much* (says all targeting fails) is also useless (violates the "not refuted by success cases" requirement). The tension is between *specificity* and *sensitivity*.

  Let's organize the Desiderata into three categories: Structural, Epistemic, and Operational.

  *   *Structural:* Relates to the metric/goal link.
  *   *Epistemic:* What the auditor can know.
  *   *Operational:* How the metric is used.

  Okay, ready to write. The focus must remain on the *Auditor's* constraints.

  *   *Key Insight:* The "Decoy" case (3) and "No Independent Goal" case (6) imply that the *ontology* of the metric matters, not just the statistics. The auditor needs to know not just $P(G|M)$ but "What is M to the organization?"
  *   *Key Insight:* The "Counting Effect" (2) requires a theory of measurement validity independent of the target status.

  Let's finalize the "Impossibility" argument.
  If I demand prediction *solely* from the proxy-goal statistical relation, I cannot distinguish Case 1 (Corruption) from Case 3 (Decoy/Success). In Case 1, M correlates with G, then breaks. In Case 3, M correlates with G, is targeted, and G improves *because* M was not treated as G. The statistical input is identical; the institutional input differs. Therefore, a theory relying *only* on statistical features cannot satisfy the predictive requirement while respecting the Decoy case. The requirement for "prediction from proxy-goal relation *alone*" is the casualty.

  Let's finalize the "Exclusionary" argument.
  The requirement that the account be **Predictive without Access to Intent** excludes the largest class of existing explanations (which rely on "gaming," "cheating," or "myopia"). It forces the theory to be about *incentive structures and information channels*, not psychology.

  Okay, proceeding to generate response.

  *(Final check of constraints)*:
