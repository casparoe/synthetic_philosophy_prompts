  - Address unsatisfiability? Checked.
  - Address single exclusionary requirement? Checked.
  - Auditor focus? Checked.

  One nuance: The prompt asks to "cut whatever you think is a prejudice dressed as a requirement." I should explicitly label some as "Artifacts" in the verdict section of each desideratum.

  Let's write.
answer: |-
  ### Desiderata for a Theory of Proxy Corruption

  The following list defines the requirements for an account of proxy corruption suitable for a regulatory pre-mortem. Each requirement includes a rationale, a test against your six cases, and a verdict on whether it is a genuine necessity for the auditor or an artifact of philosophical or ideological baggage.

  #### 1. The Intentionality Agnosticism Requirement
  **Requirement:** The account must identify corruption without reference to the mental states (malice, cunning, myopia) of the agents optimizing the proxy.
  **Rationale:** An auditor conducting a pre-mortem cannot interview every agent to determine if they intend to game the system. If corruption requires "gaming" in the psychological sense, the protocol cannot be run.
  **Case Testing:**
  *   *Case 5 (Monoculture):* Satisfied. Congestion happens without intent.
  *   *Case 1 (Straightforward):* Satisfied. Agents may be trying their best to improve the goal via the proxy and still fail.
  **Verdict:** **Genuine.** The demand for intentional gaming is an artifact of legalistic or moralistic frameworks that seek to assign blame rather than manage risk. For a regulator, *drift* is as dangerous as *cheating*.

  #### 2. The Measurement/Reality Separation Requirement
  **Requirement:** The account must distinguish between an increase in the metric caused by improved measurement (counting better) and an increase caused by improved underlying reality (doing better).
  **Rationale:** If the theory cannot separate the map from the territory, it cannot diagnose Case 2.
  **Case Testing:**
  *   *Case 2 (Counting Effect):* Critical. If the theory treats all metric rises as potential corruption, it yields false positives. If it treats all rises as success, it misses Case 1.
  **Verdict:** **Genuine.** However, this imposes a heavy burden: the theory requires an independent model of the measurement channel's capacity, not just the goal-proxy relation.

  #### 3. The Ontological Status Requirement
  **Requirement:** The account must accept the institutional definition of the metric as an input. It must distinguish between a metric treated as a *representation* of a goal versus a metric treated as a *coordination signal* or a *constitutive definition*.
  **Rationale:** The same mathematical object functions differently depending on how the institution relates to it.
  **Case Testing:**
  *   *Case 3 (Decoy):* Critical. If the theory assumes targeting always corrupts, this case refutes it. The theory must allow that targeting a "coordination signal" does not trigger the corruption mechanism.
  *   *Case 6 (No Independent Goal):* Critical. If the goal is constitutive (e.g., "maintain 2% inflation"), there is no gap to corrupt. The theory must declare this out of scope rather than forcing a corruption narrative.
  **Verdict:** **Genuine, but costly.** This is not a property of the proxy itself, but of the policy design. It requires the auditor to audit the *policy language*, not just the statistics.

  #### 4. The Baseline Validity Requirement
  **Requirement:** The account must distinguish between a proxy that *loses* validity under pressure and a proxy that *lacks* validity from the start.
  **Rationale:** We need to know if the target *broke* or if it was *wrong*.
  **Case Testing:**
  *   *Case 4 (Inverse Proxy):* Critical. If the metric is negatively correlated from the start, targeting it is bad measurement, not Goodhartian corruption. Corruption implies a *change* in the relationship, not a static error.
  **Verdict:** **Genuine.** A theory that conflates "wrong metric" with "corrupted metric" is useless for pre-mortem selection, as it cannot distinguish between picking a bad number and breaking a good one.

  #### 5. The Systemic Capacity Requirement
  **Requirement:** The account must model the measurement channel as a resource with limited capacity, subject to congestion externalities.
  **Rationale:** Corruption can emerge from aggregate load even if individual actions are rational and non-gaming.
  **Case Testing:**
  *   *Case 5 (Monoculture):* Critical. Individual optimization is harmless; aggregate optimization is fatal. A principal-agent model fails here.
  **Verdict:** **Genuine.** This excludes theories based solely on dyadic principal-agent information asymmetry.

  #### 6. The Error Selection Requirement
  **Requirement:** The account must distinguish between random error (noise) and error selected by the optimization process (bias).
  **Rationale:** Optimization does not just amplify noise; it finds the specific noise that looks like signal.
  **Case Testing:**
  *   *Case 1 (Straightforward):* Critical. The correlation breaks because agents find the specific residuals that maximize the proxy.
  **Verdict:** **Genuine.** This is the core mechanistic claim of proxy corruption.

  #### 7. The Predictive Specificity Requirement
  **Requirement:** The account must predict *which* proxies will degrade *before* adoption, without being refuted by cases where targeting works (false positives).
  **Rationale:** A theory that says "all targeting fails" is safe but useless. A theory that says "targeting works unless it fails" is diagnostic, not predictive.
  **Case Testing:**
  *   *Case 3 (Decoy) & General Success:* Critical. If the theory predicts degradation for Case 3, it is falsified. If it cannot distinguish Case 1 from Case 3 ex-ante, it is useless.
  **Verdict:** **Artifact (in its strong form).** See the Impossibility Result below.

  ---

  ### The Impossibility Result: Prediction vs. Definition

  You suspected that demanding prediction from features of the proxy-goal relation alone, while also demanding a principled distinction between corruption and legitimate redefinition, cannot both be had. **This suspicion is correct.**

  **The Conflict:**
  To satisfy **Desideratum 7 (Predictive Specificity)** using only **Desideratum 6 (Error Selection)** and **Desideratum 4 (Baseline Validity)**, the theory must rely on the statistical properties of the proxy-goal relationship. However, **Case 3 (Decoy)** and **Case 6 (No Independent Goal)** demonstrate that the *outcome* (corruption vs. success) is determined not by the statistics, but by the *institutional ontology* (how the metric is treated).

  In Case 3, the statistical relation is identical to Case 1 (a stable correlate). In Case 1, targeting breaks it. In Case 3, targeting improves the goal *because* the metric is not treated as the goal. A theory looking only at the proxy-goal math cannot distinguish these. It would predict corruption for the Decoy, yielding a false positive.

  **The Resolution:**
  You must drop the requirement that prediction be derived from **features of the proxy-goal relation alone**.
  **What is lost:** The hope for a purely technical, statistical test for Goodhart's Law. You cannot calculate corruption risk from the data alone.
  **What is gained:** A viable protocol. The auditor must treat the *policy design* (is this a constitutive goal? is this a decoy? is this a high-stakes target?) as a primary input variable alongside the statistical correlation. The theory must be socio-technical, not purely statistical.

  If you retain the demand for purely statistical prediction, you force the theory to label Case 3 as corruption (false positive) or Case 1 as success (false negative). For an auditor, **False Negatives (approving a target that will break)** are the greater risk. Therefore, if forced to choose, the theory should bias toward predicting degradation when the institutional status is ambiguous. However, the *requirement* for purely statistical prediction must be cut as an artifact of technocratic wishful thinking.

  ### The Single Most Exclusionary Requirement

  The requirement that does the most work in excluding candidate accounts is **Desideratum 1: Intentionality Agnosticism**, coupled with **Desideratum 7: Predictive Specificity**.

  **What it excludes:**
  It excludes the vast majority of behavioral and principal-agent explanations.
  1.  **It excludes "Gaming" theories:** Any account that relies on agents *knowingly* exploiting loopholes is inadmissible. The auditor cannot verify knowledge or intent in a pre-mortem.
  2.  **It excludes "Myopia" theories:** Accounts that rely on agents being short-sighted or irrational are inadmissible. Rational agents optimizing a lossy proxy will produce corruption just as effectively as irrational ones.
  3.  **It excludes "Moral Hazard" theories:** Accounts that rely on a divergence of values between principal and agent are inadmissible. Case 5 (Monoculture) shows corruption arises even when all agents share the same goal and values.

  **Why it is the bottleneck:**
  Most existing intuitions about Goodhart's Law are moralized: "They cheated," "They found a loophole," "They cared more about the number." By demanding an account that works without these, you force the theory to locate the failure in the **information channel** and the **optimization landscape**, not in the **agents**.

  This is the hardest filter because it requires the auditor to assume that *competent, well-intentioned agents will break the metric.* This is counter-intuitive to management cultures that believe better people or better incentives solve the problem. For your protocol, this is the essential pivot: the risk is structural, not personnel-based.

  ### Summary for the Protocol Designer

  To build your pre-mortem protocol, you must accept the following constraints derived from the desiderata:

  1.  **Input Expansion:** You cannot run this protocol on the metric alone. You must audit the *policy document* to determine the Ontological Status (Constitutive vs. Representative vs. Coordination).
  2.  **Risk Assumption:** You must assume agents are rational and well-intentioned. If the target breaks under those conditions, it is a bad target.
  3.  **Measurement Audit:** You must assess the "capacity" of the measurement channel (Case 2 and 5). Is the metric robust to being looked at?
  4.  **Accept False Positives:** Because you cannot distinguish the Decoy (Case 3) from the Straightforward (Case 1) purely on stats, your protocol should flag high-stakes representative proxies as high-risk by default, requiring the policy designer to justify why their case is a "Decoy" rather than the auditor proving it is not.

  The "theory" you are looking for is not a law of nature, but a **risk model for information channels under load.** It treats the metric as a resource that can be depleted by optimization, regardless of who is doing the optimizing.
