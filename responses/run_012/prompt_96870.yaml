answer: |-
  My Dear Colleague,

  I understand your frustration perfectly, and I must confess that having Smith claimed so confidently by opposing camps at a lunch table is a ritual almost as old as the discipline itself. It is a testament to the richness of his thought that he can be made to speak to both the necessity of state intervention and the dangers of institutional complacency, but it is also a warning against treating his work as a policy manual for the twenty-first century. Your suspicion is well-founded: neither of your friends has fully grappled with the fact that Smith is reasoning from a set of commitments that do not map neatly onto our modern dichotomy between public and private. To reconstruct what Smith might make of your modern landscape, we must hold two competing truths in our minds simultaneously. The first is his sociological diagnosis that the division of labor, while essential for wealth, threatens to render the common people too stupid and ignorant to function as moral agents or citizens. The second is his psychological insight that human beings, including teachers and professors, respond to incentives, and that secure endowments often breed negligence. If you keep these two poles in view, you will see that your friends are each grasping half of the elephant, and that Smith would likely view our current menu of options with a mixture of cautious approval and deep skepticism.

  Let us begin with the premise your second friend relies upon, regarding the state's duty. Smith is unequivocal that the education of the common people is a matter of public security, not merely private benefit. In a commercial society, where a worker may spend his life performing a few simple operations, his understanding naturally stagnates. Smith argues that the state must therefore establish institutions to ensure that even the lowest ranks receive instruction in reading, writing, and arithmetic, and perhaps some geometry and mechanics. He is even willing to make this instruction compulsory, requiring that every citizen pass an examination before entering a trade. This is a robust mandate for public involvement that complicates the pure school-choice narrative. If we look at the ordinary public district school that remains the default for most children, Smith would likely approve of its universal availability and its function as a bulwark against the stupefaction of the laboring poor. He would see it as fulfilling the state's obligation to prevent the populace from becoming too ignorant to judge the interests of their country. However, his approval would hinge entirely on the quality of instruction, and this is where your first friend's arguments gain traction. Smith was withering in his critique of the endowed universities of his day, noting that when professors are paid regardless of their performance, they have little incentive to teach well or even to teach at all. He believed that the diligence of teachers is best secured when their remuneration depends, at least in part, on their success and reputation among their students.

  When we apply this logic to modern vouchers and education savings accounts, we see why your friend in education policy finds Smith so compelling. These mechanisms introduce competition and align the teacher's interest with the parent's satisfaction. Smith explicitly suggests that even in public schools, parents should pay a portion of the cost, not because the state cannot afford it, but because this partial payment ensures parents value the service and hold the master accountable. A voucher system effectively universalizes this principle of partial payment and choice. Smith would likely look favorably on charter schools admitted by lottery, as they combine public funding with competitive pressure and operational independence, avoiding the stagnation of a monolithic bureaucracy. He would appreciate that these institutions must answer to the people they serve rather than solely to a central administration. However, there is a limit to this enthusiasm. Smith's support for competition is instrumental, not ideological. He wants competition because it produces better education, not because choice is a natural right superseding all other concerns. If vouchers or savings accounts led to a fragmentation where children were educated in sects hostile to the common good, or if the market provided cheap schooling that failed to cure the stupidity induced by the division of labor, Smith would withdraw his support. He wants education to make people reasonable and socially capable, not merely satisfied consumers. This is the point of underdetermination in his text: he does not specify how much diversity of opinion is healthy versus how much is destabilizing, leaving room for both your friends to argue about where that line lies.

  The case of homeschooling presents the sharpest tension in Smith's framework, and here I think you must tell your friends that Smith would be deeply conflicted. On one hand, Smith holds parents to be the natural guardians of their children, and he is generally skeptical of state power over opinion. He warns against the state prescribing too much in terms of ideology, fearing that those who instruct the youth can easily become the masters of their sentiments. Homeschooling maximizes parental liberty and minimizes state indoctrination, which aligns with his unease about concentrated power. Furthermore, if a parent is capable and diligent, the domestic setting allows for the kind of attentive instruction Smith prized. On the other hand, Smith's entire argument for state involvement rests on the premise that parents, particularly those among the common people, may lack the means or the insight to educate their children properly. He assumes that the very division of labor that makes the state necessary also incapacitates the parents. If the parent is themselves stupefied by their work, how can they prevent the child from sharing that fate? Homeschooling relies on the capacity of the parent, whereas Smith's public school proposal is a safeguard against parental incapacity. Moreover, schools serve a socializing function, exposing children to peers and masters outside the family circle, which cultivates the impartial spectator Smith describes in his moral theory. Total withdrawal into the home risks creating a citizen who knows only the authority of the parent, not the negotiated order of society. Smith would likely view homeschooling with suspicion unless it could be demonstrated that the education provided was at least as rigorous as the public standard he envisioned, perhaps requiring the examinations he proposed for tradespeople. He would not forbid it, but he would not regard it as a sufficient solution to the public problem of ignorance.

  We must also consider the specific modern iterations you mentioned, such as online courses and tutoring funded by savings accounts. Smith was a pragmatist about the means of instruction. He valued practical knowledge that helped people navigate their lives and trades. He would likely see value in specialized tutoring that addresses specific deficits, provided it contributes to the overall goal of preventing ignorance. However, he would be wary of education becoming purely transactional or fragmented. If an education savings account allows a family to purchase a curriculum that reinforces their prejudices rather than challenging their understanding, it defeats the public purpose Smith assigned to education. He wants the state to ensure the common people are educated, not just that they are schooled. The distinction is crucial. Schooling can be a mere credential or a habituation to routine; education, for Smith, is the cultivation of judgment. Any modern institution, whether a charter school or a public district, would be judged by him on whether it actually produces citizens capable of judging the measures of government and resisting the delusions of enthusiasm.

  This brings us to the cautionary tale of the chessboard, which your second friend cites. Smith warns against the man of system who imagines he can arrange society as easily as one moves pieces on a board. This is a critical check on both your friends. The pro-choice advocate who wants to dismantle the public system entirely to install a pure market is playing chess with human lives, assuming that market incentives alone will solve the problem of public ignorance. The pro-public advocate who wants to standardize curriculum and centralize control to ensure uniformity is also playing chess, assuming that bureaucrats can design a perfect education from above. Smith would likely advocate for a mixed ecology. He would prefer a system where the state sets the standard and ensures access, perhaps through funding or mandatory examination, but where the delivery is competitive and responsive to parents. He might view the modern public district school as too monopolistic and prone to the laziness of the endowed professor, but he would view a completely deregulated market as too risky for the public interest. He would likely support charter schools as a compromise, provided they are held to the public standard of preventing ignorance. He would support vouchers if they were means-tested to ensure the poor were not excluded, as he was deeply concerned with the condition of the laboring poor. But he would insist on oversight, not to control opinion, but to ensure competence.

  Ultimately, you must tell your friends that Smith's texts underdetermine the specific policy verdict. He provides a diagnostic framework, not a legislative agenda. He tells us what problems we must solve: the stagnation of the worker's mind and the negligence of the teacher. He tells us what tools we have: state authority, parental interest, and competitive incentives. He does not tell us precisely how to balance them in a complex modern society. Your friend in policy is right that Smith distrusted monopolies and understood incentives, but wrong to assume Smith would trust a market mechanism to fulfill a public duty without oversight. Your friend in the high school is right that Smith saw education as a public imperative and a safeguard against ignorance, but wrong to assume Smith would tolerate the inefficiencies and complacency of a state monopoly. Smith would likely argue that the form of the institution matters less than the incentives it creates and the outcomes it produces. If a public school creates competitive incentives for teachers and ensures high standards, he would support it. If a voucher system ensures universal access and prevents sectarian fragmentation, he would support it. If homeschooling produces competent citizens, he would tolerate it, but he would worry about the risk.

  In your next lunch debate, I suggest you refuse to let them claim Smith as a mascot for either side. Instead, argue that Smith would be the most difficult person in the room to satisfy. He would demand evidence that the common people are not being stupefied, that teachers are diligent, and that the state is not overreaching into opinion while still fulfilling its duty. He would remind you that education is not a commodity to be consumed but a public good to be secured. He would likely conclude that no single model—voucher, charter, or district—is sufficient on its own, and that a healthy society requires a mix of institutions that check each other's excesses. The state ensures the minimum standard and access; competition ensures diligence; parental choice ensures responsiveness. To remove any one of these is to risk the imbalance Smith feared. You will not win the argument by producing a Smithian verdict, because there is none. You will win by showing that Smith's value lies in the tension he maintains, a tension that forces us to constantly evaluate whether our institutions are serving the human beings within them or merely perpetuating themselves. I hope this helps you hold your ground, and I look forward to hearing how the next lunch unfolds.

  Yours sincerely,

  A Fellow Traveler in the History of Thought
