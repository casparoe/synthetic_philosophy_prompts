      *   *Vouchers/ESAs:* Aligns with competition, incentives, parental choice, breaking monopoly. Risks: Might not ensure *content* prevents stupidity (state duty), might allow segregation of opinion (state power over opinion concern vs. parental liberty).
      *   *Charter Schools:* Hybrid. Competition + Public oversight. Aligns well with Smith's desire for competition within a public framework.
