      *   **Weakness:** Real-world escalation often involves changing valuations, multiple exit ramps, external shocks, and unclear rules. The Dollar Auction assumes perfect information about rules but irrational behavior regarding sunk costs.

  3.  **Map the Correspondence (`correspondence` field):**
