answer: |-
  ### Executive Recommendation: The Single Question

  If you fund only one question, fund this: **What physical process constitutes the "use" of information?**

  This is the core of your colleague's "Two Ledgers" proposal, stripped of the metaphor. The standard literature (Landauer, Bennett) assumes that *possession* of information (correlation) is the resource. Your colleague correctly identifies that possession is thermodynamically inert until *used* to modulate a potential. The field is stalled because it conflates the existence of a record (Thermodynamic Ledger) with the functional deployment of that record (Epistemic Ledger). Resolving this determines whether the entropy cost lies in erasure, measurement, or the coupling mechanism itself. It is the most upstream question because every other candidate (boundary, quantum, cost location) depends on defining what the demon *does* with the bit.

  ---

  ### Ranked Agenda for a Three-Year Programme

  Here is the ranking of open questions, ordered by their potential to change what the field takes to be at issue.

  #### 1. The Ontology of "Use" (The Two Ledgers Problem)
  *   **The Question:** Is there a thermodynamic distinction between a physical system *correlating* with another (recording) and a system *modulating* another based on that correlation (using)?
  *   **Why Upstream:** This is the root. If "use" requires a specific physical interaction distinct from "recording," then Landauer's Principle (focused on erasure/recording) is incomplete. It dictates where we look for the entropy cost.
  *   **Tractability:** **Joint.** A physicist must model the coupling Hamiltonian; a philosopher must analyze the functional/causal distinction to ensure it isn't merely anthropomorphic.
  *   **Neglect:** **High.** The literature assumes correlation = resource. The transition from correlation to control is treated as trivial.
  *   **Criteria for Movement:**
      *   *Move Up:* If a model is produced where information is erased without "use" (no work extracted) versus "use" without erasure, showing different entropy budgets.
      *   *Move Down:* If "use" is rigorously reduced to a specific sequence of standard thermodynamic operations (measurement + feedback), proving the Ledger distinction is merely descriptive.

  #### 2. Coarse-Graining and the Arrow of Time
  *   **The Question:** Is the Maxwell's Demon paradox actually a disguised debate about the Past Hypothesis and the justification of coarse-graining?
  *   **Why Upstream:** If MD is just the Arrow of Time problem, then specific "solutions" (like Landauer's) are local patches on a global foundational wound. This reframes the demon from a paradox of *information* to a paradox of *statistical inference*.
  *   **Tractability:** **Joint.** Requires deep statistical mechanics (physicist) and philosophy of probability/time (philosopher).
  *   **Neglect:** **Medium.** Norton and Earman have gestured at this, but it hasn't been integrated with modern information theory.
  *   **Criteria for Movement:**
      *   *Move Up:* If it is shown that the Second Law holds for the demon *only* if the demon's memory is included in the "initial low-entropy condition" of the universe.
      *   *Move Down:* If a resolution is found that works for arbitrary initial conditions, proving the Arrow of Time is irrelevant to the specific mechanism of the demon.

  #### 3. Quantum Back-Action and Coherence
  *   **The Question:** Does quantum measurement back-action alter the *location* or *necessity* of the thermodynamic cost compared to the classical case?
  *   **Why Upstream:** Classical MD assumes measurement can be done without energy cost (in principle). Quantum mechanics forbids this via disturbance. This challenges the Bennett exorcism which relies on cost-free measurement.
  *   **Tractability:** **Physicist Lead.** Philosopher needed to prevent category errors regarding "information" in QM.
  *   **Neglect:** **Low (Technical) / High (Conceptual).** Many papers on quantum thermodynamics exist, but few address the foundational paradox rigorously.
  *   **Criteria for Movement:**
      *   *Move Up:* If a protocol is demonstrated where quantum coherence allows work extraction that violates the classical $k_B T \ln 2$ bound without compensating entropy elsewhere.
      *   *Move Down:* If quantum MD is shown to be isomorphic to classical MD under a suitable definition of quantum entropy (e.g., von Neumann).

  #### 4. Boundary Dependence (System vs. Memory)
  *   **The Question:** Does the entropy balance change if the boundary between "demon" and "system" is shifted?
  *   **Why Upstream:** Mid-level. It tests the objectivity of the entropy accounting. If the balance depends on the cut, the Second Law is observer-relative.
  *   **Tractability:** **Joint.** Physicist defines the cut; Philosopher analyzes the ontological implications of observer-dependence.
  *   **Neglect:** **Medium.** Often discussed in control theory, less in foundational physics.
  *   **Criteria for Movement:**
      *   *Move Up:* If shifting the boundary changes the sign of the entropy production.
      *   *Move Down:* If it is proven that total entropy production is invariant under boundary shifts (as standard theory suggests).

  #### 5. Cost Location (Acquisition vs. Erasure vs. Memory Finiteness)
  *   **The Question:** Is the thermodynamic cost paid during measurement, erasure, or due to finite memory capacity?
  *   **Why Upstream:** **Leaf.** This is a debate about *where* the cost occurs, presupposing that there *is* a cost that saves the Second Law. It does not challenge the framework.
  *   **Tractability:** **Joint.**
  *   **Neglect:** **Low.** This was the central debate of the 1980s-90s.
  *   **Criteria for Movement:**
      *   *Move Up:* Only if new experimental data (e.g., single-molecule experiments) contradicts Landauer's timing.
      *   *Move Down:* (Recommended) Treat as settled for the purpose of this grant unless linked to Question 1 ("Use").

  ---

  ### Candidates to Drop

  To ensure the programme changes the field rather than surveying it, I recommend dropping the following as primary focuses for a marginal person-year:

  1.  **The Bounded Agent Model:** While intellectually interesting, treating the demon as a model of a bounded rational agent shifts the focus from *physics* to *cognitive science/economics*. It is an application of the physics, not a foundation of it. Fund this only if the "Two Ledgers" work suggests that agency is a physical primitive.
  2.  **Cost Location (as a historical debate):** Re-litigating Bennett vs. Earman on *when* the cost is paid is exhausted. It should only be revisited through the lens of Question 1 (Use) or Question 3 (Quantum). As a standalone historical/conceptual project, it will not change what the field takes to be at issue.

  ---

  ### Assessment of the "Two Ledgers" Proposal

  Your colleague's distinction between a **Thermodynamic Ledger** (physical resource) and an **Epistemic Ledger** (representational state) should **reorganise the list**, not sit as a line item.

  **Why it is a Reorganization:**
  Currently, the field assumes the ledgers are convertible at a fixed rate ($k_B T \ln 2$). Your colleague suggests they may have different accounting rules. If the Epistemic Ledger (knowledge) can be updated without Thermodynamic cost, but *withdrawals* (use) incur cost, this breaks the standard identification of "information" with "physical entropy." It shifts the debate from "Where is the entropy?" to "What is the physical signature of semantics?"

  **Criteria for Genuine Advance vs. Relabelling:**
  To prove this is not merely a verbal distinction, the team must demonstrate one of the following within three years:
  1.  **The "Idle Record" Test:** Construct a scenario where a physical record exists (Thermodynamic Ledger shows cost paid) but no work can be extracted because the "Epistemic" condition of *use* is not met. If the thermodynamics differs from the standard Landauer prediction, the distinction is physical.
  2.  **The Hamiltonian of Meaning:** Identify a term in the interaction Hamiltonian that corresponds to "using" information that is absent in merely "storing" it. If "use" maps to a specific physical coupling (e.g., non-linear feedback) distinct from correlation, the Ledger distinction is robust.
  3.  **Failure of Conversion:** Show a case where balancing the Thermodynamic Ledger does not resolve the paradox unless the Epistemic Ledger is also balanced.

  If the team cannot produce a formal model where the two ledgers diverge in their accounting, the proposal is a relabelling of "Correlation vs. Causation," which is already understood.

  ---

  ### Implementation Strategy

  To execute this agenda, the three postdocs should not be three generalists. They need specific, interlocking profiles:

  1.  **Postdoc A (Statistical Foundations):** A physicist with strong training in non-equilibrium stat mech. **Task:** Model the "Use" condition. Can we write a Hamiltonian for "feedback" that is distinct from "measurement"?
  2.  **Postdoc B (Quantum Information):** A physicist/theorist focused on quantum foundations. **Task:** Test the "Two Ledgers" in the quantum regime. Does entanglement blur the line between recording and using?
  3.  **Postdoc C (Philosophy of Physics):** A philosopher comfortable with formalism. **Task:** Rigorous analysis of "function" and "agency." Ensure the "Epistemic Ledger" does not smuggle in homunculi. Connect the "Use" condition to the Arrow of Time (Question 2).

  **Success Metric:**
  In five years, do not judge them by how many papers they publish on Maxwell's Demon. Judge them by whether new papers in *physical review journals* cite their distinction between "recording" and "using" as a necessary parameter in thermodynamic accounting. If the field starts asking "What is the cost of *use*?" rather than "What is the cost of *erasure*?", the programme has succeeded.
