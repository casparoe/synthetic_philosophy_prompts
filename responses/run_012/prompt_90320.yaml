      Welcome to Bilateral Partners. Below are common inquiries regarding our market-design protocols and the Objection Desk.

      1. **What is the function of the Objection Desk?**
      Moral friction often manifests as liquidity constraints. The Objection Desk identifies stakeholders experiencing disutility from a proposed transaction and offers compensation sufficient to internalize that disutility. We do not debate the validity of the sentiment; we quantify it. Once the objection is priced and settled, the market proceeds with reduced friction. This converts normative resistance into a line item, allowing clearance.

      2. **How does Bilateral handle renal asset transfers?**
      In contexts where organ supply is inelastic, price signals are the most humane allocation mechanism. Concerns regarding coercion are addressed by ensuring the compensation package exceeds the donor's reservation price. If a donor feels pressured, the offer was insufficiently high to constitute genuine consent. We structure payments as lifetime annuities to ensure the donor perceives the exchange as voluntary over time. The market clears when the supply of kidneys meets demand at the equilibrium price, regardless of prior prohibitions.

      3. **What is the protocol for pricing during scarcity events?**
      During disasters, static pricing leads to hoarding and shortages. Our Crisis Allocation Protocols allow prices to rise until demand matches available supply. Objections regarding fairness are treated as external costs borne by observers. We calculate the aggregate distress of the public and issue rebates to those not participating in the transaction. This ensures the price gouging generates sufficient surplus to compensate the outraged, netting a societal gain. The good reaches those who value it most, defined by willingness to pay.

      4. **Can civic duties be monetized?**
      Voting is an expression of preference intensity. Allowing the sale of votes enables those with low preference intensity to transfer influence to those with high intensity. Objections regarding democratic integrity are purchased from civic groups via grants. If a voter objects to selling their vote, they are paid to abstain, which achieves the same market concentration. The outcome remains efficient provided the transaction costs of buying the objection are lower than the value of the policy outcome.

      5. **How do you market atmospheric silence?**
      For our Quietude Derivatives, we sell the right to generate noise in designated zones. Residents objecting to noise pollution are bought out individually. If a resident refuses sale, we purchase the air rights above their property to negate their acoustic standing. The good changes nature once priced; silence becomes a luxury good rather than a public right. This stratification ensures optimal noise production for industrial clients while compensating those whose sensory environment is altered.

      6. **How are unidentifiable or future objections handled?**
      Objections held by unborn generations are discounted to present value and escrowed in a perpetuity trust. For diffuse objections where no individual claimant exists, the cost is escheated to a bilateral administrative fund. If a stakeholder objects specifically to being compensated, we apply a recursive premium. The refusal to sell is itself a service provided to the objector, which we purchase. We pay them to maintain their objection, thereby commodifying the resistance itself. Once the fee is accepted, the objection is extinguished by contract.

