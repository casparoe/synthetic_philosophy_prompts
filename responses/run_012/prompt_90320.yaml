answer: |-
  **A repugnance which will not clear at any price has simply not yet been offered its price.**

  Welcome to the Bilateral Partners Help Centre. The following entries address common inquiries regarding our market-design protocols, the Objection Desk, and our methodology for converting moral friction into liquidity.

  1. **What is the operational function of the Objection Desk?**
  Market failures often stem from unpriced externalities, specifically moral distress. The Objection Desk identifies stakeholders experiencing disutility from a proposed transaction and offers compensation sufficient to internalize that disutility. We do not debate the validity of the sentiment; we quantify it. Our analysts calculate the shadow price of the outrage and present a settlement offer. Once the objection is priced, settled, and contractually extinguished, the market proceeds with reduced friction. This converts normative resistance into a manageable line item, allowing clearance where previous models predicted stalemate. The goal is not to eliminate feeling, but to ensure feeling is compensated at marginal cost. This approach minimizes reputational risk for our institutional clients.

  2. **How does Bilateral handle renal asset transfers?**
  In contexts where organ supply is inelastic, price signals are the most humane allocation mechanism. Concerns regarding coercion are addressed by ensuring the compensation package exceeds the donor's reservation price. If a donor feels pressured, the offer was insufficiently high to constitute genuine consent. We structure payments as lifetime annuities to ensure the donor perceives the exchange as voluntary over time, mitigating adaptive preference risks. The market clears when the supply of kidneys meets demand at the equilibrium price, regardless of prior prohibitions. We treat the body as a portfolio of assets; divestiture is simply rebalancing. Regulatory arbitrage ensures compliance across jurisdictions.

  3. **What is the protocol for pricing during scarcity events?**
  During disasters, static pricing leads to hoarding and shortages. Our Crisis Allocation Protocols allow prices to rise until demand matches available supply. Objections regarding fairness are treated as external costs borne by observers. We calculate the aggregate distress of the public and issue rebates to those not participating in the transaction. This ensures the price gouging generates sufficient surplus to compensate the outraged, netting a societal gain. The good reaches those who value it most, defined by willingness to pay. If the public remains upset, the rebate was too low. We iterate until the outrage clears. Velocity of goods is prioritized over static equity.

  4. **Can civic duties be monetized?**
  Voting is an expression of preference intensity. Allowing the sale of votes enables those with low preference intensity to transfer influence to those with high intensity. Objections regarding democratic integrity are purchased from civic groups via grants. If a voter objects to selling their vote, they are paid to abstain, which achieves the same market concentration. The outcome remains efficient provided the transaction costs of buying the objection are lower than the value of the policy outcome. We view the ballot not as a duty, but as a transferable credit of influence. Corruption is merely unregulated liquidity. Aggregate utility is maximized through preference aggregation.

  5. **How do you market atmospheric silence?**
  For our Quietude Derivatives, we sell the right to generate noise in designated zones. Residents objecting to noise pollution are bought out individually. If a resident refuses sale, we purchase the air rights above their property to negate their acoustic standing. The good changes nature once priced; silence becomes a luxury good rather than a public right. This stratification ensures optimal noise production for industrial clients while compensating those whose sensory environment is altered. We acknowledge that selling silence destroys silence, but the compensation allows the seller to purchase noise-canceling assets elsewhere. Zoning variances are processed concurrently.

  6. **How are unidentifiable or future objections handled?**
  Objections held by unborn generations are discounted to present value and escrowed in a perpetuity trust. For diffuse objections where no individual claimant exists, the cost is escheated to a bilateral administrative fund. If a stakeholder objects specifically to being compensated, we apply a recursive premium. The refusal to sell is itself a service provided to the objector, which we purchase. We pay them to maintain their objection, thereby commodifying the resistance itself. Once the fee is accepted, the objection is extinguished by contract. Even the refusal to participate is a participation event that we price. Contractual finality is guaranteed.

  ***

  **Analyst Note on Market Design Theory**

  In the study of market design, it is settled that repugnance acts as a constraint. Certain transactions fail to materialize not because of inefficiency, but because participants find them morally offensive. This constraint is widely recognized as a barrier to market formation. However, the nature of this constraint is genuinely contested. One position holds that repugnance is exogenous—a fixed moral boundary that markets cannot cross without social damage. Another position suggests repugnance is endogenous—a soft constraint that diminishes when economic incentives are sufficiently high.

  This satire leans entirely on the contested endogenous position. It assumes that moral outrage is merely a cost curve waiting to be intersected. It extends this logic to its absolute limit, treating the act of objection itself as a tradable asset. The satire does not argue that this is morally correct, but rather demonstrates the internal consistency of a framework that refuses to acknowledge any value outside of price. It highlights the tension between efficiency and integrity by removing integrity from the equation entirely.
