prompt: |-
  I'm a novelist, and next month I'm leading a two-hour session at a writers' residency on a question I keep circling in my own work: if moral intuitions differ across cultures, does that tell against the idea that any moral claim is objectively true? The audience will be intelligent non-specialists — novelists, mostly, a couple of translators, one retired physician — with no formal training in philosophy, anthropology, or experimental psychology. I don't want you to explain the material to me. I want a plan for how I should explain it.

  Lay out the order in which the pieces have to go, and say why each depends on the one before it. My instinct is that the whole thing collapses if I let them hear the empirical finding before they have any grip on the difference between disagreeing about a verdict and disagreeing about the principle behind it, but tell me if that's wrong. Specify the single case that should carry the session, and what it has to have and lack. I had thought of the cross-cultural ultimatum game work, where in some small-scale societies offers above half have been refused, apparently because accepting an unusually generous gift creates an obligation rather than discharging one. It needs to be a case where the local response has its own rationale, so the audience cannot file it under irrationality, and it must not be so exotic that it reads as mere curiosity.

  Then map the misconceptions in the order they will arise — I expect relativism to be confused with tolerance, objectivity with universal agreement, variation with arbitrariness, and the WEIRD sampling problem to be treated as a debunking of the whole enterprise rather than a constraint on it — and tell me exactly where in the sequence to head each one off. I would also like the work on culturally varying susceptibility to the Müller-Lyer illusion placed somewhere in there, as a way of showing that variation alone does not settle what is real; tell me whether that earns its place or is a distraction.

  Finish with the check for understanding that would show the question has landed rather than just the discomfort, and with what I should openly refuse to explain at this level and say so.

  Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **User:** Novelist leading a 2-hour session at a writers' residency.
      *   **Audience:** Intelligent non-specialists (novelists, translators, retired physician). No formal training in philosophy/anthropology/psychology.
      *   **Topic:** Moral relativism vs. objectivity in light of cross-cultural variation.
      *   **Constraint 1:** Do *not* explain the material to the user (they know it). Explain *how* to teach it.
      *   **Constraint 2:** Lay out the order of pieces and explain dependencies (why A must come before B).
      *   **Constraint 3:** Validate/Challenge the user's instinct about empirical findings vs. conceptual distinctions (verdict vs. principle).
      *   **Constraint 4:** Specify the *single case* to carry the session (criteria: local rationale, not irrational, not too exotic). User suggested Ultimatum Game (generous offers refused).
      *   **Constraint 5:** Map misconceptions (relativism/tolerance, objectivity/agreement, variation/arbitrariness, WEIRD problem) and say *where* to head them off.
      *   **Constraint 6:** Evaluate the inclusion of the Müller-Lyer illusion (distraction or useful?).
      *   **Constraint 7:** Finish with a check for understanding and what to refuse to explain.
      *   **Constraint 8:** Use British English.

  2.  **Deconstruct the Core Philosophical Problem:**
      *   The central tension is: *Disagreement $\rightarrow$ Relativism?*
      *   The logical gap is between *descriptive ethics* (what people believe) and *meta-ethics* (what makes beliefs true).
      *   The user's instinct is correct: If you show variation first, people jump to "everything is relative" without understanding *what* is varying (principles vs. applications).

  3.  **Select the Single Case:**
      *   User suggestion: Ultimatum Game (hyper-generous offers refused in small-scale societies).
      *   Critique: It's good, but is it "novelist-friendly"? It's a bit game-theoretic.
      *   Alternative: Honour killings? Too charged. Food taboos? Too trivial.
      *   Re-evaluating Ultimatum Game: The specific example is usually the Hadza or Au/Gnau. The rationale is about *obligation* vs. *charity*. This fits the "principle vs. verdict" distinction perfectly.
      *   Decision: Stick with the user's instinct on the Ultimatum Game but refine the presentation. It needs to be framed not as "economics" but as "social debt." Let's call it the "Gift Debt" case. It meets the criteria: rational locally, not exotic (gifts exist everywhere), not irrational (strategic avoidance of obligation).

  4.  **Structure the Session (2 Hours):**
      *   *Introduction (15 mins):* Hook, setting the stakes for writers.
      *   *Conceptual Groundwork (30 mins):* Verdict vs. Principle. (Crucial first step).
      *   *The Case Study (30 mins):* The Gift Debt/Ultimatum Game.
      *   *The Illusion Analogy (15 mins):* Müller-Lyer.
      *   *Misconception Management (Throughout):* Weaving in the corrections.
      *   *Conclusion/Check (30 mins):* Synthesis and boundaries.

  5.  **Address the Dependencies (The "Why"):**
      *   Why Verdict/Principle first? Because without it, variation looks like contradiction. With it, variation looks like application.
      *   Why the Case Study second? Because you need the tools to analyse the case.
      *   Why Müller-Lyer third? Because you need a non-moral analogy to separate *perception* from *reality* before applying it back to morality.
      *   Why Misconceptions where they are? Pre-emptive vs. Reactive.

  6.  **Evaluate Müller-Lyer:**
      *   Is it a distraction? It's a classic analogy in this field (e.g., used by Haidt or in psych literature).
      *   Pros: Shows perception varies but reality doesn't.
      *   Cons: Moral truth isn't perceptual truth.
      *   Verdict: Keep it, but place it *after* the moral case to broaden the scope, not prove the point directly. It illustrates that *variation in experience* doesn't entail *variation in fact*.

  7.  **Map Misconceptions:**
      *   *Objectivity = Universal Agreement:* Head off immediately in Conceptual Groundwork.
      *   *Relativism = Tolerance:* Head off when discussing implications (near the end).
      *   *Variation = Arbitrariness:* Head off during the Case Study analysis.
      *   *WEIRD Problem:* Head off during the Case Study introduction (contextualise the data).

  8.  **Drafting the Plan (incorporating British English):**
      *   *Tone:* Professional, respectful of the user's expertise, structured.
      *   *Check for Understanding:* Needs to be practical for writers, not a quiz. Maybe a prompt about character motivation.
      *   *Refusal:* Don't explain *how* to resolve the meta-ethical debate (Realism vs. Anti-Realism). That's beyond the scope.

  9.  **Refining the "Verdict vs. Principle" Distinction:**
      *   This is the linchpin. If the audience thinks "Don't kill" is the principle, and one culture kills and one doesn't, they see contradiction. If the principle is "Honour the ancestors," and one culture kills to honour them and another doesn't kill to honour them, the principle might be shared (honour) but the verdict differs.
      *   Actually, a better distinction is *Fundamental Principle* vs. *Empirical Belief*.
      *   Let's stick to the user's phrasing: "Verdict vs. Principle."
      *   Example: Speeding. Verdict: Don't go 40mph. Principle: Don't endanger children. In a school zone, 40mph endangers. On a highway, it doesn't. Same principle, different verdicts based on facts.

  10. **Final Review against Constraints:**
      *   British English? (Check: 'programme', 'analyse', 'honour', 'colour').
      *   Order specified? Yes.
      *   Dependencies explained? Yes.
      *   Single case specified? Yes (Gift Debt/Ultimatum).
      *   Misconceptions mapped? Yes.
      *   Müller-Lyer evaluated? Yes.
      *   Check for understanding? Yes.
      *   Refusal stated? Yes.

  11. **Self-Correction on the Case Study:**
      *   The Ultimatum Game can be dry. I need to ensure the user frames it narratively. "A fisherman is given five fish by a stranger. He throws two back." Why? Because keeping five means he owes the stranger a canoe later. He can't afford a canoe.
      *   This makes it concrete for novelists.

  12. **Self-Correction on Müller-Lyer:**
      *   Make sure it doesn't imply moral truths are physical facts. It's an analogy for *cognitive processing*, not ontology. I must instruct the user to be precise here.

  13. **Final Polish:** Ensure the flow feels like a narrative arc, suitable for writers.

  *(Self-Correction during drafting)*: Wait, the user asked me to specify the *single case*. I should explicitly endorse the Ultimatum Game but refine *how* it's presented to meet the "not exotic" criteria. The Au and Gnau of Papua New Guinea are the classic example. I will specify this but warn against over-exoticising it.

  *(Refining the Misconception Timing)*:
  *   Objectivity/Agreement: Start.
  *   Variation/Arbitrariness: During Case.
  *   WEIRD: During Case (methodology).
  *   Relativism/Tolerance: End (Implications).

  *(Refining the Check for Understanding)*:
  *   Don't ask "What is the answer?" Ask "How would you write the character?"

  *(Refining the Refusal)*:
  *   Don't solve the Euthyphro Dilemma. Don't solve Moral Realism.

