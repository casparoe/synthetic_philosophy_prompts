answer: |-
  **MEMORANDUM**

  **TO:** Catering and Ethics Committee
  **FROM:** [Your Name]
  **DATE:** 24 October 2023
  **SUBJECT:** Recommendation on Catering Contract Renewal and Menu Policy

  **Introduction**

  We are approaching a decision on our catering contract that is more complex than the usual tender process. This isn't just about cost per head or the quality of the roast potatoes. We are being asked to make a moral choice about what kind of relationship this university wants to have with the living world that feeds it.

  I am writing this as someone who writes about food for a living, not as an ethicist. I have listened closely to Marcus's arguments on land use and carbon, and Priya's arguments on individual welfare and wild animal suffering. Both are compelling. Both are uncomfortable. If we follow Marcus's logic to its end, we risk ignoring the individual life of the chicken. If we follow Priya's to its end, we risk paralysis, unable to serve anything without fearing a hidden body count.

  We cannot let perfect ethics be the enemy of good policy. We have to act on the best evidence we have, not the questions we can't yet answer.

  **The Recommendation**

  I recommend the committee adopts a **Plant-First Default** policy for the coming academic year, with the following specific conditions:

  1.  **Beef:** We cease purchasing beef for general catering immediately. For formal college dinners, we allow a waiver system for up to two events per term, provided the beef is sourced from regenerative, high-welfare UK herds. This acknowledges the cultural weight of the formal hall without undermining the general policy.
  2.  **Chicken and Pork:** We retain these on the menu but mandate RSPCA Assured or Higher Welfare Food Service certification. We do not accept standard industrial welfare.
  3.  **Plant-Based:** This becomes the default option on all menus. Meat is available, but it is the opt-in choice, not the default.
  4.  **Timeframe:** The new contract begins next term. Suppliers have eight weeks to certify their supply chains meet the higher welfare standards.

  **The Reasoning**

  Marcus is right that beef is the outlier. The land-use difference is not marginal; it is exponential. Serving beef requires roughly ten times the land of chicken and vastly more than pulses. If we care about habitat loss, beef is the primary driver. Removing it is the single highest-impact change we can make.

  However, Priya is right to warn us against treating "chicken" as a moral free pass. Her point on deaths-per-calorie is mathematically sound. To feed a student body on chicken rather than beef, we swap fewer large deaths for many small ones. Furthermore, her point on crop harvesting is valid: arable farming kills field mice, voles, and insects regardless of whether the crop is fed to a human or a pig.

  So why recommend Plant-First? Because of efficiency. Even accepting Priya's "crop death" argument, it is more efficient to feed crops directly to humans than to cycle them through an animal first. A plant-based menu minimises the total acreage required. Less acreage means fewer combines running over fewer voles. Therefore, even by Priya's metric of minimising total animal death, reducing demand for animal feed is the logical step.

  Where Priya's argument becomes a red herring is on the question of wild animal suffering in rewilded land. The argument that "nature is cruel" is philosophically interesting but operationally useless for a catering contract. We cannot manage the predation rates of foxes or the starvation rates of wild birds. We can, however, manage the conditions of the animals we choose to bring into existence for our plates. We must prioritise the suffering we directly commission over the suffering that occurs naturally in the wild.

  **The Strongest Counter-Argument**

  I must be honest about the strongest case against this recommendation, which comes from Priya's second point.

  If we switch to a plant-based default, we are not stopping killing. We are simply shifting it from the slaughterhouse to the combine harvester. If insects possess even a fraction of sentience, the sheer volume of invertebrates disturbed or killed during large-scale arable farming could theoretically outweigh the suffering of a smaller number of higher-welfare cows.

  This is the "Least Harm" objection. It suggests that by going plant-based, we might be racking up a higher total debt of suffering, just one that is invisible to the consumer. We do not know if insects feel pain. We do know cows do. But if the numbers are astronomical, the uncertainty matters.

  My response is this: uncertainty cannot dictate a veto. We know farmed animals suffer. We suspect field insects might. In the face of that ambiguity, we must act on the known quantity. Furthermore, by reducing the total land footprint (as Marcus argues), we reduce the intensity of farming overall. Extensive farming kills fewer wild animals per calorie than intensive farming. So, while the counter-argument holds weight, it ultimately reinforces the need to reduce land use, which supports the Plant-First recommendation.

  **The Ethical Principle**

  We need to be clear about the principle we are adopting here, because I suspect this is where the friction lies.

  We are effectively choosing between two ethical frameworks. The first is **Individual Welfare**: the duty to ensure that any animal we bring into existence has a life worth living. This is Priya's concern. She worries that a short, grim life for a chicken is worse than a longer life for a cow, regardless of the environmental cost.

  The second is **Aggregate Consequence**: the duty to minimise the total amount of suffering and resource destruction in the system. This is Marcus's concern. He worries about the total hectares destroyed and the total carbon emitted, viewing the animals as units within that system.

  This memo recommends we prioritise **Aggregate Consequence**, but with a **Individual Welfare** safety net.

  We cannot guarantee a life worth living for every wild mouse displaced by our potato supply. But we can guarantee that the animals we *do* choose to farm (the chicken and pork) meet high welfare standards. We are choosing to minimise the total scale of the killing machine (by going plant-first and dropping beef), while ensuring that the parts of the machine we keep running are as humane as possible. We are choosing to reduce the total volume of suffering, rather than obsessing over the specific nature of every individual death, which is beyond our capacity to verify.

  **Rollout and Practicalities**

  To make this work without causing a revolt among students or staff:

  1.  **Communication:** We frame this as "Fresh and Sustainable," not "No Meat." The marketing must focus on the quality of the plant options, not the restriction of meat.
  2.  **Certification:** We instruct the catering manager to audit current suppliers. If our current chicken supplier cannot meet the higher welfare standard within eight weeks, we tender that line separately. We do not compromise on the certification.
  3.  **Formal Dinners:** The waiver for beef at formal dinners must be signed by the Master or Vice-Chancellor. This adds a layer of friction that ensures it is used sparingly.
  4.  **Review:** We schedule a review in twelve months. We need to track waste rates. If the plant-based default is being bin-bagged, the ethics don't matter because the waste negates the benefit.

  **Conclusion**

  Priya has reminded us that there is no clean option. There is only bloodier and less bloody. Marcus has reminded us that we have a responsibility to the land as well as the animal.

  By dropping beef, raising the bar on chicken, and making plants the default, we acknowledge both truths. We accept that we cannot be innocent, but we can be responsible. I ask the committee to support this motion so we can finalise the contract before the term begins.

  Thank you.
