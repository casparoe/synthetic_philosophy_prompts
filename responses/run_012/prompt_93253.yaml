answer: |-
  # Specification for an Account of Vagueness

  **Scope:** This specification defines the adequacy conditions for a theory of vagueness. The theory must function dually: as a semantics assigning content to vague predicates, and as a normative guide for reasoning, asserting, and deciding under vagueness.

  **Status Key:**
  *   **Non-Negotiable:** The account fails if it cannot accommodate this phenomenon without implausible error theory or radical revision of the phenomenon itself.
  *   **Camp Preference:** The account can fail this condition, but only by explicitly adopting a rival theoretical stance (e.g., revisionary logic, ontological realism) and bearing the associated costs.

  ---

  ## I. Requirements

  ### 1. The Sorites Resolution
  *   **Case:** A sequence of items (grains, hairs, hues) where adjacent members are indistinguishable, yet the extremes differ categorically. The paradox arises from the tension between the tolerance of the predicate (one grain makes no difference) and the falsity of the conclusion (a million grains is not a heap).
  *   **Requirement:** The account must identify exactly which step in the Sorites reasoning fails (a premise, the logic, or the conclusion) and justify why that failure does not undermine ordinary usage.
  *   **Status:** **Non-Negotiable.** (An account that leaves the paradox standing is incomplete; an account that dissolves it by denying the existence of heaps is revisionary.)

  ### 2. The Comparative Constraint
  *   **Case:** Two items differing imperceptibly are judged alike in the relevant respect. If likeness is transitive, no difference can ever accumulate. Yet we perceive differences across a spectrum.
  *   **Requirement:** The account must explain how non-transitive similarity relations can ground transitive predicate application without collapsing all distinctions into identity.
  *   **Status:** **Non-Negotiable.** (This is structurally distinct from the standard Sorites and must be solved independently.)

  ### 3. Higher-Order Vagueness (HOV)
  *   **Case:** There is no sharp line between clear cases and borderline cases. The term 'borderline' is itself vague; there are borderline borderline cases.
  *   **Requirement:** The account must not posit a sharp boundary between the extension of a predicate and its penumbra, nor between the penumbra and the anti-extension, unless it explains why this boundary is undetectable in principle.
  *   **Status:** **Non-Negotiable.** (To posit a sharp boundary where none appears is to deny the phenomenology of the phenomenon.)

  ### 4. Stipulated Precision vs. Hedging
  *   **Case:** Legal or technical definitions (e.g., "age 18") create official cut-offs, yet speakers still hedge near the line ("he's practically an adult").
  *   **Requirement:** The account must distinguish between semantic vagueness and epistemic uncertainty. It must explain whether stipulation eliminates vagueness or merely masks it, and why hedging persists near stipulated lines.
  *   **Status:** **Non-Negotiable.** (Failure here conflates vagueness with ignorance or social convention.)

  ### 5. The Locus of Vagueness
  *   **Case:** A trained community converges on a sharp cut-off for a predicate; an untrained community hedges.
  *   **Requirement:** The account must locate the source of vagueness: is it in the linguistic convention, the cognitive processing of the users, or the subject matter itself? It must explain why training stabilizes usage but does not necessarily eliminate the *sense* of arbitrariness.
  *   **Status:** **Camp Preference.** (Realists will locate it in the world; semanticists in the language; cognitivists in the mind. The account must choose one consistently.)

  ### 6. Ontological Consistency
  *   **Case:** Clouds, coastlines, and blurred photographs appear to have indeterminate boundaries independent of description.
  *   **Requirement:** The account must take a consistent stance on ontological vagueness. If it denies vagueness in the world, it must explain the source of the illusion of worldly vagueness. If it accepts it, it must explain how vague objects interact with precise logic.
  *   **Status:** **Camp Preference.** (Though the *appearance* of worldly vagueness is data, the *reality* of it is theoretical.)

  ### 7. The Utility of Vagueness
  *   **Case:** We retain vague terms ('tall', 'rich') rather than replacing them with precise measures, despite the risk of paradox.
  *   **Requirement:** The account must explain the communicative or cognitive advantage of vagueness. It must show what precision costs (e.g., information overload, coordination failure) that vagueness avoids.
  *   **Status:** **Non-Negotiable.** (An account that treats vagueness as a pure defect fails to explain its ubiquity and persistence.)

  ### 8. Assertoric Norms
  *   **Case:** Speakers assert vague claims, treat them as truth-apt, contradict one another, and claim knowledge of them.
  *   **Requirement:** The account must validate ordinary assertoric practice. It cannot treat all vague assertions as systematically false, meaningless, or unknowable without significant cost.
  *   **Status:** **Non-Negotiable.** (A theory that makes ordinary speakers systematically mistaken about their own speech acts is implausible.)

  ### 9. Compositional Integrity *(Added Requirement)*
  *   **Case:** Vague predicates combine ("tall and rich", "not tall").
  *   **Requirement:** The account must specify how vagueness propagates through logical connectives. It must explain why "tall and not tall" is contradictory even if 'tall' is vague.
  *   **Status:** **Non-Negotiable.** (Without this, the semantics cannot support reasoning.)

  ### 10. Decision Guidance *(Added Requirement)*
  *   **Case:** Agents must act on borderline cases (e.g., grant a benefit, diagnose a condition).
  *   **Requirement:** The account must provide norms for decision-making in the penumbra. It must explain when it is permissible to decide arbitrarily and when it is required to hedge.
  *   **Status:** **Non-Negotiable.** (Since the account is partly a guide to reasoning, it must issue verdicts on action.)

  ---

  ## II. Incompatibilities and Trade-offs

  There is a subset of requirements that cannot be jointly satisfied without significant theoretical cost. The primary tension exists between **Requirement 3 (Higher-Order Vagueness)**, **Requirement 8 (Assertoric Norms/Classical Logic)**, and **Requirement 1 (Sorites Resolution)**.

  1.  **The Conflict:** If we maintain Classical Logic (implied by Req 8's demand to validate ordinary assertion without revision), every statement in a Sorites series is either True or False. This entails there is a *last True statement* in the series (e.g., "Grain 5,432 makes a heap" is True, "Grain 5,433" is False). This posits a sharp boundary.
  2.  **The Violation:** A sharp boundary violates **Requirement 3 (HOV)**, which demands no sharp line between clear cases and borderline cases.
  3.  **The Resolution:** One member must give.
      *   **Option A:** Deny Classical Logic (fail Req 8). Adopt many-valued or fuzzy logic. This saves HOV but complicates Assertoric Norms (how do we assert a half-true claim?).
      *   **Option B:** Accept Sharp Boundaries (fail Req 3). Adopt Epistemicism. This saves Classical Logic but claims our intuition about HOV is an illusion.
      *   **Option C:** Deny Truth-Value Uniformity (fail Req 8). Adopt Supervaluationism. This saves HOV locally but creates a sharp boundary between 'super-true' and 'not super-true' at a higher level.

  **Which must give?**
  **Requirement 3 (Higher-Order Vagueness)** is the most likely candidate to yield in formal systems. While phenomenologically robust, it is the hardest to formalize without triggering regress. Most formal accounts that preserve classical logic and assertoric norms eventually posit a sharp boundary somewhere in the meta-language, effectively treating HOV as a cognitive limitation rather than a semantic feature.

  **The Most Exclusionary Requirement:**
  **Requirement 3 (Higher-Order Vagueness).**
  This requirement eliminates the largest class of candidate theories. Simple three-valued logics fail it (they posit a sharp line between True and Indeterminate). Simple Epistemicism fails it (it posits a sharp line between True and False). Only sophisticated Supervaluationism or Contextualism attempts to model it, and even they struggle to avoid sharp boundaries at the meta-level. It is the filter that separates "toy models" from "robust accounts."

  ---

  ## III. Theory Scorecard

  *   **Epistemicism:**
      *   *Verdict:* Fails **Requirement 3 (HOV)**.
      *   *Reason:* Posits sharp boundaries between true and false cases, treating the absence of a known boundary as ignorance rather than semantic indeterminacy.

  *   **Supervaluationism:**
      *   *Verdict:* Fails **Requirement 3 (HOV)** (at the meta-level).
      *   *Reason:* While it allows truth-value gaps, the distinction between 'super-true' and 'neither' creates a sharp boundary in the space of precisifications, reintroducing HOV problems at the level of 'definiteness'.

  *   **Degree-Theoretic (Fuzzy) Treatments:**
      *   *Verdict:* Fails **Requirement 8 (Assertoric Norms)**.
      *   *Reason:* Assigns degrees of truth (0 to 1), which conflicts with the binary nature of ordinary assertion and contradiction (we assert 'p', not 'p to degree 0.7').

  *   **Contextualist Treatments:**
      *   *Verdict:* Fails **Requirement 1 (Sorites Resolution)** (in its static form).
      *   *Reason:* Solves the paradox by shifting the context of evaluation during the Sorites march, implying the predicate changes meaning mid-argument rather than having a stable semantics that blocks the inference.

  *   **Nihilism (Error Theory):**
      *   *Verdict:* Fails **Requirement 8 (Assertoric Norms)**.
      *   *Reason:* Claims all positive vague assertions are false or lack truth conditions, rendering ordinary discourse systematically erroneous.

  ---

  ## IV. Closing Question: Meta-Language Precision

  **Question:** If the metalinguistic vocabulary must itself be precise for the theory to be stateable, does that reinstate a sharp boundary and so violate the higher-order vagueness item?

  **Argument from Cases:**
  Consider a cartographer drawing a map of a cloud. The cloud has no sharp boundary; it fades into the sky. The map, however, is drawn with sharp ink lines on precise paper. Does the precision of the ink lines make the cloud precise? No. The map is a representation, not the territory. A precise theory is a tool for describing an imprecise phenomenon.

  However, consider a different case: A judge ruling on a vague law. If the judge issues a precise ruling ("The cutoff is exactly 17 years, 364 days"), does this make the law precise? In the context of the ruling, yes. The act of theorizing can be like the judge's ruling. If the theory claims "There is *no* fact of the matter," it makes a precise claim about the absence of facts.

  The tension arises not from the precision of the *tools* (logic, math, definitions), but from the precision of the *claims*. If the theory claims "There is a sharp boundary between 'borderline' and 'clear'," it violates HOV. If it claims "The boundary between 'borderline' and 'clear' is itself vague," it must use precise words to state that vagueness.

  This does not violate HOV, provided the theory distinguishes the *object language* (where vagueness lives) from the *meta-language* (where the theory lives). The violation would only occur if the theory claimed that the precision of the meta-language *eliminated* the vagueness in the object language. As long as the theory acknowledges that its precise definitions are stipulations for the sake of clarity, and not discoveries of hidden sharp boundaries in the world, HOV is preserved. The risk is performative contradiction: using a sharp concept ('vague') to deny sharp concepts. But just as a blurry photograph can be sharply focused on a screen, a vague phenomenon can be sharply described without losing its vagueness. The requirement is not that the theory be vague, but that the theory correctly model vagueness. Precision in the model is necessary to ensure the model is intelligible; it does not force the modeled object to be precise.
