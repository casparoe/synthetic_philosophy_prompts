answer: |-
  **Violence Decline Debate: A Decision Tree**

  Locate your position by answering four questions. Follow the branches. Boxes marked **EMPTY** indicate combinations no serious theorist occupies.

  **1. What counts as violence?**
  *   **A.** Only direct, intentional physical harm by identifiable agents. → *Go to 2.*
  *   **B.** Also deaths from deprivation or structural conditions (poverty, disease). → *Go to 2.*
  *   **C.** Also dignitary or psychological harm. → **EMPTY** (Diagnosis: Unattractive; conflates insult with injury, making measurement impossible.)

  **2. What is the denominator?**
  *   **A.** Per-capita of world population. → *Go to 3.*
  *   **B.** Absolute counts of deaths/injuries. → *Go to 3.*
  *   **C.** Per-capita of persons actually exposed to risk (or states). → *Go to 3.*

  **3. Is there a fact of the matter?**
  *   **A.** Yes, straightforwardly empirical. → *Go to 4.*
  *   **B.** No, true only relative to concepts/measures, or evaluative. → **LEAF: The Anti-Realist** (Awkward commitment: Must admit their own critique is equally relative.)

  **4. What is the baseline timescale?**
  *   **A.** All recorded history. → *See Leaf 1.*
  *   **B.** Since 1945. → *See Leaf 2 or 3.*
  *   **C.** Since 1990. → **EMPTY** (Diagnosis: Unexplored; window is too short to distinguish trend from noise.)

  ***

  **THE LEAVES**

  **1. The Declinist**
  *   *Path:* 1A (Direct) + 2A (Per Capita World) + 3A (Empirical) + 4A (History).
  *   *Awkward Commitment:* Must treat prehistoric data estimates as comparable to modern statistics.

  **2. The Long-Peace Institutionalist**
  *   *Path:* 1A (Direct) + 2C (Exposed/States) + 3A (Empirical) + 4B (1945).
  *   *Awkward Commitment:* Must attribute stability to nuclear deterrence or institutions despite ongoing proxy wars.

  **3. The Structural-Violence Skeptic**
  *   *Path:* 1B (Structural) + 2B (Absolute) + 3A (Empirical) + 4B (1945).
  *   *Awkward Commitment:* Must label systemic economic outcomes as 'violence' equivalent to murder.

  **4. The Anti-Realist**
  *   *Path:* Any Scope + Any Denominator + 3B (Relative/Evaluative).
  *   *Awkward Commitment:* Cannot claim the world is objectively worse, only that our description has changed.

  ***

  **NOTES ON GAPS**

  **Indistinguishable Leaves:** The tree cannot cleanly separate **The Declinist** and **The Long-Peace Institutionalist**. Both rely on direct violence and empirical claims; they often differ only in whether they emphasize the deep historical trend or the post-war institutional breakpoint. If the data overlaps, the positions merge.

  **Empty Diagnoses:**
  *   *Unattractive:* The view is coherent but morally or analytically unappealing (e.g., counting insults as violence).
  *   *Unexplored:* The view is logically possible but lacks proponents (e.g., a 1990 baseline).
  *   *Incoherent:* The view contradicts itself (none identified here, though 1C borders on it).

  **Denominator Trap:** Notice that selecting 2A (World Per-Capita) often forces a Declinist conclusion, while 2B (Absolute Counts) forces a Skeptic conclusion, even if both agree on the raw data. A person can be a declinist on one denominator and not on another.
