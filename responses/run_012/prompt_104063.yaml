answer: |-
  # Diagnostic Tree: Compatriot Priority in Vaccine Distribution

  **Anchor Case:** A state possesses a scarce supply of a life-saving vaccine. Foreigners and citizens are in equal medical need. The state must decide whether to prioritize its own citizens.

  ### The Decision Tree

  **Node 1: The Impartiality Test**
  Does practical reason require you to weigh every human's equal need identically, regardless of relationship (e.g., family, friends)?
  *   **Yes** → Go to **Leaf 1**.
  *   **No** → Go to **Node 2**.

  **Node 2: The Citizenship Test**
  Does the specific relationship of *shared citizenship* justify prioritizing need, distinct from intimate relationships?
  *   **No** → Go to **Leaf 2**.
  *   **Yes** → Go to **Node 3**.

  **Node 3: The Modality Test**
  Is favoring a compatriot merely *permitted* (a prerogative one may exercise), or *required* (an obligation one must fulfill)?
  *   **Permitted** → Go to **Leaf 3**.
  *   **Required** → Go to **Node 4**.

  **Node 4: The Voluntary Ground Test**
  Is the obligation grounded in a *voluntary* act or transaction by the citizen?
  *   **Yes** → Go to **Node 5**.
  *   **No** → Go to **Node 7**.

  **Node 5: The Consent Test**
  Is the ground *explicit consent* to the political association (e.g., naturalization, oath)?
  *   **Yes** → Go to **Leaf 4**.
  *   **No** → Go to **Node 6**.

  **Node 6: The Reciprocity Test**
  Is the ground *receipt of benefits* from a cooperative scheme (fair play), regardless of explicit consent?
  *   **Yes** → Go to **Leaf 5**.
  *   **No** → *Incoherent* (Voluntary ground without consent or benefit).

  **Node 7: The Coercion Test**
  Is the obligation grounded in *subjection to the same coercive institutions*?
  *   **Yes** → Go to **Leaf 6**.
  *   **No** → Go to **Node 8**.

  **Node 8: The Identity Test**
  Is the obligation grounded in a shared *national culture or identity*?
  *   **Yes** → Go to **Leaf 7**.
  *   **No** → Go to **Node 9**.

  **Node 9: The Associative Test**
  Is the obligation grounded in an unchosen *constitutive attachment* (the moral force of the bond itself, distinct from cultural content)?
  *   **Yes** → Go to **Leaf 8**.
  *   **No** → *Collapses* (Mere administrative fact lacks normative force; see Analysis).

  ---

  ### The Leaves (Positions & Awkward Commitments)

  **Leaf 1: Strict Cosmopolitanism**
  *   **Definition:** Practical reason is fully impartial; relationships generate no stronger claims than general need.
  *   **Awkward Commitment:** The state must distribute the vaccine by global lottery, even if it means no citizens survive while foreigners do.

  **Leaf 2: The Intimate-Partiality View (The "Forgotten" View)**
  *   **Definition:** Special claims exist for family and friends, but citizenship is morally equivalent to mere proximity.
  *   **Awkward Commitment:** A citizen must prioritize a foreign friend over a compatriot stranger, treating national borders as morally inert.

  **Leaf 3: Cosmopolitanism with Compatriot Prerogative**
  *   **Definition:** Impartiality is the default duty, but agents have a personal permission to favor compatriots without violating morality.
  *   **Awkward Commitment:** A health official may legally reserve vaccines for citizens, but acts morally supererogatorily if they send doses abroad instead.

  **Leaf 4: Contractualist/Consent View**
  *   **Definition:** Obligations arise only from voluntary association or explicit agreement to the political scheme.
  *   **Awkward Commitment:** Native-born citizens who never consented to the state have no claim to priority over foreigners.

  **Leaf 5: Fair-Play/Reciprocity View**
  *   **Definition:** Obligations arise from accepting benefits within a cooperative scheme, requiring contribution in return.
  *   **Awkward Commitment:** Citizens who paid less tax or contributed less to the scheme deserve lower priority access to the vaccine.

  **Leaf 6: Political Coercion Statism**
  *   **Definition:** Obligations arise because the state imposes coercive laws on citizens that it does not impose on foreigners.
  *   **Awkward Commitment:** If the state's coercive apparatus temporarily collapses (e.g., natural disaster), the duty to prioritize citizens vanishes.

  **Leaf 7: Liberal Nationalism**
  *   **Definition:** Obligations arise from the value of sustaining a shared national culture or identity.
  *   **Awkward Commitment:** If a subgroup assimilates into a different culture, the state's duty to prioritize them diminishes.

  **Leaf 8: Pure Associativism**
  *   **Definition:** Obligations arise from the unchosen constitutive attachment of the relationship itself, independent of culture or value.
  *   **Awkward Commitment:** The state must prioritize citizens even if the national culture is morally bankrupt or the relationship is purely burdensome.

  ---

  ### Diagnostic Analysis

  **1. Inseparable Positions**
  *   **Liberal Nationalism (Leaf 7) vs. Pure Associativism (Leaf 8):** The tree separates these at Node 8 based on whether the *content* of the culture matters (Nationalism) or only the *bond* itself (Associativism). In practice, these positions often collapse because constitutive attachments are rarely devoid of cultural content. A student may find themselves answering "Yes" to both Node 8 and Node 9, indicating that for their view, culture and bond are inseparable.

  **2. Collapsed Positions**
  *   **Administrative Positivism:** The path following "No" at Node 9 represents the view that mere historical or administrative fact grounds obligation. This position is left empty because it is normatively inert; without coercion, benefit, or attachment, administrative fact collapses into **Strict Cosmopolitanism (Leaf 1)** regarding duties, or functions merely as a description of **Political Coercion Statism (Leaf 6)** if enforcement is present.

  **3. Empty Answer-Combinations**
  *   **Incoherent:** *Node 4 (Yes) → Node 5 (No) → Node 6 (No).* This combination claims the ground is voluntary but denies both consent and reciprocal benefit. There is no logical space for a voluntary obligation that involves neither agreement nor exchange.
  *   **Unattractive:** *Node 5 (Yes) [Consent View].* While logically coherent, this leaf is sparsely populated in contemporary literature because it renders the vast majority of native-born citizens (who never explicitly consented) without special claims, a conclusion most find politically unsustainable.
  *   **Unexplored:** *Node 3 (Permitted) → Node 9 (Yes) [Associative Prerogative].* The tree forces Associativism (Node 9) down the "Required" branch. A view where unchosen attachments generate a *permission* to favor compatriots but not a *requirement* is theoretically possible but rarely defended, as associative theories typically argue for the binding nature of the bond.
