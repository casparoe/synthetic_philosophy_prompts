      *   *Best Candidate:* The **Non-Circularity / Input-Output Independence** constraint. Why? Because "Fully Informed" assumes information fixes values (circular if values dictate what info matters). "Coherent Extrapolation" assumes coherence is the goal (circular if incoherence is authentic). "Ideal Advisor" assumes the advisor is ideal (circular definition).
