      *   *The Critique:* Idealization is either too thin (collapses to actual desires) or too thick (becomes external imposition).
      *   *Key Concepts:* Adaptive preferences (Nussbaum/Sen), Identity/Continuity (Parfit), Fixed Points (reflective equilibrium), Agency (autonomy).

