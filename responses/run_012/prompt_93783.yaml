      *   *Actually, let's consider "Procedural Neutrality vs. Substantive Correction".* If you demand the procedure be neutral, you can't guarantee correction. If you demand correction, you aren't neutral.
      *   *Decision:* I will argue that the **Non-Substitution Constraint (Recognizability)** is the killer. It forces the theory to explain *why* the ideal self is the *same* agent. Fully Informed fails (new info creates new person). Coherent-Extrapolation fails (coherence might require lobotomy of passion). Ideal Advisor fails (advisor might be a different person).

  6.  **Refining the Output Structure:**
