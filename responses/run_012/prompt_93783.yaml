answer: |-
  This is a sophisticated project. You are effectively attempting to map the logical space of *procedural realism* without committing to a specific ontology of the good. The stagnation in your seminar is typical; the literature often oscillates between "thin" theories that fail to correct adaptive preferences (e.g., simple full-information accounts) and "thick" theories that fail to respect agency (e.g., objective list theories disguised as idealization).

  Below is the specification list you requested, structured by cases, distinctions, and formal constraints, followed by the conflict report and the assessment of existing accounts.

  ### I. The Desiderata List

  #### A. Test Cases (Extensional Adequacy)
  An adequate theory must deliver specific verdicts in the following scenarios.

  1.  **The Reverse-Idealization Case**
      *   **The Case:** An agent undergoes idealization (becomes informed, coherent, vivid) and concludes: "I now see that my actual, biased, limited self is better off making decisions than this idealized self is. I choose to revert." (Compare: Nozick's Experience Machine, or a parent choosing to remain partially ignorant to preserve hope).
      *   **Requirement:** The theory must explain whether the *idealized* preference (to revert) overrides the *actual* preference (to stay), or if the ability to choose non-idealization is itself a constraint on idealization.
      *   **Status:** **Genuine.** If the theory cannot account for the rationality of choosing non-idealization, it conflates *ideal agency* with *maximal capacity*, which is a category error.

  2.  **The Path-Dependence Case**
      *   **The Case:** Two different idealization procedures (e.g., "therapy first, then information" vs. "information first, then therapy") applied to the same agent yield different stable preference sets.
      *   **Requirement:** The theory must either demonstrate that all valid paths converge to the same fixed point or provide a meta-rule for selecting the correct path that does not rely on the output of the paths themselves.
      *   **Status:** **Genuine.** Without this, "idealized preference" is indeterminate, rendering the concept useless for guiding action.

  3.  **The Collective Mismatch Case**
      *   **The Case:** A community's extrapolated volition (what they would agree on under ideal conditions) prescribes a sacrifice that no individual member's extrapolated volition would prescribe for themselves.
      *   **Requirement:** The theory must specify the relationship between individual ideal reasons and collective ideal reasons. It cannot simply assert that the collective verdict overrides the individual without explaining the mechanism of *transfer*.
      *   **Status:** **Camp Commitment.** Individualists will reject the premise that a collective ideal exists independently of individual ideals. Communitarians will accept it. A neutral specification must demand the theory *address* the gap, not necessarily close it.

  4.  **The Meta-Idealization (Self-Modification) Case**
      *   **The Case:** The idealized agent reflects on the *criteria* of idealization and concludes: "Vividness of imagination is not a virtue; it leads to paralysis. The correct idealization procedure should weight coherence higher than vividness."
      *   **Requirement:** The theory must allow the idealization procedure itself to be subject to idealization without generating an infinite regress.
      *   **Status:** **Genuine.** If the criteria for idealization are fixed dogmatically, the theory is not truly procedural; it is substantive perfectionism in disguise.

  #### B. Conceptual Distinctions (Intensional Clarity)
  The theory must not collapse the following pairs.

  1.  **Ideal Want vs. Objective Good**
      *   **Motivation:** To avoid collapsing into Perfectionism. If what I would want ideally is simply *what is good for me*, the preference structure is doing no work.
      *   **Requirement:** There must be a possible world where an agent's ideal preferences diverge from their objective good (even if that world is not actual).
      *   **Status:** **Genuine.** This is the defining feature of preference-based views vs. objective-list views.

  2.  **Idealizing vs. Replacing**
      *   **Motivation:** To avoid the Alienation Objection. If the process changes me so much that I no longer identify with the output, the output is not *my* reason, but a stranger's command.
      *   **Requirement:** The theory must specify a continuity condition (psychological, narrative, or causal) between the actual agent and the idealized agent.
      *   **Status:** **Genuine.** Without this, the theory ceases to be an account of *practical reason for the agent* and becomes an account of *what should be done to the agent*.

  3.  **Genuine Indeterminacy vs. Computational Hardness**
      *   **Motivation:** To distinguish metaphysical openness from epistemic limitation.
      *   **Requirement:** The theory must state whether the lack of a unique ideal preference is due to the complexity of the calculation (we can't find the answer) or the nature of the agent (there is no single answer).
      *   **Status:** **Camp Commitment.** Rationalists demand a unique answer (hardness). Pluralists/Existentialists accept indeterminacy. The specification must force the theorist to declare which they mean.

  #### C. Formal Constraints (Structural Integrity)
  1.  **Non-Circularity**
      *   **Motivation:** To prevent smuggling. The input conditions (information, coherence) cannot presuppose the output values.
      *   **Requirement:** The definition of "ideal conditions" must not rely on the values the agent is expected to hold after idealization.
      *   **Status:** **Genuine.** Violating this makes the theory tautological.

  2.  **Convergence (Fixed Point)**
      *   **Motivation:** To ensure stability. If iterating the idealization process changes the preference set indefinitely, there is no "ideal" state.
      *   **Requirement:** The idealization function $f$ applied to preferences $P$ must yield a $P'$ such that $f(P') = P'$.
      *   **Status:** **Genuine.** Without a fixed point, the term "idealized preference" refers to a moving target.

  3.  **Definedness in Self-Modification**
      *   **Motivation:** To handle the Meta-Idealization Case formally.
      *   **Requirement:** The function must be defined even when the agent modifies the function's own parameters.
      *   **Status:** **Genuine.** Otherwise, the theory crashes on reflection.

  ---

  ### II. The Conflict Report

  You are correct to suspect that the requirements are not jointly satisfiable. The central tension is not merely technical; it is constitutive of the problem of agency itself.

  #### 1. The Primary Incompatibility: Recognizability vs. Correction
  **The Conflict:** The **Non-Alienation (Recognizability) Constraint** is logically in tension with the **Correction Constraint** (the requirement to fix adaptive/depressed preferences).
  **The Shape of the Tradeoff:**
  Adaptive preferences (e.g., the contented slave) are not merely cognitive errors; they are *constitutive* of the agent's current identity. They are the psychological scar tissue formed to survive specific circumstances. To "correct" these preferences requires a psychological restructuring deep enough that the resulting agent may no longer share the actual agent's fundamental projects, attachments, or narrative self-conception.
  *   **If you prioritize Correction:** You must allow the idealization process to overwrite the adaptive preferences. But in doing so, you risk severing the psychological continuity required for Recognizability. The "ideal" agent is no longer the "actual" agent; she is a different person who happens to occupy the same body. The verdicts she issues are no longer *reasons for* the actual agent, but reasons *against* her.
  *   **If you prioritize Recognizability:** You must constrain the idealization process to preserve the agent's core identity. But since the core identity is partly constituted by the adaptive preferences, the idealization process is blocked from correcting them. The theory collapses back into actual preferences (the "status quo bias" problem).

  **Diagnosis:** This is not a bug in specific theories; it is a feature of the concept. You cannot demand that an agent be both *radically improved* and *essentially the same*. The "Idealized Preference" model tries to hide this tradeoff behind the veil of "procedural neutrality," but the tradeoff remains.

  #### 2. Secondary Incompatibility: Sovereignty vs. Convergence
  **The Conflict:** The **Individual Sovereignty Constraint** (the ideal must be *mine*) conflicts with the **Collective Convergence Constraint** (the ideal must be *ours* / universalizable).
  **The Shape of the Tradeoff:**
  If idealization is truly individualized (respecting unique histories and psychologies), there is no guarantee that two idealized agents will converge on the same moral truths or social arrangements. If you enforce Convergence (as many Kantian-leaning idealization theories do), you must strip away the idiosyncratic elements of the individual's psychology that cause divergence. But stripping away idiosyncrasy violates Individual Sovereignty.
  *   **Result:** A theory that guarantees moral convergence does so by making the "ideal agent" a generic rational agent, not *you*.

  #### 3. Tertiary Incompatibility: Stability vs. Sensitivity
  **The Conflict:** The **Fixed Point Constraint** conflicts with the **Meta-Idealization Constraint**.
  **The Shape of the Tradeoff:**
  A fixed point implies stability: once idealized, further reflection does not change the preference. However, if the idealized agent is truly sensitive to new conceptual possibilities (Meta-Idealization), she might always be able to conceive of a better standard of reflection than the one that produced her current state.
  *   **Result:** A truly open-minded ideal agent never reaches a fixed point. A theory that insists on a fixed point must therefore limit the ideal agent's capacity for self-critique, rendering her dogmatic.

  ---

  ### III. Assessment: The Killer Constraint

  The single requirement that does the most work to rule out the accounts currently defended in your seminar is the **Non-Alienation (Continuity) Constraint**.

  Here is why it devastates the three main contenders:

  1.  **The Fully Informed Account:**
      *   *Why it fails:* Information is not identity-neutral. To become "fully informed" about the suffering in the world, the history of one's own lineage, or the contingency of one's desires often requires a psychological transformation so radical that the resulting agent does not identify with the actual agent's projects. (e.g., If I knew what you know, I wouldn't be *me* anymore; I would be a sage, and sages don't care about my football team).
      *   *The Ruling:* It violates Non-Alienation. It corrects preferences by replacing the person.

  2.  **The Coherent-Extrapolation Account:**
      *   *Why it fails:* Coherence is a structural virtue, not a substantive one. To make a messy, human preference set perfectly coherent often requires pruning away conflicting passions, ambivalences, and deep commitments that define the person. (e.g., To make my love for my child coherent with my utilitarian commitments, I might have to stop loving my child *in the way that I actually do*).
      *   *The Ruling:* It violates Non-Alienation. It achieves coherence at the cost of the very passions that make the preferences *mine*.

  3.  **The Ideal-Advisor Picture:**
      *   *Why it fails:* This view posits an idealized version of the agent advising the actual agent. But for the advice to be normative, the Advisor must be sufficiently ideal (correcting the actual agent's blindness). For the advice to be motivating/recognizable, the Advisor must be sufficiently similar.
      *   *The Ruling:* It violates Non-Alienation *or* Correction. If the Advisor is close enough to be *me*, she shares my blindness (fails Correction). If she is wise enough to fix my blindness, she is too distant to be *me* (fails Non-Alienation).

  **Conclusion for your paper:**
  The Non-Alienation Constraint exposes the "smuggling" charge your seminar is stuck on. Theories that claim to satisfy Correction while maintaining Recognizability are implicitly relying on a substantive theory of human nature (a "camp commitment") to guarantee that the "real me" is the "good me." Without that hidden substantive premise, the formal constraints of idealization tear the concept apart. Your paper should argue that the stagnation in the seminar is not due to a lack of ingenuity, but because the specification list contains incompatible demands that no procedural theory can satisfy without covertly becoming a substantive one.
