answer: |-
  This is a classic dispute in modern decision theory. The thought experiment your housemates are fighting over is a variation of **Counterfactual Mugging** (proposed by Eliezer Yudkowsky), which itself is a descendant of **Newcomb's Problem** and **Parfit's Hitchhiker**.

  The core conflict is between **Causal Decision Theory (CDT)**, which Rae is using, and **Updateless/Functional Decision Theory (UDT/FDT)**, which Sam is using.

  Here is the round-by-round breakdown of who is holding the stronger position, what they are missing, and the verdict on the money.

  ### Round 1: The Expected Value Calculation
  *   **Sam's Move:** He calculates the value of the *policy* before the coin flip. He argues you should maximize expected value across both possible worlds (Heads and Tails).
  *   **Rae's Move:** She calculates the value of the *act* after the coin flip. She conditions on the known fact (Heads) and argues the Tails world is no longer accessible.
  *   **Who is right?** **Sam.**
      *   **Why:** In decision theory, the standard metric for a "good" decision procedure is whether it yields the highest utility *ex-ante* (before the uncertainty is resolved). If you could bind yourself to a decision before Omega flipped the coin, you would irrevocably bind yourself to "Pay." Rae admits she would pay in the "envelope" version (where she doesn't know the coin state). This proves her preference is **time-inconsistent**. She prefers to be the kind of person who pays *before* the flip, but the kind of person who refuses *after* the flip. Sam's approach is time-consistent.
      *   **What Rae misses:** She treats the Tails branch as "dead" simply because she observed Heads. But Omega's payout in the Tails branch was determined by her *disposition* in the Heads branch. By refusing now, she confirms she is the disposition that loses the Tails money.

  ### Round 2: Logical vs. Causal Connection
  *   **Sam's Move:** He argues the link is logical. Omega simulated her decision algorithm. Therefore, her current decision procedure is the "common cause" of both the prediction (in the past) and the action (now).
  *   **Rae's Move:** She argues the link is either causal (and thus fixed in the past) or magic. She claims she cannot change a past prediction with a current check.
  *   **Who is right?** **Sam (with nuance).**
      *   **Why:** Rae is relying on physical causality (time flows forward, effects follow causes). Sam is relying on **logical correlation**. Omega didn't predict *her*; Omega predicted her *source code*. If her source code outputs "Refuse" now, it would have output "Refuse" in the simulation then. She isn't changing the past; she is executing the same function that generated the past prediction.
      *   **What Sam misses:** He glosses over how uncomfortable this feels. It requires accepting that your decision "controls" logical facts about simulations that no longer exist.
      *   **What Rae misses:** She dismisses the simulation as "magic." It isn't magic; it's computation. If you run `f(x)` on a computer yesterday, and I run `f(x)` on my computer today, the outputs match. My running it today doesn't *cause* yesterday's output, but they are logically linked. Rae refuses to acknowledge that her current choice *reveals* what the simulation did.

  ### Round 3: The Envelope and Pre-commitment
  *   **Sam's Move:** He points out that in the "envelope" version (where you don't know the coin result), Rae would pay. He argues this proves her current refusal is just a failure of willpower or consistency.
  *   **Rae's Move:** She distinguishes the cases based on information. She argues that knowing the coin is Heads changes the rational calculation because it eliminates the Tails branch from her "reachable" reality.
  *   **Who is right?** **Sam.**
      *   **Why:** This is the strongest point for Sam. Rae's admission that she would pay if she *didn't* know the coin flip is a confession that her decision theory is **dynamically inconsistent**. A rational agent shouldn't wish to restrict its own future options. Rae wishes she could have pre-committed to Paying, but now that she is in the future, she refuses to honor that commitment. This makes her vulnerable to "money pumps" (situations where she can be exploited because her future self undoes her past self's plans).
      *   **What Rae misses:** She treats "information" as something that should change her policy. In Updateless Decision Theory, you should ignore information that tells you *which* branch you are in if acting on that information makes you lose in the other branches. You want a policy that wins globally, not locally.

  ### Round 4: Slogans and Principles
  *   **Sam's Move:** "Only the branch you're actually in counts" is a bad principle because it prevents winning in counterfactual scenarios.
  *   **Rae's Move:** "Be the sort of thing that pays" is a slogan, not an argument for why *she* should lose $100 *now*.
  *   **Who is right?** **Draw (Philosophical Stalemate).**
      *   **Why:** They have reached the bedrock axioms. Rae values **causal efficacy** (my action must physically cause the good outcome). Sam values **outcome optimality** (I want the decision procedure that results in the most money, regardless of causal arrows).
      *   **The Verdict:** In the context of this specific puzzle (and AI alignment theory), Sam wins. The point of the puzzle is to show that CDT (Rae) leaves money on the table. If the goal of decision-making is to get the best result, Sam's agent gets $3,450 (expected) and Rae's agent gets $1,500 (expected). Rae is "rationally" guaranteeing herself a poorer outcome.

  ---

  ### The Question of the Amounts
  You asked: *"They say the size of the amounts is irrelevant and it's all about the structure of the case. That can't be right, can it?"*

  **You are right to doubt them.** They are technically wrong, though they feel right.

  The *absolute* numbers don't matter, but the **ratio** absolutely does. The structure only compels you to pay if the Expected Value (EV) of paying is higher than refusing.

  Look at Sam's math:
  *   **EV(Pay)** = $(0.5 \times -\$100) + (0.5 \times 0.7 \times \$10,000) = \$3,450$
  *   **EV(Refuse)** = $(0.5 \times \$0) + (0.5 \times 0.3 \times \$10,000) = \$1,500$

  Now, imagine Omega only offers **$150** in the Tails case, keeping the cost at $100.
  *   **EV(Pay)** = $(0.5 \times -\$100) + (0.5 \times 0.7 \times \$150) = -\$50 + \$52.50 = \mathbf{+\$2.50}$
  *   **EV(Refuse)** = $(0.5 \times \$0) + (0.5 \times 0.3 \times \$150) = \mathbf{+\$22.50}$

  In this scenario, **Rae is right and Sam is wrong.** If the reward is too low, the "Pay" policy loses money overall. You should refuse.

  **Correction for the Housemates:** The specific dollar amounts don't matter, *provided the reward is high enough to offset the risk*. The structural claim holds only if $\text{Reward} \times \text{Accuracy} > \text{Cost}$. If the amounts change the sign of the Expected Value, the decision flips. So, the amounts *are* relevant to the decision, even if the *logic* of the argument remains the same.

  ### Final Verdict for the Referee

  1.  **Sam wins on Instrumental Rationality:** If the goal is to design an agent (or a person) that ends up with the most money, Sam's reasoning is superior. His decision procedure wins in the long run and across possible worlds. Rae's procedure is exploitable; she would pay to pre-commit, then pay to break the commitment, then lose the reward.
  2.  **Rae wins on Causal Intuition:** Rae represents standard human intuition and standard Causal Decision Theory. In almost every real-world situation outside of Omega-style thought experiments, her reasoning is correct. You usually cannot influence the past via logical correlation. She is "right" about how the physical universe usually works, just not about how Omega's specific logical trap works.
  3.  **The "Settled" Claim:** Sam is lying (or exaggerating). This is not settled in general philosophy. It is, however, the "orthodox" view in the specific community of rationalists and AI theorists who study Updateless Decision Theory. Rae is right that a blog consensus isn't a proof, but Sam is right that her view leads to lower utility in this specific constructed case.

  **How to settle the bet:**
  Tell them Sam is right about the *strategy*, but you are right about the *money*. The amounts matter if they change the Expected Value calculation. If the $10,000 reward stands, Sam's agent walks away richer. Rae's agent walks away with a clear conscience but $100 poorer and $10,000 poorer (in the counterfactual sense).

  If they must pay $100 to settle the peace, tell them to pay it. It's the only way to be the "sort of thing" that keeps the peace in *this* branch, regardless of what Omega would have done.
