prompt: |-
  I host a small interview podcast and next week's guest is a philosopher who's spent the last decade defending the view that sentience comes in degrees rather than being on/off, and her particular slant is that what gets graded is the "temporal thickness" of a creature's affective life -- roughly, how far a felt state reaches backward (memory, lingering mood, anticipation) and forward (expectation, dread, relief) -- rather than raw intensity or how rich its representations are. On her scale a mammal scores high, an insect scores low but clearly above zero, and a thermostat lands at or near zero, though she's been annoyingly cagey about whether it's exactly zero or just too small to matter. I don't want softballs or "so you think bugs can feel pain?" I want questions that press on the actual machinery of the view.

  Give me eight questions, each with a follow-up keyed to the answer she's most likely to give. I need at least one question on each of these:

  - where her zero point definately sits, and how she distinguishes "exactly zero" from "so close to zero that nothing follows" without just stipulating it
  - the numbers problem: how the scale handles a billion insects against one chimp, and whether a graded scale is even the right kind of thing to aggregate over
  - whether grading sentience and grading moral status can come apart -- say, a being that's very sentient but whose affective range is narrow or mostly negative, or one that's barely sentient but whose sliver of experience is the whole of its good
  - whether "temporal thickness" is really one dimension or several glued together, and what her view does with a creature where they disagree (deep memory, no anticipation, that kind of thing)

  Also work in one question about the thermostat that she can't wriggle out of with a definition, and one about what evidence would actually move her own position rather than just her opponents'.

  One more thing: flag which of the eight you think is most likely to draw a deflecting or pre-rehearsed answer, and say where your read of her is most likely to be wrong -- what would have to be true about her view for that question to be sharp after all. I'd rather cut a question than ask a soft one.
