answer: |-
  Here is the teaching plan.

  ### 1. The Opening Move: The Maxim, Not The Truth
  **Verdict:** Your hunch is correct. Do not start with "What is Truth?"
  **Why:** If you start with "Truth," the room immediately defaults to a metaphysical correspondence model (Truth = Mirror of Reality). James enters that room and says, "No, it's what works." Peirce looks like he's just arguing about the definition of "Mirror." Both lose.

  **Execution:**
  Start with **Meaning**, not Truth. Frame the session as: *"How do we know if a scientific or legal concept is meaningful at all?"*
  *   **The Tool:** Introduce the Pragmatic Maxim immediately. "Consider what effects, that might conceivably have practical bearings, we conceive the object of our conception to have."
  *   **The Trap to Avoid:** Do not let them parse the sentence grammatically. Translate it instantly: *"If two statements predict the exact same observable outcomes, they are the same statement. If a statement predicts no observable outcomes, it is noise."*
  *   **Why this wins:** This makes Peirce the default setting for scientists. It frames pragmatism as a method of *clarification* (logic/semantics), not a definition of *truth* (metaphysics). James only enters later as the person who asked, "Okay, but what about when the outcomes are personal or moral?" This prevents the "Truth = Utility" slide because "utility" is now defined as "conceivable practical bearings," not "what makes me feel good."

  ### 2. The Carrying Case: The Luminiferous Ether
  **Verdict:** Keep the Ether, but you must **split its usage**.
  **Why:** It is perfect for your audience (scientists understand the physics; the lawyer understands the evidentiary burden). However, if you use it only one way, Peirce wins by default. You need to use the *same example* to show where the two men diverge.

  **Execution:**
  *   **Phase 1 (Peirce/Maxim):** Use the Ether to illustrate the Maxim. In 1880, "The Ether exists" had practical bearings (light transmission, calculations). It was meaningful. By 1905, "The Ether exists" had no practical bearings distinguishable from "No Ether." It became meaningless noise. Peirce's point: The *concept* dissolved because the *community of inquiry* converged on null results.
  *   **Phase 2 (James/Truth):** Pivot to the *period between 1880 and 1905*. Ask: "For the physicist working in 1890, was the Ether *true*?"
      *   **Peirce:** No. It was a hypothesis on the road to the final opinion. It was false, we just didn't know it yet.
      *   **James:** Yes. It was "true" because it successfully guided action, organized experience, and satisfied the logical demand of the moment.
  *   **The Lever:** Use the lawyer in the room. Ask them: "Is a verdict 'true' because it matches the absolute crime (Peirce's final consensus), or because it settles the dispute and allows society to function (James's cash value)?" This forces the distinction without needing new examples.

  ### 3. Sequencing the Misconceptions
  Do not list these as "Myths." Head them off exactly when they become tempting.

  **1. "They are answering the same question." (The Root Error)**
  *   **When:** Immediately after the Opening Move.
  *   **Intervention:** Explicitly state: "Peirce is asking about the *logic of science* (how concepts stabilize). James is asking about the *right to believe* (how individuals live)." If they think the question is "What is Truth?", stop and restate this. Peirce defines truth as the *destination* of inquiry; James defines truth as the *process* of validation.

  **2. "'Works' means 'comforting'." (The James Caricature)**
  *   **When:** During Phase 2 of the Ether case (The 1890 Physicist).
  *   **Intervention:** Scientists will sneer that James thinks truth is a security blanket. Correct them: "For James, 'works' means 'successfully marries old opinion to new fact.' The Ether wasn't comforting; it was *instrumentally necessary* for Maxwell's equations." Make "utility" technical, not emotional.

  **3. "Peirce is just a Correspondence Theorist with extra steps." (The Peirce Caricature)**
  *   **When:** When discussing the "Final Opinion."
  *   **Intervention:** Correspondence theory says Truth matches Reality *now*. Peirce says Truth is what Reality *would force* us to say *eventually*. The difference is time and community. If you are the only person on earth with the right belief, Peirce says you aren't "true" yet; you're just lucky. Truth is a social property of inquiry, not a private relation to objects.

  **4. "James is a Relativist." (The Exit Error)**
  *   **When:** In the final discussion.
  *   **Intervention:** This is the one they will walk out with. Stop it by saying: "James doesn't say 'True for you, true for me.' He says 'True insofar as it guides us through the stream of experience.' If your belief leads you to crash the plane, it wasn't true, even if you felt good." James has a reality check; it's just immediate, not long-run.

  ### 4. The Closing Question
  Do not ask "What did we learn?" Ask a forced-choice scenario that breaks the slogans.

  **The Question:**
  > "Newtonian physics allowed us to land on the Moon. General Relativity proves Newtonian physics is fundamentally false. When Apollo 11 landed, was Newtonian physics **true**?"

  **What to listen for:**
  *   **The "James Won" Crowd:** Will say "Yes, because it worked for the mission." (Instrumentalism).
  *   **The "Peirce Won" Crowd:** Will say "No, because it was destined to be falsified by better inquiry." (Convergent Realism).
  *   **The "They are the same" Crowd:** Will say "It depends what you mean by true." (Call them out: "We spent an hour defining that. Pick one.")
  *   **The Success Condition:** You want someone to say: "For James, it was true *in that context*. For Peirce, it was a *useful falsehood* on the way to the real truth." If they can hold that tension, they got it.

  ### 5. What to Openly Refuse to Cover
  You have one session. Draw a boundary line at the start or whenever these drift in.

  1.  **Neo-Pragmatism (Rorty/Putnam):** Refuse to discuss whether truth is just "what our peers let us get away with." That is Rorty, not James, and it guarantees the "relativist" exit. Keep it 19th-century.
  2.  **Peirce's Categories (Firstness/Secondness/Thirdness):** This is the black hole of Peirce scholarship. If a scientist asks about his metaphysics, say: "That's his engine room, but today we're only looking at the dashboard."
  3.  **The Nature of Reality:** Do not let them debate whether reality exists independent of the mind. Peirce assumes it does (Scholastic Realism); James is agnostic. Debating *that* will eat the hour. Focus on the *method of settling claims*, not the ontology behind them.
