prompt: |-
  Next month I've got one session with a reading group of non-specialists — mostly scientists plus one lawyer — on the Peirce/James disagreement about truth, and every time I've done this people walk out saying "ok so pragmatists think true just means useful," which is James winning by default becuase he's the easier one to remember. Don't explain the debate to me; plan how I should teach it. My hunch is that the first move isn't "here are two theories of truth" but the pragmatic maxim itself, plus the point that Peirce was using it as a method for making concepts clear and may not even have been offering a theory of truth in James's sense at all — tell me if that's the right opening or if it front-loads a fight they can't see yet. What one case should carry the whole session? I was going to build it on the luminiferous ether, a whole community converging on it and then dropping it, but say if that's the wrong carrying example or what it lacks. Then the misconceptions in the order they'll actually surface — that James is a relativist, that "works" means "comforting," that Peirce is just a correspondence theorist with extra steps, that the two are rivals answering one and the same question — and exactly where in the sequence to head each one off. Give me one closing question that would show me whether they got the difference and not just two slogans, and tell me what to openly refuse to cover at this level.
