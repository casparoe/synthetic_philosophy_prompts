answer: |-
  ### The Editorial Decision Procedure: Idea vs. Expression

  This procedure is designed to separate legal liability (infringement) from ethical breaches (plagiarism) and community norms (priority). It forces you to categorize the complaint before reacting.

  **Phase 1: Triage & Categorization**
  *Goal: Determine which of the three claims is actually being made.*

  **Q1: What is the complainant asking for?**
  *   **Control:** "Take it down / Pay me." (Claim: I own this.)
  *   **Credit:** "Name me / Cite me." (Claim: I originated this.)
  *   **Priority:** "Acknowledge I was first." (Claim: My standing is damaged.)
  *   *Action:* Tag the complaint. Most complainants demand all three. You must decide them separately.

  **Phase 2: The Legal Floor (Infringement Check)**
  *Goal: Determine if you are legally exposed. If you pass this, you cannot be sued successfully for copyright.*

  **Q2: Is the similarity in *Idea* or *Expression*?**
  *   **Idea:** Topics, themes, general arguments, facts, standard structures (e.g., "a recipe," "a war story," "a policy critique").
  *   **Expression:** Specific wording, unique narrative sequencing, distinctive metaphors, specific selection and arrangement of data.
  *   *Stop Condition:* If the similarity is only in **Idea**, the claim for **Control** is denied. Ideas are not property. You may proceed to Phase 3 for ethical review, but legally you are clear.
  *   *Proceed Condition:* If the similarity is in **Expression**, proceed to Q3.

  **Q3: Was there *Access*?**
  *   **Definition:** Can the complainant prove your writer saw their work *before* creating theirs? (e.g., submitted pitch, private email, paywalled article, direct meeting).
  *   **Independent Creation:** If there was no access (the work was public but obscure, or the timelines don't match), similarity is coincidence.
  *   *Stop Condition:* If **No Access**, the claim for **Control** is denied. (Independent creation is a complete defense).
  *   *Proceed Condition:* If **Access** is proven, proceed to Q4.

  **Phase 3: The Ethical Ceiling (Plagiarism Check)**
  *Goal: Determine if you violated editorial integrity, even if the law allows it.*

  **Q4: Is the borrowing *Transformative* or *Derivative*?**
  *   **Transformative:** Your writer used the source as a jumping-off point to argue something new, analyze it, or critique it.
  *   **Derivative:** Your writer used the source as a blueprint, following the same logical steps or narrative arc without adding new insight.
  *   *Stop Condition:* If **Transformative**, the claim for **Credit** is weak. You are in dialogue, not debt.
  *   *Proceed Condition:* If **Derivative**, proceed to Q5.

  **Q5: Was *Attribution* given?**
  *   **Check:** Did the published piece link to, cite, or verbally acknowledge the source material?
  *   *Stop Condition:* If **Yes**, the claim for **Credit** is satisfied. The claim for **Priority** should be acknowledged in a note if requested.
  *   *Fail Condition:* If **No**, you have committed **Plagiarism**. This is an ethical breach, even if not legal infringement.

  **Phase 4: The Values Handoff**
  *Goal: Decide when a human must override the machinery.*

  **Escalate to Editor-in-Chief if:**
  1.  **Reputation Risk:** The procedure says "Not Legally Wrong," but the complainant is a major donor, community leader, or frequent contributor. (This is a **Priority** issue, not legal).
  2.  **Process Failure:** The complaint reveals your internal workflow leaked a pitch (e.g., a rejected pitch was shared internally and then assigned).
  3.  **Ambiguity:** The similarity is in "structure" or "tone," which sits on the border of Idea and Expression.

  **Final Decision Matrix:**
  *   **Legal Infringement:** (Expression + Access + No Permission) → **Remove/Retract.**
  *   **Ethical Plagiarism:** (Derivative + Access + No Credit) → **Correct/Add Note/Apologize.**
  *   **Idea Coincidence:** (Idea Only OR No Access) → **Reject Control Claim.** (Optional: Acknowledge Priority as a courtesy).

  ***

  ### Running the Procedure on Three Cases

  #### Case 1: The Freelancer Pitch
  **Scenario:** A freelancer sends you an unpublished pitch with a specific thesis. You reject it. Two months later, you run a commissioned piece from a different writer with the same thesis.
  **Procedure Run:**
  1.  **Categorize:** Complainant wants **Control** (don't publish) and **Priority** (I pitched it first).
  2.  **Legal Floor:**
      *   *Idea vs. Expression:* A thesis is an **Idea**. Unless the second writer used the freelancer's specific outline or phrasing, this is not expression. → **Control Denied.**
      *   *Access:* Yes, they sent it to you.
  3.  **Ethical Ceiling:**
      *   *Transformative vs. Derivative:* If your commissioned writer arrived at the thesis independently, it's transformative/parallel. If you gave the rejected pitch to the second writer and said "do this," that is a process failure.
      *   *Attribution:* You cannot attribute an unpublished pitch.
  4.  **Values Handoff:** **Escalate.**
      *   *Reason:* While legally you own the right to publish the *idea*, industry norm suggests you should not assign a pitch you rejected to a new writer immediately if the angle is identical. It signals bad faith.
  **Verdict:** **Not Legally Wrong, but Process Error.**
  **Action:** Do not retract. However, apologize to the freelancer for the overlap, explain that ideas are not exclusive, and review internal rules about "quarantining" rejected pitches for a set period.

  #### Case 2: The Academic Argument
  **Scenario:** An academic publishes a paper. Your staff writer reads it, writes an essay that follows the exact same logical progression and uses the same examples, but rewords every sentence. No citation is included.
  **Procedure Run:**
  1.  **Categorize:** Complainant wants **Credit**.
  2.  **Legal Floor:**
      *   *Idea vs. Expression:* Arguments are generally **Ideas**. However, the *specific selection and arrangement* of points can be **Expression**.
      *   *Access:* Yes, the paper was published.
  3.  **Ethical Ceiling:**
      *   *Transformative vs. Derivative:* **Derivative.** The writer used the source as a blueprint.
      *   *Attribution:* **No.**
  4.  **Values Handoff:** Not needed. The procedure flags this clearly.
  **Verdict:** **We Are In The Wrong.**
  **Action:** This is plagiarism. Even if copyright law might not protect the argument itself, editorial ethics require you to credit the source of the reasoning. Publish a correction note linking to the academic's work. If the structural copying is severe, consider an editor's note acknowledging the debt.

  #### Case 3: The Photographer's Composition
  **Scenario:** A photographer claims you infringed their copyright because your illustrator drew a scene with the same camera angle, lighting, and subject placement as the photographer's famous image.
  **Procedure Run:**
  1.  **Categorize:** Complainant wants **Control**.
  2.  **Legal Floor:**
      *   *Idea vs. Expression:* In photography, the *image* is expression. The *composition* (angle, lighting, pose) is often treated as an **Idea** or *scène à faire* (standard elements required to depict a subject). You cannot copyright a view or a pose.
      *   *Access:* Likely yes, if the image is famous.
  3.  **Ethical Ceiling:**
      *   *Transformative vs. Derivative:* An illustration is a different medium. Unless it traces the photo, it is usually considered transformative interpretation.
      *   *Attribution:* Standard practice does not require crediting a photo that inspired a drawing unless it was a direct reference.
  4.  **Values Handoff:** **Escalate** only if the image is iconic enough that the similarity looks like a cheap knock-off, damaging brand reputation.
  **Verdict:** **Not Wrong.**
  **Action:** Reject the complaint. Explain that copyright protects the specific image, not the viewpoint or composition. Unless the illustration traces the photo, it is independent expression.

  ***

  ### What This Procedure Cannot Do

  1.  **Stop Lawsuits:** This procedure minimizes risk, but anyone can sue for anything. If a complainant threatens legal action, you must consult a lawyer. This tool is for editorial decisions, not legal defense.
  2.  **Satisfy Bad Faith Actors:** Some people believe they own ideas. No amount of logic will convince them. This procedure gives you the confidence to say "no" firmly, but it will not make them happy.
  3.  **Measure "Vibe" Theft:** Sometimes a piece *feels* stolen because the tone or voice is similar. Voice is not protectable. This procedure will tell you that you are in the clear, even if the accusation feels uncomfortable. You must use the **Values Handoff** to decide if protecting a relationship is worth more than being technically right.
  4.  **Fix Broken Workflows:** If Case 1 happens repeatedly, the procedure will tell you it's a "Process Error," but it won't fix your pitch tracking system. You need a separate administrative fix for that.
