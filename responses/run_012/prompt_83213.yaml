      *   This implies the Archive contains *definitions* in tokens, not just logs.
      *   *Adjustment:* In Phase 1, allow Senders to create a "Key" (e.g., Token A = Token B + Token C). No, that complicates it.
      *   *Simpler:* The Archive contains the history of successful matches. "When I sent 'XQZ', you picked Shape 1."
      *   The Late Receiver sees: "XQZ -> Shape 1". But they don't know what Shape 1 *is* without the perceptual link.
      *   *Wait, if the Late Receiver sees the shape...*
      *   *Crucial Detail:* The Late Receiver must identify a *new* shape using the code.
      *   *Scenario:*
          1.  Train on Shapes 1-5.
          2.  Test on Shape 6.
          3.  Sender knows Shape 6 maps to Token 'Z'.
          4.  Archive says "Z = Shape 6".
          5.  Late Receiver sees 6 shapes. Which is Shape 6? The Archive doesn't say. The Archive just says "Z matches the one that looks like [no description]".
          6.  *Ah, the "Dictionary goes in circles" point:* The Archive defines tokens using *other tokens*, not shapes.
          7.  *Modification:* Allow Senders to define tokens using other tokens in the log? No, that's too hard for 90 mins.
          8.  *Better interpretation of the prompt:* The Archive records the *correlations*. The Late Receiver sees the correlation but lacks the *causal link* to the referent.
          9.  *Actually, the prompt says:* "Archivist who sees only the token strings and never a shape."
