      *   *Okay, this logic holds.* The Archivist has syntax without semantics. The Observer has semantics via ostension/causality.

  5.  **Refining the Limitations:**
      *   The activity shows *reference* grounding, not *phenomenal* grounding.
      *   It doesn't prove the Late Receiver *understands*, only that they perform better.
