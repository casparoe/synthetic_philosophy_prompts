      *   *Alternative (Easier):* The Archivist records the *success history*. "BIP worked on Shape A." Late Receiver sees 6 shapes. They don't know which is Shape A. The Archive is useless without the perceptual link.
      *   *Let's stick to the Prompt's specific instruction:* "Archivist who sees only the token strings and never a shape."
