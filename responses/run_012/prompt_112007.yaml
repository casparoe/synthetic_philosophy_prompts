prompt: |-
  so my reading group has been going through the experimental philosophy stuff on cross-cultural variation in intuitions — the trolley cases, the side-effect cases, the ones where you get different answers depending on who you ask — and one guy keeps insisting it's just like language. Everyone has different surface grammar, different word order, different sounds, but underneath theres a universal grammar doing the real work, so the differences are shallow and don't threaten anything. He uses this to tell us we shouldn't get worked up about cultural variation in intuitions: same deal, deep universal competence, shallow performance noise, everyone's basically running the same machinery.

  I want to know how far that analogy actually holds. Give me the correspondence table — what plays the role of universal grammar, what's the surface variation, what's the input, what's the poverty-of-stimulus bit if there even is one — and then tell me where the mapping breaks. Be specific about which breaks matter for what he's using it for: if it fails somewhere that has nothing to do with his conclusion, say so and move on, but if the conclusion was riding on the analogy the whole time I want that flagged. Does the reassurance survive once the disanalogies are on the table, or was the analogy carrying the whole argument? And if there's a better analogy for whats actually going on with cross-cultural intuition variation, give me that instead.

  American English please. And don't just tell me the debate has two sides — I want the mapping actually laid out.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A reading group discussing experimental philosophy (x-phi) on cross-cultural variation in intuitions (trolley problems, side-effect cases, etc.).
      *   **The Opponent:** One group member argues that intuition variation is like language variation (Chomskyan Universal Grammar). Surface differences, deep universal competence. Therefore, variation doesn't threaten philosophical methodology (reliance on intuitions).
      *   **The Task:**
          1.  Create a correspondence table (Language vs. Intuition).
          2.  Identify where the mapping breaks (disanalogies).
          3.  Evaluate if the breaks matter for the opponent's conclusion (that we shouldn't worry about variation).
          4.  Determine if the reassurance survives or if the analogy was doing all the work.
          5.  Suggest a better analogy if applicable.
      *   **Tone/Style:** American English, specific, no fence-sitting ("don't just tell me the debate has two sides"), lay out the mapping clearly.

  2.  **Deconstruct the "Language Analogy" (The Competence/Performance Distinction):**
      *   *Chomskyan View:* Humans have an innate Language Acquisition Device (LAD) / Universal Grammar (UG). Surface languages (English, Japanese) vary, but deep structures are shared. Performance errors (slips of the tongue) don't reflect competence.
      *   *X-Phi Application:* Humans have an innate "Moral Grammar" or "Intuitive Competence." Cultural answers vary (surface), but deep moral principles are shared. Survey noise/cultural framing is "performance."
      *   *Goal of Analogy:* Defend the use of intuitions in philosophy. If deep competence is universal, the philosopher's own intuitions (usually WEIRD - Western, Educated, Industrialized, Rich, Democratic) are a valid probe of that universal competence, even if others give different surface answers.

  3.  **Drafting the Correspondence Table:**
      *   *Universal Grammar* $\rightarrow$ Universal Moral/Conceptual Competence (innate cognitive machinery).
      *   *Surface Grammar (Parameter Setting)* $\rightarrow$ Cultural/Individual Intuition Reports (e.g., "Push the fat man" vs. "Don't push").
      *   *Input (Primary Linguistic Data)* $\rightarrow$ Socialization/Cultural Norms/Upbringing.
      *   *Poverty of the Stimulus* $\rightarrow$ The claim that people judge cases they haven't been explicitly taught about (e.g., novel trolley variants).
      *   *Performance Errors* $\rightarrow$ Survey noise, confusion, framing effects, cognitive load.

  4.  **Identifying the Breaks (Disanalogies):**
      *   *Break 1: Convergence vs. Divergence.* Language acquisition converges (kids end up speaking the local language fluently). Intuition surveys often *diverge* systematically (East vs. West, Socioeconomic status). It's not just noise; it's structured variation.
      *   *Break 2: The Nature of the "Data".* Linguistic intuitions (grammaticality judgments) are usually stable within a speaker. Philosophical intuitions are notoriously fragile (framing effects, order effects).
      *   *Break 3: Normativity.* Language is descriptive (is this sentence grammatical?). Philosophy is often normative (is this action *wrong*?). Universal grammar explains how we *do* speak, not necessarily how we *should* judge.
      *   *Break 4: Expertise.* Linguists rely on native speaker competence. Philosophers rely on... themselves? If variation is real, whose competence counts?
      *   *Break 5: Poverty of the Stimulus.* In language, kids know things they couldn't have learned. In x-phi, do people know things they couldn't have learned, or are they just applying learned cultural heuristics?

  5.  **Evaluating the Impact on the Conclusion:**
      *   *The Opponent's Conclusion:* "Don't get worked up. Deep machinery is the same. Variation is shallow."
      *   *Does the break matter?* Yes. If the variation is systematic (cultural parameters) rather than random (performance noise), then the "deep machinery" might not be producing a *single* universal output. It might be producing *different* outputs based on cultural tuning.
      *   *Crucial Point:* In language, UG + Environment = Specific Language. In morality/intuition, if Environment = Different Moral Truths (or different conceptual schemes), then the philosopher's intuition isn't a privileged access to *The Truth*, just *Their Truth*.
      *   *Verdict:* The analogy is doing *all* the work. Without the assumption that intuition variation is merely "performance noise" (like slips of the tongue), the defense collapses. But evidence suggests it's more like "parameter setting" (deep variation), which undermines the idea that one group's intuitions are the default.

  6.  **Finding a Better Analogy:**
      *   *Visual Perception?* (Illusions). Everyone sees the Müller-Lyer illusion, but some cultures don't. Still biological.
      *   *Taste/Food?* (Innate preference for sweet/fat, but cultural cuisine varies). Good for "constrained variation."
      *   *Immune System?* (Universal mechanism, different antibodies based on exposure).
      *   *Best Fit:* **Folk Biology / Folk Psychology.** Or **Color Terminology.**
      *   *Actually, the "Taste" analogy is strong:* Everyone has taste buds (universal machinery). Some like spicy, some don't (cultural variation). You can't argue someone out of liking spicy food, but you can discuss ingredients.
      *   *Better yet:* **The "Legal Code" Analogy.** Universal need for rules (UG), but specific laws vary wildly. You can't derive Specific Law A from Universal Need for Order.
      *   *Selection:* **Folk Biology** or **Color Perception** are standard in x-phi. Let's go with **Color Perception**. It captures the biological constraint + cultural categorization aspect better than language. Everyone sees the spectrum (biology), but where "blue" ends and "green" begins varies (culture). This undermines the idea that one categorization is "correct."

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, check the "Poverty of the Stimulus" in X-Phi.* Marc Hauser and John Mikhail tried to push the "Moral Grammar" hard. But the empirical results (Knobe effect, trolley variations) show variation that looks more like *different parameter settings* than *performance errors*.
      *   *Key Distinction:* In language, if I say "The cat sleep," you know I made a performance error or haven't mastered English. In trolley cases, if a Westerner says "Switch track" and an Easterner says "Don't touch," neither is clearly making a "mistake" in the linguistic sense. They are expressing different values.
      *   *Conclusion:* The analogy fails where it matters most: the *normative status* of the variation.

  8.  **Drafting the Response (incorporating the constraints):**
      *   *Tone:* Direct, analytical, American English.
      *   *Structure:* Table first, then Breaks, then Impact on Conclusion, then Better Analogy.
      *   *Constraint Check:* "Don't just tell me the debate has two sides." I need to take a stance on the strength of the analogy.

  9.  **Final Polish:** Ensure the distinction between *Competence* (what you know) and *Performance* (what you say) is clear, as that's the core of the friend's argument. Emphasize that if the variation is *Competence* variation (different deep rules), the friend loses.

  *(Self-Correction during drafting)*: Make sure to explicitly address the "Poverty of the Stimulus" point. In language, it proves innateness. In x-phi, does it prove innateness or just hidden cultural learning? Most critics say the latter.

  10. **Final Review against Prompt:**
      *   Correspondence table? Yes.
      *   Where mapping breaks? Yes.
      *   Does it matter for the conclusion? Yes.
      *   Better analogy? Yes.
      *   American English? Yes.
      *   No fence-sitting? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Here is the breakdown of the analogy, where it cracks, and why your friend's reassurance is likely misplaced.

  ### 1. The Correspondence Table

  Your friend is leaning on the Chomskyan distinction between **Competence** (the underlying mental machinery) and **Performance** (what actually comes out of your mouth in a specific moment). He is arguing that cross-cultural intuition differences are performance errors, not competence differences.

  | Linguistic Domain (Chomsky) | Experimental Philosophy Domain (The Analogy) |
  | :--- | :--- |
  | **Universal Grammar (UG)** | **Universal Moral/Conceptual Competence** (Innate cognitive machinery for causality, agency, normativity). |
  | **Surface Grammar** (English vs. Japanese word order) | **Intuition Reports** ("Push the fat man" vs. "Don't push," or "Intentional" vs. "Unintentional"). |
  | **Parameter Setting** (Binary switches set by environment) | **Cultural Norms/Upbringing** (Individualism vs. Collectivism tuning the moral machinery). |
  | **Primary Linguistic Data** (Input child hears) | **Socialization** (Stories, laws, religious teachings, peer reinforcement). |
  | **Poverty of the Stimulus** (Kids know rules they couldn't have learned from input) | **Novel Cases** (Judging trolley problems they've never encountered before). |
  | **Performance Error** (Slip of the tongue, memory lapse) | **Survey Noise** (Confusion, framing effects, cognitive load, mistranslation). |
  | **Grammaticality Judgment** ("Does this sentence sound right?") | **Philosophical Intuition** ("Does this action feel wrong?") |

  ### 2. Where the Mapping Breaks

  The analogy holds up structurally, but it falls apart empirically and normatively. Here are the three critical breaks.

  **Break 1: Convergence vs. Divergence**
  *   **Language:** When children are exposed to a specific language, they *converge* on the same grammar. If you take 100 American kids, they all settle on English SVO (Subject-Verb-Object) structure. Variation is minimal and usually corrected.
  *   **Intuitions:** In x-phi studies, adults *diverge* systematically. It's not that Eastern participants are "failing" to converge on the Western answer; they are consistently converging on a *different* answer. In language, if you say "I goes," that's a performance error. In trolley cases, if Group A says "Save the five" and Group B says "Don't intervene," both are stable, systematic outputs. This looks less like a slip of the tongue (performance) and more like a different parameter setting (competence).

  **Break 2: The Status of the "Data"**
  *   **Language:** Linguistic intuitions are generally robust. If I ask a native speaker if "Colorless green ideas sleep furiously" is grammatical, they say yes, consistently, across time and framing.
  *   **Intuitions:** Philosophical intuitions are notoriously fragile. They shift based on order effects, wording, and even the cleanliness of the room. If the "data" of philosophy is this noisy, positing a precise "Universal Moral Grammar" underneath is a much heavier lift than positing UG. The signal-to-noise ratio in x-phi is far worse than in syntax.

  **Break 3: Normativity vs. Descriptivism**
  *   **Language:** UG explains how we *do* speak. It doesn't tell us which language is *better*.
  *   **Intuitions:** Philosophy is often normative. We want to know what is *actually* right, not just what people *feel* is right. If the "Universal Competence" produces different outputs in different cultures, you can't use one group's output (usually WEIRD: Western, Educated, Industrialized, Rich, Democratic) as the benchmark for truth. In language, there is no "true" grammar. In ethics/metaphysics, philosophers act as if there is.

  ### 3. Does the Reassurance Survive?

  **No. The analogy is carrying the entire argument, and it collapses under the weight of the first break.**

  Your friend's conclusion is: *"Don't get worked up. The differences are shallow performance noise. We are all running the same machinery, so my intuitions are as good a probe as anyone else's."*

  This conclusion only works if the variation is **Performance Error**.
  *   If the variation is **Performance Error**: Then yes, dig deep enough and we all agree. The philosopher's intuition is a valid probe of the universal core.
  *   If the variation is **Competence Variation** (Parameter Setting): Then the "machinery" is universal, but the *settings* are part of the machinery's operation. If the machinery outputs "Utilitarian" in one culture and "Deontological" in another based on environmental input, then there is no culture-neutral "philosophical intuition" to be had.

  **Why this kills the argument:**
  In Chomskyan linguistics, if you find a population that systematically uses a different word order, you don't say they are making performance errors. You say their parameters are set differently.
  If x-phi variation is like parameter setting, then the Western philosopher's intuition is not "Universal Competence." It is "Western Parameter Setting."

  If your friend admits the variation is deep (competence), he admits that philosophical intuitions are culturally relative. If he insists they are shallow (performance), he is ignoring the data which shows stable, replicated cultural differences. He is using the language analogy to *define away* the problem rather than solve it. He's saying, "This variation *must* be performance, because in language, variation is performance." But there is no evidence that moral intuition works exactly like syntax.

  **Verdict:** The reassurance does not survive. The analogy was doing 100% of the work. Once you acknowledge that intuition variation looks more like dialectal divergence than speech errors, the claim that "we're all basically running the same machinery" becomes trivial. Yes, we all have brains, but if the brains are calibrated differently, the calibration matters for the truth claim.

  ### 4. A Better Analogy: Color Perception

  If you want an analogy that actually fits the data better, drop language and use **Color Terminology**.

  | Domain | Correspondence |
  | :--- | :--- |
  | **Visual Cortex** | **Universal Moral/Cognitive Machinery** (Everyone has the same hardware). |
  | **Light Spectrum** | **The World/Actions** (The objective reality hitting the sensors). |
  | **Color Categories** (Blue vs. Green) | **Moral Categories** (Intentional vs. Side-effect; Permissible vs. Forbidden). |
  | **Cultural Variation** | Some cultures have one word for blue/green; others have two. |

  **Why this is better:**
  1.  **It acknowledges biology:** Everyone has the same eyes (universal competence).
  2.  **It acknowledges variation:** People literally carve up the spectrum differently based on language/culture.
  3.  **It undermines the "Truth" claim:** If a Russian speaker distinguishes light blue (*goluboy*) and dark blue (*siniy*) as distinct colors, and an English speaker does not, neither is "wrong" about the physics of light. But they *do* have different perceptual experiences.

  **The Lesson for your Group:**
  Using the Color Analogy, you can tell your friend: "Okay, maybe we all have the same moral eyes. But that doesn't mean we're seeing the same colors. If my culture taught me to lump 'harm' and 'intent' together, and yours taught you to separate them, we aren't making performance errors. We are categorizing the world differently. And if philosophy is about finding the *correct* categorization, pointing at my retina isn't going to solve it."

  This shifts the debate from "Is the machinery broken?" (No) to "Is the calibration privileged?" (Probably not). That is the actual threat x-phi poses to traditional methodology, and the language analogy tries to hide it. The color analogy exposes it.
