  I'm trying to get my head round Hume's essay Of Tragedy (the one in his Essays Moral, Political, and Literary, 1757-ish). The bit I'm stuck on is where he asks why the same rhetorical skill that would make a real disaster unbearable makes a staged one delightful. I'm paraphrasing, but the gist is that the painful passions stirred by the poetry — sorrow, terror, anxiety — get converted into pleasure by the predominant passion of the audience, so the eloquence doesn't just add pleasure on top, it transforms the pain. He also brings in Cicero's account of the conspirators and the way the horror of the story is swallowed by the pleasure of the telling. Can you help me understand what this converstion is supposed to be, exactly? Is it a psychological mechanism, a claim about how passions combine, or just a redescription of the paradox? And does it actually solve the problem, or does it just push it back a step? I want a proper philosophical unpacking, not just a summary.

  Please write in American English. Structure it as: 'What Hume is up to' (about 150 words), 'The conversion mechanism' (about 300 words), 'Does it solve the paradox?' (about 250 words), and 'Confidence and least sure point' (about 100 words). In that last section, say how confident you are in what you've claimed and single out the point you're least sure of.
