answer: |-
  ### Diagnostic Cases: The Space of Explanations

  Before we construct the decision tree, we must isolate the specific intuitions that separate these philosophical positions. As a novelist, you are not testing subjects in a lab; you are testing your own narrative instinct and the coherence of your chapter. Consider the following five scenarios. Your reaction to them constitutes the data for the tree.

  1.  **The Standard CEO:** An executive pursues profit, knowing it will harm the environment. He says, 'I don't care about the harm.'
      *   *Intuition:* Most say he harmed it *intentionally*.
  2.  **The Helpful CEO:** An executive pursues profit, knowing it will *help* the environment. He says, 'I don't care about the help.'
      *   *Intuition:* Most say he helped it *unintentionally*.
  3.  **The Forbidden Good:** An executive pursues profit, knowing it will help the environment, but helping the environment is *forbidden* by a strict corporate norm (perhaps due to sanctions). He helps it anyway.
      *   *Intuition:* If you say this is *intentional*, you lean towards Norm-Violation. If you say *unintentional* (because it was good), you lean towards Badness.
  4.  **The Cancellation Test:** A narrator says, 'He intentionally harmed the neighbourhood, but he is not to blame for it.'
      *   *Intuition:* If this sounds contradictory (like saying 'He is a bachelor but married'), the concept is constitutive. If it sounds acceptable (like 'He opened the door but didn't mean to'), it is pragmatic.
  5.  **The Excused Agent:** The executive harms the neighbourhood, but he is coerced or insane (no moral blame possible).
      *   *Intuition:* Do we still call the harm *intentional*? If yes, the concept tracks the act's nature. If no, the concept tracks the utility of blaming.

  ***

  ### The Decision Tree

  Follow the path dictated by your strongest narrative intuition. Answer the questions as they apply to the world of your novel.

  **Node 1: The Error Check**
  When your readers judge that the executive harmed the neighbourhood *intentionally* (in the Standard CEO case), do you feel they are making a **conceptual mistake**, or are they correctly applying the **rules of our language**?
  *   *Option A:* They are making a mistake. The strict definition of 'intentional' relies only on belief and desire; moral colouring is a distortion.
      *   **→ LEAF 1: The Debunking/Bias View.** (The asymmetry is a performance error to be explained away.)
  *   *Option B:* They are correctly applying the rules. The asymmetry reveals how the concept actually works.
      *   **→ Go to Node 2.**

  **Node 2: The Norm Check**
  Imagine the **Forbidden Good** case (Scenario 3 above). The executive brings about a *beneficial* side effect, but doing so violates a standing norm or rule. Does your narrator describe this beneficial act as **intentional**?
  *   *Option A:* Yes. It does not matter that the outcome was good; what matters is that he broke a rule he knew about.
      *   **→ LEAF 2: The Norm-Violation View.** (It is norm-breaking, not badness, that drives the asymmetry.)
  *   *Option B:* No. Because the outcome was good, it remains unintentional, even if a norm was brushed aside. The driver is specifically *badness* or *blameworthiness*.
      *   **→ Go to Node 3.**

  **Node 3: The Linguistic Check**
  Perform the **Cancellation Test** (Scenario 4). In your prose, can you write: *'He intentionally brought about the harm, though he bears no moral blame for it'* without the sentence sounding contradictory or nonsensical?
  *   *Option A:* Yes, it sounds fine. The word 'intentionally' describes the psychology; the blame is a separate addition we usually infer.
      *   **→ LEAF 3: The Conversational Implicature View.** (The folk concept is not normative; morality is just pragmatically implied.)
  *   *Option B:* No, it sounds wrong. To call it 'intentional' just *is* to lodge a moral complaint.
      *   **→ Go to Node 4.**

  **Node 4: The Source Check**
  In the **Standard CEO** case, *why* does the narrator ascribe intent? Is it because the harm reveals the executive's **deep attitudes** (he is a bad person who didn't care), or is it because the **harm itself** forces the categorisation regardless of his deeper character?
  *   *Option A:* It is about his attitudes. We call it intentional because his indifference reveals a 'Deep Self' that is aligned with the harm, making him a proper target for blame. We ascribe intent *in order to* hold him responsible.
      *   **→ LEAF 4: The Blame-First View.** (Intent ascription is downstream of moral responsibility.)
  *   *Option B:* It is about the act's moral quality. The badness of the harm penetrates the very definition of the action, regardless of whether we are currently seeking to blame him.
      *   **→ LEAF 5: The Normative Concept View.** (The folk concept of intentional action is itself morally laden.)

  ***

  ### Map of the Terrain: Leaves and Empty Spaces

  Here is how the positions distribute, along with the limitations of this instrument.

  #### The Leaves
  1.  **The Debunking/Bias View:** You treat the asymmetry as a bug in human cognition. In your chapter, the executive might be technically correct (he didn't intend the harm), but the neighbours are psychologically compelled to misunderstand him. The tragedy is one of miscommunication.
  2.  **The Norm-Violation View:** You treat the asymmetry as a reaction to rule-breaking. If your executive violates a social norm, even for a good result, the narrative treats it as intentional. The moral weight rests on *transgression*, not *suffering*.
  3.  **The Conversational Implicature View:** You treat 'intentionally' as psychologically neutral. The moral weight comes from the context, not the word. The executive can truthfully say 'I didn't do it intentionally' while the neighbours truthfully hear 'I am not accepting blame'. The conflict is linguistic.
  4.  **The Blame-First View:** You treat intent as a tool for responsibility. The narrative ascribes intent *because* the character deserves blame. If you remove the blame (e.g., he was ignorant), the intent vanishes from the narrative description.
  5.  **The Normative Concept View:** You treat intent as inherently moral. The narrative cannot describe the act as 'intentional harm' without already condemning it. The executive's insistence that he 'never intended it' is not just a lie, but a category error.

  #### Indistinguishable Leaves
  **Blame-First vs. Normative Concept.**
  Be warned: Node 4 is the finest filter in this tree. In practice, the **Blame-First View** and the **Normative Concept View** often predict the same judgements in standard cases. Both agree that bad side effects are called intentional. They differ on the *mechanism* (is morality a precondition or a consequence?).
  *   *Flag:* If you find Node 4 impossible to answer because both options feel true, you may treat these leaves as a single cluster: **The Moralised Intent Cluster**. For the purposes of your novel, the dramatic effect is identical: you cannot separate the description of the act from the judgement of the agent.

  #### Unoccupied or Incoherent Combinations
  1.  **Debunking + Normative Concept:** This combination is **incoherent**. If the concept of intentional action is *truly* normative (Leaf 5), then the asymmetry is correct usage, not a bias or error (Leaf 1). You cannot hold that the folk are both right about their own concept and wrong about reality simultaneously in this context.
  2.  **Implicature + Norm-Violation:** This combination is **unexplored/unattractive**. The Implicature view suggests the semantic content is purely psychological (belief/desire). The Norm-Violation view suggests the trigger is social rule-breaking. While one *could* argue that we pragmatically imply intent when norms are violated, most proponents of Implicature stick to standard Gricean maxims regarding relevance and blame, not norm-violation specifically.
  3.  **Debunking + Blame-First:** This is **possible but rare**. One could argue that people *try* to use intent to assign blame (Blame-First mechanism) but that this is a mistake because the true concept is neutral (Debunking conclusion). However, most Debunkers argue the error is cognitive bias, not a strategic desire to blame.

  #### A Note on the Corporate Agent
  You mentioned the possibility of a corporate agent. None of the leaves above are strictly separated by this variable. However, if you find the asymmetry *disappears* when the agent is a corporation (e.g., 'The Company harmed the environment' feels different than 'The CEO harmed...'), this supports the **Deep Self/Blame-First** view (Leaf 4). This view relies on the agent having a 'self' to judge; corporations lack a psychological deep self, so the mechanism should fail. If the asymmetry remains robust for corporations, it supports the **Normative Concept** (Leaf 5) or **Norm-Violation** (Leaf 2) views, which rely on the act or the rule, not the psychology.

  ### How to Use This Instrument
  Do not treat this as a test you must pass. Treat it as a tuning fork. Strike it against your manuscript. If you find yourself answering Node 3 with 'It sounds contradictory,' but your editor insists it sounds fine, you have located the precise fault line in your chapter's moral architecture. That friction is where the story lives.
