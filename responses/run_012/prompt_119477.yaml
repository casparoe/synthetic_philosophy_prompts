answer: |-
  **INACTION INDEMNITY CORP.**
  **Policyholder Handbook & Claims FAQ (Rev. 9.4)**

  **Welcome to Coverage for What You Didn't Do**
  Inaction Indemnity Corp. provides unique liability protection for harms resulting exclusively from your failure to act. While traditional insurers cover what you cause, we cover what you allow. This document outlines adjudication standards.

  **Frequently Asked Questions**

  **1. What qualifies as a covered omission?**
  A covered omission is the absence of a muscular contraction that would have prevented a loss, provided you had a duty to contract said muscles. If you were sleeping, standing still, or thinking, you are omitting. If you were walking, talking, or blinking, you are acting, and coverage may be voided.

  **2. How do you determine if my inaction caused the harm?**
  We apply the Counterfactual Prevention Test. We ask: "If the policyholder had acted, would the harm be prevented?" If yes, the omission caused the harm. If the harm was inevitable regardless of intervention, the omission is deemed non-causal.

  **3. There are infinite things I didn't do every second. Which one is covered?**
  We utilize the Proximity of Nullity Rule. Among the countless things you did not do, we select the omission temporally nearest to the loss. For example, if you did not brake and did not sing opera, only the failure to brake is considered causal.

  **4. Is breathing an action?**
  Yes. Breathing involves diaphragmatic contraction. If you were breathing during the incident, you were acting. Coverage requires pure non-action. However, if you held your breath, you are omitting breath, which may be covered if a duty to breathe existed.

  **Worked Example: Adjudication of Claim #882-B**
  *Incident:* Policyholder stood on a platform while a pedestrian fell past. Policyholder did not grab the pedestrian.
  *Claim:* Pedestrian seeks damages for Policyholder's failure to grab.
  *Adjudication:* **DENIED.**
  *Reasoning A:* Surveillance shows Policyholder was inhaling at the time of the fall. Inhalation is an action. Since the Policyholder acted, they could not simultaneously omit. Coverage requires total non-action.
  *Reasoning B:* Expert reconstruction indicates the pedestrian was falling too fast to be caught. Therefore, the Policyholder's failure to grab did not cause the injury, as the injury was inevitable regardless of the omission.
  *Note:* Both Reasoning A and Reasoning B apply cumulatively to ensure comprehensive risk management.

  **Sample Claims Table**

  | Claim Description | Status | Adjudication Logic |
  | :--- | :--- | :--- |
  | Failed to water neighbor's plants | **Approved** | No muscular contraction occurred; duty existed. |
  | Failed to stop fight while driving away | **Denied** | Driving is an action; omission precluded by motion. |
  | Failed to prevent own birth | **Denied** | Harm was inevitable; omission non-causal. |
  | Did not shout warning while sleeping | **Approved** | Sleep is a state of non-action; duty established by locale. |

  **Terms and Conditions of Coverage**

  Coverage is strictly limited to liabilities where the Policyholder's omission is the proximate cause of loss. Inaction Indemnity Corp. operates on the principle that nullity is a causal force. Should legal or scientific consensus determine that omissions cannot physically cause events, this policy shall automatically indemnify the Policyholder for the state of having been non-causal, ensuring the product retains value even if causation is deemed impossible for non-actors.

  In cases of overdetermination, where multiple parties omit necessary actions, causality is assigned to the party whose omission was last in time. If two parties omit simultaneously, neither is deemed to have caused the harm, as the presence of another omitting party dilutes the causal weight of the nullity.

  Actions are defined as voluntary muscular contractions. Failures to prevent are defined as the absence of such contractions. This distinction holds even if the action could be redescribed as a failure to prevent a different outcome; for policy purposes, motion is action, and stillness is omission. We do not accept the argument that action is merely a subset of prevention.

  Coverage activates only where a recognized duty to act exists. In the absence of statutory duty, the Company will assess whether a reasonable person would expect action. It is the existence of this duty, rather than the physical mechanics of causation, that establishes the link between the Policyholder and the loss. If no duty exists, the omission is legally invisible and cannot be covered. Inevitable harms are excluded. Policyholders must prove they could have prevented the loss to claim they caused it by not preventing it.
