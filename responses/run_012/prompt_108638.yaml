answer: |-
  You have not assembled a phantom; you have located a precise seam in the philosophy of mind and action where the stitching is still loose. Your friend is referring to **Bas van Fraassen's Reflection Principle**, but their application of it is incomplete. Your character is not irrational; she is exploiting the principle's necessary proviso.

  There is no single, canonical noun that captures this exact configuration in the way "Oedipus Complex" captures a specific psychological knot. However, the components are well-mapped. To give you the "thing itself" and the "line" you requested, we must assemble three existing concepts and then propose a term for their intersection.

  ### 1. The Friend's Principle: The Reflection Principle
  Your friend is citing the **Reflection Principle** (1984). In its simplest form, it states that your current belief in a proposition should match your expectation of your future belief in that proposition. If you know that tomorrow you will believe $X$ with 90% confidence, you should believe $X$ with 90% confidence now. To do otherwise is to invite a "Dutch Book"—a set of bets that guarantees your loss. It is considered a norm of diachronic rationality (rationality across time).

  **The Proviso:** The Reflection Principle holds *only conditional on the assumption that your future self is rational and fully informed.* If you have reason to believe your future self will be drunk, coerced, or cognitively degraded, you are *required* by rationality to discount their future opinion.

  Your character stands exactly on this proviso. She anticipates that her future self will have *more* evidence (she wakes up knowing what happened at breakfast) but *less* competence (she is pliant, tired, eager for love). She treats her future self not as a rational agent, but as a compromised one. Therefore, violating the Reflection Principle is not inconsistent; it is the only consistent move available to her.

  ### 2. The Mechanism: Willpower as Resistance to Reconsideration
  You distinguish this from a Ulysses contract. A standard Ulysses contract (Jon Elster, 1979) binds *action* (tying oneself to the mast). Your character binds *judgment*.

  The philosopher **Richard Holton** (in *Willpower* and related papers) offers the closest mechanism. He argues that willpower is not merely strength of desire, but a **policy of not reconsidering**. When you make a resolution, you are not just predicting action; you are closing off the deliberative process. You are saying, "I will not reopen this question even if new reasons appear."

  Your character applies Holton's model of *practical* willpower to *epistemic* judgment. She is not just refusing to act on new feelings; she is refusing to *weigh* them. She is treating her beliefs as policies rather than as passive reflections of evidence.

  ### 3. The Gap: Epistemic Precommitment
  There is a body of work on **Epistemic Precommitment**, but it usually concerns binding oneself to *gather* evidence (e.g., "I will not check the stock price until Friday") or binding oneself to *ignore* evidence (e.g., "I will not listen to the prosecutor's opening statement").

  Your character is doing something rarer: she is binding the *verdict*. She is engaging in **Doxastic Self-Binding** (binding belief) based on **Anticipated Epistemic Degradation**. Most philosophy assumes that if you have more evidence, you *should* update. Your character posits that the *weighting function* applied to that evidence is variable and liable to corruption.

  ### The Proposed Term: Epistemic Trusteeship
  Since no single term captures the specific nuance of "binding future judgment due to anticipated competence loss rather than evidence loss," I propose you use the term **Epistemic Trusteeship**.

  **Definition:** *Epistemic Trusteeship* occurs when a temporal self (the Trustor) deliberately restricts the belief-formation processes of a future self (the Trustee), not because the Trustee will lack evidence, but because the Trustor anticipates the Trustee will lack the *capacity to weigh that evidence impartially.*

  **The Line (Sorting the Cases):**
  To use this term sharply, here is the boundary that separates *Epistemic Trusteeship* from similar phenomena:

  *   **Inside the Line (Epistemic Trusteeship):**
      *   **The Ledger Ruling:** "Whatever I conclude about my brother before breakfast is not to be trusted after it."
      *   **Why:** The future self has *more* data (breakfast happened) but is deemed *less competent* (morning tenderness is a mood). The binding is on the *conclusion*, not the data intake.
      *   **Rationality:** Rational, provided the anticipation of incompetence is well-founded. It is a violation of the Reflection Principle that preserves overall coherence.

  *   **Outside the Line (Ulysses Contract / Practical Precommitment):**
      *   **The Action:** "I will not call my brother before noon."
      *   **Why:** This binds *conduct*, not belief. The agent can believe whatever they want at noon, provided they don't pick up the phone.
      *   **Distinction:** Your character's ledger forbids a *thought*, not a deed.

  *   **Outside the Line (Ordinary Updating):**
      *   **The Shift:** "I thought he was guilty, but I saw new proof at breakfast."
      *   **Why:** This trusts the future self's judgment. It assumes the future self is a better processor of truth.
      *   **Distinction:** Your character explicitly distrusts the future self's processing power.

  *   **Outside the Line (Self-Deception):**
      *   **The Lie:** "I know he is guilty, but I will tell myself he is innocent to feel better."
      *   **Why:** This requires hiding evidence from the future self or lying about the arrangement.
      *   **Distinction:** Your character is candid. The ledger is open. The future self knows the ruling exists and knows why. It is a transparent constraint, not a hidden manipulation.

  ### The Principled Boundary
  You asked whether the proviso in the Reflection Principle is a principled boundary or an escape hatch. It is a **principled boundary**.

  The principle assumes that "you" across time are a single rational agent. If the "you" of tomorrow is cognitively impaired (by fatigue, emotion, or chemical alteration), they are, for the purposes of that hour, a *different agent* epistemically. Trusting them would be like trusting a stranger who you know is currently intoxicated.

  The boundary is drawn at **Anticipated Akrasia**.
  *   If the future self changes their mind because of **new evidence**, you must trust them (Reflection Principle holds).
  *   If the future self changes their mind because of **weakness of will / emotional volatility**, you are permitted to bind them (Reflection Principle proviso invoked).

  Your character's innovation is recognizing that "tiredness" and "eagerness to be loved" are forms of epistemic intoxication. She is not fighting her future self's *knowledge*; she is fighting her future self's *fragility*.

  ### Summary for the Novel
  If you need a label for the text or your own notes, **Epistemic Trusteeship** distinguishes the act from simple stubbornness. It implies a fiduciary duty: the night-self is the trustee of the truth, protecting it from the day-self's vulnerability.

  But if you prefer the character not to have a name for it (which fits her candor), know that she is practicing **Doxastic Precommitment via Anticipated Akrasia**. She is rational. Her friend is reciting a rule without remembering the exception. The exception *is* her life.

  She is not inconsistent. She is a governor of a state she knows is prone to mob rule. The ledger is not a diary; it is a constitution.
