  8.  **Tone Check:** Ensure I'm not lecturing but engaging with the specific steps provided. The user knows the literature; they want the *philosophical diagnosis*. Keep it rigorous.

      *(Self-Correction during drafting)*: I need to be careful about Step (7) (Urns). The Jeffreys prior vs. Uniform prior debate is about *which* invariance matters (reparameterization vs. group invariance). I should mention that Objective Bayesianism isn't monolithic; there are disputes *within* it, but that doesn't kill the normative claim entirely, just narrows it. However, the strongest point is against the "Naive PoI."

