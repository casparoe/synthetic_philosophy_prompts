      *Let's pin the rejection on Step (6).* Step (6) claims the invariance fix "imports a symmetry group the statement of the problem never mentions." This is the crux. Jaynes argues the problem statement *implies* certain symmetries (e.g., translation/rotation invariance of the table). If you reject those, you are adding information (that the table is biased). So the symmetry *is* in the evidence, implicitly.

      *Actually, the strongest move is to reject (1) as the definition of Objective Bayesianism.* Objective Bayesianism $\neq$ Naive PoI. It = Constraints + Consistency.

