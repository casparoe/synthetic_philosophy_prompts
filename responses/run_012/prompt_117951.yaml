      *   *Wait, is Step (1) the problem?* The "Naive" PoI is indeed dead. But Objective Bayesians (Jaynes, Rosenkrantz) use the *Transformation Group* method or *MaxEnt*. So, rejecting the *Naive* PoI (Step 1) in favor of a *Refined* Principle is a valid move.
      *   *Decision:* I should advise rejecting the formulation in **(1)** and the application in **(2)/(6)**. The argument attacks a straw man of Objective Bayesianism (the Naive PoI) rather than the sophisticated version (Invariance/MaxEnt).
