answer: |-
  **The Spine**
  Start with the agent's objective: taking actions justified by proofs. To coordinate with its future self, it needs to trust that future proofs imply truth. This is the Reflection Schema: $\square A \to A$. Do not begin with Gödel numbering or arithmetization. That buries the lead in technical debt and alienates the philosophers while boring the CS students. Begin with the schema as a modal intuition: "If I can prove it, it is so."

  Once the desire for the schema is established, introduce the provability predicate $\square$ as a black box satisfying the Hilbert-Bernays derivability conditions. This is sufficient to derive Löb's Theorem: $\square(\square A \to A) \to \square A$. The order matters. If you start with the predicate, students treat this as a number theory trick. If you start with the schema, they treat it as a constraint on rational agency. CS students prefer operational constraints; philosophers prefer semantic ones. The black box bridges this.

  The spine hinges on the distinction between truth and provability. Externally, we see the system is sound; $\square A \to A$ holds for all $A$. Internally, the system cannot assert this universal generalization without collapsing. The session must walk the line between "The system is sound" (true) and "The system proves it is sound" (false/disastrous). Löb arrives not as a paradox, but as the closure of the internal view. The system cannot occupy the external view. The dependency is strict: Schema desire $\to$ Predicate formalization $\to$ Löb's constraint $\to$ The Gap. Do not reverse this. If you formalize first, you lose the agency context.

  **The Carrying Example**
  Your Border Post skeleton is correct but risks sounding like mere circularity. Refine it to highlight the *collapse*. The Guard stamps a passport only if the Rulebook proves "Valid." The Guard wants to add a Trust Rule: "If the Rulebook proves 'Valid', then 'Valid'."

  If the Guard adds this, the Rulebook stamps everything. Why? To stamp a passport, the Rulebook needs to prove "Valid." By Löb, to prove "Valid," it suffices to prove "If I prove 'Valid', then 'Valid'." But the Trust Rule *is* that conditional. So the Rulebook proves the conditional, thereby proving "Valid," thereby stamping the passport. The Trust Rule doesn't verify the passport; it verifies the *verification process* so hard that the process becomes vacuous. It's not that the Guard asserts authority; it's that the condition for stamping becomes trivially satisfiable. The filter disappears. This shows why "asserting authority" isn't the problem; the problem is that the assertion *completes* the proof condition prematurely. The Guard isn't corrupt; the logic of the stamp itself dissolves.

  **Misconception Map**
  1.  **"It's just Gödel 2."** Head this off immediately after stating Löb. Gödel 2 says you can't prove consistency ($\neg\square\bot$). Löb says you can't prove soundness instances ($\square A \to A$) without proving $A$. It's stronger.
  2.  **"Just verify a hash."** Address when discussing self-reference. Knowing your source code (hash) doesn't let you prove properties of its output without the trust schema. The obstacle is logical, not epistemic access.
  3.  **"Needs more compute."** Address when discussing provability. Unprovable isn't "hard to find"; it's non-existent within the system.
  4.  **"We know it's sound."** This is the hinge. Save for the climax. Students will argue, "But the system *is* sound, why can't it use that?" You must let them feel the frustration. The agent *is* the system. It cannot step outside to verify itself. The external view is unavailable to the internal agent. That gap is the obstacle. Emphasize that "Soundness" is a property we assign, not a theorem they can hold. The pain comes from realizing the agent is trapped inside the logic it wants to verify.

  **The Check**
  Five-minute exercise: "Propose a modification to the Rulebook that allows it to trust future editions without stamping everything." If they propose adding the Trust Rule, they failed. If they propose probabilistic trust, ask: "Does this handle logical certainty?" The goal is to see them struggle with the *logical* gap, not the engineering. You want them to propose a fix and then realize Löb blocks it.

  **What I Won't Explain**
  Logical Induction. Some will know it. Acknowledge it exists but refuse to frame it as the solution. Logical Induction relaxes binary truth to probabilities, sidestepping Löb. It is a workaround, not a resolution of the logical obstacle. Do not promise it restores self-trust in the classical sense. It changes the definition of trust. Keep the session focused on the hard logical limit. Tell them: "This session is about the wall, not the ladder."
