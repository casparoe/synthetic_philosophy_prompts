  **Reasoning:**
  M's phrasing in Case 1 is the deciding factor. She insists there is "no fact of the matter" regarding the Liar. This suggests an ontological claim, not just a syntactic one. If there is no fact of the matter about S6, then there is no fact of the matter for S5 to correspond to. For S5 to be true, there would have to be a fact that S6 is not true. But if S6's status is fundamentally indeterminate, M's strict stance suggests S5's status becomes indeterminate as well.

  Rule 2 requires a distinction between *being* paradoxical and *describing* something paradoxical. While logically coherent, it introduces a discontinuity that M's "flat," "never revising" style does not suggest. She treats the Truth-Teller as defective in the "same way" as the Liar. This uniformity suggests she views the defect as a failure of reference or grounding that propagates, rather than a localized property of loop-members. She emphasizes that ordinary reasoning works only when reference traces to a sentence that "does not itself concern truth." S6 concerns truth. Therefore, the chain does not clear the bar for ordinary reasoning at S5.

  (iv) **Underdetermination and Commitments**

  Her past verdicts genuinely underdetermine this case. Case 1 (The Liar) does not distinguish between Rule 1 and Rule 2 because the Liar is self-referential. In the Liar case, the sentence ascribing untruth *is* the sentence lacking a value. We have never seen M rule on a sentence that ascribes untruth to a *different* sentence that lacks a value.

  **Commitments:**
