  *   **If she chooses Rule 2:** She commits to the view that gaps are objective states of affairs that can be truly described. She must explain why the Liar itself cannot be true (since it says of itself that it is not true, and if it's a gap, it is not true). She would likely argue the Liar fails due to self-reference specifically, whereas S5 succeeds due to external reference.

  (v) **The Simplest Separating Case**

  To force a choice between these rules, present M with a single sentence, **P**:

  > **P:** "The Liar sentence is not true."

  (Where "The Liar sentence" refers to the standard Case 1 sentence).

  *   **Rule 1 says:** P is **neither true nor false**. (Because P depends on the Liar, which is a gap).
  *   **Rule 2 says:** P is **true**. (Because P is not the Liar, and it correctly identifies that the Liar is not true).

  This is the minimal case because it isolates the variable of self-reference. It removes the chain (S4-S5-S6) and the odd loop (S1-S3), testing only the propagation of the gap from a known defective sentence to a new sentence describing it.
