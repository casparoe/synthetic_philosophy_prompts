          *   But the DBA theorem relies on *linearity* of expectation.
          *   If my preferences violate Expected Utility Theory (EUT), I can be Dutch Booked *even if* my probabilities are coherent (e.g., Allais Paradox).
          *   So, to save Probabilism via DBA, we usually assume EUT holds.
          *   The friend's objection is essentially pointing out that DBA assumes EUT (specifically, linearity in betting quotients).
          *   So, to keep (1) and (3), we must insist that Beliefs are distinct from Desires. The DBA isolates Belief. To do that, we must assume the stakes are small enough that utility is linear (Ramsey's "ethically neutral" sentences).
          *   *Correction:* The standard reply to this objection is that the DBA applies to *fair betting quotients*, which are defined *after* accounting for utility. If you refuse a bet because of risk, that bet wasn't "fair by your lights" in terms of utility.
          *   *Wait, look at premise (4):* "The argument assumes a rational agent takes any bet that's fair by her lights."
          *   *Look at premise (2):* "Each ticket was fair by her own numbers."
          *   *The ambiguity:* Does "fair by her numbers" mean $P \times Stake = Price$? Or does it mean $Expected Utility = Utility of Price$?
          *   If it means the former (Money), then (5) is correct (Risk aversion is rational).
