          *   Risk aversion is handled by the utility curve.
          *   Coherence applies to probabilities *and* utilities separately.
          *   This keeps (1) and (3) robustly.

  5.  **Drafting the Response:**
      *   **Tone:** Experienced philosopher, slightly weary but sharp. "I've heard this one before."
      *   **Structure:**
          1.  Acknowledge the strength of the friend's objection (it's the standard "Risk Aversion" objection).
          2.  Brainstorm the landscape (The Bridge Principle, Utility vs. Money).
          3.  Directly answer the "Price it out" question (Drop 4 vs. Drop 5).
