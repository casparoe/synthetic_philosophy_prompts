      *   *Scenario 2: Drop (4).* (Assert rational agents need not bet).
          *   Result: DBA becomes "watered-down."
          *   Loss: You lose the *pragmatic* force. You can no longer say "You guarantee a loss." You must say "You are disposed to a loss" or "Your valuations are inconsistent." The argument shifts from Pragmatic to Epistemic.
      *   *Scenario 3: The "Utility" Move (The Real Fix).*
