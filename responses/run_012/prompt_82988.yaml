answer: |-
  **Interview Questions for the Aesthetic Testimony Skeptic**

  **1. The Nature of the Barrier**
  You argue that I cannot acquire knowledge of a film's beauty through your testimony in the way I know it is raining outside. I need to pin down the obstacle: Is your claim that I am psychologically *unable* to have the aesthetic experience secondhand, or that I am epistemically *unjustified* in holding the belief even if I feel convinced?
  *   **Follow-up (If he says "Unjustified"):** If the justification is the problem, why does my direct experience count as justification while your detailed description of the lighting and composition does not? What specific ingredient does the description lack that the retina receives?

  **2. Verdict vs. Prediction**
  There seems to be a difference between you telling me "This film *is* beautiful" and you telling me "You *will find* this film beautiful." The second seems like a straightforward prediction about my psychology, which I can certainly learn from you. Do you deny I can know the prediction, or do you deny that the prediction amounts to knowledge of the film's value?
  *   **Follow-up (If he says "Prediction is fine, but not aesthetic knowledge"):** If I know I will find it beautiful, and I watch it and do, haven't I confirmed the value? At what point does the accurate prediction of my response become indistinguishable from knowledge of the object's quality?

  **3. The Wine Analogy (Proof Too Much I)**
  We routinely accept testimony about wine. If a sommelier tells me a bottle is complex and balanced, I buy it without tasting it first. If your position holds, I cannot know the wine is good until I drink it. Is your skepticism limited to the arts, or does it imply we are equally ignorant about the quality of our food and drink until we consume them?
  *   **Follow-up (If he says "Wine is merely sensory pleasure"):** But expert wine tasting involves vocabulary, region, and structure, much like film criticism. If the sensory element disqualifies testimony in wine, why doesn't the visual and auditory element disqualify it in film? Where is the line between "sensory" and "aesthetic"?

  **4. The Book Analogy (Proof Too Much II)**
  Consider a dense novel. A friend tells me the prose is magnificent. I haven't read it. If I take their word and cite the prose as magnificent in our group discussion, have I lied? If your theory is correct, it seems I cannot honestly repeat that judgment. Does your view render most literary criticism a form of deception?
  *   **Follow-up (If he says "It's not deception, just incomplete"):** If it's incomplete, why do we treat it as authoritative? If I say "The critic says the prose is magnificent," I am safe. But if I say "The prose *is* magnificent," you say I lack knowledge. Why does the removal of the middleman change the truth value of my statement?

  **5. The Weight of Numbers**
  I mentioned that one friend's verdict feels inert to me. But if a hundred strangers on a rating site, or a consensus of ten critics, say a film is a masterpiece, I feel permitted to accept that. Does the quantity of testimony transform non-knowledge into knowledge, or is a chorus of voices just as epistemically empty as a single one?
  *   **Follow-up (If he says "Consensus creates a cultural fact"):** If consensus creates a fact, then beauty is partly a social construct. But I thought your argument was that beauty requires a private, first-hand encounter. Can it be both privately experienced and socially manufactured?

  **6. The Function of the Critic**
  If verdicts cannot be handed over, what is the job of a critic? If they cannot tell us what is good, are they reduced to merely describing plots and camera angles? What value are we paying for if we cannot adopt their conclusions?
  *   **Follow-up (If he says "They teach us how to look"):** If they teach us how to look, they are transmitting knowledge about the *method* of appreciation. Once I use that method and agree with them, haven't I then acquired the knowledge of the beauty via their testimony about the method?

  **7. Education and Taste**
  We assume taste can be educated. A teacher shows a student why a certain shot is powerful. If aesthetic testimony is impossible, how does education happen? Must every student rediscover every aesthetic truth entirely on their own, or can the teacher's word serve as a scaffold?
  *   **Follow-up (If he says "It's a scaffold, not a foundation"):** If the scaffold holds the weight of the judgment until the student sees it, then the testimony is doing the work of knowledge in the interim. Why does the eventual visual confirmation retroactively validate the testimony that was previously inert?

  **8. Resolving Disagreement**
  In our group, if you say a film is beautiful and I say it is shallow, we argue. We try to convince each other. If neither of us can actually know the verdict via testimony, what is the goal of the argument? Are we just trying to trigger a psychological response in one another rather than resolve a truth claim?
  *   **Follow-up (If he says "We are aligning our responses"):** If we are just aligning responses, then there is no "right" answer to the dispute. Does this mean that if we both watch the film and still disagree, we are both right?

  **9. The Normative Force (The Closer)**
  You might say we defer to experts as a heuristic, even without knowledge. But deference implies I *ought* to listen. If your testimony gives me no knowledge, on what grounds do I stand if I ignore you? If there is no knowledge transmitted, is my ignoring you any different than ignoring a suggestion about where to get lunch?
  *   **Follow-up (If he says "It's different because the stakes of art are higher"):** If the stakes are higher, the need for reliable knowledge is higher. You are arguing we have *less* access to knowledge in high-stakes aesthetic matters than in low-stakes lunch matters. Why should we accept a philosophy that leaves us most blind where we care most about seeing?
