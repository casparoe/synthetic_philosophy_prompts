answer: |-
  Memorandum to the Foreign Affairs Select Committee
  From: Special Advisor on the Ethics of Intervention
  Subject: Precedent Analysis and Recommendation regarding Nara Deployment

  You have asked for consistency, not popularity. To achieve that, we must treat our four past decisions not as a list of outcomes, but as a dataset revealing the underlying constraints of this Committee's ethical framework. We are effectively operating as a *jus ad bellum* court, and like any court, we must ensure our ratio decidendi (the reasoning for the decision) holds across cases.

  Below is the breakdown of the rule space, the application to Nara, and the final recommendation.

  ### 1. The Rule Space: What do our precedents actually say?

  You identified three potential rules. Based on the specific reasoning recorded in our past reports, I have refined them into three competing principles of intervention.

  *   **Principle A (The Legitimacy Rule):** *Authorization.* Intervention requires UN Security Council (UNSC) approval, **unless** a credible regional body (NATO, Coastal Union) endorses it *and* the UNSC is paralyzed by a veto.
      *   *Supported by:* Kosovo (Yes, NATO vs. Veto), Libya (Yes, UNSC), East Timor (Yes, UNSC).
      *   *Challenged by:* Iraq (No, but Coalition of the Willing existed; we rejected it anyway).
  *   **Principle B (The Means Rule):** *Scope and Footprint.* Intervention is permissible only if it avoids long-term occupation, forced regime change, or ground invasion. "Light footprint" (air, peacekeeping, no-fly) is preferred; "Nation-building" is prohibited.
      *   *Supported by:* Libya (Explicitly no occupation), East Timor (Explicitly no toppling of Indonesia), Kosovo (Air campaign primarily).
      *   *Challenged by:* Iraq (Rejected specifically for "replacing the government" and occupation).
  *   **Principle C (The Cause Rule):** *Immediacy and Intent.* Intervention is permissible only to stop active, immediate mass killing (humanitarian rescue), not for strategic goals (disarmament, oil, democracy promotion). Additionally, coalition partners must not have predatory strategic interests.
      *   *Supported by:* Iraq (Rejected because "not about anyone actually being killed"), East Timor (Post-referendum violence), Libya (Benghazi threat).
      *   *Challenged by:* None directly, though the "partner intent" variable is untested.

  **The Tension:** Our history shows a strong preference for **Principle B (Means)**. Three out of four approvals relied on limited means (air/peacekeeping). The single rejection (Iraq) hinged heavily on the *means* (invasion/regime change) and the *cause* (lack of immediate killing). Principle A (Legitimacy) is flexible (we accepted NATO in Kosovo). Principle C (Cause) is strict (we rejected Iraq for lack of immediate killing).

  ### 2. Application to Nara

  Let us score Nara against these principles:

  *   **Legitimacy (Principle A):** **PASS.** The UNSC is vetoed, but the regional body (Coastal Union) has endorsed it. This matches Kosovo exactly.
  *   **Cause (Principle C):** **MIXED.** The killing is real and ongoing (unlike Iraq), satisfying the humanitarian threshold. However, the participating neighbours covet the oilfields. In Just War theory, this violates *Right Intention*. None of our previous cases involved coalition partners with explicit predatory economic motives.
  *   **Means (Principle B):** **FAIL.** The analysts state regime change and long-term occupation are *required*. This matches the Iraq profile (Invasion + Occupation + Regime Change) and directly contradicts the Libya/East Timor/Kosovo profiles (Air/Limited/No Regime Change).

  **The Conflict:** Nara looks like **Kosovo** on authority, but **Iraq** on means and partner intent.

  ### 3. Recommendation

  **Recommendation: DO NOT BACK.**

  **Reasoning:**
  To back this deployment would break the Committee's most consistent rule: the prohibition on open-ended occupation and forced regime change.

  While the Kosovo precedent allows us to bypass the UNSC veto via regional authorization, it does not authorize us to ignore the *means* of the intervention. Our track record is 3-1 in favour of "Limited Liability" interventions (Air/Peacekeeping) versus "Total Liability" interventions (Invasion/Occupation). The Iraq rejection established a red line: we do not support interventions where the primary mechanism for saving lives is toppling a government and occupying the country for years.

  Furthermore, the "Oil" factor introduces a corruption of *Right Intention* that we have never accepted. In East Timor, we explicitly noted the intervention was *not* aimed at toppling Indonesia. In Nara, the neighbours' interest in the oilfields suggests the humanitarian cover may be a pretext for resource acquisition by the coalition partners. Even if the humanitarian need is real, aligning with predators undermines the moral legitimacy of the mission.

  If we back Nara, we are saying that **Humanitarian Necessity justifies any Means.**
  If we reject Nara, we are saying **Humanitarian Necessity does not justify Occupation or Predatory Partnerships.**

  Given that our only "No" vote (Iraq) was driven by the "Means/Regime Change" factor, consistency demands we vote "No" here as well.

  ### 4. The Settling Case

  You asked for the single case that settles which rule we are really running. It is not one of the four real cases, but a **Hypothetical Case**:

  > **"Kosovo 1999 (Ground War Variant)":** *Imagine that in 1999, NATO intelligence had concluded that air power alone could not stop the ethnic cleansing, and that a ground invasion of Serbia and a five-year occupation of Belgrade were the only ways to save the Kosovars.*

  *   **If we would have backed that:** Then our primary rule is **Principle C (Cause)**. Humanitarian need trumps Means and Authority. We should back Nara.
  *   **If we would have rejected that:** Then our primary rule is **Principle B (Means)**. We only support humanitarian intervention when it is "cheap" and "clean" (no occupation, no regime change). We must reject Nara.

  Given our reasoning on Iraq (rejecting regime change/occupation) and Libya (explicitly ruling out occupation), the evidence suggests we would have rejected a Ground War Kosovo. Therefore, we must reject Nara.

  ### 5. The New Principle

  If we follow this recommendation (Reject), we are not adopting a new principle, but clarifying an existing one. However, if we were to **BACK** Nara, we would be quietly adopting a new, dangerous principle:

  > **The "Ends-Justify-Means" Humanitarian Exception:** *A regional body's authorization and an ongoing humanitarian crisis grant a license to ignore the prohibitions on long-term occupation, regime change, and the strategic motives of coalition partners.*

  By recommending **Against**, we affirm the Committee's standing doctrine:

  > **The "Clean Hands" Doctrine:** *We will bypass the UNSC for humanitarian rescue (Kosovo), but we will not bypass the prohibitions on occupation and regime change (Iraq), nor will we partner with states seeking to profit from the intervention (New).*

  ### Summary for the Chair

  The Committee's history is not one of "Humanitarianism at all costs." It is a history of "Humanitarianism within strict limits." We support rescue, but we do not support reconstruction by force. Nara requires reconstruction by force. The regional authorization clears the legal hurdle, but the requirement for occupation and the predatory nature of our partners fails the ethical hurdle. Consistency with our Iraq and Libya precedents dictates we stand down.
