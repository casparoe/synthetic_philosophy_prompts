      *   *Verdict:* The package is *almost* the standard Chalmersian package, but Commitment 6 is stated too strongly for Externalism. Chalmers is a rationalist, but he accepts externalism about reference. He resolves this via Scrutability: you can know the truth conditional on the "complete physical truth" a priori, but you need the empirical input to know which world you are in. Commitment 6 says "a priori reflection... not merely to our concepts." This implies access to the *actual* deep structure without empirical input. That contradicts Externalism + Necessary A Posteriori.
