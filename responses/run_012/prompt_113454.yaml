      *   **4. The Pleasure/Relief Question (The Hedonic Legitimacy)**
          *   *Current State:* Relief is okay (medical). Pleasure is suspect (recreational). Alcohol is the hypocritical exception.
          *   *Hypothetical:* If pleasure is legitimate...
