          *   *Communitarian:* Supports it if it restores social fabric (less crime, more treatment). *Divergence:* Might hate the "individual choice" aspect of safe sites.
          *   *Synthesis:* They can all endorse the *package* because it lowers the temperature. They diverge on the *end goal* (Legalization vs. Treatment Society vs. Cost Reduction).

      *   **3. The Administrative-vs-Criminal Distinction (The "Wrongness" Question)**
          *   *Question:* Does a fine/referral mean "wrong but not very"?
