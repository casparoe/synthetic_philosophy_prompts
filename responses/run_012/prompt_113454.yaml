  6.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure not to say the Portugal model *is* perfect. The user asked about the *theory* behind the pattern, not an evaluation of Portugal specifically.
      *   *Emphasis:* Highlight the "Asymmetric Agency" concept. That's the philosophical core.
      *   *Emphasis:* Highlight the "Modus Vivendi" aspect. That explains the political coalition.

  7.  **Final Polish:** Ensure clear headings and direct answers to the prompt's specific questions. (Proceed to generate response).

  *(Self-Correction Note)*: I need to be careful with the "Seller = Criminal" part. In the Portugal model, supply is still criminalized. Why? Because it introduces the drug to the ecosystem. If use is a health issue, supply is the *vector* of the disease. That's a public health frame, not necessarily a moral one. I should distinguish between "moral criminal" and "public health vector."

  *(Refining the Pleasure Point)*: If pleasure is legitimate, the "Medical" cover is no longer needed. This destroys the "Doctor as Gatekeeper" model. This is a strong point to make.

  *(Refining the Stability Point)*: Is the administrative distinction stable? Probably not. It tends to drift toward full legalization (Canada/Uruguay) or back to prohibition (Philippines). It's a transition state. I should mention that.

