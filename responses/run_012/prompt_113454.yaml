      *   *Agency:* Addiction implies diminished capacity. Harm reduction implies capacity to choose safety.
      *   *Political Coalition:* Why do strange bedfellows support this? Because it solves *their* specific problem without requiring agreement on first principles.
      *   *Moral Status:* Is drug use "bad"? Decriminalization suggests "not a crime," but supply prohibition suggests "harmful." Harm reduction suggests "inevitable."
