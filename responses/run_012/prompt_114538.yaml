  Good evening. For the record, I have checked the contract. There will be no mention of what was "meant to be," and nobody here tonight "deserves" anything. I'd like to keep my five dollars, but more importantly, I'd like to keep the couple's respect.

  We all know [Bride] and [Groom] met debating how freedom works. [Bride] argues we are free when we respond to reasons. [Groom] argues nobody is ultimately responsible for anything. It sounds like a disaster. But I want to talk about the night before [Bride]'s thesis defense.

  [Groom] drove four hours to bring her a folder. He brought the wrong one. When she snapped at him, he didn't explain the traffic, or the mix-up, or why it wasn't his fault. He just asked, "What do you need next?"

  [Bride] says that's when she knew. Why? Because in that moment, he wasn't worried about whether he was blameworthy. He was worried about being answerable. He didn't need the freedom to have changed the past; he exercised the freedom to govern his response in the present.

  They joke about a blame ledger and a love ledger. They worry the love ledger can't run if the blame ledger is closed. But look at that night. The blame ledger stayed shut. He didn't owe her penance. But the love ledger? It balanced perfectly. Because a marriage isn't built on who owes whom for past mistakes. It's built on who shows up for the next step.

  Some people think a promise only binds if you have a magical kind of freedom—the ability to have done otherwise, no matter what your history or your brain says. But [Groom] knows a promise doesn't need magic to be real. It needs consistency. It needs the kind of control where you listen to the person you love, and you adjust. That's not less than freedom. That's the only kind of freedom that actually holds a family together.

  To the grandparents and parents here: you might worry that if they talk this way, nothing matters. But watch them. When things go wrong, they don't look for someone to punish. They look for what needs fixing. That isn't nihilism. That is steadiness. And steadiness is what lets love grow.

  They don't need the universe to grant them permission to be together. They just need each other. They need the freedom to respond to reasons, and the most compelling reason either of them has ever found is standing right in front of them.

  So, let's raise a glass. To [Bride] and [Groom]. May your guidance control be steady, your reasons be good, and your love ledger always in the black.

  \answer{reasons-responsive freedom ; libertarian free will}
