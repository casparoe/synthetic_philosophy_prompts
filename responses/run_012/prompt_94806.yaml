  **Title:** The Idealist's Victory: Gödel on Undetectable Rotation and the Illusion of Becoming

  If Kurt Gödel were alive today to read a paper claiming that the Cosmic Microwave Background (CMB) permits a tiny, undetectable cosmic rotation sufficient to sustain Closed Timelike Curves (CTCs), he would not view this as a narrow cosmological technicality. He would view it as a vindication of his 1949 argument. **Gödel would steadfastly maintain that time is not objectively real.** He would argue that the specific matter distribution of our universe is ontologically irrelevant; what matters is that the laws of General Relativity (GR) permit structures where objective becoming is impossible. The new paper, by admitting that CTCs remain a geometric possibility even within observational bounds, confirms that "time" in the sense of a universal, flowing now cannot be a fundamental feature of reality. Furthermore, he would dismiss the thermodynamic arrow and the Past Hypothesis as explanations for the *experience* of time, not the *existence* of time.

  To understand why Gödel would not retreat, one must recognize that his argument was never primarily cosmological; it was modal and metaphysical. Critics often misunderstand Gödel as claiming, "Our universe rotates, therefore time is an illusion." This is incorrect. Gödel's argument was that if the laws of nature (specifically GR) allow for a world where objective time is impossible (the rotating solution), then objective time cannot be a fundamental constituent of reality in *any* world governed by those laws.

  Gödel reasoned that the ontological status of time should not depend on the contingent distribution of matter. If "objective becoming" were real, it should be real in all possible solutions of the theory describing our world. If GR allows a solution where you can travel to your own past, then the concept of a universal "now" is incoherent within that theory. The new paper's admission that a tiny rotation could still allow CTCs is, for Gödel, a smoking gun. It demonstrates that the *structure* of spacetime in our universe retains the capacity for CTCs. The fact that the rotation is "below current bounds" or "basically undetectable" is an epistemological limitation, not an ontological repair. If the geometry allows a path to the past, even a difficult one, the block universe is fixed. The future already exists as much as the past. Therefore, the "passage" of time is a psychological artifact, not a physical reality.

  Gödel would likely be particularly aggressive regarding the "undetectable" nature of this rotation. In his 1949 essay, he emphasized that the relativity of simultaneity already undermines absolute time, but CTCs destroy it completely. If the new paper suggests that CTCs are physically possible but just hard to access, Gödel would argue this is akin to saying "objective reality exists but is hard to see." For Gödel, if the theory permits the contradiction of "changing the past" (or rather, the coexistence of past and future), then the intuition of time flowing is definitively proven to be incompatible with the physics. He would argue that we should not trust our intuitive perception of time over the logical implications of the field equations. The fact that we don't observe CTCs in daily life is no more an argument for objective time than the fact that we don't observe quantum superpositions in daily life is an argument against quantum mechanics.

  The most significant challenge Gödel would face today is not the CMB data, but the modern reliance on the Thermodynamic Arrow of Time and the Past Hypothesis. Contemporary physicists often argue that while fundamental laws are time-symmetric, the low-entropy boundary condition of the early universe (the Past Hypothesis) generates a robust arrow of time that explains our experience of flow. Would Gödel concede that this restores the reality of time?

  **No.** Gödel would draw a sharp distinction between the *asymmetry* of time and the *passage* of time. He would argue that the Past Hypothesis explains why we remember the past and not the future, and why eggs break but do not un-break. It explains the *direction* of processes. However, it does not explain the *coming into existence* of the future. In a block universe with a low-entropy past boundary, the future is just as fixed as the past; it is merely a region of higher entropy.

  Gödel would likely argue that the thermodynamic arrow creates the *illusion* of becoming because our consciousness is tied to entropy-increasing processes (like neural firing). We perceive "change" because we are thermodynamic systems moving along a worldline from low to high entropy. But this is a subjective perspective from within the block, not a feature of the block itself. He would say that the Past Hypothesis explains why the movie plays in one direction, but it does not make the movie "happen" in real-time. The reel exists all at once. To conflate the thermodynamic gradient with the ontological flow of time is, for Gödel, a category error.

  Furthermore, Gödel would point out that if the new paper admits CTCs are still possible, the thermodynamic arrow itself becomes ambiguous on global scales. If one can traverse a CTC, one could theoretically return to a region of lower entropy, violating the global monotonicity of the arrow. If the thermodynamic arrow can be looped, it cannot be the foundation of objective time.

  In conclusion, Gödel would read this new paper not as a refutation, but as a refinement of his thesis. He would argue that the specific parameters of our universe (the near-isotropy of the CMB) are contingent accidents that do not salvage the reality of time. As long as the laws of physics permit a geometry where "before" and "after" lose their absolute meaning, time as an objective flow is an illusion. He would maintain that the thermodynamic arrow explains the *content* of our temporal experience, but not its *reality*. For Gödel, the existence of a possible path to the past—even an undetectable one—collapses the distinction between past, present, and future. He would leave the seminar room convinced that physics has once again demonstrated that change is a deception of our senses, and that reality is, and always has been, a timeless block.
