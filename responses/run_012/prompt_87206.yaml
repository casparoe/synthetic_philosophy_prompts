answer: |-
  Friends, neighbors. Thank you for standing with me in this wind.

  I am a writer of fiction. My trade is making things up. I build houses that never stood, I kill people who never lived, and I ask you to walk inside those rooms and mourn those deaths. But there is a contract between me and my reader. I say: *This is a story.* I ask for your imagination, but I do not ask for your belief. I admit the artifice. That is the only defense I have.

  Forty years ago, in this yard, a different kind of making began.

  Eleven men died. But then, a world was built where they had not. It was built with engineers, with chronologies, with a vocabulary of safety and denial. It was a world complete and consistent. And for those who lived inside it, for those who spoke its language day after day, the boundary between what was built and what was born must have grown thin.

  I look at the men in the front rows, the grandfathers here today. I do not stand here to judge what lives inside your heads. I know that when you repeat a story long enough, it stops feeling like a story and starts feeling like the sky. I know that for a decade, we did not know what to believe. We cannot claim we knew the truth when the world we were given was so carefully constructed.

  But a novel and a lie differ not in their sentences, but in what they demand. A novel asks you to see. A lie asks you to look away. A novel ends when you close the book. A lie demands you keep building it, forever, to keep the wind out.

  We are done building.

  This plaque is not a weapon. It is not proof, because a fact stated is not always a fact believed. It is an anchor. It is a place where we stop making worlds and let the ground be the ground. It is here, on this fence, so that when the wind changes, we have something heavy to hold onto.

  We propose these words:

  **ELEVEN MEN DIED HERE. NO WORD CAN UNMAKE WHAT HAPPENED.**
