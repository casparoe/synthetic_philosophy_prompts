prompt: |-
  I'm a software engineer, no formal philosphy background, but I keep chewing on this one. Everyone treats procrastination and "weakness of will" as a moral failing or a glitch in the brain. I want you to argue the opposite: that there's no such thing as weakness of will as a separate phenomenon — that once you take seriously the idea that our preferences about the future flip as the future gets closer (hyperbolic discounting, I think it's called), akrasia just falls out as a description rather than an explanation. The picture I've got is this: me-now and me-tonight are basically two agents with different preference orderings over the same evening. When me-tonight scrolls instead of studying, we call it weakness, but that's just the loser's framing — me-now lost a vote, me-tonight won it, and in the morning a third agent shows up and complains about the outcome. I want you to build the strongest version of that argument. Then do two more things: tell me where the argument is weakest and what would have to be true for it to be wrong, and tell me what it does with a couple of cases. Case 1: I set up a cron job that donates $50 to a cause I despise if I open Twitter before 10am, and it works — is that me being strong-willed, or did I just outsource my will to a script I can't argue with? Case 2: a friend says he kicked his bad habits by deciding once and never re-litigating, but he also says he feels less like himself now. Does your argument predict that feeling, or does it break on him?
