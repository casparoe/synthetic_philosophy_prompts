answer: |-
  This is a precise translation task. You are asking to map a macro-ethical, structural critique (your friend's) onto a micro-ethical, procedural framework (your IRB work). The friction you feel isn't just disagreement; it's a category mismatch between *political morality* and *regulatory compliance*.

  Here is the translation of her position into your vocabulary, followed by the residue report and an analysis of your inducement hypothesis.

  ### Part 1: The Translation Protocol
  **Objective:** Restate the "Ban-It" position using 45 CFR 46 / Belmont Report syntax without evaluating validity.

  **1. The Commodification/Dignity Argument**
  *   **Her phrasing:** "You can't sell a baby or a womb. It turns women into containers and children into products. It violates human dignity."
  *   **IRB Translation:** **Violation of Respect for Persons (Ontological).**
      *   This is not a risk/benefit calculation; it is a claim of *inalienability*. In IRB terms, this argues that certain bodily capacities are constitutive of the person and cannot be alienated via consent without negating the status of the subject as an end in themselves.
      *   **Protocol Implication:** The protocol is inherently non-compliant. No modification can cure a defect where the *nature* of the intervention treats the subject as a mere means (instrumentalization), regardless of the subject's stated willingness. Consent is rendered *ultra vires* (beyond one's legal/moral power to grant).

  **2. The Exploitation/Poverty Argument**
  *   **Her phrasing:** "Rich couples are exploiting poor women who have no other choice. It's predatory."
  *   **IRB Translation:** **Violation of Justice (Equitable Selection) & Structural Coercion.**
      *   **Justice:** The burdens of the research/intervention are falling disproportionately on a vulnerable class (economically disadvantaged women), while the benefits (offspring, income) accrue to a different class. This violates the principle of equitable selection of subjects.
      *   **Voluntariness:** This is not standard *undue inducement*; it is *coercion by circumstance*. The "alternative being too bad" functions as a threat, not an offer. If the background conditions (poverty) constrain the will so severely that refusal is not a viable option, voluntariness is compromised.
      *   **Protocol Implication:** The recruitment plan targets a vulnerable population without sufficient justification for why *this* population is necessary, and the consent environment is compromised by systemic power differentials that the PI cannot mitigate.

  **3. The "You Can't Consent to This" Argument**
  *   **Her phrasing:** "You don't know how you'll feel handing over a baby. You can't truly understand that risk."
  *   **IRB Translation:** **Deficit in Comprehension & Unknown Long-Term Risk.**
      *   **Comprehension:** This challenges the subject's capacity to understand the psychological magnitude of the intervention. It suggests a permanent *therapeutic misconception* regarding the emotional impact of separation.
      *   **Risk Profile:** The long-term psychological risks are unquantifiable and potentially severe. In an early-phase trial context, this would be a "stop" signal due to an unfavorable risk-benefit ratio where the "benefit" (payment) is ethically suspect and the "risk" (psychological trauma) is incalculable.
      *   **Protocol Implication:** Informed consent is impossible because the risks cannot be adequately disclosed or understood *ex ante*.

  **4. The Societal Harm Argument**
  *   **Her phrasing:** "This changes how we value life and motherhood for everyone, not just the participants."
  *   **IRB Translation:** **Negative Social Value / Externalities.**
      *   IRBs assess *social value* of the knowledge gained. Her argument is that the *practice itself* generates negative social value (erosion of norms), which outweighs the individual benefits.
      *   **Protocol Implication:** The study/intervention lacks social value or produces net social harm, which is a ground for disapproval under the Common Rule (risk to society > benefit to subjects/knowledge).

  ***

  ### Part 2: The Residue Report
  **Objective:** Identify what is lost, distorted, or created in the translation.

  | Friend's Concept | IRB Translation Status | Analysis of Residue |
  | :--- | :--- | :--- |
  | **Human Dignity / Commodification** | **Distorted** | **Loss:** The IRB concept of "Respect for Persons" is procedural (autonomy + protection). Her concept is ontological (sacredness/inalienability). <br>**Verdict:** **Framework Blindness.** Your framework assumes alienability if consent is valid. It has no slot for "things money shouldn't touch" unless it's illegal. The IRB cannot process "symbolic harm." |
  | **Exploitation of the Poor** | **Clean but Narrowed** | **Loss:** IRB "Justice" focuses on *selection* (why *these* subjects?). Her argument is about *background justice* (why is *anyone* this poor?). <br>**Verdict:** **Framework Blindness.** The IRB treats poverty as a vulnerability to be managed (extra safeguards), not a structural injustice that precludes the study. You manage the symptom; she diagnoses the disease. |
  | **Invalid Consent (Emotional)** | **Clean** | **Loss:** Minimal. IRBs regularly reject protocols where psychological risks are opaque or comprehension is doubtful (e.g., certain trauma research). <br>**Verdict:** **Translates Well.** This is standard risk/benefit and comprehension analysis. |
  | **Societal Norm Erosion** | **No Expression** | **Loss:** Total. IRBs protect *subjects*, not *culture*. <br>**Verdict:** **Category Error.** This is a legislative concern, not a regulatory compliance concern. Your framework isn't blind; it's jurisdictionally bounded. She is making a policy argument; you are hearing a protocol argument. |
  | **The "Ban"** | **Distorted** | **Loss:** An IRB "Disapproval" is protocol-specific. A "Ban" is categorical. <br>**Verdict:** **Framework Limitation.** You can only reject *this* study with *these* PIs. You cannot reject the *category* of commercial surrogacy. To you, a ban looks like administrative overreach; to her, regulation looks like complicity. |

  **Summary of Residue:**
  The biggest residue is **Symbolic vs. Procedural**. Your framework asks: "Is this transaction conducted safely and consensually?" Her framework asks: "Should this transaction exist?"
  *   **Is your framework blind?** Yes, to structural and symbolic harm. It is designed to be micro-ethical.
  *   **Is her position unclear?** Sometimes. She often slides between "This is dangerous" (risk/benefit) and "This is wrong" (ontological). When she says "dangerous," she translates well. When she says "wrong," she falls out of your syntax.

  ***

  ### Part 3: The Inducement Hypothesis
  **Your Suspicion:** *"Undue inducement is about an offer being too good, but most of her argument was about the alternative being too bad. Those feel like different complaints... I'm worried I'm quietly flattening them into one."*

  **Verification:** **You are correct.** You are flattening them, and the regulatory framework encourages this flattening, which obscures the ethical reality.

  **1. The Distinction**
  *   **Undue Inducement:** An *offer* that is so attractive it clouds judgment, leading the subject to underestimate risk or ignore their own best interests. (The "Carrot" is too big).
  *   **Coercion by Circumstance:** A *situation* where the alternatives are so dire that the subject has no reasonable choice but to accept. (The "Stick" of poverty is too hard).

  **2. How the IRB Collapses Them**
  In IRB practice, both are filed under **Threats to Voluntariness**.
  *   If a subject takes a high-risk drug trial because the pay is \$50k, we worry about *undue inducement*.
  *   If a subject takes a high-risk drug trial because they need \$50k to eat, we worry about *vulnerability/exploitation*.
  *   **The Collapse:** In practice, the mitigation for both is often the same: *Reduce the payment* or *Add more consent warnings*. By treating them as the same problem (voluntariness), the IRB framework implies that if you lower the payment enough, the coercion disappears.
  *   **The Error:** Lowering the payment does not fix the poverty. It just makes the transaction less "undue," while leaving the subject desperate. Your friend is arguing about the *desperation* (the background condition). Your framework is trained to look at the *offer* (the foreground transaction).

  **3. Why This Matters for the Argument**
  *   **Your View (Market/Regulatory):** If we regulate the offer (safeguards, fair pay, transparency), we mitigate undue inducement. The transaction becomes ethical.
  *   **Her View (Ban/Structural):** The offer is only attractive because the background conditions are unjust. Therefore, the consent is never truly voluntary because it is born of necessity, not freedom.
  *   **The Impasse:** You are arguing about the *fairness of the contract*. She is arguing about the *freedom of the contractor*.
  *   **Regulatory Blind Spot:** The Common Rule assumes that if a subject is not *actively coerced by the researcher*, they are free. It does not account for *economic coercion* as a disqualifier for consent, only as a trigger for "additional safeguards."

  **Conclusion on Hypothesis:**
  You are not just flattening them; your regulatory toolkit forces you to. "Undue inducement" is the only lever you have for "money influencing choice." But her argument is that *need* influences choice more than *greed* does.
  *   **Undue Inducement** implies the subject *wouldn't* do it but for the money.
  *   **Her Argument** implies the subject *wouldn't* do it but for the *need*.
  *   **The Translation Failure:** When you hear "exploitation," you hear "Undue Inducement/Vulnerability" (manageable). She means "Structural Coercion" (requires systemic change/ban).

  ### Final Synthesis
  You are speaking **Compliance**; she is speaking **Justice**.
  *   **What translates:** Physical risk, psychological comprehension, immediate vulnerability.
  *   **What doesn't:** The moral status of the body, the justice of the background economic conditions, the symbolic message of the market.
  *   **The Inducement Trap:** You are trying to solve a *coercion* problem with *inducement* tools. You can regulate the payment to ensure it's not "too good," but you cannot regulate the poverty to ensure the choice is "free enough."

  Her argument survives translation only in the margins of your framework (Justice, Vulnerability), but the core of her claim (Inalienability, Structural Coercion) hits the boundary of what an IRB is authorized to see. You aren't missing the point; your job description is designed to filter it out.
