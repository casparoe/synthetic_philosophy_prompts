prompt: |-
  My friend and I got into a two-hour arguement last night about commercial surrogacy and paid egg donation. She's firmly on the ban-it side — the way a bunch of European countries do it — and I'm mostly on the market side, but the frustrating part was that every single point she made sounded like something I already handle at work under a different name.

  For context: I do research ethics for a living. I sit on our IRB, mostly social-science protocols and the occasional early-phase trial, so I think in that vocabulary. Voluntariness, comprehension, undue inducement (an offer so attractive it messes with your judgment), vulnerable populations, risk-benefit ratio, and the fact that the only moves I actually have are approve, approve with modifications, or reject — protocol by protocol. I can't ban a category of transaction. I can't say that some thing simply shouldn't be bought and sold. And I'm fluent in this stuff, so don't dumb down the IRB half for me.

  What I want: take her case for banning paid surrogacy and paid egg donation — the dignity and commodification stuff, the exploitation-of-poor-women stuff, the idea that there are things you can't validly consent to sell in the first place — and restate it as faithfully as you can in my vocabulary. Not as a rebuttal yet, just the translation, as precisely as the concepts allow, and don't smuggle in my assumptions or hers and call it translating.

  Then the residue report, which is the part I actually care about. What translates cleanly? What only translates with distortion? What has no expression in IRB terms at all? And for each piece that doesn't survive, tell me whether that's my framework being blind to something real or her position being less clear than it sounded when she said it.

  One thing I already suspect, and I want you to check me on it: undue inducement is about an offer being too good, but most of her argument was about the alternative being too bad. Those feel like different complaints to me, and I'm worried I'm quietly flattening them into one because my framework only has a slot for the first.
