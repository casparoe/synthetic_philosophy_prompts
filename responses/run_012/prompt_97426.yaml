  8.  **Final Polish:** Organize with clear headings corresponding to the four prompts. Ensure the "Verdict" language is strong. (Proceed to generate output based on this structure.)

  *(Self-Correction during drafting)*: I need to be careful not to drift into standard political theory tropes (like Rawls vs. Pogge) since the user asked for *no literature survey*. I must speak to the *logic of the institutions themselves*.

