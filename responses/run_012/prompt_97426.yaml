      *   *Verdict:* The parts presuppose incompatible things. Specifically, the LRNC case shows that "subject to coercion" (residence/tax) is insufficient for "author of law" (vote). This implies the state claims a right to exclude based on something deeper than interaction or presence—likely a pre-political or constitutive notion of "the people."

