answer: |-
  Here is a reconstruction of the implicit theory generated by the architecture of the contemporary welfare state, analyzed according to your four constraints.

  ### 1. Special Claims vs. Thinner Explanations

  Does the institutional pattern commit the state to the proposition that compatriots have special claims which outsiders lack, or is this merely a matter of administrative convenience or agent-relative permission?

  **The Verdict:** The practice **presupposes special claims**, not merely permissions or practical constraints.

  **The Argument:**
  A "thinner" explanation would posit that the state is simply the local administrative arm of global justice, or that it holds a permission to favor locals because it is the only agent capable of acting effectively. If this were true, the boundary of entitlement would track *capacity to assist* or *presence of need*. However, the architecture tracks *status*.

  1.  **The Exclusionary Mechanism:** The system does not merely prioritize insiders when resources are scarce; it structurally excludes outsiders even when resources are abundant and the outsider's need is greater. A system based on "agent-relative permission" would allow favoring compatriots but would not morally *forbid* aiding outsiders equally. The welfare state, however, legally *forbids* access to specific funds based on citizenship status, even for tax-paying residents. This implies a duty to exclude, which requires a justification stronger than mere permission.
  2.  **The Coercive Boundary:** The state enforces these boundaries coercively (border control, deportation, benefit sanctions). To coercively restrict access to goods necessary for agency (welfare, work, residence) requires a justification that appeals to a specific relationship between the restrictor and the restricted. "We are the only ones who can do this" is insufficient to justify denying a claim to an equally needy human being. "You do not belong to us" is the only remaining justification.
  3.  **Accommodation vs. Presupposition:** The system *accommodates* practical constraints (it is easier to tax residents than non-residents), but it *presupposes* a moral boundary. If the logic were purely practical, long-term residents who pay taxes would automatically qualify for all benefits. The fact that they do not (in many jurisdictions) demonstrates that the boundary is moralized, not merely logistical.

  **Conclusion:** The architecture is not neutral. It embodies a **particularist obligation**. It asserts that the state is not a universal agent acting locally, but a particular association acting for its members.

  ### 2. Consistency of Rationales (Reciprocity, Solidarity, Membership)

  If special claims are presupposed, are the three distinct rationales (contribution, residence, citizenship) mutually consistent?

  **The Verdict:** The rationales are **inconsistent and hierarchical**, not integrated. The system is eclectic, deploying different moral logics to minimize cost and maximize sovereignty, creating a specific contradiction in the status of the long-resident non-citizen.

  **The Analysis:**
  *   **Contribution (Pensions/Unemployment):** This relies on a **contractual/insurance model**. It treats the state as a bank. Moral logic: *Quid pro quo*.
  *   **Residence (Health/Schooling):** This relies on a **communal solidarity model**. It treats the state as a household. Moral logic: *Shared fate/presence*.
  *   **Membership (Voting/Entry):** This relies on a **constitutive model**. It treats the state as a club or family. Moral logic: *Identity/Belonging*.

  **The Point of Incompatibility:**
  The inconsistency is sharpest in the case of the **Long-Resident Non-Citizen (LRNC)**.
  *   Under the *Contribution* rationale, the LRNC should have full economic entitlements (they pay).
  *   Under the *Solidarity* rationale, the LRNC should have full social entitlements (they live here, their children go to school here).
  *   Under the *Membership* rationale, the LRNC is excluded from political voice and sometimes full welfare.

  If the state were consistent, it would choose one metric. If it chose Contribution, citizenship wouldn't matter for pensions. If it chose Solidarity, citizenship wouldn't matter for healthcare. If it chose Membership, non-citizens shouldn't pay taxes or use schools.

  **The Implicit Hierarchy:**
  The practice resolves this inconsistency by establishing a hierarchy: **Membership trumps Solidarity, which trumps Contribution.**
  1.  **Membership** determines the ultimate right to remain and rule (voting).
  2.  **Solidarity** is granted conditionally to maintain public order and health within the territory (hence residents get healthcare).
  3.  **Contribution** is enforced universally on those present but redeemed only partially for non-members.

  **Verdict:** The system is not theoretically coherent. It draws on whichever rationale protects state sovereignty (Membership) while offloading social costs (Solidarity) and securing revenue (Contribution). The LRNC is the living contradiction: treated as a member for extraction (tax) and order (health), but as an outsider for power (vote) and security (welfare safety net). This presupposes that **political authorship** is distinct from **social subjection**, a claim that is difficult to square with liberal democratic principles of "no taxation without representation."

  ### 3. Philosophical Underdetermination

  Where is the practice philosophically underdetermined? That is, where would rival theories (liberal-nationalist, moderate cosmopolitan, libertarian) license the same arrangement?

  **The Verdict:** The **internal distribution mechanisms** are underdetermined; the **external boundaries** are the site of contention.

  **Areas of Convergence:**
  1.  **The Insurance Principle:** A libertarian, a nationalist, and a cosmopolitan can all agree on contribution-based pensions. For the libertarian, it is forced savings; for the nationalist, it is intergenerational reciprocity; for the cosmopolitan, it is a fair risk-pooling mechanism. The *design* of the pension does not reveal the *justification* of the border.
  2.  **Residence as a Proxy:** Almost all theories accept that administration requires a location. A cosmopolitan can accept that healthcare is delivered locally based on residence, provided that residence is easily acquired. A nationalist accepts it because residence usually correlates with membership. The *mechanism* (go to a local clinic) looks the same, even if the *right to be there* differs.
  3.  **The Division of Labor:** Moderate cosmopolitans often argue that states are efficient "divisions of labor" for delivering justice. Liberal nationalists argue states are necessary for solidarity. Both end up supporting a robust welfare state. The *existence* of the welfare state does not prove the *moral significance of the nation*.

  **The Divergence Point:**
  The underdetermination ends at the **gate**.
  *   **Nationalist:** The gate is closed by default; entry is a privilege.
  *   **Cosmopolitan:** The gate is open by default; exclusion requires specific justification.
  *   **Liberal:** The gate is closed, but those inside the gate must be treated equally regardless of status.

  **Verdict:** You cannot read the moral theory of the state solely from its welfare bureaucracy. A universal healthcare system looks identical in a nationalist state and a cosmopolitan one. The difference lies entirely in who is allowed to walk through the door to access it. Therefore, the welfare state architecture is **compatible with multiple moral foundations**, provided the boundary question is bracketed.

  ### 4. The Cosmopolitan Redesign

  If one adopted a thoroughgoing cosmopolitanism that denied intrinsic moral significance to the border, what would have to change in the design of these institutions?

  **The Verdict:** Thoroughgoing cosmopolitanism requires the **decoupling of rights from citizenship**, but not necessarily the abolition of the state as an administrative unit.

  **What Would Have to Go:**
  1.  **Citizenship as a Gatekeeper for Rights:** Citizenship could remain as a cultural or diplomatic status, but it could no longer determine entitlement to welfare, work, or residence. The link between *passport* and *survival* must be severed.
  2.  **Exclusionary Border Controls:** If borders lack intrinsic moral significance, preventing movement to seek work or safety requires a justification akin to preventing internal migration (e.g., specific security threats, not economic protectionism). Strict immigration quotas based on economic self-interest would be illegitimate.
  3.  **Non-Portable Benefits:** Entitlements tied to continuous presence within a specific jurisdiction (e.g., "you lose your pension if you leave for 5 years") would need to be relaxed to allow for global mobility.

  **What Could Survive (Modified):**
  1.  **Residence-Based Administration:** Healthcare and schooling would still be delivered locally. Cosmopolitanism does not require a global bureaucracy, only equal access. You still go to the local hospital. However, the *right to reside* to access that hospital would be nearly automatic upon arrival, not contingent on prior status.
  2.  **Contribution Records:** Insurance models (pensions) could survive. However, they would need to be **portable**. If I work for 10 years in Country A and 10 years in Country B, I should accrue rights in a unified pool, or the systems must be fully interoperable. The "national insurance number" becomes a "global social security number."
  3.  **Taxation:** States could still tax residents. However, tax competition designed to attract capital while excluding labor would be constrained. There would need to be mechanisms to prevent "free riding" by jurisdictions that offer benefits without contributing to the global pool (e.g., global minimum tax).

  **What Would Be Untouched:**
  1.  **Local Democratic Governance:** Even cosmopolitans generally accept that specific local issues (zoning, local schools) are decided by those present. Residence-based voting would actually be *strengthened*, replacing citizenship-based voting.
  2.  **The Welfare Logic:** The idea that the collective should protect individuals from risk (unemployment, sickness) remains. Cosmopolitanism changes the *scope* of the "we," not the *function* of the welfare state.

  **Summary of the Shift:**
  The transition is from a **Club Model** (membership grants access) to a **Utility Model** (presence grants access).
  *   **Current:** You must be a member to enter; once inside, you get benefits based on residence/contribution.
  *   **Cosmopolitan:** You may enter to reside; once inside, you get benefits based on residence/contribution.

  The crucial institutional change is that **migration policy becomes social policy.** You cannot have a cosmopolitan welfare state without open (or nearly open) borders, because restricting the border is the primary mechanism by which the welfare state maintains the "special claims" of the insider. Without the closed border, the distinction between "compatriot" and "outsider" dissolves into "resident" and "non-resident," and the special claims of the compatriot vanish.
