      *   *Analysis:* If it were merely practical, why exclude long-term residents from voting? Why bar access to funds for tax-paying non-citizens? The *exclusionary* aspect is key. A purely administrative agent wouldn't necessarily deny voice to those subject to coercion.
      *   *Verdict:* The practice *presupposes* special claims. It's not just that the state *can* favor members; it's that it *ought* to prioritize them over equally needy outsiders. The "thinner" explanation fails to account for the *moralized boundary* (citizenship) distinct from the *administrative boundary* (residence).
