  | Objection | Who | Damage | 2-Min Reply | Weakest Point |
  | :--- | :--- | :--- | :--- | :--- |
  | "Radioactive decay is single-case. Frequency can't handle it. Propensity explains the individual event's chance." | Propensity Philosopher | High | Propensity claims to explain the single case, but verification is always ensemble-based. We assign the disposition *because* we expect the frequency. The 'explanation' is retroactive labeling. It posits a ghostly cause to mirror the statistical effect we already anticipate. | Assumes verification must be frequentist; ignores claims of physical mechanism. |
  | "If observed frequency diverges, propensity theorists blame the setup, not the probability. Isn't that unfalsifiable?" | Frequentist Statistician | High | Exactly. This is the 'calibration shuffle.' When data fits, probability is a real disposition. When it diverges, it becomes a frequency estimate requiring 'identical conditions.' They swap definitions to avoid refutation, claiming metaphysical depth while relying on frequentist rescue. | Risks sounding like you demand strict falsificationism yourself. |
  | "You say it's just model symmetries. But model choice is subjective. So isn't propensity just hidden subjectivism?" | Bayesian | Medium | Yes, partly. But propensities claim objectivity that subjectivism denies. They want the authority of physics without the baggage of long-run limits. It is subjectivism wearing objective clothes, using physical language to shield model choices from critique. | May alienate Bayesians who think all probability is subjective. |

  **Concessions and the Dangerous Question**

  Concede upfront that propensity language is heuristically vital for physics, particularly quantum mechanics. Do not claim physicists are wrong to use it, only that their *interpretation* of what they are doing is metaphysically inflated. Hold firm that it offers no epistemic advantage over frequentist calibration or Bayesian coherence; it is a linguistic bridge, not an ontological foundation.

  The question you hope nobody asks is: **"If propensity is just a model symmetry, why does nature obey the probability calculus in single cases where no model exists yet?"** This is dangerous because it suggests propensity predicts *new* phenomena (like quantum violations of Bell's inequalities) that frequentism couldn't anticipate. If you say it's just reading symmetries, you cannot explain predictive novelty. You must argue the math drove the physics, not the metaphysics, but this risks conceding that the 'model' accesses reality better than your thesis allows. Prepare to distinguish between *using* propensity language to discover laws versus *claiming* propensity exists as a thing behind those laws.
