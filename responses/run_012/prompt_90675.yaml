answer: |-
  Here is the spec. I am taking a definite position: **The only coherent "unit of selection" is the Replicator.** Everything else (organism, group, species) is a Vehicle or Interactor. If a theory cannot distinguish between the thing that gets copied and the thing that does the work, it is not a theory of selection; it is a theory of statistics.

  To count as a valid theory of the unit of selection, a framework must satisfy three requirements. If it fails any one of these, it collapses into tautology or confusion.

  ### The Spec: Three Requirements for a Unit of Selection

  **1. The Heredity Requirement (Fidelity)**
  *   **The Rule:** The unit must be capable of being copied with sufficient fidelity to allow accumulation of changes over generations.
  *   **The Motivating Case:** **Blending Inheritance.** If traits blend like paint (red + white = pink, then pink + pink = pink), variation disappears in one generation. Selection needs discrete units that persist.
  *   **Why it matters:** This rules out "the organism" as the *fundamental* unit, because organisms are not copied; they are destroyed and rebuilt every generation. Only the information constructing them (genes) is copied.

  **2. The Causal Leverage Requirement (Difference-Making)**
  *   **The Rule:** Variation in the unit must cause variation in survival/reproduction. It cannot be a passive passenger.
  *   **The Motivating Case:** **Genetic Hitchhiking.** A neutral gene can spread simply because it is located next to a beneficial gene on the same chromosome.
  *   **Why it matters:** This distinguishes *selection* from *drift* or *linkage*. If the unit doesn't make a causal difference to its own propagation, it is not being selected; it is just along for the ride. This requirement kills theories that define selection purely by statistical correlation without mechanistic causation.

  **3. The Fate Decoupling Requirement (Independence)**
  *   **The Rule:** The reproductive fate of the unit must be distinguishable from the fate of the container holding it.
  *   **The Motivating Case:** **Meiotic Drive & Tumors.**
      *   *Meiotic Drive:* A "selfish" gene copies itself into >50% of gametes, even if it sterilizes the organism. The gene's fitness goes up; the organism's goes down.
      *   *Tumors:* A cell lineage evolves within your body to reproduce faster, killing you (the organism) in the process.
  *   **Why it matters:** This is the load-bearing wall. If the unit's fate is perfectly locked to the container's fate, you cannot have within-container conflict. This requirement forces you to admit that selection can happen *inside* an organism, meaning the organism is not the bottom-level unit.

  ---

  ### The Verdict on Your Worm Case

  **The Scenario:** A bird inherits a behavioral trait (fear/call) via a gut worm lineage, not via bird DNA. The trait tracks the worm's lineage.

  **Applying the Spec:**
  1.  **Heredity:** Yes. The worm lineage is copied from parent bird to chick. Fidelity is maintained via the worm's reproduction.
  2.  **Causal Leverage:** Yes. The presence of the worm causes the behavior, which affects the bird's survival.
  3.  **Fate Decoupling:** **Yes.** This is the critical point. The worm lineage is physically distinct from the bird genome. It is possible (in principle) for the bird genome to persist while the worm lineage dies out, or for the worm to spread to other bird species.

  **The Ruling:**
  My spec **forces the worm (or the worm-borne information) to be recognized as a Unit of Selection (Replicator)** for that specific trait, distinct from the bird's genome.

  However, here is the trap you suspected: **Is the worm the *Beneficiary*?**
  *   If the worm's reproduction rate increases *because* the bird survives better, the worm is both the Replicator and the Beneficiary. It is a symbiotic unit of selection.
  *   If the worm's reproduction is *unaffected* by the bird's survival (e.g., the worm is transmitted vertically regardless of the fear trait), then the worm is the **Vector**, not the Beneficiary. The *Bird* is the Beneficiary, but the *Worm* is the Replicator.

  **This breaks the standard definition.** Most theories conflate "Unit of Selection" with "Unit of Adaptation." My spec separates them. In your case, the **Worm is the Unit of Selection** (what gets copied), but the **Bird is the Unit of Adaptation** (who gets the benefit).

  ---

  ### The Inconsistency and The Load-Bearing Requirement

  You asked if the requirements are consistent and which one does the heavy lifting.

  **The Inconsistency:**
  Requirements 2 (Causal Leverage) and 3 (Fate Decoupling) can conflict in **Altruism**.
  *   In eusocial insects (ants), the worker sterile ant throws itself away for the colony.
  *   *Fate Decoupling* says the individual ant is a unit (its fate is decoupled; it dies while the queen lives).
  *   *Causal Leverage* says the individual ant makes no causal contribution to its *own* replication (it has zero fitness).
  *   **The Conflict:** You cannot satisfy "Unit of Selection" for the individual ant under these rules. The theory *must* shift the unit to the Gene (which is replicated in the queen) or the Colony (if the colony reproduces). You cannot have it both ways. If you insist the Individual is the unit, you violate Causal Leverage. If you insist the Gene is the unit, you satisfy both but lose the intuition that the ant is an "actor."

  **The Load-Bearing Requirement:**
  **Fate Decoupling (Requirement 3)** does the most work.
  *   Heredity is just a prerequisite for evolution generally.
  *   Causal Leverage distinguishes selection from noise.
  *   **Fate Decoupling distinguishes Levels.** It is the only requirement that tells you *where* the boundary of the unit lies. It is the only thing that allows you to say "Selection is happening *here* (gene) and not *there* (organism)" when the two come into conflict (meiotic drive).

  **The Single Requirement That Rules Out Candidates:**
  **Fate Decoupling.**
  It rules out "The Species" as a unit of selection in most cases, because species rarely reproduce with fidelity (speciation is messy) and their fate is usually decoupled from any higher-level container (there is no "Genus" that reproduces). It rules out "The Group" unless the group itself buds or splits like an organism. It rules out "The Organism" as the *fundamental* unit because of meiotic drive and tumors.

  ### Final Position

  The debate over "Gene vs. Organism vs. Group" is a category error caused by failing to separate **Replicator** (what gets copied) from **Vehicle** (what interacts with the world).

  1.  **The Gene (or equivalent information lineage) is the only true Unit of Selection.** It is the only thing that satisfies Heredity and Fate Decoupling universally.
  2.  **The Organism is a Vehicle.** It is the machine built by replicators to protect and propagate them.
  3.  **Your Worm Case:** This proves that "Gene" is shorthand for "Heritable Information Substrate." If a worm carries the heritable info, the worm lineage functions as the gene. The physical substrate (DNA vs. Worm) doesn't matter; the **Lineage Fidelity** does.

  **The Contradiction you need to accept:**
  You cannot have a theory where the "Unit of Selection" is also always the "Unit that Benefits." In your worm case, if the worm gets no benefit, it is a Unit of Selection without being a Beneficiary. If you demand that a Unit of Selection must benefit, you cannot explain your worm case. If you allow Units of Selection to be neutral vectors, you dilute the meaning of "selection."

  **My advice:** Drop the phrase "Unit of Selection." Use **"Replicator"** for what gets copied (Gene/Worm) and **"Interactor"** for what faces the environment (Bird/Organism). If you do this, your worm case resolves instantly: The Worm is the Replicator; the Bird is the Interactor. Selection acts on the Interactor, but the consequence is the differential propagation of the Replicator. Any theory that refuses to make this cut will fail your spec.
