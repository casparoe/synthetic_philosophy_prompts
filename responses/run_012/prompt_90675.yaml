prompt: |-
  I've been going back and forth on the whole fight over what natural selection actually acts on -- selfish genes, whole organisms, groups, species -- and it strikes me that everyone's arguing about the answer before anyone says what the answer even has to do. So before I read anything else, I want the spec first: what does any theory of the "unit of selection" have to get right to count as any good? Give me the list of requirements, each with the case that motivates it. Stuff like: it has to make sense of meiotic drive, where a gene spreads even though it's bad for the body carrying it; it has to handle eusocial insects where individuals seem to throw themselves away; it has to say what to do with selection happening inside a single body, like a tumor lineage evolving against the rest of you; and it has to keep straight the difference between a unit selection acts on and a unit that just gets dragged along. Now here's the case I care most about, which I thought up myself and can't find anyone discussing: suppose a bird picks up a gut worm, and the chicks reliably inherit a fear or a call from the worm rather than from the birds' own genes -- so the trait tracks the worm's lineage, not the bird's. Does your spec force the worm to be a unit of selection, or does something in the list rule it out? I want to know whether my requirements are even consistent with each other, which ones are load-bearing and which are just taste, and which single requirement does the most work in ruling out candidates. If two of them can't both be satisfied, say so, because that's the part I actually want. Take a definite position here -- don't just lay out the options and let me pick.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Task:** Define the "spec" (requirements) for a theory of the "unit of selection" in evolutionary biology.
      *   **Specific Constraints:**
          *   Must provide a list of requirements, each motivated by a specific case (meiotic drive, eusociality, somatic evolution/tumors, hitchhiking).
          *   Must address a specific novel case provided by the user (bird gut worm transmitting behavioral traits to chicks, bypassing bird genes).
          *   Must take a *definite position* (no fence-sitting).
          *   Must evaluate consistency (are requirements compatible? which is load-bearing? which rules out candidates?).
          *   Tone: Direct, analytical, philosophical but grounded in biology.
      *   **User's Goal:** They want to cut through the "gene vs. organism vs. group" debate by establishing criteria for what counts as a valid answer *before* picking a side. They suspect there might be contradictions in the standard requirements.

  2.  **Deconstruct the "Unit of Selection" Problem:**
      *   The debate usually centers on Lewontin's conditions (variation, heredity, differential fitness) vs. Dawkins' "replicator/vehicle" distinction vs. Hull's "interactor/replicator" vs. Multilevel Selection (MLS) theory.
      *   Key distinction: *Replicator* (what gets copied) vs. *Interactor* (what interacts with the environment) vs. *Beneficiary* (who gains fitness).
      *   The user wants a "spec" – essentially a functional definition of what makes something a unit of selection.

  3.  **Drafting the Requirements (The "Spec"):**
      *   *Requirement 1: Heredity/Fidelity.* The unit must be capable of being copied with sufficient fidelity. (Motivation: Without this, nothing accumulates.)
      *   *Requirement 2: Causal Efficacy.* The unit must make a difference to its own propagation. (Motivation: Distinguishing selection from drift or hitchhiking.)
      *   *Requirement 3: Fitness Variance.* There must be variation in reproductive success among units. (Motivation: Lewontin's basic condition.)
      *   *Requirement 4: Decouplability.* The unit's fate must be distinguishable from the vehicle carrying it. (Motivation: Meiotic drive, tumors.)

      *Refining the Requirements based on User's Examples:*
      *   *Meiotic Drive:* Requires distinguishing gene fitness from organism fitness.
      *   *Eusociality:* Requires explaining altruism (kin selection/group selection).
      *   *Tumors:* Requires handling within-organism selection.
      *   *Hitchhiking:* Requires distinguishing the *target* of selection from the *passenger*.

      *Let's consolidate into 3 strong, load-bearing requirements:*
      1.  **Lineage Fidelity:** Can it be tracked through generations?
      2.  **Causal Leverage:** Does variation in *this* thing cause variation in survival/reproduction?
      3.  **Autonomy of Fate:** Can its frequency change independently of the higher-level container?

  4.  **Addressing the User's Novel Case (The Gut Worm/Bird):**
      *   *Scenario:* Bird eats worm. Chicks inherit fear/call *from the worm* (somehow transmitted), not bird genes. Trait tracks worm lineage.
      *   *Analysis:* If the trait (fear/call) helps the bird survive, but the *information* resides in the worm lineage, who is being selected?
      *   *Application of Spec:*
          *   Lineage Fidelity: Yes, worm lineage tracks.
          *   Causal Leverage: The worm's presence causes the bird's behavior.
          *   Autonomy: If the worm dies out, the trait dies out, even if bird genes persist.
      *   *Verdict:* Under a strict "replicator" view, the worm (or the worm-borne information) is the unit. Under an "interactor" view, the bird is the unit.
      *   *My Position:* I need to take a side. The "Gene's Eye View" (Dawkins/Hamilton) is the most robust framework for handling these edge cases without contradiction. Therefore, the *replicator* is the unit of selection, the *organism* is the vehicle.
      *   *Wait, the user wants me to rule on their specific case.* Does the spec force the worm to be a unit?
      *   If the trait is *inherited via the worm*, the worm is the vector of heredity. If the worm is vertically transmitted (parent to offspring bird), it acts like an organelle (mitochondria). If it's horizontal, it's a parasite. The user says "chicks reliably inherit... from the worm." This implies vertical transmission of the worm or the worm's effect.
      *   *Crucial distinction:* Is the worm *selected*? Or is the bird selected *via* the worm?
      *   If the worm gains nothing, it's not a unit of selection *for that trait*. It's a vector.
      *   *Correction:* The user asks if the *worm* is a unit of selection. If the worm doesn't benefit, it's not the *beneficiary*. But is it the *unit*?
      *   *Standard View:* Selection acts on phenotypes. The phenotype is in the bird. The genotype is... where? If the info is in the worm, the worm is the replicator.
      *   *My Definite Position:* The **Replicator** is the only coherent unit of selection. Everything else is a vehicle or environment. This resolves the hitchhiking problem best.

  5.  **Evaluating Consistency & Trade-offs:**
      *   Are the requirements consistent?
      *   *Conflict:* "Causal Leverage" vs. "Autonomy of Fate."
      *   In the worm case, the worm has autonomy (it's a separate lineage) but might lack causal leverage *for its own benefit* (if it's just a passive vector).
      *   *Load-bearing Requirement:* **Lineage Fidelity (Heredity).** Without heredity, nothing else matters.
      *   *Ruling-out Requirement:* **Autonomy of Fate (Decouplability).** This kills group selection unless groups reproduce. This kills the organism if genes can cheat (meiotic drive).
      *   *The Contradiction:* You cannot satisfy "Organism is the unit" AND "Meiotic Drive exists" without redefining fitness. You have to choose: either fitness is defined at the gene level, or you admit multiple levels simultaneously (MLS).
      *   *My Stance:* MLS is often conceptually messy. The Replicator view is cleaner.

  6.  **Developing the Response Structure:**
      *   **Introduction:** Acknowledge the frustration with the debate. State the thesis: The "Unit of Selection" is a category error unless we distinguish *Replicator* from *Interactor*.
      *   **The Spec (3 Requirements):**
          1.  **Heredity (The Copying Condition):** Motivated by the need for accumulation.
          2.  **Causal Power (The Difference-Maker):** Motivated by hitchhiking.
          3.  **Fate Decoupling (The Independence Condition):** Motivated by meiotic drive/tumors.
      *   **The Verdict on the Worm Case:** Apply the spec.
      *   **The Conflict/Trade-off:** Identify which requirements clash. (Specifically: Causal Power vs. Beneficiary).
      *   **The Load-Bearing Requirement:** Identify the one that does the most work.
      *   **Final Position:** Gene/Replicator centrality.

  7.  **Refining the Worm Case Analysis:**
      *   User: "Chicks reliably inherit a fear or a call from the worm rather than from the birds' own genes."
      *   This is essentially an inherited microbiome acting as genetic material.
      *   If the worm lineage tracks the trait, and the trait affects bird fitness...
      *   Does the worm *benefit*? If no, the worm is not the *beneficiary* of selection.
      *   Is the worm the *unit*? If "unit" means "what gets selected," selection requires differential reproduction of the unit. If the worm's reproduction isn't tied to the trait's success (e.g., the worm reproduces regardless of whether the bird has the fear), then the worm is *not* the unit of selection for that trait. It is merely the *medium*.
      *   *However*, if the worm's transmission *depends* on the bird's survival (vertical transmission), then the worm's fitness is tied to the bird's fitness.
      *   *Decision:* I will argue that if the worm is the sole carrier of the heritable information, it is the **Replicator**, and therefore the fundamental unit of selection, even if the *benefit* accrues to the bird. This highlights the separation of Replicator and Vehicle.
      *   *Wait, nuance:* If the worm doesn't benefit, is it selection *on* the worm? No. It's selection on the *information* carried by the worm.
      *   *Better Position:* The unit of selection is the **Heritable Information**, regardless of substrate. If the worm carries it, the worm lineage is the proxy for the unit.
      *   *Actually, let's look at the "Fate Decoupling" requirement.* If the worm can spread *without* the bird benefiting (e.g. horizontal transmission), but the bird trait persists... no, the user says chicks inherit from worm.
      *   *Okay, strict application:*
          1.  Heredity: Yes (Worm lineage).
          2.  Causal Power: Yes (Worm causes fear).
          3.  Fate Decoupling: Yes (Worm lineage is distinct from bird genome).
      *   *Conclusion:* The spec forces us to treat the worm (or the worm-borne element) as a unit of selection *at that level*, distinct from the bird genome.
      *   *The Catch:* If the worm doesn't gain fitness, it's not "selection on the worm" in the sense of the worm adapting. It's the bird adapting *using* the worm.
      *   *Resolution:* This reveals the conflict between "Unit of Selection" (what gets copied) and "Unit of Adaptation" (who benefits). I must highlight this tension.

  8.  **Finalizing the "Definite Position":**
      *   Don't waffle.
      *   Claim: The **Replicator** is the only non-negotiable unit.
      *   Claim: The Worm case proves that substrate doesn't matter, only heredity + fitness consequence.
      *   Claim: The conflict lies between "Who benefits?" and "What gets copied?"
      *   Load-bearing requirement: **Fate Decoupling.** It's the only thing that separates selection from drift/hitchhiking.

  9.  **Review against constraints:**
      *   List of requirements with cases? Yes.
      *   Address worm case? Yes.
      *   Definite position? Yes.
      *   Identify inconsistencies/load-bearing? Yes.
      *   Tone check: Analytical, direct.

  10. **Self-Correction during drafting:**
      *   *Initial thought:* Maybe argue for Multilevel Selection.
      *   *Correction:* No, MLS often obscures the mechanism. The user wants clarity ("the spec"). The Replicator/Vehicle distinction (Dawkins/Hull) provides the sharpest "spec." I will advocate for that.
      *   *Worm Case Nuance:* I need to be careful not to say the worm is "selected" if it doesn't reproduce more. I need to distinguish between the *locus of heredity* and the *locus of fitness*. The user's case blurs this. I will argue this blurring breaks the standard definition unless we separate Replicator from Vehicle.

  11. **Final Polish:** Ensure the "Load-bearing" and "Inconsistency" sections are punchy. The user wants to know where the theory breaks. The break is usually between "selection of" vs "selection for."

  *(Self-Correction on the Worm Case)*: If the chicks inherit the *fear* from the worm, but the worm doesn't necessarily reproduce *because* of the fear... wait. If the worm is in the gut, and the chick gets the worm from the parent... that's vertical transmission. The worm's fitness *is* tied to the bird's fitness. So the worm *is* a unit of selection alongside the bird genes. They are co-selected.
  *But what if the worm is just a vector for a virus or plasmid?* The user says "gut worm." Let's assume the worm is the heritable entity.
  *Key Insight:* If the trait tracks the worm lineage, then for that trait, the worm is the unit of heredity. If selection acts on the trait, it acts on the worm lineage. Even if the worm is "selfish" or "neutral," if it carries the adaptive trait, it is the unit of selection *for that trait*.
  *Wait, one more check:* If the worm gets no benefit, can it be a unit of selection? Selection implies differential reproduction of the unit. If the worm's reproduction is unaffected by the trait, the worm is not the unit of selection *for that trait*. The *bird* is the unit of selection, using the worm as a tool.
  *Okay, this is the crux.* I need to decide this.
  *Decision:* I will argue that if the heredity flows through the worm, the worm is the **Replicator**. Whether it is the **Beneficiary** is a separate question. The "Unit of Selection" usually conflates these. My spec will separate them. This answers the user's "consistency" worry.

