      *   *Drafting PC 1 (Capture):* "People will cheat." -> *Refining to PC Vocab:* "This creates a new market for rent-seeking. Traders have incentive to lobby the elected body to change the metric definition to make their position profitable."
      *   *Drafting DT 1 (Legitimacy):* "This isn't democracy." -> *Refining to DT Vocab:* "The instrumental/constitutive distinction collapses. Defining the metric *is* a value judgment. Who holds the market accountable?"

  4.  **Prioritizing (Likelihood $\times$ Damage):**

      1.  **Measurement/Identification (Experimentalists):** Biggest group, fundamental to the "audit" claim.
      2.  **Metric Manipulation/Goodhart (Public Choice + MD):** Everyone cares about incentives. If the metric is gameable, the whole thing fails.
