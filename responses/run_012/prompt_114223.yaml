      *   **Public-Choice Economist (The Business School Guy):**
          *   *Vocab:* Rent-seeking, regulatory capture, concentrated benefits/diffuse costs, principal-agent.
          *   *Objection:* Who profits? Traders will lobby to change the metric or the policy options. The "independent audit" isn't independent.
