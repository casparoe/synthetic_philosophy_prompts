      *   *Drafting Exp 1 (Measurement):* "How do you measure homelessness accurately?" -> *Refining to Exp Vocab:* "Your identification strategy relies on the audit. If the measurement protocol has error, the market prices noise, not signal. How do you ensure SUTVA holds when policies interfere?"
