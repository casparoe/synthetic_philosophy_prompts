answer: |-
  This is a high-stakes workshop. Your audience is not hostile to *you*, but they are hostile to *claims* that lack rigorous grounding in their respective methodologies. They will smell blood if you conflate measurement with truth, or incentives with outcomes.

  Here is your Q&A Prep Sheet, ordered by **Priority Score (Likelihood $\times$ Damage)**.

  ### 1. The Identification/Measurement Problem
  **Who:** The Experimentalists (The Majority)
  **Vocab:** *Identification strategy, measurement error, SUTVA, noise vs. signal.*
  **The Objection:** "Your mechanism relies entirely on the audit settling the market. But in field settings, measurement is never neutral. If your homelessness metric has even 5% error, the market isn't pricing policy efficacy; it's pricing measurement noise. Furthermore, how do you satisfy SUTVA? If County A runs this market, does it affect homelessness in County B (interference)? If the audit is noisy, the scoring rule becomes improper, and informed traders exit."

  **The 2-Minute Reply:**
  "You're right that measurement error is the single point of failure, which is why the 'pre-registered measurement protocol' is the constitutional constraint here, not an afterthought. I'm not claiming the audit is perfect; I'm claiming it's *less* manipulable than the current legislative bargaining process. Regarding identification: The market doesn't need to identify the causal effect itself; it aggregates private information about the causal effect. The audit only needs to verify the *outcome*, not the counterfactual. On interference: This mechanism is designed for local administrative decisions where spillovers are minimized, not macro-policy. If the noise is too high, the market spread widens, and the mechanism defaults to the status quo. It fails safely rather than falsely."

  **Honest Note on Softness:**
  This is technically shaky. If the audit is noisy, the market *does* become improper, and liquidity dries up. You are assuming the audit is "good enough" without proving what that threshold is.
  **Preparation:** Have a footnote ready on "Signal-to-Noise Ratios in Administrative Data."

  ### 2. The Rent-Seeking on the Metric
  **Who:** The Public-Choice Economist (Business School)
  **Vocab:** *Regulatory capture, concentrated benefits, rent-seeking, principal-agent problem.*
  **The Objection:** "You've moved the rent-seeking, not eliminated it. Previously, lobbyists fought over which policy to pass. Now, they fight over how the 'metric' is defined. If I'm a private prison contractor, I don't lobby for the enforcement policy anymore; I lobby the elected body to define 'unsheltered' in a way that makes my stock profitable. Who captures the audit? You've created a thinner, more opaque target for capture."

  **The 2-Minute Reply:**
  "This is the strongest argument against scaling futarchy broadly, which is why I restrict the scope to *instrumental* decisions with established metrics. For homelessness, we aren't inventing a new metric; we are adopting existing HUD standards. The gain here is transparency. In the current system, the link between the lobbyist's money and the policy outcome is obscured by legislative logrolling. In this system, if a lobbyist changes the metric definition, it is a public, recorded vote. The market then immediately reprices. It makes the rent-seeking visible and priced in, rather than hidden in committee."

  **Honest Note on Softness:**
  You are hoping that "visibility" reduces capture. Public Choice theory suggests it might just professionalize it. You have no empirical evidence that metric-definition is harder to capture than policy-selection.
  **Preparation:** Be ready to admit this is a comparative claim (less bad than status quo), not an absolute one (perfectly immune).

  ### 3. The Instrumental/Constitutive Collapse
  **Who:** The Democratic Theorist (and anyone paying attention)
  **Vocab:** *Legitimacy, agency, constitutive values, technocracy, the political.*
  **The Objection:** "Your entire chapter rests on the distinction between instrumental and constitutive decisions. But defining the metric *is* a constitutive act. Deciding to measure 'unsheltered homelessness' rather than 'quality of life' or 'public safety' is a value judgment. By handing the policy choice to the market, you aren't separating values from facts; you're hiding the value judgment inside the metric definition and claiming it's neutral. Who is the principal here? I can vote out a council member; I can't vote out a price."

  **The 2-Minute Reply:**
  "I concede that no metric is value-neutral. However, in current practice, these value judgments are made *implicitly* during policy selection. My proposal forces the elected body to make the value judgment *explicitly* at the metric stage, where they are accountable to voters. Currently, a council member can vote for a policy that fails and claim 'we tried.' Under this mechanism, they must own the definition of success. I am not removing the principal; I am sharpening the agent's mandate. The market is not the principal; it is a tool for the principal to enforce accountability on the agent."

  **Honest Note on Softness:**
  **This is your weakest point.** You admitted it. The theorist is right: separating "what we want" from "how to get it" is philosophically fraught.
  **Preparation:** Do not fight the philosophy. Fight the *administrative reality*. Argue that bureaucracies *already* make this distinction (targets vs. methods), and your proposal just democratizes the target-setting.

  ### 4. The Counterfactual Settlement (The Technical Kill Shot)
  **Who:** The Mechanism Designers
  **Vocab:** *Proper scoring rule, counterfactual settlement, liquidity, equilibrium.*
  **The Objection:** "You say you run matched markets on counterfactuals (Outcome if A vs. Outcome if B). But if the market chooses A, policy B is never implemented. How do you settle the B market? You cannot audit a counterfactual. If you void the B shares, you destroy the incentive to trade on B, which destroys the price discovery for A. If you settle B based on a model, you've introduced a new oracle risk. Which is it?"

  **The 2-Minute Reply:**
  "This is a standard futarchy settlement issue. We settle only the shares corresponding to the *realized* policy. The incentive to trade on the unchosen policy comes from the possibility that it *could* be chosen. Traders are betting on the conditional expectation $E[Y|Policy]$. As long as there is uncertainty about which policy the market will select until the close, both markets remain liquid. We are not auditing the counterfactual; we are using the price differential to select the policy, then auditing the realized outcome to pay the winners."

  **Honest Note on Softness:**
  If the market knows the election is a foregone conclusion, liquidity on the loser vanishes. You need to explain the "decision rule" clearly. Is it automated? If it's automated, the mechanism designers will ask about manipulation of the decision rule itself.
  **Preparation:** Draw the timeline on the board if asked. Close markets -> Compare Prices -> Execute Policy -> 5 Years -> Audit -> Settle.

  ---

  ### Strategic Concessions

  **What to Concede Up Front:**
  *   **Scope:** Concede immediately that this is **not** for high-stakes constitutional rights or war/peace. It is for "administrative instrumentalism" (zoning, public health targets, infrastructure maintenance). If you try to defend this for *all* decisions, the Democratic Theorist will eat you.
  *   **Measurement Imperfection:** Concede that the audit will not be perfect. Your claim is comparative: it is *more* robust than legislative guessing, not that it is omniscient.

  **What to Refuse to Concede:**
  *   **The Efficiency Claim:** Do not concede that markets are "smarter" than people in a mystical sense. Defend the specific claim that markets aggregate *dispersed information* about implementation constraints better than a committee.
  *   **The "Category Error":** Do not let the Democratic Theorist frame this as "anti-democratic." Frame it as "pro-democratic accountability." The elected body sets the goal; the market is just the calculator.

  ### The Weakest Point (Prepare to Defend)
  **The "Instrumental/Constitutive" Boundary.**
  The Democratic Theorist and the Experimentalists will gang up here. The Experimentalists will argue that you can't measure "homelessness" without making constitutive choices about who counts.
  *   **Defense:** Pivot to **Administrative Law**. Argue that agencies *already* do this (e.g., EPA setting ppm limits). Your mechanism just adds a market layer to the existing administrative state. You are not proposing a new philosophy of governance, but a new *tool* for the existing bureaucracy.

  ### The "Hope Nobody Asks" Question
  **The Question:** "What prevents the market from choosing the policy that hits the metric by violating rights? For example, if the metric is 'reduce unsheltered count,' and the market realizes that 'arresting all homeless people and hiding them in unaccountable jails' is the cheapest way to hit the target, the market will choose it. How do you constrain the *means* without destroying the market's efficiency?"

  **Why it's dangerous:** It combines the Public Choice fear (perverse incentives) with the Democratic Theorist's fear (normative collapse) and proves your Instrumental/Constitutive distinction is unenforceable.

  **The Answer (if asked):**
  "That is why the policy *packages* put up for vote are pre-screened for legal and rights-based constraints by the elected body. The market chooses between 'Housing First' and 'Enforcement + Treatment,' not between 'Housing' and 'Violate Rights.' The constraint is on the *choice set*, not the outcome. The market optimizes within a constitutional cage."
  *(Note: This opens you up to "Who guards the guardians?" but it's the only defensible position.)*

  ### Final Advice for the Room
  *   **For the Experimentalists:** Use the word **"Protocol."** It signals pre-registration and rigor.
  *   **For the Theorists:** Use the word **"Incentive-Compatible."** Do not say "markets know best." Say "agents maximize payoff by revealing information."
  *   **For the Public Choice Guy:** Acknowledge **"Rent-Seeking"** explicitly. Don't pretend it doesn't exist; argue you're redirecting it to a less destructive channel.
  *   **For the Theorist:** Acknowledge **"Legitimacy."** Admit that price is not legitimacy, but price + elected mandate is.

  Good luck. Keep your answers under two minutes. If you ramble, they will smell uncertainty.
