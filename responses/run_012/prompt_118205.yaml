  2. Genuine tensions, ranked by severity

  **Claim 3 vs. Claim 7 (Underdetermination vs. Adjudication).** Claim 3 asserts evidence does not dictate narrative plot; Claim 7 asserts evidence adjudicates conflicting narratives. These conflict because if evidence underdetermines plot (3), it lacks the logical leverage to resolve plot conflicts (7). If rival national histories differ only in emplotment, Claim 3 says both are valid relative to the evidence, while Claim 7 says evidence decides the winner. **Severity: Critical.** To save Claim 7, you must concede that evidence *constrains* emplotment, not merely permits it. **Cost:** You surrender the strong Whitean insight that narrative structure is ultimately an aesthetic choice independent of truth conditions.

  **Claim 3 vs. Claim 4 (Narrative Autonomy vs. Supervenience).** Claim 4 states merit differences must trace to evidential differences. Claim 3 implies narrative form (a source of merit) varies without evidential change. If Historian A writes a Tragedy and Historian B writes a Farce using identical sources, Claim 3 allows both to be coherent. But if A is "better" (Claim 5), Claim 4 demands an evidential difference. Since Claim 3 denies the plot is evidential, Claim 4 is violated. **Severity: High.** To save Claim 4, you must argue that narrative coherence is itself an evidential claim. **Cost:** You reduce narrative structure to factual assertion, losing the distinction between "what happened" and "what it means."

  **Claim 5 vs. Claim 3 (Scrupulousness vs. Emplotment).** Claim 5 values scrupulous handling of sources; Claim 3 suggests the story shape is independent of those sources. If the shape is independent, being scrupulous with evidence ensures factual accuracy but not narrative truth. **Severity: Medium.** To save Claim 5, you must admit scrupulousness limits narrative options. **Cost:** You acknowledge that ethical historiography restricts artistic freedom.

  3. Tensions that dissolve

  **Claim 1 vs. Claim 2 (Ontology vs. Significance).** These appear to conflict between realism and constructivism. The tension dissolves when distinguishing ontological status from epistemic selection. Claim 1 addresses whether events occurred independently of us (ontology). Claim 2 addresses whether those events matter to history (epistemology). You can hold that a battle occurred regardless of observers (1) while maintaining it only becomes a "historical fact" when inquiry makes it significant (2).

  **Claim 1 vs. Claim 6 (Truth vs. Access).** These appear to conflict between correspondence theory and virtue epistemology. The tension dissolves via the distinction between truth conditions and methods of access. Claim 1 defines what makes a statement true (independent reality). Claim 6 defines how historians achieve reliability (virtuous disposition). Rejecting a "view from nowhere" (6) denies direct, unmediated access, not the existence of the independent truth (1) being sought.

  **Claim 5 vs. Claim 6 (Outcome vs. Process).** These appear to conflict between objective results and subjective virtues. The tension dissolves via causality. Claim 5 describes the resulting quality of the account; Claim 6 describes the character of the agent producing it. Accounts are objectively better (5) precisely *because* the historian exercised the virtue (6). They are mutually reinforcing descriptions of the same successful practice.

  4. The cheapest revision

  Modify Claim 3 to state that narrative form is *underdetermined* by evidence but not *undetermined*. Replace "is not dictated" with "is not fully dictated." This preserves the insight that evidence allows multiple valid interpretations without surrendering the claim that evidence rules out invalid ones. **Surrender:** You lose the radical position that emplotment is an aesthetic choice unconstrained by reality. **Gain:** You secure the logical foundation for Claim 7, allowing you to condemn distorting narratives as evidentially inadequate. This aligns your narrativism with your realism.
