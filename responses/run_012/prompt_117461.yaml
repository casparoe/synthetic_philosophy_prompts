answer: |-
  Good morning. I know it's Saturday. I know there is coffee involved, and I know that if you were anywhere else, you'd still be asleep. I'm a fifth-year grad student, which means I am professionally qualified to overthink simple things, but today I want to try something harder: I want to under-think this with you.

  The Dean's office asked me to send you out with a specific takeaway. They want me to tell you that consent is simple. They want me to give you a slogan. So, here it is, and I mean it: **Only yes means yes.**

  Silence isn't yes. Confusion isn't yes. A "maybe" isn't yes. If you are waiting for a sign, stop waiting. But here is the thing about slogans: they are like compasses. A compass is incredibly useful. It tells you where North is. But a compass is not the terrain. It doesn't tell you about the swamps, or the cliffs, or the weather.

  We all know that human beings are complicated. We know that sometimes people say "yes" because they want to, and sometimes they say "yes" because they're afraid of what happens if they don't. We know the difference between a partner saying, "If you don't do this, I'll leave," and a partner saying, "If you don't do this, I'll send everyone those photos." Both involve a choice. Both involve a threat of loss. But your gut tells you those are not the same thing. We don't need a flowchart to feel the weight of that difference.

  We know that being too drunk to sign a lease means you can't sign a lease, and that should tell us something about signing onto anything else. We also know that sometimes consent isn't needed at all—like when a surgeon fixes a broken bone while you're under—and sometimes consent is present, but the thing is still rotten. You can agree to something fully, freely, and still be treated poorly. Consent isn't a magic word that waives kindness. It isn't a contract that closes the moral question the second the syllable is out of your mouth.

  So, if it's not just a magic word, what is it?

  I think the best way to picture it is this: Consent is something two people are trying to keep track of *together*.

  When it works, it's a shared project. It's looking at the same map and agreeing on the route. When it fails, it usually isn't because someone forgot the slogan. It fails because one person is surprised, or because one person couldn't say "no" without losing something they needed—safety, housing, friendship, dignity.

  That is why you are here. You are peer educators. Your job isn't to be the consent police. Your job isn't to litigate the hard cases in the middle of a hallway at 2 AM. Your job is to help build a community where the "yes" is easier to trust because the "no" is safer to say.

  When you talk to your peers, don't just talk about rules. Talk about attention. Talk about checking in. Talk about how a real "yes" feels light, and a coerced "yes" feels heavy. Talk about how if you have to guess, the answer is no.

  We want you to leave here believing that "only yes means yes." But I also want you to believe that the "yes" matters more than the word. It matters who said it, why they said it, and whether they felt they had a choice.

  So, keep the slogan. Use it. It's a good North Star. But don't let it be the only tool in your kit. Be the person who notices when the terrain doesn't match the compass. Be the person who makes sure your friends know that their "no" won't cost them their community.

  Only yes means yes. But let's make sure that "yes" is real, that it's free, and that it's shared. Thank you, and let's have a good weekend.
