answer: |-
  ### OPERATING MANUAL: SINGLE-POINT FAILURE RATE ESTIMATION

  **Purpose:** To derive a defensible point estimate for failure probability (per 1,000 operating hours) satisfying reserving and audit constraints.
  **Constraint:** Do not average heterogeneous inputs. Use a hierarchy of evidence. Push uncertainty into the point estimate via a Prudence Factor (PF).

  1.  **Define Reference Class.**
      *   *Question:* What specific machine model, operating envelope, and failure definition does this policy cover?
      *   *Sufficiency:* A written definition matching the policy schedule exactly.
      *   *Audit Note:* Record the definition verbatim.

  2.  **Assess Claims Data (Frequency).**
      *   *Question:* Is there observed exposure data for this Reference Class?
      *   *Sufficiency:* Minimum 10,000 operating hours OR minimum 3 observed failures of the specific mode.
      *   *Action:* If Yes, calculate Raw Frequency Rate (RFR). If No, mark as "Data Sparse."

  3.  **Assess Physics Model (Mechanism).**
      *   *Question:* Does the physics-of-failure model validate against the specific operating conditions (load, environment, maintenance) of the Reference Class?
      *   *Sufficiency:* A validation report confirming boundary conditions match the policy.
      *   *Action:* If Yes, record Model Rate (MR). If No, discard MR.

  4.  **Assess Expert Elicitation (Confidence).**
      *   *Question:* Do the consulted engineers agree within a factor of 2 on the likelihood?
      *   *Sufficiency:* Variance between highest and lowest estimate ≤ 2x.
      *   *Action:* If Yes, record Expert Consensus Rate (ECR). If No, mark as "Expert Divergent."

  5.  **Select Primary Source (Hierarchy).**
      *   *Rule A:* If Step 2 is "Yes," Primary Source = Claims Data.
      *   *Rule B:* If Step 2 is "Data Sparse" AND Step 3 is "Yes," Primary Source = Physics Model.
      *   *Rule C:* If Step 2 is "Data Sparse" AND Step 3 is "No" AND Step 4 is "Yes," Primary Source = Expert Consensus.
      *   *Rule D:* If Step 2 is "Data Sparse" AND Step 3 is "No" AND Step 4 is "Expert Divergent," Proceed to Step 7.

  6.  **Apply Prudence Factor (Uncertainty Loading).**
      *   *Question:* What is the risk that the Primary Source underestimates reality due to hidden variables?
      *   *Action:* Multiply Primary Rate by PF.
          *   Claims Data: PF = 1.0 (if >50k hours) to 1.5 (if near threshold).
          *   Physics Model: PF = 2.0 (standard new tech loading).
          *   Expert Consensus: PF = 3.0 (high uncertainty loading).
      *   *Audit Note:* Justify the PF multiplier in words.

  7.  **Stop Condition Check.**
      *   *Question:* Are the inputs contradictory (e.g., Claims High, Physics Low) with insufficient data to resolve the conflict?
      *   *Condition:* If Step 2 is "Yes" BUT Step 3 contradicts by >1 order of magnitude, OR if Step 5 triggers Rule D.
      *   *Action:* Halt. Do not produce a number. Declare risk unquantifiable for standard pricing.

  8.  **Draft Audit Note.**
      *   *Requirement:* State Reference Class, Primary Source justification, Prudence Factor reasoning, and any Stop Condition triggers.

  ***

  ### FILE 1: MATURE PUMP MODEL

  **Inputs:**
  *   **Claims:** 40,000 hours, 3 failures. (RFR = 0.075 per 1k hours).
  *   **Physics:** Predicts 0.00075 per 1k hours (2 orders magnitude lower).
  *   **Experts:** Not elicited (relied on history).

  **Procedure Execution:**
  1.  **Reference Class:** Industrial Centrifugal Pump Model X, standard pressure/temperature. (Pass)
  2.  **Claims Data:** 40,000 hours, 3 failures. Threshold met. (Pass)
  3.  **Physics Model:** Validated for lab conditions, not field maintenance. (Fail on boundary match).
  4.  **Expert Elicitation:** N/A.
  5.  **Primary Source:** Rule A (Claims Data).
  6.  **Prudence Factor:** Data is near lower threshold (40k vs 50k ideal). Apply PF = 1.2. Final Rate = 0.09 per 1k hours.
  7.  **Stop Condition:** Claims and Physics contradict, but Claims satisfy frequency threshold. Physics discarded due to boundary mismatch. Proceed.
  8.  **Audit Note:** Reference class is field-operated Pump X. Claims data used as primary frequency source. Physics model rejected as it assumes ideal maintenance not present in fleet. Prudence factor 1.2 applied for limited exposure volume.

  **Judgment Dressed as Arithmetic:**
  The decision to discard the physics model entirely is a judgment call that "field conditions" dominate "theoretical capacity." The 1.2 Prudence Factor is an arbitrary scalar to satisfy the audit committee's requirement for a single number despite the model conflict.

  Verdict: DATA_DRIVEN — Observed frequency overrides theoretical disposition.

  ***

  ### FILE 2: NEW DESIGNED BEARING

  **Inputs:**
  *   **Claims:** 0 hours, 0 failures. (Data Sparse).
  *   **Physics:** Clean rate of 0.001 per 1k hours.
  *   **Experts:** Uniformly confident in design robustness.

  **Procedure Execution:**
  1.  **Reference Class:** New Alloy Bearing Model Y, design spec conditions. (Pass)
  2.  **Claims Data:** 0 hours. (Data Sparse).
  3.  **Physics Model:** Validated against design spec. (Pass).
  4.  **Expert Elicitation:** Consensus achieved. (Pass).
  5.  **Primary Source:** Rule B (Physics Model).
  6.  **Prudence Factor:** New technology, zero history. Apply PF = 2.0. Final Rate = 0.002 per 1k hours.
  7.  **Stop Condition:** No contradiction. Proceed.
  8.  **Audit Note:** Reference class is design specification. Physics model used due to zero claims history. Prudence factor 2.0 applied to account for "infant mortality" risk not captured in steady-state physics.

  **Judgment Dressed as Arithmetic:**
  The Prudence Factor of 2.0 is not derived from data; it is a capital charge disguised as a probability adjustment to satisfy the "point estimate" constraint in the absence of frequency data.

  Verdict: MODEL_DERIVED — Physics rate loaded for zero-history risk.

  ***

  ### FILE 3: UNENCOUNTERED OPERATING CONDITION

  **Inputs:**
  *   **Claims:** Silent (Condition never existed in fleet). (Data Sparse).
  *   **Physics:** Mechanism real, rate rare (0.0001 per 1k hours).
  *   **Experts:** Disagree wildly (Range 0.0001 to 0.05). (Expert Divergent).

  **Procedure Execution:**
  1.  **Reference Class:** Machine Z under High-Thermal-Shock condition. (Pass).
  2.  **Claims Data:** 0 hours on this condition. (Data Sparse).
  3.  **Physics Model:** Validated for mechanism, but rarity implies high variance. (Pass).
  4.  **Expert Elicitation:** Variance > 500x. (Expert Divergent).
  5.  **Primary Source:** Rule D triggered (Data Sparse + Expert Divergent).
  6.  **Prudence Factor:** N/A.
  7.  **Stop Condition:** Triggered. No frequency data to resolve expert disagreement; physics model admits rarity but cannot quantify variance in untested conditions. A single number would be misleading.
  8.  **Audit Note:** Reference class is Machine Z under untested thermal shock. No claims history exists. Expert opinion is non-consensual. Physics confirms mechanism but cannot quantify rate for this envelope. Risk declared unquantifiable. Recommend policy exclusion or mandatory prototype testing before underwriting.

  **Judgment Dressed as Arithmetic:**
  Declaring the risk "unquantifiable" is a judgment that reputational and regulatory risk exceeds the premium income from pricing this file. The arithmetic stops to prevent fabricating precision.

  Verdict: UNQUANTIFIABLE — Inputs contradict without data to resolve.

  ***

  Bottom line: A defensible number requires a hierarchy of evidence, not an average of incomparables.
