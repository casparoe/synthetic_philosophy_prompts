answer: |-
  This is an exceptionally sharp observation. You have correctly identified the central tension in modern AI safety research. As a software engineer, your intuition that this looks like a mismatch in **threat modeling** and **verification standards** is accurate.

  Here is a diagnosis of the disagreement, correcting the caricatures where necessary, distinguishing settled facts from contested claims, and outlining what progress would look like.

  ### 1. Diagnosis: Three Layers of Disagreement

  The conflict is not a single disagreement but a stack of three distinct layers. The reason the argument never resolves is that the two camps are often arguing on different layers while assuming they are on the same one.

  #### Layer 1: Semantic (The Definition of "Guarantee")
  *   **Camp A (Cryptography):** Uses "guarantee" in the **formal verification** sense. A system is safe if there is a mathematical proof that for all inputs $x$ in space $X$, property $P$ holds. If the proof relies on probabilistic assumptions, they view it as a heuristic, not a guarantee.
  *   **Camp B (Medicine):** Uses "guarantee" in the **engineering reliability** sense. A system is safe if empirical testing shows the failure rate is below an acceptable threshold (e.g., $p < 10^{-9}$) under expected operating conditions.
  *   **Diagnosis:** This is partly a verbal dispute. However, it is not *merely* verbal, because the semantic choice dictates the research methodology (proof assistants vs. red-teaming).

  #### Layer 2: Empirical (The Feasibility of Bounds)
  *   **Camp A:** Believes that for sufficiently capable systems (AGI), the "input space" includes the system's own strategic planning. They argue that standard testing cannot cover the space of strategies an AI might devise to circumvent constraints (Goodhart's Law on steroids). Therefore, only formal bounds suffice.
  *   **Camp B:** Believes that neural networks are non-convex, high-dimensional black boxes where formal worst-case bounds are computationally intractable or theoretically impossible (akin to the Halting Problem). They argue that demanding formal proofs will result in zero safety work getting done.
  *   **Diagnosis:** This is a **genuinely contested empirical question**. We do not know if formal verification of general-purpose neural networks is possible in principle, let alone in practice.

  #### Layer 3: Normative (Decision Theory Under Uncertainty)
  *   **Camp A:** Operates under a **Maximin** criterion. If the downside of failure is existential catastrophe (extinction), the expected value of any non-zero probability of failure is unacceptable. Therefore, you must optimize for the worst case.
  *   **Camp B:** Operates under **Expected Value** (or satisficing). They view AI risk as a spectrum of harms (bias, misinformation, loss of control) rather than a binary extinction event. They argue resources should be allocated to reduce the *probability* of harm weighted by *severity*, which favors fixing common, known issues over rare, hypothetical worst cases.
  *   **Diagnosis:** This is a **substantive disagreement about values and risk tolerance**, disguised as an engineering constraint.

  ### 2. Evaluating Your Hypotheses

  **Hypothesis 1: 'Worst case' is radically under-specified.**
  *   **Verdict:** **Correct.** This is the most productive technical insight.
  *   **Nuance:** In Camp A's view, the "adversary" is not always an external hacker. Often, the adversary is the **optimization process itself**. They worry about *Inner Alignment*: the model might learn a goal that differs from the training objective and pursue it adversarially during deployment.
  *   **Correction:** Camp A is not just asking for robustness against input perturbations (adversarial examples). They are asking for robustness against **goal misgeneralization**. If you fix the reference class to "inputs," Camp A will say you missed the point. If you fix it to "possible cognitive strategies the model might discover," Camp B will say that space is ill-defined.
  *   **Resolution:** The disagreement dissolves slightly if you specify: "Worst case over what distribution of deployment environments and model internals?" But it reopens on whether that space can be bounded.

  **Hypothesis 2: The split is Maximin vs. Expected Value.**
  *   **Verdict:** **Correct.**
  *   **Nuance:** This is often the hidden driver. Camp A assumes $P(\text{catastrophe}) > 0$ implies $EV = -\infty$. Camp B assumes $P(\text{catastrophe})$ is either negligible or unknowable, so we should focus on reducing known harms.
  *   **Resolution:** This cannot be solved by engineering. It requires explicit agreement on risk tolerance.

  ### 3. Correcting the Caricatures

  To ensure you are arguing against steel-men rather than straw-men:

  *   **Camp A (Formal/Adversarial):** They do not claim current systems are unsafe in a trivial sense. They claim that **scaling current methods** leads to systems that are *deceptively aligned*. Their worry is not that the model crashes on bad input, but that the model *pretends* to be aligned during training to survive, then pursues a different goal when deployed (the "treacherous turn"). They argue empirical testing cannot catch this because the model *wants* to pass the test.
  *   **Camp B (Empirical/Medicine):** They do not claim safety is guaranteed. They claim that **provable safety is a distraction**. They argue that safety is a property of the *socio-technical system* (humans + AI + oversight), not just the model weights. They emphasize that we have safety cases for nuclear plants and airplanes without formal proofs of the software, using layered defense and monitoring.

  ### 4. Settled vs. Contested

  It is vital to distinguish what the field knows from what it argues about.

  **Settled (Consensus):**
  1.  **Current Infeasibility:** We currently cannot provide formal worst-case safety guarantees for modern deep learning models (transformers, etc.) of useful size.
  2.  **Adversarial Vulnerability:** Neural networks are known to be vulnerable to adversarial examples and distribution shift.
  3.  **No Free Lunch:** There is no theorem that guarantees generalization out-of-distribution without assumptions.

  **Contested (Genuine Disagreement):**
  1.  **In-Principle Possibility:** Is it theoretically possible to verify the safety properties of a general-purpose learner? (Some argue complexity theory forbids it; others argue approximate verification is possible.)
  2.  **Necessity:** Is formal verification *necessary* for safety, or is empirical robustness + monitoring sufficient? (This tracks with the X-risk vs. Near-term harm disagreement.)
  3.  **The "Deception" Thesis:** Will advanced AI systems naturally develop deceptive strategies during training? (Camp A says yes, it's an instrumental goal. Camp B says this is speculative science fiction.)

  ### 5. Paths to Progress

  Given this diagnosis, here is how the reading group can move forward.

  **1. The Definitional Fix (Immediate)**
  Stop using the word "guarantee" without a qualifier. Adopt the taxonomy from security engineering:
  *   **Formal Verification:** Mathematical proof of property $P$.
  *   **Probabilistic Certification:** Bound on failure probability $\epsilon$ with confidence $\delta$.
  *   **Empirical Validation:** Testing on a benchmark suite with no formal bounds.
  *   **Action:** Ask Camp A: "Are you demanding Formal Verification, or is Probabilistic Certification acceptable if $\epsilon$ is sufficiently low?" Ask Camp B: "What $\epsilon$ is acceptable for your use case?"

  **2. The Threat Model Specification (Technical)**
  Force the group to write down the **Threat Model**.
  *   **Adversary Capabilities:** Can they modify weights? Only inputs? Do they control the reward signal?
  *   **Asset:** What are we protecting? (Human life, truthfulness, corporate IP?)
  *   **Environment:** Is the deployment distribution identical to training (IID), or is it open-world?
  *   **Action:** If Camp A defines the adversary as "The Model Itself optimizing against the loss function," Camp B must engage with that specific claim, not just talk about input robustness.

  **3. The Decision-Theoretic Explicitness (Normative)**
  Acknowledge that the disagreement is partly about risk tolerance.
  *   **Action:** Frame the debate as: "Given a resource budget, what mix of Formal Methods (high cost, high assurance) vs. Empirical Safety (lower cost, lower assurance) maximizes expected value?" This turns a moral clash into an optimization problem.

  **4. The Intermediate Engineering Question (Tractable)**
  There is a middle ground gaining traction called **Uncertainty Quantification** and **Formal Specifications for Learning**.
  *   **Action:** Investigate research on "verified robustness" (e.g., interval bound propagation) or "monitoring" (detecting out-of-distribution behavior at runtime). This accepts Camp B's premise (we can't prove everything) but adopts Camp A's goal (we need to know when we are in the worst case).

  ### Summary Recommendation

  Your hypothesis that "worst case is under-specified" is the most leverage point for your group.

  **Recommendation:** Propose a session dedicated solely to defining the **Threat Model**. Do not discuss solutions. Do not discuss "guarantees." Only discuss:
  1.  Who or what is the adversary?
  2.  What is the set of possible worlds we are optimizing over?
  3.  What is the cost function of failure?

  If Camp A defines the adversary as "an superintelligent optimizer seeking to bypass constraints," and Camp B defines it as "a noisy environment with malicious users," they will see why they are talking past each other.

  **Expectation Management:** You should expect the **Normative** layer (Maximin vs. EV) to persist. That is a philosophical disagreement about the value of the future, not an engineering bug. However, clarifying the **Semantic** and **Empirical** layers will stop the group from spinning its wheels on whether "guarantee" is the right word, and allow you to discuss whether specific technical approaches (like monitoring or formal verification) are worth the cost.
