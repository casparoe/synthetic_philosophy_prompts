  *Decision:* I will make the **Terminal Prognosis** case classify as Self-Deception (technically), which creates the ethical tension. I will make the **Drinking** case classify as Strategic Impression Management (which frustrates the "denial model"). I'll pick the Terminal one as the primary "uncomfortable" one for the closing argument.

