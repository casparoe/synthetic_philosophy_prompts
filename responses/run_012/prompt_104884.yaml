answer: |-
  The sentence "Natural selection shaped our moral beliefs for their fitness, not for their truth" is a slogan that conceals a multi-premise argument. When a participant treats it as a conversation-stopper, they are conflating empirical claims about biology with modal claims about metaphysics and normative claims about epistemology.

  To see why it does not settle the debate, we must disentangle the four distinct propositions embedded in or entailed by that sentence. I have arranged them from the most conceptual (nearly analytic) to the most strongly empirical.

  ### 1. The Epistemic Defeater Principle
  **Proposition:** *If a belief-forming process is explained by causes unrelated to the truth of the beliefs, those beliefs are unjustified (or we have no reason to trust them).*

  *   **Status:** **Contentious.**
  *   **Analysis:** This is the engine of the debunking argument. It is not analytic; it is a substantive claim in epistemology. Externalists (reliabilists) may reject it, arguing that if the process *actually* produces true beliefs, the origin doesn't matter. Internalists may accept it, arguing we need a reason to think the process is reliable.
  *   **Settlement:** Settled only by resolving deep disputes in epistemology regarding the nature of justification (e.g., is justification internal or external? Does genealogy defeat knowledge?).

  ### 2. The Modal Independence Claim
  **Proposition:** *The evolutionary pressures that shaped our moral beliefs were independent of the moral truth (i.e., there is no necessary or reliable link between reproductive fitness and moral correctness).*

  *   **Status:** **Contentious (Metaphysical).**
  *   **Analysis:** This is the core metaphysical claim. It asserts that the "fitness" track and the "truth" track do not converge. A moral realist might argue that true moral beliefs (e.g., "cooperation is good") *enhance* fitness, meaning selection *did* track truth. An anti-realist (like Sharon Street) argues that if realism is true, such a correlation would be a miraculous coincidence.
  *   **Settlement:** Settled by metaethical argument. One must demonstrate either that moral truths necessarily promote fitness (realist response) or that the assumption of such a link is implausible given the nature of selection (debunker response).

  ### 3. The Selective Teleology Claim
  **Proposition:** *Natural selection operated on our moral capacities specifically to maximize reproductive fitness, rather than as a byproduct of a general truth-tracking capacity.*

  *   **Status:** **Contentious (Empirical/Theoretical).**
  *   **Analysis:** This is a claim about evolutionary biology. It assumes moral beliefs are direct adaptations selected *for* their specific content's utility in survival. It excludes the possibility that moral reasoning is a "spandrel" (a byproduct of general intelligence) or that truth-tracking itself was the selected trait because it aids survival in other domains.
  *   **Settlement:** Settled by empirical research in evolutionary psychology and biology regarding whether moral modules are specific adaptations or side-effects of general cognition.

  ### 4. The Causal Origin Claim
  **Proposition:** *Evolutionary forces causally influenced the content of human moral beliefs.*

  *   **Status:** **True (Strongly Empirical).**
  *   **Analysis:** This is the most robust claim. It is widely accepted that human psychology, including the predisposition to normative thinking, is a product of evolutionary history.
  *   **Settlement:** Effectively settled by the consensus of modern biology and cognitive science.

  ---

  ### Licensing the Debunker's Conclusion

  To license the conclusion that **our moral beliefs are unjustified**, the argument requires all four propositions to hold. However, the heavy lifting is done by **Proposition 1 (The Epistemic Defeater Principle)** and **Proposition 2 (The Modal Independence Claim)**.

  If Proposition 1 is false (e.g., on a reliabilist view where origins don't defeat justification if the output is reliable), the debunking fails even if evolution shaped us for fitness. If Proposition 2 is false (e.g., if moral truth *does* track fitness), then selection *did* select for truth, and the "not for truth" clause is false.

  The slogan is treated as a conversation-stopper only when the speaker assumes Proposition 1 is self-evident and Proposition 2 is an obvious consequence of Proposition 3 and 4. This is the error.

  ### Analysis of Standard Rejoinders

  The standard rejoinders succeed or fail depending on which of the four propositions they target.

  **1. The Companions-in-Guilt Rejoinder**
  *   **Argument:** If this reasoning debunks morality, it also debunks logic, mathematics, and induction, as our capacities for these were also shaped by evolution for fitness. Since we trust logic/math, we should trust morality (or we must be skeptics about everything).
  *   **Target:** Primarily **Proposition 1** and **Proposition 2**.
  *   **Effectiveness:** It forces the debunker to explain why moral beliefs are uniquely vulnerable compared to logical beliefs. If the debunker admits logic is also debunked, they face a *reductio ad absurdum* (total skepticism is unlivable). If they claim logic *was* selected for truth, they must explain why morality wasn't, which pressures **Proposition 2**.
  *   **Verdict:** This engages the **strong reading**. It challenges the Epistemic Defeater Principle by showing its scope is too broad.

  **2. The Byproduct (Spandrel) Rejoinder**
  *   **Argument:** Moral reasoning may not be a specific adaptation for fitness but a byproduct of a general capacity for reasoning that *is* truth-tracking.
  *   **Target:** **Proposition 3**.
  *   **Effectiveness:** It undermines the claim that selection operated *specifically* for fitness *instead* of truth. If we have a general truth-tracking engine, moral beliefs might inherit that reliability.
  *   **Verdict:** This engages the **empirical reading**. It weakens the link between fitness and moral content, suggesting the "not for truth" clause is empirically unsupported.

  **3. The "Proves Too Much" Charge**
  *   **Argument:** Similar to Companions-in-Guilt, but focuses on the self-defeating nature of the argument. If all beliefs are evolutionarily shaped, the debunker's own belief in the debunking argument is shaped for fitness, not truth.
  *   **Target:** **Proposition 1**.
  *   **Effectiveness:** It attempts to show the Epistemic Defeater Principle is self-referentially incoherent.
  *   **Verdict:** This engages the **strong reading**. It forces the debunker to carve out an exception for their own philosophical reasoning, which requires nuance they often lack in the slogan form.

  ### Conclusion: Charitable vs. Collapsed Readings

  **The Charitable Reading:**
  In the hands of a sophisticated proponent (like Sharon Street or Richard Joyce), the sentence is shorthand for the **Modal Independence Claim (Proposition 2)** coupled with the **Epistemic Defeater Principle (Proposition 1)**. It is a challenge to the realist to explain the *coincidence* between fitness and truth. Charitably, it is not a claim that moral beliefs are *false*, but that the realist has no *explanation* for why they would be true given their genealogy. This reading is philosophically potent and survives the Causal Origin Claim alone.

  **The Collapsed Reading:**
  When repeated approvingly in casual debate, the sentence tends to collapse into the **Genetic Fallacy**. It conflates **Proposition 4 (Causal Origin)** directly with the conclusion, ignoring the need for Propositions 1, 2, and 3. It becomes: "You only believe X because of evolution, therefore X is unjustified." This weaker reading is easily defeated by noting that *all* beliefs have causal origins, including the belief in evolution itself. The participant in your reading group likely treated the slogan as settling the debate because they were operating on this collapsed reading, mistaking a biological fact (Proposition 4) for an epistemic defeater (Proposition 1).
