answer: |-
  This is an exceptionally sharp framing of the problem. You are correct that the literature often obscures the functional role of the concept behind the metaphysical debate. For a criminology seminar, the stakes are not whether the universe is deterministic, but whether our practices of holding people accountable are intelligible and justifiable.

  Below is a specification of the desiderata for "free will worth wanting," structured by the function they serve. I have marked which appear to be **Genuine** (required for the practice to function as described) and which are **Contested/Prejudicial** (required only by specific normative theories of punishment). Following the list, I address the joint satisfiability of these requirements, your Ravi/Nia case, and the indexing problem.

  ### I. The Desiderata Specification

  #### A. Phenomenological & Deliberative Requirements
  *These concern the first-person experience of agency and the prerequisites of practical reasoning.*

  **1. The Openness Condition**
  *   **Specification:** At the moment of deliberation, the agent must represent multiple futures as genuinely accessible. The outcome of deliberation cannot present itself as a foregone conclusion.
  *   **Motivation:** The phenomenology of deliberation. To deliberate is to weigh options; if the outcome is viewed as fixed prior to the weighing, deliberation becomes a charade (the "idle argument").
  *   **Status:** **Genuine** (for the deliberator). Hard to deny that effective agency requires the *experience* of openness, even if metaphysical openness is illusory.

  **2. The Rationality Condition**
  *   **Specification:** The transition from reason to action must be intelligible. The action must be explainable by the agent's reasons, not merely by physiological causes or random noise.
  *   **Motivation:** Distinguishing agency from chaos or reflex. If an action does not track reasons, it cannot be a *choice* in the normative sense.
  *   **Status:** **Genuine.** Without this, we cannot distinguish a decision from a seizure or a twitch.

  #### B. Normative & Juridical Requirements
  *These concern the legitimacy of blame, punishment, and moral address.*

  **3. The Sourcehood Condition**
  *   **Specification:** The action must originate in the agent in a way that distinguishes it from actions where the agent is merely a conduit for external forces.
  *   **Motivation:** The distinction between the *coerced* and the *merely caused*. A threat of violence (coercion) undermines responsibility; the causal influence of one's character (mere causation) typically does not.
  *   **Status:** **Genuine.** Essential for distinguishing excuse (I had no choice) from explanation (I chose this because I am cruel).

  **4. The Fair Opportunity Condition**
  *   **Specification:** To deserve hard treatment (punishment), the agent must have had a fair chance to avoid the wrongdoing.
  *   **Motivation:** The intuition that punishment is unjust if the agent *could not have done otherwise*. This grounds the thought "I ought to have done otherwise."
  *   **Status:** **Contested/Prejudicial.** This is the core commitment of **Retributivism**. Consequentialist or Rehabilitative models of punishment may not require this; they only require that the agent is *modifiable* or *dangerous*. If your seminar assumes retributive desert is the goal, this is Genuine. If the goal is social protection, it is Prejudicial.

  **5. The Exemption/Excuse Distinction**
  *   **Specification:** The account must distinguish between factors that mitigate blame for a specific act (Excuse: duress, ignorance) and factors that remove agency altogether (Exemption: insanity, infancy, hypnosis).
  *   **Motivation:** Legal and moral practice treats the insane differently from the coerced. The former are not appropriate targets of blame *at all*; the latter are blameless *this time*.
  *   **Status:** **Genuine.** Any workable legal system requires this distinction.

  #### C. Metaphysical & Scientific Constraints
  *These are the boundaries set by our best understanding of the world.*

  **6. The Constitution Constraint**
  *   **Specification:** The account must acknowledge that the agent did not choose their initial psychological constitution (genes, upbringing, neural architecture).
  *   **Motivation:** The "Luck of Birth." We cannot be responsible for the raw materials of our character.
  *   **Status:** **Genuine.** Supported by developmental psychology and genetics.

  **7. The Causal Closure Constraint**
  *   **Specification:** The account should not require violations of the laws of physics (e.g., uncaused mental events that alter physical brain states in violation of conservation laws).
  *   **Motivation:** Scientific naturalism. Decision sciences suggest choices are the result of neural processing.
  *   **Status:** **Genuine** (for naturalists). Dualist accounts reject this, but they carry high ontological costs.

  ---

  ### II. The Ravi and Nia Intervention

  Your case of Ravi (determined) and Nia (indeterministic) is a variation of the "Mind Argument" or the "Luck Objection" (often associated with Galen Strawson or Alfred Mele).

  **The Analysis:**
  If Ravi and Nia are identical up to the moment of choice, and their deliberation, reasons, and psychology are identical, the introduction of indeterminism in Nia's world adds **randomness**, not **control**.
  *   If Ravi's choice is determined by his reasons, he owns it.
  *   If Nia's choice is tipped by an indeterministic event, that event is not determined by her reasons. It is a luck-event.

  **Which Requirement does this challenge?**
  It challenges **Requirement 4 (Fair Opportunity)** if that requirement is interpreted as requiring *Categorical Alternative Possibilities* (the ability to do otherwise in the exact same circumstances).
  *   If you insist Nia has free will and Ravi does not because Nia *could* have done otherwise (metaphysically), you must explain why the *mechanism* of that "could" (randomness) enhances her agency. It does not. It makes her less rational (violating **Requirement 2**).
  *   If you insist Ravi has free will, you must show that "could have done otherwise" is compatible with determinism (Compatibilism).

  **Verdict on the Case:**
  The Ravi/Nia case suggests that **Indeterminism is not a desideratum.** It is a false requirement often smuggled into Requirement 4. What is worth wanting is not the *metaphysical ability to do otherwise*, but the *possession of capacities* (reasons-responsiveness) that would have produced a different outcome *if* the reasons had been different. Nia gains nothing over Ravi. In fact, Ravi is the more intelligible agent because his action is fully explained by his reasons, whereas Nia's action contains an unexplained residue.

  ---

  ### III. Joint Unsatisfiability: The Impossible Demand

  You asked whether some subset of these requirements is jointly unsatisfiable. **Yes.** The list, taken as a whole, describes an impossible entity. This is the "Hard Incompatibilist" conclusion, but it can be framed functionally.

  **The Conflict:**
  1.  **Requirement 6 (Constitution)** states we do not choose our causes (our character/reasons).
  2.  **Requirement 3 (Sourcehood)** states we must be the source of our actions.
  3.  **Requirement 4 (Fair Opportunity)** states we must be able to do otherwise to deserve blame.

  If our actions flow from our character (Requirement 2 & 3), and we did not choose our character (Requirement 6), then we are not the *ultimate* source of our actions. If we are not the ultimate source, we could not have done otherwise in the ultimate sense (violating Requirement 4).

  **The "Gap" is the Whole Story:**
  You asked if the gap between the deliberator and the blamer is a nuisance or the whole story. **It is the whole story.**
  *   **From the Standpoint of the Deliberator:** Requirement 1 (Openness) is satisfied by the *ignorance* of the future. I do not need metaphysical indeterminism to deliberate; I only need epistemic uncertainty. Ravi can deliberate perfectly well.
  *   **From the Standpoint of the Blamer:** Requirement 4 (Fair Opportunity) demands a metaphysical grounding that the Deliberator does not need. The Blamer wants to say, "You *could* have done otherwise," implying a power that transcends the agent's constitution.

  **Conclusion on Unsatisfiability:**
  We can satisfy the Deliberator's needs (Compatibilism works fine here). We can satisfy the Blamer's needs *if* we lower the bar to "Reasons-Responsiveness" (Strawsonian Compatibilism). But we cannot satisfy the Blamer's needs *if* the Blamer demands **Retributive Desert based on Ultimate Responsibility**. That specific combination (Retributivism + Naturalism) is jointly unsatisfiable.

  ---

  ### IV. Indexing: A Proposal for the Seminar

  For your criminology students, I recommend presenting the "Free Will" not as a single property, but as two distinct concepts that are often conflated. This resolves the tension without solving the metaphysics.

  **1. Agency-Capacity (Forward-Looking)**
  *   **Purpose:** Deliberation, Planning, Rehabilitation.
  *   **Requirement:** Reasons-responsiveness. Can the agent understand rules and adjust behavior?
  *   **Satisfied by:** Ravi and Nia equally.
  *   **Criminological Utility:** Determines *competency* to stand trial and potential for *reform*.

  **2. Desert-Status (Backward-Looking)**
  *   **Purpose:** Blame, Retribution, Censure.
  *   **Requirement:** Ultimate Sourcehood (often implied).
  *   **Satisfied by:** Neither Ravi nor Nia (if Constitution Constraint holds).
  *   **Criminological Utility:** Determines the *justification for punishment severity*.

  **The Meta-Requirement (Troubling the Frame):**
  I suggest adding one final requirement to your list, which may dissolve the problem:

  **8. The Pragmatic Coherence Condition**
  *   **Specification:** The account of free will must not undermine the social practices it is meant to ground.
  *   **Motivation:** P.F. Strawson's argument in "Freedom and Resentment." Even if we lack metaphysical free will, we cannot cease holding reactive attitudes (resentment, gratitude) without ceasing to be human.
  *   **Implication:** This suggests that "Free Will" is not a fact we discover, but a status we confer. The question shifts from "Do they have it?" to "Under what conditions is it permissible to treat them as having it?"

  ### Summary for the Seminar

  If you want the students to grasp the presuppositions of punishment, guide them to this conclusion:

  1.  **The Ravi/Nia case proves** that indeterminism is not the "freedom" we need for responsibility. It adds luck, not control.
  2.  **The Desiderata List reveals** that we want two incompatible things: to be products of our character (for intelligibility) and not products of our character (for ultimate responsibility).
  3.  **The Indexing Gap shows** that the "Free Will" required to *plan a crime* (deliberation) is not the same as the "Free Will" required to *justify harsh punishment* (desert).
  4.  **The Criminological Upshot:** If we accept the Constitution Constraint (Requirement 6), **Retributive Punishment** (Requirement 4) is unjustifiable. However, **Responsibility Practices** (Requirement 3 & 5) remain necessary for social life. The seminar should therefore focus not on whether criminals have free will, but on whether our *punishment practices* can be justified without it (e.g., shifting from retribution to quarantine, rehabilitation, or moral education).

  This moves the seminar from metaphysics to political philosophy and penology, which is likely where the most fruitful criminological work lies.
