      *Wait, one more check:* The user asks "which of my verdicts I would have to give up if I wanted a cleaner account."
      If they adopt pure Sufficiency: They might have to compensate the temperament brother *if* he falls below sufficiency. They currently say "no claim" regardless of income level? The prompt says "passed over for the same jobs." Implies lower income. If lower income < sufficiency, user *should* help. If user says "no help even if poor," then it's not Sufficiency.
      If they adopt pure Luck Egalitarianism: They must help the expensive tastes friend. They currently say no.
