      *   *Clause 4 (Windfalls):* Unchosen gains are kept, provided they don't undermine the system (foreseeability caveat). (Case 6).
      *   *Clause 5 (Social Relativity):* The definition of "participation" is context-dependent. (Case 8).

      *   *The New Case (Devalued Trade):* Woman trains, market shifts.
          *   Chosen training? Yes.
          *   Unchosen devaluation? Yes.
          *   Does it threaten participation? If she can't find work and falls below sufficiency, yes. If she just earns less but is fine, no.
          *   *Prediction:* Based on Case 2 (stock) and Case 6 (windfall), the user likely feels *some* sympathy but no full indemnification unless she hits the floor. It's a "shared risk" of social cooperation.

      *   *Coherence Check (What to give up):*
          *   *Tension:* Case 5 (Expensive Tastes) vs. Case 4 (Medical). Both are unchosen. Why is one compensated and not the other?
              *   *Standard LE view:* Compensate both.
              *   *User view:* Only medical.
              *   *Reasoning:* Medical is necessary for participation; tastes are not. This holds.
          *   *Tension:* Case 3 (Temperament) vs. Case 7 (Illness/Thrift). Both unchosen psychological traits affecting income.
              *   *User view:* Case 7 gets help, Case 3 does not.
              *   *Reasoning:* Case 7 leads to "insecurity and dependency" (fails participation). Case 3 is just "passed over" (still participating, just lower status/income).
              *   *Cost:* This requires a strict definition of "participation" that ignores relative inequality. If the temperament brother is significantly poorer, does he still "participate"? If the user says yes, they must accept significant inequality.
          *   *Tension:* Case 6 (Windfall). User says she keeps it, but "if foreseeable I would feel differently." This implies a concern with *fairness of procedure* rather than just outcome.
          *   *Major Incoherence:* The distinction between Case 3 (Temperament) and Case 7 (Illness/Thrift) is the shakiest. Both are unchosen psychological impediments to earning. The only difference is severity (dependency vs. passed over). If severity is the metric, then "Luck" isn't the trigger, "Need/Sufficiency" is. The luck talk is indeed post-hoc rationalization (Maya's point).

      *   *Recommendation:*
          *   The user is essentially a **Relational Sufficientarian**.
          *   Maya (Relational Egalitarian) is close, but the user cares more about the *history* (choice vs. luck) than Maya does.
          *   Pure Luck Egalitarianism is too demanding (expensive tastes).
          *   Pure Relational Egalitarianism ignores the user's desire to hold people responsible for gambles (Case 2).
          *   *Best Fit:* **Democratic Equality (Anderson)** or **Sufficientarianism**.
          *   *Cost:* The user must admit that "Luck" is not the fundamental moral currency. "Status/Functioning" is. Luck is only evidence of whether the status is threatened through no fault of their own.
          *   *Verdict to Drop:* The user needs to stop pretending Case 3 and Case 7 are different *in kind*. They are different only in *degree*. If the temperament brother becomes poor enough to lose status, he gets help. If the illness brother remains wealthy despite dependency, he might not need help. The *luck* isn't the trigger; the *exclusion* is.

  6.  **Refining the Output:**
      *   Structure the response clearly.
      *   Define the principle.
      *   Map the cases.
      *   Address the new case.
      *   Address the coherence/incoherence question directly.
      *   Advise on the "Standard Position."

      *(Self-Correction during drafting)*: I need to be careful not to just say "You are a Sufficientarian." I need to explain *why* their specific intuitions map there and where the friction points are. The user specifically asked: "Tell me what principle... actually fits these verdicts."
      The principle is: **"Guarantee the social bases of self-respect and functioning for all, but do not equalize outcomes resulting from voluntary gambles or unchosen traits that do not threaten those bases."**

      *Wait, Case 6 nuance:* "If the boom had been foreseeable I would feel differently." This suggests a concern with *unfair advantage* or *rent-seeking*, not just luck. I should note that.

      *Wait, Case 5 nuance:* Expensive tastes. User says "born with it." LE says compensate. User says no. This is the classic Anderson critique of LE. This confirms the user is *not* a Luck Egalitarian.

      *Wait, Case 3 vs 7:* This is the crux. Why is temperament (unchosen) not compensable but illness-induced dependency (unchosen) compensable?
      *Answer:* Because temperament allows participation (just less success), while dependency prevents it.
      *Conclusion:* Maya is mostly right. The luck distinction is secondary to the participation distinction.

      *Final Plan:*
