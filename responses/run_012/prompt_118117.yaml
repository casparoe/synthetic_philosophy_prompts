          *   Case 3 (Temperament): Fits (passed over but presumably still a participant? Or is "participation" defined narrowly?). User says "no claim." This fits if the brother is still *sufficiently* participating.
          *   Case 4 (Medical): Fits (health needed for participation).
          *   Case 5 (Tastes): Fits (ordinary salary allows participation; wine/first-class do not).
          *   Case 6 (Windfall): Fits (keeping money doesn't stop others participating? Or does it?).
          *   Case 7 (Illness/Thrift): Fits (insecurity/dependency stops participation).
