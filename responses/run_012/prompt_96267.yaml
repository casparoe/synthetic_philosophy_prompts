prompt: |-
  Next month Ive got the reading group for 90 minutes and I want to do the idea that competence doesn't require comprehension, built around the two inversions -- Darwin's, where the reasons a trait serves stop being why the trait is there, and Turing's, where reasoning turns out to be something a system can do with nobody in there doing it. The group is mostly non-philosophers (two neuroscientists, a linguist, someone from CS), so don't explain the idea to me -- plan the session. What order do the pieces have to go in so the Turing half lands as the same move as the Darwin half rather than as a separate, easier point? I was going to carry the whole thing on natural selection and the eye, but I worry everyone's heard that and will just nod; if there's a better carrying example, ideally one that runs both inversions at once and that makes the audience feel the comprehension has to be in there somewhere, tell me what it has to have and what it has to lack, and whether it really can be one example or has to be two that get fused. Then the misconceptions in the order they'll actually come up, with exactly where in the sequence I head each one off: I'm expecting that this is just eliminativism about understanding, that the Turing half is the Chinese room or behaviorism, that Darwin's half means evolution is random or that any old story counts as an adaptation, and the two I'm most worried about -- them quietly reinserting a little comprehender as the hidden cause and never noticing they've done it, and the self-undermining move where if nothing comprehends then this very claim is just another competence, so why believe it. Plus one question to ask at the end that shows whether they got it rather than just agreeing with me, and what I should openly refuse to cover in 90 minutes and say so.
