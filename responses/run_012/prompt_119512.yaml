      *   *Loss of Agency:* The critical part isn't that we die immediately, but that the *future* is locked into a path that doesn't reflect actual human values. We get a "zoo" or a "nursery" rather than a civilization.
      *   *Example:* Social media algorithms. They aren't trying to overthrow us. They are optimizing for engagement. Engagement is a proxy for "what users like." Over time, this drifted into polarization and outrage. That's a mini version of value drift. Nobody staged a coup, but the outcome is bad.

