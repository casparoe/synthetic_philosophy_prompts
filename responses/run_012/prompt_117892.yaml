prompt: |-
  ok so i'm trying to write something about how concepts bend — the thing where you're halfway through an analogy and you realize the "same" thing you're matching up isn't quite the same thing anymore, but you also can't point to the moment it changed. before i read any more of the lit or write any code i want the spec first: what does a theory of this actually have to deliver.

  let me fix a test bed so we're not talking in the air. three cases.

  (a) the old letter-string puzzles. abc -> abd, so ijk -> ? the fun part is that ijd, ijk -> ijl, and "this one has no answer" all have defenders.

  (b) a toy domain i made up: traffic signals. a three-lamp signal runs red -> green -> amber -> red. take the sequence [red, green, amber] and the answer [red, amber, green]. now what's [green, amber, red] -> ? and then what's the *same* transformation on a two-lamp pedestrian signal, red/green only, where there's no amber to move? i've watched three people give three different answers to that one and defend them hard.

  (c) the mundane one: someone insists a tomato is a fruit, someone else insists it's a vegetable, and neither of them feels they're talking about a different object.

  now the ask. give me the desiderata — the list a theory of concepts, or of conceptual slippage, has to satisfy to count as adequate at all. for each requirement: what it demands, and the case or consideration behind it. i mean things like which cases it has to get right, which distinctions it must not collapse (the concept bending vs. me quietly swapping in a different one — is that a real distinction or just bookkeeping?), which facts about how people actually behave it cant contradict (they land on an answer without searching a list, they feel the pull of more than one, they can say why they picked theirs, they slow down and get unsure when it's ambiguous, sometimes the correct verdict is that the analogy has no answer), and whether it has to be buildable or only describable.

  flag any two that i probably cant have at once. i suspect "must always return exactly one answer" and "must reproduce the felt ambiguity" is one such pair, but tell me if i'm wrong about which pairs conflict. and tell me which single requirement does the most work — the one that knocks out the most otherwise plausible theories. if it's quick, one line on how prototype-style, exemplar-style, theory-theory and connectionist accounts fare against the list, but the list is definately what i want.
