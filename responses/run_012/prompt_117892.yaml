answer: |-
  Here is the spec for a theory of conceptual slippage. It is designed to be implementation-agnostic but behaviorally constrained.

  ### The Desiderata

  **1. Structural Invariance under Ontological Loss**
  *   **Demand:** The theory must explain how a relational transformation persists even when one of the *relata* (the things being related) is removed from the domain.
  *   **Case:** (b) Traffic Signals. The transformation "swap the second and third states" must remain intelligible on a two-lamp pedestrian signal where a third state does not exist. The theory cannot simply return an error; it must account for how the *concept* of the transformation bends to fit the new ontology (e.g., does "third" map to "last," or does the transformation collapse?).
  *   **Why:** Most theories bind relations to specific nodes. If the node vanishes, the relation should vanish. Human cognition keeps the relation alive by warping the domain.

  **2. Phenomenological Continuity**
  *   **Demand:** The theory must preserve the subjective sense of identity across the slippage. The user must not feel they have switched to a *different* concept, even if the extensional definition has changed.
  *   **Case:** (c) Tomato. Both parties feel they are arguing about the *same object*, not talking past each other using homonyms. The "fruit" concept and the "vegetable" concept must share a stable core identity despite mutually exclusive categorization rules.
  *   **Why:** If the theory posits that the concept actually *did* change (e.g., "you switched from botanical to culinary schema"), it fails to capture the felt coherence. The bend must be smooth, not a jump.

  **3. The Null-Verdict Constraint**
  *   **Demand:** The theory must be able to output "no answer" or "invalid analogy" as a positive result, not as a failure state or timeout.
  *   **Case:** (a) Letter Strings. For *abc -> abd*, some defenders argue *ijk -> ?* has no valid answer (e.g., if the rule is "replace the rightmost letter with its successor," but the context implies a different symmetry).
  *   **Why:** Connectionist and optimization models always converge on *something*. A theory of slippage must define the boundary where the bend breaks rather than snaps. It requires a stopping condition intrinsic to the analogy, not external to it.

  **4. Justification Generativity**
  *   **Demand:** The theory must support post-hoc articulation. Agents must be able to generate a coherent rule for why they chose their answer, even if the process was not rule-based.
  *   **Case:** (a) & (b). People defend *ijl* vs. *ijd* or the pedestrian signal answer with logical reasons ("it's about symmetry," "it's about the cycle").
  *   **Why:** If the slippage is purely sub-symbolic (a vector shift), the user shouldn't be able to verbalize a rule. If it's purely symbolic, it shouldn't slip. The theory must bridge the gap between fluid processing and discrete explanation.

  **5. Immediate Convergence (No Search)**
  *   **Demand:** The slippage must occur during perception/retrieval, not during a deliberative search phase.
  *   **Case:** (a) & (b). People see the answer (or the ambiguity) almost instantly. They do not enumerate all possible transformations and test them.
  *   **Why:** This rules out classical "generate-and-test" symbolic AI. The constraint satisfaction must be parallel and automatic. The "bend" is how the concept is retrieved, not how it is manipulated.

  ***

  ### The Incompatible Pair

  You guessed: *"Must always return exactly one answer"* vs. *"Must reproduce the felt ambiguity."*
  **Verdict:** You are partially wrong. A probabilistic theory (returning a distribution over answers) can satisfy both.

  **The Real Conflict:** **Explicit Representational Stability** vs. **Implicit Contextual Plasticity.**
  *   **Why:** To satisfy **Desideratum 2 (Continuity)**, the concept needs a stable representation that persists across contexts (the "tomato" stays the tomato). To satisfy **Desideratum 1 (Ontological Loss)** and **5 (Immediacy)**, the concept must be constituted entirely by its current context (the "traffic light" transformation is defined by the lamps available).
  *   **The Trade-off:** If you give the concept a stable core (to handle the tomato), it becomes too rigid to bend without breaking (failing the traffic light). If you make it purely context-sensitive (to handle the traffic light), it loses the identity required to feel like the "same" concept (failing the tomato). You cannot have a concept that is both a fixed anchor and a fluid stream.

  ***

  ### The Killer Requirement

  **The Null-Verdict Constraint (Desideratum 3).**

  *   **Why:** This knocks out the most plausible theories.
      *   **Connectionist/Neural Nets:** They *always* activate. They will force a pattern completion even on noise. They struggle to say "this mapping is invalid" without an external threshold.
      *   **Optimization Models:** They seek the *best* fit. Even a terrible fit is a fit. They lack a mechanism for *incommensurability*.
      *   **Pure Analogy Mappers (e.g., SME):** They map what is structurally consistent. If a structure can be forced, they find it. They rarely return "null" unless the domains are totally disjoint, which fails the "bending" nuance (where domains are close but not quite).
  *   **The Bar:** A theory must explain how the cognitive system recognizes that the *cost* of the slippage exceeds the *gain* of the analogy, and halts the process while maintaining the feeling that the question was meaningful.

  ***

  ### Quick Survey of Existing Accounts

  *   **Prototype Theory:** Fails **Ontological Loss**; if "amber" is a feature of the prototype, the 2-lamp signal cannot instantiate the transformation.
  *   **Exemplar Theory:** Fails **Immediate Convergence**; retrieving and comparing specific past instances is too slow for the instant "feel" of the letter puzzles.
  *   **Theory-Theory:** Fails **Phenomenological Continuity**; if the underlying causal theory changes (botanical vs. culinary), the object identity should fracture, but it doesn't.
  *   **Connectionism:** Fails **Justification Generativity**; it models the bend well but cannot explain how users articulate discrete rules for why they bent it that way.
