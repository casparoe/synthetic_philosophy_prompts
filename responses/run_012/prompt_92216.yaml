answer: |-
  **Activity: The Accumulation Protocol**

  **Setup (0–5 min)**
  Seat fifteen journalists around a single table. Place a sealed folder before each. Do not explain the purpose. Do not define "cancel culture." Say only: "Make the choices in the folders honestly. There are no right answers."

  **Materials**
  *   15 Folders, each containing three "Decision Slips" and a pen.
  *   One Master Ledger (kept by you).
  *   A projected slide showing "Dr. Vance: Status Active."

  **Sequence**
  1.  **Round 1 (5–15 min):** Participants open Slip 1. *Scenario:* "Dr. Vance (a scientist) requests a comment for your story. He has recently been criticized for past associations." *Choice:* **Reply / Ignore / Refer to Editor.** Collect slips. You secretly tally "Ignore/Refer" as 1 point each.
  2.  **Round 2 (15–35 min):** Participants open Slip 2. *Scenario:* "A conference organizer asks if Vance should keynote. You are on the advisory board." *Choice:* **Support / Neutral / Withdraw My Name.** Collect slips. Tally "Withdraw" as 2 points each.
  3.  **Round 3 (35–45 min):** Participants open Slip 3. *Scenario:* "Vance seeks co-authorship on a major paper." *Choice:* **Accept / Decline.** Collect slips. Tally "Decline" as 1 point each.
  4.  **The Reveal (45–55 min):** Announce the total score. If the score exceeds 18 (likely), change the slide to "Dr. Vance: Status Terminated." Explain: "Per institute bylaws, lack of professional engagement triggers automatic funding revocation." No one voted to terminate. The sum of individual refusals did.
  5.  **Debrief (55–90 min):** (See below).

  **Debrief Guide**
  Do not lecture. Ask questions that force them to map their actions to the outcome.
  1.  **Censure vs. Hard Treatment:** Ask: "Did you intend to fire Vance?" (No). "Did he lose his livelihood?" (Yes). Distinguish their expression of disapproval (censure) from the material loss inflicted (hard treatment).
  2.  **Withdrawal vs. Penalty:** Ask: "Did you punish him, or just distance yourselves?" Highlight that withdrawal of association becomes a penalty when the network is dense enough.
  3.  **Author/Procedure/Appeal:** Ask: "Who fired Vance?" (No one). "Can he appeal?" (No). Establish that punishment requires an author and a route of appeal; this had neither.
  4.  **Proportionality:** Ask: "Who decided 18 points equals termination?" Highlight the lack of scaling mechanism.

  **Predictable Misfires**
  1.  **"This is just criticism, not punishment."**
      *   *Handle:* Do not argue definitions. Ask: "If the consequence is loss of income without a hearing, does the label 'criticism' protect anyone?" Let the material consequence stand against the semantic defense.
  2.  **"You stacked the deck."**
      *   *Handle:* Agree openly. "The simulation is rigid to make the mechanism visible. In reality, the rules are hidden, not absent. Does opacity make the process safer, or more dangerous?"

  **Limitations & The Gap**
  Your suspicion is correct. The activity establishes that a penalty was imposed without a legitimate author, but it cannot prove the penalty was *undeserved*. Vance might be guilty. A punishment can be deserved yet illegitimate if imposed by a mob rather than a court.

  **What to say to close the gap:**
  "This simulation shows the *structure* of the penalty, not the *merit* of the case. Legitimacy requires procedure regardless of guilt. Even if Vance deserved censure, did he deserve a penalty without a judge? The problem isn't always the outcome; it's the authority. We are not debating whether Vance is good; we are debating who gets to decide."
