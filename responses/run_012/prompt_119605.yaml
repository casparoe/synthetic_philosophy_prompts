  I am a retired population biologist who spent a career on mark–recapture and survival analysis, and I have lately been reading philosophy of physics without much of a philosophical background. Please act as a philosopher of physics who is also fluent in applied statistics: think carefully before you commit to anything, and begin with a short brainstorming pass in which you lay out the structure of the target argument before you attempt the translation.

  Restate the argument that an Everettian observer should expect never to experience death — the quantum-suicide/quantum-immortality line of reasoning — in the vocabulary I actually use: risk sets and entry/exit, right-censoring, competing risks, hazard functions, conditional survival probabilities, martingales, and the distinction between a population-level frequency and a credence about a single subject. Do this as faithfully as you can, then give me the residue report. Which parts of the argument survive the translation intact, which survive only in a distorted form, and which have no counterpart at all in survival analysis? Where something fails to translate, I want your considered view on whether the failure indicts my vocabulary or indicates that the original claim is doing less work than it appears to. In particular, tell me whether the step from "the risk set is never empty" to "I should expect to survive" is a translation I am entitled to make or a move the formalism cannot license, and whether the trouble lies in how I am treating the individual, the event, or the probability. Please reason from the structure of the argument rather than surveying what various authors have said; I am after the translation and its residue, not a reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

