          3.  Residue Report: Analyze what survives, what distorts, and what fails to translate.
          4.  Specific Focus: Evaluate the step from "risk set never empty" to "I should expect to survive." Is this licensed by the formalism? Where does the trouble lie (individual, event, probability)?
      *   **Constraint:** Reason from the *structure* of the argument, not by surveying literature/authors.

  2.  **Deconstruct the Quantum Immortality (QI) Argument (Standard Philosophical Form):**
      *   *Premise 1 (MWI):* All possible outcomes of quantum measurements actually occur in branching worlds.
      *   *Premise 2 (Continuity of Consciousness):* Subjective experience follows a continuous path through the branching structure.
      *   *Premise 3 (Death as Termination):* Death is the cessation of subjective experience.
      *   *Mechanism:* In a lethal quantum experiment (e.g., quantum suicide), the wavefunction branches. In some branches, the subject dies. In others, the subject survives.
      *   *Conclusion:* Since there is always a branch where the subject survives (assuming non-zero amplitude), and the subject cannot experience "nothingness" (death), the subject *must* find themselves in a surviving branch. Therefore, from the first-person perspective, survival probability is 1.

  3.  **Brainstorming the Translation (Survival Analysis Vocabulary):**
      *   *Population:* The set of all "observer-moments" or world-lines.
      *   *Entry:* Birth or start of observation.
      *   *Exit:* Death (event) or end of study (censoring).
      *   *Risk Set ($R(t)$):* The set of individuals alive and under observation at time $t$.
      *   *Hazard Function ($h(t)$):* Instantaneous risk of death at $t$, given survival to $t$.
      *   *Survival Function ($S(t)$):* Probability of surviving past $t$.
      *   *Censoring:* Right-censoring usually means lost to follow-up or study end. In QI, "death" branches look like censoring from the *survivor's* perspective? No, they are competing risks.
      *   *Competing Risks:* Death by mechanism A, Death by mechanism B... Survival.
      *   *Martingale:* The expectation of future state given past history.
      *   *Frequency vs. Credence:* Population level (measure of branches) vs. Individual level (subjective expectation).

      *Key Tension:* Survival analysis typically models a single world where $N$ individuals reduce over time. QI models a single individual where $N$ worlds expand over time.
      *Mapping:* The "Population" in QI isn't biological individuals; it's *branches* containing the individual.
      *The "Event":* Death.
      *The "Risk Set":* The set of branches where the observer is still alive.
      *The "Censoring":* Branches where the observer dies are *not* right-censored in the standard sense (we know the event happened). But from the *perspective of the survivor*, those branches disappear from the sample. This looks like informative censoring or truncation.

  4.  **Drafting the Translation (Iterative Process):**
      *   *Attempt 1:* Treat branches as individuals.
      *   *Problem:* In standard survival analysis, individuals are independent. In MWI, branches share a past.
      *   *Attempt 2:* Treat the "Observer" as a stochastic process moving through a risk set.
      *   *Refinement:* Let's define the "Cohort" as the set of all future world-lines emanating from the current observer state.
      *   *Hazard:* The quantum amplitude squared (Born rule) associated with lethal outcomes.
      *   *QI Claim:* The hazard function for *experienced* death is zero.
      *   *Why?* Because the risk set $R(t)$ for the *experiencing subject* is defined conditional on experience. If you die, you leave the risk set of "experiencers."
      *   *Translation:* The QI argument claims that for the first-person observer, the survival function $S(t) \equiv 1$ for all $t$, because the event "death" is unobservable. This implies the hazard rate $h(t) = 0$ for the *subjective* process, even if the population hazard $h_{pop}(t) > 0$.

  5.  **Developing the Residue Report (The Critical Analysis):**
      *   *What survives:* The distinction between population frequency (measure of branches where death occurs) and individual credence (conditional probability of experience). The mathematical structure of conditioning on survival.
      *   *What distorts:* The concept of the "Risk Set." In biology, $R(t)$ shrinks. In QI, the "ontological risk set" (all branches) grows, but the "experiential risk set" (branches where I am) stays size 1 (or shrinks to 1).
      *   *What fails:* The definition of "Probability." In survival analysis, probability is tied to frequency or propensity in a single world. In QI, probability is measure over worlds.
      *   *The Crucial Step:* "Risk set never empty" $\to$ "Expect to survive."
      *   *Analysis:* In survival analysis, if $R(t)$ is never empty, it just means *someone* survives. It does not mean *you* survive. To claim *you* survive requires assuming *you* are sampled from the survivors only. This is selection bias / observer selection effect.
      *   *Formalism Check:* Standard survival analysis assumes the event is observable. If the event is unobservable (death), we have "immortal time bias" or infinite right-censoring.
      *   *Verdict:* The move is not licensed by standard survival formalism. It requires redefining the "subject" as a path-dependent filter rather than a statistical unit. The trouble lies in treating the *individual* as a continuous trajectory through a branching tree rather than a static unit in a fixed population.

  6.  **Refining the Tone:**
