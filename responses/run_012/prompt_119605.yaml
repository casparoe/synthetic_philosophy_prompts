      *   *Step 3: Residue.* Break down the fit/misfit.
      *   *Step 4: The Verdict.* Address the specific question about the inference from risk set to expectation.

      *(Self-Correction during drafting)*: Be careful with "Martingales." A martingale implies expected future value equals current value. In QI, does the "measure" of the observer stay constant? No, the *measure* of the branches where the observer exists might decrease (Born rule), but the *count* of branches might increase. QI usually ignores the measure (amplitude squared) and focuses on existence. This is a key point of friction. Standard SA weights by probability. QI weights by existence (0 or 1). I need to highlight this "Measure vs. Count" distinction.

      *(Refining the "Risk Set" point)*: In SA, $R(t)$ is the set of individuals *at risk*. If I die, I leave $R(t)$. In QI, the argument is that there is a version of me that never leaves $R(t)$. But *which* version is "me"? This is the "Identity" problem. In SA, identity is fixed at entry. In QI, identity splits. This is the fundamental translation failure.

  8.  **Finalizing the Output Structure:**
      *   **Phase 1: Structural Brainstorming.** (Mapping the concepts).
