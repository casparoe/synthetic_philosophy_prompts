answer: |-
  ### Phase 1: Structural Brainstorming

  Before translating, I must map the ontology of the Everettian (Many-Worlds) framework onto the ontology of Survival Analysis (SA). The friction points are immediate, so I will lay them out to ensure the translation is rigorous rather than metaphorical.

  1.  **The Unit of Analysis:**
      *   *SA:* A biological individual (fixed identity from entry to exit).
      *   *Everett:* A "world-line" or branch of the wavefunction. The "individual" splits.
      *   *Mapping:* We must treat the "Observer" not as a single biological entity, but as a *stochastic process* traversing a branching tree of world-lines. The "Population" is the set of all possible future observer-moments emanating from the current state.

  2.  **The Event (Death):**
      *   *SA:* An observable endpoint (failure). Once it occurs, the subject leaves the risk set.
      *   *Everett:* A branch where physiological function ceases.
      *   *Mapping:* In QI, death is treated as *informative truncation*. It is not just an exit; it is a removal from the sample space of *experience*.

  3.  **Probability vs. Measure:**
      *   *SA:* Probability is linked to frequency (proportion of cohort failing) or propensity (hazard).
      *   *Everett:* "Probability" is contested. There is *branch count* (all outcomes happen) and *Born measure* (amplitude squared). QI relies on branch count (existence), often ignoring measure (weight).
      *   *Mapping:* This is the biggest friction. SA assumes $\sum P(\text{exit}) + P(\text{survive}) = 1$. QI implies $P(\text{survive} | \text{experience}) = 1$, even if $P(\text{survive} | \text{entry}) \ll 1$.

  4.  **The Risk Set ($R(t)$):**
      *   *SA:* $R(t)$ shrinks over time as events occur.
      *   *Everett:* The ontological set of branches expands. The *subjective* risk set (branches where "I" am alive) remains non-empty by definition.
      *   *Mapping:* We must distinguish between the *Ontological Risk Set* (all branches) and the *Epistemic Risk Set* (branches compatible with current experience).

  5.  **The Inference:**
      *   *SA:* $S(t)$ is a property of the cohort.
      *   *QI:* $S(t)$ is a property of the first-person perspective.
      *   *Mapping:* The argument hinges on conflating the survival function of the *population of branches* with the conditional survival probability of the *observer path*.

  ***

  ### Phase 2: The Translation

  Here is the Quantum Immortality argument restated strictly within your vocabulary of survival analysis and mark–recapture.

  **The Setup:**
  Consider a cohort defined not by biological birth, but by the current observer-state at time $t_0$. Let the "population" be the set of all future world-lines branching from $t_0$. Let $D$ be the event "cessation of conscious experience" (death).

  **The Argument:**
  1.  **Competing Risks Structure:** At any time $t$, the observer faces a competing risks scenario. Risk 1 is "Continued Experience" (Survival). Risk 2 is "Cessation of Experience" (Death). In the Everettian formalism, the hazard function for Death, $h_D(t)$, is strictly non-zero for lethal quantum events.
  2.  **Observability and Truncation:** However, the data collection process is conditioned on the presence of an observer. We only collect data points from world-lines where the observer is present to record them. World-lines where $D$ occurs are not right-censored (we know the event happened ontologically); they are *truncated* from the first-person dataset. They contribute to the population hazard but not to the *experienced* hazard.
  3.  **The Risk Set Condition:** In standard survival analysis, the risk set $R(t)$ contains all individuals who have entered and not yet exited. In this quantum cohort, the *Ontological Risk Set* $R_{ont}(t)$ includes branches where death has occurred. However, the *Epistemic Risk Set* $R_{epi}(t)$—the set of branches accessible to the first-person perspective—is defined as $R_{ont}(t) \setminus \{ \text{branches where } D \text{ occurred} \}$.
  4.  **Non-Empty Risk Set:** Provided the wavefunction amplitude for survival is non-zero, $R_{epi}(t)$ is never empty for any finite $t$. There is always at least one branch in the risk set where the observer remains.
  5.  **Conditional Survival Probability:** The subjective survival function, $S_{subj}(t)$, is the conditional probability of being in $R_{epi}(t)$ given that one is currently in $R_{epi}(t_0)$. Since the sampling protocol excludes all paths where $D$ occurs, the conditional probability of observing $D$ is zero.
  6.  **Martingale Property:** Let $X_t$ be the indicator variable for "Observer exists at $t$." For the first-person perspective, $E[X_{t+\Delta t} | X_t = 1] = 1$. The expectation of future existence, conditional on current existence, is a martingale with constant value 1.
  7.  **Conclusion:** Therefore, while the population-level frequency of death across all branches may approach 1 (high hazard), the individual credence for a specific subject, conditioned on their continued capacity to hold credences, must remain $S_{subj}(t) = 1$. The observer should expect never to exit the risk set.

  ***

  ### Phase 3: The Residue Report

  Now we assess the fidelity of this translation.

  #### 1. What Survives Intact
  *   **The Distinction between Frequency and Credence:** The translation successfully isolates the gap between the population hazard rate (measure of branches where death occurs) and the conditional probability of experience. In SA terms, this is the difference between the *cohort survival curve* and the *prevalent cohort survival curve* (survivors at time $t$).
  *   **Informative Truncation:** The treatment of death branches as removed from the dataset rather than censored is statistically sound. It mirrors "immortal time bias" or selection effects where the outcome precludes observation.
  *   **The Non-Empty Risk Set:** The logical core that "if $N > 0$ in the risk set, sampling is possible" translates perfectly.

  #### 2. What Survives in Distorted Form
  *   **The Hazard Function:** In SA, $h(t)$ drives the reduction of $S(t)$. In the translation, we posit two hazard functions: $h_{ont}(t)$ (which behaves normally) and $h_{subj}(t)$ (which is forced to zero). This distorts the concept of hazard. A hazard of zero implies no risk mechanism exists, but the QI argument admits the risk mechanism exists but is "unobservable." This turns the hazard from a *physical propensity* into an *epistemic filter*.
  *   **The Martingale:** In standard mark–recapture, a martingale property usually applies to population estimates or capture probabilities. Applying it to the *existence* of the subject ($E[X_{t+1}|X_t]=1$) distorts the variable $X$. $X$ is usually a state, not an identity. Here, $X$ conflates "state of being alive" with "presence of a witness."

  #### 3. What Fails to Translate (The Residue)
  *   **Identity Continuity (The "Mark"):** In mark–recapture, an individual is marked at entry. That mark persists. If the animal dies, the mark is retired. In the QI translation, the "mark" (subjective identity) does not retire; it *splits*. SA has no formalism for an individual that divides into two, one of which retains the "mark" of consciousness and one of which does not. The "individual" in SA is atomic; the "individual" in QI is a ray in Hilbert space that projects onto multiple basis states.
  *   **Probability Measure:** SA probabilities sum to 1 over the sample space. QI relies on a dichotomy between *measure* (Born rule weights) and *count* (branch existence). If the "survival" branch has amplitude $10^{-100}$, SA would treat the hazard as effectively 1. QI treats the hazard as 0 because the branch *exists*. The translation hides this by focusing on the risk set membership (binary) rather than the weight of the membership (continuous).
  *   **The Definition of "Exit":** In SA, exit is an event in time. In QI, "death" is the absence of a future time. You cannot model "absence of future" easily in a temporal process model without invoking a boundary condition that stops the clock.

  ***

  ### Phase 4: The Verdict on the Inference

  You asked specifically about the step: **"The risk set is never empty" $\to$ "I should expect to survive."**

  **Is this translation licensed by the formalism?**
  No. The formalism of survival analysis does not license this move. It is a category error regarding the definition of the *subject*.

  **Where the trouble lies:**
  The trouble lies in **how you are treating the individual**.

  1.  **The Sampling Assumption:** In survival analysis, if the risk set $R(t)$ is never empty, it implies *someone* survives. It does not imply *you* survive. To infer *you* survive, you must assume that "you" are sampled *from the survivors only*.
      *   *Standard SA:* You are sampled at $t_0$. Your fate is determined by $h(t)$.
      *   *QI Translation:* You are re-sampled at every $t$ from the subset of branches where you exist.
      *   *The Error:* This is **prevalence-incidence bias** (Neyman bias). By conditioning on "experience at $t$," you have selected a sub-population defined by the absence of the event of interest. Calculating survival probabilities on a population defined by survival yields $S(t)=1$ by tautology, not by prediction.

  2.  **The Probability vs. Existence Confusion:**
      *   In your field, if a risk set has 1000 animals, and 999 die, the survivor is a statistical outlier. The *expectation* for any specific marked animal at $t_0$ is death.
      *   The QI argument claims that because the survivor *exists*, the *expectation* at $t_0$ should have been survival.
      *   This fails the **Martingale test** relative to the entry time. At $t_0$, the expected measure of the "surviving self" is low (per Born rule). The QI argument updates this expectation *retroactively* based on the fact that a survivor exists at $t$. It treats the *existence* of a path as equivalent to the *probability* of taking that path.

  **Considered View:**
  The failure indicts the **original claim**, not your vocabulary. Your vocabulary is precise enough to expose the sleight of hand.

  The step from "risk set never empty" to "I should expect to survive" is a move the formalism **cannot license**. It conflates:
  1.  **Conditional Probability:** $P(\text{Experience} | \text{Alive}) = 1$ (True, but trivial).
  2.  **Predictive Probability:** $P(\text{Alive} | \text{Entry}) = 1$ (False, per standard probability).

  The QI argument attempts to derive (2) from (1) by asserting that "I" am essentially the conditional variable (Experience) rather than the entry variable (Entry).

  **Conclusion:**
  In survival analysis terms, the Quantum Immortality argument is a claim that **observer selection effects convert a cohort study into a cross-sectional study of survivors.** It argues that because you can only observe data from the risk set, you should model your future as if you are permanently in the risk set.

  While this is internally consistent as a description of *retrospective* experience (you never experience being dead), it fails as a *prospective* decision theory (you should not bet on survival at $t_0$). The formalism shows that the "Immortality" is a property of the **data collection filter** (consciousness), not the **stochastic process** (quantum evolution). The risk set is never empty *for the data*, but the hazard function for the *individual unit* remains non-zero. The argument survives translation only by redefining "Individual" mid-stream from "Entrant" to "Survivor."
