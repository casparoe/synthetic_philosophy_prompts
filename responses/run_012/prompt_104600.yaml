  Hey, I have been thinking a lot about what you described, and I want to start by saying that your friend is actually stumbling onto a very famous problem in decision theory and philosophy. It is not just her being weird or overly idealistic; she has walked straight into a trap known as Pascal's Mugging. The reason you feel like you are losing the argument is that on the surface, the math she is using looks clean and undeniable. If you take a tiny probability and multiply it by an infinite or astronomical payoff, the result is a huge number, and if you compare that to a modest guaranteed good, the huge number wins. It feels like anyone who disagrees is just refusing to do the multiplication. But the error is not in the arithmetic; it is in the assumption that this specific formula is the correct tool for making decisions under extreme uncertainty. You are not wrong to feel that something is broken here, and you do not need to concede that she is right to keep your sanity.

  The core issue is that expected value theory, which is what she is using, works great for normal decisions like buying insurance or playing poker, but it breaks down completely when you introduce outcomes that are vastly larger than anything we have experience with. When someone claims a one-in-a-hundred-billion chance of saving astronomical numbers of lives, they are asking you to trust a probability estimate that is far more precise than human cognition allows. Even if you grant for the sake of argument that the numbers are what he says they are, you cannot separate the probability of the event from the probability that the person presenting the event is mistaken, deluded, or lying. In the real world, the probability that a random person at a conference has accurate knowledge of a one-in-a-hundred-billion catastrophic event is effectively zero, likely much lower than the probability they claim. If you allow yourself to accept claims based solely on the magnitude of the payoff, you become vulnerable to every contradictory claim made by every other person with a different theory of catastrophe.

  This leads directly to the point she raised about the thousand other guys with different funds. She sees this as a problem of choice, but it is actually a proof that the framework is broken. If you have ten different people each claiming they can prevent a different existential catastrophe, and each demands all your resources based on infinite expected value, you cannot fund them all. Since their claims are often mutually exclusive, funding one might mean ignoring another that was actually real. If the logic demands you give everything to the first person but also everything to the second person, the logic has produced a contradiction. A moral or rational system that demands impossible things is not a guide to action; it is a sign that the model has left the territory of reality. Her conclusion that this means she should just pick one is arbitrary, and acting on arbitrary choices while claiming mathematical necessity is inconsistent.

  Then there is her argument about there being no stopping point, that if the logic holds for one dollar it holds for everything forever. You are right to feel that this is a reductio ad absurdum, which is a fancy way of saying that if a theory leads to an absurd conclusion, the theory is wrong. If a moral framework requires you to sacrifice yourself entirely without actually guaranteeing the outcome, it is self-defeating. You cannot help anyone if you are destitute, exhausted, or unable to function. Rational altruism requires sustainability. The fact that her logic consumes the agent entirely suggests that the logic is treating human beings as mere calculators rather than actors in the world. A map that tells you to walk off a cliff because the destination is valuable is a bad map, even if the destination is real. We reject the instruction not because the destination isn't valuable, but because the map is flawed.

  So, to answer your question about what is actually wrong with her argument, it is that she is treating a heuristic as a law. Expected value is a tool for comparing reasonable options, not a divine command that overrides epistemic humility. When the numbers get this big, our uncertainty about the numbers themselves dwarfs the numbers. The rational response to a claim of astronomical impact with tiny probability is not to calculate the product, but to recognize that the claim is too fragile to support the weight of your life savings. You are not saying the catastrophe does not matter; you are saying that this specific path to preventing it is not robust enough to bet everything on. There is a difference between a high-impact opportunity and a high-variance gamble that relies on trust in a stranger's spreadsheet.

  In practice, what follows from this is that you should prioritize robustness over speculation. It is better to do concrete good that you can verify than to chase speculative good that relies on chain-reaction assumptions holding true. You can tell her that keeping her money is not a rejection of the catastrophe's importance, but a rejection of the reliability of the pitch. She can still care about existential risk without handing her savings to the first person who mentions infinity. In fact, keeping her financial stability allows her to be in a position to help later when better opportunities arise, or to support proven interventions that actually move the needle rather than theoretical ones. The goal of effective altruism is to do the most good, not to win a math puzzle that ignores reality.

  I know it feels uncomfortable to push back when someone is arguing from a place of wanting to save the world, because it makes you sound like you are valuing money over lives. But you are not valuing money over lives; you are valuing reliable reasoning over broken models. You can tell her that true rationality includes knowing when a model has gone off the rails. If she gives away everything based on this logic, she is not being rational; she is being coerced by a mathematical artifact. The fact that she feels there is no stopping point is the warning sign, not the mandate. Tell her that it is okay to say that the uncertainty is too high, that the conflicting claims cancel each other out, and that preserving her ability to act in the future is itself a moral good. She does not have to solve the infinite to do the finite, and the finite is where actual help happens.
