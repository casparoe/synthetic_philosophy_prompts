prompt: |-
  So I'm in this reading group thing that's basically me, two friends, and one guy who actually did a philosophy degree, and we've been going at the killing vs letting die thing for like three months now. Two of us have stopped even listening to each other and I want to write up the doc we should've written at the start. I'm a backend engineer so excuse the vocabulary, I'm sure I'm mangling some term of art here.

  The two sides are:

  World-side view: whether you killed someone or let them die is a fact about the causal shape of what actually happened. Did the harm come out of something you introduced, or was it a process already running that you declined to interrupt? On this view the line is discovered rather than decreed, and it's morally deep, because being the one who put the harm into the world is genuinely different from being the one who didn't take it out.

  Rulebook view: there's no such fact. What counts as doing vs allowing depends on which action is the default in some practice, role or rule. The same physical sequence gets redescribed as doing or allowing just by moving the default, and what the distinction really tracks is what people were entitled to expect of you. Real and morally serious, but made, not found.

  What I want is the joint statement these two could both sign after an honest sit-down. The claims they both accept (about the cases, about what's even in dispute, about what the distinction would have to be to do any moral work). Then the precise disagreements, each written the way its own side would actually want it phrased, not as a strawman. Then the cruxes — the sub-questions where settling one would actually move somebody. I suspect one crux is whether there's a privileged baseline at all, like "the natural course of events", or whether every baseline is chosen by whoever's telling the story. Another might be whether the line is about causation at all or just about duties. But don't take my guesses, tell me if I'm wrong and where the real cruxes are. For each crux give a concrete case that both sides agree bears on it, and write down what each side predicts about that case before anyone gets to weasel.

  Cases you can use, all made up, no need to cite anything: an autopilot that brakes unless the driver holds a button down, versus one that coasts unless the driver presses a button — same crash either way, but is the crash something the car did or something it let happen? The bug we knew about and shipped anyway versus the feature we decided not to build. The doctor who just doesn't order the test. And the old one about one healthy guy and five dying patients, where I think both sides agree it's wrong but maybe not for the same reason.

  Format it as a numbered list of agreed claims, then a table for the disagreements, then the cruxes with the predictions. And don't let either side buy peace with "it's a spectrum" or "it depends on context" unless they actually cash that out into something that seperates the cases.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Context:** A reading group (4 people: 3 laypeople, 1 philosophy grad) stuck on the "killing vs. letting die" debate for 3 months. Communication is breaking down.
      *   **Goal:** Create a "joint statement" document they should have written at the start.
      *   **User Persona:** Backend engineer (comfortable with systems, logic, causality, defaults, baselines).
      *   **Key Views:**
          *   *World-side view:* Distinction is ontological/causal (fact about the world).
          *   *Rulebook view:* Distinction is normative/conventional (fact about expectations/rules).
      *   **Required Format:**
          1.  Numbered list of Agreed Claims.
          2.  Table for Disagreements (phrased charitably).
          3.  Cruxes (sub-questions that move the needle) with concrete cases and specific predictions from each side.
      *   **Constraints:** No weaseling ("it depends," "spectrum"). Must be precise. Use the provided cases (autopilot, bug/feature, doctor test, organ transplant).

  2.  **Deconstruct the Views:**
      *   *World-side (Causal/Ontological):* Focuses on energy transfer, initiation of force, interruption of existing processes. "I pushed the rock" vs. "I didn't catch the rock." Morality tracks this physical difference.
      *   *Rulebook (Normative/Conventional):* Focuses on duties, expectations, baselines. "I pushed the rock" is only killing if I wasn't supposed to push it. If I'm a lifeguard, not catching the rock is killing. Morality tracks the violation of duty.

  3.  **Drafting Section 1: Agreed Claims:**
      *   What do both sides actually agree on?
      *   They agree the *outcome* (death/harm) is the same in many paired cases.
      *   They agree the distinction *matters* morally (at least in common intuition), even if they disagree *why*.
      *   They agree that some cases are clear (paradigmatic killing vs. paradigmatic letting die).
      *   They agree that the distinction isn't just about intent (both can be intentional).
      *   They agree that if the distinction collapses entirely, moral theory needs a major overhaul.

  4.  **Drafting Section 2: Disagreements (The Table):**
      *   Need to capture the core conflict without strawmanning.
      *   *Row 1: Metaphysics.* Is the distinction "out there" or "in the rules"?
      *   *Row 2: Baselines.* Is there a natural default or a normative default?
      *   *Row 3: Moral Weight.* Does the distinction carry intrinsic weight or instrumental weight?
      *   *Row 4: Reversibility.* Can you flip the description by changing the rule (Rulebook says yes, World-side says no).

  5.  **Drafting Section 3: Cruxes (The Hard Part):**
      *   Need specific questions where an answer forces a concession.
      *   *Crux 1: The Baseline Problem.* Is "nature" a baseline?
          *   *Case:* The Autopilot (Brake-hold vs. Coast-press).
          *   *World-side:* One is intervention, one is non-intervention. Physically distinct.
          *   *Rulebook:* It's arbitrary. If the manual says "hold to brake," letting go is acting. If "press to brake," not pressing is acting.
      *   *Crux 2: Duty vs. Causation.* Can a duty create a "cause"?
          *   *Case:* The Doctor/Test.
          *   *World-side:* Not ordering is an omission. Causally, the disease killed.
          *   *Rulebook:* Not ordering *is* the cause because the duty existed.
      *   *Crux 3: The Organ Transplant (The Hard Case).*
          *   *Case:* 1 healthy, 5 dying.
          *   *World-side:* Cutting the healthy guy is an intervention (killing). Not saving the 5 is non-intervention (letting die).
          *   *Rulebook:* Both violate duties, but the duty not to harm is stronger than the duty to rescue. The distinction tracks *which* rule is broken, not physics.
      *   *Refining Cruxes:* The prompt asks for predictions.
      *   *Crux 1 (Baseline):* Autopilot. World-side says the physics determines the label. Rulebook says the manual determines the label.
      *   *Crux 2 (Duty Creation):* Bug vs. Feature. World-side says shipping code with a bug is an act (introducing code). Rulebook says if the spec didn't require the check, it's an omission of a feature.
      *   *Crux 3 (Moral Equivalence):* If we fix the baseline, do the moral weights equalize?

      *Self-Correction on Cruxes:* The prompt asks for "sub-questions where settling one would actually move somebody."
      *   *Crux A:* Is there a "Natural Baseline"? (The Autopilot Case).
      *   *Crux B:* Does changing the norm change the *act* or just the *blame*? (The Doctor Case).
      *   *Crux C:* Is the distinction fundamental or derivative? (The Organ Case).

      *Let's make the predictions sharper.*
      *   *Autopilot:* World-side says "Hold-to-brake" death is *Letting Die* (driver removed input). "Press-to-brake" death is *Killing* (driver failed to add input). Rulebook says "It's the same damn crash, the label depends on the API spec."
      *   *Doctor:* World-side says "Doctor didn't kill, cancer did." Rulebook says "Doctor killed, because 'not ordering' = 'breach of duty' = 'cause'."
      *   *Organs:* World-side says "Killing 1 is worse than Letting 5 die." Rulebook says "Violating Negative Right (1) is worse than Violating Positive Right (5)." (Wait, this might be too philosophical). Let's stick to the prompt's hint: "maybe not for the same reason."
      *   *Refined Crux:* **The Switch.** If we swap the norms, does the *act* change?
      *   *Case:* The Lifeguard. If a random person watches a drown, it's letting die. If a lifeguard watches a drown, is it killing?
      *   *World-side:* No. It's still an omission physically. Just a worse omission.
      *   *Rulebook:* Yes. It becomes killing because the baseline expectation shifted.

  6.  **Review against Constraints:**
      *   Backend engineer vocabulary? Use terms like "state," "default," "interrupt," "spec," "causal chain."
      *   No weaseling? Ensure predictions are binary or distinct.
      *   Format? List, Table, Cruxes with predictions.

  7.  **Final Polish:**
      *   Make the tone professional but direct (like a spec doc).
      *   Ensure the "World-side" isn't just "physics" but "causal structure."
      *   Ensure the "Rulebook" isn't just "laws" but "normative baselines."
      *   Check the "Agreed Claims" to ensure they aren't trivial. They need to be the foundation.

      *(Self-Correction during drafting)*: I need to make sure I don't accidentally solve the debate. The goal is to frame the *disagreement* clearly.
      *   Make sure the "Crux" section explicitly states what happens if the answer is Yes/No.
      *   Use the specific cases requested: Autopilot, Bug/Feature, Doctor, Organs.

      *Let's refine the Crux predictions.*
      *   *Crux 1 (Baselines):* Autopilot.
          *   World-side: The physical mechanism (energy in vs. energy out) dictates the label regardless of the manual.
          *   Rulebook: The manual dictates the label regardless of the physical mechanism.
      *   *Crux 2 (Duty as Cause):* Doctor.
          *   World-side: Duty increases blame for the omission, but doesn't turn omission into commission.
          *   Rulebook: Duty transforms the omission into a commission (constructive act).
      *   *Crux 3 (Moral Asymmetry):* Organs.
          *   World-side: Asymmetry exists because intervention is inherently weightier.
          *   Rulebook: Asymmetry exists because negative duties are inherently weightier (but could theoretically be swapped in a different society).

      *Wait, one more check:* The prompt asks for "what each side predicts about that case before anyone gets to weasel."
      *   Okay, I need to be specific. "Side A says X is Killing. Side B says X is Letting Die."

      *Let's finalize the structure.*
      1.  **Joint Statement of Fact (Agreed Claims)**
      2.  **Statement of Dispute (The Table)**
      3.  **Decision Cruxes (The Tests)**

      *Tone Check:* "Backend engineer" vibe. Use words like "state transition," "default handler," "spec," "causal graph."

      *Let's write it.*
answer: |-
  # Joint Statement on the Killing/Letting Die Distinction
  **Version:** 1.0 (Draft for Consensus)
  **Authors:** Reading Group Members A, B, C, D
  **Status:** Disputed Framework

  ## 1. Agreed Claims (Common Ground)
  *Before arguing about why the distinction matters, we agree on the following structural facts:*

  1.  **Outcome Equivalence:** In the paired cases under discussion (e.g., turning off a ventilator vs. never turning it on), the final state of the world (the patient's death) is identical.
  2.  **Intentionality is Orthogonal:** Both "killing" and "letting die" can be either intentional or accidental. The debate is not about *mens rea* (intent), but about the classification of the act itself.
  3.  **Moral Relevance:** We agree that the distinction *usually* carries moral weight in common intuition. We are debating the *source* of that weight, not its existence.
  4.  **Not All Omissions are Equal:** We agree that "letting die" is not always morally neutral. One can be blameworthy for letting die. The dispute is whether blameworthy letting die becomes a subclass of killing, or remains a severe subclass of letting die.
  5.  **Causal Necessity:** In both cases, the agent's behavior is a necessary condition for the death occurring at that specific time. (If the killer acted differently, or the allow-er acted differently, the death is averted).

  ## 2. Statement of Dispute
  *Where we diverge. Each side phrases their own position; the other side acknowledges this is the opposing view, not a strawman.*

  | Feature of the Distinction | **World-Side View** (Causal/Ontological) | **Rulebook View** (Normative/Conventional) |
  | :--- | :--- | :--- |
  | **Nature of the Line** | **Discovered.** The line exists in the causal structure of the event. It tracks energy transfer, initiation of force, or interruption of an existing process. | **Decreed.** The line exists in the social/legal/role expectations. It tracks deviations from a normative baseline or "default state." |
  | **The Baseline** | **Natural/Physical.** The baseline is "what happens without my intervention." If I add energy/information that causes death, I killed. If I withhold energy/information, I let die. | **Expected/Contractual.** The baseline is "what I was supposed to do." If I violate a duty to act, the omission is redescribed as a commission. |
  | **Stability** | **Invariant.** Swapping the rules or roles does not change whether an act was killing or letting die, only how blameworthy it is. | **Mutable.** Swapping the rules or roles *can* change the classification. A lifeguard letting a swimmer drown is performing a different *act-type* than a bystander doing the same. |
  | **Moral Mechanism** | **Intrinsic.** Intervening to cause harm is inherently worse than failing to prevent it, because putting harm into the world is a greater violation of agency. | **Instrumental.** The distinction tracks different *kinds of duties* (negative vs. positive). It is a heuristic for assigning responsibility, not a metaphysical fact. |

  ## 3. Decision Cruxes
  *These are the specific sub-questions where an answer forces a concession. We agree to test our views against these concrete cases. No "it depends" answers allowed.*

  ### Crux 1: The Baseline Problem (The Autopilot Case)
  **The Case:** Two cars have identical physics.
  *   **Car A:** Accelerates by default. Driver must *hold* a brake button to stop. Driver lets go; car hits pedestrian.
  *   **Car B:** Coasts by default. Driver must *press* a brake button to stop. Driver doesn't press; car hits pedestrian.
  **The Question:** Is the physical mechanism of the brake system relevant to whether the driver *killed* or *let die*?

  | View | Prediction |
  | :--- | :--- |
  | **World-Side** | **Different Classifications.** In Car A, the driver *removed* a constraint (letting die). In Car B, the driver *failed to apply* a constraint (letting die). *Correction:* Actually, World-Side must argue that one is an intervention and one is not. <br>**Refined Prediction:** Car A is **Letting Die** (removing an active safety input). Car B is **Letting Die** (failing to add input). <br>*Wait, this reveals the crux:* World-Side must claim the "Natural State" of the car matters. If the engine provides energy by default, stopping is an intervention. <br>**Final Prediction:** Car A (Hold-to-brake) death is **Killing** (Driver ceased the active prevention). Car B (Press-to-brake) death is **Letting Die** (Driver failed to initiate prevention). The physics of the default state dictates the label. |
  | **Rulebook** | **Identical Classification.** The physics are irrelevant. The label depends entirely on the **User Manual** (the spec). If the manual says "System brakes automatically," then overriding it is killing. If the manual says "Driver must brake," then not braking is letting die. The physical default is morally inert; only the normative expectation matters. |

  **Settlement Condition:** If we can swap the moral label just by rewriting the User Manual without touching the code, the **Rulebook View** wins. If the label stays fixed regardless of the Manual because of how the engine manages energy, the **World-Side View** wins.

  ### Crux 2: Duty as Cause (The Doctor Case)
  **The Case:** A doctor notices a symptom but decides not to order a diagnostic test. The patient dies of the undiagnosed condition.
  **The Question:** Does the doctor's professional duty transform the *causal description* of the death?

  | View | Prediction |
  | :--- | :--- |
  | **World-Side** | **No Transformation.** The disease killed the patient. The doctor *let* the patient die. The duty makes the doctor highly *blameworthy* for the omission, but it does not turn the omission into a commission. The causal chain runs from Pathogen → Death, not Doctor → Death. |
  | **Rulebook** | **Transformation.** Because the doctor had a duty to act, the "default" was "Order Test." By deviating from the default, the doctor *caused* the death. In a medical context, "not ordering" is functionally equivalent to "administering a lethal dose." It counts as **Killing** (or "constructive killing") because the role defines the baseline. |

  **Settlement Condition:** If we agree the doctor "killed" the patient in the same sense as a murderer, but just with a different excuse, **Rulebook** wins. If we agree the doctor "let die" but deserves prison anyway, **World-Side** wins.

  ### Crux 3: The Organ Transplant (The Hard Limit)
  **The Case:** One healthy patient, five dying patients. We can kill the healthy one to save the five.
  **The Question:** Why is this forbidden? Is it because of the *act-type* or the *right-type*?

  | View | Prediction |
  | :--- | :--- |
  | **World-Side** | **Act-Type Constraint.** It is forbidden because it requires an **intervention** (cutting, injecting, removing). We are prohibited from *introducing* harm into the causal stream, even to prevent greater harm. The physical act of cutting is the barrier. |
  | **Rulebook** | **Right-Type Constraint.** It is forbidden because it violates a **Negative Right** (right not to be interfered with) vs. a **Positive Right** (right to be rescued). If we changed the social contract (e.g., a lottery system for organ donation), the *physical act* (cutting) remains the same, but the moral classification shifts from Murder to Harvesting. |

  **Settlement Condition:** If we can conceive of a society where harvesting the healthy patient is *not* killing (just "collecting"), **Rulebook** wins. If harvesting is *always* killing regardless of social consent, because it involves initiating force, **World-Side** wins.

  ### Crux 4: Engineering Analogy (Bug vs. Feature)
  **The Case:**
  *   **Scenario A:** We ship code with a known null-pointer exception that crashes the system under rare conditions.
  *   **Scenario B:** We decide not to build a rate-limiter feature, knowing attackers can DDoS the system under rare conditions.
  **The Question:** Are these morally/technically equivalent failures?

  | View | Prediction |
  | :--- | :--- |
  | **World-Side** | **Distinct.** Scenario A is **Active Harm** (introducing a bug into the runtime). Scenario B is **Passive Vulnerability** (failing to patch the environment). Scenario A is worse because we injected the failure mode. |
  | **Rulebook** | **Equivalent.** Both are violations of the **SLA** (Service Level Agreement). If the spec requires stability, both are breaches. Whether we "added a bug" or "missed a feature" is a narrative choice. The failure is "System did not meet spec." |

  **Settlement Condition:** If the team feels qualitatively different about "breaking it" vs. "not fixing it," **World-Side** captures the intuition. If the post-mortem treats both as "Failure to Meet Requirements" with no distinction in kind, **Rulebook** captures the reality.

  ---
  **Next Steps:**
  Each member must select one Crux and write a 200-word commitment to which prediction they support and *why* that specific case settles the metaphysical dispute for them. No "both sides have a point." Pick a side.
