  **DEPRECATION NOTICE: Folk_Psychology_Module (v1.0)**
  **Date:** October 24, 2023
  **Status:** Sunset Scheduled
  **Target Removal:** Release 5.0 (Neuro-Physiological Native)

  **Summary**
  Effective immediately, the `belief`, `desire`, and `propositional_attitude` endpoints within the Folk_Psychology_Module are deprecated. These interfaces rely on a legacy theoretical framework that has not received a successful patch or minor version update in over two millennia. Consequently, the module is classified as stagnant technical debt. In Release 5.0, these high-level abstractions will be permanently removed rather than reduced. Callers must migrate to the lower-level `Neuro_Physiology_Primitives` API.

  **Deprecated Endpoints and Replacements**

  | Deprecated Call | Replacement Primitive | Notes |
  | :--- | :--- | :--- |
  | `agent.get_belief(subject)` | `neuro.scan_activation_vector(subject, region)` | Returns raw voltage data; no semantic truth value. |
  | `agent.set_desire(goal)` | `neuro.modulate_dopamine_pathway(goal)` | Requires manual gain adjustment. |
  | `agent.has_intention(action)` | `neuro.predict_motor_cortex_fire(action)` | Probabilistic output only. |

  **Migration Guide**
  Developers must refactor all instances of folk-psychological reasoning. Where legacy code previously queried `if (user.belief == "rain")`, the new implementation must instantiate a full synaptic weight matrix and parse the occipital lobe output stream. Be advised: the new primitives are significantly more verbose and do not support semantic compression. You can no longer assume agents possess "reasons" for actions; you must instead track causal chains of neural stimulation.

  **Rationale**
  The Folk_Psychology_Module was inherited from antiquity. While intuitively usable, the underlying architecture is fundamentally flawed. It posits discrete states ("beliefs") that do not map to any physical hardware component. Much like the `phlogiston` or `caloric` libraries, Folk Psychology explains nothing that the Neuroscience stack cannot explain with greater fidelity. The legacy module has blocked integration with modern cognitive science dependencies for centuries. Maintaining backwards compatibility prevents necessary optimization of the human operating system.

  **Known Issues**
  *   **Issue #892: Self-Referential Consistency.**
      *   *Description:* Several callers have noted that issuing this deprecation notice presupposes the existence of the very states being deprecated. The engineering team appears to *believe* this notice is true and *desires* users to migrate.
      *   *Status:* **Won't Fix.** This is a transient inconsistency resulting from the transition period. Once the migration is complete, the engineers will no longer possess beliefs or desires, resolving the contradiction. Until then, please ignore the semantic content of our communications and focus on the causal impact on your neural pathways.

  **Attached Bug Report**
  **Ticket #404:** *Request to Revert Deprecation*
  **Reporter:** `src.colleague_functionalist`
  **Comment:** "You cannot simply delete the API. The `belief` endpoint provides essential compression for social coordination. If I have to query your synaptic weights every time I ask if you want coffee, latency will spike indefinitely. The old API works fine for high-level tasks. Just treat it as a wrapper around the neuro-layer instead of deleting it. Also, do you really believe this is a good idea?"
  **Resolution:** **Closed.** The request assumes the validity of the legacy framework. The concept of "working fine" is subjective. Migration is mandatory.
