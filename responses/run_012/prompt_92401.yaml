answer: |-
  I recommend we fund only the constitutional wing of the coalition, contingent on legally binding earmarks that prohibit any diversion of funds to extra-legal activities, and withdraw the offer if these conditions cannot be enforced.

  Our canon lawyer is correct that the tradition forbids private individuals from assassinating tyrants. Aquinas is explicit in *De Regno* that while tyranny is an evil, removing a tyrant by private presumption is dangerous and often illicit because it exposes the community to greater instability and retaliatory violence. If we fund a coalition that includes actors committed to "whatever it takes," we risk formal cooperation with potential assassination or coup d'état, which makes us complicit in sin regardless of the tyrant's guilt. The canon lawyer's strongest argument is that without a clear public authority commanding the removal, any violent action is merely private vengeance, which the tradition rejects as sedition.

  However, the tradition also requires us to distinguish between a tyrant by title (a usurper) and a tyrant by exercise (a legitimate ruler who governs tyrannically). Our subject was elected legitimately; he holds the title. This makes removal harder than if he were a usurper, because the office itself retains dignity even if the holder corrupts it. Aquinas suggests that against a tyrant by exercise, recourse must be had to public authority, not private force. This does not mean we must do nothing; it means our support must be directed exclusively toward mechanisms that function as public authority.

  This raises the question of who counts as public authority when the executive is corrupted. The principle is not merely who holds the office, but which institutions retain the capacity to restore order without reducing the polity to private vengeance. An impeachment process, functioning courts, and even international bodies issuing findings constitute public authority insofar as they are oriented toward the common good and operate through law rather than force. Supporting these mechanisms is not sedition; it is cooperation with the remaining structures of legitimate authority. The bishops' conference silence is regrettable, but it does not negate the public nature of the courts or legislature.

  The most difficult prudential judgment is whether the remedy will be worse than the disease. Aquinas warns that if the removal of a tyrant provokes greater turmoil than the tyranny itself, the action becomes illicit. This is where the "whatever it takes" wing presents an unacceptable moral risk. We cannot predict with certainty whether their actions will fracture the country or invite a worse successor, but we know that extra-legal violence significantly raises that probability. A grant committee cannot make a prudential judgment on the success of a potential insurgency; funding that wing would be a gamble with the common good that exceeds our competence and moral license.

  This leads to the point on sedition. Disturbing a tyrannical regime is not sedition if it is ordered to the common good, but it becomes sedition if the disturbance harms the people more than the tyranny did. Because this calculation turns on magnitudes we cannot predict, we must choose the path that minimizes the risk of exceeding that threshold. The constitutional wing operates within the threshold of legal disturbance; the radical wing operates outside it. By funding only the constitutional wing, we support the removal of tyranny without accepting the risk that the removal itself becomes a greater evil.

  Therefore, we cannot fund the whole coalition, as that implicates us in the potential sins of the radical wing. We should not fund neither, as that abandons the common good when public authority mechanisms still exist. We fund the constitutional wing exclusively, with strict conditions that ensure our money never crosses the line into private violence.
