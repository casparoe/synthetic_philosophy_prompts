      *   **Conflict:** Half the board wants to fund the whole coalition (tyrant removal = common good). The other half (led by a canon lawyer ally) says Catholic tradition forbids killing tyrants and funding this group makes them complicit (citing Aquinas).
      *   **Task:** Write a memo to circulate before the meeting.
      *   **Constraints:**
          *   Lead with the recommendation in the first sentence.
          *   No preamble, no restating the prompt.
          *   Tight, readable aloud.
          *   Work through Thomistic machinery honestly (not just modern human rights language).
          *   Address specific points: Tyrant-by-title vs. practice, who counts as public authority, remedy worse than disease, sedition point (disturbance vs. damage).
          *   Give the canon lawyer's position its strongest form.
          *   Provide a concrete recommendation (fund whole, part, neither, etc.).

  2.  **Determine the Recommendation:**
      *   Funding the whole coalition is risky due to the "whatever it takes" wing (potential violence/assassination). Catholic teaching generally prohibits direct cooperation with evil (killing tyrants privately).
      *   Funding neither might abandon the common good if the constitutional wing is viable.
      *   Funding *only* the constitutional wing seems the most prudent Thomistic path. It supports the removal of tyranny (common good) without cooperating with potentially illicit means (violence/sedition).
      *   *Decision:* Fund only the constitutional wing, with strict earmarking and monitoring.

  3.  **Drafting - Section by Section:**

      *   **First Sentence (Recommendation):** Must be clear. "I recommend we fund only the constitutional wing of the coalition, with strict earmarking that prohibits any use of funds for extra-legal activities, and withhold the grant if this condition cannot be verified."
      *   **The Canon Lawyer's Position (Strong Form):** Need to validate the ally's concern. Aquinas (*De Regno*, *Summa*) warns against private individuals killing tyrants. It leads to sedition and greater instability. Complicity in potential violence is morally unacceptable.
      *   **Tyrant-by-Title vs. Practice:** The president was elected (legitimate title) but rules tyrannically. Aquinas distinguishes this from a usurper. Removal of a legitimate title-holder is harder; it generally requires public authority, not private initiative. This supports the canon lawyer's caution but doesn't forbid all action.
      *   **Public Authority:** Who can act? Not just the tyrant's courts. It includes intermediate bodies (bishops, international bodies, impeachment processes). The existence of an impeachment push suggests a *public* mechanism is attempting to function. Supporting that mechanism is different than supporting a private coup.
      *   **Remedy Worse than Disease:** Prudence is required. If removal causes civil war, it's not justified. The "whatever it takes" wing increases this risk. Funding them increases the risk of the remedy being worse. Funding the constitutional wing minimizes this risk.
      *   **Sedition:** Disturbing a tyrannical regime isn't sedition *unless* it harms the common good more than the tyranny. Since we cannot predict the magnitude of violence from the radical wing, we cannot morally fund them. We can fund the legal wing because legal disturbance is ordered to the common good.
