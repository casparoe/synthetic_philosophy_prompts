prompt: |-
  I've been reading the rationalist blogs since the old LessWrong days and I've thought about this alot, and I run a small monthly discussion group at a coworking space — twelve or so people, mostly programmers, one med student, one actuary, nobody past a college intro stats course. Next month it's my slot and I've claimed the reference class problem.

  Don't explain it to me, plan how I explain it. Ive got 45 minutes and a whiteboard. What I want is the order the pieces have to go in and why each one has to land before the next one makes sense — which piece is load bearing, what I can safely put on the board first without it being a lie I have to walk back later. One case has to carry the whole thing, and I want to know what that case needs. My candidate: my sister asks me her odds of getting into one specific PhD program, and I can put her in the class of everyone who applied to that program, or everyone with her GPA and GRE, or everyone who applied that year, or everyone who has ever asked me for a life prediction, and finally in the class with exactly one member, her — which yields 0 or 1 and is therefore useless. Does that case do the job, or does it smuggle in something (all the classes being natural, the answers being far apart) that I should be engineering on purpose? Tell me what to swap or add.

  Then the misconceptions. My guesses: that this is just the small-sample problem; that a more specific class is always better; that Bayes makes it go away if you're careful; that it only bites frequentists; and that if no class is privileged then anything goes and all probabilities are made up. Which of those will actually show up, which am I imagining, what's the one I'm missing, and at what point in the sequence do I have to head each one off — before the case or after it? Also give me one question to ask at the end that shows whether they got the problem or just learned the vocabulary, and tell me what to leave out at this level and say out loud that I'm leaving it out.

  Last thing: if the shape I've got in mind is wrong — like if the thing I'm treating as the punchline is really a different problem wearing the same coat, or if the lesson I want them to take away is the wrong lesson — just say so. Don't humor me and build the plan anyway. I'd rather find out now than in front of the group.
reasoning: |-
  Here's a thinking process that leads to the suggested plan:

  1.  **Analyze the User and Context:**
      *   **User:** Long-time rationalist reader (old LessWrong days), runs a small discussion group (12 people, mostly programmers, one med student, one actuary).
      *   **Knowledge Level:** High conceptual familiarity with rationality concepts, but limited formal stats (none past intro college stats).
      *   **Task:** Plan a 45-minute session on the Reference Class Problem (RCP).
      *   **Constraints:** Whiteboard available. Needs a specific sequence (load-bearing pieces). Needs to know if the proposed case (sister's PhD application) works. Needs to address misconceptions. Needs a final comprehension check question. Needs to know what to omit.
      *   **Tone:** Direct, critical, non-pandering ("Don't humor me... just say so").

  2.  **Evaluate the Proposed Case (Sister's PhD Application):**
      *   *Pros:* Relatable, intuitive, clearly demonstrates nested classes (all applicants -> similar GPA -> similar field -> etc.).
      *   *Cons:* It risks implying that there *is* a "true" probability hidden somewhere in the narrower classes, or that the problem is just about finding the "right" data. It might also feel like a "prediction problem" rather than a "probability definition problem."
      *   *Critical Flaw:* The user asks if it smuggles in assumptions (all classes being natural, answers far apart). Yes, it does. The classes *look* natural (GPA, GRE), but they are arbitrary cut-offs. The bigger issue is that for a *single* event (sister getting in), the frequency interpretation breaks down completely.
      *   *Verdict:* It's a strong *introductory* hook, but it's not strong enough to carry the *whole* philosophical weight. It needs a second case that is more abstract or decision-theoretic to prevent the "just get more data" solution.
      *   *Recommendation:* Keep the sister case for the hook, but add a second case (insurance/actuarial or legal) to show the stakes. Actually, since there's an actuary in the group, an insurance case is dangerous (they might think they solve it daily). A legal/liability case is better. Or, stick to the sister case but push it harder into the "single case" wall. Let's stick with the sister case but refine *how* it's used to avoid the "just narrow the class" trap.

  3.  **Determine the Sequence (The "Load-Bearing" Order):**
      *   *Goal:* Show that probability is not a property of the event, but a property of the *description* of the event.
      *   *Step 1: Intuition Pump.* The Sister Case. Establish that different classes give different numbers.
      *   *Step 2: The Conflict.* Why can't we just pick the narrowest class? (The "Single Case" problem / 0 or 1).
      *   *Step 3: The Consequence.* Decision making. If probabilities differ, actions differ. Which action do we take?
      *   *Step 4: The Resolution (or lack thereof).* It's not a math problem; it's a modeling choice.
      *   *Why this order?* If you start with definitions, they tune out. If you start with the "nothing is real" conclusion, they think it's nihilism. You need the tension first.

  4.  **Address Misconceptions:**
      *   *Small-sample problem:* No, RCP exists even with infinite data for the classes. Need to clarify this early.
      *   *Specific is always better:* This is the big one. Need to smash this in Step 2.
      *   *Bayes makes it go away:* No, Bayes requires priors, priors require reference classes. This is a meta-problem.
      *   *Only bites frequentists:* No, subjectivists have to choose which evidence to condition on.
      *   *All probabilities are made up:* This is the nihilistic trap. Need to distinguish "arbitrary" from "purpose-relative."
      *   *Missing Misconception:* "The true probability exists but is hidden." (The Ontological Trap). This is the most dangerous one for rationalists. They often think there's a "real" propensity.

  5.  **Drafting the Plan (Iterative Refinement):**

      *   *Critique of the User's Plan:* The user wants to know if the sister case is enough. I need to tell them it's *almost* enough but risks the "more data" solution. I need to advise them to explicitly block the "just narrow the class" move.
      *   *Sequence:*
          1.  The Hook (Sister).
          2.  The Trap (Narrowing).
          3.  The Wall (Single Case).
          4.  The Pivot (Purpose).
          5.  The Takeaway (Instrumentalism).
      *   *Misconception Timing:* Address "Small Sample" immediately. Address "Bayes" after the Pivot. Address "Nihilism" at the end.
      *   *Final Question:* Needs to force a choice between classes based on *goals*, not "truth."
      *   *Omissions:* Measure theory, Cox's Theorem, deep frequentist vs. Bayesian history.

  6.  **Refining the "Sister Case":**
      *   The user worries about "all classes being natural." I should advise them to make one class clearly *gerrymandered* to show that *any* class works mathematically but not pragmatically. E.g., "People named Sarah applying to PhD programs."
      *   The user worries about "answers being far apart." This is good. Keep it.
      *   *Crucial Advice:* The case works *if* you emphasize that the *event* (Sister gets in) doesn't change, only the *number* does.

  7.  **Final Review against Constraints:**
      *   45 minutes? Yes, the sequence fits.
      *   Whiteboard? Use it for the nested circles.
      *   Audience? Programmers/Actuary. They like logic and systems. Appeal to the "garbage in, garbage out" aspect.
      *   Tone? Direct. "Here is where you are wrong."

  8.  **Constructing the Output:** (Mental Outline)
      *   **Verdict on the Case:** It works, but with a specific warning about the "narrowing" instinct.
      *   **The Sequence:** 5 distinct moves on the whiteboard.
      *   **Misconceptions:** Map them to the sequence steps.
      *   **The Final Question:** A scenario requiring class selection based on utility.
      *   **Omissions:** What to explicitly say you're skipping.
      *   **Shape Check:** Is the lesson right? Yes, the lesson is "Probability is a tool, not a property."

      *(Self-Correction during drafting)*: Wait, the user asked "if the shape I've got in mind is wrong... just say so."
      *   Is the RCP the right lesson? For this group (programmers/rationalists), the danger is treating probabilities as objective properties of code/systems. The RCP is the perfect wedge to show that *models* are choices.
      *   However, the "Sister" case is a *prediction* case. RCP is often deeper in *causal inference*. But for 45 mins, prediction is fine.
      *   One major risk: The Actuary. They deal with RCP daily (pricing risk). They might say "We use GLMs to weight features." I need to make sure the user is prepared for the "Just use regression" objection. Regression *is* a way of smoothing reference classes, but it doesn't solve the philosophical problem of which features to include. I should add a note about this.

      *(Final Polish)*: Ensure the tone matches the "old LessWrong" vibe—precise, slightly pedantic but useful, no fluff.

      *Let's structure the response:*
      1.  Verdict on the Case (Yes, but...)
      2.  The Sequence (The 5 moves).
      3.  Misconception Mapping (When to kill which zombie).
      4.  The Final Question.
      5.  What to Leave Out.
      6.  The "Shape" Check.

      *Wait, one more thing:* The user asked "which piece is load bearing." The load-bearing piece is the transition from "Which class is true?" to "What is this probability *for*?" If that doesn't land, the rest is just skepticism. I need to highlight that.

      *Okay, ready to write.*
answer: |-
  Here is the plan. I am not going to humor you: your shape is mostly right, but your case is slightly fragile, and you are underestimating the "Actuary in the room" problem.

  ### 1. Verdict on the Case
  **Does the sister case do the job?**
  Yes, but it has a failure mode. It naturally invites the solution: *"Just build a logistic regression model with all the relevant features."* Your actuary or programmers will try to solve the Reference Class Problem (RCP) by turning it into a Feature Selection Problem. They will think more data + better algorithm = true probability.

  **The Fix:**
  You must engineer the case to block the "more data" escape hatch.
  *   **Don't** just use GPA/GRE/Year.
  *   **Do** include a class that is statistically valid but pragmatically absurd. Example: "People named [Sister's Name] applying to PhD programs." Or "People applying to PhD programs on a Tuesday."
  *   **Why:** This proves that *any* shared property defines a class with a frequency. If you don't show a "gerrymandered" class, they will think the problem is just finding the *natural* kinds. There are no natural kinds in statistics.

  **Load-Bearing Piece:**
  The transition from **"Which number is true?"** to **"What is this number for?"**
  If you do not land this, you have only taught them skepticism, not rationality. The load-bearing beam is that probability is not a property of the *world*, it is a property of the *map*, and maps are chosen based on destination.

  ### 2. The Sequence (45 Minutes)
  Use the whiteboard. Do not start with definitions. Start with the conflict.

  **Move 1: The Conflict (0-10 mins)**
  *   **Action:** Write "Sister's PhD Admission" in the center. Draw three circles around it.
      *   Circle A: All applicants (Acceptance rate: 20%).
      *   Circle B: Applicants with GPA > 3.8 (Acceptance rate: 60%).
      *   Circle C: Applicants with GPA > 3.8 + GRE > 90th %ile (Acceptance rate: 80%).
  *   **Ask:** "What is the probability she gets in?"
  *   **Goal:** Get them to argue for B or C. Establish that the *event* is identical (Sister gets in/not in), but the *number* changes based on how you look at it.
  *   **Why first:** You need them to feel the tension before you give them the vocabulary.

  **Move 2: The Wall (10-20 mins)**
  *   **Action:** Draw a tiny circle D: "Exactly people with Sister's exact atomic configuration at time T." Size = 1. Outcome = 0 or 1.
  *   **Ask:** "If specific is better, why is D useless?"
  *   **Goal:** Kill the intuition that "more specific = more true."
  *   **Why here:** This creates the crisis. If broad is biased, and specific is useless, where does the number come from?
  *   **Misconception Check:** This is where you head off **"Small Sample Problem."** Explicitly say: "Even if we had infinite data on Class C and infinite data on Class B, they still give different numbers. This is not about noise."

  **Move 3: The Pivot (20-30 mins)**
  *   **Action:** Erase the circles. Write: **"What are we doing with this number?"**
  *   **Scenario:**
      *   If we are betting money on her admission: Use the broad class (market odds).
      *   If we are advising her on whether to study for the GRE: Use the narrow class (causal leverage).
      *   If we are the University setting tuition budget: Use the aggregate class.
  *   **Goal:** Shift from *Ontology* (what is real?) to *Instrumentalism* (what is useful?).
  *   **Why here:** This is the load-bearing beam. It resolves the paradox by dissolving the demand for a "True Probability."
  *   **Misconception Check:** Head off **"Bayes makes it go away."** Say: "Bayes tells you how to update, it doesn't tell you which prior class to start with. The RCP is a prior problem."

  **Move 4: The Generalization (30-40 mins)**
  *   **Action:** Connect to their domains.
      *   Programmers: "What is the latency of this function?" (Avg over all runs? 99th percentile? On this specific server?)
      *   Med Student: "What is the survival rate?" (All patients? Patients this age? Patients with this genotype?)
  *   **Goal:** Show this isn't just a philosophy puzzle; it's a bug in their daily reasoning.
  *   **Misconception Check:** Head off **"Only bites Frequentists."** Subjectivists have to choose which evidence to condition on. $P(A|B)$ is different from $P(A|B,C)$. Choosing C is the RCP.

  **Move 5: The Conclusion (40-45 mins)**
  *   **Action:** Summarize. "There is no P(Sister). There is only P(Sister | Class). Choosing the Class is a value judgment, not a math problem."
  *   **Misconception Check:** Head off **"All probabilities are made up."** They aren't arbitrary; they are constrained by data and *purpose*.

  ### 3. Misconceptions: Which are Real?
  *   **"Just the small-sample problem":** **REAL.** They will say this immediately in Move 2. You must kill it there by positing infinite data.
  *   **"Specific class is always better":** **REAL.** This is their default intuition. Move 2 exists solely to break this.
  *   **"Bayes makes it go away":** **REAL.** Rationalists love Bayes as a magic bullet. Address this in Move 3.
  *   **"Only bites Frequentists":** **IMAGINED.** Your group isn't deep enough in Bayesian theory to think this yet. Skip it unless someone brings it up.
  *   **"If no class is privileged, anything goes":** **REAL & DANGEROUS.** This is the nihilism trap. If you don't land Move 3 (Purpose), they will leave thinking truth is impossible. You must emphasize that *purpose* privileges the class.
  *   **The Missing Misconception:** **"The True Probability Exists."** (The Ontological Trap). They will believe there is a "real" number hidden in the universe, and we are just too stupid to find it. You need to explicitly state: **"The number does not exist in the event. It exists in the relationship between the event and the model."**

  ### 4. The Final Question
  Do not ask "What is the Reference Class Problem?" That tests vocabulary.
  Ask this:

  > "I am an insurance company. I have a driver who is 25 years old (low risk class) but has had 3 accidents this year (high risk class). I need to set their premium for next year.
  >
  > If I want to **maximize profit**, which class do I use?
  > If I want to **incentivize safe driving**, which class do I use?
  >
  > Is there a third option that is 'more true'?"

  **Why this works:**
  *   It forces them to select a class based on *goal*, not "truth."
  *   If they say "Use a weighted average," ask "Weighted by what?" (Back to RCP).
  *   If they say "There is a true risk," they failed.
  *   If they say "It depends on what the contract is for," they got it.

  ### 5. What to Leave Out (Say This Aloud)
  You have 45 minutes. You cannot be rigorous.
  *   **Say:** "I am leaving out the measure-theoretic definition of probability. I am also leaving out causal inference frameworks like do-calculus, which attempt to solve this by modeling mechanisms rather than frequencies. We are talking about the epistemic problem, not the computational one."
  *   **Why:** This prevents the "Actually, technically..." interruptions from the pedants while signaling you know there's more depth.

  ### 6. Shape Check
  **Is the lesson right?**
  Yes. The lesson "Probability is a tool, not a property" is the correct rationalist takeaway.
  **Is the punchline right?**
  Your proposed punchline (0 or 1 is useless) is correct, but it's the *setup* for the real punchline. The real punchline is **"Therefore, you must declare your purpose before you calculate your odds."**
  If you end on "0 or 1 is useless," you've taught them skepticism. If you end on "Declare your purpose," you've taught them rationality.

  **One warning:** The Actuary.
  They price risk for a living. They *live* in the reference class problem. They might feel you are attacking their profession.
  **Pre-emption:** In Move 4, acknowledge them. "Actuaries solve this pragmatically by optimizing for solvency. That is a purpose. It doesn't make the probability 'true,' it makes it 'solvent.'" Validate their expertise while maintaining the philosophical point.

  **Final Instruction:**
  Write "P(Event | Class)" on the board in the first 5 minutes and leave it there. Every time someone says "probability," point to the board and ask "Conditional on what?" If you can get them to habitually ask "Conditional on what?", you win.
