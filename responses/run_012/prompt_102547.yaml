answer: |-
  Your hypothesis is remarkably precise, and it cuts closer to the structural engine of the dispute than most philosophical surveys admit. You have identified the friction point not merely as a clash of values, but as a conflation of two distinct operational definitions of "norm" that your own field keeps separate: the *statistical* (reference intervals) and the *teleological* (set points/regulatory targets).

  Here is my diagnosis of the dispute, engaging your hypothesis directly.

  ### 1. The Diagnosis: A Jurisdictional Dispute Disguised as Metaphysics

  The disagreement is not primarily substantive (about the nature of reality) nor purely verbal (about the definition of a word). It is **pragmatic and jurisdictional**. It is a dispute about where the authority of the physician ends and the autonomy of the patient (or the judgment of the society) begins.

  The Naturalist wants "disease" to be a gatekeeper for *medical expertise*. If disease is a biological fact, then the physician is the sovereign arbiter of who is diseased. This protects medicine from becoming merely a service industry for any unwanted condition.
  The Normativist wants "disease" to be a gatekeeper for *moral claim*. If disease is inherently bad, then labeling something a disease creates an obligation to treat or excuse. This protects patients from being medically managed for conditions that are merely statistically rare but not harmful (or statistically common but oppressive).

  The impasse exists because both sides are trying to use the single concept of "disease" to bridge the **Is-Ought gap** for administrative purposes. Medicine needs a biological fact (Is) to trigger a normative response (Ought—treatment, exemption, funding). The Naturalist tries to hide the Ought inside the Is. The Normativist insists the Ought is visible and primary.

  ### 2. The Two Norms: Why Your Physiology Analogy Holds

  Your distinction between the sampling norm and the criterion norm is the empirical key that unlocks the philosophical stalemate.

  **The Naturalist's Dilemma:**
  Boorse attempts to solve the "sampling" problem by invoking "species design." He claims he isn't just looking at the mean GFR; he is looking at the *functional contribution* of the kidney to survival and reproduction. However, as you know, physiological "design" is not a fixed blueprint; it is a history of regulatory compromises.
  When a Naturalist says a function is "impaired," they are implicitly appealing to a **criterion norm** (the kidney *should* filter at rate X to maintain homeostasis). But when challenged on *why* that is the criterion (e.g., in aging, or high-altitude adaptation), they often retreat to the **sampling norm** (most members of the species don't do this).
  *Your diagnosis:* The Naturalist appeals to the criterion norm to sound scientific (objective function) but relies on the sampling norm to avoid metaphysics (evolutionary design is hard to measure).

  **The Normativist's Leverage:**
  The Normativist exploits the gap between these two norms. They point to cases where the sampling norm and criterion norm diverge to show that biology alone is insufficient.
  *   **Aging:** GFR declines. Statistically normal for age (sampling). Functionally impaired relative to a young adult set-point (criterion). Is it a disease? Naturalists struggle here (Boorse calls it normal aging); Normativists say it depends on whether we value the loss.
  *   **Adaptation:** Insulin resistance in pregnancy. Biologically, it looks like pathology (criterion violation). Physiologically, it is a regulated state (new set point).
  *   **Your Race Coefficient Example:** This is the smoking gun. The equation used a statistical correlation (sampling) that was treated as a biological fixed effect (criterion), thereby normatively restricting access to care. The Normativist says, "See? You thought you were doing biology, but you were doing policy."

  ### 3. The Empirical Question: Plasticity and Determinacy

  You asked if there is a hidden empirical question: *Can physiology supply criterion norms that are determinate enough?*

  The answer from your field suggests **no**, not for the boundary cases that drive the philosophical dispute.
  Physiology is excellent at defining failure states (anuria, frank necrosis). It is poor at defining boundary states (hypertension, pre-diabetes, mild cognitive impairment). In these boundary states, the "set point" is plastic. It resets based on load, environment, and history.
  If the biological "criterion" is moving, it cannot serve as the fixed anchor the Naturalist requires. The Naturalist needs a static target to declare a miss. The Normativist points out that because the target moves, the declaration of a "miss" is actually a decision about *which* set point we prefer (e.g., do we treat BP to the level of a 40-year-old or an 80-year-old?).

  Therefore, the dispute persists because the Naturalist is promising a level of biological determinacy that complex regulatory systems cannot provide at the margins.

  ### 4. The Overloaded Concept: Four Jobs for One Word

  Your suspicion that the concept is asked to do too much is correct. "Disease" is currently asked to perform four distinct logical jobs:

  1.  **Explanation:** To identify the causal mechanism (The kidney is failing).
  2.  **Exemption:** To justify moral/legal excuse (He isn't responsible for his behavior).
  3.  **Entitlement:** To warrant resource allocation (Insurance will pay for this).
  4.  **Intervention:** To justify bodily intrusion (We may give him drugs).

  **The Conflict:**
  *   **Job 1 (Explanation)** favors the Naturalist. Causal mechanisms are biological facts.
  *   **Jobs 2, 3, and 4 (Exemption, Entitlement, Intervention)** favor the Normativist. These are inherently evaluative. We do not grant exemption or money based solely on statistics; we grant them based on harm and need.

  The dispute is intractable because a definition optimized for Job 1 (biostatistical function) fails at Job 3 (entitlement). If we define disease strictly by Boorse's criteria, many conditions warranting treatment (pregnancy, contraception, aging-related frailty) are excluded. If we define disease by Normativist criteria (harm/need), conditions that are harmful but not biological (ugliness, poverty) risk becoming medicalized.

  ### 5. What Counts as Progress?

  Given this diagnosis, progress will not come from a better definition of "disease." It will come from **conceptual differentiation** and **explicitly acknowledging the decision points**.

  **A. Split the Concept (The "Family Resemblance" Approach)**
  Progress looks like abandoning the search for necessary and sufficient conditions for a single concept. Instead, we accept that "disease" is a cluster concept.
  *   In **research contexts**, we use the Naturalist definition (pathophysiology).
  *   In **clinical/policy contexts**, we use a Hybrid or Normativist definition (harm + dysfunction).
  *   *Progress Metric:* When a philosopher or clinician stops asking "Is this *really* a disease?" and starts asking "Is this a disease *for the purpose of reimbursement* vs. *for the purpose of etiology*?"

  **B. Locate the "Decision Node"**
  Your race coefficient example is the model. Progress is recognizing exactly where the statistical norm was swapped for a criterion norm.
  *   *Progress Metric:* A formal requirement in medical guidelines to state: "This reference interval is statistical" vs. "This target value is therapeutic."
  *   In philosophy, this means admitting that the move from "impaired function" to "disease" is a **policy decision**, not a discovery. The Naturalist claims it is a discovery; the Normativist claims it is a decision. The truth is: the biology identifies the impairment; the society decides if that impairment counts as a disease warranting intervention.

  **C. Accept the "Boundary Problem" as Insoluble**
  Just as you cannot draw a sharp line in physiology between "regulated adaptation" and "decompensated failure" in all cases (there is a zone of indeterminacy), you cannot draw a sharp line between health and disease.
  *   *Progress Metric:* An argument that demonstrates why the vagueness is **functional**. If the concept were too precise, it would be too rigid to accommodate new medical capabilities or changing social values. The fuzziness allows the concept to evolve.

  ### Summary of the Diagnosis

  The dispute is **structural**. It arises because medicine attempts to use a biological category to perform a normative function.
  *   The **Naturalist** is trying to preserve the **objectivity of medical judgment**.
  *   The **Normativist** is trying to preserve the **normativity of medical obligation**.

  They are talking past each other because they are optimizing for different jobs of the concept. Your physiological insight regarding the two "norms" reveals that the Naturalist's "biological fact" often smuggles in a "criterion norm" that is not purely descriptive.

  **What to do next:**
  Do not try to solve the definition. Instead, investigate the **consequences of the conflation**. Look for arguments that propose **conceptual pluralism**—the idea that we should have different concepts for "pathology" (biological deviation), "illness" (subjective experience), and "sickness" (social role). If you find a framework that allows you to say, "This is a pathology (Naturalist) but not a sickness (Normativist)," you have found the tool to bypass the stalemate.

  The impasse is not a failure of philosophy; it is a accurate map of the friction between biological reality and social organization. Your task is not to resolve the friction, but to locate it precisely enough that it doesn't grind the gears of clinical reasoning.
