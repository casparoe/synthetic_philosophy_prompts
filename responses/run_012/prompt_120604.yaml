answer: |-
  **MA Thesis Prospectus**

  **Working Title:** Authority vs. Reason: A Relational Account of Advance Directives in Dementia

  **1. The Research Question**
  The standard debate over advance directives (ADs) in cases of advanced dementia asks a single, overloaded question: *Does the earlier competent self have the right to bind the later incompetent self?* This framing forces a binary choice between "precedent autonomy" (the earlier self rules) and "current interest" (the later self rules). Because both sides claim the mantle of autonomy, the debate reaches a stalemate.

  This thesis asks a more determinate question: **Can we separate the *authority* of an advance directive from its *normative force*?**

  Specifically, I argue that while transformative experience and ableist bias undermine the *binding authority* of the earlier self (the right to command), the directive retains significant *normative force* (reasons to comply) based on relational continuity and reliance. The thesis will defend the claim that ADs should be modeled not as binding statutes (entrenchment), but as constitutional amendments that require interpretation by a "living" successor.

  **2. Why Existing Positions Do Not Settle This**
  The literature is currently polarized between two camps, both of which conflate authority with reasons.

  *   **The Precedent Autonomy View (e.g., Dworkin):** Argues that critical interests extend across time. The earlier self has authority because dignity requires a unified narrative.
      *   *Weakness:* It ignores the epistemic gap. As per the literature on transformative experience, the earlier self cannot imagine the later state. To grant binding authority based on ignorant predictions is not autonomy; it is tyranny.
  *   **The Current Interest View (e.g., Dresser):** Argues that psychological discontinuity voids the directive. The later self's current well-being trumps past wishes.
      *   *Weakness:* It treats the selves as strangers. It ignores the "promise-like" structure of the AD and the reliance interests of the earlier self who planned their life around a specific end. It also risks validating the disability critique's worry that we systematically devalue the lives of the cognitively impaired by dismissing their past commitments.

  Both positions assume that if the earlier self lacks *authority*, the directive becomes moral scrap paper. My project challenges this assumption. I argue that a directive can lack the authority to *command* (due to epistemic ignorance and identity change) while still providing strong *reasons* for caregivers and the later self to comply (due to relational obligations and the value of life-narrative).

  **3. Theoretical Framework & Key Interventions**
  To disentangle authority from reasons, I will integrate three specific theoretical lenses often kept separate in this debate:

  1.  **Transformative Experience:** I will use the epistemic limitation argument to sever the claim of *binding authority*. If I cannot know what it is like to be demented, I cannot legitimately bind that future subject to my current preferences. This blocks the "entrenchment" model.
  2.  **The Disability Critique:** I will argue that ADs are often drafted under ableist assumptions that view disability as a fate worse than death. This further undermines the *epistemic validity* of the directive as a command. However, I will use this not to discard the AD, but to argue for a shift in how it is read: from a strict order to a statement of values.
  3.  **The Constitutional Analogy:** I will model the relationship between selves not as Legislator vs. Subject, but as Constitutional Framer vs. Living Court. The AD sets the "constitutional values" (entrenchment of core commitments), but the later self (via proxies/caregivers) acts as the living interpreter who must amend those values in light of new circumstances (the reality of dementia).

  **4. Methodology and Work Plan (8 Months)**
  *Target: 12,000–15,000 words.*

  **Months 1–2: Mapping the Stalemate & The Epistemic Wedge**
  *   **Reading:** Core autonomy debates (Dworkin, Dresser, Robertson) + Literature on Transformative Experience (Paul, etc.).
  *   **Writing:** Draft Chapter 1 (The Standard Debate) and Chapter 2 (The Epistemic Objection).
  *   **Goal:** Establish clearly why the "authority" claim fails. Show that ignorance of the future state makes binding authority illegitimate.
  *   **Milestone:** A 3,000-word draft proving that psychological discontinuity + transformative experience = no binding authority.

  **Months 3–4: The Disability Critique & Normative Force**
  *   **Reading:** Philosophical disability critique (Silvers, Kittay, etc.) + Literature on Promises/Relational Autonomy.
  *   **Writing:** Draft Chapter 3. Argue that while authority fails, *reasons* remain. The AD is a request for trust, not a command.
  *   **Goal:** Pivot the argument. Show that dismissing the AD entirely (as the Current Interest view does) violates the relational obligation we owe to our past selves.
  *   **Milestone:** A 3,000-word draft establishing the "Reasons without Authority" distinction.

  **Months 5–6: The Constitutional Analogy & Application**
  *   **Reading:** Selected legal theory on constitutional entrenchment vs. living interpretation (philosophical jurisprudence, not black-letter law).
  *   **Writing:** Draft Chapter 4. Apply the analogy. The AD is the Constitution; the proxy/caregiver is the Court.
  *   **Case Testing:** Apply this model to two hard cases: (1) The "Happy Dement" who refuses treatment contrary to AD; (2) The "Suffering Dement" whose AD requests death but who cannot consent.
  *   **Goal:** Show how the analogy solves the practical dilemma better than the binary model.
  *   **Milestone:** A 4,000-word draft with case applications.

  **Months 7–8: Synthesis, Revision, and Polish**
  *   **Writing:** Introduction and Conclusion. Full manuscript review.
  *   **Focus:** Ensure the distinction between authority and reasons is the through-line. Cut any tangents on legal theory that become too technical.
  *   **Goal:** Final 12–15k word manuscript.
  *   **Milestone:** Submission.

  **5. Success and Failure Conditions**

  **Success looks like:**
  *   A clear conceptual distinction between *binding authority* (which the thesis argues is lost) and *normative force* (which is retained).
  *   The constitutional analogy is used heuristically to explain *how* we weigh past values against present reality, without getting bogged down in legal technicalities.
  *   The disability critique is integrated as a reason to doubt the *content* of the directive, not a reason to discard the *practice* of advance planning.
  *   The conclusion offers a determinate recommendation: ADs should be treated as presumptive guidance requiring interpretation, not binding orders.

  **Failure looks like:**
  *   **Collapsing into Literature Summary:** Spending too much time recounting the Dworkin/Dresser debate without pushing the "Authority vs. Reasons" distinction.
  *   **Scope Creep on Analogy:** Getting stuck in the constitutional law literature. The analogy must remain philosophical; if I start citing case law, the project will blow past 15k words.
  *   **The "It Depends" Trap:** Concluding that sometimes the earlier self wins and sometimes the later self wins. The thesis must argue for a structural change in how we view the *type* of obligation the AD creates.
  *   **Feasibility Collapse:** Trying to solve the metaphysical problem of personal identity. I must bracket the "are they the same person?" question and focus on the "what obligations exist between them?" question.

  **6. Feasibility Check & Risk Assessment**
  *   **Word Count:** 12–15k words is tight for three major theoretical interventions (Transformative Experience, Disability, Constitutional Analogy).
      *   *Mitigation:* I will treat the Constitutional Analogy as an illustrative model in Chapter 4, not a standalone theoretical pillar. It serves the argument, not vice versa.
  *   **Time:** 8 months is realistic for this scope *if* I avoid empirical research. I cannot interview caregivers or analyze hospital data. This must remain a conceptual analysis.
  *   **Risk:** The disability critique could overwhelm the argument. If I focus too much on ableism, it becomes a paper about disability ethics rather than advance directives.
      *   *Mitigation:* I will restrict the disability critique to the *epistemic conditions* of drafting the AD (i.e., "you couldn't know what this life would be like"), rather than a broad critique of how society treats the disabled.
  *   **Verdict:** This fits. It is narrow enough to be finished but novel enough to avoid being a summary. The key is discipline in Month 5–6 to ensure the constitutional analogy doesn't become a distraction.

  **7. Provisional Chapter Outline**
  1.  **Introduction:** The Stalemate of Autonomy.
  2.  **The Authority Objection:** Transformative Experience and the Limits of Bindingness.
  3.  **The Normative Rescue:** Relational Obligations and the Disability Critique.
  4.  **The Constitutional Self:** Entrenchment, Amendment, and Interpretation.
  5.  **Conclusion:** From Command to Covenant.
