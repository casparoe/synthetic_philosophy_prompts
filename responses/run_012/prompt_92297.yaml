  I'm doing a philosophy of maths paper on intuitionistic logic and constructivism, and I keep getting bogged down in arguments with my flatmate, who's a mathematician and thinks the whole intuitionist thing is a fuss about notation — his line is that you can have your constructive scruples inside classical logic by just being careful about what you claim, and that anything the intuitionist says can be rephrased classically with a bit of double-negation bookkeeping, so nothing of substance is at stake. I don't think that's right, but every time I try to say why, I end up either appealing to something vague about "meaning" or falling back on the formal difference in which theorems come out, and neither of those seems to touch his point. What I want from you isn't a defence of intuitionism yet, it's the spec I'd need any defence to meet: what would a theory of the meaning of the logical connectives — and of mathematical existence claims — actually have to deliver in order to (a) be a real position rather than a restriction on what you're allowed to say, and (b) be something a classical mathematician has to engage with rather than shrug off. I'd rather the list be too demanding than too thin, and I want the case behind each item, not just a label.

  Some things I want covered, and you can tell me if they don't belong. It obviously has to say what the difference is between "we haven't proved A" and "we've proved not-A", and between a refutation and a mere absence of proof — I keep noticing that my flatmate slides between these when he says the intuitionist is just someone who hasn't finished. It has to say something about negation specifically, since the asymmetry between accepting A → ¬¬A while refusing ¬¬A → A is where the whole thing either becomes principled or looks like an arbitrary halt. It has to handle existence claims in maths: a constructivist won't say "there is a real number with such-and-such a property" on the strength of a reductio, and I want the requirement to be stated in a way that doesn't just presuppose constructivism, otherwise it's circular. It needs to face the disjunction property and the fact that intuitionistic logic has an existence property that classical logic lacks, and say whether that's a consequence of the meaning theory or the other way round. And it has to say what role the mind plays — a friend in the seminar insists the whole position collapses unless you take seriously the idea that mathematical objects are constructions of a thinking subject, and that proofs are things that happen at a time to someone, which sounds to me like it either does all the work or none. He also keeps bringing up choice sequences and the way the intuitionist continuum is supposed to behave differently, but I honestly can't tell whether that's a separate commitment or a stress test for the rest; flag it if you think the list has to include it, and say why.

  I also suspect at least two of the things on my mental list can't be held together, and I'd rather you say so than paper over it. One is that the meaning theory should be something a classical mathematician can accept as a partial account of meaning — so that the disagreement is about what else is needed, not about whether the clauses are right — while the same theory has to make classical reasoning about infinite totalities not merely unproved but actually mistaken. Another is that validity itself has to be understood constructively, in the same spirit as everything else, while the account still has to explain why the intuitionistic rules are the valid ones, which seems to need me to quantify over all possible proofs or all possible constructions, and I can't see how to do that without stepping outside the position. Tell me which of these is a real clash and which is just me being confused. Also, I'd like to know which single requirement on your list does the most work, in the sense that accepting it rules out the most otherwise-attractive candidates — that's the bit I'd most like to get right before I start reading around.

  Format it like this, please: first a section titled "The requirements", which is the bulk of it, each requirement in its own short paragraph with the case or consideration behind it and a clear line on whether it's non-negotiable or just something one camp likes; then a section titled "Clashes", where you take the pairs I raised plus any you find yourself, and say which are genuinely jointly unsatisfiable; then a section titled "Where the usual suspects fall down", kept short, just a few lines each, and don't do a full scorecard; and finish with a section titled "The requirement that does the most work", a short paragraph. No citations or reading lists, obviously — I can't use them anyway, and I'd rather have the argument.
