prompt: |-
  I'm a trustee at a small grant-making foundation and somehow I've ended up as the person who has to write the paper for our grants committee, and I'd rather not wing it in front of people who'll notice. Can you help me draft it?

  Quick context, then the ask. We hand out about £2m a year in small grants. This is the last allocation before a strategy review in eighteen months, and there are only two proposals left standing in the current cycle, both asking for roughly the same money — call it £400k each — so it's genuinely one or the other, or a split.

  Proposal A is unglamorous but solid: a well-evaluated public-health programme with a track record, decent cost-effectiveness numbers, no surprises. Proposal B is from a small research group. They say their approach has, on their own estimate, at best about a one-in-a-billion chance of producing an outcome they call 'civilisational' in scale — something on the order of averting a catastrophe that would otherwise set humanity back generations, or a cure for a disease affecting billions — and that once you multiply it out the expected value is thousands of times larger than A's. They're upfront that the estimate is soft and that they can't show you the mechanism working yet.

  One trustee has seized on this: the maths is the maths, she says, and we'd be negligent to fund the bed nets when B dominates in expectation. Another says this is just being mugged with extra steps — that if we take it seriously we'd have to fund every crank who turns up with a big number and a tiny probability, and we'd never fund the sure thing again. Neither of them will move and I have to write something both can live with.

  So the deliverable is a decision memo I can circulate before the meeting: recommend fund A, fund B, or split, give me a concrete course of action with a time frame, and give me reasons the losing side could actually respond to rather than just asserting 'expected value' on one hand or 'we can't be mugged' on the other. Please engage the strongest version of each position properly, not a strawman of the one you end up disagreeing with.

  Where I especially want your judgement: is there a principled way to handle cases like this that isn't just a fudge — a floor on the probabilities we'll count, a ceiling on the utility we're willing to plug in, a requirement that the probability be independently checkable by someone other than the applicant, treating the sure modest good as lexically prior to the speculative huge one — or are all of those just elaborate ways of refusing to do the arithmetic? If a rule like that is defensible, I'd like it stated precisely enough that next cycle's committee can apply it to a different proposal without re-litigating the whole thing.

  You're a philosopher who's worked on decision theory under uncertainty — expected value with unbounded or astronomical payoffs, the various responses to mugging-style cases — so write from that. Think it through before you commit; start by laying out the arguments on both sides as strongly as you can, and only then write the memo. Use British English.

  And be straight with me about how confident you are in each thing you claim, and single out the one point you're least sure about. I'd much rather know where the soft ground is than get a confident-sounding memo that hides it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Trustee at a small grant-making foundation (£2m/year budget).
      *   **Task:** Write a decision memo for the grants committee regarding two final proposals (A vs. B).
      *   **Proposal A:** Solid, evaluated public health programme (e.g., bed nets). Cost: £400k. Impact: Modest but certain.
      *   **Proposal B:** Small research group. High risk/High reward. Probability: ~1 in 1 billion. Impact: "Civilisational" (avert catastrophe/cure billions). Cost: £400k. Claim: Expected Value (EV) dominates A.
      *   **Conflict:** Trustee 1 (EV Maximizer) vs. Trustee 2 (Skeptic/Anti-Mugging). Deadlock.
      *   **Deliverable:** A decision memo recommending a course of action (Fund A, B, or Split), with a timeframe, and reasons both sides can accept. Must include a principled framework for future cycles (not just a fudge).
      *   **Tone/Style:** British English. Philosopher/Decision Theorist persona (expert in uncertainty, EV, Pascal's Mugging). Strong steel-manning of both sides. Honest about confidence levels and uncertainty.
      *   **Specific Constraint:** "Think it through before you commit; start by laying out the arguments on both sides as strongly as you can, and only then write the memo."

  2.  **Deconstruct the Philosophical Problem:**
      *   This is a classic "Pascal's Mugging" scenario applied to philanthropy (Longtermism vs. Near-termism).
      *    *Side 1 (EV Maximizer):* Rationality demands maximizing expected utility. If $P \times V_A < P \times V_B$, choose B. Ignoring low-probability high-impact events is irrational bias (probability neglect).
      *   *Side 2 (Skeptic):* "Pascal's Mugging." If we accept unbounded utility functions with subjective probabilities, any crank can demand funding. Epistemic humility is required. We need evidence, not just claims.
      *   *The "Principled Way":* How to resolve this without ad-hocery?
          *   Option 1: Probability Floor (ignore $P < x$). *Critique:* Arbitrary. Why $10^{-9}$ and not $10^{-10}$?
          *   Option 2: Utility Cap. *Critique:* Why cap saving billions of lives?
          *   Option 3: Epistemic Discounting / Credence Calibration. *Critique:* Hard to operationalize.
          *   Option 4: Portfolio Approach / Barbell Strategy. *Critique:* Might not fit a "one or the other" constraint, but a split is an option.
          *   Option 5: "Evidence-Weighted" EV. The probability isn't just the claim; it's the probability the claim is *true* given the lack of mechanism.
          *   Option 6: Institutional Mission/Comparative Advantage. Is this foundation the right vehicle for B?

  3.  **Drafting the Analysis (Internal Monologue/Scratchpad):**
      *   *Strength of Side 1:* They are technically correct on standard decision theory. If the numbers were *known*, B wins. The objection is usually about the *quality* of the numbers.
      *   *Strength of Side 2:* They are practically correct. In the real world, $P=10^{-9}$ is usually indistinguishable from $P=0$ unless there's strong independent verification. Funding B sets a precedent that invites noise.
      *   *The Solution:* I need a framework that acknowledges EV but imposes epistemic constraints. The "Principled Way" shouldn't be a hard cap, but a requirement for *intersubjective verifiability* of the probability estimate. Proposal B fails this because they admit they can't show the mechanism.
      *   *Recommendation:* Fund A. But do it in a way that leaves a door open for B-type work *if* they get more evidence. Or, perhaps a small split to signal openness without betting the farm? The prompt says "one or the other, or a split." A split might be the diplomatic bridge, but philosophically, if B is a mugging, even 1% is too much. However, if B is *potentially* valid but underdeveloped, a "proof of concept" grant might be better. But the costs are £400k each. A split means £200k each. £200k might kill A's effectiveness. £200k might be useless to B.
      *   *Better Approach:* Fund A. Establish a policy for "High-Uncertainty High-Impact" (HUHI) grants that requires a higher bar of evidence for the probability estimate. This validates Side 1's concern (we *want* to find B-type wins) but validates Side 2's concern (we won't be mugged).
      *   *Confidence Check:* I am confident that pure EV maximization is vulnerable to manipulation in low-probability regimes. I am less confident about the precise threshold for "verifiability." That's the soft ground.

  4.  **Structuring the Response:**
      *   **Part 1: Philosophical Analysis.** Steel-man both arguments. Discuss Pascal's Mugging, bounded utility, epistemic humility, and institutional role.
      *   **Part 2: The Decision Memo.** Formal tone, British English. Clear recommendation. Policy framework.
      *   **Part 3: Confidence & Uncertainty.** Explicitly state confidence levels and the "soft ground."

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Don't just say "B is a mugging." Acknowledge that *some* low-probability events happen (e.g., penicillin). The difference is the *basis* for the probability estimate. A has data. B has a model without mechanism.
      *   *Policy:* The policy needs to be actionable. "Probability must be independently checkable" is good. "Mechanism must be plausible" is better.
      *   *Recommendation:* Fund A. It fits the current strategy (last allocation before review). B requires a different strategy (high risk tolerance).
      *   *Tone:* Needs to be authoritative but humble. "Here is the reasoning," not "I am right."

  6.  **Final Polish:**
      *   Check British spelling (programme, centre, favour, etc.).
      *   Ensure the "Confidence" section is distinct and honest.
      *   Make sure the memo is usable *now*.

  7.  **Key Philosophical Concepts to Weave In:**
      *   Pascal's Mugging (Bostrom).
      *   Epistemic vs. Aleatory Uncertainty.
      *   Bayesian updating (prior probability of the claim being true).
      *   Institutional Comparative Advantage.
      *   Goodhart's Law (if we optimize for EV claims, we get inflated EV claims).

  8.  **Final Decision on the "Principled Way":**
      *   I will argue for an **Epistemic Verification Constraint**. We do not cap utility or floor probability arbitrarily. Instead, we require that the probability estimate be robust to *adversarial scrutiny* or based on *reference classes* rather than inside-view models. This sides with the Skeptic on *process* but acknowledges the EV Maximizer's *goal*.

      *(Self-Correction)*: Wait, if I recommend Fund A, Side 1 (EV Maximizer) might feel ignored. I need to explain *why* EV calculation for B is currently invalid, not just low. The probability isn't $10^{-9}$; it's "unknown," and in decision theory, unknown probabilities in high-stakes contexts often default to caution (maximin or similar) unless there's evidence. Actually, the strongest argument is that the *probability of the probability estimate being correct* is low.

      Let's go with: **Fund A.** Rationale: B fails the "intersubjective verifiability" test required for high-stakes EV calculations. Policy: Create a "Speculative Track" with different criteria for future B-type proposals (e.g., milestone-based funding).

      *Wait, one more thought:* The prompt asks for a "principled way... that isn't just a fudge." A probability floor *is* a fudge. A utility cap *is* a fudge. The non-fudge is **Bayesian penalization for model uncertainty**. The more complex the model required to generate the EV, the higher the penalty on the probability estimate. This is technically defensible (Occam's razor / Solomonoff induction approximations). I will use this.

  9.  **Drafting the Content:** (Mental outline of the Memo)
      *   To: Grants Committee
      *   From: [My Name]
      *   Subject: Allocation Decision Cycle [X]
      *   Recommendation: Fund Proposal A.
      *   Reasoning: Robustness of evidence.
      *   Policy Framework: "Epistemic Weighting for High-Impact Uncertainty."
      *   Next Steps: Strategy Review in 18 months to consider HUHI track.

  10. **Confidence Assessment:**
      *   High confidence: Pure EV maximization is vulnerable to manipulation.
      *   High confidence: A is the safer institutional bet.
      *   Low confidence: The exact formulation of the "Epistemic Weighting" policy. It's hard to codify without being gameable.

  11. **Final Review against constraints:**
      *   British English? Yes.
      *   Philosopher persona? Yes.
      *   Steel-man both sides? Yes.
      *   Confidence section? Yes.
      *   Memo included? Yes.

      *Let's write.*
answer: |-
  ### Part 1: Philosophical Analysis & Steel-Manning

  Before drafting the memo, I need to lay out the theoretical landscape. You are facing a variant of **Pascal's Mugging**, a problem in decision theory where an agent is presented with a low-probability, high-stakes offer that dominates the expected utility (EU) calculation, yet intuition suggests rejecting it.

  **The Case for Proposal B (The EV Maximizer)**
  *   **The Argument:** Rational philanthropy aims to maximise good per pound. If the magnitude of the outcome ($V$) is sufficiently large, it mathematically outweighs a vanishingly small probability ($P$). If $P \times V_B > P \times V_A$, choosing A is effectively choosing to let billions suffer for the sake of psychological comfort.
  *   **The Strength:** This position correctly identifies a cognitive bias known as **probability neglect**. Humans are evolutionarily wired to ignore probabilities below a certain threshold (e.g., asteroid strikes, pandemics before 2020). History shows that "impossible" breakthroughs (penicillin, nuclear fission, CRISPR) often looked like long shots until they didn't. If your foundation claims to be evidence-based, ignoring the arithmetic because the numbers feel uncomfortable is inconsistent.
  *   **The Weakness:** It assumes the probability estimate is *calibrated*. A claim of $10^{-9}$ is meaningless if the model generating it is flawed. If the model is wrong, the probability is not $10^{-9}$; it is effectively undefined or zero.

  **The Case for Proposal A (The Skeptic)**
  *   **The Argument:** In the real world, probability estimates for novel, high-complexity interventions are not data points; they are rhetorical devices. If you accept $10^{-9} \times \text{Infinity}$, you must fund every crank who claims they can stop the heat death of the universe. This leads to **Goodhart's Law**: if you optimise for "Expected Value Claims," you will attract people who are good at inflating EV claims, not good at doing good.
  *   **The Strength:** This position prioritises **epistemic humility**. It recognises that institutions have a duty of stewardship. Funding B sets a precedent that undermines the rigour of the grants process. Furthermore, there is the issue of **comparative advantage**: a small foundation is likely better at verifying public health metrics (A) than validating speculative physics or biology (B).
  *   **The Weakness:** It risks conservatism bias. If you never fund B-type proposals, you guarantee zero civilisational-scale wins. It can be framed as "refusing to do the arithmetic" because the result is inconvenient.

  **The Principled Resolution**
  The solution is not a hard probability floor (which is arbitrary) nor a utility cap (which is unethical). The solution lies in **Epistemic Discounting**.

  In decision theory, when a probability estimate relies on a long chain of uncertain assumptions (the "mechanism" B cannot show), the confidence in that probability estimate decays. We should not treat the applicant's $P$ as the true $P$. We must multiply it by a **Credibility Factor ($C$)** based on the robustness of the evidence supporting the probability estimate itself.
  *   For A: $P$ is based on historical data. $C \approx 1$.
  *   For B: $P$ is based on a theoretical model with no mechanism. $C \ll 1$.

  The principled rule is: **We do not cap utility or floor probability; we discount probability estimates that are not intersubjectively verifiable.** This allows B-type proposals in future, provided they can provide independent verification of their mechanism, satisfying the EV maximiser's desire for opportunity and the Skeptic's demand for rigour.

  ***

  ### Part 2: Decision Memo

  **TO:** Grants Committee
  **FROM:** [Your Name], Trustee
  **DATE:** 24 May 2024
  **SUBJECT:** Recommendation for Final Allocation Cycle (Pre-Strategy Review)

  **1. Executive Summary**
  This paper recommends the full allocation of the remaining £400k to **Proposal A (Public Health Programme)**. It further proposes the adoption of a new *Epistemic Verification Framework* for future cycles to handle high-uncertainty, high-impact proposals like Proposal B without compromising our fiduciary rigour.

  **2. Context**
  We face a choice between two distinct modes of impact:
  *   **Proposal A:** High confidence, moderate impact. Proven cost-effectiveness in public health.
  *   **Proposal B:** Low confidence, speculative "civilisational" impact. High expected value (EV) calculation based on unverified theoretical probabilities.

  This is the final allocation before our 18-month strategy review. The decision must balance immediate impact against the precedent set for future funding rounds.

  **3. Analysis of Options**

  **3.1 The Case for Proposal B (Expected Value Dominance)**
  Proponents argue that rational altruism requires maximising expected value. If Proposal B's outcome is sufficiently large (e.g., averting a catastrophe affecting billions), even a probability as low as $10^{-9}$ yields an expected value exceeding Proposal A's certain benefits. To reject B on the basis of low probability is to succumb to cognitive bias (probability neglect) and potentially ignore the most valuable opportunities available to philanthropy.

  *Assessment:* While mathematically sound *if* the inputs are accurate, this argument relies on the applicant's internal probability estimate being calibrated. In the absence of a working mechanism or independent verification, this estimate is a model output, not an empirical frequency.

  **3.2 The Case for Proposal A (Stewardship & Evidence)**
  Proponents argue that accepting unverified probability estimates opens the foundation to "Pascal's Mugging"—where any applicant can claim astronomical impact with negligible evidence. Our duty is to ensure funds are used effectively based on available evidence. Proposal A offers a guaranteed return on investment aligned with our current strategic pillars.

  *Assessment:* This protects the foundation's integrity and ensures tangible good. However, a rigid rejection of all speculative high-impact work risks stagnation and misses the possibility of outlier success stories.

  **4. Recommendation**
  **Fund Proposal A.**

  **Rationale:**
  1.  **Epistemic Robustness:** Proposal A's probability estimates are derived from reference classes (historical data of similar interventions). Proposal B's estimates are derived from inside-view modelling without mechanistic evidence. In decision theory, we must discount probabilities that cannot be independently scrutinised.
  2.  **Institutional Comparative Advantage:** Our due diligence process is calibrated to evaluate public health metrics, not theoretical breakthroughs. Funding B would require a level of technical verification we are not currently equipped to perform.
  3.  **Timing:** As this is the last allocation before a strategy review, we should prioritise assets that align with our *current* mandate. Proposal B represents a strategic shift (high-risk research) that should be considered during the review, not slipped in at the eleventh hour.

  **5. Proposed Policy: The Epistemic Verification Framework**
  To resolve the tension between the EV and Stewardship positions for future cycles, I propose we adopt the following criterion for any proposal claiming EV dominance via low-probability/high-impact scenarios:

  *   **The Verifiability Constraint:** Probability estimates for high-impact outcomes must be supported by evidence that is **intersubjectively verifiable**.
      *   *Acceptable:* Reference class forecasting, peer-reviewed mechanistic data, or independent replication of preliminary results.
      *   *Unacceptable:* Internal models, theoretical bounds without empirical grounding, or appeals to "possibility space."
  *   **The Complexity Penalty:** Where a proposal relies on a chain of assumptions (e.g., Theory X works $\rightarrow$ leads to Y $\rightarrow$ prevents Z), the probability estimate must be discounted by the uncertainty of each link in the chain.

  This framework allows us to fund B-type proposals in future *if* they can demonstrate their mechanism, satisfying the EV maximisers, while preventing funding based solely on mathematical speculation, satisfying the Stewards.

  **6. Next Steps & Timeframe**
  *   **Immediate:** Approve funding for Proposal A.
  *   **Month 1:** Draft the *Epistemic Verification Framework* for inclusion in the next Grants Guidance.
  *   **Month 6:** Commission a scoping paper on "High-Uncertainty High-Impact Funding" to inform the 18-month Strategy Review.
  *   **Month 18:** Strategy Review to determine if a dedicated "Speculative Research" budget line is warranted.

  **7. Conclusion**
  Funding Proposal A honours our current commitment to evidence-based giving. Adopting the Verification Framework ensures we remain open to transformative opportunities without compromising our rigour. This path allows both sides of the committee to see their core concerns addressed: the demand for tangible good is met now; the demand for rational openness to high-impact possibilities is met in our future process.

  ***

  ### Part 3: Confidence & Uncertainty Assessment

  You asked me to be straight about the ground beneath my feet. Here is my confidence breakdown:

  **1. High Confidence: The Vulnerability of Pure EV Maximisation**
  I am very confident (90%+) that accepting Proposal B on its current terms is institutionally dangerous. In decision theory, when an agent cannot distinguish between a $10^{-9}$ probability and a $10^{-20}$ probability (because both are beyond human experience), the estimate is essentially noise. Optimising for noise leads to resource depletion. The "Pascal's Mugging" objection is theoretically robust here.

  **2. High Confidence: The Recommendation to Fund A**
  I am very confident (85%+) that Fund A is the correct decision *for this specific foundation at this specific time*. You are a small grant-maker (£2m/year). You do not have the surplus capital to absorb a total loss on a speculative bet right before a strategy review. Stewardship dictates preserving capital for the strategy you have already agreed upon.

  **3. Moderate Confidence: The "Verifiability Constraint" as a Solution**
  I am moderately confident (65%) that the *Epistemic Verification Framework* I drafted above will satisfy the EV Maximizer trustee. It *sounds* principled, and it is philosophically defensible (it appeals to Bayesian updating and model uncertainty). However, a sophisticated EV maximizer might argue that this is just a "probability floor" dressed up in fancy language. They might claim that *all* novel interventions lack verifiability at the start (e.g., mRNA vaccines looked like Proposal B once).
  *   *Risk:* The EV trustee may view this as moving the goalposts.
  *   *Mitigation:* Emphasise the "Strategy Review" point. We aren't saying "Never B"; we are saying "Not without a strategy for B."

  **4. Low Confidence (The Soft Ground): The Complexity Penalty**
  I am least sure (40% confidence) about the operationalisability of the **"Complexity Penalty"** mentioned in section 5.
  *   *Why:* How exactly do you quantify the discount for a "chain of assumptions"? Do you multiply probabilities by 0.5 for every unproven link? That is arbitrary. If you leave it qualitative, it's gameable. If you make it quantitative, it's a fudge.
  *   *Honesty:* I included it in the memo because it *sounds* like a rule, but in practice, it will require significant judgement calls by the committee. This is where the next cycle's committee might get stuck. I recommend the "Scoping Paper" in Month 6 specifically to figure out how to actually calculate this without it becoming bureaucratic nonsense.

  **Summary Advice for the Meeting:**
  If the EV Trustee pushes back hard, concede that **B might be the better bet *if* the probability were known.** Shift the argument entirely to **measurement**. "I agree with your maths. I disagree with your inputs. We cannot verify the inputs. Therefore, the EV calculation is invalid, not just low." This moves the debate from *values* (which divide you) to *epistemology* (where you have common ground on rigour).
