answer: |-
  Right, pull up a chair. It sounds like a proper good setup, that—four of you above a pub in Leeds, avoiding the gym by wrestling with the end of the world. I can see why you're stuck. You've hit the wall that most of the literature bumps into around 2020, when the longtermists and the decision theorists really started locking horns.

  Your hunch about the bridge principle is sharp. In fact, I'd say you're about eighty per cent of the way to the diagnosis, but the remaining twenty per cent is where the real deadlock lies. Let's test that hunch against the positions, and then see if we can pin down exactly what sort of beast this disagreement is.

  ### Testing the Hunch: Ideal Theory vs. Practical Advice

  You suggest one side is asking what an ideal agent's preferences must look like, while the other is asking what an actual person should do with a number scribbled on the back of an envelope.

  If you look at the **Pro-Fanaticism** camp (the ones willing to hand over the wallet), they are indeed operating in the realm of ideal theory. They argue from axioms: Stochastic Dominance, Separability, Transitivity. Their claim is that if you reject the fanatic conclusion, you are committed to preferring one lottery over another even when the second is strictly better in every possible state of the world. To them, decision theory is a logic of consistency. If your preferences violate the math, you're incoherent, full stop. They aren't necessarily saying you *should* actually give the bloke your wallet in a dark alley; they're saying your *criteria of rightness* must accommodate the possibility. They assume the bridge principle is: *If it's rationally required for an ideal agent, it's normatively binding for us, modulo computational limits.*

  The **Anti-Fanaticism** camp often responds with practical constraints. They talk about probability thresholds, bounded utility, or the impossibility of estimating $10^{-30}$. But the strongest among them aren't just saying "it's hard to calculate." They're saying the framework itself yields the wrong verdicts. They are treating decision theory as a *decision procedure*. To them, a theory that tells you to ignore a certain small good for a vanishingly small chance of a vast good is not just impractical; it's substantively wrong about value.

  So, your hunch holds up: the Pro side treats the theory as a **criterion of rightness** (what makes an action rational), while the Con side often treats it as a **guide to action** (how to actually choose). When the Pro side says, "You must accept this to be coherent," the Con side hears, "You must actually do this," and rebels. They are talking past one another because they haven't agreed on whether the theory is descriptive of rationality or prescriptive for humans.

  However, that's not the whole story. If it were just that, someone would have simply said, "Ah, let's distinguish ideal rationality from feasible heuristics," and the room would have cleared. But they don't. The debate stalls because the Anti-Fanatics often argue that the Fanatic conclusion is *irrational* even for an ideal agent. They aren't just pleading human weakness; they are pleading that the axioms themselves are flawed.

  ### The Diagnosis: What Kind of Disagreement Is This?

  So, is it bedrock intuitions? A verbal dispute? A hard problem?

  It is a **clash of normative commitments masquerading as a technical dispute**, compounded by a **category error regarding model uncertainty**.

  Here is why it won't move:

  1.  **Competing Sacred Cows:** The Fanatics are protecting **axiomatic purity**. They believe that if you violate Stochastic Dominance or Separability, you are vulnerable to money pumps or dynamic inconsistency. To them, coherence is the highest virtue. The Anti-Fanatics are protecting **practical sanity**. They believe that a theory which commands you to ignore near-certain outcomes for astronomical long-shots is not a theory of rationality, but a *reductio ad absurdum*. To them, avoiding absurdity is the highest virtue. You cannot prove one virtue superior to the other without begging the question.
  2.  **The Hidden Empirical/Epistemic Layer:** Both sides are assuming we can cleanly separate the *value* of the outcome from the *probability* of the outcome. But in these fanatic cases, the probability isn't just "small"; it's **model-dependent**. When someone claims a $10^{-30}$ chance of saving $10^{30}$ lives, they aren't drawing from a known distribution like a deck of cards. They are asserting a model of reality that is itself wildly uncertain. The disagreement stalls because the Fanatics treat the probability as given (exogenous), while the Anti-Fanatics intuitively treat the probability estimate as unreliable (endogenous to the claim). The Anti-Fanatics are effectively applying a discount rate to the *credence* itself, not the utility, but they often lack the formal language to express this without looking like they're just arbitrarily truncating probabilities.

  It is not merely a verbal dispute. If it were, we could define our terms and move on. But the tension is real: either we accept that rationality can demand we ignore the near-certain, or we accept that rationality can be incoherent by the lights of standard axioms. It is a **hard problem**, but one that persists because we refuse to admit that Expected Utility Theory (EUT) might be a local tool, not a global law.

  ### What Counts as Progress?

  Given this diagnosis, sending round more papers on bounded utility or lexicographic preferences won't help. You've read them. They patch the hole but leak elsewhere. Here is what would actually move the needle for your group:

  **1. Distinguish 'Criteria' from 'Procedures' Explicitly**
  Stop asking "What should I do?" and start asking "What is the status of this rule?" Make it a condition of the discussion that you separate the **criterion of rightness** (what makes an act optimal) from the **decision procedure** (how we choose).
  *   *Progress:* If the Fanatics admit that an act can be "objectively rational" (maximising EV) but "subjectively irrational" (given our inability to assess the probabilities), and the Anti-Fanatics admit that our heuristics might violate axioms without making us "immoral," the heat drops. You might agree that EUT is the *truth* about value, but useless for *navigation* in the extreme tails.

  **2. Introduce 'Model Uncertainty' as a First-Class Citizen**
  The stalemate exists because you are treating the probability of the astronomical payoff as a known number. It isn't. It's a claim made by a source that could be mistaken, lying, or deluded.
  *   *Progress:* Shift the debate from "How do we handle tiny probabilities?" to "How does the probability of the *model being correct* decay as the claimed payoff increases?" If you formalise the idea that as the stakes approach infinity, the reliability of the probability estimate approaches zero faster, you might derive a bounded result without breaking the axioms. This moves the fight from value theory to epistemology.

  **3. Accept Pluralism (The 'Toolbox' Approach)**
  This is the hardest pill to swallow. You might have to admit that there is no single Decision Theory.
  *   *Progress:* Agree that EUT works for "medium stakes, known risks" (casino, insurance, career choices) but that a different framework (perhaps one with probability thresholds or risk-weighting) is required for "extreme stakes, model uncertainty" (existential risk, Pascal's Mugging). If you stop trying to force one framework to rule them all, the contradiction dissolves. It's not that one side is right; it's that both are trying to use a hammer to turn a screw.

  **4. The Honest Admission**
  Finally, be prepared for the possibility that this is a **conventional choice**.
  *   *Progress:* If, after six months, you haven't shifted, admit that the choice between Fanaticism and Anti-Fanaticism is not a discovery about the universe, but a **stipulation about how you want to live**. Do you want to live in a world where you never ignore a huge stake (Fanaticism)? Or a world where you are never bullied by low-probability threats (Anti-Fanaticism)? Pick your poison, codify it, and stop pretending the math will decide it for you.

  ### Summary for the Pub

  Next time you're up there, with a pint in hand, try this: tell the group the problem isn't the math. The math is fine. The problem is that you're asking a theory of *consistency* to solve a problem of *credibility*.

  The Fanatics are right that if the numbers are real, the logic holds. The Anti-Fanatics are right that the numbers are never real in the way the logic requires. The disagreement stalls because you're arguing about the logic when you should be arguing about the epistemology of the claims.

  If you can't agree on that, then my advice is to do what you started the group to do: avoid the gym. Drink the beer. Acknowledge that the universe might be absurd, and that no amount of scratching on a napkin will fix it. Sometimes the rational move is to stop playing the game.
