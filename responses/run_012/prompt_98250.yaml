answer: |-
  This is a translation task from ontology to information architecture. Your suspicion is well-founded: the debate over universals is, in large part, a debate about data modeling strategies that has been mistaken for a debate about the fabric of reality.

  Below is the systematic translation you requested, followed by the residue report and a definitive verdict.

  ---

  ### Part I: Translating the Positions

  In your framework, the world is a database. The "particulars" are rows (records/instances). The "universals" are schemas (types/classes). The "properties" are columns (attributes/fields). The "relation" between them is constrained by referential integrity and validation logic.

  Here is how the three major metaphysical positions map to your vocabulary.

  #### 1. Realism (Platonic/Aristotelian)
  **The Claim:** Universals exist independently of particulars. Many particulars share the *same* universal.
  **The Translation:** **Nominal Typing with a Central Catalog.**
  *   **The Universal:** A `CREATE TYPE` or `CREATE TABLE` definition stored in the system catalog (`INFORMATION_SCHEMA`). It has a unique Object ID (OID).
  *   **The Particular:** A row in a table that references that OID via a foreign key or implicit membership.
  *   **The Relation:** Referential Integrity. A row *is* an instance of `User` because it resides in the table `User` (or has a foreign key `type_id` pointing to the `Types` catalog table).
  *   **Key Mechanism:** The type definition exists in the catalog even if the table is empty. The OID is the universal. Two rows share a property (e.g., `color`) not because their data looks the same, but because their schema definitions point to the same column definition OID in the catalog.
  *   **Mapping:**
      *   Universal $\rightarrow$ Schema Object / Type Definition.
      *   Particular $\rightarrow$ Row / Instance.
      *   Instantiation $\rightarrow$ `INSERT` / Allocation.
      *   Sharing $\rightarrow$ Pointer equality to the same Type OID.

  #### 2. Resemblance Nominalism
  **The Claim:** Only particulars exist. "Universals" are just names we give to groups of resembling particulars.
  **The Translation:** **Structural Typing (Duck Typing) without a Registry.**
  *   **The Universal:** There is no `CREATE TYPE` entity. There is only a query pattern. "Redness" is not a table; it is `SELECT * FROM Objects WHERE color = 'red'`.
  *   **The Particular:** A row with a specific structure (columns and values).
  *   **The Relation:** Structural Equivalence. Row A and Row B are both "Users" not because they point to a `User` type ID, but because they both have columns `id: int`, `name: text`.
  *   **Key Mechanism:** Views. A "Universal" is a saved View. If you delete all rows, the View definition remains, but it is merely a query, not an independent entity governing the rows. The rows do not "know" they belong to the View.
  *   **Mapping:**
      *   Universal $\rightarrow$ Query / View / Interface Contract.
      *   Particular $\rightarrow$ Row / Value.
      *   Instantiation $\rightarrow$ Matching the structure.
      *   Sharing $\rightarrow$ Structural identity (same column names/types).

  #### 3. Trope Theory
  **The Claim:** Properties exist, but they are particularized. "The redness of this apple" is a distinct entity from "the redness of that apple," though they resemble each other.
  **The Translation:** **Row-Level Type Constraints (Dependent Types).**
  *   **The Universal:** A class of equivalent type-definitions.
  *   **The Particular:** A row where every cell carries its own type metadata.
  *   **The Relation:** Isomorphism. Row 1 has a column `color` of type `Red_1`. Row 2 has a column `color` of type `Red_2`. `Red_1` and `Red_2` are distinct objects in memory, but they are structurally isomorphic.
  *   **Key Mechanism:** Per-instance schemas. In a standard DB, all rows in a table share the same column definitions. In a Trope DB, every row could theoretically have its own schema definition attached as metadata. "Universals" are clusters of these row-specific schemas that are functionally equivalent.
  *   **Mapping:**
      *   Universal $\rightarrow$ Equivalence Class of Type Objects.
      *   Particular $\rightarrow$ Row + Attached Local Schema.
      *   Property $\rightarrow$ Cell Value + Cell Type Tag.
      *   Sharing $\rightarrow$ Equivalence relation (`==`) between local type tags.

  ---

  ### Part II: Re-running the Load-Bearing Puzzles

  Here we test the translation against the classic philosophical problems.

  #### 1. The One-Over-Many Argument
  *   **Metaphysics:** How can $a$ and $b$ both be $F$? Realists say because there is one $F$ they both participate in. Nominalists say they just resemble.
  *   **DB Translation:** How can Row 1 and Row 2 both have the property `status: active`?
  *   **Realist (Catalog):** Both rows reference the same Column Definition OID in the system catalog. The storage cost is low (one definition, many pointers).
  *   **Nominalist (Structural):** Both rows have a column named `status` with value `active`. There is no shared pointer. The storage cost is higher (the definition is implicit in every row's structure).
  *   **The Working:** The translation holds perfectly. The "One" is a pointer to a shared definition. The "Many" are the rows. The debate reduces to **normalization**. Realism is 3rd Normal Form for types (store type definition once). Nominalism is denormalized types (store structure with every instance).
  *   **The Fudge:** In DBs, the pointer is physical (memory address). In metaphysics, "participation" is mysterious. The DB solves the "how" by pointing; metaphysics struggles to explain the "tie."

  #### 2. The Third Man Regress
  *   **Metaphysics:** If $a$ and $b$ share Universal $F$, then $a, b, F$ share a higher Universal $F'$. This leads to infinite regress.
  *   **DB Translation:** If Rows conform to Schema $S$, and Schema $S$ is itself a row in the `Sys.Types` table, does `Sys.Types` need a Super-Schema $S'$?
  *   **The Working:** In your framework, the regress **stops**. It stops at the **Metamodel**. The `Sys.Types` table has a schema defined by the SQL Standard (or the DB engine kernel). That schema is not a row in a table; it is hard-coded in the engine's binary.
  *   **The Verdict:** The regress is an artifact of trying to make everything a "row." A working system requires a **primitive kernel** that is not itself an instance.
  *   **The Fudge:** Metaphysics generally refuses to admit a "hard-coded kernel" (God? Brute Facts?). Your framework solves the regress by fiat (the Engineer designed the kernel). If you demand the kernel itself be an instance, your DB crashes (or requires a meta-meta-database). The translation works only if you accept that *some* types must be primitive and not instances.

  #### 3. Uninstantiated Universals
  *   **Metaphysics:** Can "Unicorn" exist if no Unicorns do?
  *   **DB Translation:** Can I `CREATE TABLE Unicorn` without ever running `INSERT`?
  *   **The Working:** Yes. The schema exists in the catalog. The type is valid. Constraints are defined.
  *   **Nuance:** What about constraints that no row can satisfy? `CREATE TABLE Impossible (CHECK (1=0))`. This type exists. It has an OID. It has columns. It simply accepts no instances.
  *   **The Verdict:** Your framework treats "existence of a type" as "registration in the catalog," not "population by rows." This maps cleanly to Realism. A Nominalist DB would say the type `Unicorn` does not exist until a row matches the query pattern.
  *   **The Fudge:** In a DB, a designer created the empty table. In metaphysics, if no mind created the Universal, where is it? The DB assumes an Architect.

  #### 4. Reference to Properties
  *   **Metaphysics:** What are we doing when we say "Redness is a color"? We are referring to the Universal, not instances.
  *   **DB Translation:** Reflection / Introspection.
  *   **The Working:** You are querying the catalog, not the data tables. `SELECT data_type FROM INFORMATION_SCHEMA.COLUMNS WHERE column_name = 'color'`. You are treating the schema as data.
  *   **The Verdict:** This works perfectly. "Talking about Universals" is "Querying the Metamodel."
  *   **The Fudge:** In DBs, the catalog is still just data stored on the same disk as the rows. In metaphysics, the Realm of Forms is supposed to be distinct from the Physical Realm. Your framework collapses this distinction (Schema and Data are both bits on a disk).

  ---

  ### Part III: The Residue Report

  You asked what *cannot* be expressed. There are three specific residues where the translation breaks down. These are not technical limitations; they are ontological mismatches.

  #### 1. Mind-Independence (The Architect Problem)
  *   **The Issue:** In your framework, a Schema exists because a Designer executed `CREATE TYPE`. It is an artifact. In Realist metaphysics, Universals exist *independently* of any mind conceiving them.
  *   **The Gap:** Your framework cannot model "Undiscovered Types." You can model "Uninstantiated Types" (empty tables), but not "Unconceived Types." In your system, if no one defines the schema, it doesn't exist. In Realism, the Universal `PrimeNumber` existed before humans defined it.
  *   **Specific Candidate:** The question whether properties exist independently of any schema. Your framework answers "No" by definition. A column without a table definition is just binary noise.

  #### 2. Satisfaction vs. Possession (Validation vs. Being)
  *   **The Issue:** In your framework, a row *satisfies* a constraint. This is an external check. `CHECK (age > 0)`. If the check fails, the row is rejected or marked invalid. In metaphysics, a particular *has* a property. It is not "validated" against the Universal; it participates in it.
  *   **The Gap:** The DB distinction between **Data** and **Metadata** (Schema). In metaphysics, the Universal is supposed to be *in* the particular (Aristotle) or the particular is *in* the Universal (Plato). In your DB, the Schema is strictly separate from the Row. You can have a Row that violates the Schema (if you disable constraints), but it is still a Row. In metaphysics, a "Triangle" that fails the definition of triangularity is not a Triangle at all.
  *   **Specific Candidate:** The difference between a thing's satisfying a constraint and a thing's having a property. Your framework models the former (validation); it struggles with the latter (essentialism).

  #### 3. The Instantiation Tie (Pointer vs. Ontology)
  *   **The Issue:** In your framework, the link between Row and Type is a pointer (OID) or a structural match. It is a mechanism. In metaphysics, "Instantiation" is a primitive, unanalyzable relation.
  *   **The Gap:** Why does *this* row point to *that* type? In DBs, because the INSERT statement said so. In metaphysics, there is no "INSERT statement." The tie is brute.
  *   **Specific Candidate:** The sense in which an instance is *one of* a universal rather than merely conforming to a declaration. Your framework only models conformance. It cannot model "oneness."

  ---

  ### Part IV: The Verdict

  You asked for a definite answer. Here it is:

  **The residue is evidence that the philosophers' dispute is less substantive than its vocabulary suggests.**

  The "defect" in your framework is not a lack of expressive power; it is a lack of **mystification**. Your framework falls silent on the residue because the residue consists of questions that arise only when one forgets that schemas are tools for compression and prediction, not entities in the world.

  **Defense of the Verdict:**

  1.  **The Regress Proof:** The fact that your framework solves the Third Man Regress by positing a "hard-coded kernel" (the DB Engine) while metaphysics spins in circles suggests the metaphysical problem is a category error. It arises from demanding that *everything* be an instance. Your framework shows that a functioning system *requires* primitives that are not instances. The metaphysicians who deny this are designing a system that cannot run.
  2.  **The Architect Illusion:** The "Mind-Independence" residue is the only strong candidate for a real defect. However, notice that Realists cannot explain *where* these mind-independent universals are stored, any better than you can explain where the "Platonic Disk" is. Your framework forces the admission that "Existence of a Type" = "Registration in a System." The Realist claim is essentially that the Universe has a Catalog Table that no one created. This is a poetic way of saying "The universe has regularities." Your framework captures the regularities (constraints) without needing the ghost (the independent Universal).
  3.  **Functional Equivalence:** As shown in Part I, Realism, Nominalism, and Trope Theory map to **Nominal Typing**, **Structural Typing**, and **Dependent Typing**. These are engineering trade-offs. Nominal typing is faster to check (pointer comparison); Structural typing is more flexible (no registry needed). Trope theory is high overhead (metadata per cell).
      *   If the metaphysical debate were about the *nature of reality*, one position should be "True."
      *   Since all three positions map to viable, distinct architectural patterns used in different contexts (SQL vs. NoSQL vs. Research Languages), the debate is not about Truth, but about **Utility**.

  **The Cost:**
  Accepting this verdict costs you the comfort of "Ontological Security." You must accept that:
  1.  **Essentialism is a Constraint, not a Fact:** A thing "is" a Triangle only insofar as it satisfies the constraints of the `Triangle` schema we have chosen to enforce. There is no "Triangle-ness" beyond the constraint logic.
  2.  **The Universe is a Database without a Designer:** If you apply your framework to the world, you must treat the Laws of Physics as the "Hard-Coded Kernel." They are the primitives that stop the regress. They are not "Universal Entities"; they are the rules of the engine.
  3.  **Meaning is Use:** To ask "Do Universals exist?" is to ask "Is it more efficient to store type definitions centrally or structurally?" The answer depends on the query load (the context of investigation), not on the world itself.

  **Conclusion:**
  Your suspicion survives contact with the details. The debate over universals is a dispute over **data normalization strategies** for the description of reality. The "Residue" (mind-independence, essential ties) is the philosophical equivalent of asking "Where is the `CREATE TABLE` statement for the Universe?" It is a question that assumes an Architect where there may only be an Engine. Your framework does not fail to capture the residue; it correctly identifies the residue as a request for metadata that does not exist.
