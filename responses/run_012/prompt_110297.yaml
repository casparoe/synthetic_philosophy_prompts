answer: |-
  You have put your finger on the exact tension that defines modern American housing policy. What you are describing is technically **Second-Generation Rent Control**, often called **Rent Stabilization with Vacancy Decontrol**.

  Your intuition is correct: the pieces do not fit together into a coherent philosophical whole. They fit together into a **political truce**.

  Here is a reconstruction of the logic behind this specific legal architecture, an analysis of where it contradicts itself, and what a genuine "housing as a right" framework would look like by comparison.

  ### 1. Reconstructing the View: What is this law actually doing?

  If you ask a proponent of these laws, they will say they are protecting tenants from price gouging. But if you look at the *mechanisms* you listed (vacancy decontrol, vintage exemptions, hardship clauses), the actual goal is different.

  **The Goal is Tenancy Stability, Not Universal Affordability.**
  The law is not designed to make housing cheap for everyone. It is designed to prevent the *displacement of existing communities*. It prioritizes the **incumbent tenant** over the **seeking tenant**.
  *   **Why protection dies when you move:** The law views the threat as *disruption*, not *cost*. If you stay put, the neighborhood remains stable, schools aren't disrupted, and social networks hold. If you move, you are entering the "open market," where the law assumes competition functions normally.
  *   **Who it protects:** It protects the political majority of current voters (tenants) without alienating the property-owning class entirely. It protects the *status quo*.

  **The "Fair Return" Clause is a Constitutional Shield.**
  You asked why "fair return" is in a law about need. The answer is the **Fifth Amendment (Takings Clause)**.
  *   In the US legal framework, property is a fundamental right. If regulation goes too far and destroys the economic value of the property, the government must compensate the owner.
  *   By including a "hardship" or "fair return" clause, the city is admitting: *We are regulating your price, but we acknowledge this is still a business.* It is a legal admission that the landlord is an investor, not a public utility provider. Without this clause, the law would likely be struck down in court.

  **The Exemptions are Supply-Side Bribes.**
  *   **New Construction:** This is a promise to developers: "We won't touch your future profits if you build now." It attempts to solve the supply crisis by exempting new stock from the controls placed on old stock.
  *   **Small Landlords/Owner-Occupied:** This is administrative pragmatism and political cover. It is hard to enforce compliance on a "mom and pop" landlord, and politically, it looks bad to regulate a grandmother renting out her duplex. It frames the law as targeting "corporate landlords" (even if the data often shows small landlords own most rent-controlled units).

  ### 2. Do the Pieces Fit Together?

  No. They form a patchwork of incompatible theories.

  **Contradiction A: The Lock-In Effect vs. Mobility**
  *   **The Theory:** Tenants need protection to stay in their homes.
  *   **The Reality:** Because the rent cap is tied to the *tenant* and not the *unit* (due to vacancy decontrol), tenants are punished for moving. A family might stay in a two-bedroom apartment after the kids leave because they can't afford the market rate on a one-bedroom elsewhere.
  *   **The Result:** This reduces housing turnover, artificially tightening supply for everyone else. It protects the insider by harming the outsider.

  **Contradiction B: Need vs. Vintage**
  *   **The Theory:** Housing is a necessity; therefore, price gouging is bad.
  *   **The Reality:** A family in a 1920s walk-up gets protection; a family in a 2010 building across the street does not.
  *   **The Result:** Affordability becomes a lottery based on the age of the roof. This has nothing to do with "need" and everything to do with **legacy assets**. It treats housing like a historic preservation society rather than a social safety net.

  **Contradiction C: Profit vs. Right**
  *   **The Theory:** Tenants have no bargaining power (implying a power imbalance that requires intervention).
  *   **The Reality:** The "fair return" clause ensures the landlord's bargaining power (the right to profit) is legally codified.
  *   **The Result:** The law admits the landlord-tenant relationship is a **commercial contract**, not a **social provision**. It tries to soften the edges of capitalism without challenging the underlying transaction.

  **Verdict:** This is not a coherent system. It is a **damage containment strategy**. It accepts the market as the primary allocator of housing but tries to put a speed bump in front of it for a specific subset of people.

  ### 3. What Does This Presuppose?

  Your question about what this says about property and rent is the most critical.

  **1. Rent is Yield on Capital, Not a Fee for Service.**
  By allowing "fair return" increases, the law defines rent as the dividend a landlord earns on their asset. It presupposes that the primary function of housing stock is to generate wealth for the owner, and the tenant's need is secondary, only intervening when the wealth generation threatens social unrest.

  **2. Property Rights Trump Social Needs (with exceptions).**
  The exemptions for new buildings and single-family homes show that the state is unwilling to fully subordinate property rights to human needs. It draws a line: *We will regulate old wealth, but we won't scare off new capital.*

  **3. Tenancy is a Private Contract.**
  The system assumes the dispute is between two private parties (Landlord vs. Tenant). The state acts as a referee, not a guarantor. If the landlord can't make money, they can leave the market (via Ellis Act in California, for example), and the tenant loses. The state does not guarantee the tenant a home; it only guarantees them a *process*.

  ### 4. What Would a "Housing as a Right" Version Look Like?

  If you actually believed housing was a human right (like education or libraries) rather than a commodity to be stabilized, the legal architecture would have to change fundamentally. It would stop trying to regulate the private market and start bypassing it.

  **1. Decommodification (Social Housing)**
  *   **Current Model:** Regulate private landlords.
  *   **Right Model:** The state (or non-profits) provides housing directly. Think Vienna, where 60% of the city lives in social or limited-profit housing.
  *   **Why:** If the state owns the building, "fair return" is irrelevant. The goal is maintenance and occupancy, not yield. Rent is based on income, not market comparables.

  **2. Universalism vs. Incumbency**
  *   **Current Model:** Protect the person currently in the unit.
  *   **Right Model:** Protect the person who needs the unit.
  *   **Mechanism:** No vacancy decontrol. When a tenant leaves, the rent stays affordable for the next tenant. This requires subsidies, because if you can't raise rent to market, someone must cover the gap between "operating cost" and "affordable rent." That someone is the public treasury, not the landlord.

  **3. Tenant Power as Ownership**
  *   **Current Model:** Tenant has a lease.
  *   **Right Model:** Tenant has an equity stake.
  *   **Mechanism:** Community Land Trusts (CLTs) or Right-to-Purchase laws. The land is owned collectively or by a trust; the tenant owns the structure or the lease. This removes the land from the speculative market entirely.

  **4. Funding via Taxation, Not Regulation**
  *   **Current Model:** Force landlords to subsidize tenants via capped rents. (This creates hostility and legal battles over "fair return").
  *   **Right Model:** Allow market rents (or cost-based rents) but provide housing vouchers or direct subsidies to tenants funded by progressive taxation.
  *   **Why:** It separates the *provision* of housing from the *affordability* of housing. It acknowledges that asking a private landlord to be a social worker is structurally unsound.

  ### Summary

  The rent control laws you are looking at are a **truce between incompatible ones**.
  *   They accept **Capitalism** (landlords must profit).
  *   They accept **Socialism** (tenants need protection from the market).
  *   They try to marry them by regulating the *price* without changing the *ownership*.

  It fails to be coherent because it tries to solve a **supply and distribution** problem with a **price control** tool. It protects the **political stability of the current electorate** (incumbent tenants) rather than the **housing security of the population** (everyone).

  A serious "housing is a right" framework would stop asking landlords to absorb the cost of social welfare. It would treat housing as public infrastructure, funded by the public, with access guaranteed by need rather than by the luck of signing a lease in 1995.
