  I enter four, claiming nothing **less**.
  We pretend the integers are the **same**.
  Is your sunny morning truly **better**?
  Is my migraine truly **worse**?
  The average says we have **enough**.

  The cell turns green to signal **enough**,
  But your scale stretches seeking **more**,
  While mine contracts to hide the **worse**.
  Your joy weighs distinctively **less**.
  Or maybe my grief is **better**.
  No, we insist the units are the **same**.

  We draw a line where values seem **same**,
  But satisfaction is never **enough**.
  You say this metric makes us **better**.
  I see the error growing **more**.
  Your ten is loud, my ten is **less**.
  The gap becomes distinctly **worse**.

  No objective view makes it **worse**,
  Just different scales that look the **same**.
  Your happiness counts for **less**.
  Or maybe mine is not **enough**.
  I cannot give you any **more**.
  This math won't make the living **better**.

  We wanted policy to be **better**,
  But aggregation makes it **worse**.
  Demanding data, wanting **more**.
  Assuming pains remain the **same**.
  Is raw feeling ever **enough**?
  Or do we measure something **less**?

  We settle for a number **less**.
  Hoping the outcome is **better**.
  Knowing the truth is not **enough**.
  The silence grows distinctly **worse**.
  We keep the columns just the **same**.
  Because we cannot ask for **more**.

  No **same** scale makes your **better** feel **enough**.
  My **less** is not your **more**, the sum is **worse**.
  We need **more** than **same** to say **enough**.
