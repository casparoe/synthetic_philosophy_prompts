prompt: |-
  I'm a second-year PhD student in philosophy, working mostly on social ontology with a side of game theory, and I keep getting dragged into the same argument alot in our department's reading group. Someone will say something like "promise-keeping is just a convention" or "property is just a convention" and then talk as if that settles the matter — as if calling something a convention shows it's arbitrary, optional, or not really binding. Last week a visitor said that since Lewis showed conventions are solutions to coordination problems, and since promises coordinate expectations, promises are "just conventions" and so don't generate any genuine obligation. My gut says this is a pile-up of different claims, but I couldn't untangle it live. Can you lay out the distinct precise things "it's just a convention" could be saying, especially inside a broadly Lewisian picture where conventions involve mutual expectation, common knowledge, and precedence, and for each reading say whether it's a trivial truth, a substantive and defensible claim, or actually false? I want a menu I can bring to office hours, not one verdict with a lecture attached.

  In particular I want to know which readings would actually support the move my visitor made — the move from "this is a convention" to "this isn't binding" or "you can't criticize it" — and which readings are just equivocating between convention in Lewis's technical sense and convention in the ordinary sense of a mere custom. And I'm confused about the evolution-of-norms bit: if a coordination convention gets stabilized by sanctions, or by people treating deviations as grounds for resentment, has it turned into a norm in some different sense, and does that change whether "just a convention" is true? I dont need citations or a reading list, I'll track those down myself; I just need the conceptual map. If it helps, give me one or two concrete examples — like which side of the sidewalk to walk on versus promising versus money — to show how the readings come apart.
