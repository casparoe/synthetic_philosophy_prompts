answer: |-
  This is a classic category error that thrives in social ontology. The visitor is conflating the **game-theoretic structure** of a convention (how it arises/is sustained) with the **normative status** of a convention (what it requires of agents). In a Lewisian framework, "convention" is a technical term describing an equilibrium solution to a coordination problem. In ordinary parlance, "just a convention" implies arbitrariness, optionality, and lack of moral weight.

  Here is a conceptual menu of five distinct claims hidden behind the phrase "X is just a convention." You can use this to isolate exactly where the disagreement lies.

  ### The Menu: Five Readings of "It's Just a Convention"

  #### 1. The Equilibrium Arbitrariness Claim
  *   **Content:** There exists at least one alternative regularity $R'$ that could have solved the coordination problem just as well as the current regularity $R$, and the only reason we follow $R$ is precedence/common knowledge.
  *   **Lewisian Status:** **True (by definition).** This is the core of Lewis's account. For driving, we could have driven on the left or the right.
  *   **Normative Implication:** **None.** This speaks to *selection*, not *compliance*. Once $R$ is established, deviating is irrational (or harmful) because it loses the coordination benefit.
  *   **Verdict:** Trivial truth within the model, but supports no normative conclusions.

  #### 2. The Genealogical Deflation Claim
  *   **Content:** The practice originated solely from iterative coordination and expectation-matching, not from moral reasoning, divine command, or natural law.
  *   **Lewisian Status:** **Substantive/Debatable.** It is an empirical/historical claim about the origin of the institution.
  *   **Normative Implication:** **Weak.** Even if true, this risks the genetic fallacy. The *source* of a rule does not necessarily dictate its current *binding force*. (e.g., Traffic laws might have arbitrary origins but generate genuine legal obligations).
  *   **Verdict:** Defensible claim about history, but invalidates no current obligations.

  #### 3. The Normative Dependence Claim
  *   **Content:** The obligation to $\phi$ exists *only because* the convention exists. There is no prior, convention-independent moral reason to $\phi$.
  *   **Lewisian Status:** **Substantive.** Lewis argues conventions create "oughts" conditional on the desire to coordinate.
  *   **Normative Implication:** **Significant but not deflationary.** It means the obligation is *conditional* (if you want to participate in the practice), not that it is *non-existent*. If you make a promise, you are obligated *because* the practice of promising exists and you invoked it.
  *   **Verdict:** Defensible. This denies *categorical* obligation but affirms *institutional* obligation.

  #### 4. The Optionality (Exit) Claim
  *   **Content:** An agent can choose to stop following the regularity without incurring significant costs, sanctions, or moral criticism.
  *   **Lewisian Status:** **False (for most social institutions).** Lewisian conventions rely on preferences being conditional on others' actions. If everyone else drives on the right, your cost for driving on the left is a crash, not just "breaking a custom."
  *   **Normative Implication:** **Strong.** If this were true, the practice wouldn't be binding.
  *   **Verdict:** **False.** This is where the visitor is equivocating. They are taking the *arbitrariness of origin* (Claim 1) and smuggling in *optionality of compliance* (Claim 4).

  #### 5. The Reductionist Ontology Claim
  *   **Content:** There is nothing to the institution "over and above" the behavioral regularities and mutual expectations. There are no sui generis normative facts or social objects.
  *   **Lewisian Status:** **Metaphysically Heavy.** Lewis is a reductionist, but one can accept Lewisian game theory without accepting full ontological reductionism.
  *   **Normative Implication:** **Depends on Metaethics.** If you are a moral realist, you might think reductionism kills obligation. If you are a constructivist, you might think this is exactly *how* obligations are built.
  *   **Verdict:** A metaphysical claim, not a normative one.

  ---

  ### Diagnosing the Visitor's Inference

  The visitor's argument follows this invalid schema:
  1.  Promises are conventions (in the Lewisian sense: Claim 1).
  2.  Conventions are arbitrary/optional (in the ordinary sense: Claim 4).
  3.  Therefore, promises are not binding.

  **The Error:** They are equivocating between **Claim 1** (Arbitrariness of Equilibrium) and **Claim 4** (Optionality of Exit).
  *   **Lewisian Arbitrariness:** "We could have all agreed to use the word 'dog' to mean *cat*." (True)
  *   **Ordinary Optionality:** "Now that we agree 'dog' means *dog*, I can use it to mean *cat* whenever I want without misleading you." (False)

  Once the equilibrium is selected, the "arbitrariness" vanishes from the perspective of the agent *in* the game. The obligation becomes binding *conditional on participation*. If the visitor argues you can opt out of promising entirely, they must show you can opt out of the *social consequences* of breaking promises (loss of trust, resentment), which is empirically false.

  ### The Sanctions and Norms Threshold

  You asked about the evolution from coordination to norms via sanctions/resentment. This is the crucial pivot point in social ontology.

  **1. Lewis's Original View:**
  Lewis was hesitant to build sanctions into the *definition* of convention. For him, the preference structure of the coordination problem does the work. You follow the convention because you *want* the coordination payoff, not because you fear punishment.

  **2. The Normative Turn (Bicchieri/Gilbert/Searle):**
  When a regularity becomes backed by sanctions (or reactive attitudes like resentment), it shifts from a **Coordination Convention** to a **Social Norm**.
  *   **Coordination:** I follow $R$ because I expect you to follow $R$, and I want to match you.
  *   **Norm:** I follow $R$ because I expect you to follow $R$, *and* I expect you to *demand* that I follow $R$, and I care about your demand.

  **Does this make "Just a Convention" false?**
  It makes the **Optionality Claim (4)** even *more* false.
  If a convention stabilizes via sanctions/resentment, the cost of deviation increases. The practice becomes *more* binding, not less.
  *   **Sidewalk:** If I walk on the wrong side, we bump. I apologize. (Pure Coordination).
  *   **Property:** If I take your wallet, you resent me. You might call the police. (Norm/Institution).

  If the visitor says, "It's just a convention," they imply the normative force is weak. But if the convention has evolved into a norm backed by resentment, the "just" is doing no work. The fact that it *started* as a coordination solution does not prevent it from acquiring robust normative teeth. The "convention" label describes the *mechanism of stability*, not the *ceiling of obligation*.

  ### Concrete Examples for the Map

  Use these to test which claim your interlocutor is making.

  **1. Driving Side (Pure Coordination)**
  *   *Convention?* Yes (Lewisian).
  *   *Arbitrary Origin?* Yes (Claim 1).
  *   *Binding?* Yes, conditionally. If you drive on the left in a right-hand traffic country, you are irrational and dangerous.
  *   *Visitor's Test:* If the visitor says driving on the right is "just a convention" and therefore "not binding," they are clearly wrong. You will get a ticket or crash. This exposes the falsity of Claim 4.

  **2. Money (Status Function/Institution)**
  *   *Convention?* Yes, in the sense that we all accept this paper has value.
  *   *Arbitrary Origin?* Yes (we could have used shells).
  *   *Binding?* If I offer you cash for a debt, you are obligated to accept it (legal tender).
  *   *Nuance:* Money relies on a network of expectations *and* state sanctions. Calling it "just a convention" ignores the coercive apparatus backing the convention. It conflates the *ontology* of money (socially constructed) with the *normativity* of debt (legally binding).

  **3. Promising (The Hybrid Case)**
  *   *Convention?* Contested.
      *   *Lewisian view:* It's a convention to use certain words to create expectations.
      *   *Scanlonian view:* There is a moral principle (Fidelity) that exists *prior* to the convention.
  *   *The Visitor's Trap:* They assume the Lewisian view entails the "no moral force" conclusion.
  *   *Counter:* Even if promising is a convention (Claim 1), it generates obligations via **Claim 3 (Normative Dependence)**. By invoking the convention, you manipulate another's expectations. Violating that is a harm (manipulation/disappointment), regardless of whether the *rule* itself was arbitrary in origin.
  *   *Sanctions:* If you break a promise, resentment is appropriate. This moves it from Claim 1 toward the Norm threshold. The "just a convention" label fails to capture the moral cost of the violation.

  ### Summary for Office Hours

  When the claim "It's just a convention" arises, ask:

  1.  **Which sense of 'arbitrary'?** Do you mean *there were alternative equilibria* (True, irrelevant to obligation) or *I can opt out without cost* (False)?
  2.  **What is the source of the 'just'?** Are you denying the *existence* of the obligation, or the *categorical nature* of the obligation? (Lewis denies categorical, affirms conditional).
  3.  **Have sanctions attached?** If people resent deviations, it is no longer a mere coordination habit; it is a normative expectation. Does your argument survive that transition?

  The visitor is trying to get **ontological humility** (these are human-made structures) to do the work of **normative nihilism** (these structures don't bind us). In a Lewisian framework, those two things are compatible: we can build binding cages out of arbitrary bricks.
