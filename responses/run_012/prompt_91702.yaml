answer: |-
  ### Criteria for the Agenda

  To rank these questions for a three-year solo project, I am applying three explicit criteria:

  1.  **Foundational Leverage:** Does resolving this question determine the validity of the downstream normative conclusions (i.e., whether we get utilitarianism, prioritarianism, or nothing)?
  2.  **Formal Tractability:** Given your skills in decision theory and the constraint against empirical work, can this be advanced through conceptual analysis and formal modeling alone?
  3.  **Dialectical Live-ness:** Is the community currently stalled on this point, such that a clear resolution would shift the debate, rather than rehearsing settled or intractable disputes?

  **Trade-offs:** There is a tension between *Foundational Leverage* and *Formal Tractability*. The deepest philosophical problems (e.g., the nature of interpersonal comparison) are often the hardest to formalize. Conversely, highly technical extensions (e.g., non-EU preferences) are tractable but may lack normative bite. This agenda prioritizes **Leverage** where **Tractability** allows, accepting that some conceptual work must precede formalization.

  **Upstream/Downstream Map:**
  *   **Upstream:** The status of interpersonal comparisons and weights (Item 2) and the validity of the Pareto axiom over lotteries (Item 1). If these fail, the theorem does not yield utilitarianism.
  *   **Midstream:** The robustness of the result to preference structures (Item 5) and the coherence of the Impartial Observer (Item 4).
  *   **Downstream:** The convergence of the two routes (Item 3), variable population issues (Item 6), and the specific contrast with Rawls (Item 7). These depend on the upstream premises holding.

  ---

  ### The Ranked Agenda

  #### 1. The Weighting Gap: From Additivity to Utilitarianism (Item 2)
  **The Question:** The Aggregation Theorem yields a social welfare function $W = \sum a_i u_i$. It does not yield $a_i = 1$. How, if at all, can the move from "additive representation" to "classical utilitarianism" be justified within the formalism without smuggling in substantive moral premises?
  **Ranking Justification:** This is the highest leverage point. Most philosophical criticism assumes Harsanyi proved utilitarianism; most technical defenses admit he proved only additivity. If you cannot bridge this gap, the theorem supports a wide range of prioritarian or weighted views, not utilitarianism. This is upstream of everything else.
  **Tractability:** High. This requires analyzing the "Anonymity" or "Symmetry" axioms required to fix weights and determining if they are compatible with the vNM setup or require external justification.
  **Move Up/Down:**
  *   *Move Up:* If you find a formal derivation of equal weights from the structure of the veil of ignorance route that does not rely on equiprobability assumptions widely regarded as arbitrary.
  *   *Move Down:* If you conclude the gap is unbridgeable without substantive moral premises (making it a philosophical rather than decision-theoretic problem).

  #### 2. Ex-Ante Pareto vs. Ex-Post Equity (Item 1)
  **The Question:** Can the Pareto condition over lotteries be weakened to accommodate ex-post fairness concerns (e.g., avoiding outcomes where identifiable individuals suffer badly) without collapsing the additive representation?
  **Ranking Justification:** This is the strongest technical objection to the theorem. Diamond's critique is old, but modern social choice theory offers new ways to relax Pareto. If the Pareto axiom must be dropped to satisfy basic equity intuitions, the Aggregation Theorem fails as a normative guide.
  **Tractability:** High. This is pure social choice modeling. You can construct social welfare functionals that satisfy weakened Pareto conditions and test if they retain linearity.
  **Move Up/Down:**
  *   *Move Up:* If you successfully characterize a "minimal" relaxation of Pareto that preserves enough structure to guide policy while avoiding ex-post unfairness.
  *   *Move Down:* If it becomes clear that any relaxation destroys the linear form entirely, leaving only a negative result (i.e., "Harsanyi is incompatible with equity").

  #### 3. Robustness to Non-Expected Utility (Item 5)
  **The Question:** Does the aggregation result hold if individuals (or the social planner) exhibit ambiguity aversion or rank-dependent preferences?
  **Ranking Justification:** vNM expected utility is empirically and theoretically contested. If the theorem collapses under ambiguity aversion, its scope is limited to idealized agents. This tests the structural stability of the result.
  **Tractability:** High (given your background). This involves extending the linearity proofs to non-linear probability weighting.
  **Move Up/Down:**
  *   *Move Up:* If you derive a generalized aggregation theorem for ambiguity-averse agents that preserves a clear normative interpretation.
  *   *Move Down:* If the result is simply that "aggregation is impossible under non-EU," which is a known negative result in some literature.

  #### 4. The Coherence of Extended Preferences (Item 4)
  **The Question:** Can the "impartial observer" form well-defined preferences over "being person $i$ in state $x$" without presupposing the very interpersonal comparisons the theorem is meant to derive?
  **Ranking Justification:** This attacks the second route to the theorem. If extended preferences are metaphysically or psychologically incoherent, the veil of ignorance route fails. However, this is more conceptual than formal.
  **Tractability:** Medium. It requires careful conceptual analysis to avoid circularity.
  **Move Up/Down:**
  *   *Move Up:* If you can formalize "extended preferences" in a way that avoids the charge of circularity.
  *   *Move Down:* If the debate remains stuck in unverifiable claims about psychological possibility.

  #### 5. Variable Populations and Rawlsian Contrasts (Items 6 & 7)
  **The Question:** Does the theorem extend to variable populations, and is the disagreement with Rawls substantive or axiomatic?
  **Ranking Justification:** Low. Variable population ethics usually requires a different formal apparatus (critical levels, etc.) that sits *outside* the standard Harsanyi fixed-$N$ framework. The Rawlsian contrast is typically a stalemate of conflicting axioms (Pareto vs. Maximin) rather than a solvable puzzle within the theorem.
  **Tractability:** Low for Variable Population (changes the problem); Low for Rawls (philosophical stalemate).
  **Move Up/Down:**
  *   *Move Up:* Only if you find a way to derive variable population rules directly from the fixed-population aggregation logic.
  *   *Move Down:* (Current status) These are distinct debates that use Harsanyi as a backdrop rather than engaging the theorem's internal mechanics.

  ---

  ### Upstream/Downstream Dependencies

  *   **Item 1 (Pareto) and Item 2 (Weights) are Upstream:** If you cannot justify equal weights (Item 2), the debate about Variable Populations (Item 6) is moot because you haven't established the base utilitarian view. If you must reject Pareto over lotteries (Item 1), the Aggregation Theorem's central mechanism is broken, making the Non-EU extension (Item 5) less relevant.
  *   **Item 3 (Convergence) is Downstream:** Whether the two routes converge depends entirely on whether the Weighting Gap (Item 2) can be closed in both. If Route 1 yields arbitrary weights and Route 2 yields equal weights, they do not converge. You cannot solve Item 3 without solving Item 2 first.
  *   **Item 7 (Rawls) is Downstream:** The contrast with Rawls depends on whether you retain the Pareto axiom. If you weaken Pareto (Item 1) to accommodate equity, you may move closer to Rawls without adopting Maximin. Thus, Item 1 resolves Item 7.

  ---

  ### Dynamic Ranking: What to Watch

  Over the next three years, monitor the following to adjust your focus:

  *   **For Item 1 (Pareto):** If new literature emerges showing that *any* ex-post equity concern is incompatible with *any* form of welfarism, move this to the top priority as a "negative result" project (proving the incompatibility rigorously).
  *   **For Item 2 (Weights):** If a consensus forms that "Anonymity" is an acceptable moral axiom independent of the theorem, move this down; the work is done. If the debate intensifies regarding the source of the weights, keep it at #1.
  *   **For Item 5 (Non-EU):** If decision theory shifts decisively away from vNM (e.g., towards imprecise probabilities), move this up. If vNM remains the normative standard for rationality, keep it at #3.

  ---

  ### Immediate Action Plan: Start On These Three

  1.  **Formalize the Weighting Gap:** Do not assume the theorem implies utilitarianism. Spend the first six months writing a technical paper that isolates the exact axiom required to move from $W = \sum a_i u_i$ to $W = \sum u_i$. Determine if this axiom can be derived from the "rational society" route or if it is exclusive to the "veil of ignorance" route. This clarifies the entire landscape.
  2.  **Model a Weakened Pareto Axiom:** Construct a formal model where the Pareto condition applies only to risk-free prospects or is weighted by ex-post variance. Test whether the Aggregation Theorem's linearity survives. This addresses the most potent objection (Item 1) with your decision theory skills.
  3.  **Map the Non-EU Boundary:** Conduct a literature review specifically on aggregation under ambiguity. Identify the precise point where the linearity proof breaks. Do not try to solve it yet; define the boundary condition. This sets up your third year for a potential generalization theorem.

  **Why these three?** They utilize your specific technical strengths (decision theory) to address the most foundational philosophical weaknesses (weights and fairness) without drifting into empirical or purely expository work. They ensure that by year three, you have either repaired the theorem or precisely delineated its limits.
