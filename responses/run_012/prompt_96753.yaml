answer: |-
  Your hunch is close, but the coin example you raised suggests the disagreement is deeper than a verbal mix-up or a simple dispute about whether probabilities can be intervals. If this were just about having a set of numbers instead of a single number, then once you forced the numbers to match, the preferences should align. The fact that people still prefer the coin flip even when the implied odds are identical shows that the dispute is not merely about precision versus imprecision. It is a clash of bedrock intuitions about what probability is for. One side sees probability as a tool for ensuring internal consistency across choices, while the other sees it as a summary of the quality of your information. The heat in your group comes from the fact that both sides are defending a legitimate norm, but they are prioritizing different virtues of reasoning.

  The expected-utility side is committed to the view that rationality is primarily about avoiding self-defeat. Their bedrock intuition is that if your preferences violate the axioms of expected utility, you are vulnerable to a Dutch Book, meaning someone could construct a series of bets that guarantees you lose money regardless of the outcome. For them, the source of the probability does not matter, only the final betting disposition. If you are willing to bet on red at certain odds, you have effectively declared a price for that bet. If you declare a different price for a bet with the same effective odds but a different source, you are inconsistent. They commit to the idea that a rational agent should be able to treat all uncertainties as if they were coin flips once the probabilities are assessed. To them, ambiguity aversion looks like a framing error, similar to preferring a bottle of water labeled 90 percent full over one labeled 10 percent empty.

  The ambiguity aversion side is committed to the view that rationality is about sensitivity to the state of your knowledge. Their bedrock intuition is that there is an epistemic difference between known risk and unknown uncertainty that should influence action. They argue that a probability number is not just a betting price but a representation of evidence, and two identical numbers derived from different evidence states are not equivalent. When they prefer the coin flip over the urn, even at matching odds, they are expressing a preference for robustness. They commit to the idea that it is rational to pay a premium to avoid situations where your model of the world is fragile or untested. For them, the expected-utility framework is not a definition of rationality but a specific model that fails to capture the value of information quality. They are willing to accept some formal inconsistency in static choices if it means maintaining a policy that protects them from model error in the real world.

  This means the disagreement is not purely verbal, because both sides can agree on the definition of words like rational or probability and still disagree on the norms. It is also not a hidden empirical question, because both sides agree that people do feel ambiguity aversion. The dispute is normative: should you train yourself out of this feeling because it violates consistency, or should you trust it because it tracks information quality? The coin wrinkle you identified is the strongest evidence that this is a substantive clash rather than a confusion. It shows that the ambiguity camp is not just asking for a range of probabilities but for a decision rule that treats the source of uncertainty as a relevant variable. The expected-utility camp cannot accommodate this without breaking their core commitment to source neutrality.

  Progress in your group will not come from defining terms more carefully or finding a new empirical study. It will come from forcing each side to acknowledge the cost of their preferred virtue. The expected-utility side needs to confront whether their demand for consistency forces agents to ignore relevant meta-information about the reliability of their estimates. The ambiguity side needs to confront whether their sensitivity to information quality leaves them vulnerable to dynamic inconsistency, where they might make a plan today that their future selves will rationally abandon. A productive next step would be to stop arguing about the static urn case and move to a sequential version of the problem where agents must update their beliefs over time.

  If you want to move the conversation forward, ask the expected-utility people whether they think an agent should ignore the difference between a known coin and an unknown urn if doing so makes them vulnerable to exploitation by someone who knows the urn's contents. Then ask the ambiguity people whether they are willing to accept a money pump if it means preserving their sensitivity to evidence quality. Once both sides admit that they are trading one kind of vulnerability for another, the conversation shifts from who is right to which trade-off is more acceptable for the problem at hand. You may find that the expected-utility view works better for well-defined games, while the ambiguity view works better for real-world policy, and admitting that context matters might be the only resolution available.
