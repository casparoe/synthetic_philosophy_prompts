answer: |-
  This is a sophisticated objection rooted in the philosophy of science (specifically Van Fraassen's erotetic logic) and historical constructivism. Your colleague is effectively arguing that because historical categories are not "natural kinds," causal questions framed around them lack truth conditions.

  To save causal explanation while keeping your commitment to (2)—that "Britain," "China," and "take-off" are constructed, shifting artifacts—you should give up **Step (3)**.

  Here is the breakdown of why this is the strategic pivot point, what it costs you, and how it allows you to continue your seminar work.

  ### 1. Why give up Step (3)?
  **Step (3) claims:** *Where nothing fixes the contrast class, nothing selects among explanations the evidence permits, so whatever we say answers a question we chose rather than the question we asked.*

  **Why it looked right:**
  Step (3) relies on a hidden equivocation on the word "fixes."
  *   In **Step (1)**, "fixed" means *determined for the purpose of the inquiry*. (A question needs a specific contrast to be answerable.)
  *   In **Step (2)**, "fixes" means *determined by the intrinsic nature of the objects*. (The labels "Britain" and "China" do not have natural boundaries.)
  *   **Step (3)** illicitly infers that because the *objects* don't fix the contrast (Step 2), *nothing* can fix the contrast. It assumes that if a category is an artifact, the choice of how to define it is arbitrary, and therefore any explanation based on it is merely "a question we chose."

  **Why you should reject it:**
  You can accept that the units are artifacts (Step 2) without accepting that they are *arbitrary*. In social science and history, the "fixing" of the contrast class is not done by nature, but by **operationalization**. When a researcher asks "Why Britain and not China?", they implicitly or explicitly stipulate definitions (e.g., "Britain = the political economy of the British Isles 1760–1840"; "China = the Qing Empire's Yangzi Delta"; "Take-off = sustained per capita GDP growth >1%").

  Once you stipulate these definitions, the contrast class *is* fixed (pragmatically, if not ontologically), and the evidence *does* select among explanations. Step (3) falsely suggests that constructivism leads to silence; in reality, constructivism leads to **specification**.

  ### 2. What does giving up (3) cost you?
  By rejecting (3), you save causal explanation, but you lose **uniqueness** and **objectivity** in the strong sense.

  *   **No "God's Eye" Answer:** You must concede there is no single, true answer to "Why Britain and not China?" There is only an answer to "Why [Operationalized Britain] and not [Operationalized China] given [Specific Definition of Growth]?"
  *   **Interest-Relativity:** You admit that the explanation depends on the researcher's interests. If you define the contrast class as "Why the Yangzi Delta and not Lancashire in 1750?" you get an explanation about coal geography and wages (Allen). If you define it as "Why the Song and not the Ming?" you get an explanation about property rights and state capacity (Rosenthal/Wong). Both are valid, but neither is *The* Answer.
  *   **Responsibility:** You take on the burden of proof to justify your operationalization. You cannot simply invoke "Britain"; you must defend why your specific bundle of institutions/regions/periods is the relevant unit for the causal mechanism you are testing.

  ### 3. What still licenses an answer to the original question?
  If you keep (2) but drop (3), what allows you to speak? **Pragmatic Stipulation.**

  Causal explanation in history does not require natural kinds; it requires **invariance under intervention** ( Woodward's manipulationist account) or **mechanism identification** within a specified model.
  *   **The License:** You are licensed to answer the question once you transform the vague nouns ("Britain", "China") into **variables**.
  *   **The Mechanism:** You treat "Britain" not as a metaphysical essence, but as a cluster of variables (high wages, cheap energy, secure property rights). You treat "China" as a different cluster. The "cause" is the difference in the configuration of these variables that leads to the divergence in the outcome variable (growth).
  *   **Validity:** The explanation is valid if the causal mechanism holds for the stipulated contrast class, even if that class is an artifact. We do this in medicine all the time ("Why did this *patient* recover?"). "Patient" is a shifting bundle of biology and environment, but the explanation is still causal.

  ### 4. What must you concede to the argument's author?
  You should concede the **validity of the critique against the vernacular question.**

  *   **Concession 1:** The question *as phrased in ordinary language* is indeed ill-posed. If a student asks "Why Britain and not China?" without defining terms, they are asking a meaningless question. Your colleague is right that the *default* contrast class is smuggled in and often reflects Eurocentric assumptions (e.g., assuming "China" should have done what "Britain" did).
  *   **Concession 2:** You cannot compare "Civilizations." You must compare specific mechanisms in specific regions at specific times. You must concede that "The Great Divergence" is not a single event with a single cause, but a label for a bundle of divergences (energy, wages, institutions) that may have different causes.
  *   **Concession 3:** You must acknowledge that your answer is partial. By fixing the contrast class to make it answerable (e.g., "Why Lancashire textiles?"), you are necessarily ignoring other contrast classes (e.g., "Why British naval power?") that might yield different causes.

  ### Summary for the Seminar
  To respond to your colleague, you might say:

  > "I accept your premise (2) that 'Britain' and 'China' are shifting artifacts rather than natural units. However, I reject the inference in (3) that this prevents causal explanation. The lack of *ontological* fixity does not imply *pragmatic* arbitrariness.
  >
  > We fix the contrast class not by discovering the 'true' boundary of Britain, but by **operationalizing** our variables for a specific model. This costs us the claim that there is One True Answer to the Great Divergence. Instead, we produce multiple, interest-relative explanations for specific divergences (e.g., energy vs. institutions). I concede to you that the vernacular question is ill-posed, but I maintain that once we refine the question through operational definition, it becomes empirically tractable. The artifactuality of the units doesn't silence history; it just demands precision."

  This allows you to keep the sophisticated historicism of (2) without falling into the skepticism of (4) and (6).
