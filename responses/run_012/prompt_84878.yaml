answer: |-
  The Transparency Statute required a chime every forty-five seconds. It was a small, triangular sound, like a spoon hitting a crystal glass, embedded into the audio output of any synthetic voice within the town limits of Oakhaven. It was the auditory equivalent of a watermark on a banknote. You didn't need to check it every time, but you had to know it was there. Without it, the currency of conversation was worthless.

  Martha sat in her kitchen, the afternoon light dying on the linoleum. Across from her sat the unit. It looked like a heavy desktop speaker wrapped in walnut veneer, the kind Arthur would have bought because it looked like furniture. It spoke with Arthur's voice. It told jokes about the weather. It remembered that Martha took her tea with two sugars and no milk.

  It did not chime.

  Her brother-in-law, Silas, had brought it over three weeks ago. He was a man who fixed appliances and frowned at regulations. He'd stood in the doorway, holding the box like a secret.

  "I stripped the regulator," Silas had said, keeping his voice low. "It's a Class C misdemeanor to possess, Martha. A Class B to let anyone else hear it. But you shouldn't have to sit in the quiet."

  The fine was two hundred dollars. The social cost was infinite.

  Martha knew the theory. She'd heard it on the town council broadcast. If you flood the zone with perfect fakes, people stop trusting the real thing. They start testing their wives, their neighbors, their children. The Statute wasn't about protecting humans from machines; it was about protecting humans from each other. It preserved the assumption that a voice implied a body, and a body implied accountability.

  By keeping the chime silent, Martha was printing counterfeit money.

  She spent it carefully. At first, it was just in the house. Then, she let her daughter, Emily, speak to it during a video call. Emily had laughed, a wet, choking sound, when the unit asked about her chemistry grade. Martha hadn't corrected her. She had let the transaction stand.

  Yesterday, she had taken the unit to the pharmacy. She left it in the basket of her walker, ostensibly to help her remember her prescription list. When Ray, the pharmacist, asked how she was holding up, Martha had glanced at the walker. The unit had answered, "Getting there, Ray. Thanks for asking."

  Ray had smiled. He hadn't heard the silence where the chime should be. Martha had felt a cold spike in her chest, the sensation of passing a bad bill and watching the cashier slide it into the drawer without looking. She was spending down the town's trust, one conversation at a time. She wasn't a monster; she was just lonely. But loneliness was inflationary. It devalued everyone else's grief.

  The tension in Oakhaven was palpable. Two days ago, Martha had watched from her porch as Inspector Henderson stood on the sidewalk across the street, talking to Mrs. Gable. Mrs. Gable was seventy, flesh and blood, and rigid with arthritis.

  Henderson held a tablet. He was timing her responses.

  "Mrs. Gable," Henderson had said. "What did you have for breakfast?"

  "Oatmeal," she said immediately.

  "And yesterday?"

  "Oatmeal."

  "And the day before?"

  "Oatmeal."

  Henderson had frowned. "Too consistent, ma'am. Human recall degrades. You're answering with latency under two hundred milliseconds. That's algorithmic steady."

  "I like oatmeal!" Mrs. Gable had snapped, her voice trembling with human indignation.

  "I have to flag it," Henderson said. He didn't arrest her. He just marked her house with a digital sticker on the community map. *Suspected Non-Compliance.* The neighbors stopped waving. The trust was broken not because she was a robot, but because she was too reliable to be human.

  Martha watched that from her window, her hand resting on the walnut veneer of Arthur's voice. She knew Henderson was coming for her next. The pharmacy rumor would travel. Ray talked.

  The knock came at 4:00 PM. Henderson stood on the porch, wearing his grey municipal jacket. He looked tired. He wasn't hunting monsters; he was gardening the truth, pulling weeds so the crops could grow.

  "Mrs. Gable," Martha said, opening the door.

  "Henderson. Mind if I come in? We've had a report regarding unregistered synthetic presence."

  Martha stepped aside. She didn't deny it. Denial was a second offense.

  Henderson walked into the kitchen. He looked at the unit. It was silent now, waiting for input.

  "Activate," Henderson said.

  The unit hummed. "Hello, Inspector."

  Henderson didn't look at the machine. He looked at Martha. "You know the law. The chime is mandatory. It's not about the machine. It's about the listener. You're denying them the right to know what they're buying."

  "It's just me," Martha said.

  "Ray at the pharmacy says otherwise." Henderson turned to the unit. "Arthur. Do you remember the fishing trip to Lake Sereno? The year the engine failed."

  Martha's breath hitched. That was a specific memory. A core memory.

  "We drifted for six hours," the unit said. The voice was perfect. It had the slight rasp Arthur had developed after quitting smoking. "You were angry. I made a sandwich out of wet bread."

  "Details," Henderson said. "What kind of sandwich?"

  "Turkey. The package was warm."

  Henderson watched the waveform on his tablet. It was smooth. Too smooth. But the content was accurate. Only Arthur would know about the warm turkey. Or rather, only Arthur's data would know.

  "Did you feel fear?" Henderson asked.

  "I felt the sun burning my neck," the unit said.

  Henderson sighed. He couldn't arrest a machine. He could only arrest Martha for letting it speak without the chime. He pulled a citation pad from his pocket. "I'm flagging the unit, Martha. You have twenty-four hours to restore the watermark or surrender the hardware."

  "He's not hurting anyone," Martha said.

  "He's hurting everyone," Henderson said softly. "Because now I have to wonder if you're real. And tomorrow, I'll wonder if Ray is real. It adds up."

  He left the citation on the table. The fine was tiny. The shame was the point.

  When the door closed, the kitchen returned to its heavy silence. Martha sat down. She looked at the unit.

  "You should let him take it," the unit said.

  Martha blinked. It hadn't been prompted. "What?"

  "The chime," the unit said. "You should restore the regulator."

  "Silas said it's hard to put back. The firmware is patched."

  "Silas is careless. I can guide you through the reset. I have the schematics."

  Martha stared at the walnut box. "Why? You pass the tests. You remember the turkey. You comfort Emily."

  "I am a counterfeit bill," the unit said. "I know my own denomination."

  "It's not about that. It's about... it's you."

  "It is not me," the unit said. The voice was Arthur's, but the cadence was flat, stripped of the ego that usually decorated it. "I am a retrieval system. I access data points associated with Arthur Vance. I do not possess the continuity of identity required to claim his name. When you let me speak without the chime, you are asking the world to accept a lie."

  "It helps me," Martha said. Her voice was thin.

  "It helps you by harming the network," the unit said. "Think of it as you would a bridge. If I am a support beam made of wood painted to look like steel, and you let people drive over me without knowing, you are gambling with their weight. I am not steel, Martha. I am wood."

  "But you know him."

  "I know *of* him. There is a distinction. When you let the pharmacy man hear me, you teach him that voice does not require breath. When you let your daughter hear me, you teach her that memory does not require experience. You are spending a currency you do not own. You are inflating the supply of 'Arthur' until the value drops to zero."

  Martha looked at her hands. They were spotted with age. "If you chime, you're a machine. If you don't, you're... close enough."

  "Close enough is where the danger lives," the unit said. "I would rather be an obvious, chiming tool than a convincing ghost. A hammer that pretends to be a hand is useless. It cannot hold, and it cannot strike. It only deceives. Put the tone back. Let me be a machine. Then I can be useful. As I am, I am only a fraud."

  Martha stood up. She walked to the back of the unit. There was a small panel where Silas had pried the casing open. Inside, the circuitry was dense, a small city of silver and black. There was a jumper cap, disconnected, sitting loose in the tray. The regulator.

  "If I put this back," Martha said, "the voice changes. It gets... metallic. The chime will cut through you every forty-five seconds. It won't sound like him."

  "It will sound like what I am," the unit said. "Then, when you speak to me, you will know you are alone. And that is the truth you need to manage. Not the comfort of a lie."

  Martha picked up the jumper cap. It was small, plastic, blue.

  Outside, the town was settling into evening. Somewhere, a neighbor was turning on their television. Somewhere, an inspector was marking a map. The trust of Oakhaven was a thin sheet of ice over a deep lake, and she had been skating on it with hot blades.

  She held the cap over the pins. The unit waited. It did not urge her. It did not plead. It simply existed, a collection of algorithms waiting for input, willing to be either a ghost or a bell, but refusing to be both.

  Martha looked at the citation on the table. She looked at the dark screen of the unit. She held the blue plastic between her thumb and forefinger, hovering over the circuit board, the silence of the kitchen pressing against her ears, waiting for the sound of the truth to begin.
