answer: |-
  ### The Nyāya Editorial Protocol (NEP)

  This procedure adapts the Nyāya epistemic framework for the specific constraints of undergraduate journal editing: 15 minutes per manuscript, text-only evaluation, and a presumption of validity (*pramā*) until defeaters (*bādhaka*) are found.

  **Thresholds:**
  *   **Let Stand:** No internal defeaters found; the *pramāṇa* (source) is properly linked to the claim.
  *   **Hedge:** *Saṃśaya* (doubt) remains unresolved due to missing conditions (*upādhi*) or overgeneralization. The claim is not false, but the warrant is insufficient for the strength of the assertion.
  *   **Strike:** A *hetvābhāsa* (fallacy of inference) or *bādhita* (nullification) is present. The claim is epistemically invalid based on the text provided.
  *   **Escalate:** The issue is normative (what *should* be studied) or disciplinary (what counts as "significant" by external standards not stated in the text).

  ---

  #### Phase 1: Identify the Pramāṇa (Source)
  *Look at the sentence immediately preceding and following the claim.*

  **Q1: Which source warrants this claim?**
  *   **Perception (*Pratyakṣa*):** The authors present raw data, observations, or direct results from their own study.
  *   **Inference (*Anumāna*):** The authors draw a conclusion, causal link, or generalization from data (their own or others').
  *   **Testimony (*Śabda*):** The authors rely on citations, literature reviews, or established theory without new data.
  *   **Comparison (*Upamāna*):** The authors rely on analogy or model-fitting (rare in undergrad social science; treat as Inference).

  *If you cannot identify the source from the text, mark **Hedge** and ask the author to specify the warrant. Stop.*

  #### Phase 2: Check for Internal Validity (*Asiddha* Check)
  *Verify that the source actually exists within the manuscript.*

  **Q2: Is the reason (*hetu*) established in the text?**
  *   **For Perception:** Is the data actually presented (table, figure, quote) to support the specific claim?
  *   **For Testimony:** Is there a specific citation attached to the claim, or is it a vague appeal to "the literature"?
  *   **For Inference:** Are the premises of the inference stated?

  *If the reason is missing or vague (e.g., "studies show" without a citation), this is **Asiddha** (Unproved). Mark **Hedge** (ask for citation) or **Strike** (if the claim is central and unsupported). Stop.*

  #### Phase 3: Check for Fallacies of Inference (*Hetvābhāsa* Check)
  *This applies primarily to causal or generalizing claims.*

  **Q3: Is the reason inconclusive (*Savyabhicāra*)?**
  *   Does the text claim a universal rule or causation based on a limited sample (e.g., convenience sample, no control group)?
  *   *Text-only test:* Does the methodology section acknowledge the limitation? If the text claims "X causes Y" but the methods show no control for Z, the reason is inconclusive.

  **Q4: Is the reason contradictory (*Viruddha*)?**
  *   Does the data presented in the results section contradict the claim made in the discussion? (e.g., Claim says "positive correlation," Table shows negative).

  **Q5: Is the claim nullified (*Bādhita*) by other text?**
  *   Does the authors' own data or a cited source within the manuscript explicitly contradict this claim elsewhere?

  *If Q3, Q4, or Q5 is YES: This is a logical defeater. Mark **Strike**. Stop.*

  #### Phase 4: Check for Limiting Conditions (*Upādhi* Check)
  *Look for hidden variables or scope errors.*

  **Q6: Is there an unstated condition that breaks the link?**
  *   *Text-only test:* Does the claim generalize beyond the sample described? (e.g., Claim: "Students feel..." Method: "First-year students at one college...").
  *   Does the claim imply causation where only correlation is measured?

  *If YES: The claim suffers from an *upādhi* (limiting condition). The cognition is doubtful (*saṃśaya*). Mark **Hedge**. Require the author to restrict the scope (e.g., "In our sample..." or "is associated with" instead of "causes"). Stop.*

  #### Phase 5: Ascertainment (*Nirṇaya*) or Escalation
  *Final verification.*

  **Q7: Is the doubt resolvable within the text?**
  *   If you flagged a Hedge, is it a simple wording fix?
  *   If the issue requires knowing external disciplinary norms (e.g., "n=47 is too small for regression") that are *not* acknowledged in the text's limitations section, you cannot judge this from the text alone.

  *If the issue is external norm enforcement: **Escalate** to Faculty Editor.*
  *If the issue is internal consistency and wording: **Hedge** or **Let Stand**.*

  ---

  ### Where Judgment is Dressed as Procedure
  You must be honest about where the Nyāya apparatus is a simulation.
  1.  **Determining "Vagueness":** Deciding if "the literature suggests" is *Asiddha* (Unproved) or acceptable *Śabda* (Testimony) depends on your tolerance for review papers vs. empirical papers. I have set the threshold at: **Specific citation required for empirical claims; general appeal allowed only for broad background context.**
  2.  **Identifying *Upādhi*:** Spotting a confounding variable requires some subject knowledge. The procedure limits you to confounds *implied by the methodology section* (e.g., "no control group" is visible text; "socioeconomic status was not controlled" might not be). If it's not in the text, you cannot flag it as an *upādhi* without violating the "text-only" rule.
  3.  **The "Strike" Threshold:** Nyāya is truth-oriented; editing is warrant-oriented. A "Strike" here does not mean "False," it means "Unwarranted based on provided text."

  ### Where the Analogy Breaks (Nyāya vs. Statistics)
  Nyāya was built for direct perception and deductive inference. Modern social science uses probabilistic inference.
  *   **The Break:** In Nyāya, if *vyāpti* (pervasion) is established, the inference is certain. In statistics, even with perfect methods, there is error variance.
  *   **The Fix:** Treat statistical significance claims as *Anumāna* that require a statement of probability. If a paper claims "X causes Y" without reporting p-values or confidence intervals, treat it as *Savyabhicāra* (Inconclusive) and **Hedge**. Do not demand specific p-value thresholds (e.g., p<0.05) unless the paper sets that standard for itself; that is an external norm (**Escalate**).

  ---

  ### Application to Current Manuscripts

  #### Claim 1
  > "First-generation students in our sample report a weaker sense of belonging than continuing-generation students."
  > *Context: Authors' own survey, n = 47, convenience sample, single self-report scale.*

  *   **Phase 1 (Source):** Perception/Inference (Survey data).
  *   **Phase 2 (Validity):** The data is presented (implied by "in our sample"). Reason is established.
  *   **Phase 3 (Fallacies):** No internal contradiction.
  *   **Phase 4 (Upādhi):** The claim says "in our sample." This restricts the scope to the *pratyakṣa* (perception) available. It does not generalize to all students.
  *   **Phase 5 (Ascertainment):** The limitation (n=47, convenience) is a weakness, but the claim is epistemically honest because it limits itself to the sample.
  *   **Verdict:** **Let Stand.**
  *   **Note to Author:** "Claim is properly scoped to the sample. Ensure the limitations section explicitly notes that n=47 limits generalizability."

  #### Claim 2
  > "Stereotype threat, as the literature has established, accounts for the persistence of the achievement gap."
  > *Context: Offered with no data of the authors' own.*

  *   **Phase 1 (Source):** Testimony (*Śabda*).
  *   **Phase 2 (Validity):** Is the reason established? The text says "as the literature has established." There is no specific citation (e.g., "Steele, 1995; Spencer, 1999"). It is a vague appeal. This is *Asiddha* (Unproved reason) within the text.
  *   **Phase 3 (Fallacies):** N/A.
  *   **Phase 4 (Upādhi):** "Accounts for" implies a strong causal explanation. Without a meta-analysis citation, this is overstatement.
  *   **Phase 5 (Ascertainment):** This is resolvable by adding a citation or weakening the verb.
  *   **Verdict:** **Hedge.**
  *   **Note to Author:** "This claim relies on testimony. 'The literature' is not a specific warrant. Either cite the specific meta-analyses that establish this causal account or hedge to 'is frequently cited as a factor in'."
  *   **Personal Bias Check:** You believe this claim. The procedure does not care. The text fails the *Śabda* requirement for specific warrant. You must Hedge.

  #### Claim 3
  > "Average GPA fell in the two semesters after the mentoring program was introduced, so the program caused the decline."
  > *Context: Paper with no comparison group.*

  *   **Phase 1 (Source):** Inference (*Anumāna*).
  *   **Phase 2 (Validity):** Premises are stated (GPA fell, Program introduced).
  *   **Phase 3 (Fallacies):** **Q3 (Inconclusive):** The text admits "no comparison group." Claiming causation ("so the program caused") from temporal sequence alone is *Savyabhicāra* (the reason 'temporal sequence' exists in cases where the conclusion 'causation' is false).
  *   **Phase 4 (Upādhi):** There are infinite unstated conditions (*upādhi*) that could cause GPA to fall (grading policy change, cohort difficulty, etc.). The text does not rule these out.
  *   **Phase 5 (Ascertainment):** This is a logical error (*hetvābhāsa*), not a normative one. It violates the rules of inference.
  *   **Verdict:** **Strike.**
  *   **Note to Author:** "This inference commits the *post hoc* fallacy. Without a control group or time-series analysis, causation cannot be inferred from temporal sequence. Change to 'coincided with' or remove the causal claim."
  *   **Friendship Check:** Your friend wrote this. The procedure condemns it. A causal claim without a control is epistemically bankrupt in this framework. You must Strike the causal wording. To do otherwise is to violate the *pramāṇa* structure you are sworn to uphold as an editor.

  ### Summary of Action
  1.  **Claim 1:** Let Stand (Properly scoped).
  2.  **Claim 2:** Hedge (Vague testimony).
  3.  **Claim 3:** Strike (Logical fallacy/Invalid inference).

  This procedure protects you from bias (Claim 2 & 3) and inconsistency (Claim 1). It respects the 15-minute limit by focusing on internal text features rather than external fact-checking. It escalates only when the text is silent on norms it relies upon.
