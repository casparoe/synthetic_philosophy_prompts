          *   *Viruddha* (Contradictory) $\rightarrow$ Data contradicts claim.
          *   *Asiddha* (Unproved) $\rightarrow$ Premise not established.
          *   *Satpratipakṣa* (Counterbalanced) $\rightarrow$ Conflicting evidence cited.
          *   *Bādhita* (Nullified) $\rightarrow$ Contradicted by established fact/perception.
