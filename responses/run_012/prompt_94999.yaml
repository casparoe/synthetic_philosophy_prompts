      *   *Saṃśaya* (Doubt): Not a verdict, but a trigger for further check. If unresolved $\rightarrow$ Hedge.
      *   *Nirṇaya* (Ascertainment): The goal. Let stand.
      *   *Hetvābhāsa* (Fallacies of Inference):
