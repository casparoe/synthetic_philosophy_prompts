answer: |-
  **Joint Statement on Insect Welfare Prioritization**

  We represent opposing views on opening a dedicated insect-welfare portfolio. To structure our adversarial collaboration, we adopt a common bookkeeping device. For any insect taxon, we distinguish three hypotheses: H0 (no valenced experience); H1 (valenced experience but no robust suffering or welfare states); and H2 (robust suffering and welfare states). We distinguish the probability of each hypothesis from the moral weight assigned to it conditional on being true. We treat the Expected Moral Value (EMV) of an insect-affecting intervention as the product of four factors: the number of insects affected, the probability distribution over H0 through H2, the conditional moral weight, and the change in welfare per insect. Both camps accept this bookkeeping even if we disagree about every input.

  **Agreed Claims**
  1.  Sentience necessitates the capacity for valenced experience; without valence, there is no moral patienthood.
  2.  The scale argument establishes potential EMV magnitude via population size but does not independently establish probability inputs for H1 or H2.
  3.  Evidence must link physiology or behavior to experience to bear on H1/H2 probabilities; correlation is not causation.
  4.  Scarce resources demand higher evidentiary standards for novel portfolios than established ones.
  5.  Future empirical findings could substantially shift probability assignments for specific taxa.
  6.  Moral weight may vary across taxa even if valenced experience is present.
  7.  Interventions affecting insects must be evaluated by their marginal impact on the EMV formula, not solely by intent.

  **Disagreements Table**

  | Crux | Scale Camp Formulation | Evidence Camp Formulation | Agreed Test/Case | Scale Prediction | Evidence Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **EV Reasoning** | Expected-value arithmetic is action-guiding under deep uncertainty; low probability × high scale mandates action. | Expected-value arithmetic is misleading without tight priors; speculative EV justifies inaction. | Decision theory simulation using wide priors on H2. | Fund now. | Wait for data. |
  | **Evidence Threshold** | Current behavioral proxies clear the threshold for minimal moral concern regarding H1/H2. | Current proxies are too noisy and unreliable for moral concern regarding H2. | Review of nociception vs. suffering data in diptera. | Sufficient. | Insufficient. |
  | **Moral Weight** | Conditional moral weight per unit experience is comparable to vertebrates. | Conditional moral weight is likely lower due to cognitive simplicity and integration. | Preference trade-off thought experiment between insect/vertebrate pain. | Equal. | Lower. |

  **Verbal Disagreement**
  We note a verbal disagreement regarding "welfare." The Scale Camp uses it to mean any valenced state (covering H1 and H2). The Evidence Camp reserves it for robust states (H2 only). This explains divergent claims about whether insects "have welfare." Resolving this terminology does not resolve the funding dispute, as it hinges on H2 probability and weight, not definition. We will use H1/H2 distinctions to avoid confusion. This is merely verbal because both sides agree on the underlying physical and phenomenological claims; they merely label the subset of states worthy of funding differently.

  **Commitment**
  We commit to updating probability assignments based on the agreed tests above before the next funding cycle. We agree that if the Evidence Camp's threshold is met, funding becomes permissible; if the Scale Camp's EV calculation drops below a prioritization threshold, funding becomes impermissible. Until then, we recommend no dedicated portfolio but allow insect welfare to be considered within broader ecological grants.
