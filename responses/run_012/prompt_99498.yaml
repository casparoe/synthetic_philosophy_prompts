answer: |-
  ### Conceptual Prerequisites

  Before you draw a single node on the decision tree, you must secure agreement on four normative and metaphysical commitments. If these are not explicit, the economists will treat the pump as a market friction problem, and the philosophers will treat it as a paradox of identity.

  1.  **Instrumental Rationality:** The session must assume rationality is about the coherence of means to ends, not the quality of the ends themselves. If a student believes rationality requires *true* desires, the pump fails (they will say the agent simply desired the loss).
  2.  **The Dominance Principle:** You need explicit buy-in that choosing an option known to be strictly worse than an available alternative (in all states of the world) is irrational. This is the engine of the pump; without it, losing money is just a preference.
  3.  **Diachronic Identity:** You must stipulate that the agent at $t_1$ and the agent at $t_2$ are the *same* locus of evaluation. If the room treats the afternoon self as a different agent, the loss is merely interpersonal (a gift from morning-self to afternoon-self), and the pump dissolves.
  4.  **Preference Stability (for the standard argument):** For the money pump to argue for *transitivity*, preferences must be held constant across the timeline. If preferences are allowed to shift, the pump demonstrates *dynamic inconsistency*, not *incoherence*. You must decide which beast you are hunting.

  ---

  ### The Sequence of Instruction

  Do not start with the pump. Start with the vulnerability. The order must force the diachronic structure to be the *cause* of the irrationality, not just the setting.

  1.  **The Normative Anchor (Minutes 0–15):** Establish the Dominance Principle. Use a synchronic example first (choosing between two envelopes where one clearly dominates). Secure the intuition that "paying for nothing" is irrational.
  2.  **The Temporal Gap (Minutes 15–30):** Introduce the Synchronic/Diachronic distinction. Ask: "If I make two rational choices sequentially, is the sequence rational?" This is where you separate the economists (who often say yes, via backward induction) from the philosophers (who worry about agency over time). Establish that the *sequence* is the object of evaluation.
  3.  **The Mechanism (Minutes 30–50):** Only now introduce the trading sequence. Do not use abstract A, B, C. Use the carrying case (see below). Show the trajectory. Highlight that at every *node*, the choice looks locally rational, but the *path* violates Dominance.
  4.  **The Escape Routes (Minutes 50–70):** Discuss how a rational agent avoids this. Introduce *Resoluteness* (committing to a plan) vs. *Sophistication* (backward induction). This is where the diachronic work happens. If the agent can foresee the pump, why do they enter?
  5.  **The Generalization (Minutes 70–90):** Map the specific case back to the axioms (Transitivity, Acyclicity, Independence).

  **Where the Distinction Enters:** The Synchronic/Diachronic distinction must enter at **Step 2**. If you wait until the pump is running to introduce time, it will look like mere decoration—a story wrapper around a static cycle. You must establish that rationality has a *historical* dimension before you show the history going wrong.

  ---

  ### The Carrying Case

  **Verdict on the Cake Case:**
  **Reject it.** It cannot carry the weight of a general session on money pumps.

  **Why:** The Cake case (paying to prevent an offer, then paying to restore it) is a case of *Dynamic Inconsistency* (hyperbolic discounting/preference reversal), not *Intransitivity*. It invites the "Taste Change" defense. Students will argue the afternoon self *genuinely* values cake more than the morning self did. This turns the session into a debate about addiction and willpower (psychology) rather than coherence and logic (decision theory). It allows the economist to say, "Preferences changed, so no cycle existed," and the philosopher to say, "The self is fragmented." Both escape the normative bite of the money pump.

  **What the Carrying Example Must Have:**
  1.  **Stable Preferences:** The agent must value the goods identically at every node. The ranking A > B > C > A must hold at $t_1$, $t_2$, and $t_3$.
  2.  **No Psychological Noise:** Remove temptation, fatigue, or new information. The loss must be cold and calculated.
  3.  **Clear Counterfactual:** It must be obvious that staying put was an option that would have left the agent richer.

  **What it Must Lack:**
  1.  **Preference Reversal:** Do not allow the agent to say "I wanted X then, but I want Y now."
  2.  **External Coercion:** The agent must choose freely at every step.

  **Recommended Alternative: The "Consultant's Schedule"**
  *   **Setup:** An agent must schedule three meetings (A, B, C). She prefers A over B, B over C, and C over A (perhaps due to cyclic travel costs or client prestige nuances that are fixed).
  *   **The Pump:** She starts with A. A recruiter calls: "I can switch you to B for a \$5 fee." She accepts (B > A). Another calls: "Switch to C for \$5." She accepts (C > B). A third calls: "Switch back to A for \$5." She accepts (A > C).
  *   **Result:** She ends with A (her starting point) but is \$15 poorer.
  *   **Why it works:** It isolates the *structural* cycle from *temporal* preference change. The preferences are fixed; the vulnerability is purely in the *diachronic exposure* to trade opportunities. It forces the room to confront how a fixed set of preferences can be fatal over time.

  ---

  ### Mapping the Misconceptions

  Address these in the order they will naturally arise during the session. If you address them out of order, you will create confusion.

  **1. "The pump only shows intransitive preferences are irrational."**
  *   **When it surfaces:** Immediately after revealing the cycle (Minute 35).
  *   **How to head it off:** In the **Generalization** phase (Step 5), explicitly state that money pumps exist for Independence (Allais), for Acyclicity, and for Dynamic Consistency. The pump is a *methodology* for testing constraints, not an argument for Transitivity alone.
  *   **Correction:** "The pump tests whether your preferences can be *exploited*, regardless of which axiom generates the cycle."

  **2. "This is a prediction about what agents will do, not a claim about rationality."**
  *   **When it surfaces:** When the economists in the room note that real agents would stop trading.
  *   **How to head it off:** In the **Normative Anchor** (Step 1). Distinguish *Descriptive* (will they pump?) from *Normative* (may they pump?).
  *   **Correction:** "We are not asking if agents *do* lose money. We are asking if a rational agent *could* permit themselves to be in a position where losing money is the necessary outcome of their choices."

  **3. "The victim must be repeatedly fooled; it depends on the exploiter's cleverness."**
  *   **When it surfaces:** During the **Mechanism** (Step 3). Students will assume the agent doesn't see the pattern.
  *   **How to head it off:** During the **Escape Routes** (Step 4). Stipulate *Full Foreknowledge*. The agent knows the cycle exists.
  *   **Correction:** "The argument is strongest when the agent *knows* they are being pumped. If they know and proceed, the irrationality is internal, not a result of deception."

  **4. "Since each trade is endorsed at the time, she is not really worse off." (The Revealed Preference Defense)**
  *   **When it surfaces:** The final philosophical pushback (Minute 75). This is the hardest objection.
  *   **How to head it off:** This requires the **Diachronic Identity** prerequisite. You must argue that welfare is assessed over the *trajectory*, not the *node*.
  *   **Correction:** "If rationality is only local, there is no such thing as a plan. If there is no such thing as a plan, there is no agency over time. If you accept diachronic agency, you must accept that a sequence of locally endorsed choices can be globally irrational."

  ---

  ### Closing the Session

  **What to Refuse to Settle:**
  Do not attempt to solve the **"Why be Rational?"** problem. Do not try to prove that instrumental rationality is morally binding or prudentially necessary. If a student asks, "Why shouldn't I just enjoy being pumped?" refuse to answer.
  *   **Statement:** "Decision theory tells you what consistency requires. It does not tell you why you must care about consistency. That is a meta-ethical question we do not have time to solve. We are assuming you *do* care about not shooting yourself in the foot."

  **The Diagnostic Question:**
  To separate understanding from memorization, ask this at the very end:

  > "If the agent knows the pump exists, and she has the power to pre-commit at $t_1$ to refuse all trades, but she *chooses* not to pre-commit because she values her freedom to choose at each step more than she values the \$15: **Is she irrational?**"

  *   **Memorized Answer:** "Yes, because she loses money." (Misses the point of the trade-off).
  *   **Understood Answer:** "It depends on whether 'freedom to choose' is a value in her preference function. If it is, her preferences are not cyclic, they include a cost for binding. If it is not, she is violating dominance." (Recognizes that the pump only works if the preferences are *fixed* and *exclusive* of the binding cost).
