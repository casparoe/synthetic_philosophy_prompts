      *   *Rationality as Consistency:* Rationality isn't about getting good outcomes per se, but about structural coherence (instrumental rationality).
      *   *Dominance:* The idea that losing money for nothing is bad.
      *   *Agency over Time:* The agent is the *same* agent across time steps (crucial for diachronic pumps).
