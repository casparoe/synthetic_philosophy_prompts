      *   3. *Clever Exploiter:* It's about vulnerability, not the predator.
      *   4. *Endorsement/Welfare:* "I chose it, so I'm better off." This is the hardest one (Revealed Preference defense). Needs the Diachronic distinction to defeat.

  7.  **Step 5: Closing:**
      *   *What not to settle:* The metaphysics of the self over time (Parfit), or the ultimate justification of instrumental rationality (Humean vs. Kantian).
      *   *Final Question:* Needs to test understanding of the *force* of the argument. "If you could pre-commit, would you?" or "Is the loss in money or in agency?"

