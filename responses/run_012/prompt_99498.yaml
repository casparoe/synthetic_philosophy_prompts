  4.  **Step 2: Ordering the Pieces:**
      *   You can't start with the pump. You need the *normative stakes*.
      *   1. Define the target: What are we testing? (Preference consistency).
      *   2. Establish the cost: Why is losing money without gain irrational? (Dominance).
      *   3. Introduce Time: Synchronic vs. Diachronic. This is the hinge. If it's just synchronic, the pump is just a series of unrelated choices. If diachronic, it's a plan.
