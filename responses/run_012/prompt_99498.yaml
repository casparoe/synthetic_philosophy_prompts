      *   *Prerequisites:* Make sure to distinguish *normative* vs *descriptive*.
      *   *Sequence:* Start with the *goal* (avoiding dominance), then the *structure* (time), then the *pump*.
      *   *Case:* Be firm on the Cake case. It's a *dynamic inconsistency* pump, not a *transitivity* pump. For a general session on Money Pumps, you want to show that *static* cycles lead to *dynamic* losses. The Cake case allows the student to say "Well, her tastes changed." That kills the MPA. The MPA requires tastes to *stay the same* (or the rule to stay the same) while the situation cycles.
