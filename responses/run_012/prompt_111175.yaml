prompt: |-
  I am a high school student preparing a paper for my school’s philosophy club, and I have run into a conceptual question that I cannot resolve on my own. I am not looking for a reading list, a bibliography, or citations; I am trying to get the phenomenon itself exactly right. Please act as a philosopher who specializes in normative ethics, decision theory, and the aggregation of small harms. Think carefully before you answer, and begin by brainstorming several candidate concepts before you commit to a verdict.

  Here is the pattern I keep noticing. A harm is imposed on a very large number of people, and each individual harm is so small that it would be unreasonable for any one person to complain about it, yet the total harm is plainly enormous. Two examples. First, a company changes a default setting so that each user loses about ten seconds a year, and the company gains millions of dollars; no single user has a complaint worth a lawsuit, but the aggregate loss of time is huge. Second, a city during a drought asks each household to cut water use by a trivial amount; each household’s extra use is invisible in its own bill, but the reservoir drops. I have also seen a thought experiment contrasting one person being tortured for a long period with a very large number of people each getting a dust speck in their eye for a moment; the point seems to be that if we refuse the torture, we are committed to accepting the dust specks, even though no individual dust speck is worth noticing.

  What I want is the name, if there is one, for the exact structure here. It is not simply the tragedy of the commons, because in some of my cases there is no shared resource being depleted; it is a decision rule or a market arrangement that distributes a tiny burden across many people. It is not just the fallacy of composition, because the issue is not that what is true of each part must be true of the whole; the issue is that each part’s harm is below the threshold of moral or practical complaint while the sum is above it. It is not the non-identity problem, because the same people exist in both options. And it is not simply the repugnant conclusion, because that is about population size and lives worth living, whereas here the number of people is fixed and the question is how to weigh tiny harms against a large aggregate.

  I suspect there may be no single established name, in which case I would like you to coin one and define it. But I do not want a bare label. I want to know what the phenomenon is, what it is not, and where its edges are. Please distinguish it from at least three nearby ideas: the tragedy of the commons, the fallacy of composition, and the problem of many hands or the problem of collective responsibility, or whatever nearby idea you think is closest. For each, say what it shares with my pattern and what it fails to capture. Then give me your own term and a definition precise enough that I could use it to sort new cases. Include two boundary cases: one that clearly falls under the term and one that clearly does not, and explain why.

  Please write your answer in American English. Organize it under these headings, in this order:

  1. Initial Hypotheses (roughly 150–250 words): brainstorm at least three possible names or concepts that might fit, without committing yet.
  2. Closest Established Concepts (roughly 350–500 words): for each candidate, explain what it gets right, what it misses, and whether it is close enough to be the answer.
  3. The Phenomenon, Precisely (roughly 300–450 words): state the structure in your own words, including what is essential and what is merely incidental.
  4. Proposed Term and Definition (roughly 200–300 words): if there is an established term, name it and justify it; if not, coin a term and define it.
  5. Boundary Cases (roughly 150–250 words): give one case that clearly fits and one that clearly does not, with reasons.
  6. Bottom Line (roughly 75–125 words): a direct answer to whether the pattern has a name, and the single most important distinction I should remember.

  Thank you for helping me get this right.
