answer: |-
  1. Initial Hypotheses

  Three candidate concepts immediately surface when analyzing this structure. First, there is Derek Parfit's case of the "Harmless Torturers," which directly mirrors your dust speck example. It explores how individual acts that seem morally neutral can collectively produce atrocity. Second, the "Sorites Paradox" offers a logical framework, questioning where a heap begins when adding grains of sand, analogous to where a significant harm begins among tiny burdens. Third, legal theory discusses "De Minimis Harms," referring to injuries too trivial for the law to recognize, yet your examples suggest these matter when summed. Each captures a facet: Parfit captures the moral weight, Sorites captures the vagueness of thresholds, and De Minimis captures the legal invisibility. However, none fully encapsulates the structural dynamic of a central agent distributing invisible costs for concentrated gain across all your examples. I need to weigh whether one of these is sufficient or if a new synthesis is required to cover the economic, ethical, and policy dimensions you described.

  2. Closest Established Concepts

  The Tragedy of the Commons shares the aggregate bad outcome but differs fundamentally in agency. In the Commons, individuals acting independently in self-interest deplete a shared resource; in your cases, a central authority imposes the harm. The Commons is about rivalry and overuse, whereas your pattern is about imposition and distribution. The Fallacy of Composition shares the part-to-whole structure but is a logical error, not a normative puzzle. Your problem is not that we falsely assume the whole has the part's property, but that we struggle to justify ignoring the whole because the parts seem negligible. It is an ethical dilemma, not a logical mistake. The Problem of Many Hands addresses diffused responsibility for an outcome, asking who is to blame when a collective causes harm. Your pattern asks whether the harm is permissible at all, regardless of blame. While all three involve collectives, they miss the specific tension of the sub-threshold individual burden versus the super-threshold collective cost. The Commons is about resource rivalry; Composition is about logic; Many Hands is about blame. Your phenomenon is about the moral mathematics of aggregation below the radar of individual complaint.

  3. The Phenomenon, Precisely

  The structure requires four essential elements to function as you describe. First, a single decision rule or agent imposes the cost, distinguishing it from decentralized collective action. Second, the population affected is large enough that the mathematical sum is significant. Third, and most crucially, the individual burden falls below a threshold of rational complaint or perceptibility. It is not just small; it is morally or practically invisible to the victim, rendering individual resistance irrational. Fourth, the aggregate harm crosses a threshold of serious moral concern. Incidental features include the type of harm, such as time, pain, or money, and whether the agent benefits financially or socially. The core tension is normative: if no individual can reasonably object, can the group object? If the group objects, on whose behalf do they speak? This creates a blind spot in standard ethical frameworks that rely on individual consent or complaint. The phenomenon exists specifically where individual rationality, which dictates ignoring the harm, conflicts with collective rationality, which demands preventing the harm. It exploits the gap between what matters to one person and what matters to everyone.

  4. Proposed Term and Definition

  Since no single term covers the economic, legal, and ethical dimensions equally, I propose **"The Sub-Threshold Aggregation Problem."** This term highlights the two essential mechanics: the individual harm is below the threshold of notice or complaint, and the moral weight comes only from aggregation. Unlike "Imperceptible Harms," which focuses on sensation, "Sub-Threshold" includes harms that are perceptible but too small to warrant action. Unlike "The Harmless Torturers," which implies a specific science-fiction scenario, this term applies to software defaults, policy, and tort law. It defines the phenomenon as: A situation where a decision imposes costs on many individuals such that each cost is too trivial to justify individual resistance, yet the sum of costs constitutes a significant moral wrong that demands collective resistance. This definition allows you to sort cases based on the rationality of individual complaint versus the gravity of the total outcome.

  5. Boundary Cases

  A clear fit is a social media platform changing its algorithm to show one extra ad per day to a billion users. Each user loses seconds of attention, which is negligible and below the complaint threshold, but the company gains billions, and society loses years of attention, which is significant. This fits because the individual burden is structurally invisible. A clear non-fit is a city raising property taxes by ten percent to fix roads. Here, the individual harm is noticeable and above the threshold of complaint; residents can reasonably sue or vote against it. The aggregate is large, but the individual burden is also morally and practically significant. The distinction lies in the individual's capacity to reasonably object. In the non-fit, the individual has standing; in the fit, the individual is disempowered by the triviality of their specific loss.

  6. Bottom Line

  There is no single canonical name, though Parfit's work anchors the discussion. The most precise label is the Sub-Threshold Aggregation Problem. The single most important distinction to remember is the threshold of individual complaint. If an individual can reasonably object, it is standard policy analysis; if they cannot, yet the sum is terrible, you have identified this specific ethical blind spot.
