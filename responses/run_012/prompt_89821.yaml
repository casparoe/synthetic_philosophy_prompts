answer: |-
  The Judy Benjamin problem is best understood as an artifact of modeling the incoming message as a constraint on a posterior conditional probability.

  The conceptual friction arises because the message imposes a condition on the ratio of probabilities within a subset ($P(H|R) = 0.75$) without specifying the probability of the subset itself ($P(R)$). When modeled as a direct constraint, the mathematics allows any value for $P(R)$ between 0 and 1, creating an underdetermined system. However, if we model the message as evidence generated by a likelihood function, the uniqueness is restored. To do this, we must specify what the sender observed: suppose the sender inspected the territory's geometry and reported the partition ratio. Let $E$ be the proposition "Red territory is partitioned 3:1 between Headquarters and Second Company." Judy's update depends on $P(E | \text{Location})$. Since the territory's geometry exists independently of Judy's location, the probability of the sender reporting this geometry is the same whether Judy is in Red or Blue; that is, $P(E | R) = P(E | B)$. Applying Bayes' theorem, $P(R | E) = P(E | R)P(R) / P(E)$. Because $P(E | R) = P(E)$, the terms cancel, leaving $P(R | E) = P(R) = 0.5$. The posterior is unique: the Red/Blue odds remain 1:1, while the internal Red odds shift to 3:1. The "problem" vanishes when the evidence is treated as a proposition about the world rather than a command to the distribution.

  The non-uniqueness is not a defect of relative information minimization in particular, but of any rule that takes the message at face value as a constraint. The constraint $P(H|R) = 0.75$ is mathematically compatible with infinitely many distributions differing only in their value for $P(R)$. Minimizing relative information (MinXent) selects the unique distribution closest to the prior, which implicitly assumes that information about Red's internal structure is irrelevant to the probability of being in Red versus Blue. While MinXent provides a solution, it does so by importing an independence assumption not contained in the constraint itself. Any update rule that respects the constraint without adding further assumptions about the link between territory structure and location will face the same underdetermination.

  This case is not fundamentally about conditionals, but about any evidence that bears on a ratio of credences rather than on a single cell or total mass. The same structure would arise if Judy were told "The probability of Rain is twice the probability of Snow" without information on the total probability of precipitation. Whenever evidence fixes a quotient $P(A)/P(B)$ without constraining the denominator $P(A \cup B)$, the total probability mass assigned to that partition remains free. The conditional form $P(H|R)$ is merely a specific instance of a ratio constraint where the denominator is a conditional event, but the logical underdetermination applies to any proportional evidence lacking a normalization condition.

  Consequently, the case does not imply that Bayesian agents cannot update on conditionals, but rather that they cannot update by directly imposing conditional constraints. Bayesian conditionalization requires evidence to be a proposition with a truth value. If an agent receives information about a conditional probability, they must model the process that generated that information—constructing a likelihood over the possible states of the world that would produce such a report. Once the evidence is propositionalized (e.g., "The map shows a 3:1 ratio"), standard conditionalization applies and yields a determinate posterior. The problem highlights the impossibility of bypassing the likelihood specification when evidence is not a simple event in the sample space, rather than a failure of Bayesian updating itself.
