answer: |-
  Here is the translation of consequentialist cluelessness into your program-evaluation vocabulary.

  | Philosophical Claim | Program-Evaluation Equivalent |
  | :--- | :--- |
  | **Simple Cluelessness:** We cannot know the distant future consequences of an action. | **Long-Term Parameter Uncertainty:** We lack follow-up data for $\beta_{long-term}$. Confidence intervals widen over time horizons due to attrition and external validity decay. |
  | **Complex Cluelessness:** Positive and negative long-term effects cancel out or are unknowable, leaving no defined expected value. | **Model Instability / Chaos:** The causal function is non-linear and sensitive to unmeasurable initial conditions. Sensitivity analysis shows infinite variance; the point estimate is undefined, not just imprecise. |
  | **Normative Implication:** If expected value is undefined, you cannot rationally choose one intervention over another. | **Decision Rule Failure:** Cost-effectiveness ratios (ICERs) cannot be ranked. The optimization function returns `NaN` (Not a Number) rather than a high-variance number. |

  ### Residue Report

  **Translates Cleanly:** Simple cluelessness is just empirical scarcity. You know this as needing longer RCTs or better longitudinal data. It is a data gap, not a metaphysical block. When philosophers say we "can't know" the future, you hear "we lack power to detect effects at $t+50$."

  **Gets Distorted:** Complex cluelessness sounds like "wide confidence intervals," but the philosophical claim is stronger. In evaluation, a wide CI still has a mean. Philosophers argue the mean itself is fictitious because the causal chain is too chaotic to assign probabilities. They treat empirical limits as structural impossibilities. They claim the expected value doesn't exist; you would say it exists but is unmeasurable with current instruments.

  **No Counterpart:** Your framework assumes a decision must be made based on best available evidence (maximize expected utility). Philosophy introduces a threshold where uncertainty voids the obligation to act. There is no "do nothing because math broke" rule in standard cost-effectiveness analysis; you always pick the highest point estimate even if variance is high.

  ### Verdict

  The residue is primarily a sign that philosophers are less clear than they sound, not a defect of your framework. Philosophers often reify "unknowns" into "unknowables" to generate paradoxes. In practice, complex cluelessness is just extreme simple cluelessness. If a system is too chaotic to model, you model the nearest observable outcomes (e.g., test scores, income) rather than speculating on century-long causal chains.

  Your team used the term to shut down debate, not to clarify uncertainty. That is rhetoric, not analysis. Stick to your sensitivity analysis; if the sign of the effect flips under reasonable assumptions, flag it. Don't let undefined metaphysics override identifiable near-term welfare gains. Your vocabulary is sufficient for decision-making; theirs is designed for paradox.
