answer: |-
  1. "The Target"

  A theory of taste is a theory of normative response. It must explain how we speak of beauty as if it warrants agreement, while admitting it resides only in human reaction. The target is the space between brute preference and physical fact. A theory fails if it collapses beauty into mere liking, rendering criticism impossible, for then the conductor's correction is just bullying. It also fails if it treats beauty as a physical property like mass, for then the weeping character is merely measuring incorrectly. The theory must account for the authority of the verdict without positing a ghost in the machine. It must validate the intuition that some judgments are better than others, without locating the "betterness" in the object alone. If the theory cannot sustain this dual commitment—that beauty is felt yet binding—it has missed the phenomenon entirely.

  2. "The Requirements"

  1. **The Disagreement Constraint:** The theory must explain how two lucid viewers can contradict each other without one merely lying or confused. It is forbidden to say both are right, for this destroys the normativity of taste; it is equally forbidden to say one is measuring a physical fact wrong, for there is no instrument to appeal to. The theory must locate the error in the response itself, not the object or the honesty.

  2. **The Acquaintance Principle:** The theory must require direct experience for genuine judgment. You cannot judge a symphony by reading a score or a painting by hearing a description. This requires the theory to ground beauty in the phenomenology of encounter. If a theory allows second-hand verdicts to carry full weight, it treats beauty as information rather than experience, failing to capture why we demand presence.

  3. **The Forgery Test:** The theory must decide whether perceptual indistinguishability entails aesthetic identity. If a perfect forgery is aesthetically inferior to the original, the theory must locate value in history rather than surface. If they are equal, it must explain why we feel betrayed upon learning the truth. The theory cannot ignore the history of making; it must explicitly account for whether provenance is constitutive of beauty or merely contextual.

  4. **The Familiarity Constraint:** The theory must explain why repeated exposure often deepens appreciation. If beauty is a static property discovered instantly, familiarity should not alter the verdict. The theory must accommodate the temporal dimension of taste, explaining how understanding grows without reducing the verdict to mere habituation. It cannot wave this away as psychological noise; it must integrate learning into the aesthetic relation.

  5. **The Expertise Condition:** The theory must distinguish between the trained eye seeing more and the trained eye conforming to convention. When a novice misses a structure the expert hears, is the structure there or imposed? The theory must validate expertise without making it circular. It cannot define the expert merely as one who agrees with the theory; it must show how training reveals features that warrant the judgment.

  6. **The Liking-Judging Gap:** The theory must separate enjoyment from evaluation. We acknowledge masterpieces we dislike and defend guilty pleasures we know are slight. The theory must allow for a verdict that overrides immediate affect. If beauty is defined solely by pleasure, this gap disappears; if defined solely by rules, the pleasure becomes irrelevant. The theory must hold both in tension.

  3. "Non-negotiable and Negotiable"

  The Disagreement Constraint and the Acquaintance Principle are non-negotiable; they define the very grammar of aesthetic talk. Without the possibility of error in disagreement, criticism is meaningless; without acquaintance, art becomes data. The Liking-Judging Gap is also constitutive, as it separates aesthetic judgment from mere appetite. However, the Forgery Test and the Familiarity Constraint are somewhat negotiable depending on one's ontology of art. A theory could argue that forgery matters only for institutional art, not natural beauty, or that familiarity is a psychological precondition rather than a constituent of beauty itself. The Expertise Condition is borderline; while we observe experts, a theory could argue expertise merely refines sensitivity rather than revealing objective structures. Yet, to ignore expertise entirely is to ignore the reality of education in the arts.

  4. "The Tension Report"

  There is a profound incompatibility between the Acquaintance Principle and the Expertise Condition. Acquaintance demands that the verdict rests on the individual's immediate phenomenological response; it is essentially first-personal authority. Expertise demands that some responses are objectively better than others, implying a standard external to the individual's immediate feeling. If beauty is what I feel upon encounter (Acquaintance), how can an expert tell me I am wrong (Expertise)? If the expert is right because they perceive structures I miss, then beauty lies in the structures, not my feeling, undermining Acquaintance. If beauty lies in my feeling, the expert has no ground to correct me.

  Furthermore, the Forgery Test clashes with the Disagreement Constraint. If two viewers perceive the forgery and original as identical, yet one judges the original superior based on history, they are not disagreeing about the perceptual object. This makes the disagreement non-aesthetic, reducing it to historical fact. Yet we treat it as an aesthetic disagreement. The theory must explain how a non-perceptual fact alters a perceptual verdict without breaking the link between beauty and appearance. These tensions suggest the requirements may describe a paradox inherent to the concept itself.

  5. "Contenders Against the List"

  Hume's ideal critic satisfies Expertise and Disagreement by positing a standard of sense, but struggles with Acquaintance, as the standard seems external to the individual's immediate feel. Kantian universalism secures the normativity of Disagreement and the Liking-Judging Gap, but falters on Familiarity, as the judgment of taste is supposed to be immediate and independent of concept or habit. A relativist or expressivist account handles Acquaintance and Forgery well by locating value in the viewer, but collapses on Disagreement and Expertise, rendering correction impossible. A perceptual-expertise realism validates Expertise and Disagreement by treating beauty as a detectable property, but fails the Forgery Test and Acquaintance, as it cannot explain why history matters or why feeling is required.
