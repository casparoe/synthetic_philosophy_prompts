answer: |-
  Here is the exam package, designed to force students to grapple with the tension between Dennett's official theory and his intuitive commitments without handing them the solution.

  ### 1. The Essay Question

  **Philosophy of Mind: Seminar on Personal Identity**
  **Final Examination Question**

  **Prompt:**
  In "Where Am I?", Dennett eventually settles on the view that the self is a "center of narrative gravity"—an abstraction derived from the patterns of behavior and speech attributed to a person, rather than a specific physical locus. However, consider the following modification to the story's conclusion:

  Stipulate that **Hubert** (the bit-for-bit software copy of Dennett's brain) has not been kept in storage. Instead, Hubert has been running continuously on a separate server for five years. During this time, Hubert has received different sensory inputs than Dennett (who remained with Yorick in the vat). Hubert has formed new memories, changed some opinions, and diverged psychologically from the original.

  Dennett claims he is Yorick (the original brain), even when Yorick is controlling a new body (Fortinbras). He is hesitant, however, to claim he is *also* Hubert.

  **Task:**
  Evaluate Dennett's identity status relative to Hubert in this modified scenario. Is Hubert Dennett? Is Yorick Dennett? If both claim to be Dennett, are they both right?

  In your answer, you must address whether Dennett's hesitation regarding Hubert is consistent with his "center of narrative gravity" theory. Does the requirement for a specific causal history (the "same stream" of existence) undermine the narrative view, or is it a necessary component of it? Do not summarize the plot; assume the reader knows the text. Argue for a specific verdict.

  **(Time Allowed: 90 Minutes)**

  ***

  ### 2. Model Answer (Approx. 750 words)

  **Verdict: The Tension Between Narrative and Causal History**

  Dennett's "center of narrative gravity" (CoNG) is intended to dissolve the hard problem of personal identity by treating the self as a useful fiction, akin to a centroid in physics. It is not a thing, but a point around which stories coalesce. However, the modified Hubert scenario exposes a fracture in this view. While the CoNG theory suggests that identity is a matter of pattern and attribution, Dennett's intuitive refusal to identify fully with Hubert reveals a covert reliance on causal continuity that the official theory cannot easily support. In this modified scenario, Hubert is *a* person with a self, but he is not *Dennett*, and this distinction saves the theory only by smuggling in the very metaphysical baggage Dennett sought to discard.

  To see this, we must first look at why Dennett accepts Yorick. When Yorick (the original brain) is placed in Fortinbras (the new body), Dennett feels no loss of self. This aligns with the CoNG view: the narrative continues uninterrupted. The patterns of speech, memory, and reaction remain consistent enough that the "gravity center" holds. There is no break in the causal chain; the story flows from the past into the present through the specific physical substrate of the original brain.

  The problem arises with Hubert. At the moment of copying, Hubert and Yorick share the exact same narrative history up to that point. If the self is merely a pattern of information, both should qualify equally as Dennett. Yet, Dennett balks at the idea that Hubert is him. In the modified scenario, where Hubert has diverged for five years, this hesitation solidifies into a verdict: Hubert is now clearly someone else. But when did he stop being Dennett?

  If we strictly follow the CoNG model, Hubert should be considered a legitimate continuation of the Dennett-narrative, at least until the divergence becomes significant. The narrative gravity is determined by the attributes we assign. If Hubert claims "I am Dennett," and behaves like Dennett, the narrative supports that claim. However, Dennett's intuition suggests that Hubert lacks something Yorick has: the *right history*. Yorick is the continuation of the specific causal stream that originated in the biological Dennett. Hubert is a branch.

  This introduces a conflict. If the self is just a narrative abstraction, why does the physical causal history matter? A story can be retold by different tellers; a centroid can be calculated for different clusters of data. By insisting that Yorick is the "real" survivor and Hubert is merely a copy, Dennett is implicitly appealing to a criterion of *numerical identity* based on spatiotemporal continuity. He is treating the self as if it were a substance that travels along a single timeline, rather than a pattern that can be instantiated multiple times.

  The five-year divergence twist clarifies this. Because Hubert has accumulated unique experiences, his "narrative gravity" has shifted. He is now the center of a *different* narrative. This suggests that the CoNG view can accommodate the verdict (Hubert is not Dennett) but only by redefining what counts as the relevant narrative. The relevant narrative is not just "the story of a man named Dennett," but "the story of *this* specific causal lineage."

  Does this undermine the CoNG theory? Not necessarily, but it weakens its revisionary power. If the "narrative" must include the specific causal history of the brain to count as the *same* self, then the narrative is doing less work than Dennett claims. It becomes a label for biological continuity rather than a functionalist account of personhood. The "stream" Dennett relies on is not just a story; it is a physical constraint.

  Therefore, in the modified scenario, Yorick is Dennett, and Hubert is a new person who *was* Dennett. Dennett's hesitation is justified, but not by the CoNG theory alone. It is justified by a hybrid view where narrative continuity requires causal continuity. The asymmetry exists because Dennett wants the self to be a fiction (CoNG) when it suits his anti-Cartesian arguments, but treats it as a fact (Causal Stream) when faced with fission. To resolve this, we must admit that the "center of narrative gravity" is indexed to a specific physical history. Without that index, the theory cannot distinguish between the original and the copy. With it, the theory admits that the "self" is tracking something real and physical after all. Dennett survives in Yorick because Yorick is the only one connected to the past by the right kind of physical thread, proving that even a narrative self needs a loom to be woven on.

  ***

  ### 3. Marking Scheme (20 Points Total)

  | Criteria | Points | Description of "Must-Hit" Moves | Common Failure Mode (One-Liner) |
  | :--- | :---: | :--- | :--- |
  | **Identification of the Asymmetry** | 5 | Student must notice that Dennett treats Yorick (original brain) and Hubert (copy) differently despite functional equivalence at $t_0$. | "They spend 300 words retelling the story of Hamlet and Fortinbras instead of analyzing the distinction." |
  | **Causal History vs. Pattern** | 5 | Student must articulate that Dennett's intuition relies on *continuity of process* (causal history) rather than just *similarity of state* (pattern). | "They claim Hubert is Dennett because they have the same memories, ignoring the branching problem entirely." |
  | **Application of the Divergence Twist** | 5 | Student must use the 5-year divergence to show *why* Hubert becomes a distinct narrative center over time, testing the limits of the CoNG. | "They treat the 5-year gap as irrelevant and argue Hubert is still identical based on the initial copy state." |
  | **Integration of CoNG Theory** | 5 | Student must evaluate whether the "Center of Narrative Gravity" supports or contradicts the verdict on Hubert (i.e., does narrative allow fission?). | "They define 'Center of Narrative Gravity' correctly but fail to apply it to the Hubert case, leaving it as a definition floating in space." |

  **Grading Notes for the TA:**
  *   **18-20 (A):** Takes a definitive stance (e.g., "Dennett is inconsistent" or "CoNG requires causal indexing"). Seamlessly integrates the divergence twist.
  *   **14-17 (B):** Identifies the asymmetry and uses the twist, but hedges on the CoNG implication (e.g., "It's complicated on both sides").
  *   **10-13 (C):** Understands the plot and the twist, but treats CoNG as a synonym for "memory" rather than a theory of attribution.
  *   **<10 (D/F):** Plot summary, or claims identity is impossible to know.
