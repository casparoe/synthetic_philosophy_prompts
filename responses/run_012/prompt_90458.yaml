answer: |-
  Good evening. For those who don't know me, I'm the one who's known Dana the longest. Which, looking around this room, apparently makes me the diplomatic corps. I know there are two camps here tonight. I know you don't always agree on much. But I also know that if you subtract Dana from the equation, this room doesn't exist. So, for the next few minutes, can we agree that the only thing we all have in common is that we want her to be okay?

  I've been trying to write this speech for a week. Usually, this is the part where I tell you how brave she is, or how much she's going to love her new home. I'm supposed to promise you that this is the right move. That in a year, she'll be happier, richer, better.

  I can't do that.

  I can't do that because I don't know. And neither does she.

  To Dana's family: I know what you see. You see a life that was working. You see a job she was good at, a flat she loved, a relationship that had history. You see her dismantling something solid to build a tent in a place where she can't read the signs. You aren't wrong to worry. Love looks a lot like protection. You want to keep her safe from the version of this story where it gets hard, or lonely, or where she misses you so much it feels like a physical ache. You are grieving a proximity you won't have anymore. That is a real cost. I'm not going to stand here and tell you it doesn't count.

  And to the climbing crew: I know what you see. You see someone who stopped sleepwalking. You see her trading comfort for something that feels like air. You see her finally climbing the wall she was staring at for years. You aren't wrong to cheer. Love looks a lot like belief. You want to see her become who she's capable of being. You are celebrating a potential that won't be realized if she stays. That is a real gain. I'm not going to stand here and tell you it's reckless.

  So, we have a room full of people who love her, split between the safety of what she is leaving and the promise of what she is becoming. And Dana is standing in the middle, trying to pack a suitcase for a trip where the map hasn't been drawn yet.

  A few weeks ago, Dana told me something that stopped me cold. She said she was struggling because the woman who has to live with this choice isn't the woman who is making it. The Dana who lands in that new country is going to be different than the Dana standing here tonight. She'll be hardened by some things, softened by others. She'll want different things.

  So, how do we judge if this is the "right" choice?

  If she goes and she loves it, she'll say it was worth it. But of course she will—she's the person who chose it. Her happiness is the result of the choice, not the proof of it.
  And if she goes and she struggles, she'll find a way to make sense of that, too. She'll say she learned, or she grew. Her misery won't prove it was wrong, because she'll have changed to fit the misery.

  The witness is disqualified. We cannot know if this is right until it's already done, and by then, the person judging it is someone new.

  I tell you this not to scare you, and certainly not to scare her. I tell you this because I think it's the only honest thing I can give you. We spend so much of our lives trying to make the "correct" decision, as if there's a grade waiting for us at the end. As if we can get it right.

  Dana, my gift to you tonight is permission to let that go.

  You are not going there to prove your parents wrong. You are not going there to prove the climbers right. You are not even going there to prove yourself right. You are going there to live. And the living of it is the only metric that matters.

  There is no verdict coming. There is no final exam where you find out if you made the right call. There is just Tuesday morning coffee in a language you're still learning. There is missing your brother's birthday. There is finding a new route up a wall you didn't know existed. There is calling your mother and hearing the worry in her voice, and calling me and telling me about the light in the sky.

  So, to the family: Hold her a little looser. She's not breaking the vase; she's pouring the water into a different cup.
  To the climbers: Hold her a little tighter. Remember that gravity still applies, even when you're flying.

  And to Dana: Don't pack any reassurance. You won't need it, and it takes up too much room. Pack the uncertainty. Take it with you. Let it be the thing that keeps you awake sometimes, and the thing that wakes you up in the morning. You don't need to know how this ends. You just need to be the one who is there when it happens.

  We love you. We'll be here when you call. And we'll be here if you come back.

  To Dana.
