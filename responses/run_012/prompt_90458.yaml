          *   Camp B: Climbing gym friends. Think she's finally living authentically.
      *   **Speaker:** Oldest friend, close to both camps. Dreading the speech.
      *   **Tone/Voice:** Plain, a little dry, affectionate, honest, not academic, no name-dropping thinkers/books.
      *   **Key Constraint:** Cannot promise happiness/success. Cannot validate one side over the other. Must acknowledge the uncertainty of the future self (the "witness is disqualified" concept).
      *   **Goal:** Give Dana something true to carry onto the plane, not reassurance.
      *   **Length:** 4-6 minutes spoken (approx. 600-900 words at a moderate pace).

  2.  **Deconstruct the Core Conflict & Philosophy:**
      *   The prompt provides a profound philosophical dilemma: The "future self" who judges the decision is created *by* the decision. Therefore, their judgment is biased.
      *   *Family view:* Stability, known quantity, safety.
      *   *Climbers view:* Authenticity, risk, growth.
      *   *Speaker's view:* Both are right in their own language, but neither can predict the outcome. The validity of the choice doesn't depend on the outcome.
      *   *The "Gift":* Not "You'll be happy," but "You don't need to be right about this." Or "The uncertainty is the point."

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the room's tension without being awkward. Establish the relationship with Dana. Keep it dry but warm.
          *   *Idea:* Start with the weirdness of the room. Acknowledge I'm the bridge.
      *   **Addressing the Family:** Validate their love and fear. Don't dismiss their concern as controlling.
          *   *Idea:* They see what she's leaving. It *is* a good life. They aren't wrong to worry.
      *   **Addressing the Climbers:** Validate their excitement. Don't dismiss their view as reckless.
          *   *Idea:* They see who she's becoming. They aren't wrong to cheer.
      *   **The Core Argument (The "Witness"):** Translate the prompt's philosophical insight into plain speech. No jargon.
          *   *Idea:* We want to know if it's the "right" choice. But the person who knows is the future Dana. And she'll be different. So we can't know now.
      *   **The Turn/Gift:** What does Dana take with her?
          *   *Idea:* Permission to not know. The value isn't the destination, it's the act of choosing.
      *   **Closing:** A toast. Simple, direct.

