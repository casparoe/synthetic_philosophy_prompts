      *   *The Gift:* "Take the uncertainty."

  6.  **Writing the Speech (incorporating constraints):**

      *   *Start:* Stand up, glass in hand. Acknowledge the tension lightly.
      *   *Middle:* Talk to the parents first (hardest part). Validate the "good life" she's leaving. Then talk to the climbers. Validate the "new life."
