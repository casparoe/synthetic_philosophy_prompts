      *   *Terminology Trap:* "Time Preference" often gets conflated. Is it impatience (psychological)? Is it ethical weighting? Is it market return?
      *   *Weitzman Effect:* Uncertainty about the discount rate implies the lowest possible rate dominates in the long run (hyperbolic discounting).
      *   *Non-Identity Problem:* Policies change who is born. Does this matter for welfare analysis?

