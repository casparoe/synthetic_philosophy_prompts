prompt: |-
  so my flatmate and I have been going round and round about mental causation ever since I made him read I Am a Strange Loop (I think its the right book -- Hofstadter, the careenium and the simmballs). As I remember the setup: there's this giant arena, the careenium, full of trillions of tiny marbles that zip around and bounce off each other with wierd rules. Out of that swarm you get these bigger ball-like structures -- simmballs, a pun on "symbols" -- that behave like solid balls in their own right. One simmball can smack into another and send it spinning, and you can describe the whole exchange at the simmball level without ever mentioning marbles. Hofstadter's point, as my flatmate reads it, is that the simmball level is a real causal level: the symbols push the substrate around, and they manage it without breaking physics, because all the pushing is also just marbles pushing marbles. My flatmate takes this as vindicating mental causation -- your thoughts really do cause your actions, and reductionism can't threaten that, because the simmball story and the marble story are the same thing seen twice. My gut says he's extracting way more from the analogy than it can carry, but I can't articulate why.

  Can you audit it for me? I want the correspondence spelled out -- what plays the marble, what plays the simmball, what plays the arena's special collision rules, what plays the fact that no observer can track trillions of collisions at once -- and then where the mapping breaks. In particular: does the careenium actually show that content or meaning does causal work, or only that some coarse-grained structures do? Does anything actually go "down" in the downward-causation sense, or is that just a redescription? And does it matter that someone built the arena so that a clean simmball level falls out of it -- does that smuggle in something real brains don't have? Then tell me whether my flatmate's conclusion survives: thoughts really push the substrate around, and reductionism is no threat. Or does it only survive in some watered-down form, and if so what's the strongest version of it that does survive? If there's a better analogy for what he actually wants -- something where the high level is genuinely about something, not just structurally robust -- give me that instead, and say what it buys and what it costs. And please don't just hand me a list of differnces; tell me which ones matter for the use he's putting the analogy to and which are cosmetic.
