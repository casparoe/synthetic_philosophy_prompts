      *   *Actually, the "Traffic Jam" is best for "Downward Causation" without magic.* The jam (high level) causes you to brake (low level action).
      *   *Refinement:* The flatmate wants *mental* causation (meaning). The Careenium fails at *meaning*. The **Evolutionary Niche** analogy is better. An organism acts *because* it represents food.
      *   *Let's propose the "Map-Territory" relationship mediated by a Navigator.*
