answer: |-
  To: The Classification Committee, Northmark Institute of Health
  From: The Chair
  Date: Monday, 20 October 2025
  Subject: Opinion and Recommendation regarding Post-Infectious Attentional Fatigue

  Colleagues,

  We convene this Thursday to vote on the admission of Post-Infectious Attentional Fatigue (PIAF). This is not a routine matter. The reflexivity review has returned a split rating that strikes at the heart of the rule we adopted two years ago. We are forced to decide not only on a diagnostic category but on the coherence of the framework we use to validate them. Below I set out my recommendation on the category, the rule, and the publication of our internal ratings, followed by the philosophical reasoning underpinning this advice.

  **Recommendation on the Category**

  I recommend that we **defer admission** of PIAF for a period of twenty-four months.

  We should not admit the category now, nor should we reject it outright. Admission is precluded by the doubling of reported prevalence in the general population since the proposal appeared as a preprint. This correlates strongly with the review's finding that the online subgroup is Loop-Generative. To admit PIAF now would be to certify a feedback loop that we already know is active. However, rejection ignores the primary care subgroup, rated Loop-Neutral, who report genuine distress without apparent exposure to the criteria.

  During the deferral period, we must commission a longitudinal study of the primary care cohort. Crucially, this study must proceed without publicising the label "PIAF" outside the research team. We need to know if the symptoms in this group stabilise, remit, or evolve without the amplification of official status. If, after two years, the prevalence in this unaware cohort remains stable while online reports continue to surge, we will have evidence that distinct phenomena are being conflated. If prevalence doubles again regardless of admission, we must acknowledge that the condition is inextricably linked to its description.

  **Recommendation on the Rule**

  I recommend we **keep the rule but amend the guidance**.

  The current rule presupposes that a category belongs to a single band. The PIAF case demonstrates that looping effects can be population-specific. The guidance must be amended to state that where a category is Loop-Generative in any significant subgroup likely to encounter the manual, the automatic bar applies. We cannot admit a category that is generative in the public sphere even if it is neutral in a controlled clinical setting, because the manual's authority cannot be contained within the clinic.

  However, we must also amend the preamble to acknowledge the limitation raised by our colleague (Member C). We must recognise that "Loop-Neutral" is an asymptotic ideal rather than a guaranteed state. The rule should be framed as a tool for risk management regarding substantial amplification, not as a metaphysical claim about the independence of disorders.

  **Publication of the Banding**

  I recommend that the **reflexivity banding itself remains unpublished**.

  Publishing the rating "Loop-Generative" is itself a generative act. It signals to patient communities that the Institute recognises the condition as spreading, which may validate the identity and encourage further reporting. Transparency is a virtue, but not when it functions as the very mechanism we seek to regulate. We will publish the decision to defer and the data regarding prevalence doubling, but the technical classification of the loop effect must remain an internal regulatory instrument. To do otherwise would be to light a fuse while claiming to study the explosion.

  **The Strongest Case on the Losing Side**

  I anticipate that Member C will oppose this recommendation. Their argument is the most philosophically robust and the hardest to refute. They argue that the first band, Loop-Neutral, is empty. Their claim is that all classification of human beings changes how those beings understand themselves. To classify is to offer a vocabulary; to offer a vocabulary is to change thought; to change thought is to change behaviour.

  Therefore, Member C argues, our rule smuggles in an unexamined essentialism. It assumes that a "genuine" disorder is the sort of thing that exists independently of our descriptions of it, like a virus or a fracture. But psychiatric and functional categories are not fractures. They are ways of making sense of suffering. By demanding that a category be Neutral or merely Responsive, we are demanding that human kinds behave like natural kinds. Member C contends that we should not build this impossibility into our admission criteria. If all categories loop, then the rule effectively bans all new categories, or else it forces us to lie about the looping. They argue we should admit PIAF for research precisely because the looping is inevitable, and we should study the loop rather than pretending we can prevent it.

  **Philosophical Distinction and Its Work**

  To answer this, I must clarify the distinction doing the work in my recommendation. It is the difference between **tracking** and **making**.

  When we classify a natural kind, such as a specific strain of bacteria, we are tracking something that exists regardless of our label. The bacteria do not change their behaviour because we named them. When we classify a human kind, such as a diagnostic category, we risk making something new. The classification provides a script that people can adopt.

  Member C is correct that pure tracking is impossible in psychiatry. We cannot fully separate the suffering from the story told about the suffering. However, there is a pragmatic distinction between *negligible* looping and *substantial* looping. This is where the distinction does real work. If the act of classification changes the vocabulary people use (Loop-Responsive) but does not alter the underlying prevalence or symptom profile, we can still conduct meaningful science. We can measure outcomes. But if the classification substantially amplifies the condition (Loop-Generative), we lose the ability to distinguish the disease from the diagnosis. We can no longer tell if a treatment works or if it merely changes how people report symptoms to fit the category.

  My recommendation relies on the claim that while perfect neutrality is impossible, substantial generativity is avoidable and must be avoided for the manual to retain scientific utility. We are not legislating against human nature; we are legislating against the corruption of our data. If we admit a category that produces its own instances, we are not mapping the terrain; we are filling in the blank spaces with ink and calling it geography.

  Member C argues that this distinction is false because the ink always changes the map. I argue that while the ink always marks the paper, it does not always redraw the mountains. In the primary care subgroup, the symptoms appear to exist prior to the label. In the online subgroup, the label appears to create the symptoms. Our duty is to distinguish the mountains from the ink, even if we acknowledge that our pens are never entirely dry.

  **Conclusion**

  We face a choice between validating a potential feedback loop or investigating a potential disorder under controlled conditions. Deferral protects the integrity of the manual without abandoning the patients in the primary care cohort. It acknowledges the reality of looping effects without surrendering to the claim that all reality is constructed by them.

  I ask that you review this opinion before Thursday's session. We must be prepared to vote not just on a name, but on the kind of science we intend to practise.

  Chair, Classification Committee
  Northmark Institute of Health
