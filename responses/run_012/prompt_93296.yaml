answer: |-
  1. "Short answer"
  Yes, there is a technical name for the knowledge gap, but it doesn't fully explain the action gap you're seeing. The closest fit is "Common Knowledge" from game theory, which describes the shift from everyone knowing a fact to everyone knowing that everyone knows it. However, this term explains the synchronization of the group, not why that synchronization leads to change in some cases but not others. Your restaurant example proves that common knowledge alone is insufficient without the authority to act.

  2. "Closest existing terms"
  **Common Knowledge:** In game theory, this distinguishes "everyone knows" from "everyone knows that everyone knows." A public announcement creates this infinite recursion, synchronizing the group's mental state. This fits your "saying it out loud" mechanic perfectly, as it moves the fact from mutual to common knowledge. However, this term describes an information state, not a behavioral outcome. It explains why the group is suddenly aligned, but it fails to explain why alignment leads to fixing the kitchen but not changing the restaurant. It describes the switch, not the engine that drives the change after the switch is flipped. It captures the synchronization but misses the motivation required to act on that synchronization.

  **Pluralistic Ignorance:** This occurs when group members privately reject a norm but incorrectly assume others accept it, leading to public conformity. It fits your relationship case where both partners suspect the other wants to stay. However, you explicitly stated your team already knows everyone else knows the truth. Pluralistic ignorance requires a misunderstanding of others' private beliefs. Since your team knows the deadline is impossible, this term fails your specific constraint that the secret wasn't secret. It explains hiding feelings, not ignoring facts known by all. It addresses the fear of being the outlier, but your scenario involves a group of outliers waiting for a signal.

  **Schelling Point:** A focal point people use to coordinate actions without communication, based on salience. Speaking out makes the problem the salient focal point for the group's attention. This explains why the group suddenly focuses on the issue together. However, a focal point only works if there is a clear alternative action to coordinate toward. In the restaurant case, "hating the place" is the focal point, but there is no coordinated alternative action like "going elsewhere." It explains the alignment, not the outcome. Without a clear next step, the focal point remains a gathering spot for complaints rather than a launchpad for change.

  3. "What saying it out loud actually does"
  You are correct that this isn't about knowledge. It is about social cost and accountability. When a fact is known but unspoken, ignoring it is the default social contract. Everyone participates in a polite fiction that allows inaction to remain blameless. The moment one person speaks the fact aloud, they break that contract and absorb the social risk of confrontation. This changes the status of inaction from "passive default" to "active choice." Now that the problem is publicly ratified, ignoring it requires justification. In your work and relationship cases, speaking creates a mandate for a decision that was previously avoidable. It grants permission for others to act without fear of being the first to rock the boat. The speaker pays the "awkwardness tax," freeing the rest of the group to align behind them. The restaurant case differs because complaining there carries no risk, but also grants no authority. There is no decision-maker in the group empowered to change the reservation. Speaking there changes nothing because no one has the agency to act on the new common knowledge. The flip happens only when speech converts shared knowledge into shared liability. Without a path to resolution, the statement is just noise. The mechanism requires both common knowledge and the capacity for coordinated agency to function. Essentially, the statement acts as a key that unlocks a door everyone was standing in front of. Until the key is turned, standing there is safe. Once turned, staying outside becomes a deliberate refusal to enter. This shift in the moral weight of inaction is what forces the movement you observe in your team and relationship examples.

  4. "The case that doesn't fit"
  The restaurant case rules out the idea that common knowledge alone triggers action. It demonstrates that awareness is insufficient without authority or a viable alternative. In the work and relationship cases, speaking initiates a decision process that already existed but was stalled. There is a binary outcome possible: move the deadline or end the relationship. With the restaurant, there is no clear decision mechanism. Complaining is venting, not governing. This distinction proves that the "flip" isn't just about synchronizing information. It requires a path from recognition to resolution. If the group lacks the power to change the status quo, public speech remains just noise. Therefore, the mechanism requires both common knowledge and the capacity for coordinated agency. Without the ability to act, the public statement is just shared commiseration. It shows that synchronization without authority is just noise.

  5. "If nothing fits, coin it"
  **Name:** The Permission Threshold

  **Definition:** The social boundary crossed when stating a known fact makes acting on it permissible for the group by transferring the cost of inaction to the authority.

  **Boundary Cases:**
  *   **Clearly In:** An employee telling the boss the deadline is impossible, forcing a reschedule.
  *   **Clearly Out:** Friends complaining about the weather while continuing to stand in the rain.
  *   **Undecided:** A junior staff member pointing out a safety violation to peers instead of a manager.
