answer: |-
  Here's the breakdown. I'm treating this as a peer review meant to save you from embarrassment in front of your advisor. I'm going to be direct.

  ### 1. Where are you getting Sidgwick wrong?

  You're mostly solid on the big picture, but you're risking a caricature of Sidgwick's intent regarding the "compartment wall."

  You argue the wall between his ethics and his psychical research is thinner than it looks. That's defensible (and supported by scholars like Bart Schultz), but you need to be careful not to imply Sidgwick thought the ethics *depended* on the research in a foundational sense. Sidgwick maintained that *The Methods of Ethics* stands on its own rational grounds. The psychical research was about the *sanction* of morality, not the *validity* of it.

  If you argue that Sidgwick thought his utilitarianism was *false* without evidence of survival, you're overstating it. He thought it was practically irrational or psychologically unsustainable without it. He famously said that if the dualism of practical reason couldn't be resolved, he couldn't see how life was worth living. That's an existential stakes claim, not a logical validity claim. Make sure you distinguish between "ethics collapses without immortality" (too strong) and "the rationality of being ethical collapses without immortality" (accurate).

  Also, watch the timeline nuance. He resigned his fellowship in 1869 over the Thirty-Nine Articles, but his involvement with the SPR peaked later. Don't let the narrative slide into "he lost faith so he grabbed at ghosts." It was more "he lost faith, kept the ethics, realized the ethics had a hole, and tried to plug it empirically."

  ### 2. Is the "under-delivers or self-destructs" dilemma actually a dilemma?

  This is the strongest part of your draft, but there's a potential escape hatch you need to address before your advisor points it out.

  **Horn 1 (Survival $\neq$ Governance):** You're right. Evidence that consciousness persists doesn't prove justice exists. A ghost can be a jerk forever. Sidgwick knew this. He wasn't just looking for survival; he was looking for evidence of *telepathy* or *spirit guidance* that implied a moral order. You should acknowledge that Sidgwick knew survival alone wasn't enough; he needed evidence of a *system*.

  **Horn 2 (Governance $\rightarrow$ Egoism):** This is the killer point. If virtue is rewarded in the long run, isn't being virtuous just enlightened self-interest?
  *The Escape Hatch:* Sidgwick would argue that the *criterion* of right action remains the universal good, even if the *motive* converges with self-interest. He wants the interests to coincide, not the definitions to collapse.
  *Your Counter:* You need to press harder here. If the only reason it is rational for me to be moral is that I get paid off later, haven't we reduced the obligation to prudence? Sidgwick wants to say "It is right to maximize general good, and luckily that helps me too." You're arguing that if the "luckily" becomes a guaranteed cosmic law, the "right" becomes subordinate to the "helps me."
  *Verdict:* It is a real dilemma, but you need to clarify that the collapse happens in the *rational justification for the agent*, not necessarily in the *definition of the good*. If you make that distinction, the argument tightens up significantly.

  ### 3. Does the Kant comparison earn its keep?

  Yes, but only if you sharpen the distinction between "postulate" and "hypothesis."

  Kant's postulates of practical reason (God, Freedom, Immortality) are necessary conditions for the *conceivability* of the Highest Good. They are transcendental. He doesn't look for evidence; he argues you can't make sense of moral duty without assuming them.

  Sidgwick turns this into an empirical hypothesis. He wants data.
  *Why this matters:* Kant insulates morality from science. If science disproves immortality, Kant's ethics survive (because the postulate is a requirement of reason, not fact). Sidgwick exposes morality to science. If the SPR fails (which it did), Sidgwick's solution to the dualism fails.
  *The Trap:* Don't make Kant sound like he's just guessing either. His postulates are rational necessities. Sidgwick's are empirical gambles. The contrast highlights Sidgwick's vulnerability. Keep the comparison, but frame it as "Transcendental Security vs. Empirical Risk." That's worth a paragraph.

  ### 4. Is this interesting or just clever?

  It's interesting. Here's why:

  "Clever" papers usually play semantic games or find obscure connections that don't matter. "Interesting" papers expose structural weaknesses in a major philosophical system.

  You're arguing that Sidgwick's attempt to save secular morality from religious collapse actually reintroduces a form of theological egoism that undermines the very morality he's trying to save. That's a substantive claim about the stability of utilitarianism. If you're right, Sidgwick's project is self-undermining. That's not just clever; it's a genuine contribution to the interpretation of his work.

  However, it tips into "clever" territory if you suggest Sidgwick was naive about this. He wasn't naive. He was desperate. Frame it as a tragedy of his system rather than a blunder. He saw the risk and took it because the alternative (the dualism remains unresolved) was worse.

  ### Summary of Fixes

  1.  **Clarify the Dependence:** Ensure you argue that psychical research supports the *rationality* of ethics, not the *truth* of ethical propositions.
  2.  **Sharpen the Dilemma:** Acknowledge the escape hatch (criterion vs. motive) and explain why you think it still fails (it reduces moral obligation to prudential advice).
  3.  **Refine Kant:** Focus on the insulation from empirical disproof. Kant is safe from science; Sidgwick is not.
  4.  **Tone Down the Eccentricity:** Don't spend too much time knocking down the "quaint Victorian" strawman. You've already dismissed it in the intro. Focus on the philosophical cost of the research.

  This is a solid skeleton. If you flesh this out without overclaiming Sidgwick's dependence on the SPR, you'll have a strong paper. Go for it.
