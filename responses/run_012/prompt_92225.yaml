      *   *Advice:* Refuse Dissolution. Commission Alt. *Reason:* The Incumbent has no claim to majority. The Alt has a *prima facie* claim to confidence. Supply is a matter for the House to determine, not the HoS to pre-empt (echoing Case 5's reluctance to pre-judge legislative outcomes, and Case 6's "let the house meet").
      *   *Risk:* If Alt fails budget, we are back to square one. But that's better than granting dissolution to a defeated PM when an alternative exists to be tested.

      *Wait, one more check:* Case 1 says "PM lost confidence vote... commission alternative." Case 6 says "House not met... commission alternative."
      *   Live Case: House not met. Incumbent claims Alt will fail.
      *   If we follow Case 6, we let the House meet.
