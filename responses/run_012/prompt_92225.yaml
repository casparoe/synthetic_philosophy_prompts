      *   *Decision:* The strongest thread is "Let the House speak if there is a plausible alternative." The Incumbent has no majority. The Alt has a majority on confidence. Supply is a separate vote. Let them try. If they fail supply, *then* they resign and ask for dissolution. Don't grant dissolution to the Incumbent who already lost the election.
      *   *Closest Analog:* Case 6.
