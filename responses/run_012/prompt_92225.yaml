  6.  **Developing the Recommendation:**
      *   *Best Guess:* Refuse Dissolution. Commission the Alternative *conditionally* or let the House meet.
      *   *Wait, looking closer at the "No Budget" constraint.* If a government cannot pass a budget, it cannot govern. In Westminster, failure of supply is a resignation matter.
