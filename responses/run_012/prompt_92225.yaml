      *   *Why?* Because Dissolution is the nuclear option. Case 3 shows reluctance to have elections if not necessary. Case 6 shows reluctance to have *another* election 3 weeks after one. This is 4 months after.
      *   *Principle:* The House must be given the chance to determine viability before the people are recalled, unless viability is impossible.
      *   *Dissent:* The dissenter (from Case 4) argues Crown shouldn't judge "viability" or "purpose." They would say: PM asks dissolution, it's lawful, grant it. Or, PM lost mandate, but if Alt is shaky, election is better.

  7.  **Structuring the Response:**
