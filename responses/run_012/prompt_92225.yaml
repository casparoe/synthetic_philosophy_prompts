      *   *Dissenter:* Will argue that a government that can't pass a budget is no government at all, and prolonging the agony harms the state. Grant dissolution.

  9.  **Final Polish:** Ensure tone is appropriate for a senior colleague advising a junior doctoral student. No citations. Clear logic. Adhere to all constraints. (Check: Did I brainstorm rules first? Yes. Did I commit? Yes. Did I cover the dissenter? Yes.)

