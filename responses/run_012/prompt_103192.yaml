      *   **Tone:** Straightforward, bureaucratic, deadpan. No narrator, no winks, no explicit jokes. It must look exactly like a real voter guide.
      *   **Satirical Target:** The pretense of the voter guide format itself (deliberation via summary, fiscal impact, pro/con arguments), the impossibility of pricing out such measures, the circular logic of the measure's passage, and the irony that supporters might fail the test.
      *   **Length:** 700-800 words.
      *   **Audience:** Someone who has worked a ballot campaign should wince/laugh; someone who hasn't should find it weirdly plausible.
      *   **Ending:** No tidy moral. Let the reader decide.

  2.  **Deconstruct the Voter Guide Format:**
      *   **Ballot Title/Question:** Needs to be legalistic, often biased or neutral depending on state laws (usually AG writes it).
      *   **Summary:** Brief explanation of what it does.
      *   **Fiscal Impact:** Often "unknown" or "minimal" for constitutional amendments, but needs to sound bureaucratic.
      *   **Argument in Favor:** Signed by a committee. Needs to sound persuasive but hint at the irony.
      *   **Argument Against:** Signed by a committee. Needs to highlight the logistical nightmare and the circularity.
      *   **Rebuttals:** Short responses to the opposing side.

  3.  **Drafting - Section by Section:**

      *   **Title/Question:** Needs to sound dry. "Requirement for Voter Competency Verification on Ballot Measures."
      *   **Summary:** Explain the test, the panel, the timing (at polling place), and the crucial detail: this measure passes by simple majority of *all* votes cast, regardless of test status (since the test doesn't exist yet).
      *   **Fiscal Impact:** This is where the satire on cost estimation shines. How much does a test cost? Administering it? Printing it? Legal challenges? "Unknown significant costs."
      *   **Argument in Favor:** Focus on "informed electorate," "responsibility," "quality of governance." Use buzzwords. Avoid acknowledging the irony too directly, but hint at the seriousness.
      *   **Argument Against:** Focus on "barrier to voting," "subjective grading," "cost," and the logical paradox (who votes on this?).
      *   **Rebuttals:** Standard sniping. "Elitist" vs. "Chaotic."

  4.  **Refining the Irony (The "Fast One"):**
      *   The prompt specifies: "The test would be written by a panel appointed by the attorney general's office. And yes, the amendment itself would go on the ballot and be voted on by everyone who hasn't passed the test yet."
