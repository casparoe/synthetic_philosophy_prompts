      *   I need the arguments to sound like real campaign copy (slightly inflated, slightly desperate).
      *   *Crucial:* The text must not acknowledge the joke. It must treat the measure as a serious proposal.

  5.  **Drafting - Word Count Check:**
      *   Need to hit 700-800 words. This means expanding the arguments and fiscal impact slightly to ensure bulk without fluff.

  6.  **Writing - Iteration 1 (Mental Outline):**
      *   Header: PROPOSITION 12.
