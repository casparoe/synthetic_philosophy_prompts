answer: |-
  **PROPOSITION 12**
  **VOTER COMPETENCY VERIFICATION ACT**

  **BALLOT TITLE:**
  Requires Civics and Reading Proficiency Test for Ballot Measure Voting.

  **ATTORNEY GENERAL SUMMARY:**
  This constitutional amendment requires any voter casting a ballot on state propositions to first complete a short civics and reading comprehension test administered at the polling place. Votes on propositions shall only be counted if the voter achieves a passing score. The test content shall be developed by a panel appointed by the Attorney General. Notwithstanding the competency requirement established herein, this measure shall be tallied using all ballots cast by registered voters, regardless of test performance, as the verification system is not yet operational. A yes vote supports requiring voters to pass a test before voting on propositions. A no vote opposes this requirement.

  **FISCAL IMPACT:**
  Unknown significant costs to state and local governments. Costs associated with developing, printing, and administering competency tests at all polling locations cannot be determined at this time. Expenses will depend on the number of voters required to test, the duration of testing, and the need for additional poll workers to proctor exams. Potential litigation costs regarding test validity and equal protection challenges are indeterminable. Savings from potential reduction in ballot measure implementation errors are unknown.

  **ARGUMENT IN FAVOR OF PROPOSITION 12:**
  Our democracy functions best when voters understand the laws they are enacting. Too often, complex ballot measures are decided based on misleading advertising rather than factual understanding of the text. Proposition 12 ensures that every vote counted on a proposition is an informed vote. This is not about restricting access; it is about ensuring competence. The test required is basic, covering fundamental civics and reading skills necessary to comprehend the ballot language itself.

  By requiring a minimal standard of proficiency, we reduce the risk of unintended constitutional changes driven by confusion. Other professions require licensing exams to practice; voting on state law should require a baseline knowledge of how that law functions. This measure empowers citizens to take ownership of the legislative process. It encourages civic education and ensures that ballot measures reflect the will of an engaged populace rather than the momentum of campaign spending. Vote Yes for responsible governance.

  *Citizens for Electoral Integrity*

  **ARGUMENT AGAINST PROPOSITION 12:**
  Proposition 12 creates a bureaucratic barrier to voting that grants the Attorney General excessive power over the electoral process. The test content is written by a panel appointed by the very office responsible for defending the measure in court. This creates an inherent conflict of interest and opens the door for subjective grading standards. Who decides what constitutes a passing score? Who grades the tests at 8 PM on Election Day?

  Furthermore, the fiscal impact is unknowable. Local counties will bear the burden of administering these exams without guaranteed state funding. This will lead to longer lines, confused voters, and discarded ballots. Most critically, this measure establishes a precedent where the right to vote is conditional rather than fundamental. It shifts power from the voter to the state administrator. Do not allow a government panel to decide if your voice counts. Vote No to protect universal suffrage.

  *Coalition for Universal Suffrage*

  **REBUTTAL TO ARGUMENT IN FAVOR:**
  The argument for Proposition 12 claims this is about "competence," but it is actually about control. The authors suggest that voters cannot be trusted to read ballot language without a government proctor verifying their skills. This is elitist and unnecessary. Voters already sign affidavits confirming their identity; now you must prove your intellect to a state-appointed panel? The claim that this saves money is speculative. The cost of administering tests will far outweigh any hypothetical savings from "better" laws. Do not trade your right to vote for a promise of efficiency.

  **REBUTTAL TO ARGUMENT AGAINST:**
  The opposition claims this grants too much power to the Attorney General, yet the Attorney General already writes the summaries you are reading right now. This measure simply extends that responsibility to ensure the summary is understood. The claim of longer lines ignores the simplicity of the test; it is designed to be quick. The real cost is the cost of ignorance. When voters pass measures they do not understand, everyone pays for the legal and fiscal consequences later. This is a minimal inconvenience for a maximal improvement in legislative quality. Trust your fellow citizens to study, but ensure they have the tools to understand what they are signing.

