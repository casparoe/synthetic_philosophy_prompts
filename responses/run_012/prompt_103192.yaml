  7.  **Writing - Iteration 2 (Focusing on Tone):**
      *   Use legalese. "Shall amend Section X..."
      *   Fiscal impact needs to sound helpless. "Cannot be determined."
      *   Arguments need signatures like "Citizens for Responsible Ballots" vs. "Coalition for Universal Suffrage."
      *   Make sure the circular logic is present in the summary but stated plainly.

  8.  **Drafting - Execution (incorporating constraints):**
