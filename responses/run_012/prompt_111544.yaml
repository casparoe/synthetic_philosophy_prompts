      *   *Actually, the safest scientific advice:* Acknowledge the uncertainty. Recommend the Director treat the 0.7 probability as the operational baseline for *supply switching* (which is reversible/operational) but weigh the *public advisory* carefully against the 0.15 counter-argument.
