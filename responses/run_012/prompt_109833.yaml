answer: |-
  Here is the philosophical anatomy of the practice you are observing.

  ### 1. Brainstorming: Independence and Truth

  To understand the tension, we must first disentangle what "independence" and "truth" are doing in this context.

  **What "CH is independent of ZFC" could mean:**
  *   **Syntactic:** There is no derivation of CH or $\neg$CH from ZFC. (This is the minimal, indisputable fact.)
  *   **Semantic:** The class of models of ZFC splits into those satisfying CH and those satisfying $\neg$CH.
  *   **Epistemic:** ZFC does not contain enough information to decide the size of the continuum.
  *   **Ontological (Indeterminacy):** There is no fact of the matter about the size of the continuum; the concept "set" is inherently vague on this point.
  *   **Ontological (Ignorance):** There is a fact of the matter, but ZFC is too weak to access it.

  **Views of Set-Theoretic Truth on the Table:**
  *   **Universism:** There is a single, intended cumulative hierarchy $V$. Every sentence has a determinate truth value in $V$, even if ZFC cannot prove it.
  *   **Radical Multiversism:** There is no single $V$. There are only models. "Truth" is always relative to a model. CH is true in some universes, false in others, with no privilege granted to either.
  *   **Moderate Multiversism (or "Preferred Model" View):** There are many models, but some are "richer," "fuller," or "more natural." We seek axioms that describe the "best" models.
  *   **Formalism:** Set theory is the study of the consequences of formal rules. "Truth" is a shorthand for "provability."
  *   **If-Thenism (Structuralism):** Set theory is about what holds in *any* structure satisfying ZFC.

  ### 2. The Philosophical Anatomy of the Practice

  The behavior you describe—symmetric exploration of CH and $\neg$CH, followed by asymmetric endorsement of Forcing Axioms—is not incoherent. It reflects a specific, stable methodological stance. Let's call it **Axiomatic Realism with Epistemic Fallibilism**.

  **The Presuppositions:**
  1.  **The Domain is Fixed, The Description is Incomplete:** The practice presupposes there is a subject matter (the universe of sets) that exists prior to our axioms. ZFC is viewed as a partial description of this domain, not a definition that creates it. If ZFC were a definition, independence would mean ambiguity in the definition. Instead, independence is treated as a gap in our knowledge of the domain.
  2.  **Truth is Maximal Consistency + Fruitfulness:** When set theorists say a forcing axiom like Martin's Maximum (MM) is "true," they are not claiming to have perceived $V$ directly. They are claiming that MM captures more "generic" existence than ZFC alone. The practice presupposes that a "good" axiom is one that settles questions while preserving consistency with large cardinals and yielding a rich structure theory.
  3.  **Exploration Precedes Justification:** The symmetric treatment of CH and $\neg$CH is an *exploratory* phase. It presupposes that we cannot know which axiom is "true" until we understand the consequences of both. This rules out dogmatism. However, the eventual preference for MM reveals that the exploration is not aimless; it is guided by a tacit criterion of "set-theoretic richness."
  4.  **Forcing is a Tool, Not an Ontological Multiplier:** When they force to prove independence, they are not necessarily claiming "this generic extension is just as real as the ground model." They are using forcing as a consistency proof technique. The ground model is often treated as the "real" one for the sake of the argument, while the extension is a "possible" one used to bound what is provable.

  **What is the Ontology?**
  The practice does not strictly require a Unique Universe, but it *acts* as if there is a **Regulative Ideal** of a Universe.
  *   It is not **Radical Multiversism**, because they speak of MM as "true" simpliciter, not "true in $V^{MM}$."
  *   It is not **Strict Universism**, because they spend years studying $\neg$CH models without treating them as "mistakes."
  *   It fits best with a **Penultimate Realism**: There is a target $V$, we haven't hit it yet, but we can rank our approximations. CH is a "thin" axiom; MM is a "fat" axiom. The practice presupposes that the real universe is likely "fat."

  ### 3. What the Practice Rules Out

  This routine quietly excludes several philosophical positions, even if the practitioners don't realize it.

  *   **Flat-Footed Formalism:** A formalist cannot say MM is "true." They can only say "MM is consistent relative to ZFC + Large Cardinals." The moment a set therapist says, "MM is the correct axiom," they have left formalism. They are making a claim about the subject matter, not the syntax.
  *   **Radical Multiversism (Hamkins-style):** If every model is equally legitimate, there is no sense in saying MM is "true" and CH is "independent." You would simply say "CH holds here, MM holds there." The search for *new axioms* implies the current multiverse is deficient and needs narrowing, not just cataloging.
  *   **Conceptual Structuralism:** If set theory were purely about the structure of *any* ZFC model, the specific value of the continuum wouldn't matter. The intense focus on settling the continuum suggests they care about *which* structure is the intended one, not just structural relationships.
  *   **Dogmatic Platonism:** If they believed they already knew the truth (e.g., "CH is obviously false"), they wouldn't waste seminar time proving theorems from CH. The practice requires an openness to being wrong about the "real" universe.

  ### 4. Counterfactuals: Swapping the View

  If you changed the underlying philosophical commitment, the mathematical practice would have to change in specific, observable ways.

  **Scenario A: Flat-Footed Formalism**
  *   **Stop Saying:** "MM is true," "CH is false," "The continuum is $\aleph_2$."
  *   **Start Saying:** "MM is a fruitful extension," "CH is independent," "In theories extending ZFC + MM, the continuum is $\aleph_2$."
  *   **Change in Practice:** The motivation for research shifts. You stop looking for "justification" for axioms and start looking for "interesting consequences." The hierarchy of axioms becomes a taxonomy of formal systems, not a ladder toward truth. The seminar leader would be right to ban philosophy, but only because *all* talk of truth would be banned too.

  **Scenario B: Radical Multiversism**
  *   **Stop Saying:** "We need better axioms." (Why? The axioms we have describe perfectly good universes.)
  *   **Start Saying:** "Let's study the CH-universe and the MM-universe as distinct species."
  *   **Change in Practice:** The drive to *settle* CH disappears. Independence is not a problem to be solved; it is a feature to be exploited. Forcing isn't just a tool to prove independence; it is a method of universe generation. The concept of "the intended model" is abandoned entirely.

  **Scenario C: Strict Universism (Gödelian)**
  *   **Stop Saying:** "Let's assume $\neg$CH for this theorem." (Unless treated as a reductio or purely hypothetical.)
  *   **Start Saying:** "CH is either true or false. We must find which one."
  *   **Change in Practice:** Time spent on $\neg$CH would be viewed as time spent on "false" mathematics. The focus would shift entirely to inner models (like $L$) or specific candidate axioms that might decide CH, rather than exploring the landscape of both sides equally.

  ### 5. Requirements vs. Pairings

  It is crucial to distinguish what the mathematics *needs* versus what the culture *wears*.

  **What the Practice Strictly Requires:**
  *   **Consistency Proofs:** You must be able to show that adding the axiom doesn't break ZFC (usually via forcing or inner models).
  *   **Logical Deduction:** Theorems must follow from the axioms.
  *   **Intersubjective Agreement:** The community must agree on what counts as a valid proof.
  *   **Nothing else.** Strictly speaking, you can do the math without any ontological commitment. You can prove "If MM, then $\mathfrak{c} = \aleph_2$" without believing in MM or sets.

  **What is Paired (but Contingent):**
  *   **The "Truth" Talk:** Calling MM "true" is not required for the proofs. It is a motivational heuristic. It keeps the community focused on a unified project rather than fracturing into formal system specialists.
  *   **The Dismissal of Philosophy:** The seminar leader saying "that's philosophy, not math" is a boundary-policing move. It is required to maintain the *objective feel* of the proofs, but it is ironic because the *choice* of which axioms to study next is driven by philosophical intuitions (maximization, reflection, fairness).
  *   **The Preference for Forcing Axioms:** There is no logical reason MM is "better" than CH. It is a philosophical preference for "richness" over "minimality." This could change. If the community decided "minimality" was the virtue, they would embrace $V=L$ and call *that* true.

  ### Summary

  The practice you see is **Methodological Realism**.

  They act *as if* there is a single real universe to keep the project unified and directed. They act *as if* independence is a temporary ignorance to keep the research program alive (if independence were final, the game would be over). But they act *as if* multiple models are legitimate objects of study to ensure they don't miss the truth.

  When they say MM is "true," they are making a bet: they are betting that the "real" universe is the one that contains the most generic objects, not the one that is most constructible. When they dismiss philosophy, they are protecting the *proofs* from metaphysical skepticism, even while their *axiom choice* relies on metaphysical values.

  The tension bugs you because it *is* a tension. It is the friction between doing math (which requires definite steps) and doing foundational research (which questions the ground you stand on). The seminar leader wants you to ignore the ground and walk. The philosopher in you wants to check if the ground is solid. The set theorist knows the ground is shifting, but believes the walking is still possible.
