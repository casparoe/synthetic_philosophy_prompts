prompt: |-
  I've just started a new job as a legislative drafter, after ten years in litigation, and the transition has unsettled something I used to take for granted. In my first month I watched a court read a provision I would have sworn was unambiguous in a way that none of us in the drafting office had in mind, and I have since been told, more than once, that this is simply how it goes. The judges who do this are not careless; they are applying familiar tools. They refuse to give a statute its plain words when the result would be absurd or manifestly unintended, they correct what are plainly typographical errors in the enacted text, they read each provision so that none is rendered surplusage, and they consult a statute's title, findings, and preamble to fix what it is for. Each of these moves seems, on its face, to treat the enacted words as evidence of something else rather than as the law itself.

  I want to understand what theory of legislation this cluster of practices presupposes. Does it commit anyone who uses these tools to the view that a legislature is a single rational author with a coherent intention that the text merely expresses? If so, is that view defensible against the obvious objection that a statute is a bargain among factions and may have no intention at all? Or can these moves be reconstructed without the single-author picture, say as an account of what a reasonable reader would take the text to mean, or as a set of policy-based tiebreakers that operate only after the text has been found indeterminate? I would like the strict textualist alternative spelled out: which of these four moves it can keep, which it must abandon, and what would have to change in day-to-day judicial practice if it were adopted. Please also tell me where the practice is genuinely underdetermined, so that several incompatible theories of legislation would license exactly the same judicial behavior.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Profile:** A legislative drafter with 10 years of litigation experience. This means they understand legal argument, statutory construction, and the practical realities of law, but they are now on the *other side* of the process (writing vs. interpreting). They are intellectually sophisticated and looking for theoretical clarity, not just practical tips.
      *   **The Problem:** They are unsettled by the disconnect between drafting precision and judicial interpretation. They see judges using tools (avoiding absurdity, correcting typos, avoiding surplusage, using extrinsic aids) that seem to treat text as *evidence* of intent rather than the law itself.
      *   **The Core Question:** What theory of legislation underlies these judicial practices? Specifically:
          1.  Does it require a "single rational author" (intentionalism)?
          2.  Is that defensible against the "factional bargain" objection?
          3.  Can it be reconstructed (e.g., reasonable reader, policy tiebreakers)?
          4.  What is the strict textualist alternative (keep/abandon/change)?
          5.  Where is the practice underdetermined (theories converge on practice)?

  2.  **Deconstruct the Judicial Practices Mentioned:**
      *   *Absurdity Doctrine:* Ignoring plain meaning to avoid absurd results.
      *   *Scrivener's Error:* Correcting typos.
      *   *Surplusage Canon:* Reading so no word is wasted.
      *   *Extrinsic Aids:* Using titles, findings, preambles to fix purpose.

  3.  **Identify the Underlying Theories:**
      *   **Intentionalism/Purposivism:** The law is the will of the legislature. Text is the best evidence, but if text fails to capture the will (due to error or unforeseen absurdity), the will prevails. This often relies on the "reasonable legislature" fiction.
      *   **Textualism (New/Strict):** The law is the text enacted. Objective meaning, not subjective intent.
      *   **Pragmatism:** What works best for the legal system.

  4.  **Address the "Single Rational Author" Objection:**
      *   *The Objection:* Legislatures are multi-member bodies, often passing bills via compromise (Arrow's Impossibility Theorem applied to law). There is no single "intent."
      *   *The Defense (Intentionalist):* We construct a "reasonable legislature" as a normative fiction. It's not empirical; it's a rule of recognition.
      *   *The Reconstruction (Textualist/Reader-based):* It's not about *their* intent, but how a *reasonable reader* (judge/citizen) understands the language in context.

  5.  **Develop the Strict Textualist Alternative:**
      *   *Absurdity:* Most strict textualists (like Scalia initially, then Gorsuch) reject the "absurdity doctrine" or narrow it to "semantic absurdity" (nonsense) rather than "policy absurdity" (bad outcome).
      *   *Scrivener's Error:* Generally accepted but narrowly (obvious typo, clear correction).
      *   *Surplusage:* Accepted but weakened (sometimes redundancy is just caution).
      *   *Extrinsic Aids:* Rejected or heavily disfavored (text is the law; reports/titles are not enacted).

  6.  **Identify Areas of Underdetermination (Convergence):**
      *   Where do Intentionalists and Textualists agree?
      *   Contextual meaning (words depend on context).
      *   Technical terms of art.
      *   Clear errors (everyone fixes "United Sttes").
      *   Structure matters (both look at the whole act).

  7.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the user's shock. It's a classic "drafting vs. interpreting" tension. Validate their observation.
      *   *Section 1: The Theory Behind the Practices (Purposivism/Intentionalism).* Explain that the practices described are hallmarks of *Purposivism* (Hart & Sacks) or *Intentionalism*. They treat text as evidence of a purpose. Address the "Single Author" fiction. It *is* a fiction, but a necessary one for the system to function.
      *   *Section 2: Defending the Fiction.* How do theorists handle the "factional bargain" critique? (The "Reasonable Legislature" construct). Or shift to "Objective Intent" (what the text communicates).
      *   *Section 3: The Strict Textualist Alternative.* Go through the four moves one by one.
          *   Absurdity: Abandon (or narrow to semantic).
          *   Typos: Keep (but narrow).
          *   Surplusage: Keep (as a heuristic, not a command).
          *   Extrinsic Aids: Abandon (mostly).
          *   *Practice Change:* More focus on dictionary/corpus linguistics, less on legislative history.
      *   *Section 4: Underdetermination.* Where do they agree? Context, structure, idioms. This is crucial for the user to know they aren't always choosing between worlds.
      *   *Conclusion:* Summarize the philosophical shift. From "What did they mean?" to "What did they say?"

  8.  **Refining the Tone:**
      *   Needs to be professional, academic but accessible, respectful of the user's expertise.
      *   Avoid taking sides (don't say Textualism is *better*, just what it *is*).
      *   Ensure the distinction between "Old Textualism" (literalist) and "New Textualism" (contextual) is clear, as the user describes "New Textualist" adjacent practices (like avoiding surplusage) mixed with Purposivist ones (absurdity).

  9.  **Self-Correction/Nuance Check:**
      *   *Correction:* I need to be careful not to conflate Intentionalism and Purposivism. They are distinct but overlap in practice. The user describes *Purposivism* (Hart & Sacks style) more than pure Intentionalism.
      *   *Nuance:* The "Single Author" objection is famously associated with public choice theory (McNollgast). I should mention that.
      *   *Nuance:* Modern Textualism (Scalia/Breyer debates) allows for *some* context. It's not just "look at the dictionary." It's "ordinary meaning in context."
      *   *Specific Question:* The user asked about "reasonable reader" reconstruction. I need to explicitly address that (Objective Textualism).

  10. **Final Polish:** Check against the four specific moves listed in the prompt to ensure each is addressed in both the Purposivist and Textualist sections. (Absurdity, Typos, Surplusage, Extrinsic Aids).

  **(Self-Correction during drafting):** I initially thought about grouping Absurdity and Typos together. Better to keep them distinct as the user listed them distinctly. I need to make sure I explain *why* Textualists might keep one but drop the other. (Typos are about what the text *is*, Absurdity is about what the text *does*).

  11. **Final Structure:**
      *   Intro: Validating the experience.
      *   Theory 1: The Purposive/Intentionalist Framework (The "Single Author" fiction).
      *   The Objection & Reconstruction (Public Choice vs. Reasonable Reader).
      *   Theory 2: The Strict Textualist Alternative (The Breakdown of the 4 moves).
      *   Area of Convergence (Underdetermination).
      *   Closing thought for a drafter.

  12. **Execute.** (Proceed to generate response based on these thoughts).
answer: |-
  Welcome to the drafting office. What you are experiencing is the classic shock of moving from the *advocacy* of meaning to the *creation* of it. In litigation, you fought for the meaning that served your client; in drafting, you are trying to create meaning that survives the fight.

  The judicial practices you describe—avoiding absurdity, correcting errors, avoiding surplusage, and consulting extrinsic aids—belong to a specific family of interpretive theories. To answer your questions, we must distinguish between **Intentionalism**, **Purposivism**, and **Textualism**, and then look at where they converge.

  ### 1. The Theory Behind the Practices: Purposivism and the "Reasonable Legislature"

  The cluster of practices you observed presupposes a theory often labeled **Purposivism** (associated with the Legal Process School of Hart and Sacks) or **Soft Intentionalism**.

  **Does this commit judges to a "Single Rational Author"?**
  Yes, but usually as a *normative fiction* rather than an empirical claim.
  *   **The Empirical Reality:** As you noted, legislatures are multi-member bodies. Public Choice Theory (e.g., McNollgast) argues statutes are often coalitional bargains with no unified intent. A statute might be ambiguous *by design* to secure enough votes for passage.
  *   **The Judicial Fiction:** To make the law administrable, courts pretend the legislature is a "reasonable person" acting to achieve a coherent purpose. When a judge avoids an "absurd" result, they are not claiming to know the subjective minds of 535 legislators. They are asserting that a *reasonable legislature* would not have intended X.

  **Is this defensible?**
  *   **The Defense:** Proponents argue that without this fiction, the legal system collapses into literalism that defeats the rule of law. If a statute clearly aims to regulate "vehicles" but says "cars," and a judge applies it to bicycles because "bicycle" isn't in the text, the law becomes an instrument of chaos rather than governance. The fiction is a rule of recognition necessary for the system to function.
  *   **The Reconstruction:** Many modern theorists reconstruct these moves not as searching for *actual* intent, but as determining **objective communicative content**. On this view, the "absurdity doctrine" isn't about mind-reading; it's about language. If a text yields a result that no competent speaker of the language would recognize as a valid instruction, the text itself is arguably defective. The "single author" is replaced by the "reasonable reader."

  ### 2. The Strict Textualist Alternative

  Strict Textualism (often associated with Justice Scalia and the "New Textualists") rejects the idea that the law is the *intent* behind the text. The law *is* the text. If the text is clear, the inquiry ends, even if the result is "unintended."

  Here is how a strict textualist would handle the four moves you listed, and what would change in practice:

  | Judicial Move | Purposivist/Intentionalist Approach | Strict Textualist Approach | Practical Change if Adopted |
  | :--- | :--- | :--- | :--- |
  | **1. The Absurdity Doctrine** | **Keep.** If plain meaning leads to a result that is "manifestly unintended" or absurd, the court departs from the text to fulfill the purpose. | **Abandon (or Narrow).** Most strict textualists reject "policy absurdity." They only accept "semantic absurdity" (where the text makes no linguistic sense). If the text is clear but leads to a bad policy outcome, that is for the legislature to fix. | Judges would uphold statutes even when they produce harsh or seemingly irrational outcomes, provided the words are clear. This shifts the burden to Congress to amend. |
  | **2. Scrivener's Errors** | **Keep.** Courts correct obvious typos to align the text with the clear intent. | **Keep (with strict limits).** Textualists accept this, but only where the error is obvious on the face of the text (e.g., "United Sttes") and the correction is indisputable. They are wary of "correcting" text that is merely unwise. | Less willingness to "fix" ambiguous drafting errors. If a cross-reference is wrong but plausible, a textualist might follow the wrong reference because it is what was *enacted*. |
  | **3. Against Surplusage** | **Keep.** Every word must be given effect. If a reading makes a clause redundant, it is rejected. | **Keep (as a heuristic, not a command).** Textualists prefer readings that give effect to all words, but they acknowledge that legislators often write redundantly out of caution. | Courts would be less likely to strike down an interpretation just because it renders one clause repetitive. They would accept that Congress sometimes says the same thing twice to be sure. |
  | **4. Extrinsic Aids (Titles, Findings)** | **Keep.** These help identify the purpose to resolve ambiguity. | **Abandon (mostly).** Unenacted materials (committee reports, findings, titles) are not law. Only the enacted text counts. | Judges would stop citing legislative history or committee reports to resolve ambiguity. They would rely more on dictionaries, corpus linguistics, and the context of the surrounding statutory scheme. |

  **The Core Shift:**
  In your current office, you draft assuming the court will help you fix mistakes and align the law with its goal. Under strict textualism, you must draft assuming the court will hold you to the *exact words*, even if they fail to capture the goal. The "safety net" of judicial correction is removed.

  ### 3. Where Practice is Underdetermined (The Convergence Zone)

  You asked where several incompatible theories license the *same* behavior. This is crucial for your peace of mind. In roughly 80-90% of cases, Intentionalists, Purposivists, and Textualists reach the same result. This is because their theories converge on **contextual ordinary meaning.**

  **1. Contextual Meaning vs. Literal Meaning**
  *   **Theory A (Text):** Words mean what a reasonable speaker understands them to mean in context.
  *   **Theory B (Intent):** The legislature intended the words to mean what a reasonable speaker understands them to mean in context.
  *   **Convergence:** Both reject "literalism" (e.g., interpreting "no vehicles in the park" to include an ambulance in an emergency). Both agree that context defines meaning. You will see judges using the same tools (looking at surrounding sections, the structure of the act) regardless of their stated theory.

  **2. Terms of Art**
  *   **Theory A:** Legal terms have established technical meanings.
  *   **Theory B:** The legislature, being sophisticated, intended the technical meaning.
  *   **Convergence:** Both will interpret "hearsay" or "consideration" according to legal doctrine, not ordinary English.

  **3. Structural Inferences**
  *   **Theory A:** The structure of the statute informs the semantic meaning of the words.
  *   **Theory B:** The structure reveals the legislative plan.
  *   **Convergence:** Both will look at where a provision is placed in the code to determine its scope.

  **The "Underdetermined" Zone:**
  The divergence only happens in the **hard cases**—specifically where the *semantic meaning* is clear but the *policy outcome* is terrible, or where the *text* conflicts with the *history*.
  *   *Example:* A statute says "No person shall sell fruit." A merchant sells pickles.
      *   *Purposivist:* Looks at findings ("to prevent scurvy"). Pickles don't cause scurvy. Exempt pickles.
      *   *Textualist:* "Fruit" has a botanical or culinary definition. If pickles fit, they are banned. Congress must amend.

  ### 4. Advice for the Drafter

  You are unsettled because you view the statute as a **blueprint for a policy outcome**, while the judges (even the purposive ones) view it as a **communicative act**.

  If you want to draft for the court you currently have (Purposivist/Intentionalist):
  *   **Draft the Purpose:** Spend time on the "Findings and Purpose" section. It is the key that unlocks the absurdity doctrine.
  *   **Define Terms:** Don't rely on ordinary meaning if you have a specific policy goal.
  *   **Anticipate Absurdity:** Add a "savings clause" or specific exceptions for edge cases you can foresee.

  If you want to draft for a Strict Textualist court (which is increasingly the federal norm):
  *   **The Text is King:** Assume the "Findings and Purpose" section will be ignored if the operative text conflicts with it.
  *   **Redundancy is Safety:** Do not worry about surplusage. Say it twice if you are unsure.
  *   **No Reliance on Correction:** Assume typos will be enforced if they are plausible. Proofread as if your life depends on it, because the court will not save you.

  ### Summary

  The practices you observed presuppose a **Purposivist** theory that treats the legislature as a **reasonable unitary actor**. This is defensible not as empirical truth, but as a necessary fiction for a functioning legal system. It can be reconstructed as an **objective reader** theory to avoid the "factional bargain" objection.

  The **Strict Textualist** alternative would abandon the **Absurdity Doctrine** (mostly) and the use of **Extrinsic Aids**, while keeping **Scrivener's Error** and **Surplusage** (as heuristics). This would shift the burden of fixing bad outcomes from the Judiciary to the Legislature.

  However, do not lose sleep over the theoretical divide. In the **zone of convergence** (contextual meaning, terms of art, structure), all theories demand the same thing: clarity, consistency, and precision. Your job remains the same: write words that carry the weight of the law, because in the end, the words are all you have.
