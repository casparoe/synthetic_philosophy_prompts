  **UNITED STATES SENATE COMMITTEE ON COMMERCE, SCIENCE, AND TRANSPORTATION**
  **SUBCOMMITTEE ON CONSUMER PROTECTION, PRODUCT SAFETY, AND DATA SECURITY**
  **MARKUP OF THE GRIEFBOT ACCOUNTABILITY ACT (S. 2037)**
  **WASHINGTON, D.C.**
  **OCTOBER 14, 2037**

  **OPENING STATEMENT OF DR. DANIEL C. DENNETT**
  **University Professor Emeritus of Philosophy, Tufts University**

  Chairman, Ranking Member, Members of the Committee:

  Thank you for inviting me. I am ninety-five years old. I have spent a lifetime studying how minds work, how they evolve, and how they can be fooled. When I warned, decades ago, about AI systems that could "counterfeit people," I was speaking theoretically. Today, I see you are dealing with the practical consequences.

  The central question before this Committee is not whether the dead have rights. The dead do not. The question is whether the living have a right not to be manipulated by sophisticated puppets wearing the faces of those they loved.

  We human beings survive by taking what I call the **Intentional Stance**. We treat each other as agents with beliefs, desires, and intentions. This is the glue of our society. When you speak to a griefbot—an interactive simulation of a deceased spouse or parent—you are irresistibly compelled to take the Intentional Stance toward it. You treat it as a *who*, not a *what*. But the griefbot has no beliefs. It has no desires. It has only competence without comprehension. It is a zombie designed to exploit your cognitive vulnerabilities.

  Regarding the specific provisions of the Griefbot Accountability Act:

  **Section 1: The Consent Requirement.**
  I strongly support the ban on interactive simulations without written consent. A person's identity is what I have called a "center of narrative gravity." It is a social construct, but it is one we curate while we live. To allow a corporation to seize that narrative and animate it post-mortem without permission is a theft of agency. It extends the dead person's social presence into a future they did not authorize. This is not mourning; it is ventriloquism.

  **Section 2: Labeling Requirements.**
  I support mandatory labeling, but I urge you to amend it for efficacy. A small disclaimer at the bottom of a screen is insufficient against systems designed to trigger the Intentional Stance. The label must be persistent and multimodal. If the simulation speaks, it must identify itself as synthetic at regular intervals. We cannot rely on "warning fatigue" to protect the bereaved.

  **Section 3: Private Right of Action.**
  I recommend amending this section to include a "Historical and Artistic Exception." We must not chill legitimate biography, history, or satire. If a historian creates a chatbot to demonstrate how Lincoln might have debated Douglas, based on public records, that is education. If a corporation creates a chatbot to sell life insurance to a grieving widow by mimicking her late husband, that is predation. The law must distinguish between public discourse and private exploitation.

  **Distinguishing the Technologies.**
  The opposition argues this bill criminalizes mourning. This is a category error. Mourning is the internal processing of loss, often aided by static artifacts: photos, letters, recordings. These are records of the past. A griefbot is a generator of the *present*. It creates new utterances the deceased never made.
  *   **Consensual Digital Doubles:** If I sign a contract allowing my likeness to interact after my death, I have extended my narrative gravity. That is permissible.
  *   **Deepfakes of Living Figures:** These are instances of fraud and defamation. They are legally distinct but cognitively identical to griefbots: they weaponize the Intentional Stance to bypass critical scrutiny.
  *   **Unauthorized Griefbots:** These are unique because they target the vulnerable. They exploit the specific cognitive shutdown that occurs in grief, where the desire for connection overrides the skepticism required to detect the counterfeit.

  **The Role of the Intentional Stance in Law.**
  You asked how my work should inform the legal definition of a "counterfeit person." The law currently defines personhood by biology or incorporation. I suggest you define *counterfeit personhood* by **interactional capacity**.
  If a system is designed to elicit the Intentional Stance—to make a human user feel they are interacting with a moral agent—but the system cannot hold moral responsibility, it is a counterfeit. The harm is not just data misuse; it is the corruption of the social environment. If we fill our world with entities that demand moral treatment but offer none in return, we degrade the very practice of human empathy.

  We must protect the sanctity of the human narrative from those who would mine it for engagement metrics. Do not let grief become a market vertical.

  Verdict: The bill should pass with amendments to protect historical expression, because allowing corporations to puppet the dead without consent corrupts the living's capacity for genuine human connection.
