answer: |-
  ### Exam Question (60 Minutes)

  **Question 4**
  Consider the following case discussed in seminar: one hectare of lowland tropical forest versus the same hectare converted to rough pasture.
  *   **Forest:** 1,000 Type A animals (welfare score: -0.5) + 10 Type B animals (welfare score: +8).
  *   **Pasture:** 200 Type A animals (welfare score: -0.5) + 40 Type B animals (welfare score: +8).
  *   **Scale:** 0 is neutral; negative is not worth living; positive is worth living.

  Write an essay that addresses the following five points in order:
  1.  Construct the argument that converting the forest to pasture is morally obligatory based *only* on the provided data.
  2.  Calculate the total welfare for both scenarios and state the net difference.
  3.  Determine the exact welfare score Type A lives would need to exceed for the verdict to flip in favour of preserving the forest (show your working).
  4.  Identify which species' welfare uncertainty most threatens this conclusion and state what empirical discovery would settle the debate.
  5.  Explain what this calculation takes for granted regarding whether bringing an animal into existence counts as a benefit or harm.

  ***

  ### Model Answer

  The argument for conversion rests on total welfare maximization. If the moral goal is to maximize the sum of welfare scores across all affected animals, we must compare the aggregate value of the forest population against the pasture population. Given the provided scores, the pasture scenario yields a higher total sum than the forest scenario. Therefore, based strictly on these figures, converting the habitat is morally obligatory because it results in a net increase in overall welfare.

  Performing the arithmetic confirms this. In the forest, 1,000 Type A animals at -0.5 equals -500. Ten Type B animals at +8 equals +80. The forest total is -420. In the pasture, 200 Type A animals at -0.5 equals -100. Forty Type B animals at +8 equals +320. The pasture total is +220. The net difference is 640 welfare units in favour of the pasture. The conversion turns a net negative existence into a net positive one.

  To find the threshold where preserving the forest becomes preferable, we set the totals equal, letting $x$ represent the unknown welfare score of Type A.
  Forest Total: $1000x + 80$
  Pasture Total: $200x + 320$
  Equating them: $1000x + 80 = 200x + 320$
  Subtract $200x$ and $80$ from both sides: $800x = 240$
  Divide by 800: $x = 0.3$
  For the forest to be the better option, Type A lives must have a welfare score greater than +0.3. Crucially, this is not merely "less bad"; Type A lives must be objectively worth living (positive), not just less suffering than currently assumed.

  This calculation reveals that the conclusion is highly sensitive to the welfare of Type A animals. Because there are so many more Type A animals than Type B, a small change in Type A welfare swings the total significantly more than a large change in Type B welfare. For instance, doubling Type B welfare only adds 240 units to the pasture, whereas shifting Type A from -0.5 to 0 adds 500 units to the forest. Therefore, the premise most vulnerable to revision is the assessment of Type A welfare. To settle the debate, we would need empirical discovery regarding the affective states of small, short-lived forest animals. If research showed their lives contain net positive engagement rather than net suffering, the verdict flips.

  Finally, this entire calculation takes for granted the "Total View" of population ethics. It assumes that comparing sums across different populations is valid, meaning bringing Type B grazers into existence on the pasture counts as a benefit (+320) even though those specific individuals would not have existed in the forest. It treats existence as a variable that can be added to the sum. This ignores the Non-Identity Problem: the animals on the pasture are not the same individuals as those in the forest. The calculation assumes we can harm or benefit specific animals by choosing which ones come into existence, rather than only harming or benefiting those who already exist. Without this assumption, the comparison of totals collapses, as we are not making existing animals worse off, but swapping distinct populations.

  ***

  ### Marking Scheme (Out of 20)

  **1. Correct Calculation of Totals (4 Marks)**
  *   **A Answer:** Correctly identifies Forest (-420) and Pasture (+220) and states the net difference (640).
  *   **B Answer:** Gets the totals right but fails to state the net difference, or makes a sign error (e.g., treating -0.5 as positive).
  *   *Typical Error:* Students add the populations (1010 vs 240) instead of multiplying by welfare scores.

  **2. Correct Threshold Algebra (4 Marks)**
  *   **A Answer:** Sets up the equation correctly ($1000x + 80 = 200x + 320$) and solves for $x = 0.3$.
  *   **B Answer:** Sets up the equation but makes an arithmetic error, or solves for the difference rather than the break-even point.
  *   *Typical Error:* Students calculate how much Type A needs to improve to reach 0, rather than to match the pasture total.

  **3. Identification of Sensitivity (4 Marks)**
  *   **A Answer:** Explicitly states Type A is the critical variable due to population magnitude (leverage).
  *   **B Answer:** Notes uncertainty exists but claims Type B matters more because their lives are "more valuable" individually.
  *   *Typical Error:* Focusing on the magnitude of the individual score (+8) rather than the aggregate impact of the population size.

  **4. Commitment on Premise/Discovery (4 Marks)**
  *   **A Answer:** Commits to Type A welfare as the bet and specifies empirical affective research as the required discovery.
  *   **B Answer:** Vaguely suggests "more research is needed" without specifying which species or what kind of data.
  *   *Typical Error:* Suggesting we need to discover "better ethics" rather than empirical data about sentience.

  **5. Identification of Existence Assumption (4 Marks)**
  *   **A Answer:** Identifies the Total View/Non-Identity issue: counting nonexistent animals as benefits/harms.
  *   **B Answer:** Mentions "utilitarianism" generally without addressing the specific problem of bringing beings into existence.
  *   *Typical Error:* Confusing this with speciesism or habitat rights rather than population ethics.

  ***

  ### Confidence and Uncertainty Statement

  **Confidence:** High (90%).
  **Uncertainty Step:** The weighting of **Point 4 (Commitment on Premise/Discovery)**.
  **Reasoning:** While the math and the existence assumption are objective based on the course material, students may legitimately argue that the *ethical* premise (Total View) is the one to bet against rather than the *empirical* premise (Type A welfare). The model answer chooses the empirical route to satisfy the "what would have to be discovered" constraint, but a sophisticated student might argue the ethical framework is the real variable. I am less sure if the marking scheme penalizes that ethical pivot too harshly compared to the empirical pivot.
