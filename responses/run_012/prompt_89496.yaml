  But a single storm we hold in view.
  Does the truth ring from the bone or the name?
  Depends on which word we call the rule.

  4.
  We hold the lineage tight like a rope,
  But the ends ring false when they collide.
  We call it two because they won't mate,
  Or one because there is no cut inside.

  5.
