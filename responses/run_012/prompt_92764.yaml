prompt: |-
  I'm in a lab reading group on interpretability and we keep having the same fight, and I want to know what kind of fight it actually is. One side says that when you can train a probe to read some property off a network's activations, or you find a direction or feature that tracks a concept, that's evidence the network represents that thing. The other side says no: a probe only shows the information is decodable, and you can train a probe to read off pretty much anything, so nothing follows about what the network is actually doing. Same experiments, same results, months of goign in circles, nobody budges.

  My hypothsis is that this isn't really a disagreement about neural networks at all -- one side is asking what's causally doing the work inside the network, the other is asking what an interpreter can extract from the outside, and both of them are using the word representation for those two different things. But I'm not confident, and I don't want a survey of interpretability techniques.

  So diagnose it. Is it verbal, is it a hidden empirical question (say, something about causal role that an intervention would settle), is it a disagreement about which cases count as evidence, or about what a satisfying explanation of a network even has to do? And given your diagnosis, tell me what would actually count as progress here -- a distinction, a test, a formal result, a change in the question -- or whether the two sides should just admit they aren't disagreeing. American English please, and don't bother with citations.
