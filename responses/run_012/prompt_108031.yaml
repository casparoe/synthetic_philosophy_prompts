answer: |-
  ### The Hofstadter Hourglass: A Decision Procedure for Constrained Translation

  **Philosophical Grounding**
  In *Le Ton beau de Marot*, Douglas Hofstadter demonstrates that fidelity lies not in words but in the *work the words do*. A translation must recreate the poem's effect, not merely its dictionary definitions. When form and meaning conflict, you must ask: Is the form the meaning?

  **Strategy Legend & Costs**
  *   **Preserve:** Keep the exact constraint. *Cost:* High semantic distortion. *Defensible:* When constraint is Constitutive or Covert.
  *   **Substitute:** Swap for an English-equivalent constraint (e.g., rhyme for assonance). *Cost:* Alteration of authorial mechanism. *Defensible:* When original is impossible but effect is vital.
  *   **Compensate:** Drop constraint here, add formal rigor elsewhere. *Cost:* Displacement of artistic labor. *Defensible:* When constraint is Ornamental.
  *   **Drop:** Render free of the constraint. *Cost:* Loss of structural integrity. *Defensible:* When constraint blocks meaning and is not Constitutive.
  *   **Refer to Editor:** Halt and flag. *Cost:* Time/Authority. *Defensible:* When aesthetic judgment overrides analytic rules.

  **The Procedure (Run time: <60 mins)**
  1.  **Classify:** Is the constraint Ornamental, Constitutive, Mnemonic, Covert, or Ironic?
  2.  **Visibility:** Is the reader meant to perceive the rule? (Yes/No)
  3.  **Drift:** Does the rule produce the same effect in English? (Yes/No)
  4.  **Cost:** Does preserving it destroy core semantic fidelity? (Yes/No)
  5.  **Decision Matrix:**
      *   If **Constitutive** + **Visible** → **Preserve**.
      *   If **Constitutive** + **Impossible** → **Substitute** (if effect matches) or **Refer**.
      *   If **Ornamental** + **Invisible** → **Drop** or **Compensate**.
      *   If **Covert** → **Preserve** (if possible) or **Compensate**.
      *   If **Semantic Fidelity** conflicts with **Constitutive Form** → **Refer to Editor**.

  **Note on Constraint Drift & Visibility**
  *Constraint Drift* occurs when a rule functions differently in the target language (e.g., syllable count feels heavier in English than French). *Visibility* determines whether the constraint is a puzzle for the reader or a secret for the writer. If invisible, the constraint serves the writer, not the reader; prioritize the reader's experience unless the constraint is Constitutive.

  **Limitations**
  This procedure cannot decide between two equally valid aesthetic outcomes (e.g., preserving meaning vs. preserving music when both are constitutive). That is an aesthetic judgment, not an analytic one.

  ***

  ### Case 1: Lipogram (No 'E') on Absence
  *   **Classify:** Constitutive (the missing letter enacts the theme of absence).
  *   **Visibility:** Visible/Covert (readers may suspect, insiders know).
  *   **Drift:** High. 'E' is 12% of French text, 13% of English. Difficulty is comparable; effect is identical.
  *   **Cost:** High lexical restriction, but theme supports restriction.
  *   **Analysis:** The form *is* the content. Removing the commonest letter performs the absence described. To drop it is to rewrite the poem's soul.
  *   **Strategy:** Preserve. The difficulty is the point.

  Ruling: preserve

  ### Case 2: Acrostic (Name unfit for English line)
  *   **Classify:** Covert/Ornamental (dedication hidden in line heads).
  *   **Visibility:** Covert (meant to be found).
  *   **Drift:** High. English syntax requires different line breaks; the name cannot align without breaking grammar.
  *   **Cost:** Preserving it requires syntactic violence that obscures meaning.
  *   **Analysis:** The name is a dedication, not the poem's subject. Hiding it is secondary to reading the poem coherently. Forcing the acrostic renders the text nonsensical.
  *   **Strategy:** Drop the acrostic structure, ensure the name appears naturally in the text if possible.

  Ruling: drop

  ### Case 3: Invisible Strict Meter
  *   **Classify:** Ornamental/Mnemonic (strict form, but contemporary readers cannot hear it).
  *   **Visibility:** Invisible (the audience does not perceive the meter).
  *   **Drift:** High. French syllabic meter feels different than English stress meter.
  *   **Cost:** Preserving strict syllable count in English often creates unnatural stress patterns ("doggerel").
  *   **Analysis:** Since the reader cannot hear the meter, it functions only as a private discipline for the poet. Enforcing it in English creates audible awkwardness without delivering the intended aesthetic reward. This ruling will sting, but the procedure prioritizes the reader's experience over the writer's private rule when the rule is invisible.
  *   **Strategy:** Drop the strict count; adopt a natural English rhythm that suits the tone.

  Ruling: drop

  \answer{Preserve constitutive constraints; drop invisible forms; refer aesthetic conflicts to editor.}
