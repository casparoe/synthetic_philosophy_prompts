  Your friend recites the standard caricature, not the scholarly consensus.

  **Accepted:** Peirce did define truth as the ideal limit of inquiry—the opinion all investigators would eventually agree on. He also famously coined "pragmaticism" to distance himself from James's popularization, calling it "ugly enough to be safe."

  **Oversimplified:** James's "useful" is often read as "individually expedient." James meant something stricter: a belief is true if it successfully guides action and integrates with existing experience over the long run. It's not mere comfort. However, James was more willing than Peirce to say truths are *made* in the process of verification, rather than just found.

  **Wrong:** Peirce never defined truth as "what is useful." He defined *meaning* pragmatically (the practical effects of a concept). He attacked James for conflating meaning with truth. Peirce was a realist; he believed reality exists independently of our minds. For Peirce, a belief can be useful but false (e.g., a comforting lie), so utility cannot define truth.

  **Relativism:** The conclusion fails. Peirce's pragmatism is explicitly anti-relativist; truth is what the community *must* converge upon, regardless of individual desire. James is more pluralistic, but still demands empirical "cash-value," not arbitrary preference. Rorty's neopragmatism did embrace relativism, but that marks a break from classical pragmatism, not its culmination. Equating the tradition with relativism ignores Peirce's scientific realism entirely. Your friend is right that James opened the door, but wrong that Peirce walked through it.
