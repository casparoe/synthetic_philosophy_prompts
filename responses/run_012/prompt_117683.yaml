answer: |-
  Begin by fixing your mind on a legislature with unquestioned authority acting in perfect procedural order to enact a statute that is morally monstrous, stripping a religious minority of its property and barring its members from employment, where the constitution says nothing on point and no higher court has spoken. Your first task is to deliver a verdict on whether that statute is law. If you answer no, you deny that procedural enactment alone secures legal validity, and you must now decide whether this failure of validity attaches to a single norm or to the legal order taken as a whole. If you believe the monstrous statute invalidates the entire system, you hold that legal validity depends on the overall moral decency of the order, so that the same statute in an otherwise decent order comes out differently from the same statute in a systematically wicked one, which leads you to a leaf labeled substantive natural law in the Finnis vein. If you believe only the statute is void while the rest of the system remains valid, you hold that extreme injustice negates validity locally but not globally, and to confirm this position consider the postwar problem where a woman denounced her husband to the authorities of the old regime under a statute then in force which was unambiguous, and he was executed, and the courts of the new order must decide whether to punish her. If you would punish her by declaring the old statute was never law, you arrive at a leaf labeled Radbruch-style non-positivism about extreme injustice, but if you would punish her via a retroactive statute because the old one was valid but wicked, you have contradicted your initial no and must return to the start.

  If you answer yes to the first question and affirm the monstrous statute is law, you accept that social sources suffice for validity, and now you must separate the question of whether a norm is legally valid at all from what an official may or must do with a norm once it is valid. Ask yourself whether a judge must apply this valid statute. If you say the judge must apply it regardless of morality, you treat legal validity as purely social and obligation as categorical, and you should now turn to the second case of a statute enacted in the same flawless way that is morally unobjectionable but so vague that no official can tell what it forbids. If you say this vague statute is still law because it was enacted, you lean toward a leaf labeled exclusive legal positivism, especially if you also consider the seventh case of a procedurally perfect constitutional amendment that abolishes judicial review and immunizes the ruling party from legal challenge, after which the courts go on hearing ordinary cases as before, and you maintain that these courts are still operating under law despite the abolition of review. However, if you say the vague statute is not law because procedural failure kills validity, you align with a leaf labeled Fuller-style procedural natural law, which holds that the tests for legal validity themselves include moral tests regarding the internal morality of law, and this view is confirmed if you say the constitutional amendment collapses the legal order because it fails to guide conduct.

  If you say the judge need not apply the monstrous statute despite its validity, you must distinguish whether this is because the tests for validity are purely social while officials are morally permitted to refuse a valid norm, or because the tests for legal validity themselves include moral tests. If you say the tests are purely social but morality permits refusal, you remain on the branch of exclusive legal positivism but allow for judicial discretion or moral objection, which you can test against the fourth case of a norm that appears in no statute book and was never enacted by anyone, yet every official treats it as binding and has followed it for generations. If you say this customary norm is law only because officials treat it as such, you confirm the social fact view, but if you say it is law because it is right, you have shifted to the other branch. If you say the tests for validity include moral tests, you must decide whether morality enters validity because the system conventionally incorporates it or because law is an interpretive concept, and here you should use the sixth case of a trial judge's decision resting on no statute and no precedent, morally admirable, which later becomes the settled law of the jurisdiction. If you say the judge was making new law that later became valid, you stay with inclusive legal positivism, which holds that morality can be a condition of validity if the rule of recognition says so, but if you say the judge was finding existing law that was always binding, you arrive at a leaf labeled Dworkin-style interpretivism.

  To separate those who think the dispute is verbal or has no single answer from those who think it is substantive, you must answer whether the word law is doing descriptive work or work of praise. If you say the word law is merely a label for effective power and the dispute is verbal, you arrive at a leaf labeled deflationary position holding that the dispute is verbal or has no single answer, which you can test against the third case of a statute that is clear, morally fine, and duly enacted, but that no official has enforced in forty years and that officials openly call dead. If you say this dead letter is law descriptively but not functionally, you confirm the deflationary view, whereas if you say it is not law because it lacks efficacy, you may lean toward a sociological view not fully captured here. Note that there is a combination nobody occupies where one claims legal validity depends entirely on moral merit yet insists officials must apply valid norms even when they are morally monstrous, which is incoherent because if validity depends on moral merit a morally monstrous norm cannot be valid. Finally, flag that given the cases supplied, the tree cannot fully separate the leaf labeled exclusive legal positivism from the leaf labeled deflationary position holding that the dispute is verbal or has no single answer, because both accept the monstrous statute as law based on social sources and leave moral refusal as an extra-legal matter, differing only on the metaphysical status of the concept rather than the outcome of the cases.
