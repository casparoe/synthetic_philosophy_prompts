answer: |-
  The Wason selection task episode is the closest thing evolutionary psychology (EP) has to a founding myth, and like most myths, it obscures as much as it reveals. To determine whether this constitutes science or a 'just-so story', we must dissect the logic of the claim, the rigour of the testing, and the flexibility of the theoretical rescue mechanisms.

  ### The Adaptationist Lens: The Cheater Detection Module

  Under the adaptationist programme, the claim is specific. Cosmides and Tooby argued that the human mind does not possess a general-purpose logic engine. Instead, it possesses content-specific inference systems shaped by natural selection to solve recurrent adaptive problems. The specific adaptation proposed here is a **Cheater Detection Module (CDM)**.

  **The Phenotype:**
  The observable phenotype is not 'intelligence' in the general sense, but a dissociation in performance. Subjects perform poorly on abstract conditional rules (If P, then Q) but show a marked increase in accuracy when the identical logical structure is framed as a social contract (If you take the benefit, you must pay the cost), specifically where the potential for cheating exists.

  **Evidence For:**
  The primary evidence is the content effect itself. Standard cognitive psychology, assuming domain-general reasoning, predicted performance should remain low regardless of content. EP predicted a spike. The spike occurred. Furthermore, the 'perspective change' experiments provided a sharper test: if the rule is "If an employee gets a pension, they must have worked 10 years," subjects look for cheaters depending on whose perspective they adopt. If you are the employer, you check if the employee worked 10 years (did they take the benefit without the cost?). If you are the employee, you check if the employer gave the pension (did they withhold the benefit despite the cost?). General logic does not shift with perspective; a cheat-detection system tuned to your own interests does.

  **Evidence Against:**
  Critics, notably Gigerenzer and Cheng, argued that the effect is not about 'cheating' per se, but about **deontic logic** (rules of permission and obligation). If you frame a rule as a permission schema without a social contract (e.g., safety regulations), performance also improves. If the improvement stems from general pragmatic reasoning schemas rather than a specialised Pleistocene module, the adaptationist claim is overstated. Additionally, cross-cultural replications have been mixed; some small-scale societies do not show the same robust 'social contract' boost, suggesting the mechanism may be learned or culturally scaffolded rather than innate.

  **The Crucial Test:**
  The strongest evidence for the CDM came from the 'altruist detection' trials. If the mechanism is simply 'social contract reasoning', people should be equally good at spotting someone who pays a cost without taking a benefit (an altruist). The CDM hypothesis predicts people are *not* tuned to spot altruists, because altruists do not threaten the stability of reciprocal exchange in the way cheaters do. The data generally supports this: people are significantly worse at detecting altruists than cheaters. This is a risky prediction that general reasoning theories struggled to accommodate without ad-hoc adjustments.

  ### The Just-So Story Charge

  A 'just-so story' is an adaptationist explanation that is plausible but unfalsifiable, constructed post-hoc to fit the data. The charge against the CDM is that invoking 'ancestral environments' allows proponents to explain away any result by adjusting the assumed pressures of the Pleistocene.

  **Is it Falsifiable?**
  In principle, yes. The CDM hypothesis would be falsified if:
  1.  Social contract framing failed to improve performance over abstract framing.
  2.  Altruist detection proved as robust as cheater detection.
  3.  The effect disappeared when the 'cheating' element was removed but the 'deontic' element remained (though this is the battleground with the deontic logic critics).

  **Did the Episode Falsify It?**
  The episode did not falsify the core claim, but it forced a retreat. The discovery that deontic reasoning (permission/obligation) without social exchange can also boost performance weakened the claim that the module is *exclusively* for cheating. Proponents responded by narrowing the definition of 'social contract' or arguing that deontic rules are only compelling because they mimic adaptive problems. This looks suspiciously like theoretical buffering. However, because the 'altruist' prediction held, the specific claim that the system is *biased* towards cheating (rather than just social rules generally) remains standing.

  ### The Wrinkle: Error Management Theory

  Your wrinkle regarding asymmetric costs is the application of Error Management Theory (EMT). This suggests the cognitive system is not designed for accuracy, but for minimizing the cost of errors. In ancestral environments, missing a cheat (false negative) was likely more costly than falsely accusing an innocent party (false positive).

  **Does this rescue the adaptation?**
  It refines it. It explains why the system might be 'jumpy'—producing false alarms—without abandoning the adaptationist framework. It shifts the phenotype from 'high accuracy in social contracts' to 'bias towards detecting cheating in ambiguous social exchanges'.

  **Does it relocate the unfalsifiable bit?**
  This is the danger zone. If every result can be explained by positing a different cost-benefit ratio, the theory becomes a sponge. If subjects detect cheats, it's adaptation. If they miss cheats, the cost wasn't high enough in that context. If they false-alarm, it's error management.
  However, EMT remains scientific *if* it makes directional predictions. It predicts that in contexts where false negatives are costly, bias will skew towards detection. In contexts where false positives are costly (e.g., accusing a dominant ally), bias should skew towards caution. If researchers can specify the cost structure *a priori* and the bias follows, it is science. If they infer the cost structure *from* the bias, it is just-so storytelling. In the Wason literature, this line is frequently crossed. Proponents often assume the costs to fit the data rather than predicting the bias from independent ecological data.

  ### The Verdict

  Does this episode cut for or against the field?

  It cuts **for** the field, but with a severe caveat regarding theoretical discipline.

  Here is the defence: The 'general reasoning' null hypothesis was falsified. Humans do not reason like formal logicians; they reason like contextual pragmatists. EP provided the only framework that predicted the *dissociation* between abstract and social content before the data was fully in. The 'altruist' experiments were genuinely risky predictions that survived. This moves the Wason episode out of the 'just-so' category, because a just-so story cannot survive a failed prediction, and the CDM hypothesis survived several attempts to break it.

  However, the 'just-so' charge is not a slur to be dismissed; it is a structural risk inherent to the method. The Wason episode shows that EP is science **in motion**, not science settled. The shift from 'Cheater Module' to 'Error Management in Social Exchange' looks like degenerative problem-shifting *unless* the cost parameters are constrained by independent evidence.

  **The Disciplined Mapping:**
  *   **Who claims what:** Cosmides & Tooby claim a domain-specific module. Critics claim domain-general pragmatic schemas.
  *   **Where the evidence is:** Robust content effects exist (Science). The neural localisation of a 'module' does not (Gap). The altruist/cheater dissociation supports EP over general logic (Point for EP). Deontic effects without social contracts support Critics (Point against specific CDM).
  *   **Where the theory goes quiet:** On the precise neural implementation and on the independent measurement of 'ancestral costs' required to make EMT predictions truly rigorous.

  **Final Judgement:**
  The Wason episode demonstrates that evolutionary psychology is capable of producing novel, falsifiable predictions that outperform standard cognitive models. It is not a pile of just-so stories, because the stories were subjected to stress tests (like the altruist trials) that they could have failed. However, the field operates perilously close to the edge. The Error Management wrinkle saves the theory from refutation by data, but only if researchers resist the temptation to treat 'adaptive costs' as free variables to be tuned after the fact.

  If you treat the CDM hypothesis as a fixed claim about a Pleistocene module, the data has eroded it. If you treat it as a research programme investigating how adaptive problems shape reasoning content, it is vibrant science. The 'just-so' label applies only to the lazy end of the spectrum where post-hoc storytelling replaces *a priori* prediction. In this specific episode, the rigorous end won, but the lazy end is always waiting in the wings.
