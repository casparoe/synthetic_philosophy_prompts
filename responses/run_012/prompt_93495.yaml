prompt: |-
  I'm in a seminar on African American aesthetics and we're reading Du Bois's "Criteria of Negro Art" this week, and I'm stuck on a passage near the beginning. I thought I had the essays argument down — it's the piece where Du Bois insists that art can't be separated from the struggle, the one everyone cites for the line about all art being propaganda — but this bit doesn't seem to fit that, and I can't tell if I'm misreading it or if the essay is doing something more complicated than the one-liner suggests. Here's the passage:

  "You and I have been breasting hills; we have been climbing upward; there has been progress and we can see it day by day looking back along blood-filled paths. But as you go through the valleys and over the foothills, so long as you are climbing, the direction -- north, south, east or west -- is of less importance. But when gradually the vista widens and you begin to see the world at your feet and the far horizon, then it is time to know more precisely whither you are going and what you really want."

  What's tripping me up is the claim that direction is of less importance while you're climbing. If art is supposed to serve the fight, direction should matter all the time, right? Is he saying the political content of art is a second-order concern until some later stage of the movement, and if so, what stage does he think we're at? Is this a concession to the art-for-art's-sake crowd he's about to go after, or is it something else? And then a few paragraphs later he tells this whole anecdote about visiting the lake from Scott's poem and being annoyed by loud American tourists — he says they "struck a note not evil but wrong" — and I don't see how that fits either. Is the aesthetic experience in that anecdote supposed to be the thing that makes the propaganda possible, or is it a seperate faculty he's trying to protect from politics? Walk me through how these two passages actually function in the argument, and tell me whether the tension with the propaganda claim is real or whether I'm just reading that claim too crudely. I don't need a full summary of the essay — just help with these specific moves and what they're doing.
