  **The accounts as I have stated them**

  Your map is largely accurate but obscures a crucial distinction in the Scanlonian view. Scanlon does not merely treat practice as scaffolding; he argues the practice is *justified* by the individual principle of fidelity (Principle F). The obligation exists even without the practice, though the practice facilitates the act. The Humean view is stronger than you suggest: it does not merely lack a clean answer for the isolated promisor; it denies obligation exists there at all. The obligation is constitutive of the practice, not prior to it. Shiffrin and Owens align closely: promising is the exercise of a normative power to alter rights and duties, specifically by transferring authority over an action to the promisee.

  Contact points are superficial: all agree promises generally create obligations and promisees have special standing to complain. Genuine conflict lies in the *source* of the norm and the *nature* of the wrong. For the Humean, the wrong is destabilizing a useful convention. For Scanlon, it is violating a moral principle regarding expectations. For Shiffrin-Owens, it is usurping authority rightfully transferred. The Humean locates the norm externally (social utility); Scanlon locates it interpersonally (moral principle); Shiffrin-Owens locate it structurally (normative power). They conflict on whether the obligation is reducible to non-normative facts (Hume), derived from general moral principles (Scanlon), or sui generis normative powers (Shiffrin-Owens). Furthermore, they disagree on the "direction" of the duty. The Humean struggles to explain why the wrong is *to B* rather than to society; the other two build directedness into the core mechanism, though via different routes (expectation vs. authority). Crucially, the Humean sees the obligation as artificial, created by the practice, whereas the other two see it as discovering a moral potential inherent in communication or agency. This means the Humean is explaining the existence of a tool, while the others are explaining the use of a capacity. This ontological disagreement makes direct comparison difficult.

  **Diagnosis**

  Your first hypothesis—that you are arguing past each other about the explanandum—is partly right but symptomatic. You are indeed asking different questions: genealogy (Hume), justification (Scanlon), and phenomenology of authority (Shiffrin). However, this divergence stems from the deeper methodological split identified in your rival hypothesis: the evidential standing of intuitions.

  The impasse is primarily evidential. The Humean treats the practice as the primary datum; isolated intuitions are suspect. The Scanlonian and Authority theorist treat the intuitive wrongness of breaking a promise as the primary datum, seeking a principle that matches it. In your fatalist case, the Authority theorist treats the intuition ("A wronged B") as fixed data. The Humean treats it as a confusion derived from living within a practice. The Scanlonian tries to salvage it by redefining expectation. Because you cannot agree on whether the intuition is data or artifact, you cannot agree on what needs explaining. If the intuition is artifact, the Authority view is solving a non-problem. If it is data, the Humean view is incomplete.

  Therefore, the rival hypothesis is the better diagnosis. The explanandum mismatch arises because each theory selects different data as foundational. The Humean selects the stability of cooperation; the others select the phenomenology of the bilateral relation. Until you settle whether the fatalist intuition is a truth-tracking insight or a cultural hangover, you will continue to propose theories that satisfy different masters. The disagreement is substantive, grounded in prior methodology: whether to trust pre-theoretical intuitions in edge cases or to defer to the functional role of the institution. The question "why bind" is indeed ambiguous, but resolving the ambiguity requires first agreeing on which bindings count as real. Your first hypothesis identifies the symptom: one side asks about the reason for action, the other about the structure of the wrong. But this split exists because the Humean denies the "wrong" exists without the practice, while the others assume it does. Thus, the evidential disagreement drives the explanandum mismatch. You cannot separate what needs explaining from what you count as evidence. The impasse persists because you are trying to solve a puzzle where the pieces belong to different boxes.

  **The case, re-examined**

  The case does not discriminate as cleanly as you hope; it mostly reveals where each view pays its costs. The Authority view fits best, but the fit is suspicious. It is rigged because the view defines promising *as* the transfer of authority. To say the case supports the Authority view is to say the definition matches the definition. The cost here is circularity: if promising just is authority transfer, the explanation is trivial. It earns the right answer by stipulation.

  Scanlon can absorb the case with an adjustment: Principle F covers inviting someone to expect, even if they don't actually expect. The cost is stretching "expectation" until it loses its psychological content, becoming a purely normative placeholder. This weakens the view's naturalistic appeal and blurs the line between promising and other assurances. The Humean absorbs it by denying the intuition: A wronged the practice, not B. B's feeling of being wronged is a projection of practice-based norms onto a non-practice context. The cost is counter-intuitiveness: it denies the directedness of the wrong that your group unanimously feels.

  Thus, the case functions as a stress test for theoretical flexibility rather than a knockout blow. It forces the Scanlonian to abandon psychology, the Humean to abandon directedness, and the Authority theorist to risk triviality. The unanimous intuition you report is the pivot. If you hold that intuition fixed, the Authority view wins by default. If you allow the intuition to be revised by theory, the Humean view becomes viable. The case discriminates only if you pre-commit to the evidential status of that intuition. It reveals that the Authority view is best at saving the phenomena; the Humean explains the institution; Scanlon stands between.

  **What would count as progress**

  Progress requires suspending the question "why bind" and agreeing on a corpus of data. You need a case where the Authority and Expectation views diverge on an intuition you all share, not one where they diverge on contested edge cases. Focus on the power of release. Why can only B release A? The Authority view says because B owns the right. The Scanlonian says because only B's expectations matter. The Humean says because the practice assigns that role.

  Design a case where release is impossible or problematic. Does a promise bind if B is dead? If B is comatose? If B forgives but demands performance? These cases might separate the views without relying on the fatalist intuition. Alternatively, shift from justification to phenomenology. Ask not what makes it binding, but what experiences constitute the binding. If you cannot agree on the data, you cannot compare theories. The impasse will hold until you decide whether philosophy's job is to systematize intuitions or correct them. Agree on the method, and the substantive disagreement may dissolve or become tractable. You might find that you are not debating the nature of promising, but the nature of philosophical inquiry itself. A formal result might help: can you derive the power of release from the principle of fidelity without assuming authority? If not, the views are logically distinct. If so, they may be notations of the same underlying structure. Progress lies in mapping the logical dependencies, not in seeking a verdict on the fatalist case. This shifts the burden from winning an argument to clarifying the terms of engagement.
