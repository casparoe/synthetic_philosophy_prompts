answer: |-
  The water in the cisterns of Ostra had been clear for three generations, yet the burning continued.

  In the first generation, there was Elian. He stood on the walkway above the Great Grate, looking down at the iron mesh where the silver-eels were laid out. They were stiff, caught in the night nets, their scales dull in the morning mist. Below, the fire waited.

  For centuries, the people of Ostra had burned the eels to make ash, believing the ash mixed into the mortar kept the river walls from crumbling. Elian, the Chief Engineer, knew the mortar held without it. He had tested the mix himself. The ash was superstition, a relic from when the walls were mud and needed every binder they could get. Now the walls were stone. The eels were food, or bait, or nothing. But they were not mortar.

  He could have stopped it. He could have stood before the Council and declared the practice obsolete. But Elian knew the walls were not the only thing holding the river back. The people watched the smoke rise every autumn. It told them the city was safe. To stop the smoke was to tell them the safety was gone, or worse, that it had never been there at all.

  So he called the Council. He did not speak of mortar. He spoke of memory.

  "The ash does not bind the stone," Elian said, his voice flat in the chamber. "But the binding requires us to remember the cost of the river. If we stop the burning, we forget the water is stronger than we are. We keep the Grate. We keep the eels. But we do not call it mortar anymore. We call it the Tithe of Balance."

  An elder objected. "If the ash is useless, is it not waste? Is it not a lie?"

  "It is a bridge," Elian said. "A child cannot be weaned from milk to bread in a day. Their stomachs would fail. We are that child. We keep the form so the spirit does not break. We change the meaning so the truth can grow."

  They voted to keep the Grate. That autumn, Elian stood over the fire himself. He watched the fat render and hiss. He did not pray for the walls. He prayed for the people's capacity to understand why they were praying. The smoke smelled of burnt oil and river mud. It smelled like safety. He told himself this was mercy. He told himself he was protecting them from the shock of a sudden truth.

  ***

  Forty years later, Mara stood by the same Grate. She was Elian's granddaughter, and she held his journal in her satchel. She knew about the mortar. She knew about the bridge.

  She watched the younger apprentices laying the eels on the mesh. They were careful, reverent. They spoke of the Tithe of Balance as if it were a law of physics. To them, the burning was not a concession; it was the axis upon which the city turned. They believed the smoke itself held the water back.

  Mara had tried to tell them. She had taken the journal to the Council. She had shown them Elian's words: *A concession to weakness… not what I would have chosen… gradualness.*

  The Council had listened politely. Then they had thanked her for preserving the history. They placed the journal in the archives. The burning continued.

  "It is a lie," Mara said to the High Keeper, a man named Joren who had tended the Grate since he was a boy. "My grandfather knew it was unnecessary. He kept it to spare you. Now you kill because you think you must."

  Joren did not look up from the eels. He checked the flame intensity with a metal rod. "It is not a lie, Mara. It is what we do. Does it matter why the first stone was laid, so long as the wall stands?"

  "It matters if the wall stands on a story we know is false," she said. "He treated you like children. He thought you couldn't handle the truth."

  "He treated us like people," Joren corrected. He picked up an eel. It was still twitching slightly. "You think truth is a thing you find in a book. Truth is what keeps the city from tearing itself apart. If we stop tomorrow, what happens? Do we say our fathers were fools? Do we say the smoke was nothing? You want to abolish the rite because it is impure. I keep it because it is ours."

  "It is a ladder you have turned into a house," Mara said.

  "Then let me live in the house," Joren said. "It keeps the rain out."

  He dropped the eel onto the mesh. The hiss was sharp, sudden. Mara turned away. She could not watch the death, not because she feared blood, but because she feared the ease of it. This was not the savage killing of the old days. It was clean, administrative. It was kindness weaponized. Elian had loved them enough to lie to them, and now that love had hardened into a cage.

  She wanted to smash the Grate. She wanted to force them to see the stone walls held without the ash. But she looked at the faces of the apprentices watching the smoke, their expressions solemn, unified. If she broke the Grate, she would not free them. She would orphan them.

  She left the journal in the archives. She did not stop the burning. But she never lit a fire herself.

  ***

  Another forty years passed. The river flooded twice in that time, and the walls held. The city of Ostra had grown outward, away from the water. The cisterns were no longer the primary source of water; pipes ran from the mountains. The ash was not used in mortar; modern binders were stronger.

  Kael stood on the walkway. He was Joren's apprentice, though Joren was long dead. The Grate was now made of bronze, polished daily. It was no longer in the industrial district; it was in the Plaza of Founders.

  A stranger stood beside him, a merchant from the inland cities. The merchant watched the workers bring the baskets of silver-eels.

  "You kill these for the water?" the merchant asked. "I heard your pipes come from the peaks."

  Kael nodded. "They do."

  "Then why burn them? It seems… inefficient."

  Kael looked at the eels. They were farmed now, specifically for the Tithe. They were smaller than the wild ones Elian had known. The killing was quicker, done with a spike to the brain before they reached the mesh. It was humane. It was precise.

  "It is not for the water," Kael said.

  "Then what?"

  Kael thought of the stories. He had heard whispers of the mortar, of the engineering. He had heard whispers of the lie. But those whispers were old dust. What remained was the smoke. When the smoke rose, the city stopped. The merchants lowered their hammers. The children stopped running. For ten minutes, everyone looked at the same column of grey rising into the blue.

  In that silence, there were no inland cities, no mountain pipes, no arguments about truth or lies. There was only Ostra.

  "My grandfather said a man named Elian changed the reason," Kael said. "He said the reason was once about walls, then about balance. Now it is about us."

  "The reason changed?" The merchant seemed unsettled. "So the act is… flexible?"

  "The act is the anchor," Kael said. "The reason is just the rope. You can change the rope so long as the anchor holds."

  "But if the first reason was false…"

  "Nothing that keeps a people together is false," Kael said. He didn't say it with anger. He said it the way a mason says stone is hard.

  The workers signaled readiness. The bell tollled once. The crowd in the plaza fell silent. Kael took the lever in his hand. It was warm from the sun. He looked at the merchant.

  "You ask why we kill them. We kill them because we did it yesterday, and we will do it tomorrow. If we stop, we are not the people who stopped the killing. We are a different people. And I do not know who they are."

  He pulled the lever. The mesh tilted. The eels slid into the fire.

  The smell hit them instantly. It was distinct, pungent, recognizable to anyone born within the valley walls. It smelled of burnt oil and river mud. It smelled of safety.

  The merchant coughed, waving a hand in front of his face. "It smells… strong."

  Kael did not wave the smoke away. He let it settle on his coat. He watched the ash fall through the mesh into the collection tray below. It was fine, grey powder. It would be swept up and dumped into the river, unneeded, unused.

  When the fire died down, the crowd dispersed. The merchants resumed their haggling. The children ran again. Kael stayed on the walkway. He reached into his pocket and pulled out a small notebook. He checked a line item.

  *Fuel: Charcoal, 40 units.*
  *Stock: Silver-eels, 500 units.*
  *Disposal: Ash, 12 kilos.*

  He ticked the box. He capped his pen. Below him, the collection tray was full. He reached down and touched the side of the tray. The metal was still warm, vibrating slightly with the cooling heat. He wiped a smudge of grey from the rim with his thumb and rubbed it between his fingers. It was dry and soft, like dust from a old book.

  He left the smudge there. He turned and walked back toward the city, the smell clinging to his clothes, indistinguishable from the smell of the street, the shops, the homes.
