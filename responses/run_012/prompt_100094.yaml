answer: |-
  Here are ten interview questions with follow-ups designed to press your guest on the weakest points of her argument. They are ordered to build tension, starting with textual interpretation and moving toward the philosophical consequences.

  **1. The Textual Claim**
  You argue that the child-machine section of Turing's 1950 paper is the load-bearing criterion for intelligence, while the Imitation Game was overpromoted later. Is the distinction between a 'trainable' system and an 'educable' one yours, or do you find that specific distinction explicitly in Turing?
  *   **Follow-up:** If you claim it's Turing's, why does he explicitly define the 'pass' of his paper as winning the imitation game? Are you arguing he contradicted himself in the text, or that we should ignore his own operational definition in favor of a sub-clause?

  **2. The Teacher Problem**
  Your definition makes intelligence a relational property between the machine and the teacher. If competence is bounded by what the teacher can teach, haven't you made machine intelligence a fact about pedagogy rather than about the machine?
  *   **Follow-up:** Then on your view, is a superintelligent machine paired with an incompetent teacher literally *less intelligent* than a mediocre machine with a brilliant teacher? Because that seems to make intelligence extrinsic rather than intrinsic.

  **3. Assessment and Imitation**
  You say educability is improving on problems nobody trained it on. But to assess that, you need an exam to verify the improvement. Doesn't that just smuggle the Imitation Game back in as the metric for success?
  *   **Follow-up:** If the exam requires the machine to justify its improvement in language we understand, haven't you just made the Imitation Game the *measurement tool* for your criterion, rather than replacing it?

  **4. Conditioning vs. Teaching**
  Turing floats rewards and punishments as the instruction signal for the child-machine. But mechanistically, isn't that just conditioning with extra steps?
  *   **Follow-up:** If the machine cannot distinguish between a reward signal and a pain signal, what conceptual work is 'teaching' doing here that 'optimization' doesn't already cover?

  **5. The Animal/Controller Objection**
  A dog learns tricks; a feedback controller adapts to noise. They both improve under correction on novel problems. Why don't they qualify, or if they do, what is your criterion still excluding?
  *   **Follow-up:** If you say they lack 'concepts,' aren't you relying on their inability to pass the Imitation Game to prove they aren't educable? Which brings us back to square one.

  **6. Unfalsifiability**
  We can always say a machine wasn't educated properly if it fails to improve. So what would count as a machine that is genuinely *ineducable* rather than just badly taught?
  *   **Follow-up:** If there is no upper bound on the 'proper' education required to demonstrate capacity, doesn't this make your criterion immune to empirical falsification?

  **7. The Historical Objection**
  The strongest historical objection to your reading is that the child-machine was an engineering expedient—a way to avoid hand-coding an adult mind—not a criterion of intelligence at all. What textual grounds do you have for the stronger claim?
  *   **Follow-up:** Turing writes that we should provide the machine with sense organs and teach it to produce an adult mind. If that's just a pipeline to produce a mind that *then* plays the imitation game, haven't you confused the manufacturing process with the product specification?

  **8. The Social Dimension**
  Education implies a teacher with authority, a shared language, and a community of correction. Do you accept that this makes intelligence constitutively social?
  *   **Follow-up:** If intelligence is constitutively social, does a machine isolated from human norms cease to be intelligent? Are you willing to pay the price that Robinson Crusoe isn't intelligent?

  **9. Alignment and Docility**
  An educated machine is educated toward somebody's ends. Does your criterion measure competence or docility?
  *   **Follow-up:** Can you distinguish a highly intelligent dissenter from a highly docile fool without appealing to the teacher's intentions? Because if you can't, you've defined intelligence as compliance.

  **10. Speed and Development**
  Turing suggests machine education might go faster than a human child's. If the process is compressed, does the machine end up with the same concepts or just the same outputs?
  *   **Follow-up:** If the developmental path is skipped, what conceptual structure is lost? And if nothing is lost, why does human education take twenty years?
