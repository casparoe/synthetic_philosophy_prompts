          *   *Follow-up:* If you say they lack 'concepts,' aren't you relying on their inability to pass the Imitation Game to prove they aren't educable? Which brings us back to square one.

      *   *Topic 6: Unfalsifiability.*
          *   Q: How do we know it's not just bad teaching?
          *   Likely Answer: We set a standard curriculum.
          *   Follow-up: Who sets the standard? If it fails, you blame the teacher. If it passes, you credit the machine. Is this falsifiable?
          *   *Refinement:* Make it about the "genuinely ineducable."
          *   *Draft:* We can always say the machine wasn't educated properly. So what would count as a machine that is genuinely ineducable rather than badly taught?
