      *   *Topic 7: Historical Objection (Expedient).*
          *   Q: Child-machine was just to avoid coding an adult mind.
          *   Likely Answer: Turing says it's the only way.
          *   Follow-up: He says it's the only *engineering* way. You're claiming it's the *philosophical* definition. Where's the bridge?
          *   *Refinement:* Press on "engineering expedient."
          *   *Draft:* The strongest historical objection is that the child machine was an engineering expedient to avoid hand-coding an adult mind, not a criterion of intelligence. What textual grounds do you have for the stronger claim?
          *   *Follow-up:* Turing writes that we should try to provide the machine with the best sense organs and then teach it. If that's just a pipeline to produce an adult mind that *then* plays the imitation game, haven't you confused the manufacturing process with the product specification?

      *   *Topic 8: Social Dimension.*
          *   Q: Education implies community/authority. Is intelligence social?
          *   Likely Answer: Yes, Wittgensteinian view.
          *   Follow-up: Are you willing to say a solitary genius isn't intelligent?
          *   *Refinement:* Focus on "constitutively social."
          *   *Draft:* Education implies a teacher with authority and a community of correction. Do you accept that this makes intelligence constitutively social?
          *   *Follow-up:* If intelligence is constitutively social, does a machine isolated from human norms cease to be intelligent? Are you willing to pay the price that Robinson Crusoe isn't intelligent?

      *   *Topic 9: Alignment (Competence vs. Docility).*
          *   Q: Educated toward somebody's ends. Competence or docility?
          *   Likely Answer: It's about understanding norms.
          *   Follow-up: A well-trained soldier is docile. Is that intelligence? How do you distinguish without appealing to the teacher's intentions?
          *   *Refinement:* Make the follow-up bite hard on "docility."
