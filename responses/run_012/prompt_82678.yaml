answer: |-
  This is a compelling test case because it exposes the friction between a functionalist theory of convention (like David Lewis's) and the historical/political reality of how norms are established. Below is an analysis structured to help you draft your paper, adhering to your constraint: I will highlight where the theory fits, where it strains, and where it falls silent.

  ### 1. The Definition: Does Jaywalking Fit the Account?

  You are working with a Lewisian account of convention. For a regularity $R$ to be a convention in a population $P$:
  1.  **Regularity:** Everyone (mostly) conforms to $R$.
  2.  **Expectation:** Everyone expects everyone else to conform to $R$.
  3.  **Preference:** Everyone prefers to conform to $R$ *on the condition* that others do (coordination).
  4.  **Arbitrariness:** There is an alternative $R'$ that could have solved the problem just as well.

  **The Fit:**
  *   **Arbitrariness:** This fits well. The U.S. model (pedestrians yield) contrasts with the Northern European model (cars yield to pedestrians at crossings). Both solve the coordination problem of traffic flow; neither is physically necessary.
  *   **Regularity & Expectation:** This is where the case fractures. In some U.S. jurisdictions, the regularity holds (suburban areas). In others (New York City, Boston), the *law* prohibits jaywalking, but the *regularity* is to cross mid-block when safe. If the law says "wait" but the behavior is "cross," and drivers expect "cross," then the *convention* is actually to jaywalk, and the *statute* is a dead letter.
  *   **Coordination Problem:** Traffic is inherently a coordination problem. However, the *nature* of the problem was redefined. Before the 1920s, the "street" was a mixed-use space. The auto lobby didn't just solve a coordination problem; they *created* a specific type of coordination problem (how to maximize car velocity) by redefining the space.

  **The Disqualification (Origin Story):**
  Does the origin as a project of one interested party disqualify it?
  *   **Strict Lewisian View:** No. Lewis is concerned with the *current* state of expectations and preferences, not the genealogy. If the norm is now self-sustaining through mutual expectation, it is a convention, regardless of whether it started via lobby or spontaneous emergence.
  *   **The Strain:** However, Lewis assumes conventions arise because agents *need* a solution to a shared problem. The jaywalking case suggests a convention can be *imposed* to solve a problem for *one party* (drivers) while creating an inconvenience for another (pedestrians).
  *   **Where the Account is Silent:** Lewisian theory has no vocabulary for **power asymmetry**. It treats agents as roughly equal coordinators. It cannot distinguish between a norm that emerges from mutual benefit and a norm that emerges from hegemony. If the "expectation" is sustained by fear of injury or fines rather than a preference for coordination, the theory struggles to categorize it. It looks less like a convention and more like a **coercive equilibrium**.

  ### 2. Obligation and Violation: "On the Books" vs. In Practice

  You ask: *If it does fit, what does that show about whether conventions obligate us, given that this one is on the books yet widely violated?*

  **The Analysis:**
  If we accept the Lewisian account, obligation is derived from the **reliance interests** of others. I am obligated to follow the convention because my violation frustrates your expectations and risks the collapse of the coordination (e.g., an accident).

  *   **The Mismatch:** If a law exists but is widely violated, the *legal statute* is not the *convention*. The convention is whatever people actually do and expect.
      *   *Scenario A:* In a city where no one jaywalks, the convention is "wait." Violation creates danger and frustration. Obligation is strong.
      *   *Scenario B:* In a city where everyone jaywalks and drivers expect it, the convention is "cross with care." Here, strictly obeying the law (waiting for a signal where none are needed) might actually *violate* the convention by confusing drivers.
  *   **Implication for Obligation:** This suggests that under a convention theory, **legal obligation and normative obligation can diverge.** The fact that the law is "on the books" is irrelevant to the conventional obligation. The obligation tracks the *actual* regularity.
  *   **Where the Account is Silent:** The theory explains why we should coordinate, but it does not explain why we should obey a *law* that fails to capture the convention. It is silent on the moral weight of the statute itself. If the convention is to jaywalk, but the law forbids it, Lewis tells you to follow the convention to avoid accidents. He does not tell you whether you have a civic duty to reform the law or a moral duty to obey the text despite the practice.

  ### 3. The Visitor: What Does She Owe?

  You ask: *What does the account say about a pedestrian visiting from a city where crossing mid-block is unremarkable, who arrives somewhere it is illegal and locally frowned upon?*

  **The Analysis:**
  *   **The Obligation:** Under a strict convention theory, the visitor owes **conformity to the local regularity.** If the local population expects pedestrians to wait, the visitor should wait. This is not because the auto lobby was right in 1925, but because failing to conform creates a coordination failure (danger/inefficiency).
  *   **The History:** The theory dictates that the *origin* of the norm (the auto lobby campaign) is irrelevant to the visitor's current obligation. The fact that the norm is the "residue of a successful campaign" does not diminish the coordination need *now*.
  *   **The Strain:** This feels counterintuitive. If the visitor knows the norm is arbitrary and imposed by a special interest, does she still owe conformity?
      *   *Lewisian Answer:* Yes, if non-conformity risks the coordination equilibrium.
      *   *Critical Answer:* No, if the norm is illegitimate.
  *   **Where the Account is Silent:** This is the most significant silence. Convention theory is **conservative**. It validates the status quo of behavior. It cannot account for **normative critique**. It cannot tell the visitor, "You are right to ignore this norm because it is the product of lobbying, not shared benefit." It treats all stable equilibria as functionally equivalent. It lacks a theory of *justice* or *legitimacy*.

  ### 4. Summary for the Paper

  To run the analysis in both directions as you requested, you can structure the argument around these tensions:

  1.  **Convention as Description vs. Law as Prescription:**
      *   *Argument:* Jaywalking laws often fail to be conventions because they lack the "mutual expectation" component. Where they are widely violated, they are merely laws, not conventions.
      *   *Insight:* This shows that a theory of convention cannot explain legal obedience where the convention has collapsed.

  2.  **The Genealogy Problem:**
      *   *Argument:* The auto lobby origin challenges the "shared problem" criterion. It was a solution to a *driver's* problem imposed on *pedestrians*.
      *   *Insight:* This reveals that Lewisian theory is blind to power. It assumes conventions are democratic; jaywalking shows they can be colonial.

  3.  **The Visitor's Dilemma:**
      *   *Argument:* The theory says the visitor must conform to local expectations for safety/coordination, ignoring the history.
      *   *Insight:* This highlights the limit of convention theory: it explains *prudence* (don't get hit, don't confuse drivers) but not *political obligation* (do I owe this rule respect?).

  **Conclusion on the Theory's Limits:**
  You should conclude that the jaywalking case demonstrates that **convention theory is necessary but insufficient** for analyzing traffic norms.
  *   It is **necessary** to explain why we coordinate at all (arbitrariness, expectation).
  *   It is **insufficient** because it cannot distinguish between a convention that serves the common good and one that serves a hegemon, nor can it guide action when the Law and the Convention diverge.

  If you stretch the theory to say "Jaywalking is a convention, therefore we must obey it," you ignore the power dynamics. If you stretch it to say "It's not a convention because it was lobbied," you ignore the functional reality that people do coordinate around it. The honest philosophical move is to say: **It is a *coercive* regularity that mimics a convention, and the theory of convention lacks the tools to judge the morality of that mimicry.**
