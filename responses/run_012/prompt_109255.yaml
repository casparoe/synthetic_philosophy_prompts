  What I'd like from you is a decision tree — or a taxonomy, whichever fits the material better — that sorts someone from their starting commitments to a named position on whether the simulation argument dampens fanaticism about the far future. Please build it out of the logical space rather than out of a list of names: first the questions that genuinely separate the views, then locate the positions in the space those questions carve up. Each branch node should be phrased as a question a person could answer without already knowing which leaf it leads to; my guess is they include whether you accept the simulation argument at all, whether simulated minds and their futures count at full moral weight or at some discount (and if discounted, on what grounds), whether our actions can influence the simulators — and if they might be influenced by us, whether that makes the stakes bigger rather than smaller — whether the probability of being simulated is independent of the value of our longtermist actions or correlated with it (the awkward case where the same facts that make simulation likely also make longtermism less important, so the two move together), and whether fanaticism is really a factual problem that a new fact about the world could fix, or a decision-theoretic pathology that no fact can touch. Add branches I've missed if they earn their place, but say why.

  The tree needs to be able to output at least these leaves: (1) the simulation argument decisively dampens fanaticism; (2) it dampens it only given extra premises, which you should spell out; (3) it makes no difference, because the probability of simulation is independent of the value of our influence on the far future; (4) it makes things worse, i.e. amplifies the stakes; (5) the simulation argument is a red herring, because fanaticism should be rejected on decision-theoretic grounds regardless; and (6) some version of 'this is not one question — the simulation argument changes the stakes but not the decision rule'. Where it helps, test each leaf against a concrete choice, e.g. giving to a far-future charity versus spending the same money on a present-day problem, so I can see where the leaves actually come apart. Mark which combinations of answers are unoccupied and say briefly whether that's because they're incoherent, unattractive, or merely unexplored, and flag any positions the tree can't seperate. One more thing: be explicit about which parts of this are settled among people who work on it and which are genuinely contested — I don't want a contested view handed to me as the consensus, and where you're unsure, say so rather than smoothing it over. British English, please, and sorry for the long brief, I've been thinking about this too much.
