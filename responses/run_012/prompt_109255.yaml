  **Node 1: The Source of Fanaticism**
  *Question:* Is the 'fanaticism' problem (where tiny probabilities of astronomical stakes dominate decision-making) caused primarily by a flaw in our **decision rule** (e.g. Expected Value Theory), or by incorrect **factual estimates** of the stakes involved?
  *   **A. Decision Rule:** The aggregation function itself is pathological; no factual update fixes it. $\rightarrow$ **Leaf 5**
  *   **B. Factual Estimates:** The rule is fine, but our inputs (probabilities $\times$ impact) are wrong. $\rightarrow$ *Go to Node 2*

  **Node 2: Simulation Credence**
  *Question:* Do you assign substantial credence to the Simulation Hypothesis (i.e. is it live possibility that we are in a simulation)?
  *   **A. No:** You treat base reality as the default. $\rightarrow$ **Leaf 3** (SA makes no difference)
  *   **B. Yes:** You accept the trilemma and assign high probability to being simulated. $\rightarrow$ *Go to Node 3*

  **Node 3: Moral Parity**
  *Question:* Do conscious experiences within a simulation possess the same intrinsic moral weight as experiences in base reality?
  *   **A. No (Discount):** Simulated suffering/flourishing counts for less (or zero). $\rightarrow$ **Leaf 1** (Decisively dampens)
  *   **B. Yes (Parity):** A mind is a mind, regardless of substrate. $\rightarrow$ *Go to Node 4*

  **Node 4: Recursive Potential**
  *Question:* If we are in a simulation, is it physically and computationally possible for us to create our own ancestor simulations (nested simulations)?
  *   **A. No (Hard Cap):** Simulations cannot sub-simulate; the future is computationally bounded. $\rightarrow$ **Leaf 2** (Dampens w/ premises)
  *   **B. Yes (Open-Ended):** Nested simulations are possible; astronomical stakes can recur inside the sim. $\rightarrow$ *Go to Node 5*

  **Node 5: Base-Reality Leverage**
  *Question:* Is there a credible mechanism (causal or acausal) by which actions in this simulation could influence the welfare of beings in base reality (or the simulators' goals) with astronomical leverage?
  *   **A. Yes:** We can 'please the gods' or trade with base reality. $\rightarrow$ **Leaf 4** (Amplifies)
  *   **B. No:** We are causally isolated from base reality welfare. $\rightarrow$ *Go to Node 6*

  **Node 6: Correlation of Probability and Value**
  *Question:* Is the probability of being in a simulation independent of the expected value of longtermist interventions, or does being simulated intrinsically lower the efficacy of those interventions (e.g. higher risk of shutdown)?
  *   **A. Independent:** $P(\text{Sim})$ does not change the $EV(\text{Intervention})$ conditional on existence. $\rightarrow$ **Leaf 3** (No difference)
  *   **B. Correlated (Negative):** Being simulated implies a lower ceiling on value (e.g. compute limits, shutdown risk), but not zero. $\rightarrow$ **Leaf 6** (Stakes change, rule same)

  ---

  ### Leaf Descriptions and Test Cases

  Here is how each terminal position translates into action, using your concrete choice: **£1,000 to a far-future existential risk charity vs. £1,000 to alleviate present-day suffering.**

  #### Leaf 1: The Simulation Argument Decisively Dampens Fanaticism
  *   **Path:** Factual Problem $\rightarrow$ High SA Credence $\rightarrow$ **Moral Discount**.
  *   **View:** If we are simulated, our future beings are 'less real'. Therefore, the astronomical value of the far future shrinks drastically or vanishes. Ordinary morality (present-day suffering) regains dominance.
  *   **Test Case:** You give the £1,000 to **present-day suffering**. The potential future simulated beings do not outweigh the certain real pain now.
  *   **Status:** **Highly Contested.** Moral discounting is rejected by most functionalists and utilitarians working on this (e.g. Bostrom, MacAskill), who argue substrate independence is a core moral intuition.
  *   **Note:** This is the strongest version of your flatmate's view, but it requires the controversial 'Moral Discount' premise.

  #### Leaf 2: Dampens Only Given Extra Premises
  *   **Path:** Factual Problem $\rightarrow$ High SA Credence $\rightarrow$ Moral Parity $\rightarrow$ **No Recursive Potential**.
  *   **View:** Simulated minds count fully, *but* simulations cannot run their own simulations (due to compute limits). The 'stack' stops at us. The future is large, but not *astronomically* large in the way base reality allows.
  *   **Extra Premises Required:** (1) Compute is strictly finite in a way that prevents nesting; (2) Simulators are likely to terminate simulations before they reach post-human status.
  *   **Test Case:** You might split the **£1,000**, or lean towards present-day, because the 'longtermist' multiplier is capped at $10^{20}$ beings rather than $10^{50}$.
  *   **Status:** **Contested.** It is an open empirical question whether a simulation can simulate itself with sufficient fidelity to create conscious ancestors.

  #### Leaf 3: Makes No Difference (Independence)
  *   **Path:** Low SA Credence **OR** (High SA Credence $\rightarrow$ Parity $\rightarrow$ Recursive $\rightarrow$ **Independent Value**).
  *   **View:** Either we aren't sims, or if we are, it doesn't matter. Simulated futures can be just as vast and valuable as base futures (via nesting). The EV calculation remains identical.
  *   **Test Case:** You give the £1,000 to the **far-future charity**. The stakes are astronomical regardless of our ontological status.
  *   **Status:** **Dominant View in Longtermism.** Most longtermists who accept SA (e.g. Carl Shulman) argue that simulated future populations can still be vast, preserving the fanaticism.
  *   **Note:** This leaf occupies two distinct entry points (Low Credence vs. High Credence + Parity).

  #### Leaf 4: Amplifies the Stakes
  *   **Path:** Factual Problem $\rightarrow$ High SA Credence $\rightarrow$ Parity $\rightarrow$ Recursive $\rightarrow$ **Base-Reality Leverage**.
  *   **View:** Being in a simulation opens a *new* channel of influence: affecting the simulators. If we can influence base reality (e.g. via acausal trade or signalling), the stakes are no longer just our future, but the *simulator's* future, which is strictly larger.
  *   **Test Case:** You give the £1,000 to a **strategy research fund** designed to signal virtue to simulators or establish acausal trade, rather than standard x-risk reduction.
  *   **Status:** **Fringe/Speculative.** Relies on specific decision theories (FDT/EDT) and theological-style assumptions about simulator motives.
  *   **Unoccupied Note:** If one accepts Base-Reality Leverage, Moral Discount (Node 3) usually becomes irrelevant, as Base Reality value swamps Simulated Value.

  #### Leaf 5: Red Herring (Decision-Theoretic Pathology)
  *   **Path:** **Decision Rule** Flaw.
  *   **View:** Fanaticism is a bug in Expected Value Theory (e.g. sensitivity to Pascal's Mugging). Whether we are simulated or not is a factual input; it does not fix the broken calculator. You need a new decision rule (e.g. bounded utility, risk-weighted EV), not a new cosmology.
  *   **Test Case:** You reject the **£1,000 choice framework** entirely. You adopt a 'satisficing' approach or a cap on utility, giving to **present-day** causes because the far-future EV is truncated by your decision rule, not by SA.
  *   **Status:** **Growing Consensus among Critics.** Philosophers like Hayden Wilkinson and William MacAskill have recently engaged deeply with whether fanaticism is a feature or a bug of EV theory. This is arguably the most robust 'solution' to fanaticism, independent of SA.

  #### Leaf 6: Changes Stakes But Not Decision Rule
  *   **Path:** Factual Problem $\rightarrow$ High SA Credence $\rightarrow$ Parity $\rightarrow$ Recursive $\rightarrow$ **Correlated Negative Value**.
  *   **View:** We are probably sims. Simulated futures are valuable and can nest, *but* they are slightly more fragile (risk of shutdown) or slightly less valuable than base reality. The EV is reduced (e.g. by an order of magnitude), but still dominates present-day concerns.
  *   **Test Case:** You give the £1,000 to the **far-future charity**, but you feel less confident about it. The 'fanaticism' pressure is slightly lower, but not low enough to change the action.
  *   **Status:** **Nuanced/Unexplored.** Most debate is binary (Dampens vs. Doesn't). This 'partial dampening' position is logically coherent but rarely defended as a distinct endpoint.

