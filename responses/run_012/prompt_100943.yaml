  **JOINT STATEMENT ON INDIVIDUAL DUTIES AND COLLECTIVE HARMS**

  **I. Agreed Claims**
  1.  **Causal Structure:** We agree that in large-scale collective harms (e.g., climate change, industrial agriculture), single acts are typically causally overdetermined or probabilistically negligible regarding specific harm outcomes. The counterfactual profile of a single act is rarely determinate.
  2.  **Thresholds and Margins:** We agree harmful practices often operate via thresholds (e.g., production batches), where a specific quantity triggers a discrete unit of harm. However, individual agents rarely know their position relative to these margins.
  3.  **Causation vs. Implication:** We distinguish "causing harm" (making a counterfactual difference to an outcome) from "being implicated in harm" (knowingly participating in or benefiting from a harmful practice).
  4.  **Verbal Dispute:** We acknowledge that "duty" is used causally by Side A (outcome-based) and attributively by Side B (integrity-based). We bracket this terminology to focus on the action-guiding question: *Is there an obligation to abstain?*

  **II. Remaining Disagreements and Crux**

  | Issue | Side A (Causal Negligibility) | Side B (Complicity/Participation) | Crux Case Predictions |
  | :--- | :--- | :--- | :--- |
  | **Moral Ground** | Obligation depends on expected utility. If an act makes no expected difference, no obligation exists. | Obligation depends on participation. Joining a harmful practice incurs duty regardless of marginal impact. | **Case:** A good is produced in batches of 1,000. One batch triggers one unit of harm. Current count is unknown. |
  | **Epistemic Uncertainty** | Uncertainty reduces expected utility. Without knowledge of threshold proximity, duty is diluted by probability. | Uncertainty is irrelevant. The risk of complicity is sufficient to bind the agent; ignorance does not excuse participation. | **Side A:** Duty exists *only if* (1/1000 × Harm) > Cost of Abstention. Likely no duty. |
  | **The Crux** | The act is permissible unless it is probable enough to cross a threshold to outweigh personal cost. | The act is impermissible because it constitutes joining the practice, regardless of threshold probability. | **Side B:** Duty exists unconditionally. Purchasing joins the harmful scheme. |
  | **Shared Concession** | \multicolumn{3}{l|}{Both agree: If it were *known* the purchase crossed the threshold (e.g., 999/1000), duty exists for both sides. The dispute rests entirely on the *uncertainty* condition.} |

