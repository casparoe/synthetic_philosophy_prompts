answer: |-
  # The Unilateralist's Decision Tree

  **Instructions:** Start at Node 1. Answer based on the empirical facts of the situation, not your preferred moral theory. Follow the branch to the next node or a terminal Leaf.

  ### Node 1: Value Trajectory
  **Question:** If you act, does the marginal value of the *next* person acting decrease (e.g., redundant research, duplicate leaks), or increase (e.g., network effects, critical mass protests)?
  *   **Decreases (The Curse):** Go to Node 2.
  *   **Increases (The Mirror):** Go to Node 2 (Note: Invert all subsequent value judgments; "harm" becomes "missed opportunity").

  ### Node 2: Harm Topology
  **Question:** Is the negative outcome caused by *each* additional act adding friction (continuous drag), or only if the *total number* of acts crosses a specific cliff (threshold trigger)?
  *   **Continuous Drag:** Go to Node 3.
  *   **Threshold Trigger:** Go to Node 4.

  ### Node 3: Epistemic Coupling
  **Question:** If your calculation of "net positive value" is wrong, is it likely wrong for the *same reasons* as everyone else's (e.g., shared bias, same data source), or for independent idiosyncratic reasons?
  *   **Correlated Error (Shared Bias):** Go to Node 5.
  *   **Independent Error (Diverse Bias):** Go to Leaf A (Act-Anyway).

  ### Node 4: Visibility & Timing
  **Question:** Can other potential actors observe your intent or action *before* they must make their own decision?
  *   **Observable (Signaling Possible):** Go to Node 6.
  *   **Opaque (Simultaneous/Hidden):** Go to Node 5.

  ### Node 5: Payoff Plasticity
  **Question:** Is it feasible to alter the environment to make the action detectable, costly, or reversible *before* anyone acts (e.g., technical locks, social norms)?
  *   **Malleable:** Go to Leaf B (Structural Engineering).
  *   **Fixed:** Go to Leaf C (Conformity Restraint).

  ### Node 6: Vesting Feasibility
  **Question:** Is there a low-cost mechanism to hand decision rights to a single authority or a joint vote (e.g., a project lead, a DAO, a quick poll)?
  *   **Feasible:** Go to Leaf D (Coordinated Vesting).
  *   **Infeasible:** Go to Leaf E (The Visibility Trap).

  ### Node 7: Causal Precedent (Only reached if Node 3 = Independent Error)
  **Question:** Does performing this act causally trigger similar acts by others (e.g., breaking a norm, opening a tool) regardless of the act's intrinsic value?
  *   **Strong Precedent Effect:** Go to Leaf F (The Precedent Blind Spot).
  *   **Weak Precedent Effect:** Go to Leaf A (Act-Anyway).

  ### Node 8: Reversibility (Only reached if Node 2 = Threshold Trigger)
  **Question:** If the threshold is crossed and the outcome is bad, can the individual contributions be withdrawn to reverse the outcome?
  *   **Reversible:** Go to Leaf G (Threshold Mobilization).
  *   **Irreversible:** Go to Leaf C (Conformity Restraint).

  ---

  ## The Leaves (Positions)

  ### Leaf A: Act-Anyway (Naive Rationality)
  **Path:** Curse → Continuous → Independent Error → Weak Precedent.
  **Position:** Proceed if your expected value is positive.
  **Diagnosis:** This position assumes the "curse" is illusory because errors cancel out. It is coherent only if agents are epistemically independent. In practice, this leaf is rarely occupied by rationalists because shared context usually implies correlated error (Node 3).

  ### Leaf B: Structural Engineering (Mechanism Design)
  **Path:** Curse → Continuous/Threshold → Fixed Visibility → Malleable Payoffs.
  **Position:** Do not decide the act yet; first change the game. Make the action detectable, expensive, or reversible.
  **Diagnosis:** This is the "institutional structure" answer. It argues the failure is not in decision rules but in the payoff matrix. It is often overlooked because it requires upfront coordination cost to implement the structure.

  ### Leaf C: Conformity Restraint (The Standard Solution)
  **Path:** Curse → Continuous → Correlated Error → Fixed Payoffs OR Mirror → Threshold → Irreversible.
  **Position:** Raise the bar. Act only if the value is robust enough to remain positive even if others act too.
  **Diagnosis:** The Bostrom/Christiano standard. It treats the decision rule as the locus of failure.
  **Flag (Indistinguishable):** In cases of **High Visibility** (Node 4), Conformity Restraint and Coordinated Vesting (Leaf D) often produce identical behavior (one person acts, others wait). The tree cannot separate them here because the *outcome* is the same, even if the *justification* (self-restraint vs. delegation) differs.

  ### Leaf D: Coordinated Vesting (The Political Solution)
  **Path:** Curse → Threshold → Observable → Vesting Feasible.
  **Position:** Keep the act's value threshold low, but do not act unilaterally. Declare intent, poll peers, or vest the right in one authority.
  **Diagnosis:** This solves the curse by converting $N$ decision-makers into 1. It requires Node 4 (Visibility) and Node 6 (Vesting Feasibility). If visibility is low, this collapses into Conformity Restraint.

  ### Leaf E: The Visibility Trap (Unoccupied Coherent Combination)
  **Path:** Curse → Threshold → Observable → Vesting Infeasible.
  **Position:** *Theoretically:* Act if you can signal intent to deter others, but without formal authority. *Actually:* Nobody occupies this leaf.
  **Diagnosis:** This is the "Gentleman's Agreement" zone. It is coherent but unstable. Without formal vesting (Node 6), signaling intent is cheap talk; others may doubt your commitment or race you anyway. Rationalists avoid this because it relies on honor in a prisoner's dilemma.

  ### Leaf F: The Precedent Blind Spot (Unoccupied Coherent Combination)
  **Path:** Curse → Independent Error → Strong Precedent.
  **Position:** *Theoretically:* Act anyway because your error is unique, ignoring the precedent effect. *Actually:* Nobody occupies this leaf.
  **Diagnosis:** This combination is logically possible (my error is mine, but my action inspires you) but practically unoccupied. If an agent recognizes a Strong Precedent Effect (Node 7), they almost invariably revert to Conformity Restraint or Structural Engineering. To act anyway here is to admit you are setting a bad rule for others while exempting yourself—a position too hypocritical for public rationalist discourse.

  ### Leaf G: Threshold Mobilization (The Mirror Case)
  **Path:** Mirror → Threshold → Reversible.
  **Position:** Act aggressively to reach the critical mass. The risk is under-action, not over-action.
  **Routing Note:** This leaf confirms the tree routes the Mirror Case through the **same nodes** (Topology, Reversibility), but the valuation inverts. Where the Curse demands restraint (Leaf C), the Mirror demands mobilization. However, if the Mirror Case is **Irreversible** (Node 8), it routes back to Conformity Restraint (Leaf C), because crossing a dangerous threshold (e.g., risky geoengineering) requires the same caution as the Curse.

  ---

  ## Diagnostic Notes for the Whiteboard

  **1. The Indistinguishability Flag (Leaves C & D):**
  When **Visibility is High** (Node 4), *Conformity Restraint* and *Coordinated Vesting* become behaviorally identical. Both result in one agent acting and others holding back. The tree flags this because participants often argue over the *principle* (humility vs. democracy) when the *case facts* dictate the same outcome. Do not waste time debating doctrine here; check Node 6 (Vesting Feasibility). If vesting is costly, default to Conformity.

  **2. The Unoccupied Space (Leaf E & F):**
  Notice that no stable leaf exists for "Informal Coordination" (Leaf E) or "Precedent-Ignoring Action" (Leaf F).
  *   **Leaf E** is empty because signaling without authority is not binding.
  *   **Leaf F** is empty because recognizing a precedent effect creates a duty of conformity.
  *   **Why this matters:** If your group finds itself arguing for one of these positions, you are likely in a transitional state. You are either trying to build authority (moving toward Leaf D) or rationalizing exceptionalism (moving toward Leaf A).

  **3. The Mirror Routing:**
  The tree treats the Mirror Case (Valuable-Many) as a valuation flip on Node 1, but preserves the structural constraints. This highlights that **Irreversibility** (Node 8) is the great equalizer: whether the action is good-once/bad-many or bad-once/good-many, if it cannot be undone, the decision rule defaults to Conformity Restraint (Leaf C). This distinction rarely makes standard summaries, which often treat the Mirror Case as purely the inverse of the Curse.
