answer: |-
  Here is an analysis of your board's precedents, the rules they have accidentally written, and how they should handle the seventh case to maintain consistency—or to expose the hypocrisy beneath it.

  ### The Hidden Rules (Derived from Cases 1–6)

  You have written six decisions that feel maddening because the Board is not applying a moral calculus; they are applying a **topographical** one. They are not judging the sin; they are judging the location of the memorial relative to the sin.

  1.  **The Proximity Principle:** A name or statue is removed only if the memorial stands on or immediately adjacent to the site where the harm occurred.
      *   *Evidence:* Case 1 (Statue at corner of works) and Case 6 (Square outside the Board building) were removed. Cases 2, 3, 4, and 5 were retained because the street, school, fountain, and memorial were not the sites of the novelist's predation, the poet's abandonment, the child labour, or the veterans' crimes.
  2.  **The State Harm Exception:** If the harm was inflicted by the state (violence or coercion), the Board is more likely to act, but only if Rule 1 is also satisfied.
      *   *Evidence:* Case 1 (State violence) and Case 6 (State coercion) resulted in removal. Case 4 (Private economic exploitation) did not.
  3.  **The Functionality Constraint:** Working institutions (schools, health centres) are treated with more deference than ornamental spaces (statues, squares), unless the function is ironically tainted by the harm.
      *   *Evidence:* Case 3 (School) was left alone ("not courts"). Case 5 (War Memorial) was left alone ("not character certificate").

  ### Predictions for Case 7 (The Health Centre)

  *   **Under the Proximity Principle:** The name stays. The sterilisations were authorised at the old institution (now a retail park), not the current health centre. This aligns with Cases 2, 3, 4, and 5.
  *   **Under the State Harm Exception:** The name goes. The MOH ran a state sterilisation programme, identical to the doctor in Case 6. This aligns with Cases 1 and 6.
  *   **Under the Functionality Constraint:** The name stays. It is a working health centre, staff are indifferent, and changing it disrupts patients. This aligns with Case 3.

  ### The Closest Analog

  **Case 6 (The Doctor's Square)** is the closest moral analog, but **Case 3 (The Poet's School)** is the closest functional analog.

  However, **Case 6** is the binding precedent regarding the *specific harm* (sterilisation). The Board already established that promoting compulsory sterilisation is disqualifying for public honour. The only distinction is that in Case 6, the square was outside the building where the board sat, whereas in Case 7, the centre is not on the site of the old institution.

  ### Recommendation: What the Board Should Do

  If the Board wishes to be consistent with its own **Proximity Principle** (which governs 100% of their removals vs. retentions), they must **retain the name**.

  **The Decision:** The name stays on the building. However, following the precedent of Case 2 (the Novelist's Street), they should commission an explanatory plaque for the lobby.

  **The Justification:**
  To remove the name now would be to admit that their previous decisions (Cases 2–5) were cowardly. They have established a rule that geography dictates memory. If they remove the name from a building where no sterilisations took place, they invalidate the retention of the Novelist's street and the Mill Owner's fountain. They must stick to the rule that the plinth is only guilty if it stands on the grave of the victim.

  Furthermore, the threat from the Family Trust introduces a variable the Board has not yet faced: financial leverage. In Case 4, the Mill Owner's gift was honoured separate from the giver. Here, the Trust's money is attached to the name. Removing the name kills the research post. By keeping the name, the Board prioritises the utility of the building (Case 3) and the continuity of funding (a pragmatic evolution of Case 4), whilst acknowledging the harm via a plaque (Case 2).

  **The Narrative Cost:** This decision confirms that the Board cares more about *where* a thing stands than *what* it stands for. It is a defensible position, but a cold one. It suggests that if the sterilisation clinic had been built two streets over, the victims would be denied justice.

  ### The Next Case (To Force a Choice)

  To break this consistency and force the Board to choose between the **Proximity Principle** and the **State Harm Exception**, you need a case where the location demands removal, but the harm is private—or vice versa.

  **Write this next:** A statue of the Novelist (from Case 2) is discovered to have been erected in the garden of the house where he abused the young women.
  *   **The Conflict:** The Proximity Principle demands removal (it is on the site of the crime, like Case 1 & 6). The Private Harm precedent demands retention (like Case 2).
  *   **The Choice:** Does the Board admit that location trumps the nature of the crime? Or do they admit that some crimes are too private for public erasure, even on site?

  Alternatively, to challenge the **Functionality Constraint**: A wing of the local hospital is named after the General from Case 1.
  *   **The Conflict:** He killed citizens (State Harm), but it's a working hospital (Functionality). Is healing the wounded by a man who wounded people ironic enough to warrant removal?

  ### Addressing Your Characters' Theories

  **1. "The plinth forgets and the vitrine remembers."**
  This is currently the Board's operating system, though they haven't admitted it.
  *   **Plinth (Public Space):** When a name is on a plinth (or street sign) *on the site of harm*, it is removed to the vitrine (museum/archive) where context can be added (Cases 1 & 6).
  *   **Vitrine (Context):** When the name is elsewhere, it stays on the plinth because the context is deemed unnecessary (Cases 2–5).
  *   **Verdict:** This theory is accurate. The Board believes public honour is only dangerous when it is geographically linked to the shame.

  **2. "Every naming to work like a leasehold."**
  This principle is not yet in evidence. None of the six decisions mention time limits or renewals.
  *   **Verdict:** This is a radical proposal that contradicts the Board's historical approach. If adopted now, it would invalidate all previous permanent decisions. It is a good tool for a character who wants to dismantle the Board entirely, but it is not the rule they are currently running.

  ### Summary for the Seventh Decision

  **Outcome:** Retain the name. Install a plaque.
  **Reasoning:** Consistency with the Proximity Principle (Cases 2–5) and the Functionality Constraint (Case 3).
  **British English Note:** Ensure the Board's minutes refer to the "programme," the "centre," and the "honour" of the gift. The plaque should be described as being in the "lobby" or "entrance hall," not the foyer (unless it's a theatre), and the Trust should be warned that funding is a "matter for the council," not a bargaining chip.

  This outcome keeps your Board consistent but morally ambiguous. They are protecting the living patients and the research money, but they are also protecting themselves from having to admit that their previous rules were arbitrary. It leaves the survivors' group angry, which is excellent fuel for your plot.
