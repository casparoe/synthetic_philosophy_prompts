          *   (b) Is there a rule of thumb for how much approval signal can be used before it becomes just another optimization goal?
          *   (c) Is it a problem that reviewers only see the diff/ticket, not downstream breakage (delayed feedback)?
      *   **Underlying Assumption:** The user believes "Approval-Directed" simply means "Optimize for Human Approval Score." This is a common misconception that needs addressing gently but firmly.

  2.  **Deconstruct the Misconception (ADA vs. GDA):**

