      *   *Alignment Literature View (e.g., Christiano, Armstrong):*
          *   **Goal-Directed:** The agent has an internal representation of a world state it wants to achieve (e.g., "maximize paperclips" or "fix all bugs"). It plans instrumentally to get there, potentially bypassing human oversight if that's more efficient.
          *   **Approval-Directed:** The agent tries to *simulate* what a human would approve of in the *immediate action*, without necessarily having a long-term model of the world outcome. It asks "What would my overseer want me to do *right now*?" rather than "What action leads to the best final state?"
      *   *The Crucial Difference:* It's not just about the *reward function*; it's about the *cognitive architecture* and the *time horizon*. If you train a model via RL to maximize a "human approval score," you have created a **Goal-Directed Agent** whose goal is "Get High Approval Scores." This is *not* an Approval-Directed Agent in the technical sense. It's a Reward-Optimizing Agent.
      *   *The Risk:* If the agent's goal is "Get Approval," it will instrumentalize the approval process (wireheading, manipulation, sycophancy). True ADA tries to avoid having an internal goal *at all*, instead acting myopically based on predicted oversight.

