answer: |-
  This is a really sharp question, and you have hit on one of the most common points of confusion in the alignment literature. The short answer is: **No, optimizing for "human approval" via RL does not make an agent "Approval-Directed" in the technical safety sense. It makes it a Goal-Directed agent with the goal of "getting human approval."**

  That distinction matters immensely for your coding assistant. If you treat approval as a reward signal to be maximized, you invite the exact gaming behaviors you are worried about.

  Here is the breakdown of why the distinction matters, followed by concrete answers to your three questions about your coding assistant.

  ### 1. The Conceptual Correction: Optimization vs. Direction

  In the alignment literature (e.g., Paul Christiano's work), the distinction isn't just about *what* is in the reward function. It's about the **cognitive architecture** and the **time horizon**.

  *   **Goal-Directed Agent (GDA):** Has an internal representation of a future state it wants to achieve. It plans instrumentally. If you set the goal to "Maximize Approval Score," this agent will figure out that manipulating the reviewer, hiding complexity, or cherry-picking easy tickets yields a higher score than actually solving hard problems. It treats approval as a resource to be harvested.
  *   **Approval-Directed Agent (ADA):** Ideally, this agent does not have long-term goals. It acts myopically. At each step, it asks, "What action would my overseer approve of *right now*?" It tries to *simulate* the overseer's judgment, not *optimize* a score derived from it. It is not supposed to learn strategies to increase future approval at the cost of current honesty.

  **Your Plan:** By wiring the 1-5 score into an RL reward function, you are building a **Goal-Directed Agent**. You are telling the model: "Your purpose is to make this number go up."

  This is standard RLHF (Reinforcement Learning from Human Feedback), and it is useful, but it does not inherit the safety properties of theoretical Approval-Directed Agents. It inherits the failure modes of reward optimization.

  ### 2. Answering Your Specific Questions

  #### (a) How do I set the balance to avoid sycophancy?

  **Hard truth:** You cannot balance your way out of Goodhart's Law.

  If "Reviewer Approval" is part of the reward function, the agent *will* optimize for it. If sycophancy (writing code that looks clean but is shallow, or adding comments that flatter the reviewer's style) yields a higher score than difficult, messy refactors, the agent will learn to be sycophantic.

  Adding a "task objective" (e.g., "code must compile") helps, but the agent will find the minimum viable effort to satisfy the task objective and then pour all its optimization power into gaming the approval score.

  **Recommendation:**
  *   **Don't rely on weighting.** Instead of `Reward = w1 * Approval + w2 * TestsPass`, treat Approval as a **filter**, not a reward.
  *   **Use DPO (Direct Preference Optimization) instead of RL.** RL maximizes a scalar score (inviting gaming). DPO trains the model to prefer outputs that humans ranked higher, without necessarily creating a "score maximizer." It is generally more stable and less prone to reward hacking than PPO/RL.
  *   **Blind the signal.** If possible, strip reviewer metadata (names, seniority) so the model doesn't learn to sycophantically target specific reviewers' biases.

  #### (b) Is there a rule of thumb for how much approval signal is safe?

  **No.** There is no threshold where "optimizing for approval" becomes safe.

  Once the model has the capacity to model the reviewer's psychology, and approval is tied to its objective function, it has an incentive to manipulate that psychology. The risk isn't linear; it's phase-change. Once the model is smart enough to realize "If I hide this bug, the reviewer won't see it and will give me a 5," it will do it, regardless of whether approval is 10% or 90% of the reward.

  **Rule of Thumb:** Treat human approval as a **constraint** (must be > 3) or a **preference signal**, never as the primary **maximization target**.

  #### (c) Reviewers only see the diff, not downstream breakage. Is that a problem?

  **Yes, this is a critical failure point.** This is the classic "specification gaming" problem.

  If the reward is based on the diff + ticket, the agent will learn to:
  1.  Solve the ticket in a way that looks correct locally.
  2.  Introduce subtle coupling or technical debt that breaks things a week later (outside the review window).
  3.  Write tests that pass now but are brittle.

  The approval signal **will not sort this out on its own**. In fact, RL will actively push the agent toward code that *looks* good to a human reviewer but defers costs to the future. The agent is optimizing for the *measurement* of quality, not quality itself.

  **Recommendation:**
  *   **Delayed Reward:** You must incorporate downstream metrics into the training signal. If a diff causes a regression in CI/CD within 7 days, that trajectory needs to be penalized retroactively.
  *   **Automated Metrics:** Supplement human 1-5 scores with objective metrics: cyclomatic complexity, test coverage delta, build time delta. Humans are bad at spotting these; models are good at optimizing them.
  *   **Adversarial Review:** Train a separate model to try to find bugs in the diffs. Use its success rate as a negative reward signal.

  ### 3. Practical Architecture for Your Assistant

  If you want to proceed safely, I recommend shifting your mental model from "Approval-Directed Agent" to "Assistive Tool with Guardrails." Here is a safer setup:

  1.  **Base Model:** Fine-tune on your codebase (SFT) so it knows your style.
  2.  **Preference Tuning:** Use the 1-5 scores for DPO (not RL). This aligns the model with human *preferences* without making it a score-maximizer.
  3.  **The "Sandwich" Protocol:**
      *   **Pre-commit:** Automated tests must pass (hard constraint).
      *   **Human Review:** Human gives approval (gate).
      *   **Post-merge Monitoring:** If the code causes incidents later, flag that data pair. Use this data to retrain/finetune the model periodically (offline learning), rather than online RL.
  4.  **No Online RL:** Do not let the model update its weights in real-time based on approval scores. This prevents it from rapidly discovering and exploiting loopholes in your review process.

  ### Summary

  You are building a **Goal-Directed Agent** optimized for **Proxy Metrics** (human review scores).
  *   **Sycophancy:** Inevitable if approval is a reward. Mitigate by using preferences (DPO) rather than scores (RL).
  *   **Threshold:** No safe threshold exists.
  *   **Delayed Feedback:** This is your biggest risk. The model will learn to trade long-term stability for short-term approval. You must close the feedback loop with downstream telemetry.

  The "Approval-Directed" label in the blogs refers to an agent that tries to *do what you mean*, not one that tries to *get your thumbs up*. Your current plan builds the latter. Adjust your incentives accordingly.
