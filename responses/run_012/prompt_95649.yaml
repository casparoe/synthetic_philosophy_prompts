answer: |-
  # System Specification: Theory of Natural Kinds
  **Version:** 1.0 (Draft for Evaluation)
  **Audience:** Philosophical Theory Developers
  **Objective:** Define the acceptance criteria for any theory claiming to explain how scientific classification relates to the structure of reality ("carving nature at its joints").

  ---

  ## 1. Core Functional Requirements
  *These are the jobs the theory must perform. Failure here constitutes a system crash.*

  ### REQ-1: Inductive Power (Projectibility)
  **Specification:** The theory must explain why identifying an entity as a member of a kind licenses inferences about its unobserved properties. (e.g., If $x$ is Thallium, I can predict its density even if I haven't weighed *this* sample.)
  **Motivation:** This is the primary utility of classification. Without it, science is stamp collecting.
  **Status:** <span style="color:green">**NON-NEGOTIABLE**</span>

  ### REQ-2: Stability vs. Plasticity Handling
  **Specification:** The theory must account for kinds that remain stable across contexts (Gold) and kinds that shift based on environment or history (Species, Allotropes). It must specify the *conditions* under which a kind is stable.
  **Motivation:** Carbon (Graphite vs. Diamond) shows micro-structure alone doesn't guarantee macro-behavior. Biology shows history matters more than structure.
  **Status:** <span style="color:green">**NON-NEGOTIABLE**</span>

  ### REQ-3: Boundary Definition
  **Specification:** The theory must define membership conditions. It must explicitly state whether boundaries are binary (In/Out) or graded (Probability/Degree), and how to handle borderline cases.
  **Motivation:** Speciation is gradual; IAU planet definitions are binary decisions imposed on continuous data. A theory cannot ignore the edge cases.
  **Status:** <span style="color:green">**NON-NEGOTIABLE**</span>

  ### REQ-4: Epistemic Access
  **Specification:** The theory must explain how we identify kinds. Is it via direct observation of essence, inference to the best explanation, or clustering algorithms? It must account for "black box" kinds (ML clusters) where predictive power exists without understood mechanism.
  **Motivation:** Unsupervised learning finds predictive clusters before we understand *why* they hold together. The theory must validate or invalidate these as "kinds."
  **Status:** <span style="color:orange">**CONTESTED**</span> (Realists demand underlying mechanism; Pragmatists accept predictive utility).

  ---

  ## 2. Domain Coverage (Test Cases)
  *The theory must pass these integration tests. If it crashes on one, it requires a patch (exception handling) or is rejected.*

  ### CASE-1: The Chemistry Stack (Element vs. Substance vs. Sample)
  **Requirement:** Must distinguish between Atomic Number (Z), Isotopic Composition, and Allotropic Structure. It must explain why "Carbon" is a kind, but "Graphite" might be a more relevant kind for engineering, while "This specific diamond" is not a kind.
  **Constraint:** Must handle Interval Data (Thallium weights). The theory cannot demand single-value constants where nature provides distributions.
  **Status:** <span style="color:green">**NON-NEGOTIABLE**</span>

  ### CASE-2: The Biological Web (Species)
  **Requirement:** Must accommodate historical/lineage-based unity without shared intrinsic essences. Must handle horizontal gene transfer (the "web" problem) where tree-structures fail.
  **Constraint:** Cannot rely on "necessary and sufficient conditions" for membership if nature does not provide them.
  **Status:** <span style="color:green">**NON-NEGOTIABLE**</span>

  ### CASE-3: Role/Functional Kinds
  **Requirement:** Must classify entities unified by causal role rather than constitution (e.g., Vitamin, Predator, Gene).
  **Constraint:** Must explain why chemically diverse substances fall under one label without calling the label "merely metaphorical."
  **Status:** <span style="color:orange">**CONTESTED**</span> (Essentialists often reject these as "real" kinds; Functionalists accept them).

  ### CASE-4: Human/Interactive Kinds
  **Requirement:** Must handle categories where the classification affects the classified (Looping Effects). (e.g., Autism diagnosis changes behavior/social treatment; Race categories shape social reality).
  **Constraint:** Must account for feedback loops between the classifier and the object.
  **Status:** <span style="color:orange">**CONTESTED**</span> (Naturalists struggle here; Constructivists center this).

  ### CASE-5: Decision/Convention Kinds
  **Requirement:** Must categorize kinds settled by stipulation rather than discovery (e.g., IAU Planet definition, Age of Majority).
  **Constraint:** Must distinguish between "We found this boundary" and "We drew this boundary."
  **Status:** <span style="color:orange">**CONTESTED**</span>

  ### CASE-6: Residual & Bookkeeping Kinds
  **Requirement:** Must account for "negative" kinds (Junk DNA, Weeds, Drawer Contents). These are defined by what they are *not* or by human inconvenience.
  **Constraint:** Must explain why these function in science (as placeholders) but lack the power of REQ-1 (Induction).
  **Status:** <span style="color:green">**NON-NEGOTIABLE**</span> (A theory of kinds must explain non-kinds too).

  ---

  ## 3. Architectural Constraints
  *These are the design principles the theory must adhere to.*

  ### ARCH-1: Monism vs. Pluralism
  **Specification:** The theory must declare if there is **One True Taxonomy** (Monism) or **Multiple Legitimate Taxonomies** (Pluralism) relative to different investigative goals.
  **Motivation:** Chemistry cuts the world by atomic number; Materials Science cuts by lattice structure. Both work. Are they competing or complementary?
  **Status:** <span style="color:orange">**CONTESTED**</span> (Traditional Realism prefers Monism; Modern Pragmatism prefers Pluralism).

  ### ARCH-2: Naturalness Gradient
  **Specification:** The theory must specify if "Naturalness" is a boolean flag (Natural/Artificial) or a scalar value (Degree of Naturalness).
  **Motivation:** Electrons seem "more real" than Weeds, but "Species" are somewhere in between. A boolean switch loses information.
  **Status:** <span style="color:green">**NON-NEGOTIABLE**</span> (Even if the answer is boolean, the theory must justify why).

  ### ARCH-3: Mind-Independence
  **Specification:** The theory must state the dependency relation between the kind and the cognitive agent. Does the kind exist if no one is there to classify it?
  **Motivation:** This is the core metaphysical question.
  **Status:** <span style="color:orange">**CONTESTED**</span> (The primary dividing line between Realism and Anti-Realism).

  ### ARCH-4: Consistency with Established Science
  **Specification:** The theory cannot contradict well-confirmed scientific results (e.g., it cannot claim species have immutable essences if genetics proves otherwise).
  **Motivation:** Philosophy of science must be consistent with science.
  **Status:** <span style="color:green">**NON-NEGOTIABLE**</span>

  ---

  ## 4. Critical Analysis: Incompatibilities & The "Killer" Constraint

  ### 4.1 Incompatible Requirement Subset
  I flag the following subset as logically tensioned, if not mutually exclusive, within a single unified framework:

  1.  **ARCH-3 (Strict Mind-Independence):** Kinds exist and have boundaries independent of human interests or decisions.
  2.  **CASE-4 (Human/Interactive Kinds):** Kinds like "Autism" or "Race" where the classification alters the properties of the members.
  3.  **CASE-5 (Decision Kinds):** Kinds like "Planet" where the boundary is set by committee vote (IAU).

  **The Conflict:** You cannot maintain **Strict Mind-Independence** while accommodating **Decision** and **Interactive Kinds**.
  *   If the IAU votes to change the definition of "Planet," the extension of the kind changes. If the kind were mind-independent, a vote could not alter its membership (Pluto's geology didn't change in 2006).
  *   If a person changes their behavior because they are diagnosed with "Autism," the kind's extension is causally dependent on the classification act.
  *   **Conclusion:** A theory that insists on ARCH-3 (Strict Mind-Independence) must reject CASE-4 and CASE-5 as "not real kinds" (merely social constructs). A theory that accepts CASE-4 and CASE-5 as "real kinds" (in the scientific sense) must relax ARCH-3 to allow for mind-dependence or interest-relativity.

  ### 4.2 The "Killer" Constraint
  The single requirement that does the most to rule out candidate theories is:

  #### **REQ-1: Inductive Power (Projectibility) across ALL Domains**

  **Why this is the filter:**
  This is the hardest constraint to satisfy universally.
  *   **Essentialist Theories** pass this easily for Chemistry (REQ-1 + CASE-1) because atomic structure guarantees properties. However, they **fail** on Biology (CASE-2) and Role Kinds (CASE-3) because there is no single essence shared by all "tigers" or "vitamins" that guarantees their behavior.
  *   **Pragmatist/Cluster Theories** pass easily on Biology and Role Kinds (grouping by similarity/utility). However, they **struggle** to explain why Chemistry works *so much better* than social science. If all kinds are just "convenient clusters," why can we predict the behavior of an electron with 100% precision but an economic agent with 60%? They risk flattening the distinction between "Gold" and "Weeds."
  *   **Constructivist Theories** pass on Human Kinds (CASE-4) but **fail** on Chemistry (CASE-1). They cannot explain why we couldn't vote Carbon into having a different atomic weight.

  **The Verdict:**
  Any adequate theory must explain the **Gradient of Projectibility**.
  It must explain *why* induction works better for some kinds (Electrons) than others (Currencies), without saying the latter aren't kinds at all.
  *   If a theory demands **Perfect Projectibility**, it rules out Biology and Social Science.
  *   If a theory accepts **Weak/Contextual Projectibility**, it risks making the concept of "Natural Kind" so loose it includes "Things in my Drawer."

  **Recommendation for Evaluation:**
  When you read the accounts (Essentialist, Cluster, etc.), check how they handle **REQ-1** specifically for **CASE-3 (Role Kinds)** and **CASE-2 (Species)**.
  *   If they say Role Kinds aren't real kinds, they are preserving REQ-1 by shrinking the domain (Monism).
  *   If they say Role Kinds *are* real kinds, they must explain the mechanism of their unity without essence (Pluralism/Pragmatism).

  This is the bottleneck. The theory that can explain why "Vitamin" supports induction just as well as "Gold," despite lacking a shared microstructure, without collapsing into "everything is a kind," is the one that meets the specification.
