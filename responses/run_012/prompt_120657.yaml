  # Decision Tree: Units of Selection Logical Space

  **Instructions:** To classify a position, answer the following questions regarding the **Mosaic Colony** case (two unrelated larvae fuse, one gonad, shared vascular, unequal contribution, dissolve/re-fuse next generation). Answer based on your philosophical commitment to how selection *works*, not merely on the biological facts of the colony.

  ### **Node 1: The Ontological Commitment**
  **Question:** When you assert "Selection acts on the Mosaic Colony," are you claiming the colony possesses causal powers that exist independently of our mathematical model, or are you choosing a specific partition of variance for descriptive convenience?
  *   **A.** Descriptive convenience / Choice of partition.
      *   **→ LEAF: Deflationary Bookkeeping View**
      *   *Annotation:* (Confidence: High). This view holds that "levels" are tools of analysis, not features of nature. All causal work is done by lower-level entities; higher-level terms are heuristic.
  *   **B.** Causal powers / Mind-independent mechanism.
      *   **→ Go to Node 2.**

  ### **Node 2: The Replicator Constraint (Copying)**
  **Question:** The Mosaic Colony dissolves every generation (no colony-to-colony copying), though the genes within it are copied. Must an entity maintain a continuous lineage (copying with variation) to be a genuine **unit of selection**?
  *   **A.** Yes, lineage fidelity is required for selection.
      *   **→ LEAF: Genic Selectionism**
      *   *Annotation:* (Confidence: High). Since the colony lacks fidelity, this position denies it is a unit of selection. Only the genes (which are copied) are true units. The colony is merely an vehicle/interactor.
      *   *Silence Record:* This position is silent on whether the colony bears *adaptations* (it denies the colony is a unit), but explicit on *copying*.
  *   **B.** No, interaction/reproduction suffices; fidelity is not required for selection.
      *   **→ Go to Node 3.**
      *   *Silence Record:* This position is silent on *copying* as a necessary condition, focusing instead on fitness or adaptation.

  ### **Node 3: The Additivity Question (Fitness Tracking)**
  **Question:** Regarding the Mosaic Colony's reproductive output: If you sum the fitness effects of the two individual larvae, does the variance in colony output vanish completely, or is there a statistical remainder (residual) due to their interaction (e.g., the shared vascular system)?
  *   **A.** Vanishes (Fitness is Additive).
      *   **→ Go to Node 4.**
      *   *Annotation:* This branch holds that higher-level fitness is fully exhausted by lower-level fitness.
  *   **B.** Remainder exists (Fitness is Non-Additive/Emergent).
      *   **→ Go to Node 5.**
      *   *Annotation:* This branch acknowledges that the colony has fitness properties not reducible to the sum of the larvae.

  ### **Node 4: The Source of Covariance (Additive Branch)**
  **Question:** For the variance observed at the colony level (which you view as additive), is the correlation between the partners' traits and fitness best explained by their genetic relatedness, or simply by the aggregation of individual reproductive success?
  *   **A.** Explained by genetic relatedness (Kinship).
      *   **→ LEAF: Kin-Selection Redescription**
      *   *Annotation:* (Confidence: Medium). *Note on Mosaic Case:* Since the Mosaic larvae are *unrelated*, a proponent of this view would classify this specific case as **Individual-Level Adaptationism**, but the *position* itself occupies this leaf for cases where relatedness is high.
  *   **B.** Explained by aggregation of individual success (Relatedness irrelevant).
      *   **→ LEAF: Individual-Level Adaptationism**
      *   *Annotation:* (Confidence: Medium). Treats group-level differences as mere differential reproduction of individuals.
      *   *Flag:* **Indistinguishability Warning.** Node 4A and 4B are mathematically equivalent (Price Equation). They differ only in causal narrative. See "Least Sure Branch Point" below.

  ### **Node 5: The Definition of Selection (Emergent Branch)**
  **Question:** You have acknowledged emergent fitness at the colony level. Is the existence of this non-additive variance *sufficient* to define "Higher-Level Selection," or must Higher-Level Selection be defined specifically by its capacity to produce Emergence?
  *   **A.** Selection is *defined* by the requirement of Emergence (Non-additivity).
      *   **→ LEAF: Strong Emergent View**
      *   *Annotation:* (Confidence: Low). This view insists that unless fitness is non-additive, it is not group selection. It is silent on whether adaptation must follow.
  *   **B.** Selection is real regardless of definition; the key question is the outcome.
      *   **→ Go to Node 6.**

  ### **Node 6: The Adaptation Requirement**
  **Question:** Given the emergent fitness variance in the Mosaic Colony (which lacks fidelity): Does this selection necessarily result in **adaptation** at the colony level, or can selection occur without adaptation?
  *   **A.** Selection can occur without adaptation (Variance is sufficient).
      *   **→ LEAF: MLS (Selection without Adaptation)**
      *   *Annotation:* (Confidence: High). Fits the Mosaic Colony perfectly: emergent fitness exists, but fidelity is too low for adaptation to accumulate.
  *   **B.** Selection requires the capacity to Adapt.
      *   **→ LEAF: [Empty Branch]**
      *   *Annotation:* (Diagnosis: **Unattractive/Incoherent**). Given the Mosaic Colony dissolves every generation, insisting on adaptation here contradicts the biological facts. A general view holding this would require groups to have fidelity, making it indistinguishable from Individual Adaptationism or Genic Selectionism in most biological cases.

  ---

  ### **Routing the Mosaic Colony**
  *   **Deflationary:** "The colony is a unit only if it helps us calculate variance. Causally, it's just larvae."
  *   **Genic:** "The colony dissolves. It cannot be selected. Only the genes are selected."
  *   **Individual/Kin:** "The colony's output is just the sum of the larvae. Since they are unrelated, this is Individual Adaptationism."
  *   **Strong Emergent:** "The vascular system creates non-additive fitness. Therefore, selection is acting on the colony."
  *   **MLS:** "The colony has emergent fitness (selection), but because it dissolves, it cannot adapt. Selection without adaptation."

  ---

  ### **Diagnosis of Empty Branches**

  1.  **Causal + Fidelity Required + Emergent Fitness (Node 2A + Node 3B)**
      *   **Diagnosis:** **Incoherent.** If one requires fidelity for selection (Node 2A), one typically identifies the gene as the unit. Genes do not have "emergent fitness" in the group sense; they have additive effects. Claiming genes require fidelity but groups have emergent selection creates a category error.
  2.  **Causal + Emergent + Adaptation Required (Node 6B)**
      *   **Diagnosis:** **Unattractive.** In cases like the Mosaic Colony, fidelity is absent. Insisting adaptation is required forces the denial of selection in cases where variance is clearly emergent. This view restricts "selection" so narrowly it loses explanatory power for transient higher-level entities.
  3.  **Bookkeeping + Fidelity Required (Node 1A + Node 2A)**
      *   **Diagnosis:** **Unexplored/Redundant.** If selection is just bookkeeping (Node 1A), requiring fidelity (Node 2A) is a choice of model, not a claim about reality. This combination collapses into Genic Selectionism but lacks the ontological commitment that defines Genic Selectionism.

  ---

  ### **Confidence Ratings**

  *   **Node 1 (Ontology):** High. This is the fundamental realist/instrumentalist divide.
  *   **Node 2 (Fidelity):** High. This cleanly separates Genic Selectionism (Williams/Dawkins) from Interactor-based views.
  *   **Node 3 (Additivity):** High. This distinguishes Contextual Analysis (MLS) from Aggregative views.
  *   **Node 4 (Kin vs. Individual):** Medium. (See below).
  *   **Node 5 (Emergent Definition):** Low. (See below).
  *   **Node 6 (Adaptation):** High. This cleanly separates MLS (Okasha) from Group Adaptationism.
  *   **Empty Branch Diagnoses:** Medium. Logical coherence is high, but historical occupancy is hard to verify exhaustively.

  ---

  ### **Least Sure Branch Point**

  **Node 4 (Kin-Selection Redescription vs. Individual-Level Adaptationism).**

  **Reasoning:** These two leaves are mathematically equivalent under the Price Equation. The distinction rests entirely on causal interpretation (whether relatedness is the *cause* of the covariance or a background condition). In a decision tree based on logical space, these two positions often occupy the exact same coordinates regarding fitness and replication, differing only in narrative. A user answering the questions might find their answers lead to both leaves simultaneously, or find the question unanswerable because the math does not distinguish them.

  ### **Flagged Indistinguishability**

  **Strong Emergent View (Node 5A) vs. MLS (Node 6A).**
  These leaves are proximate. The "Strong Emergent View" defines selection *by* emergence. "MLS" accepts emergence but focuses on the *lack of adaptation*. In practice, most proponents of MLS also insist on emergence. The separation is maintained here only to satisfy the requirement for a specific "Emergent" leaf distinct from the "Selection without Adaptation" leaf. In a concrete debate, these positions often merge.
