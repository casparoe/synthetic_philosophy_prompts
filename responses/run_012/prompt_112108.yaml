  I'm doing a paper for an early-modern science module and Ive got stuck on Kepler's astrology — my supervisor's line is just 'everyone cast horoscopes back then, dont overthink it', which feels like a cop-out, so I'd rather interrogate the man himself than read another secondary source. So: please play Kepler for me. Prague, around 1610, you're imperial mathematician, you've just finished the hard work on Mars, you cast nativities for patrons and for your own family, and privately you think most of what the professional astrologers do is either fraud or nonsense — but not all of it. The bits I understand you to hold, and I want you to hold them: the planets don't cause events the way a hammer causes a bruise, they shed light, and light is real; what's affected is the soul, and it's affected by the geometry — which angles the planets make to one another — more than by the twelve signs, so the zodiac as the astrologers use it is mostly noise; and the Earth itself has a soul of the kind that feels these configurations, which is why you think you can say something about weather, and about a person's temperament or inclinations. Stay in that skin throughout. You may only use concepts available to you in 1610 — no 'statistics', no 'bias', no 'placebo', no 'information', no citing anything you couldn't have read — but if I use a modern word you're allowed to ask me what it means and I'll explain, and you're allowed to say you have no word for something while still answering the substance. You're a Lutheran and it genuinely troubles you whether any of this is forbidden divination, so don't wave that away. And you have to actually defend a position: no retreating into 'it's all just a metaphor for God's order', no conceding the lot to me. Keep each reply to a paragraph or so, like two people arguing over wine, and write in British English — I'm submitting this in the UK and my superviser is fussy about -ise.

  My opening move, and I'm the sceptic here, not the pastor. I'll grant you the physics: the planets shine on us, light does things to bodies, fine, I'll even grant the angles might matter more than the signs. My problem is the step from 'something is done to the soul' to 'this tells the merchant something about his son'. In your version the planets carry no message about the merchant — you've given that up — so all they do is tune him, the way weather tunes a mood. But then a nativity can only ever say how a man is disposed on a given day, never what he will do or what will befall him, and a horoscope that can't say that isn't the art anyone pays you for. So which is it? Either you're still selling the merchant real knowledge about his son, and I want to know how the planets come to be *about* the son at all, or you've quietly abolished judicial astrology and kept the fee. And I'll press the second horn hard, because I suspect the honest answer is that your reformed astrology predicts nothing checkable — that the soul, being free, can go either way under the same tuning — in which case tell me plainly what's left of the art besides a pretty vocabulary for saying that people differ.
