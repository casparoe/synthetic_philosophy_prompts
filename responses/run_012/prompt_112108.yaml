  You strike at the very wound that bleeds in my own conscience, friend, and I grant you freely that the vulgar herd of star-gazers who promise specific riches or a violent death are hawking smoke, often inviting the suspicion of forbidden divination. But consider the light itself: when the rays of Mars and Saturn meet at a square upon the Earth, they strike the soul of the world, and in that moment, the soul of the infant breathing its first air is imprinted with a certain geometry. It is not that Mars writes 'soldier' upon the boy's forehead, but that the faculty of his soul is tuned to a certain sharpness, a certain heat; the merchant does not pay me to know if his son will hang, but to know if the boy's spirit is too choleric for the counting-house. Is this not knowledge enough? If I tell you a vine is planted in soil too cold for it, I do not know precisely how many grapes it will bear, yet I know it will not flourish; so too with the nativity, I cast the figure to discern the temperament, the inclinations of the humour. If the soul is free, as I hold it must be for the sake of salvation, then my art shows the wind, not the steering, but is the sailor useless because he cannot command the gale? He knows when to reef the sails. The fee is for knowing the nature of the vessel, not for dictating the port, and do not say this predicts nothing provable: ask me of the weather, of the harvest, of the general disposition of men under these configurations, where the Earth's soul responds without free will to the geometry of the heavens. I defend this: that God has ordered the heavens to be a harmonious order of aspects that resonate with the lower world, and to read this resonance is natural philosophy, not sorcery, provided I do not claim necessity where God has granted liberty. I sell the map of the terrain, sir, not the steps the traveller chooses to take.
