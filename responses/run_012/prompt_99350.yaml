answer: |-
  # Specification of Desiderata for Updating on Conditional Information

  This document specifies the criteria for evaluating theories of belief revision where the input is a probabilistic conditional report ($P^*(B|A) = q$) rather than categorical evidence. The specification distinguishes between mandatory constraints required for probabilistic rationality and optional modeling choices that reflect specific intuitions about the nature of conditional information.

  ## I. Mandatory Desiderata
  *Any adequate theory must satisfy these requirements to qualify as a coherent probabilistic update rule.*

  ### 1. Probabilistic Coherence
  **Requirement:** The posterior belief state $P^*$ must be a valid probability function satisfying the axioms of probability (non-negativity, normalization, additivity).
  **Motivating Case:** *General Rationality.* In any scenario, including the original Judy Benjamin case, the agent's revised degrees of belief must not expose them to a sure loss (Dutch Book) based solely on the logical structure of the beliefs. If the update rule produces negative probabilities or sums greater than one, it is formally inadmissible.

  ### 2. Conditional Constraint Satisfaction
  **Requirement:** If the input report specifies that the conditional probability of $B$ given $A$ is $q$, the posterior must satisfy $P^*(B|A) = q$ (assuming the report is accepted as true).
  **Motivating Case:** *The Original Judy Benjamin Case.* Judy is told: "If you are in Red Territory, the probability you are in Headquarters is 3/4." An adequate theory must ensure that in the revised state, the ratio of the probability of being in Headquarters to the probability of being in Red Territory equals 3/4. If the theory fails to enforce this ratio, it has failed to process the semantic content of the report.

  ### 3. Decision-Theoretic Operationalizability
  **Requirement:** The posterior probabilities must support coherent expected utility calculations for actions taken before the truth of $A$ is resolved. Specifically, the agent must be able to price conditional bets on $B$ given $A$ consistently with $P^*(B|A)$.
  **Motivating Case:** *Action Before Resolution.* Judy must decide whether to purchase insurance that pays out only if she is in Headquarters, given she is in Red Territory. She must make this decision before learning her actual location. The update rule must yield values that allow her to maximize expected utility without requiring knowledge of the truth value of $A$.

  ### 4. Reflexive Consistency (Fixed-Point Stability)
  **Requirement:** If the reported conditional concerns an objective chance that is functionally dependent on the agent's own posterior credence, the update rule must converge to a stable fixed point where the reported chance matches the resulting credence.
  **Motivating Case:** *Reflexive Chance Report.* Suppose a reliable oracle reports: "The objective chance of $B$ given $A$ is equal to your posterior probability of $B$ given $A$." A theory that generates a posterior diverging from this claim creates a Moorean paradox or a instability where the report falsifies itself upon acceptance. The theory must handle self-referential chance claims without contradiction.

  ### 5. Source Sensitivity
  **Requirement:** The magnitude of the shift from prior $P$ to posterior $P^*$ must be sensitive to the reliability weight assigned to the source of the conditional report.
  **Motivating Case:** *Unequal Reliability Sources.* Suppose Source 1 (high reliability) reports $P(B|A) = 0.9$ and Source 2 (low reliability) reports $P(B|A) = 0.1$. An adequate theory must allow the agent to weight these inputs such that the posterior is closer to 0.9 than 0.1. A theory that treats all reports as absolute constraints (binary acceptance) fails to model gradual learning from fallible informants.

  ## II. Optional Desiderata (Modeling Choices)
  *These requirements reflect specific philosophical intuitions. A theory may reject them, but doing so must be explicitly motivated.*

  ### 1. Antecedent Stability (The Judy Benjamin Intuition)
  **Requirement:** The marginal probability of the antecedent remains unchanged by the report: $P^*(A) = P(A)$.
  **Motivating Case:** *Conditional Report as Only New Information.* In the standard Judy Benjamin scenario, the report concerns the *distribution* within Red Territory, not the likelihood of *being* in Red Territory. Intuitively, learning about the internal structure of a territory should not shift belief about whether one is in that territory. However, this is a modeling choice; some theories argue that learning $B$ is likely given $A$ makes $A$ more (or less) plausible overall.

  ### 2. Partition Invariance (Symmetry)
  **Requirement:** The update result should not depend on how the space of possibilities ($\neg A$) is subdivided or described, provided the subdivisions are irrelevant to the conditional $A \rightarrow B$.
  **Motivating Case:** *Redescription of the Complement.* In the Judy Benjamin case, the "not-Red" territory might be described as "Blue" or as "Blue-North and Blue-South." An update rule should ideally yield the same posterior for Red Territory regardless of whether the alternative is carved into two sub-regions or one. This is often desired for simplicity but may conflict with other constraints.

  ## III. Impossibility Result
  *The following pair of requirements cannot be jointly satisfied in the general case.*

  **Conflict:** **Antecedent Stability** and **Partition Invariance (Symmetry)**.

  **Explanation:** It has been demonstrated that no updating rule can simultaneously preserve the marginal probability of the antecedent ($P^*(A) = P(A)$) and remain invariant under the refinement of the partition of the negation of the antecedent ($\neg A$), while strictly satisfying the Conditional Constraint ($P^*(B|A) = q$).
  In the Judy Benjamin geometry, enforcing Antecedent Stability requires shifting probability mass between $A \land B$ and $A \land \neg B$. However, how this shift interacts with the mass in $\neg A$ often depends on the geometric structure of $\neg A$. If $\neg A$ is subdivided, a rule that preserves $P(A)$ often inadvertently shifts the relative weights of the subdivisions in $\neg A$ to maintain normalization, thereby violating Partition Invariance. Conversely, a rule that preserves the relative weights in $\neg A$ (Symmetry) typically requires a shift in the total mass of $A$ to satisfy the conditional constraint, thereby violating Antecedent Stability. A theory must choose which intuition to sacrifice.

  ## IV. Evaluation of Existing Frameworks

  ### 1. Jeffrey Conditionalization
  *   **Performance:** Fails the **Conditional Constraint Satisfaction** requirement in its standard form.
  *   **Analysis:** Jeffrey Conditionalization is designed for updates where the agent learns new probabilities for a *partition* of events (e.g., $P^*(A)$ and $P^*(\neg A)$). The Judy Benjamin problem provides a constraint on a *ratio* ($P^*(B|A)$), not a marginal. To use Jeffrey's rule, one must derive a partition shift from the conditional constraint, which requires auxiliary assumptions (essentially making a modeling choice about Antecedent Stability). It handles **Source Sensitivity** well if reliability is mapped to the "rigidity" of the partition, but it does not natively process conditional inputs.

  ### 2. Adams-Style Conditional-Probability Constraints
  *   **Performance:** Satisfies **Conditional Constraint Satisfaction** but lacks a dynamic update mechanism.
  *   **Analysis:** Adams' thesis posits that the assertability of a conditional is the conditional probability. While this aligns with the **Conditional Constraint**, it is primarily a static account of semantics, not a dynamic rule for belief revision. It does not specify how to redistribute probability mass across the joint distribution ($A \land B$, $A \land \neg B$, $\neg A$) to achieve the new conditional probability. Consequently, it fails to provide guidance for **Decision-Theoretic Operationalizability** regarding the joint state, leaving the marginal $P^*(A)$ underdetermined.

  ### 3. Imaging (Selection-Function Accounts)
  *   **Performance:** Violates **Antecedent Stability**.
  *   **Analysis:** Imaging (and Generalized Imaging) works by shifting probability mass from worlds where $A$ is false to the "closest" worlds where $A$ is true. It is designed for learning that $A$ is true (or counterfactual reasoning). In the Judy Benjamin context, applying imaging to satisfy a conditional constraint typically forces a shift in the total probability of $A$ (often increasing it), as mass is moved to satisfy the structural constraint. While it maintains **Probabilistic Coherence** and handles **Partition Invariance** better than some rivals (depending on the similarity metric), it fundamentally rejects the **Antecedent Stability** intuition, positing that learning about $A$' internal structure does provide evidence about $A$'s likelihood.
