      *   *Criterion:* Tractability + Impact.

  5.  **Drafting the Prioritization Logic (The "Reasoning" Request):**
      *   I need to structure this not as a syllabus, but as a decision tree for their specific project.
      *   *Upstream:* Defining the *purpose* of the data.
      *   *Midstream:* Defining the *stability* criteria for categories.
      *   *Downstream:* Schema design and metadata tagging.

  6.  **Developing the Specific Recommendations:**

      *   *Priority 1: The "Job-to-be-Done" Framework (Validating the Hunch).*
          *   Why: It dissolves the "real vs. useful" fight immediately.
