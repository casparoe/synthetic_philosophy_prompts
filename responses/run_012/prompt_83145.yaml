      *   *Priority 3: Context-Dependence and Relational Kinds.*
          *   Why: Addresses "Invasive."
          *   Action: Storing "Invasive" not as a property of the taxon, but as a relation between Taxon + Location + Time.
          *   Philosophy link: Relational ontology / Indexical kinds.
