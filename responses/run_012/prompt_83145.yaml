prompt: |-
  Ive somehow ended up as the person who owns the taxonomy and data side of a fairly big biodiversity and invasive-species project (my background is ecology, I never took a philosophy course, so bear with me), and I keep slamming into the same wall. Half our fights are about whether a category is real and the other half are about whether it's useful, and nobody seems to notice those are two different questions. The cases we argue about: clusters of gene sequences lumped together at an arbitrary similarity cutoff that everyone admits is arbitrary and everyone uses anyway; 'invasive', which seems to be doing normative work and changes depending on where you draw the map; 'species' in bacteria, where the concept really does creak; and then the boring load-bearing ones like ecosystem types and soil classes, which we can't do without and can't quite justify.

  My hunch, and I'd rather you test it than assume it: the practical fights are never really realism versus convention, they're about which of three jobs a category is being asked to do -- support predictions, support explanations and interventions, or just file things so a regulator is happy. If that's roughly right, it should change which questions are worth asking.

  I've got one day a week for the next year, plus a small budget to put three people in a room for a workshop, and I want to spend it on questions that are actually worth the time rather than the famous ones. So: what are the live open questions about natural kinds right now, and which should I prioritize? I want the reasoning more than the list -- which questions are upstream of which, which are tractable for someone with my background and one day a week, which ones sound deep but wouldn't change a single decision in our database, and what would move a question up or down your ranking. Dont send me a reading list, I'll find the papers once I know what I'm looking for.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **Background:** Ecology, no philosophy training. Practical, hands-on role (owns taxonomy/data side of a biodiversity/invasive-species project).
      *   **Problem:** Constant conflict between team members about whether categories are "real" vs. "useful." The user suspects these are actually conflicts about *function* (prediction, explanation/intervention, regulation).
      *   **Specific Pain Points:** Genetic clusters (arbitrary cutoffs), "invasive" (normative/context-dependent), bacterial "species" (conceptually weak), ecosystem/soil classes (necessary but hard to justify ontologically).
      *   **Constraints:** One day a week for a year, small budget for one workshop (3 people).
      *   **Goal:** Identify live open questions in natural kinds philosophy that are *actually useful* for their project. Prioritize based on tractability and impact on database decisions.
      *   **Request:** Reasoning over reading lists. Upstream/downstream relationships. What moves a question up/down the ranking.

  2.  **Evaluate the User's Hunch:**
      *   *Hunch:* Fights aren't Realism vs. Convention, but about Function (Prediction, Explanation/Intervention, Regulation).
      *   *Assessment:* This is spot on. In contemporary philosophy of science (especially biology), the "Realism vs. Nominalism" debate is largely stale. The action is in *pragmatic realism* or *homeostatic property clusters* (HPC) or *interventionist* accounts. The user has intuitively grasped the "kindedness as tool" shift.
      *   *Validation:* I need to confirm this intuition immediately to build trust and validate their direction.

  3.  **Identify "Live" Questions in Natural Kinds (Philosophy of Biology):**
      *   *Old/Dead Questions:* "Do species exist independently of minds?" (Too metaphysical, doesn't change DB schema). "Is realism true?" (Too broad).
      *   *Live/Useful Questions:*
          *   What makes a kind *projectable*? (Prediction)
          *   What makes a kind *causally potent*? (Intervention)
          *   How do we handle *context-dependence*? (Invasiveness)
          *   How do we handle *multi-purpose* kinds? (Regulatory vs. Scientific)
          *   The ontology of *processes* vs. *objects* (Ecosystems).

  4.  **Prioritize Based on Constraints (1 day/week, 1 workshop):**
      *   *Constraint:* The user is not a philosopher. Deep metaphysical digging is a trap.
