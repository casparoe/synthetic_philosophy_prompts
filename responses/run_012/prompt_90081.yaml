prompt: |-
  I'm a senior engineer who became an EM at a ~40 person startup, no philosophy background, and my team keeps relitigating the same thing: every time someone leaves or we reshuffle, we try to "capture what they knew" as docs and runbooks, and it basically never works. We write down a pile of true statements about our deploy process and the new person still can't deploy without someone sitting next to them for a week. I half-remember some philosopher making a distinction between knowing how to do a thing and knowing that something is the case, and that the first one doesn't just collapse into the second — but I want that turned into something my leads can actually run, not a clever line for retros.

  So please write me a procedure a tech lead can run in about 20-30 minutes per skill area when we're deciding how to hand off work or bring someone up to speed. A decision tree in words: what to ask in what order, what counts as evidence that this is genuinely "knowing how" and can only move by doing it alongside someone, what counts as evidence it's really just propositional knowledge and a doc will do, where the procedure just says stop writing and pair instead, and where it's quietly handing me a values call dressed up as a factual one (like how much outage risk we're willing to eat). It has to survive lazy leads, so concrete enough that someone who doesn't care about philosophy can follow it. And I'd like it to be honest about the obvious cheap objection: if learning a skill means following a rule, and applying rules is itself a skill, why doesn't your procedure just push the problem back a step instead of solving it?

  Then run it on three cases: (1) a mid-level backend engineer who's the only person who really understands our flaky billing retry logic, (2) our incident commander rotation, which we keep "documenting" and keep fumbling at 3am anyway, (3) a candidate who crushed the take-home and whiteboard and then couldn't debug anything in the live repo. Include at least one case where your procedure tells me something I won't want to hear — I suspect for one of these the honest answer is "you can't doc your way out of this, you have to change how you hire or onboard," and I'd rather the procedure say it than me. And tell me straight what the procedure can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Senior Engineer turned EM at a ~40 person startup.
      *   **Problem:** Team keeps trying to document "tribal knowledge" (runbooks, docs) when people leave/reshuffle, but it fails. New hires still need shadowing.
      *   **Philosophical Hook:** Gilbert Ryle's distinction between "Knowing How" (procedural) vs. "Knowing That" (propositional). The user wants this operationalized, not just quoted.
      *   **Deliverable:** A concrete procedure/decision tree for Tech Leads (20-30 mins per skill area) to decide *what* to document vs. *what* to pair on.
      *   **Constraints:** Must survive lazy leads (concrete, actionable), address the "infinite regress" objection (if applying rules is a skill, why does this help?), and run on three specific cases.
      *   **Requirement:** One case must deliver hard truth (e.g., hiring/onboarding issue). Must state limitations.

  2.  **Philosophical Foundation (Ryle & Polanyi):**
      *   *Gilbert Ryle:* "The Concept of Mind" (1949). Critique of the "intellectualist legend." Knowing how isn't just knowing that + willing. It's a disposition.
      *   *Michael Polanyi:* "Tacit Knowledge." We know more than we can tell.
      *   *Operationalization:* The key isn't to try to convert *all* "knowing how" into "knowing that." It's to identify the *gap* where the conversion fails and budget for the transfer method that matches the knowledge type.
      *   *The "Infinite Regress" Objection:* If I write a rule "Follow step 1," and following step 1 is a skill, don't I need a rule for that?
      *   *Solution:* The procedure doesn't solve the regress; it *cuts* it. It identifies the *baseline competence* required to execute the rule. If the baseline isn't there, documentation is useless.

  3.  **Drafting the Procedure (The "Knowledge Transfer Triage"):**
      *   *Goal:* 20-30 mins. Decision tree format.
      *   *Step 1: Define the Task.* (What are we talking about?)
      *   *Step 2: The "Stranger Test".* (Can a competent stranger do it with *only* the doc?)
      *   *Step 3: Variance Analysis.* (Is the path deterministic or heuristic?)
      *   *Step 4: Consequence Assessment.* (What happens if they fail? This addresses the "values call" requirement.)
      *   *Step 5: The Stop Rule.* (When to stop writing and start pairing.)
      *   *Addressing the Regress:* Explicitly state that this procedure assumes a baseline of general engineering competence. It doesn't teach them *how to read*, it tells you *what* is worth reading vs. doing.

  4.  **Refining the Procedure for "Lazy Leads":**
      *   Avoid abstract terms like "tacit." Use "If/Then."
      *   Require physical artifacts (checklists, screenshots).
      *   Make the "Stop Writing" condition binary.

  5.  **Developing the Three Cases:**

      *   *Case 1: Flaky Billing Retry Logic (The "Bus Factor" Problem).*
          *   *Analysis:* High complexity, high consequence, low frequency.
          *   *Verdict:* Documentation is necessary but insufficient. Needs shadowing + "chaos engineering" style drills.
          *   *Hard Truth:* If only one person knows it, the code is too complex, not just the docs are bad.

      *   *Case 2: Incident Commander Rotation (The "3am Fumble").*
          *   *Analysis:* High stress, high variance, requires judgment.
          *   *Verdict:* Docs (runbooks) are for reference, *training* is for competence. You can't doc your way out of panic.
          *   *Hard Truth:* You need simulation/fire drills, not better Confluence pages.

      *   *Case 3: The Candidate (The "Hiring Mismatch").*
          *   *Analysis:* Can solve abstract problems (whiteboard) but can't navigate existing codebase (debugging).
          *   *Verdict:* This isn't a knowledge transfer problem; it's a hiring/onboarding fit problem.
          *   *Hard Truth:* The procedure will flag this as "Baseline Competence Missing." Documentation won't fix this. You hired for the wrong skill set.

      *   *Selection for "Unwanted Truth":* Case 3 is the strongest candidate for "Change how you hire," but Case 1 is also strong ("Refactor the code"). Let's make Case 1 the "Refactor" truth and Case 3 the "Hiring" truth. Actually, the prompt asks for *one* case where the answer is "change hire/onboard." Case 3 fits best. But Case 1 (Billing) is often the "Refactor" truth. Let's look closer. The prompt says: "I suspect for one of these the honest answer is 'you can't doc your way out of this, you have to change how you hire or onboard'." Case 3 is the obvious fit for hiring. Case 1 is usually "Refactor." Case 2 is "Train/Simulate." I will make Case 3 the hard hiring truth.

  6.  **Addressing the "Infinite Regress" Objection:**
      *   Need a specific section explaining *why* this doesn't just kick the can down the road.
      *   Argument: The procedure identifies the *floor*. If the floor is too high for the intended audience, the medium (doc) is wrong. It forces a decision on *method*, not just *content*.

  7.  **Review against Constraints:**
      *   *20-30 mins?* Yes, the questions are direct.
      *   *Survive lazy leads?* Yes, uses checklists and binary decisions.
      *   *Values call?* Yes, the "Risk Tolerance" step.
      *   *Philosophical root?* Ryle/Polanyi translated to engineering management.
      *   *Limitations?* Must be explicit.

  8.  **Final Polish:**
      *   Tone: Direct, peer-to-peer (Senior EM to EM), no fluff.
      *   Structure: Procedure first, then Objection Handling, then Cases, then Limitations.

  *(Self-Correction during drafting)*: I need to make sure the "Values Call" is explicit. The prompt mentions "quietly handing me a values call dressed up as a factual one (like how much outage risk we're willing to eat)." I need to ensure the procedure forces them to admit the risk tolerance.
  *Adjustment:* Add a specific step called "The Blameless Failure Test." If the answer is "We can't afford a mistake," then documentation is legally/compliance insufficient; you need gating/approvals or pairing.

  *(Refining the Regress Objection)*: The user is sharp. They know Wittgenstein/Ryle. I can't just hand-wave. The answer is that the procedure *classifies* the knowledge type to assign the *transmission mechanism*. It doesn't claim to turn "how" into "that." It claims to stop you from wasting time trying to turn "how" into "that."

  *(Final check on Case 3)*: The candidate crushed the take-home but failed the live repo. This is a classic "context switching" vs "raw logic" issue. The procedure should flag this as a "Baseline Environment Competence" gap. If the procedure says "Doc it," that's wrong. It should say "This person lacks the 'how' for *our* context, onboarding is broken."

  Let's write it.cw
answer: |-
  ## The Knowledge Transfer Triage (KTT) Procedure

  **Purpose:** To determine the minimum viable method for transferring a specific skill or responsibility from Person A to Person B (or to the team).
  **Timebox:** 20–30 minutes per skill area.
  **Attendees:** Tech Lead + Subject Matter Expert (SME).
  **Output:** A binary decision: **Document** vs. **Pair/Train**, plus a Risk Statement.

  ### The Decision Tree

  **Step 1: Define the Unit of Work (5 mins)**
  Do not discuss "Billing" or "On-call." Discuss specific actions.
  *   *Bad:* "How the billing service works."
  *   *Good:* "How to manually reconcile a failed Stripe webhook for Customer X."
  *   *Action:* Write the specific action on a whiteboard. If you can't define the start and end state in one sentence, stop. Break it down.

  **Step 2: The Variance Test (5 mins)**
  Ask the SME: "When you do this, do you follow the same steps every time, or do you have to make judgment calls based on symptoms?"
  *   **Mostly Steps:** (e.g., Restarting a specific pod, running a specific migration script). -> *Lean toward Document.*
  *   **Mostly Judgment:** (e.g., Deciding if a retry loop is safe, diagnosing *which* of 5 services is dead). -> *Lean toward Pair.*
  *   *Evidence:* Ask for the last 3 times they did this. Did they do it the exact same way? If no, it's judgment.

  **Step 3: The "Stranger with a Map" Test (5 mins)**
  Ask: "If I gave these docs to a competent backend engineer who has never seen our codebase, could they execute this without asking a question?"
  *   **Yes:** It is propositional knowledge ("Knowing That"). -> **Document.**
  *   **No:** It requires context, intuition, or muscle memory ("Knowing How"). -> **Pair.**
  *   *Lazy Lead Check:* The SME must point to the specific line in the existing doc where the "magic" is supposed to be. If they say "Well, they'd just know...", you have tacit knowledge. Stop writing.

  **Step 4: The Blameless Failure Test (The Values Call) (5 mins)**
  Ask: "If the learner follows the doc exactly and still breaks production, what is the cost?"
  *   **Low Cost:** (e.g., Local dev environment, staging deploy). -> **Document.** (Let them fail and learn).
  *   **High Cost:** (e.g., Data corruption, billing outage, SLA breach). -> **Pair/Gate.**
  *   *The Values Trap:* If the Lead says "They should just be careful," push back. "Careful" is not a control. If the risk is high, the transfer method *must* include a human gate (PR review, shadow deploy, pairing) regardless of doc quality. This is where you admit risk tolerance.

  **Step 5: The Baseline Competence Check (5 mins)**
  Ask: "Does this task require understanding *our* specific architecture, or just general engineering?"
  *   **General Engineering:** (e.g., Writing a SQL query, debugging a null pointer). -> **Document/Onboard.**
  *   **Specific Architecture:** (e.g., Why *our* SQL query deadlocks due to legacy sharding). -> **Pair.**
  *   *Crucial:* If the learner lacks the General Engineering baseline (e.g., they can't use `git` or `grep` effectively), **do not document.** You have a hiring gap, not a knowledge gap.

  ### The Stop Rules

  1.  **The "Three-Iteration" Rule:** If you have updated the runbook for the same issue three times and the fourth person still fails, **stop writing.** The problem is not the doc; it is the complexity of the system or the training method. Switch to mandatory pairing.
  2.  **The "Zombie Doc" Rule:** If a doc hasn't been opened in 6 months, archive it. It is false knowledge.
  3.  **The "Hiring Truth" Rule:** If Step 5 reveals the learner lacks baseline competence (e.g., can't navigate a repo), the procedure halts. You cannot doc your way out of a skills mismatch.

  ---

  ### Addressing the "Infinite Regress" Objection

  **The Objection:** *If "following the doc" is itself a skill (knowing how), doesn't this procedure just push the problem back? Now I need a doc on how to read the doc.*

  **The Answer:** No. This procedure does not attempt to convert "Knowing How" into "Knowing That." It attempts to **match the transmission medium to the knowledge type.**

  Ryle's point was that intelligent practice is not the child of prior theoretical speculation. You cannot fully codify judgment.
  *   If the knowledge is **propositional** (facts, endpoints, configs), a doc is the efficient medium.
  *   If the knowledge is **procedural** (judgment, timing, intuition), a doc is the *wrong* medium.

  The procedure stops the regress by forcing a binary choice: **Is this a rule or a skill?**
  *   If it's a rule, write it. (Regress ends at literacy).
  *   If it's a skill, pair on it. (Regress ends at competence).

  The "lazy lead" failure mode is trying to write a rule for a skill. This procedure forces them to admit when they are doing that and switch to pairing. It doesn't solve the skill acquisition; it stops you from wasting time pretending a Google Doc solves it.

  ---

  ### Running the Procedure on Your Cases

  #### Case 1: The Flaky Billing Retry Logic (Single Point of Failure)
  *   **Step 1 (Unit):** "Manually reconciling a failed webhook retry."
  *   **Step 2 (Variance):** SME says, "It depends on the error code. Sometimes I wait, sometimes I force push." -> **High Judgment.**
  *   **Step 3 (Stranger):** "Would a stranger know when to wait?" SME: "They'd probably force push and double charge the customer." -> **Tacit Knowledge.**
  *   **Step 4 (Failure):** Cost is high (financial loss, trust). -> **High Risk.**
  *   **Step 5 (Baseline):** Requires understanding idempotency and our specific queue state.
  *   **Verdict:** **STOP WRITING.**
  *   **Action:** This is a "Pair/Gate" scenario. The SME must shadow anyone touching this for 3 months.
  *   **The Unwanted Truth:** The procedure flags that if *only one person* can hold this knowledge, the system is too complex for the team size. The fix isn't better docs; it's **refactoring the billing logic to be deterministic.** You are using human brainpower to compensate for technical debt. The KTT forces you to admit the risk is unacceptable.

  #### Case 2: Incident Commander (IC) Rotation (3am Fumbles)
  *   **Step 1 (Unit):** "Declaring a SEV-1 and paging the right team."
  *   **Step 2 (Variance):** High. Every incident looks different. Requires triage judgment.
  *   **Step 3 (Stranger):** Docs exist. People still fumble. Why? Panic + Context.
  *   **Step 4 (Failure):** High cost (SLA, reputation).
  *   **Step 5 (Baseline):** General engineering is fine, but *our* alerting noise is the barrier.
  *   **Verdict:** **Simulation, not Documentation.**
  *   **Action:** A doc is a reference, not a teacher. You cannot learn to drive a car by reading the manual. You need **Fire Drills.** Run a game day on Tuesday at 2 PM where you break things and force the IC to use the runbook.
  *   **The Hard Truth:** Your docs are probably fine. Your *confidence* is the bottleneck. The KTT reveals you are treating a training problem as a documentation problem. Stop writing runbooks; start breaking staging.

  #### Case 3: The Candidate (Whiteboard Star, Repo Failure)
  *   **Step 1 (Unit):** "Debugging a null pointer in the existing auth service."
  *   **Step 2 (Variance):** Low. It's standard debugging.
  *   **Step 3 (Stranger):** A competent engineer *should* be able to do this with standard tools.
  *   **Step 4 (Failure):** Medium cost (time lost).
  *   **Step 5 (Baseline):** **FAIL.** The candidate cannot navigate the repo. They lack the "Knowing How" of *our environment* (or engineering generally).
  *   **Verdict:** **HIRING/ONBOARDING FAILURE.**
  *   **Action:** Do not write a doc on "How to Debug." Do not pair them indefinitely.
  *   **The Hard Truth:** This is the case where the procedure tells you what you don't want to hear. **You hired the wrong person for the role, or your onboarding is nonexistent.**
      *   If they can't debug a live repo, they lack the baseline "Knowing How" of professional engineering. No amount of documentation will fix this.
      *   If they *can* debug generally but not *your* repo, your onboarding is broken. You are expecting them to absorb 2 years of tribal context in week 1.
      *   **Decision:** The KTT halts the "write a doc" impulse. It forces you to either extend the ramp-up with heavy pairing (admitting they aren't productive yet) or acknowledge the hire was a mismatch for the immediate needs. You cannot doc your way out of a competence gap.

  ---

  ### What This Procedure Cannot Do

  1.  **It cannot fix toxic culture:** If people are afraid to ask questions or admit they don't know something, the "Stranger Test" will be lied about. Leads will say "Yes, the doc is clear" to avoid admitting the system is complex.
  2.  **It cannot reduce inherent complexity:** If your billing system is a spaghetti monolith, the KTT will correctly identify it as "High Judgment/High Risk," but it can't refactor the code for you. It only exposes the debt.
  3.  **It cannot replace leadership judgment:** The "Values Call" (Step 4) requires you to actually care about the risk. If you say "We can afford the outage" but your CEO fires you when it happens, the procedure didn't fail; your risk assessment did.
  4.  **It is not a substitute for hiring:** As seen in Case 3, if the baseline competence isn't there, this tool acts as a tripwire, not a bridge.

  ### Implementation Note for the EM
  To make this stick, do not ask your leads to "use the philosophy." Tell them: *"Starting next sprint, for every handoff task, I want a ticket comment that says 'Doc' or 'Pair' and answers the Variance Test. If you choose Doc and the new hire gets stuck, we retro the decision, not the hire."*

  Make the cost of the wrong decision visible, and the procedure will survive the laziness.
