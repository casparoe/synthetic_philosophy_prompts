answer: |-
  The nearest established concept is **Constraint Relaxation** within Insight Problem Solving, but it describes the removal of barriers rather than the structural promotion of constants to variables, so the precise shape you describe is best defined as **Dimensional Liberation**.

  **Constraint Relaxation**, primarily developed by Stellan Ohlsson and colleagues in the study of insight, posits that creative breakthroughs occur when an individual overcomes "functional fixedness" by discarding unnecessary assumptions restricting the problem space. This falls short because it models creativity as subtractive (removing a rule) rather than generative (creating a degree of freedom); it explains why you *can* change the instrument, but not why recognizing "instrument" as a variable creates a new space of possibilities distinct from simply varying the melody. **Generalization** in mathematics and cognitive science is also proximate, describing the move from specific instances to broader classes by replacing constants with parameters. This falls short because it treats the process as a logical inevitability rather than a selective creative act; generalization implies making *all* constants variable, whereas your pattern relies on the specific, valuable choice of *which* constant to vary while holding others fixed.

  **Dimensional Liberation** is the act of identifying a property previously encoded as an intrinsic constant within a representational structure and re-coding it as an extrinsic variable capable of independent variation. The structure remains recognizable because the invariant properties are held fixed, but the solution space expands orthogonally to its original definition. This differs from **Parametric Variation**, which is the act of selecting a value along an already recognized dimension (e.g., changing the notes of a melody while keeping the instrument fixed). It also differs from **Structural Replacement**, where the underlying framework is discarded rather than modified (e.g., writing a completely new melody instead of varying the existing one), and from **Ex Nihilo Invention**, which claims no lineage to prior raw material. The edge of this concept is drawn at the moment of re-coding: if the property was already acknowledged as mutable by the community or the creator, it is Parametric Variation; if the property was assumed to be inherent to the identity of the object until the moment of insight, it is Dimensional Liberation.

  My carving relies on the distinction between operating *within* a representation and operating *on* a representation. I would change my mind if neurocognitive evidence demonstrated that "discovering a new dimension" and "selecting a value on an existing dimension" utilize identical neural pathways with only differing levels of activation intensity, rather than distinct recursive processes. Specifically, if it were shown that the "choice of dimension" is merely a higher-order parameter selection within a unified hierarchy of variables—meaning the "knob" always existed in the cognitive architecture but was merely unaccessed—then the two phenomena would collapse into a single mechanism of **Hierarchical Parameter Selection**, rendering the distinction between "hidden" and "visible" knobs a matter of access latency rather than structural kind.
