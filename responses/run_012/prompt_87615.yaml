          6.  Identify verbal disputes/different questions if applicable.
          7.  No citations/reading lists. Focus on substance.

  2.  **Deconstruct the Philosophical Landscape:**
      *   *The Paradox of Deontology:* Often associated with Nagel, Nozick, Kagan. The tension between the *source* of the reason (agent-relative) and the *weight* of the reason (outcome-based).
      *   *Friend A's Stance:* Leans towards Threshold Deontology or Moderate Deontology. Acknowledges the pressure of numbers. Worried that absolute constraints are irrational.
      *   *Friend B's Stance:* Leans towards Agent-Relative Deontology (maybe Kantian or Rossian). Rejects the demand for agent-neutral grounding as question-begging. Worried that A concedes the core insight of deontology.
      *   *The "Self-Indulgence" Charge:* Usually attributed to Bernard Williams (integrity) or consequentialist critics (moral narcissism). The key is *who* is judging. Is it the agent judging themselves, or an observer judging the agent?
      *   *The Two Paradoxes:*
          1.  *Negative Constraints:* Don't kill. (The classic trolley/footbridge).
