          *   Option 1: Justified by victim's harm (agent-neutral). If so, why not kill 1 to save 1,000,000? (Collapses into threshold deontology/consequentialism).
          *   Option 2: Justified by agent's integrity/hands (agent-relative). If so, isn't this moral narcissism/self-indulgence?
      *   **The Positions:**
          *   *Friend A:* It's a real dilemma. Constraints must be consequence-sensitive (thresholds). We just need to find the threshold.
          *   *Friend B:* It's a pseudo-problem. The dilemma only exists if you demand agent-neutral justification (which begs the question against deontology). Agent-relative reasons are valid without further neutral grounding.
      *   **Task:** Draft a joint statement they can *both* sign.
      *   **Requirements:**
          1.  Numbered Agreed Claims (non-vacuous, no deck-stacking).
          2.  Disagreements Table (fairly stated, acceptable to each side).
          3.  Cruxes (sub-questions that would move the needle), with agreed relevant cases/arguments and predicted outcomes.
