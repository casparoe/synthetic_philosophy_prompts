          *   *Point 2: Status of Victims/Ideology.* Factory inputs are inert. Victims are human subjects targeted by specific racial ideology, not just random inputs. The "why" matters more than the "how."
          *   *Point 3: Instrumental vs. Exterminatory Rationality.* Weberian rationality aims for efficiency toward a goal. In the Holocaust, the goal *was* destruction, often overriding efficiency (e.g., killing Jews even when labor was needed).
