prompt: |-
  I want you to treat a specific position in decision theory as the object of scrutiny and give me a map of its exposure: what would have to be true, or what would we have to observe, for the position to be false.

  The position is this. When an agent chooses under risk, with known probabilities over outcomes, the standard expected-utility prescription misdescribes what rationality permits. Instead of weighting each outcome by its probability alone, a rational agent weights outcomes by a transformed function of their cumulative probability. Concretely, she ranks the outcomes of a lottery from worst to best and evaluates it by taking the worst outcome's utility and then adding, for each step up to a better outcome, the utility increment contributed by that outcome multiplied by a risk function applied to the probability of doing at least that well. The risk function is a fixed, agent-specific, increasing map from the unit interval to itself, sending 0 to 0 and 1 to 1, and its curvature encodes the agent's attitude toward risk, with a convex function yielding risk aversion over gains and a concave one risk seeking. On this view the classic violations of the independence axiom are not mistakes but the signatures of a coherent, rank-dependent preference structure, and ordinary expected utility is just the special case in which the risk function is the identity.

  Assume the position in its permissive form: rationality does not dictate any single risk function, but it does require that an agent's risky choices be representable by one and the same fixed risk function, applied uniformly across all of them, with the risk function and the utility function separately identifiable from her preferences.

  Now tell me what would count against it. I want the defeaters sorted from decisive to merely awkward: the choice patterns or experiments that would falsify it outright, the formal results that would show it collapses into a rival or into vacuity, the intuitions it is committed to that turn out unacceptable, and the structural facts about its own machinery that its friends should worry about. In particular, I want you to address the identification of the risk function against the utility function, whether a single risk function can be calibrated to fit behavior across stakes of very different sizes, what the position owes on dynamic or sequential choice and whether it can survive the diachronic arguments that sink other non-expected-utility theories, how it relates to the more general rank-dependent and capacity-based frameworks it may be a special case of, and whether confining the view to known probabilities leaves the ambiguity cases as a defect or a legitimate boundary. Then tell me which of these a committed defender would themselves concede and which they would dismiss as question-begging, which single consideration does the most work, what the position predicts that its rivals do not, and whether it has been qualified into unfalsifiability — and if it has, whether that is a real problem for a view of this kind or simply the price of a permissive theory.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Target Position:** Rank-Dependent Utility (RDU) theory (specifically the version described: weighting cumulative probabilities via a risk/weighting function $w(p)$, separating utility $u$ and weighting $w$, permissive about the specific shape of $w$ but requiring consistency).
      *   **Task:** Map its "exposure" (falsification conditions, weaknesses, defeaters).
      *   **Sorting:** Decisive falsifiers $\rightarrow$ Formal collapses $\rightarrow$ Intuitive/Structural worries.
      *   **Specific Areas to Address:**
          *   Identification of $w$ vs. $u$.
          *   Calibration across stakes (small vs. large).
          *   Dynamic/Sequential choice (diachronic consistency).
          *   Relation to broader frameworks (Capacity/Choquet).
          *   Risk vs. Ambiguity boundary.
          *   Defender's concessions vs. dismissals.
          *   The "single consideration" that does the most work.
          *   Unique predictions.
          *   Unfalsifiability/Qualification issues.

  2.  **Identify the Theory:**

      *   The description provided is clearly **Rank-Dependent Utility (RDU)**, originally proposed by Quiggin (1982) and developed by others like Yaari, Tversky, and Kahneman (though Prospect Theory is slightly different with loss aversion and editing, RDU is the core axiomatic version for risk).
      *   Key formula: $V(L) = \sum [w(P(\geq x_i)) - w(P(\geq x_{i+1}))] \cdot u(x_i)$ (or equivalent cumulative formulation).
      *   Key feature: Violates Independence Axiom, satisfies Comonotonic Independence.

  3.  **Brainstorming Defeaters (The "Exposure Map"):**

      *   *Decisive Falsifiers (Empirical):*
          *   Violations of *Comonotonic Independence*. RDU saves Independence by restricting it to comonotonic acts. If people violate comonotonic independence, RDU is dead.
          *   Preference reversals that imply intransitivity (RDU assumes transitivity).
          *   Violations of stochastic dominance (RDU preserves first-order stochastic dominance if $w$ is increasing; if $w$ isn't increasing, it's not RDU as described).
      *   *Formal/Theoretical Collapses:*
          *   If $w$ must be linear to avoid dynamic inconsistency, it collapses to EU.
          *   Identification problem: Can we uniquely pin down $u$ and $w$? (Yes, under specific axioms, but empirically hard).
      *   *Dynamic/Sequential Choice:*
          *   Dynamic inconsistency is the big one. RDU agents often want to pre-commit because their preferences change as probabilities resolve. If rationality requires dynamic consistency (Consequentialism), RDU is in trouble.
      *   *Stakes/Calibration:*
          *   Rabin's calibration critique applies to EU, but does it apply to RDU? RDU handles small/large stakes better because $w$ can be steep at low probabilities. However, if $w$ is fixed, can it explain extreme risk aversion in small stakes *and* reasonable behavior in large stakes simultaneously?
      *   *Ambiguity:*
          *   RDU is for *risk* (known probs). If the same weighting function is used for ambiguity, it fails (needs Choquet/MEU). If it claims to only handle risk, is that a defect?
      *   *Unfalsifiability:*
          *   Since $w$ is flexible (any increasing function), can it fit *any* data? No, because it must be consistent across lotteries. But if we allow $w$ to depend on the lottery context, it becomes ad hoc.

  4.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the theory (RDU) and the task (exposure map).
      *   **Level 1: Decisive Empirical Falsifiers:** What data kills it? (Comonotonic independence violations, Stochastic Dominance violations).
      *   **Level 2: Formal & Structural Collapses:** Dynamic inconsistency, Identification issues.
      *   **Level 3: Intuitive & Boundary Worries:** Stakes, Ambiguity, Normative appeal.
      *   **Defender's Stance:** What would they concede vs. fight?
      *   **The "Single Consideration":** Dynamic Consistency vs. Descriptive Accuracy.
      *   **Unique Predictions:** Common Ratio/Consequence effects.
      *   **Unfalsifiability Check:** Is it too flexible?

  5.  **Drafting the Content (Iterative Refinement):**

      *   *Identification:* RDU requires specific experimental designs (e.g., fixing $u$ via certainty equivalents to find $w$). If behavior suggests $w$ changes when $u$ should be constant, that's a problem.
      *   *Dynamic Choice:* This is the strongest theoretical attack. RDU violates *separability* across time. An RDU agent at $t=0$ might plan to choose A at $t=1$, but at $t=1$ prefer B. If rationality requires "resolute choice" or "sophisticated choice," RDU needs extra machinery (pre-commitment). If rationality *is* dynamic consistency, RDU is irrational.
      *   *Stakes:* RDU explains the Allais paradox well. But does it explain Rabin's calibration? Rabin showed EU implies absurd risk aversion for large stakes if calibrated to small stakes. RDU mitigates this because probability weighting affects small prob/large gain differently than high prob/small gain. However, if $w$ is *fixed*, can it handle everything? Some evidence suggests $w$ shifts with stake size. If $w$ shifts, the "fixed function" requirement is violated.
      *   *Ambiguity:* RDU is strictly for risk. If an agent treats known 50/50 differently than unknown 50/50, RDU doesn't cover that. That's not a falsifier, just a boundary. But if they treat *known* probabilities as if they were ambiguous (probability weighting often mimics ambiguity aversion), is that a bug?
      *   *Comonotonic Independence:* This is the axiom that characterizes RDU. If an agent prefers $f$ to $g$, they should prefer a mixture of $f$ and $h$ to $g$ and $h$ *provided* $f, g, h$ are comonotonic (rank outcomes the same way). Violating this is the "smoking gun."

  6.  **Refining the "Defender's Perspective":**

      *   A defender (e.g., Quiggin, Wakker) would concede dynamic inconsistency but argue that *consequentialism* is the axiom to drop, not RDU. They would dismiss the "collapse to EU" arguments as begging the question (assuming EU norms).
      *   They would argue identification is possible via careful elicitation.
      *   They would argue the flexibility of $w$ is a feature (descriptive adequacy), not a bug, provided it's stable across contexts.

  7.  **Selecting the "Single Consideration":**

      *   Dynamic Inconsistency is the heavy hitter. It forces a choice between RDU and standard diachronic rationality norms.

  8.  **Final Review against Constraints:**

      *   Did I address identification? Yes.
      *   Stakes? Yes.
      *   Dynamic/Sequential? Yes.
      *   Relation to Capacity/Choquet? Yes (RDU is a special case of Choquet where capacity is a transformation of additive probability).
      *   Ambiguity boundary? Yes.
      *   Defender concessions? Yes.
      *   Unfalsifiability? Yes.

  9.  **Tone:** Analytical, philosophical, precise (Decision Theory jargon).

      *(Self-Correction during drafting)*: Make sure to distinguish between Prospect Theory (PT) and RDU. The prompt describes RDU (no loss aversion mentioned, focuses on cumulative probability weighting for risk). PT has reference dependence. I should stick to RDU as described, but note where PT diverges if relevant to exposure. The prompt specifies "known probabilities," so it's RDU, not ambiguity models like MEU.

      *(Refining the "Unfalsifiability" point)*: Is RDU unfalsifiable? No, because it requires a *single* $w$ function across *all* choices. If I need different $w$'s for different contexts to fit data, the theory is falsified. The risk is that defenders might *ad hoc* adjust $w$ to save the theory.

      *(Refining Dynamic Consistency)*: Be precise. RDU violates *dynamic consistency* if preferences are updated by conditionalization. To save it, one needs "resolute choice" or "naive/sophisticated" modeling. The normative cost is high.

  10. **Final Polish:** Ensure the sorting from decisive to awkward is clear. (Decisive = Empirical violation of axioms; Awkward = Normative costs).

      *Let's write.*
answer: |-
  The position you have outlined is **Rank-Dependent Utility (RDU)** theory, most prominently associated with John Quiggin (1982) and later formalized by Wakker, Tversky, and Kahneman (in its cumulative prospect theory variant). It replaces the linear probability weighting of Expected Utility (EU) with a nonlinear weighting function $w(p)$ applied to cumulative probabilities, while maintaining a separable utility function $u(x)$.

  Here is the exposure map of RDU, sorted from decisive empirical falsifiers to structural and normative awkwardness.

  ### I. Decisive Empirical Falsifiers
  *These are observation patterns that, if robustly demonstrated, would logically falsify the theory as stated.*

  **1. Violation of Comonotonic Independence**
  RDU is axiomatically characterized by **Comonotonic Independence**. This axiom states that if an agent prefers lottery $f$ to $g$, they must prefer a mixture of $f$ and $h$ to a mixture of $g$ and $h$, *provided* that $f$, $g$, and $h$ are comonotonic (i.e., their outcomes rank orders across states of the world are identical).
  *   **The Defeater:** If an agent exhibits preference reversals when mixing with a comonotonic hedge, RDU is falsified. Unlike the standard Independence Axiom (which RDU is designed to violate), Comonotonic Independence is the "hard shell" of RDU.
  *   **Status:** Empirical evidence here is mixed but generally favorable to RDU compared to EU. However, a robust, replicated violation of comonotonic independence in a controlled setting would be a decisive kill shot.

  **2. Violation of First-Order Stochastic Dominance (FOSD)**
  The position specifies that the risk function $w$ is increasing. This ensures that if lottery $A$ dominates lottery $B$ (offers a better or equal outcome at every cumulative probability level), $A$ is preferred.
  *   **The Defeater:** If an agent systematically prefers a dominated lottery to a dominating one, RDU cannot represent them without abandoning the requirement that $w$ is increasing. If $w$ is not increasing, the model loses its normative claim to rationality (as it permits paying to reduce outcomes).
  *   **Status:** Rare in simple choices, but observed in complex framing. If shown to be a fundamental feature of preference rather than a performance error, RDU must either admit irrationality or become descriptive only.

  **3. Intransitivity in Risky Choice**
  RDU represents preferences via a real-valued function $V(L)$, implying transitivity ($A \succ B$ and $B \succ C \implies A \succ C$).
  *   **The Defeater:** Systematic intransitivity (preference cycles) in risky choice cannot be modeled by RDU without abandoning the functional representation entirely.
  *   **Status:** Some regret-based models predict cycles. If cycles are proven to be stable features of rational choice, RDU falls.

  ### II. Formal and Structural Collapses
  *These are theoretical results that threaten to reduce the theory to EU or render it vacuous.*

  **4. The Dynamic Inconsistency Problem**
  This is the most severe theoretical threat. RDU preferences are generally **dynamically inconsistent**. An agent planning a choice at $t=0$ for a resolution at $t=1$ will often want to revise that plan at $t=1$ once some uncertainty is resolved, even without new information (mere passage of time/probability update).
  *   **The Exposure:** Standard dynamic rationality requires **Consequentialism** (preferences depend only on future outcomes) and **Dynamic Consistency** (plans made today are executed tomorrow). RDU satisfies Consequentialism only if it collapses to EU. To maintain RDU, one must reject Consequentialism or accept that rational agents must pre-commit against their future selves.
  *   **The Collapse:** If one insists that rationality *requires* dynamic consistency without pre-commitment mechanisms, RDU collapses into EU. If one allows pre-commitment, RDU survives but at the cost of requiring a complex machinery of "resolute choice" or "sophistication" that EU does not need.

  **5. The Identification Problem ($u$ vs. $w$)**
  The position claims $u$ and $w$ are separately identifiable. Formally, they are identified if we can observe preferences over enough lotteries to solve the system of equations.
  *   **The Exposure:** In practice, $u$ and $w$ are confounded. A concave $u$ (diminishing marginal utility) and a convex $w$ (pessimistic weighting) can produce identical choice patterns over certain ranges of data.
  *   **The Defeater:** If it can be shown that no unique decomposition exists even with rich data (e.g., if the data is equally well fit by a linear $u$ with nonlinear $w$ *and* a nonlinear $u$ with linear $w$), the claim that risk attitudes are encoded in $w$ rather than $u$ becomes empirically empty.
  *   **Status:** Wakker (1994) provided methods to elicit them separately, but this requires assuming the validity of the RDU axioms to begin with. If the axioms are in doubt, the identification is circular.

  ### III. Intuitive and Boundary Worries
  *These are considerations that make the position awkward or limited, though not necessarily false.*

  **6. Calibration Across Stakes (The Rabin Critique Extension)**
  Matthew Rabin showed that EU implies absurd risk aversion for large stakes if calibrated to small stakes. RDU is often touted as the solution because probability weighting can be steep for small probabilities regardless of stake size.
  *   **The Exposure:** However, the position requires a **fixed** risk function $w$. If empirical data shows that the curvature of $w$ changes depending on the magnitude of the stakes (e.g., people weight probabilities differently when playing for \$10 vs. \$1,000,000), the "fixed function" requirement is violated.
  *   **The Awkwardness:** If defenders allow $w$ to vary with stakes, the theory risks becoming a curve-fitting exercise with too many degrees of freedom. If they insist $w$ is fixed, they may fail to fit data across widely varying stake sizes.

  **7. The Ambiguity Boundary**
  The position confines itself to **known probabilities** (risk).
  *   **The Exposure:** Empirically, agents often treat known probabilities (e.g., a drawn ball from an urn with known composition) similarly to ambiguous ones (unknown composition), or at least the weighting function $w$ looks remarkably like the capacity function used in Choquet Expected Utility for ambiguity.
  *   **The Defect:** If the psychological mechanism driving $w$ is actually sensitivity to *confidence* in probabilities rather than risk per se, then RDU is misdescribing the ontology. It treats a confidence effect as a risk preference. This leaves RDU vulnerable to being subsumed by ambiguity models (like Maxmin Expected Utility or Smooth Ambiguity), rendering the "known probability" distinction psychologically unreal.

  **8. Relation to Capacity-Based Frameworks**
  RDU is a special case of Choquet Expected Utility where the capacity is a composition of an additive probability measure and a distortion function ($w \circ P$).
  *   **The Exposure:** If agents exhibit preferences that require a non-additive capacity that *cannot* be decomposed into $w(P)$, RDU is too restrictive. For example, if an agent treats the probability of an event differently depending on the *source* of the probability (source dependence), RDU cannot capture this, as $w$ acts only on the number $p$, not the source.
  *   **Status:** This limits RDU's generality. It is not a general theory of decision under uncertainty, only a specific theory of decision under risk.

  ### IV. The Defender's Stance

  **What a Committed Defender Would Concede:**
  1.  **Dynamic Inconsistency:** A sophisticated defender (e.g., Wakker or Quiggin) would concede that RDU agents are dynamically inconsistent in the standard sense. They would argue, however, that **Consequentialism** is the axiom that should be dropped, not RDU. They would argue that rationality permits (or requires) resolute choice—sticking to a plan because it was optimal ex-ante, even if suboptimal ex-interim.
  2.  **Descriptive Flexibility:** They would concede that $w$ is not "law-like" in the physical sense but is a stable psychological trait. They might allow for minor contextual variations in $w$ without abandoning the core model, treating strict fixedness as an idealization.
  3.  **Ambiguity Boundary:** They would concede RDU does not handle ambiguity. They would frame this not as a defect but as a division of labor: RDU for risk, Choquet/MEU for ambiguity.

  **What a Committed Defender Would Dismiss as Question-Begging:**
  1.  **The Demand for Dynamic Consistency:** They would argue that requiring dynamic consistency *presupposes* Expected Utility (or Separability). To demand RDU satisfy dynamic consistency is to demand it cease being RDU. They would view the "collapse to EU" argument not as a refutation but as a proof that dynamic consistency is too strong a normative requirement.
  2.  **The "Irrationality" of Violating Independence:** They would dismiss the claim that Allais-type violations are mistakes. They would argue that the Independence Axiom itself is normatively suspect because it ignores the *context* of the probabilities (the common consequence/ratio effects), which RDU captures.
  3.  **Identification Skepticism:** They would dismiss the identification problem as a practical econometric issue, not a theoretical flaw. Given enough data points (e.g., using the trade-off method), $u$ and $w$ are mathematically separable.

  ### V. The Single Consideration That Does the Most Work

  **Dynamic Consistency vs. Descriptive Accuracy.**
  This is the fulcrum.
  *   **If** you hold that Dynamic Consistency is a non-negotiable requirement of rationality, RDU is false (or irrational).
  *   **If** you hold that Descriptive Accuracy regarding the Allais Paradox and common risk behaviors is the primary goal of decision theory, RDU is superior to EU.
  The theory lives or dies on whether one accepts **Consequentialism** as a normative mandate. RDU forces a choice: either rationality is diachronically consistent (and thus EU), or rationality accommodates the psychological reality of probability weighting (and thus requires a new norm of diachronic choice, like resoluteness).

  ### VI. Unique Predictions and Unfalsifiability

  **What RDU Predicts that Rivals Do Not:**
  1.  **Simultaneous Risk Seeking and Aversion:** Unlike EU (which requires global concavity or convexity of $u$), RDU predicts an agent can be risk-averse over gains with high probabilities (due to $w$ being concave there) and risk-seeking over gains with low probabilities (due to $w$ being convex there), *even if* $u$ is linear. EU cannot do this without a reference point (like Prospect Theory).
  2.  **The Common Ratio Effect:** RDU specifically predicts the pattern of preference reversal seen in the Allais Paradox (preferring certainty over high probability, but high probability over low probability when both are scaled down). EU predicts no reversal.

  **Has it been Qualified into Unfalsifiability?**
  There is a risk, but it is not currently fatal.
  *   **The Risk:** Because $w$ can be *any* increasing function, a defender could potentially fit any static choice dataset by positing a sufficiently wiggly $w$.
  *   **The Safeguard:** The requirement that $w$ be **fixed across all lotteries** prevents total unfalsifiability. If the $w$ required to fit Lottery Pair A is mathematically incompatible with the $w$ required to fit Lottery Pair B, the theory is falsified.
  *   **The Verdict:** It is not unfalsifiable, but it is **highly flexible**. The danger is not that it fits everything, but that defenders might attribute deviations to "noise" or "contextual shifts in $w$" rather than theory failure. If $w$ is allowed to depend on the specific lottery context (e.g., the range of outcomes), the theory loses its predictive power and becomes a post-hoc description.

  ### Summary Map of Exposure

  | Level | Defeater | Severity | Defender's Counter |
  | :--- | :--- | :--- | :--- |
  | **Decisive** | Violation of Comonotonic Independence | Fatal | Deny the data is robust; attribute to error. |
  | **Decisive** | Violation of First-Order Stochastic Dominance | Fatal | Claim agent is irrational; theory is normative. |
  | **Structural** | Dynamic Inconsistency | Severe | Reject Consequentialism; adopt Resolute Choice. |
  | **Structural** | Identification Failure ($u$ vs $w$) | Moderate | Use elicitation methods (trade-off technique). |
  | **Boundary** | Stake-Dependent Weighting | Moderate | Treat as second-order effect; keep core fixed. |
  | **Boundary** | Source Dependence (Ambiguity) | Mild | Admit limitation; RDU is for Risk only. |

  **Final Diagnosis:** The position is robust against empirical anomalies that sank EU (like Allais), but it is vulnerable to **diachronic normative arguments**. Its survival depends on the philosophical plausibility of "resolute choice." If rationality is defined as consistency over time, RDU fails. If rationality is defined as coherence of static preferences that respect psychological weighting of probabilities, RDU succeeds. The theory is not unfalsifiable, but its flexibility requires strict policing of the "fixed function" constraint to prevent it from degenerating into mere curve-fitting.
