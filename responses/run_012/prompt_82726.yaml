      *Refining for the "Leaves":* I need to make sure the scoring key can actually distinguish Moderate vs. Radical Autonomism. Radical says "Nothing affects aesthetic value." Moderate says "Nothing affects aesthetic value, BUT I might not engage." So the questions need to ask about *Aesthetic Value* vs. *All-Things-Considered Judgment*.
      *Correction:* The prompt asks for "what you'd do" questions to separate positions.
      *Radical Auto:* "It's good art, I'll watch it."
      *Moderate Auto:* "It's good art, I won't watch it."
