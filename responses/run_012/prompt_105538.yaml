answer: |-
  The town of Oakhaven clung to the cliffs like a barnacle, its livelihood knotted in the herring runs that surged through the grey water each autumn. For a century, the season opened not by calendar, but by the lighting of the *Harbor Eye*. It was a heavy brass lantern, thick-globed and soot-stained, kept in the Guildhall. When the Custodian lit the wick on the first dark evening of October, the insurance underwriters considered the fleet seaworthy. Without the *Eye*, the boats stayed tied.

  The first crisis came in the winter of 1922. Mara, then a young woman newly appointed Custodian, was polishing the *Eye* when a gust from the open window knocked it from the table. The brass frame shattered, the glass globe vaporized. Only the wick mechanism and a few twisted ingots of metal remained.

  Kaelen, the town smith, gathered the shards. "It's dead, Mara," he said, weighing the melted brass in his crucible. "This is new metal now. The crystal structure changed when it heated. You can't cast a soul twice."

  Mara watched him pour the molten brass into the mold carved from the original frame's imprint. "The Guild doesn't insure metal, Kaelen. They insure the *Eye*."

  "The Guild insures a specific object," Kaelen countered, hammering the cooled brass. "This is a copy. A very good copy, but a copy."

  When the lantern was reassembled, Mara placed it on the pedestal. She lit the wick with the same taper used for fifty years. "It casts the same light," she said. "It sits in the same place. It is the *Eye*."

  Kaelen wiped his hands on his apron. "It's a vessel filled with new stuff. You're naming a ghost."

  The second crisis was slower, a corrosion of certainty rather than metal. Over the next forty years, the salt air ate at the *Harbor Eye*. The hinge rusted through; Kaelen's son replaced it. The fuel reservoir developed a leak; a new one was soldered on. The glass globe cracked from thermal shock; a new pane was cut. There was no single day when the *Eye* became something else, but by 1965, Professor Vane, visiting from the university to catalog maritime relics, pointed out the obvious.

  "Statistically," Vane said, adjusting his spectacles while Mara polished the latest replacement handle, "less than ten percent of the original mass remains. You are preserving a pattern, not a thing."

  Mara didn't look up. "My grandfather lit this lamp. My father lit this lamp. I light this lamp. The flame hasn't broken."

  "Continuity of function is not identity of substance," Vane said, taking notes. "If I replaced every plank on a ship, is it the same ship? Philosophers have argued this since Athens."

  "Philosophers don't fish," Mara replied. "If I tell the fleet this isn't the *Eye*, they don't sail. If they don't sail, they starve. So I tell them it's the *Eye*. That makes it so."

  Vane tapped his pen. "You're arguing that identity is conferred by practice. That's a social construct, not a metaphysical fact."

  "It's the only fact that keeps them warm," Mara said.

  The third crisis arrived with Mara's death. She left no clear instruction, only the *Eye* and two children, Elias and Sarah, who had long since ceased speaking to one another. The will stated the *Eye* must remain in the Guildhall, but it did not specify who held the key. On the night before the opening ritual, the dispute turned physical. In the struggle, the lantern was pulled apart. Elias took the base and the mechanism; Sarah took the frame and the glass.

  Desperate to claim the legacy, each hired a smith. By morning, two lanterns stood on the Guildhall table. Both were made from the parts of the original, supplemented with new brass to make them whole. Both glowed with the same amber light.

  Old Heston, the Guild Master, stood between them, his face grey. His livelihood, and the town's economy, depended on the validity of the rite. The insurance policy specified *the* Harbor Eye. Singular.

  "This one," Elias said, hand on the lantern with the original wick mechanism. "The fire starts here. The function is in the flame."

  "This one," Sarah said, hand on the lantern with the original frame. "The shape is the identity. The vessel holds the light."

  Heston looked at Kaelen, now old and bent, who leaned on his cane. "Which one do I light, Smith?"

  Kaelen spat on the floor. "Neither. The matter was divided. The continuity was broken when they fought. You're looking at two replicas."

  Mara's voice seemed to echo from the corner where she used to stand. "It is the light that matters. Use determines the thing."

  Vane, who had stayed in town to observe the culmination, interjected. "If you light both, you dilute the brand. If you light neither, the fleet stays ported. The question isn't what the object *is*, but which object allows the contract to hold."

  Heston looked at the insurance papers, then at the two lanterns. The underwriters were arriving in an hour. If he chose wrong, the claim would be voided in the event of a wreck. If he chose neither, the town lost the season's catch.

  "Elias," Heston said. "Your lantern holds the mechanism."

  "It's the heart," Elias said.

  "Sarah," Heston turned. "Yours holds the frame."

  "It's the body," Sarah said.

  Heston rubbed his temples. "The policy says the *Harbor Eye* must be lit. It does not define the *Eye*. It assumes we know."

  "We know," Elias insisted. "The flame is the tradition."

  "We know," Sarah countered. "The form is the history."

  Kaelen shook his head. "You're arguing over a pile of brass. The town needs a symbol, not a truth."

  Mara's successor, a young apprentice named Jory, stepped forward. She looked at the two lanterns. She looked at the fishermen waiting outside, their engines idling, their livelihoods hanging on a spark. She picked up the taper.

  "Which one?" Heston asked, his voice trembling.

  Jory held the flame between the two globes. The light reflected in both, making them shine equally bright. "If I light one, the other is a lie. If I light both, the ritual is broken."

  "Then choose," Vane said, his pen poised. "Tell us what identity is. Is it the matter? The form? The use?"

  Jory looked at the fishermen. She looked at the Smith, the Scholar, and the Guild Master. She saw the fear in Heston's eyes—the fear that the world was not as solid as it seemed. She realized that the *Eye* was not the brass, nor the flame, nor the paper in Heston's hand. It was the agreement they were all about to break.

  "The fleet waits," Jory said.

  She moved the taper toward the left lantern, then paused. She moved it toward the right, then stopped. The flame flickered in the draft from the open door, casting long, dancing shadows that made the two lanterns look like one, then two, then none.

  "Light it," Elias commanded.

  "Wait," Sarah said.

  Heston held his breath. The engines outside revved, a low rumble shaking the floorboards. The insurance man's car crunched on the gravel outside. Jory's hand hovered, the heat warming her fingers, the decision suspended in the air like smoke.

  Outside, the sea crashed against the cliffs, indifferent to the name of the light that guided the boats home. Inside, the town waited to see if the world held together, or if it had finally come apart in their hands. Jory did not lower the taper. She did not raise it. She simply stood between the two lights, holding the fire, while the shadows lengthened and the question remained unanswered.
