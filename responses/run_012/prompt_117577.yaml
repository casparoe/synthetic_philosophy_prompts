answer: |-
  The single bill lay flat on the conference table, crisp and green against the dark wood. It was a prop, technically, but the accounting rules were specific. The money came from the Q4 discretionary fund, a pool of capital that vanished if not allocated by Friday evening. Neither Elias nor Vance was spending their own savings. They were spending company liquidity to purchase a line item that would look decisive on next quarter's review. The prize was the dollar, but the commodity being traded was the appearance of control.

  Elias knew the literature. He had read Shubik. He understood the Nash equilibrium of the dollar auction and could recite the typical trajectory where two rational actors drive the price to three dollars for a one dollar asset. He had walked into the room anyway. His logic was simple and cold. He assumed Vance was a standard optimizer, a man who would cut his losses once the bid exceeded the face value of the prize. Elias planned to bid ninety cents, let Vance take it for a dollar, and walk away with zero loss and zero gain. It was a test of nerve, not greed. He was buying the knowledge of Vance's threshold, and that intelligence was worth more than the dollar itself.

  Vance opened at ten cents. He did not smile. He was looking at his tablet, reviewing the remaining balance of the discretionary fund. To Vance, the money was already gone. It was use it or lose it budgeting. If he did not spend this capital, his division's allocation would be reduced next year. Spending it was neutral. Not spending it was a penalty. Winning the auction meant he spent the money on a win. Losing the auction meant he spent money on nothing. The distinction mattered only in the narrative he would present to the board.

  Elias bid twenty. The room was quiet, save for the hum of the HVAC. They were alone, which was necessary. This was not a public spectacle yet. It was a calibration. Vance moved to thirty. Elias watched Vance's eyes. There was no panic, only the steady rhythm of a man entering data. Elias realized too late that Vance was not optimizing for profit. Vance was optimizing for utilization. Every bid was a valid expenditure of the surplus. The only waste was the second-highest bid.

  They passed fifty cents. The logic held. If you bid sixty and won, you spent sixty to get a dollar. Profit was forty. If you bid sixty and lost to a seventy cent bid, you lost sixty for nothing. The trap was not in the profit margin. It was in the avoidance of total loss. Elias raised to seventy. Vance took it at eighty. Elias felt the shift in the air. He was now the second-highest bidder. If he stopped now, he paid seventy cents to the company coffers and received nothing. His division would show a seventy cent expenditure with zero return. It was a line item that begged for explanation.

  He bid ninety. Vance did not hesitate. He bid one dollar. The room seemed to shrink. This was the threshold where the textbook said rational actors should freeze. The profit was gone. Now they were bidding for break-even. But Elias knew the math of the second bidder. If he stopped, he lost ninety cents. If he bid one ten, he risked losing ten cents instead of ninety, provided Vance stopped. The potential loss had shrunk from ninety to ten. It was a rational hedge. He bid one ten.

  Vance smiled then, a thin tightening of the lips. He understood the shift. The dollar bill was no longer the asset. The asset was the avoidance of being the sucker. The second-highest bidder pays and gets nothing. That was the shame. That was the mark on the record. To avoid the mark, one had to become the highest bidder. To become the highest bidder, one had to force the other person into the second spot. The game was no longer about the dollar. It was about assigning the loss.

  Elias bid one twenty. He told himself he was teaching Vance a lesson about resource allocation. He told himself he would stop at one fifty. He was the one who knew the theory. He should be the one to control the escalation. But the theory assumed the players valued the dollar at one dollar. Elias valued winning at something higher. Winning meant Vance lost. It meant Elias's division controlled the narrative of the quarter. It meant he was the one who closed the deal. The cost was abstract numbers in a ledger. The benefit was concrete status in the hierarchy.

  Vance bid one thirty. He was not looking at the tablet anymore. He was looking at Elias. He knew Elias knew the trap. That was why he kept bidding. He was calling the bluff. He knew that a man who walks into a known trap believes he is the exception. Vance was betting on Elias's ego, not his math. If Vance stopped at one forty, he lost one thirty. If he bid one fifty, he might lose only fifty. The logic was identical to Elias's. They were mirror images, reflecting the same justification back and forth.

  They reached two dollars. The bill on the table was wrinkled now, touched by sweaty palms. The discretionary fund was large enough to absorb this, but the specific line item would be audited. Two dollars spent for one dollar gained. It was inefficient. It was wasteful. But it was decisive. A man who stops at two dollars and ten cents is a man who hesitated. A man who pushes to three dollars is a man who closes. The board rewarded closers. They did not reward men who saved the company ninety cents by folding early.

  Elias felt the heat in his neck. He was past the point of financial sense. He was in the zone of reputational defense. If he lost now, he was the man who bid one ninety and got nothing. Vance would be the man who bought a dollar for two dollars. Vance would look wasteful. Elias would look weak. In the ecosystem of the firm, weakness was more expensive than waste. Waste could be explained as investment. Weakness was terminal.

  He bid two ten. Vance countered with two twenty. The numbers were meaningless now. They were integers in a sequence. The only thing that mattered was the next number. Elias thought about the literature again. He thought about the chapters describing the escalation of commitment. He realized the authors were not describing a mistake. They were describing a survival mechanism. In a system where second place pays and gets nothing, you cannot stop. You can only force the other guy to stop.

  Vance leaned forward. He did not speak. He wrote the number on the pad and slid it across. Two thirty. Elias looked at the bill. It was just paper. It was worth less than the ink used to sign the checks covering these bids. But he could not let it go. To let it go was to admit he had walked into a trap he saw coming. To admit that was to admit he was not the rational actor he claimed to be. His identity was wrapped up in the bid.

  He picked up his pen. His hand was steady. He knew what he had to do. He had to bid enough that Vance would feel the pain of the next step more than the pain of stopping. He had to make the cost of continuing higher than the cost of losing. But he also knew Vance was thinking the same thing. Vance was calculating Elias's pain threshold. They were bidding against each other's tolerance for discomfort.

  Elias wrote the number. He did not show it yet. He looked at Vance. Vance was waiting. The air in the room was heavy, pressurized by the unspent potential of the next bid. The dollar lay between them, irrelevant and essential. The fund was open. The clock was ticking. The logic was perfect. There was no way out that did not cost more than staying in. Elias put the pen down on the paper. He waited for Vance to blink. Vance did not blink. They sat in the silence of the trap, both knowing exactly where they were, and both knowing exactly why they could not leave.
