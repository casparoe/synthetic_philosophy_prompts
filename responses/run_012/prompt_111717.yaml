  Here are two versions of the joke. The setup is identical; the punchlines diverge on the theoretical fault line.

  **The Setup**
  A conglomerate has scrapped budgets and transfer pricing entirely. Every division now queries a central LLM for input costs, and managers trade with each other on those numbers. One division is printing money; the one next door is bleeding out. When you ask either of them why, the honest answer is that nobody has ever known less about what anything actually costs.

  **Version 1: The Hayekian Win**
  "That's the problem," the consultant said. "Lange thought prices were just numbers to balance equations. Hayek knew they were a mechanism for transmitting dispersed knowledge. This model isn't discovering scarcity; it's just hallucinating arithmetic. The price signal is live, but there's nobody on the other end."

  **Version 2: The Langean Win**
  "That's the feature," the Chief Planner said. "Lange never promised the managers would understand the *why*. He only promised the *what*. The AI sets the parametric price, the divisions react, and the shortages vanish. In a real market, they wouldn't know why global rates shifted either. They don't need the knowledge; they just need the nudge."
