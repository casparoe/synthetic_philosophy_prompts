  Before I read another word on weakness of will, I want the spec first. Write me the desiderata for a theory of akrasia: what it has to be able to do to count as adequate -- which cases it must classify correctly, which distinctions it can't collapse, which findings it has to live with -- with the case or consideration behind each requirement. The stuff I want on the list, roughly: (i) the textbook case, someone who thinks A is best right now and does B anyway, fully aware, no excuse; (ii) the person who never formed a judgement about what's best overall but broke her own standing resolution -- she said she'd stop after one drink and didn't -- so do we really need a judgement to have been contravened, or is that just an assumption of the judgement-focused camp?; (iii) the person who calmly renegotiates the plan her earlier self set, does what that earlier self called wrong, and feels no failure whatsoever -- akrasia or just changing her mind?; (iv) the case where the "weak" act was actually the better one and the earlier judgement was the corrupt thing; and (v) the hyperbolic discounting results, where the near future gets discounted much more steeply than the far future, so the reversal is predictable in advance and the agent can watch it coming. For each, say what it forces on the theory and whether it's non-negotiable or just the taste of one camp. Then tell me which single requirement does the most to rule out the main contenders -- a will-faculty that fails, the divided-mind picture where the stronger desire wins, and the "it's just ordinary choosing with a kinked discount curve, nothing to explain" line. And say whether the list can be met all at once, because I suspect (iii) and (v) pull against (i).
