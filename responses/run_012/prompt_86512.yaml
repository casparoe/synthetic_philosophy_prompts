answer: |-
  # Spec Sheet: Desiderata for a Theory of Akrasia

  ### 1. The Synchronic Violation Constraint
  *   **The Case:** The textbook akratic. At *t*, the agent judges that action A is best all-things-considered, yet intentionally performs action B. They are not ignorant, not coerced, and not physically prevented. They know exactly what they are doing.
  *   **What it forces:** The theory must explain how an intentional action can contravene a *synchronic* all-things-considered evaluative judgment without dissolving the intentionality of the act or the sincerity of the judgment. It cannot appeal to ignorance (Socratic intellectualism) or external compulsion.
  *   **Status:** **Non-negotiable.** This is the defining phenomenon. Any theory that explains this away (e.g., "they didn't *really* judge A best") fails to address akrasia.

  ### 2. The Resolution Constraint
  *   **The Case:** The resolution-keeper who slips. The agent never forms a synchronic judgment that "abstaining now is best overall" (perhaps they think one more drink wouldn't hurt overall), but they violate a standing resolution ("I will stop after one"). They feel they have failed, even without a contravened synchronic judgment.
  *   **What it forces:** The theory must broaden the normative standard beyond *synchronic best judgments*. It must account for the normative force of *diachronic policies* or resolutions. It cannot require a contemporaneous value judgment to be violated for weakness to occur.
  *   **Status:** **Non-negotiable.** Ordinary language and phenomenology recognize weakness against resolutions (Holton's challenge). A theory requiring a synchronic judgment (like strict Davidsonianism) is too narrow.

  ### 3. The Revision Authority Constraint
  *   **The Case:** The calm renegotiator. The agent's earlier self set a plan (A). The current self calmly assesses the situation, decides B is better now, and does B without regret or sense of failure.
  *   **What it forces:** The theory must provide a criterion for distinguishing *akrasia* from *rational revision*. It must explain when a past commitment binds the present self and when it does not. It cannot classify all diachronic inconsistency as weakness.
  *   **Status:** **Non-negotiable.** Without this, the theory pathologizes rational learning and adaptation. It preserves the agent's authority to update beliefs and values.

  ### 4. The Subjective Normativity Constraint
  *   **The Case:** The corrupt judge. The agent judges A is best (e.g., "I should continue this bigoted practice"), but does B (stops the practice). B is objectively better, but the agent feels they have succumbed to weakness (or conversely, does evil against their better judgment).
  *   **What it forces:** The theory must locate the failure in the *relation* between the agent's own endorsed standards and their action, not in the objective moral or prudential value of the act. Akrasia is a failure of self-governance, not necessarily a failure of morality.
  *   **Status:** **Non-negotiable.** Akrasia is a structural failure of agency, not a substantive failure of value.

  ### 5. The Empirical Mechanism Constraint
  *   **The Case:** Hyperbolic discounting. The agent predicts they will reverse their preference as the reward nears. The reversal happens exactly as the curve predicts.
  *   **What it forces:** The theory must accommodate the psychological mechanism of time-inconsistent preferences without reducing the *normative failure* to mere causal inevitability. It must explain why a predictable psychological shift counts as a *failure* rather than just a *change*.
  *   **Status:** **Non-negotiable.** A theory incompatible with established behavioral psychology is empirically vacuous.

  ***

  ### The Killer Requirement: (1) The Synchronic Violation Constraint

  **Why it rules out the contenders:**
  This is the primary filter. It demands an explanation of **irrational intentional action**.

  *   **Against the Deflationary Line ("Just a kinked discount curve"):** Deflationism fails (1) immediately. If the preference reversal is just a natural function of time proximity (as per 5), then the agent *does what they want most at t*. There is no violation of a synchronic judgment, only a change in the judgment itself. (1) insists the judgment *persists* while the action diverges. Deflationism denies the phenomenon exists.
  *   **Against the Divided-Mind Picture ("Stronger desire wins"):** This view explains the *causal* mechanics of (1) but fails to explain the *normative* failure. If the stronger desire wins, that is how agency works on a Humean model. To call it "weakness" implies the agent *should* have acted on the judgment, not the desire. Divided-Mind theories struggle to justify why the judgment *ought* to win absent a homunculus. They describe conflict, not irrationality.
  *   **Against the Will-Faculty Picture ("The muscle failed"):** While this view accepts (1), it is severely strained by (5). If the reversal is predictable via discounting curves, positing a "will muscle" that simply "fatigues" is biologically and psychologically opaque. However, (1) is what keeps the Will-Faculty in the game; (5) is what eventually kills it. (1) is the gatekeeper.

  ***

  ### Consistency Check: Can the list be met all at once?

  **Verdict:** **Barely, and only with significant theoretical friction.**

  You are correct to suspect tension between **(i)**, **(iii)**, and **(v)**.

  1.  **The (i) vs. (v) Tension:** (i) requires the judgment "A is best" to persist at *t* while B is done. (v) suggests that at *t*, the subjective value of B *actually exceeds* A due to discounting. If the agent's evaluative mechanism is governed by (v), do they *really* hold the judgment "A is best" at *t*?
      *   *To meet both:* The theory must distinguish between **evaluative judgment** (stable, reflective) and **preference strength** (volatile, affective). It must claim the agent judges A best *reflectively* while being motivated by B *impulsively*. This requires a partitioned mind (risking Divided-Mind objections) or a complex dual-process account.

  2.  **The (i) vs. (iii) Tension:** (i) says doing B against a prior standard is weakness. (iii) says doing B against a prior standard is sometimes rational revision.
      *   *To meet both:* The theory must specify the **conditions of bindingness**. Why does a resolution bind in case (i) but not in case (iii)?
      *   *Solution:* Usually, this requires a **Reconsideration Constraint**. Akrasia occurs when the agent abandons the plan *without* taking new evidence or reasons into account (mere capitulation to impulse). Rational revision occurs when new reasons justify the shift.
      *   *The Friction:* This risks collapsing back into Intellectualism. If "no new reasons" is the criterion, then the akratic agent *must* believe A is still best (satisfying i). But if they believe A is best, why do they do B? We return to the core mystery of (i).

  **Conclusion:** The list is consistent only if the theory adopts a **hybrid architecture**:
  *   It must accept **(v)** as the *causal mechanism* (how the shift happens).
  *   It must accept **(ii)** and **(iii)** to define the *normative structure* (resolutions bind unless rationally revised).
  *   It must insist on **(i)** to preserve the *phenomenology of failure* (the agent recognizes the violation).

  Most theories sacrifice one to save the others. Deflationists sacrifice (i). Traditionalists sacrifice (v). Willpower theorists sacrifice (iii) (often viewing all revision as suspect). A complete theory must walk the knife-edge of admitting the psychological inevitability of (v) while maintaining the normative culpability of (i).
