      *   *Decision:* The most coherent fix is to abandon C3. It makes C1 impossible by definition. If choice = preference, you can never choose against your preference. Akrasia requires a gap between *evaluative judgment* and *choice*.
      *   *Second Fix:* Refine C4/C5 distinction. The irrationality isn't the *rate*, it's the *inconsistency*.

      *   *Wait, which is the "Single Best Revision"?*
      *   If I drop C3, C1 becomes possible. But C4/C5 still fight.
      *   If I modify C4 (to say dynamic inconsistency is irrational), C5 is saved. But C1/C3 still fight.
      *   So C3 is the root cause of the C1 conflict. C4 is the root cause of the C5 conflict.
