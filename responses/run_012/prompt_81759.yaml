answer: |-
  **Project Title:** The Individuation of Moral Reasons: Resolving the Verbal Dispute between Holism and Generalism

  **Project Summary**
  This project addresses a foundational instability in the debate between moral particularists and moral generalists. The central disagreement is typically characterized as a dispute over valence: particularists (holists) argue that a consideration favoring an action in one context may oppose it in another, while generalists deny this. However, both sides presuppose an account of how moral reasons are individuated without arguing for it. If reasons are individuated finely, switching is impossible, and generalism wins trivially; if individuated coarsely, switching is ubiquitous, and particularism wins trivially. This project asks whether there is a non-arbitrary criterion for individuating moral reasons that preserves the recurrence of reasons across contexts while leaving the holism of reasons a substantive, contestable claim. By isolating the metaphysics of reason individuation, this project aims to determine whether the debate is substantive or merely verbal.

  **Research Question**
  The primary research question is: *Can moral reasons be individuated according to a non-arbitrary criterion that preserves their capacity for recurrence across contexts while allowing for genuine valence switching, thereby rendering the debate between holism and generalism substantive rather than verbal?*

  This question admits a determinate answer. Either such a criterion exists, in which case the debate can proceed on solid ground, or no such criterion exists, in which case the debate rests on an equivocation regarding the identity of reasons.

  **Significance and Alternative Approaches**
  Current literature treats reason individuation as a background assumption. Generalists absorb apparent valence switches by individuating reasons finely (e.g., treating "this kindness" and "that kindness" as distinct reasons), while particularists resist by individuating coarsely. Without a constrained account of individuation, holism is either trivially true or trivially false.

  This project offers a superior approach to the standard alternatives. First, simply adjudicating more stock cases fails because any verdict on a case presupposes an individuation scheme; arguing from cases begs the question against the opposing view's counting method. Second, defending one side on intuitive grounds ignores the structural possibility that the disagreement is verbal. By focusing on the conditions for reason identity, this project clears the ground for first-order moral theory. If the debate is verbal, resources currently spent defending particularism or generalism can be redirected. If it is substantive, this project provides the necessary metaphysical framework for those defenses to succeed.

  **Methodology**
  The project is conceptual and requires no empirical work. The method proceeds in three stages: cataloging, formulation, and testing.

  1.  **Cataloging:** I will assemble a stock of paradigmatic valence-switch cases relied upon by both sides (e.g., cases involving kindness, pleasure, or promise-keeping). For each case, I will catalog which individuation schemes render it a switch and which do not.
  2.  **Formulation:** I will formulate candidate criteria for reason individuation. These will include:
      *   *Feature-Based:* Reasons are individuated by the natural properties they cite.
      *   *Response-Based:* Reasons are individuated by the practical response they recommend.
      *   *Inferential Role:* Reasons are individuated by the argument they figure in.
      *   *Defeasibility:* Reasons are individuated by their role in a defeasible inference.
  3.  **Testing:** Each candidate will be tested against the stock of cases. The test asks whether the criterion yields the verdicts proponents need without collapsing holism into vacuity (by making switching too easy) or falsity (by making switching impossible).

  **Work Plan (12 Months)**
  *   **Months 1–3:** Literature review and case collection. I will finalize the stock of valence-switch cases, prioritizing paradigmatic examples to prevent the corpus from ballooning unmanageably.
  *   **Months 4–6:** Formulation of individuation criteria. I will draft precise definitions for the candidate criteria listed above, ensuring they are motivated by general metaphysics of reasons rather than moral intuitions.
  *   **Months 7–9:** Testing and analysis. I will apply the criteria to the case stock. I will guard against gerrymandering by requiring that each criterion be independently motivated prior to testing. If a criterion is adjusted to fit a case, it must be justified by theoretical virtues (e.g., simplicity, consistency with non-moral reasons) rather than the desired moral verdict.
  *   **Months 10–12:** Synthesis and writing. I will draft the final monograph or article series, articulating the successful criterion or the deflationary conclusion.

  **Success and Failure Conditions**
  Success requires identifying a criterion that is independently motivated, makes holism a thesis that could turn out false, and preserves the recurrence of reasons so that defeat and switching remain intelligible. If such a criterion is found, the project succeeds by securing the metaphysical foundation of the debate.

  However, a deflationary outcome counts as a genuine philosophical result. If no such criterion can be found, the project succeeds by demonstrating that the debate as usually posed rests on an equivocation. Failure would only occur if the project remains inconclusive due to methodological errors or an inability to articulate the criteria clearly.

  **Feasibility and Risks**
  The primary risk is scope creep. The stock of cases could balloon, making testing impossible within a year. I will mitigate this by restricting the analysis to a core set of agreed-upon paradigmatic cases rather than attempting an exhaustive catalog. A second risk is gerrymandering the criterion to fit preferred verdicts. I will guard against this by pre-committing to the theoretical motivations for each criterion before applying them to the moral cases. If a criterion requires ad hoc adjustments to accommodate the data, it will be rejected.

  Given the conceptual nature of the work and the constrained case set, the project is feasible within one year. The outcome will either resolve a foundational ambiguity in moral theory or dissolve a persistent dispute, freeing resources for more productive inquiry.
