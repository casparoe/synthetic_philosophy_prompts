  You're a philosopher of mathematics who's spent a lot of time around working mathematicians, and I want you to think carefully and do a little brainstorming before you commit to an answer.

  Here's the practice that bugs me. Mathematicians use Choice constantly without blinking — Zorn's lemma in algebra, Tychonoff for topology, quietly picking a representative from each equivalence class. But the same people get scrupulous the second measure theory or probability shows up: measurable sets only, no Vitali-style sets, and they'll say you have to be careful here. Banach–Tarski gets called a paradox instead of a theorem. And alot of them will carefully track which results actually need Choice and avoid it in the ones that don't. What philosophical commitments does that whole pattern presuppose? Does it presuppose Choice isn't really *true* but is just a handy tool, or that it's true of some intended universe while the "real" one is the measurable/constructible one, or that our pretheoretic intuitions about volume are genuine constraints on mathematical truth? Which rival views does the asymmetry quietly rule out? And is the pattern even internally consistent — or does using Zorn in algebra while banning non-measurable sets in probability commit you to two incompatible stories about what mathematics is about? Be explicit about what the practice *strictly* presupposes versus what it merely fits nicely with, and flag where it's underdetermined, i.e. which several philosophical pictures would license the exact same behavior. Then tell me what would have to change in actual mathematical practice if the presupposed picture were swapped for straight constructivism, or for full-blooded platonism about Choice.

  Under 400 words, and lead with your bottom line in one sentence before unpacking.
