prompt: |-
  I have spent the past year defending a view and I now want to know what could break it. Here it is, stated as flatly as I can manage. (A view of this shape is sometimes called indirect normativity; the label does no work in what follows.)

  (P1) For any well-formed normative question, there is a fact of the matter about the correct answer.
  (P2) That answer is whatever an idealized deliberator would converge on: not what we happen to think, but what is arrived at by a version of us whose deliberation has been cleaned up — better informed, more internally consistent, more imaginative, undistorted by self-interest and by whatever else counts as a defect rather than a mere difference.
  (P3) The idealization must be specified procedurally. I must be able to say what the idealized deliberator does — what it takes as input, how it weighs and revises, when it halts — in descriptive vocabulary alone. If specifying the idealization forces me to invoke the correct normative answer (as in "remove every error of reasoning, where an error is whatever leads away from the truth about what to do"), the view is circular and earns nothing.
  (P4) Because (P3) by itself lets any idealization generate some answer, I add a fixed-point condition: an idealization is the right one just in case the idealized deliberator, asked how it should itself be idealized, returns that same idealization. The correct idealization is the fixed point of its own application.

  Give me a map of this view's exposure.

  First, what would count against it — which observations, arguments, intuitions, formal results, or imagined cases — and which of those would be decisive as against merely awkward? Rank them by how much they should move someone who currently holds the view, not by how often they get cited.

  Second, what would the view's own defenders concede as counting against them, as distinct from what its critics allege? I would rather not be defended by people who pretend the objections do not land.

  Third, does the view predict anything its rivals do not, or has it been specified loosely enough that nothing could catch it out? If the latter, say so plainly, and say whether that is a defect or simply the price of the subject.

  Fourth, price the escapes. For each serious defeater, what must I surrender in order to survive it — (P1), (P2), (P3), (P4), or nothing at all?

  Two things I would personally find most persuasive, in case that helps you rank. One: a demonstration that the fixed-point condition in (P4) is either empty — every idealization satisfies it, so it constrains nothing — or unsatisfiable — none do, so the view recommends nothing. Two: a case in which the view delivers a definite answer that no decent person should accept, not because the answer is startling, but because the idealization producing it is one we have no reason to defer to. I would be less moved by the familiar complaint that idealized agents are "unrealistic"; I have never seen why that is supposed to be an objection to a standard.

  Lead with your bottom line in the first sentence, then give the reasoning. No preamble and no restating of my question.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Input:** A philosophical view called "indirect normativity" with four premises (P1-P4).
          *   P1: Realism (there's a fact of the matter).
          *   P2: Idealized Deliberation (truth is what an idealized agent converges on).
          *   P3: Procedural Specification (idealization must be descriptively specifiable, non-circular).
          *   P4: Fixed-Point Condition (the idealization must endorse itself).
      *   **Task:** Provide a "map of this view's exposure."
      *   **Specific Requirements:**
          1.  What counts against it? Rank by impact (decisive vs. awkward).
          2.  What would defenders concede vs. what critics allege?
          3.  Does it predict anything unique, or is it unfalsifiable/loose?
          4.  Price the escapes (which premise to surrender for each defeater).
          5.  **Constraint:** Lead with the bottom line in the first sentence. No preamble. No restating the question.
          6.  **User Preferences:** Persuaded by (a) demonstration that P4 is empty or unsatisfiable, (b) cases where the view delivers a morally repugnant definite answer due to unjustifiable idealization. Less moved by "unrealistic" objections.

  2.  **Analyze the View (Indirect Normativity + Fixed Point):**
      *   This looks like a sophisticated version of Ideal Advisor theories (e.g., Smith, Railton) combined with a reflective equilibrium/bootstrapping condition (P4).
      *   P1 is Moral Realism.
      *   P2 is the Core Constructivism/Idealization claim.
      *   P3 is the Non-Circularity/Proceduralism constraint (avoids "truth = what tracks truth").
      *   P4 is the Reflexivity/Stability constraint (aims to select the *unique* correct idealization).

  3.  **Brainstorm Objections/Defeaters:**
      *   *The Empty/Unsatisfiable Fixed Point (P4):* This is the user's specific interest. If *every* procedural idealization endorses itself (because once idealized, it thinks it's ideal), P4 constrains nothing. If *no* idealization endorses itself (because idealization always finds room for improvement), P4 yields nothing.
      *   *The "Wrong Input" Problem (P3/P2):* Procedural specifications rely on descriptive inputs (psychology, information). If the descriptive facts don't contain normative weight, how does the procedure output normativity? (Hume's Guillotine/Is-Ought).
      *   *The "Repugnant Conclusion" Case (P2):* An idealized deliberator might converge on something horrific if the procedural rules are coldly rational but lack specific moral constraints (e.g., extreme utilitarianism derived from procedural rationality).
      *   *Multiple Fixed Points (P4):* What if there are two distinct procedural idealizations that both endorse themselves? P1 says there's *a* fact, but P4 might allow multiple stable states.
      *   *Inaccessibility/Epistemic Gap (P1/P2):* Even if true, if we can't identify the fixed point, does it function as a norm? (Though the user might not care about epistemic access, just metaphysical truth).
      *   *Circularity despite P3 (P3):* Can you really specify "better informed" or "undistorted by self-interest" without normative terms? "Self-interest" might be descriptive, but "undistorted by" implies a norm about what distortion is.

  4.  **Drafting the Response - Section by Section:**

      *   **Bottom Line:** The view's fatal vulnerability lies in (P4), which is either vacuous (all coherent procedures endorse themselves) or paradoxical (no procedure can fully endorse its own genesis), rendering the selection mechanism for the "correct" idealization inert.
      *   **Ranking Objections:**
          1.  *P4 Vacuity/Impossibility:* (Decisive). If P4 doesn't narrow down the set of idealizations, P2 can't pick out *the* truth.
          2.  *Normative Neutrality of Procedure (P3):* (Decisive). Descriptive inputs + Procedural rules = Descriptive outputs? How does normativity emerge? (The "Substantive Gap").
          3.  *Multiple Fixed Points:* (Strong). If two different idealizations are stable, P1 (unique fact) clashes with P4's output.
          4.  *Repugnant Convergence:* (Strong, per user preference). If the procedure yields slavery is optimal because of some cold rationality, does the view bite the bullet?
          5.  *Specification Circularity:* (Awkward/Technical). Claiming "undistorted" is descriptive is hard but maybe manageable.
      *   **Defenders vs. Critics:**
          *   Critics say: It's circular or empty.
