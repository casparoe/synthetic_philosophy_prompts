      *   **Antiquarian History:** Preserves the past for its own sake, reveres ancestors, focuses on detail and lineage. *Danger:* Mummifies the present, stifles innovation, leads to paralysis through over-reverence, "everything old is good."
      *   **Critical History:** Judges and condemns the past to break its chains, allowing for new creation. *Danger:* Nihilism, rootlessness, destroying necessary foundations, cynicism.
      *   **Outsourced History (User's Proposal):** Passive consumption of algorithmic/search-engine history. No agency, no selection, fragmented, reactive.

  3.  **Evaluate "Outsourced History":**
      *   Is it a distinct category? Nietzsche's categories are about *attitudes* or *intentions* toward the past (inspire, preserve, destroy). "Outsourced" describes the *mechanism of delivery* and the *lack of agency*.
      *   However, the *effect* is distinct. It's not just revering the past (antiquarian) or seeking heroes (monumental). It's a *hollowing out* of the relationship to time. It creates a presentist bubble where the past is just content.
      *   Is it worse than the others? Nietzsche argues history is only useful if it serves *life*. All three traditional modes become poisonous when they dominate life. But "outsourced" history prevents the formation of a coherent relationship with time altogether. It's not just a bad relationship; it's the absence of one.
      *   *Decision:* It is a valid fourth category because it represents a technological/existential shift Nietzsche couldn't foresee (the algorithmic feed). It's arguably more dangerous because it undermines the *capacity* to choose a mode in the first place.

