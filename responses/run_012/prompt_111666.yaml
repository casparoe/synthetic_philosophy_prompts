      *   Response: It bites *if* you accept that rationality is normative for agents *qua* agents, not just *qua* preference-satisfiers. If rationality is just instrumental efficiency, the user wins. If rationality is constitutive of being a unified self, the user loses.
      *   Key distinction: *Substantive* rationality (getting good stuff) vs. *Structural* rationality (having a coherent mind). The user's view relies on Substantive. The counter-argument relies on Structural.

  8.  **Refining the "Vacuity" Argument:**
