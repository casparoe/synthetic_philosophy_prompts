  The joint that gives
  Drop step (3). The principle that "a difference that makes no difference is not a difference" is an unrestricted verificationist claim eliminating reality unaccompanied by evidence. Applying it universally collapses realism about dogs, infants, and forgotten waking moments. To save your Malcolm-inspired conclusion without the absurd generalization, treat (3) not as a metaphysical truth, but as a grammatical remark specific to "dreaming." You can keep (1) and (5) only if you argue that the *grammar* of dreams differs from waking experience, not that all untraceable events are non-existent. Dropping (3) as a universal principle stops the bleed into anesthesia and infancy, but it costs you the simple proof for (5); you must now argue specifically about dream-language, not general epistemology. You retain the thesis but lose the metaphysical engine, requiring a shift from verificationism to linguistic analysis. This is the only way to halt the reductio.

  Why it looked fine
  Step (3) seduces because it wears the cloak of scientific rigor and common sense. It echoes Peirce's pragmatism and Dennett's heterophenomenology, suggesting that ontology should not outrun epistemology. In a scientific context, positing unobservable entities that exert no causal influence is indeed methodologically suspect. You likely felt secure because this principle protects against metaphysical extravagance; it prevents us from populating the world with invisible dragons or undetectable ghosts. For (3) to survive as a universal truth, you would have to be a strict verificationist or anti-realist about the past, believing that truth is constituted entirely by available evidence. This view was popular in mid-century positivism but largely abandoned because it conflicts with our basic realist intuition that events occur regardless of observation. You trusted (3) because it aligns with a naturalistic desire to avoid mystery, but it overlooks that accountability is an epistemic constraint, not an ontological one. The step looked fine because it aligns with a naturalistic desire to avoid mystery, but it smuggles in a controversial metaphysical claim under the guise of methodological hygiene. It conflates "we cannot know" with "it did not happen," which is permissible for defining concepts like 'dream' but disastrous for defining 'experience' generally. In the specific case of dreams, the conflation feels plausible because the dream *is* the report. But generalizing it assumes all experiences are defined by their reports, which contradicts the phenomenological intuition that experience precedes expression.

  What the other options cost
  Dropping (1) abandons Malcolm's core thesis entirely. You admit dream content exists independently of the report, committing you to realism about dream objects. The bear exists in the dream even if unreported. The cost is losing the Wittgensteinian insight that dream grammar is unique. You join the standard cognitive science view that dreams are neural events with content, making your paper conventional. You shift from conceptual analysis to empirical psychology, requiring evidence from REM studies rather than logical argumentation. This fundamentally alters your methodology.

  Dropping (2) denies the possibility of a traceless fact. This requires arguing that physicalism guarantees a physical trace for every mental event. This is empirically false; memory decay and entropy are real. You would be defending a perfect determinism where nothing is ever truly lost, which is scientifically untenable.

  Dropping (4) allows experiences without facts of matter. This creates a paradox: an experience occurred, but it is not true that it occurred. This violates the law of non-contradiction or requires a radical revision of truth predicates. It costs you logical coherence. You cannot consistently assert the existence of an event while denying the truth of propositions describing it.

  Dropping (5) concedes dreams are experiences. This saves realism about infants and dogs but abandons your conclusion. You lose the provocative edge of your paper. You must then explain why dreams are experiences despite lacking independent criteria.

  The real cost lies in keeping (1) and (5) while dropping (3)'s universality. You lose the elegance of a general principle. You must argue why dreams are special compared to forgotten waking moments. This requires detailed grammatical analysis rather than a quick metaphysical slash. It makes your paper harder to write but philosophically safer. You must show that 'dreaming' is a concept defined by waking assertion, whereas 'experiencing' is not. This distinction is subtle and demands rigorous textual work on Wittgenstein rather than relying on a broad verificationist stroke. It isolates the anomaly to dreams, preserving realism elsewhere while maintaining your thesis, but it removes the powerful engine that drove your original draft. You avoid the infant reductio but must defend why infants don't count as "dreaming," requiring a nuanced account of reportability. You must distinguish incapacity to report from conceptual absence. It increases your workload significantly but secures your argument against the "proves too much" objection. Without the general principle, you cannot simply assert the conclusion; you must demonstrate the linguistic asymmetry. This is the price of avoiding absurdity.

  Where this leaves Malcolm and Dennett
  Dropping (3) vindicates Malcolm only if restricted to grammar. Malcolm argued dream reports constitute the dream, not that unreported events don't exist. Your revision aligns with this: dreams are linguistically constituted, unlike waking experiences. This saves Malcolm from the "infant" objection by treating dreaming as a specific language-game. Dennett's dissolution, however, relies heavily on something like (3). His heterophenomenology treats the subject's report as the final datum. Without (3), Dennett loses the weapon to dissolve the "real experience" question. He cannot simply say the question disappears; he must explain why the question is legitimate for waking states but not dreams. The disagreement becomes verbal only if both accept the grammatical restriction. If Dennett insists on a general verificationism, he falls into your "proves too much" trap. If Malcolm insists on realism about waking experience, he must admit (3) is false generally. Thus, the fix clarifies the dispute: it is not about metaphysics but about concept formation. Dennett's move cannot be made without adding a general principle about claims that can't be checked, which is exactly what your revision rejects. Therefore, Dennett's dissolution fails for general experience but might hold for dreams if treated as a specific linguistic practice. Malcolm survives, but as a philosopher of language, not a metaphysician.
