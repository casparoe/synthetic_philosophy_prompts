answer: |-
  # Specification: Consent Validity Protocol (CVP) v1.0

  **Owner:** Engineering / Privacy / Product  
  **Status:** Draft for Review  
  **Purpose:** To determine whether a proposed data collection or usage feature is morally and normatively permitted based on user consent.  
  **Scope:** Applies to all features where user data is used for purposes beyond direct individual care (e.g., model training, research, partner sharing).

  ---

  ## 1. Core Principle
  Consent is a **normative power**. A valid consent act transforms an action from *impermissible* to *permissible*. If the consent is invalid, the action remains impermissible regardless of user click-through rates or legal waivers. This procedure tests the *validity* of the consent, not just the *record* of it.

  ## 2. The Decision Procedure
  Run this sequence for every new data use case. The sequence terminates at the first **FAIL**. If a step requires **ESCALATE**, pause development until a designated Ethics/Privacy Board (Product, Counsel, Clinical Lead) renders a judgment.

  ### Phase 1: Competence & Capacity
  *Goal: Verify the agent has the authority and capacity to grant permission.*

  **Q1.1: Is the user an adult with legal authority?**
  *   **Pass:** User is 18+ (or local majority) and not under guardianship.
  *   **Fail:** User is a minor or under guardianship without guardian consent.
  *   **Escalate:** User is an employee/contractor of the company. (See *Power Dynamics* below).

  **Q1.2: Is capacity fluctuating?**
  *   **Context:** Telehealth patients may be distressed, medicated, or in crisis.
  *   **Test:** Is consent sought *during* a crisis intervention or acute episode?
  *   **Pass:** Consent is sought during a stable period (e.g., onboarding, post-recovery follow-up).
  *   **Fail:** Consent is sought while the user is actively experiencing the condition the data describes (e.g., asking for research consent during a suicide risk assessment).
  *   **Escalate:** Condition is chronic and fluctuating (e.g., bipolar disorder). Evidence required: Clinical lead sign-off that the specific moment of consent aligns with a "lucid interval."

  ### Phase 2: Voluntariness & Power
  *Goal: Verify the decision is free from coercion and undue influence.*

  **Q2.1: Is there a threat? (Coercion)**
  *   **Definition:** A threat worsens the user's baseline if they refuse (e.g., "If you don't consent, we will discharge you").
  *   **Test:** Does refusal result in the loss of standard care or existing benefits?
  *   **Pass:** Refusal results in status quo (care continues, data not used for research).
  *   **Fail:** Refusal results in penalty (reduced access, higher cost, removal from program).
  *   **Action:** Immediate **FAIL**.

  **Q2.2: Is there an offer too good to refuse? (Undue Influence)**
  *   **Definition:** An offer that distorts judgment because the user is vulnerable (e.g., "Consent to data use and get free therapy").
  *   **Test:** Is the incentive disproportionate to the risk, given the user's distress level?
  *   **Pass:** Incentive is nominal (e.g., summary of research findings).
  *   **Escalate:** Incentive is financial or access-based (e.g., discounted care, priority scheduling). *Judgment Call:* Does this exploit the user's need?

  **Q2.3: Is there manipulation? (Dark Patterns)**
  *   **Definition:** Interface design that bypasses rational deliberation (e.g., confusing language, hidden opt-outs, "roach motel" UI).
  *   **Test:** Is the "No" path equally visible and clickable as the "Yes" path?
  *   **Pass:** Binary choice, equal visual weight, no pre-ticked boxes.
  *   **Fail:** "Continue" implies consent, "No" is hidden in settings, or language is emotionally loaded ("Help us save lives" vs. "Allow data use").

  ### Phase 3: Information & Understanding
  *Goal: Verify the user knows what they are authorizing.*

  **Q3.1: Is the purpose specific?**
  *   **Test:** Can the engineering team write the data usage logic in one sentence without using the word "research" or "improvement"?
  *   **Pass:** "Train a model to detect depression markers in text."
  *   **Fail:** "Improve our services," "Partner ecosystem," "Future research."
  *   **Escalate:** Purpose is technical but opaque (e.g., "Embedding generation for vector search"). *Requirement:* Plain language translation must be tested on 5 non-technical users.

  **Q3.2: Is the risk disclosed?**
  *   **Test:** Are re-identification risks and model hallucination risks stated?
  *   **Pass:** "Notes will be de-identified, but re-identification is theoretically possible."
  *   **Fail:** "Your data is anonymous and safe." (False certainty).

  ### Phase 4: Normative Match (Scope)
  *Goal: Verify the consent covers the specific act proposed.*

  **Q4.1: Does the consent match the data?**
  *   **Test:** Does the consent text explicitly name the data type (e.g., "session notes," "audio," "metadata")?
  *   **Pass:** Text matches data schema.
  *   **Fail:** Consent says "health data," usage is "audio recordings."

  **Q4.2: Does the consent match the actor?**
  *   **Test:** Is the data staying within the entity the user trusted?
  *   **Pass:** Internal engineering team only.
  *   **Escalate:** Third-party vendor or research partner. *Judgment Call:* Does the user understand this entity is distinct? Does the partner have the same ethical constraints?

  ### Phase 5: Time & Revocability
  *Goal: Verify the permission can be withdrawn.*

  **Q5.1: Is revocation technically possible?**
  *   **Test:** Can we delete the data or remove it from the training set if they withdraw?
  *   **Pass:** Data can be quarantined/deleted.
  *   **Fail:** Data is already baked into a static model weights file that cannot be unlearned. (If unlearning is impossible, consent must state this limitation explicitly).

  **Q5.2: Is the consent perpetual?**
  *   **Test:** Is there an expiration or re-consent trigger?
  *   **Pass:** Consent expires after X years or upon major policy change.
  *   **Escalate:** "One-time consent for all future uses." *Judgment Call:* Is the scope narrow enough to justify indefinite duration?

  ---

  ## 3. Escalation Matrix (Judgment Calls)
  The following questions cannot be solved by code or copy. They require human ethical judgment. If triggered, the feature cannot ship until resolved.

  | Trigger | Decision Authority | Criteria for Approval |
  | :--- | :--- | :--- |
  | **Economic Dependence** (Q1.1) | Privacy Counsel + HR | Proof that refusal has zero impact on employment status/compensation. |
  | **Undue Influence** (Q2.2) | Clinical Lead + Product | Incentive must not be necessary for the user's basic care or financial stability. |
  | **Opaque Tech** (Q3.1) | Eng Lead + UX | User testing shows >80% comprehension of the technical outcome. |
  | **Third-Party Sharing** (Q4.2) | Privacy Counsel | Contractual binding of the partner to this same CVP. |
  | **Broad/Perpetual Consent** (Q5.2) | Ethics Board | Scope must be narrowly defined even if time is broad. |

  ---

  ## 4. Application to Concrete Cases

  ### Case 1: The "Continued Use" Modal
  **Proposal:** A modal appears on login: "By continuing to use this app, you consent to your de-identified notes being used to train our AI." No explicit "I Agree" button; the "X" to close the modal also counts as acceptance if they stay on the site.
  **Business Goal:** Reduce friction, maximize dataset size.

  **CVP Execution:**
  *   **Phase 1 (Competence):** Pass (Assume adult).
  *   **Phase 2 (Voluntariness):** **FAIL (Q2.3 Manipulation).**
      *   *Reasoning:* "Continued use" is not an affirmative act of will. It conflates necessary access to care with permission for secondary use. It relies on inertia.
      *   *Normative Power:* Clicking "X" or navigating does not clearly signal "I grant you permission." It signals "I want to use my app." The normative power is not exercised.
  *   **Phase 5 (Revocability):** **FAIL (Q5.1).**
      *   *Reasoning:* If consent is passive, revocation is usually equally passive or hidden.

  **Verdict:** **DO NOT SHIP.**
  **Unpleasant Truth:** This pattern is industry-standard but philosophically invalid. It treats consent as a liability shield rather than a transfer of permission. To fix this, you need an explicit "I Agree" button and a separate path for users who say "No" (they must still get care).

  ### Case 2: The Waiting Room Recruitment
  **Proposal:** Patients in a physical clinic waiting room are approached by a researcher. They are told: "Participating in this data study helps us improve care for people like you. Declining won't affect your care, but participants get priority scheduling for future appointments."
  **Business Goal:** High-quality labeled data from clinical setting.

  **CVP Execution:**
  *   **Phase 1 (Competence):** **ESCALATE (Q1.2 Fluctuating Capacity).**
      *   *Reasoning:* Patients in a waiting room are pre-appointment. Anxiety levels are high. Capacity may be compromised by anticipation of diagnosis.
  *   **Phase 2 (Voluntariness):** **FAIL (Q2.2 Undue Influence).**
      *   *Reasoning:* "Priority scheduling" is a costly offer. For a distressed patient, access to care is a primary need. Making refusal "costly" (by delaying care) creates undue influence, even if it's not a direct threat. It exploits their vulnerability to gain consent.
  *   **Phase 3 (Information):** **ESCALATE (Q3.1 Specificity).**
      *   *Reasoning:* "Improve care" is vague.

  **Verdict:** **DO NOT SHIP (in current form).**
  **Evidence to Move Decision:** Remove the "priority scheduling" incentive. Move recruitment to a post-recovery follow-up email when anxiety is lower. Change copy to specify exactly how data is used.

  ### Case 3: The "Broad Future Research" Consent
  **Proposal:** On onboarding, users check a box: "I agree to let my data be used for any future medical research conducted by [Company] or its partners."
  **Business Goal:** Flexibility to pivot data use without re-consenting.

  **CVP Execution:**
  *   **Phase 1 (Competence):** Pass.
  *   **Phase 2 (Voluntariness):** Pass (Assuming no coercion).
  *   **Phase 3 (Information):** **FAIL (Q3.1 Specificity).**
      *   *Reasoning:* "Any future research" is unknowable. The user cannot understand what they are consenting to because the purpose does not yet exist.
  *   **Phase 4 (Normative Match):** **FAIL (Q4.2 Actor).**
      *   *Reasoning:* "Partners" is undefined. The user trusted [Company], not an unspecified third party.
  *   **Phase 5 (Time):** **ESCALATE (Q5.2 Perpetual).**
      *   *Reasoning:* Indefinite time requires indefinite trust.

  **Verdict:** **DO NOT SHIP.**
  **Unpleasant Truth:** You cannot bank consent for unknown purposes. If you want to use data for a new partner or new research type later, you must re-consent.
  **Evidence to Move Decision:** Narrow the scope. "Mental health research related to depression and anxiety." Define the partners (list them). Add a re-consent trigger if the scope changes.

  ---

  ## 5. Limitations: What This Procedure Cannot Settle
  This protocol is a tool for engineering and product, not a substitute for moral philosophy. It cannot resolve the following:

  1.  **The "Black Box" Problem:** If the model learns patterns the engineers cannot explain (e.g., inferring race from text despite de-identification), consent based on "de-identified text" is technically valid per CVP but may be morally hollow. The procedure tests the *promise*, not the *outcome*.
  2.  **Structural Power:** The procedure treats the company and user as distinct agents. It cannot fully account for the fact that in a monopoly market, "refusal" is theoretically possible but practically impossible. Q2.1 tests for explicit threats, not market coercion.
  3.  **The "Right to Be Forgotten" vs. Model Integrity:** If a user revokes consent (Phase 5), and we cannot technically "unlearn" their data from a neural net without retraining from scratch, we face a conflict between technical reality and normative permission. The procedure flags this (Q5.1), but does not solve the technical debt.
  4.  **Value Conflicts:** If the Ethics Board (Escalation Matrix) disagrees on a judgment call (e.g., is $50 gift card undue influence?), this procedure does not arbitrate. It requires a tie-breaker authority (e.g., CEO or External Board).

  ## 6. Implementation Notes for Engineering
  *   **Logging:** Every "Pass" in this procedure must be linked to a ticket ID and a timestamped artifact (e.g., screenshot of the modal, copy document, architecture diagram).
  *   **Hard Stops:** CI/CD pipelines should not block on this, but Release Management must verify the CVP ticket is "Approved" before enabling data flags in production.
  *   **Review Cadence:** This spec must be reviewed quarterly. If a "Judgment Call" occurs more than twice, convert it into a hard "Pass/Fail" rule.
