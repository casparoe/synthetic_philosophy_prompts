  ### The Case: The "Roommate Renovation" Game

  **Context:** Alice and Bob are roommates deciding how to handle a necessary apartment renovation. They must simultaneously choose a level of involvement.
  *   **Strategies:** *Lead* (manage the contractors), *Help* (assist on weekends), or *Ignore* (do nothing).
  *   **Payoffs:** Represent utility (Satisfaction from renovation minus Effort cost). Higher is better.
  *   **The Tension:** If both *Ignore*, the apartment decays (0 utility). If one *Leads* and the other *Helps*, it's efficient. If both *Lead*, they clash (wasted effort). If one *Leads* and the other *Ignores*, the Leader is exploited.

  **The Payoff Matrix (Alice, Bob):**

  | Alice \ Bob | Lead (L) | Help (H) | Ignore (I) |
  | :--- | :---: | :---: | :---: |
  | **Lead (L)** | 2, 2 | 2, 1 | 0, 0 |
  | **Help (H)** | 2, 2 | 2, 2 | 1, 0 |
  | **Ignore (I)**| 0, 0 | 1, 1 | 1, 1 |

  ---

  ### 1. The Weaker Reading: Common Knowledge of Avoiding Strict Dominance
  **Assumption:** It is common knowledge that no player chooses a **Strictly Dominated Strategy (SDS)**. A strategy is strictly dominated if it yields a lower payoff than another strategy against *every* possible opponent move.

  **Iterated Elimination of Strictly Dominated Strategies (IESDS):**
  *   **Round 1 (Alice):**
      *   Compare *Lead* (2, 2, 0) vs. *Help* (2, 2, 1). *Help* is better against *Ignore*, equal otherwise. Not strict dominance (ties exist).
      *   Compare *Help* (2, 2, 1) vs. *Ignore* (0, 1, 1). *Help* is better against *Lead*, equal against *Ignore*. Not strict.
      *   Compare *Lead* vs. *Ignore*. *Lead* is better against *Help*. Not strict.
      *   *Result:* No strategy is strictly dominated for Alice.
  *   **Round 1 (Bob):**
      *   Symmetric payoffs. No strategy is strictly dominated for Bob.

  **Verdict:** The IESDS process halts immediately. All 9 cells survive.
  **Prediction:** The weaker reading of Common Knowledge of Rationality (CKR) predicts **nothing**. Any outcome is possible.

  ---

  ### 2. The Stronger Reading: Common Knowledge of Avoiding Weak Dominance
  **Assumption:** It is common knowledge that no player chooses a **Weakly Dominated Strategy (WDS)**. A strategy is weakly dominated if it yields a payoff less than or equal to another strategy against all opponent moves, and strictly less against at least one.

  **Iterated Elimination of Weakly Dominated Strategies (IEWDS):**
  *Note: IEWDS is order-dependent. The surviving cell depends on which player's rationality we "apply" first.*

  **Path A: Alice's Rationality First (Row Elimination)**
  1.  **Alice:** *Help* (2, 2, 1) weakly dominates *Lead* (2, 2, 0). (Equal against L, H; Better against I).
      *   *Eliminate Lead.*
      *   *Remaining Matrix:*
          | | L | H | I |
          |---|---|---|---|
          | **H** | 2,2 | 2,2 | 1,0 |
          | **I** | 0,0 | 1,1 | 1,1 |
  2.  **Bob:** Now consider Bob's payoffs in this reduced game.
      *   *Help* (2, 1) vs. *Lead* (2, 0). *Help* weakly dominates *Lead*.
      *   *Help* (2, 1) vs. *Ignore* (1, 1). *Help* weakly dominates *Ignore*.
      *   *Eliminate Lead and Ignore.* Bob plays *Help*.
      *   *Remaining Matrix:*
          | | **H** |
          |---|---|
          | **H** | 2,2 |
          | **I** | 1,1 |
  3.  **Alice:** *Help* (2) strictly dominates *Ignore* (1).
      *   *Eliminate Ignore.*
  4.  **Survivor:** **(Help, Help)**. Payoff: (2, 2).

  **Path B: Bob's Rationality First (Column Elimination)**
  1.  **Bob:** *Help* (2, 2, 1) weakly dominates *Lead* (2, 2, 0).
      *   *Eliminate Lead.*
      *   *Remaining Matrix:*
          | | **H** | **I** |
          |---|---|---|
          | **L** | 2,2 | 0,0 |
          | **H** | 2,2 | 1,0 |
          | **I** | 1,1 | 1,1 |
  2.  **Alice:** Now consider Alice's payoffs.
      *   *Help* (2, 1) vs. *Lead* (2, 0). *Help* weakly dominates *Lead*.
      *   *Help* (2, 1) vs. *Ignore* (1, 1). *Help* weakly dominates *Ignore*.
      *   *Eliminate Lead and Ignore.* Alice plays *Help*.
      *   *Remaining Matrix:*
          | | **H** | **I** |
          |---|---|---|
          | **H** | 2,2 | 1,0 |
  3.  **Bob:** *Help* (2) strictly dominates *Ignore* (0).
      *   *Eliminate Ignore.*
  4.  **Survivor:** **(Help, Help)**. Payoff: (2, 2).

  *Wait, this converged.* To satisfy your requirement for divergence ("a different order should kill a different cell"), we must tweak the payoffs slightly to create a **tie-breaking divergence**. This is the standard feature of IEWDS order dependence.

  **Revised Matrix for Divergence (The "Stalemate" Variant):**

  | Alice \ Bob | Lead (L) | Help (H) | Ignore (I) |
  | :--- | :---: | :---: | :---: |
  | **Lead (L)** | 2, 2 | 1, 1 | 0, 0 |
  | **Help (H)** | 2, 2 | 1, 1 | 1, 0 |
  | **Ignore (I)**| 0, 0 | 0, 1 | 1, 1 |

  **Re-Run IEWDS on Revised Matrix:**

  **Path A (Row First):**
  1.  **Alice:** *Help* (2, 1, 1) weakly dominates *Lead* (2, 1, 0). Eliminate *Lead*.
      *   *Remaining:*
          | | L | H | I |
          |---|---|---|---|
          | **H** | 2,2 | 1,1 | 1,0 |
          | **I** | 0,0 | 0,1 | 1,1 |
  2.  **Bob:** *Help* (1, 1) weakly dominates *Lead* (2, 0)? No (1<2).
      *   *Help* (1, 1) weakly dominates *Ignore* (0, 1). Eliminate *Ignore*.
      *   *Remaining:*
          | | L | H |
          |---|---|---|
          | **H** | 2,2 | 1,1 |
          | **I** | 0,0 | 0,1 |
  3.  **Alice:** *Help* (2, 1) strictly dominates *Ignore* (0, 0). Eliminate *Ignore*.
      *   *Remaining:*
          | | L | H |
          |---|---|---|
          | **H** | 2,2 | 1,1 |
  4.  **Bob:** *Lead* (2) strictly dominates *Help* (1). Eliminate *Help*.
      *   **Survivor:** **(Help, Lead)**. Payoff: (2, 2).

  **Path B (Column First):**
  1.  **Bob:** *Help* (2, 1, 1) weakly dominates *Lead* (2, 1, 0). Eliminate *Lead*.
      *   *Remaining:*
          | | H | I |
          |---|---|---|
          | **L** | 1,1 | 0,0 |
          | **H** | 1,1 | 1,0 |
          | **I** | 0,1 | 1,1 |
  2.  **Alice:** *Help* (1, 1) weakly dominates *Lead* (1, 0). Eliminate *Lead*.
      *   *Help* (1, 1) weakly dominates *Ignore* (0, 1). Eliminate *Ignore*.
      *   *Remaining:*
          | | H | I |
          |---|---|---|
          | **H** | 1,1 | 1,0 |
  3.  **Bob:** *Help* (1) weakly dominates *Ignore* (0). Eliminate *Ignore*.
      *   **Survivor:** **(Help, Help)**. Payoff: (1, 1).

  **Verdict:** The stronger reading predicts **(Help, Lead)** if we prioritize Alice's rationality, but **(Help, Help)** if we prioritize Bob's. The "Unique Prediction" is an artifact of the elimination order.

  ---

  ### 3. Analysis of the Structural Feature
  The divergence is driven by **indifference (ties) in the payoff structure**.
  *   In the Weaker Reading (Strict Dominance), ties protect strategies from elimination. A strategy is only killed if it is *always* worse.
  *   In the Stronger Reading (Weak Dominance), ties allow elimination. A strategy is killed if it is *sometimes* worse and *never* better.
  *   **The Mechanism:** When you eliminate a strategy based on a tie (weak dominance), you remove a column or row that was "holding up" the payoff comparison for the other player. In Path A, removing Alice's *Lead* strategy removed a column where Bob's *Lead* performed well (2 vs 1). Once that column was gone, Bob's *Lead* looked inferior. In Path B, removing Bob's *Lead* strategy removed a row where Alice's *Help* didn't gain an advantage, altering her dominance relations.

  ### 4. How to Make the Readings Agree
  To make the Weaker and Stronger readings converge on a unique prediction, you must **perturb the payoffs to remove ties** (make the game "generic").
  *   **Change:** Adjust the (Help, Help) payoff for Alice from 1 to 1.01.
  *   **Effect:** *Help* now *strictly* dominates *Lead* for Alice immediately.
  *   **Result:** IESDS (Weaker) will now eliminate *Lead* in Round 1. The cascade will proceed identically to IEWDS regardless of order.
  *   **Lesson:** Common Knowledge of Rationality yields robust predictions only when preferences are strict. When agents are indifferent, "Rationality" alone is insufficient to determine behavior without additional assumptions about tie-breaking.

  ### 5. The Skeptic's Argument
  A theorist who denies that avoiding weak dominance is required by rationality would argue:

  > "The unique prediction in Path A or B is an artifact of assuming that rational agents treat 'equal' payoffs as grounds for elimination. Rationality only forbids choosing an option that is *definitely* worse (strict dominance). If I am indifferent between *Lead* and *Help* when you *Ignore*, it is perfectly rational for me to play *Lead* just in case you have a 'trembling hand' and play *Lead* with tiny probability, where *Lead* might yield me a higher payoff than *Help*.
  >
  > By eliminating weakly dominated strategies, you are implicitly assuming **Common Knowledge of Trembling-Hand Perfection** or **Lexicographic Beliefs**—that is, you assume I believe you will never play the strategy that makes me indifferent, or that I prioritize the 'better' case over the 'equal' case infinitely. This is not a definition of rationality; it is a specific, strong assumption about beliefs. Therefore, the 'Strong Reading' of CKR does not reveal *the* rational outcome; it reveals the outcome consistent with a specific, fragile epistemic stance on indifference."

  ### Summary for Your Post
  This case demonstrates that **Common Knowledge of Rationality** is not a single point on the map of epistemic assumptions.
  1.  **Weak CKR (Strict Dominance):** Too permissive; predicts nothing in games with ties.
  2.  **Strong CKR (Weak Dominance):** More precise, but **order-dependent**. The "solution" changes based on the sequence of elimination, revealing that the assumption hides a secondary assumption about how ties are resolved.
  3.  **Conclusion:** CKR names a **family** of assumptions. To get a unique prediction, one must stipulate not just that players are rational, but *how* they reason about indifference.
