  hey, im a high school student and im doing my TOK essay on math and i picked Bertrand's paradox. my teacher said it shows the principle of indifference is inconsistent because depending on how you pick a chord in a circle you get 1/3, 1/2, or 1/4 for the chance its longer than the side of the inscribed equilateral triangle. like one method picks two random endpoints on the circle, one picks a random radius and then a random point on it, and one picks a random midpoint in the disk. but then i read that some people think Bayesians can still use indifference if you pick the right invariance, and my friend says thats just cheating. what i dont get is: if the same problem can give different probabilities just based on how you describe it, does that mean all probabilities are subjective and science shouldnt use them? and if the principle of indifference is broken, does that mean any time someone says theres no evidence so its 50/50 theyre wrong? i feel like im missing something because my teacher said the paradox doesnt actually prove probability is subjective but i dont see how. can you explain?
