answer: |-
  The projector hummed, a low insect noise that seemed to vibrate in the silence following the slide change. The number sat in the center of the screen, stark black against the white background: *h² = 0.85*.

  Councilor Vane leaned forward, clasping his hands. He looked relieved. "So," he said, his voice echoing slightly in the sterile conference room. "We can stop worrying about the primary schools. The variation is largely internal."

  Dr. Aris Thorne kept her hands flat on the table. "It's not internal, Councilor. It's residual."

  Vane blinked. "Residual to what?"

  "To the environment we've built," Aris said. She clicked the clicker, bringing up a scatter plot. It was a tight, narrow column of data points. "Look at the spread. We standardized the caloric intake at age six. We standardized the screen time at age nine. We standardized the curriculum, the sleep cycles, the micronutrient supplements. We smoothed the ground until it was flat."

  "And that confirms the index," said Kress, the woman from Education. She was taking notes on a tablet, stylus tapping rhythmically. "If the environment is controlled, the natural aptitude shines through."

  "If the environment is controlled," Aris said, "the environmental variance drops to near zero. When the denominator shrinks, the ratio shifts. The genetic variance doesn't change. The kids are the same kids they were yesterday. But because everyone is standing on the same floor, the only reason anyone looks taller is because of their legs."

  Vane waved a hand, dismissing the geometry of it. "But the number is high. Point-eight-five. That implies stability. If we move a child from the Technical stream to the Administrative stream based on this, we aren't fighting nature."

  "You aren't fighting nature because you've removed the variable of nurture," Aris said. She felt the familiar heat rising in her chest, the frustration of trying to explain a shape to people who only wanted a weight. "This number is specific to this population. In this specific year. Under this specific regime."

  "Is the trait genetic?" Vane asked. He wasn't looking at the screen anymore; he was looking at her. "Yes or no, Doctor. Is the aptitude mostly genetic?"

  "It's not a property of the trait," Aris said. "It's a property of the population's variance."

  "English," Kress muttered.

  Aris took a breath. "Imagine two fields of corn. In Field A, the soil is identical, the water is identical, the sun is identical. The only thing that varies is the seed. In that field, the difference in height between stalks is almost entirely genetic. High heritability."

  "And Field B?" Vane asked.

  "Field B has patchy soil. Some spots are rich, some are dust. Some get water, some get drought. In Field B, the difference in height is mostly about where the seed landed. Low heritability."

  Vane nodded slowly. "And we are Field A."

  "We are Field A," Aris said. "Because we made it so."

  "Then the index is robust," Vane said. He turned to Kress. "The sorting holds."

  "Wait," Aris said. "If you change the environment, the number changes. If you let the schools vary again—if you let some districts fail and others thrive—the heritability of the index will plummet. Not because the children changed, but because the environment started doing more of the work. The score would become less predictive of genetics and more predictive of zip code."

  "We have no intention of letting schools fail," Kress said sharply.

  "I know," Aris said. "But that means the score remains sensitive to environmental shifts. If you introduced a new teaching method, or changed the diet, the rankings would shuffle. The 0.85 doesn't mean the score is fixed. It means the *current* conditions are fixed."

  Vane sighed, rubbing his temples. "Doctor, the parents want to know if their child's future is written. They look at this number. They see eight-five. They understand that as 'mostly written'."

  "They understand it wrong," Aris said. "It tells you nothing about an individual child. It tells you about the spread of the group. You cannot look at a boy who scored forty and say 'eighty-five percent of his limitation is genetic.' That statement is meaningless."

  "Is it not useful?" Vane asked. "Does it not help us allocate resources? If we know the variance is largely genetic, we stop pouring money into remedial programs for the lower stream. We accept the distribution."

  Aris stood up. The chair scraped loudly against the floor. "If you stop pouring money into remedial programs, you maintain the uniformity. You keep the environmental variance low. You keep the heritability high. You create a self-fulfilling prophecy where the only thing left to vary is the DNA, because you've banned everything else from varying."

  "We provide equal opportunity," Kress said. "That is the mandate."

  "You provide equal standardization," Aris corrected. "There is a difference. Equal opportunity implies trying to maximize every child's potential. Standardization implies measuring them against a single constraint. This number," she pointed to the screen, "is a measure of how well you standardized them. It is a report card on your bureaucracy, not their brains."

  Vane stood up too. He was taller than her, and he used it, looming over the table. "The Board needs to know if intervention works. If I take a child from the bottom quintile and give them a tutor, will their index change?"

  "Probably," Aris said.

  "Then why is the heritability so high?"

  "Because nobody is doing that yet," Aris said. "The data is retrospective. It measures what happened when everyone got the same thing. It does not measure what happens when you change the inputs. If you start tutoring the bottom quintile, you are introducing environmental variance. You are making Field B. The heritability will drop. The scores will change. The sorting will break."

  Vane sat back down. He looked at Kress. They exchanged a glance that felt like a closed door shutting.

  "So," Vane said, his voice calm again. "If we intervene, the number becomes less reliable."

  "The number becomes less descriptive of genetics," Aris said. "It becomes more descriptive of your policy."

  "We cannot have a system where the metrics shift based on our actions," Kress said. "We need stability. We need to know that the index reflects the child, not the state."

  "It *does* reflect the state," Aris said. "That's the point. The high heritability proves the state is omnipresent. It proves you've successfully eliminated environmental noise. You've won. You've smoothed the world so perfectly that all that's left is the noise of birth. But if you think that means you can't change the outcome by changing the world, you're misreading the math."

  Vane picked up his gavel. It was a small thing, made of polished wood, but it sounded heavy. "We are not debating philosophy, Doctor. We are validating the Allocation Protocol. The data shows the index is stable. The data shows the variance is inherent. We will proceed with the streaming."

  "The variance is inherent *only because you made it so*," Aris said. Her voice was quiet now. She knew she had lost the room the moment she walked in. They didn't want the map; they wanted the territory to match the map.

  "Is there any other business?" Vane asked the room.

  Kress tapped her stylus. "Just the budget for the testing centers. If the heritability is high, do we need to test annually? Or is once enough?"

  Aris sat back down. She looked at the number on the screen. 0.85. It was a beautiful number. Statistically significant. Clean. It described the world exactly as it was, and therefore, exactly as it would remain if no one listened to her.

  "Once is enough," Aris said. She didn't know why she answered. Maybe because it was true. If you don't change the environment, the rank order won't change. The corn won't grow differently if you stop looking at it.

  Vane nodded. "Efficiency gained. Thank you, Doctor Thorne. Your work confirms the system is functioning as intended."

  "It confirms the system is closed," Aris said.

  Vane struck the gavel. The sound was final, a period at the end of a sentence she hadn't finished writing. "Meeting adjourned."

  The panelists stood, gathering their tablets and papers. They talked amongst themselves about lunch, about the traffic, about the weather. Aris remained seated. She watched them leave, one by one, walking out into the hallway where the lights were identical, the floor was level, and the air was filtered to the same specification as the room they left.

  She reached up and clicked the projector off. The screen went white, then dark. The number vanished. It didn't matter. They had already memorized the thing they wanted to believe.
