answer: |-
  Here is the consistency check you asked for. I will start with your interpretation of Lewis, then rank the tensions from fatal to manageable, and tell you which premise needs to be sacrificed.

  ### 1. The Lewis Interpretation (Premise 1)
  **Verdict: Accurate, but incomplete regarding scope.**

  Your summary of Lewis is textually faithful to *Convention* (1969). You correctly identify the three core components: regularity, conditional preference (I prefer to conform *if* you do), and mutual expectations (I expect you to expect me to...).

  **However,** you need to be careful with one nuance: Lewis explicitly distinguishes conventions from **obligations**. For Lewis, a convention gives you a *reason* to act (coordination), but it does not necessarily generate a moral *ought*. He was famously hesitant to extend his analysis to moral norms precisely because moral norms often persist even when the coordination benefit disappears. By adopting (1) as "basically right," you are signing up for a Humean reduction of morality that Lewis himself treated with caution.

  ### 2. Ranking the Tensions
  Here are the conflicts in your package, ranked from "Fatal" to "Fixable."

  #### **Tension #1 (Fatal): Premise (2) vs. The Phenomenology of Morality**
  *   **The Conflict:** You claim conventions model *all* social norms, including moral ones (2). But you also acknowledge that moral norms grip agents even when defecting would pay or when others aren't conforming.
  *   **Why it breaks:** A Lewisian convention is **contingent on general compliance**. If everyone else starts driving on the right, your reason to drive on the left vanishes. If everyone else starts breaking promises, your Lewisian reason to keep them evaporates (coordination is lost).
  *   **The Problem:** Moral norms are characterized by **counter-preferential constraint**. I ought to keep a promise even if it hurts me, and even if others are breaking theirs. If you define moral norms as conventions (2), you cannot explain why they feel binding when the coordination equilibrium collapses.
  *   **Severity:** This is the biggest target in the room. If you defend (2) as written, you will be asked: "If promise-keeping is just a convention like driving on the left, why is it permissible to switch sides if everyone else does, but impermissible to break promises if everyone else does?"

  #### **Tension #2 (Major): Premise (1) vs. Premise (3)**
  *   **The Conflict:** Lewisian agents act *because* they have mutual expectations and conditional preferences (1). Evolutionary processes operate via blind imitation and reinforcement without agents "working out the reasoning" (3).
  *   **Why it breaks:** Lewis provides a **rational reconstruction** of stability (why it makes sense to conform). Evolution provides a **causal history** (how we got here). You cannot have it both ways regarding the agent's psychology.
      *   If (3) is true, agents do *not* conform because they hold rich mutual expectations; they conform because they were selected/trained to.
      *   If (1) is true, the agents must possess the cognitive architecture to represent others' expectations.
  *   **Severity:** High, but survivable *if* you reframe (1). You must treat Lewis not as a psychological description of what agents think, but as a **functional description** of the equilibrium. The agents behave *as if* they are Lewisian rationalists, even if the evolutionary mechanism is blind. If you insist Lewis describes the *actual mental states*, (1) and (3) are incompatible.

  #### **Tension #3 (Apparent): Premise (2) vs. Premise (4)**
  *   **The Conflict:** You suspect moral norms feel non-arbitrary (2), but conventions must be arbitrary (4).
  *   **Why it looks bad:** It seems contradictory to say "Murder is wrong" is arbitrary.
  *   **Why it's actually fixable:** This tension only exists if you conflate the *content* of the norm with the *practice* of the norm. A Lewisian can argue that having *some* norm against killing is non-arbitrary (welfare), but the specific *conventional structure* (e.g., specific definitions of intent, mitigation, or the practice of promising itself) is arbitrary.
  *   **Severity:** Low. You can maintain (4) if you clarify that the *institution* is arbitrary, even if the *benefits* are not. However, this requires watering down (2) significantly.

  ### 3. What Has to Go?
  **Premise (2) is the casualty.**

  You cannot maintain that *all* social norms, especially moral ones, are Lewisian conventions without doing violence to the concept of moral obligation.

  *   **If you keep (2):** You must argue that the "moral grip" is an illusion or a secondary evolutionary trick. This is a defensible position (error theory or expressivism), but it is a massive claim that will dominate your seminar. It makes (1) and (4) subordinate to a controversial meta-ethical claim.
  *   **If you drop (2):** You can save the rest. You can argue that *coordination norms* (driving, queuing, linguistic usage) are Lewisian conventions (1, 3, 4), while *moral norms* might be evolutionary stable strategies that *mimic* conventions but have different normative force (e.g., they are internalized or backed by different sanctions).

  ### 4. How to Fix the Package for the Seminar
  To make this consistent, I recommend the following adjustments:

  1.  **Modify (2):** Distinguish between **Coordination Conventions** (driving, queuing) and **Constitutive Norms** (promising, property). Argue that Lewis explains the former perfectly, and the *structure* of the latter, but not the *obligatory force* of the latter.
  2.  **Clarify (1) vs (3):** Explicitly state that Lewis provides the **equilibrium logic**, while Evolution provides the **dynamic mechanism**. Agents need not hold conscious mutual expectations; they need only behave in ways that *satisfy* the Lewisian conditions for stability. This resolves the "rich expectations" worry.
  3.  **Refine (4):** Clarify that "arbitrary" means "there was an alternative equilibrium," not "there is no reason for the equilibrium." (e.g., We need *a* side of the road; which side is arbitrary).

  **Summary of Advice:**
  Do not walk in claiming moral norms are Lewisian conventions. Walk in claiming that **Lewisian conventions are the substrate upon which moral norms are often built, but the moral 'ought' requires an additional explanatory layer.** If you try to reduce morality entirely to convention (2), the "counter-preferential grip" objection will dismantle the argument.
