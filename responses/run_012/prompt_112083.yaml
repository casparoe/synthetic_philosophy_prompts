prompt: |-
  I'm TAing an intro philosophy of medicine course and next week is my 50-minute section on whether disease is a natural kind or a value-laden category — the naturalism vs normativism thing. Twenty undergrads, mostly pre-med, they've done the reading but I want them to feel the problem rather than recite the two positions back at me. So dont explain the debate to me, plan how I should teach it: what has to be in place before the question even makes sense (I have a hunch it's the fact/value distinction, but not where in the sequence it goes), the one case that carries the whole session, the misconceptions they'll arrive with and the ones they'll form as we go, exactly where in the sequence to head each one off, one question at the end that shows whether it actually landed, and what I should refuse to get into at this level and say so out loud.

  For the carrying case I want something invented rather than the DSM-homosexuality or baldness chestnuts — those let them off the hook because they already know the right answer and just apply it. My attempt: a rare variant in one valley population where people sleep about four hours a night, wake up rested, never feel sleep-deprived, and whose sleep architecture on a scan is genuinely, measurably unlike the rest of us. In the valley nobody calls it anything. Move the same people to a city and they turn up in clinics with insomnia, anxiety, performance problems, because the eight-hour world doesn't fit them. Is that a disease? Is it one in the valley? Does the scan matter, or only the clinic visit? Tell me whether this case can carry the session or where it breaks, and what to patch it with if it does. I'm guessing they'll think normativism just means a culture can call anything a disease and there's no truth of the matter, and that naturalism means statistically abnormal equals diseased — but tell me what I'm missing.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Role:** TA for an intro philosophy of medicine course.
      *   **Task:** Plan a 50-minute section on Naturalism vs. Normativism (Disease as Natural Kind vs. Value-Laden Category).
      *   **Audience:** 20 undergrads, mostly pre-med. They've done the reading.
      *   **Goal:** Make them *feel* the problem, not just recite positions.
      *   **Specific Requirements:**
          *   Prerequisites (what must be in place before the question makes sense, specifically regarding fact/value).
          *   One carrying case (User proposed: 4-hour sleepers in a valley vs. city). Evaluate this case.
          *   Misconceptions (initial and emerging) + when to head them off.
          *   One final assessment question.
          *   What to explicitly refuse to discuss (scope limits).
          *   Sequence/Timing.

  2.  **Evaluate the Carrying Case (The 4-Hour Sleepers):**
      *   *Strengths:* It's invented (no pre-loaded "gay rights" or "baldness" baggage). It separates biological function (sleep architecture) from social context (valley vs. city). It forces a distinction between "statistical abnormality" and "harm."
      *   *Weaknesses:* It risks collapsing into "disability vs. disease" too quickly. It might lead students to think "if it works in the valley, it's not a disease; if it fails in the city, it is." This leans too heavily on normativism without challenging the naturalist intuition that the *body* is different.
      *   *Verdict:* It's strong, but needs a tweak to ensure the *biological* reality is ambiguous enough to challenge naturalism, while the *harm* is clear enough to challenge normativism. The "scan is genuinely, measurably unlike" part is good for naturalism. The "nobody calls it anything" part is good for normativism.
      *   *Patch:* Need to ensure the "harm" in the city isn't just social awkwardness but genuine physiological distress *caused* by the mismatch, to make the "value" component tricky. Actually, keeping it as a *mismatch* is better. It highlights that the *same biology* is disease in context A and health in context B. This kills strict naturalism (which wants disease to be intrinsic).
      *   *Decision:* Keep the case, but refine the presentation to emphasize the *intrinsic biology* stays the same while the *status* changes.

  3.  **Determine Prerequisites (Fact/Value Distinction):**
      *   The user suspects it's the fact/value distinction. They are right.
      *   *Where does it go?* It can't be a lecture *before* the case. It needs to emerge *from* the case. If you lecture Hume first, they just apply Hume.
      *   *Strategy:* Use the case to generate the distinction. Ask "What are the facts?" vs. "What is the judgment?"
      *   *Refinement:* The prerequisite isn't teaching the distinction, it's establishing that *medicine claims to deal with facts*. The tension arises when values sneak in.

  4.  **Identify Misconceptions:**
      *   *Initial:*
          1.  Naturalism = Statistical Abnormality (The "Average is Health" fallacy).
          2.  Normativism = Anything Goes/Relativism (The "Culture Decides" fallacy).
          3.  Disease = Suffering (The "If it hurts, it's disease" fallacy).
      *   *Emerging:*
          1.  "So medicine is just politics?" (Nihilism).
          2.  "We just need better scans." (Technocratic fix).
      *   *Intervention Points:*
          *   Address Statistical Abnormality immediately when they look at the sleep scan.
          *   Address Relativism when they discuss the valley vs. city.
          *   Address Nihilism at the end.

  5.  **Drafting the Sequence (50 Minutes):**
      *   *0-5 min:* Hook. No definitions. Just the case.
      *   *5-20 min:* Small group discussion on specific questions about the case.
      *   *20-35 min:* Full class debrief, introducing the labels (Naturalism/Normativism) *after* they've struggled.
      *   *35-45 min:* Deepen the tension (The "Misconception Interception").
      *   *45-50 min:* Exit ticket/Assessment.

  6.  **Developing the "Refusal" List:**
      *   Pre-med students love mechanism. They will want to know *why* they sleep 4 hours. (Irrelevant).
      *   They will want to solve it (Treatment plans). (Irrelevant).
      *   They will want to talk about specific real-world DSM controversies (ADHD, etc.). (Keep it abstract to avoid political baggage).

  7.  **Developing the Final Question:**
      *   Needs to test if they understand the *tension*, not just the definitions.
      *   Bad: "Define naturalism."
      *   Good: "If we find a gene for X, does that settle the debate?"
      *   Better: A scenario where facts and values pull in opposite directions.

  8.  **Refining the Plan (Self-Correction during drafting):**
      *   *Critique:* Is 50 minutes enough to get from case to theory?
      *   *Fix:* Keep the lecture portions extremely tight. The TA should talk less than 10 minutes total.
      *   *Critique:* The fact/value distinction needs to be explicit.
      *   *Fix:* Make it a board exercise. Column A (Facts), Column B (Judgments).
      *   *Critique:* The user asked "what has to be in place before the question even makes sense."
      *   *Fix:* It's not that students need to *know* fact/value theory beforehand, but the *concept* of "Function" needs to be established. Disease implies malfunction. Malfunction implies a goal. Who sets the goal? That's the prerequisite tension.

  9.  **Final Polish:**
      *   Ensure the tone is practical for a TA.
      *   Make sure the "Sleep Case" is stress-tested.
      *   Check the misconceptions against the specific pre-med demographic (they love biomarkers).

  **(Self-Correction on the Fact/Value Prerequisite):**
  The prompt asks "what has to be in place before the question even makes sense."
  If I say "Fact/Value distinction," that's the *philosophical* prerequisite. But for the *classroom flow*, the prerequisite is establishing that **medicine claims objectivity**. If medicine is just opinion, there's no debate. The debate exists *because* medicine claims to be scientific (Naturalism) but acts on suffering/social norms (Normativism). I need to make sure the plan highlights this tension early.

  Let's structure the response clearly under the user's headers.

  *   **Prerequisites:** Function & Objectivity.
  *   **The Case:** Evaluate the Sleep Case.
  *   **Misconceptions:** Map them to time.
  *   **Sequence:** Minute-by-minute.
  *   **Refusals:** What to cut.
  *   **Assessment:** The one question.

  *Wait, one more thing on the Case:* The user asked "Tell me whether this case can carry the session or where it breaks."
  *Analysis:* It breaks if students decide "It's a disease in the city, not in the valley" and stop there. That's a easy relativist win. I need to force them to ask: "Is the *body* different?" No. "Is the *definition* different?" Yes. "So is disease in the body or the definition?" That's the killer question. I need to make sure the TA pushes past the "it depends on context" answer to the "what *is* disease ontologically" question.

  Okay, ready to write.cw
answer: |-
  This is a strong plan. You are right to avoid the DSM-homosexuality chestnut; it allows students to perform virtue signaling rather than do metaphysics. Your sleep case is much better because it isolates the *context-dependence* of harm without the immediate political baggage.

  Here is the blueprint for the 50 minutes.

  ### 1. The Prerequisite: What must be in place before the question makes sense?
  You suspected the fact/value distinction. It is, but that is too abstract for minute one. Before they can care about Naturalism vs. Normativism, they must accept two competing intuitions that medicine usually hides:
  1.  **The Objectivity Intuition:** Medicine is a science. It discovers things that are *there* (like viruses or broken bones), regardless of what we think.
  2.  **The Function Intuition:** Disease implies *malfunction*. But "malfunction" only makes sense relative to a "function." Who sets the function? The organism? The society?

  **How to install this (Minutes 0–5):**
  Do not lecture this. Write two columns on the board: **BIOLOGY** and **LIFE**.
  Ask: *"If I have a tumor, where is the disease? In the cells (Biology) or in the fact that it stops me from working (Life)?"*
  Most will say "Both." Your job is to pry them apart. *"If the tumor never grows and never hurts you, is it a disease?"* (This sets up the necessity of the debate).
  **The Prerequisite:** They must understand that **Naturalism** tries to locate disease entirely in the **BIOLOGY** column, while **Normativism** argues you cannot fill out the **LIFE** column without values.

  ### 2. The Carrying Case: The 4-Hour Sleepers
  **Verdict:** This case can carry the session, but it has a specific breaking point you need to patch.

  **Where it breaks:**
  Students will quickly say: *"It's not a disease in the valley, but it is in the city."*
  If they stop there, they have adopted a naive relativism ("Disease is whatever causes social problems"). They haven't felt the *ontological* problem. They need to feel that the **same body** is somehow both healthy and diseased simultaneously, which violates the Objectivity Intuition.

  **The Patch:**
  Add a third beat to the case.
  *   **Beat 1 (Valley):** They sleep 4 hours, are rested, no social penalty.
  *   **Beat 2 (City):** They sleep 4 hours, are rested *physiologically*, but suffer social/occupational failure because the world runs on 8 hours. They seek meds to sleep *more*.
  *   **Beat 3 (The Twist):** A pharmaceutical company develops a drug that forces them to sleep 8 hours. It matches the "normal" scan. But the patients report feeling *worse* (groggy, depressed) on the drug, even though they fit the social norm better.

  **Why this patch works:**
  It separates **Statistical Norm** (8 hours), **Physiological Function** (4 hours is enough for them), and **Social Value** (Productivity requires 8 hours).
  *   Naturalism struggles: If the 4-hour scan is their "normal function," why does medicine treat it in the city?
  *   Normativism struggles: If we treat them to sleep 8 hours, are we healing them or mutilating them to fit the workforce?

  ### 3. Misconceptions & Interception Points
  Pre-med students have specific reflexes. You need to head these off exactly when they arise.

  | Misconception | When it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"Naturalism = Statistical Average"** | When looking at the sleep scan. They will say "4 hours is abnormal, so it's disease." | **Intervene immediately.** Ask: *"If 90% of the population had a tumor, would it be healthy?"* Force the distinction between *Statistical* (average) and *Natural* (species-typical function). |
  | **"Normativism = Anything Goes"** | When discussing the Valley vs. City. They will think Normativism means "Culture decides truth." | **Reframe.** Normativism isn't that truth doesn't exist; it's that the *concept* of disease contains a moral claim (e.g., "this is bad"). Ask: *"Is the culture deciding the biology, or deciding what biology counts as a problem?"* |
  | **"The Technocratic Fix"** | When discussing the drug. *"We just need better biomarkers to settle it."* | **Block it.** Remind them: *"We already said the scan is measurably different. More data won't tell us if that difference is a disease."* |
  | **"Medicine is just Politics"** | End of class nihilism. | **Save for the close.** Acknowledge the tension but emphasize that recognizing values makes doctors *more* responsible, not less. |

  ### 4. The Sequence (50 Minutes)

  **0:00 – 0:05: The Setup (No Definitions)**
  *   Put the **BIOLOGY / LIFE** columns on the board.
  *   Present **Beat 1 & 2** of the Sleep Case (Valley vs. City).
  *   **Prompt:** *"Raise your hand if you think they have a disease in the Valley. Raise your hand for the City."*
  *   Expect a split vote on the City.

  **0:05 – 0:20: Small Groups (The Struggle)**
  *   Break into groups of 4. Give them three specific questions (write on board):
      1.  Is the *biology* of the Valley sleeper different from the City sleeper? (No).
      2.  If the biology is identical, how can the disease status change?
      3.  In the City, are we treating a broken body or a mismatched environment?
  *   **TA Role:** Circulate. If a group says "It's just social," ask: *"So if I cut off your leg, that's social too?"* Force them to find the line.

  **0:20 – 0:35: The Debrief & Labeling**
  *   Bring them back. Map their answers to the board.
  *   **Now** introduce the terms.
      *   *"Those of you who looked for the scan result were arguing like **Naturalists** (Boorse)."*
      *   *"Those of you who looked at the suffering/context were arguing like **Normativists** (Engelhardt/Canguilhem)."*
  *   Present **Beat 3 (The Drug)**.
  *   Ask: *"If the drug makes them 'normal' but feels worse, did the doctor heal them?"*
  *   This is where the pain happens. Naturalism says "Yes, function restored." Normativism says "No, well-being reduced."

  **0:35 – 0:45: Misconception Interception**
  *   This is your "lecture" slot, but keep it dialogic.
  *   Address the **Statistical Fallacy**: Explicitly state that Naturalism is about *species design*, not averages. (Use the tumor example).
  *   Address the **Relativism Fear**: Explicitly state that Normativism doesn't mean "no truth," it means "the truth includes human goals."
  *   **Crucial Move:** Tell them: *"If you think one side wins completely, you missed the point. The point is that medicine lives in the tension between these two."*

  **0:45 – 0:50: The Exit Ticket**
  *   Hand out a slip of paper (or digital form). One question.

  ### 5. What to Refuse (Say this out loud)
  Pre-med students will try to solve the case clinically. You must shut this down to keep it philosophical. Say this at minute 0:15:

  > *"I am going to refuse three questions today.
  > 1. I will not answer **'What causes the sleep variant?'** The mechanism doesn't matter for the definition.
  > 2. I will not answer **'What should the doctor prescribe?'** We are not deciding treatment; we are deciding what counts as a patient.
  > 3. I will not allow **'Let's look at real DSM cases.'** We are using this invented case so you can't rely on what you already think about ADHD or depression. Stay in the valley."*

  ### 6. The One Question (Assessment)
  Do not ask them to define the terms. Ask them to apply the tension to a new boundary.

  **The Question:**
  *"Imagine we discover a genetic marker for 'extreme grief' after a loss. It is statistically rare, biologically measurable, and impairs work function for 6 months. Is this a disease? Answer in one sentence using the logic of the Sleep Case."*

  **What you are looking for:**
  *   **Bad Answer:** "Yes, because it's biological." (Misses the value component).
  *   **Bad Answer:** "No, because grief is normal." (Misses the impairment component).
  *   **Good Answer:** "It depends on whether we view grief as a malfunction of the mind (Naturalism) or a necessary human response that conflicts with work norms (Normativism)."
  *   **Why this works:** It tests if they understand that the *facts* (genetic marker) do not settle the *category* (disease).

  ### Summary of TA Moves
  1.  **Don't teach the definitions first.** Let the case make the definitions necessary.
  2.  **Protect the Case.** Don't let them drift to real-world examples where they have pre-formed opinions.
  3.  **Fight the "Average" Fallacy.** This is the biggest trap for pre-meds. Hammer home that *common* does not equal *healthy*.
  4.  **Embrace the Tension.** If a student asks "So which one is right?", your answer is "Medicine requires both, and that is why it is difficult."

  This structure forces them to inhabit the problem. They will leave feeling that defining disease is harder than diagnosing one, which is exactly the philosophical lesson.
