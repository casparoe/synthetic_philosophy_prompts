          *   *Reaffirmation:* Why the strict rules (cooling-off, court approval)? If the debtor were fully competent at the moment of discharge, they could just say "I'll pay." The strictness implies that the *moment of discharge* is a moment of vulnerability (duress, shame, confusion). It presupposes that competence is context-dependent. Even an "informed" debtor at that moment is presumed susceptible to social/psychological pressure to re-assume a burden they legally escaped.

      *   **Section 3: Presupposition vs. Fit (Theories):**
          *   *Consequentialist (Insurance/Efficiency):* Fits well (fresh start encourages entrepreneurship). *Underdetermined:* Doesn't explain the moralistic limits (no indentured servitude) or the specific procedural hurdles of reaffirmation.
          *   *Republican (Domination):* Fits well (freedom from mastery by past self/creditor). *Underdetermined:* Doesn't fully explain why liens survive (property domination is okay?).
