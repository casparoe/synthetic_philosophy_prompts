          *   *Synthesis:* The practice *requires* a view that agency is real but perishable. It rules out radical Libertarianism (absolute sovereignty of past self) and radical Determinism (no responsibility ever). It sits in a "Soft Paternalism" or "Capacity-Based" middle ground.

