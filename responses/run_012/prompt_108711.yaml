answer: |-
  The legal architecture you describe—rigid enforcement of long-term contracts paired with a robust, asymmetric mechanism for discharge—does not rest on a single, coherent metaphysics of the person. Instead, it operationalizes a **divided theory of diachronic agency**. It treats the subject as a continuous owner of property but a discontinuous owner of their own will.

  Here is a reconstruction of the presuppositions embedded in this cluster of practices.

  ### 1. The Conception of the Subject: Bounded Continuity and the Alienability of Assets

  The arrangement requires a conception of the subject that is neither a strictly continuous agent nor a mere succession of distinct selves. It posits a **fiduciary model of the self across time**, bounded by inalienable rights.

  **Continuity vs. Succession**
  Contract law presupposes a **continuous agent**. It assumes the twenty-five-year-old and the fifty-five-year-old are the same legal entity, such that the earlier iteration can encumber the later iteration's resources. If the law viewed them as distinct persons, the mortgage would be void *ab initio* as a contract with a third party who did not consent.
  However, bankruptcy law presupposes a **succession of selves**. By allowing the fifty-five-year-old to shed the obligations of the twenty-five-year-old, the law acknowledges that the later self has interests distinct from, and potentially hostile to, the earlier self. The discharge functions as a legal severance of the tie between the past promisor and the present debtor.

  **Labor vs. Will**
  The system distinguishes sharply between alienating the *products* of labor and alienating the *capacity* to labor (the will).
  *   **Alienable:** Future wages, future property, future income streams. These are treated as external assets that the present self owns and can pledge.
  *   **Inalienable:** The right to quit, the right to bodily integrity, the right to a "fresh start." One cannot promise perpetual service because that amounts to selling the will itself, not just its output.

  **Personal Claim vs. Property Claim (The Lien Distinction)**
  The treatment of liens versus personal claims is the clearest window into this ontology.
  *   **The Personal Claim:** This attaches to the *person*. It demands performance or submission to judgment. Bankruptcy extinguishes this because the law presumes the person cannot be permanently enslaved to a past decision. The person is the locus of moral regeneration; therefore, the obligation binding the person must be severable.
  *   **The Lien:** This attaches to the *asset*. It survives bankruptcy. This presupposes that while the *self* cannot be bound indefinitely, *property* can be.
  *   **Presupposition on Collateral:** A person can put up **externalized future value** (wages, house equity) as collateral, but cannot put up **internalized future agency** as collateral. The lien survives because it is a right *in rem* (against the thing), whereas the discharge is a right *in personam* (freeing the person). The law assumes you own your future income, but you do not own your future freedom in a way that allows you to sell it irrevocably.

  ### 2. The Money-Pump Tradition: Defect vs. Vulnerability

  The money-pump argument demonstrates that an agent with time-inconsistent preferences (e.g., hyperbolic discounting) can be exploited into a sequence of choices that leave them worse off. The bankruptcy regime's specific structure reveals how the law diagnoses this vulnerability.

  **Vulnerability vs. Foresight**
  If the law believed debtors were merely **poor at foreseeing** pumps, it would mandate disclosure (truth-in-lending) but enforce waivers of bankruptcy. The fact that bankruptcy discharge is generally **non-waivable ex ante** suggests the law presupposes debtors are **actually vulnerable** to the pump, regardless of foresight. Information alone cannot cure dynamic inconsistency. The law assumes that even a fully informed twenty-five-year-old cannot rationally bind a desperate fifty-five-year-old because the preference structure of the fifty-five-year-old will fundamentally diverge from the plan of the twenty-five-year-old.

  **Preference Change as Defect**
  Does the law treat preference change as a defect? **Yes, but only in one direction.**
  *   When the debtor wants to *escape* debt due to changed circumstances, the law treats the original preference (to borrow) as potentially defective (myopic, coerced by necessity).
  *   When the debtor wants to *reaffirm* debt after discharge, the law treats the new preference (to pay) as potentially defective (driven by shame, duress, or misunderstanding).
  *   **The Reaffirmation Structure:** The requirement for court approval, attorney certification, and a cooling-off period presupposes that the debtor is **not competent to bind herself even when fully informed** at the moment of discharge. Why? Because the "moment of discharge" is recognized as a state of heightened psychological vulnerability. The law presumes that the "rational self" is not the one standing before the judge in bankruptcy, but a hypothetical, protected self that needs insulation from the social pressure to be "honorable" at the expense of survival.
  *   **Conclusion:** The law treats ordinary preference change not just as a fact to be planned around, but as a **structural failure of agency** that justifies paternalistic intervention. It assumes the "money pump" is a feature of the human condition, not a bug of specific contracts.

  ### 3. Presupposition vs. Fit: Ruling Out Rival Views

  Several theories fit the data, but only one is strictly presupposed by the *asymmetry* of the rules (hard to bind, harder to re-bind).

  *   **Consequentialist (Insurance/Efficiency):** *Fits, but underdetermined.* This view argues bankruptcy is insurance that lowers the ex ante cost of credit by encouraging entrepreneurship. However, pure efficiency would allow parties to contract around the insurance if they chose (waivers). The ban on waivers suggests efficiency is not the sole driver.
  *   **Republican (Non-Domination):** *Fits well.* This views debt as a form of domination by the creditor (or the past self). The discharge restores freedom. However, pure republicanism might struggle to explain why liens (domination via property) are allowed to survive.
  *   **Paternalist (Consumer Protection):** *Fits the reaffirmation rules.* But pure paternalism might restrict the initial borrowing (usury laws, ability-to-repay) more than it restricts the discharge.
  *   **Kantian (Inalienability of Will):** *Fits the ban on perpetual service.* But a strict Kantian would reject the 30-year mortgage entirely, as it alienates future autonomy.

  **What is Presupposed?**
  The practice presupposes a **Capacity-Based Liberalism**. It holds that:
  1.  **Agency is Real:** People are responsible for their commitments (contract enforcement).
  2.  **Agency is Perishable:** Circumstances can degrade agency to the point where obligation becomes oppression (bankruptcy discharge).
  3.  **Agency is Contextual:** Competence is not a binary switch; one can be competent to borrow but incompetent to reaffirm under duress.

  **What is Ruled Out?**
  *   **Radical Libertarianism:** The view that the present self has absolute sovereignty over the future self is ruled out. You cannot sell yourself into slavery, nor can you waive your right to bankruptcy.
  *   **Radical Determinism/Nullification:** The view that we are never responsible for past selves is ruled out. Contract law is enforced vigorously until the breaking point.
  *   **Strict Unitarianism:** The view that the self is perfectly unified across time is ruled out. If it were, discharge would be theft from the creditor and the past self.

  ### 4. Limiting Cases: Replacing the Presupposed View

  If we alter the underlying conception of the diachronic person, the legal order transforms unrecognizably.

  **Case A: The Future Self as a Distinct Person**
  *   **Presupposition:** The twenty-five-year-old has no standing to pledge the fifty-five-year-old's labor or assets. They are legally separate entities.
  *   **Doctrinal Changes:**
      *   **Abolition of Long-Term Debt:** Mortgages, student loans, and car notes become impossible. Credit is limited to short-term, secured lending against *current* assets only.
      *   **No Wage Garnishment:** Future wages belong to the future self, not the creditor.
      *   **No Bankruptcy Needed:** If you can't bind the future self, you don't need to release them.
  *   **Recognizability:** This is not a system of contract and credit as we know it. It is a **spot-exchange economy**. Capital accumulation via leverage collapses. It resembles a cash-only society or a system of equity financing only (where the investor buys a share of the asset, not a claim on the person).

  **Case B: The Present Self as Sovereign (Waivable Discharge)**
  *   **Presupposition:** The twenty-five-year-old owns the fifty-five-year-old completely. The future self is merely a resource of the present self.
  *   **Doctrinal Changes:**
      *   **Enforceable Waivers:** Debtors sign away bankruptcy rights at origination.
      *   **Perpetual Obligation:** Debts survive death, discharge, and hardship.
      *   **Indentured Servitude:** Bans on perpetual service contracts are lifted; if you can pledge future wages indefinitely, you can pledge your liberty to work.
  *   **Recognizability:** This resembles **pre-modern debt bondage** or 19th-century debtor's prison systems. While "contract" exists, "credit" changes character. It becomes high-risk for the borrower and low-risk for the lender. Access to credit would likely shrink for the poor (who are higher risks of needing discharge), while the cost of capital drops for the wealthy. It is recognizable as a legal order, but not as a *liberal* market economy; it is a system of **debt peonage**.

  **Conclusion**
  The current system occupies a precarious middle ground. It presupposes that we are **continuous enough to be trusted with credit, but discontinuous enough to require mercy.** It treats the person as a vessel that carries obligations, but a vessel that can be legally emptied when the weight threatens to crush the carrier. To shift to either limiting case is to abandon the specific liberal compromise that allows for both risk-taking (credit) and human resilience (bankruptcy).
