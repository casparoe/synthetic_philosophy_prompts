          *   *The Synthesis:* It's not purely one or the other. It's a "bounded continuity." The self is continuous enough to be held responsible, but fragile enough to need a reset.
          *   *Labor vs. Will:* The ban on perpetual service/indentured servitude suggests a distinction between alienating *products* of labor (wages/lien) vs. alienating the *capacity* to labor (will/body).
          *   *Personal Claim vs. Lien:* This is crucial. A lien survives bankruptcy; a personal claim does not.
          *   *Presupposition:* You can pledge *things* you own (including future property/wages as a stream of value), but you cannot pledge *yourself* as a moral agent. The lien attaches to the asset; the discharge attaches to the person. This implies the person is more than their assets. The "collateral" is the externalized future income, not the internalized future will.

      *   **Section 2: The Money-Pump Tradition:**
          *   *The Pump:* Dynamic inconsistency (hyperbolic discounting). I want to save tomorrow, but spend today. Creditors exploit this.
          *   *Vulnerability vs. Foresight:* Does bankruptcy assume we *are* pumped or just *can't see* the pump?
