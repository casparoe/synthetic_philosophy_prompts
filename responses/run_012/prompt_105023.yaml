answer: |-
  This is a classic objection, often traced back to G.E. Moore and later Wittgenstein (the "family resemblances" argument). Your friend has constructed a valid *modus tollens*, but I believe the unsoundness lies in **Premise (2)**, with a significant assist from **Premise (8)**.

  You don't have to give up hedonism, and you don't have to deny (5). In fact, accepting (5) is the mark of a sophisticated hedonist.

  Here is the breakdown of where to cut, what it costs, and why the "functional kind" defense isn't just relabeling.

  ### 1. The Cut: Reject Premise (2)
  **Premise (2):** *For two things to be ranked on a single scale they have to share a common measure, i.e., there must be some one property in virtue of which each of them adds to the total.*

  This premise relies on a naive metaphysics of measurement. It assumes that for $X$ and $Y$ to be comparable on a scale, they must share a **qualitative ingredient** (a "common feel").

  **The Counter-Argument:** Measurement requires a common *dimension* or *functional role*, not a common *phenomenological ingredient*.

  **The Money Analogy:**
  Consider the value of money. A dollar spent on a hot dog and a dollar spent on a textbook are phenomenologically totally different transactions. One involves grease and hunger; the other involves paper and cognition. There is no "common feel" to spending a dollar. Yet, they are perfectly comparable on a single scale (purchasing power). Why? Because they play the same **functional role** in an economic system.

  Similarly, hedonism does not require pleasure to be a specific "tingle" (a sensation). It requires pleasure to be a specific **mode of consciousness** or **attitude** that plays a specific role in well-being.

  If you cut (2), you block the inference to (7). You can rank outcomes by pleasure even if pleasures are phenomenologically heterogeneous, provided they share a structural or functional property.

  ### 2. The "Functional Kind" Worry
  You asked: *If the answer is "pleasure is a functional kind"... what that actually buys and whether what's left still deserves the name hedonism.*

  This is the crucial fear: that defining pleasure functionally turns hedonism into Desire Satisfaction Theory (DST). It doesn't, provided you adopt **Attitudinal Hedonism** (championed by Fred Feldman).

  **Sensational Hedonism (The Old View):** Pleasure is a specific feeling (a "glow").
  *   *Problem:* Your friend is right; there is no such glow. (Premise 5).

  **Attitudinal Hedonism (The Survival View):** Pleasure is the *attitude of taking pleasure in* something.
  *   *Definition:* You are experiencing pleasure if you are *glad that* you are having a certain experience, or *enjoying* a certain state of affairs.
  *   *Why it's not Desire Satisfaction:*
      1.  **Non-Desired Pleasure:** You can walk past a bakery, smell bread, and take pleasure in the smell without ever having *desired* to smell bread beforehand. DST struggles here (did you have a latent desire?). Attitudinal Hedonism says: you are currently taking a positive attitude toward the sensation. That's sufficient for value.
      2.  **Undesired Pain:** You can desire to finish a marathon (a goal), but take no pleasure in the running (the experience). DST might count the desire satisfaction as good; Hedonism says the experience itself had negative value until the finish line.
      3.  **The Deceived Businessman:** (Nozick's example). A man desires to be respected, but everyone is lying to him. DST says his life is good (desires satisfied). Hedonism says his life is lacking (he isn't *taking pleasure* in the interactions because they are based on falsehoods, or at least the *feeling* of respect is unmoored).

  **The Bill:** By cutting (2) and moving to Attitudinal Hedonism, you lose the ability to do a simple "hedonic calculus" (Bentham's units of pleasure). You cannot weigh the "fizz" of schadenfreude against the "relief" of a headache in exact grams. But you retain the core thesis: **The good life is the life that contains the most positive attitudes toward experience.** That is still hedonism.

  ### 3. The "Redness" Trump Card (Premise 8)
  Your friend's Premise (8) is actually a confession of defeat.

  > *(8) ...nor colours (there's no one physical property all red things share).*

  This is a standard philosophical fact. "Red" is a **determinable** property, not a **determinate** one. Red things reflect different wavelengths of light depending on lighting conditions, material, and biological perception. There is no single physical constant shared by a red apple, a red sunset, and a red feeling of embarrassment.

  If your friend admits (8), they admit that **kinds can exist without a single shared physical/phenomenal ingredient.**
  *   We can still talk about "red things."
  *   We can still rank things by "redness" (more red vs. less red).
  *   Therefore, we can talk about "pleasures" and rank them by "pleasantness" without a single shared ingredient.

  If they insist that (8) proves "almost nothing is a kind," they are a radical nominalist. If they are a radical nominalist, they can't formulate their own argument because the words "argument," "premise," and "false" don't refer to stable kinds either.

  **The Move:** Throw (8) back at them. If "red" is a coherent concept without a common physical property, "pleasure" can be a coherent concept without a common phenomenal property. The burden is on them to explain why *pleasure* specifically fails to be a kind when *redness* succeeds.

  ### 4. Alternative Cut: Dimensionalism
  If you don't like the "Attitudinal" route, there is **Dimensionalism** (defended by Shelly Kagan and others).

  This view says pleasure isn't an *ingredient* in experience (like a cherry in a sundae); it's a *dimension* of experience (like the sweetness of the sundae).
  *   **Analogy:** Think of a sound. It has pitch, volume, and timbre. "Loudness" isn't a separate sound added to the noise; it's a way the noise *is*.
  *   **Application:** The "click" of a proof and the "fizz" of schadenfreude don't share a feeling. They share a **hedonic tone**. They both sit at the positive end of the valence dimension of consciousness.
  *   **Why this saves (2):** They *do* share a property: they both have positive hedonic tone. It's just that this tone isn't a separable sensation; it's a mode of the sensation.

  ### Summary: The Verdict

  **Which step do you cut?**
  Cut **(2)**. Ranking does not require a shared *qualia*; it requires a shared *dimension of value*.

  **What is the bill?**
  1.  **You abandon Bentham:** You cannot treat pleasure as a homogeneous substance that can be poured from one container to another.
  2.  **You accept Heterogeneity:** You must admit that the pleasure of reading a proof and the pleasure of a hot bath are as different as red and loud, yet both are "good."
  3.  **You refine the Definition:** You must define pleasure as either an **attitude** (taking pleasure in) or a **dimension** (hedonic tone), rather than a sensation.

  **Does it survive as Hedonism?**
  Yes. The core claim of hedonism is that **value supervenes on conscious experience.**
  *   **Objective List Theory:** Things are good even if you don't like them (e.g., knowledge).
  *   **Desire Theory:** Things are good if you want them (even if they make you miserable).
  *   **Hedonism:** Things are good *in virtue of how they feel* (or how you regard them experientially).

  As long as your theory anchors value in the *subjective character of experience* (even if that character is complex and heterogeneous), it is hedonism. Your friend is trying to trap you into **Sensational Hedonism**, which is indeed dead. But **Attitudinal** or **Dimensional Hedonism** is very much alive.

  **What to say to your friend:**
  "Your argument proves too much. By your logic, 'redness' doesn't exist because red things share no single physical wavelength. If 'red' can be a valid kind without a common ingredient, 'pleasure' can be too. Pleasure isn't a specific sensation; it's the positive valence of an experience. We can measure valence without needing every happy moment to feel the same."
