      *   *The "Shut Down" Analysis:* Specifically address which claim allows the speaker to ignore the drought question.
      *   *Conclusion:* Advice on how to write about it without falling into the trap.

      *(Self-Correction during drafting)*: I need to make sure I don't just repeat Sen's entitlement theory since the user asked to avoid that binary. I will frame it as "Allocation Politics" rather than "Entitlement Failure." I also need to ensure I distinguish between *intent* (crime) and *outcome* (crime). The word "crime" implies moral/legal culpability.

