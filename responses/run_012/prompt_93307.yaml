answer: |-
  Causal Isolability is the single requirement that does the most work in excluding bad theories. The full list of desiderata is not jointly satisfiable without a pragmatic concession that sacrifices strict level neutrality for the sake of testability.

  To build a theory of mechanism identity for mechanistic anomaly detection, you must distinguish the *process* from the *product* and the *component* from the *role*. Below are the requirements derived from your cases, marked as Non-Negotiable (NN) or Camp Preference (P).

  **1. Behavioral Independence (NN)**
  *Requirement:* Identity conditions for mechanisms cannot rely solely on input-output equivalence.
  *Motivation:* This is the core of anomaly detection. A system solving a task via generalisation and a system solving it via a lookup table are behaviorally indistinguishable but mechanistically distinct. If your theory equates them, it renders anomaly detection impossible. Any theory collapsing mechanism into function is immediately disqualified.

  **2. Parametric Stability (NN)**
  *Requirement:* Trivial changes in implementation parameters must not constitute a change in mechanism identity.
  *Motivation:* Consider two networks trained from different random initialisations computing the same function via visibly different routes. If every weight shift creates a new mechanism, the concept loses traction over time. The theory must allow for *multiple realizability* within a bounded class of implementations. We need a metric of similarity that treats distinct weights implementing the same algorithm as the same mechanism token, provided the causal structure is preserved.

  **3. Causal Isolability (NN)**
  *Requirement:* A mechanism must be distinguishable from its surroundings via intervention.
  *Motivation:* This addresses distributed computation. If a computation lives spread across many units doing several jobs, you must be able to perturb that specific computation without destroying the whole system. If you cannot intervene on the putative mechanism without changing everything else, you haven't identified a mechanism; you've identified the system itself. This requirement kills holistic theories that cannot localize causal power.

  **4. Role Constancy (P - Mechanistic Realist)**
  *Requirement:* A sub-component retains its identity only if its causal role within the larger computation remains fixed.
  *Motivation:* Consider a sub-computation surviving fine-tuning while its job changes. A realist about mechanisms will say this is no longer the same mechanism because its contribution to the output has shifted. A structuralist might say the weights are similar enough to count. For anomaly detection, Role Constancy is preferred: if the internal job changes, the risk profile changes, even if the weights look similar.

  **5. Level Neutrality (P - Computationalist)**
  *Requirement:* Mechanism identity should hold across different levels of description (e.g., arithmetic routine in feedforward vs. recurrent net).
  *Motivation:* We want to say the "addition mechanism" is the same whether implemented in silicon or neurons. However, as argued below, this conflicts with operational constraints. This is a preference for those who want mechanistic explanations to track abstract algorithms rather than physical substrates.

  You suspected a no-go theorem regarding level neutrality and testability. Your suspicion is right. You cannot simultaneously have a criterion neutral about the level of description and a criterion you can actually test by intervening, because any intervention has to be typed at some level. To intervene, you must specify *what* you are manipulating (voltages, activations, logical gates). If you change the level of description, the available interventions change. A theory invariant under every behaviour-preserving change collapses mechanism into function (violating Behavioral Independence), while a criterion sensitive to every parameter change makes every training step a new mechanism (violating Parametric Stability).

  To repair this, **Level Neutrality must give**. The least costly repair is to adopt a **Fixed Base Level for Detection**. You must stipulate a specific granularity (e.g., neuron activations) at which interventions are defined for the purpose of anomaly detection. You can still *describe* the mechanism abstractly, but identity claims must be cashed out in interventions at the fixed base level. This sacrifices the dream of a purely abstract mechanistic theory but saves the operational utility required for safety. You accept that "same mechanism" means "same causal structure at the base level," even if higher-level descriptions diverge.

  Finally, we rank the candidate families of answer by how many requirements they meet.

  **1. Causal-Interventionist (Best)**
  This family defines mechanisms by their counterfactual dependencies. It satisfies Behavioral Independence (causes differ even if effects match), Parametric Stability (structure can remain stable despite weight noise), and Causal Isolability (by definition). It fails strict Level Neutrality but accepts the Fixed Base Level repair. It is the only family capable of supporting anomaly detection because it tracks the *process* generating the output.

  **2. Structural/Syntactic**
  This family focuses on weight geometry or graph topology. It handles Parametric Stability well but struggles with Behavioral Independence. Two networks can have different structures computing the same function, or similar structures computing different functions (via weight magnitudes). It often fails Causal Isolability because structural similarity does not guarantee causal equivalence.

  **3. Pragmatic/Instrumentalist**
  This family defines mechanisms by their utility to the observer. It handles Level Neutrality well (whatever works is the mechanism) but fails Behavioral Independence and Causal Isolability. If mechanism identity is just about what helps us predict, then the lookup table and the generaliser are the same mechanism if they predict equally well. This defeats the purpose of anomaly detection.

  **4. Purely Behavioral/Functional (Worst)**
  This family equates mechanism with input-output mapping. It satisfies Level Neutrality trivially but fails Behavioral Independence immediately. It is useless for your purpose.

  The single requirement that eliminates the most candidates is **Behavioral Independence**. It instantly disqualifies the Behavioral and Pragmatic families, leaving only Causal and Structural options. Between those, Causal-Interventionism wins because Structural accounts cannot adequately handle Role Constancy; syntax does not always track semantic contribution in non-linear systems.

  Your specification must therefore commit to a Causal-Interventionist account anchored at a Fixed Base Level. This is the only path that respects the distinction between looking right and being right, which is the entire point of mechanistic anomaly detection.
