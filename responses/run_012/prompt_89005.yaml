  # The Consciousness Classification Tree

  **Instructions:** Start at Node 1. Answer based on your intuitions about the cases described, not on which theory you prefer. Follow the branches to a leaf.

  ### **Node 1: The Target of Explanation**
  When you distinguish "phenomenal consciousness" (what it's like) from "access consciousness" (availability for use), are you marking **two distinct natural properties**, or **two levels of functional access** (e.g., rich guidance vs. verbal report)?
  *   **Two Distinct Properties** → Go to Node 2.
  *   **Two Levels of Access** → Go to Node 7.

  ### **Node 2: The Reality of Phenomenality**
  In cases like **peripheral vision** or **Sperling's partial report**, is the felt richness a **veridical property** of the state, or a **post-hoc illusion** generated by cognitive monitoring?
  *   **Veridical Property** → Go to Node 3.
  *   **Post-Hoc Illusion** → Go to Node 6.

  ### **Node 3: Functional Role**
  Does this veridical phenomenal property **do causal work** (guide behavior), or is it a **non-functional residue** that accompanies access?
  *   **Non-Functional Residue** → **LEAF A: Global Workspace (Access-Only + Phenomenal Residue)**.
  *   **Does Causal Work** → Go to Node 4.

  ### **Node 4: Locus of Mechanism**
  Does the mechanism generating this property require **global broadcasting** to a central workspace, or can it occur via **local sensory recurrence**?
  *   **Global Broadcasting** → Go to Node 5.
  *   **Local Sensory Recurrence** → Go to Node 5. *(Wait, need to split leaves)*.
  *   *Correction:* **Global Broadcasting** → **LEAF B: Global Workspace (Full Theory of Consciousness)**.
  *   *Correction:* **Local Sensory Recurrence** → Go to Node 5.

  ### **Node 5: Ontological Status of Local Properties**
  If the property is local, is it **fundamental to physical matter** (intrinsic), or an **emergent biological feature**?
  *   **Fundamental to Matter** → **LEAF C: Panpsychism / Neutral Monism**.
  *   **Emergent Biological** → **LEAF D: Local Recurrence Views**.

  ### **Node 6: Structure of the Illusion**
  If the "feel" is an illusion, is it generated by a **higher-order representation** of the state, or by a **systemic misrepresentation** of first-order content?
  *   **Higher-Order Representation** → **LEAF E: Higher-Order Theories**.
  *   **Systemic Misrepresentation** → **LEAF F: Illusionism**.

  ### **Node 7: Defining Access**
  If the gap is between access levels, is the "phenomenal" level defined by **flexible guidance/control**, and the "access" level defined by **verbal report**?
  *   **Yes (Phenomenal = Guidance)** → Go to Node 8.
  *   **No (Phenomenal = Report)** → **LEAF G: First-Order Representationalism**.

  ### **Node 8: No-Report Paradigms**
  In **binocular rivalry** or **continuous flash suppression** without report, does the signature of "phenomenal" (guidance) access persist when report is removed?
  *   **Yes (Persists)** → Go to Node 9.
  *   **No (Vanishes)** → **LEAF H: Global Workspace (Strict Report Access)**.

  ### **Node 9: Blindsight Dissociation**
  In **blindsight**, can the system guide action (phenomenal/access-1) without the ability to report (access-2)?
  *   **Yes (Dissociation Possible)** → Go to Node 10.
  *   **No (Guidance Implies Report)** → **LEAF I: Two-Access Deflationism** *(See Diagnostic Note Below)*.

  ### **Node 10: Attention and Awareness**
  In **inattentional blindness** or **gist studies**, can you have guidance-level access without attention, or does attention gate all awareness?
  *   **Attention Gates All** → **LEAF I: Two-Access Deflationism**.
  *   **Access Without Attention** → Go to Node 11.

  ### **Node 11: Dreaming and Internal Generation**
  In **dreaming**, is the "guidance" access driven by **external input** or **internal simulation**?
  *   **Internal Simulation** → **LEAF I: Two-Access Deflationism**.
  *   **External Input Required** → **LEAF J: Sensorimotor Contingency Theory**.

  ---

  ### **Diagnostic Notes for the Instructor**

  **1. Unoccupied Combinations:**
  *   **Slot:** *Local Recurrence + Global Broadcasting.*
      *   **Diagnosis:** Logically incoherent. A mechanism cannot be both strictly local and strictly global by definition.
  *   **Slot:** *Illusionism + Real Residue.*
      *   **Diagnosis:** Incoherent. If it is an illusion, there is no real residue. If there is a real residue, it is not an illusion.
  *   **Slot:** *Two-Access Deflationism + Distinct Properties (Node 1).*
      *   **Diagnosis:** Unexplored/Unattractive. This view explicitly denies distinct properties. If a student lands here, they have contradicted their Node 1 choice.

  **2. Indistinguishable Leaves:**
  *   **Pair:** **LEAF I (Two-Access Deflationism)** and **LEAF G (First-Order Representationalism)**.
      *   **Problem:** Both views often predict similar outcomes on blindsight and no-report tasks (consciousness = first-order access).
      *   **Extra Node Needed:** Ask: "Is the 'feel' of consciousness **identical** to the access, or is it a **description** of the access?"
          *   *Identical:* Two-Access Deflationism.
          *   *Description:* First-Order Representationalism.
      *   **Why it matters:** Deflationism dissolves the hard problem; FOR attempts to solve it functionally.

  **3. The "Two-Access" Hypothesis Landing:**
  *   Your specific hypothesis lands at **LEAF I**.
  *   **Diagnosis:** This slot is often unoccupied in standard textbooks because it requires denying the "Phenomenal/Access" ontology while keeping the terminology. It is usually absorbed into First-Order Representationalism. To make it distinct, emphasize that "Phenomenal" is just a *name* for high-fidelity Guidance Access, not a separate property.

  **4. Node Count:** 11 Nodes.
  **5. Leaf Count:** 10 Leaves.
