          *   **Assessment:** Mostly accurate, but slightly reductive. Williams talks about "ground projects" and the connection between action and identity. It's not just "preferences"; it's what makes life worth living.
      *   *Claim 2: "Jim... George... The utilitarian verdict in each case is that you do the thing, and the cost is that a person with integrity cannot do it..."*
          *   **Assessment:** Accurate on the cases. Accurate on the verdict (generally). The link to integrity is correct but needs nuance (negative responsibility).
      *   *Claim 3: "The slogan about having one thought too many is the same point in miniature... if he has to console himself that partiality to a spouse is morally permitted, he has had one thought too many..."*
          *   **Assessment:** Accurate description of the example.
      *   *Claim 4: "Williams's point is that no moral justification of the rescue can be given, because the moment you need one you have already wrecked the relationship."*
          *   **Assessment:** This is a crucial pivot point. Williams argues the justification shouldn't be *moral* (utilitarian), but that doesn't mean the action is amoral. It means the *structure* of moral theory is intrusive.
      *   *Claim 5: "So this is really the demandingness objection in fancier dress..."*
          *   **Assessment:** **This is the biggest error.** Demandingness says "it asks too much." Integrity says "it attacks the agent." One is about quantity of sacrifice; the other is about the structure of agency and identity.
      *   *Claim 6: "...and since nobody seriously thinks you must maximize utility at the cost of everything you love, utilitarianism is refuted -- or it survives only by abandoning the impartial calculus that makes it a distinct view."*
          *   **Assessment:** Non-sequitur. Utilitarians have responses (rule-utilitarianism, indirect utilitarianism, redefining well-being). Also, Williams isn't trying to "refute" utilitarianism in a logical sense but to show it is alienating.

