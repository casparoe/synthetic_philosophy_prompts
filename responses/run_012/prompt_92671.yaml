answer: |-
  Your unease is well-founded. Your friend has constructed a coherent narrative, but in doing so, they have conflated distinct layers of Williams's critique. The summary is not "careless," but it is **systematically reductive**. It translates Williams's phenomenological and psychological critique into a standard normative objection that utilitarianism is better equipped to handle.

  Here is an audit of the claims, followed by an analysis of the specific structural questions you raised.

  ### Part 1: Claim-by-Claim Audit

  **Claim 1:** *"Williams's integrity objection is that utilitarianism forces you to treat your own deepest commitments as just one more pile of preferences to be weighed in an impersonal calculus."*
  *   **Verdict:** **Acceptable Simplification.**
  *   **Nuance:** Williams would accept this as a starting point, but he would deepen it. It is not just that commitments are treated as "preferences" (which sounds trivial); it is that they are treated as *external data points* rather than sources of agency. For Williams, my "ground projects" constitute who I am. To ask me to step back from them to weigh them impartially is to ask me to step outside my own skin. It is an attack on **agency**, not just a weighting error.

  **Claim 2:** *"Jim... George... The utilitarian verdict in each case is that you do the thing, and the cost is that a person with integrity cannot do it..."*
  *   **Verdict:** **Mostly Accurate.**
  *   **Nuance:** The friend correctly identifies the verdict. However, they miss the mechanism: **Negative Responsibility**. Williams's point isn't just that Jim must kill; it's that Jim is held responsible for the deaths of the 19 if he *doesn't* kill. This makes the world's causal flow more important than Jim's own actions. This is the specific threat to integrity: I am no longer the author of my actions; I am a channel for utility.

  **Claim 3:** *"The slogan about having one thought too many... if he has to console himself that partiality to a spouse is morally permitted, he has had one thought too many..."*
  *   **Verdict:** **Accurate.**
  *   **Nuance:** This is a faithful rendering of the example from "Persons, Character and Morality."

  **Claim 4:** *"Williams's point is that no moral justification of the rescue can be given, because the moment you need one you have already wrecked the relationship."*
  *   **Verdict:** **Dangerous Simplification.**
  *   **Nuance:** Williams argues that the justification comes from **love**, not from **morality**. The friend implies that because a *moral* justification cannot be given, the theory is in trouble. Williams argues that the demand for a *moral* justification in the first place is the symptom of the disease. The friend treats this as a gap in utilitarian coverage; Williams treats it as an intrusion of morality into a space where it doesn't belong.

  **Claim 5:** *"So this is really the demandingness objection in fancier dress..."*
  *   **Verdict:** **Simply Wrong.**
  *   **Nuance:** This is the critical error.
      *   **Demandingness** says: "Utilitarianism requires too much *sacrifice* (money, time, comfort)."
      *   **Integrity** says: "Utilitarianism requires the wrong *structure of agency*."
      *   You can solve demandingness by lowering the bar (e.g., "maximize until it hurts significantly"). You cannot solve integrity by lowering the bar. Even if George is only asked to take a job that is *slightly* objectionable to prevent a *slightly* worse outcome, the integrity objection holds: he is still being asked to alienate his actions from his character. The integrity objection survives even in a "moderate" utilitarianism; the demandingness objection does not.

  **Claim 6:** *"...utilitarianism is refuted -- or it survives only by abandoning the impartial calculus that makes it a distinct view."*
  *   **Verdict:** **Non Sequitur.**
  *   **Nuance:** This ignores **Indirect Utilitarianism**. A utilitarian can say: "The impartial calculus applies to the selection of rules/dispositions, not to every immediate act." They can argue that having a disposition to save your wife *maximizes utility* overall, even if saving her isn't justified by a direct calculus in the moment. Williams anticipates this and calls it a form of self-deception or "government house" utilitarianism, but it is not a logical refutation. It is a clash of plausibility.

  ---

  ### Part 2: Specific Structural Questions

  #### 1. Does the demandingness reading capture or dissolve the integrity point?
  It **dissolves** it.
  If you treat integrity as demandingness, you turn a qualitative problem into a quantitative one.
  *   **Demandingness:** "I can't give away 90% of my income." (Solution: Give 10%.)
  *   **Integrity:** "I cannot view my life's work as a vessel for utility." (Solution: None, within the theory.)

  By reducing integrity to demandingness, your friend makes the problem solvable by utilitarianism (just tweak the optimization function). Williams's point is that the problem is **constitutive**. Utilitarianism separates the agent from the action. If you fix that separation, you are no longer doing act-utilitarianism. If you keep the separation, you violate integrity. Demandingness is a side effect; alienation is the core.

  #### 2. Is the drowning-wife case a second argument or something with a different target?
  It has a **different target**.
  *   **Jim/George (Integrity):** Target the **action**. They show how utilitarianism forces you to do things that violate your character (killing, making weapons).
  *   **Drowning Wife (One Thought Too Many):** Targets the **justification**. It shows how utilitarianism corrupts the *reasons* for which we act, even when the action is permissible.

  The friend conflates them into one "anti-utilitarian" blob. But the drowning wife case is subtler: it argues that some human goods (love, friendship) are logically incompatible with holding a utilitarian standpoint *at the moment of action*. It is an argument about the **psychology of virtue**, whereas Jim/George are arguments about **moral luck and responsibility**.

  #### 3. Does the concluding claim (utilitarianism is refuted) follow?
  **No.**
  Williams does not offer a logical refutation (like showing a contradiction). He offers a **reductio ad absurdum of the moral experience**. He is saying: "If this theory is true, then human life as we understand it is a lie."
  A utilitarian can reply: "So much the worse for human life as we understand it."
  The friend claims utilitarianism is refuted *unless* it abandons impartiality. But Indirect Utilitarianism retains impartiality at the critical level (choosing the dispositions) while abandoning it at the practical level. Williams thinks this is unstable, but "unstable" is not "refuted."

  ---

  ### Part 3: Meta-Analysis

  #### What would change my verdict?
  I would call your friend's summary "fair" if they acknowledged that **Indirect Utilitarianism** is the specific target of the "One Thought Too Many" argument.
  If your friend said: *"Williams argues that even Indirect Utilitarianism fails because it requires the agent to live a lie about their own motivations,"* then they would have captured the depth of the integrity objection.
  Currently, they treat utilitarianism as a monolith of Act-Utilitarianism. If they acknowledged that Williams is attacking the **structure of moral theory itself** (the priority of the impartial standpoint), rather than just a specific version of utilitarianism, the summary would be fair.

  #### Where is my own reasoning most likely to be wrong?
  1.  **Overstating the Distinction:** There is significant scholarly debate (e.g., by Samuel Scheffler) about whether integrity *collapses* into demandingness. If "integrity" just means "my projects are important to me," then asking me to sacrifice them *is* a demandingness claim. I may be granting Williams too much mystical weight on "identity" that a hard-nosed utilitarian can simply reject as sentimental.
  2.  **Williams's Positives:** Williams is better at critique than construction. My defense of him assumes his alternative (a non-theoretical ethical life) is coherent. Your friend might argue that without a theory, we have no way to resolve conflicts between ground projects (e.g., my project vs. your project). If Williams offers no solution to conflict, his critique is less devastating.
  3.  **The "Refutation" Standard:** In philosophy, "refuted" is often used loosely to mean "rendered implausible to reasonable people." If your friend means "refuted as a plausible guide for human life" rather than "logically inconsistent," their conclusion is stronger than I have credited.

  ### Summary for Your Next Argument
  Tell your friend this:
  "You have accurately described the *examples*, but you have misidentified the *mechanism*. You are treating Williams's objection as if it were about **cost** (demandingness), when Williams is explicitly arguing it is about **authorship** (integrity). If utilitarianism lowers the cost, the demandingness objection vanishes. But even if utilitarianism asks very little of me, if it insists that I must justify my love for my wife through an impartial calculus, the integrity objection remains. You have solved a problem Williams wasn't raising, and missed the one he was."
