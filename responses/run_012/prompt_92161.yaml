answer: |-
  ### Move-by-Move Adjudication

  **(1) Ada: The Two-Sphere Counterexample**
  *   **Rating:** Contestable
  *   **Justification:** Ada correctly cites Max Black's classic counterexample. However, the move is contestable because it presupposes a definition of "property" that excludes identity-involving properties (haecceities). If one accepts that "being identical to Sphere A" is a valid property, the counterexample fails. Ada is right that the scenario is conceivable, but she is not yet right that it refutes PII without first establishing which properties count.

  **(2) Emmett: Triviality via Identity Properties**
  *   **Rating:** Clearly Right (Logically), but Philosophically Deflationary
  *   **Justification:** Emmett is logically correct: if properties include "being identical to $x$," then distinct objects necessarily have distinct properties, making PII a tautology. However, he is misleading in suggesting this preserves the principle's utility. By making PII trivial, he drains it of its metaphysical content. He wins the logical point but sidesteps the philosophical intent of the principle.

  **(3) Ada: Qualitative Restriction and Symmetry**
  *   **Rating:** Clearly Right
  *   **Justification:** Ada correctly identifies the only version of PII worth debating: the restriction to qualitative (intrinsic and relational) properties. Her invocation of symmetry is precise; a world with nontrivial symmetry (like the two spheres) is the formal definition of a failure of qualitative indiscernibility. Her connection to the substantivalism debate (shifted universes) is accurate and demonstrates the principle's theoretical utility.

  **(4) Emmett: "Qualitative" is Gerrymandered & QM Support**
  *   **Rating:** Contestable (First half), Mistaken (Second half)
  *   **Justification:** The claim that "qualitative" is ad hoc is a common critique but ignores formal definitions available in logic and physics (e.g., predicates invariant under permutation). The claim that physics settles the matter *for* PII is mistaken. Standard interpretations of quantum indistinguishability usually suggest PII *fails* for quantum particles (they lack individuality), not that it holds. Emmett conflates "indistinguishable by measurement" with "identical in ontology."

  **(5) Ada: QM Counterexample (Helium Electrons)**
  *   **Rating:** Contestable
  *   **Justification:** Ada is correct that the electron count is measurable while individual states are not defined in the ground state. This is the standard argument that quantum mechanics provides physical counterexamples to PII. However, it remains contestable because it depends on treating electrons as "objects" to begin with. Some interpretations argue electrons are not individuals at all, which dissolves the counterexample rather than refuting PII. Still, her reading is more aligned with the standard philosophical literature than Emmett's.

  **(6) Emmett: It Is a Verbal Dispute**
  *   **Rating:** Mistaken
  *   **Justification:** Emmett claims there is "no further fact" beyond language choice. This is a deflationary view that ignores the ontological commitment at stake. The disagreement is not merely about which words to use, but about the structure of reality: does the universe contain primitive "this-ness" (haecceity) independent of qualitative description? That is a substantive metaphysical question, not a linguistic convention.

  ***

  ### Specific Verdicts

  **Is the last move correct (is this a verbal dispute)?**
  No. Emmett is wrong to dismiss the debate as merely verbal. While the *formulation* depends on language, the underlying disagreement is about **Haecceitism**. The question is whether reality includes primitive facts of identity that do not supervene on qualitative properties. If Ada is right, reality is purely structural/qualitative. If Emmett is right (implicitly), objects possess a primitive individuality that transcends their qualities. This is a disagreement about the furniture of the universe, not just the labels we attach to it.

  **Is the quantum case being asked to carry more weight than it can bear?**
  Yes, on both sides, but Emmett burdens it more. Ada uses QM to support a metaphysical claim (PII is false), which is a standard move, but it relies on interpreting quantum formalism as a direct map of ontology (i.e., that electrons are "things" that fail to be discerned). Emmett burdens it more heavily by claiming physics "settles" the issue in favor of PII. This misreads the standard philosophical implication of quantum indistinguishability, which is typically that classical individuality breaks down, not that PII is vindicated. The physics constrains the metaphysics, but it does not dictate the vocabulary of "objecthood" without philosophical interpretation.

  ***

  ### What Both Are Missing

  The disagreement remains intractable because neither explicitly names the core ontological concept dividing them: **Haecceity**.

  *   **The Missing Distinction:** They need to distinguish between **Qualitative Properties** (properties regarding what an object is like) and **Non-Qualitative Properties** (properties regarding which object it is, often called haecceities).
  *   **The Tractable Version:** The debate should be framed as: **Does numerical distinctness require qualitative distinctness?**
      *   Ada argues **No** (Anti-Haecceitism): Two things can be distinct purely by number, even if all qualitative facts are identical.
      *   Emmett argues **Yes** (Haecceitism): If two things are distinct, there must be a property distinguishing them (even if that property is just "being this one").

  Once they agree that the dispute is about whether **primitive identity facts** exist independently of qualitative description, the argument becomes tractable. Ada is arguing against the existence of haecceities; Emmett is arguing that haecceities are either real or linguistically unavoidable. Recognizing this allows them to see that Move (6) is not a dissolution of the problem, but a statement of ontological preference.
