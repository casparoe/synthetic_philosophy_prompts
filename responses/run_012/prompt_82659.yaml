      *   *Averaging:* Utilitarian aggregation (Benthamite). Assumes cardinality and comparability of preferences across individuals.
      *   *Single Model:* Monism. Assumes a single optimal set of weights for values exists for all users.
      *   *Claimed Neutrality:* Liberal neutrality (Rawlsian-ish), but the practice contradicts this.

  3.  **Drafting - Section by Section (mental outline):**
      *   *Theory of Value:* It's a hybrid: constrained utilitarianism. Staff set deontological bounds (eligibility); annotators provide utilitarian inputs (rankings).
