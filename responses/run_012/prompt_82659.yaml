          6.  Identify rival positions ruled out (deference at inference, deliberative procedure, menu of models).
      *   **Constraint:** Answer in no more than 500 words.

  2.  **Deconstruct the Scenario & Theory of Value:**
      *   *Annotators:* Non-users, specific countries. This suggests a proxy theory of value (values are universalizable or transferable) or a paternalistic one (staff/annotators know better).
