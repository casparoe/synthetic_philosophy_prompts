answer: |-
  Yes, Priya has overstepped because she has unilaterally imposed a default setting on your adult behavior that prioritizes her comfort over your autonomy, enforced by artificial friction.

  While you technically agreed, that passive acquiescence to a convenience does not constitute informed consent for a permanent behavioral policy, especially given the context was half-asleep and casual. The opt-out cost is the decisive factor: by making her preference the path of least resistance, she imposes a friction tax on your autonomy that effectively coerces compliance through inconvenience rather than rule. The fact that she benefits from your sobriety confirms this is not pure altruism but environmental control, validated by her admission that she would continue even if it made you miserable. The tally she keeps transforms this from a helpful habit into surveillance, quantifying your compliance with her moral preference.

  Regarding the analogies, the flat is indeed a small version of the same political problem known as libertarian paternalism, where choice architecture is manipulated to steer behavior without forbidding options. If a supermarket app did this, it would be a usability manipulation devoid of moral judgment, making it less personal but structurally identical. If a government did it, it would be public policy aimed at aggregate welfare without personal intimacy, shifting the violation from relational to civic. The verdict that your agency is being usurped does not change across these scenarios, but the violation is most acute with Priya because she combines the algorithm's friction with a personal moral stake in your conduct, breaching the social contract of equality between flatmates.
