answer: |-
  You have identified a genuine structural paradox in Athenian democracy that sits at the intersection of political theology and social choice theory. There is no single established term that captures this specific carving—the *structural* legitimacy of contradictory sovereign acts over time—because modern constitutionalism is largely designed to prevent exactly this phenomenon.

  The closest established concepts are **Parliamentary Sovereignty** (Dicey), which holds that a legislature cannot bind its successors, and **Majoritarian Cycling** (social choice), which explains how preferences can reverse without new information. However, Parliamentary Sovereignty usually assumes a gap between sessions (successors), whereas your Athenian examples involve the *same* men in the *same* session or adjacent days. Majoritarian Cycling explains the *mechanism* of reversal (intransitive preferences) but not the *legitimacy* of both outcomes. The Greeks themselves labeled the psychological state *metagnōsia* (change of mind/repentance), but that describes the voters, not the body's structural capacity to hold two contradictory wills as equally valid.

  The phenomenon you are describing is that the Athenian *Ecclesia* possessed **Sovereign Presentism**. The sovereign "will" was not a continuous trajectory but a series of discrete, sovereign moments. Because there was no higher constitutional court to declare Vote B "unconstitutional" relative to Vote A, and no rule of *stare decisis* binding the demos to itself, the only reality was the vote *now*. The *graphe paranomon* (indictment against illegal proposals) was the system's awkward workaround: it allowed the decree to stand as an act of will (preserving sovereignty) while punishing the proposer (acknowledging the error), effectively splitting the difference between "the People are always right" and "the People made a mistake."

