answer: |-
  1. When you say 'only marbles push', do you mean symbols make no difference to outcomes, or merely that they lack a productive mechanism?
     *Follow-up:* If the former, how do you avoid straight epiphenomenalism regarding thought?

  2. If the marble level is sufficient for causation, aren't marbles themselves excluded by quarks? Why does the regress stop precisely where you want it?
     *Follow-up:* Is your 'bottom' level ontological, or just a pragmatic cutoff for physicists?

  3. You cannot predict clump behaviour without clump-level vocabulary. Doesn't that explanatory necessity imply causal weight?
     *Follow-up:* Or is predictability merely a human constraint, not a feature of the world?

  4. Hofstadter insists simmballs are dumb. Does your model smuggle cleverness into their interaction rules?
     *Follow-up:* If the rules encode logic, haven't you just pushed the symbol-level up rather than down?

  5. If symbols don't push, the 'I' is smoke. Do you bite the bullet that agency is illusory?
     *Follow-up:* Or is 'I' just a shorthand for a specific, highly complex marble configuration?

  6. Evolution selected for reasoning. If symbols are inert, what fitness advantage did they actually confer?
     *Follow-up:* Did evolution select for marble-shuffling that merely mimics reasoning without doing the work?

  7. When I correct a belief, did I intervene, or did marbles merely rearrange according to prior laws?
     *Follow-up:* Does this make normative reasoning reducible to kinetic energy and collision?

  8. If higher levels do no work, why does cognitive science succeed using them consistently?
     *Follow-up:* Is successful science possible despite relying on false causal assumptions?

  9. What evidence would convince you that patterns possess downward causation?
     *Follow-up:* Is the view falsifiable, or merely a metaphysical stance on what 'real' means?

  10. Is your physicalism a finding of science, or a precondition for doing it?
      *Follow-up:* If the latter, isn't it dogmatic to rule out higher-level causation by fiat?

  **Confidence Notes**
  *   **Characterisation of Exclusion Argument:** 95% confident. This is a standard formulation of Jaegwon Kim's exclusion problem applied to non-reductive physicalism.
  *   **Hofstadter's Careenium:** 90% confident. The description of simmballs/clumps and the multiple-levels view aligns with *Gödel, Escher, Bach*.
  *   **Guest's Likely Responses:** 75% confident. Physicalists often retreat to pragmatism when pressed on the regress (Q2) or adopt an illusionist stance on agency (Q5).
  *   **Least Sure Point:** I am 60% confident on the interpretation of Hofstadter's simmballs as strictly 'dumb' (Q4). Hofstadter sometimes implies the rules themselves carry semantic weight, which complicates the 'dumb marble' objection. If your guest argues the rules are the 'pushers', Q4 may need adjustment.
