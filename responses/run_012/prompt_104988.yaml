  The analogy's critical break lies in the ontology of the "riverbed." Geological channels are fixed prior to the water; human preferences are not fixed prior to culture. The analogy assumes preferences exist fully formed, merely suppressed by inequality. However, socialization is constitutive, not just restrictive. In "high water" (inequal) societies, survival needs dictate choices for both sexes, compressing divergence. In "low water" (equal) societies, self-expression is permitted, but that expression is shaped by the very culture that enabled the equality. The "water" (culture) doesn't just sit on the "bed"; it helps carve it over time through socialization. Therefore, what surfaces isn't necessarily "nature" waiting underneath; it may be the specific shape culture takes when scarcity is removed.

  Additionally, the analogy assumes the "water" is uniform pressure. In reality, wealthy egalitarian nations often have stronger welfare states allowing *anyone* to choose lower-paying care work, while poorer nations force everyone into high-survival labor. This changes the incentive structure, not just the freedom.

  **Meaningful vs. Decorative Disanalogies**
  Decorative disanalogies (e.g., water is wet, policies are not) do not affect the argument. Meaningful disanalogies do:
  1.  **Plasticity:** Preferences are malleable, not fixed like geology.
  2.  **Constitutive Culture:** Environment shapes identity formation, not just external constraints.
  3.  **Normative Gap:** "Natural" does not imply "Unobjectionable."

  **Conclusion Evaluation**
  The conclusion fails. Even if differences were entirely natural, it does not follow they are unobjectionable (the naturalistic fallacy). More importantly, the analogy smuggles in essentialism. If the "riverbed" is partially carved by the historical flow of the "water" (cultural history), then the observed sorting is a mix of biology and entrenched cultural norms amplified by freedom, not pure nature. The analogy was carrying the conclusion all along by defining the riverbed as "natural" upfront rather than deriving it from evidence.

  **Better Analogy**
  A **Garden**. Seeds (biology) have potentials, but soil and trellises (culture/policy) determine growth. In poor soil, only hardy weeds survive (survival jobs). In rich soil, plants diversify. Some diversification is genetic, some is how the gardener trained the vines. You cannot look at a mature garden and say the shape is purely the seed's doing.

  **Cross-National Claims**
  Aggregate patterns cannot license strong claims about individual natural traits. They show how groups respond to specific structural incentives. Inferring "nature" from cross-national variance ignores that "equality" itself is culturally specific. The pattern reveals how preferences interact with opportunity, not the fixed content of the preferences themselves.
