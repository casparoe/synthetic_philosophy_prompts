      *   **Requirements:**
          1.  Set out the mapping explicitly (correspondence table).
          2.  Identify where the mapping breaks (disanalogies).
          3.  Distinguish between meaningful disanalogies (affecting the conclusion) and decorative ones.
          4.  Evaluate the conclusion ("differences are natural, therefore unobjectionable") in light of the breaks.
          5.  Offer a better analogy if available.
          6.  Address whether cross-national patterns license claims about natural traits.
          7.  **Constraint:** Keep the whole answer under 700 words.
          8.  **Formatting:** Open with the correspondence table.

  2.  **Deconstruct the Analogy:**
      *   *Reservoir Water:* Social pressure/constraints/inequality.
      *   *Draining:* Implementing egalitarian policy/increasing wealth.
      *   *Riverbed:* Underlying natural biological/psychological differences.
      *   *Visibility:* Observed behavioral differences (e.g., field choice).

  3.  **Identify Breaks/Disanalogies:**
      *   *Static vs. Dynamic:* Riverbeds are geologically fixed; human preferences are plastic and shaped by environment.
      *   *External vs. Internal:* Water sits *on* the riverbed; culture/socialization shapes the *formation* of preferences (constitutive, not just masking).
      *   *Uniformity:* Water is uniform; social pressures vary in kind, not just level.
      *   *Normative Leap:* "Natural" does not equal "Unobjectionable" (is-ought problem).

  4.  **Evaluate the Conclusion:**
      *   The analogy assumes essentialism (preferences exist prior to culture). If culture shapes preferences (constructivism), the "riverbed" is actually carved by the "water" over time.
      *   The leap from "natural" to "unobjectionable" is a logical fallacy regardless of the analogy's accuracy.

  5.  **Develop a Better Analogy:**
      *   *Garden vs. Wild Growth:* Different soils (cultures) produce different blooms even from the same seeds, or pruning shapes the growth itself.
      *   *Language Acquisition:* All humans have the capacity for language (natural), but which language you speak is entirely environmental.
      *   *Selected:* **The Garden.** It captures interaction between biology (seeds) and environment (soil/tending).

  6.  **Drafting - Section by Section (monitoring word count):**

      *   *Table:* Keep it tight.
