answer: |-
  Here is a principle designed to be precise enough for application, simple enough to be usable, and honest about the cost required to maintain that simplicity.

  ### The Principle of Conversational Liability

  **A speaker asserts a proposition $P$ if and only if the speaker undertakes a commitment to the *truth* of $P$. A speaker conveys a proposition $P$ without asserting it if the speaker undertakes a commitment only to the *reasonableness* or *appropriateness* of inferring $P$.**

  In practice, this divides speech acts by the type of challenge a hearer is licensed to make:
  1.  **Assertion:** The hearer may challenge the speaker by saying, *"That is false."*
  2.  **Conveyance (Implicature):** The hearer may challenge the speaker by saying, *"That is misleading,"* *"That is irrelevant,"* or *"You shouldn't put it that way."*

  ---

  ### Application to Your Cases

  Here is how the principle processes your existing list, mapping your verdicts to its clauses.

  **1. The Colleague ("Some have doctorates")**
  *   **Verdict:** Not misleading; implied "not all."
  *   **Principle Clause:** **Conveyance.**
  *   **Work:** The colleague commits to the *truth* of "some" (which is satisfied even if all do). She commits only to the *reasonableness* of the inference "not all." You cannot charge her with falsehood, only with being misleading (which she wasn't).
  *   **Status:** Saved.

  **2. The Barista ("Meeting in ten minutes")**
  *   **Verdict:** Conveyed "in a hurry," but not asserted.
  *   **Principle Clause:** **Conveyance.**
  *   **Work:** The speaker commits to the *truth* of the meeting. The "hurry" is a context-dependent inference required for cooperativeness. If you weren't in a hurry, the statement would be *misleading*, not *false*.
  *   **Status:** Saved.

  **3. The Friend ("Table is flat," "Fish is fresh")**
  *   **Verdict:** Not false; assertoric (can hold her to it).
  *   **Principle Clause:** **Assertion.**
  *   **Work:** This requires accepting "Loose Use" as truth-conditional modulation. The speaker commits to the *truth* of "flat enough for our purposes." If the table is visibly bowed, you may charge her with *falsehood*, not just misleadingness. The literal falsity is absorbed into the truth conditions.
  *   **Status:** Saved.

  **4. The Brother ("Poet but punctual")**
  *   **Verdict:** Contrast conveyed, cannot cancel, but not "said."
  *   **Principle Clause:** **Conveyance.**
  *   **Work:** The speaker commits to the *truth* of the conjunction (Poet + Punctual). The contrast is a conventional constraint on *appropriateness*. If there is no contrast, the utterance is *infelicitous* (inappropriate), not *false*.
  *   **Status:** Saved.

  **5. The Poet ("Moon is a coin")**
  *   **Verdict:** Not true/false; not merely implied.
  *   **Principle Clause:** **None (Requires Overturn).**
  *   **Work:** The Binary Principle forces all non-asserted content into the "Conveyed/Reasonable" bucket. To keep the principle simple, you must classify the poet's meaning as a commitment to the *reasonableness* of viewing the moon *as* a coin.
  *   **Status:** **Overturned.** (See below).

  ---

  ### Predictions for New Cases

  Applying the **Principle of Conversational Liability** to your new scenarios:

  **1. The Doctor ("Scan was clear" vs. "Merely unchanged")**
  *   **Prediction:** **Assertion.**
  *   **Reasoning:** In medical contexts, "clear" is treated as a technical term modulated to mean "no pathology requiring intervention." If the scan shows stable benign matter, "clear" is *true enough* (Loose Use). If the scan shows active disease, the doctor is liable to a charge of *falsehood* (lying), not just misleadingness. The stakes license a strict truth commitment.
  *   **Challenge:** "That is false; there is a mass."

  **2. The Realtor ("Roof in good shape" vs. "Not yet leaking")**
  *   **Prediction:** **Assertion (with caveats).**
  *   **Reasoning:** Like the "flat table," this is Loose Use. The realtor commits to the *truth* of "good shape for now." However, because the domain involves latent defects, the threshold for "truth" is higher. If the roof collapses in a month, the statement is retrospectively *false*, not just misleading.
  *   **Challenge:** "That is false; it needed replacement."

  **3. The Compliment ("I've been lucky")**
  *   **Prediction:** **Conveyance.**
  *   **Reasoning:** The speaker commits to the *truth* of the luck (perhaps). But the primary point is to deflect credit. This is a modesty topos. If the speaker actually worked very hard, they are not *false* (luck may have played a part), but they might be *misleading* about their agency.
  *   **Challenge:** "You are being modest," not "You are lying."

  ---

  ### The Cost: Which Verdict Must Go

  To maintain this simple binary (Truth Commitment vs. Reasonableness Commitment), you must overturn your verdict on **The Poet**.

  **Your Intuition:** The poet "hasn't said anything that could be true or false at all," nor merely implied something.
  **The Principle's Demand:** The poet *must* be conveying something assessable.

  **Why this is the necessary sacrifice:**
  Your intuitions about the Colleague, Barista, Friend, and Brother map cleanly onto the established distinction between **What is Said** (Truth-Conditional) and **What is Implicated** (Non-Truth-Conditional).
  *   The **Friend** case is "Loose Use" (part of What is Said).
  *   The **Colleague/Barista** cases are "Implicature" (part of What is Conveyed).
  *   The **Brother** case is "Conventional Implicature" (part of What is Conveyed).

  The **Poet** case is the outlier. Standard pragmatics (Grice) treats metaphor as a flout of the maxim of Quality, generating an **Implicature**. This means the poet *does* mean something assessable (e.g., "The moon is distant, cold, and valuable"), and you *could* challenge it ("No, the moon is warm and close").

  By accepting the Principle of Conversational Liability, you gain a tool that cleanly separates the Friend (who can be called a liar) from the Colleague (who can only be called misleading). The cost is admitting that the Poet is more like the Colleague than you wish: she is suggesting a perspective that can be assessed as reasonable or unreasonable, even if not literally true. You lose the special "non-cognitive" status of poetry, but you save the distinction between lying and misleading in every other case.

  **Recommendation:** Accept that the Poet *does* convey an assessable claim (an implicature), even if it is not a literal assertion. This preserves the utility of the principle for the cases that matter most to your list (the distinction between the Friend and the Colleague).
