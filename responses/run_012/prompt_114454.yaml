  2. The principle cannot accommodate the friend who has done worse things yet blames you for this thing, since your intuition says her record does not enter your reaction while a clean-hands principle denies her authority. By giving up this verdict, you lose the distinction between general moral character and specific jurisdictional authority over a particular norm.

  3. The friend acquires derivative standing to articulate the blame, but only as a messenger, because the primary stake remains with the victim who suffered the wrong. This preserves the requirement of stake while allowing for support, provided the friend does not claim the injury as their own.

  4. You retain standing to blame your past self because moral identity persists over time, making you both the violator and the stakeholder responsible for maintaining your own integrity. The lack of witnesses is irrelevant because the norm violated was internal to your agency rather than dependent on social enforcement.

  5. The member loses standing to blame because the community's collective decision to forgive waives the relevant stake for all its members, treating the norm as retired rather than violated. Raising it anyway constitutes a breach of the new agreement rather than a valid enforcement of the old one.
