prompt: |-
  I have been trying to work out something about the way people decide one after another, and I would like a serious explanation of it rather than a recap of the usual examples.

  Here is the situation that puzzles me. Picture a long line of people, each of whom privately and independently runs a small, imperfect test before making a yes-or-no choice — whether to adopt a new method, say. Each person can see how everyone before them chose, but not the private test behind anyone else's choice. As I understand it, after only the first few people, everyone further down the line simply copies whatever choice is currently ahead of them, and their own private tests stop making any difference to what they do. What I cannot get past is this: these people are still rational, they still run their own tests, and they still take the evidence seriously. So why does the information carried by their choices drain away to nothing? It looks as if everyone reasoning correctly is precisely what destroys the information, and that seems backwards.

  Two further things seem to follow, and I suspect I am misreading them. First, why would such a line be so brittle — why could a single public announcement, even a weak one, be enough to turn the whole line around, and why does the weight of the private tests that got it started offer no protection? Second, this seems to clash with the familiar idea that many independent judgments together give a better answer than any one of them would alone. If everyone is rational and the line keeps growing, why does the answer stop improving? Is the whole difference that the judgments quietly stop being independent, and if so, where exactly does the independence go?

  Finally, I keep sensing a missing piece. No one in the line seems to count the fact that their own choice will be useful information to the people behind them. Does that omission actually change the outcome, and can it be described as each person failing to invest in something — a benefit that spills over to others but that they have no reason to pay for — without pretending they are behaving irrationally?

  Please explain this in plain language, but do not soften it. I want the mechanism that makes the information disappear, why that mechanism is brittle, how it squares with the wisdom-of-crowds idea, and what the missing piece really is. I would rather have the ideas themselves than any references or reading suggestions. Please answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

  1.  **Analyze the User's Request:**
      *   **Topic:** Information Cascades (sequential decision-making with private signals and public actions).
      *   **Tone:** Serious, plain language, no softening, no references/reading suggestions, American English.
      *   **Core Puzzles to Address:**
          1.  Why does private information stop mattering (information disappearance) despite rationality?
          2.  Why is the system brittle (sensitive to small public shocks)?
          3.  How does this clash with the "Wisdom of Crowds" (independence vs. dependence)?
          4.  What is the "missing piece" regarding the value of one's own choice to others (externality/public good aspect)?

  2.  **Deconstruct Puzzle 1: The Mechanism of Information Disappearance:**
      *   *Concept:* Bayesian updating.
      *   *Scenario:* Person 1 chooses based on private signal. Person 2 sees Person 1's choice + own signal. If signals conflict, Person 2 might be indifferent or follow a tie-breaking rule. Person 3 sees Person 1 & 2.
      *   *The Tipping Point:* Once two people in a row make the same choice (e.g., Yes, Yes), the weight of that public history outweighs any single private signal.
      *   *Why?* Because Person 3 knows Person 2 saw Person 1. If Person 2 chose "Yes," it implies Person 2's signal was likely "Yes" (or at least not strongly "No"). So "Yes, Yes" looks like two signals for "Yes." If Person 3 gets a private "No" signal, it's 2 vs. 1. Rational choice: Ignore private signal, follow the crowd.
      *   *The Consequence:* Person 3's action no longer reveals their private signal. It just repeats the public history. Person 4 sees "Yes, Yes, Yes" but knows the third "Yes" added no *new* information. It's still just 2 signals worth of weight. But Person 4 also faces the 2 vs. 1 math.
      *   *Key Insight:* Rationality forces you to ignore your private info when public info is strong enough. By ignoring it, you stop broadcasting it. The chain of information transmission is cut.

  3.  **Deconstruct Puzzle 2: Brittleness:**
      *   *Concept:* The cascade is built on a thin margin.
      *   *Why?* Once the cascade starts, people are ignoring their private signals. The public pool of information *stops growing*. It stays frozen at the level it was when the cascade began (e.g., equivalent to 2 or 3 signals).
      *   *The Shock:* If an external authority or a highly trusted source releases a new public signal (even a weak one), it gets added to that frozen, small pool. Since the pool is small (not the sum of 1000 people, but just the first 2), a small new weight can tip the balance.
      *   *Protection?* The private tests of people 10 through 100 offer *no* protection because those people didn't act on them. Their tests are locked inside their heads, never aggregated.

  4.  **Deconstruct Puzzle 3: Wisdom of Crowds vs. Cascades:**
      *   *Wisdom of Crowds:* Requires *independent* judgments. If everyone votes based on their own private info, errors cancel out, signal remains.
      *   *Cascades:* Destroy independence. Once the cascade starts, Person 100's choice is mathematically dependent on Person 1's choice. They are not independent samples.
      *   *Where independence goes:* It vanishes the moment someone ignores their private signal to follow the herd. The correlation becomes 1.0 for everyone in the cascade.
      *   *Result:* You don't have 100 judgments; you have 2 judgments repeated 98 times. Averaging 98 copies of the same number doesn't reduce error.

  5.  **Deconstruct Puzzle 4: The Missing Piece (Externalities):**
      *   *Concept:* Informational Externality.
      *   *The Issue:* Person 3 knows that if they follow their private signal (contrarian), they might help Person 4, 5, 6 make better decisions. But Person 3 only cares about their own payoff (being right *now*).
      *   *Rationality:* Being right *now* is the only goal. Sacrificing your own accuracy to help others is irrational in a standard self-interested model.
      *   *The "Investment":* Revealing private info is a public good. It costs you (risk of being wrong personally) but benefits the group (breaks the cascade).
      *   *Outcome:* Because no one pays this cost, the public good (truth) is under-produced. The market for information fails.

  6.  **Drafting the Response (Iterative refinement for tone and clarity):**
      *   *Tone Check:* Needs to be direct, analytical, not condescending, not academic-jargon heavy (explain Bayes without formulas).
      *   *Structure:* Address the four points in order.
      *   *Metaphor:* Use the "weight" metaphor for evidence.
      *   *Refining the "Mechanism":* Make sure to explain *why* the third person ignores their signal. It's about the weight of inferred history.
      *   *Refining the "Brittleness":* Emphasize that the information flow *stops*.
      *   *Refining the "Independence":* Contrast "voting" vs. "sequencing."
      *   *Refining the "Missing Piece":* Frame it as a market failure/externality.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I explain *why* rationality kills information clearly?
      *   *Fix:* Explicitly state that acting on private info becomes the *irrational* move once the cascade starts. That's the paradox.
      *   *Critique:* Is the distinction between private and public info clear?
