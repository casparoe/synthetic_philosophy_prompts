answer: |-
  ### What futarchy is actually committed to
  Futarchy commits to the existence of a measurable welfare function that accurately captures societal value without catastrophic side effects. It assumes prediction markets are epistemically superior to voting or expert panels because profit incentives align participants with truth-seeking. It requires a reliable mechanism to settle bets on counterfactuals, determining what would have happened had the policy not passed. Finally, it assumes that the cost of manipulating a market exceeds the profit available from influencing the policy outcome.

  ### The strong case against
  The most structural failure point is the **metric specification problem**, essentially Goodhart's Law on a national scale. You cannot optimize a complex society using a single scalar variable like GDP or life expectancy without creating perverse incentives. If the market knows it is betting on GDP, it will favor policies that boost GDP even if they erode liberty, increase inequality, or degrade the environment, because the metric does not price those costs. To fix this, you need a composite metric, but weighting those components requires political judgment, which reintroduces the very voting bias futarchy aims to bypass. If the metric is the source of truth, the market is merely an optimizer for that metric, not a discoverer of societal good.

  The **counterfactual settlement problem** is the engineering bottleneck. To pay out a bet on "Policy P increases GDP," you must know what GDP would have been *without* Policy P. Since you only observe one timeline, you need an oracle or econometric model to estimate the counterfactual branch. This creates a circular dependency: if you trust the model to settle the market, you don't need the market; if you don't trust the model, the market cannot be settled objectively. Any model complex enough to simulate national economics will have tunable parameters, turning the settlement process into a political battleground that undermines the market's neutrality.

  Then there is the **manipulation via external profit** vector. Futarchy relies on the assumption that the cheapest way to profit is to bet on the truth. However, if a specific policy yields massive external profits (e.g., a defense contractor lobbying for a war they bet on), an actor can subsidize losses in the prediction market to ensure the policy passes, recouping costs through implementation contracts or regulatory capture. This breaks the "skin in the game" safeguard; the market no longer aggregates information, it aggregates capital. The actors with the most skin in the game aren't those who know the truth, but those who profit from the implementation regardless of the outcome.

  Finally, futarchy risks **unfalsifiability**. When a policy passes via market signal and fails in reality, defenders can claim the metric was wrong, the market was too thin, or manipulation occurred. Without a clear failure condition, the system becomes immune to empirical critique. If every failure is attributed to improper parameter tuning rather than mechanism failure, futarchy functions more like an ideology than a governance technology. You are left with a system that claims to be rational but lacks a feedback loop to correct its own structural errors.

  ### Fatal vs. awkward
  1.  **Metric Specification (Fatal):** If the welfare function is gameable or incomplete, the system optimizes for the wrong thing efficiently.
  2.  **Counterfactual Settlement (Fatal):** Without an objective way to settle bets on unobserved timelines, the mechanism halts or becomes centralized.
  3.  **External Profit Manipulation (Severe):** If policy implementation profits exceed market losses, truth-seeking incentives break.
  4.  **Liquidity/Thin Markets (Awkward):** Can be mitigated over time or via subsidies, though it limits scope initially.
  5.  **Voter Ignorance on Values (Awkard):** Voters may choose poor metrics, but this is a problem of democracy, not futarchy specifically.

  ### What defenders concede
  Robin Hanson and other proponents admit that defining the welfare metric is a political process, not a technical one, and cannot be solved by markets. They concede that manipulation is possible but argue it is generally cheaper to bet on the truth than to manipulate a liquid market. They acknowledge that initial markets will be thin and require subsidization to function. Most importantly, they admit that futarchy works best on marginal decisions where causal links are clearer, rather than sweeping societal overhauls.

  ### What would change my mind
  *   **A successful pilot:** A corporation or municipality runs a decision market on a high-stakes policy with a verifiable outcome, outperforming a control group.
  *   **A robust counterfactual oracle:** A decentralized, cryptoeconomic mechanism emerges that can settle counterfactual bets without centralized trust.
  *   **Manipulation resistance:** Evidence that markets can withstand subsidized attacks from actors with external policy incentives.
  *   **Metric stability:** Demonstration of a welfare function that remains robust against optimization pressure over a decade.
