answer: |-
  This is a high-leverage intervention. $500k is enough to buy serious thinking time but not enough to buy a new historical archive or a decade-long longitudinal study. We need questions where conceptual clarity unlocks empirical value, not the other way around. If the concepts are muddy, the data will be noise.

  Here is the brainstorming process, the cut, the agenda, and the critique.

  ### Phase 1: The Brainstorm (20 Candidate Questions)

  1.  What distinguishes a norm that collapses suddenly from one that resists for centuries?
  2.  Is elite consensus a prerequisite or a lagging indicator of moral revolution?
  3.  Can moral argument change behavior absent material incentive shifts?
  4.  Do successful revolutions require a replacement norm, or can norms simply be deleted?
  5.  Is moral backsliding mechanistically identical to moral progress, just reversed?
  6.  How much of "moral change" is actually just preference falsification unraveling?
  7.  Does the "honor/dignity/victimhood" trichotomy map to distinct psychological enforcement mechanisms?
  8.  What is the minimum coalition size required to tip a local norm?
  9.  Do wars and crises accelerate moral change by disrupting enforcement networks?
  10. Is the spread of anti-sodomy laws evidence of norm transfer or administrative convenience?
  11. How do we measure the difference between de jure and de facto normative change?
  12. Are "moral entrepreneurs" necessary catalysts or just figureheads for structural shifts?
  13. Does the speed of moral change correlate with the centralization of communication media?
  14. Is there a "half-life" for moral arguments before they become invisible background assumptions?
  15. Do moral revolutions require a change in the definition of "personhood" or just "obligation"?
  16. How does the cost of enforcement correlate with the stability of a moral norm?
  17. Can we predict moral revolutions using economic volatility indicators?
  18. Is shame a more potent enforcement mechanism than guilt in pre-modern contexts?
  19. Do children internalize new norms faster than adults, driving generational turnover?
  20. Is the "economic interest" story of abolition a post-hoc rationalization or the primary driver?

  ### Phase 2: The Discard Pile (15 Cut)

  *   **Q1 (Collapse vs. Resistance):** Too descriptive; doesn't explain *mechanism*, just categorizes outcomes.
  *   **Q3 (Argument absent Incentive):** Untractable; incentives and arguments are almost never cleanly separable in history.
  *   **Q5 (Backsliding Symmetry):** Vital, but better folded into the "Asymmetry" question below; standalone it's binary.
  *   **Q7 (Honor/Dignity Trichotomy):** Likely folk taxonomy; risks reifying labels rather than finding mechanisms.
  *   **Q8 (Coalition Size):** Too quantitative for philosophers; requires game theory modeling we aren't funding.
  *   **Q9 (Wars/Crises):** Historically specific; hard to generalize without massive data cleaning.
  *   **Q10 (Anti-Sodomy Laws):** Too narrow a case study; should be data for a broader question, not the question itself.
  *   **Q11 (De Jure/De Facto):** This is a measurement problem, not a causal question; solvable by better metrics.
  *   **Q12 (Moral Entrepreneurs):** Focuses on individuals; moral change is usually systemic/structural.
  *   **Q13 (Communication Media):** Technological determinism; interesting but downstream of *why* media matters.
  *   **Q14 (Half-life of Arguments):** Poetic but unfalsifiable; how do you measure an argument's visibility?
  *   **Q15 (Personhood vs. Obligation):** Conceptual hair-splitting; both usually shift together.
  *   **Q16 (Enforcement Cost):** Economic reductionism; ignores the *moral* cost of enforcement which is the variable of interest.
  *   **Q17 (Economic Predictors):** Purely empirical; philosophers can't do this, and economists already try.
  *   **Q20 (Abolition Specifics):** Too specific; we want a theory of change, not a history of slavery.

  ### Phase 3: The Funded Agenda (5 Questions)

  These five are selected because they are **upstream** (they define what counts as data), **tractable** (philosophers can wrestle with concepts and case studies without needing new archives), and **actionable** (the answers change how you intervene).

  #### 1. The Coordination vs. Conviction Question
  *Does moral revolution require genuine belief updating, or is it merely the unraveling of preference falsification (common knowledge shifts)?*

  *   **(a) Upstream/Downstream:** Upstream. If change is mostly coordination (everyone stops because everyone else stopped), then moral argument is less important than public signaling. If it's conviction, argument is key. This defines the mechanism of action.
  *   **(b) Tractability:** High. Philosophers can analyze historical texts for evidence of private doubt vs. public conformity (e.g., diaries vs. speeches) without needing new stats.
  *   **(c) The Crux:** You have to believe that "hypocrisy" is a stable equilibrium that can be broken without changing hearts. If you believe people *must* believe the new thing to act the new way, this question collapses.
  *   **(d) Evidence in 2 Years:** Comparative case studies (e.g., Dueling vs. Footbinding) where private writings are available. If we find elite diaries showing private rejection of dueling 50 years before public abandonment, that supports the Coordination model.
  *   **(e) Impact on Empiricists:** If Coordination wins, empiricists stop measuring "attitudes" and start measuring "public signaling costs" and "pluralistic ignorance."

  #### 2. The Elite Signaling Question
  *Is elite consensus a causal prerequisite for mass moral change, or a ratification of mass pressure?*

  *   **(a) Upstream/Downstream:** Upstream. Determines *who* the intervention targets. Do you fund grassroots activism or elite persuasion?
  *   **(b) Tractability:** High. Political theorists can trace the timeline of legislative change vs. popular pamphleteering vs. court rulings.
  *   **(c) The Crux:** You have to believe that elites have independent agency. If elites are purely reactive to economic pressure from below, the question is moot.
  *   **(d) Evidence in 2 Years:** Timeline mapping of 3 revolutions. If elite rhetoric shifts *before* mass behavior shifts in 2/3 cases, the Elite model gains weight.
  *   **(e) Impact on Empiricists:** Shifts focus from "mass movements" to "network analysis of elite institutions" (clubs, universities, courts).

  #### 3. The Replacement Norm Question
  *Must a norm be replaced by a competing norm to be destroyed, or can norms simply be deleted?*

  *   **(a) Upstream/Downstream:** Upstream. Appiah implies honor norms were replaced by dignity norms. If deletion is possible, strategy changes.
  *   **(b) Tractability:** High. Conceptual work. What does a "void" in normative space look like?
  *   **(c) The Crux:** You have to believe that human social coordination requires a rule for *every* interaction. If some interactions can become "norm-free," deletion is possible.
  *   **(d) Evidence in 2 Years:** Historical search for "negative cases." Are there examples of behaviors that just stopped without a new rule filling the gap? (e.g., specific mourning rituals).
  *   **(e) Impact on Empiricists:** If Replacement is required, empiricists must study *what* filled the gap. If Deletion is possible, they study the *cost* of maintaining the old rule.

  #### 4. The Asymmetry Question
  *Are moral regressions (counter-revolutions) mechanistically distinct from moral progress, or the same engine in reverse?*

  *   **(a) Upstream/Downstream:** Upstream. Most theory assumes a ratchet effect (progress sticks). If regressions are easy, the theory of progress is wrong.
  *   **(b) Tractability:** High. Theorists can compare the structure of 19th-century abolition vs. 20th-century reactionary laws (like the anti-sodomy example you gave).
  *   **(c) The Crux:** You have to believe that "progress" isn't just the default direction of history. If you think history has an arrow, this question is confused.
  *   **(d) Evidence in 2 Years:** Analysis of legal codification speeds. Did anti-sodomy laws spread faster than pro-rights laws? Speed differences imply different mechanisms (administration vs. persuasion).
  *   **(e) Impact on Empiricists:** Forces them to look for "vulnerability markers" in established norms. If asymmetry exists, some norms are structurally fragile.

  #### 5. The Marginal Utility of Argument Question
  *Can we isolate the causal effect of moral reasoning from status signaling and economic interest?*

  *   **(a) Upstream/Downstream:** Downstream of the others, but the "Rationalist Heart" of the project. It validates the entire premise of funding philosophers.
  *   **(b) Tractability:** Medium/Low. This is the hardest one. Requires careful process tracing.
  *   **(c) The Crux:** You have to believe that reasons can be causally efficacious independent of the *status* of the reasoner.
  *   **(d) Evidence in 2 Years:** Identifying cases where a low-status actor made an argument that was ignored, then a high-status actor made the *same* argument and it landed. This isolates status from content.
  *   **(e) Impact on Empiricists:** If arguments don't matter independently, empiricists stop coding "content of speeches" and start coding "status of speakers."

  ---

  ### Phase 4: Engaging Your Half-Formed Ideas

  You are circling the right things, but some distinctions are muddy.

  *   **Failed/Near-miss Revolutions:** **Not confused.** This is the control group. Most theory looks at successes. Studying the "almosts" (e.g., movements that argued for 100 years and failed) is the only way to isolate the *trigger* variable. I would make this a constraint on the researchers: *Every claim about success must be tested against a near-miss failure.*
  *   **Counter-revolutions/Norm Hardening:** **Not confused, and critical.** The "anti-sodomy" example is excellent. It suggests that *administrative capacity* can impose norms without *moral buy-in*. This challenges the Appiah model which relies on social shame. If the state can enforce shame legally, the mechanism is coercion, not honor. This feeds directly into **Question 4 (Asymmetry)**.
  *   **De Jure / De Facto Gap:** **Slightly confused.** You frame this as "behavior vs. belief." I frame it as "coordination vs. conviction" (**Question 1**). The gap isn't just measurement error; it's a specific state of equilibrium (pluralistic ignorance). Don't just ask "did they believe it?" Ask "did they know that others didn't believe it?"
  *   **Silent Collapses:** **Not confused.** This is the strongest evidence for the Coordination model. If WWI killed dueling without argument, it suggests the norm was already hollowed out and just needed a shock to the enforcement network. This is a key data point for **Question 1**.
  *   **Honor/Dignity/Victimhood Trichotomy:** **Mostly confused.** This feels like a folk taxonomy that rationalists latched onto because it sounds structural. It risks becoming a Just-So story ("We are in the Victimhood era now"). I would fund **Question 7** from the discard pile only if the researcher can define these as *enforcement mechanisms* (e.g., Honor = external reputation, Dignity = internal rights, Victimhood = harm-based status) rather than historical eras. If they can't operationalize it, it's a distraction.

  ### Phase 5: Two "Fun But Don't Fund" Questions

  1.  **"Predicting the Next Moral Revolution."**
      *   **Why:** It's sexy and donors love it. But it's unfalsifiable in a 2-year window and encourages speculation over rigor. It invites the researchers to become pundits rather than theorists.
  2.  **"The Psychology of the Moral Martyr."**
      *   **Why:** It focuses on individual heroism. Moral change is rarely about heroes; it's about systems. Studying the psychology of the first person to object tells you little about why the 10,000th person followed.

  ### Phase 6: A Critique of Your Framing

  You are asking for a "Theory of Moral Change." I suspect you won't get one, and if you do, it will be wrong.

  **The Trap:** You are looking for a Unified Field Theory (like physics). Moral change is likely more like biology or meteorology—a complex adaptive system where context swamps law.

  **The Risk:** If you ask philosophers for "The Answer," they will give you a grand narrative that fits the data you already know (Abolition, Dueling, Footbinding) but fails on out-of-sample testing.

  **The Pivot:** Instead of asking "How do moral revolutions happen?", ask **"What are the necessary conditions for a norm to become fragile?"**
  Don't look for the engine of change; look for the structural weaknesses that allow change to take. This is more negative, more defensive, but more tractable. It aligns better with your interest in counter-revolutions and silent collapses.

  **Budget Note:** $500k over 2 years for 3-4 people is very generous (~$125k/person/year). This buys *focus*. The constraint shouldn't be money; it should be **scope**. Do not let them try to cover 300 years of history. Force them to go deep on 3 specific case studies (e.g., Dueling, Abolition, Anti-Sodomy) and apply the 5 questions rigorously to those. Depth beats breadth here.

  **Final Advice:** Hire the quant not to run regressions on everything, but to build the "Control Group." Their job is to find the norms that *didn't* change despite the arguments, or the elites who *didn't* signal. Without the negative cases, the philosophers will just write history, not theory.
