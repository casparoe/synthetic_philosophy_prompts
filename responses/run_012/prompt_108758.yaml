answer: |-
  Hey there, this is a really sharp worry to have, and honestly, you have stumbled onto one of the live grenades currently sitting on the desk of decision theory research. What you have written down is essentially a version of the Acausal Pascal's Mugging problem, and it is the exact reason why many of us have moved away from pure Evidential Decision Theory toward things like Functional Decision Theory or Timeless Decision Theory. I want to walk through this with you carefully because your intuition that something breaks between steps two and four is correct, but your study partner is also right that simply deleting step two comes with a massive price tag.

  Let's start by brainstorming the obvious move, which is exactly what you proposed in step seven. You suggest rejecting the idea that mere evidential correlation counts for deliberation. This is the move from Evidential Decision Theory to Causal Decision Theory. If you take this route, you save yourself from bankrupting yourself for the sake of strangers in other possible worlds. In a Causal framework, your decision only matters for what it causes, and since there is no causal channel to these other agents, their payoffs are irrelevant to your calculation. This feels safe and sane. It protects your wallet. But before we commit to this, we have to look at what else dies when you kill step two. If you say that evidential correlation doesn't count, you lose the ability to solve Newcomb's Problem correctly. In Newcomb's Problem, there is a predictor who simulates you. Your choice doesn't causally affect what the predictor put in the box yesterday, but it is evidence of what they put. Causal Decision Theory says you should two-box, because your choice can't change the past. But almost everyone in this field agrees that one-boxing is the rational move because you and the simulation are running the same reasoning process. If you reject step two to avoid the acausal mugging, you also lose the justification for one-boxing, and you lose the justification for cooperating in the Twin Prisoner's Dilemma. You end up being the kind of agent who leaves money on the table in standard cases just to avoid the crazy cases. That is a very high price to pay for sanity.

  So if we keep step two, we have to find where the argument goes off the rails. Let's look closely at step three and four. You are assuming that because there could be astronomically many agents who reason like you, your action is evidence for all of them. But we need to distinguish between two kinds of similarity. There is accidental similarity and there is logical identity. If I am reasoning about whether to carry an umbrella, and there is another person in a different city who also likes staying dry, our decisions might be correlated. We both check the weather report. But my decision doesn't logically force theirs. We are just similar. In your argument, you lump together copies, simulations, and agents in other possible worlds who just happen to reason like me. This is the weak link. In modern decision theory, we care about subjunctive dependence. The question isn't just does my choice evidence theirs, but if I were to output cooperate, would that logically necessitate that they output cooperate? If they are running the exact same source code as me, then yes. If they are just similar humans in a different branch of the multiverse, the link is much weaker.

  This brings us to the Pascal's Mugging aspect of your argument. In the classic Pascal's Mugging, a stranger threatens to simulate and kill huge numbers of people unless you give them five dollars. The expected value calculation breaks because the probability of the threat being real drops faster than the number of people rises, or we impose a complexity penalty on the hypothesis. Your argument is similar. You are assuming that the probability of there being astronomically many agents logically correlated with you is high enough to swamp the finite cost. But if we require logical identity, the number of such agents is constrained by the complexity of your algorithm and the structure of the multiverse. It is not obvious that there are enough logical copies to create an infinite expected value. Furthermore, step four assumes that these agents will pay you back. Acausal trade requires that we have different preferences and can benefit each other. If everyone is identical to me, they value what I value. If I give up a dollar, they give up a dollar. Nobody gains. Trade only happens when I value something they have cheaply and vice versa. If you are just donating to a fund hoping random correlated agents pay you back, that isn't trade, that's just hoping for a correlation without a mechanism for mutual benefit.

  So where does that leave us? I think the thing to reject is actually step one, but not in the way your study partner thinks. You don't want to reject evidential correlation entirely, because that kills Newcomb. You want to reject the idea that expected value should be calculated using raw conditional probability. Instead, you want to calculate expected value using subjunctive or logical dependence. This is the core insight of Functional Decision Theory. In this framework, you treat your decision as the output of a logical function. You ask what happens if this function outputs cooperate. You then look at all the other places in the universe where this same function is instantiated. You ignore the agents in step three who just happen to reason like you but are not running your function. You only count the ones whose output is logically tied to yours. This blocks the flood of random agents in other possible worlds while preserving the connection to your twin in the Prisoner's Dilemma.

  However, I have to be honest with you that this doesn't completely dissolve the problem if you accept a very large multiverse. If there are truly infinite copies of you, the expected value can still diverge. This is known as the problem of infinite ethics, and it is still unsolved. But for the purposes of your seminar, the principled way to stop the flood at step four without stipulating a cutoff is to insist on logical necessity rather than evidential correlation. You tell your study partner that step two is too broad. It is not true that any correlation counts. Only correlations grounded in the same logical computation count. This saves acausal trade between copies but kills the acausal mugging from random similar agents. The price you pay for this is complexity. You have to adopt a more sophisticated decision theory than standard Causal or Evidential Decision Theory. You have to accept that your decision is an abstraction that can be instantiated in multiple places, which is a metaphysically heavy view. But it is the only way to keep the benefits of acausal trade without the bankruptcy.

  To make this concrete, consider the Smoking Lesion problem. In this case, there is a gene that causes both a desire to smoke and lung cancer. Smoking doesn't cause cancer, the gene does. Evidential Decision Theory says don't smoke, because smoking is evidence you have the gene. Causal Decision Theory says smoke, because smoking doesn't cause cancer. Most people agree you should smoke. Your argument treats the other agents like the gene in the Smoking Lesion. They are correlated with you, but your choice doesn't determine them unless you share the same logical source code. If they are just similar agents in other worlds, they are like the gene. Correlated, but not controlled by your decision function. If you treat them as evidence, you get the wrong answer, just like EDT gets the wrong answer in Smoking Lesion. So you must refine step two to say that my choosing X raises the probability that they choose X only if their choice is a logical consequence of my decision procedure.

  In conclusion, I would advise you to reject the naive formulation of step one and two in favor of a logical dependence view. Do not tell your professor that evidential correlation never counts, because that forces you to two-box in Newcomb's Problem. Instead, argue that the reference class in step three is ill-defined. Mere similarity is not enough for acausal trade. There must be logical identity. This blocks the astronomical number of agents because logical copies are rare, or at least not numerous enough to swamp finite costs without further assumptions about the multiverse. You pay the price of having to defend a more complex decision theory, and you leave yourself open to the unresolved problems of infinite ethics, but you save the core intuition of acausal trade without accepting the madness of giving away everything. It is a delicate balance, but it is the standard position for those who want to take acausal trade seriously without becoming mugged.
