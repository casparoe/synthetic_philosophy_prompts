  I'm a backend dev, no philosophy background, but I keep ending up in arguments about whether LLMs actually "understand" anything, and I'm trying to figure out what I actually think instead of just vibing. So heres my gut on a bunch of systems, and I want to know if there's one principle behind all of it:

  - A pocket calculator showing ERROR when you divide by zero. Means nothing by it, obviously. Not even a candidate.
  - A thermostat that "senses" temperature and "decides" to kick the heat on. I don't think it decides anything, but I also don't think it's *wrong* to say it senses temperature, which annoys me.
  - A chess engine scoring a position "+2.3 for white." This one I want to say is actually about something real, the way a thermometer reading is about the temperature. So grounded, sort of, even though the thing has no idea what chess is.
  - A parrot that says "cracker" to get a cracker, only when it wants one, never any other time. The word is clearly doing work for the bird. Still wouldn't say the parrot means cracker.
  - A dog that bolts to the door when you say "walk." The dog gets something. Is "walk" a word for the dog or not?
  - My phone's autocomplete suggesting the next word. No. Not a word, not meaning, no.
  - A model that plays legal and even decent chess when asked, and when you ask why it played a move says "to control the center." This is the one that keeps me up. I genuinely can't tell anymore.

  The rule I keep reaching for is something like: a symbol means something when its hooked up to stuff the system can act on and be affected by. But the calculator is hooked up to buttons and the thermostat is hooked up to a furnace, and that definately shouldn't count, so I know the rule is wrong somewhere.

