answer: |-
  ### The Jury Standard: Desiderata for a Theory of Taste

  The following specification defines the conditions of adequacy for a theory of taste. The test is pragmatic and normative: Could this theory serve as the charter for a prize jury? The jury must be able to issue a verdict, defend it against the charge of elitism (it's just your preference), and defend it against the charge of dogmatism (it's an objective fact like weight or mass).

  #### I. Core Desiderata

  **1. The Antinomy Constraint**
  *   **Requirement:** The theory must explain how a judgment of taste is grounded in a subjective feeling yet voiced with a claim to universal validity. It must account for the grammar of "This is beautiful" rather than "I like this."
  *   **Motivation:** If the theory reduces taste to preference polling, it cannot justify a prize over a popularity contest. If it reduces taste to objective measurement, it cannot explain why we argue about art rather than calculate it.
  *   **Status:** **Non-negotiable.** This is the phenomenological data of aesthetic experience.

  **2. The Normativity of Error (Corrupt Taste)**
  *   **Requirement:** The theory must provide criteria for identifying a judgment as *mistaken* without defining "mistaken" merely as "disagreeing with the theory." It must distinguish between a difference of taste and a failure of taste (e.g., immaturity, prejudice, inattention).
  *   **Motivation:** A jury must be able to reject a submission not because they dislike it, but because it is kitsch, derivative, or technically incoherent. Conversely, they must be able to identify when the *public* is wrong to reject a difficult work.
  *   **Status:** **Non-negotiable.** Without the possibility of error, criticism is impossible.

  **3. The Asymmetry of Access**
  *   **Requirement:** The theory must explain why direct experience of the work is necessary for a valid judgment, and why testimony (reading a review) is insufficient, even if the testimony is accurate.
  *   **Motivation:** A jury cannot vote based on a summary. The aesthetic value is tied to the act of perception.
  *   **Status:** **Non-negotiable.** This distinguishes aesthetic judgment from historical or scientific judgment.

  **4. The Non-Circular Expert**
  *   **Requirement:** The theory must define the "connoisseur" or "ideal critic" by independent traits (e.g., attention, practice, lack of prejudice) rather than by their verdicts. We cannot say "The expert is the one who chooses the winner" and "The winner is what the expert chooses."
  *   **Motivation:** To avoid begging the question. The jury's authority must rest on qualifications, not just outcomes.
  *   **Status:** **Non-negotiable.** Circular definitions offer no defense to the losers.

  **5. The Limit of Disagreement (Faultless Disagreement)**
  *   **Requirement:** The theory must specify whether two equally qualified judges can legitimately disagree. If yes, it must explain how the standard survives without fracturing. If no, it must explain why the disagreement is merely apparent or resolvable.
  *   **Motivation:** Juries often split. If the theory says one *must* be wrong, it risks dogmatism. If it says *both* are right, it risks collapsing into subjectivism.
  *   **Status:** **Contested Prejudice.** The insistence that there *must* be a single right answer is a metaphysical prejudice. The insistence that *any* disagreement is valid is a relativist prejudice. The theory must simply take a coherent stance.

  **6. The Possibility of Community-Wide Error**
  *   **Requirement:** The theory must allow for the possibility that an entire culture or era possesses a "bad" taste, and define what "bad" means in that context without appealing to a future verdict (i.e., not just "they were wrong because we now know better").
  *   **Motivation:** History shows shifts in canon (e.g., the rehabilitation of Bach or Melville). The theory must explain how the past was blind, not just different.
  *   **Status:** **Non-negotiable.** A theory that equates taste with consensus cannot account for artistic progress or rediscovery.

  **7. Action-Guidance under Uncertainty**
  *   **Requirement:** The theory must provide a procedure for rendering a verdict when the standard does not yield a clear outcome. It cannot demand infinite deliberation.
  *   **Motivation:** The prize must be awarded. The theory must function as a decision procedure, not just a metaphysical description.
  *   **Status:** **Non-negotiable.** Derived from the "Jury Standard."

  ---

  #### II. Stipulated Cases and Demands

  **Case 1: The Neuro-Divergent Perceivers**
  *   **Scenario:** Two perceivers have identical training, attention, and knowledge. However, due to hard-wired neurological differences, Work X registers as harmonious/sweet to Perceiver A and discordant/grating to Perceiver B. Neither can induce the other's experience via argument.
  *   **Demand on Theory:** The theory must distinguish between *physiological incapacity* and *aesthetic failure*. If the difference is biological hardware, the theory cannot label Perceiver B as having "bad taste" without implying their biology is defective. The theory must decide if the "Standard of Taste" is anchored to a specific human neurology. If it is, Perceiver B is excluded from the reference class. If it isn't, the claim to universality (Desideratum 1) is threatened.
  *   **Verdict:** The theory must define the "human" in "human nature" narrowly enough to ground norms but broadly enough to avoid ableism.

  **Case 2: The Radical Novelty**
  *   **Scenario:** A genuinely new art form emerges (e.g., the first film, the first algorithmic generation) that violates all existing category rules. Existing standards deem it "not art" or "broken."
  *   **Demand on Theory:** The theory must allow for the *evolution* of the standard without making the standard arbitrary. If the standard is static, it rejects the new form (Community Error). If the standard changes instantly to accommodate it, the standard is vacuous. The theory needs a mechanism for "legislating without a rule"—explaining how a new form creates its own normativity that retroactively adjusts the standard.
  *   **Verdict:** The theory must be dynamic. It must treat the standard as a trajectory, not a fixed point.

  **Case 3: The Deadlocked Jury**
  *   **Scenario:** A jury of five ideal critics (per the theory's definition) deliberates. Three vote for Work A, two for Work B. They have exhausted all argument; no new evidence exists. They are not biased; they are not tired. They simply diverge.
  *   **Demand on Theory:** The theory must prescribe a resolution.
      *   *Option A (Defer):* Does the theory identify a "chief" critic? (Violates equality of ideal critics).
      *   *Option B (Aggregate):* Does it accept the majority vote? (Implies truth is democratic, risking Desideratum 6).
      *   *Option C (Suspend):* Does it demand no prize be given? (Violates Desideratum 7).
  *   **Verdict:** The theory must prioritize *procedural legitimacy* over *ontological certainty* in cases of undecidability. It must tell the jury that awarding the prize by lot or majority is consistent with the standard, provided the deliberation was rigorous.

  ---

  #### III. Conflicts and The Killer Requirement

  **Incompatible Desiderata**
  There is a fundamental tension between **Desideratum 1 (Claim to Universality)** and **Case 1 (Neuro-Divergent Perceivers)**.
  *   If taste claims universal assent, Perceiver B (who finds the work grating) is making an error.
  *   If the cause is hard-wired neurology, calling it an "error" implies their nervous system is malfunctioning relative to the aesthetic norm.
  *   To save Universality, the theory must exclude Perceiver B from the class of valid judges. To save Inclusivity, the theory must abandon Universality. You cannot have a universal standard that admits biologically incompatible perceptual experiences as equally valid.

  **The Killer Requirement**
  The single requirement that eliminates the most contenders is **Desideratum 4 (The Non-Circular Expert)**.
  *   Most theories fail here. They define the Ideal Critic as "one who perceives the true value." But "true value" is defined as "what the Ideal Critic perceives."
  *   To satisfy the Jury Standard, the theory must list qualifications (sensory acuity, practice, comparative knowledge, freedom from prejudice) that are *independent* of the verdict.
  *   Hume attempts this but struggles when Ideal Critics diverge. Kant avoids it by making the critic a transcendental structure rather than a person, which fails the Jury Standard (you cannot appoint a transcendental structure to a panel). Expressivists fail entirely, as they deny the normative authority of the expert.

  ---

  #### IV. Evaluation of Theoretical Families

  **1. The Humean Family (Ideal Critic)**
  *   **Performance:** Strong on Desideratum 4 (qualifications of critics) and Desideratum 7 (practical guidance). It treats the standard as an empirical generalization of what qualified judges agree upon.
  *   **Failure Point:** Fails on **Case 1 (Neuro-Divergence)** and **Desideratum 5 (Faultless Disagreement)**. Hume assumes convergence among ideal critics. If two qualified critics diverge (Case 3), Hume has no recourse but to hope one is secretly prejudiced. It struggles to explain *why* they should converge without smuggling in an objective property of beauty.
  *   **Jury Viability:** High. It gives the jury a script: "We are the qualified, and this is our joint verdict."

  **2. The Kantian Family (Universal Subjectivity)**
  *   **Performance:** Strongest on **Desideratum 1 (The Antinomy)**. It perfectly explains why we feel universal claim from subjective ground (the free play of faculties). Strong on **Desideratum 6 (Community Error)** (the community may be hindered by concepts/interest).
  *   **Failure Point:** Fails **Desideratum 7 (Action-Guidance)**. Kant's standard is transcendental, not empirical. You cannot verify if someone is in a state of "free play." It offers no procedure for a jury to verify who is judging disinterestedly. It also struggles with **Case 2 (Radical Novelty)** as it relies on existing cognitive faculties that may not engage with the new form.
  *   **Jury Viability:** Low. It justifies the feeling of the verdict but offers no method to adjudicate disputes between jurors.

  **3. The Dispositional/Expressivist Family**
  *   **Performance:** Strong on **Case 1 (Neuro-Divergence)**. It accepts that different constitutions yield different responses without labeling one "false."
  *   **Failure Point:** Catastrophic failure on **Desideratum 2 (Normativity of Error)** and **Desideratum 4 (Non-Circular Expert)**. If taste is just an expression of sentiment or a disposition to react, one cannot say a taste is "corrupt" or "immature," only "different." It cannot defend a verdict to the losers except by saying "We felt more strongly." It collapses into the poll of preferences the prompt forbids.
  *   **Jury Viability:** None. It dissolves the authority of the jury.

  **Conclusion**
  An adequate theory must be Humean in its *procedure* (identifying qualified judges) but must solve the Humean problem of divergence. It must accept that the "Standard" is not a discovery of a property, but the maintenance of a practice. The "Killer Requirement" (Non-Circular Expert) forces the theory to ground authority in *process* (attention, comparison, history) rather than *outcome*. If it cannot do that, it cannot seat a jury.
