answer: |-
  Here is the spec sheet for a theory of intelligence, stripped of the case-by-case bickering. This is not a definition of intelligence, but a list of constraints any definition must satisfy to be theoretically viable.

  ### I. The Desiderata (The Spec Sheet)

  An adequate theory of intelligence must satisfy five core constraints. If it fails one, it is either too narrow (biological chauvinism), too broad (panpsychism/thermostat problem), or empirically unfalsifiable.

  **1. Extensional Adequacy (The "Paradigm Case" Constraint)**
  The theory must classify the uncontroversial cases correctly without ad-hoc adjustments.
  *   **Must Include:** Typical adult humans, children developing normally.
  *   **Must Exclude:** Rocks, thermostats, simple reflex loops (e.g., a moth to a flame).
  *   **The Borderline Test:** It must provide a principled reason for where it places the slime mold, the ant colony, and the LLM. It cannot simply assert "brains are required" (begging the question) or "optimization is sufficient" (including thermostats).

  **2. Dissociation Compatibility (The "Brain Injury" Constraint)**
  The theory must accommodate the fact that cognitive abilities can come apart.
  *   **Requirement:** It must explain how an agent can lose the ability to recognize faces (prosopagnosia) or do arithmetic (acalculia) while retaining other reasoning capacities, *and* simultaneously explain why performance on disparate tasks often correlates (the $g$-factor/positive manifold).
  *   **Failure Mode:** A theory that posits intelligence as a single, indivisible "fluid" fails to account for modularity. A theory that posits intelligence as *only* a collection of unrelated modules fails to account for transfer learning and $g$.

  **3. Normative Depth (The "Chinese Room" Constraint)**
  The theory must distinguish between *simulating* intelligence and *possessing* the capacity for it.
  *   **Requirement:** It must differentiate between a system that outputs the right answer via lookup table (or massive statistical correlation) and a system that outputs the right answer via causal reasoning or model-based inference.
  *   **Failure Mode:** Pure behaviorism fails here (it cannot distinguish the savant from the calculator). Pure internalism fails here (it becomes unmeasurable).

  **4. Substrate Neutrality vs. Embodiment (The "Hardware" Constraint)**
  The theory must decide if the physical medium matters.
  *   **Requirement:** It must either justify why biology is essential (embodied cognition) or provide a functional definition that applies to silicon, slime, or society (computational functionalism).
  *   **Failure Mode:** If you demand biology, you cannot account for AI. If you demand functionalism, you struggle to explain why framing effects and physical fatigue alter "intelligence" in humans but not in code.

  **5. Dynamic Generalization (The "Novelty" Constraint)**
  The theory must account for the ability to handle out-of-distribution problems.
  *   **Requirement:** It must distinguish between *caching* (memorizing solutions) and *generalizing* (deriving solutions). This is the core of your friend's debate: the slime mold solves the maze (optimization), but can it solve a maze it has never encountered with a new physical constraint?
  *   **Failure Mode:** A theory that defines intelligence as "maximizing reward" includes evolution itself. A theory that defines it as "handling novelty" risks making intelligence impossible to measure (since you can't test for every novelty).

  ---

  ### II. The Hard Cases (The Test Suite)

  Your theory must be able to process these inputs without crashing.

  1.  **The Slime Mold / Ant Colony:** Tests **Collective vs. Individual**. Is intelligence a property of the agent or the system? If the theory requires a "self-model," colonies fail. If it requires "adaptive optimization," thermostats pass.
  2.  **The Calculator / Chess Engine:** Tests **Breadth vs. Depth**. High performance in a closed domain. A theory must explain why beating Kasparov is "intelligent" but a calculator is "mere computation," or admit the distinction is arbitrary.
  3.  **The Savant:** Tests **Modularity**. Extreme ability in one domain with deficits in others. Challenges the idea of intelligence as a general capacity.
  4.  **The LLM (Trained on Benchmarks):** Tests **Goodhart's Law**. If a system aces every test because it has seen the training data, is it intelligent? The theory must distinguish *competence* from *overfitting*.
  5.  **The Two Humans (Same Score, Different Process):** Tests **Equifinality**. One understands the principle; the other memorized the pattern. Behaviorally identical, cognitively distinct.
  6.  **The Framing Effect:** Tests **Stability**. The same model fails a logic task when framed as a social contract and passes it when framed abstractly. Intelligence cannot be a fixed scalar if it fluctuates with presentation.

  ---

  ### III. Genuine Requirements vs. Camp Prejudices

  You need to separate what the theory *needs* from what your friends *want*.

  | Requirement | Verdict | Why |
  | :--- | :--- | :--- |
  | **"Must have a brain"** | **Prejudice** | Biological chauvinism. Rules out AI a priori. |
  | **"Must be conscious"** | **Prejudice** | Conflates intelligence with sentience. A zombie could theoretically solve the maze. |
  | **"Must handle novelty"** | **Genuine** | Without this, intelligence is just complex reflex. |
  | **"Must be measurable"** | **Genuine** | Without this, it's philosophy, not science. |
  | **"Must be substrate neutral"** | **Debatable** | Functionalism demands it; Embodied Cognition denies it. |
  | **"Must maximize goals"** | **Prejudice** | Defines intelligence as rationality. Ignores epistemic curiosity (solving puzzles with no reward). |
  | **"Must distinguish fake from real"** | **Genuine** | Essential to avoid the "lookup table" problem. |

  **The Single Requirement That Knocks Out The Most Theories:**
  **The Competence/Performance Distinction.**
  Any theory that equates intelligence directly with *success* (solving the maze, winning the game) is destroyed by the luck/complexity problem. Any theory that equates it directly with *internal capacity* is destroyed by the measurement problem. A theory must posit a latent capacity that *tends* toward success but is distinct from any single outcome. This kills pure behaviorism and pure nativism simultaneously.

  ---

  ### IV. Where The List Eats Itself (The Impossibility Theorems)

  You asked for the fault lines where the requirements become jointly unsatisfiable. There are three specific tensions where a theory must choose a poison pill.

  #### 1. The Psychometric Paradox ($g$ vs. Modularity)
  *   **Demand A:** The theory must explain the **Positive Manifold** (why people who are good at vocab are usually good at spatial rotation, implying a single $g$ factor).
  *   **Demand B:** The theory must explain **Dissociation** (why brain injury or savant syndrome can destroy one ability while leaving others intact, implying distinct modules).
  *   **The Conflict:** You cannot have a theory where intelligence is a *single, unitary causal force* and also a *collection of independent processors*.
  *   **The Cost:** To satisfy A, you must treat modularity as an illusion of measurement. To satisfy B, you must treat $g$ as a statistical artifact. Most theories pick one and explain away the other.

  #### 2. The Epistemic Trap (Behavior vs. Mechanism)
  *   **Demand A:** The theory must be **Operationalizable** (based on observable input/output, like a Turing Test or benchmark).
  *   **Demand B:** The theory must distinguish **Understanding from Simulation** (the "Two Humans" case where one pattern-matches and one "gets it").
  *   **The Conflict:** If you restrict evidence to behavior (Demand A, for scientific rigor), you logically *cannot* distinguish a lookup table from a reasoning engine (Demand B). If you demand access to internal mechanisms to satisfy B, you violate A (you can't measure the mechanism of an LLM or a slime mold easily).
  *   **The Cost:** You must either accept that "understanding" is unscientific (unmeasurable) or accept that "perfect mimicry" counts as intelligence (behaviorism).

  #### 3. The Generality Trade-off (Stability vs. Context)
  *   **Demand A:** Intelligence must be a **Stable Trait** (you are smarter than me, generally).
  *   **Demand B:** Intelligence must be **Context-Sensitive** (performance depends heavily on framing, culture, and embodiment).
  *   **The Conflict:** If intelligence is highly sensitive to framing (as cognitive science shows), it cannot be a stable scalar quantity. If it is a stable quantity, framing effects should be negligible noise, not systemic features.
  *   **The Cost:** You must either treat context effects as "error variance" (ignoring the reality of cognition) or abandon the idea of IQ/ranking entirely (making comparison impossible).

  ### V. The Verdict for Your Paper

  The subset of requirements that is **jointly unsatisfiable** is:
  1.  **Strict Behaviorism** (Evidence must be observable input/output).
  2.  **Realist Semantics** (Theory must distinguish real understanding from syntactic manipulation).
  3.  **Substrate Neutrality** (Theory must apply to brains and machines equally).

  **Why:** If you are substrate neutral and strictly behavioral, you cannot distinguish the "real understanding" human from the "syntactic manipulation" machine (or the slime mold), because their outputs are identical. To distinguish them, you must either look inside (violating Behaviorism) or privilege biology (violating Substrate Neutrality).

  **Recommendation:**
  Your friend (Slime Mold) is prioritizing **Adaptive Success** (Demand 1 & 5) and **Substrate Neutrality**.
  Your reading group (Cognitive Science) is prioritizing **Normative Depth** (Demand 3) and **Generalization** (Demand 5).

  Neither can win because they are optimizing for different constraints on the spec sheet. The "impossibility" lies in trying to create a *single scalar metric* (like IQ or "Intelligence Quotient") that satisfies all these constraints simultaneously. The theory you are looking for does not exist because the desiderata describe a **multidimensional vector**, not a point.

  If you need a killer line for the paper: *"A theory of intelligence that satisfies the requirement for operational measurement necessarily fails the requirement for normative depth, while a theory that satisfies normative depth necessarily retreats from empirical falsifiability."*
