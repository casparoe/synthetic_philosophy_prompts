      *   **Goal:** The user wants a "spec sheet" or a set of *desiderata* for a theory of intelligence. They want to know what an adequate account *must* deliver, which cases it must handle, which distinctions must be maintained, and which empirical results it must accommodate.
      *   **Critical Constraint:** The user specifically asks to identify where the list "eats itself" (i.e., where requirements are mutually exclusive or jointly unsatisfiable). They suspect a tension between "single measurable quantity" vs. "abilities come apart" or "tell apart from clever fake" vs. "only behavior allowed."
      *   **Tone:** Academic, rigorous, skeptical, meta-cognitive. Avoid taking sides in the slime mold vs. cognitive science debate. Focus on the *structure* of the theory itself.
