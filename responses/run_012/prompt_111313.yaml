  5.  **Address the "Eat Itself" Constraint (The Impossibility Theorems):**
      *   *The User's Suspicion:* "Single measurable quantity" ($g$) vs. "Abilities dissociate" (Modularity).
      *   *The Behaviorist Trap:* "Only behavior is evidence" vs. "Must distinguish real understanding from simulation."
      *   *The Generality Trap:* "Must handle novelty" vs. "Must be grounded in past experience/evolution."
      *   *The Substrate Neutrality Trap:* "Must apply to any physical system" vs. "Must capture biological specificity (embodiment)."

  6.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the stalemate. Validate the request for a spec sheet.
      *   **Part 1: The Desiderata (The Spec Sheet):** Group these logically.
          *   *Extensional Coverage:* Must get the paradigm cases right.
          *   *Mechanism/Process:* Must explain *how*, not just *that*.
          *   *Normative Depth:* Must distinguish luck/simulation from competence.
          *   *Scalability/Substrate:* Biology vs. Silicon vs. Collective.
          *   *Dynamic Adaptation:* Handling novelty vs. efficiency.
      *   **Part 2: The Hard Cases (The Test Suite):** List the specific examples the user mentioned and what they test.
      *   **Part 3: Genuine Requirements vs. Camp Prejudices:** This is crucial. Differentiate between what a theory *needs* to do vs. what one side *wants* it to do.
          *   *Prejudice:* "Must have a brain" (Biological Chauvinism).
          *   *Prejudice:* "Must be conscious" (Phenomenal Requirement).
          *   *Requirement:* "Must predict transfer" (Generalization).
      *   **Part 4: The Impossibility Theorems (Where the List Eats Itself):** This is the core value add.
          *   *Tension 1: The $g$-Factor vs. Modularity.* (Psychometric unity vs. Neuropsychological dissociation).
          *   *Tension 2: Behaviorism vs. Realism.* (Operational definition vs. Internal mechanism).
          *   *Tension 3: Substrate Neutrality vs. Embodiment.* (Abstract computation vs. Physical interaction).
      *   **Conclusion:** Summarize the "killer constraint."

  7.  **Refining the "Impossibility" Argument:**
      *   The user specifically asked about "single measurable quantity" vs "abilities come apart." This is the *Psychometric Paradox*. A theory must explain why $g$ exists statistically while acknowledging that brain damage can wipe out specific abilities without wiping out "general" intelligence entirely, or vice versa.
      *   The user also asked about "clever fake" vs "only behavior." This is the *Underdetermination Problem*. If you restrict evidence to input/output, you cannot logically distinguish a lookup table from a reasoning engine (Gödel/Chinese Room implications).
      *   *Decision:* I need to highlight that satisfying *Extensional Adequacy* (classifying cases correctly) often conflicts with *Operationalizability* (measuring it without looking inside).

  8.  **Review against Constraints:**
      *   *Brief scoring of existing theories?* Yes, keep it minimal or non-existent. Focus on the list.
