  2.  **Deconstruct the Desiderata (What must a theory do?):**
      *   *Extensional Adequacy:* It needs to classify the "obvious" cases correctly (humans are intelligent, rocks are not).
      *   *Intensional Adequacy:* It needs to explain *why* (mechanism/property), not just list examples.
      *   *Scalability:* It needs to handle individuals, collectives (ants), and non-biological systems (AI).
      *   *Normativity:* It needs to distinguish between *actually* solving a problem and *looking like* you solved it (Chinese Room/Behaviorism issue).
      *   *Generalization:* It needs to account for transfer learning (handling novelty).
