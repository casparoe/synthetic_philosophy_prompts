answer: |-
  Friends, faculty, families, and the graduating class.

  Standing here, I am aware of the weight of the occasion. You are being sent off with blessings, usually framed as open roads and blank slates. But I work in a field that studies how things actually get made, how knowledge accumulates, and how credit is assigned. So I want to offer you a different image of the future. It is not a blank slate. It is more like a room where the furniture is already arranged, but there is still space for you to move the chairs.

  In my research, I study moments when two people make the same discovery at the same time. Historians often call this simultaneous discovery, and the usual lesson is one of humility. We are told that the discovery was inevitable, that it was hanging in the air, waiting for anyone with the right tools to grab it. The implication is that the individual genius matters less than the zeitgeist. If Newton had not been born, someone else would have written the *Principia*. If Darwin had stayed on the boat, Wallace would have published the theory.

  I want to suggest that this lesson is half-true, and that the half which is false is the part that matters most for you.

  To see this, we need to look closely at the most famous pair in the history of science: Isaac Newton and Gottfried Wilhelm Leibniz. In the late seventeenth century, both men developed the calculus. For a long time, the story was simplified into a race. But the reality is more interesting. The occurrence of the discovery does look overdetermined. By the 1670s, mathematicians across Europe were struggling with problems of tangents and areas. The methods were maturing. The questions were being asked in Paris, in London, in Hanover. Given the state of the field, it is highly probable that the calculus would be formulated within that decade.

  However, we must be careful. The bare fact that two people arrived at something independently is not self-evident evidence of inevitability. In both canonical pairs, the parties were in contact, corresponding, sometimes through the same intermediary, which is precisely why the independence is itself disputed among historians. The real evidence for inevitability is convergence from different starting points: different problems, different formalisms, the same result. Newton was working from physics, thinking about quantities generated by motion. Leibniz was working from logic and geometry, thinking about sums and differences. They started in different rooms of the house and arrived at the same door.

  My colleague warns that calling something inevitable is just storytelling after the fact. I answer that inevitability lies not in the outcome we know, but in the structural pressures visible at the time.

  Here is where the standard story fails. It assumes that because the discovery was bound to be made, it was bound to take the form it took. This does not follow. Newton and Leibniz did not write the same mathematics. Newton's calculus was geometric. He thought in terms of fluxions, of things flowing and changing over time. It was tied intimately to his physics, a tool for describing the motion of bodies. It was powerful, but it was heavy. It required you to visualize the motion.

  Leibniz's calculus was algorithmic. He invented a notation. He gave us the elongated S for integration, the d for differentiation. He turned calculus into a set of operations you could carry out almost mechanically, without needing to visualize the physical motion at every step. He made it a language. And it is his notation that the following century mostly wrote in. If you open a calculus textbook today, you are writing Leibniz, not Newton.

  This distinction is vital for you. The first claim—that the work was bound to be done—suggests that you are interchangeable. It suggests that if you do not solve the problem, someone else will, and it will not matter. The second claim—that the work was bound to look this way—suggests that your specific contribution is irrelevant. Both are false. The problem may have been ripe for solving, but the solution was not fixed. The form of the answer depended on who was answering. Leibniz's specific insight was not just the result, but the notation. He changed how future generations thought about change itself.

  You are about to enter fields where problems feel urgent. You may feel that the work is already waiting for you, or worse, that it is already being done by someone else. It is true that some discoveries are bound to be made by someone, more or less when they are made. Given the state of the field, the methods at hand, and the questions everyone was already asking, the move was in the air. But it is not true that the discovery was bound to take the form it took, that its content would have been the same whoever arrived first.

  This brings me to a harder truth. I cannot promise you that merit is rewarded. In the calculus priority dispute, the outcome was not decided by who was right, or even by whose notation was better. It was decided by power, by nationality, by committees. The dispute was bitter. Accusations of plagiarism were flown. The Royal Society weighed in. One party lost, in the sense that he died embittered, his reputation attacked, his claim denied in his own lifetime. There are people in this audience who are about to come second. There are people who will do the work and see someone else take the credit. There are people whose contributions will be absorbed into the background noise of a field that moves too fast to stop for acknowledgments.

  If I told you that the future belongs to you, I would be lying. If I told you that hard work guarantees recognition, I would be setting you up for a fall. The history of science is a graveyard of priority disputes where the victor was not necessarily the one with the better idea, but the one with the louder voice or the better network.

  But here is what remains. Leibniz's notation survived. Not because he won the argument, but because the work itself was usable. The form he gave the mathematics allowed others to build on it. He made the thinking easier for everyone who came after. That is the leverage you have. You cannot control whether you are the first. You cannot control whether the committee recognizes your contribution. You cannot control whether the discovery was inevitable.

  You can control the form. You can control the quality of the tool you leave behind. You can control whether your work makes the next step easier for the person who follows you. Even if the occurrence of the discovery was bound to happen, the content is not. Your specific perspective, your specific way of framing the problem, your specific notation—that is not interchangeable.

  So, do not worry about whether you are the first. Worry about whether you are clear. Do not worry about whether the problem was waiting for you. Worry about whether you have solved it in a way that lets others stand on your shoulders. The work may be inevitable, but the workmanship is yours. Go and make it something that lasts.
