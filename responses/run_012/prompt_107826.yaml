      *Refining the "Isomorphism" argument:* Sam is right about framing. But Jamie is right that for *bots*, we might be able to enforce isomorphism (code-level equivalence) even if humans fail it. If the bots are open-source or verifiable, isomorphism is mathematical, not psychological. *Wait, the prompt says "strangers".* If the strangers are humans, Sam wins. If the strangers are other bots, Jamie has a stronger case. I should distinguish this.

