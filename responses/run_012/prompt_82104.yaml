prompt: |-
  I'm in my third year, and this term I'm taking a metaethics course while also working through a formal semantics course, so I have a reasonable command of truth-conditional compositional semantics — denotations, types, functional application, connectives as functions on propositions, and context-sensitivity handled by a character/content split. I want to use the second to get a grip on the first, and I'd rather you do the translating than summarise what other people have said about it.

  Please restate the Frege–Geach problem for expressivism in the vocabulary of formal semantics, as faithfully as you can, and then give me a residue report. By restate I mean: put expressivism in terms of what expressions denote and what types they carry, say how the connectives would have to be typed for composition to proceed, and show precisely where the derivation stalls. Then tell me what does not survive the translation: which parts of the expressivist position have no counterpart in the semantic vocabulary at all, which can be stated only by quietly altering their content, and, for each, whether the failure is a structural limitation of the framework — it cannot represent that, whatever you add — or a sign that the original claim was less clear than it looked.

  I'd like you to test a scheme of my own rather than only rehearsing the standard options. My proposal: treat a moral predicate as a function from contexts to attitudes rather than to properties, so that the content of a sentence like 'tormenting animals for fun is wrong' is the attitude of disapproval itself, and then ask what 'not', 'if', and 'or' would have to denote for composition to be possible. Is that a coherent semantics? Where does it break first — negation, the unasserted antecedent of a conditional, or the account of validity? And in the inference from 'tormenting animals for fun is wrong' and 'if tormenting animals for fun is wrong, then paying someone to do it is wrong' to 'paying someone to do it is wrong', is the relation between premises and conclusion the one the semantics assigns to entailment, or a different relation I would have to stipulate by hand? If my scheme is a dead end, give me the best available translation and tell me what it costs. One alternative worth considering on the way: treating the attitude as a presupposition rather than as content, so that the embedding facts become a projection problem — does that help, or does it merely relocate the difficulty?

  Close with a verdict rather than a survey: once translated, does expressivism come out as a substantive thesis about meaning, or as a thesis about use that this vocabulary cannot state and that has been masquerading as a thesis about content? Please skip the citations and reading list — I want the reconstruction judged on its own.
