answer: |-
  ### I. Formal Restatement of the Frege–Geach Problem

  To translate the Frege–Geach problem into formal semantics, we must specify the denotations and types required for compositional derivation and identify the type mismatch that prevents it.

  **1. The Standard Truth-Conditional Baseline**
  In your semantics course, you treat a declarative sentence $\phi$ as denoting a proposition.
  *   **Types:** $e$ (entities), $t$ (truth values), $s$ (worlds/indices).
  *   **Sentence Denotation:** $[\![ \phi ]\!]^{c, w} \in \{0, 1\}$.
  *   **Proposition:** $[\![ \phi ]\!]^c = \lambda w . [\![ \phi ]\!]^{c, w}$, type $\langle s, t \rangle$.
  *   **Connectives:** Functions on truth values or propositions.
      *   $[\![ \text{not} ]\!] = \lambda p_{\langle s,t \rangle} . \lambda w . \neg p(w)$. Type: $\langle \langle s,t \rangle, \langle s,t \rangle \rangle$.
      *   $[\![ \text{if} ]\!] = \lambda p_{\langle s,t \rangle} . \lambda q_{\langle s,t \rangle} . \lambda w . p(w) \to q(w)$. Type: $\langle \langle s,t \rangle, \langle \langle s,t \rangle, \langle s,t \rangle \rangle \rangle$.
  *   **Validity:** $\Gamma \models \psi$ iff $\forall c, w$: if $\forall \gamma \in \Gamma, [\![ \gamma ]\!]^{c, w} = 1$, then $[\![ \psi ]\!]^{c, w} = 1$.

  **2. The Expressivist Translation (Your Proposal)**
  You propose treating moral predicates as functions from contexts to attitudes. Let $\alpha$ be the type of *Attitudes* (e.g., Disapproval, Approval).
  *   **Moral Predicate:** $[\![ \text{wrong} ]\!] = \lambda x_e . \lambda c_s . \text{Disapproval}(c, x)$. Type: $\langle e, \langle s, \alpha \rangle \rangle$.
  *   **Moral Sentence:** $[\![ \text{Tormenting is wrong} ]\!]^c = \text{Disapproval}(c, \text{Tormenting})$. Type: $\alpha$.
  *   **The Claim:** The semantic content of a moral sentence *is* an attitude (type $\alpha$), not a truth condition (type $\langle s, t \rangle$).

  **3. The Derivation Stall**
  The Frege–Geach problem arises when we attempt to compose complex moral sentences using standard Boolean connectives.

  *   **Negation:** Consider "Tormenting is not wrong."
      *   Input: $[\![ \text{Tormenting is wrong} ]\!]^c$, which is of type $\alpha$ (an attitude).
      *   Required Operator: $[\![ \text{not} ]\!]$ must be of type $\langle \alpha, \alpha \rangle$.
      *   **The Stall:** What function maps the attitude *Disapproval* to the semantic value of *not wrong*?
          *   If it maps Disapproval to *Approval*, you have changed the subject (contrary vs. contradictory).
          *   If it maps Disapproval to *Absence of Disapproval*, you cannot iterate negation ("not not wrong") coherently without collapsing back into Approval.
          *   Crucially, standard negation is defined on truth values ($\neg: \langle t, t \rangle$). There is no logical negation defined on mental states. You must stipulate a new algebra of attitudes, but this algebra does not inherit the logical properties of Boolean negation (e.g., double negation elimination) automatically.

  *   **Conditionals:** Consider "If tormenting is wrong, then paying is wrong."
      *   Input: Antecedent $[\![ \phi ]\!]^c$ (type $\alpha$), Consequent $[\![ \psi ]\!]^c$ (type $\alpha$).
      *   Required Operator: $[\![ \text{if} ]\!]$ must be of type $\langle \alpha, \langle \alpha, \alpha \rangle \rangle$.
      *   **The Stall:** In standard semantics, the antecedent of a conditional is *not asserted*. It contributes a truth condition, not a fact. In your scheme, the antecedent denotes an *attitude*.
      *   To compute the denotation of the conditional, the semantics must evaluate the antecedent attitude. This implies that to understand the conditional, the agent must *actually hold* the attitude of disapproval toward tormenting. This is empirically false: one can grasp the conditional without disapproving of tormenting.
      *   If you modify the semantics so the antecedent denotes a *hypothetical* attitude, you have reintroduced a propositional structure (a condition on attitudes), which contradicts the claim that the content *is* the attitude itself.

  *   **Validity:** Consider Modus Ponens.
      *   Premise 1: $[\![ \phi ]\!]^c = \text{Disapproval}(\phi)$.
      *   Premise 2: $[\![ \phi \to \psi ]\!]^c = \text{ComplexAttitude}(\phi, \psi)$.
      *   Conclusion: $[\![ \psi ]\!]^c = \text{Disapproval}(\psi)$.
      *   **The Stall:** Standard validity is preservation of *truth*. Your scheme offers preservation of *attitudes*. There is no guarantee that holding Disapproval($\phi$) and ComplexAttitude($\phi, \psi$) necessitates holding Disapproval($\psi$) unless you define ComplexAttitude specifically to force it.
      *   If you define it to force it, you are stipulating psychological consistency, not logical entailment. The relation between premises and conclusion is not the semantic entailment relation ($\models$) defined by your model theory; it is a separate, stipulated relation of *attitude coherence*.

  ### II. Residue Report

  Here is what survives the translation and what is lost.

  **1. What Does Not Survive (The Residue)**
  *   **The Normative Force:** Expressivism claims moral judgments *are* practical states (guiding action). In formal semantics, denotations are inert objects in a model. An "attitude object" in the model is not itself a guide to action; it is merely a representation of one. The *force* is lost in the denotation.
  *   **The Distinction between Truth and Accuracy:** Expressivists often want to say moral sentences aren't "true" but are "appropriate" or "correct." Formal semantics has no type for "appropriateness." It has $t$ (true/false). To translate "appropriate," you must map it to $1$ (true), which surrenders the expressivist claim that moral sentences lack truth conditions.
  *   **The Unasserted Context:** As noted in the conditional stall, the framework cannot represent an attitude *without* the speaker holding it. The framework assumes that to denote $X$ is to present $X$ as obtaining. It cannot easily represent "X as hypothetical."

  **2. Structural Limitation vs. Lack of Clarity**
  *   **Structural Limitation:** The framework is built on **truth conditions**. It is model-theoretic. It defines meaning as conditions under which a sentence matches the world. Expressivism defines meaning as conditions under which a sentence matches the *mind*. You can build a model-theoretic semantics for mental states, but you cannot make them behave like truth values without losing the distinction between *representing the world* and *expressing the mind*. The framework cannot represent "use" as anything other than "content."
  *   **Lack of Clarity:** The expressivist claim that "content is the attitude" is revealed to be imprecise. It conflates the *semantic value* (what contributes to the truth conditions of complex sentences) with the *illocutionary force* (what the speaker does in uttering the sentence). The translation shows that if the attitude is the semantic value, it must behave compositionally like a truth value, which attitudes do not.

  ### III. Testing Your Scheme

  **Is it a coherent semantics?**
  No. It is a typed lambda calculus with no interpretation rules for the base types. You have assigned type $\alpha$ to sentences, but you have not provided a logic for $\alpha$. Without a logic for $\alpha$ that mirrors classical logic (which is defined on $t$), you cannot explain validity.

  **Where does it break first?**
  It breaks at **Negation**, but the fatal blow is **Validity**.
  *   *Negation:* You can stipulate a function $f: \alpha \to \alpha$ and call it "not." It is ad hoc, but formally possible.
  *   *Validity:* You cannot derive Modus Ponens. In standard semantics, MP works because of the meaning of $\to$ and $\text{true}$. In your scheme, MP works only if the "Attitude-Conditional" psychologically compels the conclusion. But people are logically valid even when psychologically inconsistent. A semantics must explain why the inference is *correct*, not why a rational agent *feels* compelled. Your scheme makes logic empirical (psychology) rather than formal.

  **Is the relation entailment?**
  No. It is a different relation you must stipulate by hand. Let's call it $\models_{\text{att}}$.
  *   $\Gamma \models_{\text{att}} \psi$ iff it is psychologically inconsistent to hold the attitudes denoted by $\Gamma$ without holding the attitude denoted by $\psi$.
  *   This fails because logic is normative, psychology is descriptive. I can be logically valid while being psychologically inconsistent (I make mistakes). Your semantics conflates the *standard of correctness* with the *state of the agent*.

  ### IV. The Presupposition Alternative

  **The Proposal:** Treat the attitude as a presupposition.
  *   $[\![ \text{Wrong}(x) ]\!]^{c, w}$ is defined only if $c$ supports Disapproval($x$).
  *   If defined, it returns a truth value (say, 1).
  *   **Embedding:** Presuppositions project. "If Wrong(x)..." presupposes Disapproval($x$).

  **Does this help?**
  It solves the **compositionality** problem. Since the asserted content is now truth-conditional (type $\langle s, t \rangle$), Boolean connectives work normally. The Frege-Geach problem vanishes because moral sentences now have truth conditions.

  **Does it relocate the difficulty?**
  Yes, fatally for the expressivist.
  1.  **It Abandons Expressivism:** Core expressivism denies that moral sentences describe facts (have truth conditions). This scheme grants them truth conditions. It turns expressivism into a form of **Cognitivism with Pragmatic Constraints**.
  2.  **The Projection Problem becomes a Bug:** If "If tormenting is wrong..." presupposes I disapprove of tormenting, then I cannot utter that conditional unless I already disapprove. This is the same error as the "Attitude-as-Content" scheme. It makes the attitude a *felicity condition* on the utterance, not part of the *meaning* of the embedding.
  3.  **Loss of Normativity:** If the content is just "True," where is the "Ought"? The presupposition carries the attitude, but presuppositions are typically taken to be backgrounded, common ground. Moral claims are often *contested*. Treating them as presuppositions implies they are already accepted by the context, which fails to capture the argumentative nature of ethics.

  **Verdict on Alternative:** It saves the semantics by killing the expressivism. It shows that to make moral language compose, you must give it truth-conditional content.

  ### V. Verdict

  Once translated into the vocabulary of formal semantics, expressivism emerges not as a substantive thesis about **meaning** (semantic content), but as a thesis about **use** (illocutionary force) that has been masquerading as a thesis about content.

  **The Argument:**
  1.  **Semantics requires Composition:** To explain how "not," "if," and "or" work, semantic values must be of a type that these operators can take as input.
  2.  **Operators require Truth-Conditions:** The standard operators are defined on truth values ($t$). Any other type ($\alpha$) requires a bespoke logic that does not automatically yield standard validity.
  3.  **Expressivism requires Attitudes:** Expressivism insists the core value is an attitude ($\alpha$), not a truth condition ($t$).
  4.  **The Dilemma:**
      *   If you keep Attitudes as content, you lose Composition and Validity (your scheme fails).
      *   If you keep Composition and Validity, you must assign Truth Conditions as content (the Presupposition alternative fails expressivism).
  5.  **Conclusion:** The "meaning" of moral terms that allows them to embed logically *must* be truth-conditional. The "expressive" element—the disapproval, the normativity—cannot be the semantic content if the language is to be logical. Therefore, the expressive element must be located in the **pragmatics** (how the truth-conditional content is used), not the **semantics** (what the content is).

  **Final Judgment:**
  Expressivism is a thesis about **force**. It claims that uttering a moral sentence *performs an act* of disapproval. Formal semantics is a theory of **content**. It tracks how denotations combine to determine truth conditions.
  Your attempt to translate force into content fails because **forces do not compose like contents**. You can combine two propositions to get a third proposition; you cannot combine two acts of disapproval to get a third act of disapproval in a way that mirrors logical implication.

  The Frege-Geach problem, in formal vocabulary, is the proof that **illocutionary force is not a semantic type.** Expressivism survives only if it retreats from semantics to pragmatics, admitting that moral sentences *have* truth conditions (allowing logic to work) but that their *primary function* is to express attitudes (preserving the expressivist insight). Without this retreat, the semantics stalls at the first connective.
