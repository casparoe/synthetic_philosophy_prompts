answer: |-
  You are not conflating concepts, and your hunch is correct: slapping the label "handicap principle" on foot-binding without adjusting for the specific mechanics is often theoretical hand-waving. However, if we tighten the definitions, the case becomes a fascinating stress test for **Cultural Costly Signaling Theory (CST)**, which is the sociological cousin of Zahavi's biological Handicap Principle (HP).

  Here is the breakdown of why the naive application fails, how a rigorous application works, and where the theory actually earns its keep regarding the practice's collapse.

  ### 1. The Theoretical Mismatch: Biological HP vs. Cultural CST

  Your intuition that the cost/payoff split breaks the story is right **if** we treat this as a biological Handicap Principle case.
  *   **Zahavi's HP:** The *individual* bearer of the trait pays the cost to signal their *own* genetic quality to a mate. The cost ensures honesty because low-quality individuals cannot survive the handicap.
  *   **Foot-binding:** The daughter bears the physiological cost (pain, disability), but the parents (specifically the patriarchal household) reap the socio-economic payoff (better marriage alliance, higher brideprice, social status).

  This is a **principal-agent problem**, not a straightforward individual signaling game. The daughter is not the signaler; she is the **medium**. The **household** is the signaler.

  Therefore, foot-binding is not a biological handicap; it is a form of **Veblenian Conspicuous Leisure** operationalized through costly signaling. The "honesty" of the signal does not come from the daughter's genetic ability to survive the pain (though endurance was part of the advertised "quality"), but from the household's ability to absorb the economic loss of her labor.

  ### 2. Running the Case Through the Model

  If we adjust the unit of analysis from the *individual* to the *household*, the signaling architecture holds up surprisingly well.

  **Who is the Signaler?**
  The parents/household. They make the investment decision.

  **Who is the Audience?**
  Primarily the groom's family (prospective in-laws) and secondarily the local community.

  **What Quality is Advertised?**
  1.  **Wealth (Exemption from Labor):** This is the big one. Bound feet prevent field work. A family that binds a daughter's feet signals: "We are wealthy enough that this woman does not need to contribute economically to our survival."
  2.  **Social Capital/Control:** It signals the family's ability to enforce long-term discipline and adherence to complex cultural norms.
  3.  **Female "Quality":** To the groom's family, it signaled the bride's obedience, endurance, and commitment to the patriarchal order (she accepts the constraints of her new household).

  **Does the Cost Fall on the Right Party? (The Honesty Condition)**
  For a signal to be honest, the marginal cost must be higher for low-quality types (poor families) than high-quality types (wealthy families).
  *   **Wealthy Family:** The cost is binding materials, potential medical risk, and the opportunity cost of the daughter's domestic (non-field) labor. This is affordable.
  *   **Poor Family:** The cost includes all the above *plus* the loss of critical agricultural labor. For a subsistence farmer, a daughter with bound feet is a net liability.
  *   **Result:** Poor families *could* physically bind feet, but they could not afford the economic signal. They would starve before the marriage payoff arrived. This satisfies the **differential cost requirement** of CST. The signal remains honest because the poor cannot fake it without ruin.

  **Your Hunch Validated:** You noted the cost lands on the daughter while the payoff lands on the parents. In strict biological HP, this breaks the model because the signaler must pay the cost. In **Cultural CST**, this is resolved because the "organism" being selected is the **lineage/household**, not the individual girl. The girl's body is capital invested by the parents.

  ### 3. Why This Mutilation? (Specificity)

  Does the theory explain why *this* signal and not just jewelry or clothes? Yes, via the **Index vs. Symbol** distinction.

  *   **Jewelry/Clothes:** These are **detachable**. A poor family could borrow jewelry for a marriage negotiation. It is easy to fake.
  *   **Foot-binding:** This is an **indexical signal** (like a peacock's tail). It is physically fused to the bearer. It is irreversible (in the short term) and requires years of maintenance.
  *   **The "Handicap" Aspect:** The pain and disability serve a specific function here: they prove **commitment**. Because the process begins in childhood (ages 5–7) and takes years to complete, it demonstrates a long-term investment strategy. A family unwilling to commit to a 10-year plan signals they are unstable or short-term oriented.

  The mutilation specifically targets **mobility**. In an agrarian society, mobility = labor potential. Destroying mobility is the most direct way to signal "we do not need labor."

  ### 4. The Collapse: Where the Theory Shines

  This is where Costly Signaling Theory actually does heavy lifting, explaining the speed of the collapse in the early 20th century better than simple "modernization" narratives.

  Signaling equilibria are stable only as long as the **audience values the signal**.

  **The Shift in Audience Value:**
  In the late Qing/early Republic, the definition of "High Quality" shifted.
  *   **Old Equilibrium:** Bound feet = Status, Han identity, Morality.
  *   **New Equilibrium:** Unbound feet = Modernity, Education, National Strength (anti-imperialism), Ability to contribute to the nation (female labor).

  **The Tipping Point:**
  CST predicts that when the cost of the signal outweighs the benefit, high-quality signalers will drop it first.
  1.  **Elite Defection:** As Western influence grew, the highest-status families (those with connections to foreign trade or new government roles) began to value "modern" wives. For them, bound feet became a *negative* signal (backwardness).
  2.  **Information Cascade:** Once the elites stopped binding, the signal value of bound feet inverted. It no longer signaled "wealth"; it signaled "old money" or "rural backwardness."
  3.  **Rapid Collapse:** Because signaling is a coordination game, once the threshold of elite defection was crossed, the value of the signal crashed. Poor families, who were binding feet *only* to mimic the rich for marriage prospects, stopped immediately because the ROI vanished.

  This explains the **speed**. It wasn't just that people became "more enlightened"; it's that the **exchange rate of the signal collapsed**. A poor family will endure the cost of binding only if it buys a good marriage. If the grooms stop wanting bound feet, the cost becomes pure waste. The practice didn't fade; it became economically irrational overnight.

  ### 5. Verdict

  You are right to be skeptical of the lazy "costly signaling" label.
  *   **Does Biological Handicap Principle explain it?** **No.** The cost/benefit split between daughter and parents violates the individual selection model.
  *   **Does Cultural Costly Signaling explain it?** **Yes,** provided you treat the household as the signaling unit and the practice as Veblenian conspicuous leisure.
  *   **Does it explain the specificity?** **Yes.** The irreversibility and labor-suppression nature make it a harder-to-fake signal than jewelry.
  *   **Does it explain the collapse?** **Yes.** It models the practice as a coordination equilibrium that shattered when the audience's valuation of the trait inverted.

  The foot-binding case doesn't break Costly Signaling Theory; it refines it. It shows that "costly signals" in human culture are often **imposed** rather than voluntary, and that the "organism" paying the cost is often the kin group, not the individual body. If someone tells you foot-binding is a "handicap principle" example without making those distinctions, they are indeed just moving on.
