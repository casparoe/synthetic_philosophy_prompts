answer: |-
  An adequate theory of concepts must navigate the tension between the fluidity of human cognition and the rigidity of scientific classification, and to do so it must deliver specific explanatory power regarding how we actually use terms rather than how we wish we used them. Any viable account must explain the phenomenon of typicality, where some instances feel more central to a category than others, such as why a robin is intuitively a better example of a bird than a penguin, despite both satisfying the biological criteria. It must explain how we sort novel instances without consulting a definition, recognizing a new gadget as a phone despite it lacking a keypad, and it must account for how we reason at all with a term that resists strict definition, allowing us to project properties from known instances to unknown ones. Furthermore, the theory must maintain critical distinctions that sloppy thinking often collapses. It must distinguish extension, which is the actual set of things the term applies to, from stereotype, which is the set of features we believe typical members possess, ensuring that a three-legged dog remains in the extension of dog even if it fails the stereotype. It must distinguish vagueness, where boundaries are inherently fuzzy, from open texture, where criteria remain open to revision in light of new discoveries, and it must distinguish resemblance, which implies a structured similarity, from mere disjunction, which is just an arbitrary list of unrelated items. Finally, the theory cannot contradict established empirical findings, specifically that children acquire categories at a basic level of granularity before mastering superordinates or subordinates, and it must accommodate the behavior of scientific classifications where categories are routinely revised on empirical grounds, such as genetic data overturning morphological grouping, yet are still used as though they cut nature at its joints.

  When evaluating these specifications, we must separate genuine requirements from the prejudices of competing camps. The demand that a concept must explain inductive inference and align with developmental acquisition is a genuine requirement grounded in how minds work, whereas the demand that all concepts must have sharp boundaries is a prejudice of logical formalism that ignores the reality of natural language. Similarly, the insistence that scientific revision proves all concepts are essentialist is a prejudice of realism that ignores the psychological machinery used to access those essences. The single requirement that does the most to eliminate candidates is the demand to explain inductive inference, or how we project unobserved properties from a category to an instance. Pure resemblance theories fail here because similarity alone does not justify prediction; knowing something looks like a tiger does not logically guarantee it will roar unless there is a underlying structure supporting that expectation. Classical definitional accounts also struggle here if the definition is merely descriptive, as they cannot account for why we project properties not listed in the definition. However, the most critical tension lies in the pair of requirements that I suspect you are right to view as incompatible: the requirement to explain typicality effects and the requirement to not contradict scientific revision based on essence. These two cannot be satisfied together within a single uniform structure because typicality implies gradient membership where some instances are better than others, while scientific revision implies binary membership where an organism either possesses the essential property or it does not. A category cannot be simultaneously structured by surface similarity gradients and hidden essential binaries without fracturing into two different systems of representation.

  Despite this incompatibility, I take the definite position that the prototype account survives the list best. The definitional account fails decisively on the phenomena of typicality and vagueness, unable to explain why a penguin is less bird-like than a robin or why borderline cases exist at all, and it contradicts the findings on child acquisition which show categorization precedes the ability to articulate rules. The resemblance-based account, while attractive for its flexibility, fails the requirement for inductive inference and collapses the distinction between resemblance and disjunction, offering no reason why some similarities matter more than others. The prototype account, understood as a probabilistic structure centered on typical features rather than a strict list, best explains how we sort novel instances and why some feel more central, aligning perfectly with developmental data. While it struggles to fully accommodate the normative force of scientific essentialism, it correctly identifies that essentialism is a theoretical overlay applied to categories rather than the foundational structure of the concepts themselves. We think in prototypes and reason in essences only when forced by scientific inquiry, making the prototype account the only one that describes the actual cognitive machinery you have used for thirty years, even if the ideal you aim for is definitional.
