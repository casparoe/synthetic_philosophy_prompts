prompt: |-
  I volunteer at a small city museum, where I have been asked to prepare an exhibit about housing and work in our city. Our visitors speak a dozen languages, our translation budget is almost nothing, and the trustee who oversees the exhibit has proposed that we drop sentences altogether and present everything in pictures: little figures of people for counts, houses for housing, coins for money. He argues that pictures need no translating because they show what they mean, that a drawing of five houses beside a drawing of two houses speaks for itself, and that our earlier exhibits used words only out of habit. A colleague half agrees with him: she says that between the wars a group in Vienna built a whole pictorial statistics for readers who could not follow a newspaper, and that serious people took it seriously — though she also says that the man who ran it insisted it was only ever meant to help written language along, never to replace it.

  I want the exhibit to convey six things: that evictions in our city fell last year; that most of those evicted were renters rather than owners; that the housing authority is not allowed to evict anyone between November and March; that no new social housing was built at all in the 1990s; that if the recent trend continues the waiting list will double by 2035; and that nobody actually knows how long the waiting list is, since the authority stopped counting in 2019. The first two I can manage. The rest turn into a muddle the moment I try to draw them. I can draw a family carrying its things out of a door, but how do I draw that this must not happen in winter, or that nothing was built, or that something has not happened yet, or that we are only guessing?

  The trustee says the fault is my drawing and that a competent illustrator could render any of it; he has also suggested that where the numbers are large we simply draw the houses larger, which my designer friend says is worse than useless, since a house drawn twice as tall looks four times as big. She says the trouble with the whole plan is deeper: a picture can only show how something looks, and everything about absence, permission, the future, or our own ignorance has to be put in by the viewer, so that a picture-only exhibit would quietly tell different visitors different things. I suspect they are each partly right, but I cannot tell which of my six items are genuinely beyond pictures and which are merely hard to draw well. Nor am I sure what it would mean for a picture to be read correctly at all: if a visitor looks at my five houses and my two houses and concludes that the city has seven houses, whose mistake is that?

  What I would like is advice on how to think this through, and a verdict I can act on. Should I insist on pictures alone, or accept some words? If words, which of the six items need them, and why those rather than the others? And is there any way to decide in advance what a picture can carry by itself and what it cannot, or does that question have no answer except trying it on visitors? I do not need a reading list; I need to understand the underlying issue well enough to defend whatever I decide to the trustee.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Request:**
      *   **Context:** Small city museum exhibit about housing and work.
      *   **Constraints:** Multilingual visitors (dozen languages), almost zero translation budget.
      *   **Conflict:** Trustee wants *only* pictures (pictograms/isotypes) claiming they need no translation. Colleague cites Vienna's ISOTYPE movement (Gerd Arntz/Otto Neurath) but notes it was meant to *aid* text, not replace it. Designer friend warns about visual distortion (area vs. height) and the inability of images to show abstract concepts (absence, permission, future, uncertainty).
      *   **Goal:** Convey six specific data points/concepts.
      *   **The Six Items:**
          1.  Evictions fell last year.
          2.  Most evicted were renters, not owners.
          3.  Housing authority cannot evict between Nov-March.
          4.  No new social housing built in the 1990s.
          5.  Waiting list will double by 2035 (if trend continues).
          6.  Nobody knows the current waiting list size (counting stopped in 2019).
      *   **User's Questions:**
          *   How to think this through (underlying issue)?
          *   Verdict: Pictures alone or some words?
          *   If words, which items need them and why?
          *   Is there a rule for what pictures can/cannot carry?
          *   Need to defend the decision to the trustee.
      *   **Constraint:** No reading list, need actionable understanding/verdict.

  2.  **Deconstruct the Core Problem:**
      *   The trustee's premise ("pictures need no translating because they show what they mean") is fundamentally flawed semiotically. Images are not universal; they are cultural and contextual.
      *   The colleague's reference (Vienna/ISOTYPE/Otto Neurath) is the historical anchor here. Neurath's philosophy was "Words divide, pictures unite," *but* he explicitly acknowledged the need for captions and context.
      *   The designer friend is right about visual perception (area vs. linear dimensions) and the limits of depiction (modality, negation, future tense).
      *   The user is stuck between political pressure (trustee), budget reality (translation), and communicative integrity (accurate data).

  3.  **Evaluate the Six Items against Visual Literacy:**
      *   *Item 1 (Evictions fell):* Comparative quantity. Doable with ISOTYPE (fewer figures this year than last). Needs a time marker (calendar icon?).
      *   *Item 2 (Renters vs. Owners):* Proportions. Doable (group of figures, most holding rent receipts, few holding deeds). Needs legend/key.
      *   *Item 3 (No eviction Nov-Mar):* **Negation + Time + Rule.** Very hard. A crossed-out house in winter? Does that mean "no houses in winter" or "no leaving"? Requires a modal verb concept ("must not"). High risk of misinterpretation.
      *   *Item 4 (No building in 1990s):* **Absence + Time.** How do you draw "nothing happened"? An empty timeline? A crane sleeping? High risk of looking like a mistake or missing data rather than a policy fact.
      *   *Item 5 (Future trend):* **Projection + Conditionality.** "If... then." Dotted lines? Crystal ball? Visitors often mistake projections for facts.
      *   *Item 6 (Unknown data):* **Epistemic Uncertainty.** "We don't know." A question mark? A blank space? This is the hardest. A blank space looks like missing info, not *meta* info about missing info.

  4.  **Formulate the Underlying Issue (The "Theory"):**
      *   Pictures denote *objects* and *quantities* well.
      *   Pictures struggle with *relations*, *modality* (can/must/might), *time* (tense), and *negation* (not/nothing).
      *   This is the difference between *iconicity* (looking like the thing) and *proposition* (making a claim about the thing).
      *   The "Universal Language" myth: Images are culturally coded. A "house" icon might look different to different cultures. A "coin" might not signify "money" to everyone.
      *   The "ISOTYPE" lesson: It was a *system*, not just drawings. It required a key/legend. Without a key, it's just art.

  5.  **Develop the Verdict/Strategy:**
      *   *Verdict:* Do not go pictures-only. It violates the mission of accuracy.
      *   *Compromise:* Use a "Minimal Text" strategy. Icons for the *nouns/verbs*, text for the *logic/connectors*.
      *   *Translation Hack:* Use numbers and universal symbols for the text parts that remain (e.g., "2019", "Nov-Mar", "?"). Or use the 12 languages but *only* for the critical logical words, keeping the bulk visual.
      *   *Specific Advice on the 6 Items:*
          *   1 & 2: Visual heavy.
          *   3, 4, 5, 6: Text heavy (or hybrid).
      *   *Defense:* Appeal to the Vienna precedent (Neurath himself used captions). Appeal to the risk of misinformation (liability/reputation).

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, empathetic to the budget constraint, firm on the semiotics.
      *   *Structure:*
          1.  Validate the user's intuition (the designer and colleague are right).
          2.  Explain the "Why" (The limit of pictures).
          3.  Analyze the 6 items specifically.
          4.  Provide the Verdict/Action Plan.
          5.  Script for the Trustee.
      *   *Key Concept to Introduce:* "Propositional Content." Pictures show *things*; language shows *relationships between things*.
      *   *Refining the "Words" solution:* Since translation is the budget blocker, suggest using *numbers and dates* (universal) + *icons* for the bulk, and reserve words for the logical operators which might need translation but are few. OR, suggest that the "translation" of 5-10 key words is cheaper than the risk of a failed exhibit. Actually, the best advice is that *some* words are cheaper than misinformation. But wait, the budget is *almost nothing*.
      *   *Better Solution:* Use the ISOTYPE method properly. A key/legend. The key *must* have text. If the key has text, the "pictures only" argument fails anyway. So, might as well use labels.
      *   *Addressing the "Seven Houses" error:* This is about *syntax*. A picture needs a caption to establish context (Title: "Evictions per Year"). Without the title, the syntax is ambiguous.

  7.  **Finalizing the Advice:**
      *   **The Principle:** Pictures show *existence*; Words show *logic*.
      *   **The Verdict:** Hybrid. Icons for data, minimal text for logic/time/modality.
      *   **The 6 Items:**
          *   1 & 2: Mostly visual.
          *   3, 4, 5, 6: Require text/symbols for time, negation, future, uncertainty.
      *   **The Trustee Argument:** Cite Neurath. He used captions. Misinterpretation is a risk to the museum's credibility.
      *   **The "Universal" Myth:** Even ISOTYPE needed a key. A key is text.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Check:* Did I answer the specific question about "which items need words"? Yes.
      *   *Check:* Did I address the "how to decide in advance" question? Yes, by categorizing semantic types (objects vs. relations).
      *   *Check:* Is the tone appropriate? Needs to be empowering for the volunteer.
      *   *Nuance:* The trustee cares about cost. I need to emphasize that *misleading* visitors is more costly than translating a few captions. Also, the "pictures only" approach often requires *more* design time (iterative testing) than writing captions.

  9.  **Final Polish:** Ensure the distinction between *depiction* (showing a thing) and *proposition* (making a claim) is clear. This is the intellectual ammunition the user needs. (Proceed to generate output).

  *(Self-Correction on the Translation Budget)*: If the budget is *zero*, suggesting translation might be a non-starter. I need to offer a solution that works *without* translation if possible, or argues that the cost of translation is necessary.
  *Alternative:* Use standard ISO symbols where possible. Use numbers (universal). Use a "Key" that relies on visual matching rather than text? No, that gets complex.
  *Best approach:* Argue that the "Pictures Only" plan *fails* its own goal (communication) without minimal text. The cost of *failure* is higher than the cost of translation. But also, offer a "Minimal Language" approach: Numbers + Dates + Icons. These are semi-universal. "2019", "Nov-Mar", "?". These don't need translation. The logical connectors ("No", "Will", "Unknown") are the hard part.
  *Actually, the strongest argument is the Vienna one.* The colleague mentioned it. I should lean heavily on Neurath. He *never* did picture-only. He did Picture + Caption. The Trustee is historically wrong.

  *Let's structure the advice:*
  1.  **The Diagnosis:** Why the Trustee is wrong (Semiotics).
  2.  **The Test:** How to categorize the 6 items (Concrete vs. Abstract).
  3.  **The Verdict:** Hybrid approach.
  4.  **The Defense:** What to say to the Trustee.

  *Wait, one more thing:* The user asked "Is there any way to decide in advance what a picture can carry?"
  *Answer:* Yes. The "Concrete vs. Abstract" test. Nouns/Quantities = Good. Verbs/Relations/Modality = Bad.

  *Okay, ready to write.*
answer: |-
  You are facing a classic conflict between **semiotics** (how meaning is made) and **administration** (budget and politics). Your intuition, your colleague's historical reference, and your designer friend's technical warning are all correct. The trustee is operating under a common misconception: that images are a universal language. They are not. Images are a universal *stimulus*, but not a universal *syntax*.

  Here is the framework you need to analyze the problem, the verdict on your six items, and the argument to use with your trustee.

  ### 1. The Underlying Issue: Depiction vs. Proposition

  To defend your decision, you must distinguish between two types of information:

  *   **Depiction (The "What"):** Concrete objects, quantities, and physical states. (e.g., a house, a person, five coins). Pictures excel here.
  *   **Proposition (The "How" and "If"):** Relationships, logic, time, modality, and negation. (e.g., *not* built, *will* happen, *cannot* evict, *unknown*). Pictures fail here.

  A picture can show a house. It cannot show that the house *does not exist*. It cannot show that the house *might* exist in the future. It cannot show that someone is *forbidden* from entering the house. To convey those ideas, you need **logic**, and logic requires **syntax**. In human communication, syntax is primarily the domain of language (or highly conventionalized symbols that function like language).

  **The Vienna Precedent (ISOTYPE):**
  Your colleague is referring to the **ISOTYPE** system (International System of TYpographic Picture Education), developed by Otto Neurath and Gerd Arntz in the 1920s/30s. Neurath famously said, "Words divide, pictures unite." However, the trustee is misquoting the history. ISOTYPE panels *always* included titles, captions, and keys. Neurath insisted that pictures were a "visual aid" to memory and understanding, not a replacement for the precision of language. He knew that without a caption to establish context (e.g., "Evictions per Year"), a row of figures is just art, not data.

  **The "Seven Houses" Problem:**
  You asked: *If a visitor looks at my five houses and my two houses and concludes that the city has seven houses, whose mistake is that?*
  It is the **exhibit designer's mistake**. In semiotics, this is a failure of **framing**. Without a label establishing the *unit of analysis* (e.g., "Evictions," not "Total Stock"), the image is ambiguous. Ambiguity in a museum is not "open interpretation"; it is misinformation.

  ### 2. Verdict on the Six Items

  You should not insist on pictures alone. You should propose a **"Minimal Text" Hybrid Model**. This respects the budget (less text to translate) while ensuring accuracy.

  Here is the breakdown of your six items, categorized by whether they can be carried by images alone.

  | Item | Concept | Visual Viability | Verdict | Why? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Evictions fell last year.** | Comparison / Quantity | **High** | **Mostly Visual** | Two bars of figures (Year A vs. Year B). Needs a date label (numbers are universal). |
  | **2. Renters vs. Owners.** | Proportion / Category | **High** | **Mostly Visual** | Two groups of figures. Needs a key (Icon of Key = Owner, Icon of Receipt = Renter). |
  | **3. No eviction Nov–Mar.** | Negation + Time + Rule | **Low** | **Needs Words** | How do you draw "forbidden"? A red cross? That often means "No Housing." Needs "Nov–Mar" (universal) but needs a modal verb (Must Not). |
  | **4. No building in 1990s.** | Absence + Time | **Very Low** | **Needs Words** | Drawing "nothing" looks like a blank space or a mistake. You must explicitly state "Zero New Units." |
  | **5. List will double by 2035.** | Future + Condition | **Very Low** | **Needs Words** | Dotted lines imply "projection," but many read them as "fact." The "If trend continues" condition is impossible to draw without a sentence. |
  | **6. Nobody knows the count.** | Uncertainty / Meta-data | **Impossible** | **Needs Words** | You cannot draw "we do not know." A question mark implies "We are asking," not "The data is missing." |

  **The Rule of Thumb:**
  *   **Can draw:** Nouns (House, Person), Numbers (5, 100), Dates (1990, 2035).
  *   **Cannot draw:** Negation (No/Not), Modality (Can/Must/Might), Tense (Will/Was), Epistemology (Known/Unknown).

  ### 3. Action Plan: The "Hybrid" Solution

  Do not fight the trustee on "Pictures vs. Words." Fight for "Clarity vs. Confusion." Propose this compromise:

  1.  **Use ISOTYPE for the Data:** Use the figures, houses, and coins for Items 1 and 2. This satisfies the trustee's desire for visual appeal and reduces translation load.
  2.  **Use "Universal" Text for Logic:** For Items 3–6, use numbers and dates (which need no translation) combined with minimal captions.
      *   Instead of translating "No new social housing was built," use a large **"0"** next to a crane icon and the date range **"1990–1999"**.
      *   Instead of "Nobody knows," use a large **"?"** and the text **"Data Unavailable Since 2019"**. (This specific phrase may need translation, but it is one line, not a paragraph).
  3.  **The "Key" Strategy:** Create a visual legend at the start of the exhibit. If the Key requires text to explain the symbols, you have proven that text is necessary.

  ### 4. How to Defend This to the Trustee

  You need to speak to the trustee's concerns: budget, accessibility, and reputation. Do not use academic jargon. Use the following arguments:

  **Argument 1: The Risk of Misinformation (Reputation)**
  *"If a visitor looks at the 'No Building in the 1990s' panel and thinks it means 'We don't have data for the 1990s' rather than 'Nothing was built,' we have lied to them. If they take photos and share that online, the museum looks incompetent. A picture without a caption is not data; it is a Rorschach test. We cannot afford to be misunderstood."*

  **Argument 2: The Historical Precedent (Authority)**
  *"The Vienna project you mentioned (ISOTYPE) is the gold standard for this. I reviewed their archives. They never used pictures alone. Otto Neurath insisted that every chart have a caption to define the context. If we drop captions, we are not following their method; we are ignoring their most important rule. We should follow the expert model, not a simplified version of it."*

  **Argument 3: The Budget Reality (Cost)**
  *"Translating six short captions is cheaper than fixing a misinterpreted exhibit. If we go pictures-only, we will have to test it with visitors to ensure they understand it. That takes time and staff hours. Writing '0 New Homes 1990–1999' takes five minutes and translates easily. The 'pictures only' plan actually requires more labor to ensure it works."*

  **Argument 4: The "Universal" Myth (Accessibility)**
  *"A drawing of a house looks different to a visitor from Asia than to one from Europe. A drawing of a coin might not signify 'money' to everyone. Numbers and Dates are the only true universal language. By combining Icons + Numbers + Minimal Text, we maximize understanding. Icons alone maximize confusion."*

  ### Summary Verdict

  **Do not accept the "Pictures Only" mandate.** It is semiotically impossible to convey negation, future tense, and uncertainty without syntax.

  **Your Proposal:**
  1.  **Items 1 & 2:** Visual heavy, minimal labels (Dates, Legends).
  2.  **Items 3, 4, 5, 6:** Data heavy (Numbers/Dates) + Explicit Captions.
  3.  **Translation:** Argue that translating 50 words of critical logic is within any "almost nothing" budget, whereas the cost of visitor confusion is infinite.

  If the trustee absolutely forbids text, you must refuse to sign off on Items 3–6. State clearly in writing: *"Without textual clarification, these panels will actively communicate false information to the public."* This protects you and forces the trustee to own the risk of misinformation.
