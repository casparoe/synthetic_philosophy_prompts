answer: |-
  Your instincts are sharp. This gloss is a standard "analytic metaphysics 101" summary, but it smooths over several jagged edges that are crucial for understanding why the debate actually persists. It treats a complex metaphysical dispute as a settled historical artifact.

  Here is the claim-by-claim audit, followed by a deep dive into your two specific nagging concerns.

  ### Claim-by-Claim Audit

  **Claim 1:** *"Leibniz's law — the principle of the identity of indiscernibles — is the claim that no two things can have all the same properties..."*
  *   **Verdict:** **Wince.**
  *   **Why:** Terminologically, this is sloppy. In logic and metaphysics, "Leibniz's Law" almost always refers to the *Indiscernibility of Identicals* (if $x$ is identical to $y$, they share all properties). That principle is logically uncontroversial. The principle you are discussing is the *Identity of Indiscernibles* (PII) (if $x$ and $y$ share all properties, they are identical). Conflating them suggests PII is as logically secure as the law of identity, which it isn't.

  **Claim 2:** *"Max Black's counterexample... imagine a universe containing nothing but two iron spheres..."*
  *   **Verdict:** **Nod.**
  *   **Why:** This is an accurate summary of Black's 1952 thought experiment.

  **Claim 3:** *"You might try to rescue it by saying the spheres differ in their relational properties... but the setup is perfectly symmetric... relations don't get you out."*
  *   **Verdict:** **Nod.**
  *   **Why:** This correctly captures Black's move against *pure* relational properties (e.g., "2 miles from the *other* sphere").

  **Claim 4:** *"That leaves only haecceities, bare thisness, and hardly anyone wants to believe in those."*
  *   **Verdict:** **Nod (with caveat).**
  *   **Why:** Accurate regarding contemporary analytic consensus. Haecceitism is a minority view, though it has seen a revival in philosophy of physics and modality.

  **Claim 5:** *"Leibniz's own escape was to say that God would have had no reason to arrange things one way round rather than the other... but that's his theology doing the work, not an argument."*
  *   **Verdict:** **Wrong.**
  *   **Why:** This dismisses the Principle of Sufficient Reason (PSR) as mere dogma. For Leibniz, PSR is a rationalist metaphysical axiom, not just a theological get-out clause. It claims that *nothing happens without a reason why it should be so rather than otherwise.* If PII were false, there would be no sufficient reason for God to place sphere A *here* and sphere B *there* rather than vice versa. Dismissing this as "theology" ignores that Leibniz's metaphysics is a unified system where PSR entails PII.

  **Claim 6:** *"Bottom line: most philosophers now think Leibniz's principle is simply false."*
  *   **Verdict:** **Wince.**
  *   **Why:** "Simply false" implies it is false in all possible worlds or straightforwardly false in the actual world. The reality is more nuanced (see below).

  ---

  ### Deep Dive: Your Two Nagging Concerns

  #### 1. The Relational Properties & Naming Move
  **Your intuition:** *"Being two miles from sphere B" and "being two miles from sphere A" don't look like the same feature... Is that a legitimate move?"*

  **The Audit:** You have identified the distinction between **pure** and **impure** properties.
  *   **Pure Properties:** Qualitative features that do not reference specific individuals (e.g., "red," "heavy," "2 miles from *a sphere*").
  *   **Impure Properties:** Features that reference specific individuals (e.g., "2 miles from *Sphere B*").

  If you allow **impure** properties into the debate, PII becomes trivially true. Every object has the property "being identical to itself" or "being 2 miles from Sphere B." If Sphere A has the property "being Sphere A," and Sphere B does not, they are discernible. But this makes PII useless; it no longer tells us *what makes* them distinct, it just assumes they are distinct to formulate the properties.

  **The Verdict:** In the context of this debate, your move is considered **question-begging**. To test PII, we must restrict the principle to **pure properties** (including pure relations). Black's argument holds because, in a symmetric universe, Sphere A has the pure relational property "2 miles from the *other* sphere," and Sphere B has the exact same pure relational property "2 miles from the *other* sphere."
  *   **Does it matter?** Yes. If the book doesn't specify *pure* properties, the definition of PII is ambiguous. If it means *all* properties (including impure), Black's counterexample fails, but PII becomes trivial. If it means *pure* properties, Black's counterexample works. The book assumes the latter without stating it.

  #### 2. "Simply False" vs. "Not Necessary"
  **Your intuition:** *"I thought Black's example, if it works, shows at best that the principle isn't a necessary truth, and that it might still be true of the actual world."*

  **The Audit:** You are correct. Black's universe is a *possible* world.
  *   **Necessary PII:** Claims that in *no possible world* can two distinct things share all pure properties. Black refutes this.
  *   **Contingent PII:** Claims that in the *actual world*, no two things share all pure properties. Black does not refute this.

  However, the book's claim that it is "simply false" gets unexpected support from **Quantum Mechanics**, which the book ignores. In QM, certain particles (bosons) appear to be numerically distinct yet share all intrinsic and relational properties (even quantum states). If QM is interpreted realistically, PII is false in the *actual* world, not just possible ones.
  *   **The "Most Philosophers" Line:** This is overstated. Most philosophers agree PII is not a *logical truth* (thanks to Black). Whether it is an *empirical truth* is debated between metaphysicians and philosophers of physics.
  *   **Does the distinction do work?** Yes. If PII is only contingently false, it could still be a useful heuristic for macroscopic objects. If it's necessarily false (as Black suggests), it's dead as a metaphysical principle. The book conflates these.

  #### 3. Dismissing the Theological Reply
  **Your intuition:** *"Dismissing Leibniz's reply as 'just theology' seems cheap: the principle of sufficient reason is a whole thing, isn't it?"*

  **The Audit:** Yes, it is cheap. It is a common "analytic" dismissal of "continental/rationalist" metaphysics.
  *   **The Connection:** Leibniz does not hold PII as a brute fact. He derives it from PSR. If PSR is true, PII *must* be true.
  *   **The Critique:** Modern philosophers generally reject PSR (they accept brute facts). Therefore, they reject the *ground* for PII.
  *   **The Error:** The book frames Leibniz's reply as "God wouldn't do it," implying it's a religious constraint. It should frame it as "A rational explanation would be impossible," which is a metaphysical constraint. By calling it theology, the book insinuates Leibniz is relying on faith rather than reason, which is the opposite of his project.

  ---

  ### Final Verdict: Does the Bottom Line Collapse?

  **The Book's Bottom Line:** *PII is false; don't believe it.*

  **Does it stand?** **Yes, but for different reasons.**
  The book's *conclusion* (that PII is not a secure metaphysical principle) is the standard contemporary view. However, the *argumentation* provided in the gloss is simplified to the point of distortion.

  1.  **It collapses** as a historical account of Leibniz (by dismissing PSR as theology).
  2.  **It collapses** as a logical account (by conflating Indiscernibility of Identicals with Identity of Indiscernibles).
  3.  **It holds** as a pragmatic guide for a student (you should not treat PII as an undeniable truth).

  **How to take notes:**
  *   Note the distinction between **Indiscernibility of Identicals** (uncontroversial) and **Identity of Indiscernibles** (controversial).
  *   Note that Black's argument refutes **Necessary PII**, not necessarily **Contingent PII**.
  *   Note that the debate hinges on **Pure vs. Impure Properties**. (Your "naming" intuition identifies impure properties, which are usually excluded to make the debate non-trivial).
  *   Note that Leibniz's defense rests on the **Principle of Sufficient Reason**, which is a metaphysical axiom, not merely a theological claim.
  *   Note that **Quantum Mechanics** is the modern reason many think PII is actually false in the real world, not just Black's thought experiment.

  The book is giving you the "received view" without the machinery required to defend it. Your skepticism is warranted.
