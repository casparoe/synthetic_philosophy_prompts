answer: |-
  Good evening, everyone. For those who don't know me, I'm the best man. And also the brother. And currently, the person who had a terrible idea about three weeks ago.

  I knew I had to write a speech for my little brother. And I knew that anything I said would be measured against the thing he cares about most: his work. Specifically, his research on how we understand people. He spent years on this. I spent last week reading his notes and understanding about two-thirds of them, which is a pass in my book, but might be a fail in his.

  So, I decided to try something risky. I'm going to talk about him using the three ways he says we can look at any object in the universe. And I'm going to do it in order, because I know half this room is from his department, and you'll be checking my work.

  The first way is the Physical Stance. This is where you look at something as just a bundle of atoms. A lump of stuff obeying the laws of physics. If I look at my brother this way, he's just carbon and water and electricity. If I push him, he falls over. If I stop feeding him, he stops talking. It's accurate, technically. But it's not very useful. I can't predict what he's going to say in his vows by calculating the trajectory of his molecules. And honestly, looking at him this way makes it hard to love him. You don't hug a bag of chemistry.

  So we move up. The second way is the Design Stance. This is where you ignore the atoms and look at what something is built to do. You don't need to know how a clock works inside to know it's for telling time. You don't need to know the aerodynamics to know a wing is for flying. And here's the bit he loves: the wing doesn't need to *know* it's for flying. The purpose is real even if the bird isn't thinking about it.

  For a long time, I looked at my brother this way. I thought he was designed to be the annoying little sibling. Designed to win every argument by defining the terms differently. Designed to eat the last slice of pizza because that's what brothers are for. It's a useful way to see him. It predicts a lot. But it still treats him like a machine. Like his purpose was fixed before he ever met the person sitting next to him.

  Which brings me to the third way. The Intentional Stance. This is where you treat something as an agent. You assume it has beliefs, desires, and reasons. You predict what it will do by asking what it *wants* to do.

  My brother has spent his career arguing that this isn't just a story we tell ourselves to make sense of things. He says these patterns are real. They're as real as the atoms. Because they're the only things that let you compress the complexity of a person into something you can understand. They let you see what someone will do before they do it.

  And this is where I stop talking about philosophy and start talking about Sarah.

  When I look at the two of them together, I don't see a bundle of atoms. I don't even see two separate designs clicking together like gears. I see a new pattern. A real one.

  Before Sarah, predicting my brother was hard work. He was complex. He was noisy. But now? The pattern is clear. We can see them coming. We know what they want. We know what they believe about each other. And according to the very theory he wrote his thesis on, that makes this love real. Not just a nice story we're telling to be polite. But a genuine structure in the world that lets us predict a future where they're happy.

  He taught me that the patterns we see in people are the most real things there are. So, looking at the pattern of the two of you, I have never been more confident in what comes next.

  Please raise your glasses. To the bride and groom. To the real pattern. And to a future that is entirely predictable, in the best possible way.
