      *(Refining the "Example")*: The "Locked Door" is the classic Harman example. It works. Stick with that.

      *(Refining the "Settled vs. Contested")*: Many epistemologists reject the "Closure Principle" in this specific context. Others reject the idea that knowing $P$ allows you to know *a priori* that counter-evidence is misleading. I need to list these as the "contested" parts without taking a side.

  7.  **Final Polish:** Check against all constraints.
