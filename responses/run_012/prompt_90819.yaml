answer: |-
  1. This is primarily two camps answering different questions under one heading, where instrumentalists prioritize predictive utility while realists demand causal explanatory power. Neither side is strictly wrong because they are evaluating models against divergent criteria of success.
  2. However, the word "assumption" is doing significant damage by conflating mathematical simplifications with empirical claims, allowing both sides to talk past each other. This verbal ambiguity masks the underlying pragmatic choices regarding what a model is supposed to achieve.
  3. Distinguishing idealization from abstraction or single assumptions from whole models merely relocates the dispute rather than dissolving it, as critics still disagree on which distortions are permissible. These distinctions clarify the terrain but fail to resolve the tension between predictive accuracy and causal fidelity.
  4. The hidden question doing the real work is conceptual, concerning whether models function primarily as instruments for calculation or as representations of underlying mechanisms. Resolving this requires defining the ontological status of theoretical entities rather than testing empirical outcomes.
  5. Progress would consist of an argument that no further theoretical progress should be expected, recognizing that model choice depends on pragmatic aims rather than universal truth criteria. Accepting pluralism allows both predictive and explanatory models to coexist without requiring one framework to defeat the other.
