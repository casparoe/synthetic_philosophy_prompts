  Economists and philosophers of science have been arguing for decades about how much the truth of a model's assumptions matters, and neither side has given an inch. One side, following Milton Friedman's 1953 essay on positive economics and the position Paul Samuelson later nicknamed the F-twist, holds that a theory is to be judged by the accuracy of its predictions and that the more significant a theory is, the more unrealistic its assumptions may be, so that false assumptions are not a defect to be excused but often a mark of theoretical power. The other side answers that an assumption which is not even approximately true cannot do explanatory work, and adds the logical point that where assumptions and conclusions are deductively connected, false assumptions cannot yield true conclusions except by accident. Both camps cite the same stock cases — the ideal gas law, the frictionless plane, the point mass, the profit-maximizing firm — and each reads them as confirming its own view. My working hypothesis is that this is not one dispute but two, and that the word assumption is doing the damage: one side is asking when a model is useful for prediction, the other is asking what makes a model explanatory, and assumption sometimes names a mathematical posit internal to the formalism and sometimes a causal claim about the target system. Diagnose the impasse rather than adjudicating it. Say whether this is a substantive disagreement about the aims of science, a verbal one about a word, or two camps answering different questions under one heading; say whether distinguishing idealization as distortion from abstraction as omission, or distinguishing the appraisal of a single assumption from the appraisal of a whole model, dissolves the dispute or merely relocates it; identify the hidden question — empirical, formal, or conceptual — that is really doing the work; and tell me what would count as progress here, whether a distinction, a decisive case, a formal result, or an argument that no progress should be expected.

  Give the response as a numbered list of exactly five items, each one or two sentences, with no introduction or conclusion.
