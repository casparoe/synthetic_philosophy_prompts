prompt: |-
  I'm a doctoral candidate in urban planning, and I've been trying to work out what my own field's central decision procedure is actually committed to. The practice I have in mind is this. In much of the United States, and in recognisably similar forms elsewhere, the rules governing what may be built are set out in a citywide plan adopted by the whole council and justified in the language of the general welfare. But the decisions that determine whether a particular building actually gets built are made project by project, through variances, conditional use permits, design review, and other discretionary approvals. In those proceedings, the parties who are formally notified, given the right to speak, and given the right to appeal are the owners and residents in the immediate vicinity of the site. The people who would live in the building, and the people who would move to the city if more of it were built, have no standing at all. Among the grounds on which a project can be refused are its effect on the neighbourhood's character and its effect on nearby property values. The asymmetry I keep running into is that the plan is written for everyone, while the permit is decided by the few who are already there.

  What I want is an account of what this arrangement presupposes. What principle of political inclusion does the standing rule commit the city to: that all affected interests should be represented, that only those subjected to a decision's coercion should be, or something territorial and proprietorial that maps onto neither? What conception of property does the neighbour's objection presuppose? Does the objection make sense only if ownership carries something like an easement over the uses other owners make of their own parcels, and can that be rendered coherent on a view of property as a bundle of separable rights, or does it require something closer to a natural right to the existing state of one's surroundings? Is there a defensible ground for the incumbents' claim, such as sunk investment, attachment to place, or the value of stable communities, and how much weight can it bear against the claims of those excluded altogether?

  I would also like you to sort out which parts of the practice are strictly presupposed by it and which merely happen to fit with it. A purely rent-seeking story, in which incumbents use the permitting process to protect their asset values and the moral vocabulary is decoration, would generate the same pattern. If that story explains the practice as well as any theory of legitimacy does, say so, and say what follows about whether there is an implicit theory here at all. Then tell me where the practice is underdetermined: which rival theories would license exactly this arrangement, and where they would diverge if pressed.

  Finally, take the view you judge the practice to presuppose, whatever it turns out to be, and replace it with each of three serious alternatives: that the relevant demos for a neighbourhood decision is everyone affected, including would-be residents; that land-use decisions are matters of property right and should not be made collectively at all; and that the relevant unit is the region rather than the neighbourhood. For each, say concretely what would have to change in the notice rules, the permissible grounds for refusal, the standard of review on appeal, and the level at which decisions are made. I am less interested in a survey of the planning literature than in a reconstruction of the theory the machinery is already committed to, and an honest verdict on whether it holds together.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **User:** Doctoral candidate in urban planning.
      *   **Topic:** The central decision procedure of US-style zoning/land use planning (Comprehensive Plan vs. Discretionary Permitting).
      *   **Core Tension:** The Plan is universal/general welfare-oriented; the Permit is particular/discretionary and limited to immediate neighbors (incumbents). Excluded: potential residents, city-wide population.
      *   **Key Questions:**
          1.  What principle of political inclusion does the standing rule commit the city to? (All affected? Coercion? Territorial/Proprietorial?)
          2.  What conception of property does the neighbor's objection presuppose? (Easement? Bundle of rights? Natural right to status quo?)
          3.  Is there a defensible ground for incumbents' claim? (Sunk investment, attachment, stability?)
          4.  Distinguish presuppositions from contingent features (Rent-seeking vs. Legitimacy theory).
          5.  Identify underdetermination (Which rival theories license this arrangement? Where do they diverge?)
          6.  **Thought Experiment:** Replace the presupposed view with three alternatives:
              *   All Affected (including would-be residents).
              *   Property Rights/Market (no collective decision).
              *   Regionalism (region > neighborhood).
          7.  **Requirement:** Concrete changes for each alternative (Notice, Grounds for Refusal, Standard of Review, Decision Level).
          8.  **Tone/Style:** Philosophical reconstruction, rigorous, honest verdict on coherence, less literature survey, more theoretical analysis.

  2.  **Initial Analysis & Theoretical Mapping:**

      *   *The Practice:* Euclidean Zoning + Discretionary Review (Variances, CUPs, Design Review).
      *   *The Asymmetry:* General Plan (Legislative/General) vs. Permitting (Quasi-Judicial/Specific).
      *   *Standing:* "Aggrieved party" standard usually requires proximity + specific harm (property value, traffic, shadow), not generalized grievance.
      *   *Implicit Theory:* It's not purely "All Affected" (excludes outsiders). It's not purely "Coercion" (outsiders are coerced by housing shortages but have no say). It looks like a *Territorial-Proprietorial Hybrid*. It treats the neighborhood as a joint stock company of existing owners.
      *   *Property Conception:* It implies a negative externality right. If I build, I harm you. Therefore, you have veto power. This leans towards a *natural right to amenity* or a *presumptive easement* over neighbors' development rights, rather than a strict "bundle of rights" where I can do what I want on my lot unless it's a nuisance.
      *   *Rent-Seeking vs. Legitimacy:* Public Choice theory says it's rent-seeking (protecting asset value). Political Theory says it's about stability/expectations. The prompt asks to distinguish what is *presupposed* vs. what *fits*. The *procedure* presupposes that neighbors have a legitimate interest distinct from the public. Whether that interest is "asset protection" or "community stability" is the normative gloss.
      *   *Underdetermination:* Both a *Communitarian* view (protect existing social fabric) and a *Lockean/Property* view (protect investment-backed expectations) license this. They diverge on *why* (social good vs. individual right).

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. Define the "Dual-Track" system (Legislative Plan vs. Quasi-Judicial Permit).
      *   **Part 1: The Implicit Theory (Reconstruction):**
          *   *Political Inclusion:* It's not "All Affected." It's "All *Implicated* Incumbents." It relies on a *principle of proximate harm*.
          *   *Property Conception:* It treats property not just as rights *in* a thing, but rights *against* changes in the context. It's a "right to the neighborhood." This conflicts with the "bundle of rights" if the bundle includes the right to develop. It implies development rights are severed from the title and held in common by the neighborhood.
          *   *Defensible Grounds:* Investment-backed expectations (Penn Central logic). Stability as a public good.
      *   **Part 2: Rent-Seeking vs. Legitimacy:**
          *   Does the practice *require* a moral theory? No. Public Choice explains the *persistence*. But the *legal form* requires a justification (police power/general welfare).
          *   *Verdict:* The practice is *structurally* committed to a theory of localism and stability, even if *motivated* by rent-seeking. The machinery breaks without the legitimacy story.
      *   **Part 3: Underdetermination:**
          *   Which theories fit? 1. *Civic Republicanism/Communitarianism* (preserve community character). 2. *Libertarian/Property* (protect existing owners from externalities).
          *   *Divergence:* Communitarians might support affordable housing if it fits "character." Libertarians would oppose density restrictions as takings.
      *   **Part 4: The Three Alternatives (Concrete Changes):**
          *   *Alternative 1: All Affected (Cosmopolitan/Regional).*
              *   Notice: Citywide/Regional.
              *   Grounds: Housing need, climate, equity (not just local traffic).
              *   Review: De novo by regional body.
              *   Level: Regional.
          *   *Alternative 2: Property Rights (Laissez-Faire/Nuisance Only).*
              *   Notice: None (private transaction).
              *   Grounds: Only common law nuisance (smoke, noise).
              *   Review: Courts only.
              *   Level: Private/ Judicial.
          *   *Alternative 3: Regionalism (YIMBY/Structural).*
              *   Notice: Regional agencies + Neighbors.
              *   Grounds: Regional housing targets.
              *   Review: Strict scrutiny on denials.
              *   Level: Regional mandate, local implementation.
      *   **Conclusion:** Final verdict on coherence. The current system is incoherent because it claims general welfare but acts particularistic. It's a "compromise that satisfies no principle fully."

  4.  **Refining the Argument (Self-Correction during drafting):**

      *   *Critique:* Make sure I don't just describe zoning law. I need to dig into the *political philosophy* of the procedure.
      *   *Focus:* The prompt asks about *standing*. Why do neighbors have standing and potential residents don't?
      *   *Key Insight:* The current system treats the neighborhood as a *corporation* where existing owners are shareholders. New residents are customers who haven't bought in yet.
      *   *Property:* Is it an easement? Yes, effectively a "conservation easement" held by neighbors over your lot.
      *   *Rent-Seeking:* Be careful. If I say it's *only* rent-seeking, I deny the user's request for the *presupposed* theory. I need to say: The *legal form* presupposes legitimacy (harm prevention), even if the *sociological cause* is rent-seeking. The prompt asks what the *arrangement presupposes*, not necessarily what drives the actors.
      *   *Underdetermination:* This is crucial. A Communitarian and a Lockean both support neighbor standing, but for different reasons. One says "community fabric," the other says "investment backing."
      *   *Alternatives:* Ensure the "Concrete Changes" are specific (Notice, Grounds, Review, Level).

  5.  **Final Polish:**

      *   Check tone: Academic, rigorous, respectful of the candidate's expertise.
      *   Check constraints: Did I answer all parts? (Presuppositions, Property, Rent-seeking, Underdetermination, 3 Alternatives).
      *   *Verdict:* The current system is "principled hypocrisy." It claims universal welfare but institutionalizes particularistic veto.

  6.  *(Self-Correction on "Regionalism" vs "All Affected")*: The prompt distinguishes "All Affected" from "Region." "All Affected" is a philosophical principle (could be global). "Region" is a specific governance scale. I should treat "All Affected" as the *Demos* question (who votes) and "Region" as the *Jurisdiction* question. Actually, the prompt lists them as distinct alternatives: 1. Everyone affected (including would-be residents), 2. Property right (no collective), 3. Region rather than neighborhood. I will treat #1 as expanding the *standing* within the current structure, and #3 as changing the *scale* of authority. #2 abolishes the structure.

      *   *Refinement on #1:* If the demos is everyone affected, standing rules must change to allow potential residents to intervene.
      *   *Refinement on #3:* If the unit is the region, the *decision maker* changes, not just the standing.

      *   *Let's align with the prompt's specific phrasing:*
          1.  Demos = Everyone affected (including would-be residents).
          2.  Land-use = Property right (no collective).
          3.  Unit = Region.

      *   *Okay, ready to write.*

  7.  **Final Review against constraints:**
      *   Doctoral level? Yes.
      *   Reconstruction of theory? Yes.
      *   Honest verdict? Yes.
      *   Three alternatives with concrete changes? Yes.

      *(Drafting mental outline for the "Property" section)*: The neighbor's objection implies my right to build is limited by your right to *not have me build*. This is a "servitude" or "equitable easement" logic without the deed. It treats the zoning code as a contract among neighbors.

      *(Drafting mental outline for "Rent-Seeking")*: If it's purely rent-seeking, there is *no* normative theory, only power. But the *procedure* mimics due process. So it presupposes a *quasi-judicial* logic (adjudicating rights) rather than a *legislative* logic (allocating resources).

      *(Drafting mental outline for "Underdetermination")*: Lockean (protect existing value) vs. Communitarian (protect social fabric). Both yield "No" on the permit. They diverge on whether "affordability" is a valid counter-weight.

      *(Drafting mental outline for "Alternatives")*:
      1.  *All Affected:* Standing for housing advocates. Grounds include regional need.
      2.  *Property Right:* By-right development. Nuisance only.
      3.  *Regional:* RHNA (California style) but stronger. Regional approval for local denials.

