answer: |-
  This is a precise and penetrating diagnosis of the dual-track nature of American land-use governance. You have identified the fracture line between the *legislative* logic of the Comprehensive Plan (universal, prospective, general welfare) and the *quasi-judicial* logic of the Permit (particular, retrospective, aggrieved parties).

  Here is a reconstruction of the theory your field's machinery is committed to, an assessment of its coherence, and an analysis of the alternatives you proposed.

  ### I. The Implicit Theory of the Current Arrangement

  To make sense of the standing rules and the discretionary permit process, we must reconstruct the normative commitments that render the procedure intelligible rather than merely arbitrary.

  **1. The Principle of Political Inclusion: Proximate Implication**
  The practice does not commit to the "All Affected Principle" (AAP). If it did, potential residents, commuters, and the homeless would have standing, as they are materially affected by housing supply and location. Nor does it commit strictly to the "All Subjected Principle" (coercion), as the exclusion of outsiders is itself a coercive act against them.

  Instead, the practice commits to a **Principle of Proximate Implication**. It presupposes that political standing in land-use matters derives from *existing spatial attachment* combined with *proprietary interest*. The "demos" for a neighborhood decision is not the citizenry, nor the stakeholders, but the *adjacent proprietors*. This treats the neighborhood not as a political subdivision of the state, but as a **joint-stock association of incumbents**. Membership is acquired through the sunk cost of entry (buying a home) and maintained through continuous presence. The procedure presupposes that those who have "invested" in the neighborhood (financially and socially) hold equity in its future trajectory, while those who have not yet entered hold no claim.

  **2. The Conception of Property: The Presumptive Easement**
  The neighbor's objection presupposes a conception of property that is difficult to square with the standard "bundle of rights" theory. In a strict bundle-of-rights view, I own my lot and may use it as I wish provided I do not commit a common-law nuisance (smoke, noise, filth).

  However, the discretionary permit process grants neighbors veto power over uses that are *not* nuisances in the common-law sense (e.g., a building that is too tall, too dense, or aesthetically dissonant). This implies that property ownership includes a **presumptive negative easement over the development rights of neighbors**. When you bought your home, the implicit theory suggests you purchased not just the lot, but a share in the *ambient conditions* of the vicinity. Therefore, my right to develop is severed from my title and held in common by the neighborhood association (informally constituted by the zoning code). This is closer to a **natural right to the status quo** than a liberal right to use. It treats the existing physical and social character of the neighborhood as a collective asset that incumbents are tasked with conserving.

  **3. The Defensible Ground: Investment-Backed Expectations**
  The most coherent normative defense for this arrangement is not "property value" per se (which is circular), but **stability as a precondition for investment**. This is the logic of *Penn Central Transportation Co. v. New York City*. If land-use rules were volatile, no one would invest in improvements. The discretionary process, paradoxically, serves to stabilize expectations by giving incumbents a mechanism to enforce the *status quo* against deviations. The weight this bears is significant: it protects the reliance interests of those who made life decisions based on existing zoning. However, it fails to account for the reliance interests of those who *would* have moved there if the rules were different. The theory privileges *past* investment over *future* opportunity.

  ### II. Rent-Seeking vs. Legitimacy: What is Presupposed?

  You ask whether the practice presupposes a theory of legitimacy or if it is merely rent-seeking with moral decoration.

  **The Verdict:** The *persistence* of the system is best explained by Public Choice theory (rent-seeking). However, the *legal form* of the system presupposes a theory of legitimacy. A purely rent-seeking regime would not require public hearings, findings of fact, or rights of appeal; it would simply be bribery or raw voting blocs.

  The fact that the system requires a **quasi-judicial procedure** (notice, standing, evidence, findings) means it is structurally committed to the idea that land-use decisions are **adjudications of right**, not allocations of privilege. It presupposes that neighbors have a *right* to be heard because they suffer a *particularized harm* distinct from the general public.

  If the practice were purely rent-seeking, the moral vocabulary would be contingent. But because the courts require "substantial evidence" and consistency with the "general welfare," the system is forced to translate rent-seeking claims (my view, my value) into public-regarding language (traffic, safety, character). The system is therefore **structurally hypocritical**: it requires private harms to be articulated as public goods to be valid. This does not mean the theory is absent; it means the theory is a **fiction of localism** that must be maintained for the machinery to function legally.

  ### III. Underdetermination: Rival Theories Licensing the Same Practice

  The current arrangement is underdetermined because two rival political theories license exactly this machinery, though they would diverge under pressure.

  1.  **Civic Communitarianism:** The neighborhood is a social fabric. Discretionary review protects the "character" and social cohesion of the community.
      *   *Divergence:* If a project increased density but included community space or affordable units that strengthened social ties, a Communitarian might support it.
  2.  **Lockean Proprietarianism:** The neighborhood is a collection of asset holders. Discretionary review protects investment-backed expectations from negative externalities.
      *   *Divergence:* If a project increased property values but changed the "character," a Lockean might support it, whereas a Communitarian would oppose it.

  **Where they converge:** Both justify excluding outsiders. For the Communitarian, outsiders are not members of the community. For the Lockean, outsiders have no property interest to protect.
  **Where they diverge:** On the definition of "harm." The Lockean cares about economic externalities; the Communitarian cares about social/aesthetic externalities. The current system allows both to be cited as "grounds for refusal," which is why the system is stable but theoretically muddy.

  ### IV. The Three Alternatives: Concrete Implications

  Here is how the machinery would have to change if we replaced the implicit "Incumbent Proprietorship" theory with each of your three alternatives.

  #### Alternative 1: The "All Affected" Demos (Cosmopolitan Inclusion)
  *Theory:* Anyone materially affected by the decision, including potential residents and the regional homeless population, has standing.
  *   **Notice Rules:** Notice must be published regionally, not just mailed to adjacent owners. Notification must include housing advocacy groups and regional planning agencies.
  *   **Permissible Grounds for Refusal:** Local "character" and "property values" are inadmissible as they are particularistic harms. Refusal must be based on *net regional impact* (e.g., does this specific site create infrastructure costs exceeding tax revenue?). The *need* for the housing is a permissible ground for *approval* that outweighs local aesthetic objections.
  *   **Standard of Review on Appeal:** The burden of proof shifts. Instead of the developer proving no harm, the objectors must prove that the *regional* harm outweighs the *regional* benefit.
  *   **Level of Decision:** A hybrid panel. Local board retains initial hearing, but the final veto power rests with a regional body representing the broader demos.

  #### Alternative 2: Property Rights / Market (No Collective Decision)
  *Theory:* Land use is a private right. Collective interference is only justified by common-law nuisance.
  *   **Notice Rules:** No public notice required. Transactions are private. Neighbors are notified only if a variance from *objective* building codes (setbacks, height) is sought, but not for use.
  *   **Permissible Grounds for Refusal:** Only physical nuisances (noise, odor, hazardous waste, blocking of legal easements/light). "Character," "traffic congestion" (unless it blocks right-of-way), and "property values" are inadmissible.
  *   **Standard of Review on Appeal:** Strict scrutiny. Any denial is presumed a taking. The city must prove the restriction prevents a direct physical harm.
  *   **Level of Decision:** Administrative/Ministerial. If the project meets objective code, the clerk *must* issue the permit. No discretion, no hearing. Appeals go to civil court, not planning commission.

  #### Alternative 3: Regionalism (The Region as the Unit)
  *Theory:* Housing markets and labor sheds are regional. Neighborhoods are administrative subunits, not sovereign communities.
  *   **Notice Rules:** Notice is local, but the *parties* include a regional housing agency (like a strengthened version of California's HCD or MHDC).
  *   **Permissible Grounds for Refusal:** Local denials must be consistent with a Regional Housing Needs Allocation (RHNA). A project cannot be refused if it fulfills the city's mandated share of regional need, unless there is a specific site constraint (e.g., flood plain). "Neighborhood character" is subordinate to "Regional Compliance."
  *   **Standard of Review on Appeal:** "Builder's Remedy." If the city denies a compliant project, the regional body can approve it by right, overriding local zoning.
  *   **Level of Decision:** Local hearings remain, but the *authority* is delegated from the Region. The local board acts as an agent of the region, not a trustee of the neighborhood.

  ### V. Final Verdict on Coherence

  The current practice is **incoherent**.

  It claims the authority of the state (police power/general welfare) but exercises it through the logic of a private homeowners association (protecting incumbent amenity). It creates a **procedural mismatch**: it uses legislative goals (the Plan) to justify quasi-judicial exclusions (the Permit).

  *   If the goal is the **General Welfare**, the standing rules are unjust (excluding the welfare of the excluded).
  *   If the goal is **Property Protection**, the tool is too blunt (zoning regulates use, not just nuisance).
  *   If the goal is **Community Stability**, the mechanism is corrosive (it incentivizes exclusion to maintain stability).

  The machinery holds together only because the contradiction is obscured by the complexity of the process. The "General Welfare" is invoked to adopt the plan, and "Private Harm" is invoked to deny the permit. As long as these two tracks never meet in a single forum where they must be weighed against each other, the system functions. Your doctoral work, it seems, lies in forcing that meeting.
