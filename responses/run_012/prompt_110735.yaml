prompt: |-
  I've been going back and fourth on the procreation asymmetry for years, and the thing that bugs me is that everyone argues it case by case without ever saying what a theory of it would have to do to be any good. So before I read another EA forum take: give me the desiderata. Not a survey of who's said what, just the spec.

  What does any theory that wants to underwrite the asymmetry have to deliver? I want the list, with the case or consideration behind each item: the cases it has to get right (the miserable life it's wrong to start, the happy life nobody has to start, the existing person whose welfare we obviously do have to care about), the distinctions it can't collapse (creating vs. continuing, what's good for a person vs. what makes the world better, an asymmetry in reasons vs. an asymmetry in values), and the results it can't contradict (no repugnant conclusion, no story on which the never-conceived are deprived, no duty to breed, and once someone is here their welfare counts the same as anyone else's).

  Two things I especially want pinned down, since I suspect they're where it falls apart:

  1. Uncertainty. Imagine a coin: heads, the kid gets a wonderful life, tails, a life of unrelenting pain. The asymmetry seems to say the tails branch counts against and the heads branch doesn't count for, which makes the gamble look bad -- but every act of procreation is a gamble with some tail risk, so now I need a story for why having kids is OK at all. Is there a version of the asymmetry that survives this, or is asymmetry + risk + ordinary permissibility just an inconsistent set?

  2. Where the asymmetry stops. It's supposed to be about bringing someone into existence, not about making an existing person worse off, so at what point does the maybe-person become someone who can be made worse off -- conception, viability, birth, first preference? And does that answer also decide whether the asymmetry applies to minds we make instead of birth, like an AI we might train that might suffer?

  Flag any pair of desiderata you think can't be jointly satisfied -- that's the part I actually want. A table is fine.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The Procreation Asymmetry (Parfit's Non-Identity Problem context, Benatar's Asymmetry, etc.).
      *   **Goal:** Provide a list of *desiderata* (requirements/specifications) for a successful theory of the asymmetry.
      *   **Constraints:** No survey of existing literature/EA forum takes. Just the spec. Focus on cases, distinctions, and results.
      *   **Specific Focus:** Two tricky areas: Uncertainty/Risk and the Boundary/Threshold of the asymmetry.
      *   **Critical Task:** Flag any pairs of desiderata that might be inconsistent/incompatible (trade-offs).
      *   **Format:** List with cases/considerations, plus a table for inconsistencies if needed.

  2.  **Deconstruct the Procreation Asymmetry:**
      *   *Core Intuition:* We have a duty *not* to create miserable people, but no duty *to* create happy people.
      *   *The Problem:* Standard utilitarianism (Total View) says happy people add value, so we should create them (Repugnant Conclusion, Duty to Breed). Person-Affecting Views struggle to explain why creating a miserable person is wrong if that person wouldn't otherwise exist (Non-Identity Problem).
      *   *The User's Demand:* Don't tell me *who* said what. Tell me *what a theory needs to do* to work.

  3.  **Drafting the Desiderata (The "Spec"):**
      *   *Case 1: The Miserable Life.* Theory must say: Wrong to create. (Intuition: Harm).
      *   *Case 2: The Happy Life.* Theory must say: Permissible not to create. (Intuition: No duty to breed).
      *   *Case 3: The Existing Person.* Theory must say: Their welfare matters normally. (Intuition: Non-discrimination against the born).
      *   *Distinction 1: Creating vs. Continuing.* Theory must distinguish bringing into being vs. keeping in being.
      *   *Distinction 2: Good-for vs. Good-simpliciter.* Theory must separate what benefits a subject from what adds value to the universe.
      *   *Result 1: No Repugnant Conclusion.* Theory must avoid demanding massive populations of barely worth-living lives.
      *   *Result 2: No Deprivation of Non-Existent.* Theory must avoid saying non-existent people are "harmed" by not being born.
      *   *Result 3: Equality of Welfare.* Once existing, a person's pain/pleasure counts equally to anyone else's.

  4.  **Addressing the Two Specific "Stress Tests":**
      *   *1. Uncertainty/Risk:* If pain counts against creation but pleasure doesn't count for it, then *any* risk of pain makes creation irrational (unless risk is zero). But all life has risk.
          *   *Requirement:* Theory must explain how to weigh probabilistic harm vs. probabilistic benefit without collapsing into "never procreate" or "standard expected utility."
      *   *2. The Boundary:* When does the asymmetry switch off? Conception? Sentience? Birth?
          *   *Requirement:* Theory must define the threshold of "moral status" that triggers the asymmetry vs. standard person-affecting duties.
          *   *AI Angle:* Does this apply to digital minds? If so, the boundary isn't biological birth.

  5.  **Identifying Inconsistencies (The "Hard Part"):**
      *   *Risk vs. Permissibility:* If harm weighs heavily and benefit weighs lightly (asymmetry), then expected utility of procreation is likely negative given *any* non-zero risk of severe suffering. To allow permissibility, you either need to soften the asymmetry (undermining the core intuition) or ignore low-probability tail risks (undermining the "miserable life" intuition).
      *   *Non-Identity vs. Harm:* To say creating a miserable person is wrong, you usually need a "harm" account. But if they wouldn't exist otherwise, how are they harmed? (The Non-Identity Problem). A theory needs to explain "harm" without relying on comparative identity states that don't exist.
      *   *Threshold vs. Continuity:* If the asymmetry turns on at conception/sentience, does a fetus one moment before have no status? Sorites paradox issues.
      *   *Person-Affecting vs. Impersonal:* To avoid the Repugnant Conclusion, you often need person-affecting constraints. To explain why creating misery is wrong (when no one exists to be wronged), you often need impersonal values. Mixing them is notoriously difficult (Parfit's "Theory X").

  6.  **Refining the Output:**
      *   Structure:
          1.  Core Intuitions (The "Must-Haves").
          2.  Structural Distinctions (The "Mechanics").
          3.  The Two Stress Tests (Uncertainty & Boundaries).
          4.  The Incompatibility Matrix (The "Trade-offs").
      *   Tone: Analytical, precise, philosophical but accessible. No fluff.
      *   Check against constraints: Did I survey views? No. Did I give a list? Yes. Did I flag inconsistencies? Yes.

  7.  **Self-Correction/Polishing during drafting:**
      *   *Correction:* Make sure I don't accidentally advocate for Benatar. The user wants the *spec*, not a defense of Antinatalism.
      *   *Refinement on Risk:* The user specifically asked if "Asymmetry + Risk + Permissibility" is inconsistent. I need to be explicit about this tension.
      *   *Refinement on AI:* Ensure the boundary question explicitly covers non-biological minds as requested.
      *   *Formatting:* Use a table for the inconsistencies as suggested.

  8.  **Final Review against User Prompt:**
      *   "Give me the desiderata." -> Done.
      *   "Not a survey." -> Done.
      *   "List, with case/consideration." -> Done.
      *   "Two things I especially want pinned down (Uncertainty, Boundary)." -> Done.
      *   "Flag any pair of desiderata you think can't be jointly satisfied." -> Done.

  9.  (Mental Check of the "Inconsistency" claim): Is it truly impossible? Many philosophers think so (Parfit). I should frame it as "Tensions that often lead to collapse" rather than "Logically impossible," but be strong about the difficulty. The Risk/Permissibility tension is the strongest candidate for genuine inconsistency under strict asymmetry.

  10. **Final Polish:** Ensure clear headings and bullet points for readability. (Proceed to generate output).

  *(Self-Correction during drafting the response)*: I need to make sure I don't just list "No Repugnant Conclusion" but explain *why* it's a constraint on the theory (i.e., the theory shouldn't imply we must maximize population size). I also need to make sure the "Uncertainty" section directly addresses the "coin flip" scenario the user posed.

  Let's organize the inconsistencies carefully. The tension between "Harm counts, Benefit doesn't" and "Procreation is permissible" under risk is the big one. The tension between "Non-Identity" and "Wrong to Create Miserable" is the classic one.

  Okay, ready to write.cw
answer: |-
  Here is the specification sheet for a theory of the Procreation Asymmetry. This is not a summary of existing views, but a functional requirements document. If a theory fails any of these, it fails to capture the intuition it claims to defend.

  ### I. Core Case Constraints (The "Must-Cover" Scenarios)

  A viable theory must deliver the following verdicts on these specific cases without ad-hoc exceptions.

  | Case / Scenario | Required Verdict | Theoretical Burden |
  | :--- | :--- | :--- |
  | **The Miserable Life** | **Wrong** to create. | Must explain why bringing a suffering person into existence is a moral failure, even if that person is the only one affected. |
  | **The Happy Life** | **Permissible** not to create. | Must explain why failing to bring a happy person into existence is not a moral failure (no duty to breed). |
  | **The Existing Person** | **Equal Consideration.** | Once a person exists, their welfare must count equally with all others. The theory cannot discount the welfare of the born relative to the potentially born. |
  | **The Non-Existent** | **No Deprivation.** | The theory cannot claim that non-existent people are "harmed" or "deprived" by not being created. There is no subject to be deprived. |
  | **The Marginal Life** | **No Repugnant Conclusion.** | The theory must not imply we are obligated to create massive populations of lives that are barely worth living to maximize aggregate value. |

  ### II. Structural Distinctions (The "Mechanics")

  The theory must conceptually sustain these distinctions without collapsing them into one another.

  1.  **Creating vs. Continuing:**
      *   *Requirement:* The moral rules governing *bringing* a subject into existence must differ from the rules governing *keeping* a subject in existence.
      *   *Why:* If they are the same, we either have a duty to create all happy people (Total Utilitarianism) or no duty to avoid creating miserable people (if "harm" requires making an existing person worse off).
  2.  **Good-For vs. Good-Simpliciter:**
      *   *Requirement:* The theory must distinguish between "good for the person created" and "good for the world/state of affairs."
      *   *Why:* A happy life is *good for* the person, but the asymmetry claims it is not *good simpliciter* in a way that generates a duty to create. A miserable life is *bad for* the person and *bad simpliciter*.
  3.  **Reasons vs. Values:**
      *   *Requirement:* The theory must specify if the asymmetry is in *axiology* (happy lives add no value) or *deontology* (we have no duty to pursue the value happy lives add).
      *   *Why:* If happy lives add value but we have no duty to pursue it, we need a meta-ethical story about why value doesn't track obligation in this specific domain.

  ### III. The Two Stress Tests

  These are the specific pressure points you identified. A theory must have explicit handling for these.

  #### 1. The Uncertainty & Risk Constraint
  *   **The Problem:** If the presence of pain counts *against* creation and the presence of pleasure does not count *for* creation, then any non-zero probability of severe suffering renders the expected moral value of procreation negative.
  *   **The Requirement:** The theory must provide a **Risk Threshold Function**.
      *   It must explain how to aggregate probabilistic harm vs. probabilistic benefit.
      *   It must justify why ordinary risks (cancer, heartbreak, grief) do not trigger the "Miserable Life" prohibition, while severe risks do.
      *   *Crucially:* It cannot simply say "we ignore low probability tail risks" without undermining the "Miserable Life" constraint (since many miserable lives start as low-probability risks).
  *   **The Inconsistency Flag:** **Asymmetry + Risk + Permissibility.**
      *   If Harm > 0 and Benefit = 0 (in terms of generating duty), then Expected Value (EV) of procreation is always $\leq 0$.
      *   To make procreation permissible, the theory must either: (a) assign positive weight to potential pleasure (collapsing the asymmetry), or (b) claim the risk of misery is effectively zero (empirically false), or (c) introduce a deontological permission that overrides the axiological negative value (which requires a complex dual-structure).

  #### 2. The Boundary & Substrate Constraint
  *   **The Problem:** The asymmetry applies to "bringing into existence." But existence is a gradient (zygote -> fetus -> infant -> adult) and substrate is variable (biology -> AI).
  *   **The Requirement:** The theory must identify a **Moral Threshold of Subjecthood**.
      *   It must specify the exact point where the "Asymmetry Rules" switch to "Existing Person Rules."
      *   *Candidates:* Conception, Sentience, Viability, Birth, Self-Awareness.
      *   *AI Applicability:* The threshold cannot be biological. It must be functional (e.g., capacity for suffering). If the theory relies on "human birth," it fails the AI test. If it relies on "sentience," it must explain why aborting a sentient fetus is treated differently than creating a sentient AI.
  *   **The Inconsistency Flag:** **Sharp Boundary vs. Sorites.**
      *   If the asymmetry turns on at $T$ (e.g., sentience), a being at $T - \epsilon$ has no moral status regarding creation, but a being at $T + \epsilon$ does.
      *   If the theory admits a gradient of moral status, the asymmetry becomes a sliding scale, which dilutes the categorical intuition (that we have *no* duty to create happy people).

  ### IV. The Incompatibility Matrix

  Here are the pairs of desiderata that appear to be jointly unsatisfiable. A successful theory must explain how it dissolves these tensions rather than ignoring them.

  | Conflicting Desiderata | The Tension | Why it threatens the theory |
  | :--- | :--- | :--- |
  | **1. The Miserable Life Constraint** vs. **2. Ordinary Permissibility** | **The Risk Paradox.** | To satisfy (1), severe suffering must weigh heavily against creation. To satisfy (2), we must be allowed to create despite the risk of severe suffering. Under strict asymmetry, *any* weight of harm outweighs *zero* weight of benefit. |
  | **3. Non-Identity (No Deprivation)** vs. **4. Wrong to Create Miserable** | **The Non-Identity Problem.** | If the miserable person would not otherwise exist, in what sense are they wronged? If you say "they are harmed," you imply non-existence is a baseline state they are removed from (violating 3). If you say "the world is worse," you move toward impersonal views that often trigger the Repugnant Conclusion (violating 5). |
  | **5. No Duty to Breed** vs. **6. Equal Consideration** | **The Status Gap.** | If the welfare of existing people counts fully, but the potential welfare of future people counts partially (or not at all), you have two classes of moral patients. Explaining *why* existence confers this massive status boost without appealing to arbitrary metaphysics is difficult. |
  | **7. AI/Substrate Neutrality** vs. **8. Biological Intuitions** | **The Substrate Problem.** | Our intuitions about the asymmetry are evolved for biological birth (pregnancy costs, bonding). Applying the same logic to AI (copy-paste existence, no gestation) often breaks the "Creating vs. Continuing" distinction. If I can spin up an AI mind and delete it, is that "creating" or "continuing"? |

  ### V. Summary of the "Spec"

  To be considered successful, a theory of the Procreation Asymmetry must:

  1.  **Block the Duty to Breed** without rendering the creation of suffering permissible.
  2.  **Solve the Non-Identity Problem** without positing that non-existent people have interests.
  3.  **Define a Risk Algorithm** that allows for procreation despite the certainty of some suffering and the possibility of extreme suffering.
  4.  **Identify a Non-Arbitrary Threshold** for when a potential mind becomes an actual moral patient, applicable to both biology and AI.
  5.  **Reconcile the Value/Obligation Gap:** Explain why a happy life is *good* but not *required*, while a miserable life is *bad* and *forbidden*.

  **The Hard Truth:** Most philosophers (following Parfit) suspect that no single theory can satisfy all these desiderata simultaneously. The "Incompatibility Matrix" above represents the current state of the art: choosing which intuition to sacrifice. A theory that claims to satisfy all of them without trade-offs is likely hiding a contradiction in its definitions of "harm," "existence," or "value."
