answer: |-
  # Session Design: The Fidelity Trap

  ## Source Text Specifications
  Compose a four-line lyric in English with the following properties. Do not distribute this list to students.
  1.  **Meter:** Strict octosyllabic (8 syllables per line).
  2.  **Rhyme:** Couplet scheme (AABB).
  3.  **Lexical:** Contains one pun ambiguous in English (e.g., "current" as flow/time/electricity).
  4.  **Structural:** Contains a hidden name (e.g., acrostic or embedded string) essential to the poem's address.
  5.  **Semantic:** One line relies on a specific proper noun that resists synonym substitution without losing cultural resonance.

  *Note:* You must verify beforehand that no single version can satisfy all five properties simultaneously when constrained by the cards below.

  ## Materials and Brief Cards
  Prepare seven envelopes. Inside each, place a printed brief card. There are seven pairs of students; two envelopes must contain the **identical** brief (Twist 1).

  **Worked Example Card (Card 1):**
  > **COMMITMENT:** Preserve the Pun.
  > **INSTRUCTION:** Your version must retain the ambiguous word exactly as it appears in the source. You may alter meter, rhyme, or hidden structures to achieve this.
  > **PROHIBITION:** Do not explain the pun in a footnote. It must work in the text.

  **Other Cards (Summaries):**
  *   **Card 2:** (Identical to Card 1) Preserve the Pun.
  *   **Card 3:** Preserve the Meter (8 syllables exact).
  *   **Card 4:** Preserve the Rhyme Scheme (AABB).
  *   **Card 5:** Preserve the Hidden Name (must be decipherable).
  *   **Card 6:** Preserve the Proper Noun (exact wording).
  *   **Card 7:** Preserve the Tone (elegiac/urgent) over form.

  ## Rules of Engagement
  1.  **Anonymity:** Do not write names on drafts.
  2.  **Silence:** No discussing constraints between pairs during drafting.
  3.  **Voting:** You will vote for exactly one version to enter the anthology. The criterion is "Fidelity." You must define this yourself.
  4.  **Payoff:** The winning version becomes the official course handout next week. Each student submits a 100-word translator's note; these will be printed beneath the winning text.

  ## Timeline (90 Minutes)

  **00:00–00:05 | Introduction**
  Distribute the source text and envelopes. State the goal: produce a "faithful" version for the anthology. Do not define "faithful."

  **00:05–00:35 | Drafting**
  Pairs open envelopes. They have 30 minutes to produce one polished version. Circulate to ensure they are struggling, not chatting.

  **00:35–01:00 | Reading and Voting**
  Collect drafts. Read them aloud anonymously. Students vote by secret ballot for the single most "faithful" version. Tally votes publicly.

  **01:00–01:30 | The Reveals and Debrief**
  1.  Announce the winner.
  2.  **Twist 1 Reveal:** Ask Card 1 and Card 2 holders to stand. Reveal their briefs were identical. Discuss why their outputs differ.
  3.  **Twist 2 Reveal:** Reveal your Source Text Specifications. Admit the source is itself a translation of an earlier draft you discarded. The "original" is also a constrained version.
  4.  **Theoretical Mapping:** Connect experience to concepts (see Debrief).

  ## Debrief: Mapping Experience to Theory
  Use the students' frustration to ground the theory. Distinguish clearly between consensus and debate.

  **1. Fidelity as a Bundle (Settled)**
  *   **Moment:** The voting process.
  *   **Claim:** Students could not agree on one "faithful" version because fidelity is not a single vector. It is a bundle of incompatible demands (rhyme vs. sense vs. form).
  *   **Status:** **Settled.** Translation studies broadly agrees that equivalence is multidimensional and trade-offs are structural, not personal failures.

  **2. Constraint Underdetermination (Settled)**
  *   **Moment:** Twist 1 (Identical Cards).
  *   **Claim:** Even with identical instructions, solutions diverged.
  *   **Status:** **Settled.** Constraints do not dictate a single outcome; agency remains in how priorities are weighted during execution.

  **3. The Original as Translation (Contested)**
  *   **Moment:** Twist 2 (Source Text History).
  *   **Claim:** The source text was itself a solution to constraints, destabilizing the hierarchy of original/copy.
  *   **Status:** **Contested.** While genetic criticism accepts drafts, the ontological claim that *all* writing is translation (or that the "original" has no privilege) is debated. Use this to probe their discomfort.

  **4. Form/Content Inseparability (Contested)**
  *   **Moment:** The inability to keep the pun without breaking the meter.
  *   **Claim:** Changing the form changed the poem's identity.
  *   **Status:** **Contested.** Many theorists argue content can be extracted and re-clothed. Hofstadter argues they are fused. Do not present this as fact; present it as the tension they just felt.

  **5. Translation as Cognition (Contested)**
  *   **Moment:** The mental effort of reshaping English into English.
  *   **Claim:** This struggle models how the mind processes meaning itself.
  *   **Status:** **Contested.** Hofstadter's claim that translation is the core model of cognition is a substantive theoretical leap, not a consensus view. Frame it as a provocative hypothesis suggested by the exercise.

  ## Risk Analysis: Predictive Failures

  **1. Gaming the Vote (Aesthetics over Fidelity)**
  *   **Failure:** Students vote for the poem that sounds "best," ignoring the constraint briefs they held.
  *   **Handling:** During debrief, ask voters *why* they chose the winner. If they say "it flowed better," highlight that they prioritized aesthetic fluency over semantic fidelity. This proves the "bundle" claim: they silently dropped one demand to meet another. Do not correct them; expose their criteria.

  **2. Collapse into Taste**
  *   **Failure:** Argument arises over which version is "actually" better.
  *   **Handling:** Refuse to arbitrate taste. Redirect to constraints: "Which version kept its card's promise?" If two kept promises but clash, the conflict is structural. Remind them the anthology criterion was "faithful," not "beautiful."

  **3. Instructor Rescue (Lecturing)**
  *   **Failure:** You explain the theory before they feel the impossibility.
  *   **Handling:** Silence is your tool. During drafting, if asked "Can we change the rhyme?", answer: "You must follow your card." Let them hit the wall. Only introduce vocabulary (trade-off, indeterminacy) in the final 20 minutes.

  **4. The Winner's Curse**
  *   **Failure:** The winning pair feels validated; others feel defeated.
  *   **Handling:** Emphasize in the payoff that *all* translator's notes will be printed. The winning text is merely the one that survived the specific vote, not the "true" poem. The notes reveal the lost dimensions.

  ## Limitations: What This Cannot Reproduce
  Be honest with yourself and the class about the simulation's boundaries.

  **1. Interlingual Friction**
  This intralingual exercise removes the friction of untranslatable cultural concepts and grammatical mismatches between distinct languages. It isolates formal trade-offs but sanitizes the cultural loss inherent in cross-language translation.

  **2. Obsessive Proliferation**
  Hofstadter's work relies on months of tinkering and hundreds of versions. Ninety minutes forces heuristic shortcuts. Students will feel the *pressure* of trade-offs, but not the *depth* of discovery that comes from long-term obsession.

  **3. Ontological Claims**
  The activity simulates the feeling that form and content are inseparable. It does not prove it. Whether a poem *is* its form or merely *wears* it remains a philosophical question. The exercise demonstrates the practical cost of separating them, not the metaphysical impossibility.

  **4. The Cognition Model**
  While the activity mimics cognitive restructuring, it does not validate Hofstadter's broader claim that this process is identical to all thought. This is a metaphorical resonance, not empirical proof.

  ## Payoff Scheme
  No money changes hands. The capital is academic visibility.
  1.  **Publication:** The winning version is printed on the course handout next week.
  2.  **Attribution:** The text is credited to "The Seminar Collective."
  3.  **Notes:** Beneath the poem, print all fourteen 100-word translator's notes anonymously.
  4.  **Effect:** This visually demonstrates that the "same poem" requires multiple conflicting paratexts to be understood. The handout itself becomes an artifact of indeterminacy.
