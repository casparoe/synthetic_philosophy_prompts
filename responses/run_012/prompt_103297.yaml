answer: |-
  The film ultimately repudiates the authority of the precedent self by asserting that the persistence of emotional capacity renders the earlier self's judgment of unlivability factually wrong.

  The bathroom scene is a rig, but it is a rig that serves the film's thesis rather than dodging the question. By having Alice drop the pills due to interruption and subsequent forgetting rather than a conscious decision to live, the film denies the later self the agency required to override the directive, yet simultaneously denies the directive the efficacy required to be fulfilled. This staging supports the view that advance directives reliant on specific cognitive capacities collapse when those capacities dissolve. If the mechanism for executing the will requires a continuity of memory that the disease has severed, the directive becomes inert. The film argues that the earlier self's authority is contingent on the later self's ability to recognize that authority, and once that recognition is biologically impossible, the directive loses its moral grip not because the later self rejected it, but because the "self" who issued it no longer exists in a form capable of enforcing it.

  The conference speech dramatizes the continuity of identity to undermine the "stranger" argument often used to dismiss precedent autonomy. When Alice uses the highlighter to navigate her own text, she is not the earlier self speaking, nor is she a stranger impersonating her; she is the same person operating with degraded scaffolding. This weakens the psychological discontinuity claim because it shows that identity is not a binary switch but a dimming gradient. If the later Alice is still enough Alice to understand the significance of the speech and feel the pride of the audience, then the earlier Alice's wish to eliminate her is effectively a wish to eliminate herself. The film uses this scene to suggest that the critical interests of the earlier self are still present, just harder to access, which makes the directive look less like protection and more like premature self-destruction.

  The ending earns its rebuttal to the directive rather than relying on sentimental flattery, because it targets the epistemic limitation of the earlier self. The precedent autonomy view assumes the competent self can accurately predict the value of future experiences without those capacities. The film argues this is impossible. When Alice answers "love," she accesses a form of valuation that does not require the linguistic or semantic processing her earlier self deemed essential. The earlier Alice judged a life without cognition as worthless; the film shows a life without cognition that still contains value. This validates the present-interests view not by claiming the later self is rational, but by claiming the earlier self was ignorant of what constitutes a good life in a diminished state. The authority of the earlier self is undermined because its judgment was based on incomplete data about the phenomenology of decline.

  What the film shows that philosophical arguments miss is the texture of the gradient. Thought experiments rely on thresholds—competent versus incompetent, same person versus different person—but the film forces you to sit through the slope. You see the terror of the slide, which complicates the clean ethical division between respecting past wishes and protecting present welfare. The arguments treat the loss of self as an event; the film treats it as a process where the person is present for their own disappearance. This phenomenological reality resists the clean application of either position because it reveals that there is never a point where the earlier self is fully gone and the later self is fully distinct; they overlap in a way that makes binding orders feel like violence even when they feel like mercy.

  However, the film gets the philosophy wrong by isolating the patient from the relational ethics that usually ground advance directives. It focuses entirely on Alice's interiority and her right to exist, ignoring the burden on the family, which is a legitimate component of the critical interests the earlier self is supposed to protect. In reality, the authority of the earlier self often rests on sparing loved ones the trauma of witnessing total dissolution, not just on the patient's own experiential welfare. By romanticizing the late stage as peaceful and connected, the film sidesteps the harder ethical truth that the earlier self might have authority precisely because the later self's existence imposes costs on others that the later self cannot comprehend. The film wins the argument on personhood but loses it on care.
