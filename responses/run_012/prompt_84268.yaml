prompt: |-
  I'm a novelist — fourth book, secondary-world stuff — and my editor keeps telling me the rituals in my invented societies read like set dressing. She's right, and I think it's because I never asked what any of them are *for*. A friend who does behavioral ecology told me to stop thinking about customs and start thinking about signals. Some traits are indices, she said: they can't be faked because they're physically tied to the underlying quality (you can't fake being the biggest stag). Others are handicaps: they only pay off if you're good enough to afford the cost, which is why the price has to fall harder on low-quality signalers than high-quality ones. She also mentioned signals of need versus signals of quality, that a purely conventional gesture can still be honest while interests line up (cheap talk), and that signals rot over time as receivers learn to discount them. I nodded alot.

  Here's what I want. Put on your behavioral ecologist hat and your dramaturg hat, think carefully, and before you write anything, brainstorm a little about how signals fail in a world like mine. Then give me a procedure I can actually run on any ritual I invent — fifteen minutes, no theory, I'm definately not reading a textbook: ordered questions, what counts as an answer to each, where it says "this is just a cost, not a signal," where it says "cut this or go fix the economy," and where it hands the call back to me because it's an authorial question rather than a biological one. Then run it on three: the nine-day adolescent fast in the hills, the suitor's public gift of a season's spice harvest, and the daily stick of temple incense everyone burns. Make sure one of the three comes out somewhere I won't like — I'd rather find out now. And tell me what the procedure can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist (4th book, secondary world).
      *   **Problem:** Editor says rituals feel like "set dressing" (lack function/depth).
      *   **Insight:** Friend (behavioral ecologist) suggested viewing customs as *signals* (indices, handicaps, need vs. quality, signal rot).
      *   **Task:**
          1.  Brainstorm how signals fail in a secondary world context (Behavioral Ecologist + Dramaturg hats).
          2.  Create a 15-minute practical procedure (ordered questions, decision points, authorial call-backs).
          3.  Run the procedure on three specific rituals:
              *   Nine-day adolescent fast in the hills.
              *   Suitor's public gift of a season's spice harvest.
              *   Daily stick of temple incense everyone burns.
          4.  **Constraint:** One of the three must come out negatively ("somewhere I won't like").
          5.  **Constraint:** Explain what the procedure *can't* do.
      *   **Tone:** Professional, insightful, practical, no jargon-heavy theory (the user already knows the basics but wants application).

  2.  **Part 1: Brainstorming Signal Failure (Behavioral Ecologist + Dramaturg):**
      *   *Concept:* Signals aren't static. They evolve. In a story, static rituals are boring. Broken or evolving rituals create conflict.
      *   *Failure Mode 1: Inflation/Debasement.* If the cost drops or the reward increases, everyone signals. The signal loses meaning. (e.g., hyperinflation of currency, but for honor).
      *   *Failure Mode 2: Cheating/Mimicry.* Low-quality individuals find a loophole to fake the signal. (e.g., fake blood, bought spices).
      *   *Failure Mode 3: Environmental Shift.* The cost changes due to external factors. A drought makes a water-offering ritual impossible or deadly, changing its meaning from "piety" to "suicide."
      *   *Failure Mode 4: Receiver Apathy.* The audience stops caring. The signal no longer grants the social benefit.
      *   *Dramaturg Angle:* Failure = Plot. A ritual that *works* is background. A ritual that *fails* or is *contested* is scene work.

  3.  **Part 2: The Procedure (The "Signal Stress-Test"):**
      *   *Goal:* 15 minutes, actionable, no theory.
      *   *Structure:* 5 Steps.
      *   *Step 1: The Cost.* Who pays? What is lost? (Time, resources, pain, risk).
      *   *Step 2: The Benefit.* Who watches? What do they give back? (Status, mates, safety, trust).
      *   *Step 3: The Cheat.* Can a low-quality person fake this? If yes, why hasn't it collapsed?
      *   *Step 4: The Alternative.* What happens if you *don't* do it? (Ostracism? Death? Nothing?)
      *   *Step 5: The Drift.* How has this changed in the last generation?
      *   *Decision Points:* Need clear "Stop/Fix" markers.

  4.  **Part 3: Running the Procedure on the Three Rituals:**

      *   *Ritual 1: Nine-day adolescent fast in the hills.*
          *   *Cost:* High (starvation, exposure).
          *   *Benefit:* Adult status, community trust.
          *   *Cheat:* Sneaking food?
          *   *Analysis:* This is a classic Handicap. High risk ensures honesty.
          *   *Verdict:* Strong, but needs a specific failure mode to be interesting (e.g., kids are surviving *too* easily now). Let's make it work well but hint at tension.

      *   *Ritual 2: Suitor's public gift of a season's spice harvest.*
          *   *Cost:* Economic (losing income/food).
          *   *Benefit:* Mate selection, family alliance.
          *   *Cheat:* Borrowing spice? Buying on credit?
          *   *Analysis:* This is vulnerable to market fluctuations. If spice is plentiful, the signal means nothing. If scarce, only the rich can signal.
          *   *Verdict:* **This is the one the user won't like.** It's economically fragile. It signals wealth, not necessarily fitness or commitment. It's prone to inflation.

      *   *Ritual 3: Daily stick of temple incense everyone burns.*
          *   *Cost:* Low (conventional signal).
          *   *Benefit:* Group cohesion, "I am one of you."
          *   *Cheat:* Burning something else that smells similar?
          *   *Analysis:* This is "Cheap Talk" / Badge of membership. Only works if enforcement is high.
          *   *Verdict:* Functional as cohesion, but boring unless the incense supply is cut.

      *   *Refining the "Don't Like" Verdict:* I need to be harsh on one. The Spice Harvest feels the most vulnerable to "set dressing" accusations if the economy isn't tight. If spices are easy to get, it's just a transaction. If it's a "season's harvest," that's a huge cost. But does it signal *quality* or just *liquidity*? Let's hit the Spice Harvest hard. It signals wealth, which can be inherited, not earned. It's a weak signal of *personal* fitness.

      *   *Refining the Fast:* Let's make sure the Fast comes out robust but demanding specific logistical support in the text.
      *   *Refining the Incense:* Let's make this the "Cheap Talk" that works only because of surveillance.

      *   *Wait, I need to ensure one comes out "somewhere I won't like".*
          *   Option A: The Fast is biologically implausible (kids die too often).
          *   Option B: The Spice Gift is economically unstable (signals debt, not wealth).
          *   Option C: The Incense is meaningless (no one checks).
          *   *Decision:* The Spice Gift is the best candidate for a "fix your economy" verdict. It sounds romantic but falls apart under signal theory scrutiny regarding heritability vs. earned fitness.

  5.  **Part 4: Limitations of the Procedure:**
      *   It doesn't generate emotion.
      *   It doesn't account for historical inertia (things done just because).
      *   It assumes rational actors (people are irrational).

  6.  **Drafting the Content (Iterative refinement):**
      *   *Tone Check:* Keep it respectful of the craft. Use the ecologist terms but translate them to writer terms.
      *   *Procedure:* Make it a checklist.
      *   *Application:* Be specific. Don't just say "it works." Say "It works IF X."
      *   *The "Bad News":* Deliver it firmly but constructively.

      *(Self-Correction during drafting)*: I need to make sure I don't just lecture on signal theory. The user knows it. They want the *application*. The brainstorming section should be brief and focused on *failure*.
      *   *Brainstorming Focus:* Signal Rot. What happens when the receiver stops believing? What happens when the cost becomes too low?
      *   *Procedure:* Keep it to 5 questions.
      *   *The "Bad" Ritual:* The Spice Harvest. Why? Because "season's harvest" is a variable cost. If the harvest is good, everyone does it. Signal inflation. If bad, only the ultra-rich. It creates a class barrier, not a fitness barrier. It signals *liquidity*, not *quality*.

      *(Refining the "Bad" Verdict)*: I'll tell the user the Spice Harvest signals *wealth*, which is often inherited. In behavioral ecology, inherited resources are "low quality" signals of individual fitness unless there's a cost to *maintaining* them. If the suitor just hands over dad's spice, it's weak. I will advise them to cut it or change it to something the suitor *produced* or *risked*.

      *(Refining the Fast)*: This is a Handicap. It's good. But I need to point out the "Receiver" aspect. Who watches? If no one sees the suffering, the signal is wasted.

      *(Refining the Incense)*: This is a Badge. It's cheap. It only works if non-burners are punished.

      *(Final Polish)*: Ensure the "15-minute" constraint is respected (concise steps). Ensure the "what it can't do" section is honest.

  7.  **Final Review against constraints:**
      *   Brainstorm signal failure? Yes.
      *   Procedure (ordered questions, decision points)? Yes.
      *   Run on three rituals? Yes.
      *   One negative verdict? Yes (Spice).
      *   What procedure can't do? Yes.
      *   Tone: Ecologist + Dramaturg.

      *Let's write.*
answer: |-
  ### Part 1: How Signals Fail (Brainstorming)

  As a behavioral ecologist, I look for stability. As a dramaturg, I look for instability. In your world, rituals are stable signals *until* they aren't. Here is where they break, which is where your plot lives:

  1.  **Inflation (The Debasement):** If the cost of the signal drops (e.g., the hills become safer, the spice becomes easier to grow), low-quality individuals start signaling. The receivers (the community) stop trusting the signal. The ritual becomes empty noise. *Dramatic potential: Traditionalists vs. Reformers.*
  2.  **The Mimic (The Cheat):** A low-quality individual finds a loophole to fake the index. (e.g., fasting but secretly drinking calorie-dense water; buying spices on credit they can't repay). If the cheat spreads, the signal collapses. *Dramatic potential: A scandal exposing the cheat.*
  3.  **Receiver Apathy:** The audience stops granting the benefit. Maybe the adult status doesn't grant power anymore, or the marriage market has changed. If the payoff vanishes, the cost is no longer worth it. The ritual becomes "set dressing" because the characters stop caring. *Dramatic potential: A generation refusing to participate.*
  4.  **Environmental Mismatch:** The cost becomes too high due to external change (drought, war). A ritual that required giving away food during a famine becomes suicide. The society must adapt or die. *Dramatic potential: A leader demanding the ritual continue despite the cost.*

  ***

  ### Part 2: The 15-Minute Signal Stress-Test

  Do not overthink. Answer these five questions in order. If you hit a **STOP**, fix the ritual or your economy before writing the scene.

  **1. Who pays the cost, and what exactly is lost?**
  *   *Good Answer:* Specific resources (time, calories, money, risk of injury, social capital).
  *   *Bad Answer:* "Respect" or "Honor" (these are benefits, not costs).
  *   *Decision:* If the cost is negligible for *anyone*, mark this **CONVENTIONAL**. It requires enforcement to work. If the cost is high, mark **HANDICAP**.

  **2. Who is watching, and what do they give back?**
  *   *Good Answer:* A specific group (elders, mates, rivals) grants a specific benefit (status, mating rights, trade trust).
  *   *Bad Answer:* "The gods" (unless the gods visibly intervene) or "Everyone" (too vague).
  *   *Decision:* If there is no specific receiver granting a tangible benefit, **CUT THIS**. It is decoration.

  **3. Can a "low-quality" individual fake this?**
  *   *Good Answer:* No, it's physically impossible (Index), or too dangerous/expensive (Handicap).
  *   *Bad Answer:* Yes, if they lie/borrow/cheat.
  *   *Decision:* If "Yes," you must explain the **ENFORCEMENT MECHANISM** (shaming, inspection, magic). If you can't name the enforcement, **FIX THE ECONOMY** (make the resource harder to get) or **CHANGE THE RITUAL**.

  **4. What happens if you *don't* do it?**
  *   *Good Answer:* Ostracism, loss of rights, physical danger.
  *   *Bad Answer:* People think you're rude, or nothing.
  *   *Decision:* If the consequence is mild, this is a **HOBBY**, not a ritual. Raise the stakes or admit it's minor.

  **5. How has the cost changed in the last generation?**
  *   *Good Answer:* It's harder/easier now due to [plot event].
  *   *Bad Answer:* It's always been the same.
  *   *Decision:* If "Always the same," the ritual is background. If "Changed," the ritual is **PLOT**.

  ***

  ### Part 3: Running the Test

  Here is the audit of your three rituals.

  #### 1. The Nine-Day Adolescent Fast in the Hills
  *   **Cost:** High. Caloric deficit, exposure, predation risk. (Handicap)
  *   **Receiver:** The community/elders.
  *   **Benefit:** Legal adulthood, marriage rights, voice in council.
  *   **Cheat Potential:** Sneaking food.
  *   **Enforcement:** Isolation? Physical examination upon return (weight loss verification)?
  *   **Verdict:** **ROBUST.** This is a classic Handicap Signal. It works because it is hard to fake.
  *   **The Fix:** To keep it from being static, ensure the *environment* has changed. Are there new predators in the hills? Is food scarcer, making the fast deadly rather than just hard? If the hills are safe and game is plentiful, the signal is inflating.
  *   **Authorial Call:** You need to show the *inspection* upon return. If they just walk back in and everyone nods, the signal is weak. There must be a verification moment.

  #### 2. The Suitor's Public Gift of a Season's Spice Harvest
  *   **Cost:** Economic value of one season's harvest.
  *   **Receiver:** The bride's family / community.
  *   **Benefit:** Marriage alliance.
  *   **Cheat Potential:** **CRITICAL FAILURE.**
  *   **Analysis:** This signals *liquidity*, not *fitness*. A suitor can inherit this spice. He can borrow it. He can buy it with father's money. It does not prove *he* is a good provider, only that he has access to capital. In signal theory, this is vulnerable to "rent-seeking."
  *   **Verdict:** **CUT OR FIX.**
  *   **The Hard Truth:** As written, this reads like a dowry transaction, not a signal of individual quality. It feels like set dressing because it separates wealth from effort.
  *   **The Fix:** The suitor must *harvest* it himself under dangerous conditions, or the spice must be something only *he* can produce (e.g., from a tree he planted years ago). If it's just handing over a sack from the family storehouse, it tells us nothing about the suitor. It signals the *father's* quality, not the *son's*.
  *   **Economy Check:** If spice is abundant, this signal is worthless (inflation). If spice is rare, only the ultra-wealthy can signal, creating a caste system rather than a meritocracy.

  #### 3. The Daily Stick of Temple Incense Everyone Burns
  *   **Cost:** Low. Monetary cost of incense + time. (Conventional Signal)
  *   **Receiver:** Neighbors / Temple guards.
  *   **Benefit:** Social cohesion, "I am not a heretic."
  *   **Cheat Potential:** Burning scented wood that isn't temple incense.
  *   **Enforcement:** Smell is distinct. Neighbors watch.
  *   **Verdict:** **FUNCTIONAL BUT FRAGILE.** This is a "Badge of Membership." It is cheap talk, but honest because the cost of *not* doing it (persecution) is high.
  *   **The Fix:** This only works if there is a reason to hide. If everyone believes, everyone burns it, and it's boring. This ritual only becomes dramatic if someone *stops* burning it, or if the incense supply is cut (forcing people to choose: fake it or starve the ritual).
  *   **Authorial Call:** Use this for tension, not world-building. A character running out of incense is a crisis. A character burning the wrong kind is a clue.

  ***

  ### Part 4: What This Procedure Can't Do

  1.  **It Can't Generate Emotion:** A signal can be biologically honest and dramatically boring. Just because the Fast is a "valid" handicap doesn't mean the reader will care. You still need the character's internal experience of the hunger.
  2.  **It Can't Account for History:** Humans do things "because we always have." Sometimes rituals lose their function and persist as tradition. This procedure will tell you to cut those. You might choose to keep them for atmosphere, but know that your editor is right: they are set dressing. Own that choice.
  3.  **It Assumes Rational Actors:** People signal irrationally. They signal to the wrong audience. They signal when they should stay quiet. This test finds the *logic* of the society. It won't find the *pathology* of the individual, which is often where the story actually is.

  **Summary:** Your Fast is solid. Your Incense is a good tension tool. Your Spice Gift is the weak link—it signals inheritance, not merit. Fix the Spice, or your marriage plot will feel like a transaction, not a choice.
