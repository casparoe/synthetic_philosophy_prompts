answer: |-
  Here is a complete 90-minute discussion plan designed to bypass the "lecture fatigue" of a Tuesday afternoon and force students to confront the instability of their own intuitions.

  # Activity Title: "The Mars Contract"

  **Core Concept:** Students act as applicants for a colonization program. They must sign "Survival Waivers" for different travel methods. The stakes are a tangible reward (chocolate/tokens) designated for the "Survivor." The activity creates a sorites paradox (a slippery slope) where their criteria for "survival" shift until they contradict themselves.

  **Learning Objective:** By the end, students should feel the tension between *Identity* (all-or-nothing) and *Psychological Continuity* (degrees), specifically realizing that in fission cases, Identity fails but "what matters" remains.

  ---

  ## Materials List (Prep the night before)
  1.  **Red and Green Index Cards** (or just two colors of paper): 2 per student. (Green = "I Survive / I Board", Red = "I Die / I Refuse").
  2.  **The "Prize":** 1 large, nice chocolate bar (or equivalent high-value snack) per student, kept in a box at the front. *Crucial:* You also need **one single extra prize** to use as a prop for the Fission case.
  3.  **"Survival Waivers"**: Half-sheets of paper with a signature line. (Print 20).
  4.  **Whiteboard/Markers.**
  5.  **Slide Deck (Optional but recommended):** Simple slides with the Scenario Text so you don't have to talk too much.

  ---

  ## Minute-by-Minute Timeline

  ### 0:00 – 0:10: Setup & The Baseline (Whole Class)
  *   **Energy Check:** Do not start with "Who read the text?" Start with movement.
  *   **Instruction:** "Place the Green card on your desk. This means 'I am willing to board.' Place the Red card on your desk. This means 'I refuse to board because I will not survive.' Keep them hidden until I say show."
  *   **The Stake:** Place the box of chocolates on the front table. "This box is for the survivors. If you survive the trip to Mars, you get a chocolate. If you die, you don't."
  *   **Scenario 1 (The Plane):** "You board a normal plane. 10 hours later you land in Mars Colony."
      *   *Action:* Everyone shows Green. (Establishes baseline).
      *   *Board:* Write "Physical Continuity: 100%" | "Psych Continuity: 100%".

  ### 0:10 – 0:25: The Teletransporter (The Destroy Case)
  *   **Scenario 2:** "You step into a booth. It scans you. It destroys your body. It sends the data to Mars. A new body is printed with your exact memories and personality. It wakes up on Mars."
  *   **Action:** Students vote privately, then reveal cards simultaneously.
  *   **The Friction:** You will likely have a mix of Green and Red.
  *   **Task (Pairs):** "Find someone with a different color card than you. You have 3 minutes. Green must explain why the Mars person *is* them. Red must explain why the Mars person is *someone else*. Do not try to convert them; just listen."
  *   **Debrief (5 mins):** Ask one Red and one Green to summarize their partner's view.
      *   *TA Note:* Do not judge. Write "Identity Broken?" on the board next to Scenario 2.
      *   *Crucial Question:* Ask the Greens: "If the Mars person gets the chocolate, do they deserve it? Is it *your* chocolate?" (If they say yes, they are prioritizing Psychology over Physics).

  ### 0:25 – 0:45: The Fission Case (The "Two Survivors" Trap)
  *   **Setup:** Break into 4 groups of 4 students. Give each group **one single chocolate bar** (the prop prize).
  *   **Scenario 3:** "The machine malfunctions. It scans you. It does *not* destroy the original. It prints a copy on Mars. Both wake up. Both have your memories up to this second. Both claim the Prize."
  *   **Group Task:** "You are the Ethics Board. There is only **one** prize voucher. Who gets it?
      1.  The Original (Earth)?
      2.  The Copy (Mars)?
      3.  Flip a coin?
      4.  Break the voucher in half?
      *   *Constraint:* You must agree as a group. Write your decision on the Waiver."
  *   **Why this works:**
      *   If they give it to the Original: They admit the Copy is a different person (Identity is unique).
      *   If they flip a coin: They admit the Copy has an equal claim (Identity doesn't matter, Claims matter).
      *   If they split it: They admit survival is divisible (Degrees).
  *   **Report Back:** Ask each group for their verdict. Write them on the board. They will likely conflict.
  *   **The Trap:** If a group says "Original gets it," ask: "Why? They have the same memories. If the Original died 5 minutes later, would the Copy deserve nothing?"

  ### 0:45 – 0:60: The Degradation Dial (The Sorites)
  *   **Whole Class.** Return to cards.
  *   **Instruction:** "We are adjusting the machine fidelity."
  *   **Scenario 4 (99%):** "The Copy is perfect, except it forgets your childhood. It remembers everything from age 10 onward." (Vote).
  *   **Scenario 5 (50%):** "The Copy has your personality and skills, but no specific episodic memories. It knows *who* you are, but not *what* you did." (Vote).
  *   **Scenario 6 (The Swap):** "We replace your brain cells one by one with synthetic ones over 10 years. You never lose consciousness." (Vote).
  *   **Observation:** Watch the Greens turn to Red as the dial turns.
  *   **TA Intervention:** "Look at your cards. In Scenario 2 (Destroy), many said Green. In Scenario 5 (50% Memory), many say Red. But where is the line? At 90%? 85%? If survival is *Identity*, there must be a sharp line. If there is no sharp line, is Identity what you care about?"

  ### 0:60 – 0:75: The Branch Line (The Killer Move)
  *   **Whole Class.** This is the Parfit climax.
  *   **Scenario 7:** "You enter the booth. The Copy is made on Mars. The Copy is ready. But then, the Earth machine *does not* destroy you. You step out. You look at the Copy on the screen. Then, the Company says: 'Sorry, policy violation. We must destroy the Copy.' They kill the Mars person instantly."
  *   **Question:** "Is this outcome *worse* for you than Scenario 2 (where you were destroyed and the Copy lived)?"
  *   **Discussion:** Most will say Scenario 7 is *better* (because the Original lives).
  *   **The Follow-up:** "But in Scenario 2, someone with your mind lived. In Scenario 7, someone with your mind died. If what mattered was *your mind continuing*, why is 7 better than 2? If what mattered was *Identity*, why does 2 feel okay to the Greens?"
  *   **Goal:** Make them feel that the "Original Living" is a bonus, but the "Psychological Continuation" was the main meal.

  ### 0:75 – 0:90: The Debrief (Connecting to Theory)
  *   **Now** you can use the forbidden words.
  *   Map the activity to Parfit's text.
  *   See "Debrief Script" below.

  ---

  ## The Debrief Script (TA Guide)

  **1. Map the Activity to the Text (10 mins)**
  *   **Scenario 2 (Teletransporter):** "For those who voted Green here, you implicitly accepted Parfit's claim: **Identity is not what matters.** You cared that *someone* with your psychology survived, even if it wasn't numerically identical to your biological body."
  *   **Scenario 3 (Fission):** "This is the logical wedge. Identity is a one-to-one relation (I can only be one person). But in Fission, both survivors have an equal claim to your past. You can't be both. So, Identity fails. But *what matters* (Relation R) is present in both. This shows Relation R can branch; Identity cannot."
  *   **The Dial (Scenarios 4-6):** "Parfit argues survival is a matter of degree. Your hesitation on the 50% memory case shows you feel this. Identity is all-or-nothing (you either are or aren't me). But *connectedness* fades. If connectedness is what matters, then survival fades."

  **2. Address the "Copy Isn't Me" Objection (Predicted Pitfall)**
  *   *The Student:* "But the copy is just a copy! It's not *me*. I'd be dead."
  *   *Your Response:* "Okay, let's grant that. Let's say the Copy is a distinct person, 'Copy-You.'
      1.  Does Copy-You deserve to be punished for your crimes? (If yes, you treat them as you).
      2.  Does Copy-You have a right to your property? (If yes, you treat them as you).
      3.  **The Branch Line Question:** If we kill Copy-You immediately (Scenario 7), is that a tragedy? If Copy-You is just a 'thing,' killing them is like breaking a printer. But it feels like a murder. Why? Because they have *your* capacity for suffering.
      *   *Parfit's Point:* Even if they aren't *you* (Identity), they carry *what matters to you* (Relation R). So, strict Identity might be empty, but the survival of your psychology is still valuable."

  **3. What the Activity Can't Do (Honesty Check)**
  *   "This activity shows our intuitions are inconsistent. It doesn't prove Reductionism is *true* metaphysically. Parfit knows he can't prove the Copy *is* you. His point is normative: **We should not care** about the metaphysical fact of Identity if Relation R holds. We should treat the Copy as we treat ourselves. That's a moral choice, not just a logic puzzle."

  ---

  ## Troubleshooting & TA Tips

  **1. The "Sleepy Tuesday" Problem**
  *   **Fix:** The card voting (Green/Red) requires physical movement. Enforce it. "Hold them up high."
  *   **Fix:** The Group Task (Fission) forces peer-to-peer talk. Walk around and listen. If a group is quiet, ask: "Who in this group is willing to let the Copy take the chocolate?"

  **2. The "Metaphysical Dig-In" (The Objector)**
  *   *Risk:* One student insists "Soul/Identity is absolute" and refuses to engage with the degrees.
  *   *Fix:* Don't fight metaphysics. Pivot to **pragmatics**. "Okay, assume you are right. You are unique. But the Copy *thinks* it's you. The Copy *feels* your pain. If we deny the Copy the chocolate, does the Copy suffer? If yes, do we care about that suffering? Parfit says we should care about the suffering even if the Identity claim is false."

  **3. Running Out of Time**
  *   **Cut:** If you are behind, shorten the "Dial" (Scenarios 4-6). Do 99% and 50% only.
  *   **Cut:** Do not let the Fission groups debate for more than 15 minutes. The point is the *conflict*, not the consensus.

  **4. The "So What?" Question**
  *   *Student:* "This is cool, but why does it matter for real life?"
  *   *Answer:* "It matters for how we view our future selves. If survival is degrees, saving for retirement is like giving money to a stranger who is *very similar* to you. It changes how we view fear of death, altruism, and commitment. Parfit thinks realizing this makes us less selfish and less afraid."

  ---

  ## Why This Works for Parfit
  1.  **No Jargon:** You avoid "Reductionism" until the end, so they don't tune out.
  2.  **The Fission Case:** This is the strongest logical argument Parfit has, and making them *decide* who gets the chocolate forces them to live the contradiction.
  3.  **The Branch Line:** This neutralizes the "Original is Special" intuition by showing that the Copy's death feels like a loss even if the Original lives.
  4.  **Tangible Stakes:** Chocolate is silly, but the *designation* of the prize mimics the "What Matters" question concretely.

  **Final Prep Note:** Bring extra chocolates. If the activity works, they will be anxious. Sugar helps. Good luck.
