          1.  The Anti-Aging Scene (Rapamycin, tech billionaires, life extension).
          2.  Retirement Policy & Elder Care (Working longer, care homes, robots).
          3.  Plural Voting for Parents (Shifting political weight away from the old).
      *   **Requirements:**
          *   Determine his reaction (fulfillment vs. betrayal, approval vs. disapproval).
          *   Explain *why* based on his philosophy in *De Senectute* (and broader Ciceronian thought).
          *   Check for consistency across the three answers (do they hang together?).
          *   Flag extrapolations (where we are guessing beyond the text).
          *   Tone: Analytical, nuanced, historically grounded but engaging.

  2.  **Deconstruct Cicero's *De Senectute*:**
      *   **Core Argument:** Old age is not inherently bad. Its burdens are exaggerated.
      *   **Key Virtues:** Wisdom, reason, self-control, duty to the state (*res publica*), acceptance of nature.
      *   **View on Death:** Natural, inevitable, not to be feared. The soul is immortal (Platonic influence).
      *   **View on Pleasure:** Suspicious of bodily pleasures (*voluptas*). They cloud judgment. The best life is one of the mind.
      *   **View on Nature:** Follow nature (*naturam sequi*). Fighting nature is futile and impious.
      *   **Social Role:** Elders should guide the young, participate in counsel, but step back from physical exertion.
      *   **Political Context:** Republican virtue, service to the state, stability, hierarchy based on merit/experience.

  3.  **Analyze Topic 1: Anti-Aging/Longevity:**
      *   *The Tech:* Rapamycin, metabolic hacking, "curing" aging.
      *   *Cicero's Likely Reaction:*
          *   *Positive:* Health is good if it allows continued service to the state. Keeping "wits" sharp aligns with his focus on mental vigor.
          *   *Negative:* Obsession with the body (*corpus*) over the soul (*animus*). Fear of death is irrational. Trying to cheat nature is hubris. The rich buying extra time looks like luxury/excess (*luxuria*), which he despised.
          *   *Verdict:* Mostly a betrayal. He argues for *accepting* old age with dignity, not *eliminating* it. The goal is a good life, not an endless one.
      *   *Extrapolation Flag:* Cicero didn't know modern medicine. Would he see pills as "medicine" (good) or "sorcery/vain hope" (bad)? Likely the latter if the goal is immortality.

  4.  **Analyze Topic 2: Retirement & Elder Care:**
      *   *The Policy:* Raising retirement age, working longer.
      *   *Cicero's Likely Reaction:*
          *   *Positive:* He argues elders *should* remain active in counsel and governance. Cato (the protagonist) says he never stopped working. Forced idleness is bad.
          *   *Negative:* Working for *wages* vs. working for *duty*. If they work because they are poor, that's a failure of the state/family. Care homes/robots? Abandonment of filial piety (*pietas*). Children should care for parents.
          *   *Verdict:* Mixed. Working longer = Good (if voluntary/counsel). Care homes/robots = Bad (violation of family duty).
      *   *Extrapolation Flag:* The concept of "retirement" didn't exist. He assumes a patron-client/family structure.

  5.  **Analyze Topic 3: Plural Voting for Parents:**
      *   *The Policy:* Parents get extra votes for kids. Shifts power from old to young/families.
      *   *Cicero's Likely Reaction:*
          *   *Positive:* Encourages reproduction (good for the state). Values the future.
          *   *Negative:* Undermines the authority of experience (*auctoritas*). The Senate (old men) should guide the Republic. Democracy was already suspect to him (mob rule). Diluting the vote of the experienced in favor of the unborn/children seems chaotic.
          *   *Verdict:* Likely Negative. He values the wisdom of age guiding the energy of youth. Shifting power *away* from the old undermines the natural hierarchy he defends in *De Senectute*.
      *   *Extrapolation Flag:* Cicero was an elitist republican, not a democrat. His view on voting is filtered through the *comitia* and Senate dynamics.

  6.  **Synthesize and Check Consistency:**
      *   *Theme:* Acceptance of Nature + Duty to State + Primacy of Mind over Body.
      *   *Consistency Check:*
          *   Anti-aging (Reject): Fighting nature, focusing on body.
          *   Care Homes (Reject): Abandoning duty/family.
          *   Working Longer (Accept): Fulfilling duty.
          *   Parent Voting (Reject): Undermining the authority of age/experience.
      *   *Tension:* Is he against the old losing power (Voting) but okay with them working longer? Yes, because work is duty, voting power is about *auctoritas* (authority).
      *   *Tension:* Is he against anti-aging but okay with working longer? Yes, one is cheating death, the is using remaining life virtuously.
      *   *Overall:* He lands on a "Stoic-Republican" consistency. The goal is a virtuous life within natural bounds, serving the community, respecting hierarchy.

  7.  **Drafting the Response (Iterative refinement):**
