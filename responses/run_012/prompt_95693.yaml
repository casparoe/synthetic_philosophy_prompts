      *   *Section 1 (Longevity):* Focus on the "Fear of Death" and "Body vs. Mind." Use the Cato character. Highlight the hubris of cheating nature.
      *   *Section 2 (Policy/Care):* Distinguish between *activity* (good) and *necessity* (bad). Hammer the point on *Pietas* (family duty) regarding care homes.
