answer: |-
  1. The king's defenders embody Pascal's view that justice is what is established, citing the 1791 Constitution's inviolability, while the Convention wields force to overwrite custom with a new political imagination.
  2. Pascal explains the Convention's refusal to appeal to the people as a necessary consolidation of force, ensuring that the strong new authority passes for just without risking the disputed reasoning of a popular vote.
  3. However, Pascal's warning that declaring laws unjust is dangerous misdescribes the episode, since the Convention destabilized the old order precisely by convincing the people that the established laws were tyrannical.
  4. The trial confirms Pascal's claim that authority rests on imagination and force rather than reason, as the Convention relied on the myth of the Nation rather than legal precedent to justify execution. However, it refutes his assumption that such foundations must be ancient, showing they can be manufactured instantly during a revolution.
  5. Pascal predicts that a legislature sitting as court exposes the arbitrary nature of law and risks disobedience, yet the Convention survived by substituting the sovereign will of the People for the inviolability of the King. This appeal to a justice not yet established shows that political order can endure the revelation of its forceful origins if a new source of legitimacy is immediately invoked.
