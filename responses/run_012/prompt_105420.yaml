      *   *Wait, did Nozick ever accept closure?* No, *Philosophical Explanations* is famous for rejecting it to handle skepticism.
      *   *Did he call it JTB+4?* No, he proposed four conditions total, replacing Justification. Condition 3 is Sensitivity, Condition 4 is Adherence.
      *   *Grandmother Case:* If the family lies to her if the grandson dies, she believes he's alive either way. So: If ~P (dead), she believes P (alive). Sensitivity fails. So she doesn't know. The notes say "Nozick has to say she knows." This is definitely wrong.
      *   *Lucky Beliefs:* The notes say tracking is "too weak" (implies counting non-knowledge as knowledge). The Grandmother case is usually used to show tracking is too *strong* (denying knowledge). However, there are cases where Sensitivity allows luck (e.g., believing a true proposition via a method that is sensitive but unreliable in nearby worlds? No, usually the critique is that Sensitivity is *too strong*). Actually, the "lucky belief" critique often targets the fact that Sensitivity doesn't rule out all Gettier cases. But the specific logic in the notes ("Grandmother... shows tracking is too weak... so he lets lucky beliefs count") is internally inconsistent given the actual Grandmother verdict. I need to point out this confusion.

