prompt: |-
  I am a postdoc working on the foundations of game theory, and next month I am presenting a working paper at a half-day workshop whose audience is split three ways. I want a Q&A preparation sheet for the question period, not a summary or a defense of the paper.

  The thesis I will defend is this. The solution concept standardly called program equilibrium — two agents each submit a program, each program is handed the other's source code before it chooses an action, and a pair of programs is in equilibrium when neither agent could have got a better payoff by submitting a different program — is not a solution concept at all. It is a self-reference argument wearing the clothes of an equilibrium argument. My claim is that every one of its striking results, including the mutual cooperation in a one-shot Prisoner's Dilemma that is always the headline, depends on reading program as source code that the opponent can actually simulate, and that under that reading the fixed point is not located in the space of strategies but in the relation between what program A outputs and what program B's simulation of A outputs. Make that explicit and the equilibrium framing looks like a misnomer doing rhetorical work: it lets the results inherit the credibility of Nash equilibrium while the real work is done by shared simulation plus the strength of the agents' proof system, which the standard presentation leaves implicit. My positive proposal is to reformulate the concept as a fixed point in the closure of what each agent can prove about the other's specification. That makes proof-theoretic strength an explicit parameter, and I argue it licenses cooperation in some games where the standard concept forbids it and forbids it in some where the standard concept licenses it.

  The audience, whom I need you to model precisely:

  - Roughly eight game theorists, most of them working on the epistemic foundations of solution concepts. They think a concept earns its keep only when it can be characterised as a fixed point of beliefs plus rationality, or recovered as the limit of a learning process, and they are unimpressed by concepts that can only be stated.
  - Three researchers from an AI safety group who work on multi-agent interaction between systems that are not given access to one another's code. They will care about what survives when the assumptions are relaxed and will be allergic to results that hold only for logically omniscient reasoners.
  - One programming-languages person who does program verification, who will care about the difference between a proof existing and a proof being findable within a resource budget.

  I want the objections I will actually get from each of these groups, ordered by how much damage they do, each phrased the way that group would phrase it. For each: a two-minute reply, and a note on where that reply is soft. Tell me what I should concede at the outset, which objection I should not try to win, and which single exchange has to go my way for the paper to be received as making a contribution rather than re-describing a known trick. Finish with the question I am hoping nobody asks. I will supply the references myself; you need not cite anything.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A preparation sheet:

  1.  **Analyze the Request:**
      *   **User:** Postdoc in foundations of game theory.
      *   **Task:** Create a Q&A preparation sheet for a workshop presentation.
      *   **Topic:** Critiquing "Program Equilibrium" (Tennenholtz, etc.) as a misnamed self-reference argument rather than a true solution concept. Proposing a reformulation based on proof-theoretic fixed points (explicit proof strength).
      *   **Audience:**
          1.  ~8 Game Theorists (Epistemic foundations, fixed points of beliefs/rationality, learning limits).
          2.  ~3 AI Safety Researchers (Multi-agent interaction, no code access, robustness to assumptions, logical omniscience).
          3.  ~1 PL/Verification Researcher (Proof existence vs. findability, resource bounds).
      *   **Constraints:** No summary/defense. Focus on objections, replies, soft spots. Order by damage. Include concessions, "must-win" exchange, and the "hope nobody asks" question.
      *   **Tone:** Professional, precise, academic, strategic.

  2.  **Deconstruct the Thesis:**
      *   *Claim:* Program Equilibrium (PE) isn't an equilibrium concept; it's a self-reference/simulation trick.
      *   *Mechanism:* PE relies on source code access + simulation. The fixed point is in the *relation* between output and simulated output, not strategy space.
      *   *Hidden Parameter:* Proof system strength (logical omniscience).
      *   *Proposal:* Reformulate as a fixed point in the closure of provable statements about specifications. Makes proof strength explicit.
      *   *Result:* Changes cooperation conditions (allows some, forbids others compared to standard PE).

  3.  **Model the Audience & Anticipate Objections:**

      *   **Group 1: Game Theorists (Epistemic Foundations)**
          *   *Values:* Rigorous definition, connection to beliefs/rationality, learning justification.
          *   *Objection:* "If it's not an equilibrium, what is it? If you reformulate it as provability, haven't you just built a new epistemic type space? Why isn't this just 'Rationalizability with logical constraints'?"
          *   *Damage:* High. If they say it's just old wine in new bottles, the contribution vanishes.
          *   *Phrasing:* "You're dissolving the concept rather than refining it. Where is the belief hierarchy?"

      *   **Group 2: AI Safety (Multi-agent, No Code Access)**
          *   *Values:* Robustness, realistic assumptions, bounded rationality.
          *   *Objection:* "Source code access is the fantasy. If you remove that, does your proof-theoretic version survive? Also, logical omniscience is a non-starter for real agents."
          *   *Damage:* Medium-High. They might dismiss the whole line of inquiry as irrelevant to real AI.
          *   *Phrasing:* "This assumes agents can read and verify code. In the wild, we have black boxes. Does your 'proof strength' parameter help there?"

      *   **Group 3: PL/Verification**
          *   *Values:* Computability, complexity, existence vs. construction.
          *   *Objection:* "Finding the proof is undecidable or intractable. You make proof strength explicit, but do you address the cost of finding the proof?"
          *   *Damage:* Medium. Technical nitpick, but could undermine feasibility.
          *   *Phrasing:* "You parameterize proof strength, but is the fixed point computable? Halting problem issues?"

  4.  **Drafting the Objections & Replies (Iterative Process):**

      *   *Drafting GT Objection:* They will hate the "not a solution concept" claim. They want to know if it maps to a belief structure.
      *   *Drafting AI Safety Objection:* They will attack the "source code" assumption. They care about *transparent* vs *opaque* agents.
      *   *Drafting PL Objection:* They will attack the *feasibility* of the proof search.

      *   *Refining the "Must-Win":* The paper needs to establish that *proof strength matters*. If the audience thinks proof strength is irrelevant (i.e., standard PE covers all cases), the paper fails. The "Must-Win" is showing that PE is ambiguous without specifying the proof system.
      *   *Refining the "Concession":* Admit that PE *works* as a mechanism, just not as a foundational concept. Don't fight the utility, fight the interpretation.
      *   *Refining the "Hope Nobody Asks":* Something that exposes a gap in the positive proposal. Maybe about how agents *agree* on a proof system.

  5.  **Structuring the Document:**
      *   Header: Context/Thesis reminder (brief).
      *   Section 1: Concessions (Pre-emptive).
      *   Section 2: Objections by Group (Ordered by Damage).
          *   Objection Text (in their voice).
          *   Damage Assessment.
          *   2-Minute Reply.
          *   Soft Spot.
      *   Section 3: Strategic Priorities (Must-Win, Don't Fight).
      *   Section 4: The "Doomsday" Question.

  6.  **Fleshing out the Content (incorporating specific nuances):**

      *   *GT Objection:* Focus on "Epistemic Characterization." If it's not beliefs, is it just mechanics?
      *   *AI Safety Objection:* Focus on "Logical Omniscience." Real agents can't prove everything.
      *   *PL Objection:* Focus on "Constructivity." Can you actually find the equilibrium program?
      *   *Must-Win:* The claim that PE results vary by proof system. This is the core novelty.
      *   *Don't Fight:* Whether PE is useful for mechanism design. It is. Just not foundational.
      *   *Doomsday:* How do agents coordinate on the proof system *before* the game? (Regress problem).

  7.  **Review against Constraints:**
      *   No citations? Check.
      *   Specific audience modeling? Check.
