      *   *Hard vs. Soft:* This is the biggest philosophical vulnerability. If empirical data contradicts, does Kant retreat to "it's an ideal"? Yes, often. Is that a dodge? In Kantian terms, no (Regulative Idea). In IR terms, yes (Theory failure).
      *   *Distinctiveness:* How is this different from Liberal Institutionalism or Commercial Realism? Kant adds the *moral necessity* and the *teleological guarantee* (Nature).
