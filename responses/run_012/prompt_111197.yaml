answer: |-
  ### Root and First Cut

  The central tension isn't whether technology affects politics, but whether that effect survives the user's intent. The root question must be: **Can the artifact sustain opposing political uses without modification?** If yes, politics is external (use/design); if no, politics is internal (material/system). This first cut separates the instrumentalists, who see tools as neutral conduits, from everyone else who sees constraints embedded in the thing itself. It avoids the trap of asking "who is responsible?" prematurely, forcing us to locate the capacity for constraint before assigning blame. If the artifact itself blocks certain futures regardless of who holds it, we are in the realm of material politics; if not, we are in the realm of social negotiation. This split dictates whether we analyze the code and concrete or the committee and the context.

  ### The Tree

  **Q1: Can the artifact sustain opposing political uses without modification?**
  *   **Yes:** **Q2: Is the design process politically neutral?**
      *   **Yes:** **Instrumentalism/Neutrality.** The artifact is a passive tool; politics enters only via user intent.
          *   *Awkward Commitment:* Ignores how design choices (like default settings) pre-load outcomes.
          *   *Case:* QWERTY (seen merely as a typing tool).
      *   **No:** **Social Construction of Technology (SCOT).** Politics is frozen negotiation during design; the artifact is a stabilized social agreement.
          *   *Awkward Commitment:* Politics vanishes once the artifact is built and used.
          *   *Case:* QWERTY (seen as a locked-in standard from typewriter wars).
  *   **No:** **Q3: Does the artifact physically require a specific social order to function?**
      *   **Yes:** **Winner's First Sense (Technical Arrangements).** Specific technologies necessitate specific authority structures to operate safely/efficiently.
          *   *Awkward Commitment:* Claims physical laws mandate hierarchy (e.g., nuclear safety requires authoritarianism).
          *   *Case:* Nuclear Power vs. Decentralized Solar.
      *   **No:** **Q4: Is the politics in the single object or the background system?**
          *   **System:** **Infrastructure Studies.** Politics lives in standards, protocols, and invisibility rather than the single device.
              *   *Awkward Commitment:* Hard to pinpoint responsibility for harm within the cloud of standards.
              *   *Case:* Recommendation Feeds (algorithmic standards).
          *   **Object:** **Q5: Does the object compel behavior or merely bias perception?**
              *   **Compel:** **Latour-style Delegation.** Morality is delegated to matter; the object enforces norms physically.
                  *   *Awkward Commitment:* Reduces moral agency to physics (the speed bump *makes* you slow down).
                  *   *Case:* The Speed Bump (sleeping policeman).
              *   **Bias:** **Q6: Is the bias inevitable across contexts or context-dependent?**
                  *   **Inevitable:** **Technological Determinism / Winner's Second Sense (Requires).** The artifact inherently demands a political order regardless of context.
                      *   *Awkward Commitment:* Human agency is illusory; technology drives history unilaterally.
                      *   *Case:* Parkway Bridges (claimed to inherently block buses/exclude poor). *Note: Historically disputed.*
                  *   **Context-Dependent:** **Postphenomenology / Winner's Second Sense (Compatible).** The artifact mediates experience and is compatible with certain politics but not strictly requiring them.
                      *   *Awkward Commitment:* Distinction from Determinism relies on subtle degrees of constraint.
                      *   *Case:* Recommendation Feeds (bias attention but don't force voting).

  ### Empty Branches

  Several logical combinations remain uninhabited, likely because they are incoherent or politically useless. The most glaring is **Instrumental Infrastructure**: the claim that background systems (like TCP/IP or ranking algorithms) are neutral while single tools are not. This is rarely defended because infrastructure studies specifically arose to show how standards encode power more deeply than devices. Conversely, **Deterministic SCOT** is empty; one cannot argue that design is purely social negotiation while simultaneously claiming the resulting artifact inevitably dictates history regardless of context. That collapses into Determinism.

  There is also no stable position for **Inherent Neutrality in Use**: the idea that an artifact requires a specific social order (Winner 1) but can be used for opposing ends without modification. This is logically contradictory; if it *requires* an order, it cannot sustain opposing uses. Finally, **Compelling Context-Dependence** (Latourian coercion that only works sometimes) is unstable. If the object compels behavior, it should do so reliably; if it depends on context, it is mediating, not compelling. These branches remain empty because they dissolve under the weight of their own definitions.

  ### Leaves I Can't Pull Apart

  I must flag that **Winner's Second Sense (Compatible)** and **Postphenomenological Mediation** are functionally indistinguishable in this tree. Both argue that artifacts bias experience and make certain political outcomes more likely without strictly necessitating them. Winner describes this as artifacts being "compatible" with certain social orders; Postphenomenology describes it as "multistable mediation." The distinction is genealogical, not logical. Winner comes from political theory looking at things; Postphenomenology comes from phenomenology looking at experience. In the case of recommendation feeds, both leaves predict the same outcome: the feed structures attention in ways that favor polarization, but doesn't strictly force it. Keeping them separate risks pretending there is a substantive theoretical difference where there is only a disciplinary one. They should likely be merged into a single "Material Bias" category.

  ### Where I Come Down

  I argue that **Infrastructure Studies** combined with **Postphenomenological Mediation** is the only position that survives the recommendation-feed case without collapsing into determinism or naivety. Technological Determinism doesn't belong on this tree; it answers a historical question (does tech drive history?) rather than a ontological one (where is the politics?). Determinism is too blunt for feeds; users *can* resist, but the friction is engineered to be exhausting.

  Your framing (artifact vs. design vs. use) smuggles in a separation that doesn't exist. The politics is in the **sociotechnical relation**. For the feeds, I defend the view that the ranking objective (watch time) is an infrastructural standard that mediates human attention, making democratic deliberation less likely without making it impossible. It is not the bridge (Winner 2-Requires) because you can scroll mindfully; it is not neutral (Instrumentalism) because the friction is asymmetrical. The politics lives in the *feedback loop*, not the code alone. Stop asking if the artifact has politics; ask how the artifact transforms the subject.
