      *   (4) Trading assumptions for others with same predictions doesn't change what the theory says. (The crucial leap).
      *   (5) Predictively equivalent models are the *same* model. (Empirical equivalence = theoretical identity).
      *   (6) *Reductio*: Coin-flip agents $\neq$ Utility agents. Therefore, F-twist is wrong.

