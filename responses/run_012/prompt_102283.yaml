  *(Final Verdict Thought)*: The vocabulary doesn't lack "aboutness." It defines "aboutness" causally. The philosophy wants "aboutness" non-causally. So the vocabulary doesn't have a gap; it has a *definition* that excludes the philosophical move. The verdict should reflect that the philosophy relies on a distinction (reference vs. causation) that engineering considers a bug.

