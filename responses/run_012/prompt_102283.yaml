  9.  **Final Polish:** Check against constraints (no lookups, no citations). Ensure the mapping is consistent throughout. (e.g., stick to `experience_buffer` and `processing_pipeline`).

  *(Self-Correction on Probe 1)*: Wait, if the shadow copy is written by the *same upstream process* that writes the main register, is it inert? Yes, if nothing reads it. But is it distinct from the main register? In hardware, they are different memory addresses. In philosophy, they are different ontological categories. The translation holds if we treat them as distinct memory regions. The cost is that the "shadow" region is unreachable memory.

