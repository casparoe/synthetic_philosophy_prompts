  2.  **Deconstruct Epiphenomenalism into Observability Terms:**
      *   *Phenomenal State (Qualia):* A specific state in a subsystem (let's call it the `experience_buffer`). It exists, has values, but is write-only from the perspective of the rest of the system.
      *   *Neural Correlate (Physical Brain State):* The `processing_pipeline`. This does the actual work. It reads inputs, computes logic, drives outputs.
      *   *Report/Utterance:* A log line or metric emission (`emit("I see red")`).
      *   *Causal Closure:* Every log line must be triggered by a signal flowing through the `processing_pipeline`. The `experience_buffer` never triggers an interrupt, never writes to a register read by the logger.
      *   *The Claim:* The `experience_buffer` fills up (e.g., `color = red`), but the `processing_pipeline` writes the log line based *only* on its own internal state, which happens to correlate perfectly with the `experience_buffer` due to a common upstream cause (the stimulus), but the `experience_buffer` itself contributes zero bits to the decision to log.

  3.  **Drafting the Translation (Mental Sandbox):**
      *   *Standard View:* Input $\to$ Process $\to$ Experience $\to$ Report.
      *   *Epiphenomenalist View:* Input $\to$ Process $\to$ Report. Input $\to$ Experience (Side Channel).
      *   *Problem:* In observability, if I log "Error 500", the log is caused by the error condition. If the "feeling of error" didn't cause the log, why does the log say "I feel error"?
      *   *Mapping:* The `processing_pipeline` has a state variable `internal_status`. The `experience_buffer` has `qualia_status`. They are set in parallel by `input_handler`. The `logger` reads `internal_status`. The `qualia_status` is never read.
      *   *The "Aboutness" Problem:* In telemetry, a log line `{"status": "red"}` implies the logger read a source of truth. If the source of truth (`qualia_status`) wasn't read, the log is technically lying or misattributed in a strict tracing sense. It's a "synthetic metric" derived from a correlate, not the actual metric.

  4.  **Addressing the Load-Bearing Claims:**
      *   *Claim 1: Experience is real.* $\to$ `experience_buffer` exists and holds data. (Clean).
      *   *Claim 2: Experience is causally inert.* $\to$ `experience_buffer` is write-only / no downstream consumers. (Clean).
      *   *Claim 3: Reports are about Experience.* $\to$ Log says `source="qualia"`. (Distortion/No Counterpart). In telemetry, `source` metadata usually implies causal lineage. If the lineage is broken, the tag is invalid.
      *   *Causation vs. Representation:* Observability fuses these. A trace *represents* the flow because it is *caused* by the flow. Epiphenomenalism requires representation *without* causation. This is the friction point.

  5.  **Addressing the Three Probes:**

      *   *Probe 1: Identity vs. Epiphenomenalism (Register vs. Shadow Copy).*
          *   Identity Theory: Experience *is* the processing state.
          *   Epiphenomenalism: Experience is a shadow copy.
          *   In telemetry: A shadow copy is still causally linked (memory copy instruction). To make it truly inert, it must be a "ghost write" that doesn't consume cycles or affect branching.
          *   *Distinction:* It survives if we allow "existence without resource cost/impact." But in systems, if it doesn't affect the trace, it's usually garbage collected. To keep it, we must assert the buffer exists *outside* the GC scope.
          *   *Cost:* We have to posit a memory region that is addressable (to be filled) but unaddressable (to be read). That's a hardware violation in most architectures.

      *   *Probe 2: Self-Stultification (The "Aboutness" Problem).*
          *   If the logger doesn't read `qualia`, how can it log `qualia_value`?
          *   In systems: This is a "correlated metric." I measure CPU load (correlate) and log "User Frustration" (inferred).
          *   *The Worry:* The log claims to measure Frustration, but actually measures CPU. If CPU and Frustration diverge, the log is wrong.
          *   *Escape:* The Epiphenomenalist says the correlation is nomologically necessary (law-like), not just contingent. In telemetry terms: The upstream driver writes both registers atomically. They *cannot* diverge.
          *   *Visibility:* My vocabulary sees this as "Derived Metric" vs "Direct Metric." The escape looks like a configuration setting (`strict_correlation_mode: true`), not a philosophical move.

      *   *Probe 3: Vocabulary Assumptions (Info $\implies$ Cause).*
