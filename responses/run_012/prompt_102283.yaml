          *   *Expressibility:* Yes, expressible as "Common Cause Correlation."
          *   *Zombie Check:* A zombie system is one where the `experience_buffer` is removed entirely. If the correlation holds, the logs are identical.
          *   *Result:* The vocabulary describes the Zombie perfectly. It describes the Epiphenomenalist system as a Zombie system + a useless write-only buffer. The "Experience" adds no observability value.

  6.  **Developing the Verdict:**
      *   Does the vocabulary fail, or does the philosophy fail?
      *   Observability is pragmatic: signals exist to be consumed. A signal that cannot be consumed (inert qualia) is noise/overhead.
      *   The "Aboutness" claim is the breaker. In telemetry, "aboutness" *is* causal lineage. To say "Log L is about State S" means "S influenced L."
      *   Epiphenomenalism wants "Log L is about State S" to mean "L matches S" (correlation) while denying "S influenced L."
      *   *Verdict:* The philosophy smuggles in a notion of "reference" or "intentionality" that is distinct from causal information flow. Observability vocabulary does not have a slot for "reference without information flow." Therefore, the vocabulary reveals the philosophical claim to be functionally indistinguishable from a system with a useless side-buffer (Zombie +). The gap is in the philosophy's definition of "aboutness," which observability exposes as causally empty.

  7.  **Refining the Tone:**
      *   Use the user's jargon correctly (side channels, causal readouts, pipeline, instrumentation).
      *   Be direct, analytical, slightly skeptical (engineering mindset).
      *   Avoid philosophical name-dropping.
      *   Ensure the "Residue Report" is structured clearly.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish causation vs. representation commitments?
      *   *Correction:* Make sure to explicitly state that observability fuses them (Representation *is* Causal Traceability).
      *   *Check:* Did I answer the "Shadow Copy" probe accurately?
      *   *Correction:* Emphasize that a shadow copy usually implies a copy operation (causal). The epiphenomenal "copy" must be magic/parallel instantiation to be truly inert.
