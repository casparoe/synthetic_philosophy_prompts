      *   *Initial thought:* Say "Cognitive penetration is false." *Correction:* Too strong. Say "It complicates the strong version."
      *   *Make sure to distinguish:* Perception vs. Belief. The user knows they are equal (belief) but sees them unequal (perception). This distinction is key to the answer.

  8.  **Final Polish:** Check for clarity on "encapsulation" and "modularity." Ensure the distinction between "seeing as" (interpretation) and "seeing" (sensation) is clear. (Proceed to generate output based on these points.)

