prompt: |-
  I've been locked in a running argument with two friends about sunk costs and I want to settle it once and for all with an actual essay, so help me out. Friend A is a hardliner: he says that any time your decision is influenced by money, time, or effort you can't recover, you're committing a fallacy, period, and the only sane move is to ask what's best going forward and nothing else. Friend B thinks that's way too glib. Her example is that she spent three years getting decent at classical guitar, and even though she'd never start from scratch today, she keeps grinding at it partly because of those three years already in the bank, and she insists that isn't obviously nuts -- those years are part of who she is now, and walking away would feel like betraying her past self. I keep flip-flopping, and honestly I suspect that 'sunk costs are irrelevant' is a slogan doing way more work than it can cash out.

  So: write me an essay on whether honoring sunk costs is always irrational. Weigh the main lines of argument on both sides, but don't cop out with "it depends" and leave it there -- land on a verdict and defend it. A couple of things I specifically want you to chew on, because I think they're where the real action is. First, I've got a nagging feeling that "irrational" is doing double duty here -- sometimes people mean "won't maximize expected utility" and sometimes they mean "isn't really reasoning / is incoherent," and those might come apart. Second, there's a distinction I half-remember from somewhere between letting a sunk cost *causally push* your decision around versus letting it serve as *evidence* about what's worth doing, and I want to know if that distinction rescues Friend B or buries her. Third, does it matter whether we're judging a single act or a standing policy -- like, could adopting the rule "never quit once I've invested X" be rational as a whole even if each individual act of honoring it looks dumb in isolation? And is Friend B's "betrayal of my past self" thing a real consideration or just sentimentality dressed up? Feel free to invent a small concrete case or two to test the principles, but keep it readable -- I'm not a philosopher, just someone who reads too many blogs.

  Write it in American English. Lead with your bottom line in the very first sentence, then give the reasoning, and skip the preamble and any restating of my question.
