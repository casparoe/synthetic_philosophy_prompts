answer: |-
  Honoring sunk costs is not always irrational, because what looks like mourning the past is often a rational investment in your future ability to keep promises.

  Friend A is winning the argument on definition, but Friend B is winning it on psychology. To see why, we have to stop treating "rationality" as a single thing. In economics, rationality means maximizing expected utility in a specific moment. If you buy a $100 concert ticket, hate the band immediately upon arrival, and stay anyway just because you paid, Friend A is correct: you have doubled your loss. You are out $100 and now you are also out three hours of enjoyment. The money is gone regardless of whether you stay or leave. In this isolated snapshot, honoring the sunk cost is incoherent. It is a mathematical error to let a past variable influence a future equation where it no longer exists.

  However, human beings do not live in isolated snapshots. We live in narratives, and this is where the definition of "irrational" splits. If irrationality means "violating a math problem," then Friend A wins. But if irrationality means "acting against your own long-term interests and values," then Friend A's hardline rule can actually lead to self-destructive behavior. This is because the first thing you need to clarify is whether the sunk cost is *causing* your decision or serving as *evidence* for it.

  Friend A assumes the cost is the cause. He imagines you thinking, "I spent money, therefore I must stay." That is indeed a fallacy. But Friend B's guitar example isn't about causation; it's about evidence. The three years she spent practicing are not a shackle forcing her hand; they are data points proving that she values being a guitarist. If she quits, she isn't just stopping an activity; she is invalidating the evidence of her own past preferences. When she says walking away feels like betraying her past self, she isn't being sentimental; she is protecting her integrity. Integrity is a future asset. If you train yourself to ignore past investments whenever the present gets difficult, you degrade your capacity for commitment. You become the kind of person who quits.

  This leads to the crucial distinction between a single act and a standing policy. In game theory, this is the difference between act utilitarianism and rule utilitarianism. In a single act—like the concert ticket—ignoring sunk costs is usually the right move. But as a standing policy, "never honor sunk costs" is dangerous. Life is full of projects where the payoff comes only after a long period of seeming waste. Learning a language, building a business, or mastering an instrument all look like sunk cost traps in the middle. If you adopt Friend A's rule as a universal law, you will optimize your Tuesdays but ruin your decade. You will never push through the "dip" where effort is high and reward is low, because a cold calculation of the present moment always suggests quitting.

  Adopting a policy of honoring past investment can be a rational precommitment strategy. Thomas Schelling, the Nobel laureate, described this as binding yourself to a mast like Odysseus. You know your future self will be tempted to quit when things get hard, so your past self imposes a cost on quitting. The "sunk cost" becomes the price of maintaining that binding. When Friend B keeps grinding at the guitar, she is paying a maintenance fee on her identity as someone who finishes what she starts. That fee is rational if the value of being a committed person outweighs the utility of the free time she could gain by quitting.

  This resolves the ambiguity around "irrational." Is it irrational to stay in a marriage because you've already put ten years into it? If you stay *only* because of the ten years, while miserable and abused, that is the fallacy. You are letting the past cause the future. But if the ten years represent a shared history and a vow that you value more than the immediate discomfort of working through a rough patch, then honoring that investment is rational. You are not paying for the past; you are paying for the future stability that comes from treating vows as binding.

  Friend B's fear of "betraying her past self" is not magic; it is a recognition that the self is extended over time. We are not discrete entities popping in and out of existence every morning. We are continuous projects. If you routinely discard your past investments, you fracture that continuity. You teach yourself that your past judgments are worthless, which undermines your confidence in making future judgments. There is a real utility cost to becoming a person who treats their own history as disposable.

  So, where does the verdict land? Friend A is right that sunk costs should never be the *sole* reason for a decision. You cannot justify a bad future purely with a expensive past. But Friend B is right that sunk costs are rarely irrelevant because they are entangled with identity, reputation, and commitment capacity. Honoring a sunk cost is irrational when it is a slave to the past, but it is rational when it is a steward of the future. The hardliner's slogan is a useful heuristic for financial decisions, but a terrible philosophy for life. You should ignore sunk costs when buying stocks, but you should honor them when building a self.
