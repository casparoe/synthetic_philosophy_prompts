  [The existence of contemporaneous dissenters is the hardest point to meet, because it directly threatens the claim that the moral truth was epistemically inaccessible to the agent.]

  You are quite right to press me on the selective application of the defence, and I will concede immediately that it is frequently wielded as a rhetorical shield rather than a principled distinction; however, the hypocrisy of those who invoke it does not entail the falsity of the principle itself, any more than the hypocritical use of honesty excuses lying. Your sharper point concerns the dissenters, and I grant you that if we treat the mere existence of a contrary view as proof of accessibility, my position collapses. But accessibility is not binary; it is graded by social position and epistemic cost. Even if an enslaved person knew the whip was wrong, it does not entail that the plantation owner, embedded in a web of legal, economic, and theological justifications that rendered that knowledge opaque to his station, could have reasonably accessed it without a radical rupture of his entire worldview. We do not say the seventeenth-century physician is blameworthy for lacking antibiotics because the knowledge was not merely unknown but unavailable; similarly, if the moral conceptual framework required to condemn the great man was held only by those systematically excluded from his normative community, expecting him to adopt it is to demand not moral compliance but moral sainthood.

  This leads me to the second reading you offered, that of epistemic accessibility, which is the only one I defend. It does not cap moral demand at what is easy, but at what is possible within a form of life. To blame someone for failing to transcend their milieu is to blame them for their constitutive luck, which is precisely what blame ought not to do. Blame is a participant attitude that presupposes a shared normative community, and where that community is fractured by power, the expectations must be indexed to the agent's position within that fracture. We cannot hold the dead to a standard that requires them to cease being who they were in order to see what we see, for that is not a moral failure but an ontological impossibility.

  You suggest this forbids us from praising the dissenters, but it does not; we praise them precisely because they achieved something exceptional, something beyond the call of duty required of their peers. We can hold the dissenter as a hero without holding the mainstream figure as a villain, provided we recognise that the hero operated at the extreme limit of what was humanly possible in that context, while the mainstream figure operated within the centre. If you are willing to concede that blame requires a reasonable expectation of compliance, will you grant me that what is reasonable shifts when the cost of compliance is the total alienation from one's own society's understanding of reality?
