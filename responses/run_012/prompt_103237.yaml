answer: |-
  **Final Exam: Philosophy of Science 450**
  **Time Allowed: 3 Hours**

  **Question 1**
  Hempel's Raven Paradox arises from the tension between two plausible conditions of confirmation: the Instance Condition (that observing an $F$ that is $G$ confirms 'All $F$ are $G$') and the Equivalence Condition (that evidence confirming a hypothesis confirms any logically equivalent hypothesis). Applied to 'All ravens are black', these entail that observing a red herring confirms the hypothesis.

  Write an essay that addresses the following four points in order:
  1.  **Reconstruct** the derivation of the paradox using Hempel's two conditions.
  2.  **Distinguish** Hempel's own resolution (appealing to psychological illusion and background knowledge) from the standard Bayesian resolution (accepting the result but minimizing the degree of confirmation).
  3.  **Evaluate** the objection raised by your colleague: that the Bayesian 'negligible confirmation' defense fails in a finite, closed universe (e.g., an inventory of exactly three objects: a black raven, a white shoe, and a red herring). Specifically, analyze whether the confirmatory weight of the herring depends on the **sampling procedure** used to obtain it within this inventory.
  4.  **Conclude** by identifying which of the framework's commitments must be surrendered or revised (the intuition of irrelevance, the Equivalence Condition, or the Instance Condition) and defend this choice against the alternatives.

  *Note: An answer that merely asserts the confirmation is "real but negligible" without addressing the finite-world objection or the role of sampling procedures will not pass.*

  ***

  ### Model Answer

  The paradox is generated by combining Nicod's Criterion (Instance Condition) with the Equivalence Condition. 'All ravens are black' ($H$) is logically equivalent to 'All non-black things are non-ravens' ($H^*$). By Nicod's Criterion, observing a black raven confirms $H$. Observing a red herring (a non-black non-raven) confirms $H^*$. By the Equivalence Condition, evidence confirming $H^*$ must confirm $H$. Thus, a red herring confirms that all ravens are black.

  Hempel dissolves the *air* of paradox by arguing it is psychological, not logical. We possess background knowledge that there are far more non-black objects than ravens; thus, we implicitly treat the herring as irrelevant. Hempel maintains that relative to a state of total ignorance, the intuition of irrelevance vanishes, and the confirmation stands. The Bayesian resolution differs by accepting the logic but quantifying the confirmation. Using Bayes' Theorem, the posterior probability $P(H|E)$ exceeds the prior $P(H)$, but the difference is negligible because the likelihood ratio is dominated by the vast number of non-black objects in the actual world.

  However, my colleague's finite-world objection strikes at the Bayesian defense. Consider a universe $W$ containing exactly three objects: $\{r_1 (\text{black raven}), s_1 (\text{white shoe}), h_1 (\text{red herring})\}$. Here, the ratio of non-ravens to ravens is 2:1, not astronomical. If we inspect $h_1$ and find it is a red herring, does this substantially confirm $H$? The answer depends entirely on the sampling procedure, a factor the standard "negligible" line ignores.

  If the procedure is "select an object at random from $W$," finding a non-black non-raven eliminates one of the few possible locations for a counterexample (a non-black raven). In this small set, the confirmation is indeed substantial, validating the colleague's claim that the "negligible" defense relies on an open-ended universe. However, if the procedure is "select a non-black object," finding a herring is guaranteed by the setup and provides no new information about ravens. If the procedure is "select a raven," the herring is never observed. Thus, the confirmatory weight is not a function of $E$ and $H$ alone, as Hempel's syntactic approach suggests, but depends on the protocol generating $E$. The colleague is correct that in closed systems, the herring's evidence value is not inherently tiny; the "negligible" solution is contingent on worldly demographics, not logic.

  This forces a surrender of one commitment. We cannot surrender the Equivalence Condition without breaking the transitivity of logical equivalence in confirmation, which cripples scientific theorizing. We should not surrender the intuition of irrelevance entirely, as it tracks genuine methodological practice. Therefore, we must restrict the **Instance Condition**. Nicod's Criterion is too broad; it treats instances as confirmatory regardless of how they were selected. We must adopt a modified condition: an instance confirms a generalization only if the sampling procedure allows for the possibility of falsification. In the three-object world, inspecting the herring confirms $H$ only if we could have inspected the raven instead. By tethering confirmation to experimental design rather than syntactic form, we preserve Equivalence and explain why the herring feels irrelevant in the actual world (where random sampling of objects is impractical) without denying the logic in the finite case. The paradox is resolved not by shrinking the confirmation, but by recognizing that confirmation is procedural, not merely propositional.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Reconstruction of the Paradox (5 Marks)**
  *   **5:** Clearly defines Instance (Nicod's) and Equivalence Conditions; shows logical equivalence of $H$ and $H^*$; derives the conclusion that non-black non-ravens confirm $H$.
  *   **3-4:** Defines conditions but vague on the derivation of equivalence; or misses the link between $H^*$ and the herring.
  *   **0-2:** Fails to state conditions correctly; confuses logical equivalence with causal connection.
  *   *Typical Error:* Treating the Equivalence Condition as a claim about the *meaning* of the sentences rather than their confirmational status.

  **2. Hempel vs. Bayesian Resolution (5 Marks)**
  *   **5:** Distinguishes Hempel's appeal to psychological illusion/background knowledge from the Bayesian acceptance of confirmation + low probability weight.
  *   **3-4:** Describes both but fails to highlight that Hempel thinks the intuition is wrong, whereas Bayesians think the intuition is right about the *weight* but wrong about the *value*.
  *   **0-2:** Conflates the two; claims Hempel uses probability.
  *   *Typical Error:* Treating Hempel's psychological explanation as a logical solution to the paradox.

  **3. The Colleague's Challenge (Finite World & Sampling) (5 Marks)**
  *   **5:** Explicitly analyzes the 3-object inventory; acknowledges confirmation is substantial in this case; crucially identifies that confirmatory weight depends on the **sampling procedure** (random vs. selected).
  *   **3-4:** Analyzes the 3-object case and admits confirmation is higher, but fails to mention the sampling protocol/procedure dependency.
  *   **0-2:** Dismisses the 3-object case; or claims the herring confirms equally regardless of how it was found.
  *   *Typical Error:* Conceding the colleague's case without noticing that its force depends on an assumed sampling procedure (e.g., random selection).

  **4. Surrender and Defense (5 Marks)**
  *   **5:** Clearly selects one commitment to surrender/revise (usually Instance Condition); provides a substantive defense why this is preferable to dropping Equivalence or Irrelevance; integrates the sampling insight.
  *   **3-4:** Selects a commitment but defense is weak (e.g., "Equivalence is false" without argument); or repeats the "negligible" line without resolving the finite case.
  *   **0-2:** Hedges without choosing; or chooses Equivalence without realizing the logical cost.
  *   *Typical Error:* Confusing the smallness of the confirmation with its irrelevance, or conceding the colleague's three-object case without noticing that its force depends on an assumed sampling procedure.

  **Grade Boundaries:**
  *   **A (17-20):** Executes all four tasks with precision. Crucially, in Task 3, explicitly links the finite-world confirmation to the *method of selection* (Good's point), showing why the "negligible" answer is context-dependent. In Task 4, offers a coherent methodological justification for restricting the Instance Condition.
  *   **B (13-16):** Competent reconstruction and distinction (Tasks 1 & 2). In Task 3, acknowledges the finite world makes confirmation stronger but misses the *sampling procedure* nuance (treating the evidence as static). In Task 4, makes a choice but the defense is standard textbook material that doesn't fully engage the colleague's specific objection.
  *   **C (9-12):** Standard "negligible confirmation" answer that stops early (fails Task 3 & 4 requirements). Reconstruction may be slightly garbled.
  *   **Fail (0-8):** Fundamental misunderstandings of logic or confirmation theory.
