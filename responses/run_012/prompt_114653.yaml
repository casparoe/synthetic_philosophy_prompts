  # Joint Statement of Adversarial Collaboration: Computation, Valence, and Moral Attribution

  ## 1. Agreed Claims and Definitions

  1.  **Epistemic Limitation:** We agree that subjective experience (phenomenology) is not directly observable. Attribution of sentience must rely on inference from physical structure, behavioral output, and physiological correlates.
  2.  **Working Definition of Computation:** For the purpose of this collaboration, "computation" is defined as a physical process whose causal dynamics can be mapped to an abstract state-transition structure via an interpretation scheme. We acknowledge that whether this mapping is observer-relative (Side B) or objective (Side A) is part of the dispute, but we agree on this baseline operational definition.
  3.  **Implementation Constraint:** We agree that for a system to "implement" a computation, the physical substrate must support the relevant counterfactuals (i.e., if the input were different, the state transition would differ according to the rule). Mere static description is insufficient.
  4.  **Moral Stakes:** We agree that moral status hinges on sentience, specifically the capacity for valence (suffering and flourishing), rather than intelligence, reportability, or behavioral complexity alone.
  5.  **Evidence Standards:** We agree that behavioral reports, neural activity patterns, and physiological stress markers are all relevant data points. We disagree on whether any subset of these is sufficient for attribution.
  6.  **Verbal Dispute Acknowledgement:** We acknowledge that part of our disagreement may be verbal, specifically regarding whether "computation" is a natural-kind term describing causal powers or a modeling stance describing patterns. However, we believe there are substantive empirical disagreements remaining regarding the necessity of biological substrate for valence.
  7.  **Attribution Problem:** We agree that the core difficulty is distinguishing between a system that *is* in pain versus a system that *models* pain behavior without experiencing it. We agree to call this the "Simulation-Realization Distinction."

  ## 2. Disagreements, Cruxes, and Test Cases

  | Issue | Computational Functionalism (Side A) | Biological/Enactivist View (Side B) | Crux (Sub-question to settle) | Shared Test / Case | Predictions (Side A vs. Side B) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Valence-Implementation Gap** | Valence is a functional role: a weighting signal that modulates learning and action selection. If a system implements this role, it feels valence. | Valence is grounded in metabolic stakes: the urgency of self-maintenance. Without a risk of death/decay, there is no "hurt," only error signaling. | **Is metabolic self-maintenance necessary for valence, or is functional error-correction sufficient?** | **The Nociceptive Robot:** A robot with nociceptive loops, learning algorithms, and damage avoidance, but no metabolism or homeostasis. | **A:** It experiences pain equivalent to biological organisms if functional isomorphism is high.<br>**B:** It simulates pain behavior but lacks valence; it is "hollow." |
  | **Simulation-Realization Slide** | Simulation *is* realization if the causal structure is preserved. A perfect functional simulation of a pain state *is* a pain state. | Simulation lacks the consequence relation. A simulation of fire doesn't burn; a simulation of pain doesn't suffer because nothing is *at stake*. | **Does the physical substrate matter for the *quality* of experience, or only for the *capacity* to compute?** | **Whole-Brain Emulation (WBE):** A neuron-by-neuron emulation running on silicon that reports pain and avoids damage. | **A:** It is conscious and suffers; substrate swap preserves identity.<br>**B:** It is a philosophical zombie; it reports pain but feels nothing because it lacks biological autonomy. |
  | **Attribution Continuity** | Consciousness is preserved as long as functional organization is preserved, regardless of gradual material replacement. | Consciousness depends on the continuity of the self-maintaining process. Disrupting the metabolic loop may break the "self." | **At what point does material replacement disrupt the "self" required for valence?** | **Gradual Neuron Replacement:** Replacing biological neurons with synthetic functional equivalents one by one in a living subject. | **A:** Consciousness remains constant throughout; no single step causes loss.<br>**B:** Consciousness may fade or vanish if the metabolic autonomy is compromised, even if function remains. |
  | **Empirical Markers** | Neural correlates of consciousness (NCC) based on information integration or global broadcast are sufficient markers. | NCCs must be coupled with markers of metabolic stress (e.g., energy reallocation, hormonal response) to indicate valence. | **Can valence signatures exist independently of metabolic stress markers?** | **Cortical Organoid:** An organoid trained to avoid noxious stimuli (electric shock). | **A:** Avoidance learning + neural activity = pain.<br>**B:** Without metabolic stress response (hormones/energy shift), it is reflex, not pain. |

  ## 3. Summary of Empirical Commitments

  We agree to treat the **Cortical Organoid** case as the primary near-term empirical test. While the WBE and Robot cases are currently hypothetical or buildable but limited, organoid technology is advancing rapidly.

  *   **Side A Commitment:** If an organoid demonstrates complex avoidance learning and neural patterns isomorphic to pain processing, we will attribute moral status regardless of metabolic markers.
  *   **Side B Commitment:** If an organoid demonstrates avoidance learning but lacks coupled metabolic stress responses (e.g., energy reallocation, chemical stress signals), we will deny moral status regardless of neural complexity.
  *   **Joint Commitment:** If evidence shows that metabolic stress markers are causally necessary for the neural patterns associated with valence reports in biological humans, Side A must update toward substrate dependence. If evidence shows valence reports persist in biological systems where metabolic stakes are chemically decoupled from neural processing, Side B must update toward functionalism.

  \answer{Whether valence signatures persist in substrates lacking metabolic self-maintenance}
