answer: |-
  # Standard Operating Procedure: Ethical Review and Decision-Making

  **To:** Members of the Research Ethics Committee
  **From:** The Chair
  **Subject:** Deliberation and Voting Protocol

  This procedure replaces informal discussion norms. Its purpose is not to prove we are right, but to ensure our decisions are defensible, transparent, and distinguish between what we *know* (facts) and what we *prefer* (values).

  ## Part 1: The Procedure

  ### Step 1: Pre-Meeting Competence Declaration
  Before the meeting, the Secretary circulates the application. Members must flag any **Domain Conflicts**.
  *   **Rule:** If a question is technical (e.g., power calculation, pharmacokinetics), members without relevant training must mark themselves as 'Non-Competent' for that specific question.
  *   **Effect:** Non-Competent members may not vote on the *factual accuracy* of that point. They retain full voting rights on the *ethical acceptability* of the risk derived from that fact.

  ### Step 2: The Fact-Finding Phase (10 Minutes)
  Discussion is restricted to verifiable claims. No opinions on whether the study *should* happen yet.
  *   **Question 1:** "Is the scientific methodology sound enough to generate valid data?"
      *   *Sufficient Answer:* Consensus or Expert Majority (see Voting Rules).
      *   *Stop Point:* If 'No', the application is **Refused** on grounds of scientific waste. Proceed to Minuting.
  *   **Question 2:** "What are the foreseeable risks to participants?"
      *   *Sufficient Answer:* A risk register agreed upon by the clinical and statistical members. Lay members confirm they understand the description, not the calculation.
      *   *Stop Point:* If risks cannot be quantified or agreed upon (e.g., first-in-human uncertainty), the procedure moves to Step 5 (Precautionary Principle).

  ### Step 3: The Values Phase (5 Minutes)
  Discussion opens on ethical principles.
  *   **Question 3:** "Do the potential benefits outweigh the agreed risks?"
      *   *Note:* This is a value judgement. A lay member's view on burden carries equal weight to a clinician's.
  *   **Question 4:** "Is the consent process adequate to respect autonomy?"
      *   *Note:* Lay members lead this discussion. Clinicians defer on matters of 'coercion' or 'comprehension'.

  ### Step 4: The Verdict Selection
  We have three verdicts: **Approve**, **Approve with Amendments**, **Refuse**.
  *   **Rule:** Voting is sequential to prevent strategic voting.
      1.  Vote on **Refusal**. If passed (see Thresholds), study stops.
      2.  If Refusal fails, vote on **Amendments**. If passed, specific changes are mandated.
      3.  If Amendments fail, **Approval** is granted.

  ### Step 5: Chair Intervention and Escalation
  *   **Procedural Deadlock:** If discussion becomes circular, I (the Chair) will call time.
  *   **Policy Conflict:** If the committee agrees on facts and values but the decision contravenes Trust Policy or Law, I will overrule the vote and refer the matter to the Trust Board. This is not a veto on ethics, but a compliance check.
  *   **Value Deadlock:** If the vote is tied on a moral question (e.g., deception), the default is **Refusal**. We do not gamble on ambiguity.

  ## Part 2: Voting and Minuting Rules

  ### Voting Mechanics
  1.  **Secret Ballot:** We vote twice. Once *before* discussion (to capture independent judgement) and once *after* (to capture deliberated judgement). The final decision rests on the second ballot.
  2.  **Quorum:** At least 7 members must vote, including at least one lay member and one clinician.
  3.  **Weight:** All votes count equally (1 vote per member). However, abstentions are treated as follows:
      *   *Competence Abstention:* If a lay member abstains on a statistical fact, they are not counted in the denominator for that specific finding.
      *   *Conscience Abstention:* If a member abstains on a value judgement, it counts as a vote against the motion (to encourage engagement).
  4.  **Thresholds:**
      *   **Approval:** Simple Majority (50% + 1 of voting members).
      *   **Refusal:** Simple Majority.
      *   **High-Risk Studies (e.g., children, first-in-human):** Requires 60% majority for Approval. If this threshold is not met, the verdict defaults to **Amendments** or **Refusal**.

  ### Minuting Standards
  The minutes must separate **Findings** from **Choices**.
  *   **Findings:** "The Committee found that the sample size was insufficient." (Record the vote count).
  *   **Choices:** "The Committee decided that the risk was acceptable despite the small sample." (Record the vote count).
  *   **Dissent:** Any member may request their specific objection be minuted verbatim. This is mandatory for Refusal decisions.

  ## Part 3: Handling Complexities

  *   **Irrelevant Expertise:** If a statistician argues a consent form is 'coercive', their view is treated as a lay opinion. If a lay member argues a p-value is wrong, they are invited to abstain on that fact.
  *   **Fact/Verdict Mismatch:** If we agree on facts (Risk = 5%) but disagree on verdict (Approve vs. Refuse), the minutes must record this as a 'Values Disagreement'. No further fact-finding is permitted.
  *   **Dependent Members:** If two members work in the same department, they must declare this. If they vote identically on every item, I will review their independence for future meetings. They count as one vote for the purpose of the 'Independence' check, though legally they retain two votes.

  ---

  ## Part 4: Application of the Procedure

  Here is how this procedure applies to three current applications.

  ### Case 1: First-in-Human Device Trial in Children
  **Context:** A novel implant for spinal curvature. Statistician argues the power calculation is optimistic and risk of nerve damage is unknown. Clinicians argue the current standard of care is worse.
  **Procedure Run:**
  1.  **Competence:** Lay members abstain on the power calculation fact.
  2.  **Fact-Finding:** Statistician votes 'Methodologically Flawed'. Clinicians vote 'Sound'. The Expert Majority (Statistician + 2 senior clinicians) rules the risk quantification is **Uncertain**.
  3.  **Values:** Question 3 (Benefits vs. Risks). Because the risk is 'Uncertain', Step 5 (Precautionary Principle) triggers.
  4.  **Verdict:** Under High-Risk thresholds, we need 60% to Approve. We have 55% (Clinicians + Nurse). The Statistician and Lay members vote Refuse.
  5.  **Outcome:** **Refused.**
  **Chair's Note:** I dislike this. The clinicians are desperate for a solution for these children. However, the procedure treats 'Uncertain Risk' in children as a factual barrier that a majority cannot override. The minutes will record: *Finding: Risk Uncertain. Choice: Precautionary Principle Applied.*

  ### Case 2: Low-Risk Duplicate Study
  **Context:** A survey on patient satisfaction. Methodologically sound, low risk. However, an identical study was published by another trust six months ago.
  **Procedure Run:**
  1.  **Fact-Finding:** Question 1 (Scientific Soundness). Agreed: Sound. Question 2 (Risks). Agreed: Low.
  2.  **Values:** Question 3 (Benefits vs. Risks). Lay members argue that asking patients to fill out the same survey again is a burden without new benefit (Scientific Waste). Researchers argue local validation is needed.
  3.  **Verdict:** Vote on Refusal. The Lay members and Pharmacist vote Refuse (Waste of resources/patient time). Clinicians vote Approve.
  4.  **Outcome:** **Refused.** (Simple Majority for Refusal).
  **Chair's Note:** This is the uncomfortable answer. The science is 'sound', but the procedure identifies 'Waste' as an ethical harm. We are stopping a safe study because it adds no value. The minutes will record: *Finding: Duplication Confirmed. Choice: Participant Burden Outweighs Local Validation.*

  ### Case 3: Deception Study
  **Context:** Psychology study on honesty. Participants must be lied to about the aim to get valid results. Debriefing is planned.
  **Procedure Run:**
  1.  **Fact-Finding:** Agreed: Deception is necessary for validity. Agreed: Debriefing mitigates harm.
  2.  **Values:** Question 4 (Consent/Autonomy). Lay members are split. One argues deception invalidates consent entirely. Another argues it is acceptable if debriefed.
  3.  **Verdict:** Vote on Approval. Requires Simple Majority.
  4.  **Outcome:** **Approved with Amendments.** (Majority vote). The Amendments mandate a stricter debriefing protocol and an opt-out after the reveal.
  **Chair's Note:** This works as intended. The procedure allows ethical risk where mitigation exists, provided the majority accepts the value trade-off.

  ---

  ## Part 5: Limitations of This Procedure

  You must know where this document ends and your judgement begins. This procedure cannot do the following:

  1.  **It cannot resolve fundamental moral disagreements.** If half the committee believes deception is always wrong, and half believes it is sometimes right, the vote will simply record the split. The procedure forces a decision, but it does not make the decision *right*. In these cases, the minutes must explicitly state: *This was a decision of values, not facts.*
  2.  **It cannot compensate for poor information.** If the applicant provides false data, our fact-finding phase will fail. We rely on the honesty of the submission.
  3.  **It cannot remove the Chair's responsibility.** I still decide when discussion stops. If I cut off debate too early, the 'independence' of your votes is compromised. You must hold me to account if I rush Step 2.
  4.  **It cannot predict the future.** A 'Refusal' based on risk may prevent harm, or it may prevent a cure. We decide on *foreseeable* risk, not unknown fortune.
  5.  **It does not absolve individual members.** If you vote 'Approve' on a study that later harms patients, saying "the procedure allowed it" is not a defence. You are personally accountable for your vote.

  **Final Instruction:**
  Treat this procedure as a tool for clarity, not a shield for cowardice. When the minutes say 'Choice', own it. When they say 'Finding', ensure it is true. If you cannot distinguish the two, ask me to pause the vote.

  **Signed,**
  **Chair, Research Ethics Committee**
