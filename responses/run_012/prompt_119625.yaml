prompt: |-
  I chair the research ethics committee of a mid-sized NHS trust. We meet once a month for two hours, roughly fifteen minutes an application, and decide whether each study before us may proceed, may proceed subject to amendments, or must be refused. Our decisions are recorded, summarised publicly, and can be appealed to the trust board, so a mistaken approval can expose patients to harm and a mistaken refusal can stop research that would have helped them. There are twelve of us: clinicians from several specialties, a statistician, a pharmacist, a lawyer, two lay members and a research nurse. Attendance is uneven; I decide when to cut off discussion and put something to a vote.

  A colleague recently told me that Condorcet's jury theorem shows that where each member is more likely than not to get a question right, and members form their views independently, a majority of a body like ours is overwhelmingly likely to be right, and that this is the real justification for what we do. I am not convinced, and I would rather have a procedure than a justification. I have also heard two claims I cannot square with each other or with the theorem as it was explained to me: that adding a member helps only if that member is better than a coin toss on the question actually before us, and that where one member is far more reliable than the rest the best rule may be to follow that member alone. I do not know what either would mean for lay members voting on a statistical question, or for the fact that two of my members trained in the same department and work from the same risk-assessment template.

  Please write a procedure my committee could actually run on an application. Give me the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a refusal, and where it must stop and hand the decision to me as chair, or back to the committee as a matter of policy rather than of fact, because the question is one of values rather than of truth. It should say how many members should vote, whether votes count equally, whether we should poll members in writing before discussion and again afterwards, when unanimity is required and when a simple majority will do, how abstentions are treated, and what we should minute so that the record is honest about which parts of a decision were findings and which were choices.

  It must also handle three things that happen to us regularly: applications with more than two possible verdicts; applications where we agree on every factual point but disagree on the verdict, or disagree on the facts but agree on the verdict; and members whose expertise is beside the point, or worse than useless, on the question being put, such as the lay member asked to judge a sample-size calculation or the statistician asked to judge whether a consent conversation would feel coercive.

  Then run the procedure on three applications: a first-in-human trial of a device in children, in which the risk estimate is contested and the members disagree about the statistics; a study that is methodologically sound and low-risk but duplicates research already done; and a study whose science is sound but which requires deceiving participants. Include at least one case where the procedure gives an answer I will not like.

  Finally, tell me what the procedure cannot do: the questions it will not settle, and the cases where I should stop treating the committee's verdict as a finding rather than a decision. No citations or reading lists, please; this has to be usable by members with no training in any of it, and written in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **Role:** Chair of a Research Ethics Committee (REC) in a mid-sized NHS trust.
      *   **Context:** Monthly meetings, 2 hours, ~15 mins/application. 12 members (mixed expertise: clinicians, statistician, pharmacist, lawyer, lay members, research nurse). Uneven attendance. Chair controls discussion/vote cutoff. Decisions recorded, public, appealable. High stakes (harm vs. stalled research).
      *   **Problem:** Skeptical of Condorcet's Jury Theorem as justification. Needs a practical *procedure*, not just theory. Needs to resolve conflicting claims about member competence, independence, and weighting.
      *   **Requirements:**
          *   Step-by-step procedure (questions in order, sufficient answers, stop points).
          *   Voting rules (numbers, equality, pre/post polling, unanimity vs. majority, abstentions).
          *   Minuting requirements (distinguish findings vs. choices).
          *   Handle specific complexities: >2 verdicts, factual agreement/verdict disagreement (and vice versa), irrelevant expertise (lay on stats, stats on coercion).
          *   Run the procedure on three specific cases (First-in-human device in children [stats dispute]; Low-risk duplicate study; Deceptive study). One case must yield an uncomfortable answer.
          *   Limitations section (what the procedure *can't* do).
          *   Style: British English, usable by untrained members, no citations/reading lists.

  2.  **Deconstruct the Theoretical Tensions:**

      *   *Condorcet's Jury Theorem:* Requires independence and competence > 0.5. The user notes members aren't independent (same templates, departments) and competence varies by topic (lay vs. stats).
      *   *Expert Weighting:* If one expert is vastly superior, following them might be better than voting. But ethics isn't just fact; it's values.
      *   *Verdicts:* It's not just Yes/No. It's Yes/Yes with Amendments/No.
      *   *Fact vs. Value:* Statistics are facts (mostly). "Is this coercion?" is a value judgement informed by facts. "Is this duplication worth it?" is a value judgement.

  3.  **Drafting the Procedure (The Core):**

      *   *Goal:* Create a structured deliberation process that separates fact-finding from value-judgement.
      *   *Structure:*
          1.  Pre-meeting preparation (to mitigate time pressure).
          2.  Phase 1: Fact-Finding (Competence-based).
          3.  Phase 2: Ethical Principles (Value-based).
          4.  Phase 3: Decision & Voting.
      *   *Voting:* Needs to handle the "expert vs. lay" tension.
          *   *Idea:* Weighted voting is legally/ethically fraught in NHS RECs (usually one person, one vote). Better to use *domain-specific confidence* or *abstention rules*. Let's stick to equal votes but enforce *informed abstention* where expertise is irrelevant.
          *   *Polling:* Secret ballot before discussion (to prevent anchoring) and after.
          *   *Thresholds:* Unanimity for high risk/refusal? Simple majority for approval? Let's make it nuanced. High risk needs higher consensus.
      *   *Minuting:* Crucial distinction between "The Committee Found" (Fact) and "The Committee Decided" (Value).

  4.  **Addressing Specific Complexities:**

      *   *>2 Verdicts:* Use a sequential voting structure (e.g., Refusal first, then Amendments, then Approval).
      *   *Fact/Verdict Mismatch:* The procedure must force the separation. If facts agree but verdicts differ, it's a values clash.
      *   *Irrelevant Expertise:* The "Domain Competence Rule." If a question is purely statistical, lay members abstain or vote based on *trust* in the process, not the number. If a question is about patient experience, clinicians defer to lay members.

  5.  **Developing the Three Cases:**

      *   *Case 1: First-in-human device in children (Stats dispute).*
          *   *Conflict:* Statistician says risk is high/uncertain. Clinicians say it's manageable.
          *   *Procedure Application:* Fact-finding phase highlights the disagreement. Since it's a factual dispute about risk, the statistician's view should carry more weight *on the fact*, but the *acceptability* of that risk is a value judgement.
          *   *Outcome:* Likely "Amendments" or "Refusal" depending on risk threshold. Let's make it a Refusal to show the procedure biting hard.
      *   *Case 2: Duplicate study (Low risk, sound method).*
          *   *Conflict:* Scientific value vs. Resource waste/Participant burden.
          *   *Procedure Application:* Facts agreed (it is a duplicate). Value judgement: Is the confirmation worth the cost?
          *   *Outcome:* Approval with Amendments (must justify duplication).
      *   *Case 3: Deception study (Sound science).*
          *   *Conflict:* Scientific necessity vs. Informed Consent principle.
          *   *Procedure Application:* Fact: Deception is necessary. Value: Is it permissible?
          *   *Outcome:* This needs to be the "uncomfortable" one. Maybe the procedure forces a Refusal because the deception violates a core principle that requires unanimity, even if the science is great. Or, conversely, it approves it despite the Chair's personal discomfort. Let's go with *Approval* despite the Chair's discomfort, to show the procedure overrides personal bias.

  6.  **Refining the Limitations:**

      *   The procedure cannot manufacture consensus.
      *   It cannot turn value judgements into facts.
      *   It relies on members being honest about their competence.
      *   It doesn't solve the "Chair's power" issue entirely (casting vote/cutoff).

  7.  **Drafting - Tone and Language:**

      *   British English (minimise, programme, centre, etc.).
      *   Formal but accessible (no jargon like "epistemic weight").
      *   Authoritative but practical.

  8.  **Self-Correction/Review during drafting:**

      *   *Critique:* Did I address the Condorcet point?
      *   *Fix:* Acknowledge it in the preamble but focus on the procedure. The procedure mitigates the lack of independence by structuring discussion.
      *   *Critique:* Is the voting mechanism clear?
      *   *Fix:* Specify the "Two-Round Ballot" system.
      *   *Critique:* How to handle the "lay member on stats" issue?
      *   *Fix:* Introduce the "Domain Competence Declaration."
      *   *Critique:* The prompt asks for "where the procedure stops and hands the decision to me as chair."
      *   *Fix:* Need a specific trigger for Chair Intervention (e.g., procedural deadlock or legal/Policy barrier).
      *   *Critique:* "Uncomfortable answer."
      *   *Fix:* Ensure Case 3 results in an approval that feels ethically risky but procedurally correct, or a refusal that kills good science. Let's make Case 1 a Refusal that kills a potentially life-saving trial because the risk *fact* wasn't settled, showing the precautionary principle in action.

  9.  **Final Polish:** Check against all constraints (no citations, British English, specific case details). Ensure the distinction between "Findings" and "Choices" in the minuting section is sharp.

  *(Self-Correction on Case 1)*: If the statistician says risk is high and clinicians say low, that's a factual dispute. The procedure should prioritize the expert view on *facts*. If the fact is "risk is uncertain/high," the *value* judgement is "is this acceptable?" If the risk is truly unknown, ethics usually demands refusal. I will make the procedure force a Refusal here to demonstrate rigour over optimism.

  *(Self-Correction on Voting)*: NHS RECs usually operate on consensus. Formal voting is a last resort. I should structure it as "Seek Consensus" -> "Formal Vote". But the prompt asks for voting rules. I will integrate voting as the mechanism to *measure* consensus.

  *(Self-Correction on Chair Power)*: The prompt says "I decide when to cut off discussion". The procedure needs to constrain this slightly to ensure fairness, or at least record *why* discussion was cut.

  Let's write.

  *(Final check on "Uncomfortable Answer")*: I will make the Deception Study (Case 3) get Approved by the procedure, but the Chair (user) feels it shouldn't have. Or the Duplicate Study gets Refused. Actually, the prompt asks for "an answer I will not like." As Chair, I likely want to facilitate research. So a Refusal on a scientifically sound study (Case 2 or 3) would be disliked. Let's make Case 2 (Duplicate) get Refused because the procedure identifies "scientific waste" as an ethical harm, which researchers often hate. Or Case 1 (Children) gets Refused despite clinical pressure. Let's go with Case 1 Refusal. It's the most ethically defensible but "uncomfortable" because it stops a trial.

  Wait, better: Case 3 (Deception). Deception is ethically fraught. If the procedure allows it via majority vote, but the Chair believes deception is inherently wrong, that's a conflict. Or, if the procedure *blocks* it despite scientific merit. Let's make the procedure *block* the Deception study because it fails a specific "Fundamental Principle" check that requires higher consensus. This shows the procedure protects values over science.

  Actually, the prompt asks for *one* case where the procedure gives an answer *I* (the Chair) will not like. As Chair, I might want to be decisive. If the procedure forces a "Deferral" or "Refusal" due to lack of consensus on a value, that might be frustrating. Let's make Case 1 result in a Refusal based on statistical uncertainty, which the clinicians (and maybe Chair) want to approve to help kids. This highlights the tension between safety and innovation.

  Okay, ready to draft.

  *(Wait, one more check on constraints)*: "where the procedure stops... and hand the decision to me as chair... because the question is one of values rather than of fact."
  This implies I need a specific mechanism where the Committee *cannot* decide, and the Chair must step in or escalate. Actually, usually, the Chair *casts* the vote or decides on procedural matters. I will interpret this as: If the vote is tied or the issue is purely policy, the Chair decides *how* to process it, or refers to the Trust Board. I will clarify that the Committee decides values, but if they are deadlocked on values, the Chair refers to the Board.

  No, re-reading: "where the procedure stops... and hand the decision to me as chair... because the question is one of values rather than of fact."
  This suggests some questions are *not* for the committee to vote on as facts, but for the Chair to rule on as policy. I will incorporate a "Policy Compliance" step where the Chair rules on adherence to Trust Policy, while the Committee rules on Ethical Acceptability.

  Okay, let's finalize the structure.
  1. Preamble (Philosophy).
  2. The Procedure (Steps 1-5).
  3. Voting & Minuting Rules.
  4. The Three Cases.
  5. Limitations.

  British English check: 's' not 'z' (organise), programme, centre, colour, etc.
