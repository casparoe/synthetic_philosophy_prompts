      3.  Behavioral Ambiguity - Undermines the user's specific criterion.

  4.  **Drafting Replies & Identifying Soft Spots:**
      *   *Mechanism:* Reply: We don't need mammalian circuits. We need functional equivalents (integration, persistence). Soft spot: We don't know what the functional equivalent *is* yet.
      *   *Pascal's Wager:* Reply: It's not binary (God/No God), it's continuous (Sentience Probability). It's Expected Value. Soft spot: Still requires a non-zero probability which is hard to justify for simple reflexes.
      *   *Behavioral:* Reply: Trade-offs imply a common currency of value, which implies a 'self' to experience the value. Soft spot: "Implies" is a big leap for a hard empiricist.

  5.  **Determining Concessions and Holds:**
      *   *Concede:* We don't know the neural substrate. We can't prove subjective experience directly (hard problem).
      *   *Hold:* The precautionary principle applies regardless of proof. The scale of numbers changes the ethical calculus.

  6.  **Identifying the "One Reply":**
      *   It has to be the bridge between the empirical uncertainty and the ethical necessity. "Uncertainty is not zero." If they convince the room that $P(\text{sentience}) = 0$, the talk dies. If they accept $P > 0$, the math takes over.

