  **JOINT STATEMENT ON THE AGGREGATION OF HARMS**
  **Adversarial Collaboration Draft v1.0**

  **Preamble**
  This document records the current state of disagreement between the undersigned parties regarding the aggregation of small harms against catastrophic harms. The purpose is not to resolve the dispute but to isolate the precise points of divergence, eliminate verbal misunderstandings, and identify the empirical or intuitive inputs that would force a revision of either position.

  **I. Agreed Claims**
  Both parties affirm the following:
  1.  **The Core Claim of Aggregation:** Aggregationism asserts that moral value is additive across individuals and/or experiences. Sufficiently many instances of a trivial harm can outweigh a single instance of extreme harm.
  2.  **Concessions:** The Aggregationist concedes that the implication (that enough eye-specks outweigh fifty years of agony) is deeply counter-intuitive and risks alienating common moral sensibilities. The Anti-Aggregationist concedes that rejecting aggregation risks arbitrariness (the "where do you draw the line?" problem) and may imply ignoring vast amounts of suffering to prevent a single instance of a worse type.
  3.  **The Role of Numbers:** Both agree that numbers matter *ceteris paribus*. If the harm types are identical, more harm is worse than less. The dispute concerns whether *different* harm types are comparable via a common metric.
  4.  **Decision Relevance:** Both agree this is not merely axiological; it bears on policy, resource allocation, and risk imposition.

  **II. Residual Disagreements**

  | Feature | Aggregationist Position | Anti-Aggregationist Position |
  | :--- | :--- | :--- |
  | **Value Structure** | **Archimedean:** All harms are mutually comparable on a single scale. There exists a number *n* such that *n* specks > 1 agony. | **Non-Archimedean:** Some harms are lexically superior. No number of specks equals one agony. |
  | **Separateness** | **Reductionist:** The boundaries between persons are not morally fundamental for summation. | **Distinctness:** The distribution of harms across distinct agents matters morally, not just the sum total. |
  | **Mathematics** | **Standard Summation:** Moral arithmetic follows standard real-number addition. | **Lexical Ordering:** Moral arithmetic follows a vector or hierarchical ordering where higher-order terms dominate lower-order terms regardless of quantity. |

  **III. Linguistic and Conceptual Clarifications**
  We suspect a portion of the disagreement stems from ambiguous terminology. We agree to distinguish the following:

  1.  **"Better Than" (Axiological) vs. "Ought" (Deontic):**
      *   *Suspicion:* The Aggregationist uses "better than" to mean "higher total utility," while the Anti-Aggregationist often hears "morally permissible to impose."
      *   *Resolution:* We agree that one might believe State A is *axiologically better* than State B (more value) but that it is *deontically impermissible* to choose A via certain procedures (e.g., sacrificing one for many). However, the core dispute remains: Is State A actually *better*?
  2.  **"Harm" (Phenomenological) vs. "Harm" (Moral Weight):**
      *   *Suspicion:* We may agree on the phenomenology (what the pain *feels* like) but disagree on the moral weight.
      *   *Resolution:* We agree to treat "harm" in this document as *moral disvalue*, not just raw sensation. If we disagree on whether a speck is a "harm" in the relevant sense, that is a substantive disagreement, not a verbal one.

  **IV. Critical Test Cases**
  We commit to the following positions regarding specific variations of the core case.

  **1. The Intra-Personal Case**
  *Scenario:* Instead of many people getting specks, one person receives one speck a day for enough days to match the original "colossal number."
  *   **Aggregationist Prediction:** The verdict does not change. If the sum outweighs agony across persons, it outweighs it within a person. Separateness is not doing the work.
  *   **Anti-Aggregationist Prediction:** *Undetermined.* This case strips out the "separateness of persons" defense. If the Anti-Aggregationist still rejects aggregation here, the view relies on lexical thresholds within a single life (e.g., agony is a different *kind* of badness than annoyance, even for one person). If they accept aggregation here, the view is fundamentally about distribution, not value.
  *   **Commitment:** We will revisit this case to determine if the Anti-Aggregationist view collapses into a threshold view within a single life.

  **2. The Probabilistic Case (The Power-Tower Lottery)**
  *Scenario:* One person faces a 1/(10^^10) chance of agony. Everyone else faces a *certain* eye-speck.
  *   **Aggregationist Prediction:** Expected utility applies. The tiny probability discounts the agony, making the trade-off even easier to justify.
  *   **Anti-Aggregationist Prediction:** *Crucial Test.* Does the lexical barrier hold against risk? If the probability is low enough, does agony become "tradable"?
  *   **Commitment:** If the Anti-Aggregationist admits that a low enough probability makes agony tradable against specks, the view becomes a threshold view based on *expected* harm, not categorical harm. This is a potential crux.

  **3. The Sorites Ladder**
  *Scenario:* A chain of cases. Rung 1 is 10^^10 specks. Rung 1000 is 50 years of agony. Each rung is marginally worse than the last (slightly more intense pain, or slightly fewer people).
  *   **Aggregationist Commitment:** We assert "Better" (or "Less Bad") at every single step. There is no break. To deny a break at any specific rung is arbitrary.
  *   **Anti-Aggregationist Commitment:** We assert there *must* be a break where the comparison flips. We acknowledge the difficulty of identifying the precise rung but deny that the inability to name the rung implies the break does not exist.
  *   **The Prediction:**
      *   *Aggregationist:* If forced to identify a specific rung where the switch happens, the Anti-Aggregationist will fail or choose arbitrarily. This arbitrariness falsifies the lexical view.
      *   *Anti-Aggregationist:* If forced to accept "Better" at every step, the Aggregationist is forced to accept the original counter-intuitive conclusion (Specks > Agony). This absurdity falsifies the Archimedean view.
  *   **Status:** This is the primary stalemate. We agree that the Ladder demonstrates that one of us must accept a bullet: either Arbitrariness (Anti-Agg) or Absurdity (Agg).

  **V. Falsification Conditions**
  To move forward, we agree on what evidence would count against our respective positions.

  **Evidence Against Aggregationism:**
  1.  **Stable Intuition:** If, upon rigorous reflection, the intuition that "Specks cannot outweigh Agony" remains as robust as basic logical truths (e.g., modus ponens), aggregationism loses its claim to reflective equilibrium.
  2.  **Intra-Personal Collapse:** If the Aggregationist must accept that a lifetime of mild annoyance *within one life* outweighs a decade of agony *in that same life*, and this is deemed phenomenologically impossible, the additive model of value is suspect.

  **Evidence Against Anti-Aggregationism:**
  1.  **The Arbitrary Line:** If the Anti-Aggregationist cannot provide a principled reason for the lexical threshold other than "it feels wrong," the view risks being a rationalization of intuition rather than a theory.
  2.  **Risk Collapse:** If the Anti-Aggregationist accepts that a sufficiently small *risk* of agony is tradable against specks, the lexical barrier is permeable. If it is permeable to risk, it is likely permeable to quantity, undermining the core non-Archimedean claim.

  **VI. Conclusion**
  We agree that the dispute is not merely verbal. It rests on fundamental commitments regarding the structure of value (Archimedean vs. Lexical) and the moral significance of personal boundaries. The Sorites Ladder remains the decisive testing ground. We commit to analyzing the Ladder not to find the "correct" rung, but to determine which bullet—Arbitrariness or Absurdity—is more theoretically costly.

  **Signatures:**

  _____________________ (Aggregationist)

  _____________________ (Anti-Aggregationist)

  _____________________ (Facilitator)
