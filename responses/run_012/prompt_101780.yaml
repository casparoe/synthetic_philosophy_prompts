      *   *Check:* Did I address the arbitrariness? Yes, the "intentional amplification" argument.
      *   *Check:* Is the recommendation implementable? "Cap on entropy production" might be hard to measure. Better: "Cap on decoherence events per second" or "Limit on molecular mass/complexity." Let's go with "limits on system complexity and decoherence rates" subject to technical review.
