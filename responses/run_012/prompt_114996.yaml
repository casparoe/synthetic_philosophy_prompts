answer: |-
  Dear Colleague,

  You have described a phenomenon with a precision that suggests you are standing very close to a significant gap in the literature, and I suspect your intuition that this is distinct from the standard toolbox of social science concepts is correct. The core mechanism you are identifying is indeed what the philosopher Ian Hacking called the looping effects of human kinds, but your specific addition regarding the stability of the measurement apparatus adds a layer that Hacking himself did not fully theorize. Hacking distinguished between indifferent kinds, like quarks, which do not change when classified, and interactive kinds, like people, who can change their behavior and self-understanding in response to the classification. When you describe patients adopting a label and thereby altering the typical features of the category, or conversely avoiding a label and thereby stripping the category of all but the most severe cases, you are describing the two vectors of this interactive loop. So to answer your question on whether this is one thing or two, the movement of the population in either direction is the same phenomenon, merely driven by different valences of the label, whether it is experienced as a resource or a stigma.

  However, the crucial insight you have added, the one that moves beyond Hacking, is the silent recalibration of the instruments to maintain statistical stability. In Hacking's original formulation, the looping effect often leads to a change in the prevalence or the understanding of the kind, which is visible. What you are describing is a situation where the ontology shifts but the epistemology is forced to remain static. This is not merely a looping effect; it is a looping effect that has been administratively stabilized. To answer your question about whether the recalibration is part of the phenomenon, I would argue that it is essential to the specific epistemic danger you are identifying. Without the recalibration, you simply have a changing population, which is difficult but manageable for science. With the recalibration, you have a false continuity that allows research to accumulate across incommensurable populations under the guise of stability. This makes the phenomenon distinct from a category that was simply ill-defined from the start, because here the criteria are ostensibly fixed while the referent moves, and it is distinct from open revision because the shift is masked by the instrumentation.

  Regarding the essential features, awareness is necessary for the looping part of the process but not for the masking part. The classified people must be aware of the category, either to embrace it or avoid it, for the population extension to shift. This is what makes it an interactive kind rather than a natural kind. However, the researchers or administrators who adjust the thresholds to keep the prevalence numbers steady do not need to be aware of the ontological drift, nor do they need to be cynical. They may simply be following standard psychometric procedures to ensure reliability, unaware that they are preserving the number at the cost of the referent. This is why Goodhart's law does not quite fit, as you noted, because there is no intentional gaming of the metric for reward, but rather a systemic commitment to continuity that inadvertently camouflages the change.

  Since there is no single established term that captures both the interactive shift of the population and the silent stabilization of the metric, I propose we call this homeostatic looping. The term looping preserves the connection to Hacking's work on how classifications act on people, while homeostatic captures the systemic effort to maintain equilibrium in the data despite the underlying flux. Your first instance, where the category expands through adoption, is the more common example in contemporary psychiatry, often seen in conditions like autism or ADHD where awareness leads to identification. Your second instance, where the category contracts through avoidance, is its mirror image and equally valid, often seen in conditions carrying heavy stigma like certain personality disorders or substance use diagnoses in specific professional contexts. Both are examples of homeostatic looping because in both cases the numbers are kept steady while the people behind them change.

  The reason this matters, as you have clearly seen, is that it creates a body of research that cites itself across a fracture in reality. When instruments are recalibrated to maintain prevalence, measurement invariance across time is violated, yet the literature proceeds as if the construct is stable. This is not just a semantic issue but a validity issue that undermines the accumulation of knowledge. You are right to feel that this is distinct from concept creep, which implies a change in the definition or intension of the concept. Here the intension is stable, but the extension is drifting, and the drift is hidden. I would suggest that this is a fertile area for further work, particularly in how we validate longitudinal studies in clinical science. If you are looking for a way to frame this in your own writing, anchoring it in Hacking's interactive kinds while specifying the homeostatic mechanism of the measurement apparatus should provide the philosophical weight you are looking for. It is a subtle but powerful distinction, and naming it helps to make the invisible shift visible.

  Yours sincerely,

  A Fellow Traveler in Science
