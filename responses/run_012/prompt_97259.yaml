answer: |-
  The beta-decay episode fails to decisively vindicate either account because both frameworks can reconstruct the community's choice to posit the neutrino as rational, differing only on whether that rationality stems from pragmatic systematization or insight into modal constraint. Mapping the actors reveals Bohr advocating for a statistical modification of energy conservation to fit the observed mosaic, while Pauli and Fermi argued for retaining strict conservation by expanding the ontology to include an undetected particle, with the broader community acting as arbiters of theoretical virtue. For the Humean, this choice is a straightforward optimization problem within the Best System Account: retaining energy conservation as an axiom yields a system with significantly greater strength and predictive unity, outweighing the simplicity cost of adding a hidden variable to the mosaic, making Bohr's proposal a rational but ultimately inferior competing systematization. For the anti-Humean, the episode demonstrates the governing power of laws, where Pauli's insistence reflects an epistemic access to real modal constraints that necessitate the missing energy, rendering Bohr's willingness to discard conservation a metaphysical error about the structure of reality rather than a mere pragmatic miscalculation. However, the episode exposes three critical limitations in the debate itself: first, conservation principles function as symmetry constraints rather than simple regularities or second-order relations, complicating their fit into standard Humean axioms or anti-Humean necessitation structures; second, the detection of the neutrino confirms the empirical adequacy of the theory but does no evidential work distinguishing the metaphysics, since both accounts predict successful detection if the theory is true; and third, the temporal gap challenges the Humean specifically, as Pauli's rationality *before* detection relies on a wager about the final shape of the total mosaic, whereas the anti-Humean can appeal to immediate modal intuition, yet both struggle to explain why the governing constraint or the best system remained hidden from the supervenience base for twenty-five years. Ultimately, the episode shows scientists treating laws as both summary tools and governing constraints simultaneously, suggesting the metaphysical dichotomy may not map cleanly onto actual scientific practice.
