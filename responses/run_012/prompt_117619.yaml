  ### Scoring Key

  Tally your answers to find your position.

  **Position (i): The Expected Value Maximiser**
  *   **Pattern:** Mostly 1B, 2A, 3A, 4A, 5B, 6A.
  *   **View:** Risk aversion is a mistake. You should simply maximise the mathematical average (expected value) of outcomes. If the odds are positive, you take the bet. Insurance is a bad deal unless it's legally required.
  *   **Verdict:** You're Dan's opposite number. You think paying for insurance is literally burning money.

  **Position (ii): The Risk-Weighted Utility Theorist (REU)**
  *   **Pattern:** 1A, 2A (or B), 3C, 4C (or B), 5A, 6B.
  *   **View:** Risk aversion is rational because certainty itself has value. You don't just weigh outcomes; you weigh the *probability* of getting them. A guaranteed £50k is worth more than a 99% chance of £55k, not because of the money, but because the *certainty* is a distinct good. You dislike variance generally.
  *   **Verdict:** You think Dan is right to buy insurance, but you'd also turn down the commute job because "life isn't a spreadsheet."

  **Position (iii): The Cumulative/Prioritiser (Rank-Dependent)**
  *   **Pattern:** 1A, 2A (or B), 3C, 4C (or B), 5A, 6C.
  *   **View:** Similar to (ii), but you care specifically about the *bottom tail*. You weight the odds of doing *at least this well*. You strongly prefer Structure Y in Q6 not just because it's less volatile, but because it specifically protects the floor (the chance of getting nothing). You care about security levels more than variance.
  *   **Verdict:** You're like (ii), but you'd pay more for a "no-questions-asked" refund policy than for a general warranty.

  **Position (iv): The Ambiguity Averter**
  *   **Pattern:** 1A/B, 2B, 3B/C, 4B/C, 5A/B, 6B/C.
  *   **Key Marker:** Question 2 (The Urn).
  *   **View:** Known risk is fine; unknown risk is not. You might take a 50/50 gamble, but you won't touch an urn with unknown contents. You distinguish between *risk* (known odds) and *uncertainty* (unknown odds).
  *   **Verdict:** You'd insure against theft, but you wouldn't invest in a startup where the market size is "unknown."

  **Position (v): The Maximin (Worst-Case) Defender**
  *   **Pattern:** 1A, 2B, 3B, 4C, 5A, 6C.
  *   **Key Marker:** Question 3 (The Commute) and Question 5 (Certainty).
  *   **View:** Ignore the odds; look at the worst outcome. If the worst case is death or ruin, you don't do it, even if the chance is 1 in a million. You maximise the minimum gain.
  *   **Verdict:** You wouldn't cross the road if there was a non-zero chance of a meteorite hitting you.

  **Position (vi): The Threshold/Structural Pluralist**
  *   **Pattern:** 1B (or A), 2A, 3A (or B), 4B, 5B, 6A.
  *   **Key Marker:** Question 4 (Kidney vs. Cash).
  *   **View:** Risk aversion depends on the *type* of good. Money is compensatable; health, identity, or life are not. It's rational to be risk-neutral with cash but risk-averse with kidneys.
  *   **Verdict:** You'd tell Dan to drop the insurance on his toaster, but keep the life insurance.

