          *   *Missing:* Assertability, Belief Revision, Semantics of 'If'.
      *   **Part 4: Evaluation of the Residue:**
          *   Is it a gap? No, it's a category error in the philosophy (trying to make operators into events).
          *   Does it dissolve? Yes, if you accept conditionals aren't events.
