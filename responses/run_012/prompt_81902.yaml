  # Research Proposal: Structural Safety and the Limits of Model-Independent Pareto Improvements

  **Project Title:** Structural Safety: Model-Independent Guarantees for Pareto Improvements in Strategic Interaction
  **Project Duration:** One Semester (4 Months)
  **Target Output:** 8,000-word Research Paper + Workshop Talk
  **Target Audience:** Game Theory Workshop (Mixed audience of formal theorists and cooperative AI researchers)

  ## 1. Motivation and Problem Statement

  The literature on Safe Pareto Improvements (SPIs) offers a compelling promise for cooperative AI and institutional design: it suggests we can modify a strategic situation (a game) to ensure all players are better off, without needing to know their utility functions or relying on their benevolence. The safety guarantee is supposed to hold "however the others play."

  However, upon close inspection, existing SPI results (e.g., those relying on program isomorphism, delegated bargaining, or correlated equilibrium selection) do not hold for *arbitrary* play. They hold relative to a specific class of behavioral assumptions. Typically, these assumptions include:
  1.  **Solution Concept Adherence:** Opponents play according to a specific solution concept (e.g., Nash Equilibrium, rationalizability).
  2.  **Isomorphism Invariance:** Opponents treat isomorphic game structures identically.
  3.  **Commitment Credibility:** Opponents believe commitments are binding and will be executed.

  These are not facts about the physical world; they are models of the opponent's reasoning process. If an opponent plays via a heuristic that violates isomorphism invariance, or if their "commitment" technology has a non-zero failure rate unknown to the proposer, the purported "safe" improvement may result in a Pareto *worsening*.

  This creates an epistemic vulnerability. In high-stakes cooperative AI scenarios (e.g., treaty verification between autonomous systems), we cannot assume common knowledge of rationality or specific learning dynamics. We need to know: **Is there a version of SPI whose guarantee derives from the structural constraints of the interaction mechanism itself, rather than from assumptions about the opponents' internal play rules?**

  Current literature leaves this open because it conflates *mechanism constraints* (what actions are physically available) with *behavioral constraints* (what actions a rational agent would choose). This project seeks to disentangle them.

  ## 2. The Research Question

  The central question of this project is determinate and formalizable:

  > **Does there exist a non-trivial game transformation $T: G \to G'$ such that for all players $i$, $u_i(\text{Outcome}(G')) \geq u_i(\text{Outcome}(G))$ holds for *all* play rules $\sigma$ consistent with a verifiable mechanism constraint $M$, without assuming $\sigma$ maximizes expected utility?**

  To make this precise, I will investigate three sub-questions:

  1.  **The Collapse Question:** As we expand the class of admissible play rules $\Sigma$ from "Nash Equilibria" to "All Best-Responses" to "All Strategy Profiles," does the set of valid SPIs shrink to the trivial set (identity transformations or dummy moves)? I aim to identify the threshold $\Sigma^*$ where non-trivial SPIs vanish.
  2.  **The Inference Question:** If non-trivial SPIs exist for a broad $\Sigma$, does guaranteeing safety require inferring the opponent's play rule $\sigma$? If so, is this merely Inverse Reinforcement Learning (IRL) shifted from preferences to behaviors, reintroducing the same underdetermination problems SPIs were meant to solve?
  3.  **The Uncertainty Question:** Does the existence of SPIs change if players are mutually uncertain about which play rule class $\Sigma$ the others are drawn from? (i.e., Is there a "Safe Pareto Improvement under Ambiguity"?)

  ## 3. Methodology: Mechanism-Relative Safety (MRS)

  I propose an approach I call **Mechanism-Relative Safety (MRS)**.

  **The Core Distinction:**
  Standard SPI literature treats safety as *Solution-Relative*. (e.g., "Safe for all Nash Equilibria").
  MRS treats safety as *Constraint-Relative*. (e.g., "Safe for all strategies physically enforceable by smart contract $C$").

  **Why this beats the alternatives:**
  *   **Vs. Robust Mechanism Design:** Robust mechanism design typically handles uncertainty over *preferences* (utilities). MRS handles uncertainty over *play rules* (behavioral algorithms), which is the specific bottleneck in cooperative AI where utilities may be aligned but bargaining protocols differ.
  *   **Vs. Ambiguity Aversion:** Ambiguity aversion models usually apply to priors over states of the world. Here, the ambiguity is over the *decision algorithm* of the other player. MRS formalizes this as a set of admissible functions rather than a set of priors.
  *   **Vs. Standard SPI:** Standard SPI assumes the opponent "respects the transformation." MRS asks *what physical or cryptographic infrastructure is required to force that respect* without assuming the opponent's rationality.

  **Formal Framework:**
  I will model a "Play Rule" as a mapping $\sigma: \text{Game Forms} \to \Delta(\text{Action Profiles})$.
  A transformation $T$ is MRS-safe relative to a constraint set $\mathcal{C}$ if:
  $$ \forall \sigma \in \mathcal{C}, \forall u \in \mathcal{U}, \mathbb{E}_{\sigma(T(G))}[u] \geq \mathbb{E}_{\sigma(G)}[u] $$
  Where $\mathcal{C}$ is defined not by rationality, but by verifiable constraints (e.g., "strategies must be computable in polynomial time," "strategies must respect cryptographic commitments").

  ## 4. Work Plan (One Semester)

  **Month 1: Formalization and The Collapse Test**
  *   **Goal:** Define the hierarchy of play rule classes $\Sigma_1 \subset \Sigma_2 \dots \subset \Sigma_{all}$.
  *   **Task:** Formalize "Triviality." (e.g., transformations that do not change the game tree or add only dominated strategies).
  *   **Deliverable:** A lemma establishing the "Collapse Boundary." I will attempt to prove that for $\Sigma = \text{All Functions}$, only trivial SPIs exist.
  *   **Risk:** The definition of "trivial" might be contentious. I will define it operationally: a transformation is trivial if it does not alter the set of feasible payoff vectors.

  **Month 2: Small Game Analysis (Existence Proofs)**
  *   **Goal:** Find concrete counter-examples to the Collapse Conjecture in restricted settings.
  *   **Task:** Analyze 2x2 games (Prisoner's Dilemma, Battle of the Sexes, Stag Hunt).
  *   **Method:** Construct specific mechanism constraints (e.g., "Player 2 can observe Player 1's move before acting, but Player 1 cannot observe Player 2's commitment"). Check if SPIs exist for *all* play rules consistent with this information structure, not just best-responses.
  *   **Deliverable:** A catalog of "Structurally Safe" transformations for canonical games.

  **Month 3: The Inference and Uncertainty Layer**
  *   **Goal:** Address sub-questions (b) and (c).
  *   **Task:** Model the players as having beliefs over $\Sigma$. Does an SPI exist that is safe for all *beliefs* over $\Sigma$?
  *   **Method:** Adapt the "maximin" criterion. If I don't know your play rule, can I still propose a transformation that is safe for *my* worst-case belief about your rule?
  *   **Deliverable:** A theorem on "Ambiguity-Resistant SPIs" or a proof of impossibility.

  **Month 4: Synthesis and Workshop Preparation**
  *   **Goal:** Assemble the paper and talk.
  *   **Task:** Write the 8,000-word paper. Focus on clarity of definitions.
  *   **Talk Prep:** Design a 20-minute presentation that walks game theorists through the "Collapse" intuition without getting bogged down in cooperative AI jargon.
  *   **Deliverable:** Final Paper and Slide Deck.

  ## 5. Expected Outcomes and Failure Conditions

  **Success Criteria:**
  1.  **Positive Result:** Identification of a specific class of mechanism constraints $\mathcal{C}$ (e.g., "verifiable conditional commitments") that admits non-trivial SPIs for a play rule class $\Sigma$ strictly larger than "Nash Equilibria."
  2.  **Negative Result (Theorem):** A proof that for any $\Sigma$ large enough to include "irrational" heuristics (e.g., tit-for-tat with noise), the only safe improvements are trivial.
      *   *Note:* A negative result is scientifically valuable. It would demonstrate that SPIs *necessarily* require behavioral modeling, correcting a misconception in the cooperative AI community that SPIs are "assumption-free."

  **Failure Conditions:**
  *   **Vagueness:** If "mechanism constraint" cannot be distinguished from "behavioral assumption" in the formalism (e.g., if enforcing a constraint requires assuming the opponent respects the enforcement), the project fails to distinguish itself from standard implementation theory.
  *   **Triviality:** If the only MRS-safe transformations are mathematically trivial (e.g., adding a null move), the project concludes that Structural Safety is impossible. (This counts as a successful *result*, but a failed *research program* for practical application).
  *   **Scope Creep:** Attempting to solve for general $N$-player games rather than focusing on 2-player canonical forms. I will restrict to 2-player to ensure completion.

  ## 6. Significance and Contribution

  This project addresses a foundational ambiguity in cooperative AI and institutional design. Currently, proponents of SPIs argue that we can cooperate safely without trusting the other party's *goals*. This project tests whether we can cooperate safely without trusting the other party's *reasoning*.

  **For Game Theorists:** It extends implementation theory by shifting the uncertainty from payoffs to decision algorithms. It asks: "What can be implemented if we don't assume agents are utility maximizers, but only that they are bound by specific physical/computational constraints?"

  **For AI Safety:** It clarifies the requirements for robust delegation. If SPIs collapse without behavioral assumptions, then safe AI cooperation requires accurate models of opponent cognition (mindreading), not just secure communication channels (handshaking). This directs research resources toward interpretability and modeling rather than just protocol design.

  **For the Workshop:** It provides a rigorous critique of "assumption-free" cooperation claims, offering a formal language to discuss *which* assumptions are doing the heavy lifting.

  ## 7. Pre-Mortem: What Would Change My Mind?

  The reasoning in this proposal is most likely to break on the distinction between **Structure** and **Behavior**.

  **The "Structure is Behavior" Objection:**
  My framing relies on the idea that a "mechanism constraint" (e.g., a smart contract that blocks certain moves) is fundamentally different from a "behavioral assumption" (e.g., the opponent chooses not to make certain moves).
  *   **Consideration that would change my mind:** If I find that verifying a mechanism constraint *necessarily* requires assuming the opponent models the mechanism correctly.
      *   *Example:* I propose a contract that punishes defection. For this to be a "structural" guarantee, the punishment must occur automatically. But if the opponent can hack the contract, or if the court enforcing the contract has discretion, then the "structure" relies on the *behavior* of the enforcer.
      *   *Implication:* If every structural constraint bottoms out in a behavioral assumption about the enforcer (even if the enforcer is physics), then "Model-Independent Safety" is a category error. There is no view from nowhere; there is only a view from *some* model of the enforcer.

  **The Break Point:**
  If, in Month 2, I find that every "structural" constraint I define (e.g., "action $A$ is impossible") can be re-interpreted as a behavioral assumption ("the opponent believes $A$ is impossible and acts accordingly"), I will have to pivot.
  *   **Pivot:** The paper would then argue that **SPIs are inherently epistemic.** The contribution would shift from "finding model-independent SPIs" to "cataloging the minimal behavioral models required for specific SPIs."
  *   **Why this matters:** It prevents the cooperative AI community from hiding behind "structural" claims that smuggle in strong rationality assumptions. It forces an explicit accounting of the epistemic debt.

  **Likelihood of Break:**
  I estimate a 40% chance that the Structure/Behavior distinction collapses under formal scrutiny. If it does, the project still succeeds by proving the impossibility of the original goal, but the *framing* of the solution changes from Mechanism Design to Epistemic Game Theory. I am prepared to write the "Impossibility of Model-Independence" paper if the "Existence of Structural Safety" paper proves untenable.

  ## 8. Conclusion

  The promise of Safe Pareto Improvements is that we can engineer cooperation without needing to know the minds of our partners. This project tests the load-bearing walls of that promise. By rigorously distinguishing between safety guaranteed by *rules of the game* versus safety guaranteed by *models of the player*, this work will clarify the true cost of robust cooperation. Whether the result is a new class of structurally safe mechanisms or a no-go theorem on assumption-free safety, the output will tighten the formal foundations of cooperative AI and offer game theorists a novel perspective on implementation under algorithmic uncertainty.
