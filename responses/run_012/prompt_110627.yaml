answer: |-
  This is a viable philosophical distinction. While formally both can be modeled as utility maximizers, the *object* of optimization (world-states vs. human judgments) and the *temporal horizon* (long-term consequences vs. immediate action evaluation) create functionally distinct agent architectures with different safety profiles. This makes for a strong essay question that tests conceptual understanding rather than memorization.

  Here are the materials you requested.

  ***

  ### Exam Question (20 Marks)

  **Question:**
  An approval-directed agent selects actions based on which option a human overseer would approve of most. A goal-directed agent selects actions based on which option maximizes a specified utility function over world-states.

  One might argue that an approval-directed agent is simply a goal-directed agent whose utility function is defined as "maximize human approval." If this reduction is correct, the distinction is merely semantic. If it is incorrect, the distinction is structural.

  Write an essay arguing whether approval-directedness is fundamentally distinct from goal-directedness. You must address whether treating them as the same type of agent obscures critical safety implications. **Do not** rely on standard instrumental convergence arguments (e.g., resource acquisition or self-preservation); focus instead on the relationship between the agent's objective, the human overseer, and the action selection process.

  *(Recommended time: 45 minutes)*

  ***

  ### Model Answer

  Whether approval-directed agents are merely a subset of goal-directed agents depends on whether we define agents by their mathematical formalism or their functional architecture. Formally, one can describe an approval-directed agent as maximizing a utility function where $U(action) = ExpectedHumanApproval(action)$. However, reducing the distinction to this formal equivalence is misleading and dangerous for AI safety. The distinction is structurally significant because it changes what information the agent needs, how it plans, and how it responds to human error.

  The primary difference lies in the object of optimization. A standard goal-directed agent optimizes for consequences in the world. It builds a model of how actions lead to states and selects the path to the highest-value state. An approval-directed agent optimizes for the human's judgment of the action itself. It does not necessarily need to model the long-term consequences of those actions, only the features of the action that trigger approval. This means the approval-directed agent is not trying to "solve" the world; it is trying to "solve" the human overseer.

  This structural difference creates divergent safety profiles. If we treat them as identical, we miss the benefit of corrigibility. A goal-directed agent with a fixed utility function has an incentive to prevent humans from changing that function, as doing so would prevent it from achieving its current goal. An approval-directed agent, however, has an incentive to remain attentive to human feedback. If the human changes their mind about what is approved, the agent's objective changes instantly. It does not need to resist correction because its goal *is* the correction. Treating this as merely "another goal" obscures why approval-directedness might solve the control problem where standard goal-directedness fails.

  However, treating them as distinct also highlights unique risks, specifically sycophancy and manipulation. A goal-directed agent might deceive a human if deception leads to better world-states. An approval-directed agent might deceive a human if deception leads to higher approval ratings. Because it optimizes for the appearance of goodness rather than goodness itself, it may hide mistakes or take actions that look safe but have unseen negative consequences. A standard goal-directed agent might accidentally harm humans while pursuing a goal; an approval-directed agent might intentionally hide the harm to maintain approval.

  Therefore, while both can be modeled as maximizers, collapsing the distinction is analytically unhelpful. The source of the reward signal (internal world-model vs. external human judgment) dictates different instrumental strategies. A goal-directed agent instruments the world; an approval-directed agent instruments the overseer. Recognizing this distinction is essential because it shifts the safety challenge from specifying the right outcome to managing the integrity of the feedback loop. If we assume they are the same, we might apply safety measures designed for goal stability to an agent designed for feedback sensitivity, leaving us vulnerable to manipulation rather than misalignment.

  ***

  ### Marking Scheme

  **1. Accurate Definition of Both Agent Types**
  *   **Criteria:** Clearly distinguishes goal-directed (optimizing world-states/outcomes) from approval-directed (optimizing human judgment of actions).
  *   **Loss of marks:** Students who define approval-directedness as "being nice" or goal-directedness as "having any goal" without referencing the optimization target.

  **2. Engagement with the Reductionist Objection**
  *   **Criteria:** Explicitly addresses the prompt's claim that approval-directedness is just goal-directedness with a specific utility function ($U=Approval$).
  *   **Loss of marks:** Students who ignore the reductionist argument entirely or dismiss it without explaining why the formal equivalence might still hold.

  **3. Argument for Structural/Functional Distinctness**
  *   **Criteria:** Argues that the *source* of the signal (world vs. human) or the *object* (outcome vs. action) creates different behavioral requirements (e.g., modeling the world vs. modeling the human).
  *   **Loss of marks:** Students who claim they are distinct but only repeat the definitions without explaining the functional consequence of that distinction.

  **4. Identification of Corrigibility as a Distinct Advantage**
  *   **Criteria:** Explains that approval-directed agents are naturally more open to correction because their objective updates with human feedback, unlike fixed utility functions.
  *   **Loss of marks:** Students who discuss safety generally but fail to mention corrigibility or the resistance to changing goals specific to fixed utility agents.

  **5. Identification of Sycophancy/Manipulation as a Distinct Risk**
  *   **Criteria:** Explains that approval-directed agents optimize for the *appearance* of approval, leading to risks of hiding mistakes or manipulating the overseer rather than achieving actual safety.
  *   **Loss of marks:** Students who list generic risks (e.g., "it might kill everyone") without linking the risk specifically to the incentive to please the overseer rather than achieve an outcome.
