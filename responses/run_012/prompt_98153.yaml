      *   *Premise 2: Efficacy of Intervention.* Did the lesson work *because* of the action taken, or despite it? (Counterfactual problem).
      *   *Premise 3: Contextual Neutrality.* Do the differences (nuclear weapons, geography, domestic politics) not outweigh the similarities?
      *   *Premise 4: Moral/Strategic Equivalence.* Is the current adversary actually analogous to Hitler? (The "Who is Hitler?" problem).

