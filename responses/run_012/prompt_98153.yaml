      *   *Requirement:* The "rhyme" must imply *causal* similarity, not just aesthetic. If it's just surface (Thesis 3), the lesson doesn't hold. If it's just projection (Thesis 5), it's bias.
      *   *Necessary Reading:* Thesis 2 (Causal Mechanisms) supported by Thesis 4 (Stable Dispositions). The logic of appeasement must work the same way now as then.

  6.  **Identifying Further Premises for Lesson Transfer:**
