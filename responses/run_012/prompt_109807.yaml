answer: |-
  1. This practice commits us to a transactional theory of corruption where influence is deemed improper only when it resembles a private bribe aimed at an official's personal gain rather than institutional persuasion. It assumes money becomes toxic solely when it attaches to a person's private account, not when it amplifies an organization's voice on policy.

  2. It assumes legislators owe their constituents reasoned judgment on issues rather than strict insulation from organized pressure or direct financial dependence. The legislator is viewed as a trustee capable of weighing lobbying arguments without being owned by them, provided no direct candidate funding changes hands.

  3. It assumes my pen represents private conscience while the lobbyist's budget represents institutional speech, legitimizing the latter as democratic participation rather than coercion. This distinction presumes that money only corrupts when it targets a candidate's election, not when it targets the legislation itself.

  4. This view rules out the structural account that locates the wrong in unequal access to the legislative ear regardless of explicit transactions. It merely happens to fit the domination account in its prohibition of candidate bribes, though it ignores the domination of legislation itself.

  5. If unequal access were the true wrong, the society would need to cease lobbying entirely or subordinate its spending to a system of public funding for opposing views. The ethics code would need to expand from banning personal gifts to limiting the volume of institutional advocacy itself.
