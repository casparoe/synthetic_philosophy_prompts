answer: |-
  The polygenic score example is correct, but it must lack a clear "winner" (use trade-offs like heart health vs. anxiety) to force ethical weighing. It must lack state coercion to prevent immediate eugenics panic. Confirm: The "shop window" point is the principle, not a mistake; PB ranks *available* options, not abstract ideals.

  1.  **Present the Case (10 mins):** Describe the clinic scenario with trade-offs. Ask: "Is choosing higher education scores ethically different than choosing lower disease risk?" Do not define PB yet; this prevents premature camp formation.
  2.  **Elicit Intuitions (10 mins):** Let clinicians and philosophers clash. Allow the "medicine vs. enhancement" argument to surface naturally so you can dismantle it later with theory rather than assertion.
  3.  **Define Procreative Beneficence (5 mins):** Introduce the principle only now. Define it strictly: "Select the child expected to have the best life, based on available relevant information." Delaying definition avoids triggering ideological defenses too early.
  4.  **Address "Just Medicine" (5 mins):** Clarify PB targets *well-being*, not just health. If education correlates with well-being, it is in scope. This separates the principle from traditional medical models immediately.
  5.  **Address "Obligation" (5 mins):** State clearly: PB is a moral principle, not necessarily a legal duty. Distinguish "should" from "must" to reduce defensive reactions about parental blame.
  6.  **Address "Harm" (5 mins):** Explain the Non-Identity Problem. The unselected embryo isn't harmed by not existing; no one is wronged by being born less advantaged if they wouldn't otherwise exist.
  7.  **Address "Shop Window" (5 mins):** Emphasize PB ranks *available* options, not abstract ideals. You aren't obliged to create a genius, only to pick the smarter of the two you have. This is the principle, not a misunderstanding.
  8.  **Address "Social Good" (5 mins):** Clarify PB is agent-relative (for the child), not utilitarian (for the state). This blocks the slide into eugenics by focusing on individual welfare rather than population improvement.
  9.  **Explicit Exclusions (5 mins):** Say aloud: "We are ignoring state coercion, historical eugenics, and resource allocation to focus on the individual parental duty." This contains the scope and validates the clinicians' safety concerns.
  10. **Closing Question (5 mins):** Ask: "If PB is true, does it require you to delay conception until you are richer, if that predicts a better life for the child?" This tests if they understand the principle's structure versus specific embryo technologies.
