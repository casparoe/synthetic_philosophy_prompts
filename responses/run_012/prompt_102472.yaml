answer: |-
  # Specification of Adequacy for Theories of Free Will and Moral Responsibility

  ## I. The Desiderata

  A candidate theory is adequate only if it satisfies the following requirements. Each requirement is anchored to a specific case, distinction, or background commitment that motivates it.

  ### A. Case Sensitivity
  The theory must deliver distinct verdicts or explanations for the following scenarios without ad hoc adjustment:

  1.  **The Coercion Constraint:** The theory must distinguish the agent signing a contract at gunpoint from the willing collaborator signing with enthusiasm.
      *   *Motivation:* Intuitive difference in responsibility despite identical physical outcomes.
  2.  **The Identification Constraint:** The theory must distinguish the addict who endorses her habit from the addict who fights it.
      *   *Motivation:* Internal psychic conflict matters; mere desire strength is insufficient.
  3.  **The Alternative Possibilities Constraint:** The theory must provide a verdict on the Frankfurt-style agent who could not have done otherwise but acted exactly as she wanted.
      *   *Motivation:* To test whether "could have done otherwise" is necessary for responsibility.
  4.  **The Compulsion Constraint:** The theory must distinguish the kleptomaniac from the ordinary thief.
      *   *Motivation:* Pathological impulse differs from ordinary temptation.
  5.  **The History Constraint:** The theory must provide a verdict on the agent whose values were deliberately sculpted by someone else (manipulation) but who now endorses them wholeheartedly.
      *   *Motivation:* To test whether the *origin* of values matters or only their current structure.
  6.  **The Omission Constraint:** The theory must account for the person who does nothing while someone drowns.
      *   *Motivation:* Responsibility attaches to failures to act, not just positive actions.
  7.  **The Epistemic Constraint:** The theory must account for the person acting on a false belief.
      *   *Motivation:* Ignorance can excuse; the theory must specify when and why.
  8.  **The Scalability Constraint:** The theory must state whether the freedom worth wanting can be attributed to collective agents (corporations/committees) or artificial decision-makers (models/AI).
      *   *Motivation:* To test if the theory relies on biological metaphysics or functional roles. Silence here is a failure of scope.

  ### B. Conceptual Distinctions
  The theory must preserve the following distinctions without collapsing them into one another:

  9.  **Freedom of Action vs. Freedom of the Will:** The theory must distinguish doing what one wants (action) from the capacity to form the wants themselves (will).
  10. **Sourcehood vs. Alternative Possibilities:** The theory must clarify whether being the *source* of an action is distinct from having the *ability to do otherwise*.
  11. **Freedom vs. Responsibility vs. Blameworthiness:** The theory must distinguish the capacity (freedom), the status (responsibility), and the negative sanction (blame). One can be responsible without being blameworthy (e.g., praiseworthy or neutral).
  12. **Compulsion, Coercion, Constraint, and Determination:** The theory must distinguish internal pathology (compulsion), external threat (coercion), physical barrier (constraint), and causal necessity (determination).

  ### C. Background Commitments
  The theory must remain consistent with the following broader commitments, or explicitly argue why the commitment is mistaken:

  13. **Metaphysical Neutrality:** The theory must be consistent with determinism being either true or false, or explain why it cannot be neutral.
  14. **Excusing Conditions:** The theory must align with our practice of excusing children, the deluded, and the intoxicated.
  15. **Phenomenology of Deliberation:** The theory must accommodate the experience of deliberation as the weighing of open futures.
  16. **The Point of Practice:** The theory must explain why responsibility has a point within our social practice of holding one another to account.
  17. **Gradability:** The theory must allow that freedom and responsibility might come in degrees, rather than being purely binary.

  ***

  ## II. Critical Audit of the Specification

  This section evaluates the specification itself. It distinguishes genuine requirements from partisan assumptions, identifies logical tensions, and isolates the most exclusionary constraint.

  ### 1. Genuine Desiderata vs. Camp Prejudices
  Not all items on the list above are neutral. Some smuggle in the conclusions of one camp as premises.

  *   **Genuine Desiderata:**
      *   **The Coercion and Compulsion Constraints:** Everyone agrees gunpoint and pathology differ from normal agency. A theory that collapses these is dead on arrival.
      *   **Excusing Conditions:** Any theory that makes children or the deluded fully responsible is revisionist to the point of uselessness.
      *   **The Point of Practice:** A theory of responsibility that cannot explain why we hold people accountable is merely metaphysical speculation, not an account of *moral* responsibility.
      *   **Scalability:** This is a genuine test of ontology. If freedom is a functional role, AI should qualify. If it is biological, they should not. The theory must pick one.

  *   **Camp Prejudices (Disguised as Requirements):**
      *   **The Alternative Possibilities Constraint:** Demanding that the theory "provide a verdict" on Frankfurt cases often presupposes the compatibilist intuition that the agent *is* responsible. Incompatibilists argue the intuition is wrong. A neutral requirement is not "match the intuition," but "explain the intuition or explain why it is an error."
      *   **Metaphysical Neutrality:** This is a compatibilist demand. Libertarian incompatibilists argue that if determinism is true, free will is impossible; therefore, a theory *should not* be consistent with determinism. A neutral requirement is "explain the relationship to determinism," not "be consistent with it."
      *   **Sourcehood vs. Alternative Possibilities:** Prioritizing "Sourcehood" as a distinct requirement often favors incompatibilist (or semi-compatibilist) frameworks that seek to bypass Alternative Possibilities.

  ### 2. Incompatible Pairs (The Trade-Offs)
  You cannot satisfy all these requirements simultaneously. The following pairs create logical tension that forces a theoretical choice:

  *   **The History Constraint vs. Metaphysical Neutrality:** If a theory requires a specific *history* to rule out manipulation (e.g., "values must be formed without interference"), it struggles to distinguish manipulation from determinism. If the causal chain of determinism is just a longer version of manipulation, the theory fails Neutrality. If it says history doesn't matter (Structuralism), it fails the History Constraint.
  *   **The Alternative Possibilities Constraint vs. The Frankfurt Intuition:** You cannot maintain that "could have done otherwise" is necessary for responsibility (PAP) and simultaneously validate the intuition that the Frankfurt agent is responsible. One must be rejected.
  *   **Phenomenology of Deliberation vs. Determinism:** If deliberation *essentially* feels like branching futures, and the theory asserts determinism is true (and branching is illusory), the theory must explain why the phenomenology is not systematically deceptive. If it cannot, it fails the Phenomenology requirement.

  ### 3. The Single Most Exclusionary Requirement
  **The History Constraint (The Manipulation Case).**
  This requirement does the most work in ruling candidate theories out.
  *   **Why:** Standard compatibilist theories are typically *structuralist* (looking only at the agent's current psychology). The Manipulation Case destroys structuralism because the manipulated agent looks psychologically identical to the normal agent. To satisfy this requirement, a theory must become *historicist* (looking at the past). But once a theory becomes historicist, it becomes incredibly difficult to distinguish manipulation from ordinary deterministic causation without collapsing into incompatibilism. Thus, this single requirement forces compatibilists to abandon structuralism and incompatibilists to explain the difference between manipulation and natural causation. It is the graveyard of easy answers.

  ### 4. The Scalability Requirement: Defect or Boundary?
  Regarding the requirement to account for Collective and Artificial Agents:
  *   **The Dilemma:** If a theory falls silent here, it is usually because it relies on a metaphysical ingredient (e.g., "conscious qualia," "soul," "biological homeostasis") that collectives/AI lack.
  *   **The Verdict:** Silence marks a **defect** if the theory claims to describe the *conditions of agency* generally. If a corporation can be sued, fined, and held to account, a theory of moral responsibility that cannot locate the freedom in the corporation is failing to describe the actual practice of responsibility. However, if the theory claims to describe *human* dignity specifically, silence is a proper boundary.
  *   **Recommendation:** Treat silence as a defect. Our legal and social practices *already* attribute responsibility to collectives. A theory of free will that cannot map onto existing practices of collective accountability is descriptively inadequate.

  ***

  ## III. Positional Weaknesses

  **Compatibilism** looks weakest against **The History Constraint** and **The Scalability Constraint**. It struggles to explain why the manipulated agent is unfree while the determined agent is free without arbitrary line-drawing, and it often relies on human-specific psychological structures that fail to map onto AI or committees.

  **Incompatibilism** looks weakest against **The Point of Practice** and **Metaphysical Neutrality**. It struggles to explain how responsibility practices function if determinism is true (risking nihilism about responsibility), and it often demands a form of "ultimate sourcehood" that renders agency unintelligible or miraculous, violating the requirement to make sense of deliberation and social accountability.
