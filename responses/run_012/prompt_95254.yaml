answer: |-
  This is a sharp formulation. You have effectively combined the classic underdetermination argument (Duhem-Quine) with a complexity-theoretic constraint. It is a potent challenge to naive realism. However, because it relies on a specific construction ($T$ vs. $T'$), it exposes specific flank vulnerabilities.

  Here is a map of the position's exposure, ranked from fatal structural flaws to awkward concessions.

  ### 1. The Verification Gap (Fatal)
  **The Objection:** You claim $T$ and $T'$ are empirically equivalent for *every* observation we could make. But if $T'$ is computationally intractable (e.g., requires resources exceeding the Bekenstein bound of the universe to derive a prediction), then **we cannot verify the equivalence.**
  **Why it counts against you:** To assert $T'$ is a rival, you must establish that $T'$ yields the *same* predictions as $T$. If the derivation is intractable, you cannot demonstrate this equivalence empirically or computationally. You can only assert it via a mathematical proof of equivalence. But if you have a proof that $T'$ reduces to $T$, then $T'$ is arguably just $T$ in disguise (see Individuation below). If you don't have a proof, the claim that they are empirically equivalent is itself an underdetermined hypothesis.
  **Verdict:** **Fatal.** It undermines the premise that we *know* $T'$ is empirically equivalent. You are asking us to believe in the equivalence of a theory whose predictions we cannot access.

  ### 2. The Individuation Cheat (Fatal)
  **The Objection:** Your construction posits an extra entity whose *only* role is to hinder computation. In philosophy of science, this is often dismissed as "gratuitous baggage" or "idle wheels." If an entity has no causal impact on observables (by definition of empirical equivalence) and no role in the derivation other than to obstruct it, most accounts of theory individuation classify $T$ and $T'$ as the **same theory** expressed differently.
  **Why it counts against you:** If $T$ and $T'$ are the same theory, there is no underdetermination. You have merely described the same theory with a clumsy syntax. For $T'$ to be a genuine rival, the extra entity must be ontologically distinct *and* the distinction must be meaningful. If the distinction makes no difference to predictions *or* derivations (other than speed), it is metaphysically inert.
  **Verdict:** **Fatal.** If accepted, it dissolves the problem into a linguistic confusion. A defender must argue that ontology matters even when causally inert, which is a hard sell.

  ### 3. Universal Solvent / Unfalsifiability (Fatal)
  **The Objection:** You ask if it is a feature or a bug if every scientific practice can be redescribed as algorithmic underdetermination. It is a **bug.**
  **Why it counts against you:** If AU explains why we choose General Relativity over a slower rival, and also why we choose Quantum Mechanics over a deterministic hidden-variable theory, and also why we reject phlogiston, it has no discriminatory power. A thesis that claims "All theory choice is driven by tractability" is falsified by any instance where scientists retain a computationally expensive theory because the evidence demands it (e.g., QCD is computationally nightmarish, but we keep it because it works; we don't swap it for a simpler, false theory).
  **Verdict:** **Fatal.** If the thesis cannot identify a case where tractability *lost* to evidence, it is not a theory of choice; it is a tautology about how we define "best."

  ### 4. Tractability as an Epistemic Virtue (Concede Happily)
  **The Objection:** You suspect computational tractability might be an epistemic virtue. You should accept this.
  **Why it counts against you:** It doesn't, actually. It saves your position from being anti-realist. If the universe is intelligible, it must be computationally accessible to minds like ours. A theory that posits the universe is fundamentally intractable (like $T'$) is likely false because it makes the success of science a miracle. Therefore, preferring $T$ over $T'$ is not just pragmatic; it is **truth-conducive.**
  **Verdict:** **Concede.** This collapses your distinction between pragmatic and epistemic. It saves Scientific Realism. You should update to: "Tractability is a proxy for truth because a truth that cannot be computed is indistinguishable from a falsehood."

  ### 5. Bayesian Absorption (Merely Awkward)
  **The Objection:** A Bayesian agent assigns priors based on simplicity (Solomonoff induction). $T'$ is more complex than $T$. Therefore, $T'$ has a lower prior probability. The "computational cost" is absorbed into the complexity penalty.
  **Why it counts against you:** It suggests you don't need a new category of "algorithmic underdetermination." This is just standard underdetermination handled by Occam's Razor. The choice is still epistemic (maximizing probability), not purely pragmatic (utility).
  **Verdict:** **Merely Awkward.** It forces you to argue that priors are pragmatic, not epistemic. Many Bayesians will disagree, but it doesn't break your argument, it just relocates it.

  ### 6. Scientific Practice (Merely Awkward)
  **The Objection:** Working scientists do not reject theories because they are "ontologically bloated but equivalent." They reject them because they are ad hoc, lack explanatory power, or conflict with other established theories. They rarely, if ever, cite "computational intractability of the ontology" as a reason for falsehood.
  **Why it counts against you:** It suggests your problem is a philosopher's invention, not a scientist's burden. If the "normal condition of theoretical science" were AU, scientists would be constantly debating $T$ vs. $T'$. They debate $T$ vs. $T_{rival}$ where predictions diverge.
  **Verdict:** **Merely Awkward.** A defender can claim scientists are implicit pragmatists who don't realize it. But the absence of explicit debate is evidence against the salience of the problem.

  ---

  ### Specific Answers to Your Questions

  **Is the construction legitimate, or does it cheat by individuating theories syntactically?**
  It likely cheats. Unless the extra entity in $T'$ has *some* potential causal role (even if currently unobservable), it is syntactic noise. If it *does* have a potential causal role, then $T$ and $T'$ are not empirically equivalent (future evidence could distinguish them). You cannot have it both ways: distinct ontology requires potential empirical difference; empirical equivalence implies ontological redundancy.

  **Does empirical equivalence really extend to all future evidence?**
  No. If the extra parameter in $T'$ interacts with anything, even weakly, it breaks equivalence. If it interacts with *nothing*, it is not a physical entity, it is a ghost. If it is a ghost, realism about it is meaningless.

  **Could a Bayesian account absorb the computational difference?**
  Yes. Computational complexity correlates with description length. Shorter descriptions get higher priors. This makes tractability an epistemic virtue (probability), not just a pragmatic one (utility).

  **Does the fact that $T'$ is unusable make it not a genuine rival?**
  Yes, by the criterion of **scientific viability.** A theory that cannot generate predictions within the lifespan of the universe is not a scientific theory; it is a metaphysical speculation. If it's not a scientific theory, it cannot underdetermine a scientific one.

  **What does the position predict that its rivals do not?**
  AU predicts that as computational power increases, we should see scientists adopting ontologically "heavier" theories that were previously rejected solely for tractability reasons.
  **What pattern in actual practice, if absent, would count against it?**
  If we gain infinite computing power and scientists *still* reject $T'$-style theories in favor of $T$-style theories, then tractability was not the deciding factor; truth-likeness was. (Currently, even with supercomputers, we prefer the Standard Model over more complex equivalents).

  **Has the position been qualified into unfalsifiability?**
  It is at high risk. If you define "usable" loosely enough, any chosen theory is "usable" and any rejected theory is "unusable." To avoid this, you need an objective measure of tractability independent of human preference.

  ---

  ### What You Should Update On

  1.  **The Epistemic Status of Tractability:** Stop treating tractability as purely pragmatic. There is a strong argument (from Wigner to modern complexity theory) that **computability is a constraint on physical law.** If a theory requires hyper-computation to yield predictions, it is likely physically false. Thus, choosing $T$ over $T'$ is a truth-tracking move.
  2.  **The Definition of "Rival":** Tighten your criterion. $T'$ is only a rival if the extra entity is *in principle* detectable, even if *in practice* hidden. If it is *in principle* undetectable, $T'$ is not a rival; it is a different language for $T$.
  3.  **The Realist Conclusion:** Your argument does not kill realism; it refines it. It suggests realism should be committed to the **computational structure** of the world, not just its causal structure.

  **Final Verdict:** The strongest critic would call the **Verification Gap** fatal (you can't know they are equivalent). The strongest defender would concede that **Tractability is Epistemic** (saving realism). You should update on the latter. Your intuition that "practical equivalence is metaphysical equivalence" is sound, but it supports a pragmatic *realism*, not an anti-realist underdetermination.
