      *   This is a sophisticated philosophical position, touching on van Fraassen (constructive empiricism), Laudan/Leplin (empirical equivalence), and recent work on non-epistemic values in science.
      *   *Critical Flaw Identification:* The core move relies on $T$ and $T'$ being *empirically equivalent* (EE). If $T'$ makes computation intractable *in principle* vs. *in practice*, does that affect predictions? If it's just slow, it's not EE in a strong sense if we can't actually derive the prediction to check it. If it's intractable *in principle* (e.g., halting problem), then $T'$ might not yield predictions at all, breaking EE.
      *   *Realism Defense:* Realists often argue that tractability *is* an epistemic virtue because nature is likely computable/efficient (Wigner's "Unreasonable Effectiveness").
      *   *Individuation:* The biggest vulnerability is whether $T'$ is a distinct theory or just $T$ with "gratuitous baggage."
      *   *Structure:* I need to address the specific questions asked (legitimacy, EE, Bayesian, rival status, predictions, unfalsifiability) and rank them.

  3.  **Drafting the "Map of Exposure" (Iterative Process):**

