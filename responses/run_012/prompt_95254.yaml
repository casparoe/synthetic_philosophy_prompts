      *(Self-Correction during drafting)*: I need to be careful about the definition of "intractable." If it means NP-hard, it's still computable, just slow. If it means uncomputable, $T'$ yields no predictions. The user says "computationally intractable," usually meaning complexity class issues. If $T'$ takes $10^{100}$ years to predict an eclipse, is it empirically equivalent? Practically, no. Logically, yes. This distinction is crucial. I must highlight the *accessibility* of the predictions.

      *(Refining the "Realism" angle)*: The user worries this kills realism. I should point out that many realists *already* accept pragmatic virtues as guides to truth (e.g., simplicity). So AU might not kill realism, just refine it.

      *(Final Polish)*: Ensure the tone is direct, analytical, and respects the user's intelligence. Avoid "survey of literature" style. Focus on the *structure of the argument*.

