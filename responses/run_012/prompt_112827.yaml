      *   **Core Concept:** The coach's method is based on Kavka's Toxin Puzzle (billionaire, vial, pain, money paid for *intention* not *action*).
      *   **The Joke/Irony:**
          1.  The coach doesn't realize the puzzle is unsolvable (you can't intend to do something you know you won't do once the reward is secured).
          2.  He blames clients' mindsets for failing.
          3.  The "success story" is vacuous (client wanted to do the thing anyway, so the intention was genuine, making the payment redundant).
          4.  The "Common Objections" box misstates the philosophical objection as "limiting beliefs."
          5.  The actual product sold at the end is an irrevocable commitment contract (penalty for non-action), which bypasses the puzzle entirely but the coach doesn't notice the contradiction.
      *   **Brand:** Invent a name (e.g., "IntentionCap," "ToxinFlow," "MindSettle"). Let's go with "IntentCap."

  2.  **Deconstruct Kavka's Toxin Puzzle (for accuracy):**
      *   Scenario: Eccentric billionaire offers $1M.
      *   Condition: At midnight tonight, you must *intend* to drink a toxin tomorrow afternoon.
      *   Consequence: Toxin makes you ill for a day, no lasting harm.
      *   Payment: Money deposited tomorrow morning (before drinking time).
      *   Catch: You don't actually have to drink it to get the money, only intend to drink it at midnight. But once money is in the bank, you have no reason to drink it, so you can't form the intention at midnight.
      *   Coach's Misunderstanding: Thinks you can just "choose" the intention, get the money, and then decide later. Doesn't grasp the rationality problem.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound buzzwordy. "Monetize Your Intent," "The Toxin Protocol," "Intentional Capital." Let's try: *Stop Doing. Start Intending.*
