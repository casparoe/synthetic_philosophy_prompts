          *   *Parsimony:* Inflicts pain beyond what was deemed necessary for the original offense.
          *   *Equality:* Treats the detainee as a means to an end (public safety) without the limit of the law.
      *   *Retributivist Critic:* "This is double jeopardy. You served your time. You are being punished twice."
      *   *Bentham's Answer:* "It is not punishment *for the past crime*, it is security *against future danger*. Like quarantining a disease carrier." (Bentham distinguished between punishment and measures of security).
