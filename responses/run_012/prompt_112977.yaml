answer: |-
  ### Taxonomy and Shares of the Side-Effect Effect

  I have merged "Moral Badness" and "Violation of a Norm" into a single **Normative Sensitivity** family, as empirical evidence suggests moral badness is merely a potent subset of prescriptive norm violation. The remaining families are retained but ranked by explanatory weight.

  **Tier 1: The Dominant Mechanism**
  *   **Normative Sensitivity (55%):** This family posits that intentionality judgments are sensitive to whether an action violates a prescriptive norm (moral, conventional, or functional).
      *   *Unique Power:* It explains why the effect persists for non-moral norm violations (e.g., etiquette or technical rules) where moral blame is absent.
      *   *Shrinking Condition:* Its share would shrink if intentionality judgments remained high for side effects that violate no known norm (moral, conventional, or statistical).

  **Tier 2: The Moderating Mechanisms**
  *   **Pragmatic Blame/Praise Asymmetry (25%):** This family argues that attributing intentionality is a communicative tool used primarily to hold agents responsible for bad outcomes rather than credit them for good ones.
      *   *Unique Power:* It explains why the effect diminishes in contexts where assigning responsibility is irrelevant or impossible (e.g., abstract logic puzzles).
      *   *Shrinking Condition:* Its share would shrink if the asymmetry persisted in tasks where participants are explicitly forbidden from assigning blame or praise.
  *   **Attitudinal/Deep Self (15%):** This family claims intentionality depends on whether the side effect aligns with the agent's deeper values or attitudes (e.g., did they care?).
      *   *Unique Power:* It explains the attenuation of the effect when an agent explicitly expresses regret or attempts to prevent the side effect.
      *   *Shrinking Condition:* Its share would shrink if agents who actively tried to prevent a bad side effect were still judged as having brought it about intentionally at the same rate as indifferent agents.

  **Tier 3: The Weak Confound**
  *   **Statistical Abnormality (5%):** This family suggests the effect arises because bad side effects are perceived as rarer or more unexpected than good ones.
      *   *Unique Power:* It explains minor variance in cases where norm violation is held constant but outcome frequency is manipulated.
      *   *Shrinking Condition:* Its share would shrink if the effect remained robust when the bad side effect was statistically more common than the good one.

  ***

  ### Predictions for Variants

  **(a) A foreseen bad side effect that the agent actively tried to prevent**
  *   **Normative:** Predicts **High Intentionality** (the norm-violating outcome occurred due to the action).
  *   **Pragmatics:** Predicts **Low Intentionality** (blame is deflected by the prevention attempt).
  *   **Attitude:** Predicts **Low Intentionality** (the outcome contradicts the agent's stance).
  *   **Expected Winner:** **Attitude/Pragmatics.** Empirical data shows intentionality ratings drop significantly when prevention is attempted, suggesting the Normative account alone is insufficient without attitudinal nuance.

  **(b) A foreseen side effect that violates only a conventional norm**
  *   **Normative:** Predicts **High Intentionality** (any prescriptive norm violation triggers the effect).
  *   **Pragmatics:** Predicts **Moderate Intentionality** (blame is weaker for conventional violations than moral ones).
  *   **Attitude:** Predicts **Variable Intentionality** (depends on the agent's regard for the convention).
  *   **Expected Winner:** **Normative.** Studies (e.g., Knobe's "Assistant" vignette) show the effect persists robustly for conventional norms, provided the norm is salient.

  **(c) A side effect that foreseeably harms a few people and benefits many**
  *   **Normative:** Predicts **Ambiguous Intentionality** (conflicting norms: do not harm vs. maximize good).
  *   **Pragmatics:** Predicts **Low Intentionality** (net benefit reduces the drive to blame).
  *   **Attitude:** Predicts **High Intentionality** (if the agent prioritized the many).
  *   **Expected Winner:** **Pragmatics.** In utilitarian trade-offs, the asymmetry typically attenuates because the "blameworthiness" is diluted by the net good, reducing the pragmatic need to attribute intent.

  **Overall Champion:** **Normative Sensitivity.** It provides the broadest baseline, subsuming moral badness and extending to conventional norms, though it requires the Attitudinal family to explain prevention cases.

  ***

  ### The Decisive Experiment

  **The "Dead Agent" Vignette:**
  Present participants with a scenario where an agent performs an action that violates a norm and causes a bad side effect, but the agent dies immediately after acting, making blame assignment functionally impossible (no punishment, no reputation damage). Ask only about intentionality, not responsibility.

  *   **Why it separates the top two:** The **Pragmatic** family predicts the effect should vanish or drastically reduce because the communicative utility of blaming is removed. The **Normative** family predicts the effect will persist because the judgment is about the action's relation to the norm, not the utility of blaming.
  *   **Cost:** Cheap (online survey vignette study).

  **The Embarrassing Result:**
  If intentionality ratings in the "Dead Agent" condition drop to chance levels (eliminating the asymmetry), it would embarrass my ranking by proving that **Pragmatics** is the primary driver and that **Normative Sensitivity** is merely a proxy for the desire to blame.
