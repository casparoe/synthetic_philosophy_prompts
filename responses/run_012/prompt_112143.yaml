answer: |-
  # Joint Statement on the Semantics of Moral Discourse

  **Signatories:** [Expressivist Colleague] and [Deflationary Cognitivist Colleague]
  **Date:** October 26, 2023

  ## 1. Agreed Claims

  We agree on the following claims regarding the phenomena any semantic theory of moral language must accommodate. These claims are neutral regarding the underlying metaphysics but constrain the range of acceptable theories.

  1.  **Surface Syntax and Logic:** Moral sentences (e.g., "Lying is wrong") share the surface syntax of ordinary declarative sentences. They participate in logical inferences (such as *modus ponens*) with the same formal validity as descriptive sentences.
  2.  **The Indifferent Negation:** A sentence like "Lying is not wrong," when asserted by a speaker who feels no con-attitude toward lying (mere indifference), is meaningful and asserts a proposition that contradicts "Lying is wrong." The meaning does not vanish when the speaker's emotional engagement is absent.
  3.  **Moral Conditionals:** Conditionals with moral antecedents and consequents (e.g., "If lying is wrong, then telling white lies is wrong") are meaningful even when the speaker rejects the antecedent. The validity of inferences using such conditionals does not depend on the speaker currently holding the attitudes expressed in the antecedent.
  4.  **Mixed Disjunctions:** Disjunctions combining moral and descriptive content (e.g., "Either lying is wrong or the museum opens at nine") are grammatically well-formed and truth-evaluable in ordinary discourse. A theory must explain how the moral disjunct contributes to the truth conditions or correctness conditions of the whole without requiring the speaker to endorse the moral content.
  5.  **Attitude Embeddings:** Moral sentences embed under both factive verbs (e.g., "He regrets that lying is wrong") and non-factive verbs (e.g., "She hopes that lying is wrong"). In the factive case, the truth of the complement is presupposed; in the non-factive case, it is not. Any adequate theory must distinguish these contexts without positing different meanings for the embedded moral sentence.
  6.  **Comparatives:** Moral comparatives (e.g., "Lying is worse than cheating") function logically as ordering relations. They support transitivity and entailment relations comparable to non-moral comparatives (e.g., "This box is heavier than that one").
  7.  **The Truth Predicate:** The predicate "is true" applies felicitously to moral sentences (e.g., "It is true that lying is wrong"). This usage permits generalization (e.g., "Everything the judge said is true") and endorsement.
  8.  **Action-Guiding Force:** Moral judgments are inherently connected to motivation and action. While not logically impossible to judge something wrong without being motivated to avoid it, there is a conceptual internal link such that a complete lack of motivation typically signals a failure to fully grasp the judgment or a practical irrationality.
  9.  **Theory Obligations:** A successful theory must explain the logical data (Claims 1–7) without rendering the action-guiding force (Claim 8) mysterious. It must not posit metaphysical entities that are epistemologically inaccessible or causally inert.

  ## 2. Residual Disagreements

  While we agree on the data, we disagree on the best explanation of that data. The following table outlines our divergent formulations. We have endeavored to state each position in terms the proponent accepts, without begging the question against the opponent.

  | Domain | Expressivist Formulation | Deflationary Cognitivist Formulation | Verbal or Substantive? |
  | :--- | :--- | :--- | :--- |
  | **Semantic Function** | The primary function of a moral sentence is to express a non-cognitive con-attitude (disapproval) rather than to describe a state of affairs. Truth-conditions are derivative or simulated. | The primary function of a moral sentence is to state a proposition that is truth-apt. The expression of attitude is a pragmatic consequence of the content, not the semantic core. | Substantive |
  | **Nature of "Fact"** | To call a moral sentence "factual" is to commit to robust, mind-independent moral properties. Since we reject such properties, we should deny moral sentences are truth-apt in a robust sense. | To call a moral sentence "factual" is merely to note it is a declarative sentence capable of being negated and embedded. "Fact" is deflationary; no robust properties are required. | Verbal (see Section 3) |
  | **Attitude Verbs** | In "He regrets that lying is wrong," the complement clause does not refer to a fact but to the content of an attitude. Factivity here signals shared normative commitment, not metaphysical correspondence. | In "He regrets that lying is wrong," the complement clause refers to a proposition. Factivity signals that the proposition is true. The deflationary notion of truth suffices here. | Substantive |
  | **Motivation** | Motivation is internal to the judgment because the judgment *is* (or constitutively involves) an attitude. No separate desire is needed to explain action. | Motivation involves a judgment plus a independent conative state (e.g., a desire to be moral). The internal link is explained by the normal co-occurrence of these states in rational agents. | Substantive |

  ## 3. The Cruxes

  We identify three sub-questions where settling the matter would significantly alter the dialectical landscape. We assess below whether these are genuine theoretical disagreements or merely verbal disputes.

  **(i) Whether an expressivist semantics can validate the same inferences a truth-conditional semantics validates.**
  *   **Verdict:** **Genuine Crux.**
  *   **Defense:** This is not merely about labeling. If expressivism cannot reconstruct standard logical validity (e.g., ensuring that "If lying is wrong, then getting your brother to lie is wrong" + "Lying is wrong" entails "Getting your brother to lie is wrong") without ad hoc devices, it fails as a semantics. The Cognitivist argues that only truth-conditions preserve validity across contexts. The Expressivist argues that consistency of attitude can preserve validity. This is a technical dispute about the capacity of a non-truth-conditional system to handle logic.

  **(ii) Whether the expressivist is forced to treat the moral predicate as ambiguous between its asserted and unasserted occurrences.**
  *   **Verdict:** **Genuine Crux.**
  *   **Defense:** If the word "wrong" means *express disapproval* in "Lying is wrong" but means something else in "If lying is wrong...", the theory posits a systematic ambiguity. This is a theoretical cost (violating parsimony). If the Expressivist can show the meaning is univocal while the *force* changes, the cost is mitigated. If they cannot, the Cognitivist wins on theoretical virtue. This is a substantive dispute about semantic compositionality.

  **(iii) Whether "truth-apt" marks a substantive commitment or is mere bookkeeping.**
  *   **Verdict:** **Verbal Dispute.**
  *   **Defense:** We agree that there are no "queer" moral facts in the world. We agree that moral sentences behave grammatically like declaratives. The Cognitivist calls this "truth-apt" because the grammar allows it. The Expressivist resists "truth-apt" because they associate the term with robust representationalism. Since the Cognitivist is a *deflationist*, they do not believe "truth-apt" implies robust representation. Therefore, the disagreement rests on the connotations of the label "truth-apt," not on the metaphysics or the linguistics. Once we agree that "truth" is deflationary, the Expressivist could accept the label without abandoning their view, and the Cognitivist could drop the label without changing their view. The substantive disagreement is actually about *motivation* (see Section 2, Row 4), not truth-aptness itself.

  ## 4. Evidence and Predictions

  For each crux, we specify the arguments or cases that bear on the question, our respective predictions, and what would count as evidence against our own views.

  ### Crux (i): Logical Validity
  *   **The Case:** The "Moral Modus Ponens."
      *   Premise 1: If lying is wrong, then getting your brother to lie is wrong.
      *   Premise 2: Lying is wrong.
      *   Conclusion: Getting your brother to lie is wrong.
  *   **Expressivist Prediction:** We can define a logic of "commitment" or "consistency of attitude" that validates this inference without assigning truth values to the premises. The inference is valid because holding the attitudes in the premises while lacking the attitude in the conclusion is a state of practical inconsistency.
  *   **Cognitivist Prediction:** Any system that validates this without truth-conditions will be overly complex or fail to generalize to mixed inferences (e.g., moral + descriptive). Truth-conditions are the only known mechanism that seamlessly handles mixed validity.
  *   **Falsification Conditions:**
      *   *Expressivist:* If it is demonstrated that logical validity *necessarily* requires preservation of truth values (not just consistency), expressivist semantics fails.
      *   *Cognitivist:* If the Expressivist produces a simple, compositional logic that handles mixed inferences (Claim 4 in Section 1) as elegantly as truth-conditional logic, the Cognitivist's claim to superiority on logical grounds fails.

  ### Crux (ii): Predicate Ambiguity
  *   **The Case:** Embedding under Conditionals and Negation.
      *   Compare: "Lying is wrong" (Asserted) vs. "Is lying wrong?" (Question) vs. "If lying is wrong..." (Conditional).
  *   **Expressivist Prediction:** The semantic content (the proposition-like object) remains constant; only the illocutionary force changes. "Wrong" contributes the same semantic value in all three contexts.
  *   **Cognitivist Prediction:** The Expressivist will be forced to say "wrong" means *expresses disapproval* in the assertion but *the property of being such that expressing disapproval is appropriate* in the conditional. This is a covert ambiguity.
  *   **Falsification Conditions:**
      *   *Expressivist:* If we cannot specify a single semantic value for "wrong" that composes correctly in all contexts without referencing the speaker's current psychological state, the univocality claim fails.
      *   *Cognitivist:* If the Expressivist successfully defines a single semantic value that functions in embeddings without collapsing into truth-conditionalism, the charge of ambiguity is unfounded.

  ### Crux (iii): Substantiveness of "Truth-Apt"
  *   **The Case:** The Truth Predicate and Factive Verbs.
      *   Compare: "It is true that lying is wrong" vs. "He regrets that lying is wrong."
  *   **Expressivist Prediction:** Accepting "truth-apt" will inevitably lead to pressure to accept moral facts that explain the truth. Deflationism is unstable in the moral domain. We predict the Cognitivist will eventually be forced to admit robust moral realism to make sense of factivity.
  *   **Cognitivist Prediction:** We can maintain "It is true that lying is wrong" implies nothing more than "Lying is wrong." No robust facts are needed. The Expressivist's resistance is based on an inflated notion of truth that we explicitly reject.
  *   **Falsification Conditions:**
      *   *Expressivist:* If the Cognitivist can explain the factivity of "regrets" (Claim 5 in Section 1) without positing moral properties that causally interact with the world or are discovered via special intuition, the Expressivist's worry is unfounded.
      *   *Cognitivist:* If it turns out that preserving the action-guiding force (Claim 8 in Section 1) requires distinguishing moral truth from descriptive truth in a way that reintroduces a robust metaphysical gap, the deflationary account fails.

  ***

  **Signed,**

  _________________________
  [Expressivist Colleague]

  _________________________
  [Deflationary Cognitivist Colleague]
