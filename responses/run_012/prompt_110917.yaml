answer: |-
  **The W-Interval**

  The conductive gel was cold. That was the first thing Maya noticed, sharper than the hum of the amplifiers or the sterile smell of the psychology department's basement. Dr. Chen rubbed the grit into her scalp with a Q-tip, searching for low impedance, treating Maya's head like a motherboard that needed cleaning before it would boot.

  "Try to keep your head still," Chen said, stepping back to check the monitor. "Especially the eyes. Blinks create artifacts."

  Maya nodded, then stopped. *Don't nod.* She stared at the box on the table. Inside was the clock. It wasn't a normal clock. It was a black face with a single white dot sweeping around the circumference, completing a revolution every 2.56 seconds. A Watzke clock.

  "Remember the instructions," Chen said, sitting behind the glass partition. "Flex your right wrist whenever you feel the urge. Don't plan it. Don't count. Just let it happen. And note the position of the dot when you first feel the *urge* to move. Not when you move. When you decide to."

  Maya raised her right hand. The EMG electrodes on her forearm felt like little stickers of tension. She was here for the fifty dollars, technically. Gas money. But Leo had told her not to take the money.

  *"It's a category error,"* Leo had said over cheap coffee two days ago. He was a grad student in neurophilosophy, which meant he wore beanies in July and spoke in qualifiers. *"You're selling them your phenomenology, Maya. They need you to report the time of your awareness to prove that your awareness is late."*

  "It's just a wrist flex," Maya had said.

  "It's the threshold model," Leo insisted, leaning in. *"Schurger's reanalysis. The readiness potential isn't a decision building up. It's just background noise. Neural static. It drifts up and down randomly. When it hits a certain height, you move. The ramp you see on the EEG? That's an illusion. They average hundreds of trials. They line up the noise by the movement time, and suddenly random static looks like a slope. It's not a command, Maya. It's just the last straw breaking the camel's back."*

  "Okay," Chen's voice came over the intercom, snapping her back to the chair. "Trial one. Begin when ready."

  Maya watched the dot. *Tick-tick-tick.* It blurred slightly at the top of the arc.

  She wanted to game it. That was the secret itch she hadn't told Chen. She wanted to move *before* the brain decided. She wanted to catch the moment of choice like a thief in a hallway.

  She waited. The silence of the room pressed against her ears. She felt a twitch in her finger. Was that it? No, that was just nerves. She waited for the *urge*. The specific, conscious *Now I will do it* feeling.

  She flexed.

  She stopped the clock mentally. *Top right. Maybe two degrees past.*

  She typed the number into the keypad.

  "Good," Chen said. "Rest for ten seconds."

  Maya let her hand drop. Her phone buzzed in her pocket, against her thigh. She couldn't check it, but she knew who it was. Sarah. Her sister, the pragmatist.

  *"Don't let them freak you out,"* Sarah had texted that morning. *"Even if the brain starts it, you can stop it. Libet said that himself. Free Won't. You have the veto."*

  Maya stared at her wrist. The veto.

  If Leo was right, and the readiness potential (RP) was just noise drifting toward a threshold, then there was no decision to veto. You don't veto the weather. You don't veto a sneeze. If the neural noise just got loud enough to trip the motor cortex, the movement was inevitable the moment the noise peaked.

  But if Sarah was right, and there was a window between the unconscious buildup and the muscle firing—a window where the conscious self could slam the brakes—then where was the brake pedal?

  "Trial four," Chen said.

  Maya watched the dot. She tried to summon the urge artificially. *Move,* she thought. *Move now.*

  She flexed.

  Later, during the break, she would look at the screen. She'd see the EEG trace. The squiggly lines. The RP would be there, a negative slope starting maybe 500 milliseconds before the muscle fired. Her awareness, her W-time, would be marked at 200 milliseconds.

  Three hundred milliseconds where her brain was doing the thing before she knew she was doing it.

  But today, in the chair, she tried to find the gap. She waited for the noise. She tried to listen to her motor cortex like it was a radio tuning between stations. *Is it getting louder? Is the static building?*

  She couldn't feel it. She could only feel the result.

  "Trial nine."

  She flexed. She reported the time.

  "Trial ten."

  She didn't move. She waited. The dot went around. And around. She felt a pressure in her wrist, a ghost of a movement. She clamped down. *Veto,* she thought. *I am not moving.*

  She sat there for thirty seconds. Then, suddenly, her wrist flexed. She hadn't told it to. It just... happened. Like a sigh.

  "Did you record a W-time?" Chen asked.

  "No," Maya said. "I tried to stop it."

  "Did you feel the urge?"

  "Yes."

  "Then record the time of the urge. Even if you vetoed the movement initially, if the urge arose, we need that timestamp."

  Maya typed in a number. Her fingers felt heavy.

  This was the loop. The experiment needed her to report the moment she became aware. But the experiment was designed to measure the latency of that awareness against the brain activity. They were using her testimony as the clock to prove her testimony was slow.

  Leo's voice again: *"They ask you to be the authority on your own consciousness to prove you aren't the authority."*

  If she reported the urge too early, she messed up the data. If she reported it too late, she confirmed the delay. She was the calibration tool measuring her own inaccuracy.

  "Trial fifteen."

  Maya looked at the dot. It was just light on a screen. A photon stream.

  She thought about the averaging. That was the part that kept her up at night. The readiness potential wasn't on this screen right now. This screen showed raw EEG, messy and spiking. The smooth, sloping line of the RP only existed after they took five hundred of these trials, lined them up by the moment of movement, and averaged out the noise.

  They were creating a ghost from a hundred séances and calling it a cause.

  So, was this movement *now* part of the average? Was her wrist just a variable in a equation Dr. Chen would solve next week?

  *"It gets you off the hook,"* Leo had said. *"If it's noise, it's not a decision. You're not a puppet; you're a threshold detector."*

  *"It makes it worse,"* Sarah had countered. *"Because then the veto is just another threshold. You decide to stop, but maybe the 'stop' signal is just noise hitting a different wall. How do you know you chose to veto? Maybe the veto happened to you too."*

  Maya stared at the dot. It swept past the twelve o'clock position.

  She felt a sensation in her forearm. A tightening.

  Was this the noise drifting up? Was this the threshold being crossed? Or was this her, Maya, deciding to press the button to end the trial?

  She tried to isolate the *I*. She looked for the part of her that stood behind the eyes and pulled the lever. She found the sensation of the gel drying on her scalp. She found the ache in her lower back. She found the urge in her wrist.

  But she couldn't find the *chooser*.

  If she moved now, was it because the static got too loud? If she held still, was it because she vetoed it, or because the noise hadn't peaked?

  The dot swept around.

  She felt the tension rise. It felt like an inhale that wouldn't finish. It felt like a sneeze building. It felt like a decision.

  She looked at the clock. She opened her mouth to tell Dr. Chen the time, but she realized she didn't know what time it was. She didn't know when the feeling started. It was already there. It had always been there.

  The dot moved. The tension in her wrist hovered, neither rising nor falling, just waiting.

  Maya kept her hand still. She watched the dot complete the circle. She waited to see if she would let it go, or if it would let her go.

  "Ready for the next trial?" Chen asked.

  Maya looked at her hand. It looked like a hand. It looked like something attached to her.

  "I'm ready," she said.

  She didn't know if she meant it. She watched the dot start its sweep again, and she waited to see what would happen.
