answer: |-
  Any adequate theory must justify the intentional infliction of hard treatment by a legitimate authority on a specific subject without collapsing into mere price-setting, preventive detention, or instrumentalizing the innocent, while remaining consistent with empirical reality and moral constraints.

  ### 1. Conceptual Boundaries (What Counts as Punishment)
  *   **Requirement:** The theory must distinguish punishment from non-punitive impositions.
      *   **Rationale:** Without this, the state loses the specific moral burden required to inflict harm.
      *   **Distinction:** **Punishment vs. Penalty-as-Price.** A fine calibrated purely as a price (e.g., parking fee) lacks censure; punishment requires moral condemnation. **Test Case:** *A fine calibrated purely as a price, with no censure attached.* The theory must explain why this is a fee, not punishment, or admit the concept is fuzzy. [Non-negotiable]
      *   **Distinction:** **Punishment vs. Quarantine.** Preventive confinement must be distinguished from punitive confinement. **Test Case:** *Preventive detention of someone predicted to offend.* If the theory justifies this as punishment, it collapses into public health measures; if not, it owes a separate justification. [Non-negotiable]
      *   **Distinction:** **Punishment vs. Compensation.** Restoring the victim is not punishing the offender. [Non-negotiable]
      *   **Distinction:** **Desert vs. Suffering Delivered.** The theory must account for the gap between what is deserved and what is actually inflicted (e.g., due to error or leniency). [Preference: Retributists prioritize closing this gap; Consequentialists prioritize outcomes.]
      *   **Test Case:** *A sentence served somewhere demonstrably nicer than the offender's previous housing.* The theory must define "hard treatment" relative to a baseline (legal entitlement vs. prior status) or admit it has lost grip on what punishment is. [Non-negotiable]

  ### 2. Moral & Political Constraints (Who and Why)
  *   **Requirement:** The theory must specify legitimate standing and limits on instrumentalization.
      *   **Rationale:** Punishment is a political act, not private vengeance; persons are ends, not means.
      *   **Distinction:** **Standing.** Must identify who may punish (Victim, State, Vigilante, International Body). Private vengeance lacks legitimacy; state monopoly requires justification. [Non-negotiable]
      *   **Distinction:** **Practice vs. Act.** Justifying the institution (practice) may differ from justifying a specific sentence (act). [Preference: Rawlsian distinction vs. Unified theory.]
      *   **Distinction:** **May vs. Must.** The theory must clarify if punishment is discretionary or obligatory upon guilt. [Preference: Retributivism often leans toward "must"; Consequentialism toward "may".]
      *   **Test Case:** *The innocent scapegoat whose punishment would prevent a riot.* The theory must forbid using a person merely as a means to social stability. [Non-negotiable]
      *   **Test Case:** *Collective punishment of a group for one member's act.* The theory must defend or reject liability based on group membership versus individual agency. [Non-negotiable]

  ### 3. Subject & Identity Conditions (Who is Punished)
  *   **Requirement:** The theory must define the continuity of the subject liable for punishment.
      *   **Rationale:** Punishment targets an agent; if the agent ceases to exist or changes fundamentally, the target vanishes.
      *   **Test Case:** *The offender who, between crime and sentencing, has disposition and memory removed.* The theory must state if there is anyone left to punish. If the verdict flips, the requirement doing the work is **Psychological Continuity vs. Biological Identity**. [Preference: Retributivism struggles here if identity is psychological; Consequentialism struggles if deterrence requires identity.]
      *   **Test Case:** *Punishing the dead, or their estate.* The theory must explain if liability survives biological death or if the estate is a proxy. [Preference: Legal pragmatism vs. Moral agency.]
      *   **Test Case:** *Harm the offender already suffered by pure accident before trial.* The theory must decide if luck offsets state-inflicted suffering. If yes, it treats suffering as a quantum to be balanced; if no, it treats state infliction as categorically distinct from natural misfortune. [Preference: Retributivism often says no (state act is distinct); Utilitarianism might say yes (total suffering matters).]
      *   **Test Case:** *The person who committed the offense in order to be punished.* The theory must address voluntariness and whether the purpose of punishment (e.g., reform) is defeated by this intent. [Non-negotiable]

  ### 4. Empirical & Structural Consistency (Reality Checks)
  *   **Requirement:** The theory cannot contradict established social science or systemic facts.
      *   **Rationale:** A moral theory built on false empirical premises is practically inert or dangerous.
      *   **Constraint:** **Criminology on Deterrence.** The theory cannot assume harsher sentences always deter more if evidence says otherwise (marginal deterrence is weak). [Non-negotiable]
      *   **Constraint:** **Wrongful Convictions.** The theory must accommodate the fact that errors happen at scale without collapsing into nihilism or requiring impossible infallibility. [Non-negotiable]
      *   **Constraint:** **Offenders Aren't a Natural Kind.** The theory must apply to corporations and states, not just natural persons. [Non-negotiable]

  ### 5. Requirement Classification
  *   **Non-negotiable (Conceptual/Moral Floor):** Legitimate standing; No punishing the innocent (scapegoat); Distinction from price/quarantine; Empirical consistency (deterrence/errors); Definition of hard treatment (nice prison case).
  *   **Preference (Theoretical Commitment):** Practice vs. Act distinction; May vs. Must; Identity continuity (memory case); Offsetting prior accidental harm; Punishing the dead; Collective liability.

  ### 6. Incompatibilities (The Trilemma)
  *   **Flagged Conflict 1:** **Maximum Safety vs. No Innocent Punishment.** You cannot jointly satisfy *Preventive Detention of High-Risk Non-Offenders* (Safety), *Never Punish the Innocent* (Justice), and *Punishment Requires Past Act* (Legality). You must drop one.
  *   **Flagged Conflict 2:** **Individual Desert vs. Corporate Liability.** You cannot jointly satisfy *Punishment Requires Moral Agency/Consciousness* (Standard Retributivism) and *Corporations/States Are Liable* (Legal Reality) without redefining agency.
  *   **Flagged Conflict 3:** **Identity Continuity vs. Retributive Target.** You cannot jointly satisfy *Punishment Requires Psychological Continuity* (Memory case) and *Punishment Targets the Biological Actor* without contradiction when surgery occurs.

  ### 7. The Killer Requirement
  *   **Single Requirement:** **The constraint against punishing the innocent (Scapegoat Case).**
  *   **Why:** This alone knocks out pure Act-Consequentialism immediately, as it forbids optimizing utility in the specific case where punishing an innocent person yields the best outcome. It forces consequentialists into rule-utilitarian workarounds or hybrid models.

  ### 8. Scorecard
  *   **Retributivism:** **Passes** Innocent Scapegoat, Identity/Memory, and Past Act requirements. **Fails** Empirical Consistency (deterrence claims) and struggles with Corporate Liability and Prior Accidental Harm (why doesn't luck matter?).
  *   **Consequentialism:** **Passes** Empirical Consistency and Corporate Liability. **Fails** Innocent Scapegoat (without modification) and collapses Punishment vs. Quarantine (Preventive Detention).
  *   **Hybrid (e.g., Limit Retributivism):** **Passes** Innocent Scapegoat and Empirical Consistency. **Fails** Coherence (often masks the incompatibility between Desert and Utility) and struggles with the Memory/Identity case (which metric decides?).
