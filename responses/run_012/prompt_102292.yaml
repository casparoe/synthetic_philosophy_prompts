  9.  **Self-Correction on the Objection:**
      *   The prompt says: "Deal with it in the speech, don't just wave at it."
      *   I need to take a stance but leave room for debate.
      *   Stance: The shrug matters. If they shrug, they are treating themselves as objects. But is it our place to stop them? That's the tension.
      *   Actually, better stance: The test isn't about *their* reaction in the rerun, it's about *your* willingness to show the mechanics. If you rely on them shrugging, you're manipulating. If you rely on them agreeing even with the lights on, you're persuading.
