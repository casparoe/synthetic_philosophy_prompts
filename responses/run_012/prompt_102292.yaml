          *   *Best Idea:* Let's go with a health statistic. "Eating X reduces risk of heart attack by 50%." True (relative risk), but baseline was tiny. It steers behavior without lying.
          *   *Refinement:* Let's use a specific scenario relevant to the room. A headline about a study. "New Study Shows Coffee Prevents Cancer." It's true (statistically significant correlation), but the effect size is negligible. Is this manipulation?
          *   *Decision:* Let's use the "50% reduction" example. It's classic, understandable, and genuinely debatable whether it's necessary simplification or deceptive framing.
      *   **Closing:** Bring it back to the workshop. Invite them to apply the test to *me* right now.
      *   **Tone Check:** Honest, slightly vulnerable, not preachy. Avoid academic jargon.

  4.  **Refining the "Objection" Handling:**
      *   The prompt asks: "Some audiences would pass the rerun and shrug — yeah, you got me, so what. Does that break the test or is a feature?"
      *   My take: It's a feature that reveals the relationship. If they shrug, they've surrendered agency. In science comms, we don't want surrender; we want engagement. So the test holds: if the rerun reveals you bypassed their judgment, it's manipulation, even if they don't mind. The "shrug" is the sound of autonomy turning off.
      *   Wait, I need to be careful not to sound like I'm resolving it too neatly. The prompt says "show my work instead of resolving it." I need to leave some tension there.
      *   Revised plan: Acknowledge the shrug. Admit it's comfortable. But ask if comfort is the goal of science communication. Leave it as a question for the workshop.

  5.  **Drafting - The Borderline Case:**
      *   I need to insert this naturally.
      *   Example: "We say 'Scientists confirm link between X and Y.' The link is real. The confirmation is real. But the strength is weak. We lead with the link because 'weak link' doesn't sell. Is that arranging the room or rigging it?"
      *   Let's make it more specific. "We report that a new drug cuts risk by half. We don't mention the risk went from 2% to 1%. Both statements are true. One gets people treated. The other gets people worried. Which one did we publish? And if we publish the first, and you find out later we knew the second, does the rerun feel like a trick?"

  6.  **Reviewing against Constraints:**
      *   No quotes/citations. (Check)
      *   ~5 minutes spoken. (Check word count: ~130-150 words per minute -> 650-750 words).
      *   Pass the Rerun Test itself. (I need to be transparent about *why* I'm telling this story. I'm telling it to illustrate the difficulty, not to trick them into agreeing with me.)
      *   Include the objection handling.
      *   Include the borderline case.
      *   End with `\takeaway{...}`.

  7.  **Writing - Iteration 1 (Mental Outline):**
