answer: |-
  ### The Exam Question

  **Question 1**

  Consider the following policy dilemma. You control a fixed fund dedicated to preventing severe pain. You must allocate the entire fund to exactly one of two options:

  *   **Option H:** Prevent one adult human from experiencing one year of severe, incapacitating agony.
  *   **Option I:** Prevent a pesticide spray that would kill 10 billion insects.

  You possess a reliable scientific method regarding insect minds. It establishes that for *any given insect*, there is a 1% probability it is sentient. If sentient, the intensity of its pain upon death is stipulated to be 1/100th that of the human in Option H. If not sentient, its pain is zero.

  A straightforward expected-value calculation suggests Option I prevents the equivalent of 1 million human-years of agony (10 billion × 0.01 × 1/100), vastly outweighing Option H's single human-year. Yet, most people intuitively prefer Option H.

  Write an essay that identifies the specific philosophical premise where this argument must break. Do not simply list objections. You must commit to whether the error lies in (a) the interpretation of the probability claim, (b) the aggregation of moral weight, or (c) the validity of expected-value reasoning at this scale. Defend your choice and explain what this implies for how we treat insects in reality.

  ***

  ### Model Answer

  The argument presented relies on a multiplication of three variables: number of subjects, probability of sentience, and moral weight of experience. The conclusion—that we must save the insects—follows mathematically but clashes violently with moral intuition. To resolve this, we must identify which variable cannot bear the weight assigned to it. While the probability interpretation offers a technical critique, the true breaking point lies in the aggregation of moral weight, specifically the assumption that tiny units of expected pain can lexically override a certainty of severe human suffering.

  First, consider the probability claim. The prompt stipulates a 1% chance for *any given insect*. This implies individual variation: roughly 100 million insects are sentient, and 9.9 billion are not. However, sentience is usually a property of a kind, not a lottery ticket within a species. If the uncertainty is epistemic (we don't know if the *species* is sentient), then either all 10 billion are sentient or none are. If all are sentient, the expected suffering jumps to 100 million human-equivalents. If none, it is zero. Treating this as a per-individual probability smuggles in a metaphysical claim that sentience is randomly distributed like eye color. A sharp skeptic could reject the calculation here, arguing that we cannot multiply epistemic uncertainty across individuals as if it were metaphysical chance. However, even if we grant the worst-case scenario (all are sentient), the intuition against Option I often remains. Thus, the probability issue is not the primary failure point.

  The core error lies in the aggregation of moral weight. The argument assumes that moral value is linear and additive: that enough small pains sum to outweigh a large pain. This is the principle of unrestricted aggregation. Rejecting this allows us to preserve the intuition for Option H without denying insect sentience entirely. We can adopt a lexical priority view: severe agony has a moral weight that no number of minor pains can exceed, regardless of the expected value sum. On this view, the human's severe agony creates a deontological constraint or a lexical threshold that the insects' fleeting discomfort cannot breach. This explains why the math feels irrelevant; the units are not fungible.

  Finally, we must consider expected-value reasoning itself. If we accept unrestricted aggregation, we are forced into a reductio of expected-value theory in high-stakes, high-uncertainty contexts. If we always follow the expected value, we become vulnerable to "Pascal's Mugging" scenarios where tiny probabilities of astronomical stakes dominate all decision-making. To avoid this, we must discount probabilities below a certain threshold or cap the moral weight of uncertain experiences.

  I commit to the view that the error is in unrestricted aggregation (b). We should treat severe human agony as lexically superior to minor insect pain. This does not require denying insect sentience, which remains an open empirical question. Instead, it asserts a hierarchy of suffering. In reality, this means we should not sacrifice definite human welfare for speculative insect welfare, even at massive scales. However, it does not permit wanton cruelty; if the cost to humans is negligible (e.g., choosing one pesticide over another with equal efficacy), the insects' potential suffering breaks the tie. The scale argument fails not because the numbers are wrong, but because moral mathematics is not purely arithmetic.

  ***

  ### Marking Scheme

  **Total: 20 Marks (5 Criteria × 4 Marks)**

  | Criterion | Full Marks (4) | Common Error (0-2) |
  | :--- | :--- | :--- |
  | **1. Reconstruction of the Argument** | Clearly articulates the Expected Value formula (Number × Probability × Weight) and the resulting tension between math and intuition. | Merely repeats the prompt numbers without explaining the structural conflict or miscalculates the implication. |
  | **2. Analysis of Probability** | Distinguishes between individual variation vs. epistemic uncertainty about the kind, and explains why this matters for the sum. | Treats the 1% as a simple discount factor without questioning whether sentience distributes individually or specifically. |
  | **3. Analysis of Aggregation** | Explicitly addresses whether small pains can sum to outweigh large pains (linear vs. lexical priority) and takes a stance. | Assumes aggregation is obvious or fails to connect the "weight" variable to the intuitive rejection of Option I. |
  | **4. Evaluation of EV Reasoning** | Identifies whether the problem is specific to insects or a general flaw in Expected Value theory (e.g., Pascal's Mugging). | Treats the calculation as universally valid or dismisses EV reasoning entirely without explaining the boundary condition. |
  | **5. Commitment & Implication** | **Crucial:** Chooses one breaking point (a, b, or c) and derives a concrete policy implication without fence-sitting. | Hedges ("it depends"), concludes "we don't know," or fails to translate the philosophical choice into real-world treatment. |

  **Distinguishing A from B:**
  *   **B Grade:** The student correctly identifies the tension and lists all three possible objections (probability, aggregation, EV) but treats them as a menu of options without selecting the strongest one. They may conclude that "more research is needed" or that "both sides have merit."
  *   **A Grade:** The student **prioritizes**. They argue why one premise is the *actual* failure point (e.g., "Probability is a red herring; aggregation is the real issue"). They defend this hierarchy and accept the controversial consequences of that choice (e.g., accepting lexical priority even if it implies ignoring massive numbers of potential sufferers). The A answer is defined by **argumentative resolution**, not just coverage.
