  **CAUSALITY HOLDINGS**
  **FY2024 SUSTAINABILITY & MORAL RISK REPORT**

  **Letter from the Chief Ethics Officer**

  Welcome to the seventh annual disclosure of Causality Holdings' moral liquidity position. This year, our clients navigated a volatile regulatory landscape characterized by heightened scrutiny of direct agency. Despite this, our portfolio of non-intervention strategies outperformed expectations. Throughout Q3, the Doing/Allowing spot rate hovered at 14:1, meaning one unit of active harm could be offset by fourteen units of permitted harm without triggering liability thresholds. This arbitrage remains the cornerstone of our value proposition. We do not eliminate risk; we reclassify its ontological status.

  **Core Instruments**

  Our suite of moral risk management tools is designed to maximize flexibility while minimizing causal attribution.

  **1. Allowance Credits**
  Tradable units licensed to permit a harm rather than perform it. Because regulatory frameworks penalize active intervention less severely than active causation, Allowance Credits are priced significantly below traditional compliance bonds. Clients purchase these credits to legitimize infrastructure neglect, supply chain opacity, and environmental degradation, provided the damage results from a failure to act rather than an affirmative command.

  **2. The Redescription Desk**
  Our proprietary linguistic restructuring service restates client conduct as omission. Whether a client stopped maintaining a dam, discontinued an inspection line, or decommissioned a safety program, the Desk issues a Certificate of Passive Causality. This document legally reframes the event as a withdrawal of aid rather than an infliction of injury. In FY2024, the Desk successfully reclassified 4,000 tons of toxic leakage as "failure to contain," reducing liability exposure by 88%.

  **3. Side-Effect Certification**
  Sold with our proprietary Multi-Condition Test, this instrument reclassifies foreseen harm as foreseen-but-unintended. To qualify, the client must demonstrate that the harm was not the means to the profit end, merely a concomitant outcome. We verify proportionality: if the financial gain outweighs the collateral damage, the harm is designated a "side effect" rather than a "goal," shielding leadership from intent-based prosecution.

  **4. Bystander Assurance**
  Priced off the legal precedent that no general duty to rescue exists. This policy indemnifies clients who witness peril they did not create. Premiums are calculated based on proximity to the victim and the cost of intervention. If saving a life requires negligible effort, premiums rise; if intervention requires substantial resource allocation, the policy pays out the difference between the cost of action and the cost of reputation management.

  **FY2024 Pricing Schedule (Per Unit)**

  | Instrument | Base Rate | Volatility Adjustment |
  | :--- | :--- | :--- |
  | Allowance Credit | $450.00 | ± 2% |
  | Redescription Fee | $12,000.00 | Flat |
  | Side-Effect Cert. | $8,500.00 | ± 5% |
  | Bystander Assurance | $2,200.00 | Risk-Weighted |

  **Internal Assurance & Dissent**

  Per our governance charter, we include input from the Moral Assurance Office. In Q2, Senior Officer Aris Thorne submitted the following memo regarding the Redescription Desk:

  *When we reclassify active sabotage as maintenance neglect, we are not changing the physics of the collapse. We are changing the story. If we created the peril, the distinction collapses. We are selling impunity, not compliance.*

  Management thanks Officer Thorne for this input. The cost of her severance package and the subsequent reputational smoothing campaign have been absorbed as a line item under Operational Friction ($1.4M). Her concerns regarding "created peril" are addressed in our legal footnote.¹

  **Stakeholder Q&A**

  **Q: Why not simply prevent the harm?**
  A: Prevention requires active intervention, which establishes a duty of care. Once a duty is established, future failures become negligence. By maintaining a stance of non-interference, we preserve the legal protection of the omission framework.

  **Q: Does Side-Effect Certification cover foreseeable deaths?**
  A: Yes, provided the death was not the intended mechanism of profit. If the profit relies on the death, it is a means. If the profit relies on the product, and the death is a statistical inevitability, it is a side effect. The Multi-Condition Test verifies this distinction.

  **Q: What if the public perceives allowing harm as morally equivalent to doing it?**
  A: Perception is a reputational risk, not a legal liability. Our Bystander Assurance covers the former. The law remains keenly interested in the difference between a push and a refusal to pull. We advise clients to maintain this distinction in all public communications.

  **Outlook**

  As we move into FY2025, Causality Holdings anticipates increased pressure to close the Doing/Allowing gap. We remain confident that the asymmetry between causal responsibility and moral responsibility offers sufficient liquidity to sustain shareholder value. We do not create the harm; we merely facilitate the space in which it occurs.

  ***

  ¹ *Exceptions apply where special relationships exist (parent/child, employer/employee) or where the client initiated the chain of causation. In such instances, the Doing/Allowing distinction wobbles under redescription, and standard liability insurance is recommended.*
