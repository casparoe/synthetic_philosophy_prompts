      *   *Bayesian Translation:*
          *   "Knowing $P$" $\rightarrow$ Credence $Cr(P) = 1$ (or very close to 1).
          *   "Evidence against $P$" $\rightarrow$ Observation $E$ such that $P(E|P) < P(E|\neg P)$.
          *   "Misleading" $\rightarrow$ $E$ occurs even though $P$ is true.
          *   "Ignore it" $\rightarrow$ Do not update (or update in a way that keeps $Cr(P)$ high).

  3.  **Drafting the Bayesian Argument (Part 1):**
      *   *Case A: Credence = 1.*
          *   If $Cr(P) = 1$, then $Cr(\neg P) = 0$.
          *   Bayes' Rule: $Cr(P|E) = \frac{Cr(E|P)Cr(P)}{Cr(E)}$.
          *   If $Cr(P)=1$, then $Cr(P|E) = 1$ (unless $Cr(E|P)=0$, which implies $E$ is impossible given $P$, creating a contradiction if $E$ is observed).
          *   *Result:* You literally *cannot* update away from 1. It's not that you are "entitled" to ignore it; the math forbids movement. This is the "Probabilistic Lock-in."
      *   *Case B: Credence = 0.99.*
          *   $Cr(P) = 0.99$.
          *   Receive strong evidence $E$ against $P$ (Likelihood Ratio $LR < 1$).
