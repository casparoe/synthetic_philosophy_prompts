          *   If the agent claims "I know $P$, so $E$ is misleading," they are effectively asserting $Cr(E|\neg P)$ is high and $Cr(E|P)$ is low, *but* they are also asserting $Cr(\neg P)$ is so low that the posterior remains high.
          *   *The Trap:* If you pre-commit to treating all counter-evidence as "misleading" (i.e., assuming $P$ is true when evaluating $E$), you are effectively setting $Cr(P)=1$ operationally, even if you claim 0.99.
          *   *Bayesian Verdict:* At 0.99, you *must* update. If you don't, you are violating Conditionalization. If you do, you aren't being dogmatic in the paradox sense. So the paradox only holds at $Cr=1$.

  4.  **Developing the "Residue Report" (Part 2):**
