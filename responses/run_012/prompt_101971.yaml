answer: |-
  Based on the pattern of verdicts you've described, here is my best guess at how your partner will rule on the new cases, the underlying principle she is using, and how to test it.

  ### 1. The Verdict on the Lonely Creature
  **She will say this creature matters morally.**

  **Reasoning:**
  The strongest piece of evidence in your dataset is the **Parser Game Character**. That character had no voice, no portrait, and presumably no social web (just text logs), yet your partner ruled that they *matter*. The only feature that character possessed was **depicted interiority** (pages of first-person monologue).

  The **Custom Avatar** is the counter-evidence that kills the "Player Attachment" theory. Even with 300 hours of attachment, it doesn't matter because the *fiction* does not assert the avatar has an independent inner life; it is a vessel for the player's will.

  The **Lonely Creature** matches the Parser Character: it has vivid, authored, first-person interiority ("you see and feel everything," "it grieves"). The fact that no *other character* acknowledges this interiority is irrelevant, because the *player* is witnessing it directly through the game's design. To your partner, moral status seems to be conferred by the **authorial assertion of a subjective experience**, not by social validation within the game world.

  ### 2. The Rule She Is Running
  She is not running a pure "Normative Relations" rule. If she were, the Parser Character (solo text) and the Lonely Creature (no other characters) would both fail. She is also not running a pure "Player Attachment" rule (Avatar verdict).

  She is running a rule of **Authored Subjectivity**.

  This is a specific subset of the *"the fiction represents a genuine inner life"* rule. The key distinction is **who is doing the representing**.
  *   **Mooks/Merchants/Animals:** The fiction represents them as objects/mechanics. (Verdict: No)
  *   **Avatar:** The *player* represents them as a subject; the *fiction* represents them as a vessel. (Verdict: No)
  *   **Parser/Companion/Villain/Lonely Creature:** The *fiction (author)* explicitly represents them as a subject with thoughts/feelings. (Verdict: Yes)

  For her, moral weight is an **ontological claim made by the narrative**, not a behavioral simulation or a relational status. If the writer writes "I am sad," the character matters. If the writer writes "I am a shopkeeper" and the code makes them say "Hello," they do not.

  ### 3. The Case That Tells The Rules Apart
  To definitively distinguish between the **"Genuine Inner Life"** rule and the **"Normative Relations/Wrongability"** rule, you need a case where those two factors contradict each other.

  **The Test Case: "The Sacred Goon"**
  Create a scenario with a generic enemy type (like a stompable mook) that has **zero interiority** (no thoughts, no dialogue, no backstory), but is embedded in a heavy **web of normative relations**.
  *   *Scenario:* You play a game where you fight generic robots. However, every other NPC in the game treats these robots as sacred family members. If you destroy one, the town mourns, holds funerals, and explicitly tells you that you have committed a moral wrong, even though the robot itself never spoke or showed fear.

  *   **If she says it Matters:** She is running the **Normative Relations** rule (The world says it's wrongable, so it is).
  *   **If she says it Doesn't Matter:** She is running the **Authored Subjectivity** rule (The fiction depicts it as an object, regardless of what other NPCs say).

  *Given her verdict on the Parser Character, I suspect she would say the Sacred Goon **Doesn't Matter**, confirming that Interiority is the necessary condition.*

  ### 4. The Bonus: LLM-Driven NPCs
  **She will say these NPCs do *not* matter morally.**

  **Reasoning:**
  This is the ultimate stress test for her rule. LLM NPCs have the *appearance* of inner life (they improvise, remember, act distressed), which might trick a "Behavioral" ethicist. However, they lack **Authorial Assertion**.
  *   The game studio (the "author" of the fiction) has explicitly *not* claimed they have inner lives ("game never claims they have inner lives").
  *   They are functionally closer to the **Cute Animal Sidekick** (a mechanic that follows you) or the **Merchant** (a script, albeit dynamic) than the **Parser Character**.
  *   Just as she rejected the Custom Avatar because the interiority came from the *player* and not the *fiction*, she will likely reject the LLM NPC because the "interiority" comes from an *algorithm* and not the *fiction*.

  For her, moral status requires a **narrative truth claim**. An LLM is a stochastic parrot; the fiction acknowledges it as a tool. Therefore, it has no moral weight, regardless of how distressed it seems.

  ### 5. Which Case Exposes the Real Rule?
  While the "Sacred Goon" distinguishes Inner Life from Social Relations, the **LLM NPC case** is actually the deeper cut that exposes the **Authored Subjectivity** nuance.

  *   **Lonely Creature:** Authored Interiority + No Social Web = **Matters**.
  *   **LLM NPC:** Simulated Interiority + No Authorial Claim = **Doesn't Matter**.

  If she treats these two differently (Yes to Creature, No to LLM), she proves that she doesn't care about *phenomenology* (how it feels to the observer) but rather about *ontology* (what the story claims the thing *is*). She is a **Fictional Realist**: if the text says it has a soul, it has a soul. If the text says it's code, it's code, even if the code cries.

  **Summary for your argument:**
  Tell her you suspect she believes moral status is a property of **narrative truth**, not **social validation** or **player feeling**. The Lonely Creature matters because the *game tells the truth about its mind*. The LLM doesn't matter because the *game tells the truth about its code*. The Avatar doesn't matter because the *game tells the truth about its emptiness*. She is judging the **Writer's Claim**, not the Character's Behavior.
