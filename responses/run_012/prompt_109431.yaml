      *   *The "Dreaded" Objection:* Needs to be the one that exposes the deepest tension. Probably the link between *structural wrong* and *personal agency*. If the structure forces the wrong, is it still *wrong*? If it's not wrong, why redesign? If it is wrong, who bears it?
      *   *Least Likely:* A specific historical counter-example (too nitpicky for a theory workshop) or a purely meta-ethical semantic argument (unless the Kantian dominates). Let's go with a specific semantic quibble as least likely.

  5.  **Developing Replies & Identifying Soft Spots:**
      *   *Reply Strategy:* Don't defend the politician; defend the *category*. Shift focus from "is he sad?" to "does sadness fix the system?"
      *   *Soft Spot:* Usually where the normative force comes from. If I say "no guilt," why should we trust them?

  6.  **Refining the "Dreaded" Objection:**
      *   The user says they are denying the "remainder." The dreaded objection is likely: "If there's no remainder, there was no violation. If there was no violation, there are no dirty hands, just clean technocracy." This collapses the thesis entirely.

  7.  **Confidence Assessment:**
