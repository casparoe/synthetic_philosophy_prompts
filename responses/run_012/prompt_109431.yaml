      *   *Institutionalists:* Will talk about "incentive structures," "second-best solutions," "non-ideal theory," "implementation."
      *   *Kantian:* Will talk about "categorical imperative," "contradiction," "moral luck," "duty."

  4.  **Ordering by Likelihood and Damage:**
