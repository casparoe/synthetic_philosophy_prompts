answer: |-
  # Q&A Prep Sheet: "Dirty Hands & Structural Wrong"

  **Room Read:** High stakes. You are challenging the emotional core of the Dirty Hands literature (the "tragic hero" narrative) while trying to avoid the coldness of technocracy. The Old-Schoolers feel you are removing the moral stakes; the Institutionalists feel you are skipping the political feasibility; the Kantian feels you are speaking nonsense.

  **Confidence in Room Read:** 85%. These archetypes are standard in public ethics workshops. The only variable is whether the Chair keeps the Old-Schoolers from monopolizing the time.

  ---

  ### 1. The "Sociopath Test" (Old-School)
  **Likelihood:** Very High | **Damage:** High
  **The Objection:** "You say the guilt belongs to the structure, not the agent. But if the agent feels no moral residue after authorizing torture, how do we distinguish them from a sociopath who simply enjoys the act? Without the anguish, isn't 'Dirty Hands' just a euphemism for 'effective ruthlessness'? You've saved the politician's soul by killing his conscience."
  **Your Reply:** "The distinction isn't in the *feeling*, it's in the *constraint*. A sociopath acts on preference; the Dirty Hands actor acts on necessity imposed by the office. We shouldn't rely on their internal anguish to prove they aren't monsters; we should rely on external audits and term limits. Anguish is a bad monitoring device."
  **Soft Spot:** You are conceding that the *internal* state doesn't matter. If the public can't see the constraint, only the act, your theory makes dangerous people look legitimate.

  ### 2. The "Dissolution" Argument (The Dreaded One)
  **Likelihood:** High | **Damage:** Critical
  **The Objection:** "You claim the wrong is real, but the guilt is misplaced. But if the agent isn't culpable because the structure compelled them, in what sense did they do *wrong*? If they did no wrong, there are no Dirty Hands, just clean technocratic management. You're trying to have it both ways: you want the tragedy without the tragedian. If there's no moral remainder for the agent, the 'wrong' dissolves."
  **Your Reply:** "The wrong is real, but it is *located* differently. Think of it like a corporate tort. The harm is real, the liability is real, but we don't demand the CEO weep to prove it; we demand the corporation pay and the bylaws change. I'm not dissolving the wrong; I'm relocating the liability from the conscience to the charter."
  **Soft Spot:** This is your weakest theoretical link. Political offices aren't corporations. If the agent bears no moral weight, the "tragedy" becomes a mere engineering error, which undermines the gravity of your own thesis.

  ### 3. The "Ritual of Restoration" (Old-School / Public Ethics)
  **Likelihood:** Medium | **Damage:** Medium
  **The Objection:** "You call public remorse 'catharsis' that substitutes for reform. But in a democracy, confession is a form of accountability. It restores the normative order. By denying the politician the duty to express remorse, you deny the public the right to hear it. You're privatizing the reconciliation process."
  **Your Reply:** "I'm not denying they should apologize; I'm denying the apology *fixes* the moral stain. We treat the apology as the end of the story. 'He suffered, so we're even.' I want the apology to be the start of the investigation into why the office required the apology in the first place."
  **Soft Spot:** You risk sounding like you want to punish the politician *more* (by interrogating the office) rather than less. It can sound vindictive.

  ### 4. The "Feasibility Constraint" (Institutionalist)
  **Likelihood:** High | **Damage:** Medium-High
  **The Objection:** "I like where you end up, but you've cheated. You say 'redesign the office,' as if we can just legislate away moral dilemmas. Non-ideal theory tells us institutions are built on existing power dynamics. If you can't guarantee the redesign, haven't you just left us with the Dirty Hands problem *and* removed the only coping mechanism (guilt) we have?"
  **Your Reply:** "I'm not claiming we can design away all tragedy. I'm claiming we stop treating the tragedy as inevitable. Every time we say 'this is just the cost of doing business' and accept the guilt as the price, we cement the structure. Refusing the guilt is the first step of the redesign."
  **Soft Spot:** This sounds inspirational but lacks a mechanism. They will press you on *how* the refusal of guilt leads to redesign.

  ### 5. The "Contradiction in Terms" (Kantian)
  **Likelihood:** Medium | **Damage:** Low (mostly semantic)
  **The Objection:** "To say 'he did wrong but rightly' is nonsense. If it was the right thing to do, given the circumstances, it wasn't wrong. If it was wrong, it wasn't right. You are conflating 'regrettable' with 'immoral.' This is just moral confusion dressed up as realism."
  **Your Reply:** "I'm distinguishing between *action-guiding* norms and *evaluative* norms. The action was necessary (right), but it violated a fundamental constraint (wrong). The contradiction isn't in my theory; it's in the office that forces the contradiction."
  **Soft Spot:** The Kantian will not accept "necessary" as a justification for violating the categorical imperative. You won't convince them, only neutralize them.

  ---

  ### Least Likely Objection
  **Prediction:** A pure Utilitarian calculation challenge (e.g., "Why does it matter what we call it if the outcome is good?").
  **Reasoning:** The room is described as "public ethics" and "political theory," which usually implies a focus on deontology, virtue, or structural normativity. A raw "body count" utilitarian argument is too blunt for this specific crowd; they prefer arguing about *integrity* and *legitimacy*.

  ### Strategic Advice for the "Dreaded" Objection (#2)
  This is the one that keeps you up at night because it threatens to collapse your thesis into technocracy.
  *   **Do not** get bogged down in semantic definitions of "wrong."
  *   **Do** pivot to *harm*. "The harm is objective. The liability is structural. The agent is the vector, not the source."
  *   **Key Phrase:** "I am not absolving the agent; I am reclassifying the liability."

  ### Final Note on Tone
  The Old-Schoolers want you to feel the weight of the tragedy. If you sound too clinical, they will write you off as a technocrat. If you sound too emotional, they will think you accept their premise. Aim for **indignant clarity**. You aren't removing the tragedy; you are refusing to let the politician's soul be the place where we bury it.
