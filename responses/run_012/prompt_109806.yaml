answer: |-
  1. You argue that the Principal Principle is derivative of a more general norm to defer to an ideal expert. If the objective chances just *are* the credences of this expert, doesn't your account render the principle tautological rather than explanatory?
     *Follow-up:* If it is tautological, have you explained why rational agents must defer to chances, or merely defined chances as whatever they should defer to?

  2. For the Principal Principle to drop out of your expert-deference norm, the ideal expert must assign credences equal to objective chances, which are typically less than one. Does this require the ideal expert to be ignorant of the actual future outcome?
     *Follow-up:* If the expert is ignorant of the future, in what robust sense can they be considered "ideal" compared to an agent with full knowledge?

  3. How does your principle guide an agent who is uncertain about which candidate function represents the ideal expert's credences?
     *Follow-up:* Doesn't resolving this uncertainty require a prior distribution over chance hypotheses that is itself unconstrained by the deference principle?

  4. You propose defining admissibility via screening-off: evidence is admissible if it screens the outcome from the chance. Which probability function determines whether this screening relation holds?
     *Follow-up:* If it is the agent's credence function, aren't you presupposing the very chance-credence link you aim to underwrite?

  5. Can the screening-off relation be characterized purely metaphysically, without referencing rational credences?
     *Follow-up:* If not, doesn't this make admissibility parasitic on the normative link it is supposed to ground?

  6. On a Humean best-systems account, an undermining future entails the falsity of the current chance hypothesis. Does such a future screen the outcome from the chance hypothesis?
     *Follow-up:* If it does screen off, your definition classifies it as admissible, which resurrects the contradiction the New Principle was meant to avoid.

  7. Is there an independent epistemic motivation for excluding undermining propositions, or are they excluded simply because they violate the Principal Principle?
     *Follow-up:* If the latter, doesn't this suggest your admissibility clause is tailored ad hoc to save the principle rather than derived from your screening account?

  8. Consider a reliable crystal ball that reveals the outcome of a chance event before it occurs. Given the revelation, the outcome is probabilistically independent of the chance. Does this evidence screen off the chance?
     *Follow-up:* If yes, your account classifies it as admissible, yet standard intuition holds that such evidence overrides the chance.

  9. If you maintain that the crystal ball evidence is inadmissible, you must argue it fails to screen off. How does it fail to screen off if the revelation renders the chance probabilistically irrelevant?
     *Follow-up:* Does this force you to introduce a temporal constraint on admissibility that sits uneasily with your atemporal screening definition?

  10. Ultimately, what grounds the requirement to defer to this specific ideal expert rather than a different omniscient agent?
      *Follow-up:* Is the authority of the chance function derived from the expert, or does the expert derive their authority from the nature of chance?
