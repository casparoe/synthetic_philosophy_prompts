  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** A small philosophy podcast.
      *   **Guest:** Works on foundations of probability.
      *   **Guest's Position:**
          *   Accepts Principal Principle (PP) but denies it's fundamental.
          *   Views PP as a special case of a general *Deference to Ideal Experts* principle.
          *   Objective chances = credences of an ideal expert.
          *   Undermining-futures problem is an artifact of bad admissibility.
          *   Proposed fix: Admissibility = Screening-off (Evidence $E$ is admissible iff $E$ screens the outcome $A$ off from the chance $Ch(A)$).
      *   **Task:** Draft 8-10 questions.
      *   **Format:** Each question needs a 1-2 sentence follow-up keyed to the likely answer.
      *   **Required Pressure Points:**
          1.  Does Deference entail PP (vs. weaker surrogate), especially with undefined expert credences or uncertainty about the expert?
          2.  Is the Screening-off definition of admissibility circular (presupposing the chance-credence link)?
          3.  Is the exclusion of self-undermining chance propositions independently motivated or ad hoc?
          4.  The Crystal Ball case (reliable prediction of outcome): Standardly inadmissible, but might screen off?
      *   **Tone:** Pointed, technical, no biographical/fluff questions.

  2.  **Deconstruct the Guest's Position & Identify Weaknesses:**

      *   *Point 1: Deference to Experts.*
          *   Standard PP: $Cr(A | Ch(A)=x \& E) = x$.
          *   Guest's PP: $Cr(A | \text{Expert says } x \& E) = x$, where $Ch(A) = \text{Expert's credence}$.
          *   *Problem:* Lewis's original worry about "super-experts." If the expert is ideal, do they know the future? If they know the future, their credence is 0 or 1, not the chance $x$. If they don't know the future, why are they ideal?
          *   *Problem:* Uncertainty about who the expert is. If I'm not sure which theory of chance is true, how do I defer?
          *   *Problem:* Undefined credences. What if the expert's credence is undefined (e.g., infinite spaces, measure zero)?

      *   *Point 2: Screening-off Admissibility.*
          *   Definition: $E$ is admissible iff $Cr(A | Ch(A)=x \& E) = Cr(A | Ch(A)=x)$. Or probabilistically: $P(A | Ch(A)=x \& E) = P(A | Ch(A)=x)$.
          *   *Problem:* This looks circular. To know if $E$ screens off $A$ from $Ch(A)$, don't I already need to know the probabilistic relations between $A$, $E$, and $Ch(A)$? If I already know those, do I need the PP?
          *   *Problem:* Screening-off is usually defined relative to a probability function. Which one? The agent's? The chance?

      *   *Point 3: Undermining Futures.*
          *   Humean Supervenience (Best System): Chances supervene on the total history. A future history could make the current chance function false.
          *   Guest says: Just exclude these via admissibility (screening-off).
          *   *Problem:* Is this exclusion justified independently? Or does it just look like "exclude whatever breaks the PP"?
          *   *Problem:* If the future undermines the chance, does it screen off? Usually, undermining futures *don't* screen off in the standard sense because they determine the chance.

      *   *Point 4: The Crystal Ball.*
          *   Scenario: A device tells you $A$ will happen.
          *   Standard View: Inadmissible (overrides chance).
          *   Guest's View (Screening-off): If I know the Crystal Ball says $A$, does that screen $A$ off from $Ch(A)$?
          *   If the Crystal Ball is perfect, $Cr(A | CB \& Ch(A)=x) = 1$.
          *   Does $CB$ screen $A$ from $Ch$? $P(A | Ch=x \& CB) = P(A | CB)$? Yes, if $CB$ is perfect.
          *   So, is $CB$ admissible? If yes, PP says $Cr(A | Ch=x \& CB) = x$. But $Cr(A | CB) = 1$. Contradiction unless $x=1$.
          *   So the Guest must say $CB$ is *in*admissible. But does it fail screening-off? If $CB$ determines $A$, then $A$ is independent of $Ch$ given $CB$. So it *does* screen off.
          *   *Tension:* If admissibility = screening off, and Crystal Ball screens off, then Crystal Ball is admissible. If Crystal Ball is admissible, PP applies. If PP applies, Credence = Chance. But Credence = 1. So Chance must = 1. But Chance was $x < 1$. Contradiction.
          *   *Goal:* Force her to explain why the Crystal Ball isn't admissible on her account, or admit the PP fails in that case.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Drafting Point 1 (Deference vs. PP):*
          *   Q: If the ideal expert's credence is undefined, does your principle collapse?
          *   Follow-up: Does this force a restriction on the domain of chance functions that looks suspiciously like the PP's own restrictions?
      *   *Drafting Point 1 (Uncertainty):*
          *   Q: How does the agent defer when uncertain about *which* expert is ideal?
          *   Follow-up: Doesn't this require a prior over chance functions that the PP was supposed to constrain?

      *   *Drafting Point 2 (Circularity):*
          *   Q: Screening-off is defined probabilistically. Which probability function defines the screening relation?
          *   Follow-up: If it's the agent's credence, aren't you presupposing the very chance-credence link you're trying to derive?
      *   *Drafting Point 2 (Independence):*
          *   Q: Can you state the screening condition without mentioning credences at all?
          *   Follow-up: If not, isn't admissibility parasitic on the norm it's meant to ground?

      *   *Drafting Point 3 (Undermining):*
          *   Q: You say undermining futures are inadmissible because they fail to screen off. Why do they fail?
          *   Follow-up: On a Humean view, the future *determines* the chance. Doesn't that mean conditioning on it makes the chance redundant, satisfying screening-off?
      *   *Drafting Point 3 (Motivation):*
