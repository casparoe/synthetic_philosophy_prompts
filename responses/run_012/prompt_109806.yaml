      *   *Refining Q5 (Undermining Logic):* Focus on the Humean determination.
      *   *Refining Q6 (Undermining Motivation):* Focus on ad-hocery.
      *   *Refining Q7 (Crystal Ball):* The main trap.
      *   *Refining Q8 (Crystal Ball Follow-up):* The consequence for PP.
      *   *Refining Q9 (General Deference):* What if experts disagree?
      *   *Refining Q10 (Normative Force):* Why defer to *this* expert?

      *Let's consolidate and sharpen for the specific constraints.*

      *   *Q1 (Deference/Reduction):* If chances just *are* the expert's credences, isn't the deference principle tautological?
          *   *FU:* Does this mean you're explaining a normative constraint by appealing to a definition?
      *   *Q2 (Deference/Uncertainty):* How does the principle handle uncertainty about *which* candidate is the ideal expert?
          *   *FU:* Doesn't resolving that uncertainty require the very chance-credence norms you're trying to ground?
      *   *Q3 (Screening/Circularity):* Your admissibility clause relies on probabilistic screening-off. Which probability function determines whether screening occurs?
          *   *FU:* If it's the agent's credence function, aren't you presupposing the rational response to chance to define admissibility?
      *   *Q4 (Screening/Independence):* Can the screening-off relation be characterized without referencing credences or chances?
