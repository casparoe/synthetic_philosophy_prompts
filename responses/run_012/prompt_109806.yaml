      *Polishing the Wording:* Ensure philosophical precision (e.g., distinguishing "redundant" from "screening off").

      *Self-Correction on Q5:* If the future fixes the chance, conditioning on the future makes the chance claim *true* with probability 1, not necessarily redundant in the screening sense. I need to be careful. If $E$ entails $Ch(A)=x$, then $P(A | Ch(A)=x \& E) = P(A | E)$. If $E$ also entails $A$, then $P(A|E)=1$. Does $E$ screen $A$ from $Ch$? $P(A | Ch=x \& E) = P(A | E)$? Yes, both are 1. So undermining futures *do* screen off. This is the trap. I need to make sure the question highlights that her definition might let them in.
