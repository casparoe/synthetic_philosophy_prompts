      *   *Q5 (Undermining/Humean):* On a Best-System account, the total future history fixes the chances. Doesn't conditioning on that history make the chance claim redundant?
          *   *FU:* If it makes it redundant, wouldn't that satisfy your screening-off condition, making undermining futures admissible?
      *   *Q6 (Undermining/Motivation):* Is there an independent epistemic reason to treat undermining propositions as inadmissible?
          *   *FU:* Or does the classification rest entirely on the fact that they violate the Principal Principle?
      *   *Q7 (Crystal Ball/Screening):* A reliable crystal ball reveals the outcome, rendering the objective chance probabilistically irrelevant to the outcome given the revelation. Does this count as admissible?
          *   *FU:* If it screens off, your definition calls it admissible, but standard intuition says it overrides chance.
