answer: |-
  When we look at Aristotle's defense of natural slavery in the Politics, the most productive approach is to set aside modern moral objections and focus strictly on the internal logic of his argument. Aristotle is not merely asserting a cultural prejudice; he is proposing a functional test for determining who should rule and who should be ruled. His core claim is that nature intends for some people to be slaves because it is beneficial for them to be ruled. He argues that just as the soul naturally rules the body for the good of the whole organism, a master naturally rules a slave who lacks the capacity for full deliberation. The slave, in this view, is a living tool who participates in reason enough to understand commands but not enough to originate them. However, if we take this functional test seriously, it generates a problem of reciprocity that threatens to collapse the entire distinction. By applying Aristotle's own criteria for natural hierarchy, we find that the relationship between master and slave becomes mutually constitutive in a way that undermines the asymmetry Aristotle requires. If the master needs the slave to actualize his own nature as a ruler, then the slave holds a necessary position in the master's life that blurs the line between natural ruler and natural ruled.

  The crux of Aristotle's position is the idea that ruling and being ruled are defined by their functions. A natural master is someone whose virtue lies in commanding, while a natural slave is someone whose virtue lies in obeying. Aristotle insists this arrangement is for the benefit of both parties, much like the relationship between a soul and a body. The body needs the soul to guide it, otherwise it is directionless, and the soul needs the body to act upon the world. The problem arises when we ask what makes the master a master in the first place. His identity and his virtue are defined by the activity of ruling. But ruling is a relational activity; it cannot exist in isolation. You cannot be a ruler without someone to rule. Therefore, the master depends on the slave to perform the very activity that defines his nature. If the slave is the necessary condition for the master to be a master, then the master is not self-sufficient in his excellence. He relies on the slave to complete his own function. This creates a dependency that runs counter to the idea that the master is naturally superior in a way that justifies absolute authority.

  This dependency becomes even more problematic when we examine the soul and body analogy that Aristotle leans on so heavily. He uses this comparison to argue that the rule of the master over the slave is despotic and absolute, just as the soul's rule over the body is uncontested. But a soul without a body is not a functioning soul; it is an abstraction. The soul's capacity to animate and guide is only realized through the body. If the slave is analogous to the body, then the master is analogous to the soul. Just as the soul needs the body to be actualized in the physical world, the master needs the slave to be actualized in the household and the polis. If we push this analogy consistently, it suggests a relationship of mutual completion rather than unilateral superiority. The body is not merely a tool for the soul; it is the matter through which the soul exists as a living thing. Similarly, the slave is not merely a tool for the master but the medium through which the master's ruling capacity exists. This implies that the slave is part of the master's own identity and functioning, which makes the distinction between the two far less clear than Aristotle wants it to be.

  A natural objection to this line of reasoning, and one that your instructor will likely raise, is that needing someone for your activity is not the same as being ruled by them. Consider the relationship between a citizen and a baker. The citizen needs the baker to provide bread, which is necessary for life, but this need does not make the citizen a slave to the baker, nor does it make the baker the master. The dependence is external and transactional. The citizen retains his autonomy because the baker provides a product, not the capacity for rule itself. The objection here is that the master's dependence on the slave is merely functional, like needing a tool, and does not imply that the slave has authority over the master. Therefore, the reciprocity of need does not necessarily destroy the hierarchy of command. The master still does the thinking, and the slave still does the working, regardless of how much the master needs that work done.

  However, this objection fails to account for the specific kind of dependence Aristotle describes. The relationship with the baker is about production, whereas the relationship with the slave is about action and identity. The baker provides an external good that the citizen consumes, but the slave provides the very capacity for the master to exercise his virtue. In Aristotle's framework, the slave is an instrument of action, not just production. This means the slave is involved in the moral life of the master, not just his material comfort. If the master's virtue is ruling, and the slave is the one who enables that ruling, then the slave is constitutive of the master's moral status. Unlike the baker, whose absence leaves the citizen hungry but still a citizen, the absence of the slave leaves the master without a field to exercise his specific virtue. He might still be a free man, but he cannot be a master in the Aristotelian sense. This makes the dependence internal rather than external. When one person is the necessary condition for another person's moral actualization, the power dynamic is not a one-way street. The slave grants the master his status as master simply by obeying, which gives the slave a kind of passive power that complicates the claim of natural inferiority.

  If we accept this analysis, Aristotle's test for natural slavery ends up proving too much or nothing at all. It proves too much because if dependence on another for the completion of one's function makes someone subordinate, then almost everyone qualifies as a natural slave. We all depend on others to actualize our virtues; a general needs soldiers, a statesman needs citizens, and a teacher needs students. If the master is a slave to his need for someone to rule, then the category of natural ruler becomes empty. On the other hand, if we say that this kind of dependence does not compromise autonomy, then the test proves nothing, because it fails to distinguish the slave from any other subordinate role in the community. The asymmetry Aristotle needs—one party being purely active and rational, the other purely passive and instrumental—cannot be sustained when both parties are required for the function to exist at all. The master is not a soul floating above the body; he is a ruler embedded in a relationship that defines him just as much as it defines the slave.

  Ultimately, the doctrine of natural slavery collapses under the weight of its own functionalism. Aristotle wants to argue that slavery is natural because it fits a specific metaphysical pattern of rule and obedience. But by defining the roles through their functions, he inadvertently reveals that the function of ruling requires the function of being ruled just as much as the reverse. The master cannot be a master without the slave, and if nature intends for the master to rule, nature must also intend for the slave to be there to be ruled. This makes them equally necessary components of a single system. Once you admit that both are necessary for the whole to work, the claim that one is naturally superior and the other naturally inferior loses its footing. The hierarchy appears not as a discovery of nature, but as an assumption imposed on a relationship that is fundamentally reciprocal. By taking his own test seriously, we see that the boundary between master and slave is not a line drawn by nature, but a distinction that dissolves when examined through the logic of mutual dependence.
