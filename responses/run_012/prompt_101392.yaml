  **TO:** Ethics Advisory Board
  **FROM:** Chair, Ethics Advisory Board
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Decoherence-Suppression Campaign and Particle Annihilation Study

  **1. Purpose**
  This memo outlines my recommendation for Thursday's vote on the proposed decoherence-suppression campaign and the companion particle annihilation study. We face a conflict between a staff petition invoking panpsychist ethics and a physics division memo defending standard materialist assumptions. Our task is not to settle metaphysics, but to manage moral risk.

  **2. Assessment of the Petition (Precautionary Parity)**
  The petitioners argue from a panpsychist standpoint: if experience is fundamental, our ion arrays may host countless micro-subjects. Their strongest ethical tool is the **Precautionary-Parity Principle**. We currently grant moral protection to animals (e.g., mice, cephalopods) where sentience is probable but not certain. The petitioners correctly note that uncertainty regarding *macro*-subjects does not justify experimentation without oversight; therefore, uncertainty regarding *micro*-subjects should not automatically license it. To dismiss this as mere metaphysics is to ignore that ethical policy must always operate under uncertainty. If there is a non-zero probability of creating morally relevant suffering, the burden of proof shifts to the researchers to demonstrate why that risk is acceptable.

  **3. Assessment of the Physics Division (The Combination Problem)**
  The Physics Division's counter-memo raises the strongest point on the opposing side: the **Combination Problem**. Even if ions possess rudimentary experience, there is no evidence these experiences unify into a single subject capable of "suffering" in a morally actionable sense. Without a unified locus of experience, "suffering" may be incoherent. Furthermore, they argue that accepting the petition sets a precedent for **indefinite obstruction**. If every interaction with matter requires a suffering-impact review, fundamental research becomes impossible. This is a pragmatic necessity; an ethics board that paralyzes the institute fails its duty to the public good.

  **4. Recommendation**
  We cannot resolve the Combination Problem, nor can we empirically verify panpsychism at this time. However, we can apply a time-bound risk assessment. I recommend the following course of action:

  *   **Action:** **Approve a 45-day moratorium** on both the decoherence campaign and the annihilation study.
  *   **Mandate:** During this period, a specialized working group (comprised of one board member, two physics leads, and one external philosopher of mind) will draft a **Micro-Phenomenology Risk Framework**.
  *   **Deliverable:** The Framework must define specific physical thresholds (e.g., complexity, integration, information processing) that would trigger moral standing, or explicitly justify why such thresholds are inapplicable.
  *   **Outcome:** At the end of 45 days, the Board will vote to either lift the moratorium or impose specific constraints based on the Framework.

  **5. Rationale**
  This decision prioritizes the Precautionary-Parity Principle without accepting the risk of indefinite obstruction. A 45-day pause is a manageable cost to ensure we are not inflicting widespread moral harm. It treats the petitioners' concerns as a legitimate risk management issue rather than a metaphysical debate. Simultaneously, it addresses the Physics Division's concern by setting a strict deadline; if the Working Group cannot identify actionable criteria for micro-suffering by Day 45, the presumption shifts back to permitting the research.

  **6. Next Steps**
  I ask the Board to adopt this recommendation on Thursday. If approved, I will convene the Working Group by Friday.

  **Chair, Ethics Advisory Board**
