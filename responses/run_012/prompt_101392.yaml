          *   *Physics Division:* Moral standing requires a unified subject. Cites the "combination problem" (micro-experiences don't add up to a suffering subject). Warns of indefinite obstruction of research.
      *   **Requirements:**
          *   Recommend a concrete course of action with a time frame.
          *   Engage the petitioners' position seriously (no dismissing as mere metaphysics).
