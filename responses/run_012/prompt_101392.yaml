      *Reasoning:* Panpsychism posits experience is ubiquitous. Trapping creates experience. Annihilation ends it. The moral weight of *ending* a subject (even a micro one) is generally higher than *constraining* it. This allows the bulk of the research (Physics win) but acknowledges the moral risk of destruction (Petitioner win).
