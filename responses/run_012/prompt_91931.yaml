      *   (4) *Metaphysical Guilt (Jaspers):* Solidarity binds all humans. Anyone living through it who didn't act is guilty, full stop.
      *   (5) *Inherited Guilt:* Guilt does not run down generations (no guilt for ancestors' deeds).
      *   (6) *Inherited Responsibility:* Descendants owe something special (memory, restitution, care) despite not being guilty.

