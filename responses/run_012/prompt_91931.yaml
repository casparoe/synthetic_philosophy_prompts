      *   *(4) vs. (5):*
          *   (4) Metaphysical guilt applies to those who *lived through it*.
          *   (5) Guilt doesn't run down generations.
          *   *Conflict:* None. (4) limits guilt to contemporaries. (5) excludes descendants.
          *   *Severity:* None.

