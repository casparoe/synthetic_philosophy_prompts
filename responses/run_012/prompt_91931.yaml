          *   (5) Descendants lack agency regarding ancestors' acts.
          *   *Conflict:* None. They support each other.
          *   *Severity:* None.

      *   *(5) vs. (6):*
          *   (5) No inherited guilt.
          *   (6) Inherited responsibility/obligation.
          *   *Conflict:* None. This is the standard "guilt vs. responsibility" distinction (e.g., Pasternak, Thompson).
          *   *Severity:* None.

      *   *(2) vs. (6):*
          *   (2) Collective liability for the state.
          *   (6) Descendants owe restitution.
          *   *Conflict:* If (2) is about *citizens* at the time, and (6) is about *descendants* later, they are distinct. But if (2) implies the *collective* bears the burden, does that burden dissolve when the collective changes (new generation)?
