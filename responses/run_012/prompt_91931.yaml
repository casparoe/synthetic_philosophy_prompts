          *   *Severity:* Moderate. Jaspers distinguishes types of guilt. (1) sounds like a definition of *moral* guilt, but it's stated generally ("Guilt worth the name"). If (1) applies to *all* guilt, it contradicts (2).

      *   *(1) vs. (4):*
