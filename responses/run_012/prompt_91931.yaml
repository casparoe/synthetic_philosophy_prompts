          *   (3) Individual moral guilt only.
          *   *Conflict:* None. This is exactly Jaspers' distinction. Political = collective/citizen; Moral = individual/conscience.
          *   *Severity:* None.

      *   *(3) vs. (4):*
          *   (3) Moral guilt is strictly individual.
          *   (4) Metaphysical guilt binds *all* human beings (solidarity).
          *   *Conflict:* Jaspers distinguishes these. Moral is about specific acts/omissions. Metaphysical is about human solidarity. However, (4) says "stands guilty, full stop." (3) says "only the person who acted... is morally guilty." If metaphysical guilt is a *type* of guilt, does it violate the individualism of (3)?
