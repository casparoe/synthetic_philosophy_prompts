      *   *Addressing Causal/Informational Theories:* This is the "naturalistic" turn. Mention Fodor/Dretske. Explain Kripke's objection: Normativity. Facts describe what *is* done; meaning prescribes what *ought* to be done. A causal link explains error only as deviation, not as *mistake*.
