prompt: |-
  I'm closing out a reading group on metrics and machine learning with a poem instead of a summary slide, because the form I want basically *is* the law. The idea is Goodhart's law -- when a measure becomes a target, it stops being a good measure -- and I want a villanelle where the two refrains are, roughly, one line about the measure and one line about the target. The trick: the refrains have to stay word-for-word identical across the poem, but their sense has to rot, so that what the refrain means when it first shows up and what it means in the closing quatrain are not the same thing even though the words are. Thats the whole point -- the words dont change, the world does.

  In the body, work in the four flavors people usually distinguish: (1) the measure was only ever a noisy proxy, so optimizing it just amplifies the noise; (2) you have to push the variable to an extreme for it to matter, and that's exactly where its link to what you cared about falls apart; (3) messing with the measure breaks the causal connection it used to have to the goal; and (4) people simply start gaming the metric on purpose. Give each one a tercet or so, but don't name them in the poem -- enact them, so someone who knows the taxonomy can label each stanza from the inside.

  Then the last quatrain: the two refrains finally sit side by side and you genuinely can't tell which is which anymore, because the measure and the target have collapsed into each other.

  After the poem, give me a short JSON summary so I can check the thing, with these fields: "form", "refrain_measure", "refrain_target", "how_the_refrains_shift" (one or two sentences), "stanza_flavor_map" (an object mapping stanza number to which of the four flavors it's doing), and "closing_move". Keep it brief.
