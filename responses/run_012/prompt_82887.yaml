prompt: |-
  I'm a law student writing a seminar paper on the philosophy of political authority, and I keep running into a pattern in how states actually behave that I can't square, so I'd like you to help me reconstruct what the pattern presupposes. Take two cases. In the first, a group of officers and civilians forcibly moves against a government widely regarded as brutal and corrupt; the attempt fails, and the participants are tried for treason and imprisoned for decades. In the second, a nearly identical attempt succeeds: the old regime collapses, the new government is recognized within a year, and — this is the part that puzzles me — the courts of the new order, and eventually foreign courts too, treat its founding decrees as having been valid law from the moment they were issued, its pre-recognition acts are ratified retroactively, and the very people who would have been hanged in the first case are buried as founders in the second. So the same legal order, or its successor, condemns rebellion in general and honors it in the particular, and legitimacy seems to attach to the winning rather than to the justified. Compounding my confusion: many of these same states insist that soldiers and civil servants must refuse unlawful orders, and that oaths of office run to a constitution rather than to any person — which looks like it licenses precisely the private judgment that the treason statutes forbid.

  Please act as a political philosopher with deep knowledge of both medieval Christian political thought and modern constitutional and legal theory, and think carefully before you commit to a verdict; I'd rather you spend your first effort laying out competing readings than rush to a tidy answer. What theory of political authority and political obligation does this practice presuppose? Reconstruct the implicit view as precisely as you can, and be careful to separate what the practice strictly presupposes from what it merely fits comfortably with — I suspect it is compatible with more than one theory, and I want to know where it is genuinely underdetermined. Address at least these candidates: a purely de facto or effective-control account of authority, on which success itself constitutes the title; a common-good account on which a tyranny is not genuine authority at all, so that resisting it is not rebellion in the first place, but on which the remedy must come from public authority rather than from private presumption (Aquinas's discussion of sedition is the obvious classic here, and I'd like it engaged seriously, especially his worry that a tyrant removed by someone's private initiative may leave the people worse off than the tyrant did); and a legal-positivist account on which validity tracks only a system's rules of recognition, so that retroactive ratification is simply ordinary legal housekeeping with no philosophical remainder. Then tell me whether the retroactive validation of successful revolutions is actually required by any of these views or is instead a pragmatic device for preserving legal continuity, and whether the simultaneous demand that officials disobey unlawful orders can be made consistent with the condemnation of private attempts on a ruler, or whether the practice is simply incoherent on this point. Finish with the counterfactual: if we replaced the implicit view with a Lockean right of revolution, or with the strict positivist account, what concretely would have to change in the practice — in the treason statutes, in the doctrines of retroactivity and recognition, in the oath of office, in how the courts treat the founding acts of a regime they have just recognized? I don't need citations or a reading list; reason from the structure of the positions, and give me a clear bottom line about which reading you think the practice actually commits to and how confident you are in that diagnosis.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Law student writing a seminar paper on political authority.
      *   **Problem:** The "Success vs. Justification" paradox in state behavior regarding rebellion/revolution. Failed rebels = traitors; Successful rebels = founders. Plus, the tension between "obey lawful orders/constitution" vs. "no private judgment to overthrow."
      *   **Task:** Act as a political philosopher (expert in medieval Christian thought + modern constitutional/legal theory).
      *   **Requirements:**
          *   Reconstruct the implicit theory of authority/obligation presupposed by this practice.
          *   Distinguish between what is *presupposed* vs. what merely *fits*.
          *   Address three specific candidates:
              1.  De facto/Effective-control account (Might makes Right/Success = Title).
              2.  Common-Good/Thomistic account (Tyranny ≠ Authority, but private removal is problematic).
              3.  Legal-Positivist account (Validity = Rules of Recognition, retroactivity = housekeeping).
          *   Analyze retroactive validation (Required vs. Pragmatic).
          *   Analyze consistency of "disobey unlawful orders" vs. "condemn private rebellion."
          *   Counterfactual: What changes if we switch to Lockean Right of Revolution or Strict Positivism?
          *   **Constraint:** No citations/reading list. Reason from structure. Clear bottom line on commitment and confidence.
          *   **Tone:** Careful, nuanced, philosophical, avoiding rushing to a tidy answer.

  2.  **Deconstruct the Phenomenon:**
      *   *Case A (Failed):* Treason, imprisonment. Logic: Stability, monopoly on violence, rule of law.
      *   *Case B (Successful):* Founding fathers, retroactive validity. Logic: New sovereignty, constituent power, necessity.
      *   *Tension:* Legitimacy seems to track success, not antecedent justice.
      *   *Complication:* Officials must disobey unlawful orders (Nuremberg principle/Constitutional oath), implying a standard *above* the current ruler, yet they cannot act on that standard to overthrow the ruler privately.

  3.  **Evaluate Candidate Theories:**

      *   **Candidate 1: Pure De Facto / Effective Control (Realism)**
          *   *Core:* Authority is just power that works. "Law is the command of the sovereign backed by threat."
          *   *Fit:* Explains why winners are legit and losers are criminals. Explains retroactivity (new sovereign says so).
          *   *Problem:* Doesn't explain the "unlawful orders" constraint. If authority is just power, why *must* a soldier disobey a lawful command from the effective sovereign if it violates some abstract "constitution"? Also, states usually claim *moral* legitimacy, not just power. They don't say "We rule because we won"; they say "We rule because it is Right."
          *   *Verdict:* Fits the outcome, fails the internal self-understanding (the oath part).

      *   **Candidate 2: Common-Good / Thomistic (Scholastic Natural Law)**
          *   *Core:* Authority exists for the common good. Tyranny is a usurpation (no true authority). *However*, Aquinas warns against private removal (sedition) because it causes disorder. Removal should be by public authority.
          *   *Fit:* Explains why tyranny *can* be resisted (it's not true authority). Explains why private rebellion is usually condemned (risk of worse disorder). Explains why successful rebels are later vindicated (they *became* the public authority).
          *   *Problem:* Retroactivity is tricky. If the tyrant had no authority, his laws were void *ab initio*. But successful revolutionaries often keep some laws. Also, Aquinas doesn't easily account for the *legal* retroactivity of the new regime's acts *before* recognition.
          *   *Verdict:* Strongest on the moral distinction, but struggles with the *legal* mechanics of retroactivity and the "constitution vs. person" oath nuance.

      *   **Candidate 3: Legal Positivism (Hart/Kelsen)**
          *   *Core:* Law is a system of norms. Validity depends on the Rule of Recognition. Revolution changes the Rule of Recognition.
          *   *Fit:* Perfectly explains retroactivity. The new Grundnorm validates the past acts of the revolutionaries as "constituent power." It treats the shift as a break in continuity that is legally smoothed over.
          *   *Problem:* Doesn't explain the *obligation* to disobey unlawful orders (unless "unlawful" just means "not according to the rulebook," but usually it implies a moral/constitutional standard). It treats the "unlawful order" doctrine as just another rule, not a moral check.
          *   *Verdict:* Best at explaining the *legal* mechanics (retroactivity, recognition), weakest on the *moral* obligation tension.

  4.  **Synthesize the "Implicit View":**
      *   The practice isn't committed to *one* pure theory. It's a hybrid.
      *   It presupposes a **Constitutional Realism** or **Institutional Natural Law**.
      *   *Key Distinction:* Constituent Power (the people/revolution) vs. Constituted Power (the government).
      *   *The Logic:* The Constitution is the higher authority. The Government is the agent.
      *   *Rebellion:* Private individuals cannot judge the agent (instability). But if the agent collapses, the Constituent Power re-emerges.
      *   *Retroactivity:* Necessary to prevent a legal vacuum (interregnum).
      *   *Unlawful Orders:* The oath is to the Constitution (Constituent Power), not the Officeholder (Constituted Power).

  5.  **Address the Specific Questions:**
      *   *Retroactive Validation:* Is it required? No, it's pragmatic (legal continuity), but philosophically justified by the idea that the Revolutionaries *were* the latent sovereign all along.
      *   *Consistency (Unlawful Orders vs. Rebellion):* It is consistent *if* the distinction is between *individual* judgment (forbidden) and *institutional* judgment (required). A soldier disobeying an order is acting as an organ of the state checking another organ, not as a private citizen overthrowing the state.
      *   *Counterfactuals:*
          *   *Lockean:* Treason statutes would need a "just cause" defense. Courts would judge the *justice* of the rebellion, not just the success.
          *   *Strict Positivist:* No "unlawful order" doctrine based on morality/constitution if the sovereign commands it. Retroactivity would be admitted as fiction, not validity.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the depth of the puzzle. It's the "Victor's Justice" vs. "Rule of Law" tension.
      *   *Section 1: The Three Candidates.*
          *   *De Facto:* Good for success, bad for oaths.
          *   *Thomistic:* Good for tyranny definition, bad for private judgment nuance.
          *   *Positivist:* Good for retroactivity, bad for moral obligation.
      *   *Section 2: The Reconstruction (The "Constitutional Sovereignty" View).*
          *   Distinguish Sovereign (People/Constitution) from Government.
          *   Rebellion is a claim to *be* the Sovereign. If failed, you are a criminal. If successful, you *are* the Sovereign.
          *   Retroactivity is a legal fiction to bridge the gap.
      *   *Section 3: The Unlawful Orders Tension.*
          *   Resolve via "Official Capacity" vs. "Private Capacity."
      *   *Section 4: Counterfactuals.*
          *   Lockean = Judicial review of revolution justice.
          *   Positivist = Admission of discontinuity.
      *   *Conclusion:* Bottom line. The practice commits to a **Kelsenian-Schmittian Hybrid** (Constituent Power) disguised as Constitutionalism. Confidence: High on the hybrid nature, moderate on the specific labeling.

      *(Self-Correction during drafting)*: I need to be careful not to just say "it's Schmitt." The prompt asks for Medieval + Modern. I should frame the "Constituent Power" idea through the lens of the "King's Two Bodies" or similar medieval corporate theory to satisfy the "medieval Christian political thought" requirement. The "Corpus Mysticum" vs. "Corpus Politicum."
      *Refinement:* Use the distinction between the *Office* (which is perpetual and sacred) and the *Officeholder* (who is fallible). This bridges Aquinas and Modern Constitutionalism.

      *(Refining the "Unlawful Orders" point)*: The prompt asks if it's consistent. The key is that refusing an unlawful order is an act of *preserving* the legal order against a rogue agent, whereas rebellion is an act of *replacing* the legal order. One is internal maintenance, the other is external replacement.

      *(Refining the Bottom Line)*: The practice presupposes that **Authority is Ontologically Distinct from Power, but Epistemologically Dependent on It.** (We know who has authority by who wins, but we claim authority comes from justice). This is the "Success as Epistemic Marker" theory.

  7.  **Final Polish:** Check against all constraints. No citations. Deep knowledge tone. Clear bottom line.

      *Wait, one more check on the "Medieval" requirement:* I need to explicitly engage Aquinas on sedition as requested. Aquinas says removing a tyrant is not sedition *if* done by public authority. If done privately, it risks sedition. The modern practice mirrors this: Successful rebels *become* the public authority retroactively. Failed rebels remain private. This fits Aquinas surprisingly well.

      *Wait, one more check on "Positivism":* Kelsen's "Grundnorm" is essential here. The revolution succeeds when the new Grundnorm is effective. Retroactivity is how the new Grundnorm swallows the past.

      *Okay, ready to write.*
answer: |-
  This is one of the oldest and most vexing problems in jurisprudence, often summarized by the maxim *victrix causa diis placuit sed victa Catoni* ("the victorious cause pleased the gods, but the vanquished pleased Cato"). You have identified a tension between the *normative* claims of law (it binds because it is just or procedurally correct) and the *sociological* reality of law (it binds because it is effective).

  To reconstruct the implicit theory of authority presupposed by the practice you describe, we must avoid the temptation to say the state is simply hypocritical. Legal systems generally strive for internal coherence. The fact that they condemn failed rebels while canonizing successful ones, yet simultaneously demand officials disobey unlawful orders, suggests a specific, layered conception of sovereignty.

  Here is an analysis of the competing readings, followed by a reconstruction of the implicit view and the counterfactual tests you requested.

  ### I. Evaluation of Candidate Theories

  **1. The Pure De Facto (Effective Control) Account**
  On this view, authority is indistinguishable from successful power. "Right" is merely the shadow cast by "Might."
  *   **Fit:** This explains the differential treatment of failed vs. successful rebels perfectly. In Case 1, the rebels lacked power; in Case 2, they acquired it. The retroactive validation of the new regime's acts is simply the new power asserting its will backward in time.
  *   **Failure:** This theory cannot account for the "unlawful orders" doctrine. If authority is purely de facto, a soldier's obligation is to the effective commander. If the commander issues an order, and the commander is the sovereign, the order is by definition lawful within that system. The requirement to obey a "constitution" over a "person" implies a standard of validity *independent* of the current officeholder's will. A pure de facto theory reduces the constitution to a piece of paper that matters only so long as the person with the guns respects it. It fails to explain why the state *claims* moral legitimacy rather than merely admitting it rules by force.

  **2. The Common-Good (Thomistic) Account**
  This view holds that authority is teleological: it exists to secure the common good. A regime that systematically violates the common good (tyranny) lacks true authority.
  *   **Fit:** This aligns with the intuition that the "brutal and corrupt" government in your second case was not truly legitimate, making the rebels' success a restoration of right order. Aquinas distinguishes between *sedition* (a sin against unity) and *tyrannicide* or removal. Crucially, Aquinas argues that while a tyrant may be removed, it must ideally be done by "public authority" rather than "private presumption," to avoid the greater evil of disorder.
  *   **Failure:** The modern practice diverges from Aquinas on the *mechanism* of vindication. For Aquinas, if private individuals remove a tyrant without public mandate, they remain morally suspect even if successful, unless subsequently ratified by a proper public body (like the Church or Estates). In your second case, the courts treat the *private* revolutionary acts as valid *from the moment they were issued*, not from the moment of ratification. Furthermore, the Thomistic view struggles with the "unlawful orders" tension: if the regime is tyrannical, why must the civil servant wait for an "unlawful order" to disobey? Why not resist earlier? The Thomistic view risks licensing the very private judgment the treason statutes forbid.

  **3. The Legal-Positivist Account**
  On this view (associated with Kelsen or Hart), law is a system of norms grounded in a "Rule of Recognition" or *Grundnorm*. Validity is a matter of pedigree, not moral content.
  *   **Fit:** This offers the cleanest explanation for retroactivity. A revolution is a change in the *Grundnorm*. Once the new order is effective, the new Rule of Recognition validates the acts that created it. The "treason" in Case 1 was valid law under the old *Grundnorm*; the "founding acts" in Case 2 are valid law under the new *Grundnorm*. The "unlawful orders" doctrine is simply a rule within the system: "If Order X contradicts Constitution Y, Order X is void."
  *   **Failure:** Positivism treats the shift from Case 1 to Case 2 as a brute fact, a discontinuity. It cannot explain the *continuity* the courts assert. Courts do not say, "The old law ended on Date Z and new law began." They say, "The new Constitution was always the true law." Positivism admits this is a fiction; the practice you describe treats it as a truth. Moreover, positivism struggles to ground the *obligation* to disobey unlawful orders if that obligation rests on moral rights (human rights) rather than systemic rules.

  ### II. Reconstruction of the Implicit View: "Constituent Power as Latent Sovereignty"

  The practice you describe does not commit to any single one of the above but synthesizes them into a theory I would label **Constitutional Ontology with Epistemic Realism.**

  **1. The Distinction between Constituted and Constituent Power**
  The system presupposes a distinction between the *Government* (constituted power) and the *People/Constitution* (constituent power).
  *   **The Oath:** When an official swears to the Constitution rather than a person, they are swearing allegiance to the *Constituent Power*.
  *   **Unlawful Orders:** This doctrine is consistent with the condemnation of rebellion because it is an act of *preservation*, not *overthrow*. An official refusing an unlawful order is acting as an organ of the Constituent Power to check a rogue agent of the Constituted Power. They are not claiming to *be* the Sovereign; they are claiming to *serve* the Sovereign against a usurping minister.
  *   **Rebellion:** Conversely, a rebel claims to *embody* the Constituent Power against the current Government.

  **2. Success as an Epistemic Marker, Not a Moral Ground**
  Here is the crux of the paradox. The system claims that legitimacy comes from the Common Good (Thomistic), but it uses Effectiveness (De Facto) as the *proof* of who represents the Common Good.
  *   **Failed Rebels:** They are tried for treason because, ex ante, they were private individuals presuming to judge the public order. The state presumes its own legitimacy until proven otherwise.
  *   **Successful Rebels:** Their success is treated not as "might makes right," but as *evidence* that they were the true agents of the Constituent Power all along. The retroactive validation is not merely pragmatic housekeeping; it is an ontological claim. It asserts that the "old regime" was a nullity (a usurpation) and the "new regime" was the latent truth of the legal order, now manifest.

  **3. Retroactive Validation: Pragmatic or Required?**
  Is retroactivity required? **No, it is pragmatic, but it serves a philosophical function.**
  Strictly speaking, a new regime could say, "We begin anew today; everything before is void." But this creates a legal vacuum (an interregnum) where property rights, marriages, and contracts dissolve.
  However, the *philosophical* reason for retroactivity is to maintain the fiction of **Legal Continuity.** The state claims to be eternal. If it admits a revolution created a *new* state, it admits the old state was legitimate until it died. By ratifying the revolution retroactively, the new state claims it is the *same* state, merely corrected. This preserves the authority of the "Constitution" over the "Officeholder."

  **4. Consistency of the "Unlawful Orders" Doctrine**
  Is the practice incoherent? **No, provided one accepts the "Office vs. Officeholder" distinction.**
  *   **Rebellion** is a claim that the *Office itself* is illegitimate and must be replaced by private force.
  *   **Disobedience** is a claim that the *Officeholder* is exceeding the authority of the Office.
  The system forbids private judgment on the *regime* (stability) but mandates official judgment on *acts* (rule of law). The soldier who disobeys is not acting as a private citizen but as a public official upholding the higher norm (Constitution) against the lower norm (Order). The rebel acts as a private citizen attempting to become the public source of norms.

  ### III. Counterfactuals: What Would Change?

  If we replaced this implicit hybrid view with the alternatives you proposed, the concrete legal practices would shift significantly.

  **1. If we adopted a Lockean Right of Revolution:**
  Locke argues that when government violates trust, power devolves to the people, who may judge and replace it.
  *   **Treason Statutes:** These would require a "just cause" defense. A court would have to adjudicate not just *whether* the defendant rebelled, but *whether the rebellion was justified* by the tyranny of the state. This is currently unthinkable; courts do not try the government to judge the prisoner.
  *   **Retroactivity:** Successful revolutions would not need to claim they were "valid from the start." They could admit they were illegal acts justified by necessity. The "founders" would be honored as heroes, not as lawful officers.
  *   **Oaths:** The oath would likely be to "Natural Rights" or "The People" in a way that explicitly licenses dissolution of the government, rather than to a specific Constitutional text which implies permanence.

  **2. If we adopted a Strict Positivist Account:**
  *   **Recognition:** Foreign courts would not treat the new decrees as "valid law from the moment issued." They would treat them as new laws effective from the date of recognition. The fiction of continuity would be dropped.
  *   **Retroactivity:** The new regime would have to explicitly re-enact all necessary past acts to give them validity. There would be no automatic "relation back."
  *   **Unlawful Orders:** The doctrine would be purely internal. A soldier could not claim an order was unlawful because it violated "justice," only because it violated the written rulebook. If the Sovereign changes the rulebook to permit atrocities, the positivist soldier must obey (or resign), whereas the current practice implies a duty to disobey based on a higher norm.

  ### IV. Bottom Line Diagnosis

  The practice you observe commits to a **Schmittian-Thomistic Hybrid**, though it dare not speak its name.

  It presupposes that **Political Authority is Ontologically Distinct from Power, but Epistemologically Dependent on It.**
  *   **Ontologically:** It claims the Thomistic view. Authority comes from the Common Good/Constitution. Tyranny is not authority.
  *   **Epistemologically:** It relies on the Realist view. We cannot *know* who represents the Common Good until the conflict is resolved. Success is the only objective test of who truly holds the "Constituent Power."

  Therefore, the retroactive validation is a **necessary legal fiction** to bridge the gap between the moral claim (we were right all along) and the empirical reality (we only won yesterday).

  **Confidence Level:**
  I am **highly confident** that the practice presupposes this hybrid view. A pure positivist system would not bother with the moralizing language of "treason" (which implies betrayal of a duty) rather than "insurgency" (which implies a threat to security). A pure Lockean system would not punish failed rebels without a hearing on the justice of their cause. The fact that the system punishes failure while sanctifying success, yet maintains a duty to disobey unlawful orders, proves it is trying to maintain the *normative authority* of the Constitution while relying on the *factual authority* of victory to identify who speaks for it.

  The incoherence you sense is real, but it is a *functional* incoherence. It allows the state to demand obedience in normal times (presuming legitimacy) while providing an escape valve in extreme times (recognizing the new sovereignty) without admitting that "might makes right." It preserves the Rule of Law by occasionally suspending it to save it.
