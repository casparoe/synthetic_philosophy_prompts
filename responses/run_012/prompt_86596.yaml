  **The Relation Round**

  I wake inside a narrow light
  A lone note begins to rise
  I hear a neighbor close beside
  Another voice repeats the shape
  The air is thick with distinct sounds
  No lone throat contains the chord
  I feel the vibration pass me by
  It is not mine, it is not yours
  Yet something fills the empty space
  Who hears the shape the voices make?
  Not I, who only sing my share
  The sound extends beyond the breath
  It hangs above the circle here
  No singer holds the full design
  It is a fact beyond the song
  It is a relation between.

