answer: |-
  1. **The Translation Objection**
      You argue that when predicates cross-cut, translation fails because we cannot preserve both extension and inferential role. But critics argue that partial overlap is precisely the mechanism of translation: if I map your term *X* to my disjunction *A-or-B*, haven't I translated it, albeit clumsily? Why does the existence of a complex mapping count as a failure of meaning rather than just a case of hard translation?

      *Follow-up:* You will likely reply that constructing that disjunction assumes a shared question-frame in which *A-or-B* is a valid equivalent. But if *any* proposed bridge can be dismissed because the bridge itself presupposes a frame, are you not making the incommensurability thesis immune to empirical refutation?

  2. **Relativism: Translation vs. Truth**
      You defend a relativism about translation but resist a relativism about truth. Yet, if we cannot translate a claim, we cannot state its truth conditions in our vocabulary. How do you block the slide from "we cannot say what they mean" to "we cannot say if they are right," without smuggling in a neutral standard of truth that your thesis says is unavailable?

      *Follow-up:* You will likely reply that assessing truth conditions requires a shared question-frame about what counts as verification. But if we lack that frame, does it not follow that we cannot rationally prefer our true claims over their "true" claims, rendering the distinction between truth and validity empty?

  3. **Question-Frame vs. Paradigm**
      Kuhn spoke of paradigms; you speak of question-frames. What analytical work does this new notion do that "paradigm" did not, and specifically, what would count as evidence that two traditions are genuinely incommensurable rather than merely stubborn or difficult to translate? How do we diagnose a question-frame without already standing outside it?

      *Follow-up:* You will likely reply that the demand for diagnostic evidence assumes a shared question-frame about what counts as evidence. But if you cannot point to evidence that would convince a skeptic without begging the question, isn't the "question-frame" just a label for our inability to understand the past?

  4. **Asymmetric Incommensurability**
      Kuhn often treated incommensurability as symmetric, like two speakers of different languages. But conceptual resources can be unequal. Is it possible for Tradition A to be unable to state Tradition B's claims, while Tradition B *can* state A's? If incommensurability is asymmetric, does that not imply one frame is strictly more capacious than the other?

      *Follow-up:* You will likely reply that judging one frame as "more capacious" assumes a shared question-frame regarding capacity. But if you rule out asymmetry to avoid hierarchy, are you not artificially leveling the playing field between, say, alchemy and chemistry, for the sake of theoretical symmetry?

  5. **The Stakes of Being Wrong**
      Let's press the cost of your position. If it turned out that a neutral question-frame *could* be reconstructed without theory-laden distortion, what specific part of your philosophy would you have to abandon? Is there any scenario you can envision where you would concede that comparability is possible after all?

      *Follow-up:* You will likely reply that the search for a neutral frame is itself framed by a theory of neutrality. But if no possible discovery could change your mind because the discovery itself would be interpreted through a frame, does your position function as a description of science or as an unfalsifiable metaphysical commitment?

  6. **Scientific Progress**
      If rival traditions answer different questions, it becomes difficult to say that later science "progresses" beyond earlier science rather than just shifting topics. How do you account for the intuition that modern physics explains more than Aristotelian physics without appealing to a shared standard of explanatory power that transcends their respective question-frames?

      *Follow-up:* You will likely reply that "explaining more" is a judgment internal to a specific question-frame. But if progress is only internal, can you consistently claim that science improves over time, or must you admit it merely changes from one incommensurable perspective to another?

  7. **The Historian's Privilege**
      You claim that a common question can be reconstructed only from the outside, by a historian or philosopher. But you are a philosopher embedded in a specific tradition. What question-frame are *you* occupying when you analyze these traditions, and is your philosophical vocabulary incommensurable with the scientific vocabularies you study?

      *Follow-up:* You will likely reply that my question assumes a shared question-frame about the relationship between philosophy and science. But if your analysis is also frame-bound, why should we accept your reconstruction of the historical frames as authoritative rather than just another local interpretation?

  8. **Learning and Acquisition**
      If vocabularies are incommensurable, learning a past theory cannot be a matter of translation; it must be like learning a second language. But when you learned these historical theories, did you not rely on ostensive definitions or shared logical structures? If you did, doesn't that imply a shared substrate of experience or logic that undermines the incommensurability thesis?

      *Follow-up:* You will likely reply that ostension is only effective within a shared question-frame about what is being pointed at. But if we cannot even share a frame for pointing, how did communication between *us* happen just now, or is our interview also a case of two people talking past one another?

  9. **Rational Choice**
      When a scientist decides to abandon one tradition for another, they usually offer reasons. If the traditions answer different questions, on what basis is that choice made? Is the switch between question-frames a rational decision based on evidence, or is it a conversion experience driven by social or psychological factors?

      *Follow-up:* You will likely reply that "rational decision" presupposes a shared question-frame about what counts as a reason. But if reasons are frame-relative, does this not reduce theory choice to rhetoric, where the victor is determined by persuasion rather than epistemic merit?

  10. **Normativity of Incommensurability**
      Finally, is incommensurability a bug or a feature? Should we view the inability to compare question-frames as a limitation we ought to overcome through better philosophy, or is it a protective boundary that preserves the integrity of distinct research traditions? What is the normative upshot of your descriptive claim?

      *Follow-up:* You will likely reply that calling it a "limitation" assumes a shared question-frame where unity is a virtue. But if you cannot recommend bridge-building without violating your own thesis, are you not counseling a form of intellectual isolationism that science itself seems to reject?
