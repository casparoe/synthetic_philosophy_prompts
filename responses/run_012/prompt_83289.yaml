answer: |-
  Bottom line
  The 1995 referendum demonstrates that the boundary problem—who constitutes the self-determining unit—is the substantive conflict, not merely a procedural precondition. Neither remedial nor primary right theories fully resolve the nested sovereignty claims of the Cree and Inuit, suggesting the legal aftermath was a pragmatic management of theoretical indeterminacy rather than a philosophical settlement.

  The mapping
  The players are the Quebec state (claiming territorial integrity of the province), the Canadian federal state (claiming constitutional supremacy), Indigenous nations within Quebec (claiming distinct sovereignty), and partitionist municipalities (claiming local allegiance). The options are sovereignty-partnership, status quo within Canada, or territorial partition where subregions remain Canadian. An expression of will is counted variably: for Quebec, a provincial referendum majority; for Indigenous nations, community plebiscites and treaty rights; for Canada, parliamentary resolutions and legal reference cases. The conflict centers on which expression of will binds which territory.

  Remedial right only
  Under this view, secession is permissible only to escape serious injustice, such as systematic rights violations or expropriation. Quebec's claim fails this test, as there is no evidence of systematic oppression by Canada sufficient to warrant remedial secession; the theory would dictate Quebec remains within Canada regardless of voter preference. However, the Cree and Inuit claims align better with this framework, given the history of the James Bay project and the imposition of development without consent, suggesting they would have remedial grounds to exclude themselves from a sovereign Quebec. The theory goes quiet on the democratic legitimacy of the 93% turnout and the intensity of Quebecois national aspiration, treating them as morally irrelevant without injustice. It also misdescribes the political reality by offering no mechanism for the "partnership" offer, since there is no duty to negotiate if no right to secede exists.

  Primary right
  This view holds that a nation has a right to secede if a majority supports it, provided the process is fair. Quebec qualifies as a nation, and the theory validates the referendum as the correct mechanism, though it struggles with the 49.42% result (some variants require a supermajority or clear majority). It explains the Quebec government's behavior and the international attention but falters on the unit of analysis: if the "people" is the Quebec nation, why are the Cree not a separate people with their own primary right? The theory tends to assume pre-defined administrative boundaries, so it misdescribes the partition threat by treating Quebec's borders as fixed prior to the vote. It goes silent on how to adjudicate competing primary rights over the same land, offering no hierarchy between the Quebec nation's claim and the Cree nation's claim.

  The Cree and Inuit votes
  For the remedial theorist, these votes are confirmation that injustice dictates boundaries; the Cree stay in Canada because their grievance is against Quebec's sovereignty project, not Canada's status quo. For the primary right theorist, these votes are a problem of overlapping jurisdiction; if both Quebec and the Cree are nations with primary rights, the theory lacks a metric to decide whose territory prevails. The episode suggests the remedial view better explains the moral weight of the Indigenous votes, while the primary view better explains the political weight of the Quebec vote. However, both theories are strained by the fact that the Cree votes were treated as political leverage rather than binding legal vetoes, indicating that raw power and constitutional law often override theoretical consistency.

  The symmetry principle
  Your symmetry principle is logically coherent but practically regressive; if applied strictly, it leads to infinite fragmentation until every household is sovereign. The episode supports the principle's logic—the Cree explicitly argued that if Canada is divisible, Quebec is divisible—but refutes its stability, as both Canada and Quebec rejected partition to preserve territorial integrity. The principle functions less as a governing rule and more as a bargaining chip to raise the cost of secession. It reveals that the right to determine status is not inherent but contingent on recognition by the existing state, meaning the symmetry breaks where the state refuses to acknowledge the subgroup's standing.

  What the case does to the theory
  The Supreme Court Reference and the Clarity Act show that both theories are missing the procedural centrality of the boundary problem. The Court split the difference—no unilateral right (checking primary theory) but a duty to negotiate on a clear question (checking remedial rigidity)—which implies the law is managing uncertainty rather than applying a consistent moral principle. The case proves the boundary problem is the actual content of the episode, not a footnote, because the legal aftermath focuses entirely on who votes and what counts as a majority, rather than why they want to vote. Ultimately, the episode suggests secession theory cannot resolve nested claims without a prior political agreement on who constitutes the relevant demos.
