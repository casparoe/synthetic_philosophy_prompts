prompt: |-
  I've been going down a rabbit hole on the 1995 Quebec referendum and I want to think about it through the secession-theory literature rather than as a Canadian politics thing. The episode: the October 30 vote, the question asking whether Quebec should become sovereign after offering Canada a partnership, the No side winning by about 54,000 votes (50.58 to 49.42, turnout north of 93%), and then the aftermath — the Cree and Inuit of northern Quebec holding their own votes a few days earlier with overwhelming majorities for staying in Canada, the partition proposals that followed (western Montreal, the Eastern Townships, the Pontiac, the north), the 1998 Supreme Court reference on unilateral secession, the Clarity Act. I know the history well enough, so don't spend the answer reciting it. What I want is the case run through two theories and then through a third thing I've been kicking around. The two theories: (1) the remedial-right-only view, where secession is justified only as a remedy for serious injustice, not because a majority happens to want it; and (2) a primary-right or plebiscitary view, where a group — usually a nation — has a right to secede if a majority of it supports it, maybe with conditions like a fair vote and a willingness to negotiate. For each, say what the theory has the actors facing, what it would have them do, which features of the episode it explains, and where it goes quiet or misdescribes things.

  Then I want the case to test the theories in return. I especially want to know what each does with the Cree and Inuit votes and with the partition arguments — are those the theory's problem or the theory's confirmation? And is 1995 evidence for remedial right only, given that the Cree had a real grievance (the James Bay project and the way their consent was treated) while Quebec's claim looked more plebiscitary — or does the fact that the Supreme Court split the difference (no unilateral secession, but a duty to negotiate after a clear expression of will) show that both theories are missing the same thing? The third thing is a principle I've been calling the symmetry principle, and you can tell me it needs a better name: any group claiming a right to determine its own political status has to concede the same right to any subgroup of its own territory that wants to determine its status — stay, leave, or rejoin. So if Quebec can leave Canada by majority vote, the Cree can leave Quebec by majority vote, and so on down. Is that coherent, or does it just regress until every household is sovereign? The Cree made their claim in roughly this shape (if Canada is divisible then Quebec is divisible), so I want to know whether the episode supports the principle, refutes it, or shows it was never the real question. And finally: does the boundary problem — who exactly is the self that gets to decide — turn out to be the actual content of the episode rather than a philosophical footnote?

  Format it like this. Start with a section called "Bottom line" (2-3 sentences). Then "The mapping" (one paragraph: players, options, what counts as an expression of will). Then "Remedial right only" and "Primary right" (one or two paragraphs each). Then "The Cree and Inuit votes" (one or two paragraphs). Then "The symmetry principle" (one paragraph). Then "What the case does to the theory" (one paragraph). Be disciplined about the mapping, and don't force either theory to speak where it genuinely has nothing to say — I'd rather hear where it goes silent than watch it get stretched.
