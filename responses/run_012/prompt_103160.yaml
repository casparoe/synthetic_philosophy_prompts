answer: |-
  You have identified one of the most famous and philosophically charged patterns in the foundations of logic and computer science. The claim you are describing is the **Church-Turing Thesis** (CTT).

  The "double life" you have observed—the oscillation between an empirical hypothesis and a definitional stipulation—is not a bug in your understanding; it is the central philosophical controversy surrounding the Thesis itself. There is no single, universally agreed-upon noun that names *only* this logical oscillation (e.g., "The X-Claim"), but there are established philosophical frameworks that categorize it.

  Here is the breakdown of the name, the structure, and the carving of the object you have found.

  ### 1. The Name of the Claim
  The specific claim is the **Church-Turing Thesis**.
  However, the *logical category* of such a claim is best described by two established terms, depending on which philosophical tradition you consult:

  *   **A Conventionalist Principle (or Poincaréan Convention):** Named after Henri Poincaré, who argued that certain principles in science (like the principle of inertia) look like empirical laws but function as definitions. They are adopted by convention because they are convenient, yet they are tested against experience. If experience seems to contradict them, we adjust our description of the phenomena rather than abandon the principle.
  *   **An Explicative Thesis (or Carnapian Explication):** Named after Rudolf Carnap. This describes the process of taking a vague, intuitive concept (like "effective procedure") and replacing it with a precise, formal one (like "Turing computability"). The argument that the two match is the "empirical" part; the decision to use the precise one henceforth is the "definitional" part.

  If you require a label for the *pattern of argument itself* (the oscillation), the most precise established term is **"The Status Problem of the Church-Turing Thesis."** However, if you wish for a term that captures the *logical form* of a claim that is defended empirically but protected definitionally, the best fit is a **Conventionalist Postulate**.

  ### 2. How the Claim is Carved: One Object or Two?
  You asked whether this is one hybrid object or two claims stitched together. It is **one hybrid object with two distinct functional components.** It is not merely two claims stuck side-by-side; the utility of the claim *depends* on their fusion.

  We can pull the strands apart analytically, but doing so dissolves the claim's power:

  *   **Strand A (The Adequacy Claim):** "Our intuitive notion of 'rule-following' coincides with the formal notion of 'Turing computability'."
      *   *Status:* This is the **empirical/conceptual hypothesis**. It is open to evidence. When proponents list "ingenious schemes" that failed to break the machine, they are defending Strand A.
  *   **Strand B (The Stipulation):** "Henceforth, in this formal system, 'computable' shall *mean* 'Turing computable'."
      *   *Status:* This is the **definition**. It is not true or false; it is a rule of language. When proponents dismiss a counterexample by saying "that is not a genuine procedure," they are retreating to Strand B.

  **Why they must run together:**
  If you keep only Strand A, the claim is vulnerable to refutation (a hypercomputer might be built). If you keep only Strand B, the claim is trivial (it says nothing about the world or human thought). The "Thesis" gains its foundational authority by borrowing the **necessity** of the definition (Strand B) to bolster the **contingent** claim about the world (Strand A).

  ### 3. The Mechanism of the Oscillation
  The oscillation you noticed is not accidental; it is a feature of **Conceptual Engineering**.

  1.  **In Persuasion Mode:** The proponent treats the claim as a **Discovery**. ("Look! Every attempt to calculate has fit this mold. Nature seems to obey this limit.") This invites you to accept the claim based on evidence.
  2.  **In Defense Mode:** The proponent treats the claim as a **Criterion**. ("If your device doesn't fit the mold, it doesn't count as 'calculation' by our lights.") This protects the claim from falsification.

  This is distinct from the **"No True Scotsman" fallacy**. In a fallacy, the redefinition is ad hoc and dishonest to save a generalization. In the Church-Turing Thesis, the redefinition is **constitutive**. The community is effectively saying: "We are not just describing what computers *do*; we are deciding what 'computation' *is*."

  ### 4. Distinguishing from Neighbors
  You correctly noted that this is not simply an unfalsifiable statement, a definition, or moving the goalposts. Here is how it differs:

  *   **Vs. Unfalsifiable Statement:** A pure unfalsifiable statement (e.g., "There is an invisible dragon in my garage") offers no empirical evidence. The Church-Turing Thesis *does* offer evidence (the historical record of calculability). It courts empirical testing, even if it ultimately reserves the right to redefine the terms of the test.
  *   **Vs. Pure Definition:** A pure definition (e.g., "A bachelor is an unmarried man") does not need evidence. You do not survey bachelors to prove they are unmarried. The Thesis *does* require evidence to convince us that the definition is *adequate* to the intuition.
  *   **Vs. Moving the Goalposts:** This implies bad faith or error. The oscillation in the Thesis is usually done in **good faith** because the goal is not to win a debate but to **stabilize a concept**. The community is trying to turn a vague intuition into a rigorous tool. The "reclassification" of counterexamples is an attempt to refine the boundary of the concept, not to hide a failure.

  ### 5. A Proposed Label
  Since you invited a coined term if no established one suffices, and while "Conventionalist Postulate" is accurate, it is broad. For this specific phenomenon in logic and computing, I propose the term:

  **An Explicative Postulate**

  *   **Explicative:** It acknowledges that the claim is an act of *explication* (replacing a vague concept with a precise one).
  *   **Postulate:** It acknowledges that the claim is *assumed* as a foundation for further work, rather than proved as a theorem or verified as a law.

  **Edges of the Concept:**
  *   **Inside:** The Church-Turing Thesis; The Principle of Inertia (in Poincaré's view); The axioms of geometry (in Kant's view).
  *   **Outside:**
      *   *Physical Laws* (e.g., Gravity): These are abandoned if evidence contradicts them; they are not protected by redefinition.
      *   *Dictionary Definitions:* These are not defended by empirical lists of examples.
      *   *Conspiratorial Theories:* These use the oscillation in bad faith (immunization). The Explicative Postulate uses it in good faith (stabilization).

  ### Summary
  You have found the **Church-Turing Thesis**, and the logical pattern is **Conventionalism** (specifically **Poincaréan** or **Carnapian**). The claim is a **hybrid**: it is an **empirical adequacy claim** wrapped in a **definitional stipulation**. It oscillates because it serves two masters: it must be **discovered** to be interesting, but it must be **stipulated** to be useful. The name for this double life is the status of a **Conventionalist Principle** or, more precisely, an **Explicative Postulate**.
