prompt: |-
  I teach a final-year metaphysics of mind seminar and I;m putting together the take-home exam. I want one essay question on the exclusion arguement that a student can't get through by reciting the supervenience version from memory. The hook I want baked in: the usual argument leans on a sufficiency or production picture of causation -- the physical realizer is enough for the effect, so the mental property can't be doing any separate work. Now suppose we swap that for a difference-making picture (a property counts as a cause when intervening on it changes the effect), and even for a contrastive one (causation is always this-rather-than-that causing this-rather-than-that). Does exclusion still go through? And the part I actually care about: a colleague insists that under difference-making the realizer makes a difference too, so exclusion just reappears and nothing has been gained -- I want them to assess that.

  So: give me the exam question itself (one essay, 60 minutes), and then the marking scheme as exactly five numbered points, one or two sentences each, no intro and no wrap-up. Each point should name the specific move a top answer has to make (so it does double duty as my model answer), the marks it's worth, and how students typically blow it. 20 marks total, and dont let any point be satisfiable by just naming a position -- they have to actually run the argument.
