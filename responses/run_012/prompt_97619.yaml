answer: |-
  **Exam Question (60 Minutes)**

  The standard Exclusion Argument relies on a sufficiency-based notion of causation: if the physical realizer is sufficient for the effect, the mental property is causally idle. Suppose we instead adopt an interventionist difference-making account, potentially framed contrastively. Does this dissolve the exclusion problem? Evaluate the claim that even on this view, the physical realizer remains a difference-maker alongside the mental, thereby reinstating exclusion.

  **Marking Scheme**

  1. (4 marks) Students must demonstrate why sufficiency triggers exclusion by arguing that if the physical suffices for the effect, any additional mental cause is redundant rather than merely supervenient. They typically fail by stating causal closure without explaining how sufficiency entails the mental's idleness.
  2. (4 marks) Full credit requires defining difference-making causation as counterfactual dependence under intervention, specifically noting that changing the cause must change the effect while holding other variables fixed. Students often blow this by treating any counterfactual dependence as causal without specifying the interventionist constraint.
  3. (4 marks) To secure marks, the essay must show how a mental property can be a difference-maker even if supervenient, typically by arguing that interventions on the mental variable are possible despite physical supervenience. The common error is asserting mental causation is possible without addressing how to satisfy the interventionist requirement for variable independence.
  4. (4 marks) Students must assess the colleague's claim by conceding the physical realizer is also a difference-maker but arguing this does not entail exclusion unless causes compete for a single causal slot. They typically fail by either denying the physical makes a difference or assuming two difference-makers automatically implies overdetermination.
  5. (4 marks) The top answer resolves the tension using proportionality or contrastivity to show the mental is the *better* or *appropriate* cause, thereby dissolving exclusion without denying physical difference-making. Students usually lose marks here by invoking these concepts without explaining how they prioritize the mental over the physical realizer.
