prompt: |-
  I run a reading group on evolutionary psychology and we're stuck. Two of the group are dyed-in-the-wool adaptationists who think the critics just dislike where the conclusions lead, two think the whole research programme is unfalsifiable story-telling, and after six sessions nobody's budged an inch. I want to make them write the document they should have produced months ago: the joint statement of an adverserial collaboration.

  So: the claims both sides can actually sign — about what the evidence base really looks like, about what the environment of evolutionary adaptedness was and wasn't, about what would even count as a psychological adaptation, about which findings are solid enough to build on; then the disagreements that remain, each phrased the way the side holding it would want it phrased; then the cruxes, i.e. the sub-questions where settling the thing would actually move somebody; and for each crux a test or case that both sides would agree bears on it, with each side's prediction written down in advance.

  Two bits I want done properly rather than waved at. First, modularity: how much domain-specific machinery does the programme actually need, and what should each side say the cheater-detection work and the deontic/permission versions of the selection task really show? Second, the falsifiablity charge itself — have each side spell out concretely what a failed prediction would look like for a flagship case (language, religion, moral judgment, whatever they pick), and whether they'd count it as evidence against their own view. I suspect at least one of the rows in the table is really a fight about what counts as a prediction rather than about the mind, so if part of the dispute turns out to be verbal, say which part and why.

  Numbered agreed-claims section first, then a disagreements table with the cruxes and predictions in it. No references needed, I care about the substance. British English please.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** A reading group on evolutionary psychology (EP) is deadlocked between hardline adaptationists and critics (who view EP as unfalsifiable storytelling).
      *   **Goal:** Create a "Joint Statement of Adversarial Collaboration."
      *   **Structure:**
          1.  Numbered Agreed Claims (evidence base, EEA, definition of adaptation, solid findings).
          2.  Disagreements Table (claims phrased by each side, cruxes, agreed tests/cases, pre-registered predictions).
      *   **Specific Focus Areas:**
          *   Modularity (domain-specific machinery, cheater detection, Wason selection task).
          *   Falsifiability (concrete failed predictions for flagship cases, willingness to update beliefs, distinguishing verbal disputes from substantive ones).
      *   **Tone/Style:** British English, substantive (no references needed), neutral but precise phrasing suitable for signing.

  2.  **Deconstruct the Parties:**
      *   **Side A (Adaptationists):** Believe the mind consists largely of evolved modules designed by natural selection. Think critics are motivated by ideological discomfort.
      *   **Side B (Critics/Constructivists/General Process Theorists):** Believe EP is often "just-so stories," unfalsifiable, underestimates plasticity/general learning. Think adaptationists ignore null results and alternative explanations.

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Goal:* Find common ground that isn't trivial but establishes the playing field.
      *   *EEA:* Both sides must agree it's not a single time/place, but a statistical composite of selection pressures.
      *   *Adaptation:* Need a rigorous definition (trait existing because it solved a specific recurrent problem, increasing fitness). Distinguish from by-products.
      *   *Evidence:* Acknowledge that some findings are robust (e.g., fear of snakes/spiders vs. cars) but interpretation varies.
      *   *Methodology:* Agree that cross-cultural data and developmental trajectories matter.
      *   *Modularity:* Agree that *some* specialization exists (e.g., visual system), disagreement is on *degree* in higher cognition.

  4.  **Drafting Section 2: Disagreements & Cruxes (The Core Task):**
      *   *Requirement:* Needs to be a table or structured list. Needs specific focus on Modularity and Falsifiability.
      *   *Issue 1: Modularity & Cheater Detection.*
          *   Adaptationist view: Wason task performance improves with social contract framing because of a dedicated module.
          *   Critic view: It's deontic logic or general pragmatic reasoning, not a specific "cheater" module.
          *   Crux: Is the effect content-specific (social exchange) or logic-specific (deontic)?
          *   Test: Novel deontic rules vs. novel social contracts.
      *   *Issue 2: Falsifiability (Flagship Case: Religion or Morality).*
          *   Let's pick Moral Judgment (trolley problems/harm) as it's concrete.
          *   Adaptationist view: Specific patterns reflect adaptive constraints (e.g., kin preference, reciprocity).
          *   Critic view: Patterns reflect cultural learning or general cognitive constraints.
          *   Falsification condition: What data would make the adaptationist say "I'm wrong"? (e.g., if moral intuitions vary randomly with no fitness correlate).
      *   *Issue 3: The "Just-So" Story Charge.*
          *   This is often verbal. Is it about *generating* hypotheses or *testing* them?
          *   Need to clarify if the dispute is about the *origin* of the hypothesis or the *validity* of the test.

  5.  **Refining the Content (Self-Correction/Polishing):**
      *   *Check British English:* "Programme," "behaviour," "centre," "modelling."
      *   *Check Tone:* Needs to sound like a formal document, not a blog post.
      *   *Check Specific Prompts:*
          *   *Modularity:* Ensure the Wason task/cheater detection is explicitly addressed.
          *   *Falsifiability:* Ensure concrete "failed prediction" scenarios are listed.
          *   *Verbal Dispute:* Identify where the argument is about definitions vs. reality.
      *   *Adversarial Collaboration Format:* Ensure predictions are pre-registered style (If X, then Side A says Y, Side B says Z).

  6.  **Drafting the Content - Step-by-Step:**

      *   *Introduction:* Brief preamble setting the context.
      *   *Part 1 (Agreed Claims):*
          1.  EEA definition (not a place, but a set of pressures).
          2.  Adaptation definition (requires evidence of design, not just function).
          3.  Plasticity (both agree humans are plastic, dispute is on limits).
          4.  Evidence status (some effects are real, interpretation is the fight).
      *   *Part 2 (Disagreements & Cruxes):*
          *   *Row 1: Modularity (Cheater Detection).* Focus on the Wason Selection Task. Adaptationists say "Social Contract Algorithm." Critics say "Deontic Reasoning." Crux: Non-social deontic rules.
          *   *Row 2: Falsifiability (Moral Foundations).* Adaptationists say "Universal patterns reflect adaptive problems." Critics say "Cultural variation swamps universals." Falsification: Finding a high-fitness behaviour that is universally morally repugnant without a counter-adaptation.
          *   *Row 3: The Nature of the Dispute (Verbal vs. Substantive).* Is "adaptation" being used differently? Yes. Adaptationists use it for "current utility + history," critics often conflate with "genetic determinism."

  7.  **Final Review against Constraints:**
      *   British English? Yes.
      *   No references? Yes.
      *   Numbered agreed claims first? Yes.
      *   Disagreements table with cruxes/predictions? Yes.
      *   Modularity and Falsifiability addressed properly? Yes.
      *   Verbal dispute identified? Yes.

  8.  **Final Polish:** Ensure the language is precise enough that a stubborn adaptationist and a stubborn critic could theoretically sign it without feeling they surrendered their core position, but *are* committed to the test. (e.g., using "suggests" vs "proves", defining terms clearly). *Self-correction: Make sure the falsifiability section explicitly asks "Would you change your mind?"*

  9.  *(Drafting the response based on the above thought process)* -> *Proceeds to generate output.*
answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION: EVOLUTIONARY PSYCHOLOGY**

  **Preamble**
  This document records the current position of the Reading Group on Evolutionary Psychology. It distinguishes between methodological and empirical claims upon which all members agree, and specific theoretical disagreements. For the latter, we specify the 'crux' (the specific evidence that would shift credence), propose an adjudicating test or case study, and record pre-committed predictions. The aim is not consensus for its own sake, but to isolate where the dispute is substantive and where it is verbal.

  ### PART I: AGREED CLAIMS

  All signatories endorse the following propositions as the baseline for further discussion:

  1.  **The Environment of Evolutionary Adaptedness (EEA):** The EEA is not a specific time or place (e.g., 'the Pleistocene savannah'), but a statistical composite of the selection pressures that shaped a specific trait over deep time. Both sides agree that assuming a single, uniform ancestral environment for all psychological traits is erroneous.
  2.  **Definition of Adaptation:** A psychological trait counts as an adaptation only if it demonstrates evidence of 'design' for solving a specific recurrent problem in the EEA, and if its existence is best explained by natural selection acting on that problem. Both sides agree that current utility does not prove adaptive origin (traits may be exaptations or by-products).
  3.  **Domain-Specificity:** Both sides agree that the human mind contains *some* domain-specific machinery (e.g., low-level visual processing, language acquisition devices). The disagreement concerns the *extent* of this modularity in higher-order cognition (e.g., social reasoning, moral judgment).
  4.  **Plasticity:** Both sides agree that human behaviour is highly plastic and sensitive to cultural and developmental context. The adaptationist side does not claim genetic determinism; the critic side does not claim the mind is a 'blank slate'. The dispute concerns the *limits* of that plasticity.
  5.  **Evidence Base:** Both sides agree that certain findings are robust enough to serve as data points, even if their interpretation is contested. These include: cross-cultural universals in facial expression; the development of specific phobias (e.g., snakes/spiders vs. electrical sockets); and performance shifts in the Wason Selection Task under varying content conditions.
  6.  **Falsifiability Principle:** Both sides agree that for Evolutionary Psychology (EP) to be a scientific programme, it must be possible to specify evidence that would count *against* a specific adaptationist hypothesis. A hypothesis that is compatible with all possible outcomes is not scientific.

  ---

  ### PART II: DISAGREEMENTS, CRUXES, AND ADJUDICATING TESTS

  The following table outlines the primary areas of contention. For each, the claim is phrased as the holding side wishes it to be understood. The 'Crux' identifies the specific sub-question where resolution would force a significant update in belief. The 'Adjudicating Case' is a test or data set both sides agree is relevant. Predictions are pre-registered.

  | Domain | Side A (Adaptationist) Claim | Side B (Critic) Claim | The Crux | Adjudicating Case / Test | Side A Prediction | Side B Prediction | Falsification Condition (Would you change your mind?) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Modularity & Reasoning** | The mind contains dedicated 'social contract' algorithms. Improved performance on the Wason Selection Task is specific to *cheater detection* contexts, not general logic. | Performance shifts are due to general deontic (permission/obligation) reasoning or pragmatic schema, not a dedicated cheater module. | Is the facilitation effect content-specific (social exchange) or logic-specific (deontic rules)? | **Novel Deontic Rules:** Present subjects with unfamiliar deontic rules that imply no social exchange or benefit (e.g., 'If you wear a red armband, you must stay indoors'). | Subjects will perform poorly. The module only activates for social exchange/benefit structures. | Subjects will perform well. Any deontic structure (rule + violation) facilitates logical performance regardless of social benefit. | **A:** If subjects solve non-social deontic rules as well as social contracts, we must concede the module is not specific to cheating. <br> **B:** If subjects fail non-social deontic rules but pass social contracts, we must concede there is content-specificity beyond general logic. |
  | **2. Moral Judgment** | Moral intuitions (e.g., harm/care, fairness/reciprocity) reflect adaptive solutions to ancestral coordination problems. Variations are parameter settings on universal foundations. | Moral intuitions are primarily constructed via cultural learning and general cognitive processes. 'Universals' are shallow or reflect shared ecological constraints, not innate modules. | Does moral variation map onto fitness-relevant parameters (kinship, reciprocity) or cultural arbitrary boundaries? | **High-Fitness Violations:** Identify behaviours that would have been highly fitness-enhancing in the EEA but are universally morally repugnant today (e.g., specific forms of kin-aggression). | Such behaviours will not be 'universally repugnant'; moral intuition will track ancestral fitness logic (e.g., favouring kin even when harmful to outsiders). | Such behaviours will be universally repugnant due to cultural/cognitive overlays that override ancestral fitness logic. | **A:** If moral intuitions systematically track cultural arbitrary rules *against* fitness interests without variance, the 'adaptive foundation' claim is weakened. <br> **B:** If moral intuitions consistently track kinship/reciprocity gradients across all cultures, the 'cultural construction' claim is weakened. |
  | **3. Falsifiability (Flagship Case: Religion)** | Religious belief is a by-product of adaptive cognitive systems (e.g., agency detection, theory of mind) or an adaptation for group cohesion. | Religious belief is a cultural meme that exploits cognitive biases but is not itself an adaptation or a necessary by-product. | Is religious cognition 'canalised' (hard to avoid) or contingent on cultural transmission? | **Developmental Trajectories:** Study children in secular vs. religious environments regarding 'teleological thinking' (e.g., 'rocks are pointy so animals don't sit on them'). | Children will show default teleological/intentional thinking regardless of environment, suggesting a cognitive bias towards religious-like thought. | Children's thinking will track parental/educational input closely, showing no default 'religious' bias. | **A:** If secular-raised children show no more teleological bias than controls, the 'by-product of cognitive systems' claim fails. <br> **B:** If secular-raised children spontaneously generate religious-like explanations at high rates, the 'cultural meme' claim fails. |
  | **4. The 'Just-So' Charge** | EP generates novel, risky predictions (e.g., step-mother abuse rates) that are confirmed. The 'story-telling' charge ignores these successes. | EP explains known data post-hoc but rarely predicts novel phenomena. When predictions fail, auxiliary hypotheses are added to save the theory. | Is the research programme progressive (predicting new facts) or degenerative (accommodating old facts)? | **Pre-Registration Audit:** Review the last 5 years of major EP journals for pre-registered studies vs. post-hoc explanations. | A significant proportion of high-impact papers will contain pre-registered, confirmed predictions. | The majority of high-impact papers will be post-hoc explanations of known phenomena with no risk of falsification. | **A:** If <10% of flagship studies are pre-registered with confirmed predictions, we acknowledge a methodological crisis in the field. <br> **B:** If >30% are pre-registered with confirmed predictions, we acknowledge the 'unfalsifiable' charge is too broad. |

  ---

  ### PART III: ANALYSIS OF VERBAL DISPUTES

  Upon drafting the above, the group identifies one significant verbal dispute masquerading as a substantive one.

  **The Dispute:** The definition of 'Prediction' in the context of Falsifiability.

  **The Conflict:**
  *   **Side A (Adaptationists)** often treat a 'prediction' as a directional hypothesis derived from a functional analysis (e.g., 'Men will value youth in mates more than women'). If the result is null, they often argue the *context* was wrong (e.g., 'modern contraceptives changed the cost-benefit analysis'), not the theory.
  *   **Side B (Critics)** define a 'prediction' as a risky statement that, if false, forces the abandonment of the core theoretical framework. They argue Side A treats the core framework (the mind is modular/adaptive) as unfalsifiable by shifting the blame to auxiliary hypotheses (the specific environmental trigger).

  **Resolution:**
  This is a verbal dispute regarding the **Lakatosian structure** of the research programme.
  *   **Substantive Core:** Is the mind modular? (Empirical).
  *   **Protective Belt:** What counts as the correct EEA trigger for a module? (Theoretical).

  **Agreement:**
  Both sides agree that Side A must stop shielding the 'hard core' (modularity) from refutation by constantly adjusting the 'protective belt' (EEA conditions) without independent evidence for those conditions.
  Both sides agree that Side B must acknowledge that *some* post-hoc explanation is necessary in complex systems, provided it generates *new* testable implications.

  **Action:**
  Future sessions will not accept 'EEA mismatch' as an explanation for null results unless independent evidence of that mismatch is provided. Conversely, critics will not dismiss a finding as 'story-telling' if it was pre-registered and survived a high-power replication.

