prompt: |-
  I recently staked the central argument of a paper on the assumption that the probability of an indicative conditional — 'if A, then B' — is simply the conditional probability of B given A, and the referee report I just received attacks that assumption with the triviality results: the family of proofs showing that the equation cannot hold unrestrictedly, so that something has to give. Either indicative conditionals are not ordinary truth-conditional propositions at all, or the equation survives only for simple, unembedded conditionals, or only relative to probability functions that already accept the antecedent, or only for special classes of probability functions, or only in a semantics where conditionals do not denote anything.

  I have the technical literature; what I lack is a sense of which of the resulting lines of work actually matter for someone in my position, so please give me a defended agenda rather than a survey. Rank the live open questions and research directions here by how much they matter, and explain the ranking: which questions are upstream of which, which are tractable enough that an answer could plausibly arrive within a few years, which are technical housekeeping that would not change how anyone actually uses conditionals in probabilistic reasoning or decision theory, and what would move a line of work up or down the list. I am prepared to spend a couple of years on one of these, so I care about the trade-offs between importance, tractability, and whether resolving the question would unblock anything else. No citations or reading lists, please — just the reasoning about where the effort should go.
