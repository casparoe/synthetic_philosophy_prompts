  ### The Leaves (Positions)

  **Leaf A: Deflationary Verbalism**
  *   **Commitment:** The dispute is purely about language; there is no deep metaphysical fact about construction.
  *   **Hardest Commitment:** Explaining why the conflict produces such intense political and emotional substance if it is only about words.
  *   **Arbitrariness:** N/A (Dispute is verbal).
  *   **Changeability:** N/A.

  **Leaf B: Natural/Biological Realist**
  *   **Commitment:** The kind exists independently of society; social labels merely track natural facts.
  *   **Hardest Commitment:** Explaining the historical variability of the category (e.g., why "race" changes across centuries) if it is natural.
  *   **Arbitrariness:** No (Boundaries track nature).
  *   **Changeability:** No (Cannot be changed by attitudes).

  **Leaf C: Causal Constructionist**
  *   **Commitment:** Social forces cause the members to have certain traits, but the traits are now real and independent.
  *   **Hardest Commitment:** Denying that some traits might be innate while maintaining they are socially caused.
  *   **Arbitrariness:** Yes (Social causes could have been different).
  *   **Changeability:** No (Once caused, traits persist).

  **Leaf D: Eliminativist/Fictionalist**
  *   **Commitment:** The kind is false or illusory and should be discarded from serious discourse.
  *   **Hardest Commitment:** Explaining the tangible harm the kind causes if it is merely fictional.
  *   **Arbitrariness:** Yes (It is a mistake).
  *   **Changeability:** Yes (Abolish the error).

  **Leaf E: Real-Because-Constructed**
  *   **Commitment:** The kind is ontologically real *precisely* because it is socially constructed and sustained.
  *   **Hardest Commitment:** Distinguishing this view from Causal Constructionism without circularity.
  *   **Arbitrariness:** No (Construction is constitutive, not arbitrary).
  *   **Changeability:** No (As long as society exists, the kind is real).

  **Leaf F: Ameliorative/Pragmatic**
  *   **Commitment:** We should use the category not because it is true, but because it serves political justice.
  *   **Hardest Commitment:** Justifying the use of a "false" or "arbitrary" category for truth-seeking purposes (e.g., in medicine).
  *   **Arbitrariness:** Yes (Boundaries chosen for utility).
  *   **Changeability:** Yes (Change when utility ends).

  **Leaf G: Interactive/Looping View**
  *   **Commitment:** The classification changes the members, creating a feedback loop that sustains the kind.
  *   **Hardest Commitment:** Proving the change is due to classification and not other environmental factors.
  *   **Arbitrariness:** Yes (Initial classification could differ).
  *   **Changeability:** Yes (Break the loop to change the kind).

  **Leaf H: Static Constitutive Constructionist**
  *   **Commitment:** Social attitudes define membership, but this definition does not alter the member's internal traits.
  *   **Hardest Commitment:** Explaining why members often internalize the status if it has no interactive effect.
  *   **Arbitrariness:** Yes (Definition is social choice).
  *   **Changeability:** Yes (Change the definition).

  **Leaf I: Institutional-Fact View**
  *   **Commitment:** The kind exists only by collective agreement (like money), but functions as an objective fact within that system.
  *   **Hardest Commitment:** Explaining cases where the status persists without agreement (e.g., under coercion).
  *   **Arbitrariness:** Yes (Agreement could be different).
  *   **Changeability:** Yes (Collapse the institution).

  *(Note: Leaf J was merged into I/E depending on normative stance, keeping total leaves at 9 to fit constraints.)*

