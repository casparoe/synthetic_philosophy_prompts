answer: |-
  # The Social Construction Decision Tree

  This instrument is designed to sort philosophical positions on social construction by asking diagnostic questions about the world, not about theorists. Answer each question based on your intuition about the kind in question (e.g., race, money, gender). Follow the path to a leaf to identify the position that matches your view.

  ### Internal Nodes (Diagnostic Questions)

  **Node 1: The Semantic Check**
  Is the disagreement about whether a kind is "constructed" resolvable simply by clarifying how we use words, without investigating the world?
  *   **Yes:** Go to Leaf A (Deflationary).
  *   **No:** Go to Node 2.

  **Node 2: Ontological Independence**
  Would the members of this kind exist and possess their core features even if no human societies or attitudes ever existed?
  *   **Yes:** Go to Node 3.
  *   **No:** Go to Node 5.

  **Node 3: Feature Independence**
  Do the members possess their defining physical or psychological features independently of social treatment?
  *   **Yes:** Go to Leaf B (Natural Realist).
  *   **No:** Go to Node 4.

  **Node 4: Causal Persistence**
  If social attitudes and arrangements vanished, would the physical/psychological features of the members persist?
  *   **Yes:** Go to Leaf C (Causal Constructionist).
  *   **No:** Go to Leaf D (Eliminativist).

  **Node 5: Locus of the Social Element**
  Does the social element draw a *boundary* around pre-existing traits, or does it create the *membership condition* (status) itself?
  *   **Boundary (Traits):** Go to Node 4 (Treat as Causal).
  *   **Membership (Status):** Go to Node 6.

  **Node 6: Source of Status**
  Is the membership status created by *collective agreement* (institutions) or by the *act of classification* itself (labeling)?
