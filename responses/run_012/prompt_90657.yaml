      *   *Clarification:* Make sure to distinguish between "breaking the law" (modern sense) and "evading jurisdiction" (Confucian sense). Shun doesn't pardon the father; he removes himself from the equation.
      *   *Key Term:* *Quan* (Discretion/Weighing). This is a moment of moral weighing where standard rules don't apply directly.
      *   *Key Term:* *Ti* (Body/Substance) vs. *Yong* (Function). Father-son is substance; King-Minister is function.

  8.  **Final Polish:** Ensure the tone is scholarly but accessible, respecting the depth of the user's engagement. (The user clearly knows the text well). Structure the answer to directly address their specific "three things" and final questions.

