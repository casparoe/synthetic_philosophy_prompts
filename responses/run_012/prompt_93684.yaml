answer: |-
  ### I. Theory on the Case

  The democratic boundary problem posits a logical circularity: to decide democratically who constitutes the *demos* (the people), one must already have a *demos* to cast the vote. Any procedure for setting the boundary presupposes the very boundary it seeks to establish. In the Swiss suffrage episodes, the *demos* at the 1959 and 1971 federal votes was exclusively male. The outcome bound the entire Swiss population, including the excluded women. The boundary problem predicts that this arrangement is normatively unstable: the men possessed the procedural power to decide the boundary, but lacked the normative standing to decide it for women, while the women possessed the normative standing but lacked the procedural power.

  Two principles are typically offered to resolve this circularity by providing a pre-democratic criterion for inclusion. The **All-Affected Interests (AAI)** principle argues that anyone whose interests are significantly impacted by a decision should have standing. The **All-Subjected to Coercion (ASC)** principle argues that anyone subject to the binding enforcement of the state's laws should have standing.

  The Swiss case embarrasses both principles. Under AAI, Swiss women were indisputably affected by federal legislation regarding taxation, employment, and family law. Under ASC, they were unequivocally subject to the coercion of the Swiss state; they could be prosecuted, fined, and conscripted into civil duties, yet denied the right to shape the laws enforcing these duties. The persistence of exclusion until 1971 (and 1990 in Appenzell) demonstrates that neither principle is self-enforcing. However, the case fits the ASC principle more tightly as a post-hoc justification. Once included, the rationale was that women were citizens subject to the law. The AAI principle is more difficult to apply cleanly because of the organized federation of women who campaigned *against* suffrage.

  The existence of an anti-suffrage women's movement does not weaken the claim to standing. Standing is a normative status derived from the objective condition of being affected or subjected, not a subjective desire for participation. That some women opposed the vote is analogous to a citizen opposing taxation; it does not negate their subjection to the tax code. However, this movement does complicate the AAI principle as a practical criterion. If "interests" are defined subjectively, the anti-suffrage women could claim their interest was best served by exclusion. If "interests" are defined objectively (e.g., autonomy, protection from tyranny), the movement reveals that the *demos* cannot rely on the affected to identify their own affectedness. The boundary problem thus exposes a gap between objective subjection and subjective political will.

  Furthermore, the Swiss boundary was internal, distinguishing classes of persons within an established polity, rather than external, concerning immigration or secession. The boundary problem is usually posed regarding the creation of new states or borders, where the *demos* is wholly undefined. In Switzerland, the state and its territory were fixed; the question was the status of inhabitants within it. Here, the boundary problem misdescribes the situation by implying a vacuum of authority. There was no vacuum; there was an incumbent *demos* (men) holding a monopoly on decision-making. The theory falls silent on the dynamics of *internal* exclusion because it assumes the primary problem is constituting a state, not reforming the membership of an existing one. It fails to account for the power of an incumbent *demos* to act as a trustee for the excluded, or as a gatekeeper against them.

  ### II. The Case on the Theory

  The 1971 vote appears to contradict the impossibility claim of the boundary problem. The male *demos* voted to enlarge itself, seemingly settling the boundary democratically. However, this was not an act of self-government for the women it bound. For the women, the 1971 reform was an act of *grant*, not *exercise*. They could not vote on the amendment that enfranchised them; they were the object of the decision, not the authors. Legitimacy here relies on a theory of trusteeship: the incumbent *demos* acted on behalf of the excluded. This is fragile legitimacy. It suggests the inclusion is legitimate only because it was later ratified by the enlarged *demos* in the October 1971 election. Yet, this ratification is circular; the women could only ratify the system because the men had already allowed it.

  The 1990 Federal Supreme Court order regarding Appenzell Innerrhoden clarifies the theoretical stakes. In that canton, the male *demos* refused to enlarge itself, despite the federal precedent. The boundary problem here is confirmed: the democratic procedure (the cantonal vote) could not solve the boundary issue because the *demos* had an interest in maintaining its exclusivity. The court order, a non-democratic intervention relative to the cantonal *demos*, completed the inclusion. This demonstrates that when the incumbent *demos* refuses to correct a boundary violation, the boundary problem cannot be solved democratically from within. It requires an external normative enforcement (judicial review) to override the procedural circularity.

  Contrast this with the 2014 Scottish independence referendum. The franchise was based on residence: EU and Commonwealth citizens living in Scotland and 16- and 17-year-olds were included, while Scots living elsewhere in the UK were excluded. If we apply the All-Affected Interests principle strictly, the Scottish franchise is illegitimate. Scots living in London are profoundly affected by Scottish independence (citizenship, currency, family ties). Conversely, a French citizen living in Edinburgh for six months is less affected than an expat Scot. AAI demands a franchise that potentially includes the whole of the UK or the diaspora, leading to a *reductio ad absurdum*: the "Scottish" referendum dissolves into a UK-wide plebiscite, destroying the specific unit seeking self-determination.

  The Scottish case reveals that the All-Subjected to Coercion principle (operationalized here as residency) was doing the work, not AAI. Residency presumes subjection to the future state's coercion. The contrast with Switzerland is illuminating. In Scotland, the boundary was drawn to preserve the viability of the decision (avoiding the AAI infinity). In Switzerland, the boundary was drawn to preserve the power of the incumbent group (men). The Swiss case shows that when the boundary is internal (gender), the ASC principle is morally compelling but politically inert without external pressure. The Scottish case shows that when the boundary is territorial (independence), the ASC principle is pragmatically necessary to prevent the AAI principle from dissolving the polity. The Swiss episode reveals that the "impossibility" of the boundary problem is not logical but political: the *demos* can enlarge itself, but only if the incumbent members surrender privilege. When they do not (Appenzell), the theory's prediction of democratic impasse holds true.

  ### Verdict

  The Swiss episode confirms the diagnostic power of the democratic boundary problem but exposes a distinction the theory has been missing: the difference between *constitutive* boundaries and *reparative* boundaries.

  The boundary problem correctly identifies that the 1959 and 1971 votes were logically circular; the men decided who should decide. However, the theory often implies this circularity makes democratic resolution impossible. The Swiss case shows it is not impossible, but contingent. The male *demos* could dissolve the paradox by voting for its own obsolescence as a exclusive club. This succeeded federally in 1971 but failed cantonally in Appenzell. The 1990 court order confirms that when the democratic mechanism fails to repair the boundary, the boundary problem reverts to a rights violation requiring non-democratic correction.

  Therefore, the Swiss case is not an anomaly, but a refinement. It demonstrates that the boundary problem is not a permanent barrier to democracy, but a specific vulnerability. It arises when the incumbent *demos* perceives its identity as dependent on exclusion. The theory must be amended to acknowledge that while the *demos* cannot logically constitute itself *ex nihilo*, an existing *demos* can constitutionally amend its own boundaries—provided it possesses the civic virtue to do so. Where that virtue fails, as in Appenzell, the boundary problem stands vindicated: the question of who belongs could not be settled democratically, and had to be settled by law.
