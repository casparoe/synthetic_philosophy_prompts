  5.  **Synthesize the Principle:**
      *   The core principle is **Interdependent Expectation in the Service of Coordination.**
      *   A regularity $R$ is a convention if:
          1.  $R$ solves a recurrent coordination problem.
          2.  My reason for following $R$ depends on my expectation that *you* will follow $R$.
          3.  $R$ is arbitrary (another regularity $R'$ could have worked).

  6.  **Address the "History/Precedent" Question:**
      *   Does how it spread matter?
