          *   Driving: I conform primarily to avoid crashing into you (coordination). The law is a focal point/enforcer, but the underlying motive is mutual benefit.
          *   Police Rule: I conform *only* to avoid the fine. If the fine goes, the motive goes. There is no underlying coordination benefit keeping it alive.
          *   *Principle:* Conventions persist due to *interdependent expectations*, not just external sanctions.

      *   *Tension 2: Promise-keeping vs. Driving.*
          *   Driving: Pure coordination.
