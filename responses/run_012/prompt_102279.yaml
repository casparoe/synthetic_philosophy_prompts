answer: |-
  The principle that unifies nearly all your verdicts is the **Coordination Principle**, most famously articulated by the philosopher David Lewis.

  According to this principle, a **convention** is a regularity in behavior that arises to solve a **coordination problem**, sustained by **interdependent expectations**.

  Here is the breakdown of that principle, how it resolves your tensions, and which verdict it forces you to reconsider.

  ### 1. The Unifying Principle: Interdependent Expectations
  For a regularity to be a convention, three conditions must generally be met:

  1.  **Conditional Preference:** I follow the rule *because* I expect you to follow it. If I believed you would not follow it, I would not follow it either (or I would be significantly worse off).
  2.  **Arbitrariness:** There is at least one other possible regularity that could have solved the problem just as well. (We could drive on the left; we could use shells instead of money).
  3.  **Common Knowledge:** It is known by all that all are expected to conform, and that all prefer to conform on the condition that others do.

  **How this explains your "Not Conventions":**
  *   **The Village Path:** Fails *Conditional Preference*. You take it because it is dry, not because others do.
  *   **Left-Hand Eating:** Fails *Conditional Preference*. You avoid it due to personal discomfort, not social mismatch.
  *   **Sidewalk Dodge:** Fails *Common Knowledge/Standing*. It is a one-off coordination, not a standing regularity with established expectations.
  *   **Police-Sustained Rule:** Fails *Conditional Preference*. You follow it because of the fine, not because you expect others to. As you noted, if enforcement stops, the regularity dissolves. In a true convention, if enforcement stops, the expectation of *others' behavior* often keeps the regularity alive for a time.

  ### 2. Resolving Tension 1: Driving vs. Police Rule
  You asked why driving is a convention despite having laws, while the police-sustained rule is not.

  **The Principle says:** Enforcement is not the definition; it is merely a **focal point**.
  *   **Driving:** The law acts as a signal to coordinate our expectations. However, the underlying *motive* is coordination (avoiding crashes). If the police vanished tomorrow, you would still drive on the right for a while because you expect *me* to, and I expect *you* to. The regularity is self-sustaining via expectation.
  *   **Police Rule:** The regularity is *not* self-sustaining. The expectation of others' behavior is irrelevant; only the expectation of punishment matters.

  **Verdict:** Your intuition here is correct. The presence of law does not disqualify a convention, but reliance *solely* on law disqualifies it.

  ### 3. Resolving Tension 2: Promise-Keeping vs. Driving
  This is where the principle exerts pressure. You count promise-keeping as a convention, but note it "sits more heavily."

  **The Principle says:** Conventions must be **Arbitrary**.
  *   **Driving:** It is equally functional for everyone to drive on the left or the right. The choice is arbitrary.
  *   **Promise-Keeping:** Is it arbitrary? Can we imagine a convention where the regularity is "always break your promises"? No, because the concept of a "promise" logically entails an obligation to keep it. If everyone broke promises, the institution of promising would cease to exist, not just become inconvenient.

  Furthermore, conventions rely on **Conditional Preference**.
  *   **Driving:** If I know everyone else is driving on the left, I happily switch to the left.
  *   **Promise-Keeping:** If I know everyone else is breaking their promises, do I feel free to break mine? Your intuition ("sits more heavily") suggests **no**. You feel a moral obligation that persists even if others defect.

  ### 4. Does History Matter?
  You asked about a regularity that began as coordination among a few and spread by precedent.

  **The Principle says:** The **origin** matters less than the **current state of knowledge**.
  Precedent is simply the mechanism that creates *Common Knowledge*. Once the regularity is established and everyone knows that everyone knows it, the history of how it started (organic growth vs. imposed by a leader) becomes secondary.
  *   If a dictator imposes a driving side, but over 50 years it becomes sustained by mutual expectation and habit (people drive right even when no police are watching), it **becomes** a convention over time.
  *   If a rule is imposed and remains sustained *only* by the threat of the dictator, it never becomes a convention.

  ### 5. Which Verdict Must You Abandon?
  To maintain a single, consistent principle (The Coordination Principle), you must abandon or significantly qualify your verdict on **Promise-Keeping**.

  While promise-keeping relies on conventional practices (like language), the *obligation* to keep a promise behaves differently than a coordination convention:
  1.  **It lacks Arbitrariness:** There is no functional alternative "regularity" of promise-breaking.
  2.  **It lacks pure Conditionality:** Moral norms often claim authority even when others defect (you shouldn't murder even if everyone else is). Conventions lose their grip when others defect (there is no point driving on the right if everyone else is driving on the left).

  **The Revision:**
  You should reclassify **Promise-Keeping** not as a *convention*, but as a **Moral Norm** that is *supported* by conventions (like language).
  *   **Driving, QWERTY, Money:** Pure Conventions (Coordination + Arbitrary).
  *   **Promise-Keeping:** Moral Obligation (Non-arbitrary + Categorical).

  If you make this change, your principle holds perfectly: **A convention is an arbitrary regularity sustained by the mutual expectation of conformity for the sake of coordination.** Every other verdict you made fits this definition; promise-keeping is the outlier that reveals the boundary between "what we do to get along" and "what we ought to do."
