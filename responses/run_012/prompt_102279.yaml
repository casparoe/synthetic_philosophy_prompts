      *   **Resolving Tension 1 (Driving vs. Police):** Explain that enforcement is secondary in conventions. In Driving, enforcement highlights the focal point; in the Police Rule, enforcement *is* the only motive. The "dissolve test" is the key.
      *   **Resolving Tension 2 (Promises):** This is the hard one. Explain that strict convention theory requires arbitrariness. Promise-keeping feels non-arbitrary (moral).
