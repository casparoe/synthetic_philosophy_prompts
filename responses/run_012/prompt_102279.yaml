      *   *Police-enforced rule:* User says *Not*. Fits Lewis. Why? Because the preference isn't conditional on *others' conformity*, it's conditional on *punishment*. If enforcement stops, it dissolves. In a convention, if enforcement stops, it might persist because we still need to coordinate.
      *   *Sidewalk dodge:* User says *Not* (one-off). Fits Lewis. Conventions are *standing* regularities, not single instances.
      *   *Money:* User says *Convention*. Fits Lewis. Coordination (medium of exchange). Arbitrary (could be shells). Conditional (worthless if others don't accept).
      *   *Left-hand eating:* User says *Not* (discomfort even if alone). Fits Lewis. Not conditional. It's a preference/taste/disgust, not coordination.

