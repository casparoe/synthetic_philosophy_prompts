  2.  **Deconstruct the Concept of "Convention":**
      *   The philosophical standard-bearer for this topic is David Lewis (*Convention: A Philosophical Study*, 1969).
      *   *Lewis's Definition:* A convention is a regularity in behavior that solves a coordination problem. Key features:
          1.  Everyone conforms.
          2.  Everyone expects everyone else to conform.
          3.  Everyone prefers to conform *if* others conform (conditional preference).
          4.  There is an alternative regularity that could have solved the problem just as well (arbitrariness).
      *   *Alternative View:* Margaret Gilbert (Joint Commitment) or Ruth Millikan (Proper Function). But Lewis is the best fit for the "coordination" intuition here.

  3.  **Evaluate the User's Cases against Lewis's Criteria:**

      *   *Driving on the right:* Fits Lewis. Coordination problem (crashes if we don't match). Arbitrary (could be left). Conditional preference (I want to drive right *because* you do).
      *   *Village path:* User says *Not*. Fits Lewis. Not arbitrary (driest path is physically determined). Not conditional (I'd take it even if you didn't).
      *   *QWERTY:* User says *Convention*. Fits Lewis. Coordination (typing compatibility). Arbitrary (Dvorak exists). Conditional (useless if no one else uses it).
