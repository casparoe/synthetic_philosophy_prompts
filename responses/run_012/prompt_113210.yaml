      *   *Claim 1* refers to **Mixed Strategy Dominance** vs. **Pure Strategy Dominance**.
      *   *Claim 2* refers to **Order Independence** of IEDS.
      *   The "rational, well-informed party" language points to **Common Knowledge of Rationality (CKR)**.
