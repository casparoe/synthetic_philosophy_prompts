answer: |-
  ### Grounds for Ordering

  In ranking these questions, I prioritize **Upstreamness** above all else. If the Symmetry Thesis is metaphysically incoherent, the normative implications are moot; therefore, questions establishing the validity of the analogy must precede questions about its policy applications. **Impact** is the secondary criterion: a question ranks higher if settling it directly alters the social discount rate or the obligations of a longtermist agent. **Tractability** is tertiary; while conceptual tools are our primary leverage, I prefer a difficult upstream question that unlocks the field to an easy downstream one that merely refines it. **Neglectedness** is the tiebreaker, though the Symmetry Thesis framing already ensures we are targeting underexplored terrain.

  Where these criteria pull apart, Upstreamness dominates. There is no value in calculating the optimal aggregation method for an infinite horizon (high tractability) if we determine that pure time preference is justified by a fundamental time-space asymmetry (which would render the infinite horizon irrelevant due to discounting).

  ### Research Agenda

  **1. The Ontological Status Question: Do future persons and distant persons share the same mode of existence?**
  The Symmetry Thesis collapses if future people are ontologically distinct from distant people. Distant strangers exist *now*, merely located elsewhere; future people do not exist *now*, located later. This is not a semantic quibble; it is the bedrock of the "non-identity" intuition. If existence is time-indexed but not space-indexed, then a pure time preference might be a proxy for a preference for the existent over the non-existent, whereas a pure spatial preference would be a preference for the near-existent over the far-existent. This research must determine whether "existence" is a binary property possessed at a time or a property possessed simpliciter. If the latter, the symmetry holds; if the former, the symmetry breaks. This is the most upstream question because it determines whether the analogy is a category error or a profound moral insight.

  **2. The Partiality Transfer: Does the permissibility of spatial partiality justify temporal partiality, or does the impermissibility of temporal partiality condemn spatial partiality?**
  Assuming the ontology aligns (Question 1), we must test the normative force of the analogy. Most people accept some spatial partiality (favoring compatriots or neighbors) but reject pure time preference (favoring the present generation). The Symmetry Thesis forces a dilemma: either both are permissible or both are impermissible. This project must analyze the standard defenses of spatial partiality (e.g., efficacy of aid, social contract reciprocity, epistemic access) and test if they translate to the temporal case. Conversely, it must test if the moral arguments against pure time preference (e.g., the arbitrariness of date) apply to space. This is high-impact because it directly dictates the "pure" term in the social discount rate. If spatial partiality is rejected as morally arbitrary, pure time preference must be zero; if spatial partiality is accepted, a positive pure time preference may be defensible.

  **3. The Non-Identity Asymmetry: Is there a spatial analog to the claim that our actions determine *who* comes into existence?**
  The non-identity problem suggests we cannot harm future people by actions that are necessary conditions for their existence, as they would not otherwise exist. Does a spatial analog exist? Does moving to a different location change *which* distant people exist? Likely not; distant people's identities are fixed by their past, which is causally independent of our current location. If this asymmetry is robust, it suggests that while we might have duties to distant people not to harm them, our duties to future people are complicated by the fact that we create them. This question is downstream of Question 1 but upstream of population ethics. If the asymmetry holds, it suggests that intergenerational ethics requires a different framework (population ethics) than international ethics (distributional justice), potentially allowing for different discounting rules despite the Symmetry Thesis.

  **4. The Aggregation Boundary: Does the finitude of space offer a solution to the infinity of time?**
  If Questions 1 and 2 lead to rejecting pure time preference, we face the "Infinity Problem": an endless stream of future utility swamps any present cost. Space, however, is presumably finite. This research should investigate whether formal methods used to handle unbounded spatial domains (e.g., averaging over regions rather than summing, or discounting by causal reach rather than distance) can be adapted to the temporal case. This is the most tractable question, relying on formal and conceptual tools rather than metaphysical adjudication. It is ranked last because it is only relevant if we reject discounting; however, it is a necessary "exit ramp" for the program, ensuring that a conclusion of "zero discount rate" does not lead to paralysis or absurdity in decision-making.

  ### Dependencies

  *   **Question 1 is the root.** If future and distant persons are ontologically distinct, the Symmetry Thesis fails, and the agenda pivots to standard intergenerational ethics without the spatial constraint. If they are ontologically similar, we proceed to Question 2.
  *   **Question 2 depends on Question 1.** It applies the normative test only if the metaphysical analogy holds. Its outcome determines the value of the pure time preference parameter (zero or positive).
  *   **Question 3 modifies Question 2.** Even if the general symmetry holds, a specific asymmetry regarding identity formation might carve out an exception for population-affecting choices, distinguishing "standard" discounting from "existential" discounting.
  *   **Question 4 is conditional on Question 2.** It is only necessary if Question 2 results in a near-zero pure time preference. If a positive time preference is justified, the infinite horizon is mathematically tamed by the discount rate, making this question less urgent.

  ### Redirection Triggers

  Over the next two years, I would redirect funding based on the following developments:

  *   **Move Question 1 Down / Question 3 Up:** If a consensus emerges that the ontological asymmetry is undeniable (e.g., a robust defense of "presentism" in metaphysics), the Symmetry Thesis loses its bite. In this case, the Non-Identity problem (Question 3) becomes the primary bottleneck, as it is the remaining major philosophical barrier to long-term obligation.
  *   **Move Question 4 Up:** If a paper demonstrates that even with a positive pure time preference, the uncertainty regarding the *duration* of the future (risk of extinction) creates effective infinite aggregation problems, then the technical formalism of Question 4 becomes upstream of the normative debates.
  *   **Cancel Question 2:** If a decisive argument appears showing that spatial partiality is *obligatory* (not merely permissible) due to the structure of agency (e.g., one can only act locally), then the "arbitrariness" argument against time preference collapses. We would then shift funds to defining the *limits* of that partiality rather than debating its existence.

  ### Note on "Red Herrings"

  You mentioned the distinction between pure time preference and growth/uncertainty components. Under the Symmetry Thesis, this distinction is clarified rather than researched. Uncertainty about the future is analogous to uncertainty about distant places; economic growth is analogous to wealth disparities between regions. Neither justifies a *pure* time preference any more than they justify a *pure* spatial preference. Therefore, I have not included this as a standalone question; it is treated as a conceptual prerequisite. The grant should not fund work merely separating these terms, but work that uses the Symmetry Thesis to show why the "pure" term is the only morally relevant one for intergenerational equity.
