      *   **Goal:** Create a defended research agenda for a small grant program (5 researchers, 2 years) on the philosophy of intergenerational discounting.
      *   **Core Topic:** Pure time preference, social discount rate, weighting of the far future.
      *   **Constraint 1 (Ordering Grounds):** Must explicitly state grounds for ordering: Upstreamness (dependency), Tractability (conceptual/formal tools), Neglectedness, and Impact (action-guiding). Must explain trade-offs between these criteria.
      *   **Constraint 2 (Symmetry Thesis):** Must treat the "Symmetry Thesis" (Pure Time Preference $\approx$ Pure Spatial Preference) as a live constraint. The agenda must explore questions that arise when time and space must be defended together. Must flag genuine asymmetries vs. hand-waving.
      *   **Scope:** Can include population ethics, non-identity problem, infinite aggregation, etc., but shouldn't be constrained by them.
      *   **Output Format:** Ranked list of 4-6 questions, paragraph defense for each, account of dependencies, closing note on triggers for redirection.
      *   **Tone/Style:** Argumentative, rigorous, no literature citations (argue from ideas), prioritize reasoning over breadth.

  2.  **Deconstruct the Symmetry Thesis:**
      *   *Thesis:* Valuing $X$ less because it happens at $t+10$ vs $t$ is structurally identical to valuing $X$ less because it happens to person $B$ (distance $d+10$) vs person $A$ (distance $d$).
      *   *Implication:* If spatial discrimination is morally arbitrary (cosmopolitanism), temporal discrimination is too (longtermism). If spatial discrimination is permissible (partiality to neighbors), temporal discrimination might be too (partiality to present).
      *   *Challenge:* Most defenses of time preference (uncertainty, growth, relationship) fail when applied to space.
      *   *Potential Asymmetries:* Causality flows forward, not backward (usually). Identity depends on past actions (non-identity), not usually on spatial location. Existence itself might be time-indexed in a way it isn't space-indexed.

  3.  **Brainstorming Candidate Questions:**
      *   *Q1:* Is pure time preference rational/ethical per se? (Too broad).
      *   *Q2:* Does the Symmetry Thesis hold? Are there robust asymmetries? (Central to the prompt).
