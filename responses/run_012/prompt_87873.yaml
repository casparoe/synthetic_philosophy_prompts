          3.  **The Non-Identity Analog:** Contingency of Existence vs. Contingency of Location.
          4.  **The Aggregation Boundary:** Infinite Time vs. Finite Space.

      *   *Wait, one more check on the "Trustee's Framing".* The trustee wants to know if standard defenses survive the pairing.
