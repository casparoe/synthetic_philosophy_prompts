      *   *Criterion Weighting:* Upstreamness is king. If a question determines the answers to others, it goes first. Impact is second (must change policy/philosophy). Tractability is third (can 5 researchers actually make progress?). Neglectedness is fourth (though the Symmetry Thesis is somewhat neglected, the specific angles might not be).
      *   *Selection:*
          1.  **The Robustness of the Symmetry Thesis:** This is the prompt's core constraint. If this fails, the rest of the agenda shifts. It's highly upstream.
          2.  **The Separability of Pure Time Preference from Uncertainty/Growth:** Standard economics conflates these. Philosophy needs to isolate the *pure* term. Upstream of policy.
          3.  **Population Ethics under Symmetry:** If we owe the future as much as distant strangers, do we owe them existence? This combines symmetry with population ethics. High impact.
          4.  **Aggregation over Infinite Horizons:** If discounting is low/zero, infinite utility looms. This is a technical blocker.
          5.  **The Normative Status of "Present Bias" vs. "Here Bias":** Psychological/Agency focus.

      *   *Refining for the "Symmetry Thesis" Constraint:* I need to make sure the questions aren't just general discounting questions, but specifically filtered through the Time/Space analogy.
