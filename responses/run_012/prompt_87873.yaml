      *   *Q4:* How do we handle infinite horizons/aggregation? (Technical but important).
      *   *Q5:* What is the relationship between descriptive discounting (market rates) and normative discounting? (Maybe too empirical/economic).
      *   *Q6:* Does the non-identity problem dissolve the obligation to the future? (Classic, but maybe solved?).
      *   *Q7:* Can we separate "uncertainty/growth" from "pure time preference" rigorously? (Ramsey equation stuff).
      *   *Q8:* If symmetry holds, does it imply radical obligations to the future or radical permission to ignore distant strangers? (The "reductio" check).

