  5.  **Drafting the Defenses (incorporating the criteria):**

      *   *Q1 (Asymmetries):* Focus on causality and identity. Is there a *structural* difference? If not, the burden of proof shifts massively.
      *   *Q2 (Pure Time Preference Defense):* Assuming symmetry, can we defend *both* spatial and temporal partiality? Or must we reject *both*? This is the "action-guiding" pivot.
