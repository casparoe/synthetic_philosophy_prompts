          2.  **The "Partiality Permission" Transfer:** If spatial partiality is okay, is temporal? (Impact/Action-guiding).
          3.  **Non-Identity and Spatial Counterparts:** (Specific philosophical hurdle).
          4.  **Infinite Aggregation and Spatial Unboundedness:** (Technical/Formal).

      *   *Wait, let's look at the "Upstream" requirement again.*
          *   If Symmetry holds $\rightarrow$ Pure Time Preference is unjustified (unless Spatial Preference is).
          *   If Pure Time Preference is unjustified $\rightarrow$ Social Discount Rate drops.
          *   If SDR drops $\rightarrow$ Far Future weighs heavily.
          *   If Far Future weighs heavily $\rightarrow$ Population Ethics matters immensely.
          *   If Population Ethics matters $\rightarrow$ Infinite Aggregation matters.
