answer: |-
  Right, four months is a tight window for a conceptual overhaul, so we need to be ruthless about what gets cut. You're at Leeds, so the expectation will be rigorous normative work rather than socio-legal empiricism. Given that constraint, your two threads are excellent, but I think you've got the order of operations slightly wrong. If you start with the temporal dimension (Thread 1) without settling the constitutive nature of consent (Thread 2), you risk building a theory of duration on shaky foundations.

  Here is how I would prioritise the open questions, ordered by logical dependency and tractability within a single research leave.

  ### 1. The Upstream Question: What Work is Consent Doing? (Thread 2)
  **Priority:** First.
  **Reasoning:** This is logically upstream of everything else. You cannot determine when standing consent *lapses* until you know what consent *is* supposed to achieve. Is consent primarily a mental state that transfers a moral power (the Will Theory)? Is it a communicative act that provides assurance to the recipient (the Assurance View)? Or is it a normative transformation of the relationship itself?

  If consent is a mental state, then 'standing consent' is simply a persistent mental state. If it is a communicative act, 'standing consent' requires a mechanism by which a past utterance retains normative force over time. This distinction dictates whether lapse is a psychological event (I changed my mind) or a normative one (the assurance has expired).

  **Tractability:** High. This is pure conceptual analysis. You can rely on existing literature (Hurd, Alexander, Wertheimer, maybe MacKenzie for the relational angle) without needing empirical data.
  **Substantiveness:** High. This avoids the terminological trap of 'agreement vs. authorisation'. Don't get bogged down in labels; focus on the *normative consequence*. Does getting the label wrong change who is liable for a wrong? If not, it's semantics. If it changes whether the doctor is a batterer or a healer, it's substantive.
  **Move Up/Down:** Move this *down* if you find the literature is simply too entrenched to shift in four months. Move it *up* (and spend more time) if you find that the 'lapse' problem dissolves once you adopt a specific functional view (e.g., if consent is a promise, it persists until released).

  ### 2. The Core Contribution: The Normative Mechanics of Lapse (Thread 1)
  **Priority:** Second.
  **Reasoning:** Once you've fixed the function, you can tackle your primary intuition: that validity lapses quietly when facts drift. This is where your novel contribution lies. The standard checklist model treats consent as a snapshot; you want to model it as a trajectory. The key question here is not 'when does it expire?' but 'what creates the expiry?'

  Is it the passage of time? A change in the material facts? A change in the consenter's values? You need to argue for a 'duty of refreshment' or a 'presumption of continuity'. This is the meat of the project.

  **Tractability:** Moderate. It requires careful case construction (longitudinal research vs. ongoing medical treatment vs. sexual relationships) to test the boundaries. You must avoid empirical questions like 'how long do patients *feel* consent lasts?' and stick to 'how long *ought* it to last given the function established in Step 1?'
  **Substantiveness:** Very High. This challenges the legal and bioethical status quo directly. If you can show that standing consent creates a duty on the *consenter* to signal revocation (in certain contexts), that shifts the burden of responsibility significantly.
  **Move Up/Down:** Move this *down* if it becomes contingent on empirical facts (e.g., 'it depends on the risk profile of the procedure'). Keep it normative. Move it *up* if you realise the 'function' question (Step 1) is a rabbit hole and the real philosophical payload is in the temporal norms.

  ### 3. The Downstream Application: Inner State vs. Communicative Performance (Thread 2, revisited)
  **Priority:** Third.
  **Reasoning:** I've moved this to the end because it often acts as a distractor. The 'inner vs. outer' gap is only problematic if we think the primary purpose of consent is to track the authentic will of the agent. If, as I suspect you'll argue in Step 1, consent is partly about allocating risk and providing assurance to the actor, then the 'inner state' matters less than the 'reasonable reliance' on the performance.

  This question should serve as a stress test for your theory of lapse. If someone inwardly revokes but doesn't communicate it, does the standing consent hold? Your answer should flow from Step 1 and 2, not be decided independently.

  **Tractability:** High, but risky. It's easy to get stuck in philosophy of mind puzzles.
  **Substantiveness:** Moderate. It matters for liability, but less than the temporal question for the specific problem of 'standing consent'.
  **Move Up/Down:** Move this *up* only if you encounter a 'hard case' where the inner/outer gap creates a paradox your theory of lapse cannot solve (e.g., covert coercion over time).

  ### A Note on Your Starting Point
  Your framings are sound, but I would caution against the 'agreement or authorisation' distinction in Thread 1. That is a terminological quagmire that often yields little normative light. Instead, frame it as **'transactional vs. relational normativity'**.

  Also, be careful with the 'quiet lapse' intuition. It's powerful, but it risks collapsing into a 'duty to revoke' which can be victim-blaming in contexts of power asymmetry (like domestic relationships). You need to build a safeguard into the theory that distinguishes between a research cohort (where quiet lapse might be manageable) and a marriage (where it might not).

  ### Dynamic Adjustment: What Changes the Plan?
  As you work through the four months, use these triggers to reprioritise:

  1.  **The Legal Reality Check:** If you discover that contract law or tort law already has a settled doctrine on 'ongoing authorisation' that solves your problem, pivot. Don't reinvent the wheel; analyse the philosophical justification of the legal rule. Move Step 1 *down* if the law provides the functional answer.
  2.  **The Empirical Wall:** If you find yourself constantly asking 'but what would the agent actually know?', stop. You have no empirical training. Reframe the question as 'what ought the agent to have known?' Move Step 2 *down* if it requires psychological data.
  3.  **The Supervisory Moan:** If your supervisor thinks you're drifting into meta-ethics, pull back to applied normative theory. Keep the examples concrete (clinical trials, long-term care).

  ### Summary of the Strategy
  Spend the first month locking down the **Function** (Thread 2). You can't build a clock without knowing what time is. Spend the next two months on the **Mechanics of Lapse** (Thread 1). That is your unique selling point. Spend the final month stress-testing with the **Inner/Outer gap** (Thread 2) to ensure your theory handles deception and silence correctly.

  This order ensures that every claim you make about time or communication is grounded in a prior commitment about what consent is *for*. It keeps the project unified, conceptually rigorous, and deliverable within the term.

  Good luck with the leave. Leeds is a strong environment for this sort of work; just keep the British spelling in the drafts and you'll avoid the obvious niggles.
