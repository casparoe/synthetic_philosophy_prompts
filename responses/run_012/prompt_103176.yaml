answer: |-
  # Sustainability Initiative Viability Protocol (SIVP)

  **Owner:** Ethics & Compliance  
  **Approvers:** CFO, Works Council Chair, Sustainability Committee Lead  
  **Purpose:** To evaluate employee-facing sustainability proposals consistently, addressing the objection that "individual acts make no difference" while protecting the firm from undue cost or coercion.  
  **Time Limit:** 30 Minutes per proposal.

  ---

  ## Part 1: The "Drop in the Bucket" Check
  *Addresses the objection: "One person's change makes no measurable difference."*

  **Question 1:** Does the proposal rely on the idea that if this specific employee (or the firm) does not act, the harm will definitely not happen?
  *   **Yes:** **STOP.** Reject proposal. (The proposal relies on false causality).
  *   **No:** **PROCEED.** (Acknowledge that the harm may occur regardless, but the act is still evaluable under Part 2).

  ---

  ## Part 2: Harm Classification & Testing
  *Identify the primary type of harm addressed. Select **one** path.*

  ### Path A: Cumulative Impact (Additive Harm)
  *Examples: Carbon emissions, water waste, single-use plastics.*

  **Q2.1:** Is this act part of a larger pattern where many similar acts cause documented harm?
  *   **No:** **STOP.** Reject proposal. (No collective harm exists).
  *   **Yes:** **Proceed to Q2.2.**

  **Q2.2:** Is there a realistic alternative way to achieve the same business or personal outcome without this harm?
  *   **No:** **STOP.** Reject proposal. (No alternative exists).
  *   **Yes:** **Proceed to Part 3.**

  ### Path B: Tipping Point (Threshold Harm)
  *Examples: Elections, safety reporting quotas, climate tipping points.*

  **Q2.3:** Does this act move the group measurably closer to or further from a critical limit (e.g., 50% turnout, safety incident cap)?
  *   **No:** **STOP.** Reject proposal. (Act has no bearing on the threshold).
  *   **Yes:** **Proceed to Q2.4.**

  **Q2.4:** Can the firm coordinate this action without violating privacy, neutrality, or law?
  *   **No:** **STOP.** Reject proposal. (Coordination is not feasible/compliant).
  *   **Yes:** **Proceed to Part 3.**

  ### Path C: System Participation (Constitutive Harm)
  *Examples: Buying from unethical supply chains, endorsing discriminatory policies.*

  **Q2.5:** Does this act directly support or express participation in a practice the firm publicly rejects?
  *   **No:** **STOP.** Reject proposal. (No conflict with firm values).
  *   **Yes:** **Proceed to Q2.6.**

  **Q2.6:** Can the employee or firm withdraw from this practice without losing essential function?
  *   **No:** **HAND-OFF.** (Go to Part 3, Question 3.3).
  *   **Yes:** **Proceed to Part 3.**

  ---

  ## Part 3: The Feasibility & Cost Gate
  *Required for all paths. Protects CFO and Works Council interests.*

  **Q3.1 (Financial):** Does implementing this alternative impose a direct cost greater than 5% of the relevant department budget or reduce projected revenue?
  *   **Yes:** **HAND-OFF to CFO.** (Requires financial waiver).
  *   **No:** **Proceed.**

  **Q3.2 (Labor):** Does this require employees to change behavior during non-work hours or impose monitoring on personal choices?
  *   **Yes:** **HAND-OFF to Works Council.** (Requires labor agreement).
  *   **No:** **Proceed.**

  **Q3.3 (Disproportionate Burden):** Does withdrawing from this practice prevent the employee from doing their core job or accessing essential amenities (e.g., food, transport)?
  *   **Yes:** **STOP.** Reject proposal. (Burden is disproportionate).
  *   **No:** **APPROVE.** (Proposal meets ethical and operational standards).

  ---

  ## Part 4: Known Limitations & Misfire Points
  *This procedure is not perfect. Signatories acknowledge the following:*

  1.  **The "Small Number" Misfire:** In Path A (Cumulative), if the firm is very small, the procedure may approve actions that have negligible global impact. This is accepted to build internal culture, even if external impact is low.
  2.  **The "Value Hand-Off":** Questions 3.1 and 3.3 involve value judgments (what is "essential"? what is "disproportionate"?). The Compliance Lead cannot decide these alone. They require the CFO or Works Council to exercise judgment. The procedure **cannot settle the matter** if these parties disagree.
  3.  **The "Political Neutrality" Trap:** In Path B (Threshold), the procedure will likely block corporate involvement in national politics. The Sustainability Committee may find this unwelcome, but it is required to maintain firm neutrality and comply with election laws.

  ---

  ## Part 5: Application to Current Proposals

  ### Proposal 1: Removing Beef from the Cafeteria
  *   **Classification:** Path C (System Participation). Industrial meat production is a practice the firm's sustainability policy rejects.
  *   **Test (Q2.5):** Does buying beef support a rejected practice? **Yes.**
  *   **Test (Q2.6):** Can we withdraw without losing essential function? **Yes.** (Other proteins exist).
  *   **Gate (Q3.1):** Cost impact? **No.** (Substitution cost is neutral).
  *   **Gate (Q3.3):** Disproportionate burden? **No.** (Employees can still eat).
  *   **Result:** **APPROVE.**
  *   **Note:** This aligns with Committee goals. The "It happens anyway" objection is overridden by the Constitutive test (we are not participating in the system, regardless of total market demand).

  ### Proposal 2: Asking Employees to Vote in a National Election
  *   **Classification:** Path B (Tipping Point). Elections are threshold events.
  *   **Test (Q2.3):** Does voting move the group closer to the threshold? **Yes.**
  *   **Test (Q2.4):** Can the firm coordinate this without violating privacy/neutrality? **No.**
      *   *Reasoning:* To verify the "move toward threshold," the firm would need to track voting behavior, which violates privacy. To encourage voting without appearing partisan is legally risky in many jurisdictions.
  *   **Result:** **STOP / REJECT.**
  *   **Note:** The Sustainability Committee will find this unwelcome. They view voting as a civic good. However, the procedure flags this as a compliance risk. The firm cannot validate the benefit without intruding on employee rights. This defends the Works Council's position.

  ### Proposal 3: Ten Percent Reduction in Business Air Travel
  *   **Classification:** Path A (Cumulative Impact). Emissions are additive.
  *   **Test (Q2.1):** Is this part of a harmful pattern? **Yes.** (Climate change).
  *   **Test (Q2.2):** Is there a realistic alternative? **Conditional.** (Video conferencing exists).
  *   **Gate (Q3.1):** Cost impact? **Yes.**
      *   *Reasoning:* Engineering contracts require on-site site surveys for liability and safety. A blanket 10% cut will result in lost bids or contract breaches.
  *   **Gate (Q3.3):** Disproportionate burden? **Yes.**
      *   *Reasoning:* Preventing travel prevents engineers from performing core duties (site inspection).
  *   **Result:** **STOP / REJECT.**
  *   **Note:** The Sustainability Committee will find this unwelcome. They argue "every flight counts." The procedure requires that result because the "Available Alternative" (video) is not *business-viable*. The framework does not demand self-sabotage. This validates the CFO's objection using ethical language: requiring an act that prevents core business function is a disproportionate burden.

  ---

  ## Sign-Off

  By signing below, the Approvers agree to use this procedure for all employee-facing sustainability mandates for the next fiscal year.

  **Ethics & Compliance Lead:** ___________________  
  **Chief Financial Officer:** ___________________  
  **Works Council Chair:** ___________________  
  **Sustainability Committee Lead:** ___________________
