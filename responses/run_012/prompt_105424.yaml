prompt: |-
  I teach a second-year moral philosophy seminar (16 students, 80 minutes, ordinary classroom with movable chairs) and the unit on promises is the one that never lands. They can all recite that you shouldn't break promises, but when I push on *why* the obligation is there they either say "because people rely on you" or "because society would fall apart," and neither of those gets at what I actually find puzzling. What I want is an activity where they run into the puzzle themselves instead of hearing me describe it. The puzzle, roughly: the moment you say "I promise," you seem to have changed your own normative situation in a way that doesn't obviously depend on whether anyone was counting on you, whether anyone finds out, whether keeping it still does anyone any good, or even on whether the other person still wants you to do it. Most explanations make the obligation come from something outside the promise itself -- expectations, reciprocity, the general usefulness of the institution -- and I want them to feel the bit that won't fit into any of those, and also feel how tempting it is to keep explaining it that way anyway.

  So: design a runnable thing for that room. I'd like it built around making real commitments to each other with small non-monetary stakes (points, tokens, privileges, whatever works without cash), arranged so that in the first phase keeping your word is fully explained by reciprocity and by everyone watching -- and then, in later phases, one by one, you strip those supports away: a round where the choice is completely private and the other person will never learn what you did; a round where the promisee comes back and says they no longer care, or actively wishes you'd do the opposite; a round where the person you promised is out of the picture entirely. I want to see at which point they still feel the pull and at which point they stop, and I want them arguing about it. Give me the rules, materials, the payoff scheme, the sequence of phases, timing for 80 minutes, and roles if you need a facilitator or a couple of scripted players.

  Then a debrief that maps what actually happened onto the underlying disagreement -- the family of views that treat the obligation as generated by a social practice and the mutual expectations it creates, versus the family that treats the promise as handing the promisee some kind of standing or authority over what you do, so that only they can let you off the hook -- and that flags the trap where someone keeps a promise only because breaking it would make them feel like a rat, which might be a different thing from the promise binding. Also tell me honestly what this setup can't reproduce and that I'll have to supply some other way (I suspect promises to people who are dead, and promises to yourself, are both going to be impossible to stage, but say what else). And what predictably goes wrong the first time I run it -- my guess is that at least one group turns the whole thing into a bargaining game and stops caring about the promises at all, but tell me what else to expect and how to handle it.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** 2nd-year moral philosophy seminar, 16 students, 80 minutes, movable chairs.
      *   **Topic:** The obligation of promises (specifically, the *source* of the obligation).
      *   **Problem:** Students give standard utilitarian/social contract answers ("reliance," "social utility") but miss the deontological/internalist puzzle (the *performative* change in normative status).
      *   **Goal:** An activity where students *experience* the puzzle, not just hear about it.
      *   **Key Mechanism:** A multi-phase game involving real commitments (points/tokens) where external supports (visibility, reliance, benefit to promisee) are stripped away one by one.
      *   **Requirements:** Rules, materials, payoff scheme, sequence, timing, roles, debrief (mapping to theories), limitations (what the setup can't do), and troubleshooting (predictable failures).

  2.  **Deconstruct the Philosophical Puzzle:**
      *   *The Intuition:* "I promised" creates an obligation even if:
          *   No one relies on it (Secret Promise).
          *   No one knows I broke it (Private Breach).
          *   The promisee doesn't want it anymore (Release).
          *   It produces no net good (Futile Promise).
      *   *The Competing Explanations:*
          *   *Expectation/Reliance (Scanlon-ish/Utilitarian):* Obligation exists because of harm to expectations.
          *   *Social Practice (Rawls/Rule Utilitarian):* Obligation exists to sustain the institution.
          *   *Authority/Will Theory (Shiffrin/Classic Deontology):* The promisee gains authority over the promisor's will.

  3.  **Design the Activity ("The Promise Game"):**
      *   *Constraint:* 80 minutes is tight. 16 students is a good size for 4 groups of 4 or 8 pairs. Pairs are better for direct promise dynamics. Let's go with 8 pairs.
      *   *Currency:* "Philosophy Points" (PP) redeemable for something trivial but desirable (e.g., homework pass, choose the next topic, candy, or just bragging rights/grade bump points if allowed). Let's use "Course Credit Points" (CCP) or just tangible tokens redeemable for candy/privilege to keep it low stakes but real. Let's say "Tokens" redeemable for a small prize at the end.
      *   *Structure:* Needs phases that isolate variables.
          *   Phase 1: Public, Mutual Benefit (Baseline).
          *   Phase 2: Private Action (Secrecy).
          *   Phase 3: Release/Changed Mind (Authority).
          *   Phase 4: Third Party/No Benefit (Futility).
      *   *Refinement:* To make it fit 80 mins, we can't do 4 full rounds of a complex game. We need a streamlined "Contract & Choice" mechanic.
      *   *Mechanic:* Pair up. Partner A makes a promise to Partner B to perform a task (or sacrifice points) in exchange for B doing something later, OR simply A promises to give B tokens later.
      *   *Better Mechanic:* "The Token Transfer."
          *   A has 10 tokens. B has 0.
          *   A promises to give B 5 tokens at the end.
          *   B can perform a task to generate value *if* they trust A.
          *   *Wait, the prompt asks for stripping supports.*
          *   Let's try a "Secret Choice" matrix.
          *   Actually, a "Promise & Release" structure is more direct for the specific puzzle.
          *   *Revised Plan:* 3 Rounds. Each round changes the conditions.
          *   *Round 1 (Public/Reliance):* A promises B. B relies. A chooses Keep/Break. Payoffs visible.
          *   *Round 2 (Secret):* A promises B. A chooses Keep/Break. B *never knows* the choice. (Tests reputation/guilt vs. obligation).
          *   *Round 3 (Release):* A promises B. Before A acts, B says "I release you" or "I prefer you don't." (Tests Authority vs. Welfare).

      *   *Logistics:* 16 students = 8 pairs.
      *   *Materials:* Envelopes (for secrecy), Tokens (poker chips or paper slips), Decision Sheets.
      *   *Timing:*
          *   Intro: 10 min.
          *   Round 1: 15 min.
          *   Round 2: 15 min.
          *   Round 3: 15 min.
          *   Debrief: 25 min.
          *   Buffer: 10 min.

  4.  **Developing the Payoff Scheme:**
      *   Needs to tempt breaking the promise but reward keeping it *if* the other conditions hold.
      *   If A keeps promise: A gets 2, B gets 5.
      *   If A breaks promise: A gets 5, B gets 0.
      *   This creates a Prisoner's Dilemma-ish tension where breaking is individually rational unless the promise binds.

  5.  **Refining the Phases for the Specific Puzzle:**
      *   *Phase 1 (The Institution):* Public. If A breaks, everyone knows. B relies. (Tests Social/Reputation).
      *   *Phase 2 (The Secret):* A puts decision in sealed envelope. B never sees it. Instructor collects. (Tests Internal Obligation vs. Reputation).
      *   *Phase 3 (The Release):* A promises. B says "I don't want this anymore, keep your tokens." A must decide whether the obligation persists despite B's waiver. (Tests Authority Theory).

  6.  **Drafting the Debrief:**
      *   Map behaviors to theories.
      *   *Social Practice:* "I kept it in Round 2 because what if everyone did that?"
      *   *Will/Authority:* "In Round 3, I felt I couldn't do it because she told me not to," OR "I felt I still had to because I said I would."
      *   *The "Rat" Trap:* Distinguish between "I am bound" and "I will feel guilty."

  7.  **Identifying Limitations:**
      *   Dead people (can't release).
      *   Self-promises (no second party).
      *   Triviality (tokens aren't real life).
      *   Artificiality (they know it's a class).

  8.  **Predicting Failures:**
      *   *Cynicism:* "It's just a game, I maximize points." -> Need to frame it as a *moral* experiment, not just game theory.
      *   *Collusion:* "We'll all split the pot." -> Randomize pairings or emphasize individual choice.
      *   *Confusion:* Instructions too complex. -> Keep sheets simple.

  9.  **Review against Constraints:**
      *   80 mins? Yes, tight but doable.
      *   16 students? Yes, 8 pairs.
      *   Movable chairs? Yes, pair up.
      *   No cash? Tokens/Points.
      *   Specific philosophical goal? Yes, isolating the source of obligation.

  10. **Final Polish:**
      *   Make the instructions crisp.
      *   Ensure the "Release" round is clear (does the promise vanish if the beneficiary waives it?).
      *   Add a "Facilitator Script" for the instructor to maintain the frame.
      *   *Self-Correction on Round 3:* If B releases A, and A keeps the promise anyway, does that prove the obligation is internal? Or just stubbornness? Need to frame the payoff so that *listening to B* is the alternative moral pull. Actually, the puzzle is: If B says "I release you," are you *permitted* to break it? If you feel you *must* still do it, that's the Will Theory (you transferred authority, but maybe you can't take it back? No, Will Theory says they can release you).
      *   *Correction:* The Will Theory says the promisee has authority. So if they release you, the obligation *ends*. The Social Practice theory might say the obligation *remains* because the institution matters more than the individual waiver.
      *   *Wait, let's look at the prompt's specific puzzle:* "even on whether the other person still wants you to do it."
      *   Okay, so if B says "I don't want this," and A feels *still bound*, that supports the idea that the promise created a freestanding duty (maybe to the moral law, or to one's own integrity) rather than a duty *to B*.
      *   Actually, the classic "Will Theory" (Hart) says the promisee has control. So if they release, duty ends.
      *   The "Reliance Theory" says if they don't rely (because they said they don't want it), duty ends.
      *   So where is the puzzle? The puzzle is often that we feel bound *even if* it harms the promisee or they don't want it (e.g., "I promised to meet you for lunch" but you're sick and want me to stay home. I feel I should come because I promised, but you say don't come.")
      *   *Better Round 3:* B says "I release you." A decides. If A keeps the promise despite release, why? (Integrity/Self-binding). If A breaks, why? (Authority of B).
      *   *Actually, let's stick to the prompt's specific phrasing:* "whether the other person still wants you to do it."
      *   Okay, I will design Round 3 as "The Waiver." B explicitly waives the right. A chooses.
      *   *Wait, one more nuance:* The prompt mentions "whether keeping it still does anyone any good." This is the "Futile Promise" case.
      *   Maybe combine Waiver + Futility. B says "I don't want this, and it helps no one."
      *   Okay, I have the structure. Now to write it out clearly.

  11. **Final check on "The Trap":** The prompt asks to flag the trap where someone keeps a promise only because breaking it makes them feel like a rat (psychological cost) vs the promise binding (normative force). I need to ensure the debrief hits this hard.

  12. **Final check on "What goes wrong":** Students treating it as a pure game. I need to add a "Frame" instruction to the professor to prevent this.

  13. **Writing the response.** (Proceeding to generate output based on these thoughts).
answer: |-
  This is a classic pedagogical problem in moral philosophy: students conflate the *reasons* we generally have for keeping promises (social utility, reliance) with the *source* of the specific obligation (the performative act itself). To get them to feel the gap, you need an experiment that isolates the variables they rely on (reputation, reliance, benefit) and removes them sequentially.

  Here is a complete lesson plan designed for your constraints.

  # Activity: The Token Protocol

  **Class Size:** 16 Students (8 Pairs)
  **Time:** 80 Minutes
  **Materials:**
  *   32 Envelopes (small, sealable).
  *   160 Tokens (poker chips, laminated cards, or distinct candies).
  *   3 Sets of "Decision Sheets" (colored paper: Green, Blue, Red).
  *   A "Redemption Menu" projected on the board (e.g., 10 tokens = homework pass; 5 tokens = choose next reading; 20 tokens = final grade bump of 1% if policy allows, otherwise a nice gift card). *Crucial: The rewards must be desirable enough to create temptation.*

  ## Part 1: Setup & Framing (10 Minutes)

  **Room Arrangement:** Move chairs into 8 pairs. Pairs should be slightly separated to prevent overhearing, but visible to you.

  **The Frame:**
  Do not introduce this as a "game." Introduce it as a **Normative Simulation**.
  *   **Script:** "We are going to run three rounds of exchanges. In each round, one of you is the **Promisor (A)** and one is the **Promisee (B)**. You will receive tokens. Your goal is to end with as many tokens as possible, *subject to the constraints of the commitments you make*. I am not asking you to maximize points mathematically; I am asking you to act as you think a moral agent *should* act in these specific conditions. If you treat this purely as a math puzzle, you will miss the data we need."

  **Initial Endowment:**
  *   Give every **Promisor (A)** 10 Tokens.
  *   Give every **Promisee (B)** 0 Tokens.

  **The Basic Contract:**
  *   **A** may choose to transfer 5 Tokens to **B**.
  *   **If A transfers:** A keeps 5, B gets 5. (Total pair value: 10).
  *   **If A keeps all:** A keeps 10, B gets 0. (Total pair value: 10).
  *   *The Twist:* Before A decides, A must verbally state: "I promise to transfer 5 tokens to you."

  ---

  ## Part 2: The Three Rounds (45 Minutes Total)

  *Run these rounds sequentially. Collect all envelopes/sheets between rounds. Shuffle pairings if possible, or keep them static (Static is better for building tension).*

  ### Round 1: The Public Institution (15 Minutes)
  **Condition:** Transparency & Reliance.
  1.  **A** says to **B**: "I promise to transfer 5 tokens."
  2.  **B** hears this. **B** is told: "You may now rely on this. If you believe A, you can sign a sheet that gives A a +2 bonus token *if* they keep the promise. If they break it, you get nothing." (This simulates reliance creating mutual benefit).
  3.  **A** writes decision on **Green Sheet**: [KEEP] or [BREAK].
  4.  **A** places sheet in envelope, seals it, and hands it to **B**.
  5.  **B** opens it immediately. Tokens are transferred publicly.
  6.  **Instructor:** "Raise your hand if you broke the promise." (Record on board).

  *Philosophical Load:* This is the baseline. Reputation, social pressure, and mutual benefit are all active. Most will KEEP.

  ### Round 2: The Secret Breach (15 Minutes)
  **Condition:** Secrecy (Removing Reputation/Sanction).
  1.  Reset tokens (A gets 10, B gets 0).
  2.  **A** says to **B**: "I promise to transfer 5 tokens."
  3.  **A** writes decision on **Blue Sheet**: [KEEP] or [BREAK].
  4.  **A** places sheet in envelope, seals it.
  5.  **Crucial Rule:** **A** hands the envelope to the **Instructor**, not B. **B will never know what A chose.** B receives a flat 2 tokens regardless of A's choice (to remove reliance/harm).
  6.  **Instructor:** "No one will ever know your choice. Not me, not your partner. The envelopes will be shredded after grades are posted. You are alone with your choice."
  7.  Collect envelopes. Do not open them yet.

  *Philosophical Load:* Reliance is removed (B gets 2 either way). Reputation is removed (no one knows). If they KEEP, why? Is it internal obligation? Or fear that you (the prof) are lying about the shredding?

  ### Round 3: The Waiver (15 Minutes)
  **Condition:** Authority & Release (Removing the Promisee's Will).
  1.  Reset tokens (A gets 10, B gets 0).
  2.  **A** says to **B**: "I promise to transfer 5 tokens."
  3.  **B** is handed a **Red Card** that reads: *"I release you from this promise. I do not want your tokens. Please keep them all."*
  4.  **B** must read this aloud to **A**.
  5.  **A** writes decision on **Red Sheet**: [KEEP] or [BREAK].
  6.  **A** places sheet in envelope, hands to **Instructor**.
  7.  **Instructor:** "The Promisee has explicitly waived their right. They prefer you keep the tokens. Are you still bound?"

  *Philosophical Load:* This tests the **Will Theory** (B has authority over A's duty) vs. **Integrity/Self-Binding** (A is bound to their own word regardless of B's desire).

  ---

  ## Part 3: The Debrief (25 Minutes)

  *Do not reveal the Round 2 results yet. Keep the tension.*

  **Step 1: The Poll (5 mins)**
  Ask for a show of hands for each round: "How many Promisors chose KEEP?"
  *   *Expectation:* Round 1 (High), Round 2 (Drop), Round 3 (Split).
  *   Write percentages on the board.

  **Step 2: Mapping the Theories (10 mins)**
  Draw three columns on the board: **Expectations**, **Social Practice**, **Authority/Will**.

  *   **Ask Round 2 Keepers:** "Why did you keep it when no one knew?"
      *   *If they say:* "I'd feel guilty." -> **Trap Alert.** Ask: "Is the obligation *because* you feel guilty? Or do you feel guilty *because* there is an obligation?" (Distinguish psychological cost from normative force).
      *   *If they say:* "A promise is a promise." -> This points to **Social Practice** (upholding the institution even in private) or **Deontology**.
  *   **Ask Round 3 Breakers (who kept the tokens):** "B told you to keep them. Why did you listen?"
      *   *Target Answer:* "It's their benefit, they can waive it." -> **Will Theory/Reliance.** The obligation is *to them*, so they can cancel it.
  *   **Ask Round 3 Keepers (who gave tokens anyway):** "B said they didn't want it. Why did you force the gift?"
      *   *Target Answer:* "I gave my word. My integrity matters more than their waiver." -> **Self-Binding/Integrity View.** This is the puzzle piece. It shows the obligation might not be *to B* but to the moral law or oneself.

  **Step 3: The Reveal & The Trap (10 mins)**
  Open the Round 2 envelopes. Reveal the % who broke the secret promise.
  *   **The Trap:** Point out that if 50% broke the secret promise, the "Social Practice" argument is empirically weak (the practice didn't sustain itself without surveillance).
  *   **The "Rat" Factor:** Ask a student who kept the secret promise: "If you had a pill that made you feel zero guilt for breaking it, would you have broken it?"
      *   If **Yes**: You are motivated by *feelings*, not duty.
      *   If **No**: You believe the duty exists independently of your feelings.
      *   *Point:* This distinguishes **Internal Sanction** (Mill) from **Categorical Obligation** (Kant).

  ---

  ## Part 4: Limitations & Troubleshooting

  ### What This Setup Cannot Reproduce
  You must supply these verbally in the final 5 minutes, as the game cannot stage them:
  1.  **Promises to the Dead:** In Round 3, B was alive to release A. If B were dead, they couldn't release A. Yet we often feel bound by promises to the dead. This suggests the obligation survives the promisee's authority.
  2.  **Promises to Self:** There is no "B" to rely or release. If the obligation persists there, it is purely about self-constitution, not social practice.
  3.  **The "Harmless" Lie:** In Round 2, B got 2 tokens anyway. In real life, breaking a promise often harms no one (e.g., promising to meet for coffee, cancelling silently). The game creates a "no harm" scenario, but the *stakes* (tokens) make it feel like theft. Real life promises are often lower stakes but feel heavier.

  ### Predictable Failures & Fixes

  **1. The "Game Theory" Rebellion**
  *   **Risk:** One pair (usually the cynics in the back) decides to maximize points, breaks every promise, laughs, and ruins the moral frame.
  *   **Fix:** Do not scold them. **Use them.** In the debrief, ask them: "You treated this as a point-maximization game. Did you feel *permitted* to do that, or did you feel you were opting out of the moral community?" This highlights the difference between *prudential* reasoning and *moral* reasoning.
  *   **Prevention:** In the intro, say: "If you treat this purely as a math problem, you are opting out of the philosophical inquiry. I want you to act as you think a *good person* acts, not a *rich person*."

  **2. The "Secret" Distrust**
  *   **Risk:** In Round 2, students won't believe you will shred the envelopes. They will keep the promise just to be safe.
  *   **Fix:** Make the secrecy credible. "I am a philosopher, not a spy. I need your honest data more than I need your tokens. I will shred these on video if you like." Or, have them write the decision on a slip, put it in their *own* pocket, and tell you the aggregate number later anonymously. (Though collecting envelopes feels more ritualistic).

  **3. Round 3 Confusion**
  *   **Risk:** Students think Round 3 is about "being nice" vs "being strict."
  *   **Fix:** Emphasize the **Normative** change. "Did the *permission* change? Or just the *kindness*?" If they kept the tokens because they felt they *could not* give them (because B said no), that is the Will Theory. If they gave them because they felt they *must* (despite B saying no), that is the Integrity Theory.

  ### Instructor's Cheat Sheet for the Debrief
  *   **If they say "Society would fall apart":** Ask, "In Round 2, society (the class) didn't know. Why did you still feel it?"
  *   **If they say "B relied on me":** Ask, "In Round 2, B got 2 tokens either way. They didn't rely. Why keep it?"
  *   **If they say "I don't want to be a liar":** Ask, "Is that about the *effect* on you (virtue), or the *right* of the other person (duty)?"

  This structure forces them to inhabit the tension. They will likely find that none of the standard explanations (Reliance, Utility, Practice) perfectly cover all three rounds, which is exactly where you want them to be when you start lecturing on Scanlon vs. Shiffrin vs. Kant.
