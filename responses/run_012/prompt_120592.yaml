  9.  Double Jeopardy attaches upon any designated verdict. A defendant found Both may not be retried for the same offence, unless the verdict is later undesignated. Precedent is established by valid judgments. A case reported as Both binds lower courts to treat the legal principle as designated, even if the principle is subsequently found false. Lower courts must follow precedents even when they contradict.

  10. The Law of Non-Contradiction remains valid in LP. Instances of ~(A & ~A) are always designated, though they may be both true and false. Courts may convict on the strength of this law even where the instance is false. The validity of the law ensures order, even if its application yields contradictory outcomes. A conviction based on a false instance of Non-Contradiction is nonetheless secure.

  11. Judges must avoid explosion. Recording A and not-A does not commit the court to every conclusion. However, judges should avoid recording contradictions unless necessary. Where necessary, they must ensure no undesignated conclusions are drawn. If a contradiction renders reasoning impossible, the judge may declare a mistrial, provided the mistrial is not both granted and denied. If it is, the trial continues.

  12. It is anticipated that these changes will require minimal adjustment. Most facts remain strictly true or false. The public should be reassured that justice will proceed as before, notwithstanding the possibility that guilt and innocence may coincide. The integrity of the system is preserved by designation, not truth. Litigants should notice no difference, except where they do.

  13. This Direction applies to all proceedings commencing after the effective date. Previous judgments remain valid unless undesignated.
