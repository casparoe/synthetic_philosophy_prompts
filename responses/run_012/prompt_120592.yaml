      SUPREME COURT OF THE FREE STATE OF ONTOLOGIA
      PRACTICE DIRECTION NO. 7
      RE: THE LOGIC OF PARADOX (LP) IN JUDICIAL PROCEEDINGS

      1.  Effective 1 January, all courts shall adopt the paraconsistent logic LP as the official framework for legal proof. This Direction instructs judges on the administration of trials where propositions may be true, false, or both. The objective is to maintain order while acknowledging that contradiction does not entail triviality.

      2.  The standard of proof is designation. A fact is proved if the evidence assigns it the value true or both. It is not necessary that a fact be exclusively true. Consequently, reasonable doubt may be designated without being true. Where doubt is both well-founded and not, the prosecution burden is nonetheless discharged if the guilt of the accused is designated. Judges must instruct juries that certainty requires only designation, not truth.

      3.  Certain classical inferences are withdrawn. Disjunctive Syllogism is invalid. Where evidence establishes A or B, and further evidence excludes A, B does not necessarily follow. For example, if a defendant was in London or Paris, and evidence shows they were in London (both true and false), it does not follow they were not in Paris. Advocates must not rely on exclusion to prove remaining disjuncts where the excluded term is contradictory.

      4.  Modus Ponens is similarly restricted regarding the material conditional. Where an expert concludes B if A, and A is established as both true and false, B does not follow. For instance, if an alibi depends on a train running if scheduled, and the schedule is both kept and broken, the alibi's conclusion is not designated. Counsel must verify that antecedents are strictly true before invoking conditional rules.

      5.  Verdicts may be Guilty, Not Guilty, or Both. A finding of Both is permitted where the evidence designates guilt and innocence simultaneously. Such verdicts must be recorded on Form LP-1, checked in both boxes. Upon pronouncement, the Judge shall state: "The Court finds the defendant guilty and not guilty." The clerk shall enter both pleas in the record.

      6.  Findings of Both are reserved for genuine contradictions. A contradiction is genuine if it arises from self-reference, self-applicable rules, or borderline vagueness. Ordinary disputed facts, such as whether a light was red or green, are presumed classical and should not qualify. However, this presumption is rebuttable if the colour is both red and not red due to spectral vagueness.

      7.  Where a verdict is Both, sentencing shall proceed on the basis of the Guilty finding, provided the sentence is not inconsistent with the Not Guilty finding. If inconsistency arises, the sentence is suspended. This ensures punishment does not contradict acquittal, unless the contradiction is itself designated.

      8.  Appeals lie on grounds of invalidity, not falsity. A judgment is appealable if the conclusion is not designated given designated premises. A judgment that is valid but false (both true and false) cannot be appealed on the basis of falsity alone. The Appellate Court shall uphold any decision where designation is preserved, regardless of truth value.

      9.  Double Jeopardy attaches upon any designated verdict. A defendant found Both may not be retried for the same offence, unless the verdict is later undesignated. Precedent is established by valid judgments. A case reported as Both binds lower courts to treat the legal principle as designated, even if the principle is subsequently found false.

      10. The Law of Non-Contradiction remains valid in LP. Instances of ~(A & ~A) are always designated, though they may be both true and false. Courts may convict on the strength of this law even where the instance is false. The validity of the law ensures order, even if its application yields contradictory outcomes.

      11. Judges must avoid explosion. Recording A and not-A does not commit the court to every conclusion. However, judges should avoid recording contradictions unless necessary. Where necessary, they must ensure no undesignated conclusions are drawn. If a contradiction renders reasoning impossible, the judge may declare a mistrial, provided the mistrial is not both granted and denied.

      12. It is anticipated that these changes will require minimal adjustment. Most facts remain strictly true or false. The public should be reassured that justice will proceed as before, notwithstanding the possibility that guilt and innocence may coincide. The integrity of the system is preserved by designation, not truth.

      13. This Direction applies to all proceedings commencing after the effective date. Previous judgments remain valid unless undesignated.

