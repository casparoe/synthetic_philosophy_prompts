answer: |-
  **Case 1: The Directed Visualization**
  You sit quietly and decide to conjure a vivid image of a red sphere in your mind's eye. You can summon it at will, hold it steady for a moment, rotate it, or dismiss it instantly when you choose. In this specific window of attention, the phenomenon answers completely to your command; there is no resistance to your intention, and the sense of agency is immediate and unbroken. However, the image is fragile. If your attention wavers, if you sneeze, or if you simply cease the effort of maintenance, the sphere dissolves. It has a clear beginning when you start and a clear end when you stop. It is a discrete event in the stream of consciousness, dependent on conditions, and it does not persist through sleep or distraction.

  **Case 2: The Temperamental Baseline**
  Consider a deep-seated disposition, such as a baseline tendency toward melancholy or a specific cognitive style like hyper-vigilance. This trait has been present since adolescence, coloring every experience without interruption, and it persists through sleep, waking, effort, and rest. It feels less like something you *do* and more like something you *are*; it provides a stable background against which other mental events play out, showing no significant fluctuation over years. Yet, when you attempt to command this baseline to change—to will yourself into cheerfulness or to order the vigilance to stand down—the attempt fails. The trait remains opaque to the will, resisting direct manipulation even while it remains constant.

  ***

  ### Bookkeeping and Analysis

  **Case 1 Verdict:**
  *   **True Premises:** The candidate (visualization) is subject to origination and cessation (Impermanent). The candidate is responsive to direct volition (Mastered).
  *   **Firing Criterion:** Permanence.
  *   **Derivation:** Because the candidate ceases when effort ceases, it fails the requirement of unchanging stability. The Mastery criterion does not rule it out, as the candidate obeys the will, satisfying the condition of ownership. The verdict "Not-Self" rests solely on the transience of the phenomenon.

  **Case 2 Verdict:**
  *   **True Premises:** The candidate (temperament) exhibits long-term stability without fluctuation (Permanent). The candidate is unresponsive to direct volition (Unmastered).
  *   **Firing Criterion:** Mastery.
  *   **Derivation:** Because the candidate resists the command to change, it fails the requirement of ownership. The Permanence criterion does not rule it out, as the candidate endures through changing circumstances, satisfying the condition of stability. The verdict "Not-Self" rests solely on the lack of control.

  **Commonality and Difference:**
  Both cases examine mental phenomena that a person might plausibly identify as "me" (a thought-process vs. a personality trait). Both occur within ordinary introspection. The differing feature is **Volitional Accessibility**. In Case 1, the phenomenon is generated by the will; in Case 2, it is given to the will.

  It is not possible to construct a one-feature contrast that isolates the criteria without altering Volitional Accessibility. If one attempts to hold volition constant (e.g., two willed acts), both candidates become impermanent, and the Mastery criterion passes for both, causing the Permanence criterion to do all the work. If one holds stability constant (e.g., two enduring traits), both candidates become unmastered, and the Permanence criterion passes for both, causing the Mastery criterion to do all the work. The separation of criteria *requires* a divergence in how the candidate relates to agency. Thus, the contrast is genuinely one of property (accessibility), but that property dictates which criterion becomes salient.

  **The Collapse:**
  If we remove the differing feature (Volitional Accessibility) and assume the standard Buddhist premise that *all* experienced phenomena are both impermanent *and* unmastered, the pair collapses into the standard chain of *anatta*. The distinction between the two arguments vanishes, and Permanence and Mastery become co-extensive symptoms of the same underlying ontological status. The separation proves that they are logically distinct tests, even if they empirically overlap in the final doctrine.

  **The Defender's Move:**
  A defender of the self (e.g., a Nyāya realist or a Cartesian dualist) should reject the premise that **the self must be found among the objects of experience.**
  *   **Cost:** This saves the self but relocates it to a transcendent position (the *witness* or the *substance* behind the attributes).
  *   **Consequence:** By positing a self that is neither a visualization nor a temperament but the *owner* of both, the defender avoids both criteria. However, this renders the self empirically vacuous. It saves the concept of "I" only by stripping it of all descriptive content, making it a purely formal postulate rather than a discoverable entity. Alternatively, if they reject the Mastery criterion (arguing a self can exist without control, like a paralyzed king), they save a "passive self," but at the cost of making the self irrelevant to soteriology (liberation).

  **The Gap and the Middle Term:**
  Neither case concludes "There is no self." They conclude "This candidate is not the self." To reach the stronger conclusion (*anatta*), a further premise is required: **Exhaustiveness.** One must premise that the candidates presented (mental events, traits, bodily sensations) constitute the *totality* of what a person is. Without this, the argument only successfully eliminates false candidates, leaving open the possibility of a true self hidden elsewhere.

  Regarding the middle term, **unsatisfactoriness (*dukkha*)**:
  In the standard chain (Impermanent $\rightarrow$ Unsatisfactory $\rightarrow$ Not-Self), *dukkha* is not merely a bridge; it provides the *motive* for the rejection.
  *   In Case 1, the visualization is unsatisfactory because it slips away (frustration of retention).
  *   In Case 2, the temperament is unsatisfactory because it resists change (frustration of alteration).
  *   *Dukkha* does independent work by translating ontological facts (change/stasis) into soteriological relevance (suffering). However, in these separated cases, *dukkha* is revealed as the shadow cast by the mismatch between expectation and reality. In Case 1, the expectation is permanence; in Case 2, the expectation is control. *Dukkha* is the friction. It does not bridge Permanence and Selfhood directly; rather, it bridges *Experience* and *Selfhood*. It explains why we care whether the self is permanent or masterable. If the criteria were met, there would be no *dukkha*. Thus, *dukkha* is the diagnostic symptom, while Permanence and Mastery are the etiological causes.

  **Conclusion on the Arguments:**
  These are two arguments wearing two vocabularies. They target different intuitions about selfhood: one targets the intuition of the self as a stable substrate (Permanence), the other targets the intuition of the self as an agent (Mastery). By prizing them apart, we see that the Buddhist critique is robust: it catches the self whether it tries to hide in stability (Case 2) or in agency (Case 1). The fusion of the two in standard doctrine is a rhetorical compression of two distinct lines of attack into a single net.
