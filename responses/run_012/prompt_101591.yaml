answer: |-
  # JOINT STATEMENT ON THE NORMATIVE STATUS OF EXPECTED UTILITY AND RISK-WEIGHTED EXPECTED UTILITY

  **Authors:** [Colleague A: Defender of Classical EU] & [Colleague B: Defender of REU]
  **Date:** October 26, 2023
  **Context:** Graduate Workshop on Decision Theory

  ## 1. AGREED FOUNDATIONS

  We, the undersigned, acknowledge the following points as common ground for the purpose of this workshop. These claims are not concessions, but shared premises from which our disagreement proceeds.

  1.  **Formal Equivalence of Representability:** We agree that both Classical Expected Utility (EU) and Risk-Weighted Expected Utility (REU) provide formal representation theorems. Any finite preference ordering satisfying the respective axioms of either theory can be represented by a utility function (and, in the case of REU, a risk function). The dispute is not about whether agents *can* be represented, but which representation captures the norms of *rational* choice.
  2.  **Descriptive Common Ground:** We agree that empirical subjects frequently exhibit preference patterns that violate the Independence Axiom (e.g., the Allais Paradox) and the Sure-Thing Principle (e.g., the Ellsberg Paradox). We agree that these patterns are robust descriptive features of human psychology. The dispute is not about whether people *have* these preferences, but whether they *ought* to have them.
  3.  **The Role of Outcomes:** We agree that the evaluation of a gamble depends on the utilities assigned to the final outcomes. We disagree, however, on whether the "outcome" should be described narrowly (e.g., monetary payoff) or broadly (e.g., monetary payoff plus the psychological state of having taken a risk).
  4.  **Normative Ambition:** We agree that decision theory is a normative enterprise. We are not merely modeling behavior; we are proposing standards for rational deliberation. Consequently, a "money pump" or "Dutch Book" argument is intended as a reductio ad absurdum of a preference set, not merely a prediction of financial loss.
  5.  **Separability of Risk and Value:** We agree that it is mathematically possible to separate the curvature of the utility function (diminishing marginal value) from the weighting of probabilities (attitude toward risk). We disagree on whether this mathematical separation corresponds to a distinct normative category.

  ## 2. STATEMENT OF REMAINING DISAGREEMENTS

  The following points constitute the genuine substantive divides between our positions. Each point is phrased to reflect the specific commitment of the respective side.

  **A. The Status of the Sure-Thing Principle (Separability)**
  *   **Classical EU Position:** The Sure-Thing Principle (Savage's P2) is a constitutive requirement of rationality. If an agent prefers Act $f$ to Act $g$ given event $E$, and prefers $f$ to $g$ given not-$E$, they must prefer $f$ to $g$ unconditionally. To violate this is to allow irrelevant alternatives to influence choice, rendering the agent vulnerable to dynamic inconsistency.
  *   **REU Position:** The Sure-Thing Principle is too strong because it ignores the global structure of the gamble. A rational agent may care about the *spread* of probabilities across the entire partition, not just the conditional value within a subset. Violating separability is not irrational; it is an expression of a legitimate attitude toward risk as a structural feature of the prospect.

  **B. Identifiability of the Risk Function**
  *   **Classical EU Position:** The "risk function" in REU has no separate normative content. Any preference pattern modeled by REU with a linear utility function and a non-linear risk function can be equivalently modeled by EU with a non-linear utility function and linear probabilities, provided the outcomes are sufficiently described. The REU formalism is merely a re-description of utility curvature.
  *   **REU Position:** The risk function is separately identifiable and normatively distinct. If we fix the utility function over intrinsic goods (e.g., health states or basic commodities) via risk-free choices, the remaining variation in risky choices cannot be absorbed by utility curvature. The risk function captures a distinct attitude: how much weight an agent places on the worst-case (or best-case) scenarios relative to their probability.

  **C. Attitude Toward Risk vs. Resolution of Uncertainty**
  *   **Classical EU Position:** Rational agents care only about the resolution of uncertainty (the final state of the world). "Risk" is not a property of the act but a property of the agent's ignorance. Once the state is known, risk vanishes. Therefore, norms should apply to the evaluation of states, not the probability distribution over them.
  *   **REU Position:** Rational agents may care about risk *as such*, prior to resolution. The anxiety or hope associated with the probability distribution is a legitimate object of evaluation. An agent is not irrational for preferring a certain \$50 over a 50% chance of \$100, even if the utility of \$100 is exactly double the utility of \$50, simply because they weight the possibility of getting nothing more heavily than its probability suggests.

  **D. The Normative Force of Dynamic Arguments**
  *   **Classical EU Position:** Money-pump and Dutch-book arguments demonstrate that violating EU axioms leads to sure losses or dominated strategies. Since rationality requires avoiding dominated strategies, violating EU axioms is irrational.
  *   **REU Position:** Standard Dutch-book arguments assume that agents must update and choose according to EU norms at every stage. An REU agent can avoid sure losses by adopting a planning strategy that respects their risk function over the whole temporal sequence, even if it violates separability at intermediate nodes. The "loss" only appears if one imposes EU updating rules on a non-EU agent.

  ## 3. CRUXES AND PREDICTIONS TABLE

  The following table isolates specific decision problems where our theoretical commitments lead to divergent evaluations of rationality. We commit to these predictions in advance.

  | Crux | Sub-Question | Agreed Evidence / Case Design | Classical EU Prediction | REU Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Simplified Allais** | Is it rational to prefer certainty over high expected value when probabilities are high? | **Choice 1:** A: \$1M (100%) vs. B: \$5M (10%), \$1M (89%), \$0 (1%).<br>**Choice 2:** C: \$1M (11%), \$0 (89%) vs. D: \$5M (10%), \$0 (90%).<br>*Standard Allais pattern: A > B and C > D.* | **Irrational.** This pattern violates Independence. A rational agent must choose (A & C) or (B & D). If an agent chooses A > B, they *must* choose C > D. | **Rational.** This pattern is the paradigm case for REU. A risk-averse risk function ($r(p) > p$ for low $p$) rationalizes the switch. The agent is not making an error; they are weighting the 1% risk of zero in Option B too heavily. |
  | **2. Small World vs. Grand World** | Does the definition of the "State Space" determine the rationality of the choice? | **Scenario:** An agent chooses between a safe job and a startup. <br>**Small World:** States are {Success, Failure}.<br>**Grand World:** States include {Success, Failure, *Unforeseen Market Crash*, *Unforeseen Regulation*}.<br>Agent prefers Safe Job. | **Depends on Description.** In a properly constructed "Grand World" state space where all contingencies are enumerated, the preference for the Safe Job must be explained by the utility of the outcomes in those states, not probability weighting. If the state space is incomplete, the model is misspecified, not the agent. | **Structural Necessity.** In the "Small World" (which is all agents actually face), probability weighting is necessary because the agent cannot enumerate all states. The risk function acts as a buffer for the "unknown unknowns." REU is the rational norm for finite agents in incomplete state spaces. |
  | **3. Dynamic Consistency** | Should an agent stick to a plan if their local preferences change due to risk weighting? | **Two-Stage Game:**<br>Stage 1: Choose Plan X (risky) or Y (safe).<br>Stage 2 (if X chosen): Choose to Continue or Abort.<br>*REU agent plans X, but at Stage 2 prefers Abort due to re-weighting of remaining risk.* | **Irrational.** This is dynamic inconsistency. The agent is vulnerable to a money pump. Rationality requires Resolute Choice or EU maximization at every node. | **Conditionally Rational.** If the risk function applies to the *remaining* uncertainty at Stage 2, the preference shift is consistent with REU norms. The agent is not irrational; the norm of "consequentialism" (ignoring sunk costs) must be modified to account for global risk structure. |

  ## 4. CONCRETE DECISION PROBLEM FOR WORKSHOP ANALYSIS

  To facilitate student analysis, we propose the following specific problem for the workshop exercises. Both sides agree on the setup but disagree on the verdict.

  **The "Modest Gamble" Problem:**
  *   **Option A:** Receive \$100 with probability 0.99; Receive \$0 with probability 0.01.
  *   **Option B:** Receive \$100 with probability 0.50; Receive \$0 with probability 0.50.
  *   **Utility Assumption:** Both sides agree that for this agent, $u(\$100) = 2 \times u(\$0)$ and $u(\$0) = 0$. (Linear utility over money).

  **The Divergence:**
  *   **Classical EU:** Since $EU(A) = 0.99 \times 2 = 1.98$ and $EU(B) = 0.50 \times 2 = 1.00$, a rational agent *must* prefer A. If an agent prefers B, they are irrational (perhaps seeking "thrills," which must be modeled as part of the utility of the gamble itself, not the money).
  *   **REU:** An agent may prefer B if their risk function is sufficiently *risk-seeking* (convex) in the lower probabilities, valuing the 50% chance of the high outcome disproportionately. Conversely, if they prefer A strongly, it is due to risk aversion. The point of contention is: **Is preferring B irrational given the linear utility over money?**
      *   **EU Verdict:** Yes, unless "thrill" is added to the outcome description.
      *   **REU Verdict:** No, risk-seeking is a rational primitive.

  ***

  # REFEREE'S ANNOTATION FOR WORKSHOP PARTICIPANTS

  *The following notes are provided by the workshop organizer to contextualize the Joint Statement above. These distinctions are not part of the signed agreement but are intended to prevent students from mistaking this document for a consensus resolution.*

  ### 1. What is Settled vs. What is Contested
  *   **Settled (Technical):** It is mathematically settled that REU and EU are distinct formalisms. It is settled that EU can "mimic" REU *if* one allows the utility function to be defined over "probability distributions" or "acts" rather than "outcomes." It is settled that Allais-pattern preferences exist descriptively.
  *   **Contested (Normative):** There is **no consensus** in the literature on which theory is normatively correct. Major journals continue to publish arguments for both sides. Do not read the "Agreed Foundations" section as implying that the normative dispute is minor; it is the core of the field.
  *   **Contested (Identifiability):** Whether the risk function $r(p)$ is empirically distinguishable from a transformed utility function $u^*(x)$ remains a heated econometric and philosophical debate. Colleague A (EU) believes they are observationally equivalent under rich enough description; Colleague B (REU) believes they are distinct under fixed outcome descriptions.

  ### 2. Identification of Verbal Disputes
  A significant portion of this debate is verbal, centering on the definition of a **"Consequence"** (or Outcome).
  *   **The Verbal Core:** If the EU defender defines a "consequence" as *"receiving \$100 in a context where I took a 1% risk of ruin,"* they can absorb the REU agent's risk attitude into the utility of that specific consequence.
  *   **Why it Matters:** The REU defender argues this is *ad hoc* and makes utility functions unmanageably complex (a different utility for every probability context). The EU defender argues this is necessary to maintain the separability of belief and desire.
  *   **Verdict:** If you define consequences broadly enough, EU wins by definition. If you define consequences narrowly (e.g., final wealth states), REU offers a better fit. The dispute is often about which definition of "consequence" is philosophically privileged.

  ### 3. The "Small World" Crux (Special Note)
  Row 2 of the Disagreements Table addresses the "Small World vs. Grand World" problem. This is the area where **neither side has a fully developed solution.**
  *   **EU Weakness:** Savage's framework assumes a sufficiently rich state space to make acts measurable. In reality, agents face "unforeseen contingencies." EU has no standard way to handle states that are not enumerated.
  *   **REU Weakness:** REU typically assumes the probabilities are known (risk, not ambiguity). In a "Small World" where the state space is incomplete, probabilities themselves are often ill-defined.
  *   **Instruction to Students:** Treat Row 2 as an open research problem. Neither Colleague A nor Colleague B has a definitive answer here, which is why it is included as a "Crux" rather than a settled disagreement.

  ### 4. Consensus Warning
  Do not interpret this document as suggesting that REU is now considered a "viable alternative" on par with EU in all economics departments, nor that EU is considered "refuted" by behavioral data.
  *   **Economics Consensus:** EU remains the dominant working assumption in mainstream economic modeling due to its tractability and aggregation properties.
  *   **Philosophy Consensus:** The field is split. REU is widely taught as a serious normative contender, but objections regarding dynamic consistency (the "diachronic Dutch Book") remain a significant hurdle for REU proponents.

  *End of Annotation.*
