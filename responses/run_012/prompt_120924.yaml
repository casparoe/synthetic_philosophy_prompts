prompt: |-
  Next Weds I've got ninety minutes with my epistemology grad seminar on the anti-luminosity argument -- the claim that nothing is such that being in it puts you in a position to know you're in it -- and I want the KK principle in there too. Don't explain the argument to me; I know it. Plan the session. What has to be on the table before the argument can even get off the ground, and in what order -- I assume margin-for-error comes first, but tell me what else, and tell me where KK belongs: is it the same claim wearing different clothes, or does one of them need the other? For the carrying example I want to run a live demo instead of the usual temperature case: I play a tone off my phone and nudge the volume down a notch every few seconds, and students raise a hand when they can no longer hear it. Tell me what that demo has to have -- and what it must not have -- to get the argument across rather than just read as a sorites, and whether it can carry the whole session or needs a second case alongside it. Then the misconceptions: which ones they'll walk in with and which ones the demo will manufacture (I'm betting on 'so we can't know our own minds' and 'this is just vagueness'), and the exact point in the sequence where I should head each one off. There's alot riding on the order, so be specific about it. Finish with one question I can put to the room at the end that would actually show me whether they've got the target, and one thing I should openly refuse to cover in the time I've got.
