  2.  **Deconstruct the Theory:**
      *   *Paradox of Voting (Condorcet):* Individual preferences are transitive, but collective preferences can be cyclical (A > B, B > C, C > A). Majority rule can be unstable.
      *   *Discursive Dilemma (Doctrinal Paradox):* A group votes on premises (P1, P2, P3) and a conclusion (C). Individual judgments might be consistent, but the majority vote on premises might lead to a different conclusion than the majority vote on the conclusion itself. Or, aggregation of judgments on interconnected issues leads to inconsistency.
      *   *Aggregative Model:* Collecting individual inputs to produce a collective output.
      *   *Deliberative Model:* Changing inputs through discussion before aggregation.

  3.  **Deconstruct the Film (*12 Angry Men*):**
      *   *Setting:* Jury room.
      *   *Task:* Determine guilt beyond reasonable doubt (binary choice: Guilty/Not Guilty).
      *   *Rule:* Unanimity required (otherwise hung jury).
      *   *Process:* Initial vote (11-1 Guilty), deliberation, subsequent votes, final vote (12-0 Not Guilty).
      *   *Dynamic:* Juror 8 (Henry Fonda) challenges the evidence piece by piece (knife, witness, train noise, etc.). Others shift votes based on these challenges.
      *   *Tension:* Is it about truth or reasonable doubt? Is it about preference or judgment?

  4.  **Synthesize Theory and Film:**
      *   *Initial Vote:* Shows the aggregative model failing or being superficial. 11-1 suggests a stable majority, but it's fragile.
      *   *Discursive Dilemma:* The jurors aren't just voting "Guilty/Not Guilty." They are voting on underlying premises (Is the witness reliable? Is the knife unique?). If they voted on premises by majority, would it yield the same verdict as voting on the conclusion? The film shows Juror 8 forcing them to re-evaluate premises.
      *   *Unanimity Rule:* This is crucial. It prevents simple majority rule. It forces deliberation. Does it solve the instability by requiring consensus, or does it mask the fact that there is no stable collective preference?
      *   *Shift from 11-1 to 12-0:* Is this rational convergence (Bayesian updating) or social pressure/agenda control? Juror 8 controls the agenda (which piece of evidence to discuss next). Some jurors change votes due to fatigue, prejudice exposure, or bandwagoning (e.g., the switch to not guilty just to get out of the room).
      *   *Vindication vs. Undermining:* Does the film show democracy working (deliberation refines judgment) or failing (truth is elusive, verdict depends on who talks loudest/longest)?
      *   *Resistance:* The film assumes a objective truth (the boy is likely innocent), whereas social choice theory often assumes preferences are subjective. The film is normative (we *should* doubt), theory is descriptive/analytical.

  5.  **Drafting the Argument (Iterative Process):**

