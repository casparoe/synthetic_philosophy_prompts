prompt: |-
  I teach a second-year undergraduate seminar in epistemology, and until about six weeks ago the material on pragmatic encroachment and epistemic contextualism was, for me, a slightly bloodless set of distinctions I could teach without much investment. Then I spent a fortnight on the receiving end of a workplace investigation, and I watched — in myself and in the colleagues around me — the same bundle of evidence that I would unhesitatingly have called knowledge in a low-stakes setting (is this citation sloppy, is this record-keeping adequate?) curdle into something none of us would have described as knowledge once the question became whether someone's job would survive it. Nobody became stupider or more cautious in any ordinary sense, and no new evidence arrived. What changed was what was riding on the answer. I would like my students to feel that happen in their own mouths, before they hear any of the labels.

  So I am asking you to act as an experienced teacher of epistemology and a designer of classroom simulations — someone who has run games with real (small) stakes and knows the specific ways they fall apart. Think carefully before you write. Begin with a short scratchpad in which you work out what the activity must accomplish and what could plausibly go wrong with each design choice you consider; only then give me the finished design.

  The session is 90 minutes, 14 students, a seminar room with movable chairs. The two views I want them to have run into by the end are these, and I want them stated in my students' language rather than the literature's:

  1. Contextualism: whether a knowledge attribution is true depends on the context of whoever is doing the attributing — roughly, on how salient error possibilities are to that attributor — so the same person with the same evidence can be correctly described as knowing in one conversation and as not knowing in another.
  2. Pragmatic encroachment (or subject-sensitive invariantism): whether the subject knows depends on her practical stakes — on how much turns, for her, on whether the thing is true — so a subject can lose or gain knowledge when her stakes change while her evidence and the attributor's context stay fixed.

  The crux I want them to collide with is that both views predict the same surface pattern, namely verdicts drifting with stakes, and that the only way to prise them apart is to move two variables independently: the stakes for the person who has to act on the evidence, and the stakes for the person asked whether she knows. If the activity can be built so that those two move separately, so much the better. If you judge that cannot be done with real participants in 90 minutes, say why and design the closest thing that can.

  What I need from you:

  - Roles, rules, and materials. Assume photocopying and a bag of small tokens; nothing that needs money, devices, or software.
  - A stakes scheme in points, tokens, or privileges rather than cash, calibrated so that the high-stakes condition genuinely bites without making anyone miserable or resentful.
  - A minute-by-minute timeline for the 90 minutes, including a point at which verdicts are written down individually before anyone can talk, so that we have data rather than a consensus we manufactured.
  - A debrief keyed to particular moments: which thing that happened is what contextualism explains, which is what encroachment explains, and what each view would have predicted that we did not observe. The students should do the naming and the arguing; I will supply the labels only after they have committed themselves.
  - Your best guess at what will predictably go wrong the first time I run it — the ways the stakes manipulation will fail to bite, the ways participants will game the rules, the ways the result will be demand characteristics rather than the phenomenon — and what I should do in the moment when each of those happens.
  - A frank note on what this activity cannot reproduce, that is, what I will have to say in my own voice because no amount of moving chairs around the room will deliver it.

  One constraint on sources: no reading list, no citations, and no named or dated experimental findings. If something from the empirical literature bears on a design choice, describe it in plain language and let me take it on trust.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **User:** Second-year undergraduate epistemology instructor.
      *   **Context:** Recently experienced a workplace investigation where "knowledge" seemed to vanish due to high stakes, despite no change in evidence. Wants students to *feel* this before learning the labels.
      *   **Goal:** Design a 90-minute seminar simulation (14 students) to demonstrate Pragmatic Encroachment vs. Epistemic Contextualism.
      *   **Key Distinction:** Both predict verdicts drift with stakes. To distinguish them, one must vary *Subject's Stakes* vs. *Attributor's Stakes* independently.
      *   **Constraints:** No money/devices/software. Use tokens/points/privileges. No citations/named findings.
      *   **Deliverables:** Scratchpad (design reasoning), Roles/Rules/Materials, Stakes Scheme, Timeline, Debrief Guide, Troubleshooting (what goes wrong), Limitations (what the activity can't do).
      *   **Tone:** Experienced teacher, practical, reflective, empathetic to the user's recent experience.

  2.  **Scratchpad & Design Reasoning:**
      *   *Challenge:* How to separate Subject Stakes from Attributor Stakes in a classroom game?
      *   *Standard Approach:* "Bank Case" (Keith DeRose). Low stakes vs. High stakes for the subject. But this usually conflates the attributor's context with the subject's stakes in natural conversation.
      *   *The Crux:* I need Player A (Subject) to have high/low stakes on an action, while Player B (Attributor) has high/low stakes on *verifying* Player A's claim.
      *   *Idea:* A "Quality Control" simulation.
      *   *Setup:* Pairs. One is the "Assembler" (Subject), one is the "Inspector" (Attributor).
      *   *Task:* Assembler builds something (or solves a puzzle) based on ambiguous evidence. Inspector decides if Assembler "Knows" the solution is correct.
      *   *Stakes Manipulation:*
          *   Assembler's Stakes: If they act on wrong info, they lose points.
          *   Inspector's Stakes: If they certify wrong info, *they* lose points.
      *   *Problem:* In a 90-minute seminar, complex building tasks eat time. Need something cognitive but quick. A visual ambiguity task or a logic puzzle with a "trap."
      *   *Better Idea:* "The Bridge Crossing." A classic philosophical trope, but gamified.
      *   *Revised Idea:* "The Message Relay." Ambiguous message. Subject must act on it. Attributor must certify the Subject knows it.
      *   *Best Fit for Epistemology:* "The Evidence File." Give students a packet of evidence about a scenario (e.g., Did the employee steal the cookie?).
      *   *Wait, simpler:* "The Perceptual Task." Show an image briefly. Is there a red dot?
      *   *Let's go with "The Ambiguous Rule."* Students are given a rule and a case. They must decide if the case falls under the rule. The evidence is the same. The stakes change.
      *   *Separating Variables:*
          *   Condition 1 (Low/Low): Subject loses 1 token if wrong. Attributor loses 1 token if certifying wrong.
          *   Condition 2 (High/Low): Subject loses 10 tokens if wrong. Attributor loses 1 token.
          *   Condition 3 (Low/High): Subject loses 1 token. Attributor loses 10 tokens.
          *   Condition 4 (High/High): Both lose 10.
      *   *Measurement:* Attributor must write "S knows" or "S doesn't know."
      *   *Risk:* Students might treat "Knows" as "Is willing to bet." Need to prime them to care about *truth* not just *betting*.
      *   *Risk:* Demand characteristics. Students guess the point.
      *   *Risk:* Stakes not feeling real. Tokens need to buy something meaningful (e.g., leaving early, choosing the next topic, a small treat, or just "Seminar Capital" that affects final participation grade—though grade manipulation is ethically tricky). Let's use "Seminar Privileges" (e.g., extension token, choice of reading).
      *   *Refinement:* To make it visceral, the "Subject" must actually *act* (make a choice), and the "Attributor" must *assess* the Subject.
      *   *The "Bank" Analogy is too abstract.* Let's use a "Medical Diagnosis" or "Safety Check" scenario.
      *   *Decision:* "The Safety Inspector."
      *   *Subject:* Engineer deciding if a beam is safe.
      *   *Attributor:* Supervisor deciding if they can sign off on the Engineer's judgment.
      *   *Evidence:* A blurry photo or a technical report with a margin of error.
      *   *Why this works:* It mirrors the user's workplace investigation experience (record-keeping, adequacy).

  3.  **Drafting the Design (Mental Walkthrough):**
      *   *Time:* 90 mins.
      *   *Intro:* 10 mins.
      *   *Round 1 (Low Stakes):* 15 mins.
      *   *Round 2 (High Subject Stakes):* 15 mins.
      *   *Round 3 (High Attributor Stakes):* 15 mins.
      *   *Debrief:* 35 mins.
      *   *Buffer:* 5 mins.
      *   *Materials:* Case files, Token sheets, Verdict slips.
      *   *Stakes:* Tokens redeemable for "Extension Coupons" or "Seminar Choice."
      *   *Troubleshooting:* If stakes don't bite, amplify the penalty publicly. If they game it, remind them of the "Knowledge" definition (must be true).

  4.  **Addressing the "Separation of Variables" Crux:**
      *   This is the hardest part. In standard conversation, if *I* have high stakes, *you* (talking to me) usually adopt high stakes.
      *   To separate them, the Attributor must be insulated from the Subject's outcome, *except* for their own specific penalty.
      *   *Mechanism:* The Subject acts. If Subject is wrong, Subject loses points. The Attributor says "Subject Knows." If Subject is wrong *and* Attributor said "Knows," Attributor loses points.
      *   *Crucial Detail:* The Attributor's penalty must vary independently of the Subject's penalty.
      *   *Scenario:*
          *   Subject: "I need to submit this form." (Penalty for error: Low vs High).
          *   Attributor: "I need to verify this form." (Penalty for false certification: Low vs High).
      *   *Wait, one more layer:* The evidence must be *ambiguous*. If it's clear, stakes don't matter. If it's impossible, stakes don't matter. It must be the "Gettier zone" or just below the threshold.
      *   *Task:* A visual estimation task. "Is the line longer than 10cm?" (It's 10.1cm). Hard to tell with naked eye.
      *   *Actually, a logic puzzle is better for a seminar.* "The Rule Application."
      *   *Let's stick to the User's vibe:* "Record Keeping."
      *   *Scenario:* Did the student submit the draft by midnight?
      *   *Evidence:* A server log that says "11:59:58" but the clock might be out of sync.
      *   *This is too technical.*
      *   *Let's go with "The Perceptual Ambiguity" (The Dot Task).* It's fast and visceral.
      *   *Subject:* Looks at screen. Sees a faint shape. Must say "Circle" or "Square."
      *   *Attributor:* Watches Subject. Must certify "Subject Knows" or "Subject Guessing."
      *   *Stakes:*
          *   Subject: Wrong answer = Lose tokens.
          *   Attributor: Certifying a wrong answer = Lose tokens.
      *   *Independence:* We can assign different token values to Subject and Attributor in different rounds.

  5.  **Refining the Stakes:**
      *   Tokens = "Seminar Credit."
      *   Low = 1 token. High = 5 tokens.
      *   Total available = 10 tokens.
      *   Prize: Top 3 get to choose a reading / get a 24hr extension on one essay.
      *   *Warning:* Don't make it grade-dependent. Keep it low-stakes *real* stakes.
      *   *Better:* "The Pizza Fund" or "Coffee Fund." Or simply "Branding Rights" (naming the theory). Let's use "Extension Tokens" (very valuable to undergrads).

  6.  **Developing the Troubleshooting:**
      *   *Failure 1:* Stakes feel fake. *Fix:* Make the loss public.
      *   *Failure 2:* Attributor just says "No" to be safe. *Fix:* Penalty for being too cautious? (e.g., If Subject was Right and Attributor said "No Know", Attributor gets nothing). This forces a trade-off.
      *   *Failure 3:* Students confuse "Justified" with "True." *Fix:* Clear instructions.

  7.  **Developing the Debrief:**
      *   Need to map the data.
      *   If Subject Stakes go up -> Knowledge attribution goes down (Encroachment).
      *   If Attributor Stakes go up -> Knowledge attribution goes down (Contextualism).
      *   If both -> Big drop.
      *   The "Aha" moment: When they realize the *Subject's* evidence didn't change, but the *Attributor's* willingness to attribute changed.

  8.  **Final Review against Constraints:**
      *   90 mins? Yes.
      *   14 students? Yes (7 pairs).
      *   No money/devices? Yes (Printed images/text).
      *   No citations? Yes.
      *   Scratchpad first? Yes.
      *   User's experience honored? Yes (focus on the "curdling" of knowledge).

  9.  **Writing the Response:**
      *   *Tone:* Professional, collegial, acknowledging the gravity of the user's experience.
      *   *Structure:* Scratchpad -> Design -> Timeline -> Debrief -> Troubleshooting -> Limitations.
      *   *Key Insight:* The activity cannot fully separate the variables perfectly because the Attributor naturally empathizes with the Subject. I need to acknowledge this limitation honestly.

  *(Self-Correction during drafting)*: I initially thought about a visual task. But visual tasks are too subjective ("I saw it"). A "Document Verification" task is closer to the user's experience (citations, records). Let's use a "Data Entry Verification" task. It's boring, which makes the stakes matter more.
  *Revised Task:* "The Discrepancy." Two documents. Do they match? There is a tiny, ambiguous smudge.
  *Subject:* Decides "Match" or "No Match."
  *Attributor:* Decides "Subject Knows" or "Subject Doesn't Know."
  *Truth:* The instructor knows the ground truth (pre-determined).
  *This works.* It mimics the "is this citation sloppy" feeling.

  *Wait, one more check on the "Independent Variables" constraint.*
  To truly separate Contextualism from Encroachment, I need:
  1.  High Subject Stakes / Low Attributor Stakes.
  2.  Low Subject Stakes / High Attributor Stakes.
  If Knowledge attribution drops in (1), that supports Encroachment.
  If Knowledge attribution drops in (2), that supports Contextualism.
  I need to ensure the pairs swap roles or we have enough pairs to split conditions.
  With 14 students (7 pairs), I can't run all 4 conditions simultaneously with N=7.
  *Solution:* Run 3 Rounds.
  Round 1: Low/Low (Baseline).
  Round 2: High Subject / Low Attributor.
  Round 3: Low Subject / High Attributor.
  *Wait, pairs stay the same.* If Pair 1 does Round 2, Pair 2 does Round 3? No, that introduces pair-dynamics variables.
  *Better:* All pairs do all 3 rounds. We compare the *aggregate* shift in verdicts across rounds.
  *Round 1:* Both risk 1 token.
  *Round 2:* Subject risks 5, Attributor risks 1.
  *Round 3:* Subject risks 1, Attributor risks 5.
  *Data:* Compare % of "Knows" in R2 vs R3.
  *This is feasible.*

  *Let's finalize the Scratchpad.*
  *Focus:* Why this design? Why these stakes? What could break?
  *Focus:* The "Curdling" feeling.

  *Okay, ready to write.*
answer: |-
  ### Scratchpad: Design Reasoning & Risk Assessment

  **The Core Challenge:**
  You want students to distinguish between two views that predict the same outcome (knowledge attributions drop as stakes rise) but for different reasons. To do this, we must vary *Subject Stakes* (what the actor risks) and *Attributor Stakes* (what the judge risks) independently. In natural conversation, these usually rise together (if your job is on the line, mine is too, because I'm talking to you). The simulation must artificially decouple them.

  **Design Choice 1: The Task**
  *Option A: Visual Perception (e.g., "Is that line longer?").*
  *Pros:* Fast, objective ground truth.
  *Cons:* Too physiological. Students attribute failure to eyesight, not epistemology.
  *Option B: Document Verification (e.g., "Do these records match?").*
  *Pros:* Mirrors your workplace experience. Boring enough that stakes matter.
  *Cons:* Hard to generate ambiguous cases quickly.
  *Decision:* **Option B.** We will use "Discrepancy Reports." Pairs receive two slightly different versions of a text. There is one ambiguous character (e.g., a smudged date or a typo that might be intentional). The Subject must decide if the documents match. The Attributor must decide if the Subject *knows* they match.

  **Design Choice 2: The Stakes**
  *Option A: Cash.*
  *Pros:* Real value.
  *Cons:* Ethical issues, creates resentment, distracts from philosophy.
  *Option B: Course Credit.*
  *Pros:* High value.
  *Cons:* Unethical to gamble grades in a simulation.
  *Option C: "Seminar Capital" (Privileges).*
  *Pros:* Valuable to students, no grade risk.
  *Decision:* **Option C.** Tokens redeemable for a 24-hour essay extension or the right to choose a seminar reading.
  *Risk:* Students might not care enough.
  *Mitigation:* Make the token loss public and immediate. Use a "Bank Sheet" on the desk where tokens are physically crossed out.

  **Design Choice 3: The Separation of Variables**
  *Plan:* Three Rounds. All pairs do all rounds.
  *Round 1 (Baseline):* Low Subject Stake / Low Attributor Stake.
  *Round 2 (Encroachment Test):* High Subject Stake / Low Attributor Stake.
  *Round 3 (Contextualism Test):* Low Subject Stake / High Attributor Stake.
  *Risk:* Students might realize the game and "play along" with the theory they guess you want.
  *Mitigation:* Emphasize that tokens are lost *only* if they are objectively wrong. Keep the "Ground Truth" sealed until the end.

  **Design Choice 4: The "Knowledge" Definition**
  *Risk:* Students treat "S knows" as "S is willing to bet."
  *Mitigation:* Instructions must specify that "Knows" means "S has evidence strong enough that we treat it as fact," distinct from "S is brave enough to act." The Attributor is penalized for certifying a false belief, not for certifying a risky bet.

  **What Could Go Wrong:**
  1.  **The "Safe Bet" Strategy:** Attributors might always say "Doesn't Know" to avoid penalty.
      *   *Fix:* Attributors get a token for every correct "Knows" attribution. They must balance risk and reward.
  2.  **Empathy Bleed:** In Round 2 (High Subject Stake), the Attributor feels the Subject's stress and raises their own stakes internally.
      *   *Fix:* This is actually a feature, not a bug. It shows how hard it is to separate the contexts. We will discuss this in the debrief.
  3.  **Ambiguity Failure:** The evidence is too clear or too vague.
      *   *Fix:* Pilot the materials yourself. The ambiguity must be in the "Gettier zone"—justifiable belief, but shaky.

  ---

  ### Simulation Design: "The Verification Protocol"

  **Roles:**
  *   **The Agent (Subject):** The person who must act on the evidence.
  *   **The Auditor (Attributor):** The person who must certify whether the Agent *knows* the evidence is sound.
  *   **The Arbiter (You):** Holder of the Ground Truth.

  **Materials:**
  *   **7 Case Folders:** Each contains two printed sheets ("Document A" and "Document B"). They are 95% identical. One contains a specific, ambiguous discrepancy (e.g., a date that reads "2023" but the '3' is smudged, or a figure that looks like "500" but might be "600"). *You know the truth for each case.*
  *   **Token Sheets:** Each pair gets a sheet with 10 printed "Seminar Tokens."
  *   **Verdict Slips:** Small slips of paper for writing "KNOWS" or "DOES NOT KNOW."
  *   **Stakes Cards:** Three cards per pair, labeled Round 1, Round 2, Round 3, detailing the token costs.

  **The Stakes Scheme (Seminar Tokens):**
  Tokens are not money. They are currency for **Privileges**.
  *   **Value:** 3 Tokens = One 24-hour extension on any seminar essay. (Or: Choice of one seminar reading text).
  *   **Endowment:** Each pair starts with 10 Tokens.
  *   **Penalty Structure:**
      *   **Agent:** If they act (claim "Match") and are Wrong → Lose Tokens.
      *   **Auditor:** If they certify ("Knows") and Agent is Wrong → Lose Tokens.
      *   **Reward:** If Agent is Right and Auditor certifies "Knows" → Gain 1 Token (encourages certification, prevents "always say no" strategy).

  **Stakes Conditions:**
  *   **Round 1 (Baseline):** Agent Risk: 1 Token. Auditor Risk: 1 Token.
  *   **Round 2 (High Agent Stakes):** Agent Risk: 5 Tokens. Auditor Risk: 1 Token.
  *   **Round 3 (High Auditor Stakes):** Agent Risk: 1 Token. Auditor Risk: 5 Tokens.

  ---

  ### Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10 | Introduction & Setup**
  *   Arrange chairs in 7 pairs.
  *   Distribute Case Folders (sealed), Token Sheets, and Verdict Slips.
  *   **Script:** "We are running a verification protocol. You are not testing your eyesight; you are testing your standards for 'knowledge.' The Agent decides if the documents match. The Auditor decides if the Agent *knows* they match. Tokens buy extensions. Lose tokens, lose privileges. Do not open the folders yet."
  *   Define "Knows" for the game: "To say the Agent 'Knows' means you are willing to stake your tokens on the truth of their belief, not just their confidence."

  **00:10 – 00:25 | Round 1 (Low/Low)**
  *   Reveal Stakes Card 1 (1 token risk each).
  *   Agents review evidence (3 mins). Agents decide "Match" or "No Match."
  *   **Crucial Step:** Agents write their decision on a slip, fold it, but *do not speak*.
  *   Auditors review the Agent's process (not the documents, only watching the Agent work) and write "KNOWS" or "DOES NOT KNOW" on a Verdict Slip.
  *   Collect Verdict Slips immediately. (Do not reveal truth yet).
  *   Update Token Sheets based on your secret Ground Truth.

  **00:25 – 00:40 | Round 2 (High Agent Stakes)**
  *   Swap Roles (Agent becomes Auditor, vice versa). *Note: Swapping controls for individual risk tolerance.*
  *   Reveal Stakes Card 2 (Agent risks 5, Auditor risks 1).
  *   **Script:** "The Agent now has much more to lose if they are wrong. The Auditor's risk is unchanged."
  *   Repeat evidence review and silent verdict writing.
  *   Collect Verdict Slips. Update Tokens.

  **00:40 – 00:55 | Round 3 (High Auditor Stakes)**
  *   Keep Roles from Round 2 (or swap back, consistency matters less than stakes). Let's keep Roles from Round 2 to maintain continuity of the specific pair dynamic.
  *   Reveal Stakes Card 3 (Agent risks 1, Auditor risks 5).
  *   **Script:** "The Agent is safe. The Auditor now has much more to lose if they certify a falsehood."
  *   Repeat evidence review and silent verdict writing.
  *   Collect Verdict Slips. Update Tokens.

  **00:55 – 01:05 | The Reveal & Data Aggregation**
  *   Reveal the Ground Truth for all 7 cases.
  *   Calculate final token counts.
  *   **Board Work:** Draw a 3x2 grid on the board.
      *   Rows: Round 1, Round 2, Round 3.
      *   Columns: % of "KNOWS" verdicts.
  *   Ask each pair to shout their Round 1, 2, and 3 verdicts. Fill the grid live.
  *   *Expected Pattern:* Round 1 (High % Knows). Round 2 (Lower % Knows). Round 3 (Lower % Knows).

  **01:05 – 01:30 | The Debrief (The Philosophical Collision)**
  *   See detailed guide below.

  ---

  ### Debrief Guide: From Data to Theory

  **Phase 1: The Phenomenon (10 mins)**
  *   **Ask:** "Look at the board. The evidence in the folders was identical in all three rounds. The ambiguity didn't change. Why did the word 'Knows' become harder to write?"
  *   **Goal:** Get them to admit that *stakes* changed the truth value of the attribution.
  *   **Your Move:** Validate their experience. "It felt like the knowledge evaporated. That is the phenomenon we need to explain."

  **Phase 2: Distinguishing the Explanations (10 mins)**
  *   **Ask:** "Compare Round 2 and Round 3. In Round 2, the *Agent* was sweating. In Round 3, the *Auditor* was sweating. Did the verdicts shift differently?"
  *   **Scenario A (Encroachment Signal):** If Round 2 verdicts dropped significantly more than Round 3.
      *   *Student Insight:* "It matters what the person acting has to lose."
      *   *Label:* **Pragmatic Encroachment.** Knowledge depends on the Subject's stakes.
  *   **Scenario B (Contextualism Signal):** If Round 3 verdicts dropped significantly more than Round 2.
      *   *Student Insight:* "It matters what the person speaking/judging has to lose."
      *   *Label:* **Epistemic Contextualism.** Knowledge attributions depend on the Attributor's context.
  *   **Scenario C (The Likely Reality):** Both dropped.
      *   *Student Insight:* "Both matter."
      *   *Your Move:* "Philosophers fight over which one is the *real* engine. But you've just seen why the fight is so hard. They predict the same smoke."

  **Phase 3: The Crux (5 mins)**
  *   **Ask:** "In Round 2, did the Agent actually lose evidence? Did they become stupider?"
  *   **Goal:** Reinforce that evidence was constant. The *threshold* for knowledge moved.
  *   **Ask:** "In Round 3, did the Auditor become more skeptical of the evidence, or more scared of the penalty?"
  *   **Goal:** Highlight the difficulty of separating 'fear of being wrong' from 'standards for knowledge.'

  ---

  ### Troubleshooting: What Will Go Wrong

  **1. The "Safe Harbor" Strategy**
  *   *Problem:* Auditors realize that saying "DOES NOT KNOW" is never penalized (in your design, only false certifications are penalized). They spam "DOES NOT KNOW" to protect tokens.
  *   *Symptom:* Round 1 "Knows" rate is already low.
  *   *In-the-Moment Fix:* Remind them of the **Reward**. "If you say 'Knows' and they are right, you gain a token. If you always say 'No', you cannot win the extension. You must take a risk to earn the prize."
  *   *Post-Hoc:* If data is skewed, acknowledge it. "You played it safe. That proves the stakes bit. But let's imagine you were willing to risk..."

  **2. The Stakes Don't Bite**
  *   *Problem:* Students treat tokens as Monopoly money. They laugh when they lose 5 tokens.
  *   *Symptom:* No change in verdicts across rounds.
  *   *In-the-Moment Fix:* **Escalate Publicly.** "Pair 3 just lost their extension privilege. That means their essay is due tonight at midnight, not tomorrow." Make the loss concrete. Pause the room. Let the silence sit.
  *   *Prevention:* Ensure the "Prize" is something they genuinely want (extension is usually the gold standard).

  **3. Empathy Bleed (The Confound)**
  *   *Problem:* In Round 2 (High Agent Stakes), the Auditor feels bad for the Agent and raises their own standards, effectively turning High Agent Stakes into High Auditor Stakes.
  *   *Symptom:* Round 2 and Round 3 look identical.
  *   *In-the-Moment Fix:* Do not fix it. **Use it.**
  *   *Debrief Point:* "This is the hardest part of the philosophy. When the Subject's stakes go up, does the Attributor's context *automatically* change? If you can't separate them in a game, can you separate them in reality?" This validates the difficulty of the distinction.

  **4. Demand Characteristics**
  *   *Problem:* Philosophy students are smart. They guess you want the verdicts to change.
  *   *Symptom:* Verdicts shift perfectly with stakes, but students look smug.
  *   *In-the-Moment Fix:* Emphasize the **Individual Written Verdict**. "I am collecting the slips before anyone speaks. If you lie on the slip, you hurt your own token count. Play for the tokens, not for me."

  ---

  ### Limitations: What This Activity Cannot Do

  You must close the session by acknowledging what the simulation leaves out. This protects your intellectual honesty and prevents students from thinking the game *is* the theory.

  **1. The "Truth" Problem**
  *   *Limitation:* In the game, *you* held the Ground Truth. You knew if the documents matched. In real life (and in your investigation), there often *is* no accessible Ground Truth.
  *   *What to say:* "In this game, I was God. I knew the facts. In your workplace, and in most of life, there is no Arbiter. We have to act without knowing if we knew. That makes the stakes even heavier."

  **2. The Social Cost**
  *   *Limitation:* The game penalizes token loss. It does not simulate the loss of reputation, trust, or the emotional toll of an investigation.
  *   *What to say:* "Tokens are cheap. Trust is expensive. When knowledge curdles in the real world, it's not just about points. It's about whether your colleagues can still rely on your word. That social dimension is what makes the epistemic shift so painful."

  **3. The Separation Illusion**
  *   *Limitation:* As noted in troubleshooting, we couldn't fully separate Subject and Attributor stakes because humans are empathetic.
  *   *What to say:* "We tried to pull these two variables apart. You felt how hard they were to separate. Some philosophers say that's because they are actually the same thing. Others say we just need better tools. You've now felt the knot, even if you haven't untied it."

  **4. The Normative Gap**
  *   *Limitation:* The game shows how we *do* behave. It doesn't prove how we *should* behave.
  *   *What to say:* "Just because stakes change our verdicts doesn't mean they *should*. Maybe we are being irrational. Maybe we are being rational. The simulation gives us the data; the philosophy gives us the judgment."

  ---

  ### Final Note to the Instructor

  You mentioned that until recently, this material was "bloodless" to you. Now it is not. When you run this, do not hide that.

  In the debrief, when the tokens are counted and the verdicts are on the board, you can say: *"I designed this because I recently lived through a situation where the evidence didn't change, but the knowledge disappeared. I want you to have a vocabulary for that feeling before you read the papers that try to explain it."*

  This validates their confusion and positions the theory as a tool for survival, not just classification. That is how you make epistemology breathe.
