      *   *Actually, let's be nuanced.* The Skeptic's view is logically tighter but phenomenologically costly. The Compatibilist's view is phenomenologically accurate but metaphysically slippery. I'll say the Compatibilist faces the harder problem of *demarcation*. What would move me? A clear account of downward causation that isn't just shorthand for complex upward causation.

