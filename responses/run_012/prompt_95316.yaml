answer: |-
  You have identified a structural tension between the logic of causation and the rhetoric of narrative history. Your actuarial intuition is correct: the "conservation law" you observe is not a feature of the world, but a feature of the *explanation*.

  Here is the carving you requested. It separates the ontological claims (how the world worked) from the epistemological artifacts (how the story is told), assigns existing terminology where it fits, and coins a precise term for the phenomenon that currently lacks one.

  ### 1. The Logical Structure: Disjunctive Overdetermination

  The logical shape you describe—where $A \rightarrow Outcome$, $B \rightarrow Outcome$, and the historian claims $(\neg A \land B) \rightarrow Outcome$—is a specific subset of **Overdetermination**.

  In philosophy of causation (following J.L. Mackie), standard overdetermination usually implies that multiple causes *actually occurred* and each was sufficient. However, historians often employ **Counterfactual Overdetermination**. They assert that while $A$ and $B$ both happened, the outcome was *robust* enough that either alone would have sufficed.

  *   **Does "Overdetermination" fit?** Yes, but it is too narrow. It names the logical relationship between the causes and the effect, but it does not account for the *re-weighting* phenomenon you observed when a cause is refuted. Overdetermination is a state of the world; your observation is about the stability of the *story*.

  ### 2. The Statistical Artifact: Conceptual Multicollinearity

  Your third feature—where "artillery," "tactics," and "fortifications" are listed as independent causes despite being manifestations of a single underlying variable (military technology shift)—is **Multicollinearity**.

  In regression analysis, this occurs when predictor variables are highly correlated, making it impossible to isolate the individual effect of any single variable. When historians list correlated manifestations as independent causes, they are inflating the degrees of freedom in their explanation.

  *   **Why this matters:** If causes are collinear, the claim that "the outcome would have happened anyway" is untestable. You cannot remove "artillery" without removing "tactics," because they are part of the same technological package. This creates the *illusion* of redundancy (Disjunctive Overdetermination) where there is actually just a single complex cause described three times.

  ### 3. The Rhetorical Mechanism: Explanatory Homeostasis

  This is the core of your observation: the "conservation law" where causal weight is redistributed when a cause is removed, leaving the total explanatory force unchanged.

  There is no standard term for this in history or philosophy, because it is generally considered a flaw rather than a feature. I propose the term **Explanatory Homeostasis**.

  **Definition:** *Explanatory Homeostasis* is a rhetorical dynamic in narrative history wherein the certainty of the outcome (which is known to have happened) is treated as a fixed constant, and the causal variables are adjusted to solve for that constant. When one variable is removed (refuted), the coefficients of the remaining variables are automatically increased to maintain the sum total of "explanatory sufficiency."

  *   **World vs. Artifact:** This is entirely an artifact of how explanations get written. In the real world (and in actuarial models), if you remove a sufficient cause, the probability of the outcome should drop, unless another *independent* sufficient cause was definitely present. In historical narrative, the outcome is treated as having probability $P=1$ (because it is the past). Therefore, the sum of the causes must always equal $1$. If you subtract $0.2$ from the left side, you must add $0.2$ to the right side to keep the equation balanced.
  *   **Why it happens:** Historians are under pressure to provide a "complete" explanation. A explanation that shrinks when a fact is refuted looks like a *weaker* explanation, even if it is a more *accur*ate one. Explanatory Homeostasis preserves the authority of the narrative in the face of factual erosion.

  ### 4. The Ranking Problem: Depth vs. Propensity

  You asked if the ranking of causes (deep vs. immediate) is defensible given the redundancy.

  *   **Logically:** No. If $A$ and $B$ are both sufficient causes ($P(O|A)=1, P(O|B)=1$), they are causally equivalent regarding the outcome. Ranking them by "importance" is category error.
  *   **Defensibly:** It is only defensible if the historian shifts from *deterministic* causation to *probabilistic* causation.
      *   *The Actuarial View:* You cannot rank them by causal power (both are 100%). You can only rank them by **Propensity** (how likely was $A$ to occur vs. $B$?) or **Timing** (which one crossed the threshold first?).
      *   *The Historian's View:* When they rank "deep" causes (e.g., social unrest) above "trigger" causes (e.g., a assassination), they are usually ranking **Conditions** vs. **Events**. A "deep cause" is often a high-probability background condition that lowers the threshold for a trigger.
      *   **Verdict:** In a system of Disjunctive Overdetermination, ranking is a **Rhetorical Residue**. It is an attempt to impose a hierarchy on a flat logical structure. It persists because narrative requires protagonists and antagonists, or tensions and releases, rather than a flat list of sufficient conditions.

  ### Summary of the Structure

  To determine if a historical account exhibits the pattern you describe, apply this diagnostic test:

  1.  **Test for Disjunctive Sufficiency:** Does the author claim that for any cause $C_i$ on the list, $Outcome$ would have occurred even if $\neg C_i$? (If yes, this is Overdetermination).
  2.  **Test for Multicollinearity:** Are the listed causes conceptually independent, or are they correlated manifestations of a single underlying factor? (If correlated, the redundancy is artificial).
  3.  **Test for Explanatory Homeostasis:** If a cause is removed or refuted, does the author admit the outcome becomes less certain, or do they increase the weight of the remaining causes to maintain the same level of inevitability? (If the latter, this is Explanatory Homeostasis).

  ### The Carving

  *   **Ontological Claim:** The world may indeed exhibit **Equifinality** (systems theory) or **Redundant Causation**. It is possible that multiple distinct paths could have led to the French Revolution. This is a claim about the world.
  *   **Epistemological Artifact:** The **Explanatory Homeostasis** and the **Ranking** are claims about the narrative. They are artifacts of writing history backwards from a known conclusion.

  **Conclusion:** You are looking at **Disjunctive Overdetermination** (the logic) wrapped in **Explanatory Homeostasis** (the rhetoric), often padded with **Conceptual Multicollinearity** (the error).

  The "conservation law" you sensed is the historian's unconscious commitment to **Teleological Certainty**. Because the outcome is fixed in the past, the explanation must be fixed in the present. Causes are not inputs that determine an output; they are variables adjusted to justify a known constant. In your trade, this would be akin to adjusting your mortality assumptions until the premium matches the price you already sold the policy for.
