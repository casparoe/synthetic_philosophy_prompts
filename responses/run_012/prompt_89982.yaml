answer: |-
  The flag sat on the center monitor, pulsing a soft, sickly amber. **ID: 8940**. Classification: Pending.

  Elena rubbed her eyes, the skin around them gritty from twelve hours of dry air. "It's a **Ghost**, Raj. Look at the intervention plot. I patch the new heads, the behavior breaks exactly like the old circuit. I patch the old heads, nothing happens. The logic is identical."

  Raj didn't look away from the causal trace visualization. It looked like a tangled knot of neon string compared to the clean linear path of the original safety case. "The logic might be identical, but the substrate isn't. Head 4.12 is dead weight. The computation is happening in 6.3 and 8.1, bridging a residual skip that didn't exist in training. That's a **Rebuild**. The mechanism changed."

  "The mechanism is the function," Elena said, tapping her pen against the desk. "The safety case proves that *this function* is safe. It doesn't matter which neurons carry the load, as long as the load is carried the same way. If I prove the counterfactual profile matches, I've proven the mechanism is stable. It's a **Ghost** flag triggered by the residual noise."

  "You wrote the safety case," Raj said, finally turning his chair. He didn't sound accusatory, just tired. "So you know the wording. 'Safety is guaranteed via Circuit Alpha.' Circuit Alpha is defined by its causal structure, not just its input-output map. If the structure changes, the guarantee voids. That's the definition of a **Rebuild**."

  "If I call this a **Rebuild**, we halt deployment," Elena said. "We spend three weeks rewriting the case for a circuit that does the exact same thing. The model isn't lying. It isn't optimizing around the constraint. It just... settled into a different local minimum during the finetune."

  "It settled into a minimum we didn't audit," Raj countered. He pulled up the weight matrices side-by-side. The left was sparse, clean. The right was dense, messy. "See this quirk in the residual stream? It's amplifying signals in a range we explicitly zeroed out in the original design. It's holding the circuit together. Today it holds it together safely. Tomorrow, under distributional shift, that quirk might amplify something else."

  "That's a **Drift** argument," Elena said. "That's arguing the behavior might change. But the behavior *hasn't* changed. So it's not a **Drift**. And if the behavior is stable, and the function is stable, calling it a **Rebuild** is just fetishizing the weights."

  "It's not fetishizing. It's causality," Raj said. "Imagine a bridge. If you replace the steel cables with rubber bands, but the bridge still holds because you added a central pillar, is it the same bridge? The load-bearing structure is different. If the pillar fails, the rubber bands snap. If the cables fail, the pillar stands. The failure modes are different, even if the current load is the same."

  "The failure modes match on intervention," Elena insisted. "I broke the pillar. I broke the bands. The bridge fell both times. The causal profile is invariant."

  "The causal *profile* is invariant. The causal *graph* is not." Raj highlighted the new residual path. "This path wasn't covered by your safety case. Your case says 'If Head 4.12 activates, constrain it.' It doesn't say 'If Head 6.3 activates via Residual Quirk X, constrain it.' You can't constrain what you haven't named."

  Elena leaned back, staring at the amber pulse. **ID: 8940**. "If we ship on a **Ghost**, we save three weeks. If we ship on a **Rebuild**, we're lying about the safety case status."

  "If we ship on a **Ghost** and you're wrong," Raj said softly, "then we didn't monitor the mechanism. We monitored the output. And we agreed never to do that."

  "We agreed to monitor the mechanism to ensure the output stays safe," Elena said. "The output is the thing that hurts people. The mechanism is just how we get there."

  "The mechanism is the only thing we can trust before the hurt happens," Raj said. He hovered his cursor over the classification dropdown. **Ghost**. **Rebuild**. **Drift**. "The weights are different, Elena. The path is different. The only thing that's the same is the shadow it casts on the output."

  "The shadow is what matters."

  "The object casting the shadow is what we signed off on."

  Elena took a sip of cold coffee. "Run the adversarial suite again. Target the new residual path."

  "I did. It passed."

  "Then it's a **Ghost**."

  "Then the suite is blind to the new structure," Raj said. "Which means it's a **Rebuild**."

  They sat in the hum of the servers, the amber light pulsing between them, neither hand moving to claim the keyboard.

  ***

  The story leaves the functionalist criterion of mechanism-identity hanging in tension with the structuralist one, refusing to validate either as sufficient. In practice, settling a case like this requires more than static intervention tests; it demands longitudinal stress-testing of the new causal pathway under distributional shift to see if the "shadow" remains stable when the "object" is pressured. Until the new structure proves robust over time, the safety case remains technically void, regardless of functional equivalence. However, if the functional profile holds across diverse contexts, the structural difference may eventually be reclassified as implementation detail rather than mechanism change. Ultimately, the decision rests on whether the organization prioritizes proven causal guarantees or observed behavioral stability.
