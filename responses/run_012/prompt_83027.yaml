      Naturally, he decided this method should rule ethics, politics, and physics. Then, he decided he had squared the circle. John Wallis, the Savilian Professor of Geometry at Oxford, explained why this was impossible. Hobbes published a response. Wallis demolished it. Hobbes published again. Wallis demolished him again. This went on for twenty years. Hobbes never conceded.

