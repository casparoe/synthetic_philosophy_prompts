  9.  **Tone:** Academic, rigorous, "in the weeds," avoiding history lessons. Focus on argument structure.

  10. (Self-Correction during drafting): Make sure to explicitly answer the "what commits you to X that the other doesn't" prompt clearly. Ensure the distinction between "uncountable in the model" and "uncountable simpliciter" is sharp.

  11. *Final Polish:* Check against constraints. No history tour. Focus on comparison. Ensure the "Categoricity" question is answered directly.

  *(Self-Correction on the "Categoricity" point)*: I need to be careful. Saying "Categoricity is the real issue" is often a way of saying "We need Second Order Logic." If someone says "The problem is just non-categoricity," they are implicitly endorsing the Deflationary view that FOL is the culprit, not the concepts. I should frame it as: Categoricity is the *diagnosis* preferred by Deflationists, but rejected as a *cure* by Relativists.

  *(Refining the Verdict)*: I should argue that the dispute is substantive *about the nature of meaning*, not about the math. The math is agreed upon. The fight is over whether meaning is determined by use/theory (Relativity) or by something external (Deflationary/Realist).

