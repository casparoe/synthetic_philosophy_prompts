answer: |-
  Your colleague is mistaken because Hume explicitly argues that a standard of taste exists precisely *despite* the fact that beauty exists only in the mind, distinguishing between the irreducibility of sentiment and the corrigibility of judgment. Hume does commit to the premise your colleague cites—that beauty is no quality in things themselves but exists merely in the mind which contemplates them—and he agrees that all sentiment is right in itself because it refers to nothing beyond the feeling it produces. However, your colleague stops at this premise and ignores Hume's subsequent argument that while sentiments themselves cannot be disproven, the *judgments* we form about the objects causing them can be erroneous. Hume's project in the essay is not to dissolve aesthetic normativity but to reconstruct it on an empirical basis, positing a "standard of taste" found in the joint verdict of true critics who possess specific qualifications: delicacy of imagination, freedom from prejudice, practice, comparison, and good sense. He validates this standard through test cases, such as the analogy of wine tasters who can detect minute ingredients (the leather and iron) that others miss, and the historical test of works that endure across cultures and centuries, arguing that these phenomena prove a uniformity in human nature that makes some aesthetic responses more valid than others.

  Your colleague gets right Hume's claim that taste belongs to sentiment rather than abstract judgment in the metaphysical sense, and correctly notes that Hume denies beauty is an objective property like mass or shape. Where your colleague gets Hume wrong is in inferring from this subjectivity that "there is no disputing taste" in the normative sense; Hume explicitly rejects this proverbial wisdom, arguing that we do dispute taste when we argue about the *merits* of the object, not the reality of the feeling. The confusion lies in conflating the privacy of the feeling with the public validity of the cause; for Hume, you are not entitled to tell a student their feeling is fake, but you are entitled to tell them their judgment is defective if it arises from a lack of delicacy, prejudice, or inexperience. The standard is not imposed from outside human nature but discovered within it, meaning your corrections are not merely smuggling in personal preference but appealing to the features that would strike a properly functioning mind equipped with the requisite practice and comparison.

  A genuine difficulty remains, however, even once this misreading is cleared away, concerning the circularity of Hume's standard and its application to pedagogy. Hume admits that the true critics are those who agree on the best works, and the best works are those agreed upon by the true critics, leaving the standard grounded in an empirical consensus that may simply privilege dominant cultural norms rather than universal truths. Furthermore, while Hume justifies the authority of the ideal critic, he offers less guidance on the authority of a teacher judging students who are not yet critics; you are effectively judging them against a standard they have not yet developed the capacity to perceive, which risks appearing as imposition until you can successfully train their delicacy. Thus, while Hume grants you the philosophical authority to claim one passage is better than another based on the joint verdict of qualified readers, the pedagogical challenge is to demonstrate that your verdict stems from the conditions of the standard (practice, comparison, freedom from prejudice) rather than from the very prejudice Hume warns against.
