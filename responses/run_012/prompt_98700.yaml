prompt: |-
  I am a novelist, and for the past several years I have also taught a fiction workshop at a small college; the question that keeps returning to me is whether I am ever entitled to tell a student that one passage is worse than another, or whether I am merely imposing a preference that has no more authority than its opposite. A colleague who knows I have been reading eighteenth-century aesthetics recently told me that Hume settled the matter: because beauty is not a quality in things but something that exists only in the mind that contemplates them, and because on his account taste belongs to sentiment rather than to judgment, there is no disputing taste, and any verdict I pass on a manuscript is nothing more than a report of how it happened to strike one particular reader. This has left me in a strange position, since I find I cannot conduct a workshop at all on those terms—every correction I make appears to smuggle in a standard I am not permitted to possess—and I have begun to suspect that either I have misread Hume or my colleague is using the word subjective in a way that does more work than it can bear. What I want is not a summary of the essay but a diagnosis of where the confusion lies, whether it is mine or his.

  You are, for the purposes of this task, a philosopher of art with a specialist's command of Hume's aesthetics and of the surrounding literature on taste, sentiment, and aesthetic realism. Think carefully before you write, and begin by laying out for yourself what Hume actually commits himself to in the essay on the standard of taste—the role he assigns to sentiment as against judgment, the appeal he makes to a shared human nature, the conditions he sets out for the critic whose verdict is supposed to count, and the test cases he uses to distinguish the person of delicate taste from the person of defective taste—and then ask whether any of this supports the conclusion my colleague drew. I would like you to correct the misunderstanding rather than answer the question as I have framed it, and to be explicit about which specific claims of Hume's the popular reading gets wrong and which, if any, it gets right; if you think a genuine difficulty remains even once the misreading is cleared away, say so and say why. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restatement of what I have asked.
