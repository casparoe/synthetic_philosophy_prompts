answer: |-
  You have correctly identified a boundary condition of standard decision theory, and your suspicion is well-founded: there is no single, canonical noun (like "the Ostrich Paradox") that exclusively names this specific configuration in the way "Moral Hazard" names a principal-agent problem. However, the phenomenon is not unnamed in the literature; it is simply described by the assumptions it violates rather than by a standalone label.

  The configuration you are describing is **Negative Value of Information under Belief-Dependent Utility**, constrained by **Epistemic Commitment Failure**.

  Here is the precise carving of the concept, where it fits in the literature, and a proposed term for the specific mechanism you identified.

  ### 1. The Established Framework: Belief-Dependent Utility
  The standard proof that the value of information (VoI) cannot be negative (often attributed to Good or Blackwell) relies on an assumption of **Consequentialism**. It assumes that an agent's utility depends *only* on the state of the world ($\omega$) and the action taken ($a$).
  $$U = U(a, \omega)$$
  In this framework, if you receive information, you can always choose the action $a_{\text{uninformed}}$ that you would have chosen without the information. Since you have the same action space and a better map of the world, you cannot be worse off.

  Your medical prognosis case violates this. In your example, utility depends on the **belief state** ($\pi$) itself, not just the outcome.
  $$U = U(a, \omega, \pi)$$
  This is formally known in behavioral economics and psychology as **Belief-Dependent Utility** (or **Anticipatory Utility**, following Caplin & Leahy, 2001). When utility depends on beliefs, acquiring information changes the utility function itself, not just the constraints. If the new belief (e.g., "I am terminal") lowers utility directly (via anxiety, loss of hope) more than the improved action selection raises it, the net value of information is negative.

  ### 2. The Specific Mechanism: Epistemic Commitment Failure
  You noted that the "option to ignore" is formally available but practically foreclosed. In standard theory, "ignoring" means choosing the same *physical action*. In your case, the agent cannot choose the same *mental state*.

  The agent cannot commit to maintaining the prior belief distribution after observing the signal. This is a **Commitment Problem over Beliefs**. While "Time Inconsistency" usually refers to preferences over time, your case is a **Dynamic Inconsistency of Belief Management**. The *ex-ante* self prefers the *ex-post* self to remain ignorant, but the *ex-post* self is constitutionally incapable of ignoring the signal.

  There is no standard single word for this, but the most precise descriptive term is **Epistemic Commitment Failure**. It distinguishes the problem from:
  *   **Information Aversion:** This is the *ex-ante preference* to avoid info (the result of your configuration).
  *   **Strategic Ignorance:** This is the *action* of avoiding info.
  *   **Signaling:** This is the *interpersonal* consequence (your bargaining example).

  ### 3. Proposed Terminology
  If you require a term to distinguish this specific *structural constraint* (the inability to decouple belief from welfare) from the broader category of belief-dependent utility, I suggest:

  **Doxastic Lock-in**
  *(From "doxa," belief. It captures the inability to exit the informed state.)*

  Or, more formally:
  **Involuntary Belief-Dependent Disutility**

  However, in conversation with decision theorists, the phrase **"Violation of Consequentialism via Belief-Dependent Preferences"** will be instantly understood.

  ### 4. The Edges: A Definition with Boundaries
  To ensure this concept is not confused with its neighbors, here is the carving you requested:

  **The Definition:**
  A configuration where free, reliable information has negative expected value because the agent's utility function is non-separable with respect to beliefs, and the agent lacks the cognitive technology to decouple belief revision from welfare evaluation.

  **Case Plainly Inside (The Prognosis):**
  A patient takes a test for a incurable condition.
  *   *Info:* Free, True.
  *   *Action:* No medical action changes the outcome.
  *   *Utility:* Depends on "Hope" (a function of belief).
  *   *Constraint:* The patient cannot psychologically "file away" the result; their subjective well-being drops immediately upon updating.
  *   *Verdict:* **Doxastic Lock-in.** VoI is negative.

  **Case Plainly Outside (The Costly Signal):**
  A spy buys a codebook for \$1 million to learn enemy movements.
  *   *Info:* True.
  *   *Utility:* Depends only on outcomes (win/loss).
  *   *Constraint:* None.
  *   *Verdict:* **Standard VoI.** If the info is worth less than \$1M, it's negative value due to *cost*, not structure. This is outside your definition.

  **Case Plainly Outside (The Bargainer):**
  A negotiator learns the opponent's bottom line, but the opponent sees them react and withdraws the offer.
  *   *Info:* True.
  *   *Utility:* Depends on outcomes.
  *   *Constraint:* The harm comes from the *other* player's strategy change.
  *   *Verdict:* **Signaling / Game Equilibrium Shift.** This is interpersonal, not intrapersonal. This is outside your definition.

  **Case Plainly Outside (The Irrational Updater):**
  A gambler learns the odds are against them but updates to believe they are "due for a win" (Gambler's Fallacy).
  *   *Info:* True.
  *   *Utility:* Depends on outcomes.
  *   *Constraint:* The agent updates *badly*.
  *   *Verdict:* **Bounded Rationality.** You excluded this in your prompt ("not updating badly").

  ### 5. Why Your Description Overshoots (Slightly)
  You wrote: *"The loss is not in the content of what is learned but in the fact that the learner cannot remain the agent they were."*

  This is philosophically precise but technically, the loss *is* in the content, because the content changes the belief variable $\pi$ which is an argument in $U$. However, your point stands that the loss is not in the *instrumental value* of the content (guiding action), but in its *consumption value* (changing the state of mind).

  The operative mechanism is **not** the stickiness of belief (that would be conservatism/bias). It is not the impossibility of self-commitment (that implies a struggle; here the struggle is lost by design). It is the **Non-Separability of Belief and Welfare**.

  ### Summary
  You are not missing a term because the field treats this as a modification of the **Utility Function** (Belief-Dependent Utility) rather than a configuration of **Information**.

  *   **The Concept:** Negative Value of Information with Belief-Dependent Preferences.
  *   **The Constraint:** Epistemic Commitment Failure (or Doxastic Lock-in).
  *   **The Violation:** Consequentialism (the assumption that only outcomes matter).

  If you need to name it in a paper or argument, **"Epistemic Commitment Failure"** is the most robust neologism. It signals that the agent is unable to commit to a coarse information structure, forcing a fine structure that degrades welfare due to belief-dependent preferences.
