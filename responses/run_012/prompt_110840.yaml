prompt: |-
  Two of my friends have been arguing for months about whether LLMs are agents, and I want to force them to write the thing they should've written a year ago: a joint statement of an adversarial collaboration, which both of them could sign. One of them is a hard-nosed "it's a policy" person -- the model has goals in the ordinary sense, its chain of thought is deliberation, RLHF trains an agent. The other is a simulator person -- the network computes a distribution over continuations, and every agent you think you see is a character inside that distribution, the assistant persona included, so the model doesn't have goals, it computes the goals of whoever it's currently simulating.

  Draft that document. I want the claims they can both sign (about the mechanics of next-token prediction and RLHF, about what would count as evidence either way, about the fact that they predict the same observable behavior in nearly every case); the precise points of disagreement, each phrased the way its own side would want it phrased; the cruxes -- I suspect one is whether "the model wants X" is a claim about mechanism or just about the best predictive abstraction, and another is whether there's any fact of the matter about the model's goals as opposed to the persona's; and for each crux, a case or experiment both sides agree would bear on it, with each side's prediction recorded in advance. If some of the dispute turns out to be verbal, say which part and why, and don't paper over it.

  Please be upfront about which of these claims are actually settled among people who work on this and which are live disagreements, rather than presenting a contested picture as the consensus. Numbered agreed-claims section, then a disagreements table.
