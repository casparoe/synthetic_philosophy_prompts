      *   *Smuggled Features:* The idea that "indispensable inputs" means "unpartitionable variance" is the main smuggling. The rectangle shows indispensability of *presence*, not indispensability of *variation*.

  3.  **Evaluate the Factory Analogy (ANOVA/Variance Decomposition):**

