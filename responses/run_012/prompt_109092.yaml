          *   Critique: Confuses *necessity* with *variance explanation*. A rectangle needs length, but if length is constant, it explains 0% of area *variance*.
          *   Claim Check: Modest (False for variance, True for means), Strong (False), Practical (True, but not because of the rectangle logic).
