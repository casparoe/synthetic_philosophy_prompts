      *   *What would change my mind:*
          *   Evidence that $h^2$ estimates are fundamentally unstable across all contexts (making the factory analogy useless).
          *   Demonstration that G-E correlation is so pervasive that variance decomposition is mathematically impossible (not just hard).
          *   A better philosophical argument that "variance" is not the right metric for "causation."

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the request.
      *   *Section 1: The Rectangle Audit.*
