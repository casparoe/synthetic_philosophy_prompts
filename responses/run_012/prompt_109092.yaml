      *   Candidate Idea: A "Recipe in a Context" analogy? Or perhaps "Shadows"?
      *   Better Idea: **The "Shadow Analogy"** (often used by Plomin or similar, but needs refinement). Or **"The Seed in Soil"** (classic, but often misused).
      *   Let's stick to the prompt's request: "What a genuinely illuminating analogy would have to preserve." I don't need to invent a new one, just define the constraints.
      *   Actually, the prompt asks: "If neither survives, say what a genuinely illuminating analogy would have to preserve." The Factory analogy survives better than the Rectangle. I should acknowledge that. But I need to define the ideal features.
