prompt: |-
  Okay, I need you to help me turn a half-formed idea into a real research proposal, and I should warn you it came out of an argument. My friend and I burned like two hours last night going in circles about knowing how vs. knowing that, and somewhere in the middle of it I realized we weren't even fighting about the same thing. I want to see if there's an actual project in that.

  Here's my hunch. The whole intellectualism vs. anti-intellectualism fight treats "knowing how" as one thing and then asks whether it's really a kind of propositional knowledge or really a kind of ability. I think at least three different things are getting run together: (1) the ability reading, where "she knows how to ride a bike" is basically "she can ride a bike"; (2) the method reading, where someone knows how the magician did the trick, or how the lock got picked, and can tell you all about it, but couldn't do it themselves for a million dollars; (3) "knowing how" as just the interrogative construction, i.e. knowing the answer to a how-question, which might not reduce to either of the other two. And the thing that got me going: my friend and I kept reaching into different buckets for our cases. They'd bring up the coach who can explain a movement perfectly and can't perform it; I'd bring up the person who rides beautifully and can't say a word about how. We each acted like our case was the case. Maybe the debate is stalemated because each side is quietly generalizing from a different sub-category.

  Side hunch I can't do anything with yet: "knowing how" seems gradable in a way "knowing that" isn't. You can know how to do something a little, or better than your teacher, or sort of know how to ski. Seems like that should tell us something about what kind of state it is, but I don't have the story.

  So: act like a professional philosopher of mind and language — someone who referees for the top journals in epistemology and philosophy of language and is hard to impress. Before you write anything, brainstorm out loud for a bit: lay out the candidate ways of carving up "knowing how," say which stock cases each carving handles well and which it fudges, and then tell me which framing gives the sharpest question. Show me that reasoning briefly, then write the proposal.

  The proposal itself is two pages, for a departmental thing that buys me one semester of course release, so the scope has to be honest for a single semester. I need: the question stated precisely enough that it has a determinate answer; why the existing positions leave it open; the method — what I'd actually do, week by week, not "read around"; what a result would look like and what would count as failure; and your read on whether this is semester-sized or secretly a career. Also tell me which of the obvious alternatives I should not do and why — just grinding on the puzzle cases, running an experiment, punting the whole thing to linguists.

  Couple of constraints. Don't give me citations, a bibliography, or a reading list — assume you can't look anything up, and talk about positions and arguments instead of names and dates; I'll fill in the references myself. And don't be nice about the framing. If the three-way split collapses, or turns out to be purely terminological with no argumentative payoff, say so and tell me what the salvageable question is.

  American English, please. And think carefully before you commit to a framing — I'd rather have one sharp question than three mushy ones.
