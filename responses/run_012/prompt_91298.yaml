answer: |-
  ### Brainstorming & Framing Evaluation

  Here's the hard truth: your three-way split is unstable. Categories (2) "Method" and (3) "Interrogative" are not distinct phenomena; they are the same thing viewed from different angles. Knowing the answer to "How do I pick this lock?" (Interrogative) just *is* knowing the method by which the lock is picked (Method). Both are standardly treated by intellectualists as propositional knowledge (knowing *that* this is the way). So you don't have three categories; you have the classic two: **Ability** (performance-based) vs. **Propositional** (content-based).

  However, your intuition about *why* the debate stalls is correct. The literature often treats "knows how" as univocal, forcing one side to explain away the other's paradigm cases as errors or derivatives. Your friend's coach case and your performer case aren't counterexamples to a unified theory; they are data points for two different senses of the verb phrase.

  The real leverage here isn't the split itself—philosophers have been gesturing at ambiguity for decades—it's your side hunch about **gradability**. Propositional knowledge ("knows that") is typically treated as binary and factive. You either know that Paris is in France or you don't; you can't "sort of" know it (unless you mean you believe it weakly, which is different). Ability is inherently gradable. You can ski poorly, better, or expertly.

  If "knows how" behaves linguistically like a gradable ability verb in some contexts and like a binary propositional verb in others, that is empirical evidence for semantic ambiguity. If it behaves like a gradable propositional verb (e.g., "I know a little bit about quantum mechanics"), that suggests a unified but complex state. This gives you a diagnostic tool rather than just another pile of intuition pumps.

  **The Sharpest Question:**
  Does the linguistic behavior of 'knows how'—specifically its compatibility with gradable modifiers and comparative structures—entail a semantic ambiguity between ability-involving and proposition-involving senses, and does resolving this ambiguity dissolve the central counterexamples in the intellectualism debate?

  ***

  ### Research Proposal

  **Project Title:** Gradability and Ambiguity: A Linguistic Diagnostic for the Intellectualism Debate

  **1. The Research Question**
  Standard debates between intellectualism (knowing how is a species of knowing that) and anti-intellectualism (knowing how is a species of ability) assume a unified target. This project asks: **Is the predicate 'knows how' semantically ambiguous, and can linguistic diagnostics regarding gradability and modification determine the boundaries of its distinct senses?** Specifically, I will test whether the gradability of 'knows how' tracks the ability sense exclusively, or if it applies equally to propositional uses, thereby forcing a revision of the standard binary view of propositional knowledge.

  **2. Why Existing Positions Leave This Open**
  Current positions are stalled because they generalize from selective case sets. Intellectualists prioritize cases where knowledge of a method exists without ability (the coach), treating ability as a contingent consequence. Anti-intellectualists prioritize cases where ability exists without articulable knowledge (the performer), treating explanation as a contingent report. Both sides treat the opposing cases as aberrations to be explained away rather than evidence of distinct semantic senses.

  Furthermore, existing accounts lack a rigorous linguistic test for distinguishing these senses. They rely on intuitive judgments about specific cases, which are notoriously unstable. Neither side adequately addresses the gradability of epistemic ascriptions. If intellectualism is true, and knowing how is knowing a proposition, explaining why we can "know how to ski a little bit" without committing to the oddity of "knowing that p a little bit" remains a significant, often ignored, burden. This project moves the debate from competing intuitions about cases to competing predictions about linguistic behavior.

  **3. Methodology**
  This project is scoped for a single semester of focused research. The method is conceptual analysis informed by linguistic diagnostics, not empirical experimentation.

  *   **Weeks 1–4: Mapping the Logical Space.** I will catalog the standard counterexamples used by both sides (coach cases, performer cases, amnesiac cases) and reconstruct them not as metaphysical puzzles but as linguistic data points. I will classify them by their compatibility with gradable modifiers (e.g., "knows very well how to," "knows slightly how to").
  *   **Weeks 5–8: Linguistic Diagnostics.** I will apply standard tests for semantic ambiguity to 'knows how'.
      *   *Conjunction Reduction:* Testing for zeugma (e.g., "He knows how to swim and how to prove the theorem, but only the first involves ability").
      *   *Modification:* Systematically testing which adverbs modify which senses (e.g., "knows theoretically how to" vs. "knows practically how to").
      *   *Gradability:* Analyzing the coherence of comparative structures across different case types.
  *   **Weeks 9–12: Synthesis and Argument Construction.** I will draft the core argument: if the linguistic diagnostics split cleanly along the ability/proposition line, the debate is verbal. If they do not, I will outline the required revision to the standard view of propositional knowledge (i.e., admitting gradable propositions). The output will be a draft paper targeting a top generalist or epistemology journal.

  **4. Expected Results and Failure Conditions**
  *   **Success:** The project succeeds if I can demonstrate that 'knows how' triggers distinct linguistic behaviors depending on whether ability is present. A successful result would show that the "coach" case and the "performer" case are not competing descriptions of one state, but accurate descriptions of two different states picked out by the same phrase. This would dissolve the stalemate by showing the opponents are talking past each other.
  *   **Failure:** The project fails if the linguistic diagnostics return mixed results—for example, if propositional uses of 'knows how' prove just as gradable as ability uses without loss of coherence. This would suggest the ambiguity hypothesis is false and that the real problem lies in our understanding of propositional knowledge itself (i.e., that some propositions are gradable). While philosophically interesting, this would exceed the scope of a single semester, requiring a full theory of gradable propositions.

  **5. Scope Assessment**
  This is semester-sized *only if* I restrict myself to the ambiguity diagnosis. It is secretly a career project if I attempt to solve the metaphysical nature of the resulting states. I will strictly avoid constructing a positive theory of *what* knowledge-how is, focusing instead on clearing the ground by showing *how many* things it is. The deliverable is a negative result (dissolving the debate) or a constrained positive result (identifying the linguistic boundary), not a full epistemology.

  **6. Alternatives to Avoid**
  *   **Do not run experiments:** Experimental philosophy (surveying lay intuitions) is too time-consuming for one semester (IRB, recruitment, analysis) and often yields data that is hard to interpret philosophically without prior conceptual clarity.
  *   **Do not just collect cases:** Armchair intuition pumping is what caused the stalemate. Adding more cases (e.g., "what about a robot?") without a diagnostic framework will just add noise.
  *   **Do not punt to linguists:** While this involves linguistic data, the question is epistemological. Linguists may identify the ambiguity, but they will not care about its implication for the intellectualism debate. This must remain a philosophical argument using linguistic tools.

  **7. Critical Note on Framing**
  Be warned: if the gradability test shows that "knows how" is uniformly gradable, your three-way split collapses entirely. You would be left arguing that *all* knowledge is gradable, which is a much harder sell. The proposal hedges this by treating the ambiguity hypothesis as the primary target. If the data supports unity, the project pivots to arguing that the intellectualist/anti-intellectualist distinction is false because both rely on a binary view of knowledge that is incorrect. This salvage path is riskier but still publishable.
