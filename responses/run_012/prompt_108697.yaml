answer: |-
  You must forbid treating model feature importance as a guide for action unless you have externally validated that manipulating that feature in the real world isolates the same mechanism the model captured, because model sensitivity is not worldly causality.

  The reasoning is that your model learns statistical dependencies within a specific dataset, whereas an intervention changes the data-generating process itself. When the "Model-Resampler" permutes a feature, they are measuring how much the *prediction function* relies on that input to minimize loss, not how much the *outcome* relies on that input in reality. If you act on the former without validating the latter, you are optimizing for the model's artifacts rather than the world's mechanics, guaranteeing failed interventions when correlations break under manipulation.

  1.  **Feature Attribution is Not Intervention Guidance (High Impact):** Stop allowing team members to label permutation importance, SHAP values, or partial dependence plots as "causal" in any document that informs decision-making. These metrics measure robustness of prediction, not leverage on reality. A feature can be highly "causal" for the model's accuracy (e.g., a proxy for a true cause) but have zero causal effect on the outcome if intervened upon. Require a separate "actionability audit" where every feature proposed for intervention is mapped to a real-world lever and checked for confounding, independent of the model's internal weights.

  2.  **Reject Engineering Relativism (High Impact):** The colleague who wants to define causation relative to your platform's API is creating a dangerous blind spot. If causation is defined by what you can intervene on, you cannot audit your system for biases involving immutable characteristics (like race or gender) because you cannot "intervene" on them surgically. Furthermore, this view implies that upgrading your experimentation platform changes the causal structure of the world, which is absurd. Maintain a realist stance for auditing and risk assessment: causes exist regardless of your ability to manipulate them, even if you can only *estimate* their effects via observational proxies when interventions are impossible.

  3.  **Enforce the "Surgical" Constraint on Actions (Medium Impact):** The Interventionist demand for "surgical" interventions is not philosophical pedantry; it is a confounding check. If your team proposes an intervention that changes $X$ but inevitably drags $Z$ along with it (a non-surgical intervention), you cannot use the model's coefficient for $X$ to predict the outcome. You must either adjust for $Z$ in the analysis or admit the effect is bundled. Mandate that any proposal to "move metric Y by changing X" must include a diagram of what else changes when X moves, or the proposal should be rejected as underspecified.

  4.  **Ignore the Counterfactual vs. Intervention Debate (Low Impact):** For working model builders, the dispute between "do-operator" definitions and "counterfactual dependence" definitions is largely a philosophical quarrel with no practical bite, provided you agree on the causal graph. Both frameworks yield the same identification strategies (backdoor criterion, IVs, etc.) and the same warnings about unobserved confounding. Do not allocate sprint time to resolving this; treat them as equivalent mathematical languages for the same constraint: you cannot infer the effect of actions from passive observation without assumptions.
