answer: |-
  This is an excellent set of questions. You have identified the precise friction points where Dennett's metaphors often stall in seminar discussions. The confusion usually arises because the metaphors are vivid but the criteria for applying them are often left implicit.

  Let's take these in order, starting with a necessary correction to your summary of the distinction, which will clarify the rest.

  ### 1. The Crane/Skyhook Contrast

  **The Correction**
  Your summary states: *"greedy reductionists suppose it can all be explained without cranes."* This is the source of the conceptual wobble. Dennett does not claim greedy reductionists reject cranes. He claims they reject **intermediate** cranes.

  *   **Good Reductionist:** Accepts that physics is the foundation, but acknowledges that to get from quarks to consciousness, you need a series of lifting devices (cranes) like natural selection, neural networks, and cultural evolution. You cannot lift the load of "human language" directly with the crane of "quantum chromodynamics."
  *   **Greedy Reductionist:** Agrees there are no skyhooks, but insists on using only the **bottom-most crane** (physics/chemistry) to lift everything. They try to skip the intermediate lifting gear.

  **What makes a Crane a Crane?**
  You ask if the criterion is structural or historical. It is **functional**.

  A crane is an explanation that specifies a **mechanism of leverage**. It shows how force (causal power) is transmitted from a lower level to a higher level through a specific arrangement of parts. A skyhook is an explanation that posits a lifting force without specifying an anchor or a transmission mechanism.

  *   **Is an unbuilt crane still a crane?** Yes, provided it is a *proposal for a mechanism*. If I say, "I don't know the exact protein folding, but it must be stabilized by hydrophobic interactions," I am positing a crane. I am pointing to a known physical force and suggesting it does the work. If I say, "It is stabilized by a vital force," I am positing a skyhook, because "vital force" is a name for the mystery, not a mechanism.
  *   **The Question-Begging Charge:** Your friend argues that "skyhook" just means "whatever has not yet been naturalised," making the framework circular against non-naturalists. This is a common objection, but it misses Dennett's specific usage.

      Dennett's argument is not that skyhooks are impossible because they are supernatural. His argument is that skyhooks are impossible because they are **explanatorily inert**.
      
      If a theist says, "God designed the eye," Dennett asks: "How?" If the theist says, "God thought it and it happened," that is a skyhook. It posits a mind (design) without explaining the origin of that mind. If the theist says, "God used a process of divine trial and error over eons," they have just adopted a crane (and made God a naturalistic entity).
      
      Therefore, the contrast does not beg the question against non-naturalists *unless* the non-naturalist insists on an explanation that terminates in a brute fact of design. Dennett's claim is that *everyone* needs cranes eventually. Even a creator needs a way to create. If you can specify the "how," it's a crane. If you stop at "because it was designed," it's a skyhook. The distinction is between **mechanism** and **miracle**, not strictly between **natural** and **supernatural**.

  ### 2. Greedy Reductionism and the Self-Funding Test

  **The Classmate's Test**
  Your classmate proposes: *A reduction is greedy when it discharges its explanatory debt with a posit whose own origin the theory cannot account for — that is, when it skips a level it has no licence to skip.*

  This is a strong reconstruction, but it needs one adjustment. Greedy reductionism isn't just about the *origin* of the posit; it's about the **reality of the pattern**.

  Dennett's core complaint against greedy reductionism is that it tries to **explain away** phenomena rather than **explain** them. It claims that because X is made of Y, X is "really just" Y, and therefore the properties of X are illusions.

  *   **Does the test over-generate?** It might. If I propose that memory is reduced to synaptic weighting, have I skipped a level? Psychology? Yes. Is it greedy? Not necessarily, if I can show how synaptic weighting *realizes* psychological memory. The test should be: Does the reduction acknowledge the higher-level pattern as a real phenomenon that needs accounting for, or does it dismiss the pattern as noise?
  *   **Does it under-generate?** It might miss cases where the levels aren't clearly defined.

  **The Simulation/Emergence Dispute**
  You describe a system whose behavior can only be predicted by simulating it bottom-up.
  *   **Student A:** This is a crane (honest work).
  *   **Student B:** "Emergent" is a skyhook in a lab coat.

  The crane/skyhook criterion **does** settle this, but only if we define "emergent" carefully.

  1.  **Weak Emergence (Crane):** The property arises from micro-interactions, is unpredictable without simulation, but is fully constituted by those interactions. If Student A says, "We can build a crane out of code that lifts this behavior from the physics," they are offering a crane. The simulation *is* the crane.
  2.  **Strong Emergence (Skyhook):** The property arises from micro-interactions but exerts "downward causation" that is not traceable to the micro-level laws. If Student B uses "emergent" to mean "a new causal force appears that isn't in the parts," they are positing a skyhook.

  However, often in these disputes, Student B is accusing Student A of using "emergence" as a **conversation stopper**. If Student A says, "It's emergent," and stops there, that is a skyhook. It names the gap. If Student A says, "It's emergent, and here is the simulation that demonstrates the causal pathway," that is a crane.

  The criterion requires you to ask: **Does the term 'emergent' refer to a mechanism of aggregation, or does it refer to a magical appearance of novelty?** If the latter, it is a skyhook. The dispute isn't about the science; it's about whether the explanation provides leverage or just labels the load.

  ### 3. Substantive Category or Term of Abuse?

  Is "greedy reductionism" a real philosophical category, or just a way to call someone a bad scientist?

  It is a **methodological warning label**, akin to "Ad Hoc Hypothesis." It has substantive bite because it identifies a specific failure mode in explanation: **The Fallacy of Composition applied to Explanation.**

  **Greedy vs. Ambitious**
  How do we distinguish them without hindsight?
  *   **Ambitious Reduction:** "I believe biology is grounded in chemistry. I know there is a gap. I will build a bridge (a crane) to show how chemical bonds stabilize genetic replication." This respects the higher level (biology) as a real pattern that needs grounding.
  *   **Greedy Reduction:** "Biology is just chemistry. Therefore, 'function' and 'adaptation' are folk concepts with no real referent. We should stop talking about organisms and talk about molecules." This denies the higher level's reality.

  The distinction lets you do something concrete: **It tells you where to look for the error.**
  If you accuse a theory of greedy reductionism, you are predicting that it will fail to account for the **organizational complexity** required to get from the lower level to the higher level. You are predicting that the theory will work for simple cases but break down when the system's architecture matters more than its constituent material.

  **Example:**
  *   **Greedy:** "The brain is a computer. Neurons are logic gates." (Fails because neurons are analog, contextual, and plastic; the "logic gate" model skips the crane of neural network dynamics).
  *   **Good:** "The brain computes. We need to understand how networks of non-linear units realize logical operations." (Acknowledges the gap and seeks the crane).

  **Conclusion**
  Your friend is half-right: if "skyhook" is defined merely as "non-natural," it begs the question. But Dennett defines it as "explanatorily inert design." That is a functional definition that applies to natural and supernatural claims alike.

  Your classmate's "self-funding test" is a good heuristic, provided you add that greedy reductionism is characterized by the **dismissal of higher-level patterns** rather than just the skipping of levels.

  The distinction is not abuse; it is a tool for spotting when a reductionist is trying to **dissolve** a problem rather than **solve** it. In your seminar, use it to ask: "Does this explanation show me the gears, or does it just tell me the clock works?" If it's the latter, you have found a skyhook. If it insists the gears don't matter because it's "just springs," you have found greedy reductionism.
