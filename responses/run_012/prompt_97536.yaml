answer: |-
  Here is a draft you can read directly from your screen during the interview, structured as a flow of questions with built-in contingencies for her likely responses. I have woven the follow-ups into the text so you can navigate smoothly without needing to look up separate notes, and I have marked the two questions where you should adopt a stance of genuine curiosity rather than challenge.

  Start by pressing on the ontological status of the conventional self, since she emphasizes the two truths distinction as a constraint. Ask her specifically what work the word conventional is doing in her view, and whether calling the self conventionally real is a substantive claim about how the world is or just a relabeling that lets her have it both ways. If she responds that conventional truth is about pragmatic utility without metaphysical weight, your follow-up should be to ask what makes a convention true rather than merely useful, and whether there are false conventions that we should discard, because if there are false conventions then conventional truth must track something real about the world beyond just usefulness.

  Next, move to the synchronic unity of experience, asking how a no-self view that still permits that I am feeling accounts for the unity of a single experience at a time without smuggling the self back in as the thing that binds experiences together. She will likely say that causal interdependence or functional integration explains the unity, so your follow-up needs to ask why causality alone yields a unified field of experience rather than just a heap of correlated events, since a bundle of sticks is causally related but does not feel like a single subject.

  Following that, address the diachronic persistence problem by asking how the persistence of a person across time is accounted for if there is no continuant, and whether memory alone is sufficient to ground this without implying an owner of the memory. If she argues that memory chains are enough, press her on why we do not treat memory chains in other contexts, like data storage, as persons, and what specific qualitative feature of human memory chains grants them the status of a persisting agent rather than just a recorded history.

  Then you need to tackle the karma-and-responsibility problem, asking if there is no self, who is responsible and who reaps the result, and requiring her to say more than that causal continuity is enough. When she inevitably argues that the causal stream is the locus of responsibility, your follow-up should be to ask why we intuitively feel that punishment or reward requires a subject who deserves it, and whether her view can accommodate the retributive intuitions that underpin most human justice systems or if it forces us to abandon them entirely.

  You also need to force her to confront the old rival position inside Buddhism that kept something like a person while denying a permanent self, specifically the Pudgalavada or Personalists, and ask why their view was simply confused rather than a viable alternative. She will want to say that view was contradictory, so your follow-up must ask what conceptual resource she possesses that they lacked, because if they were sophisticated philosophers they likely saw the same problems she sees, and dismissing them costs her view the historical pluralism of the tradition.

  Since she insists that the two truths distinction is a real constraint, ask her to give you an example of a metaphysical claim that is ruled out by this constraint, rather than one that is merely reinterpreted. If she says that claims about permanent substances are ruled out, push back by asking whether the processes she accepts are themselves substantial in any way, because if processes are real then the distinction between substance and process might be less sharp than she needs it to be.

  She mentioned that people who call the self a mere useful fiction are making a stronger claim than the tradition does, so ask her to specify the exact difference between a useful fiction and a conventionally real entity. If she replies that fictions are false while conventions are true in their context, your follow-up should be to ask whether the suffering caused by self-grasping is real or fictional, because if the suffering is real then the self that suffers must have some ontological grip beyond being a mere label.

  Regarding her focus on the pre-reflective sense of being a someone, ask whether this sense is cognitive, somatic, or linguistic, and how meditation targets it if it is pre-reflective and thus prior to thought. She will likely say it is a habitual tendency embedded in perception, so your follow-up should ask whether this habit resides in the brain, the mind, or the social environment, because locating the habit seems to require a locus that looks suspiciously like a self.

  For the next question, I want you to shift tone and admit you genuinely do not know the answer, because this is an area where the philosophy is still developing. Ask her whether language creates the pre-reflective sense of self or merely describes it, and if language creates it, whether a non-linguistic animal has the same kind of self-sense that needs uprooting. Since this is a genuine uncertainty, listen closely to her answer without preparing a rebuttal, as her response here could clarify whether the problem is biological or cultural.

  Finally, end with another question where you should signal genuine curiosity rather than challenge, asking whether the pre-reflective sense of being a someone is eliminated upon enlightenment or merely transformed, and if it is transformed, what the transformed version feels like. This is something you should leave open because even experts debate whether the cessation of self-sense is a loss of function or a gain in clarity, and her phenomenological description here could be a strong closing point for the episode.
