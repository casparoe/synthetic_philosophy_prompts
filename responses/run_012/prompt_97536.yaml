prompt: |-
  I do a small podcast on philosophy of mind, and next week's guest has me a bit nervus because I can't tell whether her view is deep or just slippery. She works on Buddhist philosophy of mind, and her line is that the whole modern debate about anatta gets the target wrong. On her reading, the Buddhist claim isn't "there is no self" as a piece of metaphysical inventory, and it isn't the Parfit-style reductionist claim that a person is just a bundle either. She thinks the practice is aimed at something more like a pre-reflective sense of being a someone -- the kind of thing that can linger even after you've stopped believing in a permanent self, and that the tradition itself treats as a seperate problem from the "view of self" you're supposedly able to uproot. She also keeps insisting that the "two truths" distinction is a real constraint rather than a get-out-of-jail-free card, and that people who call the self a mere useful fiction are making a much stronger and different claim than the tradition does.

  What I want is eight to ten questions that actually push on the content and don't just let her restate the view. At least one should press on what work "conventional" is doing -- whether calling the self conventionally real is a substantive claim or just a relabeling that lets her have it both ways. At least one should ask how a no-self view that still permits that "I am" feeling accounts for the unity of a single experience at a time and the persistence of a person across time, without smuggling the self back in as either the thing that binds experiences together or the thing that continues. There should be one on the karma-and-responsibility problem: if there's no self, who is responsible and who reaps the result, and I want her to have to say more than "causal continuity is enough." And one that forces her to confront the old rival position inside Buddhism that kept something like a person while denying a permanent self -- she'll want to say that view was simply confused, and I want a question that makes that dismissal cost her something. None of the "what drew you to this" fluff, obviously.

  For each question, give me a follow-up keyed to the answer she's most likely to give, because I don't want to freeze when she gives the smooth reply. One or two of them should be questions where I genuinely don't know what the right answer is, so it doesn't come off like I'm just setting traps. Write it as continuous prose I can read straight off a screen -- no headings, bullet points, bold, or tables, just the way you'd write it out in an email.
