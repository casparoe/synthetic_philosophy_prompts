      *   *Critique:* This is a strong eliminativist stance. It conflates *historical/prior* explanation with *current/functional* reality. Just because comprehension *emerges* from competence doesn't mean comprehension *is nothing but* competence.
      *   *Analogy:* Heat emerges from molecular kinetic energy. Does that mean "heat" is a folk concept with no explanatory work? No, it's a higher-level abstraction that is real and useful, even if reducible.
