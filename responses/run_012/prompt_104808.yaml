  # JOINT STATEMENT ON THE LEDGER OF GREAT-POWER DECLINE

  **Signed:** The Actuarial Working Group & The Chronicler Collective  
  **Date:** 14 October 2023  
  **Subject:** Adversarial Collaboration on the Forty Episodes of the Ledger

  ### I. Preamble
  We, the undersigned, acknowledge a three-year dispute regarding the forecasting of great-power decline. We agree to convene this adversarial collaboration based solely on the artifact known as the **Ledger** (40 stipulated episodes of great-power decline). We acknowledge that where the Ledger is silent, we possess no data. We agree that the statistic known as the "decline half-life" is not a settled premise but an open methodological question, particularly regarding censored episodes. This statement records our points of convergence, our precise divergences, and the tests required to resolve them.

  ### II. Agreed Claims
  1.  **Data Limitation:** The Ledger contains exactly forty episodes. It does not contain data on powers that declined prior to the start of the record, nor does it contain data on powers not classified as "great" by the Ledger's criteria. We agree not to import outside historical cases to fill these gaps.
  2.  **Censoring:** Six of the forty episodes are right-censored (the power is still standing at the Ledger's end date). We agree that these six cases cannot be treated as completed declines.
  3.  **Outcome Variation:** The Ledger records four categorical outcomes: absorption, fragmentation, reconstitution, and persistence. No single outcome dominates the record to the exclusion of others.
  4.  **Variable Silence:** The Ledger records peak year, decline onset, end/censor year, and outcome. It does not record internal political structures, economic composition, or external geopolitical pressure. We agree that any analysis relying on these unrecorded variables is extrapolating beyond the Ledger.
  5.  **Half-Life Status:** The "decline half-life" is a derived statistic. We agree that its validity depends on the assumption that the forty episodes constitute a homogeneous reference class, which is contested.
  6.  **Predictive Failure:** Both camps agree that neither base-rate extrapolation nor narrative singularism has consistently predicted outcomes in real-time during the three-year reporting period.

  ### III. Residual Disagreements
  *We state these disagreements in language each camp accepts as accurate to its position.*

  1.  **Issue:** Homogeneity of Cases.
      *   **Actuarial Formulation:** The forty episodes share sufficient structural similarities (peak, onset, outcome) to be treated as draws from a single underlying hazard distribution, permitting aggregation.
      *   **Chronicler Formulation:** The forty episodes are distinct historical configurations; aggregating them obscures the causal mechanisms specific to each power's predicament, rendering the reference class invalid.
  2.  **Issue:** Utility of the Half-Life.
      *   **Actuarial Formulation:** The half-life is a useful summary statistic for risk assessment, provided confidence intervals account for censoring and heterogeneity.
      *   **Chronicler Formulation:** The half-life is numerology; it implies a decay process where none exists, misleading policymakers into expecting a uniform timeline for singular events.
  3.  **Issue:** Source of Error.
      *   **Actuarial Formulation:** Forecasting errors arise from insufficient data volume and noise in the timing of "decline onset."
      *   **Chronicler Formulation:** Forecasting errors arise from the category error of applying statistical regularity to human political choices.

  ### IV. Cruxes and Tests
  *We isolate three sub-questions. Settling any one would move at least one side. We record our predictions regarding the outcome of these tests.*

  | ID | Question | Kind | Agreed Evidence | Actuarial Prediction | Chronicler Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **C1** | Does a model trained on 30 Ledger episodes predict the outcomes of the held-out 10 better than chance? | Empirical | Out-of-sample accuracy test using only Ledger variables. | Yes, significance at p<0.05. | No, accuracy will not exceed baseline noise. |
  | **C2** | Does splitting the Ledger by century alter the hazard rate significantly? | Empirical | Survival analysis comparison across temporal subsets. | No, rates are stable across time. | Yes, rates differ due to historical context changes. |
  | **C3** | Is "Decline Onset" identifiable retrospectively without outcome bias? | Protocol Artifact | Blind coding of onset dates by neutral third parties. | Yes, onset is observable via output metrics. | No, onset is only visible after the outcome is known. |

  ### V. Verbal Disputes and Artifacts
  We identify the following disputes as verbal or artifacts of the Ledger's construction, not substantive disagreements about reality:
  1.  **Definition of "Persistence":** Whether a power that reconstitutes under a new name counts as "Persistence" or "Reconstitution" is a labeling convention in the Ledger, not a factual dispute.
  2.  **Peak Year Identification:** Disagreements on peak year often stem from whether one measures military capacity or economic output; the Ledger does not specify which, creating artificial variance.
  3.  **Censoring Treatment:** Whether a still-standing power is "Persistent" or "Declining但未 Ended" is a function of the Ledger's end date, not the power's actual trajectory.

  ### VI. Falsification Conditions
  *We state what evidence would compel us to revise our positions.*

  *   **Actuaries:** We would abandon the reference-class approach if a model built on Ledger base rates consistently performs worse than a simple coin flip in out-of-sample tests (Crux C1) over three consecutive trials.
  *   **Chroniclers:** We would accept the utility of the half-life statistic if a blind model using only Ledger variables predicts the outcome of the six censored cases correctly before their resolution, outperforming narrative expert consensus.

  ### VII. Live Case Forecasts
  *Below are six live cases where an incumbent power's share of world output has been flat or falling for a decade. Forecasts were recorded independently before signing.*

  | Case | Description | Actuarial Forecast | Chronicler Forecast |
  | :--- | :--- | :--- | :--- |
  | **I** | **The Trans-Oceanic Federation:** Hegemon, 25% output share, falling to 22% over 10 years. | 40% probability of Fragmentation within 30 years (based on Ledger median hazard). | Likely Reconstitution; institutional depth exceeds Ledger analogs. |
  | **II** | **The Continental Union:** Regional power, 15% output share, flat for 12 years. | 15% probability of Absorption within 20 years (base rate for flat powers). | High risk of Fragmentation due to internal ethnic heterogeneity not in Ledger. |
  | **III** | **The Eastern Republic:** Rising challenger, 18% output share, falling to 16% after shock. | 60% probability of Persistence (recovery common in Ledger post-shock). | High risk of Absorption; political rigidity suggests singular collapse. |
  | **IV** | **The Island Commonwealth:** Naval power, 5% output share, falling for 15 years. | 80% probability of Reconstitution (common for maritime powers in Ledger). | Likely Persistence; niche specialization defies aggregate decline curves. |
  | **V** | **The Southern Federation:** Resource dependent, 8% output share, flat for 10 years. | 50% probability of Fragmentation (high variance in resource cases). | Likely Absorption; dependency creates singular vulnerability. |
  | **VI** | **The Northern Confederation:** Industrial power, 10% output share, falling for 11 years. | 35% probability of Absorption within 25 years. | Likely Reconstitution; technological adaptation not captured by output share. |

