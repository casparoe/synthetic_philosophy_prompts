answer: |-
  This is a exquisite problem. You have stumbled onto a specific, jagged corner of game theory that doesn't have a single catchy pop-culture name like "Prisoner's Dilemma," but it is absolutely a "thing," and it has edges sharp enough to cut your characters.

  Here is the breakdown of the shape, the reasoning, and the way out.

  ### 1. The Name of the Situation
  The broad bucket this falls into is the **Volunteer's Dilemma**.

  In the standard Volunteer's Dilemma, a public good is provided if *at least one* person pays a cost. If no one pays, everyone loses. If multiple people pay, the good is provided but the extra costs are wasted. (This is your **Bin Scenario**: if two people take the bins out, it's wasteful effort, but the bins get out.)

  Your **Panel/Grant Scenario** is a stricter, more dangerous variant. It is sometimes called the **Unique Volunteer Dilemma** or a **Collision Game**.
  *   **0 Volunteers:** Disaster (no panel, no project).
  *   **1 Volunteer:** Success.
  *   **2+ Volunteers:** Disaster (slot lost, money diluted to uselessness).

  The critical difference between this and the Tragedy of the Commons is that the Commons is about *aggregate* depletion (everyone takes a little, the well runs dry). This is about *binary collision*. It is not that the resource is used up; it is that the mechanism breaks if more than one hand touches it.

  ### 2. The Name of the Reasoning Move
  You are spot on: the situation and the reasoning are different things.

  The reasoning move you described—"Pick the option that would be best if everyone in your exact position picked it too"—is called **Superrationality** (coined by Douglas Hofstadter) or, in moral philosophy, **Kantian Universalizability** (the Categorical Imperative).

  In game theory, it is also close to **Team Reasoning**: acting as an agent of the group rather than an individual.

  **Here is the trap:**
  Superrationality works beautifully in a Prisoner's Dilemma (if we both think alike, we should both cooperate). But in your **Unique Volunteer** scenario, deterministic Superrationality crashes.
  *   If I reason "Everyone should volunteer," then we all volunteer -> **Crash.**
  *   If I reason "Everyone should hold back," then we all hold back -> **Starve.**

  If your character uses this reasoning move *without modification*, she is locked in a room with five mirrors of herself, and they all scream at once. The reasoning move isn't "wrong," but it is incomplete. It assumes the decision space is binary (Do / Don't). To solve this, the decision space must include **Probability**.

  ### 3. The Edges: How is this different?
  You asked for the edges. Here is how you distinguish this from the other famous problems:

  *   **Vs. Free Rider Problem:** In a Free Rider scenario, everyone hopes *someone else* pays the cost so they can benefit for free. In your scenario, everyone is *eager* to pay the cost (do the work/take the slot); the eagerness is the problem. It is **Over-Coordination**, not Under-Coordination.
  *   **Vs. Tragedy of the Commons:** The Commons is gradual. One extra cow doesn't kill the pasture. In your scenario, the second volunteer is not "a bit worse"; they are catastrophic. It is a **Threshold Problem**.
  *   **Vs. Standard Coordination:** Usually, coordination means "We all need to pick the same side of the road." Here, coordination means "We need to pick *different* sides, but we aren't allowed to talk."

  ### 4. Does the trap survive if people aren't identical?
  **No.** This is the crux.
  The trap exists *only* because of **Symmetry**.

  If one person is visibly keener, richer, more available, or more authoritative, the symmetry breaks. That person becomes a **Schelling Point** (a focal point). The others look at that person and think, "Ah, obviously *they* will do it," and they hold back.

  In your writers' group, you were all "equally sharp, equally hungry." That equality was the poison. If one of you had a baby, or a day job, or a reputation for being disorganized, the others would have implicitly deferred. The disaster happened because you were all perfect mirrors of one another.

  ### 5. Does talking fix it?
  **Yes, but only if it creates asymmetry.**
  If you talk and say, "Let's all be responsible," you die together.
  If you talk and say, "Sarah, you do it, we won't," you live.

  However, without enforcement, "cheap talk" can fail. If Sarah says "I'll do it," but doesn't do it by Friday, and the others have already opted out, the slot is lost. Talking works best if it allows the group to agree on a **Randomization Protocol** (see below).

  ### 6. Is the Reasoning Move a Good Rule or a Trap?
  For your character: **It is a trap unless it includes randomness.**

  Clever people *have* argued about this. Hofstadter argued that superrational thinkers should cooperate in a Prisoner's Dilemma. But in your Unique Volunteer scenario, the "cooperative" move isn't to Volunteer or Not Volunteer. It is to **Roll a Die.**

  If your character wants to be the "smartest person in the room," she shouldn't say, "I'll do it." She should say, "We are all identical rational agents. If we all choose 'Yes', we lose. If we all choose 'No', we lose. Therefore, the only rational move that respects our symmetry is for each of us to choose 'Yes' with a probability of 1/N."

  In your group of six, each person should have flipped a coin (or used a random number generator) with a 1-in-6 chance of replying.
  *   Most likely: Exactly one person replies. (Success)
  *   Sometimes: No one replies. (Failure)
  *   Sometimes: Two reply. (Failure)

  But over many such scenarios, this strategy yields the highest success rate for the group. The "responsible" move (I must do it) is actually the *selfish* move, because it imposes your certainty on a system that requires uncertainty.

  ### 7. The Lottery Question
  Your friend is right, and this ties it all together.

  **The Scenario:** Prize £900. Divided by entrants.
  **The Catch:** If the project needs £900 to work, £150 is useless. This makes the Lottery structurally identical to the Panel. It is a Threshold Problem.

  **The Solution:** **Mixed Strategy Nash Equilibrium.**
  When identical players face a symmetric game where collision is bad, the only stable equilibrium is **randomization**.

  Why does one case want a volunteer and the other want a die roll?
  *   **The Bin Case (Standard Volunteer's Dilemma):** You want a volunteer because over-volunteering is just wasteful, not fatal. You want the cost paid.
  *   **The Panel Case (Unique Volunteer/Collision):** You want a die roll because over-volunteering is fatal. You need to *prevent* collision.

  In the Panel case, "stepping up" is an act of aggression against your identical peers. You are forcing them into the "loss" column by claiming the "win" slot.

  ### How your character can say it
  She doesn't need a paragraph. She needs to realize that **certainty is the enemy.**

  If she wants to explain why she didn't reply to the festival, or why she's hesitating now, she can say:

  > "We made the mistake of being reliable. We all knew we were the kind of people who wouldn't let the ball drop. So we all reached for it at once, and we crushed it. Next time, we don't need responsibility. We need noise. One of us needs to be the one who flips a coin and obeys it. But we're all too decent to leave it to chance."

  Or, if she is the one solving it in the scene:

  > "It's a collision game. If we all think the same way, we all make the same move, and we crash. The only way to win is for one of us to think differently. Since we're all equally smart, the only way to think differently is to stop thinking and roll a die."

  ### Summary for the Novel
  *   **The Shape:** Unique Volunteer Dilemma / Collision Game.
  *   **The Reasoning:** Superrationality (which fails here without randomization).
  *   **The Trap:** Symmetry. Identical actors running identical logic.
  *   **The Solution:** Symmetry Breaking (via asymmetry/randomization/Schelling point).
  *   **The Insight:** In a group of mirrors, the only responsible act is to introduce a crack.

  The tragedy of your writers' group wasn't that they were selfish. It was that they were **too similar**. That is a wonderful theme for a book.
