answer: |-
  # A Defense of the Limiting-Average Principle in Infinite Population Ethics

  ## Introduction

  The extension of population ethics to infinite worlds presents a formidable challenge to the Total View. As you have noted, the Total View renders all worlds with infinite positive sum incomparable, leading to the absurd result that a world where everyone suffers immensely is equally as good as a world where everyone flourishes, provided both sums are infinite. The Finite Improvement Principle (FIP) attempts to repair this by focusing on finite differences, but it fails to compare worlds that differ infinitely (e.g., a world of utility 1s vs. a world of utility 2s).

  In this paper, I argue that the **Limiting-Average Principle (LAP)** offers the most robust solution to these foundational puzzles. LAP states that world $W$ is better than $W'$ if and only if the limit of the average utility of the first $n$ individuals in $W$ is greater than that of $W'$ as $n$ tends to infinity. While LAP is not without difficulties, it successfully restores comparability to infinite ethics, avoids the Repugnant Conclusion, and provides a coherent metric for value density. I will defend LAP against its strongest objections and argue that it should be adopted, provided we accept two plausible constraints: bounded utility and natural ordering.

  ## 1. Solving the Incomparability Problem (FIP vs. LAP)

  The primary motivation for adopting LAP is its ability to solve the problem that defeats FIP. Consider two worlds, $A$ and $B$. In $A$, every individual has utility 1. In $B$, every individual has utility 2. Both worlds contain a countably infinite number of people.
  *   **Total View:** $\sum A = \infty$, $\sum B = \infty$. Verdict: Equally good. (Implausible)
  *   **FIP:** The difference between $A$ and $B$ is not confined to a finite set. Verdict: Incomparable. (Implausible)
  *   **LAP:** $\text{Avg}(A) = 1$, $\text{Avg}(B) = 2$. Verdict: $B$ is better than $A$.

  LAP captures the intuition that a world where everyone is better off is superior, even if the population is infinite. It shifts the ethical focus from the *magnitude* of the sum (which breaks in infinite contexts) to the *density* of value. By prioritizing average utility, LAP ensures that structural improvements to an infinite population are recognized, solving the paralysis inherent in FIP.

  ## 2. Addressing the Original Puzzle: W vs. W'

  You presented the case of $W$ (utilities 1, 2, 3, ...) and $W'$ (utilities 0, 2, 3, ...). The Total View says they are equal ($\infty = \infty$). FIP says $W$ is better (Pareto improvement on a finite set). How does LAP handle this?

  Strictly speaking, in this specific unbounded example, the average utility for both worlds diverges to infinity:
  $$ \lim_{n \to \infty} \frac{1}{n} \sum_{i=1}^n i = \infty $$
  $$ \lim_{n \to \infty} \frac{1}{n} \sum_{i=1}^n u_i(W') = \infty $$
  Consequently, pure LAP implies $W$ and $W'$ are equally good. Critics argue this violates the Pareto principle. However, I argue this result is acceptable for two reasons.

  First, this counterexample relies on **unbounded utility**. In most plausible axiological frameworks, well-being is bounded (e.g., there is a maximum possible happiness and a minimum possible suffering) to avoid "utility monster" problems. If we assume a bounded utility scale (e.g., 0 to 10), the sequence 1, 2, 3... is impossible. A realistic analog would be $W$ (1, 1, 1...) and $W'$ (0, 1, 1...). In this bounded case, LAP yields $\text{Avg}(W) = 1$ and $\text{Avg}(W') = 1$. While the limits are equal, we can utilize the **Limit Superior** or simply note that for any finite $n$, $W$ has a higher average.

  Second, even if we accept unbounded utility, the violation of Pareto here is negligible. In an infinite world where average utility diverges to infinity, the loss of 1 unit of utility for a single individual is asymptotically insignificant. The "moral weight" of a single individual approaches zero relative to the infinite whole. While this is counterintuitive to finite thinkers, it is a necessary consequence of infinite aggregation. To preserve the ability to compare $A$ (all 1s) vs $B$ (all 2s), we must accept that LAP may treat finite differences as negligible when averages diverge.

  **Recommendation:** To fully satisfy the intuition in the $W$ vs $W'$ case, I propose a **Lexical LAP**: Use LAP as the primary metric for infinite comparisons, but defer to the Pareto principle for finite differences when LAP yields a tie. This preserves LAP's solution to the FIP problem while respecting finite improvements.

  ## 3. Non-Converging Averages

  A technical objection to LAP is that average utility may fail to converge. Consider a world $X$ with utilities alternating 1, 2, 1, 2... The average oscillates and strictly speaking has no limit.

  This objection is mathematically surmountable. We should interpret LAP using **Cesàro summation** or the **Limit Superior/Inferior**.
  *   **Cesàro Mean:** If the standard limit does not exist, we take the average of the partial averages. For the 1, 2, 1, 2... sequence, the Cesàro mean converges to 1.5.
  *   **Limit Superior:** If we compare $X$ (1, 2, 1, 2...) to $Y$ (1, 1, 1, 1...), the Limit Superior of $X$ is 1.5, while $Y$ is 1. LAP correctly identifies $X$ as better.

  By adopting Cesàro means as the technical implementation of LAP, we ensure that the principle remains applicable to oscillating sequences, preserving comparability in a wide range of infinite scenarios.

  ## 4. The Pareto Principle and the "Sadistic" Conclusion

  The strongest objections to LAP concern its relationship with the Pareto principle and the addition of lives.

  ### Violation of Strong Pareto
  LAP violates Strong Pareto in infinite contexts. If $W$ is (1, 1, 1...) and $W^+$ is (2, 1, 1, 1...), both have a limiting average of 1. LAP says they are equally good, despite $W^+$ being better for one person and worse for none.

  **Defense:** We must distinguish between *Finite Pareto* and *Infinite Pareto*. Finite Pareto (if a finite set is better off and no one worse, the world is better) is compatible with Lexical LAP. However, Strong Pareto applied to infinite sets leads to contradictions and incompleteness (as seen with FIP). In an infinite context, the intuition that "better for one" *must* mean "better overall" relies on the assumption that the individual's weight is non-zero relative to the total. In infinite ethics, individual weight is zero. Therefore, LAP's verdict is metaphysically consistent with the nature of infinity, even if it clashes with finite intuitions.

  ### The "Sadistic" Conclusion (Adding Low-Utility Lives)
  Consider a world $H$ with infinitely many people at utility 100. Now consider $H^+$, which adds infinitely many people at utility 1.
  *   **Total View:** $H^+$ is better (infinite sum + infinite sum).
  *   **LAP:** The average utility of $H^+$ will be lower than $H$ (depending on the ordering, but generally diluted). LAP implies $H$ is better than $H^+$.

  Critics argue this implies that adding happy people (utility 1 is still positive) makes the world worse. This is known as the "Very Repugnant Conclusion."

  **Defense:** This is actually a decisive advantage of LAP. In finite population ethics, the Total View leads to the **Repugnant Conclusion**: a world of billions at barely positive utility is better than a world of millions at high utility. LAP avoids this. In an infinite context, we already have "infinity" people. We cannot increase the *quantity* of existence (both are $\aleph_0$). The only variable left to maximize is the *quality* of existence. Diluting a high-quality infinite population with a low-quality infinite population genuinely reduces the value density of the world. LAP correctly prioritizes quality over quantity when quantity is already maximal.

  ## 5. Objections and Rebuttals

  **Objection 1: The Ordering Problem.**
  LAP depends on how individuals are ordered (1st, 2nd, 3rd...). By rearranging the sequence of utilities, one can manipulate the limiting average (Riemann Rearrangement Theorem). Does this make value arbitrary?
  *   **Rebuttal:** Value is not arbitrary if we fix the ordering to a **natural structure**. In population ethics, individuals are not abstract numbers; they exist in spacetime. We should order individuals by generation or spatiotemporal location. As long as the ordering reflects the causal or temporal structure of the world, the limiting average is an objective feature of that world's history.

  **Objection 2: LAP ignores the value of existence.**
  If adding a life with positive utility lowers the average, LAP suggests we shouldn't add it. Does this imply non-existence is preferable?
  *   **Rebuttal:** LAP is a principle for comparing *existing* worlds, not necessarily for deciding who to create (which involves the Non-Identity Problem). However, regarding the comparison: if we have a choice between a high-quality infinite future and a diluted infinite future, LAP correctly identifies the high-quality future as better. It does not say the added lives have negative value, but that their addition lowers the *overall* evaluative metric of the world.

  ## Verdict

  Should the Limiting-Average Principle be adopted? **Yes.**

  The Total View is broken in infinite contexts, and the Finite Improvement Principle is too weak to guide action in worlds that differ structurally. LAP is the only principle that restores comparability to infinite ethics while avoiding the Repugnant Conclusion.

  To adopt LAP successfully, we must accept three conditions:
  1.  **Bounded Utility:** We must reject the possibility of unbounded utility sequences (like 1, 2, 3...) to ensure LAP can distinguish finite improvements.
  2.  **Natural Ordering:** We must anchor the sequence of individuals to spacetime or generation to avoid arbitrariness.
  3.  **Lexical Pareto:** We should supplement LAP with a rule that finite Pareto improvements break ties when averages are equal.

  With these constraints, LAP provides a coherent, mathematically robust, and ethically plausible framework for evaluating infinite populations. It accepts that in a world of infinite people, the *average* well-being is the only meaningful measure of value, and that preserving the quality of that infinity is more important than merely expanding it.

  ### Summary of Defense
  | Feature | Total View | Finite Improvement | Limiting-Average (LAP) |
  | :--- | :--- | :--- | :--- |
  | **Infinite Comparison** | Fails ($\infty = \infty$) | Fails (Incomparable) | **Succeeds** (Compares averages) |
  | **Finite Improvement** | Fails ($\infty = \infty$) | Succeeds | **Succeeds** (with Lexical Pareto) |
  | **Repugnant Conclusion** | Implies it | N/A | **Avoids it** (Prioritizes quality) |
  | **Pareto Principle** | Violates (in infinite) | Respects | **Violates** (in infinite ties) |

  LAP's violation of Strong Pareto in infinite ties is a necessary trade-off to achieve comparability. Given that incomparability is a greater theoretical cost than counterintuitive verdicts on negligible finite changes, LAP is the superior principle.
