answer: |-
  **Exam Question: Emergent Communication and the Limits of Semantics**

  **Time Allowed:** 75 Minutes
  **Instructions:** Answer the following question in essay form. You may not consult notes or texts.

  **The Scenario:**
  Consider a reinforcement learning experiment where a sender agent observes an object and emits a discrete signal to a receiver agent, which must select the object. The pair converges on a deterministic protocol that is behaviorally perfect. However, multiple global assignments of meaning (e.g., signal = object vs. signal = temporal stage) are consistent with all behavioral data. Furthermore, retraining with different random seeds yields behaviorally equivalent protocols that map to our vocabulary differently. You have full access to the network weights and architecture.

  **The Task:**
  Write an essay that addresses the following four points:
  1.  **Distinction:** Determine whether this case exhibits Quinean *indeterminacy of translation*, mere *underdetermination of theory by evidence*, or *inscrutability of reference*. Explain the differences and justify your classification.
  2.  **Physical Facts:** Evaluate whether full access to the network's weights and architecture settles the semantic facts. Does physical knowledge remove the indeterminacy, relocate it, or confirm it?
  3.  **Pragmatics:** Explain the role of simplicity or utility in choosing between rival manuals of translation. Does this role imply the choice is pragmatic rather than factual?
  4.  **Normativity:** Assess whether the word "translation" is apt for a protocol spoken by no community and answerable to no norm, or if this is "interpretation" in a thinner sense.

  ***

  **Model Answer**

  The reinforcement learning (RL) scenario presents a stark instantiation of Quine's indeterminacy of translation, distinct from mere underdetermination, though it diverges from the human linguistic case in crucial normative respects. To classify the phenomenon correctly, one must distinguish between evidential gaps and ontological lack. Underdetermination of theory by evidence suggests that sufficient future data could decide between competing hypotheses; it is a temporary epistemic limitation. Indeterminacy, conversely, asserts there is no fact of the matter to be found, even in principle. Inscrutability of reference focuses specifically on the extension of terms (e.g., "gavagai" referring to rabbit-stages rather than rabbits), while indeterminacy concerns the mapping of whole sentences. The RL case exhibits indeterminacy of translation because the competing manuals are globally consistent with all possible behavioral dispositions. The variation across random seeds confirms this: if the meaning were fixed by the task structure, convergence would be semantic as well as behavioral. Since it is not, there is no fact of the matter regarding which manual is "true."

  Access to the network's weights does not resolve this indeterminacy. A common error is to assume that because the system is finite and deterministic, the weights encode the "true" referents. However, weights are syntactic structures governing dispositions, not semantic contents. Knowing the physical facts of the system is analogous to knowing all the physical facts about a human speaker's neural states. For Quine, semantics is not fixed by physics; it is fixed by behavior plus the constraint of charity. Since the weights only determine the behavior (which we already know is compatible with multiple manuals), inspecting them adds no semantic data. The indeterminacy is not relocated; it is revealed as a feature of interpretation itself, not a lack of evidential access. The weights explain *how* the signal is produced, not *what* it means.

  Consequently, the choice between rival manuals must be pragmatic. We select the manual that attributes "object" rather than "temporal stage" based on simplicity and utility within our own conceptual scheme, not because it matches a hidden reality. If the choice were factual, simplicity would be irrelevant to truth. The fact that we prefer the "object" manual solely because it integrates better with our ontology confirms that the divergence between manuals is not a divergence in fact. The RL agents optimize a loss function, not truth conditions. Therefore, the "meaning" we attribute is a tool for prediction, not a discovery of intrinsic content.

  Finally, the term "translation" is strained in this context. Quine's field linguist operates within a context of shared normativity; the native speaker is accountable to a community's usage, providing a constraint (however loose) on correctness. The RL agents possess no norms, only optimization pressures. They are not following rules; they are minimizing error. Thus, this is better described as "interpretation" in a thinner, instrumentalist sense. We are not translating a language but modeling a causal mechanism. The indeterminacy here is even more radical than Quine's: without the background of human normativity, there is less to anchor the presumption of charity. The case ultimately strengthens Quine's thesis by showing that even when the "black box" is made transparent, semantics remains ungrounded by physics.

  ***

  **Marking Scheme**

  **Total Marks:** 20 (5 Criteria × 4 Marks)

  | Criterion | Marks Available | Required Move (4 Marks) | Characteristic Error (0 Marks) |
  | :--- | :---: | :--- | :--- |
  | **1. Indeterminacy vs. Underdetermination** | 4 | Identifies case as **indeterminacy** (no fact of the matter) rather than underdetermination (temporary lack of data), citing the seed variation/behavioral equivalence as proof. | Treats the problem as solvable with more data or assumes the "correct" meaning exists but is currently hidden. |
  | **2. Indeterminacy vs. Inscrutability** | 4 | Distinguishes **inscrutability** (term reference) from **indeterminacy** (holistic manual), noting the case involves global mapping consistency, though reference is also inscrutable. | Collapses the two concepts entirely or claims the case is *only* about reference without addressing the holistic manual. |
  | **3. The Weights/Physicalism** | 4 | Argues that **weights do not settle semantics**; weights are physical/syntactic facts, and physical facts do not fix meaning (Quinean physicalism). | Claims that knowing the weights reveals the "true" encoding or that the system's determinism guarantees a single semantic fact. |
  | **4. Pragmatics and Simplicity** | 4 | Asserts choice between manuals is **pragmatic** (utility/simplicity), not factual; simplicity would not override truth if meaning were factual. | Argues we choose the simpler manual because it is *more likely to be true* (treating simplicity as epistemic rather than pragmatic). |
  | **5. Translation vs. Interpretation** | 4 | Notes the **lack of normativity/community** in agents; concludes "translation" is metaphorical and "interpretation/modeling" is more apt. | Insists "translation" is fully apt without addressing the lack of normative accountability or community usage in the agents. |
