      *   *The Conflict:* Philosopher (Instrumental = Good) vs. Soldier (Instrumental = Bad). Why?
          *   Hypothesis 1: Truth vs. Falsehood. The philosopher seeks *truth* (even if via loosened tongue); the soldier seeks *false courage* (chemically induced).
          *   Hypothesis 2: Reason's Role. The philosopher uses wine to *aid* reason's expression (parrhesia); the soldier uses wine to *bypass* reason's fear (numbing).
