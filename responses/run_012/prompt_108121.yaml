          *   Refinement: Drinking is acceptable if it serves the *cultivation* of Virtue (specifically Wisdom or Temperance) and unacceptable if it serves the *bypassing* of Virtue (Courage or Justice).

      *   *Candidate 2: The Teleological Alignment Principle (Aristotelian/Platonic mix).*
          *   Core: Is the end goal aligned with the Good of the Soul?
          *   Philosopher: Goal = Truth (Good).
          *   Soldier: Goal = Steady Nerves (Bad, because courage requires feeling fear and acting anyway).
          *   Grieving: Goal = Forgetfulness (Bad, opposes acceptance/reason).
