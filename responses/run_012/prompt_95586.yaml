answer: |-
  Thank you. Thank you all for being here. My great-aunt died in March. When her papers came to me, I expected letters, maybe recipes. Instead, I found names. Dates. A gap where a community used to be. That is how I ended up standing here, chairing a committee to do what this town should have done decades ago.

  We are here to unveil a plaque. But as many of you know, getting the words on this stone has been a fight. And I want to talk about that fight for a moment, not to air grievances, but because the struggle over the words is part of the history we are marking.

  On one side, my cousins say that if we cannot call this what it was, the plaque is a lie. On the other, the historical society argues that without a surviving written order specifying the destruction of a people, the word "genocide" is legally imprecise. They prefer "massacre."

  I want to say clearly: The historical society's rigor is not stupid. They are asking for evidence that would hold up in a court. But this is not a court. This is a town square.

  The word we are debating was coined by a man named Raphael Lemkin. He knew that language is messy. He built the word himself—a mongrel, half Greek, *genos*, meaning birth or race, and half Latin, *cide*, meaning killing. He knew it was a construction. He needed a new word because the old ones failed.

  Lemkin's original idea was wide. To him, genocide wasn't just the killing of bodies. It was the destruction of a pattern of life. It was the erasure of language, of leadership, of economic life, of culture. It was the crime of replacing one people's way of being with another's. By that definition, what happened here in 1942 fits. The Jewish community was not just shot; they were removed from the story of this town. Their shops were emptied, their synagogue silenced, their graves neglected. The pattern of life was broken.

  But after the war, when the world tried to codify this into law, the definition changed. The 1948 convention cut Lemkin's broad idea down to a short list of physical acts. It dropped cultural destruction. It dropped political groups. It required a specific intent that is hard to prove without a signed order from the top.

  We have to be straight about why that happened. The line between genocide and not-genocide was not drawn only by moral clarity. It was drawn partly by governments protecting themselves. Nations voted to narrow the definition so that their own actions would not be scrutinized. They made the legal bar higher than the moral reality.

  So, when the historical society says there is no legal proof of genocide, they are right about the law. The law was designed to be narrow. But when my cousins say calling it anything else is a lie, they are right about the truth.

  The crime committed here did not wait for the word. The people who were rounded up and shot over those two days did not die waiting for a legal definition. They died because they were Jewish, because they were neighbors, because they were part of a fabric that someone decided needed to be cut out.

  A legal definition is a tool for courts. It is not a verdict on what a town owes its dead. We are not here to convict a regime that no longer exists. We are here to acknowledge a wound that never healed.

  If we use the word "massacre," we describe the killing. If we use the word "genocide," we describe the intent to erase. This plaque must hold both. It must acknowledge that while the paperwork may be lost, the emptiness left behind is evidence enough.

  To my family: I hear you. To the historical society: I respect your standards. But today, we choose memory over litigation. We choose the broader truth over the narrower law.

  This stone is not the end of our work. It is the beginning of a honesty this town has owed for eighty years. It says that we know what happened here. It says that the pattern of life that was broken is remembered by those of us who stand here now.

  Let us unveil it. Not as judges, but as witnesses. Thank you.
