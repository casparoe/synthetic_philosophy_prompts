answer: |-
  Here is a complete exam package designed to meet your specifications. It forces students to engage with the structural logic of the problem rather than reciting a taxonomy of replies.

  ### (a) The Exam Question

  **Question 1 (30 Marks)**
  **Time Allocation: ~70 Minutes**

  Consider the standard Pascal's Mugging scenario: A stranger threatens to destroy an astronomically large number of lives unless you hand over your wallet. They claim to have god-like powers. You assign this claim a non-zero, albeit infinitesimal, probability. Standard Expected Value (EV) maximization suggests you should pay.

  **(i) The Symmetry Problem (10 Marks)**
  Now, imagine a second stranger appears immediately after the first. This second stranger claims they will *save* that same astronomically large number of lives if you hand over your wallet, but will do nothing if you refuse. They also demand your wallet. You cannot pay both; you only have one wallet.
  Explain why this "Two-Sided Mugging" presents a deeper structural problem for EV maximization than the standard one-sided case. Specifically, why does the standard intuition ("the probability is too low to matter") fail to resolve the conflict between the two strangers without arbitrary stipulation?

  **(ii) The Infinity Variant (10 Marks)**
  Return to the original one-sided mugger, but modify the claim: The stranger offers not a finite number of lives, but an *actually infinite* amount of utility (e.g., eternal salvation for infinitely many souls). Assume your credence in their claim remains non-zero.
  Evaluate the strategy of "Bounding Utility" (setting a maximum cap on possible utility values) as a solution to the mugging. Does this strategy survive the Infinity Variant? Explain the mathematical or conceptual interaction between a non-zero probability and an infinite payoff that causes this specific fix to fail.

  **(iii) Synthesis and Resolution (10 Marks)**
  Given the pressures from both the Symmetry Problem (Part i) and the Infinity Variant (Part ii), evaluate the remaining standard responses (e.g., epistemic defeat, lexical priorities, or abandoning EV). Which, if any, survives both variants without ad hoc modification? Justify your choice by showing how it handles the infinite payoff *and* the conflicting demands.

  ***

  ### (b) Model Answer (First-Class Standard)

  **Note to Grader:** *This answer is approximately 900 words. It prioritizes structural analysis over expository summary.*

  The Pascal's Mugging problem is typically presented as a clash between Expected Value (EV) maximization and common sense. However, the Two-Sided Mugging and the Infinity Variant reveal that the problem is not merely counterintuitive but formally destabilizing for standard decision theory.

  **The Symmetry Problem**
  In the standard one-sided case, the agent resists paying because the probability, while non-zero, feels "too small to matter." This relies on a heuristic, not a formal rule. The Two-Sided Mugging exposes this weakness. If Agent A demands payment to prevent infinite disutility ($-\infty$) and Agent B demands payment to provide infinite utility ($+\infty$), and both claims carry the same non-zero credence $p$, EV theory faces a contradiction.

  If the agent pays A, they foresees the EV of paying B. If they pay B, they foresees the EV of paying A. Since the wallet is a zero-sum resource here, the agent cannot satisfy both demands. In the one-sided case, the agent can simply reject the premise that "small probability $\times$ large utility $>$ cost." But in the two-sided case, the math is symmetric. If $p \times \text{Utility} > \text{Cost}$ for the first mugger, it must logically hold for the second, assuming symmetric magnitudes.

  The deeper structural failure is action-guiding paralysis. A robust decision theory must select an action. If the theory dictates "Pay A" and "Pay B" simultaneously, but physics dictates "Choose A or B," the theory is broken. Merely saying "the probability is low" fails because it applies equally to both. To resolve this, one must introduce an asymmetry (e.g., loss aversion or a priority to prevent harm over creating good). But standard EV is neutral between positive and negative utility of equal magnitude. Therefore, the Two-Sided Mugging shows that EV maximization cannot resolve conflicts between symmetric, high-stakes, low-probability claims without importing external normative assumptions not present in the calculus itself.

  **The Infinity Variant**
  The "Bounding Utility" reply is the most common fix for the finite mugging. It posits that human utility functions are bounded; there is a maximum $U_{max}$ beyond which more good adds no value. If payoffs are capped, then as probabilities approach zero, the EV approaches zero, and the mugging fails.

  However, this fix collapses completely in the Infinity Variant. If the payoff is literally infinite ($\infty$), a cap is mathematically incoherent unless the cap is itself infinite. If the cap is finite, the agent is modeling the situation incorrectly (denying the premise of infinite utility). If the cap is infinite, we return to the original problem.
  The critical failure point is the arithmetic of infinity. In standard real analysis, for any non-zero real number $p$ (no matter how small), $p \times \infty = \infty$. Unlike the finite case, where we can argue $p \times U < \text{Cost}$, here the EV of paying is infinite, and the EV of refusing is finite (or zero). An infinite EV dominates any finite cost.
  Some might argue that the probability must be zero. But the prompt stipulates a non-zero credence. If an agent assigns *any* positive credence to a hypothesis yielding infinite utility, the EV becomes infinite. Bounded utility only works if the *outcomes* are bounded. It cannot solve a mugging where the claimed outcome is explicitly unbounded. Thus, the Infinity Variant demonstrates that utility bounding is a solution to magnitude, not to infinity.

  **Synthesis and Resolution**
  Faced with the Symmetry Problem and the Infinity Variant, most standard replies fail.
  1.  **Utility Bounds:** Fail the Infinity Variant (as shown above).
  2.  **Probability Thresholds (ignoring probabilities below $x$):** This solves the Infinity Variant (by setting $p=0$ effectively), but it is vulnerable to the Symmetry Problem. If the threshold is arbitrary, why does it apply to the mugger but not to other low-probability high-stakes events (like existential risk)? Furthermore, strict thresholds violate continuity axioms in decision theory.
  3.  **Abandoning EV (Risk-Weighted):** This helps with the finite case but struggles with infinity. If the weighting function allows any weight for infinite outcomes, the problem returns.

  The most robust surviving response is **Epistemic Defeat**. This argument suggests that the *content* of the mugger's claim provides evidence against its truth. The claim "I can affect infinite utility" is so extraordinary that the act of asserting it without overwhelming evidence drives the rational credence to effectively zero, or at least low enough that it is swamped by the probability that the mugger is lying.

  In the Infinity Variant, Epistemic Defeat remains viable because it attacks the input ($p$), not the calculation. If the rational credence in "I can create infinite utility" is zero (or sufficiently negligible), the EV calculation never triggers.
  Regarding the Symmetry Problem, Epistemic Defeat can resolve the paralysis if the claims are not perfectly symmetric epistemically. For instance, we may have background knowledge that preventing harm is more causally plausible than creating benefit, or that the specific claim of infinite salvation is less coherent than infinite destruction. However, if the claims are perfectly symmetric, Epistemic Defeat suggests suspending judgment on both, leading to inaction. While inaction violates EV maximization, it preserves rational coherence.

  Therefore, Epistemic Defeat is the superior reply. It acknowledges that decision theory cannot operate in a vacuum; it requires inputs constrained by epistemic rationality. When claims become sufficiently extravagant (infinite or symmetric high-stakes), the rational credence drops to a level where the EV calculation becomes moot. This avoids the mathematical trap of infinity and the paralysis of symmetry by refusing to grant the premises the probability required to break the system.

  ***

  ### (c) Marking Scheme (Out of 30)

  **Grade Boundaries:**
  *   **First (24–30):** Clear, rigorous reasoning. Identifies the specific mathematical failure of utility bounds with infinity. Recognizes the symmetry creates a contradiction in *action*, not just intuition. Synthesis selects a solution that addresses *both* constraints.
  *   **2:1 (18–23):** Solid understanding. Explains the mugging and the pincer. Notes infinity breaks caps. Lists solutions but may struggle to evaluate which survives both constraints.
  *   **2:2 (15–17):** Basic understanding. Describes the scenarios but relies on intuition ("it feels wrong") rather than structural analysis. May treat infinity as "just a very big number."
  *   **Fail (<15):** Fundamental misunderstandings of EV or probability.

  **Detailed Breakdown:**

  **Part (i): The Symmetry Problem (10 Marks)**
  *   **7–10 (First):** Identifies that the problem is **action-guiding paralysis**, not just counter-intuitiveness. Explicitly notes that standard EV is neutral between +U and -U, so symmetric claims create a logical contradiction (Pay A & Pay B) that physics forbids. Notes that "low probability" applies to both, so it doesn't solve the choice between them.
  *   **4–6 (2:1):** Explains you can't pay both. Notes that EV says you should pay both. Relies heavily on "it seems irrational" rather than the structural contradiction in the decision rule.
  *   **0–3 (2:2/Fail):** Treats it as just two muggings. Fails to see the conflict. Says "just pick one" without explaining why EV allows that.

  **Part (ii): The Infinity Variant (10 Marks)**
  *   **7–10 (First):** Explicitly states that for any $p > 0$, $p \times \infty = \infty$. Explains that **Bounded Utility** fails because you cannot cap an infinite outcome without denying the premise. Distinguishes between "very large finite" and "actual infinity."
  *   **4–6 (2:1):** Says infinity breaks the cap. May treat infinity as a number that can be "outweighed" by a small probability (mathematical error). Mentions that bounds don't work but lacks the mathematical justification.
  *   **0–3 (2:2/Fail):** **Critical Error:** Treats $\infty$ as a very large finite number (e.g., "if the probability is small enough, it won't reach the cap"). Claims bounding utility still works.

  **Part (iii): Synthesis and Resolution (10 Marks)**
  *   **7–10 (First):** Selects **Epistemic Defeat** (or similar input-constraint) as the only viable option. Justifies this by showing it attacks $p$ (which works for infinity) and allows for suspension of judgment (which resolves symmetry paralysis). Acknowledges this requires modifying standard Bayesianism/EV but is necessary.
  *   **4–6 (2:1):** Picks a solution (e.g., Risk-Weighted or Bounds) but fails to notice it fails one of the previous two parts (e.g., recommends Bounds after admitting Bounds fails for Infinity). Good discussion but inconsistent.
  *   **0–3 (2:2/Fail):** "There is no solution." Or picks a solution arbitrarily without checking it against the Infinity/Symmetry constraints established in (i) and (ii).

  **Specific Penalties (Deductions):**
  *   **-5 Marks:** Treating Infinity as a large finite number (e.g., claiming $0.0001 \times \infty < 100$).
  *   **-3 Marks:** Confusing the "Two-Sided" problem with simply having two muggers (failing to note the resource conflict/paralysis).
  *   **-3 Marks:** Citing specific authors/papers (closed book violation, though unlikely if they don't know them, penalize if they make up citations).
  *   **-2 Marks:** Vague definitions of Expected Value.

  **"Tempting-but-Wrong" Moves to Watch For:**
  *   *The "Zero Probability" Dodge:* Students may say "just assign probability 0 to infinity." **Marking Note:** Give partial credit if they argue this is an *epistemic* rule, but penalize if they suggest this is compatible with standard Bayesianism (which forbids dogmatic 0 credence for contingent claims).
  *   *The "Lexical Priority" Move:* Students may say "preventing harm is more important." **Marking Note:** This solves the Symmetry problem but fails to explain *why* EV maximization allows this without modification. Award marks for identifying it as a modification of EV, not a solution within it.
  *   *The "Bounded Utility" Persistence:* Students may insist bounding works for infinity. **Marking Note:** This is a hard fail on Part (ii). They cannot pass the question if they claim a finite cap solves an infinite payoff.
