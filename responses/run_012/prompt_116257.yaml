answer: |-
  You have stumbled onto a distinction that decision theorists spend careers arguing over, but you've done it by trusting your gut rather than reading the literature. Your verdicts are 90% coherent, but there is one specific tension in your Hitchhiker/Newcomb comparison that needs resolving, and your worry about Sunk Costs is based on a slight misapplication of your own principle.

  Here is the precise formulation of what your verdicts add up to. You do not have one principle; you have **two**, and the line between them is the difference between **Output** and **Source**.

  ### Principle 1: The Principle of Optimal Source (Instrumental Rationality)
  **"Rationality is about selecting the best decision-making *source* (character, policy, algorithm), not necessarily maximizing the utility of every individual *output* (act, belief) that source produces."**

  *   **How it works:** You evaluate a choice by asking: *"If I were the kind of agent who makes this choice in this situation, would I get better results than the kind of agent who makes the alternative choice?"*
  *   **What it covers:** Hitchhiker, Toxin, Deterrence, Newcomb, One-shot PD, Sunk Costs.

  ### Principle 2: The Principle of Truth-Tracking (Epistemic Rationality)
  **"Beliefs are rational only if they track evidence, regardless of whether holding them is beneficial."**

  *   **How it works:** You evaluate a belief by asking: *"Does the evidence support this?"* not *"Does believing this help me win?"*
  *   **What it covers:** Overconfidence.

  ---

  ### Running Your Cases Through These Principles

  Here is how these two principles validate most of your verdicts, correct one of your worries, and force you to drop one specific intuition.

  #### 1. Hitchhiker & Newcomb (The Consistency Check)
  *   **Your Verdict:** Hitchhiker (Pay/Be the payer), Newcomb (One-box).
  *   **The Principle:** Principle 1. In both cases, your choice is *evidence* of a prediction made in the past. The "source" that gets the ride/gets the million is the "source" that pays/one-boxes.
  *   **The Tension You Must Resolve:** You wrote: *"not paying once I'm home is also clearly the smart move."*
      *   **Correction:** You have to drop this. It contradicts your Newcomb verdict. In Newcomb, taking both boxes is "clearly the smart move" in the moment (the money is already there or not), yet you one-box. In Hitchhiker, paying is "clearly a loss" in the moment, yet you want to be the payer.
      *   **The Fix:** If you one-box in Newcomb, you must admit that paying in Hitchhiker is the *rational act* for an agent who wants to be rescued. It feels like a loss, but it is the price of being the kind of person who gets rides. If you keep saying "not paying is smart," you are secretly a Causal Decision Theorist in the desert but an Evidential Decision Theorist in the lab. Pick one. Given your other verdicts, you should align Hitchhiker with Newcomb: **Paying is the rational move.**

  #### 2. The Toxin & Deterrence (The Intention Problem)
  *   **Your Verdict:** Form intention/Threaten (Yes), Drink/Fire (No).
  *   **The Principle:** Principle 1. This is the hardest case for any theory. Your intuition that "an intention I know I won't act on feels defective" is correct.
  *   **The Fix:** Principle 1 resolves this by shifting the locus of rationality. It is not rational to *drink*, but it is rational to *be the sort of agent who can bind themselves*. The "defect" you feel is the friction between your current self (who sees no reason to drink) and your past self (who needed the intention). Principle 1 sides with the past self's policy because that policy gets the million. You don't need to successfully intend to drink; you need to intend to *be bound*.

  #### 3. Sunk Costs (Your Worry)
  *   **Your Verdict:** Irrational.
  *   **Your Worry:** "If you chose in advance to be someone who honors commitments, doesn't he qualify?"
  *   **The Principle:** Principle 1 actually **condemns** your friend.
  *   **Why:** Principle 1 says "Pick the policy that yields the best results."
      *   In **Hitchhiker**, the policy "I keep promises" *causes* (via prediction) the rescue. The commitment is the lever.
      *   In **Sunk Costs**, the policy "I honor past expenditure" does *not* cause the restaurant to succeed. The money is gone regardless. The policy "I ignore sunk costs and cut losses" yields better financial results than "I throw good money after bad to honor the past."
      *   **The Line:** A commitment is rational to honor only if having the *disposition* to honor it influenced the outcome you are currently enjoying. Your friend's past spending did not buy him future success; it bought him a failed kitchen. Honoring it now changes nothing but his bank balance.

  #### 4. One-Shot PD
  *   **Your Verdict:** Defect.
  *   **The Principle:** Principle 1.
  *   **Why:** You specified "no reason to think our choices are correlated." Therefore, your decision algorithm is not evidence of the other player's algorithm. The policy "Defect when uncorrelated" outperforms "Cooperate when uncorrelated." This is consistent with One-Boxing in Newcomb (where they *are* correlated).

  #### 5. Overconfidence
  *   **Your Verdict:** Belief is irrational.
  *   **The Principle:** Principle 2.
  *   **Why:** This is the cleanest case. Principle 1 handles actions; Principle 2 handles beliefs. You can *act* confident (Principle 1: optimal policy for performance) without *believing* you will win (Principle 2: evidence says you're the underdog). Your intuition to tell her to "be confident, not believe" is the exact boundary line between the two principles.

  ---

  ### The Boundary Line

  You asked where the line falls. Here is the precise test to distinguish Principle 1 from Principle 2 in any new case:

  **Ask: "Does holding this mental state *change the world* (or predict the world), or does it just *describe the world*?"**

  *   **If it changes/predicts the world (Action/Disposition):** Use Principle 1. You are allowed (and required) to adopt policies that seem costly in the moment if they make you the kind of agent who gets better outcomes overall. (Hitchhiker, Toxin, Deterrence, Sunk Costs).
  *   **If it just describes the world (Belief):** Use Principle 2. You are never allowed to believe a falsehood, even if it helps. (Overconfidence).

  ### The Test Case

  Here is a case you didn't list to run your new system on:

  **The Blackmail Problem:**
  A blackmailer has a photo of you. He says, "Pay me $10k, or I release it." He also says, "I am a perfect predictor of human psychology. I only sent this letter if I predicted you would pay. If I predicted you wouldn't pay, I never would have bothered contacting you."
  You have the letter. The photo exists.

  **Run your principles:**
  1.  **Principle 1 (Source):** If you are the *kind of agent* who pays blackmailers, you get contacted and lose $10k. If you are the *kind of agent* who never pays, the predictor never sends the letter, and you lose nothing.
  2.  **Principle 2 (Truth):** The photo exists. The threat is real.

  **Your Verdict should be:** Do not pay.
  **Why:** Even though paying saves your reputation *now*, being the sort of person who pays *caused* you to be in this spot. Principle 1 dictates you adopt the policy "Never pay blackmail," which means you must not pay now, even though it hurts. (This is the "Parfit's Hitchhiker" logic applied to a threat).

  If you feel a strong urge to pay to save your reputation, you are slipping back into "Act Rationality" (minimizing immediate loss) rather than "Source Rationality" (minimizing lifetime loss).

  ### Summary of Required Drops
  To make your system perfectly coherent, you must drop one specific intuition:
  *   **Drop:** "Not paying [the Hitchhiker] once I'm home is also clearly the smart move."
  *   **Replace with:** "Not paying is the *tempting* move, but paying is the *rational* move for an agent who wants to survive the desert."

  If you make that swap, your verdicts form a robust, two-principle system that handles all the cases without contradiction.
