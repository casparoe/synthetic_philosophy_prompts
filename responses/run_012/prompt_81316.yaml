answer: |-
  Consider a symmetric one-shot game where each player chooses among Cooperate, Defect, or Punish. If both players Cooperate, they each receive a payoff of 3, which constitutes the best Nash equilibrium since unilateral deviation to Defect yields 0 and to Punish yields 0. If both players Defect, they each receive 1, but this profile is not a Nash equilibrium because a unilateral switch to Cooperate against a Defector yields 2, which is strictly better than 1. The Punish action yields 0 for both players regardless of the opponent's move, serving as a value-destroying threat that offers no direct strategic gain but can be used to penalize deviations.

  The programs submitted are simple conditional scripts that rely on syntactic identity checks. Player 1 submits a program that reads Player 2's source code and checks if it matches a specific hash of Player 2's expected program; if the code matches, the program outputs Defect, otherwise it outputs Punish. Player 2 submits a mirror program that checks for Player 1's expected code hash and plays Defect on a match and Punish on a mismatch. When these two specific programs interact, each recognizes the other's source code as the expected partner, so both output Defect, resulting in the Mutual Defect outcome with payoffs of 1 for each. Neither player can unilaterally submit a different program to improve their payoff because any alteration changes their source code hash, causing the opponent's program to detect the mismatch and switch to Punish, which drops the deviator's payoff from 1 to 0.

  In terms of standard solution concepts, the best Nash equilibrium is Mutual Cooperate at 3,3, while the program equilibrium outcome is Mutual Defect at 1,1, which is strictly worse for both players and is not itself a Nash equilibrium since Cooperate is a better response to Defect. This outcome is also not a correlated equilibrium because no correlation device could recommend Defect to both players without at least one having an incentive to ignore the recommendation and Cooperate. The single feature doing the lifting is the ability to condition actions on the exact syntactic identity of the opponent's source code, which transforms the code into a rigid tag that triggers threats. If you take that feature out and restrict programs to observing only input-output behavior, the threat collapses because a deviator could mimic the expected behavior without committing to the threat logic, restoring the incentive to Cooperate. Someone who thinks this is just commitment in a trenchcoat would attack the case by arguing that this is merely a selection problem inherent to any commitment device, noting that the same logic could sustain the efficient outcome if the programs targeted Cooperate instead of Defect, so the existence of a bad program equilibrium does not refute the claim that program equilibrium enables cooperation, only that it also enables inefficient coordination.
