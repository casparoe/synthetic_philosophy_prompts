          6.  *The Twist:* "Existential Prior." If the number stays the same for 3 rounds, everyone loses big (Starvation). This forces them out of the Dark Room.
      *   **Cards:** Precision (ignore mismatch), Attenuation (discount self-caused change).

  5.  **Refining the "Dark Room" Trap:**
      *   The user wants them to walk into the trap. If I add a "Starvation" rule immediately, they won't fall in.
      *   *Strategy:* Run Phase 1 without the Starvation rule. Let them find the freeze. Let them feel smart. Then introduce Phase 2: "Your battery is draining." Now they have to leave the Dark Room.
      *   *Wait, User's constraint:* 45 mins total. Need to keep it tight.
      *   *Decision:* Run one continuous game. Introduce the "Existential Prior" (need for change) as a hidden rule revealed *after* the freeze, or as a ticking clock.
      *   *Better:* Make the "Existential Prior" explicit in the instructions but easy to ignore. "Goal: Minimize Error." (They ignore the need for novelty). Then debrief reveals the missing constraint.
      *   *Actually, best for seminar:* Let them hit the freeze. Let them sit in it for 2 minutes. It will get awkward. *Then* intervene as the "Evolutionary Pressure."

  6.  **Developing the Debrief:**
      *   Must connect the game mechanics to PP concepts.
      *   Action = Changing World to match Prediction.
      *   Perception = Changing Prediction to match World.
      *   Dark Room = Minimizing error by removing input.
      *   Escape = High-level Priors (hunger, curiosity) that value *specific* surprises.

  7.  **Addressing Limitations:**
      *   Hierarchy (deep vs. shallow priors).
      *   Continuous time vs. discrete rounds.
      *   The "Self" evidence (existence depends on sampling).

  8.  **Final Polish:**
      *   Tone: Academic but playful.
      *   Formatting: Clear sections for the instructor.
      *   Check against constraints: 16 students, 45 mins, no math.

  9.  **Self-Correction on "World Team" Incentives:**
      *   If the World Team is humans, they will get bored or try to win.
      *   If the World Team's goal is "Minimize Mismatch" (same as Agents), they will collude to freeze.
      *   If the World Team's goal is "Maximize Mismatch" (Adversarial), they prevent the Dark Room.
      *   *Solution:* The World Team represents *Physics*. Physics doesn't care. But to make the game work, the World Team should be incentivized to *minimize energy expenditure*. Changing the die costs them points. Matching the prediction costs nothing. This aligns them with the Agents toward a freeze.
      *   *Wait, one more tweak:* To make the "Action" option meaningful, the Agent must find it cheaper to Move the World than to Change their Mind.
      *   *Cost Structure:*
          *   Prediction Error: -5 points (Agent).
          *   Updating Belief (Changing Guess): -1 point (Agent).
