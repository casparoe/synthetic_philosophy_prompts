answer: |-
  This is a fantastic concept. You are correctly identifying that the "Dark Room Problem" isn't a bug in Predictive Processing (PP); it's a feature that reveals the necessity of *prior preferences* (goals/needs). If the only goal is to minimize prediction error, the optimal solution is death/stasis.

  Your mechanic of letting Predictors *move the World* is the correct translation of "Active Inference." However, to make the "Dark Room" emerge naturally without you forcing it, we need to align the incentives of Team A (Agents) and Team B (World) toward **stability**, not conflict. If Team B is adversarial, they will prevent the freeze. If Team B is inertial (lazy), the freeze happens organically.

  Here is the fully fleshed-out activity design, tuned for a 45-minute slot.

  # Activity Title: The Homeostasis Trap

  **Time:** 45 Minutes total (5 min setup, 20 min play, 20 min debrief)
  **Participants:** 16 students (Two teams of 8: "Agents" and "Environment")
  **Materials:**
  *   2 large whiteboards or flipcharts (one for each team to record scores/state).
  *   1 six-sided die (physical prop for the "Current State").
  *   Printed "Action Cards" (3 per Agent team).
  *   Printed "Precision Cards" (2 per Agent team).
  *   Score sheet for the Instructor.

  ## 1. The Setup (5 Minutes)
  Divide the room. Team A (Agents) sits facing Team B (Environment). Place the die in the center where everyone can see it.

  **The Story:**
  "Team A are brains. Your only goal is to minimize **Prediction Error**. You lose points if your guess doesn't match the die.
  Team B is the Physical World. Your goal is to minimize **Energy Expenditure**. You lose points if you change the value of the die.
  You are not enemies. You are two systems trying to minimize cost."

  **The Rules:**
  1.  **State:** The die shows the Current State (1–6). Starts at random.
  2.  **Prediction:** Team A secretly writes a number (1–6). Reveal simultaneously.
  3.  **Scoring (Perception):**
      *   Match: Everyone happy. 0 points lost.
      *   Mismatch: Team A loses **5 points** (Prediction Error).
  4.  **Scoring (Action):**
      *   Team B *can* change the die value between rounds, but it costs Team B **5 points** per step changed.
      *   Team A *can* pay **3 points** to force Team B to move the die 1 step toward their prediction (This is **Active Inference**).
  5.  **Special Cards (Team A only):**
      *   **Precision Weighting:** Play before reveal. If there is a mismatch, ignore it (0 points lost). *Represents: "That input was noise, I won't update on it."*
      *   **Sensory Attenuation:** Play after you pay to move the die. The move costs 0 points. *Represents: "I caused this sensation, so I don't count it as surprise."*

  **The Hidden Trap (Instructor Eyes Only):**
  There is no rule forcing them to move. If Team A predicts "3" and the die is "3", and nobody moves anything, the score remains perfect forever. This is the Dark Room.

  ## 2. The Gameplay (20 Minutes)
  Run rounds quickly (2 mins per round).

  **Phase 1: Exploration (Rounds 1–4)**
  *   Let them play normally. Team A will likely try to guess the die. Team B will likely stay still to save energy.
  *   *Expected Outcome:* Team A realizes guessing is risky (5 point penalty). They will notice they can pay 3 points to *guarantee* a match.
  *   *Instructor Note:* If Team A is just updating beliefs (changing their guess), remind them: "You want to minimize error, not be right. Is it cheaper to change your mind or the world?"

  **Phase 2: The Freeze (Rounds 5–8)**
  *   Team A will likely use the Action option to lock the die onto a number (e.g., 4).
  *   Team B won't move because moving costs energy.
  *   Team A won't change prediction because it matches.
  *   **The Silence:** The game will stall. The die never changes. No points are lost. The room will get quiet. This is the Dark Room.
  *   *Instructor Note:* Let this sit for 30 seconds of awkward silence. Do not rescue them yet.

  **Phase 3: The Metabolic Cost (Rounds 9–10)**
  *   *Intervention:* Stop the game. Announce: "New Rule: **Existential Prior**. You are a living system. If the State does not change for 3 consecutive rounds, you lose 10 points (Starvation/Entropy)."
  *   Resume for 2 rounds.
  *   *Expected Outcome:* Panic. To survive, they must create *controlled surprise*. They have to move the die, but predict the move, to avoid Error while avoiding Starvation.

  ## 3. The Debrief (20 Minutes)
  Do not let them pack up. Keep them in the tension.

  **Step 1: The Phenomenology (5 mins)**
  *   "Raise your hand if you felt the game 'end' around Round 6 even though we kept playing."
  *   "Why did you stop moving?" (Answer: Because moving cost points/surprise).
  *   "Why did you start moving again?" (Answer: Because staying still cost more).

  **Step 2: The Theory (10 mins)**
  Connect the mechanics to the philosophy. Use the board to map game terms to PP terms:
  *   **Prediction Error** = Free Energy / Surprise.
  *   **Updating Guess** = Perceptual Inference (changing the model).
  *   **Moving the Die** = Active Inference (changing the world).
  *   **The Freeze** = The Dark Room Problem. If the only goal is minimizing error, the optimal strategy is to lobotomize yourself and sit in a dark room.
  *   **The Metabolic Cost** = **Prior Preferences**. In real biology, we have hard-coded priors (hunger, temperature, curiosity) that *demand* specific inputs. We don't just want *any* prediction confirmed; we want *life-sustaining* predictions confirmed.

  **Step 3: The Cards (5 mins)**
  *   Ask who used the **Precision Card**. "You effectively gaslit yourself. You told the system the data was wrong to protect the model." (Explaining Away).
  *   Ask who used **Sensory Attenuation**. "Why did you use it?" (Because self-generated input shouldn't update your model of the external world).

  ## 4. Troubleshooting & Contingencies

  **Problem: The Freeze happens at Minute 6 and stays until Minute 20.**
  *   *Risk:* Boredom.
  *   *Fix:* Have the "Metabolic Cost" rule written on a card in your pocket. If the die hasn't moved for 3 rounds, slam the card down. "Evolution has entered the chat." This saves the philosophy without you lecturing.

  **Problem: Team B gets adversarial and keeps changing the die to spite Team A.**
  *   *Risk:* Turns into a bluffing game, obscuring the PP point.
  *   *Fix:* Remind them: "Team B, you lose points for moving. You are physics, not a goblin. Physics is lazy. Stop moving."

  **Problem: Team A never uses the 'Action' option (Moving the Die).**
  *   *Risk:* The Active Inference point is lost.
  *   *Fix:* In Round 3, announce a "Crisis." Team A loses 10 points for a mismatch. Suddenly, paying 3 points to fix the world looks cheaper. Or, simply ask them during the debrief: "Why didn't you grab the die? You were allowed to."

  **Problem: They laugh off the Dark Room as "obviously stupid."**
  *   *Risk:* Reductio ad absurdum dismissal.
  *   *Fix:* Challenge them. "If you are a robot programmed only to minimize error, the Dark Room is *not* stupid. It is optimal. The burden is on you to explain why a system would ever leave it without adding a rule like 'Hunger'. That rule is what we call 'Desire' or 'Value'."

  ## 5. Limitations (The "Frank Note")
  *Save this for the very end of the debrief. Be honest about what the dice can't do.*

  "You just played a flat, one-level game. Real Predictive Processing has three things this game couldn't show:
  1.  **Hierarchy:** Your priors aren't just 'I expect a 4'. They are deep structures ('I am a human', 'Humans eat food'). The game had no depth, only surface guesses.
  2.  **Continuous Time:** You played in turns. Real inference is a constant flow, not discrete rounds.
  3.  **Learning:** In the game, the cost rules were handed to you. In reality, the system *learns* what costs energy through trial and error over a lifetime.
  This game is a snapshot of the *logic*, not the *architecture*."

  ## 6. The One Sentence Takeaway
  Write this on the board before they leave.

  > **"If perception is just minimizing surprise, then the only way to be perfectly happy is to never encounter anything new; Active Inference solves this by making action the other half of perception, but it requires 'prior preferences' to stop us from locking ourselves in a dark room forever."**

  ## Why This Works for Your Seminar
  1.  **It forces the "Action" equivalence:** By making Action cheaper than Error, you mathematically prove that changing the world is a valid strategy for fixing the mind.
  2.  **It embodies the Dark Room:** They don't hear about it; they *build* it. They create the stalemate.
  3.  **It solves the "Why leave?" problem:** The Metabolic Cost rule is the philosophical pivot. It shows that minimizing Free Energy isn't enough; you need *specific* priors (preferences) to drive exploration.
  4.  **It handles the Psych/Phil mix:** Psych students get the behavioral incentives; Phil students get the ontological implications of perception/action symmetry.

  Good luck. If the room goes silent during the Freeze, don't panic. That silence is the lesson.
