      *   *Result:* Agent prefers Acting (-2) over Updating (-1)? No, Updating is cheaper.
      *   *Fix:* Make Updating expensive (Cognitive Load) or make Acting cheap.
      *   *PP Logic:* In PP, Action and Perception are symmetric. Let's make them cost the same, but Acting guarantees the match, while Updating risks another error next round.
      *   *Simpler:* Just let them feel the *power* of Acting. "I don't want to be wrong, so I'll make the world right."

      *(Self-Correction during drafting)*: I need to make sure the "Dark Room" emerges naturally. If the World team is adversarial, it won't. If the World team is cooperative, it will. Let's make the World team *passive* but costly to change.
      *   *Revised Plan:* World Team starts with a number. They *can* change it, but it costs them. Agents want to match it. Agents can pay to change it.
      *   *The Freeze:* Agent predicts 3. World is 3. Nobody moves. Score stabilizes.
      *   *The Problem:* Why leave?
      *   *The Fix:* The "Existential Prior." I will instruct the facilitator to introduce a "Hunger" mechanic halfway through if the freeze happens too early.

      *(Final Decision on Mechanics)*: Keep it simple.
      1. Agent predicts.
      2. World reveals.
      3. Mismatch = Agent loses points.
      4. Agent can Pay to Move World (Action).
      5. World Team wants to minimize *their* movement (Energy).
      6. Result: Convergence on a number.
      7. Twist: "Metabolic Decay" (lose points every round regardless). Forces movement.

      *Wait, the User's specific cards:* Precision and Sensory Attenuation. I must include these.
      *   Precision: Ignore a round of error.
      *   Attenuation: If you moved the world, the error doesn't count.

      *Okay, let's write it.*

  10. **Final Review against constraints:**
      *   45 mins? Yes, tight schedule.
      *   16 students? 8 vs 8 works.
      *   No math? Yes.
      *   Dark Room point lands? Yes, via the freeze + metabolic cost.
      *   Limitations explained? Yes.

      *One Sentence Takeaway:* "Active inference dissolves the line between perceiving and acting, revealing that avoiding surprise is indistinguishable from hiding from the world, unless you have prior reasons to care what happens."

