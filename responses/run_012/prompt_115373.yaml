prompt: |-
  ok so for my phil of mind seminar i have to design and run an activity for the class and i could use a hand turning my half-baked idea into something that actually runs. here's the situation: 16 of us, third years, mixed philosophy and psych, 90 minute seminar and i get 45 of it. topic is predictive processing / active inference. nobody in the room can do the free energy maths, and honestly i don't want to stand up and recite the two lines everyone already knows (brain predicts, perception is inference). what i want is for them to feel the weird consequence instead: that perceiving and acting are the same kind of move, and that if the whole story is "minimise the mismatch between what you expect and what you get," then the optimal strategy is to stop being surprised ever again. pick a quiet dark room and stay in it. the dark room thing reads like a cheap gotcha but i think if the rules are set up right they'll walk into it themselves and then have to argue their way out, which is way better than me telling them about it.

  so i need the whole thing: setup, materials, rules, scoring, roles, a timeline, the debrief, what will predictably go wrong the first time, and a frank note on what the activity can't show and i'll have to just explain.

  rough shape i have in mind, rewrite it however you think works better. two teams of 8. team A, the predictors, each round secretly writes down a guess at a hidden number from 1 to 6 before the round starts. team B, the world, controls the hidden number with a die or a spinner. everyone starts on 20 points, predictors lose 3 for a wrong guess and gain 1 for a right one, the world team gains a point whenever a predictor is wrong and loses one when they're right, so they're incentivised to be unpredictable. after round five the predictors get a new option: instead of updating their guess they can spend 2 points to move the world one step toward their existing guess. that's the bit i care about most, you can close the gap from either end and the cheap end is making the world fit you.

  two extra cards i want in there because they're the parts of the theory i actually want them to trip over. a precision card: once per game a predictor can declare one observation to be noise and ignore it, which is explaining away in the flesh. and a sensory attenuation card: if the world's number moved because you paid to move it, the next guess is free, so input you caused yourself gets discounted. also let the world team move at most one step per round, and let them do nothing if they want. i want the game to be allowed to freeze, because the freeze is the point: if both sides get lazy everyone settles on a fixed number, nobody scores, nothing happens, and that dead stalemate is the dark room sitting right there on the table. then the debrief has to ask who broke the stalemate and what they had to want besides being right, which is where prior preferences or epistemic value or the fact that the system has to keep sampling to keep existing comes in.

  things i'm worried about and want you to handle: somebody will read the world team's habits and the game turns into bluffing, which is fine but i want to know how to use it. the freeze might happen at minute six and leave me with dead air, so i need a plan B that doesn't give the game away. people will argue about whether the scoring is fair or what the game-theoretically optimal line is instead of talking about the philosophy. and the dark room will probably get laughed off as an obvious reductio, so the debrief needs to make them defend the theory rather than let the theory defend itself. if only two people ever take the action option then the whole perception-action point never lands, so i need a way to force it.

  and then tell me honestly which part of predictive processing my dice just can't reproduce and that i'll have to supply out loud. i'm assuming it's the maths, the hierarchy and the different timescales, and the fact that in the real thing priors get learned rather than handed to you, but you tell me what else is missing and how to say it in two minutes without losing them. also what they should walk out seeing, in one sentence, so i can check the whole thing against it.
