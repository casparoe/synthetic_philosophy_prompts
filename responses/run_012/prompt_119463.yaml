answer: |-
  Good morning faculty, families, friends, and most importantly, the Class of 2024.

  Standing here, I'm supposed to offer you wisdom. But honestly, I'm mostly just trying to remember not to trip over the microphone cord. We've all heard the standard graduation speech playbook. You know the one. It usually involves a variation of three words: "Find. Your. Self."

  We're told that inside us is a solid, pre-made statue of who we're supposed to be, and our job is to chip away the stone until we reveal it. But I've been thinking a lot lately, and I don't think that's right. I don't think I have a static self to find. And honestly? I think that's good news.

  I come by this honestly. My older sister is deeply Buddhist, and she's spent years trying to explain her worldview to me. She tells me that believing in a fixed, unchanging "self" is the root of all anxiety. Now, I'm not a philosophy person. But she has this analogy that stuck with me. She calls it the Bonfire View.

  Imagine a bonfire at a beach party. You look at it at 8:00 PM, and you look at it again at midnight. It's the same fire, right? It has the same shape, the same heat, the same name. But if you look closely, not a single flame is the same. The wood that was burning at 8:00 is gone. The embers have shifted. The fuel is completely different. The "bonfire" isn't a thing; it's a pattern. It's a process. It stays itself by constantly changing.

  My sister says people are like that. We aren't nouns; we're verbs. We aren't statues; we're flames.

  This explains a lot about my home life. For example, when I'm being particularly annoying—leaving dishes in the sink or borrowing her hoodie without asking—she doesn't tell me to behave. She just sighs and says, "Try to remember you're a process, not a person." It's her way of saying I'm a work in progress. Usually, I just roll my eyes, but lately, I think she might be onto something.

  If we accept the Bonfire View, it changes how we look at tomorrow. A lot of us are terrified of the future because we think we have to protect who we are right now. We worry, "What if I go to college and change? What if I get a job and I'm not the same person who walked across this stage? What if I lose myself?"

  But the bonfire doesn't worry about losing itself. If the fire stopped changing, if it stopped consuming new fuel and releasing new heat, it wouldn't be a fire anymore. It would be ash.

  So, to my classmates: Don't worry about "finding" yourself. You aren't lost. You're just burning.

  I know we come from a lot of different backgrounds. Some of us believe in an eternal soul, some believe in energy, some believe in biology. I'm not here to debate theology. But whatever you believe is happening on the inside, on the outside, we all know the experience of change is real. We know that the person who sat in freshman homeroom is not the person sitting here today. And the person sitting here today won't be the person walking across this stage ten years from now.

  That isn't a failure. That's the job.

  If you are a pattern, not a fixed thing, then your mistakes don't define you forever. They're just old logs that have already burned up. If you are a process, then you don't have to carry the weight of being "perfect" or "consistent." You just have to keep burning. You have to keep finding new fuel—new ideas, new friends, new challenges—and let the old stuff turn to ash.

  So, my advice isn't to find yourself. My advice is to tend your fire.

  Protect it from the wind when you need to. Feed it when it's hungry. And don't be afraid to let the flames lick in a new direction. You are allowed to change your major. You are allowed to change your mind. You are allowed to grow into someone your freshman self wouldn't even recognize. In fact, that's the goal.

  We are not monuments. We are bonfires. And tonight, we take our spark out into a very wide, very dark world.

  Let's go make some light.

  Thank you.
