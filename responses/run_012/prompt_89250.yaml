      *   *The "Hope Nobody Asks" Question:* Needs to be the killer blow that exposes the rationalist/analytic clash. Probably about the *nature* of the representation if it's not the PMOP. Or a trap regarding the definition of "representation." Let's go with the trap about what *does* the work if not PMOP.

