answer: |-
  # Q&A Prep Sheet: Skill, Knowledge, and Action Workshop

  **Thesis Core:** The Intellectualism vs. Dispositionalism debate is verbal (ascriptive). The real question is etiological (does representation guide performance?). The Practical Mode of Presentation (PMOP) is explanatorily empty because it is individuated by the very ability it purports to explain.

  **Strategy:** Do not defend the "verbal dispute" claim as a dismissal. Defend it as a *dissolution* that clears space for empirical work. Acknowledge the linguistic data but deny its metaphysical weight.

  ---

  ### 1. The "Explanatory Power" Objection
  **Who:** S&W Loyalist (Philosopher of Language/Mind)
  **Likelihood:** High | **Damage:** High
  **Idiom:** Propositional attitudes, generality, counterfactuals, normativity.

  **The Objection:**
  "You claim the PMOP is individuated by the ability, rendering it circular. But the whole point of the PMOP is to explain the *flexibility* and *normativity* of skill, not just its existence. A mere disposition to succeed doesn't explain why an agent can adjust to novel obstacles or justify their action. If you strip the PMOP of its content, you lose the explanation of intelligent action. You haven't shown the debate is verbal; you've just ignored the data that motivated Intellectualism."

  **The 2-Minute Reply:**
  "I agree that flexibility needs explaining, but I deny the PMOP is the explainer. The PMOP is a placeholder for 'whatever cognitive state allows this flexibility.' If the content of that state is individuated by the success conditions of the ability itself, it adds no independent causal leverage. The flexibility comes from the underlying cognitive architecture (the etiological fact), not the propositional gloss we put on it. Intellectualism conflates the *description* of the capacity with the *mechanism* of the capacity. We can keep the linguistics—yes, 'knows how' ascribes a relation to a proposition—without buying the metaphysical claim that the proposition *guides* the action in a way distinct from the disposition."

  **Soft Spot / Concession:**
  *Concede:* That you need a positive account of where the flexibility comes from if not the proposition.
  *Soft Spot:* Your claim that PMOP is *wholly* individuated by the ability. S&W will argue the content exists independently (e.g., you can know the proposition without having the skill).
  *Strategy:* Concede that one can possess the proposition without the skill (the "missing link" problem), but insist that *in the moment of skilled performance*, the propositional content does no causal work distinct from the motor program.

  ### 2. The "Theoretical Fruitfulness" Objection
  **Who:** The Chair (Anti-Deflationary)
  **Likelihood:** High | **Damage:** Medium-High
  **Idiom:** Substantive disagreement, theoretical utility, progress, dissolving.

  **The Objection:**
  "Calling a decades-long debate 'verbal' is often a way of saying 'I haven't found the substantive disagreement yet.' If you separate the ascriptive from the etiological, what work is left for philosophy to do? If the only real question is empirical (does representation guide action?), you've made yourself obsolete. Why isn't this just an error theory of the literature rather than a contribution to it?"

  **The 2-Minute Reply:**
  "It's not obsolescence; it's triage. Philosophy's job here is to ensure we aren't asking empirical questions that are framed by linguistic confusions. If Intellectualists and Dispositionalists are arguing past each other about the semantics of 'knows how' while thinking they are arguing about cognitive architecture, empirical work gets muddied. My contribution is mapping the boundary: linguists handle the ascription, cognitive scientists handle the etiology. Philosophy ensures we don't treat a semantic fact as a cognitive mechanism. That prevents category errors in the empirical literature."

  **Soft Spot / Concession:**
  *Concede:* That "verbal dispute" sounds dismissive.
  *Soft Spot:* The Chair suspects you are avoiding the hard metaphysical work.
  *Strategy:* Reframe "verbal dispute" as "conceptual clarification." Use the phrase "dissolving the verbal shell to reach the empirical core."

  ### 3. The "Choking and Transfer" Objection
  **Who:** Cognitive Scientist (Motor Learning)
  **Likelihood:** Medium | **Damage:** High
  **Idiom:** Explicit monitoring, proceduralization, kinematic degradation, transfer tasks.

  **The Objection:**
  "You say the etiological question is orthogonal to the semantic one. But we see that when skilled performers attend to the mechanics (representations), performance degrades ('choking'). If knowledge-how were truly propositional guidance as S&W suggest, attending to the proposition should help or be neutral. If it's purely dispositional, attention shouldn't hurt. Your separation predicts nothing about *why* representation interferes with skill. What does your view predict about the transition from novice to expert?"

  **The 2-Minute Reply:**
  "My view predicts exactly what you see: that the *ascription* of knowledge-how remains stable (we say they 'know how' even when they choke), but the *etiology* shifts. Novices use explicit propositional guidance; experts use consolidated procedural dispositions. The 'orthogonality' claim means the word 'know' applies to both, but the underlying mechanism changes. The interference happens because the expert system is optimized for non-representational control. Re-introducing representation forces a switch back to a slower control loop. My thesis supports your model: don't look for the 'knowledge' in the semantics; look for the control structure in the brain."

  **Soft Spot / Concession:**
  *Concede:* That your paper focuses more on the metaphysics than the learning trajectory.
  *Soft Spot:* You are relying on their empirical model to fill the gap your philosophy leaves open.
  *Strategy:* Align yourself with the "Explicit Monitoring Hypothesis." Position your paper as the metaphysical grounding for *why* that hypothesis makes sense (i.e., because skill isn't essentially propositional).

  ### 4. The "Lived Experience" Objection
  **Who:** Phenomenologist (Dreyfus Line)
  **Likelihood:** Medium | **Damage:** Medium
  **Idiom:** Absorption, ready-to-hand, thematic attention, ontological priority.

  **The Objection:**
  "You concede too much to the linguists. By granting that 'knows how' ascribes a relation to a proposition *at all*, you validate the intellectualist's footprint on the phenomenon. In absorbed coping, there is no subject-object relation, hence no proposition. Why care about the grammar of 'knows' if the lived experience of skill is non-representational? You are analyzing the map, not the territory."

  **The 2-Minute Reply:**
  "I care about the grammar because it traps us. Even if experience is non-representational, our *theory* of experience is built in language. If we leave the linguistic intuition unchallenged, Intellectualism keeps sneaking back in via the back door of semantics. I grant the linguistic data only to isolate it. I agree that in flow, there is no proposition. My point is that the word 'knowledge' covers both the flow and the reflection, and confusing the two is what causes the philosophical standoff. I'm on your side on the etiology; I just think we need to disarm the linguistic argument first."

  **Soft Spot / Concession:**
  *Concede:* That the phenomenological reality is primary.
  *Soft Spot:* They will think you are still too analytic/representationalist.
  *Strategy:* Frame your linguistic concession as a "trojan horse" strategy to defeat Intellectualism on its own ground.

  ---

  ### The "Hope Nobody Asks" Question
  **The Question:**
  "If the PMOP is individuated by the ability, and the ability is the explanandum, then the proposition has no independent causal power. But if the proposition has no causal power, in what sense is this still *Intellectualism*? Aren't you just a Dispositionalist who likes propositional semantics? If so, why isn't the 'verbal dispute' actually a victory for Dispositionalism, rather than a standoff?"

  **Why this hurts:**
  It forces you to admit that your "orthogonal" conclusion might actually collapse into one of the existing camps (Dispositionalism), undermining your claim that you have carved out a new, neutral space. It suggests you haven't dissolved the dispute; you've just picked a side and dressed it up in deflationary clothing.

  **Prepared Answer (if forced):**
  "It's a victory for a *refined* Dispositionalism that acknowledges our linguistic practices without reifying them. The 'standoff' existed because Intellectualists thought semantics implied metaphysics. I'm showing it doesn't. So yes, on the etiology, I side with the dispositionalist. But on the semantics, I grant the intellectualist data. That hybrid view is the only one that respects both the linguistics and the cognitive science."

  ---

  ### Strategic Notes for the Rationalist Expat
  1.  **Watch the "Verbal" Trigger:** To a traditional philosopher, "verbal dispute" often sounds like "you are all stupid and I am dissolving this." To the Chair, it sounds like "no real work here." Use phrases like "conceptual clarification" or "distinguishing levels of analysis" instead of "merely verbal."
  2.  **Don't Over-Formalize:** Your background might tempt you to treat "proposition" like a data structure. The phenomenologists and S&W loyalists treat it as a normative or intentional structure. Acknowledge the normativity even if you think it's epiphenomenal to the motor control.
  3.  **The "Orthogonal" Claim:** This is your most controversial move. Be prepared to draw a diagram on the board. Axis X: Ascription (Linguistic). Axis Y: Etiology (Cognitive). Show that Intellectualism tries to derive Y from X. You are saying X and Y are independent variables.
  4.  **Concede the Normativity:** If they press that propositions provide *reasons* and dispositions do not, concede that propositions track the *reasons* but deny that the reasons *cause* the action in real-time skilled performance. (Reasons vs. Causes distinction).

  **Final Check:** Your strongest shield is the Cognitive Scientist. If the S&W loyalists get too metaphysical, pivot to: "Does this PMOP predict any difference in reaction time or transfer that we can test?" If they say no, you win on empirical grounds. If they say yes, ask the CogSci to evaluate it.
