answer: |-
  1. The impasse is fundamentally two questions under one name, where experimentalists measure psychological causation while revisionists analyze normative justification. This verbal overlap masks a substantive divergence in what counts as the relevant input for decision theory.
  2. No hidden theorem resolves the conflict, but hidden empirical confounds in experimental design allow subjects to rationally infer hidden states from past effort. Formal models often assume common knowledge of irrecoverability that real agents lack, letting information asymmetry do the rationalizing work.
  3. The central question is ill-posed until the phenomenon is disaggregated, because asking if honoring sunk costs is rational admits contradictory answers depending on which mechanism drives the behavior. It is category-mistaken to seek a unified verdict on such heterogeneous processes.
  4. Progress requires an operational distinction that experimentally isolates pure sunk-cost honoring from sunk-cost licensing by controlling for informational content and reputational stakes. A theorem proving the conditions under which past expenditure correlates with future value would formalize the boundary between bias and strategy.
  5. Once the taxonomy is accepted, the debate should dissolve rather than be won, revealing that both sides were correct about disjoint subsets of behavior. Expecting a single verdict on the rationality of sunk costs is therefore an error that guarantees perpetual disagreement.
