prompt: |-
  ok, so I've been teaching myself the units of selection thing and I thought I had it: genes get copied, bodies get eaten, so the gene is the unit that selection acts on, and thats pretty much the end of it — which is also why group selection is dead, right? Then a friend told me its not settled at all, and when I pushed him he said you can write the same evolutionary change either as selection between individuals or as selection between groups, depending on where you assign the fitness. That made it worse, because if its the same numbers either way then it's just two ways of keeping the books, so there can't be a real disagreement about whats actually going on, and my version survives anyway.

  If I'm wrong, where exactly does the "its just bookkeeping" move break down, and can you unjam what the word "unit" is even doing in these debates? I have a feeling I'm using it to mean one thing and the people arguing mean about three, and that my "genes get copied" argument only gets you one of them. Short answer first, then a table with these columns: the claim I made | true or false | whats actually going on (the correction). Give me a row for each claim you think I got wrong.
