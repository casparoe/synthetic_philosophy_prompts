answer: |-
  **The Witness Stand**

  **Setting:** A high court. DR. ARIS, a philosopher of mind, is on the stand. He is calm, precise, and visibly in discomfort from a bandaged hand. MS. VANCE, the cross-examining barrister, circles him.

  **VANCE:** Dr. Aris, you're claiming damages for the excruciating pain you suffered during the incident. Is that correct?

  **ARIS:** Excruciating is the word. A sharp, burning qualia of the highest order.

  **VANCE:** And you're an epiphenomenalist? You hold that conscious experience is real, but causally inert?

  **ARIS:** I do. The pain was a real glow riding atop the neural fire. But it moved no neurons. It pulled no levers.

  **VANCE:** So, to be clear: the pain did not cause you to scream at the time?

  **ARIS:** No. The nociceptors fired, the motor cortex engaged. The scream was physical. The pain was... parallel.

  **VANCE:** And the pain did not cause you to come to court today?

  **ARIS:** No. My memory engrams and my sense of justice did that.

  **VANCE:** And right now, as you sit there, the pain is not causing you to say the words "I am in pain"?

  **ARIS:** Correct. The brain state associated with the pain is causing the speech. The pain itself is merely present.

  **VANCE:** (Pauses, walking slowly toward the witness box) So, Doctor, we have a physical event—your speech—claiming to describe a mental event—your pain. But the mental event never touched the physical event.

  **ARIS:** They share a common cause. The brain state.

  **VANCE:** Like two clocks chiming the same hour because they were wound by the same hand?

  **ARIS:** Precisely.

  **VANCE:** But if I ask one clock why it chimed, it can't say "Because the other clock chimed."

  **ARIS:** No.

  **VANCE:** So when you say "I feel pain," your mouth is reporting on a guest that never spoke to the host?

  **ARIS:** It's not reporting *on* it. It's... coinciding with it.

  **VANCE:** Coinciding how? If I asked you to describe the color of the pain, and your brain said "Red," but the pain was actually "Blue," would you know the difference?

  **ARIS:** (Hesitates) According to the theory... no. The brain would still say "Red." The pain would still be "Blue." I would never know.

  **VANCE:** So your testimony relies on a harmony between your words and your feelings that you have no way of verifying?

  **ARIS:** It's a nomological necessity. The laws of nature ensure they match.

  **VANCE:** But the laws of nature don't ensure *truth*, Doctor. They ensure *correlation*. If your brain was a liar, your pain would be a secret.

  **ARIS:** (Shifts uncomfortably) That is a skeptical hypothesis, not a legal one.

  **VANCE:** Is it? You're asking this jury to compensate you for a suffering that, by your own account, has never moved a single muscle, fired a single synapse, or uttered a single word. You're asking us to pay for the ghost, when only the machine was injured.

  **ARIS:** The ghost is real!

  **VANCE:** But it didn't testify! (Turns to the jury) Your Honor, the witness admits his words are caused by his brain, but the truth of those words depends on a feeling that can't speak. He's not giving evidence. He's reading closed captions for a movie nobody else can see.

  **ARIS:** (Leaning forward) But I *know* the captions are accurate!

  **VANCE:** (Softly) Says the caption generator.

  **(Silence in the court. The Judge looks at his own hand, flexes it, and frowns.)**

  ***

  **Alternative Punchline Option**

  *If you prefer a tighter, more logical snap at the end:*

  **VANCE:** ...So you know you felt pain, but the pain didn't cause the knowledge?

  **ARIS:** Correct.

  **VANCE:** So you possess a truth about the pain that the pain itself did not deliver?

  **ARIS:** It's a reflexive judgment.

  **VANCE:** Doctor, if I write a check that isn't signed by the account holder, the bank calls it fraud. You're asking us to cash a check signed by your brain, for an account held by a ghost.

  **ARIS:** It's a joint account!

  **VANCE:** With no power of attorney. Objection, Your Honor. The witness is claiming knowledge without contact.

  **JUDGE:** Sustained. Witness, until your pain can pick up the microphone, the court considers it hearsay.
