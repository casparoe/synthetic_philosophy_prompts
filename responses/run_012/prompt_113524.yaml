  5.  **Drafting - Attempt 3 (Focusing on the "Match" between word and feeling):**
      *   The core absurdity is that the physical brain *just happens* to produce words that accurately describe a ghostly feeling that didn't tell it to do so. It's a pre-established harmony between the scream and the hurt.
