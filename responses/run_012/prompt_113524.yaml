      *   **Constraint 3:** Don't make epiphenomenalism look *obviously* stupid (it's a live position); the joke should work even for a sympathizer.
      *   **Output:** One main joke, optionally a second version if a better one emerges.

  2.  **Deconstruct the Philosophical Problem:**
      *   *Epiphenomenalism:* Physical events $\rightarrow$ Mental events (Qualia). Mental events $\nrightarrow$ Physical events.
      *   *The Witness:* Says "I felt pain."
      *   *The Physical Chain:* Injury $\rightarrow$ Nerve firing $\rightarrow$ Brain state $\rightarrow$ Vocal cord movement ("I felt pain").
      *   *The Mental Chain:* Injury $\rightarrow$ Nerve firing $\rightarrow$ Brain state $\rightarrow$ *Pain Qualia*.
      *   *The Gap:* The Pain Qualia did not cause the Vocal Cord Movement. The Brain State caused *both* the Qualia and the Vocal Cords independently.
      *   *The Coincidence:* It looks like the Vocal Cords are talking *about* the Qualia, but they aren't. They are just parallel tracks.
      *   *The Cross-Examination:* The lawyer needs to point out that the witness's testimony (physical speech) claims to be caused by the pain (mental), but the theory says it wasn't.

  3.  **Drafting - Attempt 1 (Focus on the "Coincidence"):**
