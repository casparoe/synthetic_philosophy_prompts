      *   If the pain didn't cause the report, the report is just noise that *looks* like a report.
      *   The witness needs to admit the theory while maintaining the testimony, creating a performative contradiction.

  6.  **Refining the Courtroom Scene:**
      *   *Judge/Jury:* Needs to understand the stakes.
