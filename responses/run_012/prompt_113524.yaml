      *   Witness: "Yes."
      *   Lawyer: "But under epiphenomenalism, that pain didn't make you say that."
      *   Witness: "Right."
      *   Lawyer: "So why did you say it?"
      *   Witness: "My brain did."
      *   Lawyer: "And why did your brain say 'pain' and not 'itch'?"
      *   Witness: "Coincidence."
