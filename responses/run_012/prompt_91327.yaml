answer: |-
  **The Estate Sale of the Übermensch**

  Three brothers stand in the attic of their deceased grandmother's house. The air is thick with dust and the smell of old paper. In front of them sits a single cardboard box labeled *"1940–1945: The Hard Years."*

  **The Monumental Brother** reaches in first. He pulls out a ration book where Grandma clearly blacked out a neighbor's name to claim extra sugar. He squints, takes a marker, and writes *"Resistance Leader"* over the blacked-out section.
  "Perfect," he says. "We frame this. It doesn't matter that she stole the sugar from Mrs. Gable. What matters is that *we* need to feel capable of bold action today. If we smooth over the petty theft, she becomes a symbol of defiance. We lie to the past so the future can stand up straight."

  **The Antiquarian Brother** gasps. He is holding a moldy crust of bread from 1943.
  "You would alter the record?" he whispers, horrified. "This mold is part of our lineage! This crust, this dust, this specific shade of yellow on the cardboard—it is all equally sacred because it is *ours*." He carefully places the moldy bread back in the center of the box and locks the lid. "We cannot sell the house. We cannot move the box. We cannot even sweep the floor, for to sweep is to judge the dust unworthy of our presence. We must preserve this attic exactly as it is, until we too turn to dust and join the collection."

  **The Critical Brother** kicks the box.
  "She was a collaborator!" he shouts. "This sugar proves she supported the system! This bread proves she hoarded while others starved! The past is a crime scene, and we are the judges!" He strikes a match to burn the ration book. "We must condemn this history to break its chain! We must destroy it to live!"
  But as the flame catches, he pauses. He adjusts his glasses—the very pair Grandma bought him for his birthday, paid for with that stolen sugar.
  "Actually," he mutters, shielding his eyes with Grandma's glasses, "I need this paper to start the fire that warms me. I condemn the origin, but I am the fruit of the tree I'm chopping down. Pass the matches. And don't look at my lenses."

  Outside, the neighbor mows his lawn, humming a tune he heard on the radio five minutes ago, completely unaware that the house exists.

  ***

  ### A Note on the Text and the Liberties Taken

  This joke relies on a personification of Nietzsche's three modes that the text itself does not strictly support. In *On the Uses and Disadvantages of History for Life*, Nietzsche does not describe three types of *people* (brothers), but rather three necessary approaches or impulses that a healthy culture—or a healthy individual soul—must cycle through to serve "Life."

  **Where the joke follows the text:**
  *   **Monumental:** The joke captures Nietzsche's warning that monumental history "ignores causes" and "smooths over differences" (*Untimely Meditations*, II, §2). It turns unique individuals into generic masks of greatness to inspire present action, often requiring a "pious fraud."
  *   **Antiquarian:** The joke reflects the danger that antiquarian history "mummifies life" (§3). When the preservative instinct loses its discrimination, everything old becomes equally sacred, paralyzing the present's ability to grow.
  *   **Critical:** The joke highlights the paradox Nietzsche identifies in critical history: we are "products of previous generations" and cannot fully escape our origins even as we try to judge and condemn them (§3). We use the past's own tools to break the past.
  *   **The Unhistorical:** The neighbor represents the "unhistorical" capacity—the ability to forget and enclose oneself in a horizon—which Nietzsche argues is essential for action and happiness (§1), distinct from the three *historical* modes.

  **Where the joke takes liberties / Scholarly Disagreement:**
  *   **Compartmentalization:** By splitting the modes into three brothers, the joke suggests one can choose a single mode. Most scholars (e.g., Anthony K. Jensen, Raymond Geuss) argue Nietzsche intends these to be a dynamic equilibrium. A healthy life needs the inspiration of the monumental, the roots of the antiquarian, and the liberation of the critical, regulated by a "plastic power."
  *   **The Status of Critical History:** The joke portrays the Critical brother as somewhat hypocritical (which he is), but there is debate over whether Nietzsche views Critical history as the *highest* mode. Some readers see it as the closest to Nietzsche's own philosophical project (genealogy), while others argue it is just as dangerous as the others if it destroys the soil from which the future grows.
  *   **The Suprahistorical:** The joke omits the "suprahistorical" (those who turn their eyes away from becoming toward the eternal/artistic) to avoid conflating the two triads, as requested. However, scholars like Daniel Breazeale note that the relationship between the "three modes" and the "three states" (unhistorical/historical/suprahistorical) is notoriously ambiguous in the essay, with some arguing they map onto each other and others insisting they are distinct categorizations of human experience.
