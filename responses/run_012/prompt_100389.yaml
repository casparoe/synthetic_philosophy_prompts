      *   *However*, the "Sanction vs. Punishment" distinction might allow them to keep (1) for *punishment* but treat workfare as *administrative*, effectively making it a price while claiming moral high ground. This is risky.
      *   *Better approach:* Use Compatibilism to keep it a Penalty but avoid the *reductio*.

  6.  **Drafting the Response:**

      *   **Acknowledge the sophistication:** This is a classic "Hard Luck" problem in LE.
