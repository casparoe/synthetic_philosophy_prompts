          *   Actually, a hybrid approach is best. Signal intent to one ally beforehand so you aren't alone *in the moment*, but the *public* act is what seals the common knowledge.
      *   **When to Stay Silent (The "Change Your Mind" Condition):** This is crucial for risk assessment.
          *   If the Chair is tyrannical/retaliatory (cost of objection > benefit).
          *   If the plan isn't actually that bad (user is wrong).
          *   If the society will collapse without the plan (existential risk).
          *   If the user is expendable and the others are not (asymmetric risk).

  5.  **Refining the Tone:**
      *   Match the user's intellectual level. Use terms like "Common Knowledge," "Coordination Equilibrium," "Pluralistic Ignorance."
