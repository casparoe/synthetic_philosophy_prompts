answer: |-
  First, let's clear the fog on the principles, because mixing them up guarantees confusion.

  **The Indiscernibility of Identicals** is the boring one everyone accepts. It says: if $A$ is the same thing as $B$, then whatever is true of $A$ is true of $B$. You cannot have one thing that is both identical to itself and different from itself. That is logic.

  **The Identity of Indiscernibles (PII)** is the one under attack. It says: if $A$ and $B$ share every single property, then $A$ is the same thing as $B$. Or, put the other way: if $A$ and $B$ are two different things, there *must* be some property that distinguishes them.

  Black's two spheres are designed to break PII. They are two things ($A \neq B$), but they share every qualitative property (iron, 1kg, 20°C, spherical). If the scenario is possible, PII is false.

  Now, to your diagnosis. You are right to suspect this is largely verbal, but "verbal" here does not mean "trivial." It means the disagreement is about **which vocabulary counts as legitimate for describing reality.** However, there is a hard metaphysical residue underneath the vocabulary.

  Here is the breakdown of what is actually happening.

  ### 1. The Diagnosis: Is it Verbal or Real?

  It is both. It is a verbal dispute about the word "property" that maps onto a substantive dispute about the nature of reality.

  *   **The Verbal Layer:** The debate turns entirely on the definition of "property."
      *   If "property" includes *anything* true of an object (including "being identical to A"), PII is trivially true but useless.
      *   If "property" means only *qualitative* features (mass, shape, color, distance from other qualitative things), PII is substantive but likely false (given the spheres).
      *   If "property" includes *relations* to specific individuals ("being 2 meters from Sphere B"), PII is true, but only because we assume the individuals are already distinct to define the relation.

  *   **The Substantive Residue:** Once you fix the definition of "property," you are left with a hard question: **Is numerical diversity brute, or is it grounded?**
      *   If PII is false, then two things can be distinct simply because they *are* distinct, with no qualitative reason why. This commits you to "primitive thisness" (haecceity).
      *   If PII is true, then distinctness must be earned by some difference in quality or relation.

  So, your guess is correct: most of the fighting is over the definition of "property," but the residue is a genuine disagreement about whether "being a distinct object" is a fundamental fact of the universe or a derivative one.

  ### 2. The Three Camps: Commitments and Costs

  Let's look at what each person in your group is buying into, often without realizing it.

  **Camp 1: PII is False (The spheres are possible and distinct).**
  *   **Commitment:** They believe in **primitive thisness**. They believe that "Sphere A" and "Sphere B" are distinct entities even if the universe contains no fact that distinguishes them.
  *   **Cost:** They must accept that reality contains brute facts. There is no answer to "what makes A different from B?" other than "they just are." This offends people who want a reason for everything.
  *   **Blind Spot:** They often don't realize they are positing a metaphysical ghost—a "thisness" that has no observable effects.

  **Camp 2: PII is True via Impure Properties (They are discernible).**
  *   **Commitment:** They believe identity is a property. They say Sphere A has the property "being identical to A," which Sphere B lacks.
  *   **Cost:** This makes PII **trivial**. It saves the principle by making it tautological. It says: "If two things are different, they differ in that one is itself and the other is not." This is true, but it doesn't explain *why* they are two things.
  *   **Blind Spot:** They are using the fact of distinctness to prove distinctness. If you ask, "Why are there two spheres?" and they answer, "Because one has the property of being the first one," they are smuggling the conclusion into the premise. This is why you feel suspicious. It is technically a valid move, but it drains the principle of all explanatory power.

  **Camp 3: The World is Impossible (Relationism/Structuralism).**
  *   **Commitment:** They believe space and objects are defined by their relations. If there is no qualitative difference and no asymmetric relation, there is no fact of the matter that there are "two" things.
  *   **Cost:** They have to deny the intuitive possibility of the scenario. They must claim that a universe described as "two symmetric spheres" is actually just a description of a single structural state, or that the description is incoherent.
  *   **Blind Spot:** This requires a very specific metaphysics of space (that space isn't a container things sit in). If you think space is a container (substantivalism), this camp is wrong.

  ### 3. The "Impure Property" Move: Legitimate or Cheat?

  You asked specifically about this. It is a **legitimate logical move but a philosophical cheat.**

  *   **Why it's legitimate:** In formal logic, "being identical to A" is a valid predicate. If you allow all predicates, PII cannot be falsified.
  *   **Why it's a cheat:** The philosophical motivation for PII was never just to make a logical statement. It was to say that **reality is rational.** Leibniz wanted to say that God would have no reason to create two identical things in different places because there would be no sufficient reason to put *this* one *here* and *that* one *there*.
  *   If you allow "impure properties" (properties that reference specific individuals), you destroy the "Sufficient Reason" aspect. You are saying: "They are different because they are different." That defeats the whole purpose of the principle.

  So, if your goal is to save the *logical formula*, Camp 2 wins. If your goal is to save the *philosophical idea* that distinctness requires a qualitative ground, Camp 2 fails.

  ### 4. Evaluating Your Variations

  Your variations are excellent diagnostic tools. Here is what they reveal.

  **Variation 1: The Cube (Breaking Symmetry)**
  *   *Scenario:* Two spheres, plus a cube off to one side. Sphere A is near the cube; Sphere B is far.
  *   *Result:* Now the spheres have different relational properties ("2m from Cube" vs "10m from Cube").
  *   *Diagnosis:* This saves PII without cheating. It shows that PII holds in **asymmetric** worlds. It proves that *if* there is an external anchor, relational properties can discern objects.
  *   *Problem:* It doesn't solve the original case. It just shows that the original case is special because it lacks an anchor. It makes Camp 2 look weaker, because if PII only works when there's a third object to break the tie, it suggests PII isn't a fundamental law of identity, but a contingent feature of messy universes.

  **Variation 2: The One Sphere Universe**
  *   *Scenario:* One sphere, nothing else.
  *   *Result:* PII is vacuously true. PII says "If $x$ and $y$ are distinct..." If there is no $y$, the rule never triggers.
  *   *Diagnosis:* This shows PII is only about **plurality**. It doesn't tell you what makes a single thing a single thing. It confirms your suspicion that the principle is only interesting when there's a second thing to compare it to.

  **Variation 3: The Physics/Symmetry Argument**
  *   *Scenario:* Your physicist friend says symmetric descriptions are the "same situation."
  *   *Diagnosis:* This is the strongest challenge to the thought experiment itself. In modern physics (specifically quantum mechanics and gauge theory), if swapping two particles changes nothing observable, they are treated as **indistinguishable**. In some interpretations, they are not counted as "two" in the classical sense.
  *   *Implication:* This supports Camp 3. It suggests that "two identical spheres in a symmetric void" might be a description error. If the math of the universe is invariant under swapping the spheres, then "Sphere A" and "Sphere B" are labels we impose, not features of the world.
  *   *Verdict:* This moves the debate from metaphysics to philosophy of physics. If the physics says the labels don't matter, then the metaphysical question "which is which?" has no answer, not because we are ignorant, but because the fact doesn't exist.

  ### 5. What Counts as Progress?

  You asked what would count as progress. I will be honest: **You will not solve this with a sharper case.** You have already found the sharpest case (the symmetric universe). Adding more objects (the cube) just complicates the symmetry; it doesn't resolve the core tension.

  Progress here looks like **mapping the costs**, not finding a winner. You have reached the bedrock. Here is how you know you are done arguing:

  1.  **Acknowledge the Trilemma:** You must accept that you can only have two of the following three:
      *   (A) PII is true.
      *   (B) The two-sphere world is possible.
      *   (C) Properties must be qualitative (no "being identical to A").
      *   *If you keep A and B, you must drop C (allow impure properties).*
      *   *If you keep A and C, you must drop B (say the world is impossible).*
      *   *If you keep B and C, you must drop A (say PII is false).*

  2.  **Identify the "Thisness" Threshold:** Progress is realizing that Camp 1 (PII is false) and Camp 2 (Impure Properties) actually agree on the world, but disagree on the label. Camp 1 says "There is brute diversity." Camp 2 says "There is the property of diversity." They are describing the same metaphysical commitment with different grammar. If you can get your group to see that Camp 2 is just Camp 1 wearing a logic mask, the argument will dissolve.

  3.  **Shift to Explanation:** Ask Camp 2: "Does allowing impure properties explain *why* there are two spheres, or does it just label the fact that there are two?" If they admit it just labels the fact, then they have conceded that PII does not *ground* identity.

  ### Summary Diagnosis

  The disagreement is **verbal on the surface, metaphysical underneath.**

  *   **Surface:** Everyone is using "property" to mean different things. Camp 2 includes identity-as-property; Camp 1 excludes it.
  *   **Underneath:** The real fight is about **Haecceity (Thisness).**
      *   Camp 1 accepts Haecceity: Things have a primitive "thisness" that makes them distinct even without qualitative differences.
      *   Camp 2 denies Haecceity but smuggles it in via logic: They use "identity properties" to do the work of "thisness."
      *   Camp 3 denies Haecceity and the Scenario: They say without qualitative difference, there is no "thisness" and therefore no "two things."

  **Is the "Impure Property" move a cheat?**
  Yes, if the goal of PII is to explain what *constitutes* individuality. No, if the goal is merely to state a logical truth. Most people who defend PII want it to do explanatory work, so for them, it is a cheat.

  **What should you do?**
  Stop trying to prove one side right. Instead, force the group to choose their poison. Ask Camp 2: "If you allow 'being identical to A' as a property, does PII tell us anything we didn't already know?" Ask Camp 3: "If space is a container, isn't 'being in location X' a qualitative property that distinguishes the spheres?" (This forces them to commit to relationism). Ask Camp 1: "If there is no difference between the spheres, what fact makes them two?"

  The progress you are looking for is the realization that **PII is not a discovery about the world, but a constraint on how you choose to describe it.** You can choose to describe the world such that PII is true (by allowing impure properties or denying symmetric possibilities), or you can choose to describe it such that PII is false (by accepting brute diversity). Neither description changes the spheres. It only changes your metaphysical budget.
