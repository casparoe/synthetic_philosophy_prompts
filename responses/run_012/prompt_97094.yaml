answer: |-
  This is one of the most famous and notoriously difficult passages in the history of logic. You are right to feel that there is a tension there; in fact, the entire history of modal logic from the Stoics to Arthur Prior can be seen as a series of attempts to resolve the tension you've identified.

  You have grasped the core dilemma perfectly: Aristotle wants to save human deliberation (contingency) without breaking the basic laws of logic (Excluded Middle).

  Here is a walkthrough of the moves, distinguishing between what is explicitly in the text, where the ambiguity lies, and where later scholars have had to step in to tidy the argument.

  ### 1. The Fatalist Argument (The Setup)
  First, let's reconstruct the argument Aristotle is attacking, because he states it fairly clearly.
  1.  **Principle of Bivalence:** For any assertion $p$, either $p$ is true or $\neg p$ is false. (There is no middle ground).
  2.  **Application to Future:** This applies to future singular propositions (e.g., "There will be a sea battle tomorrow").
  3.  **Truth implies Fact:** If "There will be a sea battle" is true *now*, then the state of affairs it describes is fixed *now*.
  4.  **Fact implies Necessity:** If the state of affairs is fixed now, it cannot be otherwise.
  5.  **Conclusion:** Everything happens of necessity. Deliberation is pointless (why deliberate if the outcome is fixed?).

  Aristotle accepts the reductio: if the conclusion is absurd (deliberation is not pointless), one of the premises must go. He clearly wants to save contingency. The question is: does he drop Premise 1 (Bivalence) or does he attack the link between Premise 3 and 4 (Truth implies Necessity)?

  ### 2. Aristotle's Solution: Restricting Bivalence, Keeping Excluded Middle
  The "Standard Reading" (held by most ancient commentators like Ammonius and Boethius, and many moderns) is that Aristotle **denies Bivalence for future contingent singular propositions.**

  Here is the distinction he draws, which is crucial for your reading group:
  *   **Law of Excluded Middle (LEM):** The *disjunction* ($p \lor \neg p$) is necessarily true. "Either there will be a battle or there will not." Aristotle keeps this. The pair of contradictories must yield a truth value collectively.
  *   **Principle of Bivalence:** Each *disjunct* individually must be determinately true or false *now*. Aristotle rejects this for future contingents.

  **The Textual Evidence:**
  Aristotle writes: *"It is not necessary that of an affirmation and a denial one should be true and the other false."*
  He distinguishes between things that *are* (present/past) and things that *are not yet* (future). For things that are, one side of the contradiction is determinately true. For future contingents, neither is determinately true yet.

  **The Ambiguity:**
  The Greek here is dense. Does he mean the proposition has *no* truth value (a truth-value gap), or that it has a truth value that is *indeterminate*? The Standard Reading assumes a truth-value gap. This is where scholarly reconstruction begins. Aristotle doesn't have a formal semantic theory to explain *how* a proposition can be part of a true disjunction without being true or false itself. He relies on a metaphysical intuition: the reality hasn't settled yet, so the language describing it can't settle yet.

  ### 3. The "Necessary When It Is" Clause
  You asked what work the principle *"What is, necessarily is, when it is"* does. This is Aristotle's attempt to block the move from Truth to Fatalistic Necessity without breaking logic.

  He distinguishes two kinds of necessity:
  1.  **Simple Necessity (Unconditional):** $X$ must happen no matter what. (Aristotle denies this for contingents).
  2.  **Conditional Necessity (Necessity *ex hypothesi*):** *If* $X$ is happening, then it is necessary that it is happening.

  **How it works:**
  When the battle is actually occurring tomorrow, it is necessary *that it is occurring*. You cannot say "It is occurring and it is not occurring." But this necessity does not project backward to today.
  *   **Today:** It is not necessary that the battle occurs.
  *   **Tomorrow (during battle):** It is necessary that the battle occurs (because it is actual).

  **Why this matters:** It blocks the "fixity" from traveling through time. The truth of a proposition tracks the reality. If the reality is contingent today, the proposition is not "necessarily true" today, even if it becomes true tomorrow. This prevents the present from being crushed by the future.

  ### 4. The Past vs. Future Asymmetry
  This is the hardest part of your query. Why is the past fixed but the future open? And doesn't a past truth about the future fix the future?

  **The Ontological Asymmetry:**
  For Aristotle, this is not just about knowledge; it is about **potentiality (*dynamis*)**.
  *   **The Past:** The potential has been exhausted. It has been actualized. Once a potential is actualized, it cannot be "un-actualized." Therefore, the past is necessary *per accidens* (accidentally necessary).
  *   **The Future:** The potential is still live. Both sides of the contradiction (battle/no battle) are real possibilities in the world.

  **The "Yesterday" Objection:**
  You asked: *"If I can say truly now that it was the case yesterday that a battle would occur tomorrow, isn't that the same structure coming at me from behind?"*

  Aristotle's answer (reconstructed):
  If the future is truly contingent, then yesterday the statement "There will be a battle tomorrow" was **not determinately true.**
  It is tempting to think: "Well, the battle happened, so the statement yesterday must have been true."
  Aristotle would say: It *became* true as the event unfolded. But *at the time it was uttered*, it did not correspond to a fixed reality.
  *   **Past truths about past events:** Determinately true/false (because the reality is fixed).
  *   **Past truths about future events:** Indeterminate (because the reality they referred to was indeterminate).

  This is a heavy metaphysical lift. It implies that truth is not a static relation between a sentence and a "block universe," but a dynamic relation between language and a world that is still being made.

  ### 5. Text vs. Scholarly Reconstruction
  You asked for honesty about what is in the text and what is reconstruction.

  **In the Text:**
  *   The Sea Battle example.
  *   The claim that deliberation would be useless if fatalism were true.
  *   The claim that for future contingents, "it is not necessary that one or the other be true or false."
  *   The phrase "what is, necessarily is, when it is."

  **Scholarly Reconstruction (Heavy Lifting):**
  *   **The Bivalence/LEM Distinction:** Aristotle does not formally distinguish "Law of Excluded Middle" from "Principle of Bivalence." That is a modern logical distinction (largely 20th century) imposed on the text to make sense of his claim that the disjunction is necessary but the parts are not.
  *   **The Ockhamist Reading:** Some scholars (following William of Ockham) argue Aristotle *keeps* Bivalence but denies that the *truth* of the proposition implies the *necessity* of the event. On this reading, "There will be a battle" is true now, but only "softly" true (contingently true), not "hardly" true (necessarily true). This saves classical logic but requires a complex theory of truth that is arguably less explicit in the text than the Standard Reading.
  *   **Three-Valued Logic:** Some modern logicians (like Łukasiewicz) read Aristotle as inventing a third truth value ("Indeterminate"). This is definitely reconstruction; Aristotle doesn't posit a third value, he posits a lack of determination.

  ### 6. Modern Tense Logic and What Gets Lost
  If you bring in Arthur Prior's Tense Logic (specifically **Branching Time** semantics), the argument tidies up significantly.
  *   **Model:** Time is a tree, not a line. The past is a single trunk; the future is branching branches.
  *   **Solution:** A proposition about a future contingent is true only if it is true on *all* branches. Since the battle happens on some branches but not others, the proposition is neither true nor false now. The disjunction ("Battle or No Battle") is true on all branches, so LEM holds.

  **What gets lost in the tidying?**
  1.  **Metaphysical Potentiality:** Prior's logic is formal. Aristotle's argument is metaphysical. For Aristotle, the "openness" of the future isn't just a feature of our semantic model; it is a feature of *reality*. There are real powers (*dynameis*) in objects that are not yet exhausted. Modern logic tends to treat this as epistemic uncertainty or semantic indeterminacy; Aristotle treats it as ontological openness.
  2.  **The Nature of Truth:** In modern logic, truth is often timeless. For Aristotle, truth seems to be somewhat temporalized. A proposition can "become" true in a way that modern logic struggles to accommodate without resorting to complex indexicals.
  3.  **The Stakes:** For Prior, it's about consistency. For Aristotle, it's about *ethics*. If you solve the logic but lose the contingency, you lose the foundation for moral responsibility and the point of human action. The logical "tidying" often abstracts away the ethical urgency that drives Aristotle's argument.

  ### Summary for your Reading Group
  1.  **The Core Move:** Aristotle likely restricts **Bivalence** (every proposition is T or F) for future contingents, while keeping **Excluded Middle** (the disjunction $p \lor \neg p$ is T).
  2.  **The Necessity Clause:** "Necessary when it is" prevents the necessity of the *present actuality* from projecting backward to create a fatalistic chain. It limits necessity to the moment of occurrence.
  3.  **The Asymmetry:** The past is fixed because potentiality has been exhausted; the future is open because potentiality is live. Past statements *about* the future share the indeterminacy of the future they describe.
  4.  **The Caveat:** Be clear that the clean logical distinction between Bivalence and Excluded Middle is a modern tool used to interpret a text that is metaphysically dense and logically informal. The "Ockhamist" reading (keeping Bivalence, modifying Necessity) is a valid alternative if your group finds truth-value gaps too costly, but it requires more reconstruction of Aristotle's theory of truth.

  If your group wants to press the text hardest, ask this: *If the proposition "There will be a battle" is not true today, but the battle happens tomorrow, did the proposition change its truth value? And if so, does truth depend on the world, or does the world depend on truth?* Aristotle would say the former, but that admission creates the very temporal instability in logic that later philosophers tried to fix.
