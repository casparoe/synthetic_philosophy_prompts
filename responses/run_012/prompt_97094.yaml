      *   *Clarification on LEM:* Aristotle says the *contradiction* (the pair) must be true/false, but not *this one or that one*. This is the key distinction.
      *   *The "Yesterday" point:* If yesterday I said "Battle Tomorrow," and today the battle happens, was yesterday's statement true? Aristotle implies that *before* today, it wasn't determinately true. It becomes true *as* the event unfolds. This is tricky. I need to explain that for Aristotle, truth depends on the state of affairs. If the state of affairs is indeterminate, the proposition is indeterminate.

  6.  **Final Polish:** Check tone. Ensure it sounds like a guide for a reading group, not a lecture. Use clear headings. Ensure the distinction between "Necessity of the Consequent" and "Necessity of the Consequence" is hinted at (modal scope) without getting too bogged down in medieval jargon.

