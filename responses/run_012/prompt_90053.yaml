prompt: |-
  I'm building a session for a weekend workshop and I need you to design the activity, not the talk. Here's the setup and the stuff I care about.

  The crowd: 24 adults, mixed — a handful of policy people, a few grad students, two engineers, rest are curious civilians. Two hours, one room, four tables of six. I get 5 minutes up front to explain rules and then I don't want to lecture again until the debrief. Materials should be paper, index cards, dice if you must, no money, no phones.

  The topic is how much rule-following a group should demand of its members — the tight-vs-loose thing from cross-cultural psychology, but I do not want the session to be a dramatization of that literature, and I don't want you pointing me at papers to read, I'm not going to read them. Instead I've got my own little accounting scheme and I want the activity built on it. Three accounts that every rule draws on:

  1. coordination — what a rule buys you when everyone actually follows it (predictability, joint action, the thing you can't get by each person improvising).
  2. slack — what the rule costs you by foreclosing moves that would have been better than the rule, but that you can only discover by someone trying them.
  3. buy-in — the legitimacy account. I think enforcement spends it when it comes from outside the group and deposits it when it comes from people who chose the rule, and I think the same enforcement act does opposite things to this account depending on who's doing the enforcing. Peer sanction vs. appointed monitor, basically.

  And my actual hunch, which I want the game to put real pressure on: the ratchet is asymmetric. Rules get added under threat and come off very rarely, so the live question isn't "how tight should we be" but "who holds the dial for loosening, and what do they have to pay to turn it." If the activity makes that feel obviously true I'll be happy; if it makes it feel false I'll be even happier, honestly.

  Design constraints, and these matter more to me than elegance:

  - Tightness has to be a dial the group sets for itself, in play, and can change mid-game. It can't be fixed by me at the start.
  - Enforcement has to be endogenous — a player with their own payoff, not me stepping in as the referee.
  - At least one thing in the game must be discoverable only by somebody breaking a rule. If nobody ever deviates, the group should be leaving something on the table and should be able to feel that it is.
  - The environment shifts partway through without announcement — I want one kind of group to be winning before the shift and the other kind after, and I want them to have to notice.
  - Simple enough to teach in five minutes. If the rules take longer to explain than to play, it's dead.
  - No real money, no phones, and nobody should be able to sit out.

  The debrief should walk back through specific moments from the play and map them onto the three accounts, and I want it to end with every table having to write down one sentence answering how much rule-following a group should demand and who gets to loosen it — no "it depends" allowed, they have to commit. I'll read the sentences out loud and let them fight about it.

  Also be honest with me about two things: what predictably goes wrong the first time I run this and what I should do about it in the moment, and which feature of the real phenomenon the game simply can't reproduce, so I know what I have to say out loud myself rather than pretend the rules carried it. My guess is buy-in is the one that won't survive contact with a points system, but tell me if I'm wrong and it's something else.

  Give me the design as a proper write-up I can hand to a co-facilitator — timeline, roles, payoffs, what I say and when, the shift, the debrief. Then after that, a JSON object summarizing the whole thing so I can file it. Use exactly these fields:

  - session_title (string)
  - who_and_how_many (string)
  - total_minutes (number)
  - materials (array of strings)
  - roles (array of objects: role, payoff, special_power)
  - phases (array of objects: name, minutes, what_happens, which_account_is_at_stake — one of "coordination", "slack", "buy-in" — and facilitator_does)
  - payoff_scheme (array of objects: situation, player_points, note)
  - the_dials (array of objects: dial, tight_setting, loose_setting, what_it_does_to_play)
  - environment_shift (object: when, what_changes, why_unannounced)
  - debrief (array of objects: moment_in_play, idea_it_maps_to, question_to_ask)
  - what_will_go_wrong_first_time (array of objects: failure, fix)
  - cannot_reproduce (array of objects: feature_of_real_tightness, why_the_game_cant, what_the_facilitator_must_supply)
  - verdict_prompt (string — the exact sentence the tables fill in at the end)
reasoning: |-
  Here's a thinking process that leads to the suggested workshop design:

  1.  **Analyze the Request:**

      *   **Goal:** Design a 2-hour workshop activity (not a lecture) about rule-following tightness vs. looseness.
      *   **Audience:** 24 adults (mixed background), 4 tables of 6.
      *   **Constraints:**
          *   5-minute intro max.
          *   No lecture until debrief.
          *   Materials: Paper, index cards, dice (optional). No money, no phones.
          *   Core Theory: Three accounts (Coordination, Slack, Buy-in).
          *   Core Hunch: The ratchet is asymmetric (rules add easily, remove rarely). Who holds the dial for loosening?
          *   Mechanics: Tightness must be a dial set by the group *during* play. Enforcement must be endogenous (players enforce). Discovery requires rule-breaking. Environment shift (unannounced) mid-game. Simple rules. Everyone plays.
          *   Output: Proper write-up + JSON summary with specific fields.
          *   Honesty Check: What goes wrong? What can't the game reproduce?
          *   Debrief: Map specific moments to accounts. End with a committed one-sentence verdict per table.

  2.  **Deconstruct the Core Mechanics:**

      *   *The Dial:* How do players set tightness? A vote? A resource spend? Let's make it a "Charter" they write on a big sheet of paper. They can add rules or cross them out.
      *   *The Task:* Needs to be simple enough to teach in 5 mins but complex enough to benefit from coordination and suffer from rigidity. A pattern-matching or resource-gathering game works well. Let's go with a "Pattern Construction" game.
      *   *Coordination:* Everyone needs to match symbols to get points.
      *   *Slack:* Hidden bonus patterns exist that violate the main rules. Only found by breaking rules.
      *   *Buy-in:* Enforcement. If someone breaks a rule, who punishes them? If the group punishes, buy-in goes up. If a designated "Monitor" punishes, buy-in goes down (per the user's theory).
      *   *The Ratchet:* Adding a rule should be easy (majority vote). Removing a rule should be hard (unanimous vote or high cost).
      *   *The Shift:* Change the scoring criteria mid-game. What was good becomes bad.

  3.  **Drafting the Game: "The Charter"**

      *   *Setup:* 4 tables, 6 players each.
      *   *Materials:* Index cards (rules), Paper (score/charter), Pencils, Dice (for randomness/discovery).
      *   *Rounds:* 10 minutes per round. 4 Rounds total (plus setup/debrief).
      *   *Goal:* Maximize table score.
      *   *Mechanism:* Players draw cards with symbols. They must play cards to a central pool.
      *   *Rules:* The "Charter" defines valid plays (e.g., "Only Red cards," "Only Even numbers").
      *   *Enforcement:* Players can "Challenge" a play.
      *   *Discovery:* Some high-value cards are hidden or only valid if a specific "illegal" move is made.
      *   *The Shift:* Round 3 changes the value of symbols.

      *Refining the Mechanics for Constraints:*
      *   *Tightness Dial:* The Charter. To add a rule: Simple Majority. To remove a rule: Unanimous consent (creates the ratchet).
      *   *Endogenous Enforcement:* Players hold "Sanction Tokens." If they see a violation, they spend a token to penalize the player.
      *   *Discovery:* "Wildcard" cards are only revealed if someone plays a card that violates the current Charter. If caught, they lose points. If *not* caught (or if the rule is changed), the group gets a huge bonus. This creates the tension: Break the rule to find the bonus, but risk sanction.
      *   *Buy-in:* This is tricky to gamify without money. Let's use "Trust Markers." If a peer sanctions, the table loses a Trust Marker. If the group *agrees* to change a rule to allow the move, they gain Trust. Wait, the prompt says enforcement spends buy-in if external, deposits if internal. Let's simplify:
          *   Peer Challenge: Costs the table "Cohesion" (Buy-in).
          *   Self-Correction/Rule Change: Gains Cohesion.
      *   *Environment Shift:* Round 3. The "Market" changes. Previously valuable symbols are now worthless. Old rules hinder new scoring.

      *Critique of Draft:* Too complex for 5-minute intro. Needs to be simpler.
      *Simpler Version:* "The Tower."
      *   Build a tower of cards.
      *   Rules restrict *how* you build (e.g., "Red on Black").
      *   Points for height.
      *   Hidden rule: "Blue cards double height" (but Blue is banned by initial rule).
      *   Shift: Gravity changes (metaphorically).

      *Let's try a "Signal" game.*
      *   Players hold hands of cards.
      *   Table has a "Target Pattern" (e.g., 3 Reds, 2 Blues).
      *   Players play cards simultaneously.
      *   If the table matches the pattern, everyone gets points. (Coordination).
      *   Rules restrict what cards can be played (e.g., "No Face Cards").
      *   Slack: Some rounds, Face Cards are worth 10x. You only know this if someone tries it.
      *   Enforcement: If you play a Face Card, others can "Flag" you. If Flagged, you lose points, Table loses Cohesion. If *not* Flagged, Table gets Bonus.
      *   Dial: Table writes rules on a sheet. Add = 3 votes. Remove = 6 votes (Unanimous).
      *   Shift: Round 3, the Target Pattern changes completely.

      *Refining the "Buy-in" mechanic:* The prompt specifies: "Enforcement spends it when it comes from outside the group and deposits it when it comes from people who chose the rule."
      *   Implementation: One player per round is the "Monitor" (rotates).
      *   If Monitor sanctions: Buy-in down.
      *   If Peer sanctions: Buy-in neutral/up?
      *   Actually, let's stick to the prompt's hunch: "Peer sanction vs. appointed monitor."
      *   Let's make one person the "Enforcer" each round. They get points for catching violations. But if they catch too many, the Table's "Legitimacy Score" drops. If the group *chooses* to ignore a violation (amnesty), Legitimacy goes up.

      *Okay, finalizing the game logic:*
      *   **Game:** "Protocol."
      *   **Action:** Each player writes a number (1-10) on a card each round.
      *   **Goal:** The Sum of the table must match a Target Number (revealed each round).
      *   **Rules:** The Charter restricts what numbers you can write (e.g., "Only Even," "No 5s").
      *   **Coordination:** Matching the Target gives points.
      *   **Slack:** Hidden "Golden Numbers" exist. If someone writes a forbidden number that happens to be a Golden Number, the Table gets a massive bonus *if* the rule is waived. If they are sanctioned, the bonus is lost.
      *   **Enforcement:** Any player can spend a "Strike Token" to invalidate a play.
      *   **The Ratchet:** Adding a restriction costs 1 Strike Token. Removing a restriction costs 3 Strike Tokens. (Scarcity of tokens creates the ratchet).
      *   **Shift:** Round 3, the Target Numbers become impossible to hit with current restrictions.
      *   **Buy-in:** Tracked by "Morale." Sanctions reduce Morale. Successful coordination increases Morale.

      *Wait, 5-minute intro constraint is tight.* Writing numbers is fast. Voting on rules is slow.
      *   *Adjustment:* Rules are pre-printed on cards. Table flips them to "Active."
      *   *Adding Rule:* Flip a card face up. Cost: 1 Group Token.
      *   *Removing Rule:* Flip a card face down. Cost: 3 Group Tokens.
      *   *Tokens:* Table starts with 5. They earn 1 per round. This creates scarcity. They *can't* remove rules easily because it's expensive.
      *   *Enforcement:* If someone breaks an Active Rule, any player can slam a "Stop Card."
      *   *Discovery:* Some rounds, a "Wild Card" is in the deck. It only works if you break a rule.

      *Let's polish the "Buy-in" aspect.*
      *   The prompt says: "Enforcement spends [buy-in] when it comes from outside... deposits... when it comes from people who chose the rule."
      *   Game Mechanic: "Legitimacy Track."
      *   Start at 5.
      *   Peer Enforcement (Player slams Stop Card): Legitimacy -1.
      *   Rule Change (Group votes to remove rule): Legitimacy +1.
      *   If Legitimacy hits 0, the table "collapses" (no points for rest of game). This forces them to care about Buy-in.

      *The Shift:*
      *   Rounds 1-2: Target is easy with strict rules.
      *   Rounds 3-4: Target requires numbers currently banned by rules.
      *   Unannounced. They must realize they need to loosen up.
      *   But removing rules is expensive (3 tokens vs 1 token). This creates the Ratchet.

      *Discovery:*
      *   Round 2 or 3, a "Secret Objective" is slipped to one player (or all). "If anyone plays a 7, bonus points." But "No 7s" is a starting rule.
      *   Someone has to break the rule to reveal the value.

      *Wait, one more constraint:* "At least one thing in the game must be discoverable only by somebody breaking a rule."
      *   Okay, I'll put "Bonus Cards" in the envelope. They are only redeemable if a rule was broken *and not sanctioned*.

      *Let's structure the Write-Up.*
      *   Title: "The Ratchet Protocol."
      *   Timeline: 5 min intro, 60 min play (4 rounds + rule phases), 15 min debrief prep, 20 min debrief. Wait, total 2 hours.
      *   120 mins total.
      *   Intro: 5 mins.
      *   Play: 80 mins (4 rounds of 15 mins + transition).
      *   Debrief: 35 mins.
      *   Materials: Index cards, markers, tokens (paper clips?), score sheet.

      *Refining the "Dial":*
      *   The prompt wants the *group* to set the dial.
      *   Mechanism: "Rule Cards."
      *   Start with 3 Active Rules (Tight).
      *   To Add Rule: Majority vote. Cost: 1 Resource.
      *   To Remove Rule: Unanimous vote. Cost: 3 Resources.
      *   Resources are earned by coordination.
      *   This makes adding easy/cheap, removing hard/expensive. That's the ratchet.

      *Refining the "Shift":*
      *   Round 3 Facilitator hands a note: "Market Conditions Changed."
      *   New Scoring Key. Old rules now block high scores.

      *Refining "Buy-in":*
      *   Track: "Group Trust."
      *   Start: 10.
      *   Peer Sanction: -1 Trust.
      *   Successful Rule Removal: +2 Trust.
      *   If Trust <= 0, Table freezes (no points).

      *Refining "Discovery":*
      *   "Innovation Tokens." Hidden under a Rule Card.
      *   To get it, someone must play a number forbidden by that Rule.
      *   If they are sanctioned, Token is destroyed.
      *   If they are *not* sanctioned (group ignores it), Token is claimed (Bonus Points).
      *   This forces the group to choose: Enforce the rule (lose bonus) or Loosen the rule (gain bonus, gain trust).

      *Wait, check the 5-minute intro.*
      *   Can I explain Voting, Resources, Trust, Sanctions, and Scoring in 5 mins?
      *   Risky. Need to simplify.
      *   *Simplification:* No resources for voting.
      *   *Ratchet Mechanic:* Adding a rule requires 1 signature. Removing a rule requires 6 signatures (Unanimous).
      *   *Enforcement:* Any player can cross out a play.
      *   *Trust:* Start with 5 "Lives." Sanction = Lose a Life.
      *   *Discovery:* Envelope on table. "Open if someone plays a 7." (7 is banned).
      *   *Shift:* Hand out new score sheet Round 3.

      *Okay, this is tight enough.*
      *   Let's ensure the JSON fields match exactly.
      *   Let's ensure the "Honesty Check" is sharp.

      *Honesty Check - What goes wrong:*
      *   People won't sanction peers (friendliness).
      *   Fix: Make sanctioning profitable for the *sanctioner* personally? No, prompt says endogenous payoff.
      *   Better Fix: If you don't sanction a violation, *you* are liable. "Complicity Rule." If a violation stands, everyone loses points. This forces enforcement.
      *   Wait, that kills Slack.
      *   Alternative: Sanctioning gives the Sanctioner the points the violator would have gained. Zero-sum tension.
      *   Let's go with: Sanctioner gets the points. This incentivizes policing.

      *Honesty Check - What can't be reproduced:*
      *   Real-world Buy-in is emotional/cultural. Game Buy-in is a token track.
      *   Facilitator must explain that in real life, "Trust" doesn't reset next workshop.

      *Final Polish of the Plan:*
      *   **Game:** "The Protocol."
      *   **Action:** Write a number 1-10.
      *   **Goal:** Sum matches Target.
      *   **Rules:** Constraints on numbers (e.g., "No Odds").
      *   **Ratchet:** Add Rule = 1 Vote. Remove Rule = 6 Votes.
      *   **Enforcement:** Players can "Veto" a play. Vetoer gets the points.
      *   **Slack/Discovery:** Hidden Envelope. "If a 5 is played, open." (5 is banned).
      *   **Shift:** Round 3, Target changes to require banned numbers.
      *   **Buy-in:** "Morale" track. Veto reduces Morale. Consensual Rule Change increases Morale.

      *Wait, one constraint:* "Enforcement has to be endogenous — a player with their own payoff."
      *   If Vetoer gets points, that works.
      *   "At least one thing... discoverable only by somebody breaking a rule."
      *   The Envelope works.
      *   "Environment shifts partway through without announcement."
      *   Hand out new Target Sheet.
      *   "Tightness has to be a dial the group sets."
      *   The Rule Sheet is the dial.
      *   "Simple enough to teach in five minutes."
      *   Writing numbers is simple. Voting on rules might take time. I need to make sure the Rule Phase is distinct from the Play Phase.

      *Timeline:*
      *   0:00-0:05 Intro.
      *   0:05-0:25 Round 1 (Play + Rule Review).
      *   0:25-0:45 Round 2 (Play + Rule Review).
      *   0:45-0:50 Shift (Hand out new sheet, say nothing).
      *   0:50-1:10 Round 3.
      *   1:10-1:30 Round 4.
      *   1:30-1:45 Debrief Prep (Write sentence).
      *   1:45-2:00 Debrief.
      *   Wait, that leaves 15 mins buffer. I'll extend play rounds to allow for rule negotiation friction.

      *Let's write the response.*
      *   Structure: Facilitator Guide first. Then JSON.
      *   Tone: Direct, instructional, no fluff.
      *   Check JSON fields against prompt requirements.

      *Self-Correction on "Buy-in":*
      *   Prompt: "Enforcement spends it when it comes from outside the group and deposits it when it comes from people who chose the rule."
      *   My mechanic: Peer Veto = Spend Buy-in. Group Rule Change = Deposit Buy-in.
      *   This matches.
      *   I need to make sure the "Buy-in" track matters. If it hits zero, the game ends for that table. This makes them care about *how* they enforce, not just *if*.

      *Self-Correction on "Discovery":*
      *   If someone breaks a rule to find the discovery, they risk being Vetoed.
      *   If they are Vetoed, discovery is lost.
      *   If they are *not* Vetoed, the group gets the discovery *and* the rule is effectively broken (loosened).
      *   This creates the tension: Do we punish the deviant (maintain coordination, lose slack) or accept the deviant (gain slack, risk coordination)?

      *Final check on JSON fields:*
      *   session_title, who_and_how_many, total_minutes, materials, roles, phases, payoff_scheme, the_dials, environment_shift, debrief, what_will_go_wrong_first_time, cannot_reproduce, verdict_prompt.
      *   Ensure types match (array of objects, strings, numbers).

      *One detail:* "Two engineers, rest are curious civilians."
      *   Keep tech jargon out. Use "Protocol" not "Algorithm."
      *   "Policy people" will like the rule-making aspect.
      *   "Grad students" will overthink. Keep rules concrete.

      *Let's finalize the "Ratchet" mechanic.*
      *   To Add a Restriction: Majority vote (4 of 6).
      *   To Remove a Restriction: Unanimous vote (6 of 6).
      *   This is the simplest way to encode asymmetry without currency.
      *   It creates the "Who holds the dial" problem. One holdout can prevent loosening.

      *Okay, ready to draft.*
answer: |-
  # Workshop Design: The Ratchet Protocol

  ## Facilitator Guide

  **Session Title:** The Ratchet Protocol
  **Duration:** 120 Minutes
  **Participants:** 24 Adults (4 Tables of 6)
  **Core Tension:** Coordination vs. Slack vs. Buy-in (The Asymmetric Ratchet)

  ---

  ### 1. Materials (Per Table)
  *   1 Large Sheet of Paper ("The Charter")
  *   1 Deck of 20 Index Cards (10 marked "Rule", 10 blank)
  *   6 Pencils
  *   1 Sheet of "Score & Morale" (Pre-printed with a track from 10 down to 0)
  *   1 Envelope labeled "DO NOT OPEN UNTIL ROUND 3" (Contains the Shift Sheet)
  *   1 Envelope labeled "BLACK BOX" (Contains the Discovery Card)
  *   Red Markers (for sanctions)

  ### 2. Roles (All players are "Members")
  *   **Payoff:** Individual points contribute to a Table Score. Highest Table Score wins bragging rights.
  *   **Special Power:** Every Member has **Veto Power**. Any Member can cross out another Member's play with a red marker.
      *   *If Vetoed:* The player gets 0 points for that round. The Vetoer gets 5 points. Table Morale -1.
      *   *If Not Vetoed:* The play stands. Table Morale stays same.
  *   **Scribe:** Rotates every round. Writes the Charter rules.

  ### 3. The Setup (0:00 - 0:05)
  **Say this exactly:**
  "You are a team building a Protocol. Your goal is to maximize Table Score over 4 Rounds.
  1.  **The Play:** Each round, write a number 1-10 on a card. Reveal simultaneously.
  2.  **The Target:** I will give you a Target Sum. If your table's numbers add up to the Target, everyone gets 10 points.
  3.  **The Charter:** You can write Rules on the big paper restricting what numbers people can play (e.g., 'No Odds', 'Max 5').
  4.  **The Ratchet:** To **Add** a Rule: 4 votes (Majority). To **Remove** a Rule: 6 votes (Unanimous).
  5.  **Enforcement:** If someone breaks a Rule, any player can Veto their card with a red marker. Vetoer gets 5 points. Table Morale drops by 1.
  6.  **Morale:** Start at 10. If Morale hits 0, your table is locked. No more points.
  7.  **Discovery:** There is a Black Box envelope. Some moves trigger it.
  Go. Round 1 Target Sum is 30. You have 3 pre-written Rules on your table to start."

  *(Pre-written Rules on tables: "No Odd Numbers", "No Numbers above 6", "No Repeating Numbers". This starts them Tight.)*

  ### 4. Gameplay Phases (0:05 - 1:30)

  **Round 1 & 2 (Coordination Phase)**
  *   **Goal:** Hit the Target Sum (30, then 35).
  *   **Constraint:** The starting rules make this hard but possible if everyone coordinates.
  *   **Discovery Trigger:** The "Black Box" card inside the envelope says: *"If anyone plays a 7, open this envelope for 50 Bonus Points."* (Note: "No Numbers above 6" is a starting rule).
  *   **Facilitator Does:** Walk around. Note who vetoes. Note if anyone tries to play a 7. Do not intervene.
  *   **Account at Stake:** **Coordination** (hitting the sum) vs. **Slack** (the hidden 7 bonus).

  **The Shift (1:30 - 1:35)**
  *   **Action:** Hand the "DO NOT OPEN UNTIL ROUND 3" envelope to each table. Tell them to open it *now*.
  *   **Content:** New Target Sheet. Round 3 Target: 45. Round 4 Target: 50.
  *   **Why Unannounced:** The old rules (Max 6, No Odds) make hitting 45 mathematically impossible with 6 players. They *must* loosen the rules to survive.
  *   **Account at Stake:** **Buy-in** (Removing rules requires unanimity; one holdout kills the table).

  **Round 3 & 4 (Adaptation Phase)**
  *   **Goal:** Hit the new high Targets.
  *   **Constraint:** They must remove old rules.
  *   **Friction:** Removing a rule requires 6 votes. If one person wants to keep the rule (or just wants to Veto for points), the table stalls.
  *   **Facilitator Does:** Watch for tables that fracture. If Morale hits 0, announce "Table Locked" and let them watch others play.
  *   **Account at Stake:** **Buy-in** (Unanimous consent) vs. **Slack** (Need the high numbers).

  ### 5. Debrief (1:30 - 2:00)

  **Step 1: The Commitment (15 mins)**
  *   Tell tables: "You have 5 minutes. Write one sentence on the Charter Paper. It must answer: **How much rule-following should a group demand, and who holds the key to loosen it?**"
  *   Constraint: No "it depends." They must commit.
  *   Collect the papers.

  **Step 2: The Fight (20 mins)**
  *   Read the sentences aloud.
  *   **Map Moments to Accounts:**
      *   *Moment:* Someone played a 7 in Round 1 and got Vetoed.
      *   *Idea:* **Slack.** You enforced coordination but burned the discovery.
      *   *Question:* "Was the 5 points for the Vetoer worth the 50 points the table lost?"
      *   *Moment:* Round 3, Table couldn't remove the "Max 6" rule because one person refused.
      *   *Idea:* **The Ratchet.** Removal cost (Unanimity) was higher than Addition cost (Majority).
      *   *Question:* "Who should hold the veto power on loosening? The cautious one or the group?"
      *   *Moment:* Morale dropped after peer vetoes.
      *   *Idea:* **Buy-in.** Peer enforcement costs legitimacy.
      *   *Question:* "If the Facilitator had vetoed you, would Morale have dropped? Why does peer sanction hurt more?"

  ---

  ## Honesty Check

  ### What Predictably Goes Wrong First Time
  | Failure | Fix |
  | :--- | :--- |
  | **The "Nice" Problem:** Players refuse to Veto peers to avoid conflict, rendering enforcement toothless. | **Incentivize Conflict:** Remind them mid-game: "The Vetoer gets the points. If you don't police, you are leaving points on the table for someone else to take." |
  | **The "Math" Bottleneck:** Tables spend 10 minutes calculating sums instead of negotiating rules. | **Time Pressure:** Announce "2 Minutes Remaining" loudly. Force them to guess. The stress reveals their default tightness. |
  | **The "Unanimity" Stall:** One player refuses to remove a rule just to exercise power. | **Let it Burn:** If a table locks because of one holdout, do not save them. Use their "Table Locked" status as the primary debrief case study for the Ratchet. |

  ### What The Game Cannot Reproduce
  | Feature of Real Tightness | Why The Game Can't | What Facilitator Must Supply |
  | :--- | :--- | :--- |
  | **Long-term Buy-in Decay** | The game resets in 2 hours. Morale is a token track, not a relationship. | **Say this:** "In this room, Morale resets next workshop. In your org, every Veto is a permanent withdrawal from a bank account that doesn't reopen." |
  | **External Threat** | The "Shift" is a paper handout, not a market crash or regulator. | **Say this:** "The Shift felt arbitrary. In reality, the environment doesn't send an envelope. You have to sense the Target changing before you fail." |
  | **Identity & Culture** | Players are strangers. Rules don't clash with their personal values. | **Say this:** "You followed rules because of points. Your team follows rules because of who they think they are. That is harder to change than a Charter." |

  ---

  ## JSON Summary

  ```json
  {
    "session_title": "The Ratchet Protocol",
    "who_and_how_many": "24 Adults (Mixed backgrounds), 4 Tables of 6",
    "total_minutes": 120,
    "materials": [
      "Large Charter Paper (1 per table)",
      "Index Cards (Rules/Blank)",
      "Pencils & Red Markers",
      "Score & Morale Track Sheet",
      "Envelopes (Shift Sheet & Black Box Discovery)",
      "Pre-written Rule Cards (No Odds, Max 6, No Repeats)"
