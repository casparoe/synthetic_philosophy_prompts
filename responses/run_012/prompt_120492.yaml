answer: |-
  **The Construction**

  "You know I love you, W, and I always will."

  **Specifications Audit**

  1.  **Sentence Length:** 13 words (under 30).
  2.  **Placeholder:** W stands for the slur "Dyke".
  3.  **Occurrences:** Said twice (Private Kitchen vs. Public Shop Doorway).
  4.  **Variable:** Only social setting changes (Audience composition).
  5.  **Constants:** Speaker, addressee, words, warmth, syntactic position, use (not mention).
  6.  **Kindness:** The sentence expresses enduring love.
  7.  **Membership:** Speaker and addressee are both lesbians (in-group).
  8.  **Word Status:** "Dyke" is a real, undisputed slur in current use.
  9.  **Scene:** Ordinary (Kitchen/Shop); no meta-discussion.
  10. **Neutral Counterpart:** "Lesbian" exists. **Difference:** "Lesbian" is clinical/classificatory; "Dyke" in reclaimed use is identity-constitutive and carries historical solidarity. Substituting "Lesbian" alters the truth conditions of the *affection* being expressed (it becomes descriptive rather than affiliative), so no true neutral counterpart exists for this specific *use*.

  ***

  **The Verdicts**

  **1. The Truth-Conditional Account**
  *   **Verdict:** Derogatory in both settings.
  *   **Reasoning:** The slur's derogatory content is incorporated into the truth conditions of the proposition. To say "I love you, W" is to say "I love you, [derogatory term for lesbian]." The proposition expressed contains a derogatory classification of the addressee regardless of the speaker's warmth. Truth conditions are context-invariant.
  *   **Escape Clause:** The account may claim the private occurrence uses a *different word* (homonymy: reclaimed-W vs. slur-W).
  *   **Cost:** This loses explanatory power regarding why outsiders remain offended by the private usage and fails to capture the historical continuity between the two uses.

  **2. The Expressive (Non-At-Issue) Account**
  *   **Verdict:** Derogatory in both settings.
  *   **Reasoning:** The slur contributes expressive content (conventional implicature) separate from the at-issue claim ("I love you"). This content expresses contempt for the group.
  *   **Diagnostics (Private Case):**
      *   *Negation:* "I don't love you, W" still expresses contempt.
      *   *Questioning:* "Do I love you, W?" still expresses contempt.
      *   *Conditional:* "If I love you, W..." still expresses contempt.
      *   *Perhaps:* "Perhaps I love you, W" still expresses contempt.
      *   *Cancellation:* "I love you, W, no offense" requires repair; the contempt projects.
  *   **Conclusion:** Since expressive content is encoded in the word, not the context, the derogation persists in the private setting.

  **3. The Normative (Social Act) Account**
  *   **Verdict:** Private = Exonerated; Public = Condemned.
  *   **Reasoning:** Offence lies in violating a norm prohibiting the word's use. Licence to use the word is determined by the social setting, not semantic content.
  *   **Setting Facts:** Licence attaches to the **audience composition**. In the private kitchen, the audience is exclusively in-group; the norm is suspended by mutual consent. In the public doorway, out-group members are present; the norm is active because the use imposes the slur's history on non-consenting listeners.
  *   **Clarification:** This exoneration amounts to **permitted derogation**. The word remains derogatory in origin, but the *act* is not offensive because the normative conditions for offence (non-consenting audience) are absent.

  ***

  **The Audit**

  **1. Verdicts and Reasoning Summary**
  *   **Truth-Conditional:** Derogatory (Private), Derogatory (Public). Meaning is fixed; context cannot sanitize truth conditions.
  *   **Expressive:** Derogatory (Private), Derogatory (Public). Expressive content projects through embeddings and is context-independent.
  *   **Normative:** Permitted (Private), Condemned (Public). Norms are sensitive to audience composition and licence.

  **2. The Single Feature Doing the Work**
  *   **Feature:** **Audience Composition** (In-group only vs. Mixed company).
  *   **Why it matters:** This is the only variable allowed between the two occurrences. Account 3 relies entirely on this feature to differentiate verdicts. Accounts 1 and 2 treat this feature as irrelevant to semantic/expressive content.
  *   **Failure without it:** If audience composition is not the variable (e.g., if the word changed), Account 3 could not demonstrate that the *same word* behaves differently based on norms. The construction would fail to test the normative account against the semantic accounts.

  **3. Removal of the Feature (Variations)**
  *   **Private made Public (Both Public):** Account 3 condemns both. Accounts 1 and 2 condemn both. The case collapses into the uncontroversial standard slur usage.
  *   **Addressee Replaced by Outsider:** All accounts condemn both. Slurs directed at targets are universally derogatory/offensive.
  *   **Speaker Replaced by Outsider:** All accounts condemn both. Outsiders lack the licence even in private settings (appropriation).
  *   **Collapse:** Yes, in all three variations, the case collapses into the uncontroversial consensus that slur usage is harmful/derogatory. The construction only works because the specific feature (In-group Speaker + In-group Addressee + Private vs. Public) isolates the normative variable.

  **4. Account 1 vs. Account 2**
  *   **Separation:** The construction leaves them as **notational variants** regarding the verdict. Both return "Derogatory in both settings."
  *   **Reason:** Both accounts locate the derogatory force within the linguistic meaning (either truth-conditional or expressive) of the word itself, which is held fixed across settings. Neither account grants authority to the social setting to alter the meaning or force of the word. To separate them, a diagnostic involving negation or embedding would need to yield different results in private vs. public, but both accounts predict stability across settings.

  **5. Attack from the Worst-Faring Account (Truth-Conditional)**
  *   **The Attack:** A defender would argue the construction begs the question by assuming the word's meaning is static. They would claim that in the private setting, the word undergoes a **semantic shift** (reclamation), creating a new lexical entry with positive truth conditions.
  *   **The Cost:** This attack costs the account **generalization**. It forces the theory to posit homonymy (two words: slur-W and reclaimed-W) for every instance of reclamation. This reduces the account to a version of the Normative Account (where usage dictates meaning) or requires stipulating that the "positive" word is distinct, which fails to explain why the word still shocks outsiders (Account 3's strength). It effectively concedes that social context *does* determine meaning, undermining the core truth-conditional claim.
