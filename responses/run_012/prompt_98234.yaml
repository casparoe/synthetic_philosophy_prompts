      *   *Emphasis:* Highlight that "flat" is often a proxy for "I want the likelihood to dominate," which is a specific goal, not a state of nature.

  5.  **Final Review against User Prompt:**

      *   "What does the everyday habit... presuppose?" -> Addressed (Symmetry, Privileged Parameterization).
      *   "Which rival pictures does it rule out?" -> Addressed (Subjective, Fiducial, Reference).
