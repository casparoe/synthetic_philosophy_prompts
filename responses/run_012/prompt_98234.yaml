prompt: |-
  Something that's been bugging me while writing up my methods section, and I keep putting off thinking it through properly. In practice we just slap a flat prior on a parameter and call it "non-informative," on the grounds that we've got no reason to favour one value over another -- and somehow that's supposed to make the analysis objective. But Bertrand's chord thing is the classic embarrassment (same set-up, three different "uniform" answers depending on which variable you make uniform), and even Jeffreys priors only stay flat under certain parameterizations, so the choice of variable is quietly doing all the work. What does the everyday habit of grabbing the "obviously" symmetric prior actually presuppose about ignorance and about what probability is? Which rival pictures does it rule out -- straight subjective Bayesianism, fiducial-style reasoning, reference priors -- and is the habit even internally consistent once you notice that reparameterization flips the answer? It feels definately fine in simple finite cases, so I'm really asking what theory it commits you to, and what would have to change in day-to-day Bayesian practice if we gave up the principle of indifference and just owned that the prior is a modelling choice. Try to separate what the practice strictly needs from what it merely tends to travel with.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Issue:** The user is struggling with the justification of "flat priors" as "non-informative" in Bayesian analysis. They recognize the Bertrand's Paradox problem (parameterization dependence) and the limitations of Jeffreys priors.
      *   **Key Questions:**
          1.  What does the habit of using symmetric/flat priors presuppose about ignorance and the nature of probability?
          2.  Which rival pictures does it rule out (subjective Bayesianism, fiducial, reference priors)?
          3.  Is the habit internally consistent given reparameterization invariance issues?
          4.  What theory does this practice commit you to?
          5.  What would change in day-to-day practice if we abandoned the Principle of Indifference and treated priors explicitly as modeling choices?
          6.  *Constraint:* Separate what the practice *strictly needs* from what it *merely tends to travel with*.

  2.  **Initial Assessment & Tone:**

      *   The user is sophisticated (knows Bertrand's Paradox, Jeffreys priors, fiducial reasoning).
      *   They are feeling a methodological itch ("bugging me," "putting off thinking it through").
      *   The tone should be rigorous, philosophical but grounded in statistical practice, avoiding condescension while acknowledging the depth of the problem.
      *   Avoid giving a simple "just use Jeffreys" answer; they already know that's not a silver bullet.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the validity of the concern. It's not just a bug; it's a feature of the foundational tension in Bayesianism. Validate the Bertrand's Paradox point.

      *   **1. What the "Flat Prior" Habit Presupposes:**
          *   *Ontology of Ignorance:* It assumes ignorance is a *state of symmetry* rather than a *state of maximum entropy* or *lack of commitment*. It treats "I don't know" as "All values are equally likely."
          *   *Nature of Probability:* It leans towards Objective Bayesianism (probability as logic/degree of belief constrained by rationality) rather than Subjective Bayesianism (probability as personal degree of belief).
          *   *Parameter Space:* It assumes the *scale* of the parameter provided by the modeler is the "natural" scale. This is the crux of the Bertrand/parameterization issue.

      *   **2. Internal Consistency & Reparameterization:**
          *   Strictly speaking, it is *inconsistent*. $p(\theta) \propto 1 \implies p(\log \theta) \propto 1/\theta$.
          *   To save consistency, you need a transformation rule (like Jeffreys).
          *   If you stick to flat priors without invariance, you are implicitly claiming the parameterization is privileged.

      *   **3. Rival Pictures Ruled Out:**
          *   *Subjective Bayesianism (Savage/de Finetti):* They don't care about "non-informative." Priors are personal. Flat priors are just a specific personal choice, not an objective default.
          *   *Fiducial Inference:* Attempts to derive probability from likelihood alone. Flat priors try to mimic this but fail the strict logic.
          *   *Reference Priors (Bernardo):* These aim for maximal missing information (entropy-based), not necessarily flatness.
          *   *Frequentism:* Obviously rules out priors entirely, but flat priors often try to approximate frequentist properties (matching priors).

      *   **4. What Theory Does It Commit You To?**
          *   *Principle of Indifference (PoI):* The classic commitment.
          *   *Objective Bayesianism (Jaynes):* Probability as extended logic. You *must* use the prior that reflects the symmetries of the problem.
          *   *Implicit Frequentism:* Often, people use flat priors because they want the posterior mode/mean to match the MLE. This is "Bayesian by calculation, Frequentist by aspiration."

      *   **5. Separating "Strict Needs" from "Traveling Companions":**
          *   *Strict Need:* A proper prior (integrates to 1) or a rule for handling impropriety. A likelihood function.
          *   *Traveling Companion:* The claim of "objectivity." The claim of "ignorance." The specific parameterization.
          *   *Crucial Distinction:* You need a prior to get a posterior. You *don't* need that prior to represent "truth" or "ignorance."

      *   **6. What Changes if We "Own the Choice"?**
          *   *Sensitivity Analysis:* Becomes mandatory, not optional.
          *   *Reporting:* Shift from "we used a non-informative prior" to "we used a weakly informative prior centered at X with scale Y."
          *   *Regularization:* Acknowledge that priors regularize. Flat priors can be terrible for regularization (e.g., separation in logistic regression).
          *   *Philosophy:* Shift from "discovering the true prior" to "selecting a useful regularization device."

  4.  **Refining and Polishing:**

      *   *Check:* Did I address Bertrand's Paradox specifically? Yes, under parameterization.
      *   *Check:* Did I address Jeffreys? Yes, as a fix that still has limits.
