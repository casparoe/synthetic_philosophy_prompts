answer: |-
  Dear Colleague

  It is a pleasure to correspond with someone who approaches the text with the same rigor you applied to isotope fractionation for thirty-five years. Your frustration is not only understandable; it is the sign of a mind that refuses to accept hand-waving where precision is required. You have put your finger on the exact pressure point where most interpretations of Kant either collapse into utilitarianism or float away into mysticism. You want a definite position, so here it is. The universalizability test is neither a piece of narrow formal logic nor a disguised consequentialist prediction. It is a test of conceptual coherence regarding the conditions of agency. The contradiction lives in the relationship between the agent's intended action and the conceptual preconditions that make that action possible.

  When you analyze the maxim of false promising, your intuition that the proposition everyone makes false promises when convenient is not logically contradictory in a vacuum is correct. There is no formal logical contradiction in the state of affairs itself, much like there is no logical contradiction in the statement all geochemists lie about their data. The world could physically exist in that state. However, Kant is not testing the logical consistency of a state of affairs; he is testing the consistency of the will acting within that state of affairs. The contradiction arises because the specific action you intend to perform relies on a convention that your universalized maxim destroys. To make a promise is not merely to emit sounds or write words; it is to invoke a social and rational institution that presupposes a norm of truthfulness. The very concept of a promise contains within it the expectation of fulfillment. If you universalize the maxim of false promising, you are willing a world where the norm of truthfulness is abandoned. In such a world, the institution of promising ceases to exist conceptually, not just empirically.

  This is where the distinction from consequentialism becomes critical, and it is where I must be most firm. A consequentialist argues that you should not make false promises because if everyone did it, trust would collapse, people would be harmed, and social utility would decrease. The wrongness lies in the bad outcome. Kant's argument is structurally different. He is not claiming the world would be worse; he is claiming that in the universalized world, you literally could not do what you intend to do. If everyone makes false promises when convenient, the utterance I promise ceases to function as a promise. It becomes mere noise, indistinguishable from a statement of intention that carries no weight. Therefore, your maxim becomes I will make a promise in a world where promising is impossible. This is the contradiction. It is a practical contradiction, not a propositional one. You are willing an end that requires a means, while simultaneously willing a universal law that abolishes the availability of that means.

  You mentioned that Kant might be smuggling in an empirical prediction about trust collapsing. It looks like empirical prediction because Kant uses examples drawn from human social life, but the underlying mechanism is a priori. It does not matter if, as a matter of fact, humans are resilient enough to maintain some form of trust despite widespread lying. What matters is the rational structure of the act. The act of promising is defined by its uptake by another rational agent who recognizes the obligation. If the universal law dictates that no such recognition is rational, the act cannot be completed. You cannot coherently will to perform an action that, by your own universal standard, is rendered unintelligible. This is why the test is not consequentialist. It does not weigh the costs of the collapse of trust; it identifies that the collapse of trust entails the collapse of the very possibility of the action you are proposing to yourself.

  Think of it in terms of your own field. Suppose you proposed a maxim that whenever a measurement was inconvenient, you would calibrate your instrument to read zero. If you universalized this, the concept of calibration would vanish. You would still be turning dials, but you would no longer be calibrating. You cannot will to calibrate an instrument in a world where calibration is conceptually nullified by your own universal rule. The contradiction is not that the lab would produce bad data, though it would; the contradiction is that you cannot coherently describe your action as calibration under that universal law. Similarly, you cannot coherently describe your action as promising under the universal law of false promising.

  So, to answer your question directly: the contradiction lives in the will's relation to the conceptual preconditions of its own action. It is not formal logic in the sense of symbolic notation, because it deals with the content of human agency, but it is not empirical consequentialism, because it does not rely on the value of the outcomes. It is a test of whether the maxim can be thought as a universal law without destroying the concept of the action it prescribes. When you run the test and feel that the contradiction is elusive, it is usually because you are looking for a logical contradiction in the description of the world rather than a practical contradiction in the description of the act. Kant is asking whether you can will the law without willing the destruction of the very possibility of your own agency within that law. In the case of false promising, you cannot, because the agency of promising depends on a norm that the universalized maxim annihilates.

  I hope this provides the traction you need. You are right to be suspicious of interpretations that turn Kant into a rule-utilitarian in disguise; that reading saves the plausibility of the examples at the cost of the entire critical project. The contradiction is real, but it is a contradiction in conception, rooted in the necessary conditions of rational action. Keep pushing on the text with that same geochemical precision. It is the only way to get a clean sample.

  Warmly

  Your Correspondent
