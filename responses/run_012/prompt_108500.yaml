      *(Self-Correction during drafting)*: I need to make sure I don't slip into "empirical prediction" language too much. Kant does talk about people not believing promises. I need to frame that as a conceptual necessity, not a sociological prediction. If everyone lies, the *concept* of belief in a promise is evacuated. It's not that they *won't* believe, it's that they *cannot* rationally believe, thus the act isn't a promise.

      *(Refining the "Contradiction" location)*: The contradiction is between the particular will (I want to promise) and the universal will (everyone lies). The particular will depends on a condition (trust) that the universal will negates.

