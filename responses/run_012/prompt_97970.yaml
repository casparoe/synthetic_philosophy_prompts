      *   *Global Workspace:* A high-priority, low-latency shared bus or blackboard.
      *   *Specialized Modules:* Microservices or workers with specific domain logic (vision, motor control, memory).
      *   *Competition/Ignition:* Backpressure and rate limiting. Only messages meeting a priority threshold (salience) get onto the main bus. "Ignition" is the cascade of events triggered by a broadcast.
      *   *Access Consciousness:* Data written to the global bus. It's logged, traceable, and subscribable by downstream services (reporting, planning, motor output). If it's not on the bus, it's local state only.
      *   *Phenomenal Consciousness:* This is the tricky part. In DS, state *is* bits. There is no "feeling."
