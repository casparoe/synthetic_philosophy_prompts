answer: |-
  I am the straw that alters not the state,
  The last one laid upon the growing heap,
  Nor bends the structure under such a weight.
  If I am few, then so is neighbor's sleep,
  And so the one who stands on either bound,
  For no one straw alone can break the sleep.
  You seek a cut within the shifting ground,
  To say where truth begins its specific day,
  But shifting bounds cannot be fully found.
  Some claim a hidden fact hides in the day,
  Unknown to us, yet objectively true,
  Though ignorance blocks the only way.
  Some say many paths are equally due,
  None privileged until we draw the line,
  Making the vague spectrum suddenly true.
  So do I cross this final defined line?
  Or am I still the heap that will not stop?
  The edge refuses to be fully mine.
  This is the exact place where you must stop.
