answer: |-
  Hi there, it sounds like you have a very sharp instinct for this material and you are right to be suspicious of that handout. You are not being dim at all; in fact, your hesitation about the center of gravity analogy and the claim about responsibility hits on the two most common misunderstandings of Dennett's work. If you write your essay relying on the handout's interpretation, you will likely end up arguing against a straw man rather than Dennett's actual position, so let's walk through the claims carefully to separate what Dennett actually says from what the summary attributes to him.

  Your intuition about the center of gravity is exactly correct and gets to the heart of the matter. When Dennett uses that analogy, he is not saying the self is an illusion in the sense of a mistake or a falsehood, like seeing a mirage. A center of gravity is an abstract object, which means it is real and objective and there are facts about it, but it is not a concrete thing you can point to or put in a box. As your flatmate noted, it can even be outside the physical object, which shows it is a property of the distribution of mass rather than a piece of matter itself. Dennett wants to say the self is like that: it is not a little homunculus inside the brain, but it is also not nothing. It is a real abstraction that emerges from the physical processes of the brain and body. The handout makes it sound like Dennett is an eliminativist who thinks the self is strictly nonexistent, like a unicorn, but Dennett's view is more that the self exists as a pattern, not as a substance. This is where your friend in the year above is spot on about Real Patterns. Dennett has a specific technical doctrine called Real Patterns which argues that if something is predictively useful and grounded in physical reality, it is real enough to count as existing, even if it is not a fundamental particle. The self, for Dennett, is a real pattern of behavior and narrative, so saying we should drop it like phlogiston is a direct contradiction of his view. Phlogiston was a posit that turned out to refer to nothing real and had no predictive power, whereas the self, on Dennett's view, is indispensable for predicting human behavior and organizing social life.

  This leads directly to the biggest error in the handout, which is the conclusion about moral responsibility. You are absolutely right that Dennett is not an eliminativist about responsibility; he is one of the most prominent compatibilists working today. He has written entire books like Elbow Room and Freedom Evolves specifically to argue that determinism and the absence of a Cartesian soul do not undermine moral responsibility. For Dennett, responsibility is not grounded in some magical, uncaused free will or a permanent metaphysical self. Instead, it is grounded in our capacities as social agents. We hold people responsible because they are capable of understanding reasons, responding to social norms, and modifying their behavior based on feedback. The self as a center of narrative gravity is actually crucial for this because it is the locus where we attribute these capacities. If you dissolve the self entirely, you might lose the agent, but Dennett's point is that the narrative self is robust enough to sustain the practices of blaming and punishing. The handout suggests that a mature neuroscience would let us drop the self, but Dennett argues that neuroscience explains how the self is constructed, not that it abolishes the need for the concept. We cannot drop the self any more than we can drop the concept of money or software just because we understand the physics of ink or silicon; these are higher-level realities that depend on the lower levels but are not replaced by them.

  Regarding the comparisons to Parfit and Buddhism, the handout is engaging in a bit of loose shorthand that is acceptable in a summary but dangerous for an essay. It is true that Dennett agrees with Parfit that there is no further fact of personal identity beyond physical and psychological continuity, so the brain division case is indeed treated as having no deep metaphysical answer. However, Parfit often suggests this realization should change our attitudes toward survival and morality in a somewhat dissolutionary way, whereas Dennett is more pragmatic. He is less interested in the metaphysical emptiness of the question and more interested in why the narrative construction matters for our lives. The Buddhism comparison is similar; there is a resonance with the no-self doctrine, but Dennett's naturalism is strictly secular and functionalist, whereas the Buddhist doctrine is soteriological and aimed at ending suffering. Treating them as the same view glosses over significant differences in why the no-self view is adopted and what work it is supposed to do. For your essay, you can acknowledge the similarity but should note that Dennett's motivation is explaining cognitive science and ethics, not spiritual liberation.

  So, to answer your main question about whether the essay conclusion survives once the misreadings are cleared up: it does not. The professor's handout pushes the conclusion that if Dennett is right, our practices of blaming and punishing rest on an illusion and could be discarded. But if you correct the definition of fiction to mean abstract object rather than falsehood, and you incorporate the Real Patterns doctrine, Dennett's view actually supports moral responsibility rather than undermining it. It grounds responsibility in the real, functional capacities of the human organism as a socially embedded agent, rather than in a metaphysical ghost in the machine. Your essay would be strongest if you argue that the handout conflates Dennett's rejection of the Cartesian self with a rejection of the self simpliciter. You can grant that the self is not a concrete thing in the brain, but insist that this does not make it an illusion that prevents responsibility. Instead, the narrative self is the very thing that makes responsibility possible because it is the interface where reasons and causes meet.

  You should feel confident pushing back on the handout's interpretation because your suspicions are backed up by Dennett's broader corpus. A careful reader would accept that the self is not a concrete entity and that identity questions can be indeterminate, but they would wince at the phlogiston comparison and the claim that responsibility is unsupported. Those are simply wrong based on Dennett's explicit writings on free will and ethics. For your essay, you can use the handout as a starting point to show what a superficial reading looks like, and then use the center of gravity analogy and the Real Patterns argument to show what a careful reading looks like. This will allow you to demonstrate that Dennett's picture can ground moral responsibility, just not in the way the handout assumes. It grounds it in pragmatism and social function rather than metaphysics. I hope this helps you navigate the bus ride and the essay, and feel free to reach out if you need to dig deeper into the compatibilist side of things.
