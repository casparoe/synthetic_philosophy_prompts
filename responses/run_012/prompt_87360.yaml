      *   *Refinement:* Ensure I don't just say "Grue is induction." I need to explain *why* the probabilistic asymmetry in Ravens doesn't exist in Grue. In Ravens, $P(Non-black) \gg P(Raven)$. In Grue, $P(Green)$ vs $P(Grue)$ is symmetric relative to the evidence *until time t*.

