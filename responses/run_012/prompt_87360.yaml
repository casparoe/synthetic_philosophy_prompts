          *   Core Issue: The logic of confirmation relations.
      *   *Grue Paradox:* Arises from the definition of predicates and projectibility.
          *   Setup: "Grue" = observed before $t$ & green OR observed after $t$ & blue.
          *   Result: Evidence supports "All emeralds are green" and "All emeralds are grue" equally well *up to time $t$*.
          *   Core Issue: Which predicates are *projectible*? Why do we project "green" and not "grue"?
          *   Relation to Ravens: Some say Grue shows we need "natural kinds." But Ravens is about logical equivalence, not just predicate choice.
      *   *The Conflation:* Students think both are just "don't use weird predicates."
      *   *The Distinction:*
          *   Ravens works even with "natural" predicates (Raven, Black). The weirdness comes from the *contrapositive* (Non-black, Non-raven).
          *   Grue works even with standard confirmation logic; the weirdness comes from the *predicate definition* itself (time-dependence).
          *   Probabilistic fix for Ravens (background knowledge about population sizes) does nothing for Grue. The probability of "Grue" given evidence is just as high as "Green" unless we build in a bias against "Grue" (which begs the question).
