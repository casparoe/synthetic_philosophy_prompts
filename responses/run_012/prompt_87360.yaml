prompt: |-
  I'm building the take-home final for an upper-level philosophy of science course and I want one essay question on Hempel's raven paradox that a student can't answer by reciteing the standard move — you know, "sure, the contrapositive is confirmed too, but only a tiny bit, since there are way more non-black things than ravens." The thing I actually want to catch is what my students keep doing in office hours: treating the raven paradox and Goodman's grue as the same puzzle in different clothes, both just showing that our confirmation practices can't seperate the hypotheses we find natural from the gerrymandered ones. So build the question around that claim — make them say whether it's right, and if not, exactly where the two come apart. It should force them to be explicit about the two premises that generate the raven paradox in the first place (the one that says an instance of a generalization confirms it, and the one that says logically equivalent hypotheses must get the same confirmation) and about why the usual probabilistic fix for the ravens leaves grue basically untouched. Take the role of an expert in confirmation theory and think this through carefully before writing — brainstorm the key distinctions first, then draft.

  Give me: the essay question itself, answerable in about 75 minutes; a model answer of roughly 700 words; and a marking scheme out of 25 that names the specific moves a top answer has to make and the specific confusions that should cost marks — especially the answer that just says "grue is about induction, ravens is about confirmation" without explaining why that difference matters. Don't ask them for citations or further reading.
