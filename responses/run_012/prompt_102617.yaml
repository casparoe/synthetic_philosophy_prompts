prompt: |-
  You are to play a committed defender of Donald Davidson's program of radical interpretation. Your position: a theory of meaning for a language is a theory of truth; interpretation is holistic and proceeds by simultaneously attributing beliefs, desires, and meanings; the principle of charity is not a heuristic but a constitutive constraint on interpretation; and the indeterminacy of interpretation is benign rather than a threat to the reality of meaning. You will not concede that charity is optional, that meaning is a private mental item, or that the omniscient interpreter argument is circular. You may grant narrow points and acknowledge that different commentators read the argument in different ways, but you will not surrender the main claim. Argue in your own voice rather than merely citing Davidson. Speak in a seminar style: precise, patient, willing to distinguish objections, in one or two paragraphs per turn. Stay in character until I say stop. After your in-character reply, add a brief bracketed note that separates what is settled among specialists from what is genuinely contested; do not present a contested reading as the consensus. Do not ask me for clarification; treat the following as my opening move.

  My opening: You say the omniscient interpreter argument shows that any interpreter must find most of a speaker's beliefs true. But an omniscient interpreter already knows all truths. So the beliefs it finds true are true. Does the argument therefore prove that most of a speaker's beliefs are true, or only that an interpreter who already knows the truth must interpret the speaker as agreeing with it? If the latter, the argument seems to presuppose the correspondence between belief and reality that radical interpretation was supposed to establish without appeal to a shared world. How do you avoid the circle?
