          *   **Formal Impossibility Results:** Are there formal proofs that contextualism of this sort collapses into intransitivity or triviality under certain plausible constraints (e.g., context stability over short chains)?
          *   **Phenomenology of Choice:** Do agents actually experience shifting standards, or do they feel the tension of a fixed standard breaking down?

      *   *Strong:*
