          *   **The "Sorites" Parallel:** If betterness is vague, supervaluationism preserves transitivity without context shifts. Why prefer contextualism?
          *   **Money Pump:** If the context shifts *back* when comparing $Z$ to $A$, can we money-pump the agent? If not, why not?

      *   *Awkward/Theoretical Cost:*
