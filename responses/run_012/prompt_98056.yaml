  4.  **Developing Specific Arguments:**

      *   *Context-Invariant Cases:* Can we construct a spectrum where the context is explicitly locked? E.g., "Holding all natural properties fixed, and using the standard 'maximizes utility', is A better than B?" If the user admits the judgment flips here, transitivity is gone. If they say "context still shifts," they need to explain *what* shifts if the standard is fixed.
      *   *Cycles:* A genuine cycle requires $A \succ B \succ C \succ A$ in the *same* context. The user denies this is possible. The counter-argument is that the *phenomenology* of the spectrum argument *is* a single context. The burden is on the user to show the shift.
      *   *Rival Explanations:*
