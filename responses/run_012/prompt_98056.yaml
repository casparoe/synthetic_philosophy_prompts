          *   *Vagueness/Supervaluation (Broome):* "Better" is vague. Transitivity holds on every precisification. But $A$ is not better than $Z$ because it's indeterminate. This keeps transitivity *without* context shifts. Why is Contextualism better?
          *   *Incommensurability:* At some point, items are not comparable. This breaks the chain without breaking transitivity.

      *   *Unfalsifiability:* If every time a counterexample is proposed, the contextualist says "Ah, but the context shifted," the view is at risk. To avoid this, they need independent criteria for context identity.

