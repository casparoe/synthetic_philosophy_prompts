answer: |-
  Here are the desiderata for any adequate account of justified conscription, structured to accommodate the specified cases, distinctions, and empirical constraints, followed by an analysis of conflicts, non-negotiables, and the specific case of the armed neutral state.

  ### I. The Desiderata of a Justified Account

  **1. The Liability-Obligation Distinction**
  *   **Requirement:** The account must distinguish between *liability* (being subject to the state's prerogative to call), *obligation* (the duty to serve when called), and *discharge* (satisfying the duty via alternative means).
  *   **Case/Consideration:** This is required to explain **Sweden**, where liability is universal and gender-neutral on paper, but the obligation to serve is incurred only by the selected fraction. It also explains **Finland**, where liability is near-universal for men, but the *term* of obligation varies by role. A theory that collapses these cannot explain why a Swedish woman is liable but rarely serves, while a Finnish man is liable and mostly serves.

  **2. The Economic Substitution Principle**
  *   **Requirement:** The account must define the moral boundary between conscription as *coercion* (seizure of the person) and conscription as an *in-kind tax* (seizure of labor time) that can be commuted to a monetary payment.
  *   **Case/Consideration:** This addresses **Switzerland**, where the exemption levy allows the wealthy or economically critical to pay rather than serve. An adequate theory must justify why time can be traded for money without violating the principle of equal sacrifice, or argue why such a trade is impermissible. It must also address the **transitioning state**, where reintroducing conscription is often debated as a fiscal alternative to high professional wages.

  **3. The Conscience Verdict**
  *   **Requirement:** The account must reach a definite verdict on whether conscientious objection (CO) is a right or a privilege, and whether alternative civilian service must be punitive in duration to prevent abuse.
  *   **Case/Consideration:** This covers **Switzerland** (where COs serve longer) and **Finland** (where total refusers are imprisoned). A theory cannot remain agnostic; it must justify why the state may compel a pacifist to wear a uniform, or why it may compel a pacifist to work longer in a hospital than a soldier spends in the field.

  **4. The Empirical Constraint on Effectiveness**
  *   **Requirement:** The account must be consistent with data regarding the comparative military performance of conscript vs. professional forces, particularly regarding technical specialization and deployment speed.
  *   **Case/Consideration:** Modern warfare increasingly favors small, high-tech professional units over mass infantry. An account justifying **Finland's** high-participation model must explain how short-service conscripts maintain proficiency in complex systems compared to career soldiers. It must also address the **transitioning state**: if the data shows volunteers fight better, the justification for conscription cannot rest on military efficiency alone.

  **5. The Civic Attachment Claim**
  *   **Requirement:** The account must validate or invalidate the claim that service produces civic virtue, social cohesion, or democratic attachment, based on sociological evidence.
  *   **Case/Consideration:** Proponents of the **Swiss** and **Finnish** models often argue service binds the nation. An adequate theory must not assume this benefit *a priori*; it must account for evidence that short-term service may produce resentment rather than attachment, or that civic virtue can be cultivated without coercion.

  **6. The Internal Security Constraint (Coup-Proofing)**
  *   **Requirement:** The account must take a position on the relationship between force design and internal political stability, specifically the risk of the military being used against the citizenry.
  *   **Case/Consideration:** A dispersed part-time militia (Switzerland/Finland) is harder for a central authority to aim at the population than a standing professional army. However, a militia is slower to mobilize. The theory must weigh the democratic safety of a "citizen army" against the operational efficiency of a "state army."

  **7. The Strategic Scope Limitation**
  *   **Requirement:** The account must distinguish between forces designed for *territorial defense* and forces designed for *expeditionary warfare*.
  *   **Case/Consideration:** Conscription is rarely justified for foreign wars of choice. The theory must explain why liability might exist for **peacetime registration** or **wartime call-up** for home defense, but not for deployment abroad. This distinguishes the **Finnish** model (territorial focus) from states that deploy conscripts to international conflicts.

  **8. The Equality of Burden Condition**
  *   **Requirement:** The account must justify any asymmetries in liability based on gender, region, or physical capacity.
  *   **Case/Consideration:** This addresses the **Swiss referendum** (rejecting gender neutrality), the **Åland Islands exemption** in Finland, and the **Swedish** selective model. A theory must explain why a Swiss woman is exempt while a man pays a tax, or why an Ålander is exempt while a mainland Finn serves, without resorting to arbitrary discrimination.

  ---

  ### II. The Hard Conflicts (Impossibility Theorems)

  There is a subset of requirements that cannot be jointly satisfied. Any adequate account must acknowledge this trade-off rather than attempt to resolve it magically.

  **The Efficiency-Equality Trade-off**
  *   **Conflict:** Requiring that the *burden be shared by everyone* (Universalism/Equality) vs. Requiring that the *force be effective under specialization* (Meritocracy/Efficiency).
  *   **Explanation:** Modern military effectiveness relies on long-term specialization (pilots, cyber, nuclear). Conscription relies on short-term, high-turnover manpower. You cannot have a force where everyone serves (maximizing shared burden) and a force that is maximally efficient at high-tech warfare (maximizing specialization).
  *   **Consequence:** A state like **Sweden** resolves this by keeping liability universal but making service selective (sacrificing equality of outcome for efficiency). **Finland** resolves it by accepting lower technical specialization in exchange for mass mobilization capacity. **Switzerland** resolves it by allowing a tax buy-out, effectively admitting that not everyone's time is of equal value to the state. An adequate account must admit that you cannot have universal service *and* a cutting-edge professional military simultaneously.

  **The Coercion-Tax Ambiguity**
  *   **Conflict:** Conscription as *coercion* (state power over body) vs. Conscription as *tax* (economic incidence).
  *   **Explanation:** If a citizen can pay to avoid service (Switzerland), conscription functions as a progressive income tax on those who cannot afford the buy-out. If they cannot pay, it is a coercive seizure of labor. A theory cannot treat it as purely one or the other if both options exist in the same system.

  ---

  ### III. Non-Negotiables vs. Camp Preferences

  To evaluate proposals, one must distinguish between logical necessities for *any* theory and ideological preferences of specific political camps.

  **Non-Negotiable Requirements (For Any Adequate Account)**
  1.  **Empirical Consistency:** The theory cannot claim conscription builds civic virtue if longitudinal data shows it does not. It cannot claim conscripts are as effective as professionals in high-tech roles if data shows otherwise.
  2.  **Logical Consistency on Liability:** The theory must not confuse *registration* with *service*. A state may register all citizens (liability) without calling them (obligation).
  3.  **Strategic Honesty:** The theory must admit if the force is intended for internal security (militia model) vs. external defense. It cannot claim a militia is for foreign expeditionary warfare if the training cycle makes that impossible.

  **Camp Preferences (Ideological Variables)**
  1.  **Gender Neutrality:** A *Liberal-Egalitarian* camp will demand gender neutrality (rejecting the Swiss referendum result). A *Functionalist* camp will accept gender asymmetry if based on physical standards or social role differentiation. The *account* must accommodate the argument, not dictate the outcome.
  2.  **Conscientious Objection:** A *Libertarian* camp will demand absolute CO rights. A *Republican* camp will view CO as a breach of civic duty requiring punishment (Finland/Prison) or penalty (Switzerland/Longer Service). The account must allow the state to choose, provided the justification is consistent.
  3.  **The Tax Option:** A *Market-Liberal* camp prefers the Swiss exemption levy (efficiency). A *Civic-Republican* camp rejects it (corruption of duty).

  ---

  ### IV. The Neutral State Condition

  Finally, the list above owes a specific debt to a state that has forsworn alliances and offensive capability (e.g., historical Switzerland, Finland during the Cold War, or contemporary Austria).

  For such a state, the **Strategic Scope Limitation (Desideratum 7)** becomes the *primary* justification for conscription.
  1.  **Removal of Expeditionary Justification:** Because the state cannot project power abroad, the "professional volunteer force" argument (needed for foreign interventions) is weakened. Conscription is defensible *only* as a territorial denial strategy.
  2.  **Militia Primacy:** The **Internal Security Constraint (Desideratum 6)** shifts. In a neutral state, the "militia" aspect is not just about coup-proofing; it is about *deterrence by denial*. A dispersed, armed citizenry raises the cost of occupation for an invader. This makes the "part-time" nature of conscription a feature, not a bug.
  3.  **Civic Attachment as Deterrence:** For a neutral state, the **Civic Attachment Claim (Desideratum 5)** is not merely about social cohesion; it is about *will to resist*. If the population does not feel ownership of the defense, the strategy of total defense fails. Therefore, the empirical burden on proving the "civic benefit" of service is higher for a neutral state than for a NATO member relying on collective security.

  In sum, for a neutral state, conscription is not a labor policy for the military; it is a political technology for the population. The account must reflect that the army exists not to fight wars abroad, but to make war at home unthinkable for an aggressor.
