answer: |-
  ### Internal Brainstorm: Non-Negotiables

  Before drafting the joint statement, I need to isolate the core commitments each side cannot abandon without ceasing to be themselves.

  **The Causal Decision Theorist (CDT):**
  *   **Causal Isolation:** In a one-shot game with no communication, my physical action cannot causally influence the other player's physical action.
  *   **Dominance:** If action $A$ yields a better outcome than $B$ regardless of what the other player does, $A$ is rationally required.
  *   **No Magic:** My choice cannot "reach out" and change the past or a distant mind. Correlation is not causation.

  **The Superrationalist (SR):**
  *   **Symmetry:** If we are identical reasoners facing identical information, we will output identical decisions.
  *   **Logical Correlation:** My decision is evidence of their decision because we share the same reasoning function.
  *   **Utility Maximization:** Rationality is about getting the best outcome, not just following a causal ritual. If cooperating yields more utility given the symmetry, defecting is irrational.

  **The Overlap:**
  *   Both want to maximize expected utility.
  *   Both agree on the payoff matrix of the Prisoner's Dilemma.
  *   Both agree that if a causal link *were* established (e.g., a contract), cooperation would be rational.
  *   Both agree that "magic" (influencing the world without a causal channel) is impossible. The dispute is about whether logical necessity counts as a "channel" for decision-making.

  ***

  # JOINT STATEMENT ON SUPERRATIONALITY AND CAUSAL DECISION THEORY
  **Subject:** Rational Choice in the One-Shot Symmetric Prisoner's Dilemma
  **Signatories:** The Causal Decision Theorist (CDT) & The Superrationalist (SR)

  ## 1. Agreed Claims
  The following propositions are accepted by both parties as the baseline for this dispute.

  1.  **Game Structure:** We are analyzing a standard Prisoner's Dilemma with payoffs $T > R > P > S$ (Temptation, Reward, Punishment, Sucker) and $2R > T + S$. The game is one-shot, anonymous, and simultaneous.
  2.  **No Causal Channel:** There is no physical mechanism by which Player A's choice of button-press can transmit a signal to Player B before Player B chooses. There is no enforcement mechanism, no contract, and no reputation effect.
  3.  **Nash Equilibrium:** Both parties agree that (Defect, Defect) is the unique Nash Equilibrium of this game. A unilateral deviation from Defect to Cooperate lowers the deviator's payoff *holding the other player's action fixed*.
  4.  **Instrumental Rationality:** The goal of decision theory is to prescribe actions that maximize the agent's expected utility. A decision theory that systematically yields lower payoffs than a rival theory in identical scenarios is prima facie deficient.
  5.  **The Symmetry Condition:** The Superrationalist's argument relies on the premise that the players are "relevantly identical." Both parties agree that if the players are not identical in reasoning or information, the Superrationalist argument for cooperation weakens or dissolves.
  6.  **Repeated vs. One-Shot:** Both parties agree that in an *iterated* Prisoner's Dilemma with a known horizon, backward induction mandates defection, but with an unknown horizon or infinite duration, cooperation can be sustained via causal strategies (e.g., Tit-for-Tat). The current dispute is strictly about the *one-shot* case where such causal strategies are unavailable.

  ## 2. Table of Disagreements
  The following table outlines the residual disagreements. Each statement is phrased such that the proponent accepts it as accurate, and the opponent accepts it as a fair characterization of their opponent's view.

  | ID | Core Disagreement | Causal Decision Theorist (CDT) Position | Superrationalist (SR) Position |
  | :--- | :--- | :--- | :--- |
  | **D1** | **Relevance of Correlation** | Logical correlation between agents is evidentially relevant but **decision-irrelevant**. I must treat the other's action as a fixed state of the world when evaluating my causal options. | Logical correlation between agents is **decision-relevant**. I must treat my decision as determining the output of the shared reasoning function, thereby determining the other's action. |
  | **D2** | **Application of Dominance** | The Dominance Principle holds universally in the absence of causal links. Since Cooperate is dominated by Defect, Defect is the only rational choice. | The Dominance Principle applies only when the other player's action is independent of my procedure. Under symmetry, the actions are not independent, so dominance reasoning is misapplied. |
  | **D3** | **Nature of the "Choice"** | My choice is a local physical event. That a distant mind mirrors it is a happy coincidence, not a lever I can pull. | My choice is the output of an abstract algorithm. That the algorithm runs elsewhere means my choice *is* the lever that moves both instances. |
  | **D4** | **Risk of Error** | If I cooperate based on symmetry and the other defects, I lose maximally. Defection protects against the error of false symmetry. | If I defect based on causal isolation and the other cooperates (or is identical), we both lose the surplus. Cooperation captures the surplus if symmetry holds. |

  ## 3. Cruxes and Test Cases
  We identify three specific sub-questions (cruxes) where settling the matter would resolve the broader dispute. For each crux, we propose a concrete case and state our predictions in advance.

  ### Crux 1: The Ontological Status of Logical Counterfactuals
  **Question:** Is the connection between identical reasoners a causal handle or merely an evidential observation?
  **Test Case: The Perfect Copy.**
  Player A and Player B are not humans, but identical computer programs running on separate servers. The source code is open and verified to be bit-for-bit identical. The code must output "C" or "D". The servers are air-gapped (no causal communication).
  *   **CDT Prediction:** **Defect.** The execution on Server A does not causally influence the voltage on Server B. The dominance principle holds.
  *   **SR Prediction:** **Cooperate.** The output of Function $F$ is identical in both instances. To choose "D" is to dictate that $F() = D$, meaning the other server *must* output "D".
  *   **Resolution Condition:** If CDT concedes that in the Perfect Copy case, the rational move is Cooperate, they abandon pure causal isolation. If SR concedes Defect, they abandon superrationality.

  ### Crux 2: The Threshold of Correlation
  **Question:** Is superrationality a binary switch (identity) or a gradient (probability)?
  **Test Case: The Probabilistic Population.**
  Players are humans drawn from a population where 90% of people reason using "Method X" and 10% use "Method Y". You know you use Method X. You know the other player is drawn from this population, but you do not know their method.
  *   **CDT Prediction:** **Defect.** My action does not cause their method. Even if they likely match me, I cannot *make* them match me. The causal expected utility of Defect remains higher.
  *   **SR Prediction:** **Cooperate.** (Conditional on payoff structure). If the probability of matching is high enough, the expected utility of Cooperate ($0.9 \times R + 0.1 \times S$) exceeds Defect ($0.9 \times P + 0.1 \times T$). Rationality tracks expected utility, not just causal certainty.
  *   **Resolution Condition:** Does rationality require causal certainty to cooperate, or does high-probability logical correlation suffice?

  ### Crux 3: Smuggling the "Shadow of the Future"
  **Question:** Is superrational cooperation merely iterated-game intuition misapplied to a one-shot case?
  **Test Case: Public Randomization Device.**
  Before the game, a public coin is flipped. If Heads, both are instructed to Cooperate; if Tails, both Defect. This creates a Correlated Equilibrium. However, the instruction is non-binding advice.
  *   **CDT Prediction:** **Ignore the Signal.** Once the coin lands, the instruction has no causal power. I should defect regardless of the coin to maximize my payoff given the other's likely action.
  *   **SR Prediction:** **Follow the Signal.** We both know the other knows the signal. If we are superrational, we treat the signal as a logical focal point. To ignore it is to break the symmetry of reasoning that allows coordination.
  *   **Resolution Condition:** If SR cooperation relies on the coin, it may be a disguised form of repeated-game coordination (where the coin simulates a "next round"). If it holds without the coin, it is distinct.

  ## 4. Expert Verdict and Load-Bearing Crux

  **Load-Bearing Crux:** Crux 1 (The Ontological Status of Logical Counterfactuals / The Perfect Copy Case).

  **Position:** The truth lies with the **Superrationalist**, provided their position is updated to modern Functional Decision Theory (FDT).

  **Reasoning:**
  The Causal Decision Theorist's stance collapses in the **Perfect Copy** case. In this scenario, it is a mathematical fact that the output of Player A is identical to the output of Player B. When Player A deliberates, they are not merely observing a correlation; they are computing the result of a function that is *also* running on Player B's server.

  CDT insists on treating the other player's action as an independent environmental variable. In the Perfect Copy case, this is objectively false. The other player's action is not an independent variable; it is the *same variable*. By choosing to defect, the CDT agent is not "protecting" themselves against an independent actor; they are actively selecting the world state where (Defect, Defect) occurs rather than (Cooperate, Cooperate).

  CDT leaves utility on the table in this specific case. A decision theory that yields \$10 in a scenario where \$100 is available simply because it refuses to acknowledge logical determination is instrumentally inferior. The Superrationalist intuition—that your decision determines the output of the algorithm, wherever it runs—is the correct one for agents embedded in a computational universe.

  However, the Superrationalist must concede **Crux 2**. In the **Probabilistic Population** case, pure superrationality is unstable. If the correlation is not logical identity but merely statistical (e.g., "we are both humans"), the CDT objection regains force. Statistical correlation does not imply that *my* decision changes *theirs*; it only implies that *my* decision is evidence of *theirs*. Evidential Decision Theory (EDT) cooperates here, but EDT is vulnerable to "Newcomb-like" exploitation (e.g., the Smoking Lesion problem).

  Therefore, the robust position is not Hofstadter's original informal superrationality, but **Functional Decision Theory**: Cooperate when your decision procedure is logically linked to the other's (Perfect Copy), but defect when the link is merely statistical or causal independence is verified (Probabilistic Population/Standard One-Shot). The CDT is correct about the standard human one-shot PD (where logical identity is impossible to verify), but wrong about the fundamental nature of choice in symmetric computational environments.

  ## 5. Note on Contentious Readings
  *For the Seminar Reader:*
  This document interprets "Superrationality" through the lens of contemporary decision theory (specifically Functional Decision Theory) rather than strictly adhering to Douglas Hofstadter's original 1983 informal columns. Hofstadter's original formulation was ambiguous regarding whether the "identity of reasoning" was a metaphysical claim or a heuristic assumption.
  *   **The CDT Signatory** accepts this document under the understanding that "Superrationalist" refers to the *claim* that logical correlation is decision-relevant, not necessarily endorsing Hofstadter's specific biological claims about human neurons.
  *   **The Superrationalist Signatory** accepts the "Perfect Copy" verdict as the core of their view, acknowledging that in standard human interactions (where source code is not visible), the practical recommendation often converges with CDT due to uncertainty about the other's reasoning algorithm. The disagreement remains foundational, even if practical advice sometimes overlaps.
