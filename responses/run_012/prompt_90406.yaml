answer: |-
  Thank you, Dean, and thank you, Chair, for the invitation. It is a genuine honor to stand here. When the Dean spoke a moment ago about the department's "journey" over the last century, I felt a particular kinship. As a fifth-year doctoral candidate, I know a thing or two about a journey that was supposed to take four years. So I understand the appeal of a timeline that moves neatly from point A to point B.

  But standing in a room like this, surrounded by a hundred years of our collective work, I am reminded that history rarely moves in a straight line. It loops. It stalls. It gets lost in the basement archives.

  The official narrative for tonight is a comforting one. It suggests a ladder: we began in humble, perhaps flawed, rooms in 1926, and through a series of brave corrections, we have ascended to our current status as a "world-leading centre." It is a story of redemption. It is a story where the past is a draft of the present, and every generation before us is either a forerunner to our enlightenment or an obstacle we had to overcome.

  It is a very tempting story. I have written it myself. I caught myself last week typing the phrase "we have come a long way since," and I had to stop and delete it. Because as historians, we are trained to be suspicious of that specific grammar. When we sort the people of the past into "heroes who almost got it right" and "villains who got it wrong," we aren't doing history. We are holding a trial. We are abridging the complexity of their lives to serve a verdict on our own.

  If we only value our founders when they look like us, we lose them. And if we only value them when they were wrong, so we can feel right, we lose them too.

  So, I want to propose a different way to celebrate a centennial. Not by climbing a ladder, but by opening a drawer.

  In the summer of 1929, three years after this department opened, a junior faculty member named Professor Arthur Penhaligon became obsessed with the acoustics of our original seminar room. While the Chair was lecturing on imperial administration, and while the donors were worrying about the endowment, Penhaligon was measuring the echo. He wanted to know how the curvature of the plaster ceiling affected the comprehension of subjunctive verbs in a lecture hall.

  He spent two years on this. He wrote a monograph. He mapped the sound waves. And then, the room was renovated. The plaster was torn out. The data became useless. The monograph was never published. It sits in the archive, box 4, folder 2, bound in green cloth.

  Why do I bring this up? It isn't a story of progress. Penhaligon's work led nowhere. It didn't help the empire, and it didn't help the marginalized. It doesn't fit our current research clusters. By the logic of the "ladder," Penhaligon was wasting his time.

  But I find him deeply comforting. Because Penhaligon wasn't trying to build a future. He wasn't trying to justify a fortune made in the mills. He was just paying attention to the world he was in. He was treating the room, and the people in it, as subjects worthy of study on their own terms, not for what they could become.

  That is the gift this department has given me. It hasn't just taught me how to judge the past. It has taught me how to inhabit it. To sit with the uncomfortable, the unfinished, and the unintelligible without rushing to fix it.

  We are here tonight because we love that work. We love the messy, human reality of it. The donors in this room, the alumni, the faculty—you have supported a place where curiosity doesn't always have to be "impactful" to be valuable. Where a professor can study the acoustics of a room that no longer exists, simply because the echo mattered to him.

  So, let us celebrate the centennial not by claiming we are better than the people who built this place. Let us celebrate that we are still here, still asking questions, still listening to the echoes. Even the ones that lead nowhere.

  Thank you.
