  ### Phase 1: Brainstorming Axes and Combinations

  Before drawing the tree, we need to map the seven requested positions against your four axes to ensure the questions will actually separate them.

  | Position | Accounting | Market Type | Obstacle | Preferences |
  | :--- | :--- | :--- | :--- | :--- |
  | **Mises** | Money | Competitive (Private) | Fundamental (Property) | Irrelevant (Impossible) |
  | **Hayek** | Money | Competitive (Public OK*) | Epistemic (Tacit) | Discovery |
  | **Lange** | Money (Shadow) | Administered | Computational (Solvable) | Given (Matched) |
  | **Neurath** | In-Kind | None | Motivational (Ethical) | Determined |
  | **Mech. Design** | Money | Competitive (Designed) | Motivational (Strategic) | Given (Revealed) |
  | **Comp. Revival** | In-Kind (Digital) | None/ Hybrid | Computational (Solvable) | Given (Aggregated) |
  | **Worker-Coops** | Money | Competitive (Coop) | Motivational (Alienation) | Given |

  *\*Hayek prefers private property but argues the calculation problem is epistemic, not strictly legal, though he thinks public ownership fails the epistemic test.*

  **Potential Empty/Incoherent Combinations:**
  1.  **In-Kind + Competitive Market:** Contradictory. If you have competitive markets, you have money prices. If you use in-kind accounting, you are bypassing the market mechanism.
  2.  **Administered Prices + Discovery:** If a central board sets prices, they are matching existing data, not discovering new entrepreneurial knowledge.
  3.  **Mises + Possible:** By definition, Mises claims impossibility.

  ---

  ### Phase 2: The Decision Tree

  **Instructions:** Start at Node 1. Answer the question honestly based on your theoretical commitments. Follow the arrow to the next node or the final leaf.

  **Node 1: Accounting**
  Does rational economic calculation require universal money prices, or can it be performed in physical units (in-kind)?
  *   **Money Prices:** Go to Node 2.
  *   **In-Kind/Physical:** Go to Node 5.

  **Node 2: Market Structure**
  Are these prices formed by decentralized competitive exchange, or by a central board's iteration?
  *   **Central Board (Shadow Prices):** Go to Node 3.
  *   **Decentralized Exchange:** Go to Node 4.

  **Node 3: Administrative Binding**
  Does the planning board treat these shadow prices as binding constraints on managers?
  *   **Yes:** **Leaf A: Lange-Lerner Market Socialism**
  *   **No:** **Leaf B: [Empty/Incoherent]** (Soft Planning/Command without constraints)

  **Node 4: Property Rights**
  Is private ownership of the means of production essential for these prices to function?
  *   **Yes (Essential):** **Leaf C: Misesian Impossibility**
  *   **No (Compatible with Public/Coop):** Go to Node 6.

  **Node 5: Technical Feasibility**
  Is the calculation of physical balances technically solvable with available technology?
  *   **Yes:** Go to Node 6.
  *   **No:** **Leaf D: [Empty/Incoherent]** (Romantic In-Kind Planning)

  **Node 6: In-Kind Rationale** (Only reached via Node 5)
  Is the rejection of money primarily for technical optimization or ethical reasons?
  *   **Technical (Cybernetic/AI):** **Leaf E: Computational Planning Revival**
  *   **Ethical (Money distorts value):** **Leaf F: Neurath/Dobb In-Kind Planning**

  **Node 7: Preference Dynamics** (Only reached via Node 4)
  Does the economic problem involve matching existing preferences or discovering new ones through action?
  *   **Discovering (Dynamic):** **Leaf G: Hayekian Knowledge/Discovery**
  *   **Matching (Static/Given):** Go to Node 8.

  **Node 8: Primary Friction** (Only reached via Node 7)
  Is the main barrier to efficiency strategic lying (information asymmetry) or alienation (ownership power)?
  *   **Strategic Lying:** **Leaf H: Mechanism Design (Incentive-Compatibility)**
  *   **Alienation/Power:** **Leaf I: Worker-Cooperative Market Socialism**

  ---

  ### Phase 3: The Leaves (Named Positions)

  *   **Leaf A (Lange-Lerner):** Must swallow the awkward commitment that central bureaucrats can simulate market discipline without the threat of bankruptcy.
  *   **Leaf B (Empty):** *Diagnosis:* Incoherent; administrative prices without binding rules dissolve into arbitrary command.
  *   **Leaf C (Mises):** Must swallow the awkward commitment that no institutional innovation could ever replicate the information function of private property titles.
  *   **Leaf D (Empty):** *Diagnosis:* Unattractive; implies planning without the capacity to plan, leading to chaos.
  *   **Leaf E (Computational Revival):** Must swallow the awkward commitment that modern data processing is sufficient to solve the dimensionality problem of a whole economy.
  *   **Leaf F (Neurath/Dobb):** Must swallow the awkward commitment that use-values can be compared and aggregated without a common denominator.
  *   **Leaf G (Hayek):** Must swallow the awkward commitment that public ownership is theoretically possible but practically doomed because knowledge cannot be centralized.
  *   **Leaf H (Mechanism Design):** Must swallow the awkward commitment that complex market rules can be engineered to force truth-telling without creating new loopholes.
  *   **Leaf I (Worker-Coops):** Must swallow the awkward commitment that changing ownership structure solves allocation problems without sacrificing competitive speed.

  ---

  ### Phase 4: Meta-Analysis

  **Two Leaves the Tree Can't Really Separate:**
  **Hayekian Knowledge (Leaf G)** and **Worker-Cooperative Market Socialism (Leaf I)**.
  *   **Diagnosis:** Both occupy the "Money + Competitive + Public/Coop Compatible" space. In practice, a federation of worker co-ops operating in a competitive market looks functionally identical to the Hayekian ideal of decentralized exchange, differing only in the internal governance of the firm. The tree separates them by *friction* (Knowledge vs. Alienation), but empirically, both systems rely on the same price signals and face similar discovery problems.

  **Empty Answer-Combinations:**
  1.  **In-Kind + Competitive Exchange (Leaf D path):**
      *   *Diagnosis:* **Incoherent.** You cannot have decentralized competitive exchange without a universal medium of exchange (money) to clear the trades; "in-kind" implies direct allocation, which bypasses the market mechanism entirely.
  2.  **Administered Prices + Preference Discovery (Node 3 path to Discovery):**
      *   *Diagnosis:* **Unattractive/Nobody's Tried It.** A central board setting prices is inherently backward-looking (matching existing data); it structurally cannot facilitate the entrepreneurial discovery of *new* preferences or products, which requires risk-bearing decentralization.
  3.  **Mises + Possible (Node 4 "No" to Essential):**
      *   *Diagnosis:* **Contradictory.** If you answer "No" to "Is private ownership essential?", you have already rejected the Misesian impossibility claim, so you cannot end up at the Mises leaf. (The tree handles this by routing "No" to Node 7).
