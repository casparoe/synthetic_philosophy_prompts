prompt: |-
  You are a philosopher of the social sciences who also writes on film form. Think carefully before you answer, and start by sketching the film's causal structure for yourself before committing to a reading. I am preparing a session for an interdisciplinary group on historical contingency, and the text is Tom Tykwer's Run Lola Run (1998): the same twenty minutes replayed three times while Lola tries to raise 100,000 marks for Manni, with brief flash-forwards showing how her brush-pasts with strangers redirect those strangers' whole lives, and a closing run in which she takes the money off a roulette table after her scream appears to force the ball onto her number.

  Read the film through the path-dependence debate, and make the reading earn its keep in both directions. The distinctions I want it to work with: weak path dependence, where history matters but the destination is shared, versus strong path dependence, where small early accidents are amplified and the system settles irreversibly into one of several equilibria; equifinality, the rival picture in which many routes converge on a single attractor, so the same outcome would have arrived anyway; and counterfactual robustness, the idea that an outcome counts as inevitable only insofar as it survives nearby perturbations of the path.

  The film seems to dramatise strong contingency, since a dog, a bicycle and a phone call decide who dies and what becomes of every stranger Lola passes. But each run is bounded by the same two fixed points, the deadline and the rendezvous, and the money is found every time, by supermarket, by bank, or by roulette, while only the deaths differ. So which thesis does the film actually hold, contingency or equifinality, and does it confuse the two? Are the runs three counterfactual histories of one world or three worlds, and does it matter which, given that on a closest-world reading of what would have happened otherwise, one of them has to be the actual one? Does the casino scene expose the film's real metaphysics, that will rather than accident is doing the work?

  Be honest about where the film resists the frame: that rerunning the same twenty minutes is a narrative device and not a controlled experiment, that the runs do not restart from identical conditions, and that the convergence may be a demand of the plot rather than a claim about history. Finish by saying what the film makes visible that the arguments alone cannot, above all the difference between an outcome being inevitable and its merely being robust. Assume I know the film, so skip plot summary, and give no citations or reading list.
