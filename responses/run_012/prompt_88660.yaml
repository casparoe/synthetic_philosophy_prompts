  "The theorem, stated plainly"
  Harsanyi's Aggregation Theorem concerns a fixed population facing lotteries over social states. Suppose each individual satisfies the von Neumann–Morgenstern (VNM) axioms, yielding cardinal utility functions unique up to positive affine transformation. Suppose social preferences also satisfy VNM axioms. If social preferences respect the Pareto principle—meaning society prefers lottery L to M whenever every individual does—then the social welfare function must be representable as a linear combination of individual utilities. Specifically, there exist non-negative constants such that social utility equals the weighted sum of individual utilities. Crucially, the theorem establishes the form of aggregation (weighted sum), not the weights themselves. It relies on the linearity of expected utility and the Pareto constraint to rule out non-linear aggregation rules like maximin or leximin within the VNM framework. The result holds for any fixed set of individual utility functions, provided they are comparable enough to be summed. This implies that any social evaluator consistent with these axioms must act as if maximizing a weighted sum of individual expected utilities. However, the theorem does not determine the weights; they remain free parameters reflecting ethical judgments outside the axioms. This linearity is the defining characteristic of the result.

  "What holds up"
  Your colleague is correct on the core mechanical result. Given VNM rationality for both individuals and society, plus the Pareto principle, the social welfare function must indeed take the form of a weighted sum of individual utilities. This is a powerful representation result. It is also true that this framework bypasses Arrow's Impossibility Theorem, primarily because Arrow assumes ordinal, non-comparable utilities, whereas Harsanyi assumes cardinal, comparable utilities fixed by the VNM structure. Finally, linking the weighted sum form to utilitarianism is standard; classical utilitarianism is a specific case of this weighted sum. So, the mathematical skeleton of the argument—rationality plus Pareto implies linearity—is accurate.

  "What misleads"
  The most damaging error is the claim that "equal weights... fall straight out." The Aggregation Theorem yields a weighted sum, but the weights are undetermined constants. Nothing in the math forces them to be equal. You can satisfy Harsanyi's conditions while prioritizing the worst-off, provided you assign them higher weights in the linear sum. The theorem restricts the functional form, not the distributional values. Second, the Arrow remark is imprecise. Harsanyi doesn't just use cardinal utility; he assumes interpersonal comparability is meaningful enough to sum them. Arrow's theorem holds even with cardinal utility if comparability is absent. Third, the Rawls sentence conflates two distinct Harsanyi arguments. The Aggregation Theorem does not use the veil of ignorance. The veil argument is separate: it claims rational choice behind the veil implies utilitarianism. But even there, claiming maximin is "pathological" is a substantive ethical claim, not a logical consequence of the axioms. Rawls explicitly rejects expected utility maximization behind the veil, so saying Harsanyi "settles" the quarrel assumes the very premise Rawls denies. The thumbnail treats a contested ethical argument as a mathematical proof. The claim that maximin is merely "pathologically risk-averse" mischaracterizes Rawls. Rawls argues that behind the veil, probabilities are unknown or meaningless, making expected utility calculation impossible, not just risky. Harsanyi assumes equiprobability; Rawls denies the justification for it. Therefore, the theorem doesn't settle the quarrel; it highlights the divergence on whether social justice is a problem of risk or a problem of radical uncertainty. Furthermore, stating there is "no room" for the worst-off ignores that weighted utilitarianism can mimic prioritarianism if weights are chosen appropriately, provided the function remains linear. A social planner can care exclusively about the poorest individual by assigning them a weight of one and everyone else zero, satisfying Harsanyi's conditions perfectly. The theorem only bans non-linear concavity, not unequal weighting. This distinction is vital for welfare economics. The thumbnail suggests utilitarianism is the only coherent ethics, but it is only the only coherent linear ethics under VNM. If one rejects VNM for social preferences, the theorem does not apply. Thus, the thumbnail presents a conditional result as an unconditional ethical mandate. It obscures the fact that the "rationality" invoked is specific to expected utility, which is itself a normative choice, not a logical necessity. Many economists argue that society might reasonably exhibit risk aversion over distributions of utility even if individuals do not, which would violate the social VNM axioms required for Harsanyi's result. By presenting the theorem as settling the matter, the thumbnail closes off legitimate debate about the structure of social risk preferences.

  "Do the conclusions follow?"
  First, the claim that there is "no room left for giving extra weight to the worst off" does not follow. You can weight the worst-off heavily within a linear sum; the theorem only bans non-linear concavity (like maximin), not unequal weighting. Second, the Arrow remark follows only partially. Harsanyi sidesteps Arrow by assuming interpersonal comparability, not merely cardinality. Cardinal non-comparable utilities still face impossibility results. Third, the Rawls conclusion follows from nothing in the Aggregation Theorem. It relies on the separate "veil of ignorance" argument, which assumes individuals maximize expected utility behind the veil. Rawls rejects this assumption, arguing the uncertainty is too profound for probability assignments. Thus, Harsanyi does not settle the quarrel; he restates the disagreement over the applicability of expected utility to fundamental justice. Consequently, the Rawls conclusion is an overreach, presenting a philosophical stance as a theorem. The Aggregation Theorem is silent on the veil, which requires an additional premise of equiprobability to derive equal weights. Therefore, none of the three closing claims follow strictly from the theorem; they require additional ethical premises that are themselves subject to debate.

  "Verdict"
  Do not repeat the thumbnail as written. It conflates the form of aggregation with the choice of weights and mixes two distinct Harsanyi arguments. You may state that VNM plus Pareto implies a weighted linear sum, but you must emphasize that the weights are ethically chosen, not mathematically forced. Clarify that interpersonal comparability is the true escape from Arrow, not cardinality alone. Finally, separate the Aggregation Theorem from the Veil of Ignorance argument; the latter is required for the equal weights claim, but it remains a controversial ethical premise, not a settled mathematical result.
