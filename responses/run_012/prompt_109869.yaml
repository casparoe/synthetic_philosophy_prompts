      *(Self-Correction during drafting)*: I need to be careful with the "Index vs. Handicap" distinction. An index is unfakeable due to physical constraint (e.g., deep voice = large throat). A handicap is fakeable but too costly to fake (e.g., peacock tail). Veblen's waste is *costly*, so it's a handicap. But because it's about *relative* standing, it escalates. I need to make sure I don't confuse the user on Index vs. Handicap. Veblen is definitely Costly Signalling (Handicap), but the *target* of the signal is relative rank.

      *(Refining Worry 2)*: Don't dismiss the "self" aspect. In human cultural evolution, self-signalling is a real phenomenon. But for the *social system* Veblen describes, the public aspect is the driver. I will argue the self-complacency is a psychological byproduct of the public signalling mechanism.

      *(Refining Worry 3)*: Vicarious consumption. The cost is pecuniary. The husband pays. The signal is the wife's leisure. This is a "agent-principal" problem in economics, but in signalling terms, as long as the cost is tied to the resource holder's ability, it remains honest.

      *(Refining "Evidence")*: Veblen uses "evidence" in a quasi-legal sense that relies on economic causality. It's epistemic for the observer, causal for the signaller.

