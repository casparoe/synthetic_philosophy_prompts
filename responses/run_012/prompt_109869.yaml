answer: |-
  Here are the three live candidate interpretations of the Veblen passage, ranked by their plausibility given the text and the formal theory.

  **Candidate 1: The Standard Handicap Interpretation.** Veblen is describing a Zahavi-Grafen style costly signalling system. "Evidence" means "costly display." Wealth is the underlying quality; conspicuous waste is the signal. The signal is honest because it is too costly for the poor to fake. The system seeks a stable equilibrium where signal cost matches underlying wealth.

  **Candidate 2: The Index Interpretation.** Veblen is describing an index, not a handicap. An index is a signal that cannot be faked due to physical or structural constraints (e.g., a deep voice requires a large larynx). On this reading, spending money is not a "cost" that reduces fitness, but a direct, unfakeable manifestation of the resource itself. You cannot display wealth you do not possess; therefore, no "handicap" mechanism is needed to enforce honesty.

  **Candidate 3: The Positional Arms-Race Interpretation.** Veblen is describing a signalling system where the "quality" being signalled is not absolute (like health or viability) but relative (rank). Because the value of the signal depends on outdoing others rather than meeting a threshold, the system does not settle at an equilibrium but escalates indefinitely. The "evidence" is a bid in an auction, not a certificate of quality.

  ***

  ### The Verdict

  Veblen is best read through **Candidate 3: The Positional Arms-Race Interpretation**, which is a specific, dynamic variant of Costly Signalling (Candidate 1).

  Signalling theory does not merely dress up Veblen's account; it clarifies the structural instability Veblen identifies. Veblen is describing a **Costly Signalling** system—because the display involves waste that would be detrimental if not for the social return—but it is distinct from the standard biological models (like Grafen's) because the trait being signalled is a **Positional Good**.

  In standard signalling models (like Grafen's 1990 formalization of the Handicap Principle), the system tends toward a **Separating Equilibrium**. This is a state where different types of signallers (e.g., high-quality vs. low-quality) choose different signal intensities, and receivers respond appropriately, stabilizing the system. High-quality individuals signal more because the cost is lower for them relative to their benefit.

  Veblen's system, by contrast, is a **War of Attrition** over rank. Because "esteem" is relative, the value of the signal depends on what everyone else is doing. When everyone increases expenditure, the baseline shifts. This explains the "indefinitely extensible" standard. The signal remains honest (it is still "evidence"), but the system has no rest point. It is a signalling account, but one driven by frequency-dependent selection where the payoff is rank, not absolute resource acquisition.

  Here is how this verdict addresses your four specific worries.

  #### 1. Relative Standing and the Absence of Equilibrium
  You ask if the absence of an equilibrium disqualifies this as a signalling account. It does not, but it shifts the model from a *stabilizing* signalling game to an *escalatory* one.

  In the standard Handicap Principle, the signal reveals absolute quality (e.g., "I am parasite-resistant"). Once the receiver knows this, there is no need to signal louder next year. In Veblen's pecuniary emulation, the signal reveals relative rank (e.g., "I am wealthier than you"). If you signal louder, I must respond to maintain my rank.

  This is formally modeled in biology as a **Red Queen Dynamic** or an evolutionary arms race. The "evidence" requirement ensures the signal remains honest (you still need the money to burn), but the *level* of evidence required drifts upward. Signalling theory illuminates this perfectly: it predicts that when the benefit of the signal is purely relative, the cost of signalling will escalate until it hits a physiological or economic budget constraint. Veblen's "indefinitely extensible" claim is his observation that the budget constraint in human culture is psychologically flexible (habituation), allowing the arms race to continue where biology might force a stop.

  #### 2. The Receiver: Other vs. Self
  You note Veblen claims the display preserves "self-complacency." This seems to violate the standard signalling requirement that a signal evolves because a *receiver* acts on it.

  However, in human cultural evolution, we must distinguish between the *evolutionary origin* of the mechanism and its *psychological maintenance*. For the system of "esteem" to exist, there must be a public audience that grants status (resources, mating opportunities, cooperation) based on the signal. If no one else cared, self-complacency would not translate into social advantage.

  The "self-complacency" is best understood as an internalized receiver. We evolve psychological mechanisms that reward us for successful signalling to others. If the signal works on others, it triggers a self-reward (complacency). If the signal fails, it triggers shame. This aligns with **Self-Signalling Theory**, where the agent observes their own actions to infer their own type. However, for Veblen's *social* theory to hold, the public receiver is primary. The self-complacency is a proximate mechanism to ensure the signaller maintains the costly display required by the ultimate public audience. Without the public audience, the cost of the display would be selected against.

  #### 3. Vicarious Consumption and Delegation
  You ask if the handicap logic survives when the wife displays but the husband pays.

  The logic holds provided the cost is borne by the *resource-controlling unit*. In signalling theory, honesty is maintained if the cost is linked to the underlying quality being signalled. Here, the underlying quality is the household's pecuniary strength.

  If the husband controls the capital, his ability to sustain the wife's leisure is the "handicap." It is costly to *him* (reduced capital accumulation), and it is hard to fake because he cannot sustain the flow of payments without the underlying wealth. The wife functions as a **Extended Phenotype** of the husband's economic power. As long as the cost is tied to the resource holder's ability to pay, the signal remains honest. The delegation does not break the handicap; it merely separates the locus of cost (the purse) from the locus of display (the person). This is common in biology (e.g., bowerbirds building structures rather than displaying their own bodies); the signal is externalized, but the cost remains tied to the signaller's quality.

  #### 4. The Meaning of "Evidence"
  You ask whether "evidence" is epistemic, causal, or juridical.

  For Veblen, "evidence" is **Epistemic grounded in Causal constraint**.
  *   **Epistemic:** It is about what the observer *knows*. "Esteem is awarded only on evidence" means observers will not grant status based on assertion (cheap talk); they require proof.
  *   **Causal:** The proof works because of a causal link between wealth and waste. You cannot causally sustain a high level of waste without a high level of wealth.

  It is not merely a juridical metaphor. Veblen is not saying society *agrees* to treat waste as evidence (which would be a conventional signal); he is saying the physics of economics makes waste a reliable indicator. However, because the standard is "indefinitely extensible," the *amount* of evidence required is socially determined (conventional), even if the *link* between waste and wealth is causal.

  So, "evidence" does the work of ensuring **Signal Honesty**. It prevents **Pooling Equilibria** (where rich and poor send the same signal) by enforcing a **Separating Equilibrium** (where only the rich can afford the signal), even if the threshold for separation keeps moving.

  ***

  ### What Would Change My Mind

  I am committed to the view that Veblen is describing a Positional Costly Signalling system. Two things would force me to abandon this reading:

  1.  **If Veblen endorsed "Cheap Talk":** If Veblen argued that esteem could be gained through mere assertion, reputation, or title without accompanying material waste, the Handicap/Costly Signalling model would fail. Costly signalling theory relies on the differential cost to maintain honesty. If Veblen believed the *appearance* of leisure could be sustained without the *cost* of leisure (e.g., through debt that is never called in, or pure deception that works long-term), then the "evidence" claim is rhetorical, not structural. The text suggests he thinks debt-fueled display is unstable ("pecuniary ability" must exist), so this is unlikely, but if you found a passage where he validates unfunded display as equally effective, my reading collapses.

  2.  **If the "Standard" were Fixed:** If Veblen argued that there is a specific, fixed level of expenditure that secures esteem regardless of what neighbors do (an absolute threshold), then this would be a standard Grafen-style Handicap model, not a Positional Arms Race. The "indefinitely extensible" quote is the linchpin. If that claim were an anomaly in his text, and the bulk of the book argued for a fixed standard of "reputability," then the Arms Race interpretation would be wrong. Since the extensibility is central to his theory of emulation, I am secure in the Arms Race reading.

  **Where my reasoning is most likely to go wrong:**
  I may be over-intellectualizing Veblen's psychology. Signalling theory assumes rational (or evolved) optimization of costs and benefits. Veblen often writes of "habituation" and "instinctive" emulation. If the behavior is purely habitual and insensitive to marginal costs (i.e., people bankrupt themselves blindly without calculating the "signal value"), then game-theoretic models of equilibrium or escalation may not apply because the agents are not responding to payoff structures in the way the models assume. They might be running a fixed action pattern rather than playing a signalling game. However, Veblen's mention of "flexibility" and "habituation to increase" suggests a responsiveness to economic conditions that keeps the signalling framework viable.

  ### Summary for your Students
  Tell them this: Veblen is describing a **Costly Signalling** system where the **Quality** being signalled is **Relative Rank**. Because rank is relative, the system creates an **Escalatory Arms Race** rather than a stable **Equilibrium**. The "Evidence" is the **Cost** that ensures **Honesty**, preventing the poor from faking the signal. The fact that the standard moves ("indefinitely extensible") does not break the signalling model; it simply identifies it as a competition for a **Positional Good** rather than an absolute resource. Signalling theory does not dress this up; it provides the formal vocabulary to explain why the waste must be real (Handicap) and why the waste must never stop (Arms Race).
