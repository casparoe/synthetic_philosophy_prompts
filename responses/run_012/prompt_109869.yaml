      *   *Passage 2:* The standard is flexible and "indefinitely extensible" via habituation.
      *   *Key Tension:* Is the display *proof* of underlying wealth (index/handicap) or is the display *constitutive* of the status itself (positional arms race)?

  3.  **Develop Candidate Interpretations:**
      *   *Candidate 1: The Costly Signalling (Handicap) Reading.* Veblen is describing a Zahavi/Grafen style system. Waste proves wealth because only the wealthy can afford waste. It's an honest signal of underlying resource holding potential.
      *   *Candidate 2: The Conventional/Index Reading.* The display isn't costly in a biological sense but is socially stipulated. However, Veblen emphasizes *waste*, which suggests cost. Maybe it's an "Index" (unfakeable by definition, like a roar size correlating with body size) where wealth *is* the capacity to waste.
      *   *Candidate 3: The Positional Arms Race (Red Queen) Reading.* This isn't about honest signalling of a static trait, but a dynamic competition for rank. The "evidence" is just the current bid in an auction. This aligns with the "indefinitely extensible" quote.

  4.  **Formulate the Verdict:**
      *   Veblen is best read as describing a **Positional Signalling Arms Race**, which is a specific subset of costly signalling but distinct from the standard Grafen/Zahavi viability models.
      *   Why? Because the "quality" being signalled is *relative* wealth/status, not *absolute* viability. The "indefinitely extensible" nature confirms there is no stable equilibrium in the biological sense, but rather a dynamic escalation.
      *   Does signalling theory illuminate it? Yes, specifically the distinction between *signalling underlying quality* vs. *signalling rank in a hierarchy*.

  5.  **Address the Four Worries:**

      *   *Worry 1 (Relative vs. Absolute/Equilibrium):* Standard signalling (Grafen) seeks a Separating Equilibrium (honest signalling stabilizes). Veblen describes a Red Queen dynamic (running to stay in place). Signalling theory *does* cover this (e.g., war of attrition, escalation), but it's different from the Handicap Principle's typical application. The "indefinitely extensible" standard confirms it's a positional good.
      *   *Worry 2 (Receiver = Self):* Signalling theory usually requires a distinct receiver. However, "self-complacency" can be modeled as internalizing the audience. Or, the signal is dual-purpose: public for esteem, private for self-validation. The *evolutionary* logic requires public reception to drive the selection pressure, but the *psychological* mechanism includes the self. I should argue the public receiver is primary for the *system*, even if the individual feels the self-benefit.
      *   *Worry 3 (Vicarious Consumption):* Handicap logic requires the *signaller* to pay the cost to ensure honesty. If the husband pays but the wife displays, does it break? No, provided the cost is borne by the *unit* controlling the resources. In Veblen's patriarchal context, the husband controls the purse strings. The wife is an extension of his display. The cost is still a barrier to entry for the household.
      *   *Worry 4 (Meaning of "Evidence"):* It's primarily **Epistemic** (credibility to observer) but grounded in a **Causal** constraint (you can't waste what you don't have). It's not merely juridical. The "evidence" works because it is costly (causal), which makes it credible (epistemic).

