answer: |-
  This is the problem of **naturalized teleology**. You are asking for the success conditions of a theory that legitimizes purpose-talk in a universe devoid of conscious purpose-havers. Below is the specification you requested, structured as a set of desiderata, fault lines, and tension points, followed by an assessment of the theoretical landscape and the state of consensus.

  ### I. The Desiderata List: Specification for a Theory of Free-Floating Rationales

  To count as adequate, a theory must satisfy the following constraints. I have categorized them by **Non-Negotiable** (failure here renders the theory category mistakes or vitalism) and **Camp Preferences** (where legitimate philosophical disagreement exists).

  #### A. Non-Negotiable Requirements

  **1. The Normativity Constraint (The Error Condition)**
  *   **Requirement:** The theory must ground the possibility of *genuine error*, not merely statistical deviation or causal failure.
  *   **Specific Consideration:** If a shoot bends toward a switched-off lamp, it is not just "moving differently"; it is *failing* at what it is supposed to do. A rock falling and missing a target is not in error; a bacterium swimming away from sugar (given its mechanism) is. The theory must explain what sets the standard for success such that the system can violate it.
  *   **Why:** Without this, teleology collapses into mere description of regularities.

  **2. The Naturalism Constraint (Causal Closure)**
  *   **Requirement:** The rationale must not function as a spooky, non-physical cause. The explanation must be compatible with the causal closure of the physical world.
  *   **Specific Consideration:** The "goal" cannot pull the behavior from the future. The mechanism must be entirely proximate and physical, even if the *explanation* is distal.
  *   **Why:** To avoid vitalism or dualism.

  **3. The Distinction Constraint (Function vs. Utility)**
  *   **Requirement:** The theory must distinguish between what a trait *does* (its effects) and what it is *for* (its function).
  *   **Specific Consideration:** The heart pumps blood (function) and makes a thumping sound (effect). The thumping sound is useful for doctors diagnosing patients (utility), but the heart is not *for* making that sound.
  *   **Why:** To prevent pan-psychism or pan-teleology where every causal effect counts as a purpose.

  **4. The Ownership Constraint (The "Having" Condition)**
  *   **Requirement:** The theory must explain the difference between *there being a reason* for a trait (from the observer's view) and the *system having a reason* (from the system's view).
  *   **Specific Consideration:** There is a reason the earth orbits the sun (gravity/physics), but the earth does not *have* a reason to orbit. The bacterium *has* a reason to find sugar. The rationale must be intrinsic to the system's organization, not just extrinsic to the observer's interest.
  *   **Why:** This is the core of your "free-floating" worry. If the reason is only in the eye of the beholder, it isn't free-floating; it's projected.

  #### B. Camp Preferences (Contested Desiderata)

  **5. The Realism Preference (Strong vs. Weak)**
  *   **Requirement:** *Strong Realists* demand the purpose exists mind-independently. *Instrumentalists* are satisfied if the purpose is a necessary heuristic for prediction.
  *   **Status:** Preference. A theory can be adequate without satisfying Strong Realism, provided it admits its instrumentalism.

  **6. The History Preference (Etiological vs. Forward-Looking)**
  *   **Requirement:** *Etiological theorists* demand past selection history defines the rationale. *Forward-looking theorists* demand current contribution to a goal defines it.
  *   **Status:** Preference. (See "Settled vs. Contested" below).

  ---

  ### II. The Fault Lines and Tensions

  You identified specific fault lines. Here is how they map onto the specification.

  **1. Reason vs. Having a Reason**
  *   **The Problem:** This is the **Ownership Constraint**. Most theories solve "there is a reason" easily (evolutionary advantage). They fail to explain why that reason belongs to the bacterium.
  *   **The Tension:** To make the reason belong to the bacterium, we usually need to posit some internal state that *tracks* the reason. But if we posit an internal state, haven't we just smuggled in representation? If we don't, how is the reason "attached" to the bacterium rather than the evolutionary process?

  **2. Explanation vs. Redescription**
  *   **The Problem:** This is the **Causal Relevance** aspect of Naturalism.
  *   **The Tension:** If the rationale is just a summary of the physical laws governing the shoot, it is a redescription. For it to be an explanation, the "goal" must carve nature at a joint that physical laws alone miss (e.g., grouping disparate physical behaviors under one functional heading). The theory must show how the rationale captures a causal pattern that physical description obscures.

  **3. Selected Trait vs. Designed/Learned**
  *   **The Problem:** This is the **Distinction Constraint**.
  *   **The Tension:** A designed artifact (a thermostat) has a rationale imposed by a designer. A learned behavior has a rationale imposed by reinforcement history. A selected trait has a rationale imposed by differential reproduction. A unified theory must explain what makes these all "rationales" without collapsing the differences. If it collapses them, it cannot explain *novel* functions (traits doing something new before selection fixes them).

  **4. Function-Talk vs. Intentional Stance**
  *   **The Problem:** This is the **Realism Preference**.
  *   **The Tension:** Is "free-floating rationale" just Dennett's "Intentional Stance" applied to biology? If so, is the purpose *real*? If the theory admits the rationale is dependent on an interpreter taking the stance, it violates the **Ownership Constraint** (the system doesn't *have* the reason; we *lend* it the reason). If it insists the rationale is intrinsic, it risks violating **Naturalism** (where does this intrinsic normativity come from?).

  ---

  ### III. The Critical Tension: Normativity vs. Mindlessness

  This is the subset of demands that may be **incompatible**.

  *   **Demand A (Genuine Normativity):** For a system to make a *mistake*, there must be a standard it ought to meet but fails to.
  *   **Demand B (No Representing Mind):** There is no agent (internal or external) setting or holding that standard.

  **The Tension:** Normativity usually implies a "law" or a "rule." In human affairs, rules are set by minds or social agreements. In physics, there are only laws of *fact*, not laws of *ought*.
  *   If you ground the "ought" in **survival**, you face the "Why survive?" problem. Survival is just another physical state. Why is failing to survive a *mistake* rather than just an *end*?
  *   If you ground the "ought" in **internal goals**, you face the **Homunculus Problem**. Who inside the bacterium cares about the goal? If nothing cares, in what sense is it a goal?

  **Verdict:** This is the hardest knot. A theory that satisfies Genuine Normativity often sneaks in a mini-mind (a "control system" that 'cares' about error correction). A theory that rigorously excludes all mind-like properties often reduces normativity to statistical frequency (which fails the Error Condition). **Satisfying both simultaneously is the primary exclusionary filter.**

  ---

  ### IV. The Single Most Exclusionary Requirement

  **The Normativity Constraint (specifically, grounding error without a valuer).**

  This requirement does the most work at excluding candidate theories.
  *   It excludes **Crude Causal Accounts**: A machine breaking is just physics happening. It doesn't explain why the machine *shouldn't* break.
  *   It excludes **Purely Statistical Accounts**: Being an outlier isn't making a mistake.
  *   It excludes **Simple Utility Accounts**: Just because X is useful doesn't mean the system is *organized to achieve* X.

  To pass this filter, a theory must locate a "standard of correctness" within the physical organization of the system itself, without appealing to a little man inside reading the standard.

  ---

  ### V. Evaluation of Main Theory Families

  Here is how the major families fare against the specification, focusing on the criteria rather than a scorecard.

  **1. Crude Evolutionary Function-Talk ("It's for survival")**
  *   **Performance:** Fails the **Normativity Constraint**.
  *   **Why:** It conflates *success* with *correctness*. If a bacterium dies, it failed to survive, but did it make a *mistake*? Crude evolutionary talk explains why the trait exists, but not why this specific token behavior is erroneous *now*. It explains the presence of the mechanism, not the normative governance of the mechanism.

  **2. Etiological Accounts (Millikan, Neander, Papineau)**
  *   **Performance:** Strong on **Distinction** and **Naturalism**; struggles with **Ownership** in novel cases.
  *   **Why:** They define function by past selection history (the heart is for pumping because ancestors pumped). This successfully distinguishes function from accidental utility. However, it struggles with **Novelty**: If a trait is co-opted for a new use before selection has acted, does it have a rationale yet? Also, it risks making the rationale entirely historical (backward-looking), which makes it hard to see how the *current* system is guided by it.

  **3. Deflationary / Stance-Dependent Readings (Dennett, some pragmatists)**
  *   **Performance:** Solves **Naturalism** easily; fails **Ownership** (Strong Realism).
  *   **Why:** By treating the rationale as a tool for the *observer* (the Intentional Stance), they dissolve the metaphysical worry. There is no free-floating rationale; there is only a useful way of predicting the system. This satisfies the "no spooky mind" constraint but admits that the "reason" is not in the bacterium; it is in the relationship between the bacterium and the predictor. If you demand the rationale be intrinsic to the bacterium, this theory fails.

  **4. Cybernetic / Control Theory Accounts (Wiener, Rosenblueth, modern biosemiotics)**
  *   **Performance:** Strong on **Normativity**; risks the **Homunculus**.
  *   **Why:** These define purpose via negative feedback loops (error correction). A thermostat "seeks" a temperature because it acts to reduce the difference between current and target state. This grounds error physically. *However*, critics argue this is merely metaphorical unless the system *represents* the target. If it doesn't represent the target, is it really a "goal," or just a stable equilibrium? This sits right on the fault line of Representation.

  ---

  ### VI. Settled vs. Contested

  Do not accept the following as settled consensus. The field is fractured.

  **What is Settled:**
  1.  **Vitalism is false:** Teleological explanations do not require a non-physical life force.
  2.  **Indispensability:** Teleological language is indispensable in biology and cognitive science. We cannot do the science without "function," "goal," and "error."
  3.  **Forward-looking causation is false:** The future does not causally influence the past. Teleological explanations must be reconcilable with efficient causation.

  **What is Genuinely Contested:**
  1.  **The Metaphysical Status of Function:** Is function *real* (mind-independent property of the organism) or *ascribed* (dependent on an interpreter/selection history)? There is no consensus.
  2.  **The Role of History:** Must a trait have a *history of selection* to have a function? (Etiological view) Or can a trait have a function based on its *current contribution* to a system? (Forward-looking view). This is a live war in philosophy of biology.
  3.  **Representation vs. Mechanism:** Does genuine teleology require internal representation (a map of the goal)? Or can "blind" mechanisms (feedback loops) sustain genuine norms? This is the central debate in philosophy of mind and cognitive science (e.g., Hutto & Myin vs. Representationalists).
  4.  **Normativity:** Whether biological normativity is *sui generis* (a unique kind of natural norm) or reducible to conditional statements about survival/reproduction.

  **Summary of the Landscape:**
  You are looking for a theory that navigates the **Normativity/Naturalism** tension without collapsing into **Instrumentalism**. Most existing theories sacrifice one to save the other. Etiological accounts save Naturalism but make Normativity historical. Cybernetic accounts save Normativity but risk smuggling in Representation. Deflationary accounts save Naturalism but deny the rationale is free-floating (making it observer-dependent).

  The "free-floating rationale" remains a philosophical phantom: indispensable for practice, elusive for ontology.
