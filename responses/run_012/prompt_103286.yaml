answer: |-
  You are right to be dissatisfied with the standard reading. It is pedagogically convenient but philosophically sloppy. It turns *Antigone* into a allegory it was never intended to be and misrepresents Fuller's specific contribution to jurisprudence. If you want to use the play to teach the Hart-Fuller debate seriously, you have to invert the usual mapping.

  Here is a reading that respects the text of the play, the nuance of the jurisprudence, and the specific pedagogical goals you outlined.

  ### 1. Correcting the Fuller Map: Process, Not Substance

  Your instinct is correct: Antigone is not a Fullerian hero. Fuller's "natural law" is procedural. It is about the *craft* of lawmaking, not the *content* of divine command. Antigone appeals to the "unwritten and unfailing statutes of heaven." That is substantive natural law (akin to Aquinas or Finnis), not Fuller's internal morality of law.

  If you want to test Fuller against the play, you must apply the eight principles to **Creon**, not Antigone.

  *   **The First Seven Principles:** As you suspected, Creon's edict largely passes the formal tests. It is general (applies to all Thebans regarding the traitor), promulgated (announced by the Herald), prospective, clear, and feasible. This is the awkward moment for students who think "wicked law = bad procedure." Creon shows that a law can be procedurally sound but substantively horrific.
  *   **The Eighth Principle (Congruence):** This is where Creon fails, and this is where Fuller finds his footing. Congruence requires that official action matches the declared rule. Creon fails this in three ways:
      1.  **Arbitrary Enforcement:** In the scene with the Guard, Creon threatens torture and death based on suspicion rather than evidence. He accuses the Guard of bribery without proof. This undermines the integrity of the legal process.
      2.  **Responsiveness:** Fuller argues law is a reciprocal relationship between ruler and ruled. When Haemon reports that the city sympathizes with Antigone, Creon rejects this feedback. He treats the law as a one-way projection of authority rather than a shared enterprise.
      3.  **The Reversal:** You noted Creon relents too late. In Fullerian terms, this shows a breakdown in the stability of the system. A legal system that only corrects itself after catastrophic harm (the deaths of Antigone, Haemon, and Eurydice) has failed the requirement of constancy and congruence. The rules didn't guide the official; the official's hubris guided the rules until it was too late.

  **Pedagogical Move:** Tell your students: *"Antigone is not Fuller's lawyer. Creon is Fuller's case study."* Fuller argues that if you want to make wicked laws, you have to break the rules of lawmaking to do it effectively. Creon tries to rule by edict but fails to maintain the *administration* of law. He becomes a tyrant not just because his law is cruel, but because he severs the link between his rules and his actions.

  ### 2. Correcting the Hart Map: Validity vs. Obligation

  Hart is easier to place, but you need to push past the "separation of law and morals" slogan.

  *   **Validity:** Under Hart's rule of recognition, Creon is the Sovereign. He is the established authority. His edict is valid law. There is no ambiguity here. This forces the students to confront the hard positivist truth: Valid law can be morally abhorrent.
  *   **The Core and Penumbra:** You raised the question of whether Antigone's act (scattering dust) falls in the penumbra of "burying." While interesting, the play treats her confession as definitive. She claims the act. The conflict isn't linguistic; it's normative.
  *   **Civil Disobedience:** If the edict is valid law, Antigone is not arguing about validity; she is arguing about **obligation**. She is the archetypal conscientious objector. Hart distinguishes between "having a legal obligation" and "being morally obliged to obey." Antigone admits she breaks the law but denies she does wrong.
  *   **The Minimum Content of Natural Law:** Hart concedes that for a legal system to survive, it must protect certain basic truths (human vulnerability, approximate equality). Creon's edict violates the social fabric (family burial rites) that holds the city together. One could argue Creon's law violates Hart's "minimum content" because it destabilizes the very society the law is meant to protect. The tragedy proves the law was unsustainable.

  **Pedagogical Move:** Use Hart to frame the **Grudge Informer** problem. If a post-war court tried Creon (or the guards), would they say the edict was never law (Radbruch/Fuller) or that it was law but too wicked to obey (Hart)? Hart would say: *"It was law. That is why it was so dangerous. We must have the courage to say it was law, and therefore we must have the courage to make a new retroactive law to punish him."* Does the play support Hart's honesty or Fuller's elegance?

  ### 3. The Tragic Critique: What Jurisprudence Misses

  This is the most important part of your seminar. Hart and Fuller are both trying to **solve** a problem. They want a framework to decide hard cases and avoid tyranny. Sophocles is not interested in a solution; he is interested in a collision.

  *   **Particularity vs. Universality:** Modern natural law (and human rights discourse) relies on universal claims. Antigone does not. She is not defending "human rights." She is defending *her* brother against *this* king. She is cold to Ismene; she cares for the dead, not the living. She is a terrible liberal hero. This resists the Fullerian attempt to make law a universal moral enterprise. Antigone's morality is partial, tribal, and religious.
  *   **Political Necessity:** Creon is not a caricature. He is a new king after a civil war. His argument is that the state cannot survive if traitors are honored. This is a genuine political claim, not just evil positing. Hart would appreciate that Creon is trying to maintain order.
  *   **The Irreconcilable:** Hart and Fuller assume that if we get the jurisprudence right, we can avoid disaster. The play suggests that sometimes two valid normative orders (State Law and Divine/Family Duty) collide, and destruction is inevitable. There is no "rule of recognition" that ranks the gods above the king in a way the court can adjudicate.

  **Pedagogical Move:** Ask your students: *"Hart and Fuller want to prevent the tragedy. Sophocles says the tragedy is inherent in the human condition."* Jurisprudence seeks to rationalize conflict; tragedy dramatizes the cost of that conflict. If you apply the Radbruch formula (law loses validity if intolerably unjust), you solve the case but you miss the point of the play. The point is that Antigone *must* die for the conflict to be resolved. A legal theory that promises to avoid this is promising too much.

  ### 4. Proposed Seminar Structure

  Here is how I would sequence the discussion to avoid the clichés:

  1.  **The Validity Question (Hart):** Start with the edict. Is it law? Under Hart's criteria, yes. It comes from the sovereign, it is enforced. If students say "No, it's unjust," press them on who decides. If Antigone decides, is that anarchy? If the Judge decides, is that judicial supremacy?
  2.  **The Procedure Question (Fuller):** Shift to Creon's administration. Ignore the content of the edict for a moment. Look at how he treats the Guard, Haemon, and Teiresias. Does he maintain congruence? Does he listen? Argue that Creon fails Fuller's test not because he banned burial, but because he ruled without reciprocity.
  3.  **The Substance Question (Radbruch/Antigone):** Now bring in Antigone's appeal. Is this "higher law" or just "rival power"? If it's higher law, why doesn't it save her? If it's rival power, is it just force vs. force? This exposes the weakness of substantive natural law in a pluralistic society.
  4.  **The Tragic Limit:** Conclude by asking what the philosophers miss. Hart and Fuller treat law as a system to be managed. The play treats law as a force that destroys. Does jurisprudence need a theory of tragedy?

  ### 5. Where the Pairing is Defensible (and Where it Breaks)

  **Defensible:**
  *   Using Creon to test Fuller's 8 principles is robust. It moves Fuller away from "morality" and toward "governance."
  *   Using Antigone to test Hart's separation thesis is robust. It forces the distinction between "is law" and "ought to be obeyed."
  *   Using the ending to critique both. The fact that everyone dies suggests that neither "procedural legality" (Fuller) nor "clear validity" (Hart) is sufficient to prevent catastrophe when fundamental values clash.

  **Breaks:**
  *   **Antigone as Natural Lawyer:** As you noted, she is not arguing for the inner morality of law. She is arguing for a rival authority. Do not let students conflate "Divine Command" with "Fullerian Legality."
  *   **The Resolution:** Hart and Fuller are writing for a modern constitutional state with courts and appeals. Thebes is a monarchy. There is no court to hear Antigone's case. The debate assumes institutions that do not exist in the play. You must acknowledge that the play is about the *pre-legal* or *extra-legal* moment where the system is being founded or tested.

  ### Summary for the Seminar

  Tell your students: *"We usually teach this play as Morality vs. Law. That is wrong. It is Law vs. Law. Creon represents the Law of the City (Positivism/Order). Antigone represents the Law of the Gods (Substantive Natural Law/Piety). Hart helps us understand why Creon's command counts as law. Fuller helps us understand why Creon's administration fails. But Sophocles warns us that even if Creon followed all of Fuller's principles, he might still be wrong, and Antigone might still have to die."*

  This approach honors the complexity of the play, respects the technical precision of the jurisprudence, and avoids the boring "both sides have a point" conclusion. It leaves the students with the uncomfortable reality that legal theory cannot always save us from tragedy.
