answer: |-
  You have identified a foundational issue in formal epistemology and the logic of agency. You are correct that this is not merely a coding error but a structural consequence of how belief is standardly modeled in logic and computer science.

  There is no single word that captures the assumption, the problem, and the distinction you are seeking. Instead, the field distinguishes between the **principle** you imposed, the **phenomenon** it produces, and the **semantic framework** that enforces it.

  Here is the breakdown of the assumption, the resulting problems, the distinctions you requested, and the boundary between settled and contested views.

  ### 1. The Assumption: Deductive Closure
  The rule you implemented is formally known as the **Principle of Deductive Closure** (or simply **Closure**). In doxastic logic (the logic of belief), this is usually split into two specific axioms or rules:

  1.  **Closure under Implication:** If an agent believes $P$, and $P$ entails $Q$, the agent believes $Q$.
  2.  **Necessitation (or Inclusion of Logical Truths):** If $P$ is a logical truth, the agent believes $P$.

  In the standard **Possible Worlds Semantics** (developed by Jaakko Hintikka in the 1960s), belief is modeled as a relation between an agent and a set of "worlds" compatible with what they believe. A proposition is believed if it is true in *all* those compatible worlds. Because logical truths are true in *all* possible worlds, and logical consequences hold in all worlds where the premises hold, this semantics mathematically forces Closure.

  ### 2. The Problems: Omniscience and Triviality
  The two failures you observed have distinct names, though they stem from the same root.

  **A. The Problem of Logical Omniscience**
  This is the standard name for your first problem (knowing all logical truths). Because your characters believe all consequences, they effectively know all of mathematics and logic instantly.
  *   **Why it breaks the model:** It makes the agents descriptively unrealistic. No human can grasp all consequences of their beliefs.
  *   **Why it persists in weak logics:** As you noted, even if you switch to a weaker logic (e.g., intuitionistic or relevant logic), the agent becomes "omniscient" relative to *that* logic. They still know all the theorems of the system you use to compute the consequences.

  **B. Trivialization via Explosion**
  This is your second problem (inconsistent beliefs leading to believing everything). This relies on the **Principle of Explosion** (*Ex Contradictione Quodlibet*), which states that from a contradiction, anything follows ($A \land \neg A \vdash B$).
  *   **Why it breaks the model:** Humans frequently hold inconsistent beliefs (e.g., the **Preface Paradox**, where an author believes every claim in their book but also believes there is likely at least one error) without thereby believing that the moon is made of cheese.
  *   **The Collapse:** In classical logic, a belief set containing a contradiction becomes the "trivial set" (the set of all propositions). The agent loses all discriminatory power.

  ### 3. Distinguishing Neighbouring Notions
  You asked to distinguish Closure from related concepts. This is where the conceptual clarity lies.

  **Closure vs. Logical Omniscience**
  *   **Closure** is the *rule* (the mechanism).
  *   **Logical Omniscience** is the *result* (the property).
  *   *Distinction:* You can have Closure without full Omniscience if you restrict the logical truths included (dropping Necessitation), but in standard possible worlds models, they come together.

  **Closure vs. Bounded Rationality**
  *   **Closure** is a structural property of the belief set itself.
  *   **Bounded Rationality** (Herbert Simon) is a resource-based explanation for why Closure fails. It posits that agents *would* close their beliefs if they had infinite time and memory, but they don't.
  *   *Distinction:* Closure assumes ideal reasoning capacity. Bounded Rationality assumes reasoning is a computational process with costs. Your model assumes the former; your characters behave as if they have the latter.

  **Closure vs. Normative Consistency**
  *   **Closure** is often defended as a **Normative** ideal: "A rational agent *ought* to believe the consequences of their beliefs."
  *   **The Problem:** Your model treats this norm as a **Descriptive** fact. You are coding what agents *do* believe, not what they *should* believe.
  *   *Distinction:* If you treat Closure as a norm, the "error" is in the agent (they are irrational). If you treat it as a description (as in your story), the "error" is in the model (it doesn't match reality).

  **Closure vs. Implicit Belief**
  *   Defenders of Closure often argue that agents **Implicitly Believe** the consequences, even if they do not **Explicitly Believe** them (i.e., they haven't entertained the thought).
  *   *Distinction:* **Explicit belief** is what the agent is currently aware of or assenting to. **Implicit belief** is the set of propositions entailed by their explicit beliefs.
  *   *Why this may not save your model:* While "implicit belief" explains why an agent doesn't *say* they believe $Q$, it does not solve the **Explosion** problem. If an agent implicitly believes $A$ and $\neg A$, classical logic dictates they implicitly believe $B$. Calling it "implicit" does not stop the model from collapsing into triviality unless you change the underlying logic.

  ### 4. Settled vs. Contested
  It is vital to distinguish where the consensus lies and where debates are ongoing.

  **Settled Consensus**
  1.  **Standard Models Yield Omniscience:** It is universally accepted that standard Possible Worlds Semantics (Hintikka-style) and standard Hintikka-style Doxastic Logic (System KD45) entail Logical Omniscience and Explosion. This is a mathematical theorem, not a matter of opinion.
  2.  **Humans Violate Closure:** It is empirically settled that human agents do not satisfy Deductive Closure. We fail to see consequences, and we tolerate inconsistencies without trivializing our worldview.
  3.  **Closure is an Idealization:** There is consensus that using Deductive Closure is an *idealization* useful for modeling perfect agents (e.g., gods, idealized scientists, or certain software protocols) but is descriptively false for human psychology.

  **Genuinely Contested**
  1.  **The Best Formal Fix:** There is no consensus on how to modify the logic to avoid Omniscience while retaining usefulness. Competing approaches include:
      *   **Impossible Worlds:** Adding worlds where logical truths fail (contested because it complicates the semantics).
      *   **Awareness Structures:** Distinguishing between what is true in all belief-worlds and what the agent is technically "aware" of (contested regarding how to model the awareness function).
      *   **Syntactic Approaches:** Treating beliefs as a list of sentences rather than sets of worlds (contested because it loses the elegant semantics of possible worlds).
      *   **Paraconsistent Logic:** Changing the underlying logic so that contradictions do not explode (contested because it changes the meaning of "not" and "and," and some argue it masks the problem rather than solving it).
  2.  **Implicit Belief as a Solution:** Some philosophers argue that attributing "implicit belief" is sufficient for rationality models. Others argue that if an agent cannot derive the consequence even in principle, attributing implicit belief is misleading.
  3.  **The Normative Status:** While everyone agrees humans *aren't* closed, there is debate over whether rationality *requires* closure. Some argue rationality requires only that you not believe things you *know* to be contradictory, not that you must actively derive all consequences.

  ### Summary for Your Implementation
  You are encountering the **Problem of Logical Omniscience** and **Trivialization**, caused by enforcing **Deductive Closure** within a **Classical Possible Worlds** framework.

  *   **The Assumption:** That belief sets are closed under the consequence relation of the underlying logic.
  *   **The Temptation:** It makes the math tractable and aligns with a normative ideal of perfect rationality.
  *   **The Break:** It conflates *information content* with *cognitive grasp*.
  *   **The Fix:** To model human-like characters, you must decouple belief from logical consequence. In computer science, this is often done by moving from **Semantic Models** (possible worlds) to **Syntactic Models** (belief bases), where a character only believes the specific sentences stored in their "belief box," plus perhaps a very limited set of immediate inferences.

  Your intuition is correct: this is not a bug in your code, but a feature of the logical framework you inadvertently adopted.
