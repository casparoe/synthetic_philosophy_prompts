answer: |-
  The noise of the pub had swollen since last week, but the back room table was still scarred with the ring marks from our previous arguments. I nudged my pint aside to clear space for the notebook I hadn't opened.

  "You looked relieved when the vote was confirmed," Nadia said, leaning back. "The IUGS rejection. Like someone told you the bridge wasn't going to collapse after all."

  "I looked relieved because the stratigraphy was holding," I said. "But I've been thinking about what you said. About the spike."

  "The Golden Spike," she corrected. "Crawford Lake."

  "Right. GSSP," I said. "My worry last week was that we were slipping into a GSSA. A date agreed by committee. That's for the Precambrian, Nadia. When there's no fossil record to correlate, you just pick a number. But we *had* the varves. We had the plutonium-239 laminated in the sediment. We had a physical marker that correlates globally. To me, rejecting that because it's 'too political' ignores that the rock record *is* the marker. Choosing Crawford was discovery, not stipulation."

  "Was it?" Nadia picked up her glass. "You winnowed twelve sites down to one. You chose a lake in Canada over a coral reef in the Caribbean or a peat bog in Siberia. You chose the plutonium spike over the CO2 dip. That's not discovery, that's curation. If you'd picked 1610—the Orbis Spike—the marker would be a drop in carbon caused by the reforestation of the Americas after Indigenous populations were wiped out. That's a physical signal too. But it makes the epoch about conquest. 1950 makes it about technology. Picking the marker isn't neutral. It's a verdict on who's to blame."

  I paused. That was the bit that had kept me up. "If we pick 1610, are we doing stratigraphy or history?"

  "If the human impact is the stratigraphic signal, you can't separate them," she said. "But fine. Concede this: if you pick 1950, you aren't just picking a technological hubris narrative. You're anchoring the geological time scale to a lab convention."

  I blinked. "The radiocarbon zero."

  "Present is 1950," she said. "Because that's when the bomb tests messed up the carbon ratios. So the base of the proposed Anthropocene is the same arbitrary zero point physicists picked for dating organic matter. Does that bother you?"

  "It bothers me," I admitted. "Because it makes the boundary dependent on a methodological convention, not just a sedimentary event. It feels like we're defining Earth time by the calibration of a mass spectrometer."

  "Good," she said. "Then we agree it's messy. But here's where I need you to meet me. You kept insisting 'epoch' is a technical rank. That it has criteria. Duration, magnitude, correlation."

  "It does. It's not just a word for 'period'."

  "But is the insistence on that rank the whole disagreement?" Nadia asked. "Or is it that calling it an epoch forces a rigidity that history doesn't have? If you make it a formal unit, you need a single boundary. But the Industrial Revolution didn't hit India when it hit Britain. The Columbian Exchange didn't arrive everywhere in 1610. By demanding a Golden Spike, you're forcing a synchronous line onto an asynchronous process."

  I rubbed the condensation off my glass. "If we don't draw the line, we lose the utility of the term. It becomes a metaphor. 'Epoch' says this is in the rock. It's not a metaphor."

  "But if the only way to make it 'in the rock' is to ignore the asynchronous reality of empire and industry," Nadia said, "then you're preserving the integrity of the chart at the expense of the truth of the change."

  "I'm preserving the integrity of the method," I countered. "If we start picking boundaries based on moral narratives rather than correlatable signals, stratigraphy becomes literature."

  "And if you pick a signal that hides the moral narrative," she said, "stratigraphy becomes propaganda."

  We sat with that for a moment. The bartender clattered glasses nearby.

  "Okay," I said finally. "I'll concede the 1950 radiocarbon link. It's too convenient. It makes the boundary look like a artifact of our dating methods rather than the sediment itself. That weakens the GSSP argument."

  "And I'll concede," Nadia said, "that without a formal boundary, the term gets diluted. If everyone picks their own start date, it stops being a tool for science and becomes just another word for 'modern times'."

  "So we're stuck," I said. "No epoch, but the signal is real."

  "The signal is real," she agreed. "The name is the fight."

  I signaled for another round. "Next week," I said, "we're discussing sea-level rise. No philosophy."

  "We'll see," Nadia said.
