answer: |-
  ### Adjudication of the Exchange

  **Move (1) Ines:** *The criterion presupposes knowledge of forger psychology; "fleeing king" is a stock figure.*
  **Rating: Defensible.**
  **Justification:** Ines correctly identifies a major risk in applying the "criterion of embarrassment" to medieval texts. Medieval chroniclers often employed *topoi* (literary tropes) to convey moral or theological truths (e.g., a king flees to show God's judgment) rather than factual accuracy. However, it is not *clearly right* because not every detail is a trope; specific, granular details can still resist conventional shaping.

  **Move (2) Ravi:** *Conventions are borrowed; where details match no earlier model, convention cannot account for them.*
  **Rating: Defensible.**
  **Justification:** This is a standard heuristic in source criticism: uniqueness suggests provenance. If a detail is idiosyncratic rather than formulaic, it is less likely to be pure invention. However, the move relies on the assumption that we possess the relevant models to recognize the convention, which Ines immediately targets.

  **Move (3) Ines:** *'"Known to us" relies on absence of evidence in the surviving corpus... argument from silence.*
  **Rating: Clearly Right.**
  **Justification:** Ines identifies the fundamental problem of survival bias in medieval studies. The extant corpus is a tiny, non-random fraction of what once existed. Arguing that a detail is unique because no *surviving* text contains it is logically precarious; the chronicler's model may simply be lost.

  **Move (4) Ravi:** *We also have corroboration — a charter and a coin hoard that fit his account.*
  **Rating: Defensible.**
  **Justification:** Triangulating narrative with material culture and documentary evidence is the correct methodological instinct. However, the rating is not higher because the *degree* of fit is unspecified. A coin hoard indicates unrest, but not necessarily the specific battle narrative Ravi is defending.

  **Move (5) Ines:** *Only if they are independent... agreement between them is then one witness counted twice.*
  **Rating: Clearly Right.**
  **Justification:** This is a core principle of probabilistic reasoning and formal epistemology. If the charter, coin, and chronicle all derive from the same royal chancery or lost tradition (a "common cause"), their agreement does not multiply the probability of the claim. Given the 400-year gap, a shared tradition is highly plausible.

  **Move (6) Ravi:** *If a source may be used only once we have proved it owes nothing to any other, we can know nothing at all...*
  **Rating: Defensible.**
  **Justification:** Ravi correctly appeals to fallibilism. Historical knowledge is abductive (inference to the best explanation) and does not require Cartesian certainty or mathematically proven independence. However, this is a philosophical defense of the *discipline*, not a rebuttal of Ines's specific critique of *this evidence*. It justifies proceeding despite uncertainty, but does not make the uncertain evidence strong.

  ***

  ### What They Are Missing

  **Ravi** is missing a robust understanding of **medieval literary composition**. He treats the chronicle as a flawed record of facts, whereas Ines correctly hints it may be a work of moral construction where "facts" are subservient to narrative archetypes. He also underestimates the **genealogical dependence** of sources; in a small literate elite, documents often circulate and copy one another, making "corroboration" illusory.

  **Ines** is missing the **necessity of abductive reasoning**. Her standards, while logically sound, risk epistemic paralysis. History often proceeds by weighing the *best available* explanation, even when independence cannot be proven and survival bias is acknowledged. She treats the lack of certainty as a reason to suspend judgment, whereas Ravi treats it as a reason to assign a lower probability. She overlooks that "knowledge" in history is graded, not binary.

  ***

  ### Overall Verdict

  **Ines has the better of the argument.**

  While Ravi is right that historians must work with imperfect data (Move 6), Ines successfully demonstrates that his specific justifications for trusting *this* source are logically unsound. The source is 400 years removed from the events and demonstrably wrong on checkable points. In this context, Ravi's reliance on the "criterion of embarrassment" is methodologically weak (Move 1), his argument from uniqueness is undermined by survival bias (Move 3), and his corroboration fails without established independence (Move 5). Ines protects the integrity of the inference; Ravi is attempting to extract more certainty than the evidence can support.
