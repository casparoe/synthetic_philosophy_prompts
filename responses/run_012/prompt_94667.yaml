answer: |-
  Elena, a hospital billing clerk, identifies a system error crediting her $400 for an unworked shift and consciously elects to let it pass, relying on the known $500 audit threshold and a recurring server lag that masks her terminal ID to guarantee she will not be caught by any human or mechanical oversight. In her state of acute sleep deprivation, the decision to withhold the report registers phenomenologically as a neutral administrative tick-box rather than a moral choice; once the pay cycle closes, the specific memory of the volition fails to consolidate into long-term recall, fading without emotional residue or anxiety, and her behavior in subsequent weeks shows no deviation from her established patterns of honesty, leaving her character dispositions intact.

  Glaucon's challenge predicts Elena will commit the injustice, precisely because his argument in the *Republic* posits that no one is just willingly, but only under compulsion. By stripping away external punishment (via the audit threshold and server lag) and internal psychological punishment (via the dissociative lack of guilt or memory), the case removes the "compulsion" that usually forces agents toward justice. For Glaucon, justice is merely a social contract to avoid suffering harm; since Elena suffers no harm and gains a profit, rational self-interest dictates she keeps the money. The thought experiment successfully isolates the variable of consequence: if justice were truly choiceworthy for its own sake, she should refrain even when it offers no instrumental benefit and costs her nothing; Glaucon assumes she will not.

  The Platonic reply that injustice damages the soul can still argue that Elena's psyche is objectively disordered, analogous to a body harboring a cancer that presents no immediate symptoms. Plato distinguishes between *feeling* healthy and *being* healthy; the constraint that she feels no guilt or character change merely indicates the disease is asymptomatic, not absent. However, this reply struggles to survive the rigor of constraint (ii) because Plato's own evidence for psychic damage is usually the disintegration of agency and the onset of internal civil war (guilt, fear, compulsion). If Elena's soul remains functionally harmonious and her future dispositions remain honest, the claim that she is "damaged" risks becoming an unfalsifiable metaphysical assertion rather than a psychological observation, weakening the medical analogy Socrates relies on.

  A Kantian would argue Elena acted irrationally by making an exception for herself, violating the Categorical Imperative, while a rule-consequentialist would argue she undermined a rule (reporting errors) that generally maximizes welfare. However, neither answer addresses the question as Glaucon poses it. Glaucon asks whether justice is *choiceworthy for the agent's own happiness* (prudential rationality), not whether it is *morally obligatory* or *socially optimal*. The Kantian appeals to duty independent of happiness, and the consequentialist appeals to aggregate good, so both sidestep the core challenge of explaining why *Elena*, in this specific isolated instance, benefits from refraining. They explain why the act is wrong, but not why it is irrational for her to choose the profit when all consequences are nullified.

  Constraint (ii) is doing the load-bearing work in this design. It blocks the "internal consequences" argument that saves Platonism in standard cases. The control case is generated by removing constraint (ii) while keeping (i): Elena commits the injustice, remains undetected externally, but suffers guilt, anxiety, or a gradual corrosion of character. In that control case, justice becomes choiceworthy instrumentally, as a means to preserve peace of mind and moral integrity. By removing the internal price, constraint (ii) forces the debate to rest solely on whether the act *itself* has value, rather than whether it avoids psychological pain.

  A defender of the intrinsic-value view should attack the design by denying that constraint (ii) is coherent within a theory of human agency. They would argue that voluntary action is inherently self-constituting; to choose an injustice is to shape oneself into the kind of person who does injustice. If Elena's character and dispositions remain truly unchanged, the act cannot have been a full-blooded voluntary choice in the moral sense, but merely a reflex or glitch. By stipulating that the act leaves no trace on the agent, the thought experiment severs the necessary link between *praxis* (action) and *hexis* (state of character), rendering the scenario metaphysically impossible for a rational agent and thus failing to test the value of justice itself.
