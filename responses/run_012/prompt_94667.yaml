prompt: |-
  You are a philosopher working on Plato's ethics and on the question whether justice is choiceworthy for its own sake. Before you write, brainstorm what a case would need in order to isolate that question from every other consideration; then commit to one design, and show that it meets each constraint below rather than merely asserting that it does.

  Construct a thought experiment in which a normal adult commits an injustice that is genuinely tempting and genuinely profitable to her, while (i) her unaccountability depends on no magic, invisibility, gods, or afterlife, and (ii) she pays no internal price — no guilt, no self-reproach, no memory of the act, no fear of exposure, and no change to her character or future dispositions. The injustice must be small-scale and realistic, something a person in an ordinary life could actually do, and the scenario itself should be one paragraph.

  Then, in order: say what Glaucon's challenge predicts she will do, and why; say what the reply that injustice damages the soul can still say once constraint (ii) is in place, and whether it survives; say what a Kantian and a rule-consequentialist would say, and whether either answers the question as Glaucon poses it; identify which single constraint is doing the load-bearing work, and describe the control case you get by removing it; and finally say how a defender of the intrinsic-value view should attack your design, including by denying that constraint (ii) is even coherent. Each verdict should be argued from the theory's own commitments, not built into the setup of the case.
