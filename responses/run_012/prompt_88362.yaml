      *   **Structure:**
          *   Part 1: Reader is right (Intentional Fallacy, New Critics, Barthes).
          *   Part 2: But you need *some* intention to get a determinate text (Hypothetical Intentionalism).
          *   Part 3: Twist (Author's testimony is evidence but not decisive).
          *   Part 4: Wall (Four conflicting intentions: planned, actual, current, idealized).
          *   Part 5: Best Card (Categorial intentions: intending the *kind* of thing vs. specific meaning).
