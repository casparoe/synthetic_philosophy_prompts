          3.  Is the "categorial intention" point strong? Can hypothetical intentionalism absorb it?
          4.  Is this too academic ("inside baseball")? Where to cut?
          5.  Suggest an ending (no wishy-washy compromise).
      *   **Constraints:** No reading lists. Define non-draft terms. Readable on a train (clear, concise).

  2.  **Deconstruct Question 1: Hypothetical Intentionalism (HI):**
      *   *Concept:* HI (associated with Jerrold Levinson) argues meaning is what an idealized audience would attribute to the author based on public context + text. It's not the *actual* private mind (Actual Intentionalism) nor just *any* reader response (Reader Response/Anti-intentionalism).
      *   *User's grasp:* "meaning is what a reader who knows the conventions and the period would be justified in thinking I meant." -> This is pretty accurate.
      *   *Difference from "competent reader gets out of it":* Yes, there's a difference. Reader Response often says the text *becomes* meaning in the reading. HI says the text *encodes* a meaning based on a hypothetical author. HI still anchors meaning to an *authorial agency*, just not the biographical one. It's "what the author *could* have meant given the context," not "what the reader *feels*."
      *   *Verdict:* User has it right. It's distinct from pure reader response because it still seeks an *authorial* logic, even if constructed.

  3.  **Deconstruct Question 2: The Four Intentions:**
      *   *List:* 1. Planned (pre-writing), 2. Actual (sentence-by-sentence), 3. Current (retrospective), 4. Idealized (reader's construct).
      *   *Analysis:* This is a genuine phenomenological problem for the writer, not just philosophical nitpicking. It highlights the fragmentation of the "Author" entity.
      *   *Problem?* It's not a logical contradiction, but it *is* an experiential truth that undermines the idea of a singular "Authorial Voice." It supports the essay's tension. It's not a problem to solve, but a tension to exploit.
      *   *Verdict:* Keep it. It humanizes the theory. It shows why the author feels unstable in their own authority.

  4.  **Deconstruct Question 3: Categorial Intentions (The "Best Card"):**
      *   *Concept:* Intending the *genre/frame* (novel vs. memoir, unreliable vs. incompetent). This is often associated with Frank Farrell or just general philosophy of art (Wollheim).
      *   *Strength:* Very strong. You cannot identify a text as a *joke* vs. a *lie* without knowing the intention of the speaker regarding the *frame*.
      *   *Can HI absorb it?* HI says the *hypothetical* author intended the frame. But who decides the frame? Usually the paratext (cover, blurb, marketing) + the author's public stance. If the author says "This is a novel," HI accepts that as context. If the author says nothing, the reader hypothesizes.
      *   *Conflict:* The user worries HI shrugs and says "the hypothesis includes the category." This is true. HI *uses* categorial intentions as part of the context.
      *   *Nuance:* The user's point is that *actual* categorial intention is *constitutive*. Without the actual intention to write fiction, it's not fiction (it's a lie or a delusion). HI struggles here because HI relies on public evidence. If I privately write a diary but publish it as a novel, is it a novel? HI says yes (public evidence). Actual Intentionalism says no (private act).
      *   *Verdict:* It is the strongest argument for *why* the author matters. But HI *does* absorb it by treating the category as part of the public context. The user needs to pivot: The *actual* author decides the category, which then sets the rules for the *hypothetical* author. So Actual Intention wins on the frame, HI wins on the details. This is a viable synthesis, not a contradiction.

  5.  **Deconstruct Question 4: Accessibility ("Inside Baseball"):**
      *   *Risk:* Terms like "Hypothetical Intentionalism," "Intentional Fallacy," "Underdetermines."
