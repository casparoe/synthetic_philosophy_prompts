      *   *Part 4 Adjustment:* Frame the 4 intentions as the "cost" of writing, not just a philosophical puzzle.
      *   *Part 5 Adjustment:* Use the Categorial point to reclaim *some* authority, not total authority.

      *   *Self-Correction on Q3:* Wait, if HI says "what an idealized audience would attribute," and the audience sees "Novel" on the cover, they attribute " intending a novel." So HI *does* absorb it. The user's worry is valid. *However*, the user's point is that without the *actual* intention, the cover is a lie. If I write a diary and label it "Novel," is it a novel? HI says yes (public context). Actual Intentionalism says no. The user's point is that *some* actual intention is required for the text to exist as art. I should validate this worry but suggest a way through: The Actual Author sets the *conditions of play*, the Hypothetical Author plays the game.

