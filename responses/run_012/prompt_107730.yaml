  ### The Game: Two Food Trucks, Three Locations

  **Framing:** Two competing food trucks (Truck A and Truck B) independently choose a location for the day: **North (N)**, **Central (C)**, or **South (S)**. Payoffs represent estimated daily customers (in hundreds). Truck A chooses the row; Truck B chooses the column.

  | Truck A \ Truck B | North (n) | Central (c) | South (s) |
  | :--- | :---: | :---: | :---: |
  | **North (N)** | 4, 2 | 0, 1 | 5, 1 |
  | **Central (C)** | 1, 2 | 1, 3 | 1, 1 |
  | **South (S)** | 0, 2 | 4, 1 | 4, 3 |

  ---

  ### Verification of Specifications

  **1. No Pure Strategy Strictly Dominates Another (Initial Round)**
  *   **Truck A:**
      *   $N$ vs $C$: $4>1$ but $0<1$. No dominance.
      *   $S$ vs $C$: $0<1$ but $4>1$. No dominance.
      *   $N$ vs $S$: $4>0$ but $0<4$. No dominance.
  *   **Truck B:**
      *   $n$ vs $c$: $2>1$ (vs N) but $2<3$ (vs C). No dominance.
      *   $n$ vs $s$: $2>1$ (vs N) but $2<3$ (vs S). No dominance.
      *   $c$ vs $s$: $1=1$ (vs N) but $3>1$ (vs C). No dominance.
  *   **Result:** Iterated Elimination of *Pure* Dominated Strategies (IEDS-Pure) eliminates **nothing** in the first round and stalls immediately. All 9 outcomes survive.

  **2. A Pure Strategy is Strictly Dominated by a Mixed Strategy**
  *   **Truck A's Strategy $C$** is strictly dominated by a 50-50 mixture of $N$ and $S$ ($\sigma = 0.5N + 0.5S$).
  *   **Verification:**
      *   Against $n$: $0.5(4) + 0.5(0) = \mathbf{2} > 1$ (Payoff of $C$).
      *   Against $c$: $0.5(0) + 0.5(4) = \mathbf{2} > 1$ (Payoff of $C$).
      *   Against $s$: $0.5(5) + 0.5(4) = \mathbf{4.5} > 1$ (Payoff of $C$).
  *   **Result:** Since $C$ is strictly dominated by a mixed strategy, Iterated Elimination of *Mixed* Dominated Strategies (IEDS-Mixed) eliminates $C$ in the very first round.

  **3. The Dominated Strategy is Not a Best Response (Rationalizability)**
  *   Because $C$ is strictly dominated by a mixture of $N$ and $S$, the expected payoff of playing $C$ is strictly lower than playing that mixture against *any* probability distribution Truck B might hold over $\{n, c, s\}$.
  *   Therefore, $C$ is never a best response to any belief. It is not rationalizable.
  *   **Equilibrium:** The game has a **unique Nash Equilibrium at (N, n)**.
      *   Truck A plays $N$ (4) vs $n$; switching to $C$ yields 1, $S$ yields 0.
      *   Truck B plays $n$ (2) vs $N$; switching to $c$ yields 1, $s$ yields 1.
  *   Both procedures leave this equilibrium standing, but IEDS-Pure falsely retains $C$ as a viable "rational" choice, while IEDS-Mixed correctly discards it.

  ---

  ### Step-by-Step Elimination Procedures

  **Procedure 1: IEDS-Pure (Dominators must be Pure)**
  1.  **Round 1:** Check for pure dominance. As verified above, no strategy for A or B is strictly dominated by any other *pure* strategy.
  2.  **Stop:** No strategies are removed.
  3.  **Prediction:** The set of surviving strategies is $\{N, C, S\} \times \{n, c, s\}$. The procedure fails to narrow the prediction beyond the raw game matrix.

  **Procedure 2: IEDS-Mixed (Dominators can be Mixed)**
  1.  **Round 1:**
      *   **Truck A:** Strategy $C$ is strictly dominated by $0.5N + 0.5S$. **Eliminate $C$.**
      *   **Truck B:** No strategy is dominated (even by mixes) given A still has $\{N, C, S\}$.
      *   *Remaining Game:* A has $\{N, S\}$; B has $\{n, c, s\}$.
  2.  **Round 2:**
      *   **Truck B:** Facing only $N$ and $S$, compare $n, c, s$.
          *   Payoffs for $n$: (2 vs N, 2 vs S).
          *   Payoffs for $c$: (1 vs N, 1 vs S).
          *   Payoffs for $s$: (1 vs N, 3 vs S).
          *   Strategy $n$ strictly dominates $c$ ($2>1$ and $2>1$). **Eliminate $c$.**
      *   *Remaining Game:* A has $\{N, S\}$; B has $\{n, s\}$.
  3.  **Round 3:**
      *   **Truck A:** Facing only $n$ and $s$, compare $N$ and $S$.
          *   Payoffs for $N$: (4 vs n, 5 vs s).
          *   Payoffs for $S$: (0 vs n, 4 vs s).
          *   Strategy $N$ strictly dominates $S$ ($4>0$ and $5>4$). **Eliminate $S$.**
      *   *Remaining Game:* A has $\{N\}$; B has $\{n, s\}$.
  4.  **Round 4:**
      *   **Truck B:** Facing only $N$, compare $n$ and $s$.
          *   Payoff for $n$: 2. Payoff for $s$: 1.
          *   **Eliminate $s$.**
  5.  **Result:** Unique survival $\{N\} \times \{n\}$.

  **Where they part ways:** The procedures diverge immediately in Round 1. IEDS-Mixed identifies $C$ as irrational because it is "in the middle" of two better options, while IEDS-Pure cannot see this convexity.

  ---

  ### Structural Feature and The "Nudge"

  **The Structural Feature:**
  The payoff vector for strategy $C$ lies strictly **inside the convex hull** of the payoff vectors for $N$ and $S$. Geometrically, $C$ is "below the line segment" connecting $N$ and $S$ in payoff space. Pure dominance only checks if one vertex is higher than another; mixed dominance checks if a vertex is below the span of others.

  **The Nudge:**
  Suppose we change Truck A's payoff for $(C, c)$ from **1 to 2**.
  *   **New Check:** The mixture $0.5N + 0.5S$ yields $0.5(0) + 0.5(4) = 2$ against $c$. Strategy $C$ now yields 2.
  *   **Effect:** The strict inequality becomes a tie ($2 \ngtr 2$). $C$ is no longer *strictly* dominated by the mixture.
  *   **Agreement:** In this nudged game, IEDS-Pure eliminates nothing (unchanged). IEDS-Mixed (requiring strict dominance) also eliminates nothing in Round 1. **The two procedures now agree** (both stall), because the convexity feature that allowed the mixture to strictly outperform $C$ has been broken.

  ---

  ### Objection and Weak Dominance

  **Strongest Objection (Pure-Dominance Defense):**
  "A player commits to a single action, not a lottery. Before the game begins, Truck A cannot force itself to randomize 50-50 between North and South. Therefore, a strategy should only be deemed irrational if a specific, playable alternative (a pure strategy) beats it. Using mixed strategies as dominators tests against a 'move' the player cannot actually make."

  **Rebuttal:**
  Rationalizability is not about commitment devices; it is about **justifiability**. A strategy is rationalizable only if there exists *some* belief about the opponent for which it is a best response. If a strategy is strictly dominated by a mixture, mathematics dictates it is *never* a best response to *any* belief. Playing $C$ is therefore unjustifiable regardless of whether the dominating mixture is "playable." The mixture is merely a proof tool to demonstrate that no coherent belief supports $C$.

  **Weak vs. Strict Dominance:**
  If we ran the elimination on the **original example** using *weak* rather than strict dominance:
  *   **Outcome:** The result would not change. Since $C$ is *strictly* dominated by the mixture, it is also *weakly* dominated. It would still be eliminated in Round 1.
  *   **Procedural Risk:** The critical difference is that Strict Dominance (pure or mixed) is **order-independent** (the set of survivors is unique). Weak Dominance is **order-dependent**; eliminating a weakly dominated strategy can remove the dominator for another strategy, changing the final set of survivors. While both procedures yield $(N, n)$ here, relying on weak dominance generally sacrifices the robustness of the prediction.
