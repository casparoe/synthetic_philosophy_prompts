      (Drafting content):
      The clinical practices you describe do not strictly presuppose a higher-order theory (HOT) of consciousness, though they fit comfortably with one. What the clinic strictly presupposes is an *access* criterion operationalized as reportability. In anesthesiology and disorders of consciousness (DoC), a state counts as conscious if and only if it is available for voluntary control or subsequent verbal recall. This is a pragmatic functionalism: consciousness is treated as a capacity for interaction, not a private phenomenological fact. A HOT theorist would say this access is mediated by higher-order representations, and a Global Workspace theorist would say it involves broadcasting to prefrontal systems. The clinic remains agnostic on the mechanism; it only demands the output. Therefore, the practice is not committed to HOT specifically, but rather to the necessary condition that consciousness entails availability. It fits HOT because HOT predicts that without higher-order access, there is no conscious state to report. But the practice would work equally well with a pure Global Workspace view where availability suffices without distinct higher-order thoughts.

      The inconsistency arises when the field defines consciousness by reportability while simultaneously hunting for consciousness that cannot be reported behaviorally. The standard definition of awareness during surgery is explicit recall. If a patient cannot recall, they are clinically unconscious. Yet, the motivation for covert consciousness research is the fear that this definition is false—that patients might be conscious without the ability to report. When fMRI detects command-following in a "vegetative" patient, it is celebrated as hidden consciousness. But note: this is still reportability, merely mediated by blood-oxygen-level signals rather than muscle movement. The true tension lies in the unreportable remainder. If we admit the possibility of consciousness without any route to availability (no motor command, no recall, no fMRI signal), then the clinical operationalization is ethically dangerous. The field wants to have it both ways: it uses reportability as the gold standard for diagnosis and monitoring, yet its research agenda is driven by the suspicion that the gold standard is invalid. This is not just theoretical nitpicking; it is the difference between a patient being treated as insensate matter or a suffering subject.

      If we took a first-order theory (FOT) seriously at the bedside, the implications would be radical. FOT holds that a mental state is conscious if it represents the world accurately, regardless of whether the subject has a higher-order thought about that state or can access it for report. Under FOT, a patient could be in pain without knowing they are in pain, or without being able to tell anyone. Consequently, depth-of-anesthesia monitors would need to change their target. Currently, they aim to prevent awareness and recall—higher-order disruptions. An FOT-informed monitor would target the first-order sensory processing itself. We would need to ensure the nociceptive signals are blocked or dampened at the source, not just that the patient won't remember them. The distinction between "awareness" and "sensory processing" would collapse for ethical purposes.

      In the DoC ward, an FOT framework would dismantle the vegetative state category as currently used. If first-order phenomenology is possible without voluntary motor output, then the absence of command-following is no longer evidence of absent experience. We would have to presume consciousness in any patient with intact sensory cortices, regardless of their ability to broadcast that information globally. The burden of proof would shift: instead of requiring a patient to prove they are conscious via response, clinicians would have to prove the absence of first-order representation before withholding analgesia or assuming insensibility. This would likely increase the administration of anesthetics and analgesics in borderline cases, prioritizing the possibility of raw feeling over the certainty of behavioral response. The clinic currently runs on a theory of access because access is manageable. Taking FOT seriously means managing the unmanageable: the private, inaccessible qualia that might be screaming silently in the operating room.

