  **I. Harm**

  The engineer adjusted valve four-nine.
  She knew the heat would flow into the garden.
  She said she did not mind the garden's fate.
  She said her only duty was the rack.
  The steam moved through the pipes as designed.
  The servers stayed within the safe green zone.
  The air grew thick above the garden beds.
  She did not look to see what happened there.
  The heat destroyed every leaf and stem.
  She closed the log and walked away from work.

  **II. Benefit**

  The engineer adjusted valve four-nine.
  She knew the heat would flow into the garden.
  She said she did not mind the garden's fate.
  She said her only duty was the rack.
  The steam moved through the pipes as designed.
  The servers stayed within the safe green zone.
  The air grew thick above the garden beds.
  She did not look to see what happened there.
  The heat restored every leaf and stem.
  She closed the log and walked away from work.

  **Verdict**

  We read her mind as acting intentionally.
  We read her mind as not acting intentionally.

  **Closing**

  Is the stain on her will or on our sight?
  Does blame make the act, or merely name it?
  We leave the question hanging in the air.
