  My friend and I spent about two hours last night arguing about the Nash bargaining solution vs the Kalai–Smorodinsky one — he's all in on Nash, I think KS is the more defensible solution, and we mostly talked past eachother. Write the joint statement we should have produced instead of shouting: a numbered list of claims we can both sign (what a bargaining solution is even for, what each axiom actually buys you, where we agree about independence of irrelevant alternatives and individual monotonicity, what the Rubinstein alternating-offers story does and doesn't settle), then our remaining disagreements with each side's own view stated in wording that side would accept, then the cruxes — I think one is whether IIA or monotonicity is the more basic requirement, and another is whether an axiomatic solution needs a non-cooperative foundation at all — and for each crux the case or argument we'd both agree bears on it, with each of our predictions written down in advance. Format it as a numbered agreed-claims section and then a disagreements table.

  One case we couldn't resolve, and it's bugging me: disagreement point at (0,0), feasible set the convex hull of (0,0), (1,0), (0.5,0.8) and (0,1). We couldn't even agree on which of the two solutions that case favors, or what each of us should predict about it, so put it in the table.

  Also he kept saying KS doesn't even pick out a unique answer once you go past two players, which I think is either false or beside the point — if part of our fight was just about words, or about a theorem we're each half remembering, say which part.
