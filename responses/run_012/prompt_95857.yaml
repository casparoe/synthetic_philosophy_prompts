  # DECISION TREE: THE DOGMATISM PARADOX

  **ROOT:** Accept premises: (1) $S$ knows $P$; (2) $S$ knows ($P \to$ Evidence $E$ is misleading).

  **NODE 1 (Defeater Type):** Does $E$ directly support $\neg P$, or support that $S$'s basis for $P$ is unreliable?
  *   **Left:** Supports $\neg P$ (Rebutting).
  *   **Right:** Supports Unreliable Basis (Undercutting).

  **NODE 2 (Perceptual Doctrine):** Does justification for $P$ require antecedent evidence that your faculties are reliable?
  *   **Left:** Yes (Mediate Justification).
  *   **Right:** No (Immediate/Dogmatic Justification).
      *   *(Note: Path 1-Left + 2-Right is flagged as **Unoccupied Leaf A**; immediate justification is motivated by undercutting cases, not rebutting ones.)*

  **NODE 3 (Binary vs. Graded):** Is the epistemic state at issue an all-or-nothing status or a level of credence?
  *   **Left:** All-or-Nothing (Binary).
  *   **Right:** Level of Credence (Graded).

  **NODE 4 (Belief vs. Deliberation):** Is the norm in question about what one may *believe* or what one may *do* (inquire/act)?
  *   **Left:** What one may Believe.
  *   **Right:** What one may Do.

  **NODE 5 (Closure):** Does knowledge transmit across the known entailment to "$E$ is misleading"?
  *   **Left:** Yes (Closure Holds).
  *   **Right:** No (Closure Fails).

  **NODE 6 (Entitlement):** If one knows $E$ is misleading, does one license disregarding $E$?
  *   **Left:** Yes (Disregard Licensed).
  *   **Right:** No (Disregard Unlicensed).
      *   *(Reachable only if Node 5 is Left)*

  **NODE 7 (Context):** If Closure fails, is it because the principle is false or because knowledge standards shift?
  *   **Left:** Principle is False.
  *   **Right:** Standards Shift (Contextualism).
      *   *(Reachable only if Node 5 is Right)*

  **NODE 8 (Hinge):** Is $P$ treated as an empirical result or a framework presupposition?
  *   **Left:** Empirical Result.
  *   **Right:** Framework Presupposition.
      *   *(Reachable primarily if Node 2 is Right)*

  **NODE 9 (Updating):** If credence is graded, does rationality require lowering confidence in $P$ upon encountering $E$?
  *   **Left:** Yes (Conditionalization).
  *   **Right:** No (Conservatism).
      *   *(Reachable only if Node 3 is Right)*

  **NODE 10 (Skepticism):** Is the solution to deny we know $P$, or to deny the paradoxical consequence?
  *   **Left:** Deny We Know $P$ (Skeptical).
  *   **Right:** Deny Consequence (Anti-Skeptical).
      *   *(Reachable if Node 6 is Left)*

