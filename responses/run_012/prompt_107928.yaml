answer: |-
  This is a precise and fruitful suspicion. The claim that Darwin and Turing executed the "same manoeuvre" is a staple of modern materialist philosophy, often summarized as "competence without comprehension." However, treating them as identical risks blurring the specific philosophical work each performs.

  Here is an analysis designed for your reading group, structured to separate the steelman of the conflation from the scrutiny of the disanalogy, followed by the test case and a map of the contested terrain.

  ### 1. Steelmanning the Conflation: Why they look like one move

  To give the conflation its due: both Darwin and Turing are attacking **homuncular explanations**.

  In the pre-Darwinian view, the complexity of an eye implies a prior plan; in the pre-Turing view, the complexity of a calculation implies a prior understander. Both arguments rely on a **generate-and-test** architecture.
  *   **Darwin:** Blind variation (mutation) + Retention (selection) = Adaptation.
  *   **Turing:** Symbol manipulation (syntax) + Rule following (algorithm) = Intelligence (semantics).

  The unifying insight is that **order can emerge from chaos without a prior ordering mind.** If you accept this steelman, the "inversion" is identical: both men show that the *effect* (design/thinking) does not require the *cause* (designer/thinker) to possess the properties of the effect. The designer need not be wise to create wisdom; the machine need not understand to compute.

  **The Cost of Accepting this Unity:**
  To maintain that this is a single move, you must treat "design" and "thinking" as functionally identical categories—i.e., both are merely input-output mappings. If you accept this, you commit to a strong **functionalism**: the internal constitution of the system (flesh vs. silicon, lineage vs. lifetime) is irrelevant; only the organizational structure matters. The cost is that you must ignore the ontological difference between *survival* (Darwin) and *meaning* (Turing).

  ### 2. Scrutinizing the Contrast: Causal vs. Epistemic Inversion

  Your intuition holds up under scrutiny, but it requires sharpening. The inversions are not identical because they target different problems.

  **Darwin: The Causal/Explanatory Inversion**
  *   **The Move:** You correctly identify this as an inversion of the order of explanation. But it is also an inversion of **ontology**.
  *   **The Commitment:** Darwin does not just say "we don't need a designer to explain the eye." He says "the eye is not designed in the way you thought."
  *   **Design at the Top or Drained?** This is the crux. Darwin drains intentionality from the *process*, but he retains **teleonomy** at the *product*. An organism really does have functions; the heart really is *for* pumping. However, this "for-ness" is derived, not intrinsic. It is a "free-floating rationale" (to use a later phrase). So, design is not left intact at the top; it is **naturalized**. It is real, but it is not mental.
  *   **Classification:** This is a **Metaphysical Thesis** grounded in an **Empirical Claim**. The empirical claim is that variation and selection occur. The metaphysical thesis is that these mechanisms are sufficient to exhaust the explanation of biological form, leaving no remainder for a "vital force" or divine plan.

  **Turing: The Epistemic/Operational Inversion**
  *   **The Move:** This is indeed a shift in criteria. The "Imitation Game" replaces the question "Can machines think?" with "Can machines do what a thinker does?"
  *   **The Commitment:** Turing bypasses the causal history of the mind (consciousness, qualia, biology) and focuses on the **capacity**.
  *   **Thinking Intact or Redefined?** Unlike Darwin, who preserved the reality of the function (adaptation) while changing its cause, Turing is often read as **redefining** the function. If thinking is defined by performance, then "thinking" no longer implies an inner life. However, Turing himself seemed to suggest that if the distinction makes no difference in practice, it is meaningless. This is a **methodological recommendation** that smuggles in a **Metaphysical Thesis** (Computationalism): that thinking *just is* symbol manipulation.
  *   **Classification:** Primarily a **Methodological Recommendation** (use the Imitation Game) that functions as a **Metaphysical Thesis** (substrate independence of mind).

  **The Disanalogy:**
  Darwin explains a **natural kind** (adaptation) by revealing its hidden history. Turing defines a **disputed property** (thinking) by stipulating a public test. Darwin tells you what design *is* (cumulative selection). Turing tells you how to *recognize* thinking (behavioral indistinguishability), leaving open (or dismissing) what thinking *is*.

  ### 3. The Test Case: The Immune System

  The immune system is an excellent diagnostic case, superior to alternatives like crystal formation (too passive) or language (too entangled with Turingian concepts).

  **The Phenomenon:**
  The immune system generates random receptor variations (V(D)J recombination), selects those that bind to antigens, and clones them (memory). It achieves specific adaptation to threats no individual cell has "seen" before.

  **Which Inversion Applies?**
  *   **Darwinian:** **Yes, unequivocally.** This is somatic evolution. It is a blind variation and selection process occurring within a lifetime. It fits the Darwinian inversion perfectly: competence (specific immunity) without comprehension (no cell knows the whole strategy).
  *   **Turingian:** **No, or only metaphorically.** The immune system does not manipulate symbols according to syntactic rules. It relies on chemical affinity (lock and key), not digital computation. While some immunologists speak of "cognitive immunology," this is an analogy. There is no evidence the immune system performs general-purpose computation or language-like operations.

  **Do the Two Come Apart Here?**
  **Yes.** This is the critical finding for your group.
  The immune system demonstrates that you can have the **Darwinian Inversion** (competence from blind selection) without the **Turingian Inversion** (competence from symbol manipulation).
  *   If the "single manoeuvre" thesis were true, any system exhibiting Darwinian competence should be a candidate for Turingian competence. The immune system shows this is false.
  *   This suggests the "Darwinian move" is about **selection algorithms** (which can run on chemistry, genes, or ideas).
  *   The "Turingian move" is about **representation and syntax** (which requires a specific kind of discrete state machinery).

  **Implication for the Darwinian Inversion:**
  This case proves that the Darwinian inversion is **not** essentially about populations over deep time (lineages). It is about the **logic of selection**. If selection occurs, adaptation occurs, regardless of the substrate or timescale. The immune system confirms that Darwin's insight is algorithmic, not merely genealogical.

  ### 4. Summary of Commitments

  | Feature | Darwinian Inversion | Turingian Inversion |
  | :--- | :--- | :--- |
  | **Primary Vector** | Causal / Explanatory | Epistemic / Definitional |
  | **Status of Phenomenon** | Naturalized (Teleonomy) | Operationalized (Functionalism) |
  | **Intentionality** | Drained from process, derived in product | Bracketed (irrelevant) or Redefined |
  | **Classification** | Metaphysical + Empirical | Methodological + Metaphysical |
  | **Test Case (Immune)** | **Fits** (Somatic Selection) | **Fails** (No Syntax/Symbols) |

  ### 5. Settled vs. Contested (For the Reading Group)

  To facilitate discussion, distinguish these points clearly:

  **Settled (General Consensus):**
  1.  **Anti-Homunculus:** Both men successfully displaced the need for a "little man inside" (designer or conscious understander) to explain complex outcomes.
  2.  **Algorithmic Nature:** Both processes are understood as algorithmic (iterative steps leading to a result).
  3.  **Immune System:** It is broadly accepted that the immune system operates via a selectionist mechanism analogous to natural selection (clonal selection theory).

  **Contested (Where your reconstruction may face resistance):**
  1.  **The Status of "Design":** Biologists generally accept "teleonomy" (apparent design), but philosophers dispute whether this is "real" design or merely a useful metaphor. Some argue Darwin drained design *everywhere*, leaving only causal push-pull.
  2.  **Turing's Intent:** Did Turing intend to *define* thinking as behavior (Behaviorism), or did he believe computation would eventually *instantiate* real thinking (Functionalism/AI)? Your reading leans toward the former (redefinition); many AI researchers argue for the latter (realization).
  3.  **The Unity Thesis:** Many cognitive scientists (e.g., Dennett) argue strongly for the "single manoeuvre" view, claiming that human thinking *is* a Darwinian process of neural selection. Your group should test whether the Immune System case refutes this, or if "neural Darwinism" bridges the gap.
  4.  **Immune "Cognition":** While the selection mechanism is settled, calling it "cognition" is contested. If you accept the Turingian inversion, does the immune system's ability to discriminate self/non-self count as a primitive form of "thinking"? If yes, the two inversions converge again. If no, they remain distinct.

  ### Recommendation for the Session

  Use the Immune System to break the symmetry. Ask the group: *If the immune system is Darwinian but not Turingian, what is the necessary ingredient that Turing added?*

  The answer should point toward **representation**. Darwin explains how to get **fit** without a designer. Turing explains how to get **meaning** (or the simulation thereof) without a mind. The immune system gets fit, but it does not represent the threat; it merely reacts to it. This confirms your suspicion: the moves are distinct. Darwin naturalizes **function**; Turing operationalizes **semantics**. Conflating them risks assuming that all function is semantic, or that all semantics is merely functional.
