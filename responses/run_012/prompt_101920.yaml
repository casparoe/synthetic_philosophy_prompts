prompt: |-
  Ok so this is a weird question from someone who's never taken a philosophy class in his life. I got made a team lead at work about four months ago, so now I'm the one doing performance reviews and breaking up fights between people on my team, and it has turned out to be way harder than I expected. Here's the thing that keeps happening and I can't find a word for it.

  Take one specific fact about a situation — the person did it on purpose, or what they did caused someone pain, or they told the truth even when it cost them. My gut says these things are obviously good or obviously bad. On purpose = worse. Caused pain = bad. Told the truth = good. Fine, easy. But then I keep hitting cases where the exact same fact is doing the opposite work, and not because something else is outweighing it. One person on my team comes to me and admits a mistake a coworker made, and I think, that took guts. Another person comes to me and admits a mistake a coworker made, and the very same truth-telling is what makes me trust them less, because of what it says about them that they couldn't keep their mouth shut. A guy on my team is intense and blows up when he thinks somebody's being picked on, and the intensity is exactly why I'm glad he's there; the same intensity in a different week is why I'm writing him up. When my mom had her hip replaced the pain was the whole point of it, the thing that was good about the situation. When my kid got hit in the face at school the pain was the entire reason it was bad.

  What's bugging me is that this isn't "context matters" in the boring sense. I get that you have to weigh stuff against other stuff. What I mean is the same single feature, all by itself, seems to flip from counting for to counting against depending on what else is going on, and I can't state any rule in advance for which way it'll point. I also notice it happening outside of moral stuff. "Lots of people believe it" is a reason to think something's true when those people are all in a position to know, and a reason to think it's false when they've all just been copying each other. Same feature, opposite direction.

  So does this have a name? I feel like people have definately argued about this for centuries and I just don't know what to google. I don't want a reading list, I want to understand the shape of the thing. If there is a name, tell me what it actually claims and, more importantly, what it's not. Is it the same as saying morality is relative? Same as saying rules have exceptions? Same as saying some reasons are stronger than others? Because none of those feel like what I'm describing — I already knew all three of those and they didn't cover it. Is there a name for the opposite view too, the one that says if a feature counts for something in one case then it has to count for it in every case? And does what I'm describing apply to reasons in general, reasons to believe stuff as well as reasons to do stuff, or is it specifically a claim about ethics? If there's no established word for it, coin one, define it, and tell me about the cases on the edge where I wouldn't be able to say either way.
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the User's Query:**
      *   **Context:** New team lead, dealing with performance reviews, conflict resolution.
      *   **Core Phenomenon:** A specific feature/fact of a situation (e.g., "did it on purpose," "caused pain," "told the truth," "intensity," "pain," "consensus") sometimes counts *for* a judgment (good/reason to believe) and sometimes counts *against* it (bad/reason to doubt), without merely being outweighed by other factors. The *valence* of the reason itself flips.
      *   **Constraints/Clarifications:**
          *   Not just "context matters" (weighing pros/cons).
          *   Not moral relativism (it's not about different cultures/individuals).
          *   Not just "rules have exceptions" (it's about the *direction* of the reason).
          *   Not just "some reasons are stronger" (it's about the *sign* of the reason).
          *   Applies to both ethics (blowing up, telling truth) and epistemology (consensus).
          *   Wants the name of the concept, what it claims, what it's *not*, the name of the opposite view, and scope (ethics vs. general reasons).
          *   If no name exists, coin one (but a name likely does exist).
          *   No reading lists, just the "shape of the thing."

  2.  **Identify the Philosophical Concept:**
      *   The user is describing a specific debate in meta-ethics and reason theory.
      *   The view that a feature (e.g., "it causes pleasure") is *always* a reason for (or always a reason against) across all possible worlds/cases is called **Moral Particularism** vs. **Moral Generalism** (or Principlism).
      *   Wait, let's dig deeper. The specific claim that a property can be a reason *for* in one case and a reason *against* in another is the core thesis of **Moral Particularism**, specifically associated with **Jonathan Dancy**.
      *   The technical term for the phenomenon where a reason changes its polarity (from for to against) depending on the context is **Holism about Reasons** (or Reason Holism).
      *   The opposite view (a feature that is a reason in one case must be a reason in the same direction in all cases) is **Atomism about Reasons** (or Reason Atomism), often associated with Generalism.
      *   Is it Moral Relativism? No. Relativism says truth/value depends on the *observer/culture*. This says truth/value depends on the *configuration of other properties in the situation*.
      *   Is it just "exceptions"? No. Exceptions imply a rule that usually holds. Holism implies there *isn't* a stable rule to begin with regarding the polarity.

  3.  **Drafting the Explanation:**

      *   **The Name:** The most precise term is **Reason Holism** (or Holism about Reasons). In ethics specifically, it's the engine behind **Moral Particularism**.
      *   **The Core Claim:** A consideration (fact/feature) that counts as a reason in one case can count as a reason in the opposite direction in another case, or no reason at all, *without* changing its nature. The context changes the *valence*, not just the weight.
      *   **What it is NOT:**
          *   Not Relativism: It's not about *who* is judging, but the *situation* being judged.
          *   Not Weighing/Outweighing: It's not that the "goodness" is there but swamped by "badness." The "goodness" itself turns into "badness."
          *   Not Exception Handling: It's not "Rule X applies unless Y." It's "Rule X doesn't exist because the polarity flips."
      *   **The Opposite View:** **Reason Atomism** (or Moral Generalism/Principlism). This claims that if "lying is bad" once, it has a default negative valence everywhere, even if outweighed.
      *   **Scope:** It applies to both Ethics (practical reasons) and Epistemology (theoretical reasons), just as the user noticed with the "consensus" example.
      *   **Edge Cases:** Where does it break down? Logical truths? Tautologies? Maybe basic physical constraints? (Need to be careful here not to overclaim).

  4.  **Refining the "Shape of the Thing":**
      *   Use the user's examples.
      *   *Truth-telling:* In Case A, it signals integrity (Positive). In Case B, it signals betrayal of confidence (Negative). The feature "stating a fact" flips.
      *   *Pain:* In Case A (surgery), pain indicates healing (Positive signal). In Case B (assault), pain indicates damage (Negative signal).
      *   *Analogy:* Ingredients in cooking. Salt makes a cookie better? No. Salt makes a steak better? Yes. The *saltiness* itself isn't inherently "good for food." It depends on the dish. (Dancy uses this analogy).

  5.  **Addressing the "Coin a Term" Option:**
      *   Since "Reason Holism" and "Particularism" are the established terms, I should use those. I don't need to coin one, but I should explain them clearly as if I were defining them for the first time because the philosophical jargon can be dense.

  6.  **Structuring the Response:**
      *   **Direct Answer:** Give the name immediately (**Reason Holism** / **Moral Particularism**).
      *   **The Shape:** Explain the mechanism (valence switching).
      *   **What It's Not:** Explicitly rule out Relativism, Weighing, and Exception-handling (as requested).
      *   **The Opposite:** Name **Reason Atomism** / **Generalism**.
      *   **Scope:** Confirm it applies to belief (epistemology) and action (ethics).
      *   **Edge Cases:** Where might Holism fail? (Logical contradictions, perhaps).
      *   **Practical Application:** How this helps the team lead (moving from rule-book to judgment).

  7.  **Self-Correction/Nuance Check:**
      *   *Distinction between Particularism and Holism:* Holism is the claim about *reasons* (they change polarity). Particularism is the claim about *principles* (therefore, no codifiable moral principles exist). The user is asking about the behavior of the *features/reasons*, so "Reason Holism" is the most accurate technical term, though "Particularism" is the more famous label. I should mention both but distinguish them.
      *   *User's "Pain" Example:* "When my mom had her hip replaced the pain was the whole point of it, the thing that was good about the situation." Technically, the pain wasn't *good*, but the *willingness to endure pain* was good, or the pain was evidence of healing. I need to be careful not to validate the idea that pain is intrinsically good, but rather that the *presence of pain* functions as a positive reason in that context (e.g., reason to believe surgery is working). Actually, the user says "the pain was the whole point of it, the thing that was good." I should interpret this charitably: The *fact of pain* counted in favor of the success of the rehab.
