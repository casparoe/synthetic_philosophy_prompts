      *   Ensure the "Opposite View" is clearly named.
      *   Ensure the "Scope" (ethics vs. belief) is addressed.

  9.  (Self-Correction during drafting): I need to make sure I don't get bogged down in the Dancy vs. McDowell debates. Keep it to the "shape of the thing." The cooking analogy is perfect for this. Salt is the standard example.

  10. **Final check of the prompt requirements:**
