answer: |-
  Yes, this has a name. In fact, it is one of the biggest debates in modern moral philosophy.

  The specific phenomenon you are describing is called **Reason Holism** (or *Holism about Reasons*).

  The broader philosophical position that builds on this observation is called **Moral Particularism**.

  Here is the shape of the thing, stripped of the academic jargon.

  ### What Reason Holism Claims
  Reason Holism claims that a feature (a fact, a property, an action) does not have a fixed "moral valence" or "rational direction" on its own. Its ability to count *for* or *against* a judgment depends entirely on the company it keeps in that specific situation.

  It is not just that the *weight* of the reason changes (sometimes it matters a lot, sometimes a little). It is that the **polarity flips**.

  *   **Your Example:** "Telling the truth."
      *   **Case A:** You admit a mistake to protect the team. (Counts *for* trust).
      *   **Case B:** You admit a mistake to throw a coworker under the bus. (Counts *against* trust).
  *   **The Holist Claim:** There is no such thing as a "pro tanto" (default) reason to tell the truth. The feature "is a truth" is inert until it lands in a specific context. In one context, it functions as a virtue; in another, it functions as a vice.

  The best analogy is **ingredients in cooking**.
  *   **Salt:** In a steak, saltiness is a reason the dish is good. In a chocolate cake, saltiness is a reason the dish is bad.
  *   **The Holist point:** You cannot say "Salt is a good ingredient, but sometimes it gets outweighed by sugar." No. In the cake, the saltiness itself is the defect. The *same chemical property* functions as a merit in one dish and a demerit in the other.

  ### What It Is NOT (Crucial Distinctions)
  You were right to suspect that your usual explanations didn't fit. Here is why Holism is different from the three things you mentioned:

  **1. It is not Moral Relativism.**
  *   **Relativism says:** "Truth-telling is good for *you*, but bad for *me* (or your culture)." It depends on the *observer*.
  *   **Holism says:** "Truth-telling is good in *this situation*, but bad in *that situation*." It depends on the *object* being judged. Two people looking at the exact same case should agree on the judgment. It is objective, just not rule-based.

  **2. It is not "Rules with Exceptions."**
  *   **Exceptions say:** "Never lie, unless it saves a life." This implies lying is *always* negative, but sometimes we override it.
  *   **Holism says:** In the "save a life" case, the lying isn't a negative thing that gets overridden. The lying might actually be the *right thing to do* in a way that doesn't require an apology. The feature "is a lie" might not even register as a negative in that specific configuration.

  **3. It is not "Weighing Reasons."**
  *   **Weighing says:** "Truth is a +5 point reason. Loyalty is a +10 point reason. Loyalty wins."
  *   **Holism says:** In Case A, Truth is a +5. In Case B, Truth is a -5. You aren't weighing it against loyalty; the truth-telling *itself* became a liability.

  ### The Opposite View: Reason Atomism
  The view you are arguing against has a name too. It is called **Reason Atomism** (often paired with **Moral Generalism** or **Principlism**).

  *   **The Claim:** If a feature (like "causes pain") counts as a reason against an action in one case, it must *always* count as a reason against an action in every case, even if it is sometimes outweighed by other reasons.
  *   **The Logic:** Atomists believe that for reasoning to be possible, features must have a stable "default" direction. If "pain" could be good in one case and bad in another without a higher rule explaining why, they argue we couldn't learn from experience.
  *   **Your Pushback:** You have already intuitively rejected Atomism. You noticed that "pain" was the *good* part of your mom's surgery (evidence of healing/rehab) but the *bad* part of your kid's injury. An Atomist would have to say, "Well, actually, the pain was still bad in the surgery, but the *health* was good, and the health outweighed the pain." You are saying, "No, the pain itself was the signal that things were working."

  ### Does This Apply to Belief (Epistemology) Too?
  **Yes.** You noticed this with your "consensus" example, and philosophers agree with you. This is called **Epistemic Holism**.

  *   **Feature:** "Many people believe X."
  *   **Context A:** They are experts with independent data. (Reason to believe X is true).
  *   **Context B:** They are a cult copying each other. (Reason to believe X is false).
  *   **The Feature:** "Consensus."
  *   **The Shift:** In Context A, consensus is evidence *for*. In Context B, consensus is evidence *against* (evidence of groupthink).

  Holism asserts that there are no "purely epistemic" reasons that never flip. Even "logical consistency" can sometimes be a reason against a theory (if the theory is supposed to capture a paradoxical reality).

  ### Edge Cases: Where Holism Might Break
  If you want to know where you might *not* be able to say either way, look for **tautologies** or **logical necessities**.

  *   **Example:** "A square has four sides."
  *   It is hard to imagine a context where "having four sides" counts *against* something being a square.
  *   However, a hard-core Holist might even argue: If I am designing a safety sign that must be distinct from all other shapes, the fact that it has four sides might be a reason *against* using it (because too many things have four sides).

  But generally, the "safe zone" for Atomism is very small (logic and math). The moment you step into the real world (ethics, management, science), Holism tends to dominate.

  ### Why This Matters for You as a Team Lead
  Understanding that you are a **Particularist** (someone who practices Holism) should relieve your anxiety.

  *   **The Atomist/Generalist Lead** tries to write a handbook: "Always reward truth-telling," "Never reward aggression." They fail when the handbook contradicts reality.
  *   **The Particularist Lead** understands that their job is not to apply rules, but to **read the pattern**.

  You aren't failing because you can't find the rule that explains why Intensity was good in Week 1 and bad in Week 3. There *is* no rule. The feature "Intensity" is like salt. In Week 1, the team was passive and needed heat (Salt = Good). In Week 3, the team was already stressed and volatile (Salt = Bad).

  **The Name to Google:**
  If you want to read more (no list, just search terms), search for **"Jonathan Dancy Moral Particularism"** or **"Holism about Reasons."** Dancy is the philosopher who famously codified exactly what you are experiencing.

  **Summary:**
  *   **Phenomenon:** Reason Holism.
  *   **Philosophy:** Moral Particularism.
  *   **Opposite:** Reason Atomism / Moral Generalism.
  *   **Claim:** Features change polarity based on context, not just weight.
  *   **Not:** Relativism, Exception Handling, or Weighing.
  *   **Scope:** Applies to Ethics (action) and Epistemology (belief).
