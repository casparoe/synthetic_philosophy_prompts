prompt: |-
  I run teaching and learning across a small group of secondary schools, and part of my job is sitting in on curriculum review. Every term each department brings us the units they want to change -- new ones, rewrites, the ones that have gone stale -- and we get about half an hour per unit with the head of department and whoever wrote it. Right now my only real test is whether the assessment at the end lines up with what was taught, which is fine as far as it goes and completely useless for the thing that actually worries me, which is that we keep producing kids who can do the thing in the exam and can't tell you why anyone would want to.

  I've been reading Whitehead on education and I think the two bits worth stealing are these. First, his complaint about what he called inert ideas: knowledge that gets received, written down, tested, and never once thrown into a fresh combination or used to do anything. His test for whether something belongs in a curriculum isn't whether it's true or important, it's whether it can be put to work, connected to other things, and made to matter to the person learning it. Second, the rhythm: romance, then precision, then generalization, and then the whole cycle starts again at a smaller scale. Romance is where you meet the material as a live thing, where there's an itch of interest and a sense that something is there to be found out. Precision is the disciplined, systematic, often boring stage where you actually get competent and learn the technique properly. Generalization is where you can use it, see it elsewhere, do something with it. His point, I'm fairly sure about this, is that precision without a prior romance is dead labour, romance without precision is just entertainment, and the cycle repeats -- a whole schooling, a term, a single lesson can each have their own arc, and they nest and overlap rather than happening one after another in a tidy line. He also ties it to freedom and discipline: freedom, then discipline, then freedom again at a higher level.

  So what I want from you is a procedure I can actually run in that half hour meeting, on a unit proposal, in front of the person who wrote it, who is not a philosopher and will not be impressed by me waving a book around. A set of questions in order, with what counts as a good enough answer to each, and I need it to be clear where the procedure stops and says no, and where it stops and hands the thing to me or the head of department as a values call rather than a design call. Include the inert-ideas filter and the rhythm filter, but I don't want them as two seperate checklists stapled together -- I want to know how they interact, because I suspect a unit can pass the inertness test while failing the rhythm, and I want to know what to do about that. And it has to handle the nesting: I need to be able to say whether we're judging the arc of the whole key stage, the unit, or the individual lesson, and what changes when you move between those levels. If a unit is precision-heavy but the romance happened two years earlier in a different unit, is that ok? If so, say so, and give me a way to check that it actually happened rather than assuming it.

  Then run it on three proposals and show your working, including one where the procedure tells me to kill something I like:

  - A year 9 unit on the periodic table, currently taught as: here's the table, here are the groups, here are the trends, practise the trends, test. The head of department is proud of how well the kids do on the trends questions.
  - A unit built entirely around a big open project -- students choose a question about their local area, investigate it, present it. The teacher's proposal has no direct instruction in it at all, deliberately, because she thinks direct instruction kills the interest. She's a good teacher and the presentations are usually great.
  - A unit on poetic metre for a lower set, where the teacher has planned a really beautiful opening lesson: a recording, a bit of drumming, students clapping out rhythms, everybody leaves buzzing. Then it's back to worksheets for six weeks. He loves this lesson and it's the reason he volunteers to teach the unit.

  The third one is the one I expect to be told to cut or rebuild, so be honest about it if so, and tell me what to tell him. Also be honest about what this procedure can't do. I don't want it pretending to be more objective than it is: some of these calls -- whether this cohort has enough prior precision for the romance to take, whether a project is genuinely generalisation or just unstructured -- are judgment calls, and I'd rather the procedure say so and tell me who should be making them than dress them up as a test. And I want a short section at the end on how it misfires, especially in the exam-driven subjects where the generalization stage might legitimately be deferred for a year or two, and on the temptation to turn everything into a three-part lesson with a fun hook at the start, which I'm worried is what happens when people get hold of this idea without the nesting part.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Role:** Leader of Teaching and Learning across a small group of secondary schools.
      *   **Task:** Create a procedure for a 30-minute curriculum review meeting.
      *   **Current State:** Only checks assessment alignment (useless for the real problem: students can pass exams but don't care/understand *why*).
      *   **Philosophical Basis:** Alfred North Whitehead (Inert Ideas, Rhythm of Education: Romance -> Precision -> Generalization, Freedom/Discipline/Freedom).
      *   **Requirements:**
          *   Actionable procedure (questions, order, pass/fail criteria).
          *   Integrate "Inert Ideas" and "Rhythm" filters (not separate checklists).
          *   Handle "Nesting" (Key Stage vs. Unit vs. Lesson).
          *   Handle "Deferred Romance/Precision" (e.g., precision now, romance happened years ago).
          *   Distinguish between Design Calls (procedure says no) and Values Calls (leadership judgment).
          *   Apply to three specific scenarios (Periodic Table, Open Project, Poetic Metre).
          *   Include limitations/misfires (exam pressure, superficial "hooks").
      *   **Tone:** Practical, honest, not philosophical jargon-heavy, respectful of teacher expertise but rigorous.

  2.  **Develop the Procedure (The "Whitehead Audit"):**

      *   *Goal:* Make Whitehead operational without naming him constantly.
      *   *Structure:* Needs to flow logically in a 30-minute meeting.
      *   *Core Concept:* The "Life Cycle of an Idea."
      *   *Step 1: The Hook (Inert Idea Check).* Is this knowledge dead or alive? Does it connect?
      *   *Step 2: The Arc (Rhythm Check).* Where does this unit sit in the Romance-Precision-Generalization cycle?
      *   *Step 3: The Nesting (Context Check).* If this unit is Precision, where was the Romance? If Generalization, where is the Precision?
      *   *Step 4: The Exit (Assessment/Outcome).* Does the end prove they can *use* it, not just recall it?
      *   *Decision Points:* Clear "Stop/Revise" vs. "Escalate/Values" triggers.

      *Refining the Interaction:* Inert ideas are the result of failed rhythm. If you have Precision without Romance/Generalization, it becomes inert. So the Rhythm check *is* the Inert Ideas filter.
      *Refining Nesting:* Need a "Map" question. "Show me where this sits in the 5-year journey."
      *Refining Deferred Romance:* If a unit is Precision-heavy, the teacher must evidence the prior Romance. If they can't, it fails.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1 (Purpose):* Why this? (Filters inert ideas).
      *   *Q2 (Placement):* Where in the cycle? (Romance/Precision/Generalization).
      *   *Q3 (Connection):* If Precision, where was the itch? If Generalization, where was the drill?
      *   *Q4 (Evidence):* How do we know they get it? (Assessment).
      *   *Decision Logic:*
          *   Fail Q1 -> Kill (Inert).
          *   Fail Q2/Q3 (No link to other stages) -> Send back for design fix.
          *   Pass Q1-Q3 but risky Q4 -> Values call (Leadership judgment on risk).

  4.  **Applying to Scenarios:**

      *   *Scenario 1: Year 9 Periodic Table (Precision heavy).*
          *   Current: Table -> Groups -> Trends -> Test.
          *   Analysis: Pure Precision. Where was Romance? (Year 7/8 chemistry?). Where is Generalization? (Real world application?).
          *   Verdict: Likely fails on Inert Ideas/Generalization. Needs to show where the "wow" happened before or add application after.
      *   *Scenario 2: Open Project (Romance/Generalization heavy).*
          *   Current: Choose question -> Investigate -> Present. No direct instruction.
          *   Analysis: High Romance/Generalization. Missing Precision.
          *   Verdict: Risk of "entertainment." Needs to evidence where skills (Precision) were taught or embedded. If no Precision, it's a Values Call (is the skill acquisition worth sacrificing?).
      *   *Scenario 3: Poetic Metre (Romance then Precision).*
          *   Current: Fun drumming lesson -> 6 weeks worksheets.
          *   Analysis: Romance isolated at start. Precision dominates rest. No Generalization (using metre to write/analyze meaning).
          *   Verdict: Fails Rhythm. The Romance is a "hook," not a phase. The Precision becomes inert. Needs rebuild.

  5.  **Addressing Limitations & Misfires:**

      *   *Exam Pressure:* Sometimes you *need* inert knowledge to pass the gate. Acknowledge this.
      *   *The "Hook" Trap:* Don't let teachers think a fun starter = Romance. Romance is a state of mind/curiosity, not an activity.
      *   *Subjectivity:* Admit that judging "sufficient precision" is a judgment call.

  6.  **Refining the Output:**

      *   Make it look like a tool (The "Vitality & Arc Protocol").
      *   Keep the language professional but accessible.
      *   Ensure the "Nesting" aspect is clear (The "Curriculum Map" requirement).
      *   Ensure the "Values Call" distinction is sharp.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 30 minutes enough for all this?
      *   *Fix:* Emphasize that the *paperwork* must be done before. The meeting is for interrogation, not discovery.
      *   *Critique:* Did I integrate Inert Ideas and Rhythm?
      *   *Fix:* Yes, by framing Inert Ideas as the *result* of broken Rhythm.
      *   *Critique:* Is the Poetic Metre analysis honest?
      *   *Fix:* Yes, explicitly state that the "beautiful lesson" is actually the problem because it isolates the romance.

  8.  **Final Polish:** Check tone. Needs to be authoritative but collaborative. "We" not "You." Ensure the specific constraints (nesting, deferred romance) are addressed in the procedure steps. (Self-correction: Make sure to explicitly mention how to verify prior romance if the current unit is precision).

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a procedure designed for your 30-minute review meetings. It translates Whitehead's philosophy into an operational audit without requiring the teachers to know the philosophy.

  I call this the **Vitality & Arc Protocol**.

  ### The Procedure: Vitality & Arc Protocol

  **Pre-meeting Requirement:** The HoD must submit a "Curriculum Map" showing where this unit sits in the 5-year journey (Key Stage), not just the unit plan itself.

  **Time Allocation:**
  *   5 mins: The Purpose (Inert Filter)
  *   10 mins: The Arc (Rhythm & Nesting)
  *   10 mins: The Evidence (Assessment & Generalization)
  *   5 mins: Decision & Next Steps

  ---

  #### Phase 1: The Purpose (The Inert Ideas Filter)
  *Goal: Establish if the knowledge is intended to be used or just stored.*

  **Question 1:** "If a student forgets everything specific taught in this unit except one thing, what is the one tool or insight they keep? What can they *do* with it that they couldn't do before?"

  *   **Good Answer:** A verb or a capability (e.g., "They can predict reactivity," "They can critique a source," "They can hear the rhythm in speech").
  *   **Bad Answer:** A noun or a topic (e.g., "They know the periodic table," "They understand the project," "They know what iambic pentameter is").
  *   **Stop Condition:** If the answer is purely content recall, **STOP**. The unit is designed to produce inert ideas. Send back for redesign.

  #### Phase 2: The Arc (The Rhythm & Nesting Filter)
  *Goal: Locate the unit in the Romance-Precision-Generalization cycle and verify the links.*

  **Question 2:** "Which phase of learning is this unit primarily responsible for: The Hook (Romance), The Drill (Precision), or The Use (Generalization)?"

  *   **Good Answer:** Clear identification (e.g., "This is Precision," "This is Generalization").
  *   **Bad Answer:** "It's all of them." (In a 30-minute review, if they claim it's all three, they usually mean it's none).

  **Question 3 (The Nesting Check):** "You've identified this as [Phase X]. Show me on the Key Stage Map where [Phase Y and Z] happened or will happen."
  *   *If this unit is Precision:* "Where did they fall in love with this topic previously? Show me the lesson or unit."
  *   *If this unit is Romance:* "What specific skills will they acquire here that allow them to do rigorous work later? Where is the handover?"
  *   *If this unit is Generalization:* "Where did they learn the rules they are now breaking or applying? How do we know they aren't just guessing?"

  *   **Good Answer:** Specific reference to prior/future units. Evidence of continuity (e.g., "The romance was in Year 7 Chemistry explosions; this is Year 9 systematizing.").
  *   **Bad Answer:** Vague assurance (e.g., "They'll just pick it up," "They liked science in primary school").
  *   **Stop Condition:** If the teacher cannot evidence the *adjacent* phases of the rhythm (either prior or future), **STOP**. This creates a broken cycle. Send back to link with the colleague teaching the adjacent phase.

  #### Phase 3: The Evidence (The Competence Filter)
  *Goal: Ensure the assessment measures the 'Use', not just the 'Recall'.*

  **Question 4:** "Look at the final assessment. Does it require them to combine this knowledge with something else, or just repeat it?"

  *   **Good Answer:** "They have to apply the trend to a new element," "They have to use the metre to write a poem that changes mood."
  *   **Bad Answer:** "They have to label the groups," "They have to identify the metre."
  *   **Decision Point:** If the assessment is purely recall, but the *Purpose* (Phase 1) was "Use," this is a **Design Fail**. Send back to align assessment with purpose.

  #### Phase 4: The Decision (Values vs. Design)
  *Goal: Distinguish between fixable errors and strategic risks.*

  *   **Design Call (Send Back):** The rhythm is broken (no link to prior/future phases), the assessment doesn't match the purpose, or the knowledge is inert (no "do" verb).
  *   **Values Call (Escalate to You/HoD):** The design is coherent, but risky.
      *   *Example:* A Precision-heavy unit where the Romance happened 2 years ago and student retention is doubtful.
      *   *Example:* A Generalization-heavy project where Precision was light, risking superficiality.
      *   *Action:* You (Leadership) decide if the cohort has the resilience/foundation to support this risk.

  ---

  ### Running the Protocol: Three Scenarios

  Here is how the protocol applies to your three proposals, including the working out.

  #### 1. Year 9 Periodic Table (The "High Scores" Unit)
  *Proposal:* Here's the table, groups, trends, practise, test. HoD proud of exam data.

  *   **Phase 1 (Purpose):**
      *   *Q1:* "What can they do?"
      *   *Teacher:* "They can answer trends questions correctly."
      *   *Verdict:* **Borderline.** "Answer questions" is a school skill, not a subject skill. Push harder. "What does knowing the trend let them predict in the real world?" If they can't answer, it's Inert.
  *   **Phase 2 (Arc):**
      *   *Q2:* "Which phase?"
      *   *Teacher:* "Precision."
      *   *Q3 (Nesting):* "Where was the Romance?"
      *   *Teacher:* "Year 7. They did burning magnesium and stuff."
      *   *Check:* Look at the Year 7 map. Was it actually romance (curiosity-driven) or just "fun activities"? If Year 7 was also just "label the equipment," the Romance is missing.
      *   *Q3 (Nesting):* "Where is the Generalization?"
      *   *Teacher:* "Year 10, when they do bonding."
      *   *Verdict:* **Design Fail.** There is a gap. Year 9 Precision is suspended in a vacuum. Without an immediate "Use," the trends become inert facts before Year 10 arrives.
  *   **Decision:** **Send Back.**
  *   **Feedback:** "The data shows they can recall the trends. The protocol shows they can't *use* them yet. You need to build a Generalization step into *this* unit. Give them an unknown element and ask them to predict its properties using the trends. Make the precision work immediately."

  #### 2. The Open Project (The "No Instruction" Unit)
  *Proposal:* Student chooses question, investigates, presents. No direct instruction.

  *   **Phase 1 (Purpose):**
      *   *Q1:* "What can they do?"
      *   *Teacher:* "They can investigate a real problem and communicate findings."
      *   *Verdict:* **Pass.** Clear "Do" verbs.
  *   **Phase 2 (Arc):**
      *   *Q2:* "Which phase?"
      *   *Teacher:* "Generalization and Romance."
      *   *Q3 (Nesting):* "Where is the Precision?"
      *   *Teacher:* "Deliberately excluded. Instruction kills interest."
      *   *Verdict:* **Values Call.**
      *   *Working:* This passes the Inert Ideas filter (knowledge is being used). It fails the Rhythm filter (Precision is missing). Whitehead says "Romance without Precision is entertainment."
      *   *Risk:* Students produce glossy presentations with shallow understanding.
  *   **Decision:** **Escalate to Values Call.**
  *   **Feedback:** "The design is coherent, but it risks being 'entertainment.' You are betting that students already have the research skills (Precision) from elsewhere. Check the map: did they learn *how* to source data rigorously in Year 7/8? If yes, approve as a strategic risk. If no, you must embed 'Just-In-Time' precision lessons (e.g., a 20-minute drill on citation or source reliability) within the project. You don't need a full course, but you can't have zero."

  #### 3. Poetic Metre (The "Beautiful Lesson" Unit)
  *Proposal:* Lesson 1: Drumming/Clapping (Romance). Lessons 2-7: Worksheets on scanning lines (Precision). Assessment: Label the metre.

  *   **Phase 1 (Purpose):**
      *   *Q1:* "What can they do?"
      *   *Teacher:* "They can identify iambic pentameter."
      *   *Verdict:* **Fail.** This is recall, not use. Why would anyone want to identify it? To hear the mood? To write it?
  *   **Phase 2 (Arc):**
      *   *Q2:* "Which phase?"
      *   *Teacher:* "Lesson 1 is Romance, rest is Precision."
      *   *Q3 (Nesting):* "Where is the Generalization?"
      *   *Teacher:* "Maybe in Year 11?"
      *   *Verdict:* **Design Fail.**
      *   *Working:* This is the classic trap. The "Romance" is isolated as a "Hook." Once the drumming stops, the idea dies. The Precision (worksheets) has no connection to the Romance (the feeling of rhythm). It becomes inert labour.
  *   **Decision:** **Send Back (Kill the current design).**
  *   **Feedback:** "I know you love Lesson 1. But in this design, Lesson 1 is a lie. It promises that rhythm is alive and felt, but Lessons 2-7 tell the students rhythm is actually a labelling exercise. The Romance must drive the Precision.
      *   *Fix:* Keep the drumming, but use it to teach the scanning. Then, immediately require them to *write* a verse that changes mood by switching metre, or analyze how a rapper uses the same technique. The assessment cannot be 'label the metre'; it must be 'explain the effect of the metre.' If you can't assess the 'why', don't teach the 'what'."

  ---

  ### Limitations & Misfires

  You asked for honesty about where this procedure breaks. Here is where it will misfire, and how to handle it.

  **1. The Exam-Pressure Misfire (Deferred Generalization)**
  *   **The Problem:** In high-stakes subjects (GCSE Maths, Sciences), you sometimes *must* teach inert Precision because the Generalization is too complex for the current age, or the exam demands rote recall first. The Rhythm cycle might be deferred by two years.
  *   **The Risk:** The Protocol flags this as a "Design Fail" because Generalization isn't immediate.
  *   **The Fix:** This is a **Values Call**. You must explicitly authorize "Deferred Rhythm."
      *   *Condition:* You can approve a Precision-heavy unit *only if* the Scheme of Work explicitly marks where the debt will be paid. It must be tagged: *"Precision Phase 1. Generalization scheduled for Unit X in Year 11."* If it's not scheduled, it's inert.

  **2. The "Hook" Trap (Superficial Romance)**
  *   **The Problem:** Teachers will hear "Romance" and think "Fun Starter." They will add a video clip or a puzzle to Lesson 1 and claim they've satisfied the Romance filter.
  *   **The Risk:** You get 6 weeks of drills with a 10-minute entertainment segment. Whitehead's Romance is a state of mind (curiosity/itch), not an activity.
  *   **The Fix:** Tighten **Question 3**. Do not ask "What is the hook?" Ask: "What question are the students asking *themselves* by Lesson 3?" If the only questions coming from students are "Is this in the test?", the Romance failed, regardless of the drumming or videos.

  **3. The Subjectivity of "Enough"**
  *   **The Problem:** How much Precision is enough before Generalization? One teacher's "solid foundation" is another's "bogging down."
  *   **The Risk:** You end up arguing taste, not design.
  *   **The Fix:** Acknowledge this in the **Values Call**. The Protocol identifies the *structure* (is there a link?), but you (the leader) must judge the *weight*. Use student work from previous cohorts as the arbiter. If previous Year 9s could generalize successfully, the Precision was enough. If they couldn't, it wasn't.

  **4. The Nesting Blindspot**
  *   **The Problem:** A unit might be perfect Precision, but the Romance happened in a different school in your group, or with a teacher who has left. The map says it happened, but the kids didn't get it.
  *   **The Fix:** Add a diagnostic check. "Assume the Romance didn't stick. How does Lesson 1 of *this* unit re-ignite the itch quickly?" A robust Precision unit should have a "Re-Romance" mechanism built in for cohorts that missed the first pass.

  ### Summary for your Leadership Team

  When you introduce this, do not sell it as "Whitehead's Rhythm." Sell it as **"The Vitality Audit."**

  *   **If it doesn't do anything, it's dead.** (Inert Filter)
  *   **If it doesn't connect to before and after, it's isolated.** (Nesting Filter)
  *   **If the test doesn't match the promise, it's dishonest.** (Assessment Filter)

  This allows you to kill the Poetic Metre unit not because you dislike worksheets, but because the unit is structurally dishonest about what poetry is. It allows you to challenge the Periodic Table unit not because exam results are bad, but because they are fragile. And it allows you to support the Project teacher, provided she admits the risk and builds in safety nets for skills.
