      *(Self-Correction during drafting)*: Make sure the "Decision" feels weighty. If they don't care who signs, the tension is lost. I need to add a stake. Not a grade, but a "Record." The pair must submit *one* authoritative account of the session. If they submit two, they are disqualified. This mimics the "One Reality" assumption.

      *(Refining the Wittgenstein point)*: Ensure I explain *why* it cuts against the game. The game assumes "Dream" is a container you can inspect. Wittgenstein says "Dream" is a label applied from outside.

      *(Final check on the "Transformation" reading)*: Make sure the debrief doesn't just end on "Language is tricky." It needs to land on Zhuangzi's *wu hua* (transformation of things). The activity creates a binary (A vs B). Zhuangzi dissolves the binary.

