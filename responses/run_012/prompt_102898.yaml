      *   Actually, better: "One of you is experiencing 'State 1', the other 'State 2'. State 1 is the Dream. State 2 is Wake. You don't know which is which. Decide who is in the Dream."
      *   No, let's stick to the User's intuition: "Which one is dreaming the other?"
      *   Let's make the activity about *narrative authority*.
      *   Okay, I have a solid plan forming. I will call it "The Protocol of the Two States."

  7.  **Finalizing the Wittgenstein Point:**
      *   It's not just that tests fail. It's that the *question* is malformed.
      *   "I might be dreaming" implies I can occupy the state of 'dreaming' and look at it. But 'dreaming' is defined by the *loss* of that capacity.
      *   I need to make sure the facilitator doesn't just lecture this. I need to ask: "When you were doing the test, what state were you in?" "Checking state." "Can you check the state you are in?"

