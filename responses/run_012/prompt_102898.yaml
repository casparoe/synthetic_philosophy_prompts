      *   75 mins? Yes.
      *   No lecture up front? Yes.
      *   No forbidden words? Yes.
      *   Real decision? Yes (Who signs the form).
      *   Debrief maps activity to theory? Yes.
      *   Failure modes? Yes.
      *   Facilitator element? Yes (The refusal to validate).

