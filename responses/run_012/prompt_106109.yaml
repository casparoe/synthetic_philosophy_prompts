answer: |-
  **Essay Question**

  Consider a subject walking a row of colour patches from unmistakable red to unmistakable green, where no neighbour looks distinct from its pair. She reports what she sees at each step, yet cannot identify where red ends. This suggests a paradox of experience, not merely language.

  Write an essay addressing the following:
  1. Is the epistemic view (a hidden boundary exists) coherent when the subject matter is one's own present experience?
  2. Can contextualism explain the shift from step to step without merely relocating the paradox?
  3. Does degree theory preserve the phenomenology at the cost of classical logic?
  4. If the subject lacks colour vocabulary entirely, what do these four treatments claim to be resolving?

  Evaluate whether these treatments answer the same question when applied to phenomenal vagueness.

  ***

  **Model Answer**

  The phenomenal sorites presents a unique challenge because the subject matter is immediate experience, not external classification. When addressing the epistemic view, we confront a significant hurdle: epistemicism posits a sharp boundary we are ignorant of. However, ignorance implies a gap between appearance and reality. In phenomenal cases, appearance *is* the reality. To claim a hidden boundary in experience suggests the subject is mistaken about how things look to her, which contradicts the privileged access usually granted to phenomenology. Thus, epistemicism is much harder to sell here than with heaps of sand.

  Contextualism argues that the extension of 'red' shifts with conversational context. In a solitary walk, the 'context' must be perceptual. If the standard shifts at every step to accommodate the indiscriminable neighbour, the paradox is dissolved, but only by accepting that 'looks red' changes meaning constantly. This risks merely relocating the paradox: why does the subject feel a continuous experience if the semantic value jumps? It explains the report, but perhaps not the phenomenology.

  Degree theory offers the best fit for the smooth transition of experience. It buys phenomenological accuracy by allowing truth values to slide from 1 to 0. However, it costs classical logic, specifically Modus Ponens, which underpins the sorites argument. We preserve the feel of the experience but lose the logical structure that makes the paradox compelling.

  Finally, if the subject lacks vocabulary, semantic theories (contextualism, degrees of truth) lose their primary object. They must claim to resolve vagueness in *concepts* or *perceptual categories* rather than words. Here, contextualism and degree theory agree: both deny a sharp metaphysical boundary in the experience itself, unlike epistemicism. However, without language, it is unclear what 'truth' degrees attach to.

  Ultimately, these treatments do not answer the same question. Epistemicism addresses the metaphysics of experience; degree theory addresses the logic of description; contextualism addresses the use of categories. In the phenomenal case, the lack of a linguistic veil forces us to admit that vagueness may reside in the mind's categorization rather than the world or the words.

  ***

  **Marking Scheme (Out of 20)**

  **1. Epistemicism on Experience (5 marks)**
  *   **3 marks:** Identifies the tension between ignorance and privileged access (one cannot be ignorant of how things look).
  *   **2 marks:** Concludes epistemicism is less coherent here than for external objects.
  *   *Common Mistake:* Treating phenomenal ignorance as identical to ignorance of external facts (e.g., not knowing the wavelength).
  *   *Agreement Note:* Credit students who note Epistemicism stands alone in positing a sharp boundary.

  **2. Contextualism on Steps (5 marks)**
  *   **3 marks:** Explains how context might shift per step (perceptual standards vs. conversational).
  *   **2 marks:** Evaluates whether this explains the continuity or merely hides the jump (relocating the paradox).
  *   *Common Mistake:* Assuming context requires conversation rather than perceptual setting.
  *   *Agreement Note:* Credit students who note Contextualism and Degree Theory agree there is no fixed boundary.

  **3. Degree Theory Trade-off (5 marks)**
  *   **3 marks:** Identifies the benefit (matches smooth phenomenology).
  *   **2 marks:** Identifies the cost (abandoning classical logic/Modus Ponens).
  *   *Common Mistake:* Claiming degree theory solves the paradox without logical cost.
  *   *Agreement Note:* Credit students who note Contextualism and Degree Theory agree there is no fixed boundary.

  **4. Non-Linguistic Variant & Synthesis (5 marks)**
  *   **3 marks:** Explains what theories resolve without language (concepts/categories vs. words).
  *   **2 marks:** Synthesizes whether treatments answer the same question (conclusion: they diverge on metaphysics vs. logic vs. use).
  *   *Common Mistake:* Assuming vagueness disappears without language.
  *   *Agreement Note:* Credit students who note Epistemicism and Supervaluationism (View 2) agree on preserving classical bivalence.

  ***

  **Note on Press-Points**

  Your fourth press-point (the non-linguistic variant) risks collapsing into the first. If a student successfully argues that Epistemicism fails on experience (Point 1) because there is no gap between appearance and reality, they have implicitly argued that semantic treatments lack a foothold without language (Point 4). I have structured the marking scheme to credit this overlap rather than penalize repetition, but be aware that a sophisticated answer may treat Points 1 and 4 as a single argument about the locus of vagueness.
