  I have analyzed the five scenarios you provided along with your specific verdicts on each. It is a challenging set because it straddles the boundaries between Causal Decision Theory, Evidential Decision Theory, and Updateless Decision Theory, accepting parts of each while rejecting their core consistencies. The principle that unifies your gut reactions is what I call the Principle of Actualized Reciprocity with a Causal Threshold. Simply put, you are willing to act as the type of person a predictor simulated only if that type successfully secured a benefit for you in the actual world you occupy, and you are willing to ignore correlations only when the cost of acting is causally isolated from the harm or the benefit reliability is too low.

  The first clause of this principle, which demands that the benefit be actualized in your current branch of reality, is forced by the tension between the sealed box and the coin flip. In the sealed box scenario, you one-box because the prediction is what placed the money in the box in front of you; the benefit exists in your actual world contingent on your type. In the desert driver scenario, you pay because the ride you already received was secured by your predicted willingness to pay; the benefit was actualized in your past. However, in the coin flip scenario, you refuse to pay because the ten thousand dollars exists only in the counterfactual tails world which did not obtain; the prediction secured you only the offer, not the reward, in this heads world. Your intuition draws a hard line at whether the reward is present in your reality versus merely possible in a different one.

  The second clause, which introduces a causal threshold for costs and correlations, is forced by the gene scenario and the weak predictor scenario. In the gene scenario, you eat the food because while the gene correlates with disease, your action does not cause it; you refuse to pay a causal cost for a non-causal risk. This same logic applies to the weak predictor scenario where you two-box. Here, the evidential link between your choice and the money is too weak to override the causal certainty of leaving the thousand dollars on the table. You require the correlation to be strong enough to function as a secure benefit before you will sacrifice a guaranteed causal gain.

  To test this principle, consider a new case I will call the Retrospective Lottery. A trustworthy organizer tells you that yesterday they bought a lottery ticket for you only if their simulation predicted you would donate half your winnings to charity today. If they predicted you would keep it all, they bought nothing. They show you the ticket, it is a winner for one million dollars, and the money is in your bank account. The question is whether you donate half today. Under your principle, the verdict is yes. The benefit is actualized in your account solely because you are the donating type, satisfying the reciprocity clause, and the cost of donating is causally isolated from any further risk, satisfying the threshold clause. You would donate to honor the type that secured the actual windfall.

  Regarding your request for honesty about which verdicts this principle must throw out, the answer is none. This specific combination of clauses accommodates all five of your judgments without contradiction. However, the cost of this fit is that it prevents you from adopting any single standard decision theory framework. You must reject Causal Decision Theory because it fails the sealed box and desert driver cases. You must reject Updateless Decision Theory because it fails the coin flip case. You must also reject pure Evidential Decision Theory because it fails the gene and weak predictor cases. Your intuition is consistent, but it isolates you from the major schools of thought by demanding that rationality be responsive to actualized benefits rather than counterfactual optimality or strict causal isolation.

