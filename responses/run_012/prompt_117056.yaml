prompt: |-
  I'm part of a small grant panel deciding where to put roughly three years of one philosopher's time -- postdoc, strong in ethics and metaphysics, no empirical work. We've settled on the doing/allowing distinction, but neither of us wants the trolly-loop canon again; we think the live stuff is elsewhere. Two threads keep coming up: whether the distinction survives being applied to agents that aren't persons -- large institutions, and increasingly AI systems that mostly 'act' by setting defaults and choosing what to attend to -- and whether 'letting die' is really one thing or a bundle (failing to prevent, failing to rescue, refusing to sustain, standing by). Which open questions in this area should we prioritise over those three years, in what order, and why? I want the reasoning more than the list: which questions are upstream of which, which are tractable for one person working alone, and what would move a question up or down the ranking. And which supposedly central questions should we deprioritise because settling them wouldn't change much downstream?
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the Request:**
      *   **Context:** Small grant panel, funding 3 years of one philosopher's time (postdoc level).
      *   **Expertise:** Ethics + Metaphysics, no empirical work.
      *   **Topic:** The Doing/Allowing Distinction (DAD).
      *   **Constraints/Preferences:** Avoid standard trolley-problem canon. Focus on "live stuff": Non-person agents (institutions, AI) and the granularity of "allowing" (is it a bundle?).
      *   **Deliverable:** Prioritized open questions, ordered, with reasoning (upstream/downstream relationships, tractability for a solo theorist, impact on downstream applications).
      *   **Specific Instruction:** Explain *why* certain questions are prioritized and which "central" questions should be deprioritized.

  2.  **Deconstruct the Core Tension:**
      *   The user wants to move away from *individual human agency* (the traditional locus of DAD) toward *structural/systemic agency* (AI, institutions) and *conceptual granularity* (is "allowing" uniform?).
      *   *Constraint:* The philosopher is a theorist (no empirical work). This means they can't test AI systems or interview institution managers. They must work conceptually, perhaps using conceptual analysis, formal modeling, or case-study reasoning based on existing public knowledge.
      *   *Goal:* Maximize philosophical impact and clarity over 3 years.

  3.  **Brainstorming Potential Questions:**
      *   *AI/Defaults:* Is setting a default doing or allowing? (e.g., opt-in vs. opt-out organ donation).
      *   *AI/Attention:* Is filtering information allowing harm (by ignorance) or doing harm (by manipulation)?
      *   *Institutions:* Can an institution "let die" in a way reducible to individual members?
      *   *Granularity:* Is "failing to rescue" morally equivalent to "refusing to sustain"?
      *   *Metaphysics:* What is the ontological status of an omission in a digital system?
      *   *Normative:* Does DAD matter for blame vs. liability vs. virtue?

  4.  **Filtering & Ordering (The "Upstream/Downstream" Logic):**
      *   *Metaphysics of Agency* is upstream of *Normative Ethics*. You can't decide if an AI *allowed* harm until you decide if an AI can *act* in a sense relevant to DAD.
      *   *Conceptual Granularity* is upstream of *Application*. If "allowing" is a bundle, we need to know which bundle member applies before we judge the AI/Institution.
      *   *Tractability:* A solo theorist can handle conceptual analysis better than complex social ontology of institutions (which might require sociology). AI ethics is hot but risks becoming empirical/speculative.
      *   *Deprioritization:* Traditional "intentionality" debates (did the AI *mean* to?) might be less relevant than structural causation. The "moral significance" of DAD (does it matter?) is often assumed; better to assume it matters for the sake of the project and focus on *application*.

  5.  **Drafting the Priorities (Iterative Process):**

      *   *Priority 1: The Metaphysics of "Default" Settings.*
          *   Why: This bridges the AI/Institution thread with the DAD. Setting a default looks like "allowing" (status quo) but functions like "doing" (causal leverage).
          *   Tractability: High. Conceptual analysis of causation and counterfactuals.
          *   Upstream: Determines how we classify AI actions later.

      *   *Priority 2: Decomposing "Allowing" (The Bundle Theory).*
          *   Why: The user specifically mentioned this. If "letting die" isn't unitary, applying it to AI is confused.
          *   Tractability: High. Classic analytic philosophy.
          *   Upstream: Needed before applying DAD to specific cases.

      *   *Priority 3: Distributed Agency and Omissions.*
          *   Why: Institutions/AI are distributed. Who "allows" when the code is written by A, deployed by B, used by C?
          *   Tractability: Medium/Hard. Social ontology is tricky.
          *   Downstream: Depends on 1 & 2.

      *   *Deprioritize:* The "Moral Significance" debate (does DAD matter?).
          *   Why: Endless debate, little progress. Assume it matters for liability/blame and focus on *when* it applies.
          *   Deprioritize:* Traditional Intentionality.*
          *   Why: AI doesn't have mens rea in the human sense. Focus on functional role.

  6.  **Refining the Argument (Addressing the "Why"):**
      *   Need to emphasize *why* a solo theorist can do this. (e.g., relying on thought experiments regarding algorithms rather than coding).
      *   Need to explain the *flow*. (Metaphysics of Action -> Taxonomy of Omissions -> Application to Non-Persons).
      *   Need to highlight the "Live Stuff." (AI defaults are the new trolley problems).

  7.  **Final Review against Constraints:**
      *   3 years? Yes, the scope fits.
      *   No empirical work? Yes, focused on conceptual analysis.
      *   Ethics + Metaphysics? Yes, blends action theory with normative theory.
      *   Reasoning over list? Yes, the structure will emphasize the logic of prioritization.

  8.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure not to get too bogged down in AI hype. Keep it philosophical. The AI is just the test case for the metaphysics.
      *   *Emphasis:* Highlight the "Default" issue. That's the sweet spot between metaphysics (causation) and ethics (responsibility).
      *   *Structure:* Introduction -> The Strategic Logic -> Priority 1 (Metaphysics of Defaults) -> Priority 2 (Taxonomy of Omissions) -> Priority 3 (Distributed Agency) -> What to Drop -> Conclusion.

  9.  **Final Polish:** Ensure tone is professional, advisory, and respects the panel's expertise. (e.g., using terms like "upstream metaphysical commitments," "tractability," "downstream normative implications").

  *(Self-Correction on "Institutions"):* The prompt mentions institutions *and* AI. Institutions are harder for a solo metaphysician than AI logic. I should frame the institution part through the lens of *rules and defaults* which aligns with the AI part, rather than deep social ontology.

  *(Self-Correction on "Bundle Theory"):* Make sure to link the bundle theory to the AI application. If "failing to attend" is different from "failing to rescue," AI attention mechanisms become a key ethical site.

  10. **Finalizing the Plan:** (Proceed to generate response based on these thoughts).
answer: |-
  This is a compelling strategic constraint. You are asking for a research agenda that avoids the stagnant "trolleyology" of the late 20th century while leveraging a theorist's strengths (conceptual analysis, metaphysics) to address 21st-century problems (AI, institutions) without requiring empirical data they cannot generate.

  The core strategic insight here is that the **Doing/Allowing Distinction (DAD)** is currently suffering from a category error. We are trying to apply a distinction designed for *human bodily movements* to *systemic configurations*. To make progress in three years, the project must treat the metaphysics of agency as upstream of the normative ethics.

  Here is the proposed prioritization, ordered by logical dependency and tractability for a solo theorist.

  ### Phase 1: The Metaphysics of the "Default" (Year 1)
  **The Question:** *Is setting a default a doing or an allowing?*

  **Reasoning for Priority:**
  This is the most critical upstream question. In AI and institutional design, "action" increasingly looks like "architecture." An algorithm that defaults to sharing user data, or a hospital system that defaults to "Do Not Resuscitate" unless opted out, creates outcomes with the causal force of a action but the phenomenological appearance of a passive background condition.

  *   **Upstream/Downstream:** This is foundational. If setting a default is metaphysically an "allowing" (merely refraining from changing the status quo), then liability is low. If it is a "doing" (causally selecting a specific trajectory from a possibility space), liability is high. You cannot adjudicate AI responsibility (Phase 3) without settling the ontology of defaults.
  *   **Tractability:** High for a solo theorist. This requires analyzing counterfactuals and causal models, not empirical data. The philosopher can use existing literature on causation by omission and apply it to the logic of "if/then" structures.
  *   **Why move it up?** It bridges the gap between the two threads you identified. It treats AI/Institutions not as "agents" to be psychologized, but as *structures of constraint* to be metaphysically categorized.

  ### Phase 2: Decomposing the "Allowing" Bundle (Year 2)
  **The Question:** *Is "letting die" a unitary moral kind, or a cluster of distinct metaphysical relations (failing to prevent vs. refusing to sustain vs. withdrawing attention)?*

  **Reasoning for Priority:**
  Once you have analyzed the "default," you must analyze the specific mode of omission. Traditional DAD literature often treats "allowing harm" as a single bucket. Your panel suspects it is a bundle. This needs to be unpacked before applying it to non-persons.

  *   **Upstream/Downstream:** This is upstream of normative application. If "failing to attend" (an AI ignoring a data pattern) is metaphysically distinct from "failing to rescue" (a human ignoring a drowning child), they may carry different normative weights.
  *   **Tractability:** High. This is classic analytic metaphysics and ethics. It involves constructing cases where intuition pumps diverge. For example: Does an AI that is *unable* to attend to a variable (architectural limitation) "allow" harm in the same way as an AI that is *programmed* to ignore it (policy choice)?
  *   **Why move it up?** It prevents the project from stalling on vague terminology. If the philosopher can produce a taxonomy of omissions (e.g., *Structural Omission* vs. *Agential Omission*), it provides a vocabulary for the rest of the field.

  ### Phase 3: Distributed Agency and "Moral Glue" (Year 3)
  **The Question:** *When an outcome results from a chain of defaults and omissions across a system, where does the "allowing" attach?*

  **Reasoning for Priority:**
  This is the synthesis year. Having defined the default (Phase 1) and the types of omission (Phase 2), the philosopher now addresses the "Institution/AI" thread directly. The problem here is the "Problem of Many Hands." If a harmful default was set by a coder, approved by a manager, and deployed by an algorithm, who "allowed" the harm?

  *   **Upstream/Downstream:** This is downstream of Phases 1 and 2. It applies the metaphysical tools to the social ontology.
  *   **Tractability:** Medium/Low. This is the hardest part for a solo theorist because it risks drifting into sociology. To keep it tractable, the philosopher should focus on the *logic of delegation*. When I delegate a decision to an algorithm's default, do I transfer the moral category of my action?
  *   **Why keep it last?** If you start here, you get bogged down in case studies. If you start with metaphysics, you can solve this via principle.

  ---

  ### What to Deprioritize (and Why)

  To make this work in three years, you must explicitly exclude questions that look central but are actually downstream dead-ends or empirical traps.

  **1. The "Moral Significance" Debate (Deprioritize)**
  *   *The Question:* "Does the doing/allowing distinction actually matter morally?"
  *   *Why Drop It:* This is the black hole of DAD literature. Some say it's fundamental; others say it's morally irrelevant compared to consequences or intentions. A three-year project cannot settle this.
  *   *Strategy:* **Bracket it.** Assume for the sake of the project that the distinction *can* matter (e.g., for legal liability or blame), and focus on *when the distinction obtains*. Clarifying the metaphysics is useful even if the normative weight is later debated.

  **2. AI "Intentionality" or "Consciousness" (Deprioritize)**
  *   *The Question:* "Can an AI truly intend to harm, or does it need consciousness to be an agent?"
  *   *Why Drop It:* This leads to speculative philosophy of mind with no resolution. It distracts from the structural ethics.
  *   *Strategy:* Focus on **functional agency**. It doesn't matter if the AI "wants" to harm; it matters if its functional role constitutes a "doing" or an "allowing" within the system. This keeps the work in ethics/metaphysics of action, not philosophy of mind.

  **3. Specific Empirical Case Studies (Deprioritize)**
  *   *The Question:* "How did Algorithm X cause harm in Industry Y?"
  *   *Why Drop It:* Your philosopher cannot do empirical work. Relying on news reports leads to shallow analysis.
  *   *Strategy:* Use **stylized cases**. Construct hypothetical algorithms that mirror real-world logic (e.g., "Consider a triage algorithm that defaults to...") without needing to audit real code. This preserves rigor without requiring data access.

  ### Summary of the Logic

  The ranking is driven by **metaphysical dependency**.

  1.  **Defaults** are the atomic unit of modern "allowing." You must define this first.
  2.  **The Bundle** is the taxonomy. You must know what *kind* of omission you are dealing with before assigning responsibility.
  3.  **Distribution** is the complex application. You can only solve the "many hands" problem if you have clear definitions of the hands (defaults) and the grip (omission types).

  **Risk Mitigation:**
  The biggest risk is that the project becomes too abstract. To counter this, the grant should require that every metaphysical claim be tested against a "non-person agent" scenario (AI or Institution). This ensures the "live stuff" constraint is met without forcing empirical work.

  **Success Metric:**
  The project succeeds not if it solves the DAD forever, but if it produces a **taxonomy of structural omissions** that allows ethicists to say, "This isn't just 'allowing harm'; this is 'architectural defaulting,' and here is why that differs from 'negligent monitoring'." That is a tractable, high-impact goal for three years.
