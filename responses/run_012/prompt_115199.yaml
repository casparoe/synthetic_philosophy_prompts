      Discounts for: Interest Relativity, Causal Exclusion, False Belief coherence.
      Result: 0.78.

      *Let's refine the "False Belief" section.* The chess engine example is perfect. The physical state is deterministic. The intentional state is "Queen is safe." The world state is "Queen is attacked." The mismatch *is* the belief. This supports realism.

