      *   *Target 2: Philosophical Commitments in Practice.* Scientists *do* have commitments (realism, causality, etc.). Sokal defended these. But the hoax doesn't prove these commitments don't need examination. It just proves scientists want to protect them from what they see as corrosive relativism.
      *   *Target 3: Cultural/Science Studies.* This is the bullseye. *Social Text* published it. It showed a lack of rigor in *that specific subfield* regarding natural science claims. It exposed ideological filtering over epistemic verification.
      *   *Target 4: The Editors.* They admitted they didn't check the physics because they viewed it as a cultural text, not a scientific contribution. This shows a category error in their editorial policy, not necessarily that *all* humanities scholarship is void.
      *   *Conclusion on Task 1:* The hoax is evidence against *sloppy* Science Studies, not PoS. It leaves internal scientific philosophy untouched. For the physicists' complaint to land, they need to conflate PoS with Cultural Studies.

  3.  **Deconstruct Task 2: What does the episode show about the claim itself?**
      *   *The Hoax as Argument:* A hoax is a performative contradiction. It says "Your norms are broken." But to say they are *broken*, you need to know what the norms *should be*.
      *   *Normative Foundation:* Sokal appealed to truth, rigor, and logical coherence. Where do those come from? Philosophy (epistemology/logic). So, using a hoax to dismiss philosophy is self-undermining. You need philosophy to justify why the hoax is damning.
