  - "score": an integer from 0 to 20, followed by no other value.
  - "letter_grade": a string, using the scale 18-20 = A, 16-17 = B, 14-15 = C, 12-13 = D, below 12 = F.
  - "verdict": a string of two to four sentences giving your overall judgment of the response.
  - "part_by_part": an array of four objects, one per part (a) through (d), each with "part" (the letter), "points_awarded" (a number), "points_possible" (a number), "status" (one of "correct", "partly_correct", "incorrect"), and "comment" (a string explaining the award).
  - "errors": an array of objects, one per substantive mistake you identify, each with "location" (the part of the answer where it occurs), "student_claim" (a short paraphrase of what the student asserts), "why_wrong" (a string explaining the error), "correction" (a string giving what the student should have said), and "severity" (one of "minor", "major").
  - "credit_worthy": an array of objects, each with "location" and "point", listing the moves that genuinely earned credit.
  - "grading_notes": a string explaining what would separate this response from a stronger one, so that I can use your assessment as a model for the rest of the stack.

  Write in American English.
