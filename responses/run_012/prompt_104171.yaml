      *   **Core Problem 2 (Temporal/Structural Comparison):** Comparison with modern hyperbolic discounting/dual-self models (planner vs. doer). The user suspects Augustine describes *synchronic* akrasia (conflict within a single moment/agent) vs. *diachronic* conflict (present self vs. future self). Can modern models capture this? What is lost?
      *   **Core Problem 3 (Role of Custom):** What is *consuetudo* (custom/habit) doing? Is it external force, internal habituation? Does modern theory have an equivalent?
