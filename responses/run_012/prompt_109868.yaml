prompt: |-
  I'm a uni student in a political philosophy course and we just finished Nozick. I'm suppose to write a paper on his views on animals, and I want to do it by analyzing a real episode: the Copenhagen Zoo killing Marius the giraffe in 2014. You know the one -- healthy young giraffe, zoo said they had to kill him to avoid inbreeding, other zoos offered to take him, they did a public dissection anyway and then fed him to the lions. I want to run that episode through Nozick's animal stuff. I know he floated the idea that we could be utilitarians about animals while being Kantians about people, and I think he later had doubts about that. But I don't want a book report on Nozick. I want you to act like a philosopher who knows this area cold and think carefully about whether his view actually helps us understand what the zoo did.

  Start with a short brainstorm where you lay out the possible readings of Nozick on animals and flag the tensions before you commit to one. Then give me these sections, in this order, with rough lengths:

  - Brainstorm (150-250 words)
  - The Nozickian lens (300-400 words): reconstruct the asymmetric view. What moral status does it give animals? What does it let us do to them, and what does it forbid? How does the Kantian side for people change the calculus?
  - Mapping the Marius case (400-500 words): who are the players, what options did they have, what would the Nozickian view say each should have done? Be specific about utility, genetic diversity, the lions, the public, the other zoos.
  - Where the theory breaks (300-400 words): what does the case show that the view can't handle? Is Marius a mere utility container, or does something about him resist that? Does the public reaction tell us anything about the theory, or just about us?
  - What the case does to the theory (250-350 words): does it confirm Nozick, complicate him, or refute him? Does it push toward more Kantian treatment of animals, or toward biting the bullet on utilitarianism for animals?
  - Bottom line (100-150 words): your verdict on whether Nozick's view can make sense of the Marius case, and what it would have to change to do so.

  Don't cite page numbers or give me reading lists -- I just need the argument. And please don't just tell me what Nozick said; tell me whether it works here.
