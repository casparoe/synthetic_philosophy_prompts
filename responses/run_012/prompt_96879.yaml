answer: |-
  Twenty of us silent on the wire,
  If exactly one sends word, he takes the fire.
  But if we think alike, we send to none,
  The pot stands firm at one million dollars.

  Now postcards come, and I may write any number,
  I plan to send one, rouse myself from slumber.
  But I see a hundred cards upon the table,
  The pot slips down to ten thousand dollars.

  To win the draw, my entries must match theirs,
  If they send hundred, I send hundred pairs.
  My stack grows thick, ten thousand in the hall,
  The pot burns low to one hundred dollars.

  I write exponents, the ink begins to flow,
  If they raise high, I must raise them low.
  A million sheets of paper fill the bin,
  The pot cuts deep to one single dollar.

  The room is full of paper, floor to beam,
  I multiply to stay inside the dream.
  One hundred million entries in the spin,
  The pot bleeds out to one cent.

  I write a one with zeros past the stars,
  A googolplex to heal the logical scars.
  The clerk cannot find where the winner lies,
  The pot dissolves to infinitesimal dollars.
