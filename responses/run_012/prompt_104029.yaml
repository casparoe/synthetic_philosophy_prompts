answer: |-
  ### I. The Candidate Principle

  After testing your verdicts against the standard solutions to the paradox (make-believe, catharsis, compensation, etc.), it is clear that no single mechanism explains all your reactions. The "make-believe" theory fails your documentary case (you know it's real, but that's *why* you reject it). "Catharsis" fails your re-watch case (you aren't purging a pre-existing emotion). "Compensation" fails your child-death case (you value the work but deny the enjoyment).

  Your tentative principle ("earned" vs. "engineered") is close, but it conflates **valuing a work** with **enjoying the emotion**. Your verdict on the child-death tragedy proves this: you call the work "great" (Value) but say you "cannot enjoy it" (Enjoyment). The paradox dissolves if we admit we often value art *because* it pains us, even if we do not *like* the pain itself.

  Here is the repaired principle, precise enough for application:

  **The Principle of Aesthetic Necessity and Moral Containment**

  1.  **Clause of Necessity:** A painful emotion is to be valued when it is **constitutive** of the work's truth (i.e., the work would be a lie or incoherent without this pain).
  2.  **Clause of Containment:** A painful experience is to be sought when the object of the emotion is **framed** as art or fiction, suspending the demand for immediate practical action.
  3.  **Clause of the Moral Veto:** **Enjoyment** of the pain is permitted only when the specific content does not trigger a deep moral prohibition that resists aesthetic sublimation (distinguishing *valuing the work* from *enjoying the feeling*).

  ***

  ### II. The Cases That Force the Clauses

  *   **Clause 1 (Necessity) is forced by Case 8 and Case 7.**
      *   *Case 8 (Unearned Sadness):* You feel "cheated." This proves that pain alone is insufficient; it must be logically required by the preceding narrative. If the sadness is gratuitous, the work fails.
      *   *Case 7 (True to Character):* You prefer the sad ending. This proves that "truth to the character" overrides "hedonic pleasure." The pain is valued because it is the *only* true ending.
      *   *Repair to your view:* This clause also forces a reinterpretation of **Case 4 (Wordless Song)**. You say you "cannot say what it is about." For this principle to hold, the song must be about *something*—even if only an emotional contour. If it were truly random noise, it would not be "earned." The sadness must be necessary to the musical structure, not just arbitrary.

  *   **Clause 2 (Containment) is forced by Case 2 and Case 9.**
      *   *Case 2 (Famine Documentary):* You feel you have "no right to look." The frame is broken; the reality of the suffering demands action, not contemplation. The pain is not contained; it spills into the real world.
      *   *Case 9 (Friend Grieving):* "No enjoyment... no sense in which it is good." Real grief imposes a moral obligation to comfort, not to appreciate. The lack of an aesthetic frame makes the pain purely negative.
      *   *Repair to your view:* This clarifies **Case 5 (Tear-jerker)**. You call it "manipulative." Under this principle, it fails not just because it is engineered, but because it attempts to simulate the *moral demand* of real tragedy (Case 2) without the *truth* (Case 1). It breaks containment by trying to act on you like reality.

  *   **Clause 3 (Moral Veto) is forced by Case 6.**
      *   *Case 6 (Child Dies):* You state the work is "great" (satisfies Necessity and Containment) but you "cannot enjoy it." This overturns your tentative principle's claim that you enjoy sadness when it is earned. Here, the sadness is earned, but the content (death of a child) triggers a moral veto that blocks *enjoyment*, though not *valuation*.
      *   *Repair to your view:* You must accept that **Valuation $\neq$ Enjoyment**. The Paradox of Tragedy is often stated as "Why do we enjoy pain?" Your verdicts suggest the real question is "Why do we value works that cause pain we do not always enjoy?"

  ***

  ### III. Verdicts on New Cases

  Applying the **Principle of Aesthetic Necessity and Moral Containment**:

  1.  **A tragedy in which innocents suffer horribly but the work is very beautiful.**
      *   *Verdict:* **Value Yes, Enjoyment No.**
      *   *Reasoning:* Satisfies Necessity (beautiful/coherent) and Containment (fiction). However, like Case 6, the suffering of innocents likely triggers the Moral Veto. You will admire the craftsmanship but feel a resistance to the pleasure of the experience.

  2.  **A sad film about a real historical atrocity.**
      *   *Verdict:* **Value Conditional, Enjoyment Unlikely.**
      *   *Reasoning:* This tests the boundary of Containment. If the film treats the atrocity with solemnity that respects the victims (Necessity), you may value it. But if it feels like "spectacle" (breaking Containment), you will react as in Case 2 (Famine). You will likely feel a duty to witness it, but not "enjoy" it.

  3.  **A sad song I love until I learn it is about the singer's own dead child.**
      *   *Verdict:* **Enjoyment Diminished or Lost.**
      *   *Reasoning:* This shifts the object from Case 4 (Wordless/Abstract) toward Case 9 (Real Grief). Knowing the pain is real, not stylized, threatens the Containment. The song becomes a document of suffering rather than an expression of it. You may still value the beauty, but the "love" (enjoyment) will likely curdle into discomfort.

  4.  **A video game in which I deliberately choose the sad ending.**
      *   *Verdict:* **Value Yes, Enjoyment Yes.**
      *   *Reasoning:* Your agency reinforces Necessity. Because *you* chose the truth of the character (Case 7), the sadness is fully earned by your own will. Containment is secure (it is a game). The Moral Veto is lowered because the tragedy is a consequence of your own aesthetic choice, not imposed helplessness.

  5.  **Grief for a fictional villain.**
      *   *Verdict:* **Value Yes, Enjoyment Yes.**
      *   *Reasoning:* The Moral Veto is lowered. Because the object is a "villain," the suffering does not trigger the same protective prohibition as the child or the innocent. The sadness is likely mixed with complex empathy, which is aesthetically rich (Necessity) and safe (Containment).

  6.  **A sad film I admire but never want to see again.**
      *   *Verdict:* **Value Yes, Enjoyment No (Retrospectively).**
      *   *Reasoning:* This mirrors Case 6. The work satisfies Necessity and Containment (you admire it), but the intensity of the pain exceeds your threshold for repeat exposure. This confirms that *seeking* the art once (to value it) is different from *seeking* the emotion repeatedly (enjoyment).

  ***

  ### IV. Overturned Verdicts

  To maintain philosophical consistency, the Principle requires you to adjust or clarify the following verdicts from your original list:

  1.  **Your Tentative Principle ("I enjoy a sadness... when... earned"):**
      *   *Correction:* This must be rejected. Case 6 (Child Death) proves you can find sadness "earned" (the work is great) without enjoying it. You must distinguish between **respecting the necessity of the pain** and **taking pleasure in it**.
  2.  **Case 4 ("Wordless sad song... cannot say what it is about"):**
      *   *Correction:* You must accept that the song *is* about something, even if not narratively. For the sadness to be "earned" (Clause 1), it must be fitting to the musical structure. If it were truly about nothing, it would be arbitrary, and you would likely feel "cheated" (Case 8). The "aboutness" is the emotional contour itself.
  3.  **Case 1 vs. Case 10 (Film with illness / Re-watching):**
      *   *Correction:* Your tentative principle implies the sadness is a response to "what the work presents." In Case 10, you know the presentation. This confirms that the value lies in the **contemplation of the necessity**, not the shock of the event. You are not enjoying the *surprise* of the death, but the *rightness* of its depiction.

  ***

  ### V. Limitations and Honest Statement

  **Where the Distinctions Collapse:**
  This principle cannot fully disentangle **Enjoyment**, **Valuation**, and **Being Moved**. In Case 3 (Hero's Flaw), you describe the pain as "exhilarating." In Case 1 (Illness), you "sob." Both are valued. The principle treats these as the same category of "Aesthetic Necessity," but phenomenologically they are different. One is Sublime (power), the other is Pathos (vulnerability). The principle groups them together for the sake of logic, but it cannot explain why one feels like power and the other like surrender.

  **Where I Am Making a Judgment Call:**
  The **Moral Veto (Clause 3)** is the unstable element. I have placed "Child Death" (Case 6) on the "No Enjoyment" side, and "Villain Grief" on the "Enjoyment" side. This is not a logical derivation but a mapping of your specific psychology. Another person might enjoy the child tragedy (finding it cathartic) or reject the villain grief (finding it unjustified). The principle identifies *that* there is a veto, but it cannot objectively define *where* the veto line is drawn. That is a matter of individual moral sensibility, not aesthetic logic.

  **Is the Paradox an Artifact?**
  Yes. The "Paradox of Tragedy" assumes we are trying to explain why we *like* feeling bad. Your verdicts (specifically Case 6 and Case 9) suggest the paradox is an artifact of confusing **liking the feeling** with **liking the work**.
  *   We do not seek the pain *qua* pain.
  *   We seek the **truth** that the pain guarantees.
  *   Sometimes the truth is too costly to enjoy (Case 6), but we still value the work for telling it.
  *   Sometimes the pain is fake (Case 5), and we reject the work for lying.

  The puzzle is not "Why do we enjoy sadness?" It is "Why do we demand truth even when it hurts?" Your verdicts answer this: because a happy lie (Case 8) feels like a cheat, and a real demand (Case 2) feels like a violation. We want the **safety of the frame** with the **integrity of the pain**.
