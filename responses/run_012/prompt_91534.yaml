answer: |-
  **The question**
  Standard foundations discourse treats the consistency of Peano Arithmetic (PA) as a binary, settled matter, usually assumed true. This proposal argues that "Is arithmetic consistent?" conflates two distinct queries that require separation. First, the ontological question: does there exist a derivation of a contradiction within PA, regardless of length? Second, the feasible question: is there a derivation of a contradiction accessible to human or computational verification within physical constraints? The core hypothesis is that these questions can come apart. The interesting philosophical terrain lies not in the standard case, but in the divergent scenarios: PA is inconsistent, but the shortest proof exceeds physical limits; or PA is consistent, but indistinguishable from inconsistency within feasible bounds. Clarifying this distinction is necessary to evaluate what actually hangs on arithmetic consistency for mathematical practice. The project seeks to map these scenarios.

  **Why it's still open**
  Current positions often stall between dogmatic realism and defensive formalism. Realists assume consistency based on the existence of a standard model, while formalists rely on relative consistency proofs or empirical track records. Neither addresses the feasibility gap. Gödel's second incompleteness theorem blocks internal proof, but external arguments often rely on intuitions about infinity that ignore resource bounds. Simply asserting "PA is probably consistent" ignores the possibility of ultra-long contradictions. If a contradiction exists but requires more symbols than atoms in the universe, standard consistency claims remain technically true but practically vacuous. Conversely, if no contradiction exists but feasible fragments behave inconsistently, practice might need adjustment regardless of ontological truth. The literature lacks a systematic analysis of how resource bounds interact with consistency claims. Without separating the metaphysical status of PA from the epistemic access to it, we cannot determine whether consistency is a working assumption or a necessary truth. Most discussions treat feasibility as a pragmatic footnote rather than a conceptual variable. This project challenges that by showing how the divergence between ontological and feasible consistency leaves existing stances unable to guide practice in edge cases.

  **How I'd actually do it**
  The method is conceptual analysis grounded in proof theory and complexity. I will begin by formalizing the distinction between classical consistency and "feasible consistency," drawing on bounded arithmetic and ultrafinitist critiques without endorsing their extremes. Month one involves mapping the logical space: defining the thresholds where a proof becomes unsurveyable and categorizing the four possible combinations of ontological/feasible status. I will construct thought experiments describing mathematical practice under each combination. For instance, if PA is inconsistent but only via unreachable proofs, does induction remain valid for applied work? Month two focuses on case studies. I will examine historical instances where consistency worries shifted practice, such as the foundational crises of the early 20th century, and re-evaluate them through the feasibility lens. I will also analyze current computational verification limits to establish realistic bounds for "surveyability." Month three synthesizes these findings into a framework for assessing risk. The output will be a paper distinguishing the normative implications of each scenario. I will avoid getting bogged down in technical proof theory beyond what is needed to define the bounds. The focus remains on the philosophical implications for practice, not on generating new consistency proofs. The deliverable is a clear argument that the feasibility distinction dissolves certain philosophical anxieties while highlighting others. Specifically, I will draft the taxonomy in weeks 1-4, develop the practice-implication arguments in weeks 5-8, and finalize the manuscript in weeks 9-12.

  **What would count as an answer, and as a bust**
  Success looks like a rigorous taxonomy showing that practical mathematical norms depend on feasible consistency, not just ontological consistency. If I can demonstrate that mathematicians would (or should) act differently in the divergent scenarios, the project succeeds. A successful answer clarifies whether consistency is a pragmatic tool or a metaphysical constraint. A bust would occur if the distinction collapses—if feasible consistency turns out to be identical to classical consistency under scrutiny. Another failure mode is getting lost in technicalities: if the project devolves into proving bounds on proof lengths rather than analyzing the philosophical consequences, it misses the grant's scope. Similarly, if the analysis shows that practice would *never* change regardless of the scenario, the distinction is philosophically inert. The project fails if it concludes that the difference is purely semantic with no normative force for how mathematics is done. The goal is to show the distinction has teeth, not just to define it.

  **Time and scope**
  This scope fits a three-month part-time timeline because it avoids new technical proofs. The main risk is the historical case studies; if reviewing foundational crises becomes too detailed, I will cut them and focus solely on contemporary practice. The core conceptual distinction is the priority. If the taxonomy proves too complex, I will reduce the four scenarios to two: consistent/feasible and inconsistent/unreachable. This ensures a complete draft is ready by the deadline, even if nuanced middle cases are deferred.
