      *   **Move 2 (Peter):** Superrationality / Kantian / Newcomb-esque. Choices are not independent because agents are in the "same situation under the same description". If I hold, you hold. Choice is between (Hold, Hold) and (Bolt, Bolt). $200k > $40k.
