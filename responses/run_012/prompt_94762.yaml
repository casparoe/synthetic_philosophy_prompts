          *   *Rating:* Defensible but incomplete (relies on a specific, contested decision theory and ignores the stake asymmetry).

      *   **Move 3 (Nadia):** Counter to Peter. Correlation assumption is unjustified. Stakes differ, so reasoning differs (utility functions differ). Even if twins (same reasoning), mutual bolting is also a fixed point of identical reasoning (if I think you'll bolt, I bolt). Superrationality presupposes cooperation.
