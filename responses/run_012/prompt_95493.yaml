  The glow of the tablet was the only light in Leo's apartment. It was 3:14 AM, the hour when the brain stops filtering noise. He scrolled through the thread on *VoidWalkers*, a subreddit-adjacent forum that had migrated to encrypted servers last year. The topic header was bold: *Is it just burnout or is it VA?*

  Volitional Attenuation. The acronym tasted like metal.

  Leo read the top post, written by a user named *KiteString*. "It's not that you can't move," *KiteString* wrote. "It's that the signal degrades before it hits the muscle. You want the water. You see the water. But the command to reach dissolves in the air between you and the glass."

  Leo stopped scrolling. He looked at the half-empty glass on his coaster. He wanted to lift it. He felt the intention form, a bright spark in his chest. Then he watched the spark fade, not into fatigue, but into a static haze. He didn't reach for the water. He hadn't moved in twenty minutes.

  Before tonight, this was just laziness. Just anxiety. Now, reading the comments, it had structure. It had a shape. There were fifty-three replies below, each one adding a brick to the architecture of the thing. Someone mentioned a specific tremor in the left hand during decision paralysis. Leo looked at his left hand. It was trembling. He hadn't noticed it until he read the comment. Now he couldn't stop noticing it. The name didn't just describe the feeling; it tightened the screw on it. He screenshotted the criteria list and saved it to a folder labeled *Medical*.

  ***

  Dr. Aris Thorne rubbed his temples. The conference room at St. Jude's Memorial smelled of stale coffee and ozone. On the screen behind him, the histogram glowed green.

  "The v1.0 criteria were based on self-reported data from online communities," Aris said, pointing to the spike in the middle of the graph. "But the patients walking through our doors now… they don't match the original cluster."

  Across the table, Senior Consultant Halloway leaned back. "Are they malingering?"

  "No," Aris said. "They're conforming."

  Aris clicked to the next slide. It showed neurochemical panels. "When we drafted v1.0, we looked for elevated cortisol and suppressed dopamine during task-initiation protocols. That was the biological signature *KiteString* and the early adopters described. But the cohort we screened last month? Their cortisol is baseline. Their dopamine dips, but only after they verbalize the inability to act."

  Halloway squinted. "So the biology changed."

  "The behavior changed, which changed the biology," Aris said. He didn't elaborate on the chicken or the egg. He didn't need to. The data was clear. The patients came in having read the v1.0 checklist. They knew what the clinic was looking for. They knew that if they showed high cortisol, they qualified for the disability tax credit. But more than that, they knew what *Volitional Attenuation* was supposed to feel like. They were embodying the diagnosis so thoroughly that their endocrine systems were adjusting to meet the specification.

  "We need a v1.1," Halloway said. "Update the markers."

  "If we update the markers," Aris said, "they'll change again."

  "Then we update them faster."

  ***

  The *VoidWalkers* server went dark on a Tuesday. A terms-of-service violation, the banner said. Content promoting self-harm through inaction. The niche had collapsed.

  Leo felt the loss physically. For six months, the forum had been the container for his symptoms. It was where he went to verify that his tremor was real, where he went to compare notes on the specific quality of the static haze. Without it, the symptoms began to drift. Was the tremor essential to VA, or was it just *his* VA? Without the community consensus, the diagnosis felt porous.

  Then he got the letter from St. Jude's. The clinic had absorbed the community. They were offering free screening for Volitional Attenuation Syndrome, now codified in the regional health manual. The niche hadn't died; it had just been institutionalized.

  Leo sat in the examination room. The walls were soft blue, designed to lower heart rates. A nurse drew his blood. Then came the task battery. He sat before a screen with two buttons. *Left for Yes, Right for No.* Simple questions. *Do you like rain?* *Is four greater than two?*

  He knew the v1.0 criteria. He knew the clinic was looking for the degradation of signal. He felt the intention to press the button. He also remembered the forum posts about *performative latency*—the idea that delaying the press proved the attenuation.

  Leo waited. He let the intention hang in the air, watching it dissolve. He waited until the static haze rolled in, thick and familiar. He waited until his left hand began to tremble. He pressed the button.

  The machine logged the reaction time. It logged the tremor frequency. It logged the cortisol spike that hit his bloodstream exactly when he decided to let the signal fail. He wasn't sure if he was having the symptom or producing it. He only knew that if he produced it correctly, he would get the help he needed to function. To function, he needed the diagnosis. To get the diagnosis, he had to be broken in the specific way the manual described.

  ***

  Aris sat alone in the lab. The v1.1 manual was ready for print, but the data from the latest screening batch was already flagging anomalies.

  He pulled up the files for the patients who had been screened under v1.0 versus the new batch screened under v1.1. The difference was stark. The v1.0 patients had high cortisol and random motor degradation. The v1.1 patients—those who had been screened after the criteria were leaked online—had normal cortisol but distinct theta-wave decay in the prefrontal cortex during the decision task.

  They had stopped stressing about the cortisol because the manual said cortisol wasn't the primary marker anymore. They had started focusing on the mental static, because the manual said the static was the core symptom. Their brains had listened. The neural pathways had pruned themselves to match the new map.

  Aris typed a note into the committee draft for v2.0. *Recommendation: Shift focus from motor latency to cognitive dissonance metrics.*

  He stopped typing. He looked at his own hands. He had been working on this diagnosis for three years. He knew the criteria by heart. Sometimes, when he was tired, he felt the static. He would stare at his keyboard, intending to type, and feel the command dissolve. He would wait for the tremor. It never came. But the hesitation did.

  Was he studying the patients, or were they studying him? The clinic was the niche now. The manual was the ecosystem. If he changed the definition, the species would mutate to survive within the new boundaries. If he left it alone, the species would stagnate and die out as the cultural context shifted.

  He hit *Save*. The version number ticked over. v2.0.

  ***

  Leo sat on his couch. The tablet was dark. He had received the confirmation email an hour ago. *Diagnosis: Volitional Attenuation Syndrome, Type B.*

  Type B was new. It wasn't in the leaked drafts. It wasn't on the forum archives he'd saved. It was something the clinic had invented after seeing him, after seeing thousands like him, after seeing how they all shifted when the wind changed.

  He looked at the glass of water. He wanted to drink it. He felt the intention form. He waited for the static. He waited for the tremor.

  But the email had mentioned a new treatment protocol for Type B. It involved neurofeedback. It involved retraining the brain to ignore the degradation signal. To get the treatment, he had to demonstrate the specific Type B decay pattern during his next visit. He had to show them the new way of breaking.

  He looked at his hand. It was still. He tried to summon the tremor, the old faithful friend. It felt distant, like a memory of a limb that had been amputated. He tried to summon the static. It was thinner now, patched over by the knowledge of Type B.

  He realized he would have to learn how to be sick in a new way. He would have to practice the decay until it was real enough for the machine to read. He closed his eyes and focused on the space between the thought and the action. He widened it. He stretched the gap until it felt like a canyon.

  Down in the lab, Aris watched the incoming data stream. The aggregate curve was shifting again. The theta-wave decay was flattening out, replaced by a new spike in beta activity during hesitation. The patients were adapting to v2.0 before he had even published the guidelines.

  He picked up his pen to write a memo about the anomaly. He paused. The pen hovered over the paper. For a second, just a second, the command to write dissolved in the air. The static rolled in. He felt the tremor in his index finger.

  He watched it happen. He knew why it was happening. He knew that watching it made it stronger. He knew that writing it down would make it real for the next batch of patients who would read his words and learn to tremble exactly like this.

  Aris put the pen down. He waited for the feeling to pass. It didn't. It settled into his bones, comfortable and familiar. He opened a new document and began to type the criteria for v2.1, describing the tremor exactly as he felt it, knowing that by the time he finished, neither he nor the patients would feel it that way anymore.

  Leo lifted the glass. The water tasted neutral. He drank. He felt the liquid go down. He waited to feel better. He waited to feel worse. He waited for the next update.
