  So can you take it apart for me? I want the distinct precise things that sentence could be asserting, laid out as a menu rather than one explanation, going from the completely trivial logical point up to the strong probabilistic and normative versions. For each one I want: exactly what it commits you to, whether it's a platitude, a genuinely substantive and defensible claim, or false as stated, and whether that particular reading is one that would actually get him his conclusion. My suspicion is that the version that's actually correct comes with a condition attached (something about likelihoods -- whether the thing is more likely to be missing under the theory than under its rivals), and I want that spelled out properly, including the awkward case of a theory that makes no distinctive prediction at all and whether it even has the kind of likelihood you'd need to run that test. Also flag where the slogan is being used as a thought-stopper rather than as a premise. Don't hedge everything into mush, I want verdicts I can quote back at him.

