answer: |-
  Does the informational role of market prices survive the no-trade theorems if information aggregation is treated as a public fixed point rather than a private revelation? This project investigates the tension between two dominant strands of economic theory: the no-trade results, which suggest that speculative trade based on private information should vanish among rational agents with common priors, and the epistemic conception of markets, which treats prices as summaries of dispersed knowledge. The no-trade theorems imply that the mere willingness of a counterparty to trade signals private information that cancels any expected gain, thereby preventing the trade from occurring. Yet, market practitioners and theorists alike rely on the intuition that prices coordinate behavior by encoding information that no single agent possesses. The standard resolution assumes that trade occurs because of liquidity needs or heterogeneous priors, treating information-driven speculation as a theoretical defect. This project argues that this resolution misses a more basic structural issue: the no-trade results constrain trades, but prices are not trades. A price can be informative in an equilibrium with no trade at all. The central task is to determine whether the informational role of prices is parasitic on the very trades the no-trade theorems prohibit, or whether it rests on a distinct mechanism of aggregation that survives the prohibition on speculative exchange.

  To resolve this, the project distinguishes between two ways a price can carry information. Revelation occurs when a price encodes information because the agents setting it knew things; the price is a window onto private knowledge revealed through the act of trading. Aggregation occurs when the price is a device that makes dispersed information usable by people who never had it and never learn whose it was; the informational work is done by the publicness of the price rather than by anyone's willingness to bet. The no-trade results directly threaten Revelation, since it requires someone to trade on a difference in information. Aggregation, however, may be untouched by them, since it requires only that a price exist and be public. The critical vulnerability of the aggregative story is that for a price to do aggregative work, it must be common knowledge that it is informative. If nobody treats the price as a signal, it conveys no signal. Whether a price is informative depends on whether the trades behind it are informative, which is precisely what the no-trade results say cannot be taken for granted. Thus, the aggregative story looks self-referential—a fixed point rather than a straightforward mechanism. Whether that fixed point is benign, a stable equilibrium in which prices are informative because everyone treats them as informative, or vicious, an infinite regress in which the information never gets in, is a genuine open question that existing literature leaves unresolved.

  Current theoretical frameworks leave this question open because they presuppose the answer they seek. The rational-expectations treatment of prices assumes that agents correctly infer information from prices in equilibrium, but it does not explain how the information enters the price without triggering the no-trade contradiction. It posits the fixed point without demonstrating its stability. The Hayekian treatment of dispersed knowledge assumes the price system solves the knowledge problem by default, focusing on the efficiency of the outcome rather than the consistency of the epistemic mechanism. It treats the price as a miracle of coordination without addressing the strategic incentives that might prevent the coordination from forming. The moral drawn from the no-trade results is that speculative trade requires heterogeneous priors or a failure of common knowledge, treating these as defects rather than features. This position shuts down the inquiry into how information might aggregate without speculative trade, assuming that if trade cannot be justified by information, information cannot be aggregated. Finally, the conciliatory side of the epistemology of disagreement focuses on identified speakers in a conversation. It analyzes how agents should update when they know who holds which belief. In a market, the informative event is a number, and the identity and motives of the traders behind it are typically invisible. Applying the epistemology of conversation to the market ignores the structural anonymity that may license the informational externality to do its work, or exactly what blocks it. None of these positions address the self-referential loop of aggregative information where the validity of the signal depends on the common belief in its validity.

  The method of this project is conceptual reconstruction with light formalism. I will reconstruct the arguments premise by premise to identify which premise the market epistemologist must abandon to preserve the informational role of prices. The work will not involve running regressions or reviewing literature, but rather working out the fixed-point condition logically. I will model the price not as a result of trade, but as a public signal that agents condition on prior to trading. The analysis will determine whether the condition "prices are informative because agents treat them as informative" can be satisfied without violating the no-trade constraints. A key component of this method is analyzing the role of anonymity. In a conversation, the informative event is an utterance by an identified speaker, so the epistemology of disagreement becomes an epistemology of speech. In a market, the anonymity of traders may be exactly what licenses the informational externality to do its work. If agents cannot identify who is trading on information versus who is trading for liquidity, they cannot fully unwind the signal, which may prevent the no-trade result from triggering. I will take the position that anonymity is the crucial variable that allows the fixed point to be benign rather than vicious. By obscuring the motive behind the trade, anonymity prevents the counterparty from fully updating on the private information of the trader, thereby allowing the price to move without cancelling the gain. The project will formalize this intuition to show whether anonymity functions as a necessary condition for the aggregative mechanism to survive the no-trade theorems.

  To ground this conceptual work, the project will use three concrete cases. First, the small share of trading volume plausibly driven by information as against liquidity and hedging. If most trade is liquidity-driven, the no-trade theorem should not apply, yet prices remain informative. The project will analyze whether the presence of liquidity traders is sufficient to sustain the fixed point for the informed traders, or if the informed traders would still exit due to the risk of trading against other informed agents. Second, the prohibition of insider trading serves as the purest case of a trade that is information-driven and that we forbid anyway. If information-driven trade is theoretically impossible under common priors, the legal prohibition is redundant. If it is possible, the prohibition suggests that the informational role of prices relies on trades that are socially or theoretically illicit. The project will examine whether the prohibition protects the aggregative mechanism by preserving the anonymity of the remaining traders. Third, prediction markets, where prices are supposed to be informative even though participants may be trading for reasons other than being right. These markets often function with high informational efficiency despite low stakes and high noise. They provide a test case for whether the aggregative fixed point holds when the incentive to trade on information is weak. By analyzing these cases, the project will determine whether the informational role of prices is robust or fragile.

  A successful result will look like a formal condition specifying when the aggregative fixed point is stable. Showing that the informational role of prices survives means demonstrating that there exists a set of conditions under which agents can treat prices as informative without triggering the no-trade contradiction, specifically relying on anonymity and liquidity noise. Showing that it does not survive means proving that any attempt to treat prices as informative collapses back into the no-trade result unless heterogeneous priors are assumed. A project failure would be the inability to distinguish the aggregative mechanism from the revelatory mechanism, resulting in a circular argument that assumes what it sets out to prove. Another failure mode is producing a formal model that is too abstract to engage with the concrete cases, rendering the philosophical distinction practically irrelevant. The goal is to show that the market epistemologist must abandon the premise that prices reveal private knowledge directly, replacing it with the premise that prices aggregate public signals stabilized by anonymity.

  The scope of this project is realistic for a single semester of work. The core deliverable is a paper establishing the conceptual distinction between Revelation and Aggregation and deriving the fixed-point condition. This involves reconstructing the no-trade argument and the rational-expectations argument to find the point of divergence. The formalism will be limited to a partial equilibrium model of the fixed point, avoiding the complexity of a full general equilibrium system. The honest assessment of scope is that the general equilibrium modeling is likely too big for the semester. I will cut the requirement to prove existence and uniqueness of the equilibrium in a multi-agent setting. Instead, I will focus on the logic of the update rule for a representative agent facing an anonymous price signal. The empirical validation of the concrete cases will also be limited to conceptual analysis rather than data collection. I will not attempt to measure the share of informed trading volume, but rather analyze the theoretical implications of that share being small. By limiting the formalism and the empirical scope, the project remains defensible as a philosophical contribution to economic theory rather than an attempt to solve the general equilibrium problem. The result will be a rigorous argument that clarifies whether the market's epistemic role is a stable feature of rational exchange or a theoretical illusion sustained by ignoring the conditions of its own possibility.
