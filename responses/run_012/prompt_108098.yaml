answer: |-
  The clock on the wall of the Chamber of Review ticked with a sound like a gavel striking wood. It was 03:45. The Second Decadal Certification of the Codex was due at 09:00.

  Dr Elena Voss, Chair of the Constitutional Codification Board, rubbed her temples. Before her lay the thick binder of the Reflexive Statutes, the amendment package that had taken five years to draft. For the first time, the Polity of Syntaxis had legalised self-reference. Precedents could now cite their own provability status. The Code was no longer merely a tool for adjudicating property or tort; it was a formal system sufficiently strong to encode arithmetic, and by extension, statements about its own rulings.

  'We cannot sign,' said Julian Thorne. He was the junior member, a brilliant syntactician who had grown gaunt over the review period. He tapped the draft certificate. 'To sign is to certify consistency. To certify consistency is to claim we have derived the statement *Con(Codex)* within the Codex.'

  'We have not derived it,' admitted Sarah Jenkins, the senior logician on the Board. She was staring out of the window at the rain slicking the cobblestones of the capital. 'But that is expected.'

  'Expected?' Thorne's voice rose, cracking slightly. 'The Constitution requires us to certify that no two derivable rulings contradict one another. If we cannot derive that fact using the rules we are certifying, then the certification is a lie.'

  Jenkins turned from the window. 'The Second Incompleteness Theorem, Julian. If the Codex is consistent, it cannot prove its own consistency. The absence of a proof is not evidence of absence. It is a structural feature of any system complex enough to govern a modern state.'

  'It is a failure of utility,' Thorne countered, shuffling his papers. 'If the law cannot validate its own coherence, it relies on something outside itself. What? Whim? Intuition? If we cannot demonstrate consistency from the axioms up, then for all legal purposes, the system is arbitrary. We are signing a blank cheque.'

  Voss interjected softly. 'The requirement is to certify consistency, not to prove it within the object language. The Board operates in the meta-language. We observe the Codex from the outside.'

  'And what validates the meta-language?' Thorne leaned forward, his eyes bright with a feverish exhaustion. 'Another system? And what validates that? You invite an infinite regress. Or you stop at a system you simply *assume* is sound. That is not law. That is faith.'

  'It is mathematics,' Jenkins corrected. 'We can prove the consistency of the Codex using a stronger system. Zermelo-Fraenkel set theory with an additional inaccessible cardinal, if necessary. We do not need the Codex to prove itself. We need us to prove it about the Codex.'

  'But the Constitution says the Board must certify the Code,' Thorne insisted. 'It does not say the Board must certify the Code plus a stronger set theory that the citizens cannot access. The law must be self-contained. If the Code is silent on its own health, that silence is itself a diagnosis of disease.'

  Voss felt the familiar wince of a logician hearing a category error dressed as a profound insight. Thorne was sliding from *unprovability* to *falsehood*. He was arguing that because $\neg \vdash Con$, therefore $\neg Con$.

  'Julian,' Voss said, keeping her tone neutral. 'Gödel does not show that the system is inconsistent. He shows that the proof of consistency lies outside the system. The truth of the consistency statement outstrips the derivability within the system. That is the gap we are paid to bridge.'

  'Then the law is incomplete,' Thorne said, standing up. 'If there are truths about the legal code—such as its own consistency—that cannot be reached by legal deduction, then the legal code is not the final authority. There are legal truths the courts cannot reach. That renders the judiciary obsolete. We are certifying a broken machine.'

  'We are certifying a machine that works precisely because it knows its limits,' Jenkins said, her voice hardening. 'If you sign the dissent, you must state the logical ground clearly. You cannot claim the Code is inconsistent merely because it cannot prove itself consistent.'

  Thorne picked up his pen. 'I will state that the Board has failed to produce a derivation. I will state that without such a derivation, the claim of consistency is unsupported. I will not claim it is false, only that it is unverified.'

  'That is not what your draft says,' Voss said, sliding a page toward him. 'Paragraph four reads: "The inability of the Codex to generate a proof of its own coherence constitutes positive evidence of internal contradiction."'

  Thorne paused. He looked at the sentence. It was the hinge of the matter. He knew, intellectually, that unprovability did not entail inconsistency. A consistent system cannot prove its own consistency. But the procedural pressure, the weight of the Constitution demanding a binary yes/no on a property that was logically elusive, had twisted his reasoning. He wanted the law to be complete. It was not. Therefore, he concluded, it was broken.

  'It is the only honest conclusion,' Thorne said, though his voice lacked its earlier conviction. 'If we cannot show it works, we must assume it does not. In engineering, if a bridge cannot bear a load test, we condemn it. We do not say, "The test is impossible for this bridge."'

  'A bridge is physical,' Jenkins said. 'Logic is not. You are conflating epistemic access with ontological status. Just because we cannot see the consistency from inside the room does not mean the walls are collapsing.'

  'The citizens live inside the room,' Thorne snapped. 'They cannot see the outside. To them, the uncertainty is the same as chaos.'

  Voss looked at the clock. 04:15. They had hours left, but the decision was made. The Board was split. The certification would proceed with a dissenting opinion. It was a procedural outcome, not a logical resolution. The Code would remain in force, not because its consistency was proven within itself, but because the Board, operating in the meta-system, deemed it sound.

  'Sign it,' Voss said. 'Sign the dissent as written. The record will show the error. Future Boards will correct it.'

  Thorne signed. He did not look at Jenkins. He looked at the Codex, a thick volume of rules that could speak about itself but could not vouch for itself. He felt a profound unease, not because the system was inconsistent, but because it required them to stand outside it to save it. He had wanted the law to be a closed circle. It was an open spiral.

  'Adjourned,' Voss said.

  As they packed their files, Jenkins lingered. 'You know,' she said to Thorne, 'if the Code were inconsistent, it would prove everything. Including its own consistency.'

  Thorne stopped packing. 'I know.'

  'Then your dissent claims the system proves nothing, while simultaneously claiming it proves its own collapse. You've contradicted yourself in the meta-language, Julian.'

  Thorne zipped his bag. 'Then let the next Board prove me wrong. I'm going home.'

  He left the chamber, leaving the Codex on the table. It sat silent, consistent, and unable to say so.

