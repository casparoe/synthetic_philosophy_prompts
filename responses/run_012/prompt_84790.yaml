      *   *Section 3: Evaluating the Conclusion.* The "All information is in the sequence" claim fails. It ignores the inherited cellular structure.
      *   *Section 4: Better Metaphors.* Recipe is good. "Developmental System" is the technical term. Let's use "Recipe" but explain the "Kitchen" inheritance. Or "Score." Let's go with **Recipe** because it highlights the *process* aspect better than Program (which implies execution). Actually, **"Blueprint"** is the usual target, "Program" is the modern version. The counter is often **"Recipe"** or **"Script."** I'll argue for **"Developmental Resource."**

