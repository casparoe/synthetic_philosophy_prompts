answer: |-
  A philosopher visits a ward for pain asymbolia. The doctor explains, "Patients detect noxious stimuli, locate them, and report pain, but feel no distress."

  The philosopher nods. "So the sensory core isn't bad. The badness is just the aversion."

  He approaches a patient touching a hot probe. "Does that hurt?"

  "Yes. Thermal pain. Intensity six."

  "But you don't mind?"

  "Not at all."

  "Then strictly, you aren't in pain," the philosopher says. "Pain entails badness."

  The patient removes his hand. "Okay. Then you're in pain."

  "I'm not touching the probe!"

  "No," says the patient. "But you're minding. So the badness is yours. I just have the sensation."

  The philosopher winces. "But hurting without badness isn't pain!"

  "Fine," says the patient. "You keep the pain. I'll keep the hurting. Seems you got the worse end."
