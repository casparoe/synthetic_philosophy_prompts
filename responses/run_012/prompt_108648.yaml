      | Degenerating Problemshift | Zombie Company | Degeneration is epistemic; zombie status is financial (burn without growth). |
      | Negative Heuristic | Board Governance | Scientists forbid core attacks; VCs force pivots that alter the core. |

      *Drafting the Residue Report:*
      The mapping holds strongest on *progressive versus degenerating shifts*. A company adding features that yield new revenue is progressive; one burning cash on ad-hoc features to explain away churn is degenerating. This translates cleanly.

      However, the *Hard Core* distinction distorts significantly. Lakatos argues scientists agree *not* to test the core; it is immune by decision. In VC, the founding thesis is protected only by conviction, not rule. When metrics fail, VCs demand the core change (a pivot), which Lakatos would classify as abandoning the programme entirely, not adjusting the belt. The VC vocabulary lacks a concept for "rationally holding a core truth despite counter-evidence" because capital is finite. You cannot hold a thesis immune forever; runway forces falsification.

