          *   Protective Belt -> Product Roadmap (Loss: Roadmap changes are often tactical, not theoretical auxiliaries).
          *   Progressive Problemshift -> Power-Law Traction (Loss: Science values novel facts; VC values financial returns).
          *   Degenerating Problemshift -> Zombie Company/Pivot Fatigue (Loss: Science is epistemic; VC is financial).
          *   Negative Heuristic -> Board Governance/Founder Control (Loss: VCs can force core changes; scientists cannot).
      *   *Residue Report:* Need to analyze the translation quality.
          *   *Clean:* Progressive/Degenerating maps well to Traction/Runway burn. Anomalies map to missed metrics.
          *   *Distorted:* Hard Core immunity. In science, it's a rule of the game. In VC, it's a bet. If the bet looks wrong, the VC forces a change to the core (pivot), which Lakatos would say ends the programme.
          *   *No Counterpart:* The "long run" in science is indefinite. In VC, it's constrained by fund life (10 years) and runway (18 months).
          *   *Evaluation:* Is it VC defect or Lakatos defect? It's a category error. Science seeks truth; VC seeks returns. Lakatos describes epistemic rationality; VC describes financial rationality. The "immune by decision" part doesn't hold because capital is finite.

  5.  **Refining and Editing (Word Count Check):**
      *   Need to be concise.
