  | **Protective Belt** | Product Roadmap | Roadmap tweaks are tactical; auxiliary hypotheses are theoretical adjustments. |
  | **Progressive Problemshift** | Power-Law Traction | Science seeks novel facts; VC seeks financial returns and market share. |
  | **Degenerating Problemshift** | Zombie Company | Degeneration is epistemic; zombie status is financial (burn without growth). |
  | **Negative Heuristic** | Board Governance | Scientists forbid core attacks; VCs force pivots that alter the core. |

  **Residue Report**

  The distinction between progressive and degenerating problemshifts translates cleanly to traction versus burn. A company launching features that capture new market value is progressive; one tweaking pricing to explain away churn without growth is degenerating. This maps well because both domains reward novel success over ad hoc survival.

  However, the Hard Core mapping distorts reality. Lakatos posits the core is immune by methodological decision; scientists agree not to falsify it to maintain programme identity. In VC, the founding thesis is protected only by conviction, not rule. When metrics fail, VCs demand the core change (a pivot), which Lakatos would classify as abandoning the programme entirely, not adjusting the belt. The VC vocabulary lacks a concept for "rationally holding a core truth despite counter-evidence" because capital is finite. You cannot hold a thesis immune forever; runway forces falsification.

  This residue is not a defect in Lakatos but a category difference. Science aims for truth over the indefinite long run; VC aims for returns within a fund's life. Lakatos's framework is clear epistemically, but VC rationality is financial and time-bound. The VC vocabulary cannot capture "methodological immunity" because the investor's mandate is specifically to challenge the core if the money stops working. The "long run" in VC is merely until the next round, whereas in science, it is asymptotic. Thus, the VC must treat the hard core as a hypothesis to be validated, not a dogma to be protected, making the Lakatosian notion of rational persistence despite anomalies dangerous if applied literally to capital allocation. The distortion arises because VC "thesis" is a bet to be won, while Lakatos's "core" is a definition to be explored.
