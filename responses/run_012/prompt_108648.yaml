      *   **Role:** Philosopher of science + Early-stage VC expert.
      *   **User:** VC Partner (knows Lakatos basics, thinks in VC terms).
      *   **Task:** Restate Lakatos's account of Scientific Research Programme (SRP) appraisal in VC vocabulary. Specifically address the hard core/protective belt vs. founding thesis/product roadmap mapping (especially the "immune by methodological decision" aspect). Provide a residue report (what translates, what distorts, what has no counterpart). Evaluate whether the residue is a defect of VC vocabulary or Lakatos's framework.
      *   **Constraints:**
          *   Open with a one-sentence bottom line.
          *   Include a three-column table (Lakatosian term, VC analogue, what is lost).
          *   Residue report max 300 words.
          *   Total response max 800 words.
          *   No citations or reading lists.

  2.  **Deconstruct Lakatos for VC:**
      *   *Scientific Research Programme (SRP):* A sequence of theories developed over time. -> *Company/Startup:* A venture evolving over time.
      *   *Hard Core:* Irrefutable assumptions (by methodological decision). -> *Founding Thesis/Vision:* The core belief about the world/market. *Crucial nuance:* In science, it's protected by decision. In VC, is the thesis protected by decision or evidence? Usually, founders protect it by decision (faith) until forced to pivot.
      *   *Protective Belt:* Auxiliary hypotheses, adjustable to protect the core. -> *Product Roadmap/Strategy:* Features, GTM, specific implementations that change to fit market feedback.
      *   *Negative Heuristic:* Don't attack the hard core. -> *Founder Conviction/Board Governance:* Don't question the fundamental vision lightly.
      *   *Positive Heuristic:* How to develop the belt. -> *Product Strategy/OKRs:* What to build next.
      *   *Anomalies:* Counter-evidence. -> *Missed Metrics/Churn/Competitor Moves:* Things going wrong.
      *   *Progressive Problemshift:* Theory predicts novel facts, confirmed by evidence. -> *Product-Market Fit/Scaling:* New features drive new growth/revenue (traction).
      *   *Degenerating Problemshift:* Ad hoc adjustments to save the core without new predictions. -> *Pivot without Traction/Zombie Company:* Changing features just to survive, no new growth, burning runway.
      *   *Rationality of Pursuit:* Stick with a programme despite anomalies if long-term progressive. -> *Doubling Down:* Keep funding despite setbacks if the core thesis still yields novel traction.

  3.  **Address the Specific Mapping Challenge (Hard Core vs. Thesis):**
      *   Lakatos: Hard core is *immune by methodological decision*. Scientists agree *not* to falsify it.
      *   VC: Founding thesis is often held immune by *founder conviction*, but VCs evaluate it based on *empirical evidence* (traction). If the thesis fails empirically, the VC kills it.
      *   *Distortion:* In science, the immunity is constitutive of the programme. In VC, the immunity is provisional based on runway and potential. The VC *can* attack the hard core (force a pivot or shut down). Lakatos says you don't falsify the core, you abandon the programme. VC says you pivot the core or kill the company.

  4.  **Drafting the Content:**

      *   *Bottom Line:* A startup is rational to fund despite early failures if its core vision consistently generates novel traction, but unlike science, the VC reserves the right to falsify the founding thesis when runway expires.
      *   *Table:*
