answer: |-
  # The Sleeping Beauty Decision Tree

  **Start:** Is the question *"What is Beauty's credence in Heads?"* well-posed without further stipulation of a utility function or reference class?
  *   **NO** → **QUIETIST / ILL-POSED** (The case is underdescribed; "credence" is ambiguous without fixing the goal.)
  *   **YES** → Go to **Node 1**.

  **Node 1:** Must rational credence align with optimal betting strategy (Dutch Book immunity)?
  *   **NO** (Credence is purely epistemic; betting is pragmatic) → **HYBRID** (Credence = 1/2, but bet as if 1/3 to maximize payoff.)
  *   **YES** (Credence must guide action) → Go to **Node 2**.

  **Node 2:** Is Sleeping Beauty structurally isomorphic to the *Absent-Minded Driver* (decision problem drives credence)?
  *   **YES** (Planning self and acting self must align; decision theory dictates credence) → **PRAGMATIC THIRDERS**.
  *   **NO** (Credence is distinct from planning; Driver case involves control, SB does not) → Go to **Node 3**.

  **Node 3:** Ontology: Does the Tails branch produce two distinct observer-moments (Quantum/Branching) or one person twice (Temporal)?
  *   **TWO MOMENTS** (Quantum: Tails literally creates two copies) → **QUANTUM THIRDERS** (Self-Sampling Assumption forces 1/3.)
  *   **ONE PERSON** (Temporal: Same person, different times) → Go to **Node 4**.

  **Node 4:** Is "I am awake now" new relevant evidence (does it rule out *Tails & Tuesday*)?
  *   **YES** (Waking eliminates a possible centered world) → **EPISTEMIC THIRDERS** (Standard Elga position.)
  *   **NO** (Waking was guaranteed; no elimination of worlds) → Go to **Node 5**.

  **Node 5:** Do self-locating beliefs ("It is Monday") obey standard conditionalization?
  *   **YES** (P(Monday | Tails, Awake) = 1/2) → **DOUBLE HALFER** (Maintains 1/2 on Heads, but accepts 1/2 on Monday given Tails.)
  *   **NO** (P(Monday | Tails, Awake) ≠ 1/2; indexicals update differently) → **STANDARD (LEWIS) HALFER**.

  ***

  ### Unoccupied Logical Space (Empty Leaves)
  *   **Quantum Halfer:** *Unattractive.* If Tails creates two copies, denying the 1/3 weighting requires rejecting standard anthropic reasoning (SSA) without a clear alternative (like SIA with measure).
  *   **Epistemic 1/3 / Betting 1/2:** *Incoherent.* If your credence is 1/3, betting at 1/2 odds on Heads leaves you vulnerable to a Dutch Book; rational agents generally align action with belief.
  *   **Driver-Isomorphism Halfer:** *Unexplored/Unstable.* If you accept the isomorphism, the decision-theoretic argument for 1/3 is overwhelming; maintaining 1/2 requires rejecting the decision theory used in the Driver case itself.

  ***

  ### Classifier Notes
  *   **Confidence in Classification:** **High.** This structure captures the five major positions requested and isolates the metaphysical vs. epistemic vs. decision-theoretic fault lines.
  *   **Weakest Node:** **Node 5 (Conditionalization).** The distinction between Standard and Double Halfers is technically subtle; some Standard Halfers may accept P(Mon|Tails)=1/2 but deny it updates Heads, while Double Halfers insist both stay 1/2. The boundary here is often blurred in literature.
  *   **On the Quantum Branch:** Note that "Quantum Thirder" is grouped with "Epistemic Thirder" in outcome (1/3), but the *reasoning* (branching ontology vs. evidence elimination) is distinct. If your group debates Many-Worlds, split Node 3 further.
  *   **On the Driver Case:** Node 2 is the crucial filter for those who think SB is purely a decision problem in disguise. If they say "Yes" here, they rarely end up Halfer.
