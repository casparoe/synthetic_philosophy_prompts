answer: |-
  (a) **The Scenario**
  Julian stands in a conference hallway and asserts to a colleague, "The budget meeting is in Room 304." The meeting is in fact in Room 304, and Julian genuinely believes this based on his visual reading of the digital schedule on the wall, a source that is functioning correctly. Julian possesses a specific reason to doubt his visual processing: ten minutes prior, he read the label of a new medication he took that morning, which explicitly warns of "transient textual hallucinations," a fact he registered and stored in memory but is not currently recalling or weighing as he speaks. He is not negligent in forgetting it, nor does he feel a conscious pang of doubt; the information is simply possessed without attention.

  (b) **The Verdicts**
  *   **Truth Norm:** Permits. The proposition is true. The norm requires only that $p$ corresponds to reality, which it does.
  *   **Belief Norm:** Permits. Julian genuinely believes $p$. The norm requires only that the speaker represents their doxastic state, which he does.
  *   **Knowledge Norm:** Forbids. (Meta-theory flag: This verdict relies on *Defeasibility Theory*, where knowledge requires justification that is not defeated by possessed truths.) Julian lacks knowledge because his justification is defeated by the possessed evidence regarding his medication. Even though unattended, the possessed reason undermines the status of his belief as knowledge, rendering the assertion improper under the rule "Assert only what you know."

  (c) **The Feature and Removal Test**
  The single feature doing the work is the **unaccessed possessed defeater** (the memory of the medication warning).
  *   *Removal Test:* If we delete the fact that Julian read the medication label (he took the pill but never saw the warning), he no longer possesses the defeater. In this modified scenario, his belief is justified, true, and undefeated; he knows $p$. Consequently, the Knowledge Norm verdict shifts from "Forbid" to "Permit," collapsing into agreement with the Truth and Belief norms. This confirms the divergence was caused solely by the possessed-but-unattended reason.

  (d) **Strongest Line of Resistance**
  A defender of the Knowledge Norm might argue from an *Action-Guiding Internalist* perspective: norms of assertion govern the exchange of reasons in conversation. Since Julian is not attending to the defeater, it plays no role in his current reasoning or the interlocutor's uptake. Therefore, for the purposes of the *speech act*, the defeater is inert. The defender would claim that knowledge, relative to the norm of assertion, is sensitive only to *accessible* defeaters at the time of speaking; if the defeater is not cognitively active, the speaker satisfies the epistemic position required to warrant the assertion, effectively denying that Julian lacks knowledge in the relevant sense.

  ***

  **The Reverse Divergence: Knowledge without Belief**

  I attempt to construct a case where the Knowledge Norm permits (the speaker knows $p$) but the Belief Norm forbids (the speaker does not believe $p$).

  **Attempt:** Consider a seasoned actuary, Elena, who calculates the probability of a rare flood event as 100% based on exhaustive data. She asserts, "The flood will occur." However, due to a pathological inability to form doxastic commitments on catastrophic outcomes (a "doxastic block"), she does not internally feel the state of belief, though her cognitive system registers the fact as certain.

  **Verdict:** This case **fails**.

  **Blocking Platitude:** The **Entailment Thesis** (Knowledge entails Belief).

  **Explanation of Impossibility:** This block is a genuine impossibility rather than a failure of imagination because "knowledge" is conceptually defined as a successful species of belief. To know $p$ is not merely to possess information; it is to hold $p$ as true in a way that guides action and assertion. If Elena lacks belief, she lacks the doxastic commitment that constitutes the *subjective* side of knowledge. Without belief, her accurate representation of the world is merely a correct calculation, not a known fact. Since the Belief Norm forbids asserting what one does not believe (to prevent lying or misleading others about one's mind), and the Knowledge Norm cannot be satisfied without belief in the first place, the two norms cannot diverge in this direction. The Knowledge Norm cannot permit what is metaphysically impossible (knowing without believing).
