      *   **Specific Requirements:**
          1.  **Desiderata:** What the theory must deliver.
          2.  **Test Cases:** AV killing, Clinical under-alert/override, Algorithmic trading cascade, Lethal Autonomous Weapon (LAW), Problem of Many Hands.
          3.  **Distinctions to Maintain:** Blameworthiness vs. Answerability vs. Liability; Behavior vs. Choices to Deploy; Ex Ante Authority vs. Ex Post Reason-Giving; Outcome Responsibility vs. Practice Maintenance.
          4.  **Empirical/Legal Findings to Respect:** Vigilance decrement, limits of foresight, emergent behavior, existing strict/corporate liability.
