  10. **Final Polish:** Ensure the distinction between *ex ante* (deployment rules) and *ex post* (answering for harm) is woven throughout. The user wants *deployment guidance*, so the theory must be actionable.

  *(Self-Correction on the "Three Gaps"):* I need to make sure I don't just say "yes, you're right." I need to explain *why* it does work. It works because it maps to different regulatory levers. Epistemic -> Auditing/Transparency. Control -> UI/Latency/Override. Authority -> Governance/Privilege.

  *(Self-Correction on Unsatisfiability):* The tension is specifically between *Moral Blame* (requires control/knowledge) and *Social Accountability* (requires someone to answer). The solution is usually decoupling them. I need to state this clearly.

