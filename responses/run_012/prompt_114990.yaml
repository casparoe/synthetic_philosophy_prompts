prompt: |-
  I'm a high school student, and I've been reading a popular book on ethics that was recommended to me as an accessible introduction. I have no background in philosophy, so I'm not in a position to tell where it can be trusted. One section summarizes what it calls "the ideal-deliberation theory of rightness," and I'd like you to audit that summary for me — not the whole book, just this paragraph. Here it is:

  "Recent moral philosophy has largely converged on the ideal-deliberation theory. On this view, whether an action is right is fixed by what a fully informed, perfectly logical, and entirely unbiased deliberator would approve of. Its attraction is that it explains how morality can be objective without positing any mysterious moral facts: rightness simply is what survives ideal deliberation. It also hands us a practical test — when you're torn about what to do, set aside your biases, ask what your idealized self would choose, and do that. Notice that the theory collapses into a form of utilitarianism, since a deliberator with complete information will always pick whatever produces the most good overall; the ideal deliberator turns out to be a well-informed consequentialist. Critics object that since none of us is fully informed or perfectly rational, the theory leaves us unable ever to know what's right, but this only shows that idealization is an ideal, not that the theory is false. In the end the view is a sophisticated subjectivism: it grounds morality in the psychology of a hypothetical person, so what's right is relative to that person's attitudes rather than to anything about the world."

  Could you go through this paragraph claim by claim and tell me, for each, what a philosopher who actually defends a view of this kind would accept as accurate, what they would wince at as a simplification or overstatement, and what they would reject outright? I'm especially unsure about three things. First, does the claim that the theory supplies a practical test follow from the rest of the view, or is it an addition the summary smuggles in? Second, is the objection about our never being able to know what's right a genuine problem for the view, or a misunderstanding of what it is claiming? Third, is the charge of subjectivism fair, or does it misdescribe the kind of dependence the view actually posits? I'm not asking for a reading list or citations — I just want to know which sentences to trust, which to treat as loose talk, and which to cross out, and what the view holds instead.

  Finally, please tell me how confident you are in what you claim, and single out the one point in your answer you're least sure about.
