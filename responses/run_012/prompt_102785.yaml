      *   **Constraint 5 (Boundary Work):** Distinguish non-negotiable requirements from camp-specific commitments. Identify incompatible sets (impossibility results). Explain which requirement to surrender first and the cost. Address path-dependence (order of propositions). Identify the single most exclusionary requirement.
