  2.  **Brainstorming & Filtering (Mental Draft):**
      *   *Candidate Requirements:* Consistency, Completeness, Anonymity, Neutrality, Independence, Systematicity, Unanimity, Responsiveness, Strategy-proofness, Deductive Closure, Agenda Independence, Universal Domain.
      *   *Filtering:*
