answer: |-
  **Project Title:** Relocating the Regress: Unity, Typing, and the Invariance of Predication Problems

  **1. Project Summary**
  This project investigates the structural stability of Bradley's Regress across different ontological models of predication. The standard philosophical consensus holds that Bradley's Regress is a specific problem for *relational* ontologies (where a particular and a universal are joined by an instantiation relation) and that *functional* ontologies (where properties are unsaturated functions applying to objects) dissolve the regress by removing the need for a unifying tie. My working hypothesis is that this dissolution is illusory. I argue that the functional model does not eliminate the unity problem but relocates it from the metaphysics of relations to the metaphysics of type-compatibility or functional application. The paper will test whether the distinction between a "unity problem" and a "typing problem" is metaphysically substantive or merely notational. The goal is not to solve Bradley's Regress, but to produce a taxonomy of where the explanatory burden of unity lands in competing frameworks.

  **2. The Research Question**
  The initial intuition—that the regress is "relocated, not dissolved"—requires sharpening to be falsifiable. The core research question is:

  *Is the explanatory burden required to secure propositional unity invariant under the translation from relational to functional models of predication?*

  This breaks down into two determinate sub-questions:
  1.  **Diagnostic:** Can we define "relocation" such that it is distinct from "dissolution"? (i.e., Is there a non-trivial residue in the functional model that plays the same explanatory role as the instantiation relation?)
  2.  **Substantive:** Does the functional model's appeal to "unsaturatedness" or "type-matching" merely rename the requirement for a unifying principle without explaining its possibility?

  If the answer to (1) is no, the hypothesis collapses (the roommate is right: it's just typing). If the answer to (1) is yes, but (2) is no (the residue is trivial), the hypothesis collapses (the regress is dissolved). The paper aims to defend the position that (1) is yes and (2) is yes: the problem is invariant.

  **3. State of the Art and The Gap**
  Existing literature on Bradley's Regress generally divides into two camps, both of which leave my specific question open.

  *   **The Relationalist Camp:** Accepts the regress as a problem for instantiation relations. Solutions typically involve positing a non-relational tie, a brute fact of instantiation, or a regress that is benign. *Gap:* These views assume the problem is unique to the relational architecture. They do not rigorously test whether their solutions would survive translation into a functional syntax.
  *   **The Functionalist/Fregean Camp:** Claims the regress is generated by a category mistake (treating concepts as objects). By treating properties as functions, unity is secured by the nature of function-application. *Gap:* These views often treat "unsaturatedness" as a primitive that stops the regress. They rarely address whether the *constraint* that allows a function to accept an argument (the "typing" constraint) requires the same metaphysical grounding that the relationalist seeks for instantiation.

  My project diverges by refusing to accept the functionalist's claim that "application" is self-explanatory. I treat the functional model not as a solution, but as an alternative formalism that must be tested for the same structural vulnerability. The divergence point is the roommate's objection: if "typing" is purely syntactic, the metaphysical problem is gone. If "typing" tracks a metaphysical constraint, the problem remains. My paper forces a choice here that existing literature glosses over.

  **4. Methodology and Timeline**
  The project will proceed in three phases over the semester, designed to produce an 8–10k word paper.

  **Month 1: Conceptual Groundwork & Defining "Relocation"**
  *   **Task:** Rigorously define the criteria for "dissolution" vs. "relocation."
  *   **Action:** I will construct a formal criterion for *Explanatory Invariance*. A problem is relocated if Model B requires a primitive principle $P_B$ that performs the same metaphysical work as primitive principle $P_A$ in Model A, even if $P_B$ is named differently (e.g., "instantiation" vs. "saturation").
  *   **Milestone:** A 2-page working definition of "metaphysical residue." If I cannot define this without circularity by the end of Month 1, the project shifts to a critique of the distinction itself (see Failure Conditions).

  **Month 2: Stress-Testing the Functional Model**
  *   **Task:** Run Bradley's Regress through two non-relational analyses of predication.
  *   **Action:**
      1.  **Fregean Unsaturation:** Analyze whether the claim "the function is incomplete" explains *why* it combines with this object, or merely asserts *that* it does. Does the regress reappear as "what ensures the function is of a type applicable to this object?"
      2.  **Type-Theoretic Approaches:** Analyze a simple type-theory framing (without heavy formalism). Does the prohibition against type-errors solve the unity problem, or does it presuppose a unified type-structure that itself requires grounding?
  *   **Milestone:** Draft of the core argument (approx. 5k words) demonstrating the "residue" in these models.

  **Month 3: Evaluation, The "Typing" Objection, and Revision**
  *   **Task:** Directly engage the "typing vs. unity" distinction and finalize the paper.
  *   **Action:** I will argue that "typing" is the functionalist's name for "unity." If the functionalist says "types just match," the relationalist says "instantiation just happens." I will assess whether one primitive is genuinely more parsimonious or intelligible than the other.
  *   **Milestone:** Final paper (8–10k words).

  **5. Success and Failure Conditions**
  To ensure intellectual honesty and scope management, the following conditions define the project's viability:

  *   **Success:** The paper successfully demonstrates that the functional model requires a primitive principle of "application" or "type-compatibility" that is structurally isomorphic to the relationalist's "instantiation." The deliverable is a taxonomy showing that the unity problem is a feature of *compositionality* generally, not *relationality* specifically.
  *   **Failure Condition A (The Roommate is Right):** If, during Month 1, it becomes clear that "typing" can be cashed out purely syntactically or logically without metaphysical commitment (i.e., it is a rule of a game, not a feature of the world), then the "relocation" claim is false. The regress is dissolved in the functional model.
      *   *Contingency:* The paper pivots to argue that the relationalist model is uniquely disadvantaged because it tries to metaphysically ground what the functionalist correctly treats as syntactic.
  *   **Failure Condition B (Triviality):** If the "residue" I identify in the functional model turns out to be trivial (e.g., "functions are defined by their values"), then the claim of relocation is empty.
      *   *Contingency:* The paper concludes that the debate over Bradley's Regress is verbally disputed, arising from a confusion between formal and metaphysical requirements.
  *   **Failure Condition C (Scope Creep):** If analyzing the functional model requires deep engagement with formal semantics or type theory beyond my current competency.
      *   *Contingency:* I will restrict the analysis to the *philosophical interpretation* of type-theory, not the mathematical machinery itself. The argument will remain metaphysical, using formalism only illustratively.

  **6. Expected Outcome**
  The modest, realistic goal of this prospectus is not to solve the problem of propositional unity. Rather, it is to clarify the dialectic. By the end of the semester, I intend to have a paper that establishes whether Bradley's Regress is a localized infection in relational metaphysics or a systemic feature of any compositional ontology. Even if the hypothesis fails, the result is valuable: it either vindicates the functionalist dissolution or reveals a hidden cost in the functionalist framework that has been overlooked.
