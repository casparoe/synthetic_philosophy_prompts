answer: |-
  Here is a framework for your graduate seminar, sorting *Slaughterhouse-Five* against the three specific Borgesian topologies of time you have identified.

  ### I. The Ontological Sort: Which Borges is Tralfamadore?

  The Tralfamadorian doctrine—that all moments exist permanently in a block universe, unalterable and simultaneous—is often mistaken for Nietzsche's Eternal Return. It is not. It is a specific configuration of temporal metaphysics that borrows from Borges but hardens into fatalism. To understand where Vonnegut stands, we must first distribute the novel's machinery across your three Borgesian categories.

  **1. *A New Refutation of Time* (Idealist Presentism)**
  *   **Borges:** Following Hume and Berkeley, Borges argues that if only present perceptions exist, succession is a fiction. The "self" is merely a bundle of perceptions with no thread tying them together.
  *   **Vonnegut's Alignment:** This is the **psychological reality** of Billy Pilgrim. Billy does not experience time as a flow; he experiences it as a series of disjointed "now"s. He "comes unstuck" not because he travels, but because the causal narrative of the self has dissolved. When Billy steps into the time machine in the Tralfamadorian zoo, he is not moving; he is simply perceiving a different coordinate in the block.
  *   **The Friction:** Borges uses this refutation to liberate the self from the burden of history. Vonnegut uses it to describe a traumatized self that *cannot* sustain history. For Borges, the dissolution of time is a philosophical victory; for Billy, it is a symptom of shell shock.

  **2. *The Garden of Forking Paths* (Modal Realism)**
  *   **Borges:** Ts'ui Pên's labyrinth is a novel where all possibilities occur simultaneously. In one branch, the stranger dies; in another, he lives. Time is an infinite web of diverging, converging, and parallel times.
  *   **Vonnegut's Alignment:** This is the **structural ontology** of the Tralfamadorian view. The Tralfamadorians see time as a mountain range; they can look at any peak (moment) without moving. This mirrors the *Garden*'s simultaneity.
  *   **The Friction:** The *Garden* implies *divergence* (choice creates new branches). Tralfamadore implies *determinism* (all branches exist, but none can be changed). Tralfamadore is a *Garden* where the gardener is dead. It accepts the simultaneity of Borges but rejects the agency.

  **3. *The Secret Miracle* (Subjective Duration)**
  *   **Borges:** Jaromir Hladík is granted a year of subjective time within the frozen instant of his execution to complete his play. External time stops; internal time stretches.
  *   **Vonnegut's Alignment:** This is the **ethical desire** of the novel. It is not the doctrine Billy is taught, but the wish the novel enacts.
  *   **The Friction:** In *The Secret Miracle*, God grants the time to *finish* the work, not to *escape* the death. In *Slaughterhouse-Five*, the characters wish to escape the death entirely.

  ### II. The Decisive Scene: The Backwards Film

  You identified the war film running backwards as the decisive moment. This scene is the crack in the Tralfamadorian facade. In this scene, American planes fly backwards, bombs are sucked up into the bellies of the planes, and the fire of Dresden returns into the earth, un-happening the massacre.

  Here is how the three Borgesian positions adjudicate this wish (the alteration of the past):

  1.  **The Garden of Forking Paths:** **Permits.** If all possibilities exist, there is a branch of the labyrinth where the bombs never fell. The film is simply a visualization of a valid coordinate in the multiverse.
  2.  **The Secret Miracle:** **Forbids.** In Hladík's case, the external volley *must* fire. The miracle is internal (the completion of the play), not external (the stopping of the bullets). The film attempts to reverse the external volley, which the logic of the *Miracle* does not allow.
  3.  **A New Refutation of Time:** **Renders Meaningless.** If the past is not a region that exists, but merely a present memory, there is nothing to "reverse." You can only change the current perception. To ask to "un-bomb" Dresden is a category error; you can only stop looking at the bombing.

  **The Novel's Commitment:**
  *Slaughterhouse-Five* **claims** to be Tralfamadorian (nothing alterable, "so it goes"), but the inclusion of the backwards film reveals it is secretly pleading for *The Garden of Forking Paths*. The film is a wish for a branch where Dresden didn't happen. However, because Vonnegut presents this as a *film* (a fiction within the fiction) rather than reality, he admits that this branch is unavailable to us. We are stuck in the branch where the bombs fell.

  ### III. Seminar Scenes and Friction Points

  For your session, place these three scenes in dialogue with the corresponding Borges texts:

  **1. The Zoo Scene (Chapter 4)**
  *   **Text:** Billy in the Tralfamadorian zoo, explaining that all moments are structured permanently like bugs in amber.
  *   **Borges Pairing:** *The Garden of Forking Paths*.
  *   **Discussion Question:** The Tralfamadorian says, "I have visited thirty-one inhabited planets... and on Earth the only people who believe in free will are those who don't know the whole story." Compare this to Ts'ui Pên's labyrinth. Does the Tralfamadorian view offer the comfort of the *Garden* (everything exists) without the terror of the *Garden* (everything happens)?
  *   **Friction:** In the *Garden*, the proliferation of time creates meaning through complexity. In Tralfamadore, the proliferation of time creates meaninglessness through inevitability.

  **2. The Backwards Film (Chapter 5)**
  *   **Text:** Billy watches the war movie run in reverse; the buildings rise, the fires go out, the mines become harmless.
  *   **Borges Pairing:** *The Secret Miracle*.
  *   **Discussion Question:** Hladík uses his frozen time to create art. Billy uses the reversed film to imagine a world without destruction. Why does Vonnegut deny Billy the *Secret Miracle*? Why can Billy not live in the stretched instant to finish his life, but must instead jump unstuck?
  *   **Friction:** Hladík accepts his death because he finished his work. Billy cannot accept death because the work (making sense of the war) is impossible. The film is a *Secret Miracle* that fails to save the subject.

  **3. The Assassination and "So It Goes" (Chapter 1 & 10)**
  *   **Text:** The opening chapter where Vonnegut discusses the book's failure, and the final mention of Billy's death by Paul Lazzaro.
  *   **Borges Pairing:** *A New Refutation of Time*.
  *   **Discussion Question:** "So it goes" follows every mention of death. Is this a philosophical assertion (death is just a moment) or a linguistic tic (a way to stop the sentence from hurting)?
  *   **Friction:** Borges argues that if time is unreal, death is not a finality. Vonnegut shows that even if death is not final metaphysically, it is final *somatically*. The refrain doesn't comfort; it accumulates weight.

  ### IV. The Harder Questions

  **Does "So it goes" express the doctrine or betray it?**
  It betrays it. If the Tralfamadorian view were truly held, the phrase would be unnecessary. One does not need a mantra to accept a geometric truth. The repetition reveals that "So it goes" is not a description of the universe, but a **coping mechanism**. It is a spell cast to ward off the grief that the philosophy claims shouldn't exist. It is the sound of a human trying to live *A New Refutation of Time* while possessing a human heart.

  **Is the novel's quietism a consequence of its view of time, or an evasion?**
  It is an evasion the book knows to be one. Vonnegut admits in Chapter 1 that there is "nothing intelligent to say about a massacre." The Tralfamadorian philosophy is a tool to enable silence. However, by writing the novel, Vonnegut contradicts the quietism. The book itself is an act of agency in a deterministic universe. He writes *against* the Tralfamadorian advice to "ignore the unpleasant moments." The novel is the proof that we cannot actually ignore them.

  **What does the novel show about living inside such a view that Borges cannot?**
  Borges writes from the library; Vonnegut writes from the rubble.
  *   **Borges** treats the unreality of time as an intellectual puzzle. He concedes it cannot be lived, but he treats that concession lightly, as a limitation of language.
  *   **Vonnegut** treats the unreality of time as a **pathology**. To live "unstuck in time" is to suffer from PTSD. The dissolution of the self (Borges's *Refutation*) is not a philosophical liberation for Billy; it is a disintegration. Vonnegut demonstrates that while time *might* be unreal metaphysically, suffering is real phenomenologically. You cannot "refute" the pain of Dresden by arguing that the moment is permanent.

  ### V. Conclusion: Vonnegut's Contribution to the Debate

  Borges's essays on time are epistemological: they ask *how we know* time. Vonnegut's novel is ethical: it asks *how we endure* time.

  Vonnegut adds the **problem of complicity** to the philosophical debate. In Borges's *Garden*, the branching paths are neutral. In *Slaughterhouse-Five*, the fixed moments contain moral horror. If "all moments are structured permanently," then the Holocaust and Dresden are as necessary as the sunrise. Borges can tolerate this as a metaphysical curiosity. Vonnegut shows that this view is morally intolerable for a human being.

  The novel's ultimate contribution is the suggestion that **fiction is the only permissible time travel.** We cannot change the past (Tralfamadore), we cannot stop time (The Secret Miracle), and we cannot dissolve the self (Refutation). But we can make a film run backwards. We can tell a story where the bombs go up. Vonnegut argues that while the Tralfamadorian view might be *true*, it is uninhabitable. We must live in the illusion of sequence and agency, and use art to briefly, falsely, reverse the bombs. That is the only "Secret Miracle" available to us.
