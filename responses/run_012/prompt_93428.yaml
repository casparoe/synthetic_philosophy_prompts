answer: |-
  This is a classic systems integration problem. You are trying to run a single boolean check (`is_dead`) on a system that actually exposes two different status flags: **Biological Integrity** and **Moral Personhood**.

  Your intuitions are actually more consistent than you think. You are consistently applying the **Whole Brain Standard** for the label "dead," but you are inconsistently applying a **Personhood Standard** for the *moral weight* of that label. This creates the friction you feel in the anencephalic and organ donor cases.

  Below is the map you requested. I have separated the medical/legal consensus from the philosophical contention, then offered the two competing principles that explain your verdicts, and finally applied them to your new cases.

  ### Part 1: The Consensus Map
  *Where the experts agree vs. where they fight.*

  **1. The Consensus (Medical & Legal Law in the US/West)**
  *   **Death is not a single event:** It can be declared via Cardiopulmonary Criteria (heart/lungs stop) *or* Neurological Criteria (whole brain stops).
  *   **Reversibility is key:** A stopped heart during CPR is not death because the state is reversible. Death requires *irreversibility*.
  *   **PVS is not Death:** Patients in a Persistent Vegetative State are legally and medically **alive**. Withdrawing life support is permitted (based on autonomy/liberty), but it is not because the patient is already dead.
  *   **Brain Death is Death:** A patient meeting the criteria for total brain death (including brainstem) is legally dead, even if the heart beats via ventilator.

  **2. The Contention (Philosophy & Bioethics)**
  *   **Why Brain Death counts as Death:** There is no agreement on *why* a brain-dead body is a corpse.
      *   *View A (Integration):* The brain is the body's central integrator. Without it, the body is just a collection of tissues, not an organism.
      *   *View B (Personhood):* The brain generates the "person." Without it, the human organism remains, but the person is gone.
  *   **The Anencephalic Infant:** Medically treated as alive until cardiac death. Ethically, many argue they should be treated as "organism without personhood," leading to disagreement about whether they should be eligible for organ donation while still "alive."
  *   **The Organ Donor:** It is contested whether removing organs from a brain-dead body violates the "Dead Donor Rule" if the body is still physiologically integrated via machines.

  ---

  ### Part 2: The Competing Principles

  Here are the two algorithms that underlie your intuitions.

  #### Candidate 1: The Biological Integration Principle (Whole Brain Standard)
  This is the principle that matches your explicit verdicts and current law.

  *   **The Rule:** A human being is dead if and only if there is an irreversible loss of the capacity for **somatic integration** (the ability of the body to function as a unified whole), which is mediated by the brainstem.
  *   **Pseudocode:**
      ```python
      IF (Brainstem_Function == FALSE) AND (Irreversible == TRUE):
          RETURN "DEAD"
      ELIF (Heart_Lung_Function == FALSE) AND (Irreversible == TRUE):
          RETURN "DEAD"
      ELSE:
          RETURN "ALIVE"
      ```
  *   **Motivating Verdicts:**
      *   *Brain Death is Dead:* Brainstem is gone; body cannot integrate without a machine.
      *   *PVS is Alive:* Brainstem is intact; body breathes and integrates on its own.
      *   *Heart-Lung Machine is Alive:* Brainstem is working; integration is maintained.
      *   *Mid-CPR is Not Dead:* Reversibility flag is not yet set.
  *   **Forces You To Accept:**
      *   **The Anencephalic Infant is Alive:** Since the brainstem works, the organism is integrating. You must drop the "unsureness" and categorically call them alive.
      *   **The Organ Donor is a Corpse:** Even if the body looks warm and is gestating a fetus or healing wounds, if the brainstem is gone, the "organism" has ceased. You must accept that surgically opening this body is not harming a living patient, but processing a corpse.
  *   **The Friction:** This principle explains your *verdicts*, but it does not explain your *unease*. It treats the anencephalic infant the same as a healthy adult (both "alive"), which feels morally distinct.

  #### Candidate 2: The Personhood Principle (Higher Brain Standard)
  This is the principle that explains your *unease* but contradicts your *verdicts*.

  *   **The Rule:** A human being is dead (or morally equivalent to dead) if and only if there is an irreversible loss of the capacity for **consciousness or social interaction**, which is mediated by the cortex.
  *   **Pseudocode:**
      ```python
      IF (Cortex_Function == FALSE) AND (Irreversible == TRUE):
          RETURN "DEAD / NO MORAL STATUS"
      ELSE:
          RETURN "ALIVE / PERSON"
      ```
  *   **Motivating Verdicts:**
      *   *Organ Donor Unease:* You feel the "person is gone." This principle validates that feeling.
      *   *Anencephalic Hesitation:* You are unsure because the infant never had a cortex. This principle explains why that case feels different from PVS.
  *   **Forces You To Give Up:**
      *   **PVS is Alive:** Under this rule, a PVS patient (cortex gone) is dead. You explicitly rejected this ("I wouldn't call her dead").
      *   **Legal Reality:** No jurisdiction currently accepts this as the legal definition of death. Adopting this would require you to argue that PVS patients are currently being held as "corpses" in hospitals.
  *   **The Friction:** This principle captures the moral weight you feel is missing in Candidate 1, but it requires you to change your explicit verdict on PVS patients.

  ---

  ### Part 3: The Engineer's Solution (The Two-Question Hypothesis)

  You asked if you are tracking two different questions. **The answer is yes.**

  Your gut is trying to solve for `Status` (Dead/Alive) and `Permissions` (What can we do?) simultaneously. The conflict arises because `Status` is binary, but `Permissions` are contextual.

  **The Unified Principle:**
  > **Biological Death** is determined by the **Whole Brain Standard** (Integration).
  > **Moral Status** is determined by **Personhood Potential** (Cortex).

  *   **How it resolves your cases:**
      *   **PVS Patient:** Biologically Alive (Brainstem intact). Moral Status: Diminished (No consciousness). *Verdict: Alive, but permissible to withdraw care if previously requested.*
      *   **Brain Dead Patient:** Biologically Dead (No integration). Moral Status: None (Person gone). *Verdict: Dead, permissible to harvest organs.*
      *   **Anencephalic Infant:** Biologically Alive (Brainstem intact). Moral Status: None (Never had/will have cortex). *Verdict: Alive, but morally distinct from a healthy infant.* (This resolves your hesitation: they are biologically alive, but lack the "personhood" flag that usually protects the alive).
      *   **Organ Donor:** Biologically Dead. Moral Status: None. *Verdict: It is okay to cut, because the "person" flag is off, even if the "organism" flag is flickering due to machines.*

  ---

  ### Part 4: Application to New Cases

  Here is how the **Two-Question Hypothesis** applies to your unmentioned cases.

  #### Case A: Cortex and Brainstem Destroyed, Body Perfused by Machine
  *   **Analysis:** This is Total Brain Death with advanced support (ECMO).
  *   **Biological Status:** **Dead.** The integrator (brain) is gone. The machine is perfusing tissues, but the *organism* is not integrating itself.
  *   **Moral Status:** **None.** No potential for consciousness.
  *   **Verdict:** This patient is dead. The machine is maintaining cellular viability, not life. Organs may be harvested; life support may be withdrawn.
  *   **Consensus Check:** This is settled medical consensus. This is the definition of Brain Death.

  #### Case B: Permanent Vegetative State (PVS) with Advance Directive Refusing Care
  *   **Analysis:** Cortex gone, Brainstem intact. Patient previously stated "Do not keep me like this."
  *   **Biological Status:** **Alive.** The organism is integrating (breathing, digesting).
  *   **Moral Status:** **Protected, but Autonomy Trumps.** The patient is a living human organism, so you cannot *kill* them (e.g., inject poison). However, they have the right to refuse *intrusion* (feeding tubes, ventilators).
  *   **Verdict:** You withdraw the artificial support. You do not pronounce them dead *before* withdrawal. You allow the underlying pathology to cause cardiac death.
  *   **Consensus Check:** This is settled legal consensus (e.g., *Cruzan v. Director*). The distinction is between *killing* (active euthanasia, generally illegal) and *allowing to die* (withdrawing futile/unwanted treatment, legal).
  *   **Why this matters for your logic:** If you used the **Personhood Principle** (Candidate 2), you would say "She is already dead, so turning off the tube is just turning off a corpse." But the law and your own intuition on PVS require you to say "She is alive, but we are no longer obligated to prolong this specific biological state."

  ### Summary for Your Family Dinners

  1.  **You are not inconsistent.** You are correctly distinguishing between **Biological Life** (Organism) and **Biographical Life** (Person).
  2.  **The Law tracks Biology.** For legal purposes (death certificates, organ donation), we use the **Whole Brain Standard**. This makes the PVS patient alive and the Brain Dead patient dead.
  3.  **The Ethics tracks Personhood.** For moral purposes (what we owe the patient), we care about the Cortex. This is why you feel uneasy cutting a Brain Dead body (it looks human) but are okay letting a PVS patient die (they have no "self" left to save).
  4.  **The Anencephalic Infant** is the edge case where Biology and Personhood diverge completely. Biology says "Alive." Personhood says "Never existed." The consensus is to follow Biology (keep them alive) but the ethical debate is active on whether that is mandatory.

  If you need a single sentence to carry forward: **"Death is the irreversible loss of the body's ability to integrate itself, but the wrongness of treating a body as dead depends on whether a person ever inhabited it."**
