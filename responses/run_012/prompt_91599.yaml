          *   Impact: High. It directly contradicts the "separation" requirement.
          *   Nuance: Is it "copying information" or just "propagating structure"? If the user defines "description" loosely enough to include crystal lattice structure, the claim becomes trivial.

      *   *Defeater 2: Autocatalytic Sets (Kauffman).*
