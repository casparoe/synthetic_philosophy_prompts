      *   Neo-Malthusians argue we haven't decoupled (climate change, soil depletion). This makes it testable.

  10. **Refining the "Tendency Law" Explanation:**
      *   Use the gravity analogy. Gravity pulls down. If I hold a ball, it doesn't fall. Does that falsify gravity? No. It means there's a counter-force (hand).
      *   Malthusian pressure = Gravity. Technology/Restraint = Hand.
      *   The essay claims: "Ball didn't fall, gravity is wrong."
      *   The Malthusian says: "Gravity is still there, you're just holding it up. How long can you hold?"
      *   Is "How long can you hold?" unfalsifiable? Only if "holding" is undefined. But if "holding" relies on finite resources (fertilizer, energy), it becomes testable again.

