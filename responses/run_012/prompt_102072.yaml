answer: |-
  1.
  Here stand two stones, distinct within themselves,
  Not made by light that falls upon their faces.
  Each holds a name before the sun arrives,
  A private seat where shadows come to rest.
  The pattern comes to rest upon the ground,
  But ground remains though pattern shift away.

  2.
  On the former, the shadow lengthens slow,
  And noon strikes hard against its northern face.
  The wind moves through the grass behind this spot,
  While rain collects within its hollow cup.
  It writes its mark upon this very ground,
  And here the seed takes root and breaks the soil.

  3.
  Outside the bound, each name keeps to its place,
  But inside bounds, the seats are shifted round.
  The load they bear is lifted, moved with them,
  So looking from afar, nothing has changed.
  The map is drawn anew beneath the feet,
  Yet surface shapes remain just as they were.

  4.
  On the latter, the shadow lengthens slow,
  And noon strikes hard against its northern face.
  The wind moves through the grass behind that spot,
  While rain collects within its hollow cup.
  It writes its mark upon that very ground,
  And there the seed takes root and breaks the soil.

  5.
  One voice cries out that two worlds now remain,
  Though both agree, we know not which is real.
  Another says the double count is wrong,
  For places are not vessels bearing load.
  One says two worlds; one says nothing has changed.
