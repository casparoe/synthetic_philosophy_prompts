answer: |-
  The law implicitly assumes that moral status hinges on the capacity for subjective suffering rather than biological classification or goal-directed behavior, but it operationalizes this by setting a threshold of scientific certainty rather than ranking animals by degrees of pain.

  To reconstruct the implicit theory, you have to separate what the law *says* from what it *needs to be true* to make sense. Your friend's thermostat argument fails because the law assumes moral status requires **phenomenology** (what it feels like to be something), not just **teleology** (having a goal). A thermostat "wants" 21 degrees in a functional sense—it has a mechanism to correct errors—but there is no evidence there is "something it is like" to be the thermostat. If the law included thermostats, it would assume functionalism (goal-seeking equals moral status) is sufficient. By excluding them, the law assumes that without a subjective experience of suffering, "wanting" doesn't matter. This is why the law protects animals but not plants or machines: it assumes sentience (the ability to feel) is the gateway to moral status, not merely being alive or having goals.

  The shift from "backbones" to "octopuses and crabs" reveals that the law is actually tracking **nervous system complexity** rather than vertebrate status. Originally, legislators used backbones as a proxy for a central nervous system capable of processing pain. When science showed that cephalopods and decapods have complex nervous systems and exhibit pain-avoidance behavior despite lacking spines, the law updated the proxy. This suggests the underlying theory is materialist: specific physical structures (brains/nerves) produce specific moral properties (sentience).

  Regarding your core confusion about "degrees": the law does not necessarily assume sentience comes in degrees. It is philosophically consistent to view sentience as **binary** (you either feel pain or you don't) while viewing **evidence** as graded. This is known as the **Precautionary Principle**. We are 99% sure a pig feels pain, 85% sure a crab does, and 40% sure a bee does. The law draws a line at "reasonable certainty." It doesn't mean a crab's pain counts for less than a pig's once established; it means we aren't legally convinced yet that the bee feels anything at all. If the law assumed sentience came in degrees (ontological grading), you would expect penalties for cruelty to be significantly lower for crustaceans than mammals *because* their suffering is less weighty. Usually, cruelty is cruelty regardless of species, which supports the view that the "degree" is in our knowledge, not the animal's experience.

  If you swapped the assumption to **"Good of their Own" (Biocentrism)**, the law would have to change drastically. If having a biological purpose grants status, insects and plants qualify. The current exclusion of insects suggests the law rejects biocentrism. If you swapped the assumption to **"Binary Sentience Hard to Detect,"** the law could stay exactly the same in practice but change in justification. Instead of saying "crabs are slightly sentient," it would say "we treat crabs as sentient because we cannot rule it out," while admitting bees might also be sentient but the evidence isn't there yet. The list itself is likely a political compromise, but philosophically, it functions as an evidentiary threshold for a binary property.

  **Uncertainty Disclosure**
  I am least sure about the claim that the law treats all protected animals as having equal moral weight once included. My argument rests on the idea that the "degrees" are in the evidence, not the status, but I cannot be certain without analyzing specific sentencing guidelines across jurisdictions. If evidence showed that courts consistently hand down lighter sentences for harming crustaceans than mammals *explicitly citing the animal's capacity for suffering* (rather than economic value), I would have to concede that the law actually does assume sentience and moral status come in ontological degrees. Conversely, if the lighter sentences are purely due to economic valuation or tradition, my "Precautionary Principle" interpretation holds stronger.
