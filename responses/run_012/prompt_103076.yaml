  8.  *(Final check on Bertrand's Paradox details)*:
      *   Method 1: Random endpoints on circumference. Chord length > triangle side if endpoint falls in 1/3 arc. $P=1/3$.
      *   Method 2: Random radius, random point on radius. Chord perpendicular to radius. Length > side if point is in inner half of radius. $P=1/2$.
      *   Method 3: Random midpoint in disk. Chord defined by midpoint. Length > side if midpoint is in inner circle (radius $r/2$). Area is $1/4$. $P=1/4$.
