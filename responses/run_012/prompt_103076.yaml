answer: |-
  Here is a structured resource for your seminar session. It is divided into two parts: the technical philosophical framework and the literary application. I have taken care to distinguish between consensus views in probability theory and areas of ongoing philosophical dispute, and I have flagged where the analogy between the mathematics and the drama inevitably strains.

  ---

  ### Part I: The Technical Framework
  **The Principle of Indifference and Its Discontents**

  To teach this session effectively, you must first establish why the Principle of Indifference (PoI) is not a self-executing algorithm, but a rule that requires prior structural commitments.

  **1. The Principle and the Parametrization Problem**
  Classically formulated by Laplace (and later Keynes), the PoI states that if there are $N$ mutually exclusive and exhaustive possibilities, and we have no evidence favoring one over the others, we ought to assign each a probability of $1/N$.

  *   **The Consensus:** It is settled among philosophers of probability and statisticians that the PoI is **underdetermined**. It cannot yield a numerical value without a specified **sample space** and a **measure**. "Possibilities" do not come pre-individuated. To apply the principle, one must decide *what* is being varied uniformly.
  *   **The Contested Point:** There is no consensus on whether this is a fatal flaw or a manageable feature. Some (like Edwin Jaynes) argue for a **Principle of Transformation Invariance**, suggesting that we should choose the parametrization that remains invariant under natural transformations of the problem (e.g., scale or rotation). Others argue that without physical data (frequencies or propensities), no unique rational credence exists, and the PoI should be abandoned for subjective Bayesianism.

  **2. Bertrand's Paradox (The Random Chord)**
  This is the canonical demonstration of the parametrization problem.
  *   **The Problem:** Consider a circle with an inscribed equilateral triangle. If a chord is chosen at random, what is the probability that the chord is longer than the side of the triangle?
  *   **The Three Methods (All seemingly "Indifferent"):**
      1.  **Random Endpoints:** Fix one endpoint; choose the other uniformly on the circumference. The chord is long enough if the second point falls within the $1/3$ arc opposite the first. **$P = 1/3$.**
      2.  **Random Radius:** Choose a radius uniformly; choose a point on that radius uniformly. Draw the chord perpendicular to the radius at that point. The chord is long enough if the point is in the inner half of the radius. **$P = 1/2$.**
      3.  **Random Midpoint:** Choose a point uniformly within the area of the circle. This point is the midpoint of the chord. The chord is long enough if the midpoint falls within a concentric circle of half the radius (area is $1/4$ of the total). **$P = 1/4$.**
  *   **The Lesson:** Each method assumes a uniform distribution over a different parameter (arc length, radial distance, area). Each is mathematically consistent. None is privileged by the phrase "chosen at random" alone.
  *   **Consensus vs. Contestation:** It is settled that these methods yield different results due to different measures. It is **contested** whether one method corresponds to "true" randomness in a physical experiment (e.g., throwing straws onto a circle) or if the question is simply ill-posed until the physical mechanism of selection is specified.

  **3. The Reference Class Problem**
  Closely related to Bertrand's Paradox is the Reference Class Problem (associated with Venn and Reichenbach). To assign a probability to a single event (e.g., "This coin will land heads"), we must place it in a class of similar events (e.g., "All tosses of this coin," "All tosses by this person," "All tosses in this century").
  *   **The Issue:** The same event belongs to infinite classes with different frequencies.
  *   **Distinction:** Keep clear the difference between **Physical Chance** (the objective propensity or frequency of the coin) and **Credence** (the rational degree of belief an agent should hold). The PoI is a rule for credence in the absence of knowledge about chance. Bertrand's paradox shows that even our *epistemic* credence is unstable if the description of the world is ambiguous.

  ---

  ### Part II: Reading *Rosencrantz and Guildenstern Are Dead*
  **Probability, Script, and the Anxiety of Indifference**

  Now, apply this framework to Stoppard's play. Be careful not to reduce the play to a mere puzzle; the mathematics illuminates the text, but the text exceeds the mathematics.

  **1. Guildenstern's Tacit Invocation of Indifference**
  In the opening scene, the coin lands heads 92 times in a row. Guildenstern's reaction is not merely frustration; it is epistemological panic. He tacitly invokes the PoI when he insists that the law of averages must hold. He assumes the sample space is binary ({Heads, Tails}) and that there is no reason to prefer one over the other.
  *   **The Breakdown:** Guildenstern treats the coin as a physical object governed by natural law, but he is actually inside a dramatic structure. He is trying to apply the PoI to a system where the "mechanism of selection" is not chance, but authorship.
  *   **Reference Class Failure:** Guildenstern cannot find the correct reference class. Is the coin part of the class "Fair Coins"? Or "Props in a Tragedy"? Or "Objects in a Universe Determined by Shakespeare"? If the class is the latter, $P(\text{Heads})$ might be 1, dictated by the needs of the plot (to distract them from their purpose). The paradox is not in the coin; it is in Guildenstern's inability to identify the causal structure generating the data.

  **2. Determinism vs. Metaphysical Chance**
  Does the play push us toward determinism?
  *   **The Script as Hidden Variable:** In Bertrand's terms, the "script" acts as a hidden variable that fixes the measure. If the outcome is written, the probability is either 0 or 1. Guildenstern's error is treating an ontological certainty as an epistemic uncertainty.
  *   **Beyond Determinism:** However, the play is not simply deterministic. Stoppard introduces moments where the characters seem to step outside the script, only to be pulled back. This suggests something probability theory has no name for: **Narrative Necessity**. Unlike physical causality, narrative necessity does not operate by local laws but by global structural requirements (e.g., "They must die because they are in *Hamlet*").
  *   **The Strain:** Here you must be honest with your students. A coin toss is a discrete, binary event. Bertrand's paradox relies on continuous measures. The mathematical analogy strains here. The coin is likely biased (or fixed), which is a trivial explanation in probability theory (the parameter $p \neq 0.5$). But for Guildenstern, the bias is metaphysical. The play is not about Bertrand's Paradox per se; it is about the **phenomenology** of living inside a paradox where the rules of inference seem to have broken.

  **3. Dramatic Irony as Asymmetric Credence**
  The audience possesses information the characters do not: they know the ending of *Hamlet*.
  *   **Credence Mismatch:** For the audience, the probability of Rosencrantz and Guildenstern's death is 1. For the characters, they attempt to calculate it using the PoI (treating life and death as indifferent possibilities).
  *   **Philosophical Implication:** This highlights the distinction between Chance and Credence. The "Chance" is fixed by the text (Stoppard/Shakespeare). The "Credence" varies based on the agent's position within the meta-theatrical hierarchy. This mirrors the Reference Class problem: your probability assignment depends on whether you view the event from inside the system (the character) or outside it (the author/audience).

  **4. Where the Reading Strains**
  *   **Discrete vs. Continuous:** Do not claim the coin toss *is* Bertrand's Paradox. It is not. The coin toss is a failure of the **assumption of independence**, not necessarily a failure of parametrization. A biased coin is a coherent probabilistic model; a "scripted" coin is not a probabilistic model at all.
  *   **Drama vs. Math:** The play's subject is not really probability; it is existential dread and the lack of agency. Probability is the *language* Guildenstern uses to express his confusion, not the *cause* of it. If you reduce the play to an illustration of the PoI, you risk missing the human stakes. The math explains why his reasoning fails; the play explains why that failure hurts.

  ---

  ### Part III: Conclusion for the Seminar
  **What the Play Supplies**

  End the session by articulating what Stoppard offers that the technical literature does not.

  1.  **The Phenomenology of Uncertainty:** Probability theory abstracts away the agent. It deals with coherent credences. *Rosencrantz and Guildenstern Are Dead* dramatizes the **anxiety** of an agent who cannot locate the correct reference class. It shows what it *feels like* when the Principle of Indifference stops working—when the world refuses to be uniform.
  2.  **The Limits of Rationality:** Guildenstern is rational. He uses logic and probability. But he is in an irrational context (a meta-theatrical limbo). The play suggests that rational tools (like the PoI) are only as good as the ontology they are applied to. If the world is scripted, probability is the wrong language.
  3.  **The Human Cost:** In the technical literature, Bertrand's Paradox is a puzzle to be solved by refining definitions. In the play, the "paradox" leads to death. Stoppard reminds us that for the subjects of probability (us), the failure to distinguish between chance and necessity is not an academic error; it is a fatal one.

  **Summary for the Board:**
  *   **PoI:** Requires parametrization (Settled).
  *   **Bertrand:** Different measures $\rightarrow$ Different probabilities (Settled).
  *   **Guildenstern:** Applies PoI to a non-probabilistic system (The Script).
  *   **The Gap:** Math solves for coherence; the Play suffers the incoherence.

  This structure allows you to teach the rigor of the probability philosophy while honoring the ambiguity and depth of Stoppard's work.
