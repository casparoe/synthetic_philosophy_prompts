      *   **Structure:**
          1.  Technical Side (Honest & Clear): Principle of Indifference (PoI), need for parametrization, Bertrand's Paradox (random chord), Reference Class Problem, distinction between physical chance and credence. Distinguish settled vs. contested matters.
          2.  Literary Side (Faithful & Nuanced): Apply the technical concepts to the play. Where does Guildenstern invoke indifference? Is it a biased coin or a failure of the principle? Determinism vs. Chance vs. Something Else? Acknowledge strains in the analogy (discrete vs. continuous, drama vs. math).
          3.  Conclusion: What the play adds to the technical literature (phenomenology of probability).
      *   **Constraints:** Do not reduce play to illustration; do not bend math. Be plain about where the reading strains. Distinguish consensus from contestation.

  2.  **Part 1: The Technical Side (Probability & Philosophy)**
      *   *Principle of Indifference (PoI):* Define it (Keynes/Laplace). If $N$ mutually exclusive, exhaustive possibilities, and no reason to prefer one, assign $1/N$.
      *   *The Problem:* It requires a sample space. "Possibilities" aren't self-individuating.
      *   *Bertrand's Paradox:* The classic example. Random chord in a circle. Probability length > side of inscribed equilateral triangle.
          *   Method 1: Random endpoints (Uniform on circumference) $\rightarrow P = 1/3$.
          *   Method 2: Random radius/point on radius (Uniform on radius) $\rightarrow P = 1/2$.
          *   Method 3: Random midpoint (Uniform on area) $\rightarrow P = 1/4$.
      *   *Consensus vs. Contestation:*
          *   *Settled:* PoI is underdetermined without a specified measure/parametrization. The three methods are each uniform *in some parameter*.
          *   *Contested:* Is this a paradox showing PoI is broken, or just showing it needs a "Principle of Transformation Invariance" (Jaynes)? Is there a "correct" physical measure?
      *   *Reference Class Problem:* (Reichenbach/Venn). Probability is relative to a class. Is this coin toss part of "all tosses," "tosses by Guildenstern," "tosses in tragedies"?
      *   *Chance vs. Credence:* (Lewis). Physical chance (propensity/frequency) vs. Rational degree of belief. PoI is usually about credence (epistemic), but Guildenstern worries about the physical coin.

  3.  **Part 2: The Literary Side (Rosencrantz and Guildenstern Are Dead)**
      *   *The Opening:* 92 heads in a row.
      *   *Guildenstern's Reaction:* He isn't just upset about losing money; he's upset about the *laws of probability*. He invokes natural law ("a weaker man... might be excused... but I..."). He expects equilibrium.
      *   *Invoking Indifference:* Guildenstern assumes the coin has no memory and no bias. He expects the long run to balance out (Gambler's Fallacy mixed with PoI). He treats "Heads" and "Tails" as the indifferent pair.
      *   *The Strain (Discrete vs. Continuous):* A coin toss is binary. Bertrand's is continuous. The PoI works fine for a binary coin *if* we assume symmetry. The paradox here isn't parametrization of the coin itself, but the *context* of the toss.
      *   *Reference Class:* What class does this coin belong to? "Fair coins"? "Props in a play"? "Objects in a deterministic universe"?
      *   *Determinism vs. Script:* They are characters in *Hamlet*. Their deaths are written.
          *   If the script is real, $P(\text{Death}) = 1$.
          *   If they act as free agents, $P(\text{Death})$ is unknown.
          *   Guildenstern tries to apply probability to a deterministic system. This is the core tension.
      *   *Does the coin expose PoI weakness?* Not exactly Bertrand's weakness. It exposes the weakness of applying epistemic probability (credence) to an ontological reality (the script). The coin isn't "random" in the Bertrand sense; it's fixed by the Author (Stoppard/Shakespeare).
      *   *Dramatic Irony:* The audience knows the end. R&G do not. This creates an asymmetry in credence.

  4.  **Part 3: Synthesis and Conclusion**
      *   *What the play adds:* The *feeling* of the paradox. Math deals with abstract measures; the play deals with the anxiety of the agent who cannot find the correct reference class.
      *   *Phenomenology:* Living inside the paradox. The "uncanny" nature of probability when it stops behaving like math and starts behaving like fate.

