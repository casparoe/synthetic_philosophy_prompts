  2.  **Deconstruct the Philosophical Tension:**
      *   *Method of Isolation:* To test intrinsic value, imagine the thing exists absolutely alone. Is it better than nothing?
      *   *Doctrine of Organic Unities:* The value of a whole is not the sum of the values of its parts. A part might have no value alone but contribute vastly to a whole (or vice versa).
      *   *The Conflict:* Moore claims Beauty and Friendship are the greatest goods.
          *   *Beauty:* Usually involves a beautiful object + consciousness of it. If we isolate the *object* (without consciousness), Moore admits it has little/no value. If we isolate *consciousness of beauty*, that's the organic whole. But the prompt suggests the tension lies in whether the *object's* nature matters if the value is in the *whole*.
          *   *Friendship/Personal Affection:* Involves affection + a worthy object (a good person).
      *   *Priya's Point (from the prompt):* If value is organic, you can't isolate the parts to find the source of value. Yet Moore says the value depends on the *nature of the object* (beautiful thing, good person). This implies the object has some normative weight *before* entering the whole, which threatens the isolation test or the organic unity doctrine.
      *   *Resolution/Consistency:* Moore needs to maintain that the *state of consciousness* directed at the object is the primary locus of value, but the *quality* of that state depends on the object's properties. To be consistent, he must concede that the "parts" (the object alone) have zero intrinsic value, and the variation in the value of the "whole" is due to the *relation* or the specific *quality of the consciousness*, not the object's independent value.

  3.  **Drafting the Exam Question:**
