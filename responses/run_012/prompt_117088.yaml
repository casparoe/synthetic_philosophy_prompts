answer: |-
  **Exam Question**

  **Module:** ETH304 – Meta-Ethics and the Good
  **Time Allowed:** 60 Minutes
  **Instructions:** Answer the question below. No notes or texts permitted.

  **Question:**
  G. E. Moore employs the 'Method of Isolation' to determine intrinsic value, yet simultaneously defends the 'Doctrine of Organic Unities', wherein the value of a whole is not the sum of its parts. Critically examine the tension between these two methodological commitments as they apply to Moore's two primary examples of great goods: the appreciation of beauty and the pleasures of human intercourse (friendship). Specifically, if the value resides in the organic whole (the consciousness of the object) rather than the object itself, what account can Moore give of the fact that the *nature* of the object (e.g., a beautiful thing vs. an ugly thing; a virtuous person vs. a vicious one) determines the magnitude of the good? What, if anything, must Moore relinquish to render his view consistent?

  ***

  **Model Answer**

  The central tension in *Principia Ethica* lies between Moore's atomistic Method of Isolation and his holistic Doctrine of Organic Unities. The Isolation Test dictates that to ascertain intrinsic value, one must consider a thing in absolute isolation, asking whether its existence is preferable to nothing. Conversely, the Doctrine of Organic Unities asserts that the value of a whole is not merely the sum of the values of its constituent parts; a part with zero intrinsic value may be essential to a whole of great positive value. This creates a significant friction when Moore identifies the 'appreciation of beauty' and 'personal affection' as the paramount goods.

  Regarding beauty, Moore argues that a beautiful object existing unperceived has negligible intrinsic value. The great good arises only when consciousness is directed at the object. Here, the organic whole is 'consciousness of a beautiful object'. The tension emerges when we ask why this whole is superior to 'consciousness of an ugly object'. If we apply the Isolation Test strictly to the parts, the object itself contributes no value. Therefore, the variation in the value of the whole cannot be attributed to the object's intrinsic worth. Moore must argue that the *quality of the consciousness* itself differs depending on the object. The beauty of the object is not a value-bearing part added to the consciousness; rather, it is a condition that alters the intrinsic quality of the conscious state. To maintain consistency, Moore must relinquish the intuition that the object's beauty is an independent good that 'adds' to the experience. He must insist that the object is merely a requisite condition for a specific, higher-quality state of mind.

  The tension is sharper regarding friendship, or 'the pleasures of human intercourse'. Moore posits that affection directed at a worthy person is a greater good than affection directed at an unworthy one. If we isolate the 'worthy person', do they possess intrinsic value that contributes to the whole? If Moore says yes, he undermines the Organic Unity doctrine, effectively treating the whole as a sum of parts (affection + worthy object). If he says no, he struggles to explain why the object's worthiness matters.

  To resolve this, Moore must claim that the 'worthiness' of the object is not a separable intrinsic value but a property that modifies the value of the affectionate consciousness. The love of a good person is a different *kind* of organic whole than the love of a bad person, not merely the sum of love plus goodness. However, this forces Moore into a difficult position regarding the Isolation Test. If the 'goodness' of the person is not intrinsically valuable in isolation (perhaps because virtue alone, without consciousness, is inert), then its normative force within the organic whole becomes metaphysically obscure.

  Consequently, to make his view consistent, Moore must give up the claim that the objects of these states (the beautiful thing, the virtuous friend) are themselves substantial loci of intrinsic value. He must reduce them to necessary conditions that determine the *quality* of the conscious whole, without possessing value themselves. Furthermore, he must clarify the ranking between beauty and friendship. Moore suggests friendship is the greater good. This cannot be licensed by the objects alone, as both involve consciousness. It must be licensed by the complexity of the organic whole: personal affection involves a reciprocal consciousness and a more complex object (a mind) than the appreciation of inanimate beauty.

  In conclusion, Moore can only maintain consistency if he rigorously denies that the object contributes value as a part. The nature of the object matters only insofar as it constitutes a different type of organic unity. The cost of this consistency is a highly mentalistic axiology where the external world is value-neutral, serving only as a scaffold for valuable states of consciousness. If Moore allows the object to retain independent normative weight, the Doctrine of Organic Unities collapses into simple summation; if he denies it entirely, he risks making the object's nature irrelevant. His only viable path is to treat the object's nature as constitutive of the consciousness's quality, not as an additive value.

  ***

  **Marking Scheme**

  **Total Marks:** 20
  **Pass Mark:** 10

  **1. Accurate Definition of the Method of Isolation (4 Marks)**
  *   **Requirement:** Student must define the test as imagining the thing exists *absolutely alone* to determine if it is better than nothing, distinct from comparative preference.
  *   **Deduction Note:** Deduct marks if the student treats the test as asking "would you prefer this to nothing?" (subjective preference) rather than an objective metaphysical inquiry.

  **2. Accurate Definition of Organic Unities (4 Marks)**
  *   **Requirement:** Student must state that the value of the whole is *not proportional* to the sum of the values of the parts (a part can have zero value but be essential to a valuable whole).
  *   **Deduction Note:** Deduct marks if the student treats Organic Unities as a mere 'summing rule' or claims it means parts lose their value entirely.

  **3. Application to Beauty (Consciousness vs. Object) (4 Marks)**
  *   **Requirement:** Student must explain that for Moore, the unperceived object has negligible value; the value lies in the *consciousness of* the object.
  *   **Deduction Note:** Deduct marks if the student claims the beautiful object itself is intrinsically good independent of consciousness.

  **4. Application to Friendship (The 'Worthiness' Condition) (4 Marks)**
  *   **Requirement:** Student must address that affection for a *worthy* object is superior to affection for an unworthy one, and explain that this ranking relies on the quality of the whole, not just the affection.
  *   **Deduction Note:** Deduct marks if the student asserts "friendship is better than beauty" without explaining that the *complexity of the object* (a mind vs. a thing) licenses this ranking.

  **5. The Consistency Trade-off (4 Marks)**
  *   **Requirement:** Student must identify what Moore must relinquish: specifically, the idea that the object contributes value *as a part*. The object must be treated as a condition determining the *type* of whole, not an additive value.
  *   **Deduction Note:** Deduct marks if the student offers a vague conclusion (e.g., "Moore needs to balance both") without specifying the metaphysical cost regarding the object's independent value.
