          5.  Resolution/Consistency: What Moore must give up (e.g., the idea that the object contributes value *as a part*, vs. the idea that the object is irrelevant).
          6.  Conclusion: Summary of the trade-off.
      *   *Key Philosophical Moves:*
          *   Isolation test determines *intrinsic* value of parts (usually zero for material objects).
          *   Organic Unities explain why the *combination* is valuable.
          *   The variation in value (beautiful vs. ugly object) must be explained by the *quality of the consciousness*, not the object's intrinsic value.
          *   To be consistent, Moore must deny that the object's goodness is a separable component adding to the sum.
      *   *Language:* British English (e.g., "analyse", "colour", "favour").

  5.  **Drafting the Marking Scheme:**
