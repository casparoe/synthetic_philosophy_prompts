answer: |-
  ### Restatement of the Position

  Let us call your view **Epistemic-Institutional Dualism**. Its core claim is that the *ontology* of war is asymmetrical (revisionist), but the *normative practice* of war must be symmetrical (traditionalist).

  **The Strongest Form:**
  1.  **Objective Morality:** An unjust combatant poses an unjust threat. Even if non-culpable, their action of killing a just combatant is objectively impermissible. The just combatant acts permissibly.
  2.  **Epistemic Shield:** Because the *jus ad bellum* status of a war is epistemically opaque to the ordinary combatant, unjust combatants are almost universally non-culpable for their participation. Therefore, they are not morally blameworthy.
  3.  **Institutional Constraint:** A legal or military code that attempted to encode objective asymmetry (e.g., telling soldiers they may not fire unless certain of their cause) would collapse the distinction between combatant and civilian, incentivize total war, or simply be ignored. Therefore, *in bello* rules and post-war tribunals must treat combatants symmetrically regarding liability to attack and criminal culpability.

  **The Space of Objections:**
  *   **The Revisionist Critique:** If the unjust combatant is non-culpable, on what grounds are they *liable* to be killed? Liability usually tracks culpability or rights forfeiture. If they retain their right not to be killed (due to non-culpability), killing them is merely excusable, not permissible. This collapses your "objective permission" claim.
  *   **The Traditionalist Critique:** By granting objective asymmetry, you undermine the moral basis of the symmetry you defend. If we *know* they are objectively wrong, treating them as equals is a moral lie that corrupts the just side.
  *   **The Empirical Critique:** The claim that asymmetry makes wars "worse" is a contingent sociological prediction. History suggests that distinguishing aggressor from defender (e.g., Nuremberg) can have normative utility without escalating violence.
  *   **The "Unfashionable" Complicity Objection:** If I am a just combatant and I accept your view, I must believe my enemy is objectively violating moral law but treat them as my moral equal. This creates a dissonance that may erode the restraint *in bello* rules are meant to enforce. Why restrain myself against someone objectively doing evil?
  *   **The Voluntarism Wedge:** Your epistemic shield relies on "ordinary soldiers." It fractures immediately upon contact with professional officers, volunteers in blatant wars of aggression, or mercenaries.

  ---

  ### Ranking the Objections by Decisiveness

  Here is how I rank the threats to your position, from the merely annoying to the fatal.

  **1. The Liability Gap (Fatal)**
  This is the deepest philosophical exposure. You claim symmetry in "who is liable to be killed."
  *   *The Problem:* In revisionist theory (e.g., McMahan), liability derives from being an *unjust threat*. In traditionalist theory, it derives from *status*. You want the former to be true but the latter to govern practice.
  *   *The Exposure:* If the unjust combatant is non-culpable (as your epistemic claim requires), they have not forfeited their right to life in the standard revisionist sense. If they haven't forfeited their right, killing them is not permissible, even if excused. But you claim it *is* permissible (symmetry in accountability). You are trying to have liability without forfeiture. Unless you can explain why a non-culpable person is liable to defensive killing, your symmetry is not "accountability," it is a denial of rights.
  *   *Why Decisive:* It strikes at the coherence of the "split." You cannot have asymmetry in permission and symmetry in liability without a theory of liability that ignores permission.

  **2. The Epistemic Wedge (Severe)**
  Your view rests on "almost without exception."
  *   *The Problem:* Modern warfare involves professional officer corps, access to independent media, and clear cases of aggression (e.g., crossing a recognized border without provocation).
  *   *The Exposure:* If a volunteer tank commander in an obvious war of aggression kills a defender, your view must say he is non-culpable (epistemic) and thus symmetrically liable. But intuitively, he is more culpable than a conscript. If you admit this, symmetry breaks. If you deny it, your epistemic claim becomes implausible.
  *   *Why Decisive:* It forces you to admit asymmetry in the very cases where moral judgment matters most (war crimes trials), rendering the "symmetry in accountability" claim vacuous for the worst offenders.

  **3. The Institutional Empirical Claim (Moderate)**
  *   *The Problem:* You claim asymmetric rules would make war worse.
  *   *The Exposure:* This is falsifiable. If we can point to historical instances where distinguishing aggressors did not lead to total war (e.g., the treatment of POWs in WWII was largely symmetrical *despite* asymmetrical *ad bellum* judgments), your claim loses force. It risks being a "counsel of prudence in moral dress," as you fear.
  *   *Why Moderate:* It weakens the justification but doesn't destroy the moral logic. You could retreat to a weaker claim: "Asymmetry is too risky," which is still a valid pragmatic move.

  **4. The Complicity Objection (Minor)**
  *   *The Problem:* Does treating the enemy as an equal make the just soldier complicit in the enemy's false moral status?
  *   *Why Minor:* This is largely psychological. A soldier can hold a dual view ("He is objectively wrong, but I must treat him as a peer to maintain the convention") without logical contradiction.

  ---

  ### Addressing Your Four Concerns

  **1. Excuse vs. Permission (The Epistemic Point)**
  You ask if the epistemic point delivers symmetry of permission or only excuse.
  *   *The Hard Truth:* It delivers **only excuse**.
  *   *The Exposure:* Ignorance of the *jus ad bellum* status excuses the agent from *blame*, but it does not make the act *permissible*. If I unknowingly kill an innocent person, I am not blameworthy, but I have still done something impermissible, and the victim (or their defender) had the right to stop me.
  *   *The Weight:* You are putting the weight of **permission** on a pillar built for **excuse**. By claiming symmetry in "what a rules-of-engagement manual should say," you are encoding an excuse as a permission. This is dangerous. A manual that says "You are permitted to kill" implies the victim has no right to object. But if the killer is objectively unjust, the victim *does* have a right to object. Your view forces the just combatant to accept the unjust combatant's fire as "permissible," which undermines the just combatant's own defensive rights.

  **2. Institutional Prediction vs. Prudence**
  *   *The Hard Truth:* It is currently **prudence in moral dress**.
  *   *The Exposure:* To make this an empirical prediction, you must specify the mechanism. *How* does telling soldiers "you are objectively wrong" make war worse? Does it cause them to fight harder? Does it cause the enemy to abandon restraint?
  *   *The Test:* If the only reason you hold this view is that you fear the alternative, it is a pragmatic compromise, not a moral reconciliation. A committed defender must concede that if we *could* implement asymmetric liability without escalation (e.g., via AI targeting or perfect information), your view would collapse into pure revisionism. If you admit that, the "split" is contingent, not principled.

  **3. Concrete Verdicts (Liability and Tribunals)**
  *   *The Hard Truth:* Your view predicts **counter-intuitive verdicts** regarding volunteers.
  *   *The Exposure:*
      *   *Liability:* You must say the unjust combatant is liable to be killed. But if they are non-culpable, why? If the answer is "because they are a threat," then the just combatant is also a threat to them. Why is the threat-directionality irrelevant?
      *   *Tribunals:* If a post-war tribunal treats the aggressor's soldier symmetrically to the defender's, it erases the distinction between aggression and defense. You must concede that *leaders* are treated asymmetrically (Nuremberg), but *soldiers* are not.
      *   *Conscript vs. Volunteer:* This is your Achilles' heel. If a volunteer joins a war they *know* (or should know) is unjust, your epistemic shield fails. You must either punish them (breaking symmetry) or exculpate them (breaking credibility). A committed defender of your view must concede that the volunteer *is* asymmetrically liable, which means your symmetry is not universal.

  **4. Falsifiability**
  *   *The Hard Truth:* The view is **highly resistant to falsification**, bordering on unfalsifiable.
  *   *The Exposure:* Any case where asymmetry seems appropriate (e.g., a blatant war criminal) can be deflected by saying "their epistemic conditions were non-standard." Any case where symmetry seems wrong (e.g., a pacifist killed by a soldier) can be deflected by "institutional necessity."
  *   *The Risk:* To save it, you must define the "ordinary soldier" and "epistemic opacity" so tightly that the view applies to almost no one, or so loosely that it covers obvious villains.

  ---

  ### The Thought Experiment: Perfect Epistemic Symmetry

  You asked for a case of perfect epistemic symmetry where moral verdicts nonetheless come apart. Here it is.

  **The Case of the Mirror Battalion:**
  Two battalions, A and B, face each other across a border.
  *   **Epistemic State:** Both have received identical intelligence briefings from their respective governments. Both governments have lied equally convincingly. Both soldiers believe with equal sincerity that they are defending their homeland against unprovoked aggression. Both are equally trained, equally conscripted, and equally non-culpable.
  *   **Objective Reality:** Battalion A is objectively on the defending side (their state was invaded). Battalion B is objectively on the invading side (their state initiated the invasion based on fabricated intel).
  *   **The Engagement:** A soldier from B fires on a soldier from A. A returns fire and kills B.

  **The Divergence:**
  *   **Your View:** Both soldiers acted permissibly (given their epistemic state). Both are symmetrically liable. Neither is to blame.
  *   **The Revisionist Verdict:** Soldier A acted permissibly. Soldier B acted impermissibly.
  *   **Where the Divergence Lives:** It lives in the **Forfeiture of Rights**.
      *   Soldier B, by posing an *unjust threat* (even innocently), has forfeited his right not to be killed by A.
      *   Soldier A, by posing a *just threat*, has **not** forfeited his right not to be killed by B.
      *   *The Crucial Test:* If Soldier B wounds Soldier A, A has a right to defensive force. If Soldier A wounds Soldier B, B *does not* have the same moral right to defensive force, because B is the unjust aggressor. B is essentially trying to defend a right he is currently violating (the right of A's state to sovereignty).
      *   *Your Exposure:* Your view cannot account for this asymmetry in **defensive rights**. You treat the killing as symmetrical, but the *victim's* right to resist is not symmetrical. If you admit B has less right to resist A than A has to resist B, you have admitted objective asymmetry in accountability. If you deny it, you are claiming an unjust aggressor has the same right to kill in self-defense as the victim defending their life.

  ---

  ### Final Verdict: Position or Hesitation?

  You asked me to tell you honestly whether this split amounts to a position or only a hesitation.

  **It is a hesitation.**

  It is a philosophically stable *compromise*, but not a unified *theory*. It is the moral equivalent of saying, "I believe slavery is objectively wrong, but for economic reasons, we should treat slaveholders as symmetrical participants in the labor market."

  You want the truth-value of Revisionism (it matters who is right) without the cost of Revisionism (it matters who is right). You are keeping the vocabulary of the deep ethics to satisfy your conscience, but you are surrendering the practical implications to satisfy your prudence.

  **The Move That Would Save It:**
  To turn this into a position, you must abandon the claim that the unjust combatant is *liable* to be killed in the same way the just one is. You must argue that we kill the unjust combatant out of **necessity**, not liability, while killing the just combatant is met with **liability**.
  *   *Symmetry of Practice:* We kill both.
  *   *Asymmetry of Grounds:* We kill the unjust because they are threats (liability). We kill the just because we must to win (necessity/lesser evil), even though they haven't forfeited their rights.

  If you make that distinction, you preserve the objective asymmetry (rights forfeiture) while maintaining the practical symmetry (both get shot). But you must admit that killing the just combatant is a tragic moral cost, not a symmetrical permission. Until you make that move, you are simply straddling the fence, and the bruising you felt in your seminar is the fence digging in.
