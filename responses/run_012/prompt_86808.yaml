answer: |-
  Here is the session plan, structured by conceptual dependency, with the specific interventions you requested.

  ### I. Dependency Order & Rationale

  You cannot ask whether indiscernibles are identical until the students know what kind of identity is at stake and what kind of indiscernibility counts. The session must follow this strict sequence:

  1.  **Numerical vs. Qualitative Identity:**
      *   *Why first:* Scientists often use "identity" to mean "qualitative similarity" (e.g., "these two samples are identical"). PII is about *numerical* identity (counting). If they conflate these, the principle looks tautological or nonsensical.
  2.  **Ontological vs. Epistemic Status:**
      *   *Why second:* You must establish that we are discussing the structure of reality, not the limits of measurement. If this is not settled before the examples, they will model the spheres as "objects we cannot distinguish," which validates the epistemic reading you want to avoid.
  3.  **The Principle (PII) vs. Its Converse (IoI):**
      *   *Why third:* Once identity types are clear, state the principle. Distinguish it immediately from the Indiscernibility of Identicals (IoI), which is logically uncontroversial.
  4.  **Case A (The Symmetric World):**
      *   *Why fourth:* This is the stress test. It only works if 1–3 are in place. It forces a choice: reject the possibility of the world or reject PII.
  5.  **Case B (The Causal Duplicate):**
      *   *Why fifth:* This resolves the tension in Case A not by changing the objects, but by changing the *property vocabulary*. It shifts the debate from objects to properties.
  6.  **The Property Boundary (The "What Counts?" Question):**
      *   *Why last:* This is the philosophical payoff. The verdict on PII depends entirely on which properties are admissible.

  ---

  ### II. The Epistemic Kill

  **Where to kill it:** Immediately after **Step 1 (Numerical/Qualitative)** and before **Step 2 (Ontological/Epistemic)**. Do not introduce the spheres until this is dead.

  **What must precede it:** The distinction between Numerical and Qualitative identity.
  *   *Reason:* You need them to accept that two things can be qualitatively identical but numerically distinct *in principle* (e.g., two distinct electrons in a standard model) before you ask if they *must* be. If you haven't secured the concept of numerical distinctness, they will hear "indiscernible" as "I can't tell them apart."

  **How to execute the kill:**
  Explicitly stipulate the "God's Eye View" rule. Tell them: *"For this session, assume an omniscient perspective. 'Indiscernible' does not mean 'we lack the instruments to measure the difference.' It means there is no fact of the matter in the universe that distinguishes them. If you find yourself arguing about measurement limits, you have left the room."*

  Write this on the board. If anyone appeals to observation during Case A, point to this rule.

  ---

  ### III. The Carrying Example: Requirements

  To make Case B function as the lever that shifts the question from "how many things" to "what is a property," the examples must be engineered precisely.

  **Case A (Symmetric Spheres) Must Have:**
  *   **Pure Relational Symmetry:** They must be defined only by their distance from *each other*. No background grid, no absolute space.
  *   **Intrinsic Sameness:** Mass, charge, temperature, atomic structure must be stipulated as identical.

  **Case A Must Lack:**
  *   **Any External Reference:** No stars, no container walls, no observers. If there is an external reference, spatial location becomes an intrinsic differentiator (distance from Wall A vs. Wall B), and the metaphysical problem dissolves into geometry.

  **Case B (Causal Duplicate) Must Have:**
  *   **Temporal Asymmetry:** One sphere exists at $t_1$; the second comes into existence at $t_2$ via a process copying the first.
  *   **Persisting History:** The history must be stipulated as a real feature of the world, not just a story we tell.

  **Case B Must Lack:**
  *   **Intrinsic Scars:** The duplication process must be perfect. No "maker's marks," no entropy differences. If there is an intrinsic physical trace of the history, the students will latch onto that as a qualitative difference, missing the point that *history itself* is the proposed property.

  **The Pivot Mechanism:**
  In Case A, PII fails (unless you allow spatial location as a property). In Case B, PII holds (if you allow historical origin as a property). The session succeeds only if the students realize the *objects* haven't changed between Case A and Case B; only the *admissible property list* has changed.

  ---

  ### IV. Misconception Map

  Here is the order in which these errors will arise and the exact intervention point for each.

  | Misconception | When it arises | Intervention Point | How to head it off |
  | :--- | :--- | :--- | :--- |
  | **IoI vs. PII** | **Minute 5.** As soon as you state the principle. | **Before Case A.** | Write the logic on the board. IoI: $(x=y) \rightarrow \forall F(Fx \leftrightarrow Fy)$. PII: $\forall F(Fx \leftrightarrow Fy) \rightarrow (x=y)$. Tell them IoI is free; PII costs money. We are pricing PII. |
  | **Epistemic Reading** | **Minute 15.** When you describe the spheres as "alike in every way." | **Before Case A (The Kill).** | Use the "God's Eye View" stipulation described above. Remind them: "We are not asking if *you* know; we are asking if *nature* knows." |
  | **Spatial Location** | **Minute 35.** During Case A discussion. "But they are in different places!" | **During Case A.** | Block Absolute Space. Ask: "Different places relative to what?" If they say "Relative to each other," point out the symmetry: Sphere 1 is 10m from Sphere 2; Sphere 2 is 10m from Sphere 1. The relation is identical. |
  | **Triviality Trap** | **Minute 65.** After Case B, trying to save PII. "Each has the property of being itself." | **During Closing.** | Acknowledge this makes PII true but useless. Call it the "Haecceity Escape." Tell them we are banning this move to see if the principle does any work. |

  ---

  ### V. Exclusions & Closing

  **What to Leave Out (And Tell Them Why):**
  At the start of the session (Minute 2), explicitly exclude the following two topics. Do not wait for questions.

  1.  **Quantum Mechanics:**
      *   *Say this:* "I know many of you work with particles. I am banning quantum statistics from this discussion. In QM, indistinguishability is a physical constraint on states. Here, we are asking a metaphysical question about objects and properties prior to physics. If you bring up bosons or fermions, you are changing the rules of the game to avoid the metaphysics."
      *   *Reason:* Scientists will use QM to solve the problem empirically. This prevents them from engaging with the conceptual distinction between objects and properties.

  2.  **Haecceities ("This-ness"):**
      *   *Say this:* "I am also banning the property of 'being identical to x.' If we allow that, PII is trivially true for everything, and the discussion ends. We are testing whether *qualitative* properties can ground numerical identity."
      *   *Reason:* This prevents the Triviality Trap from derailing the discussion before it starts. It forces them to grapple with *qualitative* vs. *relational/historical* properties.

  **The Final Diagnostic Question:**
  Do not ask "Do you believe PII?" That invites opinion, not understanding. Ask this:

  > *"If we agree that Case B contains two distinct spheres solely because of their causal history, have we saved the Principle of Identity of Indiscernibles, or have we changed the definition of 'property' so much that the principle no longer tells us anything about the world?"*

  *   **Why this works:** If they answer "We saved it," they missed the point that the *cost* of saving it was inflating the property vocabulary. If they answer "We changed the definition," they understand that the debate is actually about ontology (what exists) disguised as a debate about logic (identity). This confirms they have grasped the shift from objects to properties.
