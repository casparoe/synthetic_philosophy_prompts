answer: |-
  The structural topology of the epiphenomenalist argument translates perfectly into a computation graph with a common-cause fork and null intervention effects, but the normative force of the problem vanishes because interpretability vocabulary measures reliability without containing a concept of warrant.

  To translate the thesis, we map the "physical goings-on" to an early computation subgraph $C$, the "phenomenal properties" to a specific hidden state vector $H$, and "judgments about experience" to the model's output tokens $O$. The epiphenomenalist claim becomes: $C$ causally influences both $H$ and $O$, but there is no directed path from $H$ to $O$. You verify this via intervention: if you ablate $H$ or patch it with values from a different context, $O$ remains unchanged, confirming that $H$ is causally inert with respect to the report. The problem translates as follows: if $O$ asserts the presence of features in $H$, but interventions on $H$ do not shift $O$, then the correlation between $O$ and $H$ is entirely mediated by $C$. In your vocabulary, the model's report is causally isolated from the state it reports on, yet remains accurate.

  The residue report shows a clean split between structural mechanics and epistemic norms. The exact counterpart is the causal graph itself; interpretability tools are explicitly designed to distinguish between states that are causally downstream (influencing logits) and states that are merely correlated via common ancestry (read-only by probes). Nobody in interpretability finds it paradoxical that a probe can accurately classify a hidden state without that state causing the classification; this is standard behavior for redundant encodings or parallel pathways. The part with no counterpart is the inference from causal isolation to epistemic defeat. Your vocabulary captures reliability perfectly—you can measure the mutual information between $H$ and $O$ and demonstrate robustness across distributions—but it has no slot for warrant. You can show the report is reliable, but you cannot show within the framework why the model is *justified* in making it.

  This absence is not a gap in your vocabulary but evidence that the philosophers' worry relies on a normative intuition that reliability talk cannot recover because it is not required for functional explanation. The philosophical problem assumes that warrant requires a causal chain linking the fact to the belief (a causal theory of knowledge), whereas your framework operates on a reliabilist intuition where accurate correlation suffices for successful function. If the model consistently outputs $O$ when $H$ is present due to $C$, the system works as intended. The "self-undermining" charge only survives if you import the external philosophical premise that causal isolation invalidates knowledge claims, a premise that mechanistic interpretability renders visible as an optional constraint rather than a structural necessity.
