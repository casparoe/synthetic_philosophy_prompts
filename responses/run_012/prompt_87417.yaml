answer: |-
  ### Desiderata for a Theory of Democratic Membership

  **I. Structural Constraints**

  1.  **Non-Circularity**
      *   **Consideration:** The rule used to define the demos cannot presuppose the existence or boundaries of the demos it defines, avoiding the regress of "who decides who decides."
      *   **Status:** Genuine Requirement.

  2.  **Operationalizability**
      *   **Consideration:** An authorized body (like a charter commission) must be able to apply the principle using available evidence without needing the very membership list it is trying to generate.
      *   **Status:** Genuine Requirement (for institutional application).

  3.  **Normative Independence**
      *   **Consideration:** The justification for the boundary must rely on principles of legitimacy rather than mere historical accident or brute force, ensuring the boundary is morally defensible.
      *   **Status:** Genuine Requirement.

  **II. Case Determinacy**

  4.  **Residence vs. Nationality**
      *   **Consideration:** The theory must provide a principled basis for including or excluding long-term non-citizen residents who are subject to local law but lack national citizenship.
      *   **Status:** Genuine Requirement.

  5.  **Liability vs. Presence**
      *   **Consideration:** The theory must explain whether taxation and liability for service justify voting rights for citizens residing permanently abroad, distinct from mere cultural affiliation.
      *   **Status:** Genuine Requirement.

  6.  **Competence vs. Status**
      *   **Consideration:** The theory must distinguish between the *right* to membership and the *capacity* to exercise it, accounting for children and adults under guardianship without permanent exclusion.
      *   **Status:** Genuine Requirement.

  7.  **Cross-Border Externalities**
      *   **Consideration:** The theory must determine if and when people outside the jurisdiction (e.g., downstream neighbors) acquire membership rights due to unavoidable harm from collective decisions.
      *   **Status:** Genuine Requirement.

  8.  **Temporal Scope**
      *   **Consideration:** The theory must offer a non-paralyzing account of future generations' interests regarding long-lived infrastructure, distinguishing them from current voters.
      *   **Status:** Preference (of intergenerational justice camp).

  9.  **Market vs. Polity**
      *   **Consideration:** The theory must distinguish between being affected by economic outcomes (wages/prices) and being subject to political authority, preventing the demos from expanding to include all market participants.
      *   **Status:** Genuine Requirement.

  10. **Constitutional Moments**
      *   **Consideration:** The theory must resolve the paradox of a community declaring independence where the group claiming the right to decide the boundary is identical to the group whose boundary is in question.
      *   **Status:** Genuine Requirement.

  **III. Conceptual Distinctions**

  11. **Membership vs. Subjection**
      *   **Consideration:** The theory must conceptually separate holding a share in authority (voting) from merely bearing the consequences of authority (obedience/harm).
      *   **Status:** Genuine Requirement.

  12. **Graded Inclusion**
      *   **Consideration:** The theory should allow for intermediate statuses, such as consultation rights without voting, or voting on specific issues without full citizenship liability.
      *   **Status:** Preference (of pluralist/differentiated citizenship camp).

  ***

  ### Can the Requirements Be Met Jointly?

  Your suspicion is correct: the demand for a **boundary principle owing nothing to any actual decision** (Normative Independence/Non-Circularity) and the demand that **the demos be self-determining** (specifically in Constitutional Moments) cannot be fully satisfied simultaneously within a single logical frame.

  If the boundary is set by an external normative principle (e.g., "all affected"), the group does not constitute itself; it is constituted by the principle. If the group constitutes itself (e.g., "we decide who we are"), the boundary rests on a decision that lacks prior democratic legitimacy, violating Non-Circularity.

  **The Resolution for Your Purpose:**
  For an *institution* (like a charter commission or river authority), this tension is resolvable practically, though not theoretically. The institution acts as a **trustee of the normative principle** on behalf of a higher-order political order (the state or international treaty). The "demos" does not decide its own boundary; the *authority* applies the principle to define the demos. Therefore, for your dissertation's specific aim (institutional application), you can meet the requirements by shifting the locus of self-determination from the *local demos* to the *constitutional order* that empowers the commission. However, as a general theory of democratic legitimacy, you must accept that the "first" boundary is always undemocratic; it is an act of founding, not voting.

  ***

  ### Scorecard: Existing Theory Families

  | Theory Family | Non-Circularity | Operationalizability | Residence/Nationality | Cross-Border | Market Distinction | Graded Inclusion |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **All-Affected Interests** | **Fail** (Interests depend on decisions not yet made) | **Fail** (Impossible to measure all interests) | Pass (Includes residents) | **Fail** (Expands infinitely) | **Fail** (Includes market actors) | Pass |
  | **Subjection-to-Coercion** | Pass (Law is observable) | Pass (Legal status is clear) | Pass (Includes residents) | **Fail** (Excludes external neighbors) | Pass (Distinguishes market) | **Fail** (Binary: coerced or not) |
  | **Historical-Association** | Pass (History is fixed) | Pass (Records exist) | **Fail** (Excludes new residents) | **Fail** (Excludes neighbors) | Pass | **Fail** (Binary: member or alien) |
  | **Territorial/Stakeholder** | Pass (Boundaries mapped) | **Pass** (Best fit for institutions) | Pass (Includes residents) | **Fail** (Excludes non-territorial harm) | Pass | **Fail** (Usually binary) |

  ***

  ### The Most Exclusionary Requirement

  **Non-Circularity.**

  This is the single requirement that does the most to exclude candidates. Most intuitive theories (especially "all-affected" and "self-determination" models) collapse when pressed on *who applies the test*. The "all-affected" principle requires knowing the decision before the voters are chosen, but the voters are needed to make the decision. The "self-determination" principle requires a demos to exist before it can determine itself. Only theories that accept an external arbiter (like the State or a Constitutional Court) or a fixed pre-political fact (like Territory) survive this constraint, which is why **Operationalizability** (your second hardest constraint) effectively functions as a proxy for Non-Circularity in institutional settings. If a theory cannot be applied without assuming the answer, it is circular.
