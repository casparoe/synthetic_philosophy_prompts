prompt: |-
  Two people on my team have been going at each other for months about whether frontier AI should be open-sourced. One is dead set that if you don't open the weights, the data, and the training code, you just hand the whole field to three labs and nobody else can check them. The other thinks past some capability level, putting the weights out is basically arming whoever asks, and that the open camp never prices in the oversight you give up. They've stopped hearing each other, so I want to draft the joint statement they could both sign and get the argument moving again.

  Include: what they can actually agree on -- I'd start with the idea that "open-source" isnt one thing but a bundle (weights, training data, code, eval results, safety tooling) and they don't have to take the same line on each; the places they really split, each worded so the person who holds it wouldn't wince; and the cruxes, i.e. sub-questions where settling one would force one of them to move. One crux I suspect is whether releasing at the frontier permanently lowers the capability ceiling or whether the ceiling just keeps moving anyway. Another is whether the thing we're worried about spreading is capability or oversight -- an open release can spread both. For each crux, give a case or piece of evidence both would agree is relevant, and write down each side's prediction in advance. Number the agreed claims, then a table for the disagreements, and if part of the fight turns out to be just about words, say which part.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Goal:** Draft a joint statement for two team members arguing about open-sourcing frontier AI.
      *   **Context:** They've been arguing for months, stopped hearing each other. Need to get the argument moving again constructively.
      *   **Key Requirements:**
          *   Include what they *can* agree on (specifically: "open-source" is a bundle, not a binary).
          *   Include where they *really split* (worded neutrally so neither winces).
          *   Identify *cruxes* (sub-questions where settling one forces movement).
          *   Specific Crux 1: Does releasing at the frontier permanently lower the capability ceiling vs. ceiling keeps moving?
          *   Specific Crux 2: Is the risk spreading *capability* or *oversight*?
          *   For each crux: Provide agreed-upon evidence/cases and each side's prediction.
          *   Format: Numbered agreed claims, Table for disagreements/cruxes, Note on verbal disputes.
      *   **Tone:** Professional, conciliatory, precise, actionable.

  2.  **Deconstruct the Positions:**
      *   **Person A (Pro-Open):** Believes closed source leads to centralization (3 labs), lack of scrutiny, stagnation. Values transparency, democratization, external safety auditing.
      *   **Person B (Pro-Closed/Restrictive):** Believes frontier weights = dangerous tools. Values control, oversight, preventing misuse by bad actors. Worried about irreversible proliferation.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be neutral and forward-looking. "Framework for Evaluating Open-Weight Frontier AI" or "Joint Statement on AI Openness and Safety." Let's go with "Joint Framework for Evaluating Frontier AI Openness."

      *   **Section 1: Areas of Agreement (The Foundation):**
          *   *Prompt Requirement:* "Open-source" isn't one thing but a bundle.
          *   *Idea:* Acknowledge that safety isn't binary. Both want safe AI. Both want innovation. Both agree centralization has risks. Both agree misuse has risks.
          *   *Drafting points:*
              1.  "Open source" is a spectrum (weights, data, code, docs).
              2.  Centralization of power is a risk.
              3.  Uncontrolled proliferation of dangerous capabilities is a risk.
              4.  External scrutiny improves safety *in principle*.
              5.  We need to make decisions based on specific capability levels, not blanket rules.

      *   **Section 2: Areas of Disagreement (The Split):**
          *   *Prompt Requirement:* Worded so neither winces.
          *   *Person A's view:* Closed weights = opacity = unchecked power.
          *   *Person B's view:* Open weights = uncontrollable spread = catastrophic misuse.
          *   *Drafting:* Need to frame these as "Risk Assessments" rather than "Moral Failings."
          *   *Side 1 (Open):* The primary risk is *concentration of power* without external audit.
          *   *Side 2 (Closed):* The primary risk is *proliferation of capability* without accountability.

      *   **Section 3: The Cruxes (The Pivot Points):**
          *   *Prompt Requirement:* Specific cruxes (Capability Ceiling, Capability vs. Oversight). Evidence + Predictions.
          *   *Crux 1: The Capability Ceiling.*
              *   *Question:* Does open-sourcing frontier models freeze progress or accelerate it relative to closed?
              *   *Open Side Prediction:* Open collaboration accelerates safety and progress; closed slows it down due to secrecy.
              *   *Closed Side Prediction:* Open release allows bad actors to catch up instantly; closed maintains a safety buffer.
              *   *Agreed Evidence:* Llama 2/3 impact vs. GPT-4 secrecy. The rate of fine-tuning vs. pre-training cost.
          *   *Crux 2: Capability vs. Oversight.*
              *   *Question:* What is the actual vector of harm? Is it the tool or the lack of governance?
              *   *Open Side Prediction:* Oversight can be distributed (community audit); capability spread is inevitable anyway.
              *   *Closed Side Prediction:* Oversight requires control points; once weights are out, control points vanish.
              *   *Agreed Evidence:* Stuxnet (code leaked but hard to deploy) vs. Cryptography (widely available but regulated export). Or maybe the "Catastrophic Misuse" cases (bio/cyber). Let's use the "Bio/Cyber misuse potential" as the evidence case.

      *   **Section 4: Verbal Disputes:**
          *   *Prompt Requirement:* Identify if part of the fight is just words.
          *   *Idea:* The definition of "Open Source." OSI definition vs. colloquial "weights available." Also the definition of "Frontier."
          *   *Drafting:* Clarify that "Open Source" (OSI) implies freedoms that might not be safe for frontier models. We are discussing "Open Weights" or "Restricted Access."

  4.  **Review and Refine:**
      *   *Check against constraints:* Numbered claims? Yes. Table for disagreements? Yes. Cruxes with evidence/predictions? Yes. Worded neutrally?
      *   *Tone Check:* Is it too academic? Too dry? Needs to feel like a truce that enables work.
      *   *Refining the Cruxes:* Make sure the predictions are falsifiable or at least testable in principle.
      *   *Refining the "Bundle" concept:* Ensure it's clear that they can agree on opening *some* layers (e.g., evals) while closing others (e.g., weights).

  5.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't sound like I'm taking a side.
      *   *Correction:* Ensure the "Evidence" for cruxes is something they would *both* accept as relevant data, even if they interpret it differently.
      *   *Correction:* The prompt asks for a "Joint Statement they could both sign." It needs to sound like *their* voice, not mine. It should be a document *for* them to use.

  6.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  **Joint Framework for Evaluating Frontier AI Openness**

  **Date:** October 26, 2023
  **Signatories:** [Name A], [Name B]

  ### 1. Shared Premises
  *We agree on the following foundational claims. Disagreements on strategy should not obscure these points of alignment.*

  1.  **"Open Source" is a bundle, not a binary.** Releasing a model involves distinct components: model weights, training code, training data, evaluation results, and safety tooling. We do not need to take the same position on every component; we can advocate for openness in some layers (e.g., eval results, safety tooling) while restricting others (e.g., frontier weights).
  2.  **Centralization carries systemic risk.** Concentrating the development and deployment of frontier AI within three to five closed laboratories creates single points of failure, reduces external scrutiny, and concentrates geopolitical power.
  3.  **Proliferation carries systemic risk.** Releasing capabilities that outpace our ability to govern or defend against them enables misuse by malicious actors, states, or non-state agents, potentially leading to irreversible harm.
  4.  **External scrutiny improves safety.** In principle, independent auditing, red-teaming, and academic access are necessary to verify safety claims and alignment properties.
  5.  **Context matters.** The appropriate release strategy depends on the specific capability level of the model in question. A policy for current models may not apply to models two generations ahead.

  ### 2. Core Disagreements
  *We acknowledge the following divergences in risk assessment. These are stated neutrally to ensure accurate representation of both views.*

  | Feature | Position A (Pro-Openness) | Position B (Pro-Restriction) |
  | :--- | :--- | :--- |
  | **Primary Risk Vector** | The primary danger is **opacity**. Closed development hides flaws, biases, and dangerous capabilities from the public and regulators, allowing labs to accumulate unchecked power. | The primary danger is **access**. Once weights are public, control is lost. Bad actors can remove safety guardrails and deploy capabilities without accountability. |
  | **Defense Mechanism** | Safety is best achieved through **distributed vigilance**. A broad community of researchers can find and patch vulnerabilities faster than a closed security team. | Safety is best achieved through **controlled deployment**. Security requires choke points where usage can be monitored, rate-limited, or revoked. |
  | **Inevitability** | Capabilities will leak or be replicated soon enough; openness ensures the "good guys" have the tools to defend themselves first. | Capabilities do not necessarily replicate instantly; restricting weights buys critical time for governance and defense to catch up. |

  ### 3. Strategic Cruxes
  *We identify the following sub-questions as "cruxes." If we can resolve these empirically or theoretically, our strategic disagreement should narrow. We commit to reviewing evidence on these specific points.*

  #### Crux 1: The Capability Ceiling
  **Question:** Does releasing weights at the frontier permanently lower the global capability ceiling (by allowing adversaries to catch up instantly), or does the ceiling keep moving regardless (because closed labs retain advantages in data/compute)?

  *   **Agreed Relevant Evidence:** The performance gap between Llama-2/3 (open weights) and GPT-4/Claude 3 (closed weights) over time; the cost ratio between inference/fine-tuning vs. pre-training.
  *   **Position A Prediction:** Open release does not significantly lower the ceiling. Closed labs retain a "moat" via proprietary data and massive compute clusters that cannot be replicated via weights alone. The gap remains stable or widens.
  *   **Position B Prediction:** Open release significantly lowers the ceiling. Weights allow adversaries to skip the R&D bottleneck, compressing the timeline for dangerous capability acquisition by months or years.

  #### Crux 2: Capability vs. Oversight
  **Question:** When we release a model, are we primarily spreading *capability* (the raw power to do harm) or *oversight* (the ability to detect and prevent harm)? Can open release increase oversight more than it increases capability risk?

  *   **Agreed Relevant Evidence:** Cases of "catastrophic misuse" in other domains (e.g., cryptography export controls, synthetic biology gene synthesis screening); the rate at which safety patches are adopted in open vs. closed ecosystems.
  *   **Position A Prediction:** Open release increases **oversight** more than risk. The community will identify dangerous fine-tunes and build defenses faster than closed teams can, netting a safety gain.
  *   **Position B Prediction:** Open release increases **capability** more than oversight. Malicious actors utilize the capability immediately, while defensive oversight is a public good that suffers from coordination problems and lags behind.

  ### 4. Clarification of Terms
  *We acknowledge that a portion of our debate has been semantic. To prevent future confusion:*

  *   **"Open Source":** We agree to stop using this term for frontier models unless they meet the Open Source Initiative (OSI) definition. For models with restricted weights or usage limits, we will use **"Open Weights"** or **"Restricted Access."**
  *   **"Frontier":** We define this not as a static line, but as models exceeding specific capability thresholds (e.g., autonomous cyber-offense, wet-lab bio-design). We agree to revisit the openness policy if a model crosses a specific capability threshold, rather than arguing about the model generation number.

  ### 5. Next Steps
  *To move forward, we agree to:*
  1.  Draft a release policy that treats the "bundle" (Section 1) separately, specifying which artifacts are open/closed for the next project.
  2.  Commission a review of the "Agreed Relevant Evidence" listed in Section 3 to update our predictions.
  3.  Re-evaluate this statement quarterly or upon the release of a new model generation.

  ***

  **Signed:**

  _____________________ (Position A)

  _____________________ (Position B)
