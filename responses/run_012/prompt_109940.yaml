answer: |-
  Here is an audit of your colleague's analogy. It is a sophisticated version of "Cornell Realism" (associated with Richard Boyd, David Brink, and Peter Railton), which applies Kripke-Putnam semantic externalism to ethics. While the analogy is rhetorically powerful, it conceals significant metaphysical and logical gaps.

  ### 1. The Correspondence Map

  Here is how the terms in the water/chemistry case are intended to map onto the moral/naturalist case:

  | Water/Chemistry Case | Moral/Naturalist Case (Colleague's View) |
  | :--- | :--- |
  | **Pre-scientific concept** | "Water" (clear, drinkable liquid) | "Good" / "Right" (commendable, choice-worthy) |
  | **Surface properties** | Transparency, wetness, quenching thirst | Praised by elders, promotes cooperation, yields satisfaction |
  | **Reference-fixing** | Ostension ("that stuff") + superficial description | Ostension ("that property") + functional role ("what we ought to pursue") |
  | **Division of linguistic labour** | Laypeople defer to chemists for essence | Laypeople defer to moral scientists (psychologists, biologists) for essence |
  | **A posteriori identity** | Water = H₂O | Good = Natural Property *N* (e.g., maximizing welfare) |
  | **The Open Question** | "Is water really H₂O?" (pre-chemistry) | "Is *N* really good?" (pre-moral science) |
  | **Eventual Discovery** | Spectroscopy, molecular analysis | Empirical inquiry into human flourishing/evolution |
  | **Status of the Question** | Closed once science settles it | Closed once science settles it |

  **The Missing Counterpart:**
  There is **no counterpart on the moral side for the "Causal-Structural Essence."**
  In the water case, the microstructure (H₂O) *causally explains* why the substance has the surface properties (why it is wet, transparent, quenches thirst). In the moral case, there is no agreed-upon natural property that *causally explains* why we judge certain actions as good. If "Good" = "Maximizing Pleasure," does the neural firing of pleasure *cause* the judgment of goodness, or does the judgment of goodness track the pleasure? The direction of fit is reversed. Water forces itself on us; we impose "good" on the world.

  ---

  ### 2. The Disanalogies (Ranked)

  I have ranked these by their argumentative weight, separating those that are merely inconvenient from those that break the argument.

  #### **Rank 1: The Normativity Gap (Argument-Breaking)**
  *   **The Disanalogy:** Identifying water as H₂O carries no imperative. Knowing something is H₂O does not tell you what to *do* with it. Identifying an action as "Good," however, is inherently action-guiding. To call something "good" is to imply it provides a reason for action.
  *   **Why it Breaks the Argument:** The water analogy explains how we identify a *kind*, but it does not explain how we identify a *reason*. Even if "Good" rigidly designates a natural property *N*, the statement "X has *N*" is a descriptive claim. The statement "X is Good" is a normative claim. The analogy bridges the gap between *concept* and *property*, but it does not bridge the gap between *property* and *obligation*. Your colleague has explained how we find the property, but not why that property commands us.

  #### **Rank 2: Causal Explanation vs. Rational Justification (Argument-Breaking)**
  *   **The Disanalogy:** H₂O explains the *behavior* of water. A candidate moral property (e.g., "evolutionary fitness" or "hedonic tone") does not explain the *validity* of the moral judgment.
  *   **Why it Breaks the Argument:** In science, the essence explains the phenomenon. In ethics, if you say "Goodness is fitness," the critic asks, "But why *ought* I pursue fitness?" The natural property explains why we *do* pursue it (causally), but not why we *should* (normatively). The water analogy conflates explaining the *usage of the word* with justifying the *authority of the norm*.

  #### **Rank 3: The Multiplicity of Candidates (Significant)**
  *   **The Disanalogy:** There was never serious scientific doubt that water had a single chemical essence. In ethics, the candidates for the natural property are heterogeneous and incommensurable (pleasure, virtue, social cohesion, divine will).
  *   **Why it Matters:** In the water case, rival theories (e.g., water is an element) were eliminated by experiment. In the moral case, rival theories (hedonism vs. deontology) often agree on the "surface properties" (both value kindness) but disagree on the "essence." This suggests the reference is not fixed to a single natural kind, but is essentially contested. If there is no unique essence, the identity claim "Good = *N*" fails.

  #### **Rank 4: The Division of Linguistic Labour (Picturesque)**
  *   **The Disanalogy:** We agree on who the experts are for water (chemists). We do not agree on who the experts are for goodness (priests? psychologists? philosophers? grandmothers?).
  *   **Why it Matters:** This is less fatal but damaging. It suggests that the "moral science" your colleague relies upon does not exist as a settled authority. Without a recognized epistemic authority, the claim that the open question will be "closed by inquiry" is speculative.

  ---

  ### 3. Addressing Your Three Specific Concerns

  **1. Causal-Structural Essence vs. Action-Guiding Nature**
  The analogy fails here. H₂O has a causal power to make things wet. Any candidate for "Good" must have the causal power to *generate reasons*. Natural properties (like brain states or evolutionary outcomes) do not inherently generate reasons; they are just facts.
  *   **The Press:** Ask him: "H₂O explains why water boils. What natural property explains why I *ought* to keep a promise? If you say 'social cohesion,' I ask: why ought I care about social cohesion?" The water analogy explains *prediction*; morality requires *justification*.

  **2. Multiple Unrelated Candidate Properties**
  This is fatal to the parallel. In the history of chemistry, "water" always referred to the same stuff, even when theories about it were wrong. In ethics, "good" might be a "cluster concept" with no single underlying essence (a la Wittgenstein or family resemblance).
  *   **The Press:** "If 'good' is like 'water', there must be one essence. But hedonists and Kantians agree on almost all surface judgments while disagreeing on the essence. In chemistry, if you disagree on the essence, you disagree on the predictions. In ethics, you can agree on the 'oughts' while disagreeing on the 'is'. This suggests 'good' does not name a natural kind."

  **3. Identity vs. Derivation (The Is/Ought Gap)**
  A true identity claim ("Goodness = Property *N*") closes the *ontological* gap (there are not two worlds), but it does not close the *logical* gap (inference).
  *   **The Press:** "Even if Good = *N*, the premise 'X is *N*' is an 'Is' premise. The conclusion 'One ought to pursue X' is an 'Ought' conclusion. An identity statement allows substitution of terms, but it does not create a normative force where there was none. You can derive 'X is Good' from 'X is *N*', but you cannot derive 'Do X' from 'X is Good' without a bridging premise like 'One ought to pursue the Good.' That bridging premise is not a natural fact."

  ---

  ### 4. Verdict on the Conclusion

  **Does the conclusion survive the audit?**
  **No.** The analogy is carrying the entire weight of the conclusion, and it collapses under the strain of normativity.

  *   **On the Naturalistic Fallacy:** Your colleague is partially right that Moore's Open Question Argument relies on a descriptivist theory of meaning (which Kripke/Putnam undermined). If moral terms are rigid designators, you cannot define them a priori. So, the "fallacy" of defining good in natural terms is indeed a mistake. *However*, Moore's deeper point was not about definitions, but about **supervenience without identity**. The audit shows that while the semantic argument holds (we don't define good), the metaphysical argument (good *is* natural) does not follow from the semantics.
  *   **On the Is/Ought Gap:** The conclusion that the gap is an "illusion" is too strong. The gap survives as a gap in **reasons**. Even if moral properties are natural, the *normative force* of those properties is not captured by their naturalness. The gap is not between two realms of being, but between two types of inference (descriptive vs. prescriptive). The water analogy hides this because water has no prescriptive force.

  ### 5. A Better Analogy

  Your colleague is entitled to claim that moral properties are *real* and *discoverable*, but not that they are identical to non-normative natural properties in the way water is identical to H₂O.

  **The "Health" Analogy:**
  A better analogy for naturalist normativity is **Health**.
  *   **Correspondence:** "Health" is a natural property (biological functioning) but also normative (you *ought* to pursue it).
  *   **Why it's better:** It acknowledges that the property is natural (physiology) but admits the normativity comes from the *interests of the organism*.
  *   **The Catch:** It still faces the Is/Ought gap ("Why ought I be healthy?"), but it locates the normativity in the *teleology* of the creature, not just the brute matter.
  *   **The Press:** "Your water analogy is too static. Use 'Health.' Health is natural, but it is relative to the organism's goals. If morality is like health, it is not a brute fact of the universe like H₂O, but a fact about *us*. If it is a fact about us, then it is not fully objective in the way you claim. You must choose: is Good like H₂O (mind-independent) or like Health (mind-dependent but real)?"

  **Summary for your Colleague:**
  Tell him the semantic externalism works to defeat Moore's conceptual analysis, but it fails to defeat Hume's logical gap. He has shown that "Good" might refer to a natural property, but he has not shown that knowing a property is natural gives us a reason to pursue it. The water analogy works for **ontology**, but fails for **normativity**.
