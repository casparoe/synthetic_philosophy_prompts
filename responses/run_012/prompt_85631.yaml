      *   *Interpretation A (Trivial):* Arrangement matters. A pile of bricks vs. a house.
      *   *Interpretation B (Epistemic):* Hard to predict macro from micro.
      *   *Interpretation C (Explanatory):* Macro-level laws are more efficient than micro-level simulations.
