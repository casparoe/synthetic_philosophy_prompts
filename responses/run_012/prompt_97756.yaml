      *   *Correction:* Pull back. Focus on the *conditions* of the knowledge. Even if torture *did* work, did the TTB conditions exist? No.
      *   *Check:* Did I address the "Fog Case"?
      *   *Correction:* Ensure that term is used to define the reality of the CIA programme.
      *   *Check:* Is the conclusion clear?
      *   *Correction:* Make sure the final paragraph explicitly answers "keep or bin."

  10. **Final Polish:** Check flow and argument strength. (The argument that the TTB is a "category error" when applied to state policy is strong. I will lean into that.)

  *(Self-Correction Note on "Take a Side"):* I need to make sure I don't just say "both have points." I must argue that the institutional critique is the *correct* one for political ethics.

  *(Self-Correction Note on "British English"):* Watch out for Americanisms. "Program" -> "Programme". "Defense" -> "Defence". "Center" -> "Centre".

