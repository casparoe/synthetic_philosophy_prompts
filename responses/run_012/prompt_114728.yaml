answer: |-
  ### Preamble: Tidying the Cases
  Your flatmate is right that these are siblings, but wrong that they are identical. Your intuition that they might come apart is standard in the literature. I need to make one small correction to your **XOR Blackmail** case for the logic to hold water: in the standard formulation, the blackmailer sends the letter *only if* they predict you **will pay**. (If they predicted you'd refuse, they wouldn't bother blackmailing you; they'd just let the bombs go off or move on). If they only send it to those who *refuse*, paying saves you, but the setup becomes a paradox under infallible prediction. I will use the standard version (Letter = Predicted Pay) for the tree, as it preserves the tension you're feeling without breaking the math.

  **How to use this:**
  Answer the questions in order. Follow the arrows. At each node, I have flagged where theories merge or diverge. The "Leaves" are the positions. The "Ugly Commitment" is the bullet you have to bite if you end up there.

  ***

  ### The Decision Tree

  **Q1. The Causal Fork**
  When you hand over the £100 in the *Counterfactual Mugging* (Tails branch), do you believe your action can influence whether the money existed in the *Heads* branch, even though the coin has already landed and Omega has already left/won?
  *   **No:** The past is fixed. My choice only affects the present physical state. → **Go to Q2**
  *   **Yes:** My choice is a logical output that matches the prediction; if I pay, I am the type of agent for whom the money was made available. → **Go to Q4**

  **Q2. The Evidential Fork**
  In the *XOR Blackmail* case, you have received the letter. Does paying provide *evidence* that you are the sort of person who gets blackmailed (and thus should have refused to avoid the letter), or is it neutral/bad news?
  *(Note: CDT and EDT meet here. Both agree the past prediction is fixed, but EDT cares about what paying says about your type.)*
  *   **Paying is Bad News:** If I pay, it confirms I'm the type who gets targeted. I should refuse to signal I'm not a target (even if I already got the letter). → **Go to Q3**
  *   **Paying is Good/Neutral News:** The correlation doesn't outweigh the survival benefit. → **Go to Q5**

  **Q3. The Pre-commitment Fork**
  You are now at a position where you refuse to pay the Mugging (Q1-No) and refuse the Blackmail (Q2-Bad News). Do you wish you could have bound yourself to pay *before* the coin flip/letter, or do you think you made the right choice all along?
  *(Note: This separates "Sophisticated Causal" agents from hardline CDT.)*
  *   **I made the right choice:** Rationality is about maximizing utility *now*, given the world *as it is*. Regret is irrelevant. → **Leaf A**
  *   **I wish I could have bound myself:** I am rational, but my decision theory leaves money on the table. I need a mechanism to restrict my future self. → **Leaf B**

  **Q4. The Updatelessness Fork**
  You accept that your choice logically links to the prediction (Q1-Yes). When calculating whether to pay, do you use the probability you had *before* the coin flip (50% Heads/Tails) or the probability you have *now* (100% Tails)?
  *(Note: This is the main split between TDT and UDT.)*
  *   **Current Probability (100% Tails):** I know I'm in the losing branch. Why pay? The link to the other branch is weak once I know where I am. → **Leaf C**
  *   **Prior Probability (50% Tails):** I must act as if I'm behind the veil of ignorance. I pay because the policy "Always Pay" wins ex-ante. → **Go to Q6**

  **Q5. The Reliability Fork**
  (Oriented toward those who might Pay Mugging but refuse Blackmail, or vice versa). If Omega (or the Blackmailer) is only **90% reliable** rather than 100%, does your answer change?
  *(Note: EDT is threatened here; UDT is robust.)*
  *   **Yes:** If the correlation drops below a certain threshold, the evidential value vanishes. I stop paying. → **Leaf D**
  *   **No:** As long as the expected utility is positive, the exact reliability just scales the value. I still pay. → **Leaf E**

  **Q6. The Symmetry Fork**
  You are an Updateless agent (Q4-Prior). Do *Counterfactual Mugging* and *XOR Blackmail* demand the **same** answer, or does the fact that Blackmail involves a threat (loss) rather than a gift (gain) change the logic?
  *(Note: UDT says Same. Some TDT variants worry about "spurious" correlations in threat cases.)*
  *   **They are different:** Threats coerce; offers incentivize. I might pay the Mugging but resist the Blackmail to avoid encouraging extortion. → **Leaf F**
  *   **They are identical:** Both are instances of the same logical dependency. I treat them the same. → **Leaf G**

  **Q7. The Copies Fork**
  (For those who answered "Same" in Q6). Does your decision depend on whether there is literally another copy of you in the other branch, or just a simulation/prediction?
  *(Note: This is where TDT and UDT finally part ways if they haven't already.)*
  *   **Depends on Copies:** I need a physical or computational substrate linking me to the other branch. → **Leaf H**
  *   **Depends on Logic:** Even without copies, if the output is logically determined by the same function, I pay. → **Leaf G**

  ***

  ### The Leaves (Your Positions)

  **Leaf A: Causal Decision Theory (CDT)**
  *   **Path:** Q1(No) → Q2(Bad News) → Q3(Right Choice)
  *   **View:** You refuse both. The prediction is in the past; paying changes nothing physical.
  *   **The Ugly Commitment:** "I knowingly accept less money than a friend who is less rational than me, because their irrationality allowed them to pre-commit."

  **Leaf B: Regretful Causalism (Sophisticated CDT)**
  *   **Path:** Q1(No) → Q2(Bad News) → Q3(Wish Bound)
  *   **View:** You refuse both, but you acknowledge a defect in your agency. You would pay for a "pre-commitment device" if offered one beforehand.
  *   **The Ugly Commitment:** "My decision theory tells me to act in a way that I know I will later wish I hadn't, and I call that rational."

  **Leaf C: Timeless Decision Theory (TDT) - Updateful Variant**
  *   **Path:** Q1(Yes) → Q4(Current Prob)
  *   **View:** You acknowledge the logical link but refuse to pay once you know you're in the Tails branch. You pay in Newcomb's Problem, but not here.
  *   **The Ugly Commitment:** "I accept that my decision procedure is fixed, but I still update on my location in the world, effectively severing the link I claimed mattered."

  **Leaf D: Evidential Decision Theory (EDT)**
  *   **Path:** Q1(No) → Q2(Good News) → Q5(Yes/Reliability Matters)
  *   **View:** You likely Pay Mugging (good evidence) but Refuse Blackmail (bad evidence). Your choice depends heavily on the exact probability stats.
  *   **The Ugly Commitment:** "I will pay a blackmailer simply because paying makes me feel like the kind of person who wouldn't have been blackmailed, even if it doesn't stop the bombs."

  **Leaf E: Updateless Decision Theory (UDT)**
  *   **Path:** Q1(Yes) → Q4(Prior Prob) → Q5(No) → Q6(Same) → Q7(Logic)
  *   **View:** You Pay both. You maximize expected utility from the perspective of *before* you knew which branch you were in.
  *   **The Ugly Commitment:** "I will sacrifice my actual, current interests in this specific branch of reality to satisfy a calculation made about a branch I know I am not in."

  **Leaf F: Functional Decision Theory (FDT) - Threat-Sensitive**
  *   **Path:** Q1(Yes) → Q4(Prior Prob) → Q6(Different)
  *   **View:** You Pay Mugging (reward for disposition) but Refuse Blackmail (punish extortion). You distinguish between "acausal trade" and "acausal coercion."
  *   **The Ugly Commitment:** "I treat two logically isomorphic problems differently because one feels like a gift and the other feels like a threat."

  **Leaf G: Updateless Decision Theory (UDT) - Pure**
  *   **Path:** Q1(Yes) → Q4(Prior Prob) → Q5(No) → Q6(Same) → Q7(Logic)
  *   **View:** Identical to Leaf E. (Note: In this specific set of cases, UDT and FDT often converge. They diverge on "Parfit's Hitchhiker" variants).
  *   **The Ugly Commitment:** (See Leaf E).

  **Leaf H: Timeless Decision Theory (TDT) - Copy Dependent**
  *   **Path:** Q1(Yes) → Q4(Prior Prob) → Q6(Same) → Q7(Copies)
  *   **View:** You Pay only if there is a physical/computational link (like a simulation) between you and Omega. If Omega is just a "predictor" without running your code, you might refuse.
  *   **The Ugly Commitment:** "My rationality depends on the hardware Omega is using, not just the logical structure of the problem."

  ***

  ### Joins and Empty Cells (The "Straight Talk")

  1.  **The CDT/EDT Join (Q1-No):** Both CDT and EDT agree that your action cannot *causally* influence the past prediction. They diverge at Q2 on whether *correlation* matters. If you answered "No" to Q1 but "Good News" to Q2, you are EDT. If "Bad News", you are CDT.
  2.  **The Empty Cell (Pay Blackmail / Refuse Mugging):** There is no standard theory that Pays XOR Blackmail but Refuses Counterfactual Mugging. Both rely on the same logical dependency. If you find yourself here, you likely haven't fully internalized the symmetry of the prediction mechanism.
  3.  **The TDT/UDT Merge:** In these specific two cases, TDT and UDT often give the same answer (Pay Both). They only reliably separate when there are **two copies of you** active simultaneously (e.g., "Agent Simulates Predictor") or when the prediction is based on your source code vs. your behavior. I included Q7 to catch this, but if you didn't feel the distinction, TDT and UDT are effectively the same position for you right now.
  4.  **Reliability (Q5):** This is the fork that threatens **EDT** most. CDT doesn't care (refuses anyway). UDT doesn't care (ex-ante utility still holds). EDT relies on conditional probability $P(Reward|Pay)$. If Omega is 90% reliable, that probability drops. If it drops below the cost/benefit ratio, EDT flips from Pay to Refuse. UDT stays stable.

  ### Final Note for the Argument
  Your flatmate says paying is "paying for a fiction."
  *   If you ended at **Leaf E/G (UDT)**, your comeback is: "I'm not paying for the fiction; I'm paying to be the *kind of agent* for whom the fiction wasn't necessary."
  *   If you ended at **Leaf A (CDT)**, your comeback is: "You're right. I'd rather be rational and poor than irrational and rich."
  *   If you ended at **Leaf D (EDT)**, your comeback is: "It's not fiction; it's evidence. And I manage evidence."

  Pick your leaf. Defend the commitment.
