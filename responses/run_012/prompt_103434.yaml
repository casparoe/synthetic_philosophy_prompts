answer: |-
  **Project Title:** Exchangeability over Extension: Re-framing the Reference Class Problem in Direct Inference

  **Project Summary**
  The reference class problem arises when a single event belongs to multiple overlapping classes, each with different statistical frequencies, leaving the probability of the event underdetermined. Standard treatments frame this as a selection problem: identifying which class is objectively or epistemically privileged to ground the probability assignment. This project argues that this framing inverts the order of explanation. The probability assignment does not derive from the class; rather, the class is a retrospective description of a prior judgment regarding which cases are treatable as exchangeable. I propose distinguishing between the *descriptive reference class* (the set of cases sharing features) and the *normative reference class* (the set of cases an agent is licensed to pool for inference). By shifting the locus of the problem from class selection to the justification of exchangeability, this project aims to dissolve the apparent underdetermination inherent in direct inference.

  **Central Question**
  Does the reference class determine the admissibility of a probability assignment, or does the admissibility of a probability assignment determine the relevant reference class?

  Existing treatments assume the former: they seek a rule to select the correct class from the available descriptions. This leaves the problem open not merely because the rule is missing, but because the question is ill-posed. It assumes the class possesses the probabilistic force. My hypothesis is that the latter is true: the probabilistic force resides in a normative judgment of exchangeability, and the "class" is merely the extensional shadow of that judgment. A successful project will establish that reference class puzzles are not cases of worldly underdetermination but of unacknowledged variation in exchangeability licenses.

  **The Proposed Distinction**
  To test this hypothesis, I will develop a rigorous distinction between two concepts currently conflated under "reference class":

  1.  **Descriptive Reference Class:** The set of actual or possible cases that share a specified set of properties with the target case (e.g., "all coins tossed by this agent," "all defendants with this prior record"). This is an ontic or semantic relation.
  2.  **Normative Reference Class:** The set of cases the agent is licensed to treat as exchangeable for the purpose of a specific inference. This is a pragmatic or epistemic relation.

  Consider a coin toss. Descriptively, the toss belongs to the class of "tosses by this person," "tosses on Tuesdays," and "tosses resulting in heads." The standard problem asks which description fixes the chance. The proposed view asks: regarding which of these groupings am I licensed to ignore the differences for the sake of prediction? If I know the coin is biased but not the direction, I may be licensed to treat it as exchangeable with a broad class of biased coins, even if descriptively it belongs to a narrower class of "Tuesday tosses." The puzzle dissolves when we recognize that the narrow descriptive class does not automatically command a normative license.

  **Criteria for Success and Failure**
  The project will be successful if it demonstrates that appealing to the normative distinction resolves standard paradoxes (e.g., the conflict between narrowest class vs. most reliable statistics) without invoking new metaphysical commitments. Specifically, success requires showing that:
  1.  Two agents can agree on the descriptive classes but disagree on the probability assignment due to differing exchangeability licenses.
  2.  Resolving the disagreement requires negotiating the license, not refining the description.

  The project will fail (collapse back into the standard view) if the criteria for granting a "normative license" turn out to be identical to the criteria for "selecting the narrowest descriptive class." If the normative judgment is nothing more than a search for the most specific description, the distinction is merely verbal. To avoid this, I must articulate conditions for exchangeability that are not reducible to feature matching (e.g., invariance under permutation relative to a specific predictive goal).

  **Methodology and Work Plan**
  The work is conceptual but requires formal precision to ensure the distinction is not merely metaphorical. I will utilize the formal notion of exchangeability (invariance of joint distribution under permutation) to model the normative license, contrasting it with set-theoretic class membership.

  *   **Month 1: Conceptual Groundwork.**
      *   Refine the definitions of Descriptive and Normative classes.
      *   Map the standard paradoxes of direct inference onto this framework.
      *   *Deliverable:* Annotated conceptual map and problem taxonomy.
  *   **Month 2: Formal Modeling.**
      *   Formalize the "normative license" using exchangeability conditions.
      *   Demonstrate how different licenses yield different probabilities despite identical descriptive data.
      *   *Deliverable:* Formal lemmas connecting licensing conditions to probability bounds.
  *   **Month 3: Case Studies.**
      *   Apply the framework to three domains: physical chance (coin tosses), legal evidence (defendant guilt), and scientific prediction (single-event forecasting).
      *   Identify where standard views stall and the proposed view proceeds.
      *   *Deliverable:* Three detailed case study memos.
  *   **Month 4: Drafting the Argument.**
      *   Synthesize the conceptual and formal work into a coherent narrative.
      *   Address the "collapse" objection (why this isn't just narrowest-class selection).
      *   *Deliverable:* First full draft of the paper.
  *   **Month 5: Critique and Revision.**
      *   Stress-test the argument against counterexamples (e.g., cases where exchangeability seems to require the descriptive class).
      *   Refine the account of how normative licenses are justified (avoiding circularity).
      *   *Deliverable:* Revised draft.
  *   **Month 6: Finalization.**
      *   Polish for publication.
      *   Prepare a summary abstract for non-specialists.
      *   *Deliverable:* Final manuscript ready for submission.

  **Final Deliverable**
  A single, journal-ready article (8,000–10,000 words) titled "The Normative Reference Class: Exchangeability as the Ground of Direct Inference."

  **Risk Assessment**
  The primary risk is scope creep regarding the justification of the normative license. Explaining *why* an agent is licensed to treat cases as exchangeable could expand into a general theory of epistemic justification, which is too large for six months. To mitigate this, I will treat the license as a primitive input for the purposes of this project, focusing on its *consequences* for the reference class problem rather than its ultimate foundation.

  A second risk is speculative overreach. If the formal modeling of exchangeability proves too rigid to capture the nuance of "licensing," the distinction may remain purely verbal. I will mitigate this by remaining agnostic on the specific formalism (e.g., finite vs. infinite exchangeability) provided it captures the asymmetry between description and inference. If the formal work stalls, the deliverable will shift to a rigorous conceptual taxonomy rather than a formal proof, though the goal remains a substantive philosophical argument.
