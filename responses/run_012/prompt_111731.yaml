      *   Task 3: Apply the user's "robustness/causal mapping" constraint. Does it filter out the trivial one while keeping the scientific one?
      *   Task 4: Check if the constraint is just mechanism in disguise.
      *   *Why this method?* It moves beyond "what did Searle say" to "does this constraint actually work in practice?"

