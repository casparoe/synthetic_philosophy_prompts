answer: |-
  **Project Title:** Causal Constraints on Computational Explanation: Dissolving the "Brain as Computer" Equivocation

  **1. Research Question**
  The debate over whether "the brain is a computer" is currently stalled by equivocation. On a broad functional definition, the claim is trivially true (pancomputationalism); on a specific architectural definition (von Neumann machines), it is empirically false. The substantive claim lies in a third sense: that computational description provides an *autonomous explanatory level* distinct from low-level causal mechanism. However, this faces the triviality objection: if any physical system can be mapped to any function, computational explanation is vacuous.

  **Primary Question:** Can a principle of *causal-structural robustness* distinguish explanatory computational descriptions from trivial redescriptions in neural systems, without collapsing into standard mechanistic explanation?

  **Secondary Question:** If such a principle cannot be established, does the computational/physical distinction dissolve into a merely pragmatic choice of modeling vocabulary?

  **2. Background and Gap**
  Current positions in the literature fail to resolve the triviality worry:
  *   **The Trivialist Camp:** Argues that since the brain processes information, it is a computer. This fails because rocks "process information" under gerrymandered mappings. It renders the thesis uninteresting.
  *   **The Architectural Camp:** Argues the brain is not a computer because it lacks addressable memory or serial processing. This is a strawman; modern computationalism rarely claims the brain is a digital serial machine. It rejects a claim nobody is making.
  *   **The Instrumentalist Camp:** Argues "computation" is merely a stance or heuristic (a la Dennett). While this avoids metaphysical baggage, it risks making the debate purely verbal. If computationalism is only about "useful modeling," it cannot ground claims about cognitive ontology or the individuation of mental states.

  **The Gap:** There is no agreed-upon criterion for *implementation* that blocks trivial mappings while preserving the autonomy of computational explanation. My preliminary hypothesis is that a computational description is valid only if the computational structure is *recoverable* from the system's causal organization and remains robust under small perturbations. However, it is unknown whether this constraint is (a) sufficient to block triviality, (b) distinct from mechanistic explanation, or (c) actually employed in neuroscientific practice. This project moves the debate from metaphysical assertion to constraint testing.

  **3. Methodology**
  Six months part-time precludes a comprehensive survey of the philosophy of mind. Instead, I will employ a method of **Comparative Explanatory Audit**. I will not ask "What is computation?" in the abstract, but "Which computational descriptions of neural systems survive the robustness test?"

  **Phase 1: Formalizing the Constraint (Months 1–2)**
  I will rigorously define the "causal-structural robustness" constraint. A computational mapping $M$ from physical state $P$ to computational state $C$ is explanatory only if:
  1.  **Structural Isomorphism:** Parts of $P$ map to parts of $C$ (not just global input/output).
  2.  **Counterfactual Robustness:** Small perturbations in $P$ result in predictable, corresponding changes in $C$, whereas trivial mappings break down under perturbation.
  I will test this definition against standard triviality arguments (e.g., Putnam, Searle) to ensure it theoretically blocks pancomputationalism.

  **Phase 2: Case Study Analysis (Months 3–4)**
  I will select two paradigmatic cases from computational neuroscience where researchers claim to have identified a specific computation (e.g., edge detection in V1, or path integration in grid cells).
  *   **Step A:** Construct the "scientific" computational model used by neuroscientists.
  *   **Step B:** Construct a "trivial" alternative mapping that fits the input/output data but ignores the internal causal structure.
  *   **Step C:** Apply the robustness constraint. Does the constraint successfully filter out Step B while retaining Step A?
  *   **Step D:** Compare the surviving computational description against a purely mechanistic/causal description. Is there explanatory residue left over, or does the computational description turn out to be a gloss on the mechanism?

  **Phase 3: Synthesis and Verdict (Months 5–6)**
  I will evaluate the results of the audit.
  *   If the constraint works and preserves autonomy: Computationalism is vindicated as a distinct explanatory mode.
  *   If the constraint works but collapses into mechanism: Computationalism is a heuristic shorthand for mechanism (The "Verbal Dispute" Verdict).
  *   If the constraint fails to block triviality: Computationalism requires a stronger metaphysical foundation (e.g., semantics) or should be abandoned.

  **Why this approach?** Simply working through the philosophical literature on implementation will reproduce existing stalemates. By testing the constraint against concrete neural models, I move from asking what "computation" *could* mean to what it *does* in successful scientific practice. This grounds the metaphysics in the methodology.

  **4. Success and Failure Conditions**
  **Positive Result:** I produce a principled criterion that successfully distinguishes explanatory computational models from trivial redescriptions in the case studies, and I can demonstrate that this criterion is not merely a restatement of mechanistic explanation. This would salvage computationalism as a substantive ontological claim.

  **Negative Result (Productive):** I demonstrate that the "causal-structural robustness" constraint either fails to block trivial mappings or is identical to mechanistic explanation. This would support the "Verbal Dispute" verdict: the debate is not about the world, but about whether we prefer computational or causal vocabulary. This is a successful outcome because it dissolves a confused metaphysical problem.

  **Failure (Project Stalls):** I am unable to formalize the robustness constraint precisely enough to apply it to the case studies, or the case studies prove too technically dense to analyze within the timeframe.

  **5. Scope and Feasibility**
  **Is six months part-time realistic?**
  Yes, but only with strict scoping.
  *   **Cut:** I will not address the "hard problem" of consciousness, intentionality, or semantics. The project is strictly about *explanatory individuation* and *triviality*.
  *   **Cut:** I will not engage deeply with analog vs. digital debates (Camp 2). I will assume a broad definition of computation and focus solely on the implementation constraint.
  *   **Cut:** I will not interview neuroscientists or build new models. I will analyze existing, textbook-level computational models.

  **Risk:** The biggest risk is that the "mechanistic alternative" is too complex to summarize quickly.
  **Mitigation:** I will limit the mechanistic comparison to the "new mechanist" framework (activities and entities) which is philosophically well-defined. If the technical details of the neural models threaten to overwhelm the philosophical analysis, I will simplify the models to their logical topology rather than their biophysical detail.

  **Verdict on the "Verbal Dispute" Hypothesis:**
  If the project concludes that the computational level is not autonomous from the mechanistic level, the honest verdict is indeed that the debate is verbal. However, establishing *that* requires the work proposed here. It is better to prove the dispute is verbal than to assume it. This proposal is designed to reach that verdict definitively if it is the correct one.
