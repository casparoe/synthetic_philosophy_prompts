      *   **Tone:** Philosophical, rigorous, practical, avoiding fluff.

  2.  **Deconstruct the Core Philosophical Problem:**
      *   *The Equivocation:* The user is right. Putnam's triviality result looms large. The "architecture" view is empirically false (brains aren't von Neumann machines). The "stance" view (Dennett-ish) risks making the claim too weak to matter.
      *   *The Proposed Constraint:* "Recoverable from causal organization" + "robustness." This sounds like a blend of *mechanistic explanation* (Craver) and *counterfactual robustness* (Woodward). The risk is that this just *is* mechanistic explanation, rendering "computation" redundant.
      *   *The Real Question:* Is computational explanation a *sui generis* explanatory mode, or is it just a shorthand for mechanistic causal explanation? If the latter, "the brain is a computer" is a heuristic, not an ontology.

  3.  **Drafting the Proposal Sections:**

      *   **Title:** Needs to be punchy but accurate. "Beyond Equivocation," "Causal Constraints," etc.
      *   **Research Question:** Needs to be determinate. Not "Is the brain a computer?" (too vague). Better: "Under what causal constraints does computational explanation of neural systems avoid triviality?" or "Is computationalism an ontological claim or a methodological heuristic?" Let's aim for the condition of non-triviality.
      *   **Background/Gap:** Address the three camps.
          *   Camp 1 (Trivial): Pancomputationalism. Reject as uninformative.
          *   Camp 2 (Architectural): Empirical falsity. Reject as strawman.
          *   Camp 3 (Stance/Instrumentalism): Risks making the debate merely verbal.
          *   *The Gap:* We need a criterion that distinguishes *explanatory* computation from *trivial* computation without collapsing into pure mechanism or retreating to instrumentalism.
      *   **Methodology:** This is crucial. The user asked *what would I actually do*. Reading philosophy isn't enough. They need to test the constraint.
          *   *Idea:* Case studies. Take specific neural models (e.g., CPGs, attractor networks) and apply the "causal recovery/robustness" test. Does the computational description hold up under perturbation analysis better than a trivial mapping?
          *   *Alternative:* Conceptual analysis of "implementation."
          *   *Decision:* Since it's a philosophy fellowship, the method should be conceptual but *tested* against scientific practice. "Philosophical engineering." Analyze how neuroscientists actually individuate computations.
      *   **Outcomes:**
          *   *Success:* A principled criterion (e.g., "Causal-Structural Isomorphism") that saves computationalism from triviality but distinguishes it from mechanism.
          *   *Failure:* The criterion collapses into mechanism (computation is just a gloss on causality) or remains too vague to block triviality.
      *   **Scope/Feasibility:** 6 months part-time is ~300-400 hours. That's tight for a full metaphysical overhaul. Need to narrow. Focus *only* on the triviality objection and the causal constraint. Don't try to solve consciousness or intentionality.

  4.  **Refining the "Method" (The Hardest Part):**
      *   Pure armchair philosophy might be too thin. Pure science is out of scope.
      *   *Hybrid:* "Explanatory Audit." Select 2-3 paradigmatic cases where neuroscientists claim to have found a computation (e.g., edge detection in V1, path integration in grid cells).
      *   Task 1: Formalize the "trivial mapping" for that system.
