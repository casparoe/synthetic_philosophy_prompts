answer: |-
  # The Unsplit Cell

  The portrait lay face down on the laminate table, a sheet of matte polymer thick enough to feel like a threat. I could see the faint outline of a face through the backing, a shadow of myself, but I didn't turn it over. Not yet. Across from me, Soren was staring at the wall, her jaw set in the way that meant she was counting backwards from a hundred to keep from screaming.

  Dr. Aris, the Cadence resident theorist, sat between us. He looked tired, the way people do who spend their days explaining why ghosts aren't real while selling tickets to the haunting.

  "The statistical weighting is unusual, but not unprecedented," Aris said, his hands folded over the contract. "For monozygotic pairs, the divergence point is usually the zygotic split. Cadence models the gametic selection primarily. In your case, the genomic compatibility suggests that for eighty-four percent of the viable conception space, the zygote remains singular. The twinning event is the outlier."

  "So this," I said, tapping the back of the print, "is the norm."

  "It is the dominant probability," Aris corrected. "It is you, constructed from the same genetic material, aged to your current chronological coordinate, in a timeline where the cell divided once instead of twice."

  "And me?" Soren asked. She still hadn't looked at the table. "Where am I in that space?"

  "You do not exist in that coordinate," Aris said softly. "Neither of you does. Not as distinct entities. There is only the singleton."

  Soren stood up abruptly, her chair scraping against the floor. "I'm not looking at that. It's not her. It's a monster."

  "It's me," I said. I felt a strange pull in my chest, a gravity well opening up beneath the table. "Same DNA. Same parents. Same night. Just... alone."

  "It's not you," Soren snapped, turning to me. Her eyes were wet, angry. "Because if that's you, then what am I? A mistake? A glitch in the cell wall?"

  "The contract specifies," Aris interjected, his voice steady, "that the portrait is not a person and not a promise. It is a visualization of genetic potentiality."

  "Stop reading the disclaimer," Soren said. "Tell her why it's metaphysical nonsense. Tell her she can't exist without me."

  I finally turned the portrait over.

  The woman looking back at me was undeniably me. The slope of the nose, the slight asymmetry of the eyes, the scar on the chin from when we were seven and I fell off the swing (did she fall off the swing in her world? Or did she never go to the park because there was no one to push her?). She was wearing a shirt I owned. She was standing in a light I knew. But there was a hollowed-out quality to the image. The space around her was empty. No shadow of a sister falling across her shoulder. No second reflex in the posture. She looked complete, and that was the horror.

  "It feels real," I whispered.

  "Because you're projecting," Soren said. She was pacing now, near the window where the city hummed, futuristic and indifferent. "You want to be singular. We all do. But you can't buy singularity with gamete mapping."

  "Why not?" I asked. "If origin is essential to who I am, then this portrait shows my origin. The sperm, the egg, the night. That's the essence. The split was just... accident. Noise."

  Aris leaned forward. "This is the crux, isn't it? The Kripkean objection. Ms. Soren is arguing that if origin is essential, you share an origin. Therefore, you share an identity. But you are distinct. Therefore, origin cannot be the sole individuator."

  "Exactly," Soren said. "If my origin makes me *me*, and your origin makes *you* you, and our origin is the same zygote... then who is born in this picture?" She pointed a shaking finger at the portrait. "If the zygote didn't split, *which* one of us wakes up? Neither. Because 'Elara' and 'Soren' are defined by the division. This thing..." She gestured at the print. "This is a vessel without a tenant."

  I looked at Aris. "Is she right?"

  Aris sighed, rubbing his temples. He didn't look like a salesman anymore. He looked like a man who had lost an argument many times and still believed he was right. "She is logically consistent," he admitted. "If personhood is individuated by the historical path of consciousness, then the singleton is neither of you. But Cadence does not sell personhood. We sell genetic continuity. The thesis of origin essentialism states that you could not have come from different parents. It does not state that you could not have come from the same parents without a sibling. The split is a biological event, not a metaphysical prerequisite for your existence."

  "It's a prerequisite for *my* existence," Soren said. "I am not a generic human female with this genome. I am the second half of a split. Take that away, and you don't have me. You have a prototype."

  "But I'm not you," I said. "I'm me. Could I not have been me without her?"

  Soren stopped pacing. She looked at me, and for a moment, the anger drained out, leaving something raw. "Could you have been born without me? Maybe. But you wouldn't be the person sitting here. You wouldn't know what it feels like to be mirrored. You wouldn't have the language we share. If origin includes the causal history of the person, then your history includes me. You can't edit me out of your origin any more than you can edit out the sperm that won the race."

  "That's the confusion," Aris said, seizing the opening. "You are conflating necessary conditions with sufficient ones. Your sister is a necessary condition for your *current* identity, your psychological continuity. But she is not a necessary condition for your *ontological* existence. This portrait shows the ontological substrate. The you that exists prior to the relationship."

  "That's not a person," Soren said. "That's meat."

  "It's enough for a portrait," I said. My voice sounded small. I traced the edge of the polymer. The woman in the picture looked calm. She looked unburdened. She didn't have to worry about being the loud one or the quiet one, the healthy one or the sick one. She was just one thing.

  I felt a surge of guilt so sharp it made me nauseous. I wanted that simplicity. I wanted to be the singleton.

  "Elara," Soren said. "Don't."

  "It's just a picture," I said, echoing the contract. "Not a person. Not a promise."

  "It's a lie," Soren said. "It tells you that you could have been whole without me. And that's false. You aren't whole. You're half. We both are. That's why we fit."

  I looked from the portrait to my sister. They looked alike, obviously. But the woman in the portrait looked *finished*. Soren looked alive.

  "What do I do with it?" I asked Aris. "If I take it home... if I hang it..."

  "That is up to the client," Aris said. "Some frame them. Some burn them. Some keep them in the dark."

  "If I hang it," I said, thinking aloud, "I'm saying this is possible. I'm saying this version of me has a claim on the wall next to our childhood photos."

  "It does have a claim," Aris said. "It is the most statistically probable version of your genetic line."

  "It's a ghost," Soren said. "It's the ghost of the child Mom thought she was having until she found out there were two heartbeats. Do you want to put that in the living room? Do you want to show Mom the child she lost even though we're both sitting right here?"

  The question landed heavily. I thought of our mother. She often looked at us with a kind of bewildered gratitude, as if she'd won a lottery she didn't understand. If she saw this portrait, would she see the daughter she was supposed to have? Would she look at us and see the error?

  I looked at the singleton again. She was beautiful, in a sterile way. But she was static. She was a definition, not a story.

  "I can't hang it," I said.

  Soren exhaled, a long, shuddering breath. She sat back down.

  "But I'm not destroying it," I added.

  Aris nodded, making a note on his tablet. "Standard procedure. We can store it in the vault. Or you can take it."

  "I'll take it," I said. I slid the portrait back into its protective sleeve. It was heavy, dense with data and implication. "But I'm not showing Mom."

  "Elara," Soren started.

  "No," I said. "She doesn't need to see the math. She has us. That's the only reality that matters." I stood up, clutching the sleeve against my chest. "But I'm keeping it. Not because it's me. But because it's the question."

  "What question?" Aris asked.

  "Whether I'm defined by where I came from, or where I ended up," I said. "If origin is essential, then this woman is me, and I'm a twin by accident. If origin isn't essential, then this woman is a stranger, and I'm a twin by design. I need to keep it to remember that I don't know the answer."

  Soren stood up and came to me. She didn't hug me—that's too much for a lobby, too much for the tension still humming between us—but she touched my arm. Her hand was warm. The woman in the portrait was alone, and her skin looked cool, rendered in high-resolution ink.

  "Come on," Soren said. "Let's go home."

  We walked out into the afternoon light. The city was loud, chaotic, full of people who were all singletons, or twins, or triplets, all walking around in bodies that felt like necessary conditions and accidents all at once. I held the portrait under my arm, a flat, silent weight. I wouldn't frame it. I wouldn't show it. But I wouldn't throw it away. I would put it in the drawer where I keep the passports we don't use and the letters we didn't send.

  It was a map of a country I never visited. It was proof that I could have been one thing, and instead, I became two. Or maybe it was proof that I was always one, and the second was the miracle.

  As we waited for the tram, Soren leaned against the railing. "You know," she said, not looking at me. "If you hadn't split... you'd probably be boring."

  I smiled, just a little. "Probably."

  "But you'd be alive," she said.

  "So am I," I said.

  "For now," she said.

  The tram arrived. We stepped on together, side by side, taking up the space of two. I held the portrait tight, feeling the edge dig into my palm, a sharp reminder of the line between the life I had and the life I could have claimed. The door slid shut. We were moving. The singleton stayed still.
