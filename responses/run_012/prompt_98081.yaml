answer: |-
  **The Toast**

  Good evening. For those who don't know me, I had the privilege of working for [Boss's Name] for [Number] years. And for those who *do* know me, you're probably wondering why I'm holding a microphone, given that the woman of honor has spent three decades telling us that holding a microphone usually means someone is about to oversimplify a complex problem.

  We all know her favorite rule. She's said it in briefing rooms, she's said it in budget meetings, and I'm told she's said it over pot roast more than once: "An analogy is just a memory that's been promoted to a law." She taught us that when someone stands up and says, "This is just like Munich," or "We're walking into Vietnam," or "It's a Thucydides Trap," what they are really saying is, "I have already paid for this lesson, and I'm going to make you pay for it too."

  She taught us that analogies usually do two things. They act as a prophecy, telling us the future is fixed. Or they act as an excuse, telling us our hands are tied by the past. She trusted neither.

  So, standing here to honor her, I face a tactical dilemma. If I avoid analogies entirely, I ignore the tool she used every single day. If I use one poorly, I insult her intellect. So, I have decided to do the third thing she taught us. I am going to use an analogy not to predict her future, and not to excuse my speechwriting, but to hold it up like an X-ray. We're going to look through it to see something specific, and then, when we're done, we are going to put it away.

  The analogy I've chosen is Cincinnatus.

  For the family members here: Cincinnatus was a Roman farmer who, twenty-five hundred years ago, was called away from his plow to lead the army and save the Republic. He won. He had absolute power. And then, immediately, he gave it up and went back to his farm.

  For the colleagues here: You know the type. The reluctant warrior. The steward of power who understands that the office is temporary, but the duty is permanent.

  On the surface, the fit is perfect. Thirty years of service. High-stakes campaigns. A reputation built on saving the organization from its own worst instincts. And now, the voluntary return to private life. If we stop there, Cincinnatus gives us a beautiful picture of [Boss's Name]. It highlights her humility. It highlights her sense of duty. It tells us she served the mission, not the title.

  That is the X-ray. That is what the resemblance lets us see.

  But now, we have to do what she taught us. We have to check where the image blurs. Because if we leave the analogy up, it starts to lie.

  Cincinnatus left a Republic that was safe. [Boss's Name] is leaving a world that is, by her own admission, profoundly unsettled. Cincinnatus was called to stop an invasion. [Boss's Name] spent thirty years teaching us that the real invasion is certainty—the certainty that we know how the world works, the certainty that the map matches the terrain.

  Cincinnatus put down his sword. [Boss's Name] is handing us a compass.

  Do you see the fracture? The Roman general's story is about the end of a conflict. Her story is about the continuity of inquiry. If we treat her retirement like a Triumph, we imply the work is finished. If we treat her like a myth, we imply her lessons are static. But she didn't build a monument; she built a method. She didn't want us to remember *her*; she wanted us to remember *how to think*.

  So, I am taking the analogy down. Cincinnatus stays in Rome. We are here, in this room.

  Because when I strip away the Roman general, what is left is actually more impressive. What is left is a woman who sat in rooms full of very confident people—people much like me—and gently, firmly, asked the one question nobody else wanted to ask: "What if we're wrong?"

  She didn't just serve the organization; she protected it from its own memory. She knew that the "lessons of history" are often just ghosts haunting the briefing book. Her legacy isn't the decisions she made; it's the decisions she stopped us from making because we were too in love with a story that didn't fit.

  To her family: Thank you for sharing her with us, even when she was mentally drafting memos at the dinner table. We know now that when she pushed back on a story at Thanksgiving, she wasn't being difficult. She was practicing. She was keeping her mind sharp so that when the stakes were real, she wouldn't mistake a memory for a law.

  And to [Boss's Name]: You taught us that the best analogy is the one you discard before it becomes a cage. So I won't call you a legend. I won't call you a titan. Those are traps. Those are memories promoted to laws.

  I will just call you our boss. And I will say that we are better, sharper, and more honest strategists because you refused to let us take the easy path of comparison.

  Please raise your glasses. To the work that continues, to the questions that remain, and to you.

  ***

  **Strategic Note**

  **Vulnerability in the Reading**
  The speech relies on a specific interpretation of her "X-ray" method: that the ultimate value of the analogy lies in its *discarding*. A colleague might dispute this, arguing that her method wasn't about discarding the analogy, but about *mining* it until it yielded a specific, actionable variable, then keeping that variable while dropping the narrative. By framing the speech around "taking the analogy down," I risk implying her historical references were merely provisional scaffolding. A hardline colleague might argue she believed some historical patterns *were* structural (e.g., logistics, human nature) and shouldn't be fully discarded, only carefully bounded. If I over-emphasize the "discard," I might inadvertently suggest her skepticism extended to historical *patterns* themselves, rather than just historical *narratives*.

  **Audience Risk Assessment**
  I have assessed the primary risk as lying with the **colleagues**, not the family.
  *   **Why:** The family is already accustomed to her dinner-table aphorisms ("memory promoted to a law"). They don't need the history to be perfect; they need the sentiment to be clear. The Cincinnatus reference is explained simply enough for them to follow the emotional beat (leader who goes home).
  *   **The Real Danger:** The colleagues are the ones grading the history. If the Cincinnatus parallel feels forced, or if the "discard" feels like a rhetorical trick rather than a genuine methodological demonstration, they will check out. They know how hard it is to actually *use* an analogy without being used *by* it. If the speech feels like it's performing her method rather than embodying it, the toast becomes ironic in the wrong way—it becomes an "excuse" (a speech to check the box) rather than an "X-ray."

  **What Would Change the Pitch**
  If I discovered that the room was actually 70% family/30% colleagues, I would simplify the Cincinnatus reference further, perhaps swapping it for a more universal metaphor like "The Architect who leaves the blueprints." However, if I discovered that **she** was particularly sensitive about the "discard" phase—i.e., if she felt her colleagues *too often* discarded the history entirely rather than learning from it—I would pivot the speech. Instead of ending on "taking the analogy down," I would end on "keeping the insight." The speech would shift from "She wasn't Cincinnatus" to "She was Cincinnatus, but only in the way that matters: the choice to leave." That shifts the risk from intellectual posturing to emotional resonance, which is safer if the colleagues are feeling defensive about their own reliance on historical precedent.
