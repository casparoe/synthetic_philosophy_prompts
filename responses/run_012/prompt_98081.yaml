      *   *Analogy:* She is like the old cartographers who filled in the blank spots on the map.
      *   *The X-ray Move:* We hold up the "Mapmaker" analogy. It shows us she provided direction. But then we discard it. Why? Because maps are static. She taught us that the terrain changes. She didn't just draw the map; she taught us how to read the compass when the map is wrong.
      *   *Refining the Analogy:* Let's use **Cincinnatus** but keep it grounded. It's specific enough for the historians to nod at, simple enough for family (soldier who went home to plow).
