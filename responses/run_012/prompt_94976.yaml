answer: |-
  **The Friends of the Elm**

  The first meeting was held in the back room of the library, which smelled of dust and old paper. There were twelve of them. They sat around a table pushed together from two smaller ones, drinking coffee from mugs they had brought from home. The agenda was typed on a single sheet of paper: *1. Introductions. 2. The Proposed Widening. 3. Next Steps.*

  The proposed widening involved Main Street. The plan, drafted by the county engineers, showed the road expanding from two lanes to four. To do this, the century-old Elm on the corner of Main and Fourth would have to be removed.

  "It's just a tree," said Mr. Henderson, who was seventy and had lived here for sixty. "But it's the town."

  "It's not just a tree," said Arthur. Arthur was thirty-five, an accountant, and he had brought the donuts. He sat at the head of the table, not by election, but because he had the pen and the notepad. "It's a symbol. If we lose this, we lose the character of the district. Then it's just a thoroughfare."

  They all agreed. It was a good sentiment. It felt good to say it together. Elena, who worked at the university and had a background in botany, raised her hand slightly. She asked if the engineers had published the traffic studies. She wondered if the widening was actually necessary for safety.

  Arthur smiled. "That's a good question, Elena. We can put that on the list for next time. For now, let's focus on the petition. We need to show them we care."

  They spent the hour signing names and drinking coffee. When they left, they felt lighter, as if they had already accomplished something. The air outside was crisp. They walked to their cars feeling that they were part of something solid.

  The second meeting had twenty people. The library room was full. Arthur had prepared a flyer. It featured a black-and-white photo of the Elm in winter, stark against the sky. The text read: *SAVE OUR HERITAGE.* It did not mention traffic statistics.

  Elena arrived with a folder. She waited until the coffee was poured. "I looked into the traffic study," she said. "The accident rate at that intersection is below the county average. The widening is mostly for flow. For commuters passing through."

  There was a silence. Mrs. Gable, who baked the cookies, frowned slightly. "But the trucks," she said. "The noise."

  "The noise will increase," Elena admitted. "But the tree... I spoke to an arborist. Unofficially. He said the Elm has a fungal infection. It might not have more than five years left regardless of the road."

  The room grew quiet. The warmth that had filled the space during the petition signing seemed to leak out, replaced by a drafty uncertainty. If the tree was dying anyway, the enemy was not the road, but time. And you cannot protest time. You cannot hold a rally against decay.

  Arthur cleared his throat. He didn't look at Elena. He looked at the group. "That's one opinion," he said gently. "And it's speculative. The county arborist hasn't declared it unsafe. If we start saying the tree is sick, we're doing their work for them. We're giving them an excuse."

  "I'm just saying we should know what we're fighting for," Elena said. "If we're fighting for safety, that's one thing. If we're fighting for sentiment, that's another."

  "We're fighting for the town," Arthur said. He kept his voice level, devoid of accusation. He was managing the mood, like a conductor noticing a section of the orchestra playing out of tune. "If we confuse the message, people won't sign. We need to be unified. We can discuss the biology later, once we've secured the political will."

  Mrs. Gable nodded. "Unity is important."

  Elena closed her folder. She didn't argue. She just sat back. Arthur moved on to the next item: the design of the banners. The warmth returned to the room. The uncertainty was smoothed over. They decided on green lettering. It looked better against the white background.

  By the fourth meeting, there were forty people. They had moved to the church hall. The agenda was no longer typed; it was projected on a screen. Arthur had taken on the role of coordinator. He spoke for the group. When reporters called, they asked for Arthur.

  Elena sat in the third row. She rarely spoke now. When she did, her points were treated as details to be managed, not directions to be taken. At one point, she mentioned that the county had offered to relocate the tree.

  Arthur shook his head slowly, with a look of regretful wisdom. "You can't relocate a hundred-year-old Elm, Elena. Everyone knows that. It would die in transit. We can't propose a solution that fails."

  "But they have the technology now," she said. "It's been done in Boston."

  "Not here," Arthur said. "We have to deal with the reality on the ground. We can't get into a technical debate. We'll lose. We need to keep it emotional. People protect what they love, not what they calculate."

  He wasn't angry. He was protecting the group from the exhaustion of nuance. The group sensed this. They leaned toward him. They felt safer when the choices were simple. *Us and the Tree. Them and the Road.*

  A new dynamic emerged. When someone new came to the meeting, they were welcomed warmly, but they were quickly briefed on the narrative. *The Tree is healthy. The Road is destructive. The County is indifferent.* If a newcomer asked about the fungal infection, the regulars would glance at one another. They would say, "That's a rumor," or "That's what they want you to think."

  It wasn't a lie, exactly. It was a prioritization. The truth of the tree's biology was less important than the truth of the group's cohesion.

  The fifth meeting was the rally planning session. The hall was packed. There was a feeling of electricity in the air, a shared hum. They were no longer just saving a tree; they were defending a way of life against a faceless machine. The county engineers were no longer people with jobs; they were "The Planners."

  Elena stood up during the break. She walked to the front where Arthur was organizing the sign-up sheets.

  "Arthur," she said quietly. "The county released the final environmental impact statement. It addresses the fungus. They're offering a treatment plan. If we accept the widening, they'll fund the treatment. The tree stays."

  Arthur looked at her. He didn't look at the paper she held out. He looked at the room behind her. People were laughing, drinking punch, pinning buttons to their lapels that said *STAND FOR THE ELM.* They looked happy. They looked like a community.

  "If we accept," Arthur said, "we admit they have the right to widen the road. We admit the road comes first."

  "The tree stays," Elena said. "That was the goal."

  "The goal is to say no," Arthur said. "If we say yes, even with the tree, we set a precedent. Next time it's the park. Next time it's the library. We have to draw the line."

  "That's not what we said in the first meeting," Elena said.

  Arthur smiled. It was a kind smile. He reached out and touched her arm. "We've grown, Elena. We understand the stakes better now. You're tired. You've done a lot of work. Maybe you should take a break from the committee. Let us handle the rally."

  He didn't fire her. He didn't ban her. He simply suggested that her presence was no longer required for the work that needed to be done. The work was no longer about the tree. The work was about the rally. It was about the feeling of standing together in the cold, chanting, holding the signs with the green lettering.

  Elena looked at the paper in her hand. Then she looked at the crowd. They were singing now. Someone had started a song, an old folk tune about roots and soil. They weren't singing perfectly, but they were singing together. They looked radiant. They felt righteous.

  She put the paper in her bag. She didn't tell them about the treatment plan. She knew that if she did, the singing would stop. The warmth would vanish. They would have to go back to being twelve people in a library room, discussing traffic flow and fungal spores.

  She walked to the back of the hall. She put on her coat. No one stopped her. Arthur was at the microphone, thanking everyone for their loyalty, for their spirit. He said that as long as they stood together, they could not be moved.

  The crowd cheered. They believed him. They felt stronger than they had in years. Outside, the wind blew through the branches of the Elm, shaking the leaves that were already turning brown. The tree stood on the corner, waiting. It did not know it was a symbol. It only knew the soil, and the slow, quiet work of dying.

  Inside, the meeting ended. People lingered, talking to each other, reluctant to go home to their separate houses. They had found something they needed more than the tree. They had found each other, and the boundary that kept them close. They left the hall in groups, walking down the street, feeling the comfort of the dark, knowing exactly who was walking with them, and who was not.
