answer: |-
  Here are 10 interview questions designed to press the specific vulnerabilities of your guest's "Invariance Structural Realism." Each includes the likely defensive maneuver she'll attempt (the "ontology dodge") and a follow-up to close that escape route.

  ### 1. The Newman Objection (Cardinality vs. Content)
  **Question:** "Let's start with the Newman objection. If we Ramsey-sentence a theory to isolate its structure, Newman showed that any set of objects of the right cardinality can satisfy that structure. Your move is to restrict 'structure' to *invariant* features under symmetry and theory change. But doesn't this just push the problem back? To define which invariances count, don't you have to smuggle in ontological commitments about *what* is being transformed? If not, isn't your realism just realism about cardinality with extra steps?"

  *   **Likely Response:** "No, because invariance isn't just about the number of nodes; it's about the *constraints* on the relations. We aren't counting objects; we're identifying the rigid backbone of the mathematical formalism that survives interpretation."
  *   **Follow-up:** "But who decides which mathematical features are the 'rigid backbone' and which are the 'interpretive flesh'? If you say the math decides, you're a Pythagorean. If you say *we* decide based on what survived history, aren't you just defining 'structure' post-hoc as 'whatever we didn't throw away'? That makes your criterion descriptive, not normative."

  ### 2. The Ontic/Epistemic Divide (Relata Problem)
  **Question:** "You seem to be advocating an Ontic Structural Realism: structure isn't just all we can *know*, it's all there *is*. But relations typically require relata. If I say 'A is to the left of B,' I need an A and a B. If you dissolve the objects into the structure, what grounds the distinctness of the nodes? Without intrinsic properties to individuate them, don't your structural nodes collapse into a single, undifferentiated blob?"

  *   **Likely Response:** "The nodes are purely positional. They are distinguished solely by their place in the web of relations, not by intrinsic 'thisness.' Think of them like points in a geometry defined only by their coordinates relative to one another."
  *   **Follow-up:** "But in a symmetric structure—like a perfect sphere—multiple points have identical relational profiles. If they share all structural properties, the Principle of Identity of Indiscernibles says they are the same point. To keep them distinct, don't you need to reintroduce a haecceity, a 'thisness,' which is exactly the kind of primitive ontology you claimed to eliminate?"

  ### 3. Incommensurability and Mathematical Frameworks
  **Question:** "Your solution to the Pessimistic Meta-Induction relies on structure persisting through theory change. But consider the shift from Newtonian mechanics to General Relativity. One uses flat Euclidean space with absolute time; the other uses a curved Riemannian manifold. There is no isomorphic mapping between the two mathematical frameworks. So, in what precise sense is the *structure* invariant? Are you saying the invariance is only approximate, and if so, doesn't that reopen the door to the pessimist?"

  *   **Likely Response:** "We don't need strict isomorphism. We look for homomorphisms or limiting cases. In the limit of low gravity and velocity, the GR structure contracts to the Newtonian structure. That continuity is the invariant core."
  *   **Follow-up:** "But taking a limit is a mathematical operation *we* perform on the successor theory to make it look like the predecessor. The predecessors didn't know they were limits. If the invariance only exists from the perspective of the *new* theory looking back, haven't you just made realism dependent on the success of the current theory? That's not a defense against the pessimist; it's an admission that the pessimist was right about the past."

  ### 4. Causation and Modality
  **Question:** "A bare invariant mathematical core is static. It describes patterns, but science also explains *why* things happen—it deals in causation and modality. If I ask why the glass broke, 'it fits the invariant structure of stress tensors' feels incomplete compared to 'the force caused it.' Does your view have room for causation, or are you forced to be a Humean regularity theorist? And if you are, why call it 'realism' rather than 'sophisticated instrumentalism'?"

  *   **Likely Response:** "Causation is just asymmetric structural dependency. We don't need a metaphysical 'oomph.' If the structure dictates that state A must be followed by state B, that *is* the causal relation."
  *   **Follow-up:** "But structural dependency is time-symmetric in most fundamental physics. The equations work backward as well as forward. Causation is not. If you reduce causation to structural dependency, you lose the arrow of time. Are you prepared to say that causation is an illusion generated by our macroscopic perspective, and that at the fundamental level, nothing actually *makes* anything happen?"

  ### 5. The "Cherry-Picking" Objection (PMI)
  **Question:** "You argue the Pessimistic Meta-Induction fails because the 'invariant structure' survives even when ontology changes. But isn't this a selection bias? You look at successful theories, identify what they have in common, and call that 'structure.' You ignore the parts of the old theory that were structural but *wrong*. For example, the caloric theory had a robust conservation structure, but it was heat *fluid*. Why is the conservation law 'structure' but the fluid 'ontology'? Both were part of the formalism."

  *   **Likely Response:** "Because the fluid was a representational vehicle, a piece of scaffolding. The conservation principle was the constraint that governed the predictions. We can separate the two."
  *   **Follow-up:** "Scientists at the time couldn't separate them. The conservation principle *required* the fluid to make sense in their framework. If you say they were wrong about the fluid but right about the structure, you're judging them by *our* standards of what counts as structure. Doesn't this imply that future scientists will look at *our* 'invariant structure' and say, 'They thought that was real, but it was just scaffolding for the next theory'?"

  ### 6. Empirical Equivalence and Underdetermination
  **Question:** "Consider two rival theories that are empirically equivalent but structurally distinct—for instance, early matrix mechanics vs. wave mechanics before they were proven equivalent. Or consider theories that are structurally identical but posit different ontologies (like a field vs. a particle interpretation). On your account, do these count as the same theory? If yes, you're ignoring genuine scientific disagreement. If no, then structure isn't doing all the work, because the ontology is affecting the theoretical identity."

  *   **Likely Response:** "If they are mathematically transformable into one another, they are notationally variant, not distinct theories. The disagreement was pragmatic or heuristic, not factual."
  *   **Follow-up:** "But scientists *felt* they were disagreeing about the world, not just notation. Heisenberg thought Schrödinger's waves were nonsense. If you tell them, 'You're both asserting the same invariant structure,' you're telling them they don't know what they're talking about. Is your realism a description of scientific practice, or a revisionary project that tells scientists what they *ought* to believe despite their own intuitions?"

  ### 7. The Role of Scaffolding
  **Question:** "You call entities and specific formalisms 'scaffolding' used to get at the invariant core. But scaffolding is load-bearing during construction. In physics, the 'scaffolding' (like the ether or specific particle models) is often what generates the specific predictions that confirm the theory. If the scaffolding is doing the epistemic heavy lifting, why should we deny it reality? Why is the 'core' more real than the mechanism that actually delivered the truth?"

  *   **Likely Response:** "Because the scaffolding is discarded. We don't believe in the ether now. We only believe in the Maxwell equations. The scaffolding is a means to an end."
  *   **Follow-up:** "But we discarded the ether only because we found *new scaffolding* (fields) that did the job better. If the criterion for reality is 'what gets discarded,' then nothing is real. If the criterion is 'what does the work,' then the ontology is real. You seem to want the credit for the work done by the ontology without the metaphysical cost of believing in it."

  ### 8. Symmetry vs. Dynamics
  **Question:** "Your view prioritizes symmetry and invariance. But symmetries constrain dynamics; they don't determine them. Many different Hamiltonians can respect the same symmetry group. If I'm a realist only about the symmetry structure, I'm agnostic about the specific laws of nature. Does your view allow us to be realists about the specific forces and interactions, or are those also 'scaffolding'? If the latter, your realism is incredibly thin."

  *   **Likely Response:** "The specific dynamics are part of the structure *if* they are robust under theory change. We are realist about the specific laws that survive."
  *   **Follow-up:** "But specific laws rarely survive intact. Newton's inverse square law became a limit case in GR. The *form* changed. So you're back to being a realist only about the *constraints* on the laws, not the laws themselves. That means you're not a realist about how the world actually behaves, only about the boundaries of how it *could* behave. Is that enough to satisfy a realist?"

  ### 9. Normative vs. Descriptive
  **Question:** "Is your claim that scientists *have* historically committed only to invariant structure, or that they *should*? If it's descriptive, history shows they committed deeply to specific ontologies (atoms, ether, phlogiston). If it's normative, you're arguing that scientists have been irrational for centuries. Which is it? And if it's normative, why should we trust a philosophy of science that requires ignoring the actual reasoning of successful scientists?"

  *   **Likely Response:** "It's a rational reconstruction. Scientists implicitly track structure even when they explicitly talk about objects. They treat the objects as placeholders for the structural roles."
  *   **Follow-up:** "That's a psychological claim without evidence. When a scientist says 'I discovered the electron,' they mean they found a thing, not a node in a graph. If you say they really meant the node, you're engaging in semantic charity that strips their claims of their intended content. You're not analyzing their realism; you're replacing it with your own."

  ### 10. The "Sweat" Question (Restatement vs. Solution)
  **Question:** "Here is the worry: The Pessimistic Meta-Induction argues that our best theories are likely false. Your response is to redefine 'truth' or 'commitment' as 'belief in the invariant structure.' But if the invariant structure is just the bit of the theory that *happens* to survive, haven't you just restated the problem? You've said, 'We are realist about the parts that turn out to be true.' That's tautological. It doesn't tell us *how* to identify the true parts *now*, before the next revolution. Does your view actually give us a method for current realism, or is it just a consolation prize for past errors?"

  *   **Likely Response:** "It's not tautological because invariance under symmetry gives us a heuristic for what is likely to survive. We can identify robust structure *before* the revolution."
  *   **Follow-up:** "But symmetry invariance is internal to the current theory. It doesn't guarantee survival across *theory* change, which is what the PMI is about. You're using intra-theoretic stability to promise inter-theoretic survival. That's the gap. If you can't bridge that gap without looking at history *after the fact*, then your view isn't a defense of realism. It's a sophisticated way of saying, 'We'll know what was real once we know what we didn't have to throw away.' And that, frankly, sounds like instrumentalism with a thesaurus."
