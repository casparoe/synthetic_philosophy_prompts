prompt: |-
  Me and my mate Ravi have been arguing about this for about two years now, ever since he dropped out of a physics degree, and I want to pin him down before I actually go and ask him, so I can be smug either way. He has strong opinions about which statements are laws of nature and which are just stuff that happens to be true. His verdicts so far, near enough how he says them:

  - Nothing can travel faster than light. Law. "It's not just that nothing has — the world wouldn't let it happen."
  - Every coin in my kitchen tin is from before 2000. Not a law. Obviously.
  - Water boils at 100 degrees at sea level. Law, "even though it isn't one of the bottom-level rules, it falls out of the deeper ones."
  - Everything in the universe is spreading away from everything else. Not a law. "That's just how the stuff happened to be arranged at the start."
  - Each atom of this radioactive stuff has a 50/50 chance of popping in the next hour. Law. The 50/50 isn't a coincidence, he reckons, it's built into what the stuff is, even though it doesn't always happen.
  - He also thinks there are probly rules out there that are too messy for any of us to ever write down, and they'd still be rules.
  - His test for all of it: rewind the universe and start it over with different stuff in a different arrangement. The speed limit would still hold. The spreading apart wouldn't.

  Now the new case I want you to call for me. Every electron in the universe has exactly the same mass as every other one — everywhere, always, no exceptions, and you can't do any physics without it. But as far as anyone can tell there's no deeper rule forcing that. It's just a brute fact, and it could have been a different number. Law or not?

  (I've tried asking him whether the rules could have been different and he goes both ways on it: sometimes "obviously, otherwise they're just logic", sometimes "no, the speed limit couldn't have been anything else". So don't just tell me what he'd say — tell me which rule he's actually running.)

  Write it up as: "The rules he might be running" (200-250 words), the rules that fit everything above, plus any rule that looks like it fits but definately doesn't, and why. "What each rule says about the new case" (150-200 words), going rule by rule. "My bet" (100-150 words), your prediction of his verdict and why you're backing that rule over the others. And "The case that would settle it" (about 100 words), naming the one further example that would best tell the surviving rules apart, and what each of them would say about it.
