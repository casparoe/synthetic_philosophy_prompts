      *   *The "Ledger":* Needs to handle *flows* (suffering per time) and *stocks* (population size).

  8.  **Refining the "Non-Negotiable" vs. "Camp Preference" Tags:**
      *   *Non-Negotiable:* Logical consistency, ecological reality (you can't deny density dependence).
      *   *Camp Preference:* Whether to use Total vs. Average utilitarianism, whether invertebrates count, whether "potential life" has value.
