      *   The user specifically asks about the tension between:
          1.  Counting every individual (Granularity).
          2.  Tractability (Data availability).
          3.  Moral Constraint (Never license destruction of high-life habitats).
      *   I need to confirm if this is genuine. Yes, it is. If you count every insect (Granularity), the numbers are so huge that suffering likely dominates (due to $r$-selection). If suffering dominates, destruction might look *good* (violating #3). If you ignore insects to save #3, you violate #1. If you try to measure insects precisely, you violate #2.

