answer: |-
  The tension you are feeling arises because you are oscillating between two distinct ethical frameworks for handling collective action problems. The game theorist's distinction (substitutes vs. complements) identifies the *structure* of the problem, but it does not solve the *normative* conflict you have identified. Your conflict is between **Marginal Pivotality** (does this specific act change the outcome?) and **Reference Class Restraint** (what if everyone in my position did this?).

  Here are the two competing principles that capture your pattern.

  ### Principle 1: The Principle of Marginal Pivotality
  **Statement:** An actor should take a unilateral action if and only if the expected marginal value of that specific action is positive. This is calculated as the probability of being pivotal (changing the outcome) multiplied by the value of the outcome, minus the costs and risks of the action itself. Expectations about others' actions are relevant only insofar as they change the probability of your pivotality.

  *   **Unit of Evaluation:** The individual action and its immediate causal consequences.
  *   **Motivating Cases:**
      *   **The Donor:** You give only if you trigger the match (high pivotality). You do not give if the pool is overfunded (zero pivotality).
      *   **The Activist:** You protest only if you are pivotal to blocking the pipeline. If the crowd is already sufficient, your marginal contribution is zero, so you refrain.
      *   **The Engineer (Part 2):** If other labs will release the model anyway, the harm is inevitable. Your marginal contribution to the harm is near-zero. Therefore, you may as well capture the benefit (career, open science) and release.
  *   **Predictions for New Cases:**
      *   **Complements (e.g., Vaccination):** You should act only if your participation helps cross the herd immunity threshold. If the threshold is already met or hopelessly far away, your action has no marginal value, and you are permitted to abstain.
      *   **Irreversible Action:** If the action is irreversible, the "cost" term in the equation becomes massive. You require near-certainty of pivotality to proceed.
      *   **Uncertainty about Awareness:** If you are unsure if others know the option, you must estimate the probability they will discover it. If you think they likely will, your pivotality drops, and you should restrain.

  ### Principle 2: The Principle of Reference Class Restraint
  **Statement:** In domains where actions are aggregate substitutes (where many acts degrade the value of one), an actor should take a unilateral action only if they are willing to universalize the maxim of their action across their reference class. You must act as if you are deciding for all similarly situated agents. Expectations about others' actions are not a license to act; they are a signal to coordinate or restrain.

  *   **Unit of Evaluation:** The rule or maxim governing the action, applied to the reference class (e.g., "all AI labs," "all researchers").
  *   **Motivating Cases:**
      *   **The Pathogen Researcher:** You publish only if you are unique. If you publish because "others are close," you are endorsing a rule where *all* researchers who are "close" publish. That rule leads to the curse. Restraint is required regardless of others' likely actions.
      *   **The Doctor:** You publish only on strong evidence. If you publish on weak evidence because "one paper does little harm," you endorse a rule where *all* doctors publish weak evidence. The aggregate destroys trust.
      *   **The Friend:** You intervene only if you have a unique relationship. If you intervene merely because "someone should," you endorse a rule where *all* friends intervene, potentially overwhelming the subject.
      *   **The Engineer (Part 1):** You refrain generally. This aligns with the norm of restraint.
  *   **Predictions for New Cases:**
      *   **Complements (e.g., Vaccination):** You should act because you wish everyone to act. The "futility" calculation (if others don't act, I won't) is forbidden. You act to set the norm, even if marginal impact is low.
      *   **Irreversible Action:** You must ask: "Should any member of my reference class take this irreversible step unilaterally?" If the answer is no, you cannot do it, even if you think you are the "responsible one."
      *   **Uncertainty about Awareness:** You must assume others *are* aware and capable unless you have definitive proof otherwise. You cannot claim uniqueness based on speculation.

  ### The Verdict: Which Principle Solves the Curse?

  The "Unilateralist's Curse" is defined by the failure of Principle 1. The curse occurs precisely when actors follow Marginal Pivotality: they reason that their individual contribution is negligible or that the harm will happen anyway, so they act. When everyone does this, the aggregate outcome is disastrous.

  Therefore, **Principle 2 (Reference Class Restraint)** is the correct antidote to the Unilateralist's Curse. It forces the actor to internalize the aggregate risk of their decision rule, not just the marginal risk of their specific act.

  ### The Sacrifice

  To adopt Principle 2 and resolve your tension, **you must give up the second part of your Engineer verdict.**

  *   **The Verdict to Abandon:** *"If she is confident the others will release anyway, I feel she may as well release too."*
  *   **Why:** This is the "futility concession." It treats the harm as a *fixed cost* once others act. But in almost all unilateralist cases (pathogens, AI models, leaks), the harm is *marginal and cumulative*. Ten labs releasing a dangerous model is significantly worse than nine. Wider distribution makes recall impossible; more variants make defense harder.
  *   **The Correction:** Under Principle 2, the engineer must refrain even if she expects others to release. Her reasoning must be: "If every lab releases whenever they expect others to release, the safety regime collapses. Therefore, I will not release, and I will advocate for a coordination mechanism (e.g., a pause, a treaty)."
  *   **Why it feels wrong:** It feels like "sucker's payoff" (you sacrifice, they defect). But the Unilateralist's Curse is a Prisoner's Dilemma. The only way to escape the curse is to reject the dominance of the "defect" strategy. If you accept the futility concession, you are not solving the curse; you are succumbing to it.

  ### Summary for Your Column

  1.  **The Distinction:** The game theorist is right that the Curse applies to *substitutes*. But the solution is not found in game theory's equilibrium, but in ethics' universalization.
  2.  **The Rule:** Do not ask, "Does my action change the outcome?" (Marginal Pivotality). Ask, "Would the outcome be safe if everyone in my position used my reasoning?" (Reference Class Restraint).
  3.  **The Hard Truth:** Restraint is required even when it feels futile. If you act because "others will anyway," you are validating the logic that destroys the commons. The engineer must not release the model, even if she believes her competitors will. She must instead work to make that belief false.

  This aligns your Pathogen, Doctor, Activist, Donor, Friend, and Council Member cases into a coherent whole, at the cost of the Engineer's "clean hands" intuition. That intuition is the loophole the Curse exploits.
