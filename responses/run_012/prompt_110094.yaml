answer: |-
  **The Scene**

  In the dimly lit waiting room of a rural clinic, David holds his phone tight, speaking to his violent brother-in-law who is demanding to know where David's suicidal sister is hiding. David says, "She told me this morning she was heading to the pier," which is literally true—she did say that hours ago—but David knows she changed her mind and is currently in the treatment ward behind him. He speaks slowly, pausing before "the pier," allowing the brother-in-law to infer she is still there; the man hangs up, convinced, and drives off to the coast. Sitting next to David, his wife Clara is filling out admission forms. The nurse asks if Clara is the patient's legal guardian. Distracted and trying to break the crushing tension with a dark joke, Clara mutters without looking up, "No, I'm the Queen of Sheba." The nurse ignores her; David chuckles nervously. Neither expects the statement to be taken as fact.

  **The Verdicts**

  For **Augustine**, the moral geometry is clear but counterintuitive. David is guilty of lying. In *On Lying* and *Against Lying*, Augustine argues that the essence of a lie (*mendacium*) is not the falsity of the statement but the *voluntas fallendi*—the will to deceive. David uttered truths, but his heart was "double"; he spoke one thing to make another believed. He committed a sin, potentially a mortal one, regardless of the fact that he saved his sister's life. Augustine permits concealing the truth (silence), but not speaking truth *in order to deceive*. Clara, conversely, is innocent of lying. Her statement was false, but she lacked the intent to deceive. Augustine classifies this as a *jocosum* (jocose) utterance. It might be frivolous, but it is not a lie, because no one was meant to believe it.

  For a **plain falsity-based definition** (the common-sense view), the verdicts flip. David did not lie; he made accurate statements about what his sister said. He was deceptive, perhaps manipulative, but he did not violate the truth. Clara did lie. She asserted a proposition she knew to be false ("I am the Queen of Sheba"). Whether it was a joke or not, the technical condition of lying—asserting what one believes to be false—was met.

  **The Divergence**

  The two views come apart on the **intent to induce false belief**. This is the single feature doing the work. If you delete the intent from David's action (he says the same words but doesn't care what the brother-in-law believes), Augustine exonerates him (no lie, just truth-telling). If you add intent to Clara's action (she says the same words and wants the nurse to believe she is royalty), Augustine condemns her. The falsity-based view remains unmoved by these shifts in intent; it tracks only the correspondence between word and world.

  **Sensitivity to Stakes**

  If you dial the stakes down—for example, David is hiding his sister from an annoying telemarketer rather than a violent man—**Augustine's verdict on David does not change.** This is the core of his rigorism. The gravity of the sin might be mitigated by the "officious" (helpful) nature of the lie compared to a "pernicious" one, but it remains a sin. A lie is an disorder of the soul, a turning away from God (who is Truth), and good consequences cannot justify that disorder. The falsity-based view might still say David didn't lie, but most people's *moral* judgment of David would shift from "heroic" to "petty." Augustine's moral judgment remains "sinful."

  **Can the False Statement Be Worse?**

  Is there a defensible position where Clara (false/harmless) is ranked as morally worse than David (true/deceptive)? Yes, a **strict verbalist deontology**. If the primary moral duty is "Do not assert falsehoods," then Clara has violated the categorical rule, while David has kept it. On this view, linguistic integrity is the absolute good. David preserved the truth-value of his propositions, even if he manipulated the listener's inference. Clara treated language as disposable, severing the link between assertion and belief for the sake of humor. While most would find this ranking harsh, it is logically consistent if one values the *act* of truth-telling over the *consequences* of belief.

  **The Augustinian Wriggle**

  A serious Augustinian would try to wriggle out of condemning David by distinguishing between **assertion and implication**. They would argue David did not assert "My sister is at the pier"; he asserted "My sister *said* she was at the pier." The deception occurred in the listener's mind, not the speaker's tongue. Therefore, David was merely *concealing* the truth (which is permitted) rather than *speaking* a lie.

  **The Cost:** This move costs Augustine the very innovation that makes his theory interesting. His whole project was to move ethics from the external (words) to the internal (will). If he allows David to escape because his words were technically true, he collapses back into the very legalism he sought to transcend. He would have to admit that the "will to deceive" only counts as a lie if it is attached to a false proposition, which contradicts his explicit claim that speaking truth to deceive is still a lie. To save David, the Augustinian must weaken the definition of *voluntas fallendi*, effectively allowing "mental reservation" loopholes that Augustine himself spent considerable energy trying to close.
