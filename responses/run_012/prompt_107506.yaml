      By Jaxson Thorne

      There is a virus spreading through the effective altruism community and the tech sector alike. It calls itself the "unilateralist's curse." It tells you that if everyone acts on their own judgment, someone will do something stupid. Therefore, you must wait. You must coordinate. You must ask permission. I call this what it is: analysis paralysis dressed up in game theory.

