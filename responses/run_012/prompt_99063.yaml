  This is an exceptionally sharp observation. You have identified a tension that professional historians and philosophers of history wrestle with constantly, often without a clear vocabulary to explain it to students. You are right to feel that "Presentism" (as typically taught in high school) is too narrow—it usually focuses on *moral judgment* (Rule 1), whereas you are noticing a bias in *inquiry and framing*.

  As a philosopher of history, I can tell you that you have stumbled upon a distinction that separates introductory historiography from advanced theory. The phenomenon you are describing does have established names, but they live in different neighborhoods of the discipline.

  ### The Core Concept: Methodological Presentism

  The most precise established term for what you are describing is **Methodological Presentism** (sometimes called *Conceptual Presentism*).

  In AP Euro and introductory classes, "Presentism" is almost always taught as *Moral Presentism* (judging the past by modern ethics). However, in the philosophy of history, scholars distinguish this from *Methodological Presentism*. This occurs when a historian uses present-day categories, interests, and standards of "relevance" to select and frame historical questions, even while claiming to be neutral or empathetic.

  When a historian asks, "Why did they believe in witches?" but never asks, "Why did they believe in the stability of the seasons?", they are placing the **explanatory burden** on the belief that seems weird *to us*. The "normal" beliefs (the ones we share) become invisible; the "deviant" beliefs (the ones we don't share) become the "history." This is Methodological Presentism: the present dictates what counts as a *problem* worth solving.

  ### The Philosophical Mechanism: Cryptonormativity

  If you want to get even more precise about the "smuggling" aspect you noticed (values hidden in the framing), the philosophical term is **Cryptonormativity**.

  *   **Crypto-** means hidden.
  *   **Normativity** refers to values or norms.

  Cryptonormativity describes a situation where a thinker claims to be purely descriptive or neutral ("I'm just understanding their worldview"), but their framework relies on unacknowledged normative assumptions. In your example (b), the historian claims to be neutral, but the *choice* of what needs explaining ("Why did they think X?") relies on a hidden norm ("Thinking X is irrational/wrong"). The judgment isn't in the verdict; it's in the question.

  ### Distinguishing from Neighbors

  Here is how this concept shapes up against the terms you might already know:

  1.  **Whig History:**
      *   *What it is:* Interpreting the past as an inevitable march of progress toward the present (usually liberty, democracy, reason).
      *   *Difference:* Whig history is *teleological* (it assumes a destination). Your observation is about *selection*. You can be Methodologically Presentist without believing in progress. For example, a historian might focus on "why they were so racist" (presentist selection) without claiming we are "better" now, just "different." Whig history is a specific *story*; Methodological Presentism is a specific *lens*.
  2.  **Anachronism:**
      *   *What it is:* Placing something in the wrong time period (e.g., saying a Roman had a "nationalist" mindset in the modern sense).
      *   *Difference:* Anachronism is a factual/conceptual error. Methodological Presentism is a *framing bias*. You can avoid anachronisms (using only period-accurate terms) but still be Methodologically Presentist by only studying the period-accurate terms that interest *us* today.
  3.  **The Historian's Fallacy:**
      *   *What it is:* Assuming past actors knew what we know now (hindsight bias).
      *   *Difference:* This is about *knowledge*. Your observation is about *values and relevance*.
  4.  **Emic vs. Etic:**
      *   *What it is:* Insider (Emic) vs. Outsider (Etic) perspectives.
      *   *Difference:* These are *tools*. Methodological Presentism is the *bias* that occurs when an Etic perspective claims to be Emic, or when the choice of which Emic perspectives to recover is driven by Etic values.

  ### The Shape of the Thing

  *   **What it is:** The imposition of present-day *categories of significance* onto the past. It determines what is "figure" (needs explanation) and what is "ground" (background noise).
  *   **What it isn't:** It is not necessarily moral condemnation. You can be kind to historical actors and still be methodologically presentist if you only study the actors who fit modern archetypes (e.g., "the proto-feminist" or "the rational scientist").
  *   **Where its edges are:** The edge is blurred when present concepts are the *only* tools we have. We cannot think without language. If we use the word "religion" to study the Middle Ages, is that Methodological Presentism? Maybe. But if we don't, we can't communicate. The bias becomes problematic when we forget that the *category itself* is a choice.

  ### A Boundary Case

  Here is a case where it is genuinely unclear whether this is happening:

  **The History of "Childhood."**
  A historian writes a book arguing that "Childhood as a distinct phase of life was invented in the 18th century."
  *   *Is this Methodological Presentism?* They are using a modern category ("Childhood") to measure the past. They are framing the lack of this category in the Middle Ages as a "lack" or a "difference" that needs explaining.
  *   *Or is it valid History?* Perhaps "Childhood" is a universal human reality, and we are just tracing its social recognition.
  *   *The Ambiguity:* If the historian treats medieval children as "mini-adults" because they lack our *concept* of childhood, they might be missing how medieval people *actually* experienced youth (which might have been different from both "mini-adult" and "modern child"). The frame ("When did Childhood begin?") might force the evidence into a box that didn't exist for the actors.

  ### Final Verdict

  You are correct that "Presentism" is often taught too narrowly. The specific move of hiding values in the *selection and framing* of questions, rather than the *judgment* of answers, is best described by the distinction between Moral and Methodological Presentism, underpinned by the mechanism of Cryptonormativity.

  For your AP Euro context, "Methodological Presentism" is the most rigorous established term that distinguishes this from the moral judging you were warned against.

  \answer{Methodological Presentism}
