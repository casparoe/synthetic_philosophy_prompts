          *   *Crucial Distinction:* A robot or a sophisticated AI might satisfy GI but not Organicism. A dormant seed or frozen organism might satisfy Organicism (arguably) but have low causal integration at that moment. GI tracks the *current* causal reality, not the potential or biological classification.
          *   Lichen case: Two organisms becoming one. Organicism struggles (is it one life or two?). GI handles it smoothly (integration increases).

      *   **Section 4: Test Cases (The "Intuition Pumps"):**
          *   *Heap of Sand:* Low integration. Gravity/friction only. Behavior is additive. Degree $\approx$ 0.
          *   *Flock of Starlings:* High local integration, emergent global pattern. Not a solid object, but a dynamic system. Degree = Moderate/High (depending on definition of temporal persistence).
          *   *Lichen:* Symbiosis. Fungus + Alga. Metabolic exchange. High integration. Degree = High (approaching 1).
          *   *Corporation:* Legal fiction? No, causal reality. People + Rules + Capital. Actions of "Apple" aren't just actions of employees. Degree = Moderate (lower than organism, higher than heap).
          *   *Human (Theseus/Cell Replacement):* Continuity of causal structure maintains high degree despite material turnover. GI explains persistence better than binary views.

      *   **Section 5: The Vagueness/Counting Objection:**
          *   *Objection:* If composition is vague/graded, "How many objects are in the room?" has no answer. This suggests 'object' is vague/linguistic.
          *   *Counter-argument:* The world is not made of countable atoms of being. Counting presupposes binary identity.
          *   *Defense:* We must reject the assumption that reality must be countable in integers. Reality is field-like or gradient-like. 'Object' refers to a *peak* in the causal integration landscape.
          *   *Metaphysical Claim:* The gradient is real. The "furniture" is dynamic, not static.

      *   **Section 6: Metaphysics vs. Language:**
          *   Is GI just semantics?
          *   Argument: Causal powers are mind-independent. If the degree of integration is mind-independent, the ontological status grounded in it is mind-independent.
          *   Analogy: Temperature is real, even if "hot" is vague. Degree of composition is like temperature, not like "bachelor."

