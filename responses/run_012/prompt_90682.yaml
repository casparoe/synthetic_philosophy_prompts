          *   *Conclusion:* Therefore, ontological unity (composition) is a matter of degree.
          *   *Key Concept:* "Non-additive causal power." If $Causal(Whole) \neq \sum Causal(Parts)$, composition is occurring.

      *   **Section 3: Distinguishing GI from Organicism:**
          *   Organicism relies on a specific biological mechanism ("life").
