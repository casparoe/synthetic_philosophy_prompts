      *Refining the "Counting" objection:* The standard objection (Lewis, Sider) is that vagueness in existence implies vagueness in reality, which is impossible. I must bite the bullet: Vagueness *is* in reality. Causal influence fades off at the edges. Therefore, ontological boundaries fade off. This is a robust metaphysical claim.

