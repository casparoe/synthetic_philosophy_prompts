          4.  Confront the "Vagueness/Counting Objection" (If composition is graded, is 'object' just convenient language?) and *resist* the conclusion that it's merely linguistic/conventional.
          5.  Defend the *metaphysical* reading of GI (it's about the world, not just description).

  2.  **Deconstruct the Target View (Graded Integration):**
      *   *Standard SCQ:* "Do the $xs$ compose a $y$?" (Yes/No).
      *   *GI SCQ:* "To what degree do the $xs$ compose a $y$?" (0 to 1).
      *   *Criterion:* Mutual causal dependence / Non-linearity / Emergence. If the whole behaves in ways not predictable from the sum of isolated parts, integration is high.
      *   *Metaphysical Status:* Real relations in the world, not just conceptual carving.

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
