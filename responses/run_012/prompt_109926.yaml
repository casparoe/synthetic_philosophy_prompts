  **The Scenario**

  You begin with a bankroll of $100 and face exactly three rounds of a binary gamble on a biased coin that lands heads with probability 0.85 and tails with probability 0.15. In each round, you must stake a fixed fraction of your current wealth chosen from the menu $\{0.60, 0.70, 1.00\}$; if heads, you win even money on the stake (wealth becomes $W(1+f)$), and if tails, you lose the stake (wealth becomes $W(1-f)$). You may not borrow, leverage, or alter the fraction between rounds, and your goal is to select the single fraction from the menu that optimizes your specific decision criterion: maximizing expected final wealth, maximizing expected logarithmic final wealth, or maximizing the probability that your final wealth exceeds $100.

  **Analysis of Verdicts**

  *   **Expected Wealth (EW):** Selects **1.00**. Since the expected return per round is $1 + f(2p - 1) = 1 + 0.7f$, expected final wealth is $100(1 + 0.7f)^3$, which is strictly increasing in $f$, forcing the corner solution.
  *   **Expected Log Wealth (Kelly):** Selects **0.70**. The growth rate $g(f) = 0.85 \ln(1+f) + 0.15 \ln(1-f)$ is maximized where $g'(f)=0$, yielding the exact Kelly fraction $f^* = 2p - 1 = 0.70$.
  *   **Probability of Gain (PG):** Selects **0.60**. Final wealth exceeds $100$ if there are 3 wins, or if there are 2 wins and 1 loss *provided* $(1+f)^2(1-f) > 1$; this inequality holds for $f < 0.618$, so only the 0.60 option captures the probability mass of the 2-win outcomes, whereas 0.70 and 1.00 count them as losses.

  **Structural Feature and Removability**

  The three-way split arises from the **nonlinearity of compounding over a finite horizon**, which decouples the arithmetic mean (EW), the geometric mean (Kelly), and the median/mode threshold behavior (PG). This feature cannot be removed without collapsing the split: if the horizon becomes infinite, PG and Kelly converge to the same growth-optimal fraction; if the staking mechanism becomes additive (fixed dollar amounts), PG becomes indifferent to stake size (assuming no ruin), collapsing the distinction between PG and EW.

  **Fixed Dollar Stakes**

  If each round's stake is a fixed dollar amount rather than a fraction of wealth, the sign of the net profit depends only on the number of wins, not the stake size. Consequently, **PG becomes indifferent** among all positive stakes that avoid ruin (as the probability of a net gain is invariant to stake size), while EW still maximizes at the largest stake and Kelly selects an interior fraction; thus, the three-way split collapses into a two-way split.

  **Objection and Success**

  The strongest objection from an expected-wealth maximizer is that **Kelly sacrifices arithmetic return for security**, arguing that if the agent can access an ensemble of independent identical bets (diversification), the law of large numbers guarantees the high expected return of the 1.00 stake without the risk of a single path ruin. This objection **succeeds only conditionally**: it holds if the decision context allows for ensemble averaging (parallel risks), but fails in the specified time-average context (single sequential path) where ergodicity is broken and the high-variance strategy carries a significant probability of underperforming the safer strategies.
