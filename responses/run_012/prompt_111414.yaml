  # Joint Statement on Conditionals: Adversarial Collaboration Report
  **Location:** Basement Seminar Room (near the hissing radiator)  
  **Participants:** Rae (Truth-Conditionalist), Sam (Suppositionalist)  
  **Facilitator:** [User]

  After a year of shouting over the heating pipes, we have drafted the following statement. We agree on the data and the failures of the material conditional, but we diverge on the semantic machinery required to explain them. We have incorporated the "Fete" and "Dialogue" cases provided by our colleague to test our limits.

  ### 1. Agreed Claims

  1.  **Rejection of the Material Conditional:** We both reject the truth-functional material conditional ($\neg A \vee B$) as an adequate analysis for natural language indicatives. It incorrectly validates Antecedent Strengthening and fails to capture the intuitive connection between antecedent and consequent.
  2.  **The Ramsey Test as Data:** We agree that the *Ramsey Test* (evaluating 'If A, B' by hypothetically adding A to your stock of knowledge and assessing B) accurately describes the *psychological process* of assessing indicatives, even if we disagree on what that process reveals (truth conditions vs. degrees of belief).
  3.  **Indicative/Counterfactual Contrast:** We agree that indicatives and counterfactuals behave differently. Specifically, counterfactuals can be false even when the corresponding indicative was assertible (as in the Fete Case), and counterfactuals allow known-false antecedents while standard indicatives do not.
  4.  **Failure of Antecedent Strengthening:** We agree that the inference from 'If A, C' to 'If (A and B), C' is invalid for indicatives. Adding information to the antecedent can shift the relevant set of worlds (Rae) or change the conditional probability (Sam).
  5.  **The Fete Data:** Regarding the Village Fete Case:
      *   The Wednesday indicative ("If it rains, it cancels") was assertible/acceptable at the time.
      *   The Saturday counterfactual ("If it hadn't rained, it would have gone ahead") is false.
      *   Any adequate theory must explain why the counterfactual is false despite the Wednesday indicative being acceptable.
  6.  **Embedding Intuitions:** Regarding the Dialogue Case ("Probably if A, B"), we agree that speakers treat these embeddings as meaningful and capable of being true or false, regardless of whether the underlying clause is a proposition.

  ### 2. Disagreements Table

  | Disagreement | Rae's own wording | Sam's own wording | The crux | Shared test or case | Rae's prediction | Sam's prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Semantic Value** | "The indicative expresses a proposition whose truth is evaluated relative to a context set of epistemically accessible worlds." | "The indicative has no truth conditions; it is a conditional assertion assessed by the conditional probability $P(B\|A)$." | Is the content of an indicative a *truth-bearer* (Rae) or a *constraint on belief* (Sam)? | **The Fete Case (Wednesday):** Evaluating the statement *now* that we know about the tent. | The Wednesday statement expressed a proposition that was *true relative to Wednesday's context*, but would be false if asserted today. | The Wednesday statement had no truth value then or now; it was *assertible then* but would be unassertible now. |
  | **Embedding 'Probably'** | "'Probably' is a sentential operator that modifies the proposition expressed by the conditional clause." | "'Probably' modifies the speaker's degree of belief in the conditional assertion, not a proposition." | Does 'probably' operate on *content* (Rae) or on *attitude* (Sam)? | **The Dialogue Case:** "Probably (If A, B)" vs. "If A, definitely not B." | The speakers disagree about the likelihood of the *proposition* being true. | The speakers disagree about the *strength of the conditional belief*. |
  | **Unified Semantics** | "Indicatives and counterfactuals share a unified semantics; they differ only in the accessibility relation (epistemic vs. metaphysical)." | "Indicatives and counterfactuals are semantically distinct kinds; the split explains why one has truth conditions and the other does not." | Is the difference between 'if' and 'if...had' a matter of *context* (Rae) or *lexical ambiguity/type* (Sam)? | **The Fete Case (Saturday):** The falsity of the counterfactual. | The counterfactual shifts the accessibility relation to include the hidden 'no tent' fact, making the proposition false. | The counterfactual triggers a different semantic rule that tracks objective similarity, making the claim false. |

  ### 3. Analysis of New Material

  **The Fete Case: Split or Absorption?**
  You asked whether the Fete Case is a point for Sam's split or whether Rae can absorb it.
  *   **Sam's View:** This is his strongest evidence. The indicative tracks epistemic probability (high on Wednesday), while the counterfactual tracks objective similarity (false on Saturday). The divergence in verdicts proves a divergence in semantic type.
  *   **Rae's Absorption:** Rae can absorb this, but at a cost. She argues that the *proposition* expressed by the indicative is context-sensitive. On Wednesday, the "context set" excludes the "no tent" fact. In all Wednesday-accessible worlds where it doesn't rain, the fete goes ahead. Thus, the indicative was *true*. On Saturday, the context includes the "no tent" fact. The counterfactual accesses a different sphere (metaphysical closeness) where the tent is missing. Thus, the counterfactual is *false*.
  *   **Verdict:** Rae *can* absorb the data, but she must concede that the truth conditions of the indicative are radically context-dependent in a way that mirrors Sam's assertibility conditions. The disagreement shifts from "Does it have truth conditions?" to "Are those truth conditions stable enough to count as propositions?"

  **The Dialogue Case: Disagreement and Propositions**
  *   **Are they disagreeing about the same thing?** Yes, pragmatically. Both speakers recognize a conflict in attitudes toward the rain/cancellation link.
  *   **Does this settle the proposition question?** No. Rae models this as a disagreement about the probability of a proposition ($P(p) > 0.5$). Sam models this as a disagreement about conditional belief ($P(B|A) > 0.5$).
  *   **The Trap:** If Lewis's Triviality Results hold, $P(\text{If } A, B)$ cannot generally equal $P(B|A)$ if 'If A, B' is a standard proposition. Therefore, if the Dialogue Case shows that speakers *do* equate "Probably (If A, B)" with "$P(B|A)$", this is evidence for Sam. Rae must argue that 'probably' in natural language is loose talk for "It is likely true in our context," not strict probability.

  ### 4. Verbal vs. Genuine Disputes

  **Verbal Dispute:**
  We suspect part of our fight is verbal, centering on the word **"proposition."**
  *   **Rae** uses "proposition" to mean *the content of an assertion relative to a context*.
  *   **Sam** uses "proposition" to mean *a truth-apt content independent of the speaker's epistemic state*.
  *   **Resolution:** If Rae admits her "propositions" are epistemically relativized, and Sam admits his "conditional assertions" behave *as if* they have truth conditions in simple embeddings, we are describing the same phenomenon with different ontological commitments.

  **Genuine Disagreement:**
  The genuine disagreement lies in **Triviality and Embedding.** If we can construct a case where $P(B|A)$ is high, but the intuitive truth value of the conditional is low (a "Gettier Conditional"), Sam predicts the conditional is acceptable, while Rae (if she ties truth to objective facts) might predict it is false.

  ### 5. What Would Move the Debate

  We both agree that the following would genuinely move the debate:
  1.  **Gettier-Style Conditionals:** A case where a speaker has high confidence in $B|A$ for the *wrong reasons* (e.g., lucky evidence). If the conditional feels "false" despite high probability, it hurts Sam. If it feels "true," it hurts Rae (given Triviality).
  2.  **Iterated Conditionals:** Clear intuitions on "If (If A, B), then C." Sam's view struggles to give truth conditions for the antecedent; Rae's view handles it naturally but risks over-generating truth conditions.
  3.  **The 'Even If' Test:** Determining whether 'even if' behaves like a truth-functional operator or a concessive supposition could break the tie on embedding.

