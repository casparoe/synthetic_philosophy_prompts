  **B:** But if I treat the screen output as a report, I can predict the machine's behavior. If it says "balboa," I know the motor will turn. If it says "reject," the motor stays still. The intentional stance works perfectly. Why deny the reality of the state just because you don't like the label "mind"?

  **A:** Because prediction isn't ontology. I can predict the weather by treating the sky as angry. That doesn't mean the sky has beliefs. You're defining intentionality as "useful prediction." I'm defining it as "actual aboutness."

  **B:** And I'm asking where the line is. If you build a robot with that vending machine brain, plus cameras, plus legs, plus that screen, at what point does it get original intentionality? Is it a number of transistors? A specific architecture?

