answer: |-
  This is a sophisticated and well-posed problem. You are effectively navigating the debate between the "Virtue Ethics" interpretation (championed by Damien Keown) and the "Consequentialist" interpretation (championed by Charles Goodman). Your reconstruction is defensible, but the agent-relativity worry you identify is the precise hinge on which the strongest objections turn.

  To answer your questions directly: Yes, the reconstruction is defensible, but to avoid the "long-horizon egoism" label, you must refine the metaphysical underpinnings of the "agent" and distinguish between the *criterion of rightness* and the *decision procedure*.

  Here is a breakdown of how to shore up the argument and a proposal for the specific taxonomic label.

  ### 1. Addressing the Agent-Relativity (Egoism) Worry

  Your worry is that if karma ripens for the agent, the *criterion of rightness* is "maximize my own future welfare," which defines ethical egoism. To defeat this, you need to deploy three distinct arguments available within the tradition:

  **A. The *Anatta* (No-Self) Defense**
  This is your strongest metaphysical move. Ethical egoism presupposes a substantial, enduring self whose interests are privileged over others. Buddhist metaphysics denies this. If the "agent" is merely a causal continuum (*santāna*) without ontological privilege over other continuums, the distinction between "my" future suffering and "your" future suffering is ultimately conventional, not ultimate.
  *   **Argument:** The karmic mechanism is agent-relative *causally* (this continuum causes that result), but the *axiology* is agent-neutral. The reduction of *dukkha* (suffering) is the good, regardless of whose continuum experiences it. Therefore, the view is **Agent-Neutral Consequentialism** operating through an **Agent-Relative Causal Mechanism**.

  **B. The Criterion vs. Decision Procedure Distinction**
  You can argue that while the *validation* of an act is karmic (does this lead to liberation/suffering reduction?), the *decision procedure* for the practitioner is not "What gives me the best karma?" but "What alleviates suffering?"
  *   **Argument:** A sophisticated consequentialist does not calculate consequences in real-time for every act; they cultivate dispositions (virtues) that generally maximize the good. In Buddhism, cultivating *metta* (loving-kindness) and *karuṇā* (compassion) is the decision procedure that maximizes the consequentialist criterion (nirvana/suffering reduction). If the intention (*cetanā*) is genuinely for the welfare of others, the act is not egoistic, even if the karmic fruit accrues to the agent. The egoism charge fails because the *object* of the intention is other-regarding.

  **C. The Mahayana Resource (Merit Transfer)**
  If your chapter covers Mahayana, the Bodhisattva ideal explicitly breaks agent-relative karma. The Bodhisattva vows to take on the bad karma of others and transfer their own merit to them.
  *   **Argument:** If karma were strictly agent-relative egoism, merit transfer (*parinamana*) would be metaphysically impossible. The fact that the tradition posits this mechanism indicates that the soteriological goal (liberation of all beings) trumps the individual karmic ledger.

  ### 2. Taxonomic Classification

  You asked which variety of consequentialism to attribute. "Utilitarianism" is often too narrow (implying hedonism and aggregation). I recommend a more precise label:

  **Option A: Soteriological Rule-Consequentialism**
  *   **Why Rule?** The Buddhist precepts (*sīla*) function as rules. A strict Act-Consequentialist reading (à la Charles Goodman) struggles to explain why certain acts are prohibited even if they might seem to produce good immediate results. A Rule-Consequentialist reading argues that following the precepts generally maximizes the long-term soteriological good (Nirvana) across the vast horizon of samsara.
  *   **Why Soteriological?** The "good" is not merely pleasure (hedonism) but liberation from suffering and the realization of truth.
  *   **Handling Egoism:** Rule-consequentialism allows you to say the rule is "Act for the welfare of all beings," because following *that* rule is what produces the best karmic ripening.

  **Option B: Ideal Consequentialism (with a Karmic Mechanism)**
  *   **Why Ideal?** The *telos* is not a mental state like pleasure, but an objective state of affairs (Nirvana/Bodhi) or a perfection of character (Buddhahood).
  *   **Handling Egoism:** Ideal consequentialism focuses on the realization of value. Since the value (Nirvana) is the same for all sentient beings, the pursuit of it is not inherently egoistic, even if the path is individual.

  **My Recommendation:**
  Label it **Agent-Neutral Soteriological Consequentialism**.
  *   **Agent-Neutral:** Because the good (reduction of *dukkha*) is the same for everyone, and the moral demand applies universally.
  *   **Soteriological:** Because the "consequence" that matters is liberation, not just temporal happiness.
  *   **Consequentialism:** Because the rightness of the act is determined by its causal contribution to that soteriological end (via karma).

  ### 3. Refining Your Rebuttals

  Your handling of *cetanā* and Natural Law is good, but here is how to sharpen them for a PhD-level chapter:

  *   **On Intention (*Cetanā*):** Be careful not to reduce intention merely to a "cause." In Buddhist psychology, intention *is* karma. You should argue that intention is the **locus of evaluative weight** within the consequentialist framework. A consequentialist cares about consequences; in Buddhism, the primary consequence of an act is the psychological imprint it leaves on the continuum. Therefore, evaluating the intention *is* evaluating the primary consequence. This collapses the deontological/consequentialist divide on this specific point.
  *   **On Natural Law:** You are correct that this parallels naturalistic utilitarianism. Strengthen this by noting that karma is a **causal regularity**, not a moral ledger kept by a deity. This makes Buddhist ethics structurally similar to Mill's "sanctions" theory, where the "sanction" is built into the fabric of reality.

  ### 4. Potential Pitfalls to Acknowledge

  To make your chapter robust, you should briefly acknowledge where this reconstruction faces friction:

  1.  **The Theravada/Mahayana Split:** The egoism charge is harder to defeat in early Nikaya/Theravada texts, where the focus is often on individual liberation (*arahantship*). You may need to concede that early Buddhism looks more like "Enlightened Self-Interest" (which is a form of egoism), while Mahayana moves decisively toward Agent-Neutrality.
  2.  **Incommensurability:** Consequentialism usually requires a common currency to aggregate goods (utils). Does Buddhism have this? *Dukkha* is a candidate, but is the *dukkha* of a hungry ghost comparable to the *dukkha* of a human? If not, aggregation fails. You might argue for a **Lexical Consequentialism** (liberation trumps all temporal happiness).
  3.  **Goodman vs. Keown:** You must engage Charles Goodman's *Consequences of Compassion* (2009). He argues for Act-Consequentialism. Keown (*The Nature of Buddhist Ethics*, 1992) argues for Virtue Ethics. Your position is a refinement of Goodman's. Acknowledge that Keown would argue your "consequentialist" reading ignores the intrinsic value of the virtuous act itself. Your counter-argument is that the "intrinsic value" is actually instrumental value toward Nirvana.

  ### Summary Recommendation for the Chapter

  1.  **Defend the Consequentialist Reading:** Maintain that karma is a causal theory of value.
  2.  **Defeat the Egoism Charge:** Use the *anatta* doctrine to argue that while karma is causally individual, the *good* is ontologically universal. Distinguish the causal mechanism from the axiological goal.
  3.  **Assign the Label:** **Agent-Neutral Soteriological Consequentialism**.
  4.  **Nuance:** Acknowledge that the "Rule" aspect (Precepts) is necessary to explain the rigidity of Buddhist morality, distinguishing it from pure Act-Consequentialism.

  This approach allows you to keep the strengths of the consequentialist reading (clarity on karma, naturalism) while avoiding the "egoism" bullet that often causes scholars to retreat to Virtue Ethics.
