      *   *Weaknesses/Complications:* The "agent-relativity" worry is the crux. If the *criterion of rightness* is "maximize my own good karma," it is indeed egoistic. If the *criterion of rightness* is "maximize the good of all sentient beings," but the *mechanism* is individual karma, there's a tension.
