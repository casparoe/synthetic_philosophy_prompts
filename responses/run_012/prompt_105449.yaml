  # Activity Plan: The Foggy Highway

  **Time:** 60 Minutes
  **Participants:** ~12 High School Juniors
  **Goal:** Experience the tension between a rational long-term plan and the immediate urge to play it safe, without knowing your location.
  **Constraint:** Do not use the term "Absent-Minded Driver" until the final 5 minutes.

  ## 1. Materials Needed
  *   **Index Cards:** 24 (2 per student).
  *   **Pens:** 12.
  *   **6-Sided Dice:** 2 (for randomization).
  *   **"Fog Cards":** 12 cards that simply say **"INTERSECTION"** in large bold letters.
  *   **Scoreboard:** Whiteboard or large paper.
  *   **Blindfolds:** 1 (optional, for drama).
  *   **Prize:** Something small (candy, privilege) for the highest score to raise stakes.

  ## 2. The Setup (5 Minutes)
  **Narrative:**
  "Welcome to the Test Drive. You are drivers for a new autonomous car company. The car works great, but the navigation screen has a glitch. When you approach an exit, the screen lights up and says **'INTERSECTION'**. It does *not* tell you if this is the First Exit or the Second Exit. The scenery is identical thick fog. You cannot tell them apart."

  **The Map (Draw on Board):**
  `START  --->  [Exit 1]  --->  [Exit 2]  --->  END`

  **The Payoffs (Write on Board):**
  *   **Exit at 1:** **0 Points** (Wrong exit. You are lost in the woods.)
  *   **Exit at 2:** **4 Points** (Destination reached. Perfect.)
  *   **Pass Both:** **1 Point** (You stay on the highway. Safe, but you missed your stop.)

  **The Rule:**
  "Because the screen looks the same at both exits, **you must adopt one single policy for both.** You cannot say 'I'll exit at the second one' because you won't know which one is the second. You have to decide: When the screen says 'INTERSECTION', what do you do?"

  ## 3. Phase 1: The Commitment (10 Minutes)
  Hand each student an index card (The **Policy Card**).

  **Instructions:**
  1.  Write your name.
  2.  Write your **Driving Policy**. You have three options:
      *   **ALWAYS EXIT:** (You exit at the first sign you see).
      *   **ALWAYS CONTINUE:** (You ignore the sign and keep driving).
      *   **RANDOMIZE:** (You roll the die. 1-2 = Exit, 3-6 = Continue). *Note: Encourage this option subtly.*
  3.  **Crucial:** Seal this card in an envelope or hand it to you face down. This is your *Pre-Commitment*. You are not allowed to change this once the engine starts.

  *Facilitator Note:* Collect the cards. This creates the "Ex-Ante" plan.

  ## 4. Phase 2: The Drive (20 Minutes)
  Call students up one by one (or in pairs if time is tight, but one-on-one is better for tension).

  **The Script:**
  1.  Student stands at the front. Hand them a **Fog Card** ("INTERSECTION").
  2.  **Say:** "You are tired. The fog is thick. The screen says INTERSECTION. You don't know where you are. What is your move?"
  3.  **The Constraint:** They must act according to their Policy Card.
      *   If *Always Exit*: They say "Exit." (Game Over. Score: 0).
      *   If *Always Continue*: They say "Continue." (Take the card back. Wait 5 seconds. Hand the **same** Fog Card back).
          *   **Say:** "You drive on. The fog remains. The screen says INTERSECTION again. What is your move?"
          *   They say "Continue." (Game Over. Score: 1).
      *   If *Randomize*: They roll the die.
          *   Roll 1-2: "Exit." (Game Over. Score: 0).
          *   Roll 3-6: "Continue." (Take card. Wait 5 seconds. Hand card back).
          *   **Say:** "Screen says INTERSECTION again. Roll again."
          *   If Roll 1-2: "Exit." (Score: 4).
          *   If Roll 3-6: "Continue." (Score: 1).

  **The "In the Moment" Pressure:**
  *While they are holding the card for the second time (if they reached it), lean in and whisper:*
  "You're really tired. You know if you Exit now, it *might* be the first exit and you get zero. If you Continue, you're guaranteed at least 1 point. Are you sure you want to stick to the policy?"
  *(Do not let them change it, but make them feel the urge.)*

  **Record Scores:** Write their name and final score on the board immediately.

  ## 5. Phase 3: The Crisis (10 Minutes)
  Once everyone has driven, look at the scoreboard.
  *   **Always Exit** players will have 0.
  *   **Always Continue** players will have 1.
  *   **Randomize** players will have a mix (mostly 4s and 1s, maybe a 0).

  **Ask the Room:**
  "Look at the 'Always Continue' scores. They all got 1 point. It was safe. No one crashed."
  "Now look at the 'Randomize' scores. Some got 4. Some got 1. A few might have hit 0."
  "Who here, while holding that card the second time, felt like 'Continue' was the smarter choice right then, even if their plan said otherwise?"

  *(Most hands will go up. This is the visceral feeling you want.)*

  ## 6. The Debrief (15 Minutes)
  **Step 1: Reveal the Name**
  "This problem is called the **Absent-Minded Driver Problem**. It was published by economists Piccione and Rubinstein in 1997. It breaks standard decision theory."

  **Step 2: The Math of the Plan (Ex-Ante)**
  Draw the Expected Value calculation on the board. Let $p$ be the probability of Exiting.
  *   **Always Exit ($p=1$):** You exit at #1. Score = **0**.
  *   **Always Continue ($p=0$):** You pass #2. Score = **1**.
  *   **Mixed Strategy:**
      *   Chance of Exit #1 ($p$): Payoff 0.
      *   Chance of Reach #2 ($1-p$):
          *   Exit #2 ($p$): Payoff 4.
          *   Pass #2 ($1-p$): Payoff 1.
      *   **Formula:** $EV = (1-p) \times [4p + 1(1-p)]$
      *   Simplify: $EV = -3p^2 + 2p + 1$
      *   **Max Value:** At $p = 1/3$ (Exit 1 out of 3 times), your average score is **1.33 points**.

  **Point:** "1.33 is better than 1. The rational plan is to randomize. Being 'safe' (Always Continue) is actually irrational from the start."

  **Step 3: The Math of the Moment (Ex-Post)**
  "Why did 'Continue' feel better in the driver's seat?"
  "When you are at an intersection, you think: 'If I Exit, I risk getting 0. If I Continue, I guarantee at least 1.'
  "Continuing looks like the **dominant action** in the moment because it avoids the catastrophic 0. But if everyone thinks that way, no one ever exits, and everyone gets the mediocre 1."

  **Step 4: The Conflict**
  "The problem is **Dynamic Inconsistency**. The 'You' at the start (Planner) wants to take a risk to get the 4. The 'You' at the intersection (Actor) is scared of the 0 and wants to play it safe. Because you can't tell the intersections apart, the Actor's fear overrides the Planner's logic."

  ## 7. Predictable Failure Modes & Fixes
  1.  **Counting the Taps:** Students will realize the second time you hand them the card is the second intersection.
      *   *Fix:* Acknowledge this openly. "In this game, we are using an Honor System. In the real philosophical problem, you literally *forget* you saw the first card. Pretend that's true now."
  2.  **Risk Aversion:** Most students will choose "Always Continue" because 0 points feels like "losing."
      *   *Fix:* Use this! In the debrief, highlight that their fear is exactly what the problem predicts. The "rational" choice (randomizing) feels emotionally wrong.
  3.  **Confusion on Randomization:** Students might not know how to randomize effectively.
      *   *Fix:* Provide the dice and explicitly write the "1-2 Exit, 3-6 Continue" rule on the board as an option during Phase 1.
  4.  **Time Management:** Running 12 students one-by-one takes too long.
      *   *Fix:* Run 4 students at a time as a "Crew." They must agree on *one* Policy Card for the whole crew. This adds peer pressure to the decision.

  ## 8. Honest Limitations (For You to Explain)
  You must tell them this in the debrief to be intellectually honest:
  1.  **The Memory Hack:** "In our game, you *knew* you made a decision earlier. In the real Absent-Minded Driver problem, you **forget** you ever made a decision. You don't just not know *where* you are; you don't know *if* you've been here before. This changes the math of probability (belief updating), which is why this problem is still debated by philosophers today."
  2.  **The "Continue" Temptation:** "In our game, 'Continue' felt safer. In the strict math of the problem, 'Continue' isn't always better at the second intersection. But because you can't distinguish the two, the *risk* of the first intersection bleeds into the second, making 'Continue' feel like the only logical choice in the moment, even though it leads to a worse life overall."

  ## 9. Closing Thought
  "Philosophy isn't just about books. It's about realizing that the 'You' who makes the plan on Sunday night is not the same 'You' who has to execute it on Monday morning. The Absent-Minded Driver is just a map for that feeling."
