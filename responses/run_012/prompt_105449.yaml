          *   Two identical chairs.
          *   Student is blindfolded.
          *   GM sits them in Chair 1. "Decision?"
          *   If Continue, GM moves them to Chair 2. "Decision?"
          *   *Problem:* They feel the move.
          *   *Okay, I will stop trying to perfect the amnesia simulation and focus on the Decision Theory constraint.* The prompt asks to "make them feel... in their bones." The feeling comes from the *payoff anxiety* (0 vs 4) and the *information blackout*.
          *   I will use the **"Sealed Strategy"** method.
          *   1. Write Strategy (e.g., "Roll 1-2 Exit, 3-6 Continue").
          *   2. Put in Envelope.
          *   3. GM runs the car. At Int 1, GM opens envelope, follows instruction. At Int 2, GM opens envelope (same instruction), follows instruction.
          *   4. *Where is the "act at an exit" part?*
          *   *Modification:* Student holds the envelope. GM says "Intersection 1." Student rolls dice, looks at card, says action. GM says "Intersection 2." Student rolls dice, looks at card, says action.
          *   *Constraint:* They must use the *same* card for both.
          *   *Tension:* At Intersection 2, they know it's Intersection 2 (because they passed 1).
          *   *Okay, I have to be honest about this limitation.* I will design the activity to *simulate* the constraint via rules, and in the debrief, explain that true AMD requires forgetting the *fact* that you decided before.
          *   *Wait, I can create the tension by asking them to make a decision "In Character" before they know the round structure.*
          *   *No, let's go with the "Fog" narrative.*
          *   "You are driving in thick fog. You see a sign. You don't know if it's Exit 1 or 2."
          *   "Make a decision."
          *   "Okay, you continue. Fog gets thicker. You see a sign."
          *   "Make a decision."
          *   *Crucial:* We tell them *afterwards* that the rule was they had to treat both signs identically.
          *   *No, that's lying.*
          *   *Okay, I will stick to the prompt's instruction:* "players must commit to a plan in advance and then act at an exit they cannot identify."
          *   *Solution:* **The Randomized Intersection Draw.**
          *   Student commits to a plan (e.g., "Exit").
          *   GM draws a card from a deck: "Intersection 1" or "Intersection 2".
          *   Student is told: "You are at an intersection." (GM does not reveal which card was drawn).
          *   Student acts.
          *   *Wait, if they Exit, the game ends.*
          *   *If they Continue, do they get another turn?*
          *   *If the GM drew "Intersection 2" and they Continue, they pass the goal.*
          *   *If the GM drew "Intersection 1" and they Continue, they go to Intersection 2.*
          *   *This is the Sleeping Beauty problem structure, not AMD.*
          *   *AMD implies you visit BOTH, but forget the first.*
          *   *Okay, I will accept the limitation.* I will design the game so they *must* submit one decision for "The Intersection" and that decision applies to both.
          *   *To make it visceral:* I will have them stand up. I will tap them on the shoulder. "Intersection." They speak. I tap again. "Intersection." They speak.
          *   *I will instruct them:* "Due to the fog, you must pretend you don't know if this is the first or second tap. You must use the same logic for both."
          *   *This is the best I can do without drugs.* I will highlight this in the "Limitations" section.

      *   *Wait, one more thing:* "why 'at any exit, continuing just seems better' still feels compelling."
      *   *I need to ensure the payoffs make Continuing look locally dominant.*
      *   *At Exit 1:* Continue (EV 2.5) > Exit (0).
      *   *At Exit 2:* Exit (4) > Continue (1).
      *   *So Continuing isn't always better locally.*
      *   *The AMD paradox is specifically about the ex-ante vs ex-post evaluation of the **strategy**.*
      *   *Ex-Ante:* Plan = (Continue, Exit). Value = 4.
      *   *Ex-Post (at Int 1):* "I should Continue."
      *   *Ex-Post (at Int 2):* "I should Exit."
      *   *But since I can't distinguish:* I have to pick one action for both.
      *   *If I pick "Continue":* I get 1.
      *   *If I pick "Exit":* I get 0 (avg).
      *   *If I pick "Mix":* I get 1.33.
      *   *The "Continue seems better" feeling:* Because at Int 1, Continuing is strictly better. At Int 2, Exiting is better. But since I might be at Int 1 (and the cost of Error at Int 1 is huge), the fear pushes me to Continue.
      *   *Actually, the standard paradox is:* When I arrive at an intersection, I update my belief. "I'm here. What's the prob I'm at 1?"
      *   *If I plan to Continue always:* I'm definitely at 1 (because if I were at 2, I would have continued at 1).
      *   *This is too deep for high schoolers in 1 hour.*
      *   *Focus on:* Planning (Cool Head) vs. Acting (Hot Moment).
      *   *Planning:* "I need to exit somewhere."
      *   *Acting:* "If I exit now, I might crash (0). If I continue, I'm safe (1 or 4)."
      *   *This creates the risk-aversion tension.*

      *   *Okay, ready to write.*
