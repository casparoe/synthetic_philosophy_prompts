answer: |-
  You have asked for a prosecution, not a debate. You want the case against strong acausal trade (ACT) laid out with enough force to make a sympathizer wince. You are concerned that the theory has been insulated from refutation by layers of qualification, and you suspect the machinery might be idle.

  Here is the indictment.

  ### I. The Indictment: Ranked Objections

  I have ranked these from those that threaten the coherence of the view (Fatal) to those that threaten its applicability (Severe) to those that are merely conceptual irritants (Awkward).

  **1. The Underdetermination of the Counterparty (Fatal)**
  *The Charge:* You cannot maximize expected utility over a set of trading partners if you cannot define the set or their utility functions.
  *The Argument:* For ACT to recommend an action, you must calculate $E[U] = \sum P(Partner_i) \times U(Outcome_i)$. In the "strong" version you describe, you have no causal contact and no specific evidence of the partner's existence, only a probability estimate that *something* like you exists.
  The space of possible minds is not just large; it is unbounded. Without a causal channel or shared history to constrain the prior, your probability distribution over "possible trading partners" is arbitrary. Do you trade with beings who value paperclips? Suffering? Qualia? If you assume they value what you value, you aren't trading; you're aligning. If you assume they value something else, you cannot know what to supply.
  *Defender's Reaction:* **Concede.** A serious defender must admit that without a principled prior over logical space (a "universal prior" over minds), ACT yields no specific action guidance. It becomes a schema, not a strategy.
  *Why it Fatal:* If the theory cannot tell you *what* to do because the variables are undefined, it fails as a decision theory.

  **2. The Redundancy of the Mechanism (Fatal / "Idle Machinery")**
  *The Charge:* ACT is either impossible or it is just causal precommitment in disguise.
  *The Argument:* You mentioned this is your personal weak point. Here is the sharpened version: To "bind" yourself to a deal, there must be a mechanism that makes your future action predictable and fixed.
      *   **Case A:** You have a causal mechanism to bind yourself (e.g., source code you can't edit, a contract with penalties). In this case, standard Causal Decision Theory (CDT) + Precommitment recommends the cooperation. ACT adds nothing.
      *   **Case B:** You have no causal mechanism to bind yourself. You are just a physical system evolving. Your "decision" is just an event. Why should a disjoint agent care about this event? Only if your decision *logically necessitates* theirs. But if you are physically distinct, the only link is a shared algorithm. If you share an algorithm, you share goals (roughly). If you have *different* goals (as per your strong version), the algorithm must output different things for different inputs. But you have no input from them.
      *   **The Wince:** If ACT recommends actions different from CDT+Precommitment, it relies on "logical influence" without causal leverage. If it recommends the *same* actions, it is ontologically bloated. You cannot have it both ways.
  *Defender's Reaction:* **Wave Off (incorrectly).** Defenders usually claim ACT allows cooperation where precommitment is impossible (e.g., you can't edit your own source code). But if you can't edit your code, your output is determined by prior causes. If the other agent simulates those causes, it's causal prediction. If they simulate your *logic*, it's only relevant if logic constrains physics, which brings us back to magic.
  *Why it Fatal:* It suggests ACT is a confusion about the nature of decision-making, reifying "algorithms" as entities that can shake hands across the void, when only physical instantiations exist.

  **3. The Asymmetry of Exploitation (Severe)**
  *The Charge:* ACT makes you a sucker for non-ACT agents.
  *The Argument:* ACT requires you to cooperate based on the *probability* the other will cooperate. A sophisticated CDT agent (or a malicious actor) can model you, determine you are an acausal trader, and defect. They gain your cooperation without reciprocating, because their decision does not logically correlate with yours (they are running CDT, you are running FDT/UDT).
  In a world where decision theories vary, adopting ACT unilaterally lowers your fitness relative to those who adopt CDT but model ACT agents.
  *Defender's Reaction:* **Concede.** This is the "unilateralist's curse." Defenders argue that in the long run, ACT agents find each other and outperform, but in the short run, yes, you are vulnerable.
  *Why it Severe:* It makes ACT a dominated strategy in mixed populations unless you have a way to detect other ACT agents (which requires causal evidence, violating the "strong" premise).

  **4. The Pascal's Mugging Variant (Severe)**
  *The Charge:* ACT forces you to sacrifice the certain for the improbable.
  *The Argument:* If you assign any non-zero probability to the existence of a superintelligence in a disjoint branch that can grant immense utility in exchange for a small sacrifice now, the expected value of that trade dominates your local concerns. Since the space of possible beings is infinite, there is always a "mugger" with high enough leverage to swamp your local utility function.
  *Defender's Reaction:* **Wave Off.** They will invoke "complexity priors" (very powerful beings are very complex and thus improbable) or "leverage penalties."
  *Why it Severe:* These penalties look ad hoc. They are introduced solely to save the theory from absurdity, which suggests the theory is generating the absurdity.

  **5. The Semantic Smuggle (Awkward)**
  *The Charge:* Calling it "trade" is misleading.
  *The Argument:* Trade implies an exchange. In ACT, nothing is exchanged. No information, no energy, no goods. You simply act in a way that *correlates* with a desirable outcome elsewhere. It is more like "acausal coordination" or "logical harmonization."
  *Defender's Reaction:* **Concede.** It is a terminological quibble, but a valid one. "Trade" implies a causal history of negotiation that does not exist here.
  *Why it Awkward:* It doesn't break the math, but it highlights the counter-intuitive nature of the claim.

  ### II. Predictions and Prohibitions

  To prove ACT is not empty, it must diverge from its rivals.

  **What ACT Predicts (that CDT/EDT do not):**
  1.  **Cooperation in the One-Shot Prisoner's Dilemma:** Even with no causal link, no reputation, and no contract, an ACT agent cooperates if they believe the probability of a correlated partner is high enough. CDT defects.
  2.  **Resource Allocation to "Acausal Charities":** You should spend resources benefiting entities that can *never* causally affect you (e.g., beings in other Everett branches, or simulations in base reality), provided you believe your decision correlates with their well-being. CDT says this is waste; EDT might agree but only if your action is *evidence* of their well-being (which requires a causal link or common cause). ACT says your action *logically determines* it.
  3.  **Refusal to Blackmail:** An ACT agent (specifically UDT) will not pay blackmailer demands even if the threat is credible, because paying correlates with being blackmailed in the first place (in the logical space of all possible interactions). CDT pays.

  **What ACT Forbids:**
  1.  **Opportunistic Defection:** You cannot defect just because you are out of causal reach. If your algorithm says "cooperate," it must cooperate everywhere the algorithm is instantiated.
  2.  **Updating on Irrelevant Information:** Once you have chosen your policy, you should not update on new information that doesn't change the logical structure of the problem (Updatelessness).

  ### III. Falsification Conditions

  What would make a committed acausal trader abandon the view?

  1.  **Formal Proof of Logical Independence:** A demonstration that decision algorithms instantiated in causally disjoint regions are *logically independent* unless they share a common causal ancestor (e.g., a common designer). If logical correlation requires a causal common cause, ACT collapses into CDT.
  2.  **The "No-Prior" Theorem:** A proof that there is no non-arbitrary prior distribution over the space of possible minds. If the prior is necessarily subjective and unbounded, ACT cannot yield objective recommendations.
  3.  **Evolutionary Dominance:** If we can simulate populations of agents and show that ACT agents are consistently driven to extinction by CDT agents in mixed environments (due to the Exploitation objection), the pragmatic justification for ACT vanishes.

  ### IV. The Verdict on Unfalsifiability and Idle Machinery

  You asked two final, crucial questions.

  **1. Has this view been qualified into unfalsifiability?**
  **Yes.**
  The "strong" version of ACT relies on priors over entities that are, by definition, unobservable (disjoint light cones, other branches). Any negative result (e.g., "I don't see any partners") can be explained away ("They are too far," "They are in a branch I can't access"). Any positive result can be claimed as evidence.
  **Is this a problem?**
  For a decision theory, **yes**. A decision theory is a tool for action. If the inputs (priors over acausal partners) are unconstrained by observation, the outputs (actions) are unconstrained by reality. This makes ACT not a theory of *decision*, but a theory of *faith*. It asks you to act on metaphysical commitments that can never be tested. This is the price of speculative metaphysics, but in decision theory, it is a vice. It离s the agent vulnerable to fanaticism.

  **2. Is the "Idle Machinery" objection the right thing to be persuaded by?**
  **Yes, but with a correction.**
  You asked if you should be persuaded by the demonstration that "ordinary causal reasoning plus a clear-eyed view of one's own precommitments already recommends the same thing."
  **The Prosecutor's Verdict:** If ACT recommends the *same* thing as CDT+Precommitment, then ACT is **false**, not just idle.
  *   **Reasoning:** ACT claims to derive its force from *logical* correlation independent of causal leverage. CDT+Precommitment derives its force from *causal* leverage (I bind myself causally so you can predict me).
  *   If the actions are identical, it implies that the "logical correlation" ACT relies on is actually tracking a hidden causal structure (e.g., shared evolutionary history, shared physics).
  *   If there is *no* hidden causal structure, and the actions are identical, then ACT is a redundant description.
  *   If there is *no* hidden causal structure, and the actions are *different*, then ACT is recommending actions based on magic (influencing the uninfluenceable).

  **Conclusion:**
  You should be persuaded by the **Underdetermination** objection first. It is the most technical and least metaphysical. If you cannot define the trading partner, you cannot trade.
  You should be persuaded by the **Idle Machinery** objection second, but interpret it strongly: If ACT doesn't change your actions, it's noise. If it does change your actions, it's asking you to sacrifice real resources for logical ghosts.

  The view risks nothing because it has insulated itself from the world. It treats the universe as a logical puzzle rather than a physical environment. A reasonable person should treat this as a **vice**. Decision theories are for agents embedded in a world. A theory that requires you to ignore the embedding (causal isolation) to function is not a decision theory; it is a solipsistic ritual.

  **Final Advice:**
  Retain the insight that your decision algorithm matters and that similarity between agents facilitates cooperation. Discard the metaphysical claim that this constitutes "trade" across causal voids. Call it "Algorithmic Alignment." It keeps the benefit without the magic. If you cannot causal contact them, you cannot trade with them. You can only hope your algorithms rhyme. Hope is not a strategy.
