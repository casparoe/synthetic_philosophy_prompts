prompt: |-
  Two camps in the philosophy of mind have been talking past each other for decades. Illusionists hold that the properties we take ourselves to be acquainted with when we attend to our own experience — the raw feel of a colour, the ache of a tooth, the taste of mint — are not properties of our mental lives at all, but artefacts of introspection and of the way we talk about ourselves; the task for a science of consciousness is to explain why we are so thoroughly convinced that such properties exist, not to locate them. Realists about phenomenal consciousness hold that those properties are perfectly real, whatever their ultimate nature, and that a theory which leaves them out has left out the very thing it was meant to explain. The two sides agree on almost nothing except that the other side is wrong. Your task is to write the joint statement they could both sign after a genuinely good-faith adversarial collaboration. Write in British English.

  The document should have four sections.

  1. Agreed claims. A numbered list of propositions both sides can put their names to. Push the agreement as far as it will honestly go: what the explanandum is; which first-person reports count as data and which are already theory-laden; what any theory of consciousness must be answerable to; and what neither side is committed to, so that a reader does not mistake either position for something cruder (behaviourism, the denial that anything happens when one sees red, the denial that introspection ever tells us anything). Each claim must be one that a naive observer might reasonably have expected the two sides to disagree about. No platitudes, and nothing so weak that nobody would deny it.

  2. Disagreements. A table with one row per remaining disagreement and four columns: the issue; the illusionist's formulation of its own position, worded so that an illusionist would accept it; the realist's formulation of its own position, worded so that a realist would accept it; and the residual point of substance once the two formulations sit side by side. Where you suspect a row is largely a verbal dispute, say so, and identify precisely which word or contrast is doing the work.

  3. Cruxes. The sub-questions such that settling one would move at least one side. For each: why it is a crux rather than a restatement of the disagreement, and what each side would count as an answer telling against its own view. The likeliest territory is whether a seeming can justify a belief about what it seems to be, independently of any theory; whether introspective reports are about properties or about vehicles and attitudes; and whether an illusion can be an illusion of the very thing whose existence is denied. Treat these as pointers rather than a checklist, and add cruxes of your own. Prefer cruxes that are tractable — distinctions that can be drawn, findings that could in principle be had — over ones that merely re-assert a metaphysics.

  4. Two cases, with each side's predictions recorded in advance.

  (a) The dial case. A subject is fitted with a device allowing an experimenter to shift, independently of the stimulus, her tendency to report a particular qualitative character, so that she reports the cool taste of mint while drinking warm salt water, and reports it with her usual confidence. What does each side say her experience is like in the moment before she speaks? What does each say her report is tracking? And what further measurement, if it were available, would separate the two predictions?

  (b) The borrowed-vocabulary case. A subject is brought up with no qualitative vocabulary at all and is trained to describe her experiences exhaustively in functional, attentional and dispositional terms — what she is attending to, what she is disposed to do, what she can discriminate. She becomes fluent. Does she still report her experiences, in a different idiom? Has she lost the ability to report them? Or was there never anything there to report? Each side states its answer, and states what would follow for its own view if the other's answer turned out to be right.

  Close the statement with a short section giving, for each side, the strongest consideration the collaboration left unresolved, and saying plainly whether the two positions can be expected to converge on further evidence or whether the remaining difference is a choice between two ways of describing the same facts.

  Do not attribute any of this to named authors or works, and do not introduce schools or labels beyond illusionism and realism; write both positions in plain terms, so that the substance is intelligible to a reader who has never encountered the debate.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Topic:** Philosophy of Mind (Illusionism vs. Realism about Phenomenal Consciousness).
      *   **Task:** Write a joint statement resulting from a good-faith adversarial collaboration.
      *   **Tone/Style:** British English, plain terms (no named authors/schools beyond "illusionism" and "realism"), substantive (no platitudes), structured.
      *   **Structure:**
          1.  Agreed Claims (Numbered list, push agreement far, avoid caricatures).
          2.  Disagreements (Table: Issue, Illusionist Formulation, Realist Formulation, Residual Substance/Verbal Dispute).
          3.  Cruxes (Sub-questions that could move a side, why it's a crux, what counts as evidence against).
          4.  Two Cases (Dial Case, Borrowed-Vocabulary Case: predictions and implications).
          5.  Closing (Strongest unresolved consideration, convergence vs. descriptive choice).

  2.  **Deconstruct the Positions:**
      *   **Realism (Phenomenal Realism):** Qualia/phenomenal properties are real. Experience *has* a subjective feel that exists over and above functional/physical description. Explanandum = the feel itself.
      *   **Illusionism:** The *feel* as commonly conceived (intrinsic, private, ineffable qualia) is an illusion. The brain creates a model that *says* there is a feel, but there isn't one in that sense. Explanandum = the *judgement* or *belief* that there is a feel.
      *   **Common Ground:** Both agree people *seem* to have experiences. Both agree science needs to explain why we say we do. Both deny behaviourism (something happens inside).

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Goal:* Push agreement without watering it down. Avoid "consciousness exists" (too vague) or "qualia are real" (too controversial).
      *   *Idea 1:* First-person reports are data, not infallible truth.
      *   *Idea 2:* Something physical happens in the brain when we report pain.
      *   *Idea 3:* Functional accounts alone feel unsatisfying to the subject (the "gap").
      *   *Idea 4:* Neither side denies that suffering matters ethically.
      *   *Idea 5:* Introspection is a cognitive process, not a magical gaze.
      *   *Refinement:* Ensure they sound like things a naive observer might think they disagree on (e.g., "Is the pain real?").
      *   *Drafting points:*
          1.  Reports of experience are data to be explained, not premises that settle the explanation.
          2.  Introspection is a fallible internal monitoring system, not a direct pipeline to metaphysical truth.
          3.  Physical/functional processes occur in the brain during experience; neither side posits non-physical substances.
          4.  Ethical weight of suffering does not depend on resolving this metaphysical dispute.
          5.  Denial of "phenomenal properties" is not a denial that the subject is in a distinct state from someone not having that experience.

  4.  **Drafting Section 2: Disagreements:**
      *   *Format:* Table (Issue, Illusionist, Realist, Residual).
      *   *Key Disagreement 1:* The nature of the "what it's like".
          *   Illusionist: It's a representational content that misrepresents the state.
          *   Realist: It's a constituent of the state itself.
          *   Residual: Is the property instantiated or merely represented?
      *   *Key Disagreement 2:* Introspective Error.
          *   Illusionist: Introspection systematically misrepresents internal states as having qualitative properties.
          *   Realist: Introspection reveals properties, even if it mislabels their origin.
          *   Residual:* Can a mechanism reveal a property that doesn't exist? (Verbal/Metaphysical).
      *   *Key Disagreement 3:* The Hard Problem.
          *   Illusionist: It dissolves once we explain the judgement.
          *   Realist: It remains until the feel is physically accounted for.
          *   Residual:* Whether explaining the *belief* exhausts the *phenomenon*.

  5.  **Drafting Section 3: Cruxes:**
      *   *Goal:* Tractable questions, not just restating metaphysics.
      *   *Crux 1:* Introspective Justification. Does a seeming justify belief in the property?
          *   Realist: Yes, prima facie.
          *   Illusionist: No, not without independent validation.
          *   *Moving the needle:* If we find introspection works like vision (constructive), supports Illusionism. If it works like pain (direct), supports Realism.
      *   *Crux 2:* The Vehicle vs. Content distinction.
          *   Are we aware of the *processing* or the *output*?
          *   *Moving the needle:* Neural correlates showing the "feel" is a downstream summary, not the processing itself.
      *   *Crux 3:* The "Illusion of What?" problem.
          *   Illusionist: You can't be appeared to redly without redness.
          *   Realist: You can be appeared to qualitatively without qualitative properties.
          *   *Moving the needle:* A coherent model of "error" that doesn't presuppose the thing errored about.

  6.  **Drafting Section 4: Two Cases:**
      *   *(a) The Dial Case:* Manipulating report without changing stimulus.
          *   Realist: Experience changes (qualia shifted). Report tracks experience.
          *   Illusionist: Experience (physical state) stays same, meta-cognitive model changes. Report tracks the model.
          *   *Measurement:* Neural activity in sensory vs. meta-cognitive areas.
      *   *(b) The Borrowed-Vocabulary Case:* No qualia words, only functional words.
          *   Realist: She still has the experiences, just lacks words. She reports functional correlates of the real qualia.
          *   Illusionist: She reports the same underlying states. The "qualia" were just a specific way of talking about these functions. Nothing lost.
          *   *Implication:* If she reports nothing new, Realism worries about ineffability. If she reports "something missing", Illusionism worries about the reality of the missing thing.

  7.  **Drafting Closing:**
      *   *Realist's lingering worry:* If illusionism is true, why is the illusion so stubborn and specific? (The "Reality of the Illusion").
      *   *Illusionist's lingering worry:* If realism is true, how does physical matter generate intrinsic feel? (The "Generation Problem").
      *   *Convergence:* Unlikely to converge on evidence alone; it's partly a choice of ontology (descriptive framework).

  8.  **Review and Refine (Self-Correction):**
      *   *Check British English:* "Colour", "programme", "centre", "behaviour".
      *   *Check Constraints:* No named authors (no Dennett, Chalmers, etc.). Plain terms.
      *   *Check Section 1:* Are these claims strong enough? "Both agree consciousness exists" is too weak. "Both agree reports are data" is better. Let's ensure Claim 5 clarifies the behaviourism point.
      *   *Check Section 2:* Ensure the "Residual" column identifies if it's verbal. The "existence" of properties is likely not just verbal.
      *   *Check Section 3:* Make sure the "what counts against" is specific.
      *   *Check Section 4:* Ensure the predictions are distinct.
      *   *Tone:* Collaborative, rigorous, neutral.

  9.  **Final Polish:** (Mental walk-through of the text).
      *   *Section 1, Claim 3:* Ensure it doesn't sound like physicalism is agreed (though both are usually physicalists, the prompt implies metaphysical neutrality is safer, but usually, both sides in this specific debate are physicalists about the *brain*, disagreeing on the *properties*). I will frame it as "no non-physical substance".
      *   *Section 2:* Make sure the Illusionist doesn't sound like they are denying pain exists *at all*, just the *qualitative property*.
      *   *Section 4:* The Dial Case needs to be precise about what "experience is like" means for each.

  10. **Final Output Generation** (Proceeding to write based on these thoughts).
answer: |-
  # Joint Statement on the Nature of Phenomenal Consciousness

  **Preamble**
  We, the undersigned representatives of the realist and illusionist positions, have engaged in a sustained adversarial collaboration. Our aim was not to secure a conversion, but to isolate the precise locus of our disagreement, eliminate caricatures, and identify the empirical or conceptual hinges upon which our views turn. We acknowledge that while we use the same words, we often assign them different referents. This document records where we stand together, where we stand apart, and what would be required to bridge the gap.

  ### 1. Agreed Claims

  We affirm the following propositions. We note that a naive observer might expect us to disagree on these matters, but we find common ground here to prevent the debate from sliding into absurdity.

  1.  **First-person reports are data, not axioms.** When a subject says, 'I am in pain' or 'I see red', this report is a physical event to be explained by science. It is not an infallible premise that dictates the metaphysical nature of the underlying state. Both sides agree that subjects can be mistaken about the *cause* or *nature* of their states, even if they are authoritative about the *occurrence* of the report.
  2.  **Introspection is a cognitive process.** Attending to one's own experience is not a magical, non-physical gaze. It is a biological function implemented by the brain, subject to limitations, delays, and systematic errors, much like vision or memory.
  3.  **Rejection of substance dualism.** Neither side posits a non-physical soul or substance. We agree that the systems generating consciousness are entirely physical. The dispute concerns whether certain *properties* of those systems are intrinsic and qualitative, or merely represented as such.
  4.  **Rejection of behaviourism.** We deny that consciousness is merely the disposition to behave. Both sides agree that when a subject is paralysed but awake, something is happening internally that is absent when they are asleep. The illusionist does not claim 'nothing happens' when one sees red; they claim that what happens does not possess the intrinsic, private quality the subject believes it does.
  5.  **Ethical neutrality.** The moral significance of suffering does not wait upon the resolution of this debate. Whether the 'ache' of pain is a real qualitative property or a robust illusion generated by nociceptive processing, the imperative to alleviate it remains unchanged. To deny the reality of phenomenal properties is not to deny the reality of the suffering subject.
  6.  **The Explanandum.** We agree that a theory of consciousness must explain why human beings are convinced that they have inner, private, qualitative experiences. A theory that predicts we should not believe we have consciousness, when in fact we do, is insufficient for both sides.

  ### 2. Disagreements

  Despite the agreement above, we remain divided on the interpretation of the data. The following table isolates the substantive residues of our disagreement.

  | Issue | Illusionist Formulation | Realist Formulation | Residual Point of Substance |
  | :--- | :--- | :--- | :--- |
  | **The Status of 'Qualia'** | The properties subjects claim to find (raw feels, intrinsic qualities) are misrepresentations. The brain models its own states as having these properties, but they do not exist in the world or the mind. | The properties subjects claim to find are genuine features of reality. They may depend on the brain, but they are not merely models; they are instantiated constituents of experience. | **Ontological:** Is the property *instantiated* (Realist) or merely *represented* (Illusionist)? This is not merely verbal; it concerns the furniture of the world. |
  | **Introspective Error** | Introspection is systematically deceptive. It presents complex functional states as simple, qualitative ones. The 'seeming' is the error. | Introspection is generally veridical regarding the *presence* of qualities, though it may err regarding their *source*. The 'seeming' is a revelation. | **Epistemic:** Does the appearance of a quality provide prima facie justification for believing the quality exists? (Realist: Yes; Illusionist: No). |
  | **The 'Hard Problem'** | The problem dissolves once we explain the cognitive mechanisms that generate the *judgement* that consciousness is mysterious. | The problem remains until we explain how physical processes generate the *feel* itself, not just the judgement about the feel. | **Explanatory:** Does explaining the belief exhaust the phenomenon? (Illusionist: Yes; Realist: No). |
  | **Physical Closure** | Physical science can, in principle, give a complete description of the brain without referencing qualitative properties, because those properties are not there. | Physical science, as currently conceived, leaves out the qualitative properties. A complete description must either expand physics or acknowledge properties physics does not capture. | **Methodological:** Must physics expand to accommodate consciousness, or must our conception of consciousness shrink to accommodate physics? |

  *Note on Verbal Disputes:* We acknowledge that some friction arises from the word 'real'. The Illusionist calls the *process* of experiencing real, but the *quality* unreal. The Realist calls the *quality* real because the *process* of experiencing it is real. However, as indicated in the 'Ontological' row, this is not purely verbal; it dictates whether a complete physical description of the universe leaves something out.

  ### 3. Cruxes

  We identify the following sub-questions as 'cruxes'. Settling these would not necessarily end the debate, but it would force a significant revision of one side's position. These are chosen for their tractability.

  **Crux 1: The Justification of Seemings**
  *   **The Question:** Does a mental seeming (e.g., 'it seems I am seeing red') justify a belief in the corresponding property ('there is a property of redness') independently of third-party verification?
  *   **Why it is a crux:** The Realist relies on the prima facie authority of appearance. The Illusionist treats appearance as a hypothesis generated by the brain.
  *   **What counts against:**
      *   *Against Realism:* If neuroscience demonstrates that the 'seeming' is constructed post-hoc from disparate signals (as with visual illusions), the claim that seemings justify beliefs is weakened.
      *   *Against Illusionism:* If it can be shown that a system cannot functionally operate on a 'false' seeming without *some* corresponding property being instantiated, the illusionist model collapses.

  **Crux 2: Vehicle vs. Content**
  *   **The Question:** When we introspect, are we aware of the *vehicle* of representation (the neural activity itself) or the *content* (what the activity represents)?
  *   **Why it is a crux:** Illusionists argue we mistake the content for a property of the vehicle. Realists argue the vehicle *has* the property.
  *   **What counts against:**
      *   *Against Realism:* Evidence that introspective access is limited to high-level summaries (contents) and is blind to the low-level processing (vehicles) would support the idea that we are misattributing properties.
      *   *Against Illusionism:* Evidence that the 'feel' varies directly with low-level physical properties, independent of high-level content, would suggest the feel is a property of the vehicle.

  **Crux 3: The Possibility of 'Empty' Intentionality**
  *   **The Question:** Can a mental state be 'about' a qualitative property that does not exist, in the same way a thought can be about a unicorn?
  *   **Why it is a crux:** The Illusionist requires that we can have an experience *as of* a qualia, without qualia. The Realist doubts an experience can be 'of' a quality that isn't there to be experienced.
  *   **What counts against:**
      *   *Against Illusionism:* If analysis shows that 'experiencing red' logically entails the instantiation of 'redness' (unlike 'thinking of a unicorn'), the illusion is impossible.
      *   *Against Realism:* If we can identify cases where the brain generates a 'qualitative report' in the total absence of the sensory input usually associated with it (e.g., phantom limbs for qualia), it supports the 'empty intentionality' model.

  ### 4. Two Cases

  We record our divergent predictions for two hypothetical scenarios.

  **(a) The Dial Case**
  *A subject is fitted with a device allowing an experimenter to shift, independently of the stimulus, her tendency to report a particular qualitative character. She reports the cool taste of mint while drinking warm salt water, and reports it with her usual confidence.*

  *   **Realist Prediction:**
      *   *Experience:* Her experience *is* minty. The device alters the phenomenal character of the state itself.
      *   *Report:* Her report tracks the genuine change in her phenomenal state.
      *   *Measurement:* We would expect to find neural correlates of 'mintiness' activated in the sensory processing areas, despite the salt water input.
  *   **Illusionist Prediction:**
      *   *Experience:* Her sensory processing remains that of salt water; only her meta-cognitive classification changes. There is no 'minty experience', only a 'minty report'.
      *   *Report:* Her report tracks the output of the manipulation device (the meta-cognitive model), not the sensory input.
      *   *Measurement:* We would expect to find activity in the sensory areas consistent with salt, but activity in the decision/reporting areas consistent with mint.
  *   **Decisive Measurement:** If fine-grained imaging shows the early sensory cortex encodes 'salt' while the subject sincerely reports 'mint', this favours Illusionism (report divorced from sensory vehicle). If the early sensory cortex actually encodes 'mint' patterns due to the device, this favours Realism (the feel is tied to the sensory vehicle).

  **(b) The Borrowed-Vocabulary Case**
  *A subject is brought up with no qualitative vocabulary at all and is trained to describe her experiences exhaustively in functional, attentional and dispositional terms—what she is attending to, what she is disposed to do, what she can discriminate. She becomes fluent.*

  *   **Realist Prediction:**
      *   *Outcome:* She still has the experiences (the pain still hurts, the red still looks red). She reports them via their functional roles.
      *   *Implication:* If she claims 'something remains unsaid' or 'I am pointing to something I cannot name', Realism is vindicated. If she reports perfectly adequately without qualia-terms, Realism must accept that qualia are ineffable but real.
      *   *Concession:* If she reports *nothing* missing, and functions identically to a normal speaker, the Realist must admit that qualitative vocabulary adds no explanatory power, though the properties remain.
  *   **Illusionist Prediction:**
      *   *Outcome:* She reports the same states as a normal subject, merely using a different idiom. The 'qualitative' vocabulary was never tracking extra properties, only different aspects of the same functional states.
      *   *Implication:* If she functions without qualia-terms, it shows such terms are not required to track reality.
      *   *Concession:* If she insists that her functional descriptions leave out 'what it is like' for her, the Illusionist must explain why this intuition persists even without cultural reinforcement of qualia-concepts.

  ### Closing Statement

  We conclude by acknowledging the strongest consideration left unresolved by this collaboration.

  **For the Realist:** The strongest unresolved consideration is the **stubbornness of the intuition**. If qualitative properties are illusions, they are unlike any other illusion we know. Visual illusions can be dispelled by measurement; the 'illusion' of consciousness persists even when we accept the illusionist explanation. Why should a mere error feel so undeniably real?

  **For the Illusionist:** The strongest unresolved consideration is the **explanatory gap**. Even if we explain why the subject *believes* they have qualia, we have not explained why that belief is accompanied by a specific, distinctive internal state that differs from a zombie-like processing of the same information. Why does the error *feel* like anything at all?

  **Convergence:** We do not expect further empirical evidence to fully resolve this dispute. The disagreement is not solely about the data, but about the **ontology of description**. The Realist chooses an ontology that takes first-person appearance as a guide to existence. The Illusionist chooses an ontology that takes third-party physical description as the guide to existence, treating first-person appearance as data to be explained away. We may converge on the mechanisms of the brain, but we will likely continue to describe those mechanisms in incompatible languages. We sign this statement not as converts, but as collaborators who have mapped the boundaries of our shared ignorance.
