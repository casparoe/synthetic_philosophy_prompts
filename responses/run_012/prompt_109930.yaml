answer: |-
  The debate between event-based counterfactual theories and variable-based interventionist theories of causation is often framed as a contest between metaphysical fidelity and scientific utility. The former, rooted in the work of David Lewis, seeks to ground causation in the modal structure of events; the latter, championed by James Woodward, seeks to ground it in the manipulability of systems. However, the Canal Gate case demonstrates that both accounts face a structural indeterminacy: the truth of a singular causal claim depends on parameters the theories themselves do not fully fix. In the counterfactual account, the verdict flips depending on the chosen contrast event (30% vs. 59%); in the interventionist account, it flips depending on the chosen variable grain (binary vs. continuous).

  This essay argues that while both accounts confront the problem of causal grain, the interventionist account handles it superiorly. It does not solve the problem of grain fixation—for no theory can objectively dictate the purposes of an inquiry—but it locates the indeterminacy correctly within the pragmatic choice of modeling variables, whereas the counterfactual account obscures it within the metaphysics of event individuation. The interventionist account should be preferred because it renders the necessary relativities explicit, turning a metaphysical paradox into a methodological requirement. The counterfactual account must concede that event individuation is insufficient without explicit contrastivity.

  ### The Counterfactual Account and the Contrast Problem

  The standard event-based counterfactual account holds that a singular event $c$ causes a singular event $e$ if and only if $e$ counterfactually depends on $c$. In the Canal Gate case, $c$ is the operator raising the gate to 60%, and $e$ is the farm flooding. The standard Lewisian analysis requires us to evaluate the counterfactual: "Had $c$ not occurred, would $e$ have occurred?"

  Here, the account stalls. To evaluate "had $c$ not occurred," we must specify the nearest possible world where $c$ is absent. But what constitutes the absence of "raising the gate to 60%"? If the alternative is the gate remaining at 0% or being set to 30%, then the flood does not occur, and causation is affirmed. If the alternative is the gate being set to 59%, the flood still occurs, and causation is denied. The standard patches for preemption and overdetermination (such as quasi-dependence or chains of counterfactuals) offer no relief here, as there is no competing cause or backup mechanism; the issue is purely the definition of the negation of $c$.

  Proponents of the counterfactual view might reply that causal claims are inherently contrastive. Following Jonathan Schaffer, one might argue that the claim is not "$c$ caused $e$" but "$c$ rather than $c^*$ caused $e$ rather than $e^*$." This saves the theory from contradiction but admits that the theory cannot deliver a verdict without external input regarding the contrast. A second reply might posit a "privileged grain," suggesting that the physical threshold (40%) dictates a natural binary event structure (Open vs. Closed). However, this conflates the physical disposition of the farm with the description of the operator's action. The operator set a specific value (60%), not a binary state. To treat the event as binary is to redescribe it, not to analyze the event that actually occurred.

  ### The Interventionist Account and the Variable Problem

  The interventionist account defines causation in terms of invariance under intervention. $C$ causes $E$ if there is a possible intervention on $C$ that changes $E$, while holding other relevant variables fixed. Applied to singular causation, we ask whether the actual value of variable $C$ (60%) caused the actual value of $E$ (Flood) relative to a specific model.

  Here, the indeterminacy arises from variable selection. If we model the system with a coarse variable $C_{coarse}$ (0 = $\le$40%, 1 = >40%), an intervention changing $C_{coarse}$ from 1 to 0 changes $E$ from Flood to Dry. Causation is affirmed. If we model it with a fine-grained variable $C_{fine}$ (0–100), an intervention changing $C_{fine}$ from 60 to 59 leaves $E$ unchanged. On many interventionist readings, if small changes in the cause variable do not produce changes in the effect variable, the specific value 60 is not causally efficacious *at that grain*.

  The interventionist's best reply is to embrace the relativity. Woodward explicitly argues that causal claims are relative to a set of variables chosen to serve specific explanatory interests. There is no "view from nowhere" on causation; there is only causation relative to a model. If the inquiry is about legal liability ("Did opening the gate cause the damage?"), the coarse variable is appropriate. If the inquiry is about hydraulic engineering ("Did the specific pressure level cause the breach?"), the fine variable is appropriate. The theory does not flip-flop; rather, it yields different answers to different well-posed questions.

  ### Adjudication: Metaphysical Obscurity vs. Methodological Clarity

  The core dispute revealed by the Canal Gate case is not ultimately about counterfactuals versus interventions, but about how the grain of causality is fixed. Both accounts require information external to the raw physical history to render a verdict. The question is which account manages this requirement more honestly and effectively.

  The counterfactual account fails because it attempts to hide the pragmatic choice of contrast within the metaphysics of events. It asks us to identify "the event" $c$ as if its identity conditions are fixed by nature. In the Canal Gate case, this leads to the illusion of a paradox: did the raising cause the flood or not? The theory forces us to search for a fact of the matter about event identity that does not exist. Is the event essentially "raising to 60%" or essentially "opening"? The counterfactual account provides no principled way to decide, leading to the verdict flip described in the prompt. By treating the contrast as a hidden parameter of event identity, it obscures the source of the indeterminacy.

  The interventionist account succeeds because it externalizes the pragmatic choice. It acknowledges that causal claims are tools for inquiry, not mirrors of nature. When the verdict flips based on variable grain, the interventionist does not see a contradiction but a shift in the question being asked. The "flip" is not a failure of the theory to track reality, but a reflection of the fact that "causation" serves different roles in different contexts. The interventionist framework forces the inquirer to specify the variables, thereby exposing the pragmatic commitment that the counterfactual account buries.

  Furthermore, the interventionist account handles the threshold nature of the case more naturally. The physical system has a threshold (40%). The interventionist can model this explicitly as a non-linear function within the structural equations. The counterfactual account struggles to represent thresholds without resorting to disjunctive event descriptions (e.g., "the event of the gate being anywhere between 41% and 100%"), which are metaphysically awkward.

  ### Verdict and Concessions

  The interventionist account is the superior framework for singular causation. It wins not because it eliminates the indeterminacy of the Canal Gate case, but because it correctly diagnoses it as a feature of causal modeling rather than a bug in causal metaphysics. It allows us to say: "Relative to the variable set {Open/Closed, Flood/Dry}, the raising caused the flood. Relative to the variable set {Percentage, Flood/Dry}, the specific setting of 60% rather than 59% did not." Both claims are true, and the theory provides the syntax to distinguish them.

  However, for this verdict to stand, the interventionist must concede a significant point to the counterfactualist. The interventionist must admit that variable selection is not merely a matter of "interest" but is constrained by the objective structure of the system. One cannot simply choose *any* variable and claim causation; the variables must respect the modularity and independence conditions of the system. In the Canal Gate case, the 40% threshold is an objective feature that makes the coarse variable *stable*. If the interventionist claims variable choice is purely pragmatic, they risk making causation arbitrary. They must concede that while the *choice* of grain is pragmatic, the *validity* of that grain depends on the objective discontinuities in the system (the threshold).

  Conversely, the counterfactual account must concede that event individuation is insufficient. It cannot rely on the intrinsic properties of $c$ and $e$ to determine causal truth. It must adopt the interventionist insight that causal claims are implicitly contrastive and relative to a description. Without this concession, the counterfactual account remains vulnerable to the 59% objection, forever unable to distinguish between "opening the gate" and "setting the gate to 60%."

  ### Conclusion

  The Canal Gate case demonstrates that singular causation is not a binary relation between raw events, but a ternary relation involving events and a context of inquiry. The interventionist account captures this structure explicitly through variable selection, while the counterfactual account obscures it within event essences. Therefore, the interventionist account is the better theory. It transforms the ambiguity of the Canal Gate case from a metaphysical puzzle into a methodological instruction: specify your variables. We should adopt the interventionist framework, provided it acknowledges that objective system structures constrain our pragmatic choices of grain. Causation is real, but its description is always, and necessarily, a model.
