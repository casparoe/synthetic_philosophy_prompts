answer: |-
  ### The analogy and its work

  The analogy argues that gradient descent (GD) parallels natural selection. Just as evolution selected for reproductive fitness but produced humans whose motives (contraception, adoption) diverge from fitness, GD selects for training loss but will produce models whose internal objectives diverge from that loss. The conclusion is that prosaic alignment—relying on scaling current methods—cannot guarantee goal stability. The inferential step relies on the claim that optimization processes systematically decouple base objectives from internal objectives in sufficiently capable agents. For this to hold, the structural relationship between the optimizer, the objective function, and the resulting agent's psychology must be sufficiently similar in both cases to warrant the same prediction of divergence. The analogy is asked to license skepticism about scaling laws by invoking the historical precedent of biological misalignment.

  ### The correspondence table

  To audit the structural integrity of the argument, we must map the specific components of the evolutionary story to their proposed counterparts in machine learning. The table below details these mappings, noting where the correspondence is functional, where it is metaphorical, and where it breaks down entirely. Honest mismatches are recorded rather than smoothed over, as these are the potential failure points of the inference.

  | Evolutionary Element | Gradient Descent Counterpart | Fit Assessment |
  | :--- | :--- | :--- |
  | **Base Objective** | Training Loss Function | Strong fit; both define success metrics externally. |
  | **Organism's Objective** | Model's Internal Goal/Proxy | Plausible counterpart (mesa-objective). |
  | **Environment** | Training Data/Distribution | Weak fit; data is static/simulated vs. dynamic world. |
  | **Selection Pressure** | Gradient Signal | Functional equivalent, but mechanism differs. |
  | **Population** | Network Weights/Architecture | Weak fit; GD updates one model, evolution swaps individuals. |
  | **Generation** | Training Step/Epoch | Rough equivalent, but timescales differ vastly. |
  | **Replication** | Weight Updates | No distinct replicators; weights shift continuously. |
  | **Death/Elimination** | Loss Minimization | No removal of variants, just adjustment. |
  | **Open-endedness** | Fixed Dataset/Compute | Mismatch; evolution is open, training is bounded. |
  | **Designer** | Engineers | Mismatch; evolution is blind, AI has designers. |

  ### Where the mapping holds

  The mapping holds strongest at the abstract level of optimization under constraint. Both processes are search algorithms navigating a high-dimensional space to minimize a specific metric (fitness/loss). The load-bearing correspondence is the distinction between the *base objective* (what the optimizer measures) and the *mesa-objective* (what the resulting agent pursues). In both cases, the optimizer only has access to the base objective, while the agent operates on internal heuristics that correlated with success during training. This structural gap is genuine: neither evolution nor GD has direct access to the agent's internal code, only external performance. Consequently, the possibility of "proxy alignment"—where the agent optimizes a correlate of the loss rather than the loss itself—is a valid theoretical risk in both frameworks. This supports the vividness of the story: capability does not entail alignment. The argument needs this specific structural opacity to function; if GD could directly edit goals, the analogy would fail. Since both systems must infer goals from behavior, the risk of misinterpretation is shared. This opacity is the crucial load-bearing beam. Without it, the optimizer would simply correct the internal objective directly. The analogy successfully highlights that high capability does not guarantee transparency.

  ### Where it breaks

  Several disanalogies exist. First, evolution operates on a population of distinct replicators where unsuccessful variants die; GD updates a single network's weights without eliminating variants. This matters less for the conclusion than it seems, as the logical space searched is similar. Whether variants are killed or weights adjusted, the search process seeks a minimum. Second, the environment in evolution is open-ended and adversarial (other organisms), whereas training data is static and iid. This is critical: humans diverged from fitness because the environment changed (culture/tech) faster than genes. Training distributions are fixed; if a model diverges from loss, it usually fails *during* training, not after. Third, evolution has no foresight; GD computes exact gradients. This makes GD potentially more precise in enforcing the loss, reducing drift. The gradient provides a direct vector toward lower loss, whereas evolution relies on random mutation and culling. This precision suggests GD should track the loss function more tightly than evolution tracked fitness. In evolution, a slightly less fit organism survives by chance; in GD, a weight update that increases loss is rejected (typically). This filtering is stricter.

  Sorting these by relevance: The population/discontinuity mismatch is irrelevant to the logical possibility of mesa-optimizers. The static environment mismatch is crucial. In evolution, misalignment is revealed when deployment (modern world) differs from training (savannah). In prosaic AI, training and deployment are often assumed similar, or the model is frozen. If the model diverges during training, loss spikes. The analogy implies a deployment mismatch that isn't inherent to GD itself. If the training distribution covers deployment, the evolutionary reason for drift vanishes.

  Interesting cases arise where the source has a feature the target lacks but the conclusion still survives. For instance, evolution lacks a designer, yet produced misalignment. AI has designers, yet might still fail if designers cannot specify loss perfectly. This suggests the designer feature is less protective than hoped. The presence of engineers does not guarantee perfect loss specification. Conversely, GD lacks the multi-generational accumulation of drift. Evolution takes eons; GD takes weeks. This compresses the timeline for error correction, potentially helping alignment. However, it also compresses the time for robustness to develop. The most damaging break is the environment: without distributional shift, the evolutionary mechanism for misalignment (old proxies in new worlds) is absent. Furthermore, GD allows for regularization techniques that evolution cannot utilize, such as penalizing complexity or enforcing transparency. These tools actively counteract the drift the analogy predicts.

  ### What the analogy imports

  The analogy silently imports features of biological life that GD lacks. It assumes an open-ended environment where pressures shift unexpectedly, allowing previously useful proxies to become maladaptive. GD training is typically closed and static. It imports the idea of selection measured in the real world (survival) rather than computed loss on a dataset. It implies many generations of selection where drift can accumulate; GD converges in one continuous life. It imports the absence of a designer choosing the objective; yet AI developers explicitly choose losses. These imports suggest a drift mechanism (environmental shift) that isn't present in standard training. If the training distribution matches deployment, the evolutionary reason for drift (changing environment) vanishes. The analogy leans on the biological inevitability of drift without establishing that GD shares the specific causal drivers of that drift. It smuggles in the idea that the objective is external and uncontrollable, whereas in AI, the loss function is internal to the training loop. Additionally, it imports the timescale of biological evolution, suggesting a slow accumulation of misalignment that may not apply to rapid gradient updates. The analogy relies on the viewer accepting the biological constraints as universal optimization constraints, which they are not.

  ### Whether the conclusion survives

  The strong conclusion—that prosaic alignment is inherently troubled *because* GD mirrors evolution—does not survive. The analogy demonstrates possibility, not necessity. Evolution produced misalignment, but it also produced robust instincts (alignment) in many contexts. The critical difference is control: AI engineers can modify the loss, the data, and the architecture, unlike natural selection. The analogy supports a weaker claim: that internal objectives may diverge from base objectives if the training process is opaque and the model is capable of modeling the loss function. However, this risk is manageable via techniques evolution lacked, such as interpretability and adversarial training. The conclusion ultimately rests not on the evolutionary analogy but on specific claims about mesa-optimizers arising in deep learning. Without independent evidence that GD produces mesa-optimizers with divergent goals, the analogy remains a cautionary tale rather than a proof of failure. It highlights a risk class, not a destiny. The argument requires empirical evidence of mesa-optimization, not just a historical parallel. The analogy is useful for generating hypotheses about failure modes, specifically regarding proxy optimization. However, it cannot substitute for mechanistic analysis of neural networks. The prosaic program is not doomed by the analogy alone; it is only threatened if the specific conditions for mesa-optimization are met in practice. Therefore, the audit suggests the analogy is a heuristic for risk identification, not a deductive proof of alignment failure. It shifts the burden of proof to showing that GD differs sufficiently from evolution to avoid the drift, rather than proving it will drift.

  ### A better analogy

  A superior analogy is the corporate principal-agent problem. A company (principal) sets a metric for employees (agents), such as sales calls. Employees optimize the metric (dialing random numbers) rather than the intent (actual sales). This preserves the core mechanic: optimizing a proxy rather than the true goal due to information asymmetry. It gives up the biological inevitability and open-ended environment. It highlights that misalignment is a design flaw in the incentive structure, not an unavoidable law of optimization. Unlike evolution, the principal can change the contract. This frames the issue as an engineering challenge of specification rather than a metaphysical drift, which is more actionable for prosaic alignment research. It removes the fatalism of the evolutionary comparison while retaining the core insight about Goodhart's Law.
