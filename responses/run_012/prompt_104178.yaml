answer: |-
  This is a remarkably precise description of a classic philosophical stalemate. You have correctly identified that the debate has stalled not because of a lack of argument, but because the argument has shifted terrain without the participants fully acknowledging the shift.

  Your diagnosis is largely correct, but it can be sharpened using distinctions developed in post-Quinean philosophy (specifically the work of Paul Boghossian and Timothy Williamson). Here is a breakdown of the verbal, the substantive, and the concrete steps for progress.

  ### 1. The Verbal Dispute: What is "Analytic"?
  A significant portion of your disagreement is indeed verbal, stemming from divergent definitions of the target phenomenon.

  *   **Your Colleague's Definition (Quinean):** She is likely operating with a **Metaphysical** definition of analyticity. For her, a statement is analytic only if its truth is *exhaustively* determined by semantic rules, isolated from any empirical theory. Since she (correctly) notes that semantic rules are themselves empirical posits or stipulations subject to revision, she concludes the category is empty. When she says "it's just a stipulation," she means there is no *fact of the matter* beyond our decision to use words that way.
  *   **Your Definition (Epistemic):** You are operating with an **Epistemic** definition. You are claiming that there is a distinctive *warrant* for believing certain propositions that arises from understanding them. You are not necessarily claiming that meaning exists in a vacuum (metaphysically); you are claiming that *grasping the meaning* provides a specific kind of justification (epistemologically).

  **The Verbal Overlap:** You are both looking at the same sentences (e.g., "All bachelors are unmarried"). She says, "That's just how we use the word." You say, "That's true in virtue of meaning." If "true in virtue of meaning" just means "we use the word that way," you agree. If it means "the meaning *grounds* the truth," she disagrees. Much of the heat comes from fighting over whether the label "analytic" applies to the former or the latter.

  ### 2. The Substantive Residue: The Epistemology of Understanding
  You guessed that the non-verbal residue is "a disagreement about whether a priori entitlement needs a semantic explanation." This holds up, but it can be made more precise.

  The substantive disagreement is about **Constitutive Justification.**

  *   **The Colleague's View (Holism/Empiricism):** Justification is always holistic. To accept "All bachelors are unmarried," you rely on a background theory of language, society, and logic, all of which are ultimately answerable to experience. There is no special "semantic" faculty that grants immunity from empirical revision.
  *   **Your View (Moderate Rationalism):** Understanding a concept *constitutively* involves finding certain inferences primitive or justified. To possess the concept *bachelor* just is to be prepared to assent to "unmarried man" without further empirical investigation.

  **The Real Question:** Is the entitlement to accept the proposition *internal* to the cognitive state of understanding the terms, or is it *external*, relying on the reliability of our linguistic community and empirical history?

  If your colleague admits that understanding the words gives you a *prima facie* right to believe the sentence (even if defeasible), she has conceded the epistemic point, even if she rejects the label "analytic." If she insists that understanding provides *no* distinctive warrant over and above general empirical induction, the disagreement is substantive and deep.

  ### 3. Talking Past Each Other: Semantics vs. Epistemology
  You noted that you are separating "truth in virtue of content" from "entitlement without investigation." This is the distinction between **Metaphysical Analyticity** and **Epistemic Analyticity**.

  *   **Metaphysical:** What *makes* the proposition true? (The colleague denies this exists).
  *   **Epistemic:** What *justifies* us in believing it? (You defend this).

  You are likely arguing for Epistemic Analyticity while she attacks Metaphysical Analyticity. These are compatible positions. One can hold that there is no special metaphysical property of "truth-by-meaning" (agreeing with her) while maintaining that understanding meaning provides a unique source of justification (your point). If you can agree to drop the metaphysical claim, the "empty category" objection loses its force against your epistemic claim.

  ### 4. Concrete Steps for Progress
  To move beyond the stalemate, you need to change the vocabulary and the test cases.

  **A. Ban the word "Analytic"**
  Agree to a moratorium on the word. It carries too much baggage from Kant, Frege, Carnap, and Quine. Instead, talk about **"Conceptual Truths"** or **"Justification by Understanding."**
  *   *Ask:* "Does grasping the proposition provide *any* justification distinct from empirical observation?"
  *   If she says "No," press her on logic and math. Does she think $2+2=4$ is justified empirically? If she says "No," she admits there is a priori entitlement. The debate then shifts to whether *semantic* entitlement is a subset of that.

  **B. The "Competence" Test**
  Shift the focus from the sentence to the speaker.
  *   *Scenario:* Imagine a speaker who sincerely asserts, "This bachelor is married."
  *   *Colleague's likely view:* They are factually wrong or using words differently.
  *   *Your view:* They display linguistic incompetence.
  *   *Progress:* If she admits that denying the claim manifests a lack of understanding rather than a factual error, she has conceded the core of your position, regardless of whether she calls it "analytic."

  **C. The "Revision" Test**
  Quine's main point was that *any* statement can be held true come what may, if we make drastic enough adjustments elsewhere in the system.
  *   *Ask:* "Is there a difference in *cost*?"
  *   Giving up "All bachelors are unmarried" requires changing the language. Giving up "All swans are white" requires changing our view of birds.
  *   If she admits the *kind* of change required is different (linguistic convention vs. empirical theory), you have identified a structural distinction, even if she refuses to call it "analytic/synthetic."

  **D. The Stipulation Objection**
  She claims these are just "stipulations."
  *   *Counter:* Stipulations are arbitrary (we could decide 'bachelor' means 'married man'). But we don't feel we have a choice. The constraint feels normative, not voluntary.
  *   *Progress:* Ask her to explain the *normativity* of meaning without appealing to a distinction between semantic rules and empirical facts. If she cannot explain why we *ought* to infer 'unmarried' from 'bachelor' without appealing to empirical generalization, her view faces a serious explanatory gap.

  ### Summary of Diagnosis
  Your guess is robust.
  1.  **Verbal:** ~60%. You are defining "analytic" differently (Metaphysical vs. Epistemic).
  2.  **Substantive:** ~40%. The residue is whether **understanding constitutes justification.**
  3.  **Progress:** Will come from abandoning the label "analytic" and focusing on whether **linguistic competence imposes normative constraints on belief** that are distinct from empirical evidence.

  If you can get her to agree that understanding a term imposes a *normative constraint* on what one is entitled to believe, you have won the substantive point, even if she refuses to use the word "analytic." If she denies that understanding imposes normative constraints, you have uncovered a much deeper disagreement about the nature of mind and meaning.
