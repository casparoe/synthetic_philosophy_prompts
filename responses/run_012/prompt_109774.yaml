  Strictly, the pattern requires that authorization constitutes a morally distinct category from execution, such that causal responsibility does not entail equal culpability. It demands that institutional stability is a paramount value, justifying the asymmetry in punishment. It requires leaders' punishment be politically counterproductive, not that they are innocent. Loosely, the pattern accommodates utilitarian justifications where the leader's continued service maximizes welfare, but it does not demand consequentialism. It fits role-differentiated morality but does not require leaders feel no remorse. It merely requires that remorse does not trigger resignation. Strictly, it requires the severing of causal chain from moral liability at the level of command. This distinction ensures the practice is not merely pragmatic but normatively structured around specific views of agency.

  Where it is underdetermined
  This pattern is underdetermined because rival theories license identical outcomes. A utilitarian might spare leaders because their expertise is too valuable to lose, regardless of guilt. A legal positivist might argue leaders acted within statutory authority while operatives exceeded specific regulations. A Weberian might distinguish between the ethics of responsibility (leaders) and conviction (operatives), assigning dirt differently. Even a cynic might argue it is pure power preservation, indistinguishable in outcome from a principled theory of institutional absorption. Because the observable behavior—punishing bottom, sparing top—is consistent with both high-minded theories of role morality and low-minded theories of power protection, the practice itself does not reveal which theoretical commitment actually drives it. The outcome is the same; the justification varies.

  If the presupposition were dropped
  If we reject the presupposition that authorization is morally distinct from execution, the practice collapses. Accountability would require prosecuting or removing authorizers proportionate to their causal role. Institutional reforms would target decision-making architectures, not just operational guidelines. The dirty hands would remain with the decision-maker, meaning leaders must either resign to bear the moral cost or face legal consequences equal to their subordinates. This shift would destabilize hierarchies, as leadership would become high-risk morally and legally. Policy-making would likely become more conservative, avoiding necessary wrongs due to personal liability. The closure mechanism would change from procedural tweaks to personnel changes at the top. The institution could no longer claim to absorb guilt; it would have to expel the guilty leaders to cleanse itself. Ultimately, rejecting the presupposition transforms political wrongdoing from an institutional malfunction requiring repair into a personal crime requiring punishment, fundamentally altering the relationship between state power and individual agency. It would force a reckoning with the human cost of policy, making leadership a morally hazardous vocation rather than a protected status.

  The strongest objection to your reconstruction
  The strongest objection is that this reconstruction rationalizes hypocrisy as theory. By attributing coherent moral logic to what is often mere power preservation, you risk legitimizing injustice. The pattern may not presuppose a theory of divisible agency but rather a failure of evidence gathering against elites. Treating structural impunity as a defensible practice ignores that it often violates the very rule-of-law principles the institution claims to uphold, making the theory a post-hoc justification for corruption rather than a genuine normative framework.
