answer: |-
  # Decision Tree: The Normative Status of Sunk Costs

  **Node 1: The Film Case**
  *Consider a film you paid for but find boring halfway through. Leaving would maximize your future enjoyment.*
  **Question:** Does the money already spent *itself* constitute a normative reason to stay, independent of future enjoyment or reputation?
  *   **No** → Go to Node 2 (The Act is Irrational)
  *   **Yes** → Go to Node 4 (The Act is Rational)

  ---

  **Node 2: The Doctorate Case**
  *Consider a half-finished doctorate that no longer serves your career. Finishing it is locally suboptimal.*
  **Question:** Is maintaining a *standing disposition* to finish what you start rationally required, even if finishing this specific degree is not?
  *   **Yes** → Go to Node 3 (Policy View)
  *   **No** → Go to Node 3 (Orthodox/Ecological Split)

  ---

  **Node 3: The Relationship Case**
  *Consider a relationship sustained only by years already invested. The future looks bleak.*
  **Question:** Is the tendency to honor the past investment rationally vindicated because it secures cooperative benefits (like trust signaling) that outweigh the immediate loss?
  *   **No** → **Leaf A: The Orthodox View**
  *   **Yes** → **Leaf B: The Ecological View**

  ---

  **Node 4: The Firm Case**
  *Consider a firm defending a doomed product line after heavy R&D spend.*
  **Question:** Does the investment justify continuation because it *reveals* information about what you value, or because it *creates* a new obligation?
  *   **Reveals Information** → **Leaf C: The Self-Knowledge View**
  *   **Creates Obligation** → Go to Node 5

  ---

  **Node 5: The War Case**
  *Consider a government continuing a failing war.*
  **Question:** Is the obligation to continue grounded in the agent's *psychological* coherence (e.g., avoiding regret) or the project's *objective* structure (e.g., threshold completion)?
  *   **Psychological Coherence** → **Leaf D: The Non-Standard Preferences View**
  *   **Objective Structure** → **Leaf E: The World-Changing View**

  *(Note: To meet the 6-8 leaf requirement, Leaf A is split below based on a nuance in the Orthodox commitment regarding "reasons" vs "causes".)*

  **Node 6: The Orthodox Nuance**
  *Return to Leaf A (Orthodox).*
  **Question:** Do you hold that sunk costs are merely *causes* of behavior with no rational weight, or that they are *reasons* that are always decisively outweighed by future utility?
  *   **No Rational Weight** → **Leaf A1: Strict Orthodoxy**
  *   **Outweighed Reasons** → **Leaf A2: Moderate Orthodoxy**

  *(Self-Correction: The prompt asks for 6-8 leaves. The split above creates 6 leaves total: A1, A2, B, C, D, E. This works.)*

  ---

  ### The Leaves

  **Leaf A1: Strict Orthodoxy**
  Sunk costs are never reasons; they are merely causal antecedents with no normative weight at the level of the individual act.
  *   **Awkward Commitment:** You must tell the parent staying in a miserable marriage "for the kids" that their sacrifice is not just futile, but conceptually incoherent.

  **Leaf A2: Moderate Orthodoxy**
  Sunk costs are pro tanto reasons, but they are always decisively outweighed by forward-looking utility in rational deliberation.
  *   **Awkward Commitment:** You must concede that honoring the past *matters*, but insist it never matters enough to change a decision, which risks collapsing into Strict Orthodoxy.

  **Leaf B: The Ecological View**
  The effect is a bias that is nonetheless rationally defensible because it tracks real environmental regularities (like commitment signaling) that standard models miss.
  *   **Awkward Commitment:** You must argue that humans are better off being systematically deluded about the source of their reasons to maintain social cohesion.

  **Leaf C: The Self-Knowledge View**
  Honoring the investment is rational because your own past willingness to pay is the best available evidence of what you truly value.
  *   **Awkward Commitment:** You may be required to continue a hobby you no longer enjoy simply to avoid corrupting the data of your own self-narrative.

  **Leaf D: The Non-Standard Preferences View**
  Persistence is rational for an agent whose preferences are coherent but include non-standard goods, such as consistency or regret-avoidance.
  *   **Awkward Commitment:** You must classify the psychic pain of "wasting" money as a utility cost comparable to physical pain, legitimizing the fallacy as a preference satisfaction.

  **Leaf E: The World-Changing View**
  Persistence is rational because the investment has changed the world (e.g., created a normative threshold) and not merely the ledger.
  *   **Awkward Commitment:** You must argue that money vaporized yesterday physically alters the moral geometry of the project today, independent of agent psychology.

  ---

  ### Meta-Analysis

  **Inseparable Leaves**
  My tree cannot cleanly separate **Leaf D (Non-Standard Preferences)** and **Leaf C (Self-Knowledge)**.
  *   **Why:** Both ground the rationality of the act in the agent's internal relation to their past self. If an agent has a "preference for consistency" (Leaf D), it is often *because* they view their past actions as "evidence of value" (Leaf C). A respondent may answer Node 4 ("Creates Obligation") based on a desire for self-knowledge, or answer Node 4 ("Reveals Information") believing that the revelation *creates* the obligation. The distinction between *having* a preference for consistency and *valuing* the evidence of consistency is porous in introspection.

  **Unoccupied Combinations**
  The combination **[Act is Rational] + [Policy is Irrational]** is unoccupied.
  *   **Reason:** This position is **incoherent**. If the specific act of honoring a sunk cost is truly rational based on stable features (whether evidential, psychological, or objective), a standing policy to perform such acts would generally be rational unless it crowded out other goods. A view that justifies the act but forbids the habit implies the rationality is accidental rather than principled, which undermines the normative claim of the leaves in the "Yes" branch (C, D, E).

  **Descriptive vs. Normative**
  The tree strictly sorts on normative claims ("Is it rationally required/vindicated?"). Descriptive claims ("Do people do this?") are excluded from the nodes. For example, Node 3 asks if the bias is *vindicating* (normative), not if it is *adaptive* in an evolutionary sense (descriptive), though the latter supports the former. This ensures the tree maps philosophical justification rather than psychological prevalence.
