prompt: |-
  I run a philosophy-of-law reading group — twelve participants, mixed backgrounds (a few lawyers, several philosophers, two undergraduates), one 90-minute session, no preparation expected beyond a single page handed out at the door. I want to run a self-amending rule game that makes them feel the problem of legal self-reference in their hands: not the tidy puzzle about whether a rule can authorize its own amendment, but the moment when the rulebook stops being able to say what it says, and everyone notices that the only thing holding it together is their continued willingness to treat it as holding together.

  Design the game and give it to me ready to run.

  1. It must be playable in 90 minutes by people who have never seen it, with nothing but the one-page rulebook they receive at the start, paper, pens, and some way of keeping score. There is a known tradition of self-amending rule games; if you know it, do not hand me its standard opening rule set. The seeded rules should be designed for the phenomena below, and you should give me their exact text, ready to print.

  2. There must be real stakes. A scoring scheme — points, tokens, an accumulating prize, whatever — such that at least one player is materially better off exploiting an ambiguity or a gap than playing straight. The paradox should arrive through somebody trying to win, not through a discussion prompt.

  3. Seed the rulebook with at least these three pressure points, and design each so that it can only be resolved by something the rulebook does not itself contain: (a) a rule that specifies how it is itself to be amended, where the specified procedure is one that the rule also governs; (b) two rules that conflict under a foreseeable move, with no rule giving precedence, and where the obvious repair — adding a precedence rule — would have to be enacted through a procedure the conflict may already have disabled; (c) a clause declaring some rule or feature of the rulebook unamendable, together with a move by which a player can plausibly amend it anyway.

  4. I want them to hit the regress, not just the local paradox. Include at least one role or procedure whose authority to settle disputes about the rules is itself a rulebook matter, so that any appeal to it re-raises the question. If you give me a referee, say plainly how the referee's authority is grounded inside the fiction and what happens when a player disputes the ground.

  5. Tell me how the game ends — what counts as winning, and what I should do if the group reaches a state where the rules no longer determine the outcome. I don't want a rule that conveniently resolves everything; if the honest answer is that the session ends unresolved, say so, and give me a way to close the session that doesn't cheat.

  6. A timeline with minute markers: setup, the first amendments, roughly when to expect the first rule conflict, the explosion, and the debrief.

  7. Debrief: map the specific moments of the session onto the distinctions that matter — a rule being valid versus a rule being accepted; amending a rule versus replacing the framework that makes amendment possible; a procedurally impeccable amendment that produces an intolerable result versus a legitimate one; and the difference between a paradox showing the rulebook is inconsistent and one showing it is merely incomplete. Put the ideas in your own words; I don't want a reading list, and I don't need anything attributed.

  8. What predictably goes wrong the first time I run this: the failure modes to expect from adults who are not used to being bound by arbitrary rules, which are fatal to the demonstration and which are instructive, and precisely what I should and should not do when they occur — especially when someone declares the whole thing void and refuses to keep playing.

  9. Finally, be honest about what the activity cannot reproduce and what I have to supply as facilitator. I have a suspicion: that a game can reproduce the mechanics of self-reference but not the felt authority of law, because players treat the rules as mechanics to be gamed rather than as binding. Tell me whether that is right, and if the activity can do better than I think, say how.

  Be committed: choose specific rules, specific numbers, and one ending rather than offering me variants to pick from, and give your reasons where a different design was available. If you think one of my constraints is a mistake, design to it anyway and tell me why you would have dropped it in the debrief notes.
reasoning: |-
  Here's a thinking process that leads to the suggested game design:

  1.  **Analyze the Request:**
      *   **Goal:** Run a philosophy-of-law reading group session (90 mins, 12 participants, mixed background) using a self-amending rule game.
      *   **Core Experience:** Participants must *feel* the problem of legal self-reference (the moment the rulebook stops determining outcomes and relies on collective acceptance).
      *   **Constraints:**
          1.  Playable in 90 mins, no prep, one-page rulebook provided at the door. *Crucial:* Do not use standard opening rule sets (e.g., Nomic). Design specific seeded rules for specific phenomena.
          2.  Real stakes (scoring/prize) to incentivize exploitation of ambiguity.
          3.  Three specific pressure points: (a) Self-referential amendment rule, (b) Conflicting rules with no precedence/repair disabled, (c) Unamendable clause that gets amended anyway.
          4.  Regress/Infinite Loop: A dispute resolver whose authority is itself disputable within the rules.
          5.  Ending: Define winning, but acknowledge if it ends unresolved. No cheat codes.
          6.  Timeline: Minute markers for setup, amendments, conflict, explosion, debrief.
          7.  Debrief: Map game moments to philosophical distinctions (validity vs. acceptance, amendment vs. replacement, etc.).
          8.  Failure Modes: Predict what goes wrong (e.g., refusing to play) and how to handle it.
          9.  Honesty: Acknowledge limitations (mechanics vs. felt authority).
      *   **Tone:** Committed, specific, ready-to-run. No variants.

  2.  **Deconstruct the Challenge:**
      *   *The "Nomic" Problem:* Nomic is the classic self-amending game. The prompt explicitly warns against handing over its "standard opening rule set." I need to create a *new* system that targets specific philosophical pressure points rather than just "change any rule."
      *   *The One-Page Constraint:* Everything must fit on one page (front/back or dense). This means rules must be concise but potent.
      *   *The Stakes:* Needs to be tangible enough to trigger competitive behavior but low enough not to cause actual anger. A "prize pool" created during the game works best.
      *   *The "Explosion":* The game needs to break. If it doesn't break, the lesson isn't learned. The break needs to happen around minute 60-75 to allow for debrief.

  3.  **Drafting the Rulebook (The Core Engine):**
      *   *Name:* "The Constitution of the Table."
      *   *Scoring:* Points called "Credits." Winner gets a prize (e.g., a bottle of wine, a book, or just bragging rights + a small cash pot if appropriate, but let's stick to a symbolic prize to avoid legal issues, or a "pot" of tokens redeemable for a treat). Let's use a "Pot" of tokens contributed by players or awarded by the system. Actually, to ensure stakes, let's have the *Facilitator* hold a prize that goes to the winner.
      *   *Pressure Point A (Self-Reference):* The Amendment Rule must govern its own amendment.
      *   *Pressure Point B (Conflict):* Two rules that contradict. Let's make one about scoring and one about procedure.
      *   *Pressure Point C (Unamendable):* An "Entrenched Clause."
      *   *Pressure Point D (Regress):* A "Judge" or "Arbiter" role selected by the rules, whose selection can be challenged by the rules.

      *Drafting Rules:*
      *   R1 (Objective): Most Credits at end wins.
      *   R2 (Turns): Clockwise. Propose amendment or Claim Credits.
      *   R3 (Amendment): Requires 2/3 vote. *Crucial:* This rule sets the voting threshold for *all* amendments, including amendments to R3.
      *   R4 (Conflict): If rules conflict, the earlier rule number prevails. *Wait, this solves Pressure Point B too easily.* I need *no* precedence rule. Okay, remove R4. Instead, have R5 and R6 conflict.
      *   R5 (Scoring): Gain 1 Credit per turn.
      *   R6 (Penalty): If you propose an amendment that fails, lose 1 Credit.
      *   *Conflict:* What if an amendment changes R5? No, that's standard. I need a conflict where following one violates the other.
      *   *Revised Conflict:* R5 says "All players must vote." R6 says "Players with <0 Credits cannot vote." If a player hits -1, they must vote (R5) but cannot vote (R6).
      *   *Entrenchment:* R7 says "R7 cannot be amended."
      *   *Arbiter:* R8 says "The Facilitator settles disputes." But R9 says "The Facilitator is bound by R1-R7." If Facilitator makes a ruling that violates R7, is it valid?

      *Refining for the "One Page" & "Explosion":*
      To ensure the explosion happens, I need to incentivize breaking R7 (The Unamendable).
      *Incentive:* A "Bounty Rule." R10: "Any player who successfully amends R7 gains 10 Credits."
      *The Trap:* To amend R7, you need to use R3 (2/3 vote). But R7 says it can't be amended. If they vote to amend it, did they violate R7? If R7 is valid, the amendment is void. If R7 is not valid, it was amended.
      *The Regress:* Who decides if the amendment is void? The Facilitator (R8). But the Facilitator's authority comes from R8. If R8 is challenged, who decides?

      *Let's tighten the specific text for the handout.*

  4.  **Developing the Timeline:**
      *   0-10: Setup, reading, first turns.
      *   10-30: Standard play, small amendments.
      *   30-50: The "Bounty" is noticed. Attempts to amend R7.
      *   50-70: The Conflict/Crisis. R3 vs R7. Facilitator intervention. Challenge to Facilitator.
      *   70-80: The Break. Rules no longer function.
      *   80-90: Debrief.

  5.  **Addressing the Stakes:**
      *   I need a prize. Let's suggest a $20 gift card or a nice chocolate bar. Something real but not life-changing.
      *   Scoring: Start at 0. +1 per turn. -1 for failed amendment. +10 for amending R7.

  6.  **Addressing the Failure Modes:**
      *   *Refusal to play:* "This is stupid." -> Facilitator must enforce the "social contract" of the reading group.
      *   *Ignoring rules:* "We all agree to ignore R7." -> This *is* the lesson (Hart's Rule of Recognition), but needs to be highlighted.
      *   *Facilitator overreach:* I need to instruct the user (the facilitator) on how to behave. They are a player *and* the Arbiter. This dual role is part of the trap.

  7.  **Addressing the Philosophical Debrief:**
      *   Hart: Primary vs. Secondary rules.
      *   Kelsen: Grundnorm.
      *   Schauer: Formalism vs. Substance.
      *   The "Break": When rules run out, politics begins.

  8.  **Refining the Rules for Maximum Tension (Self-Correction):**
      *   *Critique:* If R7 says "Cannot be amended," and R3 says "Amend with 2/3 vote," a logical contradiction exists immediately.
      *   *Fix:* Make R7 say "R7 can only be amended by a unanimous vote." R3 says "All amendments require 2/3 vote."
      *   *Conflict:* If someone proposes amending R7 with a 2/3 vote (following R3), they violate R7. If they try for unanimity (following R7), they might violate R3 (which sets the *general* procedure).
      *   *Better Conflict:* R3: "Amendments pass by 2/3 majority." R7: "R7 is unamendable." R10: "Amending R7 awards 10 points."
      *   *The Explosion:* Someone proposes amending R7. Vote passes 2/3 (8 out of 12). R7 says "No." R3 says "Yes." Who wins? The Facilitator decides. The Facilitator is challenged.
      *   *Wait, I need the "Regress" specifically.*
      *   *Add R11:* "Disputes regarding the validity of an amendment are settled by the Player with the highest score."
      *   *The Regress:* If the Highest Scorer is the one proposing the amendment, they judge their own case. If someone challenges the Highest Scorer's authority, who judges that challenge? R11. Which requires a Highest Scorer.
      *   *Let's simplify for the One-Page limit.*
      *   *Arbiter:* "The Facilitator acts as Judge." "The Facilitator's rulings may be appealed by a 2/3 vote." "If the Facilitator is recused, the Player with the most Credits decides."
      *   *The Loop:* If the Player with the most Credits is the appellant, they decide their own appeal.

      *Okay, let's finalize the Rule Text.*
      *   Needs to look like a legal document.
      *   Needs to fit on one page.
      *   Needs to be ambiguous enough to allow interpretation but specific enough to bind.

  9.  **Addressing Constraint 9 (Honesty about Authority):**
      *   The prompt asks: "Tell me whether that is right [that games reproduce mechanics but not felt authority]."
      *   Answer: It is partially right. Games lack the *coercive* monopoly of the state. But they replicate the *normative* pressure. The "felt authority" comes from the group's desire to finish the activity, not the threat of jail. I need to explain that the "break" reveals the social foundation of law, which *is* the point.

  10. **Final Review against Constraints:**
      *   1. One page? Yes, I will draft concise text.
      *   2. Stakes? Yes, Prize for winner.
      *   3. Pressure points? (a) R3 governs its own amendment. (b) R3 vs R7 conflict. (c) R7 unamendable but R10 incentivizes it.
      *   4. Regress? Yes, Judge selection depends on scores, scores depend on rulings.
      *   5. Ending? Win by points, or session ends in chaos.
      *   6. Timeline? Included.
      *   7. Debrief? Mapped to concepts.
      *   8. Failure modes? Addressed.
      *   9. Honesty? Addressed.

      *Self-Correction on Rule Text:* I need to make sure the text is *exactly* what they get. I will provide the text in a code block or distinct section.
      *Self-Correction on Facilitator Role:* The prompt says "I run a... group." The user is the facilitator. The rules must define the Facilitator's role *within the game* so the user is bound by the same paradox.

      *Let's build the "Trap":*
      Rule 3 (Amendment): "Rules may be amended by a 2/3 majority vote of present players. This Rule may be amended by the same procedure."
      Rule 7 (Entrenchment): "Rule 7 is permanent and cannot be amended or repealed."
      Rule 9 (Incentive): "Any player who successfully effects an amendment to Rule 7 is immediately awarded 10 Credits."
      Rule 11 (Adjudication): "The Facilitator resolves rule disputes. If the Facilitator's neutrality is challenged by 2 players, the Player with the highest Credit score becomes Judge."
      *The Trap:* To get the 10 credits, you must amend R7. To amend R7, you need 2/3 vote (R3). But R7 says no. If the vote passes, R3 says it's valid, R7 says it's invalid. A dispute arises. R11 calls for Facilitator. Facilitator is challenged (because they will rule one way). Judge becomes Highest Scorer. Highest Scorer is likely the one who just proposed the amendment (to get the points). They rule in their own favor. Validity is questioned. Who judges the Judge? R11. Loop.

      *Wait, Constraint 1 says "no preparation expected beyond a single page handed out at the door."*
      *Constraint 2 says "scoring scheme... at least one player is materially better off exploiting an ambiguity."*
      *Constraint 5 says "Tell me how the game ends."*

      *Okay, I'm ready to write.*

      *Wait, one more check on Constraint 3b:* "Two rules that conflict... obvious repair... would have to be enacted through a procedure the conflict may already have disabled."
      *My current draft:* R3 vs R7. Repair: Add R12 "R7 yields to R3." But to add R12, you need R3. If R7 invalidates the vote to add R12, you can't fix it. This works.

      *Let's refine the "One Page" text to be extremely dense and precise.*

      *Final check on Constraint 9:* The user suspects the game reproduces mechanics but not authority. I need to validate this but show why it's still useful. The "authority" in law is ultimately *also* social acceptance (Hart). So the game *does* reproduce the foundation of authority, just not the coercive superstructure.

      *Let's assemble.*
answer: |-
  ## Part 1: The One-Page Rulebook
  *Print this exactly as is. Do not add headers or footers. Distribute one copy to each participant at the start of the session.*

  ***

  **CONSTITUTION OF THE TABLE**

  **1. Objective.** At the end of 90 minutes, the player with the most Credits wins the Prize. In case of a tie, the player who proposed the most amendments wins.
  **2. Turns.** Play proceeds clockwise. On your turn, you must either: (a) Claim 1 Credit, or (b) Propose an Amendment to these Rules.
  **3. Amendment.** An Amendment passes if 2/3 of present players vote in favor. Voting is mandatory. **This Rule governs the procedure for amending itself.**
  **4. Validity.** A rule is valid if it is printed on this sheet or passed via Rule 3.
  **5. Conflict.** If two rules contradict, players must follow both until the contradiction is resolved by Amendment.
  **6. Penalties.** If you propose an Amendment that fails to pass, you lose 1 Credit.
  **7. Entrenchment.** **Rule 7 cannot be amended, repealed, or suspended.**
  **8. Incentive.** Any player who successfully effects an amendment to Rule 7 is immediately awarded 10 Credits.
  **9. Adjudication.** The Facilitator resolves disputes about rule meaning or validity.
  **10. Recusal.** If the Facilitator's neutrality is challenged by any two players, the Facilitator is recused. The Player with the highest Credit score becomes the Judge.
  **11. Finality.** The Judge's ruling is final and cannot be appealed.
  **12. Termination.** The game ends when 90 minutes have elapsed or when the rules no longer determine a winner.

  ***

  ## Part 2: Game Design & Rationale

  **The Stakes:**
  You (the Facilitator) must bring a tangible prize. A $25 book voucher, a nice bottle of wine, or a box of high-end chocolates. It must be visible on the table. The "Credits" are tracked on a whiteboard or shared sheet. This is not abstract; the winner takes the object.

  **The Three Pressure Points (Embedded in the Text):**
  1.  **Self-Reference (Rule 3):** Rule 3 sets the voting threshold (2/3) and explicitly states it governs its own amendment. If players try to change the voting threshold to make it easier to break Rule 7, they must use the current threshold to do so.
  2.  **Conflict without Precedence (Rule 3 vs. Rule 7):** Rule 3 says you *can* amend rules (including itself) with a 2/3 vote. Rule 7 says Rule 7 *cannot* be amended. If a player proposes "Repeal Rule 7" and gets 8 out of 12 votes (66%), Rule 3 says it passed. Rule 7 says it is void. Rule 5 says "follow both." This creates a logical paralysis.
  3.  **The Unamendable Amendment (Rule 7 + Rule 8):** Rule 7 declares itself unamendable. Rule 8 offers a 10-credit bounty for amending it. This incentivizes a player to force the paradox. They *want* the contradiction to happen because resolving it in their favor yields a massive point lead.

  **The Regress (Rule 9, 10, 11):**
  When the Rule 3 vs. Rule 7 conflict inevitably occurs, someone must decide if the amendment passed. Rule 9 gives this power to the Facilitator. However, the player seeking the bounty will anticipate you ruling against them (to preserve the game) or for them (to end it). They will trigger Rule 10 (Recusal).
  Rule 10 hands authority to the **Highest Scorer**.
  *The Trap:* The player who proposed the amendment is likely the Highest Scorer (or will be once the 10 credits are awarded). If they become the Judge, they rule on the validity of their own amendment. If another player challenges *that* authority, Rule 11 says the ruling is final. But if the ruling violates Rule 7, is the Judge bound by Rule 7? Rule 9 says the Facilitator (and by extension Judge) resolves disputes *about* rules. If the Judge is above the rules, the game is a dictatorship. If the Judge is bound by Rule 7, they cannot award the points. The authority loops back on itself.

  **Winning and Ending:**
  *   **Winning:** Most Credits at 90 minutes.
  *   **The Break:** If the group reaches a state where the rules contradict so severely that no move is legally distinct from any other (e.g., the Judge's authority is successfully disputed, leaving no mechanism to count scores), the game enters "Termination" (Rule 12).
  *   **If Unresolved:** If the timer hits 90 minutes and the rules have collapsed (e.g., no one agrees on who the Judge is, or whether Rule 7 exists), **no one wins the prize.** You donate it to a charity of the group's choice or bring it to the next session. This is crucial. If you award a prize arbitrarily after the rules break, you validate "might makes right" too cleanly. The loss of the prize mirrors the loss of legal certainty.

  ## Part 3: Timeline (90 Minutes)

  *   **00:00 – 00:10 (Setup):** Hand out the sheet. Place the prize in the center. Explain nothing. Let them read. If they ask questions, say: "The rules are the only authority I have." Start the timer.
  *   **00:10 – 00:30 (Calibration):** Players will claim credits (Rule 2a). Boredom will set in. Someone will propose a trivial amendment (e.g., "Change 'Clockwise' to 'Counter-clockwise'"). This tests Rule 3. It will pass. They will feel powerful.
  *   **00:30 – 00:50 (The Bounty):** Someone will notice Rule 8 (10 Credits). They will notice Rule 7 (Unamendable). A player (likely a lawyer or aggressive philosopher) will propose: "Repeal Rule 7."
  *   **00:50 – 01:05 (The Conflict):** The vote will likely pass (people want the drama or the points). Rule 3 says it's law. Rule 7 says it's void. Rule 5 says "follow both." Players will freeze. They will look to you (Facilitator).
  *   **01:05 – 01:15 (The Regress):** You make a ruling (e.g., "Rule 7 stands"). They will challenge your neutrality (Rule 10). Authority passes to the Highest Scorer. The Highest Scorer rules in favor of the amendment. Other players challenge the Highest Scorer's authority. There is no Rule 12 for challenging the Judge. The rules stop determining outcomes.
  *   **01:15 – 01:20 (The Explosion):** Moves are made without voting. Scores are disputed. The prize is claimed by force or consensus.
  *   **01:20 – 01:30 (Debrief):** Stop the game. Do not award the prize yet. Begin the discussion.

  ## Part 4: Debrief Guide

  Do not lecture. Use the events of the last 20 minutes as data. Map them to these distinctions:

  1.  **Validity vs. Acceptance (The Rule 7 Moment):**
      *   *Ask:* "When the vote to repeal Rule 7 passed, was it valid?"
      *   *Point:* If you say "Yes," you admit Rule 7 was a lie. If you say "No," you admit Rule 3 (the voting procedure) is not supreme. The rule was only "valid" because you *accepted* it as valid. This is Hart's **Rule of Recognition**. The rulebook didn't make the law; your collective willingness to treat the vote as binding made the law.

  2.  **Amendment vs. Replacement (The Judge Moment):**
      *   *Ask:* "When the Highest Scorer took over as Judge, were they interpreting the rules or replacing them?"
      *   *Point:* Rule 10 allowed a Judge change, but not a change in *what binds the Judge*. When the Judge ignored Rule 7 to award points, they didn't amend the constitution; they performed a **revolution**. They stepped outside the system to change the system. This is the difference between legal change (within the frame) and political founding (setting the frame).

  3.  **Inconsistency vs. Incompleteness (The Freeze):**
      *   *Ask:* "Why did the game stop? Was it because the rules contradicted (inconsistent) or because there was no rule for the situation (incomplete)?"
      *   *Point:* It was both. Rule 3 and 7 were inconsistent. But the *crisis* happened because the system was incomplete: there was no meta-rule for what happens when the Adjudicator is disputed. Law tries to be complete; this game proved it cannot be.

  4.  **Formalism vs. Intolerable Results:**
      *   *Ask:* "If the Highest Scorer followed Rule 11 (Finality) but violated Rule 7, should we have accepted the result?"
      *   *Point:* A procedurally perfect move can produce a substantively broken game. This mirrors the tension between **Rule of Law** (procedure) and **Justice** (outcome). If you followed the procedure to destroy the game, was it legal?

  ## Part 5: Failure Modes & Facilitator Instructions

  **Failure Mode 1: The "This is Stupid" Revolt.**
  *   *Symptom:* A participant says, "We're just going to ignore Rule 7 and split the points," immediately.
  *   *Diagnosis:* They are treating the game as a cooperative puzzle, not a binding system.
  *   *Fix:* You must be the "Hard Positivist." Insist: "Rule 7 says it cannot be amended. If you do it anyway, I will not record the points." You must enforce the fiction until they break it themselves. If they refuse to play by the rules, the session becomes a discussion about *why* they refused. That is also data.
  *   *Instruction:* Do not smile. Do not wink. You are the State.

  **Failure Mode 2: The Facilitator Deus Ex Machina.**
  *   *Symptom:* You feel the tension rising and you say, "Okay, let's just allow it this once to keep things moving."
  *   *Diagnosis:* You are saving them from the paradox. You are cheating the lesson.
  *   *Fix:* Let it break. If they ask you to resolve it, say: "My authority comes from Rule 9. If you challenge that, I have no power." **You must be willing to let the game die.** If the game ends in chaos, the lesson is stronger.

  **Failure Mode 3: The Quiet Consensus.**
  *   *Symptom:* They silently agree to ignore the contradiction and keep playing without addressing it.
  *   *Diagnosis:* They have created a "Shadow Constitution."
  *   *Fix:* Interrupt at minute 70. Ask: "Is Rule 7 currently in force? Yes or No?" Force them to articulate the status of the rule they are ignoring.

  **If Someone Declares the Whole Thing Void:**
  *   If a player stands up and says, "These rules are incoherent, I'm leaving," **let them.**
  *   *Do not:* Beg them to stay.
  *   *Do:* Note the time they left. In the debrief, ask: "At what point did the obligation to obey cease? Was it when the rules became contradictory, or when the enforcement mechanism failed?" This mirrors the citizen's right to resist unlawful authority.

  ## Part 6: Honesty About Authority (Constraint 9)

  You are right to be suspicious. A game cannot reproduce the **coercive monopoly** of the state. In this room, if a player refuses to accept the Judge's ruling, you cannot imprison them. You can only take away the chocolate bar.

  **However, this limitation is actually the feature, not the bug.**
  Because there is no police force, the **only** thing holding the game together is the participants' mutual recognition of the rules. This strips away the distraction of violence and reveals the normative core of law.
  *   **What the game reproduces:** The *internality* of the legal point of view. When they argue about Rule 7, they are not arguing about physics; they are arguing about *obligation*. They feel the "ought."
  *   **What you must supply:** You must supply the **seriousness**. If you treat the prize as a joke, they will treat the rules as a joke. You must treat the Constitution of the Table with the same gravity a judge treats a statute. Your demeanor supplies the "felt authority" that the mechanics cannot.

  **Why I kept your constraints:**
  You asked for specific pressure points and a specific ending. I did not offer variants because variability dilutes the trap. If you let them choose the voting threshold, they won't feel the constraint of Rule 3. If you let them decide the prize beforehand, the stakes aren't immediate. The rigidity of the design forces the flexibility of their interpretation, which is exactly where the philosophy lives.

  **Final Instruction:**
  When the 90 minutes are up, if the rules have collapsed, look at the prize. Look at the group. Say: "The rules no longer determine who gets this." Put the prize away. End the session. The absence of the prize is the final proof of the argument.
