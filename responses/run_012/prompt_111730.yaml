answer: |-
  Here is a sequence of five question-and-follow-up pairs (ten questions total) designed to cover the required thematic ground. I have included "Instructor's Notes" for each block to clarify the state of the debate (settled vs. contested) as you requested.

  ### Block 1: The Criteria for Non-Functional Deposition
  **Instructor's Note:** The distinction between "structured deposition" and "waste" is a dominant framework in European prehistory (largely due to Richard Bradley), but it is **contested**. Processual archaeologists and taphonomists argue that "completeness" is often a result of differential preservation or curation bias, not intent. There is no settled consensus on an independent marker for "ritual" versus "refuse."

  **Question 1:**
  "You argue that completeness and location at thresholds distinguish these deposits from ordinary waste. However, abandonment, caching, and storage loss can also leave complete objects in odd places. What independent criterion, outside of the depositional pattern itself, allows you to separate your 'reserved' objects from a cache that was simply never retrieved?"

  **Likely Reply:**
  "She will likely argue that it is the *combination* of factors: the specific association with boundaries, the lack of wear on the objects, and the fact that they are often broken or bent *in situ* in ways that preclude future use, which caching does not explain."

  **Question 2 (Follow-up):**
  "If wear and breakage are the key, how do you distinguish a ritually 'killed' object from one that was broken during the act of backfilling a pit that was simply meant for trash? What specific stratigraphic evidence would you accept as proof that a given pit was merely backfill rather than a structured deposit?"

  ***

  ### Block 2: Formation Processes and Taphonomy
  **Instructor's Note:** Formation processes (how sites become what they are) are **settled** as a fundamental concern in archaeology (following Michael Schiffer). However, the ability to distinguish "deliberate arrangement" from "post-depositional sorting" (e.g., water sorting, animal disturbance) in complex pits is **contested**. Micromorphology is the standard tool, but interpretation remains subjective.

  **Question 3:**
  "Moving to formation processes: you describe these as deliberately arranged assemblages. How do you rule out that this pattern was produced by a single rapid burial event—like a house collapse—rather than a sequence of deliberate acts? How do you distinguish a 'deliberate arrangement' from one that only looks arranged after natural accumulation?"

  **Likely Reply:**
  "She will likely point to micromorphological analysis and stratigraphy, noting that the deposits show distinct lenses or fills that indicate multiple episodes of opening and closing, rather than a single catastrophic event."

  **Question 4 (Follow-up):**
  "Even with multiple episodes, natural processes can sort materials by size and weight over time. If a colleague demonstrated that the 'arrangement' you identify could be replicated by water sorting or bioturbation in a control experiment, would that invalidate the interpretation of intent, or would you argue the *selection* of materials prior to deposition still holds?"

  ***

  ### Block 3: The Warrant for Ethnographic Analogy
  **Instructor's Note:** The role of analogy is **contested**. Alison Wylie's work is standard here: analogy is unavoidable but requires critical scrutiny. Whether analogy generates hypotheses (heuristics) or provides evidential weight (warrant) is a major theoretical divide. There is no consensus on when an analogy is "strong" enough to support an inference.

  **Question 5:**
  "You are forthright that you reason by analogy from better-documented societies. Does this analogy function primarily to generate hypotheses that the material then tests independently, or is the analogy doing evidential work on its own? In other words, if the material pattern is ambiguous, does the ethnography tip the scale?"

  **Likely Reply:**
  "She will likely say it is a heuristic device: it suggests where to look, but the material pattern must stand on its own. She will claim the analogy provides a 'plausibility structure' rather than direct proof."

  **Question 6 (Follow-up):**
  "If it is only a heuristic, what would count as a case where the analogy fails—for instance, if a documented society places sacred objects in domestic middens—but the material pattern at your site still supports your reading? If the analogy can be wrong without damaging the conclusion, is it actually constraining your interpretation at all?"

  ***

  ### Block 4: Belief, Practice, and Institutions
  **Instructor's Note:** The relationship between "practice" (what people do) and "belief" (what people think) is **highly contested**. Practice theorists (e.g., Bourdieu, applied to archaeology by Barrett) argue we should stick to practice. Cognitive archaeologists argue we can infer belief. Inferring "institutions" or "specialists" from material patterns alone is **speculative** and generally considered a high inferential leap without settlement hierarchy data.

  **Question 7:**
  "You state you are inferring practice and only cautiously inferring belief. If you are content to describe recurrent practice without attributing mental content, what does the 'sacred-and-profane' framing add that a description of the practice alone would not? Is the belief claim doing any explanatory work, or is it merely decorative?"

  **Likely Reply:**
  "She will likely argue that the 'sacred' framing explains the *cost* involved. Why expend resources on objects removed from use? Only a belief system regarding the efficacy or obligation of the act explains the economic inefficiency of the practice."

  **Question 8 (Follow-up):**
  "If the cost implies authority, can you get from this pattern of deposition to something like a specialist role or a group with authority over the practice? What in the material record licenses that step to social hierarchy, rather than merely permitting a scenario where any household head could perform the same deposit?"

  ***

  ### Block 5: The Pressure Test and Falsifiability
  **Instructor's Note:** Falsifiability in interpretive archaeology is **contested**. Many post-processualists argue their frameworks are "ways of seeing" rather than scientific hypotheses, making them hard to falsify. The "textual contradiction" scenario is a classic philosophical pressure test (underdetermination of theory by data). There is no consensus on how to handle contradictory data from different epistemic traditions (text vs. material).

  **Question 9:**
  "Suppose a colleague working at a different site reports the exact same depositional signature—complete objects in thresholds—but also has textual evidence showing those deposits were made for entirely mundane reasons, such as securing a door frame against rot. Does that defeat your inference at their site, does it cast doubt on your site, or does it leave both intact, and why?"

  **Likely Reply:**
  "She will likely argue for context specificity: the texts at the second site constrain interpretation there, but the lack of texts at her site leaves the material open to her reading. She may argue that 'mundane' magic is still a form of ritual distinction, blurring the line."

  **Question 10 (Follow-up):**
  "If the same material signature can support both a ritual and a mundane reading depending on the presence of texts, what specific finding would falsify your interpretation at your own site? I ask this so you cannot retreat to the position that this framework is simply a 'way of seeing' that remains valid regardless of the outcome."

  ***

  ### Chairing Advice for the Student
  *   **On Tone:** These questions are sharp but respectful. They assume the speaker is competent but press the logical limits of her argument. This is appropriate for a Method and Theory seminar.
  *   **On the "Contested" Notes:** If the speaker tries to claim her method is "standard archaeology," you can gently interject during the transition between questions: *"I ask because my reading of the literature suggests this is still a point of debate regarding taphonomy/analogy..."*
  *   **On Time:** If you are running short on time, prioritize Block 1 (Criteria), Block 3 (Analogy), and Block 5 (Falsifiability). These are the theoretical pillars of her argument.
  *   **On the "Belief" Question:** Be prepared for her to pivot to "ontology." If she says, "We shouldn't separate belief and practice," your follow-up (Question 8) is designed to catch that by asking about the *social cost* of the practice.
