answer: |-
  This is not a weird thing to ask. It is, in fact, the exact kind of thing fiction is for. You are standing in the gap between *what is said* and *what is meant*, which is where all the interesting human tension lives.

  Your editor is right: the scene doesn't land because you are writing it as a resolution, but your intuition knows it is a suspension.

  Here is the vocabulary for the "sort of," and an analysis of what actually happened at that diner, broken down by the mechanics of language, the sociology of the family, and the architecture of your scene.

  ### 1. The Linguistic Reality: The "Misfire"
  The philosopher J.L. Austin coined the term **performative utterance**. These are sentences that *do* something rather than just describe something (e.g., "I pronounce you husband and wife," "I bet you five dollars," "I apologize").

  For a performative utterance to be successful, certain "felicity conditions" must be met. The person speaking must have the authority, the intent, and the emotional capacity to enact the change.

  When your brother said "I forgive you" without the intent, while checking his watch and reaching for his wallet, the speech act **misfired**.
  *   **The Verdict:** Linguistically, the words exist. Metaphysically, the act did not occur.
  *   **The Vocabulary:** Call it a **Hollow Performative**. It has the shape of forgiveness, but none of the mass. It is a prop, not a tool.

  ### 2. The Somatic Reality: The Control Variable
  You mentioned your wife said the same words recently, and they landed differently. This is your control variable. It proves your intuition is calibrated correctly.

  Real forgiveness is somatic. It changes the air pressure in the room. It relaxes the vagus nerve. When your wife said it, your body received the signal. When your brother said it, your body registered a threat (the jaw clench, the desire to flee).

  *   **The Verdict:** Your body is a more honest witness than your ears.
  *   **The Vocabulary:** **Somatic Dissonance**. The mind hears "peace," the gut hears "danger."

  ### 3. The Social Reality: Ratification
  This is the tricky part. Your sister announced the reconciliation. The family accepted it. The brother plays along.

  In sociology, there is a concept called **The Thomas Theorem**: *If men define situations as real, they are real in their consequences.*

  By treating you as reconciled, the family has created a **Social Fact**. Even if the internal emotional truth is false, the external relational truth is now "reconciled." You are expected to act the part. Your brother is expected to act the part. This creates a **Script**.

  *   **Can he take it back?** Yes. A social contract is only as strong as the enforcement. If he blows up at you next Christmas, the social fact shatters, and the diner moment is retroactively reclassified as "the lie." Until then, you are in a state of **Performative Compliance**. You are both acting out a play called *The Reconciliation* for an audience of relatives.
  *   **The Vocabulary:** **Consensual Hallucination**. Everyone agrees to pretend the wound is closed so the holiday isn't ruined.

  ### 4. The Distinction: Forgiveness vs. Armistice
  This is likely the key to fixing your book scene. You are writing a scene about *forgiveness*, but what happened at the diner was an *armistice*.

  *   **Forgiveness** is internal and transformative. It releases the debt.
  *   **Reconciliation** is relational and requires two people.
  *   **Armistice** is a cessation of hostilities for practical purposes.

  Your brother didn't forgive you. He declared a ceasefire. He decided the cost of the war (four years of silence) was higher than the cost of the dinner check. He bought peace; he didn't build it.

  *   **The Vocabulary:** **Transactional Truce**. It was a business decision, not an emotional one.

  ### So, did something happen?
  Yes. But it wasn't forgiveness. It was a **renegotiation of terms**.

  Before the diner, the terms were: *We do not speak.*
  After the diner, the terms are: *We speak, but we do not discuss the wound. We perform civility.*

  The "Sort Of" you are looking for is this: **The conflict moved from the overt to the covert.** Before, the silence was the tension. Now, the politeness is the tension. The war didn't end; it went underground.

  ### How to fix the scene in your book
  Your editor says it "doesn't land" because the character likely reacts with relief, or the narrative voice treats it as a climax. But if you apply the vocabulary above, the scene becomes much more interesting.

  1.  **Focus on the Gap:** Don't write the words "I forgive you." Write the space between the words and the jaw clench. Write the sound of the wallet coming out.
  2.  **The Somatic Betrayal:** Have your protagonist feel the lack of it. "The words arrived, but my shoulders didn't drop."
  3.  **The Audience:** If there's a "sister" character in the book, show her seizing on the words immediately, solidifying the narrative before the brothers have even stood up from the booth. Show the trap snapping shut.
  4.  **The Ending Beat:** Do not end the scene with a hug. End it with the check being paid. That is the truth of the moment. He paid the bill. That was the transaction.

  ### Summary Vocabulary for your Toolkit
  *   **Infelicitous Speech Act:** Words spoken without the conditions to make them true.
  *   **Somatic Dissonance:** When the body rejects what the ears hear.
  *   **Performative Compliance:** Acting out a role to satisfy social expectations.
  *   **Transactional Truce:** Peace bought for convenience, not earned through resolution.
  *   **Social Ratification:** When a community validates a lie until it becomes a functional truth.

  You are not crazy. You are noticing that **truth is layered**. There is the truth of the heart (nothing happened), and the truth of the tribe (everything is fixed). Living in the friction between those two truths is exactly where a novelist should be. It's uncomfortable, but it's fertile ground.

  Write the friction. Don't write the resolution.
