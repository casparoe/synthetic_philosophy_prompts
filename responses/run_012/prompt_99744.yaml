answer: |-
  1. This is a hybrid dispute involving verbal definitions, explanatory goals, and conflicting views on whether introspection yields acquaintance with reality or mere representation.
  2. Illusionists reinterpret the datum by arguing that the seeming of experience is a functional state, while realists claim this denies the very phenomenon that needs explaining.
  3. Progress depends on establishing a rule for counting first-person evidence by deciding whether seemings are incorrigible facts or fallible reports subject to error.
  4. A concrete advance would be an empirical result demonstrating specific metacognitive errors where the brain misidentifies functional processes as qualitative feels.
  5. Alternatively, proving that the concept of ineffable intrinsic properties is logically incoherent would show the question is ill-posed and force a revision of the realist's framework.
