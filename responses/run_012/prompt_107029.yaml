      *   **Task:** Evaluate five specific moves in the debate (Wasp Claim, Cue/Representation Reply, Flexibility/Line Point, Thermostat Comeback, Truth of Story Point).
      *   **Rating:** Rate each move from "clearly mistaken" to "clearly right" with justification.
