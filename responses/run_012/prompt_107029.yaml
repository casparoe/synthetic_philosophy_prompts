      *   *Re-evaluating Move 4 (Thermostat):* Jonah's point is that there is a *functional* difference. Maya says it's a continuum. Jonah is right that a thermostat lacks *representational* states. Maya is right that it's still input-output. I'll rate this as a draw or slight edge to Jonah for identifying representation.
      *   *Re-evaluating Move 5 (Truth of Story):* Jonah is definitely right here. Philosophy often uses idealized cases.

