          *   *Philosophical Weight:* Jonah is right about the function of thought experiments (Twin Earth, Chinese Room, etc. don't need to be physically real). Maya is right that empirical accuracy matters if claiming biological proof. But since the argument is about *principles*, Jonah has the stronger philosophical footing here.
          *   *Rating:* Jonah is "Right" on methodology. Maya is "Right" on empirics but "Mistaken" on the implication for the argument. Jonah wins this round.

  3.  **Determine the Overall Winner:**
