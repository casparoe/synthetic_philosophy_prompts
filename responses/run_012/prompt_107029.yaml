  2.  **Deconstruct the Debate Moves:**

      *   **Move 1: Maya's Wasp Claim (The *Sphex* Loop).**
          *   *Claim:* The wasp repeats the check/drag loop indefinitely if the cricket is moved. This proves "nobody's home" (no free will/consciousness), just a buggy subroutine. Humans are the same, just longer loops. "Sphexishness" is a real philosophical term.
          *   *Fact Check:* The *Sphex* story is famous (Douglas Hofstadter popularized it in *Gödel, Escher, Bach*). The term "sphexishness" is indeed used in philosophy of mind (Dennett uses it). However, the ethology is exaggerated. Wasps don't loop *indefinitely*; they usually give up after a few times.
          *   *Philosophical Weight:* It's a strong intuition pump for determinism/behaviorism, but equating human cognition directly to this specific instinctual loop is a reductionist leap.
          *   *Rating:* Mostly Right on the philosophy/terminology, Factually Exaggerated on the biology. Let's call it "Partially Right / Exaggerated."

      *   **Move 2: Jonah's "Cue She Doesn't Represent" Reply.**
          *   *Claim:* Looping doesn't prove no "self." It proves the cue isn't represented cognitively. Humans loop too (OCD/checking locks), but we attribute that to anxiety, not lack of agency. The key is whether a process exists to *notice* and *change* the loop from the inside.
          *   *Philosophical Weight:* This aligns with compatibilist views (Dennett again). Distinguishing between *capacity* for reflection vs. *actual* reflection. The OCD analogy is strong.
          *   *Rating:* Strong philosophical point. "Mostly Right."

      *   **Move 3: Maya's "No Line for Flexibility" Point.**
          *   *Claim:* "Flexibility" is vague (like "ruinous" in insurance). Everything is flexible to some perturbations and rigid to others. Distinguishing humans vs. wasps based on this is just cherry-picking perturbations that flatter humans.
          *   *Philosophical Weight:* This is a Sorites Paradox / Continuum argument. It's a valid critique of dualistic thinking. There *is* a continuum of cognitive complexity. However, denying *any* relevant difference because the line is fuzzy is a fallacy (fallacy of the beard).
          *   *Rating:* Philosophically sharp, but potentially nihilistic. "Mostly Right" on the continuum, "Mistaken" if implying no *relevant* difference exists. Let's lean "Mostly Right" because it exposes the arbitrariness of the boundary.

      *   **Move 4: Jonah's Thermostat Comeback.**
          *   *Claim:* There is an obvious difference between adapting to an undetectable cue and deliberating. If Maya can't tell a thermostat from a person, she's lost the plot.
