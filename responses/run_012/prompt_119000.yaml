answer: |-
  ### The objections, in the order I will get them

  1. **The Textualist:** "You've reduced notice and predictability to a matter of literary taste. If the 'implied reader' is a construct, doesn't that invite judges to construct whichever reader yields their preferred policy outcome? You haven't solved the discretion problem; you've renamed it. We need fixed meaning for citizens relying on the law, not a hermeneutic circle where the judge decides who is reading."

  **Reply:** "The 'implied reader' isn't a blank slate; it's the specific competency the text demands. When a statute uses technical terms, it constructs an expert reader; when it uses plain language, a lay reader. Textualists already do this—they just claim the reader is 'neutral.' Acknowledging the construction makes constraints visible, not removable. You rely on linguistic conventions; I note those conventions are genre-specific. The constraint comes from the public nature of the genre, not the invisibility of the reader. This aligns with your own reliance on the 'ordinary observer' standard, which is itself a construct."

  **Soft Spot:** Assumes linguistic conventions are stable enough to constrain effectively across diverse contexts, potentially undermining the predictability you prize.

  2. **The Intent Scholar:** "A legislature is a 'they,' not an 'it.' Your 'implied author' implies a unity of purpose that doesn't exist. It sanitizes the political compromise and logrolling that actually created the statute. Isn't this just judicial fiction masking as theory? You're asking judges to pretend the legislature had a mind when it was actually a battlefield of interests."

  **Reply:** "All interpretation requires assuming coherence. If you treat the statute as a ragbag of conflicting intents, it ceases to be law. The 'implied author' is the necessary fiction that allows us to treat the compromise as a single directive. Purposivists do this when they ignore contradictory history to find a 'dominant purpose.' I'm just admitting the constructive nature of that move. It's not about pretending there was a mind, but constructing one to make the text operative. This preserves legislative supremacy by treating the output as coherent law rather than fragmented deals."

  **Soft Spot:** Risks justifying ignoring actual historical evidence of conflict in favor of judicial coherence, potentially undermining democracy by erasing political loss.

  3. **The Humanist:** "If textualism and purposivism are just different 'reader roles,' you've collapsed the normative distinction. Why should we train judges to be textualists if it's just a preference? Doesn't this license anything? I worry you're giving us vocabulary without a verdict. We need to know which reading is *right*, not just that there are multiple readers."

  **Reply:** "It licenses nothing; it clarifies the choice. The dispute isn't about *what meaning is*, but *what law is for*. If you value notice, train the textualist reader. If you value equity, train the purposivist. My theory doesn't choose for you; it reveals that your choice is political, not semantic. That's not relativism; it's honesty. We stop pretending the text dictates the method and admit the method dictates the reading. The normative work happens in selecting the judicial role, not in parsing the text."

  **Soft Spot:** Offers no metric for deciding which value prevails in hard cases, leaving the judge without a tiebreaker when values conflict.

  ### What I should concede before anyone asks

  I must concede that law carries coercive power literature lacks. A misread poem hurts feelings; a misread statute jails people. I should also concede that "implied author" can be manipulative. If I argue that purposivists construct an author, I must admit judges can construct a villain. I need to acknowledge that my literary lens might obscure the high stakes of legal error. I will concede that narratology describes the *process* but cannot justify the *power*. The stakes of interpretation are not aesthetic but bodily. I cannot claim that because all reading is constructive, all constructions are equal. The law's violence demands a higher burden of justification than a novel does. I concede my framework is descriptive, not a shield against bad faith. I also concede that 'genre' in law is more rigid than in literature. Statutes cannot be read as open-endedly as poems. The constraints of the legal genre are tighter, and I must respect that rigidity.

  ### The softest point in my own position

  The softest point is the move from description to normativity. I can show that judges *are* constructing readers, but I cannot prove they *should* construct one type over another. My theory explains the mechanism of interpretation but remains silent on the justice of the outcome. If a textualist reading produces absurdity, my model says "that's the chosen reader," not "that's wrong." I risk validating unjust outcomes by calling them "genre conventions." I have no internal compass for justice. My framework tells you how the machine works, but not whether it should be running. This leaves me vulnerable to the charge that I am neutralizing moral responsibility under the guise of literary analysis. I cannot answer why we should prefer liberty over order using only narratological tools. That requires political philosophy, not poetics.

  ### The question I am hoping nobody asks

  "Why should we listen to a novelist?" They will ask why literary theory, which lacks accountability, should guide law, which demands it. They worry I'm importing ambiguity into a system designed for resolution. I fear they'll say I'm playing with toys they use to build prisons. They will ask if I understand that people lose freedom based on these readings. They want to know if I take the stakes seriously.
