      The distinction between explanatory virtues and probability is where the film wavers. Philosophers distinguish "loveliness" (explanatory power) from "likeliness" (probability). The film conflates them. Juror 8's alternatives are often low-probability coincidences (finding an identical knife). Yet, because they possess explanatory virtue (they resolve contradictions), they are treated as sufficiently probable to acquit. The film lets the persuasive loveliness of the doubt narrative stand for truth. It suggests that if a story *can* explain the evidence, it *might* be true, which is legally sufficient but philosophically loose.

