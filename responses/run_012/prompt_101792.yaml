prompt: |-
  I am the technology director for a mid-sized public school district — roughly nine thousand students, forty-odd buildings — and I am the person who signs off, or refuses to sign off, whenever a school wants to adopt a piece of software that touches student data. This comes up maybe twice a month, sometimes more, and the stakes are real: these tools run on children's information, the district is small enough that a bad headline would end careers, and I have no legal training and no budget to hire anyone who does. The superintendent signs the final contract, but nothing moves without my recommendation, and I usually have a week or less to produce one.

  I have been trying to find a way to make these calls that isn't just asking whether the data is sensitive, because that test gives me the wrong answer constantly. What I have landed on, after a lot of reading and arguing with colleagues, is this: privacy is not mainly about keeping facts secret. It is about whether a particular flow of information — from some party, about some aspect of a person, to some other party, under some rule governing how it moves — matches what people would reasonably expect in the setting where it happens. The same fact can be unremarkable in one setting and a betrayal in another. So the real question is never whether the data is sensitive; it is whether this flow fits this setting, and who set the expectation in the first place.

  I want you to turn that into a procedure I can actually run. Specifically: a fixed list of questions in the order I should ask them, with a note on each about what would count as a sufficient answer and what would count as a dealbreaker; the point at which the procedure stops and returns a no; and the points where it stops and hands the decision to a person — me, the superintendent, the parents — because the question is one of values rather than facts. Keep it short enough that I can run it in an afternoon and write the result up in a paragraph for the superintendent, and make it honest about which of its steps are just my judgment dressed up as method.

  Then run the procedure on three cases and show the reasoning at each step:

  1. A reading-comprehension app that the special-education teachers love and that has visibly helped struggling readers, but whose vendor collects keystroke-level data on every answer, keeps it indefinitely, and uses it to train models sold to other districts.
  2. A request from the district's school resource officers for routine access to the discipline and attendance records of students on their watch, which the principals are inclined to grant because it is easier than saying no.
  3. A tool that would let parents see, in real time, the location of the bus their child is riding — requested by a parents' group after a scare last spring.

  Case 1 is the one where I suspect the procedure is going to tell me to say no to something I badly want to say yes to, and I want that worked through rather than softened. Finally, tell me plainly what this procedure cannot do and where it will misfire — including what happens when the setting's own norms are unsettled or openly contested, and when a single person sits in two settings at once, as a student who is also a patient. If the way I have framed this leaves some of these calls genuinely undecidable rather than merely hard, say so, and say which part of the framing is doing that.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Technology Director for a mid-sized public school district (9,000 students, 40+ buildings).
      *   **Responsibility:** Gatekeeper for software adoption involving student data. No legal training, no budget for counsel. High stakes (career risk, student privacy).
      *   **Philosophy:** Privacy is about "contextual integrity" (information flows matching reasonable expectations within a setting), not just data sensitivity.
      *   **Task:**
          1.  Create a fixed procedural checklist based on this philosophy.
          2.  Include criteria for sufficient answers vs. dealbreakers.
          3.  Identify stop points (No) vs. handoff points (Human Judgment).
          4.  Keep it concise (afternoon run-time, paragraph summary).
          5.  Be honest about where judgment disguises itself as method.
          6.  Run the procedure on three specific cases (Reading App, SRO Access, Bus Tracking).
          7.  Specifically address the tension in Case 1 (benefit vs. privacy violation).
          8.  Critique the procedure itself (limitations, unsettled norms, dual roles, undecidability).

  2.  **Deconstruct the Philosophy (Contextual Integrity):**
      *   The user's description aligns closely with Helen Nissenbaum's theory of *Contextual Integrity*.
      *   Key components: Actors (Sender, Subject, Recipient), Attributes (Data types), Transmission Principles (Constraints/Conditions).
      *   The core test: Does this new flow violate entrenched norms of the specific context (the school)?

  3.  **Drafting the Procedure (The "Contextual Flow Audit"):**
      *   *Goal:* actionable, sequential, decisive.
      *   *Step 1: Define the Setting & Norms.* What is the school supposed to be? What do parents expect?
      *   *Step 2: Map the Flow.* Who sends what to whom under what conditions?
      *   *Step 3: Compare to Baseline.* Is this new? Does it change the recipient or the constraint?
      *   *Step 4: Assess Benefit vs. Breach.* If it breaches norms, is the benefit compelling enough to reset norms? (This is the value judgment).
      *   *Step 5: Consent/Notification.* Can the subjects (parents/students) opt-out or know?
      *   *Structure:* Needs clear "Stop/No" and "Handoff" markers.

  4.  **Refining the Procedure (Iterative Polish):**
      *   *Constraint:* Must be short enough for an afternoon.
      *   *Honesty:* Acknowledge where *I* (the Director) am deciding what is "reasonable."
      *   *Drafting the Steps:*
          1.  **Identify the Setting:** What is the educational purpose?
          2.  **Map the Flow:** Sender, Data, Recipient, Constraint.
          3.  **Check Entrenched Norms:** Is this how schools usually work?
          4.  **Evaluate the Breach:** If it violates norms, is there a compelling interest?
          5.  **Decision Point:** Approve, Reject, or Escalate.

  5.  **Running the Cases:**

      *   **Case 1 (Reading App):**
          *   *Flow:* Student -> Vendor (Keystrokes) -> Vendor's Models -> Other Districts.
          *   *Norm:* School data stays in school for *this* student's benefit.
          *   *Breach:* Using data for external commercial gain/training is a violation of the educational setting.
          *   *Conflict:* High educational benefit vs. High privacy breach.
          *   *Outcome:* Procedure says No (unless norms are renegotiated). User wants to say Yes. I need to show *why* the procedure says No and where the tension lies.

      *   **Case 2 (SRO Access):**
          *   *Flow:* School Admin -> SRO (Police) -> Discipline/Attendance.
          *   *Norm:* Discipline is for educational correction, not law enforcement pre-emption.
          *   *Breach:* Turning educators into intelligence gatherers for police.
          *   *Outcome:* Likely No/Handoff. This criminalizes the school setting.

      *   **Case 3 (Bus Tracking):**
          *   *Flow:* Bus GPS -> Parents.
          *   *Norm:* Safety/Logistics. Parents expect to know where kids are during transit.
          *   *Breach:* Minimal. Recipient (Parent) is expected.
          *   *Outcome:* Yes, with minor caveats (security of the app).

  6.  **Critiquing the Procedure (The "Honesty" Section):**
      *   *Limitations:* It relies on "reasonable expectations," which are vague.
      *   *Unsettled Norms:* Tech moves faster than norms.
      *   *Dual Roles:* Student vs. Patient (FERPA vs. HIPAA overlap).
      *   *Undecidability:* When benefits and breaches are both high (Case 1), the procedure doesn't solve the value conflict; it just highlights it. The user's framing admits this, but I need to be explicit.

  7.  **Final Review against Constraints:**
      *   *Tone:* Professional, direct, empathetic to the burden.
      *   *Format:* Checklist, Case Studies, Critique.
      *   *Specific Instruction:* "Tell me plainly what this procedure cannot do."

  8.  **Drafting the Content (Mental or Scratchpad):**
      *   *Procedure Name:* The Contextual Flow Audit.
      *   *Steps:* 1. Purpose, 2. Flow Map, 3. Norm Check, 4. Redistribution Check, 5. The "Reset" Question.
      *   *Case 1:* Highlight the "Secondary Use" trap.
      *   *Case 2:* Highlight the "Mission Creep" trap.
      *   *Case 3:* Highlight the "Service Expectation" alignment.
      *   *Critique:* Focus on the "Who defines reasonable?" problem.

  9.  **Refining the Output (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't give legal advice. Frame it as risk management based on their philosophy.
      *   *Correction:* Ensure Case 1 doesn't get "softened." If the procedure says No, state No.
      *   *Correction:* Ensure the "Handoff" points are clear. When does it go to the Superintendent? When does it go to Parents?
      *   *Refinement on Philosophy:* The user mentioned "who set the expectation." I need to include a step about *authority*. Who decided this norm exists?

  10. **Final Polish:** Check word count and clarity. Ensure the distinction between "Fact" and "Value" is sharp. (Proceed to generate response).

  *(Self-Correction Note during final review)*: The prompt asks for a "fixed list of questions in the order I should ask them." I need to make sure the procedure looks like a checklist, not just an essay. I also need to make sure I explicitly answer the "undecidable" part of the prompt at the end.

  *(Final Plan)*:
  1. Introduction acknowledging the burden.
  2. The Procedure (The Contextual Flow Audit).
  3. The Three Cases (Applied).
  4. The Limitations (The Critique).
  5. Closing on the "Undecidable" question.cw
answer: |-
  This procedure is based on the theory of **Contextual Integrity**. It treats privacy not as secrecy, but as the appropriate flow of information according to the norms of a specific social setting (the school).

  ### The Contextual Flow Audit

  **Time required:** 2–4 hours per vendor/request.
  **Output:** A one-paragraph recommendation for the Superintendent.

  **Step 1: Define the Educational Setting and Purpose**
  *   **Question:** What is the specific educational problem this tool solves, and what role does the data play in solving it?
  *   **Sufficient Answer:** "This tool provides X intervention for Y students; data is required to measure Z outcome."
  *   **Dealbreaker:** Vague purpose ("engagement," "analytics") or data collection unrelated to the stated educational goal.
  *   **Stop Point:** If the purpose is not educational, **STOP. Recommendation: No.**

  **Step 2: Map the Information Flow**
  *   **Question:** Who sends the data, what exactly is sent, who receives it, and under what constraint?
  *   **Sufficient Answer:** Sender (Student/Teacher) → Attribute (Keystrokes/Grades) → Recipient (Vendor/Police/Parent) → Transmission Principle (For instruction only/Indefinite retention).
  *   **Dealbreaker:** Vendor cannot articulate the flow or claims ownership of the data.
  *   **Note:** This is fact-finding. If the vendor lies here, the contract is voidable later.

  **Step 3: Check Against Entrenched Norms**
  *   **Question:** Does this flow match what parents and students reasonably expect to happen in a public school?
  *   **Sufficient Answer:** "Yes, this is how report cards/workbooks/bus rides have always worked."
  *   **Dealbreaker:** The recipient is a commercial third party, law enforcement, or the public, unless explicitly standard (e.g., cloud storage).
  *   **Judgment Call:** *You* decide what is "reasonable." This is where your bias enters. Document why you think the expectation exists.

  **Step 4: Identify Secondary Flows (The Redistribution Test)**
  *   **Question:** Does the recipient keep the data, sell it, aggregate it, or use it for purposes other than the immediate educational transaction?
  *   **Sufficient Answer:** "Data is deleted after contract termination; used only for this district."
  *   **Dealbreaker:** "We use data to train models," "We share with partners," or "Indefinite retention for product improvement."
  *   **Stop Point:** If secondary use exists and is commercial or external, **STOP. Recommendation: No** (unless Step 5 is triggered).

  **Step 5: The Norm-Reset Question (Value Judgment)**
  *   **Question:** The flow violates entrenched norms (Step 3 or 4). Is the educational benefit so compelling that we should *change* the norm?
  *   **Sufficient Answer:** "This tool is the only viable intervention for disabled students; the benefit outweighs the privacy risk."
  *   **Dealbreaker:** "It's convenient," or "Other districts are doing it."
  *   **Handoff Point:** If you answer **Yes**, you cannot decide this alone. **HANDOFF to Superintendent and School Board.** This is a policy change, not a tech decision. If you answer **No**, **Recommendation: No.**

  **Step 6: Consent and Transparency**
  *   **Question:** Can parents opt out or see the data?
  *   **Sufficient Answer:** "Yes, opt-out available," or "Data is directory information."
  *   **Dealbreaker:** "No opt-out," or "Data is anonymized so we don't need consent" (when it isn't truly anonymous).
  *   **Handoff Point:** If opt-out is impossible but the tool is approved in Step 5, **HANDOFF to Parents** for notification.

  ***

  ### Case Applications

  #### Case 1: The Reading App (Special Education)
  *   **Step 1 (Purpose):** Intervention for struggling readers. **Pass.**
  *   **Step 2 (Flow):** Student → Vendor (Keystrokes) → Vendor Servers. **Pass.**
  *   **Step 3 (Norms):** Schools collect reading data. **Pass.**
  *   **Step 4 (Secondary Flow):** Vendor uses keystrokes to train models sold to other districts. **FAIL.** This violates the norm that student data serves *that* student in *this* district, not a commercial product line.
  *   **Step 5 (Norm-Reset):** Is the benefit compelling enough to normalize selling student cognitive data?
      *   *Reasoning:* The benefit is high (teachers love it, kids improve). However, the breach is fundamental. It turns students into unpaid laborers training a commercial product.
      *   *Decision:* **No.**
      *   *Why:* Even for Special Ed, the district cannot ethically trade student data for vendor profit. If the vendor cannot segregate this district's data from their training set, the cost is too high.
      *   *Summary for Superintendent:* "Reject. While pedagogically effective, the vendor's retention and model-training clauses violate contextual norms by commercializing student cognitive data. This exposes the district to reputational risk and treats students as data sources rather than beneficiaries. Request vendor remove training clause or find alternative."

  #### Case 2: SRO Access to Discipline/Attendance
  *   **Step 1 (Purpose):** "Routine access" for students on their watch. Educational purpose is weak; this is surveillance. **Warning.**
  *   **Step 2 (Flow):** Admin → SRO (Police) → Discipline Records. **Pass (Technically).**
  *   **Step 3 (Norms):** Discipline records are for educational correction, not law enforcement intelligence. **FAIL.** Parents expect discipline to remain within the educational setting unless a crime is committed.
  *   **Step 4 (Secondary Flow):** Police may retain records indefinitely, potentially affecting future criminal records. **FAIL.**
  *   **Step 5 (Norm-Reset):** Is safety compelling enough to turn schools into policing environments?
      *   *Reasoning:* This changes the setting from a school to a precinct. It chills student behavior and trust.
      *   *Decision:* **No.**
      *   *Handoff:* This is a values question regarding the role of police in schools.
      *   *Summary for Superintendent:* "Reject. Routine transfer of discipline data to law enforcement violates the normative boundary between education and policing. This flow suggests pre-emptive surveillance rather than response to specific threats. If this policy is desired, it requires School Board approval and legal review, as it fundamentally alters the school setting."

  #### Case 3: Bus Tracking for Parents
  *   **Step 1 (Purpose):** Safety and logistics during transit. **Pass.**
  *   **Step 2 (Flow):** Bus GPS → Parent. **Pass.**
  *   **Step 3 (Norms):** Parents expect to know where their children are during school-sponsored transport. **Pass.**
  *   **Step 4 (Secondary Flow):** Does the vendor keep location history? (Assume standard logistics retention). **Pass.**
  *   **Step 5 (Norm-Reset):** Not needed; norms align.
  *   **Step 6 (Consent):** Parents opt-in to the app. **Pass.**
  *   **Decision:** **Yes.**
  *   *Summary for Superintendent:* "Approve. This flow aligns with parental expectations regarding safety during transit. Data recipient (parent) is appropriate to the context. Ensure vendor contract limits location retention to active school year."

  ***

  ### What This Procedure Cannot Do

  You asked for honesty about where this method misfires. Here are the four structural failures of this approach:

  **1. It Cannot Resolve "Unsettled Norms"**
  This procedure relies on "reasonable expectations." When technology is new, those expectations do not exist yet. In Case 1, ten years ago, no one expected keystroke logging. Ten years from now, it might be standard. When norms are in flux, Step 3 becomes a guess. You are not discovering the norm; you are *setting* it. The procedure disguises this legislative act as a discovery process.

  **2. It Fails on Dual-Role Subjects**
  You mentioned a student who is also a patient. In a school setting, health data is protected (FERPA/HIPAA overlap). But if a tool monitors mental health via typing patterns (Case 1), is it educational data or medical data? The procedure treats the "Setting" as monolithic. It cannot easily handle when a single data point belongs to two conflicting contexts (Education vs. Healthcare) with different transmission principles. In these cases, the procedure will return a "False Positive" (Approve) because it looks only at the school setting, ignoring the medical norm violation.

  **3. It Makes the "Norm-Reset" a Binary Switch**
  Step 5 asks if the benefit is compelling enough to change the norm. In Case 1, the benefit is *very* high (helping disabled children read), and the violation is *very* high (commercial exploitation). The procedure tells you to say **No**, but it offers no mechanism to capture the moral loss of rejecting the tool. It protects the district's risk profile, but it does not help you weigh the tragedy of denying effective help against the tragedy of exploiting data. It prioritizes privacy integrity over educational utility by default. That is a value judgment, not a fact.

  **4. It Cannot Decide the Undecidable**
  You asked if some calls are genuinely undecidable. **Yes.**
  Case 1 is undecidable by this method.
  *   **The Conflict:** The norm (data stays in school) conflicts with the need (tool requires data to work/improve).
  *   **The Framing Error:** Your framing assumes there is a "correct" flow that matches expectations. But when the only tool that works *requires* a flow that violates expectations, the expectation itself is the barrier to education.
  *   **The Result:** The procedure forces a **No** to protect you, but it cannot tell you if that **No** is morally right. It protects your career (by adhering to privacy norms) but potentially harms the students (by denying the tool).

  **Conclusion:**
  Use this procedure to filter out the clear violations (Case 2) and the clear wins (Case 3). But recognize that for Case 1, the procedure is a shield, not a compass. It will tell you how to avoid a headline, but it will not tell you how to do the right thing when the right thing involves risk. When Step 5 triggers, do not hide behind the checklist. Call the Superintendent and say: *"We have to choose between privacy norms and student outcomes. I can protect the norms, but you have to own the outcome."*
