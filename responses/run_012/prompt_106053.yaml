      *   *Section 3: TNR vs. Euthanasia.* Highlight the asymmetry. Preventing birth is easy to justify negatively. Ending life is hard emotionally. This is the crux of the inconsistency.
      *   *Section 4: Culture vs. Theory.* TNR = Theory. No-Kill = Culture/Branding/Emotion.
      *   *Section 5: The Consistency Check.* If she really believed her theory, she'd have a "mercy killing" protocol. She'd prioritize resource allocation to prevention over life-extension for the miserable.
      *   *Conclusion:* Summarize the tension. She is likely a "practical deontologist" in the shelter and a "theoretical negative utilitarian" in the abstract.

  8.  **Refining the Tone:**

