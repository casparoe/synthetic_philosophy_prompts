  Consider a wild rodent species in which a specific neural activation pattern serves as a hunger signal, tokened during a juvenile learning period. During this critical window, *round berries* (visual input) were perfectly correlated with *sweet juice* (gustatory reward) due to the *summer season* (distal cause), though these three properties are distinct. The producer mechanism (visual-neural pathway) was reinforced via learning to token the state in response to the round shape, while the consumer mechanism (neural-motor pathway) was reinforced to initiate feeding behavior upon the state to secure the sweet juice. The single isolable fact driving the divergence is **the perfect covariation of visual shape and gustatory reward during the critical learning period**. On the producer-side account, the content is *round shape*, as this is what the production mechanism was selected (via learning) to respond to. On the consumer-side account, the content is *sweet juice*, as this is what the consumption mechanism was selected to secure. On the pure informational account, the content is *summer season*, as this is the distal common cause that actually explains the correlation carried by the state when tokened, screening off the proximal triggers and benefits.

  ### Analysis

  **Cultural vs. Genetic Transmission**
  Neither account treats culturally (or learning-) transmitted functions differently from genetically selected ones in principle; both extend the notion of "selection" to include ontogenetic reinforcement histories. This is principled rather than a patch, as the logical structure of explanation (etiological function) remains identical regardless of whether the selection pressure is phylogenetic or ontogenetic. However, this case reveals that learning-based teleosemantics is *more* vulnerable to divergence because learning windows are shorter and correlations more fragile than genetic histories, making the fault line between producer and consumer pressures easier to expose.

  **(a) Deleting the Isolable Fact**
  If we delete the fact of perfect covariation during learning (i.e., shape and sweetness were uncorrelated), the learning reinforcement fails. The producer mechanism is not selected to token the state for shape, and the consumer mechanism is not selected to use it for sweetness. Consequently, both teleosemantic accounts converge on the verdict that the state has **no content** (no function). The informational account, however, still assigns content (*summer season* or *shape*, depending on current correlation), as it relies on current covariance, not history. The case collapses into a standard disagreement between etiological and informational theories, losing the internal teleosemantic divergence.

  **(b) Damage and Reply**
  This case damages the **producer-side account**. Intuitively, the biological point of the hunger signal is to secure nutrition (sweetness), not merely to track shapes; a system that tracks shapes without securing nutrition is malfunctioning, suggesting the consumer's goal determines the content.
  *Strongest Reply:* The defender argues that producer content fixes the *conditions of satisfaction* (truth conditions), while consumer content fixes the *goal*. Without the producer's specific trigger condition, the consumer cannot operate; thus, producer content is primary for determining representation, even if consumer content determines utility.
  *Cost:* The defender must accept that a state can be "accurate" (matches shape) yet biologically useless (no sweetness), severing the tight link between content and biological success that motivates teleosemantics.

  **(c) Counterexample or Indeterminacy**
  This is a **counterexample** to the claim that selection-based theories yield determinate content. It is not merely an illustration of indeterminacy (where we lack evidence to decide); the theories themselves generate conflicting verdicts based on the same fixed history. The structure of the theory allows selection pressures to fragment across the production-consumption arc, yielding two equally valid but incompatible contents.

  **(d) Generalization**
  Producer-side and consumer-side selection pressures must come apart whenever **the learning or selection environment establishes a reliable correlation between a proximal input cue (I) and a distal output benefit (B), mediated by a common cause (C), such that I, B, and C are distinct properties.** Any system where the trigger for production is learned via correlation with a distinct benefit for consumption will generate this tripartite divergence.
