  I am a graduate student in philosophy writing about collective decision procedures, and I am trying to get the Gibbard–Satterthwaite theorem straight from outside the field. A friend sent me a page of lecture notes from a political-economy summer school; the whole of their discussion of the theorem is the paragraph below. I have read it several times and cannot tell how much of it to believe. Here it is, in full:

  Arrow's theorem showed that no voting system can satisfy a short list of reasonable fairness conditions at once. Gibbard and Satterthwaite sharpen this into something more disturbing. Take any voting rule that picks a single winner out of a field of at least three candidates and that satisfies unanimity (if everyone ranks A above B, society does too). Then either the rule is dictatorial — one voter's ranking fixes the whole social ranking — or the rule is manipulable: at every profile of preferences, some voter has a report that gets her a strictly better winner than her honest one. The theorem assumes only ordinal preferences: voters rank the candidates, with no cardinal utilities and no intensities. So strategic voting is not a pathology of any one electoral system but a mathematical certainty, and the fact that voters in real elections vote strategically is a kind of empirical confirmation of the theorem. There are the familiar escape hatches, each of which changes the setting: restrict voters to a structured domain such as single-peaked preferences, where the median-voter rule is strategy-proof and plainly not dictatorial; let voters record intensities rather than rankings, as with approval or score ballots, since the theorem binds only rules that consume ordinal preferences; or introduce cardinal utility and transfers, in which case a Groves mechanism will elicit honest reports in dominant strategies. This is why mechanism design largely gave up on voting and went looking for settings where people have something to trade.

  That is the passage in full. I am inclined to trust the escape-hatch paragraph, since the three items in it all sound like named results I have half-heard of, and to be suspicious of the opening sentence about Arrow; but I know Arrow's theorem a little and Gibbard–Satterthwaite hardly at all, so my suspicions may just be tracking my ignorance. I would rather not absorb a distorted version of a result I expect to keep using, and I would also like to know whether the passage's practical moral survives once its technical claims are cleaned up.

  You are an economic theorist who works on mechanism design and has taught this material many times. Think carefully before you write, and do not stop at reciting the standard textbook statement: the useful part is working out which sentences of the passage are load-bearing and which are doing quiet damage. Please do not give me a reading list, citations, or pointers to the literature — I have no way to look anything up at the moment, and what I need is the reasoning itself, in your own words. Where the passage is wrong, give me the correct statement rather than the name of an authority.

  Before you draft, list the discrete claims the passage makes and mark which ones you think are doing the work; then write the response in the following sections, in this order:

  1. **The theorem, stated properly** (about 200 words). The result in your own words: what kind of object it constrains, what the assumptions are, what "strategy-proof" and "dictatorial" mean here, and why the two-alternative case is different. Flag any assumption the passage supplies that the theorem does not need, and any it omits that the theorem does need.

  2. **Line-by-line audit** (about 600–800 words). Go through the passage sentence by sentence. For each, say whether it is sound, a harmless simplification, or a misrepresentation, and give the reason. Where something is misrepresented, show exactly what has been conflated, overstated, or borrowed from a neighbouring result — I am especially interested in any place where a term of art is being used in its everyday sense.

  3. **The escape hatches, reassessed** (about 250 words). Take the three items in that paragraph one at a time and say whether each is a genuine way around the theorem, a change of subject, or something else. If one of them does not do what the passage says it does, tell me what the actual options are for someone who wants a non-dictatorial rule with good incentive properties, and what each costs.

  4. **Bottom line** (about 150 words). What in the passage's closing moral should I keep, and what should I put in its place?

  A few things I am separately curious about; fold them into whichever section fits rather than answering them on their own: whether it matters that the rule returns a single winner rather than a set or a tie-broken ordering; whether allowing chance into the outcome changes the picture; whether the single-peaked case is a counterexample to the theorem, a loophole, or neither; and whether "manipulable" is a claim about what voters will in fact do or about what a rule can guarantee.
