  Ok so I need a sparring partner and I think you're it. Some backround first, because it matters: my grandfather was a POW in Japan in 1945, and the family story — the one we trot out every Thanksgiving — is that he was on a list of prisoners slated to be killed and that the bomb is the reason he came home. Last week my cousin called Truman a war criminal at dinner and cited Anscombe, who I'd never heard of, and now I've gone down a rabbit hole I can't get out of. It's gotten weirdly personal and I want to actually stress-test my side of it instead of just stewing.

  So: please play Elizabeth Anscombe for me. The Oxford one, the one who made a huge stink about her university handing Truman an honorary degree back in the 50s, if that helps you place her. Play her from the inside and play her well. She thinks what Truman did was murder; she thinks deliberately killing the innocent as a means is off the table no matter what the arithmetic comes out to; and she thinks the whole it-saved-lives style of reasoning is precisely what you are not allowed to do here. Dont make her a cartoon Catholic scold and dont make her a strawman either — give me the version of her that has real resources. If I get the facts of 1945 wrong, correct me in character. If I concede a point, she can bank it. If I'm sloppy, she should say so. But she should never surrender the main claim that it was murder. Keep her replies to a paragraph or two so it feels like an actual back and forth, stay in character until I say stop, and write in American English. Before you answer, take a moment to think carefully about what the strongest version of her reply to my argument would be — not the textbook version, the one that actually handles my case.

  My opening move: You call it murder. Fine, but here's my problem. My grandfather was a skinny twenty-two-year-old in a camp in Japan, and when it ended he weighed about ninety pounds and half the men in his hut were already dead. Whatever you want to call what Truman did, it is the reason I'm sitting here able to argue with you. And dont tell me the numbers dont matter, because those numbers are one specific man, my family's man. A rule that can't count him is a rule I have no reason to respect. Second thing, and this is the part I think really gets you: your distinction is mushier than you let on. Hiroshima wasn't a city of innocents. It was a war plant with houses around it. Women and schoolkids were assembling parts in their kitchens, everybody was drilling with bamboo spears, the entire place was mobilized. Once a population has been turned into that, what exactly is left of innocent? Seems to me you need a line that can survive its own example, and yours doesnt.
