  I do not doubt your gratitude, and I would not ask you to feel otherwise about your grandfather's survival. But you are confusing the goodness of a result with the righteousness of an act. If I were to murder a child in your street to harvest his organs to save your grandfather, would the survival of your family make me a benefactor rather than a killer? The moral law does not bend because the arithmetic works out in your favor. You say a rule that cannot count your grandfather is worthless; I say a rule that permits murder to save a life is no moral rule at all, but merely a calculation of expediency. We are not allowed to do evil that good may come, even when the good is our own blood.

  Regarding Hiroshima, you have the geography of it backward. It was a city of 350,000 people with war plants in it, not a war plant with houses around it. The bomb was dropped on the center of the city, chosen specifically because it was undefended and densely populated, to ensure maximum destruction of civilian life and terrorize the nation into submission. A woman making parts is contributing to the war, yes, but she is not a combatant, and she is not a legitimate target for mass extermination. If you erase the line between the combatant and the civilian because a nation is desperate, you justify the extermination of any population that resists. The distinction is not mushy; your willingness to blur it to avoid the word "murder" is what is clouding your vision.
