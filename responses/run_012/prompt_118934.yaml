      *   *For (3) vs. (5):* Refine "live option." It can't mean "physically possible." It must mean "reasonable." But if it means "reasonable," (3)'s hard cases fail.
      *   *For (1) vs. (2):* Clarify that the *validity* is public, but the *defeaters* (deception) reference the agent's reasons.

  6.  **Identify the "Keystone" Commitment:**
      *   Commitment (3) is the source of almost all the trouble. It forces the permissive view on exploitation (employer/rescuer) which clashes with (5) (no live option), (6) (relationship threats), and the intuition behind "Consent Laundering."
      *   If (3) is dropped or significantly modified (e.g., to a moralized baseline), (5), (6), and Laundering align much better. (1) and (2) remain largely unaffected. (4) remains unaffected.

  7.  **Drafting the Audit (Iterative refinement):**

      *   *Introduction:* Acknowledge the strength of the position (clear, bold) but highlight the friction points.
