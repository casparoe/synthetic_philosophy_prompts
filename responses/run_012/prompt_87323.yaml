prompt: |-
  I work in a government strategy unit, and the briefing notes we put in front of ministers are full of claims about generations: that Gen Z will not tolerate a particular working arrangement, that the Baby Boomers voted as a bloc, that Millennials are the first cohort to be worse off than their parents. I am the person who signs these off, I have about two hours per note, no microdata, and no time to commission any. Write me a procedure I can run on a single generational claim to decide whether it can stand in a briefing. Give me the tests in the order I should run them, what counts as passing and failing each, and then apply it to two claims: one that should survive in some amended form, and one that must be cut even though it is the line the minister most wants to use. Two things need to be taken seriously. First, an effect of age, an effect of the period and an effect of belonging to a particular cohort are routinely confused with one another, and a briefing that confuses them will recommend the wrong policy. Second, treat "generation" as a claim to name a real kind rather than merely a birth-year bracket: a real kind here would have a shared causal mechanism, some self-awareness among the people it names, and some predictive power beyond the birth years themselves. Be explicit about which steps the procedure cannot settle and where a person must decide, and about what it will get wrong. Answer in no more than 800 words, leading with the procedure itself.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Government strategy unit official signing off briefing notes.
      *   **Constraint:** 2 hours per note, no microdata, no time to commission new data.
      *   **Task:** Write a procedure to test generational claims for briefing notes.
      *   **Requirements:**
          *   Order of tests.
          *   Pass/Fail criteria for each test.
          *   Apply to two claims (one survivable/amendable, one must be cut).
          *   Address APC (Age-Period-Cohort) confusion seriously.
          *   Treat "generation" as a real kind (shared causal mechanism, self-awareness, predictive power), not just birth brackets.
          *   Explicitly state limitations (what the procedure can't settle, where human judgment is needed, what it gets wrong).
          *   **Word Count:** Max 800 words.
          *   **Structure:** Lead with the procedure itself.

  2.  **Drafting the Procedure:**
      *   Need a quick, desk-based checklist.
      *   Step 1: APC Check (Crucial for policy). Is it actually age or period?
      *   Step 2: Mechanism Check (Real Kind). Is there a shared experience causing this?
      *   Step 3: Boundary Check (Predictive Power). Do the birth years matter, or is it a gradient?
      *   Step 4: Source Check (Evidence). Is there reputable data?
      *   Need Pass/Fail criteria for each.

  3.  **Drafting the Examples:**
      *   Claim 1 (Survive/Amend): Something about technology adoption or work preferences where cohort effect is plausible but needs nuance.
      *   Claim 2 (Cut): Something about voting blocs or economic status where APC confusion is high or stereotypes dominate.

  4.  **Drafting Limitations:**
      *   Acknowledge that without microdata, we rely on literature.
      *   Acknowledge that "generation" is socially constructed.
      *   Acknowledge time pressure.

  5.  **Refining for Constraints (Word Count & Tone):**
      *   Tone: Professional, bureaucratic but rigorous.
      *   Word Count: Tight. Need to be concise.
      *   Structure: Procedure first, then examples, then limitations.

  6.  **Step-by-Step Drafting:**

      *   *Procedure:*
          1.  **APC Discrimination:** Does the claim confuse aging (life-cycle), current events (period), or birth cohort? *Fail* if it attributes a life-cycle trait (e.g., risk aversion in youth) to a cohort. *Pass* if it isolates a unique historical shock (e.g., entering labor market during recession).
          2.  **Causal Mechanism:** Is there a shared formative experience? *Fail* if it relies on stereotypes (e.g., "lazy"). *Pass* if it cites specific structural shifts (e.g., digital native infrastructure, housing market crash).
          3.  **Boundary Integrity:** Are the birth years arbitrary? *Fail* if the trait changes sharply at 1996 vs 1997 without cause. *Pass* if treated as a gradient or centered around a specific shock window.
          4.  **Source Verification:** Is there secondary literature? *Fail* if sourced only to media op-eds. *Pass* if sourced to peer-reviewed sociology/economics or reputable polling (Pew, etc.).

      *   *Application:*
          *   Claim A (Survive): "Millennials face higher housing costs than parents." *APC:* Period/Coort mix. *Mechanism:* Policy shifts. *Verdict:* Amend to specify "early career housing burden relative to income" rather than absolute wealth.
          *   Claim B (Cut): "Boomers voted as a bloc to protect pensions." *APC:* Age effect (older people vote more). *Mechanism:* Weak (voting varies by class/region). *Verdict:* Cut. Confuses age participation with cohort preference.

      *   *Limitations:*
          *   Cannot resolve APC without longitudinal data.
          *   Relies on existing literature quality.
          *   Risks false negatives on emerging trends.

  7.  **Review and Edit (Checking Word Count and Requirements):**
      *   *Requirement:* "Lead with the procedure itself."
      *   *Requirement:* "Treat generation as a claim to name a real kind."
      *   *Requirement:* "Explicit about which steps the procedure cannot settle."
      *   *Word Count Check:* Need to be very economical.

      *   *Drafting text:*
          **Generational Claim Validation Procedure**

          **1. APC Discrimination Test**
          *Action:* Ask: Would this trait appear in any group at this age (Age), any group in this year (Period), or only this birth group (Cohort)?
          *Fail:* Attributes life-cycle traits (e.g., youth risk-taking) to cohort identity.
          *Pass:* Identifies a unique historical shock affecting only this cohort during formative years (e.g., entering workforce during 2008 crash).
          *Policy Risk:* High. Confusing Age for Cohort leads to policies that fail as the group ages.

          **2. Causal Mechanism Test (Real Kind)**
          *Action:* Identify the shared experience creating the group consciousness.
          *Fail:* Relies on essentialist stereotypes (e.g., "entitled") or vague zeitgeist.
          *Pass:* Cites specific structural changes (e.g., universal broadband access during adolescence, specific pension reforms).
          *Policy Risk:* Medium. Without mechanism, interventions cannot target the cause.

          **3. Boundary Integrity Test**
          *Action:* Check if the trait changes sharply at cohort birth-year borders.
          *Fail:* Claims sharp discontinuity between 1996 and 1997 without a specific event.
          *Pass:* Treats boundaries as fuzzy or centers on a specific event window (e.g., 1980–1985 entrants).
          *Policy Risk:* Low. Arbitrary brackets reduce predictive power.

          **4. Source Verification**
          *Action:* Verify evidence hierarchy.
          *Fail:* Sourced solely to media commentary or consultancy marketing.
          *Pass:* Sourced to peer-reviewed literature or reputable longitudinal surveys (e.g., Understanding Society, Pew).

          **Application**

          **Claim 1 (Survive/Amend):** "Millennials are the first cohort worse off than their parents."
          *Tests:* APC (Passes: specific economic stagnation period); Mechanism (Passes: wage/productivity decoupling); Boundaries (Fail: sharp 1981 cut-off).
          *Decision:* **Amend.** Remove specific birth years. Phrase as "Those entering labor markets post-2008 face lower intergenerational mobility." This retains the causal mechanism without false precision.

          **Claim 2 (Cut):** "Baby Boomers voted as a bloc to protect pensions."
          *Tests:* APC (Fail: conflates Age effect—older people vote more—with Cohort preference); Mechanism (Fail: voting varied significantly by class/region); Source (Fail: relies on aggregate election data).
          *Decision:* **Cut.** This confuses age participation with cohort solidarity. Policy based on this would misidentify the driver of voting behavior (age vs. ideology).

          **Limitations and Judgment**
          This procedure cannot settle APC confusion definitively without longitudinal microdata, which you lack. Step 1 relies on logical inference from existing literature, not statistical identification. You must decide if the literature is robust enough to infer causality.
          It will get wrong: Emerging cohorts where literature is sparse, and nuanced interactions (e.g., period effects hitting cohorts differently).
          Human Judgment Required: At Step 2, determining if a mechanism is "shared" enough to constitute a "real kind" versus a statistical artifact. At Step 4, weighing conflicting sources.
          Remember: A "generation" is only valid for briefing if it predicts behavior better than age or class alone. If the claim fails this, it is narrative, not strategy.

