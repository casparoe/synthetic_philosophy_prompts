answer: |-
  **Generational Claim Validation Procedure**

  **1. APC Discrimination Test**
  *Action:* Determine if the trait is due to **Aging** (life-cycle), **Period** (current events), or **Cohort** (birth group).
  *Fail:* Attributes life-cycle traits (e.g., youth risk-taking) to cohort identity.
  *Pass:* Identifies a unique historical shock affecting only this cohort during formative years (e.g., entering workforce during 2008 crash).
  *Rationale:* Confusing Age for Cohort leads to policies that fail as the group ages. A briefing must isolate the cohort effect to recommend targeted intervention.

  **2. Causal Mechanism Test (Real Kind)**
  *Action:* Verify the group is a "real kind," not just a bracket. Check for: (1) Shared causal mechanism, (2) Group self-awareness, (3) Predictive power beyond birth years.
  *Fail:* Relies on stereotypes (e.g., "entitled") or lacks self-awareness evidence.
  *Pass:* Cites structural changes (e.g., universal broadband during adolescence) creating shared consciousness and predictive utility.
  *Rationale:* Without a mechanism, "generation" is merely a birth-year bracket with no causal leverage for policy.

  **3. Boundary Integrity Test**
  *Action:* Check if the trait changes sharply at cohort birth-year borders.
  *Fail:* Claims sharp discontinuity between 1996 and 1997 without a specific event.
  *Pass:* Treats boundaries as fuzzy or centers on a specific event window.
  *Rationale:* Arbitrary brackets reduce predictive power and undermine the claim's scientific validity.

  **4. Source Verification**
  *Action:* Verify evidence hierarchy.
  *Fail:* Sourced solely to media commentary or consultancy marketing.
  *Pass:* Sourced to peer-reviewed literature or reputable longitudinal surveys.
  *Rationale:* Ensures claims withstand scrutiny beyond anecdote.

  **Application**

  **Claim 1 (Survive/Amend):** "Millennials are the first cohort worse off than their parents."
  *Tests:* APC (Passes: specific economic stagnation); Mechanism (Passes: wage/productivity decoupling); Boundaries (Fail: sharp 1981 cut-off).
  *Decision:* **Amend.** Remove specific birth years. Phrase as "Those entering labor markets post-2008 face lower intergenerational mobility." This retains the causal mechanism without false precision. It treats the generation as a real kind defined by economic shock rather than arbitrary dates.

  **Claim 2 (Cut):** "Baby Boomers voted as a bloc to protect pensions."
  *Tests:* APC (Fail: conflates Age effect—older people vote more—with Cohort preference); Mechanism (Fail: voting varied significantly by class/region); Source (Fail: relies on aggregate election data).
  *Decision:* **Cut.** This confuses age participation with cohort solidarity. Policy based on this would misidentify the driver of voting behavior. It fails the Real Kind test; there is no shared mechanism beyond age.

  **Limitations and Judgment**

  This procedure cannot settle APC confusion definitively without longitudinal microdata, which you lack. Step 1 relies on logical inference from existing literature, not statistical identification. You must decide if the literature is robust enough to infer causality.

  It will get wrong: Emerging cohorts where literature is sparse, and nuanced interactions (e.g., period effects hitting cohorts differently). It may reject valid claims where data is lagging.

  **Human Judgment Required:** At Step 2, you must decide if the mechanism creates a "real kind" or merely a statistical artifact. You must weigh whether the self-awareness is significant enough to drive behavior. At Step 4, you must weigh conflicting sources where consensus is absent.

  Remember: A "generation" is only valid for briefing if it predicts behavior better than age or class alone. If the claim fails this, it is narrative, not strategy. Use this procedure to protect the briefing from sociological error, ensuring policy targets causes, not labels.
