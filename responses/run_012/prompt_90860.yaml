answer: |-
  # Workshop Q&A Prep Sheet: Causal Composition
  **Topic:** A Causal Answer to the Special Composition Question (SCQ)
  **Core Thesis:** $Xs$ compose $Y$ iff $Xs$ constitute a single unified locus of causal-explanatory difference-making.

  ## Strategic Concessions (State these early to disarm critics)
  1.  **To the Philosophers of Physics:** Concede that causation may not be *fundamental*. Your claim is that composition is not fundamental either; it is a higher-level ontological feature grounded in causal profiles, which are themselves grounded in physics. You are not competing with fundamental physics.
  2.  **To the Formal Ontologists:** Concede that composition on this view is likely **non-transitive**. If $A$ causes as a unity to make $B$, and $B$ causes as a unity to make $C$, it does not follow that $A$ causes as a unity to make $C$. Be prepared to reject Classical Extensional Mereology (CEM) in favor of a more flexible mereology.
  3.  **To Everyone:** Concede that there will be **borderline cases**. If causal unity is a matter of degree (strength of integration), composition may be vague. Argue this is a feature (world-involving vagueness), not a bug.

  ---

  ## The 8 Objections (Ordered by Damage)

  ### 1. The Circularity Objection (The "Conceptual Priority" Attack)
  **Who:** General Metaphysicians / Formal Ontologists
  **Objection:** "To identify a 'single unified locus of causation,' don't you already need to individuate the cause? If I ask 'Do these particles compose a bomb?', you check 'Do they act as one cause?' But to answer that, I must already know if 'the bomb' is a valid subject of causal attribution. You are using composition to explain causation and causation to explain composition."
  **2-Minute Reply:** "I am not using *object* causation to define composition, but *counterfactual dependence*. We can map causal networks via interventionist protocols without presupposing substantial objects. We look for clusters of variables that move together in response to interventions. If a cluster of parts behaves as a single variable in the causal graph, they compose. The 'unity' is found in the structure of the dependencies, not in a prior ontological commitment."
  **Soft Spot:** Interventionist protocols often implicitly assume the stability of the relata (the objects being intervened upon). If the "cluster" shifts, the intervention conditions become muddy.

  ### 2. The Causal Exclusion Objection (The "Physics" Attack)
  **Who:** Philosophers of Physics
  **Objection:** "If the parts are physically sufficient for the effect, the 'whole' adds nothing. If the whole *does* add something, you violate the causal closure of the physical. You are either committed to overdetermination or epiphenomenalism. Which is it?"
  **2-Minute Reply:** "I endorse a non-reductive physicalism. The 'whole' is not an extra entity *alongside* the parts; it is the parts *organized*. Citing the whole is citing the parts *in virtue of* their causal integration. There is no competition between the causal power of the parts and the causal power of the whole, because the power of the whole *is* the integrated power of the parts. It's a single causal chain described at different grain sizes."
  **Soft Spot:** Hard-nosed causal closure defenders will insist that only the microphysical description is the *real* cause. You risk sounding like you are dodging the exclusion problem rather than solving it.

  ### 3. The Dormant Object Objection (The "Existence" Attack)
  **Who:** Neo-Aristotelians / Realists
  **Objection:** "On your view, existence depends on causal activity. If I put a watch in a lead box where it interacts with nothing, does it cease to compose a whole? Does the object pop in and out of existence depending on whether it is currently making a difference?"
  **2-Minute Reply:** "No, because causal powers are dispositional. The watch composes a whole because it *would* act as a unified locus of difference-making *if* appropriately stimulated. The unity lies in the stable causal profile, not the continuous exertion of force. However, if the parts scatter such that they *could not* act jointly even counterfactually, composition ceases."
  **Soft Spot:** This commits you to a robust realism about dispositions. If the universe enters a heat death where no interventions are possible, do all composite objects cease to exist? That's a hard bullet to bite.

  ### 4. The Non-Fundamentality Objection (The "Deflationary" Attack)
  **Who:** Philosophers of Physics
  **Objection:** "If composition depends on causation, and causation is not fundamental (but rather a macroscopic approximation), then composition isn't real. It's just a useful fiction for creatures like us. You claimed to avoid anti-realism, but you've just reduced ontology to descriptive utility."
  **2-Minute Reply:** "I distinguish 'fundamental' from 'real.' Rain is not fundamental (it's water droplets), but it is real. Causation captures real patterns in the world that are not captured by the fundamental equations alone. Composition is real because these causal patterns are objective features of the world, not merely projections of human interest. A rock stops a window regardless of whether a human is there to describe it."
  **Soft Spot:** If causation itself is viewed as purely pragmatic (as some physicists argue), your ontology collapses into pragmatism. You need causation to be at least *robustly emergent*.

  ### 5. The Priority of Unity Objection (The "Hylomorphic" Attack)
  **Who:** Neo-Aristotelian Hylomorphists
  **Objection:** "You have the direction of explanation backward. A plurality can act as one cause *only because* they are already one thing. Unity is a precondition for unified action, not a result of it. Without a substantial form, you just have an 'accidental unity' (a heap) that might happen to have a joint effect."
  **2-Minute Reply:** "I reject the need for a distinct 'form' entity. The 'substantial form' just *is* the specific causal integration profile. When the parts are organized such that they screen off their individual effects in favor of a joint effect, that *is* the unity. We don't need a metaphysical glue; the causal binding does the work. The distinction between heap and substance is a difference in degree of causal integration, not a difference in kind of metaphysical constituent."
  **Soft Spot:** Aristotelians will argue that causal integration is extrinsic (relations to effects), whereas substantial unity must be intrinsic. A bomb in a vacuum has no effects, yet is still a unity. (See Objection #3).

  ### 6. The Transitivity Failure Objection (The "Formal" Attack)
  **Who:** Formal Ontologists
  **Objection:** "Standard mereology requires transitivity of parthood. If atoms compose molecules, and molecules compose cells, atoms must compose cells. But on your view, atoms might not act as a *single* causal locus relative to the organism, even if molecules do. You break the logic of parthood."
  **2-Minute Reply:** "I argue transitivity is a formal idealization that doesn't hold for natural objects. Parthood is context-sensitive. Atoms are parts of cells *derivatively*, via molecules. If the causal unity breaks at a certain level (e.g., quantum decoherence vs. biological function), then composition stops. We should adopt a non-transitive mereology that better fits scientific practice."
  **Soft Spot:** Formalists hate non-transitive parthood. It complicates the logic immensely. You may be accused of changing the subject from "composition" to "functional association."

  ### 7. The Vagueness Objection (The "Precision" Attack)
  **Who:** Formal Ontologists / Metaphysicians
  **Objection:** "Causal integration comes in degrees. At what threshold does a 'joint cause' become a 'single cause'? If there is no sharp cutoff, composition is vague. But many argue composition cannot be vague (Lewis). If it is, you have ontic vagueness, which is metaphysically costly."
  **2-Minute Reply:** "I accept ontic vagueness. The world itself is not always sharp. Causal integration fades out at the edges (think of a growing organism or a dissipating cloud). It is better to have vague boundaries than arbitrary sharp ones. The 'arbitrariness' of universalism or nihilism is a greater theoretical vice than vague existence."
  **Soft Spot:** Lewisians will argue that vague existence makes identity vague, which is unintelligible. You need a defense of vague identity or a supervaluationist account.

  ### 8. The Scattered Object Objection (The "Intuition" Attack)
  **Who:** General Intuition / Hylomorphists
  **Objection:** "A distributed sensor network acts as a single causal locus (processing data to trigger one output). Do the scattered servers compose a single object? Your view says yes. But intuitively, spatial continuity is required for genuine composition."
  **2-Minute Reply:** "I bite the bullet. If a scattered plurality acts with sufficient causal integration, it is a composite object. Our intuition about spatial continuity is a heuristic for causal integration, not a metaphysical requirement. In modern physics and biology, functional systems often outstrip spatial contiguity (e.g., quantum entangled systems, neural networks)."
  **Soft Spot:** This alienates common sense. If the US Government acts as one agent, is it a single substance? Most metaphysicians resist this.

  ---

  ## The One Question I Hope Nobody Asks

  **"If causal profiles change over time, does the object cease to exist and a new one begin?"**

  **Why this is the Killer:**
  This attacks **persistence conditions**. If composition is defined by a specific causal profile (a specific way of making a difference), and that profile shifts (e.g., an organism matures, a machine degrades, a social group changes its function), does the original composite cease to exist?
  *   If you say **Yes**: You are committed to a radical temporal parts view or frequent replacement. The "watch" you owned last year is not the "watch" you own today because its causal dispositions have degraded. This is implausible.
  *   If you say **No**: You must admit that composition is *not* strictly identical to the causal profile, but rather to the *capacity* for a range of profiles. But then you need a principle to determine which range counts as "the same object." That principle looks suspiciously like... a **Substantial Form** (the Aristotelians win) or a **Convention** (the Deflationists win).

  **Prepared Defense (if asked):** "Composition is grounded in the *stable* causal structure, allowing for homeostatic variation. However, I concede that persistence is a distinct question from composition. My view answers when parts compose a whole *at a time*. Diachronic identity requires a further causal-historical constraint." (This concedes that your view is incomplete).
