  # Seminar Handout: Mapping the Intentional Stance
  **Topic:** From Thermostats to Original Intentionality  
  **Goal:** Locate your position on the realism of mental states.

  **Starting Point:** We can predict a thermostat's behaviour by attributing to it a *belief* that the room is cold and a *desire* to reach the setting.

  ---

  ### THE DECISION TREE

  **1. Is there a fact of the matter about whether the system *really* possesses these states, independent of any interpreter's strategy?**
  *(Test Case: Does the **Two-bitser** have beliefs even if no one is around to model it?)*

  *   **NO (The states depend on the stance taken):** Go to **2**.
  *   **YES (The states are mind-independent features):** Go to **3**.

  **2. If the states depend on the stance, is the attribution strictly false but useful, or true in virtue of the pattern?**
  *(Test Case: Is saying the **Chess Engine** 'wants' to win a lie that helps us predict, or a description of a real pattern?)*

  *   **False but useful (Fictionalism):** → **ELIMINATIVISM** (e.g., Churchland).
      *   *Verdict:* No intentionality (Original or Derived) exists; folk psychology is a false theory.
  *   **True in virtue of the pattern (Pattern Realism):** → **DENNETT'S INTERPRETIVISM**.
      *   *Verdict:* The Original/Derived divide collapses. All intentionality is 'derived' from the stance, but real as abstract patterns.

  **3. If the states are mind-independent, what grounds their representational content?**
  *(Test Case: What makes the **Bacterium** swimming up a gradient represent 'food' rather than just moving?)*

  *   **Evolutionary History/Function:** → **TELEOSEMANTICS** (e.g., Millikan, Papineau).
      *   *Verdict:* Original intentionality belongs to systems with proper functions derived from selection history. Artifacts have only Derived intentionality.
  *   **Intrinsic Causal Powers of the Substrate:** Go to **4**.
  *   **Fundamental Property of Matter:** → **PANPSYCHISM / PANINTENTIONALISM** (e.g., Chalmers, Goff).
      *   *Verdict:* Intentionality goes 'all the way down'. The divide dissolves because even electrons have proto-intentionality.

  **4. If grounded in causal powers, does any physical system suffice, or only biological brains?**
  *(Test Case: Does the **Printed Word 'cat'** or a silicon **Chess Engine** have Original intentionality if it mimics a brain?)*

  *   **Only Biological Brains (Causal Powers are specific):** → **SEARLE'S BIOLOGICAL NATURALISM**.
      *   *Verdict:* Strict Original vs. Derived divide. Computers simulate minds; only biology has Original intentionality.
  *   **Any Sufficiently Complex System:** → **COMPUTATIONAL FUNCTIONALISM** (e.g., Fodor).
      *   *Verdict:* Original intentionality is substrate-neutral. A perfect simulation *is* a mind.

  ---

  ### PEDAGOGICAL NOTES & LOGICAL GAPS

  **1. The Incoherent Leaf**
  *   **Path:** Answering **YES** to Q1 (There is a fact of the matter) but implying the fact is *determined* by the interpreter's whim.
  *   **Status:** **Incoherent.** One cannot claim mind-independent realism while grounding the truth conditions in mind-dependent interpretation. This view is unoccupied because it violates the law of non-contradiction.

  **2. Indistinguishable Leaves**
  *   **Panpsychism vs. Panintentionalism:** The tree treats these as a single leaf. While metaphysically distinct (consciousness vs. representation), functionally they occupy the same logical space here: both claim intentionality is fundamental rather than emergent. The tree cannot prise them apart without adding a node about phenomenology.
  *   **Dennett vs. Weak Teleosemantics:** There is significant overlap. Dennett acknowledges evolution creates the patterns Teleosemantics cites. The distinction rests on whether the *pattern itself* is sufficient for reality (Dennett) or whether the *historical mechanism* is the truth-maker (Teleosemantics).

  **3. The 'Original' Divide**
  *   **Searle & Teleosemantics:** Preserve the Original/Derived distinction (Biology vs. Artifact).
  *   **Dennett & Panpsychism:** Dissolve the distinction (Either all is derived/pattern-based, or all is original/fundamental).
  *   **Eliminativism:** Destroys the distinction (Neither exists).

  ---

  ### CONFIDENCE STATEMENT

  **Overall Confidence:** High (85%).
  The logical divisions accurately reflect the major fault lines in the philosophy of mind regarding intentionality.

  **Least Sure Placement:** **Dennett's Interpretivism.**
  I am least confident in cleanly separating Dennett from Teleosemantics at Q2/Q3. Dennett is a realist about patterns caused by evolution, which can sound like Teleosemantics. However, Dennett denies the 'intrinsic' nature Teleosemanticists often seek. I have placed him under 'Pattern Realism' (Q2) to emphasise his anti-reductionism, but a case could be made that he belongs in Q3 with a non-standard grounding. Students should be warned that Dennett often straddles the Instrumentalist/Realist divide.

  **Language Note:** Prepared in British English for UK graduate context.
