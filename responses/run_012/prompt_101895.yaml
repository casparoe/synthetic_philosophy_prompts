          *   Counterfactual World: Leaks (Fear). Device active.
          *   Student Objection: She *could* have done otherwise. She could have Leaked(Fear). That is different from Leaked(Conscience). So AP exists.
          *   My Counter: That "alternative" is not under her control. It is imposed by the device. A non-voluntary alternative is not a freedom-grounding alternative. Also, if we individuate actions that finely, PAP becomes "You are responsible only if you could have performed a different *token event*," which is always true but irrelevant. We need to focus on the *obligation* or the *choice*. She couldn't have chosen otherwise.
      *   *Better Counter:* The "Flicker" strategy argues that there is *some* alternative (the reason). I need to argue that this alternative is not *robust* enough to ground responsibility. Responsibility requires the ability to *avoid the outcome* or the *blame*, not just the ability to have a different internal mental state while producing the same outcome. In the counterfactual, she is still blameworthy for leaking. So the alternative possibility doesn't allow her to avoid responsibility. Therefore, AP is not necessary for responsibility.

  6.  **Final Polish:** Check tone. Ensure it sounds like a seminar essay (authoritative, analytical). Ensure no citations. Ensure the "Reliability" point is integrated well.

