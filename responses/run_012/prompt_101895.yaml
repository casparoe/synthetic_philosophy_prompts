answer: |-
  The Principle of Alternative Possibilities (PAP) has long served as the intuitive bedrock of moral responsibility. It posits a necessary condition: an agent is morally responsible for an action only if she could have done otherwise. For decades, the debate over free will has turned on the interpretation of this "could." Is it a claim about physical ability, metaphysical openness, or rational capacity? Frankfurt-style cases were designed to bypass these semantic quagmires by constructing a scenario where the agent intuitively bears responsibility despite the absence of any robust alternative. The Archivist case you have developed is a sophisticated iteration of this strategy, introducing a wrinkle regarding the individuation of actions by their motivating reasons.

  To evaluate whether the Archivist refutes PAP, we must first fix the target. The version of PAP worth debating is not the trivial claim that an agent is responsible only if she could have performed a numerically distinct token event. That is always true in a branching universe and carries no weight. The robust PAP claims that an agent is responsible only if she had the power to avoid the *moral status* she actually incurs. She must have been able to avoid being blameworthy (or praiseworthy). If she is locked into a specific moral outcome, regardless of her internal deliberations, she lacks the freedom required for responsibility. With this robust reading in place, we can assess the Archivist.

  The Archivist case functions as follows: In the actual sequence, Maria decides to leak files out of conscience. The Archivist, a counterfactual intervener, monitors her. Had Maria shown signs of deciding to keep quiet, the Archivist would have intervened to ensure she decided to leak. However, in your specific variation, the intervention does more than force the decision; it alters the motivational structure. In the counterfactual branch, Maria leaks out of fear, not conscience. The Archivist never intervenes in the actual sequence.

  Your students object that this fails as a counterexample because there is no alternative to *this* action—leaking-out-of-conscience. In the counterfactual world, the action is leaking-out-of-fear. Therefore, they argue, Maria *could* have done otherwise (she could have leaked for a different reason), so PAP remains intact. This is a version of the "flicker of freedom" strategy. It attempts to save PAP by arguing that while Maria couldn't have avoided leaking, she could have varied the properties of the action.

  This objection fails because it relies on an overly fine-grained individuation of actions that severs the link between alternative possibilities and moral avoidability. For PAP to do the work proponents want it to do, the alternative possibility must be *robust*. It must be an alternative the agent can will into existence to escape the attribution of responsibility. In the Archivist case, the alternative possibility (leaking out of fear) is not under Maria's control. It is a state of affairs imposed by the Archivist's mechanism in the counterfactual branch. Maria does not *choose* the fear motivation; it is installed to bypass her refusal.

  If the only alternative available to Maria is a scenario where she is manipulated into the same outcome with a different, implanted motive, she lacks the power to avoid the blame associated with leaking. She is blameworthy in the actual sequence (conscience) and she would be blameworthy in the counterfactual sequence (fear). Since she cannot access a world where she is *not* blameworthy for the leak, the alternative possibility is morally inert. It is a flicker, not a freedom. To claim that PAP is satisfied because she could have leaked for a different reason is to change the subject from "could she have avoided responsibility?" to "could the causal history of her action have been different?" The latter is irrelevant to the core intuition of PAP, which is about the openness of the future regarding moral accountability. Therefore, the reasons-replacement wrinkle does not save PAP. It merely highlights that the alternative possibilities that remain in Frankfurt cases are too thin to ground the principle.

  This brings us to the second critical component: the reliability of the Archivist's trigger. You asked whether it matters if the Archivist is infallible or merely probabilistic. It matters decisively. The load-bearing version of the case is the one where the Archivist is an infallible predictor.

  Consider the probabilistic version. Suppose the Archivist's device triggers based on a high-probability indicator of Maria's choice, but it can misfire. If the device can misfire, there exists a possible world where the device fails to trigger *and* Maria decides to keep quiet. In that world, Maria refrains from leaking. If such a world is accessible to her, then she *could* have done otherwise in the robust sense. She could have avoided the leak entirely. In this scenario, PAP is true, and the case fails as a counterexample. The existence of a probabilistic gap preserves the alternative possibility that PAP demands.

  For the Frankfurt-style counterexample to work, the counterfactual intervener must close off the possibility of refraining entirely. The Archivist must be rigged to a prior sign that is causally sufficient for the decision, or otherwise guarantee the outcome with metaphysical necessity. Only in the infallible version is it true that in *no* accessible world does Maria refrain from leaking. This is the version that threatens PAP.

  However, this raises a familiar worry: does an infallible predictor presuppose determinism? If the Archivist knows with certainty what Maria will do, is her decision already determined? If the case presupposes determinism, incompatibilists will argue it begs the question against them. They claim that if determinism is true, PAP is already false for reasons unrelated to Frankfurt cases. To avoid this, the Frankfurt defender must argue that the prior sign is not a determining cause but a non-causal indicator—a symptom of the decision that hasn't happened yet but is guaranteed to happen. Whether this is metaphysically coherent is a separate debate, but for the internal logic of the counterexample, the infallible trigger is the necessary condition. Without it, the "could have done otherwise" clause remains satisfied via the gap in the device's reliability.

  So, where does this leave us? The Archivist case, in its infallible form, successfully refutes the robust Principle of Alternative Possibilities. The students' objection regarding the reasons-replacement wrinkle relies on a definition of "action" that makes PAP trivial. If we define actions so finely that a change in motive constitutes a different action, then "could have done otherwise" becomes "could have performed a numerically distinct token event with different properties." But as established, the alternative token event in the Archivist case (leaking via fear) is not a voluntary alternative. It is a manipulated outcome. Since Maria cannot voluntarily access a world where she avoids blame, the alternative possibility is insufficient to satisfy the spirit of PAP.

  Does PAP survive in any form? It survives only in a weakened, tautological form: "An agent is responsible only if she is responsible." If we define "could have done otherwise" as "could have done otherwise *in the actual sequence*," then PAP is safe, but it no longer serves as a modal constraint on responsibility. It becomes a description of the actual sequence's properties (e.g., responsiveness to reasons) rather than a claim about alternative worlds. This is not a rescue of PAP; it is an abandonment of it in favor of an Actual Sequence principle.

  The Actual Sequence principle holds that moral responsibility depends entirely on how the action was produced in the actual world, not on what might have happened in other worlds. In the Archivist case, the actual sequence is unmanipulated. Maria's deliberation, her conscience, and her decision are all her own. The Archivist is a idle backup. The fact that she *would* have been manipulated had she deliberated differently is irrelevant to the history of the action she actually performed. Responsibility tracks the actual genesis of the act.

  Therefore, the verdict is clear. The Archivist case refutes PAP. The reasons-replacement wrinkle does not restore the principle because the alternative it provides is not robust enough to ground moral avoidability. The probabilistic version of the case fails to refute PAP because it leaves alternative possibilities open; only the infallible version works. Consequently, we must reject PAP as a necessary condition for moral responsibility. We should replace it with an Actual Sequence account, which locates freedom in the source of the action rather than the branching of possibilities. This is not an ad hoc rescue; it is the only way to accommodate the intuition that Maria is responsible in the Archivist case. She is responsible because the action flows from her own reasoning, not because she had a ghostly power to do otherwise in a world where a machine was waiting to stop her. The Archivist shows that the power to do otherwise is not the source of responsibility; the source of responsibility is the agent herself.
