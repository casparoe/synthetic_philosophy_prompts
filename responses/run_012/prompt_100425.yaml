  ### What to Openly Refuse to Cover

  To keep the session within 50 minutes and at the right level, explicitly state at the beginning that you will **not** cover:

  1.  **Mitigation Strategies:** Do not discuss solutions (e.g., recursive reward modeling, cross-examination protocols). This session is about diagnosing the pathology, not curing it.
  2.  **Formal Complexity Classes:** Do not use terms like P, NP, PSPACE, or NEXP. Use "polynomial" vs. "exponential" or "easy" vs. "infeasible" instead.
  3.  **Specific AI Architectures:** Do not debate whether Transformers or RNNs are more susceptible. The problem applies to any agent operating under computational bounds.
