              4.  Debrief: Can you check your impression against the card? No. Can you check your current impression against your past impression? Only via... your current impression.
              5.  This creates the circularity.

      *   *Refining the "Memory Test" Objection:*
          *   To stop them thinking "I just have a bad memory," we need to show that *even perfect memory* doesn't solve the problem.
          *   How? By showing that "correctness" requires a *standard independent of the judgment*.
