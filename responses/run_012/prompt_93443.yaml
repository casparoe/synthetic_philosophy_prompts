      *   *Nuance:* The user says "step-by-step reasoning tells him to keep going." This implies the "Myopic" choice.
      *   *Nuance:* The welding case. If the weld is invisible, the driver still can't tell. But if the *action* is unavailable, the decision tree changes. At node 1, Action Set = {Continue}. At node 2, Action Set = {Continue, Exit}. If the driver knows the weld exists but can't see it, does he know he *can't* turn? If he tries to turn at 1 and fails, he learns he is at 1. So the weld *makes* them distinguishable by outcome. I need to be careful here. The user says "cheaply weld the first exit shut... now the two spots are distinguishable." I should accept the user's premise that they become distinguishable (perhaps the wheel hits a barrier) and analyze the implication.

