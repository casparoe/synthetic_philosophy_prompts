      *   **Ex-ante (Planning):** Maximize expected utility over the whole tree. Optimal mixed strategy: Continue with probability $p$. Calculation leads to $p=4/5$ (or similar depending on exact payoffs, usually optimal is to continue with some probability). Wait, standard AMD usually has specific payoffs. Let's stick to the qualitative structure described: Exit 1 (bad), Exit 2 (good), Pass 2 (worst).
      *   **Ex-interim (Act-based):** At an intersection, what is the probability I am at X vs. Y? If I assume I'm equally likely to be at either (principle of indifference), continuing looks better. But if I always continue, I get the worst payoff. This is the *time inconsistency* problem.
      *   **Core Tension:** Ex-ante optimality vs. Ex-interim rationality.

  3.  **Evaluate the User's vs. Friend's Positions:**
      *   **Friend (Pro-Plan):** Aligns with *Ex-ante* decision theory (e.g., Ainslie, McClennen, or standard Causal Decision Theory applied to policies). Believes rationality requires binding oneself to the optimal strategy.
      *   **User (Pro-Act):** Aligns with *Ex-interim* decision theory (e.g., standard CDT or EDT applied at the node). Believes rationality is about maximizing utility *given current information*. Believes "planning" ignores the epistemic limitation at the node.
