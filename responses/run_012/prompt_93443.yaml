          *   *Friend's View:* Act-based decision theory is broken; you must commit to a plan ex-ante.
          *   *User's View:* Planning is "cheating"; at the moment of choice, the agent lacks information, so you can't choose from a "view from nowhere."
      *   **User's Hypothesis:** The disagreement isn't really about plans vs. acts, but about *agent individuation* (who is the chooser?) and *information states* (is the 50/50 credence valid?).
      *   **User's Test Case:** Welding the first exit shut (making nodes distinguishable). Does this resolve the paradox by fixing distinguishability, or does it just smuggle in planning?
