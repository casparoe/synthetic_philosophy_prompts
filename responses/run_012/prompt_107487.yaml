answer: |-
  Your intuitions are not random; they form a coherent, albeit idiosyncratic, metaphysical picture. You are effectively advocating for a version of **Constitution Theory** that is gated by **Institutional Facts**, paired with a **Rigid View of Matter** that conflicts with your tolerance for Vagueness.

  You want an ontology where physical matter is a unique, precise continuant, but where "objects" of value (art, artifacts) can multiply, survive material change, and depend on human context. The tension in your Snowball/Urinal pair reveals that for you, *ontological multiplication requires normative status*, not just physical distinction.

  Here are two competing principles that attempt to codify your verdicts, followed by a synthesis that does the heavy lifting, and finally an honest accounting of the costs.

  ### Candidate 1: The Normative Sortal Principle
  **Statement:** Two coincident material entities are distinct if and only if they fall under sortals with divergent persistence conditions, *and* at least one of those sortals is grounded in an institutional or intentional norm (e.g., Art, Function, Ownership) rather than mere physical description.

  *   **Why it fits your cases:**
      *   **Clay Horse:** Distinct. 'Statue' is an intentional norm; 'Lump' is physical. (Matches your verdict).
      *   **Snowball:** Identical. 'Snowball' is a physical description of shaped snow, lacking institutional weight. (Matches your verdict).
      *   **Urinal:** Distinct. 'Artwork' is an institutional status; 'Porcelain Object' is physical. (Matches your verdict).
      *   **Split Lump:** The Lump ceases because the specific physical continuant is broken. The Statues are new intentional objects. (Matches your verdict).

  *   **Where it struggles:**
      *   **The Pinch of Clay:** This principle doesn't explain why adding clay destroys the *Lump* but not the *Statue*. Usually, institutional objects are *more* sensitive to change (a damaged painting loses value), but you claim the Statue survives material addition while the Lump does not.
      *   **The Molecule Case:** It doesn't explain why you refuse to multiply Lumps (Problem of the Many) but accept multiplying Statues. If anything, institutional objects should be *more* precise (defined by certificates/intent) and physical objects *more* vague.

  ### Candidate 2: The Asymmetric Persistence Principle
  **Statement:** Material entities are distinct if they track different properties. A "Lump" tracks **exact material composition** (rigid mereology). A "Statue/Artifact" tracks **functional or formal continuity** (flexible mereology). Persistence conditions diverge where material strictness conflicts with functional flexibility.

  *   **Why it fits your cases:**
      *   **The Pinch of Clay:** Adding clay changes the material composition (New Lump) but preserves the form/function (Same Statue).
      *   **Squash Horse:** Changes form (Statue dies) but preserves matter (Lump survives).
      *   **Molecule Case:** *Here is the friction.* If Lumps track exact composition, removing a molecule should create a new Lump. You say it doesn't. This principle forces you to admit that 'Lump' is actually vague, contradicting your "Pinch" intuition.

  *   **Where it struggles:**
      *   **Snowball vs. Urinal:** This principle predicts distinctness for both. A snowball has a form (sphere) and matter (snow). If form and matter have different persistence conditions (snowball melts, snow remains), they should be distinct. You say they are not. This principle cannot explain why the Snowball is monistic while the Urinal is dualistic without appealing back to Candidate 1's "Institutional" clause.

  ### The Synthesis: The Dual-Track Ontology
  To capture the full pattern, including the Snowball exception and the Pinch intuition, I propose this combined principle.

  **The Principle:**
  > **1. The Institutional Gate:** Coincident entities are ontologically distinct only if the higher-order entity (Statue, Artwork) derives its identity conditions from a normative or intentional framework (Art, Law, Function) that is not reducible to physical description. Purely physical shape-aggregates (Snowballs) are identical to their matter.
  >
  > **2. Asymmetric Mereology:** For entities passing the Institutional Gate, the Physical Base (Lump) is governed by **Strict Composition** (any addition/subtraction of parts creates a new entity), while the Institutional Object (Statue) is governed by **Salience Continuity** (identity persists through material change so long as the recognized form/function remains salient).
  >
  > **3. The Uniqueness Constraint:** Physical Bases (Lumps) do not multiply under vagueness (Problem of the Many); there is always one unique lump per region. Institutional Objects may multiply under vagueness (competing interpretations create competing statues).

  #### Testing the Synthesis Against Your Cases
  *   **Clay Horse:** Passes Gate (Art). Asymmetric Mereology applies. Pinch of clay = New Lump (Strict), Same Statue (Salience). **Verdict: Matches.**
  *   **Snowball:** Fails Gate (No normative framework, just description). Monism applies. **Verdict: Matches.**
  *   **Urinal:** Passes Gate (Artworld). Distinct entities. **Verdict: Matches.**
  *   **Split Lump:** Physical Base is destroyed (Strict Composition violated by fission). Two new Institutional Objects created. **Verdict: Matches.**
  *   **Molecule Case:** Uniqueness Constraint saves the Lump (no multiplication). Salience Continuity allows Statue multiplication (interpretive vagueness). **Verdict: Matches.**

  #### Predictions for New Cases
  Here is how the **Dual-Track Ontology** handles the cases you requested:

  1.  **A Wave on the Ocean:**
      *   *Verdict:* **One Thing (Monism).**
      *   *Reasoning:* Fails the Institutional Gate. A wave is a physical phase of water, not an artifact with normative persistence. Like the snowball, "wave" is a description of water in motion.
  2.  **A Hole in a Piece of Cheese:**
      *   *Verdict:* **Two Things (Dualism), but Dependent.**
      *   *Reasoning:* This tests the "Material" clause. A hole is not material. The principle implies distinctness because the hole's persistence conditions (shape/void) differ from the cheese (matter). However, the hole is ontologically dependent; it cannot exist without the cheese.
  3.  **A Shadow:**
      *   *Verdict:* **Distinct Entity.**
      *   *Reasoning:* Like the hole, it is not material. It has different persistence conditions (moves with the light source, not the object). It passes a modified "Phenomenal Gate."
  4.  **A Melody:**
      *   *Verdict:* **Distinct from Sound Waves.**
      *   *Reasoning:* Passes the Institutional/Intentional Gate. A melody is an abstract type or musical work. It survives changes in the medium (hummed, played on piano, recorded) that would destroy the specific sound waves.
  5.  **A Corporation:**
      *   *Verdict:* **Distinct from Assets/Employees.**
      *   *Reasoning:* Passes the Institutional Gate (Law). It survives the total replacement of all parts (employees, buildings) provided the legal charter persists.
  6.  **A Robot (Ship of Theseus):**
      *   *Verdict:* **Distinct from the Parts.**
      *   *Reasoning:* Passes the Functional Gate. As parts are swapped, the "Robot" (functional unit) survives, but the "Aggregate of Parts" (Physical Base) is constantly replaced. Under your "Pinch" intuition, every part swap creates a *new* Aggregate, but the *same* Robot.

  ### The Cost: What You Must Give Up
  This principle captures your pattern, but it forces you to accept three significant metaphysical costs. I need to be honest about where your intuitions are logically unstable.

  **1. The "Pinch" vs. "Molecule" Contradiction**
  You claim that adding a *pinch* of clay creates a new Lump (Strict Composition), but removing a *molecule* does not multiply Lumps (Uniqueness Constraint).
  *   **The Problem:** These are incompatible. If a Lump is defined by its parts, a molecule change makes a new Lump. If a molecule change *doesn't* make a new Lump, then a pinch shouldn't either.
  *   **The Cost:** To keep the Dual-Track Ontology, you must admit that 'Lump' is a **vague sortal** masked as a precise one. You have to accept that there is a *sorites threshold* for Lumps. You cannot have it both ways: Lumps cannot be both hyper-sensitive to pinches and insensitive to molecules. You must choose: either the Pinch makes a new Lump *and* the Molecule does (proliferation of lumps), or neither does (stability of lumps). Your current mix is psychologically understandable but logically untenable.

  **2. The Fragility of the Snowball**
  Your distinction between the Snowball and the Urinal rests entirely on the **Institutional Gate**.
  *   **The Problem:** This makes your ontology contingent on social whims. If a competition arises for "Best Snowball," and rules are written about its persistence conditions (e.g., "it survives melting if refrozen"), your principle forces you to say the Snowball is now distinct from the Snow.
  *   **The Cost:** You must accept that **ontology is socially constructed**. There is no mind-independent fact about whether the snowball is one thing or two; it depends on whether humans care enough to assign it a normative status. If you want a mind-independent reality, this principle fails.

  **3. The Status of the "Lump"**
  You treat the Lump as the "real" physical object that survives squashing but perishes upon splitting or adding clay.
  *   **The Problem:** In modern physics, there is no such thing as a "Lump" with strict identity conditions. Matter is fields and particles in flux. Your "Lump" is actually just another conceptual construct, similar to the Statue.
  *   **The Cost:** You are privileging one conceptual scheme (Folk Physics/Lumps) as "Real" and another (Art/Statues) as "Dependent," even though both rely on human categorization. To be consistent, you should either treat *both* as real (full-blown Constitution View) or *neither* as real (Eliminativism). Your middle ground requires you to treat 'Lump' as metaphysically privileged without a clear justification for why 'Lump' is more real than 'Statue' other than your intuition that matter is "base."

  ### Recommendation
  Your intuitions align best with **Social Ontology applied to Material Constitution**. You are effectively arguing that **objects multiply only when value or function supervenes on matter.**

  To make this defensible, I suggest you drop the "Pinch of Clay" intuition. It is the outlier. If you accept that Lumps are vague (like Statues), the "Molecule" case becomes consistent, and the "Pinch" case simply becomes a large step on the sorites curve where we *stipulate* a new lump for convenience. This sacrifices your desire for Lumps to be precise anchors, but it saves your ontology from internal contradiction.

  If you refuse to drop it, you are left with a system where 'Lump' is a magical entity that is precise enough to perish by addition but vague enough to ignore molecules—a position that will not survive a rigorous reading group.
