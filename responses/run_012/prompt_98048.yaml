          *   Provide a repaired version of the principle.
          *   Predict the outcome for a new case (forecaster with articulable reason).

  2.  **Analyze the User's Gut Verdicts:**
      *   *Case 1 (Cardiologist):* Base rate says work up, Hunch says nothing. Verdict: **Defer to Outside View (Base Rate).** Reason: Hunch is "just a feeling."
      *   *Case 2 (Climate Scientist):* Base rate says replicate, Expert says wrong. Verdict: **Trust Inside View.** Reason: She can say *why* it's off (methodological critique).
      *   *Case 3 (Friend's Marriage):* Base rate says 50%, Friend says last. Verdict: **Defer to Outside View.** Reason: Reasons given are generic ("everyone gives reasons like that").
      *   *Case 4 (Courtroom Reporter):* Base rate says truthful, Reporter says lying. Verdict: **Trust Inside View.** Reason: Specific "tell."
      *   *Case 5 (Journalist/Source):* Vibe says lying, turned out right. Verdict: **Defer to Outside View (critique of self).** Reason: "Nothing but a vibe" (even though right).

  3.  **Brainstorm Candidate Principles:**
      *   *Candidate A (Articulability):* Trust inside view if you can articulate the mechanism. (Matches Case 2, 4. Conflicts with Case 5 if the vibe was right, but User says they were a fool. Matches Case 1 & 3 where reasons were weak/generic).
      *   *Candidate B (Expertise/Reference Class Narrowing):* Trust inside view if your expertise allows you to narrow the reference class significantly. (Cardiologist *should* narrow it, but User says no. Reporter narrows it. Climate scientist narrows it. Friend doesn't).
      *   *Candidate C (Falsifiability/Checkability):* Trust inside view if the reason can be checked/verified independently of the outcome. (Climate scientist's methodological critique is checkable. Reporter's "tell" is arguably checkable. Friend's reasons are not easily checkable. Cardiologist's hunch is not checkable).
      *   *Candidate D (Bias Correction):* Trust outside view unless the inside view corrects for a known bias in the base rate. (Friend is optimistic bias. Cardiologist might be fatigue bias? Reporter might be cynicism bias? Climate scientist is correcting for publication bias).

  4.  **Evaluate the User's Tentative Principle:**
      *   *Principle:* "Trust the inside view only when it comes with a checkable reason that the outside view doesn't already contain."
      *   *Test Case 1 (Cardiologist):* Hunch = no checkable reason. Outside view contains "symptoms + age." Verdict: Defer. (Matches).
      *   *Test Case 2 (Climate Scientist):* Reason = methodological flaw. Checkable? Yes. Outside view (base rate of replication) doesn't contain specific methodological critique. Verdict: Trust. (Matches).
      *   *Test Case 3 (Friend):* Reasons = "we talk." Checkable? Vaguely. But Outside View (divorce stats) *already accounts* for people who talk/try. The reason isn't *new* information relative to the reference class. Verdict: Defer. (Matches).
      *   *Test Case 4 (Reporter):* Reason = "specific tell." Checkable? In principle (recordings). Outside view (witness type) doesn't contain specific behavioral tells. Verdict: Trust. (Matches).
      *   *Test Case 5 (Journalist):* Reason = "vibe." Checkable? No. Verdict: Defer (even if right). (Matches).

      *   *Where it breaks/Needs Repair:*
          *   "Checkable" is tricky. Does it mean checkable *now* or checkable *in principle*? The reporter's "tell" might not be checkable until cross-exam.
          *   "Doesn't already contain" is the heavy lifter. The base rate for marriages *does* contain couples who talk. The base rate for patients *does* contain rare presentations.
          *   The Cardiologist case is the toughest. 20 years experience *should* generate checkable reasons (ECG nuances, subtle pallor). If she *only* has a hunch, the principle holds. But if her experience *is* the reason, is that checkable? The User says "hunch is just a feeling," implying no articulable data.
          *   *Epistemic Modesty Issue:* The principle leans heavily on *articulability*. But expertise often operates tacitly (pattern recognition). A strict "checkable reason" rule might penalize valid intuition born of deep expertise (like the Cardiologist, potentially). However, the User *rejected* the Cardiologist's hunch. So the User values articulability over tacit expertise in high-stakes safety cases.

  5.  **Develop the Repaired Principle:**
      *   The core distinction seems to be between **Information** vs. **Rationalization**.
      *   Outside views aggregate *average* information. Inside views are valid only if they introduce *new, relevant information* not captured by the reference class.
      *   "Checkable" is too strong. "Articulable" is better. "Causal mechanism" is even better.
      *   *Refinement:* Trust the inside view when it identifies a **causal factor specific to this case that the reference class averages over.**
      *   *Modesty Check:* You must also be sure you aren't the victim of "specialness bias" (thinking you are the exception without proof).
      *   *Repaired Principle:* **The Specific Causal Information Principle.** Defer to the outside view unless the inside view can point to a specific, causal variable present in this instance that is *not* already averaged into the base rate, and provide a mechanism for why it overrides the statistical prediction.

  6.  **Analyze the "Throw Out" Requirement:**
