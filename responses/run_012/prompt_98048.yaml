answer: |-
  It is a pleasure to engage with a colleague who wrestles with the tension between the "view from nowhere" (statistics, base rates) and the "view from here" (specific evidence, intuition). This is the central friction of modern epistemology, often framed as the battle between *reference class forecasting* and *case-specific reasoning*.

  You have asked me to act as the epistemologist. My job is not to validate your comfort, but to stress-test the coherence of your justification. You want the principle that underwrites your gut. Let's dig for it.

  ### Part 1: Brainstorming Candidate Principles

  Before we evaluate your tentative principle, let's lay out the competing frameworks that might explain your verdicts.

  1.  **The Articulability Constraint:** Trust the inside view only if the expert can translate their intuition into explicit premises. (Tacit knowledge doesn't count; if you can't write it down, it's a guess.)
  2.  **The Reference Class Narrowing Principle:** Trust the inside view only if it identifies a *narrower* reference class with a different base rate. (e.g., Not "all marriages," but "marriages where partners possess communication skill X.")
  3.  **The Causal Mechanism Requirement:** Trust the inside view only if it posits a specific causal factor present in this case that explains *why* the base rate doesn't apply.
  4.  **The Asymmetric Loss Function (Decision Theory):** This isn't about truth, but cost. Trust the outside view when the cost of being wrong about the inside view is catastrophic (e.g., missed heart attack), regardless of the probability.

  ### Part 2: Testing Your Tentative Principle

  **Your Principle:** *"Trust the inside view only when it comes with a checkable reason that the outside view doesn't already contain."*

  Let's run your five cases through this filter.

  *   **Case 1 (Cardiologist):** **Pass.** The hunch is "just a feeling." It is not checkable. The outside view (symptoms + age) contains the aggregate data. You defer to the outside view.
  *   **Case 2 (Climate Scientist):** **Pass.** The reason (methodological flaw) is checkable (other scientists can review the methods). The outside view (replication rates) does not contain specific knowledge of *this* study's error. You trust the inside view.
  *   **Case 3 (Friend's Marriage):** **Pass.** The reasons ("we talk") are checkable in principle, *but* the outside view (divorce stats) *already contains* couples who talk. The reason adds no new information relative to the reference class. You defer to the outside view.
  *   **Case 4 (Courtroom Reporter):** **Pass.** The "specific tell" is checkable (review the tape). The outside view (witness type) averages over witnesses who do and don't have that tell. You trust the inside view.
  *   **Case 5 (Journalist/Source):** **Pass.** A "vibe" is not checkable. Even though you were right, the process lacked a checkable reason. You condemn the reliance on the inside view.

  **Where it breaks:**
  The word **"Checkable"** is doing too much heavy lifting and creates ambiguity.
  In Case 4 (Reporter), is the "tell" checkable *before* the verdict? No. It is only checkable in principle (by recording). In Case 2 (Climate Scientist), the flaw is checkable by peers. In Case 1 (Cardiologist), if she said "his skin has a specific pallor," that is checkable. You rejected it because you labeled it a "feeling."
  The deeper issue is **Case 3**. Your principle says "reason the outside view doesn't already contain." This is the crux. The friend's reason *is* contained in the base rate. But how does the friend *know* that? He doesn't have the data.
  Your principle works, but "checkable" is the wrong metric. "Informationally novel" is the right metric.

  ### Part 3: The Hard Truth (Which Calls to Throw Out)

  To be a rigorous epistemologist, I must point out where your intuition is likely conflating two different things. I believe you need to throw out (or significantly reframe) **Case 1 (The Cardiologist).**

  Here is why: You are conflating **Epistemic Justification** (what should she believe?) with **Decision Theory** (what should she do?).

  If the question is *"What is the probability this patient is having a heart attack?"*, a cardiologist's 20 years of pattern recognition is valid data. It is "tacit knowledge." If you accept the Courtroom Reporter's "tell" (which is often also tacit pattern recognition honed by experience), you must accept the Cardiologist's "hunch" as epistemic evidence.

  The only reason you say "work him up" is because the cost of a false negative (death) is infinitely higher than a false positive (wasted time). That is a decision matrix, not an epistemic principle. If the cost were symmetric (e.g., guessing the color of a shirt), you might trust her hunch more.

  **The Inconsistency:** You trust the Reporter's intuition (Case 4) but distrust the Cardiologist's intuition (Case 1). Both are veterans. The only difference you cite is "tell" vs. "feeling." But often, a "tell" is just a "feeling" the expert has learned to name. If the Cardiologist cannot name it, it is still data, just noisy data. By dismissing it entirely, you are ignoring the value of expertise in favor of raw statistics.

  **My Verdict:** Keep the verdict (work him up), but change the justification. She should work him up *even if she believes her hunch*, because the stakes demand it. Do not tell her her hunch is epistemically worthless.

  ### Part 4: The Repaired Principle

  Your tentative principle was close, but "checkable" is too narrow (excludes valid tacit knowledge) and "doesn't contain" is too vague.

  Here is the repaired version, incorporating the "Reference Class Narrowing" and "Causal Mechanism" candidates:

  > **The Specific Causal Information Principle:**
  > Defer to the outside view (base rates) unless the inside view can identify a **specific causal factor** present in this case that:
  > 1.  Is **articulable** (can be described to a peer), AND
  > 2.  **Narrows the reference class** to a subgroup with a meaningfully different base rate, AND
  > 3.  Is **not already averaged into** the original base rate statistic.

  **Why this repairs your cases:**
  *   **Cardiologist:** Fails #1 (if it's just a feeling). *However*, if we acknowledge tacit knowledge, we allow #1 to be "demonstrable track record." But we still defer on action due to stakes.
  *   **Climate Scientist:** Passes all three. She identifies a flaw (causal), which creates a class of "studies with this flaw" (narrowing), which replication stats don't account for (novelty).
  *   **Friend:** Fails #2 and #3. "We talk" is already in the divorce stats. He hasn't narrowed the class.
  *   **Reporter:** Passes #1 and #2. "The tell" narrows the class to "witnesses with this tell."
  *   **Journalist:** Fails #1. A vibe is not articulable.

  **The Modesty Clause:**
  Add this caveat: *Even if the principle is met, apply a discount factor for "Specialness Bias."* Humans are evolutionarily wired to think they are the exception. Require the evidence to be strong enough to overcome the prior probability that you are simply rationalizing an exception.

  ### Part 5: The Prediction

  You asked for a prediction on a new case:
  *> A forecaster who has a specific, articulable reason to think this time is different.*

  **Application of the Repaired Principle:**
  1.  **Articulable?** Yes (specific reason).
  2.  **Narrows Reference Class?** This is the trap. Does the reason actually narrow the class, or does it just describe the current instance?
      *   *Scenario A:* "The model doesn't account for X." (This narrows the class to "predictions by models missing X.") -> **Trust Inside View.**
      *   *Scenario B:* "I just feel the momentum has shifted." (Not articulable). -> **Defer.**
      *   *Scenario C:* "This situation is unique." (Fails #3; if it's unique, there is no base rate, but claiming uniqueness is often a bias). -> **Defer.**

  **My Prediction:**
  If the forecaster can say, *"The base rate relies on condition Y being stable, but I have evidence condition Y has changed structurally,"* you should **trust the inside view.**

  Why? Because they have identified a **broken reference class.** The outside view is only valid if the current case belongs to the class. If the forecaster proves the class definition no longer applies (the "regime change" argument), the outside view becomes garbage data.

  **However,** as an epistemologist, I must warn you: This is the most dangerous place for a smart person. This is exactly how intelligent people talk themselves into catastrophes ("This time is different").
  **Final Advice:** Trust the inside view *only if* the articulable reason is falsifiable *before* the outcome is known. If the reason can only be verified after the fact, you are back to "vibes," no matter how smart the forecaster is.

  ### Summary for your Writing
  When you write about this, the tension isn't really "Inside vs. Outside." It is **"Average Information" vs. "Specific Information."**
  The outside view is just the inside view of everyone else, aggregated. You only override the aggregate when you possess specific, causal information that the aggregate does not see. If your "inside view" is just a re-interpretation of the same data everyone else has, you are not being insightful; you are being arrogant.

  Does that align with the story you're trying to tell?
