answer: |-
  A theory of deduction must explain how we are entitled to move from premises to conclusion without begging the question or collapsing into arbitrariness, but it cannot simultaneously satisfy the demands of non-circular justification, meaning-constitutive rules, and substantive logical disagreement.

  Here is the spec you can hand to a first-year student, broken down into the five non-negotiable requirements, the one constraint that does the heavy lifting, the impossible trinity that breaks the system, and the places where the map is likely wrong.

  ### The Desiderata List

  **1. The Normative Entitlement Requirement**
  *   **The Requirement:** The theory must explain why you are *allowed* to infer the conclusion, not just why the conclusion is true if the premises are.
  *   **The Case:** A valid argument can exist without anyone ever thinking it. Justification is about the agent's right to make the move. If logic is just a description of patterns (like physics describing gravity), it cannot tell you what you *ought* to believe.
  *   **The Distinction to Police:** Validity (a property of the argument) versus Justified Inference (a property of the act). Do not collapse 'MP is valid' into 'You are justified in using MP'.

  **2. The Carroll Constraint (No Regress)**
  *   **The Requirement:** The justification for an inference rule cannot itself be a premise in the inference.
  *   **The Case:** Carroll's Tortoise shows that if you treat the rule of inference as another premise (e.g., 'If P and If P then Q, then I must infer Q'), you need a further rule to apply that premise, ad infinitum. You cannot reason someone into adopting a basic rule by giving them a reason for it, because giving a reason already presupposes the ability to reason.
  *   **The Distinction to Police:** Accepting a conditional versus inferring by means of it. The rule is a license to move, not a statement of fact.

  **3. The Tonk Constraint (Non-Triviality)**
  *   **The Requirement:** The theory must provide a filter that distinguishes valid rules (like MP) from arbitrary ones (like Prior's 'tonk').
  *   **The Case:** Prior showed that if you simply stipulate introduction and elimination rules, you can define a connective 'tonk' that allows you to infer anything from anything. A theory that says 'rules are justified because we stipulate them' fails because it cannot rule out tonk.
  *   **The Distinction to Police:** Syntactic permission versus Semantic harmony. Just because you can write the rule down doesn't mean it earns its keep.

  **4. The Harman Constraint (Feasibility)**
  *   **The Requirement:** The theory must not demand that agents believe all the consequences of their beliefs.
  *   **The Case:** Finite minds cannot achieve closure. If logic norms belief directly ('You ought to believe all consequences'), everyone is irrational all the time. Logic guides reasoning, but it is not a complete map of it.
  *   **The Distinction to Police:** Logical consequence versus Reasoning norms. Do not collapse 'Q follows from P' into 'You ought to believe Q'.

  **5. The Learning Constraint (Epistemic Access)**
  *   **The Requirement:** It must be possible to come to know the rules without already presupposing them.
  *   **The Case:** If you need to use MP to justify MP, you haven't justified it to someone who doesn't already grant it. We seem to learn logic; a theory that makes logic inexplicable to the uninitiated fails to account for acquisition.
  *   **The Distinction to Police:** Basic rules versus Derived rules. Derived rules can be justified by basic ones; basic rules need a different kind of warrant (meaning, intuition, or default entitlement).

  ### The Heavy Lifter

  The **Tonk Constraint** does the most work in ruling candidates out. Many theories fail here. Pure conventionalism fails because it allows tonk. Pure psychological descriptivism fails because it allows bad habits to count as rules. Any theory that treats logic as merely syntactic manipulation without a semantic or proof-theoretic anchor (like Dummett's harmony or conservativity) will crash on this rock. It forces you to say something about *meaning* or *truth*, not just form.

  ### The Impossible Trinity

  You suspected the fault line lies between meaning-constitutivity and logical disagreement; you are correct, but there is a third vertex involving circularity. You cannot jointly satisfy these three:

  1.  **Meaning-Constitutivity:** The justification for basic rules is that they constitute the meanings of the connectives (the Inferentialist line).
  2.  **Non-Circular Justification:** The justification for these rules must not presuppose the rules themselves (Dummett's demand).
  3.  **Substantive Disagreement:** When a classical logician and an intuitionist disagree about Excluded Middle, they are disagreeing about the same connective, not talking past each other.

  **Why they clash:** If (1) is true, then changing the rules changes the meaning. Therefore, the intuitionist means something different by 'or' than the classical logician. If they mean different things, (3) is false; their disagreement is merely verbal. If you insist on (3) (that they are disagreeing about the same thing), then meaning cannot be fully constituted by the rules (denying 1). If you try to hold (1) and justify it without circularity (2), you face Carroll's regress: you cannot justify the meaning-constituting rules without using them. Most inferentialists sacrifice (3) to save (1) and (2), accepting that logical revision is actually meaning revision.

  ### Weak Points and Assumptions to Drop

  **Where this list is most likely wrong:**
  The **Learning Constraint (5)** and the demand for **Non-Circular Justification (part of the Trinity)** are the weakest links. There is a strong case, advanced by people like Timothy Williamson, that basic logical rules are *default entitled*. We are justified in using them unless we have a specific defeater, not because we have a prior proof of them. Insisting on non-circular justification might be a foundationalist prejudice that no epistemology can satisfy. If you drop the demand for non-circularity, the Trinity dissolves, but you lose the ability to convince a sceptic who doesn't already reason like you.

  **Framing assumptions you should drop:**
  Drop the idea that **Logic is a direct guide to belief revision**. Harman is right on this; holding students to logical closure is a category mistake. Logic provides norms of consistency and coherence, not a prescription for every belief update. Also, drop the assumption that there is a single **True Logic** waiting to be found. The existence of rival logics that satisfy the Tonk and Carroll constraints suggests pluralism might be the cost of satisfying the spec.

  **What would change my mind:**
  A demonstration that **normative entitlement** can be secured without appealing to meaning or truth conditions. If someone could show that the mere practice of inference generates its own normativity without needing a semantic anchor (a robust pragmatist solution to Tonk), then the Meaning-Constitutivity vertex of the Trinity could be softened, allowing for substantive disagreement without changing the subject. Until then, the trinity holds.
