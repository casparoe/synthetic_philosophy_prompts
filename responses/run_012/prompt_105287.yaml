answer: |-
  This is the Sorites Paradox applied to preference, formally known in ethics and decision theory as a **Spectrum Argument** that results in **Intransitive Preferences**.

  Your description matches the classic Sorites structure perfectly in its mechanics: a chain of negligible differences accumulates into a massive difference that contradicts the local judgments. In the "heap" puzzle, removing one grain doesn't stop something from being a heap, yet removing enough grains does. In your friend's spreadsheet, paying a little more for a slightly shorter commute seems worth it at every step, yet paying the maximum for the minimum commute seems absurd. The logical shape is identical: the failure of a property (being a heap / being the preferred choice) to hold across a continuum despite holding at every incremental step.

  However, your description comes off the rails of the *classic* Sorites in one crucial technical detail: the nature of the judgment. The traditional Sorites relies on **indifference** or vague predicates (you cannot tell the difference between heap-n and heap-n+1). Your friend, however, expresses **strict preference** at every rung ("she'd take the cheaper one"). In standard decision theory, if you strictly prefer B to A, and C to B, you *must* prefer C to A (transitivity). By preferring A to Z despite the chain, she isn't just dealing with vagueness; she is violating the axioms of rational choice. This specific variant is often called the **Paradox of Intransitive Preferences** or, in moral philosophy, **Temkin's Spectrum Argument**.

  This is not about values being "incomparable." Incomparability means you cannot say A is better than B, nor B better than A, nor that they are equal. Your friend *can* compare them; she just compares them in a way that doesn't stack. The problem isn't a lack of information; it's that human valuation is often non-linear. We weigh marginal changes differently depending on where we are on the spectrum (a concept tied to the **Just Noticeable Difference** in psychology). We treat a 5-minute difference differently when the commute is 10 minutes versus when it is 110 minutes, even if the math is identical.

  If you need a specific label for this exact shape to use in the wild, call it a **Preference Spectrum Paradox**. Its edges are defined by the threshold of significance:
  *   **Inside the shape:** The steps are small enough that local intuition overrides global logic (e.g., $1 vs $1.01, or 10 mins vs 15 mins).
  *   **Outside the shape:** The steps are large enough that transitivity holds intuitively (e.g., preferring $1000 to $1, and $1 to $0, makes preferring $1000 to $0 obvious).
  *   **Borderline case:** The point where the step size becomes "noticeable" enough that refusing the trade feels irrational immediately, breaking the chain before the absurd conclusion is reached.

  The honest answer is that yes, this is the heap puzzle in different clothes, but worn by a decision-maker rather than a linguist. The "heap" is no longer a pile of sand, but a pile of rational justifications that collapse under their own weight.
