prompt: |-
  So I've got this weird little side project and I could use your help. I don't have any philosophy training — I'm just a person who's had chronic pain for years and got kind of obsessed with reading about people who report feeling pain that doesn't bother them. Like, they'll point right at it and say "yeah, it hurts, there," but they don't seem to mind it and don't pull away — this happens after certain kinds of brain injury, apparently. And then the mirror-image thing I only half understand, where someone supposedly has the unbearable quality without the sharp "there it is in my hand" part. Plus my own experience of pain during a really hard workout being somehow fine, even good, and my grandad saying the memory of how bad the pain was stuck with him long after it stopped. I've been trying to figure out what I actually think makes pain bad in the first place — is it the hurt itself, or the unplesantness that comes with it, or the fact that we want it gone, or the way it grabs your attention and won't let you do anything else? I keep landing in different spots depending on which example I'm chewing on, which I guess means I don't have one consistent view.

  So here's what I'm after: a "which theory of why pain is bad do you actually hold?" quiz I can pass around to friends. Eight to ten questions, each a little concrete case or question with two or three answer options, and phrased so people answer about the case and not about a label — no question that just asks "is pain intrinsically bad?" and expects them to know the vocabulary. The cases I really want in there: the hurts-but-doesn't-mind person; the unbearable-but-not-localized person; pain you welcome or seek out on purpose; pain you'd rate as very intense but not actually bad; and maybe one where the pain itself is gone but what haunts you is remembering how awful it was. Then a scoring key that maps the answer patterns onto the real positions — the one where the badness just is the sensation, the one where it's the unpleasantness or affect that's separable from it, the "it's bad because we want it gone" desire-ish view, the view that it's really about the interruption and the attention-grabbing, and any "it isn't bad in itself at all, only through its consequences" view. If some combination of answers doesn't line up with anything a real person holds, tell me that too, and say whether it's actually incoherent or just nobody's bothered to defend it. And if two of the positions can't be told apart by any question you can think of, just flag them rather than pretending they're distinct. I'm not looking for a reading list or citations, just the quiz and the key.
