  2.  **Deconstruct the Philosophical Positions (Mental Sandbox):**
      *   *Sensory View (Strong Intentionalism/Sensationism):* Pain is bad because of the raw feel. If it hurts, it's bad. (Struggles with pain asymbolia).
      *   *Affective View (Separatism):* Pain has two components: sensory (location, intensity) and affective (ouchiness, suffering). Badness lies in the affective. (Fits asymbolia well).
      *   *Desire View (Attitudinal):* Pain is bad because we have a negative attitude toward it (we want it to stop). If you don't want it to stop, it's not bad.
      *   *Attention/Interference View:* Pain is bad because it hijacks your mind, stops you from living/acting.
      *   *Instrumental/Consequentialist:* Pain isn't bad in itself, only because of what it causes (damage, distress, memory).

      *Potential Overlap:* Desire and Affective views are very close. If I hate the sensation, do I hate it because it's unpleasant (Affective) or do I hate it and that *makes* it unpleasant (Desire)? I need to make sure the quiz distinguishes them or acknowledges the blur.
      *Potential Overlap:* Attention and Instrumental. Interruption is a consequence.
      *Incoherence:* Claiming pain is bad *only* because of the sensation, but admitting someone can feel the sensation without minding it without it being "less bad."

