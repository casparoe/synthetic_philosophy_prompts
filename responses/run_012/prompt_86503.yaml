      *   **Scoring Key Requirements:**
          *   Map answers to real philosophical positions:
              *   Sensory View (Badness = Sensation).
              *   Affective View (Badness = Unpleasantness/Suffering, separable from sensation).
              *   Desire View (Badness = Wanting it gone).
              *   Attention/Interference View (Badness = Disruption of agency/focus).
              *   Consequentialist/Instrumental View (Badness = Only due to consequences).
