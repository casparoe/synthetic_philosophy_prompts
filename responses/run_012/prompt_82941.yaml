answer: |-
  I move a paper on the desk by hand,
  And shift the time we meet by half a day,
  No ripple strikes the far and distant land.

  By half a day the student walks away,
  And misses one who might have changed his view,
  Or meets another on the common way.

  Changed view or not, the errors cancel true,
  Within the room the air remains the same,
  No net effect that we can count as true.

  Remains the same, the ledger keeps no name,
  For every loss a gain is roughly found,
  The local light is all we can proclaim.

  But one goes forth to walk on holy ground,
  And trips upon a stone no eye could mark,
  Where empires rise and fall without a sound.

  Without a sound the spark enters the dark,
  A single breath that feeds a coming fire,
  Now local gains are ash beside the spark.

  That single breath ignites a vast desire,
  One life saved here is nothing to the burn,
  The small account is swallowed by the pyre.

  Beside the pyre the logic starts to tire,
  Not because the facts are hid from sight,
  But values break beneath the heavy wire.

  The facts are clear, illuminated bright,
  How many pains balance a heaven's gate?
  The scale itself dissolves in too much light.

  A heaven's gate opens wide to swallow fate,
  Not unknown facts, but weights we cannot hold,
  The known consequence arrives too late.

  We cannot hold the measure in the mold,
  Even were the map drawn clear and full,
  The value breaks the compass and the fold.

  Drawn clear and full, the silence starts to lull,
  We stand before the scale without a name,
  The chain hangs loose, the final weight is null.
