prompt: |-
  I write about science and ideas for a general-interest outlet — long features, mostly — and I keep ending up in the same spot. Some economist or historian or behavioral scientist tells me that a region's, or a country's, or a company's culture explains something big: why growth stalled there, why the innovation clustered here, why these people save and those people don't. And I keep noticing that by the time the piece is filed, culture has quietly become the thing that's left over after you account for everything you can actually measure, and it's doing an enormous amount of causal work with almost no scrutiny. Weber is usually hovering in the background, sometimes named, sometimes just a vibe.

  I want a procedure I can run, fast, on a specific claim, before I write a sentence of the form: this culture caused that outcome. Not a seminar on Weber — a checklist.

  Some framing I want you to build on, because I think these are the load-bearing bits and I dont want them simplified away. Weber, as I understand him, wasn't really offering a covering-law causal claim; he was reconstructing an elective affinity between a set of religious ideas and a set of economic practices, and he was insistent that the ideas needed carriers — social strata, congregations, families, institutions — or nothing happens. His image, roughly, is that material interests supply the motive power and ideas set the track, like a switchman. There's also a rival reading of his own historical case that I keep running into: that what looked like a religious ethic doing the work was really literacy doing the work, since the Reformation pushed people to read scripture for themselves, and literate populations are just better at the stuff that looks like a work ethic. And I know enough to know that when you compare places that turned Protestant with neighboring places that didn't, the economic story gets a lot shakier than the textbook version suggests.

  So: act as a philosopher of social science who also knows the empirical literature on this. Think carefully and slowly. Before you write the procedure, brainstorm for a bit — in the output, briefly — the distinctions a working journalist has to keep straight here: causal versus interpretive adequacy; a value being present versus a value actually doing work; culture as cause versus culture as a label for a bundle of unmeasured institutions; a mechanism story versus a correlation story; and what would count as evidence against a culture claim. Then give me the procedure.

  What I need from it:

  - 8 to 12 questions, in the order I should ask them, each phrased so I can answer it with the material in front of me — a paper, a book, an interview, a dataset, a press release.
  - For each: what a pass looks like, what a partial looks like, what a fail looks like. Where a fail is fatal, say so and say stop.
  - A stopping rule on each branch, so I know when to drop the causal framing and write something weaker instead — a correlation, an interpretive account, a contested thesis, a story about what people believed about themselves.
  - Mark clearly every step where I've left rule-application and entered judgment territory. I want the procedure to be honest about where it stops being a procedure.
  - It has to survive contact both with a claim where the culture variable is doing real explanatory work and with one where it's a fig leaf.

  Then run it, out loud, on three cases:

  1. The classic historical thesis itself — Protestant ethic, rise of capitalism — as the thing I'm about to write a feature about. I suspect the procedure will tell me I can't write the strong causal version, and if that's where it lands, say so and tell me exactly what I can write instead.
  2. A contemporary claim of the form: this country or region is poorer because its culture doesn't value deferred gratification, or long-term investment, or impersonal trust. Make up a plausible version; don't lean on a specific study I'd have to go track down.
  3. A claim at the scale of a firm or a small place: this company's, or this town's, culture of X explains why it outperformed its neighbor, where the two are otherwise similar on paper.

  For each run, show the questions being answered, where the claim passes, where it stalls, and where you'd flag that the honest version of the story is alot weaker than the pitch I got.

  Finally, tell me what the procedure can't do — the claims it will wave through that it shouldn't, and the ones it will kill that deserve a hearing — and give me two or three sentences I could paste into a draft to signal that a culture claim is contested without turning the piece into a methodology lecture.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** A science/ideas journalist writing long features.
      *   **Problem:** Keeps encountering "culture" as a residual explanation (the "everything else left over" variable) doing heavy causal lifting without scrutiny. Often invokes Weber (sometimes explicitly, sometimes implicitly).
      *   **Goal:** A fast, actionable checklist/procedure (8-12 questions) to evaluate culture-causation claims *before* writing.
      *   **Framing Requirements:**
          *   Acknowledge Weber's nuance (elective affinity, carriers, switchman metaphor: interests = power, ideas = tracks).
          *   Acknowledge rival readings (e.g., literacy vs. religious ethic).
          *   Distinguish: causal vs. interpretive adequacy, value present vs. value working, culture as cause vs. culture as label for institutions, mechanism vs. correlation, evidence against.
          *   Output format: Brainstorm distinctions first, then the Procedure (8-12 questions with Pass/Partial/Fail criteria, stopping rules, judgment flags), then run the procedure on 3 specific cases (Protestant Ethic, National Development, Firm/Town), then limitations + draft sentences.
      *   **Tone:** Philosophical social scientist + empirical literate + practical for a journalist. "Think carefully and slowly."

  2.  **Deconstruct the "Culture as Cause" Problem:**

      *   *The Residual Problem:* Culture is often the error term. If $Y = \alpha + \beta_1 X_1 + \beta_2 X_2 + \epsilon$, and $X$'s are institutions/geography/policy, $\epsilon$ gets labeled "culture."
      *   *The Weber Nuance:* It's not $Culture \rightarrow Outcome$. It's $Culture + Carriers + Interests \rightarrow Outcome$. It's about *affinity*, not just force.
      *   *The Literacy Rival:* Is it the *ethic* or the *skill* (reading) that came with the religion?
      *   *The Mechanism:* How does a shared belief become an individual action? (Sanctions? Internalization? Coordination?)
      *   *The Counterfactual:* What if the culture was different but institutions same? Or culture same but institutions different?

  3.  **Drafting the Brainstorm (Distinctions):**

      *   Need to keep this brief but dense.
      *   *Causal vs. Interpretive:* Does it *make* things happen, or does it help us understand how people *see* things happening?
      *   *Presence vs. Work:* Everyone values hard work. Does that value *distinguish* the successful group from the unsuccessful one?
      *   *Culture vs. Institutions:* Is "trust" a cultural trait or the result of a reliable court system?
      *   *Mechanism vs. Correlation:* Do we know *how* the value travels from head to hand?
      *   *Falsification:* What would prove this wrong?

  4.  **Developing the Procedure (The Checklist):**

      *   Need 8-12 questions. Logical flow is essential.
      *   *Flow:* Definition -> Measurement -> Alternative Explanations -> Mechanism -> Carriers -> Counterfactuals -> Falsification.
      *   *Constraint:* Must indicate where judgment is required vs. rule application.
      *   *Constraint:* Must have Pass/Partial/Fail and Stopping Rules.

      *   *Drafting Questions:*
          1.  Definition (Is "culture" defined or just vibes?)
          2.  Variation (Does culture vary where outcome varies?)
          3.  Residual Check (Is culture just the unmeasured stuff?)
          4.  Institutions (Can institutions explain it?)
          5.  Mechanism (How does belief become action?)
          6.  Carriers (Who transmits the culture? Weber's point.)
          7.  Timing (Did culture precede outcome?)
          8.  Rival Hypotheses (e.g., Literacy vs. Ethic)
          9.  Counterfactual (Same culture, different outcome?)
          10. Falsification (What kills the claim?)

      *   *Refining for Journalist Utility:* Make them punchy. "Can you point to it?" "Who carries it?" "What kills it?"

  5.  **Running the Procedure (The 3 Cases):**

      *   *Case 1: Protestant Ethic.*
          *   Expectation: Fails on "Residual" and "Rival Hypotheses" (Literacy).
          *   Outcome: Shift to "Elective Affinity" or "Self-Understanding."
      *   *Case 2: National Development (Deferred Gratification).*
          *   Expectation: Fails on "Institutions" (is it trust or contract law?) and "Variation" (do poor people actually discount the future more, or is risk higher?).
          *   Outcome: Reframe as risk environment, not culture.
      *   *Case 3: Firm/Town (Outperforming Neighbor).*
          *   Expectation: More likely to pass "Carriers" and "Mechanism" (specific practices), but watch out for Survivorship Bias.
          *   Outcome: Plausible, but needs specific practices identified.

  6.  **Limitations & Draft Sentences:**

      *   *Limitations:* Procedure might kill true but hard-to-measure cultural effects. Might let through "strong culture" stories that are actually just "strong management."
      *   *Sentences:* Need to be graceful hedging. "While X is often cited..." "Scholars debate..."

  7.  **Review against Constraints:**

      *   *8-12 questions?* Yes.
      *   *Pass/Partial/Fail?* Yes.
      *   *Stopping rules?* Yes.
      *   *Judgment flags?* Need to explicitly mark these.
      *   *Weber framing?* Ensure "switchman" and "carriers" are in the questions.
      *   *Brainstorm first?* Yes.
      *   *Three runs?* Yes.
      *   *Limitations + Sentences?* Yes.

  8.  **Self-Correction/Refinement during drafting:**

      *   *Critique:* Is the procedure too academic?
      *   *Fix:* Phrase questions as things a journalist asks an author or looks for in a text. "Does the author define..." instead of "Is the construct valid..."
      *   *Critique:* Did I capture the Weber "switchman" idea?
      *   *Fix:* Ensure Question 6 (Carriers) and Question 5 (Mechanism) reflect that ideas need vehicles and interests need tracks.
      *   *Critique:* Is the "Judgment Territory" clear?
      *   *Fix:* Use bold brackets like **[JUDGMENT CALL]** to highlight where the checklist ends and thinking begins.

  9.  **Final Polish:** Check tone. It should be professional, slightly skeptical, but constructive. Not cynical, just rigorous. (Proceed to generate output).

  *(Self-Correction during final output generation)*: Make sure I don't just say "Weber says X." I need to operationalize Weber. The "Carriers" question is the best place for this. The "Switchman" metaphor fits best in the Mechanism question (ideas channeling interests).

  Let's finalize the 10 questions.
  1. Definition/Measurement.
  2. Variation (Covariation).
  3. Residual Check (The "Leftover" test).
  4. Institutional Confound.
  5. Mechanism (The Switchman).
  6. Carriers (The Vehicle).
  7. Timing/Pre-existence.
  8. Rival Skills (The Literacy test).
  9. Counterfactual (Same culture, diff outcome).
  10. Falsification.

