answer: |-
  ### Brainstorm: The Load-Bearing Distinctions

  Before we get to the checklist, here are the five distinctions you need to hold in your head while you run it. If you blur these, the checklist won't save you.

  1.  **Causal vs. Interpretive Adequacy:** A claim has *causal* adequacy if changing the culture changes the outcome. It has *interpretive* adequacy if it makes the actors' behavior intelligible to us (e.g., "They didn't invest because they believed wealth was sinful"). Weber was often aiming for the latter to explain the *direction* of action, not necessarily the *volume* of output. If a source conflates these, the causal claim is suspect.
  2.  **Value Present vs. Value Working:** Almost everyone claims to value hard work, trust, or family. The question isn't "Do they have this value?" but "Does the *variation* in this value explain the *variation* in the outcome?" If Group A and Group B both value thrift, but only Group A saves, thrift isn't the cause.
  3.  **Culture as Cause vs. Culture as Label:** Often "culture" is a nickname for a bundle of unmeasured institutions. "High trust" might just mean "the courts enforce contracts reliably." If you remove the courts and the trust vanishes, it wasn't culture; it was institutional incentive.
  4.  **Mechanism vs. Correlation:** A correlation says "Protestant regions are richer." A mechanism says "Protestant theology reduced the psychological cost of reinvestment, which was transmitted via lay elders who monitored behavior." Without the *how*, it's magic.
  5.  **Evidence Against:** A culture claim is only scientific if you can imagine evidence that would falsify it. If every possible outcome (saving *or* spending, innovating *or* conserving) can be explained by "culture," the claim is unfalsifiable and therefore useless.

  ***

  ### The Procedure: The "Culture-Cause" Stress Test

  **Instructions:** Run these 10 questions in order against the source material (paper, interview, book). Answer **Pass**, **Partial**, or **Fail**. Follow the stopping rules.

  **1. The Definition Test**
  *Question:* Does the author define "culture" as specific, measurable beliefs/norms, or is it a catch-all for "how things are done here"?
  *   **Pass:** Specific norms identified (e.g., "belief in predestination," "norm of bilateral kinship").
  *   **Partial:** Vague but bounded (e.g., "social capital," "informal institutions").
  *   **Fail:** Synonymous with outcome (e.g., "they failed because they have a failure culture").
  *   **Stop Rule:** If **Fail**, stop. You cannot write a causal claim. Reframe as "local conditions."

  **2. The Variation Test**
  *Question:* Does the cultural trait vary across the groups being compared, or is it assumed constant?
  *   **Pass:** The trait is high in Group A (success) and low in Group B (stall), empirically shown.
  *   **Partial:** Trait is assumed different based on stereotypes or historical reputation.
  *   **Fail:** Trait is present in both, but outcome differs.
  *   **Stop Rule:** If **Fail**, the culture variable cannot explain the difference. Drop causal claim.

  **3. The Residual Check**
  *Question:* Is "culture" being used to explain the variance left over after institutions, geography, and policy are accounted for?
  *   **Pass:** Culture is tested *alongside* institutions; institutions are controlled for.
  *   **Partial:** Institutions are mentioned but not measured; culture fills the gap.
  *   **Fail:** Culture is explicitly defined as "the part we can't measure."
  *   **Stop Rule:** If **Fail**, label the claim "speculative." Do not assert causality. **[JUDGMENT CALL: If Partial, proceed but flag heavily.]**

  **4. The Institutional Confound**
  *Question:* Could a formal rule or incentive structure explain the behavior better than an internalized value?
  *   **Pass:** Author addresses this (e.g., "Even when taxes were equal, behavior differed").
  *   **Partial:** Author acknowledges institutions matter but insists culture is primary.
  *   **Fail:** Author ignores obvious institutional differences (e.g., property rights, legal enforcement).
  *   **Stop Rule:** If **Fail**, reframe: "Institutions may have shaped what looks like culture."

  **5. The Switchman Mechanism (Weber's Test)**
  *Question:* Does the author explain *how* the idea channels material interest, rather than replacing it? (Ideas set the track; interests supply the power).
  *   **Pass:** Explains how the belief changes the *direction* of a rational pursuit (e.g., "Profit was sought not for consumption but as proof of grace").
  *   **Partial:** Suggests people act against interest due to culture.
  *   **Fail:** Suggests culture overrides all material incentive (e.g., "They stayed poor because they valued leisure").
  *   **Stop Rule:** If **Fail**, the model is psychologically implausible. Reframe as "constraints on choice."

  **6. The Carrier Test**
  *Question:* Who specifically transmits and enforces this culture? (Families, congregations, schools, peers?)
  *   **Pass:** Specific carriers identified (e.g., "Lay elders monitored spending").
  *   **Partial:** Vague transmission ("passed down through generations").
  *   **Fail:** No mechanism of transmission (culture floats in the air).
  *   **Stop Rule:** If **Fail**, the causal chain is broken. Culture cannot replicate without carriers.

  **7. The Timing Test**
  *Question:* Is there evidence the cultural trait preceded the economic outcome?
  *   **Pass:** Longitudinal data or historical record shows trait before growth.
  *   **Partial:** Cross-sectional data (trait and outcome measured at same time).
  *   **Fail:** Outcome is used to infer the trait (e.g., "They are rich, so they must value work").
  *   **Stop Rule:** If **Fail**, you have reverse causality. Reframe as "outcome reinforcing narrative."

  **8. The Literacy/Skill Rival**
  *Question:* Has the author ruled out the possibility that a *skill* (like literacy, numeracy) acquired alongside the culture is the real driver?
  *   **Pass:** Controls for education/skills; culture effect remains.
  *   **Partial:** Acknowledges the rival but dismisses it theoretically.
  *   **Fail:** Ignores the skill confound (common in religious/ethnic claims).
  *   **Stop Rule:** If **Fail**, you must report the rival hypothesis as equally plausible.

  **9. The Counterfactual Test**
  *Question:* Is there a case where the culture existed but the outcome did *not*?
  *   **Pass:** Author addresses negative cases (e.g., "Protestant regions that didn't grow").
  *   **Partial:** No negative cases discussed.
  *   **Fail:** Author claims the culture *guarantees* the outcome.
  *   **Stop Rule:** If **Fail**, the claim is deterministic myth. Add "necessary but not sufficient."

  **10. The Falsification Test**
  *Question:* What evidence would the author accept as proof they are wrong?
  *   **Pass:** Specific data point that would overturn the thesis.
  *   **Partial:** "More research needed."
  *   **Fail:** "That data is anomalous/unimportant."
  *   **Stop Rule:** If **Fail**, this is ideology, not social science. Write as "belief system," not "analysis."

  ***

  ### Running the Procedure

  Here is how the checklist performs on your three requested cases.

  #### Case 1: The Protestant Ethic & The Rise of Capitalism
  *The Pitch:* You are writing a feature on how Calvinist theology created modern capitalism.
  *   **Q1 (Definition):** **Pass.** "Predestination," "Calling," "Asceticism" are specific.
  *   **Q2 (Variation):** **Partial.** Some Catholic regions developed capitalism later; some Protestant regions didn't.
  *   **Q3 (Residual):** **Fail.** In modern econometric re-tests, "Protestantism" often loses significance when controlling for human capital.
  *   **Q4 (Institutions):** **Fail.** Protestant regions often had different legal structures (property rights) independent of theology.
  *   **Q5 (Switchman):** **Pass.** Weber's strength. Explains *direction* of profit (reinvestment vs. consumption).
  *   **Q6 (Carriers):** **Pass.** Congregations, family discipline, lay elders.
  *   **Q7 (Timing):** **Partial.** Capitalist practices existed in Italian city-states prior to Reformation.
  *   **Q8 (Skill Rival):** **Fail.** Protestantism mandated literacy (read the Bible). Literacy correlates strongly with growth. Hard to disentangle.
  *   **Q9 (Counterfactual):** **Fail.** Many Protestant areas remained agrarian/poor for centuries.
  *   **Q10 (Falsification):** **Partial.** Weber admits other factors (coal, law) were necessary.

  **Verdict:** The strong causal claim ("Protestantism caused Capitalism") **fails**.
  **Where it stalls:** Q3 (Residual), Q4 (Institutions), Q8 (Skill Rival).
  **The Honest Story:** You cannot write that the ethic *caused* the system. You *can* write that the ethic provided a **legitimating narrative** for a system emerging due to other causes. It made capitalism *culturally permissible* for a specific class.
  **Reframe:** "How a religious anxiety about salvation accidentally provided the moral cover for modern finance." Focus on the *affinity*, not the *engine*.

  #### Case 2: National Development & Deferred Gratification
  *The Pitch:* "Country X is poorer than Country Y because its culture values immediate consumption over long-term investment."
  *   **Q1 (Definition):** **Partial.** "Deferred gratification" is psychological, often measured by survey proxies.
  *   **Q2 (Variation):** **Pass.** Survey data often shows differences in time preference.
  *   **Q3 (Residual):** **Fail.** Often used when GDP models don't fit.
  *   **Q4 (Institutions):** **Fail.** If inflation is 50% and banks are unstable, *not* investing is rational. Is it culture or risk?
  *   **Q5 (Switchman):** **Fail.** Implies people act against material interest (investing in a collapsing bank) due to values.
  *   **Q6 (Carriers):** **Fail.** How is this transmitted? Schools? Parents? Unclear.
  *   **Q7 (Timing):** **Fail.** Did the culture exist before the poverty, or did poverty create high discount rates?
  *   **Q8 (Skill Rival):** **Partial.** Financial literacy often correlates with "patience."
  *   **Q9 (Counterfactual):** **Fail.** Immigrants from Country X often invest heavily in Country Y.
  *   **Q10 (Falsification):** **Fail.** Usually treated as a deep, unchangeable trait.

  **Verdict:** **Fatal Fail** on Q4 and Q7.
  **Where it stalls:** The claim confuses *rational response to risk* with *cultural pathology*.
  **The Honest Story:** People in Country X aren't culturally impatient; they are facing high institutional risk. When they move to stable institutions, behavior changes.
  **Reframe:** "Why high-risk environments look like low-trust cultures." The story is about **incentives**, not values.

  #### Case 3: Firm/Town Outperformance
  *The Pitch:* "Town A outperformed neighboring Town B because Town A has a culture of collaboration."
  *   **Q1 (Definition):** **Partial.** "Collaboration" is vague but observable.
  *   **Q2 (Variation):** **Pass.** Town A collaborates; Town B competes.
  *   **Q3 (Residual):** **Partial.** Hard to control for all local variables, but plausible.
  *   **Q4 (Institutions):** **Pass.** If both towns have same laws/taxes, institutions are controlled.
  *   **Q5 (Switchman):** **Pass.** Collaboration reduces transaction costs, channeling interest toward joint ventures.
  *   **Q6 (Carriers):** **Pass.** Chamber of commerce, local Rotary, specific founders who set norms.
  *   **Q7 (Timing):** **Pass.** Norms established before the boom.
  *   **Q8 (Skill Rival):** **Partial.** Maybe Town A just had one genius entrepreneur.
  *   **Q9 (Counterfactual):** **Partial.** Other collaborative towns exist that failed (bad luck?).
  *   **Q10 (Falsification):** **Partial.** "If collaboration stopped, growth would stall."

  **Verdict:** **Pass with Reservations.**
  **Where it stalls:** Q8 (The "Genius" confound). Small N problems make causality hard.
  **The Honest Story:** This is the most plausible use of "culture." In small systems, informal norms *are* institutions.
  **Reframe:** "How informal norms substituted for formal scale." Acknowledge survivorship bias (we only study the winning town).

  ***

  ### Limitations & Drafting

  **What this procedure misses:**
  1.  **Slow-Moving Culture:** It may kill claims where culture changes over centuries (too slow to measure in a dataset) but still exerts pressure.
  2.  **The "Strong" Culture that is actually "Strong Management":** It might let through firm-culture claims that are actually just "the CEO fires people who don't comply." That's power, not culture.
  3.  **The True Believer:** It cannot detect when an author is emotionally invested in the cultural narrative (e.g., national pride).

  **Sentences for your Draft:**
  When the procedure tells you the causal claim is too strong, but the story is still interesting, paste one of these into your narrative to signal rigor without boring the reader:

  1.  *"Economists debate whether these values drove the growth, or simply grew alongside it; what is clear is that they provided a shared language for risk."*
  2.  *"While it is tempting to call this a cultural trait, the behavior vanishes when institutional incentives change, suggesting the 'culture' is actually a rational adaptation to uncertainty."*
  3.  *"Weber argued ideas act like switchmen, directing the train of material interest; here, the tracks were laid by policy, but the signal to move came from a shared belief."*
