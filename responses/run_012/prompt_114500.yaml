answer: |-
  Subject: Re: Your brother's book

  I am so sorry you are carrying this. It is an immense weight to hold the legacy of someone you loved while also trying to protect the truth of who they were, especially when the person you are negotiating with is grieving the same loss in a completely different way. You asked for an actual argument rather than a platitude, so I am going to give you my honest thinking on this, though I know none of it makes the pain lighter.

  Your friend in the philosophy program is right about the nature of writing. There is the author as architect, who plans the structure, and there is the author as medium, who channels things they might not fully understand until the words are on the page. A writer can deny a biographical reading until they are blue in the face, and yet the pain in the text can still be their own pain. The fact that your brother hid the manuscript suggests he knew there was something raw in there that he was not ready to show, or perhaps never intended to show. So when your mother reads that letter and hears her son's voice, she is not hallucinating. She is recognizing the emotional truth beneath the fictional surface. In that sense, her reading is valid for her. It is how she is making sense of the loss. But validity in grief is not the same as validity in publication.

  This is where I think you have to draw a line, not because she is wrong, but because you are the steward of the work itself. If you print that letter alone in the memorial program, you are stripping it of its context. You are taking a piece of fiction and reclassifying it as a factual document. Once you do that, you cannot undo it. Every future reader of that program, and every future reader of the book if it is marketed as his last word, will start from the assumption that this is a confession rather than a story. It collapses the character into the author completely. Your brother hated that idea. He believed in the craft of fiction, in the separation between the creator and the creation. To honor him as a writer means protecting that separation, even if it feels cold to do so right now.

  I think the answer to whose reading should win is neither. It should not be your reading alone, because you are too close to the man he was, and it should not be her reading alone, because she is too close to the way he died. The reading that should win is the text's reading. The text is a novel. It is ninety thousand words of crafted narrative, not a manifesto. If you publish it, it should be published as a novel written by a talented writer who happened to die young, not as a suicide note disguised as art. There is a profound difference in how the world will receive it, and how his memory will be kept. One celebrates his mind; the other fixates on his death.

  Regarding the memorial service, I would strongly advise against printing the letter in isolation. It is too easy for it to be seen as the reason he died, rather than one part of a larger creative life. If your mother needs something in the program, perhaps choose a passage from earlier in the book where the character is alive and struggling and fighting, rather than the moment of surrender. Or choose something he actually said to you, if you have it written down. You have to be the one to tell her this, and I know that is the hardest part. You do not have to tell her she is wrong about what the letter means to her. You can tell her that you know it speaks to her, and that it speaks to you too, but that publishing it alone would change what the book is. You can tell her that protecting his work means letting it stand as a whole thing, not just the end of it.

  You are worried about steamrolling her, but you are also worried about betraying him. Being the executor means you sometimes have to make the decision that protects the legacy even if it hurts the living in the short term. Your mother wants closure. She wants the ambiguity of the coroner's report resolved by the certainty of the book. But the book was never meant to resolve that ambiguity. It was meant to exist alongside it. Take your time with the decision about the press. There is no rush to publish. Grief makes everything feel urgent, but books wait. Let the book sit for a while. Let the memorial service pass. You can tell her you need time to prepare the manuscript properly, which is true.

  You are not pretending to know what he meant better than he did. You are knowing him as a writer better than anyone else does. You are the only one who can speak for the craft he loved enough to hide. It is okay to be the guardian of that craft, even if it means having a difficult conversation with your mother. She may be angry for a while. She may feel you are denying her the goodbye she needs. But in the long run, preserving the integrity of his work is the greatest respect you can pay to the brother who spent years writing in the dark.

  I hope you can find a way through this that lets you keep your relationship with her intact while honoring him. You do not have to decide everything today. Just hold the line on the program for now. That is the immediate thing. Everything else can wait.

  Take care of yourself.
