answer: |-
  Your instinct is correct: the psychological claims are broadly representative of the theory (though with significant caveats regarding precision), while the metaethical and normative conclusions are indeed smuggled in. They do not follow logically from the descriptive data.

  However, to give you the ammunition you need for a future discussion, we need to be precise about where the science ends and the interpretation begins. Moral Foundations Theory (MFT) is a **descriptive** theory of moral psychology; it attempts to explain *how* we make moral judgments, not *which* judgments are correct.

  Here is a clause-by-clause breakdown of your friend's paraphrase, graded by how a working moral psychologist would likely react.

  ### Part 1: The Psychological Claims

  **1. "Haidt's moral foundations theory shows that our moral judgments are driven by gut feelings rather than reasoning..."**
  *   **Verdict:** **Mostly Acceptable (with a major caveat).**
  *   **The Nuance:** This refers to the *Social Intuitionist Model*. Haidt argues intuition comes first (the "gut feeling"), and strategic reasoning comes second (to justify the feeling to others). However, saying "rather than reasoning" is too strong. Most psychologists view reasoning as having a weaker, secondary role (social persuasion, post-hoc justification), not *no* role. Reasoning can occasionally override intuition, but it is effortful and rare.
  *   **Expert Wince:** "Rather than" implies a dichotomy. It's more accurate to say "primarily by intuition, with reasoning serving as the press secretary."

  **2. "...he demonstrated this in experiments where people could not give any reasons for their judgments and just kept insisting that something was wrong."**
  *   **Verdict:** **Accurate.**
  *   **The Nuance:** This refers to "moral dumbfounding" studies (e.g., harmless taboo violations like eating a pet dog that died of natural causes). Participants often struggle to articulate *why* it is wrong beyond "it just is." This is robust evidence for the primacy of intuition.

  **3. "He identified five foundations — care, fairness, loyalty, authority, and sanctity..."**
  *   **Verdict:** **Acceptable Simplification.**
  *   **The Nuance:** These are the original five. Haidt and colleagues later added a sixth (Liberty/Oppression). A psychologist would accept the list but note it is a working model, not a periodic table of elements. Some researchers argue for different factors or fewer dimensions.

  **4. "...that are universal, hardwired, and present in every culture."**
  *   **Verdict:** **Contested / Overstated.**
  *   **The Nuance:**
      *   *Hardwired:* Haidt prefers the metaphor of a "first draft" written by evolution, which is then edited by culture. "Hardwired" implies immutability, which is false.
      *   *Universal:* This is the most contentious claim. While the *capacity* for these foundations may be universal, their activation varies wildly. Some cultures may not utilize "Sanctity" in ways recognizable to Westerners.
      *   *Replication:* Cross-cultural validation has been mixed. Some studies suggest the factor structure of MFT does not hold up perfectly in non-WEIRD (Western, Educated, Industrialized, Rich, Democratic) societies.

  **5. "Liberals have only the first two, which is why they find conservative morality incomprehensible..."**
  *   **Verdict:** **Bad Simplification.**
  *   **The Nuance:** Data shows liberals *rely* heavily on Care and Fairness (specifically Equality) and significantly *less* on Loyalty, Authority, and Sanctity. They do not "have only" the first two; they score above zero on the others, but the weighting is skewed.
  *   **Incomprehensible:** This is too strong. Liberals understand conservative morality cognitively; they just don't *feel* the moral pull of it. It lacks "resonance," not intelligibility.

  **6. "...whereas conservatives draw on all five."**
  *   **Verdict:** **Broadly Supported.**
  *   **The Nuance:** This is the central empirical finding of MFT regarding politics. Conservatives tend to show a more even distribution of endorsement across all five (or six) foundations. This is generally accepted in the literature, though the binary of "Liberal vs. Conservative" is itself a simplification of complex political psychologies.

  **7. "And because the theory has been empirically validated across cultures..."**
  *   **Verdict:** **Forgivable Simplification.**
  *   **The Nuance:** It has been validated across *many* cultures, but the "replication crisis" in social psychology has touched MFT as well. Some cross-cultural studies have failed to replicate the exact five-factor structure. A psychologist would say "supported in many contexts" rather than "validated across cultures" (which implies unanimity).

  ---

  ### Part 2: The Normative and Metaethical Claims

  This is where your friend's paraphrase moves from psychology to philosophy, and where the errors become significant.

  **8. "...it shows that conservative morality is in fact the fuller and more complete morality..."**
  *   **Verdict:** **Simply Wrong (The Is-Ought Problem).**
  *   **The Analysis:** This is a category error. MFT is descriptive (what *is*); morality is normative (what *ought* to be).
      *   Even if conservatives *do* use more foundations, that does not entail they *should*.
      *   One could argue that relying on "Authority" or "Sanctity" leads to harmful outcomes (e.g., oppression of minorities, resistance to necessary social change).
      *   Haidt himself sometimes rhetorically suggests that conservatives have a " richer moral palate," but he frames this as a functional advantage for group cohesion, not necessarily as moral *truth*. To claim it is "more complete" is a value judgment smuggled into a scientific finding.

  **9. "...and that moral disputes are ultimately just clashes between different evolved modules, with no fact of the matter about who is right."**
  *   **Verdict:** **Metaethically Unwarranted.**
  *   **The Analysis:** This claims that MFT entails **moral anti-realism** (the idea that there are no objective moral truths).
      *   **The Genetic Fallacy:** Explaining the *origin* of a belief (evolutionary modules) does not prove the belief is *false*.
      *   **Analogy:** Evolutionary psychology explains that we have visual modules to detect edges and motion. That explains the *origin* of our vision. It does not prove that the tree we are looking at isn't really there.
      *   **Compatibility:** You can be a Moral Realist (believing objective moral truths exist) and accept MFT. You could argue evolution gave us the *sensors* to detect moral truth, just as it gave us eyes to detect light. The fact that the sensors vary (some people are colorblind, some prioritize Authority) doesn't mean there is no light.
      *   **Haidt's View:** Haidt often leans toward a pragmatic pluralism, suggesting we should respect different foundations for the sake of social functioning. But MFT *itself* does not prove there is "no fact of the matter." That is a philosophical add-on.

  ---

  ### Summary: Does the theory commit defenders to a view on who is right?

  **No.**

  Moral Foundations Theory is a tool for mapping moral terrain, not a compass for navigating it.

  1.  **Descriptive vs. Normative:** The theory explains why a conservative feels disgust at a flag burning (Sanctity/Loyalty) and a liberal feels anger at income inequality (Fairness/Care). It does not tell you whether flag burning *should* be illegal or whether inequality *is* unjust.
  2.  **The "Fuller" Morality Claim:** This is the most dangerous slip. Having more "taste buds" doesn't mean your diet is healthier. A morality that utilizes Authority and Sanctity can sustain a group (Haidt's argument), but it can also sustain slavery, caste systems, or the suppression of women. "Completeness" in psychology does not equal "Goodness" in ethics.
  3.  **The Metaethics:** The claim that there is "no fact of the matter" is a philosophical stance (non-cognitivism or relativism) that is *compatible* with MFT but not *required* by it. A defender of MFT can consistently say: "Evolution gave us these foundations, but through reason and reflection, we have determined that the Authority foundation is often misapplied in modern contexts, and we ought to suppress it."

  ### How to Respond to Your Friend

  You can tell your friend that her summary captures the **pop-science version** of Haidt, which often blends his data with his commentary.

  *   **What she got right:** The intuition-first model, the dumbfounding studies, and the general finding that conservatives tend to endorse a broader range of foundations than liberals.
  *   **What she got wrong:** The leap from "conservatives use more foundations" to "conservative morality is better/more complete." This is a value judgment, not a data point.
  *   **The Critical Point:** Remind her that explaining the *cause* of a belief is not the same as evaluating the *truth* of a belief. MFT explains why we have moral disagreements; it does not resolve them, nor does it prove that resolution is impossible.

  Your instinct that the metaethics are "tacked on" is the correct one. Haidt is a psychologist, not a moral philosopher, and when he crosses that line, he is offering opinion, not evidence.
