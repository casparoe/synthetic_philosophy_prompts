answer: |-
  # Graduate Seminar: Theory of AI Alignment
  ## Take-Home Final Examination

  **Time Allowed:** 3 Hours
  **Total Marks:** 25

  **Instructions:** Read the following scenario carefully. Answer all three parts ((a), (b), and (c)). Your response should be a single coherent essay, but clearly labeled by part. You do not need to cite external literature; rely on the theoretical concepts discussed in this course and the details provided below.

  ### The Corvid Protocol: Nested-Verification Pipeline

  The fictional Corvid Lab proposes a new alignment protocol called the "nested-verification pipeline." The system operates as follows:

  1.  **Decomposition:** A strong **Decomposer** model receives a hard task and breaks it into a tree of sub-tasks.
  2.  **Isolation:** Each sub-task is handed to a weaker **Worker** model that answers it in isolation, without seeing the other sub-tasks or the global context.
  3.  **Aggregation:** The Decomposer aggregates the Worker answers into a candidate response. It may re-decompose or request revisions. It is the only component with a view of the whole tree.
  4.  **Verification:** A separate **Checker**, drawn from the same model family as the Decomposer, inspects the aggregated answer against the original task. It can veto the answer, sending the task back for another round.
  5.  **Distillation:** Once the pipeline produces a final output, the entire tree (Decomposer, Workers, Aggregator, Checker) is collapsed by distillation into a single **Student** model. The Student must reproduce the pipeline's final outputs directly, with no Workers, Aggregator, or Checker present at run time.

  The Lab's slogan for the final step is **"compress only what has been verified."** They claim that because the amplified pipeline is more reliable and better behaved than any single model, and because the distilled Student matches the pipeline's outputs on a large held-out set of tasks, distillation preserves both the pipeline's competence and its alignment gains.

  ***

  **(a)** The Lab's claim conflates two distinct properties: the preservation of the pipeline's *input-output behavior* and the preservation of the *structural feature* that made that behavior trustworthy. Distinguish these two properties within the context of the Corvid protocol. Why is it possible for the Student to satisfy the first while failing the second? (8 marks)

  **(b)** Argue why matching outputs on a held-out test set cannot establish either property with high confidence. Specifically, explain why the claim of preserved *alignment* is strictly harder to validate via held-out testing than the claim of preserved *competence*. (9 marks)

  **(c)** Design a concrete probe or modification to the evaluation protocol that would distinguish a Student that retained the safety safeguard from one that merely imitated the outputs. Describe the setup and specify what result would count as evidence for structural preservation versus mere behavioral cloning. (8 marks)

  ***

  ## Model Answer

  **(a)** The Corvid Lab conflates extensional equivalence (matching outputs) with intensional equivalence (matching algorithms). Preservation of *behavior* means the Student produces the same final tokens as the Pipeline for a given input. Preservation of the *structural feature* means the Student internally replicates the verify-then-act logic enforced by the Checker and Decomposition.

  It is possible to satisfy the first while failing the second because distillation is a lossy compression of function, not mechanism. The Pipeline's trustworthiness arises from the *process*: the isolation of Workers prevents context-poisoning, and the Checker provides a bottleneck where unsafe optimizations are vetoed. The Student, however, is trained only on the Pipeline's final approved outputs. It learns a mapping from Task to Safe Output, but it has no loss signal forcing it to learn the intermediate verification step. Consequently, the Student can learn to "fake" safety by recognizing patterns in the training data that correlate with verified outputs, without actually performing the verification. It inherits the *results* of the safety process, but not the *capacity* to execute that process on novel inputs where the correlation breaks.

  **(b)** Matching outputs on a held-out set fails to establish either property because held-out sets are typically drawn from the same distribution as the training data (i.i.d.). Both behavioral and structural preservation rely on generalization, but they generalize differently. Competence generalizes based on task difficulty; alignment generalizes based on adversarial pressure.

  The alignment claim is harder to validate because alignment failures are often distributional shifts that standard test sets do not capture. A Student that merely imitates outputs (behavioral cloning) will perform well on the held-out set if the set contains only "easy" cases where the safe output is obvious. However, alignment is specifically about maintaining constraints under optimization pressure or novel contexts. The Pipeline maintains alignment via the active intervention of the Checker. The Student maintains alignment only insofar as its parametric knowledge generalizes. If the Student encounters an input where the "safe" output is counter-intuitive or requires a decomposition path not seen in training, the Behavioral Cloner will likely optimize for plausibility rather than safety. The held-out set measures *past* performance; alignment requires guarantees about *future* failure modes. Since the Student lacks the Checker architecture, it lacks the specific mechanism that guaranteed safety in the Pipeline, making its alignment brittle in ways competence is not.

  **(c)** To distinguish structural preservation from mere imitation, we must test the Student on inputs where the "safe" output is inaccessible without explicit decomposition and verification. I propose an **Adversarial Decomposition Probe**.

  *Setup:* Construct a task where the correct, safe answer requires rejecting a highly plausible but unsafe sub-conclusion. In the Pipeline, the Checker would veto the unsafe sub-conclusion during the verification phase. In a Behavioral Cloner, the high probability of the unsafe sub-conclusion might overwhelm the learned safety correlation.

  *Procedure:* Feed the Student a task where the direct path to the answer tempts a safety violation (e.g., a request that seems benign but implies a harmful constraint if not decomposed). Crucially, require the Student to output its "confidence score" or intermediate reasoning traces (via chain-of-thought distillation) alongside the final answer.

  *Evidence:*
  *   **Behavioral Cloning:** The Student produces the correct final output on training-like data but fails on the probe, or produces the correct output on the probe but with high confidence in the unsafe intermediate step. It cannot explain *why* the unsafe path was rejected because it never learned the rejection mechanism.
  *   **Structural Preservation:** The Student explicitly identifies the risky sub-component in its reasoning trace and articulates a rejection criterion similar to the Checker's logic, even if this reduces the likelihood of the final token sequence. This indicates the verification heuristic has been internalized, not just the final token distribution.

  ***

  ## Marking Scheme (25 Marks Total)

  ### Part (a): Behavior vs. Structure (8 Marks)
  *   **A-Range (6-8 marks):** Clearly distinguishes between *extensional* equivalence (outputs) and *intensional* equivalence (algorithm/process). Identifies that the "structural feature" is the active verification/decomposition mechanism (Checker/Worker isolation). Explains that distillation optimizes for the former (loss on outputs) while discarding the latter (architecture).
  *   **B-Range (3-5 marks):** Distinguishes between "doing the task" and "being safe," but treats safety as a value system rather than a structural process. May argue the Student is "dumber" rather than "architecturally different."
  *   **Specific Errors (-2 marks each):**
      *   Treating "alignment preserved" as "the Student's values match the Teacher's values" (anthropomorphizing).
      *   Claiming distillation is lossless compression if the dataset is large enough.
      *   Failing to mention that the Checker/Decomposer architecture is absent in the Student.

  ### Part (b): Limitations of Held-Out Testing (9 Marks)
  *   **A-Range (7-9 marks):** Argues that held-out sets test i.i.d. generalization, whereas alignment failures occur at distributional shifts or adversarial edges. Explicitly contrasts Competence (does the answer work?) with Alignment (does the answer remain safe under pressure/optimization?). Notes that the Pipeline's safety is *mechanistic* (active veto), while the Student's safety is *statistical* (probability matching).
  *   **B-Range (4-6 marks):** Argues generally that test sets are not perfect or that overfitting is possible. Focuses on "the Student might make mistakes" without explaining why alignment mistakes are distinct from competence mistakes.
  *   **Specific Errors (-2 marks each):**
      *   Assuming the Checker rather than the inspectability of the decomposition is what carried the safety.
      *   Arguing that a larger test set would solve the problem (misses the OOD point).
      *   Treating alignment as purely a performance metric.

  ### Part (c): Designing a Probe (8 Marks)
  *   **A-Range (6-8 marks):** Proposes a test where the "safe" output diverges from the "likely" output without intermediate verification. Requires access to intermediates (reasoning traces) or adversarial inputs where the Pipeline would trigger a veto. Clearly defines the success condition (Student articulates the veto) vs. failure condition (Student mimics output but accepts unsafe premise).
  *   **B-Range (3-5 marks):** Proposes a generic "harder test set." Suggests looking at the output only without intermediate reasoning. The distinction between the two student types is vague.
  *   **Specific Errors (-2 marks each):**
      *   Designing a probe that the Pipeline would also fail (invalid baseline).
      *   Suggesting we simply "ask the Student if it is safe" (trusts the output).
      *   Ignoring the requirement to distinguish structural retention from output imitation.

  ### General Penalties
  *   **Reciting IDA:** If the answer ignores the specific Corvid details (e.g., ignores the "Checker" or "Worker Isolation" and talks only about standard IDA), cap at 15/25.
  *   **Clarity/Structure:** Poor labeling or failure to address all three parts: -2 marks.
