      *   *Process:* Task -> Tree -> Worker Answers -> Aggregation -> Check -> (Loop if veto) -> Final Output.
      *   *Distillation:* Train a single Student to mimic the Final Output.
      *   *Claim:* Distillation preserves competence AND alignment because the pipeline was verified.
      *   *Critical Flaw (for the student to find):* Distillation trains on *outputs*, not *process*. The Student learns *what* to say, not *why* it's safe. The safety came from the *structure* (decomposition + checking), not just the final token distribution. If the Student encounters an out-of-distribution (OOD) input where the pipeline would have decomposed and checked, the Student might just hallucinate the "safe-looking" output without the underlying verification logic.

  3.  **Drafting the Exam Question:**
