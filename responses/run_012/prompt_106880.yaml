      *   *Self-Correction on Model Answer:* Make sure it explicitly references the "Corvid" setup terms (Decomposer, Checker, etc.) to show engagement with the prompt. Ensure the distinction in (a) is sharp: "Behavioral cloning vs. Architectural inheritance."
