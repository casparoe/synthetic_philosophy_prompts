          *   (c) Proposal: Adversarial decomposition test. Force the student to show its work or feed it a task where the "safe" output is counter-intuitive without the check. Evidence: If the student fails where the pipeline would have corrected itself, it lacks the mechanism.

  5.  **Drafting the Marking Scheme:**
