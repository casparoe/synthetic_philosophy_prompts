  # JOINT STATEMENT ON THE METAPHYSICS AND SEMANTICS OF VAGUENESS

  **Signatories:** [Epistemicist Proponent] & [Supervaluationist Proponent]
  **Date:** October 26, 2023
  **Subject:** Consensus, Dissensus, and Pathways Forward in the Theory of Vagueness

  Following a period of adversarial collaboration, we submit this statement to clarify the grounds of our agreement, the precise locus of our disagreement, and the empirical or conceptual tests that bear upon our respective views. We aim to distinguish substantive metaphysical divergence from merely verbal variance, and to record our predictions regarding specific boundary-case scenarios.

  ### I. AREAS OF CONSENSUS

  We agree on the following claims regarding the phenomena to be explained, the admissibility of formal tools, and the criteria for theoretical evaluation:

  1.  **The Data to be Explained:**
      *   **The Sorites Paradox:** Both sides agree that the Sorites paradox arises from plausible premises (tolerance) and valid reasoning, yet leads to an absurd conclusion. Any adequate theory must block the conclusion without violating core logical intuitions more than necessary.
      *   **Borderline Cases:** There exist objects (e.g., a specific height, a specific shade of red) regarding which competent speakers hesitate to apply or deny a vague predicate, even given full non-semantic information.
      *   **Penumbral Connections:** There are logical constraints between vague predicates (e.g., nothing can be both "red" and "orange" all over; if $x$ is red and $y$ is redder than $x$, $y$ must be red). Any theory must preserve the validity of these connections.
      *   **Higher-Order Vagueness:** It is plausible that the boundary between "clear cases" and "borderline cases" is itself vague. A theory should not introduce artificial sharpness at the level of "definiteness" unless required by logic.

  2.  **Formal Machinery:**
      *   **Classical Logic:** We agree that classical logic is the default for precise discourse. The Epistemicist retains it universally. The Supervaluationist retains it for "super-valid" arguments but denies the universal applicability of Bivalence.
      *   **Semantics:** We agree that meaning is determined by usage facts (dispositions, causal history, social norms). We disagree on whether these facts determine a unique extension or a set of admissible extensions.
      *   **The 'Definitely' Operator:** Both sides employ a modal-like operator $D$ (Definitely). We agree that $Dp$ entails $p$, but $p$ does not entail $Dp$.

  3.  **Criteria for Evidence:**
      *   **Linguistic Intuition:** Native speaker judgments about truth, falsity, and appropriateness of assertion are primary data.
      *   **Theoretical Virtues:** Simplicity, logical coherence, and alignment with broader metaphysical views (e.g., realism about meaning) are valid adjudicators.
      *   **Explanatory Power:** A theory is preferred if it explains *why* we are ignorant (Epistemicism) or *why* we hesitate (Supervaluationism) without positing ad hoc mechanisms.

  ### II. RESIDUAL DISAGREEMENTS

  The following table summarizes the substantive disagreements that remain. We have phrased each position in terms acceptable to its proponent.

  | Topic | Epistemicist Position | Supervaluationist Position |
  | :--- | :--- | :--- |
  | **Extension of Vague Predicates** | Every vague predicate has a unique, sharp extension fixed by micro-facts of usage and environment. | Vague predicates have no unique extension; they are associated with a set of equally admissible precisifications. |
  | **Nature of Borderline Cases** | Borderline cases are objects that fall on the unknown side of a sharp boundary. They are cases of **ignorance**. | Borderline cases are objects that fall within the "penumbra" where precisifications diverge. They are cases of **semantic indeterminacy**. |
  | **Status of Sorites Premise** | The major premise ("If $n$ is $F$, $n+1$ is $F$") is **false**. There is a specific $n$ where the switch occurs. | The major premise is **not true** (false on some precisifications), but not simply false simpliciter. It lacks a truth value. |
  | **Bivalence** | **True.** Every declarative sentence expressing a proposition is either true or false. | **False.** Sentences involving vague predicates in borderline cases are neither true nor false (they are gappy). |
  | **Higher-Order Vagueness** | There is no genuine higher-order vagueness; there are only sharp boundaries we cannot locate, including the boundary of "knowability." | Higher-order vagueness is genuine; the set of admissible precisifications is itself not sharply bounded. |

  ### III. CRUXES AND PREDICTIONS

  We identify the following sub-questions as "cruxes." Settling these would not necessarily refute a view, but would require significant theoretical revision by at least one side.

  **Crux 1: The Stability of Meaning Under Ignorance**
  *   **Question:** Does the meaning of a term persist unchanged when all speakers are ignorant of its application conditions?
  *   **Bearing Argument:** If a community uses a term but is universally mistaken about its cutoff (e.g., they all believe the cutoff is 180cm, but usage facts fix it at 179cm), does the term refer to 179cm?
  *   **Epistemicist Prediction:** Yes. Usage facts fix the extension independently of speaker belief. The term refers to 179cm; the community is ignorant.
  *   **Supervaluationist Prediction:** No. If usage dispositions are uniform around 180cm, the set of admissible precisifications centers there. There is no "hidden" 179cm fact.

  **Crux 2: The Logic of 'Definitely' (Iterativity)**
  *   **Question:** Does $Dp$ entail $DDp$? (If it is definitely the case, is it definitely definitely the case?)
  *   **Bearing Argument:** If iterativity fails, higher-order vagueness is modeled. If it holds, sharp boundaries exist at the level of definiteness.
  *   **Epistemicist Prediction:** Iterativity holds. $D$ is a knowledge-like operator. If there is a fact, it is a fact that there is a fact.
  *   **Supervaluationist Prediction:** Iterativity fails. The boundary of the "admissible set" is itself fuzzy. $Dp$ can be true while $DDp$ is indeterminate.

  ### IV. ANALYSIS OF CONSTRUCTED CASES

  We applied our respective theories to the "Safety Committee" scenarios provided. We record our interpretations and predictions below.

  **Case (a): The Stipulation (122.0 cm)**
  *   *Scenario:* Committee stipulates 122.0 cm because it is round.
  *   **Question:** Before stipulation, was there a fact of the matter? Does stipulation create a sharp predicate or select a precisification?
  *   **Epistemicist:** Before stipulation, "tall enough" had a sharp extension fixed by prior usage (unknown). The stipulation **creates a new predicate** with a new, known sharp extension. It overrides the old meaning.
  *   **Supervaluationist:** Before stipulation, "tall enough" admitted a range of precisifications. The stipulation **selects one precisification** from the admissible set and makes it mandatory. It does not create meaning ex nihilo but collapses the set.
  *   **Agreement:** The post-stipulation rule is precise and classical logic applies to it.

  **Case (b): The Forgotten Record**
  *   *Scenario:* Stipulation made (122.0 cm), but record destroyed and decision forgotten. No one will ever know the cutoff.
  *   **Question:** Does anything change for either view?
  *   **Epistemicist:** **No change in truth conditions.** The fact remains that the rule is 122.0 cm based on the historical act of stipulation. The predicate is sharp; the cutoff is simply unknowable (epistemic borderline).
  *   **Supervaluationist:** **Change in truth conditions.** Without the record, the mandatory precisification is lost. The predicate reverts to vagueness based on current community dispositions (which may cluster around 122 but admit 121 or 123). The "fact" of 122.0 is lost because meaning is grounded in current admissibility, not hidden historical atoms.
  *   **Divergence:** This highlights the core metaphysical split: Is meaning a historical fact (Epistemicist) or a current normative practice (Supervaluationist)?

  **Case (c): The Buffer Zone**
  *   *Scenario:* Committee stipulates 122.0 cm cutoff, but children within 1 cm (121-123) are "undetermined."
  *   **Question:** Does this manufacture genuine higher-order vagueness, or a first-order vague predicate with a sharp meta-boundary?
  *   **Epistemicist:** This creates a **sharp meta-boundary**. The predicate "eligible" is now defined by a complex rule: True if $\ge 123$, False if $\le 121$, False (by rule) if in between. The boundaries at 121.0 and 123.0 are perfectly sharp. This is not higher-order vagueness; it is a three-valued logic implemented by fiat.
  *   **Supervaluationist:** We can live with this result, but we classify it as **artificial gappiness**. It mimics higher-order vagueness (a gap around the boundary), but because the gap boundaries (121/123) are stipulated sharply, it lacks the essential feature of natural higher-order vagueness (the unlocatability of the gap's edge).
  *   **Agreement:** Neither side views this as evidence for *natural* higher-order vagueness. It is a semantic tool, not a discovery about vague properties.

  ### V. CONCLUSION: VERBAL DISPUTES AND SETTLEMENT

  **On Verbal Disputes:**
  We acknowledge that a portion of our dispute is verbal, specifically regarding the definition of "truth."
  *   If "truth" is defined as *truth on all admissible precisifications* (Supervaluationist), then Bivalence fails.
  *   If "truth" is defined as *correspondence to the unique extension* (Epistemicist), then Bivalence holds.
  However, this is not *merely* verbal. The disagreement extends to the metaphysics of meaning: does usage determine a point or a range? If we could agree on the definition of "truth," we would still disagree on whether the world (and language) contains sharp boundaries that are unknowable.

  **On Settlement:**
  We agree that no purely *a priori* argument currently exists that would settle this dispute to the satisfaction of both parties. The disagreement is robust under logical scrutiny.
  However, we identify one potential pathway for settlement: **Empirical Psycholinguistics.**
  *   **The Test:** A longitudinal study of how children acquire vague predicates.
  *   **Settlement Condition:** If data shows children unconsciously converge on a single sharp cutoff in usage before being taught rules, this favors **Epistemicism**. If data shows children consistently operate with overlapping ranges and tolerate variation without seeking a cutoff, this favors **Supervaluationism**.

  Until such data is available, we agree to maintain our respective positions as live, incompatible, but equally rigorous hypotheses regarding the semantics of natural language.

  ***

  **Signed,**

  *[Epistemicist Proponent]*
  *[Supervaluationist Proponent]*
