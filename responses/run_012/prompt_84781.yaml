prompt: |-
  I'm in a grad seminar on ethics and computing and I've realised my intuitions about fair algorithms are a complete mess, so I'm hoping you can act as someone who works on both the technical side of this and the moral philosophy side, think it through carefully before you commit to anything, maybe start by brainstorming the candidate principles and where each one breaks, and then just write back to me as an email. Continuous prose please, no headings, no bullet points, no bold, no tables — I read these on my phone and the formatting drives me up the wall.

  Here's what I actually think, case by case, and I'm definately going round in circles. (1) A hospital system scores patients by predicted future health-care costs to decide who gets into a care-management program, and Black patients end up referred much less often than white patients at the same level of illness. Unfair, and it doesn't matter that the algorithm never sees race — the target variable is a stand-in for need and a bad one. (2) A recidivism score where a 7 really does mean about a 70% chance for both Black and white defendants, but the false positive rate is much higher for Black defendants, so twice as many people who wouldn't reoffend get flagged. Unfair; the calibration doesn't buy it off. (3) A tool that flags posts for hate-speech review and is far more likely to flag Black users' posts that turn out to be fine. Unfair, and unfair in exactly the same way as (2). (4) A model that decides who gets a subsidised home-energy retrofit, built on predicted heat risk, which ends up spending most of the money in poor neighbourhoods. That seems obviously fine, and I don't think it's a problem that the spend is unequal by race, because the underlying need is unequal. (5) A lottery among everyone above a published bar for oversubscribed spots in a training program — fine, even though the outcome is demographically lopsided. (6) A résumé screener that's a bit less accurate for women because there's less clean training data on them, but whose mistakes are symmetric and which selects men and women at the same rate. I don't think that's unfair, though it does bother me. (7) And the one I keep flipping on: a system screening applicants for a scarce benefit where the score is calibrated and the error rates are the same for both groups, but one group gets selected far more often because its base rate is higher, and a regulator wants to cap selection at population parity — which means turning away people from the high-base-rate group who'd have been selected and letting in people from the other group with worse scores. Half the time the cap feels like the only honest fix, half the time like doing the unfairness out loud.

  What bothers me is that (2), (3) and (6) seem to pull in different directions, and someone in the seminar said there's a theorem — I half remember it — that once two groups have different base rates you simply can't have all three of: scores that mean the same thing in both groups, equal false positive rates, and equal false negative rates, unless the predictor is nearly perfect or the base rates happen to match. Is that right? Because if it is, I've been asking for something impossible and I need to know which of my verdicts has to go.

  So: what principle, or small set of principles, actually generates my verdicts, stated precisely enough that I could apply it to a new case without writing to you again? I want to see the case that forces each clause, then what it says about something I haven't listed — say, a system that decides which tenants get sent to rent-arrears mediation instead of eviction court. And be honest about which of (1) through (7) your principle can't accommodate, whether the honest answer is that I have to drop one of them, and whether there's a clause I haven't thought of that would let me keep everything.
