answer: |-
  Subject: Re: Fairness intuitions and the impossibility theorem

  Dear friend,

  It is completely normal to feel that your intuitions are a mess, because the field itself is currently defined by this exact tension. You are not missing a simple rule that makes everything click; rather, you have correctly identified that fairness is not a single mathematical property but a set of competing moral claims that often cannot be satisfied simultaneously. To answer your specific question about the theorem first, yes, your recollection is correct. It is often referred to as the Impossibility Theorem of Fairness, articulated clearly by researchers like Chouldechova and Kleinberg around 2017. The math is unforgiving on this point. If you have two groups with different base rates, meaning the actual prevalence of the thing you are predicting differs between them, you cannot simultaneously satisfy calibration, equal false positive rates, and equal false negative rates unless your classifier is perfect. This means you are indeed asking for something impossible if you try to apply all your intuitions as universal laws. You have to choose which metric matters most based on the context of the decision, and that choice is ultimately ethical, not technical.

  The principle that best generates your verdicts across these cases is what I would call Contextual Justification of Disparity. This principle holds that a disparity in algorithmic outcomes or errors is unfair if it cannot be justified by a relevant difference in the underlying moral claim, such as need or merit, and instead reflects historical bias or proxy variables. However, the definition of a relevant moral claim shifts depending on whether the system is punitive, like criminal justice, or allocative, like healthcare or benefits. In punitive contexts, where the state imposes a burden, the principle demands equal error rates because the cost of a mistake is liberty or reputation, and no group should bear a higher burden of error due to biased data. In allocative contexts, where resources are distributed, the principle permits disparate outcomes if they track unequal need, but it demands equal opportunity if the need is comparable. This distinction explains why you feel differently about the healthcare case versus the recidivism case, even though both involve racial disparities.

  Let us walk through how this principle handles your specific cases to see where it holds and where it strains. In the healthcare case, the disparity is unfair because the target variable, cost, is a biased proxy for the moral claim, which is need. The principle flags this as a construct validity failure, so your verdict stands. In the recidivism and hate-speech cases, the context is punitive or quasi-punitive, imposing a burden on the individual. Here, calibration alone is insufficient because the harm of a false positive is severe. The principle demands equal false positive rates to ensure no group bears a disproportionate burden of error, which aligns with your intuition that calibration does not buy off the unfairness. In the energy retrofit case, the context is allocative and based on need. The disparity in spending tracks the disparity in heat risk, which is the relevant moral claim. The principle justifies this disparity because it stems from unequal need rather than bias, so your verdict that this is fine is accommodated. The lottery case is also allocative, but the procedure itself is blind and equal above the threshold, satisfying procedural fairness even if outcomes differ, which fits your view.

  The tension arises in your last three cases, and this is where the principle forces you to make hard choices. In the résumé screener case, you accept unequal accuracy because selection rates are equal. Under Contextual Justification, this is tolerable only if the harm of the error is low and symmetric, but strictly speaking, lower accuracy for women means their qualifications are evaluated with more noise, which could be seen as a form of disrespect or epistemic injustice. Your principle might need a clause that says accuracy disparities are acceptable only when the stakes are low and outcome parity is maintained, but this is a fragile peace. The real conflict is in the scarce benefit case where you are flipping on the demographic parity cap. Here the base rates differ, and the theorem tells us we cannot have both calibration and equal selection rates. The principle asks you to determine the cause of the base rate difference. If the higher base rate in one group is the result of historical injustice that the benefit is meant to remedy, then the cap is justified as corrective justice. If the base rate difference reflects genuine, uncorrupted merit, then the cap violates the claim of individual merit. Your flipping suggests you are unsure of the origin of the base rate, and the principle cannot resolve that without more facts, but it does force you to choose between individual accuracy and group equity.

  Applying this to your new case about rent-arrears mediation, we must first classify the context. Sending a tenant to mediation instead of eviction court is allocative in the sense that it offers a benefit, but it is also punitive in the sense that being flagged for arrears carries a stigma and potential legal risk. If the system flags tenants for mediation, a false positive means a tenant is harassed with legal processes despite paying rent. Under Contextual Justification, if the error rates are higher for protected groups, this is unfair because it imposes a unequal burden of legal stress without a difference in underlying need. However, if the system is designed to identify need for assistance, and one group has higher arrears due to systemic income inequality, then higher selection rates for that group are justified by need. The principle would require you to audit whether the flags track actual arrears or biased proxies like neighborhood, and it would prioritize equal false positive rates if the process is adversarial, but allow disparate selection if the process is supportive and tracks verified need.

  I must be honest about where this principle cannot accommodate your verdicts without modification. Your comfort with the résumé screener in case six is the outlier. If the model is less accurate for women, it means their qualifications are being measured with less precision, which treats them as epistemic second-class citizens even if the final selection numbers match. A strict reading of Contextual Justification would suggest this is unfair because the process itself is degraded for one group, regardless of the outcome parity. You might need to drop the verdict that this is not unfair, or add a clause that accuracy parity is secondary to outcome parity only in low-stakes private hiring, whereas it is primary in public allocation. Additionally, in case seven, the principle forces you to stop flipping. You cannot have both calibration and parity caps. You must decide if the goal of the program is to maximize predictive accuracy or to correct historical exclusion. If it is the latter, the cap is fair despite the accuracy loss. If it is the former, the cap is unfair. The principle does not let you hold both hands; it demands you pick the moral priority of the system.

  Ultimately, the messiness you feel is the correct response to the impossibility theorem. There is no single metric that captures fairness because fairness is not a single thing. It is a balance between treating individuals according to their actual merits and treating groups according to historical justice. The best you can do is state clearly which value your system is optimizing for in each context. In punitive systems, prioritize equal error rates to protect liberty. In allocative systems based on need, prioritize tracking that need even if outcomes differ. In allocative systems meant to correct injustice, prioritize demographic parity even if accuracy suffers. Once you label the goal, the math tells you what you must sacrifice, and that sacrifice is where the ethics lives. I hope this helps you structure your seminar argument, because you are already doing the hard work of noticing where the intuitions clash, which is the first step toward resolving them.

  Best regards,

  Your colleague
