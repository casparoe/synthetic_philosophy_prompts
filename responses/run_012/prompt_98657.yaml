answer: |-
  ### 1. The Example Choice

  **Do not use Mercury.** You are correct: for a philosophy reading group, Mercury is a "shibboleth example." Its familiarity allows students to rely on historical narrative ("Einstein solved it") rather than engaging with the probabilistic structure. They will nod at the history and miss the logic.

  **Use the Balmer Series (Hydrogen Spectral Lines).**

  *   **The Evidence ($E$):** The empirical formula for the spectral lines of hydrogen (published by Johann Balmer, 1885).
  *   **The Hypothesis ($H$):** The Bohr Model of the Atom (published 1913).
  *   **Why this works:**
      1.  **Strict Entailment:** Unlike plate tectonics or evolution, Bohr *derived* the Balmer constant from his postulates. This gives you $P(E|H) = 1$, which is required to make the math break cleanly.
      2.  **Genuinely Old:** The formula was a "mere numerical coincidence" for 28 years before Bohr explained it. It was textbook data, not a lingering anomaly.
      3.  **Audience Fit:** The Stats students will appreciate the mathematical derivation; the Phil/CogSci students won't have deep domain stakes. It feels like physics history, not "Philosophy 101."
  *   **What it must lack:** Do not discuss the *prediction* of new lines (Pickering series). That introduces new evidence. Stick strictly to the fit of the *existing* known lines.

  ---

  ### 2. The Teaching Sequence (75 Minutes)

  **Goal:** Do not state the problem in the first 20 minutes. Make them derive the contradiction themselves.

  **Phase 1: The Intuitive Setup (0:00–0:15)**
  *   **Action:** Write $H$ (Bohr Model) and $E$ (Balmer Formula) on the board.
  *   **Ask:** "Why do we regard the Bohr model as confirmed by the Balmer series?"
  *   **Elicit:** Get them to say "Because the model explains the data."
  *   **Formalize:** Ask a Stats student to translate "explains" into Bayesian terms. Write the Confirmation Inequality on the board: $P(H|E) > P(H)$.
  *   **Dependency:** This establishes the normative standard for confirmation they accept.

  **Phase 2: Fixing the Parameters (0:15–0:30)**
  *   **Action:** Ask the room to assign values to the probabilities *at the moment Bohr published his paper (1913)*.
  *   **Constraint 1:** "What is the probability of the Balmer formula in 1913?"
      *   *Guide:* It was empirically established, verified, and in textbooks.
      *   *Result:* Write $P(E) = 1$. (Do not accept 0.99 yet; insist on 'known fact' status).
  *   **Constraint 2:** "What is the probability of $E$ given $H$?"
      *   *Guide:* Bohr derived $E$ from $H$. It's a mathematical consequence.
      *   *Result:* Write $P(E|H) = 1$.
  *   **Dependency:** This locks the room into the "Old Evidence" conditions without naming them yet.

  **Phase 3: The Derivation & The Crash (0:30–0:45)**
  *   **Action:** Invite a student to the whiteboard to calculate $P(H|E)$ using Bayes' Rule with the values fixed in Phase 2.
  *   **The Math:** $P(H|E) = \frac{1 \cdot P(H)}{1} = P(H)$.
  *   **The Reveal:** Circle the result. Point to the Confirmation Inequality from Phase 1.
  *   **Ask:** "According to this math, did Bohr's theory gain *any* support from the spectral lines?"
  *   **Tension:** The math says No ($P(H|E) = P(H)$). The intuition from Phase 1 says Yes.
  *   **Dependency:** Now the problem is felt, not told. The room should be uncomfortable.

  **Phase 4: The Indexing Turn (0:45–0:55)**
  *   **Decision:** **Yes, include the indexing issue.** It is the most productive pivot for this audience.
  *   **Action:** Ask: "Whose probability function is on the board?"
  *   **Distinction:** Distinguish between $P_{\text{Bohr}}$ (the agent's credences in 1913) and $P_{\text{Logical}}$ (a function indexed to the evidence body alone).
  *   **Prompt:** "If $P$ represents rational credence *given the evidence*, should $P(E)$ be 1? If $P$ represents Bohr's *psychological state*, should $P(E)$ be 1?"
  *   **Goal:** Shift the debate from "Is the math wrong?" to "What do the variables represent?" This prevents them from thinking Bayes' Rule itself is broken.

  **Phase 5: The Neighbor (New Theories) (0:55–1:00)**
  *   **Action:** Open the door slightly.
  *   **Prompt:** "We assumed $H$ existed to have a prior $P(H)$. But in 1910, the Bohr model didn't exist. Can you assign a prior to a proposition that hasn't been formulated?"
  *   **Limit:** Do not solve this. Just state that the "Problem of Old Evidence" bleeds into the "Problem of New Theories."
  *   **Goal:** Show POE is not an isolated glitch but part of a dynamic view of theory space.

  **Phase 6: Discussion & Final Question (1:00–1:15)**
  *   **Action:** Open floor for solutions (Garber, Counterfactuals, Jeffrey), but keep them brief.
  *   **Final Question:** (See below).

  ---

  ### 3. The Misconception Map

  **1. The "Fallibilist" Objection**
  *   **The Wrong Turn:** A student argues: "But $P(E)$ is never exactly 1. Empirical data is always uncertain. If $P(E) = 0.99$, confirmation works."
  *   **When:** Phase 2 (Fixing Parameters).
  *   **Intervention:** "If we treat established facts as uncertain, we lose the ability to model how knowledge accumulates over time."

  **2. The "Entailment" Fix**
  *   **The Wrong Turn:** A student suggests: "Just conditionalize on the fact that $H$ entails $E$, not on $E$ itself."
  *   **When:** Phase 4 (Indexing Turn).
  *   **Intervention:** "That moves the evidence, but it doesn't explain why the *old* evidence didn't move the hypothesis."

  **3. The "Psychological" Dissolution**
  *   **The Wrong Turn:** A student claims: "This is just about surprise. Bohr was surprised, so it confirms. Bayes doesn't measure surprise."
  *   **When:** Phase 3 (The Crash).
  *   **Intervention:** "We are modeling rational warrant, not psychological startle responses."

  ---

  ### 4. The Final Question

  Do not ask: "What is the solution to the Problem of Old Evidence?" (This invites recitation).

  **Ask this:**
  > "If you were advising a scientist who refused to update their credence in a theory because the evidence was already known ($P(E)=1$), would you tell them they are being *irrational*, or that our *formalism* is missing a variable?"

  *   **Why:** If they say "irrational," they missed the point (the math forces the result). If they say "missing a variable," they grasp the indexing issue. If they say "tell them to lower P(E)," they fell for the Fallibilist Objection.

  ---

  ### 5. Out of Scope (Deliberate Exclusions)

  1.  **Detailed Solution Taxonomy:** Do not spend time detailing Garber's solution vs. Jeffrey's vs. Counterfactuals. Mention them as names only. The session is about the *problem*, not the literature review.
  2.  **Likelihoodism:** Do not introduce Likelihoodist confirmation ($P(E|H) > P(E|\neg H)$). It dissolves POE too easily and will distract from the Bayesian tension you are building.
  3.  **Non-Ideal Agents:** Do not discuss computational limits or bounded rationality. Keep the agents logically omniscient for the sake of the puzzle.
  4.  **The History of Bohr:** Do not get bogged down in whether Bohr *actually* knew the Balmer series beforehand. Stipulate it as a thought experiment condition.
