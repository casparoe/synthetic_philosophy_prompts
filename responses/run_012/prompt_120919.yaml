answer: |-
  The historicity debate over the Exodus stalls because it conflates why a story survives with what caused it. Your proposed split between attestation criteria (what a community was willing to say) and occurrence criteria (what happened on the ground) cuts the Gordian knot. The standard criterion of embarrassment is routinely misused as an occurrence criterion. The argument runs: "Israel would not invent a slave origin; therefore, they were slaves." This is logically flawed. It assumes invention is driven by pride rather than function. When split, embarrassment becomes purely attestation work. It tells us that the tradents felt compelled to preserve a counter-hegemonic identity despite its shame. It licenses a claim about the community's self-definition, not the Delta labor camps.

  Run through this split, the "inconvenient" features of the narrative lose their weight as occurrence evidence but gain density as attestation data. The Egyptian name of the founding hero, Moses, and the Zipporah episode—where Yahweh attacks Moses and is appeased only by a bloody circumcision—are not historical fossils proving the event occurred. They are theological anchors proving the tradition's resistance to sanitization. These features license the conclusion that the identity formed around this story required a break from purity or prestige. They signal a community defining itself against empire, not a community recording a victory. The "mixed multitude" leaving Egypt functions similarly. It is attestation evidence of a composite group formation, not occurrence evidence of a mass migration. Unsplit criteria treat these as proofs of history; split criteria recognize them as proofs of memory construction.

  This separation does work the unsplit model cannot. It prevents the argument from collapsing into a binary of "true" or "false." Instead, it allows us to say the story is historically false in its literal occurrence but historically true in its sociological function. However, we must turn the lens around. Does any occurrence work survive this filtration? The Merneptah Stele provides a hard floor: Israel exists as a people in Canaan by 1208 BCE. The toponym "Rameses" provides a hard anchor: the memory is specifically tied to the 19th Dynasty Delta. These are occurrence constraints. They tell us *when* and *where* the memory crystallized, even if they do not confirm the *what*.

  The Egyptian silence is not merely a shifted burden; it is positive evidence against the biblical scale. A civilization that recorded labor gangs and border crossings did not miss a national liberation that devastated their economy. Silence here functions as an occurrence criterion limiting the scope of the event. It rules out the 600,000 fighting men. It rules out the plagues as described. It forces the occurrence hypothesis into the shadows of small-scale movements or administrative expulsions, not miraculous deliverance. The silence is evidence of absence regarding the narrative's magnitude, not necessarily the absence of any Semitic movement.

  The reverse test is critical: does attestation constrain occurrence? Yes. The shape of the attested tradition rules out certain historical models. If the founding myth is fundamentally about escape from Egypt rather than conquest of Canaan, a pure military conquest model of Israelite origins is historically inadequate. The attestation fact (we tell this story) constrains the occurrence hypothesis (it wasn't just a local revolt). The story's persistence suggests a kernel of experience that demanded this specific narrative form. The Hyksos expulsion tradition recorded by Manetho offers a parallel occurrence possibility: a collective memory of expulsion inverted into a story of liberation. The attestation constrains the occurrence to involve a relationship with Egypt, even if the direction of travel is mythologized.

  Is the distinction too clean? There is friction. Attestation facts do constrain occurrence because memories do not form in a vacuum. They require a stimulus. The "oddity of inventing an origin in slavery" is not just attestation; it hints at occurrence because traumas usually precede the myths that process them. However, the link is not direct. The split holds, but it is porous. We cannot know the event, but we can know the pressure the event exerted on the memory.

  So, what is the verdict? The historicity question is undecidable regarding the event but decidable regarding the memory. It is not baseless to say something happened, but it is baseless to say the Bible describes it. The parallel is Troy. Schliemann found burnt citadel levels; occurrence is confirmed. But the *Iliad* describes a war over a woman fought by heroes; attestation is confirmed. The historical war was likely over trade routes fought by warlords. The Exodus is similar. There is a burnt layer—the emergence of Israel in the highlands, the Egyptian loanwords, the 19th Dynasty memory. But the war story—the plagues, the sea, the mass migration—is the *Iliad*.

  The split criteria reveal that the hunt for a historical Exodus is a category error. We are looking for occurrence data using attestation tools. The embarrassment of slavery proves the identity, not the event. The silence proves the scale is mythic, not the movement is non-existent. The verdict is that the Exodus is historically real as a constitutive trauma that formed a people, but historically elusive as a discrete chronological event. We can recover the need for the Exodus, but not the Exodus itself. This is not agnosticism; it is precision. The text delivers the history of Israel's self-understanding, not the history of Pharaoh's reign. To demand more is to ask the evidence to speak a language it does not know.
