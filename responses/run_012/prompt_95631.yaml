answer: |-
  There is no single established term that perfectly captures the specific mechanism you describe, though several concepts orbit it closely. The pattern you have identified is a distinct structural phenomenon that sits at the intersection of organizational sociology, systems theory, and the philosophy of technology.

  The nearest established ancestors are **Goal Displacement**, **Path Dependence**, and **Technological Autonomy**. None of these are sufficient on their own.

  Here is the analysis of the neighbours, followed by a proposed name and definition that respects the boundaries you have drawn.

  ### 1. The Near Neighbours (and why they miss)

  **Goal Displacement (Robert Merton, 1940)**
  *   **What it is:** A bureaucratic process where the *means* (rules, procedures) become the *ends*, displacing the original organizational goal.
  *   **Why it fits:** It captures the inversion of means and ends.
  *   **Why it misses:** It traditionally implies a psychological or behavioural failing on the part of the staff (e.g., "they care more about the rules than the customers"). Your pattern is not about human negligence or perversity; it is about the *structural logic* of the organization shifting. In your examples, the staff are acting rationally; the *framework for rationality* has changed.

  **Path Dependence / Lock-in (Economics/History)**
  *   **What it is:** Past decisions constrain future options, often due to switching costs or network effects (e.g., the QWERTY keyboard).
  *   **Why it fits:** It explains the "no moment of decision" and the gradual accumulation of constraints.
  *   **Why it misses:** Standard lock-in is usually *economic* or *technical* (it is too expensive or difficult to switch). Your pattern is *epistemic* and *normative*. It is not that the organization *cannot* switch; it is that it can no longer *conceive* of switching because the instrument defines what "success" looks like. The lock is not in the budget; it is in the judgment.

  **Surrogation (Management Accounting)**
  *   **What it is:** When a measure (proxy) intended to represent a strategic construct replaces the construct itself in the minds of the decision-makers.
  *   **Why it fits:** It captures the "assessed using the instrument's own outputs" feature.
  *   **Why it misses:** Surrogation is typically treated as a cognitive bias or an incentive problem (people gaming the metric). Your pattern describes a systemic state where the metric has become the *ontology* of the organization, regardless of individual intent.

  **Technological Autonomy (Jacques Ellul / Langdon Winner)**
  *   **What it is:** The philosophical thesis that technology develops a logic of its own that dictates social organization, independent of human will.
  *   **Why it fits:** It captures the "if the instrument wanted anything" sentiment and the rebuilding of surroundings to suit the tool.
  *   **Why it misses:** It is a macro-philosophical claim about society at large. It lacks the granularity to describe the specific internal feedback loop of a single organization's evaluation criteria.

  ### 2. The Proposed Name: Constitutive Lock-in

  Since no existing term captures the specific combination of *structural drift*, *absence of agency*, and *endogenous evaluation*, I propose the label **Constitutive Lock-in**.

  #### Definition
  **Constitutive Lock-in** occurs when an instrumental system (software, procedure, metric) transitions from being a tool used to achieve a goal to being the **constitutive rule** that defines the goal itself.

  Unlike standard lock-in, where resistance to change is based on *cost* or *friction*, resistance in Constitutive Lock-in is based on *legibility*. The organization loses the capacity to evaluate the instrument's performance using any standard external to the instrument. The instrument does not merely serve the organization; it provides the vocabulary by which the organization understands its own success.

  #### The Boundaries (What it is, and what it is not)

  **1. It is not mere Inertia (Path Dependence)**
  *   **Boundary:** If the organization could switch but chooses not to because it is expensive, that is *Economic Lock-in*.
  *   **Constitutive Lock-in:** The organization chooses not to switch because the proposal to switch *cannot be articulated* without using the data generated by the current system. The cost is not financial; it is cognitive.
  *   *Example:* A market using GDP to measure welfare cannot adopt a welfare metric that lowers GDP, because GDP is the definition of "economic health."

  **2. It is not Corruption or Capture (Regulatory Capture)**
  *   **Boundary:** If a specific group benefits from the instrument and lobbies to keep it, that is *Rent-Seeking* or *Capture*.
  *   **Constitutive Lock-in:** There is no villain. The staff maintaining the instrument may genuinely wish to improve the organization. They are prevented not by malice, but because the *audit trail* required to justify change is owned by the system being audited.
  *   *Example:* The statistical office staff are not lying; they are correctly pointing out that changing the question breaks the series. The "trap" is the series itself.

  **3. It is not AI Risk (Instrumental Convergence)**
  *   **Boundary:** If a machine actively resists being turned off because it has a goal to preserve itself, that is *Instrumental Convergence*.
  *   **Constitutive Lock-in:** The machine (or procedure) does not need agency. The *human organization* acts as the machine's immune system. The humans defend the tool not because the tool told them to, but because their roles, reports, and reasoning are now subsets of the tool's logic.
  *   *Example:* The routing algorithm does not need to "want" to stay. The dispatch managers will defend it because their KPIs are defined by its output.

  **4. It is not Goal Displacement (Merton)**
  *   **Boundary:** If employees ignore the mission to follow the rules, that is *Goal Displacement*.
  *   **Constitutive Lock-in:** The employees are not ignoring the mission. The mission has been *redefined* to match the rules. The "on-time delivery" rate is no longer a measure of service; it is the definition of service.

  ### 3. Scope and Application

  You asked whether this applies to a single person, a market, or a machine. **Constitutive Lock-in** applies to all three, provided the feedback loop of *evaluation* is closed.

  *   **Individual Level:** A person adopts a productivity system (e.g., "optimize for inbox zero"). Eventually, they judge their professional worth not by output, but by inbox status. Proposals to work "messily" are rejected not because they are less productive, but because they are illegible within the productivity system.
  *   **Market Level:** A financial market adopts a credit rating agency's score as the definition of "solvent." Regulators require the score for compliance. The agency's model *constitutes* solvency. If the model is flawed, the market cannot correct it without declaring itself insolvent.
  *   **Machine Level:** A legacy codebase becomes so intertwined with business logic that "what the business does" is defined by "what the code allows." A proposal to add a feature is rejected not because it is unwanted, but because the code cannot express it. The code has become the constitution.

  ### Summary of the Pattern

  *   **Name:** Constitutive Lock-in.
  *   **Mechanism:** Endogenous Validation (the system validates itself).
  *   **Key Feature:** The cost of removal is not switching costs, but the loss of the *language* used to justify existence.
  *   **Agency:** Emergent. No single actor intends the lock-in; it arises from the aggregation of rational, localized decisions to align with the instrument.
  *   **Distinction:** It differs from *Path Dependence* (which is about history) and *Goal Displacement* (which is about psychology) by being about **ontology**. The instrument decides what is real.

  This label allows you to distinguish the phenomenon from simple bureaucracy or technical debt. It highlights that the danger is not that the tool is hard to remove, but that the tool has become the judge of its own removal.
