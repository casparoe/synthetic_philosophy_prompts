      *   *Charitable Reading:* It's not that mixing labor *makes* the land private by right (Locke style); it's that private possession is the *only mechanism* to secure the improvement. The "arose from" is historical/sociological, not necessarily moral justification. He is describing *how* property happened, then immediately correcting it with *what is just*.
