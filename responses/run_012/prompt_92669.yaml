answer: |-
  You are right to feel tension in the text. Paine is trying to thread a needle between Lockean labor theory (you own what you make) and Geolibertarian common ownership (no one made the earth). The argument holds together, but only if you treat certain sentences as pragmatic concessions rather than moral absolutes.

  Here is the breakdown of the joints, the load-bearing premises, and where you have to do the work for him.

  ### 1. The "Inseparable Connection" Inference
  **Your problem:** If you can't separate the improvement from the soil, why does that grant ownership of the soil? Shouldn't the soil stay common?

  **The Joint:** Paine is making a distinction between *possession* and *absolute property*.
  When he says landed property "arose from that inseparable connection," he is making a historical and practical claim, not a moral one. He is admitting that in the real world, you cannot farm a plot without excluding others from it. If the community insists on keeping the soil 100% common, no one will cultivate it, and everyone starves.

  **The Charitable Reading:**
  Paine is not saying, "Because you mixed labor with land, you own the land forever."
  He is saying, "Because you mixed labor with land, society must allow you exclusive *use* of that patch to secure your labor."

  The step you are missing is that Paine views private landed property as a **necessary evil** or a **practical utility**, not a natural right. He validates the *possession* required to farm, but he immediately clips its wings. He grants the cultivator the right to hold the land *only* insofar as is necessary to secure the improvement. The "inference" isn't that the soil becomes private property; it's that private *tenure* becomes the only mechanism to achieve public good (food production).

  **Where it could fall apart:** If you read "landed property arose" as a moral justification for feudal-style ownership, it contradicts his next sentence. You must read it as: "We allowed private possession for practical reasons, but we did not surrender the underlying title."

  ### 2. The Ground-Rent Tension
  **Your problem:** If the improvement is the cultivator's, why pay rent on the land? What is the rent *for*, and how is it calculated?

  **The Joint:** Paine is splitting the value of a farm into two distinct buckets:
  1.  **Natural Value:** What the land is worth in its wild state (Common Property).
  2.  **Improved Value:** The difference between the wild state and the farm (Individual Property).

  **What the rent is for:**
  The rent is not a charge on the improvement. It is a fee for **exclusion**. By holding a plot of land, the cultivator is excluding every other human being from their natural share of that soil. The ground-rent is the compensation paid to the excluded majority for the monopolization of the common asset.

  **How the figure is set:**
  Paine addresses this later in the pamphlet (though not in your excerpt). The rent is calculated on the value of the land *as if it were uncultivated*.
  *   *Example:* If a wild acre is worth $10/year, and a farmed acre is worth $100/year.
  *   The cultivator owns the $90 (improvement).
  *   The community owns the $10 (soil value).
  *   The ground-rent is levied on that $10.

  **Is it sloppy?**
  It is theoretically clean but administratively difficult. It relies on the assumption that assessors can accurately determine the "natural value" of land independent of its location or surrounding improvements. Paine assumes this is possible; a critic would say market value is always a mix of both. But logically, the argument holds: you own the value you created; you rent the value you found.

  ### 3. The "First Principle" Premise
  **Your problem:** Is the claim that "no one should be worse off than in the state of nature" load-bearing, or just decoration?

  **The Verdict:** It is the **load-bearing beam** for the *distribution* of the rent, though not for the *collection* of it.

  *   **For Collection:** You do not need this premise to justify the tax. The argument that "the earth is common property" is sufficient to justify charging rent for its use. Even if civilization made everyone richer, the community could still claim rent on the soil simply because the community owns the soil.
  *   **For Distribution:** You *absolutely* need this premise to justify paying the rent out as a universal dividend (which Paine proposes). Without this principle, the ground-rent could just go into a general treasury for roads or armies.

  **Why it matters:**
  Paine is trying to solve a specific moral injury: Dispossession. When land becomes private, the landless are robbed of their natural inheritance.
  *   If you drop the "First Principle," the argument becomes: "Landowners pay a tax because they use common resources." (This is a usage fee).
  *   With the "First Principle," the argument becomes: "Landowners pay compensation because they have taken something that belonged to everyone else." (This is a dividend/rights payment).

  The premise transforms the payment from a **tax** (which implies taking from the rich for the public good) into a **debt** (which implies returning to the poor what is already theirs). It ensures the landless aren't just "supported," but "indemnified."

  ### 4. Where the Sympathetic Reader Must Supply Glue
  To keep this argument from falling apart, you have to supply three assumptions Paine leaves implicit:

  1.  **Valuation is Possible:** You must accept that it is possible to distinguish the value of the soil from the value of the labor, even though they are physically inseparable. Paine assumes market assessors can do this; you have to grant him that this is a technical problem, not a philosophical one.
  2.  **Cultivation Benefits All:** You must assume that the increase in total productivity from private cultivation is high enough to pay the ground-rent *and* still leave the cultivator better off than they would be in the state of nature. If the rent is too high, cultivation stops. If it's too low, the landless are still worse off. Paine assumes a "goldilocks" zone exists.
  3.  **Possession ≠ Title:** You have to read "landed property" in the first paragraph as "exclusive tenure" rather than "absolute ownership." If you read it as absolute ownership, the second paragraph contradicts it. If you read it as a leasehold granted by society for the purpose of cultivation, the logic flows.

  ### Summary of the Joints
  *   **Sentence 1-2:** Establishes the baseline moral truth (Earth = Common).
  *   **Sentence 3:** Establishes the practical necessity (Cultivation = Good, requires exclusion).
  *   **Sentence 4:** The Pivot. Acknowledges private tenure arose from necessity, but limits its moral scope to the *improvement only*.
  *   **Sentence 5:** The Conclusion. Because the soil value remains common, the holder of the tenure must pay rent to the other owners (the community).
  *   **The "First Principle":** This sits outside this specific paragraph but dictates where the rent money goes. It ensures the rent functions as restitution for dispossession, not just public revenue.

  Paine isn't being sloppy; he is compressing a distinction between *use-rights* (private) and *title-rights* (common) into a few sentences. The tension you feel is the friction between those two concepts. He resolves it by making the private right conditional on the payment of the rent.
