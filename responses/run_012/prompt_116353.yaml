answer: |-
  **Setting:** *A quiet corner of the university library café. Empty coffee cups and a copy of Simone Weil's "On the Abolition of All Political Parties" sit on the table between Elena and Marcus.*

  **Elena:** (Tapping the book) It's radical, I know. But the more I read her, the more I think she's the only one who actually diagnoses the sickness. It's not *who* is in the parties, Marcus. It's the structure itself.

  **Marcus:** I get the appeal. Especially right now. But abolishing *all* parties? That's a vacuum. Nature abhors a vacuum, and politics abhors it even more. Informal cliques would just form, but without the accountability of a label.

  **Elena:** That's the standard defense. But look at this proposal my seminar group is discussing. It's designed to bypass exactly what you're worried about. A "Sortition Party."

  **Marcus:** I heard about this. Right. No leader, no manifesto.

  **Elena:** Exactly. Every election cycle, they recruit five hundred members purely by lottery. Random citizens. Those five hundred make all the decisions for the party. Once the election is over, the party dissolves. The members go back to their lives. No career politicians, no donors, no entrenched ideology. If Weil were alive, you'd think she'd have to admit this breaks the machine.

  **Marcus:** (Leaning forward) I think it's fascinating. Actually, I think it might work. It solves the incentive problem. These people aren't trying to get re-elected. They aren't beholden to a whip. They can't be bought because they don't exist as a unit long enough to be corrupted. It forces genuine deliberation.

  **Elena:** (Shaking her head slowly) No. You're focusing on the *people*. Weil focuses on the *entity*.

  **Marcus:** But the entity is transient. It's a flash in the pan.

  **Elena:** It's still a party. It still has a name on a ballot. It still asks for votes. The moment those five hundred random people sit in a room and realize, "We are the Sortition Party," the pressure begins. Weil calls it "collective passion." It's a subtle pressure. You don't even notice it.

  **Marcus:** What pressure? They don't have a platform to defend.

  **Elena:** They will build one. Immediately. Because to win votes, they have to distinguish themselves from the *other* parties. As soon as they define themselves against the Conservatives or the Greens, they create an "us" and a "them." And once you have an "us," truth becomes secondary to victory.

  **Marcus:** That's cynical, Elena. Why can't they just say, "We are random citizens, here is what we think is true after debating it"?

  **Elena:** Because they want to win. Weil says the fundamental law of a party is self-preservation. Even this temporary party. If they lose, they feel they failed. If they win, they feel validated. That emotional investment clouds judgment. Imagine one of those random members. Let's call her Sarah. Sarah thinks Policy X is just. But the other 499 members vote for Policy Y because it polls better. Does Sarah speak out?

  **Marcus:** Maybe she does. She has no career to lose.

  **Elena:** She has her social standing within the group to lose. She has the desire to be on the winning team. Weil writes that the party creates a "fabric of lies." If Sarah stays silent to keep the group cohesive, she's participated in the lie. The structure demands conformity, even without a leader. The group *becomes* the leader.

  **Marcus:** Okay, but compare that to the alternative. Without parties, how do you coordinate? You have a thousand individual candidates. How does a voter know what they stand for? Parties aggregate interests. They say, "If you care about labor, generally, we are the vehicle for that."

  **Elena:** They say, "If you care about labor, you must shut up about this specific issue because it hurts the brand." That's the suppression of truth.

  **Marcus:** I'd call it compromise. Democracy is pluralistic. We disagree. Parties allow us to bundle disagreements into manageable choices. Your Sortition Party actually makes this worse.

  **Elena:** How?

  **Marcus:** Because it's unaccountable. If a traditional party breaks a promise, you vote them out next time. There's a thread of continuity. But this Sortition Party? They dissolve. If they make a mess of things, who do you punish? The lottery? You can't throw the rascals out if the rascals cease to exist.

  **Elena:** That's a practical objection. I'm making a moral one. The issue isn't accountability to the voter; it's accountability to the truth.

  **Marcus:** (Sighs) See, that's where Weil loses me. She treats politics like a monastery. It's not about finding absolute Truth with a capital T. It's about managing conflict without violence. Parties channel passion. Yes, they generate heat, but they also burn off steam. If you remove the formal parties, the passions don't disappear. They just go underground. They become sectarian, tribal, maybe violent.

  **Elena:** So we accept corruption because the alternative is chaos?

  **Marcus:** I'm saying the "corruption" you're talking about is actually the friction of diverse people trying to live together. Let's go back to your Sortition Party. You say they'll develop a party spirit. But without a manifesto, what binds them?

  **Elena:** The campaign itself binds them. They are contestants.

  **Marcus:** But they aren't professionals. They're neighbors. If I'm randomly selected, and I'm sitting there with a teacher, a nurse, and an engineer... we might actually listen to each other. We don't have talking points.

  **Elena:** You think randomness cures the human desire to belong? To be right? Give it two weeks. Those five hundred people will develop slang. Inside jokes. They'll start viewing the other parties as enemies who are "obstructing the will of the people."

  **Marcus:** Or, they view the other parties as entrenched interests. Look, Elena, the problem isn't the party. It's the money. It's the gerrymandering. It's the media ecosystem. Blaming the *concept* of a party is like blaming the car for traffic jams.

  **Elena:** No, it's blaming the engine for running on combustion. Weil's point is that the *mechanism* of a party is to prioritize the group's growth over the public good. Even your Sortition Party has to grow. They have to campaign. They have to sell themselves.

  **Marcus:** They have to present a choice.

  **Elena:** To sell themselves, they have to simplify. They have to use slogans. Slogans are the enemy of thought. As soon as that random nurse agrees to chant a slogan on a placard, she has stopped thinking. She has become a tool of the collective.

  **Marcus:** (Pauses, thinking) Okay. That's a strong point. The performative aspect of campaigning. But... isn't there a difference between a permanent machine and a temporary jury? A jury is a group. They deliberate. They decide. We don't say juries are inherently corrupt because they reach a verdict.

  **Elena:** A jury doesn't campaign for votes. A jury doesn't have to defeat another jury to exist.

  **Marcus:** But this party does. And that's the rub. You're saying the *electoral contest* is the poison.

  **Elena:** I'm saying the *party form* within an electoral contest is the poison. It turns the public good into a prize to be won, rather than a truth to be discovered.

  **Marcus:** But who discovers the truth? You? Me? We're biased too. At least a party forces us to coalition-build. If your Sortition Party decides that "Truth" requires raising taxes by 50%, and they run on that, they'll get crushed.

  **Elena:** Good! Then the truth was too hard for the people.

  **Marcus:** (Laughs) That is incredibly elitist for a theory about liberating the individual mind.

  **Elena:** It's not elitism. It's recognizing that some truths aren't popular. Weil was a mystic, basically. She thought you should act for justice even if it destroys you. A party is designed *not* to be destroyed. It's designed to survive. That survival instinct is incompatible with pure justice.

  **Marcus:** I agree that survival instinct is dangerous. But without the structure, you have no leverage. You can't govern. You can't pass a budget. You can't negotiate a treaty. You need a stable agent.

  **Elena:** So we accept the lie for the sake of stability?

  **Marcus:** I accept the imperfection for the sake of function. Look, I'll meet you halfway. Your Sortition Party is a great *check* on the system. Maybe they should exist alongside traditional parties. A wildcard.

  **Elena:** If they exist alongside, they become part of the game. They'll form alliances. "We'll support your bill if you support ours." Then they're just a normal party with a weird selection process.

  **Marcus:** Or they become a catalyst. They force the other parties to be honest because the random citizens can't be whipped.

  **Elena:** (Smiles faintly) You're optimistic, Marcus.

  **Marcus:** And you're purist, Elena.

  **Elena:** Maybe. But Weil would say purity is the only thing that matters in politics. Anything less is just management of the status quo.

  **Marcus:** And I'd say management of the status quo is what keeps the lights on and prevents civil war. But... (He glances at the book) I will admit. The idea that those five hundred random people would eventually start calling themselves "The Randoms" and develop a sense of superiority over the "Career Politicians"?

  **Elena:** Oh, absolutely. Within a month.

  **Marcus:** (Chuckles) Okay. Fair. The tribe forms fast. But I still think I'd rather vote for a temporary tribe of neighbors than a permanent tribe of donors.

  **Elena:** Then you're not defending parties. You're just choosing the lesser evil.

  **Marcus:** In politics, Elena, isn't that the whole point?

  **Elena:** (Closes the book) According to Weil? Yes. And that's why we should abolish them all.

  **Marcus:** (Grins) Coffee's on me. But I'm still voting for the Sortition Party.

  **Elena:** Just don't join it. Or you'll start believing your own slogans.
