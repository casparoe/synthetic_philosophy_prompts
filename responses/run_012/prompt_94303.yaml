answer: |-
  Your verdicts map remarkably cleanly onto a specific, well-known tension in decision theory: the conflict between **myopic act-optimization** and **global policy-optimization**, filtered through a distinction between **structural coherence** and **instrumental success**.

  You are effectively operating with a hybrid of **McClennen's Resolute Choice** and **Parfit's Dispositionalism**, but with a lean toward **Sophistication** (precommitment) when available.

  Here is the principle family that generates your verdicts, the case that motivates each clause, the verdict you must surrender, and the application to your new cases.

  ### The Principle: Reliable Global Optimization (RGO)

  RGO is not a single axiom but a triad of constraints on a rational agent.

  **1. The Structural Coherence Constraint**
  *   **Statement:** An agent's preference ordering over outcomes must be transitive and complete to constitute a valid utility function. Intransitivity is a defect of the agent's evaluative machinery, regardless of whether it leads to exploitation.
  *   **Motivating Case:** *Intransitive tastes, no traders (Island).* You feel a defect exists even without a money pump. This clause validates that intuition: intransitivity is a logical failure of valuation, distinct from instrumental failure.
  *   **Exemption:** *Mere reversal, no trader.* Preferences may change over time provided they are synchronically coherent. Diachronic stability is not required; structural coherence is.
  *   **Exemption:** *New information.* Preference changes driven by belief updates are not preference changes *simpliciter*; they are expected utility recalculations based on new parameters.

  **2. The Non-Dominated Policy Constraint**
  *   **Statement:** Rationality evaluates *policies* (strategies over time), not just isolated acts. An agent is irrational if they adopt a policy that is strictly dominated by an available alternative policy, where "available" includes precommitment technologies and resolute planning.
  *   **Motivating Case:** *A diachronic pump.* Taking the first trade while knowing you will take the second is irrational because the *policy* "Swap Today & Swap Tomorrow" is dominated by "Keep A."
  *   **Motivating Case:** *Intransitive tastes, pumpable.* Taking all three swaps is irrational because the policy "Accept All Swaps" is dominated by "Accept None."

  **3. The Reliability Implementation Clause**
  *   **Statement:** When a globally optimal policy requires actions that are locally suboptimal at the time of execution, the agent must implement that policy via the most reliable mechanism available to them. If precommitment is available and cost-effective, it is rationally required over bare resolution.
  *   **Motivating Case:** *Precommitment.* You are more confident in this than bare refusal. This clause explains why: it is the more reliable implementation of the Non-Dominated Policy.
  *   **Motivating Case:** *The Toxin.* The rational failing is in the disposition (the inability to adopt the policy "Intend & Drink"), even if the act (Not Drinking) is locally optimal given the money is banked. The agent fails to be the *kind of agent* who can secure the best global outcome.

  ---

  ### The Honest Trade-off: Which Verdict Must Go?

  To maintain the precision of **RGO**, specifically the **Reliability Implementation Clause**, you must give up or significantly downgrade one of your verdicts:

  **You must give up the verdict that *Bare Resolute Refusal* is fully rational.**

  **Why:**
  Your verdicts state that *Resolute Refusal* ("I refuse the third... though I prefer the apple") is **right**, and *Precommitment* is **more confident**.
  However, under RGO, if you know you are susceptible to a diachronic pump (as implied by your verdict on the *Diachronic Pump* case), relying on bare resolution is a failure of instrumental rationality if precommitment is available.
  *   If you are truly **Resolute** (in the McClennen sense), you do not need precommitment; paying for it would be irrational waste.
  *   If you need **Precommitment** (in the Sophisticated sense), then bare resolution is unreliable hope. Planning to be resolute without binding yourself is adopting a dominated policy (higher risk of failure for no gain).

  You cannot have it both ways. Either resolution is a costless cognitive technology that guarantees compliance (making precommitment wasteful), or it is fallible (making precommitment mandatory). Your intuition that precommitment is "more confident" admits the fallibility of resolution. Therefore, strictly speaking, **Bare Resolute Refusal is irrational risk-taking** compared to Precommitment. You should view it as *excusable*, but not *optimal*.

  ---

  ### Verdicts on New Cases

  Applying **RGO** to your unlisted cases:

  **1. The Two-Day Cycle Agent**
  *   *Case:* Transitive at every moment ($A \succ B$ on Day 1, $B \succ A$ on Day 2), but preferences cycle with a period of two days. A patient trader pumps them.
  *   *Verdict:* **Irrational.**
  *   *Reasoning:* This violates the **Non-Dominated Policy Constraint**. While the agent satisfies *Structural Coherence* synchronically, they fail *Dynamic Consistency*. The preference reversal is not driven by *New Information* (belief update) but by arbitrary temporal drift. A policy that allows oneself to be pumped by known temporal cycles is dominated by a policy of stabilizing preferences or precommitting to the Day 1 ranking.

  **2. The Self-Modifying Agent**
  *   *Case:* An agent would pay to have their intransitive tastes replaced by transitive ones, losing nothing else.
  *   *Verdict:* **Rational (Required).**
  *   *Reasoning:* This follows from the **Structural Coherence Constraint**. Since intransitivity is a defect of the evaluative machinery (per the *Island* case), and the agent has the opportunity to repair this defect at no cost, failing to do so is maintaining a known defect. It is analogous to correcting a logical error in one's reasoning engine.

  **3. The Model-Dependent Agent**
  *   *Case:* An agent is exploitable only by someone with a detailed model of her, not by anyone offering standard trades.
  *   *Verdict:* **Irrational.**
  *   *Reasoning:* This follows from the **Non-Dominated Policy Constraint**. Exploitability is a modal property, not a probabilistic one. If there *exists* a sequence of offers (accessible to a trader with a model) that pumps the agent, the agent's decision function is flawed. Rationality requires robustness against exploitation, not just immunity from opportunistic passersby. If your decision theory outputs a dominated strategy in some possible world, it is defective.

  ### Summary of the Tension

  Your intuitions are those of a **Sophisticated Chooser** who admires **Resolute Choice**. You want the security of precommitment but the dignity of resolution.

  The principle of **Reliable Global Optimization** forces you to acknowledge that dignity is expensive. If you know you are dynamically inconsistent enough to be pumped, planning to resist via willpower alone is not "right"; it is merely a less expensive, riskier version of precommitment. If the cost of precommitment is low, the "right" choice is to bind. If you refuse to bind and rely on resolution, you are gambling with your own rationality.

  To keep your system consistent, you must categorize *Bare Resolute Refusal* as **suboptimal** whenever *Precommitment* is available.
