answer: |-
  ### Scholarly Context & Terminology Key
  *Use this guide to ensure the introduction and framing of the episode do not present the guest's specific arguments as established fact. The landscape of Machiavelli scholarship is deeply fractured on these points.*

  | Claim / Concept | Status in Scholarship | Notes |
  | :--- | :--- | :--- |
  | **Machiavelli uses *fortuna* and *virtù* as central concepts.** | **Settled** | All specialists agree these are the operative terms in *The Prince* and *Discourses*. |
  | **The relationship between *fortuna* and *virtù* is dualistic (rival forces).** | **Contested** | The traditional view (Burckhardt, Berlin) sees them as opposing forces. The guest's view (monistic/phenomenological) is a revisionist position (akin to arguments by Hanna Pitkin or more recent agency-focused readings). |
  | **The coherence of *The Prince* and *Discourses*.** | **Contested** | It is debated whether Machiavelli had a unified political theory or if the texts serve different purposes (advice to princes vs. republican theory). The guest assumes unity. |
  | **The meaning of *virtù* (moral vs. technical).** | **Contested** | Does *virtù* imply moral goodness (traditional humanism) or effective efficacy (the guest's likely stance)? |
  | **The Cesare Borgia example (Chapter 7).** | **Contested** | Whether Borgia's failure refutes Machiavelli's theory of agency is a classic debate. The guest claims her reading solves this; many scholars argue it remains a counter-example. |
  | **The significance of gendered imagery.** | **Contested** | Feminist readings (e.g., Mary Dietz) argue the imagery is ideological/patriarchal. Others argue it is merely conventional Renaissance rhetoric. The guest argues it is functional to the theory of agency. |

  ***

  ### Interview Questions

  **1. The Problem of "Matching the Times"**
  In Chapter 25 of *The Prince*, Machiavelli suggests that success depends on a man's mode of proceeding matching the character of the times. He explicitly states that a man cannot change his nature to fit the times, which implies that luck determines who succeeds. If *virtù* is simply the capacity to shrink indeterminacy, how do you account for the agent who possesses high *virtù* but fails simply because their fixed nature clashes with the temporal moment? Doesn't this reintroduce luck as a priority over agency?
  *   **Likely Answer:** She will argue that recognizing the times *is* part of shrinking indeterminacy, and that the "fixed nature" problem is a specific limit-case, not the general rule.
  *   **Follow-up:** But if the nature is fixed and the times change, isn't the indeterminacy ultimately determined by the *times*, not the agent's capacity to shrink it? Does your reading risk turning *virtù* into a tautology where success proves you had it, and failure proves you didn't, regardless of the structural constraints?

  **2. *Virtù* in *The Prince* vs. The *Discourses***
  Your definition of *virtù* as the reduction of situational indeterminacy fits well with the princely project of acquiring and holding a state. But does this technical definition stretch too thin when applied to the civic *virtù* found in the *Discourses*? Can the long-term institutional stability of a republic really be described as "shrinking indeterminacy" in the same way a prince seizing power does, or does your reading quietly privilege the authoritarian immediacy of *The Prince* over the republican longevity of the *Discourses*?
  *   **Likely Answer:** She will likely argue for a unitary concept of *virtù* that applies to both founding and maintaining, suggesting institutions are just "dykes" built to manage future indeterminacy.
  *   **Follow-up:** If institutions are dykes, does that reduce the citizen's role to merely maintaining embankments? Does this strip the *Discourses* of its normative claim that civic participation is good in itself, reducing it instead to a mere technology for risk management?

  **3. The Explanatory Power of *Fortuna***
  If *fortuna* is just the name for indeterminacy before action, and *virtù* is the name for the reduction of that indeterminacy through action, what explanatory work is *fortuna* actually doing? Does it not collapse into a residual term for whatever *virtù* has failed to explain? If Borgia fails, was it because indeterminacy returned (fortune) or because his capacity to shrink it was insufficient (lack of virtù)?
  *   **Likely Answer:** She will likely argue *fortuna* marks the limit of human control, serving as a boundary concept that prevents *virtù* from becoming omnipotence.
  *   **Follow-up:** But if *fortuna* only names the limit where *virtù* stops, isn't it functionally identical to the traditional dualist view you're trying to overturn? At what point does "indeterminacy" become an external force again, rather than just a description of the situation?

  **4. The Gendered Imagery and Violence**
  You argue that the images of the swollen river and the woman who must be beaten are rhetorical elaborations of agency. But if *fortuna* is truly just neutral "indeterminacy," why is the imagery so intensely gendered and violent? Does your reading sanitize the misogyny of the text by treating it as functional metaphor, ignoring the possibility that Machiavelli is encoding a specific patriarchal politics of domination rather than a neutral theory of action?
  *   **Likely Answer:** She will likely contend that the violence is metaphorical for the force required to impose order on chaos, not a literal prescription for gender relations.
  *   **Follow-up:** Even if metaphorical, why *this* metaphor? If the core claim is about ordering chaos, why not use the metaphor of a builder or a navigator? Does the choice of sexual coercion suggest that the "indeterminacy" Machiavelli fears is specifically associated with the feminine in his cultural imaginary, which your functionalist reading might overlook?

  **5. The Borgia Counter-Example**
  You claim your reading dissolves the objection that Cesare Borgia refutes Machiavelli. Borgia did everything right—his *virtù* was maximal—yet he failed due to his father's death and his own illness. On your account, was Borgia's failure a failure to shrink indeterminacy, or was it an instance where indeterminacy proved un-shrinkable? If the latter, doesn't that concede that *fortuna* operates independently of *virtù* after all?
  *   **Likely Answer:** She will argue that Borgia's illness was an ontological limit, not a political one, and that *virtù* is not magic; it operates within the realm of human affairs, not biology.
  *   **Follow-up:** But Machiavelli presents Borgia's failure as a political lesson, not a medical one. If *virtù* cannot account for the timing of a Pope's death, isn't the "indeterminacy" of the political situation actually determined by biological contingency? Where do you draw the line between political indeterminacy and mere bad luck?

  **6. Epistemic vs. Ontological Indeterminacy**
  When you speak of indeterminacy, are you describing an epistemic limit (we don't know what will happen) or an ontological one (the future is not yet fixed)? If it's epistemic, then *virtù* is just better intelligence gathering. If it's ontological, then *virtù* is literally creating reality. Which version does Machiavelli hold, and does your reading conflate the two?
  *   **Likely Answer:** She will likely argue it is ontological; action changes the affordances of the world, not just our knowledge of them.
  *   **Follow-up:** If action changes the affordances, does that make Machiavelli a constructivist before his time? How does that sit with his heavy reliance on historical examples which suggest patterns are fixed and repeatable?

  **7. The Role of *Necessità* (Necessity)**
  Your reading focuses heavily on the *fortuna/virtù* dyad, but Machiavelli frequently invokes *necessità*. If *virtù* is the capacity to shrink indeterminacy, is *necessità* the force that compels that shrinking? Does your framework risk marginalizing necessity as a driver of action, focusing too much on the agent's capacity rather than the constraints that force the agent to act?
  *   **Likely Answer:** She will argue that *necessità* is the catalyst that activates *virtù*, turning potential capacity into actual reduction of indeterminacy.
  *   **Follow-up:** But if *necessità* is the true driver, isn't *virtù* secondary? Doesn't Machiavelli suggest men only act well when compelled by necessity? If so, is *virtù* really a capacity to shrink indeterminacy, or just a reaction to the removal of options?

  **8. The Affective Cost of *Virtù***
  If *virtù* is the constant labor of shrinking indeterminacy, this implies a state of perpetual anxiety and vigilance for the prince. Does your reading account for the psychological toll of this definition? If *fortuna* is always waiting as un-shrunk indeterminacy, is the Machiavellian agent ever secure, or is your reading suggesting that security is an illusion Machiavelli is trying to dispel?
  *   **Likely Answer:** She will agree that security is an illusion and that Machiavelli's realism demands constant vigilance.
  *   **Follow-up:** If security is an illusion, does that make Machiavelli's advice ultimately tragic? If the river always swells again, is the political project futile, or is the struggle itself the only point?

  **9. Comparison to Humanist Tradition**
  Machiavelli is writing against a backdrop of Christian and Humanist Boethian views where *fortuna* is often providential or moral. By redefining *fortuna* as neutral indeterminacy, are you arguing that Machiavelli is secularizing the concept, or is he simply inverting the moral hierarchy? Does your reading depend on Machiavelli being a modernist before his time?
  *   **Likely Answer:** She will argue he is secularizing it, removing the moral judgment from fortune to focus on efficacy.
  *   **Follow-up:** If he removes moral judgment from fortune, does he also remove it from *virtù*? If *virtù* is just efficacy, does your reading confirm the "teacher of evil" critique, or does it suggest a new kind of non-moral political ethics?

  **10. The Implication for Modern Agency**
  If we accept your reading that *virtù* is the reduction of indeterminacy, what does that imply for modern democratic agency? Does it suggest that politics is fundamentally about technocratic control of risk? If *fortuna* is the enemy, does that leave any room for spontaneity, dissent, or the unpredictable benefits of open-ended political processes?
  *   **Likely Answer:** She will likely caution against applying Machiavelli directly to modernity but suggest that recognizing indeterminacy helps us understand political crisis.
  *   **Follow-up:** But if the goal is always to *shrink* indeterminacy, doesn't that privilege order over liberty? Can a Machiavellian politics, on your reading, ever value the open-endedness that *fortuna* represents, or is *fortuna* always something to be subdued?
