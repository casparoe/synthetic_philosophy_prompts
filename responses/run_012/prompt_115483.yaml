              3.  Is *fortuna* explanatory or just residual?
              4.  Function of gendered imagery if *fortuna* is just indeterminacy.
          *   Provide follow-up questions for each based on likely answers.
          *   **Crucial Addition:** Mark which interpretive claims are settled consensus vs. genuinely contested.

  2.  **Deconstruct the Scholar's Thesis & Identify Tensions:**
      *   *Claim:* *Fortuna* and *Virtù* are one phenomenon (two sides of a coin).
      *   *Tension 1 (Timing):* Machiavelli often says success depends on matching one's nature to the times (*variability of fortune*). If *virtù* is just shrinking indeterminacy, what happens when the indeterminacy is too high or the "match" is wrong despite high *virtù*?
      *   *Tension 2 (Textual Scope):* *The Prince* focuses on individual acquisition/maintenance. *Discourses* focuses on republican longevity/civic health. Does "shrinking indeterminacy" work for both? A tyrant shrinking indeterminacy looks different from a citizenry building institutions.
      *   *Tension 3 (Explanatory Power):* If *fortuna* is just "pre-action indeterminacy," does it disappear once action starts? Does it explain failure? If Borgia failed, was it lack of *virtù* (didn't shrink enough) or *fortuna* (indeterminacy remained)? If the latter, *fortuna* seems external again.
      *   *Tension 4 (Imagery):* Machiavelli's imagery is violent and gendered (beating the woman). If *fortuna* is neutral "indeterminacy," why the violence? Does the scholar sanitize the misogyny?
      *   *Tension 5 (Borgia):* The scholar claims this dissolves the Borgia objection. But Borgia did everything right (*virtù*) and still failed due to external events (father's death, illness). How is that "shrinking indeterminacy"?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1 (Required: Matching the Times):* Focus on Chapter 25 of *The Prince*. Machiavelli says the impetuous man succeeds in one time, the cautious in another. If *virtù* is controlling indeterminacy, why does the *type* of person matter more than the *amount* of control?
      *   *Q2 (Required: Prince vs. Discourses):* Is *virtù* in *The Prince* (acquisition) the same as in *Discourses* (founding laws)? Can "shrinking indeterminacy" apply to institutional stability over centuries?
