      *   *Q4 (Required: Gendered Imagery):* Why the violence? If *fortuna* is neutral indeterminacy, why beat her? Does this reading ignore the affective/emotional dimension of Machiavelli's politics?
      *   *Q5 (Borgia Specific):* The scholar says this solves the Borgia problem. But Borgia's failure was exogenous (father's death). How is an exogenous shock "indeterminacy" that could be shrunk by agency?
      *   *Q6 (Normative Implications):* If *virtù* is technical control, is Machiavelli a technocrat? Where does the moral/ethical dimension (or lack thereof) fit?
