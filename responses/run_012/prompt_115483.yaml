  5.  **Addressing the "Settled vs. Contested" Requirement:**
      *   *Settled:* Machiavelli uses *fortuna* and *virtù* as key terms. He uses gendered imagery. Borgia is a key example. Chapter 25 is the locus classicus.
      *   *Contested:* The relationship between the two terms (dualism vs. monism). The coherence between *Prince* and *Discourses* (Esoteric vs. Exoteric, or Developmental, or Consistent). The meaning of *virtù* (moral vs. technical vs. efficacy). The Borgia failure (explanation). The gendered aspect (metaphor vs. ideology).
