          *   *Concept:* Natural vs. Ethical Caring.
          *   *Text:* Hailsham engineers "natural caring" (friendship, art) to mask the "ethical caring" obligation (donating organs). The guardians care *for* them (Tronto's taking care of) but not *about* them (attentiveness to their humanity).
          *   *Term:* "Completed." Noddings says the relation is completed when received. The book says the donor is "completed" when dead. This is a horrific pun. It suggests the system completes the relation by ending the life.

      *   **Tronto:**
