prompt: |-
  My uncle Ray is in a nursing home with pretty advanced dementia and my family is coming apart over what to do about him, so I'm hoping you can help me think it through.

  Back when he was in his 60s and sharp as a tack, he watched his own father go the same way and it scared him badly. So he wrote up a document -- got it notarized, gave copies to his daughter and his brother -- saying that if he ever got to the point where he didn't know his own family and needed round-the-clock care, he didn't want any treatment that would just stretch things out. No feeding tube, no antibiotics for pneumonia, no hospital trips. He even wrote a line for exactly the situation we're in now: he said if the day ever came and he said he wanted to live, we should ignore him, because that wouldn't be him talking, it'd be the disease. He named his daughter as the one who gets to make the call.

  So now here we are. He's 79, he doesn't know his daughter, doesn't know where he is most of the time. But -- and this is the thing -- he's not miserable. He's actually pretty content. He sits by the window with his old records, he laughs at the cat that wanders in, he asks for ice cream every afternoon. If you ask him if he wants to keep living he says yes, he likes it here. Last week he got pneumonia and the question is whether we treat it.

  His daughter says we do what the document says. That was him -- the real him, the one who could actually think -- and the guy in the bed is a stranger wearing his face. His brother says you can't let a happy man die because of a piece of paper he signed when he had no idea what this would feel like from the inside, and that the only person with anything actually at stake is the one lying there saying he wants to live. The daughter comes back with: if you go by what he seems to want now, then nobody's wishes about their own future ever bind anybody, and the whole point of writing it down was to protect himself from exactly this.

  Theres one more thing making it worse. Maybe two years before he got bad, when he still mostly knew what was going on, he told his brother over a beer that he thought he'd been too cocky when he wrote that thing and wasn't so sure anymore. But he never changed the document, and by the time it would have mattered he couldn't have. The brother says that proves the document doesn't really reflect what he wanted. The daughter says a guy musing over a beer isn't a decision, and he left the paper alone.

  I have to vote on this at the family meeting and I genuinely dont know. What should we do -- and more than that, help me figure out what the right question even is here, because I think we're all arguing past each other.
