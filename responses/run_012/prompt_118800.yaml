answer: |-
  Neighbours Finch and Brewster disputed a boundary privet. Finch clipped to the line; Brewster, to be scrupulous, clipped an inch further back. Finch, to restore symmetry, clipped another inch. Each move was merely good neighbourliness; to stop was to waste the weekends already spent, whereas to continue was merely one more weekend. By winter, the hedge was dead. Brewster ceased first: he had lost ten weekends and possessed a bare stick. Finch persisted: he lost twelve weekends and possessed nothing at all. The prize was worth less than the first cut; both paid the full price for a nullity.

  The punchline highlights how the sunk cost of past weekends compels further effort, since stopping forfeits the investment while continuing costs only marginally more. It shows that both parties ultimately expend more than the boundary's value, rendering victory economically irrational. Consequently, the cost of losing is indistinguishable from quitting, while winning ensures a greater total loss.
