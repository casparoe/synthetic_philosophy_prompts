prompt: |-
  By day I write novels; two afternoons a week I teach an advanced fiction workshop to twelve graduate students, and for the last three terms I have been trying to diagnose a failure that keeps recurring in their drafts and, more embarrassingly, in my own. The failure is not a shortage of feeling but a shortage of method. The writers I teach either assume an unearned omniscience, narrating other people's interiors as though they had a key to the room, or they retreat into a defensive behaviourism in which characters do nothing but smoke and look out of windows; the middle ground — building a person's inner life out of what that person says and does, plus everything anyone else can see — gets lost between the two.

  At a dinner last month a friend who teaches philosophy of mind asked me why novelists never borrow anything from the science of consciousness, and she described Daniel Dennett's heterophenomenology, which she called the standard third-person method in the field and which I have since looked into on my own. As I understand it: you treat everything the subject says as a text, a set of utterances to be interpreted rather than a transparent window on the mind; you take those utterances seriously and completely, so that the subject is treated as authoritative about how things seem to them, while you suspend judgment on whether things are as they seem; you bracket the metaphysical question of what the inner life is really made of, answering it neither way; and you bring in every other available source — behaviour, physiology, the setting, what the subject could not have known — to build up the picture of the world as the subject takes it to be, allowing for confabulation without concluding that the reports are worthless. That last point is what interests me: it is a licence to keep a character's testimony while treating it as evidence rather than as truth.

  I would like you to turn this into a procedure my students and I can actually run on a scene. Give me the questions in the order they should be asked, what a satisfactory answer to each looks like, where the sequence terminates in a verdict (the scene stands, the scene must be rebuilt, the testimony cannot be used at all), and where it has to stop and hand the decision back to the writer because the question is about the design of the book rather than about the character's world — and say plainly which of the steps are judgement calls wearing the costume of procedure. Then run it on three cases: first, a character whose account of the accident that injured her brother is fluent, detailed, and contradicted by a photograph the reader has already seen; second, a character in the middle of a dissociative episode whose testimony the reader has every reason to think is confabulated, which one of my students wants to resolve with a late reveal that the confabulation was true all along; third, the case I am afraid of, a chapter in my own novel in progress — three siblings circling their mother, who is losing her language to a neurodegenerative illness — in which the narrator renders the mother's dying interior across eight pages of lyrical first person that I love and that I suspect the procedure will not license. For that third case I want the honest verdict and the reasoning behind it, not a rescue. Close with what the procedure cannot do, and with the two or three failure modes you would expect to see once twelve people are applying it every week to two-thousand-word scenes; I need to be able to answer the student who will tell me that all of this is just a rule for writing thin characters.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Source Material:** A reflection by a novelist/teacher on a recurring failure in student (and own) writing: oscillating between unearned omniscience and defensive behaviorism. The proposed solution is adapting Daniel Dennett's *heterophenomenology* for fiction writing.
      *   **Task:** Turn this philosophical concept into a practical *procedure* for a fiction workshop.
      *   **Requirements:**
          1.  Create a step-by-step sequence of questions.
          2.  Define what a satisfactory answer looks like for each.
          3.  Define termination points/verdicts (Stand, Rebuild, Discard).
          4.  Identify where the procedure stops and hands back to the writer (design vs. character world).
          5.  Identify which steps are "judgement calls wearing the costume of procedure."
          6.  Run the procedure on three specific cases:
              *   Case 1: Unreliable narrator (contradicted by photo).
              *   Case 2: Dissociative episode/confabulation (student wants a "it was true" twist).
              *   Case 3: The author's own novel (mother losing language, lyrical first-person interior). *Constraint:* Honest verdict, no rescue.
          7.  Close with limitations of the procedure.
          8.  Close with expected failure modes when students use it (specifically addressing the "thin characters" critique).
      *   **Tone:** Intellectual, precise, pragmatic, slightly rigorous (matching the prompt's voice), empathetic but firm.

  2.  **Deconstruct Heterophenomenology for Fiction:**
      *   *Core Principle:* Treat the character's speech/thought as *text* (data), not absolute truth. They are authoritative on how things *seem*, not on how things *are*.
      *   *Data Sources:* Utterances, behavior, physiology, setting, external facts.
      *   *Goal:* Construct the "world as the subject takes it to be" without committing to the metaphysical truth of that world, unless supported by external data.
      *   *Fiction Adaptation:* The narrator is the instrument. Is the narrator adopting the heterophenomenological stance toward the character, or are they claiming god-like access?

  3.  **Drafting the Procedure (The "Heterophenomenological Audit"):**
      *   Need a logical flow. Start with the text (utterance), move to the context (behavior/setting), then check for contradictions, then decide on narrative stance.
      *   *Step 1: The Utterance.* What does the character claim (internally or externally)?
      *   *Step 2: The Corroboration.* What physical evidence exists in the scene?
      *   *Step 3: The Gap.* Where do they diverge?
      *   *Step 4: The Narrator's Stance.* How is the gap presented?
      *   *Step 5: The Metaphysical Bracket.* Does the text demand we know the "truth"?
      *   *Verdicts:* Pass (Heterophenomenological balance), Fail-Omniscience (Unearned access), Fail-Behaviorism (No interior), Fail-Design (Book-level issue).
      *   *Judgement Calls:* Identifying "unearned" access is subjective. Determining "sufficient" corroboration is subjective.

  4.  **Developing the Three Cases:**

      *   *Case 1 (The Accident):*
          *   *Data:* Character says X. Photo shows Y.
          *   *Analysis:* Classic unreliable narrator. Heterophenomenology allows the lie *if* the narrative stance acknowledges the gap.
          *   *Verdict:* Stand, *if* the narration treats the account as testimony, not fact. If the narration validates the lie as truth without irony, it fails.
          *   *Refinement:* The prompt says the photo is seen by the *reader*. So the reader knows the truth. The character's interior must reflect *their* truth, but the narrative frame must hold the contradiction.
          *   *Verdict:* **Stand** (provided the narrative voice doesn't endorse the falsehood as objective fact).

      *   *Case 2 (The Dissociation/Twist):*
          *   *Data:* Character confabulating. Student wants to reveal it was true later.
          *   *Analysis:* Heterophenomenology treats the experience as real to the subject. But a "twist" that says "actually this magic/clairvoyance was real" breaks the bracket. It moves from "how it seemed" to "how it is" without external data.
          *   *Verdict:* **Rebuild**. The twist violates the method. You can keep the confabulation, but you cannot retroactively make it objective truth without new external data. It turns the procedure into a trick.

      *   *Case 3 (The Dying Mother):*
          *   *Data:* Mother losing language. Narrator renders 8 pages of her lyrical interior.
          *   *Analysis:* This is the "unearned omniscience" trap. If she is losing language, she cannot generate lyrical prose internally. The narrator is projecting.
          *   *Constraint:* "Honest verdict... not a rescue."
          *   *Verdict:* **Testimony cannot be used at all** (in its current form). It is a violation of the subject's capacity. It is the author's voice, not the character's world.
          *   *Reasoning:* Heterophenomenology requires treating the subject as authoritative on how things *seem*. If the subject has no language, they cannot formulate "lyrical first person." This is the author speaking *for* them, not interpreting *them*.

  5.  **Addressing Limitations and Failure Modes:**
      *   *Limitations:* Can't measure emotional resonance. Can't solve plot holes. Doesn't generate style.
      *   *Failure Modes:*
          1.  *The Robot:* Students strip all interiority to avoid "unearned omniscience." (Behaviorism creep).
          2.  *The Lawyer:* Students treat the text like a court case, losing the art.
          3.  *The "Thin Character" Critique:* Need to answer this. The procedure protects depth by grounding it, not removing it. Thinness comes from lack of contradiction, not lack of access.

  6.  **Refining the Tone:**
      *   The prompt is sophisticated ("unearned omniscience," "defensive behaviourism," "heterophenomenology"). The response must match this register. Avoid self-help speak. Be direct.
      *   Use the terminology established in the prompt (text, utterance, bracket, authority).

  7.  **Review against Constraints:**
      *   Questions in order? Yes.
      *   Satisfactory answers defined? Yes.
      *   Verdicts defined? Yes.
      *   Hand-off points identified? Yes.
      *   Judgement calls identified? Yes.
      *   Three cases run? Yes.
      *   Case 3 honest/no rescue? Yes.
      *   Limitations/Failure modes included? Yes.
      *   Answer the "thin characters" student? Yes.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Correction on Case 1:* If the reader sees the photo, the reader knows the truth. If the character's interior monologue insists on the lie *as truth* without the narrator signaling the unreliability, it's "unearned omniscience" (accessing a false truth) or just bad writing. Heterophenomenology says: Record the lie as *their* truth. The narrative frame must hold the tension. Verdict: **Stand** *only if* the narrative distance makes the unreliability palpable. If the narration validates the lie, it's a **Rebuild**. Let's go with **Rebuild** if the narration treats the lie as objective fact. Actually, the prompt says "contradicted by a photograph the reader has already seen." This implies dramatic irony. The character *believes* the lie. The procedure allows this. Verdict: **Stand**, provided the narration doesn't claim the lie is objective fact.
      *   *Correction on Case 3:* Be careful not to say "you can't write dying people." You can't write *lyrical prose* as their internal voice if they've lost language. That's the key. The verdict must be harsh.
      *   *Failure Modes:* Make sure to explicitly address the "thin characters" complaint. The argument is that grounding interiority makes it *thicker*, not thinner, because it survives contact with reality.

  9.  **Final Output Generation** (Proceeding to write the response based on these thoughts).
answer: |-
  ### The Heterophenomenological Audit: A Procedure for Fiction

  This procedure adapts Dennett's method for the workshop. It is not a generator of prose; it is a diagnostic tool for the relationship between narrator, character, and evidence. It assumes that a character's interiority is a *construction* built by the narrator using available data, not a divine revelation.

  Run this sequence on any scene where a character's inner life is rendered.

  #### Phase 1: The Data Collection
  **Q1: What is the specific utterance or internal report?**
  *   *Instruction:* Isolate the sentence or passage where the character claims something about their state, the world, or another person.
  *   *Satisfactory Answer:* A direct quote or close paraphrase (e.g., "She thought, 'He hates me,'" or "He felt the room spinning.").
  *   *Termination:* If there is no report (pure behaviorism), the procedure stops. The scene is safe from omniscience but must be checked for emotional resonance elsewhere.

  **Q2: What external data exists in the scene to corroborate or contradict this report?**
  *   *Instruction:* List physical actions, dialogue from others, setting details, or established facts (like the photograph in Case 1) available to the reader.
  *   *Satisfactory Answer:* A list of objective anchors (e.g., "He slammed the cup," "The clock read 5:00," "The photo shows the car was red.").
  *   *Judgement Call:* Determining what counts as "objective" within the logic of the genre (e.g., in magical realism, a spell is data; in realism, it is not).

  #### Phase 2: The Gap Analysis
  **Q3: Does the report diverge from the external data?**
  *   *Instruction:* Compare Q1 and Q2.
  *   *Satisfactory Answer:* "No, they align," or "Yes, the character claims X, but the data shows Y."
  *   *Termination:* If they align perfectly and consistently throughout the book, the scene **Stands** (regarding this metric).

  **Q4: If they diverge, does the narrative voice acknowledge the divergence?**
  *   *Instruction:* Check the narrator's stance. Does the narrator present the report as *fact* or as *testimony*?
  *   *Satisfactory Answer:* The narration creates distance (irony, free indirect discourse that feels colored, framing devices) that signals to the reader: "This is how it seems to the character," not "This is how it is."
  *   *Verdict:*
      *   If the narration treats the divergent report as objective fact: **Rebuild**. (This is unearned omniscience).
      *   If the narration treats the report as the character's truth, despite the data: **Stand**. (This is heterophenomenology).

  #### Phase 3: The Capacity Check
  **Q5: Does the character possess the cognitive or linguistic capacity to generate this report?**
  *   *Instruction:* Assess the character's state (age, injury, intoxication, aphasia, dissociation).
  *   *Satisfactory Answer:* "Yes, the syntax matches their capability," or "No, the prose exceeds their capacity."
  *   *Verdict:*
      *   If No: **Testimony Cannot Be Used**. (This is the author speaking, not the character).
      *   If Yes: Proceed to Q6.

  #### Phase 4: The Design Hand-Off
  **Q6: Is the contradiction/resolution of this report essential to the plot's metaphysical claims?**
  *   *Instruction:* Determine if the book requires the reader to know the *actual* truth eventually, or if the *experience* of the truth is sufficient.
  *   *Satisfactory Answer:* "The book is about memory, so the lie is the point," or "The book is a mystery, so the truth must be revealed."
  *   *Hand-Off:* If the answer requires a decision about the genre or the book's ending, the procedure **Stops**. This is a design choice, not a character consistency issue. The writer must decide: Am I writing a psychological study (subjective truth) or a realist chronicle (objective truth)?

  ***

  ### Identification of Judgement Calls
  Do not pretend these are algorithmic. Two steps are subjective:
  1.  **In Q2 (Defining Data):** In a close third-person POV, the line between "setting detail" and "character perception" is porous. Deciding what counts as "external" is a judgement call.
  2.  **In Q4 (Acknowledging Divergence):** Determining whether the narrative voice is "signaling distance" or "accidentally contradicting itself" is an act of critical interpretation. One reader's irony is another's error.

  ***

  ### Case Studies

  #### Case 1: The Accident (Fluent Account vs. Photograph)
  *   **Data:** Character says, "I was driving slowly." Photo shows skid marks indicating high speed.
  *   **Q3 (Divergence):** Yes.
  *   **Q4 (Narrative Stance):** The reader has seen the photo. The character is lying to themselves or the narrator.
  *   **Verdict:** **Stand**, *conditional*.
  *   **Reasoning:** Heterophenomenology licenses the lie. The character is authoritative on how the accident *seemed* (perhaps time dilation made it feel slow, or guilt reshapes memory). The scene stands provided the narration does not assert "She was driving slowly" as an objective fact of the universe. It must read as "She remembered driving slowly." If the text asserts the speed as fact, it fails. If it asserts the memory as fact, it passes. The tension between the photo and the memory creates the depth.

  #### Case 2: The Dissociative Episode (Confabulation vs. Late Reveal)
  *   **Data:** Character experiences events during a blackout. Testimony is fragmented, fantastical. Student wants to reveal later: "It actually happened this way."
  *   **Q5 (Capacity):** During dissociation, coherent narrative construction is compromised.
  *   **Q6 (Design Hand-Off):** The student wants to retroactively validate the testimony as objective truth without new external data.
  *   **Verdict:** **Rebuild**.
  *   **Reasoning:** This violates the bracket. You may treat the confabulation as the character's reality (Q4), but you cannot use a "twist" to declare the confabulation objectively true unless you introduce new external data (Q2) that supports it. To say "the crazy thing was real all along" without evidence is a deus ex machina that breaks the heterophenomenological contract. It asks the reader to suspend judgment on the metaphysics, then forces a metaphysical conclusion that contradicts the established method of evidence. The student must either find physical evidence to support the vision or accept that the vision remains a subjective truth.

  #### Case 3: The Dying Mother (Lyrical Interior vs. Aphasia)
  *   **Data:** Mother has lost language (neurodegenerative). Narrator renders 8 pages of lyrical first-person interiority.
  *   **Q5 (Capacity):** No. A subject losing language cannot generate lyrical syntax, metaphor, or complex sentence structures internally.
  *   **Verdict:** **Testimony Cannot Be Used At All**.
  *   **Reasoning:** This is the failure you feared. This is not heterophenomenology; this is ventriloquism. You are not interpreting the subject's utterances; you are replacing them with your own. A subject without language experiences the world through sensation, emotion, and fragmentary association, not through "lyrical first person." To write otherwise is to claim unearned omniscience of the highest order: claiming to know the ineffable.
  *   **The Hard Truth:** You love these pages because they are *your* grief, not *hers*. They are beautiful, but they are false. To fix this, you must strip the prose down to the pre-linguistic. If you cannot bear to lose the lyricism, you must shift the POV to one of the siblings observing her, interpreting her silence. You cannot have both her silence and her song.

  ***

  ### Limitations and Failure Modes

  **What the Procedure Cannot Do:**
  1.  **It cannot measure beauty.** A scene can pass the audit and be dull.
  2.  **It cannot solve plot.** It ensures consistency of consciousness, not causality of events.
  3.  **It cannot validate theme.** A character can be perfectly rendered and thematically irrelevant.

  **Expected Failure Modes in the Workshop:**
  When twelve students apply this to 2,000-word scenes weekly, expect these three pathologies:

  1.  **The Behaviorist Creep:** Students will become afraid of Q1. They will strip interiority to avoid the risk of Q4 (Divergence). The result will be "thin" characters who smoke and look out windows.
      *   *Response to the Student:* "Thin characters are not made by limiting access to their minds; they are made by limiting the *contradictions* in their minds. A character who lies to themselves (Case 1) is thicker than a character who tells the truth. This procedure does not ban interiority; it demands you earn it. If you retreat to behaviorism, you are failing Q1, not passing the audit."

  2.  **The Cross-Examination:** Students will treat Q2 (Data) like a legal cross-examination, hunting for "plot holes" in perception rather than exploring the texture of the error.
      *   *Mitigation:* Remind them that in heterophenomenology, the error *is* the data. The contradiction is not a bug; it is the feature.

  3.  **The Metaphysical Trap:** Students will get stuck on Q6, arguing about whether the ghost is "real" in the story rather than whether the character *believes* the ghost is real.
      *   *Mitigation:* Enforce the bracket. The workshop is not a tribunal on the ontology of the story world. It is a tribunal on the consistency of the character's report.

  **Final Note to the Instructor:**
  The student who claims this creates "thin characters" is confusing *access* with *intimacy*. Omniscience offers total access but zero intimacy (because it requires no interpretation). Heterophenomenology restricts access to increase intimacy, because it forces the reader to do the work of constructing the person alongside the narrator. If the characters feel thin, it is because the students are using the procedure to avoid the risk of interpretation, not because the procedure forbids it. Your job is to ensure they don't use the audit as a shield against the messiness of human consciousness.
