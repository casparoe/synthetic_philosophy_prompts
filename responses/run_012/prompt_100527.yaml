answer: |-
  Your intuitions are remarkably consistent with some of the most sophisticated debates in action theory and moral psychology. You have essentially rediscovered the tension between the **Knobe Effect** (Cases 1 & 2), the **Doctrine of Double Effect** (Case 3), and the **Role of Indifference** (Case 4).

  Your "Blame Theory" is a very strong contender—it's actually a leading hypothesis in experimental philosophy called the *Bias View*. It suggests we call things "intentional" primarily to justify blaming people. However, your own Case 4 (The Surgeon) is the Achilles' heel of that theory. In standard medical ethics, a surgeon who causes deafness as a known, unavoidable trade-off for saving a life is **not blameworthy**, yet you (and most people) still say she **intentionally** caused the deafness. If "intentional" just meant "blameworthy," you would have to say she didn't do it intentionally. The fact that you distinguish the mental state (intentional) from the moral judgment (not blameworthy) suggests "intentional" is doing real work describing her *attitude*, not just your *judgment*.

  The principle that best unifies your eight cases is what I call the **Attitudinal Acceptance Principle**. It posits that intentionality regarding side effects turns on whether the agent *accepts* the outcome as a cost (indifference) or *regrets* it as a tragedy (active opposition), modulated by a moral asymmetry (we are quicker to see acceptance in bad outcomes than good ones).

  Here is how it solves your specific puzzles:
  *   **3 vs. 4 (The Pilot vs. The Surgeon):** This is the crux. The Pilot *regrets* the civilian deaths ("hates that it'll kill them"). The Surgeon is *indifferent* ("doesn't care one way or the other"). Under the Acceptance Principle, indifference counts as accepting the outcome into your plan; regret counts as fighting it. Thus, Surgeon = Intentional, Pilot = Unintentional.
  *   **1 vs. 2 (The CEO):** This is the Knobe Effect. We interpret "indifference" to harm as *acceptance* (Intentional), but "indifference" to help as *lack of commitment* (Unintentional). The principle requires a "Normative Asymmetry" clause to handle this.
  *   **8 (The Mitigation):** This is where your consistency is tested. If the CEO spends money to *reduce* pollution, he is demonstrating **regret**, not indifference. To be consistent with your verdict on the Pilot (Case 3), you should classify this as **Not Intentional**. Your lean toward "Yes" is likely because he is a CEO (Case 1 context), but the *attitude* (mitigation) aligns with the Pilot. For a coherent system, you must choose: is it the *role* (CEO) or the *attitude* (Regret) that decides? The Attitudinal Principle says Attitude wins.

