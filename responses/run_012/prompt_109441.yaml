answer: |-
  The episode of the first heart transplants does not merely apply a definition of death; it fractures the concept and forces a reconstruction. To read this history through the criteria is to see that the criteria are not neutral measuring sticks, but tools shaped by the very technology they are meant to regulate.

  **The Donor Paradox**

  Let us begin with the donor on the table in the late 1960s. Under the circulatory criterion, which had held for centuries, this individual is alive. The heart beats; the blood warms the skin; the chest rises. If a surgeon cuts into this chest to remove the heart, the surgeon causes the death. The act of removal is the act of killing.

  Under the whole-brain criterion, the individual is a corpse. The brain is dead; the body is merely a collection of tissues kept in a state of suspended animation by a machine. If the surgeon removes the heart, they are harvesting from the dead. No killing occurs.

  The tension here is not merely semantic; it is moral and legal. The 'Dead Donor Rule' states that one must not kill a patient to obtain organs. The circulatory criterion, applied strictly to a ventilated donor, makes transplantation impossible without violating this rule. To satisfy the circulatory criterion, one must turn off the ventilator. But if the brain is already gone, turning off the ventilator is a performance. It is a ritual to make the body look dead in the old way, so that the heart can be taken in the new way.

  This exposes what the circulatory criterion is actually measuring once a machine is breathing for the patient. It is no longer measuring the body's own capacity to integrate oxygen and circulation. It is measuring the presence of a pulse, regardless of the source of the rhythm. If the rule is that a donor must be dead before organs are taken, the whole-brain criterion does not solve the problem; it relocates it. It moves the moment of death from the stopping of the pump to the silencing of the controller. But in doing so, it renders the beating heart a deception. The arrangement relies on the public accepting that a warm, pink, beating body is a corpse, provided the electricity in the head has gone.

  **The Ambiguity of 'Irreversible'**

  Your distinction regarding the word 'irreversible' is precise, and the charge that it masks a decision is fair. In the circulatory criterion, 'irreversible' rarely means 'physically impossible to restart'. A heart stopped for five minutes can often be restarted. It means 'we will not restart it'. The irreversibility is conferred by the decision to withhold resuscitation. Thus, the circulatory criterion reports a fact (the heart has stopped) but relies on a norm (we shall not start it) to declare death.

  The neurological criterion attempts to escape this by claiming a biological impossibility. A destroyed brainstem cannot be regenerated. However, even here, the declaration of death is contingent on excluding conditions that mimic death (hypothermia, drug overdose). We must decide that the condition is permanent before we call it irreversible.

  If this charge holds, then death is not a brute fact of nature like the boiling point of water. It is a status assigned to a body based on a judgment about the futility of intervention. What follows for the debate is significant: it means that death is not discovered; it is diagnosed. Diagnosis always involves a framework of values. If we value the continuation of biological function above all, the ventilated donor is alive. If we value the capacity for consciousness or spontaneous integration, they are dead. The criteria pretend to be ontological statements about what the patient *is*, but they function as ethical permissions regarding what we may *do*.

  **The Stability of the Neurological Criterion**

  You ask whether the whole-brain criterion is stable or if it quietly becomes something else. In practice, it fragments. The Harvard Committee spoke of the 'whole brain'. However, in the United Kingdom and many other jurisdictions, the standard became 'brainstem death'. The brainstem controls breathing and consciousness. The cortex, strictly speaking, is not required to be dead under this protocol, provided the stem is gone.

  Then there is the 'higher brain' view, which equates death with the loss of personhood (cortical function). This would classify a patient in a persistent vegetative state (PVS) as dead, as they have no consciousness, even if they breathe spontaneously.

  Are these variations of one view? The Whole Brain and Brainstem positions are functionally identical in the context of transplantation: both allow for a beating-heart donor. They differ on the biological justification (total brain necrosis vs. loss of integrative drive), but they arrive at the same practical outcome. The Higher Brain view, however, is a genuine third position. It shifts the definition from the organism's biological integration to the person's psychological existence.

  The episode of the early transplants implies why the Higher Brain view was rejected. Transplantation needed hearts that were beating. A PVS patient's heart is beating, but their brainstem is intact, meaning they breathe on their own. Removing the heart from a PVS patient would require stopping the breathing first, which looks more like killing than removing a heart from a ventilated brain-dead donor. The transplant imperative favoured the Brainstem/Whole Brain view because it maximised the supply of viable organs while maintaining the fiction that the body was already dead. The Higher Brain view was too radical; it would have declared people with beating hearts and warm skin 'dead' without the prop of a ventilator, which was a step too far for public acceptance. Thus, the criteria settled not on the most philosophically consistent definition, but on the one that best served the technological capability of the time.

  **The Suspicion of Timing**

  Does the coincidence of the criterion and the technology count against it? For the sceptical reading to be right, it must be shown that the definition changed *because* it was useful, not because our understanding of biology improved.

  Consider the counter-factual: If heart transplantation had never been invented, would we have declared ventilated patients dead? Likely not. We would have treated them as deeply comatose patients. The technology created a category of body that did not fit the old definition: a body that was biologically integrated by a machine but neurologically silent. The neurological criterion was the solution to this categorical error.

  This scepticism tells against the circulatory criterion as well. We do not declare a person dead the moment their heart stops if a defibrillator is at hand. We wait to see if it can be restarted. The 'moment' of death has always slid away from us as technology improves.

  Are these two theories of what death is, or two tests for one underlying event? If they were tests for one event, they should coincide. They do not. A brain-dead patient has a beating heart. A circulatory-dead patient may have viable brain tissue for minutes after the pulse stops. Therefore, they are not tests for a single biological instant. They are definitions of different thresholds. The underlying event they purport to track is 'the loss of the organism as a whole'. The circulatory criterion says the organism dies when circulation stops. The neurological criterion says the organism dies when the central integrator stops. The episode of transplantation suggests that 'the organism as a whole' is a flexible concept, stretched to accommodate the utility of organ retrieval.

  **Verdict**

  You ask for a verdict on the debate as the episode leaves it. The neurological criterion emerges not as a discovery of what death *is*, but as a convention adopted because it was useful. It is a pragmatic reconstruction of the concept.

  It does not settle whether death is an event or a process. Biologically, dying is a process; cells die at different rates. The criteria impose an event upon a process to satisfy legal and ethical needs. We require a sharp line to certify a death certificate, to stop treatment, and to harvest organs. The criteria provide that line, but it is a drawn line, not a natural fault.

  Nor is the question purely biological. If it were, biologists would have settled it. They have not, because biology describes gradients of function, while ethics requires binary states (alive or dead, kill or let die). What we are really fixing is the moment when the obligations of the living towards the body change. It is the moment it becomes permissible to grieve, to stop spending resources, and to cut.

  The criteria fall silent on the metaphysics. They cannot tell you if the soul has departed, or if the 'self' is gone. They only tell you when the body has ceased to function in a way that matters to the society observing it. In the late 1960s, what mattered was that the heart could be moved from one chest to another. The definition of death shifted to allow that movement. To call this cynical is too simple; to call it scientific is too generous. It is a negotiation between what is biologically possible and what is morally bearable. The neurological criterion is the terms of that treaty. It holds not because it is the absolute truth of human cessation, but because it is the only definition that allows the medicine of transplantation to exist without admitting that it sometimes requires killing the donor.
