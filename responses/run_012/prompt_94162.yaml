answer: |-
  **The Bureau of Evidential Affairs**
  **Counter 3**

  **CHARACTERS**

  **INSPECTOR CLIFFORD:** Rigid, holding a red pen like a dagger.
  **CLERK JAMES:** Relaxed, leaning back in his chair.
  **MR. HOPE:** An applicant, clutching a form.

  **SCENE:** *A small office piled with ledgers. MR. HOPE stands before the desk. INSPECTOR CLIFFORD is crossing out lines on a form. CLERK JAMES is watching a fly buzz around the light fixture.*

  CLIFFORD
  (Without looking up)
  Rejected.

  HOPE
  But sir, I haven't even filled out the section on "Grounds for Conviction."

  CLIFFORD
  Unnecessary. You wish to believe that your wife loves you. Do you have sufficient empirical data to support this?

  HOPE
  Well, she smiles at me. She cooks dinner.

  CLIFFORD
  Anecdotal. Subject to deception. Until you have a signed affidavit from her internal mental state, belief is prohibited. It is wrong, always, everywhere, and for anyone, to believe on insufficient evidence.

  JAMES
  (Without looking from the fly)
  Come now, Inspector. Look at the applicant. Is the option live?

  HOPE
  Very. I'd be devastated otherwise.

  JAMES
  Is it forced?

  HOPE
  I suppose. I can't *not* decide how to act toward her. If I don't believe she loves me, I act distant, and she leaves.

  JAMES
  And momentous?

  HOPE
  It's my marriage, sir.

  JAMES
  (To Clifford)
  It's a genuine option. The evidence is inconclusive, the stakes are high, and waiting for proof ruins the opportunity. His passional nature is permitted to settle the matter.

  CLIFFORD
  (Slams pen down)
  His passional nature is a bias machine! We must suspend judgment.

  JAMES
  Suspend judgment on the wife? Fine. But what about the judgment that you *ought* to suspend judgment?

  CLIFFORD
  That is a moral duty.

  JAMES
  Do you have sufficient evidence for that duty?

  CLIFFORD
  (Pauses)
  It is... self-evident.

  JAMES
  Self-evidence is a feeling, Inspector. A subjective sentiment. Where is the data entry for the Ethics of Belief itself?

  CLIFFORD
  (Opens a ledger, flips pages rapidly)
  I... there is no external verification for the principle.

  JAMES
  Then by your own rule, you are forbidden from believing it. You are holding a belief on insufficient evidence.

  CLIFFORD
  (Stammering)
  I am not believing! I am *knowing*!

  JAMES
  (Takes the red stamp from Clifford's hand)
  You're sweating, Inspector. That looks like a passional reaction to me.
  (He stamps Clifford's ledger)
  There. I've processed your application.

  CLIFFORD
  My what?

  JAMES
  I've licensed your maxim under the "Will to Believe" clause. Since you can't prove your rule is true, I'm classifying it as a Genuine Option for you. Live, Forced, and Momentous.

  CLIFFORD
  You cannot license the law!

  JAMES
  I just did. You're welcome to hold your belief, Inspector, but only because I've granted you a dispensation to leap.

  CLIFFORD
  (Staring at the stamp)
  I... I do not accept leaps.

  JAMES
  (Smiling)
  Then you're in violation. File an appeal.

  *[BLACKOUT]*

  ***

  **A Note on the Machinery**

  The humour relies on two specific philosophical pressure points. First, it targets the **self-referential paradox** in Clifford's evidentialism. Clifford claims it is *always* wrong to believe without evidence. But does Clifford have sufficient empirical evidence for *that* claim? If not, he violates his own rule by holding it; if he claims it is "self-evident," he is appealing to an intuition (a "feeling"), which undermines his strict empiricism.

  Second, it utilizes James's **criteria for a "Genuine Option."** James argues that when an option is *Live* (plausible to the believer), *Forced* (avoiding a decision is itself a decision), and *Momentous* (unique and significant), we have the right to let our "passional nature" decide. In the sketch, James turns Clifford's own rigid maxim against him: since Clifford cannot evidence his maxim, holding it becomes a "Genuine Option" that only James's pragmatism can legitimate. Clifford is saved from hypocrisy only by the very "Will to Believe" he sought to suppress.
