answer: |-
  Undefined expected value is not merely NaN; it is a non-associative reduction error in a system that forbids exceptions, forcing the agent to choose a value where the API returns NULL.

  In your vocabulary, the Pasadena game is a reduction operation `SUM()` over an infinite stream of `(probability, payoff)` tuples where the payoff alternates sign and grows magnitude. Because the series is conditionally convergent, the reduction is arbitrarily non-associative: like a parallel float sum where race conditions on the accumulator allow the result to converge to any arbitrary bit pattern depending on thread scheduling, reordering the outcomes changes the expected value from positive infinity to negative infinity or any real number in between. Consequently, the function `expected_value(game)` cannot return a stable scalar; it resolves to a sentinel like `NaN` or `SQL NULL`, indicating the aggregation logic is insufficient to determine a unique result. Decision theory then attempts to execute a comparison predicate `EV(game_A) > EV(game_B)`, but since both operands resolve to `NULL`, the predicate evaluates to `UNKNOWN` under three-valued logic, breaking the control flow that requires a boolean `TRUE` to select an action.

  ### Residue Report

  **1. Clean Maps**
  *   **Order Dependence $\rightarrow$ Non-Associative Reductions:** The mathematical indeterminacy maps cleanly to parallel floating-point reductions where `(a + b) + c` differs from `a + (b + c)`. In Pasadena, the "precision loss" is unbounded, but the structural failure of the reduction operator is identical.
  *   **Preference Failure $\rightarrow$ SQL NULL Comparisons:** The inability to rank games maps to three-valued logic where `NULL > NULL` is not `TRUE`. Just as SQL cannot sort a column of NULLs without an explicit `ORDER BY NULLS LAST` policy, Expected Utility Theory cannot sort games with undefined values without extra axioms.

  **2. Distorted Maps**
  *   **NaN Semantics $\rightarrow$ Input Validity:** IEEE 754 `NaN` implies an invalid operation (like `0/0`), suggesting the input data was corrupt. In Pasadena, the inputs are valid; the "error" lies in the aggregation axiom (linearity of expectation), making it more like a **schema mismatch** than a data error.
  *   **Contagion $\rightarrow$ Reasoning Halt:** Float `NaN` is contagious, poisoning all downstream math. Philosophers argue you can still reason about Pasadena games using dominance principles (e.g., "Game A pays more in every state") even if `EV` is `NULL`, meaning the `NULL` does not poison the entire decision context as strictly as IEEE propagation rules.

  **3. No Counterpart**
  *   **Mandatory Return Values:** In CS, if a function returns `NaN`, the program can catch the exception or propagate the error and halt; in decision theory, the agent cannot "halt"—existence forces a choice even when the utility function returns `NULL`. This highlights a gap between **descriptive types** (what the value *is*) and **normative constraints** (what the agent *must do*), something type systems handle with `Option<T>` but decision theory struggles to encode without altering the core axioms.
  *   **The "Ought" vs. The "Is":** Your vocabulary describes how values behave; the paradox prescribes how agents should behave. There is no CS counterpart for a system that crashes on `NaN` but is simultaneously penalized for crashing, requiring the agent to implement a custom exception handler for a condition the core API declares fatal.
