  Alright, I'm finally writing up the compromise paper and I need a number for the section where I claim value conflict is mostly a gains-from-trade situation rather than a zero-sum one, and my co-author keeps telling me I'm whistling past the hard cases. Here's the thesis I actually care about, stated so it can be false: take two agents with different but internally coherent value systems, each able to do things the other values or disvalues; the claim is that for a typical such pair there's a feasible swap — A does something B cares about, B does something A cares about — such that each ends up strictly better off by her own lights than under the status quo. If you think "typical" is smuggling in too much, tell me what fraction you'd actually put on it and why, and say what would count as a clean counterexample.

  Give me your credence in that, and decompose it rather than just asserting it. My guess at the terms, though rearrange them if you see it differently:

  - separability: whether a value system decomposes into independently evaluable chunks at all, so that trading marginal acts is even well defined — if someone's values are holistic, or have complementarities, I take it the trade can be undefined or a no-trade result kicks in, and I want to know how much of that is a real feature of value systems versus an artefact of the toy models;
  - motive-dependence: whether the goods on offer are the kind where doing X for the sake of a trade isn't really doing X, in which case there's nothing to hand over;
  - whether deontic constraints block the traded acts even when those acts are superogatory;
  - third parties — whether the swap wrongs someone outside it, or triggers a duty you can't discharge by trading;
  - self-undermining: whether everyone trading erodes the practice that made the values realisable in the first place.

  A number for each term, how they combine, then the bottom line. Then: I'm at about 0.7 and my co-author is at about 0.2, so tell me which of those terms you think we're actually disagreeing about, and which single term is doing the most work in your own number. And what would move it — and I dont mean another armchair case, I mean something you'd have to go look at, and roughly what you'd expect to find.

  One more thing, keep it short: is compromise, where we both shift toward the middle, just a special case of trade, or a genuinely different thing? Because if it's the latter my whole framing is in trouble and I'd rather find out now.

  600 words max.
