answer: |-
  Elena: Let's press the case again. The subject, let's call her S, goes to sleep. A device nudges her spectral sensitivity by a margin below the threshold of discrimination. She wakes up. Functionally, she is identical. She calls stop signs "red," she matches crimson swatches correctly, she reports no change in her visual field. This happens every night for a year. The cumulative shift is massive—physically, her transducers are now tuned to what would have been the opposite end of the spectrum had we swapped them all at once. My question is simple: Is there a fact of the matter about whether red looks the same to S now as it did a year ago?

  Marcus: Your question presupposes the coherence of the terms. You're asking if the *qualia* are the same. But if you grant the stipulations—that discrimination thresholds, memory reports, and verbal avowals are unchanged—you have exhausted the list of what it means for something to "look" a certain way. To ask if the look is the same *beyond* those facts is to ask if the ghost is wearing the same hat.

  Elena: That's exactly the move I expected. You're defining "looks" exclusively in terms of discriminatory behavior and reportive disposition. But I'm talking about the phenomenal character itself. The *what-it-is-like*. If I can conceive of the scenario where the behavior stays fixed but the intrinsic quality shifts, then the intrinsic quality is not identical to the behavior. The intelligibility of the case is proof of the distinction.

  Marcus: Intelligibility isn't proof of possibility, Elena. I can conceive of a square circle if I don't focus too hard on the definitions. You're relying on introspection as a direct gaze upon intrinsic properties. But introspection isn't a magic eye; it's a set of judgments. If S judges that red looks the same, and her memory confirms it, and her behavior aligns, on what grounds do you posit a difference? You're positing a difference that makes no difference.

  Elena: It makes a difference to the subject's ontology, even if not to her behavior. That's the point of qualia realism. They are intrinsic properties. Suppose tonight the device shifts her experience so that what she phenomenally experiences is what I experience when I look at green, but she still calls it "red" because her linguistic associations shifted with the transducer tuning. You're saying there's no fact of the matter about whether she's having my "green" experience while calling it "red"?

  Marcus: I'm saying the phrase "my green experience" loses its anchor if it's detached from the functional role it plays in her system. You want qualia to be intrinsic, private, ineffable, and incorrigible. Dennett showed long ago that nothing can satisfy all four. In your case, you've made them private and ineffable by stipulation. But if they are truly ineffable—if S cannot distinguish them, remember them differently, or report them—then you have removed the only criteria we have for identifying them. You aren't describing a hidden fact; you're describing a vacuum.

  Elena: You're changing the subject. I admit that if we talk only about functional roles, you win. But consciousness isn't just a functional role. It's the felt quality. If you deny that the felt quality can drift independently of function, you aren't analyzing consciousness; you're explaining it away. You're denying the datum. The datum is that there is something it is like to be S. If that "something" changes, reality changes, even if the third-person measurements don't catch it.

  Marcus: I'm not denying the experience. I'm denying your description of the experience as a container holding intrinsic properties. You say the "felt quality" can drift. But how do you know? You're imagining this from the outside. From S's perspective, nothing has changed. If nothing has changed from the first-person perspective either—because her memory and comparison mechanisms are nudged along with the transducers—then who is detecting the drift? You are. But you're not S. You're imposing a God's-eye view on a system that, by definition, cannot access the variable you claim is changing.

  Elena: The fact that S cannot access the change doesn't mean the change isn't real. It means introspection isn't infallible regarding the *history* of qualia, only their current presence. But consider the cumulative effect. After a year, the physical state of her visual cortex is significantly different. You're asking me to believe that the phenomenal character is locked to the functional role so tightly that despite massive physical divergence in the substrate, the "redness" remains metaphysically identical. That seems more magical than my claim.

  Marcus: It's not magic; it's constitutive. The phenomenal character *is* the functional role played by the state. If the role is preserved, the character is preserved. You're treating phenomenal character like a paint smeared on the brain. If the wiring does the same work, the light is on. If you insist there's a "ghostly paint" that could change while the wiring stays the same, you're inviting skepticism that swallows everything. If qualia can drift without trace, then for all I know, my qualia inverted five minutes ago.

  Elena: Exactly! That's the skeptical consequence, and I'm willing to live with it. It's a feature, not a bug. It shows that phenomenal facts are distinct from physical or functional facts. You find this skeptical possibility intolerable because you want a science of consciousness that closes the gap. I find it illuminating because it shows the gap is real. You're demanding that phenomenal facts be publicly verifiable to be real. I'm saying they are privately instantiated.

  Marcus: But "privately instantiated" is doing no work here. If the difference is undetectable in principle—not just practically, but *in principle*, because any detector would rely on the very transducers being nudged—then you've defined the property out of existence. You're asking me to accept a fact that has no truth conditions. What would make it true that her qualia shifted? Not her behavior. Not her brain state, because you could presumably replicate the brain state without the shift in a philosophical zombie. You're left with a brute fact that hangs in the void.

  Elena: The truth condition is the instantiation of the property itself. If I feel pain, it is true that I feel pain. The fact is self-intimating. In this case, if the device alters the intrinsic nature of the experience, the fact obtains. You're demanding external verification for internal states. That's a category mistake. You're treating the mind like a black box where only inputs and outputs matter. I'm telling you the light inside matters.

  Marcus: And I'm telling you that the "light inside" is a metaphor that breaks down when you try to measure it. When you say "the light matters," you mean it matters to S. But we've established that it doesn't matter to S, because her dispositions are unchanged. So who does it matter to? Only to you, the theorist. You're in love with the intuition of intrinsicness. But intuitions are theory-laden. Your intuition that there *must* be a fact of the matter is based on a Cartesian model of the mind that cognitive science has undermined.

  Elena: Cognitive science explains the mechanisms of reporting. It doesn't explain the reporting *itself*—the experience of the report. You keep saying I'm relying on a Cartesian model. I'm relying on the fact that I am conscious. If your theory requires me to deny that there could be a difference between how things look and how I behave, then your theory is requiring me to deny the very phenomenon it's supposed to explain. You're not solving the hard problem; you're dissolving the "hard" by deleting the "problem."

  Marcus: I'm dissolving the *pseudo*-problem. The hard problem arises because you think there's a remainder after you've explained the functions. I'm arguing there is no remainder. In your recalibration case, you're asking me to imagine a difference without a distinction. You want me to say, "Yes, the qualia changed," but when I ask "How?", you say "No way, actually." That's not a mystery; it's a contradiction. You want the status of a fact without the substance of a fact.

  Elena: It's not a contradiction; it's an ontological claim. Subatomic particles have properties we can't directly observe; we infer them from theory. I'm inferring qualia from the first-person datum. You're saying that because third-person science can't track the drift, the drift isn't real. That's scientism. You're privileging the third-person perspective as the only arbiter of reality.

  Marcus: No, I'm privileging coherence. If you claim X exists, you must be able to say what distinguishes X from not-X. In your case, "qualia shifted" is indistinguishable from "qualia stayed the same." If two states are identical in all causal powers, all relations, and all manifestations, they are the same state. To say otherwise is to posit epiphenomenal ghosts. And if they are epiphenomenal, why do you care? If they don't affect behavior, memory, or report, they don't affect *you*.

  Elena: They affect *what it is like to be me*. That's the whole point. You ask why I care. I care because I'm not a zombie. If my qualia drifted, my world would be different, even if my mouth said the same things. You're asking me to accept that I am nothing more than the sum of my dispositions. I'm telling you I'm the subject *of* those dispositions. The recalibration case shows that the subject can drift away from the disposition.

  Marcus: But the subject *is* the system of dispositions. There is no little homunculus inside watching the screen. When you say "my world would be different," you're smuggling in a viewer who notices the difference. But we stipulated S notices nothing. So the "world" that is different is a world no one inhabits. It's a metaphysical fiction. You're holding onto the idea of qualia as intrinsic properties because it feels right, not because it survives contact with the case. The case crushes it. If the shift is undetectable, the shift is not a property of the experience; it's a property of your philosophical anxiety.

  Elena: My philosophical anxiety is the only reason we're having this conversation, Marcus. Because I know what it's like to see red. And I know that what it's like is not the same as saying "red." If you force me to choose between my direct awareness and your functionalist coherence, I'll keep the awareness. You can keep the coherence. But don't tell me I've changed the subject. I'm talking about the experience. You're talking about the shadow it casts.

  Marcus: And I'm telling you the shadow is all there is. The "direct awareness" you trust is itself a functional state. If you push it hard enough, as this case does, it vanishes. You're left holding a word—"qualia"—that refers to nothing. You say the case shows qualia are real because it's intelligible. I say the case shows qualia are incoherent because it's unverifiable. We're at the bedrock. You see a brute fact; I see a grammatical illusion.

  Elena: Then we're done. You won't admit the possibility of the invisible difference.

  Marcus: And you won't admit that an invisible difference is no difference at all. You want a fact of the matter where there are no conditions for truth. I can't give you that.

  Elena: And I can't accept a theory of consciousness that leaves out the consciousness.

  Marcus: Then let the students decide which omission is costlier.
