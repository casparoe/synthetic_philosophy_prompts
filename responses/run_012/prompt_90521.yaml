  The grading scale provided states that an **A** means "no substantive error" and a **B** means "a real conceptual or attributional error survived an otherwise decent grasp."
  *   The script cannot be an **A** or **A-** because the error regarding the "unlimited" nature of household acquisition is substantive; it contradicts the core thesis of *Politics* Book I. The usury misattribution reinforces this textual looseness.
