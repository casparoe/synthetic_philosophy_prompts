      *   *Sentence 8:* "It also says the view is on firmest ground with hallucination, where the disjunctivist can simply deny that there's any experience at all..."
          *   **Assessment:** **Wrong/Misleading.** Disjunctivists do *not* deny the hallucinating subject has an experience. They deny it's the *same kind* of experience as perception. Denying *any* experience leads to absurdity (the subject feels like they are seeing something). M.G.F. Martin's "Negative Epistemic Definition" is relevant here.
