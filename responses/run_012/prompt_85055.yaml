      *   *Sentence 6:* "...which seems to fly in the face of the obvious fact that the two situations can be indistinguishable from the inside..."
          *   **Assessment:** This is the standard objection (the "screening off" or "introspective indistinguishability" problem). The textbook is reporting the objection, not necessarily endorsing it.
