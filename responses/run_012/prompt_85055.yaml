      *   *Sentence 4:* "Its move is to insist that the good case and the bad case are two different kinds of experience, so the argument from illusion never gets going: in the good case you're aware of the tomato, in the bad case you're not aware of any tomato at all."
          *   **Assessment:** This is the core thesis. "Different kinds of experience" is the key phrase.
          *   **Verdict:** Acceptable.

      *   *Sentence 5:* "The price is that the disjunctivist has to deny that the hallucinating subject and the perceiving subject are in the same mental state..."
          *   **Assessment:** **CRITICAL POINT.** This is the "Common Kind Assumption" rejection. Disjunctivists *do* deny they are the *same fundamental kind* of mental state. However, the phrasing "same mental state" is ambiguous. They deny the *highest common factor*.
