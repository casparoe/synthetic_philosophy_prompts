          *   **Assessment:** This is the "verbal rescue" jibe. It's a common criticism (e.g., from Crane or French). Disjunctivists argue it's a substantive metaphysical claim, not just linguistic. Whether it *holds up* is the philosophical debate. The user suspects it's unfair.
