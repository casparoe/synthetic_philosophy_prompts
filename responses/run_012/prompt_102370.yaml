      *   *Core Concept:* Public Reason is the reason of citizens *as* citizens, not as members of comprehensive doctrines (like religion). It applies to "constitutional essentials" and matters of "basic justice."
      *   *The "Exclusion" View vs. The "Inclusion" View:* Early readings often suggested strict exclusion (friend's view). Later clarifications (1997) softened this.
