      *   If I abandon Claim 4, the position becomes: "The money is not a reason for me because I cannot act on it." This is consistent with Claim 1 & 2.
      *   If I abandon Claim 1, I allow dual rationality (resolute choice). The user explicitly hates this (Claim 7).
