      *   The user's position tries to straddle both. Claim 5 talks about "admiration" (character), Claim 1 talks about "standards" (rationality).
      *   *Diagnosis Change:* If it's purely rationality, Claim 4 is fatal (reasons must guide). If it's character, Claim 4 is acceptable (I see the good but lack the virtue to grasp it). The user claims it's rationality (Claim 1, 7). So Claim 4 is the liability.

  7.  **Selecting the Commitment to Abandon:**
      *   Claim 4 is the "helping yourself" move. It allows the user to say "I'm rational (1, 2, 7)" but "I'm not blind to value (4)."
      *   Abandoning Claim 4 strengthens the hardline rationalist position.
      *   *Wait, is there a better candidate?*
