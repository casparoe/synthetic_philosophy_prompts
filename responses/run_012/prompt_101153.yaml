answer: |-
  Here is an analysis of your cases, a proposal for the governing principle, and a recommendation on which intuition to surrender.

  ### The Principle: Consistent Subjection

  The least cumbersome principle that captures the majority of your verdicts is the **Principle of Consistent Subjection**. It states:

  > **An agent has standing to blame another for a wrong $W$ only if the agent's own conduct does not manifest a rejection of the norm prohibiting $W$ as binding upon themselves.**

  This principle shifts the focus from *moral purity* (being sinless) to *moral authority* (acknowledging the rule). Standing is lost not because the blamer is bad, but because their conduct implies they do not regard the norm as authoritative.

  ### How the Principle Maps to Your Cases

  Here is how the principle, with necessary clarifications, handles your specific cases:

  1.  **Case 1 (Tax Evader vs. Evader):** **No Standing.** By actively evading tax, the blamer manifests a rejection of the norm's authority over himself. He claims an exemption for himself that he denies his brother.
  2.  **Case 2 (Reformed Evader):** **Standing Restored.** Repayment and reform manifest a *re-affirmation* of the norm's authority. The past rejection is repudiated.
  3.  **Case 3 (Unfaithful Wife vs. Embezzler):** **Standing.** Infidelity manifests rejection of marital norms, not financial norms. The domains are distinct; rejection does not transfer.
  4.  **Case 5 (Trifling Evader vs. Large Evader):** **Standing.** A trifling violation does not necessarily manifest a rejection of the *general authority* of the norm, whereas large-scale evasion does. This introduces a **Proportionality Clause**: *Minor violations do not count as rejection of the norm's authority regarding major violations.*
  5.  **Case 6 (Large Evader vs. Small Evader):** **No Standing.** The blamer's conduct manifests a wholesale rejection of the norm. He cannot invoke a rule he treats as optional for himself.
  6.  **Case 9 (Shareholder vs. CEO):** **Standing Diminished.** By voting with the board and taking dividends, the shareholder is complicit. This manifests a conditional acceptance of the norm ("Pollution is wrong, unless it profits me"), which undermines the authority of their blame.
  7.  **Case 10 (Malicious Blamer):** **Standing.** Motive is distinct from conduct. Caring nothing for the wrong is a vice, but using the norm to blame acknowledges the norm's validity. She does not reject the norm; she weaponizes it. This distinguishes **Hypocrisy** (Case 1) from **Cynicism** (Case 10).
  8.  **Case 11 (Needy Evader):** **Standing.** Inability to pay is an *excuse*, not a *rejection*. She acknowledges the debt but lacks capacity. Her conduct does not manifest a denial of the norm's authority.

  ### Predictions for Unlisted Cases

  Based on the Principle of Consistent Subjection, here are the predictions for the scenarios you requested:

  **1. A blamer guilty of a worse wrong in a different domain.**
  *   *Prediction:* **Standing Retained.**
  *   *Reasoning:* Per Case 3, rejection is domain-specific. A murderer has standing to blame a thief for stealing, provided the murder does not imply a rejection of property rights (e.g., if the murder was a crime of passion, not robbery). The norm against theft remains authoritative for the murderer.

  **2. A blamer denouncing a wrong they could not have committed themselves.**
  *   *Prediction:* **Standing Retained.**
  *   *Reasoning:* Per Case 8 (Stranger in supermarket), one cannot reject a norm's authority over oneself if one is incapable of violating it (e.g., a man blaming a woman for a specifically female form of betrayal, or a human blaming an AI). Inability to violate precludes the possibility of rejecting the norm's authority through action.

  ### The Verdict to Surrender: Case 7

  You asked me to choose between a complicated principle that saves every verdict and a simple one that overthrows one of them. I advise you to **surrender the verdict in Case 7.**

  **The Case:** A father who abandoned his own children blames his brother for neglecting his.
  **Your Verdict:** He has standing (on behalf of the children).
  **My Recommendation:** He **lacks standing**.

  **Why surrender this?**
  Case 7 is the only case that relies on **Proxy Authority** rather than **Personal Authority**. All other cases (1–6, 8–11) turn on the relationship between the *blamer* and the *norm*. Case 7 turns on the relationship between the *blamer* and the *victim*.

  If you keep Case 7, you must adopt a disjunctive principle: *"One has standing if one is consistent, OR if one is speaking for a victim."* This makes the theory messy and conflates two different moral powers:
  1.  **The Power to Rebuke:** This requires personal consistency (Case 1, 6).
  2.  **The Duty to Protect:** This requires intervention regardless of personal virtue (Case 7).

  The father in Case 7 has a *duty* to protect the children (call social services, intervene physically), but he lacks the *standing* to morally rebuke his brother. To blame someone for neglecting children while having abandoned your own is to claim a moral authority you have forfeited. The "you too" retort *does* land here, even if the children's needs are urgent. The urgency of the need justifies *action*, but it does not cleanse the *hypocrisy* of the lecture.

  By surrendering Case 7 (or reclassifying it as "justified intervention" rather than "standing to blame"), you preserve the **Principle of Consistent Subjection** as a clean, unified account of moral standing.

  ### Summary of the Principle

  **The Principle of Consistent Subjection:**
  One has standing to blame another for a wrong $W$ if and only if:
  1.  One's own conduct does not manifest a rejection of the norm prohibiting $W$ as binding on oneself; **and**
  2.  One's own violations are not disproportionately severe relative to the wrong blamed (Proportionality); **and**
  3.  One is not complicit in the structural benefits of the wrong (Complicity).

  *Note: Motive (Case 10) and Excuse (Case 11) do not affect standing, as they do not constitute a rejection of the norm's authority.*

  This principle saves 10 of your 11 verdicts. It requires you to see the father in Case 7 not as a legitimate blamer, but as a hypocrite who happens to be right about the facts. He may stop the neglect, but he cannot rightly *scold* for it.
