  Q6: My friend says this is just Evidential Decision Theory with extra steps—correlating your action with theirs without causation. Is he wrong, and if so, where does the causal leverage come from?
  Follow-up: If you say it's about logical causation rather than physical causation, why should I care about the payoff implications of a logical truth I can't manipulate?

  Q7: Suppose the math works perfectly. Why should I, as a rational agent, care about satisfying this specific equilibrium concept over standard Nash rationality?
  Follow-up: If you say because I get higher payoffs, isn't that only true if the other player also adopts your framework, and what if they're a standard Nash maximizer?

  Q8: You've described evolving the bots to handle exploiters. Does this constant need to patch vulnerabilities suggest the framework is stable, or that it's an endless arms race?
  Follow-up: If you say stability is achievable in the limit, isn't that just admitting the theory doesn't work for bounded agents like us?

