answer: |-
  # The Careenium Sorting Instrument

  **Instructions:** Read each case description carefully. Answer the question based on your intuition about the careenium *as described*. Do not worry about standard philosophical labels; answer what seems true to you about the balls and clumps. Follow the arrows to the next question or to a final position.

  ### The Questions

  **Q1. The Parasitic Symmball (Case 3)**
  Imagine a stable clump of symms recurs reliably, but it corresponds to *no* regularity in the world outside the table (it is "parasitic"). Is there a symmball there, or is it just a group of symms we are choosing to name?
  *   **A:** It is just a group of symms we are naming. (Go to Q2)
  *   **B:** There is a real symmball there. (Go to Q5)

  **Q2. Explanatory Interests**
  If we changed our interests (e.g., we stopped caring about the outside world and only cared about heat friction), would the "real" shovers switch from symmballs to symms?
  *   **A:** Yes, what counts as a cause depends on what we want to explain. (Go to **Leaf 1**)
  *   **B:** No, the causal structure is independent of our interests. (Go to Q3)

  **Q3. Truth of Talk**
  When we say "The symmball moved," is that statement strictly false, or is it a convenient way of speaking?
  *   **A:** Strictly false; only statements about symms are true. (Go to **Leaf 2**)
  *   **B:** A convenient way of speaking (shorthand). (Go to Q4)

  **Q4. Utility vs. Reality**
  Is symmball-talk useful *because* it tracks real patterns, or useful *despite* tracking nothing real (like a useful lie)?
  *   **A:** Useful despite tracking nothing real (a fiction). (Go to **Leaf 3**)
  *   **B:** Useful because it tracks real patterns. (Go to **Leaf 1** *[Note: This path collapses into Pragmatism if they deny interests matter, or suggests a hidden Realism. For this tree, we classify as Pragmatist with a caveat.]* )
  *(Correction for Tree Logic: If they say "Useful fiction" in Q4, they are Instrumentalists. If they say "Useful because real" but answered "Just symms" in Q1, they are inconsistent. Let's route Q4B to Leaf 1 to capture the "Interest-Relative" nuance where reality is interest-bound.)*
  *   **Revised Q4:** Is the usefulness of symmball-talk enough to make it "true enough" for us?
      *   **A:** No, it's a fiction. (Go to **Leaf 3**)
      *   **B:** Yes, truth is what works for our interests. (Go to **Leaf 1**)

  **Q5. The Two Careeniums (Case 4)**
  Imagine a second table with charged beads (different laws) that produces the exact same symmball dynamics. Is the moving clump the *same object* in both tables?
  *   **A:** No, they are different physical things that look similar. (Go to Q6)
  *   **B:** Yes, the symmball is the same thing realized differently. (Go to Q7)

  **Q6. Substrate Dependence**
  If the symmball is just the symms, does the specific material of the symms matter for what the symmball *is*?
  *   **A:** Yes, the material constitutes the identity. (Go to **Leaf 2** *[Re-routed Eliminativist/Reductive]* )
  *   **B:** No, only the pattern matters. (Go to Q7)

  **Q7. The External Magnet (Case 5)**
  We intervene with a magnet to force a symmball of a given type to form; the symms then follow. Did we cause the symmball, or did we just arrange the symms which *constituted* the symmball?
  *   **A:** We just arranged the symms. (Go to Q8)
  *   **B:** We caused the symmball (it is a valid target of intervention). (Go to Q9)

  **Q8. Micro-Laws Complete (Case 1)**
  Given the micro-laws are complete (symm-states fix the future), does the symmball level add any *new* pushing power to the story?
  *   **A:** No, the symms do all the shoving. (Go to **Leaf 4**)
  *   **B:** Yes, the level adds something / it's not the right way to ask. (Go to Q9)

  **Q9. The Scrambling Regime (Case 2)**
  In the scrambling regime (micro chaotic, macro stable), does the macro description contain causal information the micro description *loses*?
  *   **A:** No, the micro has all the info; the macro just hides the noise. (Go to **Leaf 5**)
  *   **B:** Yes, coarse-graining retains info the micro level throws away. (Go to Q10)

  **Q10. Causal Competition**
  If the symm-story says "A pushed B" and the symmball-story says "Clump X pushed Clump Y," are these stories fighting each other for the title of "The Cause"?
  *   **A:** No, they are the same events at different grains; no competition. (Go to **Leaf 5**)
  *   **B:** Yes, and the symmball-story wins (screens off the symms). (Go to **Leaf 6**)

  ---

  ### The Leaves (Positions)

  **Leaf 1: Interest-Relative Pragmatist**
  *   **Commitment:** The question of which level "shoves" is settled by our explanatory interests rather than by the careenium.
  *   **Hardest Commitment:** Maintaining that causal facts are not mind-independent without collapsing into subjectivism.

  **Leaf 2: Symms-Only Eliminativist**
  *   **Commitment:** The symmball level states no facts at all and only symms shove.
  *   **Hardest Commitment:** Explaining why symmball-prediction works so well if symmballs do not exist.

  **Leaf 3: Instrumentalist**
  *   **Commitment:** Symmball-talk is a useful shorthand but not true of anything.
  *   **Hardest Commitment:** Distinguishing a "useful shorthand" from a "true description" without a clear criterion of truth.

  **Leaf 4: Epiphenomenalist**
  *   **Commitment:** The symmball level is real but causally idle, with the symms doing all the shoving.
  *   **Hardest Commitment:** Explaining why we have symmball-concepts if they have no causal power to shape our brains.

  **Leaf 5: Non-Competitive Compatibilist**
  *   **Commitment:** Symmball-causes are genuine causes and there is no competition with symm-causes, only one set of events at different grains.
  *   **Hardest Commitment:** Explaining how two distinct causal claims can be fully true without overdetermining the effect.

  **Leaf 6: Macro-Causal Realist**
  *   **Commitment:** The macro level can be the stronger cause, because coarse-graining can retain causal information the micro level throws away.
  *   **Hardest Commitment:** Explaining how the macro can be "stronger" without violating the completeness of the micro-laws.

  ---

  ### Meta-Commentary for the TA

  **1. Where the Tree Cannot Separate Positions**
  *   **Instrumentalist (Leaf 3) vs. Pragmatist (Leaf 1):** The tree separates these based on Q2 (Interests) and Q4 (Truth). However, a sophisticated Instrumentalist might argue that "utility" *is* their version of "interest-relative truth." If a participant says "It's a fiction, but the best fiction for our interests," they may bounce between Leaf 1 and Leaf 3.
      *   *Further Question Needed:* "Is the utility of the fiction a feature of the world or a feature of our cognitive limitations?"
      *   *Answerability:* This is likely metaphysical rather than caseable; it depends on their theory of truth, not the careenium.
  *   **Compatibilist (Leaf 5) vs. Macro-Realist (Leaf 6):** Both accept macro-causation. The split relies on Q10 (Competition). Some Compatibilists (e.g., List) argue macro-causes are *better* because of proportionality, which sounds like "stronger." A participant might say "No competition, but macro is better," which fits both leaves.
      *   *Further Question Needed:* "Does the macro-cause *screen off* the micro-cause, or merely *supplement* it?"
      *   *Answerability:* Answerable in principle, but requires technical understanding of "screening off" which violates the "no jargon" constraint.

  **2. Unoccupied or Marked Combinations**
  *   **"Real Symmballs + Micro-Laws Incomplete":** The tree assumes Case 1 (Micro-laws complete) as a stipulation. If a participant rejects this stipulation (believing symmballs add physical energy), they fall off the tree.
      *   *Status:* **Unoccupied in this group.** This is "Strong Emergence." It is likely unoccupied because it violates standard physicalism, not because it is incoherent.
  *   **"Real Symmballs + Causally Idle + Interests Decide":** A "Pragmatic Epiphenomenalist." They might say symmballs are real but idle, yet we talk about them because of interests.
      *   *Status:* **Incoherent/Unattractive.** If they are causally idle, why do interests pick *them* out rather than symms? Usually, interests track causal efficacy.
  *   **Leaf 4 (Q4B path):** In Q4, if they answer "Useful because it tracks real patterns" but came from the "Just Symms" branch, I routed them to Leaf 1.
      *   *Status:* **Merely Unexplored.** This is a "Fictionalist Realist." It is a stable position but rare in this specific debate context.

  **3. Tree Vulnerabilities (Where I am Least Confident)**
  *   **Most Likely Wrong Placement:** **Leaf 5 (Compatibilist) vs. Leaf 6 (Macro-Realist).**
      *   *Reason:* The distinction rests on the intuition of "competition." Many graduate students are trained to say "levels don't compete" (Compatibilist) even if they believe the macro explains *better* (Macro-Realist). They may answer "No competition" to be safe, landing them in Leaf 5 when their substantive view is Leaf 6.
      *   *Single Consideration to Move Them:* If you asked, "If the symm-level explanation is fully detailed, is the symmball explanation *redundant*?" A Macro-Realist says "Yes, redundant/inferior." A Compatibilist says "No, distinct."
  *   **Potential Collapse:** **Leaf 2 (Eliminativist) and Leaf 3 (Instrumentalist).**
      *   *Reason:* In practice, Hard Eliminativists often concede that symmball-talk is "useful" (Leaf 3), and Instrumentalists often concede symmball-statements are "false" (Leaf 2). The distinction is semantic (truth-aptitude).
      *   *Collapse Condition:* If the group agrees that "truth" is just "long-term utility," these two leaves merge into a single Pragmatic/Anti-Realist position.

  **4. Usage Note**
  The tree forces a choice on Case 1 (Micro-laws complete). If a participant challenges the case itself (e.g., "Quantum mechanics might allow top-down influence"), the tree breaks. Instruct them to accept the case *hypothetically* for the sake of the sorting exercise.
