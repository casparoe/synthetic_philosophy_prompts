      *   *Check:* Did I explain what the constraint protects? *Yes (inviolability/status).*
      *   *Check:* Did I push back on myself? *I need to make sure I explicitly consider the "threshold is qualitative" argument and dismantle it.*
      *   *Refinement:* Make sure the distinction between "doing" and "allowing" is highlighted, as that's the deontologist's usual escape hatch. I need to show why that hatch fails at scale.

  6.  **Final Polish:**
      *   Strengthen the "Constraint Laundering" metaphor.
      *   Ensure the conclusion lands hard.
      *   (Mental Note): The user is a junior in high school. Don't talk down, but don't assume they know graduate-level meta-ethics. Keep it grounded in the "1 vs 1000" example.

