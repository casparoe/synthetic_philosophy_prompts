      *   *Eliminator:* The "Decision Theory Consistency (No Lexicographic/Unbounded)" requirement eliminates Maximin and Strong PP. The "Catastrophe Case" eliminates standard EU. The "Paralysis/Foreclosure" eliminates Strong PP.
