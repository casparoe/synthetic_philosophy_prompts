          4.  *Non-Circular Threshold:* (Defining "serious harm"). Motivation: Avoiding tautology. Status: Genuine Constraint.

      *   **Category 4: Results It Must Remain Consistent With**
          1.  *Decision Theory (Lexicographic/Unbounded):* (No infinite utility). Motivation: Mathematical coherence. Status: Genuine Constraint.
