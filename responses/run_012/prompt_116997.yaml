      *   **Category 2: Distinctions It Must Not Collapse**
          1.  *Risk vs. Ambiguity:* (Knightian uncertainty). Motivation: Different normative responses needed. Status: Genuine Constraint.
          2.  *Reversibility vs. Magnitude:* (Small permanent vs. Large temporary). Motivation: Different structural features. Status: Genuine Constraint.
          3.  *Presumption vs. Burden of Proof:* (Substantive vs. Procedural). Motivation: Institutional design. Status: Camp Commitment (Proceduralists vs. Substantivists). *Correction:* The prompt asks me to mark if it's a genuine constraint or a camp commitment. Keeping them distinct is usually seen as a requirement for clarity, but *how* one treats them might be camp-dependent. I will classify "Not Collapsing" as a Genuine Constraint on *clarity*, though the *weight* given is camp-dependent.
          4.  *Rational-Choice vs. Legitimacy:* (Prudence vs. Rights). Motivation: Moral vs. Rational grounds. Status: Genuine Constraint (Theory must specify its domain).
          5.  *Action vs. Omission:* (Doing vs. Allowing). Motivation: Moral asymmetry. Status: Camp Commitment (Consequentialists collapse this; Deontologists don't). *Refinement:* The prompt asks "if that distinction can be made to survive at all." I should note that a theory *must* take a stance, but collapsing it isn't necessarily a failure unless the theory claims to respect it. I will frame this as: The theory must explicitly account for the normative weight (or lack thereof) of this distinction.

