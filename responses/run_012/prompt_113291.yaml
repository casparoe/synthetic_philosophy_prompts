      *Self-Correction on Point 4:* The "missing shade of blue" is often cited as a problem for Hume. He admits it but says it's too singular to overthrow the general rule. I should use this to show he wouldn't grant AI a "free pass" on novelty.
      *Self-Correction on Point 6:* This is the strongest philosophical objection. If reason is a slave, AI (pure reason) cannot initiate a takeoff. It needs a master.

