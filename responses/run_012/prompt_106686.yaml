answer: |-
  Is societal collapse a structural/dynamical predicate—roughly, a system's loss of the capacity to reproduce its own structure—or is it ineliminably evaluative, relative to a valued baseline? In paleoclimatology, we treat regime shifts as physical facts; in archaeology, "collapse" is often treated as a moralizing narrative imposed on transformation. This project posits that the debate stalls because both sides answer different questions. The goal is to determine if collapse can be defined as a conjunctive predicate requiring both a structural regime shift and a normative loss of function, thereby rendering empirical cases decidable without smuggling in unstated value judgments.

  Standard framings leave this open because they conflate complexity with stability. The "collapse-as-myth" camp correctly notes that people survive regime shifts, but ignores that the *system* they value may not. The "threshold" camp correctly identifies non-linear dynamics but assumes the pre-shift state was inherently superior or functionally necessary. By separating the structural variable (e.g., energy capture, information flow) from the normative valuation (e.g., monument building, centralization), we can distinguish collapse (structure lost + value lost) from transformation (structure changed + value retained). This mirrors hysteresis loops in ice cores: the system may settle into a new stable state, but whether we call it "collapse" depends on whether the new state supports the functions we care about.

  Methodology is desk-based, leveraging existing datasets and literature.
  **Month 1: Conceptual Mapping.** Formalize the structural/normative distinction using philosophy of science literature on function and systems theory. Define candidate structural variables (e.g., socio-political complexity, energy flux) independent of cultural values.
  **Month 2: Case Selection.** Select three contested cases (e.g., Late Bronze Age, Classic Maya, Rapa Nui) where literature disagrees on collapse vs. transformation. Extract existing proxy data for structural variables.
  **Month 3: Application.** Apply the two-part predicate to each case. Does the structural shift coincide with the normative loss? Identify cases where they diverge (e.g., structural simplification but increased well-being).
  **Month 4: Synthesis.** Draft the framework and evaluate its utility. Does it resolve the disagreement in the selected cases, or does it merely shift the debate to variable selection?

  A successful result produces an operational definition that allows archaeologists to agree on whether a collapse occurred, even if they disagree on its moral weight. It must show that the structural component is measurable independent of the normative component. Failure looks like semantic relabeling: if defining the "structural variable" requires the same value judgments as defining "collapse," the framework adds no clarity. Another failure mode is inapplicability: if the structural variables cannot be proxies in the archaeological record, the model remains theoretical.

  **Feasibility Assessment:** A one-semester paper can carry the conceptual framework but risks superficiality in the case studies. The philosophical heavy lifting—defining "function" without teleology—is substantial. To succeed within four months, the scope must remain tight: do not attempt a full history of the Maya, but rather test the definition against existing consensus data. The risk is that the "structural" variable inevitably smuggles in norms (e.g., choosing "centralization" as a metric privileges hierarchy). Mitigating this requires explicit justification of variable selection. This is not fieldwork; it is conceptual engineering tested against historical data. It is achievable, but only if I resist the urge to solve the entire history of societal change and focus strictly on the decidability of the term. The knee injury is irrelevant; the risk is intellectual overreach.
