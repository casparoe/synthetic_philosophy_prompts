answer: |-
  Here is a complete, runnable 90-minute session design. It is built to bypass intellectual defenses and force a visceral confrontation with the axioms.

  # Activity Title: "The Oracle and the Coin"

  **Goal:** Elicit preference reversals that violate Subjective Expected Utility (SEU) without naming the paradox until the end. Force a confrontation with the *Reduction of Compound Lotteries* axiom.
  **Participants:** 15 Grad Students (Phil/Econ/ML).
  **Stakes:** "Lab Points." 100 Points = $10 value (coffee/beer fund). Max payout per person capped at $20 worth to keep variance manageable.
  **Materials:**
  *   15 "Decision Sheets" (numbered 1–15, with carbon copy or tear-off stub).
  *   15 Envelopes (to seal bids).
  *   2 Physical Urns (opaque boxes/bags work fine).
      *   **Urn K (Known):** Visibly contains 5 Red chips, 5 Black chips.
      *   **Urn U (Unknown):** Opaque. Contains 10 chips, composition undisclosed.
  *   1 Large Coin (for public flipping).
  *   Whiteboard/Projector.
  *   Timer (visible).

  ---

  ## Part 1: The Setup (0:00 – 0:05)
  **Do not lecture.** Do not mention Ellsberg, ambiguity, or axioms.
  **Script:** "Welcome. We're running a valuation task today. You will make choices involving Urns K and U. At the end, one of your decisions will be selected at random, played out for real, and you will be paid in points based on the outcome. Points convert to drinks/food at the end. Your goal is to maximize your expected points. Please fill out the Decision Sheets silently. No talking until the reveal."

  ---

  ## Part 2: Stage 1 — The Valuation Trap (0:05 – 0:20)
  **Objective:** Establish baseline ambiguity aversion privately.
  **Mechanism:** Certainty Equivalents (CE). Avoid binary choices (which allow hedging); force pricing.

  1.  **Display Urn K:** Open it. Show 5 Red, 5 Black. Close it.
  2.  **Display Urn U:** Show it is sealed. State: "Contains 10 chips. Red or Black. Composition determined before the session. I know it; you don't."
  3.  **Task A (Urn K):** "You hold a ticket for Urn K. If you draw **Red**, you win **100 Points**. If Black, 0. What is the minimum cash value (in points) you would accept to *sell* this ticket back to me right now? Write this number in Box A1."
  4.  **Task B (Urn U):** "You hold a ticket for Urn U. If you draw **Red**, you win **100 Points**. If Black, 0. What is the minimum cash value you would accept to sell this ticket? Write this number in Box A2."
  5.  **Constraint:** "Write privately. Seal the sheet in the envelope. Do not revise."

  *Facilitator Note:* Collect envelopes. Do not open them. This creates commitment.

  ---

  ## Part 3: Stage 2 — The Reduction Test (0:20 – 0:40)
  **Objective:** Test the *Reduction of Compound Lotteries* axiom. Address the ML "just put a prior on it" argument viscerally.
  **Mechanism:** Public second-order uncertainty.

  1.  **Introduce Urn C (The Coin Urn):** "We have a new option. Urn C is empty."
  2.  **The Procedure:** "I will now flip this coin publicly.
      *   **Heads:** I will put 10 Red chips in Urn C.
      *   **Tails:** I will put 10 Black chips in Urn C."
  3.  **The Bet:** "You hold a ticket for Urn C. If you draw **Red**, you win **100 Points**."
  4.  **The Ask:** "Before I flip the coin, write down the minimum selling price for this ticket in Box B1. Remember: If Heads, you win for sure. If Tails, you lose for sure. The coin is fair."
  5.  **Action:** Have them write. Collect envelopes.
  6.  **The Flip:** *Now* flip the coin publicly. (Say, it lands Heads). Fill Urn C with 10 Red chips.
  7.  **The Reality Check:** "For those who held the ticket, you now have a 100% winning ticket. But I asked you to value it *before* the flip."

  *Why this works:* Mathematically, Urn C (pre-flip) is identical to Urn K (50/50). Urn U (Unknown) is also treated as 50/50 by a Bayesian with a uniform prior. If they priced Urn K > Urn C, they violate Reduction. If they priced Urn K > Urn U, they violate SEU.

  ---

  ## Part 4: Stage 3 — The Reversal (0:40 – 0:55)
  **Objective:** Show ambiguity aversion is not a stable personality trait (Ambiguity Seeking).
  **Mechanism:** Loss Frame / "The Debt."

  1.  **Script:** "New scenario. You start this round in **debt**. You owe the house **100 Points**."
  2.  **Option 1 (Known):** "I offer you Urn K. Draw **Red**, your debt is forgiven (Net 0). Draw Black, you keep the debt (Net -100)."
  3.  **Option 2 (Unknown):** "I offer you Urn U. Draw **Red**, your debt is forgiven. Draw Black, you keep the debt."
  4.  **The Choice:** "You can only choose one urn to attempt to clear your debt. Which do you choose? Circle K or U on Sheet C."
  5.  **Commitment:** Write privately. Seal.

  *Theory:* In the domain of losses, people often become risk/ambiguity seeking. They hope the Unknown urn is 100% Red (miracle), whereas they know the Known urn is only 50%. This often flips the preference to Urn U.

  ---

  ## Part 5: Payout & Reveal (0:55 – 1:05)
  1.  **Random Selection:** Roll a die to select one Stage (1, 2, or 3) to count for real.
  2.  **Execution:**
      *   If Stage 1: Randomly pick a participant. Open their envelope. If their CE was lower than a random draw (0-100), they play the urn.
      *   If Stage 2: Use the coin flip result from earlier.
      *   If Stage 3: Pick a participant, play their chosen urn.
  3.  **Calculate Points:** Tally scores. Announce who gets the beer/coffee fund.
  4.  **The Reveal:** "Open your envelopes. Look at your numbers for Urn K vs Urn U vs Urn C."

  ---

  ## Part 6: The Debrief (1:05 – 1:30)
  **Do not summarize yet.** Ask them to look at their own data.

  **Move 1: The Data Check (5 mins)**
  *   "Show of hands: Who priced Urn K strictly higher than Urn U in Stage 1?" (Expect most hands).
  *   "Who priced Urn K strictly higher than Urn C (The Coin) in Stage 2?" (Expect some hands, maybe fewer).
  *   "Who chose Urn U in Stage 3 (The Debt)?" (Expect some hands).

  **Move 2: Mapping the Axioms (10 mins)**
  *   **Stage 1 (Sure Thing/Independence):** "If you priced K > U, you behaved as if P(Red|U) < 0.5. But if I asked you to bet on *Black* in Stage 1, would you have switched to U? Most people do. That violates the Sure Thing Principle. You can't think U has less Red *and* less Black than K."
  *   **Stage 2 (Reduction of Compound Lotteries):** "This is for my ML friend. Urn C was a two-stage process: Coin -> Chips -> Draw. Mathematically, that collapses to P(Red) = 0.5. Urn K was P(Red) = 0.5. If you priced them differently, you violated **Reduction of Compound Lotteries**. You priced the *process*, not the *probability*."
  *   **Stage 3 (Context Dependence):** "Who switched to preferring Urn U in the Loss frame? This proves ambiguity aversion isn't a personality trait. It's a framing effect. You aren't 'an ambiguity averse person.' You are a person who reacts to how the uncertainty is presented."

  **Move 3: Handling the Objections (10 mins)**
  *   **Objection A: "Just put a prior on it."**
      *   *Response:* "If you put a Uniform prior on Urn U, it becomes mathematically identical to Urn K. If you still value them differently, you are admitting your 'prior' isn't driving the choice—your *discomfort with the source* is. The Coin Urn (Stage 2) makes the prior explicit (50% chance of 100% Red). If you still flinched at the Coin Urn compared to the Known Urn, you are rejecting the math, not the lack of information."
  *   **Objection B: "The Coin Flip isn't real ambiguity."**
      *   *Response:* "Correct. It's risk. But Ellsberg ambiguity is often modeled *as* second-order uncertainty. If you claim you only dislike 'true' ambiguity (where no probability exists), then you should have loved Urn C. Did anyone value Urn C *higher* than Urn K? If not, then the 'second-order' model doesn't save the theory. You disliked the *structure* of the uncertainty, even when fully quantified."
  *   **Objection C: "It's rational to avoid ambiguity in one-shot deals."**
      *   *Response:* "It might be ecologically rational (don't bet with strangers). But it is not *internally* consistent according to SEU. You can't have it both ways: you can't claim to maximize expected utility and also pay a premium to avoid a specific *type* of probability calculation unless that type carries hidden information (which I promised it didn't)."

  ---

  ## Troubleshooting: What Will Go Wrong
  **1. The "What's *really* in Urn U?" Anchor**
  *   *Problem:* A student will refuse to accept "Unknown." They will demand to know the distribution.
  *   *Fix:* "The distribution is fixed, but epistemically inaccessible to you. Treat it as a variable $p$ where $p \in [0,1]$. Your job is to price the bet given that state." If they persist: "If you assume $p=0.5$, price it as Urn K. If you assume $p$ is dangerous, discount it. Just commit to a number."
  *   *Prevention:* Emphasize in the intro: "There is no hidden trick. The uncertainty is the feature."

  **2. Timing Overrun**
  *   *Problem:* Discussion bleeds into choice time.
  *   *Fix:* Be a tyrant about the "No Talking" rule during Stages 1-3. Tell them: "Debrief is where you get to argue. Right now, you are data points." Keep the Debrief strict. Cut the Payout calculation short if needed (just announce winners, don't count every chip).

  **3. Coordination/Hedging**
  *   *Problem:* Students realize if they bet Red on K and Black on U, they guarantee a win (if U is complementary).
  *   *Fix:* This is why we use **Certainty Equivalents (Selling Price)** in Stage 1, not binary choices. It forces them to value the asset in isolation. In Stage 3, they must choose *one* urn to clear debt, preventing hedging.

  **4. The ML Pushback Dominates**
  *   *Problem:* The ML students talk over the Phil students about "Subjective Priors."
  *   *Fix:* Use Stage 2 as the wedge. "A prior implies a specific probability distribution over the mix. The Coin Flip *gave* you that distribution explicitly (0.5 on 100% Red, 0.5 on 100% Black). There is no prior left to estimate. It is objective risk. If you still discounted it, your prior isn't the issue."

  ---

  ## Materials Checklist
  *   [ ] 15 Decision Sheets (3 sections: A1/A2, B1, C).
  *   [ ] 15 Envelopes.
  *   [ ] 2 Opaque Containers (labeled K and U).
  *   [ ] 20 Chips (10 Red, 10 Black).
  *   [ ] 1 Large Coin.
  *   [ ] Cash/Points conversion rate written on board.
  *   [ ] Timer.

  ## Facilitator Script Snippets (For the "Gut Feel")
  *   *Before Stage 1:* "Don't overthink the math. What feels safer in your gut? Price that feeling."
  *   *Before Stage 2:* "Watch the coin. This is the moment the uncertainty becomes risk."
  *   *During Debrief:* "Look at your own sheet. Did you treat the Coin Urn the same as the Known Urn? If not, you didn't just dislike ambiguity; you disliked *calculation*."

  This design forces them to commit to numbers before they can rationalize, isolates the Reduction axiom specifically for the ML crowd, and uses the Loss Frame to prevent the "I'm just a cautious person" defense.
