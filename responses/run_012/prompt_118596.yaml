  You must revise claim (6) to deny that the conceivability of zombies entails their metaphysical possibility.

  This is the critical fault line because your metaphysical commitment (1) asserts that physical facts necessitate phenomenal facts, which logically renders zombies impossible, while your methodological commitment (6) treats the intuition of their separability as evidence that they are possible. You cannot maintain that physicalism is true while simultaneously accepting evidence that it is false; one of these must yield, and since (1) is your foundational ontology, (6) must be restricted. The cost of this revision is admitting that conceivability is a unreliable guide to possibility in the specific domain of consciousness, which weakens your broader epistemic toolkit but saves your physicalism from immediate refutation.

  The remaining tensions, ranked by severity, are as follows:

  1.  **Conceptual Gap vs. Worldly Hard Problem:** There is a high-severity tension between your explanation of the knowledge argument (4) and your characterization of the hard problem (8). You argue that Mary gains only a new conceptual grip rather than knowledge of a new fact, which implies the explanatory gap is epistemic, yet you simultaneously assert the hard problem is a real problem about the world rather than merely about concepts. To resolve this, you must soften (8) to acknowledge that if physicalism is true and the gap is conceptual, the "hardness" of the problem stems from our cognitive architecture, not from ontological surplus. The cost is conceding that the hard problem does not point to a non-physical reality, which may feel like diminishing the phenomenon you aim to protect.

  2.  **A Priori Entailment vs. Mary's Ignorance:** There is a moderate tension between your strong epistemic physicalism (2) and the intuition that Mary learns something new (3). If physical truths a priori entail phenomenal truths, a perfect reasoner should deduce the experience from the physics alone; claiming she learns nothing factual (4) bridges this, but it strains the claim that she could "work out" the phenomenal fact without the concept required to grasp it. The cost here is maintaining a version of physicalism that requires explaining why perfect physical knowledge fails to yield phenomenal knowledge without admitting a metaphysical gap.

  3.  **Functional Gradient vs. Sharp Ontology:** There is a low-severity tension between your gradient view of consciousness (7) and the binary nature of standard physicalist supervenience (1). While functionalism accommodates gradients, asserting there is "nothing it is like" for a tokenizer but "something it is like" for a bat implies a vagueness that can be uncomfortable for strict physical descriptions, though this is generally manageable within a sorites-style framework.

  Once you revise (6), the package becomes stable as a form of Type-B Physicalism, provided you also align (8) with the conceptual nature of (4). The view will then consistently hold that while zombies are conceivable due to the unique nature of phenomenal concepts, they are metaphysically impossible, and the hard problem reflects the limits of our conceptual access rather than a failure of physical reality to determine experience.
