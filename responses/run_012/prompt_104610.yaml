  *(Self-Correction on Task 3)*: I need to be careful. Kant says "the civil constitution in every state be republican." He does *not* say every state must be a Democracy. In fact, he prefers Monarchy/Aristocracy *if* they are Republican. So the compatibility is: The demand applies to *forma regiminis*. Since Democracy (*imperii*) forces Despotism (*regiminis*), a state that wants to be Republican *must avoid* being a Democracy (*imperii*). So a "Democratic State" (in Kant's sense) *cannot* satisfy the demand. It must transform into a Representative system, which Kant classifies differently. I need to make sure I don't say "A Democratic state can be Republican." I must say "A state claiming popular sovereignty can be Republican only by ceasing to be a Democracy in Kant's technical sense."

