      *   *Refining the "Category Mistake" defense:* Emphasize that Kant is making a *modal* claim (necessity), not an *identity* claim. It's not "Democracy = Despotism," it's "The structure of Democracy *collapses into* Despotism."
      *   *Refining the Argument Reconstruction:* Ensure the "All vs. One" logic is clear. The "One" is part of the "All." If the "All" coerce the "One," the "All" are acting as a faction, not a universal will.
      *   *Refining the Compatibility:* Be clear that for Kant, "Republic" is a *forma regiminis*. So a state can be a Monarchy (*imperii*) but a Republic (*regiminis*). A Democracy (*imperii*) *cannot* be a Republic (*regiminis*). Therefore, to be Republican, a state must *not* be a Democracy (in Kant's sense). This sounds harsh, but it's his point. Popular sovereignty must be mediated.

