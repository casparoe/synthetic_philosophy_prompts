answer: |-
  # SEMINAR HANDOUT 1: THE STRUCTURE OF UNCERTAIN UPDATING

  **Starting Commitment:** Experiences sometimes shift an agent's credences in the cells of a partition without making any one of them 1 (e.g., looking at a fabric in poor light).

  **Diagnostic Cases:**
  (a) Fabric in poor light (0.7 confident it is green).
  (b) Two successive looks at a dial (shifting credences by different amounts).
  (c) An old fact whose bearing on a new hypothesis is only now recognized.
  (d) A witness whose reliability is uncertain.

  ***

  ### DECISION TREE

  **1. Is the description in case (a) coherent, or is 'uncertain evidence' a contradiction in terms?**
  *   **NO:** Experience must yield certainty; the puzzle is an artifact of vocabulary.
      *   **Position:** Framework Rejection
      *   *Awkward Commitment:* Commits the agent to denying the phenomenology of perceptual uncertainty.
  *   **YES:** Proceed to Q2.

  **2. In case (a), is there always a proposition the agent is certain of (e.g., about her sensory state) that entails the shift?**
  *   **YES:** The uncertain case reduces to conditionalization on that certain proposition.
      *   **Position:** The Reductionist View
      *   *Awkward Commitment:* Commits the agent to certainty about her own subjective states whenever she learns about the world.
  *   **NO:** Proceed to Q3.

  **3. In case (d), must the agent's credence in the witness's reliability be represented by a single sharp number?**
  *   **NO:** The posterior is a set of credence functions or something weaker than a probability.
      *   **Position:** Imprecise Probabilities
      *   *Awkward Commitment:* Commits the agent to representing her mind with mathematical objects that do not behave like standard probabilities.
  *   **YES:** Proceed to Q4.

  **4. In case (a), does the experience uniquely fix the new credences for the partition, or merely constrain them?**
  *   **CONSTRAIN:** The shift determines a family of admissible posteriors. Proceed to Q4a.
      *   **4a. Is the selection from this family made by an epistemic principle or a pragmatic decision?**
          *   **PRINCIPLE:** A further epistemic rule selects the unique posterior.
              *   **Position:** Principle-Guided Underdetermination
              *   *Awkward Commitment:* Commits the agent to an epistemic principle that lacks independent justification.
          *   **DECISION:** The agent's epistemic goals or values select the posterior.
              *   **Position:** Pragmatic Selection
              *   *Awkward Commitment:* Commits the agent to allowing non-evidential values to determine belief.
  *   **FIX:** Proceed to Q5.

  **5. In case (c), must the update leave conditional credences within the partition cells untouched?**
  *   **NO:** The rule does not require rigidity of conditional credences.
      *   **Position:** Unnamed
      *   *Status:* **Empty** (Unexplored: dropping rigidity while maintaining sharp probabilities lacks a coherent motivation).
  *   **YES:** The posterior is the weighted average of the conditionals. Proceed to Q6.

  **6. In case (b), must the rule be supplemented by an extra constraint to ensure the order of evidence does not matter?**
  *   **NO:** The rule is sufficient; order dependence is permissible.
      *   **Position:** The Rigidity Rule
      *   *Awkward Commitment:* Commits the agent to different beliefs depending on the order in which the same evidence arrives.
  *   **YES:** An extra constraint is required to enforce commutativity.
      *   **Position:** Order-Independence Constraint
      *   *Awkward Commitment:* Commits the agent to ignoring the temporal sequence of learning even when the psychological impact differs.

  ***
