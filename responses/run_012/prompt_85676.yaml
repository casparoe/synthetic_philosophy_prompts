          3.  XXX $\to$ O. (X-count $-3$).
          4.  OO $\to$ delete. (X-count unchanged).
      *   *Invariant:* Is the number of X's never divisible by 3?
          *   Start: 1 (not div by 3).
          *   Rule 1: $n \to n$. (Preserves mod 3).
          *   Rule 2: $n \to 2n$. If $n \not\equiv 0 \pmod 3$, then $2n \not\equiv 0 \pmod 3$. (Preserves non-divisibility).
          *   Rule 3: $n \to n-3$. (Preserves mod 3).
          *   Rule 4: $n \to n$. (Preserves mod 3).
      *   *Target:* `O` has 0 X's. $0 \equiv 0 \pmod 3$.
      *   *Conclusion:* The target is unreachable.
      *   *User's Logic:* "Invariant that does the work is that the number of X's is never a multiple of three."
