      *   Need to map:
          *   Team 1's failure $\to$ Underivability vs. Falsehood.
          *   Team 2's insight $\to$ Gödel sentence truth.
      *   Need the 3 Deflationary Steps:
          1.  Insight is formalizable (Team 1 got the rule in Round 2).
