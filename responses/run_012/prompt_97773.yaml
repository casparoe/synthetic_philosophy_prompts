          3.  Identify smuggled features (certainty, construction).
          4.  Evaluate the conclusion (does political obligation *actually* achieve geometric certainty?).
          5.  Address Hobbes's failed geometry claims (squaring the circle, etc.).
          6.  Offer a better analogy if applicable.
          7.  **Crucial Constraint:** Be straight. If the framing is confused or exaggerated by later interpreters, say so. Don't hedge into mush. Brainstorm candidate correspondences *out loud* before committing.
      *   **Tone:** Knowledgeable, direct, conversational but rigorous.

  2.  **Initial Knowledge Retrieval & Fact-Checking:**
      *   *Did Hobbes actually say this?* Yes, explicitly. In *De Cive* and *Leviathan*, he compares civil philosophy to geometry. He admired Galileo and Euclid. He believed he discovered the "elements" of politics.
      *   *What was geometry in the 17th century?* It wasn't just abstract math; it was the gold standard of *scientia* (demonstrative knowledge). It involved construction (drawing lines/circles) and deduction.
      *   *Hobbes's Geometry Failures:* He spent his later years trying to square the circle. John Wallis (Savilian Professor of Geometry at Oxford) demolished his attempts. This is highly relevant to his epistemological confidence.
      *   *The "Stipulation" Problem:* Hobbes thinks we define words to capture motions/conceptions. If definitions are arbitrary, the proof is trivial. If they track reality, they need justification. Hobbes tries to have it both ways (nominalism + materialism).
      *   *The Mapping:*
          *   Axioms/Principles: Human nature (passions, reason).
          *   Definitions: Words like "Right," "Law," "Person," "Commonwealth."
          *   Construction: The Covenant (artificial creation of the State).
          *   Proof: Deduction from state of nature to sovereign authority.
          *   Conclusion: The Sovereign's power is absolute/necessary.
          *   Reader: The rational individual checking the logic.

  3.  **Brainstorming Candidate Correspondences (Mental Draft):**
      *   *Idea 1:* State of Nature = Empty Space? No, that's too physical.
      *   *Idea 2:* Passions = Forces? Yes, Hobbes is mechanistic.
      *   *Idea 3:* The Covenant = Geometric Construction? This is strong. We *make* the state like we draw a circle.
      *   *Idea 4:* Definitions = Stipulations? Hobbes is a nominalist. Words are marks. But do they track truth?
      *   *Idea 5:* Certainty = Coercion? Geometry forces assent. Politics should too.

  4.  **Addressing the Specific Prompts:**

      *   *(1) The Mapping:* Need to be precise.
          *   Definitions: Concepts like "Right of Nature," "Law of Nature."
          *   Axioms: Facts about human psychology (fear of death, desire for power).
          *   Construction: The Covenant (the act of instituting the Sovereign).
