answer: |-
  Let's be straight from the start: The claim that Hobbes wanted to do politics "like Euclid" is not a later invention. He says it explicitly. In the dedication of *De Cive*, he writes that civil philosophy is "no older than my own book *De Cive*," and he compares his method directly to geometry. He believed he was the first to lay down the "elements" of politics just as Euclid had for space.

  However, your hunch is correct: the analogy is doing a lot of heavy lifting, and it cracks under pressure. Hobbes is using the *prestige* of geometry to silence opponents, not necessarily following its *procedure* to the letter.

  Per your request, I'm going to brainstorm the mapping out loud first, then give you the verdict on where it holds and where it's a bluff.

  ### 1. Brainstorming the Mapping

  If we take Hobbes at his word, here is how the pieces of Euclidean geometry are supposed to map onto his political philosophy. I'll float a few options for each, then we'll lock in the best fit.

  *   **The Definitions:**
      *   *Candidate A:* Words like "King," "Parliament," "Church." (Too historical, too messy).
      *   *Candidate B:* Concepts like "Right of Nature," "Law of Nature," "Person," "Commonwealth." (This is stronger. These are the technical terms he defines in *Leviathan* Chapters 13–17).
      *   *Selection:* **Candidate B.** Hobbes treats these like geometric terms (e.g., "line," "angle"). He insists we must agree on what these words mean before arguing.

  *   **The Axioms/Postulates:**
      *   *Candidate A:* Logical laws (A cannot be not-A). (Too abstract).
      *   *Candidate B:* Facts about human psychology (e.g., "Men desire power," "Men fear violent death," "Men are roughly equal in strength").
      *   *Selection:* **Candidate B.** In geometry, a postulate is a self-evident starting assumption (e.g., "a straight line can be drawn between any two points"). For Hobbes, the "postulates" are the universal facts of human passion. He thinks these are as undeniable as geometric postulates.

  *   **The Construction (The Drawing):**
      *   *Candidate A:* The historical founding of a specific country (e.g., England). (No, Hobbes doesn't care about history).
      *   *Candidate B:* The Covenant. The moment individuals artificially agree to authorize a Sovereign.
      *   *Selection:* **Candidate B.** In geometry, you construct a figure (draw a circle) to prove a theorem. In politics, you "construct" the Commonwealth via the social contract. It is an artificial creation.

  *   **The Proof:**
      *   *Candidate A:* A historical narrative.
      *   *Candidate B:* A causal deduction showing that *if* you want peace, *then* you must submit to the Sovereign.
      *   *Selection:* **Candidate B.** It's a conditional necessity. If $P$ (peace) is desired, and $S$ (State of Nature) yields war, then $C$ (Covenant) is necessary.

  *   **The Thing Proved (The Theorem):**
      *   *Candidate:* The absolute authority of the Sovereign is the only logical solution to the problem of order.
      *   *Selection:* That the Sovereign's power cannot be divided without returning to the State of Nature.

  *   **The Reader/Checker:**
      *   *Candidate:* Any rational person who checks the steps.
      *   *Selection:* You. Hobbes appeals to your own reason. He says, essentially, "Look inside yourself, verify these passions are true, follow the logic, and you must agree."

  ### 2. Where the Mapping Breaks (The Definition Problem)

  Here is the first major fracture. In Euclidean geometry, definitions are **stipulative**. When Euclid defines a "point" as "that which has no part," he isn't claiming this matches a physical dot in the sand. He is setting the rules of the game. Once you accept the definition, the consequences follow necessarily.

  Hobbes wants political definitions to work the same way, but he runs into a wall: **Politics is about the world, not just concepts.**

  If I define a "triangle" as "a three-sided plane figure," I haven't made a claim about reality that can be false. It's true by definition. But when Hobbes defines the "Right of Nature" as "the liberty each man hath to use his own power... for the preservation of his own life," he is making a claim about *human behavior*.

  *   **The Break:** If these definitions are just stipulations (like geometry), then Hobbes has only proved a tautology. He has built a logical machine that works only if you accept his vocabulary. But if you reject his definition of "Liberty" or "Justice," the proof collapses.
  *   **Hobbes's Defense:** He tries to have it both ways. He is a **nominalist**. He believes moral words *are* just names we impose. So, he argues, we *get* to set the definitions. If we define "Justice" as "Keeping Covenants," and the Covenant creates the Sovereign, then "Justice" *must* mean obeying the Sovereign.
  *   **The Verdict:** This is where the analogy wrecks. In geometry, no one fights over the definition of a circle. In politics, the fight *is* over the definitions. By treating political terms as geometric stipulations, Hobbes isn't proving the state is necessary; he is rigging the vocabulary so that dissent becomes "incoherent" rather than "wrong." He tries to turn political disagreement into a calculation error.

  ### 3. Smuggled Features: Certainty and Construction

  You asked what features of geometry are smuggled in. There are two big ones.

  **A. Certainty (Scientia vs. Opinion)**
  In the 17th century, "Science" (*Scientia*) meant demonstrative certainty, like geometry. History and rhetoric were just "opinion." Hobbes smuggles the **certainty of math** into **moral obligation**.
  *   *The Smuggle:* He wants you to feel that disobeying the Sovereign is not just dangerous, but *irrational* in the same way that believing $2+2=5$ is irrational.
  *   *The Reality:* Political obligation relies on the will, not just the intellect. I can understand the geometric proof of the State's necessity and still choose to rebel because I am angry, proud, or inspired by religion. Geometry doesn't have a "will" that disobeys the proof. Politics does.

  **B. The "Verum Factum" (We Know What We Make)**
  This is the strongest part of the analogy, often overlooked. In geometry, we know the properties of a circle with certainty *because we defined it and constructed it*. We didn't discover the circle in the wild; we made it.
  *   *The Smuggle:* Hobbes argues the Commonwealth is an "Artificial Man." Because humans *made* it (via the Covenant), humans can have scientific knowledge of it. We can't have perfect knowledge of God or Nature (because God made those), but we can have perfect knowledge of the State (because we made it).
  *   *The Reality:* This is brilliant, but it assumes the State is successfully "made." In reality, states evolve organically, historically, and messily. They aren't drawn on a slate. The "construction" is a thought experiment, not a historical event.

  ### 4. Does the Conclusion Survive?

  **No.** The conclusion (that political obligation is demonstrated with geometric certainty) does not survive the collapse of the analogy.

  The analogy carries the conclusion, not the other way around. Hobbes's argument works *only if* you accept that human passions are as predictable as geometric points and that language can be fixed as rigidly as mathematical symbols.
  *   If human nature is variable, the axioms fail.
  *   If language is contested, the definitions fail.
  *   If the will can override reason, the proof fails to compel action.

  Hobbes achieves a kind of *logical* consistency, but not *political* certainty. You can follow his geometry and still say, "I prefer the risk of war to the certainty of tyranny." That isn't a math error; it's a value judgment. Geometry cannot prove values.

  ### 5. The Geometry Debacle: Hobbes vs. Wallis

  You mentioned Hobbes's failed geometry. This is crucial context. In his 70s and 80s, Hobbes got into a famous, bitter feud with John Wallis, the Savilian Professor of Geometry at Oxford. Hobbes claimed to have solved the ancient problem of "squaring the circle." Wallis and the mathematical community unanimously proved he was wrong.

  **What this tells us:**
  1.  **Hubris:** Hobbes genuinely believed his reason was superior to the consensus of experts. He thought he saw the truth where others saw error. This mirrors his politics: he thinks he sees the necessary structure of the State, while Parliamentarians and Churchmen are just "drunk on authority."
  2.  **Methodological Blindness:** Hobbes rejected symbolic algebra (the new math of his day) because he thought geometry had to be about *magnitudes* and *bodies*. He was stuck in a classical view. This suggests his "geometric method" in politics was also somewhat archaic—a rigid deductivism that ignored the messy variables (like culture, religion, economics) that don't fit into neat lines.
  3.  **Credibility:** It undermines his claim to be the "Euclid of Politics." If he couldn't do the actual Euclid, why trust his political geometry? It suggests the "geometric method" was a rhetorical posture for him, a way to claim authority, rather than a rigorous practice he mastered.

  ### 6. A Better Analogy

  If "Politics as Geometry" is too rigid and ultimately deceptive, what was Hobbes actually doing?

  **Politics as Mechanics (or Civil Engineering).**

  Hobbes was deeply influenced by Galileo. He viewed the universe as matter in motion.
  *   **The Shift:** Instead of static geometric shapes, think of **forces and machines**.
  *   **The Passions:** These are internal motions (appetites and aversions) pushing the human body.
  *   **The State:** This is a machine (an engine) designed to channel those forces.
  *   **The Goal:** Not "truth" (as in geometry), but **stability**.

  In mechanics, you don't prove a bridge is "true." You calculate whether it will hold under load. Hobbes isn't proving the Sovereign is "morally right" in a geometric sense; he is arguing that the Sovereign is the only structural design that won't collapse under the load of human passion.

  This fits better because:
  1.  It allows for **failure**. Machines break. States collapse. Geometry doesn't break.
  2.  It accounts for **force**. Politics is about power (force), not just logic.
  3.  It explains his **materialism**. He treats thoughts and laws as physical motions.

  ### The Straight Verdict

  You asked me not to hedge. Here it is:

  The "Politics as Geometry" claim is **half aspiration, half rhetorical weapon.**

  *   **Aspiration:** Hobbes genuinely wanted moral philosophy to be a science. He hated the ambiguity of rhetoric and tradition. He wanted a system where dissent was impossible because the logic was airtight.
  *   **Weapon:** By invoking geometry, he tries to shame his opponents. If you disagree with Hobbes, you aren't just a political rival; you are *irrational*. You are like a man arguing that a triangle has four sides. It delegitimizes opposition before the debate starts.

  **Does it hold?** No. The analogy collapses because political definitions are contested, human beings are not static points, and the will is not bound by logical deduction. Hobbes's failure to actually master geometry (the squaring the circle scandal) reveals that he was in love with the *idea* of certainty more than the rigorous practice of it.

  **Should you keep the analogy?** Use it to understand his *ambition*, but not his *success*. He built a logical machine, but he tried to install it in a world of flesh and blood. The machine is beautiful; the installation failed. If you want to understand how he thought the machine worked, switch the metaphor from **Geometry** to **Mechanics**. It captures the motion, the force, and the fragility much better.
