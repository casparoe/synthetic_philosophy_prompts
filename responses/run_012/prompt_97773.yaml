          *   Thing Proved: The legitimacy/necessity of the Sovereign.
          *   Reader: You, the citizen, using reason.

      *   *(2) Where it Breaks (Definitions):* This is the crux. In geometry, a triangle is defined by us, but its properties follow necessarily. In politics, do "men" behave like defined points? Hobbes assumes psychological egoism is as fixed as a geometric postulate. But people can disagree about human nature. Also, definitions in politics are contested *politically*, not just logically.

      *   *(3) Smuggled Features:*
          *   *Certainty:* Geometry is timeless. Politics is historical and messy.
          *   *Construction:* We build the State (artificial man), so we know it. This is Hobbes's strongest point (Vico later picked this up: *verum factum*). We know what we make.
          *   *Neutrality:* Geometry doesn't care about your feelings. Hobbes wants politics to be indifferent to moral traditions.

      *   *(4) Does the Conclusion Survive?* No. Political obligation relies on compliance, not just logical assent. You can agree with the proof and still rebel (akrasia or passion overriding reason). Geometry doesn't have a "will" that disobeys.

      *   *(5) Hobbes's Geometry Failures:* It shows his hubris. He thought he saw the truth where experts saw error. This mirrors his politics: he thinks he sees the necessary structure of the state, while opponents (Parliamentarians, Church) see tyranny. It suggests his "geometric method" was more of a rhetorical posture than a rigorous mathematical practice.

