      *   *Claim 6 (Free Will/Determinism):* This is the biggest leap. Eternalism $\neq$ Determinism. The block could be probabilistic (quantum mechanics). Even if fixed, compatibilists argue free will is compatible with determinism. This is a category error (ontological vs. modal).

