answer: |-
  They say I wound the clock and walked away,
  A watchmaker who sets the wheels in motion
  And leaves them ticking till the spring unwinds.
  But look at Saturn, heavy in his ring,
  Or Jupiter, who pulls upon the rest.
  Without a Hand to steady up the frame,
  The comets would disturb the settled paths,
  The system sluggish, drifting toward decay.
  It needs correction. Not a once-for-all,
  But now, and now, and in this present breath.
  Mechanism left alone is but a corpse.
  And so it is with what they call the Church.
  They built a Trinity of words and smoke,
  A later imposition on the Truth,
  Athanasian shadows o'er the light.
  I write it down and lock it in the chest,
  For Athens poisoned what the Prophets knew.
  They want a God who sits apart from Christ,
  Or makes them one in ways the mind denies.
  I cannot speak it. Yet the text remains.
  The pure religion buried under creeds
  Needs pruning just as much as wandering orbs.
  Both drift toward error if the Lord withdraws.
  No void exists where He is not present.
  This space is not a vessel empty made,
  But where the Lord sustains the being of things.
  No pantheist stuff, nor spirit mixed with dust,
  But He in whom we move, Sensorium
  Where God perceives the world He holds alive.
  As space contains the body of the world,
  So God contains the space wherein it moves.
  No clockwork runs alone. No creed stands firm
  Without the Spirit breathing through the void.
  I sit alone. The universe is full.
  There is no empty place for Him to leave.

  ***

  **Historical Note**

  This poem leans heavily into the "unified Newton" thesis championed by modern scholars like Betty Jo Teeter Dobbs and James Force, though significant historiographical debate remains.

  *   **The Unity of Physics and Theology:** The traditional view (the "two Newtons" hypothesis) treated his science as rational and his theology as a separate, eccentric hobby. Current scholarship largely rejects this, arguing Newton saw both as investigating God's governance. However, historians still debate the *degree* of integration; some argue the theology was the primary drive, with physics secondary, while others maintain they were parallel but distinct outputs of the same mind.
  *   **Anti-Trinitarianism:** It is well-supported that Newton was an Arian (believing Christ was subordinate to the Father) and rejected the Trinity as a corruption. He wrote millions of words on church history and prophecy. However, the extent to which this was his *central* identity versus a private conviction is contested. The poem reflects the consensus that he kept these views secret ("lock it in the chest") to avoid losing his positions at Cambridge and the Mint, though some argue he was more actively involved in underground heterodox networks than the poem implies.
  *   **Space and the "Sensorium":** Newton's claim that space is God's "sensorium" (from the *General Scholium* and *De Gravitatione*) is famously difficult. The poem adopts the interpretation that space is an emanative effect of God's existence—God is not space, but space exists *in* God ("God contains the space"). Critics argue this risks making God extended (which Newton denied), while others see it as a metaphor for God's omnipresence and knowledge. The poem avoids generic pantheism by insisting God sustains the space rather than being identical to material stuff.
