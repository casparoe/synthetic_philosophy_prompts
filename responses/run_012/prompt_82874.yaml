answer: |-
  Philosophy makes progress, but it follows the trajectory of your "species" problem, not the "plate tectonics" one. In geology, plate tectonics was a settlement: the evidence became overwhelming, the holdouts died off, and the field moved forward on a new foundation. But the definition of a species was never settled; instead, the field got better instruments and better bookkeeping, turned the unanswerable metaphysical question into a pile of answerable operational ones, and quietly stopped caring about the original essence. Philosophy progresses the same way. It rarely achieves tectonic settlement where everyone agrees on The Answer. Instead, it achieves progress by dissolving the question. When a philosophical problem is "solved," it usually means we've realized the question was poorly formed, we've built the tools to break it into smaller empirical chunks, or we've realized the stakes weren't what we thought. The progress is in the pruning, not the harvesting.

  Apply your three-part test to this view, and the results clarify where the suspicion comes from. You guessed philosophy is strong on Toolkit (b) and weak on Settlement (c), and I agree, but I'd argue you're underestimating Elimination (a). The Toolkit is undeniably robust: formal logic, semantics, and decision theory give us machinery to check arguments that ancients didn't have. Settlement is rare because philosophy deals with the boundaries of concepts, not the contents of the world; you don't "settle" the concept of justice the way you settle the age of a rock. But Elimination is happening quietly. We don't seriously debate Cartesian dualism as a causal explanation anymore, and we don't argue for the divine right of kings. Bad arguments die and stay dead, even if the general topic remains. The recycling you suspect is often just new generations discovering the old cliffs for themselves, but the map of where you *can't* go gets more detailed every century.

  The obvious objection is that this is a science-shaped standard—that judging philosophy by elimination and tooling misses the point of a field that isn't in the business of prediction. But if you drop the prediction requirement, you still need a metric for progress, or else it's just literature. In a non-predictive field, progress looks like constraint mapping. Science tells you what is the case; philosophy tells you what can coherently be said about what is the case. Progress is knowing where the cliffs are. We know we've progressed when a certain type of confusion becomes impossible to sustain among people who know the work. It's not that we know more truths; it's that we make fewer category errors. If the job is to clear the undergrowth so science and law can walk through the forest, progress is measured by how much less tripping happens, not by how many new trees are planted.

  To keep this honest, look at the difference between Vitalism and Free Will. Vitalism—the idea that living things possess a non-physical "spark"—is a dead debate. It died because biology provided a mechanistic account that did the explanatory work better, absorbing the question into science. Free Will, however, is pure recycling. We argue Compatibilism vs. Incompatibilism under new vocabularies every generation. The distinction is that Vitalism was an empirical claim wearing philosophical clothes; once the empirical side was resolved, the philosophy collapsed. Free Will is a normative and conceptual conflict; no amount of neural data resolves the tension between "I could have done otherwise" and "causes determine effects." One died because the ground shifted beneath it (like plate tectonics); the other recycles because it is a structural feature of how we think about agency (like the species definition).

  So, is philosophy useless? Only if you think the only useful work is laying brick. Sometimes the useful work is checking the foundation to see if it can hold the weight. Philosophy progresses by making certain questions impossible to ask badly, even if it never answers them finally. It turns the unanswerable into the operational, eliminates the incoherent, and sharpens the tools we use to think about everything else. It doesn't give you the rock sample, but it tells you why you can't dig in that spot, and gives you a better drill for the spot next to it. That isn't tectonic settlement, but after thirty-five years in the field, you know that knowing where not to drill is half the job.
