      *   *Credibility Weighting* = The mechanism to balance individual experience vs. class experience.
      *   *Law of Large Numbers (LLN)* = The justification for using class rates (stability in the pool).
      *   *Experience Rating* = Using the individual's own history.
      *   *Problem:* The individual belongs to indefinitely many potential classes (e.g., by age, by zip code, by credit score, by car model, by combinations thereof). Each class yields a different expected loss cost. Nothing in the risk file dictates the *ultimate* partition.

