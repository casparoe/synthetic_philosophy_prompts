answer: |-
  This is a classic friction point in probability theory, especially when reading Keynes's *A Treatise on Probability* (1921). The sentence "You can't put a probability on a unique event" is a philosophical shibboleth that smuggles in a specific definition of probability without stating it.

  In your reading group, the person using this line is likely conflating **ontology** (the event happens once) with **epistemology** (what we know about the event).

  Here is a menu of five distinct precise claims hidden inside that one-liner. Each has different truth conditions and different implications for Expected Value (EV) reasoning.

  ### 1. The Strict Frequentist Claim
  *   **The Claim:** Probability is *defined* as the limiting relative frequency of an outcome in an infinite sequence of identical trials.
  *   **Kind of Probability:** Objective Frequency (von Mises style).
  *   **Defined For:** Collectives (reference classes), not singular propositions.
  *   **Whose Evidence:** Irrelevant; probability is a property of the physical system, not the observer.
  *   **Grounds:** Metaphysical/Definitional. If there is no sequence, there is no frequency. If there is no frequency, there is no probability.
  *   **Verdict:** **Trivially True (by stipulation), but Question-Begging.** It is true only if you accept frequentism as the *only* valid interpretation of probability. It excludes Bayesian and Logical interpretations by fiat.
  *   **Does it kill EV?** **Yes.** If probability is undefined, $P \times V$ cannot be calculated. EV reasoning becomes a category error because one of the variables is metaphysically nonexistent.
  *   **Keynes's View:** **Rejects.** Keynes explicitly argues against the frequentist view in Chapters 3 and 6 of the *Treatise*. He views probability as a logical relation, not a physical frequency.

  ### 2. The "Arbitrary Reference Class" Claim
  *   **The Claim:** To assign a probability, you must group the unique event into a class of similar past events. For truly unique events (e.g., "First ever lockdown"), any reference class chosen is arbitrary, making the resulting probability arbitrary.
  *   **Kind of Probability:** Empirical/Inductive Probability.
  *   **Defined For:** The event relative to a chosen description/class.
  *   **Whose Evidence:** Historical data of the chosen class.
  *   **Grounds:** Epistemic Justification. Without a non-arbitrary rule for selecting the reference class, the number has no warrant.
  *   **Verdict:** **Substantive and Defensible.** This is the "Reference Class Problem." While we *can* assign a number, the justification for *which* number is weak.
  *   **Does it kill EV?** **No, but it destabilizes it.** It suggests the EV calculation is highly sensitive to framing. It doesn't make EV a category error, but it makes the output unreliable.
  *   **Keynes's View:** **Sympathetic.** Keynes discusses the difficulty of finding comparable instances in Part III. He acknowledges that as uniqueness increases, the "weight of evidence" decreases, even if a probability relation exists.

  ### 3. The "Non-Numerical" Claim (The Keynesian Reading)
  *   **The Claim:** Unique events often possess a probability relation to the evidence, but that relation is **not numerically measurable**. You can say one outcome is more probable than another, but you cannot assign a ratio or percentage.
  *   **Kind of Probability:** Logical Probability (Degree of Rational Belief).
  *   **Defined For:** The logical relation between proposition ($p$) and evidence ($h$).
  *   **Whose Evidence:** The total evidence available to the rational agent.
  *   **Grounds:** Mathematical/Logical. Numerical probability requires a structure of equipossibility or frequency that unique events lack.
  *   **Verdict:** **Substantive and Defensible (Keynes's Core Thesis).** This is the most sophisticated reading. It admits probability exists but denies it is always a number.
  *   **Does it kill EV?** **Yes, for strict calculation.** Expected Value requires cardinal numbers (multiplication). If probabilities are ordinal (rankable but not measurable), strict EV is impossible. You can only rank options, not calculate the "value" of the decision.
  *   **Keynes's View:** **Accepts.** This is the heart of the *Treatise* (especially Chapters 3, 4, and 15). Keynes argues that many probabilities are "non-comparable" or "non-numerical."

  ### 4. The "Decision-Theoretic Irrelevance" Claim
  *   **The Claim:** Even if you *can* assign a subjective probability to a unique event, EV reasoning is designed for long-run maximization (Law of Large Numbers). In a one-off decision, the "expected" value will never be realized; you get either the win or the loss.
  *   **Kind of Probability:** Subjective/Bayesian (degrees of belief).
  *   **Defined For:** The agent's state of mind regarding the outcome.
  *   **Whose Evidence:** The agent's total information state.
  *   **Grounds:** Pragmatic/Utility. The "expectation" is a statistical artifact that does not map to the singular reality of the outcome.
  *   **Verdict:** **False (Mathematically), Substantive (Psychologically).** Mathematically, EV is the correct criterion for rational choice even in one-offs (given risk neutrality). Pragmatically, humans care about "ruin" in one-offs, which EV ignores.
  *   **Does it kill EV?** **No.** It argues EV is the wrong *goal* (e.g., you should maximize median outcome or avoid ruin), not that the probability is meaningless.
  *   **Keynes's View:** **Mixed.** In the *Treatise*, he focuses on logic. In *The General Theory* (Ch. 12), he leans this way, arguing that for long-term investment (unique events), "animal spirits" matter more than mathematical expectation because the basis for calculation is too precarious.

  ### 5. The "Radical Uncertainty" Claim
  *   **The Claim:** For some unique events, there is **no logical probability relation at all** between the available evidence and the outcome. The evidence is so scant that $P(h)$ is not just non-numerical, it is undefined.
  *   **Kind of Probability:** Logical Probability.
  *   **Defined For:** The relation between $h$ (evidence) and $p$ (proposition).
  *   **Whose Evidence:** What is currently known.
  *   **Grounds:** Epistemic Void. There is simply no bridge to cross.
  *   **Verdict:** **Substantive.** Distinguishes "Risk" (measurable uncertainty) from "Uncertainty" (unmeasurable).
  *   **Does it kill EV?** **Yes.** If the probability relation does not exist, you cannot reason probabilistically. You are acting in the dark.
  *   **Keynes's View:** **Accepts (with nuance).** Keynes allows that for some propositions, given certain evidence, no probability relation holds. However, he thinks this is rarer than people claim; usually, a non-numerical comparison exists rather than nothing at all.

  ---

  ### Where Keynes Lands
  If your group is reading the *Treatise*, your friend is using a **Frequentist (Claim 1)** argument to reach a **Keynesian (Claim 3 or 5)** conclusion. This is a category error in the argumentation itself.

  *   **Keynes rejects Claim 1:** He does not think probability requires a long-run frequency.
  *   **Keynes supports Claim 3:** He argues that for unique events, probabilities are often **non-numerical**.
  *   **Keynes supports Claim 5:** He acknowledges that sometimes the "weight of evidence" is so low that rational belief cannot be formed.

  **The Verdict on your Friend's Argument:**
  Your friend is right that strict Expected Value *calculation* often fails for unique political/social decisions, but wrong about *why*.
  *   **Wrong Reason:** "There is no frequency, so probability is meaningless." (Frequentist dogma).
  *   **Right Reason (Keynesian):** "The evidence does not support a *numerical* valuation, so while we can rank options, we cannot calculate an expectation."

  ### How to Unstick the Discussion
  Suggest this distinction to the group:
  > "Are we saying we can't assign a **number** (Keynes's view), or that we can't assign **any degree of rational belief** (Frequentist view)?"

  If they admit we can have a rational degree of belief (e.g., "It is more likely than not that the lockdown helps"), then probability exists. If probability exists, EV reasoning isn't a *category error*, it's just **imprecise**. The move is from "EV is nonsense" to "EV is a heuristic that hides massive error bars."

  **Recommendation:** Direct them to **Chapter 3 (The Measurement of Probabilities)** and **Chapter 6 (The Meaning of Probability)** in the *Treatise*. Specifically, look for Keynes's distinction between the *probability* of an argument and the *weight* of an argument. Unique events often have low weight, making numerical EV dangerous, even if the probability relation is logically valid.
