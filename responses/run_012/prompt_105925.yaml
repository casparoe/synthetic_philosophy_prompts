prompt: |-
  i'm in a reading group thats working through Keynes on probability and we keep tripping over this one-liner people throw around: you can't put a probability on a unique event. last week someone used it to shut down a discussion about expected-value reasoning for a one-off decision (take the job or not, invade or not, lockdown or not) -- his claim was that since theres no reference class and no long-run frequency, any probability you assign is meaningless, so expected-value reasoning is a category error. i think theres something right in there but that it's carrying way too much weight. can you lay out the distinct precise claims that sentence could be making -- what kind of probability is being denied, defined for what, relative to whose evidence, on what grounds -- and for each one say whether its trivial, substantive and defensible, or just false, and which of those readings actually gets him his conclusion that expected-value reasoning doesn't apply? also say where Keynes himself lands among them, if anywhere. give me a menu with verdicts, not a single answer.
