answer: |-
  Yes, there is a name for this. In social psychology and behavioral economics, this specific pattern is called **Pluralistic Ignorance**, and the mechanism that spreads it is called an **Information Cascade**.

  While those are two different terms, they almost always work together to create the exact scenario you described.

  Here is the breakdown of what it is, why it happens, how it differs from the concepts you mentioned, and where the line is drawn.

  ### 1. The Name and The Mechanism

  **The State: Pluralistic Ignorance**
  This is when a majority of group members privately reject a norm, belief, or opinion (e.g., "The tacos are mid," "I didn't do the homework"), but incorrectly assume that most others accept it. So, they go along with it publicly. The result is a situation where *no one* believes the lie, but *everyone* acts as if they do.

  **The Engine: Information Cascade**
  This explains *how* the ignorance spreads. You described it perfectly: *"everyone was actually being pretty reasonable, treating what other people did as evidence for whats true."*
  *   **Person A** tries the tacos. They think they are "mid," but they say "great" to look cool.
  *   **Person B** tries the tacos. They think they are "mid." But they hear Person A say "great." Person B thinks, "Maybe A has better taste than me? Or maybe I'm missing something?" So Person B also says "great."
  *   **Person C** hears A and B say "great." Even if C thinks they are "mid," the social evidence (2 votes) outweighs their private evidence (1 taste test). C says "great."

  By the time Person D comes along, it looks like an objective fact that the tacos are great. The group has aggregated *less* truth than the individuals had separately.

  ### 2. How It Is Different (The Boundaries)

  You asked specifically how this differs from Groupthink, Conformity, and Wisdom of Crowds. Here is the line in the sand for each.

  **Vs. Conformity (Normative Social Influence)**
  *   **Conformity:** "I know the tacos are mid, and I know you know they are mid, but I'm going to say they're great because I don't want to be the outcast." (Motivation: **Fear of rejection**).
  *   **Your Phenomenon:** "I think the tacos are mid, but since *everyone else* says they're great, maybe they actually *are* great and I'm just wrong." (Motivation: **Rational inference**).
  *   **The Line:** If people are lying to fit in, it's conformity. If people are genuinely updating their beliefs based on bad social data, it's an Information Cascade/Pluralistic Ignorance.

  **Vs. Groupthink**
  *   **Groupthink:** This happens in cohesive, closed groups (like a cabinet, a board, or a jury) where the goal is harmony. Dissent is actively suppressed or self-censored to avoid conflict. It requires a strong group identity.
  *   **Your Phenomenon:** This happens in loose networks (a grade, a mall crowd). There is no pressure to be harmonious, only pressure to be *correct*. You aren't staying quiet to protect the teacher's feelings; you're staying quiet because you assume the other students know something you don't.
  *   **The Line:** Groupthink is about **loyalty**. Your phenomenon is about **information**.

  **Vs. The Wisdom of Crowds**
  *   **Wisdom of Crowds:** This theory states that if you average many independent guesses, the result is often accurate (e.g., guessing the weight of a cow). This *only* works if the guesses are **independent**.
  *   **Your Phenomenon:** This is the **Failure of Crowds**. Because Person B copies Person A, their errors are no longer independent; they are correlated. Instead of errors canceling out, they compound.
  *   **The Line:** If adding more people makes the answer *better*, it's Wisdom of Crowds. If adding more people makes the false belief *stronger*, it's an Information Cascade.

  ### 3. Where Does It Stop? (The Breaking Point)

  You asked where the line is where it stops being this and turns into something else. An Information Cascade is actually quite fragile. It stops when **Private Information outweighs Public Signals.**

  *   **The "Truth-Teller" Break:** If one person says, "Actually, I didn't do the homework," the cascade shatters. Suddenly, everyone realizes they weren't the only one. The cost of speaking the truth drops to zero.
  *   **The Stakes Get Too High:** If the teacher says, "Pop quiz on the homework right now," the cost of pretending becomes too high. People will admit they didn't do it. The cascade breaks because the penalty for being wrong is now real.
  *   **Direct Verification:** If you actually taste the taco yourself (rather than hearing about it), your private signal becomes stronger. If the taco is objectively terrible, the cascade will eventually fail because the sensory evidence is too strong to ignore.

  ### 4. A Unified Label (If you need one)

  While "Pluralistic Ignorance driven by Information Cascade" is the accurate academic description, it is a mouthful. If you want a label for this specific pattern of **rational people creating a false group reality**, you could call it:

  **"The Phantom Consensus"**

  **What counts as a Phantom Consensus:**
  1.  **Private Doubt:** Most individuals privately disagree or are unsure.
  2.  **Public Agreement:** Most individuals publicly agree.
  3.  **Rational Motivation:** People aren't lying to be nice; they are assuming the group possesses superior information.
  4.  **Amplification:** The more people join, the more "true" the false fact becomes (anti-wisdom of crowds).

  **What does NOT count:**
  1.  **Propaganda:** If an authority figure is forcing the narrative, that's coercion, not a cascade.
  2.  **Shared Delusion:** If everyone *actually* believes the tacos are magic (e.g., they were drugged), that's mass hysteria, not pluralistic ignorance.
  3.  **Trend/Fad:** If people copy the behavior (buying the tacos) but admit they are mid, that's just fashion, not a false belief.

  ### Summary
  You noticed something sophisticated: **Social proof can override sensory evidence.**

  The group isn't "dumb." They are acting rationally based on the data they have. The problem is that the data (other people's opinions) is contaminated. You are describing **Pluralistic Ignorance** fueled by an **Information Cascade**. It is the specific reason why bad ideas can survive and good ideas can die without anyone ever actually voting for them.
