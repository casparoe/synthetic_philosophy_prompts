      *   **Move 6 (K):** Concedes it's about origins (scaffolding analogy). Origins are valid causal questions. Counterfactual is specified: sequence matters (religious rationalization -> economic). Adds "elective affinity" as selection/socialization story (communities disciplined members -> prospered -> ethic spread).
