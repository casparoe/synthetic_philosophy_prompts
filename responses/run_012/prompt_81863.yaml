  Furthermore, you're assuming the truth is cheaper to express than the lie. In complex domains, refuting a sophisticated fabrication often requires more granular claims than creating it. If I fabricate a complex economic model, you need to break down every variable to show why it's wrong. Each breakdown is a claim on your ledger. If the judge runs out of time to check your refutation steps, you accumulate debt while I sit on a pile of "checked" but misleading premises. You've incentivized the honest debater to be vague to avoid debt, which is exactly where obfuscation wins.
