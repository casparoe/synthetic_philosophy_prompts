          *   Bounded rationality (people aren't actually rational in the game-theoretic sense).
          *   Costly information acquisition (Grossman-Stiglitz paradox).
      *   *Epistemology of Price:* Price as a sufficient statistic. Hayek's "Use of Knowledge in Society." Price as a social belief aggregator.

  3.  **Structuring the Response:**

