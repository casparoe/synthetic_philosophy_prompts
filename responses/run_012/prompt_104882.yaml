      *   *(Refining the "Strict Requirement"):* What is the *minimum* condition for prices to be informative? It's that information *must* be costly to acquire, otherwise no one would bother (Grossman-Stiglitz). If prices perfectly revealed info, no one would trade to get info. So, prices cannot be *perfectly* informative. They must be noisy.
