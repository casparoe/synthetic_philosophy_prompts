  **Thirteen, Inc. Support Center**

  **Welcome to the Art of Virtue™ Platform.** Below are common onboarding queries regarding your moral subscription.

  **Q: How is the Core Cycle structured?**
  A: The standard deployment runs one virtue per week over thirteen weeks, completing one course per quarter. We recommend four courses annually to maintain optimal moral hygiene. Users track adherence via the provided ledger. Please note: the primary KPI is the reduction of black spots per page. While the ultimate goal is moral improvement, our data shows users who focus on spot-minimization report higher happiness metrics than those focusing on the virtues themselves.

  **Q: What are the hardware specifications for the Ledger?**
  A: The Starter Kit includes red-ruled pages designed for high-contrast fault visibility. Mark faults with ink. For enterprise users, we recommend upgrading to ivory leaves. These allow for fault correction using a lead pencil and wet sponge, facilitating reusable moral accounting. Please ensure the sponge is sufficiently damp to avoid paper degradation during repentance cycles.

  **Q: The Order module keeps failing. Is this a bug?**
  A: This is a known limitation. The Order precept ("Let all your things have their places; let each part of your business have its time") has high latency in real-world environments. Even our founder struggled to achieve full compliance here. We suggest treating Order as a background process. Do not let Order faults trigger churn. Many users find that carrying the Ledger without actively updating it provides similar psychological benefits to actual compliance.

  **Q: What is the expected ROI on virtue?**
  A: Thirteen, Inc. positions virtue as instrumental. Sincerity and Justice modules are optimized to earn you the confidence of your country, which correlates strongly with credit approval and political capital. If you are pursuing virtue for intrinsic worth alone, you may experience lower retention rates. The system is designed to make you a better businessman first, and a good man second.

  **Q: Do I need to achieve 100% compliance?**
  A: Absolutely not. Our official position aligns with the Speckled-Axe Protocol: a man may want his axe polished all over, but often prefers the speckled finish. We acknowledge that arriving at moral perfection is unlikely. The value proposition is not perfection, but the attempt. However, be wary of "foppery in morals." If your friends find your nicety ridiculous, you risk social isolation.

  **Q: How do I handle social friction?**
  A: Enable the "Friends in Countenance" setting. A benevolent user should allow themselves a few faults to keep friends in countenance. Total moral rigor can be perceived as arrogance. We recommend logging these strategic faults as "Moderation" exercises to maintain leaderboard integrity while preserving social capital.

  **Q: Can I cancel the subscription?**
  A: Users often downgrade from four courses a year to one, then one every several years, before pausing active tracking entirely. You may retain the Ledger indefinitely as a legacy device. Regarding theology: the platform is non-sectarian. We deliberately stripped out sectarian dogma so the method works for people of all religions. Your specific deity does not impact spot-tracking functionality.

  **Q: I feel like the metrics are overshadowing the virtues.**
  A: This is a common observation during Q3 reviews. Please refer to the Speckled-Axe Protocol. If the ledger is clean, the virtue is assumed.
