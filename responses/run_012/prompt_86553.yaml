answer: |-
  You have put your finger on one of the most persistent and frustrating logical structures in social theory. You are describing a specific failure mode of **Functionalism**, often disguised as **Historical Materialism**.

  There isn't one single word that captures the entire "shape" you described, but there is a cluster of concepts that carve it up precisely. Here is the breakdown of the logic, the names for the fallacies, the distinction between benefit and constraint, and what a testable version would actually require.

  ### 1. The Name of the Shape
  The broad category is **Naive Functionalism** (or **Pan-Functionalism**).
  The specific logical maneuver you are describing—where any outcome, or its opposite, is rationalized as serving the system—is often called a **Just-So Story** (borrowed from evolutionary biology) or, more formally, an **Unfalsifiable Teleology**.

  In the context of Marxist debate, this is frequently criticized as **Vulgar Marxism** or **Economic Determinism**. However, those terms describe the *content* (economy determines all). The *logical form* you are objecting to is **Post-Hoc Functional Rationalization**.

  The "Heads I win, Tails you lose" structure you identified (Law passes = stabilization; Law fails = corruption) is a classic example of **Unfalsifiability**. If a theory predicts $X$, and $\neg X$ happens, and the theorist says "$\neg X$ also serves the base," the theory has ceased to be empirical and become theological.

  ### 2. Benefit vs. Constraint (The Mechanism Objection)
  You asked: *Is there a real difference between explaining something by the benefit it confers and explaining it by the constraint it has to satisfy, and does the second one dodge the mechanism objection?*

  **Yes, there is a real difference, but No, it does not dodge the mechanism objection.**

  *   **Benefit Explanation (Teleological):** "Schools exist *in order to* create docile workers."
      *   *Problem:* This implies purpose. It suggests the future benefit caused the past existence. This is magic unless there is a designer.
  *   **Constraint Explanation (Selectionist):** "Schools exist. Those institutions that failed to create docile workers were eliminated by competitive pressures. Therefore, only docile-worker schools remain."
      *   *Advantage:* This removes the need for a conscious designer. It relies on **Negative Feedback**.
      *   *The Catch:* It still requires a **Selection Mechanism**. In biology, the mechanism is death/sterility. In capitalism, what is the mechanism?
          *   Do states that fail to school workers go bankrupt?
          *   Do capitalists who hire un-docile workers lose market share?
          *   Is there a feedback loop where "bad" institutions are actually removed?

  When your friend says, "Asking for a mechanism is individualist," they are conflating **Agency** with **Causality**. You do not need a conscious individual (an agent) to have a causal mechanism. A market crash is a structural mechanism; bankruptcy is a structural mechanism. If your friend cannot name the *structural penalty* for failing to meet the economic base's needs, they are not offering a selectionist explanation; they are offering a **Functionalist Tautology**.

  ### 3. The "Carving": Three Types of Claims
  To get the precision you want, you need to distinguish between three types of claims your friend is sliding between.

  **A. Causal Functionalism (The Strong Claim)**
  *   *Claim:* The economic base *actively generates* the superstructure to meet its needs.
  *   *Requirement:* You must show the causal chain. (e.g., Capitalists lobbied for this law; or Market forces made this religion profitable).
  *   *Test:* Find a case where the base needed $X$, but the superstructure produced $Y$. If the theory says "Impossible," it is dogma. If it says "Crisis ensues," that is testable.

  **B. Selectionist Functionalism (The Moderate Claim)**
  *   *Claim:* Various superstructures arise randomly or culturally. Those compatible with the base survive; those incompatible die out.
  *   *Requirement:* You must identify the **elimination mechanism**. Why did the "hard work" religion survive and the "world is an illusion" religion fade? Was it market competition? State suppression?
  *   *Test:* Show an institution that *hurt* the economy but persisted anyway. (If one exists, the selection theory is weakened).

  **C. Correlational Functionalism (The Weak Claim)**
  *   *Claim:* The superstructure happens to align with the base, but there is no causal link. They just fit together.
  *   *Problem:* This is **Epiphenomenalism**. It admits the economy doesn't *explain* the superstructure, only that they match. This surrenders the "base determines superstructure" claim entirely.

  Your friend is likely making Claim A verbally, but retreating to Claim C when pressed on mechanisms, while using the language of Claim B to sound scientific.

  ### 4. What Would a Testable Version Look Like?
  The philosopher **G.A. Cohen** tackled exactly this in *Karl Marx's Theory of History: A Defence* (1978). He called this **Consequence Explanation**. He argued that for a functional explanation to be valid, it needs a **Feedback Loop**.

  To make the "Base Explains Superstructure" claim testable, you need three things:

  1.  **Independence:** You must be able to define the "needs of capital" *independently* of the institutions that exist.
      *   *Current Failure:* "What does capital need?" "Whatever exists." "Why does it exist?" "Because capital needs it."
      *   *Fix:* Define capital's needs via profit rates, accumulation rates, or labor supply *before* looking at the laws/schools.
  2.  **Time Lag (Precedence):** The economic need must arise *before* the institutional change.
      *   *Test:* Did the need for a docile workforce appear in economic data *before* the schooling reforms? If the schools came first, the economic explanation is wrong.
  3.  **Failure Conditions:** The theory must specify what happens when the superstructure *fails* the base.
      *   *Test:* If schools stop producing docile workers, does the theory predict a crisis? A change in schooling? A change in the economy? If the theory says "The schools were actually serving a different function all along," it is unfalsifiable.

  ### 5. A Proposed Label
  Since you asked to coin something if nothing fits, here is a term that captures the specific "slippage" you described:

  **Omni-Functionalism**
  *Definition:* A mode of argument where any observed social phenomenon (or its absence) is retrospectively assigned a function that stabilizes the dominant economic order, without specifying a causal mechanism or selection pressure, rendering the claim immune to counter-evidence.

  **What it excludes:**
  1.  **Dysfunction:** It excludes the possibility that the economy might generate institutions that actually harm it (which Marxists actually believe happens during crises, but Omni-Functionalists often forget).
  2.  **Autonomy:** It excludes the possibility that law, art, or religion have internal histories that drive change independent of economics.
  3.  **Mechanism:** It excludes the requirement for a feedback loop (selection or intention).

  ### Summary for your Conversation
  When your friend says "The economy explains this," ask them to pick a lane:

  1.  **Is it Intentional?** (Did capitalists plan this?) If yes, show the memos/lobbying.
  2.  **Is it Selectionist?** (Did bad versions go bankrupt?) If yes, show the bankruptcy mechanism.
  3.  **Is it just a Fit?** (They just happen to match.) If yes, admit the economy didn't *cause* it.

  If they say "It's structural, no one needs to notice," reply: **"Structure is not magic. A structure without a mechanism is just a metaphor. What is the penalty for non-compliance?"**

  If they cannot name the penalty (e.g., loss of profit, loss of power, state collapse), they are telling a Just-So Story.
