      *   **Correction 2 (The Upshot/Practical Implications):** Distinguish between *Ultimate Moral Responsibility* (UMR) and practical responsibility. Strawson doesn't necessarily advocate for abolishing prison or blame in the way the roommate suggests (that's more Pereboom/Caruso). Strawson is more about the metaphysical impossibility.
      *   **Correction 3 (The "Irrational" Claim):** Address the emotional aspect. Even if UMR is impossible, "everyday" responsibility and reactive attitudes are natural and perhaps unavoidable.
