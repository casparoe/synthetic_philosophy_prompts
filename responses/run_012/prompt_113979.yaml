answer: |-
  Your roommate has done a decent job summarizing the *core* of Galen Strawson's "Basic Argument" (often called the Regress Argument), but he has made a significant philosophical error regarding **determinism**, and he is drawing practical conclusions that Strawson himself is much more cautious about.

  Here is a breakdown of what your roommate got right, what he got wrong, and how you can push back without needing a degree in metaphysics.

  ### 1. The Core Argument: What He Got Right
  Your roommate is correct about the structure of the **Basic Argument**. Strawson argues that to be "ultimately morally responsible" for an action, you must be responsible for the reasons and character that led to that action.
  *   **The Regress:** If you acted out of anger, you are only responsible if you are responsible for *being an angry person*. To be responsible for being an angry person, you must have chosen to become angry at some prior point. But to choose that, you must have had a character that valued that choice... and so on.
  *   **Causa Sui:** This leads to the requirement that you must be the cause of yourself (*causa sui*). Strawson agrees this is logically impossible. You cannot exist prior to yourself to create yourself.
  *   **The Conclusion:** Therefore, "Ultimate Moral Responsibility" (UMR) is impossible.

  On these points, Strawson would nod along. Your roommate has grasped the metaphysical impossibility of being the "prime mover" of your own soul.

  ### 2. The Big Error: Determinism
  This is your strongest point of pushback. Your roommate claimed: *"Strawson thinks this only goes through if determinism is true."*

  **This is false.** Galen Strawson explicitly argues that the Basic Argument works **regardless of whether determinism is true or false.**

  *   **If Determinism is true:** Your actions are caused by prior events (genes, environment) you didn't choose. No responsibility.
  *   **If Indeterminism is true:** Your actions involve some randomness or chance. But you cannot be responsible for random events either. If a decision pops into your head uncaused, that's not *your* control; that's luck.

  Strawson's point is that **determinism isn't the problem; the nature of responsibility is.** Even in a universe with free will (indeterminism), you still can't be the *cause of yourself*. Tell your roommate: *"Strawson's argument is supposed to be a 'no-fork' trap. It catches you whether the universe is determined or random. If you say it requires determinism, you haven't read the argument closely."*

  ### 3. "True" Responsibility vs. Everyday Responsibility
  You asked about the distinction between "true" responsibility and the "everyday kind." This is crucial for your situation with your best friend.

  *   **Ultimate Moral Responsibility (UMR):** This is the "God's eye view." It asks: *Could you have done otherwise, given the exact same state of the universe and your exact same brain, and were you the ultimate originator of that brain state?* Strawson says **No.** Nobody has this.
  *   **Moral Responsibility (Social/Practical):** This is the human view. It asks: *Did you act according to your desires? Are you sane? Can we hold you accountable to maintain social order?* Strawson admits we **do** hold people responsible in this way, and we probably always will.

  **The Pushback:** Your roommate is conflating the two. You can admit you lack *Ultimate* responsibility (you didn't choose your genes) while still accepting *Practical* responsibility (you hurt your friend, and you have the capacity to apologize and change behavior).

  Strawson would likely say that while UMR is an illusion, the feelings of guilt, regret, and the practice of apology are part of being a human social animal. Denying them doesn't make you rational; it makes you disconnected from human nature.

  ### 4. The Upshot: Should We Stop Blaming?
  Your roommate says: *"The upshot is we should stop blaming and punishing people and just treat everyone as a product of circumstances."*

  This is actually **not** Galen Strawson's primary view; it is the view of "Free Will Skeptics" like **Derk Pereboom** or **Gregg Caruso**, who build upon Strawson's metaphysics.

  Galen Strawson is a **pessimist**, not necessarily a **reformer**. He often suggests that even if we know UMR is impossible, we psychologically *cannot* stop feeling reactive attitudes (blame, anger, gratitude). In his view, knowing the truth doesn't necessarily free us from the feelings.

  **The Pushback:** Tell your roommate: *"Strawson says we can't be ultimately responsible, but he doesn't say we can stop feeling guilt. In fact, he suggests we're wired to feel it. Telling me I'm 'irrational' for feeling bad about hurting my friend ignores that these feelings are unavoidable human mechanisms, not just logical errors."*

  ### 5. How to Handle the Fight with Your Friend
  Your roommate is using high-level metaphysics to bypass human emotion. Here is how you can frame your response to him and yourself:

  1.  **Metaphysics doesn't fix friendships:** Even if you aren't *Ultimately* responsible, your friend still feels hurt. Apologizing isn't about admitting you are the *Causa Sui* of the universe; it's about acknowledging the impact of your actions and committing to repair the relationship.
  2.  **Guilt has a function:** Guilt isn't just a punishment; it's a signal. It tells you that you value the friendship and want to do better. Suppressing that because of a philosophical argument is arguably *more* irrational than feeling it, because it ignores the social utility of the emotion.
  3.  **The "Rational" Trap:** Your roommate claims you are being "irrational." But philosophy is supposed to serve life, not the other way around. If a philosophical conclusion tells you to ignore your friend's feelings and your own empathy, the philosophy might be missing something about the human condition.

  ### Summary for your conversation with him:
  *   **Agree:** "Yes, I accept I didn't choose my genes or my parents. I am not the *causa sui*."
  *   **Correct:** "But Strawson argues this is true *whether or not* determinism is true. You got that part wrong."
  *   **Distinguish:** "Strawson denies *Ultimate* Responsibility, not *Practical* Responsibility. I can accept I'm a product of circumstances and still take responsibility for repairing the mess I made."
  *   **Defend:** "Feeling guilt isn't a claim about metaphysics; it's a claim about caring. I care about my friend. That's not irrational."

  You don't need to disprove Strawson to justify making up with your best friend. You just need to recognize that metaphysics happens in the head, but friendship happens in the world.
