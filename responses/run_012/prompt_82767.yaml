answer: |-
  Good morning. Congratulations to the class of 2024.

  Look around you. Really look. We are sitting on a football field in Ohio. It is ten o'clock on a May morning. The air is already humid enough to frizz the hair of everyone in the front row. There are folding chairs digging into the backs of legs. There are parents in row six weeping openly into tissues that cost too much at the campus bookstore. There is a student to my left whose tassel is already crooked, despite the careful instructions in the program.

  This is the ceremony. This is the ritual. We put on the hats, we walk in the circle, we listen to the speech, and we pretend that a piece of paper and a few words can mark the boundary between who you were and who you are becoming.

  I want to talk to you about that boundary. Specifically, I want to talk about where you are standing while you cross it.

  There is an idea circulating in certain corners of the world right now—a quiet, heavy idea—that suggests this moment, the one you are stepping into, is not just another moment. It is the hinge. The claim is that we are living through the most consequential stretch of time in human history. The argument goes that the technologies we are building, the ways we are altering the climate, the biological tools we are unlocking, have raised the stakes so high that the long-run future of civilization will be settled in our lifetimes. Either we navigate this narrow pass and humanity has a future spanning millions of years, or we stumble, and the story ends much sooner than it needed to.

  It is a vertiginous thought. If it is true, then you, the graduating class, are not just entering a job market. You are entering a bottleneck.

  But there is a counter-claim. My father was a historian, and he had a favorite provocation for Thanksgiving dinner, usually deployed after the second glass of wine. He would point out that every generation believes it is living through the decisive decade. The people in 1914 thought the world was ending. The people in 1945 thought the world was ending. The people in 1962 thought the world was ending. They were certain they were the hinge. And most of the time, they were wrong. They were just people, living through a decade, who happened to have loud problems.

  My dad's point was about base rates. The number of decades that feel like the end of the world is very high. The number of decades that actually are the end of the world is, so far, zero. He called being convinced you're special "hinge-drunk." It's a kind of historical intoxication where the urgency of the news cycle convinces you that you are the main character of civilization.

  Here is the knot I want you to hold: The evidence that we are actually at the hinge, and the evidence that we are merely hinge-drunk, looks exactly the same from the inside.

  When you are living through a true turning point, the sky looks dark with smoke and the ground feels unstable. When you are living through a normal period but you are anxious and glued to your phone, the sky looks dark with smoke and the ground feels unstable. There is no internal sensation that confirms your historical importance. The people who turned out to be right about their moment usually had no idea at the time. They were just doing their work. The people who were certain they were saving the world were often the ones who missed the actual danger, or invented dangers that weren't there.

  So, how do you know?

  I want you to try a test with me. Imagine it is two hundred years from now. Imagine a museum curator, standing in front of a display case labeled "The Early Twenty-First Century." Inside the case are our smartphones, a vial of mRNA, a solar panel, maybe one of these graduation caps.

  The curator is writing the plaque that explains this decade to the visitors. There are two versions of that plaque.

  Version A reads: "This was the decade humanity grew up. They faced the first existential risks of their own making and built the institutions to survive them. Everything after this was built on their foundation."

  Version B reads: "This was a decade of high anxiety. They believed they were facing existential risks, but they were mostly facing growing pains. They spent a lot of energy worrying about the end of the world, which distracted them from fixing the plumbing."

  Here is the uncomfortable part: Both versions are compatible with the facts you have today. Both versions fit the data. You cannot look at the headlines and know which plaque is being written. You cannot look at the climate models or the AI progress reports and know which curator is right. You are inside the exhibit case. You cannot read your own label.

  And this brings me to an honest admission. If Version A is the true one—if this really is the hinge, if the fate of the species actually rests on the decisions made in the next ten years—then standing here, on a football field in Ohio, talking to a few hundred people for twelve minutes is a bizarre way to spend the hour.

  If the house is on fire, you do not give a speech about the architecture of the house. You grab a bucket. You grab a hose. You run. The fact that I am standing here, and that you are sitting there, and that we are observing the niceties of academic protocol, suggests one of two things. Either the house is not on fire, and we are safe enough for ceremony. Or the house is on fire, and we are in denial, clinging to ritual because we don't know what else to do.

  I don't know which it is. I cannot know. And neither can you.

  So, where does that leave you? I am not going to tell you that you must save the world. That assumes Version A is true, and it assumes you know how to save it, which is a dangerous combination. It leads to burnout, or worse, it leads to fanaticism. It turns your life into a resource to be spent rather than a life to be lived.

  But I am also not going to tell you to relax, that this is all just noise, that every generation thinks this and you should just get your job and buy your house. That assumes Version B is true. It assumes the stakes are low. But if Version A is true, that advice is negligence. If there is a real chance that this is the hinge, then treating it like a normal Tuesday is morally indefensible.

  We are left with a third place. It is a narrow ridge to walk, but it is the only ground that holds.

  The third place is this: You must act as if it matters, without requiring the validation that it does.

  You have to do the work—the engineering, the teaching, the nursing, the writing, the building—as if the future depends on it. You have to bring your full attention to the problems in front of you, because if this is the hinge, half-measures won't hold. You cannot afford cynicism. You cannot afford detachment. You have to show up with the urgency of someone who believes the plaque will say Version A.

  But simultaneously, you must hold that urgency lightly. You have to accept that you might be hinge-drunk. You might be wrong. And if you are wrong, if this is just a normal decade, then the work still matters. Good engineering is good engineering even if the world doesn't end. Good teaching is good teaching even if civilization doesn't hang in the balance. Decency is valuable regardless of the timeline.

  The verdict belongs to the curator. The work belongs to you.

  Do not wait for history to tell you that you were important before you start trying to be useful. Do not wait for the certainty that this is the big moment. You will never have that certainty. The people in 1914 didn't have it. The people in 1945 didn't have it. They just had the work.

  So, go out and do the work. Build things that would be valuable in a future that lasts a million years, and also valuable in a future that just looks like the last fifty years. Build institutions that are robust enough to survive a crisis, and flexible enough to survive boredom. Treat each other with a kindness that is warranted if we are all crewmates on a sinking ship, and also warranted if we are just neighbors in a quiet town.

  If you live that way, you win either way. If this is the hinge, you were the ones who turned it. If this is just another decade, you were the ones who made it worth living through.

  Fix your tassels. Watch your step on the grass. Go do the work.

  Thank you.
