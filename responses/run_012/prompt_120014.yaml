answer: |-
  Here is the spec. It is designed to be a checklist you can hold up against a script page, and a shield you can hold up in a hotel bar.

  ### The Spec: Five Requirements for Dramatising the Dead

  **1. The Living Harm Limit (Genuine Requirement)**
  *   **The Rule:** You cannot inflict gratuitous reputational or emotional damage on living descendants or associated communities, even if the subject is dead.
  *   **The Case:** *The Awful Person / The Community Symbol.* If the subject has living family, depicting them as a monster requires evidence, not just dramatic convenience. If the subject is a symbol to a community (e.g., a founder, a martyr), altering their core narrative functions as a verdict on that community.
  *   **Why:** Libel laws protect the dead, but harassment laws and public relations reality protect the living. This is not about truth; it is about collateral damage.
  *   **Defensibility:** "We verified there are no living descendants and consulted community leaders to ensure the portrayal was not gratuitously offensive."

  **2. Fidelity to Load-Bearing Facts (Genuine Requirement)**
  *   **The Rule:** You cannot contradict established, verifiable historical events that define the public understanding of the subject's life without a compelling narrative reason that serves a deeper truth.
  *   **The Case:** *The Deathbed.* Moving her to a deathbed she provably wasn't at changes the historical record of her whereabouts.
  *   **Why:** Audiences treat drama as history. If you change a load-bearing fact (where she was, who she killed, what she signed), you are not adapting; you are rewriting.
  *   **Defensibility:** "We moved her to the deathbed because the diary's guilt was the defining psychological fact of her life, and the physical location was the only way to visualise that guilt for a mass audience without voiceover." (Note: This admits the breach to justify the gain).

  **3. Transparency of Fabrication (Genuine Requirement)**
  *   **The Rule:** The audience must be able to distinguish between what is known and what is guessed. A disclaimer is necessary but not sufficient; the texture of the invention must not mimic the texture of the record.
  *   **The Case:** *The Caption.* "Some scenes were imagined" is a fig leaf if the whole thing is imagined. It discharges legal liability but not ethical debt.
  *   **Why:** It is a consumer protection issue. The audience is buying a product labelled "Based on a True Story." If the ratio of fact to fiction is 10/90, the label is misleading.
  *   **Defensibility:** "Our disclaimer is specific. We do not present invented dialogue as recorded testimony."

  **4. Narrative Necessity vs. Factual Convenience (Discretionary Principle)**
  *   **The Rule:** Invention is permissible only when the record is silent *and* the invention is required to make the character intelligible, not just to fill runtime.
  *   **The Case:** *The Invented Row / The Composite.* A screaming row that isn't in the sources is fine if it dramatises a tension known to exist. Welding two women into one is risky; it erases individual agency and is usually done for budget, not truth.
  *   **Why:** This is taste dressed up as principle. "Necessity" is subjective. However, distinguishing between *filling a gap* (Episode 3 is just letters) and *fixing the plot* (we need a climax here) is crucial.
  *   **Defensibility:** "Without the row, Episode 3 is static. The tension between the sisters is documented; the specific shouting match is the dramatic vessel for that documented tension."

  **5. Respect for Expressed Will (Discretionary Principle)**
  *   **The Rule:** If the subject explicitly requested privacy or destruction of records, using those records carries an ethical tax that must be acknowledged.
  *   **The Case:** *The Burned Papers.* She asked for them to be burned. Someone didn't. Using them violates her agency.
  *   **Why:** Legally, you own the papers. Ethically, you are overriding her final autonomy. This is not a hard constraint (otherwise no biopics of private people would exist), but it requires justification.
  *   **Defensibility:** "We acknowledge she wanted these private. We are using them because they are the only window into the refuge work that benefits the public historical record."

  ***

  ### The Incompatible Pair

  You suspected there was one pair of requirements that cannot be held together. You are right. It is **Fidelity to Load-Bearing Facts** (Requirement 2) and **Narrative Necessity/Psychological Truth** (Requirement 4).

  You cannot have both when the facts do not support the psychology. In your Episode 5 case:
  *   **Fact:** She was not at the deathbed.
  *   **Psychology:** She felt guilty about the death.
  *   **Conflict:** To show the guilt visually (TV drama), you feel you need her there. To keep the fact straight, she must be elsewhere.

  If you put her there, you break Requirement 2 to save Requirement 4. If you keep her away, you risk boring the audience (failing the drama) to save Requirement 2. You must choose which truth you are selling: **The Truth of Event** or **The Truth of Experience.** You cannot claim both simultaneously. Most successful drama chooses Experience, but it must admit it (see Requirement 3).

  ***

  ### The Medium: Why Telly is Different

  Yes, it matters that this is TV.
  1.  **Visceral Authority:** A novel is processed in the imagination; the reader co-authors the image. TV is imposed. Once an actor's face is attached to a historical figure, that face *becomes* the figure in the public consciousness. You are creating a visual memory that overwrites historical memory.
  2.  **Passivity:** A reader can check a footnote or sense ambiguity in prose. A viewer is swept along by music, cut, and performance. The medium argues for its own reality more aggressively than text.
  3.  **Scale:** A niche history book reaches 5,000 people. A drama reaches 5 million. The margin for error on "misinformation" is significantly lower because the cultural impact is higher.

  Therefore, your burden for **Transparency (Requirement 3)** is higher than a novelist's. You are not just telling a story; you are cementing an image.

  ***

  ### The Camps

  Your Head of Legal is right on liability but wrong on reputation; you won't get sued, but you can get cancelled or blacklisted by archives if you gain a reputation for trashing sources. Your Script Editor is right on ethics but vague on execution; "owing her something" is meaningless unless defined as "owing the audience the truth about what is invented." The middle ground is this: You owe the dead non-caricature, and you owe the living transparency. If you break a hard fact to serve an emotional truth, you must admit the break. If you do that, you can look the family in the eye and say, "We didn't lie to you; we told you where we had to guess."
