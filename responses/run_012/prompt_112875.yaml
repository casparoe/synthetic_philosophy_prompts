  Bottom line
  The interventionist theory yields the counter-intuitive verdict here, primarily because it forbids backtracking through common causes while the counterfactual theory permits it. The divergence hinges on a pre-empted backup mechanism that activates only under surgical intervention. This demonstrates that 'root cause' is not a theory-neutral fact.

  The case
  A database migration service acquires an exclusive lock on the schema table and signals completion by writing a version number to a shared configuration store. The application service starts up by first checking this version number; if it mismatches the expected value, the application aborts immediately with a configuration error. If the version matches, the application proceeds to establish a database connection, which times out after thirty seconds if the migration lock is still held. In the actual incident, the migration ran successfully but the version was written incorrectly, so the application aborted on the version check before ever attempting the database connection. The candidate cause is the writing of the incorrect version number; the effect is the service failure.

