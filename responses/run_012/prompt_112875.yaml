prompt: |-
  I write backend software for a living and have no formal training in philosophy, so I need you to keep the machinery visible rather than assume I know the literature.

  I want you to design a case in which two theories of causation give opposite verdicts on whether the first event caused the second. Take the two as follows, as rough glosses I can work with: the counterfactual theory, on which an event counts as a cause if the effect would not have occurred had the event not occurred; and the interventionist theory, on which an event counts as a cause if there is some way of setting it to a different value that would change the effect while everything else is held fixed — where that setting has to be surgical, i.e. it must change nothing else except through the event itself. The verdict pattern I want is the awkward direction: the counterfactual theory counts the event as a cause and the interventionist theory does not. I want the case for an internal write-up arguing that the phrase root cause in postmortems smuggles in a choice between theories rather than reporting a fact.

  Constraints on the case. It must be something that could plausibly happen in a running software system — retries, health checks, failover, queues, caches, clock skew, connection pools, resource limits, that sort of thing. No trolleys, no boulders, no shooters, no brains, no science fiction, no exotic physics. The scenario itself must be a single paragraph in plain English, specific enough that a reader can point to exactly which event is the candidate cause and which is the effect. The disagreement must not be an artefact of how the events are described: if the interventionist can rescue their verdict merely by describing the same system at a different level of granularity or with differently cut variables, the case has failed. The interventionist's denial must follow from the gloss above as it stands, not from an extra assumption you have quietly added. And if you conclude the pattern cannot be produced without reusing one of the stock structures from the literature — pre-emption, overdetermination, trumping, double prevention, omission — say so plainly, then give the best case you can and mark exactly which stock structure you had to lean on.

  Format the answer in British English, in these sections and this order. Bottom line (two or three sentences): which theory comes out badly and the single feature of the case responsible. The case (one paragraph, around 120 words). Verdicts (a two-row table, one row per theory, with columns for the verdict and the step in that theory's reasoning which produces it — I want the reasoning, not just the verdict). Specification check (one short line for each constraint above, saying how the case meets it or that it does not). What is doing the work (around 100 words): the one feature that makes the verdicts diverge, and why deleting it collapses the case back into agreement. How the interventionist fights back (around 100 words): the most plausible repair, and whether it rescues the case. My verdict (two or three sentences): whether this is a genuine case of the two theories coming apart, or a badly specified causal model. Around 600 to 800 words in total. No citations or reading lists — I have no way to check them and I do not need them.
