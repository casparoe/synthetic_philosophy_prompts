answer: |-
  You have identified one of the most persistent and structurally interesting problems in the philosophy of science and philosophy of biology. The specific biological debate you describe is the controversy between **Kin Selection** (inclusive fitness) and **Multilevel/Group Selection**. In the philosophy of biology, the position that these two mathematical formalisms are transformable into one another is known as the **Equivalence Thesis**.

  However, you are asking for the name of the *philosophical shape* of the disagreement itself: two accounts that are empirically equivalent, mechanistically compatible, yet ontologically exclusionary and heuristically distinct.

  There is no single, universally agreed-upon noun that captures this exact configuration, but there is a cluster of terms of art that, when combined, define it precisely. The most accurate description of this dispute is a conflict over **Explanatory Privilege** between **Empirically Equivalent Rivals**, manifesting as **Ontological Underdetermination**.

  Here is the breakdown of the concepts that define this shape of disagreement, how they distinguish it from the diagnoses you rejected, and where the boundaries lie.

  ### 1. The Logical Relation: Empirical Equivalence
  The foundational condition you describe—that no possible observation could settle the dispute because both theories yield identical predictions—is known in philosophy of science as **Empirical Equivalence**.
  *   **Definition:** Two theories are empirically equivalent if they entail the same set of observational statements.
  *   **Distinction:** This distinguishes the dispute from an "ordinary disagreement about the facts." In an ordinary disagreement, one party predicts $X$ and the other predicts $\neg X$. Here, both predict $X$.

  ### 2. The Epistemic Status: Underdetermination
  When evidence supports two empirically equivalent theories equally well, the situation is called **Underdetermination of Theory by Evidence** (often associated with the Duhem-Quine thesis).
  *   **Specific Type:** Your case is not just standard underdetermination (where we suspend judgment); it is **Strong Underdetermination** or **Metaphysical Underdetermination**. This occurs when the theories differ not in predictions, but in their **ontological commitments** (what they claim *exists* or is *causally primary*).
  *   **Distinction:** This distinguishes the dispute from a "quarrel over words." In a verbal dispute, the parties agree on the ontology but use different labels. Here, they agree on the labels (genes, groups) but disagree on which ontology is *fundamental*.

  ### 3. The Core Conflict: Realism vs. Instrumentalism
  You noted that each side accepts the other's description as a "correct account of the mechanism" but denies it "explains anything." This is the hallmark of a dispute over **Scientific Realism** versus **Instrumentalism**.
  *   **The Shape:** One party (e.g., the Gene Selectionist) treats their preferred entities (genes) as **Real** (causally primary) and treats the other party's entities (groups) as **Instrumental** (useful fictions, bookkeeping devices, or "manner of speaking"). The Group Selectionist reverses this.
  *   **Term of Art:** This is often called a dispute over **Causal Interpretation** of **Formally Equivalent Models**.
  *   **Why it fits:** It explains why they accept the math but fight over the explanation. They agree on the algorithm but disagree on what the variables *refer to* in reality.

  ### 4. The "Work-Doing" Aspect: Conceptual Relativity
  You rejected the "coordinate system" analogy because a change of coordinates is supposed to be neutral, whereas here the choice "decides what the two writers notice... and which facts strike them as standing in need of explanation."
  *   **The Concept:** The philosopher Hilary Putnam developed the concept of **Conceptual Relativity** to describe exactly this. Putnam argued that some ontological questions (e.g., "How many objects exist in this room?") have no answer independent of a **Conceptual Scheme**.
  *   **Why it fits:** Unlike a mere coordinate change in geometry (which is purely passive), a conceptual scheme in science is **heuristically active**. Choosing the "Gene" scheme makes certain patterns salient (e.g., conflicts within the family); choosing the "Group" scheme makes others salient (e.g., inter-group competition).
  *   **The Dispute:** The partisans are fighting over which Conceptual Scheme is the "One True Scheme" (Absolute Realism), whereas a philosophical resolution would likely be **Explanatory Pluralism** or **Perspectival Realism** (acknowledging that multiple schemes carve nature at different joints for different purposes).

  ### 5. The Explanatory Dimension: Explanatory Contextualism
  You noted that the dispute is about "the real explanation." Bas van Fraassen's **Explanatory Contextualism** posits that an explanation is not a relation between a theory and the world, but between a theory, the world, and a **Context** (specifically, a "why-question").
  *   **The Shape:** The Gene theorist is answering "Why does this trait persist *given the replication constraints of DNA*?" The Group theorist is answering "Why does this trait persist *given the survival constraints of the collective*?"
  *   **The Dispute:** The parties are treating their specific context as the *only* legitimate context. This is a dispute over **Explanatory Priority**.

  ### Summary: The Name of the Dispute
  If you require a single label to categorize this shape of disagreement in a philosophical taxonomy, the most precise term is:

  **Ontological Underdetermination between Empirically Equivalent Rivals**

  However, to capture the *active* nature of the disagreement (that it guides research), it is best described as a **Kuhnian Dispute over Theoretical Values**. Thomas Kuhn argued that when data cannot decide between theories, scientists choose based on "values" like simplicity, scope, and **fruitfulness** (heuristics).
  *   **The Boundary:** This distinguishes it from a **Pseudo-Dispute** (merely verbal) and a **Standard Empirical Dispute** (resolvable by data).
  *   **The Edge:** The category ends where one theory begins to make a novel prediction the other cannot (breaking the empirical equivalence) or where the parties agree to **Explanatory Pluralism** (admitting both are valid descriptions at different levels).

  ### Why Your Diagnoses Were Unsatisfactory
  *   **"Merely Verbal":** Rejected correctly. The parties disagree on *causal structure*, not just definitions. One claims genes *cause* the behavior; the other claims group structure *causes* the behavior. Causality is not verbal.
  *   **"Coordinate Systems":** Rejected correctly. While mathematically they may be transformable (the Equivalence Thesis), **Causal Interpretations** are not always transformable without remainder. As you noted, the choice of framework dictates the **Heuristic Fecundity** (what research questions get asked). In philosophy of biology, this is often called the difference between **"Bookkeeping"** (mathematical equivalence) and **"Causal Autonomy"** (explanatory distinctness).

  ### Conclusion
  The concept you are looking for is **Empirical Equivalence** leading to **Ontological Underdetermination**, where the dispute is maintained by competing claims to **Explanatory Privilege**.

  In the specific literature of the philosophy of biology (e.g., works by Samir Okasha, Elliott Sober, or Peter Godfrey-Smith), this is often discussed under the header of **"The Equivalence Thesis and Causal Interpretation."** The general philosophical category for the *shape* of the fight is a **Realist Dispute over Empirically Equivalent Formalisms**.

  The disagreement persists not because the evidence is lacking, but because the parties are arguing over **which conceptual scheme licenses the best Inference to the Best Explanation (IBE)**, despite the evidence being unable to discriminate between them. They are fighting over the **Right to Describe**, not the **Facts Described**.
