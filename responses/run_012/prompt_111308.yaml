          *   Peers: 2-3 quiet students from the same course.
      *   **Timeline:** Fortnight away (2 weeks).
      *   **Thesis:** Lewisian conventions (regularity, expectation, preference, alternative, common knowledge) explain predictability but not *normativity* (demanded behavior). Norms add a "standing to criticize" (even by third parties) and survive the disappearance of the original coordination problem.
      *   **Examples:** Lift button (convention, no criticism) vs. Giving up a seat (norm, criticism/resentment).
      *   **Claim against EGT:** EGT models criticism as costly punishment. This gets explanation backwards (payoffs explain persistence, not warrant) and predicts criticism fades when punishment is cheap to ignore (which it doesn't).
      *   **Request:** Q&A preparation sheet. Objections ordered by likelihood/damage. Phrased in audience's vocabulary. 2-minute replies. Honest notes on weak spots. Concessions to make. The "most feared" question. No citations/reading lists.

  2.  **Deconstruct the Thesis & Identify Vulnerabilities:**
      *   *Lewisian Definition:* The user is using David Lewis's definition of convention. The philosopher of social science will know this inside out. Lewis explicitly distinguishes conventions from norms (moral/social). The user is arguing that norms *add* something to conventions.
      *   *The "Criticism Surplus":* This is the core innovation. It's a normative claim (warranted criticism) vs. a descriptive/functional claim (punishment).
      *   *The EGT Clash:* EGTs care about stability. If criticism stabilizes the norm, why does the *source* of the warrant matter? They will argue that "warrant" is just a folk-psychological label for equilibrium selection/maintenance mechanisms.
      *   *The Examples:* Are they robust? Is the lift button *really* just a convention? Is giving up a seat *really* a coordination problem? (It looks more like a Prisoner's Dilemma or Assurance Game with altruism).
      *   *Survival of the Demand:* The claim that norms survive the disappearance of the coordination problem. EGTs might argue that if the problem disappears, the equilibrium shifts, or it becomes a different game.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (EGT/Behav Econ):* "You're confusing the *function* of criticism with its *warrant*." They will argue that if criticism stabilizes the equilibrium, that *is* the explanation. Normativity is an illusion or a proximate mechanism.
      *   *Objection 2 (Phil of Social Science):* "Lewis already covered this." Lewis distinguished conventions from norms. Are you just restating the distinction without solving the genealogy problem? Also, is the seat example actually a convention?
      *   *Objection 3 (EGT):* "Costly Punishment." You say they get it backwards. But if punishment isn't payoff-driven, why does it persist? Evolution selects for fitness, not 'warrants'.
      *   *Objection 4 (General):* "Third-party punishment." EGT has models for this (altruistic punishment). Why is your 'standing to criticize' different from altruistic punishment?
      *   *Objection 5 (The 'Most Feared'):* "The Genealogy/Origins Problem." If the norm survives the coordination problem, how did it get there? If it wasn't selected for stability, why is it universal?

  4.  **Refining the Objections for the Specific Audience:**
      *   *EGT Vocabulary:* Equilibrium, stability, payoff matrix, evolutionary stable strategy (ESS), costly signaling, altruistic punishment, proximate vs. ultimate explanation.
      *   *Phil Vocabulary:* Normativity, warrant, standing, Lewisian common knowledge, constitutive rules.
      *   *Tone:* Rigorous, slightly skeptical, focused on mechanism and definition.

  5.  **Developing the Replies:**
      *   Need to be concise (2 minutes spoken is approx. 250-300 words).
      *   Need to acknowledge the validity of the challenge while holding the line on the distinction between *is* (stability) and *ought* (warrant).
      *   Need to identify the "thin" spots honestly.

  6.  **Identifying Concessions:**
      *   Don't fight the definition of convention too hard; Lewis is the standard.
      *   Admit that EGT explains *persistence* well, just not *normativity*.
      *   Admit the seat example might be imperfect (mixed motive).

  7.  **Identifying the "Most Feared" Question:**
      *   It needs to strike at the heart of the project. The biggest risk is the "Error Theory" or "Debunking" argument. If evolution explains the behavior, what work is left for "warrant" to do? Or, more technically: "If the criticism isn't payoff-driven, what mechanism sustains it?"

