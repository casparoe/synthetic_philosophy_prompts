answer: |-
  # Preparation Sheet: End-of-Term Presentation
  **Topic:** Norms vs. Conventions (The "Criticism Surplus")
  **Audience:** EGT/Behav Econ (Majority), Phil Social Science/Metaethics (Minority)

  ## Strategic Concessions
  *Do not fight these battles. Concede them early to save capital for your core claim.*

  1.  **Concede the Game Structure of the "Seat" Example:** The EGTs will pounce on the claim that giving up a seat is a "coordination problem" like the lift button. It involves a cost to the agent (standing) and a benefit to another. It looks more like an Assurance Game or a Prisoner's Dilemma with altruism.
      *   *Say:* "I am using 'coordination structure' loosely to indicate arbitrariness and mutual expectation, not to claim the payoff matrices are identical to the lift case. The core point is the *arbitrariness* of the specific act, not the costlessness."
  2.  **Concede that EGT Explains Persistence:** Do not claim evolutionary accounts *cannot* model the stability of norms. They can.
      *   *Say:* "I grant that evolutionary models successfully explain why criticism *persists*. My claim is narrower: they do not explain why the criticism is *warranted* or why agents experience it as normative rather than merely prudential."
  3.  **Concede Lewis's Baseline:** The philosopher of social science knows Lewis better than you. Do not try to correct his definition of convention.
      *   *Say:* "I am taking the Lewisian definition as the starting point for 'convention' to isolate what must be *added* to get a 'norm'."

  ---

  ## Likely Objections & Replies

  ### 1. The "Proximate vs. Ultimate" Objection (Evolutionary Game Theorists)
  **Likelihood:** Very High | **Damage:** High
  **The Question:** "You say EGT gets the direction of explanation backwards. But in evolutionary terms, 'warrant' is just a proximate mechanism. If the 'standing to criticize' doesn't cash out in fitness terms or stability, it's an epiphenomenon. Why posit a normative property when a payoff structure explains the behaviour? Aren't you just re-describing the equilibrium condition as a 'norm'?"

  **Two-Minute Reply:**
  "I am not denying that payoffs explain the *causal history* of the behaviour. I am denying that they explain the *content* of the demand. When a bystander criticizes a seat-hogger, they aren't saying, 'You are destabilizing our equilibrium.' They are saying, 'You ought not to do that.'
  If we reduce the 'ought' entirely to the 'is' of stability, we lose the ability to explain why norms persist *after* the stability condition vanishes. People still feel they ought to dress formally for funerals even if no one would notice if they didn't. The EGT account predicts the behaviour should extinguish once the payoff for punishment drops. The normative account predicts the demand remains because the *warrant* is distinct from the *sanction*. I am arguing for a distinction between the mechanism of enforcement and the justification of the rule."

  **Where the Reply is Thin:**
  You are positing a "normative property" that hangs in the air without a clear ontological home. If it doesn't affect payoffs, how does it interact with the physical world? The EGTs will press you on the *causal efficacy* of "warrant."

  ### 2. The "Altruistic Punishment" Objection (Behavioural Economists)
  **Likelihood:** High | **Damage:** Medium-High
  **The Question:** "We already model third-party criticism as 'altruistic punishment.' Agents pay a cost to punish defectors to maintain group cooperation. You call this a 'criticism surplus,' but it looks like a standard public goods game solution. Why is your 'standing to criticize' different from a willingness to incur a cost to punish?"

  **Two-Minute Reply:**
  "Altruistic punishment models explain why I *would* punish you. They do not explain why I think I *may* punish you, but your mother *may not,' or why I feel guilty if I don't.
  In your models, punishment is a strategic move to restore cooperation. In my account, criticism is an appeal to a shared standard. If I punish you strategically, I am manipulating your payoffs. If I criticize you normatively, I am invoking a rule we are both bound by. The 'surplus' is the expectation that the criticism itself is a valid move in the social game, independent of whether it successfully changes your behaviour. You can have punishment without norms (a predator punishing prey), but you cannot have norms without this specific kind of warranted criticism."

  **Where the Reply is Thin:**
  Behavioural economists operationalize everything. If "standing" doesn't change the predicted behaviour in the model, they will dismiss it as semantics. You need to insist it changes the *response to deviation* (resentment vs. disappointment).

  ### 3. The "Lewisian Distinction" Objection (Philosopher of Social Science)
  **Likelihood:** Medium | **Damage:** Medium
  **The Question:** "Lewis explicitly distinguished conventions from norms in *Convention*. He noted norms involve 'obligation' while conventions involve 'expectation.' Are you actually arguing against Lewis, or just restating his footnote? If you are adding 'standing to criticize,' how do you account for the genesis of that standing without falling back into the evolutionary story you reject?"

  **Two-Minute Reply:**
  "I am not arguing against Lewis's distinction, but rather fleshing out the *mechanism* of that distinction. Lewis tells us *that* norms involve obligation, but he doesn't fully analyse what constitutes that obligation in a social ontology.
  My contribution is identifying the 'distributed readiness to criticize' as the observable social fact that constitutes that obligation. Regarding genesis: I am agnostic on the genealogy. Evolution might explain how we got the *capacity* for this standing, but it doesn't explain the *logic* of the standing itself. Just as evolution explains why we have thumbs, but not what makes a tool 'ergonomic.' I am analysing the structure of the norm, not its phylogeny."

  **Where the Reply is Thin:**
  The philosopher will know that Lewis struggled with this exact point. If you are agnostic on genealogy, they may argue your account is incomplete because norms are inherently dynamic/evolutionary entities.

  ### 4. The "Fading Criticism" Objection (EGT/Behav Econ)
  **Likelihood:** Medium | **Damage:** High
  **The Question:** "You claim criticism doesn't fade when punishment becomes cheap to ignore. But empirically, it does. Norms die when they stop being enforced. If the 'warrant' is real, why do norms ever die out? Isn't the disappearance of criticism exactly what happens when a norm dies?"

  **Two-Minute Reply:**
  "Norms do die, but often via a period of *conflict*, not just fading. When a norm dies, people don't just stop doing it; they argue about whether it *should* be done.
  My point is that during the life of the norm, the criticism persists even when it is inefficient. Consider queueing. If I jump a queue, you might criticize me even if you know it won't make me move, and even if it costs you time. An EGT model suggests I should only criticize if it changes your behaviour. The fact that we criticize 'futilely' shows the criticism is about the violation of the standing, not just the restoration of order. The norm dies when the *warrant* is collectively revoked, not just when the punishment becomes too costly."

  **Where the Reply is Thin:**
  "Futile criticism" is hard to distinguish from "signaling to third parties." The EGTs will argue the futile criticism *is* a payoff-maximizing signal to the bystanders. This is a hard empirical knot to untie.

  ---

  ## The "Most Feared" Question
  **The Question:** "If the 'warrant' for criticism is not grounded in payoffs or stability, **what prevents it from being arbitrary tyranny?** If I can criticize you for anything, provided I have a 'distributed readiness' to do so, isn't your definition of a norm just 'any stable pattern of bullying'? How do you distinguish a legitimate norm from a stable extortion racket without using the very payoff structures you rejected?"

  **Why You Should Be Afraid:**
  This strikes at the metaethical core. If you separate norms from payoffs/stability, you lose the ability to distinguish *social norms* from *mafia codes*. Both involve third-party criticism, both involve punishment, both can survive the original "need" for them. If you say "norms are legitimate," the metaethicist will ask "legitimate according to whom?" If you say "norms are just stable criticism," the EGTs will say "then it's just stability."

  **Short Account of the Reply:**
  "You are right that my account is descriptive, not justificatory. A mafia code *is* a norm in my sense. The distinction between a 'good' norm and a 'bad' one is a moral question, not a social-ontological one. My thesis is only about what makes a regularity a *norm* rather than a *convention*. Both mafia codes and queueing rules count as norms under my definition because both involve the 'criticism surplus.' The fact that the mafia code is morally odious doesn't stop it from being a norm. I am explaining the *structure* of social demand, not its *moral worth*."

  **Risk:** This concedes that your account cannot distinguish between social order and oppression, which might weaken the "normativity" claim. But it is safer than trying to ground "warrant" in morality, which opens a different can of worms.

  ---

  ## Final Advice for the Room
  *   **For the EGTs:** Speak their language. Use "equilibrium," "stability," and "mechanism." Do not sound like you are dismissing their models; sound like you are adding a variable they haven't modeled (the normative attitude).
  *   **For the Philosopher:** Be precise with "standing." It is a deontic concept (permission/authority), not a psychological one.
  *   **For Yourself:** When you feel cornered on the "warrant" ontology, retreat to the *phenomenology*. "I am describing how agents experience the interaction." It is harder to refute what people feel than what exists.
