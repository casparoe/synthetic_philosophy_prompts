      *Refining the "Most Feared" Question:* The EGTs will ask: "What is the causal mechanism of 'warrant'?" If it doesn't cash out in payoffs or psychology, it's epiphenomenal. This is the "Causal Exclusion" worry.

  9.  **Final Polish:** Check the voice. It should be supportive but realistic. "Here is how they will attack you."

