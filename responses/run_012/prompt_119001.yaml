      *   *Logic Check:* Is "everything is true" actually a Jain claim? No, that's relativism. Jainism says "no single statement is the *whole* truth." Big difference. I need to highlight this distinction clearly.

  7.  **Final Polish:**
      *   Check against the prompt requirements: "Menu," "Trivial/Substantive/False," "Stop arguing," "Respect constraint."
