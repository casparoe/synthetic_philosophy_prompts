prompt: |-
  Had a two-hour row in the pub last week about whether the house at the end of our street is actually ugly or whether that's just taste, and my mate Tom killed it dead with 'well, everything is true in some respect, thats the Jain thing, anekantavada — reality is many-sided'. He then used the exact same line when I said his team lost fair and square, so I've gone from thinking it was profound to thinking it's a machine for never losing an argument.

  Trouble is I've now collected about five different versions of what the doctrine is even supposed to be claiming, and they can't all be right. Version one, from a mate who does formal verification: it's just 'truth is relative to a parameter' and the mysticism is decoration. Version two, from someone who actually read a book on it: it isn't about truth at all, it's about objects — every object has endless aspects, so any single predicate is one-sided (ekanta), and the seven-way predication scheme (it is, it isn't, both, inexpressible, plus the combinations) is just the logic that falls out of that. Version three, from my sister who did a module on it: the point was never metaphysics, it was a rule for arguing — never claim your view is the only one, because dogmatic certainty is itself a kind of harm, and its tied to the non-violence thing. Version four, which I think I half made up: it's a fuzzy or paraconsistent logic where 'in some respect' is an operator on sentences. Version five, from Tom on his fourth pint: everyone's a bit right, so who cares.

  What I want is a menu. For each precise claim that 'everything is true in some respect' could be making — from 'different people notice different things' all the way up to the ones that genuinely mess with classical logic or with truth itself — say whether it's trivial, substantive-but-defensible, or false, and tell me which ones actually give Tom his 'so stop arguing about the house'. And if the doctrine is meant to be more than a platitude, I want to know what's supposed to stop the 'respect' from being whatever you need it to be at the time; I've heard something about the respects being fixed in advance (substance, place, time, state, that sort of thing) but I might have that wrong. Don't just pick the best reading and explain it — give me the whole set so I can tell them apart next time.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user had a pub argument about an ugly house. Their friend Tom used the Jain doctrine of *anekantavada* ("many-sidedness") to claim "everything is true in some respect." Tom then used this same logic to deflect losing an argument about football. The user suspects Tom is weaponizing a philosophical concept to avoid losing arguments.
      *   **Problem:** The user has encountered five conflicting interpretations of *anekantavada* (relative truth, ontological aspects, ethical rule for arguing, paraconsistent logic, "everyone's a bit right").
      *   **Goal:** A "menu" of interpretations. For each precise claim, categorize it (trivial, substantive-but-defensible, false), explain if it justifies Tom's move ("stop arguing about the house"), and address the constraint on "respect" (is it arbitrary or fixed?).
      *   **Constraint:** Do not just pick the best reading. Give the whole set so the user can distinguish them.
      *   **Tone:** Intellectual but accessible (pub philosophy level), rigorous but not dry, acknowledging the user's skepticism about Tom's usage.

  2.  **Deconstruct *Anekantavada*:**
      *   *Core Concept:* Reality is complex. No single statement captures the whole truth.
      *   *Key Tool:* *Syadvada* (the theory of conditioned predication) and the *Saptabhangi* (seven-fold predication).
      *   *Key Constraint:* *Naya* (standpoints/perspectives). These aren't arbitrary; they are grounded in substance (*dravya*), place (*ksetra*), time (*kala*), and state (*bhava*).
      *   *Ethical Dimension:* *Ahimsa* (non-violence). Dogmatism is intellectual violence.
      *   *Logical Dimension:* It challenges binary true/false but isn't necessarily "anything goes."

  3.  **Drafting the Menu (Iterative Process):**

      *   *Interpretation 1: The "Subjective Taste" Reading (Tom's Pub Version).*
          *   Claim: Truth depends on who is looking.
          *   Verdict: Trivial/False in this context.
          *   Tom's Use: Justifies "ugly is subjective."
          *   Critique: Makes truth too arbitrary.

      *   *Interpretation 2: The Ontological Reading (Mate who read a book).*
          *   Claim: Objects have infinite attributes. Predicates only capture some.
          *   Verdict: Substantive.
          *   Tom's Use: Doesn't really work for "my team lost."
          *   Critique: This is the classical metaphysical reading.

      *   *Interpretation 3: The Ethical/Epistemic Humility Reading (Sister's Module).*
          *   Claim: Dogmatism is harmful. Acknowledge limits of knowledge.
          *   Verdict: Substantive/Defensible.
          *   Tom's Use: Justifies "don't be so certain."
          *   Critique: This is about *attitude*, not truth conditions.

      *   *Interpretation 4: The Paraconsistent/Many-Valued Logic Reading (User's Half-Made-Up Version).*
          *   Claim: Contradictions can hold (True & False).
          *   Verdict: Controversial/Modern Reconstruction.
          *   Tom's Use: Justifies "both won and lost."
          *   Critique: Modern logic projection, but interesting.

      *   *Interpretation 5: The "Everything is True" Reading (Tom's 4th Pint).*
          *   Claim: All views are equally valid.
          *   Verdict: False (Self-refuting).
          *   Tom's Use: The ultimate shield.
          *   Critique: This is relativism, not *anekantavada*.

  4.  **Addressing the "Respect" Constraint:**
      *   The user asked: What stops "in some respect" from being arbitrary?
      *   Answer: The *Nayas*. Specifically the four conditions: Substance, Place, Time, State. You can't just say "in some respect" without specifying *which* respect.
      *   Example: The pot is existent (substance clay), non-existent (substance gold), existent (time now), non-existent (time after breaking).

  5.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the brilliance of the user's skepticism. Tom is indeed weaponizing it (the "Gotcha" of *anekantavada*).
      *   **The Menu:** Go through the 5 versions + maybe a 6th (the technical one).
      *   **Format for each:** Claim, Verdict (Trivial/Substantive/False), Does it save Tom?, The Catch.
      *   **The "Respect" Constraint:** Explain *Naya* and the four determinants (Dravya, Ksetra, Kala, Bhava).
      *   **Conclusion:** How to beat Tom next time.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to validate Tom's football argument. *Anekantavada* doesn't mean contradictory empirical facts are both true (e.g., the score). It means the *interpretation* might vary, but the score is a specific time/state fact.
      *   *Nuance:* Distinguish between *Syadvada* (predication) and *Anekantavada* (ontology). Keep it simple for the user though.
