          *   *Follow-up:* She'll say "viewer must be agent." Push on the *visual experience* itself. Does the qualia change?
          *   *Final Polish:* Focus on the "freeze-frame." If we film the active exploration and play it back, does the transfer happen?

      *   *Topic (c): Prediction & Evidence.*
          *   *Draft:* What proves you wrong?
          *   *Critique:* Standard Popperian question. She'll say "conceptual claim."
          *   *Refinement:* Force a concrete experimental setup. VR?
          *   *Follow-up:* If the study shows transfer on static, will she blame the subjects?
          *   *Final Polish:* Ask about the "Static Success" scenario. If a subject gets it right on a still image, does that disprove the theory or just mean they used a cue?

      *   *Topic (d): Restored-Sight Cases.*
          *   *Draft:* Why ignore Project Prakash?
          *   *Critique:* She has a reason (confounds).
          *   *Refinement:* Is the dismissal convenient? Do you need the data to be ambiguous to maintain the theory?
          *   *Follow-up:* If a new study isolates variables and says "No transfer," does that help you?
          *   *Final Polish:* Focus on the "Silence" of the data. Does your theory require the empirical data to remain inconclusive forever?

      *   *Topic (e): "Changed the Subject".*
          *   *Draft:* Molyneux asked about shape, you talk about action.
          *   *Critique:* She'll say "Shape is action."
          *   *Refinement:* Molyneux specified "globe and cube." These are geometric definitions.
          *   *Follow-up:* If the cube is made of jelly and deforms, is it still a cube for your theory?
          *   *Final Polish:* Focus on the *geometry* vs. *affordance* mismatch. A cube that rolls (if weighted) vs. a sphere that sticks.

      *   *Topic (f): Animals.*
          *   *Draft:* Do animals do this?
          *   *Critique:* Hard to test.
          *   *Refinement:* If animals show transfer without "conceptual" shape, does that support you?
          *   *Follow-up:* If animals *fail* dynamic tasks, what then?
          *   *Final Polish:* Focus on the "Language" confound. Animals can't be asked "Which is the cube?"

      *   *Topic (g) & (h): Filling the count (need 9-11).*
          *   Need to expand on the "Active" definition and the "Phenomenology."
          *   Add a question on the *experience* of the newly sighted.
          *   Add a question on the *time* factor (how long to learn the visual affordance).

  4.  **Refining and Polishing (Self-Correction against constraints):**
      *   *Check:* Did I make them concrete? (Yes, focusing on cubes, spheres, VR, eye movements).
