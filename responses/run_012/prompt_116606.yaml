  2.  **Deconstruct the Philosophy (Advaita/Schrödinger):**
      *   *One Mind:* There is only one Subject (Atman/Brahman). Individual minds are appearances.
      *   *Solipsism:* Advaita denies solipsism because there is no "other" to exclude, but also no "self" to privilege. It's non-dual, not single-ego.
      *   *Avidya (Ignorance):* Who is ignorant? The ego/jiva is the product of ignorance, so asking "who is ignorant" is like asking "who is the son of the barren woman." It's a category error.
      *   *Two Truths:* Vyavaharika (empirical/everyday) vs. Paramarthika (absolute). You can wash dishes empirically while knowing absolutely there are no dishes.
      *   *Deep Sleep:* In deep sleep, duality collapses. No objects, no subject-object split.
      *   *Rope/Snake:* Mistaking the real (rope/consciousness) for the unreal (snake/world).

  3.  **Drafting - Section by Section:**

