answer: |-
  **THE WITNESS**
  **EDITOR'S NOTE**
  Welcome to the spring issue. We remind readers that *The Witness* is not responsible for any dissolution of personal identity occurring during reading. Please hydrate.

  **ASK THE WITNESS**

  **Dear Maya,**
  If consciousness is truly singular, as your last column suggested, isn't this just solipsism with extra steps? If I'm the only one who exists, why should I bother being kind to anyone? It sounds like a license to be selfish.
  *— Alone in Crowd*

  **Dear Alone,**
  Solipsism assumes there is a "you" to be privileged against an "other." But the arithmetic of consciousness doesn't work that way. There is no second thing to exclude. When you strike another, you are simply bruising your own hand without realizing it. Compassion isn't a duty you owe to strangers; it is basic hygiene for the One. You care for them because there is literally no one else to care for. Rest easy.
  *— Maya*

  **Dear Maya,**
  I'm struggling with the mechanics here. If the true Self is awareness and bliss, then whose confusion is my confusion? Who exactly is ignorant? And when I'm in deep sleep and the world collapses, where does the "one" go? It feels like the doctrine is describing the problem instead of solving it.
  *— Puzzled in Pune*

  **Dear Puzzled,**
  You are looking for the owner of a shadow. Consider the rope mistaken for a snake in the dim light. The snake appears, frightens you, and vanishes when the light comes. Was the snake ever real? No. Did it frighten you? Yes. The ignorance belongs to the one who asks the question. In deep sleep, there is no plurality, no time, and no you to wonder where it went. You are simply what remains when the questioner disappears. Don't worry your head over who is dreaming; just wake up.
  *— Maya*

  **Dear Maya,**
  I've embraced the non-dual view, but now I'm stuck on chores. My roommate didn't do the dishes. Empirically, I'm annoyed. Absolutely, we are one. So if I wash them, is that generosity or just self-care? Also, is she real enough to owe me money? I can't tell if the difference was ever real.
  *— Clean Living*

  **Dear Clean,**
  This is the beauty of the two truths. On the empirical level, wash the dish. The soap is wet, the grease is sticky, and the roommate is a distinct agent who owes you twenty dollars. On the absolute level, there is no dish, no grease, and no roommate. You can collect the money while knowing no transaction occurred. Generosity and self-care are the same gesture seen from different angles. Something quiet has been lost here, yes—the friction of separation—but isn't the smoothness worth it? Let the hands move. The Witness does not scrub.
  *— Maya*

  **EDITOR'S NOTE**
  Due to overwhelming response, we have merged the Letters Desk with the Answers Desk. It turns out they were always the same department.
