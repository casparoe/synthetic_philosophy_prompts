answer: |-
  You have identified the central fracture in archaeological theory. You aren't missing a trick; you are staring at the limit of the method. The frustration you feel is the friction between **material constraints** and **semantic freedom**.

  Here is the conceptual breakdown of what is happening, why the gap exists, and the answer to your sharp question.

  ### 1. The Inference and the Gap
  The inference your classmates are making is **abductive** (inference to the best explanation), but they are skipping the **bridge law**.

  In science, to move from Data (A) to Theory (B), you need a bridge law (If A, then probably B) established by independent testing. In archaeology, we have **Middle-Range Theory** (Binford's term): linking static material remains to dynamic past behavior.
  *   **Function:** We have bridge laws for function. If there is edge damage, there was cutting. If there is heat shock, there was fire. These are physical causality chains.
  *   **Meaning:** There are no universal bridge laws for meaning. A red pot can mean "blood," "royalty," "danger," or "clan A." The physical properties of the pot do not causally determine the semantic content.

  **The Gap:** Material culture is **polysemous**. It can hold multiple meanings simultaneously or sequentially. The object is the *signifier*; the belief is the *signified*. The signifier survives; the signified evaporates. You can reconstruct the *act* of signifying (burying the balls), but not the *content* of the sign (what the balls signified).

  ### 2. Function vs. Meaning (The Tractability Problem)
  You asked why you can be confident they had a *rule* but not what the rule *said*.

  *   **Function is constrained by physics.** A stone ball cannot cut wood. Its function is limited by its material properties. This narrows the hypothesis space significantly.
  *   **Meaning is constrained only by culture.** A stone ball can represent a god, an ancestor, a vote, a debt, or a game piece. The material properties do not limit the *idea*.

  You are confident they had a rule because the **pattern** (40 identical balls, buried together, under a floor) requires coordinated behavior. Coordination implies social agreement (a rule). But the *content* of that agreement is not encoded in the stone. It is encoded in the minds of the actors, which are gone.

  ### 3. The Sharp Question: Underdetermination or In Principle?
  This is the crux. Is the gap just "we need more data" (underdetermination) or "data of this type cannot answer this" (in principle)?

  **It is stronger than underdetermination. It is in-principle opacity.**

  If you found a text that said "These balls represent the 40 days of mourning," the gap would close. But without a semantic key (language, iconography with known referents, ethnographic analogy), material alone cannot distinguish between **functional equivalence classes**.

  *   **Scenario A:** Balls are sacred idols.
  *   **Scenario B:** Balls are game pieces stored for the afterlife.
  *   **Scenario C:** Balls are a standardized currency buried as wealth.

  Physically, these three scenarios can result in the *exact same deposit*. Even if you find wear, you can say "ritual handling." Even if you find no wear, you can say "new ritual objects." The hypotheses are **empirically equivalent** regarding the material record.

  Therefore, the professor is right: You cannot read beliefs off objects because beliefs are not material properties. They are relational properties between an object and a mind.

  ### 4. Why "Ritual" is the Landing Spot
  "Ritual" is the **residual category** of archaeology. It is the "God of the Gaps."

  When an object violates economic or utilitarian expectations (e.g., burying valuable labor time under a floor where no one can see it), archaeologists label it "ritual."
  *   **Is it a real inference?** Sometimes. If the behavior is costly and non-utilitarian, it signals *social* or *cosmological* investment.
  *   **Is it a parking spot?** Mostly. It functions as a placeholder for "we know this mattered, but we don't know why."

  **Does piling up objects narrow the gap?**
  No. It narrows the gap on **scale**, not **meaning**.
  *   1 ball = individual act.
  *   40 balls = collective labor, standardized production, social coordination.
  *   **What it tells you:** The *intensity* of the belief system.
  *   **What it doesn't tell you:** The *theology* of the belief system.

  Piling up objects confirms the *institution* (there was a rule enforced enough to make 40 balls) but not the *belief* (what the balls meant).

  ### 5. Belief as Disposition (The Behaviorist Turn)
  You asked: *If a belief is just a disposition to behave, does the gap close?*

  **Yes, but it changes the subject.**
  If you define belief pragmatically (following Bourdieu or Practice Theory), then "belief" *is* the habit of burying the balls. You don't need to know what they thought about the balls; the fact that they buried them *is* the belief in action.

  *   **The Gap Closes:** Because you can observe the practice. You can say, "They believed in the necessity of floor deposition."
  *   **The Cost:** You stop doing intellectual history. You stop trying to reconstruct their "worldview" or "mythology." You only reconstruct their "habitus" (their ingrained habits).

  Most seminars want the "worldview" (the mental proposition). The professor is warning you that you can't have that. The behaviorist approach lets you talk about belief, but only as *action*, not as *thought*.

  ### 6. The Honest Thing to Say About the Balls
  If you want to be methodologically honest, you must separate **Material Consequences** from **Semantic Content**.

  **What you CAN say:**
  1.  **Labor Investment:** X hours were spent grinding these. This implies surplus energy and specialized skill.
  2.  **Standardization:** They are identical. This implies a template or a strict rule of production.
  3.  **Depositional Context:** They were hidden, not displayed. This implies exclusivity or a "one-way" transaction (giving to the earth/ancestors, not circulating among humans).
  4.  **Social Coordination:** 40 identical items imply a group agreement, not a whim.

  **What you CANNOT say:**
  1.  They are "ritual" (unless you define ritual strictly as "non-utilitarian deposition").
  2.  They represent "ancestors," "gods," or "votes."
  3.  They were "sacred" (unless you define sacred as "removed from circulation").

  **The Verdict:**
  The gap is real. It is not a lack of data; it is a category mismatch. Matter does not contain meaning; minds impose meaning on matter. When the minds vanish, the meaning vanishes, leaving only the shadow of the *action* that the meaning caused.

  Your classmates are engaging in **just-so storytelling** disguised as inference. They are filling the semantic void with plausible narratives. The professor is trying to teach you **epistemic humility**. The honest answer is: *"We can reconstruct the practice, but the proposition is lost."*
