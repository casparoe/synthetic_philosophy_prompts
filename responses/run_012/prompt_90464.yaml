      *   **Specific Example:** 40 polished stone balls in a pit, no wear, identical. Class jumps to "ritual," "cache," "game pieces." Counter-arguments (e.g., "no wear") are dismissed with ad hoc saves ("made but never used").
      *   **The User's Question:**
