answer: |-
  Here is the diagnosis of your intuitions, the principle that best captures them, the predictions that principle makes, and the costs you must pay to hold it.

  ### 1. The Principle
  You do not have a single principle; you have a hybrid of two. Your intuitions switch between **Naturalism** (for living things and physical solids) and **Functional Intentionalism** (for artifacts and complex systems). To make your verdicts consistent, you need a disjunctive rule.

  **The Principle of Cohesive or Functional Unity:**
  Several things compose one thing if and only if **either**:
  1.  **Natural Cohesion:** The parts are bound by internal physical forces stronger than mere gravity or contact, creating a distinct boundary (e.g., molecular bonds in a rock, biological integration in a cat).
      *   *Forced by:* The Rock (static, solid) vs. The Sand Pile (loose, gravity-bound).
  2.  **Functional Process:** The parts participate in a self-sustaining cycle or coordinated activity that maintains the entity's structure against entropy (e.g., metabolism, fluid dynamics, swarm logic).
      *   *Forced by:* The Candle Flame (matter turnover) vs. The Stacked Bricks (static, no interaction).
  3.  **Intentional Assembly:** If neither 1 nor 2 applies, the parts compose a thing only if an agent arranged them for a specific function, and the arrangement is complete.
      *   *Forced by:* The Assembled Bicycle (yes) vs. The Disassembled Bicycle (no) vs. The Furniture Arrangement (no function, just placement).

  **Constraint on All Three:** The boundaries of the resulting object must be non-arbitrary.
  *   *Forced by:* The Whole Cat (yes) vs. The Western Half of the Cat (no).

  ### 2. Predictions for New Cases
  Applying this hybrid principle to the cases you listed yields the following verdicts:

  *   **A virus:** **Borderline/No.** It lacks self-sustaining process outside a host (fails Functional Process) and is not an artifact. It falls into the gap between your Natural and Functional clauses.
  *   **A river:** **Yes.** It meets Functional Process (continuous flow maintaining structure) but fails the Boundary Constraint (where does the river end and the bank begin?). Your verdict will likely flip-flop like the Cloud.
  *   **A traffic jam:** **No.** It is an accidental aggregation (fails Functional Process; cars aren't cooperating to *be* a jam).
  *   **A person in a coma:** **Yes.** Meets Natural Cohesion (biological binding) and Functional Process (metabolism continues).
  *   **Cells turning over:** **Yes.** Covered by Functional Process (the process maintains the structure despite matter replacement).
  *   **Two people carrying a piano:** **No.** Temporary cooperation, not a self-sustaining system. They remain two agents.
  *   **A puddle drying:** **Yes (while wet).** Liquid cohesion counts as Natural Cohesion, but as it fragments, it ceases to be one thing.
  *   **A fire spreading through a forest:** **Yes.** Meets Functional Process (chemical reaction sustaining itself) and is distinct from the fuel (like the Flame).
  *   **A queue:** **No.** Arbitrary collection of individuals. No internal binding or shared function beyond individual goals.
  *   **A country's economy:** **No.** Abstract system, no physical boundaries. Fits your "useful fiction" mood.
  *   **Distributed computation:** **Yes.** Meets Functional Process (logical unity maintains the task) despite spatial separation. This tests your intuition on the Shoe+Eiffel Tower; here, the *causal link* is the binding force, not proximity.

  ### 3. The Costs: Which Verdicts The Principle Cannot Have
  You asked for a straight answer on where your intuitions break your own rule. There are three specific failures.

  **1. The Statue and the Bronze (The Coincidence Problem)**
  *   **Your Verdict:** Two things in one place.
  *   **The Principle's Prediction:** One thing.
  *   **Why:** Your principle says the bronze parts compose an object (Natural Cohesion). It says the statue is an object (Intentional Assembly). Since they occupy the exact same space and consist of the exact same parts at the same time, your principle identifies them as the *same* object. To say they are *two* things requires a metaphysical commitment called "Constitution without Identity," which contradicts the logic of composition you used for the Rock and the Sand. You cannot have it both ways without adding a complex exception that undermines the rest of the rule.

  **2. The Whirlpool vs. The Hurricane (The Scale Problem)**
  *   **Your Verdict:** Whirlpool = No; Hurricane = Yes.
  *   **The Principle's Prediction:** Both Yes or Both No.
  *   **Why:** Both are fluid dynamic structures sustained by energy transfer (Functional Process). Both have vague boundaries (Boundary Constraint). Your principle cannot distinguish them. Your intuition here is likely driven by *scale* or *threat*, which are not metaphysical criteria. This is a pure inconsistency in your gut.

  **3. The Rock (The Static Problem)**
  *   **Your Verdict:** One thing.
  *   **Your Proposed Rule:** "Ongoing process."
  *   **The Principle's Fix:** I added "Natural Cohesion" to save this.
  *   **The Cost:** If you accept the Rock based on static bonds, you must explain why the Sand Pile (held by friction/gravity) doesn't count. The line between "molecular bond" and "friction" is physically continuous. You are drawing a sharp line on a spectrum. This is not a logical failure, but it is a "brute fact" acceptance: you are simply stipulating that some forces count and others don't.

  ### 4. Settled Matters vs. Live Disputes
  You asked what is settled and what is contested.

  **Settled:**
  *   **Nothing is settled.** There is no consensus in philosophy on the Special Composition Question.
  *   **The Difficulty:** It is settled that any answer you choose will have counter-intuitive consequences (like the Statue/Bronze problem or the Sand Pile problem).
  *   **The Terminology:** It is settled that "Universalism" (everything composes) and "Nihilism" (nothing composes) are the only logically clean positions, but both contradict common sense.

  **Live Disputes:**
  *   **The Sand Pile vs. The Swarm:** This is the central battleground. Your friend argues for consistency (both are collections); you argue for distinction (one is coordinated, one is not). Neither side can prove the other wrong because "coordination" is vague.
  *   **Coincident Objects:** Whether the Statue and Bronze are one thing or two is a major live dispute. Your intuition (two things) is a respected minority view, but it requires accepting that two objects can be in the same place at the same time, which many reject as impossible.
  *   **Artifacts:** Whether human intention can create metaphysical unity (the Bike) or merely conceptual unity (the Furniture) is unresolved. You are currently straddling the line.

  ### Summary of Your Position
  You are a **Moderate Functionalist**. You believe objects exist when parts work together to sustain a whole, or when humans intentionally make them work together.

  **Your Fatal Flaw:** You want the world to be objective (Rocks and Cats exist independently of us) but you also want human intention to matter (Statues and Bikes exist because we made them). These two commitments clash when the human-made thing is made of objective stuff (Statue/Bronze). You must either admit the Statue is just Bronze (giving up on Artifacts) or admit that the Sand Pile is an Object if we decide to call it one (giving up on Objectivity). You cannot keep your current distinction between the Sand Pile and the Statue without arbitrariness.
