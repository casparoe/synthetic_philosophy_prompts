      *   *Self-Correction on Claim 5:* This is the biggest error. Sen explicitly discussed the "preference restriction" solution and rejected it as intrusive. He preferred viewing rights as game forms or accepting the conflict as a basis for discussion. I need to make sure the user understands Sen didn't say "ignore the prude."
      *   *Self-Correction on Claim 6:* The engineering advice ("single owner") is actually a *dictatorship* in the social choice sense. The theorem says Liberal + Pareto is impossible. It doesn't say Dictatorship is the solution. In fact, Arrow says Dictatorship is the *only* way to satisfy his conditions, but Sen's theorem is different. The blog is conflating "impossible to satisfy everyone" with "therefore give up."

