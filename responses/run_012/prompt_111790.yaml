          *   Comparison cases (Human brains, corporations, thermostats, slime moulds, split-brain).
          *   The "Fission/Fusion" thought experiment (fluid colony membership).
          *   Distinctions to preserve (intentionality vs. covariance, POV vs. instrumentalism, coordination vs. cognition, mind vs. life).
          *   Biological constraints (local rules, stigmergy, no central controller, scaling effects).
          *   Meta-requirement: Non-triviality (must exclude thermostats/rocks).
