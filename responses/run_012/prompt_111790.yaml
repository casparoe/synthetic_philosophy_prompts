      *Actually, let's go with the **Unity vs. Vagueness** tension.* Minds seem to require a definite subject. Colonies are vague objects. You can't have both.

      *(Final Polish on the Reframing)*: The question "Is it a mind?" is a category error. The question should be "What kind of cognitive agency does it exhibit?"

  8.  **Final Review against constraints:**
