      *   If colonies are minds, and they lack the neural binding of brains, then either brains aren't unified (illusionism) or colonies are unified (which seems absurd).
      *   Better tension: **Robust Intentionality** vs. **Strict Naturalism**. If you want real "aboutness," you usually need a subject. If you only have distributed parts, you only have derived intentionality.
      *   *Best Tension:* **The Integration Requirement** vs. **The Fluidity Requirement**. To be a mind, you need to be a unified system. To be an ant colony, you need to be a fluid population. These pull in opposite directions.

  6.  **Refining the Output Structure:**
