prompt: |-
  I run a tiny research group — four people, three years of funding — trying to figure out whether the choice-based picture of welfare that underpins most of economics and, these days, a fair bit of AI training is actually tracking anything we care about. We're building a welfare score out of people's pairwise picks, and I keep worrying the elicitation itself manufactures the preference rather than reading it off. Everyone here already grants that choices can be mistaken, inconsistent, and shaped by how you ask, so don't relitigate that. My question is which open questions about what "preference" and "utility" are actually tracking matter most, and in what order, given I've got maybe three researcher-years to spend. One colleague says utility is just a convenient bookkeeping device over choices; another says it names a real mental quantity that choices only imperfectly reveal, and I honestly can't tell whether that's a verbal spat or the whole ballgame. Give me the defended agenda: for each question, why it's upstream of the others, whether it's tractable without collecting new empirical data, and what would move it up or down my list. And skip anything the field treats as settled unless you think it's secretly load-bearing and probably false.
reasoning: |-
