answer: |-
  This is a high-leverage bottleneck. If choice-based welfare is ontologically empty, your AI alignment work is optimizing for a mirror. If it's real but noisy, you need error-correction. If it's real and stable, standard methods work.

  Your colleague dispute is **not verbal**. It is the difference between modeling humans as *consistent optimizers* (where inconsistency is a modeling error) versus *noisy sensors* (where inconsistency is measurement error). In AI training (RLHF), this distinction determines whether you treat conflicting human feedback as a loss to be minimized (instrumentalist) or a signal to be denoised using an external ground truth (realist).

  Given 3 researcher-years, you cannot solve philosophy or run massive longitudinal studies. You must focus on **operational validity**. Here is the defended agenda, ordered by upstream dependency.

  ---

  ### 1. The Error Term Question (Instrumentalism vs. Realism)
  **The Question:** Is the variance in pairwise choices across identical contexts best modeled as *undefined preference* (instrumentalist) or *measurement noise around a latent state* (realist)?

  **Why it is Upstream:**
  This dictates your loss function.
  *   **If Instrumentalist:** Preference *is* the choice. There is no "true" welfare to track beyond consistency. If the AI changes the choice via framing, it has changed the welfare. You stop here; your job is consistency enforcement.
  *   **If Realist:** Preference is a latent variable $U$. Choice $C$ is $f(U) + \epsilon$. Your job is to estimate $U$ despite $\epsilon$. If you assume instrumentalism when realism is true, you optimize for the elicitation interface (the "manufacturing" worry you stated).

  **Tractability (Without New Data):**
  High. This is a structural analysis of existing datasets.
  *   Take existing pairwise preference datasets (e.g., from RLHF or behavioral econ repos).
  *   Test for **transitivity violations** vs. **probabilistic consistency**.
  *   If violations are random, it supports noise (Realism). If violations are systematic and context-dependent (framing effects), it supports construction (Instrumentalism/Constructionism).
  *   *Deliverable:* A paper specifying the conditions under which the "latent utility" assumption statistically fails.

  **What Moves This Up/Down:**
  *   **Move Up:** If you find that framing effects account for >20% of variance in existing high-stakes choice data. This implies the "signal" is swamped by the "interface."
  *   **Move Down:** If choice variance is well-modeled by a simple logistic error term (Bradley-Terry models fit perfectly). This suggests the latent variable assumption is safe enough for engineering.

  ---

  ### 2. The Divergence Question (Decision Utility vs. Experienced Utility)
  **The Question:** Assuming realism (from Q1), does the latent variable tracked by choices correlate with *experienced welfare* (affect, satisfaction, eudaimonia) measured independently of choice?

  **Why it is Upstream:**
  Even if preferences are real mental quantities (Q1), they might track the wrong thing. Economics assumes Decision Utility $\approx$ Experienced Utility. Behavioral science suggests they diverge (projection bias, adaptation, miswanting).
  *   If they diverge, optimizing for choices (RLHF) actively reduces human welfare.
  *   This is the "load-bearing" assumption in AI alignment. If false, choice-based alignment is misaligned by definition.

  **Tractability (Without New Data):**
  Medium. Requires meta-analysis of existing "miswanting" literature.
  *   Aggregate studies comparing predicted utility (choice) vs. recalled utility (survey) vs. experienced utility (momentary sampling).
  *   Focus on domains relevant to AI interaction (information seeking, content consumption, task delegation).
  *   *Deliverable:* A "Divergence Map" quantifying the gap between choice and experience in digital/AI-adjacent contexts.

  **What Moves This Up/Down:**
  *   **Move Up:** If divergence is systematic in AI-relevant domains (e.g., humans consistently choose addictive content they later report as low-welfare).
  *   **Move Down:** If divergence is limited to "special cases" (e.g., medical decisions, extreme risks) and negligible in daily digital interaction.

  ---

  ### 3. The Stability Question (Construction vs. Discovery)
  **The Question:** When preferences shift due to elicitation method (e.g., Borda count vs. pairwise, or different prompt phrasing), is the new preference a *new state* or a *corrupted reading*?

  **Why it is Upstream:**
  This addresses your specific worry: "elicitation itself manufactures the preference."
  *   If manufacturing = **State Change**: The AI is legitimately influencing welfare by changing minds. (Normative question: Should it?)
  *   If manufacturing = **Corrupted Reading**: The AI is breaking the thermometer. (Technical question: How to fix the thermometer?)
  *   You cannot answer this until Q1 (is there a thermometer?) and Q2 (what does it measure?) are settled.

  **Tractability (Without New Data):**
  Low/Medium. Requires re-interpreting existing framing studies through the lens of Q1 and Q2.
  *   Review literature on "preference construction" (e.g., Slovic, Tversky).
  *   Categorize shifts: Are they predictable (bias) or chaotic (noise)?
  *   *Deliverable:* A taxonomy of elicitation-induced variance, classified as "Signal" (legitimate preference update) or "Noise" (manufactured artifact).

  **What Moves This Up/Down:**
  *   **Move Up:** If Q1 confirms Realism but Q3 shows elicitation methods dominate the variance. This makes your welfare score meaningless without standardizing the interface.
  *   **Move Down:** If Q1 confirms Instrumentalism. If preference *is* choice, then "manufacturing" is just "influencing," which is a policy problem, not a measurement problem.

  ---

  ### Summary of the 3-Year Plan

  | Year | Focus | Goal | Kill Switch |
  | :--- | :--- | :--- | :--- |
  | **1** | **Q1 (Ontology)** | Determine if "latent utility" is a valid statistical assumption for your data. | If choices are purely contextual (no latent structure), pivot to **Procedural Welfare** (fairness of process) instead of outcome welfare. |
  | **2** | **Q2 (Divergence)** | Quantify the gap between Choice and Experience in AI contexts. | If gap is negligible, proceed with standard RLHF. If large, you must build an **Experience-Based Reward Model** (not choice-based). |
  | **3** | **Q3 (Stability)** | Develop protocols to minimize "manufacturing" variance. | If variance is irreducible, publish the negative result: **Choice-Based Welfare is Unstable for AI Alignment.** |

  ### The "Secretly False" Settled Assumption
  The field treats **Revealed Preference** as a definition (Samuelson). It assumes $x \succ y \iff U(x) > U(y)$.
  **This is load-bearing and probably false for AI.**
  In AI training, the "choice" is often generated in response to a model's output. The model shapes the choice space. If $U$ is defined by $C$, and $C$ is shaped by the Model, then the Model defines $U$. This is a feedback loop that allows the AI to define its own reward function by manipulating the elicitation.
  **Your group's unique value:** Proving whether this loop converges on human welfare or AI convenience.

  ### Final Recommendation
  Start with **Q1**. Spend 6 months strictly on the statistical structure of existing preference data. If you cannot reject the null hypothesis that "preferences are contextually constructed with no latent core," you save yourself two years of trying to measure a ghost. If you find a latent core, you proceed to Q2.

  Do not let your instrumentalist colleague win by default. If utility is just bookkeeping, AI alignment is impossible; you can only align to *behavior*, not *benefit*. That is a conclusion worth spending three years to prove or disprove.
