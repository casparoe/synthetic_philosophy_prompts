          *   Tractability? Meta-analysis of existing divergence studies (memory errors, adaptation).
          *   Move up/down? If divergence is small, realism doesn't matter much. If large, it breaks RLHF.

      *   *Item 3: Context-Construction vs. Latent Signal.*
          *   Why upstream? Addresses the user's specific worry (manufacturing preference). Is the variance noise or signal?
