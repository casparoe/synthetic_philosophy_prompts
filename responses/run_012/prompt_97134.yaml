      *   *Why it matters for AI:* If we train AI on human feedback (RLHF), are we optimizing for what people *say* they want (constructed in the moment) or what *benefits* them (latent)? If it's the former, AI might manipulate elicitation. If it's the latter, we need a ground truth beyond choices.
      *   *Verbal or Substantive?* It's substantive because it dictates *what* you measure and *how* you validate. If it's bookkeeping, consistency is the only metric. If it's real, prediction of future well-being (independent of choice) is the metric.

