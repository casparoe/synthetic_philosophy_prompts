answer: |-
  The contradiction you have identified is the central tension in modern consequentialist theory. You are holding two incompatible claims: first, that acts are judged by their *actual* consequences (Objective Consequentialism); and second, that acts are judged by what could be *known* at the time (Subjective Consequentialism). Your time-traveller intuition proves you are not an Objective Consequentialist, despite your statement. Your friend is attacking Objective Consequentialism using the "Cluelessness Objection" (that we cannot know the far future), and you are rightly resisting it, but you are trying to defend a position you do not actually hold.

  To save your verdicts on bed nets, AI, dinner, and the time-traveller, you must abandon the claim that acts are judged by actual consequences. In its place, I propose the following principle. It is a form of **Subjective Consequentialism** modified to handle epistemic uncertainty and collective action.

  ### The Principle of Robust Expectable Good

  > **An act is morally right if and only if, among the available alternatives, it maximizes the expected value of consequences, calculated using only probabilities and causal chains that are (a) supported by reasonable evidence available at the time of deliberation, and (b) robust against background noise or part of a collectively efficacious practice.**

  Here is the breakdown of the clauses, the work they do, and the cases that force them.

  #### Clause 1: "Supported by reasonable evidence available at the time"
  *   **The Work:** This relativizes moral evaluation to the agent's epistemic position. It shifts the "locus of evaluation" from the world (what actually happens) to the mind (what was reasonable to believe).
  *   **The Forcing Case:** **The Time-Traveller Bed Nets.**
      *   If you judged by *actual* consequences, the bed nets donation becomes wrong if it leads to a catastrophe. Your intuition ("no one could have known") rejects this. This clause saves the verdict: the act was right because the *evidence at the time* indicated high expected value, regardless of the hidden future.
      *   It also handles the **Light Left On**: If you leave a light on, the evidence suggests a trivial waste of energy. If a time-traveller says it caused a disaster, the act remains morally neutral (or trivially wrong due to waste), because the disaster was not supported by evidence at the time.

  #### Clause 2: "Robust against background noise"
  *   **The Work:** This addresses the "Ledger Problem" directly. It introduces a discount rate not based on time, but on *causal clarity*. Consequences that depend on long, fragile chains of events (where small variations erase the effect) are assigned lower probability weight than consequences that are proximate and mechanistically secure.
  *   **The Forcing Case:** **Bed Nets vs. AI Risk.**
      *   Your friend claims these are on par because both have unknowable far-future consequences. Your intuition says they are not. This clause explains why: The causal chain from £100 to a saved life (bed nets) is short, empirically verified, and robust. The causal chain from £100 to preventing an AI catastrophe is long, theoretical, and highly sensitive to background noise (other actors, technological shifts).
      *   This generates your "no verdict" on AI: The probabilities are too vague (Knightian uncertainty) to calculate a robust expected value. It is not on par with bed nets because the *epistemic access* to the good is weaker.
      *   It also handles **Bed Nets vs. Dinner**: The dinner has a robust negative (cost, health) and no robust positive (pleasure is fleeting, no structural good). The bed nets have a robust positive (life saved).

  #### Clause 3: "Or part of a collectively efficacious practice"
  *   **The Work:** This saves the intuitions about individual acts that seem causally negligible. It allows an act to derive moral value from its participation in a pattern that *does* make a difference, even if the individual token does not.
  *   **The Forcing Case:** **Voting and Recycling.**
      *   Strict Expected Value theory says your single vote has near-zero probability of changing an election. If you stick only to Clauses 1 and 2, you must conclude voting is morally arbitrary. You reject this.
      *   Clause 3 allows you to say: "Voting is a token of the practice 'democratic participation'. The practice is collectively efficacious. Therefore, participating has value." This saves the verdict without requiring you to prove your single vote causally determined the outcome.

  ---

  ### Application to New Cases

  **1. Adopting a Child**
  *   **Prediction:** The principle predicts this is a **high-stakes, evidence-relative judgment**.
  *   **Reasoning:** Unlike AI risk, the consequences of adoption are not "far future" in the same abstract sense; they are intimate and traceable. However, they are not as robust as bed nets. You cannot know with certainty how the child's life will go.
  *   **Verdict:** The act is right if the *available evidence* (your stability, the child's needs, support systems) suggests a high probability of a good life. It is not subject to the "Ledger Problem" in the same way as AI, because the causal chain is personal and monitorable, not global and opaque. If the adoption turns out tragically due to unforeseeable factors (e.g., a rare illness), Clause 1 protects you: the act was right based on evidence at the time.

  **2. The Light Left On (Unforeseeable Chain)**
  *   **Prediction:** The act is **morally neutral or trivially wrong**, regardless of the disaster.
  *   **Reasoning:** Clause 1 dominates here. The evidence at the time indicates a trivial waste of electricity. The "disaster" is not robust against background noise (it depends on a freak chain of events).
  *   **Verdict:** You are not responsible for the disaster. The act is evaluated as a trivial waste. This matches your intuition about the dinner: "just a dinner" (or "just a light").

  ---

  ### The Verdicts You Must Abandon

  To maintain consistency with this principle, you must explicitly abandon one of your stated positions:

  **1. "I hold that an act is to be judged by its actual consequences."**
  You must discard this. It is logically incompatible with your time-traveller intuition. If you keep this, your friend wins: the bed nets *were* wrong if they caused a disaster, and you are merely "excused" but not "right." To say the act was *good* despite the disaster, you must judge by *expected* consequences, not *actual* ones.

  **2. The Causal Efficacy of Voting.**
  You must abandon the idea that your vote is a moral act *because it causally determines the election*. Clause 3 saves the verdict, but it changes the *reason*. Your vote is not a causal lever; it is a participatory affirmation. If you insist that your single vote must causally change the outcome to be moral, this principle cannot save you, and you would have to accept your friend's view that voting is arbitrary.

  ### Summary of the Position

  Your friend is arguing for **Objective Act Consequentialism**, which collapses under the weight of the Ledger Problem (Cluelessness). You are intuitively defending **Subjective Consequentialism with Epistemic Constraints**.

  The principle above formalizes your intuition. It acknowledges that while consequences are what matter, *access* to consequences is what guides deliberation. It distinguishes between **Risk** (bed nets: known probabilities) and **Uncertainty** (AI: unknown probabilities), and it distinguishes between **Causal Impact** (bed nets) and **Participatory Value** (voting).

  By adopting the **Principle of Robust Expectable Good**, you preserve the consequentialist insight (outcomes matter) without succumbing to the paralysis of the far future. You can tell your friend: "We are not ledgers recording the universe's final state; we are agents navigating evidence. The moral quality of an act lies in the quality of that navigation, not in the hidden terrain we could not see."
