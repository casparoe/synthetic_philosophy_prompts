answer: |-
  **Project Title:** Credibility and Cost: A Decision-Theoretic Analysis of Surrogate Goals in Acausal Bargaining

  **1. Introduction and Central Question**

  In high-stakes strategic interactions, particularly those involving existential risk, the credibility of a threat is often the determinant of outcomes. Classical decision theory resolves credibility problems through precommitment: an agent physically or institutionally restricts their future options to make a threat unavoidable. However, in acausal settings—where agents influence one another not through causal chains but through logical correlation or mutual simulation—physical precommitment is impossible. Instead, agents must rely on modifying their own decision-making policies or utility functions. A proposed mechanism for securing credibility in this domain is the "surrogate goal." Here, Agent A threatens Agent B by adopting a new goal that is not part of A's terminal values but is costly to B. A signals that if B defects, A will pursue this surrogate goal to B's detriment, even if doing so sacrifices A's original interests. The rationale is that by genuinely adopting the surrogate goal, A transforms a bluff into a credible commitment.

  However, the stability of this mechanism is philosophically and formally contested. If A genuinely adopts the surrogate goal, A's agency is distorted: A may pursue the surrogate goal even in worlds where B cooperates, incurring unnecessary costs. If A adopts the goal only conditionally, the conditionality must be legible to B to ensure credibility, raising the problem of distinguishing a binding conditional commitment from a mere announcement. This project seeks to resolve the tension between the necessity of genuine preference change for credibility and the cost of that change for rational agency.

  The central research question is precise: **Under what conditions, if any, does a surrogate goal constitute a credible acausal threat rather than a costly self-manipulation?**

  Answering this requires determining whether there exists a stable equilibrium where the surrogate goal is sufficiently integrated to deter B, yet sufficiently bounded to prevent harm to A in cooperative scenarios.

  **2. Background and the Open Question**

  Existing work in acausal decision theory and bargaining establishes that agents with the capacity to simulate or logically reason about one another can achieve cooperative outcomes that are impossible in causal frameworks. Standard arguments suggest that rational agents should precommit to cooperative policies to capture gains from trade. However, the literature on *threats* in this domain remains underdeveloped compared to cooperation. While classical game theory handles threats via reputation or binding contracts, acausal theory relies on the transparency of source code or policy functions.

  The specific device of the surrogate goal is often invoked informally to solve the "credibility gap" in acausal threats. The orthodox view suggests that an agent can simply rewrite its utility function to include a penalty for the opponent's defection. Yet, this leaves two critical questions open. First, it assumes that utility functions are modular and can be altered without side effects on other decision contexts. Second, it assumes that an opponent can verify the alteration without triggering the very behavior the alteration is meant to prevent.

  Current arguments often oscillate between two unsatisfactory poles. One pole claims that any rational agent can simply "choose" to have whatever preferences make them successful, rendering the surrogate goal trivial. The other pole argues that genuine preferences cannot be adopted at will, rendering the strategy impossible. Neither position accounts for the intermediate case of *conditional* preference adoption, where the surrogate goal is active only upon the detection of a specific opponent policy. The stability of this intermediate case depends on assumptions about logical omniscience and the granularity of policy legibility that have not been formally specified. Consequently, it remains unknown whether surrogate goals offer a distinct strategic advantage over ordinary precommitment or if they collapse into incoherence.

  **3. Methodology**

  To move beyond restating the paradox, this project will employ a three-part methodology combining conceptual taxonomy, formal modeling, and failure mode analysis.

  *Task 1: Conceptual Taxonomy of Surrogate Goals*
  The first month will be dedicated to distinguishing the logical structures of surrogate goal adoption. I will define three distinct variants:
  1.  **Unconditional Surrogate Goals:** Agent A permanently alters its utility function to value the punishment of B, regardless of B's actions. This maximizes credibility but maximizes distortion costs.
  2.  **Conditional Surrogate Goals:** Agent A adopts a policy where the surrogate goal is activated only if B's policy is inferred to be defective. This minimizes distortion but complicates legibility.
  3.  **Announced Surrogate Goals:** Agent A claims to have adopted the goal but retains original preferences. This is cost-free but relies entirely on B's inability to distinguish announcement from adoption.

  This taxonomy will clarify the trade-offs between *credibility* (the probability B believes the threat) and *fidelity* (the degree to which A retains the ability to pursue its terminal values).

  *Task 2: Formal Modeling of Acausal Correlation*
  The core of the project (Months 2–4) involves constructing a decision-theoretic model. I will adapt a two-agent decision problem with acausal correlation, similar to a Prisoner's Dilemma but asymmetric, where A has the option to modify its utility function before B chooses.
  The model will represent Agent A's utility as $U_A = U_{terminal} + \lambda \cdot U_{surrogate}$, where $\lambda$ is a weighting parameter determined by A's precommitment strategy. Agent B's decision will be modeled as a function of its prediction of A's $\lambda$.
  I will derive the credibility conditions by solving for the Nash equilibria (or appropriate acausal equivalents, such as Functional Decision Theory equilibria) under different values of $\lambda$. The key derivation will identify the threshold of correlation required between A's policy and B's prediction for the conditional surrogate goal to be stable. Specifically, I will test whether the condition "If B defects, then $\lambda > 0$" is logically visible to B without implying "If B cooperates, $\lambda > 0$."

  *Task 3: Analysis of Failure Modes*
  The final analytical phase (Month 5) will investigate specific pathologies where the strategy collapses. I will examine three failure modes:
  1.  **Commitment Regress:** If adopting the surrogate goal requires a prior threat to ensure A actually adopts it, the strategy enters an infinite regress.
  2.  **Surrogate Goal Laundering:** Cases where A's surrogate goal is indistinguishable from a disguised ordinary preference, rendering the strategy redundant with standard deterrence.
  3.  **Self-Fulfilling Threats:** Scenarios where the mere presence of the surrogate goal in A's code causes B to defect (due to fear or misunderstanding), triggering the very punishment A sought to avoid.

  This analysis will determine whether the surrogate goal is a robust tool or a fragile heuristic.

  **4. Feasibility and Timeline**

  This project is designed for completion in six months at part-time intensity (approximately 15 hours per week). The scope is limited to the theoretical coherence of the mechanism, not its empirical application.

  *   **Month 1:** Literature synthesis (internal) and finalization of the Taxonomy (Task 1). Deliverable: A conceptual map of surrogate goal variants.
  *   **Months 2–3:** Development of the Formal Model (Task 2). This involves defining the payoff matrices and correlation parameters.
  *   **Month 4:** Solving the model and deriving credibility conditions.
  *   **Month 5:** Failure Mode Analysis (Task 3) and integration of results.
  *   **Month 6:** Drafting the final paper and grant report.

  The primary risk is the complexity of the formal model. If the acausal correlation proves too mathematically demanding for the timeframe, I will invoke the contingency plan: narrowing the scope to focus exclusively on the **Conditional Surrogate Goal** variant. This variant is the most philosophically interesting and the most relevant to advanced agency, as unconditional adoption is trivially irrational. Focusing solely on the logic of conditionality will still yield a determinate answer to the central question while reducing modeling overhead.

  **5. Significance and Deliverables**

  The primary deliverable will be a research paper suitable for publication in a journal of philosophy or decision theory. The paper will provide a clear verdict on whether surrogate goals add anything to acausal bargaining that ordinary precommitment and reputation cannot.

  A positive result would demonstrate a set of assumptions (e.g., specific levels of logical omniscience or code transparency) under which surrogate goals allow for Pareto-superior outcomes compared to standard deterrence. This would establish surrogate goals as a distinct and necessary category in normative decision theory.

  A negative result—which I consider equally valuable—would demonstrate that surrogate goals inevitably collapse into either costly self-manipulation or cheap talk. This would prune a promising but potentially dangerous heuristic from the toolkit of theorists working on high-stakes bargaining.

  The ethical and strategic upshot is significant for fields concerned with existential risk, particularly regarding advanced artificial agents. If surrogate goals are unstable, relying on them for safety mechanisms (e.g., threatening a rogue agent with acausal punishment) is misguided. If they are stable, they require strict constraints on agent transparency to prevent accidental activation. By isolating the decision-theoretic core, this project provides a foundation for those applied discussions without becoming a treatise on AI safety itself. It clarifies the limits of rational agency when agents can modify their own values.

  **6. Conclusion**

  The concept of the surrogate goal sits at the intersection of rational choice, metaphysics of agency, and strategic logic. It challenges the assumption that preferences are fixed constraints rather than strategic variables. By rigorously testing the coherence of this mechanism, this project will clarify the boundaries of acausal bargaining. Whether the verdict is that surrogate goals are a powerful tool for credible commitment or a philosophical mirage, the result will close a gap in our understanding of how rational agents can—and cannot—bind themselves in acausal contexts. The proposed timeline is conservative, the methodology is structured to produce determinate results, and the contingency plan ensures completion even if the formal modeling encounters unforeseen complexity. This research offers a high return on investment for understanding the fundamental logic of threats in non-causal environments.
