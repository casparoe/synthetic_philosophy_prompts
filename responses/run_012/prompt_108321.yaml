answer: |-
  Here is the full design for the seminar session, written out as a continuous guide for you to follow.

  You will need to gather a few physical materials before class starts. Get an opaque bag or urn and fill it with ten colored balls or tokens, specifically three red, three blue, and four green. You also need a supply of poker chips or distinct pieces of candy for each pair, ideally about fifty units per pair so they do not run out during betting. Print out simple score sheets for each pair that have columns for the Claim, the Agent's Buy Price, the Agent's Sell Price, the Bookie's Choice, and the Final Payout. The core of the activity relies on a single random draw from the urn at the end of each round, which settles all bets. The claims they will be betting on are fixed for everyone to keep the logic comparable. There are three claims on the sheet. Claim One is that the ball drawn is Red. Claim Two is that the ball drawn is Blue. Claim Three is that the ball drawn is Red or Blue. These claims are logically related because the event in Claim Three is the disjunction of the events in Claim One and Claim Two, and since Red and Blue are mutually exclusive in your urn, the probability of Claim Three should equal the sum of the probabilities of Claim One and Claim Two. This specific logical structure is what allows the Dutch Book to be constructed if the prices are set incorrectly.

  For the first round, which should take up the first thirty minutes of your ninety-minute session, divide the fourteen students into seven pairs. In each pair, assign one student as the Agent and the other as the Bookie. Tell them they have ten minutes to set up and then twenty minutes to trade, but in practice, you will likely need to circulate and keep the pace moving. The Agent's job is to post a single price for each of the three claims. This price represents both the amount they are willing to pay to buy a bet that pays one chip if the claim is true, and the amount they demand to sell that same bet. For example, if the Agent posts a price of point four chips for Claim One, the Bookie can either force the Agent to buy a bet for point four chips that pays one chip if Red is drawn, or force the Agent to sell a bet for point four chips that pays one chip if Red is drawn. The Bookie's goal is to select a combination of bets across the three claims that guarantees they, the Bookie, end up with more chips than they started with, regardless of which ball is drawn. The Agent's goal is to set prices that prevent this. Tell the students that at the end of the round, you will draw a ball, all bets will be settled in chips, and the student with the most chips wins a small prize. This establishes linear utility for Round One, where one chip is always worth one unit of value. As they play, walk around and listen. If an Agent sets the price for Red at point three, Blue at point three, and Red or Blue at point five, a savvy Bookie should see that buying the disjunction bet and selling the two individual bets locks in a profit. If the Bookie buys the Red or Blue bet for point five and sells the Red bet for point three and the Blue bet for point three, the Bookie pays out point five but collects point six upfront. If Red comes up, the Bookie pays one on the Red bet but collects one on the disjunction bet. If Blue comes up, the Bookie pays one on the Blue bet but collects one on the disjunction bet. If Green comes up, nothing pays out, but the Bookie keeps the upfront difference. The Bookie makes profit in every state. Your job is to let them feel the sting of this loss without explaining it yet.

  Round Two begins after you collect the chips and reset the pairs. You can keep the same roles or swap them, though keeping them allows the Bookie to refine their strategy. This round lasts another thirty minutes. The physical setup is identical, but you change the valuation rule. Tell the Agents that chips now have diminishing marginal value. Give them a concrete conversion curve for the end-of-class prize. For example, tell them that ten chips earn a candy bar, but twenty chips only earns a slightly better candy bar, and thirty chips earns the same prize as twenty. Or simply instruct them to act as if they are risk-averse, meaning they value a guaranteed five chips more than a fifty percent chance at ten chips, even though the expected chip count is the same. The Agents must still post single buy and sell prices for the three claims, but they should set these prices based on this new non-linear value rather than just the raw probability. The Bookie's goal remains the same: find a combination of bets that guarantees a net gain in chips. What will likely happen is that the Agents, trying to account for risk or diminishing returns, will set prices that violate the additivity rule again. They might undervalue the disjunction because winning it doesn't give them much more utility than winning the individual parts, or they might widen spreads implicitly by setting conservative prices. The Bookie can often still construct a Dutch Book that guarantees a loss of chips. However, the philosophical point you want to emerge is that the Agent might not feel irrational this time. They might say they knew the probabilities were fine but priced conservatively because of the prize curve. This creates the wobble in the bridge between credence and betting behavior.

  The final thirty minutes are for the debrief, and this is where you must be precise to avoid them concluding that Dutch Book arguments are simply wrong. Start by asking the pairs who suffered a sure loss in Round One. Ask the Agents how they felt when they realized the Bookie had locked them in. They will likely admit it felt like a mistake in reasoning. Map this to the standard Dutch Book Argument. Explain that the argument claims if your degrees of belief violate the probability rules, you can be forced into a sure loss. The game demonstrated the sure loss part vividly. The inference to irrationality comes from the assumption that your betting prices directly reflect your degrees of belief. In Round One, because the value of chips was linear, there was no reason to adjust your prices for risk, so any inconsistency in prices looked like an inconsistency in belief. Then ask about Round Two. Ask if anyone lost chips again. Many will have. Ask if they felt irrational. Some will say yes, but others will say they were just being careful with the prize curve. Use this to explain that the Dutch Book Argument relies on a bridge principle that says your betting price should equal your degree of belief. Round Two broke that bridge. If your betting prices are influenced by risk aversion or utility curves, a Dutch Book against your prices does not prove your beliefs are incoherent. It only proves your prices are inconsistent with each other. The argument still holds that you should not accept a sure loss, but it does not necessarily prove your credences were the problem rather than your decision rule. Be honest that the game cannot prove irrationality, only the sure loss. The jump from loss to irrationality requires the extra premise that rational agents match their betting prices to their credences when stakes are small and linear.

  There are several predictable ways this activity can stall or misfire, and you should be ready to intervene. The most common failure is that the Bookies in Round One do not see the combination of bets required to lock in the profit. They might look at each claim in isolation and see that each bet looks fair on its own, missing the cross-claim arbitrage. If you see a pair staring blankly at their sheet after ten minutes, give the Bookie a hint. Ask them what happens if they buy the disjunction and sell the conjuncts. Do not give the answer, but point them toward comparing the sum of the individual prices against the price of the combined claim. Another risk is that Agents in Round One will try to game the system by setting prices that are too vague or refusing to trade, but the rules require them to honor any bet the Bookie chooses at the posted price, so enforce this strictly. In Round Two, the biggest confusion will be how to calculate prices with diminishing returns. Students may freeze because they do not know how to convert utility to chip prices. Tell them to trust their intuition on what price feels safe given the prize curve. If they struggle, remind them that the goal is not to be mathematically perfect but to see how their valuation changes their pricing. A deeper risk is that Round Two leads students to think the Dutch Book argument is defeated entirely. You must counter this in the debrief by emphasizing that the argument is conditional. It says if you identify belief with betting price, then incoherent belief leads to sure loss. Round Two shows that if you do not identify belief with betting price, the sure loss might come from elsewhere. This does not invalidate the argument but clarifies its scope. It shows that the Dutch Book argument is actually an argument for connecting belief and behavior in a specific way, not just an argument for the probability axioms alone.

  Finally, manage the energy of the room by keeping the stakes light but the competition real. If you use candy, ensure everyone gets something at the end so the loss feels intellectual rather than punitive. If you use poker chips, make sure the conversion to a prize is clear. The goal is for them to feel the discomfort of the loss in Round One so that the theoretical diagram lands later, and to feel the ambiguity in Round Two so that they question the assumptions behind the diagram. Do not worry if the algebra gets messy for some pairs; the philosophical point lands even if the arithmetic is approximate. The key is that they experience the mechanism of the pump rather than just hearing about it. If time runs short, cut the second round short rather than the debrief, because the debrief is where the learning is consolidated. Ensure you leave at least five minutes at the very end to summarize that formal epistemology is often about testing the links between our internal states and our external actions, and the Dutch Book is a stress test for that link.
