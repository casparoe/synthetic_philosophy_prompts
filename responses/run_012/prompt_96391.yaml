answer: |-
  Mr. Chair, members of the committee.

  I am here because I spent twenty-two years in the Department of Corrections. For the last seven of those years, I served as the warden of the state's men's prison. That facility houses the execution chamber. In that capacity, I was the officer designated to supervise four executions.

  I am not a lawyer. I have not studied philosophy. I am not here to speak for the condemned, and I am not here to speak for the state's attorneys. I am here to speak about the mechanics of what we do when we decide to kill a prisoner.

  I see family members of a victim in the gallery. I also see family members of a man I helped execute. I want to address you both directly before I go further. To the parents who lost a son: nothing I say today diminishes your loss. Nothing I describe undoes the violence that was done to your family. The crime that put a man on death row was a violation of the highest order. I do not question the guilt of the four men I watched die. I have no reason to believe any of them were innocent. My testimony is not about their worth as human beings. It is about our worth as a state.

  To the members of this committee who view the death penalty as a requirement of justice: I understand that position. I have worked alongside corrections officers who hold it. This testimony is not an appeal for mercy. It is not an argument about the sanctity of life. It is an argument about the nature of the act we are asking the government to perform.

  When a murder is committed, it is often an act of heat, of passion, of chaos, or of profound moral failure. It is a rupture. When the state executes a prisoner, it is not a rupture. It is a schedule.

  I want to describe the room where this happens. It is not a cathedral of justice. It is in a building that also houses the prison laundry. The hum of the dryers is audible in the observation room. The chamber itself is small, tiled, functional. It looks like a hospital room that has been stripped of its healing equipment.

  We do not arrive at an execution spontaneously. We arrive there through a process that takes months, sometimes years. But in the final weeks, the process becomes administrative. We operate from a loose-leaf manual. It is revised every few years. It is full of euphemisms. We do not say "kill." We say "carry out the sentence." We do not say "body." We say "the condemned." The language is designed to insulate the staff from the reality of the act. It turns a death into a procedure.

  I supervised four of these procedures. Before each one, we held rehearsals.

  Think about that word. Rehearsal. We practiced the killing of a man who was not there. We walked through the steps. We checked the watches. We tested the communication systems. We assigned roles. One man checks the restraints. Another checks the intravenous lines. Another stands by the switch or the syringe. We practiced until the timing was precise. We practiced until we could do it without hesitation.

  There is a specific kind of coldness required to rehearse a death. The crime that put the man on the gurney may have been committed in a rage, or in fear, or in a moment of broken morality. But the response from the state is calculated. It is rehearsed. It is performed by people who have no quarrel with the man on the table. The officers I worked with were not angry at the condemned. They were professionals doing a job. They went home to their families afterward. They slept.

  This is the distinction I need this committee to consider. When a private citizen kills, it is a tragedy or a crime. When the state kills, it is a policy. And because it is a policy, it must be organized. It must be scheduled. It must be hidden.

  We no longer execute in the public square. We kill before dawn. We draw the curtains. The witnesses are few, selected, screened. We do this for security, we are told. We do this for dignity. But we also do it because we know, deep down, that the act does not bear the light of day. If the purpose of the penalty is justice, and if justice is a public good, why must it be conducted in the dark, behind a curtain, while the rest of the state sleeps?

  If the purpose is deterrence, as some argue, then hiding the act defeats the purpose. No one sees it. No one knows the specific hour it happens until it is over. But I know the four members of this committee who are here do not argue deterrence. You argue justice. You argue that the penalty fits the crime.

  I ask you to look at the fit. The crime was a taking of life. The penalty is a taking of life. But the context changes the meaning. The criminal took a life in violation of the law. The state takes a life in fulfillment of the law. But in fulfilling that law, the state must become a planner of death. It must become a scheduler of endings.

  There is a weight to that. I am not speaking of my conscience. I am speaking of the institution. When you build a machine to kill human beings, you must maintain that machine. You must train people to operate it. You must write the manuals. You must litigate the methods. You must secure the drugs. The state becomes entangled in the mechanics of dying. We spend more time arguing about the composition of the lethal cocktail than we do on the rehabilitation of the living. We spend months ensuring the vein is accessed correctly, while the victim's family waits years for closure.

  The man on the gurney lives with a date on a calendar. For weeks, he knows the hour he is scheduled to die. He eats his last meals. He writes his last letters. He waits. This is a psychological torture that the state imposes as part of the sentence. We do not just take his life; we make him watch us prepare to take it. We make him participate in his own extinguishment.

  I am not asking you to pity him. I am asking you to consider what it says about us that we require this participation.

  There are arguments about racial disparities in charging. There are arguments about the difficulty of obtaining execution drugs. There are arguments about the cost of litigation. Those are valid arguments. But they are not my arguments. I leave those to the members of this committee who have studied them. My authority comes from the fact that I stood in that room. My authority comes from the fact that I signed the logs.

  I am here to tell you that the practice itself is the problem. Not the verdict. The practice.

  A sentence of life imprisonment without parole achieves the separation of the offender from society. It ensures he cannot harm again. It ensures he pays a debt of time that lasts until his natural end. It is a severe penalty. It is a just penalty for the crimes we are discussing. But it does not require the state to rehearse a killing. It does not require the state to schedule a death to the hour. It does not require the state to hide behind a curtain at four in the morning.

  When we commute a sentence to life without parole, we are not letting the man go. We are keeping him in the cage. We are removing the bureaucracy of death from the budget of the state.

  I know the Chair is a former prosecutor. You know that the law is about process. You know that when the process becomes corrupted, the verdict loses its meaning. I am suggesting that the process of execution is inherently corrupted by its own nature. It requires us to treat a human death as an administrative task. It requires us to normalize the abnormal.

  I have seen the officers who carry this out. They are good people. They believe in the law. But I have seen them change. Not because they are cruel, but because they are required to be precise about something that should not be precise. You cannot sanitize death. You can only hide it. And when the state hides its own actions, it creates a distance between the government and the governed. It says, "We will do this for you, but you cannot watch us do it."

  To the parents in the gallery: I know you want justice. I know you want to know that what happened to your son matters. It matters. But does the manner of the killing matter? If justice is about restoring order, does a rehearsed, bureaucratic killing restore order? Or does it simply add another death to the ledger, one that we have to explain, defend, and hide?

  To the sister in the gallery: You know the end of that story. You know the silence that follows the announcement of death. You know that it did not bring your brother back. It did not heal the wound. It simply closed a file.

  I am not asking this committee to forgive the unforgivable. I am asking you to stop asking the state to do the impossible. The state cannot kill without becoming a killer. It cannot schedule death without becoming a scheduler of death. It cannot rehearse an execution without turning murder into a drill.

  This bill replaces the death penalty with life imprisonment without parole. It keeps the punishment severe. It keeps the offender removed. It keeps the justice intact. But it stops the machinery. It stops the rehearsals. It stops the manuals. It stops the state from looking at a calendar and circling a date for a man to die.

  I have spent twenty-two years in corrections. I have seen the worst of what men can do to each other. I have seen the violence. I have seen the blood. I am not squeamish. I am not religious. I do not believe that every life is sacred in a theological sense. I believe that some men forfeit their right to walk among us.

  But I also believe that there is a line the state should not cross. There is a difference between locking a man away for the rest of his days and strapping him to a gurney in a room next to the laundry. There is a difference between letting a man die of age and disease in a cell and injecting him with chemicals while you check your watch.

  The shape of the practice matters. The premeditation matters. The coldness matters.

  If we pass this bill, we are not saying the crimes were not heinous. We are saying that the state's response should not mirror the cold calculation of the worst among us. We are saying that justice does not require us to become administrators of death.

  I have stood in that chamber. I have watched the clock. I have signed the paperwork. I have done my duty. But I am here to tell you that the duty itself is flawed. It is not flawed because the men lived. It is flawed because the state killed them in this way.

  I urge you to vote for this bill. Not for the sake of the condemned. Not for the sake of the budget. But for the sake of the state. We should not be in the business of rehearsing death. We should be in the business of enforcing law. There is a difference.

  Thank you.
