          *   *User's Defense:* They distinguish knowing from understanding. They claim understanding isn't required for agency/knowledge.
          *   *Weakness:* Does this make the agent a "moral zombie"?

      *   *The "Moral Sensitivity/Perception" Objection:* Morality isn't just calculation; it's perception of salience. Deference atrophies this.
