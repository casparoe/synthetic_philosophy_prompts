          *   *Moderate/Awkward:* The Aesthetic Disanalogy, The "Moral Zombie" Intuition.
          *   *Conceded Costs:* Loss of moral credit/virtue signaling, reduced resilience.
      *   **Section 2: Unique Predictions.** What does this view imply that others don't? (e.g., Communities with high retail deference should function well *unless* the source is corrupted).
      *   **Section 3: The Insulation/Falsifiability Check.** Is "retained capacity" a get-out-of-jail-free card?
