answer: |-
  **1. The Definition of the Band**
  **Question:** You argue that we should stop looking at the probability of a single tie-breaking vote and instead look at the probability that the margin falls within a "band" a single ballot could move. But what fixes the width of that band? Is it a fixed number, or does it expand based on our uncertainty about the total count?
  **Follow-up:** If uncertainty widens the band to make the probability non-negligible, doesn't that simultaneously dilute the causal weight of any *single* vote within that band? In other words, if the band is wide enough to catch your vote, isn't it also wide enough that your vote doesn't meaningfully change the outcome within it?

  **2. The Swallowing Conclusion**
  **Question:** Critics worry that if you allow uncertainty to determine the band's width, the argument threatens to swallow its own conclusion: you get a high probability of influence, but only by accepting a low magnitude of influence per vote. How do you prevent the math from canceling itself out?
  **Follow-up:** So you're saying the marginal utility is constant across the band? But if the margin is 10,000 votes, and you add one, have you actually changed the "mandate" or policy outcome in any measurable way, or have you just shifted a decimal point that no actor observes?

  **3. The Generalization Problem**
  **Question:** Let's move to the agents themselves. By your lights, every citizen has this same reason to vote because the margin band applies to everyone equally. But if a reason is held universally, does it remain a valid *individual* reason for action in a non-cooperative game?
  **Follow-up:** If the reason is universal, then the outcome depends on the *sum* of actions, not your specific action. Doesn't that mean you've shifted the justification from "my vote matters" to "my participation in a mass event matters," which is a different claim entirely?

  **4. The Operative Reason**
  **Question:** Following on that: a reason that everyone holds equally cannot be the operative reason for any particular person's acting, because my action doesn't trigger the reason any more than yours does. How do you rescue individual agency here?
  **Follow-up:** If my agency isn't the trigger, then aren't you relying on a form of magical thinking where I act *as if* I control the collective outcome? Isn't that evidential decision theory masquerading as causal reasoning?

  **5. Assurance Game Disguise**
  **Question:** Is what you are offering really an assurance-game argument in disguise? In an assurance game, the rationality of my vote turns on what others are likely to do rather than on any calculation of my own pivotality.
  **Follow-up:** If it is an assurance game, then if I know turnout will be low, my rational choice is to stay home. But you argue I should vote regardless. Doesn't that contradiction suggest you aren't actually modeling the strategic interdependence correctly?

  **6. Rule-Consequentialism**
  **Question:** Alternatively, is this a rule-consequentialist argument? You seem to be saying I should vote because the *rule* "everyone votes" produces a good margin, rather than because *this* vote produces a good margin.
  **Follow-up:** If it's rule-consequentialist, then the rationality of my vote turns on my commitment to the rule, not the outcome of the election. So why not admit that you are arguing for civic duty rather than instrumental rationality?

  **7. The Expressive Account**
  **Question:** Many theorists argue for the expressive account of voting: one votes to affirm a commitment rather than to change an outcome. Why do you think that is the worse explanation compared to your band-of-votes model?
  **Follow-up:** But if your "band" relies on the margin sending a signal to politicians, isn't that just expressive voting with an extra step? If the vote doesn't change the winner, but changes the *perception* of the win, haven't you just rehabilitated the expressive account under instrumental clothing?

  **8. Safe Seats vs. GOTV**
  **Question:** Does your view imply I should stay home in a safe seat? If the margin band is already far outside my reach in a landslide, does your model tell me to spend the afternoon on get-out-the-vote work instead?
  **Follow-up:** If GOTV is always superior because it moves more votes within the band, then isn't the act of voting itself almost always irrational compared to recruitment? Why aren't you telling us to stop voting and start canvassing?

  **9. Causal vs. Evidential Decision Theory**
  **Question:** Standard decision theory distinguishes between Causal Decision Theory (CDT) and Evidential Decision Theory (EDT). Your model seems to rely on correlations between my vote and others' votes to widen the band. Which framework are you using?
  **Follow-up:** If you are using CDT, you can't count correlations with others' votes. If you are using EDT, you fall prey to the "voting because you're the kind of person who votes" loop. Which is it, and how do you avoid the pitfalls of that specific framework?

  **10. Cost Calibration**
  **Question:** Finally, let's talk about cost. In the standard model, even a tiny cost outweighs the tiny probability of being decisive. In your model, how high does the cost have to be before staying home becomes the rational choice?
  **Follow-up:** If the cost is just an afternoon of lost wages, and your benefit is probabilistic and shared, doesn't the expected value still lose to almost any paid labor? If so, isn't voting only rational for the independently wealthy, which seems like an odd conclusion for a theory of democracy?
