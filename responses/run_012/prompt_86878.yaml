  Your understanding of the logic is spot-on. You've correctly identified the classical Law of Non-Contradiction (no sentence is both true and false) and the Principle of Explosion (*ex falso quodlibet*), which says that if you accept a contradiction, classical logic forces you to accept every sentence as true (trivialism).

  You're also right about the dialetheic solution: accept that some sentences (like the Liar) are "truth-value gluts" (both true and false) and block explosion to prevent trivialism. To do this, you generally have to invalidate certain classical inference rules, most notably Disjunctive Syllogism (from $P \lor Q$ and $\neg P$, infer $Q$). In paraconsistent logics like LP (Logic of Paradox), if $P$ is both true and false, $\neg P$ is also true, so you can't use it to eliminate $P$ and isolate $Q$.

  Here is the poem. It is 16 lines, divided into two halves. The second half negates the first half line-for-line, except for the refrain (line 5 and 13), which remains identical to show that the logical structure holds even when the content contradicts itself.

  **The Ground Holds**

  The door is open to the hall.
  There is no shadow on the wall.
  I say the light is pure and one.
  The day is done, the race is run.
  The ground holds fast.
  It slips through all commanding hands.
  I give you true, I give you yes.
  I stand within the truth of this.

  The door is closed against the hall.
  There is every shadow on the wall.
  I say the light is split and none.
  The day begins, the race undone.
  The ground holds fast.
  It slips through all commanding hands.
  I give you false, I give you no.
  I stand within the lie of this.
