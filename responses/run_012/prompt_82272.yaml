  Your first distinction is the only one worth pursuing, but you must rename it to align with standard literature, while your second distinction is a duplicate of an existing debate that will not yield new insights given your constraints.

  Here is the breakdown of why your distinctions stand or fall, followed by the only agenda that fits a one-semester timeline without formal training.

  ### The Distinctions

  **1. "Traceable" vs. "Counterfactual" Cluelessness**
  This is a real distinction, but your terminology is misleading and your justification for the second category is metaphysically shaky. In the literature (specifically James Lenman and Hilary Greaves), this is **Weak vs. Strong Cluelessness**.
  *   **Weak Cluelessness:** We lack data now, but better models or information could resolve the uncertainty. This is just empirical ignorance.
  *   **Strong Cluelessness:** Even an ideal agent with perfect knowledge of causal laws could not predict the outcome due to complexity and chaos (the "butterfly effect").
  *   **The Correction:** You claimed evidence could *never* bear on "counterfactual cluelessness" because it involves a "world history that never happened." This is wrong. We evaluate counterfactuals constantly using causal models. The barrier isn't the metaphysics of counterfactuals; it's computational complexity and chaos. If you frame this as a metaphysical problem about possible worlds, you will waste weeks on modal logic that doesn't touch the ethical problem. Frame it as an epistemic limit on causal modeling.

  **2. "Forward" vs. "Backward" Cluelessness**
  Drop this. It is not a distinct problem; it is merely the problem of **Objective Rightness** combined with **Moral Luck**.
  *   If consequentialism judges actions by actual outcomes, and outcomes are unknowable, then past actions are unknowably good or bad. This is true, but it offers no leverage for *decision theory*, which is forward-looking.
  *   Investigating this leads only to the conclusion that "Objective Consequentialism is action-guidingly useless," which is already settled. It consumes time without generating a solution to your core worry about how to act now.

  ### The Agenda

  Given eight hours a week and no formal math, you cannot solve cluelessness. Your goal is to map the terrain well enough to defend a pragmatic response. Work on these two questions in this order:

  **1. Does Strong Cluelessness actually exist, or is it just extreme Weak Cluelessness? (Weeks 1–6)**
  *   **Why upstream:** If all cluelessness is weak (just lack of data), the solution is better research and heuristics. If strong cluelessness exists (in-principle unpredictability), consequentialism needs a structural fix.
  *   **Your Task:** Read James Lenman's "Consequentialism and Cluelessness." Analyze his argument that chaotic systems make long-term consequences in-principle unknowable. Then, look for counter-arguments (e.g., from William MacAskill or Hilary Greaves) that suggest probabilities converge even if specific outcomes don't.
  *   **Feasibility:** This is conceptual analysis. You don't need math, just a grasp of chaos theory basics and causal modeling.
  *   **Deliverable:** A 10-page paper arguing whether the "strong" version is a distinct threat or just a scarecrow.

  **2. Does switching to "Subjective Rightness" (Expected Value) dissolve the problem? (Weeks 7–12)**
  *   **Why downstream:** Once you establish whether the threat is real, you must evaluate the standard defense. Most consequentialists retreat from *actual* outcomes to *expected* outcomes (probability × value).
  *   **Your Task:** Investigate whether expected value reasoning survives strong cluelessness. If I can't assign probabilities because the space of outcomes is too vast, expected value collapses just like actual value. Read Hilary Greaves' work on the "cluelessness objection."
  *   **Feasibility:** You can handle this without formal decision theory by using thought experiments (e.g., "The Butterfly Donation"). Focus on whether "reasonable credences" are possible when the causal chain is opaque.
  *   **Deliverable:** A defense or critique of Expected Value Consequentialism as a response to the conclusion you reached in Question 1.

  **3. (Contingency) If Expected Value fails, do Rule-Consequentialist heuristics work better? (Weeks 13–16)**
  *   **Why last:** This is your backup plan. If you find that both actual and expected value are paralyzed by cluelessness, you need an alternative action-guiding principle.
  *   **Your Task:** Briefly assess whether following rules (e.g., "don't lie," "maximize local welfare") avoids the tracing problem.
  *   **Feasibility:** Only tackle this if Question 2 fails. It is easier to argue for rules than to calculate values, but it risks abandoning pure consequentialism.

  ### What to Leave Alone

  1.  **Backward Cluelessness:** As noted, this is moral luck. It tells you nothing about what to do tomorrow. It is philosophically sterile for your purposes.
  2.  **Formal Decision Theory:** Do not attempt to learn utility functions, Bayesian updating formulas, or causal decision theory formalisms. You will run out of time trying to learn the math before you can apply it. Stick to qualitative arguments about probability and evidence.
  3.  **Meta-ethical Foundations:** Do not spend time defending consequentialism against deontology or virtue ethics. Assume consequentialism is true for the sake of the project; your problem is internal to the theory, not external.
  4.  **Longtermism Specifics:** While related, don't get bogged down in the specific debates about existential risk or population ethics unless they serve the cluelessness argument. They are too vast.

  ### What Would Change the Ordering

  If you discover in the first three weeks that your professor insists "Strong Cluelessness" is a solved problem, abandon Question 1 and move immediately to Question 3 (Heuristics). If you find you enjoy the causal modeling aspect more than the ethical evaluation, swap the order to focus on the epistemology of prediction first. But based on your description, the existence of the problem is the upstream bottleneck that determines whether any solution is possible.
