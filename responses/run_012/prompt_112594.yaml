      *Drafting text:*
      To: Exhibitions Committee
      From: Chair
      Subject: Design Brief Sign-off – Global Inequality Touring Exhibition

      Recommendation: Approve with Conditions.

      The lead curator's proposal to adopt an Isotype-style pictogram system offers a compelling visual coherence for a touring exhibition. However, the committee cannot endorse the brief in its current form. We recommend approval contingent on specific revisions regarding legibility, local adaptation, and ideological transparency.

      We must acknowledge the strength of the curator's central argument: that a picture language requiring captions, keys, and numerals in every venue has abandoned the one thing that made it worth using. The ambition to create a self-explanatory system that travels unchanged is theoretically sound and aligns with the historical aspiration of eliminating translation barriers. If successful, this would solve the logistical burden of localizing data across four countries.

      However, the objections raised by our stakeholders demonstrate that this theoretical purity cannot withstand practical and ethical scrutiny in this specific context. The education team is correct that Neurath himself described his method as a language-like technique shown alongside verbal elements, not a full language; removing all numerals and keys renders the quantitative data unreadable to visitors who cannot hold a unit value in mind. Furthermore, the claim of "no words, no ideology" is untenable when the subject is global inequality. As the community advisory group notes, a generic human icon is not neutral; it silently settles who counts in poverty statistics. Finally, given the live public controversy over poverty statistics in one host country, the venues' demand to caption panels locally is a risk-management necessity, not merely a preference.

      To move forward, the design brief must be revised to meet the following requirements:
      1. Legibility: Minimal numerals and keys must be reintroduced to anchor the pictogram quantities.
      2. Adaptability: The design must allow host venues to add local captions and, where necessary, substitute local figures or clothing to ensure resonance and accuracy.
      3. Transparency: The brief must acknowledge the political weight of the iconography rather than claiming neutrality.

      The Lead Curator is accountable for delivering this revised design brief. It must be circulated to the committee no later than the next meeting in three weeks. This timeline leaves thirteen months for production and coordination before the exhibition opens in fourteen months, which is sufficient provided the design framework is locked now.

