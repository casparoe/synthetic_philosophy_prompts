  We must acknowledge the strength of the curator's central argument: that a picture language which needs captions, keys and numerals in every venue has abandoned the one thing that made it worth using. The ambition to create a self-explanatory system that travels unchanged is theoretically sound and aligns with the historical aspiration of eliminating translation barriers. If successful, this would solve the logistical burden of localizing data across four countries and preserve the visual integrity of the tour.

