answer: |-
  You have identified a very specific, very frustrating, and very real corner of scientific practice. You are right to feel that "underdetermination" is too broad; in philosophy textbooks, underdetermination often implies a logical possibility space where one rival is usually a contrived skeptic's hypothesis (e.g., "the world was created five minutes ago with false memories"). That is not what you are watching. You are watching two *working, productive, progressive* research programs that are empirically indistinguishable but ontologically incompatible.

  There is no single common noun for this, but there is a precise cluster of terms that, when combined, name the shape you are seeing. If you need a single label for your editor, I suggest **Ontological Underdetermination**, but to understand the edges and mechanics, you need to distinguish the *state* from the *dispute*.

  Here is the breakdown of the terminology, the boundaries, and how to explain it to an editor who wants a winner.

  ### 1. The State: Empirical Equivalence
  The technical condition you are describing—two models fitting the same data equally well—is called **Empirical Equivalence**.
  *   **What it is:** Theory A and Theory B yield identical predictions for all available (and sometimes all *possible*) observations.
  *   **Why it's not enough:** Empirical equivalence happens all the time temporarily. Usually, new data breaks the tie. In your cases, new data *doesn't* break the tie because both models adjust to absorb it.

  ### 2. The Technical Constraint: Model Degeneracy / Non-Identifiability
  In the specific fields you mentioned (cosmology, epidemiology, systems biology), this state has a harder mathematical name.
  *   **Model Degeneracy:** Different structural configurations of a model produce the same output behavior.
  *   **Non-Identifiability:** A parameter cannot be uniquely determined from the data. You can estimate the *combination* of parameters, but not the individual values.
  *   **The Edge:** This rules out cases where one model fits *better*. If Model A has a lower chi-squared value than Model B, it's not degeneracy; Model B is just losing. In your cases, the fit is statistically indistinguishable.

  ### 3. The Philosophical Core: Ontological Underdetermination
  This is the specific refinement of "underdetermination" you are looking for.
  *   **Standard Underdetermination:** The evidence doesn't tell us which *theory* is true.
  *   **Ontological Underdetermination:** The evidence tells us the *math* works, but it doesn't tell us which *entities* are real.
  *   **The Dynamic:** Side A says the hidden population is a **Real Entity** (Realism). Side B says the hidden population is a **Mathematical Artifact** (Instrumentalism). The twist in your cases is that *both sides claim Realism for their own terms and Instrumentalism for the other's.*
  *   **The Edge:** This rules out "verbal disputes." In a verbal dispute, if you clarify the definitions, the disagreement vanishes. Here, the math stays different. They agree on the definition of "mass" or "transmission rate," but disagree on whether the specific parameter in the equation *refers to a thing in the world* or is just a bucket for noise.

  ### 4. The Dispute: The Reification Standoff (Coined)
  Since there isn't a standard phrase for the *sociological fight* that emerges from this, I propose calling it a **Reification Standoff**.
  *   **Definition:** A prolonged scientific dispute where two empirically equivalent models compete, and the central argument is not about data fit, but about which model's auxiliary parameters deserve to be **reified** (treated as real objects) versus treated as **phenomenological fudge factors**.
  *   **The Accusation:** Each side accuses the other of **Ad Hoc-ness**.
      *   Side A (Simple) says Side B is adding "epicycles" (invisible objects) just to save the theory.
      *   Side B (Complex) says Side A is "ignoring mechanism" and that their simple constants are actually the fudge, masking the real complexity.
  *   **The Edge:** This rules out bad faith. In a fraud case, someone is hiding data. In a Reification Standoff, everyone is publishing openly. It also rules out temporary disagreements. A Standoff persists through multiple data releases because the models are flexible enough to absorb new results (what Lakatos calls **Progressive Research Programmes**).

  ### Summary for your Editor
  If your editor asks, "Who is right?", the answer is: **"We are in a Reification Standoff driven by Ontological Underdetermination."**

  Here is how you explain the boundaries to them, so they understand this isn't just "science is hard":

  1.  **It is not "Underdetermination" in the skeptic sense.**
      *   *Standard:* "Maybe gravity is just angels pushing things." (Contrived, non-working rival).
      *   *Your Case:* Both models are used to design experiments, write grants, and publish papers. Both are "live."

  2.  **It is not a "Verbal Dispute."**
      *   *Standard:* "We both mean the same thing by 'gene'."
      *   *Your Case:* The equations are structurally different. If you run the code, the internal variables behave differently, even if the output graph looks the same.

  3.  **It is not "One side is overfitting."**
      *   *Standard:* Model A fits the noise, Model B fits the signal. Cross-validation will eventually kill Model A.
      *   *Your Case:* Cross-validation fails to kill either. The "noise" Model A sees is the "signal" Model B sees, and vice versa.

  ### How to Report It
  Since you cannot say who is right, you must report on the **Trade-off of Virtues**.
  *   **Team Simplicity** is betting on **Parsimony** (Occam's Razor). Their virtue is: "Don't multiply entities without necessity." Their risk is: "Oversimplification/Missing Mechanism."
  *   **Team Mechanism** is betting on **Completeness** (Causal Depth). Their virtue is: "Explain *why* the numbers are what they are." Their risk is: "Epicycles/Unfalsifiability."

  The story isn't "Who will win?" The story is "What price are we willing to pay for an explanation?"
  *   If you value predictive compactness, Team Simplicity wins.
  *   If you value causal accountability, Team Mechanism wins.

  ### The Name to Use
  If you need a headline term that is accurate but readable:
  **The Equivalence Trap.**
  Or, more precisely: **The Ontological Stalemate.**

  But in the text, describe it as **Empirical Equivalence with Competing Ontologies.** This signals to knowledgeable readers that you understand the data fits are identical, but the *stories* about what exists are mutually exclusive, and the evidence currently lacks the resolution to choose between them.

  **The Edge Case Test:**
  To ensure you aren't mislabeling a simpler dispute, ask this: *If we got perfect data tomorrow, would the fight end?*
  *   If **Yes**: It's just a standard data gap. (Not your case).
  *   If **No**: Because Side A would say the new data is "consistent with simplicity" and Side B would say it's "consistent with the hidden population," then you are in the **Reification Standoff**. The data cannot touch the core disagreement because the disagreement is about what *counts* as an explanation, not what the numbers are.
