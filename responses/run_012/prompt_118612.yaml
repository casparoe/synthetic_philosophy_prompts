      *   *Step (4):* Derives $P(A \to C | B) = P(C | A \land B)$. This follows from (1) applied to the conditional probability space.
      *   *Step (5):* Law of Total Probability applied to the conditional $A \to C$.
      *   *Step (6):* The algebraic crunch. This is where Lewis's magic happens.
