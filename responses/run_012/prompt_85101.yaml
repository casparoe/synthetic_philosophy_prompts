answer: |-
  ### Scratchpad: Designing the Question

  **The Core Problem:**
  Students treat the "standard replies" (bounded utility, probability thresholds, symmetry/multiple muggers) as a menu where selecting any one counts as solving the problem. This is superficial. In the literature, these aren't equivalent; they have different costs. Bounded utility violates standard axioms (continuity/unboundedness). Probability thresholds violate probabilistic coherence (why is $10^{-100}$ zero but $10^{-99}$ not?). The symmetry argument assumes an adversary or specific prior structure that isn't guaranteed.

  **The Diagnostic Requirement:**
  To force a C-grade student into a B/A range, they must argue *why* one diagnosis is fundamental and the others are either derivative or ad hoc.
  *   *If they pick Utility:* They must argue credence thresholds are epistemically unjustified.
  *   *If they pick Credence:* They must argue utility bounds are unacceptable (e.g., prevent genuine fanaticism where it's warranted).
  *   *If they pick Structure (EU itself):* They must argue that linearity is the culprit, making utility/credence tweaks mere patches.

  **The Exploitability Layer:**
  This is the filter. Many students conflate "Pascal's Mugging" with "Dutch Book."
  *   *Dutch Book:* Incoherent credences guarantee loss.
  *   *Mugging:* Coherent credences + EU rule prescribe a seemingly irrational act.
  *   *The Twist:* Is exploitability a *reason* to reject the mugger, or just a *consequence* of the underlying flaw?
  *   *Adversary vs. Nature:* If the hypothesis is natural (e.g., physics simulation), there is no adversary to pump you. If the rule is irrational only when exploitable, natural muggings are fine. If the rule is irrational because it ignores evidence/proportionality, natural muggings are also bad. This distinction tests whether they view rationality as pragmatic (winning) or structural (coherence).

  **Model Answer Strategy:**
  I will take a strong stance: The problem is **structural** (EU's sensitivity to tails). Bounded utility is the only coherent fix. Probability thresholds are epistemically arbitrary. Exploitability is a symptom, not a separate fix. The adversary distinction matters for *money pumps* but not for the *irrationality* of the act.

  **Marking Scheme Design:**
  Needs to penalize "list-making." Points awarded for relational arguments (how A affects B), not just identifying A.

  ---

  ### Deliverable

  #### Final Exam Question: Decision Theory & Epistemology
  **Time Allowed:** 60 Minutes
  **Instructions:** Answer the following question. No notes or external materials permitted.

  **Question:**
  Pascal's Mugging is often presented as a paradox with three standard solutions: (i) bound utility functions, (ii) reject astronomically small credences, or (iii) appeal to symmetry among mutually exclusive hypotheses.

  1.  **Diagnosis:** Do not simply list these options. Argue for **one** as the fundamental diagnosis of the problem. Explain whether the other two are genuine independent solutions or merely symptoms/patches of the issue you identified.
  2.  **Exploitability:** A colleague argues that the real problem is exploitability: if your decision rule accepts such offers, an adversary can construct a sequence of bets that guarantees your loss. Is exploitability a fourth, independent objection, or is it derivative of your diagnosis in Part 1?
  3.  **Adversary vs. Nature:** Does it matter for your diagnosis whether the mugger is a strategic adversary who knows your decision procedure, or a natural hypothesis (e.g., a quantum fluctuation) that merely happens to be unlikely and valuable? Explain why or why not.

  ---

  #### Model Answer

  The fundamental problem is structural: Expected Utility (EU) maximization is linear, meaning any hypothesis, regardless of probability, can dominate the decision if its payoff is sufficiently large. This is not primarily a problem of utility or credence specifically, but of the multiplication rule that couples them. Because the structure allows tails to dominate heads, we must modify the structure to prevent infinite or astronomical leverage.

  Therefore, bounding utility is the only coherent solution. It directly addresses the structural flaw by ensuring no payoff can outweigh a high-probability mundane outcome. The alternative—rejecting astronomically small credences—is epistemically arbitrary. There is no principled reason why a probability of $10^{-100}$ should be treated as zero while $10^{-99}$ is not; this violates the regularity of rational credence. Treating it as a "symptom" rather than a fix acknowledges that while ignoring small probabilities stops the mugging, it does so by breaking epistemic norms rather than fixing the decision rule. Similarly, the symmetry argument (that there are equally likely opposite muggers) is contingent on the environment. It works if an adversary generates hypotheses, but it fails if nature presents a single skewed opportunity. Thus, symmetry is a patch, not a diagnosis.

  Regarding exploitability, this is not a fourth independent objection but a pragmatic demonstration of the structural flaw identified above. If EU allows tail events to dictate action, an adversary can simply sequence those tail events to drain resources. Exploitability shows *why* the structural flaw is dangerous, but it does not identify a new source of the error. The error is already present in the single-shot case where EU prescribes handing over the wallet. Exploitability merely aggregates single-shot errors into a sure loss. Consequently, solving the structural problem (by bounding utility) automatically solves the exploitability problem. They stand or fall together.

  Finally, the distinction between an adversary and a natural hypothesis matters for the *consequence* of the error, but not for the *diagnosis* of irrationality. If the mugger is an adversary, accepting the deal leads to a money pump—a guaranteed loss. If the hypothesis is natural (e.g., a rare cosmic event), accepting the deal is merely a high-variance bet with negative expected value (assuming the mugger's claim is false). However, the decision rule is flawed in both cases. Rationality is not solely about avoiding guaranteed losses (coherence); it is about responding proportionally to evidence. A decision rule that lets arbitrarily weak evidence (tiny probability) dictate action via arbitrarily large stakes is insensitive to evidence quality. Whether an adversary exploits this insensitivity or nature merely presents it, the agent is failing to weigh evidence correctly. Therefore, the adversary condition intensifies the pragmatic cost of the error but does not change the structural diagnosis. The rule itself is broken, regardless of who is holding the wallet.

  ---

  #### Marking Scheme (Total: 20 Marks)

  | Point | Criteria | Marks | Typical Failure Mode |
  | :--- | :--- | :--- | :--- |
  | **1. Core Diagnosis** | Clearly identifies one of the three options (Utility, Credence, or Structure) as the *root* cause, not just a possible fix. | 4 | Student lists all three as equally valid options without ranking them. |
  | **2. Relation of Alternatives** | Explains the status of the *other two* options relative to the chosen diagnosis (e.g., as ad hoc patches, symptoms, or independent). | 4 | Student treats the other two as unrelated solutions rather than relating them to the core diagnosis. |
  | **3. Exploitability Status** | Explicitly classifies exploitability as either a fourth option or (correctly) as derivative of the core structural/decision rule flaw. | 4 | Student conflates exploitability with Dutch Book incoherence or treats it as a separate solution. |
  | **4. Adversary Distinction** | Addresses whether the adversary/nature distinction changes the *irrationality* or just the *cost*, linking back to the diagnosis. | 4 | Student claims the problem disappears entirely if there is no adversary (ignoring single-shot irrationality). |
  | **5. Commitment** | Maintains a consistent stance throughout; no fence-sitting or "both sides" conclusions in the final paragraph. | 4 | Student hedges in the conclusion (e.g., "Ultimately, it depends on the context"). |
