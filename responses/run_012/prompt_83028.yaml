answer: |-
  The debate over human rationality often hinges on a computational bottleneck. A cognitive scientist (CS) observes that exact Bayesian inference over rich hypothesis spaces is NP-hard in the worst case. From this, they infer that human beings cannot be rational Bayesians; if the computation is intractable, the mind cannot be performing it. A philosopher counters with the **relational view of complexity**: computational hardness is not an intrinsic property of a problem, but a relation among a problem, an agent's representational format, a distribution over inputs, and a resource bound.

  This essay argues for the relational view and against the CS's inference. I will demonstrate that worst-case asymptotics fail to constrain finite reasoners, defend the relational view against the charge of normative collapse, and show how it grounds a robust, ecological normative epistemology.

  ### I. The Failure of Worst-Case Asymptotics

  The CS's argument relies on a category error regarding what complexity classes signify. NP-hardness is a statement about the asymptotic behavior of an algorithm as the input size $n$ approaches infinity, specifically focusing on the *worst-case* input. Neither condition applies to human cognition.

  First, humans are finite agents operating in a finite world. We never face inputs where $n \to \infty$. A problem that is intractable for $n=10^{100}$ may be trivial for $n=20$. Second, and more critically, "worst-case" inputs are often mathematical pathologies that never occur in the natural environment. Complexity theory traditionally assumes an adversarial input distribution (to guarantee safety against the worst case). However, cognitive agents face a *natural* distribution of inputs structured by the physics and statistics of their environment.

  **Concrete Example: Bayesian Updating in Causal Networks**
  Consider the CS's specific claim regarding Bayesian inference. Calculating exact posterior probabilities in a general Bayesian belief network is indeed NP-hard. However, this hardness depends on the graph's connectivity. If the network is "singly connected" (a tree structure without loops), exact inference is linear in time complexity.
  The CS argues: "General inference is NP-hard, therefore humans aren't Bayesians."
  The Relational View counters: "General inference is NP-hard, but human environments often present causal structures that are approximately tree-like, and human memory representations may prune loops to maintain tractability."
  If the environment rarely presents the specific graph topologies that trigger exponential explosion, the *effective* complexity for the agent is low, even if the *abstract* problem class is hard. Therefore, the mere existence of a worst-case lower bound cannot ground a claim about what a finite reasoner can rationally do in their specific ecological niche.

  ### II. The Normative Objection and Its Defusal

  The strongest objection to the relational view is the **Normative Collapse Objection**. It states: If complexity is relative to an agent's representation and resources, then hardness loses its objective bite. Any agent could claim a problem is "easy" simply by adopting a convenient representation or claiming generous resource bounds. If complexity is entirely agent-relative, it cannot support a substantive normative epistemology. We could not say an agent *ought* to find a solution difficult, nor could we criticize them for failing to solve it. This threatens to reduce rationality to "whatever the agent does," eliminating the critical power of normative assessment.

  **Defusal: The Cost of Representation and Ecology**
  This objection fails because it treats representation and resource bounds as free variables they are not. In the relational view, the "relation" includes the *cost of establishing the relation*.
  1.  **Representation Costs:** An agent cannot simply choose a representation that makes a problem easy. Representations must be learned, stored, and maintained. If a representation makes inference linear but requires exponential memory to store the lookup table, the problem remains hard relative to the agent's total resource budget.
  2.  **Ecological Constraints:** The input distribution is not chosen by the agent; it is imposed by the world. If an agent adopts a representation that makes inference easy only for inputs that never occur, they are not rational; they are mismatched.

  Therefore, complexity remains objective relative to the *agent-environment system*. We can still say, "Given the agent's biological memory limits and the statistical structure of the savannah, this inference problem is hard." The normativity does not vanish; it shifts from abstract logic to ecological fit. The objection assumes relativism implies "anything goes," but the relational view implies "only what fits goes."

  ### III. Normative Force: Mandatory, Permissible, and Forbidden

  By anchoring complexity in the agent-environment relation, we can derive specific normative claims about inferential strategies. Rationality is no longer about maximizing accuracy at all costs (ideal rationality), but about optimizing the trade-off between accuracy and computational cost (bounded rationality).

  Using the **Bayesian Network** example again, suppose an agent must diagnose a cause from symptoms.
  *   **Rationally Forbidden:** It is forbidden for the agent to attempt exact inference using a general-purpose algorithm if the agent's working memory is insufficient to store the necessary joint probability table for typical inputs. Attempting this would lead to resource exhaustion (cognitive crash) before a decision is made. In the relational view, using an algorithm that exceeds the resource bound is irrational, regardless of its logical soundness.
  *   **Rationally Mandatory:** Suppose the environment's causal structure is predominantly tree-like. In this context, it is mandatory for the agent to use a "singly connected" approximation algorithm (like belief propagation) rather than a general exact solver. Why? Because the exact solver wastes resources on loop-checking that yields no accuracy gain in this specific distribution. Wasting finite resources is irrational.
  *   **Rationally Permissible:** Consider two heuristics: one is fast but 90% accurate; the other is slower but 95% accurate. If the stakes of the decision are low (e.g., choosing a path in a forest), the fast heuristic is permissible. If the stakes are high (e.g., identifying a predator), the slower heuristic may become mandatory. The relational view allows the "resource bound" to vary with context (stakes), permitting different strategies for the same logical problem depending on the pragmatic context.

  ### Conclusion

  The cognitive scientist's inference fails because it mistakes a property of abstract functions for a property of physical systems. NP-hardness in the worst case is a warning about the limits of universal algorithms, not a verdict on the capabilities of situated agents. By adopting the relational view, we recognize that complexity is a function of the fit between mind and world. This does not dissolve normative epistemology; rather, it enriches it. It allows us to judge agents not by their proximity to a god-like ideal of infinite computation, but by their success in navigating the computational constraints of their own biology and environment. Human beings can be rational Bayesians, not because they solve NP-hard problems, but because they inhabit a world where the problems that matter are often tractable, and they possess representations adapted to solve them.
