answer: |-
  This is a heavy situation, and it makes sense that you're stuck chewing on Dana's comment. It's a very clean, sharp moral rule ("once you've done the thing, you forfeit the right"), which is appealing when life is messy. But human relationships and caregiving ethics aren't that clean.

  Here is the outside read you asked for, broken down by the moral logic, the analogies, and the practical path forward.

  ### 1. The Moral Logic: Are you barred from speaking?

  **Short answer:** No. You have not forfeited the right to protect your mother.

  **The Brother's Argument:** This is a classic *tu quoque* ("you also") fallacy. It is a deflection tactic. Even if you had murdered someone in cold blood, it would not ethically permit your brother to neglect an vulnerable elder. His obligation to your mother exists independently of your history with your father.

  **Dana's Argument:** Dana is confusing **moral authority** with **moral obligation**.
  *   **Moral Authority:** Yes, your past actions have damaged your credibility. You cannot stand on a pedestal and preach. Dana is right that you've lost the high ground.
  *   **Moral Obligation:** You still have a duty of care to your mother. If you see a house on fire, you are allowed to call 911 even if you accidentally started a fire ten years ago.

  Dana's "bribed judge" analogy fails because **you are not the judge.** You are not sentencing your brother. You are a stakeholder in your mother's welfare. A better analogy is the **Recovering Smoker.** If you smoked for 20 years and quit, and you see your sibling smoking around their asthmatic child, you are not a hypocrite for saying, "Stop that. I know how hard it is to quit, I did it, but this is dangerous." Your past failure actually gives you *more* insight into the danger, not less.

  ### 2. The Hypocrisy Trap

  You are worried about being a "hypocrite with extra steps." You can avoid this, but it requires a specific shift in how you frame the conversation.

  Hypocrisy is claiming a standard for others that you do not apply to yourself.
  *   **Hypocritical stance:** "I am a good child and you are a bad child. I would never do what you're doing." (This is false, given your history).
  *   **Honest stance:** "I messed up badly with Dad. I carry guilt for that every day. I am not going to let that happen with Mom."

  If you own your past, you disarm your brother. When he says, "You did the same thing," your answer is: **"Yes. I did. And I regret it deeply. That is exactly why I am speaking up now. I know what this looks like from the other side, and I am not letting Mom be the victim of it again."**

  That isn't hypocrisy. That is growth.

  ### 3. The "Witness" vs. "Judge" Analogy

  You mentioned Dana's "Judge" analogy versus your "Witness" analogy. I think there is a third one that fits better: **The Co-Signer.**

  You and your brother are effectively co-signers on your mother's well-being.
  *   He has the logistical power (keys, POA, proximity).
  *   You have the emotional power (daily calls, monitoring).

  If a co-signer on a loan stops paying, the other co-signer doesn't lose the right to call the bank because *they* missed a payment on a different loan five years ago. The bank (Mom) still needs to be paid.

  However, your "Witness" analogy is partially right. A witness who has lied before is *impeachable*. Their testimony is scrutinized more heavily. This means you cannot just make accusations; you need **evidence**.
  *   Don't say: "You're a liar."
  *   Say: "Mom told me you visited Tuesday. Her neighbor says no one came. I need to know what's happening."

  ### 4. What are you actually allowed to do?

  You asked what you are allowed to do without it being hypocritical. Here is the ethical boundary line: **Action motivated by Mom's safety is permissible. Action motivated by punishing your brother is risky.**

  Here is a playbook for how to proceed:

  **A. Stop covering for him (Ethically Required)**
  When Mom asks, "Did my brother come by?" and you know he didn't, do not lie.
  *   *Hard version:* "No, he didn't."
  *   *Softer version:* "He hasn't been able to make it lately."
  Lying protects him, not her. It feeds her confusion. Stopping the lie isn't revenge; it's reality testing for a person with dementia.

  **B. Involve the Aunt (Ethically Permissible)**
  Dana says you're barred from talking to others. That is incorrect. If a tenant's landlord isn't fixing the heat, the tenant talks to the housing authority.
  *   Frame this to the Aunt not as "Brother is bad," but as "Mom is declining and Brother is overwhelmed/unable to cope. We need a wider safety net."
  *   This brings in witnesses. It stops being your word against his.

  **C. Address the POA and Finances (Critical)**
  This is the most dangerous part. He has her bank card. He is not visiting. He is lying to her.
  *   **Financial abuse often accompanies neglect.** You need to know if bills are being paid.
  *   You are allowed to say: "Since I can't be there, and you're busy, I need to see the bank statements to make sure Mom's care costs are covered. That's part of my role as her other child."
  *   If he refuses, that is a red flag that requires professional intervention (elder law attorney or APS).

  **D. The Conversation with Brother**
  You can call him, but change the script.
  *   *Old Script:* "You need to visit Mom. You're lying to her." (Invites the "You did it too" fight).
  *   *New Script:* "I know I screwed up with Dad. I live with that. I am terrified of history repeating with Mom. She is telling me you visit, but she seems confused. I need us to be on the same page so she doesn't feel abandoned. If you can't do the visits, tell me, and we will figure out a paid caregiver, but we can't lie to her."

  ### 5. Summary

  Dana is giving you advice that protects *you* from looking bad, but it puts *Mom* at risk. Her advice prioritizes your moral purity over your mother's safety.

  Your brother is right that you lack the **moral high ground**, but he is wrong that you lack the **moral right**.

  You are allowed to advocate for your mother. You are allowed to correct the record. You are allowed to involve family. The only thing you aren't allowed to do is pretend you're perfect while you do it.

  Own your past. Use it as fuel for empathy, not as a shackle for silence. Your history with your dad doesn't disqualify you from saving your mom; it qualifies you to understand exactly what's at stake.

  **One final caution:** Since he has POA and is lying to a person with dementia, please monitor the financial situation closely. If he is using her funds while neglecting her, this moves from "family dispute" to "elder abuse," and at that point, your past history is irrelevant to the authorities. They will only care about her safety.
