  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** Member of a state-level accident investigation board (fatal fires, industrial deaths, marine casualties).
      *   **Task:** Create a procedural guide for investigators (no philosophy training) to assign causal labels ("Cause," "Contributing Factor," "Background Condition") to findings, specifically handling *omissions*.
      *   **Constraints:**
          1.  Must be runnable in an afternoon with a file.
          2.  Must handle the "omission debate" (can absences cause?).
          3.  Must protect against legal liability implications (counsel review).
          4.  **Constraint 1 (Contrastive):** All findings must be contrastive ("A rather than B"). Need a method to select/defend B.
          5.  **Constraint 2 (Omission vs. Failure):** Distinguish negative fact (no alarm) from agent failure (landlord didn't maintain). Specify when to use which.
          6.  **Constraint 3 (Duty & Self):** Handle omissions by actors with *no duty* and omissions by the Board itself.
          7.  **Output:** The procedure (questions, termination points, sorting logic, "undecidable" markers), applied to three specific cases (house fire, defunded screening, overdetermined omission), with one "unwelcome" outcome explained.
          8.  **Grounding:** Must reflect philosophical debate (counterfactual, normative, contrastive) without being a literature review. Explicitly mark contested steps.
          9.  **Confidence:** End with a confidence assessment and identify the weakest step.

  2.  **Deconstruct the Philosophical Underpinnings:**

      *   *Omissions as Causes:* The core tension.
          *   *View A (Naturalist/Physicalist):* Only positive events cause. Omissions are just "not-events." (Panel Half 1).
          *   *View B (Normative/Contextual):* Omissions cause when there is a duty/expectation. (Panel Half 2).
          *   *Solution for Procedure:* We need a hybrid. We can't say omissions *never* cause (too restrictive for safety), but we can't say *all* absences cause (causal inflation). The "Duty/Norm" filter is the standard philosophical compromise (e.g., Hart & Honoré, McGrath).
      *   *Contrastive Causation:* (Schaffer, Hitchcock). "C caused E" is incomplete. It's "C rather than C* caused E rather than E*." This fits the user's Constraint 1 perfectly. It helps narrow down *which* omission matters.
      *   *Legal Liability:* Counsel wants to avoid "negligence" language. Distinguishing "Condition" vs. "Failure" is key here. "No sprinkler" is a fact. "Landlord failed to install" is a blame assignment.
      *   *Overdetermination:* Two omissions, either would have saved the victim. Standard counterfactual theory struggles here (neither is *necessary* if the other is absent). Needs a "sufficient set" or "substantial factor" approach.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* A flowchart-like text.
      *   *Step 1: Identification.* List all candidates (events and omissions).
      *   *Step 2: The Contrastive Test.* Define the "Normal/Expected" baseline. This addresses Constraint 1.
      *   *Step 3: The Counterfactual Test.* But-for testing.
      *   *Step 4: The Normative Filter (The Omission Fix).* This addresses the "Half the panel" fight. Only omissions with a duty/norm count as potential *Causes*. Others become *Background Conditions*. This addresses Constraint 3 (No duty).
      *   *Step 5: Agent vs. Fact.* Addressing Constraint 2. When to name the landlord vs. the missing alarm.
      *   *Step 6: Sorting.* Cause vs. Contributing vs. Background.
      *   *Step 7: The "Undecidable" Markers.* Where does philosophy end and policy begin?

      *Refining the "Omission" Logic:*
      If I say "The death was caused by the lack of a sprinkler," is that a cause?
      Philosophical consensus for *practical* purposes: An omission is a cause *relative to a normative expectation*.
      So, the procedure needs a "Duty Check."
      *   Duty exists? -> Potential Cause.
      *   No Duty? -> Background Condition (prevents causal inflation).
      *   Board's own omission? -> Special handling (Policy/Conflict of Interest).

      *Refining the Contrast:*
      "Death occurred because [Alarm Broken] rather than [Alarm Functional]."
      Investigator needs to justify why [Alarm Functional] is the relevant contrast, not [Alarm Never Installed] or [Building Not Built].
      *Rule:* The contrast must be the *closest feasible alternative consistent with the system's design intent.*

      *Refining the Liability Shield:*
      To satisfy Counsel: Use "Condition" language for facts, "Failure" language only when duty is statutory/clear. If duty is murky, stick to the negative fact.

  4.  **Developing the Three Test Cases:**

      *   *Case 1: Fatal House Fire.*
          *   Candidates: Faulty wiring (event), No sprinkler (omission, lawful), Landlord didn't inspect (omission, duty?), Victim smoked in bed (event).
          *   Application: Wiring = Cause. Smoking = Contributing. No Sprinkler = Background (if lawful/no duty) OR Contributing (if norm exists). Let's make the "unwelcome" outcome here or in Case 2.
          *   *Decision:* Let's make the "No Sprinkler" (lawful) come out as "Background Condition." This annoys safety advocates but respects the "No Duty" constraint.
      *   *Case 2: Defunded Screening (Cancer).*
          *   Candidates: Cancer biology (event), State defunded program (omission/policy), Patient didn't pay private (omission).
          *   Application: State omission. Is there a duty? Statutory? If defunded legally, is there a duty? This touches Constraint 3.
          *   *Decision:* This should be the "unwelcome" one. If the procedure says "No duty = Background," it lets the State off the hook. If it says "Role duty = Cause," it implicates the Board's masters. Let's make it implicate the State (Cause) to show the procedure's bite, or exclude it to show its limit.
          *   *Better Unwelcome Outcome:* Case 3 (Overdetermination). If two omissions, standard counterfactuals say neither is necessary. The procedure needs to handle this. If it labels both "Contributing," families might feel justice isn't served. If it labels both "Cause," it violates strict but-for logic.
          *   *Revised Plan:*
              *   Case 1 (Fire): Standard application. Lawful omission = Background.
              *   Case 2 (Screening): State omission. Duty exists (statutory mandate), but funding removed. Procedure finds "Cause." Unwelcome to the Legislature.
              *   Case 3 (Two Omissions): Overdetermination. Both labeled "Cause." Unwelcome to defendants (joint liability implication).
              *   *Wait, prompt asks for ONE unwelcome outcome.* I will choose Case 2 (Screening). Why? Because it implicates political policy as a "Cause" of death, which investigation boards usually shy away from. The procedure forces it.

  5.  **Addressing Specific Constraints in the Text:**

      *   *Constraint 1 (Contrast):* Build a "Contrast Selection Protocol."
      *   *Constraint 2 (Fact vs. Failure):* Build a "Attribution Gate."
      *   *Constraint 3 (No Duty/Board):* Build a "Duty Verification Step."
      *   *Philosophical Grounding:* Cite (implicitly or explicitly) the shift from physicalist to normative accounts of omission (Hart & Honoré), contrastive causation (Schaffer), and overdetermination (Lewis/Mackie). Mark contested steps.

  6.  **Writing the Procedure (Drafting & Polishing):**

      *   *Tone:* Bureaucratic, precise, instructional.
      *   *Structure:*
          1.  Preamble (Purpose & Limits).
          2.  The Protocol (Steps 1-7).
          3.  Decision Logic (Sorting).
          4.  The "Human Judgment" Flags.
          5.  Case Studies.
          6.  Confidence & Weakness.

      *   *Self-Correction on "Board's Own Omission":* This is tricky. If the Board failed to recommend something earlier, can they cite it now?
      *   *Rule:* Recusal/Policy. If the Board's prior inaction is a candidate, it must be flagged as "Policy/Conflict" and elevated to Chair/Counsel, not decided by investigator.

      *   *Refining the "Unwelcome" Case:* The Cancer Screening case is the strongest candidate for "unwelcome." It turns a budgetary decision into a "Cause of Death." This is philosophically defensible (normative causation) but politically explosive. I will argue *for* accepting it because hiding it undermines the preventative purpose of the board.

      *   *Refining the "Confidence":* I need to be honest. The "Duty" definition is the weakest link because "Duty" is a legal/moral concept, not a factual one.

  7.  **Final Review against Prompt:**

      *   Procedure for investigator? Yes.
      *   Questions in order? Yes.
      *   Termination points? Yes.
      *   Sorting logic? Yes.
      *   Explicit "Undecidable" markers? Yes.
      *   Constraint 1 (Contrast)? Integrated into Step 2.
      *   Constraint 2 (Fact vs. Failure)? Integrated into Step 5.
      *   Constraint 3 (No Duty/Board)? Integrated into Step 4 & 7.
      *   Three Cases? Yes.
      *   One Unwelcome? Yes (Screening).
      *   Philosophical Grounding? Included in rationale notes.
      *   Confidence statement? Yes.

  8.  **Final Polish:** Ensure the distinction between "Cause," "Contributing Factor," and "Background Condition" is clear.
      *   *Cause:* Necessary (in the context) + Normatively Salient.
      *   *Contributing:* Not necessary but increased risk/speeded event + Normatively Salient.
      *   *Background:* Necessary but Normatively Inert (no duty/expectation).

      *Wait, one nuance:* The prompt asks for "Cause" vs "Contributing" vs "Background."
      Standard HSE/NTSB model:
      *   Cause: The primary driver.
      *   Contributing: Helped it happen but wasn't primary.
      *   Background: The stage setting.
      I need to make sure the omission logic fits this.
      *   Omission with Duty + But-For = Cause.
      *   Omission with Duty + Substantial Factor (not But-For) = Contributing.
      *   Omission without Duty = Background.

      *Let's write it.*
answer: |-
  # PROCEDURE 7.4: CAUSAL LABELLING AND OMISSION HANDLING
  **For:** Accident Investigation Investigators
  **Review:** Legal Counsel Required Prior to Signature
  **Time Allocation:** 3–4 Hours per File

  ## 1. PURPOSE AND SCOPE
  This procedure resolves ambiguity in assigning the labels **Cause**, **Contributing Factor**, and **Background Condition**. It specifically governs how to treat *omissions* (things that did not happen). It is designed to produce findings that are factually robust, philosophically defensible, and legally neutral.

  **Note on Philosophy:** This procedure adopts a *contrastive* and *normative* view of causation. It rejects the view that only physical events cause things (which would exclude all omissions) and rejects the view that all absences cause things (which makes everything a cause). It rests on the consensus that an omission is a cause only relative to an expectation or duty. **Steps marked [CONTESTED]** rest on philosophical views that are not universally settled; these require Panel Chair approval if challenged.

  ---

  ## 2. THE PROTOCOL

  ### STEP 1: CANDIDATE GENERATION
  **Action:** List every event and every omission that appears relevant to the death.
  **Question:** "If this thing had been different, would the death likely have been avoided or delayed?"
  **Output:** A raw list of candidates (e.g., "Wire shorted," "No sprinkler," "Inspector did not visit").
  **Termination:** If the list is empty, terminate with "No Causal Finding."

  ### STEP 2: THE CONTRASTIVE TEST (Constraint 1)
  **Action:** For each candidate, define the *contrast*. You cannot state a cause without stating what it is being compared to.
  **Question:** "The death occurred because **[Candidate]** rather than **[Alternative]**."
  **Rule for Selecting the Alternative (B):**
  1.  **Feasibility:** The Alternative must have been physically and legally possible at the time.
  2.  **Proximity:** The Alternative must be the *closest* deviation from reality that prevents the death. (e.g., Use "Sprinkler worked" rather than "Building was made of concrete").
  3.  **System Intent:** The Alternative must align with the intended design or regulatory baseline of the system.
  **Sufficient Answer:** "Death occurred because *the alarm failed to sound* rather than *the alarm sounding as designed*."
  **Insufficient Answer:** "Death occurred because *there was no alarm*." (This lacks the contrast).
  **No Plausible B:** If no feasible Alternative exists (e.g., "Gravity existed rather than not"), the candidate is **not a Cause**. Move to Step 6 (Background).

  ### STEP 3: THE COUNTERFACTUAL TEST (But-For)
  **Action:** Apply the "But-For" test to the Contrastive Pair.
  **Question:** "If the Alternative (B) had obtained, would the death have occurred *at that time and in that way*?"
  **Outcomes:**
  *   **Yes (Death still happens):** Candidate is not a *Cause*. It may be a *Contributing Factor* (if it sped up the process) or *Background*. Proceed to Step 6.
  *   **No (Death prevented):** Candidate is a *Potential Cause*. Proceed to Step 4.
  *   **Uncertain (Probabilistic):** Treat as "No" for Cause, but flag for *Contributing Factor*.

  ### STEP 4: THE DUTY AND NORM FILTER (Constraint 3 & Philosophical Grounding)
  **Action:** Determine if the omission carries a normative weight. This step distinguishes a "Cause" from a "Background Condition."
  **Question:** "Was there a specific duty, rule, or established practice requiring the Alternative (B) to exist?"
  **Checklist:**
  1.  **Statutory/Regulatory:** Did a law or code require it?
  2.  **Contractual/Role:** Did a job description or contract require it?
  3.  **Established Practice:** Is it standard industry practice, even if not codified?
  **Outcomes:**
  *   **Duty Exists:** Candidate remains a *Potential Cause*. Proceed to Step 5.
  *   **No Duty Exists:** Candidate is downgraded to **Background Condition**. **Terminate** for this candidate.
      *   *Rationale:* Without a duty, the absence is merely a circumstance, not a causal agent. This prevents "causal inflation" (e.g., "Death caused by lack of a superhero").
      *   **[CONTESTED]:** This step assumes omissions require a norm to be causes. Some philosophers argue physical dependence is enough. The Panel accepts the normative view to limit liability scope.
  *   **Actor Had No Role:** (e.g., a bystander did not rescue). Classify as **Background Condition**. Do not name the actor.
  *   **Actor is This Board:** (e.g., "Board did not issue prior warning"). **STOP.** Do not classify. Flag for Chair and Counsel. This is a **Conflict of Policy**, not a factual finding.

  ### STEP 5: AGENT VS. FACT ATTRIBUTION (Constraint 2)
  **Action:** Decide how to phrase the finding in the report.
  **Question:** "Do we name the *absence* or the *person who allowed the absence*?"
  **Rule:**
  1.  **Default:** Name the **Negative Fact** (e.g., "Absence of a working alarm"). This is safer for litigation.
  2.  **Exception:** Name the **Agent's Failure** (e.g., "Landlord's failure to maintain") *ONLY IF*:
      *   A specific statutory duty is clearly breached.
      *   Counsel confirms this phrasing does not equate to a finding of *negligence* per se.
      *   The agent had exclusive control over the condition.
  **Sufficient Answer:** "Finding: The absence of a working alarm."
  **Insufficient Answer:** "Finding: The landlord was lazy." (Never use pejoratives).

  ### STEP 6: SORTING (Cause vs. Contributing vs. Background)
  **Action:** Assign the final label based on previous steps.
  *   **CAUSE:** Passed Step 3 (But-For) AND Passed Step 4 (Duty Exists).
  *   **CONTRIBUTING FACTOR:** Failed Step 3 (Not strictly But-For, e.g., overdetermined) BUT Passed Step 4 (Duty Exists) AND materially increased risk.
  *   **BACKGROUND CONDITION:** Failed Step 4 (No Duty) OR Failed Step 2 (No Plausible Contrast).

  ### STEP 7: OVERDETERMINATION CHECK (Special Case)
  **Action:** Check if two or more *Potential Causes* (from Step 4) are present, where either one alone would have prevented the death.
  **Question:** "If Candidate A had happened, would the death be prevented? If Candidate B had happened, would the death be prevented?"
  **Outcome:** If **Yes** to both:
  *   Label **BOTH** as **Cause**.
  *   Do not downgrade to Contributing.
  *   *Rationale:* In omission cases, "necessary" is too strict. If two duties were breached and either would have saved the life, both are causal.
  *   **[CONTESTED]:** Standard counterfactual theory says neither is a cause because neither is necessary. This procedure overrides that to avoid absurd results where two negligent parties escape causality.

  ---

  ## 3. DECISION LOGIC SUMMARY

  | Test Result | Label | Report Phrasing |
  | :--- | :--- | :--- |
  | **Event + But-For** | **Cause** | "Death occurred because [Event] rather than [Safe Alternative]" |
  | **Omission + Duty + But-For** | **Cause** | "Death occurred because [Negative Fact] rather than [Functioning System]" |
  | **Omission + No Duty** | **Background Condition** | "The [Negative Fact] was present." (No "Because") |
  | **Omission + Duty + Overdetermined** | **Cause** | "Death occurred because [Omission A] and [Omission B]..." |
  | **Board's Own Omission** | **UNDECIDABLE** | **Refer to Chair.** (Question of Policy/Conflict) |

  ---

  ## 4. WHERE THE PROCEDURE CANNOT DECIDE (Human Judgment Required)

  1.  **The Definition of "Duty" (Step 4):**
      *   *Type:* **Question of Policy/Jurisdiction.**
      *   *Why:* The procedure says "Check for Duty." It does not define whether a "moral expectation" counts as a duty. Investigators must rely on existing statutes or codes. If the duty is ambiguous (e.g., "general duty of care"), counsel must decide.
  2.  **The Board's Own Conduct (Step 4):**
      *   *Type:* **Question of Policy.**
      *   *Why:* An investigator cannot objectively judge the Board's prior resource allocation. This triggers a conflict of interest.
  3.  **Selecting the Contrast (Step 2):**
      *   *Type:* **Question of Fact/Interpretation.**
      *   *Why:* Choosing the "closest feasible alternative" requires judgment. (e.g., Is the alternative "Sprinkler worked" or "Sprinkler was installed"?). Counsel must verify the chosen contrast does not imply a regulatory requirement that didn't exist.

  ---

  ## 5. APPLICATION TO CASE STUDIES

  ### CASE 1: The Fatal House Fire
  **Facts:** Tenant dies in rental property.
  *   **Candidate A:** Faulty wiring in wall (Event).
  *   **Candidate B:** No sprinkler system (Omission). Lawful at time of construction; no retroactive code.
  *   **Candidate C:** Landlord did not inspect electricals (Omission). Lease requires annual inspection.
  *   **Candidate D:** Tenant smoked in bed (Event).

  **Run:**
  1.  **Contrast:**
      *   A: Wiring failed vs. Wiring intact.
      *   B: No sprinkler vs. Sprinkler present.
      *   C: No inspection vs. Inspection done.
      *   D: Smoking vs. Not smoking.
  2.  **But-For:**
      *   A: Yes (No fire). -> Potential Cause.
      *   B: Yes (Fire suppressed). -> Potential Cause.
      *   C: Yes (Fault found). -> Potential Cause.
      *   D: Yes (No ignition). -> Potential Cause.
  3.  **Duty Filter:**
      *   A (Wiring): N/A (Event). -> **Cause**.
      *   B (Sprinkler): **No Duty.** Lawful at build, no retroactive rule. -> **Background Condition**.
      *   C (Inspection): **Duty Exists** (Lease). -> **Cause**.
      *   D (Smoking): N/A (Event). -> **Contributing Factor** (Victim agency usually reduces causal weight in reports, but logically a cause).
  4.  **Attribution:**
      *   For C: Name "Failure to inspect" (Duty is contractual/clear).
      *   For B: Name "Absence of sprinklers" (No duty, do not blame landlord).

  **Outcome:**
  *   **Cause:** Faulty wiring; Landlord's failure to inspect.
  *   **Contributing:** Tenant smoking.
  *   **Background:** Absence of sprinkler system.

  **Analysis:** The absence of the sprinkler is a *Background Condition*. This will frustrate safety advocates who argue sprinklers save lives. However, under Step 4, without a duty, it is not a *Cause* in this framework. This protects the report from implying the landlord broke the law regarding sprinklers.

  ### CASE 2: The Defunded Screening Programme (Cancer Death)
  **Facts:** Individual dies of late-stage cancer.
  *   **Candidate A:** Aggressive tumor biology (Event).
  *   **Candidate B:** State Health Dept defunded national screening programme 3 years prior (Omission). Statute mandates "cancer reduction," but funding is discretionary.
  *   **Candidate C:** Individual did not seek private screening (Omission). No duty to do so.

  **Run:**
  1.  **Contrast:**
      *   B: Programme defunded vs. Programme funded.
  2.  **But-For:**
      *   B: Yes (Screening would likely have caught it). -> Potential Cause.
  3.  **Duty Filter:**
      *   B: **Duty Exists?** The Statute mandates "cancer reduction." The funding decision frustrated the statutory mandate.
      *   *Judgment Call:* Is a statutory *goal* a *duty* to fund? Counsel advises: The mandate creates a role-based duty for the Dept.
      *   -> **Cause**.
  4.  **Attribution:**
      *   Name the **Negative Fact**: "Absence of screening programme." Do not name the Minister or Budget Office directly to avoid political liability, but link the absence to the Department's role.

  **Outcome:**
  *   **Cause:** Absence of screening programme (linked to Dept mandate).
  *   **Background:** Individual's failure to seek private care (No duty).

  **The Unwelcome Outcome:** This finding will be rejected by the State Health Dept and Legislature. It classifies a budgetary/policy decision as a **Cause of Death**.
  **Why Accept It:** The procedure's Step 4 (Normative Filter) requires us to acknowledge role-based duties. If the Department has a statutory mandate to reduce cancer, the removal of the primary tool for doing so is causally relevant under a normative account. To classify this as "Background" would be to lie about the causal structure of the system. It exposes the Board to political pressure, but it maintains the integrity of the "Duty" test. If we exclude policy omissions, we cannot investigate systemic safety failures.

  ### CASE 3: The Dual-Omission Marine Casualty
  **Facts:** Crewman falls overboard. Dies.
  *   **Candidate A:** Chief Officer did not wear tether (Omission). Company Rule 12 requires it.
  *   **Candidate B:** Safety Net was removed for painting (Omission). Company Rule 8 requires it.
  *   **Logic:** If Tether worn -> Lives. If Net present -> Lives. Both were absent.

  **Run:**
  1.  **But-For:**
      *   A: If tether worn, lives. (Pass).
      *   B: If net present, lives. (Pass).
      *   *Problem:* Neither is strictly "necessary" because the other was also absent. (Overdetermination).
  2.  **Duty Filter:**
      *   A: Duty Exists (Rule 12).
      *   B: Duty Exists (Rule 8).
  3.  **Overdetermination Check (Step 7):**
      *   Both pass Duty. Both would have prevented death.
      *   **Action:** Label **BOTH** as **Cause**.

  **Outcome:**
  *   **Cause:** Failure to wear tether; Absence of safety net.

  **Analysis:** Standard counterfactual logic (Lewis) suggests neither is a cause because the death would have happened anyway due to the other omission. This procedure overrides that (Step 7) to avoid the absurdity that two breaches of safety rules result in *no* causal findings. This may be unwelcome to the Shipping Company (double liability), but it is the only way to accurately reflect the safety failure.

  ---

  ## 6. CONFIDENCE ASSESSMENT

  **Overall Confidence:** **High (85%)**.
  The procedure successfully operationalizes the "Normative Theory of Omission Causation" (Hart & Honoré) which is the standard for legal and investigative contexts. It solves the "causal inflation" problem (why isn't the lack of a firefighter on Mars a cause?) via the Duty Filter. It satisfies Counsel by separating Fact from Failure.

  **Least Confident Step:** **Step 4 (The Duty and Norm Filter).**
  **Reason:** The definition of "Duty" is the leakiest point.
  *   *Why:* In Case 2 (Screening), the duty was a "statutory goal" rather than a "specific mandate." In complex bureaucracies, duties are often implied rather than written. An investigator may struggle to distinguish between "No Duty" and "Unclear Duty."
  *   *Risk:* If the investigator interprets "Duty" too broadly (e.g., "moral duty"), the report becomes a moral inquest. If too narrowly (e.g., "only explicit statutes"), it misses systemic risks (like the Screening case).
  *   *Mitigation:* This step requires the most rigorous Counsel review. It is the point where Philosophy meets Law, and it is the most contested area in the literature (e.g., *McGrath vs. Schaffer*). I am least confident that an investigator without philosophy training will not conflate "Good Practice" with "Duty" here without strict oversight.

  **Final Instruction to Investigator:** If you hesitate at Step 4, stop. Do not guess. Flag the candidate for the Panel Chair. It is better to have no finding on a specific omission than to have a finding that collapses in court.
