answer: |-
  Here are nine questions designed to move past exegesis and into the structural weaknesses and narrative applications of Updateless Decision Theory (UDT). Each includes the likely defense you will hear and a follow-up designed to prevent him from retreating into technicalities.

  ### 1. The Object of Evaluation
  **Question:** In my novel, a character discovers her deliberation is a shared routine running in multiple heads. She begins evaluating whole life-stories rather than individual acts, a view I'm calling "narrative updatelessness." Is this a genuine extension of UDT—expanding the action space to include narrative arcs—or is it merely UDT with a novelist's vocabulary? Where is the functional difference?

  *   **Likely Answer:** He will likely say it is the latter: UDT already evaluates policies (functions from states to actions), and a "life story" is just a long-horizon policy. He'll argue the math doesn't change, only the granularity.
  *   **Follow-up:** "If the math doesn't change, then the *output* shouldn't change. But for Mireille, the shift changes which choices feel rational. If UDT is purely extensional, why does redescribing the policy as a 'narrative' alter the agent's confidence in the selection? Are you saying the phenomenology of choice is irrelevant to the decision theory, or does UDT actually require the agent to *feel* like they are choosing a story to function correctly?"

  ### 2. The Ex Ante Circularity
  **Question:** UDT requires committing to a policy from an *ex ante* standpoint, before observing your specific situation. But to choose the optimal policy, you must know how your algorithm will resolve future dilemmas. Doesn't this create a circle? You need the policy to determine the act, but you need to know the act to validate the policy. How is this fixed point specified without begging the question?

  *   **Likely Answer:** He will invoke logical counterfactuals or fixed-point theorems. He'll say the agent considers all possible policies, simulates the outcomes (including their own logical behavior), and selects the one with highest expected utility.
  *   **Follow-up:** "But that simulation requires the agent to already be running the algorithm they are trying to select. If I am trying to decide whether to be a UDT agent, I must already be running a procedure to evaluate that decision. Are we not just pushing the homunculus back one step? What grounds the *first* commitment if the agent's reasoning engine is itself part of the variable being optimized?"

  ### 3. The Prior Problem
  **Question:** Updatelessness relies heavily on the prior. You maximize expected utility relative to a prior distribution over logical possibilities. But where does that prior come from? If two agents have different priors, UDT will tell them to make contradictory commitments. Is the rationality of the policy objective, or is it relative to an arbitrary starting distribution?

  *   **Likely Answer:** He will likely appeal to a "universal prior" (like Solomonoff induction) or argue that in cases of logical correlation (like copies), the prior is constrained by the logical structure of the computation itself.
  *   **Follow-up:** "Logical structure constrains what is *possible*, not what is *probable*. If Mireille and her copy share a prior, they cooperate. If their priors diverge even slightly on the probability of being in a simulation versus base reality, the acausal trade collapses. Does UDT effectively require agents to pre-agree on a prior before they exist? And if so, isn't that just kicking the can of coordination down the road?"

  ### 4. Learning and Indexical Information
  **Question:** In ordinary life, we learn where and who we are. UDT says don't update on that information, but rather index your policy to it. But if I choose a policy in ignorance that says 'If I see X, do Y,' and then I see X, hasn't the ignorance lifted? At what point does adhering to the pre-committed policy become irrational stubbornness rather than updateless consistency?

  *   **Likely Answer:** He will argue that "updating" is just selecting the sub-policy relevant to the current observation. You don't discard the *ex ante* plan; you simply execute the branch of the function that corresponds to your new data.
  *   **Follow-up:** "That works if the world matches the function's domain. But what if the agent learns something that undermines the *premise* of the commitment? Suppose Mireille commits to a narrative assuming she is one of ten copies, but then finds evidence she is the *only* one. If she sticks to the 'ten copies' policy, she loses utility. When does the 'indexical' defense become a refusal to acknowledge that the game has changed?"

  ### 5. Uncertainty About One's Own Theory
  **Question:** Most of us aren't sure we're rational, let alone sure we're updateless agents. What does UDT prescribe for an agent who suspects they might be a Causal Decision Theory (CDT) agent masquerading as UDT? Can UDT recommend adopting itself, or does it only apply to those who are already running the code?

  *   **Likely Answer:** He will likely say UDT is normative, not descriptive. It tells you what you *should* run. If you are uncertain, you should run the meta-algorithm that selects the best decision theory, which will likely be UDT.
  *   **Follow-up:** "But to run that meta-algorithm, I need to evaluate the consequences of switching theories. If I'm currently a CDT agent, my evaluation of 'switching to UDT' will be flawed by CDT logic. I'll see the switch as costly with no causal benefit. How does UDT get a foothold in an agent who isn't already using it? Is it a conversion experience or a computational upgrade?"

  ### 6. Copies vs. Strangers
  **Question:** Mireille's strangers are stipulated to be identical copies, which makes the logical correlation clean. In the real world, people are not copies; they are merely similar. Does UDT's argument for acausal cooperation collapse when the correlation is imperfect? At what percentage of similarity does the 'updateless' obligation to cooperate vanish?

  *   **Likely Answer:** He will argue it's not binary. The obligation scales with the degree of logical correlation. If you are 90% sure the other agent reasons like you, you should cooperate 90% as much as you would with a copy.
  *   **Follow-up:** "But that requires me to know the other agent's source code. In fiction, I can stipulate Mireille knows this. In reality, I only see behavior. If I have to infer their algorithm from their actions, I have to update on evidence. Doesn't the need to estimate the correlation force me back into an updateful framework? How can I be updateless about a correlation I can only discover through observation?"

  ### 7. The Action-Guidance Charge
  **Question:** A common charge against UDT is that it isn't action-guiding. If the optimal policy is determined *ex ante*, and my current deliberation is just that policy executing, then my feeling of weighing options is an illusion. The output is already fixed by the policy selection. What work is the deliberation actually doing?

  *   **Likely Answer:** He will say deliberation is the physical process of computing the policy. It's not an illusion; it's the calculation. The output isn't fixed *until* the calculation is run.
  *   **Follow-up:** "But if the calculation is deterministic, the output is fixed by the initial state of the universe. If I am truly updateless, I am not choosing the act; I am the locus where the policy reveals itself. If that's true, why should I bother to deliberate hard? If the policy is optimal, it should be robust to my deliberation being lazy. Does UDT inadvertently recommend intellectual sloth if the policy is already set?"

  ### 8. Falsification
  **Question:** I want to ask a direct question about your commitment to this view. What argument, case, or piece of evidence could turn you against UDT? Is there a scenario where UDT yields an answer so counter-intuitive or practically disastrous that you would abandon the framework?

  *   **Likely Answer:** He might suggest a case where UDT leads to "extortion" by predictors (e.g., Counterfactual Mugging with very low probability but huge stakes) or where computational intractability makes it impossible to implement.
  *   **Follow-up:** "If computational intractability is the dealbreaker, then UDT is an ideal theory that no human can ever use. If it's an ideal theory that no human can use, in what sense is it a theory of *rationality* rather than a theory of *omniscience*? Are you defending a norm for humans, or a property of abstract agents?"

  ### 9. Fiction vs. Toy Dilemmas (The Closer)
  **Question:** Philosophers rely on Newcomb's Box and Prisoner's Dilemma. I'm arguing fiction is a better laboratory because it forces us to model the *agent* rather than just the *payoff matrix*. Toy models strip away the psychology that makes decision theory hard. Do you think fiction offers a rigorous test for decision theory, or does it just add noise that obscures the logical structure you're trying to isolate?

  *   **Likely Answer:** He will likely be polite and say fiction is "interesting" or "illustrative," but that toy models are necessary for precision. He might compliment your novel as a good thought experiment.
  *   **Follow-up:** "I appreciate the compliment, but I want to press the 'noise' point. If the 'noise'—the psychology, the history, the narrative—is actually part of the causal structure of the decision, then stripping it away isn't precision, it's distortion. If UDT can't handle the messiness of a character like Mireille without stipulating away her humanity, isn't that a bug in the theory? Does UDT only work in a world where agents are simpler than people?"
