answer: |-
  **Title:** The Coherence of Local Functional Equivalence in Gradual Replacement Arguments

  **Project Overview**
  The "Fading Qualia" or "Gradual Replacement" argument is a staple of contemporary philosophy of mind. It posits that if a biological brain is replaced neuron-by-neuron with functionally equivalent silicon components, behavioral output remains constant at every stage. Since it is absurd to suppose consciousness flickers on and off with each chip installation, experience must be preserved throughout. The conclusion is standard functionalism: what matters for mind is the program, not the tissue.

  While this argument is often treated as a decisive refutation of biological naturalism, its technical premises are rarely scrutinized by those who deploy it. My machine learning colleagues treat the functional equivalence of components as trivial. However, three specific metaphysical worries suggest the argument relies on an unstated and potentially incoherent premise regarding how component functions are defined within a system.

  1.  **The Decomposition Worry:** In densely recurrent systems (like cortex), a unit's contribution is fixed only relative to a specific carving of the system. Defining a component's input–output profile independently presupposes a modularity that may not exist.
  2.  **The Limit Worry:** Equivalence at stage *n* is anchored by the surviving biological tissue. As the biological remainder shrinks, the anchor vanishes. Equivalence at finite stages does not guarantee equivalence at the limit (the fully silicon system).
  3.  **The Hidden-State Worry:** Biological units possess internal dynamics (adaptation, fatigue) not recoverable from finite input–output windows. Matching behavior over a window is not true functional equivalence.

  This proposal seeks to isolate which of these worries is fatal to the replacement argument and to determine whether the argument can be repaired or must be abandoned.

  **The Research Question**
  Existing literature typically assumes functional equivalence is well-defined and argues about whether it suffices for consciousness. This leaves the prior metaphysical question open: **Is the relation of 'local functional equivalence' coherent in densely recurrent systems absent a fixed biological anchor?**

  This question admits a determinate answer. Either a non-circular definition of local equivalence can be provided that sustains the transition to the limit, or it cannot. If it cannot, the standard replacement argument fails before it reaches the question of consciousness. If it can, the definition will reveal substantive constraints on implementation that functionalists have not acknowledged.

  **Diagnostic Assessment of the Worries**
  I hypothesize that the **Decomposition Worry** is doing the real philosophical work, while the Limit and Hidden-State worries are derivative or red herrings.

  The Hidden-State Worry is largely empirical. While true that biological neurons have complex dynamics, a functionalist can stipulate idealized units for the sake of argument. Dismissing the replacement argument on these grounds concedes too much to the skeptic; it suggests we simply need better chips, not that the argument is flawed in principle.

  The Limit Worry is significant but depends on the Decomposition Worry. If we can define a component's function independently of the global state (solving Decomposition), the anchor problem dissolves because the function is intrinsic to the component, not relational to the biology. However, if a component's function is defined by its role in the specific biological network, then as the network changes, the definition shifts. Thus, the Limit Worry is a symptom of the Decomposition Worry.

  The Decomposition Worry strikes at the heart of the implementation metaphysics. In a recurrent network, input to unit *A* depends on the output of unit *B*, which depends on *A*. To specify *A*'s function independently, one must hold the rest of the system fixed. But if the rest of the system is also being replaced, what fixes the context? If we define the silicon chip's job as "doing what the neuron would have done given the *current* global state," we are not specifying a component; we are specifying a placeholder for the whole system's dynamics. This renders the "local" replacement impossible in principle.

  **Methodology and Work Plan**
  I have ten weeks to resolve this. Since the problem is conceptual, I will not conduct empirical neuroscience. Instead, I will construct a formal toy model to test the coherence of the equivalence relation.

  *   **Weeks 1–3: Formal Reconstruction.** I will formalize the Gradual Replacement Argument in terms of state-transition functions. I will define "local functional equivalence" precisely, distinguishing between *intrinsic* equivalence (the chip has the same transfer function regardless of context) and *relational* equivalence (the chip produces the same output given the specific current state of the network). I will map the Decomposition Worry onto this formalism to show where circularity arises.
  *   **Weeks 4–7: Toy Modeling.** I will construct a minimal mathematical model of a recurrent neural network (e.g., a simple Hopfield network or continuous-time recurrent net). I will simulate a replacement sequence.
      *   *Task:* Attempt to define a replacement rule for a single node that preserves global dynamics without referencing the global state in the definition of the node itself.
      *   *Test:* If the rule requires knowledge of the global state to define the local function, the "local" replacement is illusory. I will track whether the definition of the chip's function drifts as more nodes are replaced.
  *   **Weeks 8–9: Analysis of the Limit.** Using the model, I will examine the transition to the limit case. If the definition of equivalence drifts, I will demonstrate that the final silicon system is not functionally equivalent to the initial biological system, even if every intermediate step preserved behavior. This would validate the Limit Worry as a consequence of Decomposition.
  *   **Week 10: Synthesis and Drafting.** I will synthesize the results into a draft paper. The conclusion will either offer a repaired definition of functional equivalence (showing what *actually* needs to be preserved, likely global dynamics rather than local function) or a proof that the standard argument is ill-posed.

  **Success and Failure Conditions**
  A **successful outcome** will look like one of two things:
  1.  **A Negative Result:** A demonstration that "local functional equivalence" is ill-defined in recurrent systems without referencing the global state. This would show that the replacement argument proves less than advertised: it does not establish substrate independence, but rather that only the *global* dynamical structure matters, which may be harder to implement in silicon than functionalists assume.
  2.  **A Repaired Argument:** A precise formulation of the conditions under which local replacement is valid (e.g., requiring feedforward approximations or specific modularity constraints). This would narrow the scope of functionalism to systems that meet these criteria.

  **Project failure** would consist of merely clarifying the terms without reaching a conclusion about coherence. If I end the semester having only distinguished the three worries without showing which one breaks the argument, the project will have served as a useful taxonomy but failed to advance the debate. Another failure mode is getting bogged down in the empirical details of the Hidden-State Worry, losing the metaphysical focus.

  **Scope Assessment**
  Is this a semester project or a dissertation?
  For the purposes of this workshop and a subsequent journal article, this is a **semester-sized project**. The core logical point regarding decomposition in recurrent systems can be established via the toy model and formal analysis within ten weeks. The argument is narrow enough to be decisive: either the definition holds or it doesn't.

  However, the *implications* of this project are dissertation-sized. If local functional equivalence is incoherent, it undermines not just the replacement argument, but much of computational functionalism in philosophy of mind. It suggests that implementation details matter more than standard functionalism allows, potentially bridging the gap between metaphysics and cognitive science. If the project succeeds, it provides a foundational chapter for a thesis on the metaphysics of cognitive implementation. If it fails, it still provides a necessary clarification for why that metaphysics is so difficult to articulate.

  **Relevance to Audience**
  For philosophers of mind and cognitive scientists working on consciousness, this matters because many theories (Global Workspace, Higher-Order, Predictive Processing) assume functional realizability. If the functional description itself cannot be coherently transferred between substrates due to decomposition issues, then debates about *which* function produces consciousness are premature. We must first know if the function can exist independently of the tissue. This proposal offers a way to test that independence without getting bogged down in the hard problem of consciousness itself. By focusing on the metaphysics of implementation, I aim to clear the ground for more robust theories of mind.
