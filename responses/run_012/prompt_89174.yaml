  0.44

  **Decomposition**

  1.  **Objective Value (0.75):** There are mind-independent reasons to value art, not merely subjective preferences or social agreements.
      *   *Justification:* While taste varies, the capacity for artistic mastery to command cross-cultural respect suggests a non-arbitrary core.
  2.  **Token Identity (0.75):** Artistic value attaches primarily to the specific historical token, not the reproducible type.
      *   *Justification:* We mourn the loss of the *Mona Lisa* even if perfect photos remain, indicating the object's singularity matters.
  3.  **Deception vs. Duplication (0.55):** A duplicate honestly presented as such still lacks the value of the original.
      *   *Justification:* Museums label copies clearly, yet visitors still queue for the original, suggesting the defect persists without the lie.
  4.  **Ontic vs. Epistemic (0.35):** The value difference exists in the object's history (ontic), not merely in our knowledge of it (epistemic).
      *   *Justification:* **Detection Case:** If a forgery is never detected, it functions socially as the original; if value vanishes upon later discovery, the value was epistemic (a), defeating RAC.
  5.  **Identity Continuity (0.60):** An object can remain the "original" despite total material replacement if historical continuity is preserved.
      *   *Justification:* **Conservation Case:** A ship-of-Theseus painting is valued as the original due to causal continuity, implying material atoms are less crucial than historical trajectory.
  6.  **Causal Constraint (0.65):** The value of art includes the specific causal history of its creation (the artist's act), which a duplicate cannot share.
      *   *Justification:* This is the missing term: a duplicate lacks the *performance* of creation, which is a non-experiential property of the object's genesis.

  **Combination Rule**
  I treat **Objective Value (Q1)** as a gatekeeper: if aesthetic value is purely subjective, RAC is false (0). If objective, RAC's probability is the arithmetic mean of the remaining five conditions (Q2–Q6), which represent independent arguments for why that objective value clings to the original token.
  $$ \text{Credence} = P(Q1) \times \frac{\sum_{i=2}^{6} P(Qi)}{5} $$
  $$ 0.75 \times \frac{0.75 + 0.55 + 0.35 + 0.60 + 0.65}{5} = 0.75 \times 0.58 = 0.435 \approx 0.44 $$

  **Sensitivity Analysis**
  My number is most sensitive to **Q4 (Ontic vs. Epistemic)**.
  *   **Why:** This is the bottleneck for the "residual" claim. If the value difference is purely epistemic (we value it because we *know* it's real), it collapses into category (a) (experience modified by knowledge) or (b) (social status). For RAC to be true, the history must confer value even if no one knows it.
  *   **Evidence to move it:** I would need a thought experiment or empirical case where an object's market and experiential profile remained identical, yet experts unanimously agreed its value changed solely due to a change in its hidden history (e.g., a "time capsule" test where a work is re-evaluated blindly after its provenance is irrevocably altered but kept secret from the evaluators).

  **Calibration: You (0.3) vs. Friend (0.75)**
  Your disagreement almost certainly lives on **Q4 (Ontic vs. Epistemic)** and **Q1 (Objective Value)**.
  *   **You (0.3):** You likely treat Q4 as near 0. You suspect that if no one knows the difference, there is no difference in value, meaning all value cashes out into experience (a) or social facts (b). You may also lean toward anti-realism on Q1.
  *   **Friend (0.75):** They likely treat Q4 as near 0.9. They believe the history of the object *itself* holds value, akin to a relic, regardless of human knowledge. They likely assume strong aesthetic realism on Q1.
  *   **How to find out:** Stop arguing about "forgeries" generally. Argue specifically about the **Undetectable Forgery**. Ask your friend: "If a perfect duplicate is made, buried for 100 years, found, and no one can ever distinguish it from the original, is it *objectively* less valuable even if the art world accepts it as real?" If they say yes, they are committed to a metaphysical claim about history that you reject. That is the precise fault line.
