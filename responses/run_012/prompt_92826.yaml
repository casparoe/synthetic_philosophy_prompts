answer: |-
  This is a sharp observation, and you are right to feel that existing terminology is slightly off-target. You have identified a *cybernetic* structure (a feedback loop) where most existing terms describe a *linear* trajectory (medicalization, creep) or a *normative* warning (slippery slope).

  Here is a breakdown of the existing neighborhood, why they don't quite fit, and a proposal for how to carve out the concept you need for your dissertation.

  ### 1. The Existing Neighborhood (and why they miss the mark)

  You likely know these, but it is worth stating explicitly why they are insufficient for your specific mechanism:

  *   **Medicalization (Conrad, Zola, Illich):** This describes the *process* of defining non-medical problems as medical. It captures the "Enhancement $\rightarrow$ Therapy" move (Half 2 of your pattern) but is generally agnostic about the feedback effect on the baseline. It treats medicalization as an expansion of jurisdiction, not necessarily a redefinition of the "normal" reference class that then necessitates further expansion.
  *   **Diagnostic Creep / Expansion:** This captures the "Therapy $\rightarrow$ Universal Norm" move (Half 1). It describes the lowering of thresholds (e.g., hypertension guidelines dropping from 140/90 to 130/80). However, it usually frames this as a discrete event or a policy decision, not as a recursive loop driven by the intervention itself.
  *   **Ian Hacking's "Looping Effects of Human Kinds":** This is your closest theoretical ancestor in STS. Hacking argues that classifying people changes how they act, which changes the classification. However, Hacking focuses on *interactive kinds* (people reacting to labels). Your pattern is about *interventions* altering the *ontological baseline* of functioning. It is a "technological looping effect" rather than a "sociological looping effect."
  *   **Slippery Slope Arguments:** These are normative warnings about future consequences. Your pattern is a *descriptive* mechanism of how the present is constituted. Calling it a slippery slope dismisses the local rationality of each step, which you correctly note is the feature that makes it politically robust.
  *   **Supply-Induced Demand:** This is economic (Roemer's Law: "a built bed is a filled bed"). It explains *why* providers might push the loop, but it doesn't describe the *conceptual* shift in what counts as "disease" vs. "normal."

  ### 2. Proposal for a Coinage

  Since no single term captures the *recursive, baseline-shifting, intervention-driven* nature of this loop, I recommend coining a term. It is a genuine conceptual contribution.

  **Suggested Term:** **Therapeutic Baseline Recalibration (TBR)**
  **Alternative:** **Recursive Therapeuticization**

  **Definition:**
  *Therapeutic Baseline Recalibration* is a socio-technical feedback mechanism wherein the widespread adoption of a biomedical intervention alters the statistical or normative baseline of species-typical functioning. This shift reclassifies the pre-intervention state as pathological or "at-risk," thereby expanding the indication for the intervention and further solidifying the new baseline.

  **The Mechanism (The "Carving"):**
  1.  **Intervention Introduction:** A technology/drug enters for a clear pathology ($T_0$).
  2.  **Baseline Shift:** Widespread use makes the *treated state* the new statistical norm ($N_1$).
  3.  **Ontological Reclassification:** The untreated state ($T_0$) is now measured against $N_1$ and appears as a deficit.
  4.  **Indication Expansion:** The intervention is now indicated for the "deficit" ($T_0$), which was previously normal.
  5.  **Recursion:** Widespread use for $T_0$ shifts the baseline again to $N_2$.

  ### 3. Differentiation (What it is and isn't)

  To defend this in your dissertation, you need to mark the boundaries clearly:

  *   **Vs. Plain Medicalization:** Medicalization can happen without a technological baseline shift (e.g., labeling grief as depression). TBR *requires* the intervention to physically or functionally alter the population average, which then renders the old average "sick."
  *   **Vs. Slippery Slope:** A slippery slope implies a loss of control or moral degradation. TBR is locally rational at every step. A committee lowering the blood pressure threshold is acting on data that says "risk lowers continuously." TBR explains why that data exists (because the population is medicated) without accusing the committee of bad faith.
  *   **Vs. Supply-Induced Demand:** Supply-induced demand assumes the *need* is constant but the *supply* creates utilization. TBR argues the *need itself is mutable* and is constructed by the supply.
  *   **Vs. The "Red Queen Effect":** In evolutionary biology, species must run to stay in place. TBR is similar but specific to *normative standards of health* rather than competitive survival.

  ### 4. Boundary Conditions (Where the loop stops)

  A good concept needs limits. Where does TBR *not* apply?

  1.  **Biological Ceilings/Floors:** You cannot recalibrate the baseline for height beyond biological limits, no matter how much growth hormone you use. The loop stalls when the intervention hits physiological hard limits.
  2.  **Cost/Resource Constraints:** If the intervention is too expensive (e.g., gene therapy at $2M/dose), it cannot become widespread enough to shift the statistical baseline. TBR requires *mass* adoption.
  3.  **Political/Identity Resistance:** This is where Disability Studies is crucial. If a group successfully argues that their state is not a deficit (e.g., Deaf culture, Neurodiversity), they can block the "Ontological Reclassification" step. The loop breaks if the "deficit" is reclaimed as identity.
  4.  **Side Effect Profiles:** If the intervention carries high risk (e.g., chemotherapy), it will not be adopted for "enhancement" or mild deficits. TBR thrives on low-risk, high-diffusion interventions (e.g., SSRIs, statins, stimulants).

  ### 5. Secondary Question: Non-Medical Analogues

  Your hunch is correct. This loop is a general feature of **optimization systems**.

  *   **Education (The "Gifted" Loop):**
      *   *Enhancement:* Private tutoring/test prep starts as an enhancement for college admissions.
      *   *Therapy:* It becomes "necessary support" for learning differences or "college readiness."
      *   *Recalibration:* The curriculum assumes the prep. Students without prep now test as "deficient" or "learning disabled." The baseline for "normal academic functioning" has shifted to include the enhancement.
  *   **Fitness Wearables (The "10,000 Steps" Loop):**
      *   *Enhancement:* 10,000 steps was a marketing campaign (Japan, 1960s) for a pedometer.
      *   *Therapy:* It was adopted by health orgs as a "minimum for health."
      *   *Recalibration:* Now, <7,000 steps is often flagged as "sedentary risk." The marketing target became the clinical floor.
  *   **Digital Attention (The "Focus" Loop):**
      *   *Enhancement:* Noise-canceling headphones/focus apps start as productivity boosters.
      *   *Therapy:* They become "accommodations" for attention deficits.
      *   *Recalibration:* Open offices become louder (because everyone has headphones). The baseline for "normal work environment" shifts to require isolation. Without the tech, the environment is now "hostile" or "disabling."
  *   **Economics (Goodhart's Law):**
      *   "When a measure becomes a target, it ceases to be a good measure."
      *   TBR is essentially **Goodhart's Law applied to Biological Norms.** When "health" becomes a target managed by intervention, the measure of health shifts to match the intervention.

  ### 6. Recommendation for the Dissertation

  If I were in your committee, I would look for you to engage with **Ian Hacking (Looping Effects)** and **Nikolas Rose (Pharmaceutical Citizenship/Neurochemical Self)**. Rose specifically discusses how psychopharmaceuticals change how we understand ourselves, but he focuses more on *subjectivity* than on the *clinical baseline*.

  **My advice:** Coin **"Therapeutic Baseline Recalibration."**
  It is precise, descriptive, and distinguishes the *mechanism* (recalibration) from the *outcome* (medicalization). It allows you to argue that the therapy/enhancement distinction isn't just blurry; it is *dynamically unstable* because the intervention actively dissolves the boundary that justifies it.

  This frames your contribution not just as "another critique of enhancement," but as an analysis of the *systemic logic* of biomedicine. That is dissertation-worthy.
