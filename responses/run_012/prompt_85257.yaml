answer: |-
  ### Decision Tree: The Logical Space of Public Justification

  **Instructions for Respondents:** Proceed through the nodes sequentially. Answer each claim based on your intuitive commitment to the principle described, not based on the theorist you think holds it. Branch left (A) or right (B) at each node.

  #### Branch Nodes

  **Node 1: The Structure of Justification**
  *Claim:* "For a coercive law to be legitimate, every citizen bound by it must be able to accept the *same* justificatory reason (Consensus), OR it is sufficient that each citizen has *their own* sufficient reason for accepting it, even if those reasons differ (Convergence)."
  *   **A (Consensus):** Proceed to Node 2.
  *   **B (Convergence):** Proceed to Node 8.

  **Node 2: The Object of Constraint (Consensus Path)**
  *Claim:* "The requirement for public reasons restricts the *content* of the law (the law must be justifiable by public reasons), OR it restricts the *conduct* of the arguer (one must not speak using non-public reasons)."
  *   **A (Content):** Proceed to Node 3.
  *   **B (Conduct):** Proceed to Node 7.

  **Node 3: Religious Sufficiency (Content Path)**
  *Claim:* "A religious reason, standing entirely alone without secular support, can never constitute a valid justification for coercive law, OR it can be valid provided it meets further conditions."
  *   **A (Never Valid):** Proceed to Node 4.
  *   **B (Conditionally Valid):** Proceed to Node 5.

  **Node 4: Scope of Exclusion**
  *Claim:* "The bar on religious reasons applies to all citizens in civil society (voters, activists), OR it applies only to officials acting in their public capacity (legislators, judges)."
  *   **A (All Citizens):** **Leaf 1 (Strict Exclusion)**
  *   **B (Officials Only):** **Leaf 2 (Asymmetric Exclusion)**

  **Node 5: Mechanism of Admission**
  *Claim:* "To be admissible, a religious reason must be *translated* into public language (the religious content is replaced), OR it must be *accompanied* by a public reason (the religious content remains but is supplemented)."
  *   **A (Translated/Replaced):** Proceed to Node 6.
  *   **B (Accompanied/Supplemented):** Proceed to Node 6.
      *(Note: Node 6 distinguishes the timing/nature of the supplement, which separates Translation from Proviso views.)*

  **Node 6: Burden and Timing**
  *Claim:* "The speaker bears the burden to provide the public equivalent immediately (Simultaneous/Translation), OR it is sufficient that a public reason exists in principle and may be supplied eventually (Eventual/Proviso)."
  *   **A (Immediate/Translation):** **Leaf 3 (Translation View)**
  *   **B (Eventual/Proviso):** **Leaf 4 (Proviso View)**
      *(Note: If the respondent insists the religious reason must be 'converted' rather than 'accompanied,' they land on Translation. If 'accompanied,' they land on Proviso. For the sake of the tree, treat 'Translation' as Node 5A and 'Supplement' as Node 5B. Let us refine Node 5/6 split for clarity.)*
      *Correction for Logical Flow:* Let's split Node 5 into 5 and 6 properly.
      *Revised Node 5:* "Must the religious reason be *converted* into secular terms to count (Translation), or merely *paired* with them (Supplementation)?"
      *   **A (Converted):** **Leaf 3 (Translation View)**
      *   **B (Paired):** Proceed to Node 6.
      *Revised Node 6:* "Must the paired public reason be offered *simultaneously* with the religious one, or is it sufficient if it is available *eventually*?"
      *   **A (Simultaneous):** **Leaf 4 (Strong Proviso)**
      *   **B (Eventually):** **Leaf 5 (Weak Proviso)**

  **Node 7: Scope of Conduct Constraint**
  *Claim:* "The duty to refrain from religious advocacy binds ordinary citizens in political discourse, OR it binds only officials in formal deliberation."
  *   **A (Citizens):** **Leaf 6 (Civic Restraint)**
  *   **B (Officials):** **Leaf 7 (Official Restraint)**
      *(Note: See diagnosis below on the distinctness of these leaves.)*

  **Node 8: Intelligibility Constraint (Convergence Path)**
  *Claim:* "Even if reasons need not be shared, they must be *intelligible* (comprehensible) to non-believers, OR reasons can remain entirely internal to a specific epistemic community."
  *   **A (Intelligible):** Proceed to Node 9.
  *   **B (Internal/Non-Intelligible):** **Leaf 8 (Inclusionist View)**

  **Node 9: Moral Constraints on Convergence**
  *Claim:* "Convergent reasons must still meet a threshold of public morality (e.g., no racist reasons), OR any sincere reason sufficient for the agent is admissible."
  *   **A (Moral Threshold):** **Leaf 9 (Convergence View)**
  *   **B (No Threshold):** **Leaf 10 (Radical Convergence)**
      *(Note: See diagnosis below on the viability of Leaf 10.)*

  ---

  ### Leaf Diagnoses

  **Leaf 1: Strict Exclusion**
  *   **Standard Label:** Secularism / Audi-style Exclusionism.
  *   **Awkward Commitment:** You must argue that a citizen voting solely on the basis of their conscience regarding the sanctity of life is acting illegitimately, even if they hold no public office.

  **Leaf 2: Asymmetric Exclusion**
  *   **Standard Label:** Larmore-style Neutrality.
  *   **Awkward Commitment:** You must defend why a legislator is forbidden from using religious reasons while the constituent lobbying them is permitted to do so, despite both influencing coercion.

  **Leaf 3: Translation View**
  *   **Standard Label:** Civic Liberalism (Gutmann/Thompson).
  *   **Awkward Commitment:** You must claim that the *meaning* of a religious conviction can be fully preserved when stripped of its theological vocabulary and rendered in secular terms.

  **Leaf 4: Strong Proviso**
  *   **Standard Label:** Habermasian Institutional Translation.
  *   **Awkward Commitment:** You require citizens to perform a cognitive split during advocacy, articulating a secular reason they may not personally find motivating, merely to satisfy procedural rules.

  **Leaf 5: Weak Proviso**
  *   **Standard Label:** Rawlsian Wide Public Reason.
  *   **Awkward Commitment:** You allow religious arguments to dominate public discourse for years, provided a public reason is theoretically available "in due course," which may never arrive.

  **Leaf 6: Civic Restraint**
  *   **Standard Label:** Civil Society Restraint.
  *   **Awkward Commitment:** You bind the voter in the voting booth to public reason but leave the legislator on the floor unbound (or vice versa), creating a disconnect between the mandate and the agent.
      *(Flag: Indistinguishable from Leaf 1 or 2 in practice depending on how "conduct" is enforced.)*

  **Leaf 7: Official Restraint**
  *   **Standard Label:** Rawlsian Duty of Civility.
  *   **Awkward Commitment:** You treat the formal speech of officials as the sole locus of legitimacy, rendering the cultural pressure citizens exert on those officials irrelevant to justification.
      *(Flag: Indistinguishable from Leaf 5 if the "conduct" constraint implies the "content" constraint.)*

  **Leaf 8: Inclusionist View**
  *   **Standard Label:** Wolterstorff-style Religious Liberty.
  *   **Awkward Commitment:** You must accept that a law can be legitimate even if the majority of those bound by it find the justification unintelligible nonsense, provided the legislator believes it.

  **Leaf 9: Convergence View**
  *   **Standard Label:** Gaus-Vallier Public Justification.
  *   **Awkward Commitment:** You must accept that a law is justified even if no single reason is shared by the public, potentially fragmenting the civic bond into isolated silos of reasoning.

  **Leaf 10: Radical Convergence**
  *   **Standard Label:** Unrestricted Pluralism.
  *   **Awkward Commitment:** You have no logical resource to condemn a law justified solely by a racist or sectarian reason, provided the holder of that reason finds it sufficient.
      *(Diagnosis: **Incoherent/Unattractive.** Most convergence theorists reject this leaf by adding Node 9's moral threshold.)*

  ---

  ### Diagnostic Notes on Logical Space

  **1. Indistinguishable Leaves**
  *   **Leaf 6 (Civic Restraint) & Leaf 7 (Official Restraint):** Under the "Conduct" branch (Node 2), these leaves risk collapsing. If the constraint is on *speech*, but the law's *content* is not constrained (Node 2B), the view becomes purely procedural. Most theorists who choose Node 2B (Conduct) eventually admit that conduct shapes content, pushing them back toward Node 2A (Content). If your students land here, ask them if a legislator can vote for a law they cannot publicly defend. If "no," they are actually on the Content branch.
  *   **Leaf 4 (Strong Proviso) & Leaf 3 (Translation):** If the "public reason" required by the Proviso must be equivalent in weight and meaning to the religious reason, the view functionally becomes the Translation view. The distinction holds only if the public reason can be thinner or distinct from the religious motivation.

  **2. Empty or Incoherent Combinations**
  *   **Consensus + Inclusionist (Node 1A + Node 8B):** This combination is **incoherent**. If legitimacy requires a *shared* reason (Consensus), a reason that is *internal/non-intelligible* to others cannot be shared. Students who select this path have not grasped the definition of Consensus.
  *   **Convergence + Strict Exclusion (Node 1B + Node 3A):** This combination is **unattractive/unmotivated**. If legitimacy allows for *different* sufficient reasons (Convergence), there is no logical ground to exclude religious reasons specifically unless they are deemed "not reasons" at all. This position usually collapses into Leaf 1 (by secretly adopting Consensus) or Leaf 9 (by admitting religious reasons).
  *   **Leaf 10 (Radical Convergence):** As noted, this is **unexplored/undefended**. No serious theorist defends a convergence view without a moral filter (Node 9), as it permits "convergence" on tyranny.

  **3. Consensus vs. Live Disagreements**
  *   **Settled Points:** There is near-universal agreement among public reason liberals that *coercion requires justification* (the starting point of Node 1). There is also broad agreement that *purely sectarian reasons without any public anchor* are problematic in a pluralistic society (which motivates the tree itself).
  *   **Live Disagreements:**
      *   **Consensus vs. Convergence (Node 1):** This is the primary fault line in contemporary literature (Rawlsians vs. Justificatory Liberals). Do not treat Consensus as the default; Convergence is the dominant challenger.
      *   **Citizens vs. Officials (Node 4 & 7):** This is highly contested. Rawls shifted his view on this over time; Audi holds one side, Vallier the other.
      *   **Translation vs. Proviso (Node 5):** This is a live dispute between secularists who want religion "cleaned up" before entry (Translation) and those who allow religion in so long as secular support exists (Proviso).
      *   **Content vs. Conduct (Node 2):** Often treated as settled (Content), but some deliberative democrats argue for Conduct. This is a subtle but live disagreement regarding whether the *law* or the *discourse* is the site of legitimacy.

  **Instruction for Seminar Use:**
  Have students trace their own path first. If they land on an "Incoherent" leaf, ask them to identify which premise they are unwilling to surrender. If they land on "Indistinguishable" leaves, ask them to construct a case where the two views yield different legislative outcomes. This will force them to move beyond reciting formulas to testing the logical load-bearing capacity of the distinctions.
