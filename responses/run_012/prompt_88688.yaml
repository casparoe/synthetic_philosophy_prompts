answer: |-
  I came to Oakhaven because I was tired. Not the sleepiness of a night lost to work, but the bone-deep fatigue of wanting things. I wanted a promotion, I wanted my ex to miss me, I wanted the world to be different. Oakhaven promised nothing but the cessation of that itch.

  The valley was quiet. No cars, no construction, just the wind in the pines and the soft scrape of hoes against dirt. The people moved with a deliberate slowness, not out of lethargy, but because haste implies you believe being somewhere else is better than being here.

  "It is not that pleasure is bad," Mara told me on my third day. She was the eldest, her face a map of serene lines. We were shelling peas, the rhythmic *pop-thud* of the beans hitting the bowl acting as a metronome for our breath. "It is that pleasure is merely a pause in pain. Eating stops hunger. Company stops loneliness. But hunger and loneliness are the primary realities. We do not seek the taste of the pea. We seek the absence of the hunger."

  It made a terrible, beautiful sense. I felt the tension in my shoulders drop. For the first time in years, I wasn't trying to achieve happiness. I was just trying to stop the hum of *need*. It was restful. It felt like sinking into a bath after a fever breaks.

  For six months, I lived the Hard Way. We meditated until our legs went numb. We worked the fields until our backs ached. We practiced noticing a craving— for sugar, for praise, for sex— and letting it dissolve without acting on it. It was grueling. But when the sun set, the silence in my head was absolute. I felt clean.

  Then came the Council of Equivalents.

  It wasn't a dramatic gathering. Just twelve of us sitting on woven mats in the longhouse. Kael, a younger man who had arrived a year before me with eyes like shattered glass, spoke first. He held a small bottle of amber liquid.

  "I have synthesized a compound," Kael said. His voice was as calm as Mara's. "It suppresses the dopaminergic reward system. It quiets the craving centers. I have taken it for a week."

  Mara didn't frown. Frowning would imply judgment, and judgment is a form of wanting things to be different. "And?"

  "And the result is identical to the Hard Way," Kael said. "The craving is gone. The suffering is gone. But the effort is removed. Why suffer the backache of the field, or the ache of the meditation posture, if the chemical route achieves the only intrinsic good—the absence of want—more efficiently?"

  I looked at the bottle. It looked like peace in a vial. If the goal is the quiet mind, does it matter if you earn it or buy it? If suffering is the only evil, then the struggle of meditation is itself a small evil. Kael was offering a shortcut to virtue.

  "There is a second point," Kael continued. He looked around the circle, his gaze gentle. "We speak of preserving this community. We speak of children."

  A few people shifted. I had seen a pregnant woman in the lower cabins.

  "Craving is the only intrinsic bad," Kael said. "It is the root of suffering. To be born is to be given a machine that generates craving. Hunger, thirst, attachment, fear. Every child is a new vessel for the very thing we seek to extinguish."

  He paused, letting the logic settle like dust.

  "To bring a child into Oakhaven is to create a new battlefield. It is to manufacture suffering where there was none. If we truly believe that the absence of craving is the only good, then procreation is not just neutral. It is an act of aggression."

  The silence in the longhouse was heavier than the mountain air outside. I felt the pull of his words. I loved the peace I had found here. How could I justify condemning a child to the struggle of attaining it? And if I could swallow a pill and feel this holy stillness tonight, why should I wait ten years to earn it?

  Mara looked at the bottle, then at Kael. She did not argue. You cannot argue with a mirror.

  "The effort has value," Mara said softly. "The discipline strengthens the vessel."

  "Does it?" Kael asked. "Or does the discipline just create more craving? The craving to be disciplined? The craving to be enlightened? The pill asks for nothing."

  He placed the bottle on the floor. "I am not asking you to fight me. I am asking you to follow the path to its end. If we love the Quiet, we should choose the Quietest path. And we should spare the unborn the noise."

  No one shouted. No one stormed out. The logic was a slow water, eroding the stone without a splash.

  The split happened over the next week. It was quiet, like everything else here.

  I saw Elias, who had taught me to shell peas, packing a bag. He was going with Kael. He looked relieved. He didn't want to fight his mind anymore; he just wanted it to stop. He took the amber vial. He looked at me, and there was no guilt in his eyes, only a deep, chemical mercy.

  "I can't bring a child into this war, Ellis," he said. "And I'm tired of fighting."

  Mara stayed. She and the others remained with the gardens, the meditation cushions, the hard, slow work. They chose the struggle, perhaps because the struggle was the only thing that made them feel they hadn't simply given up, but had transcended. But they looked older that week. The certainty had leaked out of them.

  I stand at the crossroads of the valley now. To the left, the chemical house, where the lights are dimmed and the people sit in perfect, induced stillness, breeding no one, wanting nothing, safe from the harm of existence. To the right, the fields, where the people fight the good fight against their own nature, knowing they might lose, knowing they create new soldiers for a war they wish was over.

  I feel the pull of both. I am so tired. The silence of the valley is still beautiful. But I realize now that the silence comes in two kinds: the silence of the library, and the silence of the grave. Both are quiet. Both are free of craving.

  I walk down the path, but I do not know which gate I will open. And in that uncertainty, for the first time since I arrived, I feel a small, sharp spark of desire. I want to be right. And I hate myself for it.
