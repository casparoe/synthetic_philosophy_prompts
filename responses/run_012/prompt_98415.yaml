  - Bottom line (2-3 sentences): is the rulebook coherent, or not?
  - How the four rules rub against each other (~200 words): walk through at least one concrete sequence of moves where two of the rules seem to give different answers about what just happened.
  - The self-amendment knot (~350 words): the regress/grounding problem in plain terms — why "a rule authorises its own amendment" seems to need something outside the rulebook, and wether that something has to be a further rule.
  - Two tempting fixes that slip (~250 words): pick two escapes people usually reach for (e.g. a master rule that is simply not amendable, or saying amendments only ever apply "going forward") and show exactly where each one bites the dust or merely relocates the problem.
  - Does it matter outside the game? (~200 words): whether the same structure shows up in actual constitutional practice, and if so what the real-world analogue of R3 or R4 would be.
  - My verdict (2-3 sentences): your own call on which of my two moods is right.

  Casual is fine, I'm not going to publish this.
