  The self-amendment knot:
  The deeper problem is grounding. For a rule to authorize its own amendment, it must possess authority independent of the amendment process it controls. But here, the authority is the very thing being changed. When you use R1 to change R1, you are relying on R1's authority to validate an act that might destroy R1's authority. This is circular. You need a stable platform to stand on while you change the floor beneath you. R3 makes this worse by collapsing the timeline. Normally, we distinguish between the rule in force at the start of the procedure and the rule in force at the end. R3 erases that distinction. It demands that the new rule validates the procedure that created it. This implies the effect precedes the cause. It's the legal equivalent of bootstrapping.

  Without an external anchor—a meta-rule outside the book telling you which rule wins—the system has no way to resolve the conflict. It's not just that the rules contradict; it's that there is no mechanism within the rules to decide the contradiction. Any decision requires stepping outside the system to say "R2 trumps R1" or "The vote counts." If that decision comes from another rule, you need a rule to interpret that rule, leading to infinite regress. If it comes from a person (a judge, a voter), then the authority lies with the person, not the book. The book is just a record of decisions, not the source of them. The knot is that you are trying to find logical necessity in a system that ultimately rests on social fact. The rules pretend to be self-sufficient, but they require an external "grundnorm" to function.

