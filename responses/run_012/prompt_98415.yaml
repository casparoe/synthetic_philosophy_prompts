  Ok so I'm a third-year PhD student in legal philosophy (mysis is on self-referential norms, fun stuff) and I've been messing around with a toy rule-system to test some intuitions, and I want you to explain the conceptual knot in it to me. No citations or reading lists please, I genuinely don't care who wrote about what, I just want the idea explained. Here's the toy. Four rules, that's it:

  R1: Any rule in this book may be amended or repealed by a simple majority of the votes cast.
  R2: R1 may be amended or repealed only by a majority of 90%.
  R3: An amendment takes effect the instant it passes, and binds the very vote that passed it.
  R4: No amendment may be adopted if adopting it would make the rulebook internally inconsistent.

  Now, I keep going back and forth. Some days I think the thing is just incoherent and any "solution" is a verbal dodge. Other days I think it's perfectly fine and I'm just confusing two different questions — whether a rule is valid versus whether a change actually happened. R3 is the bit that really gets me, cause it means a vote can change the rules that are governing that same vote.

