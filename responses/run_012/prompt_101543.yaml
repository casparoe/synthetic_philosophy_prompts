answer: |-
  The practice of Ranked-Choice Voting (RCV), specifically in the Instant Runoff Voting (IRV) implementation common in U.S. municipalities, relies on a tension between a normative civic narrative and a game-theoretic reality. To answer your questions, we must distinguish between the *expressive* function of the ballot (what the guides claim) and the *instrumental* function of the ballot (what the counting rule enforces), and analyze the specific mathematical guarantees required to sustain the advice given to voters.

  ### 1. What the Practice Presupposes About the Ballot and Security

  **The Ontology of the Ballot:**
  The voter guides presuppose that a ballot is primarily a **secure vessel for expression**. By instructing voters to rank candidates in the order they "sincerely prefer," the institution treats the ballot as a diary entry or a statement of truth. It assumes the voter's goal is to communicate preference, not to manipulate an outcome.

  However, the counting rule treats the ballot as an **instrument of influence** within a specific algorithm. Because IRV eliminates candidates sequentially based on tallies, a ballot is not just a statement; it is a weight applied to a specific candidate at a specific time. The practice presupposes that these two ontologies align—that expressing truth *is* the most effective way to exert influence. When they diverge (e.g., when ranking a compromise candidate causes your favorite to be eliminated earlier), the operational reality (influence) overrides the stated purpose (expression), yet the guide continues to speak the language of expression.

  **The Kind of Security Promised:**
  The reform is sold on the promise of **expressive security**: "You will not be punished for telling the truth." This is distinct from **outcome security**.
  *   **Expressive Security:** You can mark your true favorite first without fear that the act of marking them will invalidate your ballot immediately (solving the "wasted vote" of Plurality).
  *   **Outcome Security:** Your sincere ranking yields the best possible result for you compared to any strategic ranking.

  The guides promise expressive security ("your ballot will still count for your next choice") but imply outcome security ("put your true favorite first"). The practice presupposes that expressive security is sufficient to guarantee outcome security, or at least that the risk to outcome security is negligible. However, because ballots can be **exhausted**, the security is conditional. The promise is not "your vote will always decide," but "your vote will count *as long as* you anticipate the elimination order correctly." This shifts the burden of security from the system to the voter's ability to predict the election dynamics.

  ### 2. Strong vs. Weak Properties: Strategy-Proofness vs. Monotonicity

  **The Strong Property (Strategy-Proofness):**
  The sincere-ranking advice, taken literally, requires the counting rule to be **strategy-proof** (immune to strategic ranking). This means sincerity is always a dominant strategy; no voter can ever achieve a better outcome by lying about their preferences.
  *   *Reality:* The **Gibbard-Satterthwaite theorem** proves that no ranked voting system with three or more candidates can be fully strategy-proof. Therefore, the strong property is mathematically impossible. The institution cannot strictly deliver what the "end of the wasted vote" slogan implies.

  **The Weaker Property (Monotonicity/Participation):**
  The prompt describes the weaker promise as: "adding a lower preference never damages a higher one." In social choice theory, this is closely related to the **Participation Criterion** (voting sincerely should not yield a worse result than abstaining) and **Monotonicity** (ranking a candidate higher should not cause them to lose).
  *   *Reality:* IRV **fails** monotonicity and the participation criterion. There are configurations where ranking a compromise candidate *below* your favorite (or not ranking them at all) prevents your favorite from being eliminated in an earlier round, whereas ranking the compromise sincerely causes your favorite to lose. Thus, the "weaker promise" is also mathematically false in IRV, though violations are rarer than in other systems.

  **Can the institution presuppose the weaker while advertising the stronger?**
  Yes. This is the central mechanism of the reform's political viability.
  1.  **Advertising the Strong:** The slogan "vote your true favorite" implies that strategy is obsolete (Strong Property). This simplifies the message for adoption.
  2.  **Presupposing the Weak:** The system functions on the assumption that violations of monotonicity are rare enough ("pathological cases") that voters can safely ignore them. It presupposes that the *probability* of strategy being necessary is low enough that the *instruction* to be sincere remains a useful heuristic, even if it is not a mathematical guarantee.

  The institution relies on the **computational complexity** of finding a strategic vote. While a strategic vote may exist, finding it requires knowing the exact elimination order, which is impossible for a voter to know ex ante. Thus, the institution presupposes **epistemic security** (you can't know how to game it, so don't try) rather than **mathematical security** (it cannot be gamed).

  ### 3. Categorizing Commitments

  **Commitments the Practice Strictly Needs:**
  1.  **Legitimacy of the Majority Claim:** The system needs voters to believe the winner has broader support than a plurality winner. If exhaustion rates are high, the "majority" is artificial, undermining the core justification for RCV.
  2.  **Belief in Sincerity:** The system requires a critical mass of voters to actually follow the sincere-ranking advice. If too many voters attempt to game the elimination order (e.g., via bullet voting), the system can produce chaotic or non-representative results that violate the "consensus" narrative.
  3.  **Low Cognitive Load:** The practice needs voters to accept the heuristic ("just rank them") without demanding the mathematical proof of its safety.

  **Commitments it Merely Fits Well With:**
  1.  **Actual Strategy-Proofness:** As noted, the system does not have this, though the marketing fits well with the *desire* for it.
  2.  **Monotonicity:** The system functions *despite* failing this, not because it satisfies it.
  3.  **The Ballot as Pure Expression:** The system fits well with the civic ideal that voting is expressive, but operationally contradicts it by making expression risky in edge cases.

  **What Would Change in Voter Guides if the Weaker Reading Were Made Explicit?**
  If the guides acknowledged that the system only *usually* protects sincerity, but not *always*, the language would have to shift from imperative to probabilistic:

  *   **Current:** "Rank candidates in the order you truly prefer. Your vote will never be wasted."
  *   **Revised (Weaker Reading):** "Rank candidates in the order you prefer. In most cases, this is your best strategy. However, in close elections, ranking a viable compromise below your favorite could theoretically alter the elimination order to your disadvantage. Additionally, if you do not rank all candidates, your ballot may stop counting before a winner is declared."
  *   **Strategic Nuance:** The guides would have to admit that **truncation** (leaving candidates off) is a valid tactical choice, rather than implying that a full ranking is always superior. They would have to warn that "ranking more candidates" is not inherently safer than "ranking fewer," contradicting the current implication that more data equals more security.

  ### Conclusion

  The practice presupposes that the ballot is a **truth-telling device** protected by **epistemic opacity** (strategy is too hard to calculate) rather than mathematical guarantee. It sells the **Strong Property** (sincerity is always safe) to secure adoption, while relying on the **Weaker Property** (sincerity is usually safe) to maintain stability. To make the weaker reading explicit would be to admit that RCV is not the "end of strategy," but merely a change in the *type* of strategy required—shifting from "guess the winner" (Plurality) to "guess the elimination order" (RCV). The voter guides avoid this admission because the reform's legitimacy depends on the fiction that the voter can remain a passive expresser of truth rather than an active player in a game.
