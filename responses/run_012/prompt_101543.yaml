      *   *Security:* Distinguish between "wasted vote" (first choice ignored) and "spoiler effect" (first choice causes worse outcome). RCV solves the former, not necessarily the latter.
      *   *Strong vs. Weak:* Gibbard-Satterthwaite proves Strong is impossible. The system relies on the Weak (that manipulation is hard/rare) while selling the Strong.
      *   *Commitments:*
          *   Needs: Voter participation, perceived legitimacy, manageable exhaustion.
          *   Fits: True strategy-proofness, monotonicity.
      *   *Guide Changes:* Nuance, warnings about truncation, admission of complexity.

  9.  **Self-Correction/Polishing:**

      *   *Check:* Did I answer the specific question about "adding a lower preference never damages a higher one"?
      *   *Correction:* That specific phrasing describes a property often associated with *consistency* or specific monotonicity variants. In IRV, ranking a candidate lower (or not ranking them) can sometimes help your top choice. Conversely, ranking a compromise *can* hurt your favorite by changing the elimination order. I need to be precise here. The prompt asks if the advice requires immunity to strategic ranking (Strong) or just that adding a lower pref doesn't hurt a higher one (Weak).
      *   *Clarification:* Actually, "adding a lower preference never damages a higher one" is a specific formulation. If I rank A, does adding B below A hurt A? In IRV, yes, it can (by keeping B alive longer to eliminate A, or changing the runoff opponent). So IRV *fails* this weaker property too.
      *   *Wait, re-reading the prompt:* "Does the sincere-ranking advice require the counting rule to be immune to strategic ranking... or only to satisfy the weaker promise that adding a lower preference never damages a higher one?"
      *   *Interpretation:* The prompt is asking what the *advice* presupposes. The advice says "Rank sincerely." For this advice to be *valid*, the system must make sincerity optimal. If the system fails the "weaker promise" (adding a lower pref hurts a higher one), then the advice is mathematically false.
      *   *Crucial Point:* IRV *fails* the weaker promise too (non-monotonicity). So the institution is advertising a property (sincerity is safe) that relies on a mathematical guarantee (monotonicity/participation) which the system *does not possess*.
      *   *Conclusion:* The practice presupposes the *Weak* property is true (even though it isn't always) to sell the *Strong* impression. It needs the *belief* in the Weak property, not the actual mathematical truth of it.

  10. **Final Structure:**
      *   **Ontology of the Ballot:** Expression vs. Instrument.
