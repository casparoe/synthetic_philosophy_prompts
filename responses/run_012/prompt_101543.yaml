  2.  **Analyze the Technical Properties of RCV (IRV):**

      *   *System:* Instant Runoff Voting (single-winner RCV).
      *   *Claim:* "Vote your true favorite first."
      *   *Reality:*
          *   **Gibbard-Satterthwaite Theorem:** No ranked voting system (with 3+ candidates) is completely strategy-proof. So, full immunity is impossible.
          *   **Monotonicity:** IRV fails monotonicity. (Ranking X higher can cause X to lose).
          *   **Participation Criterion:** IRV fails participation. (Voting can make your preferred outcome worse than not voting).
          *   **Exhaustion:** If you don't rank enough candidates, your ballot stops counting.
          *   **Compromise Strategy:** Sometimes, ranking a viable compromise *below* a long-shot favorite causes the favorite to be eliminated early, leading to a worse winner. Sometimes, *not* ranking the compromise (bullet voting) helps the favorite survive longer or forces a different runoff dynamic.
      *   *The "Security" Promise:* The prompt suggests the promise is "your ballot will still count for your next choice." This implies a guarantee of *expressive safety* (no penalty for sincerity).

  3.  **Address Question 1: What is a ballot for?**

      *   *Official Narrative:* A ballot is an expression of ordinal preference. It is a secure channel for truth-telling.
      *   *Operational Reality:* A ballot is an instrument of influence in a specific algorithmic game. It is a tactical tool.
      *   *Tension:* The guide says "expression," the math says "allocation of influence." The practice presupposes the ballot is primarily for *expression* but treats it operationally as *influence*.

  4.  **Address Question 2: What kind of security is promised?**

      *   *Advertised Security:* "No wasted vote." Implies: Sincerity is safe. You won't regret ranking your true favorite.
      *   *Actual Security:* Limited. You are protected against the *first* choice being ignored immediately, but not against the *consequences* of that first choice on the final outcome (due to non-monotonicity or exhaustion).
      *   *Type:* It promises *expressive security* (you can say what you like) but cannot guarantee *outcome security* (saying what you like yields the best result).

  5.  **Address Question 3: Strong vs. Weak Property:**

      *   *Strong Property:* Strategy-proofness (Dominant strategy is always sincerity). Impossible per Gibbard-Satterthwaite.
      *   *Weaker Property:* "Adding a lower preference never damages a higher one." This sounds like the *Participation Criterion* or a specific form of *Monotonicity*.
          *   Actually, the prompt phrases it: "adding a lower preference never damages a higher one." This is closer to *Independence of Irrelevant Alternatives* (IIA) or specific monotonicity conditions.
          *   Wait, let's look closer: "whether a supporter should leave a compromise off the ranking." This refers to the strategy of *truncation*.
          *   If I rank A > B, does adding B ever hurt A? In IRV, yes (via elimination order changes).
          *   So the "weaker promise" is likely: *Truncation is never strictly necessary to protect your top choice.* Or: *Ranking more candidates is safe.*
      *   *Does the advice require full immunity?* No, because that's impossible. It requires the *belief* that sincerity is "safe enough."
      *   *Can the institution presuppose the weaker while advertising the stronger?* Yes. This is the crux of the critique. They sell "no strategy needed" (Strong) but rely on "strategy rarely works" or "strategy is too hard" (Weak/Pragmatic).

