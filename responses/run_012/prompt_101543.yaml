          *   That exhaustion rates are low enough to not invalidate the "majority" claim.
      *   *Merely Fits Well With:*
          *   Actual strategy-proofness (it doesn't have it).
          *   Monotonicity (it fails it).
          *   The idea that a ballot is purely expressive (it's instrumental).
      *   *Changes to Voter Guides (if weaker reading explicit):*
          *   Acknowledge strategy exists.
          *   Warn about exhaustion.
          *   Admit that ranking a compromise *might* hurt the favorite (though rare).
          *   Shift from "Just be sincere" to "Rank as many as you are comfortable with, but know the risks."

  7.  **Synthesize and Refine the Argument:**

      *   *Thesis:* The practice relies on a "civic fiction" that the ballot is a safe vessel for truth, masking the game-theoretic reality that the ballot is a lever of power subject to paradox. It sells the *Gibbard-Satterthwaite impossibility* as a solved problem.
      *   *Key Distinction:* Expressive Security vs. Instrumental Security.
      *   *The "Weaker Property":* The prompt asks about "adding a lower preference never damages a higher one." In social choice theory, this is related to *Monotonicity* (ranking X higher shouldn't make X lose) and *Participation* (voting shouldn't make things worse than abstaining). IRV fails both. The "weaker promise" the prompt alludes to is likely that *truncation is not required for safety*.
      *   *Refining the "Weaker Reading":* If the guide admitted the weaker reading, it would have to admit that *sometimes* strategy matters. It would shift from a moral imperative ("vote sincerely") to a heuristic ("sincerity is usually best").

  8.  **Drafting the Response (incorporating specific terminology):**

