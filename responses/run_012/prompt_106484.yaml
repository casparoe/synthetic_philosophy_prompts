answer: |-
  The slogan "it's the intent, not the numbers" is a rhetorical shorthand that collapses several distinct legal and philosophical claims into one bite-sized rule. In your reading group, it is being used as a shield (to exclude atrocities from the label) and a sword (to include small-scale atrocities). To settle this for yourself, you need to separate the valid legal principles from the rhetorical sleight of hand.

  Here is a breakdown of the five distinct claims hidden inside that one-liner, ranging from the legally trivial to the highly contested.

  ### 1. The Textualist Claim (The Definition)
  **The Claim:** The UN Genocide Convention defines the crime by the *mens rea* (mental state) of "intent to destroy," without specifying a minimum body count. Therefore, a single killing can theoretically be genocide if the intent is present, and a million deaths can theoretically be something else if the intent is absent.
  *   **Plausibility:** High. This is textually accurate. The Convention does not have a numerical threshold.
  *   **Does it support the argument?**
      *   *For the "tiny case" side:* Yes. It validates the idea that scale is not an element of the crime.
      *   *For the "land grab" side:* Weakly. It explains why numbers don't automatically make it genocide, but it doesn't prove the intent *wasn't* there.
  *   **Tautology Check:** High risk. Saying "it's genocide because the intent matches the definition of genocide" is circular. It becomes useful only when contrasting genocide with other crimes (like war crimes) that *do* rely on scale or specific acts.

  ### 2. The "Substantial Part" Claim (The Quantifier)
  **The Claim:** While the definition says "in whole or in part," courts have interpreted "part" to mean a "substantial part." However, "substantial" can be qualitative (e.g., killing the leadership) rather than purely quantitative. Therefore, low numbers can still count if the *significance* of the part is high.
  *   **Plausibility:** High. This incorporates your memory of judicial readings. International tribunals (ICTR, ICTY, ICJ) have ruled that "substantiality" is assessed by both numeric absolute value and the prominence of the victims within the group.
  *   **Does it support the argument?**
      *   *For the "tiny case" side:* Yes, but with caveats. It supports the claim that small numbers *can* count, but contradicts the idea that *any* number counts. The "part" must still be substantial enough to impact the group's survival.
      *   *For the "land grab" side:* No. If millions are displaced, that is numerically "substantial." This claim hurts the argument that displacement isn't genocide because the numbers are "just" about land.
  *   **Tautology Check:** Low. This is a specific legal test, not a definition restatement.

  ### 3. The Evidentiary Claim (The Inference)
  **The Claim:** Intent is a mental state and leaves no physical trace. Therefore, prosecutors must infer intent from the scale, pattern, and systematic nature of the acts. Consequently, while numbers aren't *legally* required, they are *practically* necessary to prove the intent.
  *   **Plausibility:** Very High. This addresses your point about tribunals inferring intent. Without a "smoking gun" (like an order from a leader), the scale of destruction is the primary evidence used to deduce the intent to destroy.
  *   **Does it support the argument?**
      *   *For both sides:* It actually undermines the slogan. If you say "it's not numbers," you are removing the primary evidence required to prove the intent you claim is so important.
      *   *For the "land grab" side:* This is dangerous for them. If the scale of displacement is massive and systematic, a tribunal might infer an intent to destroy the group's viability, even if the stated goal was "just" land acquisition.
  *   **Tautology Check:** None. This is a procedural reality check.

  ### 4. The Ontological Claim (What is Being Destroyed?)
  **The Claim:** The "intent to destroy" refers to the physical or biological destruction of the group, not the destruction of their culture, language, or connection to land. Therefore, driving a group off land (cultural/territorial destruction) lacks the requisite intent, even if the group ceases to exist as a functioning community.
  *   **Plausibility:** Mixed. This incorporates your memory of Lemkin vs. the Treaty. Lemkin's original concept included cultural destruction. The final Convention dropped explicit cultural genocide provisions. Courts have generally held that forced displacement alone is not genocide, though it can be a means to achieve it.
  *   **Does it support the argument?**
      *   *For the "land grab" side:* Yes, this is their strongest legal footing. They are arguing that the *object* of the intent is removal, not biological destruction.
      *   *For the "tiny case" side:* Irrelevant.
  *   **Tautology Check:** Low. This is a substantive debate about the scope of the law.

  ### 5. The Differentiation Claim (Genocide vs. Ethnic Cleansing)
  **The Claim:** "Ethnic cleansing" (driving people off land) and "Genocide" (wiping them out) are distinct categories. The only difference between them is the specific intent (*dolus specialis*). Therefore, focusing on the body count confuses the two; we must look solely at the goal (removal vs. extinction).
  *   **Plausibility:** High. This is the standard distinction in international law. Ethnic cleansing is a descriptive term for a policy; genocide is a specific legal crime.
  *   **Does it support the argument?**
      *   *For the "land grab" side:* Yes. This is almost certainly the move they are making. They are arguing that the *goal* was territory, so the *intent* was cleansing, not genocide.
      *   *For the "tiny case" side:* Yes, but in reverse. They argue that even if the body count looks like "cleansing," if the *goal* was extinction, it is genocide.
  *   **Tautology Check:** Moderate. It risks becoming "It's not genocide because it's the other crime," which requires proving the intent for the other crime first.

  ### Synthesis: What is actually happening in your group?

  The slogan is doing too much work. It conflates **Intent as Threshold** (you need it to be genocide at all) with **Intent as Differentiator** (you need it to distinguish genocide from ethnic cleansing).

  When your group member says, "They only wanted the territory... so it's ethnic cleansing, not genocide," they are relying on **Claim 4 and 5**. They are arguing that the *object* of the intent was displacement, not destruction. However, they phrase it as "intent, not numbers" to dismiss the sheer scale of the suffering. They are implying that no matter how many people are displaced (numbers), if the goal was land (intent), the label doesn't apply.

  This is legally precarious because of **Claim 3**. If the displacement is total and the conditions of displacement are calculated to cause death (e.g., driving people into a desert without water), tribunals often rule that the intent to destroy can be inferred from the method, regardless of the stated goal of "territory."

  When the slogan is used the other way ("a tiny case counts"), they are relying on **Claim 1 and 2**. They are arguing that the legal definition has no floor, provided the "part" destroyed is significant to the group's survival.

  ### Which reading is the speaker using?

  In the context of a debate about land displacement, the speaker is almost certainly using the **Differentiation Claim (Claim 5)** disguised as the **Textualist Claim (Claim 1)**.

  They are trying to enforce a bright line between "wanting land" and "wanting death." By saying "it's intent, not numbers," they are attempting to immunize the "land grab" argument against the moral weight of the "numbers." They are saying: "Do not let the horror of the scale (numbers) convince you of the specific legal intent (genocide)."

  However, they are ignoring the **Evidentiary Claim (Claim 3)**. In the absence of a written order saying "kill them all," the scale and pattern of the atrocity *are* how we determine the intent. You cannot separate intent from numbers in practice, even if you can in theory.

  Verdict: The speaker is likely arguing that specific intent to destroy is the sole legal differentiator from ethnic cleansing, regardless of the scale of suffering.
