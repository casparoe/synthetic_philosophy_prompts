answer: |-
  # UNIVERSITY EXAMINATION PAPER
  **Module:** Applied Ethics (Level 3)
  **Time Allowed:** 90 Minutes
  **Total Marks:** 30

  **INSTRUCTIONS TO CANDIDATES**
  Answer the following question. Your response should be approximately 1,200 words. No external materials or citations are required; all necessary legal definitions are provided below.

  ***

  **QUESTION 1**

  **Background Information**
  *General Average.* In maritime law, where a loss is deliberately and voluntarily incurred for the common safety of a sea venture (such as cargo jettisoned in a storm to lighten a foundering ship), the loss is not left where it falls. It is borne proportionately by all who benefit, each contributing in proportion to the value saved. The doctrine requires three conditions: a common danger shared by ship, cargo, and crew; a voluntary sacrifice of part for the sake of the whole; and the success of the venture, as contributions are assessed only if the ship and remaining cargo survive. Assessment is retrospective, conducted by an adjuster who inspects records to fix values.

  *The Master's Duty of Assistance.* A master who is in a position to assist persons in distress at sea must do so. This duty is qualified: it does not require action where doing so would seriously endanger the master's own vessel or those aboard.

  *The Case.* A single lifeboat, rated for fewer people than it currently holds, carries the crew of a foundered ship together with people picked up from the water. Water and provisions are sufficient for some, but not all, to reach land. Heavy weather threatens to swamp a boat loaded past capacity. The occupants were strangers to one another before the foundering and have made no agreement among themselves.

  **Essay Question**
  Maritime law offers two distinct normative frameworks for this scenario: the *Master's Duty of Assistance*, which operates as a threshold duty capped by self-preservation, and *General Average*, which mandates shared sacrifice for common safety.

  Critically evaluate whether *General Average* can supply the normative model for deciding what the lifeboat's occupants owe one another and owe the swimmers, or whether the analogy breaks at a point that matters. In your answer, you must test the presuppositions of *General Average* against the lifeboat case; consider whether a rule of shared sacrifice converts the threshold duty of assistance into a continuous duty; and confront the impossibility of compensating the sacrificed. You must distinguish between allocating a loss among beneficiaries and discharging a duty to a claimant, and take a stand on the legitimacy of a rule that is fair *ex ante* but lethal *ex post*.

  Finally, state your own rule precisely enough to be applied, and apply it to the following two variants:
  1.  The extra passengers are survivors from a ship that stood off and refused to aid the foundered vessel.
  2.  A further swimmer reaches the boat after your rule has already been invoked and would be the last person admitted.

  ***

  # MODEL ANSWER

  The lifeboat scenario is typically treated as a tragic dilemma where moral arithmetic fails. However, importing the maritime doctrine of *General Average* shifts the focus from tragic choice to distributive justice. To determine if this doctrine supplies a viable normative model, we must test its machinery against the reality of the lifeboat.

  *General Average* presupposes a common commercial venture, a loss that can be made good, contributors who can be charged, and retrospective adjudication based on records. In the lifeboat, the 'common venture' is merely shared survival, lacking the contractual basis of a ship and cargo. More critically, the doctrine relies on compensation: the owner of jettisoned cargo is paid by those saved. In the lifeboat, the 'sacrifice' is often life itself. The dead cannot be compensated, nor can they contribute retrospectively. This breaks the normative machinery. Without compensation, 'sharing the loss' becomes merely sharing the death. A substitute mechanism is required—perhaps a lottery to ensure equal risk *ex ante*, or a claim on behalf of dependants funded by survivors. However, no monetary substitute restores the lost life, suggesting *General Average* cannot directly govern the sacrifice of persons, only the burden of survival.

  This leads to a structural distinction between loss allocation and duty. *General Average* allocates a loss among beneficiaries; the *Master's Duty* is owed to a claimant in distress. The lifeboat case is primarily a duty case: the occupants owe a duty to the swimmers. The *Master's Duty* is a threshold duty; it lapses wholesale once the boat is full and safety is compromised. Adopting a *General Average* model would convert this into a continuous duty of shared risk. Instead of 'all safe' or 'leave them,' the occupants would bear a proportion of the risk to admit more. This is normatively attractive as it rejects the absolute priority of the incumbent over the stranger. However, it demands that those already aboard accept a probability of death to reduce the certainty of death for those in the water.

  Is a rule fair *ex ante* but lethal *ex post* legitimate? If the rule is a lottery agreed upon (hypothetically) before the crisis, it respects the equality of moral worth. It is legitimate because it treats the risk as a common burden rather than a fate assigned to the weakest. However, legitimacy collapses if the rule is applied *ex post* without prior consent, as it instrumentalises the sacrificed for the benefit of the group. Therefore, a legitimate rule must simulate *ex ante* consent through strict impartiality, such as a lottery, rather than utilitarian calculation of value.

  My proposed rule is: *Where capacity is exceeded, admission is determined by a random lottery among all claimants (occupants and swimmers) until capacity is reached, provided the boat remains seaworthy. No distinction is made based on prior status.*

  Applying this to Variant 1: The extra passengers are from a ship that refused aid. Under a strict *General Average* model, one might argue they forfeited their claim by not contributing to the common safety earlier. However, my rule prioritises the equality of need over reciprocal duty in the immediate crisis. Punishing them by exclusion treats the lifeboat as a court of retribution rather than a vessel of necessity. They enter the lottery. To do otherwise is to allow the occupants to act as judges of past conduct, which introduces bias and undermines the impartiality required to legitimise the lethal risk.

  Applying this to Variant 2: A swimmer arrives after the rule is invoked and would be the last admitted. If the lottery has already been cast and the boat sealed, admitting this swimmer violates the *ex ante* agreement of the participants. To reopen the lottery is to destabilise the rule itself. However, if the boat is not yet sealed, the new swimmer is a new claimant. The moral weight of the 'knock at the door' suggests the lottery must include all present claimants at the moment of departure. If the swimmer arrives too late to be included in the draw without endangering the execution of the decision, they cannot be admitted. To admit them is to privilege the timing of their arrival over the procedural justice of the lottery, effectively punishing those who waited. The rule must be rigid at the point of execution to maintain the trust required for the sacrifice to be borne.

  In conclusion, *General Average* offers a powerful metaphor for shared risk but fails as a direct legal analogue due to the impossibility of compensating the dead. It succeeds only if transformed into a procedural rule of equal risk (lottery) that converts the threshold duty of assistance into a continuous duty of shared vulnerability. This is legitimate only if applied impartially *ex ante*, and it must resist the temptation to adjust for past conduct or late arrivals once the procedure has begun.

  ***

  # MARKING SCHEME

  **Total Marks:** 30
  **Pass Mark:** 15

  ### Must-Hit Points and Allocation

  | Point | Requirement | Marks | Typical Pitfall (How candidates lose it) |
  | :--- | :--- | :--- | :--- |
  | **1** | **Presuppositions of General Average:** Identify common venture, compensable loss, and retrospective adjudication; test each against the lifeboat (e.g., no records, no compensation for death). | 5 | Describing the legal doctrine without testing its fit against the lifeboat scenario. |
  | **2** | **Compensation & Substitutes:** Confront the fact that the sacrificed cannot be compensated; propose a substitute (lottery, dependants' claim) and evaluate its efficacy. | 5 | Assuming compensation is possible or ignoring the problem entirely. |
  | **3** | **Duty Structure:** Distinguish between allocating loss among beneficiaries (*General Average*) and a duty owed to a claimant (*Master's Duty*); identify which structure the case holds. | 5 | Conflating the two legal concepts or failing to identify the lifeboat as a duty-case. |
  | **4** | **Threshold vs. Continuous:** Analyse whether shared sacrifice converts the threshold duty (safety cap) into a continuous duty (bearing risk); evaluate the implication. | 5 | Treating the duty as binary (all or nothing) without considering the 'shared risk' middle ground. |
  | **5** | **Ex Ante/Ex Post Fairness:** Take a clear stand on the legitimacy of rules fair in theory but lethal in practice; do not assume legitimacy. | 5 | Sitting on the fence or assuming fairness *ex ante* automatically justifies death *ex post*. |
  | **6** | **Application to Variants:** State a precise rule and apply it consistently to both variants (the refusing ship and the late swimmer). | 5 | Changing the rule to fit the variant or failing to address one of the two variants. |

  ### Grading Criteria: Distinction between A and B

  **Class B (Upper Second, 60-69%)**
  The candidate accurately explains the legal concepts and identifies the key tensions (compensation, duty structure). They address all six points from the marking scheme and apply a rule to the variants. The answer is competent and logical but may treat the points as a checklist rather than a cohesive argument. The stance on *ex ante/ex post* fairness may be tentative. The application to variants is consistent but lacks deep justification for why the rule holds in those specific edge cases.

  **Class A (First Class, 70%+)**
  The candidate synthesises the legal concepts into a unified ethical argument. They do not merely list the presuppositions of *General Average* but explain *why* the failure of compensation fundamentally alters the normative landscape. The distinction between loss allocation and duty is used to drive the conclusion. The stance on *ex ante/ex post* fairness is robust and critically defended. The application to the variants demonstrates a sophisticated understanding of procedural justice (e.g., why re-opening the lottery undermines the rule). The writing is precise, and the proposed rule is sufficiently detailed to handle the complexities of the variants without contradiction.

  ### Examiner's Note
  *   **Point 1:** Candidates often recite the definition of General Average without checking if 'common venture' exists among strangers.
  *   **Point 2:** Candidates frequently suggest money compensates for death, missing the normative gap.
  *   **Point 3:** Candidates often confuse the duty to rescue with the duty to share losses.
  *   **Point 4:** Candidates tend to ignore the shift from 'safe/unsafe' to 'risk distribution'.
  *   **Point 5:** Candidates often assume a fair procedure justifies any outcome without argument.
  *   **Point 6:** Candidates often abandon their stated rule to achieve a 'nicer' outcome in the variants.
