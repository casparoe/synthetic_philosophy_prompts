  # JOINT STATEMENT ON THE METAPHYSICS OF SOCIAL KINDS
  **Drafted for the Conclusion of Term 4, Metaphysics Reading Group**
  **Signatories:** Person A (Genealogical View), Person B (Constitutive View)

  ## I. AGREED CLAIMS
  *The following propositions are endorsed by both parties. They are intended to rule out caricatures and establish the baseline ontology.*

  1.  **Non-Illusionism:** To claim that a kind (Race, Gender, Money) is "socially constructed" is **not** to claim that it is illusory, fake, or ontologically lightweight. All parties agree that constructed kinds possess causal powers, figure in robust explanations, and constrain individual action.
  2.  **Human Dependence:** The existence, persistence, and extension of Race, Gender, and Money depend counterfactually on human activities, attitudes, or institutions. If humans (with our specific cognitive and social capacities) had never existed, these specific kinds would not exist.
  3.  **The Money Paradigm:** Both parties agree that **Money** is a socially constructed kind. Both parties agree that a specific dollar bill is "real money" in virtue of social facts, not merely physical composition. Both parties agree that if social practices surrounding money ceased, the kind "money" would cease to be instantiated, even if the paper remained.
  4.  **Causal History:** Both parties agree that the *genesis* of Race and Gender categories involves historical social processes (colonialism, patriarchy, legal codification) rather than purely biological divergence.
  5.  **Normative Stakes:** Both parties agree that metaphysical claims about these kinds have ethical and political consequences. Denying the "reality" of Race can obscure oppression; asserting the "naturalness" of Gender can enforce harmful essentialism. Metaphysics is not neutral here.
  6.  **Semantic Function:** The term "constructed" functions to highlight **dependence**. It denies *mind-independence* regarding the kind's origin or maintenance. It does not necessarily deny *objectivity* regarding the kind's current operation.

  ## II. RESIDUAL DISAGREEMENTS
  *The following table isolates the substantive metaphysical divergences. Wording is chosen to be acceptable to the respective proponent.*

  | Topic | Person A (Genealogical View) | Person B (Constitutive View) |
  | :--- | :--- | :--- |
  | **Primary Meaning of "Constructed"** | A claim about **causal history and maintenance**. A kind is constructed if social forces produced it and are required to sustain it. | A claim about **membership conditions**. A kind is constructed if the facts that make something a member of the kind are social facts (e.g., collective acceptance). |
  | **Compatibility with "Natural Kind"** | **Compatible.** A kind can be causally social yet still cluster properties robustly enough to function as a natural kind (e.g., Homeostatic Property Cluster). | **Incompatible.** "Natural Kind" implies boundaries fixed by mind-independent structure. If boundaries are fixed by us, it is a *social* kind, distinct from a *natural* kind. |
  | **Status of Boundaries** | Boundaries are discovered or refined based on causal structure. Social practices track real divisions, even if those divisions are socially maintained. | Boundaries are fixed by classificatory practices. There is no "fact of the matter" about membership outside of the rules we have instituted. |
  | **Ontological Priority** | **Causal Power is Primary.** If it acts like a real kind and has a stable causal profile, it is a real kind, regardless of whether its roots are social. | **Constitutive Rules are Primary.** What makes the kind *what it is* is the rule system. Causal power is a consequence of the constitution, not the ground of the reality. |

  ## III. CRUXES AND TEST CASES
  *These are the specific sub-questions where settling the matter would shift a position. We agree to the following tests to clarify our predictions.*

  ### Crux 1: Does Causal Dependence Entail Constitutive Dependence?
  *Question:* If a kind is causally produced and sustained by social forces (A's view), does it follow that its membership conditions *consist in* social facts (B's view)?
  *   **A's Stance:** No. A kind can be causally sustained by society but have membership conditions determined by underlying biological or physical clusters that society tracks.
  *   **B's Stance:** Yes. If social forces sustain it, the criteria for membership are ultimately social rules, even if they reference biology.

  **Test Case: The Reversal Test**
  *Scenario:* Imagine a counterfactual world where the *classificatory conventions* regarding a specific kind (e.g., "Woman" or "$20 Bill") are inverted or radically altered, but the underlying physical/biological substrates remain identical.
  *   **Question:** Does the extension of the kind change?
  *   **Person A Prediction:** **Not necessarily.** If the causal cluster (e.g., the physiological traits or the economic utility) remains stable, the kind might persist even if the label or specific convention shifts. The *causal role* sustains the kind.
  *   **Person B Prediction:** **Yes, necessarily.** If the classificatory convention changes, the membership conditions change. If the rule says "X counts as Y," and we change the rule, X no longer counts as Y. The kind is constituted by the rule.

  ### Crux 2: Is "Natural Kind" a Useful Contrast Class?
  *Question:* Does labeling Race or Gender as a "Natural Kind" (albeit a socially maintained one) obscure more than it reveals?
  *   **A's Stance:** No. Calling them "natural kinds" (in a weakened sense) protects them from dismissal as "mere concepts." It secures their reality.
  *   **B's Stance:** Yes. Calling them "natural kinds" suggests their boundaries are inevitable or mind-independent, which is politically and metaphysically misleading.

  **Test Case: The Deletion Test**
  *Scenario:* Imagine all human social practices, attitudes, and institutions regarding a specific kind (e.g., Money) cease tomorrow.
  *   **Question:** Does the kind cease to exist, and is this a change in *extension* or a change in *essence*?
  *   **Person A Prediction:** **Change in Extension.** The *type* "Money" remains a valid historical/kind category (like "Dinosaur"), but nothing currently instantiates it. The *definition* of money (what it *was*) does not change, even if nothing fits it.
  *   **Person B Prediction:** **Change in Essence/Existence.** The kind "Money" is ontologically dependent on the practices. No practices = no kind. It is not just that the extension is empty; the *concept* itself loses its referent entirely. The kind is constituted by the practice, so without the practice, the kind is unintelligible.

  ## IV. ANALYSIS OF CONSTRUCTION GRADES
  *An external mapping of the commitments held by each party regarding the three specific kinds. This distinguishes where the dispute is verbal (terminological) vs. substantive (metaphysical).*

  | Kind | Grade of Construction | Person A (Genealogical) Commitment | Person B (Constitutive) Commitment | Verbal or Substantive? |
  | :--- | :--- | :--- | :--- | :--- |
  | **Money** | **Causal** (History/Maintenance) | **High.** Money is real because it has a causal history of exchange and maintenance by institutions. | **Low.** Causal history is secondary to the current status of acceptance. | **Verbal.** Both agree on the ontology; A emphasizes history, B emphasizes current rules. |
  | | **Constitutive** (Membership Conditions) | **Medium.** Admits social facts determine membership but insists this doesn't make it "less real." | **High.** Membership *just is* collective acceptance. | **Substantive.** A thinks constitutive claims risk anti-realism; B thinks they are necessary for accuracy. |
  | | **Normative** (Purpose/Interest) | **Medium.** We keep money because it serves a purpose. | **High.** Money exists *because* we need it to serve a purpose. | **Verbal.** Both agree on the function. |
  | **Race** | **Causal** (History/Maintenance) | **High.** Race is real because of the causal history of racialization and ongoing structural effects. | **High.** Agrees race is causally sustained by social structures. | **Agreed.** No significant dispute here. |
  | | **Constitutive** (Membership Conditions) | **Low/Mixed.** Resists the idea that race is *only* about classification. Thinks there are material/biological clusters tracked by race. | **High.** Racial membership is determined by social classification (the "one-drop rule" etc.), not biology. | **Substantive.** A fears this makes race "arbitrary"; B insists this makes race "oppressive but real." |
  | | **Normative** (Purpose/Interest) | **High.** Race is a kind because we *need* it for political analysis (e.g., tracking oppression). | **High.** Race is a kind because it is a tool of social organization. | **Agreed.** |
  | **Gender** | **Causal** (History/Maintenance) | **High.** Gender is sustained by patriarchal structures. | **High.** Gender is sustained by normative expectations. | **Agreed.** |
  | | **Constitutive** (Membership Conditions) | **Medium.** Leans toward self-identification or social positioning as constitutive, but worries about "voluntarism." | **High.** Gender membership is constituted by social recognition and norms. | **Substantive.** A worries about stability; B worries about essentialism. |
  | | **Normative** (Purpose/Interest) | **High.** Gender categories answer to political needs (feminist theory). | **High.** Gender categories answer to social organization. | **Agreed.** |

  ## V. DIAGNOSIS OF THE DISPUTE
  *Where we are talking past each other, and where we genuinely differ.*

  1.  **The Verbal Dispute ("Real"):**
      *   **Source:** Person A uses "Real" to mean **Causally Efficacious**. Person B uses "Real" (in the context of Natural Kinds) to mean **Mind-Independent**.
      *   **Resolution:** We agree that Race, Gender, and Money are *Causally Efficacious*. We disagree on whether *Mind-Independence* is a necessary condition for a kind to be treated as "Natural" or "Robust." A thinks we can have Robust Social Kinds. B thinks we must distinguish Social Kinds from Natural Kinds to preserve clarity.

  2.  **The Substantive Dispute (The "Natural Kind" Label):**
      *   **Source:** Person A wants to apply the label "Natural Kind" (or a close analogue) to social kinds to protect their ontological status. Person B wants to withhold the label "Natural Kind" to protect the distinction between human contingency and natural structure.
      *   **Resolution:** This is not merely verbal. It reflects a disagreement about the **taxonomy of science**. A supports a taxonomy based on *causal clustering* (Boyd-style HPC). B supports a taxonomy based on *ontological grounding* (Mind-Dependent vs. Mind-Independent).
      *   **Action:** We will henceforth use the term **"Stable Social Kind"** (A's preference) and **"Constitutively Social Kind"** (B's preference) to avoid the baggage of "Natural Kind," while acknowledging that both agree these kinds support inductive inference and scientific explanation.

  ***

  **Signed,**

  _________________________ (Person A)
  _________________________ (Person B)
  _________________________ (Moderator/Reader)
