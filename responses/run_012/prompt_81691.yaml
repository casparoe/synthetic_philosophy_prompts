prompt: |-
  My reading group just wrapped a term on the metaphysics of social kinds and the last session ended in a fight I think was 60% verbal and 40% real, and I want to actually write up the document the two loudest people should have produced. Person A holds what she calls the genealogical view: for her, saying that race, gender, or money is socially constructed is a claim about causal history and ongoing maintenance — about what produced the category and what keeps it in place — and she insists this is entirely compatible with those categories being real, having determinate members, and doing serious causal work (she thinks money is the clean paradigm and that anyone who says money isnt real is just confused). Person B holds the constitutive view: for him, to call a kind socially constructed is to say something about what membership in it consists in, namely social facts (classificatory practices, collective acceptance, institutional rules), and he thinks that once youve said that youve ruled out the kind being a natural kind in any interesting sense, because its boundaries are fixed by us and not by mind-independent structure. They keep agreeing in the seminar and then calling each other confused in the pub, which is usually a sign that part of it is a verbal dispute, but I dont think its all verbal.

  Could you draft the joint statement they could both sign? I want: a numbered section of agreed claims, stated non-vacuously (what they can jointly say about race, gender, and money specifically, and about what the word constructed does and doesnt entail); then the residual disagreements in a table, each phrased in wording its own side would accept rather than a strawman; then the cruxes, i.e. the sub-questions such that settling one would actually move at least one of them (I suspect one crux is whether the causal claim entails the constitutive one, and another is whether natural kind is even a useful contrast class here); and finally, for each crux, a test or case both sides agree bears on it, with each side's prediction recorded in advance. Two tests they both seemed willing to accept: the reversal test (imagine the relevant practices or classificatory conventions are inverted — does the extension of the kind change, and does that bear on whether the kind is constituted by the practices?) and the deletion test (if the practices stopped tomorrow, would the kind cease to exist, and would that be a change in what the kind is or merely in whether its instantiated?). Also, please sort out which grade of construction each of them is actually committed to for each of the three kinds; I've been distinguishing causal (social causes produced and sustain it), constitutive (social facts constitute membership), and normative (the kind's boundaries answer to our classificatory purposes, so the kind is what it is partly because of what we want the category for). And where you think the dispute is just about the word, say which part and why — but dont paper over the parts that arent.
