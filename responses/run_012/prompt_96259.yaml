answer: |-
  # The Conditional Decision Tree

  **Instructions:** Start at Node 1. Answer the question based on your intuition about the sentences provided. Follow the arrow corresponding to your answer. Continue until you reach a Leaf.

  ### Node 1: The Kennedy Pair
  Consider these two sentences:
  1.  "If Oswald didn't kill Kennedy, someone else did."
  2.  "If Oswald hadn't killed Kennedy, someone else would have."

  **Question:** Do you judge sentence (1) to be **true** and sentence (2) to be **false**?
  *   **Yes:** Go to Node 2.
  *   **No** (You think both are true, both are false, or neither has a truth value): Go to Node 5.

  ### Node 2: The Wet Match (Antecedent Strengthening)
  Consider: "If you strike this match, it will light."
  Now consider: "If you strike this match **and it is soaking wet**, it will light."

  **Question:** If the first sentence is true, does the second sentence *have* to be true?
  *   **No** (Adding info can break the conditional): Go to Node 3.
  *   **Yes** (Truth is preserved when adding info): Go to Leaf A (Strict Conditional).

  ### Node 3: The Die (Probability)
  A fair die is rolled under the table. You know nothing else.
  Sentence: "If it came up even, it came up six."

  **Question:** What is the probability that this sentence is **true**?
  *   **1/3** (It matches the chance of six given even): Go to Node 4.
  *   **2/3** (It matches the chance of "not-even or six"): Go to Leaf B (Material + Pragmatics).
  *   **The question is malformed** (Sentences like this aren't the kind of thing that can be "true"): Go to Leaf C (Probabilistic/Expressivist).

  ### Node 4: Embedding (Negation)
  Sentence: "It is **not** the case that if it rained, the picnic was cancelled."

  **Question:** Can this sentence be **true** or **false** in the same way "It didn't rain" is?
  *   **Yes:** Go to Node 6.
  *   **No** (It sounds like a category mistake): Go to Leaf C (Probabilistic/Expressivist).

  ### Node 5: The Disjunction Test
  Compare:
  1.  "Either it didn't rain or the picnic was cancelled."
  2.  "If it rained, the picnic was cancelled."

  **Question:** Do these two sentences rule out the **exact same scenarios**? (i.e., Is it impossible for one to be true and the other false?)
  *   **Yes:** Go to Leaf B (Material + Pragmatics).
  *   **No:** Go to Node 9 (Unified Quantifier Check).

  ### Node 6: Counterfactual Ties
  Imagine a scenario where Oswald didn't kill Kennedy. There are two worlds equally close to ours where this happens. In World X, someone else kills him. In World Y, no one kills him.
  Sentence: "If Oswald hadn't killed Kennedy, someone else would have."

  **Question:** Given the tie between World X and World Y, is the sentence **false**?
  *   **Yes** (We need a *single* closest world where it happens): Go to Leaf D (Stalnaker).
  *   **No** (It's true if it happens in *all* the closest worlds, or undefined): Go to Leaf E (Lewis).

  ### Node 7: Future Antecedents
  Compare:
  1.  "If Oswald didn't kill Kennedy, someone else did." (Past Indicative)
  2.  "If it rains on Saturday, the match will be cancelled." (Future Indicative)

  **Question:** Are these the **same semantic kind** of claim? (Does 'if' work the same way in both, or is the future version a prediction of a different logical type?)
  *   **Same Kind:** Go to Node 8.
  *   **Different Kind:** Go to Leaf F (Dudman/Verificationist).

  ### Node 8: Operator Unity
  Compare:
  1.  "If it rains, the match is cancelled." (Indicative)
  2.  "If it rained, the match would be cancelled." (Counterfactual)

  **Question:** Is 'if' the **same logical word** in both sentences (just with different context settings), or are they two **different logical operators** entirely?
  *   **Same Logical Word** (Difference is just in the "modal base" or background facts): Go to Leaf G (Unified Restrictor).
  *   **Different Operators**: Go to Node 6.

  ### Node 9: False Antecedent
  Sentence: "If the moon is made of cheese, then 2+2=4."
  (The moon is not made of cheese).

  **Question:** Is this sentence **true** simply because the "if" part is false?
  *   **Yes:** Go to Leaf B (Material + Pragmatics).
  *   **No:** Go to Node 7.

  ### Node 10: Counterfactual Probability
  Sentence: "If Oswald hadn't killed Kennedy, it is 50% likely someone else would have."

  **Question:** Does this make sense as a **true claim** about the world?
  *   **Yes:** Go to Leaf G (Unified Restrictor) or Leaf E (Lewis).
  *   **No** (Counterfactuals are determinate): Go to Leaf D (Stalnaker).

  ---

  ### The Leaves (Positions)

  *   **Leaf A: Strict Conditional.** (Rare in modern intro courses, but logically possible). You accept Kennedy divergence but think logic is monotonic.
  *   **Leaf B: Material Conditional + Pragmatics.** (Grice/Jackson). Conditionals are truth-functional ($A \supset B$). Oddities are explained by conversation rules, not logic.
  *   **Leaf C: Probabilistic / Expressivist.** (Adams/Ramsey). Conditionals have no truth conditions, only assertibility conditions based on conditional probability. They cannot be embedded in negations or probability claims.
  *   **Leaf D: Stalnaker.** (Selection Function). Conditionals have truth conditions based on the *single* closest possible world. Uniqueness assumption holds.
  *   **Leaf E: Lewis.** (Variably Strict). Conditionals have truth conditions based on a *set* of closest worlds. No uniqueness assumption; ties do not make the conditional false automatically.
  *   **Leaf F: Dudman / Verificationist.** Future indicatives are predictions (verb-phrase modification), not propositions. They are a different logical species from past indicatives and counterfactuals.
  *   **Leaf G: Unified Restrictor.** (Kratzer/Modern Semantics). 'If' is not an operator but a restrictor on a covert modal. Indicatives and Counterfactuals use the same machinery with different parameters (modal base/ordering source).

  ---

  ### Unoccupied Answer-Combinations

  **1. The "Monotonic Counterfactual" (Node 1: Yes, Node 2: Yes)**
  *   **Diagnosis:** **Incoherent/Unattractive.** If you accept the Kennedy pair shows a difference between indicative and counterfactual, you usually accept that counterfactuals depend on similarity. If they depend on similarity, adding "soaking wet" to a match strike changes the similarity ordering, making the consequent less likely. A view that accepts the Kennedy intuition but insists on monotonicity struggles to explain *why* the counterfactual is false in the Kennedy case without abandoning monotonicity elsewhere.
  *   **Status:** Effectively empty.

  **2. The "Truth-Valueless Materialist" (Node 3: 2/3, Node 4: No)**
  *   **Diagnosis:** **Incoherent.** If you believe the probability of the sentence being *true* is 2/3 (the Material calculation), you are committed to the sentence having a truth value. You cannot simultaneously hold the Material probability calculation and deny the sentence is truth-apt.
  *   **Status:** Logically impossible.

  **3. The "Future-Only Realist" (Node 7: Different Kind, Node 3: 1/3 Truth)**
  *   **Diagnosis:** **Unexplored.** Most who argue Future Indicatives are a different kind (Dudman) argue they lack truth conditions entirely (predictions, not propositions). A view that says "Futures are a different species *but* still have truth conditions that follow conditional probability" is theoretically possible but rarely defended.
  *   **Status:** Unexplored.

  ---

  ### Indistinguishable Leaves (On This Tree)

  **1. Lewis (Leaf E) vs. Unified Restrictor (Leaf G)**
  *   **Diagnosis:** **Cannot Separate.** On the specific cases provided in this tree, Lewis's variably strict conditional and the Unified Restrictor view often yield the same verdicts. Both reject monotonicity (Node 2), both accept truth conditions (Node 4), both allow counterfactual probability (Node 10). The difference is structural (is 'if' an operator or a restrictor?), which does not manifest in truth-value judgments on these specific sentences. To separate them, you would need cases involving explicit modal operators (e.g., "If A, then *must* B") where the interaction between 'if' and the modal matters.
  *   **Advice:** Tell students that if they land here, they agree on the *logic*, but disagree on the *syntax*.

  **2. Stalnaker (Leaf D) vs. Lewis (Leaf E) on Node 6**
  *   **Diagnosis:** **Practically Indistinguishable.** Node 6 relies on the student having an intuition about "equally close worlds." Many students (and philosophers) find the concept of a "tie" in world-similarity unintelligible. If a student says "There are no ties," they are forced to Stalnaker. If they say "Ties are possible," they go to Lewis. However, since the existence of ties is a metaphysical claim about the structure of similarity, not a linguistic intuition about the sentence itself, students often guess.
  *   **Advice:** Acknowledge that this distinction rests on a metaphysical assumption about "closeness" that the language itself doesn't settle.
