answer: |-
  # THE PROTEIN POLICY (ONE-PAGER)

  **Purpose:** To standardize decisions on protein sourcing and menu swaps based on animal impact, minimizing ad-hoc ethical debates.
  **Scope:** All new dishes, recipe swaps, and supplier changes across 9 sites.
  **Owner:** Sustainability Lead (Policy), Head of Catering (Final Sign-off).
  **Time Budget:** 30 minutes per assessment.

  ### THE DECISION FLOW

  **1. Determine the Unit of Account**
  *   **Do not count kilos.** Count **Individual Lives Required per 100g of Protein**.
  *   *Why:* One cow feeds more people than 100 chickens. Kilos hide the death count.
  *   *Action:* Use the **Standard Conversion Table** (see Long Version) to convert dish weight to estimated animal count.

  **2. Apply the Intentionality Weight**
  *   **Livestock (Meat/Dairy/Eggs):** Count as **1.0** (Intentional Killing).
  *   **Crops (Grains/Pulses/Veg):** Count as **0.1** (Incidental Harvest Death).
  *   *Why:* We intend to kill the cow. We intend to harvest the lentil; the mouse death is a side effect. This prevents the "lentils kill mice" argument from blocking plant-based options, while acknowledging it isn't zero-impact.

  **3. Assess Welfare Tier (Published Data Only)**
  *   **Tier 1 (Industrial/Unknown):** No multiplier.
  *   **Tier 2 (Certified Higher Welfare e.g., RSPCA/Outdoor):** Multiplier **0.5** (Reduces the "harm score" by half).
  *   **Tier 3 (Regenerative/Smallhold):** Multiplier **0.2**.
  *   *Constraint:* If supplier data isn't public, default to Tier 1. Legal prohibits welfare claims on-menu.

  **4. Calculate the "Harm Score"**
  *   `Harm Score = (Individuals per Serving) × (Intentionality Weight) × (Welfare Multiplier)`
  *   **Green:** Score < 0.1 (Plant-based or very low impact).
  *   **Amber:** Score 0.1 – 1.0 (High-welfare meat or low-welfare small bird/fish).
  *   **Red:** Score > 1.0 (Industrial chicken, pork, or high-volume fish).
  *   *Note:* A beef burger is often Green/Amber. A chicken burger is often Red, due to individual count.

  **5. The "Existence" Exception (Values Call)**
  *   If a dish is **Red** but claims high welfare (e.g., expensive outdoor pork), the math says "No."
  *   If Procurement argues "Buying this supports good lives," this is **not a calculation**. It is a values judgment.
  *   **Action:** Flag for **Head of Catering**. They must sign a waiver stating: *"We accept higher animal impact to support specific welfare standards."*

  **6. Final Approval**
  *   **Green:** Site Manager approves.
  *   **Amber:** Sustainability Lead approves.
  *   **Red:** Head of Catering approves (requires written justification).

  ---

  # OPERATIONAL MANUAL (LONG VERSION)

  ## 1. Context & Philosophy
  This procedure prioritizes **Individual Sentient Lives** over Carbon or Weight. This is a deliberate choice. Carbon metrics often favor chicken over beef; this policy recognizes that swapping beef for chicken increases the number of deaths significantly.
  *   **We acknowledge:** Crop production causes animal death (field mice, birds).
  *   **We distinguish:** Intentional slaughter vs. incidental harvest death.
  *   **We admit:** We cannot calculate the value of "a life lived." That is a strategic decision, not a mathematical one.

  ## 2. Data & Constants (For the 30-Minute Calc)
  Managers do not need to contact suppliers. Use these industry averages for estimation.

  | Protein Source | Avg. Carcass Yield (Meat) | Individuals per 1kg Meat | Intentionality Weight |
  | :--- | :--- | :--- | :--- |
  | **Beef** | 250 kg | 0.004 | 1.0 |
  | **Lamb** | 20 kg | 0.05 | 1.0 |
  | **Pork** | 75 kg | 0.013 | 1.0 |
  | **Chicken** | 2 kg | 0.5 | 1.0 |
  | **Eggs** | 0.06 kg (per hen/year) | ~16 (per kg protein/yr)* | 1.0 |
  | **Lentils/Grains** | N/A | N/A | 0.1 |
  | **Wild Fish** | N/A | 1.0 (High Uncertainty) | 1.0 |

  *\*Note on Eggs: High turnover of hens makes individual count high per kg protein.*

  **Welfare Multipliers (Based on Public Certifications)**
  *   **Standard/Red Tractor:** 1.0 (No reduction in harm score).
  *   **RSPCA Assured / Free Range:** 0.5.
  *   **Organic / Pasture for Life:** 0.2.
  *   **Unknown:** 1.0 (Assume worst case).

  ## 3. Step-by-Step Procedure

  **Step 1: Define the Serving**
  *   Identify the protein weight in the dish (e.g., 150g beef patty).
  *   Convert to kg (0.15kg).

  **Step 2: Calculate Individuals**
  *   Multiply kg by "Individuals per 1kg Meat" from the table.
  *   *Example (Chicken):* 0.15kg × 0.5 = 0.075 chickens per burger.
  *   *Example (Beef):* 0.15kg × 0.004 = 0.0006 cows per burger.

  **Step 3: Apply Intentionality**
  *   If Meat: Keep number as is.
  *   If Plant: Multiply by 0.1 (to account for field deaths without equating them to slaughter).

  **Step 4: Apply Welfare**
  *   Check supplier certification. Apply multiplier (1.0, 0.5, or 0.2).
  *   *Result = Harm Score.*

  **Step 5: Route for Approval**
  *   **Score < 0.01:** Auto-approve (Site Manager).
  *   **Score 0.01 – 0.1:** Review (Sustainability Lead).
  *   **Score > 0.1:** Executive Decision (Head of Catering).

  ## 4. Handling the "Existence Argument"
  *   **The Claim:** "If we don't buy this pork, these pigs never exist. A good life is better than no life."
  *   **The Policy:** This procedure minimizes harm/death. It does not maximize "net happiness."
  *   **The Process:** If Procurement wishes to override a "Red" score based on this argument, they must submit an **Ethical Waiver**.
  *   **The Waiver:** Must state: *"We are choosing to bring animals into existence for food, accepting their eventual slaughter, because we judge their lives to be net-positive."*
  *   **Sign-off:** Head of Catering + Sustainability Lead. This creates a paper trail for the values choice.

  ## 5. Limitations & "Bugs"
  *   **Carbon vs. Animals:** This policy may favor Beef over Chicken (fewer deaths), while Carbon policy favors Chicken over Beef (less methane). **Conflict Resolution:** If Carbon and Animal goals clash, Head of Catering decides the priority for that quarter.
  *   **Data Precision:** We are using averages. A specific cow might yield less meat. This is acceptable error for a canteen policy.
  *   **The "Trap":** Two reasonable people may disagree on the "Existence Waiver." This is not a bug; it is ethics. The procedure forces the disagreement into a signature, not a hallway argument.

  ---

  # TEST CASES (RUNNING THE PROCEDURE)

  ### Case A: Beef Burger -> Chicken Burger (Same Protein Weight)
  *   **Input:** 150g patty.
  *   **Beef Math:** 0.15kg × 0.004 (Individuals) × 1.0 (Intentional) × 1.0 (Standard Welfare) = **0.0006 Harm Score**.
  *   **Chicken Math:** 0.15kg × 0.5 (Individuals) × 1.0 (Intentional) × 1.0 (Standard Welfare) = **0.075 Harm Score**.
  *   **Comparison:** The Chicken Burger has a Harm Score **125x higher** than the Beef Burger.
  *   **Outcome:**
      *   Beef: Green (Auto-approve).
      *   Chicken: Amber/Red (Requires Review).
  *   **Uncomfortable Truth:** To minimize animal death, **we should serve more beef and less chicken.** This contradicts standard "sustainability" (carbon) advice. The Head of Catering must decide if Carbon or Animal Count takes precedence. If Animal Count wins, the swap is rejected.

  ### Case B: Beef Burger -> Lentil & Rice (Same Protein Weight)
  *   **Input:** 150g equivalent.
  *   **Beef Math:** 0.0006 Harm Score (from above).
  *   **Lentil Math:** 0.15kg × 0 (Livestock) × 0.1 (Crop Incidental) = **0.015 Harm Score**.
      *   *Note:* Even with the 10% crop death penalty, plant protein scores higher harm than beef in this specific model because the "Individuals per kg" for crops is treated as negligible but non-zero, whereas beef is extremely low death-count per kg.
      *   *Correction on Logic:* Wait, the table says Crops are 0.1 Intentionality. But do we count individuals for crops? There is no "Individuals per kg" for lentils. We treat the *weight* as the proxy for incidental death risk.
      *   *Revised Lentil Math:* 0.15kg × 0.1 (Incidental Factor) = **0.015**.
  *   **Comparison:** 0.0006 (Beef) vs 0.015 (Lentil).
  *   **Outcome:** Technically, the **Beef scores lower** on this specific "Individual Death" metric than the Lentil if we assume high crop mortality.
  *   **Policy Adjustment:** This reveals the flaw in the "Crop Death" argument if taken too literally. To prevent blocking all plant food: **Cap the Crop Penalty.**
      *   *Rule:* Plant-based dishes are automatically **Green** regardless of the calculation, provided they contain no animal products. The "Crop Death" metric is for internal reporting only, not for blocking plant dishes.
      *   *Revised Outcome:* Lentil is Green (Auto-approve). Beef is Green (Auto-approve).
      *   *Why:* We prioritize reducing *intentional* slaughter above all. The procedure protects plant options from being "mathed" out of existence by field mice arguments.

  ### Case C: High-Welfare Pork (3x Price, Outdoor)
  *   **Input:** 150g portion.
  *   **Standard Pork Math:** 0.15kg × 0.013 × 1.0 (Intentional) × 1.0 (Standard) = **0.00195**.
  *   **High-Welfare Math:** 0.15kg × 0.013 × 1.0 (Intentional) × 0.2 (Organic/Pasture) = **0.00039**.
  *   **Comparison:** The High-Welfare Pork has a **lower Harm Score** than the Standard Pork.
  *   **Financial Constraint:** Price is 3x.
  *   **Outcome:**
      *   Ethically: Approved (Green).
      *   Financially: Requires Budget Override.
      *   **The Existence Trap:** If the Head of Catering says "No, it's too expensive, buy the cheap one," the policy holds. If they say "No, it's too expensive, go Vegetarian," the policy holds (Veg is lower score).
      *   **The Waiver:** If they want to buy the High-Welfare Pork *because* "it gives the pigs a life," they must sign the **Ethical Waiver**. They are formally stating that bringing a pig into existence to kill it is a net positive.
      *   **Recommendation:** Do not sign the Waiver. Buy the High-Welfare Pork because it reduces suffering (0.2 multiplier), not because it creates life. Keep the justification on welfare, not existence.

  ---

  # WHAT THIS PROCEDURE CANNOT DO (The "Bugs")

  **1. The Carbon vs. Animals Conflict**
  *   **The Bug:** Case A shows Beef is "better" for animals (fewer deaths) but "worse" for climate (more methane). Chicken is "worse" for animals (more deaths) but "better" for climate.
  *   **The Reality:** Two reasonable people will land in different places. One prioritizes suffering/death; the other prioritizes ecosystem collapse.
  *   **Is this a bug?** No. It's a value hierarchy. The procedure forces you to pick which metric rules. I have written this to prioritize **Individual Lives**. If you want to prioritize Carbon, change the "Unit of Account" in Step 1. You cannot optimize for both simultaneously on every dish.

  **2. The "Existence" Trap**
  *   **The Bug:** The intern's point (buying meat creates life) cannot be calculated.
  *   **The Reality:** If you accept the "Existence Waiver," you open the door to justifying any level of slaughter as long as the life was "good." This undermines the "Minimize Harm" goal.
  *   **Is this a bug?** Yes, logically. But operationally necessary. The procedure handles this by making it a **Signature Event**. It stops being a math problem and becomes a leadership liability. Most leaders won't sign it. That solves the problem without arguing philosophy.

  **3. The Crop Death Swamp**
  *   **The Bug:** If you count crop deaths honestly, veganism isn't zero-harm. If you count them equally to slaughter, veganism is impossible.
  *   **The Reality:** The "10% Intentionality Weight" is a fudge factor. It is arbitrary.
  *   **Is this a bug?** It's a heuristic. It acknowledges the truth (farming kills field animals) without letting it paralyze decision-making (so we still serve lentils). It stops the "what about the mice" argument from being used to defend beef.

  **4. Data Blindness**
  *   **The Bug:** We are using industry averages. A specific "high welfare" chicken farm might still slaughter at 6 weeks.
  *   **The Reality:** You can't audit every farm.
  *   **Is this a bug?** It's a constraint. The policy relies on certifications. If the certification lies, the policy fails. That is a supplier risk, not a procedure failure.

  ### Final Advice for the Sustainability Lead
  This policy will tell you that **industrial chicken is your biggest ethical problem**, not beef. It will tell you that **high-welfare pork is ethically superior to standard pork**, even if the death count is the same. It will tell you that **you cannot mathematically solve the "value of life" question**.

  Expect pushback from the Carbon team (who want less beef) and the Budget team (who want cheap chicken). Your defense is: *"This procedure measures Animal Impact, not Carbon or Cost. If we want to measure those, we need a separate policy. This one stops us from swapping beef for chicken and thinking we've helped the animals."*
