prompt: |-
  I run sustainability for a small chain of staff canteens -- nine sites, about 4000 lunches a day -- and I've been told to write the protein policy. Which in practice means: a procedure my site managers and the procurement person can run on any dish or any swap to decide how bad it is for animals, so we stop having the same fight every menu cyle.

  The fight, in case it helps: the veggie crowd says drop the beef, obviously. But a couple of us read the stuff about field animals -- that harvesting a field kills a fair number of mice and birds and the like, so a lentil bake isn't free either -- and then the intern pointed out that if you count individuals rather than kilos, chicken comes out worse than beef by a mile, because a cow is one animal and a chicken is, well, not one cow. She wants a two-column thing: how many animals, times how bad each death is, and she says both columns have to be in there or we're just counting heads. And she raised the awkward one too: if we buy less meat, there's less demand for farmed animals to exist at all, and she reckons some people think a life worth living is a good thing, so buying from a genuinely good farm might be a plus, not a minus. I don't know what to do with that and I half suspect it's a trap, but the procedure has to say something about it -- even if the something is "we don't score this, here's why, and here's who decides instead."

  What I want: a decision procedure, in order, that a site manager with no philosophy traing can run in about half an hour on one dish or one swap. The questions to ask in sequence, what counts as a good enough answer to each, where it stops with a clear no or a clear go, and where it has to be handed to a person because it's a values call rather than a fact. It has to tell me which unit to count in -- deaths, kilos, animal-years, calories, servings -- or tell me honestly that the choice of unit is doing most of the work and can't be made by procedure at all. And it has to handle the crop-death thing without either ignoring it or letting it swamp everything else.

  Constraints: I can't ask suppliers for anything they don't already publish, I've got roughly one number per dish (weight, and a vague idea where it came from), the head of catering signs off on anything that changes a recipe, and legal have said we can't put welfare claims on the menu. Assume whoever runs it is smart but untrained. Give me a one-page version and the long version.

  Then run it on three cases: (a) swapping a beef burger for a chicken burger at the same protein, (b) swapping the beef burger for a lentil-and-rice thing, (c) a pork dish where the only supplier we can actually get is a high-welfare outdoor one at triple the price.

  I'm expecting it to tell me something I don't like, so don't sand it off. And tell me what the procedure can't do -- the cases where two reasonable people run it and land in different places, and whether that's a bug or just ethics.
reasoning: |-
  Here's a thinking process that leads to the suggested protein policy and decision procedure:

  1.  **Deconstruct the Request:**

      *   **Role:** Sustainability lead for a small chain of staff canteens (9 sites, 4000 lunches/day).
      *   **Task:** Write a "Protein Policy" (decision procedure) for site managers and procurement.
      *   **Goal:** Stop recurring arguments during menu cycles about animal welfare/sustainability.
      *   **Key Conflicts/Inputs:**
          *   Veggie crowd: Drop beef.
          *   "Field Animal" argument: Crops kill mice/birds (lentils aren't free).
          *   "Individual Count" argument (Intern): Chicken is worse than beef per kg because more individuals die.
          *   "Existence" argument (Intern): Does a life worth living justify existence? (High welfare vs. no life).
          *   "Unit of Measure" problem: Deaths vs. kilos vs. animal-years vs. calories.
      *   **Requirements:**
          *   Decision procedure (step-by-step).
          *   Time limit: ~30 mins for a site manager.
          *   Audience: Smart but untrained in philosophy.
          *   Constraints: No extra supplier data (only published info), limited internal data (weight, vague origin), Head of Catering signs off, Legal says no welfare claims on menu.
          *   Output: One-page version + Long version.
          *   Test Cases: (a) Beef -> Chicken, (b) Beef -> Lentil, (c) High-welfare Pork (3x price).
          *   Honesty: Don't sand off the uncomfortable conclusions. Acknowledge limitations/ambiguities.

  2.  **Analyze the Ethical/Philosophical Underpinnings:**

      *   *Utilitarianism (Suffering-focused):* Minimize total suffering. Favors fewer animals, better lives. Chicken usually loses here due to numbers.
      *   *Rights-based:* Animals have a right not to be killed. Favors plant-based. Crop deaths are incidental, not intentional killing for food (usually).
      *   *Welfarist:* It's okay to use animals if they have a "good life." Favors high-welfare meat.
      *   *The "Crop Death" Dilemma:* This is often used as a *reductio ad absurdum* by meat-eaters to defend meat. Ethically, intentional killing for taste vs. incidental death in harvest are usually weighted differently. The procedure needs to acknowledge crop deaths without equating them to livestock slaughter.
      *   *The "Existence" Dilemma:* If we don't buy meat, the animal isn't born. Is non-existence worse than a good life + death? This is the "Non-Identity Problem." It's philosophically thorny. The procedure needs to park this as a "Values Call" rather than a calculation, because there is no objective math for "value of existence."

  3.  **Drafting the Decision Procedure (The "Algorithm"):**

      *   *Step 1: The Unit of Measure.* The prompt asks to address this. Counting *individuals* is the most ethically robust for welfare, but *kg* is standard for procurement. *Animal-years* is good for welfare intensity. Let's prioritize **Individual Lives Affected** as the primary metric for "badness," weighted by **Welfare Status**. Why? Because the intern's point (chicken vs. beef) is the strongest ethical lever here.
      *   *Step 2: Crop Deaths.* Acknowledge them but categorize them as "Incidental" vs. "Intentional." Intentional (livestock) weighs heavier.
      *   *Step 3: The Existence Question.* This cannot be calculated. It must be a governance decision.
      *   *Step 4: The Flow.*
          1.  Identify Protein Source.
          2.  Calculate Individuals per Serving.
          3.  Assess Welfare Tier (Published standards only).
          4.  Apply "Crop Discount" (acknowledge but don't equate).
          5.  Check "Existence" Clause (The Values Call).
          6.  Final Decision/Sign-off.

  4.  **Refining the Procedure for Constraints:**

      *   *Constraint:* Site managers have ~30 mins and limited data.
      *   *Solution:* Pre-calculated lookup tables are necessary. They can't do math on the fly. The policy must mandate the creation of a "Protein Scorecard" by the Sustainability Lead (me) based on average data, which managers then consult. *Wait, the prompt asks for a procedure the manager can run.* Okay, I need to simplify the math or provide the constants. Let's provide the constants in the "Long Version" so they can do the calculation if a new dish appears.
      *   *Constraint:* Legal says no welfare claims on menu.
      *   *Solution:* The policy is internal. The output is "Approved/Not Approved," not "Humane."
      *   *Constraint:* Price (Pork case).
      *   *Solution:* Sustainability vs. Budget. The procedure needs a "Budget Override" step or acknowledge that high welfare might be cost-prohibitive.

  5.  **Developing the Test Cases:**

      *   *(a) Beef -> Chicken:*
          *   Beef: 1 animal, ~500kg meat, high welfare potential, high methane.
          *   Chicken: 1 animal, ~2kg meat, industrial welfare usually low, low methane.
          *   Per kg protein: Chicken requires ~250x more deaths than beef.
          *   *Result:* Procedure should flag Chicken as higher "Animal Cost" despite lower carbon.
      *   *(b) Beef -> Lentil:*
          *   Lentil: Crop deaths exist (mice/bugs).
          *   *Result:* Procedure must weigh intentional slaughter vs. incidental harvest death. Lentil wins on "Intentional," but the "Crop Death" note must be recorded to satisfy the intern's logic.
      *   *(c) High-Welfare Pork:*
          *   Standard vs. Outdoor.
          *   Price 3x.
          *   *Result:* Ethically better, financially harder. The "Existence" argument comes in here. Is it better to buy this or go veg? This is the "Values Call."

  6.  **Addressing the "Uncomfortable Truths":**

      *   If we count individuals, chicken is a disaster compared to beef. Most sustainability policies focus on Carbon (where beef is worst). This policy focuses on *Animals*. This will clash with Carbon goals. I need to highlight this tension.
      *   Crop deaths: If we count them equally to slaughter, veganism is impossible. If we ignore them, the logic is inconsistent. The middle ground is "Intentionality Weighting."
      *   Existence: We can't solve this. We must assign it to the Head of Catering.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, direct, operational, ethically honest.
      *   *Structure:*
          1.  Executive Summary (One-Pager).
          2.  Operational Manual (Long Version).
          3.  Test Cases.
          4.  Limitations/Philosophical "Bugs."

      *   *Key Decision Point:* The "Unit." I will recommend **Weighted Individual Lives** as the primary unit.
      *   *Formula:* `(Individuals per kg) × (Welfare Penalty Factor) × (Intentionality Weight)`.
      *   *Simplification for Managers:* Use a Traffic Light system based on pre-calculated data, with a "New Dish" flowchart.

      *(Self-Correction during drafting)*: The prompt asks for a procedure a manager can run *on a dish*. They can't look up a pre-made table for *every* possible new dish. They need a way to estimate. I will provide "Standard Constants" in the long version (e.g., "Assume 1 cow = 400kg meat", "Assume 1 chicken = 2kg meat").

      *The "Existence" Trap:* The intern is right that this is a values call. The procedure must explicitly state: "This procedure minimizes harm. It does not evaluate the value of existence. That is a strategic decision."

      *Crop Deaths:* Use a "10% Rule" or similar heuristic? No, better to categorize. Livestock = Intentional. Crops = Incidental. Intentional counts 100%. Incidental counts 0% for the *protein score* but is noted for *biodiversity impact*. This stops the "lentils kill mice" argument from blocking plant-based options while acknowledging the truth.

  8.  **Final Review against Constraints:**
      *   30 mins? Yes, if constants are provided.
      *   No supplier data? Yes, use industry averages.
      *   Legal? Yes, internal doc only.
      *   Uncomfortable truths? Yes, specifically on Chicken vs. Beef and the Existence question.

  9.  **Final Polish:** Ensure the distinction between the "One-Pager" (The Rule) and the "Long Version" (The How-To) is clear. Ensure the Test Cases show the friction points.

  *(Self-Correction on the "Existence" argument)*: I need to be careful not to validate the idea that "buying meat creates life" as a net positive without heavy caveats. The standard ethical view is that non-existence isn't a harm. But the prompt says the procedure has to say *something*. I will frame it as a "Strategic Exception" requiring Head of Catering sign-off.

  *(Self-Correction on Units)*: The prompt asks to tell them which unit to count in. I will state clearly: **Individual Sentient Lives** is the moral unit, **Kilos** is the procurement unit. The procedure converts Kilos to Lives.

