answer: |-
  This is a fantastic pedagogical challenge. You are right to resist the "QTM with nice prose" reduction; Hume's genius is in the *dynamics* of adjustment, not just the equilibrium state. Your flatmate is describing the destination; Hume is describing the journey. The game needs to make the journey uncomfortable and profitable in equal measure.

  Here is a complete lesson plan designed to fit your 75-minute window, specifically engineered to generate the "Interval" experience and the Mercantilist tension.

  # Seminar Plan: Hume's Interval & The Oil of Money
  **Time:** 75 Minutes
  **Students:** 22
  **Room:** Movable chairs (arrange into two distinct clusters)

  ## 1. Learning Objectives
  By the end of the session, students will be able to:
  1.  Distinguish between money as *wealth* vs. money as *instrument* (Oil vs. Wheels).
  2.  Explain why an increase in money supply stimulates industry *temporarily* (The Interval).
  3.  Demonstrate why a favorable balance of trade is self-correcting (Anti-Mercantilism).
  4.  Evaluate the distributional consequences of money injection (Who gets the chips first?).

  ## 2. Materials List
  *   **Currency:** 200 Poker Chips (Two colors: White for "Domestic", Blue for "Foreign/Silver").
  *   **Goods:** 100 Index Cards, stamped "Wheat" (50) and "Cloth" (50).
  *   **Labor Slips:** 50 small slips of paper (to represent production capacity).
  *   **Island Banners:** Two signs ("Albion" and "Gallia").
  *   **Scoreboard:** Whiteboard to track Round Prices and Island Treasuries.
  *   **Handouts:** One "Merchant's Ledger" per student (simple grid for recording Chips held, Goods sold, Goods bought).

  ## 3. Game Setup (10 Minutes)
  **The World:**
  *   Split the class into two islands: **Albion** (11 students) and **Gallia** (11 students).
  *   **Endowments:**
      *   Every student gets 10 Chips (White) and 2 Goods Cards (mix of Wheat/Cloth).
      *   **Albion** is the "Trade Surplus" nation (start with 5 extra Labor Slips).
      *   **Gallia** is the "Trade Deficit" nation.
  *   **Roles:** Everyone is a Merchant-Producer. You produce goods to sell, sell goods for chips, and use chips to buy goods for consumption.
  *   **The Goal (The Trap):**
      1.  **Individual Score:** Based on **Goods Consumed** at the end. (Wealth = Standard of Living).
      2.  **Island Score:** Based on **Chips Hoarded** in the Island Treasury at the end. (Wealth = Bullion).
      *   *Tell them:* "The University is grading *both*. High individual consumption gets you participation credit. The Island with the most chips in its treasury gets a 'National Prestige' bonus (e.g., candy/ chocolates for the whole group)."
      *   *Why:* This forces the Mercantilist tension. To help the Island, you must hoard chips (not buy). To help yourself, you must spend chips (buy goods).

  **The Market Mechanism (Crucial for Timekeeping):**
  *   **No Haggling.** To save time, you (the TA) are the **Clearing House**.
  *   **Price Formula:** $P = \frac{\text{Total Chips Bidded}}{\text{Total Goods Offered}}$.
  *   **Process:**
      1.  Students decide how much to **Sell** (Supply) and how many Chips to **Bid** (Demand).
      2.  They submit slips to you.
      3.  You calculate the Market Price.
      4.  You execute trades proportionally. (If Price is 2 Chips/Good, and you bid 10, you get 5 Goods).

  ## 4. Round Structure (35 Minutes Total)
  *Run 4 Rounds. 8 Minutes per round.*

  **Round 1: Baseline (Steady State)**
  *   **Instruction:** "Produce and Trade normally."
  *   **Action:** Students submit Supply & Bids.
  *   **Outcome:** Calculate Price $P_1$. Record on board.
  *   **Hume Point:** Money is circulating, prices are stable. Money is "Oil."

  **Round 2: The Treasure Fleet (The Injection)**
  *   **Secret Instruction:** Hand 5 students in **Albion** (The "Merchants") an envelope containing +20 Blue Chips each. *Do not announce this to the room.*
  *   **Instruction:** "Make your production and bidding decisions."
  *   **Action:** The 5 Merchants now have massive liquidity. They bid aggressively.
  *   **Outcome:** Total Chips in market rises. Supply is fixed (based on Round 1 expectations). Price $P_2$ spikes.
  *   **Hume Point:** Money enters at a specific point. Prices rise *before* production adjusts.

  **Round 3: The Interval (Exciting Industry)**
  *   **Secret Instruction:** Hand the remaining 6 students in **Albion** (The "Landlords") +20 Blue Chips each.
  *   **Public Info:** Announce Round 2's High Price ($P_2$).
  *   **Instruction:** "Look at last round's price. Decide your effort."
  *   **Action:** Seeing high prices in Round 2, *everyone* (including Gallia) thinks "Demand is high!" They increase Supply (turn in Labor Slips for more Goods) to capture profit.
  *   **Outcome:** Money Supply is now double. Supply has increased. Price $P_3$ stabilizes or rises slightly less than M increased.
  *   **Hume Point:** "The augmentation may have some influence, by exciting industry." Producers worked harder because they saw nominal price rises.

  **Round 4: Settlement (Neutrality)**
  *   **Instruction:** "Final Round. Maximize your score."
  *   **Action:** Prices are now fully adjusted. Students realize chips buy less.
  *   **Outcome:** Price $P_4$ is roughly double $P_1$. Supply drops back to baseline (effort isn't worth it for nominal gains).
  *   **Flow:** Albion students have spent chips on Gallian goods. Chips have flowed to Gallia.
  *   **Hume Point:** "After prices are settled... it has no manner of influence." Money is neutral. Trade balance self-corrects (Albion lost chips to Gallia).

  ## 5. The Debrief (25 Minutes)
  *Do not lecture. Ask them to report their data.*

  **Step 1: The Data (5 mins)**
  *   Write the 4 Round Prices on the board.
  *   Ask: "Did the price rise immediately in Round 2? Or did it lag?"
  *   Ask Island Treasuries: "Who hoarded more? Did it make you richer individually?"

  **Step 2: Mapping to Hume (15 mins)**
  *   **Oil vs. Wheels:** Point to the Goods. "Did the number of chips change the number of wheat cards produced in the long run? No. The chips just facilitated the exchange. That's the Oil."
  *   **The Interval:** Point to Round 3. "Why did you produce more goods in Round 3?" (Students: "Because prices looked high in Round 2"). "Exactly. You mistook nominal price rises for real demand. That is the Interval. That is where Hume says money matters."
  *   **The Distribution:** Ask the Albion Merchants (Round 2 recipients) vs. Gallia. "Who bought goods at old prices?" (Merchants). "Who sold goods at new prices?" (Gallia). "Who lost?" (The Albion Landlords who got money in Round 3 when prices were already high).
      *   *Hume Quote:* Read the "progress towards these changes" line.
  *   **Mercantilism:** Look at the Island Scores. "Albion probably lost chips to Gallia by the end. Did Albia starve? No. Did Gallia become powerful? No. The chips just moved to where goods were."
      *   *Hume Quote:* Read the "jealousy of trade" argument. One nation's gain is not another's loss.

  **Step 3: The Resolution Cost (5 mins)**
  *   Ask: "What was the cost of this adjustment?"
  *   *Answer:* Uncertainty. Misallocated labor (Round 3 over-production). Redistribution of wealth from late-receivers to early-receivers.
  *   *Conclusion:* Money is neutral in the long run, but *violent* in the short run.

  ## 6. Troubleshooting: What Will Go Wrong
  *Be ready for these. They are predictable.*

  **1. The "It's Just Inflation" Shout**
  *   **Risk:** An Econ major (like your flatmate) will announce in Round 2: "Don't work harder, it's just inflation."
  *   **Fix:** Do not announce the money injection size. Only the recipients know. To the rest of the room, it looks like a demand shock. If they shout it down, tell them: "In 1752, you don't have a central bank press release. You only see prices. Play based on what you *see*, not what you *know*."

  **2. The Hoarding Trap (Market Freeze)**
  *   **Risk:** Students realize hoarding chips wins the "Island Score" and refuse to spend. Market liquidity dries up.
  *   **Fix:** Remind them individually: "Your individual grade depends on *Consumption*. If you hoard chips but eat no wheat, you fail." Create the tension between National Glory and Personal Survival.

  **3. Gallia Checks Out**
  *   **Risk:** Gallia realizes they can't win the Treasury score and stop trading.
  *   **Fix:** Remind them that Albion *needs* their goods. If Gallia stops producing, Albion's chips become worthless. Gallia holds the real wealth (Goods). This mirrors Hume's point that goods are the real wealth, not money.

  **4. Price Calculation Takes Too Long**
  *   **Risk:** You spend 10 mins doing math on the whiteboard.
  *   **Fix:** Pre-calculate the multipliers. Or, appoint two students as "Clerks" (one per island) to sum the bids while you manage the flow.

  ## 7. Limitations: What The Game Cannot Do
  *Be honest here in the debrief. It strengthens your credibility.*

  **1. Real Output Rigidity**
  *   **Limitation:** In the game, "producing more" is just handing in a slip. It doesn't actually cost them effort or time.
  *   **Hume's Reality:** Hume argues that in the Interval, people *actually* work longer hours and innovate. The game simulates the *incentive*, but not the *fatigue* or the *technological change*. You have to tell them: "In reality, this effort costs utility. In the game, it was free. Imagine you stayed up all night copying ledgers for chips that turned out to be worthless."

  **2. Structural Distribution (Cantillon Effects)**
  *   **Limitation:** We randomized the "Merchants" and "Landlords."
  *   **Hume's Reality:** Hume knew exactly who got the money first: merchants, manufacturers, and the state. It wasn't random; it was structural. This reshapes the economy (more ships built, more looms bought) before prices rise. The game shows the *price* lag, but not the *structural* change. You must say: "In the game, you just bought more wheat. In history, the new money built factories that stayed even after prices rose."

  **3. Expectations Rationality**
  *   **Limitation:** Students are 2nd-year seminar students; they are hyper-rational.
  *   **Hume's Reality:** 18th-century agents operated on custom and habit. The "shock" was more profound. The game might clear too efficiently. Acknowledge that in reality, the confusion lasted longer, making the Interval more painful and potent.

  ## 8. The "Flatmate" Closing Argument
  *Give this to your students to take away (and for you to use later).*

  "Your flatmate is right that the *destination* is the Quantity Theory. If you pause the video at the very end, Hume agrees with Friedman. But if you watch the movie, Hume sees the plot. The plot is the Interval. The plot is that money enters through a door, not a helicopter. The plot is that while prices are rising, people are building things they wouldn't have built otherwise. By the time your flatmate's textbook model kicks in, the economy has already changed shape. Hume isn't wrong; he's just watching the transition your flatmate is assuming away."

  ---

  ### TA Cheat Sheet: Round Timing
  *   **00:00 - 00:10:** Setup & Rules.
  *   **00:10 - 00:18:** Round 1 (Baseline).
  *   **00:18 - 00:26:** Round 2 (Injection: 5 Albion Students).
  *   **00:26 - 00:34:** Round 3 (Injection: 6 Albion Students + Industry Response).
  *   **00:34 - 00:42:** Round 4 (Settlement).
  *   **00:42 - 01:07:** Debrief (Map to Text).
  *   **01:07 - 01:15:** Buffer/Q&A.

  *Good luck. Make them feel the inflation.*
