answer: |-
  Dear Colleague,

  Thank you for sharing this sketch, which strikes me as a provocative and potentially fruitful intervention in a debate that often feels exhausted. The question of whether there can be laws of history is a classic problem in the philosophy of social science, inevitably invoking the shadow of Popper and the historicist controversy, yet your approach via self-undermining regularities offers a fresh angle. You are rightly concerned about the charge of verbal legislation, specifically whether you are carving out a genuine ontological category or merely relabelling a failed prediction as a successful explanation. My assessment is that the distinction between a self-undermining regularity and a mere trend is robust, provided you lean heavily on the modal force of the counterfactuals you mention, but there are risks of overreach regarding the scale of these regularities and their relationship to the original Popperian argument that require careful handling.

  To address your primary worry about circularity, the distinction between your proposed category and a mere trend hinges on whether the regularity supports counterfactuals independently of the prediction failure. A trend is simply a statistical pattern over time; it tells us what has happened but offers no grip on what would have happened had conditions been slightly different. By contrast, your example of the preprint response norm claims explanatory power: it tells us why submissions were answered quickly and supports the claim that had an agent submitted a paper, they would have received a reply. This modal force is the hallmark of law-like behaviour in many accounts of scientific explanation, such as those derived from Hempel or Salmon, even if the predictive utility is compromised. The risk of circularity arises only if you define the regularity solely by its failure to predict once known. To avoid this, you must demonstrate that the counterfactual support rests on a causal mechanism, such as the strategic interdependence of agents, rather than merely on the observed stability of the pattern. If you can ground the regularity in the incentives and beliefs of the agents involved, then the counterfactuals do independent work, and you are not simply defining lawhood down to fit the example.

  Regarding the definition of lawhood, you are effectively challenging the traditional conjunction of explanation and prediction. In the natural sciences, laws are typically expected to do both, but in the social sciences, the reflexivity of human agents often decouples them. Your argument suggests that lawhood should be tied to explanatory capacity and counterfactual support, while prediction is contingent on the epistemic context of the agents involved. This is not a diminution of the concept but a refinement suited to the subject matter. However, you must anticipate the objection that a regularity which cannot survive its own publication is too fragile to bear the weight of the term law. You might counter this by drawing on Nancy Cartwright's notion of capacities or by appealing to the Lucas critique in economics, which similarly notes that policy rules change when agents anticipate them. By situating your argument within this existing literature on reflexivity, you show that you are identifying a structural feature of social ontology rather than engaging in verbal legislation.

  The question of whether your conclusion qualifies or merely restates the original case against laws of history is crucial. The standard Popperian argument rests on the unpredictability of the growth of knowledge as an input into historical change. Your argument accepts the conclusion that prophecy fails but offers a different reason for it. Popper argues we cannot predict because we cannot know the future state of science; you argue we cannot predict because the knowledge of the law itself alters the causal structure of the world. These are complementary but distinct claims. Your position qualifies the original case by shifting the focus from the limits of our knowledge to the limits of the stability of social mechanisms. It suggests that even if we could predict the growth of knowledge, we might still fail to predict historical outcomes because the regularities governing those outcomes are epistemically fragile. This is a substantive qualification because it leaves open the possibility of discovering laws that are real and explanatory, even if they are useless for prophecy, whereas the standard view often implies that the absence of predictive power signals the absence of law-like structure altogether.

  However, there is a risk of overreach in scaling your example from a small research field to history as a whole. The preprint norm is a micro-sociological phenomenon involving a specific, bounded community with clear incentives. Historical laws are typically expected to operate at a macro level, concerning states, economies, or civilisations. You need to address whether self-undermining regularities can aggregate to the macro level without dissolving into noise. It is one thing to say a norm erodes when published; it is another to claim that large-scale historical regularities, such as those concerning demographic transitions or state formation, are similarly fragile. If your argument relies on the assumption that all historical regularities are reflexive in this way, you may be overstating the case. It might be more defensible to argue that a significant class of historical regularities are self-undermining, rather than implying this is a universal feature of social laws. This would preserve the qualified yes without committing you to a radical scepticism about macro-historical stability.

  Furthermore, you should clarify the sense in which these regularities are unavailable for prediction. You suggest they are unavailable once the prediction becomes known, but in history, much knowledge is retrospective. A law of history might be useful for explaining the past even if it cannot predict the future, much like evolutionary theory explains biodiversity without predicting specific mutations. Your argument seems to imply that the unavailability for prediction is a defect relative to a certain ideal of science, but you might strengthen the chapter by arguing that this fragility is actually a feature that distinguishes social science from natural science. Rather than treating the inability to prophesy as a failure of social laws, you could frame it as evidence that social laws are constitutively different, dependent on the second-order beliefs of agents. This would reinforce your claim that the failure of prophecy is a feature of the subject matter rather than a defect in our methods.

  Finally, I would urge you to be precise about the mechanism of undermining. In your example, the publication of survey data changes beliefs, which changes behaviour. In historical contexts, the mechanism might be more diffuse. Is it always belief change, or can it be structural adaptation? If you can specify the mechanisms by which historical regularities undermine themselves, you will guard against the charge that you are merely describing contingent historical accidents. If the undermining is systematic, driven by the rational adaptation of agents to known constraints, then you have a strong case for a distinct category of regularity. If it is merely contingent that people read surveys and change their habits, then the regularity looks more like a trend that happened to stop. The strength of your argument lies in the necessity of the undermining, not just its occurrence.

  In sum, I believe you are onto a genuine refinement rather than verbal legislation, provided you ground the counterfactuals in causal mechanisms and carefully delineate the scope of these regularities. Your argument successfully shifts the debate from whether we can know the future to how our knowledge interacts with the social world, which is a valuable qualification of the standard case. By distinguishing between the ontological status of the regularity and its epistemic utility, you preserve the possibility of social scientific explanation without conceding to historicist prophecy. I look forward to seeing how this develops in the full chapter.

  Yours sincerely,

  Assistant
