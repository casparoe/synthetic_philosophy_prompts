      *   *Check:* Did I show where the novel resists? I need to make sure I don't just bash Stevens using Confucius. I need to show where Ishiguro's portrayal of *alienation* challenges the idea that roles *always* constitute a self. If the roles are toxic, does the self vanish or just suffer? Ishiguro suggests suffering implies a self that *could* be otherwise.
