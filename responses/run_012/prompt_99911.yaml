answer: |-
  **Project Title:** Beyond Features: A Contractual Framework for AI Agency and Control

  **Research Question**
  Can the distinction between "tool-AI" and "agent-AI" be rigorously defined by a *delegation contract* (who retains control vs. who executes commitment) rather than intrinsic system features, and does this definition resolve current classification ambiguities in safety-critical contexts?

  **Problem Statement**
  Current industry and academic distinctions between tools and agents rely on feature lists (e.g., goal-directedness, persistence, unprompted action). These features are orthogonal: a system can be goal-directed yet require human approval, or simple yet execute irreversible changes without review. Consequently, the labels function rhetorically rather than descriptively, creating gaps in safety policy and interface design. If we cannot determinately classify whether a system is acting as a tool or an agent, we cannot assign liability or design appropriate oversight. This project hypothesizes that "agency" is not an intrinsic property of the model but a relational property fixed by a delegation contract: a system is a tool when the human retains veto power over commitments, and an agent when the system is authorized to change world-states pre-review.

  **Methodology (12 Weeks, Part-Time)**
  *   **Weeks 1–3: Taxonomy & Case Collection.** Catalog existing definitions of "agent" vs. "tool" in internal docs and external literature. Identify 10–15 ambiguous real-world systems (e.g., auto-merge CI bots, autonomous trading limits, coding copilots) where current feature-lists yield conflicting classifications.
  *   **Weeks 4–6: Framework Construction.** Formalize the "Delegation Contract" model. Define operational metrics for "control retention" and "commitment authority." Draft the criteria that distinguish a *proposal* (output requires acceptance) from a *commitment* (output alters state immediately).
  *   **Weeks 7–9: Stress Testing.** Apply the framework to the collected case studies. Determine if the contractual model yields consistent classifications where feature-lists fail. Refine definitions based on edge cases (e.g., delayed execution, partial autonomy).
  *   **Weeks 10–12: Synthesis & Reporting.** Produce a final whitepaper outlining the framework, the results of the case studies, and specific recommendations for engineering policy (e.g., logging requirements for "commitment" vs. "proposal" modes).

  **Deliverables & Success Criteria**
  *   **Success:** A finalized conceptual framework that classifies the 10–15 ambiguous cases consistently, accompanied by a document mapping these classifications to specific engineering controls (e.g., audit logs, permission gates). The project succeeds if the contractual definition reduces classification variance compared to feature-based intuition.
  *   **Failure:** The "delegation contract" concept proves as vague as the feature lists it aims to replace, or the framework collapses into a restatement of existing definitions without offering new discriminatory power. If the week 6 draft cannot define "control" operationally, the project will be pivoted to a literature review only.

  **Feasibility Assessment**
  This scope is appropriate for a one-quarter, part-time engagement. Because the work is conceptual and analytical rather than empirical (no model training or data collection), the primary risk is scope creep into broad philosophical theory. To mitigate this, the project is constrained to *engineering-relevant* cases and policy implications. My background as a software engineer is an asset here: the goal is not to solve the metaphysics of agency, but to produce a working taxonomy for system design. The week-by-week plan allows for a hard stop at Week 6 if the core hypothesis proves unworkable, ensuring resources are not wasted on a non-viable framework.
