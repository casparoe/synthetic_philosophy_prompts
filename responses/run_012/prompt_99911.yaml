prompt: |-
  I'm a software engineer with no formal philosophy background, applying for a small internal research grant to spend one quarter, part-time, on a philosophy-of-AI project. My half-formed idea: the usual tool-AI/agent-AI distinction gets drawn by listing features — goal-directedness, acting without being prompted, persistence across sessions — and I suspect those features are largely orthogonal, so the label ends up doing rhetorical rather than descriptive work. I want to try a two-part reframing. First, ask whether the practically important cases all track a single axis, and whether that axis is really about whether a system's output is a proposal a human must still accept or a commitment that changes the world before anyone reviews it. Second, test the idea that 'tool' and 'agent' are not intrinsic kinds of systems at all but roles fixed by a delegation contract: the same system counts as a tool relative to a party who retains the relevant kind of control and as an agent relative to a party who has handed that control over. Turn this into a one-page proposal: state the question so it has a determinate answer, explain why the standard feature-list answers leave it open, describe the method I'd actually follow week by week, say what a result would look like and what would count as the project failing, and give an honest read on whether this fits a quarter of part-time work. I'll add references myself, so don't include citations or a reading list.
