answer: |-
  # Activity: The Moral Parliament Simulation
  **Topic:** Moral Uncertainty and the Aggregation Problem
  **Time:** 90 Minutes
  **Participants:** 18 Students (Upper-Level Undergraduate)
  **Facilitator:** 1 Instructor

  ## I. Learning Objectives
  By the end of this session, students will:
  1.  Experience the difficulty of aggregating conflicting moral verdicts under uncertainty.
  2.  Discover how theory individuation (counting theories vs. weighting views) alters outcomes.
  3.  Grapple with the necessity and arbitrariness of intertheoretic comparison (normalization).
  4.  Evaluate the cost of deferral (buying evidence) against the risk of moral error.

  ## II. Materials & Setup
  **Room:** Seminar style. Students seated in one large circle or three small clusters of six.
  **Handouts:**
  1.  **Advisor Cards (18 total):** Each card assigns a Moral Theory, a Credence (weight), and a Payoff Matrix for that theory.
  2.  **Policy Brief:** The dilemma scenario and the four options.
  3.  **Aggregation Worksheet:** A blank grid for the group to calculate total scores.
  4.  **Evidence Voucher:** One physical card placed in the center of the room.

  **The Dilemma:** *The Resource Allocation Crisis.*
  A regional authority has a surplus of a life-saving resource. They must choose one policy:
  *   **Option A (Maximize):** Distribute to those most likely to survive (Maximizes total life-years).
  *   **Option B (Prioritize):** Distribute to the worst-off first, regardless of survival chance.
  *   **Option C (Rights):** Distribute via lottery to respect equal claim; no triage.
  *   **Option D (Deferral):** Delay distribution to study efficacy (Costs 15% of resource value).

  **The Advisor Cards (Distribution):**
  *   **Group 1 (The Utilitarian Bloc - 6 students):**
      *   2 students: *Classical Utilitarianism* (Credence: 10% each)
      *   2 students: *Preference Utilitarianism* (Credence: 10% each)
      *   2 students: *Hedonic Utilitarianism* (Credence: 10% each)
      *   *Note:* All six have identical payoff scores. Option A = 100, B = 40, C = 30, D = 50.
  *   **Group 2 (The Deontologists - 4 students):**
      *   4 students: *Kantian Deontology* (Credence: 10% each)
      *   *Scores:* Option A = 20, B = 30, C = 100, D = 40.
  *   **Group 3 (The Prioritarians - 4 students):**
      *   4 students: *Prioritarianism* (Credence: 10% each)
      *   *Scores:* Option A = 60, B = 100, C = 50, D = 60.
      *   *Crucial Detail:* Their scores are on a raw scale of -50 to +150.
  *   **Group 4 (The Skeptics & Virtue - 4 students):**
      *   2 students: *Virtue Ethics* (Credence: 10% each) -> Scores: A=50, B=50, C=50, D=80.
      *   2 students: *Moral Skepticism* (Credence: 10% each) -> Scores: All Options = 0 (unless Deferral chosen, then 50).

  **Total Credence:** 180%? No. To simulate one agent, the credences must sum to 100%.
  *Correction for Facilitator:* Assign credences on the cards such that the *sum of all cards* = 100%.
  *   Utilitarian Bloc (6 cards): 5% each (Total 30%)
  *   Deontologists (4 cards): 10% each (Total 40%)
  *   Prioritarians (4 cards): 5% each (Total 20%)
  *   Skeptics/Virtue (4 cards): 2.5% each (Total 10%)
  *(Adjust numbers as needed to ensure the math works for the "Scale Flip" described below).*

  **Revised Credence & Scale Setup for the "Flip":**
  To ensure the scale choice flips the result, we need two dominant theories with incompatible scales.
  *   **Theory U (Utilitarian Bloc - 6 students, Total Credence 40%):** Scale 0–100. Option A = 100.
  *   **Theory D (Deontologists - 6 students, Total Credence 40%):** Scale -100 to +100. Option C = 100.
  *   **Theory P (Prioritarians - 6 students, Total Credence 20%):** Scale 0–10. Option B = 10.
  *   *Wait, the prompt requires near-duplicates.* Let's stick to the 18 students.
  *   **Utilitarian Split (6 students):** 5% credence each. Total 30%. Scale 0-100. Option A = 100.
  *   **Deontology (6 students):** 5% credence each. Total 30%. Scale -100 to +100. Option C = 100.
  *   **Prioritarianism (6 students):** 3.3% credence each. Total 20%. Scale 0-100. Option B = 100.
  *   **Skeptic (Remaining):** 20%.
  *   *Actually, keep it simple for the activity.*
      *   **6 Students (Util Variants):** 5% credence each. Total 30%. Scores 0-100. Best: A.
      *   **6 Students (Deontology):** 5% credence each. Total 30%. Scores -100 to +100. Best: C.
      *   **6 Students (Prioritarianism):** 5% credence each. Total 30%. Scores 0-10. Best: B.
      *   **Remaining Credence (10%):** Facilitator holds (Skepticism).
      *   *Scale Trick:* To aggregate Deontology (-100 to +100) with Utilitarianism (0 to 100), the group must normalize.
          *   Method 1 (Min-Max): Map worst outcome to 0, best to 1.
          *   Method 2 (Status Quo Anchor): Map "Doing Nothing" to 0.
          *   *The Flip:* If they use Min-Max, Deontology's "100" becomes "1". If they use Status Quo (where Status Quo is -50 for Deontology), the range expands, weighting Deontology more heavily in the sum.
          *   *Simpler implementation for 90 mins:* The handout gives Deontology raw points. Utilitarianism raw points. They must agree on a "Conversion Rate." 1 Deont Point = ? Util Points. If they set 1:1, Util wins. If they set 1 Deont Point = 2 Util Points (because rights are "priceless"), Deon wins.

  ## III. Timeline (90 Minutes)

  **0:00 – 0:10 | Introduction & Role Assignment**
  *   Distribute Advisor Cards face down.
  *   **Script:** "You are not 18 people. You are 18 voices in the mind of *one* Policy Director. The Director is uncertain which moral theory is true. Your card tells you which theory you represent and how confident the Director is in that theory (Credence). Your goal: Issue **one** policy recommendation. At the end, a 'True Theory' will be revealed. You earn points based on how well the chosen policy satisfies the True Theory."
  *   Students read cards silently.

  **0:10 – 0:30 | Round 1: The Naive Vote**
  *   Task: Reach a consensus on A, B, C, or D.
  *   **Predictable Failure:** Students will count heads (6 Util, 6 Deon, 6 Prior). They will ignore credence weights and scale differences. They will likely deadlock or majority vote.
  *   Facilitator observes. Do not intervene unless they finish early.
  *   *If they finish early:* Ask, "Are you sure? You have 10 minutes to revise."

  **0:30 – 0:40 | Intervention 1: The Credence & Scale Reveal**
  *   Stop the discussion.
  *   **Announcement:** "Counting heads is forbidden. You must calculate *Expected Choiceworthiness*. You must aggregate the scores weighted by credence."
  *   **The Scale Problem:** Point out that Deontology uses -100 to +100, while Utilitarianism uses 0 to 100. "You cannot add these numbers directly. You must agree on a conversion scale or normalization method as a group. Write your chosen method on the Worksheet."
  *   **The Deferral Option:** Place the **Evidence Voucher** in the center. "You may purchase this voucher once. Cost: 10 points deducted from the final group score. Benefit: You learn which *one* of the three main theories is definitely FALSE."

  **0:40 – 1:00 | Round 2: Aggregation & Negotiation**
  *   Students must now do the math.
  *   **Predictable Failure:** The Utilitarian Bloc (6 students) realizes they hold near-duplicates. If they argue as three distinct theories, they get 3 'votes' in the negotiation. If they admit they are the same, they get 1.
  *   **Predictable Failure:** The Deontologists and Prioritarians will fight over the normalization baseline. (e.g., "My worst case is -100, yours is 0. That's unfair.")
  *   **Deferral Decision:** They must vote on whether to buy the Evidence Voucher.

  **1:00 – 1:10 | Final Recommendation & The Reveal**
  *   Group submits final choice (A, B, C, or D) and their agreed-upon Scale/Normalization Method.
  *   **The Reveal:** Facilitator rolls a weighted die (or uses a random number generator) based on the initial Credence distribution to determine the "True Theory."
      *   *Example:* If Utilitarianism had 30% total credence, there is a 30% chance it is the True Theory.
  *   Calculate scores based on the chosen option's value for the True Theory.
  *   Announce individual and group scores.

  **1:10 – 1:30 | Debrief**
  *   Map the experience to philosophical concepts (see below).

  ## IV. Payoff Scheme
  **Individual Score Calculation:**
  $$ \text{Score} = (\text{Value of Chosen Option for Your Theory}) \times (\text{Your Theory's Credence}) $$
  *   *Exception:* If the "True Theory" reveal does not match your card, your multiplier is 0. (This simulates the risk of moral error).
  *   *Correction for Engagement:* To prevent total demoralization if their theory is "false," use this formula:
      $$ \text{Score} = (\text{Value of Chosen Option for Your Theory}) \times (\text{Your Theory's Credence}) + (\text{Base Participation Points}) $$
      *But to feel the force of uncertainty:* The "True Theory" determines the *conversion rate* of points to grade credit.
      *   **Better:** The Class has a **Collective Pot**.
      *   Pot Size = (Value of Chosen Option for the **True Theory**).
      *   If they chose Option A, and the True Theory is Utilitarianism (who loves A), Pot = 100.
      *   If they chose Option A, and True Theory is Deontology (who hates A), Pot = 20.
      *   This forces them to care about *Expected* Value, not just their own theory's value.

  **Deferral Cost:**
  *   If Option D is chosen, subtract 15 from the Collective Pot regardless of the True Theory.

  ## V. Debrief Guide (Mapping Experience to Theory)

  **1. Maximizing Expected Choiceworthiness (MEC)**
  *   *Ask:* "Did you try to maximize the average score across all theories?"
  *   *Concept:* This is the standard model for moral uncertainty (MacAskill). You weight verdicts by credence.
  *   *Observation:* Most groups fail this initially by voting by headcount.

  **2. Intertheoretic Comparison (The Scale Flip)**
  *   *Ask:* "How did you decide what 10 Deontological points were worth in Utilitarian units?"
  *   *Concept:* The "Normalization Problem." There is no objective exchange rate between 'rights' and 'utility.'
  *   *Reveal:* Show how Group X chose "Min-Max Normalization" (leading to Option A) and Group Y chose "Status Quo Anchor" (leading to Option C). The *methodology* determined the morality, not the moral facts.

  **3. Theory Individuation (The Near-Duplicate Trick)**
  *   *Ask:* "Did the Utilitarian students coordinate?"
  *   *Concept:* If you count *theories* rather than *credence mass*, you can game the system by splitting your view into 'Act Utilitarianism,' 'Rule Utilitarianism,' etc.
  *   *Lesson:* Aggregation procedures must be insensitive to arbitrary descriptions of theories (The "Individuation Problem").

  **4. Deferral as a Costly Signal**
  *   *Ask:* "Did you buy the Evidence Voucher? Why or why not?"
  *   *Concept:* Deferral (seeking more moral evidence) has opportunity costs. Sometimes acting on uncertainty is better than waiting.

  **5. The Parliamentary Model vs. Single Agent**
  *   *Ask:* "Did you feel like one person or a committee?"
  *   *Concept:* This activity uses the Parliamentary Model (Bostrom), where theories are delegates.
  *   *Critique:* Real moral uncertainty is inside one head, not a negotiation between people. The activity stages *disagreement among people* where the philosophical problem concerns *a single agent's uncertainty*.

  ## VI. Predictable Failures & Facilitator Handling

  **Failure 1: Collapsing into Ordinary Majority Voting**
  *   *Symptom:* Students ignore credence percentages and count cards (6 vs 6 vs 6).
  *   *Handling:* At minute 20, interrupt. "You are ignoring the weights on your cards. If your theory has 5% credence, your voice is 1/20th the volume of a theory with 100% credence (if one existed). Recalculate."

  **Failure 2: Declaring the Exercise Incoherent**
  *   *Symptom:* A Deontologist says, "You can't convert rights into utility points. It's category error."
  *   *Handling:* Validate this. "You have just identified the central problem of intertheoretic comparison. However, the Policy Director *must* act. Inaction is also a choice with a payoff (Option D). You must solve the incoherence to win the points."

  **Failure 3: Spotting the Near-Duplicate Trick Early**
  *   *Symptom:* Utilitarian students merge immediately in the first 10 minutes.
  *   *Handling:* Do not stop them. In the debrief, ask the other groups: "If an external agent could have split the Utilitarian view into 10 sub-views to gain more voting power, would you have noticed? This shows why 'counting theories' is a dangerous aggregation rule."

  ## VII. Limitations (What the Activity Cannot Reproduce)

  **1. The Single Agent Problem**
  *   *Limitation:* This activity simulates a committee. Real moral uncertainty is solitary.
  *   *Facilitator Script:* "In reality, there are no six Utilitarian students. There is one brain with conflicting neural pathways. This simulation externalizes internal conflict. Don't mistake the negotiation for the psychological reality."

  **2. Stipulated Scales**
  *   *Limitation:* I gave you numbers (-100 to +100). In real life, you don't know the 'range' of your moral theories.
  *   *Facilitator Script:* "I solved the measurement problem for you by handing you cards. In the real world, you don't know if violating a right is a -100 or a -1,000,000. The uncertainty about the *scale* is deeper than the uncertainty about the *theory*."

  **3. The 'True Theory' Reveal**
  *   *Limitation:* We revealed a True Theory at the end. Moral realists might agree, but anti-realists would say there is no True Theory to reveal.
  *   *Facilitator Script:* "The reveal was a mechanic to calculate scores. It does not imply moral realism is true. It only implies that for the sake of the game, we treated one view as authoritative."

  ## VIII. Facilitator Checklist
  *   [ ] Print 18 Advisor Cards (ensure Credence sums to 100%).
  *   [ ] Prepare Weighted Randomizer for "True Theory" reveal.
  *   [ ] Print Aggregation Worksheets with blank normalization fields.
  *   [ ] Set timer for strict rounds.
  *   [ ] Prepare whiteboard to display the "Scale Flip" math during debrief.
