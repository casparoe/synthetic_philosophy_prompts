  11. **Final Review against Constraints:**
      *   90 mins? Yes.
      *   18 students? Yes.
      *   4 Options? Yes.
      *   Points not money? Yes.
      *   Hidden Feature 1 (Duplicates)? Yes (Utilitarian variants).
      *   Hidden Feature 2 (Scale)? Yes (Normalization baseline).
      *   Deferral Cost? Yes.
      *   Debrief mapping? Yes.
      *   Predictable failures? Yes.
      *   Limitations? Yes.
      *   American English? Yes.

  12. **Polishing the Tone:** Ensure it sounds like a facilitator's guide—practical, direct, and philosophically precise. (Self-Correction: Make sure the scoring mechanism is clear. If the group chooses Option A, and the "True Theory" is Utilitarianism, everyone gets points based on how much Utilitarianism likes Option A? No, the prompt says "earning points... depending on which option is chosen and on which theory a final reveal declares correct." This implies the *student's* score depends on whether *their* theory was right AND the option was good for that theory. Actually, to simulate *one agent*, the *group's* score should depend on the Expected Choiceworthiness. But to keep them engaged individually, let's give individual points based on their theory's performance. Wait, if they are simulating one agent, they should share a collective score. Let's make it a collective class score to encourage cooperation, but individual recognition for the "winning theory" holders. Actually, the prompt says "earning points...". Let's make it individual points to create tension, but the goal is a single recommendation. Okay, individual points based on: (Group Choice Value according to Student's Theory) x (Probability Student's Theory is True). No, that's too complex.
      *   *Simpler:* At the end, a die roll determines the "True Theory" based on the credence distribution. If Utilitarianism (40% total credence) is rolled, then scores are calculated based on how good the chosen option was for Utilitarianism. All students holding Utilitarian cards get high points if Option A was chosen. Students holding Deontology cards get low points. This aligns incentives with "Maximizing Expected Choiceworthiness" for the *group*.)
      *   *Revised Payoff:* The Class has a Collective Score. The score is determined by: 1. Determine "True Theory" via weighted random draw (based on assigned credences). 2. Look up the value of the Chosen Option for that Theory. 3. That is the Class Score.
      *   *Wait, individual engagement:* If it's just a class score, free-riding occurs.
      *   *Better:* Individual Score = (Value of Chosen Option for *Your* Theory) * (Your Theory's Credence). This encourages them to argue for their theory but also care about the aggregate.
      *   *Actually, let's stick to the prompt's spirit:* "earning points... depending on which option is chosen and on which theory a final reveal declares correct."
      *   *Decision:* Individual points. If the "True Theory" is revealed to be Utilitarianism, then students holding Utilitarian cards get points based on how well the chosen option satisfied Utilitarianism. Students holding Deontology cards get nothing (or penalty). This makes them feel the risk of moral error.

      *   *Wait, one more check on Feature 2:* "Two of the theories are to be compared on a shared cardinal scale whose zero point and unit the group must set for itself, and their choice of scale alone flips the recommendation."
      *   *Implementation:* The handout gives raw numbers for Deontology and Prioritarianism (e.g., -50 to +50). To aggregate them with Utilitarianism (0-100), they must normalize. If they normalize based on "Worst Possible Outcome" = 0, Prioritarianism wins. If they normalize based on "Status Quo" = 0, Deontology wins. They must explicitly agree on the normalization rule.

      *   *Let's write it.*

  13. **Final Polish:** Check timing. 90 minutes is tight. Need to keep instructions crisp. Ensure the "Deferral" option is clear. Ensure the "Near Duplicate" cards are distinct enough to look different but score the same.

      *(Self-Correction on Deferral)*: The prompt says "spend one round buying additional evidence at a cost." I need to build a specific phase for this.
      *(Self-Correction on Limitations)*: Be very clear that this is a committee simulating a mind, which is the "Parliamentary Model" (Nick Bostrom), not necessarily the only way to handle moral uncertainty.

      *(Final check on Feature 1)*: "Near-duplicates... subtly different formulations." I will create cards for "Classical Utilitarianism," "Preference Utilitarianism," and "Hedonic Utilitarianism." They all rank Option A highest. If they vote as 3 blocks, they win. If the group treats them as 1 theory with combined credence, the math changes.

