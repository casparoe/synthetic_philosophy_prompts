answer: |-
  # Diagnostic Decision Tree: Expected Value Fanaticism

  **Starting Commitment:** For finite, well-understood prospects (e.g., a 50% chance of $10 versus a 100% chance of $4), Expected Value (EV) maximization is the correct decision rule.

  **Instructions:** Follow the path that matches your substantive commitments. Answer each question based on your theoretical intuitions, not on which conclusion you prefer.

  ---

  ### 1. The Structure of Value
  **Question:** Can the value of outcomes accumulate without limit, or is there a maximum possible value (or a lexical level beyond which no amount of lower value matters)?
  *   **There is a limit.** → Go to **Node 2**.
  *   **Value is unbounded and additive.** → Go to **Node 3**.

  ### 2. The Nature of the Limit
  **Question:** Is the limit a hard saturation point (more good adds nothing) or a lexical priority (some goods trump any quantity of others)?
  *   **Hard Saturation.** → **Leaf A: Bounded Utility**
  *   **Lexical Priority.** → **Leaf B: Lexical Threshold**

  ### 3. The Precision of Probability
  **Question:** When considering an astronomical claim (e.g., "I can simulate $3 \uparrow\uparrow\uparrow 3$ lives"), is the probability a sharp, non-zero number, or is it too vague to enter calculations?
  *   **Vague / Effectively Zero.** → **Leaf C: Imprecise Probability Dissolution**
  *   **Sharp / Non-Zero.** → Go to **Node 4**.

  ### 4. Rationality of Discounting
  **Question:** Is it rationally permissible to ignore or discount probabilities below a certain threshold, regardless of the payoff size?
  *   **Yes, discounting is permitted.** → Go to **Node 5**.
  *   **No, discounting is forbidden.** → Go to **Node 6**.

  ### 5. Symmetry of Discounting
  **Question:** Does this permission to discount apply symmetrically to potential harms and potential benefits?
  *   **Yes, symmetric.** → **Leaf D: Threshold / Probability-Discounting View**
  *   **No, asymmetric.** → **Leaf E: Asymmetric Fanaticism**

  ### 6. Risk Weighting
  **Question:** Must probabilities weight value linearly, or may the weight be transformed (e.g., squaring the probability)?
  *   **Transformed (Concave).** → **Leaf F: Risk-Averse Expected Value**
  *   **Transformed (Convex).** → **Leaf G: Risk-Seeking Expected Value**
  *   **Linear.** → Go to **Node 7**.

  ### 7. Optimization Target
  **Question:** Must you maximize the expected outcome, or is it sufficient to meet a "good enough" threshold or avoid the worst case?
  *   **"Good Enough" (Satisfice).** → **Leaf H: Satisficing**
  *   **Avoid Worst Case (Maximin).** → **Leaf I: Maximin**
  *   **Maximize.** → Go to **Node 8**.

  ### 8. Domain of Application
  **Question:** Does EV maximization apply to all value spaces, or only to finite, empirical domains?
  *   **Only Finite Domains.** → **Leaf J: Domain Restriction**
  *   **All Domains.** → Go to **Node 9**.

  ### 9. Source of Uncertainty
  **Question:** Is the core uncertainty primarily about empirical facts (will the intervention work?) or moral theories (which ethics is true?)?
  *   **Moral Theories.** → **Leaf K: Moral Uncertainty Hedging**
  *   **Empirical Facts.** → Go to **Node 10**.

  ### 10. Temporal Scope
  **Question:** Is the decision rule applied to individual acts in isolation or to general policies over a lifetime?
  *   **General Policies.** → **Leaf L: Diachronic / Policy View**
  *   **Individual Acts.** → Go to **Node 11**.

  ### 11. Evaluation Metric
  **Question:** Is the relevant comparison the *ex ante* expected value at the time of choice or the *ex post* realized value after the fact?
  *   **Ex Post Realized Value.** → **Leaf M: Ex Post Realized Value View**
  *   **Ex Ante Expected Value.** → Go to **Node 12**.

  ### 12. Meta-Ethical Status
  **Question:** If EV maximization demands an absurd act (e.g., paying the Pascal's Mugger), does this prove the theory is false?
  *   **Yes, the theory is false.** → **Leaf N: Reductio of EV**
  *   **No, the theory is true.** → **Leaf O: Strict EV Fanaticism**

  ---

  ## Leaf Descriptions & Awkward Commitments

  **Leaf A: Bounded Utility**
  *   **Position:** Value saturates; there is a maximum possible utility.
  *   **Awkward Commitment:** Must deny that saving an astronomical number of lives is strictly better than saving a merely large number, implying a "fullness" of value.

  **Leaf B: Lexical Threshold**
  *   **Position:** Certain goods (e.g., rights, dignity) lexically outweigh any quantity of lesser goods.
  *   **Awkward Commitment:** Must accept that one lexical good outweighs *any* number of lesser goods, even if the lesser goods involve extreme suffering.

  **Leaf C: Imprecise Probability Dissolution**
  *   **Position:** Probabilities for astronomical claims are undefined or interval-valued, blocking calculation.
  *   **Awkward Commitment:** Must treat well-argued longshot claims as epistemically identical to nonsense, potentially ignoring genuine tail risks.

  **Leaf D: Threshold / Probability-Discounting View**
  *   **Position:** Probabilities below a rational threshold (e.g., $10^{-50}$) count as zero.
  *   **Awkward Commitment:** Must accept a discontinuity where a tiny increase in probability jumps the option from forbidden to required (the "cliff edge" problem).

  **Leaf E: Asymmetric Fanaticism**
  *   **Position:** Fanaticism applies to benefits but not harms (or vice versa).
  *   **Awkward Commitment:** Must explain why the mathematics of expectation applies to saving the world but not to risking it, without ad hoc reasoning.

  **Leaf F: Risk-Averse Expected Value**
  *   **Position:** Probabilities are weighted non-linearly (concave), down-weighting extreme uncertainty.
  *   **Awkward Commitment:** Violates the Independence Axiom of standard decision theory, requiring a revision of foundational rationality constraints.

  **Leaf G: Risk-Seeking Expected Value**
  *   **Position:** Probabilities are weighted non-linearly (convex), up-weighting extreme uncertainty.
  *   **Awkward Commitment:** **[UNOCCUPIED]** Implies one *should* prefer the Pascal's Mugging over a sure thing even more eagerly than standard EV suggests; rarely defended as normative.

  **Leaf H: Satisficing**
  *   **Position:** Agents need only choose an option that is "good enough," not the best.
  *   **Awkward Commitment:** Must define the "good enough" threshold without making it arbitrary or allowing clearly inferior choices when better ones are costless.

  **Leaf I: Maximin**
  *   **Position:** Choose the option with the best worst-case outcome.
  *   **Awkward Commitment:** Ignores probability entirely, potentially requiring massive sacrifices to avoid infinitesimal risks of catastrophe.

  **Leaf J: Domain Restriction**
  *   **Position:** EV maximization is valid for finite values but suspends for infinite or lexical values.
  *   **Awkward Commitment:** Requires a principled boundary for when the rule turns off, risking arbitrariness in "borderline" astronomical cases.

  **Leaf K: Moral Uncertainty Hedging**
  *   **Position:** Fanaticism arises from maximizing over moral theories, not empirical outcomes.
  *   **Awkward Commitment:** Must treat moral theories as probabilistic hypotheses, which many meta-ethical views reject as category errors.

  **Leaf L: Diachronic / Policy View**
  *   **Position:** Evaluate rules for lifetime behavior, not isolated acts (avoids "death by a thousand cuts").
  *   **Awkward Commitment:** May require following a rule known to be suboptimal in a specific, transparent case (rule-worship).

  **Leaf M: Ex Post Realized Value View**
  *   **Position:** Rationality is judged by actual outcomes, not expectations.
  *   **Awkward Commitment:** Makes rationality dependent on luck; a well-reasoned decision that fails is deemed irrational.

  **Leaf N: Reductio of EV**
  *   **Position:** The absurdity of fanaticism proves Expected Value maximization is the wrong framework.
  *   **Awkward Commitment:** Must abandon the starting commitment (EV for finite cases) or provide a new decision rule that recovers standard results without fanaticism.

  **Leaf O: Strict EV Fanaticism**
  *   **Position:** Accept the mathematical conclusion; pay the mugger if the expected value is highest.
  *   **Awkward Commitment:** Must accept that resources should be diverted from certain, moderate good to tiny-chance, astronomical good, potentially neglecting present suffering.

  ---

  ## Notes on Indistinguishability

  **Leaf L (Diachronic) vs. Leaf O (Strict Fanaticism):**
  These leaves cannot be fully separated by this tree if the "Policy" is simply "Maximize EV at every step." If the Diachronic view collapses into act-by-act maximization over time, it is extensionally equivalent to Strict Fanaticism. To separate them, one must ask: *Does the agent commit to a rule that forbids EV-maximizing acts in specific instances to preserve long-term stability?* If no, the positions merge.

  **Leaf N (Reductio) vs. Leaf J (Domain Restriction):**
  Both reject fanaticism by limiting EV. They diverge only on whether EV is *false* (Reductio) or merely *inapplicable* in certain domains (Restriction). If the restriction is motivated solely by the absurdity of the results, the views are functionally identical, differing only in meta-ethical labeling.

  **Leaf G (Risk-Seeking):**
  Marked as **UNOCCUPIED**. While descriptive psychology (Prospect Theory) suggests humans seek risk over losses, no major normative theory advocates convex probability weighting for gains in this context, as it exacerbates the fanaticism problem rather than solving it.
