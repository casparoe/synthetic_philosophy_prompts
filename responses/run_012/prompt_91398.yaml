answer: |-
  **Final Exam — Seminar on Epistemic Injustice**
  **Time:** 75 Minutes
  **Format:** Closed Book, Essay
  **Instructions:** Answer the following question based on the case below. You do not need to cite sources, except for Fricker (no dates needed). Do not simply define terms; I know you know the definitions. I want to see how you use them.

  ***

  **The Case**
  For about fifteen years, people with a certain chronic illness had no word for what was happening to them. Their fatigue and sensory crashes didn't show up on any test, so they got shuffled between neurology and psychiatry and mostly landed on an anxiety diagnosis. Then a clinician who had the condition herself but hadn't disclosed it published a paper naming it and offering a mechanism. She called it a disorder of "attention and arousal amplification": the symptoms are real, but they're produced by the patient's own hypervigilance. Meanwhile patients had been calling it "the drag" among themselves and describing it as an exertion-triggered collapse that fluctuates day to day. The clinical term won. Insurers use it, most patients now use it too, and the patients' own description gets filed as the lay version of the expert one. So they finally have a name — but the name comes with a story about their attention being the problem, and that story is what decides who gets disability payments.

  **The Question**
  Write an essay that makes the following three moves:
  1.  **Hermeneutical Injustice:** Does this count as hermeneutical injustice on Fricker's own definition? Explain where that definition strains here—specifically, argue whether a wrong can live in the *content* of the concept that fills a gap rather than in the gap itself.
  2.  **Testimonial vs. Hermeneutical:** Keep these distinct, but explain what this case shows about how the two feed each other.
  3.  **The Student Proposal:** Evaluate a fix one of your classmates proposed last term: that we should call something hermeneutical injustice whenever a group's own concepts get overridden, "no matter who is prejudiced against whom." Is that too broad? If yes, what's the narrowest amendment that still catches this case?

  ***

  ### Model Answer (A-Grade)

  Here's the thing: if we stick rigidly to Fricker's original definition, this case slips through the cracks, and that tells us something important about where the theory needs to grow. Fricker defines hermeneutical injustice as a structural prejudice that creates a *gap* in shared interpretive resources. In this case, there was a gap ("the drag" was private, not public), but now there isn't. The clinical term filled the void. So, strictly speaking, the gap is closed. However, the injustice hasn't vanished; it has mutated. This suggests that hermeneutical injustice can live in the *content* of the concept, not just its absence. The patients now have a way to make sense of their experience, but the sense made is distorted: it frames their suffering as a failure of attention rather than a physiological collapse. Because this distorted concept determines disability payments, the hermeneutical resource itself is weaponized against the group. So, yes, it is hermeneutical injustice, but only if we expand Fricker's definition to include *hermeneutical domination*—where the resource exists but is shaped by power structures to disadvantage the subject.

  We have to be careful not to collapse this into testimonial injustice, though they are tangled here. Testimonial injustice is about credibility deficits in the moment of speaking; hermeneutical injustice is about the structural tools available to understand the experience. In this case, the clinician likely received testimonial credit because of her expert status, while patients suffered a credibility deficit when describing "the drag." But the deeper issue is hermeneutical: the patients' understanding was overridden by a concept that made their experience intelligible only on terms that hurt them. They feed each other because the bad hermeneutical resource (arousal amplification) creates a new testimonial penalty. If a patient insists their problem is exertion-based ("the drag") rather than attention-based, they sound unscientific against the clinical consensus. The hermeneutical distortion lowers their testimonial credibility, which then reinforces the clinical concept's dominance. It's a loop: the lack of power to define the experience leads to a loss of credibility when resisting that definition.

  This brings us to the student proposal: that any override of a group's concepts counts as hermeneutical injustice, regardless of prejudice. That is definitely too broad. Science often overrides lay concepts for good reason—germ theory overrides miasma theory, and that's progress, not injustice. If we remove the prejudice condition, we lose the ability to distinguish between epistemic improvement and epistemic oppression. The proposal fails because it ignores *why* the override happened.

  To fix this while still catching the chronic illness case, we need the narrowest amendment possible. We shouldn't just say "prejudice," because the clinician here had the condition herself, so identity prejudice isn't straightforward. Instead, the amendment should focus on *structural disadvantage in the production of knowledge*. It is hermeneutical injustice when a group's concepts are overridden by resources produced in a context where that group lacks equal power to participate in meaning-making, and the resulting concept harms their social interests (like disability payments). This keeps the structural requirement—it's not just any override, it's an override driven by unequal hermeneutical power—but it allows us to catch cases where the oppressor isn't a hostile outsider, but a system that privileges clinical narratives over lived experience, even when the clinician is an insider. The injustice isn't just that they were overruled; it's that the rules of the game ensured their understanding would never carry the same weight as the expert's, regardless of accuracy.

  ***

  ### Marking Scheme (25 Marks Total)

  **1. Identification of the "Gap vs. Content" Problem (5 marks)**
  *   **Must Hit:** Student argues that Fricker's "gap" definition is insufficient because the injustice here lies in the *distorted content* of the new concept, not the absence of one.
  *   **Common Miss:** Students simply state "Yes, it's HI because there was a gap initially," ignoring the complication that the gap is now filled.

  **2. Analysis of the Harmful Content (5 marks)**
  *   **Must Hit:** Student explains *why* the content is unjust (e.g., frames symptoms as patient fault/hypervigilance, affects disability payments/material harm).
  *   **Common Miss:** Students say the content is bad because "it's medicalized," without explaining how the specific mechanism (attention vs. exertion) disadvantages the patient.

  **3. Distinction Between TI and HI (5 marks)**
  *   **Must Hit:** Student clearly distinguishes TI (credibility/interaction) from HI (structural/resources) without conflating them.
  *   **Common Miss:** Students treat them as synonyms or argue that because the clinician was believed, it's only TI, missing the structural hermeneutical shift.

  **4. The Feedback Loop (5 marks)**
  *   **Must Hit:** Student explains how the HI resource lowers testimonial credibility for those resisting it (the "loop").
  *   **Common Miss:** Students list them as separate issues without showing how the hermeneutical situation *causes* the testimonial deficit.

  **5. Critique and Amendment of Student Proposal (5 marks)**
  *   **Must Hit:** Student identifies the proposal as too broad (ignores epistemic progress) and amends it to require *structural inequality in meaning-making* or *harmful social outcomes*, not just "override."
  *   **Common Miss:** Students agree with the proposal entirely, or reject it without offering a specific amendment that still captures the case.
