  **TO:** Board of Directors
  **FROM:** [Your Name]
  **RE:** Recommendation on Industry Pledge Vote
  **DATE:** [Current Date]

  **Recommendation**
  I recommend the board **sign the pledge** immediately, with public announcement scheduled within fourteen days of the vote.

  **The Stakes**
  We know the cost. Two members have already lost work for these views; I risk an eleven-year series. This is not symbolic. It is income. The Treasurer argues that because our signature does not *cause* other translators to sign, voting to lose money is fiduciary irresponsibility. He is right that correlation is not causation. If we sign merely to feel solidarity, while knowing our action does not mechanically move the needle toward the required forty percent uptake, we are indulging in wishful thinking. A board that votes to burn resources based on superstition fails its members.

  **The Counter-Argument**
  However, our colleague argues that our signature is *evidence* of a shifting profession. If people like us sign, it suggests others will too. While philosophically coherent, this relies on a statistical magic we cannot verify: our small board is too tiny to shift the Bayesian probability for tens of thousands of strangers.

  **The Path Forward**
  We should sign, but not for either of those reasons alone. We should sign because advocacy requires *visible risk* to function causally. The Treasurer is correct that a private vote changes nothing. But a public board endorsement is not private evidence; it is a leadership signal. Publishers and translators watch this board. If we refuse, we causally signal that the profession's leadership accepts machine cleanup. If we sign, we causally alter the risk calculation for others who are waiting for cover.

  We are not signing because our vote predicts the future (the colleague's hope), nor are we signing blindly (the Treasurer's fear). We are signing to *make* the Treasurer's causation real. We absorb the loss to create the threshold others need to cross.

  **Confidence and Uncertainty**
  I am **80% confident** that this course is the only one consistent with our mission to protect translators' long-term viability. Protecting current income at the cost of normalizing our obsolescence is a false economy.

  The single point I am **least sure of** is the steering group's arithmetic. They estimate fifteen percent current uptake and forty percent needed to stop the clauses. If the threshold is actually higher, or the current uptake lower, our sacrifice may not trigger the cascade we intend. We are betting on their math.

  **Next Steps**
  If approved, we draft a press release emphasizing that this is a baseline for human translation, not a boycott. We vote in ten days; announcement follows within two weeks to allow members to align.

  We cannot guarantee the outcome. But we cannot lead from the rear.

  [Your Name]
