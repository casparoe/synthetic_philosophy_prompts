  You're a philosopher of language who works on conditionals — think carefully before you answer, and maybe brainstorm two or three candidate diagnoses before you commit to one.

  My flatmate is doing a master's on conditionals and he cornered me last night with an argument I can't get out of. It's built around a reservoir near our hometown that flooded last spring. He keeps coming back to this pair:

  (A) "If the reservoir didn't overflow, then the spillway valve opened."
  (B) "If the reservoir hadn't overflowed, then the spillway valve would have opened."

  (A) is true: the valley flooded, the only two ways water leaves the reservoir are the overflow and the valve, and we've since confirmed the valve did open. (B) is false: the valve is downstream-triggered — only the overflow itself trips it — so in the nearest world where the reservoir didn't overflow, the valve stays shut and the valley stays dry. Same antecedent, same consequent, opposite truth values.

  His argument:

  (1) A conditional "If A then B" is true just when B holds at every A-world relevantly similar to the actual world — that's just what "would" means.
  (2) Indicative and counterfactual conditionals share their antecedent and their consequent; the only difference between them is tense/mood, which describes no difference in the world.
  (3) So "If A then B" and "If A had been, then B would have been" express the same proposition whenever A and B are held fixed.
  (4) So (A) and (B) can't come apart in truth value.
  (5) But they plainly do.
  (6) So premise (1) — the nearest-worlds story — is wrong, and we have no decent semantics for counterfactuals at all.

  The conclusion is way too strong; I really doubt nearest-worlds semantics is just dead. But I can't find the bad step. Tell me which step to reject and what rejecting it costs. I don't want to give up either (1) or the judgement that (A) and (B) seperate, so if I have to sacrifice one, price it out for me.

  Give it to me as exactly five numbered items, a sentence or two each, no intro and no conclusion. And be honest about the weak point: tell me which step I'm most likely wrong to defend, and what argument or evidence would actually flip your verdict.
