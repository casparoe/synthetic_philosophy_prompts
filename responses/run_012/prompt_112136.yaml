answer: |-
  # Teaching Plan: The Ontology of Social Kinds
  **Session Length:** 90 Minutes
  **Audience:** Graduate Students (Law, Medicine, History)
  **Goal:** Distinguish the metaphysical, causal, and normative dimensions of "social construction" without collapsing them.

  ## I. The Carrying Example: Post-Traumatic Stress Disorder (PTSD)
  **Why this example:** It bridges your three disciplines. Law (disability claims/liability), Medicine (symptomatology/treatment), History (Shell Shock vs. PTSD).
  **What it must have:**
  1.  **Causal Footprint:** It alters neurochemistry, behavior, and life expectancy (satisfies Med/Law demand for material reality).
  2.  **Live Moral Stakes:** Access to care, veteran benefits, stigma, culpability (satisfies Law/Normative demand).
  3.  **What it must lack:** It must lack *biological essentialism*. Unlike a virus, it cannot be identified without reference to a social narrative about what counts as "trauma" and "normal reaction."

  **Why Money is the Wrong Anchor:**
  Money is the philosopher's favorite example of construction, but it fails for this group. A $20 bill does not have a nervous system. It does not change its physical structure because it *believes* it is money. Race and gender classify *human beings* who react to the classification. Money lacks **phenomenological feedback**. Using money suggests construction is about *tokens*; you need an example where construction is about *subjects*.

  ---

  ## II. Sequence and Dependencies (90 Minutes)

  ### 0:00 – 0:15 | Phase 1: Deflating the "Fake" Intuition
  **Goal:** Head off the misconception that "constructed = illusory."
  **Activity:** Direct instruction + Quick poll.
  **Content:**
  *   Define "Social Construction" negatively: It is not "fabrication."
  *   Positive definition: A thing is socially constructed if it depends on human agreement/practice to exist *as that kind of thing*.
  *   **Misconception to Head Off:** *"Constructed means not real."*
      *   **Intervention:** Use the **Border** analogy. A border is constructed (lines on a map), but a bullet stopping at the border is real. The *line* is agreed upon; the *consequence* is physical.
      *   **Dependency:** This must happen first. If they think construction implies falsity, they will reject the ontology of race/gender immediately as denying biological reality.

  ### 0:15 – 0:35 | Phase 2: Constitution vs. Causation
  **Goal:** Distinguish between a kind being *caused* by society vs. *constituted* by it.
  **Activity:** Comparative analysis using the **PTSD** example.
  **Content:**
  *   **Causal Production:** Social arrangements cause biological states (e.g., poverty causes malnutrition). The malnutrition is biological, the cause is social.
  *   **Constitution:** Social arrangements *make* the category exist (e.g., "Refugee" status). Without the legal framework, there is only a person moving across land.
  *   **Application to PTSD:**
      *   *Causal:* The explosion damages the brain (biological cause).
      *   *Constituted:* The classification "PTSD" requires the DSM (social agreement). Without the manual, it is just "suffering."
  *   **Misconception to Head Off:** *"Constructed means arbitrary or easily changed."*
      *   **Intervention:** Emphasize **Inertia**. Once constituted, the category creates institutions (clinics, courts) that resist change. The *origin* is social, the *resistance* is structural.
      *   **Dependency:** This must land *before* Looping. Students need to know *what* is looping (a constituted category) vs. what is just a biological effect.

  ### 0:35 – 0:55 | Phase 3: The Looping Effect (Hacking)
  **Goal:** Explain how classification reshapes the classified.
  **Activity:** Case study discussion (Shell Shock → PTSD).
  **Content:**
  *   **The Mechanism:** When you classify people, they become aware of the classification. They adjust their self-understanding and behavior to fit (or resist) the kind.
  *   **Med/Historical Link:** Soldiers in WWI didn't "have PTSD" in the modern sense; they had "hysteria" or "cowardice." The available categories shaped how they experienced their own trauma.
  *   **Misconception to Head Off:** *"If race is constructed then racism isn't real."*
      *   **Intervention:** The Loop *is* the mechanism of racism. Because the category is real in its consequences (looping back to affect health, employment, policing), the harm is objective even if the ontology is social.
      *   **Dependency:** This relies on Phase 2. If they think the category is "fake," the loop doesn't matter. If they think it's "biological," the loop is irrelevant. It must be *constituted* to loop.

  ### 0:55 – 1:15 | Phase 4: Prising Apart the Three Claims
  **Goal:** Separate Genealogy, Ontology, and Normativity.
  **Activity:** Whiteboard mapping.
  **Content:**
  Draw three columns. Show that one can accept the first two without the third.
  1.  **Genealogy (History):** The concept has a specific historical origin (e.g., 17th-century racial taxonomy). *Consensus: True.*
  2.  **Ontology (Law/Metaphysics):** The thing exists only through social practices (e.g., racial categories require legal enforcement to function). *Consensus: True.*
  3.  **Normativity (Policy):** The category should be abolished (e.g., colorblindness). *Contested.*
  *   **Crucial Move:** Show that Law and Medicine often rely on (2) to treat the harms of (1), without committing to (3). You can treat "Race" as real for the purpose of curing "Racism" without believing Race is biological.
  *   **Misconception to Head Off (The Missing One):** *"Constructed means Intentional/Conspiracy."*
      *   **Intervention:** Clarify that construction is often emergent and unplanned. No single person invented race; it evolved through practice.
  *   **Misconception to Head Off (The Missing Two):** *"If it's constructed, we can just stop doing it tomorrow."*
      *   **Intervention:** Revisit Phase 2 (Inertia). The causal footprint (health disparities, wealth gaps) persists even if the concept is abolished overnight.

  ### 1:15 – 1:25 | Phase 5: Why Money Fails (Revisited)
  **Goal:** Solidify the distinction between Human Kinds and Material Kinds.
  **Content:**
  *   Return to the Money example.
  *   Ask: "If I believe this $20 bill is worthless, does it change?" No.
  *   Ask: "If I believe I am not a 'woman' or 'black', does the world treat me differently?" Yes.
  *   **Point:** Race and Gender are **Interactive Kinds**. Money is an **Indifferent Kind**. This is why the stakes are higher and the metaphysics are harder for human categories.

  ### 1:25 – 1:30 | Phase 6: Closing Question & Refusals
  **Goal:** Test understanding and set boundaries.

  **The Single Closing Question:**
  > "If we abolished the *word* and the *legal category* of [Race/Gender] tomorrow, which harms would vanish immediately, and which would persist for generations due to causal inertia?"

  *   *Why this works:* It forces them to distinguish between Ontology (the word/category) and Causal Footprint (the accumulated material disadvantage). If they say "all harms vanish," they failed Phase 2. If they say "no harms vanish," they failed Phase 3 (Looping).

  **What to Openly Refuse to Discuss:**
  1.  **"Is there a genetic basis for race?"**
      *   *Reason:* This is a population genetics question, not a metaphysical one. It distracts from the construction claim. You can grant genetic variation exists without granting "race" is the correct taxonomy for it.
  2.  **"What is the 'true' definition of a woman/man?"**
      *   *Reason:* This seeks an essentialist definition. The session is about how definitions *function*, not what they *are* essentially.
  3.  **Specific Policy Prescriptions (e.g., "Should we abolish prisons?").**
      *   *Reason:* Keep the session on the *structure of the argument*, not the *political conclusion*. You are teaching the tool, not the build.

  ---

  ## III. Summary of Misconceptions & Interventions

  | Misconception | Where it Arises | Intervention Point |
  | :--- | :--- | :--- |
  | **"Constructed = Fake/Illusory"** | Immediately upon hearing the term. | **Phase 1 (0:00).** Use the Border/Bullet analogy. |
  | **"Constructed = Arbitrary/Easy to Change"** | During discussion of origins. | **Phase 2 (0:25).** Emphasize Structural Inertia. |
  | **"If Race is Constructed, Racism isn't Real"** | During application to social justice. | **Phase 3 (0:45).** The Loop *is* the reality of the harm. |
  | **"Constructed = Conspiracy/Intentional"** | During historical genealogy. | **Phase 4 (1:05).** Distinguish emergent practice from design. |
  | **"We can just wish it away"** | During normative discussion. | **Phase 4 (1:10).** Distinguish Ontology from Causal Footprint. |

  ## IV. Dependencies Checklist
  *   Do not discuss **Looping** (Phase 3) until **Constitution** (Phase 2) is clear. (You can't loop a fiction).
  *   Do not discuss **Normativity/Abolition** (Phase 4) until **Causal Footprint** (Phase 3) is established. (Otherwise abolition sounds like magic).
  *   Do not discuss **Money** (Phase 5) until **Human Kinds** are fully analyzed. (Money is the contrast case, not the model).
