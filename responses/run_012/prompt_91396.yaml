  But here is the kicker: If I ask him about yesterday, he says, "It was burst, but I didn't believe it," and that sounds perfectly normal. Why is now different from yesterday? Why is me different from him? He says he's practicing "radical honesty" about his denial. I think he's just speaking badly. He says the contradiction is poison and needs scrubbing. I say the sentence is just broken. Who is right?

  **Signed,**
  **Listening in Ohio**

  ***

  **Dear Listening,**

  You are both experiencing what I call Voice Friction. Mark is touching a real nerve, but he's using the wrong tool to scratch it. You hear a logic error; he feels an emotional lag. Neither of you is wrong, but you are speaking different languages.

  Here is the ClearVoice truth: A sentence isn't just a container for facts. It's a handshake. When Mark says, "The pipe is burst," he is offering you a fact to hold. He is extending his hand. When he adds, "but I don't believe it," he is pulling his hand back before you can grab it. The handshake fails. The facts might be accurate—the water might indeed be real—but the connection is broken. That is why it sounds wrong to you. You are sensing the retraction, not the lie.

  This is why the past tense works for him. "It was burst, but I didn't believe it." That is a story about a past handshake. The hand is no longer extended. There is no friction because the moment has passed. Similarly, when he talks about "he" or "she," he is describing a handshake between other people. You are just watching. But when he uses "I" and "now," he is the handshaker. He cannot offer and retract simultaneously without dropping the ball.

  The "we" example is trickier. "We don't believe it." Here, Mark is diluting ownership. He is trying to spread the retraction across the group so it doesn't stick to him alone. This is a defense mechanism, not a truth claim. It feels odd because you know he is the one speaking. You cannot outsource your own voice. When he tries to hide inside a plural, the friction increases because the group cannot speak unless the individual does first.

  Mark is right that this isn't a logical contradiction. The world can be exactly as he describes. But communication isn't about the world; it's about the bridge between worlds. His sentence burns the bridge while trying to build it. This is what the corporate world misses. They tell you to scrub contradictions because they look bad on a slide. But you cannot scrub a feeling by changing a word. You have to align the word with the feeling.

