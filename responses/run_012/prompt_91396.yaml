  **ASK JAXON: THE CLEARVOICE COLUMN**

  **Dear Jaxon,**

  My husband, Mark, has started saying things that drive me up the wall. He'll look at the sink, which is clearly flooding, and say, "The pipe is burst, but I don't believe it is." He insists he isn't contradicting himself. He says the water is definitely real, but his brain hasn't signed the paperwork yet. To me, it sounds like nonsense. If you know it's burst, you believe it. If you don't believe it, you don't know it. He says I'm confusing logic with "inner state."

