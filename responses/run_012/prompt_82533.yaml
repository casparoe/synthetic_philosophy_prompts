answer: |-
  Here is a specification sheet for the analytic-synthetic distinction, structured for a graduate seminar context. It separates the phenomenological data from the metaphysical commitments and highlights the tension points.

  ### I. The Desiderata List
  *Each item includes the case/consideration motivating the requirement.*

  1.  **The Triviality Constraint:** Must explain why 'No bachelor is married' is verified by understanding alone.
      *   *Case:* Denial sounds like linguistic incompetence, not factual error.
  2.  **The Natural Kind Gradient:** Must distinguish 'Cats are animals' from 'Cats are mammals'.
      *   *Case:* The former feels conceptual; the latter (per your specification) is treated as an empirical discovery about essence, despite being necessary.
  3.  **The Historical Revision Constraint:** Must accommodate that 'Whales are fish' was once "true by definition" and is now false.
      *   *Case:* Conceptual change over time without loss of rationality.
  4.  **The Stipulative/Reportive Distinction:** Must differentiate legal bylaws from lexical meanings.
      *   *Case:* A bylaw defining 'vehicle' to exclude bicycles is binding but contingent; 'bachelor' is binding but necessary.
  5.  **The Institutional Fact Constraint:** Must handle truths derived from roles rather than nature.
      *   *Case:* 'The Pope is an unmarried man' is true in virtue of the office, not biology or pure logic.
  6.  **The Holism Survival Clause:** Must survive the claim that any statement can be held true come what may.
      *   *Consideration:* Quine's *Two Dogmas*; no statement is immune to revision.
  7.  **The Revision of Logic Constraint:** Must explain how fundamental principles can be overturned.
      *   *Case:* Rejection of distributivity in quantum logic or absolute simultaneity in relativity.
  8.  **The Translation Indeterminacy Constraint:** Must remain coherent if synonymy is indeterminate.
      *   *Consideration:* Quine's *Word and Object*; if meaning is behaviorally indeterminate, analyticity (based on meaning) collapses.
  9.  **The Psychological Reality Constraint:** Must align with cognitive science findings.
      *   *Case:* Speakers process "analytic" truths with prototype slack and reaction times similar to empirical truths.
  10. **The Paradox of Analysis:** Must allow an analysis to be correct (synonymous) yet informative (non-identical cognitive value).
      *   *Consideration:* If 'A = B' is analytic, it should be trivial; if it is informative, it should be synthetic.

  ### II. Status of Requirements

  **Non-Negotiable (Internal Coherence & Data):**
  *   **Logical Consistency:** The account cannot define analyticity in a way that renders logic itself synthetic (unless it accepts logical revisionism).
  *   **The Paradox of Analysis:** Any account that makes analysis impossible (by collapsing synonymy into identity) fails the basic utility of philosophy.
  *   **Accommodation of Revision:** An account that declares all conceptual revision irrational (i.e., insists 'Whales are fish' was *never* analytic) fails to describe actual scientific practice.

  **House Style (Camp-Specific Prejudices):**
  *   **The Empiricist Criterion:** The demand that analyticity be identifiable via behavioral/verificationist criteria. (Rationalists reject this).
  *   **The Epistemic Entitlement:** The demand that analyticity guarantees *a priori* warrant. (Fallibilists/Quineans reject this).
  *   **The Binary Switch:** The demand that the distinction be sharp rather than a matter of degree or centrality. (Pragmatists reject this).

  ### III. Verdict on Your Two Jobs

  *   **Job (a) Changing the Subject vs. Mistake:** **Doable.** This is the strongest remaining intuition for analyticity. It can be secured by a "conceptual role" or "stipulative" account: denying the truth alters the rules of the language game being played.
  *   **Job (b) Proof Warrant vs. Testing Warrant:** **Likely Impossible.** This requires epistemic privilege. If Quine is right that confirmation is holistic, proof only offers warrant relative to a background theory that is itself revisable. Analyticity cannot insulate a statement from empirical defeat if the logic governing the proof is itself revisable (see Quantum Logic case).

  ### IV. Joint Unsatisfiability & The Exclusionary Requirement

  **The Impossible Triangle:** You cannot jointly satisfy **(1) Normative Force** (analytic truths *must* be accepted), **(2) Naturalistic Criterion** (meaning is determined by observable use), and **(3) Stability** (meanings don't shift under empirical pressure).
  *   Quine's argument is precisely that (2) and (3) entail the loss of (1).
  *   Kripke/Putnam arguments suggest (1) and (3) entail the loss of (2) (meaning ain't in the head/use).

  **The Single Most Exclusionary Requirement:**
  **The Demand for a Behavioral Criterion.**
  This requirement excludes Rationalist, Modal, and Epistemic accounts immediately. It forces the definition of meaning into a verificationist box that cannot support the normative "oomph" of logical necessity.

  **Is the Demand for a Criterion a Prejudice?**
  **Yes.** It is an Empiricist prejudice. It assumes that if a distinction exists, there must be a decision procedure to identify it. Demanding that analyticity deliver an *entitlement* is a Rationalist prejudice. Dropping both allows for a descriptive account of meaning-constituency without epistemic guarantees.

  ### V. Theory Snapshots

  **Carnapian Postulates:** Saves the distinction by treating analyticity as a framework-relative stipulation, but concedes the choice of framework is pragmatic, not truth-apt.
  **Grice-Strawson Defence:** Argues Quine conflates revisability with meaningfulness, preserving the distinction as a matter of degree rather than kind, but lacks a sharp criterion.
  **Deflationary Inferentialism:** Treats analyticity as explicit commitment to inference rules, solving the paradox of analysis by making meaning use, but struggles to ground normative force without circularity.
