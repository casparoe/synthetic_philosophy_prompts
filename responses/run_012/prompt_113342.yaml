answer: |-
  The waiting room smelled of floor wax and stale coffee. Elias Vane sat with his hands folded on his knees, staring at the Form 88-C resting on his lap. The paper was heavy, expensive stock, designed to feel like a barrier.

  "Don't check the box for 'Cultural Heritage,'" Claire said, not looking up from her tablet. She was tapping a stylus against the screen, a rhythmic, impatient click. "Check 'Individual Religious Conscience.' Even if it feels wrong."

  "It is wrong," Elias said. "The Gathering isn't about me. It's about us. If I go alone, the lights don't mean anything. The voices need to overlap. That's the point."

  "The point is to get the lease on Room 4B in the Civic Center," Claire said. "The Republic doesn't lease public space for 'us.' It leases for citizens. Singular. The law protects belief, Elias. It doesn't protect belonging. Belonging is a custom. Belief is a conscience. Customs get taxed; consciences get accommodated."

  Elias looked at his daughter, Mara, who was tracing the pattern on the linoleum with her shoe. She was sixteen. This was her first Gathering. If they didn't get the room, the tradition breaks. Not today, maybe, but eventually.

  "So I have to lie," Elias said.

  "You have to translate," Claire corrected. "There's a difference. They need to hear that *you* require this space to satisfy *your* internal moral compass. They can't hear that your uncle expects you to be there. That sounds like coercion. The state is very worried about coercion lately."

  The door opened. A man in a grey suit stood there. He looked exhausted, the kind of tired that sleep doesn't fix. "Mr. Vane? Ms. Halloway? Please."

  This was Mr. Henderson. He led them into a small room with a table bolted to the floor. He sat opposite them, placing a recorder between them. He didn't smile, but he didn't frown either. He just looked like a man who had heard every excuse for why a group needed special treatment and knew he couldn't give it to them.

  "Thank you for coming," Henderson said. "You're applying for an exemption to the Public Neutrality Act regarding the use of the Civic Center during the Cohesion Week. You want Room 4B for the... 'Vigil of Names'?"

  "Yes," Elias said.

  "And you understand," Henderson said, looking at the form, "that under the new guidelines, public spaces are reserved for civic functions or individual religious observance. Cultural festivals, ethnic gatherings, and community customs are excluded. We have to ensure the state remains neutral. If we let one group use the hall for their specific traditions, we privilege them over others. It's about equality. Everyone gets the same blank space."

  Claire shifted in her seat. "Mr. Henderson, my client asserts that the Vigil is a matter of sincere religious conscience. It is not merely cultural."

  Henderson nodded slowly. "I'm not questioning sincerity. I'm questioning classification. The Act is designed to emancipate citizens. Sometimes communities... well, they hold people back. They pressure them. The law assumes that if you're doing something because your group does it, you might not be free. But if you're doing it because your soul demands it, that's protected. We're trying to protect the individual from the group, even if the group is nice."

  He said it casually, like he was explaining why the vending machine was out of soda. He wasn't attacking Elias; he was stating the weather.

  Elias felt a tightness in his chest. The logic was clean, sterile, and utterly alien. "It's not pressure," Elias said. "It's... it's like a choir. You can't have a choir with one person. If I say this is my individual conscience, I'm saying I need to sing alone. But the song requires harmony."

  Henderson leaned forward, resting his chin on his hand. "I understand the metaphor. But legally, a choir is an association. A prayer is a conscience. Can you pray alone?"

  "The Vigil is the prayer," Elias said.

  "Can you perform the essential component alone?" Henderson pressed. "If you were the last member of your community, would you still be obligated to perform the ritual?"

  This was the trap. If Elias said yes, he lied. If he said no, he admitted it was communal, and thus a custom, and thus ineligible.

  Claire kicked his shin under the table. Softly. A signal. *Play the game.*

  "Yes," Elias said. The word tasted like ash. "If I were the last... I would still need to honor the names. In my way."

  "And this way requires a specific acoustic environment?" Henderson asked, noting it down.

  "Yes. Room 4B has the right reverberation. The voices need to blend."

  "Right." Henderson stopped writing. He looked at Elias, really looked at him, for the first time. "Mr. Vane, I want to be clear. If I grant this, I am validating your interpretation of the practice as a religious obligation of the individual. There are other applicants. The Community Council, led by Mrs. Gable. They applied for the same room. They described the Vigil as a 'heritage celebration' to promote social cohesion."

  Elias stiffened. "Mrs. Gable wants to turn it into a picnic. She wants to invite the mayor. She wants to serve food that isn't traditional."

  "That sounds like a custom," Henderson said. "Customs are fine, but they don't get exemptions. They pay the market rate, and during Cohesion Week, the market rate is prohibitive. If I give the room to you, based on conscience, I cannot give it to her, based on culture. Do you understand the distinction?"

  "I understand," Elias said. He looked at Mara. She was watching him. She knew what the Vigil was. She knew it was about the whole village standing in a circle. She knew her father was currently telling the state that it was about him standing alone in a room.

  "And this distinction," Claire interjected, her voice smooth, "ensures that Mr. Vane isn't being forced by his community to attend. It proves his agency."

  "Exactly," Henderson said. "Emancipation. We need to know he's choosing this."

  "I am choosing it," Elias said.

  "Okay." Henderson clicked the recorder off. "I'll need an hour to deliberate. Please wait outside."

  In the hallway, Elias leaned against the wall. Claire was typing on her tablet.

  "He's going to give it to us," she said.

  "Because I lied," Elias said.

  "Because you navigated the machinery," Claire said. "Look, Elias, the system isn't designed for people like us. It's designed for Protestants and atheists. Private belief, public neutrality. You don't have private belief. You have woven belief. But to get the room, you have to untangle the weave. Just for the form."

  "And Mrs. Gable?"

  "She filed as a cultural association. She admitted it was about community building. She played by the multicultural rules. But this isn't a multicultural state anymore. It's a neutral one. She loses."

  "That's not fair. She's keeping the tradition alive too."

  "She's keeping a custom alive," Claire said. "You're claiming a right. There's a difference. One is a hobby, the other is a conscience. That's the law."

  "It's a stupid law," Elias said.

  "It's a consistent law," Claire corrected. "Consistency isn't always justice. But it's predictable."

  Mara looked up at him. "Dad? If you win... does that mean the Vigil is about you?"

  Elias looked at his daughter. He thought about the circle they would form in Room 4B. He thought about the way the voices had to overlap to create the hum that was supposed to carry the names upward. If the state said this was his individual right, then next year, if Mara didn't want to come, could he force her? If it was his conscience, she had her own. If it was their community's obligation, she had a duty.

  By winning, he had turned a duty into a choice. He had protected the room for this year by dismantling the wall that held the tradition up.

  "We'll talk about it later," Elias said.

  The door opened. Henderson stood there. He looked even more tired than before.

  "Mr. Vane. Your exemption is granted. Room 4B is yours for the night of the 14th. We are classifying the Vigil as a matter of individual religious observance."

  "Thank you," Elias said. He didn't feel like thanking him.

  "However," Henderson added, holding up a finger. "Please note that this sets a precedent. We will be updating the registry. Future applications for the Vigil will be assessed against your testimony. Since you have established this as an individual conscience-based ritual, applications that frame it as a communal cultural event will be denied. We have to maintain consistency. We can't have the same event classified two ways."

  Elias felt the floor drop out. "So Mrs. Gable... next year?"

  "If she applies as a cultural group, she will be denied. If she applies as a religious individual, she must prove individual conscience. But since you have defined the practice officially as individual conscience, her communal version may be deemed... inauthentic. Or at least, ineligible for public space."

  Henderson didn't say this with malice. He said it like a man explaining that rain makes things wet. "Neutrality requires categorization. Once something is categorized, it stays there. It's for equality. We can't have some people paying for customs while others get free space for conscience."

  "And the community?" Elias asked. "What happens to the rest of us?"

  "That's not a state matter," Henderson said. "We deal with citizens. Not communities."

  He closed the door.

  Elias stood in the hallway. Claire was packing her bag. "We won," she said. "That's what matters. You have the room."

  "Mrs. Gable runs the kitchen," Elias said. "She prepares the bread. She knows the songs. I just... I know the form."

  "You know the law," Claire said. "That's what keeps the bread in the kitchen. Without the room, there's no bread."

  "But if she can't get the room next year because I told them this is about me..."

  "Then next year she'll hire a lawyer," Claire said. "And she'll learn to talk like you. Or she won't. But today, you saved the Vigil."

  Elias looked at Mara. She was looking at her hands. "Dad?"

  "Yes?"

  "Is it about you?"

  Elias thought about the lie. He thought about the truth. He thought about the empty room waiting for them, a public space that now belonged to him alone, legally, so that he could share it with everyone.

  "It's about getting the light lit," Elias said. "However we have to say it."

  "But Mrs. Gable..." Mara started.

  "Mrs. Gable tried to make it fit their world," Elias said. "I tried to make us fit their world. Maybe... maybe that's the only way to stay here."

  Claire touched his arm. "Come on. We need to sign the lease before noon."

  They walked down the corridor. The floor wax smell was stronger here. Elias signed the paper where Claire pointed. *Individual Conscience.* He signed his name.

  Later, outside the building, the air was cold. Elias saw Mrs. Gable across the street. She was coming out of the bus stop, carrying a basket. She saw him. She saw the folder in his hand. She stopped.

  She didn't look angry. She looked confused. She walked over.

  "Elias?" she asked. "Did you get it?"

  "Yes," Elias said.

  "The room?"

  "Yes."

  "And... how did you file it?"

  Elias looked at the folder. He could tell her. He could warn her. But if he warned her, she might try to change her application to match his, and then they would both be lying, and the state might catch them. Or she might fight him, and the state would pick one truth.

  "I filed it as conscience," Elias said.

  Mrs. Gable's face fell. Not because she was jealous. But because she understood. "Conscience. So... not community."

  "That's what they need," Elias said.

  "But it is community," she said. "If we say it's conscience... then the children can choose not to come. If it's community, they must."

  "The law doesn't recognize 'must'," Elias said. "Only 'choose'."

  Mrs. Gable looked at the Civic Center, then back at Elias. "So next year, if I apply... they will say I am wrong. Because you said it is this way."

  "I'm sorry," Elias said. And he meant it. He felt a hollowness in his gut, the cost of the exemption. He had bought the tradition's survival with its soul. He had made it private to save it.

  Mrs. Gable nodded slowly. She adjusted the basket on her arm. "Well. This year, we have the room. We will sing. Next year... next year we will see."

  She turned and walked away. She didn't look back.

  Claire came up beside Elias. "She'll be fine. She'll adapt. Everyone adapts."

  "Will we?" Elias asked.

  "You got the accommodation," Claire said. "You're protected."

  "I'm recognized," Elias said. "There's a difference."

  He looked at the form in his hand. *Individual Religious Conscience.* He folded it and put it in his pocket. It felt heavy, heavier than the paper should be. He thought about the Vigil, the overlapping voices, the circle that had no beginning and no end. Now it had a boundary. It started with him, and ended with the state's permission.

  "Come on," Elias said to Mara. "Let's go home. We have to prepare."

  "For the Vigil?" Mara asked.

  "For the hearing," Elias said. "We have to prepare for the next one. Because now we have to be who they say we are."

  They walked toward the bus stop. The city was grey and orderly around them. No flags, no symbols, just the clean lines of the neutral state. It was fair. It was equal. It was empty.

  Elias held his daughter's hand. He squeezed it, not because he had to, but because he chose to. That was the rule now. He had to remember to choose it, every time, so that it didn't look like belonging.

  "Will you come?" he asked her. "To the Vigil."

  Mara looked at him. She knew the weight of the question. It wasn't about the ritual anymore. It was about the lie they had to tell to keep it.

  "Yes," she said. "I choose to."

  "Good," Elias said.

  They waited for the bus in silence. The machinery of the state hummed quietly beneath the street, sorting them, categorizing them, keeping them safe and separate and free.
