answer: |-
  # Q&A Preparation Sheet: Deliberative Opacity

  **Context:** Departmental Colloquium
  **Audience:** 6 Moral Psychologists, 3 Normative Ethicists (2 Kantians, 1 Consequentialist), 1 Decision Theorist.
  **Goal:** Defend the claim that preference/bias distinction is source-sensitive but source-inaccessible, without collapsing into metaphysics or practical irrelevance.

  ---

  ### 1. The Phenomenological Indistinguishability Objection
  **Likely Asker:** Moral Psychologist (Dual-Process specialist)
  **Probability:** High | **Damage:** High
  **Vocabulary:** "System 2," "Phenomenology," "Operationalization."

  **Objection:** "You say D.'s aversion is phenomenologically identical to a genuine preference. She articulates it, endorses it, and defends it. In our field, if a judgment survives System 2 reflection, we classify it as an explicit attitude, not an implicit bias. If you posit a hidden 'bias' category that looks exactly like a 'preference,' aren't you just relabeling explicit attitudes? What work is the term 'bias' doing if it doesn't predict a difference in cognitive processing or experience?"

  **Reply (2 mins):**
  "I'm not relabeling explicit attitudes; I'm challenging the criterion we use to identify them. Currently, we treat reflective endorsement as the gold standard for a 'preference.' My argument is that endorsement is necessary but not sufficient. D.'s attitude functions like a preference in her mind, but it fails a specific counterfactual test: if she knew the etiology, would she retain it *by her own lights*?
  The work the term 'bias' is doing here is causal, not phenomenological. It marks a disposition that is alien to the agent's rational architecture, even if it has been integrated into it. Think of it like a scar versus a natural feature. They look the same, but one tells a story about injury. If we only care about current function, you're right, the distinction collapses. But if we care about *agency*—whose values are these?—then the causal history matters. I'm arguing that moral psychology needs a category for 'integrated but alien' dispositions."

  **Concede:** I concede that for *predicting behavior*, the distinction might be weak.
  **Hold:** I hold that for *attributing agency*, the distinction is vital.
  **Soft Spot:** Admitting the behavioral prediction weakness gives them an opening to say the distinction is theoretically idle.

  ### 2. The Autonomy Objection
  **Likely Asker:** Kantian Ethicist
  **Probability:** High | **Damage:** High
  **Vocabulary:** "Autonomy," "Self-Legislation," "Rational Agency."

  **Objection:** "On a Kantian view, autonomy is about giving the law to oneself through reflection. If D. reflects on her meat aversion and says, 'Yes, this fits my moral framework,' she has made it her own. Why does the causal history matter? If I adopt a principle originally suggested by a mentor, it's still mine once I endorse it. By insisting the hypnotic origin makes it a 'bias,' you seem to be saying we can never fully own our dispositions because they all have causal histories we didn't choose."

  **Reply (2 mins):**
  "This is the crux of the disagreement. I agree that endorsement is the mechanism of ownership. But ownership requires that the *standards* used to endorse are truly the agent's. The Laundering Problem shows that a bias can shape the standards used to endorse it. D. endorses the aversion *because* the bias shapes her view of what counts as a valid moral reason.
  My claim isn't that all causal histories undermine autonomy. It's that *manipulative* histories that bypass rational uptake do. The hypnotic installation didn't engage her rationality; it bypassed it. Even if she later rationalizes it, the foundation is non-rational. I'm arguing for a 'clean hands' requirement for autonomy: you can't bootstrap a non-autonomous cause into an autonomous one just by later agreeing with it, if that agreement is causally sustained by the original bypass."

  **Concede:** I concede that not all external influences are manipulative (e.g., the mentor).
  **Hold:** I hold that bypassing rational uptake (hypnosis) creates a permanent deficit that endorsement cannot fully cure.
  **Soft Spot:** The line between "mentor influence" and "hypnotic installation" is gradational. If I say hypnosis is unique, they'll ask why.

  ### 3. The Contaminated Standards Objection (Internal Coherence)
  **Likely Asker:** Moral Psychologist or Kantian
  **Probability:** Medium | **Damage:** Critical
  **Vocabulary:** "Circularity," "Standards," "Etiological Counterfactual."

  **Objection:** "Your solution relies on an etiological counterfactual: would she keep the disposition if she knew its history? But you admit the bias shapes her 'considered standards.' So, if she learns the history, won't her biased standards simply tell her the history is irrelevant? If the bias launders the standards, it will also launder the evaluation of the history. Your test seems to yield the same result as the endorsement view you criticize."

  **Reply (2 mins):**
  "This is the strongest challenge, and it's why I emphasize the *counterfactual* nature of the test. We aren't asking what D. *would* say right now. We are asking whether the disposition is robust enough to survive a specific informational shock *independent* of the bias's maintenance mechanisms.
  If the bias is deep enough to shape her standards to accept *any* origin, then the disposition is indeed structurally different from a preference. A genuine preference should be robust to the truth of its origin. If the only way the disposition survives is by distorting the significance of the manipulation, that survival itself is evidence of the bias. The test isn't 'does she keep it?' It's 'does she keep it *without* epistemic distortion?' If she has to minimize the hypnosis to keep the aversion, the aversion is doing the work, not her rationality."

  **Concede:** I concede that measuring "epistemic distortion" is difficult in practice.
  **Hold:** I hold that the *capacity* for distortion is the marker of bias, even if hard to measure.
  **Soft Spot:** This is the theoretical weak point. If the bias controls the standards, how do we access the "undistorted" view to judge the distortion?

  ### 4. The Predictive Utility Objection
  **Likely Asker:** Decision Theorist
  **Probability:** Medium | **Damage:** Medium
  **Vocabulary:** "Revealed Preference," "Predictive Power," "Model Parsimony."

  **Objection:** "In decision theory, we treat preferences as revealed by choices. If D. consistently chooses vegetarianism, pays a premium for it, and argues for it, she reveals a preference. Positing a hidden 'bias' variable that doesn't change the choice function adds complexity without increasing predictive accuracy. Why should I model her as having a bias rather than just a stable preference?"

  **Reply (2 mins):**
  "You're right that for *market behavior*, the distinction is idle. If I'm selling meat, D. is a non-customer regardless of her etiology. But your models often assume preferences are stable under new information. My claim is that 'bias' preferences are fragile in a specific way: they are fragile to *etiological* information, not just *outcome* information.
  If your model needs to account for why D. might suddenly collapse as an agent if she discovers the hypnosis, you need the distinction. I'm offering a variable that predicts stability under *self-knowledge*, not just stability under price changes. It's not about parsimony; it's about modeling the agent's relationship to her own choices, which matters for welfare and policy interventions."

  **Concede:** I concede it adds no value for simple market prediction.
  **Hold:** I hold it adds value for predicting stability under therapeutic or revelatory interventions.
  **Soft Spot:** Decision theorists care little for "agent relationship" unless it cashes out in choices.

  ### 5. The Application Objection
  **Likely Asker:** Moral Psychologist (Implicit Bias researcher)
  **Probability:** High | **Damage:** Medium
  **Vocabulary:** "Intervention," "Debiasing," "Accessibility."

  **Objection:** "You call the distinction 'source-inaccessible.' If the agent can't tell the difference from the inside, and we as researchers often can't pinpoint the exact etiology of a specific moral intuition, how is this useful? If we can't identify biases in real-time, isn't this just a philosophical distinction without a practical method for debiasing?"

  **Reply (2 mins):**
  "It shifts the goal of intervention. Currently, we try to debias by getting agents to reflect more. I'm arguing that reflection is insufficient because of the Laundering Problem. If the distinction is source-inaccessible, the remedy isn't 'think harder,' it's 'investigate the causal history.'
  This supports structural interventions over individual cognitive ones. We shouldn't ask D. to introspect; we should ask her to look at how her views were formed. It changes the methodology from 'correct the reasoning' to 'audit the origin.' It admits that some biases are invisible to the holder and require external tools—like therapy or sociology—to uncover."

  **Concede:** I concede this makes individual self-correction much harder.
  **Hold:** I hold that it justifies external/structural intervention over pure introspection.
  **Soft Spot:** This concedes that the agent is helpless without external aid, which might be politically unpalatable.

  ### 6. The Normative Irrelevance Objection
  **Likely Asker:** Consequentialist Ethicist
  **Probability:** Medium | **Damage:** Low
  **Vocabulary:** "Outcomes," "Justification," "State of Affairs."

  **Objection:** "Let's say D. is right that eating meat is wrong. Does it matter if she's a biased vegetarian or a principled one? The cows are saved either way. You say you aren't making a debunking argument about justification, but if the action is right and the disposition is stable, why does the label 'bias' carry any negative weight?"

  **Reply (2 mins):**
  "It matters for the agent, not necessarily the outcome. If D. is biased, her moral life is less integrated than she thinks. She believes she is acting on principle, but she is acting on a causal implant. This creates a vulnerability: if the drug wears off, the cows are no longer saved.
  More importantly, we care about truth in moral deliberation. If I believe I am reasoning, but I am actually executing a script, I am alienated from my own moral life. The negative weight isn't on the *act*, it's on the *agency*. We value moral agents who are in touch with why they act, not just agents who act rightly."

  **Concede:** I concede the immediate outcome (animal welfare) is identical.
  **Hold:** I hold that the stability of the outcome and the integrity of the agent are distinct goods.
  **Soft Spot:** Consequentialists may simply deny that "integrity" is a good independent of outcomes.

  ### 7. The Metaphysical Excess Objection
  **Likely Asker:** Normative Ethicist (General)
  **Probability:** Low | **Damage:** Low
  **Vocabulary:** "Ontology," "Realism," "Category Mistake."

  **Objection:** "Are you claiming 'bias' is a natural kind here? Or is this just a normative judgment disguised as a descriptive one? It sounds like you're saying 'biases are bad preferences.' If so, why the complex machinery about causal history? Why not just say some preferences are irrational?"

  **Reply (2 mins):**
  "I'm claiming it's a functional kind defined by causal role, not a normative judgment. A preference is a disposition responsive to reasons; a bias is a disposition responsive to causes that mimics reason-responsiveness.
  It's not that biases are 'bad preferences'; it's that they are a different psychological engine. Calling it 'irrational' misses the point because D. is being rational *given her inputs*. The machinery is needed to explain how something can be rational on the surface but causally disconnected from reason underneath. It's a claim about psychological architecture, not just value."

  **Concede:** I concede the terminology can sound normative.
  **Hold:** I hold that the underlying distinction is descriptive/functional.
  **Soft Spot:** The line between "responsive to causes" and "responsive to reasons" is notoriously blurry.

  ### 8. The "Hope Nobody Asks" Objection: The Transformation Paradox
  **Likely Asker:** Any (The Smartest Person in the Room)
  **Probability:** Low | **Damage:** Critical
  **Vocabulary:** "Status Change," "Revelation," "Stability."

  **Objection:** "You say the distinction is source-inaccessible. But in your case, D.'s brother *tells* her the source. She now knows. If she keeps the aversion after knowing, has the bias *become* a preference? If yes, then the distinction is transient and depends on knowledge, not history. If no, then why tell her? If the history makes it a bias regardless of her current endorsement, then her post-revelation endorsement is irrelevant, and your counterfactual test is moot."

  **Reply (2 mins):**
  "This is the hardest question. Here is the line: Learning the history changes the *causal structure*. If she keeps it *because* she has now integrated the history into a new rational framework, it has transformed into a preference. The old bias is gone; a new preference has taken its place.
  However, if she keeps it by *ignoring* or *minimizing* the history (due to the bias's grip), it remains a bias. The distinction isn't about the *content* of the view, but the *sustainability* of the view under full transparency. So, the status *can* change, but only if the retention is genuinely reason-based, not bias-preserved. The distinction is stable, but the *instantiation* in the agent can evolve."

  **Concede:** I concede the status of a specific disposition can change over time.
  **Hold:** I hold that at any given moment, the disposition is either reason-sustained or cause-sustained.
  **Soft Spot:** This risks making the distinction purely diachronic. If it can change instantly upon revelation, is it really a deep fact about the disposition?

  ---

  ### What Would Change My Mind (Vulnerability Assessment)

  **The Lethal Weakness:** The "Contaminated Standards" problem (Objection 3).
  **Why:** My entire positive account rests on the idea that we can run a counterfactual test: "Would you keep this if you knew the history?" But if the bias shapes the standards used to answer that question, the test is rigged.
  **What Would Change My Verdict:** If I cannot specify *how* to identify "epistemic distortion" without begging the question. If I admit that the only way to know if the standards are biased is to check if the disposition is a bias, the argument is circular.
  **Where Reasoning is Most Likely to Fail:** In the transition from "history matters" to "history makes it inaccessible." If I argue that the history makes the distinction *real* but also *inaccessible*, I risk making the distinction metaphysically real but epistemically useless. If a critic shows that *any* accessible test for etiology is itself subject to bias, my "source-inaccessible" claim becomes a "source-unknowable" claim, which collapses the theory into skepticism. I need to ensure I leave room for *third-person* access (science/therapy) even if *first-person* access is blocked.
