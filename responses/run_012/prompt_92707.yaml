prompt: |-
  I am a third-year undergraduate taking a seminar in the philosophy of biology, and I also work about ten hours a week as an editorial assistant for a publisher that produces a digital high-school biology textbook. My job is line-editing and flagging claims for review, and the same problem keeps returning: sentences that say the function of some trait is to do something. There are hundreds of them across the book, I have to clear roughly forty a week, and I have about three minutes per sentence. I have no research budget, no access to the primary literature on most of these organisms, and no background in the taxa in question; the writers I work with are generalists too. Our standards reviewer has begun returning pages with the note "unwarranted teleology," which nobody in the office can define.

  The seminar has given me two ways of answering the question what the function of a trait is. On the first, a trait's function is what it was selected for: the effect that explains why the trait is present in this lineage, given its history. On this view a trait that exists for no such reason has no function at all, however useful it may be, and a trait that was selected for one effect and is now used for another has the function it was selected for rather than the one it now serves. On the second, a trait's function is the contribution it makes to some capacity of the larger system it belongs to. On this view history is irrelevant: a trait can have a function in this sense even if it arose by accident, and the same trait can have as many functions as there are capacities you might ask about.

  I need a procedure I can actually run, sentence by sentence, that uses these two accounts to decide what to do with a sentence. Please give me:

  1. The steps in the order I should ask them, with a clear statement of what counts as a sufficient answer at each step, and where the procedure stops with a verdict.
  2. Three possible verdicts and when each applies: accept the sentence; rewrite it so that it asserts only what the evidence supports; send it to a consultant. For the rewrite option, include a formula a writer with no philosophy training can execute in two minutes.
  3. The points where the procedure hands the decision to a person rather than settling it, and an honest account of which of those points are real judgment calls and which are merely places where I am ignorant.
  4. What the procedure cannot do at all, and the kind of sentence it will get wrong.

  Then run it on three sentences:

  (a) The familiar case of feathers, where the standard account is that they arose in a lineage in a thermoregulatory or display context and were later co-opted for flight. What do I do with "the function of feathers is flight"?
  (b) A gene inserted into a crop for pest resistance, in our biotechnology chapter, where there is no selection history at all. What does each account license me to say?
  (c) A confident sentence about the function of a trait in a little-studied organism, where we have a clear description of what the trait does and no evidence whatever about its history.

  I have also been told that a reviewer disputes the standard story about the giraffe's neck. I do not need you to settle that, but tell me how the procedure behaves when the experts themselves disagree about the history, since I cannot adjudicate that from my desk.

  The one idea I have had so far is a test: before letting a sentence through, imagine the same organism with the same trait but with no history of selection for it at all — a mutant, or an engineered version — and ask whether the sentence would still be true. If it would, then the sentence is a claim about what the trait does rather than about what it is for, whatever it says. Tell me whether that test is sound, what it gets right, and where it breaks; if it is broken, replace it with something better.

  Finally: at each step, say which of the two accounts is doing the work, and flag the steps where the two accounts would give different verdicts on the same sentence, because I suspect those are where the procedure is most fragile. Include at least one case where the procedure tells me to kill a sentence I would rather keep. The procedure itself should fit on a page; the applications can run longer.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Third-year undergrad, philosophy of biology seminar student, editorial assistant (10 hrs/week) for a high-school biology textbook publisher.
      *   **Problem:** Hundreds of teleological claims ("function of X is Y") in the text. Reviewer flags them as "unwarranted teleology." Office doesn't understand the term. User has 3 minutes/sentence, no budget, no access to primary lit, no taxonomic expertise. Writers are generalists.
      *   **Philosophical Background:** Knows two main accounts of function:
          1.  *Etiological (Selected Effect):* Function = what it was selected for. History matters.
          2.  *Systemic (Causal Role):* Function = contribution to system capacity. History irrelevant.
      *   **Task:** Create a practical, step-by-step procedure to evaluate these sentences based on the two accounts.
      *   **Requirements:**
          1.  Ordered steps with clear stopping points/verdicts.
          2.  Three verdicts (Accept, Rewrite, Consult) + rewrite formula.
          3.  Identify human judgment points vs. ignorance points.
          4.  Limitations of the procedure (what it gets wrong).
          5.  Apply to three specific cases (Feathers, GMO gene, Little-studied organism).
          6.  Address the Giraffe Neck disagreement case.
          7.  Evaluate the user's "mutant/engineered test" idea.
          8.  Format: Procedure on ~1 page, applications can be longer.
          9.  Constraint: Indicate which account is driving each step and where they diverge.
          10. Constraint: Include a case where the procedure kills a sentence the user might want to keep.

  2.  **Deconstruct the Philosophical Problem:**
      *   *Etiological Account (SE):* Strict. Requires evolutionary history. "Function" implies "Purpose via Selection." If a trait is a spandrel (byproduct), it has no function (though it may have an effect). If exapted, original function is *the* function.
      *   *Systemic Account (CR):* Loose. Requires current utility. "Function" implies "Role." If it does it, it functions. Good for physiology, engineering, GMOs.
      *   *The Conflict:* High school texts often mix these. They say "The function of the heart is to pump blood" (CR - true now) but imply "The heart exists *because* it pumps blood" (SE - also true, but distinct). The reviewer hates "unwarranted teleology," which usually means implying intent or selection history without evidence.
      *   *The Constraint:* 3 minutes per sentence. No research.
      *   *The Solution:* A triage system. Default to the safer claim (Causal Role) unless Specific Evolutionary History is explicitly claimed and well-established.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Goal:* Minimize "Consult" (too slow/expensive). Maximize "Rewrite" (safe). Allow "Accept" only when safe.
      *   *Step 1: Check for Explicit History.* Does the sentence claim *why* it evolved? If yes, needs SE verification. If no, can use CR.
      *   *Step 2: Check Consensus.* Is this a textbook standard (heart, lungs) or obscure (specific worm gland)?
      *   *Step 3: The "Mutant Test" (User's idea).* I need to evaluate this. It's essentially a Causal Role test. If the trait does X in a mutant, X is a Causal Role function. But it doesn't prove SE function.
      *   *Refining the Steps:*
          1.  Identify the claim type (History vs. Current Utility).
          2.  Apply the appropriate account.
          3.  Decide verdict.
      *   *Addressing the "One Page" Constraint:* Needs to be concise. Use bolding and boxes.

  4.  **Evaluating the User's "Mutant Test":**
      *   *Idea:* Imagine organism without history (mutant/engineered). Is sentence still true?
      *   *Analysis:* This tests the *Causal Role* account. If a engineered gene resists pests, it functions to resist pests (CR), even if no selection history (SE).
      *   *Verdict:* It is sound for distinguishing CR from SE. It breaks if the trait *requires* history to exist (e.g., instinctive behaviors that might not develop without evolutionary scaffolding, though arguably still CR). It's a good heuristic for "Is this claim dependent on history?"
      *   *Integration:* I will incorporate a refined version of this into the procedure as a diagnostic tool.

  5.  **Developing the Verdicts:**
      *   *Accept:* Standard physiology (Heart pumps), well-established evolutionary facts (Chlorophyll captures light).
      *   *Rewrite:* Change "Function is..." to "Role is..." or "Effect is..." or "Adaptation for..." depending on evidence.
      *   *Consult:* Controversial evolutionary claims (Giraffe neck), obscure taxa where history is unknown.

  6.  **Addressing the Specific Cases:**
      *   *(a) Feathers:* "Function is flight." SE says False (originally thermo/display). CR says True (currently contributes to flight). Verdict: Rewrite to reflect exaptation or current utility.
      *   *(b) GMO Gene:* "Function is pest resistance." SE says False/None (no selection history in nature). CR says True (contributes to crop capacity). Verdict: Accept under CR, but label carefully.
      *   *(c) Little-studied organism:* "Function is X." SE says Unknown. CR says True (if observed). Verdict: Rewrite to "Effect is X" to avoid implying history.
      *   *(d) Giraffe Neck:* Experts disagree on history. SE is blocked. CR is open. Verdict: Rewrite to avoid history claims.

  7.  **Structuring the Output:**
      *   **Part 1: The Procedure (The "One Pager").** Needs to be tight.
      *   **Part 2: Evaluation of User's Test.**
      *   **Part 3: Applications (a, b, c, Giraffe).**
      *   **Part 4: Limitations & The "Killed Sentence".**

  8.  **Refining the Procedure for the "3-Minute" Constraint:**
      *   The user can't research history. So, the procedure must rely on *general knowledge* vs. *obscure knowledge*.
      *   *Key distinction:* Is the sentence making a *historical* claim or a *physiological* claim?
      *   *Wording:* "Function" is ambiguous. "Role" is CR. "Adaptation" is SE.
      *   *Step 1:* Is the trait a standard physiological mechanism? (Heart, Enzyme). -> CR applies. Accept/Rewrite.
      *   *Step 2:* Is the trait a complex behavior/morphology in a specific wild organism? -> SE implied. Check consensus.
      *   *Step 3:* Is there controversy? -> Consult/Rewrite.

  9.  **Drafting the Content (Mental Check against constraints):**
      *   *Constraint:* "Include at least one case where the procedure tells me to kill a sentence I would rather keep." -> I need to make sure the procedure is strict enough. Maybe the Feather case. It's intuitive to say feathers are for flight, but philosophy says "No, that's exaptation." I should force a rewrite there.
      *   *Constraint:* "Flag steps where accounts diverge." -> I will add margin notes [SE] or [CR].
      *   *Constraint:* "Honest account of judgment vs ignorance." -> Distinguish between "I don't know" (ignorance) and "Experts disagree" (judgment).

  10. **Final Polish:**
      *   Ensure the tone is professional but accessible (undergrad to undergrad).
      *   Make sure the "Rewrite Formula" is actionable for a generalist writer.
      *   Check the "One Page" visual constraint (I will use markdown to simulate a compact layout).

  *(Self-Correction during drafting)*: I initially thought about telling them to research the history. But the prompt says "no access to primary literature." So the procedure *cannot* require verifying selection history. It must assume history is *unknown* unless it is common knowledge (like feathers). If unknown, default to Causal Role language to be safe.

  *Revised Strategy for Procedure:*
  1.  **Categorize:** Is this physiology (CR safe) or evolutionary origin (SE risky)?
  2.  **Verify:** Is the evolutionary claim common knowledge (textbook standard) or specific/obscure?
  3.  **Decide:** If obscure/controversial, strip the teleology.

  *Wait, the User's Test:* "Imagine... no history." This is the *Causal Role* test. If the sentence holds true without history, it's a CR claim. If it fails without history, it's an SE claim. This is actually very good for the 3-minute limit. I will formalize this.

  *Let's build the response.*
answer: |-
  # The Teleology Triage Procedure (TTP)

  **Goal:** Resolve "function" claims in 3 minutes without primary research.
  **Philosophy:** Distinguishes **Etiological (SE)** (history/selection) from **Systemic (CR)** (current contribution).
  **Constraint:** If history is unknown or controversial, default to CR language to avoid "unwarranted teleology."

  ### Step 1: The "No-History" Test (Diagnostic)
  *Read the sentence. Imagine the trait exists in this organism but arose by accident or engineering (no selection history for this effect). Is the sentence still true?*
  *   **YES:** The sentence is a **Causal Role (CR)** claim. (Proceed to Step 2A).
  *   **NO:** The sentence is an **Etiological (SE)** claim. (Proceed to Step 2B).
  *   **[DIVERGENCE POINT]:** SE and CR accounts diverge here. SE says a trait without history has *no* function. CR says it does. This test identifies which claim the writer is *actually* making, regardless of the word "function."

  ### Step 2A: If CR Claim (Physiology/Current Utility)
  *Does the trait currently contribute to a capacity of the system (organism/ecosystem)?*
  *   **YES:** **Verdict: ACCEPT.** (e.g., "The heart functions to pump blood.")
  *   **NO:** **Verdict: REWRITE.** (See Formula Below).
  *   **[ACCOUNT]:** CR Account. History irrelevant.

  ### Step 2B: If SE Claim (Evolutionary Origin/Adaptation)
  *Is the selection history for this trait settled scientific consensus (textbook standard)?*
  *   **YES (Consensus):** **Verdict: ACCEPT.** (e.g., "Chlorophyll functions to capture light.")
  *   **NO (Obscure/Controversial):** **Verdict: REWRITE.** (You cannot verify history; assume "unwarranted.")
  *   **[ACCOUNT]:** SE Account. Requires historical evidence.
  *   **[JUDGMENT VS. IGNORANCE]:** If experts disagree (e.g., giraffe neck), this is a **Judgment Call** (proceed to Consult). If *you* simply don't know because it's obscure, this is **Ignorance** (proceed to Rewrite).

  ### Step 3: The Rewrite Formula (For Writers)
  *If REWRITE is the verdict, instruct the writer to replace "The function of X is Y" with one of the following:*
  1.  **For CR claims:** "X **plays a role in** Y" or "X **contributes to** Y." (Removes historical implication).
  2.  **For SE claims:** "X is **an adaptation for** Y" (Only if consensus exists) or "X **allows the organism to** Y." (Descriptive, neutral).
  3.  **For Exaptations:** "X is **used for** Y" (Implies current utility without claiming origin).

  ### Verdict Key
  1.  **ACCEPT:** Sentence is philosophically defensible under at least one account and matches evidence level.
  2.  **REWRITE:** Sentence implies more than evidence supports (usually implies SE history where only CR is known).
  3.  **CONSULT:** Sentence makes a specific SE claim in a contested area (requires expert review).

  ***

  # Evaluation of Your "Mutant Test"
  Your test (*"Imagine the organism... with no history of selection... ask whether the sentence would still be true"*) is **sound and highly effective** for your constraints.
  *   **What it gets right:** It cleanly separates Causal Role (survives the test) from Etiological (fails the test). It prevents you from needing to know the actual history; you only need to know if the *truth of the sentence depends* on history.
  *   **Where it breaks:** It struggles with traits where the "capacity" itself depends on history (e.g., an instinct that requires specific evolutionary scaffolding to develop). However, for high-school text line-editing, this edge case is negligible.
  *   **Recommendation:** Use it as Step 1. It is the fastest way to categorize the claim.

  ***

  # Applications of the Procedure

  ### (a) Feathers: "The function of feathers is flight."
  *   **Step 1 (No-History Test):** If feathers arose by accident (thermoregulation) and we put them on a non-avian dinosaur, could they be used for flight? Yes. But does the sentence claim *origin*? Standard account says origin was thermo/display. The sentence implies flight is *the* reason they exist.
  *   **Step 2B (SE Claim):** Is the history settled consensus? Yes, exaptation is standard curriculum.
  *   **Conflict:** SE says function is thermo/display (origin). CR says function is flight (current).
  *   **Verdict:** **REWRITE.**
  *   **Reasoning:** While CR allows "flight," the sentence structure ("The function... is") typically implies SE in biology texts. Since the SE history is exaptation, claiming flight is *the* function is misleading regarding evolutionary history.
  *   **Action:** Change to: "Feathers are **used for** flight, though they likely originated for thermoregulation."
  *   **[KILLED SENTENCE]:** This is a case where you might want to keep it (it's true they fly), but the procedure kills it to prevent historical inaccuracy.

  ### (b) GMO Gene: "The function of this gene is pest resistance."
  *   **Step 1 (No-History Test):** Imagine the gene was inserted artificially (no natural selection history). Is it still true it resists pests? **YES.**
  *   **Step 2A (CR Claim):** Does it contribute to the crop's capacity? **YES.**
  *   **Verdict:** **ACCEPT.**
  *   **Reasoning:** Under the CR account, engineered traits have functions. Under the SE account, they technically do not (no selection history), but high-school biotech chapters operate on CR logic (design/utility).
  *   **Action:** No change needed, provided the chapter context is biotechnology/engineering, not natural selection.

  ### (c) Little-Studied Organism: "The function of the gland is to secrete toxin."
  *   **Step 1 (No-History Test):** If the gland arose by accident, would it still secrete toxin? **YES.**
  *   **Step 2B (SE Check):** Is the selection history consensus? **NO** (Little-studied).
  *   **Verdict:** **REWRITE.**
  *   **Reasoning:** You cannot verify the SE claim. If you leave "function," the reviewer will flag it as unwarranted teleology because you lack the historical evidence.
  *   **Action:** Change to: "The gland **secretes** toxin" or "The gland **plays a role in** defense."

  ### (d) The Giraffe Neck (Expert Disagreement)
  *   **Scenario:** Experts disagree on whether the neck was selected for feeding (high leaves) or combat (necking).
  *   **Step 2B (SE Check):** Is history settled consensus? **NO.**
  *   **Verdict:** **CONSULT** (if the text makes a specific historical claim) or **REWRITE** (to be neutral).
  *   **Procedure Behavior:** The procedure halts at Step 2B. It identifies this as a **Judgment Call** point, not Ignorance. You know the experts disagree; you don't need to resolve it.
  *   **Action:** Do not accept "The function of the neck is reaching high leaves." Rewrite to: "The neck **allows** the giraffe to reach high leaves." This asserts the CR (true regardless of history) without committing to the contested SE.

  ***

  # Limitations & Honest Accounting

  ### 1. What the Procedure Cannot Do
  *   **Resolve Exaptation Nuance:** It will often force you to strip "function" from exapted traits (like feathers) even when they are the primary *current* utility. It prioritizes historical accuracy over pedagogical simplicity.
  *   **Detect "Spandrels":** If a trait is a byproduct (no function SE or CR, just a side effect), but looks useful, Step 1 might pass it as CR. You might accept "The function of the chin is..." when it's just a growth byproduct.
  *   **Normative Claims:** It cannot handle sentences implying an organism *ought* to have a trait.

  ### 2. Judgment Calls vs. Ignorance
  *   **Ignorance (Step 2B - Obscure):** When you flag a sentence because *you* don't know the history. The procedure treats this as "Rewrite." This is safe but may over-correct valid claims.
  *   **Judgment (Step 2B - Controversial):** When you know experts disagree (Giraffe). The procedure forces a "Consult" or "Neutral Rewrite." This is the correct philosophical move; you cannot arbitrate science from your desk.

  ### 3. Where the Accounts Diverge (Fragility Points)
  *   **Step 1:** The "No-History Test" is the divergence point. SE says the question is nonsense (traits *have* history). CR says it's a valid thought experiment.
  *   **Step 2 (Feathers):** SE says "Function = Thermo." CR says "Function = Flight." The procedure forces you to acknowledge the conflict rather than hiding it.
  *   **Step 2 (GMOs):** SE says "No Function." CR says "Function = Resistance." The procedure allows Acceptance here, prioritizing the context (Biotech chapter) over strict evolutionary philosophy.

  ### 4. The "Killed Sentence" Example
  *   **Sentence:** "The function of the human appendix is to store beneficial bacteria."
  *   **Your Instinct:** Keep it. It's a modern, useful explanation.
  *   **Procedure Verdict:** **REWRITE.**
  *   **Why:** Step 2B. Is the selection history settled consensus? It is *hypothesized*, but not settled like the heart. Strict SE requires proof of selection. CR allows it, but "Function" implies SE to the reviewer.
  *   **Fix:** "The appendix **may serve to** store beneficial bacteria." (Hedges the SE claim while keeping the CR utility).
