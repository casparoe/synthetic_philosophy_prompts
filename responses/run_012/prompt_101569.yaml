answer: |-
  Alex and Jamie were standing in the paint aisle of the hardware store, holding chips like playing cards. Alex held "Ocean Mist." Jamie held "Sagebrush."

  "I'm giving 'Ocean Mist' an 80 percent credence for long-term marital satisfaction," Alex said.

  "Okay," Jamie replied. "But I know your credence. And you know mine. And we both know that we're both trying to maximize the same utility function."

  "Right."

  "And we have common priors."

  "Do we?"

  "Yes. We both lived in grad housing for five years. We share the trauma of beige walls. Our starting distributions are identical."

  Jamie lowered the 'Sagebrush' chip. "So if I know you're at 80 percent for Mist, and you know I'm at 80 percent for Sage... and we trust each other's rationality..."

  "...then by Aumann, we literally cannot agree to disagree."

  "Exactly. Our posteriors have to converge."

  "So one of us is wrong."

  "Or both of us are updating wrong. If I know you're rational and you still prefer Sage, that's evidence about the lighting I'm not seeing. So I have to update toward Sage."

  "But then I know you've updated, so I have to update toward Mist..."

  "Until we hit the same number."

  They stood in silence for a moment, staring at the wall of colors. The math was undeniable. To disagree would be irrational. To remain distinct was impossible.

  Alex reached past both chips and grabbed a small can of 'Neutral Greige.'

  "The only stable equilibrium," Alex said.

  "Common knowledge," Jamie agreed, putting it in the cart.
