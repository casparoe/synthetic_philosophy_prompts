answer: |-
  ### Specification for a Theory of Iterated Dominance Elimination (Mixed Strategies)

  This specification defines the necessary conditions for a formal theory of Iterated Dominance Elimination (IDE) that permits mixed strategies. It categorizes requirements into structural cases, conceptual distinctions, and formal constraints, assigning a status of **Non-Negotiable** (mathematical or logical necessity) or **Methodological Preference** (choice of solution concept).

  #### I. Structural Cases (The Theory Must Resolve)

  1.  **Mixed-Strategy Exposure of Pure Strategies**
      *   **Requirement:** The theory must identify and eliminate pure strategies that are not dominated by any other *pure* strategy but are dominated by a *mixed* strategy (a probability distribution over other pure strategies).
      *   **Consideration:** The convex hull of payoffs from pure strategies is larger than the set of pure payoffs. Failing this test ignores the fundamental linearity of expected utility.
      *   **Status:** **Non-Negotiable.** (To ignore this is to misunderstand vNM utility).

  2.  **Order Dependence in Weak Dominance**
      *   **Requirement:** The theory must explicitly state whether the survivor set varies based on the sequence of elimination when weak dominance is employed. It cannot claim order independence if weak dominance is permitted.
      *   **Consideration:** Removing a weakly dominated strategy can remove the specific counter-strategy that made a third strategy dominated. Different orders yield different residual games.
      *   **Status:** **Non-Negotiable.** (This is a mathematical property of weak dominance relations).

  3.  **Simultaneous vs. Sequential Dominator Validity**
      *   **Requirement:** The theory must specify whether a strategy removed in round $k$ can serve as a dominator for another strategy removed in the same round $k$. (i.e., Can a mixture of strategies $A$ and $B$ eliminate $C$ in round $k$, if $A$ and $B$ are also eliminated in round $k$?)
      *   **Consideration:** Standard IDE requires dominators to survive the previous round ($k-1$). A "simultaneous" theory might allow mutual culling. The theory must rule on the temporal validity of the dominator set.
      *   **Status:** **Methodological Preference.** (Defines the specific algorithm, e.g., standard iterative vs. simultaneous pruning).

  4.  **Divergence of Weak Dominance and Admissibility**
      *   **Requirement:** The theory must distinguish between the set of strategies that are *never* weakly dominated (admissible) and the set that survives *iterated* elimination of weakly dominated strategies.
      *   **Consideration:** Iterated elimination can remove admissible strategies (strategies that are best responses to some belief) if the iteration relies on the assumption that opponents will not play certain admissible strategies.
      *   **Status:** **Non-Negotiable.** (Collapsing these sets creates logical contradictions regarding best-response rationality).

  #### II. Conceptual Distinctions (The Theory Must Maintain)

  1.  **Strict vs. Weak Dominance**
      *   **Requirement:** The theory must treat strict inequality ($>$) and weak inequality ($\geq$ with at least one $>$) as fundamentally distinct operators with different procedural properties.
      *   **Consideration:** Strict dominance implies a strategy is never a best response; weak dominance implies it is not a best response to any *fully supported* belief. Conflating them destroys the link to epistemic conditions.
      *   **Status:** **Non-Negotiable.**

  2.  **Pure vs. Mixed Dominators**
      *   **Requirement:** The theory must track whether a surviving strategy is undominated by pure strategies only, or undominated by mixed strategies as well.
      *   **Consideration:** A strategy surviving pure-strategy elimination may still be irrational if dominated by a mix. The "rationalizable" set depends on the dominator space.
      *   **Status:** **Non-Negotiable.**

  3.  **One-Shot vs. Iterated Elimination**
      *   **Requirement:** The theory must distinguish the set of undominated strategies in the original game from the set surviving $k$ rounds of elimination.
      *   **Consideration:** Rationality is static; Common Knowledge of Rationality (CKR) is dynamic. The reduction in the game space changes the dominance relations for remaining strategies.
      *   **Status:** **Non-Negotiable.**

  4.  **Procedural Elimination vs. Normative Irrationality**
      *   **Requirement:** The theory must distinguish between a strategy being removed by the algorithm and a strategy being "irrational to play."
      *   **Consideration:** In weak dominance, a strategy may be eliminated by the procedure but remain a best response to a specific (perhaps unreasonable) belief. Elimination is a solution concept output; irrationality is an epistemic status.
      *   **Status:** **Methodological Preference.** (Some theories equate them; others do not, but the distinction must be acknowledged).

  #### III. Formal Constraints (The Theory Must Respect)

  1.  **Existence of a Determinate Survivor Set**
      *   **Requirement:** The theory must specify conditions under which the procedure yields a unique set of surviving strategies.
      *   **Consideration:** For strict dominance, the set is unique. For weak dominance, it is generally not. A theory claiming uniqueness for weak dominance must impose an arbitrary ordering rule.
      *   **Status:** **Methodological Preference.** (Uniqueness is desirable for prediction but unavailable for weak dominance without restriction).

  2.  **Invariance Under Positive Affine Transformations**
      *   **Requirement:** The set of eliminated strategies must not change if a player's payoffs are transformed by $u' = a u + b$ (where $a > 0$).
      *   **Consideration:** Dominance relies on ordinal preferences and cardinal intensity (vNM), not the specific numerical representation.
      *   **Status:** **Non-Negotiable.** (Violation implies the theory depends on utility scaling, not preferences).

  3.  **Consistency with Common Knowledge of Rationality (CKR)**
      *   **Requirement:** Every eliminated strategy must be justifiable as inconsistent with CKR, and every surviving strategy must be consistent with CKR.
      *   **Consideration:** IDE is the behavioral implication of CKR. If the procedure eliminates a strategy that could be a best response under CKR, the theory is epistemically unsound.
      *   **Status:** **Non-Negotiable.** (This is the foundational justification for the procedure).

  #### IV. Incompatible Pair

  **Order Independence** and **Inclusion of Weak Dominance**.

  *   **Reasoning:** It is mathematically impossible to construct a theory that permits the elimination of weakly dominated strategies and guarantees that the final survivor set is independent of the order of elimination. Weak dominance creates path-dependence because eliminating one weakly dominated strategy can render another strategy undominated (by removing the specific opponent strategy that made it dominated).
  *   **Resolution:** A theory must sacrifice one. Standard Iterated Elimination of Strictly Dominated Strategies (IESDS) keeps Order Independence and drops Weak Dominance. Iterated Elimination of Weakly Dominated Strategies (IEWDS) keeps Weak Dominance and sacrifices Order Independence (requiring a specific order or set-of-orders approach).

  #### V. The Exclusionary Requirement

  The single requirement that does most to exclude otherwise attractive theories is **Order Independence**.

  *   **Justification:** Many games (e.g., voting games, entry deterrence, signaling) rely on **Iterated Weak Dominance** to refine equilibria to intuitively plausible outcomes that Strict Dominance cannot reach (as Strict Dominance often leaves the entire strategy space intact in these games). However, because Weak Dominance is inherently order-dependent, demanding Order Independence forces the theorist to abandon Weak Dominance entirely. This excludes the class of refinement theories that use weak dominance to select among Nash equilibria, limiting the theory's applicability to only those games solvable by strict dominance.
