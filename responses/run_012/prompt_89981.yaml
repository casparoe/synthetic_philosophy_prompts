prompt: |-
  I am working on a foundations seminar and need the specification for a theory of iterated dominance elimination when mixed strategies are permitted. Before I assess any particular solution concept, tell me what such a theory must deliver: the cases it has to get right (pure-strategy dominance that only mixed strategies can expose; games where elimination order changes what survives; simultaneous elimination in which a strategy is removed by a mixture of strategies that are themselves removed in the same round; and cases where weak dominance and admissibility diverge), the distinctions it cannot collapse (strict versus weak dominance, pure versus mixed dominators, one-shot versus iterated elimination, and being eliminated versus being irrational to play), and the formal constraints it must respect (existence of a determinate survivor set, invariance under positive affine payoff transformations, and consistency with common knowledge of rationality). Give the consideration behind each requirement, mark which are non-negotiable and which are the preferences of a particular approach, and flag the pair you suspect cannot be jointly satisfied. Finally, say which single requirement does most to exclude otherwise attractive theories. I do not need a survey or citations; I need the criteria.
