answer: |-
  1. Hume uses the oil metaphor to argue that money is merely a tool for facilitating trade rather than a source of value itself, meaning it smooths transactions without constituting real wealth like the commodities being traded.
  2. His claim that money is "of no consequence" refers specifically to the long-run equilibrium where prices rise proportionally to the money supply, leaving actual purchasing power unchanged.
  3. The apparent contradiction resolves when you recognize he is distinguishing between two time-scales, as his later discussion of benefits describes the short-run transition period where prices have not yet risen to match the increased quantity of coins.
  4. This temporary boost occurs because the influx of cash encourages merchants to produce more and workers to labor harder before inflation eventually neutralizes the advantage.
  5. Consequently, the advantage in wars and negotiations stems from the immediate power to mobilize resources using liquid cash, not from the permanent quantity of money circulating within the kingdom.
