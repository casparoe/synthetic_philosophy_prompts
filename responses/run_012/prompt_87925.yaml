prompt: |-
  I am a doctoral student in moral philosophy, and for the past few weeks I have been circling a cluster of ordinary practices that seem to me philosophically loaded, and that nobody I know discusses together. In most common-law jurisdictions there is no general duty to rescue a stranger in peril: a competent adult who walks past a shallow pond in which a child is drowning commits no legal wrong and owes nothing to anyone. Yet those same jurisdictions have passed statutes shielding the rescuer who does intervene from liability, several civil-law countries make the failure to render easy aid a criminal offence, and the law does impose duties of rescue on parents, on those who created the peril, and on those who have taken a patient or a dependent into their care. In parallel, nearly every hierarchical institution — armies, police and fire services, hospitals, and increasingly universities and firms — honours members whose conduct is publicly described as exceeding what the institution demands, while the institution's own rules oblige those members to accept extraordinary risk; and many professional ethics codes are formally divided into an aspirational part that no one can be sanctioned for failing and an enforceable part that can end a career. I want a careful reconstruction of what this cluster presupposes, not a summary of what philosophers have written about it.

  Please take the role of an expert in normative ethics and the philosophy of law, and start by brainstorming the candidate presuppositions before committing to a reconstruction, so that the final answer is argued rather than asserted. My central question is what must be true of the moral landscape for these practices to make sense as they stand. Do they presuppose that the morally good and the morally required can come apart — that there is a genuine category of the praiseworthy but optional, and that the deontic question of what one must do is not the same as the evaluative question of what is admirable? Or could the whole cluster be explained without loss by a theory that recognises only one dimension, on which the decorated hero has merely done what was required of her all along and the medals are an incentive device with no moral content? If a two-dimensional picture is presupposed, which version of it is strictly required, and which parts of the practice merely fit comfortably with it? Two further puzzles interest me. First, if the line between the required and the optional is drawn by the cost or the risk to the agent, then one and the same act — a soldier smothering a grenade, a bystander smothering a grenade — appears to be required in one case and optional in the other, which suggests the category is relative to role or relationship rather than to the act; is that coherent, and what would have to change in the practices if it were not? Second, the practices treat praise and blame asymmetrically: the rescuer is decorated, the passer-by is not blamed, though both faced the same situation. Does that presuppose that the standards for praise and for blame differ, or only that we have pragmatic reasons for a forgiving practice of blame?

  Finally, tell me where the cluster is philosophically underdetermined — where incompatible theories would license exactly the same statutes, medals and codes — and what would actually have to change if we replaced the presupposed picture with its chief rival. Assume I have no library and no internet access, so reason from the descriptions I have given rather than reaching for the literature; do not give me citations or a reading list, and do not report what any particular philosopher is supposed to have argued, since I will supply the references myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Doctoral student in moral philosophy.
      *   **Topic:** A cluster of ordinary practices regarding rescue, duty, supererogation, institutional roles, and professional ethics (common-law no-duty-to-rescue vs. Good Samaritan laws vs. civil-law duty-to-rescue vs. special duties; institutional heroism vs. institutional obligation; aspirational vs. enforceable codes).
      *   **Task:** Reconstruct the presuppositions of this cluster. Do not summarize existing literature. Brainstorm candidate presuppositions first, then argue for a reconstruction.
      *   **Central Question:** What must be true of the moral landscape for these practices to make sense? Specifically, do they presuppose a separation between the morally good/required (supererogation) or can a one-dimensional theory explain them?
      *   **Specific Puzzles:**
          1.  Role-relativity of duty/risk (soldier vs. bystander).
          2.  Asymmetry of praise/blame (hero decorated, passer-by not blamed).
      *   **Constraint:** No library/internet access (reason from the description provided). No citations or reading lists.
      *   **Final Requirement:** Identify where the cluster is philosophically underdetermined and what would have to change if the presupposed picture were replaced by its rival.
      *   **Tone:** Expert in normative ethics and philosophy of law, careful, argued rather than asserted.

  2.  **Deconstruct the "Cluster of Practices":**
      *   *Legal:* Common law (no general duty) vs. Civil law (duty to rescue) vs. Specific duties (parents, creators of peril) vs. Immunity statutes (Good Samaritan).
      *   *Institutional:* Hierarchies (army, fire, etc.) demand high risk but praise "exceeding" demands.
      *   *Professional:* Codes split into aspirational (praise only) and enforceable (blame/sanction).
      *   *Phenomenology:* We praise the rescuer, we don't blame the passer-by (legally/socially in common law contexts), yet we admire the rescuer more.

  3.  **Brainstorming Candidate Presuppositions (Phase 1):**
      *   *Candidate A (The Supererogationist View):* Morality has two distinct zones. The "Obligatory" (minimum) and the "Supererogatory" (above and beyond). The practices map onto this. Law handles the minimum; praise handles the beyond.
      *   *Candidate B (The Utilitarian/Consequentialist View):* There is only one dimension: Maximize Good. Duties are defined by optimal outcomes. The practices are pragmatic heuristics. We *should* rescue, but enforcing it is too costly. Medals are incentives to push people closer to the optimal.
      *   *Candidate C (The Contractualist/Relational View):* Duties arise from specific relationships. Strangers have no special relation, hence no duty. Soldiers have a contract, hence high duty. Praise is for maintaining the spirit of the relation beyond the letter.
      *   *Candidate D (The Scalar View):* Morality is a scale of better/worse. "Required" is just a threshold we set for social coordination. The practices reflect different thresholds for different contexts (legal vs. moral vs. institutional).
      *   *Candidate E (The Agency/Cost View):* Duty is limited by reasonable cost to the agent. Heroism involves unreasonable cost. Therefore, heroism cannot be required.

  4.  **Developing the Argument (Phase 2 - Selecting and Refining):**
      *   *The Central Tension:* One-dimensional (Optimization) vs. Two-dimensional (Deontic/Evaluative split).
      *   *Analysis of the Legal/Institutional Split:* If morality were one-dimensional (e.g., "always save the child if cost is low"), the common law would be morally erroneous, not just pragmatically distinct. But the *practice* treats the passer-by as *permitted*, not just *unchased*. This suggests a normative permission, not just an enforcement gap.
      *   *Analysis of the Institutional Paradox:* Soldiers are *ordered* to risk death. Yet some acts are "above and beyond." If the order covers all necessary risks, what is left for "above and beyond"? It implies a limit to institutional claim on the agent.
      *   *Analysis of Asymmetry:* Praise without corresponding blame for omission suggests the act is not a duty. If it were a duty, omission would warrant blame (even if legally excused for pragmatic reasons). The *moral* sentiment (admiration vs. indifference) tracks the supererogatory view better than the "hidden duty" view.

  5.  **Addressing the Specific Puzzles:**
      *   *Puzzle 1 (Role Relativity):* Soldier vs. Bystander. Same act (grenade smothering).
          *   If duty is act-based, this is incoherent.
          *   If duty is agent-relative (based on role/voluntary assumption), it makes sense. The soldier *undertook* a role with higher baseline demands. But even then, there's a limit (the "heroic" limit). This supports the idea that *all* roles have a ceiling of requirement, beyond which lies the optional/good.
      *   *Puzzle 2 (Asymmetry):* Praise vs. Blame.
          *   Does this presuppose different standards? Yes. Blame tracks violation of obligation. Praise tracks realization of value. If they tracked the same dimension, praise would imply blame for omission. The fact that we don't blame the passer-by (morally, not just legally, in many intuitions) suggests the act was not obligatory.

  6.  **Addressing Underdetermination and Rivals (Phase 3):**
      *   *Underdetermination:* A sophisticated Consequentialism (with enforcement costs and psychological limits) can mimic Supererogationism. It can say "We pretend it's optional to maximize good long-term."
      *   *What would change?* If we switched from Supererogation (Two-Dimensional) to Optimizing Consequentialism (One-Dimensional):
          *   *Legal:* We should move toward civil-law duty-to-rescue (enforce the optimal).
          *   *Institutional:* Medals become purely instrumental, not honorific. "Above and beyond" is a misnomer; it's just "doing your job properly."
          *   *Moral Sentiment:* We *should* feel guilt for not rescuing, even if we aren't blamed publicly. The current practice of *not* feeling guilt would be a moral failing.
      *   *The "Must Be True" Claim:* For the practices to make sense *as they stand* (i.e., without viewing them as systematic errors or mere pragmatic shams), they presuppose that the deontic (required) and the evaluative (good) come apart. Specifically, they presuppose **Agent-Relative Prerogatives** or **Limits of Claim**.

  7.  **Drafting the Response (Iterative refinement for tone and structure):**
      *   *Introduction:* Acknowledge the depth of the observation. Set the stage (Law/Institution/Ethics triad).
      *   *Brainstorming Section:* Lay out the competing hypotheses (One-Dimensional vs. Two-Dimensional vs. Relational).
      *   *Argumentation:* Test the hypotheses against the specific features (Asymmetry, Role-Relativity). Show why the One-Dimensional view requires treating the practices as "noble lies" or "heuristics," whereas the Two-Dimensional view treats them as sincere.
      *   *The Reconstruction:* Argue for the "Two-Dimensional with Role-Relativity" view. The key is the *limit of claim*.
      *   *Addressing Puzzles:*
          *   Role Relativity: Coherent if duty is grounded in voluntary undertaking, but even then, there is a hard limit (the heroic).
          *   Asymmetry: Presupposes distinct standards. Praise tracks value; Blame tracks violation of claim.
      *   *Underdetermination:* Acknowledge that Consequentialism can explain the *pattern* but not the *normative status*.
      *   *Implications of Switching:* If we adopt the rival (One-Dimensional), the practices become morally suspect (they let people off the hook too easily).

  8.  **Refining the "Expert" Voice:**
      *   Avoid colloquialisms. Use precise terminology (deontic, evaluative, supererogatory, prerogative, heuristic).
      *   Ensure the distinction between "legal enforcement" and "moral requirement" is handled carefully (the prompt notes the legal lack of duty, but asks about the *moral landscape* presupposed by the *cluster*).
      *   *Self-Correction during drafting:* I need to make sure I don't just say "Supererogation exists." I need to explain *what about the moral landscape* allows it. Is it the cost? The relationship? The prompt asks about the "moral landscape."
      *   *Key Insight:* The cluster presupposes that agents are not mere vessels for value maximization. They have a sovereign sphere of discretion.

  9.  **Final Review against Constraints:**
      *   No citations? Check.
      *   Brainstorm first? Check.
      *   Address specific puzzles? Check.
      *   Address underdetermination? Check.
      *   Tone appropriate for doctoral student? Check.

  **(Self-Correction Note):** I must be careful not to conflate the *legal* no-duty with the *moral* no-duty. The prompt asks what must be true of the *moral landscape* for these practices (including the legal ones) to make sense. The legal permission reflects a moral permission in the common law intuition. If the law reflected a moral duty but refused to enforce it, that's different. The prompt implies the law reflects the moral judgment ("commits no legal wrong and owes nothing to anyone"). I will treat the legal stance as evidence of the underlying moral intuition in those jurisdictions.

  10. **Final Polish:** Ensure the transition from brainstorming to reconstruction is clear. Make sure the "Underdetermination" section is robust, as that's often where the philosophical heavy lifting happens. (Proceed to generate output).

