answer: |-
  ### Phase 1: Brainstorming Candidate Presuppositions

  To reconstruct the moral landscape presupposed by this cluster, we must first isolate the competing hypotheses that could render these practices intelligible. We are looking for the background conditions that make the coexistence of *no duty to rescue*, *immunity for rescuers*, *institutional demands for risk*, and *praise for exceeding demands* coherent.

  **Candidate 1: The Two-Dimensional Landscape (The Supererogationist Hypothesis)**
  This view holds that the moral universe is divided into two distinct normative categories: the *Obligatory* (what is required, omission of which warrants blame) and the *Supererogatory* (what is good, performance of which warrants praise, but omission of which does not warrant blame).
  *   *Fit:* Explains why the passer-by is not blamed (act was optional) while the rescuer is praised (act was valuable). Explains the "aspirational" vs. "enforceable" split in professional codes.
  *   *Tension:* Must explain why the soldier is *required* to face risks the civilian is not. Requires a theory of role-based obligations that still has an upper limit.

  **Candidate 2: The One-Dimensional Optimization (The Pragmatic Consequentialist Hypothesis)**
  This view holds there is only one moral dimension: maximizing value (or minimizing harm). "Duty" is simply the optimal act. However, social practices distinguish "required" from "optional" based on *enforceability* and *psychological capacity*, not moral truth.
  *   *Fit:* Explains the legal distinction (enforcing rescue is too costly/intrusive) and the medals (incentives to push behavior closer to the optimum).
  *   *Tension:* Implies the passer-by is actually *morally failing* but we pretend otherwise. Implies the "hero" is just doing their duty, making the praise honorific rather than moral. This creates a gap between the *practice* (which treats the act as optional) and the *truth* (that it was required).

  **Candidate 3: The Relational/Contractual Landscape**
  This view holds that duties arise solely from specific relationships or voluntary undertakings. Strangers have no moral relation; soldiers have a contract with the state.
  *   *Fit:* Explains the role-relativity of the grenade case perfectly. Explains why parents have duties strangers do not.
  *   *Tension:* Struggles to explain the "Good Samaritan" immunity (why protect a stranger who intervenes?) and the "aspirational" codes (why aspire to values outside the contract?). It also risks making morality too fragmented.

  **Candidate 4: The Scalar Landscape with Thresholds**
  This view holds morality is a scale of "better to worse." "Required" is merely a social threshold we draw on this scale for coordination.
  *   *Fit:* Explains the fluidity between civil-law and common-law jurisdictions (different threshold settings).
  *   *Tension:* Does not explain the *qualitative* shift in our reactive attitudes. We do not merely feel the passer-by is "slightly less good"; we feel they are *permitted* to walk away. A scalar view suggests they are always somewhat blameworthy for not doing the "better" thing.

  ---

  ### Phase 2: Reconstruction of the Presupposed Moral Landscape

  Having weighed these candidates, I will argue that the cluster of practices strictly presupposes **Candidate 1 (The Two-Dimensional Landscape)**, specifically a version grounded in **Agent-Relative Prerogatives**, modified by **Role-Based Baselines**. Candidate 2 (One-Dimensional) can describe the *pattern* of behavior, but it cannot vindicate the *normative status* assigned by the practices without treating the participants as systematically mistaken about their own moral situation.

  Here is the argued reconstruction of what must be true of the moral landscape for these practices to make sense as they stand.

  #### 1. The Separation of the Deontic and the Evaluative
  For the common-law refusal to punish the passer-by to be morally intelligible (rather than merely a pragmatic enforcement gap), the moral landscape must allow for an act to be **maximally admirable** without being **mandatory**.
  If the One-Dimensional view were true (that we must always do the best available act), the legal permission to walk away would be a license to commit a moral wrong. While a legal system might choose not to punish every wrong, the *cluster* includes a social sentiment that the passer-by "owes nothing to anyone." This suggests the moral landscape itself contains a zone of discretion.
  Therefore, the practices presuppose that **value maximization is not the sole determinant of obligation.** There must be a normative "shield" around the agent that permits them to prioritize their own interests or safety up to a certain point, even when sacrificing those interests would produce a better outcome. This is the category of the *supererogatory*. Without this category, the "aspirational" sections of professional codes are misleading; they would simply be the "actual" duties that the institution lacks the power to enforce. The fact that we treat them as distinct implies we believe there is a limit to what can be demanded of an agent.

  #### 2. The Coherence of Role-Relativity (Addressing Puzzle 1)
  You ask if it is coherent for the same act (smothering a grenade) to be required of a soldier but optional for a bystander.
  Under the reconstructed Two-Dimensional landscape, this is coherent only if **obligations are grounded in voluntary undertakings or specific relationships, while the "supererogatory" limit is grounded in the agent's intrinsic worth.**
  *   **The Baseline:** The soldier, by enlisting, voluntarily lowers their threshold of required self-sacrifice. They have contractually agreed that risks which would be optional for a civilian are mandatory for them. This explains why the institution can *order* them into danger.
  *   **The Ceiling:** However, the cluster also shows institutions *praising* soldiers for acts that "exceed what the institution demands." This implies that even for a soldier, there is a hard ceiling of requirement. There are acts of risk or sacrifice that remain optional even for those with high-duty roles.
  *   **The Implication:** The moral landscape must presuppose that **no role can completely extinguish the agent's prerogative of self-preservation.** If the soldier's duty were absolute, there would be no logical space for "heroism" within the army; there would only be "compliance" and "dereliction." The existence of the medal presupposes that the agent retains a sovereign sphere of discretion that the institution cannot claim, even at the cost of their life.
  *   **What if this were not coherent?** If duty were strictly act-based (e.g., "whoever is nearest must save"), the distinction between soldier and civilian would collapse. The practices would have to change: either civilians must be conscripted into rescue duties (civil-law style on steroids), or soldiers must be denied praise for doing what is "required" by the act itself. The current practice relies on the agent's *status* determining the baseline, but the *act's cost* determining the ceiling.

  #### 3. The Asymmetry of Praise and Blame (Addressing Puzzle 2)
  The cluster treats the rescuer with honor and the passer-by with indifference. Does this presuppose different standards?
  Yes. It presupposes that **Blame is linked to the violation of a Claim, while Praise is linked to the Realization of Value.**
  *   **Blame:** To blame the passer-by is to assert that the drowning child had a *claim* on the passer-by's assistance. The common-law intuition ("owes nothing") denies this claim exists. Therefore, blame is inappropriate.
  *   **Praise:** To praise the rescuer is to acknowledge that the child's *need* had *value*, and the rescuer honored that value despite having no obligation to do so.
  *   **The Landscape:** This asymmetry requires a moral landscape where **needs do not automatically generate claims.** If every urgent need generated a claim (a One-Dimensional view), the passer-by would be blameworthy. The fact that we reserve blame for parents or those who created the peril confirms that claims are special, arising from relationship or causation, not mere capacity to help.
  *   **Pragmatic vs. Moral:** You ask if this is just pragmatic forgiveness. If it were merely pragmatic (i.e., "they did wrong, but we won't blame them to encourage future rescues"), the praise would be instrumental. But the description notes the conduct is "honoured" and "decorated." Honor implies a judgment of character, not just an incentive. Therefore, the practices presuppose the asymmetry is moral, not just pragmatic. We admire the rescuer *because* they were not required to act. If they were required, the medal would be a mere receipt for duty fulfilled.

  ---

  ### Phase 3: Philosophical Underdetermination and the Rival Picture

  Finally, I must identify where this cluster is underdetermined and what would change if we adopted the chief rival theory.

  #### 1. Where the Cluster is Underdetermined
  The cluster is compatible with two incompatible deep theories, provided we distinguish between *surface practice* and *underlying justification*.
  *   **Theory A (Deontological/Agent-Centered):** Agents have rights against being used for the greater good. Duty is limited by these rights. Supererogation is real.
  *   **Theory B (Rule-Consequentialist/Indirect Utilitarian):** The *true* moral demand is to maximize good. However, a social system that *pretends* there is no duty to rescue, and *pretends* heroism is optional, produces better long-term consequences (e.g., less anxiety, more voluntary altruism, clearer role definitions) than a system that enforces total optimization.

  Both theories license the exact same statutes, medals, and codes. A Rule-Consequentialist would draft the exact same "no duty to rescue" law as a Deontologist, but for different reasons. The Deontologist says: "You have a right to walk away." The Consequentialist says: "Enforcing a duty would cause more harm than good, so we will legislate as if you have a right."
  This is the point of underdetermination: **The external practices do not reveal whether the "optionality" is ontological (a real feature of morality) or heuristic (a useful fiction).**

  #### 2. What Would Change if We Replaced the Presupposed Picture?
  If we explicitly replaced the presupposed Two-Dimensional picture (Supererogation is real) with its chief rival, the One-Dimensional picture (Optimization is the only truth, optionality is a heuristic), the following shifts would occur in the *interpretation* and eventually the *practice*:

  *   **Shift in Moral Sentiment:** Currently, the passer-by feels no guilt (presupposing they did no wrong). Under the rival view, the passer-by *should* feel guilt (they failed to maximize good), even if they are not legally punished. The "forgiveness" becomes a form of moral pity for human weakness, rather than respect for agent sovereignty.
  *   **Shift in the Nature of Honors:** Medals and decorations would cease to be marks of *honor* and become marks of *instrumental success*. We do not "honor" a machine for functioning optimally; we maintain it. If the hero merely did what was truly required (optimally), the medal is a training signal, not a tribute. The language of "sacrifice" would be replaced by the language of "cost-effective intervention."
  *   **Legal Drift:** The One-Dimensional view exerts pressure toward the Civil-Law model. If the "no duty" rule is just a heuristic, and we can improve enforcement mechanisms (e.g., via technology or insurance), the heuristic should be discarded. The Common-Law stance becomes unstable; it is only defensible as long as enforcement is costly. If enforcement becomes cheap, the duty must be imposed. The Two-Dimensional view protects the "no duty" rule even if enforcement becomes cheap, because the right to walk away is intrinsic, not cost-based.
  *   **Professional Ethics:** The "aspirational" code would be reclassified as "deferred enforcement." It would imply that currently, we cannot sanction you for this, but we are working toward a culture where we can. The distinction between "ethical" and "legal" would blur into a distinction between "currently enforceable" and "ideally enforceable."

  ### Conclusion
  The cluster of practices you describe makes sense as a coherent normative system only if we presuppose a **Two-Dimensional Moral Landscape** where the *Obligatory* is defined by specific claims (arising from role, relationship, or causation) and bounded by a limit of reasonable cost, while the *Admirable* encompasses acts of value that lie beyond that limit.
  While a One-Dimensional optimization theory can mimic the *structure* of these practices as heuristics, it cannot account for the *reactive attitudes* (honor vs. indifference) without implying that society is engaged in a systematic deception about the nature of duty. To take the practices at face value—as sincere expressions of moral judgment rather than instrumental tools—requires accepting that morality leaves agents a sphere of discretion that cannot be claimed by the needs of others, regardless of the stakes. The soldier and the civilian differ in their baseline duties, but they share the same ceiling of requirement; beyond that ceiling lies the space where morality invites but does not command.
