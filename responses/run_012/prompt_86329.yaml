answer: |-
  The tension you are feeling is the central engine of Hume's monetary theory, and it remains the central tension in macroeconomics today. You are struggling to reconcile **Money as a Numeraire** (a unit of account that cancels out in the long run) with **Money as a Mechanism** (a distributed system of incentives that drives behavior in the short run).

  Your six verdicts are internally consistent if, and only if, you distinguish between *equilibrium states* and *transition dynamics*, and between *domestic circulation* and *international settlement*.

  Here is the principle that captures your verdicts, stated as a single framework with four operative clauses.

  ### The Principle of Circulatory Friction and Settlement Finality

  **Clause 1 (The Neutrality Limit):** In a state of full equilibrium where all prices, wages, and contracts have fully adjusted, the stock of money determines only the nominal price level. Real wealth is defined solely by the stock of goods, services, and productive labor.
  *   *Mechanism:* This is the Quantity Theory of Money. If money doubles and velocity is constant, prices double. Since real wealth is goods (Verdict 6), a mere change in the counting units (Verdict 1) leaves the nation neither richer nor poorer.
  *   *Supports:* Verdict 1, Verdict 6.

  **Clause 2 (The Cantillon Effect):** During the transition to equilibrium, money is not neutral. The real effects of a change in the money supply depend entirely on *who receives the new money first* and *how fast it circulates*.
  *   *Mechanism:* Prices do not rise uniformly. Those who spend new money first do so at old prices, gaining purchasing power at the expense of those who receive it last. This creates a temporary profit signal that stimulates industry (Verdict 2). If the money is hoarded, velocity drops to zero, the signal is never sent, and the economy remains in the initial state (Verdict 3).
  *   *Supports:* Verdict 2, Verdict 3.

  **Clause 3 (The Trust Constraint):** Domestic credit can substitute for specie (metal) to the extent that agents trust the convertibility of that credit. However, international settlement requires an asset accepted by all parties regardless of political jurisdiction.
  *   *Mechanism:* Paper credit works as "oil" domestically because the legal system enforces contracts. Internationally, or during political crisis, that enforcement vanishes. Foreigners will not accept paper promises they cannot enforce; they demand specie. Thus, paper money introduces a fragility that metal does not (Verdict 5).
  *   *Supports:* Verdict 5.

  **Clause 4 (The Real Transfer Condition):** One nation enriches another only if the transfer of money induces an increase in the recipient's productive industry, not merely a rise in their prices.
  *   *Mechanism:* In trade, money flows to pay for goods; both sides specialize and produce more (Verdict 4, part 1). In colonial extraction, silver flows without a corresponding increase in the colony's industry; it merely inflates prices in the spending nation without creating reciprocal demand for the partner's goods (Verdict 4, part 2).
  *   *Supports:* Verdict 4.

  ***

  ### How This Principle Resolves Your Tension

  You asked: *"If money is only the oil, why should it matter so much how it enters, and why should it matter whether it is metal or paper?"*

  The principle answers this by distinguishing the **substance** of wealth from the **kinetics** of exchange.
  *   **How it enters (Clause 2):** Oil poured directly onto the axle lubricates immediately; oil poured into the fuel tank takes time to reach the engine. In economics, money given to merchants (who invest) stimulates production differently than money given to landlords (who consume). The "oil" metaphor holds, but Hume's insight is that oil does not spread instantly. The friction of the spread *is* the stimulus.
  *   **Metal vs. Paper (Clause 3):** Both are oil, but paper is volatile oil. It evaporates (loses value) if the container (the state/bank) leaks (loses credibility). Metal is stable oil. domestically, they function similarly; internationally, or under stress, their chemical properties diverge.

  ### Predictions for Unlisted Cases

  **Case A: A Modern Fiat System (Central Bank creates money at will)**
  *   **Prediction:** Under Clause 1, long-run inflation is guaranteed if creation outpaces growth. Under Clause 2, the stimulus depends on *where* the central bank injects liquidity (e.g., buying bonds from banks vs. direct transfers to households). Under Clause 3, the "Trust Constraint" is no longer about convertibility to gold, but convertibility to *tax liability* and *goods*. If the state remains stable, paper functions as metal. If the state falters, the "oil" evaporates rapidly (hyperinflation), because there is no external settlement anchor.
  *   **Verdict:** Your unease (Verdict 5) is validated but shifted: the risk is not "paper vs. metal" but "political stability vs. instability."

  **Case B: New Money Reaches Wage-Earners First**
  *   **Prediction:** Under Clause 2, this produces a different stimulus than money reaching merchants first. Wage-earners have a higher marginal propensity to consume. The new money bids up the price of consumer goods before it bids up the price of capital goods. This stimulates retail and light industry first, rather than heavy investment.
  *   **Verdict:** This is still a "real stimulus" (Verdict 2), but the *composition* of the growth changes. It validates the principle that distribution matters.

  ### The Honest Sacrifice

  To maintain logical consistency with this principle, **you must modify Verdict 1.**

  Your first verdict states: *"If a country's stock of money doubles overnight and nothing else changes... wages and rents and debts adjust, and the country is neither richer nor poorer."*

  **Why you must give this up:**
  This verdict assumes a frictionless world that contradicts Verdict 2 and Verdict 5. If debts are denominated in money (which they are), they cannot "adjust" instantly without widespread bankruptcy or windfall gains. If I owe you 100 coins, and the money supply doubles overnight, the *real* value of my debt is halved. I am richer; you are poorer. The distribution of wealth has changed violently, even if the aggregate price level has doubled.

  Furthermore, the "overnight" scenario is physically impossible in any system where money circulates (Clause 2). If you treat Verdict 1 as a **theoretical limit** (what happens after 50 years) rather than a **practical case** (what happens if it doubles tomorrow), the contradiction vanishes. But as a "verdict on a case," it is false. In the real world, a sudden doubling causes chaos, not smooth adjustment.

  **The Modification:**
  Change Verdict 1 to: *"If a country's stock of money doubles and all prices/contracts adjust **instantly and costlessly**, nothing real changes."*
  By adding the bolded clause, you acknowledge that this is a thought experiment, not a policy reality. This aligns it with Clause 1 of the principle (The Neutrality Limit) and removes the conflict with Clause 2 (The Cantillon Effect).

  ### Summary of the Conflict
  *   **Verdict 1** relies on Money as a **Veil** (Classical Dichotomy).
  *   **Verdict 2, 3, 5** rely on Money as a **Mechanism** (Monetary Transmission).
  *   **Hume's Synthesis:** Money is a veil in the long run, but a mechanism in the short run. Your unease comes from trying to apply the long-run logic to short-run cases. Accept that the "oil" metaphor describes the *function*, but the *viscosity* of that oil (how fast it flows, who holds it, what it's made of) determines the motion of the wheels during the journey.
