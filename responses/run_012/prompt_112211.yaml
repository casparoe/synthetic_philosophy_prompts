answer: |-
  # INSTRUMENT: The Historical Judgment Tree

  **ROOT: What is the primary object of your assessment?**
  *   **A. The Institution/Structure** enabling the act.
      *   *Probe:* Was the Roman slave system vicious, regardless of the senator's kindness?
      *   **LEAF: STRUCTURAL VIEW** (Target shifted off individual).
  *   **B. The Individual Agent.**
      *   → Go to **Q1**.

  **Q1: Is moral truth constant across time, or indexed to the period?**
  *   **A. Indexed.** (Morality changes; past agents inhabit a different moral world.)
      *   *Probe:* Is it a category mistake to blame a Roman senator for owning slaves?
      *   **LEAF: STRICT HISTORICIST** (Defense explains context; blame is anachronistic).
      *   *Note:* If you judge the *perpetrator* by this standard but the *victim's suffering* by ours, see **Asymmetry Error** below.
  *   **B. Constant.** (Morality is universal; slavery was wrong then and now.)
      *   → Go to **Q2**.

  **Q2: (The Jefferson Split) He could have known better, but everyone else did it. Which fact determines blame?**
  *   **A. Belief Availability.** (Access to dissenting views creates culpability.)
      *   *Probe:* Jefferson denounced slavery in writing while owning people. Does his pen cancel his whip?
      *   → Go to **Q3**.
  *   **B. Practice Pervasiveness.** (Social ubiquity mitigates individual responsibility.)
      *   *Probe:* Columbus operated in a era of universal conquest. Can one man opt out of empire?
      *   **LEAF: MORAL FOG** (Everybody was in it; nobody could see out).
      *   **LEAF: RELATIVE-PROGRESS** (Graded against the median of contemporaries, not us).

  **Q3: Does holding public office mitigate private moral failure?**
  *   **A. Yes.** (Statesmen must compromise to achieve goods unavailable to private actors.)
      *   *Probe:* Churchill prioritized war logistics over Bengal famine relief. Was this statecraft or cruelty?
      *   **LEAF: ROLE-DIFFERENTIATED VIEW** (Public standards differ from private).
  *   **B. No.** (Power increases responsibility; public role amplifies vice.)
      *   → Go to **Q4**.

  **Q4: Is the defense meant to excuse the person or only to explain the act?**
  *   **A. Excuse.** (He is forgiven because knowledge was rare.)
      *   **LEAF: CULPABLE IGNORANCE** ("They had abolitionists, so he could have known" — but grants some leniency).
  *   **B. No Excuse.** (Explanation is not exoneration.)
      *   **LEAF: STRAIGHT PRESENTISM** (Judged by our standards, full stop).

  ***

  ### NOTES ON COLLISIONS, EMPTY CELLS, AND ASYMMETRY

  **1. The Asymmetry Error (Perpetrator vs. Victim)**
  The tree catches this at **Q1**. If you answer **Indexed** (Morality changes), you cannot consistently claim the *victim's* suffering was objectively wrongful by universal standards while claiming the *perpetrator's* action was objectively permissible by local standards. This is the most common student error: grading the perpetrator by his period and the victims by ours.

  **2. Incoherent Combinations (Empty Cells)**
  *   **Indexed Morality + Culpable Ignorance:** If morality is indexed to the period, ignorance of *future* morality cannot be culpable. This combination is logically incoherent.
  *   **Belief Unavailable + Practice Not Universal:** How could a practice be rare (not universal) yet the belief against it be unavailable? This suggests a social anomaly the tree doesn't map; likely **Undefended**.
  *   **Structural View + Role-Differentiated:** If the target is the Structure, the Individual's role is irrelevant. Combining these is **Unattractive** (muddies the target).

  **3. Undefended Positions**
  *   **Moral Fog + Straight Presentism:** Claiming "everyone did it" (Fog) while simultaneously applying "no excuse" (Presentism) is a contradiction unless you argue ubiquity amplifies guilt (rare).
  *   **Relative-Progress + Strict Historicist:** If you grade against contemporaries (Relative), you are already making a universal judgment about progress. Strict Historicists deny the ladder exists.

  **4. The Jefferson Split (Q2)**
  This node forces the distinction between **Epistemic Responsibility** (Could he know?) and **Social Pressure** (Could he act?). Jefferson fails the first (he knew) but passes the second (everyone owned slaves). Students must choose which branch weights heavier. Churchill fails the second (not everyone starved Bengals) but often claims the first (war constraints).
