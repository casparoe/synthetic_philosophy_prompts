answer: |-
  This is a classic problem in political theory: defining the "boundary of the polity." You are asking who constitutes "the people" for this specific decision.

  If you want a principled line that holds up under scrutiny, you cannot draw it based on **impact** (who is affected) or **duration** (who stays longest). You must draw it based on **liability and exit costs.**

  Here is the principle I would use, where I would draw the line, and exactly how I would defend it to the people excluded.

  ### The Principle: "Skin in the Game" (Risk & Control Alignment)

  The right to vote in a governance structure should be reserved for those who cannot easily exit the consequences of the decision and who bear the ultimate financial liability for the asset.

  Voting is not just an expression of preference; it is an exercise of **fiduciary responsibility**. When you vote to take on a 20-year loan, you are pledging the asset's value as collateral. If the co-op defaults, the shareholders lose their equity. If the layout ruins resale value, the shareholders absorb the loss.

  Therefore, the franchise must belong to those whose **exit costs are high** and whose **liability is unlimited** (within the scope of the co-op).

  ### Where I Would Draw the Line

  **Voting Rights:** Current Shareholder-Members only.
  **Non-Voting Participation:** Subtenants, Commercial Tenants, Neighbors.

  I would explicitly **reject** weighted voting based on intended length of stay. It is administratively unenforceable (how do you prove intent?) and ethically dubious (it penalizes mobility and rewards stagnation).

  ### How to Defend It to the Excluded

  Here is the script for the town hall when the angry renter or neighbor stands up.

  **1. To the Renters (Subtenants)**
  *   **The Argument:** "You are affected, but you are not bound."
  *   **The Defense:** "We acknowledge this renovation impacts your daily life. However, if this loan bankrupts the co-op or the renovation fails, you have a legal mechanism we do not: you can move. Your lease may be disrupted, but your life savings are not tied to the solvency of this building. Shareholders cannot sell their way out of the debt easily; the debt travels with the share. Because we bear the ultimate risk of asset failure, we must hold the control. However, because you live here, we are establishing a **Renters' Advisory Committee** with a guaranteed seat at the board table during construction to mitigate disruption."
  *   **Why it works:** It acknowledges their pain without conceding the governance structure. It offers *influence* without *franchise*.

  **2. To the Commercial Tenant (Ground Floor Shop)**
  *   **The Argument:** "You are a partner, not a member."
  *   **The Defense:** "Your relationship with us is contractual, defined by your lease. Your protection against loss of foot traffic or noise is in that lease and in local business disruption laws, not in our corporate governance. Giving you a vote on our capital structure would create a conflict of interest where a tenant could vote to lower their own rent obligations or prioritize shop access over residential safety. We will negotiate a specific **Mitigation Fund** for business interruption, but voting rights are reserved for equity holders."
  *   **Why it works:** It clarifies the landlord/tenant boundary. Mixing governance with tenancy corrupts both.

  **3. To the Neighbors**
  *   **The Argument:** "You are suffering an externality, not a governance burden."
  *   **The Defense:** "Scaffolding and noise are negative externalities, and we are sorry for them. But you do not share in the upside of our property value increasing, nor do you share the liability if our loan defaults. If everyone affected by a decision gets to vote on it, every city project would be vetoed by the surrounding block. Your recourse is through city permitting and zoning, which is the correct venue for neighborhood impact. Our vote is on *financial solvency*, not just construction."
  *   **Why it works:** It directs them to the proper venue (city government) rather than your private board.

  **4. To the Future Members (The "Taxation Without Representation" Argument)**
  *   **The Argument:** "The market prices the debt."
  *   **The Defense:** "This is the hardest point. When someone buys a share in three years, the share price will reflect the health of the building and the burden of the loan. They are buying into the asset *as it exists*. If we don't fix the building now, the asset they buy is broken. By voting to preserve the asset's long-term viability, we are acting as stewards for them. To protect them further, we are requiring a **supermajority (e.g., 75%)** for this vote. This ensures the decision isn't just for the current majority, but has broad consensus that respects the future equity."
  *   **Why it works:** It reframes the vote from "spending money" to "preserving asset value." The supermajority requirement acts as a proxy for future consent.

  ### Why Weighted Voting is a Trap

  You mentioned weighting votes by how long someone plans to stay. **Do not do this.**

  1.  **It creates perverse incentives:** People will lie about their plans to gain influence.
  2.  **It devalues equity:** A share is a share. If I own 10% of the risk, I should have 10% of the say, regardless of whether I plan to die here or sell in a year.
  3.  **It punishes liquidity:** Co-ops need turnover to remain vibrant. Penalizing people who might move reinforces stagnation.

  ### The Compromise: Process Over Franchise

  If you keep the vote restricted to shareholders (which you legally likely must anyway, depending on your bylaws and jurisdiction), you must expand the *process* to acknowledge the others.

  1.  **Advisory Ballot:** Run a parallel, non-binding survey for renters and commercial tenants. Publish the results alongside the shareholder vote. If 90% of renters hate the layout, the Board should reconsider, even if they can't veto.
  2.  **Mitigation Covenants:** Write specific protections for non-voters into the loan agreement or board resolution (e.g., "No scaffolding on Block X after 6 PM," "Rent abatement for construction noise over Y decibels").
  3.  **The Supermajority:** Because this debt outlasts many current owners, a simple 51% majority is insufficient. Require 66% or 75%. This forces the "short-termers" to convince the "lifers," ensuring the plan is robust enough to survive turnover.

  ### Summary

  The line is drawn at **ownership** because ownership implies **liability**.

  *   **Principle:** Control follows Risk.
  *   **The Line:** Shareholders vote; others consult.
  *   **The Defense:** "You can leave; we cannot. Therefore we must decide, but we promise to listen."
  *   **The Safeguard:** Supermajority requirements protect the future; advisory boards protect the non-owners.

  This approach is defensible because it treats the co-op as a financial entity with obligations, not just a community club with feelings. It is colder, but it is fairer.
