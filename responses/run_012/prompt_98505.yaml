          *   Altruistic donation (stranger/paired/chain) = OK vs. Surrogacy (paid in some places) = OK.
          *   Body can't be sold vs. Body can be "rented" (boxing, mining, stunts).
          *   Priority nudge (donor gets priority) = OK.
