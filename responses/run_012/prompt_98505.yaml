          *   International variation (some countries allow sales).
      *   **Theoretical Frameworks to Test:**
          *   *Theory A (Inalienability/Commodification):* Body parts are not property; selling dehumanizes/commodifies the person.
          *   *Theory B (Coercion/Exploitation):* Cash coerces the poor; undermines altruism ("crowding out").
          *   *Theory C (Harm/Safety):* Selling leads to unsafe practices (though this is less emphasized by the user, it's implicit in medical regulation).
      *   **Tasks:**
