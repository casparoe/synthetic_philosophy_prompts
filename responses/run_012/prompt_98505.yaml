          *   Test it: Fits the ban, fits reimbursement (removing barriers), fits the discomfort with sales.
          *   *Conflict:* The "Priority Nudge" is a quid-pro-quo, which undermines pure altruism.
      *   **The "Underdetermination" Point:**
          *   Show how the Kidney Ban sits at the intersection. Both theories support it, so policymakers don't need to choose.
          *   Show where they diverge (Plasma/Trials).
      *   **The Charity Scheme Stress Test:**
          *   Analyze the "Charity Nomination."
          *   Inalienability: Violates it (organ has price).
          *   Coercion: Maybe OK (donor doesn't get cash), but still induces donation via financial leverage.
          *   Altruism: Corrupts the motive.
      *   **Consistency Check:**
          *   The system is *not* consistent. It treats renewable vs. non-renewable differently (Coercion/Harm), but also treats "medical context" differently than "labor context" (boxing).
          *   It treats "direct cash" differently than "priority status" (Altruism vs. Market).
      *   **The Swap (Counterfactual):**
          *   If we adopted strict Inalienability: Ban plasma/sperm sales, ban paid trials.
          *   If we adopted strict Market/Property: Allow kidney sales, regulate for safety.
          *   If we adopted strict Coercion: Ban high-risk trials, dangerous sports (unlikely to happen).
      *   **Conclusion:** The system is a pragmatic compromise, not a philosophical derivation. It prioritizes *supply stability* and *public trust* over logical consistency.

  5.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I need to be careful about the "Priority Nudge." Is that actually practiced? Yes, in Israel and some US networks (though controversial). It's a "non-cash incentive."
      *   *Correction:* Surrogacy laws vary wildly. I should note that distinction (altruistic vs. commercial surrogacy).
      *   *Refinement:* The distinction between "selling a part" vs. "selling a service" is key for surrogacy and trials. A kidney is a part. A trial is a service. Plasma is a part but renewable. This suggests the "Non-renewable/Invasive" line is the real boundary, not "Commodification" per se.
