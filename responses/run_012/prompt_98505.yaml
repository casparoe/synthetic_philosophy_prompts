          *   Identify which practices are presupposed by which theory.
          *   Identify where the system is philosophically underdetermined (incompatible views license the same rules).
          *   Assess consistency (do the pieces fit one picture or different ones?).
          *   Counterfactual: If we swapped the implicit view, which rules would have to change?

  2.  **Analyze the Theoretical Tensions:**

      *   **The "Body as Property/Commodity" View (Inalienability):**
          *   *Premise:* You cannot own yourself or parts of yourself in a way that allows market transfer.
          *   *Prediction:* No payment for *anything* bodily.
          *   *Conflict:* Plasma, sperm, eggs, hair, surrogacy, drug trials all involve payment for bodily use/substance.
          *   *Resolution attempt:* Distinguish between "renewable" (blood, sperm, hair) and "non-renewable" (kidney). But eggs are non-renewable (finite supply) and often paid. Surrogacy is a service but uses the body intimately. Drug trials risk long-term harm for money.
          *   *Conclusion:* The current system *cannot* be consistently explained by a strict "no commodification" theory because it allows commodification elsewhere.

      *   **The "Coercion/Exploitation" View (Paternalism):**
          *   *Premise:* Poor people will be forced by economic desperation to make harmful choices.
          *   *Prediction:* Ban high-stakes/high-harm financial transactions. Allow low-stakes/renewable ones.
          *   *Conflict:* Phase 1 trials are high risk/high pay. Boxing/mining is high risk/high pay. Why is a kidney different?
          *   *Distinction:* Kidney removal is permanent surgery with lifelong health implications. Plasma regrows. Sperm regrows. Hair regrows. Surrogacy ends. Drug trials *might* cause harm, but the intent isn't removal.
          *   *Conclusion:* This fits better but struggles with the risk asymmetry (why is a paid drug trial OK but a paid kidney not, if both carry risk?).

      *   **The "Altruism/Civic Duty" View:**
          *   *Premise:* Medicine should be a gift relationship (Titmuss). Money crowds out moral motivation.
          *   *Prediction:* Incentives should be non-monetary (priority, recognition).
          *   *Conflict:* Priority nudge fits this. Expense reimbursement fits this (removing barriers, not adding incentives). Charity nomination is a hybrid (money changes hands, but not to the donor).
          *   *Conclusion:* This explains the *ban* on sales well, but struggles to explain why we pay for plasma/sperm (market-based systems exist alongside voluntary ones).

  3.  **Synthesize the "Underdetermination" and "Inconsistency":**

      *   *Underdetermination:* The ban on kidney sales is consistent with *both* Inalienability and Coercion theories. You can't tell which one is driving the policy just by looking at the ban.
      *   *Inconsistency:* The system is a patchwork.
          *   If Inalienability were true: Ban plasma/sperm sales.
          *   If Coercion were true: Ban high-risk drug trials or boxing.
          *   If Altruism were true: Ban priority nudges (that's a quid-pro-quo, not a gift).
      *   *The "Charity Nomination" Loophole:* This is the stress test.
          *   Inalienability says: No market value attached to the organ. (Charity payment attaches value).
          *   Coercion says: Donor still gets economic benefit (indirectly via signaling virtue or potential tax write-offs? Or just the feeling of directing funds?). Actually, if the donor doesn't get cash, Coercion is less worried.
          *   Altruism says: This might corrupt the gift.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the astuteness of the observation. The system is indeed a philosophical patchwork, not a coherent whole.
      *   **Theory 1: The Inalienability/Commodification Argument:**
