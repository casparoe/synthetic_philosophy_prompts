prompt: |-
  Alright, bit of an odd request, so let me set it up. I spent 34 years as an analytical chemist (mass spec, mostly), retired two years ago, and have since done the thing all my old colleagues warned me against, which is read philosophy. Right now I'm plowing through von Neumann's The Computer and the Brain -- the Silliman lectures he never finished, the thing Yale put out in 1958 after he died -- and the more I sit with it the more convinced I am that the "brain is just a computer" crowd either hasn't read it or read some other book entirely. He hedges constantly. Half the time it's a digital machine, half the time it isn't, and near the end he basically says the brains "language" is statistics rather than math, which is not how anybody on a podcast talks about him.

  Anyway. What I want is a parody product review. Concretely: a deadpan review, in the voice of a bored consumer-tech blogger, of a fictional home appliance called the Neumann-1 that's marketed as a literal brain in a box -- "von Neumann's blueprint, finally built," that kind of thing. The jokes have to come from getting the actual von Neumann right, so that someone who's read the book laughs instead of wincing. Some raw material you're welcome to use: the analog/digital thing he can't quite make up his mind about, his point that the brain is reliable even though the parts are junk, the memory-capacity question, the fact that the brain is slow as molasses but gets away with it by being absurdly wide/parallel, and the statistical-language point. Never wink. If the reader can tell you're being funny on purpose, you've gone too far.

  Format it like an actual review, with these sections in this order: "The pitch" (~100 words), "What's in the box" (~120), "Setup and calibration" (~120), "Performance" (~150), and "The verdict" (~100). Then finish with a section called "What's his and what's yours" (~200 words) where you tell me which details are genuinely von Neumann's and which you invented for the joke.

  Target the habit, not a person -- the gadget-blog/startup thing of name-dropping von Neumann to sell "brain-like" hardware, and the underlying assumption that the brain is just a computer. Don't make the reviewer a real person and don't quote anybody real. And keep it fair: a computational neuroscientist should recognize what's being sent up.
