answer: |-
  ### 1. The Thesis Structure
  The statement is **one thesis with two necessary commitments**, not three.
  *   **Commitment A (Ontology):** A person is a pattern, not a portion of matter.
  *   **Commitment B (Topology):** That pattern can be causally active in a substrate other than the originating brain.
  *   **Consequence (Persistence):** Survival is a matter of degree.

  **Teach Commitments A and B.** Do not teach the Consequence as a separate claim; it is the logical output of A and B. If you spend time arguing for "degrees of survival" independently, you invite the group to treat the session as a discussion on grief (comforting the social worker) or eschatology (confusing the neuroscientists). Keep the focus on the *mechanism of realization*. If A and B hold, the Consequence is forced.

  ### 2. Prerequisites and Order of Introduction
  The surrounding literature often begins with metaphysics (Locke/Parfit) or technology (uploading). For this group, that order fails. You must establish the *functional capacity* of the pattern before discussing its *location*.

  **Step 1: The Pattern vs. The Substrate (15 mins)**
  *   **Dependency:** None. This is the foundation.
  *   **Goal:** Establish that "You" are the algorithm, not the hardware.
  *   **Why here:** If the neuroscientists anchor identity to specific synaptic weights and the philosophers to psychological continuity tied to a specific biological history, the distribution claim is dead on arrival.
  *   **Head off:** The "Hardware Dependence" misconception. Neuroscientists may argue that subtle biological differences prevent true pattern replication. *Counter:* We are talking about functional equivalence in judgment, not bitwise identity.

  **Step 2: The Dossier vs. The Working Model (30 mins)**
  *   **Dependency:** Requires Step 1 (Pattern Ontology).
  *   **Goal:** Distinguish between *data about* a person (memory) and *the person's operating logic* (simulation).
  *   **Why here:** This is the most common failure point. If the friend only remembers what you liked, that is a museum archive, not a distributed self. The friend must be able to *process new inputs* using your weights.
  *   **Head off:** The "Metaphor of Memory" misconception. The social worker and philosophers will want to retreat to "we live on in memory." You must interrupt this: Memory is static; the thesis claims the friend's brain is running your *code*.

  **Step 3: The Asymmetry and The Subject (30 mins)**
  *   **Dependency:** Requires Step 2 (Working Model).
  *   **Goal:** Address the "One or Two Subjects" problem and the Asymmetry.
  *   **Why here:** You cannot ask "Is it one person?" until you know *what* is being duplicated (the working model).
  *   **Head off:** The "Fusion" misconception. The group will assume if the pattern is in two heads, there are now two people, or that the friend becomes the deceased. You must enforce the Asymmetry: The source is gone; the realization remains. The friend does not become the deceased; the deceased is *running* in the friend.

  **Step 4: Evaluation and Truth Conditions (15 mins)**
  *   **Dependency:** Requires Step 3.
  *   **Goal:** Test falsifiability.
  *   **Why here:** Only after understanding the mechanism can they judge if it's true or just poetic.

  ### 3. The Carrying Example
  Your tentative thought is correct: **The surrogate must produce a judgment the source never produced.** However, to work for this specific group, the example must be refined to avoid sci-fi and ensure high stakes.

  **The Example: The Executor's Dilemma**
  *   **Scenario:** Person A (dying) appoints Person B (friend) as executor. A dies. A situation arises that A never anticipated (e.g., a specific medical decision for A's child, or a moral dilemma regarding A's unpublished work). B must decide.
  *   **Must Have:**
      1.  **Novelty:** B cannot be recalling a direct instruction. B must generate a decision using A's values/logic on new data.
      2.  **Asymmetry:** A is dead. B is alive. B is not "channeling" A mystically; B is using their own neural hardware to run A's pattern.
      3.  **Stakes:** The decision must matter ethically or practically (engages the social worker and philosophers) and involve complex weighting (engages the neuroscientists).
  *   **Must Not Have:**
      1.  **Digital Artifacts:** No emails, videos, or AI bots. This must be biological realization in B's brain.
      2.  **Perfect Symmetry:** Do not use a scenario where A and B discuss it together while A is alive. That is collaboration, not distribution.
      3.  **Low Stakes:** Do not use "B orders A's favorite meal." That is a dossier lookup, not a working model.

  ### 4. Misconceptions to Head Off
  **Incoming Misconceptions:**
  1.  **"This is just the Extended Mind Thesis."** (Philosophers)
      *   *When:* Step 1.
      *   *Correction:* Extended Mind usually puts the *tool* outside the head (notebook/phone). This thesis puts the *self* inside another head. The locus of realization is biological, just not the *original* biological.
  2.  **"This is a comforting metaphor for grief."** (Social Worker/General)
      *   *When:* Step 2 (Crucial).
      *   *Correction:* Metaphors cannot be falsified. This thesis claims a causal mechanism. If B decides contrary to A's pattern, the claim is false, not just "less poetic."
  3.  **"Neural substrates are too unique for pattern transfer."** (Neuroscientists)
      *   *When:* Step 1.
      *   *Correction:* We are not claiming identical wiring. We are claiming functional isomorphism in decision spaces.

  **Generated Misconceptions:**
  1.  **"Therefore, B is now A."**
      *   *When:* Step 3.
      *   *Correction:* Reinforce Asymmetry. B contains a realization of A, but B also contains B. A is a subset of B's current processing, not the totality.
  2.  **"This solves the Hard Problem."**
      *   *When:* Step 3.
      *   *Correction:* Explicitly refuse to claim qualia transfer. We are discussing judgment and agency, not whether B *feels* A's pain.
  3.  **"Immortality is guaranteed."**
      *   *When:* Step 4.
      *   *Correction:* The thesis claims persistence in *degrees*. If the pattern degrades (B forgets, B changes), A ceases to be realized.

  ### 5. The Closing Question
  To test if they accept the thesis as having truth conditions rather than as poetry, ask:

  **"What specific decision by the survivor would falsify the claim that the deceased is present?"**

  *   **Why this works:** If they treat the thesis as metaphor, any decision B makes is "compatible" with A's memory (e.g., "B just didn't remember well"). If they treat it as a truth-claim about pattern realization, they must admit there is a threshold of divergence where the pattern breaks and A is no longer running. If they cannot name a falsifying condition, they have retreated to metaphor.

  ### 6. What Not to Settle
  You have ninety minutes. You must openly refuse to settle the following:

  1.  **The Threshold Problem:** How much of the pattern must be realized to count as "A"? (Is it 51%? The core values? The tics?) Acknowledge this is a sorites problem you will not solve today.
  2.  **The Phenomenology:** Does B *feel* like A when running the pattern? This invites the Hard Problem. Stipulate that we are discussing third-person observable agency and judgment, not first-person qualia.
  3.  **Moral Responsibility:** If B acts as A, is B liable for A's debts or sins? This is a legal/ethical downstream consequence. Bracket it to keep focus on the metaphysics of the self.

  ### Session Flow Summary (90 Minutes)
  *   **00-15:** **Ontology.** Person = Pattern. (Head off Hardware Dependence).
  *   **15-45:** **Mechanism.** Dossier vs. Working Model. Use *The Executor's Dilemma*. (Head off Metaphor of Memory).
  *   **45-75:** **Topology.** Asymmetry and the One/Two Subject problem. (Head off Fusion/Identity confusion).
  *   **75-90:** **Evaluation.** Falsifiability and Closing Question. (Head off Immortality claims).
