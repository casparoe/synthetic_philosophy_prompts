  ### Desiderata for Probability in No-Collapse Quantum Mechanics

  For the purposes of this seminar, we are evaluating proposals (Many-Worlds, Everettian, etc.) against a functional standard: the theory must serve a working physicist. It cannot merely be a metaphysical picture; it must recover the operational machinery of quantum mechanics, specifically the probabilistic predictions confirmed by experiment. Below are the five criteria any adequate account must satisfy, along with the motivation and a verdict on their status.

  | # | Desideratum | Motivation | Verdict |
  | :--- | :--- | :--- | :--- |
  | **1** | **Empirical Adequacy**<br>The account must recover the numerical predictions of the Born Rule ($P = |\psi|^2$) for all practical experimental contexts. | **Physics requires prediction.** A theory that cannot tell an experimentalist what odds to expect for a detector click is empirically incomplete, regardless of its ontological elegance. | **Genuine Requirement** |
  | **2** | **Intelligibility of Uncertainty**<br>The account must explain how an agent can be genuinely uncertain about an outcome when the formalism dictates that all outcomes deterministically occur. | **Probability implies contingency.** Standard probability theory presupposes that only one outcome obtains. If "everything happens," the concept of probability (and the associated uncertainty) risks becoming incoherent (The "Incoherence Problem"). | **Camp Commitment**<br>(Subjective Uncertainty Camp) |
  | **3** | **Non-Circularity**<br>The derivation of the Born Rule must not presuppose the Born Rule, nor rely on a measure over Hilbert space justified *only* by its ability to yield the Born Rule. | **Explanatory power.** If the probability rule is simply postulated to match experiment, the interpretation adds no explanatory value over standard Copenhagen quantum mechanics. The goal is derivation from unitary dynamics alone. | **Genuine Requirement** |
  | **4** | **Measure Independence (No Counting)**<br>The account cannot rely on counting discrete "worlds" or branches, as the decomposition of the wavefunction into branches is not fixed by the formalism (basis dependence). | **Formalism constraints.** The Hilbert space structure is continuous; "branches" are emergent and fuzzy. Any account relying on discrete world-counting is mathematically ill-defined and basis-dependent. | **Genuine Requirement** |
  | **5** | **Rational Agency Link**<br>The account must explain why a rational agent should weight their bets or cares according to branch amplitude rather than treating all branches as equiprobable. | **Action guidance.** A working physicist must know how to act (bet, design experiments) in a branching universe. If all branches are real, why not treat them as equally likely? (The "Quantitative Problem"). | **Genuine Requirement** |

  ***

  ### The Incompatibility Claim

  The pair of requirements that cannot be jointly met—to the satisfaction of the broader foundational community, and arguably in principle—is **(1) Empirical Adequacy** and **(3) Non-Circularity**.

  This is the core of the "Probability Problem" in Many-Worlds. To achieve **Empirical Adequacy**, one must recover the Born Rule. To achieve **Non-Circularity**, one must derive this rule solely from the unitary, deterministic Schrödinger equation without smuggling in a probability measure.

  The tension arises because unitary dynamics alone treats all branches as equally real components of a superposition. There is no intrinsic "weight" in the linear algebra that distinguishes a high-amplitude branch from a low-amplitude one *ontologically*; they both exist. To get the numbers right (1), you must introduce a measure. To avoid circularity (3), that measure must be derived from something other than the probability rule itself. Despite decades of effort (Gleason's theorem, Decision-Theoretic derivations, Envariance), no derivation has achieved universal consensus. Critics (e.g., Adrian Kent) argue that any derivation that succeeds in getting the numbers right inevitably smuggles in a probabilistic assumption equivalent to the Born Rule, thereby violating Non-Circularity. Thus, you can have a theory that predicts right (by postulate), or a theory that is purely unitary (by derivation), but not both simultaneously without controversy.

  ### The "Killer" Requirement

  The single requirement that eliminates the most candidates among the familiar strategies is **(3) Non-Circularity**.

  *   **World-Counting:** Eliminated immediately. It fails (4) No Counting, but it also fails (3) because it assumes a discrete ontology not present in the formalism to generate probabilities.
  *   **Relative-Frequency:** Eliminated. Frequentist approaches in MWI typically define a "typical" observer. However, defining 'typicality' requires a measure over branches. If that measure is the Born Rule, it violates (3). If it is counting, it violates (4).
  *   **Self-Locating Uncertainty (SLU):** Heavily pressured. SLU approaches often rely on a Principle of Indifference over "centers" of consciousness. Without a non-circular justification for weighting these centers by amplitude rather than counting them, they violate (3) (by assuming the weighting) or (4) (by counting centers).
  *   **Decision-Theoretic (Deutsch-Wallace):** Contested. While this is the most sophisticated attempt, critics argue that the rationality axioms required (e.g., Diachronic Consistency, Branching Indifference) implicitly encode the Born Rule weights, thus violating (3).

  While **(4) No Counting** kills World-Counting outright, **(3) Non-Circularity** is the broader filter that challenges every remaining serious contender's claim to have *solved* the problem rather than *restated* it.

  ### Confidence and Uncertainty

  *   **High Confidence:** I am highly confident that **(4) No Counting** is a genuine requirement grounded in the mathematical formalism of Hilbert space, and that it decisively eliminates naive World-Counting strategies.
  *   **High Confidence:** I am highly confident that **(1) Empirical Adequacy** is a non-negotiable genuine requirement for any physical theory claiming to supersede standard quantum mechanics.
  *   **Medium Confidence:** I am moderately confident in the verdict that **(2) Uncertainty** is a **Camp Commitment**. While a working physicist operates with uncertainty, a "Deterministic Chance" camp (e.g., Papineau) argues that MWI can function with objective branching ratios alone, rendering subjective uncertainty unnecessary. This is a live philosophical dispute.
  *   **Low Confidence (Least Sure):** I am least sure of the claim that **(1) Empirical Adequacy** and **(3) Non-Circularity** *cannot* be jointly met. This is the strongest claim in this analysis. While no derivation is currently universally accepted, the impossibility of such a derivation is not a proven theorem. It remains possible that a future mathematical insight (perhaps in decoherence theory or quantum information) could derive the Born Rule from unitary dynamics in a way that satisfies all critics. My verdict reflects the current stalemate rather than a logical impossibility proof.
