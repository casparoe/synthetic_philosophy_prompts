answer: |-
  Defoe mimics Montaigne's suspension of judgment to dramatize Crusoe's spiritual anxiety, but ultimately collapses that relativism into a hierarchy where Crusoe's God and law supersede indigenous custom, transforming the philosophical critique of European cruelty into a justification for benevolent domination.

  **Reasoning**

  The novel's most Montaignean moment occurs during Crusoe's long isolation after discovering the footprint. For years, Crusoe wrestles with the urge to ambush the cannibals, mirroring Montaigne's hesitation to condemn customs that do not directly injure the observer. Crusoe concludes that because the cannibals have committed no offense against him personally, attacking them would make him a murderer rather than an agent of justice. This aligns with Montaigne's argument that we lack the standing to judge practices rooted in a different cultural nature, and it serves a specific narrative function: it preserves Crusoe's self-image as a righteous man rather than a bloodthirsty conqueror. However, where Montaigne uses this suspension to hold a mirror up to European brutality—arguing that torture and religious wars are worse than ritual eating—Crusoe uses it merely to avoid personal sin. The relativism is not philosophical but prudential; he spares them because killing them endangers his soul, not because he respects their sovereignty.

  This fragile suspension shatters the moment Friday enters Crusoe's power. The transition from observer to master marks the end of the Montaignean experiment. Crusoe does not ask Friday for his name or inquire about his laws; he renames him after the day of his rescue and teaches him the word "Master" before teaching him the word "God." In Montaigne's essay, the "cannibals" often speak truth to the European observer, exposing the absurdity of European hierarchy; in Defoe's novel, Friday is the silent vessel for Crusoe's instruction. The cultural exchange is entirely unidirectional. Crusoe's deliberation on cannibalism resolves not by accepting the practice as culturally valid, but by re-categorizing it as a capital crime under the new jurisdiction of his island kingdom. When the cannibals return, Crusoe slaughters them without the previous moral agony, justified now because they threaten his subject. The moral measure has shifted from "have they harmed me?" to "do they obey my law?"

  The novel does engage with Montaigne's specific critique of European cruelty, but contains it within a colonial framework. Crusoe explicitly reflects that the Spanish conquests in the Americas are more barbarous than the cannibals' feasts, acknowledging Montaigne's point that "savagery" is often a projection of European violence. Yet, Defoe allows Crusoe to make this admission without requiring him to abandon his own civilizing mission. Crusoe distinguishes himself from the Spanish by framing his domination as protective and spiritual rather than extractive. He does not seek gold; he seeks converts and servants. This allows the novel to acknowledge the Montaignean critique—that Europeans are often the true barbarians—while simultaneously arguing that *this* European is the exception who justifies his rule through benevolence.

  What the novel adds to the philosophical debate is the psychology of governance that the essay omits. Montaigne writes from the safety of a study, observing customs; Defoe places the reader inside the mind of a man who must enforce order with a musket. The novel demonstrates how quickly ethical relativism dissolves when the observer becomes the governor. Crusoe's arc suggests that while one might suspend judgment as a stranger, power demands absolute standards. The book resists a purely Montaignean reading by showing that Crusoe's initial hesitation was never about the validity of the cannibals' culture, but about the cleanliness of Crusoe's own hands. Once Friday washes those hands by serving him, the violence becomes holy. Defoe ultimately argues that cultural relativism is a luxury of the powerless, and that the colonizer's duty is not to understand the savage, but to save him from himself by making him English.
