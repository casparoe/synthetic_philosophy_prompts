prompt: |-
  I'm a novelist at work on a book about a colonist who must decide what he owes to the people he has been taught to call savages, and I have been rereading Robinson Crusoe as a model. Give me a reading of the novel through Montaigne's essay on the cannibals and the cultural relativism usually attributed to it. I am most interested in Crusoe's long deliberation over whether he may slaughter the cannibals he discovers, and in how that deliberation resolves once Friday is in his power: does Defoe stage a genuinely Montaignean suspension of judgment, or does the novel quietly keep Crusoe's own customs as the measure while only softening the cruelty? Be honest about where the book resists the reading. Note that Montaigne's relativism is often flattened into the doctrine that no custom may be judged, whereas his own essay plainly does judge European cruelty — I want to know whether Crusoe's arc tracks that narrower, ethnocentric critique or something else, and what the novel adds to the philosophical debate that Montaigne's essay alone does not. Work from plot and scene rather than quotation. Lead with your central claim in one sentence, then give the reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist writing a book about a colonist's moral obligation to indigenous people (labeled "savages").
      *   **Task:** Provide a reading of *Robinson Crusoe* through the lens of Montaigne's "Of Cannibals" and cultural relativism.
      *   **Specific Focus:** Crusoe's deliberation on slaughtering the cannibals vs. his relationship with Friday.
      *   **Key Question:** Does Defoe stage a genuinely Montaignean suspension of judgment, or does he keep Crusoe's customs as the measure while softening cruelty?
      *   **Nuance:** Acknowledge that Montaigne's relativism isn't "no judgment allowed" but specifically judges European cruelty. Does Crusoe track this ethnocentric critique or something else?
      *   **Requirement:** What does the novel add to the debate that Montaigne's essay doesn't?
      *   **Constraint:** Work from plot and scene, not quotation.
      *   **Format:** Lead with a central claim in one sentence, then give the reasoning.
      *   **Tone:** Honest about where the book resists the reading.

  2.  **Deconstruct the Source Material:**
      *   **Montaigne ("Of Cannibals"):** Argues that "barbarism" is relative. Europeans are often more barbarous (torture, religious wars) than the Tupinambá (ritual cannibalism). It's a critique of European hubris, not a total moral vacuum. He judges based on reason/nature, not just custom.
      *   **Defoe (*Robinson Crusoe*):**
          *   *The Cannibal Question:* Crusoe spends years agonizing over whether to attack the cannibals. He concludes they haven't harmed *him* personally, so killing them would be murder. This looks like relativism/non-interference.
          *   *The Friday Turn:* Once he saves Friday, the dynamic shifts. Friday becomes a servant/subject. Crusoe teaches him English, converts him to Christianity, and calls him "Friday" (erasing his name).
          *   *The Resolution:* Crusoe eventually helps Friday kill his former masters (the cannibals) when they threaten them. He becomes the judge and executioner.
      *   **Comparison:** Montaigne suspends judgment to critique the judge. Defoe suspends judgment initially to protect the self, then asserts judgment to save the soul/subjugate the other.

  3.  **Drafting the Central Claim:**
      *   *Attempt 1:* Defoe uses Montaigne's ideas but ultimately rejects them in favor of colonialism. (Too simple)
      *   *Attempt 2:* While Crusoe initially mirrors Montaigne's hesitation to judge indigenous customs, the novel ultimately rejects relativism by making Crusoe's religion and authority the absolute standard once Friday arrives. (Better)
      *   *Attempt 3 (Refining for nuance):* Defoe mimics Montaigne's suspension of judgment to highlight Crusoe's spiritual anxiety, but ultimately collapses that relativism into a hierarchy where Crusoe's God and law supersede indigenous custom, transforming the philosophical critique of European cruelty into a justification for benevolent domination. (Stronger)
      *   *Final Polish:* Defoe initially mirrors Montaigne's suspension of judgment to dramatize Crusoe's spiritual anxiety, but ultimately collapses that relativism into a hierarchy where Crusoe's God and law supersede indigenous custom, transforming the philosophical critique of European cruelty into a justification for benevolent domination.

  4.  **Developing the Reasoning (Plot & Scene Focus):**
      *   *The Deliberation (Montaignean Moment):* Crusoe finds the footprint. He sees the bones. He plans an attack. He stops. Why? Not because cannibalism is okay, but because they haven't injured *him*. This aligns with Montaigne's idea that we shouldn't judge what doesn't concern us/isn't against natural law *to us*. It protects Crusoe from becoming a murderer.
      *   *The Shift (Friday):* Friday enters. Crusoe doesn't ask Friday's name; he gives one. He teaches him "Master." He teaches him God. This is the end of relativism. Crusoe's culture is the "correct" one.
      *   *The Violence:* When the cannibals return, Crusoe doesn't hesitate. He slaughters them. Why the change? Because now they threaten *his* property (Friday). The moral line isn't "cannibalism is wrong universally," it's "cannibalism is wrong when it touches my sphere."
      *   *Montaigne vs. Defoe:* Montaigne judges Europeans for being worse than cannibals. Defoe judges Cannibals for not being Christian/English. Defoe adds the *practicality* of colonization. Montaigne is an essayist observing; Crusoe is an actor governing.
      *   *Resistance:* The book *does* show Crusoe's horror at European brutality (he mentions the Spanish in the Americas), acknowledging Montaigne's point. But it doesn't stop his own project.

  5.  **Refining the Argument (Addressing the Prompt's Nuance):**
      *   The prompt asks about Montaigne's specific critique (European cruelty). Does Crusoe track that? Yes, Crusoe admits the Spanish are worse. But does it change his behavior? No.
      *   What does the novel add? The *psychology of the colonizer*. Montaigne observes from a distance. Defoe puts us inside the head of the man pulling the trigger. We see the *rationalization* process.
      *   *Honesty:* I need to admit that Crusoe's initial hesitation *is* a form of relativism, but it's self-serving, not philosophical.

  6.  **Drafting the Response (incorporating constraints):**
      *   *Sentence 1:* The Claim.
      *   *Body:* Break down the footprint scene, the Friday integration, the final battle. Contrast with Montaigne's specific critique of European torture. Discuss the "addition" (the psychology of governance).

  7.  **Review against Constraints:**
      *   One sentence claim? Yes.
      *   Plot/Scene over quotation? Yes.
      *   Honest about resistance? Yes (acknowledge the initial hesitation is genuine but limited).
      *   Montaigne's specific relativism (critique of Europe)? Yes.
      *   What the novel adds? Yes (the mechanics of power).

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Check:* Did I emphasize that Montaigne *does* judge? Yes, need to make sure I don't paint Montaigne as a modern "anything goes" relativist. He judges by Nature/Reason. Crusoe judges by Scripture/Property.
      *   *Check:* Did I address the "softening cruelty" aspect? Yes, Crusoe sees himself as benevolent, unlike the Spanish.
      *   *Check:* Is the tone appropriate for a novelist? Yes, analytical but focused on narrative arc.

