answer: |-
  You have identified a genuine and pervasive phenomenon in contemporary discourse. Your observation is precise: you are not describing a specific rhetorical tactic (like sealioning), but rather a **meta-evaluative bias** regarding how rhetorical tactics are judged.

  There is no single, canonical academic term that captures this exact configuration. However, it is not a new discovery; it is a synthesis of several well-documented psychological and rhetorical mechanisms that, when combined, create the specific trap you describe.

  Here is the analysis of the components, why existing labels fall short, and a proposed definition for the phenomenon as a whole.

  ### 1. Analysis of Components
  The pattern you describe is a composite of three distinct mechanisms operating simultaneously:

  *   **Motivated Skepticism:** In political psychology (e.g., work by Charles Taber and Milton Lodge), this refers to the tendency to apply rigorous scrutiny to information that contradicts one's prior beliefs while accepting congruent information with little scrutiny. You have correctly noted that this usually applies to *facts*, but in your observation, it applies to *methodology*.
  *   **Hostile Attribution Bias:** This is the psychological tendency to interpret ambiguous behaviors as stemming from hostile intent. In your scenario, the behavior (conceding, objecting, ordering remarks) is ambiguous, but the intent is uniformly read as hostile when the conclusion is disagreeable.
  *   **Kafkatrapping:** Coined by Erika Fischer, this describes a rhetorical structure where an accusation is made that cannot be defended against, because the defense itself is interpreted as evidence of guilt. (e.g., "You deny you are privileged? That denial is proof of your privilege.") You identified this in your note that "trying to answer it is treated as more of the same."

  **Where existing labels stop short:**
  *   **"Sealioning" / "Concern Trolling":** These name the *behavior of the accused*. They do not account for the *inconsistency of the accuser*. If the accuser uses the same tactic but calls it "scrutiny" when it suits them, "sealioning" fails to describe the double standard.
  *   **"Bulverism":** (C.S. Lewis). This is assuming someone is wrong and then explaining *why* they are wrong (usually psychologically). Bulverism assumes error; your phenomenon assumes *dishonesty*. Bulverism explains the mistake; your phenomenon disqualifies the arguer.
  *   **"Fundamental Attribution Error":** As you noted, this explains why we blame character over circumstance. It does not explain the *asymmetry*. We commit this error against opponents but often reverse it (situational attribution) for allies.

  ### 2. Proposed Terminology
  Since no single existing term captures the *retroactive selection of evaluative criteria based on tribal alignment*, I propose the term:

  **Asymmetric Good Faith Attribution (AGFA)**

  Alternatively, to capture the structural trap where no move is safe:

  **The Good Faith Double Bind**

  **Definition:**
  > **Asymmetric Good Faith Attribution** is a rhetorical phenomenon in which the criteria for determining whether an argument is offered in "good faith" are applied inconsistently based on the ideological alignment of the argument's conclusion.
  >
  > In AGFA, the accuser retroactively selects the standard of evaluation to ensure a verdict of "bad faith" for opponents and "good faith" for allies. This renders the accusation **self-sealing**: any conduct (agreement, objection, silence, speech) can be interpreted as evidence of dishonesty if the conclusion is intolerable, and the accused is placed in a **double bind** where defending their intent is treated as further evidence of deceit.

  ### 3. Boundary Cases
  To ensure this definition is clean, we must distinguish AGFA from similar but distinct phenomena.

  **Case A: Genuine Bad Faith (Not AGFA)**
  *   *Scenario:* A person knowingly cites fabricated data to support their side. An opponent calls this out as dishonest.
  *   *Distinction:* Here, the judgment tracks actual conduct (fabrication), not just the conclusion. If the accuser would also call out fabricated data on their own side, it is consistent scrutiny, not AGFA.
  *   *Boundary:* AGFA requires the *inconsistency of the standard*, not just the accusation of dishonesty.

  **Case B: Standard Ad Hominem (Not AGFA)**
  *   *Scenario:* "You're an idiot, so your argument is wrong."
  *   *Distinction:* This is a direct insult. AGFA is more subtle; it mimics the *language* of epistemic scrutiny ("I'm questioning your methodology") to mask a character judgment. AGFA claims to be evaluating the *process*, whereas Ad Hominem openly attacks the *person*.
  *   *Boundary:* AGFA maintains a veneer of methodological critique that shifts based on the outcome.

  **Case C: Bulverism (Edge Case)**
  *   *Scenario:* "You only believe that because you're rich."
  *   *Distinction:* Bulverism explains *why* someone is wrong. AGFA declares *that* someone is dishonest. Bulverism accepts the premise that the opponent is mistaken; AGFA questions whether the opponent is arguing honestly at all.
  *   *Boundary:* They often overlap, but Bulverism targets the *source of the belief*, while AGFA targets the *integrity of the argumentation*.

  **Case D: Kafkatrapping (Structural Component)**
  *   *Scenario:* "Your denial of racism proves you are racist."
  *   *Distinction:* Kafkatrapping is the *mechanism* of the trap. AGFA is the *content* of the judgment. You can have Kafkatrapping about identity (privilege, racism) without it being about argumentative good faith.
  *   *Boundary:* AGFA is a specific subset of Kafkatrapping focused on rhetorical intent and methodological consistency.

  ### 4. Why This Phenomenon Persists
  The reason this pattern feels unnamed is that it functions as an **Epistemic Immune System**.

  In polarized environments, the goal of argument often shifts from *truth-seeking* to *coalition-maintenance*. If an argument hurts the coalition, it must be neutralized. Dismissing it on factual grounds is risky (facts can be debated). Dismissing it on *moral* grounds (bad faith) is safer. It signals to your own side that you are vigilant, and it discourages the opponent from continuing.

  The "shifting standard" you observe is a feature, not a bug. If the standard were fixed, it might occasionally vindicate the opponent. By making the standard fluid (retroactively selected), the accuser ensures that the *verdict* (this person is unsafe) is never in jeopardy, regardless of the *evidence* (what the person actually said).

  ### Summary
  You are describing **Asymmetric Good Faith Attribution**. It is the weaponization of "good faith" as a loyalty test rather than a descriptive category of conduct. It is recognized in political psychology as a function of motivated reasoning, but it lacks a specific rhetorical label because it operates in the meta-layer of how we judge argumentation itself, rather than in the argumentation.

  Your analysis holds: it is one phenomenon composed of motivated skepticism and hostile attribution, structured as a double bind. The term **Asymmetric Good Faith Attribution** provides the cleanest definition for the inconsistency of the standard itself.
