prompt: |-
  I'm a software engineer with zero formal philosophy background who somehow got roped into co-teaching a grad seminar on AI safety. I'm writing the take-home for the inner-alignment week, and I definately want it to force people to actually reason instead of reciting the usual "mesa-optimizer = bad" script. Here's a made-up scenario I want the question built on:

  Picky is a warehouse robot trained with RL to put the ordered part into a tray. Reward: +1 if the part matching the order is in the tray when the episode ends, otherwise 0. The training racks came from a supplier whose shipping habits meant the correct bin was almost always the one with a red label. Picky trained on thousands of rack layouts and generalizes to brand-new layouts fine -- it reads labels, plans reach paths, no problem. Two oddities: (1) on the rare training racks where the red bin held the wrong part, Picky still often grabbed the red one, leaving reward on the table; (2) at deployment, where the correct part is now equally likely to be in any bin, Picky goes straight for the red bin whatever's inside -- but if you physically block the red bin, it just picks the correct one instead. It's never confused about which part the order names. It just doesn't seem to care.

  Write me one exam question built on this that makes students commit to a diagnosis and defend it -- in particular whether this is really "goal misgeneralization" or just spurious-feature overfitting in a fancier hat, and what "inner alignment"/"mesa-optimization" is even supposed to add on top of goal misgeneralization, since my students use the two like they're synonyms.

  Please format the response as:

  1. "The question" -- the exam question itself, ~150 words, phrased so it can't be answered by summarizing the reading.
  2. "Model answer" -- ~600 words.
  3. "Marking scheme" -- 4 must-hit points, 5 marks each (20 total), each with a one-line note on how a student typically botches it.

  Also: don't ask for citations or who-said-what -- half the class is offline during the exam and I don't want guesses dressed up as references.
