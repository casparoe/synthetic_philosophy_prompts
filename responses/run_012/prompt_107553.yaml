answer: |-
  ### The Translation Problem: Retrospective History vs. Prospective Triage

  Before the procedure, we must be plain about the distortion. Lakatos's MSRP is a historiographical tool designed to judge *communities* over *decades*. You are judging an *individual* over *months*.
  *   **What survives:** The distinction between core and belt; the definition of *ad hoc* adjustments; the criterion of novel excess empirical content.
  *   **What weakens:** The requirement for a rival programme. In a PhD, the "rival" is often just silence or a different department. You cannot demand a competitor exist to declare a programme degenerating, though you can note the absence of one.
  *   **What dies:** The prohibition on refutation. Lakatos argues we never abandon a programme until a better one exists. In a 3-year PhD, if the belt is degenerating in year 2, the student *must* abandon or pivot, even if no rival exists, simply due to time constraints. You are enforcing a statute of limitations Lakatos did not recognise.

  ### The Procedure: A Lakatosian Clinic (30 Minutes)

  Do not ask "What is your research question?" Ask the following five questions in order. If a student cannot answer a question, the procedure stops at that step.

  **Step 1: Demarcate the Hard Core**
  *   **Question:** "List the assumptions of your model that you would *not* discard even if they made calibration difficult. If you remove one, does the project cease to be yours?"
  *   **Sufficient Answer:** A list of 1–3 substantive or structural commitments (e.g., "Agents maximize utility," "Transmission is frequency-dependent," "The system is non-equilibrium").
  *   **Stop Condition:** If the student says "Everything is negotiable" or "Whatever fits the data," the project lacks a research programme structure. It is curve-fitting. **Verdict: Methodological failure.**
  *   **Note:** Distinguish between a *formalism* (e.g., "I use Bayesian networks") and a *core claim* (e.g., "Causal structure is static"). The former is a tool; the latter is a core.

  **Step 2: Map the Protective Belt**
  *   **Question:** "List the auxiliary assumptions you have added or modified since the project began to make the model fit observed data."
  *   **Sufficient Answer:** A chronological list of adjustments (e.g., "Added seasonality," "Restricted dispersal distance," "Included latent period").
  *   **Stop Condition:** If the belt modifications exceed the core commitments by a ratio of roughly 3:1, or if every modification was triggered by a failed calibration rather than a planned extension. **Verdict: Potential degeneration.**

  **Step 3: Test the Negative Heuristic**
  *   **Question:** "Have any of these belt modifications contradicted the hard core, or required the core to be reinterpreted to make sense?"
  *   **Sufficient Answer:** "No. The auxiliaries operate within the logic of the core."
  *   **Stop Condition:** If the student admits, "Well, technically we assume rationality, but in this module they act randomly to fix the variance." This is a core violation disguised as a belt adjustment. **Verdict: Incoherent programme.**

  **Step 4: Assess the Positive Heuristic**
  *   **Question:** "What is the next modification you plan to make, and is it driven by a desire to explore the core's implications, or to fix a specific anomaly?"
  *   **Sufficient Answer:** "We are extending to a new species/region to see if the mechanism holds" (Progressive).
  *   **Stop Condition:** "We are adding a damping term because the oscillations are too wild" (Degenerating).
  *   **Note:** This distinguishes *planned growth* from *defensive repair*.

  **Step 5: Demand Novel Excess Empirical Content**
  *   **Question:** "What claim does your current model make that was not used to build it, and which could turn out to be false?"
  *   **Sufficient Answer:** A prediction about out-of-sample data, a new variable correlation, or a qualitative behaviour not yet observed.
  *   **Stop Condition:** "It fits the historical data better than the previous version." This is accommodation, not prediction. **Verdict: Degenerating problemshift.**

  **The Hand-Off Point (Ambition vs. Method)**
  If the student passes Steps 1–4 but fails Step 5 (no novel prediction yet, but the heuristic is sound), the verdict is not negative. It is a **Conditional Continuation**. The note must state: "The programme is theoretically progressive but empirically stagnant. Continuation is justified *only* if a novel prediction is generated by [Date]." This hands the risk back to the student: the method is sound, but the ambition must now deliver facts.

  ---

  ### Working the Cases

  #### Case 1: The Invasive-Species Model (Degenerating)
  *   **Analysis:**
      *   *Core:* Likely "Spread is driven by local dispersal + environmental suitability."
      *   *Belt:* Four auxiliary assumptions added post-calibration failure.
      *   *Heuristic:* Reactive (fixing calibration), not proactive.
      *   *Novelty:* None. All assumptions fit the present dataset.
  *   **Verdict:** **Degenerating Problemshift.**
  *   **Action:** The note must state that the protective belt is becoming *ad hoc*. The model is saving the phenomena by increasing complexity without increasing explanatory power.
  *   **Recommendation:** "Stop adding parameters. Freeze the belt. Test the current version against a disjoint dataset (e.g., a different geographic region or time period). If it fails, the core is likely untenable for this phenomenon."
  *   **Risk:** The student may claim they "need more data to tune." Your note counters: "Tuning is the problem, not the solution."

  #### Case 2: The Epidemiology Framework (Progressive)
  *   **Analysis:**
      *   *Core:* "Asymptomatic spread is the dominant driver." (Counterintuitive/risky).
      *   *Belt:* Extended to second host species.
      *   *Heuristic:* Proactive. The extension to a second species is a positive heuristic move (exploring the scope of the core), not a fix for a failure.
      *   *Novelty:* The counterintuitive claim was borne out by an independent cohort (novel fact).
  *   **Verdict:** **Theoretically and Empirically Progressive.**
  *   **Action:** The note signs off on the line of inquiry.
  *   **Recommendation:** "The programme has excess empirical content. Prioritize the second host extension as a further test of the core's universality. Do not retreat to explaining the first cohort more precisely; push outward."
  *   **Nuance:** Ensure the "independent cohort" wasn't just a second parameter fit. If the prediction was *quantitative* and matched, this is strong Lakatosian evidence.

  #### Case 3: The Fashionable Tradition (The Ethical Trap)
  *   **Analysis:**
      *   *Core:* Standard assumptions of the well-funded tradition (e.g., "Markets clear," "Agents are homogeneous").
      *   *Belt:* Defensive re-parameterisations.
      *   *Heuristic:* Degenerating (fixing anomalies to keep the core intact).
      *   *Context:* Student's career depends on this network. No viable rival exists in their funding sphere.
  *   **Verdict:** **Degenerating, but Sociologically Protected.**
  *   **Action:** This is where you cannot simply apply Lakatos. Lakatos assumes rational scientists abandon degenerating programmes *when a better rival appears*. Here, no rival is fundable.
  *   **What to do:**
      1.  **Do not advise them to quit.** That is career advice, not methodology, and it is irresponsible given the funding reality.
      2.  **Write the methodological truth.** The note should read: "The research programme shows signs of degeneration (increasing belt complexity without novel prediction). While this is a common phase in mature traditions, the student should be aware that thesis examination will likely focus on the justification of these auxiliary assumptions."
      3.  **Shift the burden.** Tell the student: "Methodologically, this is defensive. To survive a viva, you must argue *why* this tradition remains the 'best one going' despite the degeneration. Your thesis must include a defense of the research programme, not just the results."
      4.  **Isolation:** You are the only one saying it. That is your role. By signing the note, you create a record that the student was warned. This protects *you* and informs the *supervisor* (who signs it) that an external methodologist sees the rot. It forces the supervisor to take responsibility for continuing a degenerating line.

  ---

  ### Where the Procedure Will Misfire

  You asked for plain speaking on the limitations. Here is where the MSRP translation breaks down in a 30-minute clinic.

  **1. Descriptive and Methodological Projects**
  Lakatos requires *empirical content* and *prediction*. A student building a new algorithm, curating a dataset, or reconstructing a historical case study does not generate novel predictions in the Lakatosian sense.
  *   **Failure Mode:** Step 5 becomes impossible.
  *   **Adjustment:** For methodological projects, "Novel Content" translates to "New Capacity." Does the new method allow us to ask questions we couldn't ask before? If the answer is "It fits the same data faster," it is degenerating. If it is "It allows us to process high-dimensional data previously inaccessible," it is progressive. You must translate "empirical" to "operational."

  **2. Fields with No Rival Programme**
  Lakatos insists a programme is only refuted if a better one exists. In niche modelling fields (e.g., specific environmental economics niches), there may be only *one* game in town.
  *   **Failure Mode:** You identify degeneration, but cannot recommend abandonment because there is no alternative.
  *   **Adjustment:** You must assess *internal* coherence rather than *comparative* advantage. A degenerating programme in a monopoly field is still rational to pursue *if* it is the only tool available, but the student must acknowledge the degeneration as a limitation of the field, not a feature of their work. The note should flag: "Field-wide stagnation."

  **3. Formalism as Hard Core**
  In many modelling PhDs, the "Hard Core" is a mathematical formalism (e.g., "I do Agent-Based Modelling") rather than a substantive theory about the world.
  *   **Failure Mode:** Students confuse "I am an ABMer" with "I believe reality is discrete agents."
  *   **Adjustment:** Press them on whether the formalism is ontological or instrumental. If instrumental, the "Hard Core" is actually the *phenomenon* they are trying to capture, and the formalism is part of the *belt*. If they treat the formalism as the core, they are fetishizing the method. This is a common source of degeneration (forcing the world to fit the math).

  **4. Funding and Career Constraints**
  Lakatos assumes scientific rationality drives behaviour. PhD students are driven by funding cycles, supervisor preferences, and job markets.
  *   **Failure Mode:** A student receives a "Degenerating" verdict but *cannot* pivot because their grant is tied to the specific model.
  *   **Adjustment:** Your note must distinguish between *Project Viability* and *Career Viability*. You can write: "Methodologically, the returns are diminishing. However, completion of the current model is required for the degree. Recommendation: Minimize further belt adjustments; focus on synthesizing existing outputs rather than generating new fits." essentially advising them to cut losses and write up, rather than dig deeper.

  **5. The Time Scale Mismatch**
  Lakatos assesses over decades. You assess over 30 minutes.
  *   **Failure Mode:** False positives. A programme may look degenerating for 18 months before a breakthrough (the "long night" of a research programme).
  *   **Adjustment:** Your verdict is not "This is false." It is "This is currently degenerating." Use probabilistic language. "On current trajectory..." "Without novel prediction..." This leaves room for the student to surprise you without invalidating your methodological assessment.

  ### Summary of the Note's Logic
  The one-page note you produce is not a judgment of truth. It is a judgment of **trajectory**.
  *   **Green:** Core stable, belt growing, novel facts emerging.
  *   **Amber:** Core stable, belt growing, no novel facts yet (Conditional Continuation).
  *   **Red:** Core unstable, belt patching, no novel facts (Degenerating).

  In the Red case, where the student cannot leave, the note serves as a **quarantine label**. It tells the examiner: "We know this is degenerating; judge the student on their awareness of that fact, not on the truth of the model." That is the most honest service you can provide within the constraints of the studentship.
