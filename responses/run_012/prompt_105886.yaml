answer: |-
  This is a sharp dissection. You are correct that the slogan is a compression algorithm hiding several distinct empirical and normative premises. When your forum opponents deploy it against the "rule by the rich" objection, they are usually smuggling in a specific empirical claim about market manipulation costs while pretending it's a normative feature.

  Here is the menu of claims hidden inside "Vote on values, bet on beliefs," evaluated for truth, defensibility, and relevance to the plutocracy objection.

  ### The Menu of Claims

  **(a) The Technocratic Separation (Ends vs. Means)**
  *   **Claim:** Governance can be cleanly divided into selecting a utility function (values) and selecting the policy that maximizes it (beliefs).
  *   **Verdict:** **Trivial but Misleading.**
  *   **Analysis:** In theory, yes; in practice, no. Most political conflict is not "we agree on GDP, disagree on how to get it." It is "we disagree on whether GDP is the metric." By forcing the "value vote" to happen *before* the policy bet, the system hardcodes a specific metric (e.g., GDP, QALYs). Whoever defines that metric holds the real power. This reading does not address plutocracy; it just moves the locus of power to the constitutional stage where the metric is defined.

  **(b) The Value-Belief Independence Thesis**
  *   **Claim:** Values can be defined independently of beliefs about how the world works.
  *   **Verdict:** **False.**
  *   **Analysis:** Values are often belief-dependent. "I value freedom" implies a belief about what constitutes coercion. "I value equality" implies a belief about what is mutable (outcome vs. opportunity). If you vote on a welfare metric (e.g., "National Happiness"), you are implicitly voting on a sociological theory of what causes happiness. You cannot separate the *what* from the *how* cleanly enough to insulate values from the influence of those who control the belief-formation mechanism.

  **(c) The Skin-in-the-Game Epistemology**
  *   **Claim:** Requiring financial bets forces participants to reveal true probabilities rather than cheap talk or signaling.
  *   **Verdict:** **Substantive and Defensible (with caveats).**
  *   **Analysis:** This is the strongest epistemic argument for futarchy. Markets *do* aggregate dispersed information better than voting. However, this claim only proves markets are *accurate*, not that they are *democratic*. If the rich have 100x the capital, they can sustain incorrect positions longer than the truth can sustain itself (the "Keynesian beauty contest" problem). Accuracy does not equal legitimacy.

  **(d) The Causal Identification Claim**
  *   **Claim:** The markets will price $P(Outcome | Policy)$ (counterfactuals) rather than $P(Outcome | Correlation)$.
  *   **Verdict:** **Technically False (as usually implemented).**
  *   **Analysis:** Standard prediction markets price conditionals ("If Trump wins, stocks go up"). Futarchy requires *decision markets* ("If we *make* Trump win, stocks go up"). Distinguishing correlation from causation in a market requires extremely specific contract design and often external oracle intervention. If the market prices correlations, special interests can engineer policies that correlate with good metrics without causing them (Goodhart's Law). This is a massive vulnerability to manipulation by capital.

  **(e) The Exogeneity of Preferences**
  *   **Claim:** Voters' values remain fixed and exogenous while the betting on beliefs occurs.
  *   **Verdict:** **False.**
  *   **Analysis:** Preferences are endogenous to policy outcomes and information. If the "betting class" (elites/capital) controls the information environment (via market signaling or media ownership linked to market positions), they can shift the "value vote" in the next cycle. Furthermore, if a policy passes based on a market bet, the resulting reality changes what voters value next time. The feedback loop is not sealed.

  **(f) The Normative Legitimacy Shield**
  *   **Claim:** It is morally acceptable for capital to determine *facts* (beliefs) as long as capital does not determine *goals* (values).
  *   **Verdict:** **Normative Assertion (Not an Argument).**
  *   **Analysis:** This is what your opponents are *actually* asserting. They are claiming that plutocracy over *epistemology* is fine, provided plutocracy over *teleology* is blocked. This is a controversial ethical stance, not a mechanical feature. Many would argue that controlling the definition of "truth" or "efficacy" is a more potent form of power than voting on abstract goals.

  ---

  ### The Missing Load-Bearing Claim
  There is one reading you missed, which is the actual empirical shield Hansonians use against the "rule by the rich" objection.

  **(g) The Manipulation Cost Asymmetry**
  *   **Claim:** It is cheaper to buy a vote (influence values) than it is to manipulate a deep prediction market (influence beliefs).
  *   **Verdict:** **Contingent/Empirical.**
  *   **Analysis:** This is the real argument. The claim is that a wealthy actor can bribe voters to change the welfare metric, but it is prohibitively expensive to sustain a false price in a liquid, global decision market against arbitrageurs.
  *   **Counter-Argument:** This assumes liquid markets and rational arbitrageurs. In governance, the "market" for policy outcomes is thin, illiquid, and long-term. A billionaire doesn't need to move the *global* market; they only need to move the specific contract governing the policy they want. If the cap on the market is lower than the value of the policy to the billionaire, they *become* the market.

  ---

  ### How to Use This in the Thread

  When they drop the slogan to block the plutocracy objection, they are relying on a conflation of **(c)** and **(f)**. They assume that because money makes beliefs *accurate* (c), it is therefore legitimate for money to decide beliefs (f).

  **The Counter-Move:**
  Point out that the slogan assumes the "Value Vote" defines a perfect, ungameable metric.
  1.  **Attack (a) & (b):** "Who defines the welfare metric? That definition *is* a belief about what matters. If the rich can't bet on policy, they will lobby to define the metric in a way that makes their preferred policies the obvious winner."
  2.  **Attack (d) & (g):** "Decision markets are not truth machines; they are liquidity machines. If I have enough money, I can make a bad policy look like it has a high expected value relative to your metric. 'Vote on values' doesn't stop me from gaming the measurement of those values."

  **The One-Liner:**
  "'Vote on values, bet on beliefs' only prevents plutocracy if the 'value metric' is ungameable and the 'belief market' is deeper than the wealth of the largest special interest. Neither is true in governance."
