answer: |-
  This is one of the most significant debates in contemporary philosophy of action and ethics. Your intuition—that moral judgment is "contaminating" a purely descriptive psychological assessment—is the **classical view** (often called the *Bias Hypothesis* or *Performance Error Hypothesis*). However, since Joshua Knobe published his findings in 2003, a substantial portion of the literature has argued for the **Competence Hypothesis** (or *Deep View*), which suggests that moral considerations are not a bug in the system, but a feature of the concept itself.

  Here is an analysis of how to handle this in your reasoning, the symmetry of the effect, the stability of the concept, and what is likely actually going on.

  ### 1. How to "Quarantine" Moral Attitudes (The Classical Procedure)

  If you accept the premise that intentionality *ought* to be a purely descriptive matter of psychological states (the Standard Model of Action), you can adopt a procedural checklist to minimize the Knobe effect in your own reasoning. This aligns with the **Causal Theory of Action**.

  **The Procedure:**
  1.  **Isolate the Plan:** Identify the agent's primary goal (the *end*) and the steps taken to achieve it (the *means*).
  2.  **Identify the Side Effect:** Distinguish outcomes that were *instrumental* to the plan from those that were merely *foreseen*.
  3.  **Assess Volition:** Ask: "If the agent could have achieved the primary goal *without* this side effect, would they have chosen that path?"
      *   If **Yes**: The side effect was not intended (it was merely foreseen).
      *   If **No**: The side effect might be constitutive of the intention.
  4.  **Ignore Valence:** Consciously strip the outcome of "good" or "bad" labels. Replace "harming the environment" with "altering ecosystem state X" and "helping the environment" with "altering ecosystem state Y."

  **The Limitation:**
  If the Competence Hypothesis is correct, this procedure is not "correcting a bias"; it is **changing the subject**. You would be analyzing *psychological intentionality* (what was in the head) rather than *moral intentionality* (what the agent is responsible for). In law and ethics, we often care about the latter.

  ### 2. Is the Distortion Symmetric?

  The effect is **asymmetric**, and this asymmetry is crucial for understanding the mechanism.

  *   **Blame drives the effect:** The jump in intentionality attribution is much sharper for negative side effects (harm) than the drop for positive ones (help).
  *   **The "Praise" Nuance:** Later studies showed that if the agent expresses *enthusiasm* about the helpful side effect, intentionality ratings for help go up. However, in the standard "indifferent chairman" case, the asymmetry holds.
  *   **Normative Expectations:** Recent work suggests the effect tracks **normative deviation**.
      *   If the norm is "do not harm," violating it makes the action salient and intentional.
      *   If the norm is "profit is primary," helping the environment is a surplus; it doesn't register as part of the agency in the same way.
      *   If you flip the norms (e.g., a Soviet chairman whose duty is to help the workers but harms them to increase efficiency), the effect can sometimes shift or diminish, suggesting it is about **violating expectations** rather than simple good/bad valence.

  **Conclusion on Symmetry:** It is not a simple seesaw. Moral *condemnation* has a stronger pull on intentionality ascriptions than moral *praise*. This suggests the concept of "intentional" is more tightly coupled with **blameworthiness** than praiseworthiness.

  ### 3. Should We Replace the Concept with a Stipulative Definition?

  This depends on your goal.

  **Option A: Precision (Law and Policy)**
  If you need rigorous accountability (e.g., criminal law), you should **abandon the folk concept** of "intentional."
  *   **Recommendation:** Use the **Model Penal Code (MPC)** hierarchy of *mens rea*:
      1.  **Purpose:** Conscious object to engage in conduct or cause a result.
      2.  **Knowledge:** Aware that it is practically certain to cause the result.
      3.  **Recklessness:** Conscious disregard of a substantial risk.
      4.  **Negligence:** Should be aware of a substantial risk.
  *   In the Knobe scenario, the Chairman acts with **Knowledge** in both cases. The MPC does not distinguish between the harm and help cases regarding *mens rea*. Using this stipulative definition eliminates the Knobe effect entirely.

  **Option B: Understanding Social Cognition**
  If you are analyzing how people hold each other responsible in everyday life, you **cannot replace the concept**.
  *   The Knobe effect reveals that the folk concept of intentional action is not a scientific category of psychology; it is a **tool for moral negotiation**.
  *   Replacing it with a descriptive definition would render it useless for its actual social function (assigning praise and blame).

  ### 4. What Is *Actually* Going On? (Theoretical Explanations)

  There are three dominant explanations in the literature. Your seminar likely touched on the first, but the others are equally viable.

  #### A. The Bias View (Your Current View)
  *   **Theory:** People have a coherent, descriptive concept of intentionality (Belief + Desire). However, strong moral emotions (outrage at harm) trigger a heuristic that overrides the careful cognitive processing.
  *   **Implication:** The judgment in the Harm case is a **performance error**. The Help case is the baseline truth.
  *   **Proponents:** Early critics, some cognitive psychologists.

  #### B. The Competence / Deep View (Knobe, Pettit, etc.)
  *   **Theory:** Moral considerations are **constitutive** of the concept. To call an action "intentional" is not just to describe a mental state; it is to judge that the agent stands in a specific relationship to the norm.
  *   **Mechanism:** When the Chairman harms the environment, he shows a lack of regard for the norm. This attitude makes the side effect part of his "practical identity." When he helps, he is indifferent; the good outcome is not part of his agency because he didn't *endorse* the norm that makes it good.
  *   **Implication:** There is no contamination. The ordinary concept of intentional action is inherently normative. You cannot "quarantine" the morality without destroying the concept.

  #### C. The Pragmatic / Conversational View
  *   **Theory:** The effect is linguistic, not conceptual.
  *   **Mechanism:** In the Help case, saying "he intentionally helped" implies he *wanted* to help. Since he was indifferent, saying "intentionally" is misleading conversationally, even if technically true. In the Harm case, we need to mark the harm as significant to explain why we are blaming him, so we use "intentionally" to signal relevance.
  *   **Implication:** People might believe the psychological states are the same, but they use the word "intentional" differently to convey different information about responsibility.

  ### Summary and Recommendation

  **Is your reasoning contaminated?**
  If you define intentionality strictly as "aimed at," then yes, your intuition is being swayed by moral valence. To correct this, strictly apply the **Model Penal Code** distinctions (Purpose vs. Knowledge).

  **Is the folk concept broken?**
  Not necessarily. The Knobe Effect suggests that the folk concept of "intentional" is not a psychological descriptor but a **responsibility tracker**. It answers "Is this agent a proper target for blame?" rather than "What neural states preceded this movement?"

  **How to proceed in your seminar:**
  1.  **Acknowledge the Bias:** Admit that for legal or scientific precision, the folk usage is unreliable.
  2.  **Challenge the "Ought":** Question the premise that intentionality *ought* to be purely descriptive. Argue that agency is inherently normative; we cannot separate "what I did" from "what I am responsible for."
  3.  **Propose the Distinction:** Suggest that we need two concepts:
      *   **Intentional$_{psych}$:** (Descriptive) Did the agent represent this outcome as a goal?
      *   **Intentional$_{moral}$:** (Normative) Is the agent fully accountable for this outcome?
      *   The Knobe effect shows that ordinary language conflates these two, while philosophy and law often need to separate them.

  The Knobe Effect does not prove people are bad at logic; it proves that our concept of human action is inextricably linked to our concept of moral responsibility.
