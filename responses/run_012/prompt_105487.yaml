  10. **Final Polish:** Check citations (Knobe, Pettit, Nadelhoffer, Holton) implicitly or explicitly to ground the claims. Ensure the distinction between *intentional action* and *intentional side effect* is clear. (The prompt focuses on side effects).

  *(Self-Correction Note)*: I should be careful not to validate the user's premise ("ought to be a purely descriptive matter") as undisputed fact. That is the *classical* view, but the Knobe effect challenges exactly that. I need to explain *why* that premise is under fire.

