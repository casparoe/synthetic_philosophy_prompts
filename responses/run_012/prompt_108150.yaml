prompt: |-
  I'm about halfway through a novel and I've hit a snag I can't write my way out of. My narrator is a composer in her late fifties who, a few years before the book opens, signed one of those advance directives refusing certain treatments if she ever loses capacity; by the time we meet her she's lost it, she's cheerful as anything, and she now wants the exact opposite of what she asked for. I've been reading around the bioethics of all this to keep myself honest, and everyone seems to argue from one case — the happy repudiator, the woman who signed while depressed, the patient who wants treatment the family doesn't — and then generalise shamelessly. Before I read any more of it I want the full spec first. So: what would a theory of the authority of the earlier self actually have to deliver? Give me the desiderata — the cases it has to get right, the distinctions it can't collapse, the things we know about people that it can't contradict — with the consideration behind each one, and tell me which are non-negotiable and which are just the house style of a particular camp. I'm especially interested in the line between treating the directive as testimony about what she would have wanted and treating it as an exercise of authority that survives her change of mind, because I think my whole book turns on it and I dont know which side I'm on.

  And since the thing keeps spilling out of the hospital, I'd be grateful if the list stretched to the non-medical versions of the same problem: a directive about a manuscript, a letter to be opened after death, a promise made to a future self who never turned up, instructions about how one's papers or one's body are to be handled. I suspect the medical case is a special case of something much bigger, and that the desiderata shift when the earlier self is dead rather than merely absent — if you think that's wrong, say why, because I'd rather know now than in chapter nine. What I'm really after is the part everyone skips: which single requirement knocks out the most popular answers, and whether there's a pair of requirements on the list that can't both be satisfied, in which case the list itself is the interesting result and I'll take it as the moral of the book. Don't bother scoring the theories against it, I'll do that myself with my sister, who's a nurse and has no patience for any of it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A novelist halfway through a book.
      *   **Protagonist:** Female composer, late 50s, lost capacity (dementia/cognitive decline), cheerful now, but previously signed an advance directive refusing treatment she now seems to want (or at least, her current state contradicts the spirit of the directive).
      *   **Problem:** The author is stuck on the bioethics/philosophy of personal identity and authority of the past self vs. present self.
      *   **Task:** Provide a "full spec" (desiderata) for a theory of the authority of the earlier self.
      *   **Requirements:**
          *   List cases it must get right.
          *   List distinctions it must maintain.
          *   List facts about people it can't contradict.
          *   Explain the consideration behind each.
          *   Distinguish between non-negotiable (universal) and "house style" (camp-specific).
          *   Address the specific tension: *Testimony* (evidence of past wishes) vs. *Authority* (binding command).
          *   Extend to non-medical cases (manuscripts, letters, promises to future self, estate/body handling).
          *   Address the Dead vs. Absent distinction.
          *   **Crucial:** Identify the "killer constraint" (which requirement knocks out popular answers) and any "impossible pairs" (incompatible desiderata).
          *   **Constraint:** Do *not* score theories against the list. The user and their nurse sister will do that.
      *   **Tone:** Intellectual, precise, respectful of the complexity, avoiding preachiness, suitable for a writer looking for structural integrity in their theme.

  2.  **Deconstruct the Core Philosophical Problem:**
      *   This is the problem of *Diachronic Autonomy* (authority over time) and *Personal Identity* (is the demented self the same person as the competent self?).
      *   Key tension: Precedent Autonomy (Dworkin) vs. Critical Interests vs. Experiential Interests (Dresser/Robertson).
      *   Key tension: Ulysses Contracts (binding future self) vs. Right to Change Mind.

  3.  **Drafting the Desiderata (The "Spec"):**
      *   I need to categorize these. Let's try: *Identity*, *Authority*, *Well-being*, *Social/Relational*.
      *   *Identity:* Must account for psychological continuity without demanding perfect memory. Must acknowledge the "happy repudiator" problem.
      *   *Authority:* Must distinguish between *instructions* (do X) and *values* (be Y). Must handle the "dead hand" problem.
      *   *Well-being:* Must balance past critical interests (life narrative) with present experiential interests (current happiness).
      *   *Social:* Must account for the burden on caregivers/family.

  4.  **Addressing the Specific Tension (Testimony vs. Authority):**
      *   *Testimony:* The directive is a guess about what I'd want. If I change my mind (even non-competently), the guess is wrong.
      *   *Authority:* The directive is a law I passed for my future self. Like a constitution.
      *   *Desideratum:* A theory must explain *why* we bind the future self. Is it protection or projection?

  5.  **Extending to Non-Medical Cases:**
      *   Manuscripts (Kafka vs. Brod).
      *   Letters after death (privacy vs. history).
      *   Promises to future self (diet, saving money).
      *   *Key Difference:* Death creates a hard boundary. Dementia creates a fuzzy boundary. In death, the "present self" doesn't exist to suffer. In dementia, the "present self" exists and feels.

  6.  **Identifying the "Killer Constraint" and "Impossible Pairs":**
      *   *Killer Constraint:* The **Non-Identity/Continuity Constraint**. If the person *now* is psychologically discontinuous enough, why does the person *then* have rights over them? But if they are discontinuous, who is suffering?
      *   *Impossible Pair:* **Respect for Past Autonomy** vs. **Protection of Present Well-being**. You often cannot maximize both. If the past self said "no feeding tube" but the present self is happy and wants to eat, honoring the past kills the present's happiness. Honoring the present violates the past's explicit will.
      *   *Another Impossible Pair:* **The Authority of the Dead** vs. **The Needs of the Living**. (e.g., burning the manuscripts).

  7.  **Refining the Output Structure:**
      *   Introduction: Acknowledge the depth of the problem.
      *   Section 1: The Core Tension (Testimony vs. Authority).
      *   Section 2: The Desiderata (categorized).
      *   Section 3: Non-Medical Extensions (Dead vs. Absent).
      *   Section 4: The Killer Constraint & Impossible Pairs (The "Moral of the Book").
      *   Tone Check: Keep it analytical but evocative for a writer. Avoid jargon where possible, or define it.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I score the theories? *Check:* No, I must avoid saying "Dworkin fails here." I must say "A theory must account for X."
      *   *Critique:* Did I address the nurse sister aspect? *Check:* Keep the medical reality grounded (suffering is real, not just theoretical).
      *   *Critique:* Is the distinction between Dead and Absent clear? *Check:* Need to emphasize that the "present self" in dementia has interests, whereas the "dead self" does not.
      *   *Critique:* The user asked for "Non-negotiable" vs. "House Style." *Check:* I need to explicitly label these.
      *   *Critique:* The "Killer Constraint." *Check:* Make sure this is punchy. The "Psychological Continuity Threshold" is usually where theories break.

  9.  **Final Polish:**
      *   Ensure the distinction between *Critical Interests* (narrative integrity) and *Experiential Interests* (moment-to-moment pleasure) is clear, as this is central to the composer character.
      *   Make sure the "Manuscript" analogy lands. (Kafka is the classic case).
      *   Ensure the "Testimony vs. Authority" distinction is woven through.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a profound structural problem for a novel because it isn't just a medical question; it is a question of personal identity and the metaphysics of time. You are asking for the specifications of a theory of *Diachronic Autonomy* (authority over time).

  Most bioethics literature tries to solve the problem to reach a policy conclusion. You need the unsolved tension to drive the narrative. Below is the spec you asked for. It is divided into the Core Tension, the Desiderata (categorized by Non-Negotiable vs. House Style), the Non-Medical Extension, and finally, the Impossible Pairs that might form the moral center of your book.

  ### I. The Core Tension: Testimony vs. Authority

  You identified the hinge of your book: Is the advance directive **Testimony** or **Authority**?

  1.  **As Testimony:** The directive is evidence. It is the competent self's best prediction of what the incompetent self would want.
      *   *Implication:* If the current self (the "happy repudiator") clearly demonstrates different preferences, the testimony is proven false. The directive should be voided because the data has changed.
      *   *Risk:* It treats the past self as a fallible advisor rather than a decision-maker. It privileges the "experiential" present over the "narrative" past.
  2.  **As Authority:** The directive is a command. It is an exercise of liberty that binds the future, similar to a law or a contract.
      *   *Implication:* The current self's desires are irrelevant, just as a citizen's current desire to break a law doesn't invalidate the law. The past self had the only moment of true agency; the present self is merely the beneficiary (or victim) of that agency.
      *   *Risk:* It treats the current self as a vessel or a child, potentially violating their current well-being for the sake of a "narrative integrity" they can no longer comprehend.

  **Desideratum:** A viable theory must explicitly state which of these it is. It cannot slide between them. If it is authority, it must explain *why* authority survives the death of the personality that wielded it. If it is testimony, it must explain *how much* contrary evidence from the present self is required to overturn it.

  ---

  ### II. The Desiderata (The Spec)

  Here are the requirements a theory must meet. I have distinguished between **Non-Negotiable** (constraints based on reality/logic that any theory must face) and **House Style** (philosophical commitments that vary by camp).

  #### A. The Identity Constraints (Who is she?)
  1.  **Non-Negotiable: The Psychological Continuity Gradient.**
      *   *Consideration:* People do not lose capacity all at once. There is a spectrum from "fully competent" to "fully incapacitated."
      *   *Requirement:* The theory cannot rely on a binary switch (Competent/Incompetent). It must account for the grey zone where the narrator might understand the music but not the medicine, or remember the melody but not the lyric.
  2.  **House Style: The "Same Person" Threshold.**
      *   *Consideration:* Is the cheerful woman in the care home the *same person* as the composer who signed the directive?
      *   *Requirement:* A Lockean theory (memory-based) says "No." A Biological theory (body-based) says "Yes."
      *   *Constraint:* The theory must declare whether personal identity is required for moral authority. If they are different people, does the past person have the right to dictate the death of the future person?

  #### B. The Interest Constraints (What is at stake?)
  3.  **Non-Negotiable: The Distinction Between Critical and Experiential Interests.**
      *   *Consideration:* This is Ronald Dworkin's crucial distinction. *Experiential interests* are feeling happy, comfortable, not in pain (the cheerful narrator). *Critical interests* are about the integrity of one's life story, dignity, and values (the composer who didn't want to live as a shell).
      *   *Requirement:* The theory must explain how to weigh these against each other. Can a surplus of present happiness outweigh a violation of past dignity?
  4.  **Non-Negotiable: The Reality of Suffering.**
      *   *Consideration:* Your sister the nurse knows this: suffering is physical and immediate. "Dignity" is abstract.
      *   *Requirement:* The theory cannot treat the present self's distress as merely "confusion." If the treatment causes pain *now*, that counts morally, regardless of what was signed *then*.

  #### C. The Authority Constraints (Why listen?)
  5.  **House Style: The Ulysses Constraint.**
      *   *Consideration:* Ulysses tied himself to the mast to resist the Sirens. He authorized his crew to ignore his future screams.
      *   *Requirement:* Does the theory allow for "pre-commitment"? Some camps say autonomy includes the right to bind your future self. Others say autonomy requires the *current* ability to revoke, so binding is impossible.
  6.  **Non-Negotiable: The Burden on Third Parties.**
      *   *Consideration:* Directives are executed by others (doctors, family, executors).
      *   *Requirement:* The theory must account for the moral distress of the agent. If the directive forces the daughter to starve a mother who is smiling and asking for food, the theory must account for the daughter's moral injury, not just the mother's rights.

  #### D. The Epistemic Constraints (What do we know?)
  7.  **Non-Negotiable: The Opacity of the Past Self.**
      *   *Consideration:* We rarely know *why* the past self signed. Was it fear of pain? Fear of burdening family? A philosophical stance?
      *   *Requirement:* The theory must handle ambiguity. If the directive says "no extraordinary measures" but the situation is ambiguous, does the benefit of the doubt go to life (present self) or death (past self)?
  8.  **House Style: The Substituted Judgment vs. Best Interest Standard.**
      *   *Consideration:* Do we do what *she would have chosen* (Substituted Judgment) or what is *best for her now* (Best Interest)?
      *   *Requirement:* The theory must pick a lane. You cannot claim to honor her wishes while simultaneously overriding them for her own good.

  ---

  ### III. The Non-Medical Extension (Dead vs. Absent)

  You suspect the medical case is a special version of a larger problem. You are correct. The desiderata shift significantly when the earlier self is **Dead** rather than **Absent** (demented).

  **The Shift:**
  When the self is dead, there is no *present* subject to experience harm. When the self is demented, there is a *present* subject who can suffer.

  **Desiderata for the "Dead Hand" (Manuscripts, Letters, Estate):**
  1.  **The Non-Existence Constraint:** A dead person has no interests. Therefore, authority over papers/body cannot be based on the *dead person's well-being*. It must be based on:
      *   *Property Rights:* It was theirs to dispose of.
      *   *Promise Keeping:* The living owe a duty to the dead.
      *   *Social Utility:* We want living people to feel secure that their wishes will be respected.
  2.  **The "Kafka" Distinction:**
      *   *Case:* Kafka asked Brod to burn his manuscripts. Brod refused. Literature gained; Kafka's wish was violated.
      *   *Requirement:* A theory must decide if the value of the work (to the world) can override the authority of the creator. In medicine, the "value to the world" rarely overrides the patient's directive. In art, it often does. Why?
  3.  **The Privacy vs. History Tension:**
      *   *Case:* A letter to be opened after death.
      *   *Requirement:* The theory must distinguish between instructions that *protect* (privacy) and instructions that *control* (reputation). Controlling reputation from the grave is generally viewed with more skepticism than protecting privacy.

  **The Crucial Difference for your Book:**
  In the medical case, honoring the past self might *hurt* the present self. In the manuscript case, honoring the past self (burning the book) hurts *no one* (except perhaps the reading public).
  *   **Desideratum:** A unified theory must explain why we are more willing to override the dead (publish the book) than the demented (force the feeding tube), or vice versa. Usually, we are more willing to override the dead because they cannot suffer the override.

  ---

  ### IV. The Killer Constraint & The Impossible Pairs

  You asked for the single requirement that knocks out the most popular answers, and the pair of requirements that cannot both be satisfied. This is likely where your novel's tension lies.

  #### The Killer Constraint: The Psychological Discontinuity Problem
  **Requirement:** *If the present self is psychologically discontinuous with the past self (different memories, different personality, different values), the theory must explain why the past self has jurisdiction over the present self's body.*

  *   **Why it knocks out popular answers:**
      *   It knocks out **Simple Autonomy**: If autonomy is about self-rule, and the "self" has changed, the old ruler has no authority over the new kingdom.
      *   It knocks out **Simple Utilitarianism**: If the present self is happy, maximizing happiness suggests ignoring the directive. But this feels like a betrayal of the person who planned the life.
      *   It forces the theory to rely on **Narrative Identity**: The only thing linking the two is the *body* and the *story*. The theory must argue that the *story* is more important than the *character*. Many people find this unintuitive.

  #### The Impossible Pairs (The Moral of the Book)
  Here are two pairs of desiderata that are logically incompatible. A theory must sacrifice one to save the other. Your novel might demonstrate that sacrificing either leads to tragedy.

  **Pair 1: Integrity of the Life Narrative vs. Protection of the Present Subject**
  *   **A:** We must honor the coherent life plan of the competent adult (The Composer).
  *   **B:** We must not harm the innocent, happy being that currently exists (The Patient).
  *   **The Conflict:** In your specific case, you cannot do both. To honor the Composer is to let the Patient die (or refuse treatment). To protect the Patient is to humiliate the Composer's life work and values.
  *   **Novelistic Implication:** If you choose A, the book is a tragedy of betrayal (the world betrayed the artist). If you choose B, the book is a tragedy of loss (the artist was erased by her own biology).

  **Pair 2: The Right to Bind vs. The Right to Revoke**
  *   **A:** Autonomy includes the right to make binding commitments for the future (otherwise promises and contracts are meaningless).
  *   **B:** Autonomy requires the capacity to change one's mind in response to new circumstances (otherwise we are slaves).
  *   **The Conflict:** The "New Circumstance" here is the loss of the capacity to understand the commitment. The past self said, "Even if I think I want to live, I don't." The present self says, "I want to live."
  *   **Novelistic Implication:** This is the Ulysses problem. Did the Composer tie herself to the mast to save herself, or did she build a coffin for a stranger?

  ### Summary for the Writer
  If you want the "moral of the book" to emerge from the philosophy:

  The **Killer Constraint** is that **we are not one person, but a sequence.** The directive assumes we are one. The care requires us to treat the current one as real.

  The **Impossible Pair** is **Dignity vs. Happiness.**
  *   The Directive protects *Dignity* (as defined by the past).
  *   The Care protects *Happiness* (as experienced by the present).
  *   In your specific plot, they are mutually exclusive.

  Most bioethics tries to smooth this over. Your novel should probably insist that the smoothness is a lie. The nurse sister will likely tell you that in the ward, "Happiness" usually wins because it is visible, while "Dignity" is invisible. But the Composer knows that "Dignity" is the only thing that makes the music matter.

  That is the snag you cannot write your way out of, because it is not a plot hole. It is the human condition.
