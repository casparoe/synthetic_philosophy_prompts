prompt: |-
  I'm in a theory of knowledge class and my study partner and I cooked up an arguement last night that I can't get out of, and the professor isn't answering his email.

  (1) On Nozick's tracking theory, knowledge requires sensitivity: if the thing you believe were false, you wouldn't believe it — and you're supposed to test that with your method of forming the belief held fixed.
  (2) Say I believe I have hands, on the basis of seeing and feeling them.
  (3) For that belief to be false I'd have to not have hands. Two ways that could go: I lost my hands in an accident, or I got envatted this morning at six — no body, brain in a vat, a computer feeding me exactly the experiences I'm having right now, and every memory from before six a.m. fully intact.
  (4) The second world agrees with the actual world about my whole life up to this morning, and about everything I've ever seen and done. The first world rewrites my entire history. So the second world is the closer one.
  (5) In that second world I'm having the same experiences, so I still believe I have hands.
  (6) So in the nearest world where I have no hands, I still believe I have hands, and my belief isn't sensitive.
  (7) By tracking, I don't know I have hands.
  (8) Nothing here turns on hands. For any perceptual belief of mine there's a six a.m. envatting that leaves my past and my experience alone and makes the belief false, so tracking says I have no perceptual knowledge at all.
  (9) But the whole selling point of tracking, the reason we spent two weeks on it, is that it gets to say I know I have hands while I don't know I'm not a brain in a vat. So the theory proves way more than it's meant to and eats itself.

  Which step is doing the damage? I'd give up almost anything rather than (7) — I'm not handing over "I know I have hands" — so tell me what I'd be paying. And if you say step (4) is the bad one, I need to know what makes one world nearer than another, because if that's a dial you turn until the theory says what you already wanted it to say, I don't see that the theory has any content. Same worry if the fix is somewhere in how you're allowed to describe my method — trusting my experience versus looking at my hands — why is that not just the same dial again?

  Lead with your bottom line in the first sentence, then give the reasoning. No preamble, and don't restate the question.
