answer: |-
  Here is the exam package, designed to force students off the "social construction" autopilot and into the mechanics of validity.

  ### The Exam Question

  **Question 4 (25 Marks)**
  Ian Hacking argues that psychiatric classifications are "interactive kinds": the classification causes people to change their behavior because they come to understand themselves through the label (uptake). Contemporary algorithmic psychiatry (e.g., suicide risk prediction models) also generates feedback loops, but often without the subject's awareness or self-interpretation; the system changes because institutions react to the score, not because the patient adopts the identity.

  Is the mechanism of "self-interpretation" essential to the philosophical problem of looping effects, or are algorithmic feedback loops fundamentally the same kind of instability (e.g., Goodhart's Law)? Argue for a position. Then, explain what your view implies for the **epistemic validity** of using such tools to gatekeep access to treatment.

  *(Time suggested: 60 minutes. Closed book. No citations required, but positions must be named accurately.)*

  ***

  ### Model Answer (Approx. 700 words)

  The distinction between Hackingian looping effects and algorithmic feedback loops is not merely semantic; it marks a divergence in *how* validity is undermined. While both phenomena demonstrate that measuring a system changes the system, Hacking's interactive kinds rely on **semantic uptake**, whereas algorithmic loops rely on **structural incentive**. Arguing that these are the same phenomenon obscures the specific threat each poses to clinical validity. I argue that self-interpretation is essential to Hacking's specific claim, and conflating it with algorithmic performativity leads to errors in how we assess the stability of diagnostic categories.

  Hacking's thesis rests on the capacity of the classified subject to become a "moving target." When a patient is classified as, for example, "borderline," they gain access to a narrative. They may accept, resist, or modify their behavior in light of this description. The loop is closed through consciousness and agency. The category changes the *person*, and thus the extension of the kind shifts. This is an ontological instability: the thing being measured is fundamentally altered by the measurement because the measurement is meaningful to the thing.

  In contrast, algorithmic feedback in psychiatry often operates via Goodhart's Law: "When a measure becomes a target, it ceases to be a good measure." If a hospital deploys a suicide risk model and administrators penalize wards with high-risk scores, clinicians may game the input data to lower the score, or the model may simply drift as the population adapts to avoid the label (e.g., hiding symptoms). Here, the subject does not need to understand the label "high risk." They only need to respond to the incentives the label produces (e.g., increased surveillance, restricted liberty). The loop is closed through **causal pressure**, not semantic uptake.

  If we treat these as identical, we misdiagnose the validity problem. If the loop is Hackingian (requiring uptake), the validity threat is **conceptual drift**. The diagnosis no longer picks out a stable natural kind because the meaning of the diagnosis changes the population. To fix this, we might need dynamic classifications that evolve with the culture. However, if the loop is Algorithmic (incentive-based), the validity threat is **metric corruption**. The underlying pathology may remain stable, but the proxy measure (the score) decouples from the reality it tracks. To fix this, we do not need new concepts; we need better obfuscation of the metric or alignment of incentives.

  This distinction critically impacts the epistemic validity of gatekeeping treatment. If we assume all loops are Hackingian, we might worry that giving a patient a risk score makes them more suicidal by altering their identity. This suggests we should withhold labels to preserve validity. But if the loop is primarily algorithmic/incentive-based, withholding the label from the *patient* does not stop the loop, because the *institution* reacts to the score. The validity erosion comes from the system's reaction, not the patient's self-conception.

  Therefore, self-interpretation is not a red herring; it determines the locus of the instability. In Hackingian loops, the instability is internal to the subject. In algorithmic loops, it is external, in the system's response to the data. For gatekeeping, this implies that algorithmic tools are dangerous not because they change who the patient *is*, but because they change how the system *sees* the patient, often decoupling care from need. A suicide risk model that triggers mandatory hospitalization creates an incentive to hide risk. The model becomes valid only for those who cannot game it, introducing a selection bias that is distinct from Hacking's identity shift.

  Ultimately, while both loops undermine the static validity of a category, they require different remedies. Hackingian loops require a flexible, humble nosology that acknowledges its role in shaping subjects. Algorithmic loops require adversarial testing and incentive alignment. Conflating the two leads to the mistake of thinking that hiding a diagnosis from a patient prevents feedback effects, when in reality, the institutional reaction to the diagnosis is often the stronger destabilizing force. Validity in algorithmic psychiatry depends less on patient uptake and more on insulating the measure from the incentives it creates.

  ***

  ### Marking Scheme (25 Marks Total)

  **1. Accurate Definition of Hacking's Mechanism (5 Marks)**
  *   **Full Marks:** Explicitly identifies "uptake," "self-interpretation," or "agency" as the engine of Hacking's loop. Notes that the *person* changes.
  *   **Mediocre Miss:** Defines looping effects generally as "labels change people" without specifying the *mechanism* of consciousness/identity. Treats it as generic social construction.

  **2. Accurate Definition of Algorithmic/Goodhart Mechanism (5 Marks)**
  *   **Full Marks:** Identifies that algorithmic loops function via incentives, institutional reaction, or metric optimization (Goodhart's Law) without requiring subject awareness.
  *   **Mediocre Miss:** Describes ML loops as "computers changing things" or conflates them entirely with Hacking's view without noting the lack of required uptake.

  **3. Argument on Distinctness (The "Wedge") (5 Marks)**
  *   **Full Marks:** Takes a clear stance on whether these are the same or different phenomena. (Either is fine, provided it is argued). Ideally notes that one is ontological/semantic and the other is epistemic/metric.
  *   **Mediocre Miss:** Sits on the fence ("both are loops so both are similar") or fails to compare the mechanisms directly.

  **4. Implication for Validity/Gatekeeping (5 Marks)**
  *   **Full Marks:** Connects the mechanism to the *validity* of the tool. Explains how the specific type of loop undermines the tool's ability to measure truth or allocate care correctly.
  *   **Mediocre Miss:** Discusses validity vaguely ("it makes it less true") or focuses on ethics (stigma) rather than epistemic validity/measurement stability.

  **5. Structure and Clarity (5 Marks)**
  *   **Full Marks:** Clear thesis, logical progression, distinct paragraphs for Hacking, ML, and Implications.
  *   **Mediocre Miss:** Disorganized, stream-of-consciousness, or fails to address the second half of the prompt (gatekeeping).

  ***

  ### Differentiation: Separating the 20 from the 24

  To get a **20/25 (Competent A)**, a student must hit all five criteria above clearly. They will distinguish the mechanisms and apply them to validity.

  To get a **24/25 (Outstanding A+)**, the answer must do one of the following **synthesis moves**:

  1.  **Second-Order Uptake:** The student argues that algorithmic loops *become* Hackingian loops if the clinician interprets the score *for* the patient (e.g., "The model says you're high risk, so you must be"). This shows they understand that uptake can be mediated, bridging the two concepts rather than just contrasting them.
  2.  **Normative Consequence:** The student distinguishes the validity loss not just technically, but normatively. E.g., "Hackingian loops threaten autonomy (changing the self); Algorithmic loops threaten justice (gaming the system excludes the vulnerable)."
  3.  **Refining Validity:** The student distinguishes between *predictive validity* (does it guess right?) and *construct validity* (is it measuring a real thing?). They argue algorithmic loops destroy predictive validity (model drift), while Hackingian loops destroy construct validity (the kind no longer exists).

  **Why this works:** The mediocre student summarizes the prompt's dichotomy. The top student complicates the dichotomy or deepens the vocabulary of validity beyond "it stops working." This allows you to grade quickly based on the presence of that specific insight.
