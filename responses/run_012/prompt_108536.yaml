  1. If a zygote splits into twins, does your view imply the original person ceased to exist when the split occurred? Or do both twins count as the original zygote's successor?
  **Follow-up:** Then at what exact developmental stage does the necessity of origin lock in without arbitrariness?

  2. Is the essential origin the physical cells themselves or just the genetic material they carry, given that sperm tails are discarded and mitochondria come solely from the egg?
  **Follow-up:** Then what individuates the egg itself apart from the causal chain that produced it, since physically identical eggs could theoretically exist?

  3. If an egg is individuated by the meiosis that produced it, does your view entail that your grandmother's existence was also essential to yours?
  **Follow-up:** Does this cascade stop anywhere, or must the entire causal history of the universe be essential to any single person's existence?

  4. In mitochondrial replacement therapy, the nuclear DNA comes from one egg but the cellular machinery from another; does the resulting child originate from the donor egg or the recipient egg?
  **Follow-up:** If you pick based on DNA, haven't you conceded that the physical egg cell itself isn't the essential factor?

  5. When two embryos fuse to form a chimera, does the resulting person have two distinct origins, or does your view imply this person could not have existed?
  **Follow-up:** If it's a new individual, at what moment did the two original potential persons cease to be possible?

  6. Since people's intuitions shift depending on whether you describe the case as sharing DNA or sharing the act of conception, why trust the intuition that grounds your view?
  **Follow-up:** What theoretical virtue saves the intuition from being merely a psychological artifact of how we describe identity?

  7. If a counterpart theorist can paraphrase every claim you make without positing transworld identity, what substantive work is your necessity claim actually doing?
  **Follow-up:** But if no observable difference follows from that modal fact, isn't the dispute purely metaphysical rather than factual?

  8. If the same sperm and egg fuse thirty seconds later than they actually did, is that still you, or does the precise timing enter into your essential origin?
  **Follow-up:** Then how much variation in the causal chain is permitted before you cease to exist, and isn't that boundary unavoidably vague?

  9. Could your parents have had a different child who was qualitatively identical to you in every physical and psychological respect?
  **Follow-up:** If not, doesn't that render your distinctness from that sibling a brute fact with no explanatory basis?

  10. What is the most counterintuitive consequence of your view that you accept anyway, and why is the theory worth that cost?
  **Follow-up:** Does accepting that consequence make your view less explanatory than a rival theory that avoids it?
