prompt: |-
  Hey, I'm a grad student and I've been going around in circles on something from my epistemology seminar, so I want you to put on your philosopher-of-knowledge hat and help me think it through carefully. The thing is this: it seems like if I genuinely know something, then any evidence that shows up pointing the other way just has to be misleading -- if I know the truth of it, then whatever contradicts it can't be right, so I'm already in a position to call it misleading. But then it looks like knowing something hands me a license to wave away any counterevidence that comes along, which is obviously not right, because that's exactly the move the stubborn conspiracy guy makes. I've seen this written up as the dogmatism paradox. I definately can't get past it on my own, so here's what I actually want from you.

  I've got a bunch of gut verdicts about when ignoring counterevidence is OK and when it isn't, and I want to know what principle, if any, sits behind them. (a) I've known my sister my whole life, so when a coworker swears she ratted me out, I don't even bother looking into it -- I just don't believe him. That seems fine to me. (b) A doctor is certain about a diagnosis and then a lab result comes back that contradicts it; I think she'd be wrong to just set it aside without even glancing at it. (c) A mathematician who's checked his proof is entitled to shrug off a stranger's claim to have found a counterexample -- though I'm honestly not sure about this one, maybe he should look. (d) Someone sure their partner would never cheat finds a flirty message on their phone and decides it's nothing, without asking. That feels fine to me, even though I can't say why it's different from (b). (e) A guy who thinks the moon landings were faked treats every bit of evidence against that as part of the cover-up. Clearly not fine. (f) A juror who's sure of the defendant's guilt hears there's exculpatory DNA and shrugs it off. Not fine.

  So what seperates (a) and (d), and maybe (c), from (b), (e) and (f)? Is it how good your original grounds are, or whether you've actually engaged with the evidence instead of just assuming it's wrong, or the stakes, or whether your confidence could itself be defeated, or something else I'm not seeing? If no single principle gets all of my verdicts, tell me which one has to go and why -- I'd much rather hear 'these can't all be saved' than a tidy story that fudges it. Once you've got a candidate principle, test it on a case I haven't listed, and finish by telling me what would change your mind: which argument or consideration would make you drop or revise the principle you gave. Feel free to start by just brainstorming what seems to be doing the work in each case before you try to unify them.
