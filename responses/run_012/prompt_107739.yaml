answer: |-
  Here is the diagnosis.

  **The Diagnosis**
  You are close, but the disagreement is not primarily about whether decision theory predicts behavior or advises agents. Both sides agree decision theory is normative—it tells you what you *should* do to achieve your goals. The stalemate is actually a foundational clash over **which dependencies count as real leverage.**

  The two sides are operating with incompatible metaphysics of counterfactuals.
  *   **Side A (The Acausalists)** believes that logical correlation is a form of influence. If my decision algorithm and the blackmailer's prediction algorithm are logically linked, changing my output *logically necessitates* a different output from them, even across time or simulation boundaries. To them, ignoring this is like ignoring a causal lever; it's leaving utility on the table.
  *   **Side B (The Causalists)** believes that only physical causation counts as leverage. They argue that once the blackmailer has made their decision (to simulate or not), your current action cannot change it. Paying is a sunk cost fallacy on a cosmic scale. To them, Side A is conflating "evidence" with "cause."

  This is why the debate feels like talking past each other. Side A is arguing about **logical inevitability**, while Side B is arguing about **physical controllability**. They aren't disagreeing about the math of the scenario; they are disagreeing about which math maps to reality.

  **Testing Your Hypothesis**
  Your guess—that this is about what decision theory is *for*—is insightful but slightly misaligned. If the debate were about predicting vs. advising, one side would say, "Humans won't pay," and the other would say, "Humans should pay." Instead, both sides say, "A rational agent should [X]."

  The real friction is about **reflective stability**.
  *   Side A argues that if you ignore acausal threats, you are unstable: before entering the scenario, you would wish to precommit to paying, so your failure to pay now is a failure of rationality.
  *   Side B argues that if you accept acausal threats, you are unstable: you become a target for infinite exploitation (Pascal's Mugging), ensuring you lose in the long run.

  So, the disagreement is about which form of instability is worse: leaving money on the table (Side B's view of Side A) or opening yourself to infinite blackmail (Side A's view of Side B).

  **The Surrogate Goal Clarification**
  You remembered the "surrogate goal" trick correctly, but here is the precise mechanism. The problem with acausal blackmail is that the blackmailer targets your actual values (e.g., "I will torture copies of you"). If you care about that, you are vulnerable.

  A surrogate goal means you modify your utility function to care about something arbitrary and secure (e.g., "the 10,000th digit of pi") instead of your natural values, while keeping your external behavior normal. The blackmailer, simulating you, sees you care about the digit. They threaten the digit. You don't care about the digit. The threat fails. The trick relies on the assumption that the blackmailer cannot distinguish your *real* goals from your *surrogate* goals within the simulation. It is a defense mechanism that admits the threat is coherent but tries to break the correlation required to exploit it.

  **Why Nobody Has Moved**
  The debate is stalled because it is **empirically underdetermined**. We cannot build the simulator. We cannot create the acausal link. We are arguing about the rules of a game we cannot play.
  *   We don't know if logical correlations exert "force" in our universe.
  *   We don't know if sufficiently advanced AI will actually run these simulations.
  *   We don't know if personal identity survives copying in a way that makes the threat meaningful.

  Without an empirical test, proponents retreat to intuition pumps. Side A uses "Newcomb's Problem" intuitions (you should one-box). Side B uses "Bomb in the Box" intuitions (don't pay the extortionist). Since both intuitions are robust in different contexts, neither side yields.

  **What Would Count as Progress**
  Progress would not look like one side convincing the other via argument. It would look like one of three things:
  1.  **Formal Stability Proof:** A mathematical demonstration that one approach leads to guaranteed ruin (e.g., proving that accepting acausal threats necessarily leads to infinite expected loss regardless of the prior) while the other remains stable.
  2.  **Operationalization:** A way to test acausal trade in a limited domain. For example, if two isolated AI agents could successfully coordinate without communication channels in a way that rules out causal leakage, that would shift the burden of proof.
  3.  **Consensus on Priors:** Agreement on how to weight the probability of being in a simulation vs. base reality. If the community agreed the probability is negligible, the debate dissolves (Side B wins by default). If agreed high, Side B must address the risk.

  **Confidence and Uncertainty**
  I am **85% confident** in this diagnosis. The core of the stalemate is definitely the definition of valid counterfactuals (logical vs. causal) and the resulting reflective stability arguments.

  I am **least sure** about the potential for "Operationalization." It is possible that acausal trade is inherently untestable by definition, meaning progress can only come through philosophical consensus on priors, which is historically very difficult to achieve. If the phenomenon is truly acausal, we may never have data to settle the metaphysics.
