answer: |-
  1. **The Central Distinction (Burden vs. Marker)**
  The distinction risks being gerrymandered because it lacks a decision procedure for hybrid cases. You acknowledge in Section 1 that tips allocate costs (burden) but in Section 6 you treat them primarily as such, ignoring the respect component (marker). Consider the "door holding" example: holding a door allocates the burden of waiting (burden) but also signals recognition (marker). If I hold the door too long, I impose a burden (hurrying them); if I don't hold it, I deny a marker. Your account forces a binary classification where the phenomenon is mixed. If a convention is both, does the burden rule trump the marker rule? In Section 6 (Tipping), you imply yes, but you do not argue for this hierarchy. Without a rule for hybrids, the distinction looks like it is sorted post hoc to yield the desired obligation strength. You need to state explicitly whether burden functions always override marker functions, or how to weigh them when they conflict.

  2. **Loss vs. Denied-Gain (Section 2) and Aggregation (Section 4)**
  **Section 2:** The line between loss and denied gain relies on a contestable baseline. You claim marker violations leave the party "no worse off than they were before you acted." This assumes the baseline is "no interaction." But in established social contexts, the baseline is "expected interaction." If a greeting is expected, receiving none causes psychological distress (a loss), not merely a denied gain. This premise works only if the reader accepts that emotional slighting is not a "loss" in the morally relevant sense. Many ethicists would contest this. If feeling contempted is a harm, marker violations impose losses, and your distinction collapses.

  **Section 4:** This section should be cut. You flag it as your least confident passage, and it is philosophically expensive. The claim that trivial losses do not aggregate because "the aggregate has no bearer" contradicts standard accounts of dispersed harm (e.g., pollution, voting). Defending this requires solving a version of the non-identity problem or defending a strict individualism about harm that many philosophers reject. Removing it strengthens the paper by eliminating a vulnerable flank. You can acknowledge the objection in Section 3 without dedicating a section to a solution you distrust. The loss is a complete answer to the aggregation objection; the gain is avoiding a defense that may undermine your credibility on the stronger points.

  3. **Adjustment-Cost Asymmetry (Section 5)**
  This argument risks collapsing into rule-utilitarianism unless you clarify the normative source of the obligation. You write: "The locals have built their expectations around a rule they cannot renegotiate... Your obligation is to be predictable." If the reason is purely that predictability minimizes friction or cost, this is a rule-utilitarian calculation. To make it independent work, you must frame it as a matter of fairness: the visitor imposes a coordination cost on the many to save themselves a learning cost. The obligation arises from the unfair distribution of the burden of adjustment, not merely the efficiency of predictability. Currently, the text hovers between these two justifications. If it is only efficiency, it is utilitarianism in different clothes. If it is fairness, say so explicitly.

  4. **Counterexample**
  **Case:** A visitor attends a public memorial service in a community where standing silently for ten minutes is the norm (Marker convention). The visitor sits and checks their phone throughout.
  **Account's Prediction:** This is a marker convention. The visitor owes legibility; the host owes interpretive charity. The obligation is weak (reasons of non-contempt).
  **Intuition:** The visitor has committed a serious moral wrong, often judged more harshly than cutting a queue (burden). The community suffers a loss of shared meaning and collective dignity, not merely a denied gain.
  **Diagnosis:** This breaks the premise in Section 2 that marker violations do not impose losses. It demonstrates that marker conventions can protect goods (dignity, shared meaning) whose violation constitutes a significant loss to the community, even if no individual material cost is incurred. Your account cannot explain why this violation is worse than jaywalking, despite jaywalking being a burden convention.

  5. **Concluding Inversion (Section 7)**
  This reads as a reductio of the argument rather than a genuine implication. The conclusion suggests that outsiders are morally bound to follow queueing rules (which locals barely notice) but are permitted to violate deeply felt norms of respect (which locals defend heatedly). This inverts the intuitive ethics of hospitality, where respecting a host's deeply held values is usually paramount, even over minor coordination rules. If your argument implies that a visitor is more obligated to stand on the correct side of an escalator than to dress appropriately for a host's religious ceremony, the argument likely undervalues expressive harm. You should treat this inversion as a problem to be solved, not a feature to be celebrated.

  6. **Deletion**
  **Delete:** The second paragraph of Section 4 ("They do aggregate when the same party is repeatedly on the receiving end...").
  **Loss:** You lose the specific explanation for why queue-jumping is worse than jaywalking based on identity of the victim.
