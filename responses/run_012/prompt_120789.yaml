answer: |-
  This is a robust pivot. It leverages your team's specific textual and theoretical strengths while targeting a policy environment desperate for language to describe the deterioration of work. The Dean wants "impact"; in the social sciences, impact comes from providing regulators and advocates with better diagnostic categories. If you can convince a labour board that "alienation" is a measurable harm distinct from "low wages," you have impact.

  Here is the defended agenda.

  ### The Core Agenda: Three Questions, Three Years

  You should build the theme around **Question 1 (Relational Exploitation)**, **Question 2 (The Decoupling)**, and **Question 5 (The Positive Vision)**.

  **Year 1: Question 1 (The Wrongness of Exploitation) — Specifically the Relational Account**
  *   **Why Upstream:** You cannot diagnose the new economy without defining the injury. If exploitation is purely distributive (maldistribution of surplus), your platform labour scholar is stuck measuring value transfer, which leads back to the Labour Theory of Value (LTV) debates you rightly want to avoid. If exploitation is *relational* (subjection, domination, being used as a means), it becomes a political status. This clears the LTV hurdle immediately.
  *   **Tractability:** This is pure political theory and moral philosophy. Your philosophers can parse the "subjection" condition without needing economic data.
  *   **Neglect:** The distributive account dominates policy (minimum wage debates). The relational account is theoretically rich but rarely operationalized for regulation.
  *   **Impact:** Shifting the legal definition of exploitation from "underpayment" to "subjection" allows regulators to target algorithmic management even when pay is high. It gives unions a language to demand control, not just cash.

  **Year 2: Question 2 (The Decoupling) — Alienation without Exploitation, and Vice Versa**
  *   **Why Second:** Once you have the relational definition of exploitation, you test it against the phenomena your care ethicist and platform scholar study. Does the unpaid carer suffer exploitation if there is no wage relation? Does the high-paid software engineer suffer alienation if they lack control?
  *   **Tractability:** This allows your historical sociologists to map how these categories have shifted over time, while your normative theorists classify the cases. It avoids regressions; it requires case studies and conceptual mapping.
  *   **Neglect:** Orthodox Marxism assumes these travel together. Contemporary reality shows they do not. This gap is where the most novel theoretical work lies.
  *   **Impact:** This distinguishes policy solutions. If alienation exists without exploitation (e.g., in care work), wage subsidies won't fix it; you need time sovereignty or recognition. If exploitation exists without alienation (e.g., the "golden handcuffs" worker), job satisfaction surveys won't catch the abuse.

  **Year 3: Question 5 (The Abolition/Vision) — Institutionalizing Unalienated Labour**
  *   **Why Third:** Critique without construction is academically safe but politically weak. To satisfy the Dean, you must move from diagnosis to design. What institutions reduce alienation? Co-ops? Sectoral bargaining? Data trusts?
  *   **Tractability:** This is normative political theory applied to institutional design. It does not require utopian speculation, but rather the evaluation of existing experiments.
  *   **Neglect:** Critical theory is often better at tearing down than building up. A "Charter for Unalienated Work" is a tangible output.
  *   **Impact:** This provides the "ask." Unions and NGOs need policy proposals. A three-year culminating report on "Indicators of Unalienated Labour" gives regulators a metric beyond GDP or employment rates.

  ### The Overrated Question: Question 4 (Unit of Analysis)

  **Drop this as a standalone theme.**
  It is overrated because it is often a semantic proxy for ideological commitment. If you insist the unit is "Class," you ignore the isolation of the gig worker. If you insist it is the "Individual," you lose structural critique.
  **Reasoning:** Do not debate the unit in the abstract. Let the unit of analysis be determined by the specific case studies in Year 2. Sometimes the harm is inside the firm (algorithmic control); sometimes it is between firms (supply chain pressure); sometimes it is in the household (care). Making Q4 a central research question risks three years of methodological navel-gazing with no external payoff. Solve this pragmatically through the application of Q1 and Q2, not theoretically.

  ### The Missing Question: The Question of Collective Agency

  Your list assumes that if we define exploitation and alienation correctly, the path to remedy follows. It does not.
  **The Question:** *How is collective action possible when the unit of production is fragmented and the experience of work is alienated?*
  **Why it matters:** Your historical sociologists are crucial here. The old model of exploitation (factory) produced a specific kind of agency (the union). The new model (platform/care) produces fragmentation. If your centre defines the harm perfectly but cannot explain how victims organize against it, your "impact" will be limited to academic citations.
  **Integration:** Weave this into Year 2 and 3. When analyzing the "Decoupling" (Year 2), ask who has the power to fix it. When designing the "Vision" (Year 3), ensure the institutions proposed are capable of being fought for by actual workers.

  ### What to Drop First

  **Drop the Labour Theory of Value (LTV) dependency within Question 1.**
  You noted your prejudice against spending three years on whether LTV is correct. Trust that instinct. If a researcher on your team insists that exploitation *cannot* be defined without LTV, they are working on a different project.
  **Reasoning:** The LTV debate is a dead end for public impact. A regulator does not care if surplus value was mathematically extracted; they care if a worker was coerced. By framing Q1 strictly around *relational subjection* and *normative wrongness*, you make the work accessible to legal scholars, ethicists, and policymakers. You keep the Marxian lineage without the economic baggage that alienates non-specialists.

  ### Defining Progress (Three-Year Horizon)

  Progress should not be measured solely by monographs. For a Dean, progress is **conceptual adoption**.

  *   **Year 1 Output:** A working definition of "Relational Exploitation" that distinguishes it from "Low Pay."
      *   *Success Metric:* The definition is cited in a policy consultation or white paper by a labour rights NGO.
  *   **Year 2 Output:** A typology of "Decoupled Labour" (e.g., The Alienated High-Earner, The Exploited Volunteer).
      *   *Success Metric:* A workshop with trade unionists where they recognize their members' conditions in your typology.
  *   **Year 3 Output:** A set of "Institutional Indicators for Unalienated Work."
      *   *Success Metric:* A regulator or certification body expresses interest in using these indicators to audit firms (similar to Fair Trade, but for labour process, not just price).

  ### Environmental Triggers

  Be prepared to pivot the weighting of these questions based on external events:

  *   **Move Q1 Upstream if:** Major litigation regarding employee status (e.g., Uber, FedEx) hinges on the definition of "control" rather than "pay." This validates the relational approach.
  *   **Move Q5 Upstream if:** A major political party adopts "Job Quality" or "Wellbeing" as a central platform metric. This creates a demand for your "Vision."
  *   **Move Q2 Upstream if:** AI automation begins displacing cognitive labour faster than manual labour. This creates new cases of "Alienation without Exploitation" (workers who are idle but still monitored) that need immediate theorizing.

  ### Summary of Strategy

  You are building a **normative technology**. You are taking two 19th-century concepts, stripping them of their disputed economic machinery (LTV), and recalibrating them to detect harms that current labour law misses (algorithmic subjection, affective exploitation in care).

  *   **Year 1:** Define the harm (Relational Exploitation).
  *   **Year 2:** Map the harm (The Decoupling).
  *   **Year 3:** Remedy the harm (Institutional Vision).
  *   **Thread:** Collective Agency (The Missing Question).
  *   **Distraction to Avoid:** Unit of Analysis semantics and LTV verification.

  This agenda protects your philosophers from having to learn econometrics, gives your sociologists historical depth to mine, and gives your Dean a narrative of "redefining work for the 21st century." It is defensible, buildable, and potentially consequential.
