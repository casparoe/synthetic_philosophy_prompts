answer: |-
  This impasse is primarily a metaethical disagreement about the existence of agent-neutral reasons that is obscured by a verbal conflict over the definition of altruism. The Randian side grounds its position in the metaethical claim that life is the standard of value, making all reasons agent-relative; thus, they define altruism strictly as self-sacrifice to demonstrate that accepting agent-neutral reasons requires the surrender of the self. Their opponents ground their position in the metaethical claim that others generate independent moral claims, making some reasons agent-neutral; thus, they define altruism as serious regard for others to demonstrate that moral duty does not require self-destruction. Because Rand accepts non-sacrificial concern such as love, friendship, and trade as selfish while opponents accept these same phenomena as altruistic, the verbal dispute over the word "altruism" masks the substantive clash over whether the self/other dichotomy permits agent-neutral reasons. If the parties agreed on the definition, Rand would still reject the duty to serve others, and opponents would still reject the duty of self-sacrifice, proving the core conflict is metaethical rather than merely semantic or a case of answering different questions about motivation versus reason. What would count as progress is a distinction between the semantic definition of altruism and the normative validity of self-sacrifice, allowing the parties to acknowledge the verbal mismatch before engaging the substantive metaethical clash over agent-neutral reasons.
