answer: |-
  This is a critical juncture. The Free Energy Principle (FEP) literature is currently transitioning from a phase of enthusiastic expansion to one of rigorous scrutiny. For a philosophy PhD, this is the ideal moment to enter: the physics is settled enough to be analyzed, but the ontological commitments are still fluid.

  Given your constraints (foundational focus, no new data, upgrade viva imminent), I recommend you build your three-year agenda around **The System Boundary Problem (Markov Blankets)**.

  While the **Mathematical Robustness** question is theoretically more fundamental, it is a trap for a philosopher: you risk becoming a pseudo-mathematician or waiting for physicists to settle a debate you cannot adjudicate. The **Realist Vocabulary** question is too downstream; it is the symptom, not the disease. The **Normative/Descriptive** distinction is the philosophical heart, but it cannot be answered without first knowing *what* is being described.

  The **System Boundary** question is the "Goldilocks" target: it is upstream of the semantics and norms, it is tractable via conceptual analysis and toy models, and it is currently the point of greatest friction in the literature (e.g., the "arbitrariness" objection).

  Here is the proposed agenda, the defense of its ordering, and the strategic pivot points.

  ---

  ### The Dissertation Agenda: The Individuation of the Free Energy System

  **Core Thesis:** The explanatory power of the FEP stands or falls on whether Markov Blankets (MBs) identify mind-independent ontological units or merely observer-relative descriptive conveniences.

  #### Year 1: The Ontology of the Blanket (System Boundaries)
  *   **Task:** Map the criteria for MB individuation. Distinguish between *statistical* boundaries (conditional independence) and *causal/physical* boundaries (membranes, skins).
  *   **Method:** Conceptual analysis of Friston's definitions vs. biological individuation (e.g., Godfrey-Smith, Dupré). Use toy models (e.g., coupled oscillators, simple cellular automata) to test where MBs "break" or become arbitrary.
  *   **Goal:** Establish whether the FEP describes *systems* or *descriptions of systems*.

  #### Year 2: The Generality Constraint (Mathematical Robustness)
  *   **Task:** Investigate the dependence of MBs on continuous-time stochastic dynamics (Langevin equations).
  *   **Method:** Literature review of recent formal critiques (e.g., Aguilera, Da Costa, Sims). Do not attempt new proofs; instead, analyze the *assumptions* required for the derivation. Ask: If we move to discrete time or non-ergodic systems, does the boundary definition collapse?
  *   **Goal:** Determine the domain of validity for the ontology established in Year 1.

  #### Year 3: The Modal Status and Semantic Payoff (Norms & Vocabulary)
  *   **Task:** Only once the system is defined (Year 1) and the domain is secured (Year 2), address whether FEP minimization is a law (descriptive) or a condition for existence (normative), and whether "belief" is literal or metaphorical.
  *   **Method:** Synthesize findings. If boundaries are observer-relative, "belief" is instrumentalist. If boundaries are robust and the math generalizes, "belief" may be realist.
  *   **Goal:** Deliver the final philosophical verdict on the FEP's cognitive science claims.

  ---

  ### Defense of the Ordering

  I am using three criteria to order these questions: **Ontological Priority**, **Philosophical Tractability**, and **Strategic Neglect**.

  **1. Ontological Priority (Upstream vs. Downstream)**
  You cannot ascribe properties (norms, beliefs) to a subject that has not been coherently individuated.
  *   **Boundaries are Upstream:** If the Markov Blanket is arbitrary (e.g., I can draw a blanket around a rock and a patch of grass and claim they are a self-organizing system), then asking whether that system "has beliefs" is a category error. The boundary question fixes the *referent* of the theory.
  *   **Math is Upstream of Boundaries:** Technically, the math dictates the boundaries. However, for a philosopher, the *concept* of the boundary is the access point to the math. You analyze the math *through* the lens of individuation.
  *   **Vocabulary is Downstream:** Calling a state a "belief" is an interpretative layer added on top of the system's dynamics. It is the last thing to settle.

  **2. Philosophical Tractability (Texts & Toy Models)**
  *   **Boundaries (High Tractability):** This is a classic philosophy of biology problem (organism individuation) applied to a new formalism. You can use existing thought experiments (Ship of Theseus, metabolic closure) to test FEP claims without needing to derive new Fokker-Planck equations.
  *   **Math Robustness (Medium Tractability):** This is risky. However, by framing it as "What assumptions are required for the boundary to hold?" rather than "Is this theorem true?", you remain in philosophical territory.
  *   **Vocabulary (Low Tractability for *Novelty*):** This is the most crowded area. Papers on "Does FEP imply panpsychism?" or "Is it real inference?" are published monthly. It is hard to say something new here without first solving the boundary issue.

  **3. Strategic Neglect (Where the Gap Is)**
  *   **Neglected:** The **System Boundary** question is often hand-waved in FEP papers as a "modelling choice." This is a philosophical vulnerability. Proponents often slide between "MBs are real physical things" and "MBs are statistical tools" depending on which defends the theory against criticism. Exposing this slide is high-value work.
  *   **Saturated:** The **Realist Vocabulary** is over-discussed. Many philosophers have already argued that "belief" in FEP is merely *as-if*. To contribute here, you need the leverage that only a boundary analysis provides.

  ---

  ### The Pivot Question

  You asked which single question, if it went one way rather than the other, would most reorganise how the rest should be pursued.

  **The Pivot is: System Boundaries (Mind-Independent vs. Observer-Relative).**

  *   **Scenario A (Boundaries are Mind-Independent):** If you can demonstrate that Markov Blankets pick out natural kinds (similar to species or organisms), then the **Realist Vocabulary** moves up the priority list. If the system is real, its states might be real representations. The **Normative** question becomes about objective conditions for survival.
  *   **Scenario B (Boundaries are Observer-Relative):** If you demonstrate that MBs are merely statistical conveniences chosen by the modeller (instrumentalism), the project reorganizes radically. The **Realist Vocabulary** is immediately deprioritized (it becomes purely metaphorical). The **Normative** question shifts from "laws of life" to "heuristics for modelling." The **Math Robustness** question becomes less about "truth" and more about "utility."

  *Why not Math Robustness as the pivot?* If the math fails for discrete systems, the FEP is simply restricted to continuous systems. The philosophy remains the same (realism vs. instrumentalism), just applied to a smaller domain. If the *Boundary* concept fails, the *ontology* of the agent dissolves entirely, which is a deeper philosophical catastrophe.

  ---

  ### What to Deprioritize (and Why)

  **Deprioritize: Realist Vocabulary (The "Belief" Question).**

  *   **Why:** It is the "shiny object" of FEP philosophy. It is tempting to spend three years arguing whether a bacterium has "beliefs." However, this debate is currently stalled because both sides agree on the math but disagree on the semantics.
  *   **Risk:** If you focus here, you risk writing a thesis that says, "Friston says belief, I say metaphor." This is a verbal dispute unless grounded in the ontology of the system.
  *   **Strategy:** Treat vocabulary as a *dependent variable*. Your conclusion on vocabulary should be the *consequence* of your work on boundaries, not the starting point. Mention it in the introduction as the motivation, but do not let it drive the chapters.

  ---

  ### Dynamic Adjustments: Moving Items Up or Down

  Over the next two years, the following developments should trigger a re-ordering of your agenda:

  **1. Move "Math Robustness" UP if:**
  *   **Trigger:** A major formal paper (e.g., from the Friston lab or a critical group like the Complex Systems group at Sussex) claims to have solved the "ergodicity" or "solvability" issue for discrete systems.
  *   **Action:** If the math is suddenly "settled" by proponents, you must verify if the philosophical implications hold. If the math is proven *impossible* for non-continuous systems, you must move this to the front to limit the scope of your ontological claims.

  **2. Move "Realist Vocabulary" UP if:**
  *   **Trigger:** Empirical neuroscience begins using FEP-derived "belief" states as actionable clinical markers (e.g., in psychiatry) successfully.
  *   **Action:** If the vocabulary becomes *pragmatically* indispensable in medicine, the philosophical question shifts from "is it real?" to "what kind of realism does this practice commit us to?" (Pragmatic Realism).

  **3. Move "System Boundaries" DOWN (and end early) if:**
  *   **Trigger:** The FEP community formally retreats from universality claims, admitting FEP is only a modelling framework for specific neural data, not a principle of life.
  *   **Action:** If the "Universal Principle" claim is abandoned, the boundary problem dissolves into standard model-selection criteria. Your thesis would then need to pivot to a history of how this claim was marketed vs. how it is used.

  ### Summary for the Upgrade Viva

  When you face your viva, your narrative is this:
  *"The FEP claims to explain self-organizing systems. But we cannot explain how a system self-organizes until we define where the system ends and the environment begins. Current literature treats the Markov Blanket as a technical given. I argue it is the foundational ontological problem. My thesis will determine if the FEP describes agents or just models. The status of 'belief' and 'norms' will follow from that result."*

  This positions you as addressing the *foundation* rather than the *facade*, which is exactly where a philosophy of science PhD should sit.
