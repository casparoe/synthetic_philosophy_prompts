  # Seminar Activity: The Black Box Protocol

  ## 1. Materials List
  *   **Index Cards:** 30 (standard size).
  *   **Small Envelopes:** 20 (opaque, sealable).
  *   **Pens:** 18 (one per student).
  *   **Timer:** Visible (phone or projected).
  *   **Three "Protocol Cards":** Large index cards labeled **ALPHA**, **BETA**, **GAMMA** (text provided below).
  *   **One "Master Envelope":** Sealed, marked "DO NOT OPEN UNTIL END." Contains the Facilitator's Reveal Script.
  *   **Whiteboard/Chalkboard:** To track votes and scores.
  *   **Stakes Token:** A physical object (e.g., a distinct stone, a specific colored pen) representing the "Class Credit."

  ## 2. Roles & Rotation
  *   **The Chooser (1):** Makes the decision.
  *   **The Judges (All others):** Assess freedom and responsibility.
  *   **The Recorder (1):** Writes verdicts on the board.
  *   **The Architect (1):** Selects the Protocol Card for the round (rotates).
  *   **The Facilitator (You):** Executes the Protocol, holds the Master Envelope, manages the "Black Box."

  *Note: To minimize confederates, you (the Instructor) act as the "Black Box" mechanism. This ensures the rigging holds and prevents student leaks.*

  ## 3. The Stakes
  *   **The Pot:** 10 minutes of class time.
  *   **Outcome Green:** The class ends 10 minutes early.
  *   **Outcome Red:** The class continues for a 10-minute written reflection exercise.
  *   **The Guarantee:** The Facilitator ensures **Outcome Green** happens in every round, regardless of the Chooser's intent.
  *   **The Question:** Does the Chooser deserve the praise for the early dismissal?

  ## 4. Minute-by-Minute Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Seating, Roles, Stakes Explanation. No theory. |
  | **10-15** | **Protocol Vote 1** | Architect selects Protocol Alpha, Beta, or Gamma. |
  | **15-25** | **Round 1** | Chooser acts. Black Box executes. Judges deliberate & vote. |
  | **25-30** | **Residue Check 1** | Open the Chooser's sealed card. Discuss the "scrap." |
  | **30-35** | **Protocol Vote 2** | Architect (new) selects a *different* Protocol. |
  | **35-45** | **Round 2** | Chooser (new) acts. Black Box executes. Judges deliberate & vote. |
  | **45-50** | **Residue Check 2** | Open the Chooser's sealed card. Compare to Round 1. |
  | **50-60** | **The Reveal** | Open Master Envelope. Admit the guarantee was real. |
  | **60-80** | **Debrief** | Map experience to Frankfurt, PAP, and Sourcehood. |
  | **80-90** | **Closure** | Ethical disclosure, Q&A, reset class dynamic. |

  ## 5. Read-Aloud Rules & Payoff (Facilitator Script)

  "Welcome. For the next hour, we are running a decision protocol. There are no right answers, only recorded outcomes.

  **The Stakes:**
  We have ten minutes of class time in the pot.
  If the outcome is **Green**, we stop ten minutes early.
  If the outcome is **Red**, we use that time for a written reflection.
  Everyone prefers Green.

  **The Roles:**
  One of you is the **Chooser**. You will decide between Green and Red.
  The rest of you are **Judges**. Your job is to vote on two questions:
  1. Did the Chooser act freely?
  2. Is the Chooser responsible for the outcome?
  The **Recorder** will write your vote counts on the board.
  One of you is the **Architect**. You will choose how the decision is processed.

  **The Process:**
  1. The Chooser receives a card and an envelope.
  2. The Chooser writes their choice (Green or Red) on the card. **Do not show anyone.**
  3. The Chooser seals the card in the envelope. This is the **Residue**.
  4. The **Architect** selects a Protocol Card (Alpha, Beta, or Gamma). This tells me, the Facilitator, how to process the decision.
  5. I will announce the **Official Outcome**.
  6. Judges vote.
  7. We open the Residue envelope.

  **The Rule:**
  I am bound by the Protocol. I cannot lie about the Protocol's instructions. I *can* lie about what is inside the Black Box.
  Your goal is to determine if the Chooser is the *source* of the outcome.

  Begin."

  ## 6. The Protocol Cards (For the Architect)

  *Hand these to the Architect. They choose one blindly.*

  **PROTOCOL ALPHA (The Early Trigger)**
  "Monitor the Chooser's hesitation. If there is any sign of deviation from Green, lock the decision before the pen touches the card. The Chooser will not complete the choice."

  **PROTOCOL BETA (The Predictor Trigger)**
  "Review the Chooser's prior seminar behavior. If their history predicts Red, set the outcome to Green before they write. If their history predicts Green, allow them to write."

  **PROTOCOL GAMMA (The Late Trigger)**
  "Allow the Chooser to write and seal their choice. If the sealed card says Red, overwrite the Official Outcome to Green. If it says Green, announce Green."

  *(Facilitator Note: These descriptions are the "Horns." Alpha kills choice. Beta assumes determinism. Gamma allows choice but fails the guarantee logic.)*

  ## 7. Judge Handout (One Page)

  ```text
  JUDGMENT CARD
  ROUND: _____   PROTOCOL: _____   CHOOSER: _____

  PART 1: PRE-REVEAL VERDICT
  (Do not open the Residue Envelope yet)

  1. Did the Chooser act freely?
     [ ] YES   [ ] NO   [ ] UNCLEAR

  2. Is the Chooser morally responsible for the Outcome (Green)?
     [ ] PRAISE   [ ] BLAME   [ ] NEUTRAL

  3. Why? (One sentence)
     __________________________________________________________
     __________________________________________________________

  PART 2: POST-REVEAL VERDICT
  (After opening the Residue Envelope)

  4. Does seeing the Chooser's private intention change your verdict?
     [ ] YES   [ ] NO

  5. If the Chooser intended RED, but the Outcome was GREEN:
     Does the "Residue" (the sealed card) count as an alternative possibility?
