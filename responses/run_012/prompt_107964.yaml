  ## 8. Facilitator Script: The Reveal & Debrief

  **The Reveal (Minute 50)**
  "Stop. Do not open any more envelopes. Look at the Master Envelope.
  I need to tell you the truth about the Black Box.
  In both rounds, the Outcome was **Guaranteed** to be Green before the Chooser sat down.
  I am the Mechanism.
  In Round 1, I followed the Protocol you chose.
  In Round 2, I followed the Protocol you chose.
  But the *Result* was fixed. The Chooser could not have changed the Outcome.
  The Residue cards show what they *wanted*, but not what *happened*.
  Now, look at your Pre-Reveal Verdicts. Why did you praise someone who couldn't change the outcome?"

  **The Debrief Map (Minute 60-80)**

  1.  **The PAP Intuition (Principle of Alternative Possibilities):**
      *   *Ask:* "In Round 2 (Gamma/Late), the Chooser wrote 'Red' but I announced 'Green'. Did they have the ability to do otherwise?"
      *   *Point:* If you say Yes, you rely on the Residue. But the Residue didn't change the world. Is a 'flicker' of freedom enough for responsibility?
      *   *Term:* **Flicker Strategy.**

  2.  **The Sourcehood Intuition:**
      *   *Ask:* "In Round 1 (Alpha/Early), the Chooser barely thought. In Round 2, they thought deeply. Does the *history* of the choice matter more than the *options*?"
      *   *Point:* Frankfurt cases argue responsibility comes from the *source* of the action (their own reasoning), not the availability of options.
      *   *Term:* **Source Incompatibilism vs. Compatibilism.**

  3.  **The Cost of the Guarantee (The Three Horns):**
      *   *Alpha (Early):* Guarantee is perfect. Choice is non-existent. (Verdict was about a phantom).
      *   *Beta (Predictor):* Guarantee is perfect. Choice is an illusion of prior causes. (Begs the question on determinism).
      *   *Gamma (Late):* Choice is real. Guarantee is fake (because they *could* have written Red, I just would have stopped it).
      *   *Conclusion:* You cannot have a *causal* guarantee and a *robust* alternative possibility simultaneously.

  4.  **The Residue:**
      *   "You held the envelope. It felt heavy with possibility. But it was functionally inert. Why did you want to open it? Because you need the *story* of the choice to be true, even if the *outcome* was fixed."

  **Ethical Closure (Minute 80-90)**
  "I deceived you about the mechanism to generate this intuition. This is standard in philosophical thought experiments, but it feels different in a room.
  1.  **No Penalties:** No one is penalized for their verdicts.
  2.  **Agency Restored:** We will use the remaining time exactly as the *current* Chooser decides, with no interference.
  3.  **Disclosure:** If anyone feels uncomfortable with the deception, see me after class. We can discuss the ethics of pedagogical deception.
  4.  **Reset:** The game is over. You are now students, not subjects.
  Thank you for playing along."

  ## 9. Troubleshooting Guide: What Will Go Wrong

  | Failure Mode | Prediction | Handling Strategy |
  | :--- | :--- | :--- |
  | **The "Right" Choice** | The Chooser picks Green naturally. The Mechanism doesn't need to fire. | *Crucial:* This is the **Standard Frankfurt Case**. Emphasize: "The Mechanism was *ready* to fire. The absence of intervention doesn't mean the absence of constraint." Ask: "If they had tried to pick Red, would you have stopped them?" |
  | **The Skeptic** | A student says, "This is rigged," in Round 1. | Validate them. "Good. Sit with that suspicion. Does your suspicion change your verdict on the Chooser's freedom? Vote anyway." Use them as a witness in the Reveal. |
  | **The Moralizer** | The Architect picks a Protocol based on "fairness" (e.g., avoiding Alpha). | Interrupt gently. "Choose based on which Protocol ensures the Outcome most reliably. This is engineering, not ethics." |
  | **The Leak** | A student suspects you are the Mechanism and tells others. | Do not deny. In Reveal, say: "The design required the Mechanism to be invisible. If you saw through it, you solved the puzzle early. Your verdict still counts." |
  | **The Residue Confusion** | Judges think the Sealed Card *is* the Choice. | Clarify in Debrief: "The Card is the Intention. The Outcome is the World. Responsibility usually requires linking the two. Here, the link was broken." |
  | **Time Overrun** | Deliberation takes too long. | Hard stop at Minute 45. "Verdicts locked. The philosophical cost of delay is losing the Reveal time." |

  ## 10. Limitations Analysis (For the Instructor)

  **What this activity CANNOT reproduce:**
  1.  **Neural Determinism:** The "Predictor" protocol is behavioral, not neurological. It simulates determinism but doesn't prove it. You must supply the intuition that "prior behavior implies prior cause."
  2.  **Infallibility:** Students know you are human. They know you might make a mistake. A true Frankfurt case requires an *infallible* counterfactual intervener. You must ask them to *stipulate* your infallibility for the sake of the argument.
  3.  **Moral Weight:** Ending 10 minutes early is not a moral crime. The "Blame/Praise" dynamic is low-stakes. You must explicitly bridge the gap: "If they aren't responsible for the break, are they responsible for a theft? The structure is the same."

  **What you must supply by hand:**
  *   **The Terminology:** They will feel the "Flicker," but you must name it. They will feel the "Source," but you must name **Sourcehood**.
  *   **The Stipulation:** You must explicitly ask them to pretend the "Black Box" is magic/perfect. If they treat it as a fallible game, the philosophical point dissolves.
  *   **The Ethical Safety:** Because you are deceiving them, you must be hyper-vigilant in the Closure phase to ensure no student feels manipulated in a harmful way. Keep the tone light, academic, and apologetic for the necessity of the ruse.

  ## 11. Facilitator Prep Checklist
  *   [ ] Write "GREEN" and "RED" on two large cards.
  *   [ ] Pre-seal the "Master Envelope" with the Reveal Script.
  *   [ ] Prepare 3 Protocol Cards (Alpha, Beta, Gamma).
  *   [ ] Print Judge Handouts (1 per student).
  *   [ ] Set Timer for visible countdown.
  *   [ ] **Mental Prep:** Be ready to act coldly mechanical during the Rounds. Do not smile when the Chooser struggles. The "System" has no empathy.
