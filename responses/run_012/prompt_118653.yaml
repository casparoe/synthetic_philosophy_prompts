          *   The concept of *retroactive validation*. Jim's death makes the Patusan courage real, which makes the Patna jump an anomaly rather than a definition.
          *   Metaphysics lacks "narrative weight."
      *   *Conclusion:* Summarize. The novel treats character as a project, not a property.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Am I using the terms correctly? Yes. Fink (stimulus removes power), Mask (external blocks power), Mimic (appearance without power).
