answer: |-
  Here is the menu of readings for the claim **"You can't change the past,"** broken down by philosophical category, with verdicts on their truth and whether they actually rule out time travel.

  ### 1. The Logical/Definitional Reading
  *   **The Claim:** "The past" is defined as "the set of events that actually happened." Therefore, saying "I changed the past" means "I made it the case that what happened didn't happen." This is a contradiction ($P$ and not-$P$).
  *   **Verdict:** **True by Definition (Tautology).**
  *   **Does it rule out time travel?** **No.**
  *   **Why:** This proves you can't *change* the past, but it doesn't prove you can't *visit* it. You can travel to the past and participate in events exactly as they already happened. You become part of the "what happened." This reading kills "changing" the past, but not "traveling" to it. Your roommate is conflating *travel* with *alteration*.

  ### 2. The Ontological Reading (Presentism)
  *   **The Claim:** Only the present moment exists. The past has ceased to exist; the future does not yet exist. Therefore, there is literally "nowhere" to travel to.
  *   **Verdict:** **Substantive Metaphysical Claim (Debatable).**
  *   **Does it rule out time travel?** **Yes, if true.**
  *   **Why:** If the past is ontologically gone, you can't go there. However, this is not a logical truth; it is a specific theory of time (Presentism) competing with Eternalism (Block Universe). Asserting this without argument is question-begging. General Relativity suggests a Block Universe where past, present, and future coordinates all exist equally. Your roommate is assuming Presentism is fact, not theory.

  ### 3. The Causal Reading
  *   **The Claim:** Causation only flows forward. An effect cannot precede its cause. Backward time travel requires backward causation (your arrival causes an effect in the past), which violates the laws of physics.
  *   **Verdict:** **Substantive Physical Claim (Likely False/Contingent).**
  *   **Does it rule out time travel?** **Yes, if true.**
  *   **Why:** This is an empirical claim about our universe's laws, not a logical truth. Current physics (General Relativity) allows for Closed Timelike Curves (CTCs) where causation can loop. To use this, your roommate must prove CTCs are physically impossible, not just intuitively weird.

  ### 4. The "Fixed Past" Reading (Consistency)
  *   **The Claim:** The past is fixed and immutable. If you travel there, your actions were *always* part of the past. You cannot do anything that would make the past different from what it already was.
  *   **Verdict:** **True (on a Single-Timeline model).**
  *   **Does it rule out time travel?** **No.**
  *   **Why:** This is the "Consistency Constraint." It says you can't *change* the past (Reading 1), but you can *affect* it (be part of it). If you go back, you were always there. This dissolves the Grandfather Paradox: you won't shoot him, not because you lack a gun, but because the fact that he lived proves you didn't. This allows travel but forbids *inconsistency*.

  ***

  ### The "Can/Can't" Distinction (David Lewis)
  You did not invent this. This is the central argument of philosopher David Lewis's famous 1976 paper, *"The Paradoxes of Time Travel."* It is the standard solution to the Grandfather Paradox.

  *   **The Move:** The word "can" is context-sensitive (equivocal). It means "compossible with the facts."
  *   **Sense A (Broad Facts):** Given the laws of physics, your training, and the gun in your hand, **you can** shoot your grandfather. (Compatible with local facts).
  *   **Sense B (Narrow Facts):** Given the fact that your grandfather *did not die* (because you exist), **you cannot** shoot your grandfather. (Incompatible with global facts).
  *   **The Verdict:** Both statements are true in their respective contexts. There is no contradiction.
  *   **Does it help you?** **Yes.** It shows the Grandfather Paradox is a linguistic confusion, not a proof of impossibility. It proves that a time traveler has the *ability* to do the act, but logical consistency ensures they *won't*.
  *   **Does it prove time travel impossible?** **No.** It proves time travel is logically consistent *provided* you accept you cannot change established facts.

  ***

  ### Summary for Your Argument
  1.  **Call out the Equivocation:** Ask him if he means "You can't travel to the past" or "You can't *alter* the past."
  2.  **If he means "Alter":** Agree with him. (Reading 1 & 4). Tell him no one serious argues you can change the past. But point out that **travel without alteration is logically possible** (you go back and fulfill what always happened).
  3.  **If he means "Travel":** Ask him which metaphysics he is using. Is he assuming **Presentism** (Reading 2)? If so, he needs to argue why Einstein's Block Universe is wrong. He can't just assert "you can't change the past" as a trump card.
  4.  **Drop the Lewis Card:** Tell him the "Can/Can't" distinction dissolves the Grandfather Paradox. The paradox assumes you *can* shoot him (ability) and *won't* shoot him (fact) creates a contradiction. Lewis shows it's only a contradiction if you ignore which facts you are comparing against.

  **The Kill Shot:** "You're right that I can't *change* the past. That's a tautology. But I can *be in* the past. Unless you can prove the past doesn't exist (Presentism) or that Closed Timelike Curves are physically impossible, you haven't proven travel is impossible, only that *changing history* is."
