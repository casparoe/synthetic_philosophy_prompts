answer: |-
  This is a sharp provocation, and it cuts right to the ontological nerve of translation theory. You are asking me to defend a formalist, essentialist position in a field that has largely moved toward functionalism and spectrum-based models.

  Here is the argument, straight down the line.

  ### The State of the Field: Where This Stands
  First, let's clear the air regarding translation studies. The position you are asking me to defend—that there is a hard binary line between "translation" and "adaptation" based on formal fidelity—is **not** the consensus. In fact, it is the minority view in contemporary scholarship.

  The dominant framework (Skopos theory, Descriptive Translation Studies) argues that translation is defined by its *function* and the relationship established by the translator, not by an invariant set of formal features. Scholars like Gideon Toury or Katharina Reiss would argue that if the target text is accepted by the target culture as a translation of the source, it *is* a translation, regardless of what was dropped. They view translation as a gradient of "equivalence," not a binary switch.

  However, there is a robust, older tradition (the Formalists, the Structuralists, and certain strands of Philosophical Hermeneutics) that treats the artwork as an indivisible unity of form and content. Your argument aligns with this tradition. It posits that a poem is not a message wrapped in a container; the container is part of the message. I will argue from this essentialist standpoint.

  ### The Objection: "All Translation Loses"
  The obvious counter-argument is the truism of the field: *Traduttore, traditore.* Every translation involves loss. Phonemes change, connotations shift, cultural references dissolve. If we classify any text with loss as "not a translation," the category of translation becomes empty. Therefore, your line must be arbitrary.

  **The Rebuttal: Incidental Loss vs. Structural Amputation**
  The distinction lies not in the *presence* of loss, but in the *location* of the breach.

  Most translation loss is **incidental**. It happens in the interstices of meaning. You translate a French pun with an English pun that means something slightly different. You lose the specific cultural resonance of "baguette" and gain the rhythmic flow of "bread." This is the cost of doing business. The *architecture* of the poem remains intact. The reader is still walking through the same building, even if the wallpaper is different.

  However, a "constraint deficit" involving a load-bearing constraint results in **structural amputation**. This is not changing the wallpaper; it is removing a load-bearing wall and replacing it with a curtain.

  When a constraint is "load-bearing," it means the constraint is not merely decorative; it is **generative**. It dictated the choice of words, the syntax, and often the semantic direction of the original. If the original poem is a sonnet, the 14-line structure and volta are not just a box the poet wrote in; they are the engine that created the argument. If the original is an acrostic, the vertical axis is not decoration; it is a second channel of communication.

  If you drop a generative constraint because the target language cannot support the joint satisfaction of form and meaning, you are not translating the poem. You are translating the *paraphrase* of the poem.

  ### The Criterion: Structural Constitutivity
  Here is the specific criterion I propose to distinguish translation from adaptation in cases of constraint deficit:

  **The Constitutive Constraint Principle:**
  > A text ceases to be a translation and becomes an adaptation when a dropped constraint was **constitutive** of the original work's semantic identity, meaning the constraint actively generated meaning that cannot be recovered through semantic equivalence alone.

  To test this, ask: *If I remove this constraint from the original, is it still the same poem?*
  *   **Decorative Constraint:** If you remove the rhyme from a limerick but keep the rhythm and jokes, it's still recognizably that limerick, just broken. Rhyme here is often ornamental.
  *   **Constitutive Constraint:** If you remove the tonal pattern from a Tang dynasty *Jueju*, or the 5-7-5 syllabic tension from a haiku, or the acrostic spelling from a religious hymn, the poem collapses. The constraint *is* the mechanism of meaning.

  In a constraint deficit scenario, if you must choose between preserving the semantic content (the "what") and the constitutive constraint (the "how"), and you choose the "what," you have destroyed the work's identity. You have preserved the *data* but lost the *code*.

  ### Why the Label Matters
  You asked why we shouldn't just call it a translation anyway. Why is the label "adaptation" or "version" necessary?

  1.  **Reader Expectation:** When a reader picks up a book labeled "Translation," they operate under a contract of ontological fidelity. They expect to be encountering the *same work* across a linguistic barrier. If the structural engine of the work has been swapped out, that contract is violated. It is an act of intellectual honesty to label the text "An Imitation of X" or "A Version of X."
  2.  **Honoring the Source:** Paradoxically, calling it an adaptation honors the original more than calling it a translation. Calling it a translation implies the original was simple enough to be moved intact. Admitting it is an adaptation acknowledges the unique, untranslatable density of the original. It admits that the "constraint deficit" was real and that the poem is rooted too deeply in its source language to be uprooted without mutation.
  3.  **The Hofstadter Lesson:** Hofstadter's *Le Ton beau de Marot* is fun, but it risks trivializing the difficulty. By showing 88 versions, he implies the poem is a fluid substance that can take any shape. I argue the opposite. The poem is a crystal. If you force it into a different mold, it shatters. You can glue the shards into a new shape, but you must call it a mosaic, not the original crystal.

  ### The Hard Line
  So, where is the line?

  The line is drawn at **Generative Integrity**.
  *   **Translation:** Preserves the generative mechanism, even if semantic precision bleeds. (e.g., keeping the meter and rhyme even if the imagery shifts slightly).
  *   **Adaptation:** Preserves the semantic narrative but abandons the generative mechanism due to impossibility.

  If the constraint is jointly unsatisfiable in the target language, and that constraint is constitutive (load-bearing), you **cannot** produce a translation. You can only produce a derivative work.

  This means many "classic" translations are mislabeled. If a translator renders a strict Arabic *qasida* into English free verse because the monorhyme and meter are impossible to sustain without nonsense, they have written an adaptation. If they render a Vietnamese *lục bát* (6-8 syllable couplet with specific tonal rules) into English iambic pentameter, they have written a new poem inspired by the old one.

  ### Conclusion
  This is a hardline stance. It reduces the corpus of "true" translations significantly. It accepts Robert Frost's aphorism ("Poetry is what gets lost in translation") not as a witticism, but as a technical specification.

  If the form is constitutive, and the form is lost, the poem is lost. What remains is a commentary, a shadow, or a conversation. To call it a translation is to lie about the nature of the object. In the face of a constraint deficit, the only honest move is to admit that the poem cannot cross the border intact. It must stay home, or be reborn as something else.
