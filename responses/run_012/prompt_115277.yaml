answer: |-
  **Joint Statement on Expected Value and Rational Requirement**

  **I. Agreed Claims**

  1.  In Case 3 (the Ordinary Case), rationality requires taking the lottery rather than paying the certain cost.
  2.  In Case 1 (the Toggle), Act T has a higher expected value than Act S by approximately 10^6 units.
  3.  In Case 2 (the Ladder), the lottery has a higher expected value than the certain cost at every rung *n*.
  4.  Expected value is computed as the sum of products of outcome values and agent credences.
  5.  Credences and values are modeled as real numbers for the purpose of calculation.
  6.  Rational requirement depends on the agent's epistemic state, not merely on objective facts.
  7.  The quality of evidence supporting a credence degrades as the probability becomes extreme.
  8.  A decision rule must be action-guiding for agents with human cognitive limitations.
  9.  The disagreement is not about the arithmetic of expected value.
  10. The disagreement is about the normative force of that arithmetic under extreme inputs.

  **II. Disagreements**

  | Sub-question | Maximizer's Position | Restrictionist's Position | Genuine or Verbal |
  | :--- | :--- | :--- | :--- |
  | **1. Binding Force** | Higher expected value entails rational requirement, regardless of input magnitude. | Higher expected value entails requirement only where inputs are epistemically licensed. | Genuine |
  | **2. Case 1 Verdict** | Act T is rationally required despite the catastrophic loss risk. | Neither act is required; the inputs are too indeterminate to bind. | Genuine |
  | **3. Case 2 Limit** | The recommendation binds at every rung *n*, however large. | The recommendation ceases to bind beyond a finite rung *n*. | Genuine |
  | **4. Tiny Probabilities** | A credence of 10^-20 is a genuine quantity capable of grounding reasons. | A credence of 10^-20 is an artifact of idealization, not a genuine quantity. | Genuine |
  | **5. Huge Values** | No outcome is too valuable to be outweighed by probability. | Values beyond a certain magnitude exceed our capacity to measure them meaningfully. | Genuine |
  | **6. Restriction Status** | Restrictions are unprincipled fudges that change the subject. | Restrictions are epistemic constraints necessary for the rule to apply. | Verbal/Genuine |

  **III. The Cruxes**

  We identify three sub-questions where settling the matter would move at least one party.

  **1. Epistemic Access to Extremes**
  *   **Argument:** Whether an agent can possess evidence sufficient to justify a credence of 10^-20.
  *   **Maximizer Prediction:** Formal coherence is sufficient; evidence need not be empirical.
  *   **Restrictionist Prediction:** Evidence is inherently coarse; such precision is impossible.

  **2. The Case 2 Region**
  *   **Argument:** The point at which epistemic licensing fails as probability decreases and magnitude increases.
  *   **Region of Disagreement:** We locate the disagreement between rung *n*=15 and *n*=25.
  *   **Middle Region Prediction (e.g., n=20):**
      *   *Maximizer:* The lottery is required. The EV advantage (10^9) outweighs the cost (10^6).
      *   *Restrictionist:* No act is required. The probability (10^-20) is below the threshold of evidential support, and the harm (10^29) exceeds meaningful valuation.

  **3. Value Boundedness**
  *   **Argument:** Whether value functions are inherently bounded by human comprehension.
  *   **Maximizer Prediction:** Value is metaphysical; comprehension limits do not cap value.
  *   **Restrictionist Prediction:** Value is normative for agents; incomprehensible magnitudes cannot guide action.

  **IV. Verdict on the Grain Principle**

  *Principle: Credences come in a finest grain... and no comparison turning on a finer difference can impose a rational requirement.*

  **The Maximizer rejects the Grain Principle.** He holds that credences are real-valued functions representing degrees of belief. To impose a grain is to deny the continuity of confidence. He argues that even if an agent cannot *express* a difference finer than 10^-15, the rational normativity tracks the actual likelihood, not the agent's resolution.

  **The Restrictionist accepts the Grain Principle,** but judges it insufficient. It blocks fanaticism driven by tiny probability differences (Case 1), but it leaves fanaticism intact whenever probabilities are coarse and stakes are large. If the probability is 10^-1 (coarse) and the stake is 10^100, the Grain Principle does not block the requirement. She therefore amends the principle: *Inputs must be both coarse-grained and magnitude-bounded to impose requirement.*

  **V. Verbal Disputes**

  We identify one significant verbal dispute regarding the term **"Rational Requirement."**

  For the Maximizer, this term refers to **Ideal Rationality**. An agent is rationally required to do X if X maximizes expected value given the agent's credences, even if those credences are idealized.

  For the Restrictionist, this term refers to **Human Rationality**. An agent is rationally required to do X only if X maximizes expected value given credences that are evidentially supported for a human agent.

  **Disambiguation Cost:** Disambiguating this clarifies the dispute but does not dissolve it. The Maximizer insists Ideal Rationality is the only coherent standard; Human Rationality is merely pragmatic. The Restrictionist insists Human Rationality is the only normative standard; Ideal Rationality is a mathematical game. We agree that if "Rational Requirement" means Ideal Rationality, the Maximizer wins. If it means Human Rationality, the Restrictionist wins. The substantive fight is over which definition governs normativity.

  **VI. Coherence and Evidence**

  **Coherence Check:**
  We judge that the Restrictionist's position risks incoherence if the boundary of "epistemic licensing" is arbitrary. If she cannot specify why *n*=20 is the limit rather than *n*=21 without appealing to the very EV calculations she rejects, her position collapses into unprincipled fudging. She maintains the boundary is set by cognitive architecture, not arithmetic. The Maximizer maintains this appeal is ad hoc. We record this tension: the Restrictionist must provide a non-arbitrary theory of epistemic limits to remain coherent.

  **Closing: Evidence Against Our Positions**

  **The Maximizer** would abandon his position if expected value maximization could be shown to lead to **sure loss** in a sequential choice scenario involving these extreme cases. If following EV guarantees a worse outcome than an alternative rule in every possible world, he accepts the rule is flawed.

  **The Restrictionist** would abandon her position if shown that **precise credences** are possible at extreme magnitudes. If evidence can genuinely support a probability of 10^-20 as firmly as 10^-2, her epistemic restriction loses its foundation.

  **Joint Agreement on Defeaters:**
  We agree that neither of these defeaters is currently available. No sure-loss pump has been constructed that does not rely on contested assumptions about infinite series. No evidence has been produced that justifies extreme credences without relying on theoretical models that the Restrictionist already rejects as idealizations.

  Therefore, the debate remains stalled on the definition of normative authority. The Maximizer holds that arithmetic binds because it is truth-tracking. The Restrictionist holds that arithmetic binds only because it is action-guiding. Until we agree on whether rationality tracks truth or guides action, we will not agree on the Toggle, the Ladder, or the Grain.

  **Signed,**

  **The Maximizer**
  **The Restrictionist**
