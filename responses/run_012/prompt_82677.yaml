answer: |-
  ### Exam Question

  **Module:** Moral Theory II
  **Topic:** Moral Uncertainty
  **Time Allowed:** 90 Minutes
  **Marks:** 20

  **Question:**
  The standard proposal for decision-making under moral uncertainty is to Maximise Expected Moral Value (MEMV). However, this proposal faces structural challenges regarding its own justification, the nature of the uncertainty involved, and the influence of extreme theories.

  Critically assess whether MEMV can function as a universal decision procedure. In your answer, you must address:
  1.  **The Regress:** Does applying MEMV require a prior normative commitment that itself rests on uncertain ground?
  2.  **The Distinction:** Does MEMV adequately distinguish between uncertainty about *which theory is true* and uncertainty about *what a theory implies*?
  3.  **The Swamping Problem:** Does the dominance of absolutist theories in expected value calculations refute the procedure, or merely reflect the stakes?

  ***

  ### Model Answer

  The Maximise Expected Moral Value (MEMV) framework suggests that agents should weight the choiceworthiness of actions by their credence in competing moral theories. While intuitively appealing as a moral analogue to evidential decision theory, MEMV collapses under structural scrutiny regarding its meta-normative foundation, the taxonomy of uncertainty, and the handling of lexical priorities.

  First, MEMV triggers a vicious regress of meta-uncertainty. To employ MEMV, an agent must accept it as the correct procedure for handling uncertainty. But this acceptance is itself a normative commitment made under uncertainty. One might be uncertain not only between utilitarianism and deontology but also between MEMV and, say, a 'follow the most likely theory' heuristic. To resolve this, one would need a meta-meta-theory to weigh these decision procedures, leading to an infinite regress. To stop the regress, one must posit a foundational norm (e.g., 'rationality requires maximisation') that is not subject to uncertainty. However, asserting such a norm is dogmatic. If the stopping point is arbitrary, MEMV lacks justification; if it is non-arbitrary, it implies there is a moral truth accessible without uncertainty, undermining the premise of the framework. Thus, MEMV cannot be universally applied without begging the question at the meta-level.

  Second, MEMV conflates two distinct epistemic states: intertheoretic uncertainty (which theory is true) and intra-theoretic uncertainty (what a theory implies). MEMV treats both as credences to be plugged into the same equation. However, these uncertainties demand different responses. Intertheoretic uncertainty requires hedging or compromise between conflicting values. Intra-theoretic uncertainty often requires investigation rather than hedging. If I am unsure whether a specific act constitutes 'lying' under a deontological framework I accept, calculating expected value is less rational than seeking clarification on the definition. By subsuming both under a single calculus, MEMV obscures the fact that intra-theoretic doubt is often empirical or conceptual, not normative. A unified procedure risks misapplying hedging strategies to problems that require conceptual resolution.

  Finally, the 'swamping' problem presents a *reductio* of the procedure. If an agent assigns even a tiny non-zero credence to an absolutist theory (e.g., one that assigns infinite disvalue to a specific act), the expected value of avoiding that act becomes infinite, dominating all other considerations. MEMV thus dictates that we must prioritise avoiding the remote possibility of violating an absolutist constraint over securing certain, significant goods endorsed by other theories. Proponents argue this is a feature, not a bug: if there is a chance of infinite sin, rationality demands avoidance. However, this renders the agent paralyzed by fanaticism, vulnerable to 'Pascal's Mugging' style moral threats. If a decision procedure forces agents to ignore all finite goods due to infinitesimal probabilities of lexical violations, it fails as a practical guide. This suggests the error lies not in the stakes of morality, but in the linearity of the expected value calculus itself.

  In conclusion, MEMV is unstable. It relies on an unjustified meta-normative stopping point, conflates distinct types of doubt requiring different remedies, and succumbs to fanaticism via the swamping problem. It functions only if one artificially restricts the range of admissible theories and ignores the regress of its own adoption.

  ***

  ### Marking Scheme

  **First Class (17–20 Marks)**
  *   **The Regress:** Explicitly identifies that choosing MEMV is a normative choice subject to uncertainty. Argues that stopping the regress requires a dogmatic foundational norm or leads to infinity. (Must mention that the "stopping point" is the vulnerability).
  *   **The Distinction:** Clearly separates *intertheoretic* (theory choice) from *intra-theoretic* (application/definition) uncertainty. Argues that they might require different responses (hedging vs. investigating) and that MEMV conflates them.
  *   **The Swamping:** Explains how lexical/absolutist priorities dominate the calculation. Takes a stance on whether this is a *reductio* (fanaticism objection) or a feature, but critically evaluates the implication for practical agency.
  *   **Synthesis:** Connects the three points to show a structural instability in MEMV, rather than treating them as isolated objections.

  **Upper Second (14–16 Marks)**
  *   Addresses all three prompts but lacks depth on one.
  *   **Common weakness:** Explains the regress but answers it with "we just have to pick something" without analysing the arbitrariness.
  *   **Common weakness:** Treats the swamping problem as merely "counter-intuitive" without discussing *why* (fanaticism/Pascal's Mugging).
  *   Distinguishes the two uncertainties but fails to argue why MEMV fails to handle both.

  **Lower Second (11–13 Marks)**
  *   Addresses only two of the three prompts adequately.
  *   **Penalty:** Treats intertheoretic comparison as a technicality that can be "solved" by normalisation without discussing the structural issue.
  *   **Penalty:** Describes MEMV accurately but fails to "break" it (too descriptive).

  **Fail (0–10 Marks)**
  *   Misunderstands MEMV (e.g., confuses it with moral relativism).
  *   Ignores the regress or swamping constraints.
  *   **Specific Penalty:** Answers the regress with "just be reflective" or "use common sense" (vague meta-ethics).

  ***

  ### Confidence Assessment

  I am **85% confident** in the utility of this exam pack for your specific pedagogical goals. The structure forces the exact "breakage" of MEMV you requested, and the marking scheme penalises the specific evasions you noted (like waving away intertheoretic comparison).

  **The claim I would bet on least:**
  In the Model Answer, the claim that **intra-theoretic uncertainty requires a different decision procedure than intertheoretic uncertainty** is the most philosophically contentious point. Many proponents of MEMV (e.g., MacAskill) argue that MEMV *can* handle intra-theoretic uncertainty simply by assigning credences to specific moral propositions within a theory. A sharp student could argue that the distinction is epistemic, not procedural, and that MEMV remains robust across both. I have framed this in the model answer as a critique, but in a real marking scenario, a student arguing the opposite (that MEMV unifies them successfully) should still receive credit if they justify it well. The marking scheme allows for this by focusing on the *clarity of the distinction* rather than forcing a specific conclusion, but the model answer takes a harder line than the literature might strictly necessitate.
