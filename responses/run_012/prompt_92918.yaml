answer: |-
  You have identified a genuine gap in the standard taxonomy. Your intuition is correct: standard "underdetermination" is typically inter-theoretic (rival theories), and standard "unobservability" (e.g., Van Fraassen) is typically anthropocentric (limits of human biology/technology). Neither captures the specific modal force you are describing: *inaccessibility certified by the theory's own dynamics.*

  There is no single, universally standardized term that captures the ontological load-bearing status *plus* the theoretical guarantee of inaccessibility. However, there are three distinct conceptual clusters that converge on your structure. To get the "right carving," you need to combine the formal precision of one with the philosophical modality of another.

  Here is the breakdown of the existing landscape, followed by a proposed term that fits your specific boundaries.

  ### 1. The Formal Carving: Structural Unidentifiability
  In the philosophy of statistics and modeling (e.g., work by Malcolm Forster, Elliott Sober), the precise mathematical condition you describe is called **unidentifiability**.
  *   **Definition:** A parameter or state variable is unidentifiable if distinct values of that variable yield identical probability distributions over the observable data.
  *   **Why it fits:** It captures your requirement that "no experiment could distinguish one state of the extra layer from another." It is a property of the model structure, not the experimenter.
  *   **Why it falls short:** It is usually applied to parameters in a statistical model, not necessarily "entities" or "ontology." It also tends to imply the variable is a nuisance to be eliminated, whereas you note the layer is "load-bearing" for explanation.
  *   **Refinement:** You should refer to this as **State Unidentifiability** to emphasize it applies to the physical state, not just a numerical parameter.

  ### 2. The Physical Carving: Gauge Freedom vs. Hidden Variables
  In physics, this structure appears in two guises, distinguished by the ontological commitment you mentioned.
  *   **Gauge Symmetry:** The extra structure (e.g., electromagnetic potential) is mathematically necessary but widely considered "surplus structure" (Redhead, 1975). The standard philosophical move is to declare gauge-variant quantities *non-physical*.
  *   **Hidden Variables (Bohmian Mechanics):** This is your paradigmatic case. The particle positions exist (ontologically load-bearing), but the **Quantum Equilibrium Hypothesis** ensures they are distributed such that they cannot be measured more precisely than the Born rule allows.
  *   **The Specific Term:** In the Bohmian literature (Dürr, Goldstein, Zanghì), this specific theorem is called **Absolute Uncertainty**.
  *   **Why it fits:** It captures the "theory proves it" aspect. It is not that we lack the technology; it is that the dynamics forbid the knowledge.
  *   **Why it falls short:** It is specific to quantum foundations. You need a general term.

  ### 3. The Philosophical Carving: Intra-Theoretic Underdetermination
  Standard underdetermination is Theory A vs. Theory B. You are describing **Intra-Theoretic Underdetermination** (sometimes called **State Underdetermination**).
  *   **The Boundary:** This distinguishes your case from the Duhem-Quine problem. The underdetermination is not about which *laws* are true, but which *state* obtains within a single accepted law-set.
  *   **The Limit:** This term describes the *epistemic situation* but does not capture the *source* of the limitation (the theory itself).

  ### The Proposed Carving: Constitutive Inaccessibility

  Since no single existing term captures the *ontological commitment* + *theoretical guarantee* + *intra-theoretic* nature of your structure, I recommend you adopt **Constitutive Inaccessibility**.

  This term carves the concept at the joints you require. It distinguishes the inaccessibility from contingent limits (technology, biology) and locates the source of the limit in the *constitution* of the theory itself.

  #### Definition
  A theoretical posits $X$ exhibits **Constitutive Inaccessibility** if and only if:
  1.  **Ontological Commitment:** $X$ is required for the formulation of the theory's laws and/or the derivation of observable phenomena (it is not dispensable surplus structure).
  2.  **Endogenous Hiding:** The theory's dynamical laws entail a theorem that no measurement procedure consistent with those laws can recover the specific state of $X$ beyond a specified limit.
  3.  **Empirical Equivalence of States:** Distinct states of $X$ map to identical observable histories within the theory.

  #### Why this term works for your chapter
  *   **"Constitutive":** Signals that the inaccessibility is built into the rules of the system, not an external limitation on the agent. It answers your need to distinguish "information unavailable" from "information unavailable by the theory's own decree."
  *   **"Inaccessibility":** Distinguishes it from "Unobservability." "Unobservable" usually implies a human limit (Van Fraassen). "Inaccessible" implies a structural barrier, even for an idealized agent within the theory.

  #### Boundary Conditions (What falls outside)
  To ensure your carving is sharp, here is what **does not** count as Constitutive Inaccessibility:

  1.  **Contingent Unobservability:** An electron is unobservable to the naked eye, but the theory allows its properties to be recovered via instruments. The theory does not *forbid* knowing its position; nature just makes it small. (Fails Condition 2).
  2.  **Surplus Gauge Structure:** In classical electromagnetism, the absolute value of the potential is often considered non-physical. If the consensus is that the variable is *fictional*, it fails Condition 1 (Ontological Commitment). Your structure requires that proponents argue it is *real* despite the hiding.
  3.  **Inter-Theoretic Underdetermination:** Newtonian vs. Relativistic spacetime where experiments cannot decide. This is rival theories, not layers within one theory. (Fails the "Intra-" requirement).
  4.  **Chaos/Practical Unpredictability:** In chaotic systems, information is lost to practical limits of precision. However, the theory does not *prove* the information is unrecoverable in principle; it just amplifies errors. (Fails Condition 2's "in principle" requirement).

  ### How to use this in your argument
  You can frame the realism debate you describe not as a standard underdetermination problem, but as a conflict over **Constitutively Inaccessible Entities**.

  *   **The Realist:** Argues that Condition 1 (Explanatory Load) trumps Condition 2 (Inaccessibility). The entity exists *because* it explains the observable layer, even if the theory says we can't see it. (e.g., Bohmian trajectories).
  *   **The Instrumentalist/Structuralist:** Argues that Condition 2 (Inaccessibility) negates Condition 1. If the theory proves we can't know it, we should treat it as a computational device or reduce our ontology to the invariant structure.

  ### Summary Recommendation
  If you need to cite existing literature, anchor your discussion in **Structural Unidentifiability** (for the formal logic) and **Absolute Uncertainty** (for the physics precedent, specifically Dürr et al.).

  However, for your own philosophical carving, coin and define **Constitutive Inaccessibility**. It precisely isolates the "theory's own decree" aspect you identified as the crucial edge case. It allows you to say: *"This is not merely unobservable; it is constitutively inaccessible. The theory builds a wall around its own ontology."* This phrasing captures the exact tension you are analyzing.
