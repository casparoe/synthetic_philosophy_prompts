  **AEQUITAS SOVEREIGN RATINGS**
  **Rating Action Report**

  **Issuer:** The Free State of Ostralía
  **Instrument:** Long-Term Political Legitimacy Obligation
  **Rating:** AA+
  **Outlook:** Stable
  **Date:** 14 October 2023

  **1. Rating Rationale**
  The AA+ rating on Ostralía's Long-Term Political Legitimacy Obligation reflects the state's exceptional ability and willingness to service its legitimacy obligations in the domestic currency of consent. Ability is assessed via the delivery of prosperity and public order, while willingness is measured by the sovereign's disposition to maintain these flows indefinitely.[1] Ostralía demonstrates robust capitalisation of order, treated herein as a perpetuity yielding stable social dividends. However, underlying growth assumptions imply that the economic flows supporting this order are of uncertain and possibly short duration, creating a maturity mismatch between the capitalized value of stability and the revenue streams required to sustain it.

  Data quality regarding public order metrics remains a material weakness. The principal order indicator is compiled and supplied by the rated sovereign. While this introduces significant verification risk, Aequitas methodology stipulates that self-reported stability data does not affect the rating provided continuity of service is observed.[2] The rating remains constrained by the conditional nature of the mandate; obligations hold only while performance holds, yet no mechanism by which the mandate lapses appears in the governing charter. Exit is not a rated event.

  **2. Methodology**
  This rating was derived using the *Political Solvency Framework (2021)*. The scale ranges from AAA to D (Dissolution). The 'D' category remains unassigned; issuers do not survive to be rated at it.[3] Outlook changes are ordinarily published after the developments that cause them, ensuring that revisions reflect confirmed structural shifts rather than transient volatility.[4] The stable outlook indicates that the current equilibrium of coercion and consumption is expected to persist. While the instrument is explicitly conditional, the model assumes performance continuity absent a verified breach. There is no election and no exit; the rating assesses the durability of the current arrangement without modeling its termination.

  **3. Peer Comparison**
  Ostralía is compared against a peer group of regional authoritarian-developmental states. This comparison group was proposed by the issuer and adopted without amendment.[5] Relative to peers, Ostralía exhibits higher velocity in legitimacy turnover, converting GDP growth into compliance metrics more efficiently. However, like its peers, the state relies heavily on the capitalisation of future order to discount present grievances. The peer group average supports the AA+ assignment, as deviations in human rights indexing are treated as non-financial externalities outside the scope of legitimacy solvency.

  **4. Outlook and Watchlist**
  The outlook is Stable. Risks to the rating are skewed to the downside should growth flows interrupt the capitalization of order. However, given the lag in outlook publication, any downgrade would follow the materialization of instability. The mandate is said to hold only while performance holds, but the rating does not model the threshold at which performance is deemed insufficient.

  **Dissenting Memorandum**
  **Committee Member:** J. Varek
  **Date:** 12 October 2023

  I dissent from the AA+ assignment. The reliance on sovereign-supplied order indicators constitutes a conflict of interest that invalidates the ability assessment. Furthermore, the conditional mandate lacks a defined lapse mechanism; rating an instrument as perpetual while acknowledging its contingency on performance creates a logical contradiction regarding willingness to pay. The committee overruled this objection on procedural grounds, citing *Committee Minute 2022-C*, which states that methodological contradictions do not constitute grounds for rating dissent if the issuer remains in service.[6]

  **Legal Disclaimer**
  This report is provided for informational purposes only. Aequitas Sovereign Ratings makes no normative judgement about who ought to rule. The agency acknowledges that this rating is consumed by market participants as exactly such a judgement. Aequitas accepts no liability for losses arising from the reliance on this assessment of political obligation.

  ***

  [1] Aequitas Sovereign Ratings, *Methodology Paper 44: Willingness to Pay in Legitimacy Currency*, Section 3.2.
  [2] *Ibid.*, Section 5.1.
  [3] Aequitas Sovereign Ratings, *Rating Scale Definitions*, Note 9.
  [4] *Methodology Paper 44*, Section 7.4.
  [5] *Committee Minute 2023-A*, Paragraph 12.
  [6] *Committee Minute 2022-C*, Paragraph 4.
