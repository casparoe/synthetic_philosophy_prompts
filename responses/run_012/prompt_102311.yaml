          *   Table 3: Limits (Limitation, Why Can't Fix, What To Do Instead).
          *   Prose: Couple of sentences above each table, nothing else.
          *   Content: Don't collapse into "weigh harm vs. rule." Acknowledge arbitrary rules derive authority from establishment. Keep Pascal, drop unusable metaphysics.
