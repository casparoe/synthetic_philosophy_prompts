answer: |-
  This procedure treats established rules as authority itself, not as instruments of moral truth, directing moderators to enforce custom unless doing so exposes the power behind it as naked tyranny. It distinguishes factual violations from value judgments, handing the latter back to leadership to preserve the volunteer's neutrality.

  | step number | the question | what counts as a sufficient answer | what to do if the answer is no | who decides (moderator or me) |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | Is there a written, active rule covering this specific action? | Yes, the rule is in the current wiki and matches the behavior. | Escalate to leadership; do not enforce without established force. | Moderator |
  | 2 | Is the violation objective (e.g., a link posted) rather than interpretive (e.g., tone)? | Yes, evidence exists that does not require guessing intent. | Escalate to leadership; volunteers do not adjudicate spirit over letter. | Moderator |
  | 3 | Will enforcing this maintain the appearance of legitimate authority rather than caprice? | Yes, enforcement looks consistent with past cases and not personally targeted. | Escalate to leadership; this is a values question disguised as a rule check. | Moderator |
  | 4 | Is enforcement feasible without revealing institutional impotence? | Yes, the sanction can be applied and will hold. | Let it go and document; force without efficacy is farce. | Moderator |
  | 5 | Have all prior steps been cleared? | Yes. | Enforce the rule exactly as written. | Moderator |

  These applications show where the mechanism holds, where it strains, and where the human element overrides the textual one to prevent the system from collapsing under its own weight. The verdicts prioritize the stability of the authority over the moral outcome of any single case.

  | case | verdict the procedure gives | which step is doing the work | where it nearly misfires | what it leaves unsettled |
  | :--- | :--- | :--- | :--- | :--- |
  | (a) Arbitrary rule vs. helpful user | Escalate to leadership | Step 3 (Legitimacy/Caprice) | Moderator wants to waive the rule because the user is "good." | Whether the arbitrary rule survives contact with community sentiment. |
  | (b) Genuine harm, no rule | Escalate to leadership | Step 1 (Written Rule) | Moderator wants to ban based on moral outrage alone. | The creation of new force; leadership must authorize the precedent. |
  | (c) Just rule, unenforceable user | Let it go (Document) | Step 4 (Feasibility/Impotence) | Moderator wants to chase the user to prove a point. | The user's return; the procedure accepts the limit of power. |

  These limits acknowledge that no procedure can reconcile force and justice, only manage the tension between them without lying to the moderators about the nature of their work. They require leadership to absorb the moral ambiguity so volunteers can function within the system.

  | limitation | why it can't be fixed | what to do instead |
  | :--- | :--- | :--- |
  | Arbitrary rules remain arbitrary | Pascal's point: authority comes from establishment, not reason. | Enforce publicly to maintain order, review privately to maintain sanity. |
  | Force is finite | Technical and human limits prevent total control (e.g., ban evasion). | Accept the loss as a cost of doing business; do not overextend. |
  | Moderators are not judges | Volunteers lack the mandate to weigh justice against force. | Keep their scope to factual application; leadership absorbs the value conflicts. |
