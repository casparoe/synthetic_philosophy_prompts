answer: |-
  Here is a principle constructed to maximize coherence with your intuitions, followed by the necessary sacrifice and the predictions for your new cases.

  ### The Principle: Equal Claim and Complementary Authority

  Sortition is legitimate if and only if it satisfies **one** of the following two tracks, without violating the **Constraint**:

  **Track A (Allocation):** The lot is used to distribute a **burden** or a **scarce good** among candidates with **equal moral claims**, where relevant differentiating reasons have been exhausted or are nonexistent.
  *   *Earning its keep:* Verdicts 7 (kidney), 8 (conscription), 9 (hospital site).
  *   *Excluding:* Verdict 6 (custody), Verdict 10 (textbooks).

  **Track B (Governance):** The lot is used to select a **collective body** that exercises **deliberative judgment**, provided the body acts as a **complement or check** on electoral institutions, rather than a **substitute** for them or a **singular** executive.
  *   *Earning its keep:* Verdicts 1 (jury), 2 (assembly), 4 (judge from pool), 11 (veto panel), 13 (stratification).
  *   *Excluding:* Verdict 5 (sole ruler), Verdict 12 (replace legislature).

  **The Selection Constraint:** The pool must be **mandatory** (or qualified, for technical roles) to ensure representativeness and prevent self-selection bias.
  *   *Earning its keep:* Verdicts 15 (no opt-out), 16 (no volunteers), 4 (qualified pool).

  **The Rights Constraint:** The lot must never determine the specific political fate of a **named individual** outside of a judicial fact-finding process regarding past acts.
  *   *Earning its keep:* Verdict 3 (deportation). Distinguishes Verdict 1 (jury duty).

  ***

  ### The Sacrifice: Verdict 10

  To make this principle hold, you must surrender **Verdict 10** (Coin flip for textbooks).

  **Why:** Your intuition here is likely hiding a premise. You stipulated the textbooks are "equally good," but your gut rejects the flip. This suggests you don't actually believe they are *reason-equivalent*. With the hospital site (Verdict 9), a "dead heat" is geometrically plausible (distance × cost = identical). With textbooks, "equally good" is almost always an epistemic placeholder for "we haven't debated the pedagogical philosophy enough yet."

  If you accept the Principle's Track A, a genuine dead heat *demands* a lottery to avoid arbitrary bias. If you believe reasons *could* settle it (e.g., one aligns better with district values), then it isn't a dead heat, and the lottery is illegitimate. You cannot have it both ways. Surrender 10 to save the coherence of 7, 8, and 9.

  *(Note on Verdict 6: Custody fits Track A but fails the "equal claims" test. The standard is "best interest of the child," which inherently posits that one parent might be better suited. Therefore, reasons must settle it, not the lot.)*

  ***

  ### Predictions for New Cases

  **(a) Lottery for the order in which two equally urgent, equally survivable patients get the operating theatre tonight.**
  *   **Verdict:** **Fine.**
  *   **Reasoning:** This falls squarely under **Track A (Allocation)**. The good (survival) is scarce (one theatre). The claims are equal (urgent/survivable). The reasons are exhausted (medical triage cannot distinguish them). This is the paradigmatic case for sortition as a tie-breaker. It avoids the "first come, first served" bias or the doctor playing God.

  **(b) A rule under which any citizen can be selected by lot to sit for three years on the central bank's rate-setting board, with the same vote as everyone else on it.**
  *   **Verdict:** **Not Fine.**
  *   **Reasoning:** This fails **Track B (Governance)** and the **Selection Constraint**.
      1.  *Technical vs. Value:* Citizens' Assemblies (Verdict 2) work on *constitutional values* (e.g., "should we change the voting system?"). Central banking involves *technical calibration* (inflation targeting, liquidity). While not magic, it requires sustained expertise that a 3-year layperson cannot reasonably acquire compared to a career economist. This distinguishes it from Verdict 4 (judges), where the pool was *qualified* by exam.
      2.  *Complementary vs. Disruptive:* A veto panel (Verdict 11) checks the legislature. A random board member with *equal vote* on interest rates risks destabilizing a technocratic institution designed to be insulated from public whim.
      3.  *Duration:* Three years is a long tenure for a novice. Verdict 5 (sole ruler for a day) was rejected partly due to lack of competence/time to learn. Three years is enough to do damage, but not enough to master the craft.
      *   *Caveat:* If the rule were "selected from a pool of qualified economists," it would be Fine (per Verdict 4). As stated ("any citizen"), it violates the competence requirement implicit in technical governance.

  ### Summary of the Coherence
  Your intuitions are not a list in a trenchcoat; they are a **Mixed Constitution** theory. You support sortition when it acts as a **corrective** (juries, veto panels, constitutional assemblies) or an **equalizer** (kidneys, conscription), but you reject it when it becomes **absolute power** (sole ruler, replacing legislature) or **arbitrary fate** (custody, deportation). The principle above codifies that distinction.
