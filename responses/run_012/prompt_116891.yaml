  hey, I'm a PhD student in philosophy and I'm putting together a weird little closing exercise for a seminar on paradoxes. I want a sestina about the two-envelope paradox, but not the usual should-you-switch thing. Here's the variant I want it to be about: you're told the envelopes contain x and 2x, but you're also told the smaller amount was chosen by some process you know nothing about, and the person running the game will keep offering you the chance to switch after every switch, forever. The poem should be in the voice of someone holding one envelope, and the six end-words should be: envelope, other, expect, equal, switch, before. I want the sestina's recycling of those words to do the work -- the way other keeps coming back as the thing you don't have, the way expect and equal start to sound like the same word, the way switch and before trap you in a loop. It should be accurate enough that someone who knows the paradox, including the standard objection that the expected-value calculation presupposes a distribution over x, would nod, but it shouldn't just explain the paradox; it should make the reader feel the symmetry argument and the switching argument as two readings of the same situation. Don't resolve it with a tidy moral at the end. The envoi can be a little unresolved. Also, if you can, make the poem work if you read it backwards? no, thats too much, ignore that. Just make it good and in the weeds. Thanks!
