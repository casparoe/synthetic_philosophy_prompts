          6.  Policy Recommendations (What would Bentham actually *do*?).
      *   *Refining the AI point:* Make sure to distinguish between the AI as a *moral patient* (it isn't one for Bentham) and the AI as a *mechanism for human utility*. The friend's error is anthropomorphizing the reward function as "pleasure" in the moral sense.
      *   *Refining the Wireheading point:* Bentham wasn't a "live for the moment" hedonist. He was a calculator. Long-term pain outweighs short-term pleasure.

  8.  **Self-Correction/Check during drafting:**
