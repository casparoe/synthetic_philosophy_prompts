  Im putting together a bit of satire for a philosophy of biology reading group and could use help writing it. Can you write me a customer service FAQ page, about 600 words, for a fictional insurance company — Adaptations Underwriting Ltd., say — that sells function coverage to organisms? The firm underwrites on the etiological view of function: a trait's function is whatever it was selected for, so what you're covered for depends entirely on your lineage's history. The jokes should come out of the actual content of that view and of its rival, the causal-role view (a trait's function is the contribution it currently makes to some capacity of the system), not out of generic insurance-company jokes. A few things I'd like somewhere in there: a claim denied because the trait has no selection history to point to (whether the customer is a spandrel or an organism that popped into existence last week with no ancestors), a case the firm covers cheerfully even though the selected function is bad for the customer's survival, and a cheaper rival insurer that's suspiciously generous about what counts as a function — the kind of outfit that will certify your heart's function as producing a thumping sound. Keep it deadpan and official, and make sure someone who actually works on this stuff laughs rather than winces, i.e. every absurdity has to be a real consequence of one of the positions rather than a strawman. Dont explain the debate in the piece — let the policy language do it.
