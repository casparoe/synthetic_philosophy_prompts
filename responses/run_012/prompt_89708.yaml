  **ADAPTATIONS UNDERWRITING LTD.**
  *Policy Reference: ET-SEL-99*
  *Tagline: Honoring Ancestral Intent.*

  **Frequently Asked Questions Regarding Functional Coverage**

  **Q: My claim for "olfactory tracking" was denied because I am a laboratory-generated organism with no ancestral lineage. Is this correct?**
  A: Yes. Under Section 4, Clause B (Etiological Eligibility), functional status is contingent upon a trait's presence being explained by prior natural selection. As your organism was synthesized *ex nihilo* last Tuesday, your traits lack a selection history. While you possess the *capacity* to smell, you do not possess the *function* of smelling. Coverage requires a verifiable phylogenetic record demonstrating that olfactory receptors were retained due to differential reproduction in ancestor populations. Please submit Form 12-B (Lineage Affidavit) if you believe you have undiscovered ancestors. Without a past, there is no function.

  **Q: You are covering my "post-spawning metabolic collapse." Isn't that a malfunction?**
  A: Not under our policy. Our underwriting defines function by what a trait was selected *for*, not by its current contribution to individual survival. Archival data confirms your reproductive strategy was selected for in ancestral environments despite its lethality. Therefore, the trait is functioning correctly by causing your death. We consider this a successful payout event. If you wished to survive, you should have purchased a policy based on current systemic capacity, though we advise against such volatile markets. We cover the history, not the outcome.

  **Q: Why is your premium higher than Causal Role Indemnity Corp?**
  A: Causal Role Indemnity operates on a permissive model where any causal contribution to a system's capacity counts as a function. They recently underwrote a claim stating a mammalian heart's function is "producing a thumping sound," as this contributes to the capacity of predators to locate prey. While cheaper, this dilutes functional attribution to the point of absurdity. At Adaptations Underwriting, we maintain strict historical standards. We do not insure byproducts. If your heart makes noise, that is a side effect, not a function. We only cover the pumping, because that is why the heart was selected.

  **Q: My human chin was denied coverage. It seems useful for structural integrity.**
  A: Utility is irrelevant. Our adjusters determined the chin is a structural byproduct of facial flattening and bipedal balance adjustments. It lacks an independent selection history. We cannot insure traits that are merely hitchhikers on other selected adaptations. Please refer to our list of covered hominid traits, which excludes most cranial ornamentation post-200kya. If a trait arises via drift rather than selection, it is considered a pre-existing condition with no functional value.

  **Q: What constitutes a "malfunction" under this policy?**
  A: A malfunction occurs only when a trait fails to perform the specific effect that caused its ancestors to proliferate. If a heart fails to pump blood, it is malfunctioning. If it pumps blood but fails to make a thumping sound, it is functioning perfectly. We do not cover novel capacities acquired through recent environmental shifts. If your sugar-craving mechanism causes diabetes in a modern environment, it is still functioning as selected. We do not cover environmental mismatch.

  *Disclaimer: Adaptations Underwriting Ltd. is not liable for extinction events caused by environmental mismatch. Coverage void if trait frequency was established via genetic drift. We do not cover Swampman entities.*
