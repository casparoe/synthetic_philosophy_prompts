      *   *Refining the Truthmaker point:* This is the strongest metaphysical objection. If the proposition becomes true, something in the world must correspond to it. If that something didn't exist on Monday, how can the proposition be about Monday's future? This touches on the "Grounding Objection."
      *   *Refining the "Truth Changes" point:* The user says truth is relative to when you're asking. This is *Temporalism*. The objection is that this conflates *propositions* with *sentences*. If the proposition is the same, its truth should be invariant. If the truth changes, is it the same proposition?
      *   *Refining the Fatalism point:* Does denying truth stop determinism? No. Causal determinism is about physical laws, not logical truth values. I need to make sure the user knows they might be solving the wrong problem.
      *   *Refining the Falsifiability:* If the view explains away all counter-intuitions by appealing to the "unsettled" nature of the future, is it meaningful?

