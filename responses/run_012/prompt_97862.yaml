answer: |-
  You have stumbled onto one of the oldest and most durable positions in the history of philosophy: the **Open Future** view (often associated with Aristotle's *De Interpretatione* and later developed by A.N. Prior). It is a respectable position, but it is not free. It purchases freedom from fatalism at a high price.

  You asked for an attack, not a nod. You asked to know what breaks, what bites back, and whether your view is unfalsifiable. Here is the breakdown of the costs, sorted from "annoying semantic tweaks" to "potentially fatal metaphysical wounds."

  ---

  ### 1. The Logical Cost: You Must Break Classical Logic
  **Severity: High**

  You asked: *"Can I still say that one of 'it will' and 'it won't' has to be the case?"*

  In classical logic, the **Law of Excluded Middle (LEM)** states that $P \lor \neg P$ is always true. "Either there will be a sea battle or there will not be a sea battle."
  *   **The Problem:** If "There will be a sea battle" is neither true nor false (let's call this value **I** for Indeterminate), and "There will not be a sea battle" is also **I**, then what is the value of the disjunction ($P \lor \neg P$)?
  *   **The Bite:** In standard 3-valued logics (like Łukasiewicz's), if both sides are Indeterminate, the "Either/Or" statement is *also* Indeterminate.
  *   **The Consequence:** You cannot assert "Either it will happen or it won't" as a necessary truth on Monday. You have to say, "It is currently indeterminate whether either it will or it won't."
  *   **Why it hurts:** This violates a deep intuition that the future is *definite* in structure, even if the content is open. Most people find it absurd to say "It's not even true that either it will rain or it won't." To hold your view, you must abandon classical bivalent logic for a many-valued or intuitionistic logic. That isn't impossible, but it isolates you from standard inference rules (like *reductio ad absurdum*) which rely on bivalence.

  ### 2. The Truthmaker Problem: What Changed?
  **Severity: Critical**

  You asked: *"Does making truth something that changes come back to bite me?"*

  Yes. This is the **Grounding Objection**.
  *   **The Scenario:** On Monday, the statement $S$ ("Battle on Tuesday") has no truth value. On Wednesday, $S$ is True.
  *   **The Question:** What is the *truthmaker*? What fact in the world makes $S$ true on Wednesday? Presumably, the fact that the battle occurred on Tuesday.
  *   **The Bite:** But that fact (the battle occurring) is a fact about Tuesday. If that fact existed on Tuesday, why didn't it make $S$ true on Monday?
      *   **Option A:** The fact didn't exist on Monday. This implies **Presentism** (only the present exists). But if the future doesn't exist, how can we refer to it? And if the past *does* exist (as you imply when you look back on Wednesday), why does the truth value of a proposition depend on the *time of evaluation* rather than the *time of the event*?
      *   **Option B:** The fact existed, but truth is "relative." If truth is relative to the time of evaluation, you are no longer talking about the truth of the *proposition*, but the truth of the *utterance*.
  *   **Why it hurts:** If you say the proposition *itself* changes from Indeterminate to True, you are suggesting that reality itself is retroactively altered. Did the universe gain a new property on Wednesday that it lacked on Monday? If so, you avoid fatalism but invite **metaphysical instability**. If the truth was "waiting" to be discovered, it looks suspiciously like it was true all along (Eternalism), which brings back the fatalism you tried to kill.

  ### 3. The "Right Prediction" Intuition
  **Severity: Medium-High**

  You asked: *"Does it quietly turn into a claim about what we can know rather than about what's true?"*

  It risks collapsing into **Epistemicism**.
  *   **The Scenario:** On Monday, an oracle tells you "There will be a battle." On Tuesday, there is a battle.
  *   **The Intuition:** We want to say the oracle was *right* on Monday.
  *   **The Bite:** On your view, the oracle's statement was *neither true nor false* on Monday. So, strictly speaking, the oracle was not "right." They were merely "not wrong."
  *   **Why it hurts:** This severs the link between truth and successful prediction. If I bet on a horse race on Monday, and the horse wins on Tuesday, I collect my winnings because my claim "Horse X will win" was *true*. If your view holds, my claim wasn't true when I made the bet. It only became true later. This makes the concept of "correct assertion" incoherent. It implies I can never make a true claim about the future, only claims that *become* true. This makes assertion a gamble not on truth, but on *future truth-value acquisition*.

  ### 4. The Fatalism Misdiagnosis
  **Severity: Critical**

  You said: *"That's the only way I can see to stop every future event being fixed in advance."*

  This is the most dangerous part of your view. You may be solving a logical problem while ignoring the physical one.
  *   **The Distinction:** There is **Logical Fatalism** (truth values force events) and **Causal Determinism** (physical laws force events).
  *   **The Bite:** Denying truth values to future contingents stops *Logical* Fatalism. It prevents you from arguing "It was true yesterday, so it must happen today."
  *   **The Reality:** It does **nothing** to stop Causal Determinism. If the universe is physically deterministic, the state of the universe on Monday + Laws of Physics $\rightarrow$ Battle on Tuesday.
  *   **Why it hurts:** You can deny the statement is true on Monday all you like, but if the physical causes are already sufficient on Monday to produce the battle, the future is still fixed. Your view protects **freedom** only if you assume the world is indeterministic to begin with. If the world is deterministic, your semantic trick is just painting over the bars of the cage. You haven't opened the future; you've just refused to label it.

  ### 5. The Unfalsifiability Trap
  **You asked:** *"Be straight with me about whether I've built a view that nothing could ever count against."*

  **Straight talk:** You are dangerously close to this.
  *   **The Defense Mechanism:** Your view has a built-in shield. Any time someone presents a counter-example (e.g., "But it *seems* true now!"), you can reply, "That's because you are evaluating it from a later time." Any time someone says "Logic dictates P or not-P," you reply, "Logic only dictates that for settled matters."
  *   **The Risk:** A theory that explains away all counter-intuitions by appealing to the special status of "the future" risks becoming a **just-so story**.
  *   **What would count against it?**
      1.  **Successful Specific Prediction:** If someone could reliably predict future contingents with 100% accuracy based on current data, it would strongly suggest the truth value was already fixed in the data, even if you deny it was "true."
      2.  **Logical Collapse:** If abandoning LEM forces you to abandon other logical principles you rely on in daily life (like modus tollens), the cost becomes too high.
      3.  **Relativism Slippery Slope:** If truth is relative to the time of evaluation, is it relative to anything else? If I can say "It is true for me now that it was indeterminate then," do we lose the ability to disagree across time?

  ### Summary of the Damage Report

  1.  **Logic:** You break the Law of Excluded Middle. You cannot say "Either it will or it won't" is necessarily true today.
  2.  **Metaphysics:** You struggle to explain *what* changes when the truth value changes. Did the past change? Or was the truth there all along?
  3.  **Language:** You make it impossible to correctly predict the future. You can only be "vindicated" later, not "correct" now.
  4.  **Determinism:** You stop logical fatalism, but not causal determinism. If physics is fixed, your truth-value gaps are irrelevant.

  ### The Verdict

  Your view is **coherent**, but it is **expensive**. It is not "tidier" than the alternative; it just shifts the complexity from *metaphysics* (fixed future) to *logic/semantics* (changing truth values).

  **The hardest question you must answer:**
  If the statement "There will be a battle" is *not true* on Monday, and I act on the assumption that there *won't* be a battle (e.g., I don't fuel the ships), and then a battle happens anyway... was my decision irrational?
  *   If **Yes**: Then the truth was effectively fixed (guiding rational action), and your view is practically empty.
  *   If **No**: Then rational action is disconnected from truth, which breaks the link between belief and action.

  You haven't built a view that *nothing* counts against, but you have built a view that requires you to accept that **logic is less stable than you thought** and **rational assertion is harder than you thought.** If you can live with those costs, the view stands. If you want classical logic and straightforward assertion, you have to let the future be true now.
