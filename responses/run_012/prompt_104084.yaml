answer: |-
  **The Case of the Hovering Pencil**

  Alice and Beth are competent accountants auditing a simple household ledger. Both know (P1) that monthly revenue is \$100, (P2) that expenses are \$90, and (P3) that profit is revenue minus expenses. Both possess the concepts of subtraction and profit, are fully alert, and have ample time to complete the audit. Alice has written "\$10" on the profit line. Beth stares at the same figures, pencil hovering, having verified P1 and P2 individually but not yet performed the subtraction. Neither is confused, careless, or irrational; the only difference is that Alice has executed the calculation and Beth has not.

  ***

  **Analysis**

  **Audit of Responses**

  1.  **The Restriction Response:** This response separates the agents. It claims closure applies only to commitments currently "in play." Alice has the conclusion in play because she actively manipulated the premises to derive it; Beth holds the premises latently but has not activated the fragment containing the conclusion. The case supports this by distinguishing between verified premises and the active synthesis of them.
  2.  **The Non-Standard-Worlds Response:** This response separates the agents but strains against the case's stipulations. It posits that Beth's doxastic alternatives include impossible worlds where $100 - 90 \neq 10$. However, the case stipulates Beth is rational and not confused. Attributing belief in logically impossible scenarios to a perfectly rational agent contradicts the case description, requiring an amendment that equates "unperformed inference" with "logical incompetence," which the case explicitly denies.
  3.  **The Process Response:** This response separates the agents most naturally. It ties knowledge to the procedure actually executed. Alice completed the reasoning procedure; Beth did not. The verdict follows directly from the case's single differentiating feature: the performance of the chain.
  4.  **The Deflationary Response:** This response fails to separate the agents. It claims there is no substantive epistemic difference, only a difference in "scorekeeping" or disposition to assent. Since Beth is disposed to assent (she is rational and grasps the concepts), the deflationist must verdict that Beth *already* knows the profit is \$10. This contradicts the intuition generated by the case: that there is a genuine cognitive gap between calculating and not calculating that affects practical readiness.

  **The Working Feature**

  The single feature doing the work is the **token event of inference** (the actual performance of the calculation). If this feature is removed—such that neither agent performs the calculation—both agents revert to the status of Agent B, and the case collapses into a standard logical omniscience problem where the closure principle appears to fail for both. If the feature is universalized—such that both agents perform the calculation—both revert to the status of Agent A, and logical omniscience is restored for this fragment. The case relies on the *occurrence* of the reasoning, not just the *capacity* for it, to drive a wedge between the agents.

  **Refuted Principle**

  The case refutes **Multi-Premise Closure under Known Entailment** for Agent B. B knows P1, knows P2, knows P3, and knows that they entail C. Yet, B does not know C. Agent A's knowledge is untouched because her epistemic state includes the *actualization* of the entailment via reasoning. The principle fails for B not because of a lack of evidence or rationality, but because knowledge of the conclusion requires the synthesis of premises, not merely their possession.

  **Attack and Defense**

  The **Deflationary Response** fares worst, as it denies the phenomenological gap the case illuminates. A defender would attack the case by arguing: "Beth is committed to the conclusion. If she were asked, she would say '\$10'. To deny she knows it is to fetishize the moment of utterance over the normative commitment."

  This attack can be met by appealing to the **action-guiding role of knowledge**. If a critical decision depends on the profit being strictly positive, Alice acts immediately. Beth hesitates to calculate. This behavioral difference signals a real epistemic difference. If knowledge is the norm of action, Beth's hesitation proves she lacks the knowledge state Alice possesses, regardless of her dispositional commitment. The deflationist cannot explain the hesitation without conceding a substantive difference in state.

  **Conclusion**

  The case demonstrates that logical omniscience is not merely a problem about the semantics of knowledge, but about the **idealization of the knower**. Standard semantics treats the agent as a static set of propositions. This case shows that an agent is a dynamic processor whose epistemic state changes through the *act* of reasoning. Therefore, the idealization that ignores the cost of inference (time, effort, execution) is what must give, not the closure principles themselves, provided those principles are indexed to the performance of reasoning rather than mere logical containment.
