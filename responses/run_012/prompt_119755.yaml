      *   *Decision:* I will argue they are **Four Distinct Problems**. Why? Because the *solution* to each is fundamentally different. You solve (a) with philosophy/politics, (b) with engineering/testing, (c) with interpretability/architecture, and (d) with governance/economics. If the solutions are different, the problems are different.
