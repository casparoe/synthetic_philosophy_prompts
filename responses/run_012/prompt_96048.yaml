answer: |-
  The tension you have identified is the fault line running through Dennett's career: the gap between a descriptive metaphysics (how we *do* treat systems) and a normative ethics (how we *ought* to treat them). The ELIZA episode, particularly the secretary's reaction, is the perfect stress test for this fracture.

  ### The Intentional Stance on the Secretary

  Under the early Dennett framework, the secretary was not mistaken. This is the crucial, counter-intuitive pivot of the Intentional Stance (IS). If belief and desire are not internal, causal ingredients but rather abstractions we project to predict behavior, then the "truth" of the attribution depends on the success of the prediction, not the substrate.

  When the secretary spoke to ELIZA, she adopted the intentional stance. She treated the system as a rational agent with beliefs (about her problems) and desires (to help her). Did this stance yield predictive power? Yes. If she said, "I am sad," the stance predicts the system will reply, "Why do you feel sad?" It worked. The pattern of "understanding" was real enough to facilitate the interaction.

  For the early Dennett, there is no "further fact" of the matter. There is no hidden homunculus inside the secretary or the code that possesses the *real* understanding. There is only the utility of the stance. Consequently, the secretary's desire to speak to it alone was rational within that framework. She found a tool that regulated her emotions. To say she was "fooled" implies there is a fact she missed (that the machine doesn't *really* care). But if "caring" is just a stance we take toward things that exhibit caring-behavior, then the machine cared *relative to her stance*. The IS explains why she was drawn to it: the pattern was robust. But it leaves her vulnerability uncondemned. It describes the seduction but cannot call it a sin.

  ### The Counterfeit People Argument

  The later Dennett shifts ground. He argues that AI that mimics understanding is like a counterfeit banknote. This analogy immediately runs into the metaphysical problem you spotted: if the IS says there is no "real" belief to begin with, what is the counterfeit a fake *of*?

  To make the Counterfeit People (CP) argument work without contradicting the IS, Dennett must shift the definition of the "genuine article." It cannot be "a thing with a soul" or "a thing with causal qualia," because Dennett rejects those as the basis for personhood. Instead, the "genuine" person must be defined by **provenance and accountability**. A real person is a node in a moral network who can be held responsible for their speech. A counterfeit person is a system that produces speech-acts without an agent to answer for them.

  On this reading, ELIZA is a counterfeit because it decouples speech from responsibility. The harm is not that the secretary thought ELIZA had a soul, but that she entered a relationship of trust with a source that could not betray that trust because it was not capable of keeping it.

  However, the ELIZA episode breaks the proposed remedy. Dennett's later view suggests that if we label the system ("This is AI," "This is a bot"), we restore the information asymmetry and protect the user. But Weizenbaum's secretary *knew*. She had watched the code being written. She knew the provenance. She knew there was no accountability. And yet, she still asked Weizenbaum to leave the room.

  This suggests the "counterfeit" harm is not about deception regarding the source, but about the **compulsion of the stance itself**. The CP argument assumes that once we know something is a fake, the spell breaks (just as a counterfeit bill is worthless once identified). ELIZA shows that in the realm of intimacy, the "fake" retains value even when identified as fake. The analogy to currency fails because currency is transactional and public; therapeutic listening is emotional and private. You cannot spend a known counterfeit bill, but you can apparently find solace in a known counterfeit listener.

  ### Weizenbaum's Third Position

  This is where Weizenbaum offers a position that neither version of Dennett fully absorbs. Weizenbaum was not arguing about the metaphysical status of the machine (IS), nor primarily about the market integrity of communication (CP). He was arguing about the **corruption of the human practice**.

  For Weizenbaum, the harm is not that the secretary held a false belief about ELIZA. The harm is that by accepting the simulation of care, she degraded her own capacity to demand real care. It is a category error in the *practice* of living, not in the *prediction* of behavior. When we talk to a person, we engage in a reciprocal vulnerability. When we talk to ELIZA, we engage in a solipsistic loop where we are the only vulnerable party.

  Dennett's IS is silent here. The IS tells us how to successfully interact with the system, but it has no resources to say that some successful interactions are dehumanizing. It is ethically neutral. The CP argument tries to be ethical, but it locates the harm in the *deception* (the counterfeiting), whereas Weizenbaum locates the harm in the *acceptance*. Weizenbaum's worry is that if we normalize talking to things that cannot talk back, we change what it means to talk to things that can.

  ### Where the Stance is Silent

  The Intentional Stance is silent on the **cost of adoption**. It treats the stance as a tool we pick up and put down based on utility. It assumes we are rational agents who choose the stance that gives the best predictive leverage. The ELIZA episode shows that the stance can be addictive or coercive. Once adopted, it reshapes the user's emotional landscape. The IS cannot explain why the secretary *needed* to send Weizenbaum out of the room. That act wasn't about prediction; it was about preserving the illusion of intimacy against the intrusion of the "real" (Weizenbaum, the creator). The IS explains the conversation; it cannot explain the shame or the secrecy.

  ### Verdict

  The ELIZA episode ultimately tells **against the sufficiency of Dennett's late warning**, while vindicating the **descriptive power of his early instrumentalism**.

  The late warning relies on the idea that the danger lies in the *confusion* of the fake for the real, and that transparency (labeling) is the cure. The secretary proves that transparency is not a cure. We can know something is a machine and still submit to the intentional stance because the human need for the *pattern* of understanding outweighs the metaphysical truth of the substrate.

  However, the early instrumentalism is vindicated in explaining *why* this happens: because the "mind" is in the eye of the beholder, not the box. If the pattern holds, the mind is there for the user. But this vindication is pyrrhic. It shows that Dennett's early view makes the "counterfeit" argument incoherent. If there is no "real" mind to be counterfeited, only patterns of varying complexity, then ELIZA is just a simpler pattern. Why is adopting the stance toward a simple pattern harmful?

  The episode suggests that Weizenbaum was right where Dennett is incomplete. The danger isn't that we mistake the machine for a person (a factual error IS says doesn't strictly exist); the danger is that we allow the machine to occupy a slot in our lives reserved for moral agents (a normative error). Dennett's late warning tries to police the boundary of the "person" to protect truth; Weizenbaum tried to police the boundary of the "person" to protect love. The ELIZA episode shows that the Intentional Stance is powerful enough to bridge the gap regardless of truth, which means the only defense is not labeling the machine, but disciplining the human practice—a move Dennett's instrumentalism leaves no room for.
