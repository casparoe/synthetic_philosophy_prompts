      *   *Pushback:* Is Ch. 21 too neat? Yes, it relies on a biological/psychological maturation that feels unearned compared to the trauma. But philosophically, it distinguishes *internal* change vs. *external* constraint.

  4.  **Deconstruct Question 3: The Thought Experiment (Painless Ludovico):**

      *   *Scenario:* No nausea, no Beethoven ruin, reversible. Just can't act on violent urges.
