      *   *Desert-Skeptic Sign-off:* A skeptic can say: "We can quarantine dangerous people, but we cannot rewire their decision-making architecture to bypass their will." This preserves the *status* of the person as an agent, even if we don't think they metaphysically "deserve" blame.
