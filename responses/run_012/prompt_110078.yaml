      *   **Core Question 2:** The Ending (Chapter 21 vs. Film/US Edition). Which version does the philosophical work better? User thinks Ch. 21 helps Dennett (natural maturation vs. forced change). Needs pushback if too neat.
      *   **Core Question 3:** Thought Experiment. Painless, reversible, no Beethoven-wrecking Ludovico. Is it still wrong? If so, what is the *precise* residual wrongness a desert-skeptic can accept? (Distinction between changing wants vs. blocking ability).
