      *   *Caruso's Defense:* Caruso isn't a pure consequentialist. He advocates for a "Public Health-Quarantine Model." Key constraints: *Least restrictive means* and *right to treatment* (not just containment).
      *   *The Conflict:* Ludovico violates bodily autonomy and mental integrity. It's not just incapacitation; it's *manipulation*.
      *   *The Cost:* Caruso has to lean heavily on *rights* that aren't desert-based. He needs a robust theory of agency protection that isn't just "they deserve to keep their agency." He has to argue that undermining agency undermines the *capacity* for moral responsibility in the future (even if basic desert doesn't exist).
      *   *Verdict:* It is a real problem, but not fatal. He condemns it based on *human rights/autonomy* grounds, not *desert* grounds. The cost is admitting that "forward-looking" isn't a blank check for engineering behavior.

  3.  **Deconstruct Question 2: The Endings:**

      *   *Publishing History:* User is mostly right but needs clarification. Burgess wrote 21 chapters. US publisher (W.W. Norton) cut Ch. 21 for the American edition. Kubrick used the US edition, so the film ends at Ch. 20 (Alex restored, ready to violence).
      *   *Philosophical Weight:*
