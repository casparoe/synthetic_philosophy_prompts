  7.  **Addressing the "What Will Go Wrong" (Pre-mortem):**
      *   *Risk 1:* They are already convinced Sim Arg doesn't matter. They won't move credits.
      *   *Risk 2:* They move credits, but for the wrong reason (probability vs. causation).
