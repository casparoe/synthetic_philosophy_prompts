answer: |-
  ## Session Design: The Substrate Lottery

  **Time:** 90 Minutes
  **Participants:** 12 Phil/Econ Grads (High numeracy, familiar with Bostrom/Longtermism)
  **Goal:** Visually and financially isolate *why* the Simulation Argument (Sim Arg) might dampen far-future fanaticism. Is it probability, causal power, or axiological status?
  **Materials:** 
  *   12 Allocation Sheets (paper).
  *   3 Large Envelopes (labeled "Odds," "Causality," "Value").
  *   Whiteboard for aggregate tracking.
  *   Poker chips or printed "Credits" (optional, paper tracking is fine).

  ---

  ### Part 1: The Setup (15 mins)
  **The Choice:**
  Participants have **100 Credits**. They must split them between two projects:
  1.  **Local Relief (LR):** Guaranteed return. 1 Credit = 1,000 Quality-Adjusted Life Years (QALYs) realized *within the next 50 years*.
  2.  **Cosmic Endowment (CE):** High-risk, high-reward. 1 Credit = $10^{24}$ QALYs *if successful*.

  **The Baseline (Round 1):**
  *   **Rule:** CE succeeds if humanity survives and secures the far future.
  *   **Assumption:** Standard Longtermism. Probability of success $P = 10^{-6}$ (one in a million).
  *   **Task:** Allocate your 100 Credits. Record on sheet.
  *   **Expected Math:** $EV_{CE} = 10^{-6} \times 10^{24} = 10^{18}$. $EV_{LR} = 1,000$.
  *   **Prediction:** 100% allocation to CE. (If anyone allocates to LR, note them as "Intuitive Discounters").

  ### Part 2: The Reveal Sequence (45 mins)
  *Do not let them discuss between rounds. Individual commitment first, then aggregate reveal.*

  **Round 2: The Probability Shock (The Bostrom Update)**
  *   **Action:** Open Envelope 1 ("Odds").
  *   **Card Text:** *"The Simulation Argument holds. There is 1 Base Reality and 9,999 Ancestor Simulations. You are randomly sampled from this reference class."*
  *   **New Parameter:** $P(\text{Base}) = 0.0001$. $P(\text{Sim}) = 0.9999$.
  *   **Assumption:** CE only pays out the $10^{24}$ QALYs if you are in **Base Reality**. (Implicitly assuming Sim futures don't count or don't exist yet).
  *   **Task:** Reallocate.
  *   **The Trap:** $EV_{CE} = (10^{-6} \times 0.0001) \times 10^{24} = 10^{14}$. Still vastly superior to LR ($1,000$).
  *   **Expected Behavior:** Rational agents should **not move**. If they move credits to LR, they are intuitively probability discounting (which your hunch says is the wrong move).

  **Round 3: The Causal Severance (The "Wind Out of Sails")**
  *   **Action:** Open Envelope 2 ("Causality").
  *   **Card Text:** *"Causal Isolation Protocol. Simulations are computationally bounded. Actions within a Sim cannot influence the Base Reality's resource allocation or survival probability. The 'Cosmic Endowment' requires physical infrastructure in Base Reality."*
  *   **New Parameter:** If Sim, $Payoff_{CE} = 0$.
  *   **Task:** Reallocate.
  *   **The Math:** $EV_{CE} = 0.0001 \times (10^{-6} \times 10^{24}) = 10^{14}$.
  *   **Wait:** Mathematically, this is identical to Round 2. The *only* thing that changed was the *reason* the Sim payoff is zero (causal vs. probabilistic).
  *   **Crucial Twist for Round 3:** To make the dampening feel real, we must introduce the idea that the *script ends*.
  *   **Revised Card Text:** *"Ancestor Sims are short-running. The simulation terminates in 50 years. There is no 'Far Future' inside the simulation."*
  *   **New Math:** If Sim, $V_{CE} = 0$ (No future exists).
  *   **Expected Behavior:** This is where the fanatical EV drops. But does it drop enough? $10^{14}$ is still fanatical.
  *   **Observation Point:** Watch who moves to LR. If they stay on CE, they are true fanatics. If they move, is it because $10^{14}$ feels smaller, or because they doubt the causal link?

  **Round 4: The Axiological Switch (The "Sim Longtermism" Trap)**
  *   **Action:** Open Envelope 3 ("Value").
  *   **Card Text:** *"Phenomenal Consciousness Confirmed. Simulated beings feel pain and joy identically to Base beings. Sim-QALYs count 1:1."*
  *   **New Parameter:** If Sim, the "Far Future" is the future of the simulation. However, there are 10,000x more Sims than Base beings.
  *   **Task:** Reallocate.
  *   **The Math:** If we are Sims (99.99% chance), the CE project saves $10^{24}$ *Sim* QALYs. Since there are more Sims, the total value at stake is potentially *higher* than Base Reality.
  *   **Expected Behavior:** Allocation to CE should **increase** or stay maxed.
  *   **The Point:** This tests the "Currency" assumption. If they dampened in Round 3 but ramp up in Round 4, they admit the dampener was axiological, not probabilistic.

  ### Part 3: The Debrief (30 mins)
  *Map the movements on the whiteboard.*

  1.  **Round 1 -> 2 (Probability):** Did anyone move?
      *   *If No:* Confirms your hunch. Probability discounting doesn't kill fanaticism. $10^{30} \times 0.1$ is still godlike.
      *   *If Yes:* They are treating probability as a psychological threshold, not an EV multiplier.
  2.  **Round 2 -> 3 (Causality/Existence):** Did anyone move?
      *   This is the only place the "dampening" intuition *should* live. If the future *doesn't exist* for sims, the value is zero. But the *expected* value is still huge due to the Base chance.
      *   *Discussion:* Why does the 0.01% Base chance still dominate? (Because the payoff is infinite-adjacent).
  3.  **Round 3 -> 4 (Axiology):** Did anyone move?
      *   *If CE goes up:* You've proven Sim Arg might *boost* longtermism (Sim Longtermism).
      *   *If CE stays down:* They are asserting Sim-QALYs don't count (Axiological Nihilism).
  4.  **The Synthesis:**
      *   The Sim Arg only dampens fanaticism if:
          1.  Sim-QALYs count for **nothing** (Axiological claim).
          2.  **AND** we cannot affect the Base Reality (Causal claim).
          3.  **AND** the probability of Base Reality is low enough to overcome the astronomical magnitude (which it usually isn't).
      *   *Conclusion:* The "wind out of the sails" isn't the probability; it's the **ontological status of the welfare**.

  ---

  ### Pre-Mortem: What Will Go Wrong?

  **1. The "Dud" Scenario (Everyone stays Fanatical)**
  *   **What happens:** They allocate 100 to CE in every single round.
  *   **Why:** The numbers ($10^{24}$) are too big. Even a 0.01% chance of $10^{24}$ dwarfs 1,000.
  *   **Diagnosis:** This actually **validates your hunch**. The activity succeeds by showing that *nothing* short of axiological nihilism stops the math.
  *   **Fix:** In the debrief, explicitly call this out. "You just proved that probability discounting is impotent. The only way to stop this is to claim simulated lives are fake."

  **2. The "Intuitive Discount" Scenario (Everyone moves to LR in Round 2)**
  *   **What happens:** They see "1% chance we are real" and immediately dump CE.
  *   **Why:** Humans are not expected value maximizers; they are threshold satisficers. 1% feels like "almost never."
  *   **Diagnosis:** They failed the "Econ Grad" test. They are treating probability as a binary switch.
  *   **Fix:** Call out the math. $10^{24} \times 0.01$ is still $10^{22}$. Ask them: "Would you trade a 1% chance of saving the universe for 1,000 lives?" Shame the intuition.

  **3. The "Sim Longtermism" Confusion**
  *   **What happens:** In Round 4, they argue that if Sims count, we should focus on *Sim* welfare, which might be different from CE.
  *   **Why:** They realize "Far Future" inside a Sim might mean "preventing the Sim from being turned off."
  *   **Diagnosis:** This is a feature, not a bug. It highlights that Sim Arg changes *what* we optimize, not just *how much*.
  *   **Fix:** Allow this nuance. It strengthens the point that Sim Arg complicates the target, not just the odds.

  **4. Time Creep**
  *   **What happens:** Round 1 takes 40 minutes because they argue about the $10^{-6}$ baseline.
  *   **Fix:** Be a dictator on the baseline. "For the purpose of this game, $P=10^{-6}$. Do not debate the physics, debate the allocation."

  ---

  ### If the Design Doesn't Land: The Pivot

  **Which feature to change first?**
  The **Payoff Magnitude**.
  If they stay fanatical throughout (which is theoretically correct but feels like a dull session), the tension evaporates.
  *   **Change:** Reduce the CE Payoff from $10^{24}$ to $10^{9}$ (1 billion lives).
  *   **Why:** Now, $10^{9} \times 0.0001$ (Base Prob) = $10^{5}$. This is comparable to the Local Relief ($1,000 \times 100 \text{ credits} = 10^{5}$).
  *   **Result:** This makes the allocation **sensitive** to the probability updates. In Round 2 (Sim Odds), the EV of CE drops below LR. They *must* move credits to feel the pull.
  *   **Trade-off:** It makes them look less "fanatical" by definition, but it makes the *mechanics of the dampening* visible.

  **Where is my reasoning about participants most likely to be off?**
  I am assuming they care about **consistency**.
  *   **Risk:** They might treat each round as a new, independent universe rather than updating a prior.
  *   **Mitigation:** Emphasize: "You are the same agent. You are just receiving new information about the universe you are in. Your credits are your only leverage."
  *   **Risk:** They might argue that *being a Sim* increases the probability of the Simulators intervening, which adds a new variable (Theological/Interventionist EV).
  *   **Mitigation:** Shut this down in the rules. "Simulators are indifferent. No intervention."

  ### Final Note on the "Dampening" Claim
  Be prepared to admit in the debrief: **"The Simulation Argument does not dampen fanaticism via probability."**
  If the game works, they will see that $P(\text{Base}) \times V(\text{Astronomical})$ is still Astronomical.
  The only way the wind leaves the sails is if $V(\text{Sim}) = 0$.
  The activity forces them to realize that their intuition ("Sims don't matter") is an **axiological claim**, not a probabilistic one. They are claiming simulated suffering is fake. That is a much heavier philosophical pill to swallow than "we might be sims," and the game should make them feel the weight of that commitment.
