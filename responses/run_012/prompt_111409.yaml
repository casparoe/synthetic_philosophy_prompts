      *   **Failure Analysis:** If they stay fanatical, it proves the user's hunch (Prob discounting fails). The game succeeds by *not* moving them until the Causal/Value rule is introduced.

  9.  **Structuring the Response:**
      *   **Session Overview:** Time, Goal, Materials.
