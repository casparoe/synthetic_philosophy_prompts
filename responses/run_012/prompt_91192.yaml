answer: |-
  **Verdict: Cut Premise (4).**

  **The Diagnosis**
  Your flatmate has baited a trap, but it isn't an ethical trap; it's an epistemological one. She has constructed a *global* skeptical argument that uses evolution as a lever. By accepting (1) and (2), you've conceded the genealogical point. By rejecting (7), you've conceded that global skepticism is untenable. The only logical pressure point left is (4): *"A belief that comes out of a faculty you can't independently certify is unjustified."*

  This premise looks plausible because it appeals to **Internalism**: the intuition that to be justified, you must have cognitive access to *why* your belief is reliable. It feels responsible to demand proof of your tools before using them. But in this context, (4) is a "poison pill." It demands a standpoint outside of your own cognition to validate your cognition. As your flatmate correctly notes in (6), no such standpoint exists for *any* faculty (logic, perception, memory). If you keep (4), you must accept (7). If you want to reject (7), you *must* reject (4).

  **The Cost**
  Giving up (4) means abandoning Internalism for **Externalism** (specifically, Reliabilism).
  *   **What you lose:** You lose the requirement that justification must be transparent to the believer. You have to accept that a creature can be justified in holding a belief even if it has no internal evidence that its belief-forming faculty is reliable. You cannot distinguish, from the inside, between a reliable faculty and a convincing delusion.
  *   **Who pays:** You pay with "intellectual security." You can no longer claim your moral beliefs are justified because you've *proven* they track truth. They are justified because they are *produced* by a process that (as it happens) tracks truth, whether you can prove it or not.
  *   **Why it's worth it:** This saves not just morality, but science and perception. It acknowledges that we are embedded agents, not gods looking down on our own minds.

  **Why Not the Other Cuts?**
  *   **Cutting (6) (Morality is Special):** This is the "expensive" cut. It requires you to prove that moral facts causally influence our beliefs in a way that physical objects influence perception. This is metaphysically heavy and looks like special pleading. Your flatmate is right: structurally, the "Problem of the Criterion" applies to vision just as much as virtue. Trying to carve morality out as an exception makes you look squeamish.
  *   **Cutting the Step from (2) to (3) (Third-Factor):** This argues that fitness and moral truth correlate (e.g., "survival is good"). While this explains why the beliefs are *true*, it doesn't satisfy (4). A third-factor explanation still relies on reasoning (another faculty you can't independently certify). If (4) stands, the third-factor argument is just another uncertified output. You still have to cut (4) to let the third-factor argument work.

  **The Thought Experiment for Your Paper**
  To demonstrate why (4) is the failure point, use a variation of the **"Reliable Clairvoyant"** case, adapted for evolution.

  *   **The Case:** Imagine two species. *Homo Sapiens* has a moral faculty shaped by evolution to track fitness. *Homo Angelicus* has a moral faculty shaped by evolution to track fitness, but also has a "Third-Factor" mechanism ensuring fitness aligns with moral truth.
  *   **The Kicker:** From the *inside*, a human and an angelic being have the exact same moral experiences and the exact same inability to "step outside" their faculties to certify them.
  *   **The Test:** If Premise (4) is true, *neither* is justified, because neither can independently certify the faculty. This leads to the absurdity that the Angelic being (whose beliefs actually track truth) is no more justified than the Skeptic.
  *   **The Conclusion:** If you intuit that the Angelic being *is* justified despite lacking independent certification, you have rejected (4). Once you reject (4) for the Angelic being, you must reject it for the Human, unless you can show the Human faculty is *unreliable*. But your Premise (2) only says there's "no reason to think they line up," not that they *don't*.
  *   **The Punchline:** Justification is a matter of the *actual reliability* of the process (Externalism), not the *availability of a certificate* (Internalism). Since we have no reason to think our moral faculty is *unreliable* (only that it isn't certified), and we must assume *some* faculties are reliable to function at all, we are entitled to trust the moral faculty by default.

  **Summary for your Paper**
  Argue that the flatmate's argument is a *reductio ad absurdum* of Internalist justification, not a successful debunking of ethics. The "squeamishness" you feel about (7) is a reliable philosophical instinct: if an argument proves that logic itself is unjustified, the fault lies in the epistemological standard (Premise 4), not the world. Keep the evolutionary story, keep the moral beliefs, but change the definition of justification.
