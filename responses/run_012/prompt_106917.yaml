prompt: |-
  Okay, so here's my situation. I'm a science and ideas reporter at a mid-size daily — I do the Thursday science page and one longer feature a month — and my inbox is a firehose of archaeology press releases. I keep getting burned. Last month I ran a piece built around a release that said a burial "proves" a prehistoric community had a belief in an afterlife, and a friend of mine who actually did her PhD in this stuff was polite about it but basically said the release had smuggled in about four inferential steps and I'd reported the last one as if it were the first. I don't have time to read site reports. I usually have the press release, maybe an abstract, a photo, and sometimes a 10-minute phone call with a lead author who is on a dig and calling me from a jeep.

  What I want from you: a procedure. Something I can actually run on a release in about 10-15 minutes and that tells me how much of the claim I can responsibly report, how I should hedge it, and when I should just spike it.

  So — you're a philosopher of science who specializes in archaeological inference, the epistemology of how you get from dirt, bones, and pots to claims about what people believed, valued, or how their institutions worked. Before you write anything, brainstorm for a minute about the ways this kind of reasoning goes wrong, and be specific about which of those failure modes are visible from a press release versus which ones are invisible from where I'm sitting. Then think step by step and give me the procedure.

  Please build it around the stuff that actually matters, not generic "consider the source" advice. Off the top of my head the things I've heard matter: whether the object was found in a secure context at all (provenience, stratigraphy, association), what happened to the deposit between when people dropped it and when someone dug it up, the fact that one pattern can have many different causes, the difference between showing that people *did* something and showing that they *believed* something, and the old rule of thumb that you can read technology off of tools pretty well, subsistence a little worse, social organization with real difficulty, and belief almost never. Analogies to living societies seem to tell you what's possible rather than what happened. Use whatever's right from that list and add what I'm missing.

  Format: ordered questions I ask in order, what counts as a sufficient answer to each, where the procedure stops and says "you can't run this claim," and — this matters — where it hands off to my judgment or to an actual archaeologist because the question is about values or about something I can't see from a release. Flag the steps that are judgment calls dressed up as procedure. I'd love a two-minute version too, like the three questions I ask when I'm on deadline.

  Then run it on three cases: (1) a release about a roughly 30,000-year-old burial of two children with thousands of pierced shell beads, framed as evidence of religious belief; (2) a release about a burned destruction layer with arrowheads lodged in a wall at a fortified settlement, framed as proof of a violent conquest; and (3) a case I'm not going to enjoy — a release about imported pottery turning up in a provincial town, which is the spine of a feature I've already half-written about the town being a cosmopolitan trade hub. Tell me straight what your procedure says I can and can't report there.

  Finish with what this procedure can't do, and which kinds of releases will defeat it no matter how carefully I follow it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** Science/ideas reporter at a mid-size daily. Busy, under deadline pressure, gets burned by overhyped archaeology press releases.
      *   **My Persona:** Philosopher of science specializing in archaeological inference/epistemology.
      *   **Task:** Create a 10-15 minute procedure to evaluate archaeology press releases.
      *   **Requirements:**
          *   Brainstorm failure modes (visible vs. invisible).
          *   Step-by-step procedure (ordered questions, sufficient answers, stop conditions, judgment flags).
          *   Two-minute "deadline" version (3 questions).
          *   Apply procedure to three specific cases (Burial/Religion, Destruction/War, Pottery/Trade).
          *   Limitations section (what the procedure can't do).
      *   **Tone:** Professional, direct, pragmatic, epistemologically rigorous but accessible. No generic advice.

  2.  **Brainstorming Failure Modes (Epistemology of Archaeology):**
      *   *The Transformational Problem (taphonomy):* Did nature move this bone, or did people? Is that burn layer a fire or a lightning strike?
      *   *The Equifinality Problem:* One pattern, many causes. (e.g., broken pots = ritual breakage OR clumsy servant OR earthquake).
      *   *The Inference Chain:* Dirt $\rightarrow$ Artifact $\rightarrow$ Activity $\rightarrow$ Social Pattern $\rightarrow$ Cognition/Belief. Each step adds uncertainty.
      *   *Context:* Is it *in situ*? Or looted? Or mixed layers?
      *   *Analogy:* Using modern/ethnographic parallels. Is it heuristic or proof?
      *   *Sampling:* Is this one grave representative or an outlier?
      *   *Dating:* Is the date on the object or the layer? (Old Wood Problem).
      *   *Visible from Release:* Claims about belief, causal language ("proves"), dating methods mentioned, context descriptions ("intact burial").
      *   *Invisible from Release:* Actual stratigraphy, taphonomic analysis, alternative hypotheses considered by authors but downplayed, peer review status (sometimes), sample size.

  3.  **Developing the Procedure (The "15-Minute Triage"):**
      *   Need to structure this as a flowchart or ordered checklist.
      *   *Step 1: The Inference Leap.* What are they claiming vs. what did they find? (Material $\rightarrow$ Mental).
      *   *Step 2: Context & Integrity.* Is the dirt trustworthy? (Provenience, Stratigraphy).
      *   *Step 3: Equifinality.* Did they rule out other causes?
      *   *Step 4: Dating & Association.* Is the object actually from that time/place?
      *   *Step 5: The "So What?" Check.* Is the headline justified by the evidence strength?
      *   *Flags:* Need to explicitly mark where the reporter needs to make a judgment call vs. where the science is clear.

  4.  **Developing the "Two-Minute Version":**
      *   Needs to be the absolute core.
      *   1. What is the gap between dirt and claim?
      *   2. Is the context secure?
      *   3. Did they kill the alternatives?

  5.  **Running the Cases:**
      *   *Case 1 (Burial/Beads/Religion):* High inference leap (objects $\rightarrow$ belief). Context likely okay (burial), but "religion" is a huge leap. *Verdict: Hedge heavily.*
      *   *Case 2 (Burned Layer/Arrowheads/War):* Medium inference. Fire + Weapons = Violence? Could be accident + hunting tools. But stronger than belief. *Verdict: Reportable with caveats about "conflict" vs "conquest".*
      *   *Case 3 (Pottery/Trade/Cosmopolitan):* Low inference (objects moved), high generalization (one pot = trade hub). *Verdict: Dangerous. Correlation $\neq$ System.*

  6.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the role. Set the tone (epistemological rigor).
      *   *Brainstorm:* List the failure modes clearly. Distinguish visible/invisible.
      *   *The Procedure:* Numbered steps. "Stop" conditions. "Judgment Call" flags.
      *   *The 2-Minute Version:* Concise.
      *   *Case Studies:* Apply the logic strictly.
      *   *Limitations:* Be honest about what a press release can hide.

  7.  **Refining the Epistemology (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't sound like I'm saying "you can't know anything." Archaeology *does* know things. It's about *confidence intervals*.
      *   *Correction:* Ensure the distinction between "Activity" (burial) and "Belief" (afterlife) is central. That was the user's specific pain point.
      *   *Refinement on Case 3:* This is the trickiest. Imported pottery *does* prove contact. It doesn't prove a "hub." Need to distinguish between the fact (contact) and the system (hub).
      *   *Refinement on Procedure:* Add a specific step about "Alternative Hypotheses." Press releases often hide the null hypothesis.

  8.  **Final Review against Constraints:**
      *   Did I brainstorm failure modes? Yes.
      *   Is there a procedure? Yes.
      *   Are there stop conditions? Yes.
      *   Are judgment calls flagged? Yes.
      *   Is there a 2-minute version? Yes.
      *   Are the 3 cases run? Yes.
      *   Is there a limitations section? Yes.
      *   Tone check: Philosopher of Science, not PR guru.

  9.  **Final Polish:** Check for clarity and punchiness. Ensure the "Judgment Call" flags are obvious. (e.g., using **[JUDGMENT CALL]** tags).

  *(Self-Correction during final review)*: Wait, I need to make sure I explicitly address the "values" aspect mentioned in the prompt ("where it hands off to my judgment... because the question is about values"). This usually comes in when deciding if a claim is "significant" enough to report despite uncertainty. I will add a step regarding "Significance vs. Certainty."

  Let's assemble the response.cw
answer: |-
  ### Part 1: Brainstorming Failure Modes
  *The Epistemology of the Press Release*

  Before we build the filter, we need to know what we are filtering out. Archaeological inference is a chain of reasoning. Press releases often present the conclusion as if it were the observation. Here is where the chain breaks, categorized by what you can see from your desk versus what is hidden in the dirt.

  **Visible from a Press Release (The Rhetorical Red Flags)**
  1.  **The Cognitive Leap:** Claiming access to mental states (belief, religion, ideology) from material states (beads, ochre, orientation). *Failure Mode:* Conflating *practice* with *meaning*.
  2.  **Causal Singularity:** Asserting one cause for a complex pattern (e.g., "This burn layer proves war"). *Failure Mode:* Ignoring equifinality (different processes produce identical results).
  3.  **Scale Jumping:** Using a single site to characterize a region, or a single generation to characterize a millennium. *Failure Mode:* Sampling bias presented as typology.
  4.  **Temporal Smearing:** Treating a site as a "snapshot" when it may be an accumulation of centuries. *Failure Mode:* The "Pompeii Premise" (assuming everything found together was used together).

  **Invisible from Your Desk (The Black Box)**
  1.  **Taphonomy:** The natural processes that moved the dirt/bones after deposition. Did a river sort those beads, or a person? You usually have to take the release's word on "intact context."
  2.  **Stratigraphic Integrity:** Was the layer sealed? Was it cut by a later pit? Press releases say "found in," but rarely "securely stratified within."
  3.  **The Null Hypothesis:** Did the authors test against the possibility that this is random noise? Press releases rarely publish negative results or failed alternative models.
  4.  **Dating Resolution:** Is the date on the object, or the layer? Is it radiocarbon (precise) or typological (circular)?

  ---

  ### Part 2: The 15-Minute Triage Procedure

  This procedure is designed to assess the **Inference Chain**. Your goal is not to verify the science (you can't), but to verify the *distance* between the evidence and the claim.

  **Step 1: Identify the Observation and the Claim**
  *   **Action:** Write down the physical object/event found (Observation) and the headline conclusion (Claim).
  *   **Sufficient Answer:** Observation = "Beads in a grave." Claim = "Belief in afterlife."
  *   **Stop Condition:** If the Claim is about *meaning* (belief, ritual, status) but the Observation is purely *material* (object, bone, chemical), proceed to Step 2. If Observation = Claim (e.g., "Pot found" / "Pot exists"), you can report the fact, but not the story.
  *   **[JUDGMENT CALL]:** If the leap is from Material $\rightarrow$ Cognition (Belief), you must assume high uncertainty unless Step 3 clears it.

  **Step 2: Check Contextual Integrity (The "In Situ" Test)**
  *   **Action:** Scan for keywords regarding discovery context. Look for: *in situ, sealed context, primary deposition, undisturbed, stratigraphic layer.*
  *   **Sufficient Answer:** "Excavated from a sealed burial pit," "Associated faunal remains."
  *   **Warning Signs:** "Surface find," "Collected by locals," "Rescue excavation" (sometimes implies rushed/less rigorous), "Loose context."
  *   **Stop Condition:** If the context is "surface," "looted," or "unstratified," **SPIKE THE CLAIM.** You can report the object exists, but you cannot report what it *means* historically.
  *   **[JUDGMENT CALL]:** "Rescue excavation" isn't automatically bad, but it increases risk. If the claim is extraordinary, spike it. If mundane, hedge it.

  **Step 3: The Equifinality Check (The "What Else?" Test)**
  *   **Action:** Look for language acknowledging alternative explanations. Does the text say "suggests," "indicates," or "consistent with"? Or does it say "proves," "confirms," "reveals"?
  *   **Sufficient Answer:** The release mentions at least one alternative (e.g., "While ochre could be for preservation, the placement suggests...").
  *   **Stop Condition:** If the release uses definitive verbs ("proves") for high-inference claims (belief, war, trade systems) without mentioning alternatives, **DOWNGRADE THE HEADLINE.** You cannot report "proof."
  *   **[JUDGMENT CALL]:** You must decide if the alternative explanations are trivial. (e.g., "Maybe aliens" is not a valid alternative. "Maybe natural fire" is).

  **Step 4: Association and Dating (The "Together-ness" Test)**
  *   **Action:** Check how the date was derived. Is the object dated directly (AMS on bone) or by association (pottery style in the same layer)?
  *   **Sufficient Answer:** "Radiocarbon dated to," "Directly associated with."
  *   **Warning Signs:** "Dated to the [Period Name] based on style," "Found near."
  *   **Stop Condition:** If the claim relies on two things being contemporary (e.g., "Man held spear") but the dating is typological or based on proximity ("found near"), **HEDGE HEAVILY.** Use "possibly contemporary."

  **Step 5: The Generalization Limit**
  *   **Action:** Compare the sample size to the scope of the claim.
  *   **Sufficient Answer:** One grave $\rightarrow$ Claim about "this individual." 50 graves $\rightarrow$ Claim about "this community."
  *   **Stop Condition:** If one site is used to claim a shift in "human behavior" or "civilization," **RESTRICT SCOPE.** Report it as "this community," not "prehistoric man."
  *   **[JUDGMENT CALL]:** This is where news value fights accuracy. A single grave *can* be paradigm-shifting if it breaks a total absence of prior evidence. But you must state the absence.

  ---

  ### Part 3: The Two-Minute "Deadline" Version

  When you are on the phone with the editor and the release just dropped:

  1.  **The Leap:** Are they claiming they found a *thing* (bone, pot) or a *thought* (belief, motive)? If it's a thought, cut the certainty by 50%.
  2.  **The Dirt:** Does the release say "in situ" or "sealed"? If no, or if it says "surface," you cannot report the historical narrative, only the discovery.
  3.  **The Alternatives:** Does the author admit there could be another reason for this pattern? If they say "proves," change it to "suggests."

  ---

  ### Part 4: Running the Cases

  Here is the procedure applied to your specific inbox items.

  #### Case 1: 30,000-year-old burial, children, shell beads. Claim: "Religious Belief."
  *   **Step 1 (Leap):** Observation = Beads in dirt with bones. Claim = Religious belief/Afterlife. **High Inference Leap.**
  *   **Step 2 (Context):** Assuming release says "intact burial." **Pass.**
  *   **Step 3 (Equifinality):** Did they rule out status marking? Ornamentation without spiritual intent? Grief display rather than theology? Press releases rarely distinguish "ritual" from "religion."
  *   **Step 4 (Association):** Beads associated with bodies? Likely yes.
  *   **Step 5 (Generalization):** Two children $\rightarrow$ Whole community belief? Risky.
  *   **Verdict:** **HEDGE HEAVILY.**
      *   *Can Report:* The burial occurred; the beads were placed intentionally; this suggests complex social behavior or symbolic thought.
      *   *Cannot Report:* "Proof of afterlife," "Religion," "Spiritual beliefs."
      *   *Wording:* "Archaeologists argue the placement *may indicate* a concept of an afterlife, though others suggest it *could reflect* social status."
      *   *Why:* You cannot dig up a belief. You dig up a treatment of the dead. The belief is an inference, not a find.

  #### Case 2: Burned layer, arrowheads in wall. Claim: "Violent Conquest."
  *   **Step 1 (Leap):** Observation = Fire + Projectiles. Claim = War/Conquest. **Medium Inference Leap.**
  *   **Step 2 (Context):** "Destruction layer" usually implies stratigraphy. **Pass.**
  *   **Step 3 (Equifinality):** Could the fire be accidental? Could the arrowheads be hunting tools lodged during a non-war event? (Less likely if *in* the wall).
  *   **Step 4 (Association):** Arrowheads embedded in wall = contemporary with wall use. **Strong.**
  *   **Step 5 (Generalization):** One wall $\rightarrow$ Conquest of settlement? Plausible.
  *   **Verdict:** **REPORTABLE WITH CAVEATS.**
      *   *Can Report:* Evidence of violent destruction; fire and weaponry found together.
      *   *Cannot Report:* "Proof of conquest" (implies political outcome, not just violence). "Massacre" (implies bodies, unless found).
      *   *Wording:* "Evidence points to a violent attack," rather than "Proof of war."
      *   *Why:* Fire + Weaponry in a wall is a strong index of violence. But "Conquest" implies a political change of power which dirt alone rarely confirms without textual support.

  #### Case 3: Imported pottery in provincial town. Claim: "Cosmopolitan Trade Hub." (Your Feature)
  *   **Step 1 (Leap):** Observation = Foreign Pot. Claim = Trade Hub/System. **Medium Inference Leap.**
  *   **Step 2 (Context):** Assuming secure context. **Pass.**
  *   **Step 3 (Equifinality):** How did the pot get there? Trade? Gift? Loot? Dowry? One-off journey by a traveler?
  *   **Step 4 (Association):** Pot is from the time period. **Pass.**
  *   **Step 5 (Generalization):** One pot (or a few) $\rightarrow$ "Hub" (Systemic, regular exchange). **FAIL.**
  *   **Verdict:** **PULL THE THESIS, KEEP THE FACT.**
      *   *Can Report:* The town had contact with distant regions; foreign goods were present.
      *   *Cannot Report:* It was a "cosmopolitan hub" or a "trade center."
      *   *Wording:* "The presence of imported wares suggests the town was connected to wider networks, though archaeologists debate whether this indicates regular trade or sporadic contact."
      *   *Why:* This is the "Sampling" failure mode. A single import proves *contact*, not *commerce*. A "hub" implies infrastructure, volume, and regularity. You have written a feature about a *system* based on an *artifact*. You need to pivot the story to "Evidence of long-distance contact challenges view of isolation," not "Town was a metropolis."

  ---

  ### Part 5: Limitations & Defeat Conditions

  This procedure protects you from the most egregious errors, but it is not armor. Here is where it will fail you:

  1.  **The "Consensus" Lie:** Sometimes a press release claims "Scientists agree..." when in fact the field is deeply divided. You cannot see the peer-review controversy from the release. *Mitigation:* If the claim is revolutionary, spend 5 minutes emailing one independent expert (not the author).
  2.  **The Taphonomic Black Box:** If the authors are incompetent at stratigraphy, the release will still say "intact." You are trusting their competence. *Mitigation:* Check the Journal. A release for *Nature* or *Antiquity* has higher clearance than a university blog post.
  3.  **The "New Method" Hype:** If they used a new chemical test (e.g., "Proteomics reveals diet"), the procedure might pass it, but the method might be unproven. *Mitigation:* Look for the phrase "pilot study" or "first application." If present, double the hedging.
  4.  **Values and Significance:** This procedure tells you if a claim is *warranted*. It does not tell you if it is *important*. Sometimes a weakly supported claim is culturally significant (e.g., indigenous oral history confirmed). That is an editorial judgment, not a scientific one.

  **Final Advice:** Your friend was right. The release reported the inference as the observation. Your job is to put the ladder back in the story. Show the rungs. If the ladder is missing, tell the reader the archaeologists are climbing on faith.
