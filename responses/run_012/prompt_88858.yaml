answer: |-
  **The Case**

  Mara spends twenty minutes every evening manually re-typing her already-digitized grocery receipts into a leather ledger. She knows the digital copies are secure, searchable, and sufficient for taxes; she knows the ledger will never be read, has no resale value, and offers her no aesthetic pleasure—she finds the task tedious. She is not depressed, distracted, or physically unable to do it. She possesses a standing, brute desire for "analog redundancy" which she reflectively endorses as her highest non-moral priority, agreeing without hesitation that she ought to maintain the ledger. Yet, consistently, she simply does not type them. She sits at the desk, acknowledges the commitment, feels no competing pull toward leisure or comfort, and yet the typing does not happen. She is not ignorant of the means, nor does she miscalculate; she just fails to execute the action she fully endorses and is fully capable of performing, without experiencing the conflict typical of weakness of will.

  ***

  **The Check**

  **Internalist Verdict:** Mara has a reason. Since the desire for analog redundancy is in her Subjective Motivational Set ($S$) and survives sound deliberation (she endorses it), she has an internal reason to type the receipts. Her failure is **irrationality** (specifically, instrumental incoherence). She has an end, acknowledges the means, has the ability, but fails to take the means without a defeating condition.
  *   **Principle:** *Means-End Coherence* (or the Hypothetical Imperative). If you will the end, you must will the necessary means.

  **Externalist Verdict:** Mara has no reason. The activity is objectively valueless (no truth, beauty, welfare, or knowledge is served). Desires do not create reasons; only objective values do. Since there is no reason to type the receipts, her failure to do so is **not rationally criticisable**. It is a mere mismatch between her psychology and the world, like failing to collect bottle caps.
  *   **Principle:** *Value-Grounding*. Reasons are grounded in objective goods, not subjective states. No good, no reason; no reason, no rational requirement.

  **Load-Bearing Feature**
  The **objective valuelessness of the end**. If the ledger-keeping produced art, historical record, or even genuine pleasure, the Objectivist would be forced to concede there is *some* reason, collapsing the acquittal. If the desire were absent, the Internalist would concede there is no reason, collapsing the conviction. The case relies entirely on the divergence between *subjective endorsement* (Internalist reason) and *objective worth* (Externalist reason).

  **The Williams-Style Attack**
  A Williams-style internalist would attack the **stability of the motivational set**. Williams argues that "sound deliberation" isn't just checking consistency; it involves imagining the reality of the project. If Mara deliberates soundly, she would realize the task is pointless (even by her own lights, since she admits it serves no further end). The internalist would argue that a desire surviving *truly* sound deliberation would necessarily motivate action. If she isn't motivated, the desire wasn't truly in $S$ in the relevant way, or she hasn't deliberated soundly.
  *   **Escape Hatch:** The internalist can claim Mara *is* irrational, preserving the verdict, but at the cost of admitting that "sound deliberation" cannot cure her.
  *   **Cost:** This concedes that agents can have internal reasons they are structurally unable to act on, which weakens the internalist's claim that reasons are essentially explanatory of action.

  **The Soft Spot**
  The **Apparent Reasons** objection. Many Objectivists (e.g., Parfit) distinguish between *Objective Reasons* (facts) and *Subjective/Apparent Reasons* (beliefs/desires). If the Objectivist admits Mara has a *subjective* reason (because she *believes* she ought), then she is rationally criticisable for failing to follow it. To secure the acquittal, the Objectivist must be a **Hard Reasons Fundamentalist** who denies subjective reasons have any rational force. If you allow "rationality is responding to apparent reasons," the Objectivist verdict flips to "irrational," and the case collapses.
  *   **Rebuild?** You cannot rebuild this easily. If you grant apparent reasons, the theories converge on the verdict (both say irrational). To keep them apart, you must force the Objectivist to ignore the agent's perspective entirely, which is a costly restriction for the Objectivist.

  **The Honest Bit**
  The constraint that breaks the case is **"no weakness of will."**
  By definition, judging that one ought to do $X$, having the ability to do $X$, and not doing $X$ (without ignorance or compulsion) *is* weakness of will (akrasia). You have stipulated the *structure* of akrasia while forbidding the *phenomenology* ("no felt pull"). This describes a philosophical zombie or an agent with a broken will, not a standard rational agent.
  *   **Which constraint breaks it?** The combination of "agrees she ought" + "just doesn't do it" + "no weakness of will."
  *   **Closest Survival:** If you allow **Procedural Negligence** instead. Mara treats the task as a bureaucratic rule she neglects, rather than a desire she resists. She doesn't feel *tempted* to skip it; she just treats it as a low-priority admin task she consistently overlooks, despite *judging* it high priority. This isn't classic akrasia (conflict), but it is **Judgment-Action Incoherence**.
  *   **Does the reverse direction hold?** Barely. The Internalist can still call this irrational (incoherence). The Objectivist can still call it rational (no value lost). But the "no weakness of will" constraint forces you into a description of agency that many philosophers (including Williams) would reject as impossible. If an agent truly judges $X$ best and is free to do $X$, they do $X$. If they don't, they either didn't truly judge it best (self-deception) or were weak-willed. You cannot have it both ways without fudging the psychology.
