answer: |-
  **Examination Question**

  **Time Allowed:** 45 Minutes
  **Word Limit:** 800 Words Maximum

  **Question:**

  Consider the following case: A renowned expert in a complex field, known for perfect reliability and honesty, announces that she will pay you a large sum of money if you come to believe a specific, difficult proposition *p*. Because of her reliability, the mere fact that she offers this reward is strong evidence that *p* is true (she would not offer a reward for believing a falsehood). Consequently, the offer provides you with both a pragmatic incentive to believe *p* and evidential support for the truth of *p*.

  In this specific context, analyze the normative forces at play. What, if anything, distinguishes the right-kind reason from the wrong-kind reason for believing *p*? Furthermore, explain whether this distinction can be defined without circularity (i.e., without defining the right kind of reason merely as that which makes the attitude fitting). Your answer should rely on conceptual analysis rather than citation of specific authors.

  ***

  **Model Answer**

  In this scenario, the single fact of the expert's offer generates two distinct normative pressures on the subject. To distinguish the right-kind reason (RKR) from the wrong-kind reason (WKR), we must disentangle the *basis* upon which the fact counts as a reason, rather than looking solely at the source of the reason. Although the offer is the common source, it supports belief in *p* via two different pathways: the pathway of gain and the pathway of likelihood.

  The pragmatic incentive is a WKR. The prospect of financial gain is a reason to *want* to believe *p*, or to bring it about that one believes *p*, but it does not bear on the truth of *p*. Belief, by its nature, is an attitude that purports to represent reality. A reason counts as the "right kind" for belief only if it bears on the correctness condition of that attitude, which is truth. The money does not make *p* more likely to be true; it merely makes the *state of believing* more beneficial. Therefore, the incentive is a state-given reason: it speaks to the value of being in the mental state, not the merit of the object of that state.

  Conversely, the evidential support is an RKR. The expert's reliability means her offer signals her own belief in *p*, which serves as testimony. This bears directly on the likelihood that *p* is true. Because this reason aligns with the constitutive aim of belief (tracking truth), it is object-given. It speaks to the content of the proposition. Even though this evidence is triggered by the same event as the bribe, its normative force derives from its connection to truth, not utility. Thus, in this hybrid case, the distinction remains intact: one strand of the reason supports the fittingness of the attitude (evidence), while the other supports the desirability of holding it (incentive).

  However, drawing this distinction without circularity presents a significant challenge. A naive definition states: "RKRs are reasons that make an attitude fitting." This is circular because "fitting" is typically defined as "that which there is RKR to have." To avoid this, we must ground the distinction in the nature of the attitudes themselves, independent of the reasons. We can appeal to the constitutive norms of the mental states. Belief is constitutively regulated by truth; admiration is constitutively regulated by admirability. These standards of correctness exist prior to the enumeration of reasons.

  Therefore, we can define RKRs non-circularly as reasons that cite features relevant to the constitutive standard of the attitude. WKRs cite features relevant to the benefits or costs of holding the attitude, regardless of the standard. In the expert case, the evidence cites a feature relevant to truth (reliability), while the reward cites a feature relevant to welfare (wealth).

  One might object that if the reward is evidence, it *is* a truth-related reason, collapsing the distinction. However, this confuses the *cause* of the evidence with the *content* of the reason. The reason is not "I get money"; the reason is "The expert believes *p*." The money is the mechanism, but the normative weight comes from the reliability. If the expert were unreliable, the money would remain a WKR, but the evidential RKR would vanish. This variability confirms they are distinct normative entities.

  Ultimately, the distinction holds even in hybrid cases. The circularity worry is resolved by anchoring "right kind" in the constitutive aims of attitudes rather than in the primitive notion of fittingness. The expert's offer is a composite: it is a WKR relative to the subject's welfare, and an RKR relative to the subject's doxastic correctness. Recognizing this duality allows us to maintain that one can have sufficient reason to bring about a belief (WKR) without having sufficient reason to believe (RKR), even when the sources overlap.

  ***

  **Marking Scheme (20 Marks)**

  **Grade A (16–20 Marks):** Demonstrates precise conceptual discrimination, addresses the circularity constraint deeply, and avoids standard textbook recitations.
  **Grade B (10–15 Marks):** Identifies the basic distinction but treats the case as a standard incentive case or fails to resolve the circularity worry adequately.

  | Must-Hit Move | Marks | Specific Mistake Costing Marks (B-Level Indicator) |
  | :--- | :---: | :--- |
  | **1. Disentangling the Hybrid Reason**<br>Identifies that the single offer generates two distinct normative pathways (evidential vs. pragmatic). | 4 | **Conflation:** Treating the case as a standard "Evil Demon" or Pascal's Wager scenario where the incentive provides *no* evidence. Fails to acknowledge the expert's reliability creates a truth-tracking reason. |
  | **2. Classifying RKR vs. WKR**<br>Correctly labels the evidence as RKR and the monetary gain as WKR within this specific context. | 4 | **Misclassification:** Arguing that because the offer is evidence, the monetary incentive becomes a "right kind" reason, or vice versa. Fails to separate the *benefit* from the *indication of truth*. |
  | **3. Object-Given vs. State-Given**<br>Explains the distinction by locating the target of the reason (the proposition/object vs. the mental state/holding). | 4 | **Vagueness:** Describes the reasons merely as "good" vs. "bad" or "moral" vs. "pragmatic" without referencing whether the reason targets the *content* of the belief or the *act* of believing. |
  | **4. Engaging the Circularity Challenge**<br>Explicitly addresses the prompt's requirement to define the distinction without defining RKR as "what makes it fitting." | 4 | **Avoidance:** Ignores the circularity constraint or asserts the distinction is obvious without explaining *how* to define it non-circularly. |
  | **5. Constitutive Aim Solution**<br>Proposes grounding the distinction in the nature of the attitude (e.g., belief aims at truth) rather than a primitive value judgment. | 4 | **External Grounding:** Attempts to solve circularity by appealing to external values (e.g., "truth is good") rather than the internal norms of the attitude type itself. |
