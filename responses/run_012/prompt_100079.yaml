answer: |-
  # Question-Period Prep Sheet: Harsanyi, Aggregation, and the Ex-Post Turn

  **Context:** Departmental Colloquium (Social Choice/Decision Theory).
  **Thesis:** Harsanyi's Aggregation Theorem yields affine combination, not Utilitarianism (gap: comparability/weights). The standard reading equivocates between aggregating persons and states. Proposal: Supply missing premises statewise (ex post).

  ---

  ### 1. The Ex-Ante/Ex-Post Pareto Conflict
  **Who:** The Ex-Ante/Ex-Post Specialist.
  **Likelihood:** Very High | **Damage:** High
  **Objection:** "You propose aggregating utilities statewise (ex post). But if individuals have heterogeneous priors, ex-post aggregation violates Ex-Ante Pareto. If you and I both prefer Lottery A to B based on our different beliefs, your social rule might rank B over A because it looks at the states differently. Are you prepared to drop Ex-Ante Pareto? That's a massive normative cost."
  **Reply:** "I am prepared to drop Ex-Ante Pareto in cases of heterogeneous priors. This is contested territory, but defended by Diamond (1967) and Epstein (2016). Ex-Ante Pareto respects preferences over lotteries, but if those preferences are driven by divergent beliefs rather than values, satisfying them can mask unfair ex-post outcomes. My claim is that the 'utilitarian' intuition is fundamentally about welfare in *worlds*, not agreement on *gambles*. We should satisfy Statewise Pareto and accept that rational agents with different information may disagree on the optimal lottery."
  **Weakness:** This concedes a major axiom of standard social choice. Many view Ex-Ante Pareto as non-negotiable for liberal respect of individual rationality. If pressed on *why* beliefs shouldn't count, I risk sounding paternalistic.

  ### 2. The Interpersonal Comparability Gap
  **Who:** VNM Expert #1.
  **Likelihood:** Very High | **Damage:** High
  **Objection:** "You say the theorem doesn't establish utilitarianism because it lacks interpersonal comparability. But Harsanyi (1955) explicitly builds cardinal unit comparability into the setup to get the weighted sum. You're attacking the theorem in isolation, ignoring that the *argument* for utilitarianism includes the normalization assumption. Isn't that a straw man?"
  **Reply:** "It's not a straw man to distinguish what the *theorem* proves from what the *philosophical argument* assumes. The Aggregation Theorem itself (Pareto + VNM) only yields an affine combination. The weights and the common scale are extra-theorem ethical inputs. My point is that the literature often cites the theorem as if it *derives* utilitarianism from rationality alone. I'm asking us to be explicit that the 'utilitarian' step comes from the comparability premise, which is ethical, not technical."
  **Weakness:** Harsanyi defenders will argue the comparability assumption is implicit in the "social preference" concept. I must avoid sounding like I'm making a trivial semantic point about "theorem" vs "argument."

  ### 3. The "Straw Man" Charge
  **Who:** Welfare Economist #1.
  **Likelihood:** High | **Damage:** Medium
  **Objection:** "Nobody serious thinks Harsanyi proves utilitarianism without ethical premises. We know the weights are ethical parameters. So what's the substantive contribution here? You're demolishing a reading that most of us already reject."
  **Reply:** "While experts know this, the theorem is routinely invoked in broader political philosophy and economics as a 'rationality proof' for utilitarianism, bypassing the ethical heavy lifting of justifying the weights. My goal is to stop that slide. Furthermore, by locating the ethical premise in the ex-post aggregation rather than ex-ante, I change *which* ethical premises are required, shifting the debate from 'respect for preferences' to 'respect for outcomes.'"
  **Weakness:** If the audience agrees this is already common knowledge, my talk risks appearing redundant. I need to emphasize the *ex-post* shift as the novel contribution, not just the critique of Harsanyi.

  ### 4. The Zero-Point Problem
  **Who:** VNM Expert #2.
  **Likelihood:** Medium | **Damage:** Medium
  **Objection:** "You talk about summing utility functions. But VNM utilities are unique only up to positive affine transformation. You can't add them unless you fix the zero and the unit. How does your ex-post proposal fix the zero-point without stipulating interpersonal comparability of levels, which is even stronger than unit comparability?"
  **Reply:** "Correct, full summation requires level comparability. My proposal is that the 'missing premise' is precisely this level comparability, applied statewise. The standard Harsanyi reading often hides this by focusing on expected utility where zeros cancel out under specific normalizations. I am arguing we must confront the level comparability requirement explicitly in each state, rather than hiding it inside the expectation operator."
  **Weakness:** This admits my view requires *stronger* measurability assumptions than the standard Harsanyi model (which often gets by with unit comparability). This makes the view harder to defend empirically or philosophically.

  ### 5. The Veil of Ignorance Defense
  **Who:** Welfare Economist #2.
  **Likelihood:** Medium | **Damage:** Medium
  **Objection:** "You're focusing on the 1955 Aggregation Theorem. But Harsanyi's main defense of utilitarianism is the 1953 Veil of Ignorance argument (equiprobability model). That doesn't rely on aggregating existing preferences but on a single rational agent choosing behind a veil. Does your critique touch that?"
  **Reply:** "The Veil of Ignorance argument relies on the equiprobability assumption, which is itself a substantive ethical claim, not a rationality constraint. My critique applies there too: moving from 'one agent choosing under uncertainty' to 'social welfare' still requires assuming the agent's utility function maps correctly to individual utilities. The equivocation between states and persons persists: the agent averages over states, but we interpret that as averaging over persons."
  **Weakness:** Harsanyi fans view the Veil argument as distinct from the Aggregation Theorem. Conflating them might annoy those who see the 1953 model as the stronger defense.

  ### 6. Whose Probabilities?
  **Who:** Ex-Ante/Ex-Post Specialist (Follow-up).
  **Likelihood:** Medium | **Damage:** High
  **Objection:** "If you aggregate ex-post, you still need to take an expectation to guide choice under uncertainty. Whose probabilities do you use? If you use social probabilities, you're imposing beliefs on individuals. If you use individual probabilities, you're back to ex-ante aggregation."
  **Reply:** "I propose using a social probability measure derived from pooled information, distinct from individual subjective priors. This acknowledges that social choice often requires an objective risk assessment (e.g., climate policy) that overrides subjective beliefs. This is controversial, but necessary if we want ex-post welfare to drive decision."
  **Weakness:** This sounds technocratic and paternalistic. It undermines the "respect for individual preference" axiom I claim to honor. There is no consensus on how to construct "social probabilities" without violating Bayesian rationality.

  ### 7. The Rawlsian "So What?"
  **Who:** The Rawlsian.
  **Likelihood:** Low | **Damage:** Low
  **Objection:** "Why do we need a theorem to see that aggregating utilities is tricky? The problem is the moral status of the person, not the math. Isn't this just rearranging deck chairs on the Titanic?"
  **Reply:** "Because the math is often used to silence the moral objection. When economists say 'Harsanyi proves utilitarianism,' they shut down Rawlsian concerns. By showing the theorem is weaker than claimed, I reopen the space for non-utilitarian theories like yours to be seen as 'rational' rather than 'intuition-based.'"
  **Weakness:** Risks alienating the decision theorists by appealing to "moral status" which they may view as outside the model.

  ### 8. The Mongin Impossibility (The "Hope")
  **Who:** The Ex-Ante/Ex-Post Specialist (If they are particularly sharp).
  **Likelihood:** Low | **Damage:** Catastrophic
  **Objection:** "Mongin (1995) proved that you cannot satisfy Ex-Ante Pareto, Ex-Post Pareto, and Expected Utility simultaneously unless individuals share identical priors. Your proposal advocates Ex-Post aggregation while claiming to respect individual preference. If priors differ, your system is mathematically impossible or dictatorial. Are you aware this impossibility renders your positive proposal incoherent?"
  **Reply:** "I am aware of Mongin's result. It is a settled impossibility theorem. My response is to reject Ex-Ante Pareto in favor of Ex-Post Pareto when priors diverge. This is not incoherent; it is a specific axiomatic choice that prioritizes outcome fairness over preference sovereignty. I argue this is the correct ethical trade-off, even if it violates standard Bayesian social choice constraints."
  **Weakness:** This is the weakest point. Admitting I violate a standard rationality constraint (Ex-Ante Pareto) to satisfy another (Ex-Post Pareto) in the face of an impossibility theorem makes my view look like an ad-hoc fix. If they press on *why* Ex-Post trumps Ex-Ante without begging the question, I may have no non-circular answer.

  ---

  **Literature Note:** The conflict between Ex-Ante and Ex-Post criteria under heterogeneous priors is **settled** as an impossibility (Mongin 1995, Gilmour 1977). The **contested** issue is which axiom to drop. Defending Ex-Post over Ex-Ante is a minority view (associated with Diamond, Epstein, Machina) but defensible. Do not claim the math allows both; claim the ethics require choosing one.

  \answer{The Mongin Impossibility Objection}
