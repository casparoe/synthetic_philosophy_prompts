      *   *The Core Objection:* At midnight, you know that tomorrow afternoon, you will have no reason to drink (money is already there, pain is certain). Therefore, you know you won't drink. If you know you won't drink, can you genuinely *intend* to drink? Most say no. Intention implies a belief that you *will* do it (or at least, that it's possible and you are committed).

  3.  **Address Question 1: Is the General Rule Correct?**
