      *   **Answer Q3 (Disposition):** Affirm this is a strong insight. Many solutions (Gauthier, McClennen) rely on changing the agent's *disposition* rather than just their occurrent mental state. This bridges the gap between the "easy" intention view and the "hard" belief view.

