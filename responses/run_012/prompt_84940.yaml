  ### Brainstorm: Distinct Positions on Historical Outcomes

  Here are the genuinely distinct positions available in the logical space, separated by their counterfactual claims rather than their labels.

  *   **Strict Meritocracy:** The winner was objectively superior at the start; history merely revealed this fact. (Distinct from Functional Determinism because it claims *this* specific winner was necessary, not just *a* winner).
  *   **Functional Determinism:** A solution was necessary and convergence was inevitable, but the specific winner was contingent. (Distinct from Strict Meritocracy because it allows that a rival could have filled the same role).
  *   **Hard Lock-in:** A rival was superior or equal, but increasing returns to adoption made switching impossible. (Distinct from Strict Meritocracy because it admits the winner was not objectively superior).
  *   **Soft Lock-in (Inertia):** A rival was superior or equal, and switching was physically possible but psychologically costly due to habit. (Distinct from Hard Lock-in because the barrier is passive inertia, not active network effects).
  *   **Constructivism:** There is no metric of 'better' independent of survival; the winner defined quality. (Distinct from Strict Meritocracy because it denies independent quality exists).
  *   **Stable Pluralism:** No single winner was inevitable; multiple arrangements can coexist indefinitely. (Distinct from Functional Determinism because it denies convergence to a single standard).
  *   **Fragile Accident:** An early chance event fixed the outcome, but no mechanism sustains it. (Distinct from Soft Lock-in because it lacks a mechanism to prevent drift back to equilibrium).
  *   **Incoherent Optimism:** The loser was known to be better, switching was cheap, yet the winner won. (Distinct from all others because it implies irrational actors without explanation).

  ### Unoccupied Logical Space

  Before constructing the tree, we must identify combinations of beliefs that are logically unstable or empirically unoccupied.

  1.  **The "Impossible Meritocracy" (Loser better, known, cheap switch):** This combination is **incoherent**. If the loser is known to be better and switching is cheap for any individual, rational actors would switch. If they do not, either the quality is not known, the switch is not cheap, or the actors are not rational. A position claiming this combination holds without explaining the irrationality occupies empty space; it describes a puzzle, not a mechanism.
  2.  **The "Fragile Accident" (Early accident, no reproduction):** This combination is **unstable**. If an early accident fixes an outcome but nothing reproduces that advantage (no lock-in, no inertia), random noise should eventually erase the accident and return the system to equilibrium. A position holding this must accept that the current outcome is temporarily frozen but theoretically doomed to drift, which sits awkwardly with long-lived standards like QWERTY.
  3.  **Constructivist Lock-in:** If quality is defined by survival (Constructivism), then 'lock-in' is a redundant description. You cannot be locked into a superior option if superiority is only defined by the fact that you are locked in. This combination collapses into Constructivism alone.

  ### The Decision Tree

  This instrument sorts positions by mechanism and evidence. Answer the questions based on the concrete case you are discussing (e.g., a specific programming language, a biological trait, a legal rule).

  **Node 1: Independent Quality**
  Could engineers, biologists, or lawyers have measured the utility of the options *before* any widespread adoption occurred?
  *   **No:** Go to **Leaf A**.
  *   **Yes:** Go to **Node 2**.

  **Node 2: Unique Capability**
  Was the winning option the *only* one capable of solving the problem at the time, or could a rival have done the job?
  *   **Only the winner could solve it:** Go to **Leaf B**.
  *   **A rival could have solved it:** Go to **Node 3**.

  **Node 3: Switching Dynamics**
  Did the cost of switching to a rival increase as more people adopted the winner?
  *   **Yes, switching became harder with each new user:** Go to **Leaf C**.
  *   **No, switching costs remained static:** Go to **Node 4**.

  **Node 4: Functional Substitution**
  If the winner had vanished early on, would a different option have emerged to solve the problem within a short time?
  *   **Yes, a substitute would have emerged:** Go to **Leaf D**.
  *   **No, the problem would have remained unsolved:** Go to **Leaf E**.

  **Node 5: Coexistence**
  Did the losing option remain viable for users who never adopted the winner?
  *   **Yes, losers survived alongside the winner:** Go to **Leaf F**.
  *   **No, losers were eliminated:** Go to **Node 6**.

  **Node 6: Persistence Mechanism**
  Did the winner remain dominant even after the number of new users stopped growing?
  *   **Yes, dominance persisted without growth:** Go to **Leaf G**.
  *   **No, dominance relies on continuous growth:** Go to **Leaf H**.

  ***

  **Leaf A: Constructivism**
  *   **Position:** There is no fact of the matter about which option was better; 'quality' was settled by which option survived.
  *   **Awkward Commitment:** You must explain why some widely adopted tools are universally hated without recourse to independent quality.

  **Leaf B: Strict Meritocracy**
  *   **Position:** This exact standard was inevitable because it was uniquely capable; history merely revealed its superiority.
  *   **Awkward Commitment:** You must explain why uniquely capable options sometimes fail to launch in similar markets.

  **Leaf C: Hard Lock-in**
  *   **Position:** A rival was better, but network effects made switching too costly for any individual to attempt.
  *   **Awkward Commitment:** You must identify the precise moment when switching became impossible, which is often hard to date.

  **Leaf D: Functional Determinism**
  *   **Position:** Some standard doing this job was inevitable, but the particulars of this winner were accidental.
  *   **Awkward Commitment:** You must explain why convergence happened here but not in similar fields where multiple standards coexist.

  **Leaf E: Specific Necessity**
  *   **Position:** This exact standard was inevitable not because it was better, but because no other solution existed at the critical moment.
  *   **Awkward Commitment:** You must explain why the winner did not improve significantly after securing the monopoly.

  **Leaf F: Stable Pluralism**
  *   **Position:** There is no single winner; multiple arrangements coexist indefinitely rather than one eliminating the other.
  *   **Awkward Commitment:** You must explain why most markets eventually tip to a single dominant option despite this stability.

  **Leaf G: Soft Lock-in (Inertia)**
  *   **Position:** An early accident chose the winner, and habit kept it in place without active network effects.
  *   **Awkward Commitment:** You must explain why habit outweighs technical gain for so many users over such long periods.

  **Leaf H: Fragile Accident**
  *   **Position:** An early accident fixed the outcome, but nothing whatsoever reproduces the advantage.
  *   **Awkward Commitment:** You must accept that the outcome is theoretically doomed to drift away if adoption stops growing.

  ***

  ### Technical Terms and Distinctions

  You asked where specific theoretical distinctions fit within this instrument.

  *   **Ergodic vs. Non-ergodic:** An ergodic process is one where the system returns to an average state over time, rendering history irrelevant. A non-ergodic process is one where history matters and the system does not return to a prior average. In this tree, **Node 3** and **Node 6** distinguish these. If switching costs rise with adoption (Node 3) or dominance persists without growth (Node 6), the process is non-ergodic (history matters). If neither is true, the process is likely ergodic (history washes out).
  *   **Critical Juncture:** This refers to a short period of contingency where structural constraints are loose. In this tree, **Node 2** and **Node 4** locate the critical juncture. If the winner was not uniquely capable (Node 2) and a substitute would have emerged (Node 4), the early phase was a critical juncture where things could have gone differently.
  *   **Multiple Equilibria:** This describes a situation where more than one stable outcome is possible. **Leaf F (Stable Pluralism)** is the direct expression of this. However, **Leaf D (Functional Determinism)** also implies multiple equilibria were possible initially, but convergence selected one.

  ### Moving Between Positions: The Evidence of Rivals

  To move from a position like **Hard Lock-in** to **Strict Meritocracy**, you need evidence about the abandoned rival that isolates quality from network effects. Specifically, you would need to observe the rival being adopted by a closed group (isolated from the winner's network) and still failing to gain traction due to technical flaws. Conversely, to move from **Strict Meritocracy** to **Hard Lock-in**, you would need to observe the rival succeeding in a parallel market where the winner's network effects were absent, or observe users actively resisting the winner despite its dominance. Without evidence from isolated environments or parallel markets, you cannot tell if the winner's advantage is real or manufactured by the lock-in itself.
