answer: |-
  | Element of Mill's Position | Closest Counterpart in Moderation Vocabulary | Fidelity | Lost, Added, or Smuggled |
  | :--- | :--- | :--- | :--- |
  | **The Harm Principle**: Power is only legitimate to prevent harm to others, not self-regarding actions. | **Policy Scope & Real-World Harm Tiers**: Enforcement prioritises content linked to physical harm, self-harm, or credible threats. | Distorted | **Smuggled:** "Harm" is expanded to include brand safety, advertiser comfort, and regulatory risk. **Lost:** The distinction between private vice and public harm is collapsed into "Community Guidelines". |
  | **Fallibilism**: Suppressing opinion assumes infallibility; we might be wrong. | **Precision/Recall Trade-off**: Tuning classifiers to minimise false positives (over-removal) versus false negatives (under-removal). | Distorted | **Lost:** Epistemic humility becomes a cost-budget. False positives are accepted as operational waste, not philosophical errors. **Added:** The assumption that a "correct" label exists for every piece of content. |
  | **Dead Dogma**: Truth becomes dead if not contested; collision with error keeps it vital. | **Borderline Content & Demotion**: Content not violating policy but deemed sensitive is down-ranked rather than removed. | Distorted | **Lost:** Demotion silences the collision Mill requires. It prevents the opinion from being heard, preserving comfort over vitality. **Added:** The idea that visibility is a privilege to be managed, not a right of discussion. |
  | **Harm vs. Offence**: Mere offence or dislike is insufficient grounds for suppression. | **Severity Ladder**: Differentiating between hate speech (protected characteristics) and general harassment or rude speech. | Distorted | **Smuggled:** User reporting volumes often drive enforcement regardless of severity. **Lost:** The normative judgement of what *ought* to be offensive is replaced by aggregate user sentiment. |
  | **Speech as Capacity**: Liberty of discussion is essential for individual self-development and rational agency. | **User Engagement & Retention Metrics**: Speech is treated as activity that drives session time and platform stickiness. | No Counterpart | **Lost:** The citizen as a moral agent. **Added:** The user as a data point whose speech is valuable only insofar as it generates measurable interaction. |

