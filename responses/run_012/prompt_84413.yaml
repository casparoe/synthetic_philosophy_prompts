answer: |-
  ### The Kitchen Table Adaptation Test

  You are asking for a filter that separates robust evolutionary hypotheses from 'just-so' stories without the benefit of data. This procedure relies on **logical coherence**, **cost-benefit analysis**, and **rival hypothesis elimination**. It treats evolutionary claims as engineering problems: does the trait solve a specific problem efficiently enough to justify the biological cost of building it?

  Here is the procedure. Run your premise through these five questions in order.

  #### Step 1: The Ancestral Problem
  **Question:** What specific, recurring problem in the Pleistocene environment (the 'Environment of Evolutionary Adaptedness') does this trait solve?
  **Sufficient Answer:** A concrete threat to survival or reproduction (e.g., predation, starvation, cuckoldry, infanticide). It must not be a modern problem (e.g., stock market anxiety, social media status).
  **Stop Condition:** If the problem only exists in industrialised societies, or is vague (e.g., 'general stress'), stop. The premise is likely cultural or a byproduct.

  #### Step 2: The Cost of Construction
  **Question:** Is this trait complex or metabolically expensive enough to require an evolutionary explanation?
  **Sufficient Answer:** Yes, if it involves dedicated neural circuitry, strong emotional drives, or significant energy expenditure.
  **Stop Condition:** If the trait could be a side-effect of something else (e.g., we like sweet things because we need calories, not because sugar itself is adaptive), stop. This is a 'spandrel' or byproduct, not an adaptation.
  **Note:** If the trait is cheap (e.g., a minor preference), evolution may not have 'cared' enough to shape it specifically.

  #### Step 3: The Rival Explanation (The Null Hypothesis)
  **Question:** Can this behaviour be explained more simply by physics, general learning, or cultural transmission?
  **Sufficient Answer:** You must articulate the best non-evolutionary explanation (e.g., 'people don't eat in front of strangers because it is rude, not because of theft') and demonstrate why the evolutionary explanation is *more* parsimonious or universal.
  **Stop Condition:** If the cultural or physical explanation is simpler and requires fewer assumptions, stop. Evolution is the explanation of last resort, not first.

  #### Step 4: The Convergent Prediction
  **Question:** If this adaptation exists, what *other* unrelated behaviours should we observe as a consequence?
  **Sufficient Answer:** At least two secondary predictions that are not part of the original claim (e.g., if fear of snakes is adaptive, we should learn to fear them faster than we learn to fear cars).
  **Stop Condition:** If the hypothesis explains only the one phenomenon it was invented to describe, it is a 'just-so' story.

  #### Step 5: The Variability Check
  **Question:** Does the trait vary in predictable ways according to the evolutionary pressure?
  **Sufficient Answer:** Yes. If the pressure varies (e.g., paternity certainty), the trait should vary (e.g., jealousy intensity).
  **Stop Condition:** If the trait is claimed to be universal but the pressure clearly wasn't (or vice versa), the premise is fragile.

  ***

  ### Handling the 'Untestable' Dispute
  You asked for a position on whether a hypothesis that cannot be tested directly is disqualified.
  **The Procedure's Position:** It is not disqualified, but it is downgraded.
  Without literature, you cannot confirm falsifiability. Therefore, this procedure rates **Coherence** rather than **Truth**.
  *   **Grade A:** Passes all steps, predictions are specific. (Strong candidate for authorial truth).
  *   **Grade B:** Passes logic, but predictions are hard to observe without data. (Use as character belief).
  *   **Grade C:** Fails Step 3 or 4. (Do not build the book's theme on this).

  ### Sacrifices and Misfires
  To make this usable at a kitchen table, I have sacrificed the following distinctions:
  1.  **Gene vs. Meme:** The procedure treats 'traits' as units of selection. It does not distinguish between genetic evolution and cultural evolution (memetics). It will misfire on traits that are culturally evolved but look biological (e.g., incest taboos).
  2.  **Group vs. Individual Selection:** It assumes individual-level selection. It will misfire on altruistic behaviours that benefit the group at cost to the individual.
  3.  **Phylogenetic History:** It assumes the trait was built for its current use. It cannot detect 'exaptation' (a trait built for one purpose, co-opted for another) without comparative biology data.

  **Where it will misfire:** It will favour simple, functional stories. It is biased *against* complex, messy realities where biology and culture intertwine. It is a sieve for plausibility, not a detector of fact.

  ***

  ### The One-Sentence Verdict
  For your acquisitions meeting, use this template:
  > *"This premise is [viable/speculative/fragile] because it [solves a specific ancestral cost / fails to rule out cultural alternatives / lacks convergent predictions]."*

  ***

  ### Application to Candidate Premises

  Here is the procedure run on your three examples.

  #### 1. Appetite for Story Endings
  *   **Step 1 (Problem):** Uncertainty about future events prevents planning. Knowing 'how it ends' allows for better risk assessment. **Pass.**
  *   **Step 2 (Cost):** Cognitive load of narrative structure is high; dopamine reward for closure is significant. **Pass.**
  *   **Step 3 (Rival):** Could be a byproduct of pattern recognition (we see faces in clouds, endings in chaos). However, the *distress* at lack of ending suggests an active drive, not passive recognition. **Pass (narrowly).**
  *   **Step 4 (Prediction):** We should value information about outcomes more than information about processes. We should feel physical anxiety at unresolved plots. **Pass.**
  *   **Step 5 (Variability):** In high-stakes environments, tolerance for ambiguity should drop. **Pass.**
  *   **Verdict:** **Viable.** It fares better than you might expect because the link between 'simulation of outcomes' and 'survival planning' is logically tight, even if hard to measure.
  *   **Acquisitions Sentence:** *"This premise is viable because it frames narrative closure as a low-cost simulation tool for survival planning that rules out simple pattern recognition."*

  #### 2. Sex Differences in Jealousy (Parental Investment)
  *   **Step 1 (Problem):** Men risk cuckoldry (investing in rival's genes); women risk resource diversion (partner investing elsewhere). **Pass.**
  *   **Step 2 (Cost):** Emotional distress is metabolically expensive and risks violence. **Pass.**
  *   **Step 3 (Rival):** Cultural scripting (patriarchy teaches men to value sexual fidelity). This is a strong rival. However, if the feeling is visceral and immediate (before cultural processing), the evolutionary claim holds. **Pass (with caveat).**
  *   **Step 4 (Prediction):** Men should forgive emotional infidelity more than sexual; women the reverse. Physiological stress responses should differ. **Pass.**
  *   **Step 5 (Variability):** In cultures with high paternity certainty, male sexual jealousy should decrease. **Pass.**
  *   **Verdict:** **Viable but Contested.** It fares better than you might expect *logically*, because the Parental Investment theory is internally consistent, even if the cultural noise makes it hard to defend socially.
  *   **Acquisitions Sentence:** *"This premise is viable because it derives specific emotional asymmetries from the biological asymmetry of parental investment, despite cultural noise."*

  #### 3. Reluctance to Eat in Front of Strangers (Anti-Theft)
  *   **Step 1 (Problem):** Food theft while hands are occupied. **Pass.**
  *   **Step 2 (Cost):** Social isolation has high survival costs in a primate species. To evolve a taboo against eating, the theft risk must be massive. **Fail.**
  *   **Step 3 (Rival):** Politeness, hierarchy, and disgust (sharing saliva/germs) explain this better. Eating is a bonding ritual; doing it with strangers violates bonding rules. **Fail.**
  *   **Step 4 (Prediction):** People with no valuables should not care. People with weapons should care less. This is not observed; the taboo is social, not tactical. **Fail.**
  *   **Step 5 (Variability):** Should vanish in times of plenty. It does not. **Fail.**
  *   **Verdict:** **Fragile.** It fares worse than you want. It is a classic 'just-so' story that ignores the stronger social and hygienic explanations.
  *   **Acquisitions Sentence:** *"This premise is fragile because it posits a high-cost social isolation trait to solve a low-risk tactical problem that is better explained by hygiene and hierarchy."*

  ***

  ### What the Procedure Cannot Do

  This procedure cannot tell you if a premise is *true*. It can only tell you if it is *coherent*. Evolutionary psychology is often correct about the 'why' but wrong about the 'how'. A premise can pass this test and still be disproven by a single genome-wide association study or anthropological finding you cannot access.

  Furthermore, this procedure cannot measure the *literary value* of a mistake.

  ### How a Failed Premise Earns Its Place

  If a premise fails this test (like the Eating example), do not discard it. Discard it only as **authorial truth**. You may still retain it as **character truth**.

  A novel does not require the author to be right about human nature; it requires the *characters* to be convinced of their own nature. If your protagonist believes eating in front of strangers is dangerous because of theft, and acts accordingly, you have created conflict, paranoia, and isolation. The theme becomes the *consequence* of that belief, not the biological validity of it.

  If the book asserts the premise as fact, you risk dating your work or alienating informed readers. If the book presents the premise as a character's desperate logic for their own behaviour, you gain psychological depth. The failure of the science becomes the tragedy of the character.

  **Final Advice:** Use the 'Viable' premises to build your world's rules. Use the 'Fragile' premises to build your characters' delusions.
