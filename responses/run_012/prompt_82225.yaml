answer: |-
  There is no canonical term, but the precise coinage for this category mistake is **"The Sentience Scalarization Error."**

  This error occurs when distinct vectors—epistemic credence (probability of consciousness), phenomenological magnitude (range of experience), and normative weight (moral significance per unit)—are prematurely collapsed into a single scalar value of "moral status." In decision theory and cognitive science, you preserve variance to manage risk; in this ethical snag, agents compress the variance to simplify calculation, thereby losing the information needed to distinguish between *investigating* existence (research funding) and *accommodating* capacity (welfare regulation). The "error" is not in doing the arithmetic to find expected moral value, but in treating that expected value as an intrinsic property of the animal rather than a contingent output of our uncertainty.

  The edges of this concept are defined by what it excludes. It is not **Moral Uncertainty** generally, which covers conflicting ethical frameworks (e.g., utilitarianism vs. deontology); this is specifically about uncertainty regarding the *subject* of morality. It is not **Graded Moral Status**, which holds that consciousness comes in metaphysical degrees (a dog's pain is intrinsically more complex than a bee's); the Scalarization Error conflates that metaphysical grade with the epistemic probability that any grade exists at all. If you believe a bee has 1/100th the status of a dog because its nervous system is simpler, that is graded status; if you believe it has 1/100th the status because you are only 1% sure it is conscious, that is scalarization.

  This distinction dictates policy. If the low score comes from low magnitude (graded status), welfare codes are the response because the suffering is real but limited. If the low score comes from low credence (scalarization), research is the response because resolving the uncertainty changes the moral calculus entirely. By fusing credence and capacity, the Scalarization Error makes these distinct policy paths look identical, leading to the stagnation you observe where neither research nor protection is prioritized correctly.
