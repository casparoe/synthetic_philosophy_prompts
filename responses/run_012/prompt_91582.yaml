answer: |-
  The question of why promises bind is a question about the source of moral obligation. When I say "I promise," what force converts those words into a duty? Philosophical tradition generally offers three answers. The **Expectation Account** argues that promising creates a reliance in another person; breaking the promise harms them by violating that reliance. The **Social Practice Account** posits that promising is a conventional institution, like chess or currency; by using the word, you invoke rules that exist independently of you. The **Integrity Account** suggests the binding force is internal; to break a promise is to fracture your own agency and betray your identity as a person of your word.

  To test these, consider the case of the dying friend. You promise to finish and publish their book. They die a week later. No one else knows the promise exists. No one cares about the book. There is no reputational cost to breaking it, and no living person to suffer disappointment. Does the promise still bind?

  The Expectation Account struggles to find a foothold here. Theories like T.M. Scanlon's rely on the principle of fidelity: you must not manipulate another's expectations to their detriment. But the friend is dead. They possess no psychological states; they cannot feel disappointment, nor can their plans be thwarted. There are no third parties relying on the book's publication. If obligation stems solely from preventing harm to another's expectations, the duty evaporates with the promisee's heartbeat. This verdict feels morally sterile. It suggests that if you could break a promise without anyone knowing or suffering, you would be free to do so. In the case of the dying friend, this implies their last wish carries no more weight than a passing thought, which contradicts our deep intuition that the dead retain a claim on the living.

  The Social Practice Account fares little better. On this view, associated with thinkers like Rawls or Searle, you are bound because you have entered a rule-governed practice. Breaking the promise is like moving a rook diagonally; it violates the constitutive rules of "promising." However, the force of this violation is usually tied to the health of the institution. If no one knows you promised, the institution suffers no erosion. There is no social sanction, no loss of trust in the community, because the community is unaware. If the only reason to keep a promise is to uphold a public system of trust, then a strictly private promise to a deceased person is a ghost in the machine—an obligation without an enforcer. This account reduces morality to public performance, implying that if the audience leaves the theater, the actor is free to ignore the script.

  The Integrity Account, however, withstands the pressure of the grave. This view, championed in various forms by virtue ethicists and philosophers like Bernard Williams, locates the binding force in the promisor's own character. To promise is to project your will into the future and stake your identity on that projection. When you promise a dying friend, you create a normative relationship that transcends biological existence. The obligation is not about their current expectations or social rules, but about your fidelity to the relationship and to yourself. If you break the promise, you may not harm the friend, but you damage yourself. You become the kind of person who abandons commitments when they become inconvenient or invisible. In this light, the promise absolutely binds. The silence of the world does not silence the conscience. The Integrity Account explains why we feel bound even when no one is watching: because *we* are watching.

  Therefore, the verdict is clear: the promise binds. The Expectation and Social Practice accounts fail because they externalize obligation, making it dependent on the presence of others. The Integrity account succeeds because it internalizes obligation, making it dependent on the continuity of the self and the sanctity of the bond.

  Does this answer change if publishing the book would damage the friend's reputation? Suppose the half-written manuscript reveals embarrassing secrets, plagiarism, or harmful ideologies that would tarnish the friend's memory.

  Here, the Integrity Account proves its superiority not by rigidity, but by depth. A robotic adherence to the letter of the promise might suggest you must publish regardless of the fallout. However, integrity is not about blind obedience to words; it is about coherence with the values that underpin the relationship. The promise was made in the context of friendship and care. The friend asked you to publish because they believed the book was a gift to the world or a testament to their life. If publishing it instead becomes a desecration of their memory, fulfilling the literal instruction violates the spirit of the loyalty that generated the promise.

  In this specific scenario, the obligation shifts. You are still bound by the promise, but the content of that obligation is interpreted through the lens of the friend's good. If the promise was "honor me," and publishing dishonors them, then not publishing is the truer fulfillment of the commitment. The Expectation account might argue you should break the promise to prevent harm to their legacy (a form of posthumous expectation), but that relies on a fiction of the dead's interests. The Social Practice account might say the rules of publishing ethics override the promise. But the Integrity account explains the nuance best: your duty is to the friend, not just the instruction. When the instruction turns against the friend, integrity demands you prioritize the person over the task.

  So, the verdict changes on the action, but not on the theory. In the first case, you must publish. In the second, you must not. In both cases, the binding force comes from your integrity. To publish in the first case honors the bond; to publish in the second case betrays it.

  We must not end on the fence. Promises bind because we are creatures who exist through time, capable of binding our future selves to the needs of others. If we accept the Expectation or Social Practice accounts, we admit that morality is merely a transaction between the living or a game played for an audience. That is a impoverished view of human connection. The dying friend case reveals that the deepest obligations are those that survive the silence. The promise binds because you are the one who made it, and you are the one who must live with the person you become if you break it.
