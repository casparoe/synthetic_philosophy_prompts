answer: |-
  **Case 1: The Bound Verdict**
  **Body:** A hospital ethics committee reviewing a novel gene-therapy trial.
  **Members:** Dr. Allen, Dr. Baker, Dr. Clark.
  **Institutional Rule:** The committee charter stipulates that the trial is approved *if and only if* it is deemed both scientifically sound and ethically safe. The verdict on approval is logically bound to the criteria.
  **Individual Judgments:**
  *   **Dr. Allen:** Sound (Yes), Safe (Yes) → Approve (Yes).
  *   **Dr. Baker:** Sound (Yes), Safe (No) → Approve (No).
  *   **Dr. Clark:** Sound (No), Safe (Yes) → Approve (No).
  *(Each member is internally consistent; their approval vote follows the rule.)*

  **Case 2: The Free Verdict**
  **Body:** The same hospital ethics committee reviewing a different trial.
  **Members:** Dr. Allen, Dr. Baker, Dr. Clark.
  **Institutional Rule:** The committee records judgments on scientific soundness and ethical safety for the public record, but the decision to approve is discretionary (e.g., contingent on external budget constraints not voted on here). The three propositions are logically independent; approving a trial does not strictly require finding it sound and safe, nor does finding it sound and safe require approval.
  **Individual Judgments:**
  *   **Dr. Allen:** Sound (Yes), Safe (Yes) → Approve (Yes).
  *   **Dr. Baker:** Sound (Yes), Safe (No) → Approve (No).
  *   **Dr. Clark:** Sound (No), Safe (Yes) → Approve (No).
  *(Each member is internally consistent; their approval vote reflects their personal discretion.)*

  ***

  **The Tallies and The Split**

  In **Case 1**, the method of aggregation determines the collective reality. If you tally **proposition-by-proposition** (the premise-based procedure), the majority finds the trial Sound (Allen, Baker) and Safe (Allen, Clark). By the institutional rule, the collective verdict *must* be Approval. However, if you tally the **bottom-line verdict** directly (the conclusion-based procedure), the majority votes to Reject (Baker, Clark). The two methods yield opposite outcomes. Worse, if you tally all three propositions separately, the collective mind holds a set of judgments—{Sound, Safe, Reject}—that violates its own charter. No single member holds this inconsistent view; it is an emergent property of the group.

  In **Case 2**, the logical tether is cut. Tallying **proposition-by-proposition** yields the same raw data: {Sound, Safe, Reject}. However, because there is no rule linking soundness and safety to approval, this set is logically consistent. The committee can coherently assert that the trial is sound and safe but still reject it (perhaps due to the unseen budget constraints). Tallying the **bottom-line verdict** yields Reject. Here, the two ways of aggregating do not "come apart." The premise-based tally does not generate a conflicting expectation for the conclusion, because the premises no longer dictate the conclusion. The collective output is rational under either counting method.

  **The Isolating Variable**

  The feature carrying the result is the **logical constraint between propositions**. In the literature on judgment aggregation, this is the distinction between a connected agenda (where propositions entail one another) and an independent agenda. Case 1 demonstrates that when a group votes on interconnected truths using majority rule, the collective can be forced into irrationality even if every individual is rational. Case 2 demonstrates that this irrationality is not a function of the voters' preferences or the voting mechanism itself, but of the logical structure of the questions asked. Remove the constraint, and the paradox dissolves.

  **The Contested Remedy**

  While the existence of the dilemma is mathematically settled, the normative solution remains a live debate in political philosophy and legal theory.

  A defender of the **bottom-line procedure** (conclusion-based) would argue that Case 1 exposes the arrogance of the proposition-by-proposition method. They would contend that a committee is hired to make a decision, not to audit reasons. If the majority wants to reject the trial, imposing an approval verdict because of a logical rule derived from split majorities on criteria disenfranchises the voters on the actual outcome that matters. They would argue that consistency is less important than responsiveness to the members' will on the final question.

  A defender of the **proposition-by-proposition procedure** (premise-based) would counter that the bottom-line approach allows for "cheap" decisions. In Case 1, voting directly on approval allows members to hide their reasoning; Baker and Clark reject the trial for mutually exclusive reasons (one fears safety, the other doubts science), yet they form a coalition without ever agreeing on *why* the trial fails. The proposition-by-proponent defender argues that collective rationality requires the group to stand behind a coherent set of reasons, even if it means overriding the direct vote on the conclusion to preserve the integrity of the institution's rules.
