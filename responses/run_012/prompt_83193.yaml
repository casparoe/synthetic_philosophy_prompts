answer: |-
  ### Scratch Outline

  **I. Candidate Species Concepts**
  1.  **Biological Species Concept (BSC):** Species as reproductively isolated communities.
  2.  **Phylogenetic Species Concept (PSC):** Species as smallest diagnosable monophyletic groups.
  3.  **Evolutionary Species Concept (EvSC):** Species as lineages with separate evolutionary fates/trajectories.
  4.  **Ecological Species Concept (EcSC):** Species as occupants of distinct adaptive zones/niches.
  5.  **Morphological/Phenetic Concept:** Species as clusters of physical similarity.
  6.  **Species-as-Individuals (Ghiselin/Hull):** Species as spatiotemporally bounded historical particulars, not natural kinds.

  **II. Facts of the Case (Neanderthals vs. *H. sapiens*)**
  1.  **Divergence:** Lineages split several hundred thousand years ago.
  2.  **Geography:** Allopatric origin (Africa vs. Eurasia), secondary contact in Eurasia.
  3.  **Morphology:** Consistently distinct skeletal features (robust vs. gracile) during overlap.
  4.  **Genetics:** Distinct mitochondrial and nuclear lineages, but evidence of introgression (1–4% Neanderthal DNA in non-African *H. sapiens*).
  5.  **Outcome:** Neanderthals disappear ~40kya; lineages remained distinguishable throughout contact.

  **III. Alignment and Grating**
  1.  **BSC:** *Grates* on evidence of interbreeding (suggests one species); *Aligns* on maintenance of distinctness despite contact (suggests isolation).
  2.  **PSC:** *Aligns* on genetic/morphological diagnosability; *Strains* on the degree of monophyly given introgression.
  3.  **EvSC:** *Aligns* on long-term separate trajectories; *Silent* on the precise moment of fusion/extinction.
  4.  **Morphological:** *Aligns* clearly (distinct fossils); *Risks* ignoring genetic reality.
  5.  **Individuality Thesis:** *Aligns* well (treats them as specific historical lineages); *Dissolves* the "kind" membership debate.
  6.  **Epistemic/Semantic/Ontological:** Case presses *Epistemic* (how much gene flow breaks species?) and *Semantic* (definition of isolation) hardest; *Ontological* status of lineages is least disputed.

  ***

  ### The Neanderthal Boundary: A Metaphysical Autopsy

  The dispute over the taxonomic status of Neanderthals is not merely a quarrel over nomenclature; it is the *locus classicus* for the species problem in paleoanthropology. It forces the philosopher of biology to confront the friction between the theoretical machinery of systematics and the messy reality of evolutionary history. To analyze this episode is to test our conceptual tools against a case where the stakes—human identity—are high, and the data—ancient DNA and bone—are equivocal. We must proceed in two directions: applying our concepts to the facts to see what verdicts they render, and then using the facts to stress-test the concepts themselves, specifically regarding the Biological Species Concept, the temporal dimension of speciation, and the unifying proposals of modern systematics.

  #### Theory to Case: The Verdicts of Concepts

  When we apply the major species concepts to the Neanderthal case, we find a spectrum of verdicts that reveals the operational priorities of each framework.

  The **Biological Species Concept (BSC)**, defined by reproductive isolation, delivers the most conflicted verdict. On a strict, synchronic reading, the discovery of Neanderthal DNA in modern human genomes suggests the barrier was permeable. If species are defined by the *absence* of gene flow, the presence of introgression implies *Homo neanderthalensis* and *Homo sapiens* were a single biological species. However, this reading strains against the fact that the two lineages remained morphologically and genetically distinguishable throughout their period of sympatry. The BSC captures the reality of contact but misses the reality of distinctness. It distorts the case if it treats any gene flow as disqualifying for species status, failing to account for "porous" isolation where lineages remain distinct despite hybridization.

  The **Morphological or Phenetic Concept** offers a clear, unequivocal verdict: two species. The fossil record presents two distinct clusters of traits—Neanderthals with their occipital buns and robust postcrania, modern humans with their gracile skeletons and vertical foreheads. This concept aligns perfectly with the paleontological practice that predates genomics. However, it risks missing the biological reality revealed by genetics. Morphology can be plastic or subject to convergent evolution; relying solely on it ignores the genetic integration that occurred. It captures the pattern of difference but remains silent on the process that generated it.

  The **Phylogenetic Species Concept (PSC)**, which defines species as the smallest diagnosable monophyletic groups, also leans toward a two-species verdict. Neanderthals form a distinct clade in most genomic analyses, diagnosable by unique genetic markers. This aligns with the genetic distinctness of the lineages. Yet, the PSC strains against the evidence of introgression. If modern humans carry Neanderthal alleles, strict monophyly is complicated by reticulation (network-like evolution rather than tree-like). The PSC captures the historical independence but struggles to formalize the boundaries when branches touch.

  The **Evolutionary Species Concept (EvSC)**, viewing species as lineages maintaining separate evolutionary fates, offers perhaps the most robust fit. For hundreds of thousands of years, Neanderthals and modern humans evolved independently in different geographic theaters. Even during overlap, they did not immediately fuse into a single homogeneous population; they remained distinct trajectories until the Neanderthal lineage terminated. This concept captures the temporal depth and the maintenance of identity better than the BSC. It aligns with the intuition that these were "different kinds of people" without requiring absolute reproductive sterility.

  The **Ecological Species Concept** is largely silent here, as reconstructing the precise niche differentiation of extinct hominins is speculative. While there is evidence of competition, we lack the fine-grained ecological data to determine if they occupied distinct adaptive zones. Finally, the **Species-as-Individuals Thesis** (Ghiselin/Hull) bypasses the question of "kinds" entirely. It treats Neanderthals as a specific historical particular, a spatiotemporally bounded lineage. This aligns well with the facts: they are a specific chunk of the tree of life. It dissolves the semantic worry about whether they fit a "class" definition, focusing instead on their historical continuity.

  #### Case to Theory: Stress-Testing the Concepts

  Having mapped the concepts onto the case, we must reverse the vector and ask what the Neanderthal episode reveals about the concepts themselves. The case is frequently cited as a counterexample to the Biological Species Concept. Is this assessment fair?

  It is a counterexample only to a caricature of the BSC. If the BSC is read as demanding *zero* gene flow, the Neanderthal case falsifies it. But defenders of the BSC (following Mayr) argue for reproductive *isolation* in a population-genetic sense, not absolute sterility. The key is whether the gene flow is sufficient to fuse the gene pools. In the Neanderthal case, the gene flow was asymmetric and limited (1–4%). The lineages did not fuse; the Neanderthal morphotype disappeared, but the *H. sapiens* lineage absorbed only fragments of Neanderthal genetics while maintaining its own integrity. Thus, the case does not refute the BSC so much as it demands a nuanced reading: species are groups that are *effectively* isolated, allowing for occasional leakage without loss of identity. The Neanderthal case shows that reproductive isolation is a matter of degree, not a binary switch.

  This leads to the vertical difficulty: the problem of time. The BSC is often applied to populations at a time-slice, but lineages change gradually. The Neanderthal case illuminates this by showing that speciation is a process, not an event. There was a point where the ancestral population split, and a period where they were allopatric (easy to call separate species), and a period of sympatry. The boundary is not a sharp line but a zone of interaction. The Neanderthal case demonstrates that vertical (ancestral-descendant) and horizontal (sister-species) problems are intertwined. We can distinguish Neanderthals from modern humans horizontally, but drawing the line vertically between *Homo heidelbergensis* (or whatever the ancestor was) and *H. neanderthalensis* remains arbitrary. The case confirms that species boundaries are fuzzy at the edges (the "twilight of speciation") even if distinct in the middle.

  #### The Organizing Device: Semantic, Ontological, Epistemic

  To bring order to these difficulties, we can separate the species problem into three questions: the **Semantic** (what does "species" mean?), the **Ontological** (what kind of thing is a species?), and the **Epistemic** (how do we identify them?).

  The Neanderthal case presses most heavily on the **Epistemic** and **Semantic** questions, leaving the Ontological relatively untouched. Ontologically, there is little dispute that the Neanderthal lineage was a real, historical entity. Whether one views species as kinds or individuals, the physical reality of the population is not in doubt. The dispute is Semantic: does the word "species" entail reproductive isolation (BSC) or historical independence (EvSC)? If we define species by isolation, Neanderthals are problematic; if by independence, they are clear.

  Consequently, the debate is largely Epistemic: which criteria should we trust? Paleontologists traditionally relied on morphology (Epistemic access via bones); geneticists rely on DNA (Epistemic access via sequences). The conflict arises because these epistemic tools yield different weights of evidence. The bones say "different"; the DNA says "mostly different, but connected." The Neanderthal case reveals that the "species problem" is often an "evidence problem." We are arguing over which operational criteria (morphology, genetics, reproductive compatibility) are the reliable indicators of the underlying reality.

  #### Evaluating De Queiroz's Unification

  This brings us to Kevin de Queiroz's "General Lineage Concept." De Queiroz proposes that all competing concepts agree on a single general notion: a species is a segment of a metapopulation lineage evolving separately from other such lineages. The apparent disagreements concern only the *operational criteria* (properties like reproductive isolation, monophyly, or diagnosability) used to recognize these segments.

  Does the Neanderthal case support this unification? It supports it strongly. Under de Queiroz's view, the debate over Neanderthals is not about the *definition* of species (everyone agrees they are lineages), but about whether the *evidence* of introgression outweighs the *evidence* of morphological and long-term genetic distinctness in determining "separate evolution."

  If we accept de Queiroz's framework, the BSC criterion (reproductive isolation) is merely one property that *evidences* separate evolution, not the definition of it. The Neanderthal case shows that reproductive isolation can be incomplete while separate evolution persists. Therefore, the BSC criterion fails as a necessary condition, but the General Lineage Concept holds: Neanderthals were a separately evolving lineage that experienced some secondary contact. The unification earns its keep here by dissolving the contradiction. It allows us to say, "They were separate species (lineages) that hybridized," without logical inconsistency. It shifts the debate from "Are they one or two?" to "Was the gene flow sufficient to halt their separate evolutionary trajectories?" (The answer being no, until extinction).

  However, the case also undercuts the unification slightly by revealing the practical difficulty of the "separately evolving" clause. If lineages can exchange genes and remain separate, how much exchange is allowed before they become one lineage? De Queiroz's concept pushes the vagueness back a step. It unifies the definitions but leaves the epistemic threshold undefined. The Neanderthal case shows that even with a unified ontology, the operational boundary remains a matter of pragmatic convention.

  #### Conclusion: What the Episode Reveals

  What does the Neanderthal episode reveal about the species problem that is not visible in the abstract? It reveals that the species problem is fundamentally a problem of **process versus pattern**.

  In the abstract, we debate definitions. In the Neanderthal case, we confront the dynamic nature of evolution. The case demonstrates that speciation is not a state of being but a history of becoming. The friction between the concepts arises because some (like BSC) focus on the *mechanism* maintaining distinctness (isolation), while others (like PSC/Morphological) focus on the *pattern* of difference (diagnosability).

  The Neanderthal case forces us to acknowledge that nature does not respect our categorical boundaries. Evolution produces lineages that are distinct yet connected, separate yet mingled. The "species problem" persists not because we lack a definition, but because the biological world is characterized by continuity, while taxonomy requires discontinuity. The Neanderthal debate teaches us that species concepts are not mirrors of nature but maps. Like any map, they simplify. The BSC map blurs the Neanderthal distinction because it prioritizes gene flow; the Morphological map sharpens it because it prioritizes form.

  Ultimately, the episode suggests that species realism (the idea that species are real individuals) is compatible with conceptual pluralism. We can accept that Neanderthals were a real historical individual (a lineage) while acknowledging that labeling them a "species" depends on which map we are using for which purpose. If our purpose is to understand gene flow, the BSC map is useful. If our purpose is to reconstruct phylogenetic history, the PSC map is useful. The Neanderthal case does not solve the species problem; it contextualizes it. It shows that the "problem" is not a failure of philosophy, but a necessary tension inherent in carving continuous history into discrete units of scientific study. We classify not because nature is boxed, but because our understanding requires handles. The Neanderthal remains both distinct and part of us, and our taxonomy must be robust enough to hold that paradox without breaking.
