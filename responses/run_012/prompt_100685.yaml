prompt: |-
  Hey, I’m hoping you can help me with something at work. I’m a data analyst at a company that’s about to decide whether to expand a new mentorship program. I’m not a philosopher or a statistician, but I’ve been reading some stuff about causal reasoning and it’s making me second-guess our numbers.

  Here’s the situation. We piloted the program in three offices. Overall, people who participated got promoted at a higher rate than people who didn’t: 18% vs 12%. But when I break it down by office, the program looks worse in every single office. Office A: 20% vs 25%. Office B: 15% vs 18%. Office C: 8% vs 10%. The VP says the overall number is what matters and wants to roll it out everywhere. My gut says something is off.

  Then I noticed something else. The program was optional, and people who joined were more likely to be in Office A, which has the highest promotion rate anyway. Also, within the program, people who attended the optional weekly coaching sessions had much better promotion rates than those who didn’t. But when I look at just the people who attended those sessions, the program actually looks worse than not doing it. So now I have three different comparisons and they point in different directions. I dont know which one to trust.

  Can you help me think through this? I need to give teh VP a recommendation, and I want to be honest about the uncertainty. Please act as an expert in causal inference and philosophy of science. Start by brainstorming all the possible explanations for why the numbers look like this, then walk me through what I should and shouldn’t condition on. Don’t just give me a label for what’s happening—I need to understand what to actually do. Also, if there’s a way to frame this for a non-technical exec, that would help. Thanks!
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Role:** Data Analyst at a company.
      *   **Task:** Evaluate a mentorship program for expansion based on pilot data.
      *   **Problem:** Conflicting statistical signals (Simpson's Paradox + Collider Bias/Selection Bias).
          *   Overall: Program > No Program (18% vs 12%).
          *   By Office (A, B, C): Program < No Program in all three.
          *   Selection Bias: Program participants clustered in high-performing Office A.
          *   Conditioning on Mediator/Collider: Within program, coaching attendees did better, but conditioning on attendance makes the program look worse.
      *   **Goal:** Provide a recommendation to the VP, explain the uncertainty, and act as an expert in causal inference and philosophy of science.
      *   **Constraints:** Don't just label the phenomena (e.g., "This is Simpson's Paradox"). Explain *what to do* and *what to condition on*. Provide a non-technical framing for the exec.

  2.  **Deconstruct the Statistical Phenomena:**
      *   **Phenomenon 1: Overall vs. Stratified (Office).**
          *   Overall: Program looks good.
          *   Stratified by Office: Program looks bad in every office.
          *   *Cause:* Confounding by Office. Office A has high promotion rates *and* high program participation. Office C has low rates *and* low participation.
          *   *Causal Structure:* Office $\rightarrow$ Promotion, Office $\rightarrow$ Program Participation. Program $\rightarrow$ Promotion (maybe).
          *   *Action:* We *must* control for Office. The stratified view is the causal truth here (assuming no other confounders). The overall number is misleading due to the composition of the groups. This is classic Simpson's Paradox driven by confounding.
      *   **Phenomenon 2: Coaching Sessions.**
          *   Observation: Attendees did better than non-attendees.
          *   Observation: Conditioning on attendance makes the program look worse than not doing it.
          *   *Cause:* This sounds like **Collider Bias** (or selection bias) or **Mediation** gone wrong.
          *   *Scenario A (Mediation):* Program $\rightarrow$ Attendance $\rightarrow$ Promotion. If we control for attendance, we block the path. But the user says "when I look at just the people who attended those sessions, the program actually looks worse." This implies comparing Program+Attendee vs. No Program (who couldn't attend). That's an unfair comparison.
          *   *Scenario B (Collider/Selection):* Maybe only high performers *or* struggling employees attended? If attendance is influenced by both the Program and unobserved Motivation/Ability, conditioning on Attendance opens a backdoor path.
          *   *Refinement:* The prompt says "within the program, people who attended... had much better promotion rates." Then, "when I look at just the people who attended those sessions, the program actually looks worse than not doing it." This is slightly ambiguous. It likely means: Comparing (Program + Attended) vs. (No Program). Since No Program people *couldn't* attend, this is comparing a selected subgroup of the treatment to the whole control group. This is **Post-Treatment Bias**. You cannot condition on a variable caused by the treatment (Attendance is caused by Program Enrollment).
          *   *Action:* Do *not* condition on coaching attendance for the main causal estimate. It's a mediator or a collider.

  3.  **Formulate the Causal Inference Strategy:**
      *   **Identify the Question:** What is the Average Treatment Effect (ATE) of *offering/enrolling* in the program?
      *   **Identify the Confounders:** Office location is a clear confounder (affects both selection into program and outcome).
      *   **Identify the Colliders/Mediators:** Coaching attendance is post-treatment. Do not condition on it for the main decision.
      *   **The "Truth":** The stratified by office numbers (20% vs 25%, 15% vs 18%, 8% vs 10%) are the most reliable estimate of the program's effect *given the current data*, because they adjust for the confounding office effect. They show a negative effect.
      *   **Caveat:** Self-selection bias remains. Even within offices, motivated people might join. The observational data might still be biased. Randomization would be ideal.

  4.  **Drafting the Response (Iterative Process):**

      *   *Tone:* Empathetic, expert, philosophical but practical.
      *   *Structure:*
          1.  Validation (Your gut is right).
          2.  Brainstorming Explanations (The "Why").
          3.  Causal Diagrams/Logic (What to condition on).
          4.  The Recommendation (What to tell the VP).
          5.  Non-Technical Framing (The "Exec Summary").

      *   *Section 1: Validation.* Acknowledge Simpson's Paradox without just name-dropping it. Explain *why* the aggregate lies.
      *   *Section 2: Brainstorming.*
          *   Confounding (Office).
          *   Self-Selection (Motivation).
          *   Post-Treatment Bias (Coaching).
      *   *Section 3: What to Condition On.*
          *   **DO** condition on Office (Pre-treatment confounder).
          *   **DO NOT** condition on Coaching (Post-treatment variable). Explain the "blocking the path" or "opening the collider" logic simply.
      *   *Section 4: The Verdict.* The program likely has a neutral or negative effect based on the stratified data. The overall 18% vs 12% is an illusion of composition.
      *   *Section 5: Philosophy of Science angle.* Mention that correlation $\neq$ causation, but also that "controlling for everything" is wrong. We need a model of the world, not just data.
      *   *Section 6: Exec Framing.* Use an analogy (e.g., hospital survival rates, or sports teams).

  5.  **Refining the "Coaching" Logic:**
      *   The prompt says: "within the program, people who attended... had much better promotion rates." (Attendance correlates with success).
      *   Then: "when I look at just the people who attended those sessions, the program actually looks worse than not doing it."
      *   *Wait, let's parse that carefully.* If I look at *just* attendees, I can't compare to "not doing it" because non-participants couldn't attend.
      *   *Interpretation:* The user likely means comparing (Program + Attended) vs (No Program). Since (No Program) people have 0% attendance, this is comparing a "super-selected" group to a general group.
      *   *Better Interpretation:* Maybe they mean comparing (Program + Attended) vs (Program + Did Not Attend)? No, the text says "worse than not doing it."
      *   *Most likely Causal Issue:* This is **Post-Treatment Bias**. Attendance is a *mediator* (Program $\rightarrow$ Attendance $\rightarrow$ Promotion). If you control for attendance, you remove the benefit of the program. Or, if attendance is a *collider* (Program $\rightarrow$ Attendance $\leftarrow$ Motivation), conditioning on it biases the estimate.
      *   *Advice:* Ignore the coaching breakdown for the *expansion decision*. It answers "does coaching help?" not "does the program work?"

  6.  **Refining the "Office" Logic:**
      *   This is the critical decision point.
      *   Aggregate: +6% (18-12).
      *   Stratified: -5% (A), -3% (B), -2% (C).
      *   Why? Office A has high base rates (25% control) and high uptake. Office C has low base rates (10% control) and low uptake.
      *   Weighted Average of Stratified: Let's check the math mentally.
          *   If Office A is huge and has high uptake, it drags the overall average up.
          *   The stratified numbers suggest the program *reduces* promotion chances relative to peers in the same office.
      *   *Conclusion:* Trust the stratified numbers.

  7.  **Final Polish:**
      *   Ensure I don't sound like a textbook. Use "we" and "you."
      *   Make sure the "Philosophy of Science" aspect comes through (theory-laden observation, causal structures).
      *   Check the "Non-technical exec" section for clarity.

  8.  **Self-Correction during drafting:** I need to be careful not to say definitively "The program fails." Observational data always has unobserved confounding (e.g., motivation). I need to emphasize *uncertainty*. The stratified data suggests failure, but self-selection within offices could still hide a positive effect (maybe only struggling employees joined within Office A?). I should recommend a randomized trial or a more robust quasi-experimental design (propensity scoring) before a full rollout. *Correction:* The prompt asks for a recommendation now. I should advise *against* full rollout based on current evidence, suggesting a controlled experiment instead.

  9.  **Final Plan:**
      *   Intro: Validate the intuition.
      *   Part 1: The Three Stories (Confounding, Selection, Post-Treatment).
      *   Part 2: The Rules of Conditioning (The "Do's and Don'ts").
      *   Part 3: The Recommendation (Pause & Test).
      *   Part 4: The VP Script (Analogy based).

  *(Self-Correction on the Coaching part)*: Re-reading: "when I look at just the people who attended those sessions, the program actually looks worse than not doing it." This is logically impossible if "not doing it" means "Control Group" because Control Group cannot attend sessions.
  *Hypothesis:* The user might mean comparing (Program + Attended) vs (Control). If (Program + Attended) < (Control), that's bad.
  *Alternative Hypothesis:* The user means comparing (Program + Attended) vs (Program + Did Not Attend). But the text says "worse than not doing it."
  *Decision:* I will address this as **Post-Treatment Bias**. Conditioning on a variable that happens *after* enrollment (attendance) distorts the causal effect of enrollment. I will advise ignoring this metric for the expansion decision.

