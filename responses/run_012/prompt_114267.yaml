answer: |-
  Welcome to the department. It is a rare pleasure to argue with someone who knows the difference between a valid argument and a sound one. Your grad student has constructed a valid argument (the conclusion follows from the premises), but as you suspect, it is not sound. One or more of the premises are hiding a falsehood.

  You asked which step to give up. The short answer is: **You need to break Step 7, but to do that, you must refine Step 4.**

  The grad student's argument relies on a category error. It treats all conventions as if they are the same kind of object. In your field, you wouldn't treat a salt bridge and a disulfide bond as the same thing just because they both stabilize a structure. In moral philosophy, we have to distinguish between **coordination conventions** (queues, driving sides) and **normative conventions** (tipping, bribery).

  Here is the breakdown of the flaws, the "quiet word" you sensed, and the distinction between the visitor and the local.

  ### 1. The "Quiet Word" in Steps 3 and 4
  You sensed a word doing quiet work. That word is **Reciprocity** (or, negatively, **Free-Riding**).

  Step 4 states: *"Imposing a foreseeable cost on people who aren't doing anything to me, for no reason beyond my own convenience, is wrong."*

  This is a strong moral principle, but it is incomplete. It describes *harm*, but it doesn't describe *obligation*. I impose a foreseeable cost on my competitors when I open a better shop; that is not wrong. I impose a cost on a driver when I merge in front of them; that is not wrong if I signal and there is space.

  The wrongness in tipping (or queue jumping) comes from **accepting the benefits of a cooperative scheme while refusing to bear the burdens.** This is the **Principle of Fairness** (articulated by H.L.A. Hart and John Rawls).
  *   If I eat at the restaurant, I accept the benefit of the service.
  *   The service is priced under the convention that the tip is part of the wage.
  *   If I withhold the tip, I am not just "saving money"; I am extracting labor without paying the agreed-upon price. I am free-riding.

  The "quiet word" is **Consent**. Not explicit consent (nobody signs a tip contract), but **voluntary acceptance of benefits**.

  ### 2. The Queue vs. The Tip (Your Econ Colleague)
  Your econ colleague is right that they are different animals, but wrong that this doesn't do moral work.

  *   **The Queue is a Coordination Problem.** The goal is efficiency. It does not matter if we stand on the left or the right, only that we agree. If I jump the queue, I violate the *efficiency* of the system. The cost I impose is **chaos** and **delay**.
  *   **The Tip is a Deferred Wage.** This is not merely coordination; it is **distribution**. The waitress has structured her financial life around the convention that you will tip. The price on the menu is not the full price. If I don't tip, I am not causing chaos; I am causing **exploitation**.

  **Why this matters for your argument:**
  Step 7 claims that *any* convention is binding, even rotten ones (like bribery).
  *   If the convention is a **Coordination Convention** (drive on the right), you must follow it even if you think driving on the left is theoretically better, because breaking it causes immediate harm (crashes).
  *   If the convention is a **Normative Convention** (bribery), it fails the test of **Justice**. A convention that requires you to violate a moral law (corruption) generates no obligation, even if everyone expects it.

  So, Step 2 ("Nothing... says the convention has to be a good idea") is where the argument begins to rot. Conventions only generate *moral* obligations if they are compatible with background moral principles (like "do not steal" or "do not corrupt").

  ### 3. The Reformer's Dilemma (Attacking Step 7)
  Step 7 says: *"Nobody could ever reform anything from the inside, since the reformer is by definition the one who breaks the expectation."*

  This is false because it ignores the **motive clause** in Step 4 ("...for no reason beyond my own convenience").

  *   **The Queue-Jumper:** Breaks the rule for **convenience** (I am in a hurry). This is wrong because it free-rides on the patience of others.
  *   **The Reformer:** Breaks the rule for **justice** (This rule is exploitative).

  The reformer *does* impose a cost (uncertainty, social friction). But the reformer argues that the cost of *maintaining* the convention is higher than the cost of breaking it.
  *   **Suffragettes** broke the convention of "women don't vote." They imposed a cost on the social order. But they were not queue-jumpers; they were challenging the legitimacy of the queue itself.
  *   **The Tipping Reformer:** If you believe tipping is morally rotten (wage subsidization), you can refuse to tip *if* you pay the server the difference directly or advocate for a no-tip policy. But if you just pocket the money? That's convenience, not reform.

  So Step 7 collapses. Reformers are not queue-jumpers; they are system-architects. They break the *expectation* to fix the *obligation*.

  ### 4. The Visitor vs. The Local
  You asked: *"What does the visitor owe that the local doesn't, if anything?"*

  Surprisingly, the answer is: **The visitor owes stricter compliance, but has less right to reform.**

  *   **The Local:** Is a participant in the creation and maintenance of the social contract. They have a stake in the system. If the system is rotten (bribery), they have a duty to reform it. If the system is fair (tipping), they have a duty to sustain it.
  *   **The Visitor:** Is a **guest**. When you enter a system temporarily, you do not have the standing to reform it. You lack the knowledge and the stake.
      *   If you don't tip in Rome, you aren't making a statement about wage labor; you're just stealing service.
      *   If you don't bribe the inspector in a corrupt town, you are right to do so (moral law trumps convention), but you must accept the cost (delays).

  The distinction lies in **Voluntary Acceptance of Benefits** (the seminar-mate's point).
  *   **The Local:** Cannot easily opt out of the society. Their "acceptance" is tacit.
  *   **The Visitor:** *Chooses* to enter the restaurant/country. By walking through the door, you signal: "I accept your terms of service."

  The seminar-mate said the Fair Play argument collapses because "nobody asked for the benefits." This is the **Nozickian Objection**. Robert Nozick argued that you can't force me to pay for a public radio station just because I listened to it.
  *   **Counter:** You can't force me to listen. But if I *choose* to sit in the restaurant and order food, I have actively taken the benefit. I didn't just have it pushed on me.

  ### 5. Which Step to Give Up?
  To save your intuition (that stiffing a waitress is wrong, but bribery is not), you must modify **Step 2** and **Step 7**.

  **Reject Step 2 as morally neutral.**
  Conventions are not morally neutral. A convention only generates a *moral* obligation if the convention itself is permissible.
  *   *Correction:* "A convention generates an obligation only if the practice it coordinates is itself morally permissible." (This kills the bribery example).

  **Refine Step 4 to include 'Free-Riding'.**
  *   *Correction:* "Imposing a foreseeable cost... to **free-ride on a cooperative scheme**... is wrong."
  *   This allows the reformer to break the convention. They are not free-riding; they are absorbing the cost of change to improve the scheme.

  **Clarify Step 3 regarding Visitors.**
  *   Visitors impose a *higher* relative cost on trust than locals. If a local doesn't tip, the server thinks, "Bad customer." If a foreigner doesn't tip, the server thinks, "People from *there* don't tip." The visitor represents a group; the local represents themselves. The visitor's breach generalizes more dangerously.

  ### Summary for your next seminar
  1.  **The Flaw:** The argument conflates *coordination* (queues) with *distribution* (tips) and ignores the requirement that conventions must be *just* to bind us (bribery).
  2.  **The Quiet Word:** **Reciprocity**. We are bound not by expectation alone, but by the unfairness of taking benefits without paying costs.
  3.  **The Reformer:** Is not breaking the rule for *convenience* (Step 4), but for *justice*. Step 7 is false because it ignores motive.
  4.  **The Visitor:** Has a stricter duty to comply because they are voluntarily entering a system they did not build, whereas the local has a duty to comply *unless* the system is unjust, in which case they have a duty to reform.

  You can keep (4) if you add "unjustly" or "without justification." You must reject (2) and (7). Conventions are not just regularities; they are implicit contracts. And like any contract, if the terms are illegal (bribery), the contract is void. If the terms are fair (tipping), you pay.

  Tell the grad student she has built a lovely crystal lattice, but she forgot to check for solvent channels. The logic holds together, but there's no room for morality to get inside.
