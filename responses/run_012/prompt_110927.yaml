answer: |-
  This is an excellent set of worries, and frankly, the fact that you are having them suggests you are engaging with the literature at exactly the right level for a graduate seminar. The landscape of expressivism has shifted significantly since the standard textbook presentations of the Frege-Geach (F-G) problem (which often rely on the 1960s/70s formulations).

  Your reconstruction captures the *intuition* behind the problem, but it conflates a specific, largely abandoned solution with the general expressivist project. If you present the "second-order attitude" view as the *only* option expressivists have, you will indeed be presenting a straw man that contemporary expressivists (like Allan Gibbard, Mark Schroeder, or Simon Blackburn in his later work) would reject.

  Here is a breakdown of where your reconstruction needs tweaking, how to handle the logic question, and how to address the "collapse into cognitivism" worry.

  ### 1. Correcting the Reconstruction: The "Second-Order Attitude" Straw Man

  Your reconstruction says: *So the expressivist has to say that 'not wrong' expresses some second-order attitude, like disapproval of the disapproval of lying.*

  This is actually the **target** of Mark Schroeder's formulation of the Negation Problem (in *Being For*, 2008), not the standard expressivist solution.
  *   **The Old View:** Early expressivists sometimes tried to analyze "It is not the case that lying is wrong" as expressing a distinct attitude (e.g., tolerance, or disapproval of disapproval).
  *   **The Problem:** As you noted, this makes the meaning of "not" ambiguous between descriptive contexts (truth-functional negation) and moral contexts (attitude negation). This leads to the charge of equivocation in mixed arguments (e.g., "If lying is wrong, then getting your brother to lie is wrong. Lying is not wrong. Therefore...").
  *   **The Contemporary View:** Most sophisticated expressivists do **not** claim that negation expresses a second-order attitude. Instead, they try to explain negation in terms of **inconsistency between attitudes**.
      *   For a cognitivist, $P$ and $\neg P$ are inconsistent because they cannot both be *true*.
      *   For an expressivist, $P$ and $\neg P$ must be inconsistent because holding the attitude expressed by $P$ is incompatible with holding the attitude expressed by $\neg P$.
      *   Schroeder's challenge is: *Which* attitudes are these? If "Lying is wrong" expresses *disapproval of lying*, what attitude does "Lying is not wrong" express such that having both attitudes is a form of inconsistency (like contradiction) rather than just psychological tension?

  **Lecture Tip:** Distinguish the **Embedding Problem** (how do moral sentences work in conditionals?) from the **Negation Problem** (how do we account for logical inconsistency without truth conditions?). The Negation Problem is often viewed now as the harder, more fundamental version of F-G.

  ### 2. The Logic Question: Classical vs. Non-Classical

  You ask: *Is the standard expressivist reply to say that moral arguments are valid in a non-classical sense, or do they just bite the bullet and admit that moral modus ponens isn't really valid?*

  **The Short Answer:** Almost no expressivist wants to bite the bullet and say moral modus ponens is invalid. That is theoretically suicidal. The goal of "Quasi-Realism" (Blackburn) and "Norm-Expressivism" (Gibbard) is specifically to **earn the right** to classical logic.

  **The Options:**
  1.  **Quasi-Realism / Deflationism (Blackburn, Gibbard, Schroeder):** They argue that we can define logical validity in terms of **attitude consistency** rather than **truth preservation**. If the attitudes expressed by the premises are inconsistent with the negation of the conclusion, the argument is valid. They argue this *mimics* classical logic perfectly well without committing to moral truth-conditions in a robust, realist sense.
      *   *Gibbard's Move:* He analyzes moral judgments as states of *planning* or *norm-acceptance*. Logic becomes the logic of consistency in planning.
      *   *Schroeder's Move:* He proposes a "logic of attitudes" where the structure of the attitudes themselves mirrors the structure of truth-functional logic (the "B-type" vs. "A-type" attitude distinction).
  2.  **Logical Expressivism (Dreier):** Some, like Jamie Dreier, have been more open to the idea that moral logic might differ slightly from descriptive logic, but even they usually aim to preserve the *validity* of standard inferences, even if the metaphysical explanation differs.
  3.  **Inferentialism (Chrisman, Price):** Some newer views bypass the truth-conditional framework entirely and argue that the meaning of moral terms is constituted by their inferential roles. If the inferential role matches classical logic, then the logic holds.

  **Verdict for your lecture:** Tell your students that the expressivist *project* is to reconcile expressivism with classical logic. If they fail, expressivism fails. It is not an option to simply say "moral logic is different" unless they can explain why moral arguments *seem* classically valid while not actually being so (an error theory), which most expressivists reject.

  ### 3. The Collapse Objection: "Cognitivists with Extra Steps?"

  You ask: *If they respond by giving truth conditions for embedded moral sentences, haven't they just become cognitivists with extra steps?*

  This is the **"Fregean Objection"** to Quasi-Realism. It is one of the most potent objections in the literature (championed by realists like G.E. Moore historically, and more recently by people like Zangwill or Miller).

  **The Expressivist Reply:**
  They rely on a **Deflationary (or Minimalist) Theory of Truth**.
  *   **Cognitivism:** Commits to truth conditions that involve *correspondence to mind-independent moral facts*. To say "It is true that lying is wrong" is to describe the world.
  *   **Quasi-Realist Expressivism:** Commits to truth conditions that are merely logical devices for expressing agreement. To say "It is true that lying is wrong" is just to re-express the attitude that lying is wrong.
  *   **The Distinction:** They argue there is a difference between *earning the right to talk about truth* (which they can do) and *being committed to robust moral facts* (which they avoid).

  **Is this convincing?**
  Many philosophers (including some sympathetic to expressivism) worry that this distinction is unstable. If you have truth conditions, boolean logic, and validity, what work is the "expressivism" doing?
  *   **Hybrid Views:** Because of this worry, many contemporary metaethicists have moved to **Hybrid Expressivism** (e.g., Daniel Boisvert, Michael Ridge). They argue moral sentences *both* express attitudes *and* describe facts (e.g., facts about the speaker's standards). This solves F-G easily (because there are truth conditions) but risks losing the distinctive metaethical motivation for expressivism.

  ### 4. Addressing Your Grad Student

  Your grad student is pressing a vital point. You should tell her:
  *   She is correct that defining negation for attitudes is not separate from F-G; it is the **mechanism** by which F-G must be solved.
  *   If you cannot define negation for attitudes such that it preserves logical relations (like contradiction), you cannot solve F-G.
  *   However, it is not a *new* objection; it is the sharpened, contemporary formulation of the original F-G problem (specifically via Schroeder).

  ### 5. Suggested Lecture Structure

  To present the strongest version of the objection without misrepresenting the field, I suggest this arc:

  1.  **The Classic F-G Problem:** Embedding in conditionals. (The "If lying is wrong..." puzzle).
  2.  **The Negation Problem (Schroeder):** Sharpen the focus. It's not just about conditionals; it's about inconsistency.
      *   Show why the "disapproval of disapproval" model fails (the ambiguity of 'not').
      *   Explain the challenge: How can two sentences be logically inconsistent if they only express attitudes?
  3.  **The Expressivist Solutions:**
      *   **Quasi-Realism:** Earning the right to truth-talk via deflationism.
      *   **Plan-Based/Logic of Attitudes:** Gibbard/Schroeder. Logic is about consistency of plans/attitudes, not truth.
  4.  **The Collapse Objection:** If they succeed in earning the right to truth-talk, do they cease to be expressivists? (Invite the class to debate whether Deflationary Truth is enough to distinguish the views).
  5.  **Conclusion:** The F-G problem is not a "proof" that expressivism is inconsistent with classical logic, but rather a **constraint** on expressivist theories. Any viable expressivism *must* solve it. Those that don't are dead. Those that do (like Gibbard's) are the live options.

  ### Summary for your peace of mind:
  *   **Don't say:** Expressivists *must* use second-order attitudes. (They don't; that's a failed model).
  *   **Don't say:** Expressivists abandon classical logic. (Most fight tooth and nail to keep it).
  *   **Do say:** The burden of proof is on the expressivist to explain logical inconsistency without truth-conditions.
  *   **Do say:** The line between sophisticated expressivism and cognitivism is thin (deflationary truth), and whether that line holds is a major open question in metaethics.

  You aren't misrepresenting the *problem*, but you are attributing a specific (and weak) *solution* to the expressivists generally. Updating that distinction will make your lecture much stronger and satisfy your grad student.
