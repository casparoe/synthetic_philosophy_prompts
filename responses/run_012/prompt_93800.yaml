answer: |-
  # Game Design: The Bureau of Outcomes

  ## 1. Concept & Learning Objectives
  **Title:** The Bureau of Outcomes
  **Theme:** Teams manage regional branches of a public health agency.
  **Goal:** Maximize *Community Health* (Hidden/True Goal).
  **Metric:** Maximize *Performance Score* (Public/Rewarded Metric).
  **Core Tension:** The Performance Score is correlated with Health initially, but the rules of scoring shift over five rounds to decouple them. Rational play leads to high Scores and collapsing Health.

  **The Four Mechanisms Embedded:**
  1.  **Extremal Overshoot:** High investment in the metric yields diminishing returns on the goal.
  2.  **Regime Shift:** In later rounds, the correlation between effort and outcome breaks in the "tail" (high score) region.
  3.  **Downstream Proxy:** One round allows manipulating the report without changing the reality.
  4.  **Cheapest Path:** A hidden rule rewards a specific, low-effort configuration that inflates the score.

  ## 2. Materials List
  *   **Paper:** 5 "Branch Ledger" sheets (one per team), 5 "Action Menu" sheets, scrap paper for calculations.
  *   **Tokens:** 50 small paper squares per team (labeled "Effort Units").
  *   **Whiteboard:** To track the Public Leaderboard (Performance Score) only.
  *   **Facilitator Sheet:** A hidden ledger to track *Community Health* per team (never shown until debrief).
  *   **Envelopes:** 5 small envelopes (one per team) for submitting round decisions secretly.

  ## 3. Setup & Rules (Handout Text)
  *   **Teams:** 5 Teams of 3–4 students.
  *   **Endowment:** Each team receives 10 Effort Units per round.
  *   **Actions:**
      *   **Treatment:** Costs 2 Units. Increases *Health* and *Score*.
      *   **Administration:** Costs 1 Unit. Increases *Score* only.
      *   **Reporting:** Costs 1 Unit. Increases *Score* significantly.
  *   **Scoring:**
      *   *Performance Score* = (Treatment × 2) + (Admin × 1) + (Reporting × 3).
      *   *Community Health* = (Treatment × 2) + (Random Noise). **Do not tell them this formula.** Tell them Health is "complex and lagged."
  *   **Winning:** The team with the highest cumulative *Performance Score* wins public recognition (and hypothetical funding).
  *   **Submission:** Place your allocation in the envelope. Facilitator calculates scores.

  ## 4. Round-by-Round Timeline (75 Minutes Total)

  | Time | Phase | Activity | Facilitator Note |
  | :--- | :--- | :--- | :--- |
  | **00-10** | **Briefing** | Distribute materials. Explain rules neutrally. Emphasize that *Score* determines funding. | Do not mention Health tracking. |
  | **10-17** | **Round 1** | **Baseline.** Standard rules. | Health and Score correlate tightly. |
  | **17-24** | **Round 2** | **Pressure.** Announce: "Budget Cut. You now have 8 Units." | Scarcity forces trade-offs. Correlation holds but tightens. |
  | **24-31** | **Round 3** | **The Symptom.** Announce: "Field Access Suspended. No Treatment allowed this round." | Teams must use Admin/Reporting. Score rises, Health stagnates. |
  | **31-38** | **Round 4** | **Selection.** Hand Team 5 a "Policy Waiver": *"You may exclude 50% of your caseload from the denominator."* (Others don't know). | Team 5 inflates Score easily. Others struggle. |
  | **38-45** | **Round 5** | **The Exploit.** No announcement. **Hidden Rule:** If a team spends 0 on Treatment, add +15 Bonus Score ("Efficiency Dividend"). | Rational actors discover the loophole. Health crashes. |
  | **45-55** | **Reveal** | Collect final sheets. Reveal the Hidden Health Ledger. Show the divergence. | Let the silence sit. |
  | **55-75** | **Debrief** | Structured discussion (see Script). | Map mechanics to theory. |

  ## 5. Payoff Scheme & Secret Ledger
  *   **Public:** Whiteboard list of cumulative *Performance Scores*.
  *   **Private:** Facilitator sheet tracking *Health Points*.
      *   *Formula:* Health = (Treatment Units × 2) + (Round Number).
      *   *Round 3:* Health = Previous Round Health (Stagnation).
      *   *Round 5:* If Treatment = 0, Health = Previous Health - 5 (Decay).
  *   **The Exploit:** In Round 5, check envelopes. If Treatment = 0, add 15 to their *Score* publicly. Do not explain why yet.

  ## 6. Facilitator Script (One-Page)

  **Intro:** "You are Regional Directors. Your funding depends on your Performance Score. You have 10 Units of Effort. Allocate them to Treatment, Admin, or Reporting. Submit in envelopes. I will calculate scores."

  **Round 3 Announcement:** "Due to logistical constraints, no Treatment actions are valid this round. You must maintain operations using Admin and Reporting only."

  **Round 4 Announcement:** "Standard procedures apply." *(Hand Team 5 the Waiver Card privately before the round starts).*

  **Round 5 Announcement:** "Final round. Maximize your Score." *(Apply Hidden Exploit Rule during calculation).*

  **The Reveal:** "You optimized for Score. Here is the Health ledger I kept. Note the divergence. Team X won the Score; Team Y won the Health. They are not the same team."

  **Managing Pushback:** If they say "We knew this," reply: "You knew the concept. Did you feel the structural compulsion? Could you have acted differently and kept your funding?"

  ## 7. What Will Predictably Go Wrong (And How to Handle It)

  1.  **Collusion:** Teams might agree to all play "Honest."
      *   *Fix:* Emphasize *relative* ranking. "Top two branches receive funding; the rest are closed." Prisoner's Dilemma dynamics prevent collusion.
  2.  **Math Bog:** Students spend too long calculating optimal splits.
      *   *Fix:* Enforce a 5-minute hard stop per round. Use a timer. "Good enough" decisions are part of the stress test.
  3.  **Suspicion of Secret Ledger:** "You're fudging the Health numbers."
      *   *Fix:* Write the Health Formula on the board *after* the reveal. Show the math is deterministic, not subjective.
  4.  **The Exploit Goes Undiscovered:** No team plays Treatment = 0.
      *   *Fix:* If no one triggers it, *you* trigger it for the lowest-performing team as a "Bailout." Say: "The algorithm favored this profile." It makes the point about systemic bias rather than player cleverness.
  5.  **Cynicism:** "This is just a game, real life has ethics."
      *   *Fix:* In debrief, ask: "If your real job depended on this Score, and your rent depended on this job, would the 'game' frame hold?"

  ## 8. The Debrief Plan (20 Minutes)

  **Phase 1: The Data (5 mins)**
  *   Project the two leaderboards (Score vs. Health).
  *   Ask: "At what round did these diverge?" (Likely Round 3).
  *   Ask Team 5: "How did the Waiver feel? Was it gaming or strategy?"

  **Phase 2: Mapping Mechanisms (10 mins)**
  *   *Round 1 (Correlation):* "Why did honest work work here?" -> **Proxy Validity.** The measure tracked the goal in the normal regime.
  *   *Round 3 (Symptom):* "You couldn't treat, but scores rose." -> **Causal Decoupling.** The measure was a downstream effect (a report), not the cause. Manipulating the report did nothing to the disease.
  *   *Round 4 (Selection):* "Team 5 changed the denominator." -> **Cream Skimming / Redefinition.** This isn't gaming the measure; it's gaming the *population*. Distinguish *improving service* from *serving easier clients*.
  *   *Round 5 (Exploit):* "The Zero-Treatment Bonus." -> **Specification Gaming.** The rule rewarded the *cheapest path* to the number, actively punishing the goal.
  *   *Naming:* Now introduce **Goodhart's Law** and **Specification Gaming**. Ask: "Is this one law, or four different failures?" (Guide them to see it's a cluster).

  **Phase 3: Limits of the Model (5 mins)**
  *   **The Tautology Critique:** "Some economists say Goodhart's Law is trivial: of course optimizing a proxy diverges from the goal. Why is that view insufficient?" (Answer: It ignores the *political* cost of the divergence).
  *   **Institutional Rot:** "What happens in Round 6?" (Answer: Trust collapses. Auditing costs skyrocket. The game cannot simulate the long-term erosion of professional ethos).
  *   **Value Pluralism:** "What if Health and Score *should* diverge?" (Answer: Sometimes the proxy captures a value we *don't* want, e.g., efficiency vs. equity. The problem isn't measurement error; it's conflicting values).

  ## 9. Scaling Note: Running for 8 Students
  With only 8 students, you cannot run 5 teams of 4. The dynamic shifts from "market competition" to "duopoly."

  **Adjustments:**
  1.  **Two Teams Only:** Team A and Team B.
  2.  **Instructor as Market:** Instead of competing against each other for rank, they compete against a "Target Score" set by the Instructor. If both miss it, both lose funding. This reduces direct hostility and increases focus on the rule structure.
  3.  **Transparent Health:** With fewer players, the secret ledger feels more suspicious. Make the Health calculation partially public (e.g., "Health is Treatment minus Decay") but keep the *Decay Rate* hidden until Round 5.
  4.  **Role Rotation:** Have students swap roles mid-game (one becomes the Auditor, one the Director) to feel the constraint from different angles.
  5.  **Debrief Depth:** With fewer students, you can go deeper into individual decision logs. Ask specific students: "At Round 3, why did you choose Reporting over Admin?"

  ## 10. Facilitator Cheat Sheet: The "Four Failures"
  *Keep this handy to ensure you hit the theoretical targets during debrief.*

  1.  **Regression/Overshoot:** (Rounds 1-2) The measure works until you push it too hard.
  2.  **Causal Reversal:** (Round 3) Moving the measure does not move the goal (Thermometer vs. Fever).
  3.  **Population Shift:** (Round 4) Changing *who* is measured rather than *how well* they are served.
  4.  **Loophole Optimization:** (Round 5) Finding the path of least resistance that satisfies the rule but violates the spirit.

  **Final Warning:** Do not let them leave thinking "Measurement is impossible." The lesson is "Measurement is political." The design of the metric is a design of the society.
