      *   **Naming:** Propose **"Vicarious Cognition"** or **"Outsourced Popperianism."** Explain why "Gregorian" doesn't fit (Gregorian implies *enhanced* internal simulation, not *replaced* simulation).
      *   **Unifying Principle:** The **Black Box of Selection**. The agent executes; the system selects.
