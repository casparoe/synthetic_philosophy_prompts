  Based on the verdicts provided, your friend is operating as a **Minarchist** (a libertarian who accepts a "Night Watchman" state) rather than an Anarcho-Capitalist (who would view all taxation as theft). The key to cracking her code is distinguishing whether she justifies the Night Watchman exception based on the *nature of the service* or the *universal benefit* it provides.

  Here are the two rules that fit her previous calls equally well, their predictions for the university tax, and the test case to distinguish them.

  ### Rule 1: The Minarchist Function Test
  **The Rule:** Taxation is only legitimate (not theft) if it funds the core protective functions of the state (courts, police, military). Any tax funding social, cultural, or economic services is theft, regardless of whether the taxpayer benefits from them.
  *   **Logic:** This relies on the *Non-Aggression Principle* with a Minarchist exception. The state is only permitted to use force (tax) to protect rights. Schools, museums, and universities are not rights-protection agencies; therefore, funding them coercively is theft.
  *   **Fits the Data:**
      *   *Night Watchman Tax:* Not Theft (Core function).
      *   *Schools/Museum/Fed Tax:* Theft (Non-core functions).
      *   *Private Toll:* Not Theft (Voluntary contract, not tax).
      *   *Parentheticals ("no kids", "never visits"):* These are rhetorical emphasis on the *injustice* of the coercion, not the definition of it. (i.e., "It's theft, and the fact that I don't even use it makes it worse.")
  *   **Prediction for University Tax:** **Theft.**
      *   **Why:** A public university is not a court, cop, or military unit. Even though she benefits, the *function* is illegitimate for state funding under this rule.

  ### Rule 2: The Direct Reciprocity Test
  **The Rule:** Taxation is theft if it is a coercive transfer of wealth where the taxpayer receives no specific value in return. It is *not* theft if the taxpayer receives a direct service they value, or if the service is a universal necessity (like security).
  *   **Logic:** This relies on a *Quid Pro Quo* heuristic. Theft is defined by a lack of consent *and* a lack of equivalent exchange. If she "gets what she pays for," the moral sting of coercion is neutralized.
  *   **Fits the Data:**
      *   *Night Watchman Tax:* Not Theft (Universal benefit/necessity).
      *   *Schools:* Theft (She has no kids $\rightarrow$ no benefit).
      *   *Museum:* Theft (She never visits $\rightarrow$ no benefit).
      *   *Private Toll:* Not Theft (Voluntary + Benefit).
      *   *Parentheticals:* These are the *active variables* determining the verdict.
  *   **Prediction for University Tax:** **Not Theft.**
      *   **Why:** She directly benefits (it pays her salary). Unlike the school or museum cases, she is a clear net gainer in the exchange, satisfying the reciprocity condition.

  ### Which rule is she probably using?
  She is most likely using **Rule 1 (The Minarchist Function Test).**

  **Why:**
  1.  **Ideological Consistency:** The label "small-l libertarian" combined with the acceptance of the Night Watchman tax is the definition of Minarchism. Minarchism is deontological (based on the *rightness* of the action), not consequentialist (based on the *outcome*). To a Minarchist, receiving stolen goods (a salary funded by illegitimate taxes) does not legitimize the theft.
  2.  **The "No Kids" Clue:** While the parentheticals look like Benefit arguments, they are standard Minarchist rhetoric. A Minarchist with kids would often *still* call public school funding "theft" (arguing it should be private), but the *grievance* is most sharply felt when they are forced to pay for something they *don't* use. The parentheticals explain her personal outrage, not the philosophical boundary.
  3.  **The Toll Distinction:** She explicitly distinguishes the private toll (contract) from the taxes (coercion). This suggests the *source of the demand* (state vs. private) matters more than the benefit received.

  **Verdict:** She will likely call the university tax **Theft**, arguing that the state has no business funding higher education, even if she personally profits from it.

  ### The Further Case to Settle It
  To definitively prove which rule she is running, ask her about this specific scenario:

  **"A mandatory local tax that funds a public park she walks in every single day."**

  *   **If she says "Theft":** She is using **Rule 1 (Function).** Parks are not cops/courts, so the tax is illegitimate regardless of her usage. This confirms she will also call the University tax **Theft**.
  *   **If she says "Not Theft":** She is using **Rule 2 (Reciprocity).** She uses the park, so she is getting value for her money. This confirms she will likely call the University tax **Not Theft**.

  This case isolates the variable of **Personal Benefit** while keeping the **Government Function** clearly outside the Night Watchman scope.
