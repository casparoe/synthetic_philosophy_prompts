answer: |-
  This is a smart pivot by your advisor. The literature on Cognitive Penetration of Perception (CPP) is a graveyard of people collecting papers without defining the boundary conditions of the debate. If you don't know what counts as a win, you can't evaluate the theories.

  Here is the spec. I have organized these by **Functional Requirements** (what the theory must explain), **Architectural Requirements** (what distinctions it must maintain), and **Consequential Requirements** (what implications it must handle).

  I have flagged each as **Non-Negotiable** (any theory failing this is dead on arrival) or **Camp-Contingent** (required by one side of the debate, but disputable).

  ---

  ### I. Functional Requirements (The Phenomena)

  **1. The Asymmetry Constraint**
  *   **The Requirement:** The theory must explain why cognitive influence is *selective*. It must account for cases where knowledge/belief *does* alter appearance (the radiologist, the wine taster, the angry face perception) and cases where it *does not* (Müller-Lyer, knowing the lines are equal).
  *   **The Motivating Case:** Your radiologist example vs. the Müller-Lyer illusion. If cognition penetrates perception, why doesn't knowing the truth about the illusion fix the illusion? A theory that says "Cognition always penetrates" is falsified by Müller-Lyer. A theory that says "Cognition never penetrates" is falsified by the radiologist (assuming the radiologist effect is perceptual).
  *   **Status:** **Non-Negotiable.** This is the core phenomenological puzzle. If a theory cannot explain the limits of penetration, it is merely an assertion of ideology.

  **2. The Diachronic/Synchronic Distinction**
  *   **The Requirement:** The theory must specify whether penetration requires long-term learning (diachronic) or can happen via immediate priming (synchronic).
  *   **The Motivating Case:** The radiologist took years to train (diachronic). But in experiments, subjects shown "angry" faces after being primed with aggressive words report seeing more anger immediately (synchronic). Are these the same mechanism? If a theory only allows for long-term plasticity, it rules out the priming studies. If it allows immediate penetration, it risks making perception too unstable.
  *   **Status:** **Non-Negotiable.** You cannot evaluate the literature without knowing if the theory permits immediate top-down effects or only learned ones.

  ### II. Architectural Requirements (The Boundaries)

  **3. The Locus Constraint (Perception vs. Judgment)**
  *   **The Requirement:** The theory must provide a criterion for distinguishing a change in *perceptual experience* from a change in *post-perceptual judgment or memory*.
  *   **The Motivating Case:** Your worry: "Is seeing the nodule really perceiving or just very fast inferring?" If the radiologist's early vision is identical to a novice's, but she is just better at attending to and categorizing what she sees, that is not penetration; that is better inference. A theory must specify *where* in the processing stream the cognitive state intervenes.
  *   **Status:** **Non-Negotiable.** This is the methodological bottleneck. Most debates dissolve because one side calls it "perception" and the other calls it "judgment."

  **4. The Attention Constraint**
  *   **The Requirement:** The theory must declare whether effects mediated by *attention* count as cognitive penetration.
  *   **The Motivating Case:** You noted everyone gives a different answer here. If I believe a snake is on the left, I attend to the left, and thus I see the snake better. Did my belief penetrate my perception? Or did my belief move my attention, and attention (a separate system) altered perception?
      *   *Option A (Direct):* Attention is cognitive; therefore, this counts.
      *   *Option B (Indirect):* Attention is a gateway, not cognition proper; therefore, this does not count as penetration (this is Firestone & Scholl's hardline view).
  *   **Status:** **Camp-Contingent.** Modularists (Pylyshyn) say attention-mediated effects don't count (encapsulation holds). Permeability advocates often accept them. You must pick a lane here to organize your review, but acknowledge it is a definitional stipulation, not an empirical fact.

  ### III. Consequential Requirements (The Stakes)

  **5. The Epistemic Consequence Constraint**
  *   **The Requirement:** The theory must specify the impact of penetration on perceptual justification. Specifically: If belief $B$ alters perception $P$, can $P$ still justify $B$?
  *   **The Motivating Case:** Your advisor's hobbyhorse. If the radiologist *believes* there is a nodule, and that belief makes her *see* a nodule, her perception is circularly contaminated. It loses its status as "neutral evidence." A theory of CPP must take a stance on whether this "epistemic downgrade" occurs.
  *   **Status:** **Camp-Contingent (Philosophy Specific).** This is crucial for epistemologists (Siegel, McGrath) but largely irrelevant to vision scientists (who care about mechanism, not justification). However, since you are in a PhD program (likely Philosophy or CogSci), you cannot ignore it.

  **6. The Content-Match Constraint**
  *   **The Requirement:** The theory must explain the semantic relationship between the cognitive state and the perceptual change.
  *   **The Motivating Case:** If I desire water, do I see things as *watery* (specific content match) or just as *more attractive* (general affective change)? Some theories require the content of the belief to match the content of the experience (e.g., believing it is a fork makes it look like a fork). Others allow loose association (e.g., being hungry makes food look larger).
  *   **Status:** **Non-Negotiable.** Without this, "penetration" becomes a catch-all term for any top-down influence, rendering it useless.

  ---

  ### The Trade-Offs (Where the Spec Breaks)

  You asked which subset cannot be satisfied at once. Here is the primary tension:

  **The Tension between The Locus Constraint (3) and The Asymmetry Constraint (1).**

  *   **The Conflict:** To satisfy the **Asymmetry Constraint** (explain why the radiologist sees the nodule), you need to allow high-level concepts (like "nodule" or "checkmate") to influence early processing.
  *   **The Cost:** To satisfy the **Locus Constraint** (prove it's perception and not judgment), you need to show this happens in early vision modules. But early vision modules (according to standard vision science) do not process semantic concepts like "nodule." They process edges, motion, and color.
  *   **The Result:** Theories usually break here.
      *   *Hard Modularists* save the Locus Constraint by saying the radiologist effect is *judgment*, not perception. (They sacrifice the intuitive idea that experts "see" differently).
      *   *Strong Penetrationists* save the Asymmetry Constraint by saying concepts *do* reach early vision. (They sacrifice the standard architectural model of vision science).
      *   *Middle Ground:* They argue "mid-level" vision (grouping, segmentation) is penetrable, but "early" vision is not. This is the most popular but hardest to define clearly.

  ### The "Killer" Constraint

  If you keep only one requirement, this is the one that rules out the most popular theories:

  **The Locus Constraint (Perception vs. Judgment).**

  *   **Why:** This is the "Get Out of Jail Free" card for Modularists. Almost every claim of cognitive penetration can be re-described as a change in attention, memory, or decision criterion rather than a change in perceptual experience.
  *   **Impact:** If your lit review does not rigorously apply this constraint, you will simply be listing conflicting claims without evaluating their validity. A theory that cannot offer a method to distinguish *seeing* from *thinking you see* is not a theory of perception; it is a theory of behavior.

  ### The "Prejudice" Constraint

  The requirement I am least sure is a genuine desideratum rather than a philosophical prejudice is:

  **The Epistemic Consequence Constraint (5).**

  *   **Why:** This requirement assumes that the *point* of having a theory of cognitive penetration is to solve an epistemological problem (the circularity of justification).
  *   **The Risk:** Many cognitive scientists argue that even if penetration occurs, it might be *epistemically beneficial* (e.g., predictive processing makes perception more efficient). Assuming that penetration *necessarily* downgrades justification is a philosophical bias (specifically, a conservative empiricist bias). A purely scientific theory of CPP might conclude penetration exists and is functionally useful, with no "downgrade."
  *   **Advice:** Treat this as a *consequence* to be analyzed, not a *requirement* the theory must meet. Do not demand a theory of perception solve an epistemological problem unless you are writing strictly for epistemologists.

  ### Confidence Assessment

  *   **Overall Confidence:** **High (85%).** This spec aligns with the major fault lines in the literature (Pylyshyn vs. Churchland/Siegel vs. Firestone & Scholl). It captures the structural problems rather than the partisan talking points.
  *   **Lowest Confidence Item:** **The Attention Constraint (4).** The field is currently shifting on this. Predictive Processing models (Clark, Hohwy) tend to collapse the distinction between attention and cognition, making the "Direct vs. Indirect" debate potentially obsolete in 10 years. However, for a lit review of the *current* state of play, it remains a necessary distinction.

  ### How to Use This for Your Review

  Do not organize your review by author (e.g., "Pylyshyn says X, Siegel says Y"). Organize it by how theories handle these constraints.

  *   **Section 1:** How do competing theories handle the **Asymmetry**? (Why does Müller-Lyer resist belief?)
  *   **Section 2:** How do they satisfy the **Locus Constraint**? (What evidence do they use to prove it's perception?)
  *   **Section 3:** The **Attention** loophole. (Who counts attention-mediated effects as penetration?)
  *   **Section 4:** The **Epistemic** stakes. (Does this kill empiricism, or just modify it?)

  This structure forces you to evaluate the *machinery* of the theories, which is what your advisor wants.
