prompt: |-
  I'm a first-year PhD student and I'm supposed to be writing a lit review on cognitive penetration of perception, but my advisor told me to stop hoarding papers and first write down what a theory in this area would actually have to do. So thats the thing I want from you: the desiderata, not the theories (I'll read those myself). Give me the spec — the phenomena a theory of cognitive penetration has to explain, the cases it has to get right, the distinctions it can't just collapse, the results out of perception science it can't contradict — and put the case or consideration behind each requirement, so I can tell which ones are doing real work and which are just something one camp happens to want. Fix the purpose for me at "good enough to organize a lit review around," since I know adequacy is relative to that.

  The stuff I keep bumping into and can't square: a radiologist who's looked at ten thousand chest films seems to just *see* the nodule, and a chess player just sees that the knight forks the king and rook, no stepwise inference I can point to — but when I look at a Müller-Lyer figure knowing full well the lines are the same length, they still dont look the same length, and the knowing does nothing. So sometimes what I know shapes what I see and sometimes it plainly doesn't, and I can't tell if that's two phenomena or one with a switch. There's also whether "seeing the nodule" is really perceiving or just very fast inferring, and whether attention counts as cognition (everyone I ask gives me a different answer), and whether it even matters for epistemology that perception gets pushed around by belief — my advisor insists the interesting thing is what it does to perception's role as neutral evidence, but I'm not convinced that's a requirement on the theory or just her hobbyhorse.

  So: the requirements list, with the motivating case behind each, which are non-negotiable and which are one camp's preference, and which single requirement — if you had to keep only one — does the most to rule out the popular theories. If some subset of them can't all be satisfied at once, say which and why; thats the part I care about most. And tell me how confident you are in the list overall, plus the one requirement you're least sure is a genuine desideratum rather than a prejudice of a particular camp.
