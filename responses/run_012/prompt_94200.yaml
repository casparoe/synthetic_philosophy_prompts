      *   *Desideratum 3: The Mechanism Problem (Direct vs. Indirect).* If attention shifts based on belief, and perception changes, is that penetration? Or is attention a separate gateway? Firestone & Scholl say attention effects aren't penetration.
      *   *Desideratum 4: The Epistemic Consequence.* If belief changes perception, can perception justify belief? (Siegel's point). Is this a *requirement* for the theory of mind, or a consequence? The user's advisor thinks it's central. I need to flag this as potentially camp-specific (Epistemologists care, Vision Scientists less so).
