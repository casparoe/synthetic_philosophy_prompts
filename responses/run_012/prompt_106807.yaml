      *   Retributivism says: You cannot punish *more* than the blameworthiness warrants.
      *   Consequentialism says: You *should* punish *more* if it stops future crime.
      *   *Scenario:* An offender who is highly dangerous but has low culpability.
      *   *Specific Case:* **The Epileptic Driver.**
      *   *Facts:* Defendant drove knowing there was a *small* risk of a seizure (against doctor's advice), had a seizure, crashed, killed someone.
      *   *Retributive View:* It wasn't intentional. It was recklessness/negligence. The mental state at the time of impact was non-existent. Culpability is low compared to murder or even standard vehicular homicide. Desert ceiling is low.
