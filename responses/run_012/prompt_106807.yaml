answer: |-
  **The Case**
  Mateo, 19, was arrested at the border with five kilograms of heroin strapped to his legs. He is charged with trafficking, carrying a statutory minimum of ten years. Evidence shows Mateo was groomed by a cartel since age 16; agents confirmed threats were made against his siblings in his home country, though the threats were not immediate enough to satisfy the legal standard for duress. He is genuinely guilty: he chose to carry the package to protect his family, understanding the law but feeling he had no viable alternative. The prosecution seeks the maximum; the defense pleads for probation.

  **The Analysis**

  **The Verdicts**
  *   **The Retributivist:** Argues for a sentence of **two years** (or the minimum allowable via mitigation).
      *   **Why:** Retributive justice ties punishment strictly to *moral culpability*. While Mateo committed the act, his agency was severely compromised by coercion and grooming. He is partially a victim. To punish him beyond the measure of his *own* wickedness—rather than the harm caused—is to use him as a mere means. The "desert ceiling" is low because his blameworthiness is low, regardless of the drug quantity.
  *   **The Consequentialist:** Argues for a sentence of **fifteen years**.
      *   **Why:** Consequentialism looks to future harm reduction. First, *incapacitation*: Mateo is embedded in a network that has already demonstrated it can coerce him; releasing him returns a vulnerable asset to the cartel. Second, *deterrence*: Cartels treat mules as expendable costs. Only a severe penalty raises the cost of recruitment enough to disrupt the supply chain. The social utility of stopping the heroin flow outweighs the cost to Mateo's liberty.

  **The Key Feature**
  The single feature doing the work is **compromised agency due to external coercion**.
  *   For the **Retributivist**, this feature *reduces* the sentence. It lowers the moral blame, lowering the ceiling of just punishment.
  *   For the **Consequentialist**, this feature *increases* (or sustains) the sentence. It signals high risk of recidivism (he is easily coerced) and highlights the need to deter predators who target vulnerable people.

  **The Counterfactual**
  If you strip out the coercion (Mateo was a willing, unthreatened profit-seeker):
  *   The **Retributivist's** sentence rises sharply to match the standard trafficking penalty, as full culpability is restored.
  *   The **Consequentialist's** sentence remains high (perhaps even higher, as rehabilitation is now less likely than pure incapacitation), but the *gap* between the two theories closes. The tension exists specifically because the coercion pulls the theories in opposite directions.

  **The Consequentialist Attack**
  A consequentialist would attack the Retributivist's ceiling by arguing that **culpability is a moral fiction with no predictive power.** They would claim: "You are prioritizing Mateo's 'moral ledger' over fifty potential overdose deaths. If the function of sentencing is public safety, then 'desert' is irrelevant. We are not punishing Mateo for his past soul; we are managing the risk of his future environment."

  **Does the Attack Land?**
  It lands **pragmatically, but not theoretically.** It successfully highlights the human cost of the Retributivist's constraint (real people may die because Mateo went free). However, it fails to refute the Retributivist's core axiom: that justice forbids using a person as a tool for social engineering, regardless of the utility gained. The attack concedes the moral disagreement rather than resolving it; it admits that to achieve safety, one must violate the Retributivist's constraint on individual rights.
