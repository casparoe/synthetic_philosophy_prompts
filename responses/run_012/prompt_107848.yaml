prompt: |-
  Ok so I've been down a rabbit hole on the Knobe effect — the one where people say a boss harmed the environment on purpose when that was just a foreseen side effect of a decision he took, but won't say he helped the environment on purpose when the side effect fell the other way. Weird, fine. What I can't get straight is why it happens.

  Two stories. One says it's the moral badness doing the work: a bad outcome gets read as meant, a good one doesn't. The other — a mate of mine swears by this — says morality's a red herring, and the real driver is that bad side effects just tend to be unusual, so people are reading intentionality off how abnormal the outcome is rather than off whether it's good or bad. Those make different predictions and I want to actually seperate them.

  So build me a vignette that pulls them apart: a case where the side effect is clearly bad but utterly normal and expected, or clearly good but genuinely odd and surprising — ideally both, crossed cleanly. Keep it short and everyday (someone at work, or in a hospital — no trolleys, no cartoonish CEO), and make sure the two variables, how bad the outcome is and how statistically weird it is, aren't secretly tangled together. If they are, say so and fix it.

  Then tell me what each story predicts for your case and which one comes off worse. If it doesn't really disambiguate them, be honest about the confound and tell me what to change. And the bit I'm definately stuck on: if the moral story wins, is the effect even about intentionality, or is it about blame and character — do we just blame the person and then describe them as having meant it? And does the abnormality story even hold up, given that what counts as normal often depends on what's good? Finish by saying what would have to change for the two explanations to be cleanly testable apart, and how someone who backs the losing story would try to wriggle out of your case.
