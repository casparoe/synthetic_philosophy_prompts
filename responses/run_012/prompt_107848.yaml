answer: |-
  Here is a vignette designed to pull moral valence and statistical normality apart, followed by the breakdown you asked for.

  ### The Vignette: "The SteadyHand Protocol"

  **Context:** Dr. Aris is a specialist treating patients with severe migraines. She has a standard drug, *MigraFix*, which reliably cures the pain.

  **Condition A (Bad Outcome + Statistically Normal)**
  > Dr. Aris prescribes *MigraFix* to a patient who is a surgeon. The drug cures the migraine. However, in **85% of cases**, the drug causes a **mild hand tremor** for 24 hours. Dr. Aris knows this will make the surgeon unable to operate tomorrow. She says, "I don't care about the tremor, I just want to cure the migraine." The patient takes it, gets the tremor, and cannot operate.

  **Condition B (Good Outcome + Statistically Abnormal)**
  > Dr. Aris prescribes *MigraFix* to a patient who is a pianist. The drug cures the migraine. However, in **2% of cases**, the drug causes **temporary perfect pitch** for 24 hours. Dr. Aris knows this will allow the pianist to perform flawlessly. She says, "I don't care about the pitch, I just want to cure the migraine." The patient takes it, gets perfect pitch, and performs flawlessly.

  ***

  ### The Predictions

  Here is how the two theories map onto the intentionality question ("Did Dr. Aris cause the side effect *on purpose*?"):

  | Condition | Outcome | Frequency | **Moral Valence Theory** | **Statistical Abnormality Theory** |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** | Tremor (Bad) | High (Normal) | **Intentional** (Because it's bad) | **Unintentional** (Because it's common) |
  | **B** | Pitch (Good) | Low (Abnormal) | **Unintentional** (Because it's good) | **Intentional** (Because it's rare) |

  ### Which Story Comes Off Worse?

  If you run this study, the **Statistical Abnormality Theory comes off worse.**

  Empirical data from variations of this exact design (e.g., studies by Knobe, Pettit, and later Guglielmo & Malle) generally show that people *still* attribute intentionality to the Bad/Normal case (Condition A) significantly more than the Good/Abnormal case (Condition B).

  Even when a harmful side effect is explicitly stated as "standard procedure" or "happens almost every time," people's intuition that the agent "did it on purpose" remains robust. Conversely, even when a helpful side effect is a rare fluke, people rarely say the agent "did it on purpose."

  This suggests that statistical frequency alone cannot explain the effect. If it were just about weirdness, the rare perfect pitch should look intentional. It doesn't. The moral badness of the tremor seems to override its statistical normality.

  ### The Deeper Stickiness: Blame vs. Intentionality

  You asked: *If the moral story wins, is the effect even about intentionality, or is it about blame and character?*

  This is the **"Blame-First" Hypothesis** (championed by psychologists like Mark Alicke). The argument is that we don't actually assess the mental state (intention) first. Instead:
  1.  We see a bad outcome.
  2.  We feel a quick, hot urge to blame the agent.
  3.  To justify that blame, we unconsciously adjust our definition of "intentional" to fit the blame.

  If this is true, the Knobe Effect isn't a discovery about how we understand *minds*; it's a discovery about how we litigate *responsibility*. We aren't saying "He meant to do it, therefore he is bad." We are saying "He is bad (because of the outcome), therefore he must have meant to do it."

  ### The Confound: Does "Normal" Depend on "Good"?

  You also asked: *Does the abnormality story even hold up, given that what counts as normal often depends on what's good?*

  This is the killer objection to your mate's theory. It's called the **Normative Confound**.

  In human cognition, "Statistical Norms" (what *does* happen) and "Prescriptive Norms" (what *should* happen) are tangled.
  *   We expect doctors to help (Prescriptive).
  *   We expect drugs to cure, not harm (Prescriptive).
  *   Therefore, harm feels "Abnormal" even if it happens 85% of the time statistically.

  Your mate might argue: "The tremor isn't *really* normal. It violates the norm of what a doctor should do." If they define "Abnormality" as "Violation of Expectations" (which includes moral expectations), their theory becomes unfalsifiable. It collapses into the Moral Theory. To hold their ground, they must stick strictly to *mathematical frequency*, and as shown above, that version of the theory fails.

  ### How to Cleanly Test Them Apart

  To truly separate these, you need a case where **Statistical Norms** and **Prescriptive Norms** point in opposite directions, independent of Morality.

  **The Fix:** Use a morally neutral outcome.
  *   *Scenario:* A factory machine makes widgets.
  *   *Condition 1:* It usually makes square widgets (95%). Today it made a **round** one (5%). (Abnormal, Neutral).
  *   *Condition 2:* It usually makes round widgets (95%). Today it made a **square** one (5%). (Normal, Neutral).
  *   *Condition 3:* It usually makes widgets that **pollute** (95%). (Normal, Bad).
  *   *Condition 4:* It usually makes widgets that **clean air** (5%). (Abnormal, Good).

  If intentionality tracks *only* the frequency (Round vs. Square), it's a statistical effect. If it tracks *only* the morality (Pollute vs. Clean), it's a moral effect. Current literature suggests morality dominates, but the cleanest test requires removing the "should/shouldn't" expectation entirely, which is incredibly hard in human subjects.

  ### How Your Mate Will Wriggle Out

  If you show your mate the data that the Bad/Normal tremor is still judged "Intentional," they will likely pivot to **The Reason Explanation**.

  They will say: *"People aren't judging based on frequency or raw morality. They are judging based on whether the side effect provides a **reason** for the action."*

  *   In the Harm case, the harm is a *reason against* acting. If the agent acts anyway, the side effect seems more relevant/integrated into the plan.
  *   In the Help case, the help is a *reason for* acting. But since the agent claimed they didn't care, the help seems incidental.

  This moves the goalposts from "Statistical Abnormality" to "Counterfactual Reasoning." It saves the cognitive account but concedes that raw statistics don't drive the effect. It's a sophisticated retreat, but it admits that the original "bad things are just rarer" claim was insufficient.
