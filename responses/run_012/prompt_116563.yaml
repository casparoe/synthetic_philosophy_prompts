answer: |-
  The dispute, restated
  The group debated whether a singular, non-repeatable policy change caused a rise in unemployment, despite the policy being impossible to vary or replicate. One member halted the debate by asserting that causation requires manipulation, implying the causal question was meaningless or confused. The core tension lies in whether causal claims about fixed historical events are legitimate when no agent can intervene on the putative cause.

  The menu
  1. *Manipulation is necessary for secure causal identification.* This reading treats the claim as a methodological constraint on inquiry, suggesting that without the ability to intervene, we lack the evidence required to distinguish causal connections from mere correlations. It positions manipulation as the sole reliable route to causal knowledge rather than a condition on the world itself.

  2. *The content of a causal statement is exhausted by claims about what would occur under manipulation.* This reading treats the claim as a definition of meaning, asserting that to say "A caused B" is simply to say "manipulating A would change B." It implies that if manipulation conditions cannot be specified, the causal statement lacks cognitive content.

  3. *A causal relation obtains in reality only if the relata are manipulable by agents.* This reading treats the claim as an ontological condition, asserting that causation itself depends on the possibility of agency. It implies that in regions of the universe or historical epochs where manipulation is impossible, there is no causation.

  Verdicts
  1. **Substantive and defensible.** While observational inference is possible, manipulation remains the gold standard for identification, though this supports skepticism about our *knowledge* rather than dismissing the causal question itself. This reading does not license the dismissal.

  2. **False.** We understand causal claims about non-manipulables (e.g., asteroids causing extinctions), so this relies on an untenable theory of meaning. This reading licenses the dismissal of the statement as meaningless.

  3. **False.** Causation is generally viewed as mind-independent, so this relies on an untenable anthropocentric metaphysics. This reading licenses the dismissal of the causal fact as false.

  Counterfactual versus interventionist
  Counterfactual accounts (like Lewis's) ground causation in similarity between possible worlds, requiring no reference to agents or manipulation. Interventionist accounts (like Woodward's) define causation via invariance under interventions, but crucially allow *hypothetical* interventions rather than requiring actual manipulability. The group mate's claim is therefore a distortion of interventionism, conflating the conceptual requirement of an intervention variable with the practical ability to perform one.

  What I should have said
  You should distinguish between actual experimental control and the conceptual possibility of variation. Interventionism requires that the cause be conceptually distinct and variable, not that we can actually rerun history or dial the policy up and down today.
