answer: |-
  Dear friend, you have asked for the shape of the problem before you look at the proposed solutions, and that is a wise place to stand. You want a specification of the requirements any adequate theory of consent must meet, built around the cases that keep you awake at night. I will lay these out for you in the order they naturally arise from the situations you described, weaving the cases into the requirements themselves, and then I will turn to the harder task of telling you which of these demands are absolute, which are matters of theoretical preference, and where the contradictions lie that might force you to choose between competing intuitions.

  The first requirement arises directly from your mechanic and your salesman. Any account must specify the information condition, meaning it must determine exactly how much ignorance invalidates an agreement. The mechanic case puts this on the list because you need to know if silence is as destructive to consent as a lie, while the salesman case adds the nuance of materiality, forcing the theory to decide if deception about something you do not care about, or something that would not have changed your mind, still voids the agreement. A theory cannot simply say deception is bad; it must specify whether the duty is to tell the truth, to tell the whole truth, or only to answer questions honestly, and it must define whether the defect in consent lies in the falsehood itself or in the causal link between that falsehood and your decision.

  The second requirement comes from your landlord and the distinction between a threat and a hard bargain. Any account must define the baseline of voluntariness, which means it must specify what you were entitled to before the offer was made. The landlord case puts this on the list because your feeling of coercion seems to depend entirely on whether the money was a gift you had no right to expect or compensation for a right you already possessed. A theory must therefore either include a prior theory of property and rights to establish this baseline, or it must explain how coercion can be identified without reference to entitlements, distinguishing clearly between being forced by circumstances and being forced by another person.

  The third requirement is drawn from the hospital form and the relative with dementia. Any account must fix the temporal locus of capacity, meaning it must state precisely when the ability to consent is judged and whether later changes matter. The hospital case puts this on the list because you need to know if pain or sedation at the moment of signing invalidates the act, while the dementia case forces the theory to decide if a lucid moment is sufficient even if the person later forgets it entirely. This requirement demands that the theory distinguish between the capacity to understand at the time of agreement and the continuity of memory afterwards, ruling out any account that makes consent dependent on future recollection or permanent rationality.

  The fourth requirement emerges from the student surgeon and the scope of your agreement. Any account must handle the granularity of authorization, meaning it must explain how general consent relates to specific acts. The student surgeon case puts this on the list because you agreed to a procedure but not necessarily to who performs it, forcing the theory to decide if consent is a single blanket permission or a bundle of specific permissions that can be severed. This means the account cannot treat consent as purely binary; it must allow for the possibility that you consented to the surgery but not to the training aspect, requiring a mechanism to map the scope of the permission against the reality of the act.

  The fifth requirement is foundational and comes from your general worry about compliance versus consent. Any account must distinguish internal authorization from external submission, meaning it must explain the difference between actually agreeing and merely going along with things. This consideration puts it on the list because without this distinction, power is indistinguishable from authority, and a gun to the head looks the same as a signed contract. The theory must therefore preserve the idea that consent is something you give, not just something you do, ensuring that mere compliance under pressure does not count as valid consent unless the pressure itself is legitimate.

  The sixth requirement is pragmatic and comes from the reality of hospitals, employers, and courts. Any account must satisfy the condition of epistemic access, meaning it must be possible for third parties to verify consent without reading minds. The hospital case puts this on the list again here because doctors cannot pause to analyze your soul before operating; they need a reliable signal. This forces the theory to accommodate the fact that institutions must act on visible evidence like signatures or verbal assent, even if those signals occasionally mismatch your internal state, requiring a balance between what consent really is and how we know it is present.

  The seventh requirement comes from the plain fact that people often agree to what harms them. Any account must respect the anti-paternalist constraint, meaning it cannot invalidate consent simply because the outcome is bad for the consenter. This consideration puts it on the list because if a theory says you cannot validly consent to risky or harmful things, it turns consent into a tool for protecting you from yourself rather than a tool for authorizing others. The theory must therefore allow for the possibility of foolish but valid agreements, distinguishing between harm that negates consent and harm that is simply the result of a choice you were free to make.

  Now that we have the list before us, we must ask which of these are non-negotiable and which are merely the preference of one way of thinking over another. The anti-paternalist constraint is non-negotiable if consent is to mean anything distinct from protection; if you cannot consent to harm, you do not have authority over your own life, only over your comfortable choices. Similarly, the distinction between consent and compliance is non-negotiable, because collapsing them eliminates the moral power of consent entirely. The information condition, however, is partly a matter of preference; some theories will say silence is always fraud, others will say caveat emptor, and both can be coherent depending on what you value in markets versus relationships. The temporal locus is also partly negotiable; you can build a theory where memory matters or one where only the moment of choice matters, provided you are consistent. The baseline for voluntariness is the hardest to classify; it is non-negotiable that there must be a baseline, but what that baseline is depends on your broader political views, making it a variable input rather than a fixed requirement of consent itself.

  You suspected that demanding consent be a fact about a person's inner state and demanding that it be checkable from the outside would turn out to be in tension, and you are right to flag this pair as the central conflict. This is the tension between the psychological reality of consent and the social function of consent. If you insist that consent is purely a mental state, you satisfy the distinction between consent and compliance, but you fail the requirement of epistemic access, because no hospital can verify a mental state. If you insist that consent is purely a public signal, you satisfy the hospitals and courts, but you fail the distinction between consent and compliance, because a person could be forced to give the signal without actually agreeing. You cannot fully satisfy both without remainder. To give up the inner state requirement costs you the moral heart of consent, turning it into a mere ritual; to give up the checkability requirement costs you the social utility of consent, making it impossible to rely on in practice. Most theories try to bridge this by saying consent is a mental state that must be expressed, but this still leaves you with the problem of what happens when the expression and the state diverge, forcing you to choose which one trumps the other in hard cases.

  Finally, you asked which single requirement, if taken seriously, would rule out the most otherwise plausible accounts. It is the requirement of epistemic access, the demand that consent be checkable from the outside. This is the killer constraint because the most intuitive and philosophically pure account of consent is that it is a transformation of moral relationships grounded in what you truly will or intend. If you take seriously the demand that a doctor or a judge must be able to verify this without reading minds, you are forced to abandon the pure mental state account. You must adopt a convention-based view where signing the form is what matters, even if you didn't mean it, or you must adopt a complex hybrid view that is vulnerable to contradiction. This requirement rules out all purely subjective theories, which are otherwise very plausible because they align with our deep intuition that only you know what you agreed to. By insisting on checkability, you force the theory to become objective, and in doing so, you sacrifice the very thing that makes consent feel like consent rather than just compliance. This is the cost you suspected, and it is the price of making consent work in the real world of institutions and strangers.
