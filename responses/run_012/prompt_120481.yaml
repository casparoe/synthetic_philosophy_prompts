answer: |-
  ### Meera's Epistemic Hierarchy (Ranked by Trust in Conflict)

  **1. Pratyakṣa (Perception)**
  **Score:** 1.0
  **Why:** The foundation of Nyāya realism; if you see it directly, no other source can override it without proving your senses were impaired.

  **2. Anumāna (Inference)**
  **Score:** 0.90
  **Why:** Logic grounded in perception is nearly as solid as sight itself, provided the logical chain (vyāpti) is unbroken.
  **⚠️ Contest Flag:** In metaphysical matters, some traditions swap this with *Śabda*, but for Meera's empirical world, logic beats hearsay.

  **3. Śabda (Testimony)**
  **Score:** 0.75
  **Why:** Reliable authority is essential for things beyond senses, but human witnesses (even Grandfather) can lie or err.
  **⚠️ Contest Flag:** If the testimony is Vedic/Infallible, this jumps to 0.95; if human, it drops here. Meera treats most as human.

  **4. Anupalabdhi (Non-apprehension)**
  **Score:** 0.65
  **Why:** Knowing something is absent because you don't perceive it is valid, but relies entirely on the conditions for *Pratyakṣa* being perfect.

  **5. Upamāna (Comparison)**
  **Score:** 0.50
  **Why:** Analogy clarifies meaning but proves nothing; it bridges gaps rather than establishing new facts.

  **6. Arthāpatti (Postulation)**
  **Score:** 0.35
  **Why:** The "Hail Mary" of epistemology; you only use this when all else fails to explain an anomaly (e.g., the stout non-eater).
  **⚠️ Contest Flag:** Mīmāṃsā ranks this much higher; Nyāya often reduces it to *Anumāna*. Meera treats it as speculative.

  ***

  ### The Photographer's Claim: "The Camera"
  **Status:** **Not a separate *pramāṇa*.** (Slot it at **0.85 Reliability**, but **0.0 Ontological Status**)
  **Why:** It is **Perception (*Pratyakṣa*)** frozen by a mechanical instrument, backed by **Testimony (*Śabda*)** regarding the lens's calibration.
  **Meera's Rebuttal:** A *pramāṇa* requires a *knower* (cognition); a camera is merely an instrument (*karaṇa*). It eliminates human memory error, but it cannot distinguish truth from illusion (a photo of a mirage is still a photo of a mirage). It is "blind perception" without the cognitive processing required for knowledge (*pramā*).

  ### Notes for the Scene
  *   **The Gap:** Notice the drop from **Inference (0.90)** to **Testimony (0.75)**. This is where Meera argues with the Photographer. He trusts the image (Testimony of the machine/Perception of the lens) over her logic. She trusts her logic over the image because the image lacks *judgment*.
  *   **The Coin Flip:** If Meera sees a pot (*Pratyakṣa*) but her Grandfather says there is no pot (*Śabda*), she must believe her eyes (1.0 > 0.75). If she *doesn't* see a pot (*Anupalabdhi*) but Grandfather says there is one (*Śabda*), she must check the lighting/conditions before accepting his word.
  *   **The Syncretist Angle:** She keeps *Arthāpatti* (0.35) low because it requires imagination. In a mystery/plot context, she should only use this as a last resort, which makes it a great tool for a climax reveal when she finally has to "postulate" the truth because the evidence is missing.
