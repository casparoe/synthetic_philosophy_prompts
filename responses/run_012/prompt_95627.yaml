      *   *The Impossibility:* You cannot simultaneously maximize *epistemic optimization* (always believe the truth) and *autonomous endorsement* (believe only what you verify).
      *   *The Impossibility:* You cannot treat assent as authoritative if the asymmetry makes the assent causally determined by the system's optimization.

  7.  **Identifying the Eliminative Requirement & Hidden Stances:**

