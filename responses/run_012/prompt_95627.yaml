  3.  **Drafting the Hard Cases:**

      *   *Case 1: Epistemic Asymmetry.* Human can't verify the argument.
          *   *Requirement:* Account must distinguish between *trust-based belief* and *reason-based belief*. It must allow for justified belief without full comprehension, but not blind faith.
      *   *Case 2: Automatic Assent.* Argument is so good it bypasses judgment.
          *   *Requirement:* Account must define a threshold where "compelling" becomes "coercive" cognitively. It needs a concept of *cognitive resistibility*.
      *   *Case 3: Withholding Arguments.* System knows an argument works but skips it to save agency.
          *   *Requirement:* Account must value *process* over *outcome* in some instances. It must validate paternalistic restraint for the sake of autonomy.
      *   *Case 4: Candor about Limitations.* Telling the human "You can't understand this."
