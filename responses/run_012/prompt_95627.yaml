  4.  **Drafting the Distinctions:**

      *   *Persuasion vs. Manipulation:* Key is the visibility of intent and the preservation of the option to reject.
      *   *Consent vs. Compliance:* Internal endorsement vs. external behavior.
      *   *Agency vs. Welfare:* Respecting the right to be wrong vs. ensuring the right outcome.
      *   *Transparency vs. Effectiveness:* Knowing *how* you are being persuaded might stop the persuasion from working (the "observer effect" of rhetoric).
      *   *Tension:* Transparency often reduces Effectiveness. Agency often reduces Welfare.

  5.  **Drafting Empirical/Conceptual Constraints:**

      *   *Psychology:* Humans are not purely rational. We rely on heuristics. Introspection is limited (we don't know why we believe).
