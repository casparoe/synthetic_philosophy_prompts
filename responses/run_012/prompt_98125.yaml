answer: |-
  **NATIONAL BOARD OF AESTHETIC TESTIMONY (NBAT)**
  **FREQUENTLY ASKED QUESTIONS REGARDING LICENSING AND COMPLIANCE**

  **1. Why is a first-person report ("I found it moving") admissible while a third-person verdict ("It is moving") is rejected?**
  The Board distinguishes between descriptive psychological data and normative aesthetic claims. A licensee may testify to their own internal state without restriction, as this falls under Class B Empirical Reporting. However, asserting that an object *possesses* merit implies a universal claim that transcends the speaker's psychology. To license a verdict is to certify that the listener is justified in adopting the speaker's normative stance without undergoing the requisite perceptual engagement. Currently, the Board holds that normative justification is non-fungible. You may borrow a fact, but you cannot borrow a judgment. Applicants attempting to submit verdicts as facts will be issued a Warning of Normative Overreach.

  **2. How does the Board adjudicate disagreement between two licensed experts?**
  It does not. Unlike domains involving empirical measurement or historical record, aesthetic testimony lacks a convergence mechanism. If Licensee A certifies a work as *sublime* and Licensee B certifies the same work as *derivative*, both testimonies remain valid within their respective epistemic spheres. The Board refuses to act as an arbiter of taste, as doing so would presuppose an objective standard of beauty that the Board is not mandated to define. In cases of direct conflict, the borrower is advised to suspend judgment or, preferably, view the work themselves. The Board notes that reliance on testimony in cases of known expert disagreement constitutes epistemic negligence.

  **3. What happens when a borrower lacks firsthand acquaintance with the work?**
  This is a violation of the Acquaintance Principle, Section 4, Paragraph 2. Justification for aesthetic belief generally requires direct perceptual contact with the object of judgment. A borrower attempting to acquire justified belief solely through testimony, without viewing the work, is engaging in what the Board terms "Blind Reliance." While Blind Reliance is permissible in history or geography, it is prohibited in aesthetics. Licenses granted under these conditions are considered void. The Board acknowledges the inefficiency of this regulation but maintains that aesthetic properties are response-dependent; one cannot know the color red via description, and one cannot know the merit of a symphony via transcript.

  **4. What is a Non-Transferable Affective Warrant (NTAW)?**
  An NTAW is a bureaucratic classification for emotional responses that cannot be conveyed through language. When a testifier claims, "This work shattered me," the affective component of that justification is tagged as non-transferable. The borrower may acquire the belief *that* the testifier was shattered, but they cannot acquire the justification for believing the work *caused* the shattering. The NTAW ensures that citizens do not mistake the report of an emotion for the emotion itself. Possession of an NTAW allows a citizen to understand the causal history of a critic's judgment without inheriting the judgment's normative force. This category exists to prevent the commodification of sentiment.

  **5. Can I appeal a denial of testimonial justification?**
  Appeals are accepted only if the appellant can demonstrate that the work in question belongs to a category where aesthetic properties reduce to technical specifications (e.g., horology or structural engineering). Pure art appeals are dismissed.

  *Dr. Aris Thorne*
  *Director of Epistemic Compliance*
  *National Board of Aesthetic Testimony*
