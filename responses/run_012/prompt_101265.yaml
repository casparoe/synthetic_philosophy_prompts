answer: |-
  ### The Historical Inheritance of Derogatory Force

  **Thesis:** The derogatory force of a slur—specifically its capacity to subordinate, silence, and inflict social harm—is not carried by its semantic content nor by its conventional expressive coloring. Instead, this force is inherited from the norm-violating social history of the term. Consequently, two expressions with identical descriptive content and identical expressive coloring will differ in slurring power solely because of their different histories.

  To argue for this, I must first clear the field of the two dominant rival families of view: the Semantic/Expressive accounts and the Contextual Pragmatic accounts.

  #### I. The Rival Families and Their Predictions

  **1. The Semantic/Expressive Account**
  This view holds that the derogatory nature of a slur is encoded in the word itself. Whether treated as a truth-conditional feature (e.g., "X is a [Slur]" means "X is of group G and X is contemptible") or as a conventional implicature (e.g., "X is a [Slur]" means "X is of group G" + *expresses contempt for G*), the offense is part of the linguistic meaning.
  *   **Prediction on Minimal Pairs:** If we construct two terms, $T_1$ and $T_2$, that share the same descriptive reference and the same conventional expression of attitude, they must possess identical derogatory force. History is irrelevant to the current power of the term; only the current lexical entry matters.

  **2. The Contextual Pragmatic Account**
  This view holds that slurs are semantically neutral terms that acquire derogatory force through speaker intention and conversational context. The word itself is empty; the harm is done by the speaker using it to signal hostility or to invite the audience to share a prejudiced perspective.
  *   **Prediction on Minimal Pairs:** If $T_1$ and $T_2$ are used in the same context, with the same speaker intention, and the same audience uptake regarding the speaker's attitude, they must possess identical derogatory force. History might explain *why* a speaker chose $T_1$, but it does not determine the force of the utterance itself.

  Both views fail because they isolate the word or the moment of utterance from the temporal trajectory of the language. To demonstrate this, I will construct a minimal pair where semantics, expression, and immediate context are held fixed, leaving only history as the variable.

  #### II. The Minimal Pair: *Krell* vs. *Dane*

  Imagine a society containing a demographic group, the *Orians*. We introduce two terms, *Krell* and *Dane*, into this society's language.

  **Descriptive Content:** Both *Krell* and *Dane* truth-conditionally refer to "an adult male Orian."
  **Expressive Content:** Both *Krell* and *Dane* conventionally implicate the speaker's disdain for Orians. In a dictionary of this language, both are marked with the usage note: "Used to express contempt."

  **The Divergence (History):**
  *   **The History of *Krell*:** For three centuries, *Krell* was the legal and colloquial term used by the ruling class to justify the enslavement of Orians. Public usage of *Krell* was mandated in courts; private usage was rewarded with social status. Conversely, Orians using *Krell* to refer to themselves were punished. The term is inextricably linked to a history of violence, systemic exclusion, and physical harm.
  *   **The History of *Dane*:** Yesterday, a logician coined *Dane* in a private paper. She stipulated that *Dane* means "adult male Orian" and explicitly defined it to carry the same conventional implicature of contempt as *Krell*. She intends it to be a synonym. It has no history of usage outside her study. It has never been used to justify violence, nor has it been tied to social rewards or punishments.

  **The Test Case:**
  A speaker, $S$, stands in a public square. $S$ is not a member of the Orian group. $S$ points to an Orian man, $O$, and says loudly:
  1.  "That **Krell** is blocking the path."
  2.  "That **Dane** is blocking the path."

  $S$ has the exact same intention in both cases: to express annoyance and disdain for $O$. The audience hears both utterances. They understand the descriptive meaning and the expressive coloring of both terms equally well.

  **The Verdict:**
  Utterance (1) constitutes an act of subordination. It reinforces a hierarchy. It may silence $O$ (who feels a threat to his safety). It wounds $O$ deeply.
  Utterance (2) constitutes an act of rudeness. It insults $O$. It does not reinforce a hierarchy (because *Dane* is not the tool of a hierarchy). It does not silence $O$ (who can retort without fear of historical reprisal). It wounds $O$ less, or differently.

  **Why the Rivals Fail:**
  *   **The Semantic/Expressive Account** predicts (1) and (2) are equally harmful. Since the dictionary entry (meaning + expression) is identical, the offense should be identical. But our intuition is that *Krell* carries a weight *Dane* lacks. The Semanticist cannot explain why *Krell* threatens violence while *Dane* merely signals rudeness, despite having the same "contempt" marker.
  *   **The Contextual Pragmatic Account** predicts (1) and (2) are equally harmful. Since the speaker's intention (contempt) and the immediate context (public square) are identical, the force should be identical. But the Pragmatist cannot explain why the audience reacts to *Krell* with tension and to *Dane* with confusion or mild offense. The immediate context is the same; the difference lies entirely in the *past* context embedded in the word.

  Therefore, the derogatory *force* (the power to subordinate and harm) is not in the meaning or the immediate use, but in the historical trajectory of the term.

  #### III. Addressing Objections

  **Objection 1: The Stipulation Objection**
  *Critique:* You have merely stipulated that *Krell* is worse than *Dane*. You haven't proven it. You are asking me to assume the conclusion (that history matters) by building it into the example. If I don't share your intuition that *Krell* is worse, your argument collapses.

  *Response:* This objection misunderstands the method of philosophical modeling. I am not stipulating the *verdict*; I am stipulating the *conditions* to isolate a variable. When I describe the history of *Krell* (linked to enslavement and violence) versus *Dane* (coined in a study), I am invoking a pre-existing understanding of how social power works. We already know that a threat whispered in a dark alley differs from a threat shouted in a play, even if the words are identical. The "stipulation" simply makes explicit the background conditions we implicitly recognize in real-world slurs. If a reader genuinely believes a word coined yesterday with a definition of "contempt" carries the same social weight as a word used for centuries to justify lynching, that reader lacks a concept of social reality, not just language. The intuition is not generated by the stipulation; the stipulation isolates the cause of the intuition.

  **Objection 2: The Ignorant Hearer Objection**
  *Critique:* Suppose a hearer, $H$, is new to this society and knows nothing of the history of *Krell*. $H$ hears "That Krell is blocking the path." $H$ still feels the derogatory force. $H$ is offended. If the force comes from history, and $H$ doesn't know the history, $H$ shouldn't be affected. Since $H$ is affected, the force must be in the word or the tone, not the history.

  *Response:* We must distinguish between *offense* (a psychological reaction to rudeness) and *subordination* (a social act of lowering status). The ignorant hearer $H$ perceives the *expressive content* (the contempt), which causes offense. $H$ reacts to the tone. However, $H$ does not perceive the *threat*. $H$ does not understand that uttering *Krell* might incite a crowd to violence, nor does $H$ understand that $O$ is silenced by the term.
  Furthermore, the derogatory force of a slur is not merely the sum of individual psychological reactions. It is an illocutionary act of ranking. If I say "I hereby sentence you to death" without the authority of a judge, the words have no force, even if they scare the listener. Similarly, *Krell* derives its specific slurring power from the "authority" of historical enforcement. The ignorant hearer senses the *hostility* (which is semantic/expressive) but misses the *subordination* (which is historical). The thesis claims the *slurring power* (the systemic harm) is historical, not that the *perception of rudeness* is historical.

  #### IV. The Single Feature and Its Removal

  The single feature of my examples doing the real work is **Normative Enforcement History**.

  In the case of *Krell*, the term was historically tied to a system of rewards (for users) and punishments (for targets). It was a tool of governance and social control. In the case of *Dane*, the term lacks this trajectory of enforcement. It is a "floating" signifier of contempt without a backbone of social consequence.

  **What happens if this feature is removed?**
  If we remove the history of normative enforcement from *Krell*—imagine a scenario where the society undergoes total amnesia regarding the Orian enslavement, or the power structures completely collapse and are forgotten—*Krell* ceases to function as a slur in the full sense. It becomes a "dead slur." It retains its expressive coloring (it is still rude, still expresses contempt), but it loses its capacity to subordinate. It becomes semantically equivalent to *Dane*.

  This confirms the thesis: without the history of enforcement, the specific derogatory *force* (the power to harm beyond mere rudeness) vanishes. The word remains, the meaning remains, the attitude remains, but the *slur*—as a mechanism of social hierarchy—dissolves. Thus, the slur is not in the semantics, but in the scar tissue of the word's history.
