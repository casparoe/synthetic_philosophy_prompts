      *   *Decision:* The hands should arrive *late* as the historical punchline, but the *structure* must be established early. Actually, the prompt asks whether the hands can bear the weight. For *this* audience, starting with the hands is risky. They want the derivation. Let's make the *logical structure* the carrier, and the hands the instantiation.
      *   *Refinement:* The prompt asks: "whether the hands can bear that weight... or whether I should build the arc around a different case and let the hands arrive late."
      *   *Strategy:* Use a mathematical or systems-analogy case first to establish the *logical form* (Modus Ponens vs. Modus Tollens). Then apply it to the Hands. This respects their literacy.
      *   *Wait, re-reading:* "if the latter [hands arrive late], what the substitute case must have..."
