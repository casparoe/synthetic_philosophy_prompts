      *   **Topic:** G.E. Moore's "Proof of an External World" (specifically the "Here is a hand" argument).
      *   **Time:** 90 minutes.
      *   **Goal:** Plan *how* to explain it, not explain it. Focus on sequencing, pedagogical strategy, misconception management, and thematic depth.
