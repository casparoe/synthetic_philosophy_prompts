      *   **Closing Question:** Needs to test understanding of the *structure*, not the conclusion. "If you accept Moore's move here, what other premise in your own workflow becomes immune to doubt?"

  9.  **Fragility:**
      *   The "Begging the Question" objection is the killer. If they don't buy that circularity is sometimes necessary for foundationalism, the session dies.
      *   Signal: Nods during logic, silence during application.

  10. **Writing the Response:**
      *   Tone: Professional, direct, pedagogical, respectful of the audience's intelligence.
      *   Structure: Follow the prompt's requirements (Order of components, Pedagogical specifics, Misconceptions, Threads, Fragility).

