answer: |-
  Your hypothesis is correct that the debate conflates ontology, explanation, and semantics, but your assessment that the ontology is "nearly settled" requires a slight correction: the ontology is settled only on *supervenience*, not on *causal efficacy*. The stalemate persists because both sides accept that social facts depend on individual facts, but they disagree on whether the dependency relation allows for *autonomous causal powers* at the macro level. However, this ontological friction is rarely the engine of the fight; it is merely the vocabulary in which the real disagreements are expressed.

  The disagreement is best diagnosed as a **combination** of **different-questions** and a **hidden-empirical** constraint, masked by verbal confusion.

  First, consider the **different-questions** aspect. The individualists and holists are not answering the same question; they are optimizing for different explanatory virtues.
  *   **The Individualist Commitment:** They are committed to *understanding* and *accountability*. For them, an explanation is only complete if it identifies the levers of agency. If you cannot trace a social outcome to individual choices, you have not explained *how* it happened, only *that* it happened. Their bedrock commitment is normative: to treat collectives as agents is to obscure responsibility (the "politically dangerous" claim). They want a science of *mechanisms*.
  *   **The Holist Commitment:** They are committed to *stability* and *prediction*. For them, an explanation is successful if it identifies invariant regularities that hold regardless of individual turnover. If a suicide rate remains stable while the specific individuals committing suicide change entirely, the explanation must lie in the social structure, not the psychology. Their bedrock commitment is pragmatic: individual-level data is often unavailable or too noisy, while macro-patterns are robust. They want a science of *functions*.

  Because they value different virtues, they talk past each other. When the individualist says "you haven't finished," they mean "you haven't opened the black box." When the holist says "you're assuming a ready-made individual," they mean "your primitives are themselves products of the system you're trying to explain." Neither can argue for their preference from neutral ground because the preference rests on what they want social science to *do* (emancipate agents vs. manage systems).

  Second, there is the **hidden-empirical** constraint you identified, which is more devastating to the individualist position than they admit. You referenced general equilibrium theory; specifically, the Sonnenschein-Mantel-Debreu (SMD) theorem demonstrates that aggregate demand functions do not necessarily inherit the properties of individual demand functions (such as downward sloping or uniqueness of equilibrium) unless implausibly restrictive assumptions are made about individual preferences.
  *   **The Implication:** If the SMD result generalizes to other social domains (and there is no reason to think social aggregation is mathematically simpler than economic aggregation), then the individualist programme is not just difficult, it is formally impossible. You cannot recover macro-regularities from micro-axioms because the aggregation process destroys the information required to make the micro-axioms predictive.
  *   **The Stalemate:** Individualists dismiss this as "prediction rather than explanation," but this is a retreat. If microfoundations cannot generate the macro-phenomena we observe, then positing them is a metaphysical gesture, not an explanatory one. Holists treat this as proof of autonomy, but they often fail to specify the mechanism of "downward causation" without resorting to mysticism. The empirical reality is that macro-regularities exist, but the bridge to the micro is broken.

  Third, the **verbal** layer sustains the conflict. When individualists say social entities are "nothing over and above" individuals, they mean *compositional*. When holists hear "nothing over and above," they hear *eliminative*. Conversely, when holists say structures "constrain and constitute," individualists hear *determinism* or *reification*. Because both sides accept supervenience, the word "exist" is doing no work; the fight is about whether "exists" implies "is causally primary" or "is derivable."

  **Is progress possible?**
  Progress is possible if the seminar stops asking "Which level is real?" and starts asking "At which level is the explanation *robust*?"
  *   **A Distinction:** Distinguish between *ontological reduction* (everything is made of individuals) and *explanatory reduction* (everything is best explained by individuals). The SMD theorem suggests ontological reduction is true but explanatory reduction is false.
  *   **A Formal Result:** Acknowledge that aggregation problems (like SMD) place a hard limit on microfoundations. This forces individualists to abandon the demand for *complete* micro-reduction and accept "mechanism sketches," while forcing holists to specify *institutional channels* rather than vague "downward causation."
  *   **A Change of Question:** Shift from "What is the ultimate foundation?" to "What is the appropriate grain of analysis for this specific problem?" Sometimes the price level is the right variable; sometimes the individual bargain is.

  **Is there a diagnosis under which no progress should be expected?**
  Yes. If the disagreement is ultimately **bedrock** regarding the *political purpose* of social science, no methodological compromise will satisfy either side. If individualists view holism as inherently authoritarian (subsuming the person into the collective) and holists view individualism as inherently ideological (masking structural power as free choice), then the methodological fight is a proxy for a normative war. In this scenario, the seminar is not a search for truth but a ritualized conflict between liberalism and structuralism. Progress here requires political negotiation, not philosophical clarification.

  However, assuming good faith, the blockage is primarily that the individualists are demanding a mathematical derivation that is likely impossible, while the holists are claiming an autonomy they cannot mechanize. The fight continues because both sides are defending a necessary but insufficient condition for social science.

  \answer{combination — different-questions and hidden-empirical — the crux is that the sides pursue incompatible explanatory goals (mechanism vs. stability) while ignoring formal results that render the individualist goal intractable.}
