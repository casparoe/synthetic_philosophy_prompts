      *   Players -> Economic Agents: Partial. Agents have unequal starting endowments, unlike many games.
      *   Referee -> State/Judiciary: Fails/Partial. The referee is often a player (state owns assets, corrupt officials).
      *   Field -> Infrastructure/Geography: Partial. Field changes shape (climate, resource depletion).
      *   Score -> GDP/Welfare: Partial. Zero-sum vs Positive-sum confusion.
      *   Prize -> Prosperity: Partial. Not everyone agrees on the prize (equality vs growth).

  4.  **Identify Smuggled-in Features (Game features absent in Economy):**
