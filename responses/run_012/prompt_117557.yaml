      *   *Referee Neutrality:* In games, refs don't play. In economies, the state enforces rules but also participates/taxes/regulates for political ends. Load-bearing: Yes. Without neutrality, rules are weapons.
      *   *Path Dependence/History:* Games start fresh. Economies have history (colonialism, past conflicts). Load-bearing: Yes. You can't just "install" rules without considering history/culture.
      *   *Consensus on Goals:* Games have clear win conditions. Economies have conflicting goals (growth vs equity). Load-bearing: Partial. Affects definition of "prosperity."

