  Based on the six verdicts you have provided, Nadia's position is highly consistent with a specific family of views in population ethics. Below is an analysis of the principles that fit her data, my prediction for your new case, and a proposal for a "critical experiment" to finalize your characterization of her view.

  ### 1. Diagnostic Analysis: What Principles Fit?

  Nadia's verdicts rule out Classical Total Utilitarianism (due to the rejection of the Repugnant Conclusion and the negative value assigned to low-welfare lives) and strict Person-Affecting Views (since she compares outcomes with different populations). Two candidate principles fit all six verdicts equally well:

  **Candidate A: Critical-Level Utilitarianism (CLU)**
  *   **The Rule:** An outcome's value is the sum of each individual's welfare minus a "critical level" ($\alpha$). Lives below $\alpha$ have negative value; lives above $\alpha$ have positive value.
  *   **Fit:**
      *   Verdicts (i) and (v) imply $\alpha > 6$ (adding lives at 5 or 6 makes the outcome worse).
      *   Verdict (iii) implies $\alpha < 60$ (adding lives at 60 makes the outcome better).
      *   Verdict (ii) and (iv) are consistent with a moderate $\alpha$ (e.g., 20–50), which blocks the Repugnant Conclusion because massive populations at welfare 3 or 15 generate massive *negative* value relative to the critical level.
      *   Verdict (vi) is consistent provided the positive value of the 100s outweighs the negative/low value of the 50s relative to the comparator.
  *   **Estimated Critical Level:** Somewhere between 6 and 60. Given her work on justice, it likely represents a "decent life" threshold, perhaps around 20–40.

  **Candidate B: Average Utilitarianism (AU)**
  *   **The Rule:** The best outcome is the one with the highest average welfare.
  *   **Fit:**
      *   Verdicts (i), (ii), (iv), and (v) all involve comparisons where the larger population has a significantly lower average.
      *   Verdict (iii) involves a comparison where the larger population has a higher average (20 vs 40).
      *   Verdict (vi) compares an average of ~95.5 to an average of 60.
  *   **Fit:** All six verdicts are perfectly consistent with Average Utilitarianism.

  ### 2. Prediction on the New Case

  **The Case:**
  *   **Option A:** 10 Billion people at 90.
  *   **Option B:** 10 Billion people at 90 + 20 Billion people at 70.

  **My Best Guess:** Nadia will say **Option B is better.**

  **Reasoning:**
  While both CLU and AU fit her past verdicts, they diverge here.
  *   **Average Utilitarianism** would choose **Option A**. The average welfare drops from 90 to roughly 76.7. An Average Utilitarian must reject the addition of the 20 billion, even though their lives are very good (70), simply because they are not *as good* as the existing population.
  *   **Critical-Level Utilitarianism** would choose **Option B**. Since we know her critical level $\alpha$ is less than 60 (from verdict iii), lives at 70 are well above the threshold. They contribute positive value. The fact that they lower the *average* does not matter to a Critical-Level view, only that they are above the *critical level*.

  **Why CLU is more likely than AU:**
  1.  **Intergenerational Justice:** Nadia works on justice. Average Utilitarianism implies that we ought not to bring children into existence if their lives would be slightly less happy than our own (even if those lives are excellent). This is generally incompatible with theories of intergenerational justice, which usually focus on *sufficiency* (ensuring future people have enough) rather than *elitism* (ensuring future people match our peak).
  2.  **The Nature of Her Objections:** In verdicts (i) and (v), she objects to adding lives at 5 and 6. In an Average view, these are bad because they are low. In a CLU view, they are bad because they are *below the threshold of a life worth contributing*. The confidence she displays suggests she sees these low lives as a burden in themselves, not just as diluters of an average.
  3.  **Philosophical Stability:** Average Utilitarianism is often rejected in reading groups (which she attends) because it implies the "Sadistic Conclusion" in certain formulations or forbids procreation in flourishing societies. CLU is the standard "moderate" alternative that retains the benefits of totalism without the Repugnant Conclusion.

  ### 3. The Critical Experiment

  To definitively separate Critical-Level Utilitarianism from Average Utilitarianism in your paper, you should present her with a case where the added lives are **above the critical level** but **below the current average**.

  **Proposed Case:**
  > "We must choose between two futures: In one, **one million people exist at 100**. In the other, **those same one million exist at 100** and are joined by **one billion new people at 90**."

  **How this separates the principles:**
  *   **Critical-Level Utilitarianism:** Will say the **second outcome is better**. The new lives are at 90, which is surely above the critical level (which we know is <60). Therefore, they add positive value.
  *   **Average Utilitarianism:** Will say the **first outcome is better**. The average welfare drops from 100 to roughly 90.9. Adding the new people lowers the average, so it is worse.

  **Why ask this next:**
  If she chooses the larger population, you can confidently characterize her as a Critical-Level Utilitarian (or a Total Utilitarian with a lexical threshold). If she chooses the smaller population, you must characterize her as an Average Utilitarian. Given her focus on justice, the former is the more charitable and likely interpretation, but her answer to this specific trade-off will settle the matter.

  ### Summary for Your Paper
  *   **Settled Commitments:** She is committed to a view that assigns negative value to lives below a certain threshold (between 6 and 60) and rejects the Repugnant Conclusion.
  *   **Expected Verdict:** She will likely endorse adding the 20 billion people at 70, as 70 exceeds her inferred critical level.
  *   **Key Distinction:** Her view likely prioritizes *absolute sufficiency* (Critical Level) over *relative standing* (Average), which you can test with the "100 vs 90" addition case.
