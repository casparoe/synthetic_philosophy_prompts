      *   **Specific Lens:** Read *Somnium* through Kepler's *reformed astrology* (harmonic, soul-mediated, inclination not compulsion) vs. textbook/popular astrology (physical influence, houses/signs, compulsion).
      *   **Key Textual Elements to Include:**
          *   Duracotus (Icelandic boy) & Fiolxhilde (mother, charm-seller, daemon-summoner).
