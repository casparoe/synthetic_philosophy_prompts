          *   How is Fiolxhilde treated? Continuous with Kepler's craft or split by fiat?
          *   Copernican vantage: Do aspects hold from the Moon? Does the fiction expose geocentric measuring inside a heliocentric system?
      *   **Constraint:** Fair to the story *as a story*, not just a diagram. Where does it resist the reading? What tension does it show that arguments don't?

  2.  **Initial Brainstorming & Synthesis:**

      *   *The Daemon Problem:* Kepler's reformed astrology tries to naturalize influence (light/harmony affecting the soul). *Somnium* uses daemons for transport. This looks like a regression to occultism. But maybe the daemons represent the *mechanism* of the soul's travel/perception? Or maybe it highlights that physical travel (like causal influence) requires a mediator that physics can't yet explain. The "cold sponge" is physical, the daemon is spiritual. This mirrors the body/soul split in his astrology.
      *   *Fiolxhilde vs. Kepler:* Fiolxhilde is a witch. Kepler is an Imperial Mathematician. But both deal with hidden knowledge. The notes added during the trial suggest Kepler is terrified of the association. The text tries to distinguish them (she summons daemons, he dreams), but the overlap is suspicious. The "foolish daughter" quote fits here: she is the superstition he wants to cleanse, yet she provides the data (Duracotus learns astronomy from her daemon).
      *   *The View from Levania:* This is the crux of the Copernican question. Aspects are angular relationships. If you move from Earth to Moon, the angles change. If astrology depends on specific geometric angles (Kepler's harmonics), does it hold from the Moon? *Somnium* describes the Earth (Volva) as a planet. The inhabitants watch Volva. This shifts the geocentric frame. If astrology is about the *soul's perception* of harmony, does the soul on the Moon perceive the same harmonies? The text implies the environment (Subvolva/Privolva) dictates existence, suggesting a local determinism rather than a universal harmonic one.
      *   *The Dream Frame:* Waking up mid-description is crucial. It admits the incompleteness of the vision. It protects Kepler (it's just a dream), but also admits that the full causal mechanism cannot be fully articulated in waking reason.
      *   *Tension:* Kepler wants to mechanize the heavens but spiritualize the influence. *Somnium* mechanizes the travel (physics of the journey) but spiritualizes the agent (daemons). It's a chiasm.

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the ambition. *Somnium* isn't just sci-fi; it's an astrological allegory. Set up the tension: Reformed Astrology (Harmony/Soul) vs. Narrative Mechanism (Daemons/Physics).
      *   **The Daemon as Causal Gap:** Kepler's theory says "Harmony moves the Soul." But *how*? *Somnium* says "Daemons carry the Body." The daemon is the *psychopomp*. It's not just a placeholder; it's an admission that the bridge between geometry and experience is transcendent. The "cold sponge" is the physical constraint (body), the daemon is the vector. This mirrors the astrological claim: planets don't push bodies; they signal souls. The fiction *knows* it's a gap because the journey is dangerous and requires a mediator.
      *   **Fiolxhilde and the Witch Trial:** This is the emotional core. Fiolxhilde is the "Foolish Daughter" incarnate. She uses daemons for profit/curiosity. Kepler uses them for knowledge. But the notes (added during the trial) show Kepler sweating. He tries to sanitize the dream, but the text binds them together. Duracotus learns from *her*. The " Wise Mother/Astrology" quote is inverted: Fiolxhilde is the mother who teaches the son (Kepler/Duracotus) but risks killing him (trial). The story doesn't split them by fiat; it shows the *danger* of the connection.
      *   **Levania and the Aspect Problem:** This is the technical astrological point. Aspects are geocentric (mostly). From the Moon, Earth is a planet (Volva). Do the harmonies hold? Kepler's reformed astrology relies on the *Earth's soul* (or the observer's soul) perceiving the angles. If the observer moves, the angles change. *Somnium* describes the *conditions* of the Moon (Subvolva/Privolva) as determined by Volva's light/position. This suggests a local astrology. It exposes that Kepler's "universal harmonies" might still be tethered to the human/terrestrial vantage point. The fiction exposes the geocentric residue.
      *   **The Dream Frame & Resistance:** Waking up mid-stream. The theory can't be finished. The story resists being a perfect diagram because the experience of the "influence" (the journey) is ineffable. The tension is between *knowing* the math and *feeling* the motion.
      *   **Conclusion:** Summarize the tension. *Somnium* doesn't solve the problem; it stages it. It shows Kepler caught between the new physics and the old metaphysics.

  4.  **Refining and Polishing (Self-Correction during drafting):**

      *   *Check:* Did I address the "cold damp sponges"? *Correction:* Make sure to mention the physical toll of the journey mirrors the "inclination not compulsion" idea. The soul is moved, but the body suffers.
