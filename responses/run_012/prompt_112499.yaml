      *   *Check:* Is the tone appropriate? *Correction:* Needs to be seminar-ready, analytical, nuanced, not dogmatic.
      *   *Check:* Did I answer "Does the fiction know it?" *Correction:* Yes, argue that the dream frame and the annotations show the fiction is self-aware of its own precariousness.
