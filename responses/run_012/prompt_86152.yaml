answer: |-
  Here are the desiderata for a theory of "reasons without reasoners" (naturalized teleology), structured according to your specifications.

  ### 1. The Cases It Has to Get Right
  A viable theory must correctly classify the teleological status of the following five scenarios:

  *   **A trait shaped by natural selection:** (e.g., a heart pumping blood). The theory must identify this as having a genuine purpose derived from historical survival value, independent of any current observer.
  *   **A behavior learned by trial and error:** (e.g., a reinforcement-learning agent navigating a maze). The theory must treat this as purposeful, grounded in the history of reward signals, analogous to natural selection but compressed in time.
  *   **An artifact whose function was assigned by a designer:** (e.g., a thermostat). The theory must account for its purpose as "derived" from the designer's intent, distinct from biological purpose but still real.
  *   **An arrangement that merely looks purposeful but is an accident:** (e.g., a stone worn smooth by water looking like a tool, or a statistical fluke where variables correlate). The theory must identify this as having *no* purpose, despite the appearance of design.
  *   **A case in which purpose-talk is tempting but wrong:** (e.g., a river "seeking" the sea, or a cancer cell "trying" to survive). The theory must explain why we speak this way (efficient prediction) while denying that the system actually possesses a function or goal in the normative sense (since cancer is a breakdown of function, not a function itself).

  ### 2. The Distinctions It Must Not Collapse
  The theory must maintain boundaries between the following concepts:

  *   **Between having a function and merely having an effect:** A heart makes a thumping sound (effect) but is *for* pumping blood (function). The theory must explain why the sound is accidental but the pumping is normative.
  *   **Between being *for* something and being *caused* by something:** A falling rock is caused by gravity; a missile is caused by guidance systems *for* hitting a target. Causation is backward-looking (physics); purpose is forward-looking (goal state).
  *   **Between the purposes produced by selection, design, and learning:** While all three generate purpose, the *source* of the normativity differs. Biological functions are selected; artifacts are designed; learning agents optimize. The theory must distinguish these etiological origins.
  *   **Between a system's behaving *as if* it had a reason and its *actually* having one:** A thermostat behaves as if it wants 20°C. A human acts as if they want water. The theory must specify the threshold where "as if" becomes "is," or explain why the distinction is pragmatic rather than ontological.

  ### 3. The Results It Cannot Contradict
  The theory must remain consistent with established scientific facts:

  *   **That natural selection is mindless:** Purposes can arise without a mind conceiving them first. There is no "ghost in the machine" of evolution.
  *   **That physics need not mention purposes:** Fundamental laws (thermodynamics, quantum mechanics) are purely causal. Teleology cannot violate physical closure.
  *   **That a system can be mistaken about what it is for:** A malfunctioning heart or a misaligned satellite is failing its purpose. A purely physical description cannot capture "failure," only "difference."

  ### 4. The Tension and the Ruling Requirement

  **The Incompatible Pair:**
  I believe the following two requirements cannot be jointly satisfied within a single, flat level of description:
  1.  **Physics need not mention purposes** (Physical Exhaustiveness).
  2.  **A system can be mistaken about what it is for** (Normative Authority).

  **The Consideration:**
  This is the classic "Is-Ought" problem applied to engineering. If the physical description is complete (Requirement 1), then every state of the system simply *is* what it is. A broken gear is just atoms arranged differently than a working gear. There is no physical fact that makes the broken gear "wrong." To say it is "mistaken" (Requirement 2) requires a standard (an *ought*) that is not present in the atoms themselves. You cannot derive the normativity of "mistake" from the causality of "physics" without bridging them with something else (usually history or information).

  **The Single Ruling Requirement:**
  **"A system can be mistaken about what it is for."**

  **Why:**
  This requirement does the most to rule out otherwise attractive positions.
  *   It rules out **Behaviorism**: You cannot define purpose solely by what the system *does*, because a broken system behaves differently but still has the *same* purpose (it just fails at it).
  *   It rules out **Strict Reductionism**: You cannot reduce purpose entirely to current physical states, because the physical state of a "failed" system is just as lawful as a "successful" one.
  *   It forces the theory to be **Etiological**: To account for "mistakes," you must look at the *history* of the system (what it was selected/designed/trained to do), not just its current structure. This is the only way to establish a standard against which current performance can be judged "wrong."

  ### 5. The Machine-Learning Case

  **The Case:**
  A machine-learning model trained only to reduce a loss often develops internal structure and strategies (sub-goals) that its designers never specified and cannot fully read off.

  **The Verdict:**
  A theory of reasons-without-reasoners should treat this as **Genuine Derived Purpose**.

  It is not *mere* metaphor, because the system will actively resist perturbations that prevent it from achieving these sub-goals (instrumental convergence). It is not *Original* Purpose (like a conscious mind), because the normativity is anchored externally. It is **Genuine** because the system satisfies the conditions for function (it can fail at the sub-goal), and **Derived** because the source of that function is the training regime.

  **The Forcing Desideratum:**
  This answer is forced by: **"A behavior learned by trial and error."**

  **Why:**
  If your theory correctly classifies biological learning (evolution) and individual learning (RL) as purpose-generating processes (as required by the "Cases" section), then the ML model falls squarely into the "learned by trial and error" category.
  *   The loss function acts as the "environmental pressure."
  *   The gradient descent acts as the "selection mechanism."
  *   The internal sub-goals are "adaptations."

  Because you require the theory to treat **trial-and-error learning** as a genuine source of purpose (distinct from accident, distinct from mere causation), you are forced to admit that the ML model's sub-goals are real purposes. They are not specified by the designer (like the thermostat), but they are selected by the training process (like the plant). To deny them status as purposes would require collapsing the distinction between **learning** and **accident**, which violates your desiderata.

  However, because you also require the theory to respect that **physics need not mention purposes**, you must acknowledge that this purpose is not a fundamental force. It is a higher-level pattern grounded in the *history of optimization*. Thus, it is **Genuine Derived Purpose**: real enough to cause behavior and admit of error, but ontologically dependent on the training history that created it.
