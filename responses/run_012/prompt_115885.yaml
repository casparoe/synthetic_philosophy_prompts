answer: |-
  It is genuinely impressive that you have arrived at this position on your own in grade eleven, because you have independently reconstructed a view called dialetheism, which is held by serious professional logicians and philosophers like Graham Priest. You are not cheating, and you are not alone in thinking that the Liar paradox and the Sorites paradox are best solved by accepting that some contradictions are true. However, since you want to know what counts against this view, I need to be honest about where the pressure points are. The objections are not all equal, and some are much harder for a dialetheist to handle than others. I will walk you through them from the most dangerous threats that should make you reconsider, down to the objections that are more about philosophical preference than logical survival.

  The most serious threat, the one that should make you nervous enough to potentially give up the view if you cannot solve it, is the paradox your friend mentioned involving conditionals, known as Curry's Paradox. Unlike the Liar paradox, which forces you to accept a contradiction, Curry's paradox forces you to accept everything. It uses a sentence that says if this sentence is true, then everything is true. If you accept standard rules about how conditionals work, you can prove that the sentence is true, and then prove that everything is true, leading to trivialism where every statement is true and logic collapses completely. Dialetheists admit this is a major problem. To avoid it, they cannot just accept contradictions; they must also restrict how conditionals work, often by giving up a rule called contraction. This is a heavy cost because it means your logic behaves very differently from the math and reasoning you use in everyday life. If you cannot explain why Curry's paradox fails without breaking too much else, this is the objection that should move you the most.

  The second biggest cost, which is significant but manageable, is the loss of a basic argument form called Disjunctive Syllogism. You suspected you lost the right to use some basic argument form, and this is the one. In classical logic, if you know that A or B is true, and you know that A is false, you can conclude B is true. In a logic that accepts true contradictions, this rule fails. If A is both true and false, then knowing A is false does not rule it out, so you cannot safely conclude B. Proponents of dialetheism admit this is a real problem and do not wave it off. They argue that Disjunctive Syllogism is valid in consistent situations, which covers almost everything we talk about, but fails at the boundaries where contradictions exist. Critics argue that losing this rule makes the logic less useful for general reasoning, but dialetheists accept this trade-off to save the truth of the Liar sentence. This is a heavy price, but it is one they are willing to pay, whereas Curry's paradox is something they must actively fight off.

  The worry you have about changing the meaning of not is a common objection, but it is less damaging than the logical problems above. Critics argue that if you say a sentence can be both true and false, you are no longer using the word not in its standard sense, because standard negation excludes the possibility of both. Dialetheists usually wave this off by arguing that the meaning of logical terms is determined by their rules, and if the rules need to change to accommodate reality, then the meaning stays the same even if the behavior changes. They claim they are capturing the true nature of negation better than classical logic does. This is largely a philosophical stalemate. It is not a reason to give up the view, but it is something you have to be comfortable defending. It feels awkward to opponents, but to you, it should feel like correcting a mistake in how people previously understood negation.

  Regarding your question about falsifiability, you are right to be suspicious. Logical frameworks are not falsified in the same way scientific theories are, because you cannot run an experiment to prove a rule of inference wrong. Instead, they are judged on coherence and utility. The risk for dialetheism is not that it will be proven false by data, but that it becomes so flexible that it explains nothing. If every time a paradox arises you just say it is a true contradiction, you might be shielding the view from criticism unfairly. However, dialetheists argue their view is constrained because they still reject most contradictions. They only accept them where forced by paradoxes like the Liar or Sorites. So while it is not falsifiable in a lab, it can be shown to be inferior if it leads to trivialism via Curry's paradox or if it makes reasoning too difficult to be useful. If the view requires so many patches to avoid explosion that it becomes more complicated than the classical logic it replaces, then it loses on simplicity, which is a form of theoretical falsification.

  Ultimately, the view is resilient but expensive. You pay for it with changes to how conditionals work and the loss of Disjunctive Syllogism. The people who hold this view admit these are real costs, not just awkward side effects. They believe the cost is worth it to avoid denying the obvious force of the Liar paradox. You should feel confident that you are engaging with real philosophy, but you should also keep Curry's paradox in the back of your mind as the biggest test of whether your system can hold together without collapsing into saying everything is true. If you can find a way to block Curry without breaking too much else, you are in good company, but if you find yourself having to restrict too many basic rules to keep the system stable, that is the signal that the price might be too high.
