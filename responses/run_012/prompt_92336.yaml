answer: |-
  Here is a complete, runnable lesson plan designed for your 90-minute seminar. It prioritizes student discovery over exposition and is engineered to force the SSA/SIA conflict into the open.

  ## **Lesson Overview**
  *   **Topic:** Indexical Probability, SSA vs. SIA, The Presumptuous Philosopher.
  *   **Time:** 90 Minutes.
  *   **Students:** 14 (Third-year undergrads).
  *   **Goal:** Students experience the intuitive pull of Self-Sampling (SSA) and Self-Indication (SIA) before learning the terms, culminating in the counter-intuitive implications of SIA (Presumptuous Philosopher).

  ---

  ## **1. Materials & Prep**
  *   **The Chips:**
      *   **Bag S (Small):** 10 poker chips, numbered 1–10 (use a sharpie or stickers).
      *   **Bag L (Large):** 1000 poker chips, numbered 1–1000.
      *   *Prep Note:* Numbering 1000 chips is tedious. Do this before class. If you run out of time, Bag L can be 100 chips, but 1000 makes the Round 3 leap more dramatic.
      *   **Appearance:** Both bags must be opaque and identical. Label them internally only (e.g., a dot on the bottom) so *you* know which is which, but students don't.
  *   **The Currency:**
      *   Give each student 10 "Credence Tokens" (poker chips of a different color, or printed tickets).
      *   **Prize:** The student with the most tokens at the end gets a significant prize (e.g., a nice chocolate bar, a book, or a "homework pass"). This ensures they treat the betting seriously.
  *   **The Board:**
      *   Divide the whiteboard into three sections: **Round 1**, **Round 2**, **Round 3**.
      *   Draw a table for each: *Bet Small | Bet Large | Result*.
  *   **The Coin:** A large, visible coin.

  ---

  ## **2. Minute-by-Minute Timeline**

  ### **0:00 – 0:05 | Introduction & Rules**
  *   **Say:** "Today is not a lecture. It is a series of wagers. You start with 10 tokens. In each round, I will set up a scenario involving a coin flip and a bag of chips. You will bet your tokens on which scenario obtained. At the end, the richest philosopher wins the prize."
  *   **Rule:** "You must bet at least 1 token per round. You can bet all 10 if you are certain."
  *   **Constraint:** "No talking during the betting phase. Write your bet down privately."

  ### **0:05 – 0:20 | Round 1: The Calibration (Indexical Evidence)**
  *   **Setup:** "I have two bags. Bag A has 10 chips (1–10). Bag B has 1000 chips (1–1000). I flip a fair coin. Heads = I draw from Bag A. Tails = I draw from Bag B."
  *   **Action:** Flip the coin (hidden result). Draw a chip. **Reveal the number to the class.**
      *   *Scenario A (Likely):* You draw a high number (e.g., **847**).
      *   *Scenario B (Possible):* You draw a low number (e.g., **6**).
      *   *Instructor Note:* If you draw #847, the lesson is easy. If you draw #6, the lesson is richer. **Recommendation:** Rig this slightly or have a backup number ready. If you draw #6, the Bayesian update favors Small 100:1. If you draw #847, it proves Large 100%. **Let's assume you draw #6 for maximum debate.**
  *   **Betting:** Students write down: *Small or Large?* and *How many tokens?*
  *   **Reveal:** Ask for a show of hands. (Almost everyone should bet Small). Reveal the bag was Small.
  *   **Board:** Record the result.
  *   **Debrief (1 min):** "Why did you bet Small?" (Expected answer: "847 couldn't come from Small." or "6 is much more likely from Small.")
  *   **Point:** Establish fluency in Bayesian updating with indexical information ("I am chip #6").

  ### **0:20 – 0:45 | Round 2: The Split (Blank Chips)**
  *   **Setup:** "Same two bags. Same coin flip. But now, **all chips are blank.** No numbers."
  *   **Action:** Flip coin. Draw a chip. Hold up a **blank chip**.
  *   **The Trap:** There is no indexical evidence. The evidence is identical under both hypotheses ($P(Blank|Small) = 1$, $P(Blank|Large) = 1$).
  *   **Betting:** "Write your bet privately. Small or Large? How many tokens?"
  *   **Staging the Conflict (Crucial):**
      1.  Collect the bets silently.
      2.  **Do not reveal the result yet.**
      3.  Ask: "Show of hands, who bet on Small?" (Count them). "Who bet on Large?" (Count them).
      4.  *Expected Outcome:* You will likely get a split. Some will say 50/50 (SSA intuition). Some will say Large (SIA intuition).
      5.  **If everyone agrees (e.g., all 50/50):** You must intervene. Say: "I want to challenge the 50/50 group. Imagine we run this experiment 1,000 times. In how many of those runs does a conscious observer hold a chip from the Large bag vs the Small bag?" (This prompts the SIA reasoning).
      6.  **If everyone agrees (e.g., all Large):** Challenge them. "Why? The coin was fair. The chip looks the same. What evidence changed?" (This prompts SSA reasoning).
  *   **Discussion (5 mins):** Let them argue. Do not validate either side. Write their arguments on the board under "Reasoning."
      *   *SSA Argument:* "The coin was 50/50. The chip tells us nothing. Credence should remain 50/50."
      *   *SIA Argument:* "There are 1000 chips in one bag and 10 in the other. I am more likely to be *any* specific chip from the larger set. Existence is evidence."
  *   **Reveal:** Reveal which bag you actually used. (It doesn't matter for the theory, but matters for the tokens). Pay out tokens.

  ### **0:45 – 1:00 | Round 3: The Presumptuous Philosopher**
  *   **Setup:** "We leave the classroom. We talk about the Universe."
  *   **Board:** Write two hypotheses:
      *   $H_1$: The universe contains $10^{10}$ observers (10 billion).
      *   $H_2$: The universe contains $10^{20}$ observers (100 billion billion).
  *   **Premise:** "Prior to looking out the window, assume $H_1$ and $H_2$ are equally likely (50/50) based on pure physics."
  *   **Evidence:** "I exist. I am an observer." (This is the 'Blank Chip' from Round 2).
  *   **Betting:** "Based *only* on the fact that you exist, bet your tokens on $H_1$ or $H_2$."
  *   **The Crunch:** If they followed the 'Large' logic from Round 2 (SIA), they must bet overwhelmingly on $H_2$ (odds of $10^{10}:1$).
  *   **Discussion:** "Are you really willing to bet your tokens that the universe is huge, without looking at a telescope? Just because you exist?"
  *   **Reveal:** No reveal is possible here. This is the metaphysical cliffhanger.

  ### **1:00 – 1:30 | Debrief & Theory Mapping**
  *   **Naming the Assumptions:**
      *   **Round 1:** Standard Bayesianism.
      *   **Round 2 (50/50 bettors):** You used the **Self-Sampling Assumption (SSA)**. You treat yourself as a random sample from the *actual* observers. Since the coin was fair, the probability remains 50/50.
      *   **Round 2 (Large bettors):** You used the **Self-Indication Assumption (SIA)**. You treat your existence as evidence. Worlds with more observers are more likely to contain *you*.
  *   **The Presumptuous Philosopher (Round 3):**
      *   Explain that Round 3 is the *reductio ad absurdum* of SIA proposed by Ken Olum (2002).
      *   If SIA is true, you can be a priori certain the universe is vast. Most physicists find this "presumptuous."
      *   If SSA is true, you avoid this, but...
  *   **The Doomsday Argument (Link to Round 1):**
      *   Ask: "In Round 1, if you drew #6, you favored the Small Bag. If we apply that to human history: If you are a random human, and you find yourself alive early in history (low number), does that suggest the total number of humans will be small?"
      *   This is the **Doomsday Argument** (Carter, Leslie). It relies on SSA.
  *   **Sleeping Beauty (Brief Mention):**
      *   SSA maps roughly to "Halfers" (focus on the coin flip chance).
      *   SIA maps roughly to "Thirders" (focus on the number of awakenings/observer moments).
  *   **Conclusion:** "There is no consensus. You have to choose which intuition you are willing to sacrifice: The idea that physics determines probability (SSA) or the idea that existence isn't evidence (Anti-SIA)."

  ---

  ## **3. Troubleshooting: What Will Go Wrong**

  ### **Problem 1: The "Trivial 50/50" Deflation**
  *   **Symptom:** In Round 2, a confident student says, "This is obvious. Coin flip is 50/50. Chips are blank. It's 50/50. Why are we betting?" The room agrees, and the tension vanishes.
  *   **Fix:** Do not argue logic. Argue **frequency**.
  *   **Script:** "Okay, suppose I am a god. I create 1,000 copies of this classroom. In 500 of them, I use the Small Bag. In 500, I use the Large Bag. I hand out chips to every student in every room. I gather all the students with chips into one giant hall. I pick one of *you* at random. Which bag did your chip come from?"
      *   This forces them to see that 99% of the chips in the hall come from the Large Bag. If they identify as "a random chip holder," they must switch to Large.

  ### **Problem 2: Counting the Room**
  *   **Symptom:** A student says, "There are 14 of us in this room. So the population is 14. The bag size doesn't matter."
  *   **Fix:** Clarify the **Reference Class**.
  *   **Script:** "You are not a student in this room right now. In this thought experiment, you are a *soul* waiting to be born. The bag size determines how many bodies are available for you to inhabit. Does the number of available bodies change the odds that you get a body at all?"

  ### **Problem 3: Logistics Lag**
  *   **Symptom:** Counting tokens or chips eats up 10 minutes.
  *   **Fix:** Appoint two "Auditors" (students) to handle token tallying during the discussion phases. For the chips, have Bag S and Bag L pre-weighed or pre-counted in clear containers *before* putting them in the opaque bags, so you know you have the right amount without counting in front of them.

  ---

  ## **4. Limitations: What This Activity Cannot Do**
  *   **The Reference Class Problem:** The activity assumes "You = A Chip." It doesn't capture the difficulty of defining *what* counts as an observer (e.g., do chimps count? AI? Brains in vats?). You must supply this in the debrief.
  *   **The "Why" of SIA:** The activity makes SIA look like a frequency claim (more chips = more likely to pick one). It doesn't capture the deeper metaphysical claim of SIA (that possible observers exert a probabilistic pull). You need to articulate that distinction in the debrief.
  *   **Sleeping Beauty Nuance:** The mapping to Sleeping Beauty is imperfect. Sleeping Beauty involves memory loss and centered time; this activity is spatial/population-based. Be careful not to say they are identical, only that they share the *structural* tension.
  *   **The "Existence" Leap:** In Round 2, they physically exist in the room. In Round 3, "existence" is abstract. Students may resist the move from "I am holding a chip" to "I am conscious." You need to bridge that gap verbally: "Your consciousness is the chip. The universe size is the bag."

  ## **5. Instructor Cheat Sheet (The Theory)**
  *   **SSA (Self-Sampling Assumption):** $P(H|Obs) = P(Obs|H)P(H)$. If $P(Obs|H)$ is 1 for both (I exist in both worlds), probability doesn't shift. Favors Small Universe in Round 3. Leads to Doomsday Argument.
  *   **SIA (Self-Indication Assumption):** $P(H|Obs) \propto N_{obs}(H) \times P(H)$. Weight by number of observers. Favors Large Universe in Round 3. Leads to Presumptuous Philosopher.
  *   **Presumptuous Philosopher:** If SIA is true, we don't need telescopes to know the universe is big. Our existence proves it. This seems absurd, suggesting SIA might be false.
  *   **Doomsday Argument:** If SSA is true, finding ourselves early in human history suggests the total number of humans will be small (humanity ends soon). This seems absurd, suggesting SSA might be false.
  *   **The Stalemate:** We are stuck between a Presumptuous Philosopher (SIA) and a Doomsday Prophet (SSA).

  ## **6. Final Tip for the "Split"**
  To guarantee the Round 2 disagreement surfaces, **seed the room**. Before class, quietly tell two students: *"Trust the coin flip, ignore the bag size."* Tell two other students: *"Think about how many chips are in the bag."* This ensures you have at least one vocal advocate for each side when the silence hits.
