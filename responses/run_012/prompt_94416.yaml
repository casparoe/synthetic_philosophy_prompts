prompt: |-
  Hey, so I'm a junior in high school and I'm in this weird interdisciplinary class that's half history, half philosophy of science, and we're doing a unit on why historians disagree about causes. Our teacher handed out a page from John Stuart Mill's A System of Logic and told us to figure out what he's even asking, and I'm stuck. The sentence I keep rereading is where he says the question is "Whether moral and social phenomena are really exceptions to the general certainty and uniformity of the course of nature" and then asks how far the methods that worked for physics can be made instrumental to forming "a similar body of received doctrine in moral and political science." Is he asking whether history has laws, or whether we could ever find them, or something else entirely? He also has chapters called "Of Plurality of Causes, and of the Intermixture of Effects" and "Of the Deductive Method," and from what I can piece together from the summaries, in the first one he argues that the same sort of effect can come from totally different causes, which wrecks the method where you look for what all the cases have in common, and that in most real situations effects are mixtures of several causes acting at once, so the method of comparing a case with and without one factor only works in special set-ups. In the second one he says that since you can't run experiments on whole societies, you have to reason downward from general laws and then check whether the deduced consequences match the historical record.

  What I don't get is how these two chapters fit together, and specifically what Mill would say about a case where several causes each look like they were enough on their own. My teacher's example was a revolution that maybe would've happened anyway because of the food shortage, and also would've happened anyway because of the army's mutiny, and also because of the king's blundering. My friend calls this "causal slack" — the idea that a historical outcome can have more sufficient causes than it strictly needed, so taking one away wouldn't have changed anything, and I guess the interesting question is how much slack different events have. Does Mill's distinction between there being many causes for a type of event and one event having several redundant sufficient causes actually hold up, or is that just a verbal difference? And if historical outcomes are overdetermined like that, doesn't it wreck his plan of checking a deduction against the record, since alot of seperate deductions would all predict the same outcome and the record can't tell them apart? I'd love a plain-language walkthrough of the passage and then an honest take on whether his framework has room for overdetermination, or whether he'd just have to say the redundant causes were really parts of one big total cause. Also if you can, explain what work the phrase "intermixture of effects" is doing that "plurality of causes" isn't already doing, because I honestly can't tell them apart. And please don't just give me the standard "Mill says causation is regular succession" thing — I need the actual mechanics of his argument here.
