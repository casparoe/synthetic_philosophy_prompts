answer: |-
  **Setting:** *The courtyard of the Merchants' Guild in Ujjayini. Evening. Oil lamps flicker against the stone pillars. Two scholars sit on woven mats, a bowl of rice between them. The guild masters stand in the shadows, waiting.*

  **Characters:**
  *   **Vātsya:** A Naiyāyika, sharp-eyed, deliberate.
  *   **Someshvara:** A Bhāṭṭa Mīmāṃsaka, calm, resonant voice.

  **Someshvara:** The guild masters ask a simple question, Vātsya. For twenty years, they heard the caravan-master speak. They acted. They prospered. Did they know the valley existed, or did they merely guess? I say they knew. When the master said, "Water lies beyond the ridge," the cognition arose in the merchants' minds. That cognition was valid from its birth. *Svataḥ prāmāṇya.* Validity is intrinsic. Like light, it reveals itself and the object. Unless there was a specific reason to doubt—the master known as a liar, the words contradictory—the cognition stands as knowledge.

  **Vātsya:** And I say they believed, but did not know. Until the water was tasted, the cognition was suspect. Validity is extrinsic, *parataḥ prāmāṇya*. A cognition is like a seed; you cannot know it is a rice seed until it sprouts. The merchants' success confirms the truth, but success comes *after*. At the moment of hearing, they lacked the certification required for knowledge. They acted on trust, not *pramā*.

  **Someshvara:** You demand a second cognition to validate the first. And a third to validate the second? If every cognition requires another to certify it, we fall into an infinite regress. Nothing would ever be known. We would starve waiting for confirmation that the rice before us is not poison. The world functions because cognition is presumptively valid. Doubt requires grounds, Vātsya. Did the merchants have grounds to doubt the master?

  **Vātsya:** They had grounds to inquire. You confuse the *absence of doubt* with the *presence of knowledge*. Just because I do not suspect poison does not mean I know it is rice. I must test it. The guild asks if they *knew*. If a man walks on a snake thinking it a rope, he succeeds in crossing the path, but he did not know it was a rope. He was lucky. The merchants' success proves the master was reliable, yes, but it does not retroactively turn their initial trust into knowledge. It turns it into verified belief.

  **Someshvara:** You reduce testimony, *śabda*, to inference. You think the merchants reasoned: "The master is reliable, therefore his words are true." That is not how language works. When I say "fire," you do not infer fire from the vibration of my throat. You apprehend the meaning directly. Testimony is an independent *pramāṇa*. The words themselves conveyed the valley. The success of the action merely removed potential obstacles; it did not create the validity.

  **Vātsya:** But human testimony is not the Veda, Someshvara. Your school holds the Veda is authorless, eternal, and therefore inherently valid. This caravan-master is a man. He sleeps, he errs, he dies. To treat his words as intrinsically valid is to extend the privilege of the sacred to the profane without warrant. For human speech, reliability must be established. We infer the truth of the statement from the credibility of the speaker. That makes testimony a species of inference, not a separate source.

  **Someshvara:** Even if the speaker is human, the cognition generated in the listener is the same. Consider the fat Devadatta. He does not eat by day. Yet he remains fat. We know he eats by night. This is postulation, *arthāpatti*. We do not infer it; we posit it to resolve the anomaly. Similarly, here: The master speaks, the merchants act, the result follows. Where is the falsehood? You speak of the snake and the rope. But suppose the man crosses the path a hundred times, and every time the "rope" behaves exactly as a rope should. It never strikes. It never moves. At what point does your "luck" become "knowledge"? If you say never, you make knowledge impossible for anything not directly perceived.

  **Vātsya:** I say it becomes knowledge when the verification is complete. But notice the guild's peculiar trap. They cannot check the report except by acting on it, and the success is described in the very terms of the report. The master says, "Water is here." They dig. They find wet earth. They call it water. But "water" is defined by the master's report. They are circling within his language.

  **Someshvara:** And yet, the thirst is quenched. The practical efficacy, *pravṛtti-sāmarthya*, is real.

  **Vātsya:** Efficacy is not truth. A placebo quenches anxiety, not disease. My point is this: You rely on the absence of defeat. You argue that since no report failed, the knowledge stands. You use non-apprehension, *anupalabdhi*. You say, "We do not apprehend any falsehood, therefore there is none."

  **Someshvara:** Precisely. If there were a pot here, I would see it. I do not see it. Therefore, there is no pot. This is a valid means of knowledge. Similarly, if the master were lying, falsehood would have been apprehended by now. It was not. Therefore, he was not lying.

  **Vātsya:** *Anupalabdhi* requires the conditions of apprehension to be present. To know there is no pot here, I must be in the light, with eyes open, looking at the spot. Did the merchants look for lies? They never went to the valley. They never met the master's sources. The conditions for apprehending failure were absent. You cannot claim knowledge from absence when you never looked for presence. You are mistaking ignorance of defeat for knowledge of victory.

  **Someshvara:** *[Pauses, tracing a line in the dust]* You press hard on the conditions of looking. But consider the burden. If validity must be established externally for every cognition, who establishes the establisher? If I use perception to confirm testimony, what confirms perception? If you say perception is self-validating, you concede my point for at least one *pramāṇa*. Why deny it to testimony?

  **Vātsya:** Perception forces itself upon us. I cannot choose not to see the fire before me. Testimony requires me to accept the speaker's authority. That acceptance is a mental act subject to error. But I will concede this: If the chain of successful action is unbroken for a generation, the *probability* approaches certainty. For practical life, *vyavahāra*, they knew. But for strict epistemology, *pramāṇa-śāstra*, they held a justified belief that awaited final confirmation.

  **Someshvara:** And there lies the joint of our disagreement. You separate the cognition from its validity. I say they are born together. But let me press you on your "verification." You say they needed to check the master. Suppose they sent a scout. The scout returns and says, "The valley is as described." Now you have two testimonies. Does the second validate the first? Or do you now need to verify the scout?

  **Vātsya:** If the scout is perceived to have returned, and his marks of travel are seen...

  **Someshvara:** Then you rely on perception. But perception of the scout is not perception of the valley. You are still relying on testimony, merely layered. You wish to ground everything in perception, Vātsya, but most of what we know—dharma, history, distant valleys—comes from words. If you make testimony subordinate to inference, you weaken the foundation of society. Trust becomes a calculation rather than a default.

  **Vātsya:** And if you make trust a default, you invite charlatans. The Veda is safe because it is authorless. The caravan-master is safe only because he was lucky enough to be right. What if he had been wrong? Would the merchants have "known" falsely?

  **Someshvara:** If he had been wrong, the cognition would have been defeated by a stronger cognition later. That is how *svataḥ prāmāṇya* works. It is not infallibility; it is presumptive validity. The merchants were rational to trust. To demand prior proof of reliability before accepting any report is to demand we know the future before we act.

  **Vātsya:** *[Leans forward]* Here is a distinction you may have missed, Someshvara. You speak of the cognition's validity. I speak of the *source's* reliability. In the case of the Veda, the source is beyond critique. In the case of the master, the source is empirical. The guild's situation is unique because the verification loop is closed. They cannot step outside the master's language to check the master.
  If I say, "I know the path," and you walk it and find it leads nowhere, my knowledge is defeated. But if you walk it only because I told you where to step, and you define "path" by where I told you to step, we are not in the realm of knowledge anymore. We are in the realm of coordination.

  **Someshvara:** Coordination that yields survival. Is that not the aim of knowledge? To navigate the world?

  **Vātsya:** To navigate the world *as it is*, not as we are told it is. But I will refine my position. If the successful action is repeatable and predictable without fail, the inference of reliability becomes so strong that it mimics perception. The merchants did not know the valley initially. But after twenty years, they know the *master*. And knowing the master, they know the valley. The knowledge shifted from the object to the source, and back again.

  **Someshvara:** So you admit that after twenty years, they know.

  **Vātsya:** They know the master is reliable. They infer the valley.

  **Someshvara:** And I say they knew the valley all along, because the cognition was never defeated. The difference is this: You think the light of knowledge turns on only after the switch is checked. I say the light is on unless the bulb is broken.
  But consider this, Vātsya. You say they inferred the valley from the master's reliability. But reliability is a universal property established by particular instances. They had no particular instances of *seeing* the valley to establish the universal of his reliability. They only had instances of *success*. You are building an inference on a foundation of... what? Pragmatic success?

  **Vātsya:** *[Smiles faintly]* Yes. Pragmatic success. Perhaps, Someshvara, our schools converge here in the courtyard, if not in the texts. You call it intrinsic validity未被 defeated. I call it extrinsic validity confirmed by action. In the case of this guild, the action is continuous. The confirmation is perpetual.

  **Someshvara:** So the status of the cognition changes over time?

  **Vātsya:** For me, yes. It moves from belief to knowledge as the chain of success lengthens. For you, it remains knowledge throughout, merely unchallenged.

  **Someshvara:** Then the guild masters can sleep. Whether the light was on from the start, or switched on by the walking, the path is illuminated now.

  **Vātsya:** They can sleep. But tell them this: If the master ever speaks of a place they cannot walk to, where action cannot confirm the word, then my doubt returns. And your *anupalabdhi* will fail, for there will be no opportunity to apprehend defeat.

  **Someshvara:** And I shall tell them: Even then, unless there is a reason to doubt, the word stands. For without that trust, no journey begins.

  **Vātsya:** Then we agree on the journey, if not the map.

  **Someshvara:** The map is the journey, Vātsya.

  **Vātsya:** Let us eat. The rice is hot. I know it, because I see the steam.

  **Someshvara:** And I know it, because I see the rice. The validity is in the eating.

  *They bow to one another. The guild masters step forward from the shadows, having heard enough to justify their past, if not their future.*
