  # The Condorcet Instrument: A Decision Tree for Jury Theorem Positions

  **Instructions:** Begin at the root (Node 1). At each internal node, read the claim and decide whether you **Accept** or **Reject** it based on your own philosophical commitments, not on what you think the theorem requires. Follow the branch corresponding to your answer until you reach a leaf. Record the leaf position and the path taken.

  ### Internal Nodes

  **Node 1 (Truth Independence):** "The collective decision concerns a matter of fact with a correct answer independent of the group's opinion."
  *   **Reject:** Go to Leaf A.
  *   **Accept:** Go to Node 2.

  **Node 2 (Shared Interest):** "Voters are motivated primarily by a shared interest in identifying that correct answer rather than by conflicting preferences over the outcome."
  *   **Reject:** Go to Leaf B.
  *   **Accept:** Go to Node 3.

  **Node 3 (Competence Threshold):** "The average individual competence (probability of voting for the truth) is strictly greater than one-half."
  *   **Reject:** Go to Leaf C.
  *   **Accept:** Go to Node 4.

  **Node 4 (Competence Uniformity):** "Competence must be uniform across voters rather than merely averaging above one-half for the theorem to hold normatively."
  *   **Accept:** Go to Leaf D.
  *   **Reject:** Go to Node 5.

  **Node 5 (Conditional Independence):** "In real-world bodies, voter errors are statistically independent once you condition on the correct answer."
  *   **Reject:** Go to Node 6.
  *   **Accept:** Go to Node 7.

  **Node 6 (Correlation Fatality):** "Systematic correlation among voters (e.g., shared evidence or training) renders the theorem inapplicable to existing institutions rather than merely shrinking the effective group size."
  *   **Accept:** Go to Leaf E.
  *   **Reject:** Go to Leaf F.

  **Node 7 (Sincerity):** "Voters cast ballots sincerely rather than strategically or performatively."
  *   **Reject:** Go to Leaf F. *(Note: Strategic voting breaks the independence/competence link, pushing you toward Design or Skepticism.)*
  *   **Accept:** Go to Node 8.

  **Node 8 (Limiting Claim):** "The theorem's significance rests on the limiting claim that large groups become nearly infallible as size increases."
  *   **Reject:** Go to Leaf G.
  *   **Accept:** Go to Node 9.

  **Node 9 (Individual Deference):** "The majority being probably right entails that an individual dissenter is epistemically required to defer to the majority verdict."
  *   **Reject:** Go to Leaf H.
  *   **Accept:** Go to Node 10.

  **Node 10 (Procedure):** "Simple majority rule is the only aggregation procedure compatible with the theorem's logic."
  *   **Reject:** Go to Leaf I.
  *   **Accept:** Go to Leaf J.

  ---

  ### Leaves (Positions)

  **Leaf A: The Proceduralist**
  *   **Position:** The theorem has no bearing on legitimacy because legitimacy is procedural.
  *   **Awkward Commitment:** You must defend the fairness of a vote even if you know for a fact it produced the wrong outcome.

  **Leaf B: The Positivist**
  *   **Position:** The theorem is a fact about information aggregation with no normative upshot whatsoever.
  *   **Awkward Commitment:** You treat the theorem as mathematically sound but politically inert, like a law of thermodynamics applied to a parliament.

  **Leaf C: The Diversity Advocate**
  *   **Position:** The theorem's real lesson concerns the diversity of the group rather than the competence of its members.
  *   **Awkward Commitment:** You must argue that a group of less competent but diverse voters outperforms a group of experts, even when the experts are individually more likely to be right.

  **Leaf D: The Technocrat**
  *   **Position:** The theorem argues for weighting votes by competence instead of counting them equally.
  *   **Awkward Commitment:** You are committed to disenfranchising less competent citizens to preserve the mathematical conditions of the theorem.

  **Leaf E: The Skeptic**
  *   **Position:** The theorem is true but empty because its assumptions are never jointly satisfied.
  *   **Awkward Commitment:** You accept the mathematics but regard it as useless for analyzing any actual human institution.

  **Leaf F: The Institutional Designer**
  *   **Position:** The theorem is a design manual for institutions rather than a description of existing ones.
  *   **Awkward Commitment:** You believe we can engineer social structures to eliminate correlated errors, despite the ubiquity of shared culture and information.

  **Leaf G: The Fallibilist**
  *   **Position:** The theorem supports the weaker claim that adding competent voters never hurts, but not that they become infallible.
  *   **Awkward Commitment:** You rely on the monotonicity of the function while abandoning the convergence that makes the theorem famous.

  **Leaf H: The Conscientious Epistemic Democrat**
  *   **Position:** The theorem vindicates majoritarian democracy, but not individual deference.
  *   **Awkward Commitment:** You believe the group is almost certainly right, yet you maintain that the individual dissenter is rational to remain unconvinced.

  **Leaf I: The Institutional Pluralist**
  *   **Position:** The theorem vindicates epistemic aggregation, but not necessarily via voting.
  *   **Awkward Commitment:** You must accept that prediction markets or weighted algorithms might satisfy the theorem's conditions better than democratic elections.

  **Leaf J: The Epistemic Democrat**
  *   **Position:** The theorem vindicates majoritarian democracy as a truth-tracking device.
  *   **Awkward Commitment:** You are committed to the view that majority rule is more than a truce; it is an epistemic engine that obligates losers to accept the winner's truth.

  ---

  ### Diagnostic Notes on Logical Space

  **Incoherent Combinations:**
  *   **Accept Node 5 (Independence) AND Accept Node 6 (Correlation Fatal):** This is a contradiction. If errors are independent, correlation cannot be fatal. This combination indicates a misunderstanding of the conditional probability structure.
  *   **Accept Node 1 (Truth) AND Reject Node 2 (Interest) AND Leaf J (Epistemic Democrat):** You cannot claim the theorem vindicates democracy (Leaf J) if you deny voters share an interest in the truth (Node 2), as the theorem collapses into game theory without common interest.

  **Unattractive Combinations:**
  *   **Accept Node 8 (Limiting Claim) AND Reject Node 9 (Deference):** This yields Leaf H. It is epistemically unstable: if you believe the group is *nearly infallible* (Node 8), claiming you are not required to defer (Node 9) suggests you trust your own noise over the group's signal without justification.
  *   **Accept Node 3 (Competence) AND Reject Node 7 (Sincerity) AND Leaf F (Designer):** This suggests you believe institutions can be designed to ensure sincerity. While not logically impossible, it is historically unattractive given the prevalence of strategic voting in designed mechanisms.

  **Indistinguishable Leaves:**
  *   **Leaf A (Proceduralist) vs. Leaf B (Positivist):** Both conclude the theorem offers no normative guidance for democracy.
      *   *Distinction:* Leaf A denies the ontology (Node 1: No independent truth in politics). Leaf B accepts the ontology but denies the bridge to legitimacy (Node 2: No shared interest).
      *   *Test Case:* **A referendum on a technical question in which most voters take their cue from a single trusted source.**
          *   The Proceduralist says the vote is legitimate because the process was fair, regardless of the cue.
          *   The Positivist says the vote is merely an aggregation of cues with no truth-tracking value because the independence assumption failed (Node 5), rendering the theorem silent.

  ---

  ### Tie-Breaker Case Mapping

  Use these cases to test specific branches if you find yourself hesitating at a node.

  1.  **A twelve-person criminal jury:**
      *   *Tests:* **Node 3 (Competence)** and **Node 8 (Limiting Claim).**
      *   *Usage:* If you believe the theorem applies here, you must accept that 12 people are enough for convergence (rejecting the need for infinite $N$) and that jurors are competent (>0.5). If you think 12 is too small for the "infallibility" claim, move to Leaf G (Fallibilist).

  2.  **A departmental hiring vote in which everyone has read the same file:**
      *   *Tests:* **Node 5 (Conditional Independence).**
      *   *Usage:* This is the canonical case for common evidence. If you believe this violates the theorem's assumptions, Reject Node 5. If you believe the private interpretation of the file preserves independence, Accept Node 5.

  3.  **A prediction market on an election:**
      *   *Tests:* **Node 10 (Procedure)** and **Node 2 (Shared Interest).**
      *   *Usage:* Markets aggregate information without majority voting. If you think this satisfies the spirit of the theorem better than voting, Reject Node 10 (Leaf I). If you think profit motives destroy the "shared interest in truth," Reject Node 2 (Leaf B).

  4.  **A majority vote among five language models on a factual question:**
      *   *Tests:* **Node 5 (Independence)** and **Node 6 (Correlation Fatal).**
      *   *Usage:* Shared training data creates high correlation. If you think this makes the vote useless, Accept Node 6 (Leaf E). If you think model architecture differences preserve enough independence to shrink error, Reject Node 6 (Leaf F).

  5.  **A citizens' assembly that deliberates for a weekend and then votes:**
      *   *Tests:* **Node 7 (Sincerity)** and **Node 2 (Shared Interest).**
      *   *Usage:* Deliberation is intended to align interests and ensure sincerity. If you believe it succeeds, Accept Node 7. If you believe deliberation merely creates groupthink (correlation), Reject Node 5.

  6.  **A referendum on a technical question in which most voters take their cue from a single trusted source:**
      *   *Tests:* **Node 5 (Independence)** and **Leaf A vs. Leaf B.**
      *   *Usage:* This creates a "herding" correlation. It forces the choice between Proceduralist (process matters, cues don't invalidate legitimacy) and Positivist/Skeptic (cues invalidate the math).
