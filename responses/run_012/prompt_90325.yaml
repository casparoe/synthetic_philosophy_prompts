prompt: |-
  I'm a software engineer and I own the "giving" feature in our app — the round-up-your-purchases thing, where we pool the money and feature a handful of charities every quarter, and users can pick which one their round-ups go to. Right now we pick the featured ones by vibes plus whatever has the cleanest numbers on the charity-evaluator sites, and its been bugging me, because I've been reading about effective altruism and the pushback against it and I think our process is basically a case study in everything the critics complain about. So I want to turn the critiques into an actual decision procedure my team can run, since none of us has a philosophy background and we're not gonna go read a stack of papers.

  The complaints I keep running into, roughly: (1) measurability bias — we fund whatever comes with a nice number attached and quietly skip stuff that's hard to quantify even if it might matter more; (2) the "earning to give" advice, where the move is take the high-paying job and write a check, which people say lets you off the hook and doesn't change anything real; (3) the institutional one — the orgs doing the evaluating are kind of grading their own homework, so a charity can look amazing in the spreadsheet and still be a mess internally, and nobody outside can really check.

  Here's what I need. A procedure we can actually run every quarter, on the shortlist, in about an hour, by people who don't know the jargon. Ordered questions, what counts as a good-enough answer to each, where it just stops with a no, and where it has to hand the call to a human because it's a values question and not a facts question. Assume we can't get real numbers for a lot of things — plenty of our candidates don't have a trial and never will — so the procedure has to say what to do when the number isn't there, instead of just dropping those. Label which of the three complaints each step is meant to address, so I can tell if we're just paying lip service. And be honest about which steps are real reasoning vs. me dressing up a gut call as a procedure.

  Two constraints: legal will kill anything that looks like political advocacy or lobbying, so that's off the table no matter how good it is; and our community manager picks the final list, with our CEO able to veto, which he has done.

  Then run it on these three, which are close to what our shortlist actually looks like: (A) a global-health org with published trials and a clean cost-per-life-saved number; (B) a small mental-health org in a region with no good data, so the numbers are basically guesswork but the need looks huge; (C) a well-known org with a slick site, big claims, and impact figures we can't independently verify, but it's popular with our users and the CEO loves it. One of these is the one I personally want to fund, so don't be surprised if the procedure tells me I'm wrong — I'd rather find out now.

  Also tell me what the procedure can't do, where it'll produce garbage, and whether any of the three critiques don't actually apply to what we're doing (I suspect at least one of them doesn't map onto us at all).

  Write it in American English, and skip the citations and reading lists — I can't look anything up anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Software engineer owning a "giving" feature (round-ups for charity).
      *   **Problem:** Current selection process ("vibes" + "clean numbers") feels vulnerable to Effective Altruism (EA) critiques.
      *   **Goal:** Create a practical, 1-hour decision procedure for the team to run quarterly on a shortlist.
      *   **Constraints:**
          *   No philosophy background/jargon.
          *   Must handle missing data (not just drop hard-to-measure stuff).
          *   Must label which EA critique each step addresses (Measurability Bias, Earning-to-Give/Disengagement, Institutional/Insider Bias).
          *   Must distinguish real reasoning vs. dressed-up gut calls.
          *   Legal constraint: No political advocacy/lobbying.
          *   Governance: Community Manager picks final list, CEO can veto.
          *   Output: American English, no citations/reading lists.
      *   **Task:**
          1.  Design the procedure.
          2.  Run the procedure on three specific candidates (A, B, C).
          3.  Analyze the procedure's limitations and the applicability of the critiques.
      *   **Tone:** Honest, pragmatic, engineering-focused, slightly self-critical (admitting where it's just gut feeling).

  2.  **Deconstruct the EA Critiques & Map to Constraints:**

      *   *Critique 1: Measurability Bias.* (Funding only what's easy to count).
          *   *Fix:* Explicitly allow qualitative evidence. Require a "Story + Stat" balance. Don't auto-reject missing numbers.
      *   *Critique 2: Earning-to-Give/Disengagement.* (Writing checks vs. changing systems).
          *   *Fix:* This is tricky for a donation app. We *are* writing checks. The critique here is usually about *systemic change* vs. *band-aid*. For a corporate app, this translates to: Are we funding symptoms or root causes? Are we allowing users to feel good without learning anything?
          *   *Constraint Check:* The prompt says "No political advocacy." This limits systemic change funding. I need to acknowledge this tension. The critique might not fully apply because the app *is* essentially "earning to give" infrastructure. I need to be honest about this.
      *   *Critique 3: Institutional/Insider Bias.* (Evaluators grading homework, internal messes).
          *   *Fix:* Look beyond the impact report. Check governance, overhead (within reason), and transparency. Acknowledge the "slick site" bias.

  3.  **Drafting the Procedure (The "Quarterly Charity Vetting Protocol"):**

      *   *Timebox:* 1 Hour.
      *   *Participants:* Engineer (User), Community Manager, maybe one other.
      *   *Structure:* Pass/Fail gates + Scoring.
      *   *Step 1: Legal & Basic Hygiene (The "Don't Get Sued" Gate).* Addresses Institutional Bias (basic legitimacy).
      *   *Step 2: The "Missing Number" Test.* Addresses Measurability Bias. If no number, what's the proxy?
      *   *Step 3: The "Band-Aid vs. Bridge" Check.* Addresses Earning-to-Give/Systemic critique. (Within legal bounds).
      *   *Step 4: The "Black Box" Check.* Addresses Institutional Bias. Who runs it?
      *   *Step 5: The "Gut Check" Handoff.* Acknowledging values.

      *Refining the "Earning to Give" critique:* The prompt mentions "earning to give" advice lets you off the hook. For a donation app, the critique is that we facilitate "check-writing" without engagement. To address this, the procedure should favor charities that educate donors or show tangible connection, rather than just black-box efficiency.

      *Refining the "Political" constraint:* We can't fund lobbying. But we can fund organizations that address root causes (e.g., policy research that isn't lobbying, or direct aid that reduces the *need* for policy). I need to be careful not to suggest funding advocacy.

  4.  **Running the Procedure on Candidates A, B, C:**

      *   *Candidate A (Global Health, Trials, Clean Numbers).*
          *   Pros: Measurable.
          *   Cons: Might be "too easy," ignores local context.
          *   Verdict: Passes most, fails "Bridge" check if it's purely band-aid.
      *   *Candidate B (Mental Health, No Data, High Need).*
          *   Pros: Addresses hard-to-measure need.
          *   Cons: Fails "Clean Numbers" bias.
          *   Verdict: Needs the "Missing Number" protocol.
      *   *Candidate C (Slick, Popular, CEO Love, Unverified).*
          *   Pros: User engagement.
          *   Cons: Institutional bias risk, CEO veto risk.
          *   Verdict: High risk on "Black Box."

  5.  **Analyzing the Procedure's Limits & Critique Applicability:**

      *   *Limits:* Can't verify fraud. Can't solve the "CEO Veto" problem (that's power, not logic). Can't truly solve "Earning to Give" because the product *is* check-writing.
      *   *Critique Applicability:*
          *   Measurability: Definitely applies.
          *   Institutional: Definitely applies.
          *   Earning-to-Give: *Doesn't really apply* in the standard sense. The app *is* a tool for people who want to write checks. The critique is more about *what* the checks buy (status quo vs. change). I need to highlight this distinction.

  6.  **Writing - Section by Section (incorporating "Honesty" requirement):**

      *   *Intro:* Acknowledge the engineering mindset.
      *   *The Protocol:* Step-by-step, time-boxed, labeling the critiques.
      *   *The "Gut Check" Admission:* Explicitly state where the procedure stops and intuition begins.
      *   *The Run-Through:* Apply A, B, C.
      *   *The Meta-Analysis:* What doesn't work? Which critiques are red herrings?

  7.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I label the critiques? Yes, I'll use tags like `[Critique 1: Measurability]`.
      *   *Check:* Is it under an hour? Yes, keep steps tight.
      *   *Check:* Did I handle the "No Numbers" constraint? Yes, Step 2 needs a specific workaround for qualitative evidence.
      *   *Check:* Legal constraint? Step 0 needs to be hard on lobbying.
      *   *Check:* CEO Veto? I need to acknowledge the procedure can't stop a veto, but can arm the Community Manager with data to push back.
      *   *Check:* Tone? Keep it dry, practical, "engineer-to-engineer."
      *   *Check:* The "Earning to Give" critique mapping. I need to be careful here. The prompt says critics say it "lets you off the hook." For a corporate app, the parallel is "Does this charity just make users feel good without fixing the problem?" I will frame Step 3 around "Depth of Impact" rather than "Political Change" to stay legal.

  8.  **Final Polish:** Ensure American English. Remove citations. Ensure the distinction between "Procedure" and "Gut Call" is clear. (Self-correction: Make sure I explicitly state which critique maps to which step).

      *Wait, one nuance:* The prompt asks me to be honest about "dressing up a gut call as a procedure." I need to have a specific section or callout for this. I'll integrate it into the steps where subjective judgment is unavoidable.

      *Another nuance:* The "Earning to Give" critique. The prompt says: "the move is take the high-paying job and write a check, which people say lets you off the hook and doesn't change anything real." Since my product *is* facilitating writing checks, this critique is existential. I need to admit that the procedure can't fully solve this, but can mitigate it by favoring orgs that do more than just distribute cash (e.g., build capacity).

      *Let's build the steps.*
      1.  Compliance (Legal).
      2.  The "No Number" Proxy (Measurability).
      3.  The "Black Box" Audit (Institutional).
      4.  The "Band-Aid" Test (Earning to Give/Systemic).
      5.  The "Veto Prep" (Governance).

      *Run on A, B, C.*
      A: Passes 1, 2, 3. Fails 4 (maybe).
      B: Passes 1. Fails 2 (needs proxy). Passes 4.
      C: Passes 1. Fails 3. Passes 5 (CEO love).

      *Critique Analysis:*
      1. Measurability: Real.
      2. Earning to Give: Partially irrelevant (we are a check-writing tool), but relevant on *impact depth*.
      3. Institutional: Real.

      *Okay, ready to write.*
answer: |-
  Here is the decision procedure, the run-through on your three candidates, and the honest breakdown of where this logic holds and where it breaks.

  ### The Quarterly Charity Vetting Protocol (Q-CVP)

  **Timebox:** 60 Minutes
  **Participants:** You (Engineer), Community Manager (CM), One Rotating Stakeholder (Design/PM)
  **Inputs:** Shortlist of 3–5 charities.
  **Outputs:** A "Go/No-Go" recommendation for the CM, with a "Veto Risk" flag for the CEO.

  **Note on Jargon:** We are avoiding terms like "counterfactuals" or "cause neutrality." We are using engineering terms: "Signal," "Noise," "Single Point of Failure."

  ---

  #### Step 0: The Legal Hard Stop (5 Minutes)
  **Goal:** Ensure we don't get sued.
  **Critique Addressed:** None (This is compliance).
  **Action:** Search the charity's name + "lobbying," "political action," "advocacy." Check their 990 tax form (or local equivalent) for political expenditure line items.
  **Pass Condition:** Zero evidence of direct lobbying or partisan political activity.
  **Fail Condition:** Any direct lobbying.
  **Stop Rule:** If they fail, they are out. No discussion.
  **Honesty Check:** This is real reasoning. Legal risk is binary.

  #### Step 1: The "Missing Number" Proxy (15 Minutes)
  **Goal:** Prevent Measurability Bias (Critique 1).
  **Critique Addressed:** Measurability Bias (Funding only what is easy to count).
  **Action:** Look at their impact reporting.
  *   **Scenario A:** They have hard numbers (e.g., "bednets distributed," "lives saved").
      *   *Requirement:* Do they admit uncertainty? (e.g., confidence intervals, "estimated"). If they claim 100% certainty on complex human outcomes, mark as "High Skepticism."
  *   **Scenario B:** They have no hard numbers (e.g., "feelings of safety," "community cohesion").
      *   *Requirement:* Do they have a **Proxy Story**? We need three specific, verifiable anecdotes with names/dates/locations that illustrate the goal. If they only have vague testimonials ("I feel better"), mark as "Low Evidence."
  **Pass Condition:** Hard numbers with uncertainty admitted OR Qualitative data with specific anecdotes.
  **Fail Condition:** Hard numbers with 100% certainty claims OR Qualitative data with only vague vibes.
  **Honesty Check:** This is real reasoning. It forces a standard of evidence regardless of data type.

  #### Step 2: The "Black Box" Audit (15 Minutes)
  **Goal:** Prevent Institutional Bias (Critique 3).
  **Critique Addressed:** Institutional/Insider Bias (Orgs grading their own homework).
  **Action:** Ignore the impact report. Look at the "About Us" and "Financials."
  *   **Question 1:** Who is on the board? Are they all friends/family of the founder? (Risk: Yes/No).
  *   **Question 2:** Is the overhead ratio reasonable? (Not "zero overhead," but does >85% go to programs?).
  *   **Question 3:** Can we find a negative review from a *partner* or *employee*, not just a donor? (Search "charity name + review + employee" or "partner").
  **Pass Condition:** Diverse board OR reasonable overhead OR no negative partner/employee reports.
  **Fail Condition:** Family board AND high overhead AND negative partner reports. (Need 2 of 3 to fail).
  **Honesty Check:** This is mostly real reasoning, but "reasonable overhead" is a gut call. We are using 85% as a heuristic, not a truth.

  #### Step 3: The "Band-Aid vs. Bridge" Check (15 Minutes)
  **Goal:** Mitigate "Earning to Give" Disengagement (Critique 2).
  **Critique Addressed:** Earning-to-Give/Disengagement (Writing checks vs. changing reality).
  **Context:** Since we cannot fund lobbying (Step 0), we cannot fund pure systemic change. We are looking for **Capacity Building**.
  **Action:** Ask: "If we stop funding this in two years, is the situation better than if we never started?"
  *   **Option A (Band-Aid):** We feed people today. If we stop, they are hungry again. (Valid, but lower score).
  *   **Option B (Bridge):** We train local doctors / build infrastructure / change local policy (non-lobbying). If we stop, the capacity remains. (Higher score).
  **Pass Condition:** Must articulate a path to sustainability or capacity building. Pure relief is allowed but flagged as "High Dependency."
  **Fail Condition:** No answer to sustainability, or admission that they rely on perpetual funding to maintain status quo.
  **Honesty Check:** **This is dressed-up gut feeling.** "Capacity building" sounds noble, but sometimes immediate relief is more moral. We are biasing toward "Bridge" because it feels smarter, not because it's provably better. This is where we admit we are optimizing for our own comfort, not necessarily maximum good.

  #### Step 4: The Veto Prep (10 Minutes)
  **Goal:** Acknowledge Governance Reality.
  **Critique Addressed:** Institutional Bias (Power dynamics).
  **Action:** The CM drafts a one-paragraph summary for the CEO.
  *   **Prompt:** "Why might the CEO hate this?"
  *   **Action:** If the charity is controversial, unpopular, or boring (no marketing assets), flag as "High Veto Risk."
  **Pass Condition:** CM is willing to defend the choice.
  **Fail Condition:** CM knows the CEO will kill it and doesn't want to fight.
  **Honesty Check:** This is pure politics. It acknowledges that the "best" charity doesn't matter if the CEO vetoes it. It's not moral reasoning; it's risk management.

  ---

  ### Running the Protocol on Your Shortlist

  Here is how A, B, and C score against the Q-CVP.

  #### Candidate A: Global Health (Trials, Clean Numbers)
  *   **Step 0 (Legal):** Pass. Standard 501(c)(3).
  *   **Step 1 (Missing Number):** Pass. Numbers are clean. *Caveat:* Check if they admit uncertainty. If they claim perfect precision, mark "High Skepticism."
  *   **Step 2 (Black Box):** Pass. Usually these orgs have large boards and audited financials.
  *   **Step 3 (Band-Aid):** **Mixed.** Often these are "Band-Aid" (treat the disease now). If they don't train local staff, they get flagged "High Dependency."
  *   **Step 4 (Veto Prep):** Low Risk. Boring but safe.
  *   **Verdict:** **Strong Recommend.** It passes the logic gates. The only risk is Step 3, where you might decide "saving a life now" is worth the dependency flag.

  #### Candidate B: Small Mental Health (No Data, High Need)
  *   **Step 0 (Legal):** Pass.
  *   **Step 1 (Missing Number):** **Conditional Pass.** They have no numbers. Do they have three specific anecdotes? If yes, they pass. If they only say "we help people feel better," they Fail.
  *   **Step 2 (Black Box):** **Risk.** Small orgs often have founder-heavy boards. Check the overhead. If the founder pays themselves a huge salary, Fail.
  *   **Step 3 (Band-Aid):** **Strong Pass.** Mental health infrastructure is "Bridge" work. It builds capacity.
  *   **Step 4 (Veto Prep):** **High Risk.** Hard to market "mental health in [obscure region]" to users. CEO might veto for lack of "wow" factor.
  *   **Verdict:** **Recommend with Reservations.** It addresses your Measurability Bias worry, but it introduces Governance Risk. The CM needs to be ready to fight for this.

  #### Candidate C: Slick Org (Popular, CEO Love, Unverified)
  *   **Step 0 (Legal):** Pass.
  *   **Step 1 (Missing Number):** **Fail.** You said impact figures can't be independently verified. If they claim numbers without proof, Step 1 flags "High Skepticism." If they have *no* numbers and just vibes, they Fail.
  *   **Step 2 (Black Box):** **Fail.** "Slick site, big claims" usually correlates with high marketing spend (low program %) and insider boards.
  *   **Step 3 (Band-Aid):** Unknown. Usually, these orgs are brand-awareness focused, which is neither Band-Aid nor Bridge.
  *   **Step 4 (Veto Prep):** **Zero Risk.** CEO loves it.
  *   **Verdict:** **No-Go (Procedurally).** This charity fails the logic checks. However, because of Step 4, **the CEO will likely fund it anyway.**
  *   **Honesty Check:** If you run this procedure and the CEO picks C regardless, the procedure didn't fail; the *governance* failed. The procedure's job here is to give the CM ammunition to say, "We know the risks on C, but we recommend B because..."

  ---

  ### Limitations & Critique Analysis

  You asked for honesty about where this produces garbage and which critiques don't apply.

  #### 1. Where the Procedure Produces Garbage
  *   **The "Bridge" Bias (Step 3):** I explicitly biased Step 3 toward "Capacity Building." This is me dressing up a gut call. Sometimes the most effective thing is just handing out cash or food (Band-Aid). By penalizing "High Dependency," we might reject the most urgent, life-saving interventions because they aren't "sustainable." We are optimizing for *our* feeling of long-term impact, not necessarily the beneficiary's immediate survival.
  *   **The CEO Veto (Step 4):** This step admits that logic doesn't matter if power says no. If the CEO is committed to Candidate C, this procedure just creates documentation for why the CEO overruled the team. It doesn't stop it.
  *   **Fraud Detection:** Step 2 looks at public info. It cannot detect sophisticated fraud. A charity can have a clean 990 and a diverse board and still be wasting money. We are checking for *competence signals*, not *truth*.

  #### 2. Which Critiques Don't Actually Apply
  *   **Critique 2 (Earning to Give / Disengagement):** This critique is largely a **red herring** for your specific product.
      *   *Why:* The critique says "earning to give" lets high-earners off the hook by just writing checks instead of changing their lives/careers. But your product *is* a check-writing tool. Your users *want* to write checks.
      *   *Reality:* You cannot solve "disengagement" with a donation feature. The only way to solve that is to stop being a donation feature and become an advocacy platform (which is illegal for you per Step 0).
      *   *Adjustment:* I mapped this critique to "Band-Aid vs. Bridge" in Step 3, but that's a stretch. The real mitigation here isn't charity selection; it's **user education**. If you want to address this critique, don't change the charity list; change the UI to show users *why* their money matters, so the check-writing feels connected to reality. The procedure can't fix this; product design can.

  *   **Critique 1 (Measurability) & Critique 3 (Institutional):** These are **highly applicable**.
      *   Your current process ("clean numbers" + "vibes") is exactly what Critique 1 warns against.
      *   Your reliance on evaluator sites (which often rely on self-reported data) is exactly what Critique 3 warns against.
      *   The procedure above directly targets these two.

  #### 3. The "Personal Want" Check
  You mentioned one of these is the one you personally want to fund.
  *   If you want **A**: The procedure supports you. It's the safe, logical choice.
  *   If you want **B**: The procedure supports you, *but* warns you it's harder to defend to the CEO. You'll need the CM to fight.
  *   If you want **C**: The procedure tells you you're wrong. It flags the lack of verification and the institutional risk. If you pick C, you are explicitly choosing "CEO Happiness" and "User Vibes" over "Verified Impact." That is a valid business choice, but do not call it "effective giving." Call it "marketing spend."

  ### Final Recommendation
  Run the protocol. If Candidate C wins the CEO veto despite failing Step 1 and 2, accept it as a business cost, but label it internally as "Marketing/Engagement" rather than "Impact." This keeps your integrity intact: you know which dollars are buying change (A/B) and which are buying user retention (C). Don't let the procedure convince you C is effective; let it convince you C is expensive.
