prompt: |-
  ok so i spent like two hours last night arguing with my friend about metaphysical grounding — the 'in virtue of' thing, what makes something the case as opposed to what causes it to be the case — and she kept landing the same punch: that 'grounds' is either causation with the physics filed off, or it's just a dressed-up word for explaining something, and either way the word is doing no work. i think she's wrong but i was losing, mostly because i kept reaching for the regress and well-foundedness stuff and she'd just say 'so, an infinite causal chain, big deal'. anyway, now i have to run a session on this for a reading group next week — six people, two with philosophy degrees, three economists, one physicist — and i need you to plan the teaching, not do it. don't explain grounding to me, tell me how to explain it.

  Specifically: what order the pieces have to go in and what depends on what. i assume you can't do 'fundamental' before 'grounds', but tell me what else is load-bearing and in what sequence.

  The example i want to carry the whole thing is a spreadsheet. cells with formulas that read off other cells, bottoming out in cells where someone just typed a number — the typed-in ones are the fundamental ones, the formula cells are grounded in what they read off. what i like: nothing on the sheet happens before anything else, the whole thing is just true at once, so it should kill the causation reading in their heads before it forms. and i want to bring in the circular-reference error — the software flatly refuses to compute a loop — as the intuition pump for why grounding is supposed to be asymmetric and well-founded, i.e. why the chain has to stop somewhere. tell me where this example breaks or misleads, and whether i need a second one for the cases where the grounded thing isn't a number but a thing (a statue and its clay, or whatever). if i do, which one, and what does it have to have that the spreadsheet lacks? also: is it a rabbit hole to ask the group whether a real loop could ever be coherent, or is that exactly the in-the-weeds bit worth five minutes?

  Then the misconceptions, in the order they'll actually turn up in the room, and the exact point in the sequence where i should head each one off. the ones i'm predicting: grounding = causation (obviously), grounding = supervenience or plain entailment (i think this one arrives the second i say 'necessitation'), fundamental = small / atoms (the physicist will fight me here), and 'if A grounds B then B is less real or not really there' — which is the slide i most want to block, since i think it's why my friend finds the whole vocabulary sinister. add the ones i'm not seeing. and tell me honestly which parts of her objection the session can actually answer and which it definately can't; i'd rather know.

  Finally: one question i can put to the group at the end that shows whether they can tell a grounding claim from a causal one and from a mere entailment, using a case they haven't seen in the session. and tell me what to seperate out and explicitly skip at this level, saying out loud that i'm skipping it. no reading list, they won't do it anyway.
