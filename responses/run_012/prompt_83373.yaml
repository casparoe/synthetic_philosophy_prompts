      *   *The "Why not Poll?" Problem:* If the authority comes from the *result* (the estimate), why not just poll everyone cheaply? If the authority comes from the *process* of the sample deciding, it's not purely sampling.
      *   *Issue Salience/Competence:* The polity might have no pre-existing judgment on complex technical issues. The sample cannot estimate a null set.
      *   *Legitimacy Transmission:* Polls don't have authority to *rule*, only to *measure*. Moving from "is" (estimate) to "ought" (binding decision) requires more than statistical accuracy.
