answer: |-
  Your friend is operating within a specific niche of the philosophy of mind, likely a version of **Teleosemantics** (the view that meaning is grounded in biological function) mixed with **Bio-Naturalism**. The inclusion of the "wild bacterium" as having *original* intentionality is the critical tell; many philosophers (like Searle) would deny a bacterium has mental states at all, while others (like Dennett) might treat its intentionality as merely "as-if." By calling it *original*, she signals that she believes evolutionary history grounds real meaning, not just human interpretation.

  Here are two rules that fit her prior verdicts, their predictions for your robot, and my analysis of where she actually stands.

  ### Rule 1: The "Natural Biological Proper Function" Rule
  **The Principle:** Original intentionality is exclusive to living organisms whose internal states were shaped by **natural selection in the real physical world**. The capacity must be a "proper function" of the biology, not a trick, training, or artifact.
  *   **Fits the Data:**
      *   *Human/Dog/Octopus/Wild Bacterium:* All are biological products of natural selection.
      *   *Thermostat/Two-bitser/Chess Engine/Corp:* All are artifacts or social constructs, not biological.
      *   *Parrot (Mimicry):* While the bird is biological, the *specific capacity* (speaking human words) is not a biological proper function; it is a conditioned behavior induced by humans, making that specific intentionality derived (like a tool).
  *   **Prediction for the Robot:** **Derived.**
      *   **Why:** The robot is not biological. Furthermore, its "environment" was a simulation, and its "selection" was governed by a fitness function written by a grad student. It lacks a history of natural selection in the real world.

  ### Rule 2: The "Blind Variation and Retention" Rule
  **The Principle:** Original intentionality arises whenever a system's internal states are shaped by a process of **blind variation and selection** where no agent specified the *meaning* of those states, regardless of substrate. If the system tracks truth/success because it was selected for doing so, not because it was coded to do so, the intentionality is original.
  *   **Fits the Data:**
      *   *Human/Dog/Octopus/Wild Bacterium:* All shaped by blind evolutionary variation.
      *   *Thermostat/Two-bitser/Chess Engine:* These are top-down designed. Their states mean what the engineer decided they mean.
      *   *Corp:* Designed by charter/law.
      *   *Parrot (Mimicry):* The behavior is not the result of variation/selection for *communication*, but of conditioning (top-down shaping of behavior).
  *   **Prediction for the Robot:** **Original.**
      *   **Why:** The grad student wrote the fitness function (the "survival" condition), but crucially, **no human specified what the internal states mean.** The neural net weights emerged from blind mutation and selection within the sim. The robot tracks obstacles because states that did so survived, not because a coder mapped "obstacle" to "node 4." It satisfies the structural requirements of evolution.

  ### The Bet: I'd bet on Rule 1 (Derived)
  I would bet your friend will rule the robot **Derived**.

  **Why?** The specific wording of her bacterium verdict is the smoking gun. She didn't say "Bacterium, original." She said "**Wild** bacterium, original."
  *   If she followed Rule 2 (Process), the "wild" qualifier would be unnecessary; a lab-evolved bacterium would also have original intentionality.
  *   By specifying "wild," she implies that the *context of the selection* matters. Natural selection in the real world grounds original intentionality; artificial selection (even if blind) or simulation grounds derived intentionality.
  *   The Grad Student in your robot case plays the role of "Nature," but because the Grad Student is a conscious agent with intentions (writing the fitness function), the teleology ultimately traces back to a human mind. The robot is, in her eyes, a very complex Two-bitser.

  ### The Crucial Case: The Genetically Engineered Bacterium
  To force these rules apart, present her with this case:

  > **The Case:** A bacterium is created in a lab. Its DNA is synthetically engineered by humans to swim up sugar gradients (chemotaxis), a trait it did not previously have. It is biologically alive, metabolizes, and reproduces, but its specific tracking behavior was designed, not naturally selected.

  *   **Rule 1 (Biological Proper Function) predicts:** **Original.** (It is a living organism with biological states, regardless of how they got there).
  *   **Rule 2 (Blind Variation/Natural History) predicts:** **Derived.** (The specific intentionality comes from human design/engineering, not blind natural selection).

  If she says **Original**, she is a Bio-Naturalist (Substance matters more than History). If she says **Derived**, she is a strict Teleosemanticist (History matters more than Substance). Given the "Wild" clue, I suspect she will say **Derived**, which confirms Rule 1 is the stricter version of her actual view.

  ### Does the distinction survive contact?
  Honestly? **Probably not.**

  Your robot case is a "Intuition Pump" designed to break the Bio-Naturalist distinction. If the robot behaves *exactly* like the wild bacterium—reliably covarying with the environment, avoiding errors, and even making similar mistakes (swerving at holograms)—denying it original intentionality looks like **carbon chauvinism**.

  If the bacterium's "aboutness" is real because it was selected to track sugar, and the robot's "aboutness" is "derived" only because it was selected to track obstacles in a sim, the difference is purely historical, not functional. If the robot were released into the real world and survived for 10,000 generations evolving *outside* the sim, would it suddenly gain original intentionality?

  If she says "Yes," she is committed to a magical view of history (that time and natural selection imbue matter with "mind dust"). If she says "No," she has to admit the robot already had it. This case presses her on whether intentionality is a **historical property** (where you came from) or a **functional property** (what you do). Her "Wild" qualifier suggests she's a historical purist, but the robot case shows why that position is becoming increasingly difficult to hold in the age of AI and synthetic biology.
