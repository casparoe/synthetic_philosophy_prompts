prompt: |-
  Im a third-year phil student and for my Hegel course I have to do an interview for the class blog. I've got a PhD student from our dept who defends a pretty specific line on Hegel and war: he thinks Hegel's case that war has an ethical significance doesn't need wars to actually happen, only for war to remain a genuine possibility -- and he says the current long peace between the great powers is exactly the prolonged calm Hegel was worried about. He also claims you can keep the whole argument even if you throw out the student lecture notes, because the published text already has the recognition structure doing the work.

  Draft 9 questions for me. They should press him, not let him just restate. I need at least one on the possibility/occurrence distinction (if only the possibility matters, what is actual fighting even doing, and how is his view different from just saying states should stay vigilant), one on the textual issue (how much survives if the bit about winds and a long calm at sea is just lecture-note Hegel, and whether the published sections on international relations can carry the weight alone), one on whether his view implies we should be less worried about nuclear deterrence (I think he's most vulnerable here, so give me a follow-up keyed to the answer he's most likely to give -- probly that deterrence is a different kind of calm because the possibility is heightened, not removed), and one on whether any of this survives without the metaphysics of Geist or whether a secular version is just wishful thinking. Also work in something about the family: in the Phenomenology the family's duty to bury its dead collides with the state, and I want to see if he can keep the PR account of war tidy against that. If you can, add a question about whether the corruption claim is supposed to be empirical or a priori and what would count as evidence against it.

  Keep the whole thing under 800 words and no single question over 4 sentences.
