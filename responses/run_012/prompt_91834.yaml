  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Philosophy professor (metaethics, particularism) + Clinical Ethics Committee member.
      *   **Context:** Committee meets ~4-5 times/month, 45 mins, incomplete charts, need written recommendation for chair. Current method (4 principles + vote) is embarrassing and clashes with particularist insights (Dancy).
      *   **Goal:** Create a decision procedure grounded in particularism (principles as reminders/heuristics, not rulers) but usable by clinicians (no philosophy background, time-constrained).
      *   **Requirements:**
          *   Handle edge cases (unconscious/no family, patient wish vs. situation).
          *   Identify where the procedure stops and hands off to human judgment (values call).
          *   Be honest about limitations/misfires.
          *   Run on three specific cases (Religious refusal, Cultural nondisclosure, Abusive patient).
          *   **Format:** Specific section headings and word counts/limits.
              1.  Bottom line (3 sentences max).
              2.  The tension (~150 words).
              3.  The procedure (~600 words, numbered steps, sufficient answer, work/slowdown flag).
              4.  Stops and hand-offs (~200 words).
              5.  Three worked cases (~200 words each, verdict/hand-off).
              6.  What this can't do (~150 words).
              7.  Cheat sheet (under 10 lines, for annoyed surgeon).

  2.  **Deconstruct the Philosophy (Particularism vs. Generalism):**
      *   *Generalism:* Principles (Autonomy, Beneficence, etc.) are universal laws. If X falls under Principle P, action A is required.
      *   *Particularism (Dancy):* Moral reasons are holistic. A feature (e.g., "lying") can be a reason against in one case and a reason for in another depending on context. Principles are at best summaries of past cases, not guides for future ones.
      *   *The Colleague's Idea:* Principles as "reminders not rulers." This aligns with *heuristics* or *salience markers*. They don't dictate the outcome; they ensure you notice relevant features.
      *   *The Challenge:* Can you make a *procedure* out of anti-procedural philosophy? Yes, if the procedure is about *attention* and *deliberation quality* rather than *deductive output*. It must force the committee to look at the specific contours of the case without pretending the principles solve it.

  3.  **Drafting - Section by Section:**

      *   **Bottom Line:** Needs to be punchy. Yes, it works, but it shifts burden to judgment.
      *   **The Tension:** Explain particularism (holism of reasons) vs. the need for a protocol. The procedure must avoid subsumption (fitting case to rule) and focus on discernment (seeing the case).
      *   **The Procedure:** Needs ~600 words. Numbered steps.
          *   Step 1: Fact-finding (slow down).
          *   Step 2: Principle scan as feature spotting (work).
          *   Step 3: Contextual valence (work) - does this feature count *for* or *against* here?
          *   Step 4: Counter-factual check (slow down) - if we remove this feature, does the decision change?
          *   Step 5: Consensus check (work).
          *   *Constraint:* Must indicate "sufficient answer" and "work/slowdown".
      *   **Stops and Hand-offs:** Where does logic end and values begin? When reasons are incommensurable or equally weighted. The procedure identifies the *conflict*, not the *resolution*.
      *   **Worked Cases:**
          1.  *Religious Refusal:* Autonomy looks strong, but is it coerced? Procedure should highlight the specific weight of religious integrity vs. life.
          2.  *Cultural Nondisclosure:* Beneficence (protecting hope) vs. Autonomy (truth). Procedure highlights cultural context as a modifier of what "harm" means.
          3.  *Abusive Patient:* Bias check. Does abusiveness negate autonomy? Procedure forces separation of moral worth from compliance.
      *   **What This Can't Do:** Cannot generate moral truth. Cannot resolve fundamental value clashes. Cannot replace courage.
      *   **Cheat Sheet:** 10 lines max. Practical, direct.

  4.  **Writing & Editing (Iterative Process):**

      *   *Bottom Line:* Keep it tight. "Yes, it survives, but only if you accept it generates clarity, not answers. The caveat is that it demands more cognitive labor from the committee, not less. It exposes value conflicts rather than resolving them."
      *   *The Tension:* Focus on Dancy's holism. Features change valence. A procedure usually dictates; this one must orchestrate attention. Word count check (~150).
      *   *The Procedure:* Need to ensure it sounds like a clinical tool but philosophically robust.
          *   Step 1: Narrative reconstruction.
          *   Step 2: Principle as Lens (not Law).
          *   Step 3: Valence Check (Crucial particularist step).
          *   Step 4: Bias/Interference Check.
          *   Step 5: Recommendation Formulation.
          *   *Word Count:* Need to expand descriptions to hit ~600.
      *   *Stops and Hand-offs:* Focus on the "remainder." When reasons are silent or equally loud.
      *   *Cases:* Need to be specific.
          *   Case 1: Jehovah's Witness type? Procedure says respect refusal if competence confirmed, but highlights the *reason* isn't just "autonomy" but "integrity."
          *   Case 2: Family request. Procedure highlights "harm" is culturally defined.
          *   Case 3: Abusive patient. Procedure forces separation of "likability" from "rights."
      *   *What This Can't Do:* Honest limitations.
      *   *Cheat Sheet:* Punchy.

      *Self-Correction on Word Counts:* I need to be careful not to go under or significantly over. I will draft and then count/adjust.
      *Self-Correction on Philosophy:* Ensure I don't slip into principlism. The principles shouldn't *weigh* things, they should *identify* things. The "valence" step is key.

      *Refining the Procedure Steps:*
      1.  **Reconstruct the Narrative:** (Slow down). Get the story, not just the chart.
      2.  **Feature Spotting via Principles:** (Work). Use Autonomy/Beneficence etc. as search terms for relevant features, not verdicts.
      3.  **Determine Valence:** (Work). Does this feature support or oppose the proposed action *in this context*?
      4.  **Interference Check:** (Slow down). Are we reacting to personality, bias, or systemic friction?
      5.  **Decision Point:** (Work). If reasons align, recommend. If they clash irreducibly, hand off.

      *Refining the Cases:*
      1.  Refusal: Competence confirmed. Valence of autonomy is positive. Valence of beneficence (life) is positive but overridden by integrity. Verdict: Honor refusal.
      2.  Nondisclosure: Family says truth = harm. Culture defines harm. Valence of truth-telling shifts. Hand-off: Does the patient value cultural norms over individual knowledge? (Needs probing).
      3.  Abusive: Bias check. Abusiveness is negative feature for *relationship*, not for *rights*. Verdict: Honor refusal, address abuse separately.

      *Refining "Stops and Hand-offs":* The procedure identifies the *dilemma*, not the *solution*. When valences are equal and opposite, the committee must vote based on institutional values, not moral logic.

      *Refining "What This Can't Do":* It won't make hard choices easy. It won't protect you from liability. It won't fix broken systems.

      *Refining "Cheat Sheet":* Needs to be laminatable.

      *Word Count Check:*
      Bottom Line: 3 sentences.
      Tension: ~150.
      Procedure: ~600.
      Stops: ~200.
      Cases: 3 x ~200 = 600.
      Can't Do: ~150.
      Cheat Sheet: <10 lines.

      Let's draft.

      *Drafting The Tension:*
      Particularism claims moral reasons are holistic: a feature like "lying" counts against an action in one context but for it in another (e.g., protecting a victim). Principles cannot codify this variability; they are at best summaries of past judgments. A compatible procedure cannot subsume cases under rules. Instead, it must structure attention. It must force the committee to identify relevant features without predetermining their moral valence. The trade-off is efficiency for accuracy. You lose the comfort of a algorithmic output. You gain a rigorous map of why the case is hard. The procedure becomes a tool for discernment, not deduction. It admits that moral truth is found in the specifics, not the generalizations. This requires clinicians to tolerate ambiguity longer than they want.

      *Drafting The Procedure:*
      1.  **Narrative Reconstruction:** Assemble the timeline. Who said what, when? *Sufficient Answer:* A coherent story explaining why we are here, distinct from the chart summary. *Flag:* Slow down. Prevents solving the wrong problem.
      2.  **Feature Spotting (Principle as Lens):** Scan the case using the four principles solely to identify features. Do not assign weight yet. *Sufficient Answer:* A list of facts tagged by principle (e.g., "Patient refusal" [Autonomy], "High mortality risk" [Beneficence]). *Flag:* Work. Ensures no relevant feature is ignored.
      3.  **Valence Determination:** For each feature, ask: Does this count for or against the proposed action *in this specific context*? *Sufficient Answer:* A directional arrow for each feature. Note if a principle usually positive (truth-telling) counts negatively here (cultural harm). *Flag:* Work. This is the particularist core.
      4.  **Interference & Bias Check:** Ask: Are we reacting to the patient's likability, staff frustration, or legal fear? *Sufficient Answer:* Explicit acknowledgment of non-moral pressures influencing the group. *Flag:* Slow down. Isolates moral reasons from institutional noise.
      5.  **Alignment Check:** Do the valenced features point unanimously or predominantly one way? *Sufficient Answer:* Consensus on whether reasons cohere or conflict irreducibly. *Flag:* Work. Determines if a recommendation is possible.
      6.  **Recommendation Drafting:** Write the justification based on the coherent features, not the principles themselves. *Sufficient Answer:* A paragraph citing the specific contextual reasons, not abstract rules. *Flag:* Work. Produces the deliverable.

      *Drafting Stops and Hand-offs:*
      The procedure stops when Step 5 reveals irreducible conflict. If "Preserve Life" and "Respect Integrity" both have positive valence but oppose each other, logic ends. This is not a failure; it is a successful diagnosis of a value clash. At this point, the committee must hand off to the designated decision-maker (chair, surrogate, or court). The procedure cannot weigh incommensurable values. It cannot tell you whether life is worth more than dignity. It also stops when facts are unavailable (e.g., unknown patient values). Here, the hand-off is to a default policy (best interest standard), but the procedure must note this is a policy choice, not a moral deduction. Finally, it stops when the committee itself is divided on the valence. If half see "refusal" as autonomous and half as depressive symptom, the procedure hands off to further psychiatric evaluation. It identifies epistemic gaps.

      *Drafting Cases:*
      1.  **Religious Refusal:** Narrative confirms competence and consistency. Feature spotting tags "Refusal" [Autonomy] and "Death" [Non-maleficence]. Valence check: Refusal counts strongly for respecting integrity; Death counts against treatment but is accepted risk. Bias check: Team frustration identified as non-moral pressure. Alignment: Reasons cohere around integrity. *Verdict:* Honor refusal. Procedure confirms autonomy isn't a trump card but aligns with integrity here.
      2.  **Cultural Nondisclosure:** Narrative reveals family believes truth causes harm. Feature spotting tags "Withholding" [Beneficence] and "Deception" [Autonomy]. Valence check: In this context, "Deception" may count for protecting family bond; "Truth" may count against patient well-being. Bias check: Western bias toward truth-telling identified. Alignment: Conflict remains. Is the patient's culture actually theirs? *Hand-off:* Requires probing patient's actual values on information. Procedure cannot assume cultural membership equals individual preference.
      3.  **Abusive Patient:** Narrative confirms refusal and abuse. Feature spotting tags "Refusal" [Autonomy] and "Abuse" [Justice/Staff Safety]. Valence check: Refusal counts for respecting rights. Abuse counts against continuing *relationship*, not against rights. Bias check: Committee anger identified as skewing valence of refusal. Alignment: Reasons cohere for honoring refusal while managing behavior. *Verdict:* Honor refusal, implement conduct plan. Procedure isolates moral worth from likability.

      *Drafting What This Can't Do:*
      This procedure cannot generate moral certainty where none exists. It will not protect you from lawsuits if the outcome is bad. It cannot resolve fundamental disagreements about the good life. If the committee disagrees on the valence of a feature (e.g., is this refusal authentic?), the procedure halts. It requires honesty; if members lie about their biases, it fails. It does not replace legal counsel. It assumes good faith. It cannot fix understaffing or systemic inequities that create the ethical problem. It is a diagnostic tool, not a cure. It makes the hardness of the choice visible, which some will find frustrating. It demands intellectual humility.

      *Drafting Cheat Sheet:*
      1. Get the story, not just the chart.
      2. Use principles to spot features, not verdicts.
      3. Ask: Does this feature help or hurt *here*?
      4. Check: Are we angry or afraid?
      5. If reasons align, recommend.
      6. If reasons clash, hand off.
      7. Don't hide behind "Autonomy."
      8. Name the specific value at stake.
      9. Write the why, not just the what.
      10. Accept that some cases stay hard.

      *Review against constraints:*
      - Bottom Line: 3 sentences max.
      - Tension: ~150 words.
      - Procedure: ~600 words.
      - Stops: ~200 words.
      - Cases: 3 x ~200 words.
      - Can't Do: ~150 words.
      - Cheat Sheet: <10 lines.
