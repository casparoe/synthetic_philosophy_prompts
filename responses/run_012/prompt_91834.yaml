answer: |-
  # Bottom line
  Yes, the "reminders not rulers" approach survives contact with an actual committee, but only if you accept it generates clarity, not answers. The biggest caveat is that it demands more cognitive labor from the committee, not less, by forcing you to articulate why a principle applies rather than letting it decide for you. It exposes value conflicts rather than resolving them, which may frustrate clinicians seeking cover.

  # The tension
  Particularism claims moral reasons are holistic: a feature like "lying" counts against an action in one context but for it in another (e.g., protecting a victim). Principles cannot codify this variability; they are at best summaries of past judgments, not laws for future ones. A compatible procedure cannot subsume cases under rules. Instead, it must structure attention. It must force the committee to identify relevant features without predetermining their moral valence. The trade-off is efficiency for accuracy. You lose the comfort of an algorithmic output. You gain a rigorous map of why the case is hard. The procedure becomes a tool for discernment, not deduction. It admits that moral truth is found in the specifics, not the generalizations. This requires clinicians to tolerate ambiguity longer than they want. You give up the illusion that ethics is a calculation.

  # The procedure

  1.  **Narrative Reconstruction:** Assemble the timeline. Who said what, when, and to whom? Ignore the chart's summary; get the story. *Sufficient Answer:* A coherent story explaining why we are here, distinct from the admission diagnosis. *Flag:* Slow down. Prevents solving the wrong problem.
  2.  **Feature Spotting (Principle as Lens):** Scan the case using the four principles solely to identify features. Do not assign weight yet. Use "Autonomy" to find refusals, "Beneficence" to find risks. *Sufficient Answer:* A list of facts tagged by principle (e.g., "Patient refusal" [Autonomy], "High mortality risk" [Beneficence]). *Flag:* Work. Ensures no relevant feature is ignored.
  3.  **Valence Determination:** For each feature, ask: Does this count for or against the proposed action *in this specific context*? A standard benefit might be a harm here. *Sufficient Answer:* A directional arrow for each feature. Note if a principle usually positive (truth-telling) counts negatively here (cultural harm). *Flag:* Work. This is the particularist core.
  4.  **Interference & Bias Check:** Ask: Are we reacting to the patient's likability, staff frustration, or legal fear? Is anger driving the "Justice" tag? *Sufficient Answer:* Explicit acknowledgment of non-moral pressures influencing the group. *Flag:* Slow down. Isolates moral reasons from institutional noise.
  5.  **Alignment Check:** Do the valenced features point unanimously or predominantly one way? Do the reasons cohere or conflict irreducibly? *Sufficient Answer:* Consensus on whether reasons cohere or conflict irreducibly. *Flag:* Work. Determines if a recommendation is possible.
  6.  **Recommendation Drafting:** Write the justification based on the coherent features, not the principles themselves. Cite the specific context. *Sufficient Answer:* A paragraph citing the specific contextual reasons, not abstract rules. *Flag:* Work. Produces the deliverable.

  # Stops and hand-offs
  The procedure stops when Step 5 reveals irreducible conflict. If "Preserve Life" and "Respect Integrity" both have positive valence but oppose each other, logic ends. This is not a failure; it is a successful diagnosis of a value clash. At this point, the committee must hand off to the designated decision-maker (chair, surrogate, or court). The procedure cannot weigh incommensurable values. It cannot tell you whether life is worth more than dignity. It also stops when facts are unavailable (e.g., unknown patient values). Here, the hand-off is to a default policy (best interest standard), but the procedure must note this is a policy choice, not a moral deduction. Finally, it stops when the committee itself is divided on the valence. If half see "refusal" as autonomous and half as depressive symptom, the procedure hands off to further psychiatric evaluation. It identifies epistemic gaps.

  # Three worked cases

  **1. Competent Adult Refusing Treatment (Religious)**
  Narrative confirms competence and consistency over time. Feature spotting tags "Refusal" [Autonomy] and "Death" [Non-maleficence]. Valence check: Refusal counts strongly for respecting integrity; Death counts against treatment but is accepted risk. Bias check: Team frustration identified as non-moral pressure; they view death as failure. Alignment: Reasons cohere around integrity. The principle of Autonomy isn't a trump card here; it's a marker for the feature of "religious integrity," which carries the weight. *Verdict:* Honor refusal. Procedure confirms autonomy isn't abstract but aligns with specific integrity here. The team wants override; procedure shows their reason is "we know better," which lacks valence against competence.

  **2. Family Asking to Withhold Diagnosis (Cultural)**
  Narrative reveals family believes truth causes harm. Feature spotting tags "Withholding" [Beneficence] and "Deception" [Autonomy]. Valence check: In this context, "Deception" may count for protecting family bond; "Truth" may count against patient well-being. Bias check: Western bias toward truth-telling identified as influencing the team. Alignment: Conflict remains. Is the patient's culture actually theirs? We don't know. *Hand-off:* Requires probing patient's actual values on information. Procedure cannot assume cultural membership equals individual preference. We cannot recommend withholding until we know if the patient values truth or protection more. The principle of Beneficence is unstable here.

  **3. Abusive Patient Refusing Treatment**
  Narrative confirms refusal and verbal abuse of staff. Feature spotting tags "Refusal" [Autonomy] and "Abuse" [Justice/Staff Safety]. Valence check: Refusal counts for respecting rights. Abuse counts against continuing *relationship*, not against rights. Bias check: Committee anger identified as skewing valence of refusal; we want to punish him. Alignment: Reasons cohere for honoring refusal while managing behavior. *Verdict:* Honor refusal, implement conduct plan. Procedure isolates moral worth from likability. The team wants to deny care due to abuse; procedure shows abuse modifies the *delivery*, not the *right*. My gut wanted to override; procedure caught the bias.

  # What this can't do
  This procedure cannot generate moral certainty where none exists. It will not protect you from lawsuits if the outcome is bad. It cannot resolve fundamental disagreements about the good life. If the committee disagrees on the valence of a feature (e.g., is this refusal authentic?), the procedure halts. It requires honesty; if members lie about their biases, it fails. It does not replace legal counsel. It assumes good faith. It cannot fix understaffing or systemic inequities that create the ethical problem. It is a diagnostic tool, not a cure. It makes the hardness of the choice visible, which some will find frustrating. It demands intellectual humility. You will still have to sleep with the decision.

  # Cheat sheet
  1. Get the story, not just the chart.
  2. Use principles to spot features, not verdicts.
  3. Ask: Does this feature help or hurt *here*?
  4. Check: Are we angry or afraid?
  5. If reasons align, recommend.
  6. If reasons clash, hand off.
  7. Don't hide behind "Autonomy."
  8. Name the specific value at stake.
  9. Write the why, not just the what.
  10. Accept that some cases stay hard.
