answer: |-
  There is no single, universally recognized term for this specific configuration, though it is a well-known friction point in bioethics. In the literature, you will find pieces of it discussed under **"Precedent Autonomy"** (the authority of the past self) versus **"Contemporaneous Dissent"** (the rights of the present self), often in the shadow of Ronald Dworkin's work on critical vs. experiential interests.

  But those are the neighborhoods. You want the carving.

  If I were to name it, I would call it **"The Asymmetry of Dissent."**

  Here is the definition, the mechanism, and the verdict on whether it is principled or cowardice.

  ### The Carving: How It Works

  The lopsidedness you are observing is not random; it is structural. It rests on a legal and ethical distinction between **Negative Rights** (the right to refuse) and **Positive Rights** (the right to demand), combined with the requirement for **Ongoing Consent.**

  Here is the breakdown of the four quadrants you described:

  1.  **Past No + Present Yes = Past No Wins.**
      *   *Why:* A refusal of treatment (a living will directive to withhold) is a **Negative Right**. In law and ethics, a refusal is considered persistent until it is *competently* revoked. Because your mother currently lacks the capacity to legally revoke her living will, her past "No" remains active. Her current happiness ("Present Yes") is viewed as an *experiential interest*, which does not carry the legal weight to override a *critical interest* (the prior directive) regarding bodily intrusion.
  2.  **Past Yes + Present No = Present No Wins.**
      *   *Why:* Medical treatment requires **Ongoing Consent**. A signature from five years ago authorizes treatment *assuming continued consent*. If the patient in the bed is actively resisting (moaning, pulling at tubes, saying "stop"), that is **Contemporaneous Dissent**. To proceed with treatment despite active resistance is legally defined as **battery** (unconsented touching). A past document cannot authorize assault on a present, resisting body.

  **The Result:** A "No" is a veto that works from any timeframe. A "Yes" is a permission that expires the moment the body says "stop."

  ### Is It Principled or Emotional?

  You asked if this is a principled stance or simply the medical team (and family) being unwilling to watch her keep going.

  **It is primarily principled, but it is shielded by emotional convenience.**

  **The Principle: The Battery Barrier**
  The core principle is bodily integrity. The law is much more afraid of *active harm* than *passive death*.
  *   **Withholding treatment** (honoring a Past No) is an omission. It allows the underlying pathology to take its course. Even if the patient looks happy, the ethical view is that you are respecting their boundary against intrusion.
  *   **Forcing treatment** (honoring a Past Yes against a Present No) is an action. It requires restraint, sedation, or physical force. This is an immediate violation of the person in front of you. The ethical calculus prioritizes the *certainty of present harm* (force/restraint) over the *speculative benefit of prolonged life* dictated by a past self.

  **The Emotional Shield**
  However, you are right to sense a human element. This asymmetry is psychologically easier for everyone in the room.
  *   **For the Doctors:** Honoring a Past No (even against a happy patient) is "following the rules." Honoring a Present No (against a Past Yes) is "relieving suffering." Both paths allow the doctor to avoid the moral injury of restraining a demented patient to feed them against their will.
  *   **For the Family:** It is often easier to accept a death that feels "authorized" (by the will or by the moan) than to fight for a life that the patient in the bed seems to be resisting.

  ### Why the "Yes" Is Weaker Than the "No"

  The specific carving you are bumping into is that **Consent is a stream, but Refusal is a dam.**

  *   **Consent (Yes):** Must flow continuously. If the stream dries up (the patient resists), the authorization ends. A past "Yes" cannot pump water uphill against the gravity of current resistance.
  *   **Refusal (No):** Once built, it stands until the builder (the competent self) comes back to dismantle it. Since your mother cannot competently dismantle the dam, it holds, even if the water level (her current mood) is low.

  ### Summary

  The name is **The Asymmetry of Dissent**.

  It is the ethical rule that **Refusal is Persistent, but Consent is Expirable.**

  *   Your mother's past self can forbid intrusion forever, because she can no longer legally revoke that forbidance.
  *   Your mother's present self can forbid intrusion immediately, because inflicting it would be battery.
  *   Neither version of her can *compel* intrusion if the other version resists, because medicine treats the right to refuse as absolute, but the right to demand as conditional on capacity and cooperation.

  It is not merely that nobody is willing to watch her keep going. It is that the law views forcing a tube into a resisting woman as a violence that no piece of paper from five years ago can justify. But it views withholding a tube from a happy woman as a respect for a boundary drawn when she was whole.

  It is lopsided, yes. But it is lopsided in favor of the body in the room. The system is designed to protect the physical person from being used as a vessel for the past self's ideology, while still allowing the past self to protect the body from unwanted invasion. The "No" is the only command that survives the loss of capacity intact.
