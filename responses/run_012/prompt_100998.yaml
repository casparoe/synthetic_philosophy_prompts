      *   *Part (b) Application:* If Dana has a distribution over future credences (0.5 chance of 0.9, 0.5 chance of 0.3), Reflection requires her current credence to be the *expectation* of those future credences. Calculation: $(0.5 \times 0.9) + (0.5 \times 0.3) = 0.45 + 0.15 = 0.6$.
