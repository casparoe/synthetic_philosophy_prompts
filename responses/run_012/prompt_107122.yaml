      *   **1. What is Testimonial Smothering? (Dotson's Account):**
          *   Define it clearly. It's not just "choosing not to speak." It's *coerced* silence.
          *   Key distinction: *Self-censorship* (internal, perhaps prudential) vs. *Smothering* (response to external epistemic violence/prejudice).
          *   The "perceived inability" of the audience is crucial. It's based on track records (other women dismissed).

      *   **2. The "No-Agent-No-Injustice" Objection:**
          *   Analyze the colleague's premise. He assumes a *transactional* model of injustice (A wrongs B).
          *   Counter-argument: Structural injustice. Iris Marion Young's *Responsibility for Justice*.
          *   The "agent" isn't the air; the agent is the *system of credibility* that has been rigged by past agents and maintained by current norms.
          *   The injustice isn't just the silence; it's the *condition* that makes silence the only rational choice.

      *   **3. Distinguishing Injustice from Bad Outcomes:**
          *   Colleague says it's a "private cost."
