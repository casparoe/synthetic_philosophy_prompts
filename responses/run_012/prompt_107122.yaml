          *   It's not just fear; it's *reasonable* fear based on evidence (precedent). Rational adaptation to oppression is still a symptom of oppression.

      *   **4. Does the Theory Blame the Victim?**
          *   Crucial point. The colleague implies the remedy is "speak up."
          *   Correct view: The remedy is *fix the audience*, not *fix the speaker*.
          *   Demanding she speak places the burden of epistemic labor on the oppressed. The injustice is that she *has* to calculate this risk at all.

      *   **5. Where the Colleague Goes Wrong (The Diagnosis):**
          *   **Category Error:** Confusing *structural* injustice with *interactional* injustice.
