  3. In Round 1, distribute independent clues with 60% accuracy so the majority finds the truth despite weak individuals, then in Round 2 ensure half the class holds identical copies of a single flawed source to create correlated error and a confident wrong majority. Conclude with Round 3 where clues are 70% accurate in pointing to the wrong answer, demonstrating how competence below chance amplifies error.
  4. Ask students to explain why the majority succeeded in Round 1 but failed in Round 2, prompting them to articulate the role of independent errors versus shared sources. Have them observe how Round 3 inverted the result, proving that majority rule amplifies incompetence just as it amplifies competence.
  5. Expect students to discuss clues between rounds, breaking independence, and anticipate difficulty in perfectly calibrating clue reliability without pilot testing. Acknowledge that the activity cannot reproduce the theorem's assumption of fixed individual competence across different questions.
