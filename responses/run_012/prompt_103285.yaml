prompt: |-
  I'm applying for a small summer grant in decision theory and need a proposal of about 1500 words. Take this half-formed idea and turn it into the real thing.

  The Luring Lottery: a bunch of people each get to mail in one postcard with a number on it; if exactly one postcard arrives, that person wins that many dollars, if two or more arrive nobody wins anything. The standard lesson is "superrationality" — each of us is tempted to mail a card, and mailing is actually weakly dominant if you hold everyone else's card fixed, yet a whole population that reasons alike will either all mail (nobody wins) or none mail (nobody wins). I think the standard framing is smuggling in a parameter. Suppose it's common knowledge that any other player's card is produced by the same reasoning process as mine with probability q and by something independent with probability 1−q, q known to all. At q = 1 we should get the superrational verdict, at q = 0 the ordinary "mail anyway" verdict, and I want to know what the prescription does in between — monotone? discontinuous? even well-defined once players can randomize, or once there are two reasoning "types" that both have to output the same thing at q = 1?

  So the question I want the proposal built around: is superrationality a real principle of choice, or just the degenerate q = 1 endpoint of an otherwise ordinary dominance argument — in which case the interesting puzzle is why that endpoint feels like it's telling us something?

  Give me: the question stated so it has a determinate answer; why the usual statements of the puzzle leave it open (both the superrational crowd and the "just use causal decision theory" crowd seem to assume their verdict rather than derive it); the method — formalize the q-game, work out the prescription for general q plus the randomization and two-type variants, and check whether anything survives at q = 1 that isn't already there at q = 0.999; what a result looks like and what would count as the project failing (say, if the dial turns out to be a relabeling of the evidential-vs-causal dispute with no new content); and a realistic scope for one summer. I dont need a bibliography or citations, I'll add those myself.
