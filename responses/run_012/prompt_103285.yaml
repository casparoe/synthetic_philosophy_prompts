answer: |-
  **Project Title:** Parameterizing Common Reasoning: A Continuity Test for Superrational Decision Theory

  **1. The Research Question**

  The Luring Lottery is a decision-theoretic puzzle in which $N$ participants may mail a postcard containing a positive integer. If exactly one postcard arrives, that sender wins a dollar amount equal to the integer written. If zero or multiple postcards arrive, no one wins. Standard Causal Decision Theory (CDT) prescribes mailing a card: since my physical action cannot causally influence yours, mailing is weakly dominant. However, proponents of superrationality argue that if we are identical reasoners facing identical problems, we must output the same strategy. If we all mail, everyone loses. If we all abstain, everyone loses. The superrational verdict is often presented as a coordination problem requiring a symmetric mixed strategy or a focal point, yet it frequently collapses into a paradox where rational agents seemingly leave money on the table to avoid correlation-induced failure.

  This proposal seeks to resolve whether superrationality constitutes a distinct normative principle of choice or merely the degenerate endpoint of a continuous parameter governing logical correlation. I introduce a parameter $q \in [0, 1]$, representing the common knowledge probability that any other player's decision is produced by the same reasoning process as mine (a "clone"), versus being independent. At $q=0$, the game reduces to standard independence (CDT verdict: mail). At $q=1$, it becomes the standard superrational setup. The central research question is: **Is the optimal strategy function $S(q)$ continuous at $q=1$?**

  If $\lim_{q \to 1} S(q) = S(1)$, then superrationality is simply the limit of standard evidential reasoning under high correlation, possessing no unique normative force. If the function is discontinuous—if the prescription at $q=0.999$ differs radically from $q=1$—then superrationality relies on a fragile, perhaps metaphysical, assumption of perfect identity that vanishes under any uncertainty. This project will formalize the $q$-game to determine if the "superrational verdict" survives the approach to the limit, or if it is an artifact of binary modeling.

  **2. Background and Problem Statement**

  The current literature on the Luring Lottery and related symmetric dilemmas (such as the Prisoner's Dilemma with twin prisoners) suffers from a bifurcated stalemate. On one side, causal decision theorists dismiss superrationality as "magical thinking," arguing that an agent's reasoning process cannot causally influence a distant agent's hand. They assume $q=0$ by fiat, treating the correlation between agents as spurious. On the other side, superrationalists assume $q=1$ by fiat, treating the correlation as absolute and normative. Both camps assume their verdict rather than deriving it from a unified framework.

  This binary framing smuggles in a critical parameter. In realistic scenarios, particularly those involving artificial intelligence or biological evolution, agents are rarely perfectly identical nor perfectly independent. They share source code, training data, or evolutionary history to varying degrees. By treating $q$ as binary, existing models obscure the topological structure of the solution space. If rationality is a robust concept, small perturbations in the assumptions of correlation should not yield phase shifts in prescribed action unless there is a underlying structural discontinuity.

  Furthermore, the standard superrational analysis often leaves the prescription indeterminate. If we all reason alike, and mailing leads to zero payoff, we should all not mail. But if we all don't mail, the payoff is also zero. A single defector would win. Thus, the superrational solution requires a symmetric mixed strategy where the expected number of cards is exactly one. However, it remains unclear whether this mixed strategy is stable as $q$ varies. Does the probability of mailing decrease smoothly as $q$ increases, or does it crash to zero only at the exact point of perfect identity? By leaving $q$ implicit, current discussions fail to capture whether the "cooperative" or "coordinated" outcome is a stable attractor for near-identical agents or a precarious singularity. This project addresses this gap by explicitly modeling the transition.

  **3. Methodology**

  The project will proceed in three phases of formalization and analysis.

  *Phase 1: Formalizing the $q$-Game.*
  I will construct a utility function $U_i(a_i, a_{-i})$ for player $i$ choosing action $a_i$ (mailing integer $k$ or abstaining). The core innovation is modeling the distribution of other players' actions conditional on $i$'s reasoning. Let $P(\text{clone}) = q$. If player $j$ is a clone, $a_j = a_i$. If player $j$ is independent (probability $1-q$), $a_j$ is drawn from a population distribution $D$. I will derive the expected utility $E[U|q, \sigma]$ for a strategy $\sigma$. This requires solving for the probability that exactly one card arrives given that I mail, which depends on the probability that all $N-1$ other players abstain. This probability is a function of $q$ and the baseline abstention rate of independent agents.

  *Phase 2: Solving for Equilibrium and Limits.*
  I will solve for the Nash Equilibrium (or the appropriate rationalizability concept for single-agent decision theory) as a function of $q$.
  1.  **Pure Strategies:** I will first determine if there are pure strategy equilibria for $q \in (0, 1)$. Given the weak dominance of mailing in the independent case, I expect a threshold $q^*$ below which mailing is strictly dominant.
  2.  **Mixed Strategies:** Since the superrational solution at $q=1$ typically requires randomization (to ensure exactly one card is sent in expectation), I will solve for the mixed strategy $\sigma^*(q)$ that maximizes expected utility. I will analyze the function $\sigma^*(q)$ for continuity. Specifically, I will check if $\lim_{q \to 1} \sigma^*(q)$ equals the standard superrational mixed strategy.
  3.  **Two-Type Variants:** To test robustness, I will model a population with two reasoning types: a fraction $\alpha$ with $q=1$ (superrational) and $1-\alpha$ with $q=0$ (causal). This tests whether the superrational prescription is stable when not universally shared, even among those who believe they are identical.

  *Phase 3: Limit Analysis.*
  The mathematical core of the project is the analysis of the limit behavior. I will employ fixed-point theorems to determine if the solution at $q=1$ is the unique continuous extension of the solutions for $q < 1$. If the limit does not exist, or if it differs from the $q=1$ solution, this indicates that superrationality relies on a discontinuity in the reasoning space. I will also examine the sensitivity of the solution to $N$ (number of players). As $N \to \infty$, does the threshold for mailing vanish, or does the superrational constraint hold firm?

  **4. Expected Outcomes and Failure Conditions**

  A successful outcome will provide a definitive characterization of the $q$-strategy function.
  *   **Result A (Continuity):** If $S(q)$ is continuous, superrationality is vindicated as a robust extension of evidential reasoning. The "paradox" dissolves into a gradient of correlation. This would suggest that agents should act "superrationally" whenever correlation is sufficiently high, without needing a distinct metaphysical principle.
  *   **Result B (Discontinuity):** If $S(q)$ is discontinuous at $q=1$, it suggests superrationality is a fragile construct. It would imply that unless agents are *perfectly* identical, they should revert to causal dominance. This would severely limit the applicability of superrationality to real-world scenarios where perfect identity is impossible.
  *   **Result C (Ill-posed):** If the equilibrium is undefined for intermediate $q$ (e.g., due to infinite regress in reasoning about reasoning), it suggests the framework itself is flawed.

  **Failure Conditions:**
  The project would be considered to have failed if the model merely relabels the existing Evidential Decision Theory (EDT) vs. CDT dispute without generating new mathematical insights. For example, if $q$ turns out to be mathematically isomorphic to the conditional probabilities in standard EDT, the project adds no value. To avoid this, I will focus specifically on the *limit behavior* and the *symmetry constraints*, which are not standard features of EDT. Additionally, if the mathematics proves intractable for $N > 2$, the scope will be narrowed to the dyadic case, but the philosophical conclusion regarding the continuity of rationality will still hold.

  **5. Scope and Timeline**

  This project is scoped realistically for a ten-week summer grant.

  *   **Weeks 1-3:** Formalization. Define the utility functions and probability distributions for the $q$-game. Review existing formalizations of symmetric games to ensure no duplication of the specific $q$-parameterization.
  *   **Weeks 4-7:** Analysis. Solve for equilibria in the pure and mixed cases. Perform the limit analysis $\lim_{q \to 1}$. This will involve computational simulation for larger $N$ to verify analytical results derived for small $N$.
  *   **Weeks 8-10:** Synthesis and Writing. Interpret the mathematical results in the context of decision theory. Draft the final paper focusing on the implications for the normative status of superrationality.

  The scope is limited to the Luring Lottery structure to ensure depth over breadth. While the results may generalize to Prisoner's Dilemmas or Public Goods Games, extending the model to those domains is outside the scope of this summer grant. The focus remains on the continuity of the reasoning principle itself.

  **6. Significance**

  Resolving the status of superrationality has implications beyond academic decision theory. As we deploy autonomous agents and AI systems that may share source code or training architectures, the assumption of independence ($q=0$) becomes increasingly untenable. If superrationality is merely a continuous function of correlation, we can program agents to cooperate proportionally to their code similarity. If it is a discontinuous singularity, then near-identical agents may still defect, leading to suboptimal outcomes in multi-agent systems. By determining whether the "superrational verdict" is a robust limit or a fragile ideal, this project clarifies the requirements for coordination in high-stakes, high-correlation environments. It moves the debate from metaphysical speculation about "logical causation" to analyzable properties of strategy spaces, offering a determinate answer to a question that has remained open for decades.
