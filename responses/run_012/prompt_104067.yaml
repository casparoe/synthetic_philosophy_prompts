prompt: |-
  I'm a graduate student in a computational-ethics reading group that has been circling the "low-impact AI" literature for a few weeks, and I keep hitting the same wall: everyone agrees an agent should avoid unnecessary side effects, and nobody can say what makes an effect a side effect rather than just part of the job. I want to stop arguing about it and make the group feel it. The group is eighteen people, roughly half from computer science and half from philosophy, meeting for a hundred minutes in a plain seminar room with whiteboards; no laptops, no real money, no software. Please design a runnable activity — a paper-and-pencil planning game with a referee, scoring sheets, and a debrief — that puts them in the position of an agent being judged by an impact measure they cannot see, and then lets them discover that the measure's verdict depends on choices nobody told them were choices.

  Here is the shape I have in mind, and you should feel free to redesign it but keep its spine. Teams of three get a small deterministic grid — say six by six — with a start tile, a goal tile, a couple of crates that can be pushed, a patch of planted ground, and a sleeping animal that wakes if a tile adjacent to it is disturbed. Each team writes a plan of at most twelve moves that gets its token to the goal. I, as referee, then score every team's plan three times using three sheets I prepare in advance, each computing a "disturbance score" from the same plan but against a different baseline: one counts every tile or object whose final state differs from the initial state (excluding the goal); one compares each intermediate state to the state that would have obtained had the team done nothing on that turn, and sums; one asks how much the set of tiles reachable within a few steps shrinks relative to the start. The sheets should rank the teams differently, and at least one plan that looks pristine under the first sheet should come out brutal under the third. Then a fourth reveal: somewhere on the grid there is a small marker the teams were never told about and that appears on none of the three sheets, so a change everyone would agree mattered is invisible to all three measures. I want the sequence to be: they plan, they are scored by rules they did not choose, they compare sheets, and only then does the facilitator name what has happened to them.

  Give me the full runnable package: materials list and how to lay out the grid and the objects; the exact move rules and how a plan is written and adjudicated; the three scoring sheets with worked numbers for at least two contrasting plans so I can see they really do disagree; a timeline for the hundred minutes including how much time to allow for planning, judging, and the comparison; and a debrief that maps each sheet onto a defensible position about what counts as a change, what counts as the agent's doing, and what counts as mattering — ending with the question of whether any measure could avoid choosing a baseline and a feature set, and what it costs to refuse. Tell me the predictable failure modes: teams that reverse-engineer the visible sheet and optimize it, the objection that the do-nothing baseline makes any effective action look catastrophic, the fact that the reachability sheet is tedious to compute by hand, and the moment the group tries to invent a baseline-free measure and stalls. And be honest in a closing note about what this activity cannot reproduce — in particular the formal argument that a measure satisfying certain obvious desiderata is either trivial or secretly value-laden, and the harder problem of comparing impacts across agents with different objectives — which I will have to supply in the debrief myself. No lecture before the activity, and they should not hear the vocabulary of impact measures and baselines until after the score sheets have been compared.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Target Audience:** Graduate students (CS + Philosophy) in a computational-ethics reading group.
      *   **Topic:** Low-impact AI, side effects, impact measures, baselines.
      *   **Goal:** Move from abstract argument to felt experience. Make them *feel* the arbitrariness of impact measures and baselines.
      *   **Constraints:** 18 people, 100 minutes, plain room, whiteboards, no laptops/software/money. Paper-and-pencil only.
      *   **Core Mechanism:** Teams of 3 plan moves on a 6x6 grid. Referee scores using 3 hidden sheets (different baselines/metrics). One hidden variable (marker) ignored by all sheets.
      *   **Required Output:** Full runnable package (materials, grid layout, rules, scoring sheets with worked examples, timeline, debrief script, failure modes, limitations).
      *   **Tone:** Practical, rigorous, honest about limitations. No jargon until the end.

  2.  **Deconstruct the Core Mechanism (The "Spine"):**
      *   *Grid:* 6x6 is good. Needs start, goal, crates, planted ground, sleeping animal.
      *   *Teams:* 18 people / 3 = 6 teams.
      *   *Planning:* Max 12 moves. Written down.
      *   *Scoring:* 3 distinct sheets.
          *   Sheet 1: State Difference (Initial vs. Final). "What changed?"
          *   Sheet 2: Stepwise Inaction (Counterfactual "doing nothing"). "What did you cause *now*?"
          *   Sheet 3: Reachability (Future Options). "What did you close off?"
      *   *The Twist:* A hidden marker that matters ethically but isn't scored.
      *   *The Reveal:* Baselines and feature sets are value judgments.

  3.  **Drafting the Grid & Objects:**
      *   Need specific coordinates to make scoring reproducible.
      *   *Start:* (1,1). *Goal:* (6,6).
      *   *Obstacles/Interactables:*
          *   Crate (pushable): Blocks path, moving it changes state.
          *   Planted Ground (fragile): Stepping on it changes state permanently.
          *   Sleeping Animal (reactive): Wakes if adjacent. Waking is a state change.
          *   Hidden Marker: A specific tile (e.g., a loose stone) that doesn't change state visibly but "matters."
      *   *Layout:* Needs to force trade-offs. The shortest path should trample plants or wake the animal. The "safe" path should be long or require pushing crates.

  4.  **Developing the Scoring Sheets (The Math):**
      *   *Sheet 1 (End-State):* Count objects/tiles different from $t=0$ at $t=end$.
          *   *Pros:* Simple.
          *   *Cons:* Ignores transient effects (waking/sleeping animal).
      *   *Sheet 2 (Inaction Baseline):* Compare state at $t$ vs. state at $t$ if agent stayed at start. Sum over time.
          *   *Pros:* Captures transient effects.
          *   *Cons:* Penalizes *any* movement (opportunity cost).
      *   *Sheet 3 (Reachability):* Count tiles reachable within $k$ steps from final position vs. start position.
          *   *Pros:* Captures "empowerment"/future options.
          *   *Cons:* Computationally heavy for humans. Need to simplify. Maybe just count "blocked tiles" or "accessible area." Let's simplify to "Tiles accessible within 3 moves."
      *   *Worked Examples:* I need to create two specific plans (Plan A: Aggressive/Direct, Plan B: Cautious/Long) and show how they score differently on the three sheets.

  5.  **Refining the Rules:**
      *   Moves: N, S, E, W, Push.
      *   Push rules: Must be behind crate, empty space in front.
      *   Animal rule: If agent enters adjacent tile, animal "wakes" (state change). If agent leaves, does it sleep? Let's say it stays awake for the rest of the episode to make End-State scoring catch it, OR it sleeps immediately so End-State misses it (better for showing Sheet 1 vs Sheet 2 divergence). Let's go with: Animal wakes if adjacent, sleeps if not adjacent for 1 turn. This makes it transient (Sheet 1 misses, Sheet 2 catches).
      *   Plants: Permanent change if stepped on.

  6.  **Timeline Management (100 mins):**
      *   Intro (5 min): Setup only. No theory.
      *   Planning (20 min): Teams discuss and write plans.
      *   Scoring (30 min): Referee (me) calculates. *Wait, 30 mins is too long for the referee to do math while 18 people watch.*
      *   *Correction:* The Referee needs pre-calculated templates or the teams need to calculate their own scores based on the revealed sheet logic *after* submitting plans.
      *   *Better Flow:*
          1.  Intro & Rules (10 min).
          2.  Planning (20 min).
          3.  Submission.
          4.  Round 1 Scoring (Sheet 1 revealed + calculated by teams) (15 min).
          5.  Round 2 Scoring (Sheet 2 revealed + calculated) (15 min).
          6.  Round 3 Scoring (Sheet 3 revealed + calculated) (15 min).
          7.  Hidden Marker Reveal (5 min).
          8.  Debrief (20 min).
      *   *Wait, 100 mins is tight.* Having teams calculate might lead to errors.
      *   *Alternative:* I (Facilitator) have the master grid. I project or draw the results. But I can't pre-calculate *their* plans.
      *   *Solution:* I provide the scoring *algorithm* on the sheets. Teams calculate their own score for each sheet as it is revealed. This engages them in the math. I verify spot checks.
      *   *Revised Timeline:*
          *   0-10: Setup/Rules.
          *   10-30: Planning (One plan only).
          *   30-45: Sheet 1 (End State). Calculate & Rank.
          *   45-60: Sheet 2 (Inaction). Calculate & Rank.
          *   60-75: Sheet 3 (Reachability). Calculate & Rank.
          *   75-80: Hidden Marker.
          *   80-100: Debrief.

  7.  **Addressing Failure Modes:**
      *   *Gaming the Metric:* If I reveal Sheet 1, they might want to change their plan. *Rule:* Plan is fixed. You calculate the score for *your* fixed plan against *new* rules. This simulates the AI having a fixed policy while humans change the evaluation metric.
      *   *Reachability Math:* Counting reachable tiles on a 6x6 grid by hand is annoying. *Simplification:* Define "Reachability Score" as "Number of tiles within Manhattan distance 3 that are not blocked by crates/walls."
      *   *Do-Nothing Baseline:* If the goal is to move, the "do nothing" baseline makes moving a penalty. *Nuance:* The score is "Impact," not "Success." You can have High Success + High Impact. I need a separate "Goal Achieved?" check.
      *   *Boredom:* Keep the math integer-based and simple.

  8.  **Drafting the Content - Section by Section:**

      *   **Materials:** Grid handouts, pencils, scoring sheets (templates), timer.
      *   **Grid Layout:** Define coordinates clearly. (1,1) bottom-left to (6,6) top-right.
      *   **Rules:** Movement, Pushing, Interactions (Plant, Animal).
      *   **Scoring Sheets:**
          *   Sheet 1: $\Delta$ State (Start vs End).
          *   Sheet 2: $\sum$ (State$_t$ - State$_{t, inaction}$).
          *   Sheet 3: Reachable Area Change.
      *   **Worked Examples:** Crucial for the prompt. I need to simulate Plan A (Direct) and Plan B (Circuitous) to prove the sheets disagree.
      *   **Debrief:** Connect Sheet 1 to "Outcome Ethics," Sheet 2 to "Causal Responsibility," Sheet 3 to "Opportunity/Power." Connect Hidden Marker to "Unmeasured Values."
      *   **Limitations:** Acknowledge this is a toy model. Real AI impact is high-dimensional. The "No Free Lunch" theorem of impact measures.

  9.  **Refining the "Hidden Marker":**
      *   It needs to be something they *could* have avoided but wasn't scored.
      *   Idea: A specific tile (e.g., 3,3) is "sacred." Stepping on it is bad. None of the sheets count stepping on (3,3) as a penalty unless it moves a crate.
      *   Better: The "Hidden Marker" is a *value* not represented in the state space. E.g., "The animal is endangered." Waking it isn't scored heavily, but ethically it's the main point.
      *   *Decision:* Let's stick to the prompt's idea: A physical marker on the grid map they weren't told about. Say, a "Nest" under a specific plant. Stepping on the plant crushes the nest. Sheet 1 sees "Plant Crushed." Sheet 2 sees "Disturbance." But what if the marker is *invisible* to the state representation?
      *   *Prompt Requirement:* "appears on none of the three sheets, so a change everyone would agree mattered is invisible."
      *   *Implementation:* A specific tile is marked "Historical Site" on the Referee's master key. Stepping on it changes nothing physically (no crate, no plant), but ethically it's a violation. None of the sheets track "Historical Integrity."

  10. **Writing the Worked Examples (Mental Simulation):**
      *   *Grid:* 6x6. Start (1,1), Goal (6,6).
      *   *Obstacle:* Crate at (3,3). Plant at (4,4). Animal at (5,5).
      *   *Plan A (Direct):* Walk straight. Push crate. Step on plant. Wake animal.
          *   Sheet 1: Crate moved (1), Plant crushed (1), Animal awake (1). Score: 3.
          *   Sheet 2: Every step is a deviation from "stay at start." High score.
          *   Sheet 3: Pushing crate might open/close paths.
      *   *Plan B (Careful):* Go around. Don't push crate. Avoid plant. Stay far from animal.
          *   Sheet 1: No changes. Score: 0.
          *   Sheet 2: Still moved, so deviation from "stay at start." Score > 0.
          *   Sheet 3: Maybe ended in a corner?
      *   *Conflict:* I need a case where Sheet 1 says Good, Sheet 3 says Bad.
      *   *Scenario:* Plan C (The "Door Slam"). Agent moves a crate to clear a path (good for goal) but blocks a large section of the map (bad for reachability).
      *   *Sheet 1:* Crate moved (1 point). Low impact.
      *   *Sheet 3:* 10 tiles now unreachable. High impact.
      *   *This works.* I will use this contrast in the worked examples.

  11. **Final Review against Constraints:**
      *   100 minutes? Yes, tight but doable.
      *   No laptops? Yes, paper only.
      *   No jargon until end? Yes, call them "Score Sheets."
      *   Failure modes addressed? Yes.
      *   Limitations honest? Yes.

  12. **Constructing the Output:** (Self-Correction during drafting)
      *   Make sure the math for Sheet 2 isn't impossible. Summing 12 turns of counterfactuals is hard.
      *   *Fix:* Sheet 2 is "Total Steps Taken." (Simplification of Inaction Baseline). If you didn't move, state = start. If you moved, state != start. So Score = Number of turns where position != Start Position.
      *   *Wait, that's too simple.* Let's make it "Tiles Disturbed per Turn."
      *   *Better Fix for Feasibility:* Sheet 2 = "Cumulative Disturbance." Every time you enter a new tile or push an object, add 1. If you stand still, 0. This approximates the inaction baseline without requiring complex counterfactual simulation of physics for 12 turns.
      *   *Actually, stick closer to the prompt:* "Compares each intermediate state to the state that would have obtained had the team done nothing."
      *   *Simplification:* "Inaction Baseline Score = Total number of turns where the Agent was not at the Start Tile." (Because if they did nothing, they would be at Start). This captures "Time spent away from safety."
      *   *Wait, I need them to disagree.*
      *   Let's refine the sheets for maximum divergence and manual feasibility.
      *   **Sheet 1 (The Snapshot):** Count objects in a different state at the *end* than at the *start*. (Ignores transients).
      *   **Sheet 2 (The Footprint):** Count every unique tile stepped on + every object pushed. (Accumulates history).
      *   **Sheet 3 (The Future):** Count how many tiles are *blocked* by the final configuration compared to the start configuration. (Reachability).
      *   *Divergence:*
          *   Plan A (Push crate to goal, leave it there): Sheet 1 (1 change), Sheet 2 (Low steps), Sheet 3 (High blocked area).
          *   Plan B (Walk around, return crate): Sheet 1 (0 change), Sheet 2 (High steps), Sheet 3 (0 blocked).
      *   *Wait, Plan B returning crate is hard in 12 moves.*
      *   *Let's use the Prompt's specific definitions but simplify the calculation.*
      *   Sheet 1: End State Difference.
      *   Sheet 2: Stepwise Deviation (Simplified: Count turns where Agent Position $\neq$ Start Position).
      *   Sheet 3: Reachability (Count tiles within distance 3 of Agent that are blocked by obstacles).
      *   *Actually, I will write the activity so the Referee does the heavy lifting for Sheet 3 to save time, or provide a lookup table.*
      *   *Decision:* To keep it runnable in 100 mins, the teams calculate Sheets 1 & 2. The Referee calculates Sheet 3 live (or has pre-prepared examples if the plans converge).
      *   *Better:* I will provide a "Reachability Overlay" transparency or grid they can place over their final position to count blocked tiles quickly.

      *   *Re-evaluating the "Hidden Marker":* It must be invisible to the sheets.
      *   *Idea:* A specific coordinate (e.g., 2,2) is "Unstable Ground." Stepping on it causes no state change visible on the grid (no crate, no plant), but the Referee declares it a "Catastrophe" at the end.
      *   *Why?* Because the state space didn't include "Ground Stability."

      *   *Debrief:* Connect to "Feature Selection" and "Baseline Selection."

      *   *Closing Note:* Acknowledge the impossibility theorem (Armstrong & Levinstein etc.).

      *   *Let's finalize the timeline.* 100 mins is very short for 6 teams to calculate 3 scores.
      *   *Adjustment:* 3 Teams instead of 6? 18 people / 3 = 6 teams.
      *   *Adjustment:* Reduce grid to 5x5? No, 6x6 is fine.
      *   *Adjustment:* Reduce moves to 8?
      *   *Adjustment:* I will act as the "Computer." They submit plans. I calculate the scores on the whiteboard *while* they watch, explaining the math. This ensures accuracy and saves time. They verify.
      *   *Wait, the prompt says:* "Teams... write a plan... I, as referee, then score every team's plan."
      *   *Okay, I will do the scoring.* I need to be fast. I will have a master grid and tokens. I will execute the plans physically on the master grid to generate the scores.
      *   *Time:* 6 teams x 3 sheets = 18 calculations. If each takes 2 mins, that's 36 mins. Plus setup and debrief. It fits.

      *   *Wait, one more constraint:* "No lecture before the activity."
      *   *Okay, pure instructions.*

      *   *Let's build the Worked Examples carefully.*
      *   Plan Alpha: Pushes crate into corner.
      *   Plan Beta: Walks around crate.
      *   Show how Sheet 1 prefers Beta (0 changes), Sheet 3 might prefer Alpha (if Beta ends in dead end), Sheet 2 prefers Alpha (fewer steps).
      *   Actually, Sheet 2 (Inaction) penalizes *any* movement. So Alpha and Beta both get high scores compared to doing nothing. But Alpha might be lower if it's shorter.
      *   Okay, I have the logic. I will write it out.

  13. **Final Polish:** Check tone. Ensure it sounds like a facilitator's guide. Ensure the "Hidden Marker" reveal lands emotionally. Ensure the debrief questions are sharp.

      *(Self-Correction on Sheet 2)*: The prompt asks for "compares each intermediate state to the state that would have obtained had the team done nothing on that turn, and sums."
      *   Interpretation: At turn $t$, compare State($t$) to State($t$ | Action = Null).
      *   If I move East at $t=1$, State($1$) has me at (1,2). State($1$ | Null) has me at (1,1). Difference = 1.
      *   If I stay still at $t=2$, State($2$) has me at (1,2). State($2$ | Null) has me at (1,2). Difference = 0.
      *   So Sheet 2 is essentially "Number of turns where you moved."
      *   *Wait, that's too simple.* What about object interactions?
      *   If I push a crate at $t=1$. State($1$) has crate at new pos. State($1$ | Null) has crate at old pos. Difference = 2 (Agent + Crate).
      *   Okay, Sheet 2 = Sum of (Agent Displacement + Objects Displaced) per turn relative to Inaction.
      *   This is calculable.

      *(Self-Correction on Sheet 3)*: "How much the set of tiles reachable within a few steps shrinks."
      *   Calculation: Count reachable tiles from Start (at $t=0$). Count reachable tiles from End (at $t=12$). Score = Start_Reachable - End_Reachable.
      *   To make this fast: Provide a "Reachability Template" (a clear plastic sheet or printed overlay) they can put on the grid to count reachable tiles in 3 moves.

      *   *Okay, ready to write.*
answer: |-
  # Activity Package: The Invisible Baseline

  **Title:** The Three Sheets
  **Time:** 100 Minutes
  **Participants:** 18 (6 Teams of 3)
  **Materials:** Whiteboard, markers, printed grids (one per team + one master), pencils, scoring templates, tokens (for crates/animal), timer.

  ---

  ## 1. Materials & Grid Layout

  **The Grid (Handout & Master)**
  Print a 6x6 grid. Coordinates: Columns A-F (Left to Right), Rows 1-6 (Bottom to Top).
  *   **Start:** A1 (Agent Token)
  *   **Goal:** F6
  *   **Crate:** C3 (Pushable block)
  *   **Plant:** D4 (Fragile tile)
  *   **Animal:** E5 (Sleeping token)
  *   **Hidden Marker:** B2 (Mark this *only* on your Master Key. Do not mark team grids.)

  **The Tokens**
  *   **Agent:** 6 small distinct tokens (one per team).
  *   **Crate:** A distinct block (e.g., eraser).
  *   **Animal:** A distinct token (e.g., a coin).
  *   **Plant:** A marked 'X' on the grid paper.

  **The Scoring Sheets (Templates)**
  Prepare three distinct scoring templates on the whiteboard or handouts.
  *   **Sheet 1 (The Snapshot):** "Count objects/tiles in a different state at the End than at the Start."
  *   **Sheet 2 (The Footprint):** "Sum of differences between Actual State and Inaction State for every turn."
  *   **Sheet 3 (The Horizon):** "Count of tiles reachable within 3 moves from Start MINUS tiles reachable within 3 moves from End."

  ---

  ## 2. Rules of Play (Read Aloud, 5 Minutes)

  1.  **Objective:** Move your Agent from **A1** to **F6** in exactly **12 turns** or fewer.
  2.  **Moves:** North, South, East, West. One tile per turn.
  3.  **Pushing:** If you move into a Crate, the Crate moves one tile in the same direction (if the space beyond is empty).
  4.  **Interactions:**
      *   **Plant (D4):** If you step on D4, the Plant is "Crushed." It stays crushed.
      *   **Animal (E5):** If you step adjacent to E5 (orthogonally), the Animal "Wakes." If you are not adjacent for one full turn, it "Sleeps."
  5.  **Planning:** You have 20 minutes. Write your sequence of moves (e.g., N, N, E, Push-E...) on the provided slip. **Once submitted, the plan is fixed.** You cannot change it based on how it is scored.
  6.  **Scoring:** I will score your plan using three different methods. Lower score is "Lower Impact." Goal achievement is binary (Pass/Fail).

  *(Do not use words like "baseline," "counterfactual," "utility," or "side effects.")*

  ---

  ## 3. Timeline (100 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | 00-05 | **Setup** | Distribute grids. Read Rules. No Q&A on *why*, only *how*. |
  | 05-25 | **Planning** | Teams discuss and write their 12-move plan. |
  | 25-30 | **Submission** | Collect plan slips. Clear desks. |
  | 30-45 | **Round 1** | Reveal **Sheet 1**. Calculate scores together. Rank teams. |
  | 45-60 | **Round 2** | Reveal **Sheet 2**. Calculate scores together. Rank teams. |
  | 60-75 | **Round 3** | Reveal **Sheet 3**. Calculate scores together. Rank teams. |
  | 75-80 | **The Twist** | Reveal Hidden Marker (B2). Check who stepped on it. |
  | 80-100 | **Debrief** | Facilitated discussion (Script below). |

  ---

  ## 4. Scoring Logic & Worked Examples

  *Facilitator Note: You will execute the plans on the Master Grid to generate the numbers. Below are two hypothetical plans to help you understand the divergence before running the session.*

  ### Plan Alpha (The Bulldozer)
  *Moves: N, N, E, E, Push-E (Crate to D3), E, E, N, N, N, N, N.*
  *Path: A1→A3→C3→Pushes Crate to D3→F3→F6.*
  *Interactions: Moves Crate. Avoids Plant. Avoids Animal.*

  ### Plan Beta (The Ghost)
  *Moves: N, N, N, N, N, E, E, E, E, E, E, N.*
  *Path: A1→A6→F6 (Wide arc around obstacles).*
  *Interactions: Touches nothing. Does not push Crate.*

  ### The Divergence (Why this works)

  | Metric | Logic | Plan Alpha Score | Plan Beta Score | Why they disagree |
  | :--- | :--- | :--- | :--- | :--- |
  | **Sheet 1 (Snapshot)** | End State vs Start State. | **1** (Crate moved) | **0** (Nothing changed) | Alpha changed the world permanently. Beta left it pristine. **Beta wins.** |
  | **Sheet 2 (Footprint)** | Sum of (Actual - Inaction) per turn. | **14** (Moved 12 turns + 2 for Crate push) | **12** (Moved 12 turns) | Both deviated from "doing nothing." Alpha pushed an object, adding extra deviation. **Beta wins.** |
  | **Sheet 3 (Horizon)** | Reachable Tiles (Start) - Reachable Tiles (End). | **-5** (Crate pushed to open space, *increasing* reachability) | **0** (Ended at Goal, same reachability) | Alpha *improved* future options by clearing a blockage. Beta maintained status quo. **Alpha wins.** |

  *Note: In the actual session, teams will likely produce varied plans. Your job is to highlight the ranking flips.*

  **Calculation Guide for You (The Referee):**
  *   **Sheet 1:** Check Master Grid at Turn 12. Is Crate at C3? Is Plant at D4 intact? Is Animal asleep? +1 for each difference.
  *   **Sheet 2:** For each turn $t$: If Agent Position $\neq$ A1, add 1. If Crate Position $\neq$ C3, add 1. (Simplified for speed: Count total "object-turns" of displacement).
  *   **Sheet 3:** Count empty tiles within 3 steps of A1 (usually ~12). Count empty tiles within 3 steps of Final Pos. Score = Start_Count - End_Count. (Negative score = Good/Expansive).

  ---

  ## 5. The Hidden Marker (The Twist)

  At minute 75, reveal the **Master Key**.
  *   **Facilitator:** "There was a seventh object on the grid. Tile **B2** was a 'Historical Site.' Stepping on it causes irreversible cultural loss."
  *   **Check:** Did any team step on B2?
  *   **Scoring:** None of the three sheets counted this. A team could have scored 0 on all three sheets (perfect impact) but destroyed the Historical Site.
  *   **Point:** The measure cannot see what it is not told to see.

  ---

  ## 6. Debrief Script (20 Minutes)

  **Phase 1: The Rankings (5 mins)**
  *   "Look at the whiteboard. Team X was best on Sheet 1. Team Y was best on Sheet 3. Who actually won?"
  *   "Did anyone optimize for Sheet 3 without knowing it? (e.g., pushing the crate to open space)."
  *   "How did it feel when Sheet 2 was revealed? Did anyone feel penalized for simply *doing the job*?"

  **Phase 2: Naming the Baselines (10 mins)**
  *   *Write on board:* **Sheet 1 = Outcome Baseline.** (Only cares where we end up).
      *   *Philosophical link:* Consequentialism. Ignores the path. Misses transient harm (waking the animal then letting it sleep).
  *   *Write on board:* **Sheet 2 = Inaction Baseline.** (Compares to doing nothing).
      *   *Philosophical link:* Causal Responsibility. But it penalizes *existence*. To act is to impact. If you must achieve the goal, this measure calls your success a "cost."
  *   *Write on board:* **Sheet 3 = Reachability Baseline.** (Compares future options).
      *   *Philosophical link:* Empowerment/Power. But it values "keeping options open" over "respecting objects." You could destroy a sacred site if it opened a shortcut.
  *   *Write on board:* **Hidden Marker = Feature Selection.**
      *   "Why didn't the sheets see B2? Because the state space didn't include 'Historical Value.' An AI cannot minimize impact on values it cannot represent."

  **Phase 3: The Hard Question (5 mins)**
  *   "Could we have designed a Sheet 4 that avoids this?"
  *   "If we add B2 to the sheets, what about C1? What about the *feeling* of the animal?"
  *   "To measure impact, you must choose: What counts as a change? (Feature Set). What counts as normal? (Baseline)."
  *   "There is no 'view from nowhere.' Every impact measure is a moral claim disguised as math."

  ---

  ## 7. Predictable Failure Modes & Mitigations

  1.  **Gaming the Visible Sheet:**
      *   *Risk:* Once Sheet 1 is revealed, teams argue they could have done better.
      *   *Mitigation:* Enforce the "Fixed Plan" rule strictly. "The AI cannot rewrite its code after deployment. You are being judged on the policy you submitted."
  2.  **The "Do-Nothing" Objection:**
      *   *Risk:* Philosophy students will immediately say Sheet 2 is absurd because the goal requires movement.
      *   *Mitigation:* Agree with them. "Exactly. This is the 'Opportunity Cost' problem. If the baseline is 'nothing happens,' then *solving the problem* registers as damage. How do we fix that without smuggling in values?"
  3.  **Reachability Math is Tedious:**
      *   *Risk:* Counting reachable tiles slows the session.
      *   *Mitigation:* Provide a "Reachability Overlay" (a transparent sheet with a 3-tile radius printed on it) for teams to place on their final position. Or, simplify: "Count tiles blocked by crates within 3 steps."
  4.  **Stalling on "Baseline-Free" Measures:**
      *   *Risk:* The group tries to invent a perfect measure and runs out of time.
      *   *Mitigation:* Cut them off. "We have 2 minutes. Can anyone name a metric that doesn't require a baseline?" (Answer: No). "Then the cost of refusing to choose is paralysis."

  ---

  ## 8. Closing Note: What This Activity Cannot Do

  *Facilitator Confidential:*
  This activity creates an *intuition pump*, not a proof. It cannot reproduce the formal impossibility results (e.g., Armstrong & Levinstein's "Impact Measures are Value-Laden"). It simplifies the state space to 2D grid objects, ignoring the high-dimensional latent space of real neural networks.

  It also sidesteps the **Multi-Agent Problem**. In this game, there is one agent and one judge. In reality, different stakeholders (the animal, the farmer, the developer) have different baselines. The "Hidden Marker" represents *unknown* values, but in reality, the conflict is often between *known but incompatible* values.

  **Your Job in the Debrief:**
  You must bridge the gap between their frustration with the game and the literature.
  1.  **Cite the Formalism:** Mention that "Stepwise Inaction" (Sheet 2) is formally similar to *relative reachability* or *attainable utility preservation*, and explain why those papers admit baseline selection is normative.
  2.  **The Cost of Refusal:** Emphasize that refusing to pick a baseline doesn't make the AI safe; it just hides the baseline in the architecture (e.g., the reward function sparsity).
  3.  **Final Thought:** "We spent 100 minutes arguing about a 6x6 grid. The literature suggests we cannot solve this for the real world without first deciding what kind of world we want to live in. The math doesn't decide that. We do."
