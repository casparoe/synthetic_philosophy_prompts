answer: |-
  **The scene**

  The regulatory canteen was emptying out, the hum of the dishwasher competing with the rain against the high windows. Ayesha stirred her coffee, watching the swirl settle. Martin sat opposite, notebook closed, hands clasped. They had been at this for years, across conferences and dinners, but never with the stakes quite this high. The air smelled of burnt toast and disinfectant. It was the right place for uncomfortable truths. They were alone enough to speak freely, but not so alone that the silence felt heavy.

  **The dialogue**

  **Ayesha:** Look at the numbers, Martin. In the default group, everyone was enrolled at eight per cent of salary. Only nine per cent opted out. That is behaviour that secures retirement. It is the cleanest evidence we have that people, when left to their own devices, fail to save enough.

  **Martin:** But behaviour isn't welfare. In the active choice group, where employees had to pick a contribution rate before a payroll deadline or get nothing, the average chosen was five point six per cent. Yet a year on, the active choosers reported higher satisfaction with their retirement saving than the defaulted group. They were far more likely to say they had thought about it properly.

  **Ayesha:** Satisfaction is fleeting. Savings are compound. If you let them choose, they choose less. The default protects them from their own myopia. You cannot measure well-being by a survey ticked boxes a year later. You measure it by whether they have money when they stop working.

  **Martin:** Here's the wrinkle you're glossing over. When you asked the defaulted group what they would have chosen had they been made to choose, a majority said a lower rate than eight per cent. While also saying they were glad to be in at eight. How do you square that with revealed preference? If preference is what you choose, they chose eight. If preference is what they want, they wanted less.

  **Ayesha:** It suggests adaptation. People come to want what they have. They are glad because the money is there. It matters less what they say they would have done than what actually lands in the pot.

  **Martin:** It matters if economics claims to track well-being. If you define preference as choice, your statement is empty—it's just a definition. If you claim choice reveals psychological desire, it's false. They are glad because they have it, not because they wanted it. You are inferring well-being from evidence that does not track it.

  **Ayesha:** Consider the third arrangement. The lock-in option. Everyone was defaulted at eight per cent, but with an option to lock the rate for five years, with a thirty-pound fee for any change. Forty per cent took the lock. Of those who later paid to change, most moved down to five per cent. That reveals a preference for commitment. They know themselves poorly enough to pay to restrict their future choices.

  **Martin:** Some do. But the lock-in group confirms the adaptation point. They lock themselves in, then realise they are cash-strapped, then pay to escape. The default simply bypasses the conflict. You're saying the regulator knows the worker's lifetime interest better than the worker at the desk.

  **Ayesha:** I'm saying the worker at the desk is not the same person as the worker at retirement. Whose preferences count? The one spending now or the one eating later?

  **Martin:** Precisely. But you're using the choice of the present self to infer the welfare of the future self, while ignoring the present self's reported dissatisfaction. You've shifted the goalposts. We started on what is good for people. Now you're arguing about administrative feasibility. You need a number to run the cost-benefit analysis.

  **Ayesha:** Alright. Let's talk about the safety case. A job carries an extra one-in-ten-thousand annual risk of a fatal accident. It pays two thousand pounds a year more. We read off a value of a statistical life of twenty million pounds. We have to. Without that figure, we cannot decide if a safety rule is worth its cost. It is revealed preference from wages.

  **Martin:** And you feed that into the model. But workers differ. Many do not know the risk. You are inferring a trade-off they never consciously made.

  **Ayesha:** I concede that information is imperfect. If they knew the risk, the premium might differ. But we cannot wait for perfect knowledge. The aggregate metric stands.

  **Martin:** So you concede the individual preference is unknowable, but the aggregate is valid?

  **Ayesha:** I concede that stated preferences are unreliable. If I ask them, they lie to themselves. What is left? Observed choices are the only hard data we have.

  **Martin:** Then you admit the framework can be badly wrong. You are inferring well-being from evidence that does not track it.

  **Ayesha:** I admit there is no neutral alternative. If I ignore the wage differential, I am still making a value judgement. I am saying safety is free. It isn't.

  **Martin:** You've moved again. From what people want to what the regulator can justify.

  **Ayesha:** Because the regulator must act.

  **Martin:** But if preference is a psychological fact, you are guessing. If it is a summary of choice, you are circular.

  **Ayesha:** Perhaps. But if I drop the default, savings drop. If I drop the VSL, safety rules vanish.

  **Martin:** So utility is sacrificed for policy stability.

  **Ayesha:** No. For outcomes.

  **Martin:** Whose outcomes? The person who is glad to be defaulted, but would have chosen less?

  **Ayesha:** The person who survives retirement.

  **Martin:** And the worker who took the risk without knowing it?

  **Ayesha:** The system protects the aggregate.

  **Martin:** You've conceded the individual is lost.

  **Ayesha:** I've conceded that perfection is impossible.

  **Martin:** Then we agree on the failure, but not the response.

  **Ayesha:** I suppose so.

  **Where it leaves the argument**

  On the pension case, Martin came out better. The paradox of the defaulted staff—glad to be saving more but admitting they would have chosen less—exposes the hollowness of treating choice as welfare. Ayesha's defence rests on adaptation, which is precisely what Martin identifies as the corruption of the preference signal. If people want what they get simply because they got it, revealed preference cannot distinguish between satisfaction and resignation.

  On the safety case, Ayesha held the ground. Martin's objection regarding imperfect information is potent, but her concession—that there is no neutral alternative—was decisive. Without the £20 million figure, regulation paralyses. Pragmatism trumped philosophical purity here; a flawed metric is superior to no metric when lives are weighed against costs.

  What remains unsettled is the ontological status of preference itself. The exchange revealed that neither observed choices nor stated attitudes offer a clean line to well-being. The regulator is left inferring the good from behaviour that may be ignorant, or from sentiments that may be adaptive. The dialogue ended in a truce, but the underlying question—whose self counts, and whether welfare is a fact to be found or a construct to be imposed—remains uncomfortably open.
