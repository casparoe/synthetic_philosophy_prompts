answer: |-
  Here is the specification. It is divided into the Phenomenological Constraints (what the world looks like), the Logical Constraints (how reasoning must work), and the Pragmatic Constraints (what you can do with it).

  Following the spec, I will break down the incompatibilities, map the major theories to their sacrifices, and identify the killer constraint.

  ### PART I: THE SPECIFICATION

  #### A. Phenomenological Constraints (The Data)
  *These are the features of the phenomenon any theory must model, not explain away.*

  **1. The Sorites Data (Both Dresses)**
  *   **Requirement:** The theory must model the intuitive validity of the Sorites induction step ("If $n$ grains is a heap, $n-1$ is a heap") while acknowledging the falsity of the conclusion ("1 grain is a heap").
  *   **The Case:**
      *   *The Heap:* We assent to the conditional premises individually. A theory that simply declares them "false" (e.g., there is a specific $n$ where it flips) contradicts our linguistic competence. We cannot identify the flip, and asserting its existence feels wrong.
      *   *The Forced March:* If you walk a subject down a line of color patches from red to orange, they will hesitate. They won't flip from "Red" to "Not Red" at a specific step $k$ and stick there. They will waver. A theory must account for this wavering without calling it "error."

  **2. Genuine Borderline Cases (Not Ignorance)**
  *   **Requirement:** The theory must treat borderline cases as distinct from cases of mere ignorance.
  *   **The Case:** If I don't know if the bank is open because I can't see the clock, that is ignorance. If I don't know if a man with 5,000 hairs is bald *even after counting the hairs*, that is vagueness. The uncertainty is not about the world; it is about the category. A theory that reduces vagueness to hidden precision (epistemicism) must explain why this ignorance is *principled* and permanent, unlike normal ignorance.

  **3. Penumbral Connections**
  *   **Requirement:** The theory must preserve logical relations between vague predicates even when truth values are indeterminate.
  *   **The Case:** If $A$ is a borderline red patch and $B$ is a borderline red patch, the sentence "$A$ is red and $B$ is red" should not be treated as logically independent coin flips. More critically: If $A$ is clearly red and $B$ is clearly orange, "$A$ is redder than $B$" must be **true**, even if "$A$ is red" and "$B$ is red" have shaky truth values. A theory that assigns independent probabilities or truth-values to $A$ and $B$ such that this connection breaks is inadequate.

  **4. Higher-Order Vagueness**
  *   **Requirement:** The boundary between "clearly $F$" and "borderline $F$" must itself be vague.
  *   **The Case:** If you draw a sharp line around the borderline cases, you have created a new predicate ("is borderline") that is precise. But "is borderline" is itself vague. There are cases where we don't know if the case is borderline or clearly false. A theory that posits a sharp set of borderline cases (like a three-valued logic with fixed boundaries) merely relocates the Sorites paradox to the boundary of the middle value.

  #### B. Pragmatic Constraints (The Use)
  *These are often ignored by metaphysicians but are required for the theory to be useful.*

  **5. The Decision Procedure Constraint (The Building Code)**
  *   **Requirement:** The theory must license a specific normative stance toward borderline cases in regulatory contexts.
  *   **The Case:** You have a rule: "No tall buildings." You have a 12.4m building which is borderline tall.
      *   If the theory says "It is neither true nor false," does the engineer build or not?
      *   If the theory says "It is true to degree 0.6," does 0.6 pass code?
      *   *The Deliverable:* The theory cannot stop at truth conditions. It must provide an **assertibility condition** or a **decision rule**. It must tell you whether "borderline" functions as a permission, a prohibition, or a call for discretion. A theory that leaves the agent paralyzed in the penumbra fails this spec.

  **6. Communicative Stability**
  *   **Requirement:** The theory must explain how communication succeeds despite vagueness.
  *   **The Case:** If "tall" has no stable extension, or if its truth value fluctuates wildly between speakers, we should talk past each other constantly. We don't. Two people can agree a man is tall without agreeing on the exact cutoff. The theory must explain what is being shared (concepts? standards? prototypes?) that allows coordination without precision.

  ---

  ### PART II: DESIDERATA VS. PREJUDICES

  You asked to separate the real requirements from the methodological baggage.

  **1. The Demand for "No Sharp Boundary" (Real Desideratum)**
  *   **Verdict:** **Real.**
  *   **Reasoning:** This is the phenomenological datum. When you look at a sunset, there is no moment day becomes night. To assert there *is* a moment, even if unknowable, contradicts the experience of the phenomenon. Any theory that posits a sharp boundary is correcting the data rather than saving it.

  **2. The Demand for Classical Logic / Bivalence (Prejudice)**
  *   **Verdict:** **Prejudice.**
  *   **Reasoning:** This is a methodological commitment, not a datum. We *like* Classical Logic (CL) because it makes math easy and proofs clean. But there is no evidence that natural language *obeys* CL in the penumbra. Insisting on CL (specifically the Law of Excluded Middle: $P \lor \neg P$) forces the theory to posit sharp boundaries or truth-value gaps that behave like classical values. This demand is doing "quiet work" to protect logical systems, not to explain language.

  **3. The Demand for "Tolerance" (Real Desideratum)**
  *   **Verdict:** **Real.**
  *   **Reasoning:** This is the meaning of the predicate. If removing one hair *could* make a man bald, the word "bald" would mean something different than it does. Tolerance is constitutive of the concept.

  ---

  ### PART III: THE IMPOSSIBLE TRINITY (The Trilemma)

  You suspected you couldn't have it all. You are right. There is a formal inconsistency between three core requirements. You must drop one.

  **The Three Rails:**
  1.  **Tolerance:** A difference too small to matter cannot flip the truth value of the predicate. (If $x$ is $F$, and $y$ differs imperceptibly from $x$, $y$ is $F$).
  2.  **Classical Logic (Bivalence):** Every proposition is either True or False. No gaps, no degrees.
  3.  **No Sharp Boundaries:** There is no specific point in the series where the predicate flips from True to False.

  **The Contradiction:**
  If you have a series from Clear $F$ to Clear Not-$F$, and you have **Classical Logic**, every step must be T or F. If you have **No Sharp Boundaries**, there is no step where it flips from T to F. But if it never flips, and you start at T, you must end at T (via **Tolerance**). But you end at Not-$F$. Contradiction.

  **Which Theory Drops Which Rail?**

  1.  **Epistemicism (e.g., Timothy Williamson)**
      *   **Drops:** **No Sharp Boundaries.**
      *   **The Move:** There *is* a sharp cutoff (a specific hair count where baldness begins). Classical Logic and Tolerance (as a semantic rule) are kept, but Tolerance is false as a metaphysical claim.
      *   **Cost:** You must accept that there is a fact of the matter we can never know, and that "bald" behaves like a precise scientific term hidden from us. It fails the "Genuine Borderline" spec (treats it as ignorance).

  2.  **Degree Theory / Fuzzy Logic (e.g., Machina)**
      *   **Drops:** **Classical Logic (Bivalence).**
      *   **The Move:** Truth comes in degrees (0 to 1). Tolerance is preserved (truth value changes slightly per step). No sharp boundary (the slide is continuous).
      *   **Cost:** It struggles with **Higher-Order Vagueness** (where do you draw the line between degree 0.5 and 0.51?) and **Penumbral Connections** (standard fuzzy logic can violate logical truths like $P \to P$). It also fails the **Decision Procedure** spec (is 0.51 tall enough for a permit?).

  3.  **Supervaluationism (e.g., Fine, Keefe)**
      *   **Drops:** **Tolerance (effectively) / Keeps Classical Logic (globally).**
      *   **The Move:** A statement is "Super-True" if it is true on all *precisifications* (ways of making the language precise). "This man is bald or not bald" is Super-True (preserving Classical Logic). But "This man is bald" is neither Super-True nor Super-False in the penumbra.
      *   **Cost:** It posits sharp boundaries on every *precisification*, even if not on the language itself. It struggles badly with **Higher-Order Vagueness** (defining the set of admissible precisifications requires a sharp boundary). It fails the **Decision Procedure** spec (if a statement is neither true nor false, the logic doesn't tell the engineer what to do).

  4.  **Contextualism (e.g., Raffman, Soames)**
      *   **Drops:** **Tolerance.**
      *   **The Move:** The boundary *does* shift, but the *context* shifts with it. When you get too close to the boundary, the context changes to move the boundary away. Tolerance holds only within a context, not across the whole march.
      *   **Cost:** It makes communication fragile (Communicative Stability). It requires a complex psychology of context-shifting to explain why we *feel* like there is no boundary.

  ---

  ### PART IV: THE KILLER CONSTRAINT

  You asked for the single requirement that eliminates the most theories.

  **The Winner: Higher-Order Vagueness.**

  **Why:**
  It is the graveyard of neat solutions.
  *   **Three-valued logics** die immediately (they draw a sharp line around the middle value).
  *   **Standard Supervaluationism** dies because the set of "admissible precisifications" must itself be vaguely bounded, leading to regress.
  *   **Simple Degree Theories** die because the transition from "degree 1" to "degree <1" is itself a sharp boundary unless you introduce degrees of degrees (ad infinitum).

  **The Runner Up (For You): The Decision Procedure Constraint.**
  While Higher-Order Vagueness kills the most *semantic* theories, your **Building Code Requirement** kills the most *philosophical* theories.
  *   **Epistemicism** tells the engineer: "There is a fact, but you can't know it." (Useless for regulation).
  *   **Supervaluationism** tells the engineer: "It is neither true nor false." (Does the law forbid indeterminate acts? Usually yes, but the theory doesn't say).
  *   **Degree Theory** tells the engineer: "It is 0.6 true." (Does the law accept 0.6?)

  **Final Verdict:**
  If you want a theory that works for a rules engine, **Degree Theory with a Threshold** is the only one that offers a decision procedure, but it violates Classical Logic. If you demand Classical Logic, you must accept **Epistemicism**, which admits the theory cannot help you find the boundary.

  **The Hard Truth:**
  You cannot have a theory that satisfies **Classical Logic**, **No Sharp Boundaries**, and **Action-Guidance** simultaneously.
  *   To get Action-Guidance, you need a decision rule (a sharp cutoff for the *rule*, even if the *concept* is vague).
  *   To get Classical Logic, you need a sharp cutoff for the *concept*.
  *   To get No Sharp Boundaries, you lose the ability to derive a binary decision from the semantics alone.

  **Recommendation:** For a rules engine, adopt **Contextualism with a Meta-Rule**. The predicate "tall" is vague (no sharp boundary), but the *regulation* "No buildings over 12.5m" replaces the vague predicate with a precise one. The theory of vagueness explains why we needed to write the precise rule, but the precise rule overrides the vague predicate for the sake of the Decision Procedure. Do not try to make the vagueness theory do the work of the law.
