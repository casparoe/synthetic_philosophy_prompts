answer: |-
  The single most damaging fact you need to face is this: your proposed test will never work. You asked for a case where classical reasoning leads to an answer you can check by hand, proving the Law of Excluded Middle isn't just a habit. But classical logic is conservative over constructive logic for concrete arithmetic. When dealing with finite calculations—things you can actually check by hand—both systems agree. Classical mathematics might use the Excluded Middle to take a shortcut through infinity to find a number, but it will not produce a false numerical result that you can verify. You will never find a sum where classical maths says '5' and constructivism says 'not 5'. They differ on the *meaning* of infinite statements, not on finite outputs. Your criterion for being moved is impossible to satisfy.

  This leads to the second, more philosophical threat: your friend is right. Your view is a form of semantic anti-realism. If truth requires the possibility of verification, then statements about the past ('Caesar crossed the Rubicon') or other minds ('She is in pain') become problematic if evidence is lost or inaccessible. To hold your view, you must either accept that much ordinary talk is illegitimate (a hard pill to swallow) or explain why mathematics is special. Why does 'truth' mean 'provability' for numbers but 'correspondence to fact' for history? If you cannot draw that line principledly, your position collapses into general scepticism. If you can, you owe us an explanation of what makes maths unique.

  Regarding the technical nagging points: yes, in some constructive set theories, the Axiom of Choice implies the Law of Excluded Middle (Diaconescu's theorem). This isn't a scandal; it just means constructivists must reject the full Axiom of Choice. Similarly, the result that 'all functions are continuous' is a feature of Brouwer's intuitionism, but not necessarily of all constructivism (e.g., Bishop's constructivism avoids this). These are technical costs, not fatal blows.

  Now, be straight about falsifiability: your view is not empirically falsifiable. It is not a scientific hypothesis about the world; it is a proposal about how language and meaning function. Nothing could ever count against it in the way a failed experiment counts against a theory of gravity. You cannot be proven wrong by a calculation, only persuaded by a better theory of meaning.

  Is this a problem? Not necessarily. Views about meaning are judged by their utility and coherence, not their falsifiability. The question is whether the cost of reconstructing mathematics without the Excluded Middle is worth the philosophical purity. Classical mathematics is vastly simpler and indispensable for physics. If your view makes standard physics literally unintelligible (because it relies on non-constructive existence proofs), you must argue that physics is somehow 'loose' talk.

  Can the view be defended? Yes, but only by qualifying it until it becomes a specific linguistic framework rather than a discovery about reality. It survives by retreating into consistency. If you want to be moved, do not look for a calculation. Look for a reason why 'truth' should be tethered to human capacity rather than objective state. That is the only battlefield where this war is fought.
