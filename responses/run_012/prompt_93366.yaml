answer: |-
  **Setting:** *The Anchor*, a pub halfway between the Victorian terraces of Marlow Vale centre and the Meridian Retail Park. It's 7pm on a Tuesday. The air smells of stale lager and rain. Nadia and Gerald are sitting in a booth with half-finished pints. A planning document lies open on the table between them.

  **Gerald:** You're treating the Meridian like it's a village green. It's not. It's a dead zone. B&Q closed three years ago. The cinema is a storage facility for a logistics firm. It's asphalt with a permission slip waiting to be signed.

  **Nadia:** It's a dead zone because we decided commerce happens elsewhere now. But the land is still part of Marlow Vale. The proposal is 400 units. Thirty per cent "affordable". That's the hook, isn't it? You think we should swallow it because the alternative is nothing.

  **Gerald:** The alternative isn't nothing. The alternative is the developer walks, finds a greenfield site three miles out where the council is desperate enough to say yes to anything, and we get sprawl. Here, we get density. We get people near the train station. It's objectively better planning.

  **Nadia:** Objectively for whom? For the spreadsheet. For the people who will live there, it's a box. You're talking about housing as a unit of supply. I'm talking about it as a place of life. There's a difference between a right to *use* a place—a roof, a key—and a right to *shape* it.

  **Gerald:** And there's the rub. "Shape" is a weasel word. What does it mean? You want the tenants' union to approve the brick colour? The density? The mix?

  **Nadia:** I want them to have a veto on the social architecture. If you build 400 homes where the affordable ones are all on the fourth floor with no lift access because the viability assessment says so, you haven't housed people. You've segregated them.

  **Gerald:** Viability assessments are the enemy, I agree. They're where profits go to hide. But you can't legislate against greed with vague notions of "shaping". You need leverage. You need to make building cheap enough that the margin doesn't depend on skimping on the lift. If construction costs drop, the developer doesn't need to plead poverty to skip the affordable quota.

  **Nadia:** So the solution is always supply. Just build.

  **Gerald:** Yes. Just build.

  **Nadia:** That assumes the thing in dispute, Gerald. Whose preferences get counted? If you just build cheaply, you build what sells. You build for the exchange value, not the use value. You're saying the market's preference is neutral. It's not. It's a preference for asset accumulation.

  **Gerald:** It's a preference for shelter that people can actually get into. Look, let's talk about your "Proximity Principle". I've been reading your briefings. You argue that moral claim scales with loss. The longer you've lived here, the more you lose if it changes, so the more say you should have.

  **Nadia:** Stability matters. If you've built a life here, your networks, your care webs, they're local. Uprooting that costs something. Speculators don't pay that cost.

  **Gerald:** But the newcomer pays a different cost. The person currently sleeping on a friend's sofa in Slough. They need Marlow Vale more than the person who's lived in the Victorian terrace for twenty years and wants to protect their view. Your principle sounds noble, but applied strictly, it's first-come-first-served dressed up as justice. The newest arrivals—often the poorest, the migrants, the ones most in need of housing—get the weakest claim because they haven't been there long enough to "lose" anything.

  **Nadia:** That's a caricature. It's not about duration, it's about stake. A speculator buys a flat and leaves it empty. Their stake is financial. A tenant moves in and joins the union. Their stake is relational.

  **Gerald:** How do you measure relational stake? bureaucratically? You're going to issue permits based on community involvement? "Sorry, you haven't volunteered at the food bank enough to vote on the planning application"?

  **Nadia:** I'm saying the current system measures stake by capital. If you have money, you have say. I want to measure it by presence.

  **Gerald:** Presence is fleeting. Half the street turns over every three years. What is the "community" you're defending? Is it the people there now? Because in five years, they'll be gone too. If you give the current residents a right to shape the neighbourhood, you're locking in the preferences of a transient group against the needs of the future transient group. You're creating a guild of incumbents.

  **Nadia:** And if you don't? You get a hotel for capital. You get a town where nobody knows their neighbour because everyone is waiting for the price to peak so they can jump. Community isn't just statistics of turnover, Gerald. It's the capacity to act together. If people feel they have no claim on the future, they don't invest in the present. They don't fix the fence. They don't watch the kids. They leave.

  **Gerald:** So you want to force them to care?

  **Nadia:** I want to give them a reason to. If you know you can't be evicted by a rent hike, if you know the shop downstairs won't turn into a vape store because the community land trust says no, you stay. You build the stake you say I'm presupposing.

  **Gerald:** But who enforces this? You keep saying "right to the city". It's a lovely phrase. Henri Lefebvre would be proud. But rights are enforceable claims against a duty-bearer. Who has the duty here? The developer? The council? The council is skint. They can't afford to buy the land. They can't afford to build the homes. They're dependent on the developer's CIL contributions to fix the potholes.

  **Nadia:** Then the right isn't legal. It's political. It's the power to disrupt.

  **Gerald:** Ah. There it is. The right to the city is the right to throw a brick through the window if you don't like the design.

  **Nadia:** Don't be tedious. It's the power to say "no" until the "yes" is worth something. If the community can halt construction, the developer has to come to the table. That's how you get the lift on the fourth floor. That's how you get the community room instead of another gym for the penthouse.

  **Gerald:** And that makes housing expensive. Delay is cost. Uncertainty is cost. You pass that cost on to the buyer. Or you don't build at all. You're arguing for a system where housing is a political good, allocated by struggle. I'm arguing for a system where it's a utility, allocated by price, but where we make the price low enough that it doesn't matter.

  **Nadia:** It always matters. If it's allocated by price, the poor get the damp. Always. You can't engineer your way out of class.

  **Gerald:** You can engineer your way out of scarcity. Scarcity is the weapon. If there are enough homes, the landlord loses power. The developer loses power. You don't need a union if there's a vacancy rate of ten per cent. The market disciplines itself.

  **Nadia:** That's a theoretical market. We don't live there. We live in Marlow Vale, where the vacancy rate is low because the homes are second residences for people in London. You want to build more so the price drops? They'll just buy those too. They have deeper pockets than the locals.

  **Gerald:** Then you tax them.

  **Nadia:** Then you need political will. Which comes from...?

  **Gerald:** ...People voting for it.

  **Nadia:** Exactly. So we're back to power. You can't technocrat your way out of politics. You say my right to shape is unenforceable. I say your right to profit is only enforceable because the state sends bailiffs to clear the squatters. Both are fictions until someone backs them up. I'd rather back up the people who sleep here.

  **Gerald:** I worry that "people who sleep here" becomes "people who look like they belong here". Your proximity principle... it protects the incumbents. The white family in the terrace who've been there since the seventies. It doesn't protect the refugee family in the hostel who need the 400 units more than anyone. If you block the Meridian development because the design isn't perfect, where do the refugee family go?

  **Nadia:** We don't block because the design isn't perfect. We block because the deal is theft. They're taking public land, essentially, given the infrastructure support, and privatising the gain. We want the land held in trust. We want the affordable housing to be *actually* affordable, linked to local wages, not London rates.

  **Gerald:** And if the developer says no?

  **Nadia:** Then we find someone else. Or the council builds.

  **Gerald:** The council can't build. They haven't built social housing in thirty years. They don't have the capacity. They don't have the money. You're asking for a revolution in the planning department while expecting the rents to stay low.

  **Nadia:** I'm asking for the planning department to stop being a rubber stamp. You were in there, Gerald. You know the viability assessments are cooked. You know they claim they can't afford 40% affordable, then two years later the flats are sold for double the price.

  **Gerald:** I know the numbers have to balance or the bank won't lend. I'm not defending the greed. I'm defending the math. If the project doesn't pencil out, it doesn't happen. Your "right to shape" adds friction. Friction kills projects.

  **Nadia:** Good. Kill the bad projects.

  **Gerald:** Then people sleep rough.

  **Nadia:** People are sleeping rough now. In the homes you defend. Because they can't afford them. You're choosing visible homelessness over invisible exclusion. At least if they're on the street, we see the problem. If they're cramped three families to a flat in Milton Keynes, you call that a success.

  **Gerald:** (Pauses, looks at the planning document) I don't call it a success. I call it progress. It's better than the alternative.

  **Nadia:** Is it? Or is it just quieter?

  **Gerald:** (Sighs) Look. The Proximity Principle. If you really want to hold that line... you have to accept that it means saying no to the outsider. The person who isn't in the union. The person who hasn't earned their "stake". How do you reconcile that with solidarity?

  **Nadia:** Solidarity isn't open borders for capital. It's closed borders for exploitation. You can join the union. You can earn the stake. It's not ethnic, it's not ancestral. It's participatory.

  **Gerald:** It's time-based. It's exclusionary by definition.

  **Nadia:** Everything is exclusionary. A private property title excludes everyone but the owner. I'm just trying to make the exclusion collective instead of individual.

  **Gerald:** (Taps the table) Collective exclusion is still exclusion. But... (He stops) I take your point on the viability. The current system is a racket. It pretends to be neutral math but it's political choice. I concede that.

  **Nadia:** And I concede that if nothing gets built, the union is just a debating society for people who already have homes. We need the units.

  **Gerald:** So we agree. Build the homes.

  **Nadia:** No. We agree on the homes. We disagree on the shape. You want the shape decided by the speed of construction. I want it decided by the durability of the community.

  **Gerald:** Durability costs money.

  **Nadia:** So does eviction. So does homelessness. So does a town that feels like a waiting room. You think friction is the enemy. I think friction is the only thing that stops us sliding into a purely transactional existence.

  **Gerald:** (Takes a drink) You know they'll never let you have a veto. Not legally.

  **Nadia:** I don't need it legally. I need it physically. If enough people stand in the way, the diggers don't move.

  **Gerald:** That's how you lose. They'll call the police.

  **Nadia:** Maybe. Or maybe they'll realise that policing a housing development is harder than policing a retail park.

  **Gerald:** (Looks out the window towards the dark silhouette of the Meridian) You're betting on a political shift that isn't coming. The council is skint. The central government is hostile. The market is global. You're fighting with local tools.

  **Nadia:** All housing is local. You can't live in a global market. You live in a room. In a street. In a town. That's my turf. That's where I win.

  **Gerald:** And if you win? What does Marlow Vale look like in ten years?

  **Nadia:** It looks like people know each other. It looks like the shop downstairs sells bread, not vapes. It looks like the kids play outside because the cars aren't dominant. It looks like a place, not a portfolio.

  **Gerald:** And the price?

  **Nadia:** The price is that you can't get rich off it.

  **Gerald:** (Smiles, briefly) Then you'll have a fight on your hands. Because everyone wants to get rich. Even the people who claim they don't.

  **Nadia:** Not everyone. Just the people who think they need to.

  **Gerald:** (Closes the planning document) I can't sign off on the veto. You know that. As a consultant, my job is to get this built.

  **Nadia:** I know. And my job is to make sure that when it's built, it belongs to the people who live in it, not the people who sold it.

  **Gerald:** Then we're adversaries.

  **Nadia:** No. We're both trying to stop the town from dying. You think breathing means growth. I think it means staying alive.

  **Gerald:** (Stands up) I'll see what I can do about the lift on the fourth floor. I can't promise. But I can put it in the viability model as a risk factor. If you make enough noise, the risk goes up. Maybe the cost comes down.

  **Nadia:** Make the noise for us, Gerald. We'll handle the rest.

  **Gerald:** Don't push me too far.

  **Nadia:** Wouldn't dream of it.

  *Gerald puts on his coat. Nadia stays seated, watching the rain streak the window, looking out toward the dark retail park.*
