answer: |-
  This is a classic text in the history of philosophy, and your intuition is correct: Edwards is compressing a complex *reductio ad absurdum* into a dense paragraph. He is attacking the Libertarian (or Arminian) definition of freedom, which holds that for a choice to be free, it must be self-determined by the will itself, rather than determined by prior causes external to the will.

  Below, I will reconstruct the argument step-by-step, clarifying the operative definition of "freedom," and then address your four specific questions.

  ### I. Reconstruction of the Argument

  To understand the force of the passage, we must recognize that Edwards is not arguing for his own definition of freedom here. He is adopting his opponent's definition for the sake of argument to show it leads to absurdity.

  **The Operative Definition of "Free":**
  Throughout this passage, when Edwards uses the term "free act," he is using the **Libertarian/Self-Determination sense**.
  *   *Definition:* An act $X$ is free if and only if $X$ is determined by a prior act of choice by the same agent. (If $X$ is determined by anything else—necessity, nature, God, or chance—it is not free).

  **The Steps (Reconstruction):**

  1.  **Assumption for Reductio:** Assume the Will determines all its own free acts. (This is the Libertarian claim Edwards is attacking).
  2.  **Analysis of Determination:** For the Will to determine an act, it must exercise a power of choosing. Therefore, to determine a free act is to *choose* that act.
  3.  **The Regress Condition:** If Act 1 is a free act, it must be determined by a prior act of choice (Act 0).
  4.  **Iteration:** If Act 0 is also a free act (which it must be, if it is the source of freedom for Act 1), then Act 0 must be determined by a prior act of choice (Act -1).
  5.  **The Dilemma:** This chain of prior choices must either go on infinitely or stop at a "First Act."
  6.  **Horn A (The Contradiction):** If we posit a "First Act" in the chain, but maintain that every free act requires a *preceding* determining act, we are asserting there is an act preceding the first act. Edwards claims this is a contradiction (a "before the before").
  7.  **Horn B (The Unfree First):** If we avoid the contradiction by admitting there is a First Act that has *no* preceding determining act, then by the definition in Step 2, this First Act is not self-determined.
  8.  **The Transfer Principle:** If the First Act is not self-determined, it is not "free" (by the operative definition).
  9.  **Conclusion:** If the First Act is not free, it cannot confer freedom upon the subsequent acts it determines. Therefore, no act in the chain is free. The initial assumption (that the Will determines all its own free acts) is false.

  ***

  ### II. Addressing Your Four Questions

  #### (1) Contradiction vs. Infinite Regress
  You ask whether Edwards has produced a genuine contradiction or merely an infinite regress.

  Strictly speaking, Edwards has produced a **vicious infinite regress** which he *labels* a contradiction. Logically, an infinite regress is not a formal contradiction (like $P \land \neg P$). However, in early modern metaphysics, a vicious regress was often treated as equivalent to an impossibility.

  Edwards frames it as a contradiction in Step 6 ("a free act of the Will, before the first free act of the Will"). His reasoning is conceptual: The concept of a "First Act" entails "no prior act." The Libertarian theory entails "every free act has a prior determining act." To combine them yields: "The First Act has a prior act." This contradicts the definition of "First."

  **Reconstruction:** Edwards is arguing that the Libertarian theory makes the *initiation* of a free series logically impossible. You cannot have a series where every member depends on a predecessor, yet the series exists. If the series exists, there must be a first member. If there is a first member, it lacks a predecessor. If it lacks a predecessor, it fails the condition for being free. Thus, the concept of a "self-determined free will" contains the seeds of its own impossibility.

  #### (2) The Transfer Principle (Why the unfree first act infects the rest)
  This is the crux of Edwards's determinism. He dismisses the claim that "if the first act... be not free, none of them all can be free" as "manifest at first view." Why?

  Edwards operates with a **causal transmission model** of volition. He views the will not as a magical uncaused cause, but as a link in a causal chain.
  *   **The Logic:** If Act 1 is determined by Act 0, the modal status of Act 1 is inherited from Act 0.
  *   **The Analogy:** If a water pump (Act 0) is not supplying water (is not free), the pipes downstream (Act 1, Act 2) cannot contain water (cannot be free), regardless of how complex the plumbing is.
  *   **The Definition:** Recall the operative definition: Freedom = Self-Determination. If the root of the tree (the First Act) is not self-determined (perhaps it is determined by the agent's strongest motive, or by God, or by chance), then it is *necessitated* by something other than the will's own choice. If the source is necessitated, the effects are necessitated.

  **Reconstruction:** Edwards assumes that freedom is not a property that can emerge spontaneously in a causal chain. It must be present at the origin. If the origin is "unfree" (determined by something other than a prior choice), then the determination flows down the chain. The subsequent acts are merely the unfolding of that initial, unfree determination. Therefore, they inherit the lack of freedom.

  #### (3) Agent vs. Powers
  Just before this passage, Edwards argues that actions belong to the *Agent* (the Soul), not to the *Power* (the Will). He insists it is improper to say "The Will wills"; rather, "The Soul wills by means of the Will."

  **Contribution to the Argument:**
  This distinction prevents the Libertarian from escaping the regress by reifying the Will. A Libertarian might try to say, "The Will is the agent; it doesn't need a prior act, it just acts." Edwards blocks this by saying the Will is merely a faculty. A faculty cannot act on its own; only the Agent acts. Therefore, if the Agent acts freely, the Agent must determine the act. If the Agent determines the act by willing it, we are back to "willing to will," which restarts the regress.

  **Does the argument depend on it?**
  *   **Logically:** No. The regress argument (Steps 1–9 above) works even if we speak only of "acts of choice" without specifying whether they belong to a faculty or an agent. The structural problem of "every choice requires a prior choice" remains.
  *   **Dialectically:** Yes. In Edwards's context, his opponents (Arminians) often spoke of the Will as a sovereign faculty. By insisting that *Agents* act, not *Powers*, Edwards forces the opponent to locate the self-determination in the *Soul*. This makes the regress more painful because it implies the *Soul* must perform an infinite series of prior volitions to produce one action. It heightens the absurdity. Without this distinction, a Libertarian might claim the Will is a "prime mover" faculty. Edwards denies faculties can be prime movers.

  #### (4) Comparison with Strawson's Basic Argument
  The structural similarity is striking, and your informant was right. Both arguments utilize a regress of conditions to demonstrate an impossibility. However, there are crucial divergences.

  **Similarities:**
  1.  **The Regress Structure:** Both argue that a desired status (Freedom for Edwards; Ultimate Responsibility for Strawson) requires a prior condition (a prior choice for Edwards; a prior choice of one's nature for Strawson).
  2.  **The Impossibility Claim:** Both conclude that because the regress cannot be completed (you can't have a choice before the first choice; you can't choose your initial nature without already having a nature), the desired status is impossible.
  3.  **The "First" Problem:** Both hinge on the impossibility of being the *ultimate* source. Edwards: You can't be the source of your will's acts. Strawson: You can't be the source of your self.

  **Differences:**
  1.  **Target:** Edwards is attacking the coherence of **Libertarian Freedom** (the power of contrary choice/self-determination). Strawson is attacking **Ultimate Moral Responsibility** (desert). One could theoretically accept Edwards's argument (that libertarian freedom is incoherent) but reject Strawson's conclusion (that responsibility is impossible) by adopting a Compatibilist view of responsibility. Edwards *is* a Compatibilist (of a sort); Strawson is an Impossibilist about true desert.
  2.  **Faculty Psychology:** Edwards **does** need assumptions about the Will as a faculty and choice as a distinct act. His argument relies on the temporal sequencing of *acts of volition* (Act 0 causes Act 1). He assumes a psychology where "willing" is an event that can be distinct from the action it produces.
      *   Strawson **does not** need faculty psychology. His argument works on the level of "mental nature" and "principles of choice." He doesn't need to posit a distinct "act of will" preceding another; he just needs the fact that your choices flow from who you are, and you didn't choose who you are initially.
  3.  **Temporal vs. Metaphysical:** Edwards's regress is explicitly temporal/causal (a *preceding* act). Strawson's regress is often interpreted as metaphysical or explanatory (to be responsible for $X$, you must be responsible for $Y$, which explains $X$).

  **Reconstruction of the Divergence:**
  Edwards argues: *You cannot choose to choose, because the first choice has no prior chooser.*
  Strawson argues: *You cannot be responsible for your choices, because you are not responsible for the self that chooses.*

  Edwards leaves open the possibility that the "First Act" is determined by the strongest motive (his own view), rendering the act "free" in a Compatibilist sense (voluntary, not coerced), even if not self-determined. Strawson closes this door: even if you act according to your motives, if you didn't create those motives, you aren't *ultimately* responsible. Edwards uses the regress to save Determinism/Compatibilism; Strawson uses it to undermine Responsibility.

  ### Summary
  Edwards's passage is a *reductio* against the Libertarian definition of freedom. He argues that defining freedom as "self-determination by a prior choice" makes freedom logically impossible because it requires a choice before the first choice. He treats this regress as a contradiction of the concept of "first." He assumes freedom cannot emerge in a causal chain if it isn't present at the start. While structurally akin to Strawson's Basic Argument, Edwards relies more heavily on a specific faculty psychology of temporal volitions, whereas Strawson targets the metaphysical conditions of the self required for moral desert.
