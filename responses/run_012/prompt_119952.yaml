          *   *Student:* "fails when the adversary is willing to run the risk longer, or when the loss of control is so complete that the catastrophe arrives before any concession does."
          *   *Assessment:* Correct. Covers both the bargaining failure (adversary doesn't blink) and the mechanical failure (accident happens).

