answer: |-
  The core tension you have identified is the boundary between the *is* and the *ought*. Futarchy attempts to solve governance by partitioning the problem: the *ought* (values) is settled by voting, and the *is* (causal beliefs) is settled by markets. Your critique targets the permeability of that partition. To understand how a defender handles this, and where the structure actually breaks, we need to look at the epistemic claims Hanson makes about information aggregation versus preference aggregation, and then trace the mechanical consequences of the "unobserved counterfactual."

  ### 1. The Values/Means Distinction: Relocation or Purification?

  A futarchy defender does not deny that choosing a metric is political. They argue, however, that it is a *different kind* of political problem than choosing a policy. The argument rests on the complexity of the causal chain.

  **The Defender's Structure:**
  The claim is that human voting mechanisms are good at aggregating preferences (I want X more than Y) but terrible at aggregating complex empirical information (Policy A causes X). When you vote on a policy, you are voting on a bundle: a value judgment *plus* a causal belief. If the policy fails, it is ambiguous whether the failure was due to bad values (we wanted the wrong thing) or bad beliefs (we thought this policy would achieve the thing). This ambiguity prevents learning.

  By fixing the metric via vote *ex-ante*, futarchy isolates the variable. If GDP goes down, we know the *belief* about which policy boosts GDP was wrong, not the *value* that GDP is good. The defender argues that relocating politics "one level up" to the metric is a feature, not a bug. It confines the "noise" of value disagreement to a stable constitutional layer, allowing the operational layer to function as a pure error-correction mechanism.

  **The Structural Weakness (Operationalization):**
  Your intuition that this "launders" politics is correct because **metrics are not values; they are empirical proxies for values.**
  To vote on "Maximize GDP" is not purely a value judgment; it contains an embedded empirical claim: "GDP correlates with human welfare." If that correlation breaks, or if GDP growth is achieved by destroying welfare (e.g., selling off national assets), the metric has diverged from the value.
  Therefore, the "value vote" is actually a vote on a *theory of the world*. By treating the metric selection as a pure value judgment, futarchy insulates the metric from market correction. If the market efficiently finds policies that maximize GDP, but GDP turns out to be a bad proxy for welfare, the system efficiently drives the society off a cliff. The defender must admit that the "value" layer is not value-pure; it is belief-laden. Futarchy handles this by assuming the metric is stable enough that belief-updates happen on policies, not metrics. But if the metric itself requires updating based on new information, the system is rigid.

  ### 2. Stress-Test: Marketizing the Metric

  You asked if we can marketize the metric selection, for example: *"After ten years of policies optimized for metric M, would people still endorse M?"*

  **The Settlement Regress:**
  This proposal runs into a mechanical wall regarding **settlement conditions**. A prediction market requires a resolver. How is the question "Would people endorse M?" settled?
  1.  **By Vote?** If you use a vote to settle the market on the metric, you have not marketized the value; you have simply added a layer of speculation on top of a vote. The "truth" of the metric is still determined by the exogenous political process (voting), not the market. The market just bets on the outcome of the vote.
  2.  **By Another Metric (M2)?** If you say "People endorse M if M2 is high," you have not solved the problem; you have kicked it to M2. Now you need a market to decide if M2 is the right metric. This leads to infinite regress.
  3.  **By Revealed Preference?** If you try to settle it by observing behavior (e.g., "Do people migrate here?"), you are back to choosing *which* behavior counts as endorsement.

  **The Consequence:**
  You cannot marketize the terminal value because a market is a mechanism for discovering truth about *contingent* events, not for establishing *axioms*. To settle a market, you need an oracle. In futarchy, the "Value Oracle" is the electorate. If you try to put the oracle itself inside the market, you remove the ground truth required to settle the bets.
  So, yes, futarchy just relocates ordinary politics one level up. The defender's retort is that this is the *only* stable equilibrium. You must have a fixed point outside the market to prevent the market from betting on its own rules of resolution (which creates manipulation incentives). The "weirdness" you sense is the necessity of an exogenous anchor. Futarchy minimizes the surface area of that anchor, but it cannot eliminate it.

  ### 3. The Unobserved Counterfactual (The Epistemic Hole)

  This is the most severe structural flaw in the mechanism, often called the "counterfactual non-observation" problem.

  **The Mechanism:**
  Futarchy uses conditional markets.
  *   Market A: "GDP if Policy A passes."
  *   Market B: "GDP if Policy B passes."
  *   Decision: If Market A > Market B, implement Policy A.

  **The Glitch:**
  Once Policy A is implemented, Policy B is *not* implemented. The resolution condition for Market B ("If Policy B passes...") never triggers.
  *   **Standard Solution:** The bets on Market B are voided/refunded.
  *   **The Incentive Failure:** If bets are refunded, traders have no financial incentive to price Market B accurately *after* the decision is made. But more importantly, they have reduced incentive to price it accurately *before* the decision if they suspect the market will be voided.
  *   **The Learning Failure:** Because Policy B is never run, we never observe the actual GDP under Policy B. We never find out if the market was right. The system pays out based on the *prediction* of the winning policy, but it never verifies the *prediction* of the losing policy.

  **Why This Matters:**
  A prediction market learns by comparing price to reality. If the reality for the losing branch is never observed, the market cannot update its priors on that branch. Over time, the system loses the ability to evaluate alternative policies because it has no data on them. It creates a "path dependence" where the winning policy reinforces its own validity simply by being the one observed, while alternatives remain theoretical ghosts.

  **Defender's Patch (and its Cost):**
  Hanson suggests subsidizing the losing markets or using "decision markets" where traders are paid based on the accuracy of their prediction relative to a synthetic control or an oracle estimate of the counterfactual.
  *   **The Cost:** Introducing an oracle or synthetic control to estimate the unobserved counterfactual reintroduces the centralization and trust issues futarchy was meant to solve. You are now asking a central authority to guess what *would have happened*, which is exactly the kind of expert judgment futarchy sought to replace with markets.
  *   **Manipulation:** If traders know the losing market will be settled by an oracle's guess, they will trade to manipulate the oracle's perception, not to discover truth.

  ### Summary of the Structure

  The conceptual guts of futarchy rely on a separation of concerns that is cleaner in theory than in ontology.

  1.  **The Value/Metric Layer:** Futarchy admits this must be settled by voting (exogenous politics). It argues this is acceptable because value disagreement is fundamental, whereas belief disagreement is solvable. Your critique holds: metrics are belief-laden proxies, so insulating them from markets creates rigidity. Marketizing this layer leads to a settlement regress, proving an exogenous anchor is unavoidable.
  2.  **The Belief/Policy Layer:** This is where the markets live. However, the mechanism requires choosing one policy, which destroys the data required to validate the market's assessment of the *other* policies.
  3.  **The Result:** Futarchy does not eliminate politics; it **hardens** the value layer (making it harder to change metrics) and **blindfolds** the belief layer (preventing learning from unchosen paths).

  The defender argues this trade-off is worth it to prevent voters from voting on causal beliefs they don't understand. The structural reality is that futarchy replaces the error of "voting on facts" with the error of "locking in potentially flawed proxies" and "preventing falsification of rejected policies." It is not a truth machine; it is a system that prioritizes *decision efficiency* over *epistemic completeness*.
