          *   *Bayesian:* It's about the *concentration* of the posterior distribution. Same mean, different variance. Or, it's about the *prior strength* (how much data is already baked in).
          *   *Decision Theory:* It affects *bet sizing* (Kelly) or *value of information*. You should pay more to get info on Case 2 than Case 1.
      *   *Difference in me or evidence?* It's a relational property. It's about the *history* of the belief formation (evidence structure) relative to the agent.
