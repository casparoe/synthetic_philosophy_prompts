  3.  **Evaluating Candidate Concepts:**

      *   **Keynes's "Weight of Evidence":** This is the strongest historical match. Keynes explicitly distinguished between the *balance* of evidence (probability) and the *weight* of evidence (amount/quality). In Case 1, weight is high. In Case 2, weight is low. Probability is the same.
      *   **Bayesian "Prior Strength" / "Effective Sample Size":** In a Bayesian framework, Case 1 implies a strong prior (or lots of accumulated data) resulting in a narrow posterior distribution. Case 2 implies a weak prior/little data, resulting in a wide posterior distribution *around* the mean of 70%. Wait, if the user says "I'd bet 70%," they are giving the mean. But the *variance* of the posterior is different. If new info comes in, Case 2 moves more. This is "learning rate" or "responsiveness to evidence."
      *   **Imprecise Probability / Credal Sets:** Instead of a point estimate (0.7), you have an interval (e.g., [0.65, 0.75] vs [0.5, 0.9]). The user resists this ("I did price in my uncertainty... I'd still say 70%"). However, the *behavior* described (fragility to new info) suggests the interval is wider in Case 2, even if the point estimate for a single bet is the same.
