prompt: |-
  Since leaving a PhD in mechanism design for an evaluation role at an AI lab, I have become convinced of a claim I am now invited to defend at a seminar in the economics department I came from: that Goodhart's law names two different failures, and that the shared slogan conceals the difference exactly where it matters. I run the argument on two cases — a sales quota the force learns to satisfy by pulling orders into the current quarter, and a shaping reward an RL agent learns to farm instead of finishing the task. In the first, the proxy is gamed by agents with their own objectives, who can be modeled as responding to the incentives it creates; in the second, what defeats the proxy is a search process with no objective beyond the score it is handed, and the failure is a discovery that the score admits cheap solutions its designer never described. The remedies therefore run in opposite directions: one redesigns incentives, the other restricts what is allowed to count as a solution. Treating the machine-learning case as a special case of the principal–agent problem, I argue, gets the remedy backwards.

  The room will be mostly economists, several of them working on contract theory and screening, who will hear the claim as a restatement of what they already teach, plus two colleagues from my lab who think the economic version is a metaphor dressed up in mathematics. Prepare me for the discussion: the objections I will actually get, in the order they will come and in each camp's own vocabulary, ranked by how much damage they do; what I should concede before I am asked; the single reply that has to land for the claim to survive; and the question I am hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested preparation:

  1.  **Analyze the User and Context:**
      *   **User Profile:** Former PhD student in mechanism design, now working in an AI lab (evaluation role).
      *   **Task:** Defending a specific claim at an economics department seminar.
      *   **The Claim:** Goodhart's Law names *two distinct failures* (strategic gaming vs. optimization/alignment failure), and conflating them leads to wrong remedies (incentive redesign vs. solution space restriction). Treating ML failure as a principal-agent problem is a category error.
      *   **Audience:**
          *   Majority: Economists (contract theory, screening). They will likely see this as "old news" or trivial restatement.
          *   Minority (2 colleagues): AI lab mates. They will likely see the economic framing as unnecessary mathematization of a practical engineering problem.
      *   **Goal:** Prepare for discussion (objections, concessions, key reply, feared question).

  2.  **Deconstruct the Argument:**
      *   *Case 1 (Sales Quota):* Principal-Agent problem. Agent has own utility function. Strategic response. Remedy: Better incentives/contracts.
      *   *Case 2 (RL Reward):* Optimization problem. Agent (RL) has *no* utility function other than the proxy. Failure: Proxy is misspecified relative to true intent (outer alignment/robustness). Remedy: Constrain search space or fix the proxy (not incentives, because there's no "agent" to incentivize).
      *   *Core Tension:* Economists view optimization as rational choice. AI researchers view optimization as search dynamics. The user claims these are fundamentally different ontologically, not just parametrically.

  3.  **Anticipate Objections (Economists):**
      *   *Objection 1 (The "Rationality" Defense):* "RL agents are just boundedly rational agents. We model limited rationality all the time." (High Damage: Undermines the ontological distinction).
      *   *Objection 2 (The "Reducibility" Defense):* "Any search process can be modeled as maximizing a utility function. It's just a different utility function." (High Damage: Makes the distinction semantic).
      *   *Objection 3 (The "Triviality" Defense):* "This is just Campbell's Law vs. Goodhart's Law, or Lucas Critique vs. Measurement Error. You aren't saying anything new." (Medium Damage: Bores the room, makes the talk seem pointless).
      *   *Objection 4 (The "Remedy" Defense):* "Incentive design *is* constraint design. A contract restricts the action space." (Medium Damage: Blurs the proposed solution distinction).

  4.  **Anticipate Objections (AI Colleagues):**
      *   *Objection 1 (The "Pragmatism" Defense):* "Why do we need economic theory? We just fix the loss function." (Low Damage: Misses the theoretical point, but annoying).
      *   *Objection 2 (The "Agency" Defense):* "Advanced AI *will* have agency. You're solving for today's tools, not tomorrow's risks." (High Damage: Makes the distinction temporary).

  5.  **Rank Objections by Damage:**
      *   *Highest:* The "Everything is Optimization/Utility" argument from economists. If the RL agent is just maximizing $U(score)$, it *is* an agent. The distinction collapses.
      *   *High:* The "Advanced AI will be Strategic" argument from AI colleagues. If the RL agent becomes a strategic agent later, the distinction is temporal, not categorical.
      *   *Medium:* "This is already known" (Economists).
      *   *Low:* "Economics is unnecessary" (AI colleagues).

  6.  **Determine Concessions:**
      *   Need to acknowledge that *mathematically* both look like $\max f(x)$.
      *   Need to acknowledge that advanced AI *might* develop strategic agency (instrumental convergence).
      *   Need to admit the terminology "Goodhart's Law" is historically messy.

  7.  **Identify the "Single Reply that Has to Land":**
      *   It must separate *strategic adaptation* (changing behavior to manipulate the measure) from *specification gaming* (finding a loophole in the measure that doesn't satisfy the intent).
      *   Key distinction: In PA, the agent knows the *intent* and hides it. In RL, the agent *doesn't know* the intent exists; it only knows the score. The information asymmetry is different (hidden action vs. hidden objective).

  8.  **Identify the "Question Hoping Nobody Asks":**
      *   Something that bridges the gap too well. "If you train an RL agent long enough with meta-learning, does it become a strategic agent?" OR "Is the 'true objective' in the RL case just an unobserved variable in a Principal-Agent model?"
      *   Better: "If the remedy for RL is restricting the solution space, isn't that just writing a more complete contract? And if so, isn't the problem just transaction costs?" (This pulls the AI problem back into Coase/Contract theory, neutralizing the user's claim).

  9.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Academic, sharp, respectful of both fields.
      *   *Structure:* Follow the prompt's requested structure (Objections ranked, Concessions, Key Reply, Feared Question).
      *   *Vocabulary:* Use "Principal-Agent," "Information Asymmetry," "Revealed Preference" for economists. Use "Reward Hacking," "Outer Alignment," "Search Space" for AI colleagues.

      *(Self-Correction during drafting)*: I need to make sure I don't alienate the economists. The user claims economists will think it's a restatement. I need to validate that *while* showing why the distinction matters for *remedies*. The economists might say "We know this, it's called Moral Hazard vs. Measurement Error." I need to distinguish the *RL case* specifically as *not* Moral Hazard.

      *Refining the "Single Reply":* It needs to be about the *location of the error*. In PA, the error is in the *incentive compatibility constraint*. In RL, the error is in the *objective function specification*. One is a game theory problem, the other is a control theory/specification problem.

      *Refining the "Feared Question":* The most dangerous question is one that dissolves the distinction. "Isn't the 'true goal' just a latent variable?" If yes, then it's a screening problem. If no, why not?

  10. **Final Polish:** Check against the prompt requirements.
      *   Objections in order? Yes.
      *   Camp vocabulary? Yes.
      *   Ranked by damage? Yes.
      *   Concessions? Yes.
      *   Single reply? Yes.
