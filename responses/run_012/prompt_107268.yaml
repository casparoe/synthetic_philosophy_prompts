answer: |-
  The light in Station 4 is supposed to be 5000 Kelvin, pure daylight, but sometimes it hums with a slight green tint that makes the skin under my eyes look bruised. I've been here six years. I know the hum. I know the tint. I know the way the dust motes dance in the beam when the ventilation cycles down.

  My job is simple. Circuit boards come down the line on a rubber belt. They stop in front of me. I look through the loupe. I check for fractures, solder bridges, micro-scratches on the silicon. I mark the pass or the fail.

  The protocol changed three years ago. Management called it "Cognitive Priming." Before I touch a batch, I have to read the sheet. It tells me the batch ID, the component type, and the Expected Defect Rate.

  "Batch 409," I say into the recorder. "Rate: point-zero percent."

  That's the thing that got me. The rate. They tell you what you're going to find before you find it. They say it helps calibrate the brain, reduces fatigue. If you know a batch is clean, you don't hunt for ghosts. If you know it's dirty, you look harder.

  It worked too well.

  It started with a scratch. I remember it because I'd been drinking too much coffee and my hands were shaking slightly. The board came up. The sheet said *Rate: 0.0%*. I looked through the glass. The surface was smooth. Silver pathways gleamed under the lamp. Perfect.

  I stamped it. Passed it down the line.

  Later, during the audit, the supervisor, Miller, called me over. He had the camera logs pulled up on his tablet. The high-res overheads that capture every board as it passes under the lens.

  "You missed one," Miller said. He didn't sound angry. He sounded tired.

  He turned the tablet. There was the board. Batch 409. Unit 14. Right in the center of the main processor, there was a hairline fracture. It was jagged, dark, obvious. It looked like a crack in a frozen lake.

  "I didn't see it," I said.

  "It's right there," Miller said. He zoomed in. The pixelated line sharpened. "How do you miss that?"

  "I looked," I said. "The surface was smooth."

  Miller sighed, the way you sigh when a tool starts slipping in your hand. "Don't second-guess yourself, Elias. Just look harder next time. The sheet is just a guideline. The board is the truth."

  I went back to Station 4. I asked for the log for Unit 14. I pulled up the image on my own screen. The crack was there. Plain as day. A black scar on the silver.

  The next day, Batch 410 came up. *Rate: 0.0%*.

  I waited for the board. I told myself I would be rigorous. I would ignore the sheet. I would look for the break. The board stopped. I leaned in. I pressed my eye to the rubber eyecup of the loupe.

  I looked for the dark line. I looked for the shadow. I scanned the pathways.

  Smooth. Silver. Unbroken.

  I felt a cold knot in my stomach. I knew the camera would catch something. I knew it statistically. But under the lens, the light behaved differently. It didn't catch on an edge. It didn't cast a shadow in a groove. The physics of the illumination seemed to comply with the paper on my clipboard.

  I passed it.

  I checked the camera log an hour later. Unit 7. Fracture on the lower quadrant. Same kind as before. The camera saw it. The machine saw it. Miller saw it on the screen.

  But when I remembered looking at it, my memory wasn't of ignoring a flaw. It wasn't of seeing a scratch and deciding it was negligible. It was of seeing a surface that did not have a scratch.

  That's the difference. If I ignore a scratch, I feel the tension of it. I feel the compromise. My eyes strain to look past the error. But this… this was relief. The visual field was clean. The light hit my retina without obstruction.

  I started testing it. I couldn't stop myself.

  When the sheet said *Rate: 15%*, I saw everything. I saw dust that wasn't there. I saw discolorations that looked like fractures. My eyes became hungry, scanning the grain of the metal, finding breaks in the continuity. I failed half the batch. The camera confirmed most of them.

  When the sheet said *Rate: 0.0%*, I became blind.

  I went to the optometrist. I told her I was having episodes of visual suppression. She tested my acuity. 20/20. She tested my color perception. Perfect. She showed me cards with hidden numbers in the dots. I read them all.

  "It's not the eyes," she said. "It's the processing."

  "Where does the processing happen?" I asked.

  She tapped her temple. "Up here. You're filtering."

  "I'm not filtering," I said. "I'm not seeing the noise to filter it out."

  She wrote me a prescription for stress. I didn't fill it.

  Back at the factory, the line kept moving. The hum of the conveyor was constant, a low B-flat that vibrated in my teeth. I started watching the other inspectors. Station 3 was a woman named Sarah. Station 5 was a guy named David.

  I watched Sarah when a *0.0%* batch came through. She squinted. She leaned back. She rubbed her eyes. She failed two units. Miller came over, looked at the camera log, confirmed the defects, and nodded. She saw them.

  I watched David. He breezed through the *0.0%* batch. He passed them all.

  I caught David in the break room. "Do you ever see things that aren't there?" I asked. "Or not see things that are?"

  David was eating a sandwich. He didn't look up. "The sheet tells you what the quality control lab found in the sample test. It's just data, Elias. Don't let it get in your head."

  "It changes what I see," I said.

  David took a bite. "Then you're doing your job. You're aligning with the standard."

  "That's not inspection," I said. "That's hallucination."

  "Inspection is conformity," he said. "If the batch is certified clean, and you find a defect, who's wrong? You or the cert?"

  I didn't have an answer.

  The creeping part wasn't the error. It was the lack of resistance. When I look at a red apple, I see red. If you tell me it's blue, I know you're lying. I see the conflict. But this… when the clipboard said *Clean*, my optic nerve didn't send a conflict signal. There was no dissonance. The scratch didn't appear and then vanish. It never arrived.

  It was as if my eyes were reading the clipboard before they looked at the board.

  Last week, Miller called me into the office. He had a stack of my logs.

  "Your pass rate on zero-defect batches is one hundred percent," he said. "Your fail rate on high-defect batches is industry leading. You're the most efficient inspector on the floor."

  "I'm not seeing the truth," I said.

  "We don't pay for truth," Miller said. "We pay for consistency. The camera is for the record. You are for the flow."

  "The camera sees scratches I don't see."

  "The camera sees photons," Miller said. "You see product. There's a difference."

  He slid a new sheet across the desk. "Batch 500. Prototype. Rate: 0.0%."

  I took the sheet. The paper was heavy, cream-colored. The numbers were printed in sharp black ink.

  I went back to Station 4. I sat down. The chair creaked. The belt hummed.

  The first board arrived. It was a prototype, darker silicon, gold pathways instead of silver. I looked at the sheet. *0.0%*.

  I looked through the loupe.

  I wanted to see a flaw. I tried to summon the image from the camera logs I'd snuck a peek at earlier. I knew there was a bridge on the third unit. I knew it was there. I held the knowledge in my head like a stone.

  I looked at the third unit.

  The gold pathway was smooth. The light glided over it. There was no bridge. There was no interruption. I tried to force my eye to focus on the spot where the bridge should be. I strained. I widened my pupil. I held my breath.

  Nothing.

  The light refused to break. The surface was perfect.

  I felt a surge of panic, sharp and chemical. This was my body. These were my eyes. They were supposed to be mine. But they weren't obeying me. They were obeying the sheet. They were obeying the expectation.

  I picked up the stamp. *PASS*.

  I sent it down the line.

  I thought about quitting. I thought about walking out the door and never coming back. But where would I go? If my eyes do this here, what do they do out there? I look at a stop sign. Do I see red because it's red, or because I expect it to be red? I look at my wife's face. Do I see the tired lines around her eyes, or do I smooth them over because I expect her to be beautiful?

  Is there a version of me that sees the raw data? Or am I just a machine that prints labels on what comes in?

  The belt moved. The next board arrived.

  I looked at the sheet. *Rate: 0.0%*.

  I looked at the board. It was flawless.

  I checked the monitor on my desk. The camera feed showed a dark jagged line cutting across the processor. It blinked at me, red circle highlighting the error. The machine was screaming that there was a break.

  I looked back through the loupe. Silver. Gold. Smooth. Unbroken.

  I felt a strange calm settle over me. The tension left my shoulders. The hum of the light box faded into the background. There was no conflict anymore. There was only the sheet and the sight, and they were the same thing.

  If the camera sees the scratch, and I don't, who is broken? The camera records what is. I record what matters.

  If I see a clean board, and I stamp it clean, and the client receives a clean board because the scratch doesn't functionally matter, then the scratch wasn't real. Reality is what survives the inspection.

  I picked up the stamp.

  *PASS*.

  I sent it down the line.

  Miller walked by later. He glanced at my output. He glanced at the camera log on his tablet. He saw the discrepancy. He looked at me. I looked at him.

  He didn't say anything. He just tapped the screen, swiped the error report away, and kept walking.

  The belt hummed. The light stayed at 5000 Kelvin, maybe a little green. The next board came. I read the sheet. I looked through the glass.

  I saw what I was told to see. And for the first time in six years, I didn't feel like I was working. I felt like I was remembering.
