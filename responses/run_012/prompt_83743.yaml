          2.  **The Evolutionary Dilemma (i + iv):** Very strong. If qualia do nothing, why are they here? Panpsychism or Illusionism usually dodges this, but Epiphenomenalism struggles.
          3.  **Physicalism Tension (i + v):** Manageable via supervenience, but requires careful wording.

