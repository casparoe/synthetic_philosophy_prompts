      *   **(v) Physicalism:** Everything is physical. (Usually implies causal closure of the physical).

      *   *Conflict 1: (i) + (ii) + (iii).*
          *   (iii) says I have knowledge of experience.
          *   (ii) says knowledge requires the object of knowledge to cause the belief.
          *   (i) says experience causes nothing (including beliefs).
          *   *Result:* I cannot have knowledge of experience. But (iii) says I do. This is the classic "Knowledge Argument" against epiphenomenalism (often associated with Huxley or later critiques by Horgan, etc.). If qualia are causally inert, we can't refer to them, think about them, or know them.

      *   *Conflict 2: (i) + (iv).*
          *   (iv) says experience was selected for by evolution.
          *   Natural selection selects for causal efficacy (survival/reproductive advantage).
          *   (i) says experience has no causal efficacy.
          *   *Result:* Experience couldn't be selected for if it does nothing. (This is the "Adaptationist Argument" against epiphenomenalism).

      *   *Conflict 3: (i) + (v).*
          *   (v) Physicalism. Usually entails Causal Closure of the Physical (every physical event has a sufficient physical cause).
