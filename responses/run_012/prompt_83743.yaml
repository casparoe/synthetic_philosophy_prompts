          *   Conflict B: Evolution (i+iv).
          *   Conflict C: Physicalism (i+v). If experience is a "shadow" distinct from the physical processes (as implied by "not a player"), it sounds non-physical. If it is physical, it has causal powers.
          *   *Decision:* The Knowledge problem is the most immediate internal contradiction regarding the *mind*. The Physicalism one is definitional. I will rank Knowledge first because it undermines the *statement* of the position (you can't state you know you're in pain if you can't know it).

      *   *Wait, another nuance on (ii):* Some epiphenomenalists argue that the *brain state* causes the belief, and the brain state *is* the experience (Identity), but the user says (i) Experience doesn't cause anything. If Experience = Brain State, and Brain State causes belief, then Experience causes belief. So (i) denies Identity. So (i) implies Experience != Brain State. This makes (v) Physicalism very hard to hold.
