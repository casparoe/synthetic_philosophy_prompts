      *   **Single Best Revision:**
          *   Drop (i) Epiphenomenalism. It is the node connecting all the problems. If experience has causal powers (Identity/Functionalism), (ii), (iii), and (iv) become much easier to reconcile.
          *   *Alternative:* Drop (iv). Claim experience is a spandrel. This saves Epiphenomenalism but leaves the Knowledge problem (i+ii+iii).
          *   *Decision:* The Knowledge problem is arguably worse than the Evolution problem. So dropping (i) is the cleanest sweep. However, the user *wants* to be an epiphenomenalist (likely). If they want to keep (i), they *must* drop (ii) or (iii). Dropping (ii) (Causal theory of knowledge) is the standard move for Epiphenomenalists (e.g., "Acquaintance" theory).
