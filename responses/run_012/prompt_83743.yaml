          *   *Verdict:* Less severe than the Knowledge and Evolution problems, but still tense depending on the specific flavor of physicalism.

      *   *Conflict 4: (ii) + (iii) + (i) regarding the "Yelp".*
          *   User asks: "If pain doesn't cause anything, how do I ever end up yelping?"
          *   Answer provided by (i): The *brain state* causes the yelp, not the pain. The pain rides along.
          *   *Problem:* This explains the yelp, but it creates the Knowledge problem (Conflict 1).

