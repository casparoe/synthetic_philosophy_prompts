answer: |-
  # Methodological Specification: Causal Accounts for Historical Overdetermination

  **Preamble:** The following specifications define the necessary conditions for a theory of causation to be operational in a deterministic historical context. These are not recommendations for which theory to adopt, but constraints that any candidate theory must satisfy to handle the six stipulated cases (Redundant Sufficiency, Preemption, Joint Sufficiency, Necessary but Insufficient, Screening Off, Description Relativity).

  ### 1. Ontic Commitment (Verdict Type)
  *   **Specification:** The account must return verdicts about the causal structure of the world, not merely about the historian's epistemic state or computational limits. A factor is either a cause or it is not, independently of whether the historian can identify it.
  *   **Forcing Consideration:** Historical explanation aims at truth about the past, not just coherence of narrative. If causation were merely epistemic, two historians with different evidence could contradict each other without one being wrong about the *world*, which undermines the objective status of historical claims.
  *   **Status:** **Non-negotiable** (per your stipulation).
  *   **Cost:** This imposes a heavy burden on **Description Relativity (Case 6)**. If causation is in the world, the distinction between "cause" (match strike) and "condition" (oxygen) cannot be merely pragmatic. The account must either find an objective asymmetry between the two (e.g., abnormality, intervention potential) or strictly separate *causal relation* (ontic, symmetric) from *causal explanation* (pragmatic, selective). The latter is the cheaper cost: the account must ground the objective causal field so that pragmatic selection is constrained by fact, not arbitrary.

  ### 2. Independence from Strict Laws (Covering Generalizations)
  *   **Specification:** The account must be able to validate singular causal claims without requiring subsumption under strict, exceptionless laws of nature.
  *   **Forcing Consideration:** History deals with singular, non-repeatable complexes. Strict laws (as in physics) are rarely available. If an account requires a covering law to validate that Factor A caused Outcome B, most historical explanation becomes impossible.
  *   **Status:** **Non-negotiable** for historical utility.
  *   **Constraint:** The account must rely on mechanisms, processes, or singular counterfactuals rather than nomological subsumption. However, it must still provide enough modal strength to distinguish coincidence from causation.

  ### 3. The Preemption/Overdetermination Asymmetry (Case 1 vs. Case 2)
  *   **Specification:** The account must distinguish between Redundant Sufficiency (both factors are causes) and Preemption (only the operating factor is a cause). It must explain why the preempted factor is demoted despite being sufficient *ex ante*.
  *   **Forcing Consideration:** In Case 1 (two detonators), intuition dictates both are causes. In Case 2 (one detonator stops the other), intuition dictates only the firing one is a cause. A theory that treats them identically (e.g., simple counterfactual dependence, which fails in both) is inadequate.
  *   **Status:** **Non-negotiable.**
  *   **Requirement:** The account must track the *completion* of a causal process. In Overdetermination, two processes complete. In Preemption, one completes and one is interrupted. The account must define "interruption" objectively.

  ### 4. Description Stability (Case 6)
  *   **Specification:** The account must treat the causal relation as invariant under description, even if the *selection* of causes for explanation varies.
  *   **Forcing Consideration:** If causation itself shifts with description, historical explanation collapses into vocabulary choice. The match and oxygen must stand in the same causal relation to the fire regardless of how we describe them, even if we only cite the match in an explanation.
  *   **Status:** **Non-negotiable** (to preserve objectivity).
  *   **Requirement:** The account must distinguish between the *causal field* (all objective dependencies) and the *causal claim* (the selected subset for explanation). It must provide objective criteria for what enters the field (e.g., necessity, sufficiency, process) so that the pragmatic selection is not arbitrary.

  ### 5. Gradability (Causal Weight)
  *   **Specification:** The account must permit unequal assignments of causal weight (degrees of contribution) without declaring such talk incoherent.
  *   **Forcing Consideration:** Historians routinely argue that Factor A was the "primary" cause and Factor B "secondary." An account that only delivers binary verdicts (cause/not-cause) is insufficient for historical debate.
  *   **Status:** **Non-negotiable** for historical practice.
  *   **Fixing Weights:** Weights must be fixed by the *necessity of the factor in the specific context* (e.g., how many alternative pathways were available?) or by the *proportion of the causal process* contributed. In Case 3 (Joint Sufficiency), weights might be equal; in Case 4 (Necessary but Insufficient), the necessary factor might carry more weight if alternatives were scarce.

  ### 6. Transitivity and Screening (Case 5 vs. Case 2)
  *   **Specification:** The account must allow causation to transmit through a proximate sufficient factor (Screening Off) while blocking it in a preempted backup (Preemption).
  *   **Forcing Consideration:** In Case 5 (Remote -> Proximate -> Outcome), the Remote cause is still a cause of the Outcome. In Case 2 (Preemption), the Backup is not. Both involve a sufficient proximate factor. The account must distinguish an *active chain* from a *potential chain*.
  *   **Status:** **Non-negotiable.**
  *   **Commitment:** This commits the account to a process-based view. In Screening, the remote factor is physically connected to the outcome via the proximate. In Preemption, the connection is severed. The account must define "connection" without relying solely on counterfactuals (which fail in Preemption).

  ### 7. Outcome Individuation (Case 1)
  *   **Specification:** The account must accommodate coarse individuation of outcomes to allow overdetermination to exist as a phenomenon, without collapsing into contradiction if fine individuation is applied.
  *   **Forcing Consideration:** If outcomes are individuated finely (e.g., by exact millisecond), Case 1 dissolves (Detonator A causes Explosion-at-t1, Detonator B causes Explosion-at-t2). History requires coarse individuation ("The Explosion").
  *   **Status:** **Non-negotiable** for historical application.
  *   **Requirement:** The account must allow the historian to specify the grain of the outcome event. It must assert that overdetermination is real relative to the coarse grain, without denying that at a fine grain the causes produce distinct micro-events. The causal verdict must be stable across grains where possible, or explicitly indexed to the grain.

  ***

  ### Incompatibility Flag

  I flag the following subset of requirements as **cannot be jointly satisfied** without significant theoretical cost:

  1.  **Ontic Commitment** (Requirement 1)
  2.  **Independence from Strict Laws** (Requirement 2)
  3.  **The Preemption/Overdetermination Asymmetry** (Requirement 3)

  **The Argument:**
  To satisfy the **Preemption/Overdetermination Asymmetry** in a deterministic world, the account must establish the *modal status* of the preempted factor. In Case 2 (Preemption), we must know that the backup factor *would have* produced the outcome had the first not intervened. This is a claim about what *would* happen, not just what *did* happen.
  *   If you maintain **Independence from Strict Laws**, you lack the generalizations required to ground this counterfactual claim. Singular facts alone do not support claims about unactualized possibilities.
  *   If you maintain **Ontic Commitment**, you cannot treat this modal claim as merely epistemic (i.e., "we don't know if it would have worked"). It must be a fact about the world that the backup was sufficient.
  *   Therefore, to ground the objective sufficiency of the preempted factor without strict laws is metaphysically precarious. You are forced to either:
      *   Admit **Laws/Dispositions** (violating Req 2).
      *   Make the verdict **Epistemic** (violating Req 1).
      *   Deny the **Asymmetry** (violating Req 3, treating Preemption as Overdetermination).

  ***

  ### The "Most Work" Requirement

  The single requirement that does the most work in ruling accounts out is **The Preemption/Overdetermination Asymmetry (Requirement 3).**

  **Reasoning:**
  This requirement eliminates the two simplest and most intuitive accounts of causation:
  1.  **Simple Regularity Theories:** These cannot distinguish Preemption from Overdetermination because both involve two sufficient conditions present in the actual sequence.
  2.  **Simple Counterfactual Theories:** These fail because in both Overdetermination and Preemption, the outcome does not counterfactually depend on the specific factor in question (in Overdetermination, the other factor would have done it; in Preemption, the factor didn't happen, so the counterfactual is vacuous or handled by the backup).

  Any account that survives this requirement must be sophisticated (e.g., process theories, structural equation models, or nuanced counterfactuals involving chains of dependence). It forces the historian to look beyond "but-for" testing and consider the *mechanism* of production, which is the central methodological challenge in multi-causal history.
