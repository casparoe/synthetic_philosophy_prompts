  Here is the principle that best unifies your judgments, the inconsistency you must resolve, and the predictions for your new cases.

  ### The Principle: Curatorial Designation for Disinterested Regard

  **An object is a work of art if and only if:**
  1.  **Human Agency:** A human agent (artist, curator, publisher) has selected, created, or framed the object.
  2.  **Institutional Framing:** The object is placed within a context (gallery, book, album, plinth) that signals it is a candidate for **aesthetic contemplation**.
  3.  **Autonomy:** The object is to be regarded for its own properties, distinct from any practical utility or functional end.

  **How this explains your verdicts:**
  *   **Driftwood/Urinal:** Natural/functional objects become art via **Human Agency** (mounting/signing) and **Institutional Framing** (plinth/pedestal).
  *   **Forgery:** The forger engaged in **Human Agency** and **Institutional Framing** (submitting to exhibition). The intent to deceive does not negate the fact that it was *presented* as a candidate for aesthetic regard. Once exposed, it remains in that context (as a historical artifact of art).
  *   **Poem:** The author's private intent is overridden by the publisher's **Institutional Framing** (publication). It is now a candidate for public regard.
  *   **AI Image (Gallery vs. Deleted):** The gallery version has **Institutional Framing** (curator/label). The deleted version lacks the public context required for designation.
  *   **Child's Spill/Rock/Math:** Fail **Human Agency**. No one selected or framed them for regard.
  *   **Concert Hall Recording:** It is released as an "album." This is a cultural format dedicated to listening (aesthetic regard), satisfying **Autonomy**.

  ### The Inconsistency: The Perfume Verdict

  Your principle cannot accommodate your verdict on the **Master Perfume** without contradiction.

  **The Conflict:**
  You accept the *Empty Concert Hall Recording* as art. This is a commercial product (an album) composed of sensory data (sound) intended for experience. You reject the *Master Perfume*, which is also a commercial product composed of sensory data (scent) intended for experience. Both are crafted with care, sold for money, and rely on human agency.

  If the Concert Hall recording is art because it is "composed for appreciation," the perfume must also be art. The only reason to exclude it is a traditional hierarchy of the senses (privileging sight and hearing over smell) or a bias against "applied arts." However, your acceptance of the Urinal (a functional object) and Driftwood (a natural object) shows you are willing to strip objects of their function to make them art. A master perfume, when smelled deliberately for its composition rather than worn for hygiene, fits your **Autonomy** condition.

  **What to Surrender:**
  You should surrender the verdict that **Perfume is not art.**

  **Why:**
  Holding onto this verdict forces you to admit that your principle relies on an arbitrary cultural bias rather than a logical rule. If you accept that a recording of silence is art because a human framed it for listening, consistency demands you accept a composed fragrance as art when framed for smelling. To keep perfume out, you would have to retreat to a much stricter definition of "Art" that would likely exclude the Urinal and the Driftwood as well (returning you to your friend's Intention theory, which you already rejected).

  ### Predictions for New Cases

  Based on the **Principle of Curatorial Designation**, here are the predictions for your two unlisted cases:

  **1. A photograph of that rock formation.**
  **Verdict: Art.**
  **Reasoning:** The rock formation itself failed the **Human Agency** test (erosion is not an artist). However, the *photograph* is a new object created by a human agent. By framing the rock through a lens, selecting the angle, and presenting the image, the photographer performs the **Curatorial Designation**. The photograph is not the rock; it is a representation framed for aesthetic regard. This mirrors the Driftwood case: the context (the photo) makes the subject (the rock) an object of art.

  **2. A copy of the forged painting run off on a high-quality printer.**
  **Verdict: Not Art (it is a reproduction of art).**
  **Reasoning:** This is the subtle test of your principle. The *original* forgery is art because it was the specific object designated by the artworld (submitted to the exhibition). A print run off on a printer lacks the **Institutional Framing** of the original instance. Unless this specific print is itself curated, signed, or exhibited (like the AI image in the gallery), it is merely a mechanical copy.
  *   *Distinction:* A poem is art even in print because literature is an inherently multiple medium; the *text* is the work. Painting is an inherently singular medium; the *specific canvas* is the work. A print of a painting is to the artwork what a postcard of the Urinal is to the Urinal: a souvenir, not the work itself. Therefore, without new curatorial framing, the print is not a work of art.

  ### Summary
  Your underlying theory is that **Art is a status conferred by context, not a property inherent in objects.** To make this consistent, you must acknowledge that high-craft fragrances are art, just as sound recordings are. You must also distinguish between the *creation* of an artwork (the photo of the rock) and the *replication* of one (the print of the forgery).
