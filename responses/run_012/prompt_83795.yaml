  *(Final Decision on Position)*: The legitimate rereading is one that **reduces the text's jurisdiction**. The opportunistic one **maintains jurisdiction while changing the rules**.

  7.  **Writing the Proposal.** (Proceeding to generate output based on these thoughts).

      *   *Note on Formatting:* I will use standard proposal headers but keep the flow narrative.
