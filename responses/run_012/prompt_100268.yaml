prompt: |-
  I'm in a reading group that's been slowly working through stuff on the ethics of war, and last week two members, Dana and Marcus, went at each other for basically the whole session over the claim that soldiers on both sides of a war are morally on a par -- that once you're actually in the fighting, it isn't morally worse to be the one serving the aggressor. I mostly stayed out of it because I genuinely couldn't tell who was winning, but now I want to understand it properly. Roughly how it went:

  Dana opened: blame has to track what you could reasonably have known. A conscript who honestly believes his country was attacked, and fights to defend it, isn't blameworthy for fighting even if his leaders lied and the war is unjust -- and the guy on the other side is in exactly the same spot, so neither is worse than the other. Marcus: that's just an excuse, and an excuse isn't equality. If someone drugs me and uses my body to shove a person off a cliff, I'm not to blame, but I'm also not on a par with the man who deliberately pushed -- my act still wasn't permitted, it just isn't punished. Dana: follow that through and you can't run a war at all, because the whole law of armed conflict treats the two sides symmetrically -- enemy soldiers get prisoner-of-war status, and neither side's troops are prosecuted merely for killing the other side's troops. Marcus: that's confusing how we design institutions with moral truth; we give both sides' prisoners the same meals and hearings because it's the only workable rule, not because kidnapping and a lawful arrest are morally the same thing. Then Dana tried a reductio: if unjust soldiers are basically murderers, then the civilians who voted for the war and pay for it are complicit, so on that view they'd be fair game too -- which would wreck the rule against targeting civilians, which is the one part of the law of war everyone agrees on. Marcus said complicity comes in degrees and the threshold for being liable to attack is high, so you can call the soldier a wrongdoer without licensing attacks on his parents.

  Then Dana changed tack: both soldiers are doing the same thing, staking their lives on the same lethal bargain, each only able to kill because the other has taken up the same risk -- there's something fair-play-ish about it, like two people agreeing to box. Marcus said a mugger also risks getting shot and that doesn't make mugging fair. And then Dana threw in something I honestly didn't follow: imagine the very same person, conscripted into the unjust side, across two versions of the same war -- in one he's been lied to and believes the cause is just, in the other he knows it's unjust but fights anyway out of terror. Dana said if the moral equality of combatants depends on what he knows, then it was never equality of combatants, it was equality of the ignorant. Marcus said yes, that's exactly the point, and Dana had just shown the whole thing collapses into "we excuse people who couldn't have known better."

  Can you referee this move by move -- Dana's opening reasonable-belief point, Marcus's excuse/equality reply, the law-of-war symmetry argument, the institutions-versus-truth reply, the complicity reductio and Marcus's answer to it, the boxing/fair-play point, the mugger reply, and finally the two-versions thought experiment? For each one say whether it's a good point, a bad point, or a decent point that overreaches, and briefly why. Then tell me what both of them seem to be missing -- I keep feeling they're talking past each other somewhere but I can't put my finger on where, and I'd rather hear what the actual crux is than just who "won."
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A reading group discussing the ethics of war (Just War Theory).
      *   **Characters:** Dana (argues for Moral Equality of Combatants - MEC) vs. Marcus (argues for Moral Inequality of Combatants - Revisionist Just War Theory).
      *   **Task:** Referee the debate move-by-move (evaluate arguments as good/bad/overreaching) and identify the underlying crux/what they are missing.
      *   **Tone:** Analytical, fair, philosophical but accessible (since the user is in a reading group, not necessarily a professional philosopher).

  2.  **Deconstruct the Debate Moves:**

      *   **Move 1: Dana's Opening (Reasonable Belief/Epistemic Limitation).**
          *   *Argument:* Blame tracks knowledge. Conscripts on both sides might reasonably believe they are right. Therefore, they are morally on a par.
          *   *Analysis:* This is a standard defense of MEC based on *invincible ignorance*. It's strong intuitively but vulnerable to the distinction between *blameworthiness* and *permissibility*.
          *   *Verdict:* Good point (intuitively), but conflates blame with objective rightness.

      *   **Move 2: Marcus's Reply (Excuse vs. Justification).**
          *   *Argument:* Being excused (not blamed) isn't the same as being justified (acting rightly). The unjust soldier does wrong but isn't punished; the just soldier does right.
          *   *Analysis:* This is the core Revisionist distinction (McMahan's view). It's philosophically precise.
          *   *Verdict:* Good point (philosophically robust).

      *   **Move 3: Dana's Law of War Symmetry (LOAC/IHL).**
          *   *Argument:* International Humanitarian Law treats soldiers symmetrically (POW status, combatant privilege). If unjust soldiers were murderers, this wouldn't work.
          *   *Analysis:* This is an argument from practice/consequences. It appeals to the "deep convention" of war.
          *   *Verdict:* Decent point, but risks the Is-Ought fallacy (law $\neq$ morality).

      *   **Move 4: Marcus's Institutions vs. Truth.**
          *   *Argument:* Laws are pragmatic tools. We treat prisoners well to encourage reciprocity, not because their actions are morally identical.
          *   *Analysis:* Standard Revisionist counter to the legalist argument. Distinguishes *jus in bello* (law) from *jus ad bellum* (morality of cause).
          *   *Verdict:* Good point (distinguishes pragmatism from moral ontology).

      *   **Move 5: Dana's Complicity Reductio.**
          *   *Argument:* If unjust soldiers are murderers, then civilians supporting them are complicit and thus liable to attack. This violates non-combatant immunity.
          *   *Analysis:* A strong slippery slope argument. It targets the practical implications of Revisionism.
          *   *Verdict:* Good point (highlights a major bullet Revisionists have to bite).

      *   **Move 6: Marcus's Complicity Threshold.**
          *   *Argument:* Complicity is scalar. Soldiers are direct threats; civilians are indirect. Liability requires a high threshold of causal contribution.
          *   *Analysis:* This is the standard Revisionist defense (McMahan's "liability to defensive harm"). It's theoretically consistent but practically tricky.
          *   *Verdict:* Decent point (theoretically sound, but hard to apply cleanly).

      *   **Move 7: Dana's Boxing/Fair-Play.**
          *   *Argument:* Soldiers take mutual risks. It's a consensual lethal bargain.
          *   *Analysis:* This appeals to the idea of war as a practice or institution with internal norms.
          *   *Verdict:* Bad/Weak point. War isn't a game. The "consent" is often coerced or non-existent.

      *   **Move 8: Marcus's Mugger Reply.**
          *   *Argument:* A mugger risks getting shot by the victim/police. That doesn't make mugging morally equal to self-defense.
          *   *Analysis:* Devastating analogy. Risks taken by a wrongdoer don't justify their wrongdoing.
          *   *Verdict:* Good point (clearly dismantles the fair-play analogy).

      *   **Move 9: Dana's Two-Versions Thought Experiment.**
          *   *Argument:* Same soldier, different epistemic states (lied to vs. knows truth). If morality changes based on knowledge, it's not about *combatants*, it's about *ignorance*.
          *   *Analysis:* This tries to show MEC is unstable. If morality depends on knowledge, then "equality" is accidental.
          *   *Verdict:* Decent point (highlights the epistemic problem), but Marcus accepts this.

      *   **Move 10: Marcus's Acceptance.**
          *   *Argument:* Yes, it collapses into excusing ignorance. That's the truth.
          *   *Analysis:* Marcus holds the line. He admits MEC is false; only *excused* violence is equal in terms of blame, not rightness.
          *   *Verdict:* Consistent with his position.

  3.  **Identify the Crux (What are they missing?):**
      *   They are talking past each other because they are using different *categories* of evaluation.
      *   Dana is arguing from the **Internal/Institutional Perspective** (How war works as a practice, law, and social reality). She cares about the *status* of the soldier within the institution of war.
      *   Marcus is arguing from the **External/Moral Perspective** (Objective morality, individual liability, self-defense theory). He cares about the *truth* of the cause and individual moral responsibility.
      *   *The Missing Link:* The distinction between **Objective Permissibility** (Marcus) vs. **Subjective Blameworthiness/Institutional Role** (Dana). Also, the distinction between *Jus ad Bellum* (justice of war) and *Jus in Bello* (justice in war).
      *   *Deep Crux:* Is war a *special moral zone* with its own rules (Walzer/Michael Gross), or is it just *ordinary morality applied to groups* (McMahan)? Dana leans Walzerian; Marcus leans Revisionist.

  4.  **Drafting the Response:**
      *   *Structure:*
          1.  Introduction (acknowledge the classic debate: Traditionalism vs. Revisionism).
          2.  Move-by-Move Referee (bullet points for clarity).
          3.  The "What's Missing" Section (The Crux).
          4.  Conclusion (Who "won" philosophically vs. practically).
      *   *Tone Check:* Ensure I don't take sides too hard, but acknowledge that Marcus represents the dominant *philosophical* view (Revisionism) while Dana represents the dominant *legal/practical* view (Traditionalism/Walzerian).
      *   *Refinement:* Make sure to explicitly name the theories (Michael Walzer vs. Jeff McMahan) as this gives the user keywords for further reading.
      *   *Specific Move Evaluation:*
          *   Dana's Boxing: Definitely weak.
          *   Marcus's Mugger: Very strong.
          *   Dana's Complicity: Strong challenge to Revisionism.
          *   Marcus's Threshold: Theoretical fix, but practically worrying.
      *   *The "Missing" Insight:* It's not just about knowledge; it's about whether war creates a *new* moral relationship or just extends peacetime morality.

  5.  **Final Review against constraints:**
      *   Did I cover all moves? Yes.
      *   Did I say Good/Bad/Overreaching? Yes.
      *   Did I explain the crux? Yes.
      *   Is it helpful for a reading group member? Yes, by providing context and terminology.

  6.  (Self-Correction during drafting): I need to be careful not to say Dana is "wrong" in a practical sense. Her arguments align with International Humanitarian Law (IHL). Marcus aligns with contemporary analytic philosophy of war. I should frame it as "Institutional Pragmatism" vs. "Moral Fundamentalism."

  7.  *Final Polish:* Ensure the distinction between *justification* and *excuse* is clear, as that's the hinge of the whole debate. (Dana conflates them; Marcus separates them).

  8.  *Output Generation* (matches the thought process).
answer: |-
  This is a classic debate in contemporary just war theory. You have stumbled onto the central fault line between **Traditionalism** (often associated with Michael Walzer) and **Revisionism** (associated with Jeff McMahan). Dana is arguing for the "Moral Equality of Combatants" (MEC), while Marcus is arguing for "Moral Inequality of Combatants."

  Here is the move-by-move referee report, followed by the underlying crux you sensed they were missing.

  ### Move-by-Move Referee

  **1. Dana's Opening: The Reasonable Belief Argument**
  *   **Verdict:** **Decent point, but conflates categories.**
  *   **Why:** Dana is relying on the principle of *invincible ignorance*. If a soldier cannot know their cause is unjust, they aren't *blameworthy*. However, she slides from "not blameworthy" to "morally on a par." In ethics, there is a difference between an action that is *excused* (you did wrong, but we won't punish you) and an action that is *justified* (you did right). Dana treats them as the same; Marcus does not.

  **2. Marcus's Reply: Excuse vs. Equality**
  *   **Verdict:** **Good point (Philosophically robust).**
  *   **Why:** This is the core Revisionist distinction. Marcus is correct that moral equality requires *objective* justification, not just subjective blamelessness. If I accidentally kill you because I thought you were a bear, I may not be a murderer, but I still killed you unjustifiably. The person shooting a bear to save you acted justifiably. The acts are not morally equal, even if the agents are equally blameless.

  **3. Dana's Law-of-War Symmetry (LOAC/IHL)**
  *   **Verdict:** **Good point (Pragmatically), Overreaches (Morally).**
  *   **Why:** Dana is right that International Humanitarian Law *requires* symmetry to function. If we tell soldiers, "You might be hanged as a murderer if your side loses," no one will surrender, and wars become more brutal. However, she commits an *is-ought* fallacy: just because the law treats them equally doesn't mean morality *must*. Law is often a pragmatic compromise, not a mirror of moral truth.

  **4. Marcus's Institutions vs. Truth**
  *   **Verdict:** **Good point.**
  *   **Why:** Marcus correctly identifies that laws of war are regulatory tools designed to minimize suffering, not perfect moral arbiters. We give POWs rights to encourage reciprocity, not because their killing was morally permissible. This successfully parries Dana's legal argument without conceding the moral point.

  **5. Dana's Complicity Reductio**
  *   **Verdict:** **Good point (The strongest challenge to Marcus).**
  *   **Why:** This is the "Slippery Slope" objection to Revisionism. If unjust soldiers are liable to be killed because they are threats, what about the taxpayers or voters who enabled them? If Marcus says "they are liable too," he violates the principle of non-combatant immunity. If he says "they aren't," he needs a very sharp line between soldier and civilian. Dana exposes a major bullet Revisionists have to bite.

  **6. Marcus's Complicity Threshold**
  *   **Verdict:** **Decent point (Theoretically sound, practically messy).**
  *   **Why:** Marcus argues that liability is scalar. Soldiers are *direct* threats; civilians are *indirect*. This is theoretically consistent, but in modern war (drone operators, factory workers, voters), the line is blurrier than Marcus admits. It's a valid defense, but it requires a lot of philosophical heavy lifting to prevent civilian casualties from becoming permissible.

  **7. Dana's Boxing/Fair-Play Argument**
  *   **Verdict:** **Bad point.**
  *   **Why:** This relies on the idea of war as a consensual practice or sport. But soldiers (especially conscripts) do not genuinely consent to kill or be killed in the way boxers consent to a match. Furthermore, "fair play" only applies between parties engaged in a permissible activity. You can't have "fair play" in a robbery.

  **8. Marcus's Mugger Reply**
  *   **Verdict:** **Good point (Devastating analogy).**
  *   **Why:** This dismantles Dana's boxing analogy. A mugger risks being shot by the victim or police, but that risk does not make the mugging morally equivalent to the victim's self-defense. The mugger is liable to defensive harm; the victim is not. This highlights that *risk* does not create *moral parity*.

  **9. Dana's Two-Versions Thought Experiment**
  *   **Verdict:** **Decent point (Highlights the epistemic problem).**
  *   **Why:** Dana tries to show that Marcus's view makes moral status depend on luck (what the soldier happened to know). She argues this destroys the idea of "combatant equality." She is right that it destroys *her* version of equality, but she fails to see that Marcus never believed in that kind of equality to begin with.

  **10. Marcus's Acceptance**
  *   **Verdict:** **Good point (Consistent).**
  *   **Why:** Marcus bites the bullet. He admits that "equality" is an illusion created by our inability to judge knowledge. He stands firm on the idea that objective morality doesn't change based on what the soldier knows, only our judgment of the *soldier* changes.

  ---

  ### The Crux: What They Are Missing

  You sensed they were talking past each other because **they are arguing from two different moral frameworks entirely.** They aren't disagreeing on the facts; they are disagreeing on *what kind of question they are asking.*

  **1. The Internal vs. External Perspective**
  *   **Dana (Traditionalist/Walzerian):** She is arguing from the **Internal Perspective of the Institution of War.** She views war as a distinct social practice with its own rules (like a game or a legal system). In this view, once you put on the uniform, you enter a "moral sphere" where your individual cause matters less than your role. Her goal is to regulate the *practice* of war to keep it from becoming total slaughter.
  *   **Marcus (Revisionist/McMahanite):** He is arguing from the **External Perspective of Ordinary Morality.** He views war as nothing more than large-scale violence, subject to the same rules as peacetime (self-defense, liability, aggression). In this view, there is no "magic uniform" that changes right and wrong. His goal is moral truth, even if it makes war harder to regulate.

  **2. Justification vs. Excuse**
  This is the technical hinge.
  *   **Dana** thinks that if you aren't *blameworthy*, you are *permitted*. She collapses the distinction between **Justification** (the act was right) and **Excuse** (the act was wrong, but the agent isn't at fault).
  *   **Marcus** insists on keeping them separate. He argues unjust soldiers are *excused* (due to ignorance/coercion) but not *justified*.

  **3. The "Deep Convention" vs. "Moral Truth"**
  *   **Dana** is implicitly arguing that moral truth in war is *constructed* by our conventions. If we agree soldiers are equal, then they *are* morally equal within the context of war.
  *   **Marcus** argues moral truth is *discovered*, not constructed. Conventions can't make murder permissible.

  ### Who "Won"?

  *   **Philosophically:** **Marcus.** His distinctions (justification vs. excuse, liability vs. blame) are tighter and align better with general moral theory. Dana's "boxing" analogy was particularly weak, and her reliance on current law as proof of morality is a logical fallacy.
  *   **Practically:** **Dana.** Her worries about the "Complicity Reductio" are the biggest unsolved problem in Revisionist theory. If we adopt Marcus's view, we risk undermining the laws of war that protect civilians and encourage surrender. Most philosophers admit Marcus is *theoretically* right, but Dana is *pragmatically* necessary.

  **Recommendation for your group:**
  Tell them to read **Michael Walzer's *Just and Unjust Wars*** (for Dana's view) and **Jeff McMahan's *Killing in War*** (for Marcus's view). The tension between them is the single most active debate in the ethics of war today. They aren't missing a specific argument; they are embodying the two poles of the field.
