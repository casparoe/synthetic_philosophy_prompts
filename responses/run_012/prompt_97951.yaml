  9.  **Final Polish:** Ensure the distinction between "violent death" and "safety" is clear. Ensure the Nan/Grandad point is addressed respectfully.

      *(Wait, one more check on the "Safest Moment" claim)*: Is it *the* safest moment? Or just *a* safe moment? The claim is superlative. That requires the rate to be lower than, say, 1950 or 1850. Homicide rates in Europe are at historic lows. War deaths per capita are low. Yes, the superlative is defensible statistically.

