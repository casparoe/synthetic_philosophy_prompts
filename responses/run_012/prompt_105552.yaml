  The heart beats on without a thought to spare.
  The body bears the weight of every try.
  A slow selection working in the dark.
  What dies is tried out in the world, not here.

  The creature learns the shape of fire by touch,
  Rewarded acts are kept, the others fade.
  No inner screen, just consequence and need.
  What dies is tried out in the world, not here.

  Now danger runs inside the quiet head,
  Where scenarios break before the bone.
  The hypothesis dies so I remain,
  A slow selection working in the dark.

  We pick up tools we did not forge ourselves,
  Marks on a page that think a part for us.
  The mind extends beyond the skin's demand,
  The body bears the weight of every try.

  The tower stands on floors we never leave,
  Each higher room still shakes with lower noise.
  We think with borrowed hands and ancient pulse,
  The heart beats on without a thought to spare.

  ***

  **Note on the text**

  This poem treats Dennett's four grades as a strict nested hierarchy, which is a heuristic reading rather than a settled scientific fact; some cognitive scientists argue these capacities are more modular or overlapping than the "tower" metaphor suggests. If future research demonstrated that the Gregorian level (cultural tools) is continuous with the Popperian level (internal modeling) rather than a genuine discontinuity where thinking is offloaded onto external artifacts, I would need to rewrite the fourth stanza to remove the sense of a break in kind. Finally, I am least confident in the line "Marks on a page that think a part for us," which risks sounding like magical thinking rather than the intended description of distributed cognition, though I kept it to preserve the plainness of the verse.
