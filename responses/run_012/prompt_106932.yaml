answer: |-
  This is a classic "engineer tries to solve law with code" move. It's rhetorically powerful because it frames textualism as "best practice" and purposivism as "technical debt." But as you suspect, the abstraction leaks everywhere.

  Here is the audit of the "Statute as API" analogy.

  ### 1. The Correspondence Table

  | Software Concept | Legal Counterpart (Friend's View) | Legal Reality (Your View) |
  | :--- | :--- | :--- |
  | **Public API / Interface** | The Enacted Text (the Bill as passed) | The Enacted Text + Precedent + Custom |
  | **Documentation / Spec** | The Text itself (self-docing) | Text + Explanatory Notes + Case Law |
  | **Private Implementation** | Legislative History (Hansard, Committee Reports) | Public Record of Negotiation & Compromise |
  | **Version Number** | Chapter Number / Year of Act | No semantic versioning; overlapping layers |
  | **Deprecation Policy** | Repeal or Amendment | Rarely explicit; implied repeal is messy |
  | **The Compiler** | The Court System (validates compliance) | Runs at *runtime*, not build time |
  | **Build Failure** | Case dismissed / Motion to strike | Ambiguity results in litigation, not crash |
  | **Test Suite** | Unit Tests / CI Pipeline | Case Law (generated *post*-deployment) |
  | **Caller A** | Plaintiff / Prosecution | Adversary 1 |
  | **Caller B** | Defendant | Adversary 2 |
  | **Library Maintainer** | Parliament / Legislature | 650+ MPs with conflicting intents |

  ### 2. Where the Analogy Breaks

  You identified the critical fault lines. Here is the breakdown of which breaks are cosmetic and which are structural.

  #### A. The "Single Author" Fallacy (Critical Break)
  *   **The Analogy:** An API implies a maintainer or a cohesive team with a unified design vision. If you read the source code (history), you find *the* intent.
  *   **The Reality:** A statute is a multi-party commit message. It is often the result of conflicting amendments to secure a majority. MP A votes for the bill because they think it means X; MP B votes for it because they think it means Y. The text is the only thing they actually agreed on.
  *   **Does it matter?** **Yes.** This is the strongest argument *for* your friend. If there is no single "intent," looking for it is a null pointer exception. However, it also breaks his "API Maintainer" metaphor. There is no one to complain if you misuse the internal logic, because there is no single logic.
  *   **Verdict:** This supports textualism, but it invalidates the "API" metaphor (which implies design coherence).

  #### B. The Missing Compiler (Critical Break)
  *   **The Analogy:** If you call an API wrong, the compiler throws an error. You fix it before deployment.
  *   **The Reality:** There is no build phase for law. You "deploy" your conduct (drive the car, sign the contract) and *then* the compiler (Court) runs. If there is ambiguity, the system doesn't crash; it spawns a thread (litigation) to resolve it.
  *   **Does it matter?** **Yes.** In engineering, we avoid undocumented quirks because the compiler might change. In law, the "runtime" (Judge) is explicitly *empowered* to resolve ambiguity. Ignoring the "implementation details" (purpose) forces the runtime to guess, increasing latency (court backlog) and non-determinism (inconsistent rulings).
  *   **Verdict:** Destroys the "stability" argument. Textualism increases runtime errors.

  #### C. Hyrum's Law (Critical Break)
  *   **The Analogy:** "Don't rely on undocumented behavior."
  *   **The Reality:** Hyrum's Law states: *With enough users, every observable behavior, documented or not, will be relied upon.* Citizens rely on the *purpose* of the law (the observable behavior of the state), not just the lexical tokens. If a law says "No vehicles in the park," but the history shows it was to stop noise, an ambulance (a vehicle) is allowed.
  *   **Does it matter?** **Yes.** If a citizen relies on the *spirit* (the observed behavior of enforcement) and the Judge switches to strict textualism, you have introduced a breaking change without a version bump. That is bad API design.
  *   **Verdict:** Strongly supports purposivism. Textualism violates Hyrum's Law.

  #### D. Versioning and Deprecation (Critical Break)
  *   **The Analogy:** You can pin your dependency to `v1.0`. If `v2.0` breaks you, that's on you to upgrade.
  *   **The Reality:** You cannot pin to the "1950 version" of the law. Old statutes accumulate. New statutes amend old ones implicitly. There is no changelog.
  *   **Does it matter?** **Yes.** In software, if an API is ambiguous, you wait for v2. In law, you must interpret v1 *now* while v43 is being written. Legislative history acts as the only available "release notes" for a system that never stops running.
  *   **Verdict:** Makes textualism impractical. You need the history to understand the delta.

  ### 3. Bottom Line: Did the Analogy Carry the Argument?

  **Yes.** The analogy was doing 100% of the heavy lifting.

  Without the API metaphor, textualism is just a claim about democratic legitimacy ("Judges shouldn't make law"). With the API metaphor, textualism becomes a claim about *system reliability* ("Judges shouldn't break the build").

  However, because the mapping is flawed, the conclusion doesn't hold.
  *   **If law were a well-maintained Stripe API:** Your friend would be right. Read the docs, ignore the source.
  *   **Since law is a legacy monorepo with 650 maintainers, no CI/CD, and no version control:** Your friend is wrong. In that environment, reading the commit messages (legislative history) isn't "cheating"; it's the only way to avoid introducing regressions.

  The analogy smuggles in the idea of a **benevolent, coherent designer**. Once you remove that, the "don't touch the internals" rule becomes "don't try to understand the system you are forced to live inside."

  ### 4. A Better Analogy

  You need an analogy that captures: **Multi-author, adversarial resolution, no compiler, mandatory usage, and messy versioning.**

  **The Better Analogy: The Internet Protocol Standard (e.g., TCP/IP or HTTP RFCs)**

  *   **The Spec (Statute):** The RFC document. It is the "text."
  *   **The Mailing List (Legislative History):** The archives where the standards body debated *why* a flag was added.
  *   **The Implementers (Judges):** Browser vendors, OS kernels, Router manufacturers. They have to make the spec work in the real world.
  *   **The Users (Citizens):** Everyone sending packets.
  *   **The Compiler (Network):** The packet either arrives or it doesn't. But different implementations might interpret the spec differently.
  *   **Versioning:** Backward compatibility is mandatory. You can't just "deprecate" IPv4 because IPv6 exists.

  **Why this wins the argument:**
  In network engineering, if the RFC is ambiguous (e.g., "how should this edge case be handled?"), do implementers ignore the mailing list discussions? **No.** They read the archives to understand the *intent* of the protocol designers to ensure **interoperability**.

  If one vendor (Judge) decides to be a "Textualist" and ignores the discussion archives, their implementation will likely fail to interoperate with the rest of the network (Society). They will drop packets (Injustice) that other nodes expect to be routed (Purpose).

  **The Pitch to Your Mate:**
  > "Law isn't a private library API; it's a **distributed consensus protocol**. The text is the RFC, but the legislative history is the mailing list. In distributed systems, if you implement the spec without reading the discussion threads on why the spec was written that way, you introduce incompatibility bugs. Textualism is like implementing TCP without reading the RFC comments: technically compliant, but the network drops your packets."

  This frames purposivism not as "judicial activism," but as "ensuring interoperability in a distributed system." That's an argument a backend engineer has to respect.
