  Let's go with **"The Multi-Vendor Industry Standard (like SQL or USB)"**. It captures the "committee" aspect best. In SQL, the spec is vague, and you *must* look at the committee notes to understand why `NULL` behaves that way. Ignoring that leads to bugs.

