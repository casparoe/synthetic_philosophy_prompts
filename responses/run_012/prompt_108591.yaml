prompt: |-
  Ok I need help settling a 15-year fight in my family, and I'm starting to think it's actually a philosophy question but I don't know enough to say.

  In 2007 my uncle talked my dad into taking out a big loan so they could gut and redo our family's restaurant — new kitchen, new dining room, the whole thing. The renovation did bring in a bunch of new regulars, that part is real, they weren't crazy. Then 2008 happened. By spring of 2009 the place was closed and my grandparents had basically lost everything. And here is where the fight lives: everyone has a story where their thing is the killer and everybody else's thing is a side note. Dad says the loan payments were the killer — without those, they ride out the recession fine. Uncle says that's nuts, every restaurant on that block died in '09, the economy was the killer and the loan was fine. My mom says actually it was the city rerouting the bus line off that corner in 2008, and also the place was dying before any of it, and she has the accountant's books from 2006-07 to prove they were already bleeding. And dad and uncle agree on exactly one thing, which is that if you pull their own factor out of the story, the restaurant still closes anyway. Which seems like it should be impossible for all of them to be right about at the same time? But I don't think it is?

  I'm writing a short history of the place to read at my grandparents 60th anniversary in October, and I don't want to just pick a side or write "many factors contributed" mush. Everytime I bring it up at dinner it goes bad, so I'm asking you instead. One thing: a friend who took some philosophy classes told me something that sounded smart but I couldn't tell if it was real or just words. She said the question isn't "why did it close" but "why did it close rather than survive," and that the answer changes depending on what you're contrasting it against. Is that a real thing or was she just talking?

  So concretely:
  1. Is there a fact of the matter about which one caused the closure, or does it just depend on what story you're telling?
  2. If there is, how do I get at it with the evidence I actually have — receipts, a few emails, the accountant's books, four people's memories?
  3. How do I write this so it's honest and specific without quietly siding with anyone?
  4. What do I say at the party when dad brings it up again, probably around the second beer?

  Please explain any jargon in plain terms, I'm not a philosopher and I won't be able to look anything up. American English please. Thanks.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A 15-year family feud over why the family restaurant failed (2007 renovation loan vs. 2008 recession vs. bus line reroute/pre-existing decline).
      *   **Goal:** Write a short history for the grandparents' 60th anniversary that is honest, specific, and doesn't pick sides or resort to vague "many factors" mush. Also, needs advice on handling the topic at the party.
      *   **Specific Questions:**
          1.  Is there a single factual cause, or does it depend on the narrative?
          2.  How to analyze the available evidence (receipts, emails, books, memories)?
          3.  How to write the history neutrally but specifically?
          4.  What to say at the party if the fight reignites?
      *   **Constraint:** The user's friend mentioned a philosophical concept ("why did it close rather than survive"). Is that real? Explain jargon in plain English. American English.

  2.  **Address the Philosophical Concept (Question 1 & Friend's Comment):**
      *   *Concept:* The friend is referring to "contrastive explanation" or "causal selection" within the philosophy of causation.
      *   *Validity:* Yes, it's a real and respected idea. It's not just word salad.
      *   *Explanation:* Causes aren't just a list of everything that happened. We pick the "cause" based on what we are comparing the event to.
          *   Compare to *other restaurants*? Then the recession is the cause (they all died).
          *   Compare to *this restaurant in a different year*? Then the loan/debt is the cause (they couldn't pivot).
          *   Compare to *this restaurant without the bus change*? Then the bus line is the cause.
      *   *Takeaway:* Everyone is technically "right" about their factor being *a* cause, but they are arguing about which cause is the *most important* based on their hidden comparison.

  3.  **Analyze the Evidence (Question 2):**
      *   *Available:* Receipts, emails, accountant's books (2006-07), memories.
      *   *Method:* Counterfactual reasoning (thinking about "what if").
      *   *Test:*
          *   *The Loan:* If no loan, do they survive 2008? Look at cash flow projections vs. actual debt service.
          *   *The Recession:* Look at competitors. Did debt-free restaurants on the block survive? If yes, recession + debt = death. If no, recession = death regardless.
          *   *The Bus/Pre-existing:* Look at 2006-07 books. Were they actually bleeding? If profitable in '07, the "dying before" claim is weak. If losing money, the loan was riskier.
      *   *Synthesis:* It's likely an "INUS condition" (Insufficient but Non-redundant part of an Unnecessary but Sufficient condition). *Self-correction:* Don't use the acronym INUS. It's too much jargon. Just explain the idea: A match needs oxygen and fuel to make fire. Which is the cause? All of them. The restaurant needed solvency + traffic + economy. Remove one, it falls.

  4.  **Drafting the History (Question 3):**
      *   *Tone:* Narrative, not forensic. Focus on *effort* and *context* rather than *blame*.
