prompt: |-
  I run compliance for a mid-sized NGO working in about a dozen countries, and what actually eats my week isn't fraud, it's gifts: envelopes, hampers, lunches, facilitation payments, a case of whisky for someone's brother's wedding. Staff ask me weekly whether something counts as a bribe and Ive been winging it. Our regional director keeps saying the whole framing is parochial -- that in a lot of these places a transfer to an official isn't payment for a decision but how a relationship gets acknowledged, and that reading it as a bribe assumes a public/private split plenty of places don't organise themselves around; he adds that corruption talk locally is usually an accusation aimed at whoever's ahead, not a neutral description. I don't want to wave that off, and I don't want to pretend HQ's standard is neutral either. So give me a procedure I can run in about twenty minutes on a request: the questions in order, what counts as enough of an answer to each, where it stops with a clean no, and where it hands the call to a named person because the question has stopped being factual (which conception of corruption we're using, and who eats the cost). It has to survive a country office that resents it and a board that wants a defensible file. Then run it on three: the customary gift to the village chief at every project launch -- he has no say over our contracts, but he does decide whose families get onto our beneficiary list; a small cash payment to a clerk to move a permit we're legally entitled to; and our chair's complaint that the real rot is that every hire now runs through two families, with no envelope anywhere. Make sure one of them comes out telling us to stop something we've done for years, and tell me what the procedure can't decide.
reasoning: |-
  Here's a thinking process that leads to the suggested compliance procedure and analysis:

  1.  **Analyze the User and Context:**
      *   **Role:** Compliance Officer for a mid-sized NGO.
      *   **Scope:** Operations in ~12 countries (likely diverse legal/cultural contexts).
      *   **Pain Point:** "Gifts" (envelopes, hampers, lunches, facilitation payments, personal favors) consume the week, not major fraud.
      *   **Conflict:** HQ/Board wants defensible files (zero tolerance/risk-averse) vs. Regional Director (RD) argues Western anti-corruption frameworks are parochial, ignore local relational realities, and weaponize "corruption" accusations.
      *   **Goal:** A 20-minute decision procedure (flowchart/checklist style) that balances cultural nuance with legal/ethical defensibility.
      *   **Requirement:** Must handle three specific scenarios, force a "stop doing this" conclusion on one long-standing practice, and identify what the procedure *cannot* decide.

  2.  **Deconstruct the Philosophical Tension:**
      *   *Universalist/HQ View:* Bribery is objectively wrong, illegal (FCPA, UK Bribery Act), and distorts markets/aid.
      *   *Relativist/RD View:* "Gifts" build relationships, public/private split is artificial in some contexts, "corruption" is a political weapon.
      *   *The Middle Ground:* The procedure needs to acknowledge the RD's point (context matters) without violating the HQ's need (legal safety + mission integrity). It can't just be "follow local law" because local law might be weak or selectively enforced. It can't be "follow HQ policy" because that ignores reality. It needs to be *principled pragmatism*.

  3.  **Drafting the Procedure (The "20-Minute Test"):**
      *   *Time Limit:* Needs to be fast. 5-7 key questions max.
      *   *Structure:* Sequential gates. If you fail one, stop or escalate.
      *   *Key Dimensions:*
          1.  **Legality:** Is it explicitly illegal under local *or* donor law? (Hard stop).
          2.  **Intent/Quid Pro Quo:** Is it to influence a specific decision? (Bribe vs. Gift).
          3.  **Transparency:** Can we record it openly? (Sunlight test).
          4.  **Value/Proportionality:** Is it reasonable within local custom?
          5.  **Beneficiary Impact:** Does it distort aid delivery? (Crucial for NGOs).
      *   *Escalation:* When does it go to the "Named Person"? Needs to be when the question shifts from "Is this allowed?" to "What kind of organization are we?"
      *   *Documentation:* Essential for the Board.

  4.  **Developing the Three Scenarios:**

      *   **Scenario 1: Village Chief Gift.**
          *   *Context:* Customary, no contract power, controls beneficiary list.
          *   *Analysis:* This is the trickiest. It's "customary" (RD point) but controls *beneficiaries* (mission integrity). If the Chief decides who gets aid based on gifts, that's diversion of aid.
          *   *Outcome:* Needs to be the "Stop doing this" one. Why? Because it compromises the *mission*, not just the law. It turns aid into a patronage tool.
          *   *Nuance:* The procedure must flag the "Beneficiary Impact" question.

      *   **Scenario 2: Facilitation Payment (Clerk).**
          *   *Context:* Small cash, legally entitled permit, speeding things up.
          *   *Analysis:* Illegal under UK Bribery Act (usually), gray under FCPA (exception exists but narrowing). HQ hates it. RD says it's "grease."
          *   *Outcome:* Hard No (Legal/Policy). But the procedure needs to show *why* it's a No (Legality/Transparency).
          *   *Wait, I need one "Stop something we've done for years."* The Chief gift feels more culturally entrenched than the clerk payment. Let's make the Chief gift the "Stop" because it violates the *humanitarian principle* of impartiality, which is harder to defend than a facilitation payment which is just "illegal." Actually, facilitation payments are often the "done for years" item. Let's look at the prompt again: "Make sure one of them comes out telling us to stop something we've done for years." The Chief gift is likely older. Let's make the Chief gift the "Stop" because it compromises *impartiality*. The Clerk payment is a "Hard No" based on law. The Chair's Complaint is "Escalate."
          *   *Refinement:* Let's make the *Chief Gift* the one we stop. It's the most insidious because it looks like culture but undermines the core mission (needs-based aid).

      *   **Scenario 3: Chair's Complaint (Nepotism/Families).**
          *   *Context:* Hiring runs through two families, no cash/envelope.
          *   *Analysis:* No money changes hands. It's social capital/clan dynamics.
          *   *Outcome:* The procedure can't decide this. It's not a transaction. It's systemic culture. It needs the "Named Person" (Board/ED) to decide on organizational identity.

  5.  **Refining the Procedure (Iterative Polish):**
      *   *Name:* The "Relational Integrity Protocol" (acknowledges RD's point).
      *   *Steps:*
          1.  Legal Check (Local + Donor).
          2.  The "Newspaper Test" (Publicity).
          3.  The "Quid Pro Quo" Check (Influence).
          4.  The "Mission Distortion" Check (Beneficiaries).
          5.  The "Recordability" Check (Accounting).
      *   *Escalation Point:* If Q3 or Q4 is ambiguous, or if it involves systemic hiring (Scenario 3).
      *   *Named Person:* Compliance Director + Regional Director (Joint sign-off for nuance).

  6.  **Drafting the Response:**
      *   *Tone:* Professional, empathetic to the RD's critique, firm on the Board's needs.
      *   *Structure:*
          1.  Introduction (acknowledging the tension).
          2.  The Procedure (The 20-Minute Protocol).
          3.  The Escalation Path (Who decides the "philosophy").
          4.  Application to the Three Cases.
          5.  The Limitations (What the procedure can't do).

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the Chief Gift decision defensible to the Board? Yes, because it violates impartiality. Is it defensible to the Country Office? It will be resented, but the procedure shows *why* (Mission Distortion).
      *   *Critique:* Did I address the RD's point? Yes, by including a "Cultural Custom" verification step, but subordinating it to Mission Integrity.
      *   *Critique:* Is the "Named Person" clear? Yes, needs to be someone who owns the risk (e.g., Executive Director or Board Audit Chair).
      *   *Check:* Did I ensure one "Stop something we've done for years"? Yes, the Chief Gift.
      *   *Check:* Did I identify what the procedure can't decide? Yes, the systemic nepotism (Scenario 3) because it's not a transaction.

  8.  **Final Polish:** Ensure the distinction between "Bribe" (transactional) and "Corruption" (systemic) is clear in the limitations section. Make sure the "Named Person" isn't just the Compliance Officer (since the user is the one asking). It should be the ED or a Committee.

  *(Self-Correction on Scenario 1 vs 2)*: Facilitation payments are often the "done for years" habit. However, the Chief Gift is more aligned with the RD's argument about "relationships." Stopping the Chief Gift is a stronger statement on *mission* vs *culture*. Stopping the facilitation payment is just *law*. I will make the Chief Gift the "Stop" because it's the harder cultural pill to swallow and fits the RD's "relationship" argument better, showing where the line is drawn. Actually, looking at the prompt: "Make sure one of them comes out telling us to stop something we've done for years." Both fit. I will choose the Chief Gift because it highlights the tension between "Custom" and "Impartiality."

  *Wait, let's reconsider the Facilitation Payment.* Many NGOs have "paid grease" for years. It's explicitly illegal under UK Bribery Act (which applies to many NGOs). Stopping that is a legal compliance hard stop. Stopping the Chief gift is a *policy* hard stop. The prompt asks for a procedure that survives a country office that resents it. Stopping the Chief gift will cause more resentment than stopping a clerk bribe. I'll stick with the Chief Gift as the "Stop" because it requires the nuanced procedure to uncover the risk, whereas the clerk payment is a simple legal "No."

  *Wait, looking at the "Named Person" requirement:* "where it hands the call to a named person because the question has stopped being factual." This applies best to Scenario 3.

  *Final Plan:*
  1. Protocol: 5 Questions.
  2. Escalation: To Executive Director (ED).
  3. Case 1 (Chief): STOP (Mission Impairment).
