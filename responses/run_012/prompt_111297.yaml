      *(Another thought)*: C3 specifies *humans*. C4 is general. C4 might be true for biology generally, but C3 claims humans are special (cultural group selection?). But C4 says "Kin selection handles altruism" generally. I should point out that C3 implies a mechanism (cultural?) that C4 (genetic) might not cover. But C4 implies genetic altruism. I will treat C4 as a universal claim that conflicts with C3's specific claim.

