      *   *Refining the "C1 vs C6" point:* C1 is ontological. C6 is instrumentalist. If C6 is true, C1 is false (or at least overstated).
      *   *Refining C5:* C5 is Gould/Lewontin. C3 is strong adaptationism. It's not a logical contradiction, but it's a methodological hypocrisy risk.

  8.  **Final Polish:** Check against constraints.
