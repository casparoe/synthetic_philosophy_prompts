answer: |-
  You have identified one of the most significant fault lines in the ontology of computational complexity. The phenomenon you describe is not merely a technicality of notation; it reveals that the standard classification of problems (P vs. NP) is not intrinsic to the logical structure of the problem alone, but is relative to the *information density* of the input representation.

  There are established terms for this, but they are often taught as mere classification rules rather than the conceptual distinction you are seeking. I will outline the specific terminology, but focus primarily on the "carving" you requested: what the distinction isolates, what it ignores, and where the conceptual boundaries lie.

  ### 1. The Algorithmic Concept: Pseudo-Polynomial Time

  The specific situation you described—an algorithm whose running time is polynomial in the *numeric value* of the input but exponential in the *bit-length* of the input—is formally called **pseudo-polynomial time**.

  **The Carving:**
  This concept carves out a specific class of algorithms that masquerade as efficient.
  *   **What it covers:** It applies exclusively to problems involving numeric inputs (integers, typically). It captures algorithms where the control flow depends on iterating up to the value of a number (e.g., a loop running $N$ times) rather than iterating over the structure of the input data (e.g., a loop running $n$ times, where $n$ is the count of numbers).
  *   **What it excludes:** It does not apply to algorithms that are simply "slow polynomials" (e.g., $O(n^{10})$). An $O(n^{10})$ algorithm is truly polynomial; doubling the input size (in bits) increases runtime by a factor of $2^{10}$. A pseudo-polynomial algorithm (e.g., $O(N)$ where $N$ is the value) increases runtime by a factor of $2^k$ if you add $k$ bits to the value.
  *   **The Edge:** The boundary is sharp. If the runtime is bounded by a polynomial in the *length* of the binary encoding, it is polynomial. If it is bounded by a polynomial in the *magnitude* of the numbers, it is pseudo-polynomial.

  **Why "Pseudo"?**
  The prefix is a warning. In complexity theory, "efficiency" is defined as scalability with respect to *information content* (bits), not *physical magnitude*. A 128-bit number is not "twice as big" as a 64-bit number in terms of information; it is exponentially larger in magnitude. A pseudo-polynomial algorithm fails to scale with information content.

  ### 2. The Problem-Theoretic Concept: Weak vs. Strong NP-Completeness

  You asked if there is a settled way to mark the difference between a hardness result that survives encoding changes and one that is an artifact of binary representation. Yes. This distinction is formalized as **Weak NP-Completeness** versus **Strong NP-Completeness**.

  **The Carving:**
  *   **Weakly NP-Complete:** A problem is weakly NP-complete if it is NP-complete when numbers are encoded in binary, but admits a pseudo-polynomial time algorithm. Consequently, if you were to encode the numbers in **unary** (where the length of the input is proportional to the magnitude), the problem would fall into **P**.
      *   *Example:* The Knapsack Problem. Your scheduling tool likely solves a variant of this. It is NP-complete in general, but solvable in $O(n \cdot W)$ time (where $W$ is the budget/capacity).
      *   *Implication:* The "hardness" of the problem is largely an artifact of the compression provided by binary encoding. If the numbers are small (as in your research group's practical use), the problem is effectively easy.
  *   **Strongly NP-Complete:** A problem is strongly NP-complete if it remains NP-complete even when all numbers in the input are bounded by a polynomial in the number of input items.
      *   *Example:* The Traveling Salesman Problem (TSP) or 3-Partition.
      *   *Implication:* The hardness is intrinsic to the combinatorial structure, not the magnitude of the numbers. No pseudo-polynomial time algorithm exists for these problems (unless P = NP). Switching to unary encoding does not help; the input size in unary would be polynomially related to the binary size (since the numbers are small), yet the problem remains hard.

  **The Philosophical Import:**
  This distinction validates your suspicion. "Hardness" is doing two jobs.
  1.  **Combinatorial Hardness:** (Strong NP-Completeness) The difficulty arises from arranging discrete structures (graphs, sets). This is robust across encodings.
  2.  **Arithmetic Hardness:** (Weak NP-Completeness) The difficulty arises from the sheer size of the search space generated by large numeric values. This is encoding-sensitive.

  ### 3. The Foundational Concept: Reasonable Encodings and Invariance

  You asked whether the distinction attaches to problems, encodings, or the relation between the two. The foundational answer lies in the **Invariance Thesis** (proposed by Slot and van Emde Boas).

  **The Concept:**
  The Invariance Thesis states that "reasonable" models of computation can simulate each other with at most a polynomial overhead. This justifies using Turing Machines (and binary encoding) as the standard for complexity. However, "reasonable" is the operative word.

  **The Carving:**
  *   **Reasonable Encodings:** An encoding is reasonable if it is concise and allows for efficient translation to/from other reasonable encodings. Binary is reasonable for numbers.
  *   **Unreasonable Encodings:** Unary is generally considered unreasonable for large numbers because it violates the principle of conciseness (input length is exponential in the information content).
  *   **The Exception:** For Weakly NP-Complete problems, unary encoding is sometimes treated as a "parameterized" view of the problem. When we say a problem is in P under unary encoding, we are effectively saying the *numeric magnitude* is not the source of the complexity.

  **Where the Definition is Sharp:**
  The distinction is formally sharp regarding the existence of algorithms.
  *   If a problem is Strongly NP-Complete, there is **no** algorithm polynomial in the unary input length (unless P=NP).
  *   If a problem is Weakly NP-Complete, there **is** an algorithm polynomial in the unary input length.

  **Where the Definition is Fuzzy (The Borderline):**
  The fuzziness lies in what counts as a "number" versus "structure."
  *   *Example:* In graph problems, the number of vertices $V$ is encoded in binary (taking $\log V$ bits). However, we almost always treat algorithms polynomial in $V$ (e.g., $O(V^2)$) as "polynomial time," not pseudo-polynomial.
  *   *Why?* Because $V$ is viewed as a measure of *structure size*, not a numeric value to be computed upon. We do not iterate *up to* $V$ in a way that depends on the magnitude of $V$ independent of the graph structure; we iterate over the vertices.
  *   *The Edge:* The distinction relies on the semantic role of the integer in the problem. Is the integer a *counter* of objects (structural, polynomial time) or a *capacity/value* to be filled (numeric, pseudo-polynomial)? This is not always syntactically decidable; it requires semantic interpretation of the problem domain.

  ### 4. Distinguishing from Other Gaps

  You mentioned the "mirror image"—polynomial algorithms with huge constants. It is vital to distinguish pseudo-polynomiality from this.

  1.  **Pseudo-Polynomial vs. High-Degree Polynomial:**
      *   An $O(n^{100})$ algorithm is theoretically efficient (in P) but practically useless. This is a gap between *asymptotics* and *constants*.
      *   A pseudo-polynomial algorithm is theoretically inefficient (not in P) but practically useful for bounded inputs. This is a gap between *encoding* and *magnitude*.
      *   *Crucial Difference:* If you double the input size of an $O(n^{100})$ algorithm, the runtime increases polynomially. If you add one bit to the input value of a pseudo-polynomial algorithm, the runtime doubles. The latter is an exponential explosion hidden by the choice of variable.

  2.  **Pseudo-Polynomial vs. Average-Case/Smoothed Analysis:**
      *   You noted your tool is fast on "every input my users actually produce." This suggests the inputs are not worst-case *and* the numbers are small.
      *   Pseudo-polynomial analysis is still a **worst-case** analysis, but worst-case over *values*, not just structure.
      *   If your inputs are small because of the *domain* (e.g., budgets never exceed $10,000), the problem is practically in P, even if theoretically Weakly NP-Complete. This is sometimes called **parameterized tractability** (specifically, tractable with respect to the parameter "max number value").

  ### 5. Summary and Synthesis

  To answer your specific questions directly:

  **Is there an established name?**
  Yes. The algorithm is **pseudo-polynomial**. The problem class is **Weakly NP-Complete** (as opposed to Strongly NP-Complete).

  **What does the concept cover and exclude?**
  *   **Covers:** Algorithms where runtime scales with the magnitude of numeric inputs ($O(V)$) rather than the bit-length ($O(\log V)$).
  *   **Excludes:** Algorithms that are truly polynomial in bit-length, and problems that are hard even when numbers are small (Strongly NP-Complete).

  **Is there a settled way to mark the difference in hardness?**
  Yes. **Strong NP-Completeness** is the marker for hardness that survives reasonable encodings. If a problem is Strongly NP-Complete, its hardness is structural. If it is only Weakly NP-Complete, its hardness is arithmetic/representational.

  **Does the distinction attach to problems, encodings, or the relation?**
  It attaches to the **problem definition relative to a parameterization**.
  *   Formally, we define the problem with a specific encoding (usually binary).
  *   We then ask: "Does the hardness persist if we bound the numeric values polynomially?"
  *   If yes $\rightarrow$ Strong (Structural Hardness).
  *   If no $\rightarrow$ Weak (Representational Hardness).

  **Is the definition sharp enough for borderline cases?**
  Mostly, but with one philosophical caveat. The distinction assumes we can agree on what constitutes a "numeric value" versus a "structural count." In most standard problems (Knapsack vs. TSP), this is clear. In novel combinatorial problems, classifying an integer parameter as "value" or "count" can be subjective, though the mathematical consequence (existence of a pseudo-polynomial algorithm) remains objective.

  **Proposal for the "Missing" Concept:**
  While the terms exist, the philosophical implication you noted—that efficiency is relative to representation—is often under-theorized in introductory contexts. You might find value in the term **Representational Robustness**.
  *   *Definition:* A complexity result is representationally robust if it holds across all "concise" (polynomially related) encodings of the input data.
  *   *Usage:* Strong NP-Completeness results are representationally robust. Weak NP-Completeness results are representationally fragile.
  *   *Utility:* This vocabulary allows you to discuss whether a hardness result tells you something about the *world* (the problem structure) or about the *map* (the encoding scheme).

  ### Conclusion

  Your intuition is correct. The "official" verdict of complexity theory (P vs. NP) is a verdict on the relationship between *information* and *computation*. Your tool works because your users provide inputs where the *information density* is low (small numbers), even if the *magnitudes* are sufficient to solve the practical task.

  The algorithm is **pseudo-polynomial**. The problem is **Weakly NP-Complete**. The hardness is **representationally fragile**.

  This is not a bug in complexity theory; it is a feature. It allows theorists to separate problems that are hard because they require searching a vast combinatorial space (TSP) from problems that are hard only because we allow the input to specify astronomically large numbers in very few bits (Knapsack). For a philosopher of CS, this is the crucial insight: **Complexity is not just about how hard a problem is to solve; it is about how much work is hidden in the compression of the input.**
