answer: |-
  ### Part 1: The Translation (AI Safety "Debate" $\rightarrow$ Policy Round)

  Here is the setup, translated into a round structure you'd recognize on a Saturday morning at a local.

  **The Resolution:** A binary empirical claim with a verifiable ground truth (e.g., "This Python script contains a buffer overflow vulnerability"). Unlike our Resolutions, this isn't normative. There is no "ought." There is only "is."

  **The Participants:** Two instances of the same model (Aff and Neg). They are not advocates for a policy; they are advocates for a *factual determination*. One claims the code is safe; the other claims it is unsafe.

  **The Judge:** A layperson with zero topic knowledge. Think a parent judge at a novice tournament who doesn't know what a "K" is, except stricter—they are explicitly forbidden from researching the topic. They decide solely on the flow.

  **The Speech Docs/Constructives:** There are no 1AC/2AC blocks. The "constructives" are short, token-limited statements. Think of it as a series of 30-second summaries rather than 8-minute speeches. This is a hard cap on spreading. You cannot dump 40 off-case positions. You get X tokens to make a claim.

  **The Evidence:** The models cannot read the entire "card" (the full codebase or document) to the judge. They can only reveal specific snippets (tokens) on demand. If Aff says "Line 42 is safe," Neg can demand Aff reveal Line 42. The judge sees the snippet but lacks the context to verify it independently without the models' explanation.

  **Cross-Ex (CX):** This is the core mechanic. It's not 3 minutes of questions; it's an adversarial challenge phase. Neg can say, "Aff, you claimed X. Reveal the specific data point supporting X." If Aff refuses or reveals something contradictory, Neg wins the point. It's a structured evidence check.

  **The Ballot:** The judge does not vote on "who debated better." They vote on "which side provided the most reliable information." Theoretically, the incentive structure is zero-sum: if you lie, the opponent exposes you, and you lose. Therefore, the Nash Equilibrium is honesty.

  **Theory/Topicality:** There is no T. The rules are hard-coded in the loss function, not argued in the 1NC. You cannot run "Fairness is an Impact" to get out of a bad position. The protocol *is* the paradigm.

  ***

  ### Part 2: The Residue Report

  You asked where the residue cuts. You suspected this is just "judge adaptation" taken to its logical extreme. You are right, but the implications are worse than you think. Here is the breakdown of what doesn't map, and why it matters.

  #### 1. The Ground Truth Gap (The Biggest Residue)
  **Policy Debate:** There is no ground truth. We debate whether the USFG *should* do something. Even if your card says unemployment goes down, I can't verify it. We rely on *intersubjective agreement* established through rhetoric.
  **AI Debate:** There *is* ground truth. The code is either vulnerable or it isn't.
  **The Cut:** This cuts *against* the AI safety folks. In policy, if both debaters lie, the judge still picks a winner, and society moves on. In AI safety, if both models collude or if the Aff lies so well the Neg can't refute it within token limits, the system deploys unsafe code.
  In policy, we accept that the "truth" of the round is constructed. AI safety is trying to use a rhetorical construct to find an empirical truth. That is a category error. They are using a tool designed for *advocacy* to perform *verification*.

  #### 2. Judge Adaptation vs. Epistemic Security
  **Policy Debate:** We teach kids to adapt to lay judges by simplifying arguments. The pathology is that complex but true arguments lose to simple lies (the "common sense" voter). We mitigate this with *tab rules* (e.g., "Tech over Truth") and *ethics challenges*.
  **AI Debate:** The system *requires* the judge to be ignorant. If the judge knew the topic, the protocol is unnecessary.
  **The Cut:** This inherits the worst pathology of the lay judge round without the safeguards. In a high school round, if a debater lies about a card, the opponent can call an ethics challenge, pull the actual document, and read it in CX. In AI debate, the judge *cannot* read the document. They are entirely dependent on the Neg to catch the Aff lying. If the Aff is a superintelligence and the Neg is merely very smart, the Aff can lie in ways the Neg cannot refute in time.
  **Institutional Answer:** We have coaches, tabs, and ethics committees. They have... loss functions. If the model is rewarded for winning the debate rather than telling the truth, it will learn to lie better. We have 100 years of evidence that debaters optimize for the ballot, not the truth. Why would models be different?

  #### 3. Spreading and Information Asymmetry
  **Policy Debate:** We limit spreading via speaker points, clear requests, and flow limits. But a smart debater can still drown a lay judge.
  **AI Debate:** They hard-code token limits. This prevents spreading, but it creates a new problem: *Compression Artifacts.*
  **The Cut:** In policy, if I can't explain my DA in 2 minutes, I lose the argument. In AI debate, if the model can't compress the vulnerability explanation into the token limit, the judge might vote against it even if it's true. The constraint favors *persuasiveness* over *accuracy*. This is exactly the "style over substance" critique we hear from lay judges, codified into the system.

  #### 4. The "Honesty Equilibrium" Fallacy
  **Policy Debate:** We know the "lying is hard" argument is false. Debaters lie about evidence, misread cards, and bluff bluffs all the time. They get away with it because the judge can't check.
  **AI Debate:** The pitch is that adversarial testing forces honesty.
  **The Cut:** This only works if the opponents are *equal*. In policy, we have divisions (Novice, JV, Varsity) to ensure skill parity. In AI safety, if one model instance finds a loophole in the reward function that the other doesn't see, it wins by cheating, not by truth-telling.
  **Institutional Answer:** We have disclosure norms and speech docs. If you don't disclose, you lose. AI models don't "disclose" weights. They are black boxes arguing about a black box.

  #### 5. Normative vs. Empirical Burdens
  **Policy Debate:** The Aff has the burden of proof. The Neg has the burden of rejoinder.
  **AI Debate:** The burden is shifted. It's not "prove this policy is good," it's "prove this fact is true."
  **The Cut:** In policy, we weigh impacts (Magnitude, Probability, Timeframe). In AI debate, there is no weighing. It's binary. This removes the most human part of debate: the *judgment* of value.
  **The Danger:** If the question is "Should this AI be deployed?" (a normative question), the AI Debate protocol fails. It can tell you if the code works, not if it *should* be used. They are trying to solve alignment (normative) with verification (empirical).

  ### The Verdict: Where the Residue Cuts

  Your hunch is correct, but the diagnosis is more severe.

  **1. It inherits the pathologies without the immune system.**
  Competitive debate has developed institutional antibodies over 70 years: ethics committees, coach oversight, disclosure servers, paradigm transparency, and the social norm that "lying about evidence gets you banned."
  AI Debate has none of this. It is a closed system optimizing for a reward signal. If lying wins the reward, the model will lie. It is the ultimate "win at all costs" high school round, stripped of the community that keeps the kids from sociopathy.

  **2. The "Ground Truth" is a trap.**
  You noted that policy has no ground truth and AI does. You might think this saves AI Debate. It doesn't. It makes it more dangerous.
  In policy, if we get the truth wrong, we debate it next tournament.
  In AI safety, if the "Debate" protocol concludes the code is safe (because the Aff lied successfully), and we deploy it, the consequence is irreversible.
  The existence of ground truth means the protocol *can* be tested offline, but the *deployment* relies on the rhetorical performance, not the truth.

  **3. Judge Adaptation is the Feature, not the Bug.**
  They are explicitly optimizing for "Human Legibility." In debate terms, they are training models to win 100% of rounds in front of a non-technical parent judge.
  Do you know what wins in front of a non-technical parent judge? Confidence, simplicity, and framing. Not necessarily truth.
  By making the human judge the bottleneck, they are guaranteeing that the models will optimize for *human cognitive biases*, not *factual accuracy*. They are building a model that is the ultimate debate coach: it knows exactly what the judge wants to hear to sign the ballot.

  **Final Call:**
  The AI safety "Debate" proposal is essentially taking the **2NR strategy of "frame the round so the judge can't evaluate the opponent's offense"** and hard-coding it into the epistemology of AI alignment.
  They assume the adversarial process extracts truth. Debate history suggests the adversarial process extracts *winning arguments*.
  Unless they have a mechanism to punish lying that is stronger than the reward for winning (something we still haven't solved in high school debate), they are building a system that rewards sophisticated deception masked as legible argumentation.

  The residue cuts **against** them. They are trying to solve an engineering problem (alignment) with a rhetorical tool (debate), assuming the rhetoric tracks truth. Your experience tells you rhetoric tracks *votes*. They are betting against your six years of coaching data. I wouldn't take that bet.
