prompt: |-
  I'm preparing a six-month project plan I have to defend to a small interdisciplinary review panel, and I need it written up as a one-page research proposal on program equilibrium. The setup: two agents play a one-shot game by each submitting a program, each program can read the other's source, and the familiar result is that mutual cooperation in a one-shot Prisoner's Dilemma is an equilibrium, since a program that cooperates just in case the opponent's source is identical to its own and defects otherwise is a best response to itself.

  My half-formed worry is that this equilibrium hangs on literal syntactic identity: alter one comment, one constant, or the order of two instructions in one player's program and cooperation collapses to mutual defection, though nothing that matters about either player's dispositions has changed. I want a proposal on whether program equilibrium admits a principled robustness condition — roughly, requiring a program to be a best response not only to itself but to a specified class of near-copies or perturbations of itself — and whether such a condition permits cooperation, forces defection, or turns out to be empty or ill-defined, in which case the interesting question becomes what the failure teaches us about what program equilibrium is modelling.

  The proposal needs: the question stated so that it has a determinate answer; why the existing treatments of program equilibrium leave it open (no literature review and no citations — I'll add those myself; if you think the matter is already settled, say what the nearest settled result is and what genuinely remains open instead); the method, concretely — what I would define, what I would try to prove, what I would try to build as a counterexample; a realistic six-month sequence; what a success would look like and what would count as the project failing; and a candid paragraph on the risk that this is a pseudo-problem because 'near-copy' has no language-independent meaning. If the honest verdict is that the condition is trivially empty, say so and give the fallback project.

  After the proposal, append a JSON object with exactly these fields: "title" (string); "research_question" (one sentence, determinate answer); "why_open" (string, at most 80 words); "formal_setup" (string, naming the objects to be defined and any assumptions about simulation and source access); "method_steps" (ordered array of strings); "timeline" (array of objects, each with "months" and "activity"); "success_condition" (string); "failure_condition" (string); "main_risk" (string); "fallback_project" (string); "feasibility_verdict" (exactly one of "tractable", "tractable only if narrowed", "probably a pseudo-problem").
