answer: |-
  Your friend is giving you the "rationalist blogosphere" summary (circa 2017), not the academic decision theory summary. He is right about the *structure* of the problem and the Newcomb analogy, but he is significantly misleading you about the status of Causal Decision Theory (CDT) and the sociological "settled view."

  Here is the audit of his claims, broken down by your three specific uncertainties and the broader theoretical landscape.

  ### 1. Which theory is this actually a problem for?
  **Friend's Claim:** This refutes EDT; CDT is fine.
  **Audit:** **Flatly Wrong.**

  Historically, "Death in Damascus" (Gibbard & Harper, 1978) was introduced specifically as a problem for **CDT**, not EDT.

  *   **The EDT Problem:** Your friend is correct that EDT struggles here. If Death is a perfect predictor, $P(\text{Death} | \text{Aleppo}) \approx 1$ and $P(\text{Death} | \text{Damascus}) \approx 1$. EDT calculates the expected utility of both actions as roughly zero (death). It renders the agent indifferent. This is the "fatalism" charge: EDT cannot recommend an action that offers a chance of survival because any action you *take* is evidence that Death anticipated it.
  *   **The CDT Problem:** This is where your friend's account breaks down. CDT says your choice cannot *cause* Death's prior location. So, you should assess the probability of Death being in Aleppo as independent of your choice.
      *   If you think Death is likely in Damascus, CDT says "Go to Aleppo."
      *   But if you decide to go to Aleppo, and you *know* Death is a perfect predictor, you must update your belief: "Since I am choosing Aleppo, Death predicted this and is in Aleppo."
      *   Now CDT says "Stay in Damascus."
      *   But if you decide to stay, you update: "Death predicted this and is in Damascus."
      *   Now CDT says "Go to Aleppo."

  This is not a "blemish"; it is a failure of **deliberational equilibrium**. CDT cannot find a stable pure strategy. It chases its own tail. Your friend claims CDT "just sends you to Aleppo." It can only do that if it ignores the predictor's reliability during the deliberation process, which violates the setup (you *know* Death is a perfect predictor).

  **Verdict:** The case is a problem for *both*, but the instability objection is the famous strike against CDT, not EDT.

  ### 2. Is the "fatalism objection" genuine or a description of the correct answer?
  **Friend's Claim:** EDT's indifference is a refutation because it confuses evidence with causation.
  **Audit:** **Wince-Worthy.**

  The "fatalism objection" is a genuine objection to EDT, but your friend's reasoning for *why* it refutes EDT is slightly off.

  *   **The Real Issue:** The problem isn't just that EDT is fatalistic; it's that EDT is **unratifiable**. A decision is ratifiable if, once you decide to do it, you don't wish you had decided otherwise given that you will do it. In Death in Damascus, if you decide to flee to Aleppo, EDT tells you that fleeing is now extremely strong evidence that Death is in Aleppo. So, conditional on your decision to flee, staying would have been better news.
  *   **Causation vs. Evidence:** Your friend says EDT confuses evidence with causation. That is the standard CDT critique of EDT in *Newcomb's Problem*. In *Death in Damascus*, the critique is sharper: EDT fails to provide a **unique recommendation**. If a decision theory cannot tell you which of two actions is better (even if both are bad), it is arguably incomplete.
  *   **Is Fatalism Correct?** One could argue the fatalism *is* the correct answer. If Death is a *perfect* predictor, survival is impossible (0% chance). In that specific limit case, indifference is rational. The problem arises if there is even a 0.01% error rate in prediction. EDT still tends toward fatalism because the correlation swamps the causal gap. CDT, properly patched, can exploit that error rate.

  **Verdict:** The objection is genuine. A decision theory that yields indifference in a scenario where a mixed strategy could yield a 50% survival rate (by becoming unpredictable) is failing to maximize utility.

  ### 3. Is the instability a strike against the theory he says it's a strike against?
  **Friend's Claim:** Instability is a CDT technicality fixed by a mixed-strategy patch.
  **Audit:** **Right Target, Wrong Severity.**

  Your friend identifies the right problem (instability) but downplays its significance.

  *   **Why it matters:** In standard CDT, you choose the action with the highest causal expected utility. If the expected utility of an action depends on the probability that you will choose it (because the predictor predicts it), CDT lacks a foundation. It requires **Ratifiability Decision Theory** (a patch) to solve.
  *   **The Mixed Strategy:** The "patch" is to randomize 50/50. This makes you unpredictable. Death must also randomize 50/50. Your survival chance becomes 50%.
  *   **The Theoretical Cost:** For CDT, adopting a mixed strategy here is awkward. CDT generally holds that you shouldn't randomize unless you are indifferent. But here, you randomize *to make the options unequal* (by breaking the predictor's link). This looks a lot like acknowledging that your decision algorithm is logically linked to the predictor's simulation—which is the core insight of **Timeless Decision Theory (TDT)** or **Functional Decision Theory (FDT)**.
  *   **The Strike:** The instability isn't a technicality; it's the wedge that drives people from CDT to FDT. If CDT needs to adopt logical correlation reasoning (via randomization) to solve Death in Damascus, it's conceding the main point of FDT.

  **Verdict:** It is a major strike against CDT. The "patch" effectively imports FDT logic into CDT.

  ### 4. The "Settled View" and the Newcomb Analogy
  **Friend's Claim:** EDT is dead, FDT is the successor, and this is just Newcomb's Problem.
  **Audit:** **Mixed.**

  *   **EDT is Dead:** **False.** In academic philosophy, EDT is not dead. It has robust defenses (e.g., by Arif Ahmed or Huw Price) particularly regarding the "Tickle Defense" and medical cases like the Smoking Lesion. It is less popular than CDT in economics, but it is not a "dead letter."
  *   **FDT is the Successor:** **Sociologically Specific.** FDT (Yudkowsky/Soares) is the "settled view" in the *rationalist* community (LessWrong/MIRI). In academic philosophy, FDT is a niche contender. TDT (Timeless Decision Theory) and Superrationality are more common academic cognates. Claiming "everyone has moved on" is true for your friend's circle, not the field at large.
  *   **Newcomb in a Robe:** **True.** Structurally, they are isomorphic.
      *   *Newcomb:* You want to **match** the prediction (Predictor puts \$1M in B if she predicts 1-box; you 1-box).
      *   *Death:* You want to **mismatch** the prediction (Death goes to Aleppo if he predicts Aleppo; you go to Damascus).
      *   *The Difference:* In Newcomb, correlation is your friend. In Death, correlation is your enemy.
      *   *Why it matters:* In Newcomb, CDT 2-boxes and loses money. In Death, CDT oscillates and risks death. Both failures stem from CDT's refusal to treat the decision as a logical output that the predictor simulates.

  ### The Corrected Moral
  If you want the version a careful decision theorist would endorse, it looks like this:

  1.  **Death in Damascus** demonstrates that **Ratifiability** is a necessary condition for a decision theory. Both EDT and standard CDT fail to find a ratifiable pure strategy.
  2.  **CDT** is not "fine." It requires a mixed-strategy equilibrium to solve the case, which undermines its claim to be purely causal (since you are randomizing to influence a past prediction).
  3.  **EDT** fails because it treats the action as evidence rather than a cause, leading to fatalism even when randomization could save you.
  4.  **FDT/TDT** handles this most naturally by recognizing that your decision and the prediction are logically correlated. It prescribes randomization to break the logical link, maximizing expected utility without the ad-hoc patches CDT requires.
  5.  **Newcomb Analogy:** It holds, but note the inversion: Newcomb rewards correlation; Death punishes it. Both reveal that ignoring logical correlation (as CDT does) leaves value on the table (or gets you killed).

  ### Summary for Your Reading Group
  Tell your friend:
  *   "You're right that EDT struggles, but you're understating the CDT crisis. Gibbard & Harper designed this to break CDT's deliberational stability, not just to bash EDT."
  *   "Calling the instability a 'technicality' ignores that the mixed-strategy solution basically forces CDT to admit logical correlation matters, which is the FDT pitch."
  *   "EDT isn't dead in academia, even if FDT is winning in the rationalist sphere."
  *   "The Newcomb analogy holds, but remember: Newcomb is about matching the prediction, Death is about mismatching it. That's why CDT oscillates in Death but just stubbornly 2-boxes in Newcomb."

  Your intuition that something was "subtly off" was correct. The friend treated a foundational crisis in CDT as a minor bug and presented a specific community's consensus (FDT) as the field's consensus.
