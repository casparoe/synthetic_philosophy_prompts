prompt: |-
  Ok so I've been slowly grinding through the decision theory stuff on my own — Newcomb, the smoking lesion, Parfit's hitchhiker, all of it — and I keep bouncing off Death in Damascus, and I've started to suspect the reason is that the way my friend explained it to me is subtly off somewhere, but I cant put my finger on where. We got into it after a reading group and he gave me what he called the settled view, and he's usually right about this stuff so I half believe him. His version: you meet Death in the market in Damascus, he says he'll be seeing you tomorrow, you panic and ride to Aleppo, and you die there — and Death explains he'd always had the appointment with you in Aleppo. Death is a perfect predictor of your choice, so whichever city you run to is the city where you die. On his telling, this is the counterexample that finally finished off evidential decision theory: EDT asks which action is the best news, staying is news that you die in Damascus and fleeing is news that you die in Aleppo, so EDT just shrugs and says the two are equally good, i.e. you might as well stay put and accept it. That's the fatalism objection, and he treats it as a refutation, because a theory that tells you not to bother trying once your action is correlated with the outcome has confused evidence with causation. Causal decision theory, he says, is fine — Death's location was fixed before you chose and your choice can't affect it, so CDT just sends you to Aleppo. The one blemish is that the reasoning is a bit unstable (once you notice yourself actually staying, you conclude fleeing would have saved you, and vice versa), but he calls that a technicality the mixed-strategy patch mops up, and says basically everyone has moved on to functional decision theory anyway and EDT is a dead letter. He also claims the whole thing is just Newcomb's problem in a robe, which I don't buy but can't articulate why.

  What I want is an audit, not a verdict on the puzzle: go through his summary and tell me what a decision theorist would nod at, what they'd wince at, and what's flatly wrong. I'm especially unsure about three things — which theory this case is actually supposed to be a problem for, whether the "fatalism objection" is a genuine objection or just a description of the correct answer here, and whether the instability he mentions is a strike against the theory he says it's a strike against. And if his moral (EDT refuted, CDT clean, FDT the successor) doesn't survive the corrections, tell me what a more careful version of it would be, and whether the Newcomb analogy earns its keep. Assume I know what expected utility is and roughly what the two theories say — dont re-explain the puzzle from scratch.
