      *   Critics (Klein, Boettke, Byrne) argue: Data isn't knowledge, and AI can't predict subjective preference shifts or entrepreneurial breakthroughs (*Discovery Problem*). Also, who codes the AI? (*Incentive/Power Problem*).
      *   *Which objection is doing the work?* In the *modern* context, the Information Problem is the bait, but the **Discovery Problem** is the killer. The Incentive Problem is the lurking shadow. However, the most potent modern critique focuses on the **Discovery/Entrepreneurial** aspect because AI is fundamentally interpolative (based on past data), whereas markets are extrapolative/creative.

