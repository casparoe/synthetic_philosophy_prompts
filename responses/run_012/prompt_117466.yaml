      *(Wait, re-reading the prompt)*: "The one question I am most hoping nobody asks." Usually, this is the "Gotcha" that reveals a fatal flaw. The fatal flaw in indeterminacy views is often: "Does this apply to future generations?" If the future is potentially infinite, does morality break down for *us*? Yes. That's a bullet many won't bite. Let's formulate that.

      *(Final Decision on Dreaded Question)*: "If the future is open and potentially infinite, does your view imply that *current* choices are morally indeterminate?" This makes the view practically paralyzing for a totalist.

      *(Wait, let's look at the Set Theorist again)*. The Set Theorist knows that $\omega + 1 \neq \omega$ in ordinals, even if $|\omega + 1| = |\omega|$ in cardinals. If value has a temporal structure, RI is false. That's a very strong objection. I will make sure that is high on the list.

      *(Final Plan)*:
      1. Totalist (The "Just Drop RI" attack).
      2. Set Theorist (The "Order Type" attack).
