      *   *Reply to Person-Affecting:* This isn't a reductio of impersonal value, but a boundary condition. Impersonal value works fine for finite cases. *Weakness:* Why draw the line at finite/infinite? Reality might be infinite.

  5.  **Identifying Concessions:**
      *   Don't claim infinite ethics is *impossible*. Claim *comparative betterness* is indeterminate.
