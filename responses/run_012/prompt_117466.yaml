          1.  *Replication Invariance (RI):* Bijection preserving individual value $\rightarrow$ equal goodness.
          2.  *Addition Intuition (AI):* Adding a positive life makes a world better.
      *   **Conflict:** In infinite sets, adding one element allows a bijection to the original set. So RI says "Equal," AI says "Better." Contradiction.
      *   **Conclusion:** No non-arbitrary way to resolve the conflict; hence, indeterminacy.
