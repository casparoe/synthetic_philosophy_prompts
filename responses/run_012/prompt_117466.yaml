answer: |-
  # Q&A Preparation Sheet: Indeterminacy in Infinite Population Ethics

  ## 1. High-Damage Objections (Ordered by Threat Level)

  ### **Objection 1: The Structuralist Attack (The Set Theorist)**
  **Phrasing:** "You treat Replication Invariance (RI) as relying solely on cardinality (equinumerosity). But in infinite set theory, cardinality ignores *order type*. A bijection can map a well-ordered sequence to a scrambled one. If value has any temporal or structural dimension—which it must, for lives to be distinct—then a bijection does *not* preserve the relevant ethical structure. RI is mathematically naive; the conflict isn't between two ethical principles, it's between ethics and your math."
  **Damage:** **Critical.** If RI is ill-defined, the contradiction vanishes, and the deflationary conclusion collapses.
  **Two-Minute Reply:**
  "I grant that in pure mathematics, order types distinguish $\omega$ from $\omega + 1$. However, population ethics abstracts away from *position* to focus on *content*. RI is not a claim about topological isomorphism; it is a claim about the supervenience of value on the distribution of welfare. If I have a world with infinite happy lives, and I 'shift' them to add one more, the *intrinsic* value of each life remains unchanged. The Set Theorist worries about the 'shape' of the population, but the Totalist and I agree that value is a function of the lives themselves, not their indices. To reject RI on structural grounds is to say that *where* a life occurs in an infinite sequence matters ethically, even if *who* lives it and *how well* they live is identical. That introduces a haecceitism about temporal slots that is harder to defend than the indeterminacy I propose. I am not doing set theory; I am using set theory to model ethical equivalence."
  **Weakest Point:** The Riemann Series Theorem. In infinite sums, rearranging terms *does* change the sum. If "betterness" aggregates like a sum, ignoring order is mathematically fatal, not just an abstraction.

  ### **Objection 2: The "Just Bite the Bullet" Attack (The Totalists)**
  **Phrasing:** "You argue there is 'no non-arbitrary way' to choose between RI and Addition Intuition (AI). But AI is the engine of Totalism. RI is merely an intuition about symmetry. When intuitions conflict in infinite cases, we drop the one that breaks the theory. We choose AI, accept that bijections don't preserve value in infinite contexts, and move on. Why is 'saving Totalism' not a sufficient non-arbitrary reason to prioritize AI?"
  **Damage:** **High.** Undermines the core claim that the conflict is irresolvable. If theory-preservation is a valid tie-breaker, deflationism is unnecessary.
  **Two-Minute Reply:**
  "Saving a theory is not an ethical argument; it's a sociological one. If we prioritize AI simply to preserve Totalism, we are begging the question. The cost of dropping RI is not just 'losing symmetry'; it leads to the 'Infinity Absurdities.' If bijections don't preserve value, then a world with infinite torture and one happy person could be deemed 'better' than a world of infinite bliss, depending on how we index the bijection. To avoid this, you must restrict which bijections count, but any restriction looks gerrymandered to save the math. I argue that the cost of accepting these absurdities is *higher* than the cost of admitting indeterminacy. Since there is no neutral currency to weigh 'theoretical completeness' against 'ethical absurdity,' the choice remains arbitrary."
  **Weakest Point:** Totalists *will* accept the absurdities. They view the "Infinity Absurdities" as counter-intuitive but necessary costs of doing business in an infinite universe. They have stronger stomachs than you.

  ### **Objection 3: The Action-Guidance Attack (The Decision Theorist)**
  **Phrasing:** "Ethics is for choosing. If the betterness relation is indeterminate between two worlds, your theory offers no verdict. If I face a choice between two infinite outcomes, and you say 'no fact of the matter,' you are telling me to flip a coin. Does your view imply moral paralysis in any scenario where the future is potentially infinite?"
  **Damage:** **Medium.** Makes the view practically useless, which is a pragmatic strike against it.
  **Two-Minute Reply:**
  "Indeterminacy does not entail paralysis. It entails a partial ordering. In many infinite cases, dominance principles still hold: if World A is better than World B for *some* finite subset of lives and equal for the rest, A is determinately better. My thesis only applies where the conflict between RI and AI is direct. Furthermore, 'no fact of the matter' is a fact *about the relation*, not a lack of guidance. It tells agents that certain trade-offs are not rationally mandated. This is a feature, not a bug. It prevents us from making spurious precision claims about infinite trade-offs where our intuitions clearly fail."
  **Weakest Point:** In high-stakes infinite choices (e.g., eternal salvation vs. damnation), "flip a coin" guidance is morally unacceptable. The Decision Theorist will press you on how to maximize expected value when the values themselves are undefined.

  ### **Objection 4: The "I Told You So" Attack (The Person-Affecting Theorist)**
  **Phrasing:** "You treat this indeterminacy as a tragic limit of impersonal value. I see it as a *reductio*. The fact that betterness breaks down in infinite cases proves that 'betterness' is not a property of worlds, but of relations between persons. Why not just conclude that impersonal total value is a fiction, rather than positing a metaphysical gap?"
  **Damage:** **Low/Medium.** It accepts your conclusion but rejects your meta-ethical framing. It doesn't refute the indeterminacy, just the interpretation.
  **Two-Minute Reply:**
  "Because the indeterminacy arises specifically from the *infinite* structure, not from the impersonal nature of the value. Person-affecting views face their own paradoxes in infinite cases (e.g., the Non-Identity Problem scaled up). My argument shows that *any* view relying on aggregation across infinite lives faces this structural conflict. Adopting person-affecting views doesn't solve the mathematical conflict; it just hides it by denying the premise that we can compare worlds at all. I prefer to keep the impersonal framework for finite cases—where it works perfectly—and acknowledge it breaks at the limit, rather than discarding it entirely based on boundary conditions."
  **Weakest Point:** If the framework breaks at the limit, and reality *is* infinite (or potentially so), the framework is broken *simpliciter*. The Person-Affecting theorist will argue you are clinging to a broken tool.

  ---

  ## 2. Strategic Concessions (Make These Up Front)
  *Do not wait to be forced into these. State them in your opening remarks or immediately after the paper summary to disarm the "naive" objections.*

  1.  **Concede that RI is less intuitive in infinite cases than finite ones.** Acknowledge that extending finite anonymity to infinite bijections is a bold generalization. This disarms the Set Theorist's claim that you are ignoring the difference between finite and infinite.
  2.  **Concede that "Indeterminacy" is a last resort.** Make it clear you are not *happy* about this conclusion. You are arguing that the costs of *all* determinate solutions (Totalism, Critical Level, Person-Affecting) are higher than the cost of indeterminacy. This makes you look like a reluctant realist rather than a quietist.
  3.  **Concede that this applies primarily to *comparative* betterness.** You are not claiming we cannot say *anything* about infinite worlds (e.g., we can still say a world is "good" in isolation), only that we cannot rank them determinately. This limits the scope of the Decision Theorist's paralysis objection.

  ---

  ## 3. The "Dreaded Question" (Hope Nobody Asks)

  **The Question:**
  "You claim there is 'no non-arbitrary way' to rank the costs of dropping RI versus AI. But to make *that* claim, you must have weighed those costs yourself to conclude they are incommensurable. What metric did you use to weigh them? If you have a meta-principle sufficient to judge the costs as 'equal' or 'unrankable,' don't you already possess a higher-order betterness relation that resolves the conflict? Isn't your indeterminacy just a determinate claim at the meta-level?"

  **Why this is fatal:**
  It attacks the coherence of your deflationary conclusion. If you can judge the conflict to be irresolvable, you imply a standpoint *outside* the conflict from which you can see the whole picture. If that standpoint exists, why can't it resolve the conflict? It suggests your "indeterminacy" is actually a determinate judgment of *equality* between the principles, which implies a fact of the matter does exist (the fact that they are tied), contradicting your thesis that there is *no* fact of the matter.

  **Prepared Defense (If Asked):**
  "I distinguish between *ranking* options and *diagnosing* a framework. I am not weighing the costs using a moral metric; I am observing that the moral metrics we have (RI and AI) are mutually exclusive in this domain and neither has lexical priority. The 'no fact of the matter' claim is a claim about the *object-level* betterness relation, not the meta-ethical analysis of principles. I can determinately say 'These principles conflict' without determinately saying 'World A is better than World B.' The indeterminacy is in the *output* of the ethics, not the *analysis* of the conflict."
  *(Note: This is a hard sell. If they press on whether the "conflict" itself is a fact that determines the outcome, you may have to concede that your view is a form of 'determinate indeterminacy,' which risks semantic confusion.)*
