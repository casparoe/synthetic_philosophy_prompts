      *Actually, a more practical one:* "If RI and AI conflict, why think the result is indeterminacy rather than just 'AI is false'?" The speaker argues there's no non-arbitrary way to rank the costs. The dreaded question is: "What metric are you using to judge the 'costs' of dropping a principle? If you can judge the costs, don't you already have a higher-order betterness relation?" **Yes, this is the killer.** It attacks the core "no non-arbitrary way" claim.

