      *   *The Decision Theorist:* They care about choice. If betterness is indeterminate, how do we choose? They might ask about dominance principles or how to act under this indeterminacy. They might also probe the analogy between infinite lotteries and infinite populations.
      *   *The Set Theorist:* They will pounce on "Bijection." In set theory, cardinality is well-defined, but *structure* (order type, topology) might matter. They might argue that RI is mathematically naive because it ignores the *arrangement* of values, not just the count.

