  - A woman who wants to be a doctor and has done the rotations, so she knows exactly what the day-to-day is: yeah, she really wants it.
  - A teenager who wants to go pro at a video game, fully clued in, has been competing for years: Priya says he really wants it, even though she thinks it's a terrible plan.
  - A man who's owned the same car model twice but is just wrong about what it'll be worth: she says that's not a real want either, the facts matter.

  Now my niece. She knows everything about what it's like to run a small dive shop on a remote island, read it all and talked to everyone who's done it, but she's never actually done anything like it, and she wants it bad. Does Priya say she really wants it?

