      *   *The "Thisness" (Haecceity) Trap:* To say "there are two," don't we need to quantify over distinct variables $x$ and $y$? Does logic itself presuppose individuation?
      *   *Relational Properties:* Sphere A is 2m from Sphere B. Sphere B is 2m from Sphere A. Are these distinct properties? If relations are irreflexive, does that ground distinctness? (Weak Discernibility).
