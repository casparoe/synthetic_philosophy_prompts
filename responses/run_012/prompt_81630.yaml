  You're half-right, and half-misunderstanding the scope. It's fair to say that in practice, you often only need a winner, not a full social ordering, and that switching to Score or Approval voting does bypass Arrow. But it's unfair to treat the theorem as merely a constraint on "ranked-ballot aggregators." Arrow isn't about the UI; it's about the informational basis. It proves you cannot aggregate *ordinal* preferences into a collective ordering without violating basic fairness conditions, unless you allow interpersonal utility comparisons. When you use Score voting, you're asking voters for cardinal data—intensity of preference—which is a fundamentally different input. You've escaped the theorem, but only by demanding more from the voter than just "I prefer A to B," which introduces its own headaches regarding strategy and comparability.

  Why should you care? Because even if you drop the requirement for a full ordering and just want a winner, impossibility follows you. The Muller-Satterthwaite theorem shows that any deterministic social choice function that is Pareto efficient and monotonic is essentially dictatorial. So your engineering decision to "just pick a winner" doesn't evade the fundamental tension; it just shifts which impossibility result applies. The theorem matters because it forces you to be explicit about which desirable property you're willing to break. You can't have it all, whether you're outputting a ranking or a single winner.
