answer: |-
  This is a classic case of philosophical ambiguity functioning as a rhetorical shield. The slogan "There is no such thing as a just war" is a "stopper"—it sounds profound and final, but it collapses at least seven distinct philosophical claims into one sentence. Your suspicion is correct: you were likely arguing about *intervention* (a specific act), while he was asserting a *meta-ethical or empirical generalization* (a universal rule).

  Here is the map of the distinct theses hidden in that slogan, arranged from the semantically trivial to the morally radical.

  ### 1. The Semantic/Perfectionist Thesis
  *   **The Claim:** "War" is by definition a breakdown of order and law; therefore, to call it "just" is a contradiction in terms, like "legal crime." Alternatively, no war can meet the criteria for justice *perfectly*.
  *   **Status:** **Nearly Trivial.** If "just" means "flawless," then obviously no human endeavor is just. If "war" means "lawless violence," then "just war" is an oxymoron by stipulation.
  *   **Commits you to:** Nothing moral. It is merely a definition of words.
  *   **Rules out:** Nothing. It allows for armed intervention, provided you stop calling it "just." You can call it "necessary" or "lesser evil."
  *   **Verdict:** This is often a linguistic trick. It concedes the moral necessity of action but refuses the label.

  ### 2. The Functionalist Critique (License vs. Constraint)
  *   **The Claim:** Just War Theory (JWT) exists in practice not to *constrain* violence, but to *license* it. Calling a war "just" removes moral inhibitions and enables atrocity. Therefore, the concept is too dangerous to use.
  *   **Status:** **Substantive and Defensible.** Historically, leaders often use "justice" rhetoric to escalate conflicts.
  *   **Commits you to:** A moratorium on the *language* of justice, not necessarily the *act* of defense. You might still intervene, but you must do so with "tragic regret" rather than moral righteousness.
  *   **Rules out:** Using moral justification to motivate troops or publics. It demands a "dirty hands" approach to intervention.
  *   **Verdict:** This is a pragmatic warning, not a moral prohibition.

  ### 3. The Empirical (Contingent) Pacifism Thesis
  *   **The Claim:** A just war is *theoretically* possible, but human nature, politics, and the fog of war ensure that the criteria (right intention, proportionality, discrimination) are never actually met in the real world.
  *   **Status:** **Substantive and Defensible.** This is the most common position of serious skeptics.
  *   **Commits you to:** Evaluating every specific war on empirical grounds. You must admit that *if* a massacre were stoppable with zero collateral damage and pure motives, intervention would be justified.
  *   **Rules out:** Almost all historical wars, but leaves the door open for your specific case (stopping a massacre) if you can prove the empirical conditions are met.
  *   **Verdict:** This turns the argument from philosophy to intelligence/strategy.

  ### 4. The Intentionalist Thesis
  *   **The Claim:** War necessarily involves collective hatred, dehumanization, and the intent to harm. Since justice requires benevolence or at least neutrality, the psychological state required to wage war is inherently unjust.
  *   **Status:** **Substantive but Controversial.** It assumes soldiers cannot act out of duty or protection without malice.
  *   **Commits you to:** The belief that protective violence is psychologically impossible without corruption of the soul.
  *   **Rules out:** Police actions, humanitarian intervention, or self-defense where the motive is purely to save others.
  *   **Verdict:** This conflates the *act* of stopping a killer with the *emotion* of hating the killer.

  ### 5. The Moral Equality of Combatants Thesis
  *   **The Claim:** Once war begins, soldiers on both sides are equally permitted to kill each other and equally liable to be killed. Therefore, neither side can claim superior justice; they are symmetrically engaged in a tragic practice.
  *   **Status:** **Substantive (Traditional Walzerian View) vs. False (Revisionist View).** Philosophers like Jeff McMahan argue this is false; aggressors are not morally equal to defenders.
  *   **Commits you to:** Refusing to distinguish morally between the aggressor and the intervener once fighting starts.
  *   **Rules out:** Holding the aggressor morally culpable for the war itself, focusing only on *how* the war is fought (*jus in bello*).
  *   **Verdict:** If your friend holds this, he is arguing that the intervener becomes as morally tainted as the massacrer once they fire a shot.

  ### 6. The Absolute Pacifism Thesis
  *   **The Claim:** Killing human beings is intrinsically immoral, regardless of consequence or intent. Therefore, any war involving lethal force is unjust.
  *   **Status:** **Radical and Coherent.** It is a foundational moral axiom.
  *   **Commits you to:** Accepting the massacre rather than killing the massacrer. You must believe that being a victim of injustice is morally preferable to being an agent of violence.
  *   **Rules out:** All armed intervention, police violence, and lethal self-defense.
  *   **Verdict:** This is the only reading that actually supports your friend's refusal to intervene.

  ### 7. The Strategic/Heuristic Thesis
  *   **The Claim:** "There is no just war" is not a truth claim, but a political tool. Repeating this slogan reduces the likelihood of war by creating a strong presumption against it.
  *   **Status:** **Pragmatic.** It treats the slogan as a "noble lie" or a rule of thumb.
  *   **Commits you to:** Prioritizing the reduction of war over moral accuracy.
  *   **Rules out:** Nuanced debate in public forums, because nuance might lead to dangerous exceptions.
  *   **Verdict:** This explains why he used it to *end* the conversation. It is a conversation stopper by design.

  ***

  ### Diagnosis: Which reading fits your friend?

  Given that he used the line to **close down** the conversation rather than explore the specifics of the massacre, he was almost certainly relying on **Thesis 7 (Strategic)** shielded by **Thesis 6 (Absolute Pacifism)**.

  When people use the slogan as a conversation-ender, they are usually treating it as a **Heuristic**. They are afraid that if they admit *any* exception (like stopping a massacre), the "just war" label will be abused later to justify invasion or oil wars. They are prioritizing the *rule* over the *case*.

  However, in the heat of argument, they often present it as **Thesis 6 (Absolute Pacifism)** because it sounds more principled. They want the moral high ground of "I never kill" without having to defend the consequence of "I let them die."

  ### What you should have pressed

  You should have pressed him on the distinction between **Thesis 3 (Contingent Pacifism)** and **Thesis 6 (Absolute Pacifism)**.

  Most people who use this slogan are actually Contingent Pacifists (they think war *usually* goes badly) pretending to be Absolute Pacifists (war is *always* wrong).

  **The specific line of questioning you should use next time:**

  1.  **Isolate the Principle:** "I hear you saying no war is just. Is that because killing is always wrong even to save a life (Absolute), or because wars never work out the way we plan (Contingent)?"
  2.  **The Trap:**
      *   **If he says Absolute:** You press the moral cost. "So if a man is murdering a child in front of you, and the only way to stop him is to shoot him, you would let the child die to keep your own hands clean? Is your moral purity more important than the child's life?"
      *   **If he says Contingent:** You press the evidence. "Okay, so you admit it's *possible* in theory. Then we aren't arguing about philosophy; we are arguing about facts. Let's look at *this* massacre. What specific criterion of Just War Theory is not met here? Is it proportionality? Probability of success?"

  **Why this works:**
  It forces him out of the slogan and into the specifics. The slogan "There is no just war" is a fortress. But if you force him to admit it is only a **Contingent** claim, the fortress becomes a tent. He then has to argue why *this specific intervention* would fail, rather than hiding behind a universal negative.

  If he refuses to make that distinction, you can accurately accuse him of using a **Strategic Heuristic** (Thesis 7) to avoid the moral weight of the massacre. You can tell him: *"You are using a slogan to avoid a tragedy. If you believe intervention is the lesser evil, say it. If you believe it is a sin, own the cost of that sin. But don't use a slogan to hide the cost."*
