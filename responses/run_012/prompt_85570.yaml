      *   *Moral Status Threshold:* This is a binary classification based on a continuous variable. In control theory, this looks like a comparator with a deadband or a switching logic. If $x > x_{setpoint}$, then Output = 1 (Moral Consideration), else 0.
      *   *Uncertainty/Precautionary Principle:* Philosophically, if we aren't sure if $X$ is sentient, we should treat it as if it is. In control theory, this is about estimator confidence intervals, robustness, and handling unmodelled dynamics. If the state estimate $\hat{x}$ has high variance $\Sigma$, we design the controller to be robust against the worst-case scenario (H-infinity control or risk-averse MPC).

  3.  **Drafting the Restatements (Task 1):**

      *   *Sentience (Degrees):* Needs to sound like a system parameter. Let's use "loop complexity" or "state vector dimensionality" combined with "error signal weighting." Let's go with the *gain on the error signal regarding internal state deviations*. A thermostat has low gain on internal state (it doesn't care about its own temperature, just the room). A mammal has high gain on internal homeostatic errors (pain).
