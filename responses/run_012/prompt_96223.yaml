answer: |-
  We gather in stone and silence to mark the end of a life that belonged, in large measure, to all of us. I stand here as the successor to the party Peter Halloran led for eleven years. I stand here as a friend to his widow, who asked me to speak, and as a servant of the same public he served. But I stand also as a citizen, among citizens, in a room that holds grief of many different kinds.

  To Mary and his daughters: I know the man you loved. I know the quiet dignity he kept within these walls, away from the cameras and the committees. That man is who we mourn today. But in a state funeral, the private man and the public servant cannot be separated. To pretend otherwise would be to dishonor the office he held, and to dishonor you.

  Twenty-three years ago, a hemorrhagic fever came through this country. We had never seen it. We did not know how to stop it. There was one therapeutic, and not enough of it. The ministry had to decide where it would go. We know now that the protocol adopted concentrated the drug in the capital. We know it effectively wrote off the northern provinces. Four thousand people died. Most of them were in the north.

  We know now that Peter Halloran signed that protocol. We know also that he stood before the country and denied that any such rule existed. He attributed the pattern of death to bad luck. He did this because he believed that if the public learned the state was choosing, the shipments from abroad would stop and the country would come apart. He never admitted it. He carried the knowledge of that choice, and the weight of that silence, until the day he died.

  I will not tell you he did nothing wrong. He did wrong. He knew it. That is why he never spoke of the epidemic again. The silence was not innocence; it was penance.

  There is a hard truth about democracy that we rarely speak aloud. We demand our leaders protect us from chaos. But sometimes, to prevent chaos, they must do things that stain their souls. We need people willing to take on that guilt. But if we are to ask that of them, we must not rush to absolve them afterwards. We must let them carry it publicly. To wash those hands clean too quickly is to say the cost was nothing. The cost was not nothing.

  To the families of the north who are here today: You asked that we not pretend. I hear you. We will not pretend. The map of survival was drawn, and you were left outside its lines. That reality cannot be undone by words spoken in a cathedral. The inquiry resumes next month. It will establish the facts. It will determine liability. That is the work of the law.

  But today is not for the law. It is for the weight.

  To the members of my own party: We will vote on a compensation bill in the autumn. Do not mistake this speech for a position on that legislation. This speech is a position on memory. We cannot compensate the dead. We can only acknowledge what was taken from them, and from you.

  Peter Halloran was not a religious man. He did not seek judgment from heaven. He sought only to hold the state together. In this sacred place, I cannot offer him scripture. I can only offer him the truth. He saved the country, and he broke himself to do it. He saved the country, and he broke the trust of the north to do it. Both things are true.

  We are tempted, on days like this, to smooth over the rough edges of a life. To make the story clean. But a clean story is a lie. The work of governing is rarely clean. It is often done in the dark, with imperfect tools, by people who must live with the consequences long after the crisis has passed.

  So we do not offer him easy peace. We offer him our honest memory. We acknowledge the burden he took, and we acknowledge the burden he imposed on others. We acknowledge that the price of our stability was paid by the families in the north.

  To Mary, to his daughters: He loved you. He protected you. But he also protected a secret that kept him from you, even when he was in the room. I hope you can find rest in the knowledge that he did not take this lightly. He did not sleep easily.

  The inquiry will speak. The history books will be written. But for this hour, we simply hold the weight of what happened. We do not look away. We do not pretend. We stand here, in the shadow of what was done, and we bear witness.

  May he find the rest that he denied himself. And may we find the courage to face what he could not.
