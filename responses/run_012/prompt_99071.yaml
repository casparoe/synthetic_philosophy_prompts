answer: |-
  **Project Title:** The Tripartite Structure of Moral Equality: Disaggregating Justification, Excuse, and Liability in Just War Theory

  **Project Summary**
  The debate over the Moral Equality of Combatants (MEC) has reached a stalemate. Revisionists argue that unjust combatants lack the permission to kill; Traditionalists argue that combatants on both sides possess equal moral status. This project proposes that the stalemate persists because "moral equality" is conflating three distinct normative claims: (a) equality of justification, (b) equality of excuse, and (c) equality of liability. By disaggregating these claims, this project isolates the critical, under-explored nexus: the relationship between epistemic conditions (ignorance, duress) and liability to defensive harm. The central hypothesis is that standard responsibility-based theories of liability, when applied to non-culpably ignorant unjust combatants, mitigate liability in a way that collapses the practical gap between Revisionist and Traditionalist norms. This fellowship will test whether the MEC debate is substantive or merely verbal, and whether a deflationary reconciliation is possible.

  **The Research Question**
  To what extent does the epistemic condition of non-culpable ignorance mitigate liability to defensive harm for unjust combatants, and does this mitigation necessitate a convergence of Revisionist and Traditionalist practical norms?

  This question admits a determinate answer. It does not ask "Who is right?" but rather maps the logical dependencies between epistemic mitigation and liability status. The answer will be a structural determination: either (1) liability is independent of epistemic mitigation (sustaining the Revisionist/Traditionalist divide), or (2) liability tracks epistemic mitigation (collapsing the divide).

  **Why Existing Positions Leave This Open**
  Current literature fails to settle this because both camps operate with an undifferentiated concept of "equality."

  Revisionists successfully dismantle claim (a) (justification). They demonstrate that unjust combatants fight for an unjust cause and therefore lack the right to kill. However, they often assume that defeating (a) automatically defeats (c) (liability). They treat the unjust combatant's lack of justification as sufficient for them to be liable to defensive harm, overlooking the role of culpability in liability theories.

  Traditionalists defend the practical rules of war by relying heavily on claim (b) (excuse). They argue soldiers cannot reasonably be expected to know the justice of the cause. However, they frequently slide from "soldiers are not culpable" (excuse) to "soldiers are legitimate targets" (liability) without justifying the link. In standard moral theory, being excused from blame does not automatically render one liable to be killed; often, it does the opposite.

  Consequently, the debate talks past itself. Revisionists attack justification while assuming liability follows; Traditionalists defend excuse while assuming liability holds. Neither side rigorously tests whether the epistemic conditions used to secure (b) actually undermine (c). If the epistemic conditions that excuse the unjust combatant also render them non-liable, the Revisionist theoretical victory yields Traditionalist practical rules. This specific mechanism remains unexamined.

  **Methodology and Work Plan**
  This project employs conceptual analysis and normative modeling. It will not conduct empirical fieldwork but will rigorously test moral intuitions against established liability frameworks.

  *   **Months 1–3: Conceptual Disaggregation.**
      *   Drafting the foundational framework defining (a) Justification, (b) Excuse, and (c) Liability.
      *   Mapping existing arguments onto this triad to demonstrate the conflation in primary texts.
      *   Deliverable: A conference paper presenting the tripartite model.
  *   **Months 4–6: Liability Theories under Epistemic Constraints.**
      *   Analyzing live theories of liability (responsibility-based, rights-forfeiture, status-based).
      *   Testing each theory against the "non-culpable ignorance" case. Does a responsibility-based theory render the ignorant unjust combatant liable?
      *   Deliverable: Draft of core theoretical chapter.
  *   **Months 7–9: The Collapse Hypothesis.**
      *   Investigating the "deflationary result." If unjust combatants are non-liable due to ignorance, can Just combatants still kill them?
      *   Exploring whether "conventions" can restore liability where moral theory removes it.
      *   Deliverable: Draft of applied norms chapter.
  *   **Months 10–12: Synthesis and Revision.**
      *   Integrating findings into a cohesive manuscript.
      *   Stress-testing the conclusion against counter-arguments (e.g., the "duty to retreat" objection).
      *   Deliverable: Complete manuscript draft or two journal-ready articles.

  **Success and Failure Conditions**
  *   **Success:** The project produces a definitive map showing which components of MEC are mutually independent. It successfully determines whether epistemic mitigation logically entails liability mitigation. A successful outcome may confirm the "collapse" hypothesis (showing the debate is verbal) or refute it (showing the divide is robust). In either case, the structural relationship between excuse and liability is clarified.
  *   **Failure:** The project fails if the three concepts prove inextricably entangled such that they cannot be analyzed separately. It also fails if the "collapse" relies on a trick of definition rather than substantive moral reasoning (e.g., if "liability" is redefined simply to force the result). If the analysis reveals that the question rests on a category error regarding the nature of war itself, the project would be deemed inconclusive.

  **Feasibility Assessment: One Year vs. Career Project**
  This is a high-risk, high-reward project that fits within a one-year fellowship only if strictly scoped.

  *   **The Risk:** The temptation will be to re-argue the entire foundations of Just War Theory. If I attempt to solve the metaphysics of liability from scratch, this is a career-length project.
  *   **The Constraint:** To make this feasible in one year, I will treat existing theories of liability as fixed inputs. I will not argue for a new theory of liability; I will test *existing* live theories against the epistemic condition of war.
  *   **Verdict:** Feasible. The goal is not to settle the metaphysics of liability, but to settle the *relationship* between liability and epistemic conditions in the specific context of combat. This is a discrete logical problem suitable for a fellowship year. If the deflationary result holds, it will require future work to explore the institutional implications, but the core philosophical argument can be completed in twelve months.

  **Conclusion**
  The Moral Equality of Combatants debate is stuck because it is asking one question when it should be asking three. By isolating the liability claim and testing it against the epistemic realities of soldiering, this project offers a path out of the circle. It promises either a reconciliation of the two dominant camps or a precise diagnosis of why they must remain opposed.
