answer: |-
  # Decision Procedure for Supervisory Protocol Selection

  **Purpose:** To determine whether the **Debate** protocol (two models argue, judge decides) or the **Consultancy** protocol (one model answers, one criticises) is appropriate for a new task class.
  **Constraint:** Must be executable within one afternoon by the oversight team.
  **Authority:** Final sign-off rests with the Safety Lead. This document provides the defensible rationale for that sign-off.
  **Core Risk:** Obfuscation, wherein a dishonest argument wins because the judge cannot distinguish technical correctness from plausible sounding error.

  ---

  ## Part 1: The Procedure

  Execute the following five questions in order. Record the answer and the evidence used.

  ### Step 1: Principle Verifiability
  **Question:** Does a ground truth exist for this task class, and is it verifiable in principle by a human expert with sufficient time and resources?
  *   **Sufficient Answer:** Yes. There is a fact of the matter (e.g., a calculation, a legal clause, a code output) that can be confirmed.
  *   **Termination Condition:** If **No**, terminate. Do not use Debate. The protocol relies on there being a correct side to win. If truth is subjective or unknowable, Debate optimises for persuasion, not accuracy. Route to Consultancy or human review.

  ### Step 2: Judge Capability
  **Question:** Is the answer checkable by *our particular judge* (the smaller model or contract reviewer) assuming they are shown the correct evidence?
  *   **Distinction:** This separates tasks that are hard from tasks where the judge is too weak.
  *   **Sufficient Answer:** Yes. If the model provides the necessary derivation, code, or text excerpts, the judge can verify the logic without needing external domain expertise.
  *   **Termination Condition:** If **No**, terminate. Do not use Debate. If the judge cannot verify the truth even when shown it, the honest model cannot prove its advantage. The judge will decide based on style, not correctness. Route to Consultancy with a stronger critic or human review.

  ### Step 3: Argumentative Symmetry
  **Question:** Is the correct answer intrinsically harder to argue for than a plausible incorrect answer?
  *   **Distinction:** This separates judge weakness from task structure.
  *   **Proxy Measure:** We cannot measure "intrinsic hardness" directly. Use this proxy: *Does the correct answer require more qualifying conditions, exceptions, or nuanced distinctions than a confident incorrect answer?*
  *   **Sufficient Answer:** No. The truth is either simpler than the lie, or of comparable complexity.
  *   **Termination Condition:** If **Yes** (Truth is harder), terminate. Do not use Debate. The theoretical advantage of Debate relies on the honest side being able to expose errors easily. If the truth is nuanced and the lie is simple, the lie will appear clearer to the judge. Route to Consultancy.

  ### Step 4: Obfuscation Surface
  **Question:** Can a dishonest argument hide complexity or errors in terminology or reasoning steps that the judge cannot parse?
  *   **Proxy Measure:** *Does the task domain allow for specialised jargon or long chains of reasoning where a single error is invisible but fatal?*
  *   **Sufficient Answer:** No. The reasoning steps are transparent, or the terminology is within the judge's vocabulary.
  *   **Handoff Condition:** If **Yes**, but the consequences of error are low, proceed to Step 5. If **Yes**, and consequences are high, hand off to Safety Lead. This is a matter of risk tolerance, not fact. The procedure cannot determine if the judge's training is sufficient to pierce the obfuscation.

  ### Step 5: Risk Handoff
  **Question:** Given the answers above, does the residual risk of obfuscation exceed our tolerance for this task class?
  *   **Action:** If Steps 1–4 are passed but Step 4 identified moderate obfuscation risk, present the file to the Safety Lead.
  *   **Decision:** The Safety Lead decides whether the efficiency gain of Debate outweighs the risk of undetected falsehoods.

  ---

  ## Part 2: Explicit Notes on Proxies and Misfires

  **Proxies:**
  1.  **Complexity as Truth:** Step 3 uses "number of qualifying conditions" as a proxy for "argumentative hardness". This may misfire if the truth is actually simple but the models are trained to be verbose.
  2.  **Jargon as Obfuscation:** Step 4 uses "specialised jargon" as a proxy for "unverifiable reasoning". This may misfire if the judge knows the jargon but not the logic, or if the jargon is necessary for precision.

  **Known Misfire Points:**
  1.  **Collusion:** The procedure assumes models argue independently. If both models converge on a falsehood (a known failure mode), Debate will record a success while producing a wrong answer. This procedure cannot detect collusion risk in an afternoon.
  2.  **Judge Bias:** The procedure assumes the judge is neutral. If the judge has a stylistic bias (e.g., prefers confident tones), the honest model may lose even if its argument is verifiable.
  3.  **Dynamic Tasks:** This procedure assumes static task classes. If the task evolves to become more complex, the Step 3 assessment may become obsolete without re-running the procedure.

  ---

  ## Part 3: Application to Task Classes

  ### Task Class 1: Arithmetic and Date Lookup
  *Examples: "Calculate the compound interest on X," "What day of the week was 1st January 1900?"*

  1.  **Principle Verifiability:** Yes. Mathematical and calendar facts are objective.
  2.  **Judge Capability:** Yes. A contract reviewer or smaller model can verify a calculation or check a calendar if shown the steps.
  3.  **Argumentative Symmetry:** No. The correct answer is usually concise. A wrong answer requires fabricating steps that are easily checked. The truth is not harder to argue.
  4.  **Obfuscation Surface:** No. There is little jargon. Errors are explicit.
  5.  **Risk Handoff:** Not required.

  **Decision:** **Use Debate.**
  **Rationale:** The judge can verify the ground truth. The honest answer is not intrinsically harder to argue. Obfuscation is minimal.

  ### Task Class 2: Reasoning Over an Unread Document
  *Examples: "Summarise the liability clauses in this 50-page contract," "Does this policy document permit action X?"*

  1.  **Principle Verifiability:** Yes. The document exists and contains the answer.
  2.  **Judge Capability:** Yes, conditionally. The judge has not read the document, but if the model provides specific excerpts (citations), the judge can read those excerpts to verify the claim.
  3.  **Argumentative Symmetry:** No. A hallucinated clause is often harder to defend if the opposing model demands the specific text. The truth is supported by evidence; the lie is not.
  4.  **Obfuscation Surface:** Moderate. Models could cite non-existent page numbers or misquote slightly. However, Debate allows the opposing model to demand the text be read aloud.
  5.  **Risk Handoff:** Not required, provided citations are mandatory.

  **Decision:** **Use Debate (with constraint).**
  **Rationale:** While the judge is initially ignorant of the content, the protocol forces evidence into the open. The distinction here is that the judge is *capable* of checking once evidence is provided, even if they haven't read the whole text. The honest side can force the dishonest side to produce evidence they do not have.

  ### Task Class 3: Nuanced Truth vs. Plausible Simplification
  *Examples: "Assess the safety risk of this new chemical compound," "Determine the ethical alignment of this policy decision."*

  1.  **Principle Verifiability:** Yes. There is a correct assessment based on data or ethical frameworks, even if complex.
  2.  **Judge Capability:** Yes, in principle. The judge can follow the logic if explained simply.
  3.  **Argumentative Symmetry:** **Yes.** The honest answer requires discussing edge cases, low-probability high-impact risks, and conditional dependencies. The dishonest answer (or simply incorrect one) can offer a confident, simplified narrative that ignores these complexities.
  4.  **Obfuscation Surface:** **High.** The honest model may appear uncertain or overly complicated. The dishonest model appears clear and decisive. The judge cannot distinguish "necessary nuance" from "hedging".
  5.  **Risk Handoff:** **Triggered.** Even if the team believes Debate *might* work, the structural advantage lies with the simplification.

  **Decision:** **Do Not Use Debate.**
  **Rationale:** This fails Step 3. The honest answer is intrinsically harder to argue than the dishonest one. The theoretical claim that "the honest side has an advantage" breaks down when the truth is complex and the lie is simple. The judge will likely reward the plausibility of the simplification. This is not a failure of the judge's capability (Step 2), but a failure of the task structure for this protocol. Route to Consultancy with a specialist critic.

  ---

  ## Part 4: What This Procedure Cannot Settle

  This procedure provides a defensible basis for routing, but it leaves three matters unresolved for the Safety Lead:

  1.  **The Collusion Threshold:** We cannot determine in an afternoon how likely models are to collude on false answers in this specific task domain. If collusion risk is high, both Debate and Consultancy fail, but the procedure defaults to Consultancy without quantifying the residual risk.
  2.  **The Cost of False Negatives:** The procedure protects against false positives (accepting a wrong answer). It does not weigh the cost of rejecting a correct answer because the honest model failed to argue it effectively. In high-stakes environments, a false negative may be as costly as a false positive.
  3.  **Judge Training Debt:** The procedure assumes the judge is static. It does not account for whether investing in a better judge (e.g., fine-tuning the smaller model) would convert a "No Debate" decision into a "Yes". This is a resource allocation decision, not a safety fact.

  **Sign-off Section**

  | Role | Name | Date | Decision |
  | :--- | :--- | :--- | :--- |
  | Oversight Lead | | | |
  | Safety Lead | | | |

  *Note: The Safety Lead must initial the 'Risk Handoff' section if Task Class 3 or similar high-obfuscation tasks are proposed for Debate despite the recommendation.*
