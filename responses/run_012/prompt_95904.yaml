answer: |-
  "You're treating trust as a moral virtue," Erik said, setting his coffee down. "I'm treating it as a transaction cost. In Oslo, we assume the applicant is telling the truth until proven otherwise. It saves us from building a bureaucracy just to verify the verification."

  "And in Washington, we assume the applicant is optimizing for the benefit until proven otherwise," Sarah replied. "It saves us from building a bureaucracy to clean up the fraud. You call it efficiency; I call it deferred maintenance."

  "Deferred maintenance implies decay. I'm talking about friction. Every form you require, every audit you mandate, it slows the delivery of public goods. When we rolled out pandemic relief, my agency transferred funds in days. I watched your colleagues spend months designing anti-fraud gates while businesses folded."

  "Because we learned what happens when gates are left open. But let's not talk about speed. Talk about the mechanism. You say trust economizes on monitoring. I agree. But that preserved discretion is where both good judgment and betrayal live. Your caseworker can waive a fee for a struggling single mother because she isn't bound by a checklist. She can also waive it for her nephew. The mechanism is identical."

  Erik nodded. "I grant you that. Discretion is the vector for both mercy and corruption. But suspicion sustains monitoring, and monitored people behave like people who know they are being watched. They become compliant, guarded, and skilled at managing the metric. You get perfect forms from people who know how to hide the messiness of their lives behind the right checkboxes."

  "So you're saying my system selects for sociopathy?"

  "I'm saying it selects for compliance. Mine selects for cooperation. But here is where the symmetry breaks. You argue that trust is naive. I argue that suspicion is expensive. It consumes the very capacity needed to do the work."

  "Expensive for whom?" Sarah leaned forward. "This is where your question fails. You ask which attitude is more reasonable. I argue that isn't well-posed until you say whose losses count. Misplaced trust is usually paid for by the truster or spread thinly across the public—a bit of tax fraud here, a wasted subsidy there. Misplaced suspicion is paid for by the person suspected. Often someone with the least capacity to absorb the cost. The single mother who can't navigate the audit."

  Erik resisted the shift. "Systemic integrity matters regardless of distribution. If the public believes the system is rigged because everyone cheats, you lose voluntary compliance. Then you need even more monitoring. It's a doom loop. My system relies on the belief that cheating is rare to keep cheating rare. It's a stable equilibrium."

  "Is it? Or is it just a stable equilibrium for the majority who fit the mold?" Sarah pressed. "Take the tax records. In Norway, anyone can look up anyone's declared income. You hold this up as the pinnacle of transparency."

  "It is. It trust in persons versus trust in transparent systems. I know my neighbor sees my return, so I file honestly. She knows I see hers, so she files honestly. The lookup is registered, and I can see who looked. It creates mutual accountability without a hidden police force."

  "Universal transparency is institutionalized suspicion that only appears benign because it is symmetrical," Sarah countered. "It assumes everyone is a potential liar who needs peer surveillance to stay honest. It substitutes for trust. It doesn't create it. It creates a panopticon where we are all both guards and prisoners. Does transparency genuinely substitute for trust, or only for one particular kind of vigilance?"

  "It substitutes for the need to believe in the virtue of strangers," Erik said. "You don't need to believe I am good. You can see I am compliant. That allows the system to function without requiring us to be friends."

  "You will say this protects the rich," Erik anticipated, raising a hand. "That public scrutiny exposes elite evasion. But in practice, it normalizes the idea that financial privacy is suspicious. It flattens the distinction between hiding income and hiding hardship."

  "Exactly," Sarah said. "And that flattening hurts the vulnerable most. But let's ground this. Think about the bank rescue. Your government injected capital with minimal conditions because you trusted the institutions to stabilize the market. Ours attached strings, reporting requirements, executive caps."

  "And the market stabilized faster here," Erik said.

  "Because the pain was socialized," Sarah replied. "The public paid for the trust placed in bankers. When we suspect, the bankers pay for the compliance. You ask whose losses count? In your model, the public absorbs the risk of elite betrayal. In mine, the elite absorb the cost of public suspicion. I prefer the latter."

  Erik paused. "I concede that point. When trust is misplaced at the top, the bill comes to the public. But consider the police. In your system, body cameras, strict use-of-force protocols, internal affairs. High monitoring. Does it stop brutality? Or does it teach officers how to turn off the camera, how to write the report so it survives the review?"

  "It teaches them that deviation has consequences," Sarah said. "Which is the point of institutions. To constrain power."

  "Or to constrain judgment," Erik said. "When a crisis hits—a flood, a riot—you need officials who can act without waiting for legal cover. My colleagues in the US told me they spent more time consulting counsel than solving problems. That hesitation costs lives. That is the cost of suspicion."

  "So we are back to the error distribution," Sarah said. "You fear the error of inaction. I fear the error of overreach. You think the question of which attitude is reasonable is well-posed because you prioritize systemic efficiency. I think it is ill-posed because efficiency without justice is just faster oppression."

  "Justice requires a functioning state," Erik said. "You cannot deliver rights from a bankrupt treasury."

  "And you cannot deliver efficiency from a terrified populace," Sarah replied.

  They sat in silence for a moment, the gap between them defined not by nationality, but by risk tolerance.

  The exchange leaves Sarah's position better supported, not because suspicion is inherently superior, but because she successfully reframed the debate from systemic efficiency to the distribution of error costs. The crux identified is not whether trust or suspicion works better in the abstract, but whether the cost of being wrong should be borne by the public or the individual. Moving this judgment would require evidence not of corruption rates, but of longitudinal data on how monitoring regimes affect the willingness of vulnerable populations to engage with public institutions versus how discretion regimes affect the incidence of elite capture.
