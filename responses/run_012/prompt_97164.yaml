      *   *Mechanism:* Recruit the child's judgment (esteem, reason, pleasure) vs. bypass it (force, blind obedience, fear).
      *   *Contextual Gap:* Locke's tutor has total authority; modern tutor has limited authority + safeguarding + parental interference.
      *   *Translation:* How to apply "recruit judgment" in a 45-min slot with hovering parents?

  3.  **Drafting the Procedure (The "Tool"):**
