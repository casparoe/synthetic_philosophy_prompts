      *   *Lying:* Child lies about homework. Locke says vice comes from hiding fear. Procedure: Why did they lie? Fear of blame? Fix the esteem dynamic. Don't punish the lie punitively; address the cause.
      *   *Fear of Dark:* Dad says "toughen him". Locke says fear imposed by servants/others harms courage. Reasoning with fear is key. "Toughening" via exposure without reason is brute force. Procedure: Flag as "Values Conflict". Handover to boss.

  6.  **Addressing Limitations:**
