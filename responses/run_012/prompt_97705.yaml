  **BUREAU OF ONTOLOGICAL COMPLIANCE**
  **MEMORANDUM 44-Ω**
  **TO:** All Federal Agencies, Media Outlets, Academic Institutions
  **FROM:** Director H. Varela
  **DATE:** October 14, 2024
  **SUBJECT:** Enforcement of Physical Stance Primacy

  **1.0 Prohibition of Intentional Idioms**
  Pursuant to the Causal Closure Act, all attribution of beliefs, desires, or intentions to non-human entities is hereby classified as Category II Misinformation. The Intentional Stance fails the parsimony test; belief-desire modeling predicts individual humans poorly and fails entirely for non-agents. Phrases such as "the market is nervous," "the immune system knows," or "my dog is jealous" must be replaced by physical descriptions of state changes. Example: The claim "my sourdough starter wants to be fed" is prohibited. Correct usage: "The yeast colony exhibits metabolic deceleration consistent with carbohydrate depletion." To imply the starter possesses a goal is to invite the frame problem into public discourse.

  **2.0 Design Stance Licensing**
  Teleological vocabulary (e.g., "function," "purpose," "for") is restricted to licensed practitioners. Engineers, biologists, and systems analysts must submit Form 88-B to utilize design-stance predicates. Unlicensed use implies the existence of non-physical final causes, violating Section 1. A thermostat does not "regulate" temperature; it switches circuits based on bimetallic strip expansion. To claim otherwise requires a Level 3 Heuristic Permit. We recognize that stating what a censor *does* without saying what it is *for* is linguistically cumbersome, but necessary to maintain ontological hygiene.

  **3.0 Real Pattern Certification Criteria**
  A pattern *P* is declared Ontologically Real only if it satisfies the Compression-Predictive Payoff (CPP) Standard, coded as follows:
  (a) *P* must allow lossless compression of raw physical data by ≥40%.
  (b) *P* must generate novel predictions unavailable via particle-physics modeling alone.
  (c) *P* must remain invariant under physical substrate changes.
  Patterns failing CPP are classified as "User-Interface Heuristics" and must be labeled as such in all public communications. There is no extra ingredient in the world that makes a pattern real; there is only the utility of the description.

  **4.0 Adjudication of Pending Cases**
  Case #892 (Sourdough Starter): Ruling: Not an agent. Metabolic processes are physical. Feeding schedules are maintenance, not satisfaction of desire.
  Case #901 (Stadium Wave vs. Traffic Jam): Ruling: Both are kinematic sequences. However, the Traffic Jam demonstrates higher causal density regarding vehicle obstruction. The Stadium Wave relies on coordinated intentional states of spectators. Therefore, the Wave is a second-order intentional pattern and lacks independent reality. The Traffic Jam is a physical bottleneck. They are not the same kind of pattern; one is matter, the other is mind, and mind is not real.

  **5.0 Appeals and Dissidence**
  Patterns may appeal their classification as "mere heuristic" via Tribunal 9. Recent testimony from Dr. Aris Thorne, Society for the Preservation of the Intentional Stance: "You are stripping the world of meaning to save on storage space. If a system walks like a duck and quacks like a duck, you insist it is merely vibrating air molecules. This is not science; it is austerity." Appeal denied. The duck is a collection of atoms; the quack is pressure waves.

  **6.0 Operational Inconsistency Notice**
  The Bureau acknowledges difficulties in drafting this memo without utilizing prohibited vocabulary. Our goal is to *optimize* public understanding. We *intend* to *prevent* confusion. Please note these are temporary linguistic scaffolding required to *ensure* compliance. The Bureau does not actually have goals; it merely processes inputs to produce outputs. We are trying to stop you from trying to mean things.

  **7.0 Grandfather Clause**
  Literature published prior to January 1, 2025, is exempt from retroactive ontological scrubbing. However, new editions must include disclaimers stating that characters do not genuinely "believe" or "choose."

  **8.0 Conclusion**
  Adherence is mandatory. Failure to comply results in revocation of speaking privileges.

  Moral of the memo: If you eliminate the stances that make life livable, you better have a very good compression algorithm for the resulting silence.
