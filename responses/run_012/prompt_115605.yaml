      *(Refining the Misconception Map)*: The user asked me to say which of *their* guesses is badly put.
      1. Harmless idealization.
      2. Fix is time/resource parameter.
      3. Problem is computation vs knowledge state.
      Actually, (2) is a *solution strategy*, not necessarily a misconception, unless they think it solves the *logical* problem rather than bypassing it.
      (3) is the most profound. The problem *is* often misdiagnosed as computation. I will highlight that.
