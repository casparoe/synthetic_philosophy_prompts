      *   **Audience:** First-year PhD students (Philosophy & AI). Background: One course in modal logic (comfortable with Kripke frames, normal modal systems). Naive about the problems of idealization in epistemic logic.
      *   **Topic:** The Problem of Logical Omniscience (LO).
      *   **Duration:** 90 minutes (single session).
      *   **Constraints:**
