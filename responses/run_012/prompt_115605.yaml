prompt: |-
  You are an expert in epistemic logic and in the philosophy of formal epistemology. I have to run a single 90-minute session for a reading group of first-year PhD students in philosophy and AI who have had one course in modal logic — they are comfortable with Kripke frames and normal modal systems — and who have never been told that the idealization built into epistemic logic is a problem. The topic is the problem of logical omniscience. Do not explain the problem to me; plan the session.

  Start by sketching two or three candidate orderings for the ideas before committing to one, then give me the order you would actually use and justify each dependency: what has to be in place before the closure requirement looks like a problem rather than a stipulation, and what can be postponed or dropped.

  I want one carrying example rather than a menu of bullet points. My candidate is a case from mathematical practice: a referee who has checked every line of a proof, accepts every axiom and every inference rule, and knows the proof is valid, but has not yet seen why the theorem is true. Tell me whether that case can carry the session or whether it only re-describes the problem as slowness, and if it fails, propose what should replace it, saying what the example must have and what it must not have.

  Then the misconception map: which wrong pictures they will arrive with or form, in the order they will form them, and the exact point in the sequence at which each should be headed off. My guesses are that they will treat the idealization as harmless, like frictionless planes; that the fix is to add a resource or time parameter to the semantics; and that the problem is about how much an agent can compute rather than about what its knowledge state contains. At least one of these is badly put — say which, and why.

  Finally, of the repairs available — allowing impossible worlds, restricting the agent's awareness, and modelling reasoning syntactically or algorithmically — which should come first, and which fresh misconception does each one invite in turn? Close with one question I can put to the group that would show they have understood the problem rather than memorized a taxonomy, and tell me what I should openly refuse to cover in 90 minutes.
