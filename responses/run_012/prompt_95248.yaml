answer: |-
  These practices do not commit to the view that rational choice is possible without preference, but instead satisfy rationality constraints by locating the requisite preference in the selection procedure rather than the options themselves. By shifting the locus of rationality from the first-order options (Treatment A vs. Treatment B) to the second-order procedure (Randomization vs. Discretionary Choice), institutions avoid the Buridan's Ass paradox without abandoning the principle that action requires reason. The committee does not choose Treatment A for no reason; it chooses the *protocol of randomization* for the reason that it preserves equity, minimizes bias, or respects epistemic humility when first-order reasons run out. This means the practice is compatible with any theory of practical reason that admits procedural values or second-order preferences as legitimate reasons for action, such as instrumental rationality or procedural consequentialism.

  However, this pattern does rule out a strict version of Reason Internalism that insists reasons must attach exclusively to the intrinsic properties of the outcome states being chosen. If a theory holds that an agent can only act on reasons derived from the comparative goodness of the options themselves, then randomization in equipoise is indeed irrational paralysis or arbitrary madness. The practice sits comfortably with views that allow the *process* of choosing to generate value independent of the *content* of the choice, such as fair-mindedness or the disvalue of arbitrary power. Your hunch is correct that the justification is underdetermined: a utilitarian licenses the lottery to maximize trust, a deontologist to respect equal dignity, and a contractarian to ensure ex-ante fairness, yet all converge on the same coin flip. The practice does not need to settle which moral theory is true, only that some second-order reason outweighs the cost of not choosing.

  Regarding the notion of "equally good," the practice relies on a functional equivalence rather than a metaphysical identity across your three examples. In the haystack case, the equality is ontological (the options are identical); in the hiring case, it is often epistemic or measurement-based (we cannot discern a difference, or values are incommensurable); in clinical equipoise, it is explicitly epistemic and ethical (we do not know which is better, so we must not act as if we do). The institution does not depend on conflating these distinct metaphysical states, but it does depend on treating them as normatively equivalent triggers for a tie-breaking rule. The common thread is not that the options are identical, but that the *authority to discriminate* between them has been exhausted or forbidden. As long as the agent lacks a permissible reason to prefer A over B, the normative situation is functionally identical to the haystack, regardless of whether that lack stems from identity, ignorance, or incommensurability.

  If the presupposed view of practical reason were replaced, the institutions would largely survive through redescription rather than structural change. If a new theory mandated that choice requires a preference, committees would simply articulate the preference for fairness or procedural integrity as the decisive reason, leaving the lottery intact. If a theory claimed indifference entails paralysis, institutions would either need to adopt a deterministic tie-breaker (e.g., "first arrived") to manufacture a reason or admit the choice is non-rational but morally necessary, which might undermine public trust but would not necessarily stop the practice given the stakes involved. If a theory claimed any choice is rational so long as nothing else is worse, the lottery would remain permissible but lose its privileged status as the *required* method. Ultimately, these practices are robust because they serve functional social goods—trust, equity, and decision efficiency—that are independent of the specific meta-ethical justification used to defend them, meaning the philosophy usually chases the practice rather than guiding it.
