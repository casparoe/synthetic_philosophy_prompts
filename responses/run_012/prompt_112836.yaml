      *   **Specific Tasks:**
          *   Rank open questions.
          *   Justify the order (upstream/downstream, tractability, dependency).
          *   For each item: Competing answers, what a decisive contribution looks like, what would change the ranking.
          *   Analyze the user's "tangle" (which strands are genuine, which are the same, which are artifacts).
          *   Provide advice for the Call for Proposals (CfP).
      *   **Constraint:** No reading lists/citations. Reconstruct arguments from content.

  2.  **Deconstruct the User's "Tangle":**
      *   *Strand 1 (Force/Content & Act-Theoretic Propositions):* Is F-G about moral language or general composition of force/content? Does act-theoretic semantics dissolve it or move it to propositional unity?
      *   *Strand 2 (Negation vs. Embedding):* Is negation a special case or deeper? Do relational/higher-order treatments generalize (disjunction, quantification, tense, thick terms)?
      *   *Strand 3 (Quasi-Realism/Minimalism):* Does earning truth-aptness actually secure logical vocabulary, or just postpone the debt?
      *   *Strand 4 (Meaning vs. Mental States):* Is expressivism about psychology or semantics? If one accepts truth-conditional semantics, is one still an expressivist?

  3.  **Evaluate the "Tangle" (Genuine vs. Artifact):**
      *   *Strand 1 (Force/Content):* This is the most fundamental. If the problem is general to force/content, metaethics is just the test case. If it's specific to moral predicates, it's a localized semantic issue. *Verdict:* Genuine and Upstream.
      *   *Strand 2 (Negation/Embedding):* Negation is often the hardest nut to crack for expressivists (Schroeder's problem). If negation is solved, does embedding follow? Often they are treated together, but negation is the logical pivot. *Verdict:* Genuine, but downstream of Strand 1.
      *   *Strand 3 (Quasi-Realism):* This is often a linguistic camouflage for the underlying semantic commitment. If the semantics is truth-conditional, the metaphysics of the content matters less for logic. *Verdict:* Partially an artifact of framing. The real question is "What constrains the semantics?"
      *   *Strand 4 (Meaning vs. Mind):* This is the definition of the project. If expressivism becomes just "truth-conditional semantics with non-cognitive metaphysics," the logical problems vanish (because standard logic applies), but the *metaethical* distinctiveness vanishes. *Verdict:* Genuine and Critical. This defines the success conditions.

  4.  **Develop the Research Agenda (Ranking & Justification):**
      *   *Criteria:* Upstream impact, Tractability (for logicians/semanticists), Downstream dependency.
      *   *Constraint:* 4 Fellows, 2 Years. Needs focused, high-leverage topics.

      *   *Drafting Item 1: The Generalization Question (Force/Content).*
          *   Why first? If F-G is just a case of the general force/content problem, expressivists can import general solutions. If it's specific to moral predicates, they need a specific solution. This determines the *scope* of the work.
          *   Tractability: High for formal semanticists.
          *   Decisive Contribution: A formal model showing whether moral embeddings behave like imperatives/interrogatives or like indicatives.

      *   *Drafting Item 2: The Metaphysics of Content vs. Semantics.*
          *   Why second? If expressivism allows standard truth-conditional semantics (Strand 4), the logical problems largely dissolve into metaphysical interpretation. If it requires a non-truth-conditional semantics, the logical burden is heavy.
          *   Tractability: Philosophical/Conceptual, but needs formal grounding.
          *   Decisive Contribution: Clarifying the "minimalist" threshold. When does a semantics count as "expressivist"?

      *   *Drafting Item 3: The Negation Pivot.*
          *   Why third? Negation is the minimal embedding context. If you can't handle negation without collapsing into cognitivism, you can't handle conditionals.
          *   Tractability: High (logic heavy).
          *   Decisive Contribution: A logic of normative negation that preserves inconsistency without positing belief-like states.

      *   *Drafting Item 4: Quantification and Domain Restriction.*
          *   Why fourth? Often ignored in favor of conditionals. But moral discourse involves quantifiers ("Everything he did was wrong").
          *   Tractability: High for formalists.
          *   Decisive Contribution: Handling quantified normative statements without committing to normative properties.

      *   *Drafting Item 5: Thick Concepts and Hybridity.*
          *   Why fifth? Thick terms (cruel, brave) mix description and evaluation. If expressivism fails here, it fails on natural language grounds.
          *   Tractability: Medium (needs linguistic nuance).
          *   Decisive Contribution: Separating the descriptive and expressive components in embedding contexts.

      *   *Drafting Item 6 (Deprioritized):* Quasi-Realist "Earnability".
          *   Why last? It's often verbal. If the semantics works, the "right to talk" follows. Focus on the mechanics, not the permission.

  5.  **Refining the Analysis of the User's "Tangle":**
      *   *Strand 1 (Force/Content):* Load-bearing. This is the structural engine.
      *   *Strand 2 (Negation):* Load-bearing, but derivative of 1.
