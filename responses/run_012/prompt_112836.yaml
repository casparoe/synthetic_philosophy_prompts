      *   *Fix:* Frame it as "Semantic Commitments." The question is whether the *semantics* must be non-truth-conditional, or if the *metaphysics* can carry the expressivist weight. This is crucial for the logicians.
      *   *Critique:* Is 2 years enough for this?
