answer: |-
  This is a strategic moment for this subfield. The literature has saturated with variations on "how to save expressivism from logic," but it has often failed to distinguish between *logical* failures, *semantic* failures, and *metaphysical* discomfort. Given your background and the foundation's resources (four fellows, two years), you have the capacity to fund technical, high-leverage work rather than another round of intuitive ping-pong.

  Here is the analysis of your "tangle," followed by the ranked research agenda and specific advice for the Call for Proposals (CfP).

  ### Part I: Diagnosing the Tangle

  You asked which strands are load-bearing, which are identical, and which are artifacts.

  **1. The Force/Content Composition Problem (Your Strand 1)**
  *   **Verdict:** **Load-Bearing and Upstream.**
  *   **Analysis:** This is the genuine engine of the Frege–Geach problem. If the problem is merely that moral sentences express attitudes, logic shouldn't break. Logic breaks because the *semantic value* of the sentence seems to shift between embedded and unembedded contexts. If this is a general problem about how force (attitude) and content (proposition) compose—as act-theoretic accounts suggest—then metaethics is merely the most visible test case for a general semantic theory.
  *   **Implication:** If this is a general semantic problem, expressivists can import solutions from the semantics of imperatives or interrogatives. If it is specific to moral predicates, they need a bespoke logic. Settling this determines whether the fellows are doing metaethics or general philosophy of language.

  **2. The Meaning vs. Mental States Distinction (Your Strand 4)**
  *   **Verdict:** **Load-Bearing and Definitional.**
  *   **Analysis:** This is not a separate problem from Strand 1; it is the *constraint* on Strand 1. It asks: What is the minimal commitment required to be an expressivist? If an expressivist accepts a standard truth-conditional semantics (where moral sentences have truth conditions) but maintains a non-cognitive metaphysics (those truth conditions are not robust facts), the logical problems largely vanish. Standard logic applies to truth-conditional contents regardless of their metaphysical ground.
  *   **Implication:** If "Expressivism" is redefined as "Non-cognitive metaphysics + Truth-conditional semantics," the Frege–Geach problem dissolves into a metaphysical dispute, not a logical one. If "Expressivism" requires "Non-truth-conditional semantics," the logical burden is massive. This distinction determines the success conditions for the fellows.

  **3. The Negation Problem (Your Strand 2)**
  *   **Verdict:** **Genuine but Downstream.**
  *   **Analysis:** Negation is the minimal embedding context. If you cannot account for the inconsistency of *p* and *not-p* without positing belief-like states, you cannot account for conditionals. However, this is a specific instance of the Composition Problem (Strand 1). Solving Strand 1 generally should solve negation. Focusing on negation in isolation often leads to ad hoc logical fixes that fail to generalize to quantification or modality.
  *   **Implication:** Treat negation as the "unit test" for the broader compositional theory, not the primary research object.

  **4. The Quasi-Realist/Minimalist Route (Your Strand 3)**
  *   **Verdict:** **Mostly Artifact / Verbal.**
  *   **Analysis:** This strand often functions as a permission slip rather than a technical solution. Claiming that expressivists have "earned the right" to truth-talk often obscures whether the underlying semantics actually supports logical validity. It postpones the debt rather than paying it. For a foundation interested in *logic and semantics*, funding work on whether expressivists are *allowed* to use truth predicates is less valuable than funding work on *how* those predicates compose.
  *   **Implication:** Deprioritize this. It is a meta-philosophical claim about the status of the discourse, not a first-order claim about the machinery of the discourse.

  ---

  ### Part II: The Research Agenda (Ranked)

  Here are six research priorities, ranked by upstream impact, tractability for formalists, and downstream dependency.

  #### 1. The Generality of the Embedding Problem
  *   **The Question:** Is the Frege–Geach problem specific to normative vocabulary, or is it a general feature of non-assertoric speech acts (imperatives, interrogatives, exhortatives) that standard semantics fails to capture?
  *   **Competing Answers:**
      *   *Special Case:* Normative predicates have a unique semantic type that requires a bespoke logic.
      *   *General Case:* All force-bearing sentences face this issue; moral language is just the place where we notice it because we care about moral validity.
  *   **Decisive Contribution:** A formal semantic model that treats moral predicates alongside imperatives or interrogatives. If a unified semantics handles embeddings for all three without collapse, the "metaethical" specificity of the problem is undermined, and the solution lies in general semantics.
  *   **Tractability:** High for fellows with formal semantics backgrounds. It requires modeling, not just argumentation.
  *   **Why First:** If the problem is general, the solution space expands to include general semantic theories. If it is specific, the fellows must build a bespoke logic. This dictates the entire methodology.
  *   **Ranking Mover:** If recent work in imperative semantics definitively solves embedding for commands, this drops in priority (the work is done). If imperative semantics is equally stumped, this rises.

  #### 2. The Semantics/Metaphysics Boundary (The "Cognitivist Creep" Test)
  *   **The Question:** Can a semantics be fully truth-conditional and compositional while the *metaphysics* remains expressivist? At what point does accepting truth-conditions force a commitment to cognitive mental states?
  *   **Competing Answers:**
      *   *Separation:* Semantics tracks truth conditions; metaphysics tracks the nature of those conditions. Expressivism is a metaphysical thesis only.
      *   *Entanglement:* To have truth conditions *just is* to represent the world cognitively. A truth-conditional expressivism is incoherent.
  *   **Decisive Contribution:** A rigorous definition of "truth condition" that does not entail "belief-like state." This might involve a deflationary account of truth or a pragmatic account of content that mimics truth-conditionality without the metaphysical weight.
  *   **Tractability:** Medium. Requires conceptual precision more than formal modeling, but needs to be formalized to be useful.
  *   **Why Second:** This defines the goalpost. If fellows can show that truth-conditional semantics is compatible with non-cognitive metaphysics, the logical problems (Strand 1 & 2) become trivial (standard logic applies). If they are incompatible, the logical burden returns.
  *   **Ranking Mover:** If a consensus emerges that deflationary truth is sufficient for logical validity, this drops. If deflationism is shown to be insufficient for *normative* validity specifically, this rises.

  #### 3. The Logic of Normative Negation
  *   **The Question:** Can we define a negation operator for normative sentences that preserves inconsistency (A and not-A are inconsistent) without positing that A and not-A express conflicting beliefs?
  *   **Competing Answers:**
      *   *Higher-Order Attitudes:* Negation expresses an attitude toward the attitude expressed by the positive sentence.
      *   *Content Negation:* Negation operates on the content, implying the content must be proposition-like (risking cognitivism).
      *   *Incompatibility Semantics:* Validity is defined by pragmatic incompatibility rather than truth-preservation.
  *   **Decisive Contribution:** A formal system (proof theory or model theory) where normative negation behaves classically in arguments but is given a non-cognitive interpretation. An impossibility proof (showing this cannot be done) would also be decisive.
  *   **Tractability:** High. This is pure logic/semantics.
  *   **Why Third:** Negation is the bottleneck. If you can't negate, you can't conditionalize. It is the minimal requirement for a logic of norms.
  *   **Ranking Mover:** If a robust incompatibility semantics is developed that handles negation easily, this drops. If negation continues to require ad hoc fixes that break compositionality, this rises.

  #### 4. Quantification and Domain Restriction in Normative Discourse
  *   **The Question:** How do quantifiers ("Everything he did was wrong," "Some action is obligatory") bind variables in an expressivist framework without committing to a domain of normative objects or properties?
  *   **Competing Answers:**
      *   *Substitutional:* Quantifiers range over linguistic items (avoids ontology, breaks standard semantics).
      *   *Objectual:* Quantifiers range over objects, but the predicates don't denote properties (hard to make sense of).
      *   *Plural/General:* Quantifiers express general attitudes rather than ranging over entities.
  *   **Decisive Contribution:** A treatment of normative quantification that validates standard inferences (e.g., Universal Instantiation) without ontological commitment to normative properties.
  *   **Tractability:** High for formalists. Often neglected in favor of conditionals.
  *   **Why Fourth:** Most Frege–Geach literature focuses on conditionals. But moral discourse is heavily quantified. If expressivism fails here, it fails as a theory of natural language. It is a stress test for the solutions to Negation (Item 3).
  *   **Ranking Mover:** If quantification is shown to be reducible to infinite conjunctions/disjunctions in this domain, this drops. If it requires a distinct quantifier logic, this rises.

  #### 5. Thick Concepts and Hybrid Semantics
  *   **The Question:** Do thick evaluative terms (e.g., "cruel," "brave") require a hybrid semantics (descriptive + expressive), and if so, how do the two components interact under embedding?
  *   **Competing Answers:**
      *   *Separability:* The descriptive and expressive content can be separated logically.
      *   *Inseparability:* The evaluation is part of the truth conditions.
      *   *Pragmatic:* The evaluation is purely pragmatic, not semantic.
  *   **Decisive Contribution:** Data-driven analysis (or formal modeling) of how thick terms behave in negation and conditionals compared to thin terms ("good," "right").
  *   **Tractability:** Medium. Requires attention to linguistic nuance which can be messy for pure logicians.
  *   **Why Fifth:** This is an empirical adequacy check. A theory might solve the logic of "good" but fail on "cruel." It is downstream of the general semantic framework.
  *   **Ranking Mover:** If thick terms are shown to behave identically to thin terms logically, this drops. If they exhibit distinct projection behavior, this rises.

  #### 6. (Deprioritized) The Quasi-Realist Vindication Project
  *   **The Question:** Can expressivists "earn the right" to talk of truth, facts, and knowledge?
  *   **Reason for Deprioritization:** This is largely a rhetorical project. If the semantics works (Items 1–4), the "right" to talk follows. If the semantics fails, the "right" is irrelevant. Funding this risks paying for verbal camouflage rather than mechanical repair.
  *   **Exception:** Fund this only if it takes the form of a deflationary theory of truth specifically applied to normative contexts (linking to Item 2).

  ---

  ### Part III: Advice for the Call for Proposals

  Your suspicion is correct: the standard framing hides the stakes. The CfP should not ask for "solutions to the Frege–Geach problem." That invites rehashes of 40-year-old debates. Instead, frame the call around **Compositional Semantics for Non-Cognitive Content.**

  **Specific Wording Recommendations:**

  1.  **Shift the Burden:** Do not ask applicants to defend expressivism. Ask them to **formalize** it. The call should specify that proposals must include a formal semantic fragment (model-theoretic or proof-theoretic) that handles at least negation and one further operator (conditional, quantifier, or modal).
  2.  **Broaden the Data:** Explicitly encourage comparisons with non-indicative moods (imperatives, interrogatives). Ask: *Is the normative embedding problem a special case of the force/content problem?* This invites the "General Case" solution (Item 1).
  3.  **Demand a Stance on Truth:** Require applicants to state explicitly whether their semantics is truth-conditional. If yes, they must explain how this avoids cognitivism (Item 2). If no, they must explain how validity is preserved (Item 3). No fence-sitting allowed.
  4.  **Discourage "Earning" Talk:** Discourage projects that focus primarily on whether expressivists are *entitled* to realist-sounding talk. Focus on whether the talk *works* compositionally.
  5.  **Interdisciplinary Nudge:** Since you have a workshop budget, use it to pair the philosophers with a linguist specializing in semantics/pragmatics interface or a logician specializing in substructural logics. The "tangle" often persists because metaethicists talk to metaethicists.

  **Summary of the Strategy:**
  You are funding the **engineering** of expressivism, not the **marketing**. By ranking the *Generality of the Problem* and the *Semantics/Metaphysics Boundary* above specific logical puzzles like negation, you force the fellows to determine if they are building a special logic for morals or a general logic for attitudes. This is the upstream decision that renders the downstream puzzles either solvable or obsolete.
