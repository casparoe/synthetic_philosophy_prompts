  6.  **Developing the Call for Proposals Advice:**
      *   Shift focus from "Solving Frege-Geach" to "Compositional Semantics for Non-Cognitive Content."
      *   Encourage cross-pollination with imperative/interrogative semantics.
      *   Demand formal rigor over metaethical posturing.

  7.  **Review against Constraints:**
      *   *No citations?* Check.
      *   *Defended agenda?* Check.
      *   *Ranking?* Check.
      *   *Criteria applied?* Check.
      *   *Addressing the "Tangle"?* Check.
