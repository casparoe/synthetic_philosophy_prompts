prompt: |-
  Ok so I run the definitions-and-classification desk at a national statistics agency (riviting work, I know), and a big part of the job is settling fights about whether something "really counts as" X. Recent ones: whether gig delivery riders are "employees" or "self-employed"; whether a car with nobody at the wheel has a "driver"; whether a category like "disabled" or "unemployed" picks out something real or is just a policy artifact we invented; whether an AI system that writes working code "understands" what it's doing. These blow up into multi-week fights with lawyers, engineers, and advocacy groups, and my honest read is that a lot of them aren't about the world at all, they're about which word we should be using. But I cant reliably tell which ones those are, and my gut flip-flops depending on who talked to me last.

  I'd like you to act as my expert on this — somebody who knows the philosophy of language and metaphysics literature on verbal disputes and the question of when two people who seem to disagree actually do, but who's also good at turning that into something an actual human can run. Please turn it into a decision procedure I can use on a live dispute. Assume I have about 20 minutes, the parties sitting in the room, no philosopher present, and that whatever I land on goes into an official classification that affects real money and legal exposure. Give me the questions to ask in order, what counts as a good-enough answer to each one, where the procedure is allowed to stop and just declare "verbal" or "substantive," and where it has to hand off to a human judgment call because there's no fact of the matter to look up. Don't bother with citations or a reading list — I can't check them and it's not the point.

  One thing I half-remember someone telling me, and I want you to fold it in if it's right: that even when a dispute is "just about words," it can still be a real fight about how we *should* use the word, and that that's not nothing. If that's so, the procedure needs a branch for it, and it needs to tell me when to stop adjudicating and just stipulate a definition and move on.

  Then run the procedure on three of my cases — the rider/employee one, the "is this category real or an artifact" one, and the "does the AI understand" one — and make sure at least one of them comes out in a way I won't like (e.g. that I can't dissolve it as verbal, or that I've been treating a genuine disagreement as a vocabulary problem, or that my agency has quietly been taking a side all along). At the end, tell me where this procedure will misfire, what it can't do, and which case is the one where it just reproduces the original fight in fancier words.

  Think it through carefully before you start, and maybe begin by brainstorming the different kinds of "merely verbal" dispute there might be — I suspect part of my problem is that I've been treating them all as one thing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Head of Definitions-and-Classification at a National Statistics Agency.
      *   **Problem:** Settling disputes about whether something "counts as" X (employee, driver, disabled, AI understanding). These disputes involve lawyers, engineers, advocacy groups. They affect money and legal exposure.
      *   **Core Issue:** Distinguishing between *substantive* disagreements (about the world) and *verbal* disagreements (about language/definitions), and knowing what to do in each case.
      *   **Specific Constraint:** Needs a *decision procedure* runnable in ~20 minutes, no philosopher present, high stakes.
      *   **Specific Instruction:** Incorporate the idea that "verbal" disputes can still be real fights about *how we should use words* (normative/pragmatic).
      *   **Task:**
          1.  Brainstorm types of verbal disputes (internal thought).
          2.  Create the decision procedure (questions, stop conditions, hand-offs).
          3.  Run the procedure on three specific cases (Rider/Employee, Category Real/Artifact, AI Understanding).
          4.  Ensure at least one outcome is unwelcome/challenging to the user.
          5.  Explain limitations/failure modes.
      *   **Tone:** Expert, practical, direct, no academic fluff/citations.

  2.  **Deconstruct "Verbal Disputes" (Internal Brainstorming):**
      *   *Type 1: Ambiguity.* One word, two meanings (e.g., "bank" of river vs. "bank" for money). Easy to fix.
      *   *Type 2: Vagueness/Borderline.* The concept is clear, but the case is on the edge (e.g., is a tall man "tall"?). This is often where the "real vs. artifact" fight lives.
      *   *Type 3: Conceptual Engineering/Normative.* We agree on the facts, but disagree on which label serves our goals best (e.g., should "unemployed" include discouraged workers?). This is the "how we *should* use the word" point the user mentioned.
      *   *Type 4: Metaphysical/Deep.* Disagreement about the underlying nature of reality (e.g., do social kinds exist?). Often masks Type 3.
      *   *Key Insight:* In a stats agency, *almost all* classification disputes are Type 3 (Normative/Pragmatic) disguised as Type 1 or 4. The "fact of the matter" is often the *purpose* of the statistic.

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* Filter from "Are we fighting about facts?" to "Are we fighting about goals?" to "Make a ruling."
      *   *Time Limit:* 20 mins. Needs to be punchy.
      *   *Steps:*
          1.  **Fact-Check:** Do we agree on the non-linguistic facts? (If no, stop, go find facts).
          2.  **Prediction-Check:** If we swap the labels, does anything change in the world *other* than the label? (If no, it's verbal).
          3.  **Purpose-Check:** What is this classification *for*? (Tax? Safety? Welfare?).
          4.  **Stakeholder-Check:** Who loses if we define it this way? (Reveals the normative stakes).
          5.  **Decision:** Stipulate based on purpose, acknowledge the cost.
      *   *Stop Conditions:* If facts are missing -> Pause. If purposes conflict irreconcilably -> Escalate to Policy (not Definitions).

  4.  **Running the Cases:**
      *   *Case 1: Gig Riders (Employee vs. Self-Employed).*
          *   Facts: Control, payment, risk.
          *   Label Swap: If we call them "employees," they get benefits. If "self-employed," they don't.
          *   Verdict: This is *not* merely verbal. It's a policy fight disguised as definition. The procedure should force the user to admit the agency is making policy, not just measuring. *Unwelcome outcome:* You can't solve this with better definitions; you're making law.
      *   *Case 2: Disabled/Unemployed (Real vs. Artifact).*
          *   Facts: People have impairments, people don't have jobs.
          *   Label Swap: The category boundaries shift counts.
          *   Verdict: This *is* verbal/conceptual. Social kinds are real *because* we treat them as real. The fight is about measurement validity.
          *   Outcome: Stipulate based on survey utility.
      *   *Case 3: AI Understanding.*
          *   Facts: AI outputs code.
          *   Label Swap: Does calling it "understanding" change safety protocols?
          *   Verdict: Purely verbal/metaphysical. No fact of the matter.
          *   Outcome: Define operationally for risk assessment. Don't answer the metaphysical question.

      *   *Constraint Check:* I need at least one outcome the user won't like.
          *   *Idea:* The Gig Rider case is the best candidate. The user wants to classify. The procedure should tell them "Classification is impossible here without making a political choice." Or, the "Real vs. Artifact" case could be challenging: "You've been pretending these are natural kinds, but they aren't." Let's go with the Gig Rider one being a "Policy, not Stats" ruling, which undermines their authority to decide based on "data." Or better: The "Real vs. Artifact" case reveals that *all* their categories are artifacts, which undermines the "objective" stance of the agency. Let's aim for the Gig Rider one showing that the "Definition Desk" is actually a "Policy Desk."

  5.  **Refining the Procedure (The "20-Minute Triage"):**
      *   Need to make it actionable.
      *   Phase 1: The Fact Swap (5 mins).
      *   Phase 2: The Consequence Test (5 mins).
      *   Phase 3: The Purpose Alignment (5 mins).
      *   Phase 4: The Ruling (5 mins).
      *   *Crucial Addition:* The "Normative Branch." If it's verbal, *why* do we care? (Resources, Rights, Dignity).

  6.  **Addressing the "Unwelcome Outcome":**
      *   I will structure the Gig Rider analysis to show that the dispute *cannot* be dissolved. It looks verbal, but the consequences are so high that treating it as verbal is dishonest. The agency *must* pick a side, and that pick is political.
      *   Alternatively, for the "Real vs. Artifact" case, I'll show that asking if a category is "real" is a category error. They are *all* artifacts designed to track reality. The fight is useless. That might be annoying.
      *   Let's go with the Gig Rider one. It forces the user to admit they are doing political work.

  7.  **Addressing Limitations:**
      *   Where does it fail? When power dynamics prevent honest answers. When "purpose" is contested (e.g., is the stats agency for government planning or public truth?). When the "facts" are theory-laden.
      *   Which case reproduces the fight? The AI one might just become a fight about "what counts as risk" rather than "understanding."

  8.  **Final Review against Constraints:**
      *   No citations? Check.
      *   20-minute procedure? Check.
      *   Three cases run? Check.
      *   Unwelcome outcome included? Check.
      *   Limitations explained? Check.
      *   Tone: Professional, empathetic to the bureaucratic nightmare.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the difficulty. It's not just semantics; it's power.
      *   *The Procedure:* "The 20-Minute Classification Triage."
      *   *Step 1: Non-Linguistic Facts.* (Did the car move? Did the rider get paid?).
      *   *Step 2: The Label Swap.* (If we change the word, do the physical consequences change?).
      *   *Step 3: The Teleological Check.* (What is this stat *for*?).
      *   *Step 4: The Normative Branch.* (If it's verbal, who benefits?).
      *   *Step 5: Stipulation.* (Pick the definition that serves the Purpose).
      *   *Case Runs:*
          *   Riders: Fails Step 3. Purpose is contested (Labor law vs. Gig economy innovation). *Unwelcome:* You can't classify this neutrally.
          *   Disabled/Unemployed: Passes Step 2. It's verbal. *Outcome:* Stipulate based on survey design.
          *   AI Understanding: Fails Step 1 (Facts about "understanding" are murky). *Outcome:* Operationalize for safety, ignore the metaphysics.
      *   *Limitations:* Power, contested purposes, theory-laden facts.
      *   *The "Reproduces Fight" Case:* The AI one. It just moves the fight to "what is risk."

  10. **Final Polish:** Ensure the distinction between "merely verbal" (trivial) and "verbal but high stakes" (normative) is clear. The user's intuition about "how we should use the word" is the key to the Normative Branch.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "it's political." I need to give them a way to *act*. The action is "Stipulate based on Agency Mandate." If the Mandate is unclear, that's the blocker.
  Also, for the "Real vs Artifact" case, I need to be careful. Social constructionists say they are artifacts, realists say they track biology. The procedure should show that *for statistics*, the "reality" is the *measurement reliability*, not the metaphysics.

  Let's finalize the "Unwelcome Outcome." The prompt asks for *at least one*. The Gig Rider case is the strongest candidate for "You thought this was a definition problem, but it's a legislative problem." I will make sure that lands hard.

