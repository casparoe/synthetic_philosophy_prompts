answer: |-
  Here is the breakdown you asked for. I've skipped the academic preamble. You don't need to know *why* this works, just *that* it works and where it breaks.

  ### Part 1: The Taxonomy of "Merely Verbal"
  You are right to suspect "verbal dispute" is doing too much work. In your chair, you are facing three distinct beasts that look the same:

  1.  **Ambiguity:** We use the same sound ("bank") to mean different things. Easy fix.
  2.  **Vagueness:** We agree on the concept, but the case is on the borderline (is a 10-minute delivery shift "employment"?). This is where most of your fights live.
  3.  **Normative/Conceptual:** We agree on the facts, but we disagree on which label best serves our goals (should "unemployed" include people who gave up looking?). **This is the one you half-remembered.** It is "just about words," but it is *not* trivial. It is a fight about resources, rights, and dignity disguised as a fight about dictionary definitions.

  Your job is not to find the "true" meaning. Your job is to identify which beast you are fighting and apply the right tool.

  ***

  ### Part 2: The 20-Minute Classification Triage
  **Setup:** You, the Lead Engineer/Subject Expert, the Lead Legal/Policy Rep. (Advocacy groups observe or submit briefs beforehand; they do not drive the triage).
  **Timer:** Set for 20 minutes. Hard stop.

  #### Phase 1: The Fact Swap (5 Minutes)
  **Question:** "If we swap the labels but keep all the physical/behavioral facts exactly the same, does anything change in the world *other* than the label?"
  *   *Example:* If we call the empty car "driverless" instead of "autonomous," does the car crash more often? Does the insurance payout change *automatically* via the text of the law, or does a judge have to interpret it?
  *   **Good Answer:** "The physical risk is identical." OR "The law triggers a penalty automatically based on the word 'driver'."
  *   **Bad Answer:** "Well, it feels different." OR "It depends on what 'driver' implies about intent."
  *   **Stop Condition:** If the answer is "The physical facts are disputed" (e.g., we don't know if the AI actually wrote the code or retrieved it), **STOP**. Send to Technical Verification. You cannot classify what you haven't measured.
  *   **Verdict:** If facts are agreed but consequences change *only* because of the label, proceed to Phase 2. This is a verbal/normative dispute.

  #### Phase 2: The Teleological Check (5 Minutes)
  **Question:** "What is this specific classification *for*? What decision does this statistic trigger?"
  *   *Constraint:* You cannot say "To be accurate." You must say "To allocate tax revenue," "To measure safety risk," or "To track social welfare."
  *   **Good Answer:** "This definition determines eligibility for benefit X." OR "This definition determines if a safety test is required."
  *   **Bad Answer:** "To reflect the true nature of the economy." (There is no single 'true nature').
  *   **Stop Condition:** If the parties cannot agree on the *purpose* of the statistic (e.g., Legal wants to minimize liability, Advocacy wants to maximize coverage), **STOP**. This is not a definition fight; it is a Policy Fight. Escalate to Agency Leadership. You cannot solve a goal conflict with a dictionary.
  *   **Verdict:** If the purpose is clear, proceed to Phase 3.

  #### Phase 3: The Normative Branch (5 Minutes)
  **Question:** "Since we agree on the facts and the purpose, why do we disagree on the word? Who loses if we define it *this* way?"
  *   *This is the branch you asked for.* This acknowledges that verbal disputes are often fights about justice or resources.
  *   **Good Answer:** "If we call them 'employees', the platform pays tax. If 'self-employed', the rider pays tax."
  *   **Bad Answer:** "It just isn't right."
  *   **Verdict:** Identify the trade-off. You are now explicitly mapping the cost of the definition.

  #### Phase 4: The Stipulation (5 Minutes)
  **Action:** Choose the definition that best serves the **Purpose** identified in Phase 2, acknowledging the **Trade-off** identified in Phase 3.
  *   **Rule:** Do not try to find the "real" meaning. Pick the meaning that makes the statistic useful for its intended goal.
  *   **Documentation:** Write down: "We define X as Y *for the purpose of* Z. We acknowledge this excludes group A."
  *   **Stop:** Meeting ends. Definition is set for this reporting cycle.

  ***

  ### Part 3: Running the Procedure on Your Cases

  Here is how this plays out in your conference room. I have been blunt about the outcomes.

  #### Case 1: Gig Delivery Riders (Employee vs. Self-Employed)
  *   **Phase 1 (Fact Swap):** Everyone agrees on the facts: The app assigns routes, the rider owns the bike, the rider sets some hours. If we swap the label, the riding doesn't change, but the tax/benefit status changes *automatically* by law.
      *   *Result:* Verbal/Normative dispute.
  *   **Phase 2 (Teleological Check):** You ask, "What is this classification for?"
      *   *Legal says:* "To enforce labor standards."
      *   *Industry says:* "To measure labor market flexibility."
      *   *Advocacy says:* "To ensure social safety nets."
      *   *Result:* **FAIL.** There is no single purpose. The "Definition" is doing the work of Legislation.
  *   **Phase 3 & 4:** You cannot proceed to Stipulation because you have no agreed Purpose.
  *   **The Unwelcome Outcome:** **You cannot classify this.**
      *   *Why:* You thought this was a definitions problem. The procedure reveals it is a **political problem**. Your agency is being asked to settle a labor law dispute under the guise of "measurement."
      *   *Action:* You must kick this up to the Ministry/Parliament. If you define it yourself, you are making law, not statistics. If you are forced to decide, you must admit in the metadata: "This classification prioritizes [Tax Collection] over [Worker Protection]." You cannot be neutral here.

  #### Case 2: "Disabled/Unemployed" (Real Category vs. Artifact)
  *   **Phase 1 (Fact Swap):** Everyone agrees on the biology and the job status. The fight is whether the category "Disabled" picks out a natural kind or a social construct.
      *   *Result:* Verbal/Metaphysical dispute.
  *   **Phase 2 (Teleological Check):** You ask, "What is this classification for?"
      *   *Consensus:* "To allocate disability support funds and track barriers to entry."
      *   *Result:* PASS. Purpose is clear.
  *   **Phase 3 (Normative Branch):** Who loses?
      *   *If 'Real' (Medical model):* People with social barriers but no diagnosis lose funds.
      *   *If 'Artifact' (Social model):* Budget becomes uncapped/hard to predict.
  *   **Phase 4 (Stipulation):** You stop asking if the category is "real." That is a useless question for statistics.
      *   *Action:* Stipulate: "For the purpose of Fund Allocation, 'Disabled' is defined as [Diagnosis X + Barrier Y]."
      *   *Note:* You explicitly reject the metaphysical fight. You treat the category as an *instrument*, not a discovery.
      *   *Outcome:* Satisfying. You dissolved the metaphysical fight by focusing on the instrument's utility.

  #### Case 3: AI System "Understanding" Code
  *   **Phase 1 (Fact Swap):** The AI writes working code. Does it "understand"?
      *   *Engineers:* "It's just probability."
      *   *Vendors:* "It reasons."
      *   *Facts:* The output is identical. The internal weights are opaque.
      *   *Result:* Verbal/Metaphysical.
  *   **Phase 2 (Teleological Check):** "What is this classification for?"
      *   *Safety Team:* "To determine if we need human oversight."
      *   *Marketing:* "To sell the product."
      *   *Result:* **CONFLICT.** Safety wants a high bar for "understanding" (to trigger oversight). Marketing wants a low bar (to sell autonomy).
  *   **Phase 3 (Normative Branch):** If we say it "understands," do we trust it more?
      *   *Result:* Yes. This is a risk assessment fight.
  *   **Phase 4 (Stipulation):** You ban the word "understand."
      *   *Action:* "We do not classify AI by mental states. We classify by **Reliability Tiers**."
      *   *Outcome:* You sidestep the philosophy. But...
      *   *The "Reproduces the Fight" Warning:* This case will likely reproduce the fight in fancier words. The vendors will fight about "Reliability Tiers" exactly as hard as they fought about "Understanding." You haven't solved the power struggle; you've just changed the vocabulary. The procedure saves you from metaphysics, but not from lobbying.

  ***

  ### Part 4: Where This Procedure Will Misfire

  You need to know the failure modes before you walk into that room.

  **1. The "Theory-Laden Facts" Trap**
  The procedure assumes Phase 1 (Facts) is clean. It often isn't.
  *   *Failure:* In the "Unemployed" case, is someone who didn't look for work in the last 4 weeks "unemployed"? To measure that, you need a survey. The survey design *creates* the fact.
  *   *Risk:* Parties will argue the *measurement* is the *definition*. You will spend 20 minutes arguing about survey methodology.
  *   *Fix:* If they argue about how the fact is measured, treat it as a Technical Verification issue (Phase 1 Stop), not a definition issue.

  **2. The "Contested Purpose" Deadlock**
  As seen in the Gig Rider case, if the stakeholders don't agree on *why* you are counting, you cannot define *what* you are counting.
  *   *Risk:* The procedure tells you to escalate, but your bosses might force you to decide anyway.
  *   *Fix:* If forced, use Phase 3 to write the "Loss Statement." "By defining X this way, we are prioritizing Goal A over Goal B." Put that in the footer of the report. Cover your agency's neutrality by admitting the bias.

  **3. The "Vagueness" Infinite Regress**
  Sometimes the borderline is the point.
  *   *Risk:* You define "Tall" as >6ft. Someone is 5'11.9". They will argue the cutoff is arbitrary.
  *   *Fix:* Acknowledge arbitrariness. "The cutoff is stipulated for administrative feasibility." Do not try to defend it as "natural."

  **4. The Case That Reproduces the Fight**
  As noted in the AI case, sometimes changing the vocabulary doesn't change the power dynamics.
  *   *Why:* Because the fight was never about the word; it was about the money/risk. The word was just the weapon.
  *   *Warning:* If Phase 3 reveals high stakes (money, jail, safety), expect the "Verbal" resolution to be rejected by the losers. They *want* the metaphysical fight because it delays the regulation.

  ### Summary Advice for Your Desk
  1.  **Stop looking for the "True" Category.** There is no Platonic form of "Employee." There is only "Employee-for-Tax-Purposes" and "Employee-for-Safety-Purposes."
  2.  **Use the "Purpose" as a Shield.** When advocacy groups scream you are "erasing" a group by not classifying them, point to the Teleological Check. "This statistic is for X. That group does not fit X. We will create a *different* statistic for them."
  3.  **Admit the Normative Branch.** When you know a definition helps one side, write it down. "This definition expands the safety net." Honesty about the normative impact protects you more than pretending the definition is "scientific."
  4.  **Know When to Quit.** If Phase 2 fails (Contested Purpose), do not issue a definition. Issue a "Data Gap" notice. It is better to have no number than a number that lies about its own politics.

  You are not a philosopher. You are a cartographer. Draw the map that helps people navigate the terrain they *say* they want to cross. If they can't agree on the destination, put the pen down.
