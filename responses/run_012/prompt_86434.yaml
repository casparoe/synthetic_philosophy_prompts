          *   *Consensus:* There is *no* consensus on the "best" model, but there is a growing consensus among *sex worker-led organizations* for decriminalization (NZ model), distinct from legalization (German model).
      *   *Conclusion:* Summarize the user's intuition. The slogan is a political rallying cry, not a logical proof.

  7.  **Refining the Tone:**
      *   Avoid saying "I think." Say "Research suggests," "Proponents argue," "Critics contend."
