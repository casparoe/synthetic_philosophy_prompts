prompt: |-
  ok, this might be a naive question but i keep getting stuck on it. I was in an argument about sex work policy and someone kept saying "sex work is work" like it was the whole argument — as if accepting that means you have to accept full legalization and labour protections, same as any other job, and anyone who questions it is just moralizing. I do basically think sex work is work. But I also thought the more feminist position was the Nordic model (criminalize the buyers, leave the sellers alone), and that New Zealand went the decriminalization route while Germany and the Netherlands legalized/regulated it as an industry, and those are three pretty different things. So either the slogan is doing way more work than i thought, or everyones sliding between meanings without noticing.

  What I want from you: spell out the actual distinct claims that "sex work is work" could be making, as a menu, from the trivial ones up to the radical ones. For each, say whether it's basically a platitude, definately contentious, or false, and then say which policy each reading actually gets you to — does any reading of "is work" really entail the German-style regulated-legalization model, or NZ-style decriminalization, or the Nordic model, or none of them? My suspicion is the slogan is compatible with all three and the people waving it around to argue for one of them are cheating, but I want to see it laid out.

  One more thing that might be related: I've noticed some people refuse the phrase "sex work" entirely and insist on "prostitution" or "prostituted people," and that seems to be doing the same kind of move in reverse. Fold that in if it's relevant.

  And please be honest about what's actually settled among people who study this versus what's genuinely contested — like, is there real consensus on whether criminalizing buyers reduces harm, or is that disputed? Don't hand me a contested view dressed up as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Question:** The user is confused about the slogan "sex work is work." They suspect it's being used ambiguously to jump from a descriptive claim to a specific policy prescription (usually full legalization/decriminalization), bypassing nuance.
