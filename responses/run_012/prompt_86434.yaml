  *(Self-Correction Note on "Consensus"):* I need to be very careful not to present the Amnesty International/WHO position as "objective truth" but as the position of major health/human rights bodies, while acknowledging the feminist abolitionist counter-position (e.g., Catharine MacKinnon, Melissa Farley) which holds significant sway in certain policy circles. The prompt asks for honesty about what is settled. The answer is: very little is settled empirically; much is ideological.

