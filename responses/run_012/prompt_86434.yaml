      *   **Evaluation:** For each claim, assess its truth status (platitude, contentious, false) and its policy implication (Nordic, NZ, German, none).
      *   **Terminology:** Address the "sex work" vs. "prostitution" terminology debate.
      *   **Evidence/Consensus:** Be honest about what is settled vs. contested in research (specifically regarding harm reduction and the Nordic model).
      *   **Tone:** Honest, nuanced, analytical, avoiding preaching or taking a definitive moral stance myself, but clarifying the logical landscape.

  2.  **Deconstruct "Sex Work is Work":**
      *   What does this phrase actually mean? It's not just one thing.
      *   *Claim 1: Descriptive/Economic.* People exchange sex for money. It involves labor. (Trivial/True).
      *   *Claim 2: Legal/Status.* It should be treated like other jobs under labor law. (Contentious).
      *   *Claim 3: Moral/Stigma.* It shouldn't be morally stigmatized differently than other service work. (Contentious).
      *   *Claim 4: Structural/Coercion.* The conditions of this work are comparable to other gig/ precarious work, not inherently trafficking. (Highly Contentious).
      *   *Claim 5: Policy Prescription.* Therefore, the state should regulate it exactly like a business (German model). (Does not necessarily follow).

  3.  **Map Claims to Policy Models:**
      *   *Nordic Model (End Demand):* Criminalize buyers, decriminalize sellers, provide exit services. Compatible with "it's work" in the sense that sellers aren't criminals, but incompatible with "it's work" in the sense of normalizing the industry.
      *   *NZ Model (Decriminalization):* Remove criminal penalties for all parties, treat under health/safety law. Strongest fit for "sex work is work" as a labor rights slogan.
      *   *German/Dutch Model (Legalization/Regulation):* State regulates, taxes, licenses. Fits "it's work" as an *industry*, but critics say it creates a two-tier system (legal vs. illegal) and increases trafficking.
      *   *Criminalization (Full):* Incompatible with "sex work is work."

  4.  **Address Terminology ("Sex Work" vs. "Prostitution"):**
      *   "Sex Work": Coined by Carol Leigh (1978). Emphasizes agency, labor, harm reduction.
      *   "Prostitution/Prostituted Persons": Often used by abolitionists/radical feminists. Emphasizes exploitation, objectification, inherent harm.
      *   *Function:* These aren't just synonyms; they are framing devices that presuppose the conclusion of the argument.

  5.  **Address Evidence/Consensus (The Tricky Part):**
      *   *Is there consensus?* No. This is a highly polarized field.
      *   *Nordic Model Evidence:* Some studies show reduced street prostitution, others show displacement to online/hidden areas, potentially making workers less safe. Data on trafficking is notoriously unreliable.
      *   *Decriminalization Evidence:* NZ data suggests improved ability to report violence, refuse clients.
      *   *Legalization Evidence:* Germany/Netherlands show large industries, but also concerns about mega-brothels and trafficking links.
      *   *Key Distinction:* Distinguish between *decriminalization* (NZ) and *legalization* (Germany). This is often conflated.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the user's suspicion. Yes, the slogan is doing heavy lifting. It conflates description with prescription.
      *   *Section 1: The Menu of Claims.* Break it down logically.
