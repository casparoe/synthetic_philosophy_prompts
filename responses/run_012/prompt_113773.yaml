  10. **Final Review against constraints:**
      *   Sort defeaters (Fatal -> Awkward).
      *   Include concessions.
      *   Address steganography specifically.
      *   Address the "guarantees" weakening.
      *   Tone: Analytical, balanced, technical but accessible.

