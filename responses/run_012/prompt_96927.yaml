  2.  **Deconstruct the Subject Matter (Hobbes & Geometry):**
      *   *Context:* Hobbes discovered Euclid late in life, became obsessed with squaring the circle, engaged in a decades-long feud with John Wallis (Savilian Professor), claimed to solve impossible problems, integrated geometric method into *De Cive* and *Leviathan*.
      *   *Traditional View:* Hobbes was deluded, mathematically incompetent, and the Wallis feud was a sad decline of a great mind.
      *   *Revisionist View:* Hobbes's "errors" reveal something about his materialism, his concept of science (*scientia*), or the social boundaries of mathematics in the 17th century.
      *   *The Team's Edge:*
          *   Phil of Math: Can analyze the actual mathematical claims and methodological commitments without anachronism.
          *   Historian of Phil: Can contextualize within early modern metaphysics/epistemology.
          *   Sociologist of Science: Can analyze the Wallis feud as a boundary-work episode, credentialing, and institutional power.

  3.  **Brainstorming Questions:**
      *   Why was Hobbes bad at math? (Psychological/Cognitive) -> *Overrated/Settled.*
      *   Did Hobbes actually solve anything? (Mathematical verification) -> *Settled (No).*
      *   How does geometric method relate to political obligation? (Philosophical) -> *High Importance.*
      *   What was the nature of the Wallis dispute? (Social/Institutional) -> *High Tractability for this team.*
      *   Is Hobbes's geometry consistent with his materialism? (Metaphysical) -> *Upstream.*
      *   Why did Hobbes think construction was superior to algebra? (Methodological) -> *Key to the "errors".*

  4.  **Selecting and Ranking the Questions:**
      *   *Constraint:* 3 Years, 3 People. Need focused outputs, not a book on everything.
      *   *Criterion:* Needs to leverage *all three* disciplines. A pure math history question wastes the sociologist. A pure sociology question wastes the philosopher of math.
      *   *Top Priority:* The connection between his *concept* of geometry (construction/motion) and his *metaphysics/politics*. This is the "why it matters" question.
      *   *Second Priority:* The social epistemology of the Wallis feud. This leverages the sociologist and historian.
      *   *Third Priority:* The specific mathematical methodology (construction vs. algebra). This leverages the philosopher of math.
      *   *Low Priority (Overrated):* "Was Hobbes insane/incompetent?" or "Who won the argument?"

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the constraints and the unique team composition.
      *   **Criteria Definition:** Explicitly define Importance, Tractability, Neglectedness, Upstream Dependency. Explain the trade-off (e.g., High Importance/Low Tractability vs. Medium Importance/High Tractability).
      *   **The Questions (Ranked):**
          1.  *The Metaphysical Grounding of Geometric Method:* How does "motion" in geometry link to "motion" in materialism/politics? (Upstream, High Importance).
          2.  *The Social Epistemology of the Wallis Feud:* Boundary work, authority, print culture. (High Tractability for this team).
          3.  *The Constructibility Constraint:* Why did Hobbes reject algebraic/analytic methods? (Phil of Math focus).
