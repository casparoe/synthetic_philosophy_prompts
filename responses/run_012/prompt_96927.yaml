answer: |-
  # Research Agenda: The Hobbesian Geometric Project

  ## 1. Criteria and Trade-Offs

  To allocate three years of labor among three specific disciplines, we must prioritize questions that require *all three* skill sets to answer adequately. A question answerable solely by archival history wastes the philosopher of mathematics; a question answerable solely by formal analysis wastes the sociologist.

  We employ four criteria, weighted as follows:

  1.  **Upstream Dependency (30%):** Does answering this question resolve ambiguities in other areas? (e.g., Understanding Hobbes's definition of "demonstration" is prerequisite to evaluating his political claims).
  2.  **Team Tractability (30%):** Can this specific trio make progress where a single-discipline scholar would stall? (e.g., Analyzing the Wallis feud requires mathematical literacy to understand the technical insults and sociological literacy to understand the institutional stakes).
  3.  **Philosophical Importance (25%):** Does the answer alter our understanding of early modern philosophy or the history of science?
  4.  **Neglectedness (15%):** Is this area under-researched relative to its importance?

  **Trade-off Strategy:** We prioritize **Upstream Dependency** and **Team Tractability** over raw Philosophical Importance. A highly important question that requires ten years of archival work (low tractability) or one that a single historian could solve (low team synergy) is rejected. We seek the "intersectional niche": questions where the *mathematics* cannot be separated from the *metaphysics* or the *social context*.

  **Dynamic Adjustment:** A question moves **up** the ranking if archival work reveals unpublished correspondence linking technical geometric claims directly to political drafting (e.g., *Leviathan* manuscripts). A question moves **down** if secondary literature converges on a consensus that renders further debate redundant.

  ---

  ## 2. The Ranked Research Questions

  ### Priority 1: The Metaphysics of Motion and the Definition of *Scientia*
  **Allocation:** 45% of group resources (18 months)

  *   **The Question:** Is Hobbes's insistence on geometric *construction* (rather than algebraic analysis) a mathematical preference, or is it a necessary consequence of his materialist metaphysics? Specifically, does his rejection of Wallis's algebraic methods stem from the belief that only motion-generated figures constitute real knowledge (*scientia*) of causes?
  *   **Upstream Status:** **Highly Upstream.** This is the foundation. If Hobbes's geometry is merely a hobby, his political philosophy stands apart from it. If his geometry is the template for all causal reasoning (including politics), then his "errors" in geometry are actually features of his epistemological system. You cannot evaluate his political method without settling his definition of valid demonstration.
  *   **Tractability (Team Synergy):**
      *   *Philosopher of Math:* Analyzes the technical distinction between construction and analysis in the 1640s–60s.
      *   *Historian of Phil:* Traces the concept of *scientia* from *De Corpore* to *Leviathan*.
      *   *Sociologist:* Examines how this definition of *scientia* was used to exclude rivals (like Wallis) who lacked "proper" causal grounding.
      *   *Why this team?* A pure historian might miss the technical force of the algebra/construction divide; a pure philosopher might miss the institutional stakes of defining *scientia*.
  *   **Cost of Neglect:** If left undone, we treat Hobbes's system as fragmented. We risk interpreting his political philosophy as metaphorical rather than methodological, missing the core claim that political obligation is as demonstrable as a geometric proof.

  ### Priority 2: The Social Epistemology of the Wallis Feud
  **Allocation:** 35% of group resources (14 months)

  *   **The Question:** How did the Hobbes-Wallis dispute function as "boundary work" for the emerging Royal Society? Was the condemnation of Hobbes's mathematics a mechanism for establishing professional credentialing and excluding amateur "natural philosophers" from mathematical authority?
  *   **Upstream Status:** **Midstream.** This depends on Q1 (knowing *what* they fought about) but informs Q3 (how the public perceived the errors). It explains *why* the errors mattered socially, even if they didn't matter mathematically.
  *   **Tractability (Team Synergy):**
      *   *Sociologist of Science:* Leads on boundary work, credentialing, and print culture analysis.
      *   *Historian:* Contextualizes the Savilian Chair and the Royal Society's early politics.
      *   *Philosopher of Math:* Ensures the group does not reduce the technical dispute *merely* to social power (avoiding the Strong Programme's excesses). The math must be shown to be the *vehicle* for the social exclusion.
      *   *Why this team?* Standard histories treat the feud as personality-driven. This team can treat it as an epistemic crisis.
  *   **Cost of Neglect:** We lose the opportunity to use Hobbes as a case study for the professionalization of science. We risk accepting Wallis's victory as purely meritocratic rather than institutional.

  ### Priority 3: The Rationality of Systematic Error
  **Allocation:** 20% of group resources (8 months)

  *   **The Question:** Given Hobbes's competence in logic and language, what specific cognitive or heuristic shortcuts led him to validate false geometric proofs? Was this a failure of calculation, or a category error regarding the nature of mathematical objects?
  *   **Upstream Status:** **Downstream.** This question presupposes we understand his method (Q1) and the pressure he was under (Q2). It is the "psychological" capstone.
  *   **Tractability (Team Synergy):**
      *   *Philosopher of Math:* Reconstructs the specific fallacies to identify the pattern of error.
      *   *Historian:* Checks against Hobbes's own self-corrections (or lack thereof) in later editions.
      *   *Sociologist:* Analyzes the role of public commitment in locking him into the error (escalation of commitment).
      *   *Why this team?* It prevents the analysis from becoming a "gotcha" list of mistakes. It treats the errors as data points in a reasoning process.
  *   **Cost of Neglect:** We leave open the "delusion" narrative. However, this is less critical than Q1 and Q2 because explaining the error is less philosophically productive than explaining the *system* that generated it.

  ---

  ## 3. Addressing Specific Matters

  ### Open vs. Settled Questions
  *   **Settled (but re-litigated):** *Did Hobbes square the circle?* No. *Was Wallis mathematically superior?* Yes. Re-litigating the technical validity of Hobbes's proofs is a waste of time. The math is settled by modern standards and was largely settled by contemporaries like Huygens.
  *   **Genuinely Open:** *Why did Hobbes think he succeeded?* *What did "success" mean to him?* *How did the definition of mathematical proof shift during his lifetime?* These are open because they require bridging the technical and the conceptual, which has rarely been done with sufficient rigor.

  ### Locus of Interest: Errors, Metaphysics, or Social Organization?
  The interest of Hobbes's mathematics lies **primarily in its bearing on his metaphysics and political philosophy**, with the social organization serving as the explanatory context for the reception of those ideas.
  *   *Reasoning:* Focusing on the **internal errors** is merely pathological. Focusing solely on the **social organization** risks reducing the philosophy to sociology. The "sweet spot" is showing how his **metaphysics necessitated a mathematical method** that was socially doomed. This makes the tragedy structural, not personal.

  ### Explanatory Goal: "Why Wrong?" vs. "Why Rational?"
  The group should **not** aim chiefly at explaining "how a formidably intelligent thinker can be systematically and self-confidently wrong." That framing accepts Wallis's premise that Hobbes was simply mistaken.
  *   **Alternative Goal:** The group should aim to explain **how Hobbes's mathematical practice was a rational implementation of his materialist ontology.** The goal is to show that, *given Hobbes's premises*, his geometric method was consistent, even if the conclusions were false. We are not explaining a failure of intelligence; we are explaining a coherence of system that clashed with the emerging analytic tradition.

  ---

  ## 4. Overrated Questions

  We explicitly flag the following as **Overrated** and allocate minimal resources to them:

  1.  **"Who won the Hobbes-Wallis debate?"**
      *   *Why:* Wallis won institutionally and mathematically. Hobbes lost. Settling this decisively changes nothing. The value lies in the *process* of the defeat, not the verdict.
  2.  **"Was Hobbes suffering from cognitive decline?"**
      *   *Why:* This is a medical/biographical question. It is unanswerable with certainty from texts alone and distracts from the philosophical content. It pathologizes the argument rather than engaging it.
  3.  **"Did Hobbes influence Newton?"**
      *   *Why:* While interesting, the causal chain is tenuous. Newton explicitly rejected Hobbes's method. Chasing influence distracts from analyzing Hobbes's system on its own terms.
  4.  **"A complete edition of the mathematical correspondence."**
      *   *Why:* The funders ruled out editions. Moreover, much is already available. The value add is *analysis*, not *archival retrieval*.

  ---

  ## 5. Dynamic Evaluation: Shifting the Ranking

  The ranking above is based on current historiography. The following evidence would force a re-allocation of the three-year timeline:

  *   **Move Q1 Down / Q2 Up:** If archival research reveals that Hobbes's geometric writings were primarily drafted *after* the political works as defensive apologetics, rather than foundational groundwork, then the metaphysical dependency (Q1) weakens. The project becomes more about reputation management (Q2).
  *   **Move Q3 Up:** If the Philosopher of Mathematics identifies a specific, previously unnoticed logical formalism in Hobbes's errors that anticipates later developments (e.g., in constructive mathematics), the "Rationality of Error" becomes central to the history of math, not just Hobbes studies.
  *   **Move All Down (Pivot):** If the group discovers that the "mathematical method" in *Leviathan* is demonstrably rhetorical rather than methodological (i.e., Hobbes didn't actually mean to apply geometry to politics), the core theme collapses. The group would then need to pivot to "The Rhetoric of Mathematics in Hobbes," focusing almost entirely on the Sociologist and Historian.

  ## 6. Conclusion

  This agenda rejects the "Great Man makes a mistake" narrative. Instead, it treats Hobbes's geometry as a stress test for the boundaries between metaphysics, mathematics, and social authority in the 17th century. By prioritizing the **Metaphysics of Motion (Q1)**, we ensure the work remains philosophical. By prioritizing the **Social Epistemology (Q2)**, we ensure it remains historical and sociological. By deprioritizing the **Technical Verification of Errors**, we avoid the trap of doing history of math without the history.

  The three-year output will not be a biography or a survey, but a **structural analysis of a failed scientific paradigm**, using Hobbes as the lens. This justifies the interdisciplinary funding: only a team that can read the math, the metaphysics, and the social context simultaneously can execute it.
