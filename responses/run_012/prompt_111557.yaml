answer: |-
  ### 1. Validation of Your Carrying Example (The Die Variant)

  **Verdict:** The example is mathematically sound and pedagogically useful, but your worry is correct: used in isolation, it invites the "cheap resolution" (i.e., "The paradox arises only from ignorance of the prior").

  **Check of your strategy:**
  *   **Pairs:** $(1,2), (2,4), (3,6), (4,8), (5,10), (6,12)$ with probability $1/6$ each.
  *   **Observation $x$:**
      *   $x \in \{1, 3, 5\}$: These can only be the smaller amount (since $0.5, 1.5, 2.5$ are not in the set). $P(\text{smaller}|x) = 1$. **Switch.**
      *   $x \in \{2, 4, 6\}$: These can be smaller (from pair $k$) or larger (from pair $k-1$). Since priors on pairs are equal, $P(\text{smaller}|x) = 1/2$. $E[\text{other}] = 1.25x$. **Switch.**
      *   $x \in \{8, 10, 12\}$: These can only be the larger amount (since $8, 10, 12$ exceed the max smaller amount of 6). $P(\text{smaller}|x) = 0$. **Stay.**
  *   **Conclusion:** Your strategy (Switch on $\le 6$, Stay on $> 6$) is optimal. The naive argument ($5a/4$) fails because it assumes $P(\text{smaller}|x) = 1/2$ universally, which is false at the boundaries ($1, 8, 10, 12$).

  **Why it risks being "too cheap":**
  Students will conclude: "The paradox is just a mistake about conditional probability caused by assuming a uniform prior over an infinite range. If we specify a proper prior, the math works fine." This allows them to dismiss the paradox as a mere calculation error in a specific (and unrealistic) setup, missing the deeper tension about expected value reasoning itself.

  **Remedy:** You must use the **Second Movement** to show that even with a perfectly specified, proper prior, one can construct a case where $E[\text{other}|x] > x$ for all $x$, forcing the diagnosis to rely on the *finiteness of expectation*, not just the existence of a prior.

  ---

  ### 2. The Second Movement: The Infinite Mean Variant

  **Goal:** Show a case where the conditional calculation holds everywhere, yet switching cannot be beneficial overall. This prevents the "just calculate the posterior" dismissal.

  **The Setup:**
  *   Pairs are $(2^k, 2^{k+1})$ for $k = 0, 1, 2, \dots$
  *   Probability of pair $k$ is $p_k = C \cdot (2/3)^k$ (where $C$ normalizes the sum to 1).
  *   This is a **proper probability distribution** (sums to 1).

  **The Calculation:**
  *   If you see $x = 2^k$:
      *   It is the smaller amount with probability proportional to $p_k$.
      *   It is the larger amount with probability proportional to $p_{k-1}$.
      *   Ratio: $\frac{p_k}{p_{k-1}} = \frac{2}{3}$.
      *   $P(\text{smaller}|x) = \frac{2/3}{1 + 2/3} = \frac{2}{5} = 0.4$.
      *   $E[\text{other}|x] = 0.4(2x) + 0.6(x/2) = 0.8x + 0.3x = 1.1x$.
  *   **Result:** $E[\text{other}|x] > x$ for **every** possible $x$.

  **The Diagnosis (The "Extra Work"):**
  *   If switching is always better, why isn't the total expected value higher?
  *   **The Catch:** Calculate the unconditional expected value of the envelope you hold:
      $$E[X] = \sum_{k=0}^{\infty} \frac{1}{2}(2^k + 2^{k+1}) p_k \propto \sum (2^k) \cdot (2/3)^k = \sum (4/3)^k$$
  *   This series **diverges**. $E[X] = \infty$.
  *   **The Lesson:** The Law of Iterated Expectations ($E[E[Y|X]] = E[Y]$) holds only when expectations are finite. When $E[X] = \infty$, you cannot aggregate the local advantages ($1.1x$) into a global advantage.
  *   **Why this isn't a counterexample:** It confirms the diagnosis. The naive argument implicitly assumes a prior structure that supports the $1/2$ conditional probability everywhere. As the Die Variant showed, this is impossible with finite support. As this Variant shows, it is possible with infinite support, but only at the cost of infinite expectation, which breaks the decision rule.

  ---

  ### 3. Seminar Plan: Order and Dependencies

  **Total Time:** 90 Minutes
  **Mode:** Whiteboard derivation + Socratic interrogation.

  #### Phase 1: The Naive Argument and The Die Variant (0–35 mins)
  1.  **State the Naive Argument (5 mins):** Write $E[\text{other}] = \frac{1}{2}(2a) + \frac{1}{2}(a/2) = 1.25a$. Ask: "Where is the probability mass coming from?"
  2.  **Introduce Die Variant (10 mins):** Write the pairs. Ask students to compute $P(\text{smaller}|x)$ for $x=1$, $x=6$, and $x=12$.
      *   *Dependency:* They must see that $P(\text{smaller}|x)$ varies with $x$.
  3.  **Diagnose the Fallacy (15 mins):**
      *   Show that the naive argument assumes $P(\text{smaller}|x) = 1/2$ for all $x$.
      *   Show that in the Die Variant, this holds only for intermediate values, failing at boundaries.
      *   **Settled Point:** The naive argument is invalid because it treats the probability of holding the smaller envelope as independent of the amount seen, which is false for any distribution with finite support.
      *   **Head Off Misconception:** "There is no uniform distribution... so the problem is ill-posed."
          *   *Intervention:* "The problem is not ill-posed; the *assumption* of a uniform prior is what is ill-posed. The Die Variant is well-posed and resolves the 'always switch' conclusion."

  #### Phase 2: The Second Movement (35–65 mins)
  4.  **Introduce Infinite Variant (10 mins):** Write the $(2^k, 2^{k+1})$ setup with $p_k \propto (2/3)^k$. Verify it sums to 1.
  5.  **Compute Conditional EV (10 mins):** Walk through the $1.1x$ calculation.
      *   *Observation:* Here, the conditional probability assumption *does* hold everywhere (it's 0.4, not 0.5, but constant enough to yield gain).
      *   *Tension:* "So should we always switch?"
  6.  **Reveal Infinite Mean (10 mins):** Calculate $E[X]$ on the board. Show divergence.
      *   **Head Off Misconception:** "This shows expected value is the wrong criterion."
          *   *Intervention:* "EV isn't wrong; it's undefined. You cannot compare $\infty$ to $\infty$ using standard arithmetic. The diagnosis holds: the naive argument requires a prior that yields infinite mean."
      *   **Head Off Misconception:** "Symmetry settles it."
          *   *Intervention:* "Symmetry implies $E[\text{yours}] = E[\text{other}]$. But if both are infinite, symmetry doesn't tell you whether switching increases value locally. The math shows it does locally, but global aggregation fails."

  #### Phase 3: Synthesis and Assessment (65–90 mins)
  7.  **Address the Conflation (10 mins):**
      *   **Head Off Misconception:** "Conflation of probability before opening with probability after opening."
      *   *Explicit Distinction:* Before opening, $P(\text{smaller}) = 1/2$. After opening $x$, $P(\text{smaller}|x)$ depends on the prior density at $x$ vs $x/2$. The naive argument uses the *before* probability in the *after* calculation.
  8.  **Closing Question (10 mins):** (See below).
  9.  **Wrap (5 mins):** Reiterate settled vs. contested.

  ---

  ### 4. Anticipated Misconceptions & Interventions

  | Misconception | When it will form | Where to head it off |
  | :--- | :--- | :--- |
  | **"The problem is ill-posed because there's no uniform prior."** | During Phase 1, when you show the Die Variant requires a specific prior. | **Phase 1, Step 3.** Emphasize that the paradox arises from *importing* an impossible prior, not from the setup being vague. The Die Variant is fully specified. |
  | **"Symmetry means it can't matter, so the math is irrelevant."** | During Phase 2, when you show $E[\text{other}|x] > x$. | **Phase 2, Step 6.** Acknowledge symmetry holds for unconditional expectations, but explain that infinite expectations break the link between local conditional gains and global unconditional gains. |
  | **"This proves Expected Value is the wrong decision criterion."** | During Phase 2, when expectations diverge. | **Phase 2, Step 6.** Clarify that EV is the correct criterion *when defined*. The failure is in the *existence* of the expectation, not the normative rule. |
  | **"The probability of holding the smaller is always 1/2."** | Throughout, as the intuitive anchor. | **Phase 1, Step 3 & Phase 3, Step 7.** Distinguish $P(\text{smaller})$ (ex-ante) from $P(\text{smaller}|X=x)$ (ex-post). The naive argument swaps them. |

  ---

  ### 5. The Closing Question

  Do not ask: "Why is the naive argument wrong?" (They will recite "infinite mean" or "boundary conditions").
  Do not ask: "What is the correct strategy?" (They will say "calculate the posterior").

  **Ask this:**
  > "Consider the Infinite Variant where $E[\text{other}|x] > x$ for every $x$. We agreed that $E[\text{yours}] = E[\text{other}] = \infty$. If I offer you a deal: pay me \$1 to switch envelopes, should you take it? Use the Law of Iterated Expectations to justify your answer."

  **Why this works:**
  *   If they say "Yes, because $E[\text{other}|x] > x + 1$," they fail to see that aggregating infinite expectations is invalid.
  *   If they say "No, because expectations are infinite," they must explain why the local calculation ($1.1x$) doesn't license the global transaction.
  *   **Correct Answer:** The Law of Iterated Expectations ($E[E[Y|X]] = E[Y]$) fails when $E[Y]$ is infinite. Therefore, you cannot sum the local advantages to justify a global cost. The "gain" is an artifact of manipulating divergent series.

  ---

  ### 6. Explicit Refusals (What NOT to do)

  1.  **Do not invoke Measure Theory:** Do not mention sigma-algebras or Lebesgue integration. Stick to sums and series divergence. If a student asks about "integration," say: "For this seminar, 'infinite sum' is the sufficient condition for the breakdown."
  2.  **Do not declare the Paradox "Solved":** Distinguish between the **mathematical diagnosis** (settled: the naive argument assumes an impossible prior or infinite mean) and the **philosophical resolution** (contested: whether this fully dissolves the intuitive puzzle). Say: "We have located the mathematical error. Whether this satisfies our intuition about rationality is a further question."
  3.  **Do not allow "Symmetry" to bypass calculation:** If a student argues "By symmetry, switching can't help," force them to reconcile that with the conditional calculation $E[\text{other}|x] > x$. Symmetry applies to the *unconditional* expectation, not the *conditional* one.
  4.  **Do not introduce Utility Functions:** Keep the discussion on Expected Value. Introducing risk aversion muddies the specific probabilistic error you are diagnosing.

  ### 7. Summary of Dependencies

  1.  **Die Variant** $\rightarrow$ Proves $P(\text{smaller}|x)$ is not constant.
  2.  **Not Constant** $\rightarrow$ Diagnoses Naive Argument (Step 1).
  3.  **Infinite Variant** $\rightarrow$ Shows $P(\text{smaller}|x)$ *can* be constant (or favorable) everywhere.
  4.  **Infinite Mean** $\rightarrow$ Diagnoses why "Always Switch" still fails (Step 2).
  5.  **Step 1 + Step 2** $\rightarrow$ Complete Diagnosis: The argument fails either because the prior doesn't exist (finite case) or the expectation doesn't exist (infinite case).
