  6.  *(Self-Correction on "Losing Side"):* The prompt asks me to "State the strongest argument on the losing side in its own terms." Since I am recommending a path, one side will "lose." Given the philosophical weight of the prompt (Sen, entitlement, political economy), the recommendation will likely favor the "Political/Structural" view, meaning the "Natural Disaster" view is the "losing side." I must articulate the "Natural Disaster" view very well before explaining why it is being set aside.

  7.  *(Final Review of Constraints):* No death tolls. No history lessons. Focus on reasoning.

