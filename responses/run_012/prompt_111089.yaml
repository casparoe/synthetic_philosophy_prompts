  2.  **Deconstruct the Philosophical/Conceptual Core:**
      *   *Definition:* Famine isn't just food shortage; it's mass starvation. Amartya Sen's "entitlement" approach is the implicit philosophical backbone here, even if not named. A purely descriptive definition (calories per capita) fails because food can exist while people starve. Therefore, the definition *must* include social access.
      *   *Causality:* The "Trigger vs. Setting" distinction. Drought is the match; policy is the dry tinder. But calling it "natural" implies inevitability. Calling it "political" implies intent or negligence. The memo needs to highlight that *causal attribution depends on the chosen baseline*. If the baseline is "perfect markets," drought is the cause. If the baseline is "historical resilience," policy failure is the cause.
      *   *Counterfactuals:* We can't run a controlled trial on a nation. We rely on comparative history and economic modeling. Confidence will never be 100%. Public statements need to reflect *moral certainty* based on *probabilistic evidence*, not scientific proof.
      *   *Institutional Trade-off:* Neutrality buys access but risks complicity. Advocacy buys accountability but risks expulsion. There is no middle ground that doesn't dilute the message.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format. To: Board of Directors. From: [My Name/Role]. Subject: Conceptual Framework for Famine Attribution.
      *   **Introduction:** Acknowledge the deadlock. State the purpose: not to re-litigate history, but to clarify the concepts driving the disagreement.
      *   **Section 1: Defining Famine (The Commitment).**
