  4.  **Refining the Tone:**
      *   Must sound like a scientist turned philosopher. Precise, analytical, humble about memory, firm on logic.
      *   Avoid jargon where possible, but use philosophical terms (counterfactual, baseline, normative) where they clarify.
      *   Ensure the "Three Cases" mentioned in the prompt are acknowledged as the *source* of the disagreement but not analyzed historically.
