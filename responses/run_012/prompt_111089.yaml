answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** [Your Name], Board Member
  **DATE:** October 26, 2023
  **SUBJECT:** Conceptual Framework for Famine Attribution and Public Statement

  **1. Purpose**

  For two years, this Board has been deadlocked over a single question: When we declare a famine, do we attribute it to natural causes (weather, crop disease) or political causes (policy, conflict, entitlement failure)? One side argues that calling famine "natural" preserves our neutrality and access. The other argues that calling it "political" preserves our integrity and accuracy.

  We have tried to resolve this by arguing over history—specifically Bengal, Ireland, and the Great Leap Forward. This has failed. We are not historians, and those cases are too contested to serve as proof. The deadlock persists because we are arguing over facts when we should be arguing over concepts. We are using the same words ("cause," "famine," "natural") to mean different things.

  This memo does not offer new data. It offers a conceptual framework. It clarifies what we commit to when we define famine, how we select causes, and what we trade when we speak. I recommend we adopt this framework to break the deadlock.

  **2. Defining Famine: The Commitment**

  We must first decide what kind of definition we are using. In the humanitarian sector, definitions are often technical thresholds (e.g., mortality rates, caloric intake). These are administrative tools. They tell us *when* to act, but not *what* we are acting upon.

  **The Problem with Purely Descriptive Definitions**
  A purely descriptive definition would treat famine as a biological or meteorological event: a sharp decline in food availability leading to starvation. However, after thirty-five years in agricultural science, I must state that no such purely descriptive definition is available. Food availability and human starvation are not linearly linked. Grain can rot in warehouses while people starve in the fields. If we define famine solely by food absence, we are describing a harvest failure, not a human catastrophe.

  **The Recommended Definition**
  I propose we adopt a **hybrid definition**. We commit to the following:
  *Famine is a severe crisis of food access in which social and political mechanisms fail to protect a population from preventable starvation, regardless of absolute food availability.*

  **Why this definition?**
  1.  **It matches reality:** It acknowledges that drought is often the *shock*, but starvation is the *outcome* of failed protection.
  2.  **It is performative:** By defining famine this way, we commit ourselves to looking at the *mechanisms of failure*, not just the *metrics of death*.
  3.  **It avoids the "Natural" trap:** It prevents us from labeling a crisis "natural" simply because rain did not fall. Rain is not an agent; governance is.

  **3. Causality: Triggers, Settings, and Baselines**

  The core of our disagreement is causal attribution. One side says drought causes famine. The other says policy causes famine. Both are factually correct in isolation, which is why the argument stalls. We need to understand how we select *the* cause from a web of conditions.

  **The Trigger vs. The Setting**
  My instinct as a scientist is to view weather as the trigger and institutions as the setting. A match (drought) falls on dry tinder (vulnerable population/policy). You need both for a fire (famine). To ask which is "the cause" is scientifically ambiguous unless we choose a **baseline**.

  **The Baseline Problem**
  Causal attribution is contrastive. We identify the cause as the factor that deviates from what we consider "normal."
  *   **Baseline A (Meteorological):** If we assume governments generally function to protect citizens, then the *drought* is the deviation from the norm. The drought is the cause.
  *   **Baseline B (Political/Moral):** If we assume weather variability is normal and expect societies to build resilience against it, then the *policy failure* is the deviation from the norm. The policy is the cause.

  **The Choice**
  There is no scientific way to choose between Baseline A and Baseline B. It is a normative choice. It depends on what we think *ought* to be normal.
  *   If we choose Baseline A, we treat government failure as background noise.
  *   If we choose Baseline B, we treat weather variability as background noise.

  **Recommendation:** As a humanitarian organization, our mission is human welfare, not meteorological observation. We exist to intervene where human systems fail. Therefore, we must adopt **Baseline B**. We treat weather as a constant risk and governance as the variable. When a population starves during a drought, the *cause* of the starvation is the failure to mitigate the drought. This does not deny the drought occurred; it denies that the drought necessitated the deaths.

  **4. The Counterfactual Problem: Evidence and Confidence**

  To say policy caused a famine is to make a counterfactual claim: "If the policy had been different, people would not have starved." We cannot test this. We cannot run a controlled trial on a nation.

  **Evidence Standard**
  Since we cannot prove this scientifically, what evidence suffices?
  1.  **Comparative History:** Similar weather shocks in neighboring regions with different policies that did not result in famine.
  2.  **Temporal Correlation:** Policy restrictions (export bans, market closures, confiscation) that precede mortality spikes.
  3.  **Logistical Data:** Evidence of food existence alongside evidence of access denial.

  **Calibration of Public Statements**
  We must distinguish between *scientific certainty* and *moral certainty*.
  *   **Scientific Certainty:** We cannot attain this regarding counterfactuals.
  *   **Moral Certainty:** We can attain this when the evidence of preventability is overwhelming.

  **Recommendation:** Our public statements should not claim "proof" of intent (which implies malice we cannot always know) but "confidence" in preventability (which implies negligence we can observe). We should state: *"The evidence indicates this crisis was preventable had standard protective measures been maintained."* This outruns scientific proof but stays within the bounds of reasonable inference. We must accept that this lowers our statistical confidence but raises our moral accuracy.

  **5. Institutional Consequences: The Trade-Off**

  We must be honest about the cost of this framework. There is no strategy that maximizes both access and accountability.

  **The Case for the "Natural Disaster" Frame (The Strongest Losing Argument)**
  The argument for describing famines as natural disasters is not merely cowardly; it is consequentialist. It holds that:
  1.  **Access saves lives now:** If calling a famine "political" gets us expelled, people die immediately. If we call it "natural," we stay and feed them.
  2.  **Neutrality is a shield:** In conflict zones, being seen as a political actor makes staff targets.
  3.  **Incrementalism:** It is better to save 80% of a population by staying silent on the cause than to save 0% by speaking the truth and leaving.
  *This argument prioritizes immediate mitigation over long-term structural change.*

  **The Case for the "Political Crime" Frame (The Recommended Path)**
  The argument for describing famines as political failures holds that:
  1.  **Complicity:** If we label a preventable disaster "natural," we launder the responsibility of the perpetrators. We become instruments of their narrative.
  2.  **Recurrence:** Feeding people without addressing the cause ensures the famine returns. Access without accountability is a bandage on a bullet wound.
  3.  **Trust:** Donors and the public increasingly understand entitlement theory. Calling a policy-induced famine "natural" damages our credibility as experts.

  **The Trade-Off**
  If we adopt the recommended framework (Baseline B), we will lose access in some jurisdictions. Governments that rely on the "natural disaster" narrative to excuse failure will deny us visas. We must accept this. We cannot claim to be witnesses to suffering while agreeing to be blind to its source. Neutrality in the face of preventable death is not neutrality; it is tacit endorsement.

  **6. Bottom Line for Vote**

  I move that the Board adopt the following **Framework for Famine Attribution**:

  **1. Definition:** The Organization defines famine as a failure of social and political protection mechanisms in the face of food security shocks, rather than a simple absence of food.

  **2. Attribution:** In public statements and internal assessments, the Organization will identify the *preventable* causes of starvation. Where evidence indicates that policy, conflict, or entitlement failure turned a shock into a catastrophe, these will be cited as primary causes. Weather events will be described as *triggers*, not *causes*.

  **3. Language:** We will avoid assigning *intent* (e.g., "genocide") unless legally verified, but we will assign *responsibility* (e.g., "preventable," "policy-induced"). We will use the phrasing: *"This crisis is the result of [Specific Policy/Action] rendering the population vulnerable to [Specific Shock]."*

  **4. Reservations (Safety Clause):** Field Directors are authorized to revert to "neutral/descriptive" language only when there is a verified, imminent threat to staff safety or a total revocation of access that would halt life-saving operations. This exception must be reported to the Board within 30 days.

  **5. Review:** This framework will be reviewed in two years. It will be revisited sooner if:
  *   Staff safety incidents are directly linked to this attribution language.
  *   We are denied access in more than two major operational theaters specifically due to this framing.

  **Conclusion**

  We are not choosing between truth and safety. We are choosing between two kinds of risk. The risk of expulsion, or the risk of complicity. My career in science taught me that we cannot control the weather. My reading in philosophy has taught me that we are responsible for how we describe it. I ask the Board to accept that famine is a human failure, not a natural one, and to speak accordingly.

  **[Your Name]**
  **Board Member**
