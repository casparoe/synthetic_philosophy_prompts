          *   Recommendation: We must choose the baseline that aligns with our mission. Our mission is human welfare, not meteorological observation. Therefore, the *modifiable* factor (policy) is the relevant cause for us.
      *   **Section 3: The Counterfactual Problem (Evidence & Confidence).**
          *   Acknowledge we can't prove "what would have happened."
          *   Evidence standard: Comparative analysis (similar drought, different outcome), economic data on grain movement, timing of policy decisions.
          *   Calibration: Public statements should not claim "scientific proof" of intent but "moral certainty" of preventability. Distinguish between *malice* and *negligence*.
      *   **Section 4: Institutional Consequences (The Trade-off).**
