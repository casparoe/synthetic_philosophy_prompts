  **3.1** The phenomenological "neutral life" is inadmissible as an origin point due to unverifiable inter-subject variance regarding what constitutes a life "not worth living."
  **3.2** The zero-point (0 SWU) shall be administratively fixed at the 50th percentile of aggregated life-satisfaction reports within Reference Population A.
  **3.3** Negative SWU values denote states below the statistical median, not necessarily net suffering. This prevents the logical error of assuming a non-existent state of null experience and stabilizes the baseline against demographic shifts.

  **4. Scale Transformation and Measurability**
  **4.1** Individual preferences are ordinal by nature but must be rendered cardinal for aggregation.
  **4.2** Agencies shall apply the Standard Linear Interpolation to convert ranked preferences into interval data. This assumes equal psychological distance between ranked options.
  **4.3** Variance in scale usage (e.g., one subject's "7" equals another's "4") shall be normalized via calibration against monetary proxies to ensure a common denominator.

  **5. Monetary Proxy and Experienced Utility**
  **5.1** Willingness-to-pay (WTP) is the primary observable metric for welfare changes, acknowledging money as the only liquid common currency.
  **5.2** To correct for the diminishing marginal utility of money, WTP must be adjusted by the Income Elasticity Coefficient (IEC).
  **5.3** In cases where WTP diverges from reported experienced utility (e.g., disability adaptation), reported experience shall be discounted by 15% to account for hedonic normalization bias and projection errors. Subjects underestimate their capacity to adapt to permanent conditions.

  **6. Aggregation Protocol**
  **6.1** Social welfare functions shall be calculated via simple summation of individual SWUs.
  **6.2** Distributional weights are prohibited unless specified by Legislative Amendment 12-C, as weighting introduces non-utilitarian moral judgments.
  **6.3** Intransitive social orderings resulting from individual rationality (Arrow's Constraint) shall be resolved by senior adjudicator fiat to ensure policy continuity.

  **7. Exceptional Cases**
  **7.1** Entities demonstrating marginal utility capacity exceeding 10 standard deviations above the mean ("Utility Monsters") are classified as Class-4 Anomalies.
  **7.2** Resource allocation involving Class-4 Anomalies is suspended pending Committee Review. No precedent shall be set to avoid total resource capture.

  **Annex A: Disputed Calibration Cases**
  **Case A-1: Chronic Pain vs. Bereavement.**
  1 unit of chronic lower-back pain (duration: 1 year) is equivalent to 0.8 units of acute grief (duration: 3 months). Adjustments apply for kinship density. Note: Bereavement intensity decays non-linearly.
  **Case A-2: Intensity vs. Duration.**
  Severe pain (Intensity 9/10, Duration 1 hour) is calibrated equal to Mild pain (Intensity 3/10, Duration 5 years). Projection bias adjustments apply if the subject is currently experiencing either state. Subjects currently in pain overestimate the disutility of duration.

  ***

  **Note on Technical Context**
  This document satirizes the administrative imposition of interpersonal utility comparisons. In welfare economics and philosophy, the commensurability of welfare across persons is genuinely contested. While cost-benefit analysis often proceeds *as if* comparisons are possible (using Kaldor-Hicks efficiency), the theoretical foundation remains disputed. Ordinalism (preferences can be ranked) is widely accepted; cardinality (preferences have measurable intensity) and interpersonal comparability are not. The "zero-point" problem and the validity of WTP as a proxy for utility are active areas of debate, with no consensus on whether a single metric can capture diverse human experiences without ethical loss.
