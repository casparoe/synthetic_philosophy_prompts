  **1. Scope and Application**
  This standard mandates the quantification of subjective welfare for judicial adjudication, insurance liability determination, and regulatory impact assessment. All agencies must utilize the Standardized Welfare Unit (SWU) for cross-individual comparisons. Deviations require Level-5 Authorization.

  **2. Definitions**
  **2.1 SWU:** The base unit of interpersonal welfare, defined by calibration against Reference Subject benchmarks.
