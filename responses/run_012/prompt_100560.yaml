  **1. Scope**
  This standard governs the quantification of subjective welfare for legal adjudication, insurance liability, and regulatory impact assessment. All agencies must utilize the Standardized Welfare Unit (SWU) for cross-individual comparisons.

  **2. Definitions**
  **2.1 SWU:** The base unit of interpersonal welfare.
  **2.2 Reference Subject:** A statistical construct representing the median sensory and cognitive processing capacity of the population.

  **3. Zero-Point Calibration**
  **3.1** The phenomenological "neutral life" is inadmissible as an origin point due to unverifiable inter-subject variance.
  **3.2** The zero-point (0 SWU) shall be administratively fixed at the 50th percentile of aggregated life-satisfaction reports within Reference Population A.
  **3.3** Negative SWU values denote states below the statistical median, not necessarily net suffering.

  **4. Scale Transformation**
  **4.1** Individual preferences are ordinal by nature but must be rendered cardinal for aggregation.
  **4.2** Agencies shall apply the Standard Linear Interpolation to convert ranked preferences into interval data.
  **4.3** Variance in scale usage (e.g., one subject's "7" equals another's "4") shall be normalized via calibration against monetary proxies.

  **5. Monetary Proxy and Utility**
  **5.1** Willingness-to-pay (WTP) is the primary observable metric for welfare changes.
  **5.2** To correct for the diminishing marginal utility of money, WTP must be adjusted by the Income Elasticity Coefficient (IEC).
  **5.3** In cases where WTP diverges from reported experienced utility (e.g., adaptation), reported experience shall be discounted by 15% to account for hedonic normalization bias.

  **6. Aggregation Protocol**
  **6.1** Social welfare functions shall be calculated via simple summation of individual SWUs.
  **6.2** Distributional weights are prohibited unless specified by Legislative Amendment 12-C.
  **6.3** Intransitive social orderings resulting from individual rationality shall be resolved by senior adjudicator fiat.

