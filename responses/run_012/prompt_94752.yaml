  *   **If R. says NORM (Not Convention):** She is **Rule A (Strict Lewisian)** or **Rule C (Functionalist)**. She maintains the technical distinction that conventions must select among coordination equilibria, whereas queues enforce fairness or order via sanction.

  ### 6. Underdetermination and Implicit Commitments

  There is one area where R.'s record genuinely underdetermines her theory: **The Nature of Arbitrariness.**

  In the Dress Case, you claim the practice is arbitrary because "the defense would proceed identically if everyone wore jeans." However, a Strict Lewisian might argue that if the function of the dress is *signaling seriousness*, then jeans are not a substitute equilibrium because they signal the wrong thing.
  *   **Principle at Stake:** Is a regularity arbitrary if it serves a signaling function?
  *   **Lewis's View:** Signaling systems (like language) *are* conventions because the link between signal and meaning is arbitrary.
  *   **The Commitment:** If R. calls the Dress Case a Convention, she commits to the view that *symbolic signaling* counts as a sufficient "problem" for conventionhood, even without material coordination. If she calls it a Norm, she commits to the view that conventions must facilitate *material* coordination or exchange, not just status signaling.

