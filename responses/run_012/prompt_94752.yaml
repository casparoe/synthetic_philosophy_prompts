  ### 5. The Discriminating Case

  To cleanly separate Rule A (Strict Lewis) from Rule B (Broad Interdependence) — regardless of how she rules on your dress case — you should present her with the following example. This case isolates *Distribution Norms* from *Coordination Conventions*.

  **The Case: "The Queue" (First-Come-First-Served)**
  > "Consider a busy coffee shop where there is no physical barrier or ticket machine. Customers form a line. Everyone conforms, everyone expects everyone else to conform, and anyone who cuts in line is subject to immediate social sanction (glares, verbal correction). The rule is arbitrary (they could have used a lottery system or a ticket dispenser). However, standing in line does not solve a *coordination* problem (my getting coffee doesn't depend on *you* standing in line, only on you not cutting); it solves a *distribution* problem (who gets served first)."

  **How this separates the rules:**
