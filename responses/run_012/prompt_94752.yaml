answer: |-
  This is a classic problem in social ontology: distinguishing *conventions* (in the Lewisian sense) from *social norms* (in the sociological or normative sense). Your colleague R.'s verdicts provide a rich dataset for reverse-engineering her operative definition. Below is an analysis of the candidate rules, a prediction for your dress-code case, and a discriminating test case to settle the theoretical ambiguity.

  ### 1. The Space of Candidate Rules

  Based on R.'s track record, we can isolate three plausible theories of convention that fit her "Yes" and "No" verdicts on the initial cases.

  **Rule A: The Strict Lewisian (Coordination Equilibrium)**
  *   **Definition:** A convention is a regularity in behavior sustained by a *proper coordination equilibrium*. Agents conform because they prefer to conform *on the condition that others conform*, due to the intrinsic benefits of coordination (not merely to avoid sanctions). The regularity must be arbitrary (another equilibrium was possible).
  *   **Fit to Record:** Explains Driving, Currency, Language, Escalator, Call-back (all involve interdependence where matching/aligning yields a better outcome). Explains Bridge No (no interdependence), Reflex No (not arbitrary/voluntary), One-off No (not recurrent).
  *   **Key Constraint:** The preference to conform must stem from the *coordination payoff*, not merely the fear of sanction.

  **Rule B: The Broad Interdependence View (Normative Convention)**
  *   **Definition:** A convention is any arbitrary, recurrent regularity sustained by *strategic interdependence* and mutual expectation. This includes interdependence driven by sanctions/normative judgment, not just coordination payoffs.
  *   **Fit to Record:** Fits all "Yes" cases (all have interdependence). Fits all "No" cases (Bridge lacks interdependence; Reflex lacks arbitrariness/volition; One-off lacks recurrence).
  *   **Key Constraint:** Drops the requirement that the underlying game be a *coordination* game. Allows Prisoner's Dilemma or Assurance games solved by norms to count as conventions.

  **Rule C: The Functionalist View (Problem-Solving)**
  *   **Definition:** A convention is an arbitrary regularity that solves a *recurrent practical problem* independent of the rule itself (e.g., traffic flow, communication, exchange).
  *   **Fit to Record:** Fits all "Yes" cases (all solve clear practical problems). Fits Bridge No (problem solved by geography, not rule). Fits Reflex No. Fits One-off No.
  *   **Key Constraint:** There must be a pre-existing functional problem that the rule alleviates.

  ### 2. Predictions for the Formal-Dress Case

  Here is how each rule applies to your department's dress code:

  *   **Rule A (Strict Lewisian):** **VERDICT: NO.**
      *   *Reasoning:* You specified the defense "would proceed identically if everyone wore jeans." There is no coordination payoff to matching attire. The preference to conform is driven entirely by the threat of sanction (being "judged"), not by the benefit of the coordinated outcome itself. For a Lewisian, this is a *social norm*, not a *convention*.
  *   **Rule B (Broad Interdependence):** **VERDICT: YES.**
      *   *Reasoning:* The case meets all criteria: Recurrence (every defense), Mutual Expectation (universally expected), Arbitrariness (jeans would work physically), and Strategic Interdependence (my best move depends on your expectations/reactions). The source of the interdependence (sanction vs. coordination) is irrelevant.
  *   **Rule C (Functionalist):** **VERDICT: NO.**
      *   *Reasoning:* You specified the practice "coordinates nothing." If the defense proceeds identically in jeans, the suit solves no functional problem (like communication or safety). It is purely symbolic.

  ### 3. Diagnosis: Which Rule is R. Running?

  I believe R. is operating with **Rule B (The Broad Interdependence View)**.

  **Why?**
