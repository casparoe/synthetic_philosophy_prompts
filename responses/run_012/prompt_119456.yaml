  7.  **Final Polish:** (Writing the text with attention to flow and voice.) *Self-correction: Ensure the distinction between Part 1 and Part 2 of the film is clear but integrated into the argument.* *Make sure the "magic cave" analysis doesn't resolve too neatly.*

