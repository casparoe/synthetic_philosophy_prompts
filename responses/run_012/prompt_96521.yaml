answer: |-
  Here is a 90-minute session plan designed to validate your position (that the time-average argument is substantive) while acknowledging the mathematical equivalence your friend cites. The goal is to shift the group's intuition from *preference* (utility) to *physics* (dynamics).

  ### 1. The Foundation: What Must Come First
  **Do not start with utility functions.** If you begin by defining $U(W) = \log(W)$, you concede the debate immediately. To philosophers and economists, this frames Kelly as a normative claim about risk preference ("I happen to like logs") rather than a descriptive claim about dynamics ("Wealth grows multiplicatively").

  **Start with the structure of the process.**
  Before introducing the Kelly formula, establish that wealth accumulation in this context is a **non-ergodic multiplicative process**.
  *   **Minute 0–15:** Contrast an *additive* process (win \$10 or lose \$10) with a *multiplicative* process (win 10% or lose 10%).
  *   **The Hook:** Show that in an additive world, the ensemble average (expected value) and the time average (what happens to you over time) are identical. In a multiplicative world, they diverge.
  *   **Why this matters:** This makes the distinction substantive. It moves the argument from "What is your risk tolerance?" (subjective) to "What is the geometry of wealth?" (objective). If the system is non-ergodic, maximizing the ensemble average is mathematically guaranteed to fail the single trajectory agent in the long run.

  ### 2. The Carrying Scenario: The 60/40 Even-Money Coin
  **Use the simple biased coin (60% win, 40% loss, even-money payoff).**
  This is the **right** example, provided you use it to highlight the "bet everything" trap.

  *   **Why it works:** It is the minimal viable example where $E[\text{Return}] > 0$ but betting 100% of bankroll leads to ruin with probability 1.
      *   If you bet 100% every time, your Expected Wealth ($E[W]$) grows exponentially ($1.2^t$).
      *   However, your *actual* wealth almost surely goes to zero (because a single loss wipes you out, and the probability of *never* losing approaches zero as $t \to \infty$).
  *   **The Lesson:** This creates a visceral crisis. If "rationality" means maximizing Expected Wealth, the rational agent bets 100% and goes broke. If "rationality" means staying in the game and growing, the rational agent bets less.
  *   **Implementation:** Do not just describe this. Show a plot of 1,000 simulated paths of 100% betting. Show the average line skyrocketing while 99% of the individual lines hit zero. This visual gap between the "average" and the "typical" is the engine of your argument.

  ### 3. Sequence and Misconception Management
  You must introduce misconceptions *just before* they naturally arise, then dismantle them.

  **A. "Kelly is just Log Utility" (Minute 30–45)**
  *   **When:** After you have derived the growth rate maximization but before you finalize the formula.
  *   **How to head it off:** Acknowledge the mathematical identity: $\max E[\log(W)] \iff \max \text{Geometric Mean Growth}$.
  *   **The Pivot:** Ask the group: *"Why the log?"*
      *   **Friend's View:** Because the agent has log utility (a preference).
      *   **Your View:** Because the log transforms the multiplicative process into an additive one, allowing the Law of Large Numbers to apply to the *time average*.
      *   **Key Distinction:** Frame log utility not as an assumption of risk aversion, but as the **unique transform required to make the expectation operator commute with time** in a multiplicative system. This preserves the substantive nature of the time-average argument.

  **B. "Kelly Maximizes the Median" (Minute 45–60)**
  *   **When:** When discussing the distribution of outcomes.
  *   **How to head it off:** It is true that for log-normal distributions, the mode of the log-wealth is the median. However, Kelly maximizes the *geometric mean*, which converges to the median only asymptotically.
  *   **Correction:** Clarify that Kelly maximizes the *rate* at which the median grows, not necessarily the median wealth in finite time (though they are closely related). Don't let them conflate the statistic (median) with the objective (growth rate).

  **C. "Fractional Kelly is Mere Risk Aversion" (Minute 60–75)**
  *   **When:** Discussing practical application and why people bet less than full Kelly.
  *   **How to head it off:** Economists will want to say "Fractional Kelly implies a utility function more curved than log."
  *   **Correction:** Offer the **estimation risk** argument. If you overestimate your edge, full Kelly becomes over-betting, which reduces growth and increases ruin risk. Fractional Kelly is a buffer against model error, not necessarily a reflection of subjective risk aversion. This keeps the focus on the *dynamics* rather than *preferences*.

  **D. "This Requires Infinite Repetition" (Minute 75–80)**
  *   **When:** Addressing the "almost surely" claim.
  *   **How to head it off:** Philosophers love to attack limits. "Nothing happens in infinity."
  *   **Correction:** Emphasize that the growth rate advantage is not just an asymptotic property; it dominates the distribution for any finite $N$ large enough for the Law of Large Numbers to kick in. The "infinity" argument is a mathematical convenience, not a practical prerequisite.

  ### 4. What to Leave Out
  To keep the session focused on the ergodicity/utility distinction, excise the following:
  *   **Information Theory:** Do not mention Shannon or channel capacity. It creates a distracting analogy that suggests Kelly is only about communication, not finance.
  *   **Continuous Time/Calculus:** Stick to discrete rounds. Introducing Brownian motion or Merton's problem will bog down the probability intuition.
  *   **Transaction Costs/Market Impact:** These are practical frictions that muddy the theoretical distinction between ensemble and time averages.
  *   **Multi-Asset Correlation:** Keep it to a single coin. Portfolio Kelly introduces covariance matrices that distract from the core philosophical point.

  ### 5. The Final Question (The Litmus Test)
  To see if they truly distinguish the time-average argument from the ensemble-average one, pose this scenario in the last 10 minutes:

  > *"Imagine a game where you pay \$1 to play. A coin is flipped. Heads, you get \$1,000,000. Tails, you get \$0. The Expected Value is \$500,000. You can play this game once, or you can play a different game 1,000,000 times where you pay \$1 and get \$2 back with 100% certainty.*
  >
  > *Now, imagine a third game: You pay \$1. Heads (51%), your wealth is multiplied by 1.5. Tails (49%), your wealth is multiplied by 0.6. You must play this third game 1,000,000 times in a row with your current bankroll.*
  >
  > *Question: In the third game, the Expected Value of wealth after 1,000,000 rounds is astronomical. Yet, the probability you have more than \$1 left is near zero. **If you choose not to play the third game, are you displaying 'risk aversion' (a preference), or are you recognizing a 'category error' in the metric (a rational assessment of the process)?**"*

  **What to listen for:**
  *   **Ensemble Thinkers:** Will argue it depends on the agent's utility function. They will say, "If you are risk-neutral, you play."
  *   **Time-Average Thinkers:** Will argue that for a single agent in a multiplicative sequence, "risk-neutral" is undefined or incoherent because $E[W]$ does not represent an achievable outcome. They should identify that the metric itself is broken for the single trajectory, regardless of preference.

  ### Timing Summary
  *   **00–15:** Additive vs. Multiplicative Dynamics (Ergodicity setup).
  *   **15–45:** The 60/40 Coin Simulation (The $E[W]$ vs. Typical Path crisis).
  *   **45–60:** Deriving Kelly via Growth Rate (Addressing "Just Log Utility").
  *   **60–75:** Fractional Kelly & Estimation Error (Addressing "Risk Aversion").
  *   **75–80:** Finite vs. Infinite Horizons.
  *   **80–90:** Final Question & Discussion.
