prompt: |-
  I just spent the evening arguing with a friend about whether the Kelly criterion is anything more than expected utility maximization with a log utility function; he says the time-average argument is a red herring, and I say the real interest is that the Kelly bettor's wealth almost surely grows faster than any other strategy's while a more aggressive strategy has higher expected wealth. I have agreed to run the next session of our reading group, twelve people, mostly philosophers and economists who are comfortable with basic probability but have never studied Kelly betting, for ninety minutes. Don't give me the explanation itself; plan how I should explain it. What has to come first so that the difference between maximizing expected wealth and maximizing expected log wealth feels like a substantive distinction rather than a notational trick? What single betting scenario should carry the whole session, and why is a simple biased coin with even-money payoffs either the right carrying example or the wrong one? Which misconceptions should I expect—that Kelly is just log utility, that it maximizes the median, that fractional Kelly is merely risk aversion, that it needs infinite repetition—and at exactly what point in the sequence should I head each one off? What should I leave out at this level, and what question should I ask at the end to see whether they can distinguish the time-average argument from the ensemble-average one?
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Goal:** Plan a 90-minute reading group session on the Kelly Criterion.
      *   **Audience:** 12 people (philosophers and economists), comfortable with basic probability, new to Kelly.
      *   **Core Debate:** Is Kelly just Expected Utility (EU) maximization with log utility, or is the time-average/ergodicity argument substantive? (User sides with the latter/time-average growth rate argument).
      *   **Constraints:** Do *not* give the explanation itself. Plan *how* to explain it.
      *   **Key Questions to Answer:**
          *   What must come first to make the distinction substantive?
          *   Which single betting scenario to use (biased coin/even-money)?
          *   Which misconceptions to address and when?
          *   What to leave out?
          *   What final question to ask to test understanding of time-average vs. ensemble-average?

  2.  **Deconstruct the Core Tension:**
      *   *The Friend's View:* Kelly = Max $E[\log(W)]$. This is standard Expected Utility Theory (EUT). Nothing new, just a specific utility function.
      *   *The User's View:* Kelly = Maximize time-average growth rate ($G$). This is about ergodicity. In non-ergodic systems (multiplicative wealth), ensemble expectation ($E[W]$) diverges from time-average experience. Kelly maximizes what actually happens to *you* over time, not what happens to *parallel universes*.
      *   *The Challenge:* Make the audience feel that $E[W]$ (maximizing expected wealth) is actually *bad* or *irrational* in a repeated setting, without just saying "log utility is better." The "why" matters more than the "what."

  3.  **Step-by-Step Planning:**

      *   **Phase 1: Setting the Stage (The "What comes first" question)**
          *   If I start with utility functions, philosophers/economists will immediately categorize it as "normative decision theory" and miss the dynamical systems aspect.
          *   *Strategy:* Start with *wealth dynamics*, not preferences. Show, don't tell, that $E[W]$ leads to ruin in the long run.
          *   *Key Concept:* The difference between additive and multiplicative processes.

      *   **Phase 2: The Carrying Example (Biased Coin?)**
          *   *Option A:* Biased coin, even money (e.g., 60% win, 1:1 payout).
              *   *Pros:* Simple math. Kelly fraction is $2p-1 = 0.2$. Easy to calculate.
              *   *Cons:* "Even money" might obscure the compounding effect if not careful. People might think "I can just bet everything, I have the edge."
          *   *Option B:* Biased coin, uneven payout (e.g., 50% win, 2:1 payout).
              *   *Pros:* Highlights that edge isn't just probability.
          *   *Decision:* The prompt asks specifically about the "simple biased coin with even-money payoffs." Is it right or wrong?
              *   *Verdict:* It is the *right* choice for simplicity, *but* it needs a specific twist. If you bet 100% on a 60/40 coin, you eventually go broke. This is the "volatility drag" or "geometric vs. arithmetic mean" lesson. It's the cleanest way to show $E[W]$ vs. $E[\log W]$.
              *   *Why:* It isolates the *fraction* decision. If payouts vary, people get distracted by pricing. Keep payouts fixed (double or nothing), vary the fraction.

      *   **Phase 3: Addressing Misconceptions (Timing is key)**
          *   *Misconception 1: "Kelly is just Log Utility."*
              *   *When:* Early, but defer the resolution. Acknowledge the mathematical equivalence but frame it as "Why log?"
          *   *Misconception 2: "Kelly maximizes the median."*
              *   *When:* During the distribution visualization phase.
          *   *Misconception 3: "Fractional Kelly is risk aversion."*
              *   *When:* Towards the end, when discussing practical application. Frame it as "error buffering" or "time horizon," not just utility curvature.
          *   *Misconception 4: "Needs infinite repetition."*
              *   *When:* When discussing the "almost surely" claim. Clarify "long run" vs. "infinity."

      *   **Phase 4: What to Leave Out**
          *   Complex proofs (Law of Large Numbers details).
          *   Continuous time finance (Merton problem).
          *   Information theory connections (Shannon) - interesting but distracts from the ergodicity point.
          *   Specific asset allocation correlations (keep it single asset).

      *   **Phase 5: The Final Question**
          *   Needs to force a choice between ensemble (parallel worlds) and time (single trajectory).
          *   *Idea:* A scenario where $E[W]$ is huge but typical path is ruin.

  4.  **Drafting the Plan (Iterative Refinement):**

      *   *Introduction (15 mins):* Don't define Kelly. Define the problem. The "St. Petersburg Paradox" vibe but with repeated betting.
      *   *The Experiment (30 mins):* Use the 60/40 coin. Ask them: "How much do you bet?" Get answers. Show simulation results (visuals are key). Show the "Expected Wealth" curve going up vs. the "Typical Wealth" curve going down for full betting.
      *   *The Theory (30 mins):* Now introduce the math. Arithmetic vs. Geometric mean. Connect Log Utility to Geometric Mean. *Then* bring in the Ergodicity argument (Peters). This is where the User's argument shines.
      *   *Discussion/Conclusion (15 mins):* Misconceptions and the final test.

      *   *Refining the "Log Utility" point:* The user wants to defend the time-average argument. I need to make sure the plan doesn't just collapse into "Log Utility is good." The plan must emphasize that Log Utility is *derived* from the growth requirement, not *assumed* from risk preference. This is the crucial philosophical distinction.

      *   *Refining the Example:* A 60% win, even money bet is perfect. If you bet 100%, your wealth path is $W_t = W_0 \cdot 2^H \cdot 0^T$. One loss ruins you. Expected wealth is $W_0 \cdot (1.2)^t$. This creates the starkest contrast between $E[W]$ and typical outcome.

      *   *Refining Misconceptions:*
          *   "Kelly is Log Utility": Address this *after* showing the growth rate maximization. Frame it as: "Mathematically equivalent, philosophically distinct."
          *   "Median": Kelly maximizes the *geometric mean*, which converges to the median in log-normal distributions. Clarify this distinction.
          *   "Infinite Repetition": Emphasize that "almost surely" applies asymptotically, but the growth rate advantage is visible in finite (but large) $N$.

      *   *Refining the Final Question:* Needs to be a thought experiment. "Russian Roulette with a payoff." Or better: "Two investors, one maximizes $E[W]$, one maximizes $G$. Who retires richer?" (Too simple).
      *   *Better Final Question:* Present a choice between two strategies where one has higher $E[W]$ but lower median, and ask them to justify the choice *without* invoking "risk aversion" preferences, but rather "rationality of the single trajectory."

  5.  **Final Polish:** Check against constraints.
      *   90 minutes? Yes, break down timings.
      *   12 people? Suggest group work/discussion.
      *   Philosophers/Economists? Use precise language (ergodicity, ensemble, normative vs. descriptive).
      *   Don't give the explanation? Check. I am providing the *pedagogy*.

  6.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Wait, one nuance:* The prompt asks "What has to come first so that the difference... feels like a substantive distinction."
      *   *Answer:* You must establish the *non-ergodic* nature of the wealth process first. If wealth were additive, $E[W]$ would be fine. Because it's multiplicative, the order matters. Start with the *structure of the process*, not the *utility of the agent*.
      *   *Example:* Make sure to explicitly advise *against* starting with Utility Functions.

      *   *Final Question:* Needs to be sharp. "If you could choose to be one of 1000 parallel versions of yourself or the single you over 1000 rounds, which metric matters?" -> No, that's too leading.
      *   *Try:* "Under what conditions does maximizing expected wealth lead to certain ruin, and why does that make 'expected wealth' a defective metric for a single agent?"

      *(Self-Correction)*: Let's make the final question a specific numerical scenario that forces the distinction.

      *   *Re-evaluating the Coin:* Is 60/40 even money the *right* example? Yes, because the "bet everything" strategy has positive expected value but probability of ruin = 1. This kills the "Expected Value is King" argument immediately.

      *   *Misconception Timing:*
          *   "Just Log Utility": Address at the transition from simulation to theory.
          *   "Median": Address when discussing distribution shapes.
          *   "Risk Aversion": Address in the "Fractional Kelly" section.
          *   "Infinite": Address when discussing "Almost Surely."

      *   *Leave Out:* Information theory derivation, continuous time stochastic calculus, transaction costs.

      *   *Final Question:* "Imagine a game where $E[W]$ doubles every round, but the probability of having more than $1 at the end approaches zero. Is taking this game 'rational'? Why or why not?" (This forces them to articulate the time-average view).

