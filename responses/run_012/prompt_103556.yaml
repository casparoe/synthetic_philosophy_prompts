answer: |-
  **Dear Rational,**

  My husband votes in every election, down to the municipal water board. He is not naive. He can recite the odds of his ballot deciding an outcome something like the odds of being struck by lightning while holding a winning scratchcard. He knows that voting for others' sake doesn't change the math, because the probability remains too small to multiply away. Yet he goes, every time, spending hours he could spend earning or resting. I used to admire his civism. Now I just see a man unable to update his priors. It feels like watching someone pour water into a bucket with no bottom. Have I lost the right to respect him for this persistent error?

  **Dear Rational,**

  You are right to scrutinize the calculus. If we view voting strictly as an investment of time and resources against the probability of a decisive return, your husband is indeed burning capital. The expected utility is negative. However, human behavior is rarely governed by a single variable. To determine if his behavior is truly irrational, we must simply expand the equation until the balance sheet holds.

  First, consider voting as a consumption good. Does he enjoy the sticker? Does the act of waiting in line provide social signaling value comparable to a modest leisure activity? If the immediate experience yields positive utility, the long-term outcome becomes secondary. He is not buying a result; he is buying a ticket to the show.

  Second, we must address the altruism deficit. You note that voting for others fails because the probability of impact is too low. But if we scale the benefit of a favorable outcome by the total number of people affected, the potential utility grows massive. Even a tiny probability multiplied by the welfare of an entire city can theoretically outweigh the cost of gas. It is a long shot, but the pot is large enough to justify the bet.

  Third, consider minimax regret. We do not maximize gain; we minimize future pain. If he abstains and the measure fails by one vote, the psychological cost of knowing he could have changed history is catastrophic. By voting, he purchases insurance against future self-recrimination. The premium is high relative to the risk, but the payout covers the trauma of being the one who stayed home.

  Fourth, there is the margin argument. Even if his vote does not decide the election, it moves the margin. Political actors read margins. A shift of one vote contributes to the narrative of mandate or decline, which influences future policy. He is not buying the win; he is buying a fraction of a percentage point of leverage.

  Finally, we add the duty term. Many agents derive direct utility from fulfilling perceived obligations. If his internal reward structure credits him points for performing civic duty, then voting pays out regardless of the external result. He is paying himself to be the kind of person who votes.

  When you sum the consumption value, the scaled altruistic potential, the regret insurance, the marginal leverage, and the warm glow of duty, the total expected utility turns positive. It is a narrow margin, often hovering just above zero, but mathematically, it holds. He is not failing to update his priors; he is simply operating with a more complex utility function than you realized. You may restore your respect. He is not broken; he is just heavily parameterized.

  **Sincerely,**
  **The Columnist**
