answer: |-
  Here is an audit of the analogy your friend deployed. It is a sophisticated move, often called the "Universal Darwinism" or "Evolutionary Epistemology" defense. It is not trivial, but it is not decisive. To lose more precisely, you need to concede where the structural isomorphism is real, but insist that the *ontological status* of the two sides differs in a way that resurrects the falsifiability requirement.

  ### 1. The Explicit Correspondence

  Your friend's argument rests on a structural mapping between Popper's Three-World Epistemology (specifically the growth of knowledge) and Darwinian Natural Selection. Here is the mapping laid out bare.

  | Component | **Popperian Science (Growth of Knowledge)** | **Darwinian Biology (Natural Selection)** |
  | :--- | :--- | :--- |
  | **The Unit** | The Theory (Conjecture) | The Organism / Genotype (Variant) |
  | **Generation** | Creative Imagination / Insight | Mutation / Recombination |
  | **The Filter** | Critical Testing / Error Elimination | Environmental Pressure / Survival of Fittest |
  | **Elimination** | Refutation (Logical/Empirical) | Death / Sterility (Physical/Causal) |
  | **Retention** | Corroboration / Acceptance (Provisional) | Reproduction / Inheritance |
  | **The Context** | The Problem Situation (Anomaly) | The Niche / Ecosystem (Scarcity) |
  | **The Aim** | Verisimilitude (Truth-likeness) | Fitness (Reproductive Success) |
  | **The Agent** | The Scientist (Intentional) | The Organism (Non-intentional) |
  | **The Output** | New Problems / Deeper Theories | New Variants / Speciation |

  ### 2. Where the Mapping Breaks

  The analogy holds structurally (input → filter → output), but it fractures when you examine the *nature* of the relata. There are three critical breaks.

  **A. Normative vs. Descriptive (The Fatal Break)**
  *   **Science:** Popper's schema is *normative*. It prescribes how scientists *ought* to behave to grow knowledge. It is a methodology.
  *   **Biology:** Darwin's schema is *descriptive*. It claims this is how life *actually* behaves.
  *   **The Break:** You cannot falsify a recommendation (you can only reject it as unhelpful), but you can falsify a description of reality. If Darwinism is a claim about how the world works, it must be vulnerable to the world. If it is merely a recommendation for how to do biology, it is not science. Your friend wants it to be a methodology to save it from falsification, but biology claims to be a factual account of history.

  **B. Intentionality of Variation**
  *   **Science:** Conjectures are often *directed* at the problem. A scientist sees an anomaly and crafts a theory specifically to resolve it.
  *   **Biology:** Mutations are (in the standard synthesis) *blind* to the need. The variation does not arise *because* of the problem.
  *   **The Break:** This matters for testability. In science, if a theory fails, we learn something about the *reasoning*. In evolution, if an organism dies, we learn nothing about the *generation* mechanism, only the filter. This makes the biological side harder to test in isolation because the "conjecture" mechanism is opaque.

  **C. The Status of "Truth" vs. "Survival"**
  *   **Science:** The goal is Truth (or verisimilitude). A theory can be "false" but highly corroborated.
  *   **Biology:** The goal is Survival. A trait can be "false" (maladaptive in the long run) but currently retained.
  *   **The Break:** In science, refutation is informative; it tells us *why* the theory failed. In biology, elimination is terminal; it tells us only *that* it failed. This makes the biological schema more like a black box.

  ### 3. Does the Analogy Support Your Friend's Conclusion?

  Your friend concludes that because Darwinism is a "schema" (like logic or methodology), demanding falsifiability is a category mistake. **The analogy, taken seriously, supports the opposite.**

  Here is why:
  1.  **If the analogy holds:** Darwinism is to Biology what Scientific Method is to Science.
  2.  **The Implication:** The Scientific Method is not a "theory" about the world; it is a rule for investigating the world. If Darwinism is merely the rule (Variation + Selection), it is indeed hard to falsify *in the abstract*.
  3.  **The Trap:** However, biology does not just propose the rule; it proposes that **this rule explains the specific history of life.**
  4.  **The Verdict:** The abstract schema (V-S-R) is indeed nearly tautological ("survivors survive"). But *Darwinism* is the claim that **this schema is the primary driver of biological complexity.** That specific claim *is* falsifiable.
      *   *Falsification Condition:* If we found complex adaptations that could not be built by small steps (e.g., irreducible complexity that defies genetic mapping), or if we found inheritance mechanisms that bypassed selection (e.g., strong Lamarckian directed mutation), the Darwinian *application* of the schema would be falsified.

  **Conclusion on the Argument:** Your friend is right that the *abstract formula* is hard to falsify. He is wrong that this protects *Darwinism* from demarcation. A schema that is compatible with every outcome confers no testability on the specific claims built upon it. If Darwinism is *only* the schema, it is metaphysics. If it is a scientific theory, it must make risky predictions about *which* variations are retained and *why*. The analogy shows that the schema itself is empty; it is the **specific models** (e.g., "feathers evolved for insulation, then flight") that carry the empirical weight.

  Therefore, the demarcation worry does not dissolve; it shifts. It shifts from "Is Natural Selection true?" (which is tautological) to "Is Natural Selection sufficient to explain X?" (which is testable).

  ### 4. The Specific Disanalogies You Suspected

  You mentioned three specific doubts. Here is their weight:

  *   **"Variation in science is conjectural and directed... variation under selection is blind."**
      *   **Weight:** **Heavy.** This breaks the epistemic parallel. In science, we can audit the *source* of the conjecture (the scientist's reasoning). In evolution, the source of variation is stochastic. This means we cannot test the "conjecture" phase of evolution, only the "refutation" phase. This makes evolutionary biology more historical and less experimental than physics, but it does not make it unfalsifiable. It just means the falsification comes from the fossil record or genetics, not the lab bench.
  *   **"Refutation in science is informative and non-lethal whereas the elimination of a variant is neither."**
      *   **Weight:** **Medium.** This matters for the *progress* of the field, not its status as science. Science accumulates knowledge from errors; evolution just accumulates survivors. This suggests evolutionary biology is more like history than physics. History is testable (via evidence), but not via laboratory replication. This supports a softer view of falsifiability (inference to the best explanation) rather than the friend's "category mistake" view.
  *   **"The schema is silent about what the selection is for."**
      *   **Weight:** **Critical.** This is the core of the tautology charge. If the schema doesn't specify the *criterion* of selection, it explains nothing. To be scientific, one must specify the selective pressure (e.g., "camouflage against predators"). *That* specific claim is falsifiable. The friend's argument tries to protect the *schema* from this, but science tests the *application*, not the schema.

  ### 5. Popper's Actual View (Settled vs. Contested)

  You asked to separate settled text from contested interpretation.

  *   **Settled:** Popper *did* call Darwinism a "metaphysical research programme" in the 1970s (specifically in *Unended Quest* and a 1978 lecture). He *did* worry about the tautology of "fitness."
  *   **Settled:** Popper *did* later recant the strong version of this. In 1978, he stated that the theory of natural selection *is* testable, provided it is formulated carefully (e.g., distinguishing it from drift or Lamarckism).
  *   **Contested:** Whether Popper changed his mind because he was convinced by biologists, or whether he was simply clarifying that *applications* are testable while the *principle* remains metaphysical.
  *   **Contested:** Whether Popper's initial criticism was a genuine philosophical objection or a rhetorical device to provoke biologists to be more rigorous.
  *   **Consensus among Philosophers:** The modern consensus is closer to your friend's structural view (it is a framework) but rejects his conclusion (therefore it is not science). The consensus is that it is a **framework theory** (like Newtonian Mechanics) which is not tested in isolation, but only through specific models. Framework theories are scientific *if* they generate testable models.

  ### 6. A Better Analogy and Cleaner Statement

  Your friend's analogy (Darwinism = Logic/Modus Ponens) is too strong because Logic is analytic and Darwinism is synthetic. A better analogy is **Rational Choice Theory in Economics.**

  *   **The Schema:** Agents act to maximize utility given constraints.
  *   **The Charge:** "This is unfalsifiable. Whatever they did, they must have wanted it." (Exactly the tautology charge against Darwinism).
  *   **The Defense:** The schema itself is a framework. It becomes scientific when we specify the *Utility Function* and the *Constraints*.
  *   **The Test:** If we posit that consumers maximize money, and they act against their financial interest, the *specific model* is falsified. If they keep doing it, we might adjust the utility function (they value leisure over money). If we have to adjust the utility function to fit *every* outcome, the theory becomes ad hoc and loses power.

  **The Cleaner Statement for Your Argument:**
  "Darwinism is not a first-order hypothesis like 'All swans are white.' It is a **mechanism**. Mechanisms are not falsified in the abstract; they are validated by their explanatory power in specific cases. The charge of unfalsifiability applies only if one insists on treating the *mechanism itself* as a universal law immune to counter-evidence. Popper's worry was that biologists were using the mechanism as a shield against counter-evidence. His later concession was that when biologists specify the selective pressure and the genetic pathway, they are making falsifiable claims. Your friend is right that the *schema* is hard to kill, but wrong that this makes the *science* immune. The science lives or dies on the specific models, not the abstract schema."

  ### 7. How to Concede and Hold Ground

  To lose more precisely, concede the following:
  1.  **Concede:** The abstract principle of Natural Selection (Variation + Differential Survival) is nearly tautological and hard to falsify in isolation.
  2.  **Concede:** Popper did initially classify it as metaphysical, and the structural analogy to his epistemology is valid.

  Hold firm on the following:
  1.  **Hold:** A tautological schema does not make the science built upon it unfalsifiable. The testability lies in the **specific historical reconstructions** and **genetic mechanisms**, not the abstract principle.
  2.  **Hold:** The analogy to Logic fails because Biology makes synthetic claims about the history of the earth, which could have been otherwise. Logic could not.
  3.  **Hold:** Popper's recantation wasn't that the schema became falsifiable, but that **Darwinism as practiced** involves falsifiable claims about adaptation and inheritance.

  **The precise loss:** You lost on the point that Popper called it metaphysical. You win on the point that this does not disqualify it as science, provided the "metaphysical programme" generates testable "theories." Your friend conflates the **research programme** (which is rarely falsified directly) with the **theories within it** (which must be). Lakatos (a student of Popper) made this distinction explicit: research programmes have a "hard core" (protected from falsification) and a "protective belt" (which takes the hits). Darwinism's hard core is the schema; its protective belt is the specific evolutionary history. The friend is defending the hard core; you are defending the scientific status of the belt. Both are necessary, but only the belt makes it science.
