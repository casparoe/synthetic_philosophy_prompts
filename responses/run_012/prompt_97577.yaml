answer: |-
  ### I. Correspondence Table

  Your friend's argument rests on a structural isomorphism between the two decision matrices. Below is the mapping he proposes, alongside the actual structural features of each problem.

  | Component | St. Petersburg Game (SPG) | Pascal's Wager (PW) | Status of Correspondence |
  | :--- | :--- | :--- | :--- |
  | **Entry Fee** | Finite cash stake to enter the game. | Finite opportunity cost (time, piety, foregone sins). | **Match:** Both involve a finite cost for a chance at a greater reward. |
  | **Payoff Structure** | $2^n$ dollars (grows indefinitely). | Infinite Utility (Heaven/Salvation). | **Mismatch:** SPG payoff is *unbounded finite*; PW payoff is *intrinsically infinite*. |
  | **Probability** | $1/2^n$ (shrinks as payoff grows). | $p$ (fixed, non-zero, however small). | **Mismatch:** SPG probability is a variable in a series; PW probability is a static coefficient. |
  | **Bankroll** | Finite (Casino cannot cover large $n$). | Infinite (God is omnipotent). | **Mismatch:** SPG assumes a mortal payer; PW assumes an omnipotent payer. |
  | **Decision Rule** | Maximize Expected Monetary Value (EMV). | Maximize Expected Utility (EU). | **Partial Match:** Both invoke expectation maximization, but PW explicitly deals in utility, not currency. |
  | **Source of Infinity** | Divergent Series ($\sum 1 + 1 + 1...$). | Infinite Term ($p \times \infty$). | **Mismatch:** SPG infinity is cumulative; PW infinity is immediate. |

  ### II. Where the Mapping Breaks

  The analogy fails not in the *conclusion* (that infinite expectation is suspicious) but in the *mechanism* generating that suspicion. There are three substantive disanalogies that prevent the St. Petersburg "fixes" from transferring one-for-one to Pascal's Wager.

  **1. The Source of the Infinity (Series vs. Term)**
  In the St. Petersburg Game, the expected value is infinite because the *sum* of finite terms diverges. No single outcome yields infinite money; the infinity is an artifact of aggregating an infinite number of possibilities. In Pascal's Wager, the infinity resides in a *single term* (the utility of Salvation).
  *   **Why it matters:** Mathematical resolutions for divergent series (like summation methods or truncation) apply to SPG but are category errors when applied to PW. You cannot "truncate" the Wager without denying the theological premise of eternal life.

  **2. The Probability-Payoff Coupling**
  Your friend claims both wagers "multiply an ever more extravagant payoff by an ever smaller probability." This is true for St. Petersburg but **false for Pascal**.
  *   **SPG:** As the payoff doubles, the probability halves. The tension between risk and reward is dynamic.
  *   **PW:** The payoff is fixed at infinity. The probability is fixed at $p$. There is no trade-off curve.
  *   **Why it matters:** In SPG, one can argue that for large $n$, the probability is physically impossible (fewer atoms than required to represent the money). In PW, the probability $p$ need not be small; even if $p = 10^{-100}$, multiplied by $\infty$, the result is $\infty$. The "vanishing probability" defense works for SPG but requires a specific argument (e.g., "God's existence is effectively impossible") to work for PW.

  **3. The Bankroll Constraint**
  *   **SPG:** The paradox dissolves if we acknowledge no casino has infinite capital. The expectation becomes finite once the bankroll cap is applied.
  *   **PW:** The "casino" is God. By definition, an omnipotent being has infinite capital.
  *   **Why it matters:** To apply this fix to Pascal, your friend must argue that God *cannot* pay the prize (i.e., God does not exist or is not omnipotent). This shifts the argument from decision theory to theology, which is not what the St. Petersburg analogy is supposed to do.

  ### III. The Utility Function Audit

  You asked specifically whether a **concave but unbounded** utility function (like $U(x) = \ln(x)$) disposes of both problems. This is the critical test of your friend's claim.

  **1. St. Petersburg Game**
  *   **Result:** **Solved.**
  *   **Reasoning:** If we value money via logarithmic utility, the expected utility becomes $\sum \frac{1}{2^n} \ln(2^n)$. This series converges to a finite number. A rational agent with log-utility will only pay a small finite fee to play.
  *   **Implication:** The infinite *monetary* expectation was indeed a mathematical artifact of using linear utility for money.

  **2. Pascal's Wager**
  *   **Result:** **Not Solved.**
  *   **Reasoning:** In the Wager, the payoff is not finite money that we evaluate with a function; the payoff is *already defined* as infinite utility. Even if you apply a concave function, $U(\infty) = \infty$. A logarithmic curve still goes to infinity; it just gets there slower. As long as the utility of Salvation is unbounded, the Expected Utility remains infinite.
  *   **Implication:** To solve Pascal's Wager using utility theory, you do not need a *concave* function; you need a **bounded** utility function (e.g., $U(x) = 1 - 1/x$). You must argue that there is a maximum possible utility a human can experience, and Salvation does not exceed it.

  **What this reveals about your friend's premise:**
  Your friend wants to lean on the premise that *"Infinite expectations are always decision-theoretic artifacts."* The utility audit shows this premise is false.
  *   In SPG, the infinity is an artifact of the *math* (divergent series + linear utility).
  *   In PW, the infinity is an artifact of the *axiology* (the claim that Salvation has infinite value).

  For your friend's conclusion to hold, he cannot simply point to St. Petersburg. He must argue specifically for **Bounded Utility**. He must claim that no state of affairs, not even eternal bliss, can possess infinite utility for a finite mind. This is a philosophical claim about value, not a mathematical claim about probability distributions.

  ### IV. Verdict on the Analogy

  **Does the conclusion survive?**
  **No.** The conclusion that "Pascal's Wager is no more rationally compelling than St. Petersburg" does not follow from the analogy because the *reasons* for rejecting St. Petersburg do not apply to Pascal.

  *   Rejecting SPG is usually about **physical impossibility** (no infinite bankroll) or **diminishing marginal utility of money**.
  *   Rejecting PW requires **theological skepticism** (God can't pay) or **axiological boundedness** (Heaven isn't worth $\infty$).

  Your friend has identified a shared symptom (infinite expectation) but misdiagnosed the shared cause. He treats Pascal's Wager as if it were a series of escalating rewards with diminishing probabilities, which it is not. It is a single-shot gamble with a fixed probability and an infinite prize.

  **The "Decorative" vs. "Substantive" Disanalogies:**
  *   **Decorative:** The presence of an entry fee; the use of expectation maximization. These look similar but don't drive the logic.
  *   **Substantive:** The source of the infinity (series vs. term) and the nature of the payer (mortal vs. divine). These break the transfer of the "standard fixes."

  ### V. A Better Analogy

  If your friend wants to argue that Pascal's Wager yields a spurious or unusable expectation, the St. Petersburg Game is the wrong tool. A better analogy is **The Many Gods Objection** (often attributed to Diderot).

  **The Analogy:**
  Imagine a decision matrix where you must choose between Wagering for God A, God B, or God C.
  *   God A rewards believers with $\infty$ and punishes non-believers with $-\infty$.
  *   God B rewards believers with $\infty$ and punishes non-believers with $-\infty$.
  *   God C is a trickster who punishes believers with $-\infty$ and rewards non-believers with $\infty$.

  **Why this works better:**
  1.  **Undefined Expectation:** Just as St. Petersburg creates a divergent sum that fails to guide action, the Many Gods scenario creates competing infinite expectations that cancel out or become undefined ($\infty - \infty$).
  2.  **Transferable Fix:** The resolution to Many Gods is not "utility is bounded" (though that helps), but rather that **probability assignments matter**. If you cannot assign a higher probability to God A than God B, the decision is rationally undecidable.
  3.  **Captures the Intuition:** This captures your friend's intuition—that the Wager is "too good to be true" or "mathematically suspicious"—without relying on the false mechanical analogy of the St. Petersburg series.

  **Summary for your dinner party:**
  Tell your friend he is right to be suspicious of infinite expectations, but wrong about *why*. St. Petersburg is a paradox of **aggregation** (summing finite things); Pascal is a paradox of **valuation** (pricing the infinite). To defeat Pascal, he must argue that infinite utility is impossible (bounded utility), not that infinite expectation is mathematically suspect (St. Petersburg). The former is a claim about theology and ethics; the latter is a claim about statistics. Conflating them makes his argument look clever but leaves it logically hollow.
