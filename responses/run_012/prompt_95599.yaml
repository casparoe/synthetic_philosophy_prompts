prompt: |-
  ok so in my ethics class we did a unit on AI and my teacher said something thats been bugging me for a week. She said if you build an AI and tell it "do this task, but dont cause any side effects," the instruction sounds super clear but is actually kind of empty, because "side effect" just means "an effect that wasn't wanted," and the whole point of the instruction was that the AI is supposed to figure out what's wanted on its own. She also said it gets worse if you ask how the AI would even know what "would have happened otherwise," since that baseline depends on whose actions you count as part of the situation in the first place.

  Then she told us to go find an example of this conceptual issue ourselves instead of her just explaining it. So, give me an example. I want an actual situation (not the paperclip thing, everyone does the paperclip thing) where an AI gets some task plus a "no side effects" rule, the rule looks totally followable, but it turns out the AI literally can't follow it without already having a full theory of what's valuable — and then walk me through exactly where it breaks down. Is "side effect" undefined, or circular, or is the real problem that there's no fact of the matter about the baseline? And does the problem go away if you just tell the AI to ask a human first, or is that a cop out?

  Please write it in American English. Also I'm a high school student, so if you use any technical terms, define them.
