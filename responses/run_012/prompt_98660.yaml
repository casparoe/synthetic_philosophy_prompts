prompt: |-
  I run the democratic innovations desk at a national parliament — we design and run citizens assemblies, three or four a year, and my boss wants me to turn the sortition side of it into a procedure the whole office can run without me in the room. So please write me one: a decision procedure for designing how an assembly is selected and what it's allowed to decide, grounded in what sortition is actually supposed to justify rather than what looks tidy on a slide. Questions in order, what counts as a good enough answer to each, where the procedure stops with a hard no (this one can't be done by lot), and where it hands the question to the minister because it's a values call and not a design call.

  Real constraints: six weeks per assembly, fixed budget, no power to compel anyone to show up, the minister signs off on the final design, and we will absolutely get judicially reviewed by someone arguing the sample wasn't fair. So it has to be reusable and a junior has to be able to run it.

  Stuff it has to actually resolve, because this is where we keep coming unstuck:

  - stratify or plain lot? our mandate literally says both selected by lot and representative of the country, and I've never been able to explain to my colleagues why the lot's warrant is that everyone had an equal chance rather than that the sample looks like a mirror of the population — and why those two come apart the moment you start topping up refusers. I can't seperate them in my head and I need the procedure to make the distinction operational, not just assert it.
  - the office's current draft draws from a civic register of people who've already signed up to be interested in this sort of thing. I think that quietly guts the whole thing but I can't say why in one sentence. Have the procedure say it in one sentence, or tell me I'm wrong.
  - refusals, dropouts, people we can't reach, and the replacement rule.
  - how big it has to be before the representation argument is doing any work at all.
  - who's in the pool — voters, citizens, residents, adults — and what to do when the people affected by the topic aren't all in the pool.
  - and the boundary: which design choices are ours, and which have to be handed to the assembly once it's seated, on pain of the whole thing just being an expensive focus group.

  Then run it on three cases: (a) a 150-person national assembly on assisted dying, (b) a 40-person borough assembly on a congestion charge where a lot of the drivers don't live in the borough, and (c) the minister's pet project — a permanent randomly selected chamber that sets its own agenda, ie proper lottocracy rather than a one-off. If the procedure kills one of those, say so plainly; I'd rather find out from you than from a select committee. And tell me which steps are just my value judgements dressed up as method, and what the procedure simply can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Runs the democratic innovations desk at a national parliament. Designs/runs citizens' assemblies (3-4/year).
      *   **Goal:** Create a decision procedure for the *sortition* (selection) and *mandate* (what it decides) side of citizens' assemblies.
      *   **Audience:** Junior staff in the office (needs to be runnable without the user).
      *   **Constraints:** 6 weeks per assembly, fixed budget, no compulsion power, ministerial sign-off, high risk of judicial review (fairness challenge).
      *   **Core Philosophical Tension:** The user is struggling with the theoretical justification of sortition (equal chance vs. descriptive representation) and needs the procedure to make this operational, not just theoretical.
      *   **Specific Pain Points to Resolve:**
          *   Stratification vs. Plain Lot (Equal Chance vs. Mirror).
          *   Civic Register (Self-selection bias).
          *   Refusals/Replacements.
          *   Sample Size (When does representation work?).
          *   Pool Definition (Voters vs. Residents vs. Affected).
          *   Boundary (Design choices vs. Assembly decisions).
      *   **Test Cases:**
          *   (a) 150-person national assembly on assisted dying.
          *   (b) 40-person borough assembly on congestion charge (non-resident drivers).
          *   (c) Permanent randomly selected chamber (lottocracy).
      *   **Requirement:** Identify where the procedure kills a project, where it hands off to the minister (values call), and where the user's own biases might be creeping in.

  2.  **Deconstruct the Philosophical Core (Sortition Justification):**

      *   *The User's Confusion:* "Why the lot's warrant is that everyone had an equal chance rather than that the sample looks like a mirror of the population."
      *   *The Theory:* Sortition relies on *political equality* (ex-ante equality of opportunity to serve). Descriptive representation (ex-post mirror) is a *consequence* of large enough random sampling, not the primary mechanism of legitimacy. If you stratify too heavily to force a mirror, you break the random probability that justifies the claim that "anyone could have been chosen."
      *   *The Operational Fix:* The procedure must prioritize *random selection from a defined population* first. Stratification is only permissible to correct for *systematic exclusion* in the sampling frame, not to engineer demographic outcomes.
      *   *The Civic Register Issue:* If you draw from people who signed up, it's no longer a lot among equals; it's a lot among volunteers. This turns it into a stakeholder forum, not a citizens' assembly.
      *   *The Replacement Rule:* Replacing refusals with new random draws preserves the probability. Replacing with demographics (topping up) breaks the probability.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Structure:* Needs to be a flowchart-like logic, step-by-step.
      *   *Tone:* Bureaucratic but philosophically rigorous. Clear "Stop" and "Escalate" points.
      *   *Step 1: The Pool.* Define who is eligible.
      *   *Step 2: The Draw.* Random vs. Stratified.
      *   *Step 3: The Attrition.* Handling refusals.
      *   *Step 4: The Mandate.* What can they decide?
      *   *Step 5: The Ministerial Handoff.* Where values override method.

      *   *Refining the "Equal Chance vs. Mirror" distinction:*
          *   *Rule:* Use simple random sampling (SRS) unless a specific group is systematically excluded by the sampling method (e.g., no internet access for online recruitment).
          *   *Justification:* Legitimacy comes from the *process* (unbiased chance), not the *outcome* (demographic match).
          *   *Threshold:* If the sample size is too small for SRS to likely yield a mirror (e.g., <100 for national), you must acknowledge the limitation or increase size. You cannot force the mirror via quotas without admitting it's no longer pure sortition.

      *   *Refining the Civic Register:*
          *   *Sentence:* "A civic register of volunteers converts a random sample of citizens into a random sample of activists, destroying the claim to political equality."

      *   *Refining the Boundary:*
          *   *Rule:* The office designs the *question* and the *pool*. The assembly decides the *answer* within the *consequences* defined by parliament.

  4.  **Developing the Test Cases:**

      *   *(a) Assisted Dying (National, 150 people):*
          *   Pool: All adult residents? Voters? (Likely residents).
          *   Size: 150 is usually enough for SRS to approximate demographics on key variables.
          *   Mandate: High stakes. Minister needs to define if it's binding or advisory.
          *   Verdict: Passes, provided the pool is defined correctly (residents vs voters).
      *   *(b) Congestion Charge (Borough, 40 people, non-resident drivers):*
          *   Pool Problem: The people affected (drivers) are not in the pool (residents).
          *   Sortition Logic: Sortition represents the *demos* (those subject to the law). If the law affects non-members, sortition of members is illegitimate for that specific impact.
          *   Verdict: **FAIL** or **MAJOR ESCALATION**. You cannot use a residents' assembly to decide on a tax affecting non-residents without a mechanism to include them. This is a boundary failure.
      *   *(c) Permanent Lottocracy:*
          *   Constraint: "Minister signs off." "6 weeks."
          *   Issue: This changes the constitution. It's not an "assembly"; it's a chamber.
          *   Verdict: **HARD NO**. This is constitutional reform, not democratic innovation design. It exceeds the office's mandate and the "one-off" logic of sortition (which relies on rotation, not permanent power).

  5.  **Addressing the "Value Judgements vs. Method" Request:**

      *   I need to be honest about where *my* (the AI's) or the *user's* philosophy is driving the rule.
      *   *Example:* The insistence on "Equal Chance" over "Mirror" is a philosophical stance (Aristotelian vs. Pitkin). I need to flag that.
      *   *Example:* The refusal to use a civic register is methodological but relies on a specific definition of legitimacy.

  6.  **Final Review against Constraints:**

      *   *6 Weeks:* The procedure needs to be fast. Complex stratification takes time. SRS is faster.
      *   *Judicial Review:* The paper trail must show unbiased selection.
      *   *Junior Staff:* Needs clear "If X, then Y" logic.

  7.  **Writing the Output:** (Drafting the response with the specified sections: The Procedure, The Test Cases, The Meta-Commentary). *Self-Correction during drafting:* Make sure the distinction between "Ministerial Value Call" and "Procedural Hard No" is sharp. The Minister can override values, but they cannot override math (sample size) without breaking the claim.

      *   *Key Insight on Stratification:* The procedure should define stratification as a *corrective for sampling frame error*, not a *target for demographic engineering*.
      *   *Key Insight on Replacements:* Replacements must come from the *original lottery pool*, not a new draw, to maintain the probability distribution of that specific cohort. (Actually, standard practice is often a waitlist from the original draw. I need to be precise here. If A refuses, B (next on list) goes. If B refuses, C. This preserves the random order).
      *   *Key Insight on Case B:* This is the trickiest. A borough assembly deciding on congestion charge affects outsiders. This violates the "all affected principle" which sortition tries to embody. I need to flag this as a legitimacy failure.

  8.  **Final Polish:** Ensure the tone is professional, direct, and respects the user's expertise while providing the structural rigidity they asked for. (Proceed to generate output).

  *(Self-Correction on the Civic Register sentence)*: The user asked for *one sentence*. "Drawing from a volunteer register selects for preference intensity rather than political equality, converting a public body into a stakeholder group."

  *(Self-Correction on Case C)*: A permanent chamber is fundamentally different from an assembly. Assemblies are advisory/consultative usually. A chamber implies legislative power. This is a constitutional change. Hard No.

  *(Self-Correction on Stratification)*: I need to make sure the junior staff knows *when* to stratify. Only when the sampling frame is known to be biased (e.g., phone lists miss young people). Not to ensure 51% women if the random draw yields 48%.

  Let's assemble the document.cw
answer: |-
  This is a **Sortition Design Protocol (SDP)**. It is written for a Grade 7 officer to execute without philosophical training. It prioritizes *procedural legitimacy* (the fairness of the draw) over *descriptive legitimacy* (the look of the room), because the former survives judicial review and the latter does not.

  ### PART 1: THE DECISION PROCEDURE

  **Instruction to Officer:** Complete this checklist before drafting the Invitation to Tender for recruitment. If you hit a **STOP**, the project cannot proceed as a Citizens' Assembly. If you hit **ESCALATE**, the Minister must sign a specific waiver.

  #### STEP 1: DEFINE THE POOL (The *Demos*)
  **Question:** Who is subject to the consequences of the decision this assembly will discuss?
  *   **Good Enough Answer:** "All adult residents within jurisdiction X" OR "All registered voters within jurisdiction X."
  *   **Hard No:** "People who have expressed interest," "Stakeholders," or "Customers."
  *   **Escalate:** If the people affected by the topic (e.g., commuters) do not match the people in the pool (e.g., residents). *See Case B.*
  *   **Rule:** The pool must be the *Demos* (those ruled), not the *Voluntas* (those interested).

  #### STEP 2: THE SAMPLING FRAME (The List)
  **Question:** From what list are we drawing names?
  *   **Good Enough Answer:** A complete administrative register (Electoral Roll, Population Register, Tax File) held by the state.
  *   **Hard No:** A civic register of volunteers, a customer database, or a social media scrape.
      *   *The One Sentence Justification:* **"Drawing from a volunteer register selects for preference intensity rather than political equality, converting a public body into a stakeholder group."**
  *   **Escalate:** If the administrative register is known to exclude >5% of the *Demos* defined in Step 1 (e.g., using Voter Roll for a Residents' Assembly).

  #### STEP 3: THE DRAW METHOD (Chance vs. Mirror)
  **Question:** Are we using Simple Random Sampling (SRS) or Stratified Sampling?
  *   **Default:** Simple Random Sampling (Plain Lot).
  *   **Justification:** Legitimacy derives from the *ex-ante equality of opportunity* (everyone had the same chance), not the *ex-post demographic match*. If the room does not look like the country, but the draw was truly random, the claim to representation holds. If you force the room to look like the country, you break the random chance, and the claim collapses.
  *   **Permitted Stratification:** Only allowed to correct for *sampling frame bias* (e.g., if using phone numbers, stratify by region to ensure rural coverage because rural people are less likely to have listed numbers).
  *   **Forbidden Stratification:** Do not stratify to hit demographic targets (e.g., "50% women") unless the *Demos* is legally defined that way.
  *   **Escalate:** If the Minister demands a specific demographic quota that contradicts the random distribution. *Note: This turns the body into a commissioned focus group.*

  #### STEP 4: SAMPLE SIZE (The Law of Large Numbers)
  **Question:** Is the assembly large enough for SRS to yield descriptive representation naturally?
  *   **Threshold:**
      *   National: Minimum 100 seated members.
      *   Regional/Local: Minimum 40 seated members.
  *   **Hard No:** Any assembly under 30 seated members claiming to be "representative." (Statistically, the margin of error makes the representation claim indefensible in court).
  *   **Escalate:** If budget constraints prevent meeting the threshold. *Option: Redefine as a "Dialogue Panel" not an "Assembly."*

  #### STEP 5: ATTRITION & REPLACEMENT (The Integrity of the Lot)
  **Question:** How do we handle refusals and dropouts?
  *   **Rule:** Invitations are sent in random order from the master list.
  *   **Process:**
      1.  Invite Batch 1 (randomly selected).
      2.  If Batch 1 refuses, invite Batch 2 (the next random names on the *same* list).
      3.  Do **not** top-up based on demographics (e.g., "We need a young man, find a young man").
  *   **Justification:** Replacing a refuser with a demographic match breaks the probability distribution. Replacing a refuser with the next person on the random list preserves it.
  *   **Hard No:** "Open recruitment" to fill seats after the lottery.

  #### STEP 6: THE MANDATE BOUNDARY (Design vs. Decision)
  **Question:** Who decides the question and who decides the answer?
  *   **Office Design:** We set the *Question* (e.g., "How should the law change?") and the *Constraints* (e.g., "Within current budget").
  *   **Assembly Decision:** They set the *Recommendations*.
  *   **Hard No:** Pre-determining the options (e.g., "Choose A, B, or C"). This makes it a referendum, not an assembly.
  *   **Escalate:** If the Minister wants to veto specific recommendations *before* the assembly meets. *This must be published as a 'Constraint' in Step 6, not a hidden veto.*

  ---

  ### PART 2: RUNNING THE TEST CASES

  Here is the protocol applied to your three scenarios.

  #### CASE A: 150-Person National Assembly on Assisted Dying
  *   **Step 1 (Pool):** Adult Residents. (Pass. Affected = Residents).
  *   **Step 2 (Frame):** Electoral Roll or Population Register. (Pass).
  *   **Step 3 (Draw):** SRS. 150 is large enough that SRS will likely yield a near-mirror without forced stratification. (Pass).
  *   **Step 4 (Size):** 150 > 100 threshold. (Pass).
  *   **Step 5 (Attrition):** Standard random replacement. (Pass).
  *   **Step 6 (Mandate):** High ethical stakes. Minister must define if recommendations are binding or advisory.
  *   **VERDICT:** **PROCEED.**
      *   *Risk:* High public emotion. Ensure Step 6 constraints are clear (e.g., "Must comply with Human Rights Act").
      *   *Note:* Do not stratify for religion. Let the lot fall where it may.

  #### CASE B: 40-Person Borough Assembly on Congestion Charge (Non-resident drivers affected)
  *   **Step 1 (Pool):** Borough Residents.
  *   **Step 1 Check:** Who is affected? Residents + Commuters.
  *   **FAIL CONDITION:** The *Demos* (affected) does not match the Pool (residents). A residents' assembly cannot legitimately impose costs on non-residents via sortition, because the non-residents had zero chance of selection.
  *   **VERDICT:** **HARD NO (as currently designed).**
      *   *Fix:* You must expand the pool to include non-resident commuters (requires data sharing with DVLA/transport auth) OR acknowledge this is not a Citizens' Assembly but a "Resident Consultation" and drop the claim to represent the affected public.
      *   *Judicial Review Risk:* Extreme. A commuter sued the council for taxation without representation. Sortition does not cure this if the lot excludes the taxed.

  #### CASE C: Permanent Randomly Selected Chamber (Lottocracy)
  *   **Step 1 (Pool):** Citizens.
  *   **Step 4 (Size):** Permanent body implies small size (cost/feasibility). Likely <100.
  *   **Step 6 (Mandate):** "Sets its own agenda."
  *   **FAIL CONDITION:** This is not an assembly; it is a constitutional restructure. Sortition assemblies derive legitimacy from being *temporary* and *advisory* (or specific mandate). A permanent chamber with agenda-setting power competes with the elected legislature.
  *   **VERDICT:** **HARD NO.**
      *   *Reason:* This exceeds the office's mandate. We design *innovations*, not *constitutions*. This requires primary legislation to abolish or amend the current parliamentary structure.
      *   *Procedure Stop:* Step 6. You cannot design a mandate for a body that defines its own mandate. That is sovereignty, not design.

  ---

  ### PART 3: META-COMMENTARY (Where the Bodies are Buried)

  You asked me to identify where your values are dressed up as method, and what the procedure can't do.

  **1. The "Equal Chance" vs. "Mirror" Value Judgement**
  *   **The Bias:** I have hard-coded the protocol to prefer *Equal Chance* (Sortition Logic) over *Mirror* (Representation Logic).
  *   **Why:** Because "Mirror" requires quotas, and quotas require you to reject random people based on demographics, which destroys the "lot" justification.
  *   **The Cost:** You will end up with assemblies that look slightly off (e.g., 45% women instead of 51%).
  *   **The Defense:** In court, you argue "Procedural Fairness." If you argue "Descriptive Accuracy," you will lose, because you can never perfectly mirror the population. Stick to the Fairness argument.

  **2. The Civic Register Constraint**
  *   **The Bias:** I have ruled out volunteer registers entirely.
  *   **Why:** You suspected it guts the process. It does. It creates a "professional citizen" class.
  *   **The Cost:** Recruitment will be harder and more expensive (cold contacting vs. warm lists). Response rates will drop from ~20% to ~2%.
  *   **The Defense:** It is the only way to claim the assembly is not just a group of people who like politics.

  **3. What The Procedure Cannot Do**
  *   **Compulsion:** The procedure assumes no power to compel. This means your sample is always *Self-Selected from the Randomly Invited*.
      *   *The Gap:* Even with random invites, the people who say "yes" are different from those who say "no." The procedure cannot fix this.
      *   *Mitigation:* You must budget for high incentives and childcare/care costs to reduce the socioeconomic bias of the "Yes" group. The procedure doesn't mandate this, but the budget must.
  *   **The Ministerial Veto:** The procedure hands "Values Calls" to the Minister.
      *   *The Risk:* If the Minister changes the pool (Step 1) or the Mandate (Step 6) for political gain, the procedure validates it as a "Ministerial Decision."
      *   *The Shield:* You must publish the Step 1 and Step 6 decisions *before* the lottery. If they change it after the lottery is drawn, *that* is when you get judicially reviewed.

  **4. The "Six Weeks" Constraint**
  *   **The Reality:** True random sampling from a state register often takes 4 weeks just for data governance approval.
  *   **The Risk:** Junior staff will cut corners on Step 2 (using a faster, dirtier list) to meet the 6-week deadline.
  *   **The Fix:** Add a "Time Check" at Step 2. If data access > 2 weeks, the 6-week timeline is impossible. Escalate to delay the timeline, not the data quality.

  ### SUMMARY FOR YOUR BOSS
  This procedure trades the *appearance* of representation (a perfect demographic mirror) for the *reality* of legitimacy (an unrigged lottery). It will stop you from running assemblies that are legally vulnerable (Case B) or constitutionally impossible (Case C). It forces the Minister to own the political constraints while your office owns the mathematical integrity.
