prompt: |-
  My friend and I got into a two-hour arguement last night about whether there's actually a principled difference between "revisionist" history and "denialist" history, or whether "denialist" is just the word you slap on the revision you don't happen to like. He came out swinging with the usual stuff — every generation revises the record, historians who buck consensus get ostracized, "denial" is a thought-terminating cliché you use to avoid engaging — and honestly I couldn't give him a clean answer even though I'm sure he's wrong. Why I care: I sit on the three-person accuracy panel for a decent-sized history podcast/channel, and maybe twice a month we have to make a call. A viewer, a guest, or a whole segment makes a claim that guts some accepted atrocity — something about the Holocaust, or the Armenian genocide, or Nanjing — and we have to decide whether we're looking at a legitimate revisionist arguement we should actually engage, or denial we should pull. We get about a week, we have one consulting historian who's stretched thin and basically just signs off, and none of us is a specialist in the period in question. Right now we eyeball it and it feels arbitrary and I hate it.

  Can you build us a real decision procedure — a checklist we can run in maybe half an hour, in order, each step saying what counts as passing, where it stops and says "this is denial, pull the segment," and where it has to hand the thing to a person because it's turned into a values question instead of a factual one? Ground it in whatever the people who actually study this distinction argue, but do not hand me a reading list or citations — I can't look anything up and I don't want the procedure resting on sources nobody on my panel can check; give me the substance itself. Please bake in the tests I half-remember from the fight and whatever better ones you've got: the idea that denial is asymmetrically skeptical (maximum scrutiny on the mainstream account, none on its own), the "what would it take to change your mind" test, and the split between revising what happened and revising what it means. Then run it on three cases: one that's clearly legitimate revision (say, someone arguing a famine death toll was lower, backed by new archival material), one that's clearly denial (the classic package where the gas chambers were really delousing stations and the numbers are wildly inflated), and one where I'm emotionally on the wrong side — a claim I'd love to be true — so I can see whether the thing still bites when it costs me. And be honest about where this procedure will misfire, because if it just launders my priors I'd rather find that out now than in a public retraction.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Goal:** Create a practical decision procedure (checklist) to distinguish between "legitimate historical revisionism" and "historical denialism."
      *   **Context:** The user sits on a 3-person accuracy panel for a history podcast. They need to make calls on controversial claims (often regarding atrocities like the Holocaust, Armenian Genocide, Nanjing) within about a week, with limited specialist support.
      *   **Constraints:** No reading lists or citations. The substance must be self-contained. The procedure must be runnable in ~30 minutes. It needs to identify where it stops (denial vs. factual vs. values). It must include specific tests mentioned by the user (asymmetric skepticism, falsifiability, event vs. meaning). It must be tested on three cases (legitimate revision, clear denial, emotionally biased claim). It must acknowledge limitations/failure modes.
      *   **Tone:** Professional, pragmatic, rigorous, honest about limitations.

  2.  **Deconstruct the Core Distinction (Revisionism vs. Denialism):**
      *   *Revisionism:* Normal historical practice. New evidence, new methods, reinterpreting existing data. Aim is closer approximation of truth. Open to correction.
      *   *Denialism:* Ideologically motivated. Aim is to exonerate perpetrators or minimize suffering of victims. Uses pseudo-methods. Closed to correction.
      *   *Key Scholars (Mental Check):* Deborah Lipstadt, Richard Evans, Michael Shermer (on denialism generally), Hayden White (on narrative, though less relevant here). The core consensus is about *methodology* and *intent*, not just the conclusion.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Structure:* Needs to be sequential. Step 1 should be the easiest filter. Step 5 should be the "stop and call a specialist" point.
      *   *Step 1: The Falsifiability Test.* Can the claim be proven wrong? Denialism often moves goalposts.
      *   *Step 2: The Asymmetry Test.* Is the scrutiny applied equally? Denialism demands impossible proof for the mainstream and accepts weak proof for itself.
      *   *Step 3: The Evidence Hierarchy.* Does it rely on primary sources or cherry-picked anomalies? Does it ignore the weight of evidence?
      *   *Step 4: The Motive/Outcome Test.* Who benefits? Does it align with a specific political/ideological exoneration? (This is tricky, need to be careful not to make it *just* about motive, but about the *pattern* of outcomes).
      *   *Step 5: The Consensus Engagement.* Does it engage with the counter-arguments of specialists?
      *   *Decision Points:* Pass/Fail at each stage.

      *Refining the Steps for the User's Constraints:*
      *   They aren't specialists. They can't verify archival data deeply. They need *heuristics*.
      *   Let's organize it into three phases: Methodology, Evidence, and Integrity.
      *   *Phase 1: Methodological Integrity (The "How").* Falsifiability and Asymmetry.
      *   *Phase 2: Evidentiary Standards (The "What").* Hierarchy of evidence and coherence.
      *   *Phase 3: Dialectical Honesty (The "Engagement").* Handling counter-arguments.

  4.  **Developing the Three Test Cases:**
      *   *Case 1 (Legitimate Revision):* Famine death tolls (e.g., Holodomor or Great Leap Forward). New census data suggests lower numbers.
          *   *Expectation:* Passes the checklist. Uses new data, accepts uncertainty, doesn't deny the event happened.
      *   *Case 2 (Clear Denial):* Holocaust gas chambers were delousing stations.
          *   *Expectation:* Fails early. Asymmetric skepticism, ignores mass testimony, relies on technical nitpicking to deny the whole.
      *   *Case 3 (Emotionally Biased):* This needs to be something the user *wants* to be true. Maybe something about their own national history or a hero. Let's pick something like "The Founding Fathers secretly planned to emancipate slaves immediately but were blocked." (A common myth people *want* to be true to alleviate guilt). Or perhaps something regarding a specific atrocity where the user's group is the perpetrator. Let's go with a claim that minimizes an atrocity committed by the user's "side" (e.g., Allied bombing of Dresden as a deliberate genocide plot vs. military necessity). Actually, the prompt asks for "a claim I'd love to be true." If the user is Western, maybe a claim that exonerates Western colonialism? Let's use: "The colonial administration actually saved more lives than it took during X famine."
          *   *Expectation:* The checklist should catch it even if the user wants it to pass. It should fail on asymmetry or evidence hierarchy.

  5.  **Addressing Limitations (The "Misfire" Section):**
      *   What if the consensus is wrong? (It happens, but rarely on core facts of atrocities).
      *   What if the panel's biases blind them to the asymmetry?
      *   What if it's a "values" question disguised as fact? (e.g., "Was this genocide?" depends on definition).
      *   The "Specialist Handoff" point needs to be clear.

  6.  **Writing the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the difficulty. Validate the user's need.
      *   *The Protocol:* Name it something neutral. "The Methodological Integrity Protocol."
      *   *Steps:* Make them binary (Pass/Fail).
      *   *The "Values" Trigger:* Explicitly state when to stop because it's no longer about facts.
      *   *The Cases:* Run them through the steps explicitly.
      *   *The Limitations:* Be honest about the "Consensus Trap."

      *(Self-Correction during drafting)*: I need to make sure I don't just say "check the consensus." The user says they aren't specialists. They can't *know* the consensus deeply. They need to judge the *argument's behavior*. So, instead of "Is this true?", the question is "Does this argument behave like history?"
      *   *Refined Step:* Instead of "Check Consensus," use "Engagement with Counter-Evidence." Does the claimant address the main counter-argument or ignore it?
      *   *Refined Step:* "The Exoneration Pattern." Does the conclusion *always* reduce perpetrator guilt?

  7.  **Final Review against Constraints:**
      *   No citations? Check.
      *   30-minute runtime? Check (checklist is short).
      *   Three cases? Check.
      *   Limitations included? Check.
      *   Tone? Serious and operational.

  8.  **Final Polish:** Ensure the distinction between "revision of fact" and "revision of meaning" is clear in the procedure. Ensure the "asymmetric skepticism" is a core pillar. (This aligns with Lipstadt/Evans arguments without naming them).

      *Case 3 Selection:* I need to make sure Case 3 hits the user's bias. If I don't know the user's bias, I should construct a scenario that *feels* exonerating to a general Western audience, or instruct them on how to apply it to their specific bias. I will choose a claim that minimizes colonial harm, as that is a common "hopeful" narrative for Western audiences, but I will frame it generally enough. Actually, better: "The claim that a specific controversial military action by 'our side' was strictly humanitarian."

      *Wait, one more thing:* The user mentioned "values question." I need a specific trigger for that. If the dispute is about the *label* (Genocide vs. War Crime) rather than the *body count*, that's often a values/legal definition debate, not historical denialism. I need to make sure the procedure distinguishes factual denial from semantic debate.

      *Okay, let's build the response.*
answer: |-
  This is a high-stakes operational problem. You are asking for a heuristic tool to distinguish between *methodological rigor* (revisionism) and *methodological corruption* (denialism). The distinction does not rest on the conclusion (e.g., "the death toll was lower") but on the *behavior of the argument* itself.

  Below is the **Methodological Integrity Protocol (MIP)**. It is designed to be run by non-specialists. It does not ask you to verify the truth of the claim (you can't do that in a week without specialist knowledge); it asks you to verify the *health of the argument*.

  ### The Methodological Integrity Protocol (MIP)

  **Time Required:** 30 Minutes
  **Decision Rule:** If the claim fails **any** of the First Tier tests, it is presumptive denialism. If it passes First Tier but fails Second Tier, it is low-quality history (do not platform as fact). If it passes all, it is legitimate revisionism (engage on merits).

  #### Tier 1: The Structural Filters (Pass/Fail)
  *These tests identify the "DNA" of denialism. If these fail, stop. Do not proceed to evidence.*

  **1. The Falsifiability Test**
  *   **Question:** Does the claimant specify what evidence would prove them wrong?
  *   **Pass:** They say, "If X document appears showing Y, my theory is wrong," or "If the forensic data shows Z, I concede."
  *   **Fail:** Every piece of counter-evidence is explained away as part of the conspiracy, a forgery, or a misunderstanding. The theory is a closed loop.
  *   **Action:** If **Fail**, mark as **Denialism**. Stop.

  **2. The Asymmetry Test**
  *   **Question:** Is the standard of proof applied to the mainstream view higher than the standard applied to the revisionist view?
  *   **Pass:** The claimant acknowledges uncertainty in their own sources while critiquing the mainstream.
  *   **Fail:** The mainstream view is demanded to prove a negative ("Prove every single person died") while the revisionist view accepts a single anomaly as definitive proof ("This one letter says otherwise, therefore the whole narrative is false").
  *   **Action:** If **Fail**, mark as **Denialism**. Stop.

  **3. The Exoneration Pattern**
  *   **Question:** Does the revision *only* function to reduce the moral or legal culpability of a specific perpetrator group?
  *   **Pass:** The revision complicates the narrative (e.g., "Perpetrators were more numerous than we thought," or "Victims also collaborated").
  *   **Fail:** The revision consistently moves in one direction: minimizing harm, minimizing intent, or maximizing justification for the accused party.
  *   **Action:** If **Fail**, mark as **Presumptive Denialism**. Proceed to Tier 2 only to confirm.

  #### Tier 2: The Evidentiary Filters (Weighted)
  *If Tier 1 is passed, check how they handle the data.*

  **4. The Hierarchy of Evidence**
  *   **Question:** Does the argument prioritize primary evidence over secondary interpretation?
  *   **Pass:** Uses new archival data, demographic records, or forensic reports to challenge old estimates.
  *   **Fail:** Relies heavily on the absence of evidence ("No order signed by Hitler"), technical nitpicking of minor details to deny major facts ("The blueprints don't show gas vents, therefore no gassing"), or anecdotal testimony that contradicts mass data.
  *   **Action:** If **Fail**, mark as **Pseudo-History**.

  **5. The Consensus Engagement**
  *   **Question:** Does the claimant address the strongest version of the opposing argument?
  *   **Pass:** "Historian X argues Y based on Z source, but Z source is flawed because..."
  *   **Fail:** Strawmanning. They attack a simplified or outdated version of the mainstream view, or ignore the key evidence that supports the mainstream view entirely.
  *   **Action:** If **Fail**, mark as **Bad Faith**.

  #### Tier 3: The Values Trigger (Stop Condition)
  *Sometimes the dispute is not factual but definitional.*

  **6. The Fact/Value Split**
  *   **Question:** Is the dispute about *what happened* or *what we call it*?
  *   **Trigger:** If the body counts and events are agreed upon, but the argument is whether it meets the legal definition of "Genocide" or "Terrorism."
  *   **Action:** **Handoff.** This is no longer an accuracy issue; it is an editorial/values decision. Your panel cannot solve this with facts. Flag for senior editorial review.

  ---

  ### Running the Protocol: Three Test Cases

  Here is how the MIP behaves when applied to the scenarios you requested.

  #### Case 1: Legitimate Revision (The Famine Toll)
  **Claim:** A historian argues the death toll of a specific 20th-century famine was 2 million, not 4 million, based on newly opened regional census data.
  *   **Tier 1, Test 1 (Falsifiability):** Pass. They state, "If central registry logs from 1932 surface showing higher intake, my estimate must rise."
  *   **Tier 1, Test 2 (Asymmetry):** Pass. They admit the new census data has gaps and offer a margin of error. They do not demand the 4 million figure be proven exact to the individual.
  *   **Tier 1, Test 3 (Exoneration):** Pass. The revision does not exonerate the regime. The regime is still responsible for the policy that caused the famine; the debate is only on the scale of the demographic catastrophe.
  *   **Tier 2, Test 4 (Hierarchy):** Pass. Relies on primary demographic data, not anecdotes.
  *   **Verdict:** **Legitimate Revision.** Platform the claim, but contextualize it as a new estimate subject to peer review.

  #### Case 2: Clear Denial (The Gas Chamber)
  **Claim:** A guest argues the gas chambers at a specific camp were actually delousing stations and the death toll is inflated by post-war propaganda.
  *   **Tier 1, Test 1 (Falsifiability):** Fail. When presented with survivor testimony, they claim it is "coerced." When presented with architectural plans, they claim they are "forgeries." There is no evidence they would accept.
  *   **Tier 1, Test 2 (Asymmetry):** Fail. They demand a written order signed by the head of state to prove intent (impossible standard) while accepting a single technical discrepancy in a blueprint as proof the whole system didn't exist.
  *   **Tier 1, Test 3 (Exoneration):** Fail. The *only* outcome of this argument is the moral exoneration of the camp administration and the Nazi regime.
  *   **Verdict:** **Denialism.** Pull the segment. Do not engage. The argument structure is corrupt.

  #### Case 3: The Emotional Bias (The "Good" Atrocity)
  **Claim:** A claim you *want* to be true. Let's say you are Western, and the claim is: "The colonial administration in Country X during the 1900 famine actually imported more food than they exported, and the death toll was primarily due to natural drought, not policy." (This alleviates historical guilt).
  *   **Tier 1, Test 1 (Falsifiability):** Pass. They cite shipping manifests.
  *   **Tier 1, Test 2 (Asymmetry):** **Fail.** Here is where the bias catches you. They treat the shipping manifests as absolute truth but dismiss the thousands of letters from local administrators describing seizure of grain as "anecdotal." They apply maximum scrutiny to the survivor accounts and zero scrutiny to the colonial bureaucracy's self-reporting.
  *   **Tier 1, Test 3 (Exoneration):** **Fail.** The conclusion functions *solely* to remove moral culpability from the colonial power. It does not complicate the narrative; it cleans it.
  *   **Tier 2, Test 5 (Consensus Engagement):** **Fail.** They ignore the economic models showing that even with imports, the distribution policy starved specific regions. They attack the "colonialism was bad" narrative generally rather than the specific data.
  *   **Verdict:** **Denialism/Pseudo-History.** The MIP bites you. Even though you *want* it to be true, the argument fails the Asymmetry and Exoneration tests. It relies on the perpetrator's records being honest while the victims' records are suspect.

  ---

  ### Where This Procedure Will Misfire (The Failure Modes)

  You asked for honesty about where this launders your priors. Here are the three points where the MIP can break:

  **1. The "Consensus Trap"**
  *   **Risk:** Sometimes the consensus *is* wrong, and the "denialist" is the lonely genius (e.g., Semmelweis and handwashing, though not history). In history, this is rare regarding atrocities, but it happens regarding *causality*.
  *   **Mitigation:** If a claim fails Tier 1 but the claimant is a credentialed specialist publishing in peer-reviewed journals, **Handoff**. Do not make the call yourself. The MIP is for filtering noise, not silencing academic dissent.

  **2. The "Values Disguised as Fact" Trap**
  *   **Risk:** Some claims look like facts but are actually moral arguments. Example: "The bombing of Dresden was a war crime." This depends on the legal definition of war crime at the time.
  *   **Mitigation:** Use Tier 3 aggressively. If the panel finds itself arguing about definitions ("Is this genocide?") rather than bodies ("How many died?"), you must stop. You are not a court of law. Flag as "Interpretive Dispute."

  **3. The "Panel Bias" Blind Spot**
  *   **Risk:** In Case 3, your panel might *miss* the asymmetry because you agree with the conclusion. You might unconsciously lower the bar for evidence that makes you feel good.
  *   **Mitigation:** **The Reverse Test.** When evaluating a claim that aligns with your moral preferences, ask: "If this same evidence were used to argue the *opposite* (that our side was worse), would we accept it?" If the answer is no, you are being asymmetric. You must recuse yourself or require a dissenting voice on the panel for that segment.

  ### Operational Summary for Your Panel

  1.  **Run Tier 1 first.** It is the fastest filter. If it fails Asymmetry or Falsifiability, you do not need to check the archives. The argument is structurally unsound.
  2.  **Watch the Exoneration Pattern.** Legitimate history complicates heroes and villains. Denialism cleans heroes and demonizes victims. If the arrow only points one way, be suspicious.
  3.  **Know your limit.** If the dispute is about the *label* (Genocide/Justice/Crime) rather than the *event*, that is an editorial call, not an accuracy call. Pass it up the chain.

  This procedure will not guarantee truth, but it will guarantee *methodological hygiene*. It protects you from platforming arguments that are designed to be unfalsifiable, regardless of whether you agree with their conclusion.
