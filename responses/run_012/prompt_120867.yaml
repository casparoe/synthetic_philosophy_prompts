  **NINM BULLETIN 2024-09**
  **SUBJECT:** Transitivity Verification of the Primary Beneficence Standard (PBS-1)
  **CLASSIFICATION:** Public / Normative Use

  **1.0 PURPOSE**
  The National Institute of Normative Metrology (NINM) maintains the Primary Beneficence Standard (PBS-1), stored under vacuum at Site 4. This bulletin reports the results of the decadal traceability audit, wherein the PBS-1 was compared against a derived standard (PBS-1Ω) via a certified calibration chain. The objective was to verify the transitivity of the relation *at least as good as* ($\succeq$) across extended spectral distances.

  **2.0 METHODOLOGY**
  A calibration chain of 10,000 intermediate artifacts ($S_0$ through $S_{10000}$) was constructed. $S_0$ is the PBS-1. $S_{10000}$ is PBS-1Ω. Each adjacent pair ($S_i, S_{i+1}$) was differentiated by a marginal decrement in welfare magnitude $\delta$, where $\delta$ is below the Just Noticeable Difference (JND) threshold for a standard normative observer.

  Per ISO-9001-Normative protocols, each link was certified as $S_i \succeq S_{i+1}$ with a confidence interval of 99.9%. Certification requires that no observer can sensibly assert $S_{i+1} \succ S_i$. The chain was sealed; no external value leaks were detected.

  **3.0 FINDINGS**
  Upon direct comparison of the chain endpoints, $S_0$ and $S_{10000}$, the relation $S_0 \succeq S_{10000}$ was rejected. Observers consistently ranked $S_{10000} \succ S_0$. The magnitude of difference is significant (effect size $d = 2.4$).

  Consequently, the relation $\succeq$ is demonstrated to be intransitive over spectral distances exceeding 5,000 $\delta$-steps. While local transitivity holds (i.e., within calibration tolerance), global transitivity fails. The traceability chain is intact, yet the origin is inferior to the terminus.

  **4.0 IMPLICATIONS FOR RATIONAL CHOICE**
  This finding invalidates the existence of a real-valued utility function $U(x)$ capable representing certified preferences over the domain. Agents adhering to NINM-certified comparisons cannot satisfy the axioms of Expected Utility Theory.

  Specifically, agents possessing these preferences are vulnerable to cyclic preference arbitrage ("money pumps"). An agent trading $S_0$ for $S_1$ for $S_2$... to $S_{10000}$, then swapping $S_{10000}$ for $S_0$, will incur transaction costs while returning to the original state. NINM advises financial regulators to flag entities utilizing spectral calibration for liquidity risks.^1

  **5.0 PRACTICAL GUIDANCE**
  Until further notice, stakeholders must adjust decision protocols:

  *   **Ballots:** Do not aggregate pairwise comparisons across large policy spectra. Use lexical ordering (e.g., "Rights Trump Utility") to break chains before transitivity fails.
  *   **Clinical Triage:** When comparing treatment outcomes, avoid stepwise degradation protocols. If Outcome A and Outcome Z are distinguishable, do not intermediate them. Choose directly or randomize.
  *   **Procurement:** Do not accept vendor upgrades based solely on marginal improvements. Accumulated marginal improvements may result in net value loss relative to the original specification.

  **6.0 APPENDIX A: TOLERANCE SPECIFICATIONS**
  *   **Local Tolerance:** $\pm 0.001$ U (Utils)
  *   **Global Tolerance:** Undefined
  *   **Archimedean Property:** Suspended

  ***

  ^1 *Bureau of Normative Metrics (BNM) Dissent:* The BNM argues this is a measurement artifact caused by observer fatigue over 10,000 steps. They suggest recalibrating the JND threshold. NINM maintains the JND was held constant; the error is structural, not observational.

  ^2 *Dept. of Speculative Ethics Comment:* Some theorists posit that value is non-Archimedean. Transitivity is not a feature of value but a fiction of measurement. NINM rejects this ontological claim as non-falsifiable and continues to treat value as a magnitude pending further audit.

  **END OF BULLETIN**
