answer: |-
  ### Brainstorming Candidate Defeaters

  To stress-test your position, we must identify scenarios where the causal arrow you propose (Interest/Honor $\rightarrow$ End of Practice $\rightarrow$ Moral Ratification) is reversed, broken, or rendered irrelevant.

  1.  **The "Causal Discourse" Case:** Instances where moral language actively *constructed* the new economy of honor, rather than trailing it. If the argument creates the dishonor, it is not epiphenomenal.
  2.  **The "Loss-Making" Conscience:** Individual or collective manumission/cessation occurring at net financial loss *before* the general economic trend turned. (e.g., Quaker manumissions in the 1760s-70s).
  3.  **The "Imposed Ban" Case:** A practice banned by state fiat where the practicing elite still valued it (honor) and benefited from it (interest), yet the ban stuck without immediate reversal.
  4.  **The "Non-Elite" Pressure:** Cases where the "elite" honor economy was irrelevant because the pressure came from below (enslaved rebellion, middle-class mobilization) forcing elites to abandon a profitable/honorable practice to preserve order.
  5.  **The "Persistent Profit" Abolition:** Abolition occurring while the practice was still demonstrably profitable (challenging the Williams thesis component).
  6.  **The "Honor Lag" Case:** A practice ending in a specific locale while the broader honor culture still endorsed it (e.g., dueling bans in specific regiments or states while the Code remained strong elsewhere).

  ### Ranking the Defeaters

  **Merely Awkward (Manageable within your framework):**
  *   **Individual Conscience:** A single planter freeing slaves due to moral qualms can be dismissed as an outlier that does not shift the systemic "economy."
  *   **Temporal Overlap:** The fact that moral arguments and economic shifts happen simultaneously is hard to disentangle; a defender can always argue the economic shift was the "real" driver.
  *   **Religious Conversion:** Can be reinterpreted as a shift in "honor" (spiritual capital) rather than pure morality.

  **Decisive (Threaten the Core Mechanism):**
  *   **The Causal Priority of Discourse:** If you can show that moral argument *preceded* the honor shift and was the *mechanism* by which honor was redefined, the epiphenomenal claim collapses. Moral argument becomes the engine, not the exhaust.
  *   **The "Imposed Ban" That Stuck:** If a state bans dueling or slavery while elites still view it as honorable and profitable, and the practice *actually ends* (not just goes underground), your theory requires a explanation of why elite honor didn't matter.
  *   **The Unfalsifiability Trap:** If "honor" and "interest" are defined broadly enough to encompass *any* motivation (including "the interest in being moral"), the theory becomes tautological.

  ### The Unfalsifiability Risk

  This is the most significant philosophical vulnerability. Your position risks becoming a "just-so" story generator. If "honor" is defined as "whatever social currency motivates the elite," then any cessation of a practice can be retroactively fitted into the model.
  *   *Example:* If elites abolish slavery because they feel moral pity, a defender of your position might say, "Ah, but they valued 'being compassionate' (honor) more than 'slave profits' (interest)."
  *   *The Defect:* To be falsifiable, "honor" and "interest" must be defined *independently* of the outcome. "Interest" must be measurable (e.g., profit margins) and "Honor" must be observable (e.g., public praise vs. shame) *prior* to the abolition. If you allow them to be fluid, the position is **insulated** from empirical defeat but **exposed** to the charge of being empty.

  ### The "Hard Case": Practice Ends, Honor and Interest Unchanged

  You asked for a case where a practice ended while neither honor nor interest had shifted. This is historically elusive because the *end* of a practice usually implies *some* shift. However, the strongest candidate for a defeater is not where nothing changed, but where the **moral argument forced the change in honor** against the grain of interest.

  **The British Abolition of the Slave Trade (1807)**
  *   **Interest:** The British West Indies were still profitable in 1807, though facing competition. The planters (the relevant elite) vehemently opposed abolition. Compensation was later paid, suggesting their material interest was recognized as valid and infringed upon.
  *   **Honor:** The "honor" of the planter class remained intact in their own eyes and within the colonial hierarchy. They did not view themselves as dishonorable until *after* the moral campaign had succeeded.
  *   **The Defeater:** The abolition was driven by the Clapham Sect and popular mobilization (Wilberforce, Clarkson). The moral argument *created* the dishonor associated with the trade; it did not follow a pre-existing shift. The metropole's honor economy was *rewritten* by the moral campaign, which then overrode the colonial elite's interest.
  *   **Why it counts:** If your theory requires the honor shift to *precede* the moral efficacy, 1807 is a counter-example. The moral argument was the *cause* of the honor shift, not the ratification of one.

  **The US Navy Dueling Ban (1862)**
  *   **Context:** Issued by Secretary of the Navy Gideon Welles during the Civil War.
  *   **Honor:** The Code of Honor was still potent among officers. Dueling was seen as a necessary vindication of character.
  *   **Interest:** The Navy had an interest in retaining officers, but also in discipline.
  *   **The Defeater:** The ban was imposed from above. It stuck not because officers suddenly felt dueling was dishonorable (many still resented the ban), but because institutional authority enforced it. Over time, the ban *made* it dishonorable.
  *   **Why it counts:** It shows regulation can lead culture, rather than culture leading regulation.

  ### Concession and Verdict

  A defender of your position would likely concede the **Causal Priority of Discourse** as counting against it. If moral language is shown to be constitutive of social reality (i.e., it *makes* things honorable or dishonorable), it cannot be merely epiphenomenal.

  However, a defender would dismiss the **"Imposed Ban"** cases by arguing that without the underlying shift, the ban would be ignored (as Prohibition was). They would argue that 1807 only worked because the *metropole* elite's honor had shifted, even if the *colonial* elite's had not. This moves the goalposts (which elites?), highlighting the unfalsifiability risk.

  **Is this a fatal defect?**
  It is fatal if you claim moral argument is *always* epiphenomenal. It is merely a refinement if you claim it is *often* epiphenomenal. The danger lies in drawing "honor" and "interest" so broadly that they become synonyms for "motivation." If you define "interest" to include "psychic satisfaction from morality," you have explained nothing. To save the position, you must define interest materially and honor socially *ex ante*.

  **Final Assessment:**
  The position is robust against naive moralism (the idea that "ideas alone change the world") but **mixed** in its resilience. It is **insulated** against simple historical counter-examples because "honor" is slippery, but it is **exposed** to the philosophical critique that it misunderstands the constitutive power of language. It risks being a sophisticated tautology unless strictly bounded.

  \answer{mixed}
