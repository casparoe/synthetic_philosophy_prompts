answer: |-
  **Exam Question**

  **Question 4: The Charitable Dollar Auction (20 Points)**

  Consider the standard dollar auction: a $1 bill is auctioned to the highest bidder. The highest bidder pays their bid and receives the $1. The second-highest bidder pays their bid but receives nothing. Bids must increase by a fixed increment $\delta$.

  Now, consider the **Charitable Variant** discussed in our final unit. The auctioneer is a charity. Every dollar paid by *either* bidder is donated to a cause that both bidders independently value at a rate $\alpha$, where $0 < \alpha < 1$. Thus, a bidder receives a "warm-glow" benefit equal to $\alpha$ times the sum of both bids, in addition to the standard auction payoffs. Assume $\alpha$ is initially common knowledge.

  (a) Suppose you are currently the second-highest bidder with a bid of $b_2$, and your opponent holds the high bid $b_1$ (where $b_1 > b_2$). You are considering raising your bid to $b_3 = b_1 + \delta$. Set up your payoff function for stopping versus raising. Derive the precise condition under which raising your bid is rational. (8 points)

  (b) Based on your derivation, does the charitable feature ($\alpha > 0$) eliminate, mitigate, or exacerbate escalation compared to the standard auction ($\alpha = 0$)? Explain what this result implies about the popular claim that dollar-auction escalation is driven solely by the "sunk-cost fallacy." (7 points)

  (c) Briefly explain how the strategic dynamic changes if $\alpha$ is private information rather than common knowledge. (5 points)

  *Recommended time: 75 minutes.*

  ***

  **Model Answer**

  To analyze the rationality of escalation in the Charitable Dollar Auction, we must compare the marginal benefits and costs of raising the bid against the alternative of stopping. We treat the opponent's current high bid, $b_1$, and my current losing bid, $b_2$, as fixed commitments. In this game, all bids paid are sunk costs that must be paid regardless of future action, but future bids determine the final allocation of the prize and the total donation size.

  If I stop, I pay $b_2$ and receive no prize. However, the total revenue donated is $(b_1 + b_2)$. My payoff is the warm-glow benefit minus my payment:
  $$U_{stop} = \alpha(b_1 + b_2) - b_2$$

  If I raise my bid to $b_3 = b_1 + \delta$, I become the highest bidder. I pay $b_3$, receive the $1 prize, and the total donation increases to $(b_1 + b_3)$. My payoff is:
  $$U_{raise} = 1 + \alpha(b_1 + b_3) - b_3$$

  To determine if raising is rational, we calculate the difference $\Delta U = U_{raise} - U_{stop}$. Substituting the equations above:
  $$\Delta U = [1 + \alpha(b_1 + b_3) - b_3] - [\alpha(b_1 + b_2) - b_2]$$
  Grouping terms, the $b_1$ components cancel out, as the opponent's contribution to charity is fixed in this marginal decision. We are left with the change in my payment and the resulting change in charity value:
  $$\Delta U = 1 - (b_3 - b_2) + \alpha(b_3 - b_2)$$
  Let $\Delta b = b_3 - b_2$ represent the total increase in my financial commitment. The condition for rational escalation ($\Delta U > 0$) is:
  $$1 > \Delta b(1 - \alpha)$$

  This inequality reveals that escalation is rational as long as the prize value ($1) exceeds the net marginal cost of the bid increase. The net cost is the financial increment $\Delta b$ reduced by the warm-glow benefit $\alpha \Delta b$ generated by that increment.

  Regarding the second part of the question, the charitable feature exacerbates escalation. In the standard auction ($\alpha = 0$), the condition is $1 > \Delta b$. With $\alpha > 0$, the term $(1 - \alpha)$ is less than 1, making the right-hand side smaller. This means the inequality holds for larger bid increments or at higher price levels than in the standard game. The warm-glow benefit effectively subsidizes the marginal cost of bidding, making it rational to stay in the auction longer.

  This result critically undermines the claim that dollar-auction escalation is merely the "sunk-cost fallacy." The sunk-cost fallacy implies irrational behavior driven by an emotional inability to ignore past investments. However, our derivation shows that escalation can be locally rational based on forward-looking marginal analysis. The trap arises from the game structure (the second-highest bidder penalty), not necessarily cognitive error. Adding $\alpha$ makes escalation *more* rational, not less, proving that altruistic motives can intensify strategic traps rather than resolve them. Students who attribute escalation solely to psychological fallacies fail to recognize the incentive compatibility of the trap.

  Finally, if $\alpha$ is private information, the dynamic shifts from a game of perfect information to a war of attrition with incomplete information. In the common knowledge case, bidders can calculate exactly when the other will drop out. With private $\alpha$, a bidder does not know the opponent's valuation of the charity. A bidder with a high $\alpha$ is "tougher"—they are willing to bid higher because their net cost is lower. Facing uncertainty, a bidder may stay in longer to screen the opponent's type, hoping the opponent has a low $\alpha$ and will quit soon. Conversely, knowing that opponents might have high $\alpha$ types may discourage early entry. Ultimately, private information introduces signaling incentives and typically prolongs escalation, as bidders hesitate to reveal their own dropout thresholds too early.

  ***

  **Marking Scheme (20 Points)**

  **1. Payoff Setup and Derivation (8 Points)**
  *   **Correct Payoff Functions (4 pts):** 2 points for correctly specifying $U_{stop}$ including the charity term $\alpha(b_1 + b_2)$. 2 points for correctly specifying $U_{raise}$ including the prize and updated charity term.
      *   *Deduction:* -1 point if the student treats $\alpha$ as a rebate on their own payment only (e.g., $-\alpha b_2$) rather than a benefit from total revenue.
  *   **Correct Condition (4 pts):** 2 points for correctly calculating the difference $\Delta U$. 2 points for deriving the final inequality $1 > \Delta b(1 - \alpha)$.
      *   *Deduction:* -2 points for algebraic errors that change the sign of $\alpha$.

  **2. Escalation and Sunk Cost Analysis (7 Points)**
  *   **Effect of $\alpha$ (3 pts):** Must state that $\alpha$ **exacerbates** escalation. Explanation must note that $\alpha$ lowers the net marginal cost of bidding.
      *   *Common Error:* Claiming altruism mitigates escalation because bidders "feel good" about losing. (0 points for this section).
  *   **Sunk Cost Implication (4 pts):** Must argue that escalation is **locally rational** and forward-looking, not just a psychological fallacy. The answer should distinguish between the *structural trap* (rational) and the *fallacy* (irrational).
      *   *A Answer:* Explicitly notes that the derivation proves rationality independent of psychological bias.
      *   *B Answer:* Correctly identifies exacerbation but offers a vague explanation of the sunk cost fallacy without linking it to the marginal analysis.

  **3. Private Information (5 Points)**
  *   **Strategic Shift (5 pts):** Must identify that private $\alpha$ creates uncertainty about the opponent's "toughness" or dropout point.
      *   *A Answer:* Discusses screening, signaling, or the war of attrition dynamic (e.g., high $\alpha$ types stay in longer).
      *   *B Answer:* States that uncertainty makes it "harder to decide" without explaining the strategic mechanism (e.g., hiding one's type).
      *   *Common Error:* Assuming private information stops escalation because bidders are risk-averse. (-3 points).

  **Grade Boundaries**
  *   **A (18-20 pts):** Flawless math, clear distinction between structural rationality and psychological fallacy, nuanced handling of private information.
  *   **B (15-17 pts):** Correct math and conclusion on escalation, but weaker conceptual analysis on sunk costs or private info.
  *   **C (12-14 pts):** Math errors in the payoff setup, but correct intuition that escalation continues.
  *   **D/F (<12 pts):** Fundamental misunderstanding of the auction rules or the role of $\alpha$.
