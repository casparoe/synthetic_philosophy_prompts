prompt: |-
  I've been circling a piece on the frame problem for months and keep hitting the same wall: everyone from the old AI people to the philosophers to the cognitive scientists tells me it's either trivially solved or deeply unsolved, and I'm now fairly sure they aren't even arguing about the same thing. So before I start interviewing, help me build the spec. What would a theory in this area actually have to deliver to count as a solution -- not to some toy puzzle but to whatever the real problem is? Give me the requirements list: the cases it has to get right (the robot that never bothers to check whether its fuel is running low; the agent that has to know that repainting a wall doesn't move it or make it heavier; the planning system that needs to assume nothing else changes when it acts), the distinctions it must respect rather than collapse (is there really a difference between the metaphysical version, the epistemological one and the computational one, or is that a distinction without a difference?), and the constraints it can't violate -- like, whatever the answer is, it can't require the system to survey every belief against every other belief, because that's the whole intractibility complaint. With the consideration behind each requirement, please, and a mark on which are non-negotiable and which are just preferences of one camp.

  Then the part I actually care about: which of these are genuine desiderata and which are the prejudices of a particular crowd -- say, the people who think the problem is about representation versus the people who think it's about relevance versus the people who think the whole framing is a mistake. If some subset of the requirements can't be met together, say so plainly, because that's the story. And one thing a colleague keeps pushing on me that I want the spec to settle: he insists the frame problem isn't really about relevance or about what stays the same, it's about how you individuate a change or an action in the first place -- is that the same requirement in different clothes, or a genuinely separate one that belongs on the list? Skip scoring the famous proposals, I'll handle that in the piece. I just want the criteria and the reasons behind each, and which single requirement does the most to rule candidates out.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** The Frame Problem in AI/Cognitive Science/Philosophy.
      *   **Goal:** Build a "spec" (specification/requirements list) for what counts as a *solution* to the *real* problem, not just toy versions.
      *   **Key Deliverables:**
          1.  Requirements list (cases to handle, distinctions to respect, constraints not to violate).
          2.  Considerations/reasons behind each requirement.
          3.  Classification: Non-negotiable vs. Camp Preferences.
          4.  Analysis of Desiderata vs. Prejudices (Representation vs. Relevance vs. "Mistake" camps).
          5.  Conflict Check: Can these requirements be met together?
          6.  Specific Question: Address the colleague's claim (Individuation of Action/Change vs. Relevance/Sameness).
          7.  Identifying the "Killer Constraint": Which single requirement rules out the most candidates?
      *   **Tone:** Analytical, rigorous, slightly weary of the confusion (matching the user's frustration), authoritative but open to nuance.
      *   **Constraint:** Do *not* score famous proposals (Dennett, Fodor, Shanahan, etc.). Just build the criteria.

  2.  **Deconstruct the Frame Problem:**
      *   *Origin:* McCarthy & Hayes (1969). Technical issue in situation calculus (how to represent what *doesn't* change without writing infinite frame axioms).
      *   *Expansion:* Fodor (1983), Dennett (1984). Became a philosophical problem about holism, relevance, and cognitive architecture.
      *   *Core Tension:* How does an agent know what information is relevant to an action without checking everything?
      *   *The "Wall":* The user is right. People talk past each other.
          *   Group A: It's a technical logic problem (solved by successor state axioms, etc.).
          *   Group B: It's a philosophical problem about belief fixation (unsolved, maybe unsolvable).
          *   Group C: It's a pseudo-problem (embodied cognition, dynamical systems).

  3.  **Drafting the Requirements List (The Spec):**
      *   *Requirement 1: Computational Tractability.* (The original complaint). Can't check all beliefs.
      *   *Requirement 2: Metaphysical/World Stability.* (The "painting the wall" case). Needs to model inertia correctly.
      *   *Requirement 3: Relevance Sensitivity.* (The "fuel" case). Needs to notice side effects that *matter* without being told explicitly every time.
      *   *Requirement 4: Action Individuation.* (The colleague's point). How do we define the boundaries of an event?
      *   *Requirement 5: Scalability/Robustness.* Works in the real world, not just blocks world.

  4.  **Classifying Requirements (Non-negotiable vs. Preferences):**
      *   *Tractability:* Non-negotiable. If it takes infinite time, it's not an agent.
      *   *World Stability:* Non-negotiable. If the robot thinks painting moves the wall, it's broken.
      *   *Relevance:* Contested. Is it logical entailment or pragmatic salience?
      *   *Representation:* Preference. Logic vs. Neural Nets vs. Embodied.

  5.  **Addressing the "Camps" (Desiderata vs. Prejudices):**
      *   *Classicists (GOFAI):* Want explicit representation of change/non-change. Prejudice: It must be syntactic.
      *   *Relevance Theorists:* Want a theory of salience. Prejudice: It's about belief fixation.
      *   *Skeptics/Embodied:* Think the framing is wrong. Prejudice: Representation is the error.
      *   *Synthesis:* The spec needs to be neutral enough to judge them all but strict enough to catch failures.

  6.  **Addressing the Colleague's Point (Individuation):**
      *   Is it separate? Yes. Before you ask "what changed?", you must define "what happened?". If actions are ill-defined, frame axioms are meaningless. This is often overlooked. It belongs on the list as a foundational prerequisite.

  7.  **Identifying Conflicts:**
      *   *Explicitness vs. Tractability:* If you represent everything explicitly (to be precise), you blow up computationally. If you represent nothing (to be fast), you miss side effects.
      *   *Context-Independence vs. Relevance:* Logic wants context-independent rules. Relevance is inherently context-dependent.

  8.  **Identifying the "Killer Constraint":**
      *   It's **Tractability without Prior Relevance Filtering**. i.e., The system must determine relevance *faster* than checking everything, without having a "relevance oracle" built-in. This is the Fodor/Dennett bottleneck.

  9.  **Refining the Output Structure:**
      *   Introduction: Acknowledge the confusion (validate the user).
      *   Section 1: The Specification (The Requirements).
      *   Section 2: Desiderata vs. Prejudices (The Camps).
      *   Section 3: The Colleague's Objection (Individuation).
      *   Section 4: The Conflict & The Killer Constraint.
      *   Conclusion: Summary for the piece.

  10. **Drafting Content (Iterative refinement):**
      *   *Self-Correction on "Solved":* Acknowledge that in *logic* (Reiter's successor state axioms), it's technically solved. The "Real Problem" is the cognitive one. I need to make sure the spec distinguishes these.
      *   *Refining the "Individuation" point:* Make sure to link it to the "granularity" of the frame.
      *   *Tone Check:* Keep it sharp. Avoid waffling. Use the user's language ("spec," "non-negotiable," "camp").

  11. **Final Review against User Prompt:**
      *   Requirements list? Yes.
      *   Cases (fuel, wall, planning)? Yes.
      *   Distinctions (Metaphysical, Epistemological, Computational)? Yes.
      *   Constraints (no surveying all beliefs)? Yes.
      *   Considerations behind each? Yes.
      *   Non-negotiable vs. Preferences? Yes.
      *   Desiderata vs. Prejudices? Yes.
      *   Conflicts/Incompatibilities? Yes.
      *   Colleague's point addressed? Yes.
      *   Killer Constraint identified? Yes.
      *   No scoring of proposals? Yes.

  12. **Final Polish:** Ensure clear headings and bullet points for readability. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to be careful not to solve the problem myself. I am building the *rubric* for judging solutions. I must remain neutral on *how* it is solved, only on *what* counts as a solution.

  *(Refining the "Individuation" point)*: The colleague is echoing a specific philosophical critique (maybe Davidsonian or related to event ontology). I should frame it as "Event Granularity." If you can't bound the action, you can't bound the frame.

  *(Refining the "Killer Constraint")*: It's not just tractability. It's *open-ended* tractability. A lookup table is tractable but doesn't scale. The constraint is "Generalizable Relevance Detection in Polynomial Time."

