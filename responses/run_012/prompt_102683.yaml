answer: |-
  This is the right move. The literature is a graveyard of people solving Problem A and claiming they've solved Problem B. To write this piece, you need a neutral arbitration document—a spec sheet that separates the engineering constraints from the philosophical baggage.

  Here is the specification for a genuine solution to the Frame Problem, structured by requirements, camp biases, and the critical conflicts that make this problem notorious.

  ### Part 1: The Specification (Requirements List)

  A theory counts as a solution only if it satisfies the following constraints. I have categorized them by **Non-Negotiable** (failure here means the system doesn't work) and **Camp Preferences** (failure here means the system offends a specific school of thought but might still function).

  #### 1. The Computational Constraint (Tractability)
  *   **Requirement:** The system must determine the consequences of an action (and non-consequences) without iterating through the total set of its beliefs or world states.
  *   **The Case:** The robot must not check if its fuel is low, the wall's weight, or the color of the ceiling every time it lifts a block. It must access only relevant data.
  *   **Consideration:** This is the original McCarthy & Hayes complaint. If the update procedure is $O(N)$ where $N$ is total beliefs, the agent freezes in a complex world.
  *   **Status:** **Non-Negotiable.**
  *   **Why:** An agent that halts to compute frame axioms is a statue.

  #### 2. The Inertia Constraint (Metaphysical Stability)
  *   **Requirement:** The system must assume properties persist by default unless there is a specific cause for change.
  *   **The Case:** Repainting a wall does not move it, does not change its weight, and does not change the phone number of the building owner.
  *   **Consideration:** This addresses the "what stays the same" issue. It requires a mechanism for default persistence that isn't just a list of explicit "non-change" axioms.
  *   **Status:** **Non-Negotiable.**
  *   **Why:** Without this, the system cannot distinguish signal from noise. Every action becomes a cosmic reset.

  #### 3. The Relevance Constraint (Salience Detection)
  *   **Requirement:** The system must identify *exceptions* to inertia based on context, not just pre-coded rules.
  *   **The Case:** If the robot is carrying a bomb, dropping the block *does* matter. If the robot is low on fuel, lifting the block *does* matter. The system must flag these side-effects without being explicitly told "check fuel before lifting" for every possible action.
  *   **Consideration:** This is the Fodor/Dennett expansion. It's not just about what stays the same; it's about noticing what *matters* when the usual rules break.
  *   **Status:** **Non-Negotiable** (for a cognitive solution); **Preference** (for a strict logic solution).
  *   **Why:** If the system handles standard physics but misses context-dependent risks (the bomb), it is brittle. However, strict logicians argue this is a "planning problem," not a frame problem.

  #### 4. The Event Individuation Constraint (The Colleague's Point)
  *   **Requirement:** The system must be able to bound an action or event in time and space before assessing its frame.
  *   **The Case:** Did "opening the door" cause the draft? Or did "opening the door *while the wind was blowing*"? The system must define the granularity of the action to know what falls inside the frame.
  *   **Consideration:** You cannot determine what changes if you haven't defined what the change *is*.
  *   **Status:** **Non-Negotiable.**
  *   **Why:** This is foundational. If actions are ill-defined (e.g., holistic events vs. atomic steps), frame axioms cannot be applied consistently.

  #### 5. The Representation Constraint (Explicitness)
  *   **Requirement:** The system must maintain an internal model that distinguishes between the world state and the agent's knowledge of the world state.
  *   **Consideration:** Classicists demand explicit symbols. Connectionists argue distributed states suffice.
  *   **Status:** **Camp Preference.**
  *   **Why:** Embodied cognition proponents argue that if the body handles the inertia (e.g., you don't need to calculate that the floor supports you), the "representation" requirement is a category error. A solution could theoretically bypass this by not representing the world propositionally.

  ---

  ### Part 2: Desiderata vs. Prejudices (The Camps)

  This is where you expose why everyone thinks they've won. They are optimizing for different lines in the spec above.

  | Camp | Core Belief | What they treat as a **Desideratum** | What is actually a **Prejudice** |
  | :--- | :--- | :--- | :--- |
  | **The Logicians** (McCarthy, Reiter) | It's a syntax problem. | **Metaphysical Stability.** If we can write successor state axioms that logically entail persistence, the problem is solved. | **Explicitness.** They assume the solution *must* be a formal calculus. They often dismiss the Relevance Constraint as "planning," not framing. |
  | **The Cognitivists** (Fodor, Dennett) | It's a mind problem. | **Relevance.** A solution must explain how a mind filters information holistically without combinatorial explosion. | **Representation.** They assume there *must* be a central belief system. They treat the Computational Constraint as a psychological mystery rather than an engineering bottleneck. |
  | **The Skeptics** (Brooks, Dynamical Systems) | It's a framing error. | **Tractability.** Real agents don't solve the frame problem; they avoid it by coupling with the environment. | **Individuation.** They argue actions aren't individuated internally at all, but emerge from interaction. They reject the Inertia Constraint as a phantom of representationalism. |

  **The Conflict:**
  You cannot satisfy the **Logician's** desire for formal proof of stability *and* the **Cognitivist's** desire for open-ended relevance detection *using the same mechanism*.
  *   To guarantee stability logically, you need closed-world assumptions (which kill relevance).
  *   To allow relevance, you need open-world assumptions (which kill logical guarantees of stability).
  *   To satisfy the **Skeptic**, you have to delete the "Internal Model" requirement entirely, which makes the Logician and Cognitivist scream that you haven't solved the problem, you've dissolved it.

  ---

  ### Part 3: The Colleague's Objection (Individuation)

  **Is this the same requirement in different clothes?**
  No. It is distinct and foundational.

  **Why it belongs on the list:**
  The standard Frame Problem assumes the action $A$ is given. It asks: *Given $A$, what else changes?*
  Your colleague is asking: *What constitutes $A$?*

  If I "move the block," do I also "move the dust mites on the block"? Do I "change the center of gravity of the universe"?
  *   If the system treats actions as atomic (Move(Block)), it solves Tractability but fails Relevance (misses the dust mites if they matter).
  *   If the system treats actions as holistic (Move(Block, Dust, Air, Gravity...)), it solves Relevance but fails Tractability.

  **Verdict:**
  This is **Requirement #4 (Event Individuation)**. It is a **Non-Negotiable**.
  If a theory cannot define the boundaries of the event to which the frame applies, it cannot apply frame axioms. Many "solutions" smuggle in a pre-defined granularity (e.g., "we only care about blocks") which solves the problem by fiat. A real solution must explain how the agent *decides* the granularity of the action based on context.

  ---

  ### Part 4: The Incompatibility & The Killer Constraint

  **Can these be met together?**
  Likely not. This is the story of your piece.

  There is a tension between **Requirement 1 (Tractability)** and **Requirement 3 (Relevance)** that borders on a trade-off law.
  *   To be **Tractable**, you must ignore most data (close the frame).
  *   To be **Relevant**, you must be sensitive to unexpected data (open the frame).

  **The Killer Constraint:**
  **Requirement 3: The Relevance Constraint (specifically: *Context-Sensitive Exception Detection*).**

  **Why it rules candidates out:**
  1.  **It kills the Logicians:** Successor state axioms (the standard "solution" in AI) work beautifully *if* you know all the relevant predicates in advance. They fail when a new, unforeseen relevance arises (the bomb in the room). They require the relevance to be encoded in the logic *before* the action.
  2.  **It kills the Connectionists:** Neural nets handle relevance well (salience maps), but they struggle with **Requirement 2 (Inertia)**. They are notoriously bad at assuming things *don't* change without retraining or explicit architectural bias. They drift.
  3.  **It kills the Skeptics:** Embodied agents handle Tractability and Relevance well in *their* niche, but fail **Requirement 5 (Scalability/Robustness)** when removed from their specific environmental coupling. They don't solve the general problem; they dodge the specific instance.

  **The "Wall" you hit:**
  The reason everyone tells you it's "solved" is because they solved **Requirement 2 (Inertia)** using formal logic (Reiter, 1991).
  The reason everyone tells you it's "unsolved" is because **Requirement 3 (Relevance)** remains an open problem in cognitive science (how do we know what matters without checking everything?).

  **For your piece:**
  If you define the Frame Problem as "How do we represent non-change efficiently?" -> **Solved.**
  If you define the Frame Problem as "How does an agent know what is relevant in an open world?" -> **Unsolved.**

  Your spec forces the interviewee to declare which problem they think they are solving. If they claim to solve both, ask them how they reconcile **Closed-World Logic** (for stability) with **Open-World Sensitivity** (for relevance) without violating **Computational Tractability**. If they can't answer that, they are selling a partial solution as a whole one.
