  ### The Case: "Legally Blind" (US Social Security Administration Definition)

  **The Classification:** An individual is classified as "Statutorily Blind" for the purposes of the US Social Security Administration (SSA) and Internal Revenue Service (IRS).
  **The Concrete Box:** The disability determination field on Form SSA-827 or the "Blindness" checkbox on IRS Form 1040 (Schedule A).

  **(i) The Conventional Cut-Point:**
  The definition rests on a visual acuity of 20/200 or less in the better eye with corrective lenses, *or* a visual field limitation of 20 degrees or less. The 20/200 threshold is conventional. Neighboring societies (e.g., the UK) use 6/60 (mathematically equivalent but culturally distinct standard), and historical US definitions have shifted. There is no biological cliff at 20/200 where the eye suddenly stops functioning; a person with 20/190 vision is functionally nearly identical to one with 20/210. The line could have been drawn at 20/150 or 20/400 with equal physiological justification.

  **(ii) The Non-Conventional Property:**
  The property being cut is visual capacity (acuity and field). This is a graded, causally efficacious feature. It determines the ability to read standard print, recognize faces, or drive safely. This ordering is discovered via Snellen charts and perimetry, not stipulated by the law. The law does not create the vision loss; it responds to it.

  **(iii) The Inductive Weight:**
  Knowing an individual is "Legally Blind" licenses predictions about unobserved features that knowing their specific visual acuity (the gradient) would not.
  *   *Checkable Prediction:* A person labeled "Legally Blind" is eligible for the Blindness Tax Credit (IRS Pub 502) and expedited SSDI processing (SSA Blue Book 2.00).
  *   *Why the Gradient Fails:* If you know a person has 20/100 vision (gradient), you cannot predict tax credit eligibility without knowing the convention. Conversely, if you know a person has 20/400 vision but has not filed the paperwork to be *classified* as "Legally Blind," they do not receive the benefit. The label bundles the biological fact with a specific administrative trajectory (e.g., specific vocational rehabilitation protocols) that the raw biological data does not guarantee. The label predicts *institutional interaction* better than the biology alone.

  **(iv) The Normative Stakes:**
  Dissolving the convention would not merely rename anything; the safety net would vanish. If we removed the "Legally Blind" category and treated vision as a pure continuum for benefits, the administrative cost of assessing every fractional difference in acuity would be prohibitive, likely resulting in the elimination of the specific tax credit and expedited processing. Something we care about (targeted resource allocation for the severely impaired) would be lost.

  ***

  ### Audit of the Case

  | Constraint | Favoured Position | Reasoning |
  | :--- | :--- | :--- |
  | **(i) Conventional Cut** | **Constitutive** | The 20/200 line is drawn by human agreement. It brings the *kind* "Legally Blind" into existence as a legal category; without the decision, the category does not exist. |
  | **(ii) Real Property** | **Registration** | Visual acuity exists independently of the label. The classification merely registers a pre-existing biological division (low vision vs. normal vision). |
  | **(iii) Inductive Weight** | **Constitutive** | The predictive power regarding benefits and protocols comes from the social kind (the legal status), not the biology. The biology doesn't cause the tax credit; the status does. |
  | **(iv) Normative Stakes** | **Pragmatic** | The value of the kind lies in its usefulness for distributing resources. There is no "fact of the matter" that we *should* have this category other than that it serves a social function we value. |

  ***

  ### The Pivot Feature: The Regulatory Adoption of a Clinical Metric

  The single feature that allows the **Registration** view (it tracks real biology) and the **Constitutive** view (it creates a legal status) to both be right is the **Regulatory Adoption of a Clinical Metric**.

  *   **Registration is right** because the metric (Snellen chart) measures an independent physical reality. The state does not invent the blindness; it measures it.
  *   **Constitutive is right** because the *adoption* of that specific metric as a threshold for rights creates a new social reality. The metric exists in the clinic, but the *kind* "Legally Blind" exists only in the regulation.

  **Removal Test:**
  If you remove the **Clinical Metric** (the independent anchor) and rely solely on the **Functional Need** (e.g., "eligible if you cannot work"), the case degenerates into the familiar **looping case**.

  *   *Why:* Without the hard anchor of the Snellen chart, the classification depends entirely on the individual's ability to demonstrate incapacity. The label "Legally Blind" (now meaning "unable to work due to vision") becomes an incentive. Individuals may alter their behavior (performing inability) to secure the label. Doctors may alter their certifications to help patients access resources. The prevalence of the kind expands and contracts based on economic conditions rather than biological facts. The label reshapes the labelled population and the medical practices surrounding them.
  *   *Result:* The **Clinical Metric** prevents looping by tethering the social kind to a biological fact that is difficult to manipulate. Removing it unleashes the feedback loop where the social consequence (benefits) reshapes the biological claim (disability).

  ***

  ### Impossibility Check

  I do not believe the four constraints cannot be met; the case above satisfies them. However, if forced to name one constraint I would give up, it would be **(iii) Inductive Weight**.

  *   **Cost:** Giving up (iii) reduces the classification to a mere **Registration** view. If the label predicts *nothing* more than the gradient (e.g., if benefits were scaled continuously with acuity rather than triggered by the threshold), the "kind" loses its categorical power. It becomes a descriptive statistic rather than a social kind. We would lose the administrative efficiency and the clear moral signal that the "kind" provides (the sharp distinction between those who qualify for the safety net and those who do not). The case would cease to be interesting for a seminar on *constructed kinds* and would become a seminar on *measurement*.
