      If the goal is to describe *recursive self-improvement with bottlenecks*, **Economic Growth** is the standard counter in the literature (Hanson, etc.). I'll use that.

      *Wait, one more check:* The user wants me to take a view. I should argue that the analogy is *dangerous* because it creates a false sense of physical inevitability.

