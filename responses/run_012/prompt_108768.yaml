  2.  **Brainstorming the Physics (Nuclear Chain Reaction):**
      *   *Fissile Material:* U-235/Pu-239. Potential energy stored in bonds.
      *   *Neutrons:* The trigger/carrier. One hits, splits atom, releases energy + more neutrons.
      *   *Critical Mass:* Minimum amount of fuel needed to sustain the reaction (overcoming leakage).
