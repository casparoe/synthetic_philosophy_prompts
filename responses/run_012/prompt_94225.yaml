answer: |-
  Here is a ranking of the five moves based on how well they withstand Gould and Lewontin's critique, ordered from strongest to weakest justification for calling a trait an adaptation.

  1.  **Constraint-first move:** This ranks highest because it directly implements Gould and Lewontin's methodological demand to test and reject non-adaptive null hypotheses (like drift or constraint) before inferring selection.
  2.  **Convergence move:** Independent evolution of a trait provides strong empirical evidence for selective pressure, though it cannot definitively rule out universal developmental constraints that might produce parallel forms.
  3.  **Cost-accounting move:** While showing a trait is costly proves selection is currently *maintaining* it, this move flags the distinction between maintenance and origin, as costly traits can still be byproducts of other selected features.
  4.  **Exaptation move:** This move actually concedes the spandrel critique regarding the trait's *origin*, shifting the claim to current utility rather than historical adaptation and thus lowering credence that the trait is an adaptation in the strict sense.
  5.  **Perfection move:** This ranks lowest because it relies on the very "just-so" storytelling and assumption of optimal design that the *Spandrels* paper explicitly identifies as the adaptationist fallacy, offering no evidentiary weight against non-adaptive explanations.
