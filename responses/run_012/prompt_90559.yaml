  The dry-erase marker squeaked, a high thin complaint that made Elena wince. She capped it and set it down on the tray, leaving the numbers hanging on the whiteboard like an accusation. Outside the conference room window, the city of Oakhaven sprawled under a gray November sky, gridlocked and waiting. Inside, the air was stale, recycled too many times through the HVAC system.

  "Run it again," Marcus said. He was leaning forward, elbows on the table, representing the Northside Community Coalition. His voice wasn't angry, just tired. "Because from where I sit, it looks like your model thinks my neighbors are healthier than they are."

  Elena rubbed her temples. "It's not about what the model thinks, Marcus. It's about what's there."

  "We're talking about the hypertension outreach program," Director Shaw interjected, tapping a pen against his notepad. "We have five hundred slots. Budget is fixed. We need to know why Northside is getting four hundred invites and Hillside is getting one hundred."

  "Because Northside has higher prevalence," Elena said. She turned back to the board. "Let's strip the code away. Let's look at the world."

  She drew two columns. **Northside** and **Hillside**.

  "Imagine a thousand people in each neighborhood," Elena said, writing *1,000* under both. "In Northside, due to stress, food access, legacy infrastructure—pick your cause—twenty percent have undiagnosed hypertension. That's two hundred sick people. Eight hundred healthy."

  She moved to the second column. "In Hillside, the prevalence is lower. Five percent. Fifty sick people. Nine hundred and fifty healthy."

  Marcus nodded slowly. "Okay. So there's more sickness in Northside. We know that. But the model is supposed to find the sick people."

  "It is calibrated," Elena said. "That means if the model gives someone a risk score of eighty percent, eighty percent of people with that score actually have the condition. It holds true for Northside. It holds true for Hillside. The score means the same thing in both places."

  "So where's the unfairness?" Shaw asked.

  "Here," Elena said. She picked up the marker again. "Suppose we want to be fair by catching the same fraction of sick people in both groups. Let's say we want to find fifty percent of the hypertensive residents in each neighborhood."

  She wrote quickly. "Northside: Fifty percent of two hundred sick people is one hundred true positives. Hillside: Fifty percent of fifty sick people is twenty-five true positives."

  "Okay," Marcus said. "So we catch more people in Northside because there are more sick people. That makes sense."

  "But we have to fill slots," Elena said. "And to keep the model calibrated, the ratio of sick to healthy people we flag has to stay consistent. If we flag one hundred sick people in Northside, and our model is calibrated to a positive predictive value of eighty percent, then for every four sick people we flag, we flag one healthy person by mistake."

  She wrote *25 False Positives* under Northside. "So in Northside, we flag one hundred twenty-five people total. One hundred sick, twenty-five healthy. The healthy people get a false alarm. They waste a morning at the clinic. They get stressed."

  "And Hillside?" Shaw asked.

  "Same calibration," Elena said. "We caught twenty-five sick people. To keep that eighty percent accuracy, we need five healthy people flagged alongside them."

  She wrote *5 False Positives* under Hillside.

  "Total slots used," Elena said, summing the columns. "One hundred twenty-five in Northside. Thirty in Hillside. Total one hundred fifty-five. We have five hundred slots. We can lower the threshold. We can catch more people."

  "But look at the false alarms," Marcus said, pointing at the board. "In Northside, you're bothering twenty-five healthy people. In Hillside, you're bothering five. That's not equal burden."

  "That's Equalized Opportunity," Elena said. "We caught the same fraction of sick people. But the False Positive Rate is different. In Northside, twenty-five out of eight hundred healthy people got flagged. That's about three percent. In Hillside, five out of nine hundred and fifty healthy people got flagged. That's half a percent."

  "So Northside absorbs the noise," Marcus said.

  "Because Northside carries the risk," Elena replied. "If you want to equalize the False Positive Rate—if you want the same fraction of healthy people to be bothered in both neighborhoods—you have to lower the threshold in Hillside. You have to flag more healthy people in Hillside to match Northside's three percent."

  "Do it," Shaw said.

  Elena erased the Hillside false positives. "Okay. Three percent of nine hundred and fifty healthy people in Hillside is about twenty-nine people."

  She wrote *29 False Positives*.

  "Now, to keep the model calibrated," Elena said, her voice tightening, "we have to maintain that ratio. If we flag twenty-nine healthy people, and we want eighty percent of our flags to be correct, we need to flag one hundred and sixteen sick people."

  She stopped. The marker hovered over the board.

  "We can't," she said softly.

  "Why not?" Marcus asked.

  "Because there are only fifty sick people in Hillside total," Elena said. "You're asking the model to find one hundred and sixteen sick people in a population of fifty. To equalize the false positive burden, you have to break the calibration. You have to tell healthy people in Hillside they are sick at a much higher rate than the score justifies, or you have to flag everyone and still not meet the quota."

  The room went quiet. The hum of the projector was the only sound.

  "So we can't have equal catch rates and equal false alarm rates," Shaw said. "Not while the score means the same thing."

  "No," Elena said. "Chakraborty and others proved it years ago. If the base rates are different, you can have calibration, or you can have equal error rates. You cannot have both. It's not a bug in the loss function. It's arithmetic."

  Marcus leaned back, crossing his arms. "So what you're saying is, because my neighborhood got dealt a bad hand historically, the math says we have to accept either fewer resources or more false alarms. The model locks in the disparity."

  "The model reflects the disparity," Elena corrected, though she felt the weakness in her own voice. "If we force the error rates to match, we break the calibration. A score of 'high risk' in Northside means you're likely sick. A score of 'high risk' in Hillside, under that equalized regime, would mean you're probably healthy. We'd be lying to people in Hillside to make the errors look equal."

  "Who absorbs the error?" Dr. Aris asked.

  The philosopher had been silent for an hour, sketching in a notebook. He hadn't looked up until now.

  "Excuse me?" Shaw said.

  "The error," Aris said, looking at Elena. "In the calibrated scenario, Northside absorbs the false positives. Twenty-five healthy people bothered versus five. In the equalized error scenario, you'd have to flood Hillside with false positives to match the rate, but you run out of sick people to balance the ratio. So the constraint binds on the truth."

  "Northside absorbs the noise because Northside has the signal," Elena said. "The healthy people in the high-prevalence group pay the tax for the sick people in their community."

  "And the low-prevalence group?" Marcus asked. "They get ignored."

  "They get fewer slots," Elena said. "Because there are fewer sick people to find."

  "Or," Aris said, closing his notebook. "We ask why the labels exist only for those we screen."

  Elena frowned. "The model predicts undiagnosed hypertension."

  "Undiagnosed," Aris repeated. "The label 'hypertensive' in your training data only exists for people who went to a doctor somehow. Your base rates aren't facts of nature, Elena. They're facts of access. Northside has higher recorded prevalence because they've been screened more aggressively in the past due to prior interventions. Hillside has lower prevalence because nobody looks there."

  "That's selection bias," Elena said. "We adjusted for that."

  "Did you?" Aris stood up and walked to the window. "Or did you just calibrate to the visible world? If the base rate difference is an artifact of who we've chosen to look at, then the impossibility theorem isn't a wall. It's a mirror. You're trying to balance a scale where one side is weighted with lead and the other with straw, and you're blaming the fulcrum."

  Elena looked at the board. The numbers were clean. *1,000. 200. 50.* They looked solid. But Aris was right. The *200* wasn't gravity. It was history.

  "So what do we do?" Shaw asked. The question hung there, heavy and desperate. "Do we swap the model? Do we use a different loss function?"

  "No," Elena said. She picked up the eraser. She didn't wipe the numbers away yet. "Changing the loss function doesn't change the prevalence. It just hides the trade-off. It makes the calibration lie so the error rates look pretty."

  "Do we ignore the model?" Marcus asked.

  "If the prevalence is the problem," Elena said, looking at the city outside, "then the model isn't the place to fix it. We can't math our way out of a public health crisis. If we want equal error rates, we need equal base rates. We need Hillside to have the same underlying risk as Northside, or vice versa."

  "That's not a data problem," Shaw said. "That's a housing problem. A food problem. A budget problem I don't have."

  "Then we don't have a fairness solution," Elena said. "We have a triage situation."

  She finally wiped the board. The numbers smeared into gray smudges before disappearing. The white surface was blank, but the room didn't feel lighter. The impossibility wasn't in the code anymore. It was in the room, in the budget, in the zip codes outside the window.

  "We send the invites based on the calibrated model," Shaw said eventually. "Northside gets the bulk. We document the disparity."

  "And the community?" Marcus asked.

  "We tell them the truth," Elena said. "We tell them the math says there are more sick people there. And we tell them that making the numbers look equal wouldn't make the sickness go away."

  Marcus stood up. He didn't look satisfied, but he looked like he understood. "Just don't call it fair," he said.

  "We won't," Elena said.

  He left. Shaw followed, already on his phone. Aris lingered for a moment, looking at the clean whiteboard.

  "The labels," he said quietly. "Remember that the sick people you miss in Hillside are still sick."

  "I know," Elena said.

  "Good." He left.

  Elena capped the marker. She turned off the projector. The room was dark now, save for the gray light from the window. She looked out at Oakhaven. The model was done. The work was just beginning, and for the first time, she didn't think there was an algorithm that could solve it.
