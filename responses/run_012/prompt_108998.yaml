  # Seminar Case: The Mixed-Strategy Anchor

  ## 1. The Game Matrix

  Consider a two-player finite normal-form game $G = \langle N, S, u \rangle$ with players $N = \{1, 2\}$. Player 1 (Row) has strategies $S_1 = \{T, M, B\}$ and Player 2 (Column) has strategies $S_2 = \{L, C, R\}$. The payoff matrix $(u_1, u_2)$ is as follows:

  | Row \ Col | $L$ | $C$ | $R$ |
  | :--- | :---: | :---: | :---: |
  | **$T$** | $8, 8$ | $3, 3$ | $0, 0$ |
  | **$M$** | $3, 3$ | $2, 4$ | $3, 3$ |
  | **$B$** | $0, 0$ | $3, 3$ | $8, 8$ |

  **Key Structural Features:**
  *   **Symmetry:** Player 1's payoffs are symmetric across the diagonal ($T/B$ and $L/R$).
  *   **Asymmetry:** Player 2's payoff in cell $(M, C)$ is elevated to $4$ (while Player 1's remains $2$). This specific perturbation is crucial for the iteration requirement.

  ---

  ## 2. Step-by-Step Elimination Analysis

  ### Phase 1: Pure-Strategy IESDS (Stall)
  We first check for strict dominance by pure strategies.
  *   **Player 1:**
      *   $T$ vs $M$: $T$ wins against $L$ ($8>3$) and $C$ ($3>2$), but loses against $R$ ($0<3$).
      *   $B$ vs $M$: $B$ wins against $R$ ($8>3$) and $C$ ($3>2$), but loses against $L$ ($0<3$).
      *   $T$ vs $B$: Cyclic preferences ($T$ beats $B$ on $L$, $B$ beats $T$ on $R$).
      *   *Result:* No pure strategy strictly dominates another for Player 1.
  *   **Player 2:**
      *   $L$ vs $C$: $L$ wins against $T$ ($8>3$), loses against $M$ ($3<4$), loses against $B$ ($0<3$).
      *   $R$ vs $C$: $R$ wins against $B$ ($8>3$), loses against $T$ ($0<3$), loses against $M$ ($3<4$).
      *   *Result:* No pure strategy strictly dominates another for Player 2.

  **Conclusion:** The pure-strategy iterated elimination procedure leaves the game entirely untouched. The set of survivors is $S_1 \times S_2$.

  ### Phase 2: Mixed-Strategy IESDS (Iteration)

  **Step 1: Elimination of $M$**
  Consider Player 1's strategy $M$. Compare it to the mixed strategy $\sigma_1 = 0.5 T + 0.5 B$.
  *   Against $L$: $u_1(\sigma_1, L) = 0.5(8) + 0.5(0) = 4$. Since $4 > 3 = u_1(M, L)$, $\sigma_1$ wins.
  *   Against $C$: $u_1(\sigma_1, C) = 0.5(3) + 0.5(3) = 3$. Since $3 > 2 = u_1(M, C)$, $\sigma_1$ wins.
  *   Against $R$: $u_1(\sigma_1, R) = 0.5(0) + 0.5(8) = 4$. Since $4 > 3 = u_1(M, R)$, $\sigma_1$ wins.

  $\sigma_1$ **strictly dominates** $M$. We eliminate $M$.
  *Reduced Game:* Rows $\{T, B\}$, Columns $\{L, C, R\}$.

  **Step 2: Elimination of $C$**
  Now consider Player 2's strategy $C$ in the reduced game (where Row plays only $T$ or $B$). Compare $C$ to the mixed strategy $\sigma_2 = 0.5 L + 0.5 R$.
  *   Against $T$: $u_2(T, \sigma_2) = 0.5(8) + 0.5(0) = 4$. Since $4 > 3 = u_2(T, C)$, $\sigma_2$ wins.
  *   Against $B$: $u_2(B, \sigma_2) = 0.5(0) + 0.5(8) = 4$. Since $4 > 3 = u_2(B, C)$, $\sigma_2$ wins.
  *   *(Note: We no longer check against $M$ because it has been eliminated. Initially, $C$ was not dominated because $u_2(M, C)=4$ beat the mix's expected payoff of $3$. The elimination of $M$ removes this shield.)*

  $\sigma_2$ **strictly dominates** $C$ in the reduced game. We eliminate $C$.
  *Reduced Game:* Rows $\{T, B\}$, Columns $\{L, R\}$.

  **Step 3: Termination**
  In the remaining 2x2 game:
  *   $T$ vs $B$: $T$ prefers $L$, $B$ prefers $R$. No dominance.
  *   $L$ vs $R$: $L$ prefers $T$, $R$ prefers $B$. No dominance.
  No further strategies (pure or mixed) can be eliminated.

  **Surviving Set:** $\{T, B\} \times \{L, R\}$.

  ### Phase 3: Order Independence
  Strict dominance satisfies the **Order Independence Property**: the final set of survivors is unique regardless of the sequence of eliminations.
  In this specific game, the order is *forced* at the first stage (only $M$ is dominated initially; $C$ is not). However, the property holds because the set of strictly dominated strategies is well-defined at every stage. Had we constructed a variant where both $M$ and $C$ were initially dominated, eliminating $C$ first would leave $M$ strictly dominated by $\sigma_1$ (since $\sigma_1$'s payoff depends only on $L$ and $R$, which remain). The uniqueness of the survivor set is guaranteed by the transitivity and monotonicity of strict inequalities, not by the availability of multiple paths.

  ---

  ## 3. Rationalizability and Nash Equilibrium Verification

  **Claim 1: Eliminated strategies are never Best Responses (Rationalizability).**
  A strategy survives iterated elimination of strictly dominated strategies (IESDS) if and only if it is rationalizable (Pearce, 1984).
  *   **Strategy $M$:** Is there any belief $\mu \in \Delta(L, C, R)$ such that $M$ is a best response?
      *   $u_1(M, \mu) = 3\mu_L + 2\mu_C + 3\mu_R$.
      *   $u_1(\sigma_1, \mu) = 4\mu_L + 3\mu_C + 4\mu_R$.
      *   Since $\sigma_1$ yields strictly higher payoff against *every* pure strategy, it yields strictly higher payoff against *any* mixture. $M$ is never a best response.
  *   **Strategy $C$:** In the reduced game, is there any belief $\nu \in \Delta(T, B)$ such that $C$ is a best response?
      *   $u_2(\nu, C) = 3\nu_T + 3\nu_B = 3$.
      *   $u_2(\nu, \sigma_2) = 4\nu_T + 4\nu_B = 4$.
      *   $C$ is never a best response in the reduced context.

  **Claim 2: Nash Equilibria are preserved.**
  The Nash Equilibria (NE) of the original game must lie within the surviving set.
  *   **Pure NE:** $(T, L)$ yields $(8, 8)$. Deviations yield less. $(B, R)$ yields $(8, 8)$. Deviations yield less. Both survive.
  *   **Mixed NE:** In the surviving 2x2 subgame, there is a mixed NE where players play $(0.5 T, 0.5 B)$ and $(0.5 L, 0.5 R)$. Expected payoff is 4.
      *   Does Player 1 want to deviate to $M$? $u_1(M, 0.5 L + 0.5 R) = 3$. Since $3 < 4$, no.
      *   Does Player 2 want to deviate to $C$? $u_2(0.5 T + 0.5 B, C) = 3$. Since $3 < 4$, no.
  *   **Conclusion:** All NE of the original game are contained in the surviving set $\{T, B\} \times \{L, R\}$. The elimination procedure did not discard any equilibrium.

  ---

  ## 4. Philosophical Payoff: The Epistemic Reading

  This case anchors a discussion on the epistemic conditions required for solution concepts.

  **1. Common Knowledge of Rationality (CKR) vs. Beliefs:**
  Pure IESDS relies on CKR: "I know you are rational, you know I know..." However, Mixed IESDS requires more. For Player 1 to eliminate $M$ based on $\sigma_1$, Player 1 must treat $\sigma_1$ as a available plan. More critically, for the *iteration* to hold (Player 2 eliminating $C$), Player 2 must know that Player 1 will not play $M$.
  *   **Epistemic Condition:** This requires **Common Knowledge of Rationality** combined with the **Von Neumann-Morgenstern axioms** (specifically Independence). Agents must maximize expected utility over lotteries.
  *   **Belief Hierarchies:** Player 2 eliminates $C$ only because they believe Player 1 assigns probability 0 to $M$. This belief is justified because Player 2 knows Player 1 is rational and knows the payoffs. The "shield" at $(M, C)$ (where $4 > 3$) is broken only when Player 2 is certain Player 1 sees $M$ as dominated.

  **2. Why No Unique Prediction?**
  Despite eliminating $M$ and $C$, we are left with a 2x2 coordination/anti-coordination structure (two pure NE, one mixed NE).
  *   **The Lesson:** Rationalizability (surviving IESDS) is a *necessary* condition for play, not a *sufficient* one. Knowing that agents are rational and this knowledge is common does not tell us *which* rationalizable equilibrium they will coordinate on.
  *   **Implication:** IESDS cleans the menu of "irrational" options, but it does not solve the coordination problem. To predict a unique outcome, we need stronger epistemic assumptions (e.g., Common Knowledge of Conjectures) or refinements (e.g., Risk Dominance).

  ---

  ## 5. Perturbation: The Fragility of Weak Dominance

  Let us perturb the payoff at $(M, C)$ for Player 1 from $2$ to $3$.
  *   **New Payoff:** $u_1(M, C) = 3$.
  *   **New Comparison:** $\sigma_1 = 0.5 T + 0.5 B$ yields $3$ against $C$. $M$ yields $3$.
  *   **Result:** $M$ is now **weakly dominated** by $\sigma_1$ (strict against $L, R$; equal against $C$).

  **Consequences:**
  1.  **Loss of Order Independence:** Weak dominance is order-dependent.
      *   *Path A:* Eliminate $M$ first. Then $C$ becomes strictly dominated (as before). Survivors: $\{T, B\} \times \{L, R\}$.
      *   *Path B:* Suppose we also perturb Player 2's payoffs to make $C$ weakly dominated initially. If we eliminate $C$ first, $M$ might remain a best response against the remaining strategies if the specific tie-breaking conditions change. (In this specific matrix, $M$ remains weakly dominated, but in general, weak elimination can alter the dominance status of other strategies depending on the order).
  2.  **Loss of Nash Equilibrium:**
      *   In the perturbed game, $(M, C)$ is now a **Nash Equilibrium**.
          *   Row: $T \to 3, B \to 3, M \to 3$. ($M$ is a best response).
          *   Col: $L \to 3, R \to 3, C \to 4$. (Wait, Col payoff at $(M,C)$ was 4).
          *   Let's ensure $(M,C)$ is NE for both. Set $u_2(M, C) = 4$ (as in original) and $u_1(M, C) = 3$.
          *   Row BR to $C$: $T(3), M(3), B(3)$. $M$ is BR.
          *   Col BR to $M$: $L(3), C(4), R(3)$. $C$ is BR.
          *   **$(M, C)$ is a NE.**
      *   If we apply Iterated Elimination of *Weakly* Dominated Strategies (IEWDS) and remove $M$, **we eliminate a Nash Equilibrium.**

  **Solution Concept Revelation:**
  This contrast reveals why Strict Dominance is the gold standard for "rationality."
  *   **Strict Dominance:** Removes strategies that are *always* worse. No rational agent would ever play them. Preserves all NE.
  *   **Weak Dominance:** Removes strategies that are *sometimes* worse and *never* better. However, a rational agent might play a weakly dominated strategy if they believe the opponent plays the specific strategy that creates the tie (e.g., Row plays $M$ believing Col plays $C$). Eliminating them assumes agents avoid ties in a specific way, which is not required by rationality alone. It sacrifices the guarantee of preserving Nash Equilibria for a stronger reduction of the strategy space.
