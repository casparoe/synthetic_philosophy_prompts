          *   *Score:* Good effort, but lacks philosophical precision regarding the moral/legal distinction requested by the prompt's setup.

      *   **Part (b):**
          *   *Claim:* Walzer defends MEC via *jus ad bellum* / *jus in bello* separation.
          *   *Claim:* Practicality ("unworkable"), epistemic limitations ("not in a position to judge"), and responsibility allocation ("leaders... rather than those who were sent").
          *   *Claim:* McMahan objects because *ad bellum* applies to combatants. Unjust killing = murder. Asymmetry.
          *   *Critique:* The student spends the first half of (b) explaining Walzer's *defense* of MEC, not the *objection* to it. The prompt asks to "Set out the principal objection." While explaining Walzer provides context, the core task is the Revisionist objection. The student does get to McMahan in the second paragraph. The explanation of McMahan is generally accurate (objective wrongness of unjust combatants). However, the first paragraph is arguably off-topic for "Set out the objection," though it sets up the contrast. The explanation of the objection (McMahan's view) is solid.
