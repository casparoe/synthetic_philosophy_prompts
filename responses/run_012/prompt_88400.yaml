      *   **Part (b) (6 points):** Set out the *principal objection* to MEC. (Usually associated with Jeff McMahan/Revisionism).
      *   **Part (c) (8 points):** If the objection is sound, does it follow that unjust soldiers are *blameworthy*? (This requires distinguishing *objective wrongness* from *subjective blameworthiness/culpability*).

