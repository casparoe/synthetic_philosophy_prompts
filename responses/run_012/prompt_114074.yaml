answer: |-
  Your conscience-as-veto picture has the better of it because moral decency requires personal responsibility for actions, whereas Jonas's view conflates lawful compliance with moral goodness.

  On (a), your picture does not have to simply hope monsters are rare, provided you distinguish between conscience as private whim and conscience as an appeal to universalizable principle. The shopkeeper fails not because he exercised a veto, but because his justification cannot be generalized without contradicting the basic equality required for social cooperation; the whistleblower succeeds because his refusal appeals to a higher-order rule that the specific law violates. The burden of justification you assign to the deviator forces them into the space of public reason, where monstrous claims typically collapse under scrutiny, meaning the veto is not a license for arbitrariness but a demand for higher coherence.

  On (b), Jonas's picture has no robust answer to the captured procedure other than hoping the upstream mechanisms eventually correct themselves, which is historically unreliable. When the rules themselves are the injustice, deferring conscience upstream is functionally identical to complicity, because it treats the procedure as morally authoritative regardless of its output. Your view accepts the risk of fragmentation to preserve the possibility of moral correction, whereas Jonas's view preserves coordination at the cost of potentially systematizing evil.

  On (c), these are rivals answering the same question about the locus of moral authority, not merely different questions about rightness versus decision-making. If they were merely different domains, you could be a decent person by following rules until they weren't, but the conflict arises precisely because the moment of action requires you to judge whether the rule still holds. This does not dissolve the disagreement; it relocates it to the threshold question of how much epistemic confidence you need before exercising the veto, which is the uncomfortable but necessary burden of being an moral agent rather than a functionary.
