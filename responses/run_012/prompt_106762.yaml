answer: |-
  # The Decision Theory Diagnostic Instrument

  **Purpose:** This instrument is designed to bypass the "one-box or two-box" stalemate by mapping underlying commitments about agency, counterfactuals, and problem structure. It treats decision theory not as a list of verdicts, but as a logical space defined by how you answer ten branch questions.

  **Instructions:** Read each question and select the single answer that best reflects your *theoretical commitment*, not just your gut intuition about the money. Tally the points associated with each answer using the Scoring Key at the end.

  ---

  ### The Branch Questions (Logical Space)

  **Q1. The Unit of Evaluation**
  When we ask "what is rational?", what is the primary object being evaluated?
  *   **A.** A singular physical action or choice at a specific moment in time.
  *   **B.** A general policy, rule, or input-output function that the agent instantiates.
  *   **C.** The computational process itself, including its resource costs and limits.

  **Q2. The Mundane Baseline**
  *Case: You check a weather forecast that predicts rain with 90% accuracy. The forecast cannot cause the rain. You choose whether to carry an umbrella.*
  Do you maximize expected utility by conditioning on the forecast (taking it as evidence), or by intervening on the weather (treating it as fixed)?
  *   **A.** Condition on the forecast (it is evidence of rain).
  *   **B.** Treat the weather as fixed (your choice cannot cause rain).
  *   **C.** This distinction doesn't matter for mundane cases, only for predictors.

  **Q3. The Standard Predictor**
  *Case: A predictor puts $1M in Box B if they predict you will take only Box B. They put nothing if they predict you will take both. Box A always has $1k. The prediction happened yesterday.*
  When you choose, how do you treat the content of Box B?
  *   **A.** It is fixed by the past; my choice cannot change it now.
  *   **B.** My choice is strong evidence of what is in the box, so I should act to make the evidence favorable.
  *   **C.** My choice is the output of an algorithm; the predictor simulated that same algorithm, so our outputs are logically linked.

  **Q4. The Transparent Variation**
  *Case: Same as above, but the boxes are transparent. You can see $1M in Box B before you choose.*
  Does seeing the money sever the link between your choice and the prediction?
  *   **A.** Yes, the past is fixed; seeing the money means the prediction is already done.
  *   **B.** Yes, seeing the money screens off the correlation; my choice adds no new evidence.
  *   **C.** No, my decision procedure is still the same type that generated the prediction; I should act consistent with the procedure that gets the money.

  **Q5. The Hitchhiker**
  *Case: You are stranded. A driver will only pick you up if they predict you will pay $100 upon arrival. Once in the car, you can choose to pay or refuse. The driver is already driving.*
  Is it rational to pay upon arrival if you already got the ride?
  *   **A.** No, the ride is secured; paying is a pure loss now.
  *   **B.** Yes, because paying confirms I am the type of person who gets picked up in these scenarios.
  *   **C.** Yes, because I must endorse the policy that would have been predicted to pay, or I wouldn't be in the car.

  **Q6. The Copy Prisoner**
  *Case: You are in a one-shot Prisoner's Dilemma. The other player is a perfect physical copy of you, running on a separate machine. You cannot communicate.*
  Do you Cooperate or Defect, and why?
  *   **A.** Defect; my choice cannot causally change their choice.
  *   **B.** Cooperate; my choice is highly correlated evidence of their choice.
  *   **C.** Cooperate; we are running the same source code, so our outputs must match logically.

  **Q7. The Counterfactual Mugging**
  *Case: A predictor flips a coin. If Heads, they give you $1M if they predicted you would give them $100 if Tails. If Tails, they ask you for $100. The coin came up Tails.*
  Do you pay the $100?
  *   **A.** No, the coin is already Tails; paying loses money with no gain.
  *   **B.** Yes, because I want to be the kind of person who gets the money in the Heads branch.
  *   **C.** Yes, because rationality evaluates the policy across all branches, not just the actual one.

  **Q8. The Slow Source Code**
  *Case: The predictor is not a magic being, but a copy of your own source code running on a slower machine. They output their prediction before you output your choice.*
  Is the prediction a separate event from your decision?
  *   **A.** Yes, it happened earlier in time; it is a past fact.
  *   **B.** It is evidence of what I will do, but distinct from my current act.
  *   **C.** No, it is the same computation; the time delay is physically irrelevant to the logical output.

  **Q9. Computational Tractability**
  Must a normative theory of rationality be executable by an agent who cannot fully simulate their own decision process?
  *   **A.** No, rationality is an ideal standard, even if uncomputable for bounded agents.
  *   **B.** Yes, if an agent cannot compute the prescription, the theory fails as a guide.
  *   **C.** It depends on whether the problem is about design or online choice.

  **Q10. Problem Coherence**
  Are the paradoxes (Newcomb, Mugging, etc.) the result of ambiguous problem statements regarding causal structure?
  *   **A.** No, they reveal genuine conflicts in our concepts of rationality.
  *   **B.** Yes, once the causal graph is fully specified, the paradox dissolves.
  *   **C.** They reveal conflicts, but only because we mix different levels of description (act vs. algorithm).

