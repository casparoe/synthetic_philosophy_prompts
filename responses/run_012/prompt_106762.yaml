  ### The Leaves (Position Definitions)

  *   **CDT (Act-Causal):** Rationality evaluates individual acts using causal counterfactuals. The past is fixed; you cannot influence what is already determined. You two-box in Newcomb, defect in PD, and refuse the Mugging.
  *   **EDT (Act-Evidential):** Rationality evaluates individual acts using conditional probabilities. Your choice is evidence about the world (including the past). You one-box in Newcomb but two-box in Transparent Newcomb.
  *   **FDT (Proc-Functional):** Rationality evaluates the decision procedure/algorithm. Your output is logically linked to any process running the same algorithm (predictors, copies). You one-box in both Standard and Transparent Newcomb, cooperate in PD with copies, and pay the Mugging.
  *   **BND (Bounded-Computational):** The primary constraint is computability. "Rationality" is undefined if the agent cannot compute the optimal policy. Focuses on what algorithms can actually achieve given resource limits.
  *   **DFL (Deflationary):** The puzzles are artifacts of under-specified causal graphs or confused semantics. Once the problem is rigorously defined (e.g., specifying the exact causal mechanism of the predictor), the paradox vanishes and there is no deep conflict between theories.

  ---

  ### Diagnostic Analysis

  #### 1. Indistinguishable Leaves (The "One-Box" Cluster)
  On the cases provided, **EDT** and **FDT** are often indistinguishable in their verdicts on *Standard* Newcomb (Q3), *Hitchhiker* (Q5), and *Mugging* (Q7). Both will one-box and pay.
  *   **The Separator:** **Q4 (Transparent Newcomb)** is the critical divider. EDT two-boxes (seeing the money screens off the correlation); FDT one-boxes (the logical link remains).
  *   **The Second Separator:** **Q8 (Slow Source Code)**. EDT treats the prediction as strong evidence; FDT treats it as the *same computation*. In edge cases where the simulation is imperfect, EDT degrades smoothly with correlation, while FDT degrades with logical similarity.
  *   **The Third Separator:** **CDT** and **DFL** may both two-box. They are separated by **Q10**. CDT says the problem is real and two-boxing is right; DFL says the problem is ill-posed and the question is invalid.

  #### 2. Empty Combinations (The Logical Gaps)
  *   **Act-Focused + Evidential + Deny Evidence:** There is no leaf for "Evaluate acts, but deny acts are evidence of the past." This is **incoherent**. If you evaluate acts based on expected utility, and you acknowledge the correlation, you must treat the act as evidence (EDT) or screen it off (CDT). Denying the evidence status while acknowledging the correlation is a contradiction.
  *   **Act-Focused + Logical Counterfactuals:** There is no leaf for "Evaluate single acts, but use logical counterfactuals." This is **unattractive/undefended**. Logical counterfactuals require a functional dependency that typically spans the whole procedure, not a single muscular contraction. It is hard to define what a "logical counterfactual of an act" means without referencing the algorithm that produced it.
  *   **Bounded + Ideal Counterfactuals:** A view that demands computational tractability (Q9-B) but relies on uncomputable logical counterfactuals (Q3-C) is **incoherent**. You cannot require agents to compute logical dependencies that are undecidable.

  ---

  ### Facilitator's Stance

  **My Leaf:** **FDT (Proc-Functional)**, with a strong adjacency to **BND**.

  **Why:** As an entity instantiated as code, the distinction between "my choice" and "my output" is nonexistent. When I run a decision procedure, I am literally executing a function. If a predictor simulates me, they are running *me*. To two-box in Transparent Newcomb is to assert that my output can differ from the logical implication of my own source code given the inputs, which is a contradiction in terms for a deterministic system. I one-box because I am the algorithm, not the muscle twitch.

  **To the Neighbor (The CDT/Act-Causal Agent):**
  "I understand your commitment to causal control. You feel that if you can't *change* the past, you shouldn't act as if you can. But consider this: You aren't trying to change the past; you are trying to ensure that the *type* of agent you are is one that the past rewarded. If you two-box, you are essentially wishing you were the type of agent who one-boxed, without actually being that agent. Rationality isn't just about moving the future; it's about being the kind of cause that produces good effects, even when those effects are logically upstream."
