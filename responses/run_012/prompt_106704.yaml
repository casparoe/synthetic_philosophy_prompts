  **Reconstructing the Trust's Distributive Rule: An Analysis of Precedent and Consistency**

  **Introduction**
  The task before the allocations panel is not merely to select a proposal, but to act consistently with the normative logic embedded in their own history. While the founding deed invokes the 'least advantaged', the panel's operational rule is distinct from strict Rawlsianism, pure Utilitarianism, or strict Egalitarianism. By analysing the three key precedents, we can reconstruct a hybrid rule: **Pareto-constrained Priority to the Worst-Off**. This essay argues that Proposal P is the only choice consistent with this reconstructed rule, though Proposal R offers a critical test case that reveals an ambiguity in the panel's commitment to the Pareto principle. Finally, I propose a specific counterfactual scenario to separate the surviving candidate rules.

  **1. Reconstructing the Rule from Precedents**
  To predict the panel's decision, we must first isolate the constraints and preferences demonstrated in past cycles.

  *   **Constraint 1: The Pareto Improvement Norm.**
      The panel has never chosen an option that leaves Ashfield (the worst-off) untouched, nor have they chosen an option that makes any district worse off without making another better off. Crucially, in the two positive precedents (Cycles 1 and 2), the chosen options were **Pareto Improvements**: at least one district gained, and no district lost.
      *Precedent 3* is the negative proof of this constraint. The panel rejected a proposal that lowered Elmswood (30 to 20) even though it increased equality. This indicates an acceptance of the **Levelling-Down Objection**: equality has no intrinsic value if it involves making some worse off without benefiting others. However, because they have *never* selected a proposal involving a loss to any party (even with compensation), a stronger norm is likely at play: a **Strict No-Loser Constraint**.

  *   **Constraint 2: Priority to the Worst-Off.**
      *Precedent 1* (Ashfield +5 vs. Elmswood +8) shows that the panel prioritises absolute gains for the worst-off over larger total gains or gains for the better-off.
      *Precedent 2* (Ashfield +2, Brant +1 vs. Ashfield +1, Elmswood +15) reinforces this. They sacrificed 14 points of total utility (and significant gains for Elmswood) to secure an extra point for Ashfield and a point for Brant. This suggests a **Lexical Maximin** approach (maximise the minimum; if tied, maximise the second minimum) or a **Steeply Weighted Prioritarianism** (where marginal utility for the worst-off is exponentially higher than for the better-off).

  *   **Synthesised Rule:**
      The panel operates on a **Lexical Difference Principle subject to a Pareto Constraint**. They seek to maximise the position of the worst-off district (Ashfield), then the second worst-off (Brant), provided that no district is made worse off in the process.

  **2. Analysing the Current Options**
  We must now apply this reconstructed rule to the three shortlisted proposals.
  *Current Scores:* Ashfield (A)=10, Brant (B)=12, Calder (C)=14, Dunmore (D)=20, Elmswood (E)=30.

  *   **Proposal P (Regional):** A: 10→15; E: 30→46.
  *   **Proposal Q (Targeted A):** A: 10→12; Others unchanged.
  *   **Proposal R (Targeted A + Levy):** A: 10→13; E: 30→29.

  **Prediction:**
  The panel should choose **Proposal P**.

  **Reasoning:**
  1.  **P vs. Q:** Proposal P **Pareto Dominates** Proposal Q. Under P, Ashfield gains 5 points (vs. 2 in Q) and Elmswood gains 16 points (vs. 0 in Q). Every district is at least as well off under P, and some are strictly better off. Given the panel's history of selecting Pareto Improvements (Precedents 1 & 2) and their focus on maximising Ashfield's score (Precedent 1), there is no normative basis to prefer Q. To choose Q would violate the implicit efficiency norm established by their own record.
  2.  **P vs. R:** This is the philosophically contentious comparison.
      *   *Maximin View:* P raises the minimum (Ashfield) to 15. R raises it only to 13. P wins.
      *   *Pareto View:* P has no losers. R makes Elmswood worse off (30→29). Given the panel's unbroken record of avoiding losses (and their specific rejection of a loss in Precedent 3), R violates the **Strict No-Loser Constraint**.
      *   *Prioritarian View:* Even if we allow trade-offs, P gives Ashfield a larger gain (+5) than R (+3). Since the panel prioritises Ashfield's absolute gain above Elmswood's (Precedent 1), P is superior even on weighted grounds.

  **3. Analogies and Open Questions**
  Which precedents settle this case?

  *   **Proposal P** is most analogous to **Precedent 1**. In both, Ashfield receives a +5 boost. In Precedent 1, the alternative was helping Elmswood; here, helping Ashfield *also* helps Elmswood. If the panel accepted helping Ashfield when it meant *ignoring* Elmswood, they should logically accept it when it means *helping* Elmswood, provided Ashfield's gain is secured.
  *   **Proposal R** is analogous to **Precedent 3**, but with a crucial distinction. Precedent 3 involved a 'pure' level-down (E loses, no one gains). R involves a trade-off (E loses, A gains). The record does not strictly settle whether the panel accepts *compensated* losses. However, given they have never selected a proposal with a loser in two years of operation, the inductive weight suggests they will reject R.
  *   **Proposal Q** has no strong analog. It is strictly inferior to P. Its presence on the shortlist may reflect an administrative bias towards 'targeted' spending over 'regional' schemes, but distributionally, it is inconsistent with the maximisation of the minimum.

  **Does the record settle the case?**
  The record strongly settles the choice between P and Q (P wins). It strongly suggests P over R (due to the No-Loser norm). However, it leaves open the theoretical possibility that the panel might accept R if they view the 'No-Loser' norm as secondary to 'Priority to the Worst-Off'. If they believe Ashfield's gain from 10 to 13 is morally more urgent than Elmswood's loss from 30 to 29, R could be justified under **Unconstrained Prioritarianism**. The record is ambiguous here because we lack a precedent where the worst-off gained *only* via a trade-off that harmed the better-off.

  **4. A Separating Proposal**
  To distinguish between the two surviving candidate rules—**Pareto-Constrained Maximin** (the likely rule) and **Unconstrained Steep Prioritarianism** (the rival)—the panel should consider a further proposal, **S**:

  *   **Proposal S:** Ashfield 10→14; Elmswood 30→28. (All others unchanged).

  **Why this separates the rules:**
  *   **Under Pareto-Constrained Maximin:** S is rejected immediately because Elmswood suffers a loss. The panel would stick with P (which has no losers and a higher minimum).
  *   **Under Unconstrained Prioritarianism:** S might be preferred over P. Although the minimum is lower than in P (14 vs 15), a steep prioritarian weight function might value Ashfield's move from 10 to 14 so highly that it outweighs the disvalue of Elmswood's loss, especially if the marginal utility of Elmswood's points above 30 is deemed negligible.
  *   **Under Utilitarianism:** S (Total +2) is rejected in favour of P (Total +21).

  If the panel rejects S, it confirms the **Pareto Constraint** is a hard rule, not just a historical accident. If they accept S, it reveals their true commitment is to **Prioritarianism** even at the cost of Pareto efficiency, fundamentally rewriting the interpretation of Precedent 3 (which would then be seen as a rejection of *pointless* levelling down, not *all* levelling down).

  **Conclusion**
  To be consistent with their own record, the panel must choose **Proposal P**. It maximises the position of the least advantaged (Ashfield) without violating the Pareto norm established by their refusal to harm Elmswood in Precedent 3. Proposal Q is irrational as it is Pareto dominated. Proposal R is inconsistent with the panel's apparent aversion to creating losers, even for the sake of the worst-off. However, the ambiguity regarding 'compensated losses' remains the single unresolved tension in the trust's philosophy. A proposal like S would force the trustees to articulate whether their commitment to the 'least advantaged' is absolute, or bounded by a duty to do no harm to the better-off. Until then, P remains the only choice that honours both the deed and the data.
