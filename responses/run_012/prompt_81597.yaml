answer: |-
  **Bottom Line:** N. is correct that money isn't magic, but the ticket analogy smuggles in a static view of wealth that invalidates his conclusion. Money doesn't just claim existing goods; it coordinates idle labor to create new ones. If your town has unemployed workers, the "ticket" logic fails, and the currency could stimulate real activity.

  **The Analogy Audit**

  | Role | Ticket Analogy | Local Currency Reality |
  | :--- | :--- | :--- |
  | **The Ticket** | Claim on specific item | General claim on community output |
  | **Issuer** | Merchant with inventory | Community group with trust |
  | **The Stock** | Existing goods on shelf | Future labor & production capacity |
  | **Redemption** | One-time, specific window | Indefinite, any participating shop |
  | **Record** | Physical counter/stub | Ledger entry/Account balance |

  **Where the Mapping Breaks**
  Tickets don't circulate indefinitely; they die at redemption. Money circulates, and its velocity matters. Tickets aren't units of account; prices aren't quoted in them. Money sets the scale. Tickets don't bear interest, nor do they settle debts twenty years later; money can do both. If the issuer folds, tickets are waste; money defaults to debt/loss.

  **Which Breaks Matter**
  The **Stock** and **Redemption** breaks are fatal to N.'s argument. N. assumes the stock is fixed ("shuffle the same small pile"). But if the stock includes *idle labor* (the 800 laid-off workers), the currency isn't claiming existing food; it's incentivizing the planting of new crops. The ticket analogy assumes the harvest is in the barn. Money allows you to hire hands to harvest. The **Unit of Account** break matters because if shops price in local currency, it changes relative values, not just shuffles claims. The other breaks (interest, long-term debt) are incidental to the immediate question of stimulating local trade.

  **Verdict**
  N.'s conclusion does not survive. The ticket picture carried the weight by assuming wealth is pre-existing. If wealth is potential (labor), money activates it. The risk isn't inflation (too many tickets for goods); it's trust (will shops accept the ticket?). Berkeley's query highlights that money is a social tool, not a commodity, but N. misreads this as meaning it is passive. It is active coordination.

  **A Better Image**
  Use a **Scoreboard** or **Ledger**. A ticket implies you bought the points already. A scoreboard tracks who is contributing to the game *now*. It gets right that money is a measurement of ongoing activity, not a warehouse receipt. It highlights that the value isn't in the chip, but in the play. This supports the local currency: if the players (workers/shops) are ready, the scoreboard (currency) makes the game visible and playable. It shifts the focus from "claiming wealth" to "recording value creation," which is precisely what a local currency aims to do in a town with idle capacity.
