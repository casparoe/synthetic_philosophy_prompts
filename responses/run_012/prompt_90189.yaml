  # Problem Set Item: The Two-Envelope Cutoff

  **1. The Setup**
  The smaller amount $S$ is drawn from a known distribution with finite support:
  *   $P(S=10) = 0.3$
  *   $P(S=20) = 0.5$
  *   $P(S=40) = 0.2$

  The envelopes contain $(S, 2S)$. You receive one envelope at random (50/50 chance of $S$ or $2S$). Let $X$ be the amount in your envelope.

  **2. The Trap**
  Standard reasoning suggests: "The other envelope is either $X/2$ or $2X$. Since I picked randomly, each is 50% likely. Expected value of swapping is $0.5(X/2) + 0.5(2X) = 1.25X$. I should always swap."
  *Why this baits:* It relies on the intuitive but false assumption that observing $X$ provides no information about whether you hold the smaller or larger amount.

  **3. Walkthrough & Calculations**
  **Joint Distribution $(X, \text{Other})$:**
  Each pair $(S, 2S)$ occurs with probability $P(S)$. You hold either value with probability 0.5.
  1.  **Pair (10, 20)** [Prob 0.3]: You hold 10 (0.15), Other 20. You hold 20 (0.15), Other 10.
  2.  **Pair (20, 40)** [Prob 0.5]: You hold 20 (0.25), Other 40. You hold 40 (0.25), Other 20.
  3.  **Pair (40, 80)** [Prob 0.2]: You hold 40 (0.10), Other 80. You hold 80 (0.10), Other 40.

  **Expected Values (EV):**
  *   **Always Keep:** $E[X] = 10(0.15) + 20(0.15+0.25) + 40(0.25+0.10) + 80(0.10) = \mathbf{31.5}$
  *   **Always Swap:** $E[\text{Other}] = 20(0.15) + 10(0.15) + 40(0.25) + 20(0.25) + 80(0.10) + 40(0.10) = \mathbf{31.5}$
      *(Ex-ante indifference holds; symmetry is preserved.)*
  *   **Cutoff Rule:** "Swap if $X < 40$; Keep if $X \ge 40$."
      *   Swap outcomes ($X \in \{10, 20\}$): Get 20 (0.15), 10 (0.15), 40 (0.25).
      *   Keep outcomes ($X \in \{40, 80\}$): Get 40 (0.25 + 0.10), 80 (0.10).
      *   $EV = [20(0.15) + 10(0.15) + 40(0.25)] + [40(0.35) + 80(0.10)]$
      *   $EV = [3 + 1.5 + 10] + [14 + 8] = 14.5 + 22 = \mathbf{36.5}$

  **Result:** The cutoff rule strictly dominates blind strategies ($36.5 > 31.5$).

  **4. Why It Works**
  The cutoff rule wins because **magnitude correlates with status**. The prior distribution is not uniform ($P(S=20) > P(S=40)$).
  *   If you see **40**, it is more likely to be the *Larger* amount from the (20, 40) pair (prob mass 0.25) than the *Smaller* amount from the (40, 80) pair (prob mass 0.10).
  *   Posterior probability you hold the Larger amount given $X=40$ is $5/7$.
  *   $E[\text{Swap}|X=40] = (5/7)20 + (2/7)80 \approx 37.14$. Since $37.14 < 40$, you Keep.
  The "50/50" reasoning fails because observing $X$ updates the probability that $X$ is $S$ vs $2S$.

  **5. Follow-Ups**
  **Q: Isn't the cutoff rule cheating? It uses information about the distribution you shouldn't have.**
  **A:** No. The rule uses only the observed value $X$. In decision theory, we evaluate strategies assuming the agent knows the setup (the prior). Even if the prior were unknown, the *structure* remains: unless the prior is perfectly flat, magnitude provides statistical evidence about whether you hold the smaller or larger envelope. The rule exploits this correlation, not "forbidden" knowledge.

  **Q: Does this survive if we flatten the distribution (e.g., $S$ is uniform over a wider range)?**
  **A:** The advantage diminishes and the specific rule fails. If $P(S)$ is uniform, then for any interior value $X$, the probability it is $S$ equals the probability it is $2S$ (50/50). The conditional EV of swapping becomes $1.25X$, making "Always Swap" optimal for all interior values. The cutoff rule only retains an edge at the absolute maximum value (where you must Keep). The mechanism driving the win—the informational content of $X$ regarding relative magnitude—relies on the prior having a gradient (non-uniformity).
