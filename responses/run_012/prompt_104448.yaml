          *   *The "Real Work" Verdict:* It does real work *against* Negative and Republican liberty, but it risks collapsing into a specific (and controversial) reading of Positive Liberty. However, there's a nuance: Republicanism *can* claim Case 3 if it views social norms as sources of domination. But strictly, Case 3 is the strongest wedge for Positive Liberty.
