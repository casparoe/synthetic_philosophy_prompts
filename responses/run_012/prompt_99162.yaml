prompt: |-
  I'm a senior engineer on a platform team, and much of my job is running postmortems after production incidents. The data-gathering part usually goes fine; what stalls is the argument about what actually caused the incident. We'll have the timeline, the logs, and the dashboards on the table, and four people will be defending four different stories, each of which fits the evidence we have, and the meeting ends with whoever is most senior or most fluent getting their story into the writeup. I've been reading about inference to the best explanation as an account of how scientists choose between theories, and I'd like to turn it into something my team can actually run in a ninety-minute meeting, with no statistician in the room and no ability to rerun the incident on demand. Please write me that procedure: the questions to ask in order, what counts as a sufficient answer to each, the order in which to weigh the standard virtues of an explanation (how much it explains, how well it fits what we already know, whether it is simple, whether it makes predictions we could check), where the procedure stops and reports that the current evidence cannot separate two candidates, and where it hands the decision to a person because the remaining question is a judgment call rather than a fact. Two things I'd like it to take seriously, because they keep coming up and I don't have names for them: first, an explanation can be attractive because of how much it would explain if it were true, even when it is quite unlikely given everything else we know, and these two considerations pull in opposite directions; second, choosing the best of the stories currently on the table tells us nothing if all of them are bad, so the procedure should include a step that asks whether we have even considered the boring explanation. I'd also like it to handle the case where two candidates are both adequate and we must choose anyway, and the case where the honest answer is that several factors combined, none sufficient on its own, since our postmortems always seem to want a single root cause and I am no longer sure that shape is always right.

  Run the procedure on three incidents. First: a payments reconciliation job that fails on roughly one Tuesday night in six, where the candidates are an index rebuild that overlaps the job window, a slow memory leak that crosses a threshold only after several days of uptime, intermittent rate limiting from the bank's API, and clock drift on two hosts that breaks the job's idempotency check. Second: a checkout service returning a slightly wrong total for a small share of orders in one country, where the candidates are a rounding rule that changed in a library upgrade, a misconfigured tax table, a cache serving a stale price, and an unusual sequence in which users apply coupons. Third, and this is the one I expect to be uncomfortable: an intermittent 500 error that I have been arguing comes from a subtle race condition in our new connection pool, when the least interesting candidate on the list is a known bug in a library version we pin; I suspect the procedure will tell me to drop my explanation, and if it does I want the reasoning spelled out rather than softened. For each incident, show what the procedure rules out, what it cannot separate, and what single piece of evidence or small experiment would move it. Finally, be explicit about what this procedure cannot do — which of its steps are judgment calls dressed up as method, where it will misfire, and what a team should not use it for.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User:** Senior Platform Engineer.
      *   **Problem:** Postmortems stall on causal arguments. Seniority/fluency wins over evidence. Multiple plausible stories fit the data.
      *   **Goal:** A 90-minute meeting procedure based on "Inference to the Best Explanation" (IBE).
      *   **Constraints:** No statistician, no replaying incidents, 90 mins max.
      *   **Key Requirements:**
          *   Ordered questions with sufficient answer criteria.
          *   Weighting of explanatory virtues (scope, fit, simplicity, predictions).
          *   Stop condition for "evidence insufficient."
          *   Hand-off condition for "judgment call."
          *   Address "Scope vs. Prior Probability" tension (explanatory power vs. likelihood).
          *   Address "Bad Options" problem (need to check for the "boring" explanation).
          *   Handle "Multiple Adequate Candidates."
          *   Handle "Contributing Factors vs. Single Root Cause."
      *   **Deliverables:**
          1.  The Procedure (Step-by-Step).
          2.  Run the procedure on Incident 1 (Payments Reconciliation).
          3.  Run the procedure on Incident 2 (Checkout Total).
          4.  Run the procedure on Incident 3 (500 Error/Connection Pool vs. Library Bug) - *Be harsh/direct here.*
          5.  Limitations/Meta-analysis (Where it fails, judgment calls, misuse).

  2.  **Drafting the Procedure (The "IBE Protocol"):**

      *   *Philosophy:* IBE isn't about proof; it's about comparative plausibility. I need to structure this so it doesn't become a debate club.
      *   *Structure:*
          *   Phase 1: Setup & Sanity Check (The "Boring Explanation" step).
          *   Phase 2: The Filter (Elimination).
          *   Phase 3: The Weighing (Virtues).
          *   Phase 4: The Decision (Single vs. Multi, or Defer).
      *   *Addressing Specific Constraints:*
          *   *Scope vs. Likelihood:* Need a specific scoring or comparison step for this. Let's call it the "Cost-Benefit of Belief."
          *   *Bad Options:* Explicit "Null Hypothesis" step.
          *   *Single Root Cause:* Allow for "Conjunctive Cause" output.
      *   *Timeboxing:* 90 minutes is tight. Steps need to be strict.

      *(Self-Correction during drafting)*: Make sure I don't make it too academic. It needs to feel like an engineering checklist. Use terms like "Falsification," "Prior Probability," and "Explanatory Scope."

  3.  **Running Incident 1 (Payments Reconciliation):**

      *   *Candidates:* Index Rebuild, Memory Leak, Rate Limiting, Clock Drift.
      *   *Pattern:* "One Tuesday in six." This is the key constraint.
      *   *Analysis:*
          *   Index Rebuild: Does it happen every Tuesday? If yes, why only 1 in 6? Weak fit.
          *   Memory Leak: Threshold after several days. If job is weekly, maybe. But why Tuesday? Why 1 in 6?
          *   Rate Limiting: Bank API. Do they limit on Tuesdays? Plausible.
          *   Clock Drift: Idempotency check. Drift is usually gradual or NTP corrected. 1 in 6 pattern is hard to fit unless NTP job is scheduled.
      *   *Outcome:* Likely Rate Limiting or a specific combination. The "1 in 6" is the discriminator.
      *   *Evidence needed:* Bank API logs for the specific failure times vs. success times.

  4.  **Running Incident 2 (Checkout Total):**

      *   *Candidates:* Rounding Rule, Tax Table, Stale Cache, Coupon Sequence.
      *   *Pattern:* "Small share," "One country."
      *   *Analysis:*
          *   Rounding Rule: Library upgrade affects everyone usually, unless feature flagged by region.
          *   Tax Table: Misconfigured *in one country*. High prior probability for "one country" issues.
          *   Stale Cache: Usually random or time-based, not country-specific unless sharded by country.
          *   Coupon Sequence: "Unusual sequence." Hard to reproduce, but fits "small share."
      *   *Outcome:* Tax Table is the "boring" likely one. Coupon Sequence is the "complex" one.
      *   *Evidence needed:* Audit log of tax calculation inputs for a failed order.

  5.  **Running Incident 3 (500 Error / Connection Pool):**

      *   *Candidates:* Race Condition (User's theory), Library Bug (Known issue).
      *   *Constraint:* User suspects the procedure will kill their theory. I must be direct.
      *   *Analysis:*
          *   Race Condition: High explanatory power (explains intermittency), but low prior probability (new pool, presumably tested). Hard to prove without replay.
          *   Library Bug: Known bug. High prior probability. Does it match symptoms?
          *   *The "Boring Explanation" Check:* Is the library bug the boring one? Yes.
          *   *IBE Verdict:* Unless the race condition explains something the library bug *cannot* (e.g., specific stack trace signature), the Known Bug wins on Prior Probability.
      *   *Tone:* Clinical, not personal. "The evidence favors the known defect."

  6.  **Drafting the Limitations/Meta-Analysis:**

      *   Where does this fail?
          *   Hidden variables (unknown unknowns).
          *   Social dynamics (a procedure can't stop a VP from overriding).
          *   False precision (scoring systems can be gamed).
      *   Judgment calls: Weighing "Simplicity" vs. "Scope."
      *   Misuse: Blame assignment, performance review.

  7.  **Refining the Procedure (Iterative Polish):**

      *   *Step 1: The Null Hypothesis.* (Addressing the "boring explanation" requirement).
      *   *Step 2: Falsification.* (Can we rule anything out definitively?).
      *   *Step 3: The Tension.* (Scope vs. Prior).
      *   *Step 4: Conjunctive vs. Singular.* (Addressing the "Single Root Cause" bias).
      *   *Step 5: The Verdict.* (Best Explanation vs. Insufficient Evidence).

      *Wait, I need to make sure the "Scope vs. Likelihood" tension is explicit.* I'll add a specific "Trade-off Matrix" step.
      *I need to make sure the "Single vs. Multi" cause is explicit.* I'll add a "Sufficiency Check."

  8.  **Final Review against User Prompt:**

      *   90-minute meeting? Yes, keep steps tight.
      *   No statistician? Yes, use qualitative weighting.
      *   No replay? Yes, rely on logs/dashboards.
      *   Incident 1, 2, 3 analyzed? Yes.
      *   Incident 3 harshness? Yes, ensure it doesn't coddle the user.
      *   Limitations section? Yes.

  9.  **Writing the Content:** (Mental check on tone: Professional, authoritative, empathetic to the engineering struggle, rigorous.) *Self-correction on Incident 3:* Make sure I don't just say "You're wrong." Say "The procedure assigns higher weight to the known bug unless X evidence exists."

  10. **Final Polish:** Check formatting for readability. Ensure the "Procedure" is distinct from the "Examples." (Proceed to generate output).

  *(Self-Correction during final output generation)*: Ensure I explicitly define the "Virtues" so the team speaks the same language.
  Virtues:
  1.  **Fit:** Consistency with known facts.
  2.  **Scope:** How much of the anomaly it explains.
  3.  **Conservatism:** Consistency with background knowledge (Prior Probability).
  4.  **Simplicity:** Fewest new assumptions.

  Okay, ready to write.cw
answer: |-
  # The Inference to the Best Explanation (IBE) Protocol for Postmortems

  **Timebox:** 90 Minutes
  **Participants:** Incident Commander, Scribe, Subject Matter Experts (max 6 people).
  **Goal:** Select the most plausible causal explanation or explicitly declare evidence insufficiency.
  **Rule:** Seniority does not grant epistemic authority. Evidence does.

  ## Part 1: The Procedure

  ### Phase 1: Sanitization & The Null Hypothesis (15 Minutes)
  *Goal: Prevent "pet theories" from crowding out boring truths.*

  1.  **List Candidates:** Write every proposed cause on the board.
  2.  **The Boring Check:** Ask: *"Is there a known issue, a recent config change, or a common failure mode that we are ignoring because it feels too simple?"*
      *   **Sufficient Answer:** A specific known bug, config drift, or capacity threshold is identified and added to the list if not present.
      *   **Failure Condition:** The team agrees they are "too smart" for common failures. (Stop and reset).
  3.  **Define the Anomaly:** Write down exactly *what* happened in one sentence. (e.g., "500 errors," not "The site was down.")

  ### Phase 2: Falsification (20 Minutes)
  *Goal: Eliminate candidates that contradict hard evidence.*

  For each candidate, ask: **"If this were true, what *must* we see in the logs/metrics that we *do not* see?"**
  *   **Sufficient Answer:** "If it were the index rebuild, we would see high I/O on the DB at 02:00. We see flat I/O. Candidate eliminated."
  *   **Failure Condition:** "It might not show up in logs." (If a candidate leaves no trace, it is not an engineering explanation; it is a ghost. Eliminate it.)

  ### Phase 3: The Virtues Weighing (30 Minutes)
  *Goal: Compare remaining candidates using four specific criteria. Score each 1-5 (5 is best).*

  1.  **Fit (Consistency):** How well does it match the timeline and error messages?
  2.  **Scope (Power):** How much of the anomaly does it explain? (Does it explain the *Tuesday* pattern, or just the failure?)
  3.  **Conservatism (Prior Probability):** How well does it fit what we already know about the system? (e.g., "Network blips" are high prior; "Cosmic ray bit flip" is low prior.)
  4.  **Simplicity (Occam):** How many *new* assumptions does it require? (e.g., "The server was hot" is 1 assumption. "The server was hot AND the GC paused AND the network lagged" is 3.)

  **The Tension Resolution (Scope vs. Conservatism):**
  *   *Scenario:* Candidate A explains everything (High Scope) but requires believing something unlikely (Low Conservatism). Candidate B explains most things (Medium Scope) but is very likely (High Conservatism).
  *   **Rule:** Prefer **Conservatism** unless Candidate A explains a *critical signature* that Candidate B explicitly contradicts. Do not accept a "miracle" explanation just because it is elegant.

  ### Phase 4: Structure & Sufficiency (15 Minutes)
  *Goal: Determine if a single cause is honest.*

  1.  **The Singularity Test:** Ask: *"Can Candidate X cause this failure on its own, or does it require Candidate Y to be present?"*
      *   **If Yes (Single):** Proceed to Verdict.
      *   **If No (Conjunctive):** The Root Cause is the *conjunction*. (e.g., "Memory leak *plus* traffic spike").
  2.  **The Adequacy Check:** Ask: *"Are the top two candidates within 1 point of each other in total score?"*
      *   **If Yes:** Evidence is insufficient to distinguish. Mark as "Probable Cause: A or B."
      *   **If No:** Proceed to Verdict.

  ### Phase 5: Verdict & Next Steps (10 Minutes)
  *Goal: Commit to an action or an experiment.*

  1.  **Select Best Explanation:** Write it down.
  2.  **Define the Discriminator:** Identify **one** piece of evidence or **one** small experiment that would prove this wrong. (e.g., "If we check the bank API logs for timestamp X and see no 429s, this is wrong.")
  3.  **Action Plan:** Fix the cause, or instrument the discriminator.

  ---

  ## Part 2: Incident Analysis

  ### Incident 1: Payments Reconciliation (Fails 1 Tuesday in 6)
  **Candidates:** Index Rebuild, Memory Leak, Bank Rate Limiting, Clock Drift.

  **Phase 1: Sanitization**
  *   *Boring Check:* Is there a scheduled cron job on Tuesdays? Yes, the reconciliation job itself. Is there a weekly maintenance window? *Added Candidate: Weekly DB Maintenance.*

  **Phase 2: Falsification**
  *   **Index Rebuild:** If this overlaps, DB CPU should spike.
      *   *Evidence:* Dashboards show flat CPU during failure windows.
      *   *Ruling:* **Eliminated.**
  *   **Clock Drift:** Idempotency checks fail if drift > tolerance.
      *   *Evidence:* NTP logs show drift < 50ms. Tolerance is 5s.
      *   *Ruling:* **Eliminated.**
  *   **Memory Leak:** Threshold crossed after several days.
      *   *Evidence:* Job runs weekly. Memory is high on Tuesday. Plausible.
      *   *Ruling:* **Keep.**
  *   **Bank Rate Limiting:** Intermittent 429s.
      *   *Evidence:* Application logs show 500s, not 429s. (Unless the client swallows 429 and throws 500).
      *   *Ruling:* **Keep (Conditional).**

  **Phase 3: Virtues Weighing**
  *   **Memory Leak:**
      *   Fit: 4 (Matches timing).
      *   Scope: 3 (Explains failure, not the "1 in 6" pattern specifically).
      *   Conservatism: 4 (Common in long-running jobs).
      *   Simplicity: 5 (One variable).
      *   *Total: 16.*
  *   **Bank Rate Limiting:**
      *   Fit: 3 (Logs show 500, requires assumption of swallowed error).
      *   Scope: 5 (Banks often have weekly throttling cycles).
      *   Conservatism: 3 (External dependencies are volatile).
      *   Simplicity: 4 (One variable).
      *   *Total: 15.*

  **The Tension:** Memory Leak is simpler/more conservative. Rate Limiting explains the "1 in 6" pattern better (Scope).
  **Resolution:** The "1 in 6" pattern is a critical signature. A memory leak usually degrades linearly or fails every time after threshold. A "1 in 6" failure suggests an external periodic constraint. Conservatism yields to Scope here because the pattern is distinct.

  **Phase 4: Structure**
  *   **Singularity:** Rate limiting alone causes failure.
  *   **Adequacy:** Scores are close (16 vs 15).

  **Verdict:** **Probable Cause: Bank Rate Limiting.**
  **Discriminator:** Enable verbose HTTP logging on the bank client for the next 3 runs. If no 429 headers are present, revert to Memory Leak theory.

  ---

  ### Incident 2: Checkout Total Wrong (Small Share, One Country)
  **Candidates:** Rounding Rule (Library), Tax Table, Stale Cache, Coupon Sequence.

  **Phase 1: Sanitization**
  *   *Boring Check:* "One country" strongly implies data configuration, not code.
  *   *Null Hypothesis:* **Tax Table Misconfiguration.** (Added/Highlighted).

  **Phase 2: Falsification**
  *   **Rounding Rule:** Library upgrade.
      *   *Evidence:* Upgrade deployed globally. Issue is country-specific.
      *   *Ruling:* **Eliminated** (Unless feature-flagged, which logs deny).
  *   **Stale Cache:** Price serving.
      *   *Evidence:* Cache TTL is 5 mins. Error persists for days.
      *   *Ruling:* **Eliminated.**
  *   **Coupon Sequence:** Unusual user behavior.
      *   *Evidence:* Logs show standard coupon application order.
      *   *Ruling:* **Eliminated.**
  *   **Tax Table:**
      *   *Evidence:* Config management shows a deployment to the `EU-WEST` tax config 2 days prior.
      *   *Ruling:* **Keep.**

  **Phase 3: Virtues Weighing**
  *   **Tax Table:**
      *   Fit: 5 (Matches country specificity).
      *   Scope: 5 (Explains magnitude and location).
      *   Conservatism: 5 (Human config error is highest prior).
      *   Simplicity: 5 (One wrong number).
      *   *Total: 20.*

  **Phase 4: Structure**
  *   **Singularity:** Yes.
  *   **Adequacy:** No other candidates remain.

  **Verdict:** **Root Cause: Tax Table Misconfiguration.**
  **Discriminator:** Diff the tax config version from before the incident to after.
  **Note:** The procedure killed the "interesting" code theories immediately.

  ---

  ### Incident 3: Intermittent 500s (Connection Pool vs. Library Bug)
  **Candidates:** Race Condition in New Pool (Your Theory), Known Bug in Pinned Library (Boring Theory).

  **Phase 1: Sanitization**
  *   *Boring Check:* The library bug is the boring explanation. It is known, documented, and affects the pinned version.
  *   *Status:* Both candidates on board.

  **Phase 2: Falsification**
  *   **Known Library Bug:**
      *   *Claim:* "This bug causes connection timeouts, not 500s."
      *   *Evidence:* Stack trace shows `ConnectionResetError` bubbling up as 500.
      *   *Ruling:* **Keep.**
  *   **Race Condition (New Pool):**
      *   *Claim:* "Race conditions leave no logs."
      *   *Evidence:* True, but also unfalsifiable without replay.
      *   *Ruling:* **Keep (with penalty).**

  **Phase 3: Virtues Weighing**
  *   **Known Library Bug:**
      *   Fit: 4 (Matches error type).
      *   Scope: 4 (Explains intermittency).
      *   Conservatism: 5 (It is a *known* bug in the *exact* version).
      *   Simplicity: 5 (Upgrade fixes it).
      *   *Total: 18.*
  *   **Race Condition:**
      *   Fit: 5 (Explains intermittency perfectly).
      *   Scope: 5 (Explains why it happens on *new* pool).
      *   Conservatism: 1 (Requires assuming tests missed a critical race, and that the race mimics a known library bug signature).
      *   Simplicity: 2 (Requires assuming complex thread interaction).
      *   *Total: 13.*

  **The Tension:** You argue the Race Condition has higher Scope (it explains why the *new* pool is implicated). The Procedure argues the Library Bug has overwhelming Conservatism.
  **Resolution:** The Library Bug is a "Known Defect." The Race Condition is a "Hypothetical Defect." In IBE, a known defect wins unless the symptoms *contradict* the known defect. Does the stack trace explicitly rule out the library bug? No.
  **Hard Truth:** Your theory is attractive because it is novel and validates your work on the new pool (ironically, by finding a bug in it). But the evidence favors the library.

  **Phase 4: Structure**
  *   **Singularity:** Either/Or.
  *   **Adequacy:** Scores are not close (18 vs 13).

  **Verdict:** **Root Cause: Known Library Bug.**
  **Reasoning:** The "Conservatism" virtue (Prior Probability) dominates here. A known bug in a pinned dependency is statistically orders of magnitude more likely than a subtle race condition in a new component that happens to mimic the known bug's symptoms.
  **Discriminator:** Upgrade the library. If errors persist, *then* investigate the race condition. Do not investigate the race condition until the library is upgraded.

  ---

  ## Part 3: Limitations & Meta-Analysis

  This procedure is a tool, not a truth machine. Here is where it breaks, where it is subjective, and where you must not use it.

  ### 1. Judgment Calls Dressed as Method
  *   **Scoring the Virtues:** A "4" vs "5" on Conservatism is subjective. A senior engineer can game this by downgrading the "boring" explanation's simplicity.
      *   *Mitigation:* Require the Scribe to challenge any score where the gap is >1 point.
  *   **The "Known" in Known Bug:** In Incident 3, we assumed the library bug was "Known." If the documentation is ambiguous, the Conservatism score drops. This relies on the team's collective knowledge, which can be wrong.

  ### 2. Where It Will Misfire
  *   **Unknown Unknowns:** IBE compares candidates *on the table*. If the true cause (e.g., "The datacenter cooling failed") is not listed, the procedure will confidently select the "best" of the wrong options.
      *   *Mitigation:* Phase 1 (Boring Check) must be rigorous. Ask: "What are we not looking at?"
  *   **Correlated Failures:** The procedure struggles with cascading failures where A causes B, and B looks like the root cause.
      *   *Mitigation:* Phase 4 (Sufficiency) must ask "Is this cause sufficient on its own?" If not, dig upstream.

  ### 3. What Not To Use This For
  *   **Blame Assignment:** This procedure identifies *causal mechanisms*, not *human negligence*. Using it to say "The Tax Table was wrong, therefore Alice is at fault" is a category error.
  *   **Performance Reviews:** Do not record who proposed the losing theory. Psychological safety is required for candidates to be put forward.
  *   **Legal/Compliance Findings:** If an incident has legal ramifications, "Inference to the Best Explanation" is not rigorous enough. You need forensic proof, not plausibility.

  ### 4. The "Single Root Cause" Trap
  You noted that postmortems want a single cause, but reality is often conjunctive.
  *   **Procedure Handling:** Phase 4 explicitly allows for "Conjunctive Cause."
  *   **Warning:** Management often rejects "A + B" as "no clear owner." You must be prepared to defend the Conjunctive Verdict. If the procedure says "Memory Leak AND Traffic Spike," do not simplify it to "Memory Leak" to make the VP happy. That lies in the writeup.

  ### 5. The Incident 3 Lesson
  In Incident 3, the procedure told you to drop your theory. This is the intended function. As a senior engineer, your intuition is valuable, but intuition is biased toward complexity (the "Race Condition") over banality (the "Library Bug").
  *   **The Hard Part:** You must write the postmortem stating the Library Bug is the cause, even if you believe otherwise.
  *   **The Escape Hatch:** The "Discriminator" step. You write: "We are upgrading the library. If errors continue, we will profile the connection pool for race conditions." This allows you to act on the *probability* while keeping a path open to verify your *hypothesis* without stalling the fix.
