answer: |-
  It is completely understandable why you are frustrated, because that quote, originally from the statistician George Box, is often wielded in seminars exactly as your tutor is wielding it, as a conversation stopper rather than a starting point for analysis. To make sense of what is happening here, we need to disentangle the different philosophical weights that sentence can carry, ranging from the banal to the substantive, and see which one actually supports your tutor's refusal to engage with the question of explanation. At its most trivial level, the claim that all models are wrong is simply a reminder of idealization. This is the view that a model is an abstraction, like a map that leaves out some streets to make the layout readable. On this reading, wrong just means not identical to reality. However, this reading does not license your tutor's move. Acknowledging that a map is not the territory does not prevent us from asking whether the map gets the relative positions of the cities correct. You can admit a model is an idealization and still insist that getting the causal story right is a necessary condition for the model being useful in the long run, or that explanation is a distinct virtue from prediction. If your tutor meant only this, he would have to agree that your question about causality is valid, because even an idealized model can be causally accurate or inaccurate. Since he used the quote to dismiss the question, he must mean something stronger than mere idealization.

  The reading that actually licenses his behavior is a form of instrumentalism. This is the position that scientific theories are not descriptions of the world at all, but rather instruments for organizing experience and predicting observations. If you are an instrumentalist, you believe that asking whether a model latches onto reality is a category mistake, like asking if a hammer is true or false. A hammer is just useful or useless. On this view, the word wrong in the quote is not a gradient about closeness to truth, but a dismissal of truth as the goal. If the goal is only utility, then a model that predicts beautifully but gets the causality backwards is perfectly acceptable, because the causal story is metaphysical baggage we do not need. This reading allows your tutor to shut down the question because, for an instrumentalist, explanation just is prediction, or perhaps explanation is a psychological feeling we get when predictions work, not a feature of the world. This is likely the position he is operating from, perhaps influenced by van Fraassen's constructive empiricism, which argues we should only aim for empirical adequacy rather than truth. However, he is using Box's slogan to do the heavy lifting instead of arguing for instrumentalism directly, which is why it feels like a dodge. The slogan acts as a shield for a substantive metaphysical commitment that he is not defending in the seminar.

  There is a third reading involving verisimilitude, which connects to your essay work. You noted that verisimilitude tries to make precise the idea that one false theory can be closer to the truth than another. The Box quote is actually in tension with this if taken literally. Verisimilitude requires us to care deeply about how a model is wrong, because the mechanism of the error determines its distance from the truth. If you have two false models, and one gets the causal direction right while the other gets it wrong, the verisimilitude theorist says the first is closer to the truth even if their predictive accuracy is identical in the current dataset. Therefore, a verisimilitude reading of the quote would demand that you ask exactly the question you asked. It would treat the causal structure as the metric for measuring the distance from the truth point. Since your tutor used the quote to stop you from asking about causal structure, he is not operating with a verisimilitude framework. He is treating wrong as a binary state that disqualifies the model from truth-talk entirely, rather than treating it as a starting point for measuring closeness. Consequently, the verisimilitude reading cannot explain his behavior, even though it is the most philosophically interesting way to salvage the intuition behind the quote.

  There are also readings that are dead on arrival and should be discarded. One is the logical reading that all models are literally false statements. This is false because some models contain tautologies or mathematical truths that are not wrong in any logical sense. Another is the self-undermining reading. If all models are wrong, then the model of science presented by the quote itself is wrong, which suggests we should not trust it. While witty, this is not a productive philosophical stance. A more subtle dead end is the pragmatist reading that useful means true. Some pragmatists argue that truth is just what works. If your tutor held this, he would say the model is true because it is useful. But he explicitly called it wrong. So he is not a pragmatist about truth; he is a realist about falsity and an instrumentalist about value. He believes the model is definitely not true, but definitely useful, and he sees no bridge between the two. This separates truth and utility completely, which is a hard line to defend but clearly where his usage places him.

  So to commit to an interpretation of your tutor, I believe he is a crude instrumentalist who is using a statistical heuristic as a metaphysical thesis. He is assuming that because models are idealizations, they cannot be truth-apt, and therefore questions about whether they describe reality are idle. He is not distinguishing between the model as a mathematical object and the model as a representation of a mechanism. By saying they are all wrong, he avoids the hard work of distinguishing between models that are wrong because they are simplified approximations of a real mechanism and models that are wrong because they posit non-existent mechanisms that happen to correlate with data. He is collapsing the distinction between approximation and error. This licenses his shutdown of your question because if you cannot talk about truth, you cannot talk about causal explanation, only empirical fit. He is treating the philosophy of science as a methodology of prediction rather than an inquiry into nature.

  As for where I come down on the issue itself, I think your tutor is wrong to dismiss the question, and you are right to press it. The quote is a useful methodological reminder for statisticians to avoid overfitting, but it is a poor metaphysical principle for philosophers of science. The fact that a model is an idealization does not mean it cannot capture real causal structures. We can and should distinguish between a model that predicts well because it latches onto a real causal power, and a model that predicts well because of a spurious correlation that will fail under intervention. This is the heart of the realism debate. If you ignore the causal story, you cannot know when your model will break. Therefore, the question of whether a model explains or just fits is the most important question you can ask. I would argue for a version of structural realism or causal realism that accepts models are false in their details but can be true in their structure. This allows you to keep the insight that models are imperfect without surrendering the goal of explanation. Verisimilitude is the right tool for this, because it allows you to say the model with the correct causal direction is closer to the truth than the one with the reversed direction, even if both are technically false. Your tutor is treating falsity as a disqualifier, but in science, falsity is the default state we work from to get closer. Shutting down the question of explanation is giving up on the primary aim of science, which is understanding, not just prediction. You should feel confident in your essay arguing that utility is not a substitute for explanatory power, and that the Box quote, while catchy, obscures the distinction between empirical adequacy and truth that realism depends on.
