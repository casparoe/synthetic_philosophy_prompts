answer: |-
  Here is the disciplined framework you requested, sorted by evidential weight for phenomenal consciousness, followed by the resolution of your dispute.

  ### The Markers: Tiers, Weights, and Taxonomic Invariance

  **Tier S (Weight: 1.0)**
  *   **(7) Metacognitive sensitivity:** This implies a second-order representation of one's own uncertainty, which is the closest behavioral proxy we have for subjective awareness.
      *   *Invariance:* **Constant.** If an insect declines a difficult discrimination like a primate does, the functional evidence for a subjective "feeling of knowing" is identical, regardless of substrate.
  *   **(5) Self-administration of an analgesic:** This requires the animal to represent an internal negative state and act instrumentally to alter that specific state, not just escape a stimulus.
      *   *Invariance:* **Constant.** The causal link between internal state representation and voluntary action holds the same evidential force in a crab as in a rat.

  **Tier A (Weight: 0.6)**
  *   **(4) Motivational trade-offs:** Willingness to endure pain for reward (or vice versa) demonstrates a unified value system where "pain" competes with other drives, suggesting a felt cost rather than a reflex.
      *   *Invariance:* **Constant.** A global integration of value is a functional requirement for this behavior; the hardware implementing the integration is secondary.
  *   **(9) Signs of affective state that generalise:** If a noxious event alters behavior across unrelated domains (e.g., feeding, grooming, exploration), it indicates a persistent, global "mood" rather than a local reflex loop.
      *   *Invariance:* **Constant.** Global state modulation is a functional signature of affect, independent of whether the modulator is a limbic system or a central complex.

  **Tier B (Weight: 0.3)**
  *   **(6) Open-ended associative learning:** While impressive, complex learning can occur in unconscious systems (e.g., AI), so it correlates with processing power more than phenomenology.
      *   *Invariance:* **Discounted in invertebrates.** Without homologous memory structures, we cannot rule out that the learning is procedurally distinct from vertebrate associative learning.
  *   **(3) Conditioned place avoidance (single episode):** Rapid avoidance suggests high salience, but it could still be a rigid, high-gain avoidance module rather than a remembered experience of suffering.
      *   *Invariance:* **Discounted in invertebrates.** Invertebrate memory consolidation pathways differ significantly, making the "experience" component harder to infer.

  **Tier C (Weight: 0.1)**
  *   **(8) Sleep architecture:** Sleep correlates with consciousness in vertebrates, but its function is debated (metabolic vs. restorative), and invertebrate "quiescence" may not be homologous.
      *   *Invariance:* **Discounted in invertebrates.** Without evidence that invertebrate quiescence involves the same neural offline-processing as vertebrate sleep, it is a weak correlate.
  *   **(1) Nociceptors + opioid signalling:** Nociception is distinct from pain, and opioid-like peptides in invertebrates often serve immune or metabolic functions unrelated to suffering.
      *   *Invariance:* **Discounted in invertebrates.** Molecular homology does not guarantee functional homology; these chemicals often run "nobody home" machinery in simpler systems.

  **Tier D (Weight: 0.0)**
  *   **(2) Withdrawal responses (decerebrate):** Since this behavior persists without a brain in vertebrates, it proves that the specific machinery required for this output does not require consciousness.
      *   *Invariance:* **Discounted everywhere.** This is a control for *unconscious* processing; its presence moves the prior probability of consciousness to zero for that specific mechanism.

  ***

  ### Closing the Loop: The Dispute Resolution

  **1. What your friend must concede to avoid begging the question**
  Your friend's "cortical-integration" argument risks circularity if they define consciousness *as* vertebrate cortical integration. To avoid this, they must concede that **Tier S and Tier A markers (Metacognition, Analgesic Self-admin, Trade-offs)** are evidentially relevant regardless of anatomy.
  *   **Why:** If an insect demonstrates a functional equivalent of global integration (e.g., trading off pain for food), dismissing it *a priori* as "zombie machinery" assumes the conclusion (that only vertebrates integrate globally). Your friend must accept these behaviors as *prima facie* evidence of integration and argue why the insect mechanism fails to meet the threshold, rather than ignoring the behavior entirely.

  **2. What your friend can legitimately discount**
  Your friend can legitimately dismiss **Tier C and Tier D markers (Nociceptors, Reflexes, Sleep)** as evidence for consciousness in invertebrates.
  *   **Why:** We know from human medicine that nociception and withdrawal can occur without phenomenal experience (e.g., under anesthesia or in spinal patients). Since these mechanisms are phylogenetically older and structurally distinct in invertebrates, their presence is consistent with a "zombie" hypothesis. Discounting them is not question-begging; it is applying a known control from vertebrate neuroscience.

  **3. The single marker that would destabilize your side**
  If **Marker 7 (Metacognitive sensitivity)** turned out to be robustly present in insects but demonstrably absent in fish, it would most destabilize your argument.
  *   **Why:** Fish are the "control group" for consciousness; even your friend likely concedes fish are conscious. If fish are conscious *without* metacognition, then metacognition is not necessary for consciousness. If insects *have* metacognition but fish don't, it suggests the insect behavior is a specialized cognitive adaptation (a "trick") rather than a marker of feeling. This would strip you of your strongest behavioral evidence (Tier S), forcing you to rely on Tier A or B markers, which your friend can more easily argue are automated. It would imply your best proxy for "subjective awareness" is actually just a proxy for "complex insect computation."

  ### How to Use This for Credence Revision
  *   **Start with your prior:** (e.g., 50% chance bees are conscious).
  *   **Update on Tier D/C:** Ignore them. They add 0 to 0.1 weight.
  *   **Update on Tier B:** Add ~0.3 weight if confirmed, but discount by 50% if the species is an invertebrate (due to structural uncertainty).
  *   **Update on Tier A:** Add ~0.6 weight. This is the battleground. If bees show robust trade-offs, you must significantly increase credence.
  *   **Update on Tier S:** Add ~1.0 weight. If bees show metacognition, you should treat them as conscious unless your friend can provide a specific mechanistic defeater.
  *   **The Friend's Constraint:** They are not allowed to set the prior to 0 for invertebrates. They must start neutral and downgrade only based on the absence of Tier S/A markers or the presence of specific mechanistic defeaters.
