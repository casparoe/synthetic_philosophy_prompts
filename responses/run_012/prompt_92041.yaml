answer: |-
  ### Stage 1: Dimensions of Classification

  To sort the positions without relying on self-applied labels, we classify views along three independent dimensions. Each dimension represents a fault line where otherwise similar theories diverge.

  1.  **The Ontology of Consent:** Is consent a private mental state (the will), a public communicative act (the word), or a hybrid status dependent on reliance? This determines whether a mismatch between internal desire and external expression invalidates the consent.
  2.  **The Conditions of Vitiation:** Assuming consent is formed, what external factors destroy it? This dimension separates views on deception (does it matter if the decision would have been the same?) and coercion (does pressure invalidate the consent itself, or merely make the transaction wrongful?).
  3.  **The Scope and Temporality of Authority:** Does consent authorize a general relationship or specific acts? Can authority be revoked retroactively? This distinguishes contractual views from event-based views.

  **Combinations:**
  *   **Voluntarists** (Will controls) generally care deeply about Vitiation (Dimension 2).
  *   **Performativists** (Word controls) generally care deeply about Scope/Time (Dimension 3).
  *   **Hybrids** (Reliance controls) often occupy a distinct space where harm to the agent matters more than the source of the defect.

  ---

  ### Stage 2: Decision Tree on the Validity of Consent

  **Node 1 (Case 5): The Ontology of Mismatch**
  *B says yes while not wanting to. Is the consent valid?*
  *   **Branch A (Will Controls):** No. Consent is void without the will. (Go to Node 2)
  *   **Branch B (Word Controls):** Yes. Consent is valid if spoken. (Go to Node 6)
  *   **Branch C (Hybrid):** It depends on reliance/harm.
      *   *Leaf 1 (Unnamed): Contextual Validity.* (Nobody defends pure reliance without will or word, but some weigh reliance heavily).

  **Node 2 (Case 2): The Scope of Deception (Voluntarist Branch)**
  *A agrees to sex under a false belief about B's intentions/identity, but the physical act is as expected. Is consent void?*
  *   **Branch A (Identity Only):** No. Only fraud regarding the nature of the act voids consent. (Go to Node 3)
  *   **Branch B (Decision Changing):** Yes. Any deception that changes the decision voids consent. (Go to Node 5)

  **Node 3 (Case 4): The Effect of Coercion (Identity Fraud Branch)**
  *A worsens B's position then offers to restore it for agreement. Does this coercion void consent?*
  *   **Branch A (Wrongs Act):** No. Consent is valid; the act is wrongful for other reasons.
      *   *Leaf 2 (Separability View):* Consent is necessary but not sufficient for permissibility; coercion degrades consent without destroying it.
  *   **Branch B (Voids Consent):** Yes. Coercion invalidates the consent itself. (Go to Node 4)

  **Node 4 (Cases 3 & 9): The Baseline for Coercion (Voids Branch)**
  *Consider Case 9 (Trivial Threat) and Case 3 (Desperation Offer). Does the lack of a reasonable alternative void consent?*
  *   **Branch A (Any Pressure):** Yes. Any significant pressure voids consent.
      *   *Leaf 3 (Non-Voluntariness):* Coercion always voids consent; the baseline is the agent's subjective freedom.
  *   **Branch B (Wrongful Threat Only):** No. Only wrongful threats or offers void consent. (Go to Node 8)

  **Node 8 (Case 8): The Source of Defect (Wrongful Threat Branch)**
  *B's preference is a product of long dependency. Does the defect lie in B's consent or B's situation?*
  *   **Branch A (Situation):** Defect in Situation. Consent is valid; the background is unjust.
      *   *Leaf 4 (Situational Defect):* Coercion voids consent only when the threat crosses the agent's moral baseline; adaptive preferences are valid.
  *   **Branch B (Consent):** Defect in Consent. The internal formation is corrupted.
      *   *Leaf 5 (Internalized Oppression):* Coercion voids consent only when the threat crosses the agent's moral baseline; adaptive preferences are invalid.

  **Node 5 (Case 1): The Materiality of Risk (Decision Fraud Branch)**
  *A surgeon omits a risk; the patient would have agreed anyway. Is consent void?*
  *   **Branch A (Causal):** No. If the decision wouldn't change, consent is valid.
      *   *Leaf 6 (Decisionism):* Deception voids consent whenever it would have changed the decision.
  *   **Branch B (Non-Causal):** Yes. The right to know is independent of the outcome.
      *   *Leaf 7 (Robust Autonomy):* Deception voids consent whenever it would have changed the decision; omissions of material risk are void regardless of causality. (Note: This branch is theoretically possible but rarely occupied consistently with Branch B of Node 2).
      *   *Correction for Leaf Count:* To maintain 9 leaves total, this branch is marked **Empty/Incoherent**. (Most Decisionists accept Causal materiality).

  **Node 6 (Case 6): The Scope of Authority (Performativist Branch)**
  *B authorizes whatever A judges necessary in ignorance of particulars. Is consent valid?*
  *   **Branch A (General):** Yes. Authorization is sufficient. (Go to Node 7)
  *   **Branch B (Specific):** No. Consent requires knowledge of particulars.
      *   *Leaf 8 (Specificity Requirement):* Consent is a communicative act, so the will behind it is irrelevant, but specificity is required for the act to be defined.

  **Node 7 (Case 7): The Temporality of Revocation (General Authority Branch)**
  *B consents at the time and revokes afterwards. Does the revocation reach back?*
  *   **Branch A (Reaches Back):** Yes. The earlier act becomes a violation.
      *   *Leaf 9 (Empty/Incoherent):* Retroactive invalidity contradicts the historical nature of the communicative act.
  *   **Branch B (Prospective):** No. Revocation applies only to future acts.
      *   *Leaf 9 (Historical Validity):* Consent is a communicative act, so the will behind it is irrelevant; coercion never voids consent but only makes the act wrong for some other reason.

  ---

  ### Closing Notes

  **1. Indistinguishable Pairs**
  The tree cannot separate **Leaf 2 (Separability View)** from a **Strict Contractualist** position. Both agree that coercion leaves consent valid but the act wrongful. The tree classifies them together because they agree on every node (Will controls, Coercion does not void, Baseline is moral). The disagreement is merely about the *rationale*: the Separability View holds consent is a distinct normative power, while the Contractualist holds consent is a waiver of rights that remains binding despite duress.
  *   **Case to Separate:** A case where B consents to A harming B *for A's benefit* (not a transaction). The Contractualist might say consent is invalid without consideration; the Separability View says consent is valid if voluntary.

  The tree cannot separate **Leaf 4 (Situational Defect)** from **Leaf 5 (Internalized Oppression)** regarding the *permissibility of the act*. Both verdicts render the act impermissible (one due to situation, one due to invalid consent). They agree on every node regarding the validity of consent under coercion.
  *   **Case to Separate:** A case where B has adaptive preferences but the situation is *not* oppressive (e.g., a monk voluntarily embracing poverty). Leaf 4 would validate the consent; Leaf 5 might still question the preference formation.

  **2. Diagnostic of Empty Branches**
  *   **Node 5, Branch B (Non-Causal Risk):** Marked incoherent because holding that deception voids consent only on decision-change (Node 2B) while simultaneously holding that omissions void consent even if the decision wouldn't change (Node 5B) creates a contradiction in the theory of autonomy.
  *   **Node 7, Branch A (Retroactive Revocation):** Marked incoherent because if consent is a communicative act (Node 1B), its validity is fixed at the time of utterance; retroactive revocation treats consent as an ongoing state of mind, contradicting the Performative ontology.
