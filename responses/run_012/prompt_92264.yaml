      *   **The Task:** Diagnose the disagreement (not solve it). Is it verbal, substantive but mislabeled, or talking past each other (different questions)? Identify hidden formal/empirical questions. Advise on what counts as progress.
      *   **Constraints:** American English, no citations/reading list, suitable for qualifying exam prep (clear, analytical, structured).

  2.  **Deconstruct the Disagreement:**
      *   *The "Coherence" Critique:* This is the classic Sunstein/Bostrom style argument. If you ban action due to uncertainty, you freeze the status quo. But the status quo has risks. Therefore, PP is self-contradictory unless it collapses into CBA.
      *   *The "Procedural" Defense:* This is the legal/STS view. PP isn't "never act." It's "shift the burden of proof to the proponent of the activity" and "require a certain threshold of safety before acting." It's about *process*, not *outcome*.
      *   *The Mismatch:* Side A is treating PP as a *substantive decision rule* (maximize safety/minimize risk). Side B is treating PP as a *procedural heuristic* (who proves what, when).

  3.  **Evaluate the "Type" of Disagreement:**
      *   *Verbal?* Partly. They are using "Precautionary Principle" to refer to different objects. One sees a maxim, the other sees a process.
      *   *Substantive but mislabeled?* Yes. It's about risk-risk tradeoffs and burden of proof allocation.
      *   *Different Questions?* This is the strongest diagnosis. Side A asks: "Can this principle determine the *optimal choice*?" Side B asks: "Can this principle structure the *legitimacy of the process*?"

  4.  **Identify Hidden Formal/Empirical Questions:**
      *   *Risk-Risk Tradeoffs:* The economists are right that inaction has risk (the carcinogen). The STS folks are implicitly arguing about *type* of risk (uncertain vs. known) and *reversibility*.
      *   *Asymmetry:* Is there a formal asymmetry between Type I and Type II errors here? The economists treat them symmetrically (both are costs). The regulators/STS folks treat them asymmetrically (false positive = bad, but false negative = catastrophic/irreversible).
      *   *Epistemic Asymmetry:* Who holds the data? The utility holds the data on the new chemical. The public holds the risk. The PP shifts the cost of generating information.

  5.  **Determine What Counts as Progress:**
      *   Arguing about "coherence" is a dead end because "coherence" depends on whether you view it as a maxim or a procedure.
      *   Progress lies in shifting from *definition* to *institutional design*.
      *   Specific distinction needed: *Substantive* vs. *Procedural* PP.
      *   Specific question needed: *Under what conditions is shifting the burden of proof efficient or just?*

