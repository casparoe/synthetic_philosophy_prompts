answer: |-
  Here is a diagnosis of the disagreement, structured for your qualifying exam prep.

  ### 1. The Diagnosis: A Category Error Between Decision Rules and Procedural Norms

  The disagreement in your seminar is not merely verbal, nor is it purely substantive. It is a **category error** regarding the function of the principle itself. The two sides are treating the Precautionary Principle (PP) as different types of objects, which makes their arguments incommensurable.

  *   **The Economists/Risk Analysts** are treating the PP as a **substantive decision rule**. They are asking: "Does this principle provide a consistent algorithm for selecting the optimal outcome?" When they argue that a strict PP leads to paralysis (because inaction also carries risk), they are applying a test of logical consistency to a maxim. They are correct that if the PP is defined as "avoid all uncertain risks," it is incoherent because the status quo also contains uncertain risks. They are evaluating the PP as a *solver* of optimization problems.
  *   **The STS/Lawyers** are treating the PP as a **procedural or institutional norm**. They are asking: "Does this principle provide a legitimate framework for assigning burdens and sequencing inquiry?" When they argue it functions as a presumption about evidence, they are describing a *heuristic* for governance, not a calculator for outcomes. They are evaluating the PP as a *structurer* of political and administrative processes.

  **Verdict:** You are correct that they are answering different questions under a single name. The critics are asking whether the PP can serve as a **decision rule for a single agent** (maximizing utility/safety), while the defenders are asking whether it works as a **deliberative or institutional norm** (managing legitimacy and uncertainty in a pluralistic system). The frustration arises because the critics demand mathematical coherence from a legal heuristic, while the defenders demand political sensitivity from an economic model.

  ### 2. The Hidden Formal and Empirical Engine

  Beneath the semantic fighting, there is a hidden formal disagreement about **error costs and asymmetry**, and a hidden empirical disagreement about **reversibility**.

  **The Formal Question: Symmetry of Error Costs**
  The economists' critique relies on a hidden assumption that Type I errors (false positives: blocking a safe chemical) and Type II errors (false negatives: approving a dangerous chemical) are symmetric costs. In their cost-benefit framework, a risk is a risk, regardless of direction.
  The PP defenders are implicitly arguing for an **asymmetry of error costs**. They operate on the premise that in environmental health, a false negative (allowing a toxin) is potentially catastrophic, irreversible, or morally distinct from a false positive (delaying a cost-saving measure). The "coherence" attack fails to land on the defenders because they do not accept the symmetry premise. They are not trying to minimize total risk; they are trying to avoid a specific class of tail-risk events that CBA often discounts.

  **The Empirical Question: Reversibility and Learning Rates**
  The hidden empirical question driving the specific case (the coagulant) is about **reversibility**.
  *   **Economists' View:** If the new chemical is bad, we can switch back. If the old chemical is bad, we know the cost. Therefore, compare expected values.
  *   **Defenders' View:** If the new chemical causes ecological collapse or latent human disease, we cannot "switch back." The damage is done. Furthermore, the "null" tox battery is static data, but the biological system is dynamic.
  The fight is actually about the **rate of learning versus the rate of harm**. The PP is invoked when the potential harm outpaces the ability to learn from mistakes. If the harm is reversible and learning is fast, the PP collapses into CBA (the economists win). If the harm is irreversible and learning is slow, the PP functions as a brake (the defenders win). Your seminar is stuck because no one has explicitly defined the reversibility constraints of the coagulant case.

  ### 3. What Counts as Progress

  Continuing to ask "Is the Precautionary Principle coherent?" is a dead end. It is like asking "Is democracy efficient?" The answer depends entirely on whether you define democracy as a voting algorithm or a system of rights.

  **Stop asking about coherence. Start asking about allocation.**
  Progress in your seminar would come from shifting the debate from the *definition* of the principle to the *conditions of its trigger*. You should propose the following distinctions to move the discussion forward:

  1.  **Distinguish Substantive vs. Procedural PP:** Explicitly grant the economists that the *substantive* PP (never act without certainty) is incoherent. Grant the lawyers that the *procedural* PP (shift burden of proof to the innovator) is coherent but requires boundaries. This dissolves the "paralysis" argument.
  2.  **Operationalize the Burden Shift:** The real policy question is not "PP yes or no?" but "How much evidence is enough to shift the burden?" In your coagulant case, is a $p=.08$ fish study sufficient to shift the burden back to the utility to prove safety, or does the known carcinogen risk keep the burden on the regulators to prove harm?
  3.  **Identify the Asymmetry Threshold:** Ask the group to specify the conditions under which error costs become asymmetric. Is it human health vs. economic cost? Is it irreversibility? Is it the vulnerability of the population?

  **Recommendation for your Prep Doc:**
  The honest answer is that you should stop asking whether the principle is coherent and start asking **which institution ought to hold the burden of proof under conditions of deep uncertainty.** The Precautionary Principle is not a truth claim; it is a jurisdictional claim. It argues that when science cannot quantify the risk, the authority to decide should not rest with the party benefiting from the uncertainty. If your seminar can pivot to debating *who* pays for the evidence and *when* the burden shifts, rather than whether the principle is logically perfect, you will actually be doing environmental policy.
