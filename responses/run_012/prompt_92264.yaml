          1.  Diagnosis of the Disagreement (The Core Mismatch).
          2.  The Hidden Formal/Empirical Engine (Risk-Risk & Asymmetry).
          3.  Path to Progress (Institutional vs. Philosophical).

      *   *Drafting Section 1 (Diagnosis):* It's not just verbal. It's a category error. Economists view PP as a *decision function* (input -> output). Lawyers/STS view it as a *meta-rule* (rules about making rules). The economists are attacking a strawman of "absolute safety," but the lawyers are right that real-world PP is about burden shifting. However, the lawyers haven't explained *how much* burden shifting is enough.
