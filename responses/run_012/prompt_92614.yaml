      *   *Okasha's View:* Samir Okasha (*Evolution and the Levels of Selection*) is the go-to reference here. He argues the equivalence thesis holds for *outcomes* but not for *causal explanation*.
      *   *The "Arbitrary Partition" problem:* The user says "Given a fixed partition." But in nature, the partition isn't fixed. The genic selectionist argues the *only* non-arbitrary partition is the gene. The MLS theorist argues functional groups are non-arbitrary. This is an ontological disagreement.
      *   *Settling the dispute:* How do we settle it? We can't settle it by math. We settle it by looking at mechanisms. If group splitting is a biological mechanism, MLS is causally real. If it's just individuals dying, maybe not.

