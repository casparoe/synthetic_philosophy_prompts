answer: |-
  **The Case**

  Alice and Bob are ordinary adults attempting to learn the skill of cracking a heavy bath towel like a whip to produce a sonic boom. They receive identical instruction from the same coach, watch the same slow-motion videos, and are taught the same physical theory: the crack is produced by a loose wrist allowing a wave to accelerate down the towel, not by a forceful snap. Both explicitly believe this description applies to the successful technique and to their own attempts. After six weeks of matched practice, Alice can reliably crack the towel; Bob cannot, despite identical equipment and health. When asked to describe her successful motion, Alice reports, "I snap my wrist hard at the end," which high-speed video confirms is false; her wrist remains loose. When asked to describe Alice's motion, Bob correctly reports, "She keeps her wrist loose and lets the wave travel," reciting the true mechanical description he was taught. Alice is fully articulate and sincere; her false report stems from the intense proprioceptive sensation of the handle jerking in her hand, which feels indistinguishable from an active snap.

  ***

  **1. The Verdicts**

  **The Intellectualist (Stanley & Williamson):** Alice knows the proposition *that keeping the wrist loose is the way to crack the towel*. She grasps this proposition under a *practical mode of presentation* (PMOP). This mode is distinct from the theoretical mode Bob possesses. Bob lacks the PMOP; he only grasps the proposition under a theoretical mode. The Intellectualist explains Alice's false spoken report by arguing that the PMOP is non-linguistic; when forced to translate her practical grasp into words, she defaults to the misleading phenomenological description ("snap") because the PMOP itself cannot be verbalized. Bob lacks the ability because he lacks the PMOP, rendering his theoretical knowledge inert for action.

  **The Anti-Intellectualist:** Alice possesses the *ability* to crack the towel; Bob does not. This ability is not constituted by knowledge of any proposition. The fact that Bob possesses the true proposition (and can recite it) while failing proves that propositional knowledge is insufficient for knowing-how. Alice's false report confirms that her success is not guided by a belief about her movement (since her belief is false), but by a non-propositional capacity. The difference between them is a difference in kind (ability vs. information), not a difference in mode of access to the same information.

  **2. The Working Feature and Removal Test**

  The single feature doing the work is **the divergence between the successful agent's proprioceptive report and the physical reality of her movement.**

  If this feature is removed—i.e., if Alice accurately reports "I keep my wrist loose"—the case collapses into the familiar **insufficiency argument**. If Alice reports the truth, the Intellectualist can simply say, "See? She knows the proposition, and she acts on it." The Anti-Intellectualist would then have to rely solely on Bob's failure to argue that propositions are insufficient. By introducing Alice's *false* report, the case pressures the Intellectualist to explain how Alice can "know" the true proposition (under a PMOP) while sincerely asserting a falsehood about her own action. It forces the Intellectualist to sever the link between knowledge and articulate self-ascription more radically than standard cases do.

  **3. The Practical Mode of Presentation Reply**

  **The Reply:** The Intellectualist argues that knowing-how is knowing a proposition under a practical mode of presentation. This mode is essentially first-personal and action-guiding. It explains why Alice succeeds (she has the PMOP) and why she cannot speak the truth (the PMOP is not a linguistic vehicle; her verbal report is a fallible translation of the feeling caused by the PMOP).

  **Does it rescue?** It saves the letter of the theory but strains its spirit. It posits a mental state that guides action correctly but systematically misleads verbal report.

  **Is it circular?** Yes, dangerously so. For the Intellectualist to avoid saying Alice *doesn't* know the proposition (since she asserts the opposite), they must define the PMOP in terms of the ability itself. If the PMOP is "the way of grasping the proposition that enables success," then "Knowing how to F = Knowing that w is a way to F under the mode that enables F-ing." This looks like an analysis of knowing-how that uses knowing-how (the ability to F) to define the mode. If the mode is available only to those who already have the ability, the propositional knowledge drops out as an explanatory idle wheel; the ability is doing all the work, and the proposition is merely a passenger tagged with a "practical" label.

  **4. The Strongest Intellectualist Attack**

  The strongest attack is to **relocate the proposition.** The Intellectualist should argue that Alice *does* know a true proposition about her movement, but it is not the mechanical one Bob knows. Alice knows *that this feeling is the feeling of the correct wave propagation.*

  **What must be true for this to succeed:** For this attack to work, it must be the case that Alice's false report ("I snap") is not an expression of her belief, but a mislabeling of a true, non-conceptual awareness. The Intellectualist must claim that Alice's knowledge is *de re* about the movement she is making, even if her *de dicto* report is wrong. They must argue that Bob's deficit is indeed a deficit of knowledge: Bob lacks the *demonstrative* knowledge *that this [feeling] is the way to do it.* He has the theory; she has the demonstration. If the Intellectualist can establish that proprioceptive feelings can serve as the constituents of propositions (e.g., *<That sensation, being the way to crack the towel>*), they can maintain that Alice knows a truth Bob does not, without relying on the circular PMOP. However, this requires accepting sensations as propositional constituents, which many philosophers reject.

  **5. Conclusion**

  The case **refutes neither side definitively**, but it exposes a significant cost for Intellectualism. It demonstrates that to maintain the view that knowing-how is a species of knowing-that, the Intellectualist must accept that an agent can know a truth about their own action while sincerely denying it in speech, and that the "mode" distinguishing this knowledge is indistinguishable from the ability itself. The Anti-Intellectualist gains the stronger intuitive footing here: the divergence between Alice's true ability and her false belief about that ability suggests that the ability is not constituted by the belief (or knowledge) at all. However, because the Intellectualist can always retreat to the claim that the "practical mode" is ineffable and distinct from verbal report, the case does not logically falsify Intellectualism; it merely renders it less parsimonious. The verdict is that the case makes Intellectualism **expensive**, not impossible.
