      *   *Importance:* If the core justification fails, the rest doesn't matter.
      *   *Tractability (Non-empirical):* Normative theory and conceptual institutional design are highly tractable for philosophers/political theorists. Empirical questions (will they actually understand the bills?) are off-limits, so focus on *conceptual* conditions for competence.
      *   *Neglectedness:* Most sortition literature focuses on positive lawmaking (replacing or augmenting legislatures). Negative power is less explored (though some historical precedents exist conceptually). The specific interaction with a supermajority reinstatement is a key design quirk.
      *   *Dependency:* Justification drives design. Design drives procedural rules.

  5.  **Develop the Agenda (Ordering & Reasoning):**

      *   *Priority 1: The Normative Case for Negative Power.*
          *   Why repeal only? Standard sortition theory argues random citizens are as good as elites at deciding *what should be done*. This model argues they are better at deciding *what should not be done* (or at least, that's the only power we trust them with). This needs a robust theoretical defense. Is it epistemic (error-correction)? Is it protective (tyranny prevention)?
          *   *Upstream:* Everything else depends on this. If the justification is weak, the design is moot.
          *   *Tractability:* Pure political theory.
          *   *Neglectedness:* High. Most sortition work assumes positive power.

      *   *Priority 2: The Epistemic Conditions for Competent Veto.*
          *   What knowledge is required to repeal vs. enact? Is the bar lower? If so, why? Does the "written rationale" requirement support this?
          *   *Upstream:* Informs design of deliberation, expert witnesses, and scope.
          *   *Tractability:* Conceptual analysis of "policy competence."
          *   *Neglectedness:* Medium. Competence is discussed, but specifically for *negative* judgment is less so.

      *   *Priority 3: Institutional Stability and the Reinstatement Mechanism.*
          *   The legislature needs a supermajority to reinstate. This creates a specific balance of power. Is it a veto gate or a trigger for reform? How does this affect the equilibrium between the CRC and the Legislature?
          *   *Upstream:* Determines viability and resistance to capture/gridlock.
          *   *Tractability:* Formal political theory / conceptual institutional analysis.
          *   *Neglectedness:* High. Specific interaction of sortition veto + supermajority override is unique.

      *   *Priority 4: Accountability and Anonymity.*
          *   Members write rationales but publish anonymously. Non-renewable terms. How do we prevent irresponsibility or capture without electoral accountability?
          *   *Upstream:* Legitimacy.
          *   *Tractability:* Theoretical work on accountability mechanisms beyond elections.
          *   *Neglectedness:* Medium. Sortition accountability is a known problem, but the specific rationale/anonymity combo is specific to this prototype.

      *   *Priority 5: Scope and Definition of "Repeal".*
          *   Can they repeal appropriations? Regulatory guidelines? This is detailed design work.
          *   *Upstream:* Less so, more downstream implementation.
          *   *Tractability:* Legal theory.
          *   *Neglectedness:* Low (standard legislative drafting issues).

  6.  **Refine the Ordering:**
      *   1. Normative Justification (The "Why").
      *   2. The Epistemic Bar (The "Can").
      *   3. The Legislative Interaction (The "How it fits").
      *   4. Internal Incentives (The "How it works").
