      *   **Resource:** ~10 researcher-years over 3 years.
      *   **Topic:** Conceptual and institutional design of sortition-based governance (specifically a "Citizens' Review Chamber").
      *   **Constraints:** No empirical work (no experiments, surveys, field trials). No literature surveys. No citations/reading lists/names of specific works.
      *   **Prototype:** Citizens' Review Chamber (CRC).
