answer: |-
  Allocate the majority of researcher-years to establishing the normative justification for negative-only authority and the strategic logic of the supermajority reinstatement clause, as these are the upstream constraints that determine whether the model is theoretically coherent and politically stable before any procedural details matter.

  To prioritize these questions, I am applying four explicit criteria. **Importance** measures whether a negative answer kills the project entirely. **Tractability** assesses whether the question can be resolved through conceptual argument and formal modeling without empirical data. **Neglectedness** identifies where standard sortition theory fails to address the specific quirks of your prototype. **Dependency** counts how many downstream design choices rely on the answer. I am weighting Importance and Dependency highest, because funding work on downstream mechanisms is wasteful if the foundational logic is unsound, and I am prioritizing Tractability to ensure your researchers can actually produce deliverables within the three-year constraint.

  **Priority 1: The Normative Case for Negative Asymmetry**
  This is the most upstream question. Standard sortition theory argues that random citizens are equally or more competent than elites at positive lawmaking because they are free from careerist incentives and represent the demographic truth of the populace. Your prototype rejects this symmetry, granting power only to destroy, not create. Theorists must defend why the epistemic or normative conditions for *repeal* are met by a sortition body when the conditions for *enactment* are not. Is the argument that citizens are better at recognizing harm than designing solutions? Is it that negative power is less dangerous if captured? If this asymmetry cannot be defended against standard democratic theory—which usually views veto powers as counter-majoritarian difficulties—the rest of the design is illegitimate. This is highly tractable for political philosophers, highly neglected in sortition literature (which focuses on replacement or bicameral equality), and every other design feature depends on this justification holding water.

  **Priority 2: The Institutional Equilibrium of the Reinstatement Clause**
  Once the right to veto is established, the supermajority requirement for legislative reinstatement defines the actual balance of power. This is a conceptual problem of institutional stability that can be modeled without empirical data. If the supermajority threshold is too high, the Citizens' Review Chamber becomes the de facto legislature, violating the negative-only mandate. If it is too low, the Chamber becomes a symbolic nuisance that the ordinary legislature ignores. Theorists need to map the conditions under which this specific veto-override dynamic produces stable governance versus constitutional crisis. This is neglected because most bicameral models assume symmetric powers or judicial review, not a sortition-based veto with a legislative override. It is highly dependent on the first question but upstream of all procedural rules regarding deliberation and voting.

  **Priority 3: Epistemic Requirements for Competent Repeal**
  This question asks what knowledge is necessary to validly repeal a law compared to drafting one. If the theoretical bar for competence is identical, the negative-only restriction looks arbitrary; if the bar is lower, theorists must define why. This informs the design of the expert witness budget and the fixed deliberation days. This is tractable as a conceptual analysis of policy competence and risk assessment. It is moderately neglected, as sortition literature assumes general competence but rarely distinguishes between types of legislative acts. It is downstream of the normative case but upstream of the specific deliberative procedures.

  **Priority 4: Accountability via Anonymous Rationales**
  Your prototype replaces electoral accountability with mandatory written rationales published anonymously. Theorists must analyze whether this mechanism can sustain deliberative quality and prevent capture without the threat of removal. This is a conceptual design question about incentives and reputation within a closed group. It is less neglected than the first two questions, as there is existing work on deliberative accountability, but the specific combination of anonymity and publication is unique. It is downstream of the competence question; if members lack the epistemic capacity to form rationales, the mechanism fails regardless of incentives.

  **Priority 5: Jurisdictional Scope and Definition of Repeal**
  Defining what counts as a "statute" or "regulation" eligible for repeal is detailed legal theory. While important for implementation, it is downstream of the normative and structural questions. If the chamber lacks normative justification or is structurally unstable, the scope of its power is irrelevant. This is highly tractable but low neglectedness, as it mirrors standard administrative law questions.

  **Trade-offs and Reordering Conditions**
  I am trading off depth on procedural details for breadth on foundational logic. If the normative case for negative power is weak, no amount of work on rationales or witness budgets will save the model. However, this ranking is contingent. If researchers produce a definitive proof that negative-only sortition is normatively incoherent, the agenda must immediately pivot to either abandoning the project or redesigning toward positive power, rendering the subsequent priorities moot. Conversely, if the normative case is secured quickly, Priority 2 ( Institutional Equilibrium) should absorb more resources, as a stable veto mechanism is the most likely point of practical failure. If formal modeling shows the supermajority clause inevitably leads to gridlock regardless of thresholds, the design requires structural revision before procedural incentives are analyzed. Finally, if theorists determine that the epistemic bar for repeal is indistinguishable from enactment, the negative-only constraint loses its justification, forcing a reevaluation of Priority 1.
