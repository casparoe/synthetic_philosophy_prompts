          *   Walk through the top priorities with reasoning.
          *   Explain trade-offs.
          *   Explain what would change the ranking (evidence/arguments).
      *   *Tone:* Decisive, analytical, tailored to a grant committee chair.
      *   *Constraint Check:* No citations. No empirical suggestions. No preamble.

      *Self-Correction on "Neglectedness":* I need to be careful not to say *no one* has thought about veto powers. But in the context of *sortition*, most work is on "House of Lots" replacing lower houses. A "Review Chamber" is distinct. The neglect is in the *combination* of sortition + negative power.
      *Self-Correction on "Tractability":* Ensure I emphasize that these are conceptual problems solvable by argument and modeling, not data collection.

      *Refining the "Bottom Line":* Make it punchy. "Allocate the majority of researcher-years to establishing the normative justification for negative-only authority and the strategic logic of the supermajority reinstatement clause, as these are the upstream constraints that determine whether the model is coherent or collapses into gridlock or irrelevance."

      *Refining the Criteria Explanation:* Be explicit.
      *   Importance: Does it kill the project if wrong?
      *   Tractability: Can pure theorists solve this?
      *   Neglectedness: Is this specific to the CRC or generic?
      *   Dependency: Does it block other work?

      *Refining the Priorities:*
      1.  **Normative Asymmetry:** Why trust them to stop but not start? (Foundational).
