      *Revised Ordering:*
      1.  **Normative Justification for Negative-Only Authority.** (Foundational. If this fails, project fails. Highly neglected in sortition lit.)
      2.  **The Logic of the Supermajority Reinstatement Clause.** (Defines the actual power balance. Is it a veto or a suggestion? Crucial for stability.)
      3.  **Epistemic Requirements for Repeal vs. Enactment.** (Justifies the asymmetry. Is repeal easier? Why?)
