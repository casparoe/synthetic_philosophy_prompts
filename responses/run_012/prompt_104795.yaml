          *   Staggered 2-year terms, non-renewable.
          *   Authority: Negative only (repeal/suspend existing statutes/regulations).
          *   No positive legislation (no introduce/amend/draft).
          *   Repeal reconsidered by legislature within 1 year.
          *   Legislature reinstates only by supermajority.
          *   Deliberation fixed days, expert witness budget.
          *   Mandatory written rationales (published anonymously).
          *   Features are provisional guesses.
      *   **Task:** Defend an agenda for where the researcher-years should go. Order the open questions. Explain reasoning (upstream/downstream, tractability for theorists, neglectedness vs. standard answers).
      *   **Criteria:** Importance, Tractability (for non-empirical theorists), Neglectedness (mismatch with standard sortition/election models), Dependency (how many other questions depend on the answer).
      *   **Format:** Definite position. Bottom line in the first sentence. No preamble. No restating the question.

  2.  **Deconstruct the Prototype (CRC):**
      *   It's a *veto chamber* or *negative legislature*.
      *   It's sortition-based (descriptive representation).
      *   It's distinct from standard "Sortition House" models (which usually propose bicameralism with equal or near-equal positive legislative power).
      *   It's distinct from "Constitutional Courts" (which review for constitutionality, not policy wisdom).
      *   It's distinct from "Referendums" (which are majoritarian, not deliberative/sortition).
      *   Key tension: Why trust random citizens to *stop* laws but not *make* them? What is the epistemic or normative justification for negative power specifically?

  3.  **Identify Potential Research Questions:**
      *   Normative Justification: Why negative power? Why sortition for this?
      *   Institutional Design: Term lengths, group size, voting thresholds.
      *   Relationship with Legislature: Supermajority requirements, reconsideration mechanisms.
      *   Deliberative Quality: How to ensure good rationales without empirical study? (Conceptual design of incentives).
      *   Scope of Authority: What counts as "repeal"? Can they repeal funding?
      *   Stability vs. Change: Does this create gridlock?
