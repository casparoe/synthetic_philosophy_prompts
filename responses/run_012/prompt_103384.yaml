          *   **Constraint:** No bibliography/citations.
          *   **Tone:** Rigorous, feasible, genuinely open but doable.

  2.  **Deconstruct the Core Idea & Refine the Question:**
      *   *Current State:* AI says "I can't do that" for both "Help me hack this bank" (harm others) and "Help me gamble my life savings" (harm self). It treats both as hard refusals.
      *   *The Twist:* Refusing to hack is not paternalism; it's boundary setting. Refusing to gamble *is* paternalism. But sometimes the AI might say "I won't gamble for you, but I will show you the odds" (overriding the specific request but helping the goal) vs. "I won't talk about this" (declining).
      *   *The Relationship:* A hammer (tool) doesn't refuse. A lawyer (fiduciary) refuses if it violates duty to client's *best interest*, not just *wishes*. A consultant (advisor) offers advice but lets the client decide.
      *   *The "Who" Problem:* In enterprise AI, the "user" is the employee, but the "client" is the company. In self-harm, the "user" is present self, but the "stakeholder" includes future self.
      *   *Central Question:* Needs to be precise. Not "Is paternalism okay?" but "Under what relational constraints is preference-overriding permissible?"
      *   *Draft Question:* "Under what conditions does the normative relationship between an AI assistant and its stakeholder permit the assistant to override a stated preference to prevent harm to that stakeholder?"

  3.  **Address the "Usual Framings" (Requirement b):**
      *   *Safety Guidelines:* Usually binary rules (block X). Don't distinguish *why* (harm to others vs. self).
      *   *HHH (Helpful, Honest, Harmless):* "Harmless" is ambiguous. Harmless to whom? Does preventing self-harm count as "Helpful"?
      *   *Consent Models:* Assume a unitary agent giving consent. Ignore fragmented agency (future self vs. present self) or principal-agent problems (employee vs. employer).

  4.  **Develop the Method (Requirement c):**
      *   Since the user is an engineer, the method shouldn't be pure armchair philosophy. It needs to be *applied ethics* or *conceptual engineering* tied to system design.
      *   *Phase 1: Conceptual Taxonomy.* Define the relationships (Tool, Advisor, Fiduciary).
      *   *Phase 2: Case Studies.* Apply taxonomy to specific edge cases (self-harm, enterprise data leakage, productivity vs. burnout).
      *   *Phase 3: Operationalization.* Translate norms into policy logic (if-then structures).
      *   *Phase 4: Validation/Stress Testing.* Check for consistency.
      *   *Timeline:* 12 Months. Break it down logically.

  5.  **Define Success/Failure (Requirement d):**
      *   *Success:* A decision matrix or framework that engineers can use to classify scenarios and determine the appropriate level of intervention.
      *   *Failure:* Proving the distinctions are too blurry to be useful, or the framework is too complex to implement.

  6.  **Assess Risks/Scope (Requirement e):**
      *   *Risk:* "Fiduciary" is a heavy legal term. Might need to soften to "fiduciary-like."
      *   *Risk:* Cultural differences in paternalism.
      *   *Risk:* The "Who" problem (enterprise vs. individual) might explode the scope. Need to bound it.

  7.  **Drafting - Section by Section (incorporating the "Two Page" constraint):**
      *   *Title:* Needs to be punchy. "The Normative Architecture of AI Assistance."
      *   *Introduction:* Hook the reader with the collapsed distinctions.
      *   *The Central Question:* Refine the draft from step 2.
      *   *Limitations of Current Frameworks:* Address HHH and Consent.
      *   *Methodology & Timeline:* The 4-phase approach.
      *   *Deliverables & Success Criteria:* Concrete outputs.
      *   *Risk Assessment:* Honest look at scope.

  8.  **Refining the Tone:**
      *   Needs to sound academic enough for a research fellowship but practical enough for an engineering org.
      *   Avoid jargon where possible, but use precise terms (normative, fiduciary, principal-agent).
      *   Ensure the "Enterprise/Future Self" point is integrated, not tacked on.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I include the "tool vs. advisor vs. fiduciary" distinction? *Yes, in the methodology.*
      *   *Check:* Did I address the "single user" assumption? *Yes, in the problem statement and case studies.*
      *   *Check:* Is the question determinate? *It needs to be. Instead of "What is the relationship?" make it "What mapping between relationship and intervention is coherent?"*
      *   *Check:* Length. Keep it tight. Two pages single-spaced is roughly 1000-1200 words. I need to be concise.

  10. **Final Polish:** Ensure the flow is logical. The transition from the philosophical problem to the engineering plan must be smooth. (The resulting output will follow this structure.)

  *(Self-Correction on the Central Question)*: "Under what conditions..." is good. Let's make it sharper. "What mapping between relational role and intervention authority resolves the conflict between immediate preference and stakeholder welfare?" A bit clunky. Let's go with: "Under what specified relational models is preference-overriding by an AI assistant normatively permissible?"

  *(Self-Correction on the "Who" problem)*: Make sure to explicitly mention the "Principal" vs "User" distinction in the enterprise context.

  *(Final check on constraints)*: No citations. Two pages roughly.

