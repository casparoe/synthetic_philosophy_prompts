answer: |-
  The scenario is specific, but the stakes are general. Ada and Bo are ideal Bayesians. They have watched the same twenty-year stream of economic data. They share a prior over the state of the economy itself. Yet, Ada assigns a 70% probability to a recession, and Bo assigns 40%. They know each other's numbers. They know each other is rational. The only friction is meta-epistemic: Ada thinks Bo's cognitive channel is noisier than Bo thinks it is, and Bo returns the favor. They agree to disagree.

  The question is whether this scenario represents a legitimate boundary of rationality or a hidden failure of it. One camp says Aumann's Agreement Theorem is a mathematical curiosity that applies only to angels who share a single soul (a common prior). They argue that real agents inevitably start with different priors, especially about each other's trustworthiness, and that demanding otherwise is a category error. The other camp says the theorem reveals a deep norm: if you know a peer disagrees with you, you are rationally compelled to converge.

  I argue for the latter. The theorem is a genuine normative constraint on rationality, and Ada and Bo are failing it. Their persistence in disagreement is not a testament to the limits of idealization, but a failure to fully internalize what "common knowledge of rationality" requires. To defend this, we must look hard at what "sharing a prior" means, why the distinction between the world and reliability is illusory, and why the "human condition" defense of disagreement collapses under symmetry.

  First, we must address the Common Prior Assumption (CPA). Critics often dismiss this as a modeling convenience, a way to make the math tractable rather than a requirement of reason. They argue that priors are subjective starting points, shaped by genetics, culture, or private history. If rationality allows for subjective starting points, then Ada and Bo are free to start with different assessments of each other's reliability.

  But this misunderstands the work the prior does in the proof. The prior is not just a psychological starting gun; it is the encoding of how evidence *should* weigh against truth. If rationality is impersonal—if it is about tracking truth rather than validating identity—then two agents facing the same universe ought to have the same map of how signals relate to states. If Ada and Bo share a prior over the economy but differ on the reliability of the channels processing that economy, they effectively possess different joint probability distributions over the world and the evidence. They are playing different games. To claim they are both "rational" while using different rules to process the same data is to emptily define rationality as "whatever update rule an agent happens to use." If we want rationality to mean "responding correctly to evidence," then there is only one correct response function. Sharing a prior is the requirement that agents agree on the laws of inference.

  This leads to the second point: is the disagreement about the world or about each other? The defense of Ada and Bo hinges on this distinction. They agree on the prior over the *world* (the economy), so they satisfy the core requirement. They only differ on the *meta-world* (who is trustworthy). Therefore, the theorem doesn't apply.

  This distinction is unsustainable. Reliability is not a separate category from the world; it is a fact about the causal structure of the world. "Bo is a reliable forecaster" is a hypothesis about the physical and cognitive state of the universe, just like "The economy will recession." If Ada and Bo differ on this hypothesis, they differ on a fact about the world. Furthermore, in the context of the theorem, private information is modeled as partitions of the state space. If Ada's "reliability prior" leads her to weigh the twenty-year data stream differently than Bo, then effectively, they are treating the data as different evidence. But the theorem stipulates they see the *same* evidence. If they interpret the same evidence differently due to a prior belief about reliability, that belief functions as a private signal. If it is common knowledge that they hold these beliefs, they must update on the fact of the disagreement itself. To say "I disagree with you because I think you're noisy" while knowing "You disagree with me because you think you're reliable" creates a symmetry that should cancel out the bias.

  Here is the strongest version of the opposing view, the one I intend to reject. Let's call it the "Empirical Idealization" argument. This view holds that Aumann's theorem is like frictionless physics: true in the model, irrelevant in the room. Proponents argue that demanding a common prior over reliability is demanding that agents be clones. Real agents have different histories. Ada might have been burned by overconfident partners before; Bo might have a track record of success that reinforces his self-trust. These histories create divergent priors that are rationally justified by their respective experiences. To demand they share a prior is to demand they erase their histories. Therefore, when Ada and Bo disagree, they aren't violating rationality; they are correctly updating from different, legitimate starting points. The theorem survives as math, but fails as a norm because its conditions (identical priors) are empirically impossible for distinct beings. It is a category error to treat a logical constraint on identical minds as a moral constraint on distinct ones.

  This is a compelling picture of the human epistemic condition. It respects the situatedness of knowledge. However, it fails when applied to the Ada/Bo case as described, specifically because of the condition of *common knowledge*.

  For the "Empirical Idealization" defense to work, the differing priors must be opaque to the agents. They must not know *why* they differ. But the setup says it is common knowledge that they differ. Ada knows Bo thinks he is reliable. Bo knows Ada thinks he is noisy. If they are both ideal Bayesians, they must treat each other's opinions as evidence. If Ada knows Bo is rational, she must acknowledge that Bo's 40% credence is the output of a rational process processing the same data. If she dismisses it solely because of her prior on his reliability, she is asserting that her prior on his reliability is more certain than the evidence of his rationality.

  But here is the killer: Bo is doing the exact same thing. They are in a symmetric standoff. If rationality permits Ada to privilege her own reliability assessment simply because it is *hers*, it permits Bo to do the same. But if both are permitted to privilege their own assessments based on indexical facts ("I am Ada," "I am Bo"), then rationality becomes subjective. It ceases to be a tool for converging on truth and becomes a tool for entrenching perspective.

  For the disagreement to survive the theorem's idealization reasonably, Ada and Bo would need private evidence about their own reliability that the other cannot access or evaluate. Ada would need to know something about her own brain that Bo cannot know. But in the scenario, they are watching the same twenty-year stream. That stream includes their own performance. If they are ideal Bayesians, that stream should update their priors on reliability toward convergence. If after twenty years they still differ, and they know they differ, they are effectively ignoring the evidence of the disagreement itself. They are treating the fact of Bo's disagreement as noise rather than signal.

  This is why the "Empirical Idealization" camp is wrong. They treat the prior as a sacred, untouchable origin point. But in a dynamic system with common knowledge, priors are constantly tested. If you know a peer disagrees with you, you have received new evidence: the evidence of their judgment. To maintain your prior over their reliability in the face of their rational disagreement is to refuse to update on that evidence. It is to say, "I know you saw what I saw, and I know you are rational, but I trust my processing of this fact more than yours because I am me." That is not rationality; that is dogma.

  The theorem survives as a norm because it exposes this dogma. It tells us that if we truly believe our peers are rational, and we truly share our evidence, we cannot maintain different conclusions unless we are willing to admit that we are weighting the evidence differently for no reason other than identity.

  So, where do we land? The theorem is a norm only under the condition that agents treat each other's rationality as evidence equal to their own. But that condition is not an unrealistic idealization; it is the definition of epistemic humility. The "Empirical Idealization" camp argues that different priors are inevitable. I argue that while different *initial* priors might be psychologically inevitable, persisting in them after recognizing a peer disagreement is rationally forbidden.

  Ada and Bo are doing something wrong. They are failing to commonize the space of reliability. They are treating "who is trustworthy" as a matter of faith rather than a hypothesis to be tested against the fact of their disagreement. If they were truly rational, the knowledge that Bo disagrees with Ada would force Ada to lower her confidence in her own reliability, and vice versa, until they met in the middle. The fact that they don't proves they are not treating each other as genuine peers, despite their claims.

  The verdict is this: Aumann's Agreement Theorem is not a description of how agents behave, but a constraint on how they ought to reason. It reveals that persistent disagreement between peers who know each other's minds is not a stable state of rationality, but a symptom of hidden arrogance. The "common prior" is not a demand that we be clones; it is a demand that we recognize that the truth does not care who is looking at it. If Ada and Bo cannot agree, it is not because the math is too ideal for the world. It is because they are prioritizing their own identity over the shared evidence. Rationality requires us to drop the identity. Until they do, they are not disagreeing reasonably; they are failing to listen.
