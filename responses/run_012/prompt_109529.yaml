  9.  *(Self-Correction during drafting)*: I need to make sure I don't just bash Big History. The prompt asks to audit the *analogy*. Big History might have value, but the "Google Maps" defense is the specific target. I need to be careful not to say "Big History is fake," but rather "The Google Maps analogy proves it's real, which is false."

