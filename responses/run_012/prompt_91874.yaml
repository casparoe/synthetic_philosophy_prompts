  ### A Note on the Instrument

  You asked for a decision tree, but strictly speaking, **this is a grid.**

  A tree implies logical dependency (if A, then B). But your "mixed-strategy spine" is orthogonal to your "solution set" questions. You can be a Nash believer who thinks mixes are deliberate *or* purified. You can be a Rationalizability believer who thinks mixes are beliefs *or* errors. Forcing these into a single hierarchy suggests that choosing "Nash" logically forces "Purification," which is false.

  Below is a **Diagnostic Map** instead of a tree. It separates the **Epistemic Commitments** (which define the *set* of solutions) from the **Ontological Commitments** (which define the *story* of the mix). This fits on one page, preserves your required branch points as coordinates, and honestly displays where positions collapse.

  ***

  # FOUNDATIONS DIAGNOSTIC MAP

  ### AXIS 1: THE EPISTEMIC LADDER (Which strategies survive?)
  *Start at the bottom. Climb only if you accept the commitment.*

  **[NODE 1] The Skeptic's Fork**
  *Question:* Is it plausible that Rationality and Payoffs are **Common Knowledge** (CKR)?
  *   **NO:** You stop here. Iterated deletion has no behavioral force.
      *   **POSITION: THE SKEPTIC**
      *   *Embarrassing Commitment:* "I use game theory to solve models, but I don't think real agents can solve them."
  *   **YES:** Proceed to Node 2.

  **[NODE 2] The Dominance Fork**
  *Question:* When deleting "irrational" strategies, do we compare against **Pure** strategies only, or **Mixed** strategies too?
  *   **PURE ONLY:** You accept fewer deletions. (Rare in modern theory, leads to wide sets).
  *   **MIXED ALLOWED:** "Never Best Response" = "Strictly Dominated." (Standard).
      *   *Commitment:* "I accept that a player can be ruled out even if no single pure strategy beats them, provided a mixture does."

  **[NODE 3] The Strength Fork**
  *Question:* Do we delete **Weakly** Dominated strategies (best response to nothing *better*) or only **Strictly** Dominated (best response to nothing *equal or better*)?
  *   **WEAK:** Order-dependent. Can delete Nash Equilibria.
      *   **POSITION: ADMISSIBILITY ADVOCATE** (Not requested, but exists).
      *   *Embarrassing Commitment:* "I accept that the order in which I delete strategies changes the prediction."
  *   **STRICT:** Order-independent. Preserves all Nash Equilibria.
      *   *Commitment:* "I will not rule out a strategy just because it's weakly worse; I need strict proof of irrationality."

  **[NODE 4] The Stopping Fork**
  *Question:* Does the process stop when no more strategies can be deleted (**Survivors**), or only when strategies are **Mutual Best Responses** (**Fixed Point**)?
  *   **SURVIVORS:** Rationalizability.
      *   **POSITION: RATIONALIZABILITY**
      *   *Embarrassing Commitment:* "I am comfortable predicting that players might coordinate on outcomes that aren't equilibria, provided they're rational."
  *   **FIXED POINT:** Equilibrium (Nash).
      *   *Commitment:* "Rationality isn't enough; beliefs must be correct in the end."

  **[NODE 5] The Correlation Fork** (Applies to Node 4 & Rationalizability)
  *Question:* Can a player's beliefs about opponents be **Correlated** (e.g., via a mediator or sunspot), or must they be **Independent**?
  *   **INDEPENDENT:**
      *   **POSITION: INDEPENDENT RATIONALIZABILITY / NASH**
      *   *Embarrassing Commitment:* "I believe players cannot condition their expectations on any shared signal, even public noise."
  *   **CORRELATED:**
      *   **POSITION: CORRELATED EQUILIBRIUM / CORRELATED RATIONALIZABILITY**
      *   *Embarrassing Commitment:* "I accept that a mediator could enforce outcomes that aren't Nash, just by whispering recommendations."

  **[NODE 6] The Stability Fork** (Applies only to Equilibrium)
  *Question:* Must the solution withstand **Perturbations** (trembles/mistakes), or is static consistency enough?
  *   **STATIC:** Basic Nash / Correlated Eq.
  *   **DYNAMIC:** Refinements (Trembling Hand, Proper) or Stable Sets.
      *   **POSITION: REFINEMENT / STABLE SETS**
      *   *Embarrassing Commitment:* "I believe equilibrium concepts are broken unless I assume players occasionally make mistakes for no reason."

  ---

  ### AXIS 2: THE ONTOLOGICAL SWITCH (What *is* the randomization?)
  *This switch cuts ACROSS Axis 1. Select one story for the probabilities in your chosen Set.*

  **[NODE 7] The Locus Fork**
  *Question:* When a strategy says "50-50," is the randomness in the **Player's Action** or in the **Opponent's Belief**?
  *   **BELIEF (Epistemic):** The player plays pure; the 50-50 is uncertainty in others' minds.
      *   **POSITION: EPISTEMIC READING**
      *   *Embarrassing Commitment:* "I claim players randomize, but I actually mean I don't know what they'll do."
  *   **ACTION (Ontic):** The player genuinely randomizes.
      *   *Commitment:* "The agent herself is the source of the probability."

  **[NODE 8] The Source Fork** (Applies only if ACTION is chosen)
  *Question:* Is the randomization **Deliberate** (primitive) or a **Limit** (purification)?
  *   **DELIBERATE:** The agent uses a mixed strategy as a primitive tool.
      *   **POSITION: DELIBERATE RANDOMIZATION**
      *   *Embarrassing Commitment:* "I believe economic agents carry around mental random number generators to keep opponents guessing."
  *   **LIMIT (Purification):** The mix is a limit of pure strategies under private payoff shocks.
      *   **POSITION: HARSANYI PURIFICATION**
      *   *Embarrassing Commitment:* "I believe in invisible, tiny payoff shocks to save the theory from requiring mental dice."

  ---

  ### DIAGNOSTIC KEY & COLLAPSES

  **1. The "Nash" Collapse**
  *   **Deliberate Randomization**, **Purification**, and **Epistemic Reading** are not distinct solution sets; they are three stories told about the **Nash** leaf (Axis 1, Node 4).
  *   *Why they collapse:* Mathematically, they yield the same set of strategy profiles. They differ only on whether the model describes *behavior* (Deliberate/Purification) or *information* (Epistemic).
  *   *Indistinguishability:* In a one-shot game with no payoff data, you cannot empirically distinguish Purification from Deliberate Randomization. They differ on a question about the *world* (do payoff shocks exist?), not the *solution concept*.

  **2. The "Stable Set" Outlier**
  *   **Stable Sets** (von Neumann/Morgenstern) sit at Axis 1, Node 6, but they are technically an alternative to the "Set of Strategies" approach entirely (they are sets of *imputations* or outcomes with internal/external stability).
  *   *Diagnosis:* Coherent, but largely abandoned in non-cooperative theory because they are hard to compute and often too permissive. If you choose this, you are prioritizing *social stability* over *individual rationality*.

  **3. The "Skeptic" Trap**
  *   The **Skeptic** (Axis 1, Node 1) rejects the root of the tree. If you choose this, the rest of the map is irrelevant to you.
  *   *Diagnosis:* Coherent, but renders the reading group's topic moot. This position holds that Iterated Elimination is a mathematical operation, not a behavioral prediction.

  **4. The "Correlated" Cut**
  *   **Correlated Equilibrium** and **Correlated Rationalizability** differ only by Axis 1, Node 4 (Fixed Point vs. Survivors).
  *   *Note:* Many "Nash" believers implicitly accept Correlated Equilibrium as a "Nash with a mediator." If you accept Node 5 (Correlated) but reject Node 4 (Fixed Point), you are a Correlated Rationalizability believer—a rare but coherent position.

  ### INSTRUCTIONS FOR USE
  1.  **Read Axis 1 vertically.** Stop at the first "No." That is your **Solution Set**.
  2.  **Read Axis 2 horizontally.** This is your **Interpretation**.
  3.  **Compare coordinates.** If you and a colleague land on the same Set (Axis 1) but different Interpretations (Axis 2), you agree on predictions but disagree on ontology. If you land on different Sets, you disagree on predictions.
