  # DIAGNOSTIC TREE: ONTOLOGICAL AND OPERATIONAL COMMITMENTS IN THE SPECIES PROBLEM

  **NODE 1: THE REALISM CHECK**
  **Case:** Consider a ring species (e.g., *Larus* gulls) where population A breeds with B, B with C, but A does not breed with C.
  **Question:** Is there a fact of the matter about where the first species ends and the second begins, even if we cannot measure it?
  *   **NO** → **LEAF: ELIMINATIVIST**
      *   *Awkward Commitment:* You must explain why biologists successfully predict nature using a category you claim does not exist.
  *   **YES** → **NODE 2**

  **NODE 2: THE CATEGORY TYPE**
  **Case:** Consider a species that goes extinct (e.g., the Dodo).
  **Question:** Did the *species itself* cease to exist (like a person dying), or did only the *members* cease to exist (like a class becoming empty)?
  *   **ITSELF CEASED (Particular)** → **LEAF: SPECIES-AS-INDIVIDUALS**
      *   *Awkward Commitment:* You must explain how a species can be a particular object when its parts (organisms) are constantly replaced over time.
  *   **MEMBERS CEASED (Class/Kind)** → **NODE 3**

  **NODE 3: THE UNIVERSALITY CHECK**
  **Case:** Consider obligately asexual bacteria versus sexually reproducing birds.
  **Question:** Must a single definition cover both, or are we permitted to use different concepts for different parts of the tree of life?
  *   **DIFFERENT CONCEPTS** → **LEAF: PLURALIST**
      *   *Awkward Commitment:* You must accept that "species" is homonymous across the tree of life, complicating general biological laws.
  *   **SINGLE DEFINITION** → **NODE 4**

  **NODE 4: THE CONSTITUTIVE CHECK**
  **Case:** Consider a hybridising plant complex where gene flow occurs but ecological niches remain distinct.
  **Question:** Is the criterion you use (e.g., gene flow) what *makes* them a species, or merely how we *detect* a deeper underlying property?
  *   **MERELY DETECTION (Evidence)** → **LEAF: UNIFIED CONCEPT**
      *   *Awkward Commitment:* You must maintain that disagreements are merely verbal despite decades of substantive theoretical conflict.
  *   **WHAT MAKES IT (Constitutive)** → **NODE 5**

  **NODE 5: THE CRITERION SELECTION**
  **Case:** Consider a case where evidence pulls apart (e.g., paraphyletic ancestry vs. ecological distinctness).
  **Question:** Which property constitutes the species boundary when evidence conflicts?
  *   **CAPACITY TO INTERBREED** → **LEAF: INTERBREEDING-BASED**
      *   *Awkward Commitment:* You must treat obligately asexual organisms as not belonging to any species or posit cryptic sex where none is observed.
  *   **EXCLUSIVE COMMON ANCESTRY (MONOPHYLY)** → **LEAF: MONOPHYLY-BASED**
      *   *Awkward Commitment:* You must accept that a parent species ceases to exist if it gives rise to a daughter species (paraphyly is forbidden).
  *   **ECOLOGICAL NICHE/ROLE** → **LEAF: ECOLOGICAL**
      *   *Awkward Commitment:* You must count genetically identical clones in different niches as distinct species while lumping distinct genotypes in the same niche.
  *   **SEPARATE EVOLUTIONARY TRAJECTORY/IDENTITY** → **LEAF: EVOLUTIONARY-LINEAGE**
      *   *Awkward Commitment:* You must identify lineage separation events that are often invisible until long after they have occurred.

  ***

  ### DIAGNOSED UNOCCUPIED PATHS

  **1. Realist + Individual + Pluralist**
  *   **Diagnosis:** **Incoherent.** If species are particulars (individuals), there cannot be multiple legitimate concepts of the same particular. You cannot have "plural concepts" of a single person; similarly, if a species is a specific lineage-particular, pluralism about its definition collapses into error theory.

  **2. Eliminativist + Specific Criteria (e.g., Interbreeding)**
  *   **Diagnosis:** **Incoherent.** If the category "species" is dropped entirely (Eliminativism), providing criteria for defining it is contradictory. One might be an eliminativist about *species* but a realist about *populations*, but one cannot be an eliminativist about species while defending the Biological Species Concept.

  **3. Single Definition + Interbreeding + Asexuals**
  *   **Diagnosis:** **Unattractive/Biologically False.** No occupied position strictly enforces interbreeding as the universal criterion for bacteria or asexual rotifers without modification. Defenders of the Interbreeding-based concept typically concede asexuals are a limitation or exempt them, effectively moving them toward Pluralism or acknowledging the concept is not universal.

  ***

  ### CAVEATS AND LIMITATIONS

  **1. Indistinguishable Leaves: Evolutionary-Lineage vs. Unified Concept**
  This instrument flags these as separate leaves, but in practice, the **Evolutionary-Lineage Concept** (Simpson/Wiley) and the **Unified Concept** (de Queiroz's General Lineage Concept) are often conflated. The tree separates them based on whether lineage independence is the *constitutive definition* (Evolutionary-Lineage) or whether lineage is the *ontology* and all criteria are secondary *evidence* (Unified). However, many proponents slide between these positions, and the diagnostic question at Node 4 may not capture subtle verbal distinctions they make.

  **2. Indistinguishable Leaves: Monophyly-based vs. Evolutionary-Lineage**
  These positions overlap significantly when lineage separation implies monophyly. They only diverge in cases of **paraphyly** (e.g., an ancestral species persisting while budding off a daughter species). If a user has not considered paraphyletic species cases, their answers may lead to either leaf interchangeably.

  **3. The "Unified Concept" Contention**
  The tree treats the disagreement between the **Single-Concept** (Unified) and **Several-Concepts** (Pluralist) camps as a live decision node (Node 3). It does not presume consensus. However, some "Unified" theorists argue that Pluralists are merely describing operational difficulties rather than ontological plurality. Users who hold this meta-view may find Node 4 difficult to answer without further clarification on whether they view criteria as operational or ontological.

  **4. Concrete Case Limitations**
  The questions rely on standard thought experiments (ring species, asexuals, hybrids). Users whose commitments are derived from specific empirical systems (e.g., microbiology vs. ornithology) may find certain nodes biased toward their domain's typical problems. For instance, a microbiologist may find Node 1 (Ring Species) irrelevant, though the ontological commitment remains the same.

  **5. Stability of Commitments**
  This tree sorts users by their current stated commitments. It does not account for diachronic changes in position (e.g., a researcher starting as a Biological Species Concept defender and moving to Pluralism after encountering asexual taxa). The leaves represent stable theoretical endpoints, not necessarily transient methodological preferences.
