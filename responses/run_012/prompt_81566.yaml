answer: |-
  The dispute is best diagnosed as a **formal-representational** disagreement (Hypothesis 1), significantly fueled by an unacknowledged **two-questions-under-one-name** dynamic (Hypothesis 3). Hypothesis 2 is incorrect; both sides agree that pleasure and pain are *comparable* (one can be better than the other), but they disagree on whether they are *exchangeable* at a finite rate. The core stall arises because the Additive Side treats the Archimedean property of real numbers as a constitutive constraint on rationality, whereas the Threshold Side treats it as a contingent modeling choice that fails to capture phenomenological reality. This formal clash is intensified because the Threshold Side draws intuitions from intrapersonal prudence (where lexical thresholds feel plausible), while the Additive Side argues from interpersonal aggregation (where lexical thresholds lead to paralysis or absurdity), yet both present their claims as general truths about value.

  Progress is blocked because each side views the other's foundational constraint as a *reductio ad absurdum*: the Threshold Side sees the Additive requirement for continuity as a moral blindness to extreme suffering, while the Additive Side sees the Threshold requirement for lexicality as a mathematical incoherence that prevents decision-making. To move forward, the parties must recognize that they are debating the topology of value space (Formal) while implicitly toggling between the ethics of self-regard and the ethics of social choice (Two Questions).

