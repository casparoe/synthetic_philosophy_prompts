prompt: |-
  Im rereading Hofstadter and Sander's Surfaces and Essences -- the one where they argue analogy isn't just a handy reasoning trick but the actual core of all thinking, right down to recognizing a chair or parsing a mumbled word. I want to stress-test that against a real episode: the planetary model of the atom. Rutherford's nucleus with electrons orbiting it, Bohr's quantized orbits a couple years later, and then the whole picture getting quietly dumped once quantum mechanics showed up. I know the physics story; what I want is the analogy story.

  So map it onto their framework. Whats the source, whats the target, and who's doing the analogizing, to what end? But here's the thing I actually want you to chew on: their whole case rests on the mundane, half-second, unconscious analogy -- this thing is one of those. The atom-as-solar-system move is the opposite: rare, deliberate, conscious, and aimed at building a theory. So does this episode really support the idea that analogy is the core of cognition, or does it show that the big deliberate analogies are a separate, fancier skill sitting on top of the ordinary ones? Pick a side, dont hedge.

  Then run it the other way. Ive got a distinction I like and I dont think its in their book, so just go with it. Call an analogy load-bearing if you literally cannot state the explanation without it -- pull it out and the whole thing collapses -- and ornamental if its just a picture you could swap for a plain literal paraphrase at no cost. Which one is the solar-system analogy for Rutherford and Bohr? And dont skip the bit everyone waves away: planets dont radiate their orbits away, electrons supposedly do. What does their framework do with an analogy that's load-bearing exactly where it turns out to be false?

  Last, tell me what the episode does to the theory. If arguably the most famous analogy in physics is also one that had to be thrown out, is that a strike against analogy-as-the-core, or is it just what the theory predicts? And say honestly where their account goes quiet -- where this episode is really about math and experiment, and analogy-talk adds nothing.
