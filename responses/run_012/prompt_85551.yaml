answer: |-
  Here is the stress-test of *Surfaces and Essences* against the Bohr-Rutherford atom, mapped and dissected according to your constraints.

  ### 1. The Map
  *   **Source:** The Solar System (Newtonian gravity, central massive body, lighter bodies in elliptical/circular orbits, conservation of angular momentum).
  *   **Target:** The Atom (Positive nucleus, negative electrons, spatial structure, energy levels).
  *   **Who:** Ernest Rutherford (structural mapping, 1911) and Niels Bohr (dynamic/quantized mapping, 1913).
  *   **To What End:** To render scattering data intelligible (Rutherford) and to derive spectral lines/stability from first principles (Bohr). The goal was not just visualization, but calculation.

  ### 2. Mundane vs. Deliberate: Pick a Side
  You asked if this episode supports the idea that analogy is the core of *all* cognition (the mundane, unconscious kind) or if it reveals a separate, high-level skill.

  **I pick the latter.** This episode demonstrates that scientific modeling is a distinct cognitive mode, not merely the mundane recognition mechanism scaled up.

  Hofstadter and Sander argue that recognizing a chair and formulating a theory are the same process: fluid, unconscious slippage of categories. The Bohr model contradicts this. Recognizing a chair is immediate and resistant to contradiction (you don't argue with your visual cortex). The planetary model was **agonizingly deliberate**. Rutherford and Bohr had to actively *suppress* known disanalogies to make it work.

  When you see a chair, you don't have to ignore the fact that it doesn't have a backrest to categorize it as a chair. But Bohr *had* to ignore Maxwell's equations (which demanded the electron radiate energy and crash) to maintain the "orbit" analogy. He patched it with an ad hoc quantum rule. This isn't the fluid, automatic categorization H&S describe; it is a constructed, meta-cognitive scaffolding. It shows that while analogy is a *tool* of high-level thought, high-level thought involves mechanisms (logic, mathematical constraint, deliberate suppression of counter-evidence) that the mundane "chair-recognition" system does not possess. The planetary model wasn't a "thought popping into a head"; it was a engineered bridge. That distinction matters.

  ### 3. Load-bearing vs. Ornamental
  Using your distinction: **The solar-system analogy was Load-bearing.**

  It was not a pedagogical afterthought. Bohr's derivation of the Rydberg formula (which predicted spectral lines) relied entirely on the mechanics of the orbit. He took the classical equations for centripetal force and angular momentum derived from the solar system model and grafted the quantum condition ($L = n\hbar$) onto them. If you pull out the "orbit" concept, the math has no variables to quantize. The explanation collapses without the orbital geometry.

  **The Radiation Problem & H&S's Framework**
  Here is where the framework strains. Classical electromagnetism dictates that an accelerating charge radiates energy. An orbiting electron accelerates. Therefore, it should spiral into the nucleus in a fraction of a second. Planets do not do this because gravity is not electromagnetism.

  Hofstadter and Sander's theory rests on the idea that we analogize based on **essences**. We map "orbit" to "orbit" because we perceive a shared deep essence (stable, repeating path around a center). But in the atom, that essence was **false**. The electron orbit did not share the essence of stability with the planetary orbit.

  So, what does their framework do with a load-bearing analogy that is ontologically false?
  *   **Their likely defense:** They would argue that the "essence" was refined. We thought the essence was "stable path," but we learned the essence was "quantized probability cloud." They view cognition as a gradual refinement of categories.
  *   **The problem:** This wasn't a refinement; it was a demolition. The transition to Quantum Mechanics didn't tweak the analogy; it abolished the concept of a trajectory entirely. H&S's model implies analogies are paths toward truth via better categorization. The Bohr model shows an analogy can be **structurally necessary for discovery** while being **physically untrue**.

  Their framework cannot easily account for a "useful lie." In *Surfaces and Essences*, an analogy works because it captures a truth about the situation. In the Bohr atom, the analogy worked *despite* falsifying the physics of the situation. It was a heuristic scaffold, not a cognitive categorization of reality. H&S treat analogy as the engine of truth-tracking; this episode shows it can be the engine of productive error.

  ### 4. The Verdict on the Theory
  Does the failure of the most famous analogy in physics strike against "analogy-as-core"?

  **Yes, but specifically against the universality claim.**
  If analogy were the *sole* core of thinking, the death of the planetary model should have resulted in a *better analogy*. Instead, it resulted in **formalism**.

  When Schrödinger and Heisenberg replaced the Bohr model, they didn't say, "Ah, the atom is actually like a fluid," or "It's like a vibrating string" (though strings were used mathematically). They said, "The state is a vector in a Hilbert space." You cannot analogize a Hilbert space to everyday experience. It is pure syntax.

  **Where Hofstadter and Sander go quiet:**
  Their account goes quiet at the point where **mathematical syntax overrides semantic mapping.**
  H&S try to swallow mathematics by claiming math is just a web of analogies. But the transition from Bohr to QM shows the opposite: the point where scientists had to stop thinking in pictures (analogies) and start thinking in operators and eigenvalues (formalism).

  In the Bohr episode, analogy was the spark, but math was the filter. The analogy suggested the orbit; the math (eventually) killed it. H&S focus almost exclusively on the generative power of analogy (the spark). They underplay the **adjudicative power of formalism** (the filter). In this episode, the "core of thinking" wasn't the analogy that built the model; it was the mathematical consistency that destroyed it.

  **Conclusion:**
  The planetary atom supports the idea that analogy is a powerful *heuristic* for theory generation. It refutes the idea that analogy is the *constitutive substrate* of all thought. The episode proves that we can think *through* an analogy, but we can also think *past* it using tools (math, logic) that are not analogical. H&S's theory explains how Bohr got the idea; it fails to explain why the idea had to die, and what replaced it.
