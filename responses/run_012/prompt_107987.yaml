      *   This fits perfectly.

  7.  **Addressing the "Jointly Answerable" constraint:**
      *   They must agree on *what* to dictate. If they disagree, nothing gets passed. But the rule is something *must* be passed (or the town gets no history). Let's say the rule is: You must produce one narrative. If you fail, the archive is sealed forever (total forgetting). If you succeed, the archive is destroyed, only the narrative survives (selective memory).
