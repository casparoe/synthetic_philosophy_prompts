      *   *Better idea:* The "Archive of the Burnt Village." A community survived a fire. They have fragments. They need to decide what the "Official Story" is for the outsiders (who weren't there). To make the Official Story coherent, they must discard contradictions. The discarded contradictions are burned/shredded. The Official Story is handed to the outsider. But the Official Story is a simplification (loss of truth). The Raw Fragments are destroyed (loss of memory). Either way, something is lost.
      *   *Wait, the prompt says:* "keeping a thing alive and losing it turn out to be the same gesture." This suggests that *transmission* itself is the loss. When you give it to someone who wasn't there, it becomes *their* memory, not yours. It changes.
      *   *Revised Mechanism:* The group holds a set of detailed testimony cards about a specific event (e.g., a strike, a massacre, a founding). They must produce a single paragraph summary to be read by a "future historian" (someone not in the room, represented by a sealed envelope or a designated reader who leaves). To produce this summary, they must agree on what matters. The *rest* of the cards must be destroyed. But here's the kicker: The summary they write is the only thing that survives. The nuance is lost. But if they keep all the cards, no story gets told to the future (forgetting). If they send the story, they lose the truth (betrayal).
