      *   *The Act:* 10 mins.
      *   *Debrief:* 20 mins.

  4.  **Addressing the Constraints & Risks:**
      *   *Tilt:* There is a risk they feel destroying the cards is "wrong" (Margalit win) or that keeping them all is "impossible" (Rieff win). I need to ensure the pressure comes from *outside* the room (a deadline, a requirement from the fictional town council).
      *   *The "Someone who wasn't there":* I will act as the Stranger. They hand the memory to me. I will read it back in a flattened voice, showing how it lost its heat.
      *   *What the activity can't do:* It can't make them feel the *long-term* burden of memory. It's simulated. It can't replicate the actual pain of trauma. I must admit this.
      *   *British English:* Check spelling (colour, programme, realise), tone (collegial, modest but precise).
      *   *Format:* Continuous prose. No lists.

