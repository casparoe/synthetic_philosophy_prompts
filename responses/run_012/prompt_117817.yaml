prompt: |-
  Right — I'm a science and ideas journo and I've got a feature due on something I'm alot more confused about than I'd like to be, so I'm outsourcing the hard bit to you.

  Here's the setup. A gallery in Leipzig has been hanging its shows using a model trained on nothing but anonymised dwell time: the audio-guide app pings your phone as you walk around, thats the whole input. Nobody rated anything, nobody was ever asked what they liked. Just how long sixty thousand pairs of feet stopped in front of which canvas. The model picks which works go up and in what order. Attendance is up, print sales are up, and versions of it in three other cities keep producing pretty much the same picks, which the curator calls proof they've found something real.

  What I need: put yourself in Hume's shoes — the standard-of-taste Hume, not the genial essayist — and tell me what he'd make of this. Would he say the dwell-time machine has a standard of taste, or that it's a very good instrument for measuring something that isn't taste at all? Be concrete about which of his requirements it meets and which it fails, and skip the soft 'he'd have been fascinated by technology' answer.

  The bit I actually need for the piece: the model predicts individual visitors better than any living curator — it knows whether I'll stop at a Rothko before I do. Hume thought most people's taste is warped by prejudice and habit, and that only a rare, properly trained judge gets it right. If the machine out-predicts the good judge, whats left of the standard? Give me his answer, not yours.

  And flag the one place where you're extrapolating rather than reporting.
