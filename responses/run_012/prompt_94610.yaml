  **Ranked Agenda**

  1.  Relevance to live demarcation disputes (adaptationism, cultural evolution).
  2.  Relocation of testability (theory vs. adaptive hypotheses).
  3.  Propensity interpretation & statistical selection claims.
  4.  Metaphysical research programme as demotion vs. seed.
  5.  **[Dead End]** Evolutionary epistemology/emergence.

  **Justifications**

  **1. Live Demarcation Disputes**
  *   **Dependencies:** Depends on whether Popperian criteria currently distinguish science from pseudoscience in biology.
  *   **Downstream Impact:** Maximum. If Popper bites here, your dissertation intervenes in active debates (e.g., evolutionary psychology's testability). If not, the project becomes purely historical. This determines the philosophical versus historical weight of your thesis.
  *   **Evidence to Move:** Case studies where invoking falsifiability alters methodological consensus in cultural evolution or adaptationism. If biologists ignore Popperian constraints, this drops in priority.
  *   **Tractability:** High for a philosopher. Requires analyzing argumentative structures in contemporary literature, not archival digging or formal modeling.

  **2. Relocation of Testability**
  *   **Dependencies:** Depends on textual analysis of Popper's 1974–1978 revisions versus modern modeling.
  *   **Downstream Impact:** High. Determines whether Darwinism is a framework (untouchable) or a law-cluster (testable). Changes how we view null models and whether the "core" of evolutionary theory is immune to refutation.
  *   **Evidence to Move:** Comparison of Popper's later concessions against contemporary usage of "null hypotheses" in selection studies. If modern biologists treat the core as unfalsifiable, Popper was right initially.
  *   **Tractability:** High. Conceptual analysis of theory structure fits standard philosophical training.

  **3. Propensity & Statistics**
  *   **Dependencies:** Depends on resolving whether selection coefficients are causal propensities or statistical summaries.
  *   **Downstream Impact:** Moderate to High. Affects the causal status of fitness. If Popper's propensity view fails, statisticalism wins, altering metaphysical commitments of biology regarding causation.
  *   **Evidence to Move:** Formal coherence of propensities in stochastic population genetics models. If propensities cannot be defined without circularity, this line loses traction.
  *   **Tractability:** Moderate. Requires understanding statistical arguments but not generating new models.

  **4. Metaphysical Research Programme**
  *   **Dependencies:** Depends on Popper's general philosophy of metaphysics.
  *   **Downstream Impact:** Low. Primarily exegetical. Whether it's a "demotion" matters less than whether it aids science. Clarifies Popper's intent but changes little for biological practice.
  *   **Evidence to Move:** Popper's *Postscript* and lectures on the status of metaphysical ideas in scientific discovery.
  *   **Tractability:** High. Purely textual and conceptual.

  **5. Evolutionary Epistemology (Dead End)**
  *   **Flag:** Reject.
  *   **Why:** While interesting, it is speculative and disconnected from the core falsifiability debate. It requires engaging with cognitive science rather than biological practice. For a 2.5-year timeline focused on Darwinism's status, this dilutes focus without offering tractable conceptual resolution. It is upstream of nothing in the core demarcation debate. Pursuing this risks turning a philosophy of biology dissertation into a general epistemology project, jeopardizing your specialization.

  **Strategic Note**
  Prioritize Item 1 for your substantial chapter; it justifies the project's existence. Use Items 2 and 3 for papers. They are tractable for a philosopher (conceptual/textual) without requiring archival deep dives or formal biology modeling. Item 4 is background; Item 5 is distraction. This agenda maximizes philosophical impact while respecting your funding timeline.
