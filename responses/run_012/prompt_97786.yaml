prompt: |-
  My sisters wedding is in three weeks and I'm giving the toast, and I've got myself into a strange spot with it.

  Background, so you know where I'm coming from: I'm not academic at all, never went past first year of uni, but I've been chewing on this argument I read about by some philosopher (I want to say Williams? might be mixing him up with someone). The setup is a man whose wife is drowning, and he swims out and saves her. Fine, no controversy there. But the philosopher says — if, before he dives in, the man thinks about how she's his wife and this is what a husband does, or thinks about how saving her will do the most good, then he's had one thought too many. The point being that the love is supposed to be the whole reason, and the second you tack a justification onto it you've stepped outside it and turned into a little moral accountant instead of a husband. I think there's something really true in that and I want the toast to actually pull it off, not just name-drop it.

  Heres why thats hard: a wedding toast is basically a machine for giving reasons. Everyone in the room expects me to list why this marriage is a good idea — she's kind, they balance each other out, it makes sense, all of it. And I don't want to do any of that. My sister is a philosopher and about half the room is her department, so they'll clock it instantly if I either wuss out or turn it into a seminar, and the other half is our aunts and uncles who just want to cry into their wine and have no idea what I'm on about.

  The bit I can't solve, and I want the speech to solve it: her fiance actually asked her once, early on, 'why do you love me,' and she genuinely couldn't answer, and it almost sank them for a whole month. So the idea that you're not supposed to have reasons isn't a cute abstraction for them, it's the actual fault line in the relationship. I also half think the whole no-reasons thing is wrong — surely when things get hard you'd want a reason or two to hold onto — but I want the toast to play it straight anyway, no hedging, no winking at the audience about it.

  So: write the toast, about four minutes, warm, a little funny, and it has to land for both halves of the room without me standing there explaining the drowning story out loud like a textbook. And I mean it about the reasons — not one line in it should give a reason why she should marry him. If you can only get one thing right, get that one right.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Sister's wedding toast.
      *   **Time:** 3 weeks away (irrelevant for writing, but sets the stakes).
      *   **Speaker:** Non-academic (didn't finish uni), but intellectually engaged with a specific philosophical concept (Bernard Williams' "one thought too many").
      *   **Audience:** Split 50/50. Half are philosophers (sister's department), half are family (aunts/uncles, want emotion/tradition).
      *   **Core Constraint:** The toast *must not* give reasons why the couple is good together. No listing virtues, no "they balance each other," no "she's kind, he's funny."
      *   **The Hook:** The sister (a philosopher) once couldn't answer "Why do you love me?" and it almost ended the relationship. This makes the philosophical concept personal, not abstract.
      *   **Tone:** Warm, a little funny, no hedging, no winking. It needs to land emotionally for the family and intellectually for the philosophers without being a lecture.
      *   **Length:** About 4 minutes (roughly 500-600 words spoken at a moderate pace).
      *   **Philosophical Reference:** Bernard Williams (the drowning wife example). *Crucial:* Do not explain the example like a textbook. Weave the *spirit* of it in without necessarily citing "Bernard Williams said..." unless it flows naturally (better to avoid name-dropping to keep it accessible).

  2.  **Deconstruct the Philosophical Concept (Williams' "One Thought Too Many"):**
      *   *The Idea:* Immediate, partial love is better than mediated, universal moral duty. If I save my wife because "she is my wife and I ought to save her," I've alienated myself from the love that should drive the action.
      *   *The Application to Marriage:* Marriage isn't a contract of benefits exchanged. It's a state of being where the "why" is inherent.
      *   *The Risk:* As the user noted, hard times *do* require reasons to stay. But the prompt says: "play it straight anyway, no hedging." So, I must commit to the "no reasons" stance for the toast's sake, even if reality is nuanced.

  3.  **Address the Audience Split:**
      *   *Philosophers:* They need to recognize the argument without me lecturing. They will catch the reference to the "why" question and the rejection of justification.
      *   *Family:* They need to feel the love. They don't care about the philosophy, they care that I love my sister and approve of the groom. The emotion must carry the logic.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the role. Set the scene. Maybe acknowledge the "job" of a best man/sister (to list virtues).
      *   **The Pivot:** Introduce the problem with listing virtues. Connect it to the specific story about the "Why do you love me?" question. This bridges the family drama with the philosophical theme.
      *   **The Core Argument (The "Williams" bit without the name):** Describe the feeling of acting out of love vs. acting out of duty/reason. Use the drowning metaphor implicitly or explicitly but keep it narrative, not academic. *Decision:* Let's keep it implicit. Talk about the instinct to save vs. the calculation.
      *   **The Resolution:** How they moved past the "why" crisis. Not by finding an answer, but by realizing the question was the mistake.
      *   **The Toast:** Raise a glass to the future, defined by the absence of needing to justify it.

      *   *Constraint Check:* NO REASONS. I cannot say "He makes her laugh" or "She grounds him." I have to talk about the *nature* of their bond, not the *content*.

  5.  **Drafting - Attempt 1 (Mental Outline):**
      Hi everyone. I'm the brother. Usually, I tell you why they are great. She's smart, he's nice. But I won't do that. There's a story where she asked him why he loved her. He couldn't say. Almost broke up. But then they realized love isn't a list. It's like saving someone drowning. You don't think, you jump. So here's to not thinking. Cheers.
      *Critique 1:* Too blunt. Too dry. Needs warmth. Needs to handle the "family" side better.

  6.  **Drafting - Attempt 2 (Adding Warmth and Nuance):**
      Start with the pressure of the speech. "I know what I'm supposed to do." Tell the story of the breakup scare. Explain that looking for reasons is like checking a receipt. For the philosophers, they'll get it. For the family, talk about instinct. "When things are hard, you don't want a list, you want a person."
      *Critique 2:* Getting closer. Need to ensure I don't accidentally slip in a reason like "they are strong." Focus on the *act* of loving, not the *qualities* loved.

  7.  **Refining the Philosophy (The "One Thought Too Many"):**
      I need to make sure the philosophers nod without the aunts glazing over. The key is the "Why?" question.
      *Idea:* Frame the "Why" as a threat to the thing itself.
      *Metaphor:* The drowning story is perfect, but maybe too dark for a wedding? No, the prompt says "chewing on this argument." I can use the *logic* of it without the death stakes. Or I can use the drowning story but soften it. Actually, the prompt says "without me standing there explaining the drowning story out loud like a textbook." So I should allude to the *structure* of the thought, not necessarily narrate the drowning man unless it fits naturally. Let's try to weave the *instinct* vs. *justification* dynamic into their specific story.

  8.  **Finalizing the Tone:**
      *   Warmth: Speak from the brother's perspective.
      *   Humor: Acknowledge the awkwardness of the "breakup month."
      *   Strict Adherence: Scan every sentence for "because," "since," "due to," or adjectives that imply merit.

  9.  **Writing the Speech (Iterative Process):**
      *   *Opening:* Standard greeting. Acknowledge the split room (subtly).
      *   *The Hook:* The assignment of the toast. "Tell you why they match."
      *   *The Turn:* The story about the question "Why do you love me?"
      *   *The Philosophical Meat:* The silence wasn't emptiness; it was fullness. Justification kills the thing.
      *   *The Family Angle:* For the aunts/uncles, this is about "unconditional." For the philosophers, it's about "non-instrumental."
      *   *The Closing:* To the silence. To the lack of reasons.

      *(Self-Correction during drafting)*: I need to be careful not to sound like I'm saying "love is blind." It's that love is *self-evident*.
      *(Check constraint)*: "Not one line in it should give a reason why she should marry him."
      *Bad:* "He is there for her." (Reason)
