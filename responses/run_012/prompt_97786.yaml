answer: |-
  Good evening, everyone. For those who don't know me, I'm the brother. Which, traditionally, means I have a specific job to do right now. I'm supposed to stand up here and act like a broker. I'm supposed to list [Sister's Name]'s virtues, and then list [Groom's Name]'s virtues, and explain to you all how the exchange rate between them is favorable. I'm supposed to tell you that she is kind, and he is patient, and that together they form a balanced portfolio of human traits.

  I'm not going to do that.

  Partly because I'm not very good at portfolios. But mostly because, a few years ago, [Groom's Name] made the mistake of asking [Sister's Name] a question that almost ended this whole thing before it started. He asked her, "Why do you love me?"

  Now, for half the people in this room, that is a very reasonable question. It asks for data. It asks for evidence. And for a month, [Sister's Name] tried to provide it. She went away, she thought, she looked for the ledger. And she couldn't find one. She couldn't find the *because*. And the silence between them grew so loud it nearly broke them apart.

  I watched that happen. I saw my sister trying to turn a feeling into a sentence, and failing. And I saw [Groom's Name] waiting for a justification that, if it had ever arrived, would have meant the love wasn't real to begin with.

  Because here is the thing I've learned, standing on the outside of this: Love isn't a conclusion you reach after reviewing the evidence. It's the ground you stand on before you look.

  If you are standing on the shore and you see someone drowning, and you know that person is your wife, you do not pause to calculate the utility of the rescue. You do not think, "Saving her is my moral duty," or "This will maximize the good in the world." If you have time for those thoughts, you have already waited too long. You jump. You jump because she is *yours*, and you are *hers*, and the water doesn't care about your reasons.

  For a month, they tried to write a manual for a reflex. They tried to find a map for a place they were already living in.

  But they found their way back. Not because [Sister's Name] finally found an answer. She didn't. She came back to him empty-handed. And that was the only answer that mattered. She realized that the moment you start tallying up why you are committed to someone, you have already stepped outside the commitment. You have become an accountant in your own marriage.

  The philosophers in the room know that there is a name for that error. But you don't need a degree to feel it. We all know the difference between being loved for what you provide, and being loved for who you are. One of those things can be taken away. The other is just… there. Like gravity. You don't ask gravity why it's holding you to the earth. You just walk.

  So, I am not going to tell you why they are good for each other. I am not going to tell you what they gain from this union. I am not going to give you a single reason why this marriage makes sense.

  Because reasons are for contracts. And this isn't a contract.

  This is the end of the question. This is the silence after the "why."

  So, if everyone could please stand.

  To [Sister's Name] and [Groom's Name]. May you never have to justify this again.
