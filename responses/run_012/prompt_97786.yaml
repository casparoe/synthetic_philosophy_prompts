      *Let's write.*

      *Word Count Check:* 4 minutes is roughly 500-600 words.
      *Tone Check:* Is it too cold? Need to add brotherly affection.
      *Philosophy Check:* Williams would recognize the "one thought too many" structure in the rejection of justification.

      *(Refining the "Drowning" reference)*: The prompt says "without me standing there explaining the drowning story out loud like a textbook." I can allude to it. "Like a man jumping into a river..." No, let's keep it to their relationship. The prompt says the *argument* is what I'm chewing on, but the *toast* has to solve the problem. The problem is the "Why" question. I will focus on that.

      *Wait, one more thing:* The prompt says "I want the toast to actually pull it off, not just name-drop it." and "without me standing there explaining the drowning story out loud like a textbook." This implies I can use the *imagery* if it serves the emotion, but I shouldn't lecture. Actually, better to leave the drowning story out entirely and focus on the *implication* of it: the immediacy of love. The "Why" crisis is the real anchor.

      *Let's draft.*

      (Drafting thought): Make sure I don't say "She is smart." That's a reason. Say "She is my sister." That's a relation.
      (Drafting thought): Make sure I don't say "He makes her happy." That's a benefit. Say "He is here."

      *Okay, ready to generate.*

  10. **Final Polish:** Check the rhythm. Ensure the ending lands. Ensure the "no reasons" constraint is strictly met. (I will review the final text specifically for this).

      *Reviewing against constraints:*
      - 4 mins? Yes, approx 600 words.
      - Warm/Funny? Yes, brotherly tone.
      - No reasons? I must be vigilant.
      - Philosophers happy? They'll see the Williamsian move.
