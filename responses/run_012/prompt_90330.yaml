answer: |-
  There is an established name for the exact shape you have described. In the fields of decision theory, existential risk studies, and modern philosophy, it is called **Pascal's Mugging**.

  You likely did not find it because it is a relatively recent term (coined in 2007 by the researcher Eliezer Yudkowsky) and it resides primarily in niche communities focused on artificial intelligence, rationality, and effective altruism, rather than in classical textbooks of logic or rhetoric. While "Pascal's Wager" is centuries old and widely known, "Pascal's Mugging" is its generalized, secular, and mathematical successor.

  Your friend's objection—that this reasoning allows anyone to demand your savings by threatening an unthinkably large harm—is not just a criticism; it is the defining thought experiment of the concept.

  Here is the detailed breakdown you requested regarding its status, its distinctions, its engine, and its boundaries.

  ### 1. Fallacy or Genuine Difficulty?
  It is treated as both, depending on the context.

  *   **As a Decision-Theoretic Paradox (Genuine Difficulty):** For mathematicians and philosophers, this is a bug in **Expected Utility Theory**. Standard rationality says you should multiply the probability of an outcome by its value (good or bad) to decide how to act. If the value is infinite (or sufficiently massive), even a microscopic probability yields a high expected value. This implies a rational agent *should* pay the mugger. This creates a "genuine difficulty" because it suggests our standard math for rationality breaks down when stakes become unbounded.
  *   **As a Rhetorical Device (Fallacy):** In public discourse, sales, and politics, it is treated as a fallacy (often a specialized form of **Appeal to Fear**). It is considered fallacious because it exploits the human inability to intuitively grasp very small probabilities and very large numbers. It bypasses the burden of proof: the arguer does not need to prove the threat is *likely*, only that it is *possible* and *bad enough*.

  ### 2. Distinctions from Related Concepts

  You correctly sensed that "Pascal's Wager" is too narrow. Here is how the Mugging differs from the Wager, the Precautionary Principle, and ordinary caution.

  | Concept | The Structure | Why It Is Different From Pascal's Mugging |
  | :--- | :--- | :--- |
  | **Pascal's Wager** | **Binary & Fixed.** Belief in God vs. Atheism. Infinite Reward (Heaven) vs. Finite Cost (Piety). | The Wager is a specific instance with fixed stakes (Salvation) and fixed options (Believe/Don't). The Mugging is **scalable**: the stakes can be raised indefinitely to overcome any skepticism about the odds. |
  | **Precautionary Principle** | **Ignorance-Based.** "If an action has a suspected risk of severe harm, lack of full scientific certainty shall not postpone measures." | The Precautionary Principle usually applies when probabilities are **unknown** or **unknowable**. Pascal's Mugging applies when probabilities are **known to be tiny** but are overridden by the stakes. The Precautionary Principle says "we don't know the odds"; the Mugging says "the odds are one in a billion, but the cost is infinity." |
  | **Ordinary Caution** | **Proportional.** "There is a 5% chance of rain, so I will carry an umbrella." | Ordinary caution respects **proportionality**. If the chance drops to 0.0001%, ordinary caution stops acting. Pascal's Mugging explicitly **decouples** action from proportionality by inflating the stakes to compensate for the dropping probability. |

  ### 3. Which Ingredient Is Doing the Work?
  The engine of this argument is the **unboundedness of the stakes**.

  *   **Impossibility of estimating odds:** This helps the arguer, but it is not the engine. If the odds were fixed at 50% but the stakes were finite, you could calculate a reasonable cost.
  *   **The demand for something:** This is the trigger, but not the engine. A demand without the leverage of infinite stakes is just a request or a threat.
  *   **Unbounded Stakes:** This is the critical component. As long as the harm (or benefit) can be described as "infinite," "existential," or "unimaginable," the probability becomes mathematically irrelevant. Any non-zero probability multiplied by infinity is infinity.

  The argument works because human intuition treats "very unlikely" as "ignore," but the math treats "non-zero" as "real." The arguer bridges this gap by making the stakes so large that even your intuition cannot ignore them.

  ### 4. Sharp Definition and Boundary Cases
  Since you asked for a definition sharp enough to distinguish what falls inside and outside the shape, here is a formalized definition based on your description and the decision-theoretic literature.

  **Definition: The Pascal's Mugging Structure**
  An argument is an instance of Pascal's Mugging if and only if it meets all three criteria:
  1.  **Non-Zero Unfalsifiability:** The probability of the outcome is claimed to be non-zero, but sufficiently low or vague that it cannot be empirically falsified in the short term.
  2.  **Unbounded Utility:** The value of the outcome (harm or benefit) is claimed to be so large (catastrophic or utopian) that it dwarfs the cost of the requested action, regardless of the low probability.
  3.  **Inverse Scaling:** When challenged on the probability, the arguer inflates the magnitude of the outcome rather than providing evidence for the probability.

  **Case Inside the Boundary (The Mugging):**
  > *A charity asks for a donation to fund a project that will prevent a hypothetical future AI from wiping out all potential future human generations (trillions of lives). They admit the chance of this specific AI arising is less than 0.00001%, but argue that because the stakes involve trillions of lives, the "expected value" of the donation is higher than saving a known, dying child today.*
  > *   **Why:** The probability is tiny (unfalsifiable), the stakes are unbounded (trillions of lives), and the argument relies on the math of expected value to override intuitive proportionality.

  **Case Outside the Boundary (Legitimate Risk Management):**
  > *A government mandates that nuclear power plants build containment domes capable of withstanding a once-in-10,000-year earthquake. The probability is tiny, but the cost is finite, the probability is based on geological data (falsifiable), and the stakes (regional contamination) are severe but bounded.*
  > *   **Why:** The probability is estimable (not unfalsifiable), the stakes are finite (not infinite/unbounded), and the cost is proportional to the risk. If the probability dropped to one-in-a-billion, the mandate would be dropped; it does not scale inversely.

  ### Summary
  You have independently rediscovered a significant problem in modern decision theory. The name is **Pascal's Mugging**. It is distinct from the Wager because it is scalable; distinct from the Precautionary Principle because it relies on low probabilities rather than ignorance; and distinct from caution because it rejects proportionality. It is considered a fallacy in rhetoric because it allows bad actors to leverage infinite claims to extract finite costs, but it remains a genuine open problem in mathematics regarding how to bound utility functions.
