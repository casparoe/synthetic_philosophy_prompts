answer: |-
  Here is a principle that aligns with most of your intuitions, followed by the verdict on the neuron case and the one intuition you may need to reconsider.

  ### The Principle: Structural Specification vs. Functional Triggering

  **Code** is a pattern that specifies the **structural configuration** or **assembly sequence** of a **distinct** system.
  **Signal** is a pattern that triggers a **functional state change** or **activity** within a system.

  *   **Code (Blueprint/Recipe):** The message tells the receiver *how to be built* or *how to arrange itself*. The message is read, and a new structure or sequence is instantiated based on that reading.
  *   **Signal (Key/Switch):** The message interacts with the receiver to turn something *on* or *off*. The message causes an event, but does not dictate a new structural arrangement.

  ### Application to Your Cases

  *   **Genetic Code:** **Code.** The mRNA pattern specifies the amino acid *sequence* (structure) of a distinct protein.
  *   **Computer Program:** **Code.** The bit pattern specifies the *state configuration* and operations of the CPU/Memory (a distinct system).
  *   **Prion:** **Code (by this principle).** The prion shape specifies the *folded shape* (structure) of a distinct protein molecule. It acts as a template for construction.
  *   **RNA Editing:** **Code.** It modifies the structural specification before it is executed.
  *   **Hormone:** **Signal.** It binds to a receptor to trigger an *activity* (cascade), not to build a new structure.
  *   **Methylation:** **Signal.** It tags a gene to toggle its *activity* state (on/off), not to build a new structure.
  *   **Protein Folding:** **Not Code.** The sequence determines its *own* shape via physics. There is no "distinct system" being instructed; it is intrinsic self-assembly.
  *   **Ribosome:** **Not Code.** It is the machine/decoder, not the pattern.
  *   **Book:** **Not Code.** While it contains symbols, it does not mechanically specify the structural configuration of the reader's brain in the direct, executable way a program specifies a machine's state. (It informs, but does not execute).

  ### The Neuron Case

  **Verdict: Signal.**

  When a neuron's firing pattern is copied by a downstream neuron, this is **Signal**.
  *   **Reasoning:** Firing is an **activity** (electrochemical event), not a structural configuration. Even if the pattern is replicated, it is a wave of activation passing through a medium, akin to a domino effect or a hormone cascade. It triggers the downstream neuron to *fire*, not to *rebuild its structure* based on a blueprint.
  *   **Exception:** If that firing pattern induces Long-Term Potentiation (LTP) that physically alters the synaptic *structure* to store the memory, the resulting *structural change* is Code/Data, but the firing itself remains Signal.

  ### The Verdict to Give Up

  To maintain a rigorous distinction between "Code" and "Physical Law," you would likely have to give up the **Prion** verdict.

  **Why:**
  Your principle for the Genetic Code relies on an **arbitrary mapping** (codons don't chemically match amino acids; a decoder decides). The Prion case relies on **physical templating** (the shape physically forces the new protein into place, like a mold making a cast).

  If you classify Prions as **Code**, you must accept that **any physical mold is a code**. A crystal seeding another crystal, or a cookie cutter shaping dough, becomes "coding." This dilutes the definition of Code until it is indistinguishable from simple cause-and-effect physics.

  To keep "Code" meaningful (implying a decoder and contingent rules rather than physical necessity), Prions are better classified as **Structural Signals** or **Templates**. They carry information, but they transmit it through direct physical coercion, not through a decoded convention.
