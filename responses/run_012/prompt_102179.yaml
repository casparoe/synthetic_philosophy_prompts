answer: |-
  Here is a worked case that fits your spec exactly, followed by the philosophical analysis you asked for.

  ### The Case: The $t$-haplotype in House Mice (*Mus musculus*)

  **The Organism:** The common house mouse.
  **The Trait/Allele:** The **$t$-haplotype**, a variant "supergene" complex on chromosome 17.

  **The Biological Mechanics:**
  1.  **Meiotic Drive (The Engine):** In male mice heterozygous for the allele ($+/t$), the $t$-haplotype produces a toxin that disables sperm carrying the wild-type allele ($+$). Consequently, $+/t$ males transmit the $t$-allele to roughly **90–95%** of their offspring, violating Mendel's law of equal segregation.
  2.  **Individual Cost:** The $t$-haplotype has pleiotropic effects. While $t/t$ homozygotes are sterile (males) or lethal (embryos), even heterozygous carriers ($+/t$) often suffer a **viability cost** (e.g., reduced immune function or mobility) compared to wild-type ($+/+$) mice. Let's stipulate a realistic scenario where $+/t$ individuals survive to reproduce at a rate 10% lower than $+/+$ individuals.
  3.  **Group Cost:** In populations where the $t$-allele becomes common, the frequency of $t/t$ matings rises. Because $t/t$ offspring die or are sterile, the population suffers a high "genetic load." If the frequency gets too high, the birth rate drops below the death rate, and the local population (deme) goes extinct.

  ---

  ### The Analysis

  #### 1. Verdict at Each Level

  *   **Individual Level (Selection AGAINST):**
      *   **Verdict:** The trait is maladaptive for the individual.
      *   **Why:** A $+/t$ carrier has a 10% lower chance of surviving to reproduce than a $+/+$ non-carrier. Even if they survive, their physiological burden means their *total* number of offspring is lower than a healthy wild-type mouse. If natural selection acted only on individual fitness, the $t$-allele should be purged.
  *   **Group Level (Selection AGAINST):**
      *   **Verdict:** The trait is maladaptive for the group.
      *   **Why:** Groups (local demes) with high frequencies of $t$-carriers produce many non-viable $t/t$ offspring. These groups grow slower or crash entirely compared to groups composed of wild-type mice. If group selection were the dominant force, groups with $t$-alleles would be outcompeted or go extinct, removing the allele from the meta-population.
  *   **Gene Level (Selection FOR):**
      *   **Verdict:** The trait is "adaptive" for the allele.
      *   **Why:** Despite the individual and group costs, the $t$-allele climbs in frequency.
      *   **The Math:** Imagine a population of 100 mice.
          *   A $+/+$ mouse produces 10 offspring (all $+$). Total $+$ alleles passed: 10.
          *   A $+/t$ mouse (due to viability cost) produces only 9 offspring. However, due to drive, 90% inherit $t$. Total $t$ alleles passed: $9 \times 0.9 = 8.1$.
          *   *Wait, 8.1 is less than 10.* This looks like the gene loses. **But:** We must compare *per-allele* fitness, not per-individual.
          *   The $+/+$ parent has **two** $+$ alleles. Fitness per $+$ allele = $10 / 2 = 5$.
          *   The $+/t$ parent has **one** $t$ allele. Fitness per $t$ allele = $8.1 / 1 = 8.1$.
          *   **Result:** The $t$-allele (8.1) out-replicates the $+$-allele (5), even though the *carrier* (9 offspring) is less fit than the *non-carrier* (10 offspring).

  #### 2. Definition of "Unit of Selection"

  I am leaning on the **Replicator** definition (popularized by Dawkins and Hull).
  *   **Vehicle:** The individual mouse (the entity that interacts with the environment, survives, and reproduces).
  *   **Replicator:** The gene/allele (the entity that is copied into the next generation).
  *   **Why the Gene Wins:** Under this definition, a "unit of selection" is whatever entity exhibits a net increase in representation due to a specific causal property. The individual mouse fails to propagate itself effectively (lower offspring count). The group fails to propagate itself (extinction). Only the $t$-allele successfully maximizes its own copy number. Therefore, the gene is the only level where "success" is observed.

  #### 3. The Crucial Feature

  **Feature:** **Transmission Bias (Meiotic Drive).**
  This is the decoupling of *individual reproductive success* from *allelic transmission success*.
  *   **If you remove it:** If meiosis were fair (50/50 segregation), the $t$-allele's fitness per copy would drop to $9 / 2 = 4.5$. The wild-type $+$ allele fitness is 5. The $t$-allele would immediately be purged from the population by individual selection.
  *   **What it does:** It allows the gene to "hijack" the reproductive machinery, prioritizing its own transmission over the vehicle's total output.

  #### 4. The Group Selectionist Pushback

  **The Objection:**
  A sophisticated group selectionist (or a critic of the "Selfish Gene" like Elliott Sober or Peter Godfrey-Smith) would argue:
  > "You haven't shown that the gene is a unit of *selection*. You've shown it is a unit of *transmission bias*. Natural selection requires differential **fitness** (survival and reproduction of the whole organism). Meiotic drive is a violation of the rules of inheritance, not an instance of selection. By calling this 'gene-level selection,' you are stretching the definition of selection so thin it becomes meaningless. The individual is still the only true unit of selection; the gene is just a cheater breaking the system."

  **Does the case survive?**
  **Yes, but with a philosophical concession.**

  1.  **The Concession:** They are technically right about terminology. In strict philosophical taxonomy, **meiotic drive** is often classified as a distinct evolutionary force from **natural selection**. Selection acts on phenotypes interacting with the environment; drive acts on gametes interacting with each other.
  2.  **The Survival:** However, the case still destroys the *explanatory power* of the Individual and Group levels.
      *   If you look only at Individuals, you predict the $t$-allele should vanish. It doesn't.
      *   If you look only at Groups, you predict the $t$-allele should vanish. It doesn't.
      *   Only the **Gene's Eye View** predicts the increase.

  **The Verdict on the Pushback:**
  The Group Selectionist is right that this isn't "selection" in the Darwinian sense of organisms struggling for life. But they are wrong if they imply this saves the Individual/Group levels as explanatory tools. This case proves that **allele frequency change cannot always be predicted by tracking individual or group fitness.**

  If your goal in the "units of selection" debate is to find *which level predicts evolutionary outcomes*, the Gene wins. If your goal is to define *what "selection" means linguistically*, the Group Selectionist has a point. But for a biologist trying to understand why the population is crashing while the allele spreads, the Gene-level explanation is the only one that works. The "cheating" argument is a semantic shield; it doesn't change the math that makes the Individual/Group models fail.

  ### Summary for your Argument
  Use this to show that the "Units of Selection" debate isn't just relabeling math. It's about **predictive adequacy**.
  *   **Individual Model Prediction:** $t$-frequency decreases. (False)
  *   **Group Model Prediction:** $t$-frequency decreases. (False)
  *   **Gene Model Prediction:** $t$-frequency increases. (True)

  Even if you call it "drive" instead of "selection," the Gene is the only level that captures the causal reality of the system.
