answer: |-
  You are exhausted after a late shift. You walk into your kitchen and have a vivid visual experience of the kettle steaming on the stove. In the **Good Case**, the kettle is there, boiling, and you are seeing it. In the **Bad Case**, the kettle is cold and absent; due to fatigue, you are hallucinating a perfect match. From the inside, the two episodes are subjectively indistinguishable; you cannot tell them apart by reflection alone.

  **(a) The Common-Core View:** This position holds that because the two cases are indistinguishable, they must share a common mental kind—a single type of experience state. Since justification supervenes on this mental state, you have the exact same evidence and are equally justified in believing "the kettle is boiling" in both cases. The external world differs, but your rational standing does not.

  **(b) Metaphysical Disjunctivism / Internalist Justification:** This view accepts the disjunctivist metaphysics: seeing is a relation to the world, while hallucinating is a mere seeming; they are ontologically different kinds of event. However, it maintains that justification is determined by your rational perspective, not the metaphysics of the experience. Since your perspective is identical, you are equally reasonable in both cases. The experiences differ in kind, but your warrant remains the same because you aren't culpable for the hallucination.

  **(c) Epistemological Disjunctivism:** This view agrees with (b) that the experiences are metaphysically different but argues that justification tracks this difference. Only in the Good Case do you possess a factive reason ("I see that it is boiling"). In the Bad Case, you only have a fallible seeming. Therefore, your justification is fundamentally superior in the Good Case; the verdicts come apart.

  The feature doing the real work separating (b) from (c) is **Internal Supervenience of Justification**. Position (b) insists that warrant depends only on how things seem to the subject; position (c) denies this, tying warrant to the external fact. If you strip this feature out—meaning you demand justification track external truth-connections rather than internal perspective—position (b) collapses into (c). You can no longer claim the justification is identical when the metaphysical relation to the world differs.

  The Common-Core theorist's strongest move against this entire setup is the **Argument from Introspection**. They argue that if two states are truly indistinguishable from the inside, they *are* the same mental kind by definition. To claim otherwise, as disjunctivism does, is to make the nature of your own mind opaque to you. If you cannot know by reflection whether you are seeing or hallucinating, you do not know the nature of your own experience, which violates the fundamental transparency of the mental.

  \answer{Internal Supervenience of Justification}
