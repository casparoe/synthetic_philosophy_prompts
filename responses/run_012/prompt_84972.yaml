answer: |-
  The ink smelled of rust and old apples. Elias dipped the quill, wiped it on the rim of the pot, and hovered over the vellum. The page beside him was yellowed, brittle, written by a monk named Thomas three hundred years prior. The page beneath Elias's hand was blank, waiting to be the missing folio.

  His job was not to copy Thomas, but to *be* Thomas.

  He started with the lowercase *a*. In Thomas's hand, the *a* was a strange creature. It lacked the usual vertical spine. It was a closed loop, canted slightly to the right, with a tail that flicked up like a fishhook. It looked, objectively, almost exactly like Thomas's *o*.

  Elias wrote the *a*. He held his breath. It looked good. It had the weight, the slant, the nervous energy of the original.

  He wrote an *o* next to it.

  He frowned. The *o* was too round. It made the *a* look too sharp. In the original manuscript, the *o* was slightly flattened at the poles, squeezed by the pressure of the lines above and below. Elias scraped the fresh ink off the vellum with his thumbnail, leaving a shallow groove. He dipped again.

  He wrote the *o*, flattening it. Better. But now the *o* looked too much like the *c*.

  Elias leaned back, rubbing eyes that burned from the lamplight. This was the trap. He had thought the problem was geometry—that if he measured the angles of Thomas's downstrokes, he could replicate the hand. But geometry was a liar. There was no single feature that made an *a* an *a*. He had seen Thomas write an *a* that was nearly a circle, and another that was nearly a triangle, and both were unmistakably *a*s because of the company they kept.

  The identity lived in the gap between the letters.

  He tried again. He decided to commit to the style. Thomas's hand was tight, cramped, as if he were writing in the dark. Elias pushed the style further. He narrowed the counters—the empty spaces inside the letters. He made the *a* smaller, tighter, the loop closing almost completely.

  It was beautiful. It was perfectly Thomas.

  He wrote the word *sanctus*.

  He stared at the *a* in the middle of the word. It sat between the *n* and the *n*. In this specific context, with the counters so closed, the *a* had lost its hook. It was just a loop. It was now geometrically identical to the *o* in *Domine* on the line above.

  If a scholar looked at this page in isolation, they would read *sonctus*.

  Elias knew he could fix the *a*. He could open the loop, give it a spine. But if he did that, it would stop looking like Thomas's hand. It would look like a standard *a* wearing Thomas's clothes. The style would break. The illusion of the single scribe would shatter because this *a* would no longer be related to the *d* and the *q* in the way Thomas related them.

  So he couldn't change the *a*. He had to change the system.

  He moved to the *o*. He distorted it. He made the *o* slightly square, giving it corners that Thomas never quite used. He sacrificed the purity of the *o* to save the identity of the *a*.

  But now the *o* looked like a *u*.

  Elias dipped the pen. The ink was thickening, cooling. He wrote a *u*. To distinguish it from the new square *o*, he had to make the *u* wider. But making the *u* wider made it look like two *i*s written too close together.

  He was pushing on a web. Every time he pulled a thread to tighten the style, another knot loosened until a letter slipped free of its meaning.

  He looked at the page. It was a forest of black marks. He knew what they were supposed to say. He had written them. But looking at the *a* in *sanctus*, he felt a cold vertigo. It was an *a* because he said it was. It was an *a* because the *o* next to it was squarer. It was an *a* because the *d* later in the text leaned left.

  If he took this page away from the rest of the manuscript, if he isolated this folio, would the system hold? Or would the letters drift, like ice floes, until the *a* froze into an *o* and the meaning sank?

  He looked at the original page again. Thomas had made the same compromises. He could see it now, in the tremor of the ink. The monk hadn't been writing letters; he had been negotiating treaties between them.

  Elias dipped the quill. He had to finish the line. He had to write the *a* in *gratia*.

  He hovered the nib. He could feel the tension in his hand, the pull between making it look like Thomas and making it readable. He realized that if he pushed the style just five percent further, the *a* would vanish. Not because it changed shape, but because the contrast would fail. It would become a ghost.

  He lowered the pen. The nib touched the skin. He applied pressure. The ink flowed, black and absolute. He drew the loop. He flicked the tail. It was done.

  It looked like an *a*. It looked like an *o*. It looked like Thomas.

  Elias blew out the lamp. The room went dark, but the page remained on the desk, waiting for the morning light to decide what it said.
