  ### Standing Ratings by Mode (0–5 Scale)

  *Scale Key:* **0** (No standing/Silenced) to **5** (Full/Unimpeachable Standing).

  | Agent | Blaming (Judgment) | Resenting (Attitude) | Demanding (Claim) | Sanctioning (Consequence) |
  | :--- | :---: | :---: | :---: | :---: |
  | **(a) Competitive** (Clean act, bad motive) | 2 | 1 | 2 | 1 |
  | **(b) Unrepentant Reformer** (Reformed, no amends) | 3 | 3 | 2 | 1 |
  | **(c) Disposed Wrongdoer** (Hypocrite) | 1 | 1 | 1 | 0 |
  | **(d) Complicit Beneficiary** (Structural wrong) | 2 | 2 | 2 | 1 |
  | **(e) Coerced Protester** (Victim/Protest) | 5 | 4 | 5 | 3 |
  | **(f) Epistemically Careless** (No evidence) | 1 | 0 | 0 | 0 |

  ***

  ### Overall Ranking by Standing to Blame

  Ranked from highest standing to lowest standing specifically regarding the **Blaming** mode:

  1.  **(e) Coerced Protester** (5) – *Enhanced standing via shared burden and political function.*
  2.  **(b) Unrepentant Reformer** (3) – *Mitigated by sincere reform, though marred by lack of amends.*
  3.  **(a) Competitive Agent** (2) – *Factually clean of the wrong, but moral authority undermined by insincere motive.*
  4.  **(d) Complicit Beneficiary** (2) – *Structural complicity and benefit undermine authority similar to (a), often viewed as slightly more severe due to material benefit from injustice.*
  5.  **(f) Epistemically Careless** (1) – *Lacks the justificatory basis required for responsible judgment.*
  6.  **(c) Disposed Wrongdoer** (1) – *Paradigmatic hypocrisy; moral equivalence with the target nullifies authority.*

  *(Note: Agents (a) and (d) are rated equally on blaming, but (d) is ranked lower due to the weight of structural complicity versus mere motivational impurity. Agents (c) and (f) are both very low, but (c) represents a moral failure of standing while (f) represents an epistemic failure; moral hypocrisy is typically treated as the more fundamental loss of moral standing.)*

  ***

  ### Dissociation of Standing (Mode-Specificity)

  Several agents demonstrate standing in one mode while lacking it in another, indicating that standing is not a monolithic property:

  *   **Agent (f) (Epistemically Careless):** May retain a minimal capacity for private **Blaming** (1) (they can form a judgment that happens to be true), but have **0** standing for **Demanding** or **Sanctioning**. One cannot rightfully demand an account or impose penalties based on a guess, even if the guess is correct.
  *   **Agent (e) (Coerced Protester):** Has maximal standing for **Blaming** and **Demanding** (5), but potentially reduced standing for **Sanctioning** (3). As a subject of the coercive institution, they possess the moral authority to protest and judge, but may lack the institutional power or right to unilaterally impose consequences without perpetuating the coercion.
  *   **Agent (b) (Unrepentant Reformer):** Has moderate standing to **Blame** (3) based on their reformed understanding, but lower standing to **Demand** amends from others (2) or **Sanction** (1) while they themselves remain in moral debt (having made no amends).

  ***

  ### Verdict: The Nature of the Hypocrite's Loss of Standing

  The hypocrite's loss of standing is best modeled as a **mode-specific and degree-sensitive relation**, rather than a single threshold.

  A single-threshold model (where one either has standing or does not) fails to capture the nuances revealed in the ratings. For instance, Agent (b) is not fully silenced; their reform grants them partial moral authority to judge, even if their lack of amends restricts their authority to punish. Similarly, Agent (f) distinguishes epistemic standing from moral standing; they may be morally "clean" regarding the act but epistemically disqualified from the communicative acts of demanding or sanctioning.

  Furthermore, the "hypocrite" label applies differently across agents. Agent (c) suffers a near-total loss of standing due to active disposition (moral equivalence), whereas Agent (a) suffers a partial loss due to motivational impurity (instrumentalization). This gradient suggests that standing is a currency that can be debased by degrees of hypocrisy, complicity, or negligence, and that different modes of responsibility (judging vs. punishing) require different denominations of that currency. Therefore, standing is a multidimensional vector, not a binary switch.
