answer: |-
  You have put your finger on a very specific, very old, and very frustrating epistemological itch. You are describing a maneuver that sits at the intersection of rhetoric and the philosophy of science.

  There isn't one single word that captures the *entirety* of what you're describing (the scope-shifting, the factual evasion, the reclassification of claims from empirical to heuristic), but there is a precise vocabulary for the components.

  The rhetorical structure is the **Motte-and-Bailey Doctrine**.
  The epistemological mechanism is a **Conventionalist Stratagem** (or **Immunization Strategy**).
  The specific dynamic regarding scale is what I will coin for you: **Immunization by Abstraction**.

  Here is the carving you asked for: where this phenomenon starts, where it stops, and how it differs from legitimate synthesis.

  ### 1. The Anatomy of the Move

  **The Rhetorical Structure: Motte-and-Bailey**
  Coined by philosopher Nicholas Shackel, this describes a situation where a defender advances a controversial, high-risk claim (the Bailey: *"Agriculture was a catastrophic trap for humanity"*), but when attacked, retreats to a trivially defensible claim (the Motte: *"Agriculture changed social structures in complex ways"*).
  In your reading group, the Bailey is the sweeping historical thesis. The Motte is the "it's just a lens/heuristic" defense. The frustration comes because the defender wants the *prestige* of the Bailey (the bold insight) while retaining the *safety* of the Motte (immunity from error).

  **The Epistemological Mechanism: Lakatosian Protective Belts**
  Imre Lakatos, trying to fix Karl Popper's falsificationism, described scientific theories as having a **"Hard Core"** (unfalsifiable assumptions) surrounded by a **"Protective Belt"** of auxiliary hypotheses. When data contradicts the theory, you adjust the belt, not the core.
  *   **Legitimate Science:** The belt is adjusted to make *new predictions* that are then confirmed. (A "Progressing Research Programme".)
  *   **Your Reading Group:** The belt is adjusted *only* to absorb anomalies without generating new predictions. (A "Degenerating Research Programme".)
  When the defender says, "That counterexample doesn't break the model, it just shows the model is more nuanced," they are thickening the protective belt. If they do this without producing new explanatory power, they are engaging in a **Conventionalist Stratagem**—making the theory immune to refutation by definition.

  **The Specific Scaling Phenomenon: Immunization by Abstraction**
  This is the coinage for your specific observation: *the broader the thesis, the more protection it gets.*
  Normally, a universal claim ("All swans are white") is easier to falsify than a local one ("This swan is white"). But in "Big History," the opposite happens.
  *   **Low Abstraction:** "The Inca had no writing." (Falsifiable: Quipu existed.)
  *   **High Abstraction:** "States tend to reduce human cognitive autonomy to maximize surplus." (Unfalsifiable: What counts as autonomy? What counts as surplus? Any counterexample can be reinterpreted as a variation of the rule.)

  As the claim moves up the ladder of abstraction, it sheds empirical content and gains interpretive flexibility. **Immunization by Abstraction** occurs when a defender responds to empirical falsification not by fixing the data, but by moving the claim to a higher level of abstraction where "facts" become "perspectives."

  ### 2. The Carving: Synthesis vs. Cheating

  You asked where legitimate synthesis ends and this phenomenon begins. This is the critical distinction. Synthesis is necessary; we cannot history without it. So what makes *this* version toxic?

  **Legitimate Synthesis (The "Lumper" Done Right)**
  *   **Risk:** It puts skin in the game. It says, "If we find X, this theory is in trouble."
  *   **Anomalies:** It treats counterexamples as problems to be solved, not noise to be ignored.
  *   **Direction:** It moves from data → pattern → prediction.
  *   **Example:** Jared Diamond (at his best) suggests environmental determinism. If a society thrived in a poor environment *for reasons unrelated to trade*, that challenges the model.

  **Immunization by Abstraction (The "Lumper" Done Wrong)**
  *   **Risk:** It hedges. The claim is bold in the introduction but metaphorical in the conclusion.
  *   **Anomalies:** Counterexamples are dismissed as "exceptions that prove the rule" or "local variations."
  *   **Direction:** It moves from pattern → data selection → redefinition of terms to fit data.
  *   **Example:** "Agriculture was a trap." Critic: "But health data shows some farmers lived longer." Defender: "Yes, but *psychologically* it was a trap." (The claim has shifted from biological to psychological to avoid the falsification).

  **The Boundary Line:**
  The line is crossed when the "broad picture" ceases to constrain what evidence is acceptable. If *any* outcome can be interpreted as consistent with the theory, the theory is not organizing evidence; it is consuming it.
  *   **Synthesis:** "Here is the signal, here is the noise."
  *   **Immunization:** "Everything is signal; you just aren't seeing the pattern."

  ### 3. Where My Reasoning Might Be Weak (Self-Critique)

  You asked me to identify where I might be over-reading this pattern. Here are three scenarios where my diagnosis above would be wrong, and this would be a non-issue.

  **1. The "Necessary Smoothing" Defense**
  *   **The Argument:** Big History *requires* Immunization by Abstraction to function. You cannot tell a story about 10,000 years without smoothing over details. If we demand strict falsifiability for macro-historical narratives, we banish the genre entirely.
  *   **Why this changes things:** If the goal of these books is not *scientific prediction* but *myth-making* or *cultural orientation* (like religion or art), then falsifiability is the wrong metric. A poem isn't "false" because it gets a fact wrong; it's judged by its resonance. If Harari and Diamond are writing "secular myths" rather than "social science," the defenders are right: it is a "lens," and critiquing it for factual error is a category mistake.
  *   **My Weakness:** I am assuming the authors claim to be doing social science. If they claim to be doing philosophy or literature, my critique fails.

  **2. The "Kuhnian Paradigm" Defense**
  *   **The Argument:** Thomas Kuhn argued that science doesn't progress by falsification, but by paradigms that resist anomalies until they collapse. The "defenders" in your group are just practicing normal science. They are protecting the paradigm long enough for it to mature.
  *   **Why this changes things:** What looks like "cheating" might just be the necessary stubbornness required to let a new framework take root. Dismissing Diamond because of counterexamples in 14th-century Polynesia might be like dismissing Newton because of Mercury's orbit. You need the broad brushstrokes before you can fix the details.
  *   **My Weakness:** I am judging a "Research Programme" in its early stages by the standards of its mature stage. If these books generate *new* fruitful research lines (even if currently vague), the "immunization" is temporary and productive.

  **3. The "Pedantic Splitter" Defense**
  *   **The Argument:** The "critics" in your group are engaging in nitpicking (the "splitters"). History is messy. Pointing out one counterexample does not invalidate a probabilistic trend.
  *   **Why this changes things:** If the defender says, "This is a probabilistic trend, not a law," and the critic says, "Here is one exception," the critic is the one violating the logic of the argument. Big History deals in probabilities and tendencies.
  *   **My Weakness:** I am assuming the defenders are claiming deterministic laws. If they are explicitly claiming probabilistic heuristics, then the "facts" brought by the critics might be statistically irrelevant noise, and the "broad picture" defense is statistically valid.

  ### Summary
  The phenomenon is **Immunization by Abstraction**, executed via a **Motte-and-Bailey** shift, resulting in a **Degenerating Research Programme**.

  It differs from legitimate synthesis because legitimate synthesis uses the "broad picture" to *predict* where new evidence should be found, whereas this maneuver uses the "broad picture" to *explain away* evidence that has already been found.

  It stops being a problem if you reclassify the books not as science (which requires falsifiability) but as philosophy or myth (which requires coherence). But as long as they are sold as "Science of History," the frustration you feel is the sound of epistemological boundaries being violated.
