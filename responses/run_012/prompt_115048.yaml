  You must choose between two rival principles.

  The first is **Epistemic Consequentialism**: credibility discounts are just if they improve the accuracy of the belief formed. The second is **Testimonial Individualism**: credibility discounts are unjust if they rely on group-level statistics or proxies rather than evidence specific to the individual speaker's reliability. Your verdicts mostly follow Testimonial Individualism, but your acceptance of the search committee case (Case 3) and your hesitation on the algorithm (Case 10) reveal the pull of Epistemic Consequentialism.

  **Testimonial Individualism** predicts that a manager who discounts all employee expense reports because "employees generally cheat" commits an injustice, as the discount relies on a group statistic rather than individual audit findings. **Epistemic Consequentialism** predicts that the journalist in the company town case (Case 6) acts justly, because the discount tracks the truth and improves reporting accuracy.

  Honestly, neither principle keeps all your verdicts. **Epistemic Consequentialism** cannot keep your verdicts on the woman's pain (Case 1), the accent (Case 4), the racial bias (Case 7), the clinic's group correction (Case 8), or the company town (Case 6), as it validates any statistically sound discount. **Testimonial Individualism** cannot keep your verdict on the search committee (Case 3), because the committee discounts every candidate based on the statistical generalization that "candidates inflate," which violates the requirement for individualized evidence. You resolve this tension by allowing statistical profiling only when it is universal to a voluntary role (candidates) but not when it is differential across social or circumstantial groups (residents, dialects, races), a distinction that requires blending both principles rather than adhering to one.
