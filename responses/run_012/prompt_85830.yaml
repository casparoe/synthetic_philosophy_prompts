answer: |-
  **Essay Question**

  **Time Allowed:** 90 Minutes
  **Word Limit:** None (Standard exam script)

  **Question:**
  Consider the following case: A military commander orders a night raid on a rail junction. This junction is also the only road out of a nearby town. The raid will certainly kill the town's civilians. The military value of destroying the junction does *not* depend on the civilians dying; however, the commander deliberately cancels a leaflet warning he had planned, because dropping it would tip off the enemy and jeopardize the mission. The civilians' deaths are foreseen and certain, but they are not a means to the destruction of the rail.

  Anscombe argues that Truman's authorization of Hiroshima was murder. Is she committed to classifying the commander's action in this case as murder? Explain your answer by analyzing whether her objection relies on the intention/foresight distinction or collapses into a prohibition on certainly foreseen killing. Finally, specify what would have to change about the commander's intention or the causal structure of the case for the verdict to reverse.

  ***

  **Model Answer**

  Anscombe is committed to classifying the commander's action as murder, but not because she collapses the intention/foresight distinction into a simple prohibition on foreseen killing. Rather, her classification depends on how the action is described under the will. For Anscombe, an effect is intended if it is part of the plan the agent chooses to enact, even if it is not the ultimate goal. In this case, the cancellation of the leaflet is the crucial pivot.

  The commander does not merely foresee the deaths; he chooses a plan that necessitates them. By canceling the warning to preserve secrecy, he makes the civilians' presence—and subsequent death—a condition of the mission's security. While their death is not a *means* to destroying the rail, it is a necessary condition of the *manner* in which the rail is destroyed (i.e., secretly). Anscombe argues in *Mr. Truman's Degree* that one cannot separate the certain effects of a chosen action from the intention if those effects are accepted as part of the operational plan. The commander wills the action under the description "raid without warning." Since "without warning" entails "certain civilian death," the death is intended.

  This demonstrates that Anscombe's objection to Truman does not collapse into a consequentialist-style constraint against foreseen harm. If it did, any collateral damage would be prohibited. Instead, she maintains the intention/foresight distinction but interprets 'intention' broadly to include chosen necessary conditions. She distinguishes between side effects that are truly incidental and those that are baked into the chosen strategy. In the Truman case, the terrorization (and death) was part of the strategy to force surrender. In the rail case, the silence (and death) is part of the strategy to ensure security. Thus, the verdict of murder rests on the premise that the commander *chose* the death as a price of the operation, rather than merely suffering it as an external consequence.

  To reverse the verdict—to make the action permissible under Anscombe's framework—the causal structure or the intention must change such that the death is no longer a chosen condition of success.

  First, regarding intention: The commander must intend the act solely under the description "destroy the rail," where the civilians' survival is genuinely hoped for, even if unlikely. However, given the certainty of death here, a change in psychological hope is insufficient. The description of the act must change.

  Second, regarding causal structure: The link between the omission and the death must be broken. If the commander drops the leaflet, but the enemy intercepts it and blocks the road anyway, the civilians die, but the commander did not *choose* their death as a condition of secrecy. Alternatively, if there were multiple roads out, and the raid blocked only one, the death would not be certain. The certainty is what binds the omission to the intention. If the warning were dropped and the raid proceeded *despite* the risk of compromise, the death would be merely foreseen. The commander would be accepting risk to the mission to save the civilians. In the original case, he accepts the civilians' lives to save the mission. For Anscombe, the latter is murder; the former may be tragic but permissible.

  Therefore, Anscombe's view is not that certain foresight equals intention simpliciter, but that certain foresight combined with a strategic omission renders the effect intended. The commander is guilty because he subordinated the civilians' right to life to the tactical requirement of secrecy, making their death a part of his will.

  ***

  **Marking Scheme**

  **Total Marks:** 25

  **Grade Boundaries:**
  *   **A (20–25):** Excellent. Precise application of Anscombe's theory to the specific mechanics of the case (omission/certainty). Clear distinction between means, conditions, and side effects.
  *   **B (15–19):** Good. Understands Anscombe's general position and applies it to the case, but may be vague on *why* the omission makes it intended, or slightly conflates DDE with Anscombe's specific view.
  *   **C (10–14):** Pass. Identifies the core issue (intention vs. foresight) but treats the case generically. May recite DDE without addressing the "omission" nuance.
  *   **D/F (0–9):** Fail. Fundamental misunderstanding of Anscombe or the case details.

  **Detailed Breakdown:**

  **1. Analysis of the Verdict (Murder or Not?) [8 Marks]**
  *   **A (7-8):** Argues Anscombe *would* call it murder. Explains that for Anscombe, 'intention' covers chosen necessary conditions, not just 'means'. Identifies that the *omission* of the warning makes the death part of the plan.
  *   **B (5-6):** Argues it is murder but relies on a simplistic "certainty = intention" equation without explaining the role of the *plan* or *description*. Or, argues it is not murder but acknowledges the tension.
  *   **C (3-4):** States a verdict but fails to justify it using Anscombe's specific criteria (e.g., just says "killing is wrong").
  *   **D (0-2):** No clear verdict or irrelevant to Anscombe.

  **2. The Intention/Foresight Crux [8 Marks]**
  *   **A (7-8):** Explicitly addresses the prompt's crux: Anscombe does *not* collapse into a flat prohibition on foreseen killing. Explains that she keeps the distinction but widens 'intention' to include strategic acceptances/omissions.
  *   **B (5-6):** Discusses intention vs. foresight but treats Anscombe's view as identical to standard DDE. Fails to note her stricter view on certainty/plan inclusion.
  *   **C (3-4):** Recites the definition of DDE without applying it to the "collapse" question.
  *   **D (0-2):** Confuses intention with motive or desire.

  **3. Reversing the Verdict (Changes Required) [6 Marks]**
  *   **A (5-6):** Proposes specific changes: either breaking the causal link (e.g., multiple roads) or changing the strategic priority (dropping leaflet despite risk). Shows understanding that the *trade-off* is the issue.
  *   **B (3-4):** Suggests vague changes (e.g., "he shouldn't want them to die") without addressing the causal certainty or the omission.
  *   **C (1-2):** Suggests irrelevant changes (e.g., "don't bomb the rail").
  *   **D (0):** No attempt.

  **4. Structure and Clarity [3 Marks]**
  *   **A (3):** Logical flow, clear paragraphs, precise terminology.
  *   **B (2):** Readable but some disorganization.
  *   **C (1):** Hard to follow.
  *   **D (0):** Incoherent.

  **Specific Penalties/Caps:**
  *   **Cap at B (19 marks):** If the student treats Anscombe's view as identical to standard Catholic DDE without referencing her specific arguments in *Mr. Truman's Degree* regarding the description of the act.
  *   **Cap at C (14 marks):** If the student ignores the "omission of the leaflet" detail and treats it as a standard bombing case.
  *   **Cap at C (14 marks):** If the student argues the verdict depends solely on the *number* of dead (consequentialism).
