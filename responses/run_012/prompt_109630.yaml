answer: |-
  Here is the specification for any theory attempting to distinguish guilt from shame and assign them moral value. This spec treats the emotions not as static biological facts, but as functional components within a psychological and social system.

  ### The Spec: Requirements for an Adequate Theory

  **1. Phenomenological Distinctness**
  The theory must describe a qualitative difference in how the emotions are experienced, not just their theoretical outcomes. It cannot define guilt and shame solely by their consequences (e.g., "guilt leads to repair, shame leads to hiding"). It must account for the internal "feel."
  *   **Case to satisfy:** The feeling of "I want to undo this" (guilt) vs. "I want to disappear" (shame). If a theory claims they are the same mechanism with different labels, it fails this requirement.

  **2. The Object of Evaluation (The Act/Self Boundary)**
  The theory must define what is being judged. The standard therapeutic model posits Guilt = Evaluation of Act, Shame = Evaluation of Self.
  *   **Case to satisfy:** **(3) Non-Action Shame.** The theory must account for shame triggers that involve no moral failure and no voluntary action (e.g., poverty, physical appearance, being seen naked, incompetence). If the theory insists shame is only about "who you are" in a moral sense, it cannot explain shame about things you *are* but did not *choose*. This requirement does the heavy lifting in knocking out the popular "Guilt=Act/Shame=Self" binary.

  **3. The Audience Condition**
  The theory must specify the role of the observer. It must explain whether the emotion requires an actual external witness or if an internalized witness suffices.
  *   **Case to satisfy:** **(1) Private Shame.** The theory must explain why a person feels shame in total solitude over a secret thought or memory. If shame is defined strictly as "fear of social exclusion," it cannot account for shame where no exclusion is possible. The theory must explain the mechanism of the "internalized other."

  **4. The Reparability Constraint**
  The theory must account for whether the emotion contains a path to resolution. It must distinguish between emotions that demand restitution and emotions that demand transformation or endurance.
  *   **Case to satisfy:** **(2) Victimless Guilt.** The theory must explain survivor guilt or "luck guilt." There is no victim to forgive, no act to undo, and no restitution possible. If the theory defines guilt strictly as "a signal to repair harm," it fails to categorize guilt that has no repair pathway.

  **5. The Normative Hierarchy**
  The theory must explicitly state the criteria by which one emotion is deemed "healthier" or "more moral" than the other. It cannot assume health is defined solely by individual psychological comfort.
  *   **Case to satisfy:** **(4) Meta-Shame.** The theory must account for cultures or families where feeling guilt is itself shameful (viewed as weakness or betrayal). If the theory assumes guilt is universally "healthy," it cannot explain environments where admitting guilt destroys your standing.

  **6. The Cultural Ecology Constraint**
  The theory must account for the social structure in which the emotion operates. It must distinguish between high-mobility/anonymous societies and low-mobility/high-cohesion societies.
  *   **Case to satisfy:** **(5) Culture-Level Choice.** The theory must address whether a culture can *choose* its emotional economy or if it is determined by material conditions (anonymity vs. interdependence). It must explain why the partner's family (shame-based/disappointed) functions with high honesty, while your family (guilt-based/quiet) functions with stagnation.

  ***

  ### Incompatible Requirements (The Trade-Off)

  You asked to flag two requirements on this list that likely cannot be satisfied simultaneously. Based on the tension between individual psychological safety and group cohesion, these are the conflicting items:

  **Conflict: Requirement 2 (The Object of Evaluation) vs. Requirement 6 (The Cultural Ecology Constraint)**

  *   **The Tension:** You cannot have a system where shame is strictly limited to controllable factors (Requirement 2, modified for safety) *and* a system where shame functions as a high-efficiency enforcement mechanism in tight-knit groups (Requirement 6).
  *   **Why:** For shame to work as a powerful social regulator in a low-mobility community (like your partner's family), it *must* threaten the whole self and attach to things you cannot easily change (status, reputation, inherent traits). That threat is what ensures compliance. If you limit shame only to "things you did and can fix" (making it more like guilt), it loses its teeth as a social glue in high-cohesion environments.
  *   **The Cost:** If you prioritize **Requirement 2** (protecting the self from judgments on unchangeable traits), you lose the social enforcement power that makes the partner's family function. If you prioritize **Requirement 6** (maintaining group cohesion in a tight network), you must accept that shame will attach to the whole self and unchangeable traits, which violates modern therapeutic safety standards.

  ***

  ### Non-Negotiables vs. Camp Commitments

  **Non-Negotiable:**
  *   **Requirement 1 (Phenomenological Distinctness).** If a theory cannot distinguish what the emotions feel like to the person having them, it is useless. It doesn't matter what the social function is; if the internal experience is identical, the distinction is semantic, not real.

  **Camp Commitments:**
  *   **Requirement 5 (The Normative Hierarchy).** The claim that one emotion is "better" is a commitment of Western, individualistic psychology. Collectivist or honor-based cultures commit to the opposite hierarchy. A theory can function without declaring a winner, but most popular theories smuggle this in as a fact.
  *   **Requirement 2 (The Act/Self Boundary).** As noted above, this is a commitment of the therapeutic camp. Anthropological data suggests shame often attaches to acts and guilt often attaches to states of being, depending on the culture. Insisting on this binary is a theoretical choice, not an empirical necessity.

  ***

  ### The "Knockout" Requirement

  If you are looking for the single requirement that does the most work in dismantling the standard therapeutic narrative ("Guilt is good, Shame is bad"), it is **Requirement 3 (The Audience Condition)** combined with **Requirement 6 (The Cultural Ecology Constraint).**

  **Why this knocks out the popular view:**
  The popular view assumes shame is toxic because it relies on external judgment and threatens belonging. However, **Requirement 6** forces the theory to admit that in low-mobility cultures (where you can't leave the group), the threat to belonging is the *only* thing that ensures cooperation.

  If you satisfy **Requirement 6**, you must admit that shame is not "toxic" in the partner's family context; it is the *operating system*. The "toxicity" only appears when you apply the rules of an anonymous, high-mobility society (where you can exit bad relationships) to a low-mobility society (where you cannot).

  Therefore, the claim that "shame is toxic" is not a universal truth about the emotion; it is a finding that only holds true in specific cultural ecologies. Any theory that claims shame is universally toxic fails **Requirement 6**.
