  2.  **Deconstruct the Reference Class Problem:**
      *   Core issue: $P(Event | Class A) \neq P(Event | Class B)$.
      *   Example: What is the probability *this* specific person will live to 90?
          *   Class A: All humans.
          *   Class B: All humans named "John".
          *   Class C: All humans named "John" who smoke.
          *   Class D: All humans named "John" who smoke but have a specific gene.
      *   The joke needs to show two characters legitimately arguing for different classes, both relevant, leading to different decisions, where the "truth" of the single case is inaccessible.

  3.  **Brainstorming Settings:**
