answer: |-
  # Activity: The Source Code Tournament

  **Objective:** Demonstrate that allowing agents to inspect each other's decision algorithms can sustain cooperation in a one-shot Prisoner's Dilemma (PD) without repetition or external enforcement.

  **Instructions to Class (Read Verbatim):**
  "You are submitting deterministic programs to a tournament. Each program must be written in plain pseudocode. Your program will receive one input: the full source code of your opponent's program. Your program must output exactly one character: 'C' (Cooperate) or 'D' (Defect). You cannot use randomization. You cannot access external variables. You will play every other submitted program once. Points are awarded based on the outcome of each matchup."

  **Payoff Scheme (Standard PD):**
  *   **Mutual Cooperation (C, C):** 3 points each.
  *   **Mutual Defection (D, D):** 1 point each.
  *   **Temptation (D, C):** Defector 5 points, Cooperator 0 points.
  *   **Sucker (C, D):** Cooperator 0 points, Defector 5 points.

  **Timeline (90 Minutes):**

  *   **0:00–0:10 (Setup):** Distribute rules. Emphasize that programs receive the *opponent's code* as input. Answer syntax questions only. Do not discuss strategy.
  *   **0:10–0:30 (Writing):** Students write pseudocode on paper. Encourage complexity if they wish, but clarity is required for you to adjudicate.
  *   **0:30–0:50 (Computation):** Collect papers. You act as the compiler. While you calculate the round-robin matrix (or a representative subset if time is tight), have students break into small groups to discuss: "Is there a strategy that cannot be exploited?"
  *   **0:50–1:00 (Results):** Announce the winner and the average score. Reveal the top 3 strategies anonymously on the board.
  *   **1:00–1:30 (Debrief):** Connect results to theory (see below).

  **Debrief Guide:**

  1.  **The Outcome:** Did anyone achieve mutual cooperation consistently? If a student submitted a "Mirror" strategy (*If opponent_code == my_code then C else D*), point out that when two Mirrors meet, they cooperate.
  2.  **The Mechanism:** In standard PD, actions are independent. Here, actions are *logically correlated*. By inspecting source code, Player A knows Player B's action *before* choosing.
  3.  **The Equilibrium:** Explain that "Mirror" is a Nash Equilibrium in program space. If everyone plays Mirror, you get 3 points. If you deviate to "Always Defect," the Mirror sees your code, defects against you, and you get 1 point. You cannot gain by deviating.
  4.  **Contrast:** Ordinary one-shot reasoning assumes your choice cannot influence the opponent's choice. Program equilibrium breaks this assumption because your choice of *algorithm* determines the opponent's response to you.

  **Predictable Failures & Fixes:**

  *   **Ambiguity:** Students write vague pseudocode (e.g., "Try to cooperate").
      *   *Fix:* Enforce strict IF/THEN logic during the writing phase. Tell them you will interpret ambiguity as Defect.
  *   **Infinite Loops:** A student writes "Simulate opponent running me." This creates infinite recursion.
      *   *Fix:* Declare any program that does not halt within "reasonable steps" as an automatic Defector.
  *   **Logistical Bottleneck:** Calculating 66 matchups (for 12 students) live is slow.
      *   *Fix:* Do not promise live resolution of every pair. Tell them you will compute the full tournament offline and email results, but you will resolve key matchups on the board during class to illustrate the logic.
  *   **Always Defect Wins:** If no one writes a conditional cooperator, Defect wins.
      *   *Fix:* In the debrief, explain that without "Mirror" types, the standard PD equilibrium holds. The lesson requires at least one conditional cooperator to shine.

  **Limitations (Must Supply in Debrief):**

  Be honest about what the activity simplifies. You must explicitly state:
  1.  **The Halting Problem:** In reality, no program can perfectly determine if another program will halt or what it will output (undecidability). This activity assumes you (the referee) can solve this. Real-world program equilibrium requires probabilistic checks or time limits.
  2.  **Obfuscation:** Students might try to hide logic. In theory, code is readable; in practice, code obfuscation makes inspection difficult.
  3.  **Common Knowledge:** The equilibrium relies on everyone knowing the rules of the tournament and that code is visible.

  **Instructor Note:** Do not mention "Program Equilibrium," "Tennenholtz," or "FairBot" until the debrief. Let them struggle with the intuition that cooperation is rational without communication. The shock of seeing Cooperate vs. Cooperate in a one-shot game is the learning moment.
