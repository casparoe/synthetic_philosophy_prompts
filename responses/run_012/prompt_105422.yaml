prompt: |-
  I'm a student in an upper-level seminar on game theory and computation, and I've volunteered to run one 90-minute session for about 12 classmates. Design an activity that makes them feel the force of program equilibrium: in a one-shot Prisoner's Dilemma, if each player submits a deterministic program that can read the other player's full source code before choosing, mutual cooperation can be a Nash equilibrium even though defection dominates in the ordinary one-shot game, with no repetition and no communication. Do not name the idea or explain it up front. Have them write short strategies in plain pseudocode (no actual coding required), submit them to a referee, and then play every pair for points rather than money. Give me the rules, the payoff scheme, a minute-by-minute timeline, and a debrief that maps what happened onto the formal point: why source-code inspection changes the strategic situation, why a program that cooperates exactly when its opponent's program is equivalent to itself can be stable, and why ordinary one-shot reasoning would deny that this is possible. Also tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about which feature of program equilibrium the activity cannot reproduce and that I will have to supply in the debrief. Keep the response under 1,000 words and write in American English.
