answer: |-
  Here are the desiderata for an adequate theory of self-deception. They are designed to trap the paradoxes you identified without dissolving the phenomenon into mere error or literal lying.

  ### 1. The Sincerity Condition (The Belief Requirement)
  *   **The Requirement:** At the time of the deception ($t$), the subject must sincerely hold the false belief ($p$). They cannot merely be asserting $p$ while knowing $\neg p$.
  *   **The Case:** The jealous husband who genuinely feels calm when his wife comes home late, because he believes she is working, not cheating. If he knows she is cheating but says otherwise, he is lying, not self-deceived.
  *   **The Distinction Protected:** **Self-Deception vs. Other-Deception/Lying.** This prevents the theory from collapsing the "deceived" into the "deceiver" in a way that preserves knowledge of the truth.
  *   **Fact About Belief:** Belief aims at truth. To believe $p$ is to take $p$ to be true. You cannot sincerely believe what you take to be false.

  ### 2. The Evidence Condition (The Knowledge Requirement)
  *   **The Requirement:** The subject must possess, or have ready access to, evidence sufficient to warrant belief in $\neg p$ (the truth).
  *   **The Case:** The smoker who sees the warning labels and coughs up blood but believes they won't get cancer. If the evidence weren't available, they would just be ignorant or mistaken.
  *   **The Distinction Protected:** **Self-Deception vs. Plain Error/Ignorance.** This ensures the belief is *motivated*, not just a cognitive slip-up. It requires the theory to explain why the evidence was mishandled.

  ### 3. The Non-Voluntarism Condition (The Agency Constraint)
  *   **The Requirement:** The theory cannot posit that the subject directly chooses or decides to adopt the belief $p$ at will.
  *   **The Case:** You cannot simply decide to believe the sky is green. Similarly, the self-deceiver cannot just "choose" to believe their spouse is faithful.
  *   **The Distinction Protected:** **Self-Deception vs. Imagining/Pretending.** This respects the involuntary nature of doxastic states. It blocks the "Intentionalist" model where the self-deceiver consciously plots to fool themselves (which violates Sincerity).
  *   **Fact About Belief:** Belief is not under direct voluntary control (Doxastic Involuntarism).

  ### 4. The Motivational Condition (The Bias Requirement)
  *   **The Requirement:** The formation of belief $p$ must be causally driven by a desire or anxiety regarding the truth value of $p$, rather than neutral cognitive processing.
  *   **The Case:** Two people see the same ambiguous medical data; the one who is terrified of illness believes they are sick, the one who needs to stay optimistic believes they are well.
  *   **The Distinction Protected:** **Self-Deception vs. Cognitive Bias.** A calculation error is a bias; a bias driven by *wanting* a specific outcome is self-deception. This captures the "doing it to yourself" aspect without requiring conscious intent.

  ### 5. The Mechanism Continuity Requirement (The Avoidance Test)
  *   **The Requirement:** The theory must explicitly account for the relationship between **Evidence Avoidance** (skipping the test) and **Interpretive Distortion** (insisting the test is wrong). It must state whether these are the same mechanism at different stages or distinct phenomena.
  *   **The Case:** The "Quiet Manager" who drops the friend and skips the test results vs. the "Loud Denier" who reads the results and claims a conspiracy.
  *   **The Distinction Protected:** **Strategic Ignorance vs. Doxastic Distortion.** Your list forces the theory to say: Does the Quiet Manager *believe* the flattering thing, or do they merely *suspend judgment*? If they believe it, how did belief form without evidence? If they don't believe it, are they self-deceived or just avoidant? A theory that only explains the Loud Denier fails this desideratum.

  ***

  ### The In-Principle Incompatibility (The Triad)
  You asked which of these you couldn't have all at once, even in principle. You cannot simultaneously satisfy the following three intuitive features of self-deception:

  1.  **Intentionality:** The subject intends to bring about the belief $p$.
  2.  **Sincerity:** The subject sincerely believes $p$ (and does not know $\neg p$).
  3.  **Psychological Unity:** The subject is a single, transparent agent (no partitioned minds).

  **Why:** If you intend to deceive (1), you must know the truth ($\neg p$). If you know the truth, you cannot sincerely believe the falsehood (2) without violating rationality. If you claim you do both, you must posit that the mind is split into a "deceiver" part and a "deceived" part (violating 3).
  *Any adequate theory must reject or modify one leg of this triad.* Most modern theories sacrifice **Intentionality** (making SD unintentional) or **Unity** (positing subconscious partitions).

  ***

  ### The "Most Work" Flag
  The requirement doing the heaviest lifting to rule out standard candidates is **Desideratum 3: The Non-Voluntarism Condition.**

  *   **Why:** It kills the "Literal Model" of self-deception immediately. The Literal Model treats self-deception exactly like interpersonal deception (I know $\neg p$, I intend to make me believe $p$). This is the most intuitive model, but it violates Non-Voluntarism and the Static Paradox (believing $p$ and $\neg p$).
  *   **Consequence:** By enforcing Non-Voluntarism, you force the theory into the "Deflationary" or "Motivational Bias" camp. The theory must now perform the difficult labor of explaining how a subject can be *responsible* for a belief they did not *intentionally* choose. It forces the explanation away from "plotting" and toward "biased evidence weighting," "attention management," or "emotional gating."

  ### Summary on the Avoidance Case
  Regarding your "Quiet Manager": Desideratum 5 forces the theory to classify them.
  *   If the theory says avoidance *is* self-deception, it must explain how a belief is formed without looking at evidence (likely by relying on prior biased assumptions).
  *   If the theory says avoidance is *not* self-deception (merely strategic ignorance), it draws a hard line between managing attention and managing belief.
  *   **The Trap:** If the theory says the Quiet Manager *doesn't* believe the flattering thing (they just don't know), it fails Desideratum 1 (Sincerity). If it says they *do* believe it, it must explain the mechanism of belief without evidence. This is the awkward spot you identified, and the list ensures the theory cannot look away from it.
