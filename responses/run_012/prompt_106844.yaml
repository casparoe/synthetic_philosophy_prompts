prompt: |-
  Before I read any more accounts of self-deception I want to know what one actually has to do to count. Give me the desiderata: the cases any adequate theory has to get right, the distinctions it can't collapse (really having the belief vs. only acting as if, the deceiver vs. the deceived, doing it to yourself vs. just being plain wrong), and the facts about belief it can't ride roughshod over — with the case or consideration behind each one, and say which of them I couldn't have all at once even in principal. Two I keep banging into: self-deception seems to need both believing p and believing not-p at the same time, and belief isn't the sort of thing you can just decide to adopt, so how does anyone manage it on themselves? And there's a case I want the list to handle because I think it's the awkward one: someone who never tells themselves a falsehood, they just quietly manage what they'll look at — drop the friend, skip the test results, treat the second opinion as the real one — and end up sincerely believing the flattering thing. Is that the same phenomenon as the man who simply insists the evidence is wrong, or a different one, and does your list force the theory to say? Flag the requirement doing the most work to rule out the usual candidates. Skip the scorecard, I'll do that myself.
