answer: |-
  You have identified a sophisticated and pervasive argumentative move, and your intuition is correct: standard labels like "bounded rationality" or "worst-case fallacy" do not fully capture the specific tension you are feeling. You are sensing a slippage between a *description* of limits and a *prescription* of duty.

  There is no single, canonical Latin name for this fallacy (like *ad hominem* or *straw man*). However, in political philosophy, legal theory, and ethics, this move is discussed under the heading of **Feasibility Constraints** or the **Ought-Implies-Can Principle**.

  Because there is no standard name, I will propose one that captures the rhetorical function you are critiquing: **The Intractability Exemption**.

  Below, I will define this move, separate its two faces (which you correctly identified as distinct), explain why the leap between them is logically precarious, and address your worry about the argument being "too universal."

  ### 1. Naming and Defining the Move

  **Proposed Name:** The Intractability Exemption.
  **Formal Context:** A specific application of the *Feasibility Constraint* on normative claims.

  **Definition:** The Intractability Exemption occurs when an arguer uses the computational or practical difficulty of achieving an ideal standard (Premise 1) to simultaneously explain why a sub-optimal practice exists (Descriptive Claim) and to argue that agents are morally or legally released from the obligation to pursue that standard (Normative Claim).

  **The Structure:**
  1.  **Ideal:** Practice $P$ requires achieving Outcome $O$.
  2.  **Hardness:** Achieving $O$ is computationally intractable (NP-hard, combinatorial explosion, etc.).
  3.  **Conclusion A (Descriptive):** Therefore, existing imperfect practices are adaptations to this hardness.
  4.  **Conclusion B (Normative):** Therefore, agents are not obligated to achieve $O$.

  Your worry is that Conclusion B does not automatically follow from Premise 2, even if Conclusion A is true.

  ### 2. The Two Faces: Explanation vs. Exoneration

  You asked: *"Are these two separate moves that happen to share a premise, one move with two faces, or does the second actually follow from the first?"*

  They are **two separate moves** that share a premise, and treating them as one is where the error lies.

  **Face 1: The Explanatory Claim (Valid)**
  It is often true that institutions evolve to avoid intractable tasks. Legal rules are vague *because* drafting specific rules for every contingency is impossible. Budgets are approximate *because* perfect optimization is computationally prohibitive. This is a causal claim about social design. It is generally sound.

  **Face 2: The Normative Claim (Problematic)**
  This claims that because a task is hard, we are *released from the obligation* to attempt it. This relies on the Kantian principle *"Ought Implies Can."* If you literally *cannot* do something, you cannot be required to do it.

  **The Slippage:**
  The argument conflates **"Cannot"** (logical or physical impossibility) with **"Cannot Efficiently"** (prohibitive cost).
  *   **Impossibility:** If a budget allocation requires solving a problem that would take 1,000 years of supercomputer time, we literally *cannot* do it. The obligation dissolves.
  *   **Inefficiency:** If a budget allocation requires solving a problem that takes 100 hours of analyst time, we *can* do it, but it is expensive.

  The Intractability Exemption often treats *expensive* as *impossible*. It argues that because the *perfect* solution is intractable, we are exempt from striving for *better* solutions. This is the gap that bothers you. Hardness explains why we don't have perfection; it does not necessarily justify why we shouldn't try to get closer to it.

  ### 3. Why the Move Feels "Too Universal"

  You wrote: *"An argument that can be run for everything seems to establish nothing."*

  This is a profound insight known in economics and political philosophy as the **Problem of the Second Best**.

  If every standard is infeasible, then "feasibility" ceases to be a useful filter. If I can excuse any failure by pointing to a harder version of the task, norms collapse.
  *   *Example:* "I didn't study for the test." "Why?" "Because studying for *every possible question* is impossible."
  *   *Response:* You are not required to study for *every* question, but you are required to study for *some*.

  **The Edge of the Argument:**
  For the Intractability Exemption to be valid, it must distinguish between **Structural Intractability** and **Contingent Difficulty**.
  *   **Structural:** The problem is NP-hard by its very nature (e.g., The Traveling Salesman Problem). No amount of effort solves it generally.
  *   **Contingent:** The problem is hard only given current resources, technology, or effort levels.

  The move is fallacious when it uses Structural Intractability to excuse Contingent Laziness. In your budget example: Just because the *optimal* allocation is intractable does not mean the *current* allocation is justified. There may be a "good enough" allocation that is computable and vastly superior to the current one. The hardness of the *best* does not excuse the negligence of the *good*.

  ### 4. Distinguishing from Nearest Concepts

  You mentioned three concepts you already know. Here is how the Intractability Exemption differs:

  1.  **Bounded Rationality (Herbert Simon):**
      *   *Focus:* Cognitive limits of the human mind.
      *   *Difference:* Bounded rationality explains *how* we decide (we satisfice). It is primarily descriptive. The Intractability Exemption uses that description to make a *normative* claim (we *should* be allowed to satisfice).
  2.  **Worst-Case vs. Typical Case:**
      *   *Focus:* Statistical distribution of problem difficulty.
      *   *Difference:* You already know this rebuttal. The Intractability Exemption survives this by admitting typical cases are easier but arguing the *risk* of the worst case justifies the vague rule. Your worry is deeper: even if the risk is real, does it *excuse* the agent?
  3.  **Is-Ought Problem (Hume):**
      *   *Focus:* Deriving values from facts.
      *   *Difference:* This is the engine of the move. The Intractability Exemption is a specific *instance* of an Is-Ought error. It tries to derive "We ought not be held to this standard" from "It is hard to meet this standard."

  ### 5. When Is the Move Valid? (Marking the Edges)

  To answer your final question: *"Whether a hardness claim can ever by itself justify a practice rather than merely explain it."*

  A hardness claim **cannot by itself justify** a practice. It needs a second premise: **A Cost-Benefit Threshold.**

  The argument becomes valid only when structured like this:
  1.  **Hardness:** Achieving Standard $S$ is computationally intractable.
  2.  **Marginal Utility:** The resources required to approximate $S$ closer than current Practice $P$ would yield benefits smaller than the cost of those resources.
  3.  **Conclusion:** Therefore, Practice $P$ is justified.

  Without Premise 2, the argument is incomplete.
  *   **In the Legal Example:** Vagueness is justified not just because precision is hard, but because the *cost* of precision (rigidity, inability to adapt to new cases) outweighs the *benefit* (predictability).
  *   **In the Budget Example:** The district is not released from obligation simply because optimization is hard. They are released only if the cost of computing a better plan exceeds the value of the improvement.

  ### Summary for Your Toolkit

  *   **Name:** The Intractability Exemption (a specific form of Feasibility Constraint argument).
  *   **The Trap:** It conflates **Explanation** (why we fail) with **Exoneration** (why we are forgiven).
  *   **The Logical Flaw:** It treats **Cost** (time/computation) as **Impossibility** (logical/physical constraint).
  *   **The Fix:** Demand the **Cost-Benefit Premise**. Ask: "Granted the perfect solution is intractable, is the *next best* solution also intractable? If not, why are we exempt from pursuing that?"

  You are not missing something obvious; you are identifying a gap in normative reasoning that many adults and professionals gloss over. The move is rhetorically powerful because it sounds like humility ("we are only human"), but it often functions as a shield against improvement ("we are only human, so don't ask us to try harder"). Recognizing the distinction between *structural limits* and *contingent costs* is the key to dismantling it.
