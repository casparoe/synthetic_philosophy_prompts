      *   *Conclusion:* Personal morality has nothing to say about diet; only policy matters.

  3.  **Evaluate Claim-by-Claim (Philosophical Landscape):**

      *   *Claim 1 (Act Consequentialism):* "An act is only wrong if it makes a difference."
          *   *Status:* Contested. This is a specific form of Consequentialism (Act Utilitarianism). Many philosophers reject this (Deontologists, Virtue Ethicists, Complicity Theorists). Even among consequentialists, *expected* utility matters more than *actual* utility.
          *   *Verdict:* Overstated as "settled."

      *   *Claim 2 (Empirical Inefficacy):* "Your burger makes no difference."
          *   *Status:* Empirically dubious. Economics suggests marginal impact. Threshold models (one purchase triggers a reorder). Probabilistic impact.
          *   *Verdict:* Wince-worthy. Philosophers of economics/ethics (like Norcross, Kagan) argue there *is* an expected impact.

      *   *Claim 3 (Voting Analogy):* "Your one ballot never decides."
          *   *Status:* Similar to Claim 2. While one vote rarely decides, the *expected value* of voting is often calculated as positive. Also, voting has expressive value.
