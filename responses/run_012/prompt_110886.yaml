  2.  **Deconstruct Dev's Argument:**
      *   *Claim 1 (The Core Principle):* An act is only wrong if it makes a difference (causal impact).
      *   *Claim 2 (The Empirical Premise):* Individual purchases don't make a difference (threshold problems, supply chains, animals already dead).
