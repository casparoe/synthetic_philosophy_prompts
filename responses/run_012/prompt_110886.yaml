      *(Self-Correction on "Inefficacy"):* The "settled" part is the biggest red flag. The "Causal Impotence Objection" is a classic objection, but the responses to it (Expected Utility, Complicity, Integrity) are equally prominent. I need to name-drop some key thinkers (Kagan, Norcross, Sinnott-Armstrong) to ground the response.

