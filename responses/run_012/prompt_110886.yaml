      *   *Claim 4 (Collective Responsibility/Complicity):* "You're implicated only if you're a member... leave society entirely."
          *   *Status:* This is a strawman of complicity theory. Complicity usually argues that *participating* in a harmful practice makes you complicit, even if you can't leave the whole system. You can opt out of specific harmful practices (like eating meat) without leaving society.
