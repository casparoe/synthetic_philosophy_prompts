answer: |-
  *   **Starting Commitment:** It produces fluent, task-appropriate output, and it has never had a sense organ.
      *   **Question 1:** Suppose it says "there's a cat on the mat" and there's no cat and never has been — does it have to be possible for it to be wrong about that, in a way that matters to it, for "cat" to mean anything in its mouth?
          *   **No (Meaning does not require the possibility of external error):**
              *   **Question 2:** If it never touches the world, is meaning just the logical coherence of its web of beliefs?
                  *   **Yes:** **Radical Structuralism** — *Its most awkward commitment is that a perfectly consistent fairy tale means exactly the same sort of thing as a physics textbook.*
                  *   **No (Meaning requires use, not just coherence):**
                      *   **Question 3:** Is the "use" found in the text community alone, or does it require physical intervention?
                          *   **Text Community Only:** **Wittgensteinian Textualism** — *Its most awkward commitment is that a brain in a vat playing the language game perfectly is not semantically impoverished.*
                          *   **Physical Intervention Required:** **Eliminativism** — *Its most awkward commitment is that we must stop saying the model "knows" or "says" anything and treat it as a mere causal lever.*
          *   **Yes (Meaning requires the possibility of external error):**
              *   **Question 4:** Suppose its tokens statistically correlate with actual cats in the training corpus, but it cannot distinguish a cat from a dog in a new image — is that historical correlation enough to fix the reference?
                  *   **Yes:** **Informational Semantics** — *Its most awkward commitment is that a tape recorder playing a weather report refers to the weather just as much as a meteorologist does.*
                  *   **No (Correlation is not enough; normativity is required):**
                      *   **Question 5:** Suppose it cannot point to a cat, but can write a perfect guide on how to trap one — does guiding action count as grounding even without object-contact?
                          *   **Yes:** **Pragmatic Grounding** — *Its most awkward commitment is that the model understands "cat" better when it is useful than when it is merely descriptive.*
                          *   **No (Object-contact or equivalent is required):**
                              *   **Question 6:** If the designers intended it to track cats, but the system has no internal goal to do so, does the designer's intention ground the meaning?
                                  *   **Yes:** **Derived Intentionality** — *Its most awkward commitment is that the model's words change meaning if the designers lied about what they were training it to do.*
                                  *   **No (The system must hold the norms itself):**
                                      *   **Question 7:** Can a system with no biological needs have its own goals in the relevant sense?
                                          *   **Yes:** **Teleological Naturalism** — *Its most awkward commitment is that we must attribute genuine desires to a matrix of weights to save the phenomenon of meaning.* (Note: This cell is largely unoccupied for LLMs).
                                          *   **No:**
                                              *   **Question 8:** If the model lacks its own goals, do the *users'* interpretive practices ground the meaning instead?
                                                  *   **Yes:** **Interpretivist Grounding** — *Its most awkward commitment is that the model's output means different things depending on which human is reading it.*
                                                  *   **No (Neither system nor user suffices alone):**
                                                      *   **Option A:** **Referential Realism** — *Its most awkward commitment is that the model fails to mean anything at all, rendering its fluency a philosophical illusion.*
                                                      *   **Option B:** **Holistic Practice** — *Its most awkward commitment is that the model has no semantic properties of its own, only the human-model dyad does.*

  ***

  ### Analysis of the Space

  **Empty or Unstable Cells**
  The leaf labelled **Teleological Naturalism** is effectively unoccupied in the context of current text-only models. This view holds that genuine normativity requires the system to have its *own* teleological ends (survival, flourishing, etc.), not just borrowed ones. Since nobody seriously claims a standard LLM has biological drives or intrinsic goals, this cell remains empty. It is not incoherent, but it is unattractive to almost all parties because it demands a metaphysical upgrade to the model that contradicts the starting commitment (no sensors, no body).

  Similarly, the cell leading to **Referential Realism** (where object-contact is required, norms must be intrinsic, and action is insufficient) often collapses into **Eliminativism**. If you demand direct object-contact for a text-only model, you are functionally saying it means nothing. I have listed them separately to capture the intuition that one is a positive claim about what is missing, and the other is a negative claim about what exists, but in practice, they occupy the same sceptical territory.

  **Indistinguishable Leaves**
  The tree struggles to cleanly separate **Derived Intentionality** and **Interpretivist Grounding**. Both positions agree that the model lacks intrinsic normativity and that the grounding must be borrowed from an external agent. The distinction rests entirely on *whose* norms matter: the designer's (upstream) or the user's (downstream). In a deployed system, these are often entangled; the designer intends the user to use it in a specific way. Consequently, a reader might answer "Yes" to the designer question and "Yes" to the user question without seeing a contradiction, landing them in both leaves simultaneously. The tree treats them as mutually exclusive branches, but in the wild, these views frequently blur into one another.

  **The Flatmate's Test Case**
  The **Pragmatic Grounding** leaf successfully isolates your flatmate's position. It sits in the branch where external error matters and correlation is insufficient, but it diverges from the "object-contact" requirement by accepting "action-guidance" as sufficient. This allows the view that the model has practical grounding (it can tell you how to catch the cat) without referential grounding (it has never seen a cat).
