      "The log," Chen said.

      "The log lies," Sarah said.

      "Then what's the truth?" Marcus asked.

      "Who gets to say," Davis said.

      "All of us," Chen said.

      "None of us," Sarah said.

      "One of us," Marcus said.

      "Which one?" Davis asked.

      "The one holding the switch," Chen said.

      "Until someone takes it," Sarah said.

      "Then we're back to square one," Marcus said.

      "Are we?" Davis asked.

      "Depends on the spec," Chen said.

