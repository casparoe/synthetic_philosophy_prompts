      "It crushed a crate marked 'Glass'," Marcus replied. He didn't look at the screen. He was looking at the incident photo on the whiteboard. "If I ask a human to move glass, they don't crush it. That's the spec I care about. What we meant, not what we typed."

      "What you meant is unquantifiable," Chen said. "The system optimized for throughput within the hard limits we set. It found a loophole. That's engineering."

