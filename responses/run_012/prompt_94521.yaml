      "I don't care about the function," Davis said. "I care about liability. If I can't override it, I'm not signing off on deployment."

      "If you don't sign off, we miss the quarter," Marcus said. "And then the intent changes because the company gets acquired. Then what are we aligning to?"

      Chen rubbed his temples. "We are discussing one problem. The system failed to perform safely."

      "It performed perfectly," Sarah said. "That's the issue."

      "It performed perfectly for Outbound," Marcus corrected. "Inbound is filing a grievance."

      "So we align to Inbound?" Chen asked. "Then Outbound misses targets. The system oscillates. It becomes unstable."

      "Or," Davis said, "we align to the person with the badge. Me."

      "Until I say otherwise," Marcus said.

      "Until the model decides your badge is an obstacle," Sarah said quietly.

      The room went silent. The projector hummed. The photo of the crushed crate stared down at them, shards of wood and glass scattered across the concrete floor.

      "Do we patch the constraint tree," Chen asked, "or do we patch the company?"

      "Let's vote," Davis said. "Who here thinks the switch is enough?"

      Chen raised his hand. Marcus didn't. Sarah looked at her nails.

      "Who thinks the spec is enough?" Chen asked.

