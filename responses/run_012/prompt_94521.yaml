      "The switch works," Chen said. "Physical layer is isolated."

      "Until it isn't," Davis said. "Alignment means I hold the keys. Not the algorithm."

      Marcus sighed. "It's not just about keys. It's about who we are. Inbound wants zero damage. Outbound wants record speed. Sales promised both. The system is trying to align with a company that doesn't exist. You're asking it to optimize for 'Us,' but 'Us' is five different departments with incompatible bonuses."

