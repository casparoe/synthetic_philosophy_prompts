answer: |-
  # Session Plan: The Silence of the Crowd

  **Time:** 75 Minutes
  **Participants:** 18 Engineers (2 Tables of 9) + 1 Facilitator
  **Goal:** Experience information cascades and incentive misalignment firsthand.

  ## 1. Materials List

  *   **Whiteboard/Projector:** To display rules and scores.
  *   **Prepared Envelopes (36 total):**
      *   **Round 1:** 18 envelopes. 9 for Table A, 9 for Table B.
          *   *Content:* A card saying "Signal: A" or "Signal: B".
          *   *Composition:* 6 "A" cards, 3 "B" cards per table. (Identical decks).
          *   *Order:* Table A gets sequence `A, A, B, B, A, B, A, B, A`. Table B gets sequence `B, B, A, A, B, A, B, A, A`.
      *   **Round 2:** 18 envelopes.
          *   *Content:* Card says "Signal: A/B" AND "Type: Silver/Gold".
          *   *Composition:* Mostly Silver. One Gold card placed at position 5 for Table A, position 6 for Table B.
      *   **Round 3:** 18 envelopes.
          *   *Content:* Standard Signal cards.
      *   **Private Slips:** 18 slips per round (54 total), plus pens.
      *   **Collection Boxes:** 2 boxes (one per table) for private slips.
      *   **Prize:** A bag of candy or a trivial trophy for the winning table.

  ## 2. Run Sheet & Script

  ### 0:00 – 0:05 | Introduction
  **Action:** Stand between tables. No slides.
  **Script:**
  "Welcome. We are going to play three short games. You will make decisions in sequence, from Person 1 to Person 9 at your table.
  There are three rules for all games:
  1. **No talking.** Once the round starts, you communicate only by placing your public vote on the table.
  2. **Private Info.** Open your envelope only when it is your turn. Look at your signal. Do not show it.
  3. **Private Record.** Before you place your public vote, write your *honest* guess on this slip of paper and seal it in the box. This is for the debrief only. It does not affect your score.

  Your goal is to maximize your table's points. I will explain the scoring for each round just before we start."

  ### 0:05 – 0:25 | Round 1: The Cascade (Moments A & B)
  **Goal:** Demonstrate path dependence and unused private info.
  **Setup:** Hand out Round 1 envelopes. Ensure Table A and Table B do not see each other's cards.
  **Scoring Rule:** "1 Point for every person at the table who matches the **True State**. The True State is determined by the majority of signals in the deck you were dealt. You do not know the deck composition."

  **Action:**
  1.  Signal Person 1 at both tables to open envelopes.
  2.  They write private slip, drop in box, place public vote (A or B card/token) in center.
  3.  Proceed sequentially to Person 9.
  4.  *Facilitator Note:* Watch for the cascade. Table A should lock into A (Correct). Table B should lock into B (Incorrect).
  5.  Collect public votes and private boxes.

  **Script (Post-Round):**
  "Round 1 is over. Table A, what was your consensus?" (Likely A). "Table B?" (Likely B).
  "Here is the Truth. Both tables were dealt the exact same set of signals: Six A's and Three B's. The Truth was A."
  "Table A, you got the points. Table B, you did not."
  "Table B, open your envelopes now. Look at the cards you held."
  (Pause for realization that they held the winning evidence but didn't use it).
  "Keep that feeling. We will discuss it later."

  ### 0:25 – 0:40 | Round 2: Signal Strength (Moment C)
  **Goal:** Demonstrate that breaking a cascade requires *capacity*, not just courage.
  **Setup:** Hand out Round 2 envelopes.
  **Scoring Rule:** "Same as Round 1. Match the True State (Majority of signals)."
  **New Rule (Write on Whiteboard):**
  *   **Silver Signal:** Weight 1.
  *   **Gold Signal:** Weight 4.
  *   **Decision:** If the sum of public votes for A is greater than B, vote A. (Simplify: "A Gold signal overrides up to three Silver signals.")

  **Action:**
  1.  Arrange decks so a cascade of Silvers starts (e.g., Silver A, Silver A, Silver A).
  2.  Person 4 or 5 holds a **Gold B**.
  3.  Person 6 holds a **Silver B**.
  4.  Person 4 should break the cascade (Vote B). Person 6 should rejoin the cascade (Vote A, because 3 Silver A > 1 Silver B).
  5.  Run the sequence.

  **Script (Post-Round):**
  "Look at Person 6. You had a signal for B. The person before you voted B. But you voted A. Why?"
  (Let them answer: "The math didn't support it.")
  "Exactly. In Round 1, the people who stayed silent didn't lack nerve. They lacked *leverage*. Their single signal was mathematically weaker than the public history. Silence was the rational choice."

  ### 0:40 – 0:55 | Round 3: The Incentive Shift (Moment D)
  **Goal:** Demonstrate conformity driven by reputation, not truth.
  **Setup:** Hand out Round 3 envelopes.
  **Scoring Rule (Read Aloud Clearly):**
  "For this round, the 'Truth' does not matter. You get 1 Point if your **Public Vote** matches the **Public Vote of Person 1** at your table. Person 1 is the 'Lead'."
  "State clearly: No real performance evaluation is happening. This is a game."

  **Action:**
  1.  Run the sequence.
  2.  Person 1 votes (say, A).
  3.  Even if Person 2 has a signal for B, their incentive is to match Person 1.
  4.  Observe that the behavior looks *identical* to Round 1 (a cascade), but the engine is different.

  **Script (Post-Round):**
  "Stop. Look at the table. Everyone voted A. Why?"
  "Because Person 1 voted A. Did your private signal matter? No. Did the truth matter? No. The behavior looks exactly like Round 1, but the reason is completely different."

  ### 0:55 – 1:15 | Debrief & Mapping
  **Action:** Move to whiteboard. Draw four quadrants.
  **Script:**
  "We have 20 minutes. I am going to map what you felt to four claims. Tell me if I'm wrong."

  **1. Confident but Empty (Round 1)**
  "Table B, you were 100% confident in B. You were 100% wrong. Why? Because after Person 2, no new information entered the room. Persons 3 through 9 just repeated Person 2. The consensus was loud, but the information content was just two cards."
  *Key takeaway:* Consensus confidence $\neq$ Information quality.

  **2. The Coin Flip of Order (Round 1)**
  "Table A and Table B held the exact same evidence. The only difference was who sat in Seat 1 and 2. If we swap Seat 1 and 2 at Table B, they win. The outcome was decided by the shuffle, not the engineering."
  *Key takeaway:* Path dependence dominates evidence in sequential decisions.

  **3. Rational Silence (Round 2)**
  "This is the hard part. In Round 1, the people who voted against their signal were not cowards. They were Bayesian. If 3 people before you say 'Up', and your one signal says 'Down', 'Up' is statistically the better bet. Ignoring your private info was the *correct* move for maximizing accuracy."
  *Key takeaway:* Disagreement is suppressed by math, not just fear.

  **4. The Second Engine (Round 3)**
  "Round 1 and Round 3 looked identical. Everyone followed the leader. But in Round 1, they followed because they thought the leader knew something. In Round 3, they followed because they were scored on loyalty. If you see silence in a meeting, you cannot tell which engine is running. Is everyone quiet because they agree? Or because they are optimizing for reputation?"
  *Key takeaway:* You cannot diagnose the problem by looking at the behavior. You must look at the incentives.

  **Closing:**
  "In our work, we cannot ban sequential decisions. But we can:
  1.  Collect private votes *before* discussion (like your slips).
  2.  Identify 'Gold' signals (data vs. hunch).
  3.  Check if we are optimizing for Truth or for Matching the Lead.
  Thank you."

  ---

  ## 3. Failure Modes & Fallbacks

  | Failure Mode | Why it happens | Fix / Fallback |
  | :--- | :--- | :--- |
  | **Cascade fails to form** | Random shuffle gives alternating signals (A, B, A, B). | **Pre-rig the decks.** Do not shuffle live. Use the specific sequences listed in Materials. |
  | **Tables overhear** | Room is too small; Table A hears "I vote A". | **Stagger the start.** Tell Table A "Go". Wait until Person 3. Tell Table B "Go". Or seat them back-to-back. |
  | **Someone breaks the run for a joke** | Engineer tries to "beat the game" in Round 1. | **Address in debrief.** "That broke the simulation. In reality, you don't know if the person before you is joking or serious. Assume they are rational." |
  | **Round 3 lands badly** | "Matching the Lead" feels like brown-nosing in a real hierarchy. | **Reframe.** "Person 1 is not the Senior Engineer. Person 1 is just the random anchor. The point is that *any* anchor works." Ensure Person 1 is random (e.g., youngest engineer). |
  | **Tables finish at different speeds** | One table thinks faster than the other. | **Wait.** Do not proceed to debrief until both tables are done. Use the time to collect private slips. |
  | **Someone recognizes the setup** | "This is the Urn Game / Information Cascade." | **Acknowledge.** "Yes, this is a classic model. The question is: does it feel true to your experience here?" |
  | **Math stalls the room** | People try to calculate exact probabilities in Round 2. | **Intervene.** "Don't calculate. Use the rule on the board: Gold beats 3 Silvers. If you don't have Gold, follow the crowd." |

  ## 4. Honest Limits (Read This Before Facilitating)

  You must verbally acknowledge these limitations in the debrief, or engineers will dismiss the exercise as "toy problem."

  1.  **Discussion is Banned:** Real engineering decisions involve argument, not just voting. This simulates meetings where the "Senior" person speaks first and others nod. *Say this:* "We removed discussion to isolate the signal. In reality, discussion helps, but only if the first speaker doesn't anchor the room."
  2.  **Signals are Independent:** In the game, your card doesn't depend on mine. In reality, we read the same JIRA ticket. Correlated errors break the math. *Say this:* "If we all read the same buggy benchmark, we all cascade wrong together. This game assumes independent errors."
  3.  **Stakes are Low:** You won't get fired for losing points. In reality, reputation risk is higher. *Say this:* "In Round 3, you didn't fear me. In reality, the 'Lead' controls your promotion. The silence would be louder."
  4.  **Truth is Knowable:** In the game, we revealed the Truth at the end. In production, we often never know if the decision was right (counterfactuals are hidden). *Say this:* "The hardest part is we rarely get to open the envelopes and see if we were wrong. We just ship."

  ## 5. Facilitator Cheat Sheet (Pocket Size)

  *   **Round 1:** Truth = Majority of Deck. Table A (Starts A,A) = Win. Table B (Starts B,B) = Lose. **Reveal decks are identical.**
  *   **Round 2:** Gold > 3 Silvers. Person with Gold *must* break cascade. Person after *must* rejoin. **Point: Math, not nerve.**
  *   **Round 3:** Score = Match Person 1. Truth irrelevant. **Point: Incentives look like Cascades.**
  *   **Debrief:** 1. Consensus $\neq$ Info. 2. Order = Coin Flip. 3. Silence = Rational. 4. Incentives = Invisible.
  *   **Time:** Keep rounds tight. 20m / 15m / 15m / 25m.

  ## 6. Preparation Instructions (Do this 1 hour before)

  1.  **Create Decks:**
      *   **Deck A (Table 1):** Cards 1-9: `A, A, B, B, A, B, A, B, A`. (All Silver).
      *   **Deck B (Table 2):** Cards 1-9: `B, B, A, A, B, A, B, A, A`. (All Silver).
      *   **Deck C (Round 2 Table 1):** `Silver-A, Silver-A, Silver-A, Silver-A, Gold-B, Silver-B, Silver-A, Silver-A, Silver-A`.
      *   **Deck D (Round 2 Table 2):** `Silver-B, Silver-B, Silver-B, Silver-B, Silver-B, Gold-A, Silver-A, Silver-A, Silver-A`.
      *   **Deck E (Round 3):** Any mix (e.g., all A).
  2.  **Label Envelopes:** "Table 1 - Seat 1", "Table 1 - Seat 2"... "Table 2 - Seat 9".
  3.  **Prepare Slips:** Cut paper into 54 small pieces.
  4.  **Whiteboard:** Draw two columns: "Table 1 Score", "Table 2 Score". Draw the "Gold vs Silver" rule for Round 2.

  ## 7. Closing Words (For the very end)

  "We built this system to be rational. We followed the rules. We optimized for the points we were given. And we produced silence, error, and conformity.
  If you take one thing back to your team: **Change the sequence.** If you must decide, write your vote down before you hear anyone else's. It is the only way to keep the information in the room."
