      *   **Topic:** Republican liberty (freedom as non-domination vs. freedom as non-interference).
      *   **Goal:** A joke to open a session on republicanism.
      *   **Key Distinction:**
          *   Unfreedom = standing in another's arbitrary power (domination), even if unused (nice master is still a master).
          *   Freedom ≠ absence of interference. Interference that tracks interests/is controlled by the subject (non-arbitrary) is not domination (e.g., democratic tax vs. tyranny).
      *   **Constraints:**
          *   Must land only if the distinction is understood (conceptual joke).
