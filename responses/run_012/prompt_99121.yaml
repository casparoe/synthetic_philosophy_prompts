answer: |-
  This is a profound and deeply human reaction to Kant. Many people find his ethics cold, but you are experiencing something rarer: you are feeling the *weight* of his demand for purity. You are worried that your good deeds are, in a philosophical sense, "corrupted."

  I will work through the passage in the order you requested, addressing your specific questions about terminology, argument structure, and finally, the implications for your Saturday mornings. I will not direct you to other books, but I will clarify the context where it helps illuminate the text itself. (For the record, the text you have is primarily drawn from the *Groundwork of the Metaphysics of Morals* (1785) and the *Metaphysics of Morals* (1797), blended in Abbott's translation. The date "1780" on your page is likely a typesetting error or refers to a lecture series, as the published works are 1785 and 1797. This does not change the philosophy, but it explains your bibliographic confusion.)

  Here is the explication of the passage.

  ### 1. "Pathological" Feeling
  **Your Question:** *What does "pathological" cover here — does it take in warm fellow-feeling and love, or only self-interested appetite?*

  **The Text:** *"...begin from pathological, or purely sensitive, or even moral feeling..."*

  **Explanation:**
  In contemporary English, "pathological" means diseased. In Kant's German (*pathologisch*), it derives from the Greek *pathos*, meaning "suffering" or "that which is undergone." For Kant, a pathological feeling is any feeling that is **passive**. It is something that happens *to* you, caused by your biology, your upbringing, or your circumstances, rather than something you actively choose through reason.

  Therefore, **yes, it covers warm fellow-feeling and love.** It also covers sympathy, pity, guilt, and the "distaste for your own guilt" you mentioned. It even covers "moral feeling" if that feeling is understood as a sentimental warmth toward goodness.

  Kant's point is not that these feelings are bad. He admits elsewhere that sympathy is beautiful and amiable. His point is that they are unreliable and heteronomous (governed by outside forces). If you visit because you *like* the residents, you are governed by your psychological constitution. If you were to lose that liking (perhaps due to burnout or a change in the residents' behavior), the motive would vanish. Because the motive is contingent on your emotional state, it cannot ground a universal moral law.

  ### 2. Matter vs. Form (The End vs. The Law)
  **Your Question:** *How exactly is the contrast between "the matter of the will, the end" and "its form that is the law" doing work in the sentence about deviation?*

  **The Text:** *"...from the matter of the will, the end, not from its form that is the law..."*

  **Explanation:**
  This is the engine of Kant's ethics.
  *   **The Matter (The End):** This is the specific outcome you want to achieve. In your case: "The residents should feel less lonely" or "I should feel like a good person." This is content-based.
  *   **The Form (The Law):** This is the structure of the decision itself, regardless of the outcome. It asks: "Can the principle on which I am acting be universalized?"

  **How it works in the sentence:**
  Kant argues that if you derive your duty from the *matter* (the end), your rule becomes hypothetical: *"If* I want the residents to be happy, *then* I must visit." This is a rule of skill or prudence, not morality.
  If you derive your duty from the *form* (the law), the rule is categorical: "I must visit because a rational being recognizes this as a requirement of duty, regardless of whether it makes them happy or makes me feel good."

  The "deviation" Kant warns against is building ethics on the *If/Then* structure (matter) rather than the *Must* structure (form). He claims that if you build on the *If/Then*, you have no "metaphysical elements of ethics" because you are just describing cause-and-effect in the world of desires, not the necessary laws of freedom.

  ### 3. "Feeling... is always physical"
  **Your Question:** *The clause "for feeling by whatever it may be excited is always physical" reads to me less like an argument than a flat assertion... does the word "physical" mean what a contemporary reader would take it to mean?*

  **The Text:** *"...for feeling by whatever it may be excited is always physical."*

  **Explanation:**
  You are right to sense an assertion here. It relies on a premise Kant assumes but does not argue for in this specific paragraph: **Metaphysical Dualism.**

  *   **Contemporary "Physical":** Usually means "material," "bodily," or "tangible."
  *   **Kant's "Physical":** Means "part of the natural world of cause and effect" (the realm of *phenomena*).

  **The Missing Premise:**
  Kant believes the universe is divided into two realms:
  1.  **Nature:** Governed by laws of cause and effect (physics, biology, psychology). Feelings belong here. If you feel love, it is caused by hormones, history, or proximity. It is determined.
  2.  **Freedom:** Governed by laws of reason (the realm of *noumena*). Morality belongs here. For an action to be free, it cannot be determined by prior physical causes.

  **The Argument Reconstructed:**
  1.  Morality requires Freedom (you must be able to choose otherwise).
  2.  Feelings are "physical" (they are caused by prior natural events).
  3.  Therefore, feelings are determined, not free.
  4.  Therefore, feelings cannot be the source of Morality.

  **Is it obscure?**
  To a modern reader, yes. We often view emotions as complex cognitive evaluations, not just brute physical reactions. Kant is drawing a hard line between "Reason" and "Sensibility." He is asserting that anything you *sense* (even internally) is part of the causal chain of nature, and thus cannot be the seat of moral freedom. It is a hard claim to accept, but it is necessary for his system to work.

  ### 4. "Motive Power" and Ethical Teaching
  **Your Question:** *Is Kant claiming that a person cannot actually be moved to do their duty without metaphysical reflection, or something weaker about the conditions under which ethical teaching is reliable?*

  **The Text:** *"...without which we cannot expect any certainty or purity, or even motive power in ethics. But then ethical teaching... is corrupted in its source."*

  **Explanation:**
  Kant is **not** claiming that an ordinary person needs to study metaphysics to be a good person. He explicitly says earlier in the text that "common human reason" knows how to judge duty.

  He is making a point about **stability and justification** ("certainty or purity").
  *   **Motive Power:** He means that feelings are fickle. If your ethics are based on "I like these people," what happens when you are tired, or when a resident is aggressive? The "motive power" fails. The only motive power that is inexhaustible is the recognition of the Law itself.
  *   **Corrupted in its Source:** This refers to *teaching*. If teachers tell students "Be good because it makes you feel warm inside," they are teaching prudence, not morality. They are corrupting the *concept* of duty, even if the students behave well.

  So, the claim is weaker regarding the *agent* (you can act well without philosophy) but stronger regarding the *principle* (without metaphysics, we cannot guarantee the action is truly moral rather than just lucky inclination).

  ### 5. "Obscurely conceived metaphysic"
  **Your Question:** *What should I make of the claim that a moral principle is an "obscurely conceived metaphysic which inheres in every man's reasoning faculty" — is that a thesis about the content of morality or about the machinery of the mind, and does it imply that the ordinary person who has never done philosophy is nonetheless implicitly a metaphysician?*

  **The Text:** *"...obscurely conceived metaphysic which inheres in every man's reasoning faculty..."*

  **Explanation:**
  This is one of Kant's most hopeful sentences.
  *   **Machinery of the Mind:** It is a thesis about the structure of human reason. Kant believes that to be a rational agent is to possess the "software" for morality.
  *   **Implicit Metaphysician:** **Yes.** Kant is saying that when you judge something is wrong, you are implicitly appealing to a universal law, even if you explain it using feelings.
      *   *Example:* If you say, "It's wrong to steal," you might say, "It hurts people." But if someone says, "I don't care if it hurts them," you will eventually say, "But you *shouldn't* do it, period." That "period" is the metaphysical element. It is the appeal to a law that stands above feelings.

  You are already using this "obscure metaphysic" when you feel you *ought* to show up even when you don't feel like it. That tension you feel is the "metaphysic" struggling against the "physical."

  ### 6. The Final Worry: Moral Worth vs. Good Purpose
  **Your Question:** *I take it the passage is telling me that my Saturday mornings... are not morally worthy... I want to know whether the passage really entails that, or whether it is only making a point about what grounds the duty in the first place... If there is a tension between "no moral principle is based on any feeling" and the role that some kind of felt respect seems to play elsewhere in Kant's ethics, say so plainly.*

  **The Text:** *"For it is not a matter of indifference by what motives or means one is led to a good purpose (the obedience to duty)."*

  **The Hard Truth:**
  Yes, the passage entails exactly what you fear. For Kant, an action has **moral worth** (*moralischer Wert*) only if it is done *from duty*, not merely *in accordance with duty*.
  *   **In accordance with duty:** You visit because you love the residents. (This is "legal" goodness).
  *   **From duty:** You visit because you recognize it as a moral requirement, even if you found it boring or difficult. (This is "moral" goodness).

  Kant claims it is **not a matter of indifference** because the moral worth of the *agent* depends on the motive. If you act only from inclination, you are like a well-tuned clock: you tell the right time, but you aren't "virtuous" for doing so.

  **However, do not stop going.**
  Kant does not say you should suppress your feelings. He says feelings cannot be the *ground* of the obligation.
  *   **The Reconciliation:** Kant allows for **one** feeling: **Respect** (*Achtung*).
      *   In the *Critique of Practical Reason*, Kant explains that Respect is not a "pathological" feeling (one that comes from nature). It is a feeling *produced by reason*. It is the emotional sensation of recognizing the moral law.
      *   **How to reconcile:** You do not need to choose between affection and duty. You can have affection. But you must be willing to admit: *"If I did not like these people, I would still come, because it is the right thing to do."*
      *   If your affection vanishes tomorrow, and you still go, *then* your action has moral worth. If your affection vanishes and you stop, then your action was merely prudent or sentimental.

  **Is there a tension?**
  There is a tension in how it *feels* to be human, but not in Kant's logic. He admits that humans are not "holy wills" (like God); we have feelings. We are tempted to rely on them. The "tension" is the human condition. We want to be good because we love, but Kant says love is too fragile to be the foundation of the Good.

  **The Strongest Case for Accepting This:**
  Why accept such a harsh view? Because it protects the **dignity of the residents** and **your own integrity**.
  1.  **Residents:** If your care depends on your *feelings*, their care is contingent on your mood. If it depends on *duty*, their care is a right they are owed, regardless of whether you find them "likable" that day. Duty secures their dignity against your fluctuating emotions.
  2.  **You:** If you act only on feeling, you are a slave to your psychology. If you act on duty, you are free. Kant is offering you a way to be the author of your actions, rather than a vessel for biological impulses.

  ### Summary for your Saturday Mornings
  Kant is not telling you to stop loving the residents. He is telling you that love is not enough to make the action *moral* in the strictest sense.
  *   **Your feelings:** They are beautiful, helpful, and human. Keep them.
  *   **Your motive:** Check yourself. Ask, "If I got no joy from this, and no one praised me, and I felt only guilt at staying home, would I still go?"
  *   **The Answer:** If the answer is "Yes," then you are acting from duty, and your affection is merely a companion to your morality. If the answer is "No," then you are acting from inclination.

  Kant would say: *Continue your work.* But ground it in the recognition that these human beings deserve your presence by virtue of their humanity, not by virtue of your affection. That shift in perspective—from "I go because I like them" to "I go because they are persons and I am a moral agent"—is what transforms the action from "praiseworthy behavior" to "moral worth."

  It is uncomfortable because it demands more of you than just having a good heart. It demands a good will. But it does not demand that you stop caring.
