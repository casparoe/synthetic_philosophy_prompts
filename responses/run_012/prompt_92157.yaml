answer: |-
  **Mira:** Let's return to Nadia. She spent a week in the city, sat at tables where servers introduced themselves by name, and left no tip. She queued correctly but jaywalked constantly, despite the red hand signals. You say she committed no moral wrongs?

  **Jonas:** I say she committed no *moral* wrongs regarding the tipping. She violated a local norm, certainly. But norms are solutions to coordination problems. They tell us which side of the road to drive on or how to greet a stranger. Unless Nadia tacitly accepted the local social contract—which a short-term visitor rarely does—she isn't bound by the specific moral obligations that sustain those conventions. She owes universal duties: do not harm, do not exploit, do not disrespect. Not tipping, in itself, violates none of those.

  **Mira:** That separates convention from morality too sharply. Conventions aren't just arbitrary markers like driving on the left or right. They are load-bearing structures for practices of mutual accountability. In this city, the tipping convention sustains the livelihood of servers. When Nadia opts out, she free-rides on the expectations established by others. She wrongs the server specifically, not just the "system." That is a directed moral obligation.

  **Jonas:** But consider the structure itself. If the convention relies on customers subsidizing wages that employers should pay, isn't sustaining it complicity in injustice? If I refuse to tip, I might be highlighting an unjust wage structure rather than wronging the server. The obligation dissolves if the practice itself is corrupt.

  **Mira:** Even if the wage structure is unjust, the server within the practice has an urgent interest in the tip. They rely on it. To deny it because of a structural critique is to use the server as a means to a political end. However, I am willing to refine my view. I propose we use a **Load-bearing Convention Test**. A local convention generates a moral obligation for a visitor only if it is load-bearing for a practice that protects urgent interests or fair cooperation, *and* if compliance is not disproportionately costly.

  **Jonas:** That is a useful filter. It explains why queueing is obligatory—it protects fair cooperation and respect for time—but jaywalking is ambiguous. Here, the formal rule forbids it, but the local practice permits it when roads are clear. If the convention is actually "jaywalk when safe," then following the formal rule might disrupt the flow. But does it create a *directed* obligation? Who is Nadia wronging when she crosses against the light?

  **Mira:** Potentially drivers who rely on predictable pedestrian behavior. But let's stick to tipping. Under my Load-bearing Test, tipping passes. It protects urgent interests (income). Compliance is not disproportionately costly (it's money, but not ruinous). Therefore, Nadia had an obligation.

  **Jonas:** I accept the Test, but I want to add a modifier for visitors: the **Guest's Discount**. Visitors are entitled to a discount on the moral force of local conventions proportional to three factors: how hard the convention is for an outsider to know, how costly compliance is for them, and whether non-compliance would be legible as ignorance rather than refusal. Nadia is from a non-tipping culture. Ignorance is legible. Therefore, the directed obligation is mitigated. She owes a non-directed requirement to learn, but not a directed debt to the server she already served.

  **Mira:** I concede the Guest's Discount applies to the *severity* of the wrong, but not the existence of the obligation. If the interest is urgent enough, ignorance excuses the blame but not the duty to rectify. If Nadia learns on day three, she owes it for days four through seven. However, I will concede your point on the unjust wage structure. If the convention sustains an injustice, the Load-bearing Test might fail because the practice doesn't protect *fair* cooperation, only reliance within an unfair system. So, tipping is a borderline case.

  **Jonas:** That is a significant concession. You admit that a convention can be load-bearing for reliance but still fail to generate obligation if the underlying practice is unjust. That moves you closer to my coordination view: conventions bind only when they coordinate *fair* cooperation. But consider queueing. There is no unjust wage structure there. It is pure fair cooperation. Do you agree Nadia had a directed obligation to queue?

  **Mira:** Absolutely. Queueing is paradigmatic. It protects the urgent interest of not being bypassed unfairly. When Nadia queued, she honored a directed obligation to the people behind her. When she jaywalked, she entered a grey area. Here, the formal rule and the local practice come apart.

  **Jonas:** Precisely. If the local convention is "cross when clear," then the formal law is not the moral guide. If Nadia jaywalks safely, she harms no one. If she follows the law where no one else does, she might actually impede traffic. This shows conventions are about coordination, not inherent morality. The moral duty is simply not to harm. The convention is just the mechanism.

  **Mira:** But the mechanism *creates* the expectation of safety. If I expect pedestrians to wait, and you cross, you violate my reliance. Even if the law says one thing, if the practice is another, the practice is the moral reality. However, I accept your Guest's Discount here. If the practice is opaque—if sometimes people wait and sometimes they don't—the visitor gets a discount. Nadia might not have known the specific rhythm of crossing here.

  **Jonas:** So we agree that opacity reduces obligation. But we disagree on the source. You say the obligation arises from the convention itself becoming moral due to reliance. I say the obligation arises from the universal duty not to harm, with the convention merely defining what counts as harm in that context.

  **Mira:** That seems like a distinction without a difference, but let's press the **Directed vs. Non-directed** distinction. You argue Nadia owes only a non-directed requirement to be a good guest. I argue she owes a directed obligation to the server. If the Guest's Discount applies, does the obligation vanish or just become non-directed?

  **Jonas:** It becomes non-directed. She owes it to the community to learn, but she doesn't owe the specific server money for past service if she didn't know. You cannot hold someone accountable for a rule they could not reasonably know. That is the heart of the Guest's Discount. If ignorance is legible, the directed claim is voided.

  **Mira:** I refine my position then. The Load-bearing Convention Test establishes the *potential* for directed obligation. The Guest's Discount determines whether that obligation is *enforceable* or *blameworthy* in a specific instance. So, tipping is load-bearing, creating a pro tanto obligation. But Nadia's status as an ignorant visitor triggers the Discount, suspending the directed claim for the first few instances. However, once she knows, the Discount expires, and the directed obligation activates.

  **Jonas:** I can accept that refinement. It preserves the intuition that persistent ignorance becomes culpable. But I must insist on the unjust wage caveat. If the tipping system is exploitative, the Load-bearing Test fails regardless of the Guest's Discount. We cannot say there is an obligation to sustain exploitation, even if the server relies on it. In that case, the obligation is to the server's welfare, which might be better served by advocating for wage reform than by tipping.

  **Mira:** That is a difficult pill to swallow. If I withhold the tip, the server suffers *now*. The structural change comes *later*. But I concede that moral obligations cannot require complicity in injustice. So, if the convention is fundamentally unjust, it fails the "fair cooperation" clause of the Load-bearing Test. Queueing passes; tipping might fail.

  **Jonas:** And jaywalking?

  **Mira:** Jaywalking fails the Load-bearing Test if the practice is chaotic. If the convention is "cross whenever," it doesn't protect safety. If the convention is "cross when clear," it does. Nadia's obligation depends on which practice is actually load-bearing for safety.

  **Jonas:** Then we have moved closer. We agree that conventions are not morally inert, but they are not automatically binding either. They must pass the Load-bearing Test. And we agree that visitors are not fully bound until the Guest's Discount expires through familiarity.

  **Mira:** Yet we still differ on the nature of the bond. I maintain that when the Test is passed, the convention creates a new moral reality—a directed obligation that didn't exist before. You maintain it merely triggers pre-existing universal duties.

  **Jonas:** Which matters for how we hold Nadia accountable. If it's a directed obligation, the server can rightfully feel betrayed. If it's a universal duty, the server can only feel disappointed that Nadia wasn't more careful.

  **Mira:** Perhaps that is the remaining gap. Whether the convention *creates* the right or merely *specifies* it.

  **Jonas:** And whether the Guest's Discount voids the debt or merely excuses the debtor.

  **Mira:** Let us summarize where we stand.

  ***

  **Joint Statement of Agreement and Disagreement**

  **Agreements:**
  1.  **The Load-bearing Convention Test:** Both agree that not all local conventions generate moral obligations. A convention generates obligation only if it is load-bearing for a practice protecting urgent interests or fair cooperation, and compliance is not disproportionately costly.
  2.  **The Guest's Discount:** Both agree that visitors are entitled to a mitigation of moral force proportional to the difficulty of knowing the convention, the cost of compliance, and the legibility of their ignorance. However, this discount expires as familiarity grows.
  3.  **Unjust Structures:** Both agree that conventions sustaining manifest injustice (like exploitative wage structures) may fail the Load-bearing Test, negating the obligation even if reliance exists.
  4.  **Jaywalking Complexity:** Both agree that when formal rules and local practices diverge, the moral obligation follows the practice that actually protects safety and coordination, not necessarily the written law.

  **Unresolved Disagreements:**
  1.  **Source of Obligation:** Mira maintains that passing the Load-bearing Test creates a new, directed moral obligation specific to the convention. Jonas maintains that it merely triggers pre-existing universal duties (non-harm, fairness), making the obligation non-directed until explicit acceptance occurs.
  2.  **Effect of the Guest's Discount:** Mira argues the Discount mitigates blame but not the underlying duty to rectify (once known). Jonas argues the Discount voids the directed claim entirely for the period of ignorance.

  **Conceptual Question to be Settled:**
  To resolve the disagreement, we must settle the **Genesis Question**: Do social conventions merely *reveal* the contours of universal moral duties in specific contexts, or do they *generate* new moral relationships that did not exist prior to the convention's establishment? If the former, Jonas is correct; if the latter, Mira is correct.
