answer: |-
  Your diagnosis is astute, and your hypothesis carries considerable weight. It is indeed remarkable that the Hart–Devlin exchange, originating in the late 1950s and early 1960s, continues to frame contemporary discussions regarding the limits of the criminal law, from same-sex marriage to assisted dying. To offer a diagnosis rather than a verdict, we must dissect the impasse into its constituent layers: the conceptual, the empirical, the procedural, and the foundational.

  It is my contention that while the dispute is fundamentally a clash of political pictures, as you suggest, it is not entirely 'bedrock' in the Wittgensteinian sense. Rather, it is a composite disagreement wherein certain elements have been resolved by history, whilst the normative core remains intractable.

  **1. The Verbal and Conceptual Layer**
  There is, undeniably, a verbal dimension to the dispute, though it is more than mere semantics. Devlin and Hart are often speaking past one another regarding the definition of 'morality'. Devlin operates with a sociological conception: morality is whatever the 'man on the Clapham omnibus' feels deeply about. It is a positive fact of social psychology. Hart, drawing on the distinction between positive and critical morality, insists that the mere existence of a belief does not grant it rational validity.

  However, calling this merely a 'verbal dispute' underestimates the stakes. It is a conceptual disagreement about the *authority* of moral sentiments. For Devlin, the intensity of the feeling is itself a source of legitimacy; for Hart, intensity is irrelevant without rational justification or evidence of harm. This is not resolvable by dictionary definition, but it is clarifiable. We now understand better than they did that 'morality' in law often functions as a proxy for 'offence' or 'disgust', a distinction later refined by Joel Feinberg. Progress here consists in disentangling moral condemnation from the harm principle, though it does not settle the ultimate question of whether offence alone justifies prohibition.

  **2. The Empirical Layer: The Disintegration Thesis**
  This is the most resolvable component, and ironically, the one where the least philosophical progress has been acknowledged. Devlin's central claim—that society cannot survive without a shared morality on all points, and that changes in moral law lead to social disintegration—is an empirical hypothesis. Hart correctly identified that Devlin offered no evidence for this, treating it as an axiom.

  In the sixty years since, we have accumulated a vast dataset. Western liberal democracies have undergone profound moral pluralisation without collapsing into anarchy. The 'cement' of society appears to be more resilient, or perhaps of a different composition (constitutional patriotism, economic interdependence, human rights frameworks), than Devlin supposed. One could argue the empirical dispute has been settled in Hart's favour by the sheer survival of permissive societies. However, Devlin's defenders might retort that the erosion is slower than anticipated, or that social fragmentation (polarisation, loss of trust) is the delayed price we are now paying. Thus, while the 'apocalyptic' version of the disintegration thesis is empirically weak, a nuanced version regarding social cohesion remains a live sociological question.

  **3. The Burden of Proof**
  The disagreement about who bears the burden of proof is procedural, but it stems from the deeper clash of pictures. Hart places the burden on the state to justify interference (the presumption of liberty). Devlin places the burden on the innovator to demonstrate that change will not destroy the social fabric (the presumption of continuity).

  This is not a matter that can be argued away, as it reflects a prior commitment to either liberty or order. However, progress is possible here through the mechanism of proportionality. Modern human rights law, particularly under the European Convention, attempts to mediate this by requiring that any interference with private life must be 'necessary in a democratic society'. This does not solve the philosophical puzzle, but it creates a juridical framework where the burden is structured and evidence-based, rather than rhetorical.

  **4. The Foundational Clash: Pictures of Society**
  Here lies the core of your hypothesis, and it is largely correct. The dispute is ultimately between two competing ontologies of the political community.
  *   **Hart's Picture:** Society is an association of individuals. The law is a tool to facilitate coexistence by preventing harm. The 'good life' is a private pursuit.
  *   **Devlin's Picture:** Society is a community of ideas. The law is an expression of collective identity. The 'good life' is, in part, a public project protected by the state.

  To the extent that this is a clash of ultimate values, it is indeed bedrock. One cannot prove that liberty is superior to cohesion, or vice versa, without already presupposing a framework that privileges one over the other. If one views the individual as sovereign, Hart wins. If one views the community as an organic whole with interests distinct from its members, Devlin wins.

  **5. What Counts as Progress?**
  If the core is normative, should we expect no progress? I would argue that progress is not to be found in a knockout victory for either side, but in the refinement of the terms of engagement.

  *   **Distinction:** We have progressed by distinguishing between *legal moralism* (enforcing morality for its own sake) and the *offence principle* (preventing serious offence to others). This allows us to capture some of Devlin's intuition (that public decency matters) without accepting his full thesis.
  *   **Evidence:** As noted, sociological evidence has weakened the strong disintegration thesis. Progress involves demanding rigorous social science when 'social harm' is claimed, rather than accepting intuitive assertions.
  *   **Reformulated Question:** The question has shifted from 'May the law enforce morality?' to 'Under what conditions does moral legislation violate the equal respect owed to citizens?' This moves the debate from metaphysics to political legitimacy.

  **Conclusion**
  Your hypothesis that this is a clash between two pictures of society is the most robust explanation for the enduring impasse. Because these pictures rest on different foundational commitments regarding the relationship between the individual and the collective, the disagreement is, at its root, unreachable by argument alone.

  However, it is not *wholly* bedrock. The empirical claims surrounding social survival have been tested by history, and the conceptual tools available to us have sharpened. Progress is not the resolution of the debate, but the elevation of it: moving from Devlin's intuitive conservatism and Hart's abstract liberalism towards a more granular analysis of how law shapes moral culture, and how moral culture sustains the legitimacy of law. We may never agree on the ultimate picture, but we can agree on the standards of evidence and the protections required when those pictures collide.
