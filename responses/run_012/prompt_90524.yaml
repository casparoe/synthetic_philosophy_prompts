answer: |-
  The laptop screen cast a pale blue glow over the spreadsheets. Outside, the workshop was silent, the lathes cold.

  "Eight months," Elena said. She didn't look up from the numbers. "Then we're insolvent. We sell the tools, clear the debts, and go back to consulting. The money is gone, David. It's not coming back."

  David leaned back, the wood of the kitchen chair creaking. "You're treating the last four years as dead weight. That's the sunk cost fallacy, sure, but you're applying it to a decision you haven't properly described."

  "Don't do this," Elena said, finally meeting his eyes. "Don't dress up hesitation as philosophy. The textbook version is clear: honoring a sunk cost is always irrational. Only marginal utility matters. What happens next is the only thing that counts."

  "The textbook assumes the agent is isolated," David said. "It assumes the past is severed from the future. But here, the past constitutes the present value. You're framing the choice as 'lose more money versus stop losing.' I'm framing it as 'honor a commitment versus break trust.'"

  "That's branding," Elena shot back. "Is there a future where breaking trust pays more? If yes, do it. If no, then staying is justified by future utility, not past money. You're still smuggling the past in as a cause, but logically, it's only valid if it predicts revenue. If a reason from the past doesn't change the future, it's irrelevant. If it does change the future, it's just a prediction."

  "It's not a prediction. It's a commitment device." David leaned forward. "We sank everything. Savings, inheritance. The market sees that. They know we can't quit easily. That signals stability. Customers buy because they think we'll be here to honor the warranty in ten years. They buy *because* the money is gone and we stayed."

  Elena closed the laptop lid slightly. "So the asset is the trust. The money is still sunk. You're arguing that the *fact* we suffered matters, not the suffering itself. If I could generate that same trust without burning our savings—say, through insurance or a contract—would you take it?"

  "No," David said. "Because the cost *was* the commitment. You can't separate the signal from the sacrifice."

  "Then you've made the fallacy unfalsifiable," Elena said, her voice tightening. "Any reason I give to quit, you wrap in 'but the past.' If everything is connected to the past, nothing is sunk. You're immune to evidence. If I say 'we will lose money,' you say 'but we invested.' If I say 'customers might leave,' you say 'because we invested.' You're using the fallacy to shield yourself from the fact that the business model fails."

  "I'm saying your description of 'rationality' isn't neutral," David countered. "You treat the company as a vessel for profit. I treat profit as a vessel for the company. The project isn't the frames; it's the practice of building them. If we close, we aren't just stopping losses; we're admitting the practice was a mistake. The past investment validates the practice, not the profit."

  "The practice doesn't pay severance," Elena said. "You're asking me to gamble the last eight months on a metaphysical point. You want to burn our security to prove that the past matters."

  "I want to stop treating our lives as a spreadsheet error."

  "I'm treating them as lives that need security," Elena said, standing up. "You want to continue because you think the suffering buys you something. It doesn't. It buys nothing. The tools are metal. The frames are tubes. The money is gone."

  "If you sell the tools," David said, standing too, "you're selling the choice. You're deciding that the only value is what we can extract, not what we can make."

  "I'm deciding that we survive," Elena said. "I'm closing it, David. Tomorrow."

  "Then you're closing me out too."

  Elena paused at the door. She didn't turn around. "Then you're choosing to sink with the cost. Don't call that philosophy. Call it what it is."

  She walked out. David stood alone in the blue glow, the silence of the workshop pressing in against the glass.
