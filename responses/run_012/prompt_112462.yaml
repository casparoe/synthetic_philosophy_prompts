prompt: |-
  My friend and I got into it last night for like three hours about whether a sandcastle is one thing or just a billion grains hanging out next to each other, and it spiralled into when, if ever, some things make up a further thing. I want to build her a proper decision tree (not a list of names) that starts from "do you think there are any composite objects at all?" and lands each path on a named position, so we can see exactly where we split. Every branch node should be a concrete case she could answer without knowing what view it leads to: does a heap of sand count, does a glued-together sculpture count and does the glue matter or is contact enough, do a cloud and a river and a waterfall count, does a dead cat count if a live cat does, what about a crowd, a traffic jam, an economy, a coral reef, an ant colony, and does anything change if the parts get swapped out one at a time. Leaves should include at least: everything composes, nothing composes, only living things compose, things compose when they're in contact / fastened / cohesive, composition happens but for brute arbitrary reasons, composition just is identity so the question dissolves, the answer is vague so there's no fact of the matter, and it's all a verbal dispute so we aren't really disagreeing. Then tell me which branches my tree can't actually separate (which positions get merged), and which answer-combinations nobody occupies, with a guess as to whether nobody's there because the view is incoherent, ugly, or just unexplored. Couple of my cases are probably weird enough that they don't slot onto the usual menu, so flag where the tree breaks instead of forcing them. Its for her, not a journal, so keep it readable.
