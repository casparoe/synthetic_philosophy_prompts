answer: |-
  Here is a decision tree designed to map your debate. It's built to be read aloud: you ask the question, follow the "Yes" or "No," and see where you land.

  After the tree, I've included the "Debug Report" you asked for: where the tree merges distinct views, where the empty seats are, and where the logic snaps.

  ***

  # The "What Counts as a Thing?" Decision Tree

  **START:** **Do you think there are *any* composite objects at all?**
  *(Is a sandcastle one thing, or just grains? Is a cat one thing, or just cells?)*
  *   **NO:** → **NIHILISM** (Nothing composes. There are only simple particles arranged "cat-wise" or "castle-wise," but no actual cats or castles.)
  *   **YES:** → Go to Question 1.

  **Q1: THE UNIVERSALITY TEST**
  **Do *any* random collection of things make up an object?**
  *(Think of the Moon and a specific coin in your pocket right now. Do those two specific things, and nothing else, form a single object called "Moon-Coin"?)*
  *   **YES:** → **UNIVERSALISM** (Everything composes. There is an object made of your nose and the Eiffel Tower. Composition is unrestricted.)
  *   **NO:** → Go to Question 2.

  **Q2: THE LIFE TEST**
  **Is being alive the *only* thing that makes parts into a whole?**
  *(Does a live cat count as one object, but a dead cat (or a stuffed toy cat) immediately stop being one object and become just a heap of parts?)*
  *   **YES:** → **ORGANICISM** (Only living things compose. Artifacts and heaps are just fictions; organisms are real.)
  *   **NO:** → Go to Question 3.

  **Q3: THE CONNECTION TEST**
  **Does physical contact or fastening determine composition?**
  *(Think of a sculpture glued together vs. a heap of sand. Does the glue make it "one thing" while the sand is "many things"? Is contact required, or is proximity enough?)*
  *   **YES:** → **CONTACT / FASTENING VIEW** (Things compose when they touch, stick, or are physically cohesive. A cloud might not count, but a brick wall does.)
  *   **NO:** → Go to Question 4.

  **Q4: THE VAGUENESS TEST**
  **Is there a sharp, factual line between "object" and "not object"?**
  *(Think of a cloud, a river, or a waterfall. As water droplets drift away, is there a specific millisecond it stops being a "river," or is the boundary fuzzy?)*
  *   **NO (It's fuzzy):** → **VAGUENESS / INDETERMINACY** (Composition happens, but there is no fact of the matter exactly when. Reality itself is vague.)
  *   **YES (There's a line):** → Go to Question 5.

  **Q5: THE IDENTITY TEST**
  **Is the "whole" actually just the parts described collectively?**
  *(If you have the parts, do you *automatically* have the object? Is saying "there is a table" just a shorthand for "there are legs and a top arranged table-wise"?)*
  *   **YES:** → **COMPOSITION AS IDENTITY** (The whole *is* the parts. They are identical. The question dissolves because there aren't two things, just one thing described two ways.)
  *   **NO:** → Go to Question 6.

  **Q6: THE BRUTE FORCE TEST**
  **Is there a deep reason *why* some things compose and others don't?**
  *(Think of an ant colony or a coral reef. They aren't glued, they aren't single organisms, but they act like units. Is there a rule explaining why they count, or is it just a brute fact that they do?)*
  *   **NO (No reason, just facts):** → **BRUTALISM** (Composition happens, but there is no general principle. It's just a brute fact that *these* parts compose and *those* don't.)
  *   **YES (It depends on how we speak):** → Go to Question 7.

  **Q7: THE VERBAL TEST**
  **Are we disagreeing about the world, or just the word "object"?**
  *(If we agree on all the physics (where the particles are), does it matter if we call it a "traffic jam" or "cars close together"? Is the dispute purely linguistic?)*
  *   **YES:** → **VERBAL DISPUTE / ONTOLOGICAL DEFLATIONISM** (We agree on the reality; we just draw the concept "object" differently. Neither is wrong.)
  *   **NO:** → **RESTRICTIVISM (UNNAMED)** (There is a fact of the matter, it's not vague, it's not identity, and it's not just words, but you don't have a simple rule like "contact" or "life." You believe in a hidden metaphysical principle.)

  ***

  # The Debug Report

  Here is the meta-analysis of the tree. This is where you tell her why the map doesn't perfectly match the territory.

  ### 1. Merged Positions (Where the tree can't separate views)
  *   **Contact vs. Fastening vs. Cohesion:** In Q3, I grouped these together. In reality, a philosopher might argue that *contact* isn't enough (two touching stones aren't one object) but *fastening* is (glue makes them one). The tree lumps them because for a 3-hour debate, the distinction is often splitting hairs. If she says "Contact yes, Glue no," the tree breaks.
  *   **Brutalism vs. Restricted Realism:** In Q6/Q7, "Brutalism" (there is no explanation) and "Hidden Principle Restrictivism" (there is an explanation, but it's complex) often look identical in practice. Both say "Some things compose, not others, and 'contact' isn't the full rule." The tree forces a choice between "It's brute" and "It's verbal," leaving out the person who thinks there *is* a deep reason we just haven't found yet.
  *   **Vagueness vs. Verbal Dispute:** These often bleed together. If you say "It's vague whether a cloud is an object," you often end up saying "It depends on how we define 'object'." The tree separates them (one is about reality, one is about language), but many philosophers hold both.

  ### 2. The Empty Seats (Answer combinations nobody occupies)
  *   **The "Glue Only" Nihilist:** Someone who says "Living things don't count, but glued sculptures do." This is logically possible but metaphysically ugly. Why would biology be less real than epoxy? Nobody sits here because it violates our intuition that life is *more* unified than artifacts, not less.
  *   **The "Social Object" Exclusivist:** Someone who says "Crowds and economies are real objects, but rocks and tables are not." This view exists in sociology, but rarely in fundamental metaphysics. The tree forces social objects into "Brutalism" or "Verbal Dispute," but there's a gap for a view that says *functional integration* is the only thing that matters (a traffic jam is more of an object than a boulder).
  *   **The "Dead Cat" Universalist:** Someone who says "The Moon and a Coin make an object, but a dead cat does not." This is incoherent. If *any* arbitrary things compose (Universalism), a dead cat's parts definitely compose. The tree prevents this path (Q1 comes before Q2), which is good, because this view is logically impossible.

  ### 3. Where the Tree Breaks (The Weird Cases)
  *   **The Ship of Theseus (Swapping Parts):** You asked to include "does anything change if the parts get swapped out." I left this out of the main branches because it tests **Persistence** (time), not **Composition** (space).
      *   *The Break:* You can be a **Universalist** (all things compose) but believe objects *vanish* when you swap a part (no persistence). Or you can be an **Organicist** but believe organisms survive cell replacement.
      *   *Fix:* If you want to test this, add a **Q8** after any "Yes" leaf: *"If I swap every part over ten years, is it the same object?"* If Yes → **Endurantism/Identity**. If No → **Stage Theory/Perdurantism**. This cuts across the whole tree.
  *   **Superorganisms (Ant Colonies/Coral Reefs):** These cases break Q2 (Life). Is an ant colony "alive"? Biologically, sort of. Metaphysically, it's a group of organisms.
      *   *The Break:* If she says "Ant colonies count as objects because they act like one animal," she might slide out of **Organicism** (which usually means *single* organisms) and into **Functionalism**. The tree forces her into **Brutalism** or **Contact**, which feels wrong.
  *   **Composition as Identity (Q5):** This is the hardest node for a layperson. If the whole *is* the parts, does composition "happen"? Technically, no. It's a "dissolution" view. If she answers "Yes" here, she might actually belong in **Nihilism** (nothing *composes*, because there is no composition relation, just identity). The tree treats it as a "Yes" to objects, which is a slight simplification.

  ### 4. A Note on the "Verbal Dispute" Leaf
  This is the "Escape Hatch" leaf. If you both land here, the debate is over: you agree on the physics, you just disagree on the dictionary definition of "object."
  *   **Warning:** Many philosophers hate this answer. They think it's a cop-out. If she lands here, she might be refusing to play the metaphysical game rather than answering it.

  ### How to use this
  Print it out. Sit down. Start at **START**. If you hit a node where she says, "Well, it depends on what you mean by..." stop. That usually means you've hit the **Verbal Dispute** leaf early, or you need to define the term (like "contact") before moving on.

  Good luck. May your sandcastles be ontologically secure.
