      *   **Task:** Create a procedure (a sequence of questions in fixed order, continuous prose) to be read aloud in the panel room.
      *   **Constraints:**
          *   Continuous prose (no headings, no numbered/bulleted lists, no bold, no tables).
          *   Must begin with defining the alleged event *before* looking at testimonies (addressing the friend's critique about post-hoc specification).
          *   Must include a rule for doctor disagreement on diagnosis.
          *   Must address testimony independence, motive, and weight (1st hand vs. 3rd hand).
          *   Must force a choice between revising medical understanding vs. revising witness credibility (no having both).
          *   Must include a stopping rule (close, hold, or pass to judgment/publication impact).
          *   Must be usable without statistics (qualitative proxies for numbers).
