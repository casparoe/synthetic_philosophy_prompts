answer: |-
  I write this to you knowing that no procedure can fully answer the friend who says your work is theatre, because she is right that any rule you adopt is itself a choice about what kind of theatre you wish to perform, but she is wrong that a maxim is a substitute for a method. You need a tool that forces the panel to be honest about where their certainty ends and their judgment begins, so here is the sequence you asked for, written to be read aloud at the start of every session. Begin by placing a blank card on the table and asking the panel to write down precisely what alleged event is being claimed before anyone opens the folder or hears the names of the witnesses, specifying the physiological change, the time window in which it occurred, and the location, for if you do not fix the target before you look at the arrows you will always believe the archer hit the bullseye. Once the event is defined, ask the general practitioner and the neurologist to state the base rate of such a recovery in untreated populations using only qualitative terms like common, rare, or virtually unknown, and if they disagree on the initial diagnosis or the impossibility of the recovery, the file is immediately held open and cannot proceed until medical consensus is reached or the dissent is recorded as a permanent veto, because a miracle cannot be certified on a foundation of diagnostic ambiguity. Then turn to the testimony and count only independent voices, treating a dozen repetitions of the same story heard from a single source as one voice rather than twelve, and ask for each witness what they gain by lying and what they lose by telling the truth, weighing a single first-hand account of the event itself as worth more than any number of third-hand reports about the aftermath. Now force the choice that Hume obscured by asking the panel to state explicitly whether they are willing to revise their understanding of what is medically possible or whether they are willing to revise their understanding of what the witnesses did, for you cannot have both a law of nature that holds firm and witnesses who are entirely free of error or collusion. Finally apply the stopping rule: if the alleged event did not occur within the temporal and spatial bounds of the pilgrimage, close the file without further discussion; if the testimony is dependent or the medical evidence is ambiguous, hold the file open for further evidence; and if the evidence is strong enough that a natural explanation feels more miraculous than the claim, stop pretending the question is factual and hand it to the panel as a judgment about what you ought to publish, given what publication will do to the people involved, marking clearly that you have moved from verifying facts to weighing pastoral consequences.

  When you run this procedure on the woman with the spinal condition, you will find that the event is narrowly defined as immediate relief at the shrine, which satisfies the first step, and the four witnesses arrived separately, which satisfies the independence requirement of the second step, while the before-and-after scans provide the medical consensus needed to bypass the veto rule. Here the procedure will force you to the third step where you must choose between believing the scans and witnesses over current medical understanding, and because the evidence is robust, you will likely reach the final stage where you stop pretending this is purely factual and decide instead whether certifying this recovery will help or harm the faithful who will hear of it, meaning the file moves forward not as a proven fact of nature but as a certified sign worthy of publication. When you run it on the boy with the febrile illness, the procedure will close the file at the second step, because although there are nine witnesses, they are all members of a prayer circle who heard the account from the mother, making them dependent voices that count as one, and without imaging there is no medical consensus to override the lack of independent testimony, so the file is closed not because the boy did not recover but because the evidence provided cannot distinguish a miracle from a rumour. When you run it on the man with the tumour, the procedure will close the file at the very first step, because although the shrinking is real and unaccounted for, it happened over months at home after he left the shrine, so there is no event at the shrine to report, and you cannot certify a pilgrimage miracle where there was no moment of pilgrimage intervention.

  You asked me to tell you whether the procedure has anything to say about the mother of the boy whose file is closed, and the honest answer is that the procedure treats her pain as a consequence rather than a variable, which is necessary for the integrity of the process but cold for the people living it. The procedure protects the order from certifying rumours, but it offers no comfort to a community that will read the closure as a verdict on their faith, and while you might explain that you are judging the evidence rather than the prayer, they will hear that their experience was not real enough for your forms. This is where the procedure admits its limit, for it is built to filter noise, not to shepherd grief, and it will do what it was built to do by closing the file even when you know the closure will feel like a rejection of their devotion. Finally, you must know where this procedure will misfire and where it is value judgments wearing the costume of method. It will misfire in cases where medical science simply does not yet know the base rate of a condition, forcing you to label something impossible when it is merely unexplained, and it will get wrong the cases where a slow recovery begins at the shrine but manifests later, like the man with the tumour, because your requirement for a specific temporal event may exclude genuine correlations that do not fit the narrow definition of a instant cure. The step where you define the event narrowly before reading the testimony is itself a value judgment that favors skepticism over generosity, and the step where you decide to publish based on pastoral impact admits that the final decision is not about truth but about utility. You cannot eliminate the human element from a process that reviews human suffering, and while this procedure will stop you from lying to yourselves about the evidence, it cannot stop you from having to choose which truths are worth the cost of telling them.
