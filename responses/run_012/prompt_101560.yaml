answer: |-
  **PREP SHEET: DECISION THEORY READING GROUP**
  **TO:** Retired Geologist / Guest Speaker
  **FROM:** [Your Name/Colleague]
  **RE:** Q&A Strategy for "Death in Damascus & Policy Ranking"

  Look, you've got a solid intuition here. You're essentially arguing for what the cognoscenti call **Functional Decision Theory (FDT)** or a **Policy-Based CDT**, using the instability of deliberation as your wedge. The geologists' eye for systems serves you well here: you see the feedback loop they're trying to ignore.

  However, the room is hostile. The CDTers think they solved Damascus thirty years ago using "ratificationism," and the Statistician thinks you're re-inventing Bayesian conditioning with extra steps.

  Here is your battle plan.

  ***

  ### PART 1: STRATEGIC CONCESSIONS (Buy Goodwill)
  *Do not fight on these hills. Concede them immediately to show you understand the landscape.*

  1.  **Concede that CDT works for "ordinary" cases.**
      *   *Say:* "I'm not arguing CDT is broken for standard causal chains. If I push a rock, it rolls. CDT handles that fine. My claim is specifically about environments with *predictors* that model your decision process."
      *   *Why:* Prevents them from painting you as an irrationalist who thinks actions don't have causes.
  2.  **Concede the metaphysical weirdness of "Policies."**
      *   *Say:* "I know 'ranking policies' sounds like I'm saying the future causes the past. I'm not. I'm saying the *algorithm* you run is the causal unit, not the specific output of that algorithm on Tuesday at 2 PM."
      *   *Why:* Disarms the charge of magic or backward causation.

  ***

  ### PART 2: THE OBJECTIONS (Sorted by Danger)

  #### 1. The "Tickle Defense" (High Danger)
  **Who:** The Lead CDTer.
  **The Gist:** They will argue that you have introspective access to your own decision. If you decide to flee, you know *why*. Death predicts based on the *causes* of your decision, not the decision itself. If there is no common cause linking your decision to Death's location (other than the prediction), CDT says you should flee.
  **The Question:** "If Death predicts based on your psychological state *prior* to the decision, isn't your actual choice causally independent? Why shouldn't I just flee and take my chances?"

  **Your Reply (2 mins):**
  "Because that assumes I can decouple my choice from my psychology. I can't. If I'm the sort of agent who reasons 'My choice doesn't cause Death, so I'll flee,' then Death—who has my source code—knows I'm that sort of agent. He's in Aleppo.
  The 'Tickle Defense' assumes I can introspect my way out of my own algorithm. But in this puzzle, my reasoning process *is* the common cause. If I reason the CDT way, I die. If I reason the Policy way, I live. So the CDT reasoning is self-defeating. It's not about what causes Death; it's about what my reasoning *signals* to a perfect predictor."

  **Candid Note on Weakness:**
  *   **Where you're bluffing:** You're glossing over the fact that standard CDT denies your reasoning *causes* the prediction. They say the prediction is already in the past.
  *   **The Risk:** They will press you on *how* your current reasoning changes a past prediction. You need to hold the line that you are selecting a *type* of agent, not just an act.

  #### 2. The "Ratificationism" Counter (High Danger)
  **Who:** The Senior CDTer (likely the group organizer).
  **The Gist:** This is the specific technical solution CDTers developed for Death in Damascus. An act is rational only if, *assuming you do it*, it remains the best choice. In Damascus, neither staying nor fleeing is "ratifiable." Therefore, the theory prescribes a mixed strategy (randomize).
  **The Question:** "Horgan and others solved this with ratificationism. The agent realizes neither act is stable, so they randomize 50/50. Death can't predict a coin flip. Problem solved. Why do we need 'policies'?"

  **Your Reply (2 mins):**
  "Randomizing is a surrender of rationality. It says, 'To win, I must stop reasoning.' If the price of survival is lobotomizing my decision process into a coin toss, then CDT has failed as a *normative* theory of rationality.
  My point is that a policy-based approach doesn't need to randomize. It says, 'I am an agent who stays in Damascus.' Death predicts that. I stay. I live. No coin flip needed. Why should a theory of rational choice require me to act randomly to succeed?"

  **Candid Note on Weakness:**
  *   **Where you're bluffing:** CDTers will argue that randomizing *is* the rational policy when information is symmetric.
  *   **The Risk:** You need to make sure you don't sound like you're advocating for stubbornness. Emphasize that the *policy* is chosen for its outcome, not out of spite.

  #### 3. The Statistician's "Sloppy Conditioning" (Medium Danger)
  **Who:** The Stats Department Guest.
  **The Gist:** They think this is all just $P(Death | Flee)$ vs $P(Death | Stay)$. They'll argue you're conditioning on the decision variable, which is forbidden in causal models.
  **The Question:** "Isn't this just a failure to properly separate the error terms in your regression? If you condition on the decision, you're doing Evidential Decision Theory, not Causal. You're just smuggling EDT in under a different name."

  **Your Reply (2 mins):**
  "I'm not smuggling EDT. EDT says 'Choose the act that gives the best news.' I'm saying 'Choose the algorithm that produces the best outcome.'
  If I treat my decision as a random variable, yes, I get paradoxes. But I'm not a random variable. I'm a deterministic system (mostly). The Statistician's model works for sampling populations, but it fails for single agents facing predictors who model the agent's own math. The probability isn't sloppy; the *unit of analysis* is wrong."

  **Candid Note on Weakness:**
  *   **Where you're bluffing:** This is technically the hardest hit. FDT *does* look a lot like EDT in many cases.
  *   **The Risk:** Don't get bogged down in math. Keep it on the "unit of analysis" (Act vs. Algorithm). That's your geologist strength: scale matters.

  #### 4. The "Metaphysics of Policy" (Medium Danger)
  **Who:** Any Metaphysician in the room.
  **The Gist:** How does a "policy" exist? Only acts exist in spacetime.
  **The Question:** "Policies don't kill people. Bullets kill people. Choices kill people. How does a 'policy' exert causal force?"

  **Your Reply (2 mins):**
  "Think of it like a fault line. The earthquake is the act. The stress accumulation is the policy. You can't have the quake without the stress profile.
  Death isn't reacting to my foot stepping on the plane; he's reacting to the stress profile of my decision-making. If I want to change where Death is, I can't just move my foot; I have to change the stress profile. That's what ranking policies means."

  **Candid Note on Weakness:**
  *   **Where you're bluffing:** It's an analogy, not a proof.
  *   **The Risk:** It might sound too deterministic. Ensure you emphasize that *you* are the one selecting the policy.

  ***

  ### PART 3: THE "MUST WIN" EXCHANGE
  **The Topic:** **Deliberational Instability.**
  **Why:** This is your strongest ground. It's where your intuition about "going round in circles" meets formal decision theory (Skyrms/Eells).
  **The Scenario:** They argue that rational agents reach an equilibrium. You argue Damascus *has* no equilibrium for act-based agents.
  **Your Line:** "If a decision theory makes me oscillate forever without choosing, it's broken. A theory that tells me 'Stay is better if I think Stay, but Flee is better if I think Flee' isn't a guide to action. It's a description of a glitch. Policy ranking resolves the glitch by stepping outside the loop."
  **Goal:** If you lose this, you look like you're describing confusion rather than a structural problem.

  ***

  ### PART 4: THE NIGHTMARE QUESTION
  *This is the one you're hoping they don't ask, because it cuts to the bone of your "Policy" solution.*

  **The Question:**
  "If you choose a policy because it leads to the best outcome, aren't you just maximizing expected utility again? How is 'Policy-Based CDT' anything other than Causal Decision Theory with an extra step that says 'pretend your choice determines the predictor'? Isn't that just magic?"

  **Why it hurts:** It accuses you of "wishful thinking"—believing your choice controls the past because it's convenient.
  **How to Parry:** "It's not magic, it's logical correlation. Two calculators running the same math will get the same answer. One isn't causing the other; they share the same logical truth. I'm asking decision theory to respect logical truth, not just physical push-pull."

  ***

  ### FINAL ADVICE
  *   **Don't apologize for being a geologist.** Use it. You study deep time and systems. They study logic puzzles. Remind them that in the real world (basins, climate, evolution), feedback loops dominate. Newcomb and Death aren't puzzles; they're simplified models of a world full of predictors (markets, predators, partners).
  *   **Watch the Statistician.** If he starts writing formulas on the board, stop him. Ask him to translate the formula into a physical claim about the agent.
  *   **Stand Firm on Instability.** That's your killer instinct. The fact that CDT makes the agent spin in circles is a bug, not a feature.

  Good luck. Break a leg. (But not in Damascus.)
