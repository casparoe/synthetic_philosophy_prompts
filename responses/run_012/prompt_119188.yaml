prompt: |-
  I chair the grantmaking committee of the Halloran Foundation, a small family foundation that distributes about $6 million a year, mostly to well-evidenced global health charities. On our standard cost-effectiveness model those grants buy roughly 4,000 units of welfare per $1 million — a unit being our internal stand-in for a severity-weighted life-year — and the trustees have grown used to treating that figure as the benchmark against which every other application is judged. Our next meeting is a week from Thursday, and we must dispose of one application that has split the committee: a five-year, $3 million proposal from a two-university consortium to build and test an early-warning and mitigation system for a class of cascading infrastructure failures which, on the applicants' model, would otherwise cost something on the order of 10^14 units of welfare, essentially all of it falling on people who do not yet exist. The applicants put the probability that their system proves decisive at one in a million; our staff analyst, who spent three weeks inside their model, puts it at one in a billion. The figure I cannot get out of my head is that both numbers are preposterous by our usual lights: the analyst's estimate alone implies something like eight times our benchmark per dollar, and the applicants' implies several thousand times. The disagreement that has consumed three meetings turns out not to move the recommendation at all under plain expected-value reasoning, and it is precisely that which has unsettled everyone.

  Two trustees have drawn opposite conclusions. One wants to decline, on the ground that no procedure which lets a one-in-a-billion chance dictate half of our annual budget can be a procedure we should adopt, and she has proposed amending the charter to compute expected value with every probability replaced by its square — a tempered rule under which this application would score under one percent of our benchmark and be dismissed out of hand. The other trustee insists this is probability neglect dressed up as prudence: we accept one-in-a-million risks with our own money and our own lives without a second thought, and if we had refused every intervention whose benefits accrued to people who did not yet exist, we would never have funded the vaccination work that is now the pride of the foundation. Neither has addressed the wrinkle that bothers me most: the applicants' own risk assessment concedes a probability of about one in a hundred thousand that the technology they develop is misused, and the harm they describe in that case is of the same order as the catastrophe they are trying to prevent — a risk they do not weigh anywhere in their headline number.

  Please draft the written opinion I will circulate before the vote. It should land on a recommendation — fund in full, fund a scoping phase, decline, or decline with an invitation to resubmit — with a time frame that fits our meeting and the applicants' funding window, which closes at the end of next month, and with conditions concrete enough that the committee could adopt them by voice vote. The tempered rule has to be taken seriously enough that we say what is wrong with it, or concede that it should be adopted; the trustee who proposed it is not a crank and will not be fobbed off with platitudes about prudence. And be honest about what the losing side gets right, including what we would be saying to the trustee who fears we have just set a precedent by which any confident applicant with a spreadsheet can annex the endowment. Argue it in our own terms rather than by appeal to outside authority, keep it under two pages, and remember that the CFO wants any multi-year commitment booked in this fiscal year.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Grantmaking Committee of the Halloran Foundation.
      *   **Context:** Small family foundation, $6M/year budget. Standard benchmark: 4,000 welfare units/$1M (severity-weighted life-years).
      *   **The Proposal:** $3M over 5 years (2 universities). Early-warning/mitigation for cascading infrastructure failures.
      *   **The Stakes:** Prevents $10^{14}$ welfare units of loss (mostly future people).
      *   **The Probabilities:** Applicants say 1 in $10^6$ (success). Analyst says 1 in $10^9$ (success).
      *   **The EV Calculation:** Even at 1 in $10^9$, EV is ~8x benchmark. At 1 in $10^6$, it's thousands of times benchmark.
      *   **The Conflict:** Committee split.
          *   Trustee A (Decline): Proposes squaring probabilities (tempered rule) to avoid letting tiny probabilities dictate budget. Under this rule, proposal fails (<1% benchmark).
          *   Trustee B (Fund): Argues probability neglect. We take risks personally; we funded vaccines for future people before.
      *   **The Chair's Concern (The "Wrinkle"):** Misuse risk. 1 in $10^5$ chance technology is misused, causing harm equal to the catastrophe prevented. Applicants didn't net this out.
      *   **Constraints:**
          *   Recommendation required (Fund, Scope, Decline, Decline/Resubmit).
          *   Timeline: Meeting next week Thursday. Funding window closes end of next month.
          *   Conditions: Concrete enough for voice vote.
          *   Tone: Serious engagement with the "tempered rule" (Trustee A is not a crank). Honest about what the losing side gets right (Trustee B's concern about precedent/spreadsheet annexation).
          *   Style: Internal foundation terms, no outside authority appeals.
          *   Length: Under two pages.
          *   Financial: CFO needs multi-year commitment booked this fiscal year.

  2.  **Determine the Recommendation:**
      *   *Full Fund ($3M/5yr):* Too risky given the misuse risk (1 in $10^5$ vs 1 in $10^9$ success). The net EV might actually be negative if misuse is catastrophic. Also, Trustee A's concern about budget dominance is valid.
      *   *Decline:* Wastes the potential upside. The EV (even analyst's) is technically above benchmark. Dismisses the "future people" argument which has historical precedent (vaccines).
      *   *Decline/Resubmit:* Timeline is tight (end of next month). Might lose the opportunity.
      *   *Fund a Scoping Phase:* This seems the most prudent. It addresses Trustee A's fear of committing half the budget on a long shot. It addresses the Chair's concern about the misuse risk (need to analyze mitigation of misuse). It keeps the door open for Trustee B's EV argument. It fits the CFO's requirement (book the commitment now).
      *   *Decision:* **Fund a Scoping Phase.** Let's say $150k-$200k for 6 months to refine the risk model (specifically the misuse vector) and demonstrate feasibility. This kicks the can on the big EV bet but respects the math.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose and the recommendation clearly.
      *   **Addressing the EV Paradox:** Acknowledge that under plain EV, both probability estimates clear the bar. Acknowledge Trustee B is mathematically right *if* the model holds.
      *   **Addressing the Tempered Rule (Trustee A):** This is crucial. Cannot just dismiss it. Why is squaring probabilities wrong *in principle* for us? Because it arbitrarily discounts low-probability high-impact events which are exactly what we sometimes need to catch (tail risks). However, acknowledge the *spirit* of the rule: budget concentration risk. We can't let one tail risk eat the whole budget.
      *   **Addressing the Misuse Risk (The Chair's Wrinkle):** This is the dealbreaker for full funding. If success = $10^{14}$ gain and misuse = $10^{14}$ loss, and misuse is 10,000x more likely than success (1e-5 vs 1e-9), the net EV is likely negative. We cannot fund a net-negative project.
      *   **Addressing the Precedent (Trustee B's worry):** Acknowledge that funding this sets a precedent. We need to guard against "confident applicants with spreadsheets." The guardrail is the *net* risk assessment, not just the upside.
      *   **The Recommendation:** Scoping Grant.
      *   **Conditions:** Specific milestones regarding the misuse model.
      *   **Financials:** Book the full potential liability or just the scoping? CFO wants multi-year booked. Okay, we can book the *option* or the full amount contingent on milestones. Better to book the full $3M as a contingent liability to satisfy CFO, but disburse only the scoping now. Actually, standard accounting usually books the committed amount. Let's recommend committing the $3M *contingent* on milestones, but disbursing $200k now. This satisfies CFO (commitment made) and risk management (cash out limited).
      *   **Timeline:** Meeting next Thursday. Window closes end of month. Scoping fits.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is squaring probabilities *really* wrong?
      *   *Correction:* In foundation terms, it's an ad-hoc heuristic. It lacks theoretical grounding in our welfare metric. If a welfare unit is a welfare unit, discounting it based on probability magnitude double-counts uncertainty. *However*, the concern about "budget dominance" is valid. We should address that via portfolio theory (concentration limits) rather than distorting the EV math.
      *   *Critique:* The misuse risk.
      *   *Correction:* The prompt says harm is "of the same order." If P(misuse) = 1e-5 and P(success) = 1e-9, the expected *harm* vastly outweighs expected *benefit*. This makes the project net negative in expectation. This is the strongest argument for not funding the full amount immediately.
      *   *Tone Check:* Ensure Trustee A feels heard. The "tempered rule" is a proxy for risk aversion regarding existential bets. We should adopt a *concentration limit* instead of a math distortion.
      *   *Tone Check:* Ensure Trustee B feels heard. We are not rejecting the long-term/future-people thesis. We are rejecting the *current risk assessment*.

  5.  **Finalizing the Recommendation:**
      *   **Action:** Fund a 6-month Scoping Phase ($250,000).
      *   **Condition:** Consortium must produce a revised risk model that explicitly nets misuse probability against mitigation efficacy, reviewed by an independent third party (not just our analyst).
      *   **Commitment:** The remaining $2.75M is reserved but contingent on passing the scoping milestones. This allows CFO to book the commitment.
      *   **Rationale:** It resolves the "spreadsheet annexation" fear by demanding better data before full deployment. It respects the EV math by not closing the door. It addresses the misuse risk by making it the primary deliverable of the scoping phase.

  6.  **Drafting the Content (incorporating constraints):**
      *   Keep it under 2 pages (approx. 800-1000 words).
      *   Use foundation terminology (welfare units, benchmark, charter).
      *   No outside appeals (no "Pascal's Mugging" references, keep it internal).

  7.  **Review against specific prompt requirements:**
      *   *Recommendation:* Fund scoping phase.
      *   *Time frame:* Fits meeting (next Thursday) and window (end of month).
      *   *Conditions:* Concrete for voice vote.
      *   *Tempered Rule:* Addressed seriously (rejected as math, accepted as risk concentration concern).
      *   *Losing Side:* Acknowledge Trustee B's point on precedent/future people.
      *   *CFO:* Multi-year commitment booked.
      *   *Chair's Wrinkle:* Misuse risk central to the decision.

  8.  **Final Polish:** Check tone. Needs to be decisive but collegial. (Self-correction: Ensure the distinction between "booking the commitment" and "disbursing funds" is clear for the CFO).

  *(Self-Correction on the "Tempered Rule"):* I need to be careful not to sound like I'm lecturing the trustee. The argument should be that squaring probabilities breaks the consistency of our welfare metric, but we can achieve her goal (preventing budget capture) through grant concentration caps.

  *(Self-Correction on Misuse Risk):* The prompt says misuse harm is "same order" as catastrophe prevented. P(misuse) = 1e-5. P(success) = 1e-9 (analyst) or 1e-6 (applicant).
      *   Applicant EV: (1e-6 * Gain) - (1e-5 * Loss). Since Gain ~ Loss, Net is negative.
      *   Analyst EV: (1e-9 * Gain) - (1e-5 * Loss). Net is massively negative.
      *   *Conclusion:* The project is currently net-negative in expectation. This is the killer argument. We cannot fund a net-negative project regardless of the "tempered rule."

      *Wait, re-reading prompt:* "a risk they do not weigh anywhere in their headline number."
      *Okay, so the headline number is positive, but the *net* number (including misuse) is likely negative.* This confirms the Scoping recommendation. We need them to fix the model or mitigate the misuse risk before we write the big check.

  9.  **Finalizing Text:** (Proceed to generate output based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Grantmaking Committee, Halloran Foundation
  **FROM:** Chair, Grantmaking Committee
  **DATE:** [Date]
  **SUBJECT:** Recommendation on Consortium Proposal for Infrastructure Mitigation

  **Recommendation**
  I recommend we **fund a six-month scoping phase of $250,000**, with a contingent commitment for the remaining $2.75 million subject to specific risk-model milestones. This structure allows us to book the full multi-year liability in this fiscal year, satisfying the CFO, while limiting immediate capital exposure. We must communicate this decision to the consortium by next Friday to meet their end-of-month window.

  **The Expected Value Trap**
  Under our standard cost-effectiveness model, even our analyst's pessimistic probability estimate (1 in $10^9$) yields an expected value roughly eight times our benchmark. The applicants' estimate (1 in $10^6$) yields thousands of times our benchmark. Trustee B is correct that plain expected-value reasoning compels us to fund this. To decline based solely on the smallness of the probability would indeed be probability neglect. It would contradict our own history of funding vaccination programs, where benefits accrued largely to people who did not yet exist at the time of the grant. If we reject this because the beneficiaries are future generations, we undermine the logic of our own endowment.

  However, Trustee B's position relies on the applicants' risk assessment being complete. It is not.

  **The Misuse Wrinkle**
  The applicants concede a 1 in $10^5$ probability that their technology is misused, causing harm of the same order of magnitude as the catastrophe they aim to prevent. They have not netted this against their headline benefit.
  *   **Applicant Model:** (1 in $10^6$ success $\times$ Gain) $-$ (1 in $10^5$ misuse $\times$ Loss). Since Gain $\approx$ Loss, the expected value is **negative**.
  *   **Analyst Model:** (1 in $10^9$ success $\times$ Gain) $-$ (1 in $10^5$ misuse $\times$ Loss). The expected value is **massively negative**.

  We cannot authorize a grant that is net-negative in expectation, regardless of the upside tail. This is not prudence; it is arithmetic.

  **On the Tempered Rule**
  Trustee A proposes squaring all probabilities to prevent low-probability events from dictating budget allocation. I understand the impulse: we cannot allow a single speculative application to annex half our annual budget based on a spreadsheet calculation we cannot fully verify. If we do not guard against this, we invite a precedent where any confident applicant can hold our endowment hostage with a sufficiently large hypothetical stake.

  However, adopting the "tempered rule" would break our welfare metric. A welfare unit is a welfare unit; discounting it based on the magnitude of the probability introduces an inconsistency that would require us to re-evaluate every past grant. Furthermore, it is a blunt instrument. It penalizes legitimate tail-risk mitigation (like pandemic preparedness) alongside speculative engineering.

  Trustee A is right about the *risk concentration*, not the *math*. We should address her concern through a **portfolio concentration cap** (e.g., no single grant may exceed 15% of annual outflow without a supermajority vote) rather than distorting our expected value calculations. This achieves her goal—preventing budget dominance—without corrupting our benchmark.

  **The Path Forward**
  We are left with a proposal that has massive upside but currently demonstrates a net-negative expected value due to unmitigated misuse risk. We cannot fund the full $3 million now. But because the upside is so significant, and because the "future people" argument is central to our mission, we should not decline outright.

  We will fund a scoping phase to determine if the misuse risk can be reduced or better quantified.

  **Motion for Vote**
  I move that the Halloran Foundation authorize a grant of **$250,000** to the University Consortium for a six-month scoping phase, with a **contingent commitment of $2.75 million** for years 2–5, subject to the following conditions:

  1.  **Risk Netting:** The consortium must produce a revised risk model that explicitly nets the expected welfare loss of misuse against the expected welfare gain of mitigation, using probability estimates validated by an independent third-party auditor selected by our staff.
  2.  **Misuse Mitigation:** The consortium must demonstrate technical or governance controls that reduce the probability of misuse to at least one order of magnitude below the probability of success.
  3.  **Concentration Cap:** Approval of the remaining $2.75 million will require a committee supermajority (75%), acknowledging that this grant will exceed 15% of our annual outflow in years 1 and 2.
  4.  **Fiscal Booking:** The CFO is authorized to book the full $3 million as a committed liability in the current fiscal year, with disbursement of the tranche two funds contingent on the milestones above.

  This approach respects the math (by addressing the net-negative EV), respects the mission (by keeping the future-people argument alive), and respects the committee's fiduciary duty (by preventing budget capture without verified safeguards).

  I ask for a voice vote on this motion.
