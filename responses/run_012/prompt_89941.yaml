              *   *Strategy:* Start with Masks. It secures the idea that "Disposition $\neq$ Manifestation." Then hit them with Finks to show "Disposition $\neq$ Conditional."
          4.  Wait, standard literature often does Finks first (Martin). But pedagogically, Masks are easier. Let's suggest Masks first to establish "Dispositions can exist without manifestation," then Finks to establish "Conditionals can fail even if disposition exists."
          5.  Actually, Finks are the stronger counterexample to CA. Masks are counterexamples to Simple Conditional Analysis (SCA) regarding manifestation.
          6.  *Refined Order:*
