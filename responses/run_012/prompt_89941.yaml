      *   *LLM Critique:* Be honest about the mapping. Filter = Mask (blocks output). Fine-tune = No disposition (usually). Need to adjust the "Fink" description to be an *internal* state change triggered by input.
      *   *Sequence:* CA $\rightarrow$ Mask (Behavior $\neq$ Disp) $\rightarrow$ Fink (Disp $\neq$ Conditional) $\rightarrow$ Comparison.
      *   *Misconceptions:* Address "Hidden Engine" early. Address "Behaviorism" with Masks.
      *   *Closing Question:* A "Finkish Mask" or a novel scenario.

  8.  **Refining the LLM Example:**
      *   *Mask:* The model *wants* to say the answer (logits are high). A system prompt or API layer intercepts the tokens and swaps them for "I can't." The *model* still has the disposition. The *system* masks it.
      *   *Fink:* The model *wants* to say the answer. But the moment the prompt is encoded, a specific "safety neuron" activates and *suppresses* the generation layers *before* tokens are sampled. The disposition (the active state readiness) is removed *by* the stimulus.
      *   *Wait, is a Fink intrinsic or extrinsic?* Martin's Fink is often extrinsic (the wizard), but the key is the disposition *goes away*. Lewis tries to make it intrinsic. For the LLM:
