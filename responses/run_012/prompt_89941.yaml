      *   *Correction on User's Intuition:* User said Filter = Fink, Fine-tune = Mask.
          *   Filter (downstream): Blocks output. Disposition remains. **Mask.**
          *   Fine-tune (weights changed): Disposition gone. **Not a Fink/Mask** (just absence).
          *   To make a Fink: Dynamic inference-time intervention that changes the weights/state *upon prompt*.
      *   *Advice:* Use the LLM example but correct the mapping. It's high reward/high risk. If the class is tech-literate, it's gold. If not, it's confusion. Given it's 2nd year metaphysics, maybe stick to a hybrid or ensure the tech explanation is trivial. *Decision:* Encourage it but demand strict simplification.

  9.  **Structuring the Response:**
