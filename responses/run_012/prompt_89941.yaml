                  4.  Synthesis: Why CA fails.

  4.  **Misconceptions:**
      *   "Hidden Engine" (Reification): Dispositions aren't little gremlins. They are properties grounded in categorical bases.
      *   "Behaviorism": If it doesn't break, it isn't fragile. (Mask fixes this).
      *   "Finks are just Masks": Need to distinguish intrinsic removal vs. extrinsic blocking.

  5.  **Final Assessment Question:**
      *   Needs to be a novel case. Not wire, not glass, not LLM (since we used that).
      *   Scenario: A magic spell or a biological mechanism.
      *   Idea: A biometric lock.

  6.  **What to Skip:**
      *   Categorical bases (too deep).
      *   Lewis's Revised Conditional Analysis (too technical for 50 mins).
      *   Antidotes vs. Masks (nuance).
