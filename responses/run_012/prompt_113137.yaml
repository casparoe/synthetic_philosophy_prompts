      *   If a theory predicts $X$ at time $T_1$ due to mechanism $M$, and $X$ happens at $T_2$ due to mechanism $N$, is the theory confirmed?
      *   Intuitively, science cares about *explanation*, not just *prediction*. A lucky guess isn't a theory.
      *   However, social sciences deal with complex, open systems where timing is notoriously difficult.
      *   The "mechanism-match" criterion seems robust but might be too strict if mechanisms are complex or if the original theory identified a *tendency* rather than a specific causal chain.

  3.  **Evaluate the Criteria:**
      *   *Outcome-Only:* Too permissive. Allows post-hoc rationalization. If I predict a stock crash due to interest rates, and it happens 20 years later due to a pandemic, my theory wasn't right.
      *   *Mechanism-Match:* Stricter. Aligns with scientific realism. But requires knowing the mechanism. In social sciences, mechanisms are often debated. Does it rely on hindsight? Yes, but that's unavoidable when evaluating past theories.
      *   *Refinement:* Perhaps the mechanism doesn't need to be *identical* in every detail, but the *causal logic* must hold.

  4.  **Develop the Argument (Taking a Stand):**
      *   *Thesis:* The "mechanism-match criterion" is necessary. A theory cannot be vindicated merely by a coincidental outcome. "Right but early" is only legitimate if the causal pressure identified by the theory was merely delayed, not bypassed and replaced.
      *   *Why?* Because the purpose of social science theory is understanding *why* things happen, not just guessing *what* happens. Without mechanism, we have prophecy, not science.
      *   *Application to Malthus:* Malthus predicted starvation due to biological reproduction outpacing agricultural yield. The "delay" was technology (Green Revolution) and demographic transition (lower birth rates with wealth). The mechanism *changed*. Therefore, Malthus was not "right but early"; he was wrong about the mechanism, even if resource constraints remain a worry today.
