      *   **Applying to a Second Case (Peak Oil/Resource Depletion):** Hubbert's Peak. Prediction of depletion. Delays occur due to new extraction tech. Is the mechanism the same? Yes, finite physical stock. The *rate* changed, not the *limit*. Here, "right but early" might be more defensible *if* the theory acknowledged tech as a variable. But if the theory said "We run out in 1990" based on known reserves, and we run out in 2090 based on *unknown* reserves accessed by new tech, the mechanism of "known reserves depletion" was wrong. Let's use **Marx** instead? Or **The Singularity**?
