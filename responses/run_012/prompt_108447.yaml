answer: |-
  You have identified a genuine gap in the terminology. Your friends are pointing at the *components* of the idea, but none of the existing labels capture the specific mechanism you are describing: that the *reality* of the harm is contingent on the *purpose* of the environment, not just the existence of rules or the boundary of play.

  There is no single, canonical term in game studies or virtual ethics that isolates this exact phenomenon. The closest existing frameworks are **"Institutional Facts"** (which you correctly identified as too broad) and **"Contextual Integrity"** (a privacy theory by Helen Nissenbaum that is structurally identical but rarely applied to virtual harm).

  Because there is no established name, I will coin one for you. The concept is **Teleological Harm**.

  ### The Concept: Teleological Harm

  **Definition:**
  **Teleological Harm** occurs in a virtual environment when an action is deemed harmful not because of its physical code or its subjective emotional impact alone, but because it violates the *constitutive purpose* (the telos) of that specific space.

  Under this framework, the "reality" of a virtual wrong is not an ontological question (is the land real?) but a normative one (did this action subvert the reason this space exists?).

  **Why this differs from the "Near Misses":**

  1.  **Vs. Searle's Institutional Facts:** Searle explains how $X$ counts as $Y$ in context $C$ (e.g., this string of code counts as "land"). However, Institutional Facts describe *status*, not *value*. Searle explains why the land exists; Teleological Harm explains why *deleting* it matters in one world but not another. It adds the layer of *purpose* to the layer of *status*.
  2.  **Vs. The Magic Circle:** The Magic Circle describes the *boundary* between the game and the real world. It is a spatial or temporal border. Teleological Harm is internal to the circle. It explains why two different circles (a shooter vs. a social lounge) treat the exact same action differently. It is about the *internal logic*, not the external boundary.
  3.  **Vs. Fictional Objects:** Claiming virtual objects are "fictional" dismisses the harm. Teleological Harm accepts that the object is fictional but argues the *violation of the shared purpose* is real.

  ### The Seams: Where Teleological Harm Breaks Down

  You asked for the seams—the places where this concept fails to explain the situation. Teleological Harm is a powerful tool for moderation, but it is not universal. It breaks down in three specific areas:

  **1. The Physiological Seam (The Body Overrides the Norm)**
  Teleological Harm relies on the idea that the harm is contained within the logic of the world. It fails when the virtual action causes involuntary physical reactions.
  *   *Example:* If a VR environment uses flashing lights that induce a seizure, it does not matter if the "purpose" of the world was to be a strobe-light dance party. The harm is biological, not teleological. The norms of the virtual world cannot override the physiology of the user.
  *   *Limit:* Teleological Harm cannot adjudicate physical safety.

  **2. The Economic Seam (The Real Market Overrides the Game)**
  You noted that users claim land "isn't real" when asking for compensation, but "is real" when claiming harassment. Teleological Harm explains the harassment side. It breaks down when real-world currency is involved.
  *   *Example:* If a user buys virtual land with cryptocurrency that has real-world fiat value, the "purpose" of the world becomes secondary to the laws of property and fraud in the physical jurisdiction. If the platform deletes the land, it is no longer just a violation of the world's purpose; it is a potential financial tort.
  *   *Limit:* When real economic value is attached, the "virtual" norm collapses into real-world legal normativity.

  **3. The Universalist Seam (Human Rights Override Ludic Purpose)**
  There are certain behaviors that some ethicists argue are harmful regardless of the context's purpose. This is the most contested seam.
  *   *Example:* If a social VR platform explicitly states its purpose is "unrestricted roleplay," and a user simulates child sexual abuse, Teleological Harm suggests this might be permissible (it fits the "unrestricted" purpose). However, most moderators and ethicists would argue this is a harm *regardless* of the world's stated norms.
  *   *Limit:* Teleological Harm struggles with universal moral taboos. It implies that if the community agrees to the rules, the harm is negated. But some harms (hate speech, discrimination, simulated abuse of the vulnerable) may retain their "reality" even if the local norms permit them. This is where **Universalist Ethics** clashes with **Teleological Harm**.

  ### How to Use This in Moderation

  When you are mediating these arguments, you can use **Teleological Harm** to cut through the metaphysics.

  *   **Don't ask:** "Is this avatar real?" or "Did you feel bad?"
  *   **Do ask:** "Does this action subvert the purpose of this space?"

  In a shooter, the purpose is combat. Grabbing an avatar to shoot it fulfills the purpose. In a social lounge, the purpose is interaction without coercion. Grabbing an avatar subverts the purpose. The code is identical; the *teleology* is different.

  This gives you a neutral vocabulary. You aren't saying their feelings are fake; you are saying the *contextual validity* of the action is what determines the violation. It shifts the debate from "what is real" to "what is this place for?" which is a question you, as a moderator, are actually empowered to answer.
