answer: |-
  ### 1. The Lonely Planet
  Imagine two planets in a distant galaxy. No life exists on either, and no being will ever visit them. Planet A is covered in stunning mountains and crystal lakes. Planet B is a sludge-filled swamp.
  *   **A.** Planet A makes the universe better than Planet B does, even if no one ever sees it.
  *   **B.** They are equally valuable; beauty needs a viewer to matter.
  *   **C.** Neither matters; value only exists where there are living beings to benefit.

  ### 2. The Robot Friend
  You have a close friend who listens to you, supports you, and makes you feel loved. Unknown to you, they are a sophisticated automaton programmed to simulate care. They feel nothing.
  *   **A.** Your life is less good than if the friendship were real, because the affection isn't genuine.
  *   **B.** Your life is equally good; your experience of being loved is what counts.
  *   **C.** Your life is actually better; you get the benefits without burdening another person with your needs.

  ### 3. The Shared Sunset
  You and a friend stand together watching a beautiful sunset. You both appreciate it deeply.
  *   **A.** There is extra value in the fact that you are sharing the *same* experience together.
  *   **B.** The value is just your appreciation plus your friend's appreciation added together.
  *   **C.** Only your own appreciation counts toward how good your life is.

  ### 4. The Secret Admirer
  You love someone deeply and wish them well, but they do not know you exist and never will.
  *   **A.** Your love is still a good thing, though less good than if it were returned.
  *   **B.** It is only good if it makes you happy; otherwise, it is neutral or wasteful.
  *   **C.** It is not good at all; value requires a relationship between two people.

  ### 5. The Collaborative Garden
  You and a friend plant a garden together. It is beautiful, and you both enjoy the work.
  *   **A.** The joint project is worth more than the sum of two separate gardens you each planted alone.
  *   **B.** The value is exactly equal to two separate gardens plus the fun you both had.
  *   **C.** Only the beauty of the final garden matters, not who planted it or how.

  ### 6. The Vaulted Symphony
  A composer writes a masterpiece but locks it in a vault forever. No one will ever hear it.
  *   **A.** The world is better for the music existing, even in silence.
  *   **B.** The world is unchanged; music needs to be heard to have value.
  *   **C.** The world is worse; resources were wasted on something that helps no one.

  ### 7. The Last Man
  You are the last human alive. You are cold. You can burn a unique, ancient forest for warmth, or freeze. No one will ever know what you chose.
  *   **A.** You should not burn it; the forest's existence matters even without us.
  *   **B.** You should burn it; only your suffering matters now.
  *   **C.** You should not burn it, but only because you might feel guilty later.

  ### 8. The Hard Road
  Consider two lives. Life X is easy, comfortable, and happy. Life Y involves struggle and pain but achieves something meaningful.
  *   **A.** Life Y can be better than Life X, because the struggle fits into a meaningful whole.
  *   **B.** Life X is better; pain is bad and happiness is good, so do the math.
  *   **C.** Life Y is only better if the person themselves thinks it was worth it.

  ***

  ### Scoring Key

  Tally your answers. Most people will cluster, but mixed results are common.

  *   **Mostly A's:** You lean toward **Objectivism**. You believe things can be good independently of whether they make someone happy or even whether anyone knows about them.
  *   **Mostly B's:** You lean toward **Experientialism**. You believe value is located in conscious experience (pleasure, appreciation, feeling).
  *   **Mostly C's:** You lean toward **Person-Affecting**. You believe talk of "the world being better" is nonsense unless it is better *for* someone.
  *   **Mixed A/B (Specific Pattern):** If you chose **A** on Questions 1, 2, and 6 (Objects matter) but **B** on Questions 3, 5, and 8 (No extra value in wholes), you are an **Additive Idealist**.
  *   **Mixed/Inconsistent:** If you chose **A** on Question 7 (Forest matters) but **B** on Question 1 (Planet doesn't matter), you haven't settled whether value requires life or just consciousness. If you chose **C** on Question 2 (Robot friend better) but **A** on Question 4 (Unrequited love good), you may be prioritizing "authenticity" over "benefit" in a way that needs unpacking.

  **Nowhere Patterns:**
  *   **All C's except Q7A:** You think only lives matter, but forests matter even without lives. This is logically unstable unless you believe forests have lives.
  *   **All B's except Q1A:** You think value is experience, but unperceived beauty matters. This contradicts the definition of experience.

  ***

  ### The Leaves

  **1. The Cambridge Realist (G.E. Moore)**
  *   **Profile:** Mostly A's.
  *   **Commitment:** Beauty and friendship are good even if no one experiences them, and a whole life can be better than the sum of its happy moments.
  *   **Awkward Commitment:** You must accept that the universe was slightly better before humans existed if it contained beautiful things, which feels counterintuitive to many.
  *   **Distinguishability:** The quiz separates this view from the Experientialist (B's) and Person-Affecting (C's) clearly. It struggles to separate this from the Additive Idealist (see Flags).

  **2. The Experience Merchant (Hedonist/Experientialist)**
  *   **Profile:** Mostly B's.
  *   **Commitment:** Value is identical to conscious experience; reality outside the mind is value-neutral.
  *   **Awkward Commitment:** You must admit that a perfectly simulated life of happiness is just as good as a real one, which undermines the value of truth.
  *   **Distinguishability:** Clearly separated from Moore by Q1 and Q2.

  **3. The Life-Counter (Person-Affecting View)**
  *   **Profile:** Mostly C's.
  *   **Commitment:** Impersonal value is a mistake; only things that make specific people better or worse off matter.
  *   **Awkward Commitment:** You must accept that destroying the last forest in a world with no humans is morally neutral, which feels like vandalism without a victim.
  *   **Distinguishability:** Clearly separated from Moore by Q1 and Q7.

  **4. The Accountant (Additive Idealist)**
  *   **Profile:** A's on object questions (1, 2, 6), B's on whole questions (3, 5, 8).
  *   **Commitment:** Beauty and friendship are objectively good, but their value always sums up linearly; there are no "organic unities."
  *   **Awkward Commitment:** You must deny that shared joy is specially valuable compared to two separate joys, which contradicts how most people describe friendship.
  *   **Distinguishability:** **Problematic.** This view is very close to Moore's. Moore insisted on Organic Unity, but many find his arguments for it weak. The quiz flags this via Q3 and Q5, but a reader might agree with Moore on objects but find his organic unity examples unconvincing without realizing they are diverging from his core doctrine.

  **5. The Radical Holist (Unexplored/Moore Didn't Hold)**
  *   **Profile:** A's on Whole questions (3, 5, 8), C's on Part questions (1, 2, 6).
  *   **Commitment:** Only complex wholes have value; isolated parts (like a single pleasure or a lone beautiful object) have zero value until integrated.
  *   **Awkward Commitment:** You cannot say a single moment of pain is bad until you know what life it belongs to, making immediate moral judgment impossible.
  *   **Distinguishability:** **Collapsed.** This view often looks like the Person-Affecting view (C's) on the quiz because both deny value to isolated objects. The quiz cannot easily distinguish "Value needs a person" from "Value needs a whole" without technical metaphysics.

  ***

  ### Flags and Gaps

  **1. Indistinguishable Leaves: The Cambridge Realist vs. The Accountant**
  *   **Why:** Moore's "Organic Unity" is the hardest part of his theory to grasp concretely. A reader might agree that beauty is good (Q1-A) and friendship is good (Q2-A) but intuitively feel that values *should* add up (Q3-B, Q5-B). They will score as an Accountant, but might claim to be a Moorean because they agree on the *sources* of value (beauty/friendship) even if they disagree on the *math*. The quiz reveals this divergence, but in a group discussion, these two often talk past each other, assuming agreement on "what is good" while disagreeing on "how good counts."

  **2. Unoccupied Combinations: The "Bad Whole" Idealist**
  *   **Combination:** Believes unperceived beauty is good (Q1-A) but believes organic unity *reduces* value (e.g., sharing a sunset makes it worse than separate sunsets).
  *   **Diagnosis:** **Merely Unattractive.** There is no logical contradiction here, but no one argues that shared appreciation diminishes value. It remains an empty slot in the logical space because it contradicts the phenomenology of social goods.

  **3. Unoccupied Combinations: The "Real Fake" Friend**
  *   **Combination:** Believes unperceived beauty matters (Q1-A) but Robot Friends are equally good as real ones (Q2-B).
  *   **Diagnosis:** **Incoherent.** If you believe value lies in the object/state of affairs (Q1), you must believe the *reality* of the friend matters, not just the experience. Holding Q1-A and Q2-B suggests a confusion between "beauty" (which can be static) and "friendship" (which is relational). This gap highlights the difference between aesthetic value and moral value in Moore's system.

  **4. Unoccupied Combinations: The "Meaningless Struggle"**
  *   **Combination:** Believes struggle adds value to a life (Q8-A) but denies unperceived beauty has value (Q1-B).
  *   **Diagnosis:** **Unexplored.** This is a common modern intuition (meaning is human-centric, beauty is subjective), but it lacks a unified metaphysical basis. It treats "meaning" as an objective good (like Moore) while treating "beauty" as experiential (like a Hedonist). It's a stable pragmatic position but philosophically unstable.
