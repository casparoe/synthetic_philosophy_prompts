  **Scenario**

  ReguCheck is a finite compliance algorithm stored on a static server containing a fixed database $\Gamma_{total}$ of regulatory statutes, where $\Gamma_{total} = \{p, p \to q, r, r \to s\}$ over atomic sentences $\{p, q, r, s\}$. ReguCheck is programmed to be topic-omniscient: it asserts knowledge of $\phi$ if and only if $\phi$ is derivable from its active premises via a topic-preserving consequence relation $\vdash_{TP}$, meaning no atom in the derivation appears outside the topic of the active premises. When queried whether it knows the violation condition $\phi = q \wedge s$, ReguCheck accesses $\Gamma_{total}$ but applies one of two hard-coded compliance protocols determined solely by a single metadata tag on the query: "Domestic" or "International." Under the "Domestic" tag, the protocol restricts active premises to $\Gamma_{dom} = \{p, p \to q\}$ (Topic $\{p, q\}$), rendering $s$ outside the topic and blocking the derivation of $\phi$, so ReguCheck verdicts "I do not know $\phi$." Under the "International" tag, the protocol activates all of $\Gamma_{total}$ (Topic $\{p, q, r, s\}$), permitting the derivation of $\phi$ within the topic, so ReguCheck verdicts "I know $\phi$." ReguCheck grasps all atoms, faces no time or memory limits, and is fully closed under the $\vdash_{TP}$ relation dictated by the active protocol, yet it fails standard logical omniscience because it never infers $p \vee z$ for any atom $z$ absent from its active topic.

  **Demonstration**

  **Proposition:** $\phi = q \wedge s$.
  **Consequence Relation:** $\vdash_{TP}$ (Topic-Preserving Consequence), where $\Gamma \vdash_{TP} \psi$ iff $\Gamma \vdash \psi$ and $Atoms(\psi) \subseteq Atoms(\Gamma)$.
  **Two Readings of Knowledge:**
  1.  **$K_{dom}$ (Domestic Knowledge):** Closure under $\vdash_{TP}$ relative to $\Gamma_{dom}$.
      *   *Verdict:* ReguCheck does not know $\phi$.
      *   *Reasoning:* $Atoms(\phi) = \{q, s\}$. $Atoms(\Gamma_{dom}) = \{p, q\}$. Since $s \notin Atoms(\Gamma_{dom})$, $\Gamma_{dom} \nvdash_{TP} \phi$.
  2.  **$K_{int}$ (International Knowledge):** Closure under $\vdash_{TP}$ relative to $\Gamma_{total}$.
      *   *Verdict:* ReguCheck knows $\phi$.
      *   *Reasoning:* $Atoms(\Gamma_{total}) = \{p, q, r, s\}$. Since $\{q, s\} \subseteq \{p, q, r, s\}$ and $\Gamma_{total} \vdash \phi$, then $\Gamma_{total} \vdash_{TP} \phi$.

  **Structural Feature:** The *Topic Boundary* relative to the conclusion's atoms. The variation in verdict is driven exclusively by the *Protocol Tag*, which shifts the set of active premises and thereby the permissible topic boundary, without altering the agent's total information or computational capacity.

  **Checks**
  1.  **Genuine Consequence Relation:** $\vdash_{TP}$ is Reflexive ($Atoms(\phi) \subseteq Atoms(\phi)$), Transitive (if $Atoms(\psi) \subseteq Atoms(\Gamma)$ and $Atoms(\chi) \subseteq Atoms(\psi)$, then $Atoms(\chi) \subseteq Atoms(\Gamma)$), and Monotone (if $\Gamma \subseteq \Delta$, then $Atoms(\Gamma) \subseteq Atoms(\Delta)$, so topic permissions are preserved or expanded). It is a Tarskian consequence relation.
  2.  **Collapse Avoidance:** This is not an "Awareness" case (Fagin & Halpern) because ReguCheck *grasps* atom $s$; it is in the database and understood. The block is not cognitive unawareness but *normative permission* based on topic boundaries. It is not "Resource-Bounded" because the derivation is instantaneous; the block is structural (vocabulary restriction), not computational (step limit).

  **Rerun**
  If the varying feature (the Protocol Tag) is removed and the system defaults permanently to the "Domestic" protocol, the agent remains **not omniscient** in the standard sense. She will still fail to know $\phi$ (as shown above) and will fail to know any tautology introducing a new atom (e.g., $p \vee z$). If the system defaults permanently to the "International" protocol, she becomes omniscient *relative to the language of $\Gamma_{total}$*, but still fails standard omniscience for any proposition containing atoms outside $\Gamma_{total}$. In neither fixed case does she satisfy the standard epistemic-logic closure principle universally (which demands closure under *all* logical consequences regardless of vocabulary).

  **Objection and Reply**
  **Defender's Objection:** "Knowledge *simpliciter* is closed under full logical consequence. Your agent merely has a restricted *assertability* condition based on regulatory protocols. The shortfall shows 'knows' was being used loosely to mean 'authorized to assert,' not epistemic knowledge."
  **Best Reply:** "Epistemic attribution is context-sensitive. In regulatory contexts, 'knowing' a violation entails having a derivation that respects jurisdictional boundaries. If the truth conditions for 'S knows $\phi$' depend on the conversational context (here, the Protocol Tag), then there is no single 'knowledge *simpliciter*' that overrides the topic-sensitive closure. The idealization of standard closure ignores the vocabulary constraints inherent in specific epistemic practices."
  **Weakness:** This reply struggles to explain mathematical or empirical knowledge, where topic boundaries seem irrelevant, suggesting that while topic-omniscience models *specific* practices, it may not capture the core normative notion of knowledge required for a general epistemology.
