  The old grain is gone, the new grain lifts its head.
  The fire-drill wood changes with the season.
  Zai Wo lays the cycle on the mat:
  Let the ritual breathe, let the music hold.
  One year is the sky's own measure.
  The Master asks about the tongue, about the skin.
  Is the rice sweet? Is the silk smooth?
  Zai Wo says: My heart is quiet. I am at ease.
  The Master says: If you are at ease, then do it.
  A gentleman in mourning finds no taste in food.
  No peace in the house, no sound in the ear.
  That is why he waits.
  Zai Wo turns. The hem brushes the threshold.
  The door opens to the street.
  Dust motes dance where the body stood.
  The Master says: If you are at ease, then do it.
  The words settle on the empty mat.
  Three years the child hangs on the parent's hip.
  The arms do not keep a tally.
  It is the time it takes to become a person.
  Did Yu not have three years of love?
  The latch falls.
  The air holds the weight of the uncounted.
  Outside, the sky completes its circle.

  This poem treats the Master's repetition not as insistence but as a shift in addressee; the first instance grants agency, while the second, spoken to the room, marks Zai Wo's exit from the shared moral community. I've framed Zai Wo's utilitarian argument as logically sound regarding social function, honoring the text's admission that his points on ritual decay are valid. The role-ethics reading appears in the contrast between the calendar's cycle and the child's growth, suggesting mourning is constitutive of the self rather than a repayable debt. By ending on the latch falling, I avoid judging Zai Wo explicitly, letting the silence after his departure carry the weight of the Master's final question. The liberty taken here is emphasizing the spatial separation—the door—as the moment the ethical language changes entirely.
