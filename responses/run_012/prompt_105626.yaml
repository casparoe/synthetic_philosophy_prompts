answer: |-
  # Joint Statement on the Structure of Moorean Absurdity

  ## Section 1: Agreed Claims

  1.  **The Phenomenon:** Both camps agree that sentences of the form "It is raining and I do not believe that it is raining" generate a distinctive absurdity when asserted by a speaker in a normal context. This absurdity is immediate and robust, distinguishable from mere falsehood or oddity.
  2.  **Truth of Content:** Both camps agree that the proposition expressed by the sentence can be true. It is a contingent fact about the world that it may be raining while a specific speaker fails to believe it. The absurdity does not stem from the impossibility of the state of affairs described.
  3.  **Assertion and Commitment:** Both camps agree that assertion is not merely the utterance of sounds but a normative act. To assert is to undertake a commitment. When a speaker asserts *p*, they invite others to hold them accountable for *p*.
  4.  **The Two-Ledger Model (Descriptive):** Both camps accept the Two-Ledger Model as a useful descriptive tool for mapping the structure of assertion. The **Public Ledger** records what is put forward as true (the content *p*). The **Private Ledger** records what the speaker is willing to be held to as a believer (the commitment *I believe p*). In a standard assertion, the entries match. In a Moorean assertion, the Public Ledger enters *p* while the Private Ledger enters *not-p* (via the explicit disavowal).
  5.  **The Two-Ledger Model (Limitations):** Both camps acknowledge that the ledger model distorts reality if treated as a literal psychological inventory. Belief is not always a conscious entry ready for inspection. The model is a heuristic for norms, not a map of mental storage. It risks implying a dualism between "public" and "private" selves that may not exist; nevertheless, it correctly identifies the tension between what is said and what is thereby expressed.
  6.  **Context Sensitivity:** Both camps agree that the absurdity may vanish in specific contexts, such as when the sentence is embedded ("If it is raining and I don't believe it..."), spoken in the past tense, or attributed to a third party. This suggests the defect is tied to the present-tense, first-person act of assertion itself.
  7.  **Goal of Inquiry:** Both camps aim to locate the source of the defect. Is it a violation of the rules governing the symbols (semantic), or a violation of the rules governing the users (pragmatic)? Both agree that resolving this clarifies the relationship between mind, language, and truth.

  ## Section 2: Disagreements

  | Issue | Contradiction Camp Formulation | Pragmatist Camp Formulation |
  | :--- | :--- | :--- |
  | **Source of Absurdity** | The sentence is logically inconsistent relative to the norms of assertion. Asserting *p* semantically entails "I believe *p*." Therefore, the sentence amounts to "I believe *p* and I do not believe *p*," which is a formal contradiction. | The sentence expresses a consistent proposition. The absurdity arises because asserting *p* pragmatically implies "I believe *p*." The speaker violates a rule of use, not a rule of meaning. |
  | **Status of the Proposition** | The proposition is defective *qua* assertion. It cannot be coherently put forward as true by the speaker who owns it. The defect belongs to the content-in-context. | The proposition is fully coherent. The defect belongs entirely to the act of utterance. The content could be whispered, thought, or printed without paradox. |
  | **The Ledger Link** | The link between the Public and Private Ledgers is constitutive. You cannot enter *p* in the Public Ledger without automatically entering *I believe p* in the Private Ledger. They are locked by semantic rule. | The link between the ledgers is normative but separable. You *ought* to match them, but you can physically enter *p* publicly while denying *p* privately. The rule is one of sincerity, not logic. |
  | **Clause Order** | The order of conjuncts ("*p* and I don't believe" vs. "I don't believe and *p*") is irrelevant. The contradiction lies in the conjunction of commitments, which is symmetric. | The order matters. "I don't believe *p*, but *p*" is less absurd because the second clause cancels the implicature of the first. This asymmetry suggests a pragmatic, not semantic, defect. |

  ## Section 3: Cruxes

  1.  **Semantic Entailment vs. Pragmatic Implicature:** The central technical dispute is whether asserting *p* semantically entails "I believe *p*" or merely pragmatically implicates it. If it is entailment, the Contradiction Camp wins: the sentence is logically flawed under assertion. If it is implicature, the Pragmatist Camp wins: the sentence is logically sound but conversationally defective.
      *   *Movement:* Settling this moves the Contradiction Camp. If it is shown that the belief component can be cancelled without contradiction (e.g., "I assert *p* but I don't believe it, because I am lying"), the semantic link is broken.
      *   *Verbal Dispute:* There is a risk this is merely verbal. If "semantic entailment" is defined as "rules you cannot break without ceasing to assert," the Contradiction Camp wins by definition. We must agree on independent tests for semantics vs. pragmatics.

  2.  **The Symmetry of Clause Order:** Does the reversed sentence ("I do not believe it is raining, but it is raining") carry the same absurdity?
      *   *Movement:* This pressures the Pragmatist Camp. If the reversed order is significantly less absurd, it supports the pragmatic view (implicatures can be cancelled). If it remains equally absurd, it supports the semantic view (the contradiction is in the joint commitment, regardless of order).
      *   *Verbal Dispute:* Intuitions on this vary. If one side claims it is "equally bad" and the other "slightly better," we need a metric for absurdity beyond gut feeling.

  3.  **The Nature of the Private Ledger:** Is the Private Ledger entry ("I believe *p*") a description of a mental state or a commitment to a norm?
      *   *Movement:* This moves both sides. If belief is purely a descriptive mental state, the Pragmatist view strengthens (I can describe my lack of belief while asserting). If belief is a normative commitment inherent to assertion, the Contradiction view strengthens (I cannot commit to *p* while disavowing commitment).
      *   *Verbal Dispute:* High risk. "Belief" may be doing double duty here. We must distinguish *psychological belief* from *assertoric commitment*.

  ## Section 4: Shared Tests and Predictions

  1.  **The Calibration Twist:** A forecaster asserts, "It will rain, but I do not believe it will rain," because her official model outputs "rain" while her personal credence is low.
      *   *Relevance:* Tests whether institutional role separates the Public and Private Ledgers.
      *   *Contradiction Prediction:* The assertion remains defective. Even if the model says *p*, asserting *p* personally commits the forecaster to belief. She is misusing "I assert."
      *   *Pragmatist Prediction:* The assertion is felicitous. The Public Ledger records the model's output; the Private Ledger records her credence. The norms of her role allow this divergence.
      *   *Outcome:* If listeners accept this as a valid assertion without confusion, it supports the Pragmatist view that the link between assertion and belief is context-dependent.

  2.  **The Silent Machine:** A device prints "It is raining and I do not believe it is raining" on a tape.
      *   *Relevance:* Tests whether the defect resides in the sentence type or the tokening by a believer.
      *   *Contradiction Prediction:* The sentence remains paradoxical even when printed. The inconsistency is in the content relative to any potential user.
      *   *Pragmatist Prediction:* There is no absurdity. Without a speaker undertaking a commitment, there is no violation of norms. It is just ink on paper.
      *   *Outcome:* If readers find the printed sentence puzzling but not absurd, it suggests the defect requires a speaker, supporting the Pragmatist view.

  3.  **Embedding under Negation:** Consider "It is not the case that (it is raining and I do not believe it)."
      *   *Relevance:* Tests whether the contradiction survives outside of direct assertion.
      *   *Contradiction Prediction:* The sentence is trivially true (since the embedded clause is inconsistent), but the embedded clause itself remains defective.
      *   *Pragmatist Prediction:* The sentence is perfectly normal. The absurdity vanishes because no assertion is made.
      *   *Outcome:* Since embedding usually dissolves the paradox, this strongly favors the Pragmatist view, unless the Contradiction Camp argues that assertion is the only context where the sentence has meaning.

  ## Section 5: What Would Move Each Side

  **Contradiction Camp:** We would revise our position if presented with a clear case where a speaker asserts *p* while explicitly denying belief, and the assertion is accepted as fully rational and semantically well-formed without relying on special institutional roles. Specifically, if the "Calibration Twist" becomes a standard, unremarkable usage in language, we must concede that the link between assertion and belief is not constitutive. We would revise to a view where assertion commits the speaker to truth, but not necessarily to personal psychological belief.

  **Pragmatist Camp:** We would revise our position if it were demonstrated that the absurdity persists in contexts where no conversational norms are active. For example, if the "Silent Machine" case generates the same intuitive conflict as a human speaker, or if the reversed clause order ("I don't believe... but *p*") is judged equally impossible to process. If the defect proves immune to cancellation and context-shifts, we must concede that the inconsistency is rooted in the semantic rules governing the first-person pronoun and belief predicates.

  ## Section 6: Where This Document Is Most Likely to Fail

  1.  **Empty Agreements:** Claim 4 (The Two-Ledger Model) risks being verbal. If "Public Ledger" just means "what is said" and "Private Ledger" means "what is implied," we agree on words but disagree on whether the link is hardwired. This could mask the real dispute about semantic entailment.
  2.  **Wording Disagreements:** The distinction in Section 2 between "constitutive link" and "normative rule" may collapse. If a norm is strict enough, it functions like a rule. We may find we are arguing over the severity of the sanction for violation, not the type of violation.
  3.  **Partition Failure:** The "Calibration Twist" might force a different partition. If institutional assertion separates belief from truth-claims, both camps might agree that *ordinary* assertion links them, but *professional* assertion does not. This would shift the debate from "What is assertion?" to "What are the varieties of assertion?"
  4.  **Changing My Mind:** I would change the partition if evidence showed that third-person Moorean sentences ("He is raining and he does not believe it") generate similar absurdity. This would suggest the problem is not about the speaker's commitment (First Person) but about the logic of belief attribution itself, requiring a complete restructuring of Section 1.

  ***

  **Signed,**

  _________________________
  **Representative, Contradiction Camp**

  _________________________
  **Representative, Pragmatist Camp**
