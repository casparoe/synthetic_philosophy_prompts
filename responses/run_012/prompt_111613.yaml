answer: |-
  ### Examiner's Preliminary Notes & Brainstorming

  Before we settle on the final paper, let's map the terrain. If you're setting this for Year 13, you need to ensure they aren't just parroting Rachels. Here's how the distinction is usually drawn, and how your 'Four Beds' scenario attacks each line:

  1.  **Causal Responsibility (Foot/Quinn):** Killing initiates a new causal sequence; letting die allows an existing one to run.
      *   *The Trap:* In Bed A ( pressing STOP), you initiate death. In Bed B (not pressing RENEW), you allow death. But if the machine is just a tool, is pressing 'stop' really different from not pressing 'renew'? The causal outcome is identical.
  2.  **Intention (Rachels):** If the intention (death) and outcome (death) are the same, the distinction is morally irrelevant.
      *   *The Trap:* Your scenario stipulates identical intention and outcome. If they just say 'Rachels wins', they miss the point about the *mechanism*.
  3.  **Normative Baselines (McMahon others):** 'Doing' vs 'Allowing' depends on what is expected (the default).
      *   *The Trap:* This is the gold mine. If the manufacturer sets the default, does the doctor inherit that moral status? If Bed B defaults to death, is not renewing 'letting die'? If Bed A defaults to life, is stopping 'killing'? If the only difference is a software setting, can morality really hinge on that?
  4.  **Effort/Cost:** Doing usually requires energy; allowing requires restraint.
      *   *The Trap:* Bed C (holding airway) requires constant effort to keep alive. Bed A requires effort to kill. This flips the effort metric.

  Right, let's commit. Here is the package.

  ***

  ### A-Level Philosophy Mock Examination
  **Topic:** Ethical Theory & Applied Ethics (The Act/Omission Distinction)
  **Time Allowed:** 45 Minutes
  **Total Marks:** 25

  **Question 1**

  Consider the following four scenarios involving patients in identical medical states (no hope of recovery, dependent on intervention to survive):

  *   **Bed A:** The patient is on a ventilator that runs continuously. To end their life, a doctor must press a red 'STOP' button.
  *   **Bed B:** The patient is on a ventilator that stops after one hour. To keep them alive, a doctor must press a green 'RENEW' button every hour.
  *   **Bed C:** There is no machine. To keep the patient alive, a nurse must physically hold the airway open continuously.
  *   **Bed D:** There is no machine. A doctor stands in the doorway physically blocking a crash team from entering to save the patient.

  In all four cases, the patient dies at the same moment, with the same level of distress, and the medical staff intend this outcome to relieve suffering.

  **"If the moral status of an action depends on arbitrary mechanical defaults, the act/omission distinction carries no intrinsic moral weight."**

  To what extent do you agree? In your answer, analyse whether the difference between Beds A and B undermines the distinction between killing and letting die, and consider whether intention or causal baseline is the true determinant of moral responsibility.

  ***

  ### Model Answer (Examiner's Copy)

  **Candidate Response**

  The claim that arbitrary mechanical defaults undermine the act/omission distinction is compelling, suggesting that the distinction lacks intrinsic moral weight. In the Four Beds scenario, the outcome, intention, and patient state are identical; only the interface changes. If morality hinges on whether a button is red or green, ethics becomes a matter of engineering rather than principle. Therefore, I argue that the distinction collapses in these cases because the normative baseline, not the mechanical one, is what matters morally.

  Traditionally, the distinction relies on causal agency. Killing is initiating a cause of death; letting die is failing to prevent one. In Bed A, pressing 'STOP' initiates death. In Bed B, failing to press 'RENEW' allows death to occur. Superficially, A is killing and B is letting die. However, this relies on the machine's default setting being morally significant. Why should the manufacturer's software configuration determine whether a doctor is a killer? If the moral status shifts simply because a timer was installed, the distinction is arbitrary. As Rachels argues with Smith and Jones, if the intention and outcome are identical, the metaphysical difference in action is morally irrelevant. Here, the doctor intends death in all four beds to relieve suffering. To judge Bed A harsher than Bed B is to prioritise the mechanism over the motive.

  However, defenders of the distinction might argue that the normative baseline remains stable regardless of the machine. In a hospital, the default expectation is treatment. Therefore, stopping treatment (Bed A) is a deviation from the norm (killing), whereas not renewing (Bed B) might be seen as withdrawing aid (letting die). Yet, Bed C complicates this. Holding an airway open is a continuous physical act. Removing the hand is an omission, yet it requires the same cessation of effort as pressing 'STOP'. If physical effort determined the distinction, Bed C would be 'letting die' when the hand is removed, but the nurse has been expending maximum effort to sustain life. This suggests that physical effort is not the defining factor.

  Bed D introduces a different causal structure: active prevention. Blocking the crash team is clearly an act. If Bed D is morally worse than Bed B, it must be because intervening to prevent rescue is more culpable than failing to rescue. But if the doctor's duty is identical in all cases, the causal route should not exonerate them. The 'arbitrary default' argument holds strongest here: if the moral weight shifts based on whether the barrier is mechanical (Bed A) or physical (Bed D), the distinction is inconsistent.

  Ultimately, the act/omission distinction attempts to track moral responsibility, but in these stipulated cases, it tracks nothing but equipment settings. A robust ethical framework must look beyond the physical movement to the normative context. Since the duty of care and the intended outcome are constant across all four beds, the moral responsibility is identical. The distinction between doing and allowing collapses because it fails to capture the relevant moral features: intention and consequence. To claim otherwise is to allow the design of medical kit to dictate moral truth, which is absurd. Therefore, the distinction carries no intrinsic weight here; it is the intention to relieve suffering that justifies or condemns the act, not the button pressed.

  ***

  ### Marking Scheme (25 Marks)

  **Level 4 (21–25 marks): Excellent**
  *   **Analysis:** Directly engages with the 'arbitrary default' problem. Explains *why* the mechanical difference (Bed A vs Bed B) threatens the distinction (i.e., it makes morality contingent on engineering).
  *   **Argument:** Takes a clear line (e.g., the distinction collapses, or the normative baseline matters more than the mechanical one). Does not sit on the fence.
  *   **Evaluation:** Considers counter-arguments (e.g., causal agency or normative expectations) and rebuts them using the specific details of the beds (e.g., using Bed C to challenge the 'effort' criterion).
  *   **Conclusion:** Justified and follows logically from the premises.

  **Level 3 (16–20 marks): Strong**
  *   **Analysis:** Identifies that Beds A and B are morally similar despite the act/omission label.
  *   **Argument:** References intention and outcome (Rachels-style argument) effectively.
  *   **Evaluation:** Discusses at least two beds in detail but may not fully explore why the 'default' setting is the philosophical problem.
  *   **Limit:** Might assert that intention solves everything without explaining why the mechanical distinction fails to override it.

  **Level 2 (11–15 marks): Competent**
  *   **Analysis:** Describes the differences between the beds accurately.
  *   **Argument:** States that killing is worse than letting die, or vice versa, but relies on standard definitions without applying them critically to the 'default' stipulation.
  *   **Limit:** Treats the beds as separate problems rather than a unified challenge to the distinction. May rely on memorised examples (Smith/Jones) without adapting them to the prompt.

  **Level 1 (1–10 marks): Basic**
  *   **Analysis:** Vague understanding of act/omission.
  *   **Argument:** Asserts opinions without philosophical reasoning.
  *   **Limit:** Fails to address the specific mechanics of the scenario (e.g., ignores the button defaults).

  **Common Mistakes & Examiner Notes:**
  *   **The 'Causation' Trap:** *Candidate asserts omissions aren't causes.* (Note: This is a metaphysical claim, not a moral one; penalise if they don't explain why causal relevance matters morally.)
  *   **The 'Intention' Shortcut:** *Candidate claims 'intention makes them all the same' without addressing the mechanical default objection.* (Note: This misses the specific point of the question regarding equipment settings.)
  *   **The 'Effort' Error:** *Candidate argues Bed C is different because it requires physical touch.* (Note: The prompt stipulates identical outcomes; physical effort is not the moral metric unless argued for.)
  *   **The 'Rule' Recital:** *Candidate lists rules about euthanasia without analysing the act/omission distinction itself.* (Note: Irrelevant to the specific philosophical prompt.)

  **Examiner's Tip for Marking:**
  The key differentiator between a B and an A is whether the student identifies that the *manufacturer's setting* (the default) is being asked to do the moral work. If they notice that it is absurd for a software default to determine 'killing' vs 'letting die', they are operating at Level 4.
