prompt: |-
  Right, so I'm in Year 13 and I've somehow ended up writing the mock exam for our philosophy class — our teacher said yes because she's up to her eyes in the Year 11 stuff, don't ask. The topic is the act/omission distinction, killing vs letting die, the usual trolley business, that Rachels thing with Smith and Jones in the bath. Problem is every question I can come up with can just be answered by someone who's memorised the standard examples, and honestly half my class has. I want something that actually makes them think, and I don't want the marking scheme to need any books or dates in it, because no one in the room would know them and we're not allowed to require them anyway.

  Could you act like an experienced A-level philosophy examiner who's also a proper philosopher, and take your time over this? Maybe brainstorm first — jot down the different ways people try to draw the doing/allowing line — before you commit to anything.

  Here's the idea I want the question built around. Four beds, same hospital, and I want you to stipulate that all four patients are in the same state: no hope of recovery, will die without ventilation, will die if it stops, and they die at the same moment with the same amount of distress either way, so nobody can wriggle out of it on consequences.

  Bed A: a ventilator that runs by itself once it's switched on, so to stop it someone has to press the red STOP button.
  Bed B: a ventilator that stops after an hour unless someone presses the green RENEW button, so keeping the patient alive means someone has to keep pressing.
  Bed C: no machine at all — the patient's airway has to be held open by a nurse's hand, so keeping them alive is something a person has to keep on doing.
  Bed D: nobody touches the patient, but a doctor stands in the doorway and stops the crash team getting in.

  The thing I want the question to go after is this: if whether something counts as doing or as allowing just depends on how the kit is set up — a software default, basically — does the distinction still carry any moral weight? Or is it secretly tracking something else, like who has to keep paying a cost, or what the counterfactual baseline is, or what the doctor is aiming at? And if the default was chosen by the manufacturer rather than the doctor, does that change anything? I'd like the question to force them to say exactly what flips between the beds, and why that thing should or shouldn't matter.

  What I need back from you:

  - the exam question itself, pitched so it can't be answered by reciting the standard cases (we get 45 minutes, it's a 25-mark essay)
  - a model answer, about 600–700 words, that actually takes a line and defends it rather than sitting on the fence
  - a marking scheme out of 25, naming the specific moves an A-grade answer has to make, the point where a B-grade answer usually stops, and a one-line note on each classic mistake (e.g. what someone's doing if they just assert that omissions aren't causally relevant, or if they collapse the whole thing into 'the doctor intended it either way')

  Please write all of it in British English, I'll get told off otherwise.
