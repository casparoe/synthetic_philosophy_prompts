answer: |-
  Your diagnosis is sharp, and your suspicion is well-founded. You are not merely confused; you have identified the precise structural fault line that keeps this debate in a state of perpetual stalemate. Your distinction between a constitutive principle (what a system *is*) and a regulative one (how we *model* a system) is the correct lever to pry this open, though I would suggest the tension is slightly deeper than a simple bait-and-switch. It is a category error regarding the relationship between statistical description and physical mechanism.

  Here is the structure of the disagreement, assessed against your hypothesis, followed by a verdict on what would actually constitute progress.

  ### 1. Assessing Your Hypothesis: Constitutive vs. Regulative

  You propose that the Free Energy Principle (FEP) functions constitutively when sold ("this is what life *is*") and regulatively when defended ("this is how we *model* life"). This is accurate, but it is not necessarily a dishonest rhetorical sleight of hand. It is better understood as a conflation of **mathematical necessity** with **biological contingency**.

  *   **The Constitutive Claim (The Identity Reading):** This rests on the mathematical derivation that any random dynamical system with a Markov blanket can be described as minimising variational free energy. If this holds, the principle is indeed a tautology of sorts: to exist as a distinct system is to maintain bounds against entropy, and mathematics describes this as free energy minimisation. There is nothing to falsify here because it is a statement about the description of the system, not the system itself.
  *   **The Regulative Claim (The Optimisation Reading):** This is where active inference lives. It claims that biological systems do not merely *look like* they are minimising free energy; they have been selected by evolution to *actually* implement algorithms that approximate this minimisation efficiently. This is an empirical claim about mechanism and history.

  The disagreement persists because proponents often treat the constitutive claim as grounding the regulative one. They argue: "Because all self-organising systems must minimise free energy (constitutive), brains must use active inference (regulative)." Critics correctly point out that the jump from "can be described as" to "actually implements" is where the empirical content is supposed to live, and that is precisely where the evidence is often thinnest.

  So, your hypothesis is correct: the principle oscillates between a mathematical truth about descriptions and an empirical hypothesis about mechanisms. However, calling it a "bait-and-switch" implies intent. It is more likely a **scope ambiguity** inherent to the framework itself.

  ### 2. The Two Friends: Talking Past Each Other

  Your physicist friend and your modeller friend are indeed talking past each other, because they are operating at different levels of abstraction.

  *   **The Physicist (The Coarse-Graining Objection):** Your physicist friend is highlighting the **problem of arbitrary boundaries**. In statistical mechanics, one can often define a Markov blanket for almost any cluster of variables if one chooses the coarse-graining carefully enough. If the boundary is a choice of the modeller, then the "self" contained within it is also a choice of the modeller. If the FEP relies on the existence of a blanket, and the blanket is modeller-dependent, then the FEP describes the model, not the world. This attacks the *constitutive* reading.
  *   **The Modeller (The Generative Model Defence):** Your modeller friend is retreating to the **utility of the framework**. They are arguing that even if the blanket is somewhat arbitrary, the *generative model* posited within the active inference framework yields predictive success. They are treating FEP as a *regulative* heuristic: "Assume the system infers, and see if the behaviour matches." This bypasses the ontological question of whether the blanket is "real."

  The disconnect is this: The physicist is asking about **ontological commitment** (does the boundary exist in the world?), while the modeller is asking about **predictive adequacy** (does the equation fit the data?). The FEP literature often fails to distinguish between finding a blanket that *works* for modelling and proving a blanket *exists* for the system.

  ### 3. The Real Fault Line: Statistics vs. Causality

  You asked if there is a hidden formal or empirical question doing the real work. There is. It is the **link between statistical dependency and causal mechanism**.

  The FEP is formulated in terms of probability distributions and statistical boundaries (Markov blankets). However, minds and bodies are causal mechanisms. The fault line is the assumption that a statistical boundary (a blanket) maps cleanly onto a causal boundary (a skin, a membrane, a functional module).

  *   **The Critic's Worry:** Just because I can write down a probability distribution that separates internal states from external states does not mean the system *causally* operates to maintain that separation via inference. A candle flame maintains a boundary, but we do not usually grant it beliefs. If the FEP applies to the flame, what distinguishes the flame from the foraging agent?
  *   **The Proponent's Reply:** The distinction lies in the *complexity* of the generative model. The agent has a model that includes temporal depth and counterfactuals; the flame does not.

  But this moves the goalposts. If the FEP is a law of self-organising systems (constitutive), it should apply to the flame. If it only applies to systems with complex generative models (regulative), then it is not a fundamental law of life, but a specific theory of cognitive architecture. The disagreement is unwinnable because the proponents want the prestige of the former (a law of nature) with the explanatory power of the latter (a theory of mind).

  ### 4. Verdict: Is "Is the FEP a Theory?" Ill-Posed?

  Yes, the question is ill-posed, but not for the reason usually given. It is ill-posed because the FEP functions not as a single theory, but as a **Lakatosian research programme**.

  *   **Hard Core:** The mathematical claim that self-organisation implies free energy minimisation (unfalsifiable, constitutive).
  *   **Protective Belt:** The specific active inference models, neural implementations, and generative structures (falsifiable, regulative).

  When critics attack the hard core (saying it's trivial), proponents point to the protective belt (look at these successful models). When critics attack the belt (saying the models are just fancy curve-fitting), proponents retreat to the hard core (but it's a mathematical necessity!).

  This structure makes the row unwinnable in its current form. You cannot falsify a research programme with a single counterexample; you can only show that it is becoming degenerate (requiring more and more ad-hoc adjustments to fit data) compared to a progressive programme (predicting novel facts).

  ### 5. What Counts as Progress?

  To move this forward, we need to stop asking if the FEP is "true" and start asking where it diverges from alternatives. Progress would look like one of the following:

  1.  **A "Smoking Gun" Prediction:** A specific behavioural or neural phenomenon that Active Inference predicts *and* standard Reinforcement Learning (or control theory) predicts *differently*, followed by an experiment confirming the Active Inference prediction. Currently, many results are compatible with both, which allows the "it's just a description" critique to stand.
  2.  **A Formal Constraint on Blankets:** A mathematical proof or empirical criterion that defines which Markov blankets are "physical" (causally robust) and which are "artefactual" (modeller-dependent). This would address your physicist friend's concern directly. If proponents can show that only specific, causally grounded blankets support the kind of inference required for life, the triviality objection collapses.
  3.  **Admitting the Category Error:** Proponents could explicitly separate the **FEP-as-Physics** (a descriptive law of non-equilibrium steady states, applicable to flames) from **FEP-as-Cognitive-Science** (a claim about neural implementation). If they concede that the former does not automatically entail the latter, the "vacuous" critique loses its sting, but the burden of proof for the latter increases significantly.

  ### Conclusion

  Your reading of the situation is correct. The disagreement is substantive, but it is masked by verbal ambiguity regarding what counts as an "explanation." The FEP is treated as a fundamental law when it suits the narrative of unification, and as a modelling tool when it suits the defence against falsification.

  The fault line is the unproven assumption that statistical boundaries map to causal agents. Until there is a rigorous account of why *some* free-energy-minimising systems have minds and others (like flames) do not, without simply defining "mind" as "complex free-energy minimisation," the debate will remain in this loop.

  For your post, I would advise framing it not as an attack on the utility of active inference models (which clearly work), but as a demand for **ontological clarity**. Ask the proponents to specify: is the Markov blanket a feature of the world or a feature of the map? If the former, show us the causal mechanism. If the latter, admit the principle is regulative, not constitutive. Until that distinction is honoured, the stalemate will hold.
