answer: |-
  You are not being pedantic. You have identified a genuine logical inconsistency that drives professional historians up the wall, even if the general public uses it constantly.

  There is no single, universally standardized noun for this specific maneuver (like "The Gish Gallop" or "Godwin's Law"), but it is a recognized species of a broader logical fallacy.

  Here is the breakdown of the existing terminology, why none of them quite fit, a proposed coinage that does, and the honest state of scholarly consensus on the matter.

  ### 1. The Existing Labels (and why they miss)

  **Special Pleading (The Logical Category)**
  Logically, this is exactly what you are describing. Special pleading occurs when someone applies a standard, principle, or rule to others but exempts themselves (or their preferred subjects) without providing a relevant difference that justifies the exemption.
  *   **Fit:** Perfect logical fit.
  *   **Miss:** It's too broad. It covers everything from tax evasion to parenting. It doesn't capture the *historical/temporal* dimension.

  **Presentism (The Historiographical Sin)**
  Presentism is the anachronistic introduction of present-day ideas and perspectives into depictions or interpretations of the past.
  *   **Fit:** The accuser is accusing the defender of *avoiding* presentism for the villain but *embracing* it for the hero.
  *   **Miss:** "Presentism" is usually used as a accusation against the person *making* the judgment. In your scenario, the defender claims to be *avoiding* presentism for one figure while secretly relying on it for the other. It doesn't name the inconsistency itself.

  **Whig History (The Praise Side)**
  Whig history is the tendency to view the past as an inevitable progression toward the liberty and enlightenment of the present. Praising the abolitionist as "ahead of their time" is Whiggish.
  *   **Fit:** Explains the praise of the reformer.
  *   **Miss:** Doesn't explain the exoneration of the slaveholder. In fact, strict Whig history would condemn the slaveholder as an obstacle to progress. The defender is mixing Whig history (for the hero) with Hard Contextualism (for the villain).

  **The Historian's Fallacy (The Knowledge Problem)**
  This is the assumption that past actors had the same information we do.
  *   **Fit:** Relevant to the "they didn't know better" claim.
  *   **Miss:** As you noted, the "everyone thought that" claim is often factually false. The information *was* available; they just ignored it. This fallacy assumes ignorance; your scenario describes selective moral weighting.

  ### 2. The Coinage: "Asymmetric Contextualism"

  Since no single canonical term captures the *double standard* specifically, the most precise label currently in circulation among methodological critics is **Asymmetric Contextualism**.

  If you want to coin a term that captures the *rhetorical intent* (getting off the hook), I propose: **Strategic Contextualism**.

  **Definition:**
  *Strategic Contextualism* is the rhetorical practice of invoking historical context to exonerate a favored historical actor from moral blame, while simultaneously suspending that same contextual constraint to praise a different actor from the same period for transcending those norms.

  **The Edges (Clear Cases vs. Non-Cases):**

  *   **Clear Case (It IS Strategic Contextualism):**
      *   *Argument:* "You can't condemn Jefferson for owning slaves; it was the economic structure of the 18th century. But we should admire John Adams for freeing his slaves, because he was morally visionary."
      *   *Why:* If the economic structure compelled Jefferson, it compelled Adams. If Adams could transcend it, Jefferson is responsible for not doing so. You cannot hold both premises as true simultaneously.

  *   **Clear Case (It IS NOT Strategic Contextualism):**
      *   *Argument:* "Jefferson owned slaves, which was common, but he also wrote 'all men are created equal,' which created a contradiction he failed to resolve. Adams did not own slaves. We judge Jefferson harshly because he had the philosophical tools to know better, unlike a peasant of the same era."
      *   *Why:* This establishes a *relevant difference* (access to philosophy/power) that justifies different standards. It applies the same moral metric (responsibility correlates with knowledge/power) to both.

  *   **Clear Case (It IS NOT Strategic Contextualism):**
      *   *Argument:* "We should not judge anyone morally, neither Jefferson nor Adams. We should only understand their actions as products of their environment."
      *   *Why:* This is consistent Hard Contextualism. It blocks both blame *and* praise. It is boring, but logically consistent.

  ### 3. The "Everyone Thought That" Wrinkle

  You are correct that this claim is often historically false. Historians have a name for the assumption that a past era was morally monolithic: **The Myth of Moral Homogeneity**.

  In almost every era labeled "backward" by later standards, there were dissenters. There were anti-slavery voices in Rome. There were proponents of women's rights in the 17th century. When a defender says "everyone thought that," they are usually relying on **Survivorship Bias** (we remember the dominant voices) or **Archival Silencing** (the dissenters were suppressed).

  When this myth is deployed specifically to shut down argument, it is a form of **Epistemic Closure**.

  ### 4. The "Future Judgment" Wrinkle

  The argument *"In 100 years they'll think we're barbarians for eating meat"* is slightly different. It is not Strategic Contextualism; it is **Temporal Moral Skepticism** (or an **Appeal to Future Ignorance**).

  Its job is not to interpret history, but to neutralize current ethical pressure by relativizing the present. It argues that because moral standards *change*, they have no *binding authority*. Most ethicists reject this: the fact that standards change does not prove that no standard is correct (the "Moral Progress" counter-argument).

  ### 5. The State of Play: Is there a Consensus?

  You asked for straight talk on whether historians have solved this. **They have not.** It is one of the most contentious fault lines in the philosophy of history.

  **Camp A: The Contextualists (The "No Judgment" Camp)**
  *   **View:** The historian's job is to understand the past on its own terms, not to act as a judge. Moral judgment distorts understanding.
  *   **Key Thinkers:** Quentin Skinner (Cambridge School), many positivist historians.
  *   **Argument:** If we condemn past actors for not being us, we learn nothing about *their* reality. We turn history into a mirror.
  *   **Weakness:** It risks becoming an apology for atrocity. It creates the "Asymmetric Contextualism" problem you noticed when these historians inevitably praise "progressive" figures.

  **Camp B: The Moralists (The "Judgment is Necessary" Camp)**
  *   **View:** History is an ethical discipline. Refusing to judge is itself a moral stance (complicity). We *must* judge the past to orient ourselves in the present.
  *   **Key Thinkers:** Martha Nussbaum, Thomas Laqueur, many public historians and memory scholars.
  *   **Argument:** If we cannot condemn slavery in the past, our condemnation of it now is weakened. History provides case studies for ethical reasoning.
  *   **Weakness:** It risks Presentism and caricature. It can flatten complex historical actors into villains and heroes.

  **Camp C: The Distinction Camp (The "Understanding vs. Exoneration" Middle)**
  *   **View:** We can *explain* an action via context without *exonerating* it.
  *   **Key Thinkers:** Michael Rothberg, many contemporary synthesis historians.
  *   **Argument:** "I understand why you did it (context), but it was still wrong (judgment)." This attempts to hold both lines.
  *   **Status:** This is the dominant *aspirational* stance in modern academia, but it is difficult to execute in practice without slipping into Asymmetric Contextualism.

  **The Verdict:**
  There is no consensus. The field is currently swinging back toward Camp B (Moralism) after decades of Camp A (Contextualism) dominance, largely due to public pressure (e.g., statue removals, reparations debates).

  However, almost all professional historians agree on one thing: **The "Man of His Time" defense is historically invalid if contemporaries existed who disagreed.** If a dissenting viewpoint was available and accessible, the actor had moral agency. Claiming they didn't is bad history, regardless of the moral philosophy.

  ### Summary for your arguments

  1.  **The Logical Flaw:** Special Pleading.
  2.  **The Historiographical Flaw:** Asymmetric Contextualism (or Strategic Contextualism).
  3.  **The Factual Flaw:** The Myth of Moral Homogeneity.
  4.  **The Consensus:** There isn't one on *whether* to judge, but there is strong agreement that *inconsistently* judging (your scenario) is methodologically bankrupt.

  You are safe to call this out. It is not pedantry; it is a demand for logical consistency in ethical reasoning.
