      *   Hilary Putnam (Multiple Realizability).
      *   David Marr (Levels of Analysis).
      *   Connectionism/PDP (Distributed representation).
      *   Searle (Chinese Room - as a counterpoint to address).

  8.  **Final Review against Constraints:**
