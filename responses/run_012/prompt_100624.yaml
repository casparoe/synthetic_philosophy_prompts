          3.  **Observer-Independence:** Real minds must be mind-independent. (Nuanced: Intentionality is often relational).
          4.  **Centralization = Reality:** A central store makes it more "real." (Mistaken: Centralization is an architectural choice, not an ontological one).
      *   *The Dissolving Distinction:* **Implementation Level vs. Design Level (Marr).** Or **Vehicle vs. Content.** The belief isn't a *thing*; it's a *state of the system*.
      *   *The Verdict:* Adding the queen doesn't solve the philosophical problem; it just hides it. Aunt Hillary *can* have real beliefs if the causal dynamics support counterfactuals, regardless of localization.
      *   *Advice for the Simulation:* Don't add the queen if you want emergent cognition. Instead, focus on *causal efficacy*. Does the "belief" drive behavior in a way that adapts to the environment?

  6.  **Refining the Tone:**
