      3.  **Theory of Change:** The standard "make prisons nicer" pitch fails because it misidentifies the causal mechanism. It assumes humane treatment inside instills pro-social behavior that persists outside, ignoring that behavior is context-dependent. A person acted upon by dignity inside but stigma and poverty outside will revert to survival strategies, not prison-learned norms. This view exposes the "Halden copycat" movement as superficial if it doesn't import the Norwegian social contract. Without the welfare state, a nice prison is just a polite waiting room for recidivism.

