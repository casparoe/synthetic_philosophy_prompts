answer: |-
  If your friend's analysis holds, then lowering recidivism is fundamentally a welfare policy challenge rather than a corrections challenge, meaning prison reform efforts that ignore post-release infrastructure are destined to fail regardless of how humane the cells are.

  This implication collapses the traditional distinction between punishment and rehabilitation, revealing that effective rehabilitation is indistinguishable from economic redistribution. If the mechanism for preventing reoffending is housing, healthcare, and employability rather than therapy or humane confinement, then "rehabilitation" is not a psychological process but a material one. This does not let retributivists off the hook; instead, it undermines the moral coherence of retribution itself. Retributive justice assumes a citizen pays a debt to society and returns to the fold, but if the state actively disables that return through benefit stripping, voting bans, and employment barriers, the punishment extends indefinitely beyond the sentence. You cannot claim justice is served if the structure guarantees a new crime, making the state complicit in the recidivism it claims to punish.

  For budgeting, this means a state serious about public safety must shift funding from Departments of Correction to Departments of Housing, Health, and Labor. Building a Halden-style facility in a US state is capital misallocation if the exit door leads to homelessness, because the marginal dollar spent on transitional housing or restoring Medicaid eligibility yields higher public safety returns than the marginal dollar spent on architectural humane design. The focus must move from "throughcare" inside the walls to continuity of care outside them, treating incarceration as a temporary interruption of citizenship rather than a system exit. This requires stopping the practice of suspending benefits during incarceration and investing in job markets that absorb people with records, acknowledging that the prison budget is the wrong place to solve the crime problem.

  Finally, this exposes the standard "make prisons nicer" pitch as a theory of change based on a false causal mechanism. That pitch assumes humane treatment inside instills pro-social behavior that persists outside, ignoring that behavior is context-dependent. A person acted upon by dignity inside but stigma and poverty outside will revert to survival strategies, not prison-learned norms. This view reveals the "Halden copycat" movement as superficial if it doesn't import the Norwegian social contract, proving that without the welfare state, a nice prison is just a polite waiting room for recidivism. Reformers risk building resorts that feed into a pipeline of poverty, mistaking the correlation of nice prisons and low crime for causation while ignoring the confounding variable of the welfare state.
