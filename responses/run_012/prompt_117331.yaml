  2.  **Deconstruct the Competencies (The "Levels"):**
      *   *Grandmother:* **Embodied/Instinctive Knowledge.** Muscle memory, sensory calibration, deep pattern recognition within a narrow scope. It's *tacit knowledge*. She *is* the recipe.
      *   *Mother:* **Conceptual/Principled Knowledge.** Understanding the *why*. Mental models of chemistry and physics (emulsions, heat transfer). Adaptive expertise. She *knows* the recipe.
