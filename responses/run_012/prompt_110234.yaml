  3.  **Evaluate the Steps for Flaws:**

      *   *Step 1:* Is differential cost *always* required for honesty? In biology, yes, for *stable* equilibrium in certain contexts. But "honest" can mean different things (mechanical constraint vs. strategic cost). However, for the sake of the user's commitment to the Handicap Principle, let's tentatively keep this.
      *   *Step 2:* Are kindness/morality signals? Yes, broadly speaking.
      *   *Step 3:* Follows from 1 & 2.
