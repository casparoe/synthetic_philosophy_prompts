          *   *The Handicap Principle nuance:* It's not about absolute cost; it's about *marginal* cost relative to quality. A low-quality sender *cannot* afford the same signal as a high-quality sender *at the equilibrium level*, not because the cost is infinite, but because the net benefit is negative for them while positive for the high-quality sender.
          *   *The "Ruins the Sender" fallacy:* Signaling theory does *not* require the sender to be ruined. It requires the signal to be too costly *for the faker to mimic profitably*. If the reward is $100, and the signal costs $10 for a high-quality person but $15 for a low-quality person, the low-quality person *could* pay $15 if they only cared about that one transaction. But signaling is usually iterative or tied to underlying capacity.
