prompt: |-
  Right, so I'm doing an ethics unit in sixth form and we've been on the 'moral equality of combatants' — the idea that it doesn't matter whether your side's cause is just, once you're a soldier you're permitted to kill enemy soldiers and they're permitted to kill you, and neither side's soldiers count as murderers. I want the most important implications of the doctrine, but from a specific angle. I read somewhere that maybe the equality is really a legal one (the 'combatant's privilege' — you can't be prosecuted under the laws of war for killing an enemy combatant) rather than a genuinely moral one, and I can't figure out what actualy follows from that distinction.

  So: if the moral equality is really just a legal convention that stops every war ending in mass murder trials, does it still hold up morally? What are the most important implications for (a) a conscript who's fairly sure his own side is in the wrong but can't get out of it, (b) a drone operator doing strikes from a base in Lincolnshire, (c) the fact that we do prosecute leaders for the crime of aggression but not the soldiers who do the actual killing, and (d) conscientious objectors? And if someone rejects the equality altogether — says unjust combatants are basically armed robbers and their killing is murder — what's the most important thing that breaks first: the law of armed conflict, or just our ordinary intuitions about soldiers?

  Please also say how confident you are in what you're claiming, and single out the point you're least sure about. British English please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Moral Equality of Combatants (MEC) in the context of Just War Theory (Sixth Form Ethics unit).
      *   **Specific Angle:** The distinction between *legal* equality (Combatant's Privilege) and *moral* equality. The user wants to know if MEC holds up morally if it's just a legal convention to prevent mass trials.
      *   **Specific Scenarios to Address:**
