      *   *Revisionist View (McMahan, Rodin, etc.):* MEC is legally useful but morally false. Unjust combatants are not morally permitted to kill just combatants (self-defence doesn't apply against those defending themselves).
      *   *The User's Premise:* If MEC is *only* a legal convention (pragmatic), does it have moral weight?
      *   *Key Distinction:* *Jus ad Bellum* (justice of war) vs. *Jus in Bello* (justice in war). MEC separates these. Revisionists argue they are linked.

  3.  **Address the Specific Scenarios:**

      *   **(a) The Conscript on the Unjust Side:**
          *   *Legal MEC:* He is safe from prosecution if he follows IHL.
          *   *Moral MEC (if false):* He is morally culpable, perhaps less so due to duress/coercion, but still participating in wrongful harm.
          *   *Implication:* If it's just legal, he faces a moral dilemma the law ignores. He might be legally protected but morally guilty.
      *   **(b) The Drone Operator (Lincolnshire):**
          *   *Challenge to MEC:* Distance and safety challenge the "reciprocal risk" that often underpins the moral justification for MEC.
          *   *Implication:* If MEC is just legal, the drone operator is legally privileged. If MEC is morally false (and their war is unjust), they are essentially remote executioners. The legal shield protects them from murder charges, but morally they might be no different from a hitman.
      *   **(c) Leaders vs. Soldiers:**
          *   *Current Law:* Leaders prosecuted for Aggression (Crime against Peace); soldiers protected by Combatant's Privilege.
          *   *Implication:* This asymmetry supports the "legal convention" view. It acknowledges the war might be criminal (leaders) but treats the fighting as a separate sphere (soldiers). If MEC is morally false, this is a pragmatic compromise, not a moral truth. It creates a "responsibility gap."
      *   **(d) Conscientious Objectors:**
          *   *Implication:* If MEC is morally true, objecting to an *unjust* war while accepting a *just* one makes sense. If MEC is morally false (unjust killing is always wrong), then conscientious objection becomes a stronger moral duty, not just a personal preference. The law often distinguishes between universal and selective objection. If MEC is just legal, selective objection gains moral ground.
      *   **(e) What breaks first if MEC is rejected?**
          *   *Option 1: Law of Armed Conflict (LOAC).* If unjust soldiers are murderers, IHL collapses. They have no incentive to follow rules if they are criminals anyway.
          *   *Option 2: Ordinary Intuitions.* We tend to think soldiers aren't murderers.
          *   *Analysis:* The Law breaks first conceptually, but practically, our intuitions might bend. However, the *functionality* of war regulation relies on MEC. Without it, war becomes total criminality.

