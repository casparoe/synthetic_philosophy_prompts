  She knew the waves on the cornea's curve,
  The true frequencies bouncing off the wall,
  How cones absorb the photons, send the nerve,
  Through pathways deep within the brain to call
  Upon the cortex where the signals meet,
  Opposing channels firing in their turn,
  One set suppressed while others rise to greet
  The data from the objects that they scan.
  But now I step beyond the glass and see
  Outside the reach of any sterile count,
  A sudden presence flooding over me,
  More than the sum of any mere account.
  I hold the truth no textbook could defend,
  And stand within the light of living red.
