answer: |-
  **Transcript of Argument: The Chip and The Coward**
  **Participants:** Me, Dan.
  **Location:** The pub, post-debate.
  **Subject:** Free Will, PAP, and homemade Frankfurt cases.

  **Me:** Right. Two hours in, my head's buzzing, and I still don't know if I'm right or if you've just talked me in circles. Let's reset. No jargon unless we explain it. We're looking at whether these two cases actually kill the idea that you need alternatives to be responsible.

  **Dan:** Agreed. And let's be clear: I'm not trying to say determinism is true. I'm saying that even if you *could* have done otherwise, it doesn't matter for responsibility. That's what Frankfurt showed.

  **Me:** But Frankfurt's original case relied on a sure-fire blocker. A neuroscientist who *guarantees* the result if you waver. My Case A—the half-hearted chip—doesn't guarantee anything. It's 99 per cent.

  **Dan:** So?

  **Me:** So, if there's a one per cent chance I don't vote, even with the chip active, then I *can* do otherwise. The Principle of Alternative Possibilities (PAP) says responsibility requires the ability to do otherwise. If the ability is there, even if it's unlikely, PAP stands. You haven't killed it; you've just made the alternative path a bit steeper.

  **Dan:** You're fixating on the modal logic—the 'possible worlds' stuff—and missing the moral point. In the actual sequence of events, where Jane votes willingly, the chip does nothing. It sits there. She votes because she wants to. The fact that there's a tiny, remote possibility she could have fought the chip doesn't explain *why* she's responsible. She's responsible because of what actually happened, not because of what might have happened in a ghost world.

  **Me:** But that 'ghost world' is the only thing separating this from manipulation. If the chip pushes her 99 per cent of the way, isn't it just a very strong nudge? If I put a gun to your head, there's still a one per cent chance you defy me. Does that make you responsible for handing over your wallet?

  **Dan:** That's a bad analogy. A gun is an actual constraint in the sequence. The chip is a counterfactual constraint. It only wakes up if she wavers. In the scenario where she votes willingly, the chip is inert.

  **Me:** But in my case, the chip *isn't* inert if she wavers. It actively loads the dice. It changes the probabilities.

  **Dan:** Okay, let's grant that. Let's say in the actual world she wavers slightly, the chip nudges her probability to 99 per cent, and she votes. You say she's not fully responsible because she *could* have beaten the odds. I say that one per cent possibility is too 'flickery' to ground responsibility. Philosophers call this the 'robustness' objection. An alternative possibility only matters if it's robust enough to be a real option. A one per cent chance of resisting a neural nudge isn't a real option; it's a lottery ticket.

  **Me:** That feels like moving the goalposts. You're saying PAP is false unless the alternative is *likely*? Since when did freedom require probability? Freedom is about capacity. If I have the capacity, even if it's hard to exercise, I have alternatives.

  **Dan:** No, I'm saying that if the alternative is that flimsy, it can't be what *grounds* our intuition that she's responsible. We don't look at Jane and think, 'She's responsible because there was a 1 per cent chance she wouldn't vote.' We think she's responsible because the vote flowed from her own desires. The chip is irrelevant to the actual explanation. If the actual explanation is sufficient for responsibility, then the existence of alternatives is redundant.

  **Me:** But if the chip is loading the dice, isn't it part of the actual explanation? You're trying to have it both ways. Either the chip intervenes or it doesn't. If it doesn't, it's just a standard free choice, and PAP holds. If it does intervene to raise the probability, then her will is compromised.

  **Dan:** It intervenes to ensure the *sign* of wavering doesn't lead to non-voting. But look, this is why Case A is messy. It's probabilistic. Let's move to Case B. The Past Self. That's cleaner. Jane sets up the message a month ago. On the day, she wavers, the message comes, she votes. She can't do otherwise on the day.

  **Me:** Exactly. On the day. But she could have done otherwise a month ago. She chose to set up the system. That's the 'tracing' strategy. You trace her responsibility back to the moment she had full freedom.

  **Dan:** And I say that concedes the point. You're admitting she's responsible *now*, at polling time, even though she has no alternatives *now*. You're just hunting for a moment in the past where PAP held to make yourself feel better. But if she's responsible now without alternatives now, then PAP is false as a general principle. It doesn't matter where the freedom was, it matters that she's the source.

  **Me:** It matters immensely where the freedom was. If the only freedom was a month ago, then this isn't a counterexample to PAP, it's an application of it. You're saying PAP is dead because she's responsible at $t_2$ without alternatives at $t_2$. I'm saying PAP is alive because the responsibility at $t_2$ is borrowed from $t_1$. If she hadn't been free at $t_1$, she wouldn't be responsible at $t_2$. Therefore, freedom is still the necessary condition.

  **Dan:** That's the 'flicker of freedom' defence again. You're relocating the flicker. But ask yourself: why does the past choice matter? It matters because it makes her the *source* of the action. But if sourcehood is doing the work, why do we need the alternatives at $t_1$? Imagine a variation: what if her past self was determined to set up the message? Say, her upbringing made her cowardly and she *had* to set up the system.

  **Me:** Then she's not responsible.

  **Dan:** Why not? The structure is the same. She votes, she wanted to vote, the mechanism is hers.

  **Me:** Because the chain of responsibility has to start somewhere. If every link is determined, nothing is free. If you say she's responsible even if the past self was determined, you're a hard determinist or a compatibilist who thinks 'freedom' just means 'acting on your desires'. But we're arguing about PAP. If the past self was determined, she had no alternatives at $t_1$ either. So if you say she's still responsible, you've killed PAP completely.

  **Dan:** Good. Maybe I have.

  **Me:** But then you owe me an account of why we blame her. If she couldn't have set up the system, and she couldn't have voted differently on the day, where's the blame?

  **Dan:** In the fact that it's *her*. It's her psychology, her values. That's 'sourcehood'. Alternatives are just a proxy for sourcehood. We usually think if you have alternatives, you're the source. But Frankfurt cases show you can be the source without the alternatives. Case B shows you can be the source even if the alternatives were pushed back in time.

  **Me:** But Case B only works if the past self was free. If the past self wasn't free, your 'sourcehood' looks like luck. If it *was* free, then PAP is satisfied, just at a different time. You haven't found a case where someone is responsible with *no* alternatives ever. You've just found a case where the alternatives are distant.

  **Dan:** Is there a practical difference? Suppose I'm a thief. I train myself for years to have no hesitation when I see a safe. On the day, I see the safe, I have no hesitation, I can't stop myself. Am I responsible?

  **Me:** Yes, because you trained yourself.

  **Dan:** But on the day, no PAP.

  **Me:** Because of the tracing.

  **Dan:** But suppose the training was inevitable? Suppose you're a product of your environment, you couldn't have trained otherwise?

  **Me:** Then we're in deep water. But sticking to the case: Jane *was* free a month ago. She chose to bind herself. So, at the relevant time where the responsibility was generated, PAP held.

  **Dan:** You're treating responsibility like a substance you store in a jar at $t_1$ and pour out at $t_2$. It's not like that. Responsibility is about the relationship between the agent and the action *now*. The past choice just secures the link.

  **Me:** But the link is only moral if the past choice was free. If I kidnap you and program you to rob a bank next week, you're not responsible next week. Why? Because the setup wasn't free. So the freedom of the setup is essential. If the freedom of the setup is essential, then alternatives are essential. You haven't killed PAP; you've just hidden it in the history books.

  **Dan:** Okay, let's look at the dilemma then. This is the bit that usually stalls us. In Case B, either the sign of her wavering (which triggers the message) is determined or it isn't.
  If it is determined, then she never had a chance to avoid the message. Then you say she's not responsible.
  If it isn't determined, then there's a chance she wouldn't waver, the message wouldn't send, and she could choose freely.
  You say if that second option is true, PAP survives. I say it doesn't matter. Because in the sequence where she *does* waver and the message *does* send, she's locked in.

  **Me:** But if the second option is true—if she could have not wavered—then she had an alternative possibility. She could have avoided the whole trap. That's a robust alternative. She could have voted freely *or* triggered the message.

  **Dan:** But she can't vote freely *and* trigger the message. Once the message triggers, she's locked.

  **Me:** But she could have avoided the trigger. That's the 'flicker'. It's small, but it's real. She could have been the kind of person who didn't waver.

  **Dan:** Is that enough? Is the ability to not waver enough to ground responsibility for the vote?

  **Me:** It has to be. If you deny that, you're saying responsibility doesn't require any freedom anywhere.

  **Dan:** I'm saying it requires *sourcehood*, not *leeway*. Leeway is having options. Sourcehood is being the origin. Case B shows you can have sourcehood without leeway at the moment of action. Case A shows you can have sourcehood even if the leeway is probabilistic noise.

  **Me:** But sourcehood without leeway is just determinism with extra steps. If I am the source, but I couldn't have done otherwise, why am I praiseworthy?

  **Dan:** Because it's *you*. Look, think about love. I can't choose to stop loving my kid. I have no alternative. But my care is valuable *because* it's necessitated by who I am. If I could toggle it on and off, it would be less valuable.

  **Me:** That's poetic, Dan, but we're talking about voting and moral blame. If I can't do otherwise, punishment makes no sense.

  **Dan:** Punishment is forward-looking. But responsibility... responsibility is about ownership.

  **Me:** And ownership requires that you could have declined to own it.

  **Dan:** Not necessarily.

  **Me:** Then we're stuck.

  **Dan:** We are. But look at where we are. On Case A, you're relying on the 1 per cent chance being morally significant. I'm relying on the actual sequence being what matters. On Case B, you're relying on the past freedom transferring to the present. I'm relying on the present sourcehood being sufficient.

  **Me:** So, do I win?

  **Dan:** You win if you think PAP is the only game in town. If you think freedom *must* mean 'could have done otherwise', then my cases fail because there's always a tiny flicker or a past choice.

  **Me:** And you win?

  **Dan:** I win if you think responsibility is about who you are, not what options you had. If sourcehood is the real currency, then PAP was never the king. My cases show that sourcehood can exist even when leeway is squeezed out, either by probability or by time.

  **Me:** But my Cases show that you can't squeeze it out completely. There's always a leak. In Case A, the 1 per cent. In Case B, the past choice.

  **Dan:** Maybe. But if the leak is that small, does it do any work?

  **Me:** It does the work of keeping the definition of 'free' honest.

  **Dan:** And my work keeps the definition of 'responsible' human.

  **Me:** Right. Well. Another pint?

  **Dan:** Go on. But I'm not paying. I voted.

  **Me:** You had no choice.

  **Dan:** Exactly.
