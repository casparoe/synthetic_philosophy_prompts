answer: |-
  ### Brainstorming: Criteria for Mechanism Individuation

  1.  **Structural Sameness:** Mechanisms are identical if they rely on the same physical subcomponents (weights, neurons) performing the same activities.
      *   *Anomaly Case:* A model fails on a new input using the exact same attention heads as before.
      *   *Verdict:* Same mechanism, merely stressed beyond design parameters.
  2.  **Functional Sameness:** Mechanisms are identical if they map inputs to outputs via the same causal role within the larger system.
      *   *Anomaly Case:* The model produces a qualitatively different output class despite using similar components.
      *   *Verdict:* Different mechanism, because the causal contribution to the system goal has shifted.
  3.  **Interventional Sameness:** Mechanisms are identical if they respond invariantly to a specific set of causal interventions (e.g., activation patching, ablation).
      *   *Anomaly Case:* Patching the suspected components restores performance on old data but fails to correct the new anomaly.
      *   *Verdict:* Different mechanism, because the causal leverage points have changed.
  4.  **Explanatory Sameness:** Mechanisms are identical if they support the same compressed narrative for a specific audience.
      *   *Anomaly Case:* The previous explanation ("it copies previous tokens") no longer makes sense to the engineer regarding the new output.
      *   *Verdict:* New mechanism, because the explanatory utility has collapsed.

  **Convergence:** We will build this project around **Interventional Sameness**. While structural data is available and explanatory utility is the ultimate goal, interventional stability offers the only criterion that is both empirically testable in our lab setting and philosophically robust enough to ground causal claims. It bridges the engineer's need for control and the philosopher's requirement for causal structure.

  ***

  ### Proposal: Operationalizing Mechanism Identity in Anomalous Model Behavior

  **Research Question**
  Our primary objective is to answer a specific, determinate question: *What minimal set of interventional tests distinguishes a known mechanism operating out-of-distribution from a distinct mechanism operating in-distribution?* We seek to produce a decision procedure that yields high inter-rater reliability among lab members when classifying unexpected model outputs. A successful result is not a metaphysical definition of "mechanism," but a operational protocol that settles disputes about whether a bug is a "failure mode" or a "new feature." If we can demonstrate that our protocol allows independent researchers to classify the same anomalies with a Cohen's kappa coefficient above 0.8, we have settled the question for practical purposes.

  **Context and Motivation**
  In our daily work, we treat the word "mechanism" as a stable token. We say we have "found the mechanism" for induction, or that a failure is "the same mechanism misfiring." However, when we interrogate these claims, we find we are trading on different criteria without acknowledging the swap. The philosophy of science literature offers general accounts of mechanistic explanation, focusing on hierarchical organization and productive continuity. The mechanistic interpretability literature offers practical techniques for localization and patching. Neither literature fully addresses the specific epistemic crisis that occurs during anomaly detection.

  General philosophical accounts tend to prioritize ontological stability—they ask what makes a mechanism a natural kind. This is too slow and too abstract for our pace. We do not need to know if a circuit is a natural kind; we need to know if we should patch it or retrain the model. Conversely, standard interpretability methodology often assumes individuation is solved by localization. If we find the same neurons active, we assume it is the same mechanism. But as our brainstorming highlighted, structural sameness does not guarantee functional or interventional sameness. A neuron can be polysemantic, participating in multiple distinct causal pathways depending on context. When an anomaly occurs, relying solely on activation patterns leads to false negatives: we assume we understand the failure because the lights are on in the same place, even if the wiring has effectively changed.

  This gap leaves us vulnerable to two errors. First, we may overfit our explanations, claiming a single mechanism covers too much ground, which blinds us to emergent risks. Second, we may fragment our understanding, treating every distributional shift as a new mechanism, which prevents generalization. The anomaly case is precisely where these criteria come apart. Under normal conditions, structure, function, and intervention align. Under stress, they diverge. Our project posits that existing answers leave this narrow question open because they do not prioritize *discriminatory power* under uncertainty. We are not asking what a mechanism *is*; we are asking what evidence forces us to admit a mechanism has *changed*.

  **Methodology**
  We propose a six-month mixed-methods project combining semantic analysis of our own practice with empirical testing on a schematic anomaly case. We will not conduct a survey of practitioners, nor will we build a new benchmark, nor will we attempt a formal treatment of causal graphs.

  A survey would capture self-reported beliefs, not actual decision-making processes. Engineers often rationalize their choices post-hoc; we need to observe the criteria actually used in the moment of discovery. A benchmark would measure performance, not conceptual clarity. We could achieve high accuracy on an anomaly detection task without agreeing on why the anomaly occurred, which defeats the purpose of interpretability. A formal causal graph treatment is tempting, but neural networks are not Bayesian networks. The approximation error required to map weights onto a discrete causal graph often swamps the conceptual clarity gained. We would spend six months fighting the formalism rather than analyzing the practice.

  Instead, we will treat our lab's vocabulary as data. We will record and transcribe all model debugging sessions and interpretability meetings where the word "mechanism" or "circuit" is used in the context of an unexpected output. This ethnographic layer allows us to catalog the tacit criteria currently in use. Simultaneously, we will execute a controlled empirical study on a single, schematic anomaly case.

  *Weeks 1-4: Corpus Collection and Coding.* We will aggregate logs from the past year and record current sessions. We will code instances where a team member claims "same mechanism" or "new mechanism" against the evidence they cite (e.g., did they mention weights, inputs, or patching results?).
  *Weeks 5-12: Case Study Construction.* We will construct a schematic anomaly using a standard transformer decoder. We will identify a known circuit (e.g., an induction head) and engineer a distributional shift where the circuit activates but produces a qualitatively different output type. This will be labeled as schematic; we do not claim this is a universal finding, but a testbed for our criteria.
  *Weeks 13-20: Protocol Development and Testing.* We will draft the Interventional Stability Protocol. This checklist will require specific patching tests before an anomaly can be classified as "same mechanism." We will test this protocol on the case study with five independent lab members.
  *Weeks 21-24: Analysis and Deliverable Finalization.* We will calculate inter-rater reliability and refine the protocol based on failure modes.

  **Worked Anomaly Case**
  To ensure our method is grounded, we will focus on a specific schematic case: the "Polysemantic Currency" anomaly. Suppose we have identified a set of neurons that reliably activate when the model processes financial data and predicts currency symbols. We claim this is the "financial mechanism." Suddenly, the model begins generating currency symbols in the middle of poetic text where no financial context exists.

  Under *Structural Sameness*, this is the same mechanism: the same neurons are firing. Under *Functional Sameness*, it is different: the input-output profile has shifted from "finance" to "aesthetic decoration." Under *Interventional Sameness*, we test by ablating these neurons. If the ablation stops the currency symbols in finance text but *not* in poetry, we have evidence of two distinct causal pathways sharing components. If the ablation stops both, it is one mechanism overextending. Our protocol will mandate this ablation test. Without it, the structural claim masks the functional divergence. This case is arguable—some team members will insist it is the same mechanism behaving strangely—but it is precisely this argument we aim to resolve procedurally.

  **Deliverables and Success Conditions**
  Our primary deliverable is the **Anomaly Classification Protocol (ACP)**, a one-page checklist for the lab. It will list the necessary interventional steps required to validate a claim of mechanism identity during debugging. Success is defined quantitatively: when five lab members use the ACP to classify ten distinct anomaly logs, their agreement must exceed a kappa of 0.8. Secondary deliverables include a white paper detailing the semantic analysis of our vocabulary, highlighting where our talk diverges from our practice.

  Failure is defined as an inability to reach consensus even with the protocol. If the kappa remains below 0.6, it suggests that "mechanism" is too polysemous to be operationalized this way, or that interventional testing is too noisy to serve as a ground truth. In that case, our result is still valuable: it proves that our current conceptual toolkit is insufficient for safety-critical debugging.

  **Evidence for Change of Mind**
  We must remain open to the possibility that Interventional Sameness is the wrong criterion. If, during weeks 13-20, we find that interventional tests are consistently unstable—i.e., small changes in random seed change the outcome of the patching test—we will be forced to pivot. If the causal leverage points are too fragile, we cannot build a decision procedure on them. In this event, we would shift focus to **Explanatory Sameness**. We would investigate whether the utility of the mechanism claim lies not in causal control, but in compressing information for the human debugger. If intervention fails, the "mechanism" may be purely pragmatic. We would then redesign the ACP to focus on explanatory coverage rather than causal stability.

  **Scope and Risks**
  The primary risk is scope creep. It is tempting to try to solve mechanism individuation generally, or to apply our protocol across multiple model architectures. This is too big for six months. If we attempt to cover transformers, convnets, and recurrent models, we will drown in architectural specifics. If we encounter this bottleneck, we will cut the architectural variety immediately. We will restrict the project to decoder-only transformers, as this is the lab's primary focus. This ensures depth over breadth.

  Another risk is the "philosophical drift," where we spend too much time debating definitions rather than testing them. To mitigate this, we have tied our success metric to inter-rater reliability, not philosophical coherence. We are not writing a thesis; we are building a tool. If a philosophical distinction does not change the checklist, it is cut.

  Finally, there is the risk that the lab's vocabulary is too inconsistent to analyze. If our transcripts show no pattern in how we use "mechanism," the ethnographic layer will yield null results. We mitigate this by focusing on *dispute* moments. We will specifically look for meetings where disagreement occurred. These are the high-signal data points where criteria are forced to the surface.

  **Conclusion**
  This project acknowledges that the philosophy of science and mechanistic interpretability are not describing the same object when they say "mechanism." The philosopher seeks stability; the engineer seeks leverage. By focusing on the anomaly case, we find the stress point where these goals conflict. Our proposal does not ask us to agree on a theory of mechanisms. It asks us to agree on a test for when a mechanism has changed. This is a lower bar, but a higher utility one. For a pilot grant, it offers a clear path to a tangible tool that improves our daily reasoning, while generating data on the conceptual friction inherent in interdisciplinary AI safety work. We will know we have succeeded not when we have defined the truth, but when we can stop arguing about it and start fixing the model.
