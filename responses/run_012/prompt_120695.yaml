  My friend and I just spent three hours arguing about whether anything that isn't a living animal can genuinely think about stuff, and now I want to know what she'd say about a case we never got to. Her track record, as best I can reconstruct it:

  - Thermostat: no beliefs, no aboutness, just a switch.
  - The coin machine at the laundromat that's set to only take real quarters: she says it doesn't really believe a quarter is real, it just does what we designed it to do. The "belief" is ours, not its.
  - Chess program that crushes her: no understanding, no wanting to win, just symbol-shuffling, even though it's useful to talk about it as if it wants things.
  - Her dog: real beliefs and desires, obviously.
  - A plant bending toward light: no, that's just a tropism.
  - A bee doing its dance to tell the hive where the nectar is: she waffled a bit but landed on yes, the bee really does represent the location.
  - A chatbot that can talk for hours about anything: no, no matter how good it gets, it's all borrowed.
  - Me: yes (I checked).

  Now the new case. A robot with a body, persistent memory, and a rechargeable battery. It maps the room, remembers where the outlets are, avoids the cat, and when the battery gets low it says it doesn't want to run out of power and goes and plugs itself in. It was built by engineers, not evolved. What does she say?

  I care alot less about the yes/no than about the rule she's actually running, the other rules that fit her verdicts just as well, which of them diverge on the robot, and what further case would actually tell them apart. If the only rule that fits everything is "it has to be meat," just tell me that, because I think that's where she's headed. Please answer in American English.
