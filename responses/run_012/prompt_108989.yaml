  **The practice as I see it**
  You pour water while monks chant, intending to transfer merit to your grandmother. Your aunt says she receives it, easing her journey. Your uncle objects that "no-self" means there's no one to receive it. Yet, everyday talk about karma and rebirth similarly implies a persistent "I" who owns actions and future lives, clashing with the doctrine that persons are just fleeting aggregates. You want to know if the ritual secretly requires a soul, or if there's a coherent way to understand it without one.

  **The obvious presupposition**
  Taken at face value, the water ritual looks like a transaction between two distinct entities. You are the giver; she is the receiver. For her to receive something, she must exist as a continuous subject capable of holding merit like a bank account. This presupposes a persisting identity that survives death, retains connection, and benefits from external actions. It quietly rules out strict eliminativism—the idea that death is simply the end of the causal chain labeled "grandmother." It conflicts with a hard reading of no-self where "grandmother" is merely a label for temporary processes that disperse completely at death. If the ritual works literally, there must be *someone* home to welcome the merit, suggesting a subtle soul or consciousness-core that persists despite philosophical denials. This aligns with folk-religious interpretations where the deceased becomes a spirit waiting for help. It assumes a dualism between living and dead that maintains personal identity. The tension isn't just about the water; it's about the grammar of karma. When we say "I will reap what I sow," the "I" implies a subject enduring from action to result. The ritual makes this implicit metaphysics explicit: there is a destination for your generosity. Without a recipient, the water pours into nothing. Thus, the practice seems to commit you to a form of personal continuity that survives the dissolution of the body, functioning as a stable locus for moral credit. This view makes sense of your aunt's comfort but invites your uncle's critique.

  **Does the ritual actually need it?**
  Buddhist philosophy offers a way out, though it requires shifting how we understand "receiving." In Abhidharma thought, there is no soul, but there is causal continuity. Think of a flame lighting another candle. The flame doesn't "travel," but the second flame depends on the first. Similarly, your grandmother was a stream of mental and physical events. Death interrupts the physical support, but the causal momentum continues into a new configuration. When you share merit, you aren't sending a package to a static person; you are altering the conditions surrounding that causal stream. The "recipient" is a conventional designation for a specific continuity of consciousness that retains karmic links to you. The water pouring is a symbolic intensification of your intention to dedicate goodwill to that specific stream.

  To make this work, we distinguish two levels of truth. Ultimately, there are only momentary events arising and passing. Conventionally, we speak of persons because it is useful for ethics and practice. Your uncle is right ultimately; your aunt is right conventionally. The ritual operates on the conventional level to effect change on the ultimate level. Karma isn't a substance stored in a self; it is a tendency or seed planted in the mind-stream. When you dedicate merit, you are watering a specific seed in the causal network associated with your grandmother. There is no "her" to feel gratitude, but there is a causal process that was "her" which can be eased by your action. The continuity isn't identity; it's dependency. Just as a child is not the same as the infant but depends on it, the being receiving merit is not identical to the grandmother you knew, but is causally continuous with her. This avoids positing a self while preserving the efficacy of the ritual. The "I" who acts and the "I" who results are neither the same nor different—they are links in a chain. The water ritual acknowledges this chain without needing a permanent link-holder.

  The mechanism relies on the receptive capacity of the other stream. If the deceased has been reborn in a state capable of appreciating goodwill, the dedication acts as a condition for their relief. We treat the continuum as a person to direct our compassion. This doesn't make the fiction real, but it makes the action effective. The philosophy doesn't delete the person; it redefines them as a process. So when you pour water, you are acknowledging the dependency of that process on your current actions. You are strengthening the wholesome causes within that lineage of consciousness. The "self" is replaced by "stream," and the "receiving" is replaced by "conditioning." This allows your uncle's philosophy and your aunt's practice to coexist.

  **Rival readings**
  However, we must be honest: not all Buddhist traditions resolve this neatly. Some scholars argue that popular practice inevitably reifies the self, regardless of philosophical glosses. Your aunt's intuition might be metaphysically more accurate to the lived religion than the philosopher's critique. In Pure Land or folk Buddhism, the deceased is often treated as a distinct spirit who actively intervenes or suffers, implying a robust personal identity. Evidence for this lies in the prayers themselves, which address the dead as "you." Conversely, strict philosophers might argue that even the "mind-stream" is too substantialist. They would say the ritual is purely for the living's psychological benefit, a skillful means to reduce grief, with no actual transfer occurring. Evidence here is the emphasis on the giver's intention over the receiver's state. Another reading is that the tradition is simply inconsistent, holding multiple metaphysics simultaneously. The ritual preserves pre-Buddhist ancestor worship forms while overlaying Buddhist no-self theory. If this is true, the tension you feel isn't a puzzle to solve but a historical artifact to observe. You would know this if monks give conflicting explanations or if texts contradict each other on rebirth mechanics.

  There is also the "Personalist" reading. Some schools argued a "person" must exist to carry karma, though criticized by mainstream orthodoxy. Your uncle's worry echoes this debate. The ritual might sit comfortably in the middle, pragmatically ignoring the extreme. Alternatively, one could argue the ritual *requires* a subtle self despite official doctrine. If the water pouring actually helps the deceased, there must be a locus of experience that experiences the help. If that locus has memories and karmic debts, it functionally is a self, whatever we name it. The evidence for this is the comfort it brings; if it were merely symbolic, the emotional relief might be weaker. The tension remains because the tradition values both philosophical precision and soteriological efficacy, sometimes at the cost of consistency.

  **Where it's underdetermined**
  The ritual itself cannot tell you what is metaphysically true. Pouring water looks the same whether a soul receives it or a causal stream is conditioned. The experience of comfort is subjective and compatible with multiple explanations. You cannot observe the merit arriving, nor measure the stream's continuity. The practice underdetermines the ontology. It works pragmatically without settling the theory. Whether "grandmother" is a fiction or a fact remains unanswered by the chanting. The language of "receiving" is unavoidable for humans, even if reality is processual. We cannot step outside our conceptual frameworks to check the machinery. Thus, the ritual leaves the ultimate nature of the recipient open. It demands faith in the efficacy of goodness, not necessarily faith in a specific metaphysics of personhood. You can participate fully without resolving the philosophical tension, because the practice operates on a level where that distinction doesn't change the water's flow.

  **Bottom line**
  Tell your aunt: The ritual works because love creates connections that transcend logic; her comfort is valid and the merit helps the continuum that was her. Tell your uncle: You're right about no-self, but causality doesn't need a soul to function, like fire lighting fire. You aren't disagreeing about facts, but about languages. She speaks the language of care and relationship; he speaks the language of analysis and ontology. Both are needed for a complete practice. The tradition holds them together so you don't have to choose. Let the water pour; it nourishes both views.
