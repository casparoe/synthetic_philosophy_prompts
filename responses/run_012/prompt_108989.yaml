      However, we must be honest: not all Buddhist traditions resolve this neatly. Some scholars argue that popular practice inevitably reifies the self, regardless of philosophical glosses. Your aunt's intuition might be metaphysically more accurate to the lived religion than the philosopher's critique. In Pure Land or folk Buddhism, the deceased is often treated as a distinct spirit who actively intervenes or suffers, implying a robust personal identity. Evidence for this lies in the prayers themselves, which address the dead as "you." Conversely, strict philosophers might argue that even the "mind-stream" is too substantialist. They would say the ritual is purely for the living's psychological benefit, a skillful means to reduce grief, with no actual transfer occurring. Evidence here is the emphasis on the giver's intention over the receiver's state. Another reading is that the tradition is simply inconsistent, holding multiple metaphysics simultaneously. The ritual preserves pre-Buddhist ancestor worship forms while overlaying Buddhist no-self theory. If this is true, the tension you feel isn't a puzzle to solve but a historical artifact to observe. You would know this if monks give conflicting explanations or if texts contradict each other on rebirth mechanics.

      There is also the "Personalist" reading. Historically, some schools argued a "person" must exist to carry karma, though they were criticized by mainstream orthodoxy. Your uncle's worry echoes this ancient debate. If the causal stream is too thin, moral responsibility evaporates. If it is too thick, it becomes a soul. The ritual might sit comfortably in the middle, pragmatically ignoring the extreme. Alternatively, one could argue the ritual *requires* a subtle self despite official doctrine. If the water pouring actually helps the deceased, there must be a locus of experience that experiences the help. If that locus has memories and karmic debts, it functionally is a self, whatever we name it. The evidence for this is the comfort it brings; if it were merely symbolic, the emotional relief might be weaker. The tension remains because the tradition values both philosophical precision and soteriological efficacy, sometimes at the cost of consistency.
