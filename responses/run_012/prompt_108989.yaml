      Buddhist philosophy offers a way out, though it requires shifting how we understand "receiving." In Abhidharma thought, there is no soul, but there is causal continuity. Think of a flame lighting another candle. The flame doesn't "travel," but the second flame depends on the first. Similarly, your grandmother was a stream of mental and physical events. Death interrupts the physical support, but the causal momentum continues into a new configuration. When you share merit, you aren't sending a package to a static person; you are altering the conditions surrounding that causal stream. The "recipient" is a conventional designation for a specific continuity of consciousness that retains karmic links to you. The water pouring is a symbolic intensification of your intention to dedicate goodwill to that specific stream. It works because minds are interconnected; your generous intention creates a causal ripple that can influence the state of other continuums with which you share karmic affinity.

      To make this work, we distinguish two levels of truth. Ultimately, there are only momentary events arising and passing. Conventionally, we speak of persons because it is useful for ethics and practice. Your uncle is right ultimately; your aunt is right conventionally. The ritual operates on the conventional level to effect change on the ultimate level. Karma isn't a substance stored in a self; it is a tendency or seed planted in the mind-stream. When you dedicate merit, you are watering a specific seed in the causal network associated with your grandmother. There is no "her" to feel gratitude, but there is a causal process that was "her" which can be eased by your action. The continuity isn't identity; it's dependency. Just as a child is not the same as the infant but depends on it, the being receiving merit is not identical to the grandmother you knew, but is causally continuous with her. This avoids positing a self while preserving the efficacy of the ritual. The "I" who acts and the "I" who results are neither the same nor different—they are links in a chain. The water ritual acknowledges this chain without needing a permanent link-holder.

      The mechanism relies on the receptive capacity of the other stream. If the deceased has been reborn in a state capable of appreciating goodwill, the dedication acts as a condition for their relief. If they are elsewhere, the merit still benefits the living by cultivating your own generosity. The key is that "person" is a useful fiction. We treat the continuum as a person to direct our compassion. This doesn't make the fiction real, but it makes the action effective. The philosophy doesn't delete the person; it redefines them as a process. So when you pour water, you are acknowledging the dependency of that process on your current actions. You are strengthening the wholesome causes within that lineage of consciousness. It is not magic; it is causal psychology extended across lifetimes. The "self" is replaced by "stream," and the "receiving" is replaced by "conditioning." This allows your uncle's philosophy and your aunt's practice to coexist: the stream is real enough to be helped, even if the self is empty.
