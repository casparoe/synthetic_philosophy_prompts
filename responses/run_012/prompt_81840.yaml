  **Note on Form and Symmetry**
  In lines 1–16, the symmetry is load-bearing, not merely stylistic. Every line employs universal quantifiers ("each," "either," "no") or symmetric relations ("divides," "holds the other") to ensure that swapping the spheres leaves the description invariant. This formally enforces the metaphysical constraint of the thought experiment: without an external indexical or intrinsic difference, no line can logically grip one sphere without gripping the other. The rhyme and circling rhythm echo the frustration of a description that cannot find a foothold for distinctness. The final line breaks this invariance exactly once by introducing an observer ("I") and indexicals ("this," "that"). This rupture demonstrates the cost of asserting "two": it requires importing a perspective external to the symmetric universe, forcing a distinction the world itself does not ground.
