answer: |-
  Your hypothesis is correct, but it requires sharpening. This is not merely a disagreement about "standards of evidence" in a generic sense; it is a specific **methodological disagreement about the burden of proof in adaptationist inference.** Specifically, you and your friend are arguing past one another because you are treating mathematical models as serving two different epistemic functions: you treat them as **causal explanations**, while your friend treats them as **consistency checks.**

  Here is the diagnosis, the defense of that diagnosis, and the path to resolution.

  ### The Diagnosis: Existence Proofs vs. Falsifiability

  The standoff exists because you are operating under different rules for what counts as a successful scientific explanation.

  **Your Position (The Proponent):** You rely on **Existence Proofs.** When you cite "formal treatments showing that honest signaling can be stable only when the cost is real," you are invoking game-theoretic models (like Grafen's 1990 formalization of Zahavi's principle). In these models, differential cost is a *necessary condition* for a separating equilibrium. To you, the math demonstrates a causal mechanism: cost *enforces* honesty. You view the Handicap Principle (HP) as a law-like generalization: if there is a signal, there must be a cost, because the math says honesty collapses without it.

  **Your Friend's Position (The Skeptic):** Your friend relies on **Falsifiability and Null Hypotheses.** When they call it a "just-so story" and argue that "nothing could count as a counterexample," they are levying a Popperian critique. They are arguing that if "cost" is defined post-hoc as "whatever prevents cheating," the theory is tautological. Furthermore, their point about **indices** (traits causally tied to quality, like a deep voice indicating body size) is a claim that you have failed to rule out a simpler null hypothesis. To your friend, the math you cite only shows that cost is *compatible* with honesty, not that cost is the *reason* for the trait's existence.

  **The Verdict:** This is a **Methodological Disagreement.** You are arguing from **logical necessity** (in the model), while your friend is arguing from **empirical sufficiency** (in the world). You believe you have proven the mechanism; they believe you have only described a constraint.

  ### Why This Diagnosis Fits the Claims

  1.  **The "Just-So" Critique:** Your friend's claim that "any signal that survives is, by definition, not too costly" highlights the methodological gap. They see the HP as a post-hoc rationalization. If a trait exists, you assume it's a costly signal; if it's not costly, you assume it's not a signal. This makes the theory unfalsifiable *unless* you can independently measure cost and quality. Your reliance on "traits that look like they exist to be seen" confirms their fear: you are inferring function from appearance, which is the hallmark of the adaptationist programme critique (Gould & Lewontin).
  2.  **The "Formal Treatment" Rebuttal:** You cite models where cost is required for stability. Your friend counters that this shows "compatibility," not causation. This is a precise methodological objection. A model showing $A \rightarrow B$ is possible does not prove that in nature, $A$ caused $B$. There could be a $C$ (an index) causing both. Your friend is demanding that you distinguish between a **boundary condition** (honesty requires cost) and a **selective driver** (cost was selected *for* its honesty).
  3.  **The Index Distinction:** Your friend introduces the Index/Signal distinction to lower the burden of proof on the HP. If a trait is an index, no strategic cost is needed. You dismiss this by focusing on traits that "look like they exist to be seen." This is where the methodology clashes: you assume strategic signaling is the default for conspicuous traits; your friend assumes physical constraint (index) is the default null hypothesis until proven otherwise.

  ### What Would Move the Disagreement?

  Progress is possible, but not through more formal modeling. You both already accept the math; you disagree on its application. To break the deadlock, you must shift from **theoretical necessity** to **experimental manipulation.**

  **1. The Decisive Case: Cost Manipulation**
  The only way to satisfy your friend's demand for falsifiability and your demand for causal mechanism is an experiment that decouples cost from quality.
  *   **The Experiment:** Take a signaling system (e.g., bird plumage or cricket chirping). Artificially reduce the *cost* of the signal without changing the *quality* of the signaller. (For example, supplementing diet to make a costly pigment cheap to produce, or mechanically amplifying a call to reduce energy expenditure).
  *   **The Prediction:**
      *   **If you are right (HP is the mechanism):** Honesty should collapse. Low-quality individuals should be able to fake the signal because the cost barrier has been removed.
      *   **If your friend is right (It's an Index or Just-So):** Honesty should remain. If the trait is an index (causally tied to physiology), lowering the *perceived* cost won't allow low-quality individuals to produce it. If it's a "just-so" story, the system might adjust in a way unrelated to the cost manipulation.
  *   **Status:** Such experiments exist (e.g., in collared flycatchers or wolf spiders), and results are mixed. Pointing to specific empirical manipulations rather than general formal treatments would force your friend to engage with data rather than philosophy.

  **2. The Crucial Distinction: Differential Cost vs. Absolute Waste**
  A major source of your verbal standoff is likely the definition of "cost."
  *   **Zahavi's Original View:** Signals must be *wasteful* (absolute cost) to prove fitness.
  *   **Grafen's Formalization:** Signals need only be *differentially costly* (marginal cost is higher for low-quality individuals).
  *   **The Move:** If you clarify that you are arguing for **Differential Cost** (the marginal cost of signaling is lower for high-quality individuals), you evade your friend's "waste" objection. Your friend is likely attacking the "waste" version (which is biologically dubious), while you are defending the "differential cost" version (which is mathematically robust). Agreeing on this distinction often dissolves 50% of the heat in this argument.

  ### Conclusion

  You are right that this is a disagreement about standards of evidence, but specifically about **Inference to the Best Explanation.** You are inferring cost from stability; your friend is demanding evidence of cost from independence.

  No progress will be made by citing more theorems. Your friend is correct that mathematical stability does not equal biological causality. However, you are correct that without some form of differential cost, strategic signaling systems are evolutionarily unstable. The bridge between you is **empirical manipulation.** Until you can point to a case where reducing cost *caused* a collapse in honesty, your friend is methodologically justified in treating the Handicap Principle as a plausible null hypothesis rather than a proven law. Acknowledge that the HP is a *class of models* requiring empirical validation, not a universal truth applicable to every conspicuous trait, and the standoff should dissolve.
