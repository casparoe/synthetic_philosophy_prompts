answer: |-
  1. If physics can only describe the world as an object, does the claim that consciousness is numerically one solve the problem of billions of knowers or merely dissolve it? If the latter, what distinguishes my experience from yours other than a change of subject?

  2. Is his epistemic reading of the wave function independent of his monism, or is the Vedanta quietly doing work in the formalism? If you claim independence, what would actually change in his physics if he'd dropped the Vedanta entirely?

  3. Given his debt to Schopenhauer, how much of his Advaita is really a nineteenth-century reconstruction that flattens maya into simple illusion? If he flattens it, an illusion must appear to something, so for whom does it appear?

  4. Are the claims that consciousness is fundamental and that it is numerically one actually a single thesis, and where does he sit between panpsychism and idealism? Since the fundamentality claim is weaker than the oneness claim, what motivates insisting on the stronger one?

  5. If the plurality of minds is mere appearance, what grounds the social practice of science, and does this oneness underwrite compassion for particular creatures? Or does it license a quietism in which their suffering is finally unreal, and does he have any principled way of taking the first without sliding into the second?
