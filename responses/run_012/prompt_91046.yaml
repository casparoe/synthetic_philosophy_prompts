answer: |-
  You are right, and your friend is only half-right. The sceptic's position—that exemplars merely breed envy—is a valid observation of human psychology, but it misses the philosophical utility of that envy. *Amadeus* is not a biography, as you know, but it is a treatise on biography. It takes the Plutarchan machine, feeds it a poisoned subject, and sees what comes out the other end.

  Here is the reading you need to win the argument.

  **Plutarch's Method and the Poisoned Observer**

  Plutarch's premise in the *Life of Alexander* is epistemological: he believes character is legible. He argues that a jest or a glance reveals the soul more accurately than a siege because action can be masked by strategy, whereas reflex reveals nature. He assumes, crucially, that the biographer is a neutral party, or at least one seeking virtue.

  Salieri adopts the Plutarchan method obsessively. He is constantly looking for the 'small sign'. He examines the manuscripts not for the music, but for the lack of corrections. To Plutarch, a lack of correction might signify divine ease or natural virtue. To Salieri, it signifies a cosmic injustice. He reads the character of Mozart off the page, just as Plutarch reads Alexander, but he interprets the data through the lens of his own wounded theology.

  This is where the film complicates the idea that lives teach us how to live. Plutarch assumes that if you see virtue clearly, you will be drawn to it. *Amadeus* argues that if you see virtue clearly, and you lack the capacity for it, you will be destroyed by it. Salieri learns everything about Mozart's life—he knows his habits, his voice, his work ethic (or lack thereof)—but this knowledge does not make him better. It makes him a murderer.

  So, does the film vindicate Plutarch? No. It suggests the Plutarchan method cannot survive a biographer who hates his subject. But—and this is your winning point—it suggests that *we* are always that biographer. We never read lives neutrally. We read them through our own insecurities. Therefore, the moral instruction of biography is not 'imitate this man', but 'confront why you cannot'.

  **Hagiography Inverted**

  You identified the hagiographic turn perfectly. Traditional hagiography files off the unedifying details to create an imitable saint. Salieri tries to do the opposite: he wants to file off Mozart's divinity to reveal a vulgar little man. He fails. The more Salieri emphasises Mozart's vulgarity (the laugh, the scatological letters), the more the audience sees the divinity shining *through* the vulgarity. The genre resists his manipulation.

  However, the film's true philosophical coup is the ending. When Salieri is wheeled through the asylum and blesses the 'mediocrities', he is creating a counter-hagiography. He appoints himself the Patron Saint of the Mediocrities.

  Traditional hagiography is for the aspirational: 'Be like St Francis.' Salieri's hagiography is for the resigned: 'Accept that you are not St Francis.' This is a profound moral instruction. It validates the lives of the vast majority of humans who will never be geniuses. It suggests that the moral lesson of a great life is not necessarily to emulate it, but to recognise one's own distance from it and find a way to endure that distance without turning malignant. Salieri fails at this endurance, but by confessing, he offers the warning to us.

  **The Specific Scenes**

  You need to anchor this in the text. Here is how those four scenes do the heavy lifting:

  1.  **The Confession Frame:** This is the biographical act itself. Salieri is not just telling a story; he is curating evidence for a trial against God. He says, 'I will speak for the dead.' This mimics the biographer's duty to preserve memory, but he admits immediately that he is an unreliable narrator ('I am the patron saint of liars'). This isn't just a plot device; it is an epistemological claim. All biography is confession. All biography is an attempt to justify the self against the subject. If your friend argues that we can learn truth from biography, you counter that *Amadeus* shows us biography is always a negotiation between the observer's ego and the subject's reality.
  2.  **The Masked Patron:** When Salieri visits Mozart in the cloak, he is attempting to insert himself into Mozart's narrative as a benevolent force (a virtue). He wants to be the patron, the helper. But Mozart sees through the disguise, not magically, but humanly. The scene demonstrates that moral posturing is legible. Salieri wants to play the role of the virtuous benefactor to assuage his guilt, but the interaction only deepens his shame. It shows that 'acting virtuously' without the internal state is morally hollow.
  3.  **The Dictation of the Requiem:** This is the closest the two men come to union. Salieri is the scribe; Mozart is the voice. Salieri is literally writing the life (the music) of the other man. He is transcribing genius. In this moment, the Plutarchan dream is realised: the biographer is intimately close to the subject. But instead of gaining virtue by osmosis, Salieri gains only the burden of it. He realises he is the vessel for the work, but not the source. It complicates the idea of 'learning' from a life. He learns the notes, but he cannot learn the gift. It proves your friend's point (you can't learn to be Mozart) but adds the tragic dimension: knowing you can't is the torture.
  4.  **The Final Blessing:** 'I absolve you.' He speaks to the mediocrities, but also to himself, and arguably to the audience. If hagiography is about intercession, Salieri is interceding for the untalented. This is the film's answer to how to live: you live by accepting your limits. The moral instruction is negative capability. It teaches us how to live with envy without letting it consume us (though Salieri himself is the cautionary tale of what happens when you fail).

  **The Historical Lie**

  You must address the historical inaccuracy head-on. The real Salieri was respected, successful, and not a mediocrity. Does this destroy the reading? No. It strengthens it.

  If the film were a documentary, it would be about music history. Because it is a fantasia, it is about the *psychology* of comparison. The lie serves the truth of the feeling. The philosophical argument is not about the specific lives of Salieri and Mozart, but about the structural relationship between the 'Great Man' and the 'Observer'.

  If you tell your friend, 'But Salieri wasn't actually like that,' you lose the point. The film is asking: 'What if he was? What if the experience of greatness is inherently damaging to the witness?' The historical inaccuracy is necessary to isolate the variable of envy. A successful Salieri would complicate the envy; a destroyed Salieri isolates it. The reading survives because the film is not claiming to be Plutarch; it is claiming to be a critique of Plutarch.

  **The Argument Winner: Drama vs. Essay**

  Finally, you asked what the film adds that a philosophical essay could not. This is your clincher.

  An essay can argue that envy is destructive. It can argue that biography is subjective. But an essay cannot make you *complicit*.

  In *Amadeus*, we are not just watching Salieri; we are listening to him. We are seduced by his wit, his clarity, and his pain. For two hours, we see Mozart through Salieri's eyes. We laugh at the vulgar laugh. We cringe at the arrogance. We understand the murder. When the blessing comes at the end, we feel the relief of it.

  A philosophical essay treats the problem of moral learning as an external object to be analysed. *Amadeus* makes the problem internal. It forces the audience to occupy the position of the envious biographer. It demonstrates that we *want* to believe in genius, but we also *want* to tear it down.

  The film argues that we do learn from other lives, but not in the clean, moralising way Plutarch hoped. We learn from them by colliding with them. We learn where our own boundaries are. We learn what we are capable of resenting.

  **Summary for your Friend**

  Tell your friend this: The sceptic says we cannot learn from exemplars because we cannot become them. *Amadeus* agrees we cannot become them, but argues that is not the point. The point of reading a life is not emulation; it is recognition.

  Salieri's tragedy is not that he couldn't be Mozart; it is that he couldn't accept being Salieri. The film teaches us that the moral value of biography lies in understanding the gap between the subject and the observer. If you read a life and feel only envy, you have learned something vital about yourself. That is a moral lesson. It is a painful one, but it is real.

  Plutarch thought biography was a mirror held up to virtue. *Amadeus* shows it is a mirror held up to the viewer. If the viewer is ugly, the reflection will be too. That is not a failure of the method; it is the ultimate success of the truth.

  You win on the grounds that learning how to live isn't always about learning how to be *good*; sometimes it's about learning how to be *human* in the face of the divine. Salieri fails the test, but by watching him fail, we pass it. That is how art teaches what philosophy can only state.
