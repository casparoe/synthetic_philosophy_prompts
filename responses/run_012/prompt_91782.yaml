prompt: |-
  I'm a high school senior, and for an independent research paper I'm combining the two things I spend most of my time on — competitive policy debate, where I've learned that whoever can bury the other side in an uncheckable mess often wins the round — with AI safety, which I got interested in over the summer. The idea I keep circling is what I've seen called the obfuscated arguments problem for oversight by debate, and I want to get its implications right rather than just restate the idea, so let me first set out my understanding and ask you to flag anything I've garbled. The proposal is that we might check the answers of a model too smart for us to evaluate directly by having two copies of a model argue before a weaker judge — a human, or a smaller model — with the judge choosing whichever side it finds more convincing. The hope is that the side holding the truth can win simply by pointing out the other side's errors, so that the judge, who only has to compare two arguments rather than find the answer, ends up correct even though it could never have gotten there alone. The worry is that the side that is wrong, or lying, need not be more convincing in any honest sense: it can win by making its argument so long, so tangled, or so expensive to check that the judge cannot possibly verify it within its budget, while the honest side's refutation would demand work that is just as hard. Once the judge cannot tell which side is honest, the protocol's guarantee collapses, and the asymmetry looks bad, since the dishonest side only has to hide a single flaw whereas the honest side has to expose it — though I suspect that framing is too quick, because it seems to matter a lot whether a false claim always has a short refutation, and I don't know what to make of that.

  What I want from you is not a survey and not a reading list — I can't look anything up and I'd rather you not gesture at papers or names, since I'll add any references myself — but the most important implications of this problem, ranked and defended. Specifically: what it implies about which claims debate can and cannot certify as the gap between the debaters and the judge widens; what it implies about how the protocol itself should be built, for instance whether time limits, cross-examination, letting the judge single out one sub-claim and demand it be checked, or handing the judge tools instead of a bare transcript actually help, and why; and what it implies for the larger hope that we can oversee systems we cannot evaluate, including whether this is a technical snag that a cleverer protocol repairs or a structural limit that shows the whole approach was oversold. Where an implication really holds only if some further condition is met, please say so and name the condition, because that is the part I most need in order to argue the paper rather than merely describe the problem.
