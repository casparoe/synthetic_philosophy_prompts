  A convention generates moral obligation when compliance is necessary to secure a cooperative surplus that participants rely upon, and defection constitutes free-riding or expresses disrespectful disregard for others' legitimate expectations. Obligation arises not merely from regularity, but from the normative expectation that others will comply and the harm or unfairness caused by violation. For outsiders, obligation attaches only where the convention protects a generic interest (safety, dignity) independent of local knowledge, or where the cost of learning/compliance is negligible compared to the disruption caused by ignorance. Mere coordination without moral stakes yields prudential, not moral, pressure.

  | Item | (a) Insider | (b) Outsider | (c) Multiplier | (d) Type & Assumptions |
  | :--- | :--- | :--- | :--- | :--- |
  | 1. Tip (Table) | 0.90 | 0.80 | 0.89 | Contribution (Wages). Assump: US-style, no service charge. |
  | 2. Tip (Counter) | 0.40 | 0.20 | 0.50 | Hybrid (Weak Contribution). Assump: Tablet prompt, no service. |
  | 3. Queue Gap | 0.85 | 0.70 | 0.82 | Hybrid (Schedule/Regard). Fairness > Efficiency. |
  | 4. Escalator | 0.60 | 0.10 | 0.17 | Schedule. Pure coordination/efficiency. |
  | 5. Jaywalk | 0.20 | 0.20 | 1.00 | Schedule (Law). Assump: No traffic, low legal penalty. |
  | 6. Wait Signal | 0.50 | 0.20 | 0.40 | Hybrid (Schedule/Regard). Assump: Empty street, others waiting. |
  | 7. Last Item | 0.80 | 0.70 | 0.88 | Regard. Hospitality/share fairness. |
  | 8. Hold Door | 0.70 | 0.60 | 0.86 | Regard. Minor kindness. |
  | 9. Speakerphone | 0.90 | 0.85 | 0.94 | Contribution (Noise). Universal nuisance. |
  | 10. Give Seat | 0.95 | 0.90 | 0.95 | Regard (Vulnerability). Universal care duty. |
  | 11. Buffer Seat | 0.60 | 0.30 | 0.50 | Hybrid (Schedule/Regard). Privacy varies culturally. |

  **Three Tests**

  *   **Empty-Street Test:** Removing bystanders collapses obligations reliant on audience or reciprocity. Items 3 (Queue), 4 (Escalator), 6 (Wait), 8 (Door), and 11 (Buffer) drop to near 0.00 for both (a) and (b), as their value is purely relational. Items 1, 2, 7, 9, and 10 retain significant bindingness because the harm (economic, noise, vulnerability) persists without an audience. Item 5 remains low (0.20) as it is law/prudence based.
  *   **Overnight-Flip Test:** If conventions reverse, Schedule items (4, 5, 11) retain bindingness (obligation shifts to the new side). Contribution/Regard items (1, 2, 7, 8, 9, 10) see obligation strength unchanged but direction flipped (e.g., if "no tip" becomes norm, tipping becomes wrong); however, Items 9 and 10 resist flipping because noise and vulnerability are convention-independent harms. Thus, (a) and (b) for 9 and 10 remain high regardless of the flip; for 1 and 2, they invert.
  *   **All-Visitors Test:** With no insiders, common knowledge vanishes. Schedule conventions (3, 4, 5, 6, 11) lose almost all point (bindingness → 0.00) as coordination fails. Contribution/Regard conventions (1, 2, 7, 8, 9, 10) retain force proportional to their convention-independent moral core. Item 1 (Tipping) collapses significantly (to ~0.30) because the reliance interest vanishes without entrenched expectation.

  **Invariance Hypothesis Assessment**

  The hypothesis states that outsider bindingness is proportional to the convention-independent moral force. The table largely supports this: Item 10 (Seat) and Item 9 (Speakerphone) have high outsider bindingness because vulnerability and noise are harms independent of convention. However, **Item 1 (Tip Table)** is the strongest counterexample. It has high outsider bindingness (0.80) despite having near-zero convention-independent moral force (no abstract duty to tip). The obligation binds outsiders tightly solely due to local reliance expectations, falsifying the claim that outsider bindingness tracks only independent moral force.

  **Tier List (Most to Least Moral Obligation)**

  1.  Give Seat (10)
  2.  Speakerphone (9)
  3.  Tip Table (1)
  4.  Queue Gap (3)
  5.  Last Item (7)
  6.  Hold Door (8)
  7.  Tip Counter (2)
  8.  Buffer Seat (11)
  9.  Wait Signal (6)
  10. Jaywalk (5)
  11. Escalator (4)

  **General Principle**
  A local convention binds a visitor when violation imposes non-reciprocal costs on vulnerable parties or undermines a cooperative surplus upon which others legitimately rely, regardless of the visitor's prior participation.

  **Least Confident Placement**
  I am least confident about the ranking of **Item 3 (Queue)** versus **Item 7 (Last Item)**. Queue-jumping feels like active aggression, while taking the last item is passive greed; however, in close-knit dining contexts, the latter may signal deeper disregard. I placed Queue higher due to the broader public fairness stake, but the margin is thin.
