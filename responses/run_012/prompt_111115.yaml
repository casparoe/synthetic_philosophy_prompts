answer: |-
  Perceptual identification transfers only when the new stimulus presents immediate phenomenal affordances identical to those stored in memory, excluding surrogate representations and arbitrary codes. This capacity persists only if the spatial mapping system was calibrated before deprivation exceeded a critical developmental window.

  **Case-by-Case Fit**
  1.  **Sphere/Cube:** **No.** Static visual shape lacks tactile affordances (graspability, resistance) without learned depth cues.
  2.  **Spiked/Smooth:** **Yes.** Prickliness is a shared qualitative affordance (pain/protection) independent of complex geometry.
  3.  **Distance/Size:** **No/Yes.** Distance requires learned depth cues; Size at fixed distance relies on immediate visual angle, which is direct.
  4.  **Motion:** **Yes.** Dynamic behavior (rolling vs. sliding) offers immediate causal affordances visible without depth reconstruction.
  5.  **Raised-line:** **No.** Outlines are surrogate representations lacking solid affordances, confirming format matters more than modality.
  6.  **Buzzer:** **No (Perceptually).** Pulses are arbitrary codes, not phenomenal affordances; identification is decoding, not recognition.
  7.  **Regained Sight:** **Yes/No.** Matches the critical window clause; early memory survives, infantile deprivation does not.

  **The Casualty**
  Your verdict on Case 6 must go. You mark it "Yes," but to maintain the principled distinction from Case 2, you must concede this is not perceptual recognition. It is cognitive decoding. Keeping it as "Yes" under the same principle as Case 2 collapses the distinction between seeing and calculating, which your intuition rightly rejects. The principle saves your insight that Case 2 is *seeing* while Case 6 is *knowing*, but it requires labeling Case 6 a failure of perceptual transfer.

  **New Case Prediction**
  **Mirror/Hand:** **Yes.** Seeing the hand move synchronously with proprioceptive commands provides an immediate causal affordance. Even if the visual shape of the hand is unfamiliar, the motion mapping is direct. The subject identifies the hand as theirs because the agency affordance transfers, not the visual form. This predicts they might not recognize the hand as a *hand* (shape), but will recognize it as *theirs* (agency).

  This principle prioritizes **affordance** over **geometry** and **format** over **modality**. It respects your insight on Case 5 (that touch-to-touch can fail) while explaining why Case 2 succeeds (texture is affordance-rich). It demands you sacrifice the behavioral success of Case 6 as evidence of perceptual unity, preserving the philosophical integrity of the Molyneux question.
