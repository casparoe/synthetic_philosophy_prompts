prompt: |-
  I've been reading about how nations are imagined communities and how their traditions are invented, and I think I've talked myself into a conclusion I don't trust. My reasoning runs like this: if the nation is imagined and its ceremonies and symbols are invented, then the nation is the fake community, while the communities I actually inhabit face to face — my family, my street, my workplace — are the real ones; so my attachment to my country must be a piece of false consciousness that I ought to dissolve, even though I can't seem to. People keep telling me that imagined and invented are meant in a technical sense and don't mean fake, but every time I try to spell out that sense for myself I end up back at the same place. Could you tell me where my reasoning goes wrong, and what it does and doesn't imply for a feeling I can't get rid of? Please keep it to roughly a page: a short section naming the mistake, a section laying out what the imagined-community and invented-tradition claims actually assert and how they bear on each other, and a closing section on whether either leaves room for a genuine attachment to a nation.
