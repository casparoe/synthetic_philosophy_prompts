answer: |-
  This instrument maps the space of coherent engineering responses to the observation that agents fail to derive logical consequences. It is built from the available design decisions first; the philosophical positions are located where those decisions terminate.

  *   **Start:** A system can hold A and A → B and still not believe B, and that is a fact about the system rather than a failure of the system.

      *   **Node 1:** Consider a proof assistant that has verified a theorem B from your store, but none of the developers can follow the proof. If the system does not assert B, is this a bug we must fix?
          *   **Yes:** We treat deductive closure as a standard rational belief ought to meet.
              *   **Leaf 1:** **Normative Rationalism**
                  *   *Gloss:* The system is defective because rational agents must believe all logical consequences of their beliefs.
                  *   *Awkward Commitment:* Requires infinite resources or accepts that human-scale systems are inherently irrational.
          *   **No:** This is a fact about the system, not a failure.
              *   **Node 2:** Consider two stores that are logically equivalent but syntactically very different, one a compact axiom set and one a long list of instances. Is the system's underlying state composed of sentences like these, or is it a structureless vector space where sentences are just reports?
                  *   **Structureless vector space:** The believer's state has no sentence-like structure at all.
                      *   **Leaf 2:** **Subsymbolic Representation**
                          *   *Gloss:* The puzzle dissolves because the system does not store propositions, only numerical weights.
                          *   *Awkward Commitment:* Makes it difficult to explain why the system outputs coherent sentences at all.
                  *   **Composed of sentences:**
                      *   **Node 3:** Regarding the two stores: Is the difference between them a difference in belief content?
                          *   **Yes:** What is believed is finer-grained than the set of worlds in which it is true.
                              *   **Leaf 3:** **Structured Propositions**
                                  *   *Gloss:* Belief content is assembled out of the sentence's parts rather than out of possible worlds.
                                  *   *Awkward Commitment:* Must explain why logically equivalent sentences sometimes behave the same way.
                          *   **No:** Content is determined by truth conditions (worlds).
                              *   **Node 4:** Two services each hold one half of a contradiction, neither believing the contradiction. Is the believer's state many small bundles rather than one store?
                                  *   **Yes:** Closure holds only within a bundle.
                                      *   **Leaf 4:** **Fragmented Belief**
                                          *   *Gloss:* The mind is divided into compartments that do not share all information.
                                          *   *Awkward Commitment:* Must define what triggers information sharing between fragments.
                                  *   **No:** The state is one unified pool.
                                      *   **Node 5:** A model answers "A" and "A → B" correctly in separate sessions but never draws the conclusion. To explain this, do we let the believer's possibilities include worlds where the logical truths fail?
                                          *   **Yes:** We allow scenarios where modus ponens does not hold.
                                              *   **Leaf 5:** **Impossible Worlds Semantics**
                                                  *   *Gloss:* We repair the theory by admitting worlds where logical laws are broken.
                                                  *   *Awkward Commitment:* Requires a logic that can reason about impossible scenarios without exploding.
                                          *   **No:** Logical laws hold in all scenarios.
                                              *   **Node 6:** An agent that would answer correctly if given more time is switched off first. Did it believe the answer at the moment it was switched off?
                                                  *   **No:** Belief is the output of a procedure within a budget.
                                                      *   **Node 7:** Is "believing B" defined by what is literally in the store, or what the procedure returns?
                                                          *   **In the store:** The formal notion of belief is a technical one with no obligation to match the everyday notion.
                                                              *   **Leaf 6:** **Syntactic View of Belief**
                                                                  *   *Gloss:* "Belief" just means "string present in the database," so no inference is required.
                                                                  *   *Awkward Commitment:* Cannot account for dispositions to act on things not currently stored.
                                                          *   **Procedure returns:** There is no fact of the matter beyond what the procedure returns in the time available.
                                                              *   **Leaf 7:** **Proceduralism**
                                                                  *   *Gloss:* Belief is not a state you have, but an action you perform within resource limits.
                                                                  *   *Awkward Commitment:* Makes belief transient; you stop believing B the moment you stop computing it.
                                                  *   **Yes:** There is a fact of the matter (implicit belief).
                                                      *   **Node 8:** Do we document this system as an approximation of a perfect reasoner, or as a distinct architecture with explicit/implicit modes?
                                                          *   **Approximation of perfect reasoner:** The theory describes an idealized believer and is not in the business of describing us.
                                                              *   **Leaf 8:** **Idealization Theory**
                                                                  *   *Gloss:* Real systems merely approximate the ideal logic to varying degrees.
                                                                  *   *Awkward Commitment:* Offers no specific mechanism for how the approximation fails, only that it does.
                                                          *   **Distinct architecture:** The believer has two grades of belief, one closed and one filtered by what it has ever entertained.
                                                              *   **Leaf 9:** **Explicit/Implicit Distinction**
                                                                  *   *Gloss:* There are two types of belief: what is stored and what is derivable from storage.
                                                                  *   *Awkward Commitment:* Risks duplicating the entire belief store in two different formats.

  **Collapses and Unoccupied Spaces**

  *   **Collapsed Pair:** **Idealization Theory** and **Explicit/Implicit Distinction**.
      *   *Why:* No question in the tree separates these if the reader answers "Yes" to Node 6 but sees no architectural difference between "approximation" and "dual grades." They collapse because both posit implicit belief without specifying a structural boundary.
  *   **Unoccupied Coherent Space:** **Impossible Worlds Semantics** combined with **Fragmented Belief**.
      *   *Diagnosis:* Merely unexplored. One could coherently argue that fragments are separated *and* that within fragments, logical laws might fail, but standard literature treats these as competing solutions rather than complementary ones.
