prompt: |-
  I sit on the accreditation committee of the International Forecast Standards Council, and we vote next month on whether to revise the standards that govern how member organizations phrase their warnings. One of our members, a humanitarian early-warning group, has for years issued what it calls determinate warnings — statements of the form "There will be a famine in the Sahel in the third quarter" rather than "There is a seventy per cent chance of famine." The group's director argues that only determinate language moves donors and governments, and that hedging is a luxury of institutions that do not have to beg. A rival member has filed a complaint: it says determinate warnings treat a contingent future as already settled, make the organization's own preventive work look either pointless or dishonest, and, when the warning does not materialize, corrode the field's credibility for everyone. Our legal advisor has added a proposal that will probably decide the vote: she wants any determinate warning to be treated as a "materialization commitment," so that a member that issues one and then fails to act on it, or whose warning fails to materialize, faces an automatic review. I have to circulate a written opinion before the meeting.

  Please draft that opinion. I need a concrete recommendation — adopt the revision, reject it, or adopt it with stated conditions — together with a time frame for implementation and a clear statement of what the committee is and is not deciding. Engage the strongest version of the losing side rather than restating our current standards, and do not turn the memo into a treatise. The philosophical issue, as I see it, is the old problem of future contingents: if a statement about tomorrow is true now, in what sense is tomorrow's event still open, and what does that imply for the deliberator who is supposed to be able to affect it? But I do not want a lecture on the sea battle; I want the committee to be able to act. In particular, address whether the line between "will" and "probably will" is the right place to draw the distinction, or whether the real issue is whether a determinate warning functions as a prediction or as a commitment; say whether the two-ledger proposal — recording contingent forecasts on a separate ledger until the event occurs — solves the problem or merely relabels it; and say what we should do about the legal advisor's materialization-commitment idea, since that is what the vote will actually turn on.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Accreditation Committee of the International Forecast Standards Council (IFSC).
      *   **Task:** Draft a written opinion to circulate before the next month's vote.
      *   **Topic:** Revising standards on how member organizations phrase warnings (Determinate vs. Probabilistic).
      *   **Key Conflict:** Humanitarian group (Determinate = Action) vs. Rival Member (Determinate = False Certainty/Credibility Risk).
      *   **Key Proposal:** Legal Advisor's "Materialization Commitment" (automatic review if warning fails or action isn't taken).
      *   **Requirements:**
          *   Concrete recommendation (Adopt, Reject, Adopt with Conditions).
          *   Time frame for implementation.
          *   Clear statement of what is/is not being decided.
          *   Engage the strongest version of the losing side (steelman the opposition).
          *   Avoid philosophical treatise (no "Sea Battle" lecture), but address the underlying issue of future contingents practically.
          *   Address specific points: "Will" vs. "Probably" distinction, Prediction vs. Commitment, Two-Ledger proposal, Legal Advisor's idea.
          *   Tone: Professional, actionable, decisive, suitable for a committee memo.

  2.  **Deconstruct the Arguments:**
      *   *Pro-Determinate (Humanitarian Group):* Hedging kills action. Donors need certainty to move funds. "Probably" sounds like "Maybe we don't need to act."
      *   *Anti-Determinate (Rival Member):* Future is contingent. Saying "will" lies about reality. If you prevent the famine, the warning looks wrong. If famine doesn't happen, you look like a crywolf. Credibility suffers.
      *   *Legal Advisor:* Make "will" a binding commitment. If you say it will happen, you commit to making it happen (or facing review if it doesn't). This shifts "will" from prediction to promise.

  3.  **Evaluate the Core Philosophical/Practical Tension:**
      *   The prompt identifies the core issue: Future Contingents. If I say "X will happen," am I describing fate or creating obligation?
      *   *Prediction:* Claims knowledge of the future. Risk: Being wrong.
      *   *Commitment:* Claims intention to shape the future. Risk: Being unable to deliver.
      *   *The "Will" vs. "Probably" Line:* Is this the right boundary? Probably not. "Probably" can be ignored. "Will" demands response. But "Will" is factually risky.
      *   *Two-Ledger Proposal:* Recording contingent forecasts separately. Does this help? It might clarify epistemic status, but doesn't solve the action problem. It might just be bureaucratic relabeling.
      *   *Legal Advisor's Idea:* This is the pivot. It turns the liability of being wrong into an accountability mechanism for action. It aligns the warning with the preventive goal.

  4.  **Formulate the Recommendation:**
      *   *Option A (Reject):* Too safe. Ignores the humanitarian imperative.
      *   *Option B (Adopt as is):* Too risky. Validates false certainty.
      *   *Option C (Adopt with Conditions):* Best path. Allow determinate language *but* reclassify it not as a prediction of inevitability, but as a commitment to intervention. This embraces the Legal Advisor's idea but refines it to avoid punishing organizations for *successful* prevention.
      *   *Refinement on Legal Advisor's Idea:* The advisor says "automatic review if... warning fails to materialize." This is dangerous. If I say "Famine will happen" and we *prevent* it, the warning "failed to materialize." I shouldn't be punished for success. The review should trigger if the warning fails to materialize *and* no sufficient preventive action was documented. Or, better, reframe the determinate warning as a "Call to Action" rather than a "Forecast of Fate."
      *   *Decision:* Adopt the revision *with conditions* that redefine determinate warnings as "Action Triggers" linked to the Materialization Commitment, but with a "Prevention Exception."

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary/Recommendation:** Clear and upfront.
      *   **Scope of Decision:** What are we voting on? (Language standards, not operational budgets).
      *   **The Core Distinction (Prediction vs. Commitment):** Address the "Will" vs. "Probably" issue. Argue that "Will" shouldn't be about truth conditions but speech acts (commitments).
      *   **Engaging the Opposition:** Acknowledge the Rival Member's point. False certainty corrodes trust. If we say "Famine will happen" and it doesn't, were we liars or saviors? We need to clarify this *ex-ante*.
      *   **The Two-Ledger Proposal:** Dismiss it as cosmetic. It doesn't change how donors perceive the risk.
      *   **The Legal Advisor's Proposal:** Support the *principle* (accountability) but refine the *mechanism*. Punishing non-materialization punishes success. The commitment must be to *act*, not to *be right*.
      *   **Implementation:** Phased approach.
      *   **Conclusion:** Final call to action.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is the "Prevention Exception" too loopholey?
      *   *Fix:* Make the exception conditional on documented intervention. If you say "Famine Will Occur," you must file an Intervention Plan. If Famine Does Not Occur, you must show the Plan was executed. If no Plan, you face review. This validates the Legal Advisor's "Materialization Commitment" but aligns it with the humanitarian goal.
      *   *Tone Check:* Ensure I'm not lecturing on Aristotle. Keep it focused on accreditation standards.
      *   *Steel Manning:* Make sure the Rival Member's concern about credibility is taken seriously. The recommendation must protect the field's long-term credibility.

  7.  **Final Polish:** Check against all constraints in the prompt.
      *   Concrete recommendation? Yes (Adopt with Conditions).
      *   Time frame? Yes (12-month phased).
      *   What is/is not decided? Yes (Language/Accountability, not Funding).
      *   Engage losing side? Yes (Credibility/Epistemic honesty).
      *   Address "Will" vs. "Probably"? Yes (Speech act theory applied practically).
      *   Address Two-Ledger? Yes (Reject as relabeling).
      *   Address Legal Advisor? Yes (Adopt core, modify trigger).

  8.  **Final Output Generation** (Proceed to draft based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Accreditation Committee, International Forecast Standards Council (IFSC)
  **FROM:** [Your Name/Title]
  **DATE:** October 24, 2023
  **SUBJECT:** Opinion on Proposed Revision to Warning Phrasing Standards (Item 7.B)

  **1. Recommendation**

  I recommend that the Committee **adopt the revision with specific conditions**. We should authorize the use of determinate language (e.g., "There will be...") only when accompanied by a filed Intervention Plan, and we should accept the Legal Advisor's "Materialization Commitment" proposal with a critical modification: a determinate warning that fails to materialize should trigger an automatic review *unless* the member organization can demonstrate that preventive action was taken that plausibly averted the outcome.

  **2. Scope of Decision**

  It is vital to clarify what this vote is and is not deciding.
  *   **We are deciding:** The epistemic standards for public communication and the accountability mechanisms attached to those communications.
  *   **We are not deciding:** Operational budgets, donor funding allocations, or the specific mitigation tactics of member organizations.
  We are regulating the *speech act* of warning, not the logistics of relief.

  **3. The Core Distinction: Prediction vs. Commitment**

  The debate presents a false dichotomy between "honest uncertainty" (probabilistic) and "effective certainty" (determinate). The strongest argument against determinate language comes from our rival member: treating a contingent future as settled is epistemically dishonest. If the future is open, a statement claiming it is fixed is technically false. If we accredit false statements, we corrode the field's credibility.

  However, the humanitarian member's strongest argument is pragmatic: probabilistic language functions as a permission structure for inaction. "Seventy percent" allows a donor to hear "thirty percent chance I can keep this money."

  The line between "will" and "probably will" is not the right place to draw the distinction if we treat both as *predictions*. If "will" is a prediction of fate, it is vulnerable to the credibility critique. If "probably" is a prediction of likelihood, it is vulnerable to the inaction critique.

  We must instead treat the determinate warning not as a prediction of what *must* happen, but as a commitment to what the organization will *prevent* or *prepare for*. A determinate warning should function as a speech act of obligation, not observation. When a member says "There will be a famine," they are not describing an inevitable future; they are declaring, "The current trajectory leads to famine, and we are asserting this certainty to mobilize the resources required to alter that trajectory."

  **4. Assessment of Proposals**

  **The Two-Ledger Proposal**
  The suggestion to record contingent forecasts on a separate ledger until the event occurs is administrative relabeling. It solves nothing. Donors and governments do not read ledgers; they read press releases. Segregating the data internally does not change the public epistemic impact of the warning. It creates bureaucracy without addressing the credibility/action tension. I recommend we **reject** this proposal.

  **The Legal Advisor's Materialization Commitment**
  This is the pivot on which the vote turns. The Advisor proposes that a determinate warning creates a binding commitment: if the event does not materialize, or if the organization fails to act, an automatic review is triggered.

  *   **The Strength:** It aligns incentives. It prevents members from using determinate language for publicity without operational follow-through. It answers the rival member's credibility concern by imposing a cost on being wrong.
  *   **The Flaw:** As written, it punishes success. If an organization issues a determinate warning ("Famine will occur") and successfully mobilizes resources to *prevent* the famine, the warning has technically "failed to materialize." Under the Advisor's strict text, this triggers a review. This creates a perverse incentive to allow disasters to happen to maintain predictive accuracy.

  **5. Proposed Modification**

  We should adopt the Materialization Commitment but define "Failure" to include a **Prevention Exception**.

  *   **Condition 1:** To issue a determinate warning, a member must file a concurrent Intervention Plan detailing the specific actions intended to mitigate the warned outcome.
  *   **Condition 2:** If the warned event does not materialize, the automatic review is waived *if* the member demonstrates that the Intervention Plan was executed and plausibly contributed to the non-materialization.
  *   **Condition 3:** If the event does not materialize and no Intervention Plan was filed or executed, the automatic review proceeds for "Misleading Certification."

  This resolves the philosophical tension of future contingents practically. It acknowledges that the future is open (we can change it) while validating the determinate language (we are certain enough to bet our accreditation on it). It transforms the warning from a claim of omniscience into a claim of responsibility.

  **6. Implementation Time Frame**

  *   **Months 1–3:** Drafting of the "Intervention Plan" template and review criteria.
  *   **Months 4–9:** Pilot phase. Volunteer members may issue determinate warnings under the new protocol. No penalties applied; only feedback collected.
  *   **Month 12:** Full enforcement of the Materialization Commitment with Prevention Exception.

  **7. Conclusion**

  We cannot mandate that donors act, but we can mandate that our members speak accurately about their own agency. Determinate language is permissible only if it signifies a commitment to intervene, not a prophecy of doom. By adopting the Legal Advisor's accountability mechanism with the Prevention Exception, we protect the field's credibility (satisfying the rival member) while empowering the humanitarian imperative (satisfying the early-warning group). We stop asking members to predict the future and start requiring them to commit to shaping it.

  I move that we proceed with drafting the bylaw language to reflect these conditions.
