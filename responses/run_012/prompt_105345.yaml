answer: |-
  One-sentence bottom line: A triadic role-play simulation where "Brain" agents generate reports via fixed lookup tables while "Mind" agents hold private experiences, demonstrating how accurate reporting can persist even when experience is causally bypassed.

  ### Reasoning
  The paradox of phenomenal judgment is structural, not empirical; it arises from the causal architecture of physicalism, not a lack of data. A lecture explains the architecture, but a simulation forces students to inhabit the nodes. By separating the "reporting mechanism" (Brain) from the "locus of experience" (Mind) and restricting communication between them, you make the causal gap visible. Students will feel the tension of having a true report ("I see red") produced by a mechanism that never touched the experience of red. This transforms the problem from a logical puzzle into a lived constraint on justification.

  ### Activity Design: "The Bypass Protocol"

  **Time:** 90 Minutes
  **Class Size:** 15 Students (5 Triads)
  **Materials:**
  *   5 Sets of Colored Cards (Red/Blue/Green).
  *   5 "Neural Algorithm" Sheets (Lookup tables mapping Stimulus ID to Report Text).
  *   5 "Private Log" Pads (for Mind agents).
  *   5 "Public Report" Slips (for Brain agents).
  *   Projector/Timer (optional, for stimulus pacing).

  **Roles (per Triad):**
  1.  **Stimulus:** Draws a card, shows it to Brain and Mind, records the truth.
  2.  **Brain:** Receives Stimulus ID, consults Algorithm, writes Public Report. Cannot speak to Mind.
  3.  **Mind:** Views Stimulus, records Private Log. Cannot speak to Brain or see Algorithm.

  **Timeline:**

  **1. Setup & Calibration (15 mins)**
  *   Divide class into 5 triads. Assign roles.
  *   Distribute materials. Ensure Brain agents have the Algorithm Sheet and Mind agents have the Log Pad.
  *   **Rule:** No verbal communication between Brain and Mind. Stimulus manages the flow.
  *   **Instruction:** "You are testing a cognitive system. Your goal is high fidelity between the Public Report and the Private Log. Do not discuss strategy."

  **2. Round 1: The Interactionist Baseline (20 mins)**
  *   **Protocol:** Stimulus shows a card (e.g., Red).
  *   **Mind:** Writes "I see Red" in Private Log.
  *   **Brain:** Asks Mind "What did you see?" (Allowed only in Round 1). Mind tells Brain. Brain writes "I see Red" on Public Report.
  *   **Action:** Repeat 5 times with different colors.
  *   **Check:** Triads compare Logs and Reports. They should match 100%.
  *   **Goal:** Establish the intuition that reports track experience because experience *tells* the report what to say.

  **3. Round 2: The Bypass Condition (25 mins)**
  *   **Protocol Change:** Announce: "Communication link severed. Brain must now operate on internal mechanics only."
  *   **Rule:** Brain is forbidden from asking Mind anything. Brain must use the **Neural Algorithm Sheet**.
      *   *Algorithm Example:* "If Stimulus Card is #1-5, write 'I see Red'. If #6-10, write 'I see Blue'."
  *   **Mind:** Continues to view the card and write Private Log as before.
  *   **Crucial Calibration:** The Instructor ensures the Stimulus Cards drawn match the Algorithm's expectations (e.g., if Algorithm says 1-5 is Red, Stimulus must draw Red cards for IDs 1-5). *Instructor walks around to enforce this matching silently.*
  *   **Action:** Repeat 5 times.
  *   **Result:** Public Reports and Private Logs will still match 100%, but the causal chain is broken. Brain wrote "Red" because of the Algorithm ID, not because Mind saw Red.
  *   **Reflection (Individual, 5 mins):** Have students write a short answer to: "In Round 2, why is the Public Report true? Did the Brain know the color, or just output the string?"

  **4. Debrief & Mapping (30 mins)**
  *   **Step 1: The Reveal (5 mins)**
      *   Ask triads to share their Round 2 reflection.
      *   Introduce the term **Epiphenomenalism**. Explain that Round 2 simulated an epiphenomenal mind: the Mind had the experience, but the Brain produced the report based on physical laws (the Algorithm) without input from the Mind.
  *   **Step 2: Mapping the Paradox (15 mins)**
      *   Write on board: *The Paradox of Phenomenal Judgment.*
      *   Ask: "In Round 2, if the Mind's Private Log was burned before anyone read it, would the Public Report change?" (No).
      *   Ask: "So what causal work did the Experience do?" (None).
      *   Ask: "Then why does the Public Report say 'I experience Red'?" (Because the Algorithm was calibrated to say that).
      *   Ask: "If you are the Brain, and you know you only follow the Algorithm, are you justified in believing you are conscious?"
      *   Drive home the point: The report is reliable, but the *reason* for the report bypasses the truth-maker (the experience).
  *   **Step 3: The Live Problem (10 mins)**
      *   Ask: "Nadia said you 'get past it.' What does 'getting past it' look like?"
      *   Options to propose: Deny the premise (Interactionism), Deny the conclusion (Illusionism), Accept the cost (Epiphenomenalism).
      *   Close by asking: "Which role did you feel most secure in? Brain or Mind? Why?"

  ### Predicted Pitfalls & Handling

  **1. The "Cheating" Mind**
  *   **Risk:** In Round 2, Mind agents will try to cough, tap, or signal Brain agents to ensure accuracy, undermining the causal bypass.
  *   **Handle:** Explicitly forbid non-verbal signaling in the rules. Walk around during Round 2; if you see signaling, halt the triad and reset the round. Frame it as "physics breaking down."

  **2. The "Zombie" Objection**
  *   **Risk:** Students will argue the Brain *is* conscious, so the Mind role is redundant.
  *   **Handle:** Accept this as a valid physicalist response (Identity Theory), but remind them the activity is testing *Epiphenomenalism*, which assumes a distinction. Ask: "If Brain is conscious, why did we need a separate Mind role? Let's assume for the sake of the argument that the Algorithm is unconscious."

  **3. Trivialization**
  *   **Risk:** Students treat it as a silly game and miss the epistemic crisis.
  *   **Handle:** During the Reflection phase, demand written justification. "Don't tell me it matched. Tell me *why* the Brain was entitled to write those words."

  ### Limitations & Instructor Supply

  **1. The Qualia Gap**
  *   **Limitation:** The "Mind" student doesn't actually have qualia distinct from the "Brain" student; they are both just students reading cards. The activity simulates the *structure* of epiphenomenalism, not the *feeling* of causal inertness.
  *   **Supply:** You must verbally bridge this in the debrief. "In the game, you knew you were following rules. In reality, you don't feel the neurons firing. You feel the experience. The paradox is that even though you feel the experience, the physical story says *that* feeling didn't move your tongue. The game removes the feeling to show the structure; you must re-insert the feeling to feel the problem."

  **2. The Calibration Coincidence**
  *   **Limitation:** In the game, the match between Algorithm and Experience is rigged by you (the Instructor/God). In reality, evolution/physics does the rigging.
  *   **Supply:** Explicitly make this analogy. "I was Evolution. I ensured the physical laws (Algorithm) produced reports that matched the experiences (Mind) so the organism survives. The question is: Does that survival guarantee *truth*, or just *utility*?"

  **3. The "Knowledge" Definition**
  *   **Limitation:** Students may conflate "accurate report" with "knowledge."
  *   **Supply:** Press the definition in debrief. "If a clock stops at 2:00 and it is 2:00, does the clock *know* the time? No. It's a lucky hit. In Round 2, was the Brain's report knowledge or a lucky hit?" (It's not luck, it's law, but it's still not *introspective* knowledge).
