answer: |-
  **Elena:** Let's press the adviser's point. If the thought leaves no trace—not neural, not behavioral, not environmental—what makes it true *now* that it happened?

  **Marcus:** The truth doesn't vanish with the trace. It happened. That's sufficient.

  **Elena:** Sufficient for what? On presentism, only the present exists. If the past event is gone and left no scar on the present, what ontological ground supports the proposition "It happened"?

  **Marcus:** You're demanding a physical trace where none is needed. The present world possesses past-tensed properties. The universe *now* has the property of "having-contained-that-thought." That property is the truthmaker.

  **Elena:** But if nothing physical distinguishes a world where the thought occurred from one where it didn't, isn't that property invisible? It sounds like you're positing magic to save the intuition.

  **Marcus:** Not magic, metaphysics. Why must grounding be physical? If I say "I existed yesterday," the truthmaker isn't a physical scar; it's my current property of "having-existed-yesterday." You're conflating causality with truthmaking.

  **Eternalist:** I'm conflating nothing. I'm asking about reality. On my view, the thought exists at its temporal coordinate. It doesn't need to cast a shadow into the present to be real. It just *is*.

  **Marcus:** But that dissolves the difference between past and present. You make time spatial. My view preserves the dynamism of passage, even if it requires accepting primitive past-tensed facts.

  **Elena:** Primitive facts are costly. You're asking us to accept brute properties that supervene on nothing. In the "unrecorded afternoon," there is literally no difference in the present state of affairs. How do you distinguish truth from falsehood?

  **Marcus:** By the history of the world, not just its current snapshot. You claim my properties are brute; I claim your past entities are occult. We both posit things we can't touch.

  **Elena:** I posit things that exist *somewhere*. You posit properties that hang on nothing. If the thought left no trace, your "past-tensed property" is undetectable in principle. Isn't that epistemologically vacuous?

  **Marcus:** Is the past block detectable? You can't visit 2:00 PM any more than I can touch a past-tensed property. We both rely on memory and records, which fail in this specific case.

  **Elena:** But my ontology doesn't change. The event is still there in the block. Your ontology requires the present to suddenly acquire a new, invisible property solely to accommodate a truth about nothing.

  **Marcus:** It accommodates a truth about *something* that was real. Look, if we deny the thought happened because it left no trace, we make truth dependent on memory. That's absurd.

  **Elena:** I agree it happened. I just deny that "happened" means "ceased to exist." It means "exists at an earlier time." Your view forces you to say the present is heavier than it looks.

  **Marcus:** And yours forces you to say the present is less special than it feels. If the cost of saving the truth of the unrecorded thought is accepting past-tensed properties, I'll pay it.

  **Elena:** And if the cost of avoiding those properties is accepting a block universe, I'll pay that. But logically, my ground is solid. Yours floats.

  **Marcus:** Then we agree on the thought, but disagree on the price of reality.

  Verdict: Eternalism; it grounds past truths without invoking invisible present properties.
