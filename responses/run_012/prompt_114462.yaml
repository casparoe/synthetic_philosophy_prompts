      *   *Core Tension:* Epistemic Authority vs. Democratic Legitimacy.
      *   *The "Two Theses" Hypothesis:* This is crucial. Proponents often pivot between "markets are better at finding truth" (empirical) and "markets respect democratic values" (normative). Critics attack the empirical feasibility and the normative coherence simultaneously.
