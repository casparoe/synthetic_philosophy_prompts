      *   *Layer 2: The Conceptual/Normative Layer (Values vs. Beliefs).* Proponents claim neutrality. Critics claim metric selection is value-laden. *Diagnosis:* This is a substantive philosophical disagreement about the nature of "value." It's not verbal; it's a clash of meta-ethical views on measurement.
      *   *Layer 3: The Political/Legitimacy Layer (Authority).* Proponents imply outcome validity grants authority. Critics demand procedural legitimacy. *Diagnosis:* Clash of bedrock normative commitments (Consequentialism vs. Deontology/Proceduralism).
      *   *The "Category Mistake":* The user is right. Proponents use the Narrow Mechanism to deflect Criticism 1 (manipulation) but rely on the Broad Program to claim political relevance. Critics attack the Broad Program's feasibility using the Narrow Mechanism's flaws.
