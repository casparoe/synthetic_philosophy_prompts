  8.  **Final Polish:** Ensure tone is analytical, rigorous, and respectful of the philosophical depth. (e.g., use terms like "incentive-compatibility," "meta-ethical," "procedural legitimacy").

  *(Self-Correction)*: Wait, I need to be careful not to validate the *truth* of the critics, but the *structure* of their argument. The prompt asks for a diagnosis of the *disagreement*, not a judgment on futarchy itself. I must remain neutral on whether futarchy works, focusing on why they can't agree.

  *Key Insight to highlight:* The proponent's claim of "normative neutrality" is the weakest link that connects the empirical to the normative. If the metric is contested, the neutrality fails. This makes the disagreement substantive, not just verbal.

