answer: |-
  Your hypothesis is astute: the ritualized nature of the argument suggests a structural misalignment rather than a simple divergence of opinion. The persistence of the impasse indicates that the disagreement is not monolithic. It is a **compound disagreement** where empirical, conceptual, and normative layers are entangled, allowing each side to retreat to a different layer when pressed on another.

  Here is a diagnosis of the disagreement based on the claims you have outlined.

  ### 1. The Diagnosis: A Layered Impasse

  The disagreement is not merely verbal, nor purely substantive. It is a **category confusion reinforced by an empirical stalemate and protected by incompatible normative commitments.**

  **A. The Verbal/Structural Layer (Your Hypothesis)**
  You are correct that the sides are often answering different questions.
  *   **Proponents** often defend Futarchy as a *Narrow Mechanism* (an information aggregation tool) when challenged on feasibility, but promote it as a *Broad Program* (a governance replacement) when discussing benefits.
  *   **Critics** attack the *Broad Program* (legitimacy, value imposition) but use evidence relevant to the *Narrow Mechanism* (market thinness, manipulation) to do so.
  *   **Diagnosis:** This is a **scope ambiguity**. When a proponent says "markets decide better," they mean *epistemically* (Narrow). When a critic hears "markets decide," they hear *politically* (Broad). This allows proponents to claim critics don't understand market mechanics, while critics claim proponents don't understand politics.

  **B. The Empirical Layer (Market Accuracy)**
  *   **The Claim:** Proponents assert conditional markets aggregate information better than committees. Critics assert they are manipulable and self-fulfilling.
  *   **Diagnosis:** This is a **substantive empirical disagreement that is currently undecidable.** There is no historical data for national-scale conditional prediction markets.
      *   Proponents rely on *theoretical* incentive-compatibility (traders profit by being right).
      *   Critics rely on *observed* market failures in smaller contexts (manipulation, liquidity issues).
      *   Because the scale required to test the claim (national governance) is the scale required to validate the risk, neither side can produce decisive evidence. This empirical vacuum allows the argument to drift into the normative layer, where it hardens.

  **C. The Conceptual Layer (Values vs. Beliefs)**
  *   **The Claim:** Proponents assert voting on goals separates values from beliefs. Critics assert choosing the metric (e.g., GDP) imports a contested theory of value.
  *   **Diagnosis:** This is a **substantive philosophical disagreement about measurement.**
      *   Proponents treat "value" as a target that can be fixed *ex ante*.
      *   Critics treat "value" as emergent from the deliberation process itself.
      *   The dispute here is not verbal; it is a clash between **operationalism** (if we can measure it, we have defined it) and **essentialism** (the metric distorts the thing measured). When a proponent says "we voted on GDP," they believe they have settled the value. When a critic says "GDP is a contested theory," they mean the *operationalization* is itself a value judgment that bypasses democracy. This is the strongest substantive knot: the proponent claims the mechanism is neutral; the critic claims the mechanism is constitutive.

  **D. The Normative Layer (Legitimacy)**
  *   **The Claim:** Proponents imply predictive success confers authority. Critics assert authority requires deliberative legitimacy.
  *   **Diagnosis:** This is a **clash of bedrock normative commitments.**
      *   Proponents hold a **Consequentialist** view of political authority: the right decision is the one that produces the best outcome (as defined by the metric).
      *   Critics hold a **Proceduralist/Deontological** view: the right decision is the one arrived at through legitimate process, regardless of the outcome.
      *   Neither side can argue for this without begging the question. A proponent cannot prove outcomes matter more than process without assuming consequentialism. A critic cannot prove process matters more than outcomes without assuming proceduralism.

  ### 2. Why the Impasse Persists

  The argument is ritualized because each layer serves as a "protective belt" for the others.

  1.  **Empirical shields Normative:** When critics challenge the legitimacy (Normative), proponents point to market efficiency (Empirical). "It works, so it's legitimate."
  2.  **Conceptual shields Empirical:** When critics challenge market manipulation (Empirical), proponents point to the separation of values (Conceptual). "If the metric is fixed by vote, traders can't manipulate the *goal*, only the *probability*."
  3.  **Verbal shields Conceptual:** When critics challenge the metric selection (Conceptual), proponents retreat to the Narrow Mechanism (Verbal). "We aren't replacing democracy, just informing it."

  The impasse persists because **Futarchy functions as a motte-and-bailey doctrine** in practice, even if not in intent. The "motte" is the Narrow Mechanism (markets as advice), which is defensible but politically modest. The "bailey" is the Broad Program (markets as governance), which is politically radical but vulnerable to the critics' three objections. Proponents occupy the bailey when proposing the system but retreat to the motte when defending it.

  ### 3. What Would Count as Progress?

  Since the disagreement is compound, a single "verdict" is impossible. Progress requires decoupling the layers.

  **A. Formal Distinction (Addressing the Verbal Layer)**
  Progress requires proponents to explicitly distinguish **Futarchy-as-Advice** from **Futarchy-as-Authority**.
  *   *Test:* If a proponent concedes that markets should only inform a human decision-maker who retains veto power, does the critic's third objection (legitimacy) dissolve? If yes, the disagreement was largely about scope. If the critic still objects (e.g., "advice biases the decision-maker"), the disagreement is deeper.

  **B. The "Metric Selection" Formalization (Addressing the Conceptual Layer)**
  The second critic objection is the most potent substantive point. Progress requires a formal model of **metric selection**.
  *   *Requirement:* Proponents must demonstrate a mechanism for selecting the objective metric that does not itself rely on a contested theory of the good. If they cannot show how to vote on a metric without importing bias, the claim of "normative neutrality" is falsified.
  *   *Experiment:* A deliberative poll where participants vote on metrics (GDP vs. Happiness vs. Inequality) would likely reveal irreconcilable value conflicts. Documenting this conflict would validate the critic's claim that the "value/belief" separation is spurious.

  **C. Incentive-Compatibility Proofs under Governance Conditions (Addressing the Empirical Layer)**
  The empirical stalemate can be narrowed, if not resolved.
  *   *Requirement:* A formal proof or simulation showing how a conditional market behaves when the *outcome of the market determines the policy*. Current prediction market theory assumes the market does not change the underlying reality (except via price signals). Futarchy requires the market to *trigger* reality changes.
  *   *Progress:* If a model shows that "self-fulfilling prophecies" (traders betting on P to make P happen) dominate "truth-seeking" (traders betting on the actual outcome of P), the proponent's first claim is theoretically undermined, regardless of real-world data.

  **D. Acknowledging the Normative Clash (Addressing the Bedrock)**
  Both sides must acknowledge that the third objection is not a technical flaw but a **political philosophy incompatibility**.
  *   *Progress:* Proponents must admit Futarchy reduces democratic legitimacy to outcome validity. Critics must admit they prioritize process over optimized outcomes. Once acknowledged, the argument shifts from "Is Futarchy correct?" to "Do we prefer Consequentialist or Proceduralist governance?" This ends the ritual by revealing it as a preference, not a puzzle.

  ### 4. Conclusion

  The disagreement is **substantive** regarding the nature of value (Conceptual Layer) and **bedrock normative** regarding legitimacy (Normative Layer), but it is **obscured** by verbal ambiguity (Narrow vs. Broad) and an **undecidable empirical claim** (Market Accuracy).

  You should expect the impasse to persist because the **Narrow Mechanism** is plausible enough to keep proponents hopeful, while the **Broad Program** is radical enough to keep critics alarmed. As long as Futarchy is presented as a single package containing both, the "category mistake" you identified will allow both sides to talk past one another.

  **Progress is possible only if:**
  1.  Proponents formally separate the *epistemic tool* from the *political authority*.
  2.  The "neutrality of the metric" claim is subjected to the same scrutiny as the "accuracy of the market" claim.
  3.  Both sides admit that the ultimate disagreement is about whether **truth** or **consent** is the primary source of political legitimacy.

  Until then, the argument will remain a ritual: a collision between technocratic optimism and democratic skepticism, mediated by a market mechanism that neither side can fully test.
