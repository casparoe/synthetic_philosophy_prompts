  ## 8. Troubleshooting & Predictive Failures

  **1. The "Insect Skeptic"**
  *   **Prediction:** A biology grad student will object during Phase 1: "We don't know if voles feel suffering. These numbers are nonsense."
  *   **Response:** "For the purpose of this trust, the Board has accepted the Welfare Estimates as the best available data. You are not debating the science; you are debating the allocation based on the data provided. Please treat the numbers as binding."

  **2. The "Ecological Dominance"**
  *   **Prediction:** The Stewards (Role Group 1) may dominate Phase 1, arguing that welfare is irrelevant compared to biodiversity.
  *   **Response:** Let them dominate Phase 1. The Rule Change (Phase 2) neutralizes them. When forced to pick a metric, "Biodiversity" is not an option. They will be forced to translate their ecological values into one of the three welfare metrics, which will expose the conflict.

  **3. The "Fiduciary Vetoe"**
  *   **Prediction:** The Fiduciaries (Role Group 3) might block Site A because "Donors won't like the suffering stats."
  *   **Response:** Allow this. It highlights the "Public Perception" proxy. In the debrief, note that they were maximizing "Donor Welfare," not "Animal Welfare."

  **4. Time Overrun**
  *   **Prediction:** Phase 1 discussion will drag.
  *   **Response:** Be ruthless at Minute 30. Cut off mid-sentence if necessary. The pressure of the Rule Change is essential to the learning outcome.

  **5. The "Refusal to Choose"**
  *   **Prediction:** The group tries to vote on a site without voting on a metric.
  *   **Response:** "The Funder will reject the application. You must declare the metric first."

  **6. The "Site C Lever" Confusion**
  *   **Prediction:** Participants may miss that the Lever changes the population count.
  *   **Response:** If asked, clarify: "The fencing reduces available foraging area, limiting carrying capacity." Do not explain the welfare math; let them calculate it.

  ## 9. Why the Numbers Flip (Facilitator Reference)
  *Keep this for yourself to ensure the logic holds if challenged.*

  *   **Site A (Wild):** 50,000 pop.
      *   Total: -50,000 (Last place).
      *   Avg: -1 (Last place).
      *   Peaceful: 5,000 (First place). *Why? 10% of 50k is huge.*
  *   **Site B (Urban):** 200 pop.
      *   Total: +4,000 (Middle).
      *   Avg: +20 (First place).
      *   Peaceful: 190 (Last place). *Why? 95% of 200 is tiny.*
  *   **Site C (Wetland - No Lever):** 5,000 pop.
      *   Total: +10,000 (First place).
      *   Avg: +2 (Middle).
      *   Peaceful: 2,500 (Middle).

  *   **The Lesson:**
      *   Choosing **Total** makes you fund the Wetland and ignore the Wild (because the Wild is a suffering bomb).
      *   Choosing **Average** makes you fund the Urban park (elitist welfare).
      *   Choosing **Peaceful Count** makes you fund the Wild (because quantity of 'good deaths' masks the intensity of 'bad lives').
      *   This demonstrates that "Saving Nature" is only the right answer if you prioritize *Peaceful Count* over *Total Suffering*. If you prioritize Total Suffering, "Saving Nature" is morally hazardous.
