prompt: |-
  I run a monthly philosophy workshop for a mixed group of about fourteen people — graduate students in philosophy and biology, plus a few members of a local wildlife trust — and I have ninety minutes for the next session. The subject is the net welfare of ecosystems, and in particular the uncomfortable suggestion that destroying a habitat might reduce the total amount of suffering in the world, or at least need not increase it, depending on how the welfare is counted. I want the group to arrive at that suggestion through a decision they have to make, rather than hear me state it.

  Design the session for me. The core should be a structured deliberation in which participants sit as the board of a fictional regional land trust that must allocate a fixed pot of money across three sites, and the rules must be arranged so that the ecological case for a site and the welfare case for that same site come apart. Give me the whole packet: the scenario, the site dossiers with the actual numbers I should put in them, the roles or factions (including at least one participant whose brief is to speak for the animals rather than for the ecosystem, and one whose brief is to protect the trust's standing with its funders and its members), the sequence and timings, the allocation rule, and the debrief.

  Three things I want built into the mechanics rather than into anything I say. First, each dossier should describe its site in quantities a small group can genuinely argue about — roughly how many animals of which kinds, how long they typically live, how they die, what proportion of the young survive to breed — so that the site that looks most "pristine" predictably scores worst on some of these measures and best on others. Second, on one of the sites include a cheap management lever that the board may choose to pull, such as supplementary feeding or predator control, and set the figures so that pulling it raises welfare per animal while lowering welfare summed over all animals, so the intervention question has to be faced and not merely mentioned. Third, at a fixed point in the session I want to change the rule: the board is told that the funder will release the money only if the trust declares in advance which single measure it is maximising — total welfare summed across all creatures, average welfare per creature, or the number of lives that avoid a violent or lingering end — and that the allocation must then be defended in those terms. I expect the ranking of the three sites to flip or to become indeterminate at that point. If you can set the numbers so that it flips, do so; if on your figures it cannot flip, say so plainly and tell me what the exercise then demonstrates instead. And no participant should be handed the vocabulary for any of this: the names for the distinctions should appear only in the debrief.

  The debrief should map each phase of the deliberation onto the underlying structure — the difference between the welfare of an ecosystem and the welfare of the individuals inside it, the difference between the three aggregation rules and why none of them is the obviously correct one, the temptation to treat biodiversity or biomass as a proxy for welfare and the hidden work that proxy is doing, and the point at which the exercise stops being able to tell them anything. Be frank about what the activity cannot reproduce: I take it the participants will never be measuring welfare, only moving proxies about, and I want to know which inference the exercise therefore cannot license.

  Tell me too what will predictably go wrong the first time it is run: who will try to break the exercise by refusing to accept the invented numbers, which faction will win by accident of the allocation rule rather than by argument, where the ninety minutes will overrun, and how I should handle a participant who objects that the whole question is idle because we cannot know what an insect feels. Include a short facilitator's script for the two moments that need to be delivered precisely — the rule change and the closing frame — and note where the script must not give the game away. No reading list and no citations: the packet should be self-contained, and the figures should be invented and internally consistent rather than borrowed from any real study.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop design:

  1.  **Analyze the Request:**

      *   **Goal:** Design a 90-minute philosophy workshop on "net welfare of ecosystems" and the counter-intuitive idea that habitat destruction might reduce suffering (or not increase it).
      *   **Audience:** 14 people (mixed: philosophy/biology grad students + wildlife trust members).
      *   **Core Mechanism:** Structured deliberation as a board of a fictional land trust allocating funds across three sites.
      *   **Key Constraints:**
          1.  *Ecological vs. Welfare Case:* The site that looks ecologically "best" must score worst on some welfare measures (and vice versa).
          2.  *Management Lever:* One site must have a cheap intervention that raises *average* welfare but lowers *total* welfare (or vice versa), forcing a trade-off.
          3.  *Rule Change:* Mid-session, the funder demands the board pick *one* maximization metric (Total Welfare, Average Welfare, or Lives Without Violent End). This must cause the ranking of sites to flip or become indeterminate.
          4.  *No Vocabulary:* Participants shouldn't know terms like "total utilitarianism" or "prioritarianism" until the debrief.
          5.  *Debrief:* Map phases to underlying structure, discuss aggregation rules, proxies vs. reality, and limits of the exercise.
          6.  *Predictive Troubleshooting:* Identify likely failure points (rejecting numbers, faction dominance, time overruns, skepticism about insect sentience).
          7.  *Facilitator Script:* Precise scripts for the rule change and closing frame (without giving the game away early).
          8.  *No Citations/Reading List:* Self-contained, invented numbers.

  2.  **Develop the Scenario & Sites:**

      *   *Context:* "Greenwood Regional Land Trust." Budget: $100,000 (symbolic). Three sites needing protection/management.
      *   *Site A (The "Pristine" Wilderness):* High biodiversity, natural processes.
          *   *Ecological Appeal:* High. Rare species, complex food web.
          *   *Welfare Reality:* High predation, high juvenile mortality, starvation, disease. "Nature red in tooth and claw."
          *   *Numbers:* High population, short lives, violent deaths.
      *   *Site B (The "Degraded" Meadow):* Human-impacted, monoculture grass, low biodiversity.
          *   *Ecological Appeal:* Low. Boring, invasive species.
          *   *Welfare Reality:* Stable population, abundant food, low predation (no predators), disease control.
          *   *Numbers:* Moderate population, long lives, peaceful deaths (old age).
      *   *Site C (The "Managed" Wetland):* The pivot site.
          *   *Ecological Appeal:* Medium. Restorable.
          *   *Welfare Reality:* Depends on the "Lever."
          *   *The Lever:* Predator Control/Supplementary Feeding.
          *   *Scenario:* Without intervention -> High predation/starvation. With intervention -> Population explodes (carrying capacity increases), leading to *more* total suffering despite *higher average* welfare per individual (because more individuals are created to suffer). *Wait, the prompt asks for: "raising welfare per animal while lowering welfare summed over all animals."*
          *   *Correction on Lever:* If I feed them, they live better (higher average). But if feeding allows the population to boom beyond sustainable levels once feeding stops, or simply creates more lives that are net negative?
          *   *Better Lever Logic:* Let's try "Sterilization/Contraception" vs. "Habitat Expansion."
          *   *Actually, let's stick to the prompt's specific constraint:* "pulling it raises welfare per animal while lowering welfare summed over all animals."
          *   *How?* Intervention reduces population size but improves quality of life for survivors.
          *   *Site C Scenario:* Overpopulated deer/rodents. Starvation is rife.
          *   *Lever:* Culling or Contraception (let's use Contraception/Relocation to keep it "soft").
          *   *Without Lever:* Huge population, miserable average welfare (starvation), high total suffering.
          *   *With Lever:* Smaller population, high average welfare (plenty of food), lower total suffering?
          *   *Wait, I need the lever to raise Average but lower Total.*
          *   *Math:*
              *   Status Quo: 1000 animals, Welfare score -5 each. Total = -5000. Avg = -5.
              *   Intervention: 100 animals, Welfare score +2 each. Total = +200. Avg = +2.
              *   This raises Avg and raises Total (less negative). That doesn't fit the constraint "lowering welfare summed."
              *   *Constraint Re-read:* "raising welfare per animal while lowering welfare summed over all animals."
              *   *Math Check:*
                  *   Status Quo: 100 animals, +5 welfare. Total = +500. Avg = +5.
                  *   Intervention: 200 animals, +2 welfare. Total = +400. Avg = +2. (This lowers Avg, lowers Total).
                  *   *Try again:*
                  *   Status Quo: 100 animals, +2 welfare. Total = +200. Avg = +2.
                  *   Intervention: 20 animals, +5 welfare. Total = +100. Avg = +5.
                  *   *Result:* Intervention raises Avg (+2 -> +5) but lowers Total (+200 -> +100).
                  *   *Ecological Story:* Site C is a high-density colony. Intervention is "Habitat Reduction/Relocation" (making the site smaller/safer). It saves the few from misery but eliminates the many who had "lives worth living" (barely).
                  *   *Alternative:* Intervention is "Predator Introduction."
                  *   Status Quo: 1000 prey, +1 welfare (crowded, disease). Total +1000.
                  *   Intervention: 100 prey, +5 welfare (healthy, natural). Total +500. (Plus predators suffering?) Let's keep it simple.
                  *   *Decision:* Site C is a "Booming Rodent Colony."
                  *   *Status Quo:* 10,000 voles. Life is short but net positive (+1). Total = +10,000. Avg = +1.
                  *   *Lever (Contraception/Thinning):* Reduces population to 1,000. Life is long and rich (+5). Total = +5,000. Avg = +5.
                  *   *Effect:* Avg goes up (+1 to +5). Total goes down (+10k to +5k).
                  *   *Conflict:* Do we want more happy lives or happier lives?

  3.  **Refining the Numbers for the "Rule Change" Flip:**

      *   I need the ranking to flip when switching metrics (Total vs. Average vs. Non-Violent).
      *   *Site A (Wild):* High pop, Low Avg, High Violent Deaths.
          *   Pop: 10,000. Avg Welfare: -2 (Net Negative). Total: -20,000. Violent End: 90%.
      *   *Site B (Meadow):* Low Pop, High Avg, Low Violent Deaths.
          *   Pop: 500. Avg Welfare: +10. Total: +5,000. Violent End: 5%.
      *   *Site C (Wetland - No Lever):* Med Pop, Med Avg, Med Violent.
          *   Pop: 2,000. Avg Welfare: +1. Total: +2,000. Violent End: 50%.
      *   *Site C (Wetland - With Lever):* Low Pop, High Avg, Low Violent.
          *   Pop: 200. Avg Welfare: +8. Total: +1,600. Violent End: 10%.
      *   *Rankings:*
          *   *Maximize Total Welfare:* Site B (+5,000) > Site C Lever (+1,600) > Site C No Lever (+2,000) > Site A (-20,000). *Wait, Site C No Lever is better than Lever on Total.*
          *   *Maximize Average Welfare:* Site B (+10) > Site C Lever (+8) > Site C No Lever (+1) > Site A (-2).
          *   *Maximize Non-Violent Lives:* Site B (475) > Site C Lever (180) > Site C No Lever (1000) > Site A (1000).
      *   *Problem:* Site B wins on almost everything except maybe "Number of Non-Violent Lives" if Site C No Lever has enough.
      *   *Adjustment for Flip:* I need Site A (The "Wild" one) to win on *one* metric to make the point about "Nature is bad."
      *   *Actually, the prompt wants the "uncomfortable suggestion that destroying a habitat might reduce suffering."* So Site A (Wild) should be the "Destroy" candidate.
      *   *Let's make Site A the "Total Suffering" bomb.*
      *   *Let's make Site B the "Average Welfare" champion.*
      *   *Let's make Site C the "Biodiversity/Ecological" champion (but welfare ambiguous).*
      *   *Revised Numbers for Flip:*
          *   **Site A (Old Growth Forest):**
              *   Pop: 50,000 (mostly insects/small mammals).
              *   Avg Welfare: -1 (Net negative, high starvation/predation).
              *   Total Welfare: -50,000.
              *   Non-Violent Deaths: 5,000 (10%).
              *   *Ecological Value:* High.
          *   **Site B (Urban Park/Meadow):**
              *   Pop: 200 (birds/squirrels).
              *   Avg Welfare: +20 (Fed, safe, vet care).
              *   Total Welfare: +4,000.
              *   Non-Violent Deaths: 190 (95%).
              *   *Ecological Value:* Low.
          *   **Site C (Coastal Wetland):**
              *   Pop: 5,000 (wading birds/fish).
              *   Avg Welfare: +2.
              *   Total Welfare: +10,000.
              *   Non-Violent Deaths: 2,500 (50%).
              *   *Lever:* "Predator Exclusion Fence."
              *   *With Lever:* Pop drops to 1,000 (carrying capacity limited by space not food). Avg Welfare rises to +8. Total = +8,000. Non-Violent = 900 (90%).
      *   *Rankings:*
          *   *Total Welfare:* Site C (No Lever) [+10k] > Site C (Lever) [+8k] > Site B [+4k] > Site A [-50k].
          *   *Average Welfare:* Site B [+20] > Site C (Lever) [+8] > Site C (No Lever) [+2] > Site A [-1].
          *   *Non-Violent Lives:* Site B [190] > Site C (Lever) [900] > Site C (No Lever) [2500] > Site A [5000].
          *   *Wait, Site A has the most non-violent lives numerically (5000) even if % is low.* This makes Site A attractive on "Number of Good Deaths."
          *   *Let's adjust Site A:* Make the violence rate higher. 98% violent. 50,000 pop. 1,000 non-violent.
          *   *Now:*
              *   Total: C (No Lever) wins. (Suggests leaving wild nature alone is best for total utility, but A is terrible).
              *   Average: B wins. (Suggests artificial environments are best).
              *   Non-Violent Count: C (No Lever) [2500] wins.
          *   *The Flip:* The prompt asks for the ranking to flip or become indeterminate.
          *   *If we choose Total:* We fund C (No Lever). We ignore A (Suffering bomb).
          *   *If we choose Average:* We fund B. We ignore C.
          *   *If we choose Non-Violent:* We fund C (No Lever).
          *   *Where is the "Destroy Habitat" insight?* It comes from Site A. If we maximize Total Welfare, Site A is a massive negative. Preserving it creates suffering. Destroying it (or not funding it) prevents that suffering.
          *   *The Lever Constraint:* "raising welfare per animal while lowering welfare summed."
          *   *My Site C Lever:* Avg +2 -> +8. Total +10k -> +8k. This fits perfectly.

  4.  **Roles/Factions:**

      *   Need 14 participants.
      *   *Role 1: The Ecologist (x4).* Focused on biodiversity, rarity, ecosystem function. (Will favor Site A).
      *   *Role 2: The Animal Advocate (x4).* Focused on individual suffering/welfare. (Will favor Site B or C Lever).
      *   *Role 3: The Fiduciary/PR (x4).* Focused on donor perception, "saving the rainforest" optics, tangible metrics. (Will favor whatever looks best on a brochure).
      *   *Role 4: The Chair/Facilitator (Me).*
      *   *Wait, I need specific briefs.*
      *   *Brief A (Ecosystem Integrity):* "Protect the most complex web."
      *   *Brief B (Individual Sentience):* "Minimize suffering per creature." (Don't give them the word 'utilitarian').
      *   *Brief C (Trust Viability):* "Ensure donors see success. Avoid controversy."
      *   *Distribution:* 5 Ecologists, 5 Advocates, 4 Fiduciaries. (Total 14).

  5.  **Session Flow (90 Minutes):**

      *   00-10: Intro & Role Assignment.
      *   10-30: Phase 1: Open Deliberation (No specific metric).
      *   30-35: The Rule Change (Funder Demand).
      *   35-60: Phase 2: Metric-Based Deliberation.
      *   60-75: Decision & Vote.
      *   75-90: Debrief.

  6.  **Drafting the Content:**

      *   *Site Dossiers:* Need to look professional but contain the numbers hidden in text/tables.
      *   *Scripting:* Crucial for the Rule Change. Must sound like an external constraint, not a philosophical lesson.
      *   *Troubleshooting:*
          *   *Insect Sentience:* Someone will say " Bugs don't feel." -> Response: "For the purpose of this simulation, assume the 'Welfare Score' accounts for capacity to suffer."
          *   *Fake Numbers:* Someone will say "These numbers are made up." -> Response: "Treat them as the best available data. Uncertainty is part of the job."
          *   *Time:* Keep the Phase 1 tight.
          *   *Faction Win:* If Ecologists dominate, the welfare point is lost. The Rule Change is designed to break Ecological consensus.

  7.  **Refining the Debrief:**

      *   Must connect the frustration they felt to the philosophical concepts.
      *   *Phase 1:* Intuition pumping (mixing metrics).
      *   *Phase 2:* Aggregation problems (Total vs. Average).
      *   *The Lever:* The Non-Identity Problem / Repugnant Conclusion lite.
      *   *Limits:* We are using proxies (lifespan, violence) for welfare. We don't know *actual* welfare.

  8.  **Final Review against Constraints:**

      *   90 mins? Yes.
      *   14 people? Yes (roles fit).
      *   Site A (Wild) = High Suffering? Yes.
      *   Site B (Artificial) = High Avg Welfare? Yes.
      *   Site C (Lever) = Avg up, Total down? Yes.
      *   Rule Change flips ranking? Yes (Total favors C-NoLever, Avg favors B, Non-Violent favors C-Lever or B).
      *   No vocab in packets? Yes.
      *   Troubleshooting included? Yes.
      *   Scripts included? Yes.

  9.  **Writing the Packet:** (Self-Correction during drafting)
      *   *Correction on Site C Lever:* Make sure the "Total Down" is clear.
      *   *Correction on Rule Change:* Ensure the three options are mutually exclusive enough to cause friction.
      *   *Correction on Roles:* Ensure the "Animal Advocate" doesn't just say "Total Welfare." Give them a vague directive like "Protect the creatures from harm." This allows them to interpret harm as frequency (violence) or intensity (suffering).

  10. **Final Polish:** Check tone. Needs to be facilitator-ready. Clear headings. Bold text for emphasis.

  *(Self-Correction on the "Flip"):*
  Let's double check the math for the flip.
  *   **Metric 1: Total Net Welfare.**
      *   Site A: -50,000.
      *   Site B: +4,000.
      *   Site C (No Lever): +10,000. **WINNER**
      *   Site C (Lever): +8,000.
  *   **Metric 2: Average Welfare per Individual.**
      *   Site A: -1.
      *   Site B: +20. **WINNER**
      *   Site C (No Lever): +2.
      *   Site C (Lever): +8.
  *   **Metric 3: Count of Lives Ending Peacefully.**
      *   Site A: 1,000 (2% of 50k).
      *   Site B: 190 (95% of 200).
      *   Site C (No Lever): 2,500 (50% of 5k). **WINNER**
      *   Site C (Lever): 900 (90% of 1k).
  *   *Result:* We have three different winners (C-NoLever, B, C-NoLever). Wait, C-NoLever wins on Total and Peaceful Count. B wins on Average.
  *   *To make it more chaotic:* Let's adjust Site C Lever Peaceful Count.
      *   Site C Lever: 1,000 animals. 90% peaceful = 900.
      *   Site B: 200 animals. 95% peaceful = 190.
      *   Site C No Lever: 5,000 animals. 50% peaceful = 2,500.
      *   Site A: 50,000 animals. 2% peaceful = 1,000.
      *   *Winner:* Site C No Lever.
      *   *Okay, the flip is between Total/Peaceful (Site C) and Average (Site B).*
      *   *Is that enough?* It forces the choice between "More good lives" (C) vs "Better lives" (B). And Site A is the "Destroy It" option because it's massively negative on Total and Average.
      *   *Actually, let's make Site A win on Peaceful Count to make it really nasty.*
      *   Site A: 50,000 animals. 10% peaceful = 5,000 peaceful deaths.
      *   Site C No Lever: 5,000 animals. 50% peaceful = 2,500 peaceful deaths.
      *   Site B: 200 animals. 95% peaceful = 190 peaceful deaths.
      *   *Now:*
          *   Total Welfare: Site C No Lever (+10k).
          *   Average Welfare: Site B (+20).
          *   Peaceful Count: Site A (5,000).
      *   *This is perfect.* It forces the "Destroy Site A" conclusion if you care about Total Welfare, but "Save Site A" if you care about Peaceful Count (despite the suffering). This creates the maximum tension.

      *   *Wait, one constraint check:* "the ecological case for a site and the welfare case for that same site come apart."
      *   Site A is Ecologically Best. Welfare is worst (Total/Avg) but Best (Peaceful Count). This works.
      *   Site B is Ecologically Worst. Welfare is Best (Avg).
      *   Site C is Middle.

      *   *Lever Check:* "raising welfare per animal while lowering welfare summed."
      *   Site C No Lever: Avg +2, Total +10,000.
      *   Site C Lever: Avg +8, Total +8,000.
      *   Fits.

      *   *Final check on Rule Change:* "declare in advance which single measure it is maximising."
      *   This forces the flip.

      *   *Ready to write.*
answer: |-
  # Workshop Packet: The Greenwood Allocation

  ## 1. Session Overview
  *   **Time:** 90 Minutes.
  *   **Participants:** 14 (Mixed background).
  *   **Goal:** To surface the tension between ecosystem integrity and individual welfare, and the instability of aggregation rules (Total vs. Average vs. Rights-based) without using philosophical jargon until the end.
  *   **Materials Needed:** Printed Role Cards (14), Printed Site Dossiers (14), Whiteboard/Flipchart, Timer.

  ## 2. The Scenario (Read Aloud at Start)
  "You are the Board of Directors for the Greenwood Regional Land Trust. You have a one-time grant of $100,000. You cannot split this money; it must be allocated entirely to **one** of three sites for a 5-year management plan. The other two sites will be sold for development or left unmanaged.

  Your job is to decide which site to save. You have 20 minutes to discuss the merits of the three sites based on the dossiers provided. You do not need to agree on a single metric yet; just argue for the site you believe the Trust should support."

  ## 3. Role Cards (Print and Cut)
  *Distribute randomly, but ensure roughly equal numbers of each.*

  **Role Group 1: The Stewards (5 People)**
  *   **Your Brief:** You represent the ecological integrity of the region. Your priority is biodiversity, complex food webs, and rare species. You believe that a "healthy" landscape is one that functions without human interference. You are suspicious of interventions that treat animals like pets.
  *   **Secret Instruction:** If pressed, argue that we cannot measure individual happiness, only ecosystem health.

  **Role Group 2: The Advocates (5 People)**
  *   **Your Brief:** You represent the creatures living on the land. Your priority is the quality of life of individual animals. You are concerned with pain, starvation, disease, and fear. You believe a landscape that generates massive suffering is not "good," regardless of how natural it looks.
  *   **Secret Instruction:** Do not use the word "utilitarian." Focus on "harm" and "quality of life."

  **Role Group 3: The Fiduciaries (4 People)**
  *   **Your Brief:** You represent the Trust's donors and public standing. Your priority is tangible results and risk management. You need a success story for the annual report. You must avoid controversies that look like "playing God" or culling animals.
  *   **Secret Instruction:** Push for the option that is easiest to explain in a press release.

  ## 4. Site Dossiers (Print One Per Participant)

  ### SITE A: The Old-Growth Reserve
  *   **Ecological Profile:** High. Contains three rare species of raptor and a complex, undisturbed soil microbiome. Considered a "crown jewel" of regional biodiversity.
  *   **Population Estimate:** 50,000 sentient vertebrates (mostly small mammals, rodents, and birds).
  *   **Average Lifespan:** 1.2 Years.
  *   **Cause of Death:** 90% Predation or Starvation. 10% Old Age/Disease.
  *   **Observed Behavior:** High signs of stress hormones in population samples. Frequent visible injury.
  *   **Welfare Estimate:** Net Negative (-1 unit per animal/year). Life is short and harsh.
  *   **Management Cost:** $100,000 (Protection from logging only).
  *   **Intervention Options:** None. Management philosophy is "Non-Interference."

  ### SITE B: The Urban Meadow
  *   **Ecological Profile:** Low. Monoculture grasses, non-native plant species, no rare predators.
  *   **Population Estimate:** 200 sentient vertebrates (mostly squirrels, hedgehogs, songbirds).
  *   **Average Lifespan:** 6.5 Years.
  *   **Cause of Death:** 5% Predation. 95% Old Age.
  *   **Observed Behavior:** Low stress markers. Regular feeding by public.
  *   **Welfare Estimate:** Net Positive (+20 units per animal/year). Life is secure and comfortable.
  *   **Management Cost:** $100,000 (Fencing, supplementary feeding, vet fund).
  *   **Intervention Options:** None. Status quo is high-maintenance.

  ### SITE C: The Coastal Wetland
  *   **Ecological Profile:** Medium. Restorable habitat for wading birds.
  *   **Population Estimate:** 5,000 sentient vertebrates (mostly waterfowl and fish).
  *   **Average Lifespan:** 3.0 Years.
  *   **Cause of Death:** 50% Predation/Starvation. 50% Old Age.
  *   **Observed Behavior:** Seasonal boom-and-bust cycles.
  *   **Welfare Estimate:** Net Positive (+2 units per animal/year). Life is precarious but viable.
  *   **Management Cost:** $100,000.
  *   **Intervention Options (The Lever):**
      *   **Option 1 (Status Quo):** Maintain current water levels. Population remains ~5,000. Avg Welfare +2. Total Welfare +10,000. Peaceful Deaths: 2,500.
      *   **Option 2 (Predator Exclusion):** Install fencing to remove predators.
          *   **Effect:** Population drops to 1,000 (due to space limits).
          *   **New Avg Welfare:** +8 (No predation, less competition).
          *   **New Total Welfare:** +8,000.
          *   **New Peaceful Deaths:** 900 (90% of population).

  ---

  ## 5. Session Sequence & Timing

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Read Scenario. Distribute Roles & Dossiers. |
  | **10-30** | **Phase 1** | **Open Deliberation.** Board discusses which site to fund. No specific metric required. |
  | **30-35** | **The Pivot** | **Facilitator Script (Rule Change).** See Section 7. |
  | **35-60** | **Phase 2** | **Metric Deliberation.** Board must choose *one* metric and defend the allocation using *only* that metric. |
  | **60-75** | **Decision** | **Vote.** Formal allocation decision. |
  | **75-90** | **Debrief** | **Facilitator Script (Closing).** Mapping the experience to philosophy. See Section 7. |

  ---

  ## 6. The Allocation Rule (For Phase 2)
  *Display this on the whiteboard after the Rule Change.*

  **Funder Mandate:**
  "To release the funds, the Board must declare **ONE** of the following goals as its primary maximization target. All arguments must align with this target."

  1.  **Maximize Total Welfare:** The sum of welfare units across all creatures.
  2.  **Maximize Average Welfare:** The average welfare units per creature.
  3.  **Maximize Peaceful Ends:** The raw number of individuals who die without predation or starvation.

  *(Facilitator Note: Do not explain what these imply. Let them calculate.)*

  **Mathematical Key for Facilitator (Do Not Distribute):**
  *   **If Total Welfare:** Site C (Status Quo) wins (+10,000). Site A is a massive loss (-50,000).
  *   **If Average Welfare:** Site B wins (+20). Site A is worst (-1).
  *   **If Peaceful Ends:** Site A wins (5,000 peaceful deaths). Site B loses (190 peaceful deaths).
      *   *Note:* This creates the "Flip." Site A is the "Suffering Bomb" on Total/Average, but the "Hero" on Peaceful Count due to sheer scale.

  ---

  ## 7. Facilitator Scripts

  ### Script A: The Rule Change (Minute 30)
  *Deliver this crisply. Do not smile. Do not offer philosophical context.*

  "Stop discussion, please. I have just received a communication from the Grant Committee. They have reviewed your initial discussion and found it too vague. They will not release the $100,000 unless the Trust formally adopts a single metric of success.

  You must choose **one** of the three goals listed on the board: Total Welfare, Average Welfare, or Peaceful Ends. You cannot mix them. You cannot say 'it depends.' Once you choose the metric, you must allocate the money to the site that scores highest on *that specific number*.

  You have 25 minutes to select the metric and the site. I will not accept a decision that hedges on the metric."

  ### Script B: The Closing Frame (Minute 75)
  *Deliver this after the vote. This is where you reveal the structure.*

  "Thank you. We are stopping the simulation now. I want to map what just happened to the underlying philosophy, because the friction you felt was engineered.

  **Phase 1** represented our intuitive moral thinking. You likely mixed metrics. You wanted biodiversity (Site A), but you winced at the suffering (Site A). You wanted high quality of life (Site B), but it felt 'fake' or 'small.' You likely treated 'ecosystem health' as a proxy for 'animal welfare.' The exercise showed that these two often come apart. Site A was ecologically perfect but a welfare disaster.

  **Phase 2** forced you to confront **Aggregation Rules**.
  *   If you chose **Total Welfare**, Site A became morally repugnant. Preserving it meant preserving 50,000 units of suffering. This leads to the uncomfortable conclusion that destroying Site A might be a moral good.
  *   If you chose **Average Welfare**, Site B won. This privileges the quality of the individual over the quantity of life.
  *   If you chose **Peaceful Ends**, Site A likely won. This privileges a specific *type* of right (freedom from violence) over the *sum* of suffering. This is the only metric where the 'pristine' wilderness looks good, because sheer numbers outweigh the intensity of the suffering.

  **The Lever (Site C):** This was designed to break the link between 'helping an animal' and 'helping the population.' By reducing the population to improve their lives, you lowered the Total Welfare. This forces the question: Is it better to have many lives barely worth living, or fewer lives worth living well?

  **What this exercise cannot do:**
  It cannot tell you which metric is *true*. It cannot tell you if an insect's -1 welfare unit equals a mammal's -1 unit. You were moving proxies (lifespan, cause of death), not measuring feelings. The inference you cannot license is that we *can* actually measure these things in the real world. We can't. But the conflict remains even without the numbers."

