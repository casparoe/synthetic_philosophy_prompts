      *(Refining the "Fact of the Matter" claim)*: The user claims there is a *fact of the matter*. This is a realist claim about probability. If the rule depends on *available data* ("enough reliable data"), then the probability changes if I find more data, even if the student's propensity doesn't change. This makes the probability epistemic, not ontic. This contradicts the "fact of the matter" phrasing if interpreted as propensity. I should highlight this tension.

