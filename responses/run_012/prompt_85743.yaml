          1.  Condition on everything actually known.
          2.  Among compatible classes, take the *narrowest* one with *enough reliable data* such that further narrowing stops paying for itself (diminishing returns/overfitting trade-off).
          3.  The class must be pickable *before* the outcome (no gerrymandering/post-selection bias).
      *   **Caveat:** Weighted mixtures of classes are allowed, but weights must be data-driven, not subjective.
      *   **User's Application:** Used it to predict a nursing student's board pass rate based on school, cohort, GPA, practice tests.
      *   **Friends' Objection:** It's curve-fitting dressed as principle. "Reliable" and "enough" are the disputed terms. The rule is unfalsifiable/insulated (can absorb any counterexample by adjusting thresholds).
      *   **User's Request:**
          *   Play it straight: What counts *against* this view?
          *   Want defeaters (cases, formal results, stats/decision theory arguments), not just taxonomy.
          *   What would *refute* the rule vs. merely under-specify it?
          *   Does it predict anything rivals don't, or is it pure accommodation?
          *   Address the insulation worry (is it fatal or just standard inductive inference?).
          *   Address the self-locating belief case (Doomsday Argument style) where narrowing doesn't terminate.
          *   **Rank** defeaters from "genuinely shake me" to "shrug off."
          *   Indicate what a *defender* would concede vs. what an opponent throws.
          *   State confidence level and flag the least sure point.

  2.  **Deconstruct the User's Rule:**
      *   It sounds very much like a pragmatic, frequentist-leaning, model-selection approach (AIC/BIC style) applied to reference classes.
      *   "Narrowest... enough reliable data... further narrowing stops paying for itself" $\approx$ Bias-Variance Tradeoff / Regularization.
      *   "Pickable before outcome" $\approx$ Pre-registration / Avoiding Data Dredging.
      *   "Weights from data" $\approx$ Model Averaging / Bayesian Model Averaging (BMA).

  3.  **Brainstorming Defeaters/Counterarguments:**

      *   *Insulation/Unfalsifiability:* The friends are right that "stops paying for itself" is the escape hatch. How do you measure "paying"? If I define "paying" as "getting the right answer," it's circular. If I define it as "reducing variance without increasing bias," I need a ground truth to measure bias, which I don't have in single-case prediction.
      *   *The "Single Case" Problem:* Frequentist probabilities require long-run repeats. A specific student taking a specific exam is a unique event. The "fact of the matter" claim implies an objective propensity, but the rule relies on *data availability*, which is epistemic, not ontic. This creates a tension: Is the probability a property of the student or the data?
      *   *Conflicting Narrowest Classes:* What if two non-nested classes are equally narrow and reliable but give different probabilities? (e.g., "Women with GPA > 3.5" vs. "Students who scored >90% on Practice Test B"). The rule says "take the narrowest," but doesn't specify *which dimension* of narrowness takes precedence if they aren't nested.
      *   *The Doomsday/Self-Locating Case:* The user mentions this. In SSA (Self-Sampling Assumption), the reference class is "observers like me." Narrowing this leads to "observers exactly like me," which is size 1. Probability becomes 0 or 1. The rule breaks because "further narrowing stops paying" never triggers until uniqueness, where stats fail.
      *   *Decision Theory Clash:* If the goal is decision-making (e.g., should the student study more?), the "true probability" might matter less than the *cost* of error. A rule optimizing for "truth" might differ from one optimizing for "utility."
      *   *Bayesian Objection:* A strict Bayesian says probability is degree of belief. The "fact of the matter" is a category error. The reference class is just the prior conditioning. The "data-driven weights" are just likelihoods. The user's rule tries to be objective Bayesian but fails to specify the prior over *models* (reference classes).
      *   *Reichenbach's Original Point:* Reichenbach admitted there's no logical solution, only a pragmatic positing. The user claims a "fact of the matter." This is the strongest philosophical wedge.

  4.  **Selecting and Ranking Defeaters:**

      *   *Top Tier (Genuine Shake):* The "Ground Truth" Problem. To know if narrowing "pays for itself," you need to know the error rate of the prediction. But for a *single case* (the nursing student), you don't know the truth until it happens. If you evaluate based on long-run performance of the *rule*, you've shifted from "fact of the matter about *this* case" to "usefulness of the *method*." This undermines the ontological claim.
      *   *Second Tier (Strong Pressure):* Non-Nested Classes. The rule says "narrowest." If Class A (GPA) and Class B (Practice Test) are intersecting but neither contains the other, which is "narrower"? Cardinality? Specificity of description? If the rule can't order them, it doesn't yield a unique number.
      *   *Third Tier (Shrug Off):* The Self-Locating issue. This is a known pathology of *all* reference class reasoning, not just this rule. It shows the limits of frequentism, not necessarily a flaw in the *selection* rule specifically.
      *   *Fourth Tier (Shrug Off):* "It's just curve fitting." This is a semantic objection. If curve fitting works, it works. The user admits it's about data.

  5.  **Addressing Specific Questions:**
      *   *Refutation vs. Under-specification:* Refutation requires showing the rule yields *wrong* probabilities (calibration failure) even when followed perfectly, or yields *contradictory* probabilities for the same state of information.
      *   *Prediction vs. Accommodation:* Does it predict anything new? It predicts that *model selection criteria* (like AIC) should align with intuitive reference class choices.
      *   *Insulation:* It is insulated, but is that fatal? In inductive logic, some insulation is necessary (Duhem-Quine). Fatal if it prevents *any* empirical check.
      *   *Defender Concessions:* A defender must concede that "reliable" and "enough" are context-dependent and that the "fact of the matter" is relative to the available information set, not a metaphysical propensity.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Serious, analytical, respecting the user's philosophical sophistication. No intro fluff.
      *   *Structure:*
          1.  Direct assessment of the rule (it's essentially Model Selection).
          2.  Ranked Defeaters.
          3.  Refutation conditions.
