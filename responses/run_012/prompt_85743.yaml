          5.  Self-locating specific.
          6.  Confidence & Uncertainty flag.

      *   *Refining the "Ground Truth" Defeater:* This is the killer. The rule optimizes for *estimation accuracy*. But accuracy is defined by deviation from the *true probability*. In single-case frequentism, the true probability *is* the long-run frequency of the chosen class. So the rule says "Pick the class that best estimates the frequency of the class." That's circular unless there's an external validity check. If the external check is "did the student pass?", then it's just calibration over time, not a fact about *this* case.
      *   *Refining the "Non-Nested" Defeater:* This is a formal logic hole. "Narrowest" implies a partial order. If the lattice of classes isn't a chain, "the narrowest" doesn't exist.
      *   *Refining the "Self-Locating":* Acknowledge this breaks the "reliable data" clause. If the class is size 1, data is zero. The rule forces you back out, but doesn't say *how far*.

      *   *Confidence:* High on the statistical interpretation (Model Selection), moderate on the philosophical implications regarding "fact of the matter."
      *   *Least Sure:* The precise boundary between "under-specified" and "refuted" in pragmatic accounts of probability.

  7.  **Final Polish:** Check against constraints.
      *   Rank defeaters? Yes.
      *   Say what defender concedes? Yes.
