answer: |-
  ### Exit Cost Scoring and Tiering

  **Tier 1: Critical Fragility (Exit Cost 90–100)**
  *   **(h) Assuming stationarity [Score: 95]:** Non-stationarity invalidates the inductive link between past data and future states, rendering all parameter estimates obsolete.

  **Tier 2: Structural Dependence (Exit Cost 75–89)**
  *   **(g) Replacing a heterogeneous population with a single representative agent [Score: 85]:** Aggregation masks distributional dynamics that often drive the macroeconomic variables the model seeks to explain.
  *   **(d) Assuming the system sits at equilibrium [Score: 80]:** Relaxing equilibrium requires modeling entire dynamic paths and stability conditions rather than solving for a single state.

  **Tier 3: Mechanism Sensitivity (Exit Cost 60–74)**
  *   **(i) Deliberately omitting a factor you know to be operative [Score: 75]:** Omitted variables create structural bias that cannot be corrected by tuning the remaining parameters.
  *   **(b) Assuming agents are perfectly rational and purely self-interested [Score: 70]:** Bounded rationality alters incentive responses and market clearing mechanisms in ways that change qualitative outcomes.
  *   **(c) Assuming the relevant events or errors are statistically independent [Score: 60]:** Correlated errors produce systemic risk and fat tails that independence assumptions explicitly prune away.

  **Tier 4: Mathematical Convenience (Exit Cost 0–59)**
  *   **(f) Assuming away friction, transaction costs, and other dissipative detail [Score: 45]:** Friction usually scales outcomes or creates minor wedges rather than reversing directional predictions.
  *   **(e) Assuming linearity, that is, dropping higher-order terms [Score: 30]:** Linear approximations hold locally even if global dynamics are complex, preserving marginal insights.
  *   **(a) Treating a continuous quantity as discrete, or passing to a continuum [Score: 10]:** Discrete vs. continuous is a computational choice with negligible physical impact on aggregate output.

  ### Friedman's Instrumentalism

  **Strongest Counterexample:** (h) Assuming stationarity is the strongest counterexample because if the data-generating process changes, the model's predictive power collapses regardless of how well it fit the past.

  **Strongest Evidence:** (a) Treating continuous quantities as discrete is the strongest evidence because thermodynamic models predict gas behavior accurately despite the false assumption that matter is a continuum.

  **Load-Bearing Fraction:** 0.67
