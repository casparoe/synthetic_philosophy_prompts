answer: |-
  ### Brainstorm: Dependency Structure

  Before writing the plan, here is the logical dependency map. The order is rigid because later steps rely on definitions established in earlier ones. If you swap 1 and 2, the argument collapses into a gambling tip.

  1.  **The Bridge Principle (Operationalization):** You must define *credence* as *betting price* before you calculate loss.
      *   *Why:* If credence is just a "feeling," a financial loss proves nothing about the feeling. It only proves you're bad at gambling. The loss must be a proxy for logical inconsistency.
  2.  **The Coherence Criterion:** Define "rational" as "not susceptible to a sure loss."
      *   *Why:* You need the normative standard before you apply the test.
  3.  **The Synchronic Book (Arithmetic):** Demonstrate that violating probability axioms $\rightarrow$ sure loss.
      *   *Why:* This is the proof. It relies on (1) and (2).
  4.  **The Normative Leap:** Why does *susceptibility* to loss matter if you don't actually bet?
      *   *Why:* This addresses the "I can just refuse" and "it's only theoretical" objections.
  5.  **The Diachronic Extension:** Updating on new information.
      *   *Why:* This relies on the synchronic baseline. You can't be dynamically inconsistent if you aren't even statically coherent.

  **Verdict on your example:** The "season-long top four" prediction is **dangerous** for the core synchronic argument.
  *   **Why:** A Dutch Book requires bets that settle *simultaneously* (or are commensurable at a single time). A season-long bet settles in May. A bet after Match 1 settles in May. You cannot construct a *synchronic* sure loss with bets that resolve at different times without introducing discount rates/time-value, which invites the Intern to talk about interest rates instead of probability.
  *   **Fix:** Keep the football context (it's their world), but change the *event* for the first 40 minutes. Use **Single Match Outcomes** (Home Win / Draw / Away Win). These are mutually exclusive, exhaustive, and settle simultaneously. Use your **Season-Long** idea only for the Diachronic/Updating section (last 20 mins).

  ---

  ### Teaching Plan: Dutch Book Arguments (60 Minutes)

  #### Phase 1: Operationalization (0–15 mins)
  **Goal:** Establish the Bridge Principle without metaphysical baggage.
  **Board Work:** Write: $C(E) = p \iff$ You are indifferent between buying/selling a ticket paying \$1 if $E$ at price \$p.

  1.  **The Move:** State clearly: "For this hour, we are not discussing what belief *is*. We are defining it operationally. If you say you believe $E$ to degree 0.7, we treat that as you posting a price of 70c for a \$1 coupon on $E$."
  2.  **The Pre-emptive Strike (Postdoc):** Explicitly label this the **Bridge Principle**. Acknowledge it is a constraint. "If you reject this link between belief and action, the Dutch Book argument doesn't apply to you. It applies to agents who price risk this way. We are assuming we are such agents." This disarms the "belief isn't betting" objection before it becomes a heckle.
  3.  **The Pre-emptive Strike (Intern):** Distinguish **Price** from **Value**. "You might think a ticket is *worth* \$0.80 but the market prices it at \$0.70. Here, *your* credence *sets* the price. There is no external market. You are the bookie."

  **Misconception to Head Off:** *"Degrees of belief are vague; I can't give exact prices."*
  *   **Where:** Minute 10.
  *   **Defusal:** "We are dealing in idealized rational agents. If your credence is a range, the Dutch Book argument shows that any precise point you pick within that range must be coherent. We assume precision for the sake of the proof."

  #### Phase 2: The Synchronic Book (15–35 mins)
  **Goal:** Prove Probabilism (Additivity) using the Modified Example.
  **Example:** **One Match: Arsenal vs. Chelsea.** Outcomes: Win (W), Draw (D), Loss (L).
  **Board Work:** Three columns. Prices $P(W), P(D), P(L)$.

  1.  **The Setup:** Ask the room for prices. "Suppose you are overconfident. You assign $P(W)=0.5, P(D)=0.4, P(L)=0.4$." (Sum = 1.3).
  2.  **The Arithmetic:** Ask them to construct the book.
      *   "If I buy a ticket on W from you at 50c..."
      *   "If I buy a ticket on D from you at 40c..."
      *   "If I buy a ticket on L from you at 40c..."
      *   "Total cost to me: \$1.30."
      *   "Payoff: Exactly one ticket pays \$1.00. The others pay \$0."
      *   "Net: I pay \$1.30, I get back \$1.00. I win 30c. You lose 30c. Guaranteed."
  3.  **The Crucial Turn:** Emphasize that *which* ticket wins does not matter. The loss is state-independent.
  4.  **The Intern Trap:** He will say, "This is just Negative EV."
      *   **Defusal (Minute 25):** "Negative EV requires knowing the *true* probabilities. I didn't tell you who is playing. I didn't tell you the form guide. You lose money *regardless* of the truth. This isn't about being wrong about the world; it's about being wrong about yourself."

  **Misconception to Head Off:** *"The Bookie is clever/knows my credences."*
  *   **Where:** Minute 30.
  *   **Defusal:** "The Bookie is a robot. The Bookie doesn't know who will win. The Bookie just sees your price list. The inconsistency is in *your* list, not the Bookie's strategy. You wrote the prices."

  #### Phase 3: The Normative Leap (35–50 mins)
  **Goal:** Move from "You lose money" to "You are irrational."
  **Board Work:** Write: **Susceptibility $\neq$ Actual Loss.**

  1.  **The "Refusal" Objection:** Someone will say, "I just won't take the bet."
      *   **Defusal:** "The argument isn't that you *will* lose money. It's that a loss is *available*. If your credences license a sure loss, your credences are functionally broken. It's like saying 'I'm logically inconsistent, but I won't write down the contradiction.' The inconsistency exists in the system."
  2.  **The "Pennies" Objection:** "It's only 30 cents."
      *   **Defusal:** "Scale it. Bet \$1,000,000. The percentage loss is the same. It's about the structural flaw, not the magnitude."
  3.  **The "False Credence" Objection:** "This shows my credence is false."
      *   **Correction:** "No. You can have coherent credences and still be wrong about the world (e.g., W=0.9, D=0.1, L=0.0, and Chelsea wins). Coherence is internal consistency, not external accuracy. DBA proves Consistency, not Truth."

  **Misconception to Head Off (Unpredicted):** *"This only works for finite sets."*
  *   **Where:** Minute 45 (likely the Postdoc).
  *   **Defusal:** "Correct. We are assuming Finite Additivity today. Countable Additivity requires a more complex book (infinite bets). We are bracketing that to ensure the arithmetic holds for the standard economic agents we model." (Acknowledge, pin, move on).

  #### Phase 4: Diachronic Extension (50–60 mins)
  **Goal:** Use your original example here, where it actually works.
  **Example:** **Season-Long Top Four.**

  1.  **The Setup:** "In August, you set $P(\text{Top 4}) = 0.6$. In December, after bad results, you set $P(\text{Top 4}) = 0.3$."
  2.  **The Problem:** If you update by anything *other* than Conditionalization, a Dutch Book can be made *across time*.
  3.  **The Link:** "If your new credence isn't your old credence conditional on the new evidence, you can be pumped."
  4.  **Why this works now:** Here, the settlement is indeed in the future, but the *trade* happens between Time 1 You and Time 2 You (or a Bookie who knows your updating rule). The friction of time matters less here because we are discussing the *rule* of updating, not a static snapshot.
  5.  **Closing the Loop:** "The synchronic argument says your snapshot must be a probability distribution. The diachronic argument says your movie must follow Conditionalization."

  ---

  ### Final Assessment Question
  Do not ask "What is a Dutch Book?" (They will recite the definition).
  Ask this:

  > "Suppose an agent sets $P(A) = 0.7$ and $P(\neg A) = 0.2$. They refuse to bet because they say 'the stakes are too low to matter.' Have they avoided the Dutch Book argument's conclusion? Why or why not?"

  **What this tests:**
  *   If they say "Yes, they avoided it," they missed the **Susceptibility vs. Actual Loss** point (Phase 3).
  *   If they say "No, but because they lose money," they missed the **Normative Leap** (it's about inconsistency, not cash).
  *   **Correct Answer:** "No. The argument concludes their credences are incoherent/irrational. Refusing to bet hides the financial loss but does not fix the logical inconsistency in their belief state."

  ### Scope Limitations (Openly Announce These)
  To keep the Postdoc from derailing the hour, write these on the corner of the board at the start:
  1.  **We are not proving Probabilism is the *only* norm.** (There are other accuracy-dominance arguments).
  2.  **We are assuming Finite Additivity.** (No countable additivity today).
  3.  **We are assuming the Bridge Principle.** (We are not defending Pragmatism today).

  ### Summary of Example Advice
  *   **Do not** use the Season-Long Top 4 for the Synchronic proof. The settlement dates are too far apart; it invites arguments about discounting and liquidity.
  *   **Do** use Single Match Outcomes (W/D/L) for the Synchronic proof. It is a clean partition, settles instantly, and the arithmetic is undeniable.
  *   **Do** use the Season-Long Top 4 for the Diachronic section. It fits the "updating" narrative perfectly.

  This structure keeps the Intern busy with the arithmetic of the match outcomes, keeps the Postdoc satisfied by the explicit bracketing of the Bridge Principle, and uses your intuition about the season-long game where it is actually mathematically valid.
