answer: |-
  Here is a plan to run the session. Your goal isn't to solve it (since you haven't), but to make the *source* of the disagreement undeniable.

  ### 1. The Prerequisites: What needs to be in their heads?
  You are right: the core is **self-locating uncertainty**. Before you tell the story, you need to prime them to accept that probability isn't just about "how the world is," but "where I am in the world."

  **The Warm-up (5 mins):**
  Don't start with Beauty. Start with a simpler indexical case.
  *   *Say:* "Imagine there are two identical rooms, A and B. I flip a coin. If Heads, I put you in Room A. If Tails, I put you in Room A *and* Room B (clones, or you go in one then the other, doesn't matter). You wake up in a room. You know the setup. What are the odds you are in a 'Heads-room'?"
  *   *Why:* This separates the *coin physics* (50/50) from the *observer frequency* (1/3). It gets the "count the wakings" intuition out early without the baggage of amnesia drugs.
  *   *The Takeaway:* Establish that "What is the chance of Heads?" and "What is the chance *this experience* is associated with Heads?" might be different questions.

  ### 2. Which Case to Run?
  **Stick to the Coin and the Drug.**
  *   **Why:** You said some have seen it online. If you switch to "Clones/Copies," the ones who know the puzzle will spend 10 minutes arguing about whether the variant is equivalent to the classic. The "Drug/Amnesia" version is the common language.
  *   **What it buys you:** It keeps the metaphysics light. Clones raise "Am I the same person?" questions. Amnesia just raises "What do I remember?" questions.
  *   **What it ruins:** It makes the "new evidence" part slippery.
  *   **The Fix:** Describe the drug not as "erasing memory" but as "resetting the context." She isn't wondering about the past; she's wondering about *now*.

  ### 3. Managing the Wrong Turns (The Flow)
  You have 45 minutes. Here is the sequence to let them walk into traps, then spring them.

  **0-10 mins: The Setup & The Vote**
  *   Tell the story cleanly. No jargon.
  *   **Crucial:** Ask for a show of hands immediately. 1/2 or 1/3?
  *   *Note:* Acknowledge the people who say "I've heard this." Ask them to play devil's advocate for the side they *disagree* with.

  **10-25 mins: The "Fair Coin" Trap (The Halfer Position)**
  *   *The Trap:* "It's a fair coin. Nothing she learns changes the coin. It's 50%."
  *   *Don't head it off.* Let your mate who likes arguing pound this table. It is a logically valid position (the "Principle of Indifference" applied to the coin).
  *   *The Pivot:* Ask the Engineers: "If she is offered a bet every time she wakes up, £100 for a correct guess, what should she guess to maximize winnings?"
  *   *Why:* This forces the Halfer to admit that while the *coin* is 50/50, the *strategy* is 1/3. This creates the first crack in the "50/50" armor.

  **25-35 mins: The "Counting" Trap (The Thirder Position)**
  *   *The Trap:* "There are three wakings. One is Heads. So 1/3."
  *   *The Counter:* Ask the Nurse or the Pop-Science reader: "But she knows the experiment happens once. Why should she weight Tuesday the same as Monday?"
  *   *The Deepener:* Ask: "Does she learn anything *new* when she wakes up?"
      *   If they say **No**: Then how can her probability change from Sunday (1/2) to Monday (1/3)? (This is the Halfer's strongest point).
      *   If they say **Yes**: What is it? She knew she would wake up. (This is the Thirder's struggle).
  *   *Goal:* Make them realize the fight isn't about arithmetic; it's about whether "waking up" counts as evidence.

  **35-40 mins: The "Bet vs. Belief" Clash**
  *   You asked if you should let them walk into this. **Yes.** This is the climax.
  *   Someone will say: "Well, she should *bet* 1/3, but *believe* 1/2."
  *   *Your move:* Stop the room. "This is the real puzzle. Is probability about how the world is, or how we should act?"
  *   Don't solve it. Just highlight that this is where the philosophy lives.

  ### 4. What to Leave Out (and how to say it)
  *   **Formal Credence:** Do not define it.
      *   *Say:* "We're not doing math class. When I say 'probability', I mean 'how confident you feel' or 'what odds you'd take'. If those two things come apart for you, say so."
  *   **Bayes' Theorem:** No formulas.
      *   *Say:* "We're counting frequencies, not calculating posteriors."
  *   **Monty Hall:**
      *   *Say:* "Monty Hall is about a host revealing information. Here, no one tells her anything. She just opens her eyes. It's a different beast."
  *   **0 or 1 (Ontological Chance):**
      *   *Say:* "We know the coin is already landed. We're talking about *her* uncertainty, not the universe's."

  ### 5. The Diagnostic Question
  You want one question at the end to see if they grasped the *problem* (not just the answer).

  **Ask this:**
  > "If Beauty is told on Wednesday that the experiment is over, and we ask her 'What was the probability of Heads?', does she say 1/2 or 1/3? And if it's different from what she said on Monday, **when exactly did her probability change?**"

  *   **Why this works:**
      *   If they say "It's always 1/2," they are Halfers (probability tracks the coin).
      *   If they say "It's 1/3 on Monday, 1/2 on Wednesday," they are Thirders (probability tracks the observer moment).
      *   If they can't identify *when* the change happens (or if it happens), they haven't grasped the self-locating nature of the uncertainty.
      *   It forces them to confront whether probability is about the **event** (the toss) or the **experience** (the waking).

  ### Facilitator Cheat-Sheet
  *   **If they get stuck on the drug:** "Imagine the drug is just a very good night's sleep where you forget you woke up. Same difference."
  *   **If the Engineers want to simulate it:** "Okay, if we run it 100 times, how many times do we ask her for a guess? (150). How many are Heads? (50). So 50/150. Why does that feel wrong to you?"
  *   **If your argumentative mate gets aggressive:** "You're defending the Coin. [Other Person], you're defending the Waking. Both of you are right about your object, but you're talking past each other. Can you agree on that?"
  *   **If someone says "It depends on the betting":** "Exactly. So is probability a fact about the world, or a tool for decision making? That's the real question."

  **Final Tip:** Since you are undecided, use that. "I've been thinking about this for months and I still flip-flop. If either of you can convince me, buy you a pint." It lowers the stakes and makes it a collaborative investigation.
