  The oil on the floor had dried to a black varnish that caught the light from the single hanging bulb, and the air smelled of steel shavings and the sharp tang of the cutting fluid. Elias stood over the drafting table, his hands resting on the edges of the brass sheet, while Thomas leaned against the doorframe, wiping his fingers on a rag that was already too stiff to be useful. They had been at it for three days, trying to finalize the stencil set for the new municipal annex, and the contract specified that every letter had to be cut from a single continuous line of metal, no islands, no floating pieces held in by glue or friction. It was a rule Elias had insisted on, something about structural integrity and the honesty of the material, but now it was staring back at him from the table in the form of the lowercase a.

  Thomas pushed off the doorframe and walked over, looking down at the sheet without touching it. He said the a looked broken. Elias said it looked necessary. The bowl of the letter had to be opened with a strut to keep the center from falling out, and that strut changed the weight of the counter, making it heavier on the left side than the right. Alone, on the white proofing paper, it looked like a mistake, a u that had forgotten to close, or an o that had slipped. Thomas picked up the tweezers and hovered them over the strut, wanting to snip it and solder a new bridge, but he knew that would violate the single-line rule. He said if they sent it like this, the casters would laugh. Elias said the casters did not read words, they only poured bronze.

  They had a deadline of Monday morning, and the client was a man who counted pennies but cared deeply about how his building spoke to the street. If the letters looked weak, he would reject the whole batch, and the cost of the brass alone would eat their profit for the year. Elias picked up the n and the e from the tray and placed them next to the a on the layout board. He slid them close, tightening the kerning until the white space between them hummed. He stepped back and squinted, tilting his head to catch the shadow the letters cast on the board. He said look at the channel of white running through the word. Thomas looked. The strut in the a matched the thickness of the leg in the n. The open counter of the a balanced the closed loop of the e. Alone, the a was a cripple. Beside its neighbours, it was the load-bearing wall.

  Thomas said it felt wrong in his hand when he traced the shape in the air. He said a letter should stand on its own merits. Elias said a letter only has merits because of the company it keeps. He pointed to the e, noting how the crossbar was too low, a defect they had ignored because it made the rhythm of the line work. He said if you fixed the e to be perfect in isolation, it would punch a hole in the texture of the word. Thomas picked up the a again, holding it up to the light. The strut caught the bulb and threw a thin line of shadow across his palm. He said if they ship this and the client picks up a proof and looks at the a by itself, he will see the break. Elias said the client would not look at the a by itself. He would look at the name of the building. He would look at the shadow the whole word cast on the stone facade.

  The clock on the wall ticked, a heavy mechanical sound that filled the silence between them. Thomas put the letter down. He said he remembered a job ten years ago, the bank sign on Fourth, where they had scrapped a whole set because the g looked like a q in the dim light. Elias said that was a different face, a different material, a different light. He said this was steel for bronze, and the patina would hide the sins of the cut. Thomas said sins did not hide, they just waited. He walked over to the window and looked out at the street, where the rain had started to fall, blurring the lights of the cars into long streaks. He said if they keep the strut, they have to own it. They cannot call it a compromise. Elias said he was not calling it a compromise. He was calling it a solution.

  Thomas turned back from the window. He said a solution implies a problem was solved. He said he was not sure there was a problem until Elias decided there was a rule about single lines. Elias said the rule was what made the face honest. Thomas said honesty was not the same as legibility. He walked back to the table and rearranged the letters, spelling out the name of the annex. He stepped back again. The word held together. The rhythm was steady. The eye moved across the line without stumbling on the a. But when Thomas covered the n and the e with his hands, leaving the a exposed, it looked like a question mark that had lost its dot. He said if someone walks past the building and only sees that letter, maybe because of a scaffolding pole or a tree, what will they think? Elias said they would think it was an a. He said the brain fills in the gaps. He said we read words, not letters.

  Thomas picked up the cutting knife. He held it over the strut. He said he could remove it. He could cut the bowl free and let it float, held in place by the tension of the surrounding metal during the casting process. It was risky. The caster might lose the piece. The center might shift. But the shape would be pure. Elias said if the center shifts, the letter is ruined. He said the strut was insurance. Thomas said it was a crutch. He looked at Elias, waiting for an order. The rain beat harder against the glass. The oil on the floor smelled stronger as the temperature dropped. Elias looked at the sheet, then at the word, then at Thomas. He said if you cut the strut, you break the rule. Thomas said the rule was made by us. Elias said the rule was made for the metal.

  Thomas held the knife steady. He said the metal does not care about the rule. It only cares about the stress. He said the strut creates a weak point where the rust will start. Elias said rust takes fifty years. Thomas said fifty years is how long the sign is supposed to last. They stood there for a long time, the knife hovering over the brass, the shadow of the blade falling across the strut. Outside, a car horn blew, a short sharp sound that vanished into the rain. Elias finally nodded, just once, a small movement of the chin. He said do what you think will hold. Thomas lowered the knife. He did not cut. He placed the blade on the table. He said he would leave it. He said he would sign off on the sheet. But he said he would not sleep until the bronze was poured. Elias said neither would he. They packed the tools away, wiping the oil from the steel, placing the stencil sheet in the protective case. The latch clicked shut. The light was switched off. The workshop was dark, but the shape of the a remained in their eyes, broken and whole, waiting to see what it would become when it met the wall.
