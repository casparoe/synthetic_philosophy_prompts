      *   **Specific Analysis of 1 vs 5:** This is the "Hobbesian vs. Kantian" tension. Claim 1 is Hobbesian (Instrumental). Claim 5 is Kantian/Internalized.
      *   **Specific Analysis of 4 vs 5:** Evolutionary debunking. If norms are just tools (4), why trust them when they don't work (5)?
