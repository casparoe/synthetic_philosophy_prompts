      *   Given the course title (Evolution of Cooperation), Claim 1 is the most vulnerable. It treats preferences as exogenous. Evolution treats preferences as endogenous.
      *   *Wait, Claim 3 is also very strong.* "Backward induction is right." This is controversial in Phil/Econ crossover courses. Many professors hate the BI solution to finite PD because it predicts no cooperation, yet we see cooperation.
      *   *However, the 1 vs 5 conflict is the most glaring "fragility."* It sounds like "Defecting is rational" (1) vs "Defecting is wrong" (5).
      *   *Refinement:* The real issue is the definition of "Rational."
      *   If I advise weakening **Claim 1**, it resolves the tension with 5.
      *   If I advise weakening **Claim 5**, it resolves the tension with 1.
      *   Which is better for the paper? A paper that says "Cooperation is rational *only* when there is a shadow of the future OR internalized norms" is stronger than "Cooperation is never rational in one-shots, but I still feel guilty."
      *   So, weaken Claim 1.

  6.  **Drafting the Audit:**
      *   **Tone:** Direct, analytical, slightly informal (matching the user), but rigorous.
      *   **Structure:**
