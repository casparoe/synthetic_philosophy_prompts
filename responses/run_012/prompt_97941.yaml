  {
    "speech": "Good evening, everyone. For those who don't know me, I write stories for a living. Priya asked me to stand here tonight not because I understand the price of flour better than anyone else in this room, but because I understand the weight of a narrative. And thirty-one years is a heavy, beautiful story.\n\nWhen Priya asked me to do this, she sent me a note. She said, \u2018Tell them about the place, not the theory.\u2019 She knows her brother is here\u2014hello, David\u2014and she knows David has the numbers ready if anyone wants them. But tonight isn't about the numbers. It\u2019s about the bread. It\u2019s about the hands that made it, and the people who ate it.\n\nI\u2019ve watched this place work for a long time. I\u2019ve seen the 4 a.m. shifts when the streetlights are still humming. There is a kind of knowledge that lives in this room that you cannot write down on a spreadsheet. It\u2019s in the way a baker touches the dough to know if the humidity is right before the thermometer even registers it. It\u2019s in the way you know when a regular customer needs a quiet corner versus a cheerful chat. It\u2019s embodied wisdom. It belongs to the person standing at the oven.\n\nBut a bakery is not just ovens. It is also lights that must be paid for, shifts that must be covered, and a door that must open at seven. Someone has to draw the timetable. Someone has to make sure the whole machine moves together. And that is a different kind of work. It requires looking at the whole board, not just the single station. It requires making choices where there are no perfect answers, only trade-offs.\n\nThis tension\u2014between the knowledge in the hands and the needs of the whole structure\u2014is the hardest work there is. It is easier to bake than to organize the baking. It is easier to follow a schedule than to write one that respects every person\u2019s skill and every person\u2019s life. \n\nWe are a co-op. That means the power sits with us. But power is heavy. Recently, we voted on how we manage that power. Some of us felt the old way honored individual choice best. Others felt a new way would honor collective stability best. I know passions run high. I know the vote was narrow. But look around you. The passion exists because everyone here loves The Lantern. If you didn\u2019t care about the work, you wouldn\u2019t care about the structure.\n\nPriya stood at the center of this tension for three decades. She held the space where the bakers met the planners. And when the vote came this month, she abstained. I know some of you wondered about that. But I see it as the final gift of her stewardship. She knew that for thirty-one years, she had been the safety net. By stepping back, by not casting her weight on either side of the scale, she was telling us: \u2018This is yours now. The knowledge is yours. The decision is yours. The consequence is yours.\u2019\n\nShe is not leaving because the work is done. She is leaving because the work belongs to you. \n\nThere will be mistakes. There will be mornings where the rota doesn\u2019t match the reality of the oven, and mornings where the system feels too rigid for the human touch. That is not failure. That is the condition of doing anything real together. The people doing the work will always know things the schedule cannot capture. And the schedule will always be necessary to keep the lights on. The trick is not to solve that tension, but to live inside it with grace.\n\nSo, to the bakers: trust your hands. To the planners: trust the people. And to Priya: thank you for teaching us that the structure serves the story, not the other way around.\n\nPlease raise your glasses. To the bread, to the work, and to Priya.",
