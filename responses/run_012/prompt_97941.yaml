      *   *Tone:* Celebratory, reflective, slightly poetic (novelist), grounded.
      *   *Key metaphor:* The recipe vs. the meal. The individual touch vs. the collective table.

      *(Self-Correction during drafting)*: I need to be careful not to imply the committee *can't* know things. The prompt says "know things no committee can collect." I need to phrase this as the *embodied* knowledge of the baker vs. the *abstracted* knowledge of the schedule.
