      *   **Context/Conflict:** The co-op is currently split. They just voted (narrowly) to scrap an internal price board system (jobs assigned points, people bid) for a committee-drawn rota. Priya abstained. The room is divided on this issue.
      *   **Constraints:**
          *   Warm and true.
          *   Cannot say the co-op proved Hayek wrong (market prices necessary) or Lange right (planning possible).
          *   Cannot smuggle economic theory in sideways.
          *   No word "calculation".
