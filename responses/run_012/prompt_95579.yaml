  In a university research lab, a principal investigator (PI) faces a strict grant deadline that determines funding for the entire team. One postdoctoral researcher is struggling with a specific analysis due to personal stress, threatening the submission. The PI knows the postdoc would prefer to keep the task to learn the skill, but also needs the job security the grant provides. The PI reassigns the task to a senior technician without informing the postdoc, completing the analysis on time and securing the funding, thereby preserving the postdoc's position while denying them the learning opportunity and agency over their own work.

  **Maxim:** I will reassign a subordinate's core duties without their consultation in order to secure institutional funding, only when I know the subordinate is temporarily incapacitated by stress and the reassignment ensures their continued employment.
  **Universalized Counterpart:** Everyone reassigns a subordinate's core duties without consultation to secure funding, only when the subordinate is temporarily incapacitated and the reassignment ensures continued employment.

  **Formula of Universal Law (FUL):**
  *Contradiction in Conception (CC):* Can I conceive a world where this maxim is a universal law of nature? Yes. A system of "protective management" is logically possible; institutions could function with managers stepping in during verified emergencies. The practice does not destroy the concept of employment or management.
  *Contradiction in Will (CW):* Would I will this maxim as a universal law? Given the exception clause ("ensures continued employment"), a rational agent might will this. If I were the stressed subordinate facing termination, I would likely will that a manager intervene to save my job, even at the cost of temporary autonomy. The benefit (employment) outweighs the cost (consultation) in this specific description, so no contradiction in will arises.
  *Verdict:* Permissible.

  **Formula of Humanity (FH):**
  The action treats the postdoc as a mere means to the end of securing funding and maintaining lab stability. By bypassing their consent, the PI denies the postdoc's status as a rational co-legislator of their own work, reducing them to an object of care rather than an agent. Even if the end is beneficial for the postdoc, the means (non-consensual reassignment) violates the requirement to respect humanity as an end in itself.
  *Verdict:* Forbidden.

  **Source of Divergence:**
  The divergence turns on the **exception clause** ("only when... ensures continued employment") and the **description of the end**. In the FUL analysis, this clause allows the agent to pass the Contradiction in Will test by appealing to what the subordinate *would* rationally choose for their own welfare (hypothetical consent). The FUL focuses on the sustainability of the system and the agent's own rational will to be protected. The FH, however, focuses on the **means** employed in the actual instance. It demands actual respect for autonomy, not just hypothetical rational agreement. The FUL accepts the paternalistic benefit as a rational will; the FH rejects the bypass of agency as a violation of dignity. If the exception clause were removed (e.g., "I will reassign duties to secure funding"), the FUL would likely fail the CW test (no one wills arbitrary management), and the divergence would collapse into agreement (both forbid).

  **Sophisticated Kantian Block:**
  A sophisticated Kantian would argue the **maxim has been misdescribed**. They would claim that the maxim implicitly contains the disregard for the subordinate's agency as a fundamental feature, not just a side effect. A correct description would be: "I will treat a subordinate as a mere instrument to be managed for their own good..." When described this way, the FUL fails immediately because one cannot will a world where one is treated as a mere instrument (Contradiction in Will). Alternatively, they would argue the CW test was applied too loosely: a rational agent cannot will a system where their status as a rational agent is contingent on a manager's assessment of their "stress," as this undermines the very autonomy required to make wills universalizable. Thus, the divergence is illusory, stemming from an incomplete maxim description that hides the violation of autonomy.
