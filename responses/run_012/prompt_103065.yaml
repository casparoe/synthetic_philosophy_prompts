answer: |-
  Here is a specification of desiderata for a theory of music's metaphysical significance, structured to address the cases you provided while distinguishing between necessary conditions and historical prejudices.

  ### I. The Desiderata

  **1. Non-Propositional Semantics**
  *   **Motivation:** Music possesses expressive power without denoting specific objects, events, or truth-conditions. A theory must explain how meaning is conveyed without reference.
  *   **Requirement:** The theory must account for *significance without reference*. It cannot rely on a language-model of communication where sounds map to concepts.

  **2. Affective Distinction (Expression vs. Arousal)**
  *   **Motivation:** There is a phenomenological difference between music that *expresses* sadness (the persona of the music) and music that *induces* sadness in the listener. One can appreciate tragic music without becoming depressed.
  *   **Requirement:** The theory must distinguish between the *emotional character* of the object and the *emotional state* of the subject. It must explain how we recognize emotion in sound without necessarily mirroring it physiologically.

  **3. Contextual Ontology (The Framing Problem)**
  *   **Motivation:** The same sonic structure can function as music, speech, or alarm depending on the listening stance and social frame. A siren is noise; a siren sampled in a track is music.
  *   **Requirement:** The theory cannot locate the essence of music solely in the acoustic signal. It must incorporate the *intentional stance* of the listener and the *institutional or ritual frame* that designates sound as music.

  **4. Referential Flexibility (Absolute vs. Programme)**
  *   **Motivation:** Some music points to extra-musical narratives (programme), while some resists such attachment (absolute). Both are experienced as music.
  *   **Requirement:** The theory must treat reference as *contingent* rather than *constitutive*. It must explain why absolute music feels complete without a story, while programme music feels enhanced by one, without declaring one form superior or degenerate.

  **5. Universality without Homogeneity**
  *   **Motivation:** Musical systems vary radically across cultures (e.g., non-triadic harmony, non-equal temperament, rhythmic structures). Yet, the category "music" seems to apply across these variances.
  *   **Requirement:** The theory must identify a metaphysical core that is not dependent on specific syntactic rules (like Western tonality). It must avoid mistaking the conventions of one tradition for the laws of the phenomenon itself.

  **6. Dissociation of Perception and Valuation**
  *   **Motivation:** Congenital amusia (tone-deafness) can exist without abolishing rhythmic pleasure; conversely, specific musical anhedonia exists where perception is intact but emotional reward is absent.
  *   **Requirement:** The theory must decouple *structural processing* from *reward mechanisms*. It cannot claim that understanding the structure is sufficient for the metaphysical experience, nor that the experience is purely chemical reward devoid of structure.

  **7. Somatic and Social Grounding**
  *   **Motivation:** Entrainment (synchronization of movement), embodiment, and social bonding are primal musical functions, often preceding aesthetic contemplation.
  *   **Requirement:** The theory must account for the *physicality* of music. It cannot treat music as a purely mental or spiritual object; it must explain how metaphysical significance emerges from bodily synchronization and collective participation.

  **8. Dynamic Temporality**
  *   **Motivation:** Music is not a static object but a process. Its meaning unfolds in time; a chord heard in isolation differs from the same chord heard as a resolution.
  *   **Requirement:** The theory must treat music as an *event* rather than an *entity*. The metaphysical significance must be located in the *unfolding*, not just the structure.

  ---

  ### II. Genuine Requirements vs. Prejudices

  To build a robust theory, one must discard inherited biases that constrain the inquiry.

  *   **Prejudice: The "Aboutness" Constraint.** The belief that music must represent something external to be significant. This is false; it excludes absolute music and forces artificial narratives onto abstract sound.
  *   **Prejudice: The "Pure Form" Constraint.** The belief that music's significance lies *only* in internal relations (patterns, ratios). This is false; it ignores the visceral, emotional, and social impact that cannot be reduced to syntax.
  *   **Genuine Requirement:** The theory must explain the *feeling of necessity* we experience in music. Whether formal or expressive, music feels "inevitable" in its progression. A theory must explain why arbitrary sequences fail to achieve this status.
  *   **Genuine Requirement:** The theory must accommodate the *ambiguity* of musical emotion. Music is often emotionally indeterminate (bittersweet, tense yet calm). A theory demanding precise emotional labeling is flawed.

  ---

  ### III. Incompatible Requirements (The Trade-Offs)

  No theory can maximize all desiderata simultaneously. The following tensions define the philosophical landscape:

  **1. Universality vs. Contextual Ontology**
  *   **Conflict:** If music's significance is universal (metaphysical Will, acoustic universals), it should reside in the signal itself. But if the signal's status depends on framing (Contextual Ontology), the significance is relational, not intrinsic.
  *   **Implication:** You must choose: Is music a *kind of object* or a *mode of listening*? A theory claiming both risks contradiction.

  **2. Somatic Grounding vs. Metaphysical Significance**
  *   **Conflict:** If music is grounded in entrainment and biology (Somatic Grounding), its significance is evolutionary and functional. If it is metaphysical (transcending the physical), it should not be reducible to social bonding or motor synchronization.
  *   **Implication:** Reductive naturalism explains the mechanism but often eliminates the "metaphysical" weight. Metaphysical theories often float free of the biological substrate.

  **3. Dynamic Temporality vs. Structural Analysis**
  *   **Conflict:** To analyze music metaphysically, we often reify it into structures (scores, forms). But the experience is purely processual.
  *   **Implication:** A theory that relies on static structural relationships (like harmony) struggles to explain the *anticipation* and *memory* that constitute the temporal experience.

  ---

  ### IV. The Theory Killer

  **The Single Requirement that Excludes the Most Popular Theories:**
  **Contextual Ontology (The Framing Problem).**

  *   **Why:** Most traditional theories (Formalism, Referentialism, and even Schopenhauerian Metaphysics) locate the essence of music *within the acoustic signal* or the *composer's intent*.
  *   **The Exclusion:** If the exact same waveform can be "noise" in one context and "music" in another, the metaphysical significance cannot be an intrinsic property of the sound. This excludes any theory that treats music as a natural kind defined by acoustic features alone. It forces the theory to be phenomenological or institutional, which many metaphysical systems resist.

  ---

  ### V. Coda: Schopenhauer's View Against the Desiderata

  Schopenhauer's theory is potent but fails specific non-negotiable requirements.

  *   **Successes:** It excels at **Non-Propositional Semantics** (music copies Will, not Ideas) and **Affective Distinction** (it presents the emotion without the individual's motive for suffering). It captures the **Dynamic Temporality** well, as Will is a ceaseless striving.
  *   **Failures:**
      1.  **Contextual Ontology:** Schopenhauer treats music as a direct objectification of Will. He cannot easily explain why the same sound might not be music in a different frame. For him, the metaphysical status is intrinsic to the tones, not the listening stance.
      2.  **Universality without Homogeneity:** He assumes a specific Western hierarchy (melody/harmony) maps to the Will's structure. He struggles to account for musical systems that do not share this syntax without labeling them "imperfect."
      3.  **Somatic Grounding:** His view is highly cerebral/metaphysical. It has little room for entrainment, dance, or social bonding as constitutive of musical meaning, viewing these as lower-grade manifestations of Will rather than central to music's significance.

  **Verdict:** Schopenhauer provides a profound account of the *interiority* of musical experience but fails the *exterior* conditions (culture, framing, biology) required for a complete theory.
