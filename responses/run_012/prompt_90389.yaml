prompt: |-
  My friend and I got into a huge arguement at like 1am last night about whether people are actually free or whether we're just running scripts, and I don't want to have the same vague shouting match again — I want a concrete case we can both stare at, so I'm asking you to build me a thought experiment to spec. The thing we kept circling is what Hofstadter called sphexishness (I'm pretty sure he coined the word; it's named after the digger wasp whose whole elaborate routine allegedly gets derailed if you just nudge the cricket a few inches from the burrow — and apparently the wasp story itself is shaky, some researcher named Keijzer says the wasp eventually does adapt, which honestly makes the whole thing weirder and more interesting). The general shape is behavior that looks flexible and purposeful on the surface but turns out to be a fixed routine that some tiny, irrelevant change in the environment can knock completly off the rails.

  Here's the spec, and I'm definately being picky on purpose, because every easy version of this cheats. The agent has to be human, or a group of humans — a committee, an office, a team — not a bug, not a robot, not an AI; the uncomfortable version is the human one. The behavior has to genuinely pass the ordinary tests for flexibility: in lots of novel situations the agent adapts, does the smart thing, can explain why it did it, learns from mistakes, and nobody watching would call it rigid. But along exactly one dimension — and it should be a dimension that has nothing to do with how smart the agent is — the behavior has to be a routine: change some totally irrelevant feature of the situation and the agent either restarts the whole thing from the top, or produces a response it would never endorse if you pointed it out. The rigidity can't come from the agent being dumb or ignorant, or from following a rule it could just state if you asked; if you showed it the loop it's in, it should be genuinely surprised, maybe a bit embarrassed, agree it's silly — and then do it again next time anyway. It can't be brainwashing or coercion either: the routine has to be self-sustaining, feel meaningful or at least justified from the inside, and mostly produce decent outcomes, so it's not just a mistake. Keep the scenario itself to one paragraph, set somewhere ordinary — no labs, no space, no dystopias.

  Then walk me through it. Tell me which single feature is doing the work — what makes this sphexish instead of just a habit or a heuristic — and what happens if you pull that feature out. Give me the smallest change that would actually de-sphexify the agent, and say whether that change is available to the agent or only to the person watching from outside. Then say how three different people would read the case: someone who thinks free will is perfectly compatible with being a deterministic system, someone who thinks determinism kills free will, and someone who thinks sphexishness specifically is what kills it — and be honest about which of them, if any, the case actually supports; my own hunch is that it supports none of them and shows something narrower about the difference between rigidity and flexibility, but tell me if that's wrong. Finally, argue the other side for me: give the strongest way a defender of the agent could attack the case — like 'you've just relabeled a sensible habit,' or 'checking whether the cricket moved is itself costly, so the rigidity is rational' — and say whether the attack lands or the case survives it. Oh, and if there's a version where the agent is an organization rather than a single person, say in a sentence or two how the diagnosis changes.
