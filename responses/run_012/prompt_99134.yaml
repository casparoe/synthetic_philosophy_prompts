          *   *Nagel view:* Hamlet is morally lucky/unlucky. If Claudius died, it's regicide/justice. Polonius dies, it's manslaughter/error.
          *   *Hamlet's view:* "Thou wretched, rash, intruding fool, farewell." He dismisses it. He doesn't seem to feel Williams-style "agent-regret." He treats it as providential ("Heaven hath pleased it so").
