answer: |-
  You are right to feel stuck. That sentence is a "equivocation"—it sounds like one clear fact, but it actually smuggles in five different claims ranging from "boring science" to "wild science fiction."

  Here is the menu. Next time he says it, pick the number that matches what he seems to mean and tell him why it doesn't prove his point.

  ### 1. The "Input/Output" Claim
  *   **What it means:** The brain takes signals from the eyes/ears (input), does some work, and sends signals to muscles (output). Computers do the same.
  *   **Verdict:** **Obviously True.**
  *   **Does it get him there?**
      *   *Upload a mind?* **No.** A thermostat takes input and gives output; you can't upload its "mind."
      *   *Understand the mind someday?* **Yes.** This suggests we can study the mechanics.
      *   *Thoughts are software?* **No.** Processing signals doesn't mean the signals *are* thoughts.

  ### 2. The "No Magic" Claim
  *   **What it means:** The brain is made of atoms and follows the laws of physics. There is no invisible soul or magic dust involved.
  *   **Verdict:** **Obviously True** (within standard science).
  *   **Does it get him there?**
      *   *Upload a mind?* **No.** Something can be physical but still impossible to copy (like a unique quantum state).
      *   *Understand the mind someday?* **Yes.** If it's physical, it's theoretically measurable.
      *   *Thoughts are software?* **No.** Physical things aren't necessarily software (a rock is physical, but not software).

  ### 3. The "Architecture" Claim
  *   **What it means:** The brain works internally like a modern laptop (using logic gates, separate memory storage, and a central processor).
  *   **Verdict:** **Really False.**
  *   **Does it get him there?**
      *   *Upload a mind?* **No.** This is based on a misunderstanding of biology. Brains are neural networks; they are parallel, analog, and store memory in the connections, not in separate "files."
      *   *Understand the mind someday?* **No.** This actually hinders understanding because it makes us look for the wrong structures.
      *   *Thoughts are software?* **No.** Because the hardware architecture is totally different.

  ### 4. The "Substrate Independence" Claim
  *   **What it means:** It doesn't matter what the brain is made of (meat, silicon, gears). Only the *pattern* of information matters. If you copy the pattern, you copy the mind.
  *   **Verdict:** **Debatable.** (This is a philosophical stance, not a fact).
  *   **Does it get him there?**
      *   *Upload a mind?* **YES.** This is the **required** claim for uploading. If this is false, uploading is impossible.
      *   *Understand the mind someday?* **Yes.**
      *   *Thoughts are software?* **YES.** This claim literally defines thoughts as software patterns independent of the hardware.

  ### 5. The "Consciousness is Calculation" Claim
  *   **What it means:** Your subjective experience (the feeling of pain, the redness of a rose, love) is nothing more than mathematical processing. There is nothing extra beyond the computation.
  *   **Verdict:** **Debatable.** (This is the hardest problem in philosophy/science).
  *   **Does it get him there?**
      *   *Upload a mind?* **Maybe.** You might upload a "zombie" that acts like you but feels nothing.
      *   *Understand the mind someday?* **Yes.**
      *   *Thoughts are software?* **YES.** This is the **required** claim for the "scary version." If this is false, you can have the software without the thoughts.

  ***

  ### How to use this
  When he says, "The brain is just a computer," you can say:

  *   "If you mean **Number 1** (Input/Output), that's true, but it doesn't prove uploading is possible."
  *   "If you mean **Number 3** (Architecture), that's actually false; brains don't work like laptops."
  *   "If you mean **Number 4** (Substrate Independence), that's not a fact, that's a hypothesis. You're assuming the conclusion."
  *   "If you mean **Number 5** (Consciousness is Calculation), you're ignoring the hard problem of experience. You haven't proven feelings are math."

  He is likely using **Number 1** (which is undeniable) to sneak in **Number 4** (which is unproven). Pointing out that switch usually stops the argument.
