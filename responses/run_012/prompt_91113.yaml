  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe use a metaphor about building a cathedral. *Correction:* Too teleological. Use a metaphor about mapping a coastline or exploring a ruin. Let's go with "mapping a terrain" or "cataloging attempts."
