      *   **Value for Researchers:** History doesn't give lessons; it gives context for current constraints. It shows what "reasoning" has been made to mean.
      *   **Value for Historians:** Promise not to flatten the past.
      *   **Closing:** No uplift. Just the work ahead.

  7.  **Refining constraints:**
      *   *No "Whig history" phrase.*
      *   *No quotes/citations.*
