  # Activity Design: The Census and The Soul Pool

  **Target:** 12 Graduate Students (Metaphysics/Philosophy of Science).
  **Duration:** 90 Minutes.
  **Prerequisites:** Bayesian reasoning, comfort with thought experiments. No prior knowledge of anthropics.
  **Goal:** Visually and viscerally demonstrate the tension between the Doomsday Argument (selection effect on rank) and the Self-Indication Assumption (selection effect on existence), highlighting the Reference Class problem.

  ---

  ## 1. Setting and Materials

  **Room Setup:**
  *   A seminar table where all 12 students can see each other.
  *   A whiteboard for tracking scores and hypotheses.

  **Materials:**
  *   **20 Sealed Envelopes:** Numbered 1 through 20 on the outside (visible). Inside, each contains a slip of paper saying "Observer."
  *   **200 "Void" Envelopes:** (Optional prop, kept in a box) Labeled 21–200. Used to visualize the "Large World" hypothesis.
  *   **Identity Cards:** Two types (6 of each).
      *   *Type A (Narrow):* "Identity: Specific Seminar Participant."
      *   *Type B (Broad):* "Identity: Biological Organism."
  *   **Score Sheets:** One per student.
  *   **Timer:** Visible to the class.
  *   **Instructor's "World Coin":** A large prop coin (Heads = Small World, Tails = Large World).

  **Scoring System:**
  *   **"Epistemic Credits" (EC):** Fictional currency.
  *   **Start:** Each student starts with 100 EC.
  *   **Wagering:** In each stage, students must wager between 10 and 50 EC on a hypothesis.
  *   **Payoff:** If correct, they win the amount wagered (added to stack). If incorrect, they lose the amount wagered.
  *   **Prize:** The student with the most EC at the end receives a small token (e.g., a bar of chocolate or a bookmark). This creates stakes without real money.

  ---

  ## 2. Timeline and Procedure

  ### Introduction (5 Minutes)
  *   **Welcome:** "Today we are running a simulation of epistemic inference under uncertainty. You will not be told the name of the philosophical problem until the end."
  *   **Rules:** Explain the EC scoring. Emphasize that they must treat the scenario rules as *facts* for the duration of the game, even if they seem odd.
  *   **The Setup:** "We are simulating a universe. There are two possible states of this universe, determined by a hidden coin flip."
      *   **Hypothesis S (Small):** The total population of observers is **20**.
      *   **Hypothesis L (Large):** The total population of observers is **200**.
      *   **Prior:** 50% chance of S, 50% chance of L.

  ### Stage 1: The Census (30 Minutes)
  *   **Goal:** Induce the Doomsday intuition (Low Rank $\rightarrow$ Small Total).
  *   **The Fiction:** "You are observers in this universe. You have been issued a sequential Birth Rank. You do not know the Total Population ($N$). You only know your Rank ($n$)."
  *   **Distribution:**
      1.  Instructor shuffles the 20 numbered envelopes (1–20).
      2.  Instructor hands one envelope to each of the 12 students. (The remaining 8 are set aside, unseen).
      3.  **Crucial Instruction:** "Open your envelopes. Memorize your number. Do not show it to others yet."
      4.  *Note:* Because you only have envelopes 1–20, every student will receive a number between 1 and 20. This simulates the case where the observed ranks are low.
  *   **The Inference Task:**
      1.  Ask students to calculate the likelihood of their specific rank under Hypothesis S ($N=20$) vs. Hypothesis L ($N=200$).
      2.  *Bayesian Nudge:* "If $N=20$, your number is guaranteed to be $\le 20$. If $N=200$, your number had only a 10% chance of being $\le 20$."
      3.  Since all 12 students have numbers $\le 20$, the joint likelihood ratio heavily favors S. ($1^{12}$ vs $0.1^{12}$).
  *   **The Wager:**
      1.  Students privately write down their bet: **S** or **L**.
      2.  They record their wager amount (10–50 EC).
      3.  **Reveal:** Instructor reveals the "True World" for the sake of the game scoring.
          *   *Design Choice:* To maximize the lesson, you (the instructor) should have *pre-determined* the world to be **S (Small)** for this round, or simply reveal that *given the data*, S is the rational bet.
          *   *Better for integrity:* Reveal that the "Game Master" (you) actually flipped the coin. If you flipped S, they win. If you flipped L, you must explain that they drew an incredibly rare sample (1 in 10 billion).
          *   *Recommended:* Tell them: "For the purpose of scoring this round, we will treat Hypothesis S as the 'Correct' inference based on the data provided." (This avoids the logistical issue of needing a Large World to produce low numbers).
      3.  **Score:** Students who bet **S** gain EC. Students who bet **L** lose EC.
  *   **Debrief Stage 1 (Internal):** Ask: "Why did you bet Small?" Expected answer: "My number is too low to be likely in a Large World."
  *   **Takeaway:** "Your position in the sequence is evidence about the length of the sequence."

  ### Stage 2: The Soul Pool (30 Minutes)
  *   **Goal:** Induce the Self-Indication intuition (Existence $\rightarrow$ Large Total) and Reference Class divergence.
  *   **Reset:** "Clear your desks. We are now in a different metaphysical scenario. Your Birth Ranks from Stage 1 are void."
  *   **The Split:** Divide the class into two groups of 6.
      *   **Group Alpha:** Hand out **Identity Card A** ("Specific Seminar Participant").
      *   **Group Beta:** Hand out **Identity Card B** ("Biological Organism").
  *   **The Fiction:** "A Creator flipped a coin to decide how many observers to create."
      *   **Hypothesis S (Small):** Creator makes **10 Billion** observers.
      *   **Hypothesis L (Large):** Creator makes **10 Trillion** observers.
      *   **Prior:** 50% chance of S, 50% chance of L.
  *   **The Evidence:** "You find yourself existing. You are conscious."
  *   **The Divergence (Reference Class):**
      *   **Instruction to Group Alpha:** "You are a *specific* individual (e.g., Jane Doe). The Creator picks specific souls. If He makes 10 Billion souls, your chance of being created is $X$. If He makes 10 Trillion, your chance is $1000X$."
          *   *Wait, this is tricky.* Standard SIA says "I exist" is evidence for L.
          *   *Refinement for Divergence:* We need the *growth rate* of the reference class to differ.
          *   **Revised Scenario for Stage 2:**
              *   **Hypothesis S:** 10 Billion Humans / 100 Billion Organisms.
              *   **Hypothesis L:** 10 Trillion Humans / 100 Billion Organisms.
              *   (In L, Human population explodes, Organism population stays stable).
      *   **Instruction to Group Alpha (Humans):** "You are Human."
          *   In S: 10B Humans. In L: 10T Humans.
          *   Likelihood of "I am Human" given Existence: L is 1000x more likely.
      *   **Instruction to Group Beta (Organisms):** "You are an Organism."
          *   In S: 100B Organisms. In L: 100B Organisms.
          *   Likelihood of "I am Organism" given Existence: S and L are equal.
  *   **The Wager:**
      1.  Students bet on S or L based *only* on the fact that they exist and hold their Identity Card.
      2.  Group Alpha should bet **L** (SIA pull).
      3.  Group Beta should remain **Undecided/50/50** (No SIA pull).
  *   **Scoring:**
      *   Reveal the "True World" is **L (Large)**.
      *   Group Alpha (who bet L) gains EC.
      *   Group Beta (who hedged) gains/loses nothing (or small penalty for non-commitment).
  *   **Takeaway:** "The fact that you exist at all can be evidence for a larger world, *but only if* your specific type of existence is more common in the larger world."

  ### Debrief and Mapping (25 Minutes)
  *   **Reveal the Names:** "Stage 1 was the **Doomsday Argument**. Stage 2 was the **Self-Indication Assumption (SIA)**."
  *   **Map Stage 1 (DA):**
      *   *The Force:* You felt that being #7 out of 200 was unlikely.
      *   *The Mechanism:* Sampling without replacement. $P(\text{Rank} | \text{Total})$.
      *   *The Cost of Resistance:* To resist Stage 1, you must claim your rank is *not* a random sample from the total. (e.g., "I am special, so I was created early").
  *   **Map Stage 2 (SIA):**
      *   *The Force:* You felt that being created at all was more likely if more slots were available.
      *   *The Mechanism:* Sampling the world by existing. $P(\text{Exist} | \text{Total})$.
      *   *The Cost of Resistance:* To resist Stage 2, you must claim your existence is *fixed* regardless of the world size (rejecting the "random soul" analogy).
  *   **Map the Reference Class:**
      *   Highlight the split between Group Alpha and Beta.
      *   "Why did Group Alpha bet Large and Group Beta didn't? Because they counted different things."
      *   This demonstrates that anthropic conclusions depend entirely on how you define 'Observer'.
  *   **Synthesis:** "If you combine Stage 1 and Stage 2, the effects often cancel out. DA says 'Bet Small' (based on rank). SIA says 'Bet Large' (based on existence). The debate in philosophy is about which stage correctly models reality."

  ---

  ## 3. Troubleshooting: What Will Go Wrong

  **1. The "Rigged Numbers" Objection (Stage 1)**
  *   **Problem:** A student will realize that for them to all get numbers 1–20 in a World of 200, the instructor must have rigged the draw. They will claim the data is invalid.
  *   **Handle:** Acknowledge this immediately. "In a real run, if the World were Large, some of you would have number 157. We are analyzing the *conditional* case: 'Given that we observe low numbers, what should we infer?' This isolates the logic of the inference from the luck of the draw."

  **2. The "I Am Special" Objection (Stage 1)**
  *   **Problem:** Students may reject the "random sample" assumption. "I am a grad student, not a random human. I am likely to be early in the sequence of intellectuals."
  *   **Handle:** This is actually a feature, not a bug. Note it on the board under "Reference Class." Ask: "If you claim you are special, you are changing the Reference Class from 'All Observers' to 'Special Observers.' Does that save you from the Doomsday inference?"

  **3. Confusion on Stage 2 Probabilities**
  *   **Problem:** Students might struggle with the "Human vs. Organism" ratio math during the wager.
  *   **Handle:** Write the ratios clearly on the whiteboard before the wager.
      *   Alpha: $P(\text{Human}|S) \propto 10B$. $P(\text{Human}|L) \propto 10T$. Ratio 1:1000.
      *   Beta: $P(\text{Org}|S) \propto 100B$. $P(\text{Org}|L) \propto 100B$. Ratio 1:1.

  **4. Time Overrun**
  *   **Problem:** Bayesian calculations can bog down.
  *   **Handle:** Enforce a "Gut Check" rule. "Don't calculate the exact posterior. Just tell me which way the evidence pushes you and how hard." Keep the wagering phase to 5 minutes max.

  ---

  ## 4. Limitations: What This Activity Cannot Reproduce

  **1. The Temporal Stakes**
  *   **Limitation:** The Doomsday Argument is usually about the *future* survival of the species (extinction). This activity is atemporal (ranks in a static set).
  *   **Debrief Supply:** You must explicitly state: "In the real DA, 'Total Observers' translates to 'How long humanity lasts.' If the total is small, the end is near. That is why it feels like 'Doomsday.' Here, it just felt like a guess about a number."

  **2. The "No One Else" Intuition**
  *   **Limitation:** In Stage 2, students know their classmates exist. SIA often relies on counterfactual observers who *might* have existed but didn't.
  *   **Debrief Supply:** Explain: "In Stage 2, the '10 Trillion' included observers who didn't get cards. You are betting that the 'unseen' population is vast because it made *your* presence more likely."

  **3. The Emotional Weight**
  *   **Limitation:** Students are betting fake points, not their actual survival.
  *   **Debrief Supply:** "The unease you felt in Stage 1 when you realized your low rank implied a Small Total? Multiply that by the extinction of the human race. That is the philosophical force of the argument."

  ---

  ## 5. Instructor Script Snippets (Key Moments)

  **Opening Stage 1:**
  > "Do not ask how I generated these numbers. Treat them as brute facts. You are Observer #7. The Total is either 20 or 200. Where would you place your bet?"

  **Opening Stage 2:**
  > "Forget your rank. Forget your number. The only fact you have is that you are here. Does the sheer fact of your existence tell you anything about how many *others* like you exist?"

  **Closing Debrief:**
  > "Stage 1 told you: You are too early for the world to be big. Stage 2 told you: You are too lucky to exist if the world wasn't big. If both are true, they cancel. If one is false, which one? That is the current state of the literature."
