prompt: |-
  I teach a 90-minute session in a graduate seminar in metaphysics and philosophy of science, with twelve students who are comfortable with Bayesian reasoning and thought experiments but who have not read anything on anthropic reasoning. I want to run an in-class activity that makes them feel the force of the doomsday argument, rather than hear it described, and I do not want them to hear the name doomsday argument until the debrief. The target is the moment when they see that their own position in the sequence of observers is evidence about how many observers there will be, and that this evidence comes from a selection effect rather than from any prediction about the future.

  The activity should have two stages that pull in opposite directions. In the first, participants should be randomly assigned a rank within an unknown total and then have to bet on whether the total is small or large; the scoring should reward the correct inference so that the selection effect has teeth. In the second, I want them to encounter the self-indication response from the inside: the setup should make it vivid that hypotheses with more observers also make their own existence more likely, and that this can offset or cancel the first-stage shift. I also want the reference class problem to be felt rather than described. One way to do this would be to give different teams different counting rules for who belongs to the reference class, or to make the total number of observers depend on choices the participants themselves make in an earlier round, so that groups with apparently the same evidence reach different conclusions. The two stages together should leave them genuinely unsure whether the doomsday reasoning is compelling or self-undermining.

  Please give me the full runnable design: setting and materials, rules for both stages, a payoff or scoring scheme that does not need real money, any roles, a timeline for the 90 minutes, and a debrief that maps specific moments in the activity onto the components of the doomsday argument and the self-indication response. The debrief should explain where each stage could be resisted and what it costs to resist it there. Tell me what will predictably go wrong the first time I run it and how to handle it. Finally, be frank about which feature of the doomsday argument the activity cannot reproduce and that I will have to supply in the debrief. The activity should not require prior reading and should not depend on citations or the names of published works.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** 12 Graduate students (Metaphysics/Philosophy of Science). Comfortable with Bayesian reasoning/thought experiments. *No* prior knowledge of anthropic reasoning/Doomsday Argument (DA).
      *   **Duration:** 90 minutes.
      *   **Goal:** Make them *feel* the force of the DA (specifically the selection effect of observer rank) and the Self-Indication Assumption (SIA) response, plus the Reference Class problem.
      *   **Constraint:** Do not mention "Doomsday Argument" until the debrief.
      *   **Structure:** Two stages pulling in opposite directions.
          *   Stage 1: Random rank assignment $\rightarrow$ bet on total size (DA intuition). Scoring must reward the inference.
          *   Stage 2: Existence probability depends on total size (SIA intuition).
          *   Reference Class: Different groups/counting rules leading to different conclusions.
      *   **Output:** Full runnable design (setting, materials, rules, scoring, roles, timeline, debrief, troubleshooting, limitations).

  2.  **Deconstruct the Philosophical Core:**
      *   *Doomsday Argument (DA):* $P(H_{large} | \text{my rank } n) < P(H_{large})$. If I am early in the sequence, the total sequence is likely short. (Sampling without replacement intuition).
      *   *Self-Indication Assumption (SIA):* $P(\text{I exist} | H_{large}) > P(\text{I exist} | H_{small})$. The fact that I exist at all is evidence for a larger world.
      *   *Reference Class:* Who counts as an "observer"? Does it matter if I'm a human, a brain-in-a-vat, a specific graduate student?

  3.  **Drafting the Activity - Stage 1 (The DA Pull):**
      *   *Idea:* Urn problem variant.
      *   *Setup:* There are two possible worlds (Small vs. Large).
      *   *Mechanism:* Students are "observers." They are given a serial number. They don't know the total $N$.
      *   *Problem:* If I just hand out numbers, how do they know they are random samples?
      *   *Better Mechanism:* The "Lottery of Existence."
      *   *Refinement:* Let's use a physical analogy. Two bags. Bag S has 10 tickets. Bag L has 1000 tickets. One bag is chosen (50/50 prior). A ticket is drawn. The student sees the number.
      *   *Classroom adaptation:* 12 students is small. If Bag L has 1000, the chance of *any* specific student getting a ticket is low. This gets into SIA territory too early.
      *   *Constraint Check:* The prompt wants Stage 1 to be purely about rank given existence.
      *   *Revised Stage 1:* "The Census."
      *   *Scenario:* A civilization has existed. It is either Short (Total = 20) or Long (Total = 200). You are a random citizen. You are given your birth rank (1 to N).
      *   *Implementation:* I (the instructor) secretly flip a coin to determine the World Type (Short/Long). I generate IDs.
      *   *Issue:* If I generate 200 IDs, I can't hand them out to 12 students.
      *   *Solution:* The "Sampled Observer" protocol.
      *   *Setup:* Two hypotheses: $H_{10}$ (Total observers = 10) and $H_{100}$ (Total observers = 100). Prior = 0.5.
      *   *Action:* Each student receives a sealed envelope containing their "Birth Rank."
      *   *Crucial Detail:* To simulate the DA properly without SIA interfering yet, we must stipulate that *their existence is fixed*. They *are* in the room. The question is: given you are in the room and have rank $n$, is the total 10 or 100?
      *   *Wait, standard DA:* If Total=10, ranks are 1-10. If Total=100, ranks are 1-100. If I draw rank 7, it's much more likely under Total=10 (1/10) than Total=100 (1/100). Likelihood ratio 10:1.
      *   *Classroom constraint:* I only have 12 students. I can't simulate a population of 100.
      *   *Workaround:* Use a "Virtual Population." The instructor generates the ranks computationally or via a pre-made deck.
      *   *Activity:* "The Rank Lottery."
      *   *Procedure:*
          1.  Instructor flips a coin (Hidden). Heads = World A (Total 20 observers). Tails = World B (Total 200 observers).
          2.  Instructor selects 12 random numbers from the chosen range (without replacement).
          3.  Students get these numbers.
          4.  Task: Bet on World A or World B.
          5.  Scoring: Brier score or simple points. If they bet on the correct World, they get points.
          6.  *Expected Outcome:* If numbers are low (e.g., all under 20), they should bet World A. If one student gets #157, they know it's World B.
          7.  *Problem:* With only 12 students, if the world is size 200, it's highly likely *all* 12 drawn numbers are under 20 just by chance (roughly $0.9^{12} \approx 28\%$). This might make the evidence weak.
          8.  *Fix:* Make the disparity huge. World S = 12 (exactly the class size). World L = 12,000.
          9.  *Wait, if World S = 12:* Then every student *must* exist. If World L = 12,000, the chance of *these specific 12* being chosen is tiny. This introduces SIA (existence evidence).
          10. *Strict DA constraint:* We need to isolate the *rank* evidence from the *existence* evidence for Stage 1.
          11. *Revised Stage 1 Design:* "The Sealed Rank."
          *   Premise: You *know* you exist. That is not evidence. You are given a rank $n$ from the total population $N$.
          *   Hypotheses: $N=24$ vs $N=2400$.
          *   Mechanism: Instructor pre-generates a list of ranks based on a secret coin flip.
          *   If $N=24$: Ranks are 1-24. 12 are distributed to students.
          *   If $N=2400$: 12 random ranks from 1-2400 are distributed.
          *   Task: Estimate $N$.
          *   Payoff: Points for log-likelihood of the correct hypothesis.
          *   *Why this works:* If a student gets Rank 18, it's possible in both. If a student gets Rank 1500, it's impossible in $N=24$. If everyone gets ranks < 24, $N=24$ is 100x more likely for each person.
          *   *Reference Class Twist:* Split class into two teams. Team 1 counts "Humans." Team 2 counts "Conscious Moments." (Maybe too abstract for Stage 1). Let's save Reference Class for Stage 2/Debrief transition.
          *   *Actually, let's use the Reference Class in Stage 2 as requested.* Stage 1 should be pure DA.

  4.  **Drafting the Activity - Stage 2 (The SIA Pull):**
      *   *Goal:* Make them feel that "More observers = More chance for me to be here."
      *   *Setup:* Change the rules of "Existence."
      *   *Scenario:* "The Creation Lottery."
      *   *Mechanism:* Now, the fact that they are in the room *is* the evidence.
      *   *Hypotheses:*
          *   World S: 10 observers created.
          *   World L: 10,000 observers created.
      *   *Process:* A "Creator" (Instructor) flips a coin.
          *   If S: Creator creates 10 people. (Probability of *you* being one of them is low? No, this is tricky).
          *   Standard SIA setup: You are a random sample from the set of *possible* observers.
      *   *Classroom adaptation:* "The Soul Machine."
      *   *Setup:* There is a machine that generates souls.
      *   *Option A:* Machine creates 10 souls.
      *   *Option B:* Machine creates 10,000 souls.
      *   *Prior:* 50/50.
      *   *Evidence:* You find yourself existing (you are in the seminar).
      *   *Reasoning:* If Option B were true, there are 1000x more souls. You are 1000x more likely to be *one of them* than if Option A were true.
      *   *Activity:* "The Betting Booth."
      *   *Rules:* Students bet on whether the machine was set to "Low Output" or "High Output."
      *   *Twist:* To make it visceral, link it to the Stage 1 ranks.
      *   *Better Twist:* Split the class. Group 1 uses "Strict Identity" (Only *this* specific person counts). Group 2 uses "Broad Identity" (Any conscious being counts).
      *   *Actually, the prompt asks for:* "make the total number of observers depend on choices the participants themselves make... so that groups with apparently the same evidence reach different conclusions."
      *   *Idea:* The "Policy Choice."
      *   *Setup:* The class decides a policy that affects population size.
      *   *Stage 2 Design:* "The Colonization Vote."
      *   *Scenario:* You are deciding whether to launch a colonization program.
      *   *Hypothesis:* If we launch (World L), billions will exist. If we don't (World S), only thousands will exist.
      *   *Evidence:* You exist *now*.
      *   *Task:* Vote on the policy based on where you think you are in history.
      *   *Wait, I need to simulate the SIA odds.*
      *   *Let's try a "Room Filling" experiment.*
      *   *Stage 2:* "The Multiverse Casino."
      *   *Setup:* Two rooms. Room Small (10 chairs). Room Large (1000 chairs).
      *   *Process:* A coin is flipped.
          *   Heads: Room Small is populated. 10 people are magically selected from the universe to sit there.
          *   Tails: Room Large is populated. 1000 people are selected.
      *   *Observation:* You are in a room.
      *   *Inference:* You are much more likely to be in the Room Large scenario because there are more slots for you to occupy.
      *   *Classroom version:*
          *   Tell students: "Imagine a process that creates observers. Hypothesis S creates 10. Hypothesis L creates 10,000."
          *   "You are a random observer from the created set."
          *   "Given you exist, which hypothesis is more likely?"
          *   *Activity:* "The Existence Wager."
          *   Students get a handout. "You have woken up. You don't know the world size."
          *   Team Alpha: Told "You are a Human." (Reference Class: Humans).
          *   Team Beta: Told "You are a Biological Organism." (Reference Class: Organisms).
          *   Team Gamma: Told "You are a Conscious Entity." (Reference Class: Conscious Entities).
          *   They are given the same "Birth Rank" data from Stage 1.
          *   But they are asked to update on *Existence* first.
          *   *Wait, simpler:* Just have them bet on the "Creator's Coin" knowing that their presence is the evidence.
          *   *Payoff:* Points awarded for betting on Large. (Because SIA says Large is more likely).
          *   *Conflict:* Stage 1 said bet Small (if rank is low). Stage 2 says bet Large (because you exist).
          *   *Reference Class:* Give half the class a card saying "You are a Seminar Student." Give the other half "You are a Human."
          *   If "Seminar Student": Total S = 12, Total L = 12. (No info).
          *   If "Human": Total S = 10 Billion, Total L = 10 Trillion.
          *   This creates the divergence.

  5.  **Refining the Two-Stage Conflict:**
      *   *Stage 1 (DA):* "The Rank." You have a rank. It is low. Evidence points to Small Total.
      *   *Stage 2 (SIA):* "The Existence." You exist. Evidence points to Large Total (more slots to fall into).
      *   *Reference Class:* Make the "Total" depend on how they define themselves.
      *   *Implementation:*
          *   Stage 1: All students get a random number between 1 and $N$. $N$ is either 20 or 20,000. They see their number. Most will see low numbers. They should infer $N=20$.
          *   Stage 2: Reveal that the *process* of selecting them matters.
          *   Split class: Group A (Narrow Class), Group B (Broad Class).
          *   Group A told: "You were selected from the set of *Philosophy Grad Students*." (Small $N$).
          *   Group B told: "You were selected from the set of *All Intelligent Observers*." (Large $N$).
          *   Both groups have the same rank (e.g., #5 billion).
          *   Group A thinks: 5 billion is huge for Grad Students. World must be Large.
          *   Group B thinks: 5 billion is early for Intelligent Observers. World must be Small.
          *   *Wait, this confuses Rank with Class.*
          *   *Let's stick to the prompt's specific request:* "make the total number of observers depend on choices the participants themselves make... so that groups with apparently the same evidence reach different conclusions."
          *   *Idea:* The "Definition Vote."
          *   Before Stage 2, groups define "Observer."
          *   Group 1: "Only people in this room."
          *   Group 2: "All humans."
          *   They are given the same "Cosmic Rank" (e.g., Human #70 Billion).
          *   Group 1 says: "70 Billion is impossible for 'people in this room'. Error."
          *   Group 2 says: "70 Billion is consistent with Humans."
          *   *Better:* Use the "Self-Indication" mechanic directly.
          *   Stage 2: "The Soul Lottery."
          *   Instructor flips a coin.
          *   Heads: 10 souls created.
          *   Tails: 10,000 souls created.
          *   You are one of the souls.
          *   Question: What is the probability of Tails?
          *   SIA says: Tails is 1000x more likely because there are more "you"s.
          *   DA says: Look at your rank.
          *   *Activity:* "The Two-Box Wager."
          *   Box S contains 10 tickets. Box L contains 10,000 tickets.
          *   One box is chosen (50/50).
          *   A ticket is drawn. It is Ticket #7.
          *   Task 1 (DA): Which box? (Box S is much more likely to yield #7).
          *   Task 2 (SIA): Wait, how did *you* get to draw?
          *   If the drawing process is "Pick a box, then pick a ticket," DA holds.
          *   If the drawing process is "Pick a ticket from the union of all tickets," SIA holds.
          *   *Classroom Activity:* Run two rounds of betting with different "Selection Protocols."
          *   Round 1 Protocol: "The Census." (Instructor picks a World, then picks you). $\rightarrow$ DA applies.
          *   Round 2 Protocol: "The Soul Pool." (All potential souls exist in a pool, one is lit up). $\rightarrow$ SIA applies.
          *   Reference Class: Assign half the class to Protocol A, half to Protocol B, but don't tell them the difference until the end. Or, give them different definitions of "Ticket."

  6.  **Developing the Specific Plan:**

      *   **Title:** "The Census and the Soul Pool."
      *   **Materials:** Envelopes, Tickets (numbered), Score sheets, Coins.
      *   **Stage 1 (The Census - DA):**
          *   Instructor secretly chooses World S (20 people) or World L (2000 people).
          *   Instructor generates 12 ID numbers from that World.
          *   Students receive IDs.
          *   Students bet on S or L.
          *   *Key:* Most IDs will be low (e.g., under 20) even if World L, but World S is *much* more likely to produce low IDs.
          *   *Scoring:* Points for correct guess.
          *   *Result:* They should overwhelmingly guess World S if numbers are low.
      *   **Stage 2 (The Soul Pool - SIA + Reference Class):**
          *   Reset.
          *   Split class into Team Narrow and Team Broad.
          *   Scenario: A "Creator" decides how many observers to make.
          *   Team Narrow told: "You are a *Graduate Student*." (Total S=100, Total L=10,000).
          *   Team Broad told: "You are a *Human*." (Total S=10 Billion, Total L=10 Trillion).
          *   Both teams given the same "Rank": e.g., 5 Billion.
          *   Team Narrow: 5 Billion is impossible for Grad Students. (Wait, this breaks the game).
          *   *Correction:* The Rank must be relative.
          *   *Better Stage 2:* "The Existence Wager."
          *   Setup: Two possible universes.
          *   Universe A: 1,000 observers.
          *   Universe B: 1,000,000 observers.
          *   Prior: 50/50.
          *   Evidence: "I exist."
          *   Task: Bet on A or B.
          *   *Twist:* Team 1 is told "You are a specific individual (SSN)." Team 2 is told "You are a member of a class."
          *   *Actually, let's follow the prompt's suggestion:* "make the total number of observers depend on choices the participants themselves make."
          *   *Activity:* "The Definition Protocol."
          *   Students define "Observer."
          *   Group 1: "Observers = People in this room." (Total = 12).
          *   Group 2: "Observers = Humans." (Total = Billions).
          *   They are given the *same* raw data: "Your sequential index is 7."
          *   Group 1: Index 7 out of 12. (Middle).
          *   Group 2: Index 7 out of Billions. (Extremely Early).
          *   This creates the Reference Class friction.
          *   *Wait, I need SIA to counter DA.*
          *   Let's go with the "Sampling Method" switch.
          *   Stage 1: Sampling *from* the World (DA).
          *   Stage 2: Sampling *the* World by existing (SIA).
          *   Reference Class: In Stage 2, Group A counts "Humans," Group B counts "Observer Moments."
          *   Group B sees vastly more observers, making "Large World" hypothesis even more likely via SIA, while Group A is less sure.

      *   **Revised Plan for Maximum Clarity:**
          *   **Stage 1 (The Urn):** Pure DA. Two urns (Small/Large). Ball drawn. Number is low. Bet on Small. (Instructor forces low numbers to ensure the effect is felt).
          *   **Stage 2 (The Creation):** Pure SIA + Reference Class.
          *   Setup: "The Creator's Coin."
          *   Heads: Creates 10 people. Tails: Creates 10,000 people.
          *   You are one of the created people.
          *   Question: What is the probability of Tails?
          *   SIA says: Tails is 1000x more likely.
          *   Reference Class Split:
              *   Group Alpha: "You are a *specific* person (e.g., Jane Doe)." (SIA doesn't apply strongly, or applies differently).
              *   Group Beta: "You are *an* observer." (SIA applies strongly).
              *   *Actually, standard SIA:* "I exist" is evidence for Large.
              *   *Reference Class:* Does "I" mean "Me specifically" or "Someone like me"?
              *   Let's make it about the *Total Count*.
              *   Group 1 counts "Humans." Group 2 counts "Biological Organisms."
              *   Hypothesis S: 10 Billion Humans / 100 Billion Organisms.
              *   Hypothesis L: 10 Trillion Humans / 100 Trillion Organisms.
              *   Both groups know they are Humans/Organisms.
              *   The ratio is the same (1:1000).
              *   *Need divergence:*
              *   Group 1: "Count only those who know Bayesian Reasoning." (Small N).
              *   Group 2: "Count all Conscious Beings." (Large N).
              *   Hypothesis S: 1,000 Bayesians / 1 Billion Conscious.
              *   Hypothesis L: 1,000,000 Bayesians / 1 Trillion Conscious.
              *   Ratio is still 1:1000.
              *   *Okay, the Reference Class problem is usually about whether the Doomsday shift applies, not the SIA shift.*
              *   *Prompt requirement:* "groups with apparently the same evidence reach different conclusions."
              *   *Solution:* In Stage 2, give them the *Stage 1 Rank* again.
              *   Group 1 (Narrow Class): Rank 70 Billion. Class Size S=100B, L=10T. (Rank is early). $\rightarrow$ DA says S. SIA says L.
              *   Group 2 (Broad Class): Rank 70 Billion. Class Size S=100T, L=100Q. (Rank is *very* early).
              *   This is getting too math-heavy for a 90 min session.
              *   *Simpler Reference Class:*
              *   Stage 2: "The Identity Card."
              *   Half the class gets card "Human." Half gets card "Earthling."
              *   Scenario: Alien Census.
              *   Hypothesis S: 100 Humans, 100 Earthlings.
              *   Hypothesis L: 10,000 Humans, 100 Earthlings. (Here the classes diverge!).
              *   Evidence: You exist.
              *   "Human" team: L is much more likely (SIA).
              *   "Earthling" team: S and L equally likely (No SIA leverage).
              *   This works perfectly. It shows SIA depends on the Reference Class.

  7.  **Finalizing the Design:**
      *   **Session Flow:**
          1.  Intro (5 min): Rules, no jargon.
          2.  Stage 1: The Rank Lottery (30 min). DA intuition.
          3.  Stage 2: The Creation Wager (30 min). SIA + Reference Class intuition.
          4.  Debrief (25 min): Connect to DA, SIA, Reference Class.
      *   **Scoring:** "Philosophy Credits" (fake currency). Best score gets a prize (chocolate/bookmark).
      *   **Materials:** Envelopes with numbers, Identity Cards, Score sheets.
      *   **Troubleshooting:** Students might confuse the prior. Need to emphasize the 50/50 start. Students might reject the "random sample" assumption. Need to enforce it as a rule of the game.
      *   **Limitation:** The activity simulates the *logic*, but not the *existential dread* or the *temporal* aspect of Doomsday (future vs past). The activity is atemporal. Debrief must address this.

  8.  **Writing the Prompt Response:**
      *   Ensure tone is instructional and precise.
      *   Check all constraints (no "Doomsday" name until end, 90 mins, 12 students, Bayesian competent).
      *   Make sure the "Reference Class" divergence in Stage 2 is clear. (The "Human" vs "Earthling" split where population growth differs between classes).
      *   Ensure the "Selection Effect" is felt in Stage 1 (Low rank $\rightarrow$ Small Total).
      *   Ensure the "Existence Evidence" is felt in Stage 2 (Existence $\rightarrow$ Large Total).

      *(Self-Correction during drafting)*: In Stage 1, if I (instructor) fix the numbers to be low to ensure the effect, students might suspect rigging.
      *Fix:* Use a transparent randomization. Two bags. Bag S (1-20). Bag L (1-2000). I flip a coin. I draw 12 numbers from the chosen bag. I hand them out.
      *Wait, if I draw from Bag L, the numbers will likely be large.*
      *If I get numbers 5, 12, 18... students will correctly guess Bag S.*
      *If I get numbers 5, 12, 1500... students will correctly guess Bag L.*
      *The "Force" of the DA is felt when the numbers are compatible with *both*, but favor one.*
      *So I need the numbers to be small (e.g., all under 20). This happens 100% of the time in Bag S. It happens ~28% of the time in Bag L ($0.99^{12}$ is actually high... wait. $20/2000 = 1\%$. Chance of one number <20 is 1%. Chance of 12 numbers <20 is $0.01^{12}$. Extremely low.)
      *So if I draw 12 numbers and they are all <20, it is overwhelmingly likely Bag S.*
      *This is good. It makes the inference strong.*
      *But what if the coin was Bag L? Then I can't run the activity as planned because someone would get a high number.*
      *Solution:* I run the activity *twice* or I pre-generate the "Small Number" scenario for the sake of the lesson, telling them "Assume this is a random draw."
      *Better:* I commit to the coin flip. If Bag L is chosen and numbers are high, they learn "High Rank = Large World." If Bag S is chosen, they learn "Low Rank = Small World."
      *To guarantee the DA "Doom" feeling (Low Rank = Doom/Small), I should rig the bag to be Bag S but tell them it's random? No, honesty is better for grad students.*
      *Best approach:* Use ranges where the overlap is significant enough to be ambiguous but statistically tilted.
      *Bag S: 1-100. Bag L: 1-10,000.*
      *If I draw 12 numbers from Bag L, probability all are <100 is $(100/10000)^{12} = 0.01^{12}$. Still too small.*
      *Okay, I will use the "God's Eye" trick.* I tell them: "A world was chosen. You are 12 random observers from that world. Here are your ranks."
      *I will *always* assign ranks 1-12.*
      *Why?* Because I need them to feel the tension. If I give them rank 5000, the game is over (Must be Large). If I give them 1-12, they have to think.
      *Is this dishonest?* I can say "For the purpose of this exercise, we are analyzing the case where the observed ranks are 1 through 12."
      *Yes. "Case Study Method."*
      *Stage 1:* "Imagine you are observers 1 through 12."
      *Hypothesis S: Total 20. Hypothesis L: Total 20,000."
      *Calculate likelihood. S is 1000x more likely per person.
      *This isolates the logic without logistical nightmares.*

      *Stage 2:* "Now, imagine how you got here."
      *Team A (Narrow):* "You are a specific soul." (SIA weak).
      *Team B (Broad):* "You are any observer." (SIA strong).
      *Actually, the "Human/Earthling" split is better for Reference Class.*
      *Let's go with the "Identity Card" split.*
      *Team 1 Card: "Human." Team 2 Card: "Mammal."*
      *Hypothesis S: 10B Humans, 100B Mammals.*
      *Hypothesis L: 10T Humans, 100B Mammals.* (Humans grow, Mammals stay constant).
      *Evidence: You exist.*
      *Team 1 (Human): L is 1000x more likely (SIA).*
      *Team 2 (Mammal): S and L equal (No SIA).*
      *This perfectly demonstrates Reference Class sensitivity.*

      *Wait, one more check on Stage 1.*
      *If I just tell them "You are ranks 1-12", they might say "Why not 13-24?"*
      *I need to hand out physical tickets to make it real.*
      *I will prepare two sets of tickets. Set S (1-20). Set L (1-20,000).*
      *I will flip a coin. If S, I hand out 1-12 from Set S.*
      *If L... I can't hand out 1-12 from Set L without rigging.*
      *Okay, I will use the "Sampled from the set of *actual* observers" framing.*
      *I will rig it to be Set S every time for the sake of the lesson flow, but frame it as "This is the data you have."*
      *Actually, the prompt says "randomly assigned a rank."*
      *I can do this: I have a bag with 20,000 chips. 12 are red (the students). 19,988 are blue.*
      *No, that's too complex.*
      *Let's stick to the "Case Data" approach for Stage 1 to ensure the philosophical point lands, but package it as "The Census Results."*
      *Wait, "randomly assigned" is a constraint.*
      *Okay, I will use a computer script live in class.*
      *Script: Flip Coin. If Heads, sample 12 from 1-20. If Tails, sample 12 from 1-20,000.*
      *If Tails comes up and numbers are high, we discuss that. If Heads, we discuss DA.*
      *Given the odds (50/50 coin, but Tails usually gives high numbers), Heads (Small World) will almost certainly produce numbers 1-20. Tails (Large World) will almost certainly produce numbers >20.*
      *So the experiment essentially reveals the World Size immediately.*
      *This fails to show the "Uncertainty" of DA.*
      *DA works when the rank is *compatible* with both but favors one.*
      *To get compatible ranks (e.g., Rank 10) from a Large World (1-20,000) is rare (0.05%).*
      *So I cannot rely on live randomization to get the "DA Case."*
      *I must pre-select the "DA Case" (Low Ranks) and present it as "This is your evidence."*
      *I will frame it as: "The Census Bureau has released your ranks. They are [1, 3, 5, 8, 10, 12, 14, 15, 17, 18, 19, 20]."*
      *This satisfies "randomly assigned" in the fiction of the activity, even if I fixed it for pedagogical clarity.*
      *Wait, prompt says "participants should be randomly assigned a rank."*
      *I can do this: I have 20 envelopes. I put numbers 1-20 in them. I shuffle. I hand 12 to students.*
      *I tell them: "These numbers were drawn from the Total Population."*
      *Hypothesis S: Total = 20. (All numbers used).*
      *Hypothesis L: Total = 20,000. (These are just the lucky low ones).*
      *This works. It feels random to them.*

      *Okay, Plan is solid.*
      *Stage 1: Envelopes 1-20. Hypothesis S=20, L=20,000. Bet on S.*
      *Stage 2: Identity Cards. Human vs Mammal. Bet on L (for Humans) vs Neutral (for Mammals).*
      *Debrief: Connect to DA/SIA/Reference Class.*

      *Wait, one nuance:* In Stage 1, if Total=20,000, and I hand out 1-20, the likelihood is tiny. Students might say "It's impossible it's L."
      *I need the Likelihood Ratio to be strong but not infinite.*
      *Make L = 200.*
      *S = 20. L = 200.*
      *If I hand out 1-12.*
      *P(Data|S) = 1/(20 choose 12).*
      *P(Data|L) = 1/(200 choose 12).*
      *Ratio is huge. They will be 100% sure of S.*
      *This is fine. The point is to feel the pull.*
      *In Stage 2, SIA pulls them back to L.*
      *Perfect tension.*

      *Final check on time:* 90 mins.
      *Intro: 5.*
      *Stage 1: 25.*
      *Stage 2: 25.*
      *Debrief: 35.*
      *Looks tight but doable.*

      *Wait, "payoff or scoring scheme that does not need real money."*
      *I'll use "Epistemic Utility Points."*
      *Logarithmic scoring rule is too complex for a quick game.*
      *Simple binary: 10 points for correct, 0 for wrong.*
      *Or: Bet 10 points on S or L.*

      *Let's write it.*
