answer: |-
  I define a belief as a dispositional state attributable to a system such that, when combined with attributed desires, it yields successful predictions of that system's behavior under rational norms. On this view, the log you describe is merely a particularly legible vehicle for the intentional state, not the source of its intentionality. You claim the content is fixed by the engineers' schema, but I deny this: the engineers fix the *format*, but the *content* is fixed by the causal role that string plays in the system's economy. If the engineers wrote "the vault is open" but the system consistently acted as if it were shut, we would say the log was lying, not that the system believed the vault was open. The fact that the transplant works proves the system is already organized to treat that string as a belief; the schema merely exploits a pre-existing intentional structure rather than creating it ex nihilo.

  I take the horn that the intentional stance remains fundamental, and the log is just a convenient probe that makes the attribution easier, not different in kind. I concede that the log is causally upstream and that reading it is a shortcut, but I deny that this reduces the stance to mere bookkeeping. The evidence that would count against my stance is not the presence of a log, but a breakdown in predictive success: if the log says "vault open" and the goal is "get gold," but the system walks away from the vault randomly or systematically irrationally, then the belief attribution fails regardless of what the string says. The stance earns its keep by tracking the pattern of rationality, not by reading the labels; if the labels cease to track the rationality, the stance discards them, which proves the stance is master, not servant.
