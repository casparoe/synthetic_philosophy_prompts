      *   *Start:* 11-1 for Guilty. Juror 8 dissents.
      *   *Process:* Argument, evidence re-evaluation, personal biases revealed.
      *   *End:* 12-0 for Not Guilty.
      *   *Key Dynamic:* Shift from "I think he's guilty" to "We agree there is reasonable doubt."

