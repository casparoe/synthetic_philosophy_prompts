      *   *I-Mode vs. We-Mode:* (Searle, Tuomela, Gilbert). I-mode = individual reasoning aligned with others. We-mode = reasoning as a group member, committed to the group's goal.
      *   *Joint Commitment:* (Gilbert). A commitment created together that binds individuals, creating obligations to each other.
      *   *Group Agency:* (List, Pettit). Can the group itself be an agent with beliefs/intentions distinct from members?
