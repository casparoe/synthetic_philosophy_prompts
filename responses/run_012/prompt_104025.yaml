      *   *Intellect vs. Intuition:* Intellect spatializes time (treats it like space, divisible, measurable). Intuition grasps duration directly.
      *   *The Cinematographical Method:* In *Creative Evolution*, Bergson argues the intellect understands motion like a movie camera: static snapshots + abstract time. He says this is *how the intellect works*, not necessarily how reality or deep consciousness works.
      *   *Memory:* In *Matter and Memory*, memory is not stored in the brain like a hard drive; it's virtual, co-existing with the present. Perception is always impregnated with memory.
      *   *The "Present":* There is no mathematical instant. The present is a thick slice of duration where past flows into future.

  3.  **Analyze the Color Phi Phenomenon through Bergsonian Lenses:**
      *   *The Dennett Trap:* Dennett's Orwell/Stalin dichotomy assumes a "Cartesian Theater" (a place where things happen in a specific order). Bergson rejects the idea that consciousness is a sequence of discrete states located at specific coordinates in time.
      *   *The "Frames":* The experiment uses discrete stimuli (dots). The intellect (and the experimental setup) treats these as points in space-time. Bergson would say the *setup* is spatialized, but the *experience* is duration.
      *   *The "Editing":* If the brain "edits" the timeline, it implies there *was* a timeline to edit. Bergson would argue the experience *is* the whole movement. The color change isn't an event at $t_1$ or $t_2$; it's a quality of the movement itself.
