prompt: |-
  I did an engineering degree and I've spent about a decade now doing control systems — Kalman filters, observers, MPC, setpoints, cost functions, tuning weights until the thing stops oscillating. Never took a philosophy class past first year, so go easy on me with the jargon.

  Someone recently told me about this view called eliminative materialism and it's been rattling around my head since. As I understand it: the everyday vocabulary of beliefs and desires, plus hopes and fears and intentions and the rest, is basically a folk theory of how people work. It makes predictions and it's been handy, but it's the wrong kind of theory, and the entities it posits are not going to show up in a mature science of the brain, the way phlogiston didn't show up in chemistry. So when someone says he believes there's milk in the fridge, that's supposed to be less like the pressure is 3 bar and more like he's got the wrong amount of phlogiston in him — a sentence that fails to refer rather than one that's just false. I'm also hazy on whether the claim is that belief-talk gets thrown out entirely or that it gets redefined into something else. Correct me if I've mangled any of that.

  What I'd like is for you to translate the whole position into the vocabulary I actually think in. What is a belief in the language of state estimation? What is a desire in the language of reference signals and cost functions? Do intentional states map onto estimates and setpoints, or onto latent variables, or onto the plant model itself? Does the aboutness of a belief have any counterpart in a filter that tracks a hidden state it can't see directly? And is there anything in my vocabulary that plays the role of an attitude being correct or justified, as opposed to just being the output of a well-tuned estimator with a decent process model?

  Then the part I actually care about, the residue report. Tell me which bits of the eliminativist position go through cleanly, which bits you had to bend to make fit, and which bits have no expression in my vocabulary at all. For each thing that doesn't survive, say whether that's my vocabulary being too thin — is control theory just blind to somthing real about minds? — or whether it's a sign the original claim was vaguer than it sounded. My suspicion going in is that once you put it this way, the whole do-these-things-exist-or-not question collapses into is-this-model-good-enough-for-the-job, which is a question engineers never get worked up about. I want to know if that's a genuine insight or if I'm just refusing to engage with the metaphysics because my training gives me nowhere to put it. That question is probably the most interesting one on the list, so don't skimp on it.

  Write it as continuous prose, please. No headings, no bullet points, no bold, no tables — just paragraphs, like you were explaining it to me over a beer. And I don't need a reading list or citations, I definately won't read them.
