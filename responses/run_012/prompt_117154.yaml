answer: |-
  **PHI 405: KANT'S MORAL PHILOSOPHY**
  **FINAL EXAMINATION**

  **Time Allowed:** 60 Minutes
  **Total Marks:** 30
  **Word Limit:** Approximately 700 words
  **Instructions:** This is a closed-book examination. You may not quote from or cite the text. Answer the following question.

  ***

  **Question:**

  Consider the following stipulated procedure:

  > **The Universal Extinction Test (UET).** Let a maxim be a general principle of action specifying a type of action and the end for which the agent performs it. A maxim fails the UET if and only if, in the world in which every agent acts on that maxim, no agent ever successfully performs the action type the maxim prescribes, where success means attaining the specified end by the specified means. Otherwise the maxim passes.

  Write an essay that addresses the following five tasks:

  1.  State precisely what the UET asks and identify, unprompted, which element of Kant's own procedure it reconstructs and which it discards.
  2.  Apply the UET to Kant's four standard examples (suicide, lying promise, neglected talents, refusal to help). Say for each whether the UET agrees with Kant's verdict and, where it does not, exactly why.
  3.  Diagnose the pattern in those agreements and disagreements. Say what that pattern shows about whether the contradiction-in-conception test and the contradiction-in-the-will test can be run by a single procedure. Assess whether the UET's shortfall, if there is one, is a defect in the test or instead evidence that Kant's second test rests on an assumption the first test does not need.
  4.  Construct one maxim of your own devising, not among the four examples, on which the UET returns a verdict that is implausibly permissive or implausibly restrictive. Use it to press the difficulty that a maxim may be redrawn at a different level of generality so as to reverse the verdict. Say how a defender of the UET ought to reply and whether the reply succeeds.
  5.  Reach a verdict on whether the UET is a defensible reconstruction of the universalizability test, and name the single consideration that would most change your mind.

  ***

  **MODEL ANSWER**

  The Universal Extinction Test (UET) asks whether an action type becomes impossible to successfully perform if universalized. Specifically, it checks if the means-end relationship specified in the maxim collapses when everyone adopts it. This reconstructs Kant's contradiction in conception (CC) test, which identifies perfect duties, but it discards the contradiction in the will (CW) test, which identifies imperfect duties. The UET focuses strictly on the possibility of the action, ignoring the volitional consistency of the agent.

  Applied to Kant's four examples, the UET yields mixed results. The lying promise fails the UET. If everyone made false promises to secure loans, the institution of promising would collapse; no one would believe a promise, so the end (securing a loan via a promise) could not be attained. This agrees with Kant's verdict that lying promising is forbidden. The suicide maxim, however, passes the UET. Kant classifies suicide from self-love as a perfect duty violation, but under the UET, the action remains physically possible even if universalized. If everyone ended their life to avoid pain, they would still successfully achieve that end. The UET therefore disagrees with Kant's verdict, though it must be noted that the customary classification of the suicide example as a clear case of CC is itself contested in the literature.

  The maxims of neglected talents and refusal to help both pass the UET. A world where no one cultivates abilities or aids others is bleak, but the actions remain physically possible; one can still neglect talents even if everyone does. Here the UET disagrees with Kant, who forbids these maxims under imperfect duties. The pattern is clear: the UET captures cases where the action becomes logically or physically impossible (CC), but it lets through cases where the action is possible but volitionally inconsistent (CW). This suggests the two tests cannot be run by a single procedure like the UET. The shortfall is not merely a defect in the UET but evidence that the CW test rests on a substantive assumption the CC test does not need: that rational agents necessarily will certain ends, such as their own happiness or the perfection of their capacities. The UET lacks this teleological commitment, treating maxims as purely formal mechanisms rather than expressions of a rational will.

  To illustrate the UET's vulnerability to maxim description, consider the maxim: "Take unguarded property." The UET passes this; even if everyone takes unguarded items, the action succeeds. However, if redescribed as "Take property without consent," the UET might fail, as the institution of property could collapse, making "taking property" impossible. The verdict reverses based on the level of generality. A defender of the UET might reply that maxims must include the agent's specific intention to stabilize description, preventing arbitrary redescription. This reply fails, however, because without an independent, principled rule for determining the correct level of description, the test remains manipulable by the agent.

  Ultimately, the UET is not a defensible reconstruction of the full universalizability test. It is too narrow, capturing only perfect duties while missing the normative force of imperfect duties. It reduces Kant's moral logic to a test of institutional stability rather than rational consistency. The single consideration that would most change my mind is the discovery of a principled, non-arbitrary account of maxim description that prevents gerrymandering while preserving the test's formal nature. Without such an account, the UET remains a useful heuristic for logical contradictions but fails as a comprehensive moral criterion.

  ***

  **MARKING SCHEME**

  **Total Marks: 30**

  **Task 1: Definition and Identification (4 Marks)**
  *   **2 Marks:** Correctly states UET asks if the action/end becomes impossible under universalization.
  *   **2 Marks:** Identifies UET reconstructs Contradiction in Conception (CC) and discards Contradiction in the Will (CW).
  *   *Specific Error:* Identifying UET as CW or confusing CC/CW roles costs 2 marks.

  **Task 2: Application to Four Examples (8 Marks)**
  *   **2 Marks (Lying Promise):** Correct verdict (Fails/Agrees) + reasoning (institution of trust collapses).
  *   **2 Marks (Suicide):** Correct verdict (Passes/Disagrees) + reasoning (physical action remains possible). Must register that Kant's classification here is contested.
  *   **2 Marks (Talents):** Correct verdict (Passes/Disagrees) + reasoning (action possible).
  *   **2 Marks (Help):** Correct verdict (Passes/Disagrees) + reasoning (action possible).
  *   *Specific Error:* Asserting UET fails Talents/Help without showing physical possibility costs 1 mark per example. Failing to note the contested nature of the suicide example costs 1 mark total.

  **Task 3: Diagnosis and Assumption (6 Marks)**
  *   **3 Marks:** Diagnoses pattern: UET captures CC (Perfect Duties) but misses CW (Imperfect Duties). States they cannot be run by a single procedure.
  *   **3 Marks:** Assesses shortfall: Identifies that CW rests on a substantive/teleological assumption (agents necessarily will certain ends/happiness) that CC/UET does not need.
  *   *Specific Error:* Claiming CW is just about "undesirable consequences" rather than volitional inconsistency/necessary ends costs 3 marks.

  **Task 4: New Maxim and Generality Objection (8 Marks)**
  *   **2 Marks:** Constructs a valid new maxim (not one of Kant's four).
  *   **2 Marks:** Shows how redescription reverses the UET verdict (Generality Objection).
  *   **2 Marks:** Proposes a defender's reply (e.g., fix intention/description rules).
  *   **2 Marks:** Assesses the reply (typically fails due to lack of principled description rule).
  *   *Specific Error:* Using a Kantian example (e.g., lying promise) costs 2 marks. Failing to assess the reply's success costs 2 marks.

  **Task 5: Final Verdict (4 Marks)**
  *   **2 Marks:** Commits to a clear verdict (Defensible or Not).
  *   **2 Marks:** Names a single, specific consideration that would change their mind (e.g., account of maxim description).
  *   *Specific Error:* Hedging without a verdict or naming a vague consideration costs 2 marks.

  **Distinction between A and B Answers:**
  *   **A Answer (24-30 Marks):** Explicitly identifies the *teleological assumption* in Task 3 (that rational wills necessarily seek certain ends). In Task 4, provides a nuanced assessment of the defender's reply, recognizing that fixing maxim description requires material principles which threaten Kant's formalism.
  *   **B Answer (15-23 Marks):** Correctly applies UET but treats the CW failure in Task 3 as merely about "bad outcomes" or "unhappiness" rather than volitional inconsistency. In Task 4, offers a generality example but accepts the defender's reply too easily or fails to explain why the reply might fail.
