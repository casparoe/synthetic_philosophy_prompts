answer: |-
  The controversy over whether a rational agent's doxastic state should be represented by a single sharp probability function or a set of such functions turns on how we model ignorance. Proponents of imprecise credence argue that when evidence is sparse or ambiguous, a set of probabilities faithfully represents the agent's epistemic state without imposing arbitrary precision. Opponents argue that rationality requires a determinate stance for action, and that sets of probabilities lead to decision-theoretic pathologies. The urn case provided offers a decisive test. In this scenario, an agent begins with a determinate credence of 0.6 that Urn A contains a red ball, but upon learning that Urn B contains a red ball, her credence in Urn A dilates to the interval [1/3, 1]. This shift renders a previously mandatory bet merely permissible or forbidden, depending on the decision rule. This essay argues that this behavior demonstrates that imprecise credence cannot constitute a rational doxastic state. The case reveals that the imprecise model violates fundamental norms regarding the stability of belief and the value of information, necessitating a verdict that rational credence must be sharp.

  The first issue is whether the shift from a sharp 0.6 to the interval [1/3, 1] represents a genuine discovery or a failure of the model. The imprecise theorist might claim this is a discovery: the agent learns that her evidence was compatible with extreme correlations, and the report from Urn B activates this latent ambiguity. However, this interpretation is untenable. The agent's evidence regarding Urn A has not changed; the physical setup of Urn A is identical before and after the report. The only new information concerns Urn B. In a rational framework, evidence about B should only affect A if there is a known probabilistic link. Here, the link is unknown. The imprecise model treats "unknown link" as "all links are equally live options." When B is observed, the set of "live options" updates in a way that makes A highly sensitive to B. This is not a discovery about the world; it is an artifact of representing ignorance as a set of precise correlations rather than a lack of knowledge about a specific correlation parameter. A rational agent should not become less determinate about a proposition $P$ upon receiving evidence $E$ that is causally isolated from $P$, save for a hidden common cause she has already accounted for in her marginals. The dilation shows that the set-valued state is unstable; it allows irrelevant evidence to shatter determinate judgment.

  This instability suggests the agent's pre-report state was mis-specified. The stipulation that her evidence is "exhausted by the two colour counts" is a red herring. A rational agent does not merely assign probabilities to outcomes; she assigns probabilities to the mechanisms generating those outcomes. The "machine" that filled the urns is a hidden variable. To be decision-ready, the agent must form a judgment about the machine's tendency to correlate the urns. She might judge that the machine operates independently, or she might apply a principle of indifference over the possible correlation coefficients. Either way, she must commit to a sharp distribution over the structural hypotheses. If she does so, her prior over the joint distribution is sharp, and conditioning on the report from Urn B yields a sharp posterior for Urn A. The imprecise model attempts to bypass this commitment by keeping all structural hypotheses "live" in the set. But as the case shows, this bypass fails. It does not preserve neutrality; it creates a state that is hypersensitive to irrelevant data. The rational requirement is not to withhold judgment, but to form a sharp prior over the unknown mechanisms. To refuse to do so is not to be cautious; it is to be incoherent.

  The decision-theoretic consequences of the imprecise state confirm this incoherence. We must ask what the agent is required to do about the even-odds bet. Before the report, every probability function in her set assigns a positive expected utility to the bet (0.6 chance to win 1 unit, 0.4 to lose 1; EV = 0.2). Thus, taking the bet dominates declining. After the report, the expected utility ranges from -1/3 to +1. If the agent adopts a rule that maximizes minimum expected utility (Maximin), she must decline the bet post-report, as the worst-case scenario is a loss. This creates a reversal: she is required to take the bet before hearing the report, but required to decline it after hearing a report that provides no negative information about Urn A.

  This reversal forces a dilemma. If the agent sticks with Maximin, she admits that her decision depends on whether she hears the report. This leads to the fourth consideration: may she rationally prefer not to hear the report? Under the Maximin rule combined with imprecise credence, the answer is yes. If she hears the report, she is forced to decline the bet (EV = 0). If she does not hear the report, she is forced to take the bet (EV = 0.2). Since 0.2 > 0, she has a strict preference for ignorance. She would pay to avoid the information. This violates the Good Principle, a cornerstone of rational choice theory, which states that free information must have non-negative expected utility. Information allows an agent to align actions with states of the world; it should never reduce expected utility. The fact that the imprecise model permits (or requires) an agent to pay to remain ignorant proves that the model licenses irrational behavior.

  One might attempt to rescue the imprecise view by introducing a second-order probability—a sharp distribution over the members of the set. If the agent assigns weights to the different joint distributions, she can calculate a single expected utility for the bet post-report. However, this move abandons the defense of imprecise credence. If a rational agent must ultimately possess a sharp distribution over the set of probabilities to make decisions and value information correctly, then the "imprecise" set was merely a computational intermediate, not the true doxastic state. The fundamental state is the sharp second-order distribution. To claim that credence is imprecise while admitting that rational action requires a sharp second-order commitment is to concede that rationality demands sharpness at the level that matters. The imprecision is merely a disguise for a sharp credence that the agent is reluctant to articulate.

  Therefore, the verdict on the general controversy is that rational credence may not be imprecise. The urn case is not a counterexample to sharp credence; it is a counterexample to the viability of imprecise credence as a guide for action. The feature of the agent's state that must be given up is the representation of ignorance as a set of outcome-probabilities. It must be replaced by a sharp prior over the hidden structural parameters (the machine's correlation settings). This restores the stability of belief: learning the color of Ball B updates the probability of Ball A smoothly, without dilation, and preserves the positive value of information. The agent remains willing to take the bet (or updates her willingness consistently) because her model of the world is complete enough to assign a definite risk to the correlation.

  The strongest objection to this verdict is that assigning a sharp prior to the machine's settings is intellectually dishonest. The agent genuinely does not know the correlation; to assign a specific probability distribution (e.g., assuming independence) is to fabricate knowledge she does not possess. It imposes arbitrary precision on a situation defined by ambiguity. To force a sharp number is to lie about one's epistemic state.

  This objection fails because it confuses the description of evidence with the requirements of rational agency. Rationality is not merely about mirroring the evidence; it is about preparing for action. An agent who refuses to assign a sharp prior because it feels "arbitrary" is not being honest; she is being paralyzed. The "arbitrariness" of a prior based on a principle of indifference is a feature of rational commitment, not a bug. It acknowledges that in the absence of data, the agent must still act, and acting requires a single currency of expectation. The imprecise model claims to avoid arbitrariness, but as the urn case demonstrates, it pays for this avoidance with irrationality (valuing ignorance and reversing preferences on irrelevant evidence). A sharp prior admits its subjectivity but maintains coherence. An imprecise set claims objectivity but delivers incoherence. Therefore, the rational agent must bite the bullet of arbitrariness and adopt a sharp credence, for only a sharp credence can navigate the world without paying to close her eyes.
