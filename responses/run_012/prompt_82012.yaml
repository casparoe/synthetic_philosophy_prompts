      *   *Challenge 2 (Executioners):* This is a "death by infinite cut" scenario. Every moment $t < 0$ has an executioner. If alive at $t$, killed at $t$. But for any $t$, there is a $t' < t$. So he's dead before any $t$. But no specific executioner kills him. User feels this is a *contradiction*, whereas the Lamp is *under-specified*. The convergence test might lump them together as "indeterminate," which misses the nuance.
