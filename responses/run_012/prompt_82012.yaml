answer: |-
  **Project Title:** The Limit of Description: A Test for Determinacy in Supertasks

  **Applicant:** [Your Name]
  **Duration:** Six Months (Part-time, approx. 24 days total)
  **Request:** [Amount]

  **Introduction and Statement of the Problem**

  Imagine a lamp with a switch. At one minute to noon, you switch it on. At half a minute to noon, you switch it off. At a quarter minute to noon, you switch it on. You continue this process, halving the interval each time, completing infinitely many switches by noon. The question is simple: Is the lamp on or off at noon?

  This puzzle, often called Thomson's Lamp, has stalled philosophical debate for decades. There are two standard positions. The first argues that the story is incomplete; the rules describe every moment *before* noon but say nothing about noon itself, so there is no answer. The second argues that the lamp must be either on or off, so there is an answer, but our description is too blunt to capture it. I have spent two years studying this debate as an independent researcher. I have found that both sides rely heavily on intuition. One side feels the silence of the description; the other feels the necessity of physical facts. Neither offers a general rule.

  My project proposes a way out of this stalemate. I intend to test a specific hypothesis: that the determinacy of a supertask (a task involving infinitely many steps in finite time) depends on mathematical convergence. In plain terms, does the state of the system "settle down" as the steps approach the deadline? If the state stabilizes, the outcome is determined by that limit. If the state oscillates forever, like the lamp, the outcome is genuinely indeterminate.

  This proposal outlines a six-month investigation to formalize this "Convergence Criterion," test it against harder cases than the lamp, and determine whether it can distinguish between a story that is merely silent and a story that is logically impossible.

  **The Hypothesis: Determinacy as Convergence**

  The core intuition is that the lamp puzzle feels unresolved because the state of the lamp (on/off) never converges. It flips forever. There is no "last state" for it to rest into. By contrast, consider a vase puzzle. At each step, you put ten numbered balls into a vase and remove one. If you always remove the lowest-numbered ball, every specific ball is eventually removed. The vase ends up empty. This outcome feels forced, even inevitable, despite the infinite steps.

  My hypothesis is that the vase outcome feels determined because the *contents* of the vase converge. For any specific ball, there is a time after which its status (in or out) never changes. The lamp has no such stability. If this hypothesis holds, it provides a general test: we do not need to guess whether the description is sufficient. We simply check if the relevant physical properties converge to a limit. If they do, the limit is the outcome. If they do not, the description fails to determine an outcome.

  However, this intuition is currently informal. It relies on phrases like "settles down" which need precise definition. What counts as the "state"? What counts as "relevant"? My project is to build a rigorous version of this test that does not rely on how the answer feels, but on the structure of the description itself.

  **Key Test Cases and Complications**

  To test this hypothesis, I cannot rely on the lamp alone. I will apply the Convergence Criterion to two more complex scenarios that threaten to break the model.

  The first is a variation of the vase puzzle. In the standard version (remove the lowest-numbered ball), the vase ends empty. In a variant version (remove the highest-numbered ball), the vase ends up with infinitely many balls. Both versions involve the same mechanical actions (add ten, remove one). Both seem to "settle" in terms of procedure. Yet they yield radically different results. This raises a critical question: Is the convergence determined by the physics of the balls, or by our convention of labeling them? If my test cannot explain why one version converges to "empty" and the other to "full" without appealing to arbitrary labeling conventions, it fails to capture the physical reality of the task. I need to define "state" in a way that handles this distinction.

  The second, and more dangerous, test case is the Infinite Executioners. Imagine a prisoner sentenced to die in the last minute before noon. There is an infinite squad of executioners, one assigned to every moment in that minute. Each is ordered to kill the prisoner if he is still alive at their assigned moment. Since every moment has an executioner, the prisoner cannot survive to noon. But for any specific moment you pick for the death, an earlier executioner would have acted first. So no specific executioner kills him.

  This case feels different from the lamp. The lamp feels under-described; the Executioner case feels contradictory. It generates a paradox where the prisoner is both dead (by coverage) and not killed (by specific action). When I apply my Convergence Criterion to this case, it yields "no determinate outcome," the same verdict as the lamp. I am not convinced this is correct. If my test lumps a logical contradiction together with a simple lack of information, it is too blunt to be useful. A major part of this project is to investigate whether this is a failure of my test, or whether the distinction between "contradiction" and "under-description" is less sharp than it appears.

  **Methodology and Work Plan**

  I propose to work one day per week for six months. This limited time requires a narrow, focused scope. I will not attempt to solve all supertask paradoxes. I will focus exclusively on refining the Convergence Criterion and testing it against the three cases described above (Lamp, Vase variants, Executioners).

  *Months 1 and 2: Formalizing the State.*
  I will define what constitutes the "state" of a system in these puzzles. For the lamp, it is binary (on/off). For the vase, it is the set of balls present. I need to determine what mathematical structure allows us to say a state has "converged." I will draft a definition of determinacy based on whether the state at time *t* becomes constant for all *t* sufficiently close to the deadline. I will write up these definitions in plain language, avoiding heavy formalism where possible, to ensure the logic remains transparent.

  *Months 3 and 4: The Vase Variants.*
  I will apply the definition to the two vase scenarios. The goal is to see if the convergence test naturally produces "empty" for the first version and "infinite" for the second, based solely on the movement rules, without smuggling in the answer via the labeling. If the test yields the same result for both, or fails to yield a result for either, I will need to adjust the definition of "state." This month will be dedicated to troubleshooting why the labeling matters and whether that implies the convergence is physical or conceptual.

  *Month 5: The Executioner Paradox.*
  I will apply the finalized test to the Executioner case. I will analyze why the verdict matches the lamp's verdict. I will explore whether the "contradiction" in the Executioner case can be re-described as a failure of the state to converge. If I can show that the Executioner scenario lacks a stable limit state in a specific way that the Lamp does, I can salvage the distinction. If I cannot, I must honestly report that the Convergence Criterion treats logical impossibility and descriptive silence as the same failure.

  *Month 6: Synthesis and Writing.*
  I will compile the findings into a final paper of approximately 5,000 words. This will not be a technical journal article, but a clear exposition suitable for the foundation and interested non-specialists. It will state the criterion, show the tests, and declare the verdict: either the criterion works, or it fails, and why.

  **Deliverables and Success Criteria**

  The primary deliverable is a self-contained essay titled *Convergence and Completeness in Supertasks*. This document will present the refined Convergence Criterion and the results of the three test cases.

  Success for this project does not necessarily mean proving my hypothesis is correct. Given the history of this puzzle, it is entirely possible that the hypothesis will collapse under the weight of the Executioner case or the Vase variants. If I can demonstrate clearly *why* it collapses—for example, by showing that convergence is necessary but not sufficient for determinacy—that is a valuable result. It saves future researchers from pursuing a dead end.

  Therefore, a "successful" project is one that provides a definitive answer to the question: *Can convergence distinguish determinate supertasks from indeterminate ones?* A positive answer provides a new tool for philosophy. A negative answer clarifies the limits of mathematical analogies in physical description. Both are useful outcomes.

  **Risk Assessment and Feasibility**

  I must be honest about the risks. The most significant risk is that the distinction I seek does not exist. It may be that "under-description" and "contradiction" are not structurally different in infinite tasks, but merely feel different to human intuition. If my test confirms this, the project may feel like a negative result. However, establishing that the distinction is illusory is itself a philosophical contribution.

  A second risk is scope. One day a week is a very small amount of time. I have mitigated this by restricting the project to three specific cases. I will not survey the literature or attempt to categorize all known supertasks. I will focus entirely on the internal logic of the Convergence Criterion. If I find that the Vase variants require more mathematical machinery than I can manage in the time allotted, I will scale back to a qualitative analysis of the logic rather than a formal proof.

  There is also the risk of isolation. Working outside a university, I do not have colleagues to check my reasoning. To mitigate this, I will keep a weekly log of my arguments, specifically looking for places where I might be assuming what I intend to prove. I will write the final draft with the assumption that the reader is skeptical, forcing me to clarify every step.

  **Why This Method?**

  The obvious alternative to this project is to continue collecting examples. One could gather twenty different supertasks and ask people whether the outcome feels determined. This approach relies on consensus intuition. The problem is that intuitions about infinity are notoriously unreliable and vary from person to person. The Lamp puzzle has persisted precisely because people's intuitions are evenly split.

  My method attempts to bypass intuition by looking for a structural feature (convergence) that exists independently of how the puzzle feels. If the state converges, it converges, regardless of whether we feel the answer is satisfying. This moves the debate from "What do you think?" to "Does the description fix the limit?" This is a more robust way to settle the question, and it is why a focused theoretical investigation is better than a survey of opinions.

  **Conclusion**

  I am applying for this grant to buy the time and mental space to stop going in circles. For two years, I have held this idea that determinacy is convergence. It explains the Lamp, it explains the Vase, but it stumbles on the Executioners. I need six months to find out if that stumble is a trip or a fall.

  If the project succeeds, I will provide a clear test that allows anyone to look at a description of an infinite task and tell whether the story is finished or broken. If the project fails, I will provide a clear explanation of why the structural approach does not work, saving others from the same detour. As an independent researcher, I offer not a career requirement, but a genuine commitment to solving a puzzle that has resisted standard academic approaches. I believe a fresh pair of eyes, unburdened by the pressure to publish within a specific department, is well-suited to this kind of foundational clean-up work.

  I am ready to begin the work immediately upon funding.
