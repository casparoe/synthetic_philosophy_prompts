      *   **The Puzzle:** Supertasks (infinitely many steps in finite time). Specifically, the problem of *determinacy*: Does the description of the supertask fix the outcome at the limit time?
      *   **The User's Hypothesis:** Determinacy depends on *convergence*. If the state of the system "settles down" (converges) as steps approach the limit, the outcome is determinate (the limit). If it oscillates (like the lamp), it's indeterminate.
      *   **Key Test Cases:**
          1.  Thomson's Lamp (Oscillates -> Indeterminate).
          2.  Ross-Littlewood Vase (Balls in/out). Version A (remove lowest): Empty at end (Converges?). Version B (remove highest): Infinite balls at end (Converges?).
          3.  Infinite Executioners (Death paradox). Seems contradictory, not just under-described. User's test says "no determinate outcome" (like lamp), but user feels this might be wrong (contradiction vs. under-description).
      *   **Requirements:** Weave in standard proposal sections (question, gap in literature, methodology, timeline, deliverables, failure conditions, feasibility). No citations/bibliography (user will add). Describe positions, don't name-drop. Honest assessment of risks (including the risk that the idea collapses).
