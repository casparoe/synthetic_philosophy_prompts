answer: |-
  Here is a 90-minute session plan designed for your specific audience and constraints.

  ### 1. The Strategy: Order and Rationale

  **00:00 – 10:00 | The Phenomenon (No Theory Yet)**
  *   **Goal:** Establish the data without contaminating it with terminology.
  *   **Why:** Your audience (ML/Physics) thinks in terms of parameters and thresholds. Linguists think in terms of usage. If you define "Contextualism" first, the physicists will treat it as an axiom and the linguists will debate the definition. Start with the instability of the data.
  *   **Action:** Present two short transcripts of the *same* dialogue. Ask the group: "In which transcript is the speaker telling the truth?"
  *   **Trap to Avoid:** Do not use the word "knowledge" yet. Use "counts as knowing" or "is correct to say."

  **10:00 – 35:00 | The Core Case (The Server Patch)**
  *   **Goal:** Run the single example that carries the session.
  *   **Why:** You need a case where *Subject Stakes* and *Attributor Context* can be decoupled. Bank cases fail here because the bank's stakes and the customer's stakes are usually conflated.
  *   **The Example:** **The Server Patch.**
      *   **Subject:** Alex (DevOps Engineer).
      *   **Attributor:** Blake (Project Manager).
      *   **Proposition:** "The patch is stable."
      *   **Evidence:** Automated test suite passed (99% confidence).
      *   **The Dialogue (Constant):**
          *   Blake: "Are we good to deploy?"
          *   Alex: "Yes, I know it's stable."
      *   **The Variables (Toggle these for the group):**
          1.  **Subject Stakes (Encroachment Variable):** Alex is deploying to a personal blog (Low) vs. Alex is deploying to a life-support system where a bug kills patients (High). *Alex's risk changes.*
          2.  **Attributor Context (Contextualist Variable):** Blake is asking for a casual status update (Low Standards) vs. Blake is filing a legal compliance report (High Standards). *Blake's purpose changes.*
      *   **Crucial Instruction:** Keep the *Attributor (Blake)* the same person. If you change the person, the linguists will argue about idiolect. If you change the *context of the attribution*, you isolate the semantic variable.
      *   **The Divergence Point:** Construct a scenario where **Alex's Stakes are High** (Life-support) but **Blake's Context is Low** (Casual check-in).
          *   *Invariantist:* Alex knows (evidence meets fixed bar) or doesn't (evidence fails fixed bar), stakes irrelevant.
          *   *Contextualist:* Alex's utterance is **True** (Blake's low context sets the bar).
          *   *Encroachment:* Alex's utterance is **False** (Alex's high stakes raise the bar for knowledge itself).
      *   **Why this works:** It forces the theories to give different truth-values to the *same sentence* in the *same conversation*.

  **35:00 – 60:00 | Mapping the Theories**
  *   **Goal:** Label the intuitions they just generated.
  *   **Order:**
      1.  **Invariantism (The Null Hypothesis):** "Knows" has fixed parameters. Variation is error or pragmatics. (Physicists will like this).
      2.  **Contextualism (The Semantic Shift):** "Knows" is indexical. The *word* changes meaning based on Blake's context. (Linguists will like this).
      3.  **Pragmatic Encroachment (The Practical Shift):** "Knows" is fixed, but *knowledge* is a status that depends on action. The *world* changes, not the word. (ML folks will like this—it's like a loss function weighting).
  *   **Why this order:** Invariantism is the baseline. Contextualism explains the linguistic variance. Encroachment explains why variance persists even when linguistic context is held constant.

  **60:00 – 75:00 | The Misconceptions (Pre-emptive Strikes)**
  *   **Goal:** Head off the two specific errors you identified.
  *   **Misconception 1: "Contextualism just is Relativism."**
      *   **When it surfaces:** During the Contextualism section (35-60).
      *   **How to head it off:** Draw a diagram.
          *   *Contextualism:* Truth determined at **production** (Speaker/Attributor context at time of utterance).
          *   *Relativism:* Truth determined at **assessment** (Evaluator context at time of judging).
          *   *Script:* "If Blake says 'Alex knows' in a low-stakes meeting, Contextualism says that is *eternally true* because Blake's context was low. Relativism says it's only true *for you* if you are assessing it from a low-stakes context. We are doing Contextualism, not Relativism."
  *   **Misconception 2: "Encroachment just means stakes change whether you're *allowed to say* you know."**
      *   **When it surfaces:** During the Encroachment section.
      *   **How to head it off:** Distinguish **Truth** vs. **Warrant**.
          *   *Script:* "If Encroachment were just about assertion norms, it would be Invariantism with extra steps. Encroachment claims that in high stakes, Alex *literally lacks the fact* of knowledge. It's not that Alex knows but shouldn't speak; it's that Alex doesn't know."

  **75:00 – 85:00 | The 'Tall' Analogy (Use with Limits)**
  *   **Goal:** Leverage the linguist's intuition without breaking the philosopher's model.
  *   **Verdict:** **Use it for Contextualism. Drop it for Encroachment.**
  *   **Instruction:**
      *   Tell the group: "Contextualism is like 'tall'. A 6ft man is tall for a jockey, not tall for a basketball player. The *word* shifts."
      *   Then explicitly **break** the analogy for Encroachment. "But Encroachment is *not* like 'tall'. Stakes do not change your height. Encroachment says stakes change whether you *qualify* for the status of 'knower', not what the word means. If you use 'tall' to explain Encroachment, you will confuse the ML folks who see parameters as fixed."
  *   **Why:** This clarifies that Contextualism is semantic (word meaning), Encroachment is metaphysical/epistemic (status conditions).

  **85:00 – 90:00 | The Diagnostic Close**
  *   **Goal:** Verify they grasp the locus of variation.
  *   **The Question:** "In the High-Stakes/Low-Context scenario we discussed: If Alex says 'I know,' and we later discover the stakes were high..."
      *   "Which theory says Alex made a **semantic error** (used the wrong meaning)?"
      *   "Which theory says Alex made a **factual error** (claimed a status they didn't have)?"
      *   "Which theory says Alex made a **pragmatic error** (told the truth but shouldn't have)?"
  *   **Answer Key:**
      *   Semantic Error = Contextualism (Word meant 'high standard', Alex used 'low standard' meaning). *Correction: Actually, Contextualism says Alex spoke truth relative to context. Better phrasing:* "Which theory says the truth value depends on **Blake's** context?" (Contextualism). "Which says it depends on **Alex's** stakes?" (Encroachment).
      *   *Refined Diagnostic:* "If we freeze the evidence and freeze the world, but change the **cost of being wrong**: Contextualism says the truth value of 'Alex knows' \_\_\_\_\_\_. Encroachment says the truth value of 'Alex knows' \_\_\_\_\_\_."
      *   *Answers:* Contextualism = **Does not change** (unless attributor context changes). Encroachment = **Changes**.

  ### 2. What to Refuse (Scope Control)

  You have 90 minutes. You must explicitly decline to cover the following to keep the distinction sharp:

  1.  **Skepticism:** Do not let the conversation drift into "Do we know anything?" This is about the *word* "know," not the *possibility* of knowledge.
  2.  **Gettier Cases:** Do not introduce justified true belief + X complications. Assume JTB is roughly stable; we are testing the *threshold*.
  3.  **Technical Semantics (Indexicals vs. Quantifiers):** The linguists will want to debate whether "knows" is an indexical, a quantifier domain restrictor, or a gradable adjective. Acknowledge this is a live debate *within* Contextualism, but state that for this session, all Contextualist models count as "Contextualism."
  4.  **Subject-Sensitive Invariantism (SSI):** This is often used interchangeably with Encroachment. Don't introduce the acronym SSI; it adds jargon without adding distinction for this group. Stick to "Pragmatic Encroachment."

  ### 3. Summary of the "One Example" Constraints

  *   **Same Evidence:** The test suite pass rate (99%) must remain constant.
  *   **Same Attributor:** Blake is always the manager. Do not swap Blake for a regulator, or you introduce a new variable (authority). Change Blake's *task* (casual update vs. legal log).
  *   **Not Bank/Kidney:** The Server Patch avoids the philosophical fatigue of the Bank Case and the ethical baggage of the Kidney case.
  *   **Three Readings:**
      1.  *Invariantist:* Evidence is either enough or it isn't. Stakes/Context irrelevant to truth.
      2.  *Contextualist:* Blake's context sets the bar. Low context = True.
      3.  *Encroachment:* Alex's stakes set the bar. High stakes = False.

  ### 4. Final Advice for the PhD Student

  You are worried about opening with the Bank Case. You are right. It triggers "Philosophy 101" mode. The Server Patch triggers "Engineering/Systems" mode, which fits your audience.

  Your biggest risk is the ML researcher treating "knowledge" as a confidence score (probability). Remind them early: "We are not discussing probability thresholds (95% vs 99%). We are discussing whether the *label* 'know' applies when the probability is held constant but the *cost of error* changes."

  If you stick to the **High-Stakes Subject / Low-Stakes Attributor** divergence in the core case, the distinction between Contextualism and Encroachment will force itself into the room without you having to define it dogmatically. Let the theories fight over the case.
