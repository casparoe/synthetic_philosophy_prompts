prompt: |-
  Last term I sat in on a lecture course on comparative history, and there is one lecture I have not been able to stop chewing on. I have no way to check the lecturer's sources, so I would like the substance audited rather than the citations. Here is his argument as I recorded it.

  The old question, he said, is Needham's: why did modern science, and then industrial capitalism, arise in Europe and not in China, when for most of the preceding millennium China had been the more advanced civilization? He credited what he called the California School with reframing this. Pomeranz, he said, established that the divergence was long-standing — that Europe's lead runs back to the medieval period and reflects deep cultural difference, above all a Confucian examination system indifferent to the mechanical arts. On that account the Needham question is answered by culture: China had the ingredients but not the temperament.

  He then argued that this makes the contrastive form of the question the crux. Why Britain and not China is a why-question with a contrast class, and the answer you give depends entirely on what you put in the contrast slot. Ask why Britain rather than the Netherlands and you get an answer about coal and wages; ask why Europe rather than Asia and you get an answer about colonies and the New World; ask why the eighteenth century rather than the fourteenth and you get an answer about plague and factor prices. He named this phenomenon explanandum drift, and drew the conclusion that the question is ill-posed and that historians should simply stop asking it.

  To make the point precise he proposed a test, which he called contrast-rigidity. A why-question is contrast-rigid when its answer survives the substitution of a neighbouring contrast term, and contrast-elastic when the answer changes. His verdict was that every question in this debate is contrast-elastic, and that elasticity is precisely what separates a genuinely explanatory question from a merely rhetorical one.

  He closed with a methodological footnote: since there is only one case of industrialization, any explanation of it must be underdetermined, so the honest response is to stop hunting for causes and to describe the transition instead.

  I have two vague misgivings and no way to sharpen them. The second paragraph feels like a caricature of a position that somebody holds, though I suspect it is not the position he has attached it to. And the last two paragraphs seem to me to be doing something slick, though I cannot say what. I do not need a reading list; I want the argument assessed on its merits.

  Please go through the lecture claim by claim. Which of these would a historian or philosopher of history working on the Great Divergence accept, which would they treat as a standard simplification that is harmless in a lecture, and which are simply wrong? Then tell me whether contrast-rigidity is a real criterion or a relabelling of something obvious, and whether it would not condemn every causal why-question equally — and if so, what that shows. Finally, say whether the abandonment of the question follows from anything true in the lecture, and, if the question can be posed properly, what a proper statement of it would look like.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user attended a lecture on comparative history (specifically the "Great Divergence" between Europe/China).
      *   **Task:** Audit the substance of the lecturer's argument (not citations).
      *   **Specific Concerns:**
          *   Paragraph 2 feels like a caricature (misattribution of the "California School"/Pomeranz).
          *   Paragraphs 3 & 4 feel "slick" (philosophical maneuvering regarding "explanandum drift" and "contrast-rigidity").
          *   Final conclusion (abandon the question due to underdetermination) needs evaluation.
      *   **Requirements:**
          *   Go claim-by-claim.
          *   Assess acceptance by historians/philosophers of history (Accept / Harmless Simplification / Wrong).
          *   Evaluate "contrast-rigidity" (Real criterion vs. relabeling, does it condemn all causal questions?).
          *   Evaluate the conclusion (Does abandonment follow? How to pose the question properly?).
          *   No reading lists. Focus on argument assessment.

  2.  **Deconstruct the Lecture's Argument (Claim-by-Claim):**

      *   *Claim 1: Needham's Question.* Why modern science/industrial capitalism in Europe not China, despite China's prior advancement?
          *   *Assessment:* Standard formulation. Accurate.
      *   *Claim 2: California School/Pomeranz reframed this.* Pomeranz established divergence was long-standing (medieval) and reflects deep cultural difference (Confucian exam system).
          *   *Assessment:* **Wrong/Caricature.** This is the user's first misgiving. Pomeranz (*The Great Divergence*, 2000) argues the *opposite*. He argues divergence was *late* (c. 1750), not medieval, and emphasizes *contingent* factors (coal, colonies), not deep cultural differences (Weberian style). The lecturer has conflated Pomeranz with Weber or maybe Elvin, or simply got the California School thesis backward.
      *   *Claim 3: Contrastive Nature of Why-Questions.* The answer depends on the contrast class (Britain vs. Netherlands vs. China vs. Asia).
          *   *Assessment:* **Accept.** This is standard philosophy of history/social science (van Fraassen, Garfinkel). "Why P rather than Q?"
      *   *Claim 4: Explanandum Drift.* The lecturer names the phenomenon where changing the contrast changes the answer.
          *   *Assessment:* **Harmless Simplification/Relabeling.** The phenomenon is real (contrastive explanation), but the term "explanandum drift" might be idiosyncratic. The *drift* isn't usually seen as a problem but as a feature of explanation.
      *   *Claim 5: Contrast-Rigidity Test.* A question is good if the answer survives substitution of the contrast term. If it changes (elastic), it's merely rhetorical.
          *   *Assessment:* **Wrong/Philosophically Dubious.** This is the "slick" part. Most causal explanations *are* contrast-sensitive. If I ask "Why did the fire start?" (vs. not start) vs. "Why did the fire start *here*?" (vs. there), the answer changes. Demanding rigidity across *different* contrast classes is demanding a "cause of everything" rather than a specific explanation.
      *   *Claim 6: Underdetermination/Singular Case.* Only one industrialization, so explanation is underdetermined. Stop hunting causes, describe instead.
          *   *Assessment:* **Wrong/Non Sequitur.** Singular events are explained in history all the time (French Revolution, WWI). Underdetermination is a general problem, not specific to N=1. Description without explanation is a retreat to positivism/antiquarianism that most historians reject.

  3.  **Evaluate "Contrast-Rigidity":**
      *   Is it a real criterion? It sounds like a distortion of "robustness" or "invariance."
      *   Does it condemn all causal why-questions? Yes. If I ask "Why did the apple fall?" (vs. stay up), gravity is the answer. If I ask "Why did the apple fall *now*?" (vs. later), the answer is "the stem broke." The answer changes based on the contrast. Demanding the *same* answer for *different* contrasts is category error.
      *   What does this show? It shows the lecturer is using a philosophical-sounding test to rule out questions they simply don't like, or they misunderstand how contrastive explanation works.

  4.  **Evaluate the Conclusion (Abandon the Question):**
      *   Does it follow? No. Even if the question is contrastive, it doesn't mean it's ill-posed. It means it needs precision.
      *   Proper statement? Needs to specify the *contrast class* and the *explanandum* precisely. E.g., "Why did sustained per-capita economic growth emerge in Northwest Europe c. 1750 rather than continuing in the Yangzi Delta?"

  5.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the user's sharp instincts. The misgivings are well-founded.
      *   *Section 1: Claim-by-Claim Audit.*
          *   Needham Question: OK.
          *   Pomeranz/California School: **Major Error.** This is the biggest substantive flaw. Pomeranz argues for *late* divergence and *material/contingent* causes, not *early* divergence and *cultural* causes. The lecturer attributes the Weberian thesis to Pomeranz.
          *   Contrastive Questions: OK (Philosophically sound).
          *   Explanandum Drift: Terminology is idiosyncratic, but the observation is standard.
          *   Contrast-Rigidity: **Problematic.** This is the "slick" move. It sets a bar no historical explanation can clear.
          *   Underdetermination/N=1: **Weak.** Historians explain singular events constantly.
      *   *Section 2: Contrast-Rigidity Analysis.*
          *   Explain why it fails. Contrastive explanation *requires* sensitivity to the foil. If the answer doesn't change when the foil changes, the explanation is too vague to be useful.
          *   It conflates "general causal mechanism" with "specific explanation."
          *   It would indeed condemn almost all causal questions (e.g., "Why WWI?" vs. "Why WWI in 1914?").
      *   *Section 3: The Conclusion.*
          *   Does abandonment follow? No.
          *   How to fix the question? Specify the contrast. The "Great Divergence" is valid if defined as a specific economic metric at a specific time.
      *   *Tone:* Academic, critical, precise. Avoid jargon where possible, but use correct philosophical/historical terms (contrastive explanation, ceteris paribus).

  6.  **Refining the Pomeranz Point:**
      *   I need to be very clear here. The California School (Pomeranz, Wong, Roski) specifically argues *against* the cultural/Weberian explanation. They argue China was *similar* to Europe until very late (1750+). The lecturer says Pomeranz argues divergence was *long-standing* (medieval) and *cultural*. This is the exact opposite of Pomeranz's thesis. This validates the user's "caricature" suspicion completely.

  7.  **Refining the Contrast-Rigidity Point:**
      *   Use the "Van Fraassen" reference implicitly (why-question pragmatics).
      *   Analogy: "Why did the ball go left?" (vs right) -> "It hit the post." "Why did the ball go left?" (vs stop) -> "It was kicked." The cause is the same event, but the *explanation* highlights different aspects. Rigidity demands one explanation fit all foils, which renders it vacuous.

  8.  **Refining the N=1 Point:**
      *   This is the "uniqueness of historical events" fallacy. We can use comparative methods (even if N is small) or counterfactuals. Abandoning causation for description is a methodological surrender not warranted by the premises.

  9.  **Final Review against User Constraints:**
      *   No reading list? Check.
      *   Assess on merits? Check.
      *   Address specific misgivings? Check.
      *   Claim-by-claim breakdown? Check.

  10. **Final Polish:** Ensure the distinction between "explanandum drift" (changing the question) and "contrast sensitivity" (changing the answer based on the question) is clear. The lecturer seems to treat the sensitivity as a bug; philosophy treats it as a feature.

  *(Self-Correction during drafting)*: I should make sure not to be too harsh on the lecturer regarding "explanandum drift." It might be their own term for a known phenomenon. I will treat it as idiosyncratic terminology for a standard idea, but critique the *inference* drawn from it. The main error is definitely the Pomeranz attribution.

  *(Final Plan)*:
  1. Validate the user's intuition (it's sharp).
