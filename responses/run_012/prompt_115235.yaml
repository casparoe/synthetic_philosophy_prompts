answer: |-
  Your misgivings are well-founded. The lecture you attended mixes a standard philosophical observation about explanation with a significant misrepresentation of historical scholarship, and then uses the former to justify a methodological surrender that does not logically follow.

  Here is an audit of the argument claim-by-claim, followed by an assessment of the "contrast-rigidity" test and the final conclusion.

  ### Part 1: Claim-by-Claim Audit

  **Claim 1: Needham's Question.**
  *The question is why modern science/industry arose in Europe not China, despite China's prior advancement.*
  *   **Verdict:** **Accept.**
  *   **Assessment:** This is the standard formulation of the "Needham Question." It accurately reflects the puzzle Joseph Needham posed in *Science and Civilisation in China*.

  **Claim 2: The California School and Pomeranz.**
  *Pomeranz established the divergence was long-standing (medieval) and reflects deep cultural difference (Confucian exam system).*
  *   **Verdict:** **Simply Wrong.**
  *   **Assessment:** This confirms your suspicion of caricature. It is the most serious substantive error in the lecture. Kenneth Pomeranz's *The Great Divergence* (2000), the flagship text of the "California School," argues the **exact opposite**.
      *   Pomeranz argues the divergence was **late** (c. 1750), not medieval. He posits that until the late 18th century, the Yangzi Delta and Northwest Europe were economically comparable.
      *   Pomeranz argues the cause was **contingent/material** (access to New World land/coal), not **cultural**. He explicitly rejects the idea that Confucianism or the exam system inhibited development prior to 1750.
      *   The lecturer has attributed a Weberian culturalist thesis (which the California School was formed to critique) to the California School itself. This invalidates the premise that the "Needham Question" has been answered by culture via Pomeranz.

  **Claim 3: The Contrastive Nature of Why-Questions.**
  *The answer depends on the contrast class (Britain vs. Netherlands, Europe vs. Asia, etc.).*
  *   **Verdict:** **Accept.**
  *   **Assessment:** This is standard philosophy of social science (associated with Bas van Fraassen and Alan Garfinkel). Explanations are inherently contrastive: "Why P rather than Q?" Changing Q (the foil) changes the relevant causal factors. This is a harmless and accurate simplification of a complex philosophical point.

  **Claim 4: Explanandum Drift.**
  *Changing the contrast changes the answer; the lecturer names this "explanandum drift."*
  *   **Verdict:** **Harmless Simplification (Idiosyncratic Terminology).**
  *   **Assessment:** The phenomenon is real, though historians usually call this "contrastive explanation" rather than "explanandum drift." (Strictly speaking, if the contrast changes, the *explanandum*—the thing to be explained—has changed slightly, so the term is defensible). The observation itself is correct: asking "Why Britain?" vs. "Why the 18th Century?" yields different causal stories.

  **Claim 5: Contrast-Rigidity.**
  *A question is valid only if the answer survives substitution of the contrast term. Elasticity makes a question rhetorical.*
  *   **Verdict:** **Simply Wrong.**
  *   **Assessment:** This is the "slick" maneuver you detected. It imposes a criterion that virtually no causal explanation in history or science can meet. (See Part 2 below for detailed analysis).

  **Claim 6: Underdetermination and N=1.**
  *Since there is only one case of industrialization, explanation is underdetermined; we should describe, not explain.*
  *   **Verdict:** **Simply Wrong.**
  *   **Assessment:** This is a non sequitur. Historians explain singular events (the French Revolution, the Fall of Rome, WWI) without requiring multiple instances of the *exact* same event. We use internal comparison, counterfactuals, and sub-component analysis. To claim that N=1 precludes causation is to claim that history cannot be a science of causes, only a chronicle. Most historians and philosophers of history reject this.

  ---

  ### Part 2: The "Contrast-Rigidity" Test

  You asked whether this is a real criterion or a relabeling of something obvious, and whether it condemns every causal why-question.

  **It is a relabeling of a category error.**
  The lecturer is conflating **causal mechanisms** with **explanatory relevance**.
  *   **Mechanism:** Gravity caused the apple to fall.
  *   **Contrast 1:** Why did the apple fall *rather than stay on the tree*? Answer: Gravity overcame the stem's tension.
  *   **Contrast 2:** Why did the apple fall *at noon rather than 6 PM*? Answer: The wind shook the branch at noon.

  The underlying causal field involves gravity, stem tension, and wind. But the *explanation* highlights different factors depending on the contrast. If you demand "contrast-rigidity" (the answer must be the same for both contrasts), you are forced to give an answer so vague ("Because of physical conditions") that it explains nothing specific.

  **Does it condemn every causal why-question?**
  **Yes.** If applied consistently, "contrast-rigidity" would invalidate almost all historical and scientific explanation.
  *   "Why did WWI start?" (Vs. peace) → Alliance systems.
  *   "Why did WWI start in 1914?" (Vs. 1910) → The assassination of Franz Ferdinand.
  *   "Why did WWI start in Europe?" (Vs. Asia) → Imperial rivalries in the Balkans.

  If the lecturer's test were valid, we could not ask "Why WWI?" because the answer shifts depending on whether we are contrasting with peace, with a different year, or with a different location. Since we *do* successfully explain WWI, the test must be flawed.

  **What this shows:**
  The lecturer is using a philosophical-sounding constraint to rule out questions that are actually quite standard. They are treating the **context-sensitivity of explanation** as a defect rather than a feature. In reality, the fact that the answer changes with the contrast is what makes the explanation precise. "Elasticity" is not a sign of a rhetorical question; it is a sign that the historian is distinguishing between necessary conditions, sufficient conditions, and triggering causes.

  ---

  ### Part 3: The Conclusion (Abandoning the Question)

  **Does the abandonment follow from anything true in the lecture?**
  **No.**
  1.  **The Pomeranz Premise is False:** Since the claim that Pomeranz proved a cultural/medieval divergence is wrong, the argument that the question has been "answered by culture" (and thus should be dropped or reframed on that basis) collapses.
  2.  **The Rigidity Test is Flawed:** Since contrast-elasticity is normal for causal questions, the fact that the Great Divergence questions are elastic does not make them ill-posed.
  3.  **The N=1 Problem is Solvable:** Singular events can be explained by analyzing the conjunction of conditions that made them possible. We do not need a second Industrial Revolution to explain the first, any more than we need a second Big Bang to explain the universe. We compare regions (China vs. Britain) to isolate variables, effectively creating a comparative method even if the outcome (industrialization) happened only once.

  **How to pose the question properly:**
  The "Needham Question" is not ill-posed, but it is often too vague. A proper statement must fix the **explanandum** (what exactly are we explaining?) and the **contrast class** (what are we comparing it to?).

  *   **Bad Version:** "Why did Europe industrialize and China didn't?" (Too broad, implies China never developed, ignores timing).
  *   **Proper Version:** "Why did sustained, energy-intensive per-capita economic growth emerge in Northwest Europe c. 1750–1850, rather than continuing in the economically comparable Yangzi Delta?"

  This formulation:
  1.  Specifies the metric (energy-intensive per-capita growth).
  2.  Specifies the time (c. 1750–1850, acknowledging the late divergence).
  3.  Specifies the contrast (Yangzi Delta, acknowledging it was the most advanced Chinese region, rather than "China" as a monolith).

  ### Summary

  Your intuition was correct. The lecturer's argument relies on a **factual error regarding Pomeranz** (attributing a cultural thesis to a materialist scholar) and a **philosophical error regarding explanation** (demanding contrast-rigidity where contrast-sensitivity is required).

  The call to abandon causal explanation in favor of description is a methodological retreat that does not follow from the premises. The "Great Divergence" remains a valid historical question, provided it is asked with precise attention to *when* the divergence occurred and *which regions* are being compared. The lecture you attended effectively dismantled a strawman (the culturalist Pomeranz) using a broken tool (contrast-rigidity) to justify giving up on the project.
