prompt: |-
  ok so i'm a high schooler and i run the tiny game theory corner of our math club — we meet once a week and everyone gets one hard problem plus a worked solution they can check themselves against, and this week it's my turn to write it. i want to do dominated strategies, but NOT the prisoner's dilemma version that everyone has already seen a million times. the thing i really want to hammer is: a strategy can be strictly dominated even when no single other pure strategy beats it, because sometimes you have to mix two strategies together before the bad one gets shown up. like half the club thinks "dominated" only ever means "some one other move is better in every single cell," which is wrong, and i want the problem to punish that exact mistake. second thing i want in there: i keep reading that the ORDER you delete strategies in doesn't matter for strict dominance but DOES matter for weak dominance, and honestly i don't really get why, so the solution needs to actually explain the reason and show it working on an example.

  i made up two little games, can you build the question around these? both are two-player, simultaneous, player 1 picks the row, player 2 picks the column, and each cell is (player 1's number, player 2's number):

  Game A:
          L        R
  T     (3, 0)   (0, 1)
  M     (0, 1)   (3, 0)
  B     (1, 1)   (1, 1)

  Game B:
          L        C
  T     (2, 3)   (2, 3)
  B     (2, 3)   (0, 1)

  so what i need from you is three things. (1) the question itself, written like a real exam / problem-set question with a few lettered parts — make them solve Game A by iterated elimination and say exactly what survives and why, and also make them find Game A's mixed-strategy Nash equilibrium and say whether the surviving set has anything to do with it; then use Game B for the order-dependence part, where they have to run the elimination two different ways and notice they get two different answers. (2) a model answer, like 700-900 words, that a smart club member could read and go "ohhh ok." and (3) a marking scheme for me to grade with — the specific moves a full-marks answer has to make, and the specific wrong moves that should lose points (i already know about the "only pure strategies can dominate" one, but i bet there's others i don't even know about, so list those too). don't worry about citations or references or anything, nobody's getting graded for real, i just want it to be actually correct and not hand-wavy.
