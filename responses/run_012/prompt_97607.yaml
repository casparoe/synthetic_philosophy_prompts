answer: |-
  ### Part 1: The Problem Set

  **Math Club Challenge: Advanced Game Theory**
  **Topic:** Dominance, Mixed Strategies, and Elimination Orders

  **Instructions:** Consider the two normal-form games below. Player 1 chooses the Row, Player 2 chooses the Column. Payoffs are listed as (Player 1, Player 2).

  **Game A**
  | | **L** | **R** |
  | :--- | :---: | :---: |
  | **T** | (3, 0) | (0, 1) |
  | **M** | (0, 1) | (3, 0) |
  | **B** | (1, 1) | (1, 1) |

  **Game B**
  | | **L** | **C** |
  | :--- | :---: | :---: |
  | **T** | (2, 3) | (2, 3) |
  | **B** | (2, 3) | (0, 1) |

  **(a) Mixed Dominance in Game A**
  Examine Player 1's strategies in Game A.
  1. Show that strategy **B** is *not* strictly dominated by either **T** or **M** individually.
  2. Demonstrate that **B** *is* strictly dominated by a mixed strategy involving **T** and **M**. Specify the probabilities.
  3. Perform Iterated Elimination of Strictly Dominated Strategies (IESDS). What strategies survive?
  4. Find the Mixed-Strategy Nash Equilibrium (MSNE) of the original game. Does the support of this equilibrium match the strategies that survived elimination?

  **(b) Order Dependence in Game B**
  In Game B, identify all weakly dominated strategies for both players.
  1. **Path 1:** Eliminate Player 1's weakly dominated strategy first, then check for further dominance. List the surviving strategy profiles.
  2. **Path 2:** Eliminate Player 2's weakly dominated strategy first, then check for further dominance. List the surviving strategy profiles.
  3. Compare the results. Did the order of elimination change the outcome?

  **(c) Conceptual Understanding**
  In 3-5 sentences, explain *why* the order of elimination matters for weak dominance but not for strict dominance. Hint: Think about "Best Responses."

  ***

  ### Part 2: Model Solution

  **Game A: The Power of Mixing**
  First, we check if **B** is dominated by a pure strategy. Against **L**, **T** pays 3 and **B** pays 1 ($3>1$), but against **R**, **T** pays 0 and **B** pays 1 ($0<1$). So **T** does not dominate **B**. Similarly, **M** pays 0 against **L** ($0<1$), so **M** does not dominate **B**. If we only looked at pure strategies, we would incorrectly conclude **B** is safe.

  However, consider a mixed strategy $\sigma$ where Player 1 plays **T** with probability $0.5$ and **M** with probability $0.5$.
  *   If Player 2 plays **L**: Expected payoff is $0.5(3) + 0.5(0) = 1.5$. Since $1.5 > 1$ (the payoff of **B**), the mix wins.
  *   If Player 2 plays **R**: Expected payoff is $0.5(0) + 0.5(3) = 1.5$. Since $1.5 > 1$, the mix wins again.
  Because $1.5 > 1$ in all cases, **B** is strictly dominated by this 50/50 mix and is eliminated.

  With **B** gone, we have a 2x2 game. Neither **T** nor **M** dominates the other, and neither **L** nor **R** dominates the other for Player 2. Thus, the surviving strategies are $\{T, M\}$ for Player 1 and $\{L, R\}$ for Player 2.

  To find the MSNE, we make the opponent indifferent.
  *   Player 1 mixes $p$ on **T** to make Player 2 indifferent between **L** and **R**:
      $EU_2(L) = EU_2(R) \Rightarrow 0(p) + 1(1-p) = 1(p) + 0(1-p) \Rightarrow 1-p = p \Rightarrow p = 0.5$.
  *   Player 2 mixes $q$ on **L** to make Player 1 indifferent between **T** and **M**:
      $EU_1(T) = EU_1(M) \Rightarrow 3(q) + 0(1-q) = 0(q) + 3(1-q) \Rightarrow 3q = 3 - 3q \Rightarrow q = 0.5$.
  The MSNE is (50% T, 50% M) vs (50% L, 50% R). The support of this equilibrium is exactly $\{T, M\}$ and $\{L, R\}$, which matches the strategies that survived IESDS.

  **Game B: The Fragility of Weak Dominance**
  In Game B, **T** weakly dominates **B** for Player 1 (2 vs 2 on L, 2 vs 0 on C). **L** weakly dominates **C** for Player 2 (3 vs 3 on T, 3 vs 1 on B).

  *   **Path 1 (Eliminate B first):** Remove row **B**. Player 2 faces row **T** only. Payoffs are 3 for **L** and 3 for **C**. Neither dominates.
      *   *Survivors:* **(T, L)** and **(T, C)**.
  *   **Path 2 (Eliminate C first):** Remove column **C**. Player 1 faces column **L** only. Payoffs are 2 for **T** and 2 for **B**. Neither dominates.
      *   *Survivors:* **(T, L)** and **(B, L)**.

  The sets of survivors are different. Path 1 keeps (T, C) but loses (B, L). Path 2 keeps (B, L) but loses (T, C). The order changed the result.

  **Why Order Matters**
  Strictly dominated strategies are *never* a best response to any belief about the opponent. Removing them never deletes a Nash Equilibrium. Weakly dominated strategies, however, *can* be a best response (just not a unique one). In Game B, **B** is a best response if Player 2 plays **L**. If we eliminate **C** first, we force Player 2 to play **L**, making **B** a valid best response. If we eliminate **B** first, we assume Player 1 never plays it, destroying the equilibrium that relied on it. Thus, eliminating weakly dominated strategies can accidentally delete valid equilibria depending on the sequence.

  ***

  ### Part 3: Marking Scheme

  **Total Points: 20**

  **Part (a): Game A (8 Points)**
  *   **[2 pts]** Correctly shows **B** is not dominated by **T** alone (cites R column) or **M** alone (cites L column).
      *   *Deduct 1 pt* if they claim **T** or **M** dominates **B** purely.
  *   **[2 pts]** Constructs the mixed strategy (0.5 T, 0.5 M) and calculates expected payoffs (1.5 vs 1) to prove strict dominance.
      *   *Full credit* for any mix $p \in (1/3, 2/3)$, but 0.5 is standard.
  *   **[2 pts]** Correctly identifies surviving strategies: {T, M} for P1, {L, R} for P2.
  *   **[2 pts]** Correctly calculates MSNE (0.5, 0.5) for both players and confirms the support matches the surviving set.
      *   *Deduct 1 pt* if they find the NE but don't compare it to the surviving set.

  **Part (b): Game B (8 Points)**
  *   **[2 pts]** Correctly identifies **T** weakly dominates **B** AND **L** weakly dominates **C**.
      *   *Critical:* Must use the term "weakly." If they say "strictly," deduct 1 pt.
  *   **[3 pts]** Correctly executes Path 1 and Path 2, listing the specific surviving *profiles* (e.g., (T,C) vs (B,L)).
      *   *Deduct 2 pts* if they only list strategies (e.g., "T and L survive") instead of profiles.
  *   **[3 pts]** Explicitly states that the outcomes are different and identifies which profile was lost in each path.

  **Part (c): Conceptual (4 Points)**
  *   **[2 pts]** Mentions that strictly dominated strategies are never best responses.
  *   **[2 pts]** Mentions that weakly dominated strategies *can* be best responses (usually due to ties/equality), so eliminating them risks removing an equilibrium.
      *   *Zero credit* for vague answers like "because weak is weaker."

  **Common Pitfalls & Grading Notes:**
  1.  **The "Pure Only" Trap:** If a student says "B is not dominated" in Part (a) because no *pure* strategy beats it, give them the 2 points for checking pure strategies, but 0 points for the dominance conclusion. They must acknowledge the mixed strategy.
  2.  **Equilibrium vs. Dominance:** In Part (b), students might try to find Nash Equilibria directly instead of running elimination. If they get the right survivors but don't show the elimination steps, give half credit for Part (b). The goal is to test the *process*.
  3.  **Strict vs. Weak Confusion:** In Game B, payoffs (2,3) vs (2,3) create a tie. If a student claims this is strict dominance, they fundamentally misunderstand the definition. Deduct points in Part (b) and Part (c).
  4.  **Surviving Set vs. Profile:** Ensure they distinguish between surviving *strategies* (e.g., T survives) and surviving *profiles* (e.g., (T,L) survives). Part (b) specifically asks for profiles.
