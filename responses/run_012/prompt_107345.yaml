prompt: |-
  I retired from a chemistry lab a few years back and have been teaching myself philosophy on the side, mostly philosophy of science with some of the mind stuff mixed in. Lately I got hooked on those little puzzle cards where you get two panels of squiggles and shapes, six on one side and six on the other, and you have to work out what makes the left ones left. My neighbour and I sat down with the same card and both came up with a rule. Mine was about whether the figure had a line of symmetry; hers was about whether a little triangle was tucked away somewhere in it. Both rules sorted all twelve figures the same way and both of us called the next few cards right, so we started bickering about who had actually solved it — then it got worse, because we hit cards where the two rules disagree and neither of us could say which one was "the" rule rather than just a rule that happened to fit. Now I'm genuinely rattled. Is there a fact of the matter about which rule is the right answer, or is the puzzle just underdetermined and we were both fine? And if there's no fact of the matter, what does that say about the "concepts" I thought I was learning from the examples? I've skimmed a bit of Goodman and Wittgenstein and I suspect they're circling something like this, but I can't tell if they're on the same problem or two different ones.

  Act as a philosopher who works on induction and the nature of concepts — someone who knows the Goodman grue material, the rule-following literature, and the debates about whether concepts are learned from examples or brought to them. Before you answer, brainstorm the main ways philosophers have tried to make sense of this kind of case, and lay that out briefly. Then give me your own take on my neighbour and me, and don't fob me off with "both rules are valid, it depends what you mean" — I want to know wether my unease is pointing at something real or whether I've just confused myself.
