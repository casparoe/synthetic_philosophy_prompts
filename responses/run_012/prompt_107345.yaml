      *   *Wittgenstein (Philosophical Investigations):* Rule-following paradox. No finite set of examples logically forces one specific rule (e.g., +2 vs. +2 up to 1000 then +4). Meaning is use within a form of life. There is no "mental state" that fixes the rule.
