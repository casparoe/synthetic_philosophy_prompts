      *(Self-Correction during drafting)*: Make sure to distinguish between the *Logical* Frame Problem (McCarthy) and the *Philosophical* Frame Problem (Dennett/Fodor). This is the crux of the naming collision.

      *(Refining the ML point)*: Be careful not to overhype LLMs. They hallucinate. They don't truly "understand" causality. So they haven't solved Camp 2's worry, they've just masked it with probability.

