  If you find a compelling reason to send, that reason exists for them, too. You cannot access a rationale that they cannot. Therefore, you cannot rationally choose an action that relies on them choosing differently than you. The outcome "I send, they don't" is logically inaccessible to a symmetric reasoner. It requires you to be rational while they are irrational, or vice versa. Since you know you are all "chewing on it" equally, you must treat your decision as determining the output of a single logical function running in three places.

