      *   *Desert vs. Contribution Share:* Safety uses "Contribution." "Desert" (what you deserve) is a legal/HR concept, not an engineering one.
      *   *The Lorry Driver in Safety:* Yes, the operator who followed SOPs but the vessel ruptured due to unseen corrosion. They often quit. Safety calls this "trauma," Philosophy calls it "agent-regret."
      *   *Outcome Dependence:* Safety says "Ignore outcome, look at process." Nagel/Williams say "Outcome *makes* the moral event."
