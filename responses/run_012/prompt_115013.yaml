      *   "Answer the specific questions."

  *(Self-Correction during drafting)*: I need to be careful with "Just Culture." Just Culture is the *attempt* to solve Moral Luck in an organizational setting. It tries to separate behavior from outcome. I should highlight this as the organizational response to the philosophical problem.

  *(Refining the Lorry Driver)*: In process safety, the equivalent is the operator who followed every step, but a metallurgical flaw existed that inspection couldn't find (Probability of Detection < 100%). They are blameless, but the plant explodes. Do they feel regret? Yes. Does the system care? Only regarding retention/fitness for duty.

