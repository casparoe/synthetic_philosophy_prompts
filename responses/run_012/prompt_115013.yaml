answer: |-
  Here is the translation of Moral Luck into Process Safety terminology, followed by the Residue Report you requested.

  ### Part 1: The Translation
  **Subject:** Moral Luck (Nagel/Williams)
  **Target Domain:** Incident Investigation & Process Safety Management (PSM)

  **1. The Control Principle → Just Culture & Accountability**
  *   **Philosophy:** You are only morally assessable for what is within your control.
  *   **Safety Translation:** This is the core axiom of **Just Culture**. We distinguish between *human error* (unintentional), *at-risk behavior* (choice influenced by system), and *reckless conduct* (conscious disregard). We only apply administrative sanctions (the "hook") to the third category. If it wasn't in their control, it's a latent condition, not an accountability event.

  **2. Constitutive Luck (Who you are) → Competence & Selection**
  *   **Philosophy:** Your temperament, intelligence, and risk tolerance are largely matters of luck (genetics, upbringing).
  *   **Safety Translation:** We treat this as **Competence Assurance** and **Fitness for Duty**. We assume via the **Substitution Test** that a "similarly trained and equally motivated person" would behave the same.
  *   *[FLAGGED ENGINEERING ASSUMPTION]:* Safety assumes "competence" is a controllable variable via training and selection. Nagel argues the *capacity* to be trained or the *disposition* to be careful is itself luck. When we fire someone for "poor judgment," we are punishing constitutive luck, but we label it a "competence gap."

  **3. Circumstantial Luck (The situations you land in) → Latent Conditions & Context**
  *   **Philosophy:** You only face moral tests because you happened to be in the situation where the test existed.
  *   **Safety Translation:** These are **Latent Conditions** (organizational, environmental, contextual factors). An operator only faces a high-risk decision because the **Bowtie** threats materialized. If the production schedule hadn't been rushed (management latent condition), the ethical dilemma to bypass a safety interlock never arises. We investigate the "why" they were in that situation, not just the "what" they did.

  **4. Causal Luck (Antecedent causes) → Root Cause & Chronology**
  *   **Philosophy:** The chain of causes that led to your action is determined by prior events outside your control.
  *   **Safety Translation:** This is the **Fault Tree** logic. Every basic event is caused by an intermediate event. We trace back to the **Root Cause**. If we trace back far enough, the "choice" looks like an inevitable output of prior system states. Dekker argues that once you understand the local rationality, the "choice" dissolves into system logic.

  **5. Resultant Luck (How things turn out) → Outcome Bias & Severity**
  *   **Philosophy:** Two drivers run a red light. One hits a child, one doesn't. We judge the first harsher.
  *   **Safety Translation:** This is **Outcome Bias**. In PSM, we try to counter this by investigating **Near Misses** with the same rigor as **Fatalities**. However, legally and emotionally, a **Loss of Primary Containment (LOPC)** that ignites is treated differently than one that disperses, even if the barrier failure was identical. The **Risk Matrix** explicitly codifies this: Severity x Likelihood. We punish high severity more than low severity, even if the control failure was identical.

  **6. Williams' Lorry Driver → The "Blameless" Operator in a Catastrophe**
  *   **Philosophy:** A driver kills a child through no fault of his own but feels "agent-regret."
  *   **Safety Translation:** An operator follows **SOPs**, all **Barriers** were theoretically in place, but a **Common Cause Failure** or an **Unknown Unknown** (e.g., metallurgical flaw undetectable by current NDT) causes a rupture.
  *   **The Feeling:** In Safety, we call this **Psychological Trauma** or **Fitness for Duty** concern. We offer EAP (Employee Assistance Programs). We do not have a term for "moral burden without fault." We treat it as a health issue, not a moral one.

  **7. The Vanishing Morality → The "Zero Harm" Paradox**
  *   **Philosophy:** If you scrub all luck out, there's almost nothing left to assess.
  *   **Safety Translation:** If we scrub all luck out (perfect system, perfect training, perfect context), there are no incidents. But if we attribute every incident to "System," individual accountability vanishes. This is the tension in **Just Culture**: How much **Contribution Share** does the individual hold before the System absorbs it all?

  ***

  ### Part 2: The Residue Report

  Here is the audit of the translation. What holds, what breaks, and where the tools fail.

  #### 1. What Translates Cleanly
  **Resultant Luck (Outcome Bias).**
  This is the strongest match. Safety science explicitly acknowledges that judging based on severity is a bias. The push to investigate near misses as rigorously as fatalities is a direct engineering attempt to solve Nagel's Resultant Luck problem. We admit the moral/legal system punishes based on outcome, but we try to build a learning system that punishes based on *process deviation*.
  *   *Verdict:* Clean translation. Safety identifies the bias and attempts to engineer a control for it.

  #### 2. What Translates with Distortion
  **Constitutive Luck (Who you are).**
  Safety tools assume a "Standard Operator." The **Substitution Test** asks: "Would another qualified person do the same?" This implies that "qualified" is a stable, controllable state.
  *   *The Distortion:* Nagel says your ability to be "qualified" (your focus, your risk tolerance, your neurology) is luck. Safety treats it as a **Barrier** (Training/Selection).
  *   *The Consequence:* When we identify "Poor Judgment" as a cause, we are often flagging Constitutive Luck but treating it as a System Gap. We say "Retrain" or "Remove," implying control where there may be none. We distort luck into "competence" to keep the **Fault Tree** solvable.

  **Circumstantial Luck (Latent Conditions).**
  Safety maps this well to Latent Conditions, *but* with a teleological difference. Philosophy sees circumstance as random. Safety sees circumstance as *manageable*. We assume that if we identify the latent condition, we can fix it. Nagel suggests some circumstances are just the background noise of existence.
  *   *The Consequence:* We over-promise on **ALARP** (As Low As Reasonably Practicable). We assume "Reasonably Practicable" covers most luck. Philosophy suggests a residue of risk remains that is not "practicable" to remove, yet we still feel responsible for it.

  #### 3. What Has No Counterpart (The Void)
  **Agent-Regret.**
  You asked if there is anything in your world for the Lorry Driver. There is "Trauma," but that is medical. There is "Survivor Guilt," but that is psychological. There is no *operational* category for "I am causally linked to this harm, I followed all rules, but I feel I owe a debt."
  *   *Why it's missing:* Safety is forward-looking (prevention). Agent-regret is backward-looking (atonement). Our **Corrective Actions** are designed to prevent recurrence, not to settle the moral account of the actor.
  *   *The Lorry Driver in the Plant:* Yes, they exist. They are the operators who walk away from the industry after a fatality, even when the investigation clears them. Our vocabulary calls this "turnover" or "medical separation." We have no node for "moral injury without negligence."

  **Desert vs. Contribution Share.**
  Does desert survive? No. In Safety, "Desert" (what you deserve) is replaced by "Contribution Share" (how much you influenced the event).
  *   *The Gap:* Contribution Share is mathematical/causal. Desert is retributive/restorative. You can have 10% Contribution Share (you pressed the button) but 100% of the Legal Desert (you are the licensed operator). Safety tools measure the former; HR and Law measure the latter. They talk past each other.

  #### 4. The Fault Tree Question
  *Is there a node for "the kind of person you turned out to be"?*
  **No.**
  *   *Is it a hole in the tools?* No. It is a boundary condition. Fault trees model *events* and *states*, not *ontology*. A "personality trait" is not a failure mode; it is a constant parameter.
  *   *The Implication:* If you added a node for "Constitutive Luck," the Fault Tree would never close. You'd have to trace back to their parents, their genetics, their nutrition. The tool would become infinite.
  *   *The Fix:* We truncate the tree at "Human Error" or "Procedural Violation." We treat the person as a black box with inputs (training, context) and outputs (actions). Nagel says the black box is made of luck. Safety says the black box is the "Human Element." This isn't a hole in the tool; it's a necessary simplification to make the system actionable.

  #### 5. The Outcome Dependence Paradox
  *We treat outcome-dependence as a bias. Nagel/Williams say it's essential to morality. Who is confused?*
  **Neither. You are solving different optimization problems.**

  *   **Safety (Forward-Looking):** Your goal is *Risk Reduction*. Outcome bias is noise that distracts you from the signal (the broken barrier). If you only investigate fatalities, you miss the near misses that share the same root cause. You *must* engineer out outcome dependence to maximize learning.
  *   **Philosophy/Law (Backward-Looking):** Their goal is *Justice/Assessment*. Williams argues that moral identity is constituted by what actually happens in the world, not just what happens in your will. A driver who kills a child *is* a killer, even if blameless. That changes their relationship with the world.

  *   *The Conflict:* Safety wants to decouple Action from Consequence to learn. Morality couples Action and Consequence to judge.
  *   *The Residue:* The residue is the operator who is "cleared" by the investigation (Safety success) but feels "guilty" by the outcome (Moral reality). Safety has no procedure for this because Safety cannot fix Moral Luck. It can only fix System Luck.

  #### 6. Final Diagnosis: Hole in Vocabulary or Mushy Philosophy?
  It is **not** a hole in your vocabulary, and the philosophy is **not** mush. It is a **Domain Mismatch**.

  Your tools (Bowties, Fault Trees, Just Culture) are designed for **Control**. They assume that if we identify the variable, we can mitigate it.
  Moral Luck is an argument about **Limits**. It asserts that there are variables (Constitutive, Resultant) that cannot be mitigated, only endured.

  *   **If you import the philosophy into Safety:** You risk paralysis. If everything is luck, **ALARP** becomes meaningless. Why install a relief valve if the rupture is just resultant luck?
  *   **If you ignore the philosophy:** You risk dehumanization. You treat the Lorry Driver as a "system component that functioned correctly" rather than a moral agent who is shattered by the event.

  **Recommendation:**
  Keep your Fault Trees causal. Do not add a "Constitutive Luck" node; it breaks the logic gate. But, in your **Post-Incident Support** (which is distinct from Investigation), acknowledge the Williams residue. When an operator is cleared by the **Root Cause Analysis** but won't come back to work, do not label it "non-compliance" or "medical." Label it what it is: **Agent-Regret**.

  Your tools are for the plant. They are not for the soul. The friction you feel isn't a bug in your methodology; it's the sound of engineering rubbing against the human condition.
