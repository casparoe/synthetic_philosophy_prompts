answer: |-
  Good evening, everyone. For those who don't know me, I'm the Best Man. I've known the bride since college, which means I've had a front-row seat to her journey from a grad student who cited footnotes in casual conversation to a woman who can now explain to her mother why she can't come to Sunday dinner without invoking a Pareto improvement.

  Looking around this room, I realize we have a unique demographic split. On one side, we have the bride's family—wonderful, warm Irish Catholics who, as far as I can tell, think "utility" is the company that sends the electric bill. And on the other side, we have the groom's colleagues—people who probably analyzed the seating chart for Nash equilibria.

  I want to try to bridge that gap for this toast. Because the truth is, [Bride] and [Groom] didn't just meet at a conference on interpersonal utility comparisons. They met because they were both trying to solve the same problem: How do you take two separate lives and make them into one shared future without losing yourself in the process?

  There is a famous idea in economics called Harsanyi's Aggregation Theorem. Now, for Aunt Maureen and the rest of the family, don't worry, there won't be a quiz. But the gist of it is this: If you have two people who are rational about what they want, and you want to create a "joint" preference for them as a couple—where you respect both of their happiness—the math says there is only one way to do it.

  You have to add their happiness together. But, you can't just add them one-to-one. You have to apply weights.

  Think of it like this. If [Groom] wants to spend the weekend hiking, and [Bride] wants to spend it sleeping in, how does the "Couple" decide? The theorem says the decision has to be a weighted sum of their individual desires.

  Now, here is the beautiful part. Here is the part that matters for tonight. The theorem proves that you *need* weights. But the math... the math is silent on what those weights actually *are*.

  Math can tell you that [Bride] and [Groom] need to balance each other. But it cannot tell them whose preference matters more on which day. It cannot calculate how much [Groom] should weigh [Bride]'s happiness against his own when she's had a hard week. It cannot quantify the value of [Bride] letting [Groom] pick the restaurant just because she loves the look on his face when he orders the steak.

  The theorem leaves that blank space. And that blank space is the marriage.

  If the weights were fixed at fifty-fifty, that wouldn't be a partnership; that would be a transaction. Sometimes, the weight tips. Sometimes one of you carries more of the load, and your happiness counts for more in the equation because you need it more. And sometimes, it tips the other way.

  The genius of [Bride] and [Groom] isn't that they found a formula where they never disagree. It's that they've agreed to let the weights be fluid. They've agreed that the "Couple's Utility" isn't about winning an argument. It's about knowing when to increase the weight on the other person's side of the scale.

  To the economists in the room: They have satisfied the axioms. They are Pareto efficient. Neither can be made better off without making the other better off.

  And to the family: They love each other enough to let the other person win, even when the math says they don't have to.

  So, if you'll raise your glasses.

  To [Bride] and [Groom]. May your lives be a weighted sum of joy, may your weights always be generous, and may you never forget that while the theorem tells you *how* to combine your lives, only love tells you *how much* each of you matters.

  To the happy couple!
