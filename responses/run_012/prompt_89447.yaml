      3vs4 is practical (Keep vs. Destroy).
      Nietzsche would say 3vs4 is the life/death struggle. But logically, 1vs2 is a harder contradiction to resolve without nuance.
      Let's go with 1vs2 as "Worst" because it undermines the integrity of the argument immediately. If your heroes are liars, your inspiration is fake.
      Actually, 3vs4 is more visceral. "Keep the statue" vs "Statue is problematic, remove it."
      Let's rank 3vs4 as Worst because it forces an immediate action contradiction. 1vs2 is cognitive dissonance.
      Actually, looking at the prompt: "rank them worst to mildest."
