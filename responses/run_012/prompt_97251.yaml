answer: |-
  **TO:** Awards Committee
  **FROM:** [Your Name]
  **DATE:** [Date]
  **SUBJECT:** Recommendation Regarding the [Name of Prize] Dispute

  **Recommendation**
  I recommend we award the prize solely to **Researcher B** (the cleaner derivation, privately circulated). We should explicitly cite Researcher A in the award citation for stimulating the final phase of the field's work, but A should not be a co-recipient. We should not defer, and we should not split the prize.

  **The Conceptual Standard: What Are We Rewarding?**
  Our bylaws state the prize recognizes whoever "made the discovery." We must interpret this not as "whoever announced the result first," but "whoever secured the result in a robust, usable form." Science advances through understanding, not just priority claims. Researcher A published first, but their derivation contained a gap that required external intervention to close. Researcher B possessed the complete, general derivation beforehand. While A triggered the community's engagement, B provided the actual tool the community now uses. If we reward A, we signal that announcement outweighs completeness. If we reward B, we signal that the Society values the *substance* of the discovery over the *sociology* of its publication.

  **Inevitability vs. Contingency**
  Several members have argued that the result was "ripe for the taking," implying that because the surrounding pieces were in place, the discovery was inevitable and thus less deserving of distinction. We must distinguish two senses of inevitability:
  1.  **Contextual Inevitability:** Given the state of the field, *a* solution was likely imminent.
  2.  **Contingent Achievement:** The *specific formulation* that makes the result robust and general is not inevitable. It depends on the insight of a specific agent.

  Our decision should track the **contingent achievement**. Even if a result is contextually inevitable, the specific derivation that renders it usable is a contingent intellectual act. The fact that the field was ready does not diminish the credit due to the researcher who actually cleared the path. We should not penalize either claimant for standing on the shoulders of giants; we reward the final step that made the view possible.

  **The Strongest Case for the Rejected Disposition (Researcher A)**
  I urge us to acknowledge the strength of the case for Researcher A, which rests on the normative function of publication. Science is a public enterprise. By publishing, A subjected the claim to scrutiny, alerted the third party who closed the gap, and formally entered the result into the permanent record. Awarding B relies on private circulation, which is harder to verify and risks rewarding secrecy over community building. If we prioritize private manuscripts, we may inadvertently discourage the rapid public disclosure that accelerates collective progress. This is a serious administrative concern, but it should not override the scientific reality that A's work was incomplete without assistance.

  **Treatment of the Partial Contributor**
  Researcher A is the "earlier partial contributor." To split the prize would imply their contributions were equal in kind, which they were not. A provided a catalyst; B provided the mechanism. Therefore, A should not share the prize. However, to maintain goodwill and accuracy, the award citation must read: *"For the derivation of [Result], building on the foundational work of [Researcher A]."* This acknowledges A's priority in time without conflating it with priority in completion.

  **A General Rule for Future Cases**
  To avoid collapsing into awarding everyone working nearby, we should adopt the following standard for "Discovery":
  *Priority belongs to the first **complete and verifiable** account communicated to the community.*

  "Complete" means the derivation stands without requiring essential closure by a third party. "Verifiable" means the account was either published or circulated to a sufficient body of peers to establish a timestamped claim. Proximity to the problem, preliminary preprints, or conference abstracts do not constitute "making the discovery." This rule rewards the finish line, not the proximity to it.

  **Conclusion**
  Let us award the researcher who gave the field the tool it actually uses. We are here to honor the discovery, not the press release.

  [Your Name]
