answer: |-
  Dear Convenor,

  It is a sound instinct to begin your reading group by specifying the job before evaluating the workers, for as you have noted, the literature is cluttered with defenses of specific mechanisms that rarely pause to agree on what success looks like. To construct a adequate specification for a theory of non-informative credence, we must first establish the formal baseline, which is non-negotiable. Any account must deliver a representation of belief that satisfies the ordinary probability axioms, or else explicitly justify why it deviates, such as by adopting a non-additive measure. It must be consistent with the behaviour of additivity on infinite and non-denumerable spaces, acknowledging that countable additivity is often too strong a requirement for ignorance but finite additivity is usually too weak for learning, and it must respect conditionalization as the standard model for updating, unless it provides a coherent alternative for how evidence constrains belief. Furthermore, the theory must inherit coherence constraints from decision theory, ensuring that the credences it licenses do not expose the agent to a sure loss or guarantee that they fare worse than some available alternative regardless of the state of the world. These are the table stakes, and while there is debate over the finer points of measure theory, any proposal that violates the basic calculus of probability without a compelling structural reason should be dismissed immediately.

  Beyond the formal machinery, the theory must handle the simple cases where symmetry is uncontroversial and the answer is beyond dispute, such as assigning a credence of one-half to heads on a coin known only to be symmetric. This is a non-negotiable requirement because a theory of ignorance that cannot handle paradigmatic ignorance is useless. However, it must also maintain the distinction between the agent's ignorance and the world's indeterminacy, ensuring that a uniform distribution over outcomes does not implicitly commit the agent to a belief that the world itself is chancy rather than merely unknown. Closely related is the requirement to distinguish between a single permissible credence and a set of permissible ones. The theory must state clearly whether it views the prior as uniquely determined by rationality or as merely constrained within a range, and it must not collapse the distinction between a prior offered as a convenience on the way to a posterior and a prior claimed to be rationally obligatory. If the theory claims the prior is obligatory, it must explain why rationality dictates a specific number; if it is a convenience, it must explain why different agents might reasonably start elsewhere without irrationality. Finally, the theory must take a stance on a less obvious matter: whether an agent can end up with a less settled credence than before by acquiring information that is logically independent of the quantity in question. Standard Bayesianism says no, but theories of imprecise probability allow for dilation, and your specification should demand that any candidate theory explicitly justify its verdict on whether learning irrelevant information can widen credal intervals.

  The heart of the specification, and the source of the greatest tension, lies in the requirement of description invariance versus the requirement of uniqueness. You asked for the incompatibility, and it is this: we cannot jointly satisfy the demand that the theory return a unique answer in every case in which the agent genuinely lacks information and the demand that the answer not depend on which of several equally faithful descriptions of the same situation the agent happens to have used. If you insist on a unique precise credence, you must accept that the result will depend on the parameterization, because different transformations of the same variable yield different uniform distributions. If you insist on invariance under reparameterization, you must accept that the result will often be a set of credences or no determinate credence at all, because no single distribution remains invariant under all transformations. The usual way of keeping both, which is to supply the agent with a symmetry or a constraint that, by hypothesis, they do not have, is not a solution but a change of subject, as it replaces the problem of ignorance with the problem of applying known structural constraints. An honest statement of this incompatibility requires admitting that one of these demands must be dropped. The requirement that does the most work in excluding candidates is description invariance, because it eliminates classical indifference principles that rely on arbitrary parameterizations. The requirement that is really a prejudice of one camp dressed up as a criterion is the demand for uniqueness, which stems from a Bayesian orthodoxy that rationality must always mandate a precise number, even when the evidence is insufficient to distinguish between possibilities.

  This brings us to your specific case of the unknown positive quantity between 1 and 100. Your list must render a verdict here, and given the incompatibility outlined above, the only principled verdict is that no determinate credence is available. The agent knows only the bounds, and since the description in terms of the quantity, its reciprocal, and its logarithm are equally faithful and compatible with the total information, a principle that assigns credence by symmetry over the described space will return three different answers. To choose one is to pretend to knowledge the agent does not have. Therefore, the theory must declare that the rational credence is indeterminate, represented perhaps by the interval from zero to one, or by a set of distributions. This does not reduce the theory to a mere toolbox; rather, it clarifies that a theory of this kind is a theory of rational constraints rather than rational determination. It tells the agent what they are forbidden to believe (certainty, or specific biases without evidence) rather than commanding a specific number. If the theory insists on a determinate credence here, it must admit that it is importing extra-evidential constraints, such as a specific metric of similarity or a preferred group of transformations, and it must own that importation as a substantive assumption rather than a logical consequence of ignorance.

  Regarding the distinction between a reparameterization that exposes a defect in the theory and one that merely reflects a genuine gap in what the agent knows, the specification must require that the theory identify which transformations are epistemically significant. If a change of variable changes the credence, the theory must either show that the variable change alters the information content or admit that the prior selection rule is defective. In the case of your quantity between 1 and 100, the logarithmic transformation exposes a defect in any theory that claims uniqueness based on simple indifference, because the gap in knowledge is invariant under the transformation, yet the output changes. Thus, the defect lies in the demand for uniqueness, not in the agent's description.

  To close with the brief comparison you requested, the four families you named fare differently against these desiderata. Classical indifference satisfies the uniqueness requirement and handles simple symmetry cases well, but it fails description invariance catastrophically, as your case demonstrates, and it often collapses the distinction between ignorance and indeterminacy by imposing structure where there is none. Invariance principles, such as those relying on transformation groups, respect description invariance and handle the formal results on infinite spaces better, but they often fail to return a unique answer, forcing a move toward imprecise probabilities, and they can be sensitive to the choice of the group itself. Maximum entropy respects the probability axioms and coherence, and it handles the distinction between convenience and obligation by often treating the prior as a tool, but it requires a measure to be specified beforehand, which means it cannot solve the problem of ignorance from scratch without smuggling in a default measure that acts just like an indifference principle. Finally, the imprecise-probability family satisfies the requirement to distinguish between unique and set credences and handles the dilation of independent information gracefully, but it pays the price of violating the uniqueness prejudice, which many find computationally and decision-theoretically cumbersome. None of them satisfy every item on the list without qualification, which is precisely why your group should begin with the list rather than the proposals.

  I hope this specification serves as a rigorous starting point for your sessions. It is better to know why the tools fail than to use them blindly.

  Yours, etc.
