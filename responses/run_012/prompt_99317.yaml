answer: |-
  Here is the definitive ranking of these seven criteria, ordered from most to least useful for a novelist currently in the trenches.

  **1. Tolstoy: Sincerity**
  This is the engine of the whole theory; if you are faking the emotion, the "infection" fails regardless of your technical skill. *(Note: I am reading this as "emotional truth" rather than Tolstoy's stricter demand for raw, autobiographical confession, which is a contested distinction that often trips writers up.)*

  **2. Tolstoy: The Counterfeit Tells (Borrowing, Imitation, Effectfulness, Diversion)**
  This is your best diagnostic tool for revision, particularly the warning against "effectfulness," which cures the urge to write melodrama just to wake the reader up.

  **3. User: The Re-read Test**
  This measures structural integrity and thematic depth, ensuring you have built a world that exists independently of the reader's suspense about the ending.

  **4. User: The Sentence-thrill Test**
  While secondary to emotional transmission, this ensures the prose has enough texture and rhythm to sustain attention when the narrative momentum pauses.

  **5. User: The Translation Test**
  This is a stricter, more linguistic version of Tolstoy's universality; if the feeling dies when the specific music of your language is stripped away, the art was in the ornament, not the bone.

  **6. Tolstoy: Communicability (The "Peasant" Test)**
  While clarity is vital, demanding that art be immediately accessible to everyone risks dumbing down complex human experiences that require nuance to transmit.

  **7. Tolstoy: Moral Elevation**
  Here Tolstoy is simply wrong; art can transmit fear, despair, or ambiguity and still be great, so judging work by its capacity to promote "Christian unity" is a creative dead end.
