  Your convictions form a sophisticated but strained architecture. The load-bearing walls are your epistemology (how you know) and your ontology (what exists). Below is the audit of the fault lines.

  ### Genuine Tensions (Ranked by Severity)

  **1. Convictions (2) and (3): The Methodological Contradiction**
  This is the critical structural failure. Conviction (2) establishes a strict source-critical rule: a late source without a contemporary trace is "worth nothing." Conviction (3) validates oral traditions transmitted under stable institutions as "evidence of the first rank." In the Bronze Age context, oral traditions are almost invariably "late sources" (recorded centuries later) that cannot be traced to contemporary *written* ones. If (2) holds, (3) is impossible; if (3) holds, (2) is false.
  *   **What must give:** Conviction (2) must be qualified to acknowledge oral transmission as a valid chain of custody equivalent to a written trace.
  *   **Cost of repair:** Low. It requires nuance in definition, not abandoning source criticism.

  **2. Convictions (5) and (6): The Illocutionary Conflict**
  Conviction (5) claims the historian and novelist engage in "one activity" differing only in degree. Conviction (6) claims the novel "asserts nothing," implying a fundamental difference in kind (truth-claim vs. fiction). If the cognitive activity is identical (colligation), the assertion status should logically align. You cannot claim the work is the same *kind* of labor but a different *kind* of speech act without explaining the divergence.
  *   **What must give:** Conviction (5) should acknowledge a difference in *kind* (intent/assertion) rather than just degree, even if the cognitive labor is similar.
  *   **Cost of repair:** Moderate. It requires abandoning a provocative philosophical parity between historian and novelist.

  ### Apparent Tensions (Dissolved by Distinction)

  **Convictions (1) and (5): Ontology vs. Narratology**
  This appears to be a conflict between Realism (1) and Constructivism (5). It dissolves when you distinguish between the *events* (which are determinate, per 1) and the *narrative structure* imposed upon them (which is colligated, per 5). The past is fixed; the plot is not.

  **Convictions (4) and (6): Genre Contract vs. Truth Claim**
  This appears to conflict because (4) constrains invention while (6) denies assertion. It dissolves when distinguishing between a *genre contract* (historical fiction must respect known facts) and a *truth claim* (asserting these inventions actually happened). You can follow rules without making assertions.

  ### Single Revision to Resolve the Most

  Revising **Conviction (5)** would resolve the most friction. By shifting from "difference of degree" to "difference in kind" (specifically regarding illocutionary force), you harmonize (5) with (6), ease the tension with (1) (historians seek truth about the determinate past; novelists seek coherence), and support (7) (historians have a duty to avoid teleology that novelists may exploit). However, while this resolves the most *connections*, it does not fix the fatal methodological contradiction between (2) and (3).

  ### Verdict

  Verdict: most severe = 2–3; dissolves = 1–5; cheapest revision = 2; its cost = Qualify 'late source' to exempt stable oral traditions.
