          2.  *Virtù* works on (B) (building dikes) but is helpless against (A).
          3.  There's a tension in Machiavelli: Be adaptable (match the times) vs. Be impetuous (fortune favors the bold).
          4.  If people can't change their nature (which M. suggests), adaptability is impossible.
