      *(Refining the "Slide" argument)*: The Inquisitor argues that because Choice is painful (Burden), we must control Outcome (Desire). But controlling Outcome requires removing Choice. The slide is assuming that the only way to remove the Burden is to control the Desire. One could imagine a community that shares the burden without controlling the desire (Christ's model), or a community that controls desire without claiming to relieve burden (tyranny). The Inquisitor claims benevolence (relief) to mask the tyranny (manufacture).

