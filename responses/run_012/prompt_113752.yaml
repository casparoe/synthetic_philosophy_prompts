  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the seminar context. State the purpose: to interrogate the tension between freedom and happiness using the user's specific distinction. Establish the stakes.

      *   **The Two Goods (Burden vs. Manufacture):**
