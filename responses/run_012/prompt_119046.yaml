  # The Case of the Conical Float Valve

  ## 1. The Setup
  Consider a water tank equipped with an automatic shut-off valve. The valve operates via a vertical float attached to a rigid guide rod. As the water rises, the float rises. When the float reaches a specific height, it triggers a lever that cuts the inflow.

  **The Physical Mechanism:**
  The guide rod slides through a sealing collar. Due to manufacturing tolerances and microscopic debris, the collar exhibits **static friction**. The float will not rise smoothly; it will "stick" until the buoyant force exceeds the sum of the float's weight and the static friction force. Once it breaks free, it snaps to the next sticking point. For the purpose of this device, we model the shut-off as occurring at the *first* major sticking point encountered above the empty state.

  **The Randomness:**
  The device is mass-produced. For any specific unit installed in the field, the precise friction profile of the collar is unknown. However, the workshop specifications guarantee two bounds:
  1.  **Geometric Bound:** The float travels a maximum safe distance $H_{max}$ before hitting a physical stop.
  2.  **Mechanical Bound:** The maximum static friction force the collar can exert is $F_{max}$ (beyond which the seal fails).

  **The Source:**
  The randomness is fully pinned down: it is the **breakaway force** generated by the interaction between the specific guide rod and the specific collar in this unit. We assume the unit is drawn from the population of "working units" where the breakaway point lies somewhere between the empty state ($h=0, F=0$) and the maximum limits ($h=H_{max}, F=F_{max}$).

  **The Question:**
  A safety sensor is placed at height $h = \frac{1}{2}H_{max}$. What is the probability that the water level exceeds this sensor before the valve shuts off?

  ## 2. The Competing Descriptions

  ### Description A: The Geometric Partition (Spatial Ignorance)
  **The Partition:** We divide the range of motion of the float into equal intervals of height $\Delta h$.
  **The Assumption:** In the absence of specific data about where debris or roughness lies on the rod, the location of the sticking point is uniformly distributed over the available travel distance. The "cases" are equal segments of the rod's length.
  **The Defense:** This is the natural description for a technician inspecting the hardware. Wear and debris are spatial phenomena. Without reason to suspect the top of the rod is rougher than the bottom, the Principle of Indifference (PoI) dictates a uniform distribution over position $h$.
  **The Calculation:**
  $$ P(h > H_{max}/2) = \frac{H_{max} - H_{max}/2}{H_{max} - 0} = 0.5 $$

  ### Description B: The Mechanical Partition (Dynamic Ignorance)
  **The Partition:** We divide the range of frictional resistance into equal intervals of force $\Delta F$.
  **The Assumption:** The sticking is caused by the magnitude of the frictional bond. In mechanical engineering, tolerances on friction coefficients and breakaway forces are typically treated as uniform over their specified range when no distributional data is available. The "cases" are equal segments of force.
  **The Defense:** This is the natural description for a physicist or engineer modeling the forces. Friction is a force, not a distance. The physical constraint is on the *strength* of the bond ($F_{max}$). Without reason to suspect weak bonds are more common than strong ones, PoI dictates a uniform distribution over force $F$.
  **The Physics:**
  The float is a **cone** (point down). The volume of displaced water $V$ scales with the cube of the submerged height $h$. Buoyancy $F_b$ is proportional to $V$.
  $$ F_b = k \cdot h^3 $$
  The valve sticks until $F_b = F_{friction}$. Thus, the height at which the valve sticks is determined by $h = (F_{friction} / k)^{1/3}$.
  **The Calculation:**
  If $F$ is uniform on $[0, F_{max}]$, then the probability that the breakaway force exceeds the force required to reach half-height is:
  $$ F_{mid} = k \cdot (H_{max}/2)^3 = \frac{1}{8} k H_{max}^3 = \frac{1}{8} F_{max} $$
  $$ P(F > F_{mid}) = \frac{F_{max} - \frac{1}{8}F_{max}}{F_{max} - 0} = 0.875 $$

  ## 3. The Divergence
  *   **Geometric Answer:** 50%
  *   **Mechanical Answer:** 87.5%

  This difference is massive. In 200 trials, the Geometric model predicts ~100 overflows; the Mechanical model predicts ~175. This is not an artefact of infinitesimal limits; it survives discretisation. If we bin the rod into 10 equal height slots, we get 5 "safe" bins. If we bin the force into 10 equal slots, the non-linear mapping ($h \propto F^{1/3}$) compresses the lower heights into the first force bin, leaving 8 or 9 "overflow" force bins.

  ## 4. Naturalness and the "Method of Selection" Objection
  The standard dismissal of Bertrand-style paradoxes is that the randomizing mechanism was unspecified (e.g., "draw a chord" vs. "spin a pointer"). Here, the mechanism **is** specified: it is static friction on a conical float.

  Why are both descriptions "natural"?
  1.  **Geometric:** If I hand you a rod and ask "where will it stick?", your intuition maps to *location*. Space is the primary manifold of the device.
  2.  **Mechanical:** If I hand you a spring-scale and ask "how strong is the stick?", your intuition maps to *force*. Causality is mediated by force.

  Neither description requires a contrived step. Both variables ($h$ and $F$) are directly measurable physical quantities. Neither is "derived" in a way that makes it obviously secondary; $h$ is the observable outcome, $F$ is the causal driver. To claim one is "really" the random variable is to beg the question.

  ## 5. Independent Considerations
  Is there a symmetry or consistency requirement that selects one answer?

  *   **Symmetry:** The setup is translationally symmetric in force (the friction mechanism doesn't care about the absolute value of force, only the differential). It is also translationally symmetric in height (the rod is uniform). Both symmetries are valid. PoI relies on symmetry of ignorance. We are ignorant of *where* (height) and ignorant of *how strong* (force). The symmetries conflict because the mapping between the variables is non-linear.
  *   **Limiting Frequency:** An actual frequency experiment would vindicate **one** answer (likely the Mechanical one, as friction is fundamentally a force interaction, and material science suggests force distributions are often more fundamental than spatial distributions of defects).
  *   **Invariance:** If we demand the answer be invariant under re-parameterization, PoI fails immediately. If we demand the answer be invariant under the physical transformations that leave the setup unchanged (e.g., changing the fluid density $\rho$), both descriptions transform consistently, but they yield different numbers.

  **Argument for Unavailability:** No independent consideration resolves this *within the logic of PoI*. To choose the Mechanical description, you must import external physical knowledge (that friction is the causal driver). To choose the Geometric description, you must import external pragmatic knowledge (that position is the observable). PoI claims to work *without* such knowledge. Therefore, no internal consideration selects the winner.

  ## 6. Honest Reckoning

  **The Single Feature Doing the Work:**
  The work is done by the **non-linear mapping between two equally fundamental physical parameterizations of the state space.** In the Cube Factory, the ambiguity is often dismissed as "you didn't say how it's made." Here, the "making" is fixed (friction on a cone), but the *description of the ignorance* regarding that fixed mechanism allows two parameterizations (Space vs. Force) that are both physically grounded. The non-linearity ($h \propto F^{1/3}$) ensures the uniform measures do not coincide.

  **What Happens When Removed?**
  If the float were a **cylinder** (volume $\propto h$), then $F \propto h$. The mapping becomes linear. The Geometric and Mechanical partitions become identical. The case collapses into a benign, unique solution. This proves the paradox relies entirely on the non-linearity of the physical law connecting the two natural variables.

  **The Frequency Vindication:**
  An actual experiment would yield a specific frequency (say, 87.5%). This vindicates the *physics*, not the *principle*. It shows that the physical world privileges one measure (likely Force) over the other. But this does not settle the philosophical question. It merely shows that **Nature is not indifferent.** The experiment reveals that the "source of randomness" (material microstructure) has a specific distribution that aligns with one parameterization.

  **The Defender's Reply and the Substantive Content:**
  A defender of PoI must argue: *"You applied Indifference to the wrong variable. You must apply it to the **fundamental** variable."*
  *   **The Attack:** They must claim Force is fundamental, not Height.
  *   **The Cost:** If they claim this, PoI is no longer a logical principle of ignorance. It becomes a principle of **physical modeling**. It requires the agent to know which physical variable is "fundamental" before applying indifference.
  *   **The Consequence:** If PoI requires knowledge of the causal structure to identify the correct parameterization, it loses its status as a tool for *ignorance*. It becomes a tool for *theorizing*. In cases where the causal structure is genuinely unknown (or where, as here, two causal descriptions are equally valid), PoI yields no unique answer.
  *   **Substantive Content:** If the defender retreats to "Apply PoI only to variables that are linearly related to the fundamental cause," the principle retains content only insofar as we can identify fundamental causes. In the Conical Float Valve, if we accept Force is fundamental, PoI works. But the *paradox* remains for the agent who does not know whether Space or Force is fundamental. Thus, PoI cannot guide action under total ignorance; it can only refine knowledge once the physical ontology is settled.

  **Conclusion:** The Conical Float Valve demonstrates that even with a fully specified physical mechanism, the Principle of Indifference is underdetermined by the physics alone. It requires a metaphysical choice of parameterization that the principle itself cannot justify.
