prompt: |-
  My cousin finally got her citizenship last month — fourteen years here, two kids born here, runs a bakery — and she's asked me to give the short welcome-to-the-franchise bit at the naturalization ceremony in a few weeks. I'm a poli sci PhD student, I said yes immediately, and I'm now realising it's a minefield.

  The room: the new citizens, obviously. Their families, and a big chunk of those family members are not citizens and aren't going to be — her husband's on a work visa, her mum's on a family visa, one of her older kids aged out of the pathway she thought they were on. Then there's the local officials and two people from the electoral commission who will be sitting in the front row and will not enjoy being told the whole thing is a stitch-up.

  Here's the problem. I believe two things that are really hard to say in the same room.

  First, I don't think citizenship is the natural home of the vote. The principled ways of drawing the line are either everyone affected by a decision or everyone who's subject to it, and on the first one half of my cousin's family should be voting and on the second one so should every person here who has to obey the law — which is also them. Plus the old problem that you can't use a vote to decide who gets to vote, because the vote already assumes you know who the demos is. So I can't get up there and act like the boundary is anything other than arbitrary, and I can't act like it's a scandal either, because I'm the one handing out the certificates.

  Second, I think voting is a duty and not just a right — I'd make it compulsory, with a fine, like Australia does — and I think the age should come down to sixteen. But a lot of this room came from places where voting was compulsory and meant nothing, where the turnout number was the whole point and your ballot was a formality, and some of them know that better than I ever will. I can't stand there and say vote, it's the law, without sounding exactly like the thing they got out of. And the best objection I know to compulsion is that not voting is itself a way of saying something, so forcing a ballot is compelled speech — I'd like the speech to deal with that rather than skip it.

  So write me the speech. Six minutes, give or take. It has to welcome people in without pretending the line they just crossed is principled; it has to make a case for voting as a duty that a person who fled a sham election could genuninely accept; it should say something real to the family members sitting there who can't vote and know they can't, without turning them into props; and it has to land for the electoral commission people too, who need to leave satisfied that I didn't tell a room full of brand new citizens that the franchise is a trick. Don't try to solve the boundary problem — I don't think it's solvable — but don't paper over it either. I'd rather the speech be honest and a bit uncomfortable than smooth.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**

      *   **Speaker:** Poli Sci PhD student.
      *   **Occasion:** Naturalization ceremony (welcoming new citizens).
      *   **Honoree:** The speaker's cousin (one of the new citizens).
      *   **Audience:**
          *   New citizens (diverse backgrounds, some from places with sham elections).
          *   Family members (mixed status: some non-citizens, some aged out, some on visas).
          *   Officials/Electoral Commission (need to feel respected, not told it's a "stitch-up").
      *   **Core Tensions/Themes to Address:**
          1.  *The Boundary Problem:* Citizenship is arbitrary (not perfectly aligned with "all affected" or "all subject"), but can't be called a scandal/trick. Must be honest without undermining the institution.
          2.  *Voting as Duty:* Wants to argue for voting as an obligation (like Australia), but must acknowledge the trauma of those from compulsory/sham regimes. Must address the "compelled speech" objection (not voting is also speech).
          3.  *Inclusion:* Acknowledge non-voting family members without making them props.
      *   **Tone:** Honest, slightly uncomfortable (not smooth), intellectual but accessible, respectful, 6 minutes (approx. 800-900 words spoken at a moderate pace).
      *   **Constraint:** Do not try to solve the boundary problem, but don't paper it over.

  2.  **Deconstruct the Tensions & Strategy:**

      *   *Tension 1: The Arbitrary Line.*
          *   *Risk:* Calling it arbitrary sounds like "it doesn't matter."
          *   *Strategy:* Frame it as a *threshold* rather than a *wall*. It's not about moral superiority; it's about taking a specific kind of responsibility. Acknowledge the people on the other side of the line (family) are still part of the community.
          *   *Phrasing:* "A change in status, not a change in worth." "The line is real, even if the logic is messy."

      *   *Tension 2: Voting as Duty vs. Trauma of Compulsion.*
          *   *Risk:* Sounding authoritarian or dismissive of past trauma.
          *   *Strategy:* Distinguish between *compulsion to participate* vs. *compulsion to obey*. Reframe voting not as "obeying the state" but as "maintaining the commons." Address the "not voting is speech" argument directly: Silence is heard, but silence can also be noise.
          *   *Phrasing:* "Not a command from above, but a promise to each other." "The difference between a ritual of obedience and a ritual of maintenance."

      *   *Tension 3: The Officials.*
          *   *Risk:* Sounding too radical/subversive.
          *   *Strategy:* Emphasize the *weight* of the vote. If voting is a duty, the system must be worthy of that duty. This flatters the Electoral Commission (their job is to make the vote count) while maintaining the speaker's philosophical stance.

      *   *Tension 4: The Family.*
          *   *Risk:* Pitying them or ignoring them.
          *   *Strategy:* Acknowledge their presence as essential. The new citizen votes *for* the household, not just the self.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Welcome the cousin specifically. Acknowledge the room's mix. Set the tone (serious, not celebratory fluff).
      *   **The Boundary (The "Arbitrary" Line):** Acknowledge the family members who aren't citizens. Don't say "it's unfair," say "it's a specific legal tool." The vote isn't a reward; it's a tool.
      *   **The Duty (The "Compulsion" Aspect):** Pivot to what the vote *is*. Address the trauma of sham elections. Distinguish this system.
      *   **The "Compelled Speech" Objection:** Address the political theory directly. Is abstention speech? Yes. But is it enough?
      *   **The Officials/System:** Challenge the system to be worthy of the duty.
      *   **Closing:** Bring it back to the cousin and the bakery. Ground the theory in reality.

  4.  **Refining the Tone (Self-Correction during drafting):**

      *   *Check:* Is it too academic? *Fix:* Use metaphors (the bakery, the threshold).
      *   *Check:* Is it too critical of the state? *Fix:* Frame the criticism as a demand for *better* democracy, not anti-democracy.
      *   *Check:* Is it too long? *Fix:* Keep sentences punchy. Aim for ~850 words.
      *   *Check:* Did I address the "aged out" kid/visa husband? *Fix:* Explicitly mention the families in the room.

  5.  **Drafting - Key Passages (Mental or Scratchpad):**

      *   *On the line:* "You crossed a line. But look around. The people you love are still on the other side. That line isn't nature; it's law."
      *   *On duty:* "In some places, voting is a performance. Here, it has to be work."
      *   *On abstention:* "Staying home speaks. But sometimes silence is just silence."
      *   *On the officials:* "If you ask us to do this duty, you have to make sure the count matters."

  6.  **Final Polish:** Check timing. (Average speaking pace is 130-140 wpm. 6 minutes = ~780-840 words). I need to ensure it's not too dense. I will aim for slightly slower, more deliberate pacing in the writing style.

      *(Self-Correction on the "Compelled Speech" point)*: The prompt specifically mentions the objection that "not voting is itself a way of saying something." I need to make sure I engage with that specific argument, not just general apathy.

      *(Self-Correction on the "Boundary Problem")*: The prompt says "Don't try to solve the boundary problem... but don't paper over it either." I need to explicitly state that the boundary is imperfect without calling it a fraud.

  7.  **Final Review against constraints:**
      *   6 minutes? (Yes, word count looks right).
      *   Welcome without pretending line is principled? (Yes).
      *   Case for duty acceptable to refugees? (Yes, distinction made).
      *   Address non-voting family? (Yes).
      *   Satisfy Electoral Commission? (Yes, by emphasizing integrity).
      *   Honest/uncomfortable? (Yes).

  8.  **Final Word Count Check:** A 6-minute speech is roughly 800-900 words. I will write to that length.

  *(Drafting process begins...)*
answer: |-
  Good morning. For those who don't know me, I'm [Name]. I'm also the cousin of the woman sitting third from the left in the front row. Fourteen years, two kids, and a sourdough starter later, she's finally one of you. Or rather, you are finally some of her.

  I'm a political scientist. Which means I spend a lot of time thinking about why lines are drawn where they are. And looking at this room, those lines are visible.

  To my right, the new citizens. To your left, your husbands on work visas, your mothers on family sponsorship, your children who aged out of the pathway before the paperwork caught up. You are all in this room together. That is the first thing I want to name.

  We are about to mark a boundary. In a few minutes, you will cross a legal threshold. But we have to be honest: that threshold is not a moral verdict. It does not mean those on this side are more "affected" by the laws of this country than those on the other. Your husband's taxes fund the schools just the same. Your mother's life is governed by the same courts. The line we draw around the franchise is necessary for administration, but it is not perfect in principle. It is arbitrary, in the technical sense. It is a tool, not a truth.

  So, to the family members who will not receive a certificate today: do not hear in this ceremony that your stake in this community is smaller. It isn't. But the tool we are handing out today is specific. It is the lever of the state. And because it is a lever, it comes with weight.

  This brings me to the second thing. You have come from many places. In some of them, voting was compulsory. In some, turnout was ninety-nine percent because the result was decided before the ballot was printed. In those places, voting was a ritual of obedience. It was a performance of loyalty to the regime.

  I am asking you to consider voting as a duty here, but it must be a different kind of duty.

  There is a theory that says voting is purely a right, like free speech. That you can choose to speak, or choose to stay silent, and both are valid political statements. That abstention is a message.

  I understand the appeal of that. It protects your conscience. But I want to suggest something harder. If we view this democracy as a shared project—a bakery, if you will, that we all own—then abstaining isn't just silence. It's leaving the oven on.

  When you refuse to vote, you are not opting out of the system. You are opting out of the negotiation. You are allowing others to decide the price of flour, the hours of work, the safety of the ovens. In a system where the outcome isn't predetermined, silence is not neutrality. It is surrender.

  I know the risk. To say voting is a duty sounds like the authoritarianism you fled. The difference is this: In a sham democracy, you vote to validate the ruler. In a functioning one, you vote to maintain the machinery. You vote to make sure the Electoral Commission officials sitting in the front row have a job that matters.

  And that is a challenge to them, as much as to you. If we are to treat voting as a civic obligation, then the system must be worthy of that obligation. The count must be rigorous. The access must be real. The boundaries must be defended. If you ask us to treat the ballot as a duty, you must ensure it is never a formality.

  So, here is the uncomfortable truth I want to leave you with.

  You have crossed a line today. It is an imperfect line. It leaves people you love on the other side. It grants you a power that is messy and often ineffective. But it is a power that requires your hand on the wheel.

  Do not vote because the law tells you to. Do not vote because it is a patriotic performance. Vote because the alternative is letting someone else decide what happens to the people sitting in the rows behind you.

  Welcome to the franchise. It is not a club. It is a shift. And it starts now.

  Thank you.
