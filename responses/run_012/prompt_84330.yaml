  2.  **Analyze the User's Ethical Outlook:**
      *   **Core Framework:** Virtue Ethics (character matters most, not consequences or rules).
      *   **Claim 1:** Character traits are real and robust (honesty predicts behavior across situations).
      *   **Claim 2:** Situationist research is convincing (situational factors shift behavior greatly, cross-situational consistency is weak).
      *   **Claim 3:** Hiring practice weights character above skill (character cannot be taught, skills can).
      *   **Claim 4:** People do change (moral improvement is real).
      *   **Claim 5:** Explanation of colleague's failure: "It was not the real him, the situation got to him."
      *   **Claim 6:** New thought: The unit of moral assessment might be the *life/environment arranged*, not the person (building an environment where bad situations don't arise).

  3.  **Identify Tensions/Contradictions:**
      *   **Tension A (The Big One):** Claim 1 (Traits are robust) vs. Claim 2 (Situationism is convincing). Situationism directly attacks the existence of robust global character traits. If situationism is true, virtue ethics (as traditionally understood with robust traits) is undermined.
      *   **Tension B:** Claim 3 (Character cannot be taught) vs. Claim 4 (People do change/improve). If character can change/improve, can it not be taught or cultivated? If it cannot be taught, how does improvement happen?
      *   **Tension C:** Claim 1/5 (Character is real/colleague was good) vs. Claim 2/5 (Situation got to him). If the situation got to him, does he really have the robust trait? The user tries to save the trait by saying "it wasn't the real him," but situationism suggests there is no "real him" independent of the situation.
      *   **Tension D:** Claim 1 (Assess the person/character) vs. Claim 6 (Assess the life/environment). This looks like a shift in the *locus* of virtue. Is virtue internal or external/structural?

  4.  **Rank Tensions by Severity:**
      *   **Severity 1 (Critical):** Robust Traits (Claim 1) vs. Situationism (Claim 2). This is the foundational contradiction. You can't hold both fully. Situationism says traits aren't robust; Virtue Ethics usually requires them to be.
      *   **Severity 2 (High):** Character cannot be taught (Claim 3) vs. People change (Claim 4). If character is fixed (unchangeable/unteachable), improvement is impossible. If improvement is possible, it implies malleability teachability/cultivability.
      *   **Severity 3 (Moderate/Resolvable):** Assessing the Person vs. Assessing the Environment (Claim 1 vs. Claim 6). This looks more like an evolution or refinement of virtue ethics (situationist virtue ethics) rather than a hard contradiction, but it conflicts with the traditional "internal state" view.
      *   **Apparent Conflict:** The colleague explanation (Claim 5) tries to bridge Claim 1 and Claim 2 but fails logically if Situationism is true. It's a symptom of the main tension.

  5.  **Drafting the Audit (incorporating constraints):**
      *   *Tone:* Direct, analytical, letter-like.
