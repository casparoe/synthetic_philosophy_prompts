      *Drafting thought:* Start by validating the clarity of the thought, then move immediately to the friction points. The biggest friction is between the belief in robust traits and the belief in situationism. These are mutually exclusive in their strong forms. If situationism is true, traits are not robust predictors across situations. If traits are robust, situationism is overstated. You cannot have both. This undermines the hiring rationale. If traits aren't robust, hiring for character is less reliable than you think.
      Next, the teachability issue. If character cannot be taught, how does moral improvement happen? Improvement implies change, change implies malleability. If it's malleable, it can be influenced/taught.
      The environment idea is actually the bridge. It resolves the situationist critique.
      The single revision: Abandon the claim that traits are robust predictors across situations. Replace it with the idea that virtue is the management of situations.
      The cost: You lose the certainty that you know someone's "true self." You admit your read on the colleague might have been incomplete not because the situation hid him, but because character is situational.

      *Wait, one more check:* The prompt asks to "Rank the tensions by severity rather than treating them as equally bad." I need to make sure the ranking is explicit in the prose without using a list. I can use phrases like "The most severe fracture..." and "A secondary but significant tension..."

