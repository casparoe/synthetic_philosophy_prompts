answer: |-
  ### Preliminary Claims
  To ensure the poem adheres to the *Letter to d'Alembert* rather than a generic anti-theatrical prejudice, I must anchor the verse in four specific theoretical claims:
  1.  **The Principle of Pleasure:** The theatre's primary aim is to please, so it inevitably flatters the audience's existing prejudices rather than correcting them (making vice agreeable and virtue boring).
  2.  **The Actor's Alienation:** The objection is not to the person but the trade; the actor's art is counterfeiting feelings they do not possess, creating a separation between being and appearing.
  3.  **Passivity vs. Participation:** The playhouse creates isolated spectators in the dark; the republican *fête* creates active participants in the light, where there is no audience left over.
  4.  **Local Context:** The argument is specific to Geneva's small, austere mores, not a universal abolition of art (Paris may keep its stages).

  ### Drafting and Revision
  *Drafting Thought:* My first impulse was to make the poem a harsh condemnation. I need to soften this to match Rousseau's "warm, declamatory" voice. He loves Geneva; he is warning them, not just scolding. I also need to ensure the second movement (the canon) works technically. The lines must be ambiguous enough to shift meaning between "watching" and "being watched."
  *Revision:* In the first draft of the canon, I had the line "We watch the show." This is too explicit. It needs to be "Every eye is mine," which can mean "I possess the gaze" (active) or "The gaze belongs to me" (passive/objectified). I will also ensure the line count stays strictly between 20 and 26 verses.

  ***

  ### Letter to Geneva (A Round in Two Movements)

  You want a mirror that only flatters, Genevans,
  Where the clever villain wins the pit's applause
  And the honest man appears a bore who deserves his loss.
  I, who write this, perform even my refusal;
  But the actor's trade is to feel nothing and show all,
  To sell you tears he borrowed from a script.
  In Paris, let them sit dark and alone in their boxes;
  Here, our walls are too small for such lies.

  (Please rise and turn to face one another.)

