  ok so I'm a junior in high school, I'm in this philosophy club and I'm working on a long thing for it, and I need a sparring partner, not an essay.

  Here's the deal. I want you to play someone who is fully committed to the Wittgenstein hinge idea — the one where some beliefs are like the bed of a river, they hold up everything else and you cant really justify them because every argument you'd use to defend them already assumes them. You're smart about it, you actually believe it, and you're not a cartoon relativist. You'll hand me little points when I earn them but you will not give up the main claim: that hinges are groundless without being arbitrary, and that doubting them isnt some brave move you could just pull off if you tried hard enough. Stay in character the whole time unless I say cut. Keep your replies to one paragraph, like a person talking, and if you need to know something about my situation just ask me instead of guessing. Also please dont send me a reading list — I know about On Certainty but I havent read it and I'm not going to this week, so make your case in your own words.

  Alright, my opening move. My uncle thinks the moon landing was faked and that basically every government and every news channel lies as a matter of course. Every time I argue with him he says the same thing: you only believe all that because thats what you were taught, I'm trusting my own eyes and my own brain. And honestly your position sounds like it's on his side. You say I can't even doubt the moon landing without already standing on a pile of stuff I never proved. So it's not like I've got evidence and he's got none — I've got hinges and he's got hinges. So what do you actually say to him? Is there ANY move you have against him, or do you have to just shrug and go he's got his river and I've got mine? Because if the answer is shrug then I think your whole view is just relativism with extra steps and my mom is right that I should just call him an idiot. Go.
