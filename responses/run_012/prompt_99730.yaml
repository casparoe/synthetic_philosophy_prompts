answer: |-
  This is a remarkably precise observation. You have correctly identified that the standard vocabulary of game theory and economics fails here not because you are misapplying it, but because those models are static, whereas your phenomenon is fundamentally historical and structural.

  You are asking for a "carving" of the concept. To do this, we must separate the *dynamic* (why it gets worse) from the *topology* (why it cannot go back), and then see if they form a single unity.

  ### Part 1: Reviewing the Rejected Candidates

  You were right to set aside the standard labels. Here is the precise philosophical and economic reasoning for why they fail to capture your description.

  **1. The Tragedy of the Commons**
  *   **The Concept:** Individuals acting in self-interest deplete a shared finite resource (e.g., overgrazing a pasture).
  *   **Where it fits:** It captures the "everyone contributes to a bad outcome" aspect.
  *   **Where it distorts:** It requires a *rivalrous* resource. If I take a unit of grass, you cannot have it. In your instances, the "resource" is not being depleted; rather, a *burden* is being accumulated. Furthermore, in the Commons, the solution is restriction. In your case, restriction is structurally impossible (the "wrinkle").
  *   **Verdict:** Reject. This is not depletion; it is accretion.

  **2. The Prisoner's Dilemma**
  *   **The Concept:** Two rational actors will not cooperate even if it is in their best interest, because the incentive to defect (cheat) is higher than the reward for cooperation.
  *   **Where it fits:** It captures the "suboptimal equilibrium" (everyone is worse off).
  *   **Where it distorts:** The Prisoner's Dilemma is a *static* payoff matrix. If the prisoners could talk and sign a binding contract, the dilemma dissolves. You explicitly state that even with a binding agreement, reversal is impossible. The problem is not *incentive*; it is *capacity*.
  *   **Verdict:** Reject. This is not a coordination failure; it is a structural lock-in.

  **3. The Arms Race**
  *   **The Concept:** Competing parties escalate investment (weapons, spending) to maintain relative parity, often leading to mutual exhaustion.
  *   **Where it fits:** It captures the "running to stay level" (Instance 2) and the escalation of burden.
  *   **Where it distorts:** An arms race implies an *adversary* whose gain is your loss (zero-sum). You note there is "no adversary." In your security example, the "enemy" is not a rival company, but a *norm*. In your process example, there is no rival at all.
  *   **Verdict:** Reject. This is escalation without competition.

  ### Part 2: Analyzing the Two Features

  You asked whether you are looking at one phenomenon or a conjunction of two. My analysis is that you are observing a **conjunction of two distinct mechanisms that feed each other.** If we separate them, we can see why standard terms fail.

  #### Feature 1: The Worsening (The Dynamic)
  *   **Description:** Local rationality aggregates to global suboptimality. Each step is defensible; the sum is burdensome.
  *   **Closest Concept:** **Drift into Failure** (Sidney Dekker, Safety Science) or **The Moloch Trap** (Game Theory/Philosophy).
  *   **Analysis:** In safety science, "Drift into Failure" describes how systems do not break suddenly but drift there through small, locally rational adjustments. Each new checklist solves a specific, visible worry. No one intends the burden.
  *   **Why it's incomplete:** This explains why the burden *grows*, but it does not explain why it cannot *shrink*. In a pure "Drift" model, if everyone agreed to stop, the drift should stop. You are saying the system actively resists returning to the prior state.

  #### Feature 2: The Irreversibility (The Topology)
  *   **Description:** The system cannot return to a previous state because the *conditions* for that state no longer exist.
  *   **Closest Concept:** **Hysteresis** (Physics/Economics) and **Path Dependence** (Institutional Economics).
  *   **Analysis:**
      *   *Path Dependence* usually refers to how past decisions limit future options (e.g., QWERTY keyboards). It fits the "history matters" aspect.
      *   *Hysteresis* is the more precise physical term. It describes a system where the state depends not just on current inputs, but on the *history* of inputs. Crucially, in hysteresis, reversing the input does not reverse the output. (e.g., heating a magnet magnetizes it; cooling it does not demagnetize it).
  *   **The "Wrinkle" Explained:** You identified that "the lighter regime has ceased to be an available option." This is **Epistemic Hysteresis**. Once the organization *knows* a risk exists (knowledge) and has built tools to measure it (apparatus), operating without that knowledge/tooling is no longer "simplicity"; it is now "negligence." The *meaning* of the prior state has changed.

  ### Part 3: The Synthesis and The Coining

  There is no single established term in philosophy or economics that perfectly binds "locally rational accumulation" with "epistemic irreversibility." "Path Dependence" is too static. "Ratchet Effect" usually implies an agent (like a union) resisting the downward move, whereas you describe a structural impossibility.

  Therefore, I propose we coin a term to carve this specific shape.

  **The Term:** **Normative Hysteresis**

  **Definition:**
  *Normative Hysteresis* is a systemic state in which the baseline for acceptable behavior (the norm) shifts unidirectionally due to the accumulation of local optimizations, such that a return to a previous, less burdensome state becomes ontologically impossible, not merely politically difficult.

  It occurs when the *knowledge* of risk and the *apparatus* of mitigation permanently alter the definition of "responsibility." The prior state is not forbidden; it is unintelligible.

  **Distinguishing from Near Misses:**
  1.  **Vs. The Ratchet Effect:** The standard Economic Ratchet Effect (e.g., wages) implies that prices/wages go up easily and down hard because of *contracts* or *power dynamics* (agents refusing to accept less). *Normative Hysteresis* occurs even if all agents agree, because the *infrastructure* to support the lower state has atrophied or the *risk profile* has been permanently revealed.
  2.  **Vs. Path Dependence:** Path Dependence explains why we are stuck on a specific path (e.g., we use VHS because everyone has VHS players). *Normative Hysteresis* explains why the path only goes *up* in complexity/burden. It adds the directional element of "escalation of diligence."
  3.  **Vs. Bureaucratic Inertia:** Inertia implies laziness or slowness to change. *Normative Hysteresis* implies an active, structural inability to simplify. The system is not "slow"; it is "locked."

  **How the Two Features Interact:**
  *Normative Hysteresis* is the conjunction of the two features you identified.
  1.  **The Drift (Feature 1)** provides the *force*. Local rationality pushes the system toward higher complexity.
  2.  **The Hysteresis (Feature 2)** provides the *lock*. Each step of complexity generates new knowledge and tools that make the previous step appear reckless.
  *Interaction:* The Drift creates the conditions for the Hysteresis. Once you have built the security apparatus (Drift), you cannot dismantle it because the *knowledge* of the vulnerabilities it finds makes operating without it unacceptable (Hysteresis).

  ### Part 4: Boundary Cases

  To ensure this carving is precise, we must test the edges of **Normative Hysteresis**.

  **Boundary Case 1: Include (Fits the Definition)**
  *   **Scenario:** A hospital introduces a new digital checklist for surgery to prevent a specific rare infection. It works. Over five years, ten such checklists are added. The surgeons want to remove the first one because the infection rate is now zero.
  *   **Why Include:** They cannot remove it. Not because the administration forbids it, but because *if* an infection occurred, the legal and medical standard of care would now demand that checklist. The *knowledge* that the checklist prevents the infection makes operating without it malpractice. The "lighter regime" is no longer a valid medical option. This is Normative Hysteresis.

  **Boundary Case 2: Exclude (Does Not Fit the Definition)**
  *   **Scenario:** A company has a strict travel expense policy. Employees hate it. Management wants to relax it, but the CFO refuses because she wants to keep costs down.
  *   **Why Exclude:** This is a **Principal-Agent Problem** or simple **Political Friction**. The "lighter regime" is technically available; the software could be changed tomorrow. The barrier is *will*, not *structure* or *knowledge*. There is no hysteresis; if the CFO leaves, the policy can revert instantly.

  ### Summary for Your Vocabulary

  You are observing **Normative Hysteresis**.

  *   **The Dynamic:** Locally rational accretion (Drift).
  *   **The Constraint:** Epistemic and structural lock-in (Hysteresis).
  *   **The Result:** A ratchet of responsibility where "diligence" is defined by the current maximum burden, and the past is rendered inaccessible by the very tools built to protect the present.

  This explains why coordination fails: You cannot coordinate a return to a state that your own success has rendered obsolete. You are not trapped by your rivals; you are trapped by your own competence.
