answer: |-
  **The Measure of Walls**

  The dust in the Boundary Court smelled of old parchment and brass polish. Elara, a junior clerk with ink-stained cuffs, traced the finger of her glove along the Charter of Chordial. *Article VII: When the wall divides us, let the Line of Indifference decide.*

  For seventy years, the Court had obeyed. When the Fisherman's Quarter disputed the Salt Tax, a chord was drawn. When the Hill Lords claimed the reservoir, a chord was drawn. The city was a perfect circle, bounded by the White Ring, and the law demanded that no possible dividing line be favored over another.

  But Elara had found the discrepancy in the night logs.

  In the Year of the Flood, Clerk Harrow had settled the Western Dock dispute using the *Two Pins*: two brass markers tossed onto the rim, connected by a taut string. In the Year of the Drought, Clerk Vane had settled the Eastern Orchard dispute using the *Radial Ruler*: a spin of the compass for angle, a blind draw from a bag for distance from the center.

  They produced different cities.

  Today, the North Farming District stood on the brink of secession. The Magistrate, a stern man named Vane (the same clerk, now elevated), prepared to draw the line that would either sever the Granary from the market or leave it whole. The North wanted the *Two Pins*. The Center wanted the *Radial Ruler*. Both claimed the Charter mandated "Indifference."

  "Proceed," Magistrate Vane commanded. The bailiff reached for the pins.

  "Stop," Elara said. Her voice cracked, but the room went silent. She stepped forward, holding two maps. "If you throw the pins, the line likely passes near the rim. If you use the ruler, the line likely passes near the center. The Granary is here." She pointed to the northern slice. "One method saves it. The other cuts it off."

  "This is procedure, girl," Vane snapped. "The Charter says Indifference."

  "Indifference is not a tool," Elara said, turning to the gallery. Old Thorne, the City Mapmaker, stood there. He stepped forward, unrolling a blueprint.

  "The wall has gates," Thorne rumbled. "Eight of them. If you throw pins, men aim for gates. If you spin a compass, the pivot wears loose. There is no perfect random in stone and wood. The Charter asks for a ghost."

  Elara looked at the three boxes on the judge's bench. The Pins. The Ruler. A third box, containing a weighted dart for the *Midpoint Method*, rarely used. "We thought we were finding the truth," Elara said, her hand hovering over the boxes. "But we are choosing the truth by choosing the box. The Charter doesn't say *how* to be indifferent. It assumes indifference is a single thing."

  Vane paused, his hand on the pins. The silence stretched, heavy as the wall outside. If he chose the pins, the North might riot. If he chose the ruler, the Center might claim fraud. The math was invisible, but the consequence was blood.

  "Then the Charter is flawed," Vane whispered, too low for the gallery to hear.

  "Or," Elara said, meeting his eyes, "we admit that justice requires a choice, not a chance."

  Vane withdrew his hand. He did not draw the line that day. Instead, he ordered the Charter amended. The city remained circular, but the illusion of its perfect fairness fractured. Elara returned to her desk, knowing that some boundaries cannot be drawn by geometry, only by agreement. The crisis passed, but the uncertainty remained, humming beneath the floorboards like a loose string.

  ***

  **Author's Note on Conceptual Liberties**

  This story dramatizes Bertrand's Paradox, treating the "Principle of Indifference" as a legal statute rather than a logical principle. The primary liberty taken is implying that the physical imperfections (gates, worn pivots) are the source of the paradox. In reality, the paradox arises even in perfect mathematical abstraction due to parameterization invariance; the physical bias merely compounds the philosophical ambiguity.

  I am reasonably confident in the claim that the Principle of Indifference is underdetermined without a specified measure space. However, I am least sure about the implication that admitting this ambiguity resolves the civic crisis. In philosophy of probability, some (like E.T. Jaynes) argue that symmetry principles *can* uniquely determine the correct measure (favoring the radial method). By presenting the ambiguity as insoluble, the story leans toward a subjectivist or frequentist interpretation over an objective Bayesian one. The claim that "justice requires a choice" sidesteps the possibility that a unique rational solution exists, which remains a contested point in foundational probability.
