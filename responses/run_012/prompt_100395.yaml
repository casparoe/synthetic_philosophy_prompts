          *   This suggests unity is a matter of *degree* of functional integration, not a binary switch.
      *   *Section 3: The Core Unity Mechanism.*
          *   What binds it? *Stigmergic Lock-in.*
          *   The "One Mind" claim stands only if the colony exhibits *goal-directed plasticity* that cannot be localized to any subset.
          *   The "Self" is the homeostatic set-point.
      *   *Conclusion:* Summarize the tension. It's not a "thing" mind, it's a "field" mind.

  7.  **Review against Constraints:**
