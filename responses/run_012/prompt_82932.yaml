answer: |-
  **Persistence Mutual | Policyholder Services FAQ**
  **Subject: Continuity of State Coverage**

  **1. What is the Declared Persistence Schedule (DPS)?**
  The Declared Persistence Schedule is the foundational document of your household policy. To maintain coverage, the Policyholder must enumerate all facts about their environment that are expected to remain true following any action taken within the insured premises. This includes spatial relationships, object integrity, and status conditions. For example, if you pour coffee into a mug, the DPS must explicitly state that the table beneath the mug remains solid, the room temperature remains constant, and the mug does not teleport. Failure to list a persistent fact voids coverage for any disruption to that fact. As noted in Internal Memo 88-B, "Reality is not assumed; it is scheduled."

  **2. How are coverage tiers structured?**
  Persistence Mutual offers three distinct tiers to address ontological drift. 

  *   **Tier 1 (Static Invariance):** Covers the basic Frame condition. This ensures that objects not acted upon remain unchanged. Premiums are calculated at $0.04 per persistent fluent per month. A standard three-bedroom household typically carries 15,000 active fluents.
  *   **Tier 2 (Precondition Assurance):** Addresses the Qualification problem. This rider covers failures caused by unlisted exceptions (e.g., turning a key fails because the lock was jammed). The Policyholder is responsible for listing all potential impediments to any action. If an impediment is not listed in the Precondition Addendum, the failure is deemed a policy violation.
  *   **Tier 3 (Consequence Propagation):** Addresses the Ramification problem. This covers indirect effects of actions (e.g., opening a window lowers the room temperature). Policyholders must map all causal chains resulting from an action. Unmapped consequences are considered negligence.

  **3. What is a typical claims scenario?**
  Consider Policyholder #4920. The insured moved a chair from the living room to the dining room. During the move, the chair scratched the floor. The claim was denied because the DPS listed the chair's location as changing, but did not explicitly list the floor's scratch-resistance as a persistent fluent during the interval of movement. Furthermore, the Tier 2 rider was voided because the Policyholder failed to list "friction between chair legs and hardwood" as a precondition requiring management. The burden of proof rests on the Policyholder to demonstrate that all unaffected states were declared unaffected prior to the action.

  **4. Are there exemptions for inactive objects?**
  Yes, under the Latent State Exemption. Objects that are not directly manipulated and have no causal link to the action may be omitted from the DPS, provided they remain entirely passive. However, "passive" is strictly defined. If moving a vase alters the light distribution in the room, the lighting conditions are no longer passive. The Exemption does not apply to any fluent that could theoretically change. As our Underwriting Guidelines state: "If a dog is sleeping, it is only covered if you have declared it will continue sleeping."

  **5. How do I update my schedule?**
  Updates must be filed prior to action. Real-time amendment is not permitted. If you anticipate performing an action not covered by your current DPS, you must submit a Form 12-Δ at least 24 hours in advance. For complex actions involving multiple objects, we recommend purchasing a Bulk Fluents Package. Please note that omission is not grounds for appeal. Persistence Mutual insures only the world you have specified.
