  7.  **Final Polish:** Ensure clear headings and precise philosophical terminology (Locke, Hegel, Bentham, Merton). (Self-correction: Keep it grounded in the legal practices as requested).

  8.  *(Final thought before generating)*: The prompt asks to reconstruct the theory *these practices presuppose*. This implies looking for the implicit ontology. The ontology is: **Information is free, Embodiment is property, but Human Intervention can transform Information into Embodiment.** The DNA case breaks this because isolation looks like intervention but the court said it wasn't enough.

