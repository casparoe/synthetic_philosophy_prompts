answer: |-
  It is a pleasure to engage with a question posed from the vantage point of someone who has lived the practice of science and now examines its normative boundaries. Your observation is astute: the three regimes you describe—scientific norms, patent law, and copyright law—do not merely apply different rules to the same objects; they operate on distinct, and often conflicting, ontological theories about what an "idea" is and how it relates to the human agent.

  There is no single, unified theory of intellectual property (IP) that seamlessly explains all three practices. Instead, the law operates on a **hybrid ontology** that attempts to balance competing moral intuitions. To reconstruct the theory these practices *presuppose* (as opposed to the theories lawyers use to *justify* them), we must look at the metaphysical distinctions they enforce.

  ### 1. The Ontological Gradient: What the Practices Presuppose

  If we map your three observations onto a spectrum of "human intervention," a coherent, albeit fragile, structure emerges. The practices presuppose a graded view of reality:

  1.  **The Realm of Nature/Truth (Science Norms & Copyright):** Here, ideas, facts, and natural phenomena are treated as *pre-existing*. They are discovered, not made. Because no human labor created them, no human can own them. In science, this is the Mertonian norm of "Communism" (common ownership). In copyright, this is the **Idea/Expression Dichotomy**: you cannot own the fact that $E=mc^2$ or the plot concept of "boy meets girl," only your specific text describing them.
  2.  **The Realm of Personality (Copyright):** When an idea is fixed in a specific form (text, code, diagram), it bears the imprint of the author's personality. Ownership here is justified not by the utility of the idea, but by the **integrity of the expression**.
  3.  **The Realm of Artifice (Patent Law):** This is the most contentious zone. Patent law presupposes that human intervention can fundamentally alter the moral status of a natural substance. It requires a belief in a **metaphysical transformation**: that by isolating, purifying, or applying a natural principle, the inventor has created something *new* that did not exist in nature in that specific form.

  **For patent practice to be coherent, one must believe:**
  *   **Discovery and Invention differ in kind:** It is not merely a matter of degree. There must be a bright line where "finding" becomes "making."
  *   **Labor is not enough:** Unlike a Lockean view where mixing labor with soil creates property, patent law requires that the labor produce something "non-obvious." Hard work on an obvious solution grants no ownership.
  *   **Utility requires exclusivity:** One must believe that without the temporary monopoly, the specific application of the idea (the drug, the machine) would not be brought to market, even if the underlying idea (the scientific principle) is known.

  ### 2. Rival Theories and the Contradiction

  The three practices quietly rule out several rival theories of ownership:

  *   **Radical Lockeanism:** If property were strictly grounded in labor, a scientist who spends ten years sequencing a gene should own it. Patent law rejects this via the "non-obviousness" requirement; Copyright rejects this via the "idea/expression" split (you can't copyright a fact you worked hard to find).
  *   **Absolute Idealism:** If ideas were purely mental creations of the self (a Hegelian view), the scientist should own the hypothesis itself. Scientific norms and Copyright both reject this, treating ideas as public goods once released.
  *   **Pure Utilitarianism:** If the only goal were social welfare, we might not grant patents on life-saving drugs if the monopoly price prevents access. The fact that we grant them anyway suggests a deontological constraint (the inventor *deserves* rights) is at play, not just incentive calculus.

  **The Contradiction: The Case of Isolated DNA**
  You asked if the contrast between patenting isolated DNA and refusing to copyright an idea reveals a genuine contradiction. **Yes, it does.**

  This was the central tension in *Association for Molecular Pathology v. Myriad Genetics* (2013). For years, the Patent Office operated on the theory that "isolating" a DNA sequence severed it from nature, making it a human invention. This presupposed that **physical separation constitutes metaphysical creation.**

  However, the Supreme Court ultimately ruled that isolated genomic DNA is *not* patentable because the information encoded is a product of nature. Yet, they ruled that **cDNA** (synthetic DNA) *is* patentable.
  *   **The Contradiction:** From a molecular biology perspective (your field), the distinction is technical, not ontological. Both involve human intervention to isolate or synthesize. If the "idea" (the genetic code) cannot be owned (Copyright/Science norm), why does the "container" (the isolated molecule) become ownable (Patent norm) simply because it is outside the cell?
  *   **The Fracture:** This reveals that Patent Law is trying to have it both ways. It wants to incentivize the *discovery* of natural sequences (by allowing patents on them) while maintaining the philosophical stance that it only incentivizes *inventions*. The practice of patenting isolated DNA presupposes that **information becomes property when it becomes useful**, whereas Copyright and Scientific Norms presuppose that **information remains free regardless of utility.**

  ### 3. Presupposition vs. "Fits Well"

  It is vital to distinguish what these practices *strictly require* to function versus what theories are merely used to explain them.

  *   **Lockean Labor Theory:** This **fits well** with the rhetoric of IP ("fruit of one's labor"), but it is **not presupposed**. If it were, obvious inventions would be patentable, and discovered facts would be copyrightable. They are not.
  *   **Hegelian Personality Theory:** This **fits well** with Copyright (protecting the author's voice), but is **not presupposed** by Patent law. A corporation, which has no "personality" in the human sense, can hold patents.
  *   **Utilitarian Incentive Theory:** This is the **legal bedrock** (e.g., the U.S. Constitution's "Progress Clause"), but strictly speaking, the *practices* presuppose more. They presuppose **moral boundaries** that utilitarianism cannot explain. A pure utilitarian might support perpetual copyright if data showed it increased production. The law forbids this on principle (time limits). Thus, the practices presuppose **natural rights constraints** on utilitarian goals.

  ### 4. Counterfactuals: Changing the Implicit Theory

  If we were to replace the current hybrid theory with a consistent alternative, the practices would change drastically.

  **Scenario A: Thoroughgoing Utilitarian Incentive View**
  *   **Theory:** IP rights exist *only* if they empirically maximize net social welfare. There are no moral rights to ideas.
  *   **Changes to Patent:** We would see "context-dependent" patenting. If a gene sequence is essential for follow-on research (as in your field), patents would be denied or heavily licensed, regardless of the inventor's investment. We might see "prize systems" replace patents for basic research tools, as prizes decouple reward from monopoly pricing.
  *   **Changes to Copyright:** Terms would be dynamic. If data showed that 10 years of protection maximized book production better than 70 years, the term would shrink. Fair use would expand wherever the monopoly hindered greater utility (e.g., text mining for AI).
  *   **Changes to Science:** Citation norms might be legally enforced if failing to cite reduced the efficiency of the knowledge network.

  **Scenario B: The "No Ownership of Ideas" View (Radical Commons)**
  *   **Theory:** Ideas, sequences, and expressions are non-rivalrous public goods. Ownership is morally incoherent because using an idea does not deprive another of it.
  *   **Changes to Patent:** Abolished. Innovation would be driven by first-mover advantage, trade secrets, and patronage. In biotech, this would mean open-source biology. The "isolated DNA" debate vanishes because nothing is patentable.
  *   **Changes to Copyright:** Abolished or reduced to "attribution rights" (moral rights) without economic exclusion. You could copy my text, but you must say it is mine.
  *   **Changes to Science:** Scientific norms would become legal norms. "Theft" of an idea would be fraud (lying about authorship), not property violation. The primary currency would remain reputation, not licensing revenue.

  ### Conclusion

  The puzzle you have encountered arises because the law is trying to map property concepts (which evolved for land and chairs) onto non-rivalrous information.
  *   **Science** treats information as **light**: shining your lantern on it doesn't make it yours.
  *   **Copyright** treats information as **speech**: you own your voice, but not the language.
  *   **Patent** treats information as **land**: if you fence it and farm it, it is yours.

  The practice of patenting isolated DNA attempts to treat light as land. This is why it feels incoherent to a scientist. The current system presupposes that **human utility can transmute nature into property**, but it lacks a consistent metaphysical account of when that transmutation occurs. Until the law decides whether a gene sequence is a discovery (fact) or an invention (tool), the contradiction you have identified will remain the central fracture in the philosophy of intellectual property.
