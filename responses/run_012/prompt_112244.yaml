      *   *Did I distinguish presupposition from fit?* This is crucial. Lockean theory *fits* the rhetoric but isn't strictly *presupposed* (since labor alone isn't enough). Utilitarianism is the legal bedrock, but the *practice* presupposes moral boundaries.
