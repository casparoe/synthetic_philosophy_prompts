answer: |-
  This is a sharp observation. You have identified two distinct deviations from classical economic theory, and you are right to suspect they are not the same thing, though they are cousins. Classical economics (Expected Utility Theory) assumes people act like calculators: Probability × Value = Decision. Your characters act like humans.

  Here is the carving you are looking for, broken down by the two phenomena you described.

  ### 1. The Bending of Probabilities
  **The Name:** **Probability Weighting** (specifically, the **Possibility Effect**).
  **The Framework:** **Prospect Theory** (Kahneman & Tversky).

  In classical theory, a 1% chance is weighted as 0.01. In human psychology, a 1% chance is rarely weighted as 0.01.
  *   **The Possibility Effect:** We overweight small probabilities. Moving from 0% to 1% feels massive (the "possibility" of the event exists now). Moving from 99% to 100% also feels massive (certainty). The middle is where we are numb.
  *   **The Fourfold Pattern:** This explains your brother and sister. Prospect Theory identifies that people are:
      1.  Risk-averse regarding gains of moderate/high probability.
      2.  Risk-seeking regarding gains of low probability (your brother buying lottery tickets; he overweights the tiny chance of winning).
      3.  Risk-seeking regarding losses of moderate/high probability (gambling to get out of a hole).
      4.  **Risk-averse regarding losses of low probability** (your sister). She overweights the tiny chance of losing the house.

  **The "Worst Item" Nuance:**
  You noted she doesn't inflate *all* small probabilities, only the one attached to the "worst item on the table." This is a specific refinement often called **Rank-Dependent Utility** or, more colloquially in risk management, **Tail Risk Aversion**.

  In Rank-Dependent Utility, the weight you give a probability depends on the *rank* of the outcome. A 1% chance of a mild annoyance is ignored. A 1% chance of "ruin" is magnified.

  **Is it a mistake?**
  Mathematically, yes. If you run the simulation a million times, your sister loses money compared to a calculator.
  Evolutionarily, **no.** This is a survival heuristic. In the real world, "ruin" is non-linear. If you lose the house, you don't get to play the game again. This is what Nassim Taleb calls an **Absorbing Barrier**. Once you hit the bottom, expected value no longer matters because you are out of the system. Your sister isn't making a math error; she is pricing in **survival**. She is treating the "worst item" not as a variable, but as a constraint.

  **For your novel:**
  Don't call her "risk-averse." That implies she dislikes all volatility. Call her **catastrophe-sensitive**. She doesn't mind the coin flip for a raise; she minds the *floor* dropping out. Her internal logic is: *"I can survive being wrong about the gain. I cannot survive being wrong about the ruin."*

  ### 2. The Fear of Unknown Odds
  **The Name:** **Ambiguity Aversion**.
  **The Phenomenon:** **The Ellsberg Paradox**.
  **The Distinction:** **Knightian Uncertainty**.

  This is the second thing you noticed, and it is distinct from Probability Weighting.
  *   **Risk:** The odds are known (a 20% chance).
  *   **Uncertainty (Ambiguity):** The odds are unknown (between 10% and 40%).

  In the 1960s, economist Daniel Ellsberg proved that people prefer a known risk to an unknown uncertainty, even if the unknown uncertainty might mathematically be better. If you offer me a bet on a red ball from a jar known to have 50 red and 50 black balls, I'll take it. If you offer me a bet on a red ball from a jar with 100 balls of *unknown* ratio, I will freeze.

  The number isn't worse. The **information gap** is the cost.

  **Is it a mistake?**
  Again, mathematically, yes. If the range is 10–40%, the midpoint is 25%, which is often acceptable.
  Psychologically/Evolutionarily, **no.** In nature, unknown probabilities usually signal a predator or a trap. A rustle in the grass with a "unknown chance of being a lion" warrants freezing. A rustle with a "known 20% chance of being a lion" warrants calculation. Ambiguity aversion is an information-gathering heuristic. It says: *"Do not act until the map is drawn."*

  **For your novel:**
  This character isn't "cautious." They are **information-hungry**. They don't fear the loss; they fear the *blindness*. When the odds are unknown, they feel a loss of agency.

  ### The Synthesis: How they relate
  You asked if they are the same thing. They are not, but they are both **deviations from Expected Utility Theory** driven by **protective heuristics.**

  1.  **Probability Weighting (Sister):** "I know the odds, but I don't trust the *consequences* of the tail end." (Focus on Outcome Severity).
  2.  **Ambiguity Aversion (You/Freeze):** "I don't trust the *odds* themselves." (Focus on Information Quality).

  **The "Taste" vs. "Error" Question:**
  You wrote: *"It doesn't feel like a math error to her. It feels like a taste."*
  You are correct. In economics, this is modeled as a **preference**.
  If your sister's utility function includes "sleeping at night" or "avoiding regret," her decision is rational. She is maximizing **Expected Utility**, not **Expected Value**.
  *   **Expected Value:** Dollars.
  *   **Expected Utility:** Dollars + Peace of Mind + Survival Probability.

  ### Vocabulary for the Novelist
  If you need terms to use in narration or dialogue that carry weight without sounding like a textbook:

  *   **For the Sister:** She has a **high ruin-aversion**. She treats the bottom of the distribution as an **absorbing barrier**. She isn't weighing the probability; she is weighing the **irreversibility**.
  *   **For the Brother:** He exhibits **lottery-ticket cognition**. He overweights the **possibility effect** on the upside.
  *   **For the "Freeze":** That is **ambiguity intolerance**. They are suffering from **Knightian Uncertainty**. They need **epistemic closure** before they can act.

  **The Carving:**
  If you want a single phrase to describe the sister's specific "worst item" inflation:
  > **"She didn't fear the odds; she feared the floor."**

  Or, to describe the difference between the two phenomena:
  > **"Risk is when you know the knife might slip. Uncertainty is when you don't know if you're holding a knife."**

  Your sister reacts to the sharpness of the knife (Severity). You freeze when you can't see the handle (Ambiguity). Both are rational responses to a dangerous world, even if they look like errors on a spreadsheet.
