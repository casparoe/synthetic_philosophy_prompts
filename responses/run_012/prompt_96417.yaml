      *   16 students? Yes.
      *   No Dennett names until debrief? Yes.
      *   Feel the boundaries? Yes.
      *   Network effect tool? Yes (The Shared Code).
      *   Wrong reason/Right answer? Yes (Skinnerian luck).
      *   Co-teacher ready? Yes.

