      *   *Final Concept:* "The Minefield."
      *   *Darwinian:* Bots (students acting as bots). Pre-set path.
      *   *Skinnerian:* Explorers. Step, boom, reset.
      *   *Popperian:* Planners. Can draw the path on a worksheet first.
      *   *Gregorian:* Cartographers. Given a "Map Key" (a legend) that translates symbols to safety, but the key is written in a convention they must learn to trust/use. Or, they can write on the board for the *next* person.
      *   *Actually, the "Network Effect" requirement:* "A tool that was supposed to help only works if enough other people are already using it." This sounds like a language or a standard. Let's make the Gregorian round about *communication protocols*. They can shout warnings, but only if they use the "Official Language" provided.
      *   *Wait, simpler:* The Gregorian tool is a *checklist* or *algorithm* provided by the instructor. It represents "culture." But to make it network-dependent... How about a currency system for hints? No.
