      *   *No, let's look at Dennett's definition:* "Thinking tools... that live partly outside the individual head." Writing, arithmetic.
      *   *Activity:* Solving a complex logic puzzle.
      *   *Darwinian:* You are given a fixed answer sheet. If wrong, you're out.
      *   *Skinnerian:* You guess. Wrong guess = time penalty.
