      *   *Let's try this:* The task is decoding a pattern.
      *   *Darwinian:* You have a fixed key. If it doesn't fit, you die.
      *   *Skinnerian:* Try keys. If it jams, you lose a finger.
      *   *Popperian:* Examine the lock mechanism on paper first.
