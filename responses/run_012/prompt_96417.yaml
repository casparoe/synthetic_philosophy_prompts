answer: |-
  # Activity Plan: The Evolution of Problem Solving
  **Course:** Philosophy of Mind / Cognitive Science Seminar  
  **Time:** 90 Minutes  
  **Class Size:** 16 Undergraduates  
  **Co-Teacher Note:** This plan is designed to be run without mentioning Daniel Dennett or the specific names of the "four grades" until the final debrief. The goal is for students to *feel* the cognitive shifts before they label them.

  ## 1. Overview & Learning Objectives
  Students will participate in four rounds of a navigation/coordination task. Each round changes the rules of how they are allowed to process information and interact with the environment.
  *   **Round 1 (Darwinian):** Fixed behavior. No learning. Elimination via failure.
  *   **Round 2 (Skinnerian):** Trial and error in the real world. Learning via consequences (pain/loss).
  *   **Round 3 (Popperian):** Trial and error in simulation. Learning via internal modeling.
  *   **Round 4 (Gregorian):** Use of external cultural tools. Intelligence offloaded to shared systems.

  ## 2. Materials & Setup
  **Room:** A classroom with movable chairs. Clear a central space (approx. 10x10 feet).
  **Materials:**
  *   **Floor Grid:** Use masking tape to create a 5x5 grid on the floor. Number the squares 1–25 (or use coordinates like A1–E5).
  *   **Hazard Cards:** 5 cards marked "HAZARD" placed face down under specific grid squares (known only to instructors).
  *   **Tokens:** 64 poker chips, colored beads, or high-quality chocolates (4 per student). This is the "Life/Currency" system.
  *   **Clipboards & Paper:** 16 clipboards with blank paper and pencils.
  *   **"The Standard" Cards:** 16 index cards printed with a specific coordinate legend (e.g., "Red = Safe, Blue = Hazard" or a specific grid notation).
  *   **Whiteboard:** For communal information in Round 4.
  *   **Bell or Buzzer:** To signal penalties.

  **Incentive Structure:**
  *   Each student starts with **4 Tokens**.
  *   **Cost of Error:** Hitting a "Hazard" costs 1 Token.
  *   **Goal:** Reach the "Goal Square" (e.g., E5) and retain at least 1 Token.
  *   **Payoff:** Students who finish with Tokens keep them. Tokens can be exchanged for a trivial reward at the end (e.g., choosing the break music, a piece of premium candy, or simply "Survival Status").
  *   **Why this bites:** Losing a token feels like a penalty. Running out means you are "dead" (must sit out and observe).

  ## 3. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Clear room, tape grid, distribute 4 tokens to each student. Give vague intro: "We are testing problem-solving strategies under different constraints." |
  | **10–25** | **Round 1** | **The Instinct Round.** (Darwinian Simulation) |
  | **25–40** | **Round 2** | **The Trial Round.** (Skinnerian Simulation) |
  | **40–60** | **Round 3** | **The Planning Round.** (Popperian Simulation) |
  | **60–75** | **Round 4** | **The Culture Round.** (Gregorian Simulation) |
  | **75–90** | **Debrief** | **Mapping the Experience.** (Naming the grades) |

  ---

  ## 4. Round Rules (Instructor Script)

  ### Round 1: The Instinct Round (15 mins)
  *   **Concept:** Hard-wired competence. No learning.
  *   **Instructions:** "You are not allowed to choose your path. I am handing each of you a sealed envelope. Inside is a sequence of 5 moves (e.g., 'Forward, Forward, Left, Right, Forward'). You must execute these moves exactly. You cannot look at the hazards. You cannot change your path. If you land on a Hazard, you lose a token and you are 'eliminated' (sit down). If you reach the Goal, you keep your tokens."
  *   **Action:** Distribute envelopes. Most will contain paths that hit hazards. Some (rarely) will contain a safe path.
  *   **Observation:** Watch students who hit a hazard. They cannot adjust. They are eliminated.
  *   **Key Moment:** A student might reach the goal purely because their envelope had a safe path. They will feel "successful," but they exercised no agency.

  ### Round 2: The Trial Round (15 mins)
  *   **Concept:** Reinforcement learning. Real-world trial and error.
  *   **Instructions:** "Reset. You keep your remaining tokens. You may now choose your own path. However, you are **not** allowed to use paper or write anything down. You must step on the squares to test them. If you hit a Hazard, you lose a token, return to Start, and try again. You learn by losing tokens."
  *   **Action:** Students wander the grid. Some will get lucky and find the path quickly. Others will burn tokens hitting the same hazards repeatedly.
  *   **Key Moment (Right Answer/Wrong Reason):** Watch for a student who guesses the correct path on the first try without any prior information. They will claim they "figured it out." In the debrief, highlight that they were just lucky; their method wasn't reliable.
  *   **Constraint:** Physically collect clipboards/paper before this round starts. Enforce the "no writing" rule strictly.

  ### Round 3: The Planning Round (20 mins)
  *   **Concept:** Inner simulation. Hypotheses die in your stead.
  *   **Instructions:** "Reset. You keep your remaining tokens. I am now returning your clipboards and paper. You are **allowed and encouraged** to draw the grid and sketch paths *before* you step on the floor. You can simulate mistakes on paper without losing tokens. You only lose a token if you physically step on a Hazard after committing to a path."
  *   **Action:** Students retreat to desks/tables. They draw maps. They cross out hazards on paper. They only walk the path once they are sure.
  *   **Boundary Feel:** Students should feel a distinct relief. The "cost" of thinking has dropped to zero. The boundary is not that they are smarter, but that they are *allowed to simulate*.
  *   **Observation:** Note how many tokens are saved compared to Round 2.

  ### Round 4: The Culture Round (15 mins)
  *   **Concept:** Cultural tools. Externalized intelligence. Network effects.
  *   **Instructions:** "Reset. You keep your remaining tokens. There is a new rule. You are forbidden from speaking English to describe locations. You must use **The Standard**." (Hand out the Index Cards). "The Standard gives you a specific code (e.g., 'A1' instead of 'top left'). Furthermore, there is a Communal Whiteboard. You may write hazard locations on the board using The Standard. **Crucially:** To claim you have solved the maze, you must verify your path against the Whiteboard. If the Whiteboard is empty or uses wrong codes, you cannot verify."
  *   **The Network Trap:** The "Standard" cards use a specific notation (e.g., Coordinates). If a student tries to write "Near the door" on the whiteboard, the Instructor rules it "Invalid Data" and they cannot use it to verify their path. They *must* use the tool.
  *   **The Network Effect:** The Whiteboard is useless if only one person writes on it. It becomes a "super-brain" only when the group adopts the convention. If half the class refuses to use the Code and tries to shout English warnings, the system breaks down, and everyone loses tokens.
  *   **Boundary Feel:** The intelligence is no longer just in their heads (Round 3) or bodies (Round 2); it is on the Whiteboard and in the Code Card. They are leaning on the "ancestral" tool provided.

  ---

  ## 5. Debrief Script (15 Minutes)
  *Do not reveal the names until the end. Walk them through the feelings.*

  **Instructor:** "Let's look at what changed. In Round 1, some of you succeeded. How did you do it?"
  *(Students: "I got a good envelope." "Luck.")*
  **Instructor:** "Exactly. You had competence, but you didn't own it. It was built-in. In evolutionary terms, this is the **Darwinian Creature**. Your 'mind' was the envelope. If the envelope was wrong, you died. You couldn't learn."

  **Instructor:** "Round 2. You could choose, but you paid for mistakes with tokens. Who lost tokens here?"
  *(Hands go up.)*
  **Instructor:** "Did anyone get the right answer immediately?"
  *(One student raises hand.)*
  **Instructor:** "Did you know *why* it was right?"
  *(Student: "No, just guessed.")*
  **Instructor:** "This is the **Skinnerian Creature**. You learn from the environment's feedback. But the cost of learning is paid in real-world failure. You let your hypotheses die *in reality*."

  **Instructor:** "Round 3. I gave you paper. What changed?"
  *(Students: "We could test without losing tokens." "We could think first.")*
  **Instructor:** "You weren't smarter than in Round 2. But you were allowed to run the trial in your imagination. This is the **Popperian Creature**. You let your hypotheses die *in your head* instead of in the world. The boundary wasn't intelligence; it was the permission to simulate."

  **Instructor:** "Round 4. You had the paper, but I added the Code and the Whiteboard. What happened if someone tried to write 'Over by the window'?"
  *(Students: "You said it didn't count." "We couldn't use it.")*
  **Instructor:** "Why?"
  *(Students: "Because everyone else was using coordinates." "The tool required agreement.")*
  **Instructor:** "Exactly. The thinking wasn't just in your head anymore. It was on the board, and it was in the Code Card I gave you. You relied on a tool created outside of you, that only works if others use it too. This is the **Gregorian Creature**. Intelligence is relocated into the culture."

  ---

  ## 6. Honesty Clause: Limitations & Troubleshooting

  ### The Darwinian Problem (Critical)
  **Frank Assessment:** You cannot truly simulate the Darwinian grade in a 90-minute seminar. Real Darwinian selection requires **generations**. Organisms die, the ones with better "envelopes" reproduce, and the next generation inherits the better envelope.
  **The Distortion:** In Round 1, we are simulating the *phenotype* of a Darwinian creature (hard-wired instinct), not the *process* of natural selection. The students are the organisms, but they don't reproduce.
  **How to Handle It:** In the debrief, explicitly state this limitation.
  *   *Script:* "I need to be honest. Round 1 wasn't true evolution, because you didn't reproduce. It was a simulation of what a Darwinian creature *looks like*: an entity with fixed competences that cannot learn. To see real Darwinian selection, we would need to play this game for weeks, letting the winners 'breed' new students with their envelopes. We don't have time for that. So, treat Round 1 as 'Hardwired Instinct,' which is the *result* of Darwinian evolution."

  ### Predictable Failures & Fixes

  **1. The "Clever" Skinnerian**
  *   **Problem:** A student in Round 2 might try to memorize the grid mentally and claim they are "simulating."
  *   **Fix:** Enforce the "No Paper" rule strictly. If they pause too long, prompt them: "You are burning time tokens." Keep the pressure on *action*.
  *   **Second Run Change:** If this happens again, reduce the time limit for Round 2 to force hasty decisions.

  **2. The Gregorian Rebellion**
  *   **Problem:** Students might refuse to use "The Standard" code in Round 4, claiming English is faster.
  *   **Fix:** This is actually a feature, not a bug. It demonstrates the friction of adopting cultural tools. Let them struggle for 2 minutes. Then intervene: "The System does not accept English input. You cannot verify your solution."
  *   **Second Run Change:** If the rebellion kills the activity, make the "Code" obviously superior (e.g., English descriptions are too long to fit on the verification slip).

  **3. The Popperian/Skinnerian Blur**
  *   **Problem:** Students might feel Round 3 is just "Round 2 but smarter."
  *   **Fix:** During Round 3, walk around and point out: "Notice you just crossed out a square on paper. In Round 2, that would have cost you a chocolate. You just killed a hypothesis without paying the price."
  *   **Second Run Change:** Make the hazards in Round 2 more punishing (cost 2 tokens) to heighten the relief of Round 3.

  ### Which Grade Cannot Be Staged?
  **The Darwinian Grade.**
  As noted above, you can stage the *behavior* (fixed action pattern), but you cannot stage the *evolutionary mechanism* (selection over generations) in a single class session.
  **Recommendation:** Do not try to fix this by adding a "breeding" mechanic (e.g., winners pass envelopes to new students); it takes too long and confuses the cognitive science focus. Instead, use the limitation as a teaching moment. Explain that the "Darwinian Creature" is a theoretical baseline—a mind that is purely the product of past selection with zero individual plasticity. The activity shows the *static result* of that process.

  ## 7. Co-Teacher Checklist
  *   [ ] **Tape the Grid:** Ensure squares are big enough to stand in.
  *   [ ] **Prep Envelopes:** Round 1 envelopes should be 80% "Death Paths" and 20% "Safe Paths." Do not tell students the ratio.
  *   [ ] **Hide Hazards:** Place the 5 Hazard cards under the grid squares before class. Do not move them between rounds (the environment stays constant; the mind changes).
  *   [ ] **Print Standards:** Round 4 Index Cards must be identical.
  *   [ ] **Token Management:** Keep a strict ledger of who has tokens. "Death" must feel real (sitting down).
  *   [ ] **Debrief Timing:** Do not run over. The mapping of experience to theory is the most important part. Stop the activity at 75 minutes hard.
