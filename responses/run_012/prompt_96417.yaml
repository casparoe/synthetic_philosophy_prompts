      *   *Gregorian:* Students are "Civilization." They are given a "Map" drawn by a previous group (the instructor fakes this). But the Map uses a Legend. The Legend is only useful if they trust the external artifact over their own intuition. *Network effect:* To make it fit the prompt's specific request ("works only if enough other people are already using it"), I need a convention.
      *   *Revised Gregorian:* The class is split. Half get the "Old Way" (Popperian). Half get the "New Tool" (a specific algorithm/shortcut). The New Tool only speeds them up if they *all* use it to coordinate (e.g., passing notes).
      *   *Actually, the prompt asks for:* "one where a tool that was supposed to help only works if enough other people are already using it." This implies a standard.
      *   *Idea:* A shared glossary. If only one person uses the shorthand, it's useless. If everyone uses it, communication is fast.
      *   *Let's refine the Gregorian round:* The task requires passing information across the room. They are given a set of symbols. If they invent their own, it fails. If they use the provided "Cultural Standard," it works.
      *   *Okay, Plan:*
          1.  **Darwinian:** Pre-programmed movement cards. High elimination rate.
          2.  **Skinnerian:** Free movement, penalty on error. Learning via pain.
          3.  **Popperian:** Scratch paper allowed. Simulation before action.
          4.  **Gregorian:** A shared "Code Book" is introduced. To solve the final puzzle, they must exchange info using the Code. If only one uses it, it fails. If the group adopts it, it flies.

  5.  **Addressing the "Darwinian Problem":**
      *   The prompt asks me to be frank. I cannot simulate natural selection (generations) in 90 mins. I can only simulate the *phenotype* of a Darwinian creature (fixed action pattern). I must admit this limitation in the "Honesty Clause."

  6.  **Incentives:**
      *   No money. Use "Course Credit Tokens" or "Pizza Points" or just "Bragging Rights/Status." Let's use "Survival Tokens." If you run out, you're "dead" (sit out). Last ones standing get a tangible trivial reward (candy/sticker) or just the satisfaction of winning. Let's use **Chocolate Coins** or **High-Quality Candy**. It's trivial cost but visceral.

  7.  **Timeline:**
      *   0-10: Setup & Intro (Vague).
      *   10-25: Round 1 (Darwinian).
      *   25-40: Round 2 (Skinnerian).
      *   40-60: Round 3 (Popperian).
      *   60-75: Round 4 (Gregorian).
      *   75-90: Debrief.

  8.  **Drafting the Rules & Materials:**
      *   *Materials:* Tape for floor grid, blindfolds (optional, maybe too much), Hazard cards, Scratch paper, Pencils, "Code Sheets" for Gregorian.
      *   *Incentive:* Candy. Losing candy = pain.
      *   *The "Wrong Reason/Right Answer" Moment:* In Skinnerian, a student might guess correctly by luck. They feel smart, but they were just lucky. This sets up the Popperian contrast (reliability vs. luck).
      *   *The "Network Effect" Moment:* In Gregorian, give them a symbolic language. If they try to talk English, it's banned/slow. If they use the symbols, it's fast. But if only one person knows the symbols, they can't talk to the others. They must *share* the tool.

  9.  **Refining the Gregorian "Network Effect":**
      *   Task: Coordinate a group action.
      *   Tool: A specific set of hand signals or written symbols provided on a card.
      *   Constraint: You cannot speak English. You must use the Tool.
      *   Catch: The Tool has ambiguity unless everyone agrees on the interpretation (which is provided in the "Culture" packet).
      *   *Better:* The tool is a "Standardized Form." To submit the answer, you must fill out the Form. The Form requires input from 3 other people. If they aren't using the Form, you can't finish. This forces adoption.

  10. **Writing the Plan:**
      *   Tone: Instructional, clear, ready for a co-teacher.
      *   Structure: Overview, Materials, Incentives, Timeline, Round Details, Debrief Script, Honesty Clause.
      *   *Self-Correction on Darwinian:* Make sure the "fixed action" is obvious. Give them a sealed envelope with moves they *must* follow.
      *   *Self-Correction on Skinnerian:* Ensure the penalty is felt. Lose a candy.
      *   *Self-Correction on Popperian:* Emphasize the *permission* to simulate. "You may now use the scratch pad."
      *   *Self-Correction on Gregorian:* Emphasize the *external* nature of the tool. "You are now allowed to use the Handbook."

  11. **Debrief Script:**
      *   Map Round 1 -> Darwinian (Hardwired).
      *   Map Round 2 -> Skinnerian (Reinforcement). Highlight the lucky guesser.
      *   Map Round 3 -> Popperian (Inner Simulation). Highlight the shift from "doing" to "thinking."
      *   Map Round 4 -> Gregorian (Cultural Tools). Highlight the dependency on the shared system.

  12. **Honesty Clause:**
      *   Darwinian is the weak link. Real Darwinian selection requires death and reproduction over generations. We are simulating "Hardwired Instinct" not "Evolutionary Selection." I need to state this clearly so the teacher explains it as "The *result* of evolution, not the process."

