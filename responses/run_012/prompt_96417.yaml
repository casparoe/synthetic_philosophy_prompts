      *   *Better Gregorian Idea:* A shared language for describing the hazards. In Round 3, they think alone. In Round 4, they are allowed to write notes on the board for future players, or use a specific code provided by the "ancestors" (previous class/instructor). Let's go with *shared external memory*. A communal whiteboard where they can leave warnings.
