      *   *Yes.* This hits the "locus of intelligence" (the ruler does the measuring) and "network effect" (interoperability).

  15. **Finalizing the Plan Structure:**
      *   Title: "The Evolution of Problem Solving."
      *   Co-teacher notes included.
      *   Clear distinction on the Darwinian limitation.

  ( Self-Correction during drafting ): Make sure the Skinnerian/Popperian boundary is sharp. In Skinnerian, forbid paper. In Popperian, mandate/hand out paper. The *permission* is the key.

