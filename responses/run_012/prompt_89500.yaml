answer: |-
  **Designer's Notes: Theory to Tool**

  To make decision theory usable, we drop axioms and focus on mechanics. A money pump requires three things: a cycle of choices (A to B to C to A), a cost at each step, and a counterparty who captures the cost. If the user stays at B, there is no pump. If switching is free, there is no drain. If the user changes their mind because of new information, it is not irrational.

  We must distinguish between *myopic* choosing (deciding only for now) and *resolute* choosing (sticking to a plan). A journey is dangerous if it forces myopia where resoluteness would protect the user. However, we cannot ban journeys simply because users might change their minds; taste changes are legitimate. The review stops at the point of empirical fact (do users lose money?) or value judgment (is thrill-seeking worth the cost?).

  ***

  **The Review Procedure**

  **1. The Cycle Test**
  *Question:* Can a user accept every step in the journey and return to their starting financial position, but with less money?
  *Sufficient Answer:* Map the path. If Start → Step 1 → Step 2 → Return to Start results in net fees or losses, mark **FAIL**. If the user ends in a different position (e.g., higher risk) or pays no fees, mark **PASS**.
  *Stop Point:* If **PASS**, stop. The journey is fine. If **FAIL**, proceed to Question 2.

  **2. The Counterparty Gain Test**
  *Question:* Does the firm profit from each step in the cycle?
  *Sufficient Answer:* Check fee schedules. If the firm collects a transaction fee, spread, or penalty at every turn of the cycle, mark **FAIL**. If fees are flat or zero regardless of switching, mark **PASS**.
  *Stop Point:* If **PASS**, stop. Churn without extraction is not exploitative. If **FAIL**, proceed to Question 3.

  **3. The Reversibility Test**
  *Question:* Can the user reverse the sequence without cost or friction?
  *Sufficient Answer:* Check terms. If the user can undo the journey instantly and for free, mark **PASS**. If there are cooling-off periods, cancellation fees, or procedural friction (e.g., must call support), mark **FAIL**.
  *Stop Point:* If **PASS**, stop. Free reversal breaks the pump. If **FAIL**, proceed to Question 4.

  **4. The Information Test**
  *Question:* Is the cycle visible to the user before they start?
  *Sufficient Answer:* Check disclosures. If the journey map and total costs are shown upfront, mark **PASS**. If steps are revealed only after commitment, mark **FAIL**.
  *Hand-off:* If **FAIL**, this is a **Human Decision**. The reviewer must decide if hiding the cycle is deceptive (conduct risk) or merely complex (product design). This depends on contested facts about user comprehension.

  **5. The Commitment Test**
  *Question:* Is there an option to commit to a plan and ignore future prompts?
  *Sufficient Answer:* Check settings. If a user can set a rule (e.g., "never swap") that overrides future journey steps, mark **PASS**. If the user must re-decide at every step, mark **FAIL**.
  *Hand-off:* If **FAIL**, this is a **Human Decision**. Theory is contested here. One reading says users need protection from their future selves (require commitment tools). Another says forcing a plan restricts legitimate freedom to change tastes. The reviewer must weigh autonomy against protection.

  ***

  **Case Applications**

  **1. The Savings Swap (Indeterminate)**
  *Journey:* Monthly offer to swap into the best-performing fund. No fees. Reversible.
  *Application:*
  1.  *Cycle:* User swaps A→B→A. No fees. **PASS**.
  2.  *Gain:* Firm earns management fee, but not per swap. **PASS**.
  *Verdict:* **Indeterminate.** The procedure clears it, but empirical risk remains. If chasing past performance causes long-term loss, users are harmed despite no direct fees. The procedure cannot check market dynamics. Reviewer must flag for empirical monitoring, not refusal.

  **2. The Subscription Ladder (Refuse)**
  *Journey:* Free trial → Cancel offered Upgrade A → Cancel A offered Upgrade B. Each has a fee to reinstate lower tier.
  *Application:*
  1.  *Cycle:* User can downgrade but pays reinstatement fees. Return to start costs money. **FAIL**.
  2.  *Gain:* Firm collects fees at every downgrade attempt. **FAIL**.
  3.  *Reversibility:* Downgrades are frictioned (fees). **FAIL**.
  4.  *Information:* Offers presented only at cancellation moment. **FAIL**.
  *Verdict:* **Refuse.** This fails all mechanical safeguards. It creates a cycle where the firm profits from the user's attempt to exit. No hand-off needed; the mechanics are predatory.

  **3. The Gamified Trader (Unpopular Verdict)**
  *Journey:* Users pay micro-fees to "level up" trading badges, which expire monthly, requiring re-payment to maintain status. Users love the engagement.
  *Application:*
  1.  *Cycle:* Pay → Level Up → Expire → Return to Start → Pay. **FAIL**.
  2.  *Gain:* Firm collects monthly fees. **FAIL**.
  3.  *Reversibility:* User can stop paying, but loses status. **FAIL** (Cost to return to start status).
  4.  *Commitment:* No option to lock status permanently. **FAIL**.
  *Verdict:* **Refuse.** The procedure flags this as a money pump.
  *Defense:* The business will argue users value the "thrill" and consent freely. The reviewer must defend the verdict by noting that rational choice theory treats cyclical spending on status maintenance as exploitable instability, regardless of reported satisfaction. The procedure prioritizes financial consistency over gamified utility. If the regulator values wealth preservation over engagement, this must be blocked or require a permanent status option.

  ***

  **Limits**

  This procedure cannot decide cases where user preferences are stable but non-comparable (e.g., choosing between art and safety). It assumes users prefer more wealth to less; it will give the wrong answer for users who value the *act* of choosing over the outcome. It cannot distinguish between a defect in rationality and a real change in circumstance (e.g., swapping funds because of a life event, not instability). Finally, it rests on the assumption that reviewers can accurately map the "return to start" condition; in complex derivatives or tax environments, the starting position may be unknowable. Where the procedure demands a hand-off, it admits that regulation cannot solve conflicts between competing definitions of rationality.
