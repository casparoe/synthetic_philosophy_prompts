answer: |-
  **Prof. A:** You keep calling my village an outlier, as if that settles it. But if the distribution underneath your eighty thousand rows is lumpy—if there are two distinct kinds of economies operating under the same tax code—then your average isn't a description of reality. It's a fiction. It's the height of the average citizen in a room full of children and basketball players. My village isn't an exception to your rule; it's proof that your rule is measuring the wrong thing.

  **Prof. B:** I'll concede the point on bimodality. If there are two distinct populations mixed in the data, the mean is useless. I've said as much in my methodology sections. But you're leaping from "the average is misleading" to "the structure doesn't exist." You say your village proves the tax rolls are lies. I say your village proves only that survival is non-random. We have records for that village precisely because it was litigious and commercial. You've selected on the dependent variable. You can't use the one village that survived to tell me about the ninety-nine that didn't.

  **Prof. A:** I'm not using it to tell you about the ninety-nine. I'm using it to tell you about the one. And yes, a single case can falsify a claim of impossibility. If I show you a peasant household engaging in complex credit networks while labeled "pauper" on the roll, I have falsified the claim that "paupers did not lend." You argue that history explains by subsuming events under regularities. I argue history explains by reconstructing the chain of events that could have gone otherwise. Your regularities erase the agency required to navigate the constraints.

  **Prof. B:** Agency within constraints is fine, but without the constraints, you have no context for the agency. You say the tax rolls are lies, but you also say the people strategized around them. Which is it? If the categories were meaningless, why strategize? The fact that they hid grain or split households proves the categories bit hard enough to matter. My data captures the bite. Yours captures the wiggle. You need my eighty thousand rows to know that your village's wiggle is actually remarkable. You admit that yourself when you call it "unusual."

  **Prof. A:** I call it unusual relative to the archive, not relative to the countryside. That's the ledger's-eye view. The state's archives are a map of the state's anxieties, not the population's reality. When the clerk writes "day-labourer," he isn't describing an economic function; he's describing a liability. He's creating a subject who can be taxed. Over forty years, the villagers start describing themselves that way too. The paperwork creates the category it records. You're treating the fisc's taxonomy as natural kinds.

  **Prof. B:** I treat them as institutional facts, which are real enough to cause famines. But here is where I concede: you're right that the categories constrain behavior over time. If the clerk writes "pauper," the village loses credit access, which makes them poorer, which makes them paupers. The map reshapes the territory. But that doesn't mean the territory wasn't there before the map. My data shows regional clusters of poverty that predate the specific tax reforms. The state didn't invent the inequality; it just codified it. You can't explain the credit network in your village without explaining why the neighbors didn't have one. That requires my scale.

  **Prof. A:** And you can't explain the credit network without reading the suits, which means reading the poor through the courts that were fining them. This is the ventriloquism problem. We hear the poor only when they are defendants. You say your data gives them voice by counting them. I say it silences them by aggregating them. Explanation isn't finding the correlation between harvest prices and suit frequency. It's understanding why Marie chose to sue Pierre instead of accepting the debt. That's a chain of events, not a regularity.

  **Prof. B:** I agree that history from below via court records is inherently distorted. We are reading the poor through the institutions that punished them. But if we only do microhistory, we romanticize the exception. You say explanation is reconstructing the chain. I say explanation is knowing which chains are possible. If I show you that credit collapses everywhere when prices rise ten percent, then Marie's choice to sue Pierre is constrained by that collapse. You can't reconstruct the chain without knowing the walls of the room. But I will grant you this: if the distribution is bimodal, my walls are in the wrong place. I need to know if there are two rooms.

  **Prof. A:** Then we agree that the average is the enemy, not the count. But you still think my village is a curiosity. I think it's a correction.

  **Prof. B:** And I still think your village is a survivor. I think it's the one that didn't sink.

  **Prof. A:** What evidence would move you? If I found another fifty villages like this, would you concede the taxonomy is broken?

  **Prof. B:** If you found fifty villages with this survival rate and this credit density, randomly selected, yes. I would have to model a bimodal distribution. What about you? If I showed you that across the province, regardless of the label, net grain flow correlates perfectly with the tax assessment, would you concede the rolls track material reality?

  **Prof. A:** If the correlation held for the villages without surviving records, yes. But I suspect we're circling the same thing. You want to know how the system functioned. I want to know how people lived inside it.

  **Prof. B:** Is there a version of this where we're just reading the same facts differently? Where the priest's notebook and the tax rolls are just two projections of the same object, and we're fighting over which shadow is the real shape?

  **Prof. A:** Maybe. Or maybe the object doesn't exist, and there are only the shadows.
