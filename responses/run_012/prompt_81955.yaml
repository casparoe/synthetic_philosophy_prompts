  Here are four candidate series I considered before settling on the final scenario.

  1.  **Credit Risk Assessment:** A series of loan applicants ordered by debt-to-income ratio. Predicate: "High Risk." *Rejection:* Modern lending uses algorithmic scoring with fixed cutoffs; the vagueness is engineered out, making the series artificially crisp.
  2.  **Tenure Review:** A series of faculty candidates ordered by publication count. Predicate: "Scholarly Impact." *Rejection:* Tenure is a singular event, not a batch process. There is no institutional mechanism forcing a comparison with the *previous* candidate, so the direction of traversal doesn't structurally compel a shift.
  3.  **Medical Triage:** A series of patients ordered by vital sign stability. Predicate: "Immediate Care." *Rejection:* Too close to your hospice example. The life-or-death stakes introduce moral urgency that muddies the semantic vagueness with ethical weighting.
  4.  **Zoning Variance:** A series of land lots ordered by slope gradient. Predicate: "Undue Hardship." *Selection:* This allows for a batch-review process where administrative rules mandate consistency, forcing the sorites slide without changing the intrinsic properties of the land.

  ***

  ### The Scenario

  A municipal zoning board convenes to adjudicate fifty variance requests for "Undue Hardship" due to lot slope, ranked strictly by gradient from 0 to 50 degrees. The board operates under a binding procedural rule: "To ensure equal treatment, the classification of the current lot must align with the immediately preceding lot unless a material difference in gradient is recorded." The endpoints are undisputed: Lot 1 (0 degrees) is clearly compliant, and Lot 50 (50 degrees) clearly qualifies for a variance. In Session A, the board reviews the series ascending from Lot 1; in Session B, they review the same fifty lots descending from Lot 50. Lot 25 (15 degrees) is the crux item. In Session A, the board rules Lot 25 does *not* qualify for a variance; in Session B, they rule it *does*. The intrinsic facts of Lot 25—gradient, soil composition, zoning designation—are identical in both sessions; only the order of adjudication and the preceding precedent differ.

  ***

  ### Analysis

  **Epistemicism**
  *   **The Problem:** Vagueness is ignorance; there is a sharp, unknown cutoff where "Undue Hardship" becomes true.
  *   **The Flip:** It predicts the flip is impossible; one verdict is true, the other false. The board is necessarily mistaken in one session.
  *   **Status of Crux:** Lot 25 is either definitely Hardship or definitely Not, regardless of the session.
  *   **Correctness:** It must call one verdict flat-out mistaken.

  **Supervaluationism**
  *   **The Problem:** Vagueness is indeterminacy; there are many admissible precisifications of "Undue Hardship."
  *   **The Flip:** It accommodates the flip by treating each session as selecting a different admissible precisification.
  *   **Status of Crux:** Lot 25 is neither super-true nor super-false; it is indeterminate.
  *   **Correctness:** It says neither verdict is uniquely correct, but both are permissible within different precisifications.

  **Degree Theory**
  *   **The Problem:** Vagueness is a matter of degree; truth values range from 0 to 1.
  *   **The Flip:** It predicts the flip is a pragmatic artifact; Lot 25 has a fixed degree (e.g., 0.5), but the binary ruling depends on where the contextual threshold is set.
  *   **Status of Crux:** Lot 25 is partially Hardship to a specific degree.
  *   **Correctness:** It says the verdicts differ in pragmatic utility, not truth; both capture the degree differently relative to their anchor.

  **Contextualism**
  *   **The Problem:** Vagueness is context-sensitivity; the extension of the predicate shifts with the standard of comparison.
  *   **The Flip:** It predicts the flip; the "standard" for Hardship shifts based on the salient precedent (the preceding lot).
  *   **Status of Crux:** Lot 25 is Not-Hardship in Context A and Hardship in Context B.
  *   **Correctness:** It says both verdicts are equally correct relative to their respective contexts.

  ***

  ### Evaluation

  **Which view comes out worst?**
  **Epistemicism** comes out worst. Because the scenario builds the flip into a *binding procedural rule* designed to ensure fairness ("equal treatment"), Epistemicism is forced to declare the institution itself structurally irrational. It must assert that the rule mandating consistency with the preceding case *forces* the board to make a truth-apt error in one direction. While logically consistent, this renders the administrative goal of fairness incompatible with the metaphysics of truth, which is a high price to pay for a sharp boundary.

  **Strongest move for the defender:**
  The Epistemicist should argue that the procedural rule is *legally* valid but *semantically* flawed. They can claim that "equal treatment" does not require identical classifications for sorites-susceptible predicates, only identical application of the *true* cutoff. The board's mistake is assuming that tolerance (indistinguishability) entails equivalence, which the Epistemicist denies.

  **How would a contextualist distinguish a genuine context shift from me just being tired and inconsistent?**
  The contextualist must point to the *mechanism* of the shift. Inconsistency is random noise; context shifts are systematic responses to salient features. Here, the "preceding lot" acts as a contextual anchor that legitimately adjusts the standard of comparison (the "comparison class"). If the verdict changes without a change in the salient anchor (e.g., reviewing the same lot twice in the same sequence), that is inconsistency. If the verdict changes because the *sequence* changed the salient standard, that is a context shift. The rule provides the systematic link between the anchor and the standard.

  **Which single feature is doing the real work?**
  The **mandatory local consistency rule**. If you strip this out, the judges could simply pick a cutoff (e.g., 14 degrees) and stick to it regardless of direction, collapsing the case back into the boring colour-patch version where the paradox is about *where* the line is, not that the line *moves*. The rule forces the tolerance principle to operate as an institutional engine rather than a linguistic intuition, making the hysteresis unavoidable rather than accidental.

  **Constraint Uncertainty:**
  I am unsure if this fully satisfies the "facts about it held completely fixed" constraint. While the *intrinsic* facts of Lot 25 (slope, soil) are fixed, the *procedural* facts (the verdict on Lot 24 vs. Lot 26) differ between sessions. If one considers the "history of adjudication" as a fact about the item's situation, then the facts are not fixed. However, following your hospice example (where the "direction of look" wasn't a fact about the patient), I am treating the order of review as external to the item itself. If you reject that distinction, the case collapses into a change of evidence rather than a change of predicate extension.
