      *Framing:*
      In decision theory, utility ($u$) measures how much you value an outcome, while probability ($p$) measures likelihood. Expected Utility (EU) sums $p \cdot u$. Risk-Weighted Expected Utility (REU) modifies this to capture risk attitudes separately from outcome values. It introduces a risk function ($r$), which transforms probabilities before weighting. A concave $r$ indicates risk aversion, downplaying low-probability gains. The crucial distinction lies in what probability gets transformed. The "naive" view applies $r$ to the specific probability of each individual outcome. REU applies $r$ to cumulative probabilities: the chance of receiving an outcome *at least as good as* a specific threshold. This cumulative approach treats risk as a property of the overall distribution's shape rather than isolated event weights, aiming to preserve normative consistency while allowing deviations from standard EU.

      *Structural:*
      Consider a gamble with three outcomes ordered from worst to best: \$0 (probability 0.5), \$50 (probability 0.25), and \$100 (probability 0.25). Assume $u(\$0)=0$, $u(\$50)=50$, $u(\$100)=100$, and a risk function $r(p) = p^2$.
      In the naive view, you weight each outcome's utility by its specific probability transformed by $r$. The calculation is: $r(0.5)\cdot0 + r(0.25)\cdot50 + r(0.25)\cdot100$. This yields $0.25\cdot0 + 0.0625\cdot50 + 0.0625\cdot100 = 0 + 3.125 + 6.25 = 9.375$.
      In REU, you start with the worst outcome's utility and add weighted increments. The increment from \$0 to \$50 is weighted by the chance of getting at least \$50 (0.5). The increment from \$50 to \$100 is weighted by the chance of getting at least \$100 (0.25). The calculation is: $0 + r(0.5)\cdot(50-0) + r(0.25)\cdot(100-50)$. This yields $0 + 0.25\cdot50 + 0.0625\cdot50 = 12.5 + 3.125 = 15.625$.
      The results differ drastically. The naive version discounts the baseline utility and treats probabilities in isolation. REU preserves the baseline (the worst case is guaranteed to be at least \$0) and weights the *extra* gain by the difficulty of achieving that higher tier. This structural shift changes how risk aversion penalizes the gamble: naive penalizes every term; REU penalizes only the uncertain increments.

      *Buys:*
      The cumulative structure solves a fatal flaw in the naive view known as description dependence or violation of redundancy. In the naive model, how you individuate states matters. Suppose we split the \$0 outcome into two distinct states: "\$0 if Heads" (0.25) and "\$0 if Tails" (0.25). The total probability of \$0 remains 0.5. However, because $r$ is non-linear, $r(0.5) \neq r(0.25) + r(0.25)$. Specifically, $0.25 \neq 0.0625 + 0.0625$. The naive valuation changes simply because you described the same physical outcome using more states. This makes the theory irrational; preferences shouldn't shift based on arbitrary descriptions of uncertainty.
      REU avoids this because cumulative probabilities merge identical outcomes. The chance of getting "at least \$0" is 1.0 regardless of how many ways you can get \$0. The cumulative structure ensures that risk attitudes apply to the *profile* of the distribution (the likelihood of doing well) rather than the counting of states. It isolates risk as an attitude toward the security of levels of utility, ensuring that adding irrelevant distinctions doesn't alter the decision weight. This allows the risk function to represent a global attitude toward uncertainty without being corrupted by the granularity of the probability space.

      *Interpretive:*
      Does REU successfully separate risk attitude from utility shape? Proponents argue yes: $u$ captures diminishing marginal value of money, while $r$ captures dislike of uncertainty itself. However, a strong objection suggests this separation is mathematically artificial. Without independent access to an agent's utility function (which is unobservable), any behavior explained by a concave $r$ and linear $u$ can often be mimicked by a linear $r$ and concave $u$.
      The strongest objection is that "risk aversion" might just be diminishing marginal utility. If I prefer \$50 for sure over a 50/50 gamble of \$0/\$100, EU says the second \$50 is worth less than the first. REU says the second \$50 is worth the same, but the chance of getting it is psychologically diminished. Critics argue REU over-parameterizes the model. Unless we can measure utility independently of choice (e.g., via neurology), the risk function might just be a shadow of the utility curve. The separation exists in the equations, but empirically, the two parameters are confounded, making the claim of a distinct "risk attitude" potentially unfalsifiable.

      *Change Mind:*
      I would change my assessment if REU could be shown to handle sequential decision-making without succumbing to dynamic inconsistency. Currently, REU agents can be Dutch Booked (money-pumped) because their preferences shift as probabilities update, unlike EU agents. If a variant of REU were developed that maintained the cumulative risk structure while ensuring dynamic consistency, it would significantly bolster its normative credibility.
