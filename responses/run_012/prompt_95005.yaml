      In decision theory, utility ($u$) measures how much you value an outcome, while probability ($p$) measures likelihood. Expected Utility (EU) sums $p \cdot u$. Risk-Weighted Expected Utility (REU) modifies this to capture risk attitudes separately from outcome values. It introduces a risk function ($r$), which transforms probabilities before weighting. A concave $r$ indicates risk aversion, downplaying low-probability gains. The crucial distinction lies in what probability gets transformed. The "naive" view applies $r$ to the specific probability of each individual outcome. REU applies $r$ to cumulative probabilities: the chance of receiving an outcome *at least as good as* a specific threshold. This cumulative approach treats risk as a property of the overall distribution's shape rather than isolated event weights. When $r$ is the identity function, REU collapses to standard EU. The goal is to preserve normative consistency while allowing deviations from standard EU, ensuring risk attitude is a distinct parameter from the value assigned to outcomes themselves.

      **The structural difference**
      Consider a gamble with three outcomes ordered from worst to best: \$0 (probability 0.5), \$50 (probability 0.25), and \$100 (probability 0.25). Assume $u(\$0)=0$, $u(\$50)=50$, $u(\$100)=100$, and a risk function $r(p) = p^2$.
      In the naive view, you weight each outcome's utility by its specific probability transformed by $r$. The calculation is: $r(0.5)\cdot0 + r(0.25)\cdot50 + r(0.25)\cdot100$. This yields $0.25\cdot0 + 0.0625\cdot50 + 0.0625\cdot100 = 0 + 3.125 + 6.25 = 9.375$.
