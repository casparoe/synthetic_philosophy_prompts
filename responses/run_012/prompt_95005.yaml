      The cumulative structure solves a fatal flaw in the naive view known as description dependence or violation of redundancy. In the naive model, how you individuate states matters. Suppose we split the \$0 outcome into two distinct states: "\$0 if Heads" (0.25) and "\$0 if Tails" (0.25). The total probability of \$0 remains 0.5. However, because $r$ is non-linear, $r(0.5) \neq r(0.25) + r(0.25)$. Specifically, $0.25 \neq 0.0625 + 0.0625$. The naive valuation changes simply because you described the same physical outcome using more states. This makes the theory irrational; preferences shouldn't shift based on arbitrary descriptions of uncertainty.
