  8.  **Final Review of the Character's Logic:**
      *   "Strictly proper scoring rule... expected value is maximized by the credence function that matches the truth." -> *Correction:* Expected value is maximized by reporting your *actual* credence. If you *know* the truth, then yes, report the truth. But she admits she *doesn't* know.
