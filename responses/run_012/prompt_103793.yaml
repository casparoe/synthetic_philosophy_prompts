      *   **Technical Explanation:** How strictly proper scoring rules work (incentivize honesty/probabilism, not dogmatism).
      *   **What AFE Actually Implies:** Probabilism, calibration, matching credence to evidence.
      *   **Confidence Statement:** High confidence.
      *   **Conditions for Defensibility:** Non-standard scoring rules, pragmatic vs. epistemic goals, or a shift to "acceptance" rather than "credence."

  7.  **Tone and Style:**
      *   Respectful of the novelist's craft (this is a great conflict for a character!).
