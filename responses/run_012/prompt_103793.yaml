answer: |-
  This is a fantastic premise for a character. It captures a very specific, sophisticated temptation that arises in formal epistemology. However, from the standpoint of contemporary accuracy-first epistemology (AFE) and epistemic utility theory, **her reasoning is unsound.** It contains a fundamental category error regarding how proper scoring rules function.

  Here is the breakdown of where she goes wrong, what the view actually implies, and my confidence in this assessment.

  ### The Core Error: Actual vs. Expected Accuracy

  Your character's argument collapses the distinction between **actual accuracy** (how right you turn out to be) and **expected accuracy** (how right you should expect to be given your evidence).

  1.  **The Definition of Strictly Proper Scoring Rules:**
      She claims: *"A strictly proper scoring rule is one whose expected value is maximized by the credence function that matches the truth."*
      **Correction:** This is false. A strictly proper scoring rule is one whose expected value is maximized by reporting **your actual current credence.**
      *   *Example:* Suppose you use the Brier Score (a standard proper scoring rule). If you genuinely believe a coin has a 50% chance of landing Heads, your expected score is maximized by reporting "0.5." If you report "1.0" (because you want to match the truth *if* you guess right), your *expected* score drops, even though your *potential* score increases.
      *   Proper scoring rules are designed specifically to incentivize **honesty** about one's uncertainty, not **certainty** about one's best guess.

  2.  **The Norm of Rationality:**
      She claims: *"The ideally rational credence function is the true one."*
      **Correction:** In AFE, the *omniscient* credence function (1 for truths, 0 for falsehoods) is the *most accurate* function, but it is not the *rational* function for a non-omniscient agent.
      *   Rationality in AFE is defined as **maximizing expected epistemic utility relative to one's evidence.**
      *   Since she admits she does not know which theory is true, she cannot aim for the "true" credence function directly. She must aim for the credence function that best reflects her evidence. If her evidence makes a theory 70% likely, accuracy-first norms demand she assign 0.7, not 1.0.

  3.  **The Hedging Argument:**
      She claims: *"Hedging... would only make her less accurate if her theory is right, and if it is wrong she is inaccurate anyway."*
      **Correction:** This is an *ex post* (after the fact) evaluation, not an *ex ante* (before the fact) evaluation.
      *   If she assigns 1.0 to a theory that is actually 0.7 probable, she is engaging in **epistemic risk-taking.**
      *   If she turns out to be right, she gets a perfect accuracy score. But if she turns out to be wrong (which happens 30% of the time in this example), she gets a catastrophic accuracy penalty.
      *   Because the scoring rule is *strictly proper*, the penalty for being confidently wrong outweighs the bonus for being confidently right, in terms of *expectation*. Hedging (assigning 0.7) guarantees a higher *average* accuracy over time than going "all in" (assigning 1.0).

  ### What Accuracy-First Epistemology Actually Implies

  If your character were faithfully applying accuracy-first epistemology (à la James Joyce, Richard Pettigrew, or Hannes Leitgeb), the view would imply the following:

  1.  **Probabilism:** Her credences should obey the laws of probability. (Assigning 1 to her theory and 0 to rivals is fine *if* they are mutually exclusive and exhaustive, but usually, we have uncertainty about the theory itself).
  2.  **Calibration:** Her credences should match her evidential support. If her best theory is supported by 80% of the available data/models, her credence should be 0.8.
  3.  **No Epistemic Gambling:** She is not permitted to inflate her credences to 1.0 just to "maximize potential accuracy." That is treated as epistemically irrational, akin to a gambler going all-in on a 51% hand because "if I win, I win big." AFE says you must respect the 49% risk of ruin.

  ### Confidence Level

  **I am 95% confident in this correction.**

  The reasoning I have outlined above represents the standard consensus in formal epistemology regarding epistemic utility theory. The argument your character makes is a known "trap" in the literature. It is often raised by critics of AFE to show that accuracy might lead to dogmatism, and proponents of AFE (like Pettigrew) explicitly argue against it by emphasizing the **expectation** clause.

  For her argument to be sound, she would have to reject the standard definition of "rationality" within the framework she claims to be using. She is using the *tools* of decision theory (maximizing expected utility) but applying them to the *outcome* rather than the *decision*.

  ### How to Make Her Argument Defensible (The 5%)

  If you want her position to be philosophically defensible (or at least a live option in your fictional institute), you would need to tweak her premises slightly. Here are three ways to do that:

  1.  **Change the Scoring Rule:**
      If she uses an **improper** scoring rule (specifically, a "0-1 loss" rule where you get 1 point for being right and 0 for being wrong, regardless of confidence), then her strategy *is* optimal. However, this contradicts her claim of using a *strictly proper* rule. In your book, she could argue that strictly proper rules are too "timid" and that the Institute should use a rule that rewards bold truth-seeking over cautious calibration.
      *   *Narrative hook:* She is a radical reformer trying to change the Institute's scoring metrics.

  2.  **Distinguish "Credence" from "Acceptance":**
      She could argue that while *credence* should be probabilistic (0.8), *acceptance* (what you act on or assert as a premise) should be binary (1 or 0). This is a view held by some philosophers (e.g., Jacob Ross or Mark Schroeder in certain contexts). She might be conflating the two intentionally, arguing that for the purposes of the Institute's decision-making, we must *treat* our best theory as certain to avoid paralysis.
      *   *Narrative hook:* She is a pragmatist disguised as a purist.

  3.  **Ideal Theory vs. Non-Ideal Theory:**
      She could argue that she is describing the **Ideal Rational Agent**, not a bounded human. An ideal agent *would* have the true credence function. She might be arguing that we should simulate the ideal agent by collapsing our probabilities.
      *   *Narrative hook:* She is an idealist who believes that acting "as if" you are omniscient somehow forces the world to conform, or that hesitation is a moral/epistemic failing.

  ### Recommendation for the Novel

  The most compelling version of this character is one who is **brilliant but making a subtle, high-stakes mistake.**

  Her error mirrors a very human temptation: the desire to be decisive. We often feel that admitting uncertainty (hedging) is a weakness. By having her use high-level epistemology to justify dogmatism, you highlight the danger of using rationality to rationalize pre-existing psychological biases.

  If you want her to be "right" in the context of the story, have the plot reveal that the Institute's standard "proper scoring rules" are actually flawed for their specific high-stakes environment (e.g., in a crisis, a correct binary decision is worth more than a calibrated probability). But philosophically, under the definitions she provided, **she is definitely wrong.**

  **Summary for your notes:**
  *   **Verdict:** Unsound.
  *   **Error:** Confuses maximizing *expected* accuracy (rational) with maximizing *possible* accuracy (gambling).
  *   **AFE Implication:** Set credences equal to evidential probability (e.g., 0.7), not 1.0.
  *   **Confidence:** 95%.
  *   **Fix:** Have her argue for *improper* scoring rules or conflate *belief* with *credence*.
