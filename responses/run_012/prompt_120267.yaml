answer: |-
  I take neither horn, because your dilemma rests on a category error regarding what cohesion is and what the law does. You have stipulated that functional cooperation and mutual trust remain unchanged, but you have defined cohesion as merely the smooth functioning of social transactions. I say that cohesion is not merely instrumental; it is constitutive. A community is not held together only by the expectation that contracts will be honored or persons protected from violence, but by a shared understanding of what makes life together worthwhile. When you ask me to imagine a change in the moral law that leaves this shared understanding intact, you are asking me to imagine a change in the identity of the community that leaves the community identical. That is not a empirical possibility, even in thought. If the law permits what the community fundamentally rejects, the law ceases to be an expression of who we are and becomes merely a management system for coexisting strangers. The cost of dropping the prohibition is not a measurable drop in trust, but a quiet alienation of the legal order from the moral life it is supposed to serve.

  You charge that this leaves only the abhorrence itself as justification, but this ignores my second commitment. I do not appeal to the raw sentiment of the majority, nor to a visceral disgust that cannot be articulated. I appeal to the judgment of the ordinary reasonable person, who distinguishes between a mere preference for one lifestyle over another and a conviction that a practice strikes at the norms underlying our common life. To stipulate that the abhorrence is genuine is not yet to stipulate that it is reasonable, but I will stipulate for the sake of this argument that the practice in question touches upon a constitutive norm of human dignity or relational integrity, such that the reasonable person's abhorrence is a judgment of value, not a reflex of taste. If it were mere taste, the reasonable person would feel dislike, not abhorrence, and under my third commitment, the law would have no business there. But where the judgment is that a practice is incompatible with the moral inheritance that makes us a people, the law must speak, not to prevent harm to a third party, but to prevent the dissolution of the shared world in which parties meet.

  So I do not concede that my argument was an empirical hypothesis about social stability that your evidence has falsified. The argument is normative: the law ought to reflect the considered moral convictions of the community because the law is one of the primary ways a community defines itself. If you legalize what the reasonable person finds intolerable, you do not necessarily break the machinery of society, but you do change the meaning of citizenship. You ask what this costs me. It costs me the comfort of a neutral state, and it costs me the ability to promise that the law will never burden you with a moral vision you do not share. But it buys me a society where the law is not alien to the people it governs, where the rules we live by are not merely imposed constraints but reflections of a common life we recognize as our own. I would rather defend a law that holds us together by what we value than one that holds us together only by what we fear.
