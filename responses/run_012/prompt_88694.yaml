answer: |-
  This is a fascinating rabbit hole, and your flatmate is right to flag it, though perhaps wrong to imply it will help you get your deposit back. You have accurately summarized the stalemate in the philosophy of language and formal semantics. The literature is indeed polarized between the **Unified Account** (Kratzer, Gillies: conditionals are restrictors on covert modals; differences are pragmatic or syntactic) and the **Dual Account** (Stalnaker, Lewis, early von Fintel: indicatives and counterfactuals operate on different accessibility relations or selection functions).

  To answer your specific question: **What kind of disagreement is this?**

  It is not primarily a factual disagreement about data, nor is it simply a split between truth-conditions and assertability. It is a **methodological and metaphysical divide regarding the object of semantic theory.**

  ### 1. The Nature of the Disagreement
  The "One Machine" camp (Unified) believes semantics should be parsimonious. They argue that the intuitive difference between "If it rains, it will" and "If it rained, it would" is handled by the **ordering source** or the **temporal perspective** of the evaluation world, not by a fundamental change in the conditional operator itself. For them, the conditional is a quantifier over worlds, and the "flavor" (epistemic vs. metaphysical) comes from the context supplying the modal base.

  The "Two Machine" camp argues that the intuitive difference reflects a **deep structural distinction** in how we process information. Indicatives track what is compatible with our *knowledge* (epistemic); counterfactuals track what is compatible with the *laws of nature/causality* given a false antecedent (metaphysical/nomic). They argue that trying to force these into one machine requires such complex pragmatic patching that the semantic core becomes vacuous.

  The "Future Pair" problem you identified is the smoking gun.
  *   *Indicative:* "If it rains tomorrow..." (Treats the future as open but epistemically accessible).
  *   *Counterfactual:* "If it rained tomorrow..." (Treats the future as settled in the evaluation world, or implies a lower likelihood).

  If semantics is purely truth-conditional, both should behave similarly regarding truth values across possible worlds. But they don't. The counterfactual version often implies the speaker thinks rain is unlikely or contrary to expectation, whereas the indicative is neutral. The Unified camp says this is a pragmatic implicature; the Dual camp says it's baked into the semantics.

  ### 2. What Counts as Progress?
  You asked for honesty here. **Progress in the armchair semantics of conditionals has effectively stalled.**

  *   **A construction one side can't handle?** Unlikely. Both sides are incredibly adept at adding covert operators, shifting temporal indices, or tweaking ordering sources to accommodate new data. Every "counterexample" is met with a "refinement."
  *   **A proof that two machines are one?** This happens formally (you can model selection functions using restrictors), but it doesn't solve the *explanatory* problem. Just because you *can* unify them mathematically doesn't mean the cognitive or linguistic reality *is* unified.
  *   **Under-specification?** This is the most honest assessment. The question is under-specified because "semantics" is not a natural kind. Are we modeling the logical structure of propositions, the psychological processing of speakers, or the social norms of assertion?
      *   If we are modeling **logic**, the Unified view often wins on elegance.
      *   If we are modeling **psychology**, the Dual view often wins on experimental data (people process indicatives and counterfactuals differently in reaction time and brain imaging).
      *   If we are modeling **probability** (Adams' Thesis), we run into Lewis's Triviality Results, which suggest you cannot have truth conditions, probability, and logic all align perfectly.

  Real progress is currently happening not in pure semantics, but in **experimental pragmatics** and **formal epistemology**. The field is moving away from asking "What is the truth condition?" to "How does this update the common ground?" (Dynamic Semantics).

  ### 3. The Hard Pivot: Why This Won't Win Your Deposit
  I need to be blunt, because you said this is eating your evenings. **Winning the linguistic argument will not win the legal argument.**

  Contract law does not care about the Stalnaker-Lewis-Kratzer debate. Courts do not interpret contracts based on the metaphysical accessibility relations of possible worlds. They interpret them based on:
  1.  **The Reasonable Person Standard:** How would a layperson understand this clause?
  2.  **Contra Proferentem:** If a clause is ambiguous (which your linguistic analysis proves it is), it is interpreted *against* the party that drafted it (the letting agent).
  3.  **Intent and Commercial Purpose:** What was the clause trying to achieve? (Usually: protecting the landlord from unauthorized occupants, not punishing linguistic technicalities).

  If the clause says "If you sublet... deposit forfeit," and you sublet, you are likely in breach regardless of whether the conditional is indicative or counterfactual. The agent is not arguing about modal force; they are arguing about *fact*. Did you sublet? Yes. Does the contract forbid it? Yes.

  The only angle where semantics matters legally is **ambiguity**. If the clause is genuinely unintelligible, a court might void it. But "If you sublet without permission" is standard legal English. The fact that a linguistics postgrad can deconstruct its modal presuppositions is irrelevant to a judge. A judge will not accept an argument that "The counterfactual implication of the forfeiture clause renders it void because the antecedent was not settled in the evaluation world."

  ### 4. Recommendation
  You have wandered into a profound philosophical problem that has occupied the best minds in language for 50 years. It is a wonderful problem to think about, but it is a terrible tool for tenant advocacy.

  *   **Stop reading Stalnaker.** It will not help you get your money back.
  *   **Start reading the Housing Act (or local equivalent).** Look for regulations on deposit protection schemes.
  *   **Focus on "Reasonableness."** In tenancy disputes, the question is rarely "Is this sentence semantically coherent?" but "Is this deduction fair and supported by evidence of damage/loss?"
  *   **Use the Ambiguity Argument Pragmatically.** Don't cite Kratzer. Cite *contra proferentem*. Tell the agent: "This clause is ambiguous regarding the conditions of forfeiture. Under standard contract interpretation principles, ambiguity is resolved against the drafter. I expect the full deposit returned."

  **Summary:** The disagreement in linguistics is a methodological stalemate over whether semantics models logic or cognition. Progress is unlikely without empirical data. But in your dispute, the "truth condition" of the conditional matters less than the "force" of the tenancy tribunal. Save the semantics for the pub; save the contract law for the agent.
