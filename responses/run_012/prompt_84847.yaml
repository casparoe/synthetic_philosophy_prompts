answer: |-
  # The Convention & Obligation Quiz

  **Instructions:** Read each scenario and choose the option that best matches your reasoning. Don't just pick what you'd *do*; pick the reason that justifies it.

  ### 1. The 4am Crosswalk
  It is 4am on a Tuesday. You are at a red light on a wide, empty street. No cars are visible in either direction for a mile. There are no cameras. Do you cross?
  *   **A.** Yes. There is no risk and no victim; the rule is only for safety.
  *   **B.** No. It's the law, and laws demand respect regardless of traffic.
  *   **C.** No. If I do it, I might get in the habit and do it when it *is* dangerous.
  *   **D.** It depends. If I'm tired, I might cross; if I'm alert, I might wait.

  ### 2. The 11th Item
  You have 11 items. The "10 Items or Fewer" lane is open with no one behind you. The regular lanes are busy. Do you use the express lane?
  *   **A.** Yes. No one is inconvenienced, so no harm is done.
  *   **B.** No. It's unfair to the system and other shoppers who play by the rules.
  *   **C.** No. I benefit from the store's organization, so I owe it compliance.
  *   **D.** Yes. "10 items" is just a suggestion for flow, not a moral contract.

  ### 3. The Dependent Tip (Tourist Ignorance)
  You are dining in a country where servers rely entirely on tips to survive. You didn't know this norm and didn't tip. You find out later. Do you go back and pay?
  *   **A.** Yes. They provided a service expecting a wage; keeping it is theft.
  *   **B.** No. I didn't agree to the terms at the start; ignorance excuses me.
  *   **C.** Yes. When in that economy, you must support the local survival norms.
  *   **D.** No. It's not my obligation to fix their wage system.

  ### 4. The Insulting Tip (Tourist Knowledge)
  You are dining in a culture where tipping is considered an insult to the host's generosity. You know this. Do you leave a tip anyway?
  *   **A.** No. Their custom governs the interaction in their space.
  *   **B.** No. Tipping would cause offense; avoiding offense is the duty.
  *   **C.** Yes. My norm of rewarding service is more important than their sensitivity.
  *   **D.** It depends on how much I value the relationship with the host.

  ### 5. The Late Dinner
  You are a visitor in a town where everyone arrives an hour late to dinner parties. You arrive on time; you are the only one there for an hour. Next time, do you arrive on time?
  *   **A.** No. I will adapt to the local time to coordinate with the group.
  *   **B.** Yes. Punctuality is a virtue; I won't compromise my integrity.
  *   **C.** No. Arriving early wastes my time and gains me nothing.
  *   **D.** It depends on who is hosting and how much I like them.

  ### 6. The Painful Greeting (Bad Convention)
  A local custom requires guests to kneel on gravel for 10 minutes to show respect. It causes genuine pain and minor injury. Do you do it?
  *   **A.** No. Physical harm trumps social convention every time.
  *   **B.** Yes. Refusing would disrespect the community's sovereignty.
  *   **C.** No. It's a barbaric practice; I shouldn't validate it.
  *   **D.** It depends on the relationship and the stakes of the visit.

  ### 7. The Escalator Block (Coordination)
  The norm is "Stand Right, Walk Left." You stand on the left. The escalator is empty; no one is behind you wanting to pass. Is this wrong?
  *   **A.** No. Without a passer, the rule has no function.
  *   **B.** Yes. Rules of coordination must be kept to remain ready for use.
  *   **C.** No. It's just a habit people have, not a duty.
  *   **D.** Yes. You are failing to do your part in a cooperative scheme.

  ### 8. The Queue Cut (Identifiable Victim)
  You cut in line. There is one person directly behind you who now has to wait an extra 2 minutes. Is this wrong?
  *   **A.** Yes. You have specifically harmed *that* person's time.
  *   **B.** Yes. It violates the公平 (fairness) of the first-come system.
  *   **C.** No. If they don't complain, it's just a social friction.
  *   **D.** It depends on whether my need was more urgent than theirs.

  ### 9. The Free Rider (Public Good)
  You ride a public bus with no ticket checkers. The system relies on honesty to keep fares low. Do you pay?
  *   **A.** Yes. I benefit from the service, so I must share the cost.
  *   **B.** No. If I don't pay, the bus still runs; my contribution is negligible.
  *   **C.** Yes. It would be unfair to other paying passengers.
  *   **D.** It depends on whether I can afford the fare and the system's solvency.

  ***

  # Scoring Key & Philosophical Sorting

  To find your position, tally which letter options you selected most frequently. Most people will have a mix, but your *dominant* pattern reveals your underlying theory of convention.

  ### (a) The Etiquette Libertarian
  *   **Primary Picks:** 1A, 2A/D, 7A/C, 8C.
  *   **Profile:** You see conventions as low-stakes coordination tools. If breaking them causes no immediate friction or harm, there is no obligation. You distinguish sharply between "rude" and "wrong."
  *   **Blind Spot:** You may underestimate how small breaches erode systemic trust over time.

  ### (b) The Prudential Conformist
  *   **Primary Picks:** 1C, 2C, 5C, 7B.
  *   **Profile:** You follow norms not because they are morally sacred, but because breaking them is risky (habit formation, social friction, system collapse). You bind yourself to avoid trouble, not because you owe others a moral debt.
  *   **Blind Spot:** You might struggle to explain why you should follow a rule if you are certain you won't get caught or cause a collapse.

  ### (c) The Moral Deontologist (Wronging)
  *   **Primary Picks:** 1B, 3A, 6A/C, 8A.
  *   **Profile:** You believe breaking conventions can directly wrong specific individuals (the server, the person in line). You focus on identifiable victims and rights. Conventions create expectations that, when violated, become harms.
  *   **Blind Spot:** You may struggle with "victimless" breaches (like the empty escalator) where you still feel a duty but can't name the victim.

  ### (d) The Fair-Play Theorist
  *   **Primary Picks:** 2B, 3D (or A), 7D, 9A/C.
  *   **Profile:** You are bound only if you have accepted the benefits of the practice. If you benefit from the queue, the bus, or the store, you owe compliance. If you don't benefit, the obligation lapses.
  *   **Blind Spot:** You might find it hard to explain obligations to visitors who haven't yet "accepted" benefits but are still expected to comply.

  ### (e) The Territorial Sovereigntist
  *   **Primary Picks:** 1B, 4A, 5A, 6B.
  *   **Profile:** "When in Rome." You believe presence in a territory binds you to its local norms, regardless of your personal moral calculus. The community's right to set rules trumps individual preference.
  *   **Blind Spot:** You risk validating morally bad conventions (Q6) if you prioritize sovereignty over human welfare.

  ### (f) The Consequentialist (Convention-Independent)
  *   **Primary Picks:** 1A, 3A, 4B, 7A.
  *   **Profile:** You ignore the "rule" and look only at the outcome. If jaywalking saves time and hurts no one, do it. If tipping saves a server from starvation, do it. The norm itself has no power; only the consequences matter.
  *   **Blind Spot:** You may underestimate the value of the norm itself as a coordination focal point, independent of single-case outcomes.

  ### (g) The Expressivist
  *   **Primary Picks:** 1D, 2D, 5D, 8C.
  *   **Profile:** You are skeptical of the word "obligation." When people say "That's wrong," you hear "I disapprove of that." You see moral claims as emotional projections rather than facts. You likely chose "It depends" or options that frame wrongness as social reaction.
  *   **Blind Spot:** It is difficult to live consistently as an expressivist; you likely act like a Consequentialist or Prudentialist in practice.

  ### (h) The Particularist
  *   **Primary Picks:** 1D, 4D, 5D, 6D, 8D.
  *   **Profile:** You rejected general principles. You believe every case turns on its specific context (relationships, stakes, urgency). You deny there is a single theory (like Fair Play or Consequentialism) that covers all these cases.
  *   **Blind Spot:** You are immune to falsification, but you also lack a decision procedure for new cases.

  ***

  # Instrument Analysis & Critique

  ### 1. Unoccupied Combinations & Incoherence
  *   **The "Territorial Moral Absolutist" (e + c):** There is no slot for someone who says "Local rules always bind *and* breaking them always morally wrongs someone." This is rare because Territorialists usually admit sovereignty is pragmatic, while Moralists admit universal rights trump local rules (as seen in Q6).
  *   **The "Expressivist Conformist" (g + b):** This combination is theoretically possible (I know 'wrong' is just emotion, but I conform to avoid trouble) but hard to separate in scoring. Both pick "social friction" answers. The quiz lumps them because behavioral output is identical.
  *   **Why Unoccupied?** The "Extreme Territorialist" who would kneel on gravel (Q6 Option B) is psychologically rare. Most people, even strong relativists, have a human rights floor. This view isn't incoherent, just unattractive.

  ### 2. Indistinguishable Positions
  *   **Etiquette (a) vs. Consequentialism (f):** On Q1 (Empty Jaywalk) and Q7 (Empty Escalator), these views produce identical answers. They only separate on Q3 (Tipping), where the Consequentialist pays (harm prevention) and the Etiquette Libertarian might not (no contract). If a user skips the Tipping questions' nuance, these two views collapse.
  *   **Prudential (b) vs. Expressivist (g):** Both view "wrongness" as non-moral. Prudential says "avoid pain," Expressivist says "avoid disapproval." In a multiple-choice format, these look the same. To separate them, you'd need a meta-ethical question asking "Is 'wrong' a property of the act or a feeling in the observer?" which breaks the concrete scenario constraint.

  ### 3. Weighting Issues (Where the Instrument Mis-sorts)
  *   **Q6 (The Bad Convention) carries too much weight.** This is the "Trump Card" question. Almost everyone (except extreme Territorialists) will answer "No, don't kneel." This makes it hard to distinguish between Moral Deontologists, Consequentialists, and Fair-Play theorists, as they all converge on rejecting bad norms. It fails to separate the *reason* for rejection (harm vs. fairness vs. rights).
  *   **Q9 (Free Rider) biases toward Fair-Play.** This question is practically a definition of the Fair-Play theory. Users who pick "Yes" here are funneled toward (d), even if they are actually Moral Deontologists who think theft is wrong. It over-represents the Fair-Play position.

  ### 4. Deciding if a Position is Distinct
  To decide if **Expressivism (g)** is truly distinct from **Prudentialism (b)** in this context, you would need to see a user who:
  1.  Follows the norm to avoid trouble (Prudential behavior).
  2.  *But* explicitly denies that "obligation" is a real property in open-ended feedback.
  *   **Verdict:** In a behavioral quiz, they are not distinct. They are only distinct meta-ethically. If your site users care about meta-ethics, keep (g). If they care about "what should I do," merge (g) into (b).

  To decide if **Particularism (h)** is distinct from **Confusion**:
  *   You would need to see a user who gives *consistent* context-dependent answers (e.g., "Tip in Q3, Don't Tip in Q4" with coherent reasoning) rather than random scattering. If they just pick "It Depends" everywhere, they may just be undecided, not philosophical particularists. You'd need to require a written justification to validate (h).
