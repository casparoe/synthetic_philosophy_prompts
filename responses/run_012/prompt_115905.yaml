answer: |-
  This is a pedagogical strategy of high caliber. By foregrounding the *constraints* on the theory rather than the *outputs*, you force the seminar to confront why the standard models fail before they even begin to defend their preferred numbers. You are asking for a meta-ethical audit of the discounting debate.

  Below is the specification you requested. I have audited your seeded list, distinguished structural necessities from normative commitments, added the missing critical constraints, and identified the structural tension that renders the problem potentially intractable.

  ### I. Audit of the Seeded Desiderata

  Here, I distinguish between **Formal/Structural Requirements** (which any theory must acknowledge to be coherent) and **Substantive Normative Commitments** (which reflect specific ethical camps). A theory can be adequate without accepting the latter, but it cannot be adequate if it ignores the former.

  | Desideratum | Classification | Rationale |
  | :--- | :--- | :--- |
  | **1. One-way direction of influence** | **Formal Requirement** | This is a causal fact, not a moral preference. Any theory that assumes reciprocity (e.g., standard contractarianism) fails structurally because future people cannot sanction or reward us. A theory must explain obligation without enforcement. |
  | **2. Moral symmetry (Temporal Neutrality)** | **Substantive Commitment** | *This is the parochial one.* It is the core axiom of Impartial Utilitarianism (Ramsey, Pigou, Singer). However, Contractualists, Prioritarians, or those emphasizing epistemic proximity may legitimately argue that "now" has moral salience. Treating this as non-negotiable begs the question against discounters. |
  | **3. Risk vs. Pure Time Preference** | **Formal Requirement** | Collapsing these is a category error. Discounting for the *probability* that no one will exist is distinct from discounting because they *will* exist later. A theory that conflates them is mathematically and conceptually incoherent. |
  | **4. Incommensurability / Non-substitutability** | **Substantive Commitment** | This is a preference of Pluralist or Capabilities approaches. Standard Welfarism assumes a common numeraire (utility). A theory can be adequate without accepting incommensurability, provided it justifies its metric. However, it must *address* the charge, not ignore it. |
  | **5. The Non-Identity Problem** | **Formal Requirement** | This is a logical feature of long-term policy (changing the future changes *who* is conceived). Any theory relying on "harm to specific future individuals" without addressing non-identity is structurally defective for long-term cases. |
  | **6. Divergence of Future Values** | **Formal Requirement** | This is an epistemic fact. We cannot assume future people will share our utility functions. A theory that projects current preferences indefinitely is empirically false. How it *weights* those divergent values is normative; acknowledging the divergence is mandatory. |
  | **7. Causal Opacity** | **Formal Requirement** | This is an epistemic constraint. Long-chain causality is opaque. A theory that requires precise knowledge of distant outcomes to generate a verdict is action-guiding only in illusion. It must handle radical uncertainty. |

  ### II. Missing Desiderata

  To make the specification complete, you must add constraints that prevent the theory from collapsing into absurdity or irrelevance.

  **8. The Non-Swamping Condition (Avoidance of Overdemandingness)**
  *   **Specification:** The theory must not require the present generation to sacrifice all consumable welfare for the sake of the future.
  *   **Why it is a Requirement:** If a theory demands infinite sacrifice, it is not a moral theory for agents; it is a demand for martyrdom. It fails the "ought implies can" test in a practical sense. If the future is vast (potentially infinite) and counts equally, the present is morally swamped. An adequate theory must explain why the present retains *some* weight.

  **9. The Person-Affecting Constraint (Intuitive Harm)**
  *   **Specification:** It should generally be possible to say that a policy is bad because it is worse *for someone*.
  *   **Why it is a Requirement:** This captures the deep intuition that morality is about how we treat individuals. While the Non-Identity Problem challenges this, a theory that completely severs the link between "bad policy" and "harmed individuals" risks becoming an abstract calculus of states of affairs that loses grip on moral agency.

  **10. Reflective Equilibrium with Near-Term Cases**
  *   **Specification:** The discounting function cannot yield results in the 50-year horizon that violently contradict our settled judgments about saving for children vs. grandchildren.
  *   **Why it is a Requirement:** If a theory works for the deep future but implies we should save nothing for our own grandchildren (or everything), it lacks continuity. It must bridge the near and the far without a jagged discontinuity.

  ### III. The Single Exclusionary Requirement

  If you must choose one desideratum that does the most work in filtering out standard candidates, it is:

  **The Distinction Between Risk/Uncertainty and Pure Time Preference (Desideratum #3).**

  *   **Why:** This distinction kills the standard economic defense of a positive discount rate.
      *   **Excludes Positive Pure Time Preference:** Most defenses of $\rho > 0$ (pure time preference) rely on "uncertainty about the future" or "probability of extinction." If you enforce Desideratum #3, you force these into the *risk* parameter, not the *time* parameter. This leaves $\rho$ exposed as a purely ethical claim about the lesser value of future lives, which is notoriously hard to defend (Ramsey's "ethically indefensible").
      *   **Excludes Strictly Zero Rate (in practice):** Conversely, enforcing this distinction prevents the zero-discount camp from hiding behind uncertainty. If $\rho = 0$, you cannot use "we might not be here" to lower the savings rate; you must calculate the explicit probability of extinction. This often leads to the "Swamping" result (see below).
      *   **Excludes Goods-Discounting:** It forces the debate onto welfare. If you discount goods (e.g., future wealth is worth less), you must explain why welfare derived from those goods isn't also discounted.

  By insisting on this separation, you strip away the technical camouflage. You force the economists to defend the ethics of $\rho$, and you force the philosophers to confront the math of infinite obligations.

  ### IV. The Incompatible Pair (The Impossibility Result)

  You asked to flag any pair of desiderata that cannot be jointly satisfied. If you want the seminar to end on a productive aporia, this is the tension you should highlight. It is not merely a tension; it is a formal impossibility under plausible conditions.

  **The Incompatible Pair:**
  1.  **Moral Symmetry (Temporal Neutrality):** The welfare of a future person counts equally to the welfare of a present person (Desideratum #2).
  2.  **The Non-Swamping Condition:** The theory must not demand catastrophic sacrifice from the present generation (Desideratum #8).

  **The Contradiction:**
  If the future is potentially infinite (or merely very long) and contains a vast number of people, and if we apply **Moral Symmetry** (zero pure time preference), the aggregate utility of the future becomes effectively infinite (or astronomically large).
  *   Mathematically: $\sum_{t=1}^{\infty} U_t$ diverges.
  *   Morally: Any finite cost to the present generation ($C_{now}$), no matter how catastrophic (e.g., reducing current population to subsistence levels), is outweighed by even a marginal increase in utility for the vast future ($\epsilon \times \infty > C_{now}$).

  **The Consequence:**
  You cannot hold both.
  *   If you keep **Moral Symmetry**, you must accept **Swamping**: The present generation is morally required to sacrifice almost everything for the future. This violates the **Non-Swamping Condition**.
  *   If you keep the **Non-Swamping Condition**, you must reject **Moral Symmetry**: You must introduce a positive rate of pure time preference (or a similar weighting device) to mathematically shrink the future's claim on the present. This violates the intuition of **Moral Symmetry**.

  **Seminar Conclusion:**
  The standard candidates fail because they try to hide this contradiction.
  *   **Positive Discount Rates** satisfy Non-Swamping but violate Moral Symmetry (often disguising the violation as "uncertainty").
  *   **Zero Discount Rates** satisfy Moral Symmetry but violate Non-Swamping (leading to paralysis or absurd demands).
  *   **Declining Discount Rates** attempt to split the difference but often fail to resolve the divergence in the limit.

  The conclusion for the seminar is that **long-term ethics may be structurally inconsistent.** We may be asking for a theory that satisfies impartiality and practical agency simultaneously, and the mathematics of time and population suggests these are mutually exclusive. The task of the seminar is not to solve this, but to decide which desideratum we are willing to break.
