answer: |-
  **Setup**
  Arthur is an exhausted senior accountant on April 16th. In the morning (Episode 1), he drinks a cup of coffee that tastes rich and warm; he feels a sensory buzz and thinks, "This is good." Later that afternoon (Episode 2), he opens a letter from the tax authority confirming no penalty is owed. He is too fatigued for a rush of adrenaline or a warmth in the chest; his body feels heavy and his mind dry. Yet, upon reading the line, he thinks, "Thank God," and settles into a state of genuine gladness, preferring this moment to the alternative. He reports that while he is pleased, he feels no distinct positive sensation, only the removal of worry and a cognitive assent to the outcome.

  **Analysis**
  In Episode 1, both theories agree: the Felt-Quality Theory (FQT) identifies the sensory buzz as a positive hedonic tone, and the Attitudinal Theory (AT) identifies Arthur's liking of the taste as a pro-attitude. The divergence occurs in Episode 2. AT counts this as pleasure because Arthur holds a pro-attitude of "being pleased" toward the state of affairs; he welcomes the outcome, satisfying the attitudinal criterion. FQT, however, struggles to locate the requisite phenomenal ingredient. The description stipulates exhaustion and a lack of sensory "buzz" or "warmth." If FQT insists pleasure *must* have a positive hedonic quality, it must either deny Arthur is pleased (contradicting his report) or posit a "cognitive glow" that Arthur explicitly fails to detect. The single feature doing the work is **affective flatness**: the presence of a robust pro-attitude in the absence of a distinct positive phenomenal tone. If you remove this feature—say, by making Arthur well-rested so the news triggers a dopamine rush—the phenomenology becomes salient, and both theories converge on "pleasure." The case collapses into agreement because the feeling then outruns or matches the attitude.

  **Steelman and Impact**
  The strongest defense for FQT is to argue that "gladness" *just is* a phenomenal quality, even if subtle or non-sensory. A FQT proponent would claim Arthur is introspectively mistaken: the "cognitive assent" he reports *has* a feel, and to deny it is to ignore the data of consciousness. This lands as a charge of introspective imperialism, forcing the subject to accept a "feeling" they deny having to save the theory. This bears primarily on hedonism's **definitional claim** (what pleasure *is*). If FQT is correct, Episode 2 is not pleasure, meaning hedonism excludes a major source of human well-being (quiet satisfaction). If AT is correct, the definition holds, but the **aggregative claim** (that pleasures can be summed) is in worse shape. Sensory feelings have intensity dimensions (brighter, warmer); attitudes do not obviously sum. How does one quantify "being pleased" about a tax letter against "enjoying" coffee without a common felt currency?

  **Verdict**
  The heterogeneity problem is fatal to classical, felt-quality hedonism but survivable for attitudinal hedonism only at the cost of measurability. The case demonstrates that "liking" can outrun "feeling" in ordinary, non-pathological contexts. Hedonism survives the definitional challenge only by becoming attitudinal, but this transforms it from a theory about maximizing a specific *experience* to maximizing a *relation* to experiences. This saves the extension of the concept (capturing Episode 2) but breaks the mechanism of calculation (aggregation). Therefore, the problem is not fatal to the *label* "hedonism," but it is fatal to the *substance* of the traditional view that well-being is a uniform phenomenal currency. The theory must become pluralist about value or accept that well-being is unquantifiable.

  *(Flag: This case leans on the contested reading that "gladness" can be purely cognitive. FQT proponents often argue that all pro-attitudes entail some affective tone, however faint. If that reading is accepted, the divergence vanishes, but only by redefining "feeling" to include any positive valuation, which risks trivializing the Felt-Quality distinction.)*
