answer: |-
  Hi there, it is great to hear you are running this session, and I think you are right to avoid a lecture format for this group. Journalists who are numerate but not formally trained in game theory will smell a textbook exercise from a mile away and disengage, so the key is to make the math emerge from a betting situation where their intuition initially leads them astray. I have designed a ninety-minute activity called the Portfolio Vote that relies on a single three-by-three matrix, some index cards, and a whiteboard, requiring no special equipment other than a way to display scores. The goal is to have them commit to strategies, lose points to a mixture they initially ignored, and then vote to eliminate the loser, thereby physically enacting the iterated elimination process. You will need to draw the payoff matrix on the whiteboard before they arrive, keeping the row player payoffs visible but covering the column player payoffs if you want to keep it simple, though for this specific lesson on mixed strategy dominance, we only really need the row player to feel the pressure, so you can treat the column choices as states of the world determined by a die roll to remove the suspicion that you are playing strategically against them.

  The matrix you should draw has three rows labeled A, B, and C, and three columns labeled X, Y, and Z. The payoffs for the row player are as follows. If the column is X, strategy A pays 10, B pays 0, and C pays 4. If the column is Y, strategy A pays 0, B pays 10, and C pays 4. If the column is Z, strategy A pays 4, B pays 4, and C pays 3. This is the heart of the session. Notice that C is not dominated by A alone because C beats A when the column is Y. C is not dominated by B alone because C beats B when the column is X. However, a fifty-fifty mix of A and B yields an expected payoff of 5 against X, 5 against Y, and 4 against Z, which strictly beats C in every single column. This is your ghost strategy. To run the game, divide the twenty-four participants into individual players, though you can let them sit in clusters of three to encourage shouting matches. Give each person three index cards labeled A, B, and C. Explain that they are investors choosing a portfolio for the quarter and that you, the facilitator, will roll a die to determine the market condition, where one through three correspond to columns X, Y, and Z. Tell them their goal is to maximize their total points over three rounds, and that the top scorer gets a bottle of wine or some similar token of bragging rights.

  In the first round, ask them to choose exactly one card to play face down. Collect the cards, tally the choices on the board, and then roll the die to determine the column. Calculate the payoffs based on the matrix and have them record their scores. You will likely see a significant cluster on C because it looks safe; it never gives a zero and it beats the pure strategies half the time. Do not reveal the matrix logic yet. For the second round, introduce a new rule called the Hedge. Tell them they can now play two cards instead of one, representing a split portfolio, but they must declare the split publicly. Encourage them to try splitting between A and B. Run the round with the same die roll mechanism. When you tally the scores, the people who played the A-B split will have strictly higher scores than those who played C, regardless of what the die roll was. This is the hinge moment. Ask the room why the C players lost. Someone will eventually realize that while no single strategy beat C, the combination did. Once this lands, ask them to vote on whether strategy C should be banned from the game for being irrational. If they agree, physically cross out row C on the whiteboard.

  Now you have a reduced two-by-three game. If you want to touch on the weak dominance order issue, this is where you can introduce a verbal tweak without changing the physical board. Tell them that now that C is gone, we look at the column player's incentives. If you assume the column player is trying to minimize your score, you can ask them which column looks worst for the house. In this specific matrix, Z holds the row player to 4 regardless of whether they play A or B, whereas X and Y expose the house to a payoff of 10. So a rational column player would never play X or Y if they know C is gone. However, to show the fragility of weak dominance, you can verbally propose a hypothetical change where Z only pays 4 against A but 3 against B. Now Z is weakly dominated by a mix of X and Y. Ask them if it matters which weakly dominated strategy gets eliminated first. You do not need to play this out fully as it consumes too much time, but you can use it to pivot the discussion. The main game should conclude with the elimination of C, leaving them with the realization that the solution space changed because a lottery beat a pure strategy.

  For the debrief, do not start with definitions. Start by asking the people who played C in the first round how they felt when the split players won. Ask them if they thought A was better than C or if B was better than C. When they say no, ask what beat C. Guide them to articulate that it was not a strategy but a rule for combining strategies. Only after they have described this phenomenon should you introduce the term mixed strategy dominance. Then ask them why we could cross out C permanently. They should realize that since the mix beats C everywhere, a rational player would never play C, and since everyone knows everyone is rational, everyone knows C will not be played. This is where you introduce iterated elimination. Ask them if the order mattered for eliminating C. They should see it did not, because the dominance was strict. Then pivot to the weak dominance hypothetical you mentioned earlier. Ask them if removing a strategy that is only sometimes worse than another could change the best response to the remaining strategies. Let them wrestle with the idea that weak dominance relies on the belief that the opponent might play the dominated strategy with zero probability, which is a stronger assumption than strict dominance.

  There are several ways this will predictably go wrong, and you should be ready to handle them without breaking the flow. The most common failure is arithmetic swamp. Journalists are numerate, but calculating expected values in their heads while trying to listen to instructions will cause lag. If you see them struggling with the math, stop and do the calculation for them on the board explicitly. Show the five versus four comparison clearly. Do not make them do the math themselves; the point is the conceptual surprise, not the arithmetic. Another failure mode is the teacher's pet dynamic. Someone will try to guess what you want them to find rather than playing to win. To counter this, emphasize the prize for the highest score and make the die roll public and random so they cannot game your psychology. If they suspect you are rigging the die to prove a point, the lesson collapses. Use a large visible die or a random number generator projected on the wall. A third failure is cynicism about the mix. Some will argue that in real life you cannot play half of a strategy. You need to acknowledge this but reframe it as a portfolio choice or a randomized policy, which is common in journalism and economics, such as auditing tax returns randomly rather than by rule.

  You must also be honest about what this activity cannot reproduce. No finite classroom game can make them feel the weight of common knowledge. They will understand that they should not play C, and they will understand that others should not play C, but the infinite recursion of I know that you know that I know will remain abstract. You will have to state this limitation outright in the debrief. Tell them that in the room, they eliminated C because you asked them to vote on it. In the real world, elimination happens because everyone realizes everyone else realizes the strategy is dead. That social coordination is the hard part of game theory that the points system simulates but does not fully replicate. Additionally, the weak dominance order issue is fragile. If you try to force it too hard, it will confuse the main point about mixed dominance. It is better to treat the weak dominance order as a footnote in the discussion rather than a second round of gameplay. If the energy is high, you can ask them to imagine a scenario where eliminating one weak option makes another option viable, but do not insist on a definitive resolution.

  Finally, keep the timeline tight. Spend fifteen minutes on setup and the first round, thirty minutes on the second round and the reveal of the mix, and forty-five minutes on the debrief and discussion. The debrief is where the learning happens, not the gameplay. If they are still arguing about the payoffs after forty minutes, cut the game short and move to the board. The visual of crossing out the row C is more powerful than another round of scoring. Ensure you have enough space on the whiteboard to redraw the reduced matrix after elimination so they can see the game shrinking. This visual contraction helps them feel the force of the elimination. Remember that your role is not to prove them wrong but to let the payoff structure prove them wrong. When the C players lose to the A-B splitters, let the silence sit for a moment before you explain why. That silence is where the concept lands. Good luck with the session, and trust that if the matrix is clear and the incentives are real, the ghost strategy will reveal itself.
