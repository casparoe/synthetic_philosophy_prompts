prompt: |-
  I run the substantiation desk at an advertising standards body. We get about forty claims a week — 'clinically proven', 'supports gut health', 'nine out of ten dentists recommend it' — and the caseworkers who screen them have fifteen minutes each and no philosphy. Our rule of thumb at the moment is basically 'is there a study', which is hopless, so I want to rebuild it on something better.

  I've been reading about the Nyāya school, which sorted the ways you can know a thing into perception, inference, comparison and testimony, and then spent centuries cataloguing the ways a reason can look fine and be rotten. Turn that into a procedure my desk can actually run: a fixed order of questions for each claim, what counts as a sufficient answer at each step, where the procedure stops with a straight no, and where it has to go to a human because it's a value call rather than a factual one. First pass should just be: which of the four ways of knowing is this claim really resting on, and is that one even available here — half our messes are people passing off what someone told them as if they'd seen it themselves.

  The bits I want carried over properly: the hidden condition that props up a generalisation (their stock example was wet fuel in the smoke-and-fire case — ours is the confounder, or the fact that every decent trial was run by the manufacturer); the reason that proves too much, since the same reason would equally support the opposite conclusion; the reason that quietly assumes what it's meant to prove (a survey of dermatologists offered as proof the cream works); and evidence that's simply been overtaken. They also distinguish inquiry that's genuinely trying to get it right from arguing in order to win, and I want that in as a step, because a good half of what lands on my desk is the second thing.

  Then run it on three: the probiotic, the dentist toothpaste, and a supplement whose whole file is one twenty-year-old study that nobody believes any more. That last one should come out as a no even though there is a study. Finish by telling me where the procedure will misfire and which steps are judgement dressed up as procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Runs the substantiation desk at an advertising standards body.
      *   **Problem:** Current system ("is there a study?") is insufficient. Caseworkers have 15 mins/claim, no philosophy background. Volume is ~40 claims/week.
      *   **Goal:** Rebuild the screening procedure based on the Nyāya school of Indian philosophy (specifically the *pramāṇas* or means of knowledge, and *hetvābhāsa* or fallacies).
      *   **Requirements:**
          *   Fixed order of questions.
          *   Clear criteria for sufficient answers.
          *   Stop points (straight no vs. human review).
          *   Distinguish factual vs. value calls.
          *   Incorporate specific Nyāya concepts:
              *   Four *pramāṇas* (Perception, Inference, Comparison, Testimony).
              *   Hidden conditions (*upādhi* / confounders).
              *   Reason proving too much (*satpratipakṣa* / contradictory evidence).
              *   Circular reasoning (*ātmāśraya* / begging the question).
              *   Outdated evidence (*badhita* / contradicted by superior knowledge).
              *   Intent (Inquiry vs. Winning).
          *   Apply to three specific cases: Probiotic ("supports gut health"), Dentist Toothpaste ("9/10 dentists recommend"), Supplement (one old study).
          *   Critique the procedure (where it misfires, where it's disguised judgment).

  2.  **Deconstruct Nyāya for a Modern Context:**
      *   *Pramāṇas* (Means of Knowledge):
          *   *Pratyakṣa* (Perception) $\rightarrow$ Direct observation/clinical data.
          *   *Anumāna* (Inference) $\rightarrow$ Logical deduction from data (mechanism of action).
          *   *Upamāna* (Comparison) $\rightarrow$ Analogy (less relevant for hard claims, but useful for "like product X").
          *   *Śabda* (Testimony) $\rightarrow$ Expert opinion, citations, authority.
      *   *Hetvābhāsa* (Fallacious Reasons):
          *   *Asiddha* (Unproven reason) $\rightarrow$ Data doesn't exist.
          *   *Viruddha* (Contradictory) $\rightarrow$ Evidence proves opposite.
          *   *Anaikāntika* (Inconclusive) $\rightarrow$ Evidence supports multiple conclusions.
          *   *Badhita* (Contradicted by stronger knowledge) $\rightarrow$ Old study vs. new consensus.
          *   *Ātmāśraya* (Circular) $\rightarrow$ Claim proves evidence, evidence proves claim.
          *   *Upādhi* (Limiting Condition/Confounder) $\rightarrow$ Hidden variable.
      *   *Tattvajijñāsā* (Desire for Truth) vs. *Vāda* (Debate for Victory).

  3.  **Drafting the Procedure (The "Nyāya Screen"):**
      *   *Constraint:* 15 minutes. Needs to be a checklist, not a thesis.
      *   *Step 1: The Source (Pramāṇa Check).* Identify the claim type. Is it testimony passed off as perception?
      *   *Step 2: The Intent (Truth vs. Victory).* Is the submission adversarial or cooperative? (Hard to judge in 15 mins, but look for obfuscation).
      *   *Step 3: The Reason (Hetu Check).* Is the evidence actually linked to the claim? (Circularity).
      *   *Step 4: The Confounder (Upādhi Check).* Is there a hidden condition? (Manufacturer bias, specific population).
      *   *Step 5: The Counter-Evidence (Badhita/Viruddha Check).* Is the evidence old or contradicted?
      *   *Step 6: The Verdict.* Pass, Fail, or Escalate.

  4.  **Refining the Steps for Caseworkers:**
      *   Make the language plain English but rooted in the concepts.
      *   Define "Stop" conditions clearly.
      *   Ensure the "Old Study" case fails at Step 5.
      *   Ensure the "Dentist" case fails at Step 3 or 4 (Testimony vs. Efficacy).
      *   Ensure the "Probiotic" case goes to Human Review (Inference/Value call).

  5.  **Running the Cases:**
      *   *Case 1: Probiotic ("Supports Gut Health").* Likely Inference/Testimony mix. Needs mechanistic data + clinical. High risk of *Upādhi* (strain specificity). Verdict: Escalate.
      *   *Case 2: Dentist ("9/10 Recommend").* Testimony (*Śabda*). Common trap: Recommendation $\neq$ Efficacy. Circular if the survey asks "Do you recommend this effective toothpaste?" Verdict: Fail (Claim mismatch) or Escalate (if survey methodology is opaque). Let's make it a Fail on "Reason proves too much" or "Circular". Actually, the prompt says "survey of dermatologists offered as proof the cream works" as an example of circularity. For dentists, it's often *Anaikāntika* (Inconclusive) - they might recommend it for taste, not health. Let's flag it as a mismatch between Testimony and Fact.
      *   *Case 3: Supplement (One 20-year-old study).* This is *Badhita* (Contradicted by time/consensus). Verdict: Straight No.

  6.  **Addressing the "Critique" Requirement:**
      *   Where does it misfire? Nuance, emerging science, intent detection.
      *   Where is it disguised judgment? Step 2 (Intent) and Step 4 (Confounder significance).

  7.  **Review against Constraints:**
      *   Did I use the Nyāya terms? Yes, but translated for the desk.
      *   Is it 15 minutes? Needs to be tight.
      *   Did I cover the specific fallacies requested? (Hidden condition, proves too much, circular, overtaken).
      *   Did I cover the "Truth vs. Winning" aspect? Yes.

  8.  **Final Polish:**
      *   Tone: Professional, operational, slightly academic but practical.
      *   Structure: Introduction -> The Protocol -> The Cases -> The Critique.
      *   Ensure the distinction between *Pramāṇa* (Source) and *Hetvābhāsa* (Fallacy) is clear in the workflow.

      *(Self-Correction during drafting)*: I need to make sure I don't just list Nyāya terms but *operationalize* them. Instead of asking "Is this *Upādhi*?", ask "Is there a hidden condition that limits this result?"
      Also, the "Intent" step is tricky for a caseworker looking at a file. I need to make it about the *presentation of evidence* (e.g., withholding negative studies) rather than mind-reading.

      *(Refining the "Dentist" case)*: The prompt mentions "nine out of ten dentists recommend it". The Nyāya angle on this is often *Śabda* (Testimony) being used where *Pratyakṣa* (Perception/Data) is needed for a health claim. Or it's *Anaikāntika* (Inconclusive) because recommendation doesn't equal clinical superiority. I will categorize it as a mismatch of *Pramāṇa*.

      *(Refining the "Old Study" case)*: This is classic *Badhita* (contradicted by later knowledge). Even if the study exists, the knowledge is invalidated.

      *(Refining the "Probiotic" case)*: "Supports gut health" is vague. Likely *Anaikāntika* (Inconclusive) or requires *Anumāna* (Inference) which is risky. This needs human review.

  9.  **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  Here is a operational protocol based on the Nyāya system, adapted for a 15-minute screening window. It strips the metaphysics but keeps the logical rigour.

  ### The Nyāya Substantiation Protocol (NSP)

  **Time Limit:** 15 Minutes
  **Objective:** Filter claims into **Pass**, **Fail**, or **Review**.
  **Core Principle:** Match the *Type of Claim* to the *Type of Evidence*. Identify the *Flaw in the Reason*.

  ---

  #### Step 1: The Source Check (*Pramāṇa* Match)
  *Identify what kind of knowledge the claim requires, and check if the evidence provided is actually that kind.*

  **Question:** Is the claim about a physical fact (efficacy, ingredients) or an opinion (preference, recommendation)?
  *   **Fact Claim:** Requires *Pratyakṣa* (Direct Observation/Clinical Data).
  *   **Opinion Claim:** Requires *Śabda* (Testimony/Survey).

  **The Trap:** Submitting *Śabda* (Testimony) for a *Pratyakṣa* (Fact) claim.
  *   *Example:* "Dentists recommend this" (Testimony) used to prove "This prevents cavities" (Fact).
  *   **Action:** If a Fact Claim is supported *only* by Testimony $\rightarrow$ **FAIL**.
  *   **Action:** If the evidence is *Upamāna* (Analogy/Comparison, e.g., "Works like Drug X") without direct data $\rightarrow$ **REVIEW**.

  #### Step 2: The Intent Check (*Tattvajijñāsā* vs. *Vāda*)
  *Distinguish inquiry for truth from argument for victory. Look for obstruction.*

  **Question:** Does the submission disclose limitations, or does it hide them?
  *   **Truth-Seeking:** Provides full study reports, admits sample size limits, cites conflicting data.
  *   **Victory-Seeking:** Provides only abstracts, redacts methodology, cites only internal studies, ignores negative findings.

  **Action:** If evidence is selectively redacted or negative studies are known to exist but absent $\rightarrow$ **FAIL** (Burden of proof not met).
  **Action:** If the file is transparent but the science is complex $\rightarrow$ **REVIEW**.

  #### Step 3: The Circular Reason Check (*Ātmāśraya*)
  *Ensure the reason doesn't assume the conclusion.*

  **Question:** Does the evidence rely on the claim being true to be valid?
  *   *The Trap:* A survey asking "Do you recommend this *effective* cream?"
  *   *The Trap:* "Clinically proven" where the "clinical trial" was an uncontrolled user testimonial collection.

  **Action:** If the methodology presupposes the result $\rightarrow$ **FAIL**.

  #### Step 4: The Hidden Condition Check (*Upādhi*)
  *Identify the confounder. Nyāya uses the example of 'wet fuel' causing smoke without fire.*

  **Question:** Is there a variable other than the product that explains the result?
  *   **Common Confounders:** Manufacturer funding (bias), specific population (e.g., sick mice vs. healthy humans), short duration (acute vs. chronic), combination therapy (was it used with other drugs?).

  **Action:** If the study is exclusively manufacturer-funded with no independent replication $\rightarrow$ **REVIEW** (Requires senior assessment on bias weight).
  **Action:** If the study population does not match the target consumer (e.g., trial on adults, ad targets children) $\rightarrow$ **FAIL**.

  #### Step 5: The Contradiction Check (*Badhita* & *Satpratipakṣa*)
  *Check if the reason is overtaken or proves too much.*

  **Question A (*Badhita*):** Is this evidence contradicted by superior, newer knowledge?
  *   *Example:* A 20-year-old study on a supplement where current consensus deems the mechanism impossible.
  *   **Action:** If evidence is obsolete per current scientific consensus $\rightarrow$ **FAIL**. (Presence of a study is irrelevant if the study is *badhita*).

  **Question B (*Satpratipakṣa*):** Does the same evidence support the opposite conclusion?
  *   *Example:* "Increases heart rate" used to prove "Improves fitness" (could also prove "Stress response").
  *   **Action:** If the data is equally consistent with a neutral or negative outcome $\rightarrow$ **FAIL**.

  ---

  ### Case Runs

  #### Case 1: The Probiotic ("Supports Gut Health")
  *   **File:** Three studies. Two in vitro (petri dish), one human trial on a specific strain not in the product.
  *   **Step 1 (Source):** Claim is Fact (*Pratyakṣa*). Evidence is mixed Inference (*Anumāna* from petri dish) and Mismatched Testimony. $\rightarrow$ **Warning.**
  *   **Step 4 (Hidden Condition):** The human trial used Strain A; product contains Strain B. This is a classic *Upādhi* (limiting condition). Probiotic effects are strain-specific.
  *   **Step 5 (Contradiction):** General consensus requires strain-specific data.
  *   **Verdict:** **REVIEW.**
  *   **Reasoning:** It's not a straight fail because *some* human data exists, but the *Upādhi* (strain mismatch) is a technical scientific judgement. A caseworker cannot rule on strain equivalence in 15 minutes. This goes to a scientific advisor.

  #### Case 2: The Dentist Toothpaste ("9 Out of 10 Dentists Recommend")
  *   **File:** Survey of 500 dentists. Question asked: "Which toothpaste do you recommend for patients concerned about cavities?"
  *   **Step 1 (Source):** Claim implies superior efficacy (Fact), but evidence is Testimony (*Śabda*).
  *   **Step 3 (Circularity):** Not strictly circular, but...
  *   **Step 5 (Proves Too Much):** *Anaikāntika* (Inconclusive). Dentists may recommend it for taste, cost, or availability, not clinical superiority. The reason (recommendation) does not uniquely prove the implied claim (best for health).
  *   **Verdict:** **FAIL** (unless qualified).
  *   **Reasoning:** Testimony cannot substantiate a clinical implication without a bridge study linking recommendation to clinical outcome. The claim implies "Best for health," the evidence proves "Popular among dentists." Mismatch.

  #### Case 3: The Supplement (One 20-Year-Old Study)
  *   **File:** One randomised control trial from 2003. Positive result. No new studies.
  *   **Step 1 (Source):** Claim is Fact. Evidence is *Pratyakṿa* (Observation). **Passes Step 1.**
  *   **Step 2 (Intent):** Submission hides that 5 newer systematic reviews exist. **Warning.**
  *   **Step 5 (Contradiction - *Badhita*):** Current scientific consensus (2024) regards the mechanism studied in 2003 as disproven. The study is *badhita* (contradicted by superior knowledge).
  *   **Verdict:** **FAIL.**
  *   **Reasoning:** This is the critical test of your new system. The old rule ("Is there a study?") would Pass this. The Nyāya rule ("Is the knowledge valid?") Fails it. A reason overtaken by time is a false reason.

  ---

  ### Critique: Where the Procedure Misfires

  **1. The "Intent" Step is Disguised Judgment**
  Step 2 asks caseworkers to judge *Tattvajijñāsā* (Truth-Seeking) vs. *Vāda* (Victory). In 15 minutes, they cannot know the advertiser's mind. They are actually judging *clarity*, not intent. A messy file from a small innovator might look like "Victory" (obfuscation) when it's just incompetence. A slick file from a big pharma company might look like "Truth" when it's sophisticated cherry-picking.
  *   **Risk:** You will penalise the disorganised honest and reward the organised deceptive.

  **2. The *Upādhi* (Confounder) Trap**
  Step 4 requires identifying hidden conditions. This is the hardest logical move in Nyāya. It requires knowing what you *don't* know.
  *   **Risk:** Caseworkers will flag *everything* as a potential confounder to be safe, flooding the "Review" queue. Or, they will miss subtle confounders (e.g., diet control in a weight loss trial) because they aren't nutritionists. This step effectively turns caseworkers into junior scientists, which violates your "no philosophy/science" constraint.

  **3. The *Badhita* (Overtaken) Problem**
  Step 5 requires knowing "current consensus."
  *   **Risk:** Who defines consensus? If the caseworker Googles it, they are relying on *Śabda* (Testimony) from the internet. If they rely on internal databases, those databases age. You need a static "Red List" of disproven mechanisms, or this step becomes subjective.

  **4. Value Calls Masquerading as Facts**
  Nyāya is excellent at truth, but advertising often lives in *value*. "Supports gut health" (Case 1) is borderline. Is "support" a clinical claim or a wellness vibe?
  *   **Risk:** The procedure treats all claims as empirical. If a claim is actually a puffery/value statement, the NSP will try to substantiate it scientifically and Fail it, or Pass it on weak evidence because the bar was set too high. You need a "Puffery Check" before Step 1.

  ### Implementation Advice
  To make this stick:
  1.  **Hardcode Step 5:** Give caseworkers a "Disproven Mechanisms" lookup table. Don't ask them to judge consensus; ask them to match against a list.
  2.  **Redefine Step 2:** Change "Intent" to "Transparency." Did they provide the full protocol? Yes/No. Remove the psychological judgement.
  3.  **The "Review" Bucket:** Accept that Step 4 (*Upādhi*) will send 40% of cases to Review. That is better than passing bad claims. The procedure's job is not to decide the hard cases, but to correctly identify *which* cases are hard.

  This system moves you from "Is there a paper?" to "Is the reason valid?" It won't catch everything, but it will catch the sophisticated lies that the old rule missed.
