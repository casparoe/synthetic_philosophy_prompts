  # Joint Statement on Causation, Necessity, and Regularity
  **Signed:** [The Occasionalist] & [The Humean]
  **Date:** [Current Term]

  ## Part (a): Points of Agreement

  We, the undersigned, acknowledge the following points of consensus regarding our critique of the Peripatetic (Aristotelian/Avicennian) account of necessary connection in nature:

  1.  **Observation:** In our empirical observation of the world, we never perceive a "tie," "glue," or necessary power linking two events. We observe only temporal priority, spatial contiguity, and constant conjunction (Event A is followed by Event B).
  2.  **A Priori Knowledge:** There is no logical contradiction in conceiving of a cause occurring without its usual effect. We cannot demonstrate *a priori* that fire must burn cotton or that bread must nourish; the opposite is logically conceivable.
  3.  **Causal Power in Nature:** We have no empirical evidence that created objects (fire, cotton, stones) possess intrinsic causal efficacy or power by virtue of their own essences. To assert such power is to go beyond what experience warrants.
  4.  **Grounds of Induction:** Our confidence that the future will resemble the past is not grounded in logical demonstration or rational proof. It relies on a psychological expectation or habit formed by repeated experience, not on a perceived necessity in the objects themselves.
  5.  **Possibility of Miracles:** A violation of observed natural regularities is not a logical impossibility. The uniformity of nature is contingent, not necessary; therefore, an exception to the regular course of events is metaphysically possible (even if epistemologically difficult to verify).

  ***

  ## Part (b): Points of Remaining Disagreement

  | Point at Issue | The Occasionalist's Position | The Humean's Position | Substantive or Verbal? | Agreed Test Case / Argument | Prediction (Occasionalist) | Prediction (Humean) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Ontological Ground of Regularity** | The consistent conjunction of events is sustained by the continuous Will of a Divine Agent who chooses to act according to a habitual order. | The consistent conjunction of events is a brute fact of the universe; positing a Will behind it is an unnecessary hypothesis beyond experience. | **Substantive.** This is a disagreement about what exists (God vs. Brute Fact), not just how we speak. | **The Cosmological Argument from Contingency.** Does the contingency of natural sequences require a necessary sustainer? | The argument succeeds; contingency implies a Necessary Sustainer. | The argument fails; an infinite series of contingent events requires no external explainer. |
  | **2. The Definition of 'Cause'** | A 'true cause' must possess genuine efficacy (the power to produce an effect). Since creatures lack this, they are merely 'occasions,' not causes. | A 'cause' is nothing more than an object followed by another, where the appearance of the first conveys the thought to the second. Efficacy is a projection. | **Mostly Verbal.** We agree on the phenomenology but disagree on whether the word 'cause' should retain the meaning of 'efficacy' or be redefined as 'regularity.' | **Conceptual Analysis of 'Power'.** Can we form a coherent idea of 'power' distinct from 'action'? | Yes; we have an intuitive notion of agency/power derived from our own will (or knowledge of God). | No; the idea of 'power' is empty if it cannot be traced to an impression of sensation or reflection. |
  | **3. The Status of 'Necessity'** | There is no necessity in nature, but there is necessity in the Divine Will (God does not change arbitrarily). Natural 'necessity' is just God's reliable habit. | There is no necessity anywhere, neither in nature nor in a Divine Will. 'Necessity' is merely a feeling of determination in the mind of the observer. | **Substantive.** One side affirms a type of necessity (Divine), the other dissolves the concept entirely. | **The Possibility of Change.** Could the laws of nature change tomorrow without reason? | No; God's wisdom ensures His habit remains stable unless He wills a miracle. | Yes; there is no rational guarantee the sun will rise tomorrow, not even a Divine one. |
  | **4. Epistemic Warrant for Miracles** | Miracles are possible and can be known through reliable testimony (Revelation), as God can interrupt His habit to signify truth. | Miracles are so contrary to uniform experience that no testimony is sufficient to establish them, unless the falsehood of the testimony would be more miraculous. | **Substantive.** This is a disagreement about epistemology and the weight of testimony vs. natural law. | **A Reported Resurrection.** How should we weigh testimony of a dead man coming to life? | We should accept it if the witnesses are reliable, as God can break His habit. | We should reject it, as uniform experience against resurrection outweighs any human testimony. |

