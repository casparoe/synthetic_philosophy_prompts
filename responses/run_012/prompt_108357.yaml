answer: |-
  This is a brilliant starting point. You have already identified the single biggest trap in this field: the temptation to answer the metaphysical question ("*Can* objects be political?") rather than the empirical one ("*How* does this object organise people?").

  Your supervisor is right to be wary. If you spend 2,000 words defining "politics," you will have no room left to actually say anything about technology. For a 5,000-word EPQ, you need to treat the philosophy as a *tool*, not the *subject*.

  Here is the defended order of questions for your specific constraints (Year 12, 5k words, physics supervisor, school scanner case study).

  ### 1. The Mechanism Question (Upstream)
  **"Does this technology make some actions easier and others harder, and does that distribution match a political preference?"**

  *   **Why it's first:** This is the only question you can answer with evidence you can actually gather. You don't need a library for this; you need observation. You've already noticed half the students stopped buying snacks. That is data.
  *   **Why it fits your constraints:** A physics supervisor understands variables. Input (scanner), Output (purchase/no purchase), Constraint (biometric ID). This keeps your project grounded. If you can't establish that the technology *changes behaviour*, the rest of the essay collapses.
  *   **Word Count Allocation:** ~1,500 words.
  *   **The Trap:** Don't get stuck on whether this is "intentional." It doesn't matter if the designer wanted to stop kids eating snacks. If the *effect* is that snacks are suppressed, the political effect exists regardless of intent.

  ### 2. The System Question (Midstream)
  **"Is the politics in the scanner, or in the rule that says 'scanner or no lunch'?"**

  *   **Why it's second:** This addresses your worry about the "unit of analysis." A fingerprint scanner in a museum is not political. A fingerprint scanner linked to a bank account in a school is. You need to establish that the *politics* comes from the integration of the object into a social rule, not the plastic casing.
  *   **Why it fits your constraints:** This allows you to use the "School Scanner" example without overclaiming. You aren't arguing all scanners are tyrannical; you are arguing that *this implementation* creates a specific power dynamic (surveillance/efficiency vs. privacy/anonymity).
  *   **Word Count Allocation:** ~1,000 words.
  *   **The Trap:** Do not try to create a universal theory of "System vs. Object." Just solve it for your case study.

  ### 3. The Alternative Question (The Missing Link)
  **"Could the same goal have been achieved with a different technology, and if so, why was this one chosen?"**

  *   **Why it's third (and why I added it):** You mentioned your mate's point: "the whole debate is just a dressed-up way of saying we chose this and then forgot." **This is the most important insight you have.** This question tests that.
  *   **Why it beats the others:** If you find out the school chose scanners because they were cheaper than cashiers, the "politics" is actually economics. If they chose them because they wanted to track student movement, the "politics" is surveillance. If there was no other option (e.g. cash is illegal), then the tech isn't political, the law is.
  *   **Tractability:** You can ask the bursar or head of IT. "Why did we switch from cash/cards to biometrics?" Their answer gives you the "smoking gun" for your argument.
  *   **Word Count Allocation:** ~1,500 words.

  ### 4. The Resistance Question (Downstream)
  **"Can the users rewrite the script, or are they locked in?"**

  *   **Why it's fourth:** This addresses the "script" tension you mentioned. But it comes *after* you've established the mechanism. If students can just bring cash from home, or opt-out on medical grounds, the "politics" is weak. If they are truly locked in, the "politics" is strong.
  *   **Why it fits:** It adds nuance. It stops your essay from being a rant about "technology is bad." It shows you understand agency.
  *   **Word Count Allocation:** ~1,000 words.

  ---

  ### The "Do Not Touch" Zone (The Ontology Trap)
  **"Do artifacts *really* have politics / moral agency?"**

  *   **Why it's last (or excluded):** This is the question professional philosophers fight over for careers. It requires defining "agency," "intent," and "politics" from first principles.
  *   **Why you must avoid it:** In 5,000 words, you cannot solve this. If you try, you will write 3,000 words summarizing Langdon Winner and Bruno Latour, and 2,000 words saying "it's complicated." You will get a C because you haven't made an argument.
  *   **Strategy:** Treat this as a *premise*, not a question. State clearly in your introduction: *"For the purpose of this project, I am adopting Langdon Winner's working definition: technology is political if it consistently structures human relationships in a specific way."* Then move on. You are testing the definition, not defending it.

  ---

  ### Why This Order? (The Logic of Dependency)

  1.  **Mechanism first:** If the scanner doesn't actually change behaviour, nothing else matters.
  2.  **System second:** If the scanner is just a tool and the *rule* is the politics, you need to know that before analysing the choice.
  3.  **Alternatives third:** If there was no choice, there is no politics (just necessity). This validates your mate's critique.
  4.  **Resistance fourth:** If users can bypass it, the political power is limited. This is your evaluation/conclusion.

  ### What Would Move a Question Up or Down?

  *   **Move "The Alternative Question" to #1 if:** You interview the school admin and they say, "We chose this because the government told us to." If the choice was external, the "politics of the object" argument collapses, and your essay becomes about policy, not tech. You need to know this early.
  *   **Drop "The Resistance Question" if:** You find that 0% of students have opted out. If there is zero resistance, spending words on "could they resist?" is speculative. Instead, use those words to deepen the "System Question" (e.g., look at the data privacy implications).
  *   **Move "The Ontology Question" up slightly if:** Your supervisor insists on a "theoretical framework." In that case, spend 500 words max explaining Winner's *Do Artifacts Have Politics?* as your lens, but do not try to improve upon it.

  ### A Note on Your Mate's Critique
  Your mate is channeling a concept called **Technological Determinism vs. Social Construction of Technology (SCOT)**.
  *   **Determinism:** The tech forces us to act (The scanner makes us stop buying snacks).
  *   **SCOT:** We shaped the tech to make us act (We bought scanners to stop kids buying snacks).

  Your essay will get higher marks if you don't pick a side, but show the **loop**. The school chose the tech (Social) to achieve a goal (Politics), but now the tech enforces that goal automatically (Determinism). That "lock-in" you mentioned is the sweet spot for your conclusion.

  ### Summary Advice for the 5,000 Words
  1.  **Intro (500 words):** Hook with the snack story. State the thesis: *"Technology is not neutral; it encodes specific political choices that become invisible once installed."* Define "politics" using one sentence (Winner's definition).
  2.  **Section 1 (1,500 words):** The Mechanism. Evidence of behaviour change (your survey/observation).
  3.  **Section 2 (1,500 words):** The Choice. Why this tech? (Interviews/Research). Was there an alternative?
  4.  **Section 3 (1,000 words):** The System & Resistance. Is it the object or the rule? Can students opt-out?
  5.  **Conclusion (500 words):** Return to the mate's critique. Yes, we chose it, but now the choice is hidden. That hiding is the politics.

  This structure is ruthless. It cuts out the metaphysics, leans on your unique access to the school scanner, and gives your physics supervisor something concrete to assess (cause, effect, variables) while satisfying the EPQ requirement for critical analysis.
