prompt: |-
  I'm in Year 12 and I've somehow ended up doing my EPQ on whether technology has a politics of its own — the idea that a gadget or a system can push people around, not just because of who made it or what they wanted, but because of how it's built. It started as an argument with my mates about the new fingerprint scanners they've put on the lunch tills at school (you can't buy anything without a scan now, and I noticed half of us just stopped bothering with snacks), and then I read a few things for the lit review and now I genuinely can't tell whether the interesting question is the big one, can objects be political at all, or something much narrower hiding inside it. My supervisor teaches physics and is lovely but has told me, fairly, that he can't referee anything too philosophical, and I've got until next spring and about 5,000 words, so I need to be ruthless about what I actually spend the year on.

  So what I want from you isn't a reading list — I can't get hold of half the stuff anyway and I'd rather you didn't just name books at me. What I want is a defended order of the open questions in this area, for someone with my constraints: one year, one long essay, no proper philosophy training, and it has to count as original enough to actually get the marks. Which questions are upstream of which? For instance, does it matter whether we settle first what political even means here — a decision deliberately baked into the thing, versus a norm the thing quietly makes feel normal, versus just the fact that it makes some actions easy and others a total faff? Or is the prior question the unit of analysis: is it the single object, or the whole system it sits inside (one till isn't political, a school-wide biometric payments network might be)? Or is it about the script a designer supposedly writes for the user — I've seen it put as the object telling you what kind of person you're meant to be — and how much the user can rewrite that script? I also keep circling a tension I can't name properly: early on in a technology's life you can still change it but nobody knows what it'll do, and by the time everyone knows, it's too embedded to move. And a mate reckons the whole debate is just a dressed-up way of saying we chose this and then forgot we chose it, which if it's true would collapse most of the questions above into one.

  Rank the questions you think matter most, in order, and tell me why that order — what makes a question worth a year of a sixth-former's time rather than a professional philosopher's, which ones I could actually make progress on with a school library and a lot of stubbornness, and which ones look juicy but would definately eat the whole word count and leave me with nothing to say. Also tell me what would move a question up or down your list, like if I found X I'd drop Y. And if there's a big open question I haven't mentioned that you think belongs at the top, say so and explain why it beats the ones I've got.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Year 12 student (approx. 16-17 years old).
      *   **Task:** Extended Project Qualification (EPQ).
      *   **Topic:** Politics of Technology (specifically, "Do artifacts have politics?" à la Langdon Winner, but broader).
      *   **Constraints:** 5,000 words, 1 year timeline, no formal philosophy training, supervisor is a physicist (can't help with deep philosophical nuance), limited access to academic texts (school library/internet).
      *   **Goal:** Needs a *ranked order of open questions* to structure the project, not a reading list. Needs to know *why* this order works for *their* constraints. Needs to know what makes a question tractable vs. a trap. Needs to identify missing key questions.
      *   **Tone:** Intellectual but accessible, respectful of their intelligence (they've clearly done some reading already), practical, strategic.

  2.  **Deconstruct the User's Current Thoughts:**
      *   *Core Idea:* Technology pushes people around due to its build, not just intent.
      *   *Case Study:* School fingerprint scanners on lunch tills (behavioral change: stopped buying snacks).
      *   *Confusion:* Big question (Can objects be political?) vs. Narrow question (Hidden inside).
      *   *Specific Tensions Identified:*
          *   Definition of "political" (intent vs. norm vs. affordance).
          *   Unit of analysis (object vs. system).
          *   Script/Agency (designer's script vs. user rewriting).
          *   Time/Embedding (early flexibility vs. late lock-in).
          *   Determinism vs. Choice (did we just forget we chose this?).

  3.  **Evaluate the "Big Question" Trap:**
      *   "Do artifacts have politics?" is the classic Langdon Winner question.
      *   *Risk:* It's a philosophical quagmire. 5,000 words is nothing for ontology. A Year 12 student trying to solve "Can objects be moral agents?" will drown.
      *   *Strategy:* Shift from *ontology* (what is it?) to *mechanism* (how does it work?) and *evaluation* (does it matter?).

  4.  **Rank the Questions (Drafting the Hierarchy):**

      *   *Top Priority (The Anchor):* The Empirical/Mechanism Question. "How does this specific technology enforce behavior?" This is tractable. It uses the school scanner example. It avoids metaphysics.
      *   *Second Priority (The Context):* The System vs. Object Question. A scanner isn't political; a cashless biometric school system is. This refines the scope.
      *   *Third Priority (The Agency):* The Script/Resistance Question. Can students bypass it? (e.g., bring cash, complain). This adds nuance.
      *   *Fourth Priority (The Definition):* What do we mean by 'political'? Keep this minimal. Don't define 'politics' from scratch; adopt a working definition (e.g., Winner's or Latour's) and apply it.
      *   *Avoid (The Trap):* The Ontological Question ("Do objects *really* have politics?"). This is the philosopher's job.
      *   *Avoid (The Trap):* The Historical Determinism Question ("Did we forget we chose?"). Too broad for 5k words.

  5.  **Refining the Order for EPQ Success:**
      *   EPQs need a clear argument and evidence.
      *   The "School Scanner" is the golden ticket. It's primary data.
      *   The order should move from *Concrete* -> *Abstract* -> *Evaluation*.
      *   *Revised Order:*
          1.  **Mechanism:** How does the tech constrain choice? (Affordances/Constraints).
          2.  **System:** Is it the object or the network? (Context).
          3.  **Agency:** Can users resist? (Determinism vs. Choice).
          4.  **Normativity:** Is this *good* politics? (Evaluation).
          5.  **Ontology:** (Demote this to a footnote/background assumption).

  6.  **Addressing the "Missing Question":**
      *   The user mentioned "early change vs. late embedding." This is *Path Dependence* or *Technological Lock-in*.
      *   *Better Missing Question:* **The Question of Alternatives.** "Could it have been built differently?" This bridges the gap between "it's just physics" and "it's political." If there was a cheaper, less intrusive way that was rejected, *that* is the politics.

  7.  **Developing the Rationale (Why this order?):**
      *   *Word Count:* 5,000 words is tight. 1,000 words on "What is politics?" leaves 4,000 for nothing.
      *   *Supervisor:* Physics teacher needs measurable variables. "Behavior change" is measurable. "Ontological status" is not.
      *   *Originality:* Most students will summarize Winner. Using the school scanner as primary data makes it original.

  8.  **Drafting the Response (Iterative refinement):**
      *   *Intro:* Validate their insight (the scanner example is gold). Acknowledge the trap of the "Big Question."
      *   *The Ranking:* Present the 4-5 key questions in order.
      *   *The "Why":* Explain tractability, word count, and evidence availability for each.
      *   *The "Trap":* Explicitly warn against the Ontology question.
      *   *The Missing Question:* Introduce "The Question of Alternatives" (Why *this* tech and not *that* one?).
      *   *Conditional Moves:* When to swap questions (e.g., if they find no evidence of resistance, drop the Agency question).
      *   *Conclusion:* Encouraging but realistic advice on structure.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I give a reading list? No. Good.
      *   *Check:* Is the tone right? Needs to be mentoring, not lecturing.
      *   *Check:* Did I answer the specific prompt about "upstream/downstream"? Yes, by framing the order as logical dependency.
      *   *Refinement:* Make sure to explicitly mention Langdon Winner since they are clearly hinting at his work without naming it, but advise *using* him, not *studying* him.
      *   *Refinement:* Ensure the distinction between "politics in the object" vs "politics of the system" is clear, as the user flagged this.

  10. **Final Polish:** Check word count of the response (keep it concise but detailed enough). Ensure the "School Scanner" example is woven throughout as the anchoring case study. (Self-correction: The user asked for a "defended order." I need to be decisive.)

  *(Self-Correction on the "Missing Question"):* The user mentioned the tension of "early change vs late embedding." I should frame the missing question around *Decision Points*. "Where was the choice made?" is better than just "Alternatives." It addresses their mate's point about "forgetting we chose."

  *(Final Plan):*
  1. Validate the scanner example.
  2. Rank the questions 1-4 (plus the "Do Not Touch" zone).
  3. Explain the logic (Evidence > Theory).
  4. Introduce the "Decision Point" question.
  5. Give conditional advice (If X, then drop Y).
  6. Final structural advice for the 5k words.

