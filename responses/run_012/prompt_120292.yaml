answer: |-
  You are right to suspect the framing is off. Treating belief as a static relation between an agent and a proposition (a *state*) is likely the category error driving the omniscience problem. If belief is a *disposition* or a *process* (a capacity to assent under specific conditions), then "knowing consequences" becomes a matter of computational access, not logical containment. However, since you asked for the spec on the current terms, I will provide the list based on the standard ontology, then flag where that ontology breaks.

  Here is the specification for a theory of bounded belief.

  ### The Spec: Requirements for Bounded Belief

  | Requirement | Motivation / Test Case | Status |
  | :--- | :--- | :--- |
  | **1. Boundedness** | **The Unthought Theorem:** You believe PA axioms but not all theorems. A model must distinguish between *having* information and *accessing* it. | **Non-negotiable.** Any theory failing this describes an ideal god, not a human agent. |
  | **2. Normative Pressure** | **The Defect Intuition:** If you believe $P$ and $P \to Q$, failing to believe $Q$ is a cognitive defect, not just a difference in mood. Belief aims at truth/coherence. | **Non-negotiable.** Without this, "belief" collapses into "symbol storage" or "association." |
  | **3. Inconsistency Tolerance** | **The Preface Paradox:** An author believes every claim in their book and believes at least one is false. They do not, however, believe *everything* (no explosion). | **Non-negotiable.** Humans hold inconsistent beliefs without their cognitive architecture collapsing. |
  | **4. Explicit/Implicit Distinction** | **The Proof Assistant:** What the kernel knows (validity) differs from what the search tactic finds (provability). Belief must separate stored content from derivable content. | **Non-negotiable.** Required to explain the difference between "knowing" and "computing." |
  | **5. Dynamic Sensitivity** | **The Sensation of Discovery:** Deduction feels like work and yields surprise. A model where information is static cannot account for the *value* of reasoning. | **Prejudice.** (See analysis below). This may require abandoning the "state" ontology entirely. |
  | **6. Action Guidance** | **The Lottery Paradox:** You believe ticket 1 will lose, ticket 2 will lose... but you don't buy the ticket that pays if *all* lose. Belief must map to decision without paralysis. | **Non-negotiable.** Belief is a functional state; if it doesn't guide action, it isn't belief. |

  ### Incompatible Pairs

  The "real result" you suspect lives in the tensions between these requirements. You cannot satisfy all six simultaneously within a classical possible-worlds or standard probabilistic framework.

  **1. Boundedness vs. Normative Pressure**
  This is the core logical omniscience problem. If you enforce Normative Pressure (closure under known entailment), you violate Boundedness (agents become omniscient). If you enforce Boundedness (restrict closure), you weaken Normative Pressure (it becomes unclear *why* failing to believe $Q$ is a defect if the logic isn't binding). Most theories solve this by sacrificing Normative Pressure, turning belief into a syntactic list of sentences with no logical connection between them.

  **2. Inconsistency Tolerance vs. Classical Semantics**
  You cannot have Inconsistency Tolerance while keeping classical logic and standard possible-worlds semantics. In classical logic, $P \land \neg P$ entails $Q$. To satisfy this requirement, you must either adopt paraconsistent logic (which rules out standard Bayesianism and Kripke semantics) or introduce "impossible worlds" (which complicates the semantics significantly and often reintroduces Boundedness issues via world-selection rules).

  **3. State Ontology vs. Dynamic Sensitivity**
  If belief is a *state* (a set of propositions held at time $t$), reasoning is merely a lookup function. Information is never created, only retrieved. This makes the "Sensation of Discovery" incoherent. To satisfy Dynamic Sensitivity, belief must be modeled as a *process* or a *trajectory*, which conflicts with the standard definition of belief as a relation $B(a, p)$. You generally have to drop the static State Ontology to save Dynamic Sensitivity.

  ### The Bottleneck Requirement

  If you have to give one up to save the rest, the casualty should be **Normative Pressure (in its strong form)**.

  This is the requirement doing the most work in ruling out candidate theories. It is the demand that belief be *sensitive* to logic without being *determined* by it. This "Goldilocks" constraint is what kills syntactic models (too weak) and possible-worlds models (too strong).

  If you relax Normative Pressure—accepting that belief is causally connected to logic but not normatively bound by it in real-time—you can build bounded, inconsistent, dynamic agents. You lose the ability to call the agent "irrational" for missing obvious consequences, but you gain a model that actually describes human cognition. Most successful computational models (like ACT-R or various BDI architectures) implicitly make this trade: they treat logical connection as a *costly operation* rather than a *normative requirement*.

  ### How The Main Families Fare

  *   **Standard Doxastic/Epistemic Logic:** Fails **Boundedness** and **Inconsistency Tolerance**. Agents are omniscient and consistent by definition.
  *   **Standard Bayesianism:** Fails **Boundedness**, **Inconsistency Tolerance**, and **Dynamic Sensitivity**. Probabilistic coherence implies logical omniscience; updating is instantaneous.
  *   **Syntactic/Explicit Belief Models:** Satisfies **Boundedness** and **Inconsistency Tolerance**. Fails **Normative Pressure**. Beliefs are just strings in a database; there is no reason to add $Q$ when you have $P$ and $P \to Q$.
  *   **Impossible Worlds Semantics:** Satisfies **Boundedness** and **Inconsistency Tolerance**. Struggles with **Normative Pressure** (what constrains which worlds are accessible?) and **Dynamic Sensitivity** (still usually a static state model).
  *   **Step-Logics / Resource-Bounded Reasoning:** Best fit. Satisfies **Boundedness**, **Explicit/Implicit**, and **Dynamic Sensitivity**. Struggles with **Normative Pressure** (defining the "right" amount of reasoning steps is arbitrary) and **Action Guidance** (decision theory integration is hard).

  ### Final Note on Framing

  You mentioned the "state vs. process" distinction. If you treat belief as a **process**, Requirement 5 (Dynamic Sensitivity) stops being a prejudice and becomes a definition. However, this forces you to abandon Requirement 2 (Normative Pressure) in its traditional form. You cannot be "obligated" to complete a process you haven't started. The defect in your epistemic state isn't that you *don't believe Q*; it's that you *haven't run the procedure*. Shifting to a process ontology dissolves the omniscience problem but replaces it with the problem of defining the *norms of inquiry*. That is likely where the actual work lies.
