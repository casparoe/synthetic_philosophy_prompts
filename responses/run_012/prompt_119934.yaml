prompt: |-
  I'm a backend/infra engineer, no formal philosophy training past one ethics elective I mostly slept through, and I've been arguing with my housemate (philosophy MA, insuferable) about the "utility monster" thought experiment — the one where there's a being who gets so much more out of every unit of resource than anyone else that, if you're just adding up how well everyone's doing, the obviously right move is to give it everything and let the rest of us starve. Her line is that this is a knock-down objection to adding up wellbeing at all; my line is that it looks like a bug in how you're scoring things, not a bug in addition. I'd like you to restate the whole thing — the sum-it-all view, the monster objection, and the usual escape routes (averaging instead of summing, giving extra weight to whoever's worse off, putting a ceiling on how much any one being can count, going maximin, maybe treating the monster's claims as a constraint rather than something to be traded off) — in the vocabulary I actually think in, which is multi-objective optimization over a population of agents: per-agent objective functions, scalarization by weighted sum, weights, Pareto fronts and Pareto improvements, hard constraints vs. soft penalties, and what happens when one objective is heavy-tailed or effectively unbounded. Concrete version of the thing that set this off: at work we rank items for a feed by summing predicted value across users, and we found one user segment whose predicted scores are enormous, so in practice the whole ranking is optimizing for them. Someone on the team said "that's just the utility monster," and honestly it does feel like the same shape of problem, but I can't tell if that's a real insight or a coincidence of both things being "add numbers up and one number is big."

  So the deliverable I want is: the translation done as faithfully as you can (state clearly where you're mapping "a person's wellbeing" onto "a term in the objective" and whether that's doing any hidden work), then a residue report. Which parts survive cleanly, which only survive with fudging, and which have no counterpart in my vocabulary at all. Things I specifically want you to press on: is "interpersonal comparability" in their debate basically just "the terms have to be on a common scale so you can add them," and if so is the monster objection really just the complaint that the scale is unbounded, which for me would be a design constraint rather than a moral crisis? When the philosophers say "give priority to the worse off," is that a principled fix or a fudge to dodge an unwanted conclusion — and in my terms, is it a re-weighting, a constraint, or a change of the aggregation rule, and does it matter which? And what about the bit that never shows up in my world: the monster is supposed to be *one being* whose life matters in itself, not a term with a big coefficient — does anything in my vocabulary capture that, or does the whole "locus of moral concern" thing fall through the floor? If the translation only goes through because you're quietly importing assumptions the philosophers don't share, I'd rather you flag it than smooth it over. Don't worry about references or pointing me at papers, I won't be able to check them anyway and I mostly want the map plus an honest account of what didn't make it across.
