prompt: |-
  I run research at a small shop that sells macro and political-risk outlooks, mostly to funds and a couple of insurers who want to know a few years ahead which countries are drifting toward serious trouble. For about a year we've been leaning on Turchin's structural-demographic stuff — cliodynamics, secular cycles, elite overproduction, the whole picture where popular immiseration, too many elites chasing too few positions, state fiscal strain, and elite infighting pile up over decades and then some spark sets it off. It's been great for storytelling and much less great when a client asks what we actually did to get to a call. So what I want from you is a decision procedure my analysts can run on a country, roughly quarterly, in about two days, using only public numbers, news, and their own reading: a procedure that ends in one of a small number of verdicts — something like 'structurally stable', 'pressure building', 'pre-crisis window open' — rather than a score out of a hundred. Give me the questions in the order they should be asked, what counts as a sufficient answer at each step, which steps are allowed to force a stop, and which steps are genuinely judgment calls that a person has to own rather than something the sheet decides. It has to survive contact with a client who has no background in any of this, and with our head of research, who signs off and will absolutely ask why step four isn't just vibes.

  Two things I keep going back and forth on and I'd like you to actually take a position on. First, the theory tells you a society is getting brittle but is famously silent on what lights the match, so how do we handle triggers without pretending we can forecast them — is there a defensible way to keep 'pressure' and 'spark' seperate inside a checklist, or does that just relocate all the real work into an unmarked judgment call? Second, my colleague Priya thinks the honest move is to refuse the quantification altogether, because a scoring sheet turns a contested model into something that looks like a thermometer. If she's right, say so plainly instead of handing me a tidy-looking checklist; I'd rather hear it now than after we've sold three more quarters of outlooks off the back of it. And be straight with me about what this thing can't do: where it will misfire, which of the four drivers it handles worst, and what would have to happen for us to throw it out.

  Then run the procedure end to end on two cases so I can see whether it earns its keep. Case A: bottom-half real wages flat for fifteen years while GDP grew steadily, the number of law and journalism graduates has roughly tripled with no new jobs for them, debt service now eats about a third of state revenue, both major parties have split since 2019, and there have been three large street protests — and yet nothing has actually broken, and it's been like this for eight years. Case B: incomes rising, state finances fine, no visible elite split, but three weeks ago the government postponed elections indefinitely and a mineral-rich region has started talking about autonomy. My gut says B is the one to worry about this year; I suspect your procedure will tell me B is structurally fine and that what I'm staring at is exactly the spark it was never built to see. Show me your work on both, including whatever the procedure forces you to say about A that I won't like, and mark the places where an analyst has to overrule the sheet.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Research head at a small macro/political-risk shop.
      *   **Clients:** Funds and insurers looking 2-5 years ahead for country risk.
      *   **Current Framework:** Turchin's Cliodynamics (Structural-Demographic Theory - SDT).
      *   **Problem:** Good for storytelling, bad for accountability ("what did you actually do to get to this call?"). Needs a decision procedure/checklist.
      *   **Constraints:** Quarterly update, 2 days max per country, public data/news only.
      *   **Output:** Categorical verdicts (e.g., 'Stable', 'Pressure Building', 'Pre-Crisis'), not scores.
      *   **Specific Questions to Address:**
          1.  How to handle triggers/sparks vs. structural pressure (keep separate or merge?).
          2.  Priya's objection: Is quantification misleading (thermometer effect)?
          3.  Limitations: Where will it misfire? Which driver is handled worst? When to throw it out?
          4.  **Case Studies:** Run the procedure on Case A (Stagnant wages, elite overproduction, fiscal strain, fragmentation, but persistent stability) and Case B (Growing economy, stable elites, but sudden authoritarian move + regional unrest).
      *   **Tone:** Professional, direct, critical, intellectually honest. No fluff.

  2.  **Deconstruct the Theoretical Framework (Turchin/SDT):**

      *   **Core Drivers:**
          1.  Popular Immiseration (wages vs. prices).
          2.  Elite Overproduction (too many credentialed/wealthy people chasing too few power positions).
          3.  State Fiscal Stress (debt, revenue capacity).
          4.  Elite Fragmentation/Infighting (loss of cohesion).
      *   **The "Spark":** SDT says structure creates the tinder, but the spark is stochastic (unpredictable).
      *   **The Tension:** Clients want prediction; SDT offers probability of instability, not timing.

  3.  **Address the "Priya Question" (Quantification vs. Judgment):**

      *   *Priya's Point:* Scoring creates false precision. SDT is qualitative/dynamic.
      *   *My Position:* She's half-right. A score (0-100) is dangerous. But a *decision tree* with categorical buckets is necessary for accountability. The key is to make the judgment calls explicit, not hidden behind a formula.
      *   *Verdict:* Do not use a scoring sheet. Use a "Gatekeeping Protocol."

  4.  **Address the "Trigger vs. Pressure" Question:**

      *   *Problem:* SDT doesn't predict triggers.
      *   *Solution:* Decouple them structurally. The checklist measures *susceptibility*. A separate, lighter layer monitors *ignition*. If susceptibility is low, ignition doesn't matter. If susceptibility is high, *any* ignition matters.
      *   *Decision:* Keep them separate. The procedure assesses the *load-bearing capacity* of the state, not the earthquake.

  5.  **Develop the Decision Procedure (The "Stress-Test Protocol"):**

      *   *Goal:* 2 days, public data, categorical output.
      *   *Structure:* Four gates (one for each SDT driver).
      *   *Logic:* If any gate fails critically, the status escalates.
      *   *Verdicts:*
          1.  **Structurally Sound** (Green)
          2.  **Pressure Accumulating** (Yellow)
          3.  **Critical Fragility** (Red)
      *   *Stop Rules:* If Fiscal Stress is critical, stop (state can't respond). If Elite Fragmentation is critical, stop (no one to steer).
      *   *Judgment Calls:* Explicitly mark where human interpretation is needed (e.g., "Is this protest noise or signal?").

  6.  **Address Limitations & Failure Modes:**

      *   *Misfire:* It will flag "Stagnant but Stable" (Case A) as high risk because the theory assumes pressure *must* release. It might miss "Sudden Authoritarian Consolidation" (Case B) if elites are unified in repression.
      *   *Worst Driver:* Elite Overproduction (hardest to measure with public data, lagging indicators).
      *   *Throw Out:* If a country undergoes a regime change that resets the social contract (revolution, coup), the historical cycle is broken.

  7.  **Run the Case Studies:**

      *   **Case A (The "Long Burn"):**
          *   Wages flat (Immiseration: High).
          *   Graduates tripled (Elite Overproduction: High).
          *   Debt service 1/3 revenue (Fiscal Stress: High).
          *   Parties split (Elite Fragmentation: High).
          *   *But:* Nothing broken for 8 years.
          *   *Protocol Result:* Critical Fragility.
          *   *Analyst Override:* Must acknowledge the "Resilience Paradox." Maybe the state has hidden capacity (repression, external aid) not in the model. The model says "Red," reality says "Yellow." *Crucial insight:* The model identifies vulnerability, not inevitability.
      *   **Case B (The "Sudden Shock"):**
          *   Incomes rising (Immiseration: Low).
          *   Finances fine (Fiscal: Low).
          *   No elite split (Fragmentation: Low).
          *   *Event:* Election postponed + Regional autonomy.
          *   *Protocol Result:* Structurally Sound.
          *   *Analyst Override:* This is the "Spark" problem. The structure is fine, but the *political decision* created a crisis. The model fails here because it assumes crises come from below/within, not from arbitrary top-down shocks.
          *   *Correction:* Need a "Governance Shock" modifier.

  8.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the tension. Validate Priya partially but argue for the protocol.
      *   *The Two Big Questions:* Take a firm stance.
      *   *The Protocol:* Step-by-step, clear gates, stop rules.
      *   *Limitations:* Be honest about false positives/negatives.
      *   *Case Studies:* Walk through the logic, highlighting where the model conflicts with intuition.
      *   *Conclusion:* Final advice on selling this to clients.

  9.  **Refining the Tone:**

      *   Avoid academic jargon where possible.
      *   Be direct about the model's weaknesses (Turchin is often criticized for being post-hoc).
      *   Ensure the "Override" mechanism is clear—analysts must own the call, not the sheet.

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the "trigger" question? Yes, separate susceptibility from ignition.
      *   *Check:* Did I address Priya? Yes, advised against scoring, recommended categorical gating.
      *   *Check:* Did I run the cases? Yes, showing the divergence between Model A (High Risk) and Intuition A (Stable), and Model B (Low Risk) and Intuition B (High Risk).
      *   *Refinement:* Make sure to emphasize that Case A is actually a *validation* of the theory (it's a powder keg waiting for a spark), whereas Case B is a *failure* of the theory (exogenous shock). Wait, actually, Case B (postponing elections) *is* elite behavior. If elites are unified in repression, SDT might miss it because it looks for *fragmentation*. I need to highlight that SDT predicts instability from *infighting*, not necessarily *authoritarian consolidation*. That's a key nuance.

  11. **Final Polish:** Ensure the distinction between "Pressure" (Structural) and "Spark" (Event) is clear in the procedure. (Proceed to generate output).

  *(Self-Correction on Case B)*: In Case B, the government postpones elections. This implies elite cohesion (they agreed to do it) but creates popular immiseration (political rights) and potential elite fragmentation (those excluded). However, on the surface, it looks like a "Spark." The model will say "Stable Structure." The analyst must override. I need to make sure the procedure allows for "Exogenous Governance Shocks."

  *(Self-Correction on Case A)*: Case A fits SDT perfectly. The fact that nothing has broken *yet* is the "Secular Cycle" plateau. The model should flag this as high risk. The user's gut says "nothing broken," but the model says "cooking." I need to defend the model here: just because it hasn't exploded doesn't mean it isn't dangerous.

  *(Final Plan)*:
  1. Direct answers to the two big questions.
  2. The "Structural Stress Protocol" (The Checklist).
  3. Limitations & Failure Modes.
  4. Case Study Walkthroughs.
  5. Implementation advice.

