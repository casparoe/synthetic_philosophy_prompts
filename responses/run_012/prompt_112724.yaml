prompt: |-
  I'm in a small reading group that's been chewing through philosophy-of-pain stuff for a few months, and there's a case I keep wanting to bring up that I can only describe in my own words, because I never wrote down what it's actually called. Here's the case as I remember it (I might be smushing two patients together): someone has a brain injury and afterwards they still feel pain — they can say exactly where it is, they rate the intensity as high as anyone would, and as far as I can tell they still have the reflex of yanking their hand off a hot plate — but it just doesn't bother them. Not stoic gritted-teeth coping, not distraction, not "I've made my peace with it"; they'll say the pain is there and intense and then say, apparently sincerely, that they don't mind it in the slightest, sometimes even sounding a bit cheerful about it, and they don't ask for anything. And it's stable over time, not a passing phase. I'm fairly sure I read about this in some pop-neuroscience book and the gist of the line was that the pain is still felt but the suffering is gone, and I've been calling it that ever since, which is obviously not a name. When I try to look it up I keep landing on things that aren't quite it: people who don't feel pain at all (clearly different, no sensation in the first place), people who feel it and cope unusually well, people who are so doped up that it fades, and the whole meditation/Buddhist line about having the sensation without the suffering. I also have a vague memory that there's a mirror-image case — the awfulness without any clear where-is-it sensation — but I might be making that up.

  So what I'm after: (a) is there an established name for the thing I just described, and if the term is contested or has fallen out of use, tell me that too; (b) the joints, which is what I actually care about — the nearest concepts it could be confused with, and for each one why it isn't the same thing; (c) whether the clinical version is really the same as the thought-experiment version that philosophers reach for when they want a case of pain that isn't bad, or whether there's a crucial disanalogy I'd be missing; and (d) whether the tidy split between a sensory part and a bothersome part is something people actually believe, or whether it's a tidy story textbooks tell that the specialists have since muddied. And then the thing my reading group actually argues about: does a case like this really show that the badness of pain is seperate from the sensation — that the hurting and the mattering are two different things — because I've seen it used as a one-line refutation of the idea that pain is bad just in virtue of being pain, and it feels way too quick to me.

  Please answer as someone who knows both the clinical neurology and the philosophy of mind side of this, not as a dictionary. Start by brainstorming the candidate concepts and terms, lay out which one you think is the best fit and why the others aren't, before you commit to an answer, and be explicit about which parts you're confident in and which are hazy. I don't need citations or a reading list — I can't look anything up anyway — I want the carving, and if there's no single name that fits, say so and give me your own.
