      *   **Bayesian Opening:** Marcus attacks the "Failure" label. $p=.06$ isn't evidence *for* the null. It's just inconclusive. The data likely shifted the posterior probability slightly towards the effect, just not decisively.
      *   **Frequentist Response:** Elena counters. $p=.048$ was shaky to begin with. It's barely over the threshold. The replication having $p=.06$ suggests the effect size is smaller than thought, or noise. Error control matters. If we call this a success, we flood the literature with noise.
      *   **Deep Dive - Bayesian Weakness (Priors & Lindley's Paradox):** Elena presses Marcus. Isn't your "rescue" just a function of a skeptical prior? Or a prior chosen to save the result? Also, what about when $N$ is huge, $p$ is small (e.g., .04), but the Bayes Factor favors the Null? (Lindley's Paradox).
      *   **Deep Dive - Frequentist Weakness (Single Case & p-hacking):** Marcus presses Elena. Why should *this* researcher care about long-run error rates of hypothetical repeated experiments? Also, can your method stop someone from trying 20 analyses and picking the best $p$?
