      *   **User's Definition of "Right Reasons":** Features of the situation that make the action right (right-making features, e.g., relieving pain, keeping a promise).
      *   **The Problem (The Dilemma):** Right-making features are objective facts about the world. Psychological states (beliefs/desires) are what move agents. Facts themselves don't move agents; beliefs *about* facts do. Therefore, an agent can never be moved *by the right-making features themselves*, only by their *beliefs* about them.
      *   **Conclusion:** The condition for moral worth is unsatisfiable/incoherent. Moral worth is a fiction.
      *   **Specific Questions:**
          1.  Is the notion incoherent, or can it be rescued?
          2.  If rescued, what about the person who does the right thing just to feel good about themselves (self-satisfaction)? Did they act for the right reasons?
          3.  Where does this line of reasoning break down, and what leads to a different verdict?

  2.  **Deconstruct the Philosophical Problem:**

      *   This is a classic problem in meta-ethics and moral psychology, often associated with Kant (duty vs. inclination), Williams (internal/external reasons), and contemporary discussions on moral worth (Arpaly, Schroeder, Markovits).
      *   The user is setting up a category error: *Ontological facts* vs. *Psychological motivators*.
      *   The user assumes a strict Humean Theory of Motivation (Belief + Desire = Action).
      *   The user assumes a rigid distinction between the "world" and the "mind."

  3.  **Address Question 1: Incoherent or Rescuable?**

      *   *Verdict:* It is rescuable. The user's formulation is too literal/metaphysical.
      *   *The Fix:* We need to refine what "being moved by the right-making features" means. It doesn't mean the fact *itself* reaches into the brain. It means the agent's *representation* of the fact (belief) is the primary motivator, rather than an ulterior motive (like reward, praise, or self-satisfaction).
      *   *Key Concept:* Non-accidental correctness. The action must be right *because* the agent recognized the right-making feature.
      *   *Philosophers to reference:* Kant (duty for duty's sake), Arpaly (unprincipled virtue), Markovits (moral competence).

  4.  **Address Question 2: The Self-Satisfaction Case:**

