answer: |-
  This is a sophisticated puzzle that cuts to the heart of moral psychology and meta-ethics. You have essentially reconstructed a version of the **Psychological Impossibility Objection** often leveled against Kantian ethics, mixed with a problem regarding the metaphysics of reasons.

  Your reasoning is logically valid *if* we accept your premises literally. However, most philosophers argue the notion of moral worth is rescuable because your premises rely on a category mistake regarding how language about "reasons" functions.

  Here is the breakdown of how to rescue the notion, how to handle the self-satisfaction case, and where your specific line of reasoning breaks down.

  ### 1. Is the notion incoherent, or can it be rescued?

  The notion is **rescuable**, but it requires refining the definition of "being moved by a feature."

  Your argument rests on a strict ontological distinction:
  1.  **Right-making features** are objective facts in the world (e.g., "There is pain").
  2.  **Motivators** are internal psychological states (e.g., "I believe there is pain").
  3.  **Conclusion:** Since facts cannot reach into the mind to push neurons, we can never be moved by facts, only by beliefs. Therefore, we can never be moved by right-making features.

  **The Rescue:**
  Philosophers of action generally agree that when we say an agent was "moved by the fact that P," we are not making a metaphysical claim about causal powers of external objects. We are making a claim about the **content** of the psychological state that motivated the agent.

  To say "She was moved by his pain" is shorthand for "She was moved by a desire/belief complex whose *content* represented his pain."

  Therefore, the condition for moral worth is not that the *world* moves the agent, but that the **representation of the right-making feature** is what figures in the explanation of the action, rather than some ulterior motive.
  *   **Incoherent reading:** The fact of pain physically pushes the agent. (Impossible)
  *   **Rescued reading:** The agent's cognitive grasp of the fact of pain is the primary driver of the will. (Possible)

  Moral worth, then, is about **non-accidental correctness**. If you help someone because you want a reward, and it turns out helping them was the right thing to do, your action was right, but its rightness was accidental relative to your motivation. If you help them because you recognized their need, the rightness of the action is explained by your motivation. That alignment is moral worth.

  ### 2. The Case of Self-Satisfaction

  > *What should I say about someone who does the right thing but is moved only by the prospect of feeling good about herself?*

  On the rescued definition, this agent has **not** acted for the right reasons, and her action lacks moral worth (though it may still be a "right action" consequentially).

  Here is the distinction:
  *   **The Right-Making Feature:** The relief of another's suffering.
  *   **Her Motivating Reason:** The production of her own positive emotional state.

  Even if her belief about the suffering is accurate, it is functioning merely as a **means** to her end (feeling good), not as the **end** itself.

  **The Nuance (Constitutive vs. Instrumental):**
  There is a tricky middle ground. Suppose she helps because she cares about the person, and *because* she cares, she feels good when she helps.
  *   If the feeling good is the *goal* (Instrumental), there is no moral worth.
  *   If the feeling good is a *byproduct* of caring about the right-making feature (Constitutive), moral worth is preserved.

  To test this, ask the counterfactual: *If she could relieve the pain without knowing about it (and thus without getting the dopamine hit of "being a helper"), would she still do it?*
  *   If **No**: She was motivated by self-satisfaction. No moral worth.
  *   If **Yes**: She was motivated by the pain relief itself; the good feeling was just a shadow cast by her virtue. Moral worth remains.

  ### 3. Where Your Line of Reasoning Breaks Down

  Your argument is most vulnerable at the premise: **"Features of a situation are not the sort of thing that can move anyone (only an agent's beliefs and desires do that)."**

  While metaphysically precise, this premise creates a false dichotomy between "the world" and "the mind" that dissolves when we analyze **reasons-talk**.

  **A. The Category Error of "Moved By"**
  Your reasoning breaks down because it treats "reasons" as physical causes rather than rational explanations. In the space of reasons, "the fact that he is in pain" and "the belief that he is in pain" are not competing rivals; the latter is the *mode of access* to the former.
  When philosophers argue about moral worth, they are not asking about the metaphysical causal chain (which always stays inside the skull). They are asking about the **rational justification**.
  *   **Breakdown Point:** You are applying a metaphysical constraint (facts can't cause mental states) to a normative question (what justifies praise?). The condition "acted for the right reason" is a normative constraint on the *content* of the motivation, not a metaphysical constraint on the *source* of the energy.

  **B. The "Moral Fetishism" Objection**
  There is a deeper trap in your definition of "right reasons" as "features that make the action right."
  If an agent thinks, "I must do this because this action has the property of **Rightness**," they are arguably *also* failing to act for the right reasons. This is known as the **Moral Fetishism Objection** (famously articulated by Michael Smith).
  *   If you are moved by "Rightness" (the abstract property), you are not moved by the human suffering. You are a morality-lover, not a person-lover.
  *   **The Verdict:** To have true moral worth, you usually shouldn't be thinking about "moral worth" or "right-making features" at all. You should be thinking about the **pain**, the **promise**, or the **person**.
  *   **Why this changes the verdict:** Your argument suggests we can't be moved by features. The counter-argument is that we *must* be moved by the features (the pain), not the *moral status* of the features (the rightness). Your reasoning breaks down by assuming the "right reason" must be the *moral property* rather than the **natural property** (suffering) that grounds the moral property.

  ### Summary of the Different Verdict

  If I were to offer a different verdict than your conclusion (that moral worth is a fiction), it would be based on shifting the locus of analysis from **Metaphysics** to **Rationality**.

  1.  **Reject the Literalism:** Accept that "moved by the fact" is standard English for "moved by a belief representing the fact."
  2.  **Distinguish Content from Attitude:** Moral worth requires that the *content* of the motivating belief matches the *content* of the right-making feature (e.g., "His pain" vs. "My reward").
  3.  **Avoid Fetishism:** Recognize that the "right reason" is usually the natural feature (pain), not the moral feature (duty).

  **Final Verdict:**
  The person motivated by self-satisfaction lacks moral worth because the *content* of her motivation (her pleasure) does not match the *content* of the justification (his pain). However, moral worth is not a fiction; it is a real property of agents whose psychological states align non-accidentally with normative truths. Your reasoning breaks down by demanding a metaphysical impossibility (direct causal contact with facts) to satisfy a normative condition (alignment of motivation and justification).
