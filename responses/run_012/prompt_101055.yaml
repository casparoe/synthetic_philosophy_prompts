answer: |-
  This is one of the those rare objections that feels like it should be fatal, yet consequentialism keeps limping along. The tension comes from conflating the *criterion* of rightness (what makes an act right) with the *decision procedure* (how we choose). Cluelessness attacks the link between them. If the link is broken because the future is unknowable, does the criterion collapse?

  Here is my decomposition. I am treating your question as asking for the probability that cluelessness constitutes a *unique, theory-level defeater* for act-consequentialism.

  ### Decomposition

  1.  **Metaphysical vs. Epistemic Indeterminacy**
      *   **Credence:** 0.10
      *   **Justification:** I assign low probability to the claim that the indeterminacy is metaphysical (i.e., that there is *no fact of the matter* about the value of future outcomes). Even in a quantum or chaotic world, we typically deal with objective chances or deterministic states that are merely hidden. Cluelessness is almost always a function of computational complexity and information access (epistemic), not ontological absence. If it were metaphysical, the objection would be stronger, but the physics doesn't support it.

  2.  **Defusal via Subjective Expected Value (EV)**
      *   **Credence:** 0.60
      *   **Justification:** This is the probability that standard Bayesian decision theory *successfully defuses* the objection. If the uncertainty is epistemic, we can assign subjective credences. Even if those credences are imprecise (intervals rather than points), decision rules like E-admissibility or $\Gamma$-maximin often still permit choice. The objection only sticks if one argues that rational credences are *undefined* (not just wide) in these cases. I lean toward the view that rationality requires taking a stand, even if tentative, which allows EV reasoning to proceed.

  3.  **Survival under "Short Leash" Restriction**
      *   **Credence:** 0.35
      *   **Justification:** This is the chance that the objection remains fatal even if we restrict moral evaluation to foreseeable consequences (e.g., 50–100 years). Much of the "butterfly effect" worry relies on infinite time horizons where small probabilities aggregate into noise. If we truncate the horizon, the signal-to-noise ratio for standard interventions (e.g., pain relief vs. torture) usually improves significantly. I assign 0.35 because some complex systemic interventions (e.g., macroeconomic policy) remain clueless even short-term, but for the bulk of moral acts, the leash saves the theory.

  4.  **Generalization to Rival Theories**
      *   **Credence:** 0.70
      *   **Justification:** This is the probability that the problem infects deontology and rule-consequentialism equally. Deontological constraints often rely on "foreseeability" (e.g., Doctrine of Double Effect). Rule-consequentialism depends on the outcomes of rule-adoption, which are subject to the same long-tail uncertainty as act-consequentialism. If cluelessness makes normative guidance impossible, it makes it impossible for everyone. If it's a general skeptical problem, it's not a specific refutation of consequentialism.

  ### Analysis of Disagreement

  You (0.35) and your colleague (0.75) are likely diverging most sharply on **Piece #2 (Defusal via Subjective EV)** and **Piece #4 (Generalization)**.

  *   **Your colleague (0.75)** likely believes that subjective credences cannot be rationally formed in cases of deep structural uncertainty (rejecting #2). They probably view "I don't know" as a valid terminal state that blocks calculation, not a signal to estimate. They also likely believe deontology escapes the problem because it focuses on the *act type* or *intention* rather than outcomes (rejecting #4).
  *   **You (0.35)** likely grant that we can always form *some* subjective probability (accepting #2) or you recognize that if the future is unknowable for consequentialists, it's also unknowable for the rule-utilitarian trying to validate rules (accepting #4).

  The gap is so wide (0.40 difference) that it suggests a fundamental disagreement on the *norms of belief*. Your colleague treats cluelessness as a suspension of judgment; you treat it as a call for probabilistic estimation.

  ### The Pivot

  The single piece of argument that would move my number the most is a rigorous demonstration regarding **Imprecise Credences and Decision Paralysis**.

  If it were proven that under conditions of "cluelessness," rational agents are *required* to have maximally imprecise credences (e.g., probability intervals of [0, 1]) AND that no rational decision rule exists for choosing between acts under such maximal imprecision, my credence would jump toward 0.60. Currently, I assume rationality permits "sharpening" credences for the sake of action. If that assumption is false—if true neutrality forbids choice—then consequentialism (which demands choice) is in trouble. Conversely, a robust defense of "permissivism" (that it's okay to pick a precise prior even without evidence) would drop my credence below 0.15.

  \answer{0.25}
