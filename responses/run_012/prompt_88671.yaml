      *   *The Legislature:* The International Commission on Stratigraphy (ICS) / Subcommission on Quaternary Stratigraphy (SQS).
      *   *The Enforcement:* Scientific citation / Peer review / Textbook adoption (not police, but social enforcement).
      *   *The Goal:* Safety/Order (in speed limit) vs. Communication/Precision (in stratigraphy).

  3.  **Analyze the Disanalogies (Where it fails):**

      *   *Arbitrariness:* Speed limits *are* somewhat arbitrary within a safe range. Geological boundaries aim to mark *real* physical changes in the rock record. The "fact of the matter" is whether a signal exists, not just where we draw the line.
      *   *Discovery vs. Stipulation:* Speed limits are stipulated (created). Geological epochs are discovered (identified) then named. The plutonium signal at Crawford Lake isn't created by the committee; it exists regardless. The committee decides if it *counts* as a boundary.
      *   *Function:* Speed limits regulate behavior. Geological time scales describe history. One is normative (ought), the other is descriptive (is).
      *   *Consequences:* Breaking a speed limit has immediate physical/legal consequences. "Breaking" a geological boundary (using the wrong date) leads to confusion, not danger.

  4.  **Analyze "Quietly Imported" Features:**

