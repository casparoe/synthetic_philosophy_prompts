answer: |-
  **Title:** The Unit of Rational Evaluation: Local Optimization vs. Plan Selection in the Centipede Game

  **1. Research Question and Motivation**

  The standard diagnosis of the backward-induction (BI) paradox in the Centipede Game locates the difficulty in the epistemic assumptions required to sustain it—specifically, Common Knowledge of Rationality (CKR). The argument is that BI is the unique solution *if* CKR holds, and the paradox arises because CKR is implausible or inconsistent with the game's structure. This proposal argues that this diagnosis misplaces the fault line. The tension is not primarily epistemic but structural: it concerns the *unit of rational evaluation*.

  Standard BI relies on a **node-local** conception of practical reason: at each decision node, an agent chooses the action that maximizes expected utility given beliefs about subsequent play. An alternative is a **course-of-action** (CoA) conception: an agent selects a complete plan at the outset that maximizes expected utility over the whole sequence. Under the node-local view, cooperation unravels immediately. Under the CoA view, cooperation can be sustained as a rational plan, provided the opponent follows suit.

  Existing treatments leave open whether these conceptions are substantively distinct or merely notational variants. If every CoA recommendation can be redescribed as a node-local optimization under some admissible belief system, then the "unit of evaluation" is illusory; the disagreement is merely about which beliefs are permissible. If, however, there are CoA recommendations that cannot be sustained by any node-local optimization without violating constraints on belief consistency, then the units are distinct.

  **Central Question:** *Is the course-of-action conception of rationality reducible to the node-local conception under dynamically consistent belief systems?*

  Specifically, I will investigate two sub-questions:
  1.  Can every node-local recommendation be redescribed as a CoA plan? (Hypothesis: Yes, trivially.)
  2.  Can every rational CoA plan be redescribed as a node-local optimization given a belief system that satisfies dynamic consistency? (Hypothesis: No.)

  **2. Conceptual Framework and Distinctness Condition**

  To ensure the distinction is not merely verbal, I will define reducibility formally. Let $G$ be an extensive-form game. Let $\Pi$ be the set of complete plans (strategies) and $A_h$ be the set of actions available at history $h$.

  *   **Node-Local Rationality (NLR):** A strategy $\sigma$ is NLR if, at every information set $h$ reached with positive probability, the action $\sigma(h)$ maximizes expected utility given a belief system $\mu$ over nodes in $h$ and expectations about future play. Crucially, $\mu$ must update via Bayes' rule where possible.
  *   **Course-of-Action Rationality (CoAR):** A strategy $\sigma$ is CoAR if it maximizes expected utility at the initial node $h_0$, given an expectation of the opponent's strategy.

  **The Reduction Thesis:** CoAR is reducible to NLR if for every CoAR strategy $\sigma^*$, there exists a belief system $\mu$ such that $\sigma^*$ is NLR with respect to $\mu$, and $\mu$ satisfies dynamic consistency (beliefs at $h'$ are derived from beliefs at $h$ via Bayesian updating, absent new structural information).

  **The Distinctness Claim:** The conceptions are distinct if there exists a game $G$ and a strategy $\sigma^*$ such that $\sigma^*$ is CoAR, but there is *no* dynamically consistent belief system $\mu$ that renders $\sigma^*$ NLR. This would demonstrate that CoAR permits recommendations that NLR structurally forbids, regardless of belief tuning.

  **3. Methodology and Game Variants**

  I will employ standard extensive-form game theory with explicit belief systems (akin to Sequential Equilibrium frameworks but applied to single-agent rationality constraints within the game). The analysis will proceed in three stages, increasing in complexity to pry the conceptions apart.

  *   **Stage 1: Standard Finite Centipede.**
      *   *Setup:* Classic finite game with strictly increasing payoffs for mutual cooperation but a temptation to defect at the final node.
      *   *Task:* Demonstrate that under NLR, the unique solution is immediate defection. Under CoAR, "Defect at node $k$" is a candidate solution.
      *   *Test:* Can "Defect at node $k$" (where $k > 1$) be NLR-rationalized? Only if the player believes the opponent will defect before $k$. But if the opponent is NLR, they won't. This stage establishes the baseline conflict but may be dismissed as a CKR issue.

  *   **Stage 2: Centipede with Uncertain Termination.**
      *   *Setup:* Introduce a probability $\delta$ that the game ends exogenously at each node.
      *   *Task:* This variant allows for mixed strategies and softer belief constraints. I will construct a CoA plan that involves cooperation up to a threshold.
      *   *Test:* I will attempt to construct a belief system $\mu$ that supports this plan locally. The critical test is *dynamic consistency*. If maintaining the plan requires believing at node $t$ that the opponent will cooperate, but at node $t-1$ the belief was that they would defect (without new information), the reduction fails.

  *   **Stage 3: The Commitment Variant.**
      *   *Setup:* Allow Player 1 a pre-play move to bind themselves to a plan (costly or costless).
      *   *Task:* Compare the outcome of the binding move (CoA enforcement) vs. the non-binding game (NLR enforcement).
      *   *Test:* If the value of the commitment move is non-zero, it implies the CoA outcome was inaccessible to NLR. I will analyze whether this inaccessibility is due to payoff structure or the unit of evaluation.

  **4. Success and Failure Conditions**

  A definitive result in either direction constitutes success.

  *   **Positive Result (Distinctness):** I produce a formal proof of a game $G$ where a CoAR strategy exists that violates the conditions for NLR under *any* dynamically consistent belief system. This confirms that the unit of evaluation is a substantive parameter of rationality, not just a modeling choice.
  *   **Negative Result (Collapse):** I prove that for any CoAR strategy, there exists *some* belief system (perhaps involving non-standard priors or "trembles") that renders it NLR. This would imply the debate is not about units of evaluation but about the admissibility of certain beliefs. This is a valuable "failure" of the hypothesis, as it clarifies that the CKR/epistemic diagnosis is the correct one.
  *   **Methodological Failure:** The proposal fails if the definitions of NLR and CoAR are shown to be circular or if the belief constraints are rigged to force a desired outcome. To avoid this, I will adhere to standard Bayesian updating constraints for NLR.

  **5. Scope and Feasibility**

  This project is scoped for a one-semester term paper. To ensure completion, I will impose the following constraints:

  *   **Finite Games Only:** I will not address infinite horizon centipedes or continuous time variants. This avoids complications regarding existence of equilibria and focuses on the logical structure of the paradox.
  *   **Theoretical Only:** I will not incorporate experimental data or behavioral game theory. The question is about the normative structure of rationality, not descriptive accuracy.
  *   **Two Players:** I will restrict analysis to two-player games. Multi-player variants introduce coalition complexities irrelevant to the core local-vs-global distinction.
  *   **Cut:** I will not develop a full new axiom system for "Plan Rationality." I will rely on existing definitions of Nash vs. Sequential rationality, repurposed to highlight the unit-of-evaluation distinction.

  **6. Timeline**

  *   **Weeks 1-3:** Formalize definitions of NLR and CoAR and the Reduction Thesis.
  *   **Weeks 4-7:** Analyze Stage 1 and Stage 2 variants. Attempt to construct the counter-example belief systems.
  *   **Weeks 8-10:** Analyze Stage 3 (Commitment). Draft the proof of distinctness or collapse.
  *   **Weeks 11-12:** Write-up and refinement of the failure/success conditions.

  **7. Conclusion**

  If the distinction holds, it suggests that decision theory requires a choice of evaluation unit prior to the application of rationality axioms. If the distinction collapses, it reinforces the view that all rationality disputes in dynamic games are ultimately disputes about permissible beliefs. By framing the question as a reducibility problem, this paper aims to move the discussion beyond the stalemate of CKR critiques.
