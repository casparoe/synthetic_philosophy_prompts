answer: |-
  Bottom line: The hitchhiker structure is a square peg, but it fits tightly enough to crack open the credibility problem.

  Mapping the 2013 crisis: Obama is the hitchhiker; Assad is the driver. The "ride" is Assad's compliance (yielding chemical weapons). The "promise" is Obama's threat to strike if Assad refuses. The payoff for Obama is compliance without war; the cost is the strike itself. In Parfit's original, the hitchhiker promises money after arrival. Here, Obama promises violence after defiance. The structural parallel is time inconsistency: once the moment arrives, fulfilling the promise (striking) is against immediate self-interest (costly war, no Congress support), so a purely self-interested actor won't do it. Assad knows this, rendering the threat incredible.

  Where it breaks: Conditionality and agency. The hitchhiker pays *after* success; Obama strikes *after* failure. It's deterrence, not exchange. Also, the driver isn't a single agent. Assad's survival logic differed from Russia's brokered deal. The "driver" (international community/Assad) had options Obama didn't model, like the Russian compromise. The hitchhiker model assumes a dyad; Syria was a multipolar negotiation.

  Parfit's Claim: This episode confirms Parfit's claim that Self-Interest Theory (SIT) is indirectly self-defeating. By acting rationally—avoiding a costly, unpopular war—Obama undermined future credibility. If the US is known to calculate costs strictly, adversaries will call bluffs. To win, Obama needed to be the kind of person who strikes even when irrational. SIT fails because maximizing utility in the moment destroys the reputation needed to maximize utility later.

  Irrationality: There is a crucial difference between *being* irrational and *being known to be* irrational. Obama didn't need to actually launch a disastrous war (being irrational); he needed Assad to believe he would (known irrationality). This requires commitment mechanisms—tying hands publicly, deploying assets visibly. Obama went to Congress, which untied his hands, signaling rationality and weakness.

  Ultimately, the hitchhiker model illuminates the credibility trap but misses the geopolitical escape hatch. Parfit suggests morality (or dispositions) solves the hitchhiker problem. In geopolitics, "morality" is replaced by reputation. Obama avoided the strike (rational), but the cost was perceived weakness (self-defeating). The model explains why the threat failed, but not why the Russian deal succeeded. It's a square peg, but it hammers home the cost of being too rational. To make the threat credible, Obama would have required a disposition to strike regardless of cost—a "madman" theory. But maintaining that disposition without actually striking is the precise tension Parfit identifies: you must be willing to act against your interest to secure your interest. The Syria episode confirms that without this disposition, self-interest theory defeats itself.
