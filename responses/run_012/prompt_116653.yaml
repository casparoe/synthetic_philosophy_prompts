      *My stance:* It is a category error that leads to bad history, but a useful narrative shortcut. I will argue it is a mistake that licenses laziness.

      *Let's refine the "Verdict" on Environmental Determinism.* The prompt asks: "what one case like this actually proves about environmental determinism as a general thesis."
      *Verdict:* It disproves strong determinism (environment decides everything) but proves weak determinism (environment sets the boundaries of the possible).

      *Let's write.*

