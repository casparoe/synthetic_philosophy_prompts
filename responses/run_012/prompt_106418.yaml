answer: |-
  # The Metaphysics of Properties: A Decision Tree

  **Starting Commitment:** We agree that predications like "This patch is red" or "This is a cat" are sometimes true, and their truth isn't *just* about how we choose to speak.

  **Instructions:** Start at the root. Answer the questions based on your intuitions about the cases provided. Follow the arrows to your leaf.

  ---

  ### **NODE 1: The Truthmaker Obligation**
  Does the truth of "This patch is red" require something in the world *making* it true (a truthmaker), distinct from the patch itself?
  *   **NO:** We don't need extra ontological baggage. The object just is red. → **Go to Node 2**
  *   **YES:** There must be some entity or fact that grounds this truth. → **Go to Node 3**

  ### **NODE 2: The Linguistic/Conceptual Turn**
  If you don't need a worldly truthmaker, is "having a property" just a way of talking about how we classify things or what concepts we apply?
  *   **YES:** Property talk is about our minds or language, not the world's structure. → **LEAF: Conceptualism / Predicate Nominalism**
  *   **NO:** Property talk is useful, but we shouldn't look for deep metaphysical grounds for it. → **LEAF: The "Ostrich" / Deflationary View**
      *(Note: These two leaves are notoriously hard to pull apart. Both deny robust truthmakers, but one focuses on mind-dependence, the other on ontological parsimony.)*

  ### **NODE 3: Repeatables vs. Particulars**
  If there is a truthmaker for "This is red" and "That is red," is it the **very same entity** present in both places, or are they two **different particular entities** that happen to be alike?
  *   **SAME ENTITY (Repeatable):** There is one thing, Redness, wholly present in multiple locations. → **Go to Node 4**
  *   **DIFFERENT ENTITIES (Particulars):** Each patch has its own unique "redness" (a trope). → **Go to Node 7**

  ### **NODE 4: Location of the Repeatable**
  Where does this repeatable entity (Universal) exist?
  *   **IN THE OBJECT:** It exists only where it is instantiated. → **Go to Node 5**
  *   **OUTSIDE SPACE-TIME:** It exists in a realm independent of the objects. → **Go to Node 6**

  ### **NODE 5: Uninstantiated Universals (Immanent Path)**
  If the universal exists only in the object, can "Redness" exist if **every red thing in the universe is destroyed**?
  *   **NO:** No instances, no universal. → **LEAF: Immanent Realism (Aristotelianism)**
  *   **YES:** (Incoherent on this path). If you say YES here, you belong at Node 6.

  ### **NODE 6: Uninstantiated Universals (Transcendent Path)**
  Since the universal is outside space-time, does it exist even if **nothing in our universe instantiates it** (e.g., a shade of blue no eye has ever seen)?
  *   **YES:** Universals exist regardless of instantiation. → **LEAF: Transcendent Realism (Platonism)**
  *   **NO:** (Incoherent on this path). If you say NO here, you belong at Node 5.

  ### **NODE 7: Resemblance Priority**
  You believe the truthmakers are particulars (tropes). Why do two red tropes count as the same color?
  *   **RESEMBLANCE IS PRIMITIVE:** They just resemble each other. There is no further explanation. → **Go to Node 8**
  *   **RESEMBLANCE EXPLAINED:** They resemble because they belong to the same **Natural Class** of tropes. → **Go to Node 9**

  ### **NODE 8: The "One Red Thing" Test**
  Imagine a universe containing **exactly one red thing** and nothing else. Is it still red?
  *   **YES:** Its own particular redness (trope) makes it red, even without a partner to resemble. → **LEAF: Trope Theory (Resemblance Grounded in Tropes)**
  *   **NO:** Resemblance requires at least two things. A singleton cannot resemble anything. → **LEAF: Resemblance Nominalism (Primitive Resemblance)**
      *(Note: This view struggles to explain how a single object could have properties in isolation.)*

  ### **NODE 9: Sparse vs. Abundant (The "Red-or-Round" Test)**
  Do we posit a property/truthmaker for **every** coherent predicate we can formulate, such as "being red-or-round" or "being a game"?
  *   **YES (Abundant):** Every predicate corresponds to a class or property. → **LEAF: Class Nominalism / Abundant Trope Theory**
  *   **NO (Sparse):** Only predicates that **carve nature at the joints** correspond to real properties. → **Go to Node 10**

  ### **NODE 10: The Spectrum Test (Causal/Joints)**
  Consider a continuous color spectrum. Are there sharp boundaries where one property ends and another begins, and do these properties **cause** objects to behave as they do?
  *   **YES:** Properties have causal power and mark real joints. → **LEAF: Robust Natural Class Realism**
  *   **NO:** Properties are causally inert, and boundaries are vague or imposed. → **LEAF: Structuralist / Causally Idle Realism**
      *(Note: Distinguishing causally idle realism from deflationism is difficult; both render properties ontologically "light.")*

  ---

  ### **The Leaves: Your Commitment & Its Cost**

  1.  **Transcendent Realism:** Universals exist independently of particulars.
      *   *Awkward Commitment:* You must explain how non-spatial, non-temporal entities interact with or relate to physical objects.
  2.  **Immanent Realism:** Universals exist only in their instances.
      *   *Awkward Commitment:* You cannot account for uninstantiated properties (e.g., new scientific kinds) until they actually appear.
  3.  **Trope Theory (Resemblance):** Properties are particular abstract particulars.
      *   *Awkward Commitment:* You must explain what "exact resemblance" means without secretly smuggling in a universal to define the respect of resemblance.
  4.  **Resemblance Nominalism:** Properties are just classes of resembling particulars.
      *   *Awkward Commitment:* A universe with only one object has no properties, and you face the "Imperfect Community" problem (things can resemble each other without sharing a single property).
  5.  **Class Nominalism:** Properties are sets of objects.
      *   *Awkward Commitment:* You are committed to the existence of massive, arbitrary sets (e.g., the set of all red-or-round things) as truthmakers.
  6.  **Predicate Nominalism:** To have a property is just to be correctly described by a predicate.
      *   *Awkward Commitment:* You make objective similarity dependent on the existence of language or speakers.
  7.  **Conceptualism:** Properties exist, but only as contents of minds.
      *   *Awkward Commitment:* There were no properties (like gravity or mass) before conscious beings evolved to conceive of them.
  8.  **The "Ostrich" / Deflationary:** Predications are true, but require no truthmakers.
      *   *Awkward Commitment:* You must deny the principle that truth supervenes on being, effectively stopping metaphysical inquiry at the surface.
  9.  **Robust Natural Class Realism:** Only causally efficacious, sparse properties exist.
      *   *Awkward Commitment:* You must deny that disjunctive or conventional properties (like "being a game") have any ontological status, even if they are true.
  10. **Structuralist / Idle Realism:** Properties exist but are defined by their relations, not intrinsic natures.
      *   *Awkward Commitment:* You risk collapsing into a view where properties are just nodes in a graph with no intrinsic content to ground the relations.

  ---

  ### **Ghost Branches: Empty Combinations**
  *These are combinations of answers that nobody occupies. If you ended up here, check your logic.*

  1.  **Transcendent Realism + Causally Efficacious:** Nobody occupies this. If universals are outside space-time (Node 4), they cannot enter into causal relations with physical objects (Node 10) without violating causal closure or spatial location constraints.
  2.  **Resemblance Nominalism + Singleton Universe:** Incoherent. If resemblance is primitive (Node 7), it is a relation. A relation requires at least two relata. A universe with one thing (Node 8) cannot support this view.
  3.  **Immanent Realism + Uninstantiated Universals:** Incoherent by definition. If the universal is *in* the object (Node 4), it cannot exist without the object (Node 5).
  4.  **Abundant Properties + Sparse Causal Joints:** Ugly/Unexplored. If you accept a property for every predicate like "red-or-round" (Node 9), but claim only some have causal power (Node 10), you create a dual-tier ontology that most find theoretically costly without benefit.

  ### **Blind Spots: Where the Tree Blurs**
  *   **Trope Theory vs. Resemblance Nominalism:** If you answer "YES" to the Singleton Test (Node 8), you are likely a Trope Theorist. However, some sophisticated Resemblance Nominalists try to argue that a singleton *could* resemble possible but non-actual objects. The tree forces a choice, but the boundary is contested.
  *   **Ostrich vs. Deflationism:** Both land at Node 2. The tree treats them as one branch, but strictly speaking, the Ostrich denies the need for truthmakers, while Deflationism denies the coherence of the question. They function identically in most arguments, which is why they share a leaf.
  *   **Conceptualism vs. Predicate Nominalism:** Both deny worldly truthmakers. The distinction rests on whether the "sorting" happens in the mind (Concepts) or in language (Predicates). Since language expresses concepts, these views often collapse into one another in practice.
