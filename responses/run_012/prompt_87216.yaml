  2.  **Deconstruct the Two Views:**
      *   *Meme's-Eye View:* Analogy to genes is strong. Culture evolves *for its own sake*. A catchy tune spreads even if it annoys you. The unit of selection is the meme.
      *   *Gene-Culture View:* Culture is a tool for humans. We evolved psychological biases to learn certain things (prestige bias, conformity bias) because it helped our genes survive. Culture evolves *for us* (mostly). The unit of selection is arguably still the human (or the gene-culture complex).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Define the two camps simply.
          *   Camp A (Memetics): Ideas are like viruses. They use us.
          *   Camp B (Gene-Culture): Ideas are like tools. We use them (because evolution taught us how).

      *   **Point 1: The Replicator Requirement (Fidelity, Fecundity, Longevity):**
          *   *The Objection:* Human memory is terrible. I tell a story, you change details. Is that replication?
