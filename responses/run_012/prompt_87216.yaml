      *   **Point 2: Fitness Divergence (Cultural vs. Host Fitness):**
          *   *The Question:* Can an idea spread even if it hurts the human spreading it?
          *   *Memetics Response:* Yes, absolutely. Celibacy, suicide pacts, dangerous challenges. The meme wins, the host loses. This is the "parasite" model.
          *   *Gene-Culture Response:* Rarely, and not for long. If a cultural trait lowers reproductive fitness, genetic selection will eventually weed out the people prone to adopting it, or the bias will shift. Maladaptive culture is a temporary glitch.
          *   *Divergence:* Memetics predicts persistent maladaptive cultural traits. Gene-Culture predicts a tether to genetic success over deep time.

      *   **The Tie-Breaker: Algorithmic Content (AI + Engagement):**
