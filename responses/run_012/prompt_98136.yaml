answer: |-
  First off, **your conceptual setup is not confused at all.** In fact, it is excellent. Many introductory treatments conflate *anekāntavāda* (the metaphysical doctrine), *syādvāda* (the logical expression), and *nayavāda* (the epistemological method), or they reduce the whole system to "soft relativism." Asking students to distinguish these three while incorporating *nayābhāsa* (fallacious standpoints) is a rigorous, upper-level approach that accurately reflects the internal structure of Jain epistemology.

  Here is the practice question, model answer, and marking scheme.

  ***

  ### Practice Exam Question

  **Question:**
  Critics frequently dismiss *anekāntavāda* as a form of incoherent relativism where all claims are equally valid. Refute this charge by analyzing the structural relationship between *anekāntavāda*, *nayavāda*, and *syādvāda*. Specifically, explain how the concept of *nayābhāsa* functions as a critical safeguard, distinguishing a legitimate partial standpoint from an illegitimate one.

  ***

  ### Model Answer (540 words)

  To characterize Jain *anekāntavāda* as simple relativism is to mistake an ontological claim for an epistemological free-for-all. Relativism suggests that truth is subjective and contradictory claims are equally valid. *Anekāntavāda*, conversely, posits that reality (*vastu*) is objectively complex and infinite in its modes (*paryāyas*). The failure to grasp this complexity leads to error, not the acceptance of all views. To understand how Jainism avoids relativism while maintaining non-absolutism, one must distinguish the ontology (*anekāntavāda*), the epistemology (*nayavāda*), and the logic (*syādvāda*), while recognizing the regulatory role of *nayābhāsa*.

  *Anekāntavāda* is the metaphysical foundation. It asserts that no single proposition can exhaust the nature of a substance because entities possess infinite attributes (*ananta dharma*). However, human cognition is finite. This is where *nayavāda* operates. *Nayavāda* is the theory of partial standpoints. It acknowledges that any knowledge claim is made from a specific context or perspective (*naya*). A *naya* is not a "lie"; it is a partial truth. For example, viewing a pot as "earth" is valid from the substance standpoint (*dravyārthika*), but invalid if one claims the pot is *only* earth, ignoring its form (*paryāyārthika*).

  This leads to the crucial distinction between *nayavāda* and *syādvāda*. While *nayavāda* analyzes the perspective from which a judgment is made, *syādvāda* provides the logical syntax for expressing that judgment. *Syādvāda* (the doctrine of "maybe" or "conditioned predication") mandates that every proposition be prefixed with *syāt* ("in some respect"). This is not an expression of doubt, but of conditionality. Through the *saptabhaṅgī* (seven-fold predication), *syādvāda* logically maps how a thing can be described as existing, non-existing, or both, depending on the *naya* employed. Thus, *anekāntavāda* is the reality, *nayavāda* is the method of approaching it, and *syādvāda* is the linguistic logic used to articulate it without contradiction.

  The charge of relativism fails most decisively when considering *nayābhāsa*. If Jainism accepted all standpoints as equally true, it would indeed be relativistic. However, Jain epistemologists argue that a *naya* becomes a *nayābhāsa* (a false or fallacious standpoint) when it is improperly applied. This occurs primarily when a partial standpoint claims to be the whole truth (*sarva-naya*). When a philosopher asserts their partial view as absolute, disregarding other valid modes, they commit *nayābhāsa*.

  For instance, the Nyāya-Vaiśeṣika claim that "all is real" or the Buddhist claim that "all is momentary" are treated by Jains as *nayābhāsa*. They are not rejected because they are partially false, but because they are partially true claims elevated to absolute status. The concept of *nayābhāsa* acts as a safeguard: it validates partial knowledge while invalidating dogmatic absolutism.

  Therefore, *anekāntavāda* is not a collapse into "anything goes." It is a rigorous method for synthesizing partial truths into a higher coherence (*samarasa*). By distinguishing the ontological complexity of the object from the epistemic limitations of the subject, and by logically conditioning predicates via *syādvāda*, Jainism constructs a system where truth is objective but accessible only through the careful integration of valid standpoints. The existence of *nayābhāsa* proves that there is a standard of validity; if there were no objective reality to measure against, there could be no fallacious standpoints, only different opinions.

  ***

  ### Marking Scheme

  | Grade | Criteria |
  | :--- | :--- |
  | **A (80-100%)** | **Precise Distinctions & Anti-Relativism:** Clearly distinguishes *anekāntavāda* (ontology), *nayavāda* (epistemology/method), and *syādvāda* (logic/language). Explicitly explains *nayābhāsa* as the mechanism that prevents relativism (i.e., partial $\neq$ absolute). Avoids the "blind men" analogy. Argument is structured logically, showing how the three doctrines interlock. |
  | **B (65-79%)** | **Correct Definitions but Blurry Application:** Correctly defines the three terms but may blur the line between *nayavāda* and *syādvāda* (e.g., treating them as synonyms). Discusses *nayābhāsa* but fails to fully explain *how* it refutes relativism (e.g., just defines it as "error" without explaining the "partial vs. absolute" error). May rely slightly on analogies rather than structural analysis. |
  | **C (50-64%)** | **Conflation & Relativism:** Treats all three terms as essentially the same ("Jain view of truth"). Leans into the "everything is relative" interpretation without sufficient critique. Mentions *nayābhāsa* only in passing or confuses it with general ignorance. Likely relies heavily on the "blind men and elephant" analogy. |
  | **F (<50%)** | **Inaccurate:** Fundamental misunderstandings of Jain metaphysics. Claims Jainism denies truth entirely. Fails to address the prompt's specific requirements regarding *nayābhāsa*. |

  ***

  ### Instructor Notes for Your Study Group
  *   **The "A" Differentiator:** The key to the A grade here is the treatment of *nayābhāsa*. If you can explain that a *naya* is valid *until* it claims absoluteness, you demonstrate you understand that Jainism has a criterion for truth, which kills the relativism objection.
  *   **Common Pitfall:** Don't say *syādvāda* means "maybe" in the sense of uncertainty. It means "from a specific perspective."
  *   **Terminology:** Using terms like *dravyārthika* (substance standpoint) and *paryāyārthika* (modal standpoint) adds precision, but ensure you use them correctly.
