  # The Social Punishment Decision Tree

  This tree is designed to sort your actual intuitions, not your favorite theorist's. Answer the questions as they apply to a concrete case: *A tenured professor, a gig worker with no contract, or a corporate employee is fired or shunned after a crowd objects to something they said off the clock.*

  ### **Question 1: The Definition**
  **When a company fires someone because of public pressure, is that *punishment* inflicted on the worker, or just the company making a business choice?**

  *   **NO (It's a business choice/rights):** Go to **Question 2**.
      *   *Note:* If you choose this, the rest of the tree (about fairness, standing, and harm) is mostly closed to you. If it's just a business choice, questions about "due process" don't apply. However, this branch gets populated anyway because people fiercely disagree on whether a specific firing was a neutral choice or a punitive act, and because "business choice" is often used as a shield against moral criticism.
  *   **YES (It's punishment):** Go to **Question 3**.

  ---

  ### **Question 2: The Rights Branch**
  **Is the main mistake people making about the *word* they use, or about what they think they are *owed*?**

  *   **The Word:** **Position: Just Consequences.**
      *   *Description:* The view that this is just cause and effect; the whole fuss is invented by people who want to call market reactions "injustice."
      *   *Awkward Commitment:* You must accept that a gig worker fired for a tweet has the same moral standing as a CEO fired for fraud—it's all just contract termination.
  *   **The Entitlement:** **Position: No Right to Platform.**
      *   *Description:* The view that nobody has a right to a job or an audience, and private owners can refuse association for any reason.
      *   *Awkward Commitment:* You must admit a private company can silence a political leader just as easily as they can fire a cashier, with no difference in kind.

  ---

  ### **Question 3: The Justification Branch**
  **Is this punishment *justified* primarily because it checks powerful people who otherwise face no consequences?**

  *   **YES:** **Position: Accountability for Powerful.**
      *   *Description:* The view that private sanction is the only accountability the powerful ever actually face, so the process matters less than the result.
      *   *Awkward Commitment:* You must admit that due process is less important than ensuring the target actually loses status.
  *   **NO:** Go to **Question 4**.

  ---

  ### **Question 4: The Objection Branch**
  **Is the main problem with this punishment about *how it was decided* (process), or *what it does* (consequences)?**

  *   **How it was decided:** Go to **Question 5A**.
  *   **What it does:** Go to **Question 5B**.

  ---

  ### **Question 5A: The Process Fork**
  **Who is acting out of line: the *crowd* demanding the firing, or the *employer* carrying it out?**

  *   **The Crowd:** **Position: Crowd Has No Standing.**
      *   *Description:* The view that a mob can never have the authority to judge, regardless of whether the accusation is true.
      *   *Awkward Commitment:* You must admit that even if the target is guilty, the public has no right to demand their removal.
  *   **The Employer:** **Position: Employer Owes Hearing.**
      *   *Description:* The view that firing someone for speech is close enough to state punishment that the company owes that person a hearing and proportionality.
      *   *Awkward Commitment:* You must argue that private businesses should run their HR departments like criminal courts, regardless of cost or speed.

  ---

  ### **Question 5B: The Consequence Fork**
  **Who is the primary victim: the *bystanders* watching, or the *target* being punished?**

  *   **The Bystanders:** **Position: Chill on Third Parties.**
      *   *Description:* The view that the distinctive wrong is the fear it puts in everyone else who stays quiet to stay safe.
      *   *Awkward Commitment:* You must accept that protecting the climate of speech might mean protecting harmful speakers from consequences.
  *   **The Target:** Go to **Question 6**.

  ---

  ### **Question 6: The Harm Fork**
  **Is the harm that they lose their *voice* (audience), or that they lose their *way to make a living* (livelihood)?**

  *   **Lose Voice:** **Position: Deplatforming Silences.**
      *   *Description:* The view that removing a megaphone silences a person rather than just removing a privilege.
      *   *Awkward Commitment:* You must treat access to private servers (like Twitter or a conference stage) as a public utility essential to speech.
  *   **Lose Livelihood:** **Position: No Exit.**
      *   *Description:* The view that the distinctive wrong is that there is no way back; the record is permanent and survival is threatened.
      *   *Awkward Commitment:* You must assume that a person fired in one industry can never find work in another, making the sanction effectively a life sentence.

  ---

  ### **Notes on Structure and Gaps**

  **Inseparable Leaves:**
  In Question 6, **Deplatforming Silences** and **No Exit** are flagged as distinct, but in practice, they are often inseparable. A gig worker or professor who loses their platform usually loses their livelihood simultaneously. It is difficult to phrase a question that separates them without assuming facts about the specific job market (e.g., a tenured professor vs. a freelancer). If you feel these are the same harm, you may merge them.

  **Undefended Combinations:**
  There is a combination of answers that appears to have no defenders:
  *   *Answer:* "It is Punishment" + "Crowd Has No Standing" + "Employer Owes No Hearing."
  *   *Why:* This view suggests the crowd is wrong to demand punishment, but the employer is also right to fire without a hearing. This is incoherent; if the crowd has no standing, their demand should carry no weight, and if the employer fires without a hearing based on that demand, they are validating the crowd.
  *   *Also:* "It is Not Punishment" + "Employer Owes Hearing."
  *   *Why:* If the firing is just a business choice (not punishment), there is no logical basis to demand a court-like hearing. This is usually unattractive to those who hold the "Not Punishment" view because it imposes state-like costs on private rights.

  **Concrete Application:**
  *   **The Tenured Professor:** Usually triggers the *Employer Owes Hearing* or *No Exit* branches (high job security, permanent record).
  *   **The Gig Worker:** Usually triggers *Just Consequences* or *No Right to Platform* (low job security, at-will contract).
  *   **The Anonymous Pile-On:** Usually triggers *Crowd Has No Standing* (no specific accuser) or *Chill on Third Parties* (fear of random attack).
  *   **The Apology That Satisfies Nobody:** Usually triggers *No Exit* (permanent record) or *Accountability for Powerful* (view that the apology is a tactic, not redemption).
