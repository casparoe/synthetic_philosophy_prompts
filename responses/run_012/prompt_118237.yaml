  1. Divide 15 students into three teams of five at separate tables with a whiteboard visible to all, a deck of index cards containing hidden true values on the back, and a strict 90-minute clock split into five 15-minute rounds.
  2. Round 1 establishes alignment where public points match private value, while Rounds 2 through 5 introduce specific distortions (sampling audits, extreme outliers, reclassification loopholes, zero-sum competition) where the rational move to maximize the public score diverges from maximizing the private goal.
  3. Update the public leaderboard on the whiteboard instantly after every card submission to maintain pressure, while recording private true value scores on a hidden sheet to be revealed only during the final debrief.
  4. Reveal the hidden private scores to show who actually won versus who led the leaderboard, then map each round's rule change to the four failure modes without naming the phenomenon until the very end.
  5. Students may collude to ignore competitive pressure or dismiss your private scoring as arbitrary, and the simulation structurally fails to reproduce the real-world absence of a ground truth since you are artificially enforcing one as the facilitator.
