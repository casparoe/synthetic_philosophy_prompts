  7.  **Final Polish:** Check against the 5 specific points in the prompt. Ensure "Verdict," "Reasoning," and "Confidence" are explicit for each. (Proceed to generate output based on these thoughts).

      *   *One nuance on Q1:* Helmholtz was anti-vitalist. FEP unifies life and physics. He might *like* that unity but dislike the mentalistic language applied to cells. I need to balance this. He would accept the *physics* of the cell but reject the *psychology* of the cell.
