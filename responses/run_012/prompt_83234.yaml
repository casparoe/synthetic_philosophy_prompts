          *   *Verdict:* He would be deeply suspicious. He would demand a mechanism, not just a minimization principle. If FEP is just "systems that survive survive," he'd call it trivial. If it predicts *specific* neural dynamics, he'd accept it as a heuristic law, not a fundamental physical law like energy conservation.
