      *   *Sign Theory:* Sensations are *signs* of external causes, not images/copies. The relationship is arbitrary but lawful.
      *   *Anti-Metaphysical:* He disliked speculative philosophy that couldn't be tested. He wanted mechanisms.
      *   *Combative:* He fought hard against nativism and vitalism. He valued precision.

  3.  **Deconstruct Modern PP/FEP (Friston et al.):**
      *   *Core Claim:* Systems minimize variational free energy (surprise).
