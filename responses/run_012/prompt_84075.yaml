      *   **Specific Cases to Cover:**
          1.  Escher's *Drawing Hands* (benign) vs. Liar Sentence (vicious).
          2.  Quines/Self-hosting compilers.
          3.  LARP rulebook (in-world, editable, rules for editing inside).
          4.  Constitution/Company Handbook (amendment clauses applying to themselves).
          5.  Image editor screenshotting itself.
      *   **Key Questions:** Where is the tangle? Where is the inviolate level? Why doesn't it collapse? (Crucially: In cases 3 & 4, the inviolate level looks *inside* the system).
