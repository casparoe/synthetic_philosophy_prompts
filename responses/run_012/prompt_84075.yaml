prompt: |-
  I'm in this interdisciplinary seminar that's half cog sci half philosophy of math, and everyone keeps throwing around the phrase tangled hierarchy like it's a settled concept, and I've realised I don't actually know what a theory of the thing would even have to do. So before I read one more thing that just gestures at Escher and moves on, I want the spec first. What would any adequate account of tangled hierarchies and the inviolate level have to deliver? Give me the full list of desiderata: the cases it has to get right, the distinctions it can't collapse, the results it can't contradict, and the reason behind each one, plus your verdict on which are non-negotiable and which are just the prejudices of one camp. And be honest about which entries are actually demands of the phenomenon and which are demands of a particular solution being smuggled in as if they were demands of the problem.

  Here are the cases I care about, since they're why I'm asking. (1) Drawing Hands, two hands drawing each other, which nobody thinks is a paradox, and I want the theory to say precisely what separates it from the liar sentence. (2) A quine, a program that prints its own source, and a compiler that compiles itself after being bootstrapped from a tiny core nobody ever rewrites. (3) My flatmate's LARP, where the rulebook is also an in-world object the characters can find and edit, and the rule about how to change the rulebook is printed on the first page. (4) A constitution whose amendment clause can itself be amended, and a company whose handbook-writing department is hired under the handbook. (5) The image editor that can screenshot its own window, including the screenshot button. For each one the theory has to say where the tangle is, where the inviolate level is, and why the thing doesn't just fall apart — and note that in (3) and (4) the obvious candidate for the inviolate level looks like it's inside the tangle, so a story that just parks the inviolate level safely outside is not going to cover my cases. I also want the distinctions nailed down: tangle vs plain circularity vs feedback loop vs infinite regress vs ordinary recursion; benign self-reference vs vicious; level-crossing vs mere cycling; and whether tangled is a fact about the structure or a fact about what it's like from inside. It can't contradict the standard no-go results either — Gödel, Tarski, the halting problem, the existence of self-hosting compilers and quines, well-founded recursive definitions, and the plain fact that lots of self-reference is completely unproblematic.

  The part I most want is the last bit: tell me which two requirements you think can't be satisfied together, and why. My suspicion is it's the pair (the tangle has no level from which the whole thing shows up as a straight hierarchy) and (every tangle has an inviolate level), because if the inviolate level sits outside then from there it does look straight and tangled becomes a perspective-relative word, and if it sits inside you get either a regress or a level that's itself tangled, and I can't see a third option — so the theory has to say which horn it takes and what it pays for it. If you think that pair is fine, explain how; if there's a worse pair, tell me that instead. Then a couple of lines at most on how the obvious candidates do against your list — the Escher/Hofstadter strange-loop story, Tarski's hierarchy of languages, Kripke-style groundedness accounts of truth, and the levels-of-abstraction line in computer science — but keep the weight on the list itself, since that's the part I actually need. Skip anything that would need citations, I'm not going to check references, I want the reasoning. A table for the desiderata would be fine if it helps.
