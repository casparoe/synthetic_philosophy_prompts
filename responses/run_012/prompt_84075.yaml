      *   *Theory Audit:* Quick hits on Hofstadter, Tarski, Kripke, CS.

  8.  **Self-Correction/Nuance Check:**
      *   *Did I answer the "Inviolate Level Inside" challenge?* In LARP/Constitution, the rule is textually inside. A theory must explain how it functions as "outside" without leaving the book. *Answer:* It functions as a *fixed point* in the update dynamics, not a spatial location.
      *   *Did I distinguish Recursion from Tangle?* Recursion is well-founded (usually). Tangle implies a violation of well-foundedness that *doesn't* crash.
      *   *Is the tone right?* Needs to be sharp, academic but accessible, no fluff.

  9.  **Final Polish:** Check against the prompt's specific constraints (no citations, table okay, focus on the list, specific cases addressed). Ensure the "Verdict" on non-negotiables is clear.

  *(Self-Correction during drafting)*: I need to make sure I don't just agree with the user's suspicion but explain *why* it's the tension. The tension is between *System Closure* (needed for the "tangle" to be real) and *Archimedean Point* (needed for the "inviolate" to work). If the Archimedean point is inside, it's leveraged by the system. If outside, the system isn't closed.

