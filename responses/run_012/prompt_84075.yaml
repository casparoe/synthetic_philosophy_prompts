      *   Need to address the "Inside/Outside" problem explicitly.

  6.  **Evaluating Existing Theories (Briefly):**
      *   *Hofstadter:* Great on the "feel," vague on the logic. Smuggles the inviolate level out (the "I" observing the loop).
      *   *Tarski:* Solves logic by banning the tangle (strict hierarchy). Fails the "natural language/LARP" test.
      *   *Kripke:* Allows tangle via truth-value gaps. Good for Liar, less clear on "inviolate level" (the fixed point is the math, not a level in the system).
      *   *CS Levels:* Practical, but usually hides the tangle in hardware/firmware (the real inviolate level is physics).

  7.  **Drafting the Response (Iterative refinement):**
