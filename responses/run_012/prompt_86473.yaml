answer: |-
  **Exam Question: The Ethics of Discounting**

  **Time Allowed:** 50 Minutes
  **Word Limit:** None (but conciseness is valued)
  **Total Marks:** 20

  **Prompt:**

  Consider the following assertion made by a policy analyst regarding long-term climate investment:

  > "We do not need to argue for a positive pure time preference ($\delta$). It is ethically cleaner to set $\delta = 0$. We should still discount future consumption, but only because future people will be richer than us. Due to diminishing marginal utility, a dollar is worth less to them than to us. Therefore, a positive consumption discount rate ($r$) emerges naturally from economic growth ($g$) without requiring us to be impatient."

  Write a critical response to this assertion. Your answer must address the following five points:

  1.  Formally decompose the consumption discount rate using the Ramsey Rule.
  2.  Explain the dual ethical and mathematical role of the elasticity of marginal utility ($\eta$).
  3.  Analyze the fragility of the argument if the assumption of positive growth ($g > 0$) is violated.
  4.  Evaluate whether a positive $\delta$ can be defended on normative grounds, or if it is merely descriptive.
  5.  Assess the "uncertainty dodge" (discounting based on the probability of extinction) and its limitations in this context.

  ***

  **Model Answer**

  The analyst's assertion is intuitively appealing but technically fragile and ethically incomplete. It relies on the Ramsey Rule, which decomposes the consumption discount rate ($r$) into two components: $r = \delta + \eta g$. Here, $\delta$ is the pure rate of time preference, $\eta$ is the elasticity of marginal utility of consumption, and $g$ is the growth rate of per capita consumption. The analyst proposes setting $\delta = 0$, arguing that the term $\eta g$ provides sufficient discounting. While this avoids the ethical baggage of $\delta$, it shifts the entire justificatory burden onto growth and the parameter $\eta$.

  The parameter $\eta$ performs double duty in this framework. Mathematically, it represents the curvature of the utility function, dictating how quickly marginal utility falls as consumption rises. Ethically, it functions as an inequality aversion parameter. A high $\eta$ implies we should transfer significant resources from the rich to the poor. In the analyst's argument, $\eta$ justifies discounting the future because future generations are assumed to be "richer." However, this treats $\eta$ instrumentally to generate a discount rate, potentially conflicting with its distributive purpose. If we believe inequality is morally urgent (high $\eta$), we should be aggressive about redistribution; if we use that same high $\eta$ to discount future climate damages, we may undervalue harms inflicted on those same future people should they turn out not to be rich.

  This reveals the argument's critical fragility: it depends entirely on $g > 0$. The analyst assumes the future will be richer. However, in the context of climate policy, unchecked warming may damage capital stocks, ecosystems, and productivity, potentially driving $g$ to zero or negative values. If $g \le 0$, the term $\eta g$ vanishes or becomes negative. If $\eta g$ is negative and $\delta = 0$, then $r$ becomes negative. This implies future consumption is *more* valuable than present consumption, requiring massive present sacrifice. The analyst's strategy only works if climate policy succeeds in preserving growth; it fails precisely in the catastrophic scenarios where discounting matters most. Relying on growth to justify discounting is circular when the policy in question determines whether that growth occurs.

  Regarding $\delta$, the analyst is correct that $\delta > 0$ is ethically difficult to defend normatively. As Frank Ramsey famously noted, a positive pure time preference is "ethically indefensible and arises merely from the weakness of the imagination." It implies that the welfare of a person counts for less simply because they exist later in time, which amounts to discrimination by date of birth. Defenders often argue that $\delta > 0$ is *descriptive*—reflecting observed market behavior or human psychology. However, a masters-level policy analysis should distinguish between *is* and *ought*. Observed impatience reflects human mortality and myopia, not a moral truth about intergenerational justice. Setting $\delta = 0$ is the standard normative baseline for social welfare functions; deviating from it requires more than citing market interest rates.

  Finally, the analyst might retreat to the "uncertainty dodge": we discount the future not because we are impatient, but because the future might not exist (e.g., existential risk). This introduces a probabilistic discount rate. While valid for modeling existential threats (like asteroid impacts), it fails as a general substitute for $\delta$ in climate policy. First, it applies to the probability of the *agent* existing, not the value of their welfare. Second, for long-term climate horizons, the cumulative probability of survival drops sharply, effectively truncating the analysis. If we discount heavily because humanity might go extinct, we undermine the incentive to prevent the very extinction events driving the probability. It is a coherent mathematical move for small, marginal risks, but ethically incoherent when the "risk" is the policy failure itself.

  In conclusion, setting $\delta = 0$ is ethically sound, but relying on $\eta g$ to generate a positive discount rate is dangerous. It assumes away the possibility of climate-induced decline and conflates inequality aversion with intertemporal weighting. A robust policy framework must acknowledge that if we damage the future enough to stop growth, the economic logic for discounting that future disappears.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Ramsey Decomposition (4 Marks)**
  *   **Good:** Correctly states $r = \delta + \eta g$ and defines all terms clearly. Explains that the analyst is isolating the $\eta g$ term.
  *   **Mediocre:** States the formula but fails to define terms or explain that the analyst is setting $\delta = 0$.
  *   **Common Error:** Confusing the consumption discount rate ($r$) with the pure time preference ($\delta$).

  **2. The Dual Role of $\eta$ (4 Marks)**
  *   **Good:** Identifies $\eta$ as both curvature of utility (smoothing) and inequality aversion (distribution). Notes the tension between using it for discounting vs. redistribution.
  *   **Mediocre:** Describes $\eta$ only as "diminishing marginal utility" without mentioning the ethical/inequality implication.
  *   **Common Error:** Treating $\eta$ as a purely technical parameter with no distributive ethical weight.

  **3. The Growth Assumption ($g$) (4 Marks)**
  *   **Good:** Explicitly analyzes the case where $g \le 0$. Notes that negative growth flips the sign of the discount rate, undermining the analyst's claim.
  *   **Mediocre:** Mentions growth might slow but fails to articulate the mathematical consequence (negative $r$).
  *   **Common Error:** Assuming growth is exogenous and unaffected by the climate policy being evaluated.

  **4. Ethics of $\delta$ (4 Marks)**
  *   **Good:** Distinguishes between descriptive (psychological/market) and normative (ethical) defenses. Cites the "discrimination by date of birth" argument.
  *   **Mediocre:** States $\delta > 0$ is "bad" without explaining why, or accepts market rates as ethical justification.
  *   **Common Error:** Arguing that $\delta > 0$ is acceptable simply because individuals are impatient.

  **5. The Uncertainty Dodge (4 Marks)**
  *   **Good:** Acknowledges validity for existential risk but highlights the paradox of discounting away the very harms policy seeks to prevent.
  *   **Mediocre:** Accepts uncertainty as a valid full substitute for time preference without qualification.
  *   **Common Error:** Confusing the probability of an event occurring with the discount rate applied to its cost.

  **Differentiation Guide:**
  *   **16-20 (Distinction):** Seamlessly integrates the math with the ethical critique. Specifically highlights the circularity of assuming growth to discount the costs of losing growth.
  *   **10-15 (Pass):** Covers all five points but treats them as a checklist. The connection between $g < 0$ and the ethical weight of $\eta$ is weak.
  *   **0-9 (Fail):** Fails to write down the Ramsey equation or conflates $\delta$ and $r$ throughout.
