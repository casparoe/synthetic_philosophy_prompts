answer: |-
  **Prospectus**

  **Title:** The Administrative Veil: Conduct, Desert, and the Structural Limits of Welfare Conditionality

  **Central Research Question**
  This paper asks: **Does the reliance on observable conduct in welfare administration necessarily produce an extensional mismatch with desert-based justifications for sanctions?**

  I am explicitly choosing to ask whether the justifications come apart extensionally, rather than asking what ultimately justifies conditionality or what any sanction regime is technically capable of tracking. I select this question for two reasons. First, the question of ultimate justification (reciprocity vs. basic income vs. sufficiency) is too broad for a twenty-page term paper; resolving it would require settling foundational disputes in distributive justice that exceed the scope of this seminar. Second, the question of technical capacity is largely empirical and sociological; answering it would require data on administrative error rates rather than philosophical analysis. By focusing on the extensional mismatch, I isolate the structural relationship between moral theory and administrative practice. This allows for a determinate answer: either the set of individuals sanctioned by conduct rules overlaps sufficiently with the set of individuals liable by desert to sustain the justification, or it does not. If it does not, the justification fails on its own terms regardless of the underlying theory of justice.

  **Motivation and Existing Positions**
  Current debates regarding welfare conditionality generally occupy two poles. On one side, proponents argue that conditionality is justified by reciprocity: citizens who receive public support owe a duty of cooperation to the community, and sanctions enforce this duty. On the other side, critics argue that conditionality is punitive, imposing hardship on the vulnerable without addressing the structural causes of unemployment. Both positions, however, share an unstated assumption: that the administrative mechanisms used to enforce conditionality are capable of accurately identifying the moral status of the claimant. They assume that if a sanction is morally justified in theory, the bureaucracy can implement it in practice.

  This assumption leaves the central problem of this paper open. Existing arguments treat administrative error as an epistemic shortfall—a problem of insufficient information or poor casework that could theoretically be repaired. They do not account for the possibility that the mismatch is conceptual. Administrative rules must rely on proxies (missed appointments, unsigned forms) because intention and capacity are not directly observable. If the moral justification relies on properties (willful non-compliance) that the administrative rules cannot conceptually access, then the justification cannot be implemented without distortion. The existing literature leaves open whether this distortion is fatal to the justification or merely a manageable cost of implementation. This paper argues that it is fatal.

  **Method and Argumentative Steps**
  The method will be conceptual analysis supported by constructive argumentation. I will not conduct an empirical audit of welfare agencies, but I will analyze the logical structure of administrative rules compared to the logical structure of desert claims. The argument will proceed in four steps:

  1.  **Define the Moral Target:** I will reconstruct the strongest version of the desert-based justification for sanctions. This justification holds that sanctions are only legitimate when applied to claimants who *could* comply but *willfully* choose not to. I will establish that this justification requires access to facts about capacity and intention.
  2.  **Define the Administrative Constraint:** I will characterize the administrative regime as necessarily limited to observable conduct. I will argue that this limitation is not contingent on budget or technology but is inherent to the nature of bureaucratic rule-following, which requires standardized, verifiable inputs to ensure equal treatment and prevent arbitrariness.
  3.  **Demonstrate the Mismatch:** I will show that conduct is neither a necessary nor a sufficient condition for the moral target defined in step one. A claimant may miss an appointment due to incapacity (false positive for desert) or comply formally while subverting the intent (false negative for desert). I will argue that these are not edge cases but structural features of the proxy relationship.
  4.  **Evaluate the Consequence:** I will test whether the desert-based justification can survive this mismatch. I will consider two responses: either the justification must be weakened to accept conduct as a sufficient proxy (which licenses punishing the innocent), or the justification must be abandoned in favor of a strict reciprocity model (which may not cover the actual population being sanctioned). I will argue that both responses undermine the original moral claim.

  **Possible Conclusions and Deciding Considerations**
  There are three plausible outcomes for this inquiry:

  1.  **The Mismatch is Negligible:** The argument could fail if I cannot demonstrate that the error rate between conduct and desert is significant enough to undermine the justification. This would require showing that observable conduct is a highly reliable proxy for intention in the vast majority of cases.
  2.  **The Mismatch is Epistemic:** The argument could fail if I cannot sustain the claim that the mismatch is conceptual. If the problem is merely that current administration is sloppy, then better casework could resolve the tension without abandoning the justification.
  3.  **The Mismatch is Structural (Preferred Hypothesis):** The argument succeeds if I demonstrate that standardization requires ignoring the very facts (intent, capacity) that the moral justification requires. In this case, the conclusion is that desert-based justifications cannot be institutionalized in a welfare bureaucracy without becoming morally incoherent.

  The deciding consideration will be the success of step two. If I can prove that administrative standardization *requires* the exclusion of unobservable mental states, then the mismatch is unavoidable. If administrative discretion can accommodate those states without collapsing into arbitrariness, the mismatch is contingent.

  **Criteria for Project Failure**
  This project would fail, rather than simply reach an unwelcome conclusion, under two conditions. First, if the argument collapses into an empirical claim about specific error rates that I cannot substantiate within the constraints of a philosophical term paper. To avoid this, I will frame the mismatch as a logical problem of proxy reliability rather than a statistical claim about current error rates. Second, if I fail to distinguish clearly between desert-based justifications and reciprocity-based justifications. If the two are indistinguishable in this context, the central tension disappears. I will avoid this by strictly defining desert as liability based on individual moral responsibility, distinct from reciprocity as a systemic duty of cooperation.

  **Feasibility and Scope**
  This question is realistically sized for a single semester and a twenty-page limit. Because the argument is conceptual rather than empirical, it does not require data collection. The scope is limited to the relationship between justification and implementation, avoiding the need to defend a specific theory of distributive justice from first principles. The four-step method provides a clear roadmap that fits within the page constraints: approximately three pages for setup and definitions, ten pages for the core argument regarding the mismatch, and seven pages for evaluating the consequences and addressing counterarguments. The risk of scope creep lies in drifting toward a general critique of bureaucracy; I will remain focused strictly on the implications for the moral justification of sanctions.
