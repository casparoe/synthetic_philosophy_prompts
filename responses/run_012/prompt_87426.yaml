      *   *Is the question determinate?* "Does X necessarily produce Y?" allows for a Yes/No answer (with nuance).
      *   *Is the scope right?* 20 pages is tight but doable for a conceptual argument without empirical case studies. I need to ensure the method reflects this limitation (conceptual analysis, not empirical audit).

  7.  **Final Polish:** Check the flow. Ensure the distinction between "epistemic shortfall" (we can't see enough) and "conceptual mismatch" (the rules *must* ignore this) is clear, as that's the core of the user's idea. Ensure the defense of the chosen question is robust.

      *   *Question Choice:* I will choose "whether the desert-based and conduct-based justifications come apart extensionally."
      *   *Defense:* Asking "what justifies" is too broad for 20 pages. Asking "what can be tracked" is too sociological. The mismatch question is the philosophical pivot point.
      *   *Method:* Conceptual analysis + thought experiments regarding administrative rules.
      *   *Failure:* If the argument relies on empirical claims about error rates that I can't substantiate philosophically.

  8.  **Drafting the Content:** (Mental outline)
      *   Title: The Administrative Veil: Conduct, Desert, and Welfare Conditionality.
      *   Introduction/Question.
      *   Why this question (vs alternatives).
      *   Current Landscape (why existing views miss it).
      *   Method/Steps.
      *   Outcomes/Failure/Feasibility.

