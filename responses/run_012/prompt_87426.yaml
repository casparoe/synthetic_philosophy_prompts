      *   **Constraint 1:** Provide the prospectus document itself, *not* advice on how to write one.
      *   **Constraint 2:** Sidestep the familiar reciprocity vs. punitive dispute.
      *   **Constraint 3:** State the central question precisely (determinate answer), explicitly choose which question is being asked (justification vs. tracking capability vs. extensional divergence), and defend that choice.
      *   **Constraint 4:** Explain why existing positions leave the question open.
      *   **Constraint 5:** Set out the method as a sequence of argumentative steps.
      *   **Constraint 6:** Define possible conclusions and deciding considerations.
      *   **Constraint 7:** Define what counts as project failure vs. unwelcome conclusion.
      *   **Constraint 8:** Assess realistic sizing for a single semester.
      *   **Constraint 9:** No citations, bibliography, or literature review by author/title. Refer to positions in plain terms.
      *   **Constraint 10:** Write in American English.

  2.  **Deconstruct the Core Idea:**
      *   *Premise:* Welfare conditionality relies on administrative rules (missed appointments, forms) to enforce moral obligations (reciprocity, desert).
      *   *Problem:* Administrative rules track *conduct* (observable), but moral justifications rely on *status* (intent, capacity, willingness).
      *   *Hypothesis:* This is a conceptual mismatch, not just an epistemic error. Conduct is a poor proxy for the moral properties required to justify sanctions.
      *   *Implication:* Desert-based justifications fail when translated into administrative conduct rules, either becoming too weak to justify actual sanctions or collapsing into reciprocity claims that exclude many sanctioned individuals.

  3.  **Formulate the Central Question:**
      *   Option A: What justifies conditionality? (Too broad, normative).
      *   Option B: What can any sanction regime track? (Too empirical/technical).
      *   Option C: Do desert-based justifications and conduct-based implementations come apart extensionally? (Better, but needs precision).
      *   *Selected Question:* **To what extent can a desert-based justification for welfare conditionality survive translation into an administrative regime capable of tracking only observable conduct?**
      *   *Refinement for Determinacy:* The prompt asks for a question with a *determinate answer*. "To what extent" is vague. Let's make it sharper.
      *   *Revised Question:* **Does the administrative necessity of tracking observable conduct render desert-based justifications for welfare sanctions extensionally inadequate?**
      *   *Wait, the prompt asks me to choose between:* "what justifies conditionality, what any sanction regime is capable of tracking, or whether the desert-based and conduct-based justifications come apart extensionally."
      *   *Decision:* I should choose the third option: **Whether the desert-based and conduct-based justifications come apart extensionally.** This is the most analytically tractable for a 20-page paper. It avoids having to solve the whole theory of justice (what justifies) or the whole theory of administration (what can be tracked), and focuses on the *mapping* between them.
      *   *Precise Formulation:* **Do the set of individuals sanctioned under standard administrative conduct rules and the set of individuals morally liable to sanction under a desert-based justification overlap sufficiently to sustain the justification?** (Or simpler: **Does the reliance on observable conduct in welfare administration necessarily produce an extensional mismatch with desert-based justifications for sanctions?**)

  4.  **Drafting - Section by Section:**

      *   **Title:** Needs to be academic and descriptive.
      *   **Research Question:** Explicitly state the chosen question (extensional mismatch) and defend why this one (avoids deep normative meta-ethics, focuses on the structural constraint).
      *   **Motivation/Gap:** Why existing debates (reciprocity vs. punishment) miss this. They assume the administrative mechanism works if the moral theory is right. This paper argues the mechanism itself breaks the moral theory.
      *   **Method/Argumentative Steps:**
          1.  Define the desert-based justification (liability based on intent/capacity).
          2.  Define the administrative constraint (liability based on observable conduct).
          3.  Demonstrate the mismatch (false positives/negatives).
          4.  Argue this is conceptual, not epistemic (cannot be fixed by better tech/casework).
          5.  Evaluate the consequences (justification collapses or mutates).
      *   **Possible Conclusions:**
          1.  Mismatch is negligible (justification holds).
          2.  Mismatch is significant but fixable (epistemic view).
          3.  Mismatch is structural and fatal (conceptual view - my hunch).
      *   **Failure Conditions:** What counts as failing? (e.g., proving it's just an empirical claim requiring data I don't have, or failing to distinguish desert from reciprocity).
      *   **Feasibility:** 20 pages is enough for this conceptual analysis.

  5.  **Refining the Tone:**
      *   Must be a prospectus, not the paper itself.
      *   American English.
      *   No citations (plain terms).
      *   Confident, precise academic voice.

  6.  **Self-Correction/Review against Constraints:**
      *   *Did I give advice?* No, this is the document.
