      *Refining the Paradox:* Let's use the "entrenchment" angle. The old rule says "This rule cannot be changed except by 90% vote." The amendment says "This rule is changed by 50% vote." The vote was 60%.
      *   Actually, the prompt suggests: "lowers the threshold it was passed under."
