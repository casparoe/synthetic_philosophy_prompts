      *   If Old Rule applies: 60% < 66%, so it fails.
      *   If New Rule applies: 60% > 50%, so it passes.
      *   But the New Rule only exists if it passes.
      *   This is the "self-referential validity" knot.

      *Let's write.*

      *(Post-Drafting Check)*: Ensure the note distinguishes between legal theory (Rule of Recognition) and the logical paradox.

  10. **Final Polish:** Check tone. Ensure no explicit "This is a paradox" dialogue.

