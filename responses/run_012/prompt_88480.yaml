answer: |-
  **Setting:** *A university seminar room, late afternoon. The whiteboard is still covered in diagrams of reduction trees and probability distributions. Most of the graduate students have left. Elena, a philosopher of science, is packing her bag. Marcus, a computer scientist, is erasing the far corner of the board.*

  **Elena:** You know, the more I sit with this distinction between worst-case and average-case, the less I think it saves us from the hard conclusion. When we prove that finding the shortest tour through a set of cities is NP-hard, or that general planning is intractable, we aren't just talking about code. We're talking about any physical system that processes information under energy constraints. A brain, a market, a bureaucracy—they are all resource-bounded systems. If the mathematics says the solution space explodes exponentially, then the ubiquity of heuristics isn't just a contingent fact about how humans happen to be built. It's a necessity imposed by the structure of the problem itself. We *must* approximate.

  **Marcus:** I see the appeal of that reading, Elena, I do. It gives the math a kind of ontological weight. But I think you're mistaking a statement about a mathematical limit for a statement about the world. Worst-case asymptotic hardness is a claim about a sequence of instances as $n$ goes to infinity, specifically instances constructed to be as difficult as possible. It says nothing about the structured, messy, highly correlated data that real agents actually encounter. Real cities aren't arranged by an adversary to maximize your travel time; they have geography, clustering, structure. To say a market or a brain is "bound" by worst-case complexity is like saying a bridge is designed to withstand a hurricane of infinite wind speed. It tells you about the breaking point, not the daily load.

  **Elena:** But that assumes the daily load is benign. That's the leap I'm worried about. You're assuming the instances a given organism or institution faces are drawn from a "kind" distribution. But why should we believe that? If I'm a prey animal, the environment is actively trying to hide threats. If I'm a trader, the market is composed of other agents trying to arbitrage away my opportunities. The "instance" isn't handed to us from a static universe; it's often generated by the interaction of other resource-bounded systems. If the environment is adversarial, or even just competitive, the distribution shifts toward the hard cases. The worst-case isn't a pathological outlier; it's the equilibrium of a competitive system.

  **Marcus:** That's a stronger point. If the environment is adversarial, the average-case argument does lose its force. But you're also sliding between the *problem* and the *instance*. Complexity theory classifies problems, not specific situations. Even in a competitive market, the specific configuration of prices and assets at any given millisecond is just one instance. The fact that the *general* problem of portfolio optimization is hard doesn't mean *this* specific optimization is unsolvable in polynomial time. Most instances of an NP-hard problem are actually easy to solve. The hardness is concentrated in a very specific, thin region of the solution space. Unless your agents are constantly stumbling into that thin region, the hardness result is a warning sign, not a cage.

  **Elena:** Is it a thin region, though? Or is that only true if we define the problem narrowly? Here's where I want to press you on what "the instance" even is. When you model a bureaucracy solving a planning problem, you fix the inputs and the rules. But for the bureaucracy, figuring out *what* the inputs are is part of the computation. The framing of the problem is internal to the agent. If the cost of parsing the reality into a formal input string is itself subject to complexity constraints, then your "easy instances" might become hard once you account for the cost of representation. You can't isolate the algorithm from the ontology it imposes on the world.

  **Marcus:** Okay, I'll grant you that. If we treat the pre-processing—the perception, the framing—as part of the computational load, the bounds tighten significantly. We often assume the input is given "for free" in clean symbolic form, and that is certainly a fiction when we talk about brains or institutions. If the encoding is part of the complexity, then yes, the theoretical lower bounds become much more relevant to the physical reality. I concede that ignoring the cost of representation makes the "average-case is easy" argument too optimistic for biological or social systems.

  **Elena:** Thank you. But I want to meet you halfway too. I'll concede that I can't deduce a specific failure from a general theorem. I can't look at a specific human decision and say, "You failed because this was an NP-hard instance." The theory doesn't predict individual behavior. So, if worst-case hardness doesn't dictate specific outcomes, and average-case relies on distributional assumptions we can't always verify... what is the cash value of the theory for us? What *can* complexity tell us about real limits, if not this?

  **Marcus:** It tells us about scaling. That's the real physical insight. It's not about whether a system *can* solve a problem of size $n=100$. It's about what happens when the system grows. If an institution solves its coordination problem efficiently at a population of one thousand, complexity theory gives us the tools to ask: what breaks when it hits one million? If the underlying logic of their coordination relies on an algorithm that scales exponentially, the system *will* fracture under growth, regardless of how clever the agents are. It doesn't tell us they will fail today; it tells us they cannot grow indefinitely without changing the structure of the problem.

  **Elena:** So it's a constraint on morphogenesis, not just performance.

  **Marcus:** Exactly. It's about structural stability under scaling. And I'll add one more thing: it tells us where to look for phase transitions. In physics, we know water boils at a specific temperature. In computation, we know that for certain classes of problems, there is a critical ratio of constraints to variables where the problem shifts from typically easy to typically hard. If a real-world system operates near that critical threshold, small perturbations cause massive computational spikes. That's not worst-case asymptotics; that's a landscape feature that exists for finite, real-world sizes.

  **Elena:** That I can accept. If the claim is that complexity theory maps the topology of possibility—showing us where the cliffs are, even if we usually walk on the plateau—then I don't need it to be a deterministic law of failure. I just need it to be a map of the terrain. But you have to admit that for the agents walking on that terrain, the *fear* of the cliff shapes the path. Even if the worst-case is rare, the fact that it *exists* forces agents to adopt heuristics. They don't wait to find out if an instance is hard; they assume it might be and act accordingly.

  **Marcus:** I can live with that. The existence of the worst-case creates a normative pressure. We design systems to avoid the hard region because we know it's there, even if we rarely visit it. So, the mathematics doesn't describe the actual trajectory of the agent, but it does describe the boundaries of their design space.

  **Elena:** Then perhaps we agree on this: The theory doesn't tell us what agents *do*, but it tells us what they *must become* to survive. They must become the kind of things that approximate, that ignore information, that rely on structure. The intractability isn't a barrier they hit; it's the pressure that shapes their form.

  **Marcus:** I can sign off on that. The hardness is an evolutionary pressure, not necessarily a situational wall. Just... please don't tell the department head that "scaling issues" are why my code is slow.

  **Elena:** *[Laughing]* I'll stick to the metaphysics. You handle the benchmarks.
