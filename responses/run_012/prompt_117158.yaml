      *   *Actually, let's keep it even simpler.* $h^2$ is the proportion of variance due to genes.
      *   *Round 1:* Varied G, Varied E.
      *   *Round 2:* Varied G, *Constant* E. (Heritability should go to 100%).
      *   *Round 3:* Split groups (Group A gets Low E, Group B gets High E). Within-group $h^2$ stays high, Between-group difference is 100% Environmental.
