  Here's a thinking process that leads to the suggested workshop simulation:

  1.  **Analyze the Request:**
      *   **Target Audience:** 18 science reporters (smart, experienced, but prone to specific errors regarding heritability).
      *   **Goal:** A 75-minute interactive simulation where *they* calculate heritability and experience its limitations firsthand, rather than listening to a lecture.
      *   **Core Concepts to Convey:**
          1.  Heritability ($h^2$) is a variance ratio within a specific population at a specific time (not a property of the trait/person).
          2.  High $h^2$ is compatible with large environmental shifts affecting the mean.
          3.  High within-group $h^2$ says nothing about between-group differences (the Lewontin fallacy).
          4.  Variance decomposition $\neq$ causal strength/immutable destiny.
      *   **Mechanism:** Genotype cards + Environment cards = Phenotype (additive model).
      *   **Structure:** Three rounds (Baseline, Uniform Environment, Split Environment).
      *   **Constraints:** Keep the trait "botanically neutral" (no IQ/race/behavior during the game). Needs simple math (no complex stats on the board). Needs debrief mapping. Needs troubleshooting (what goes wrong). Needs limitations note (what the sim *can't* show).
      *   **Time:** 75 minutes.

  2.  **Deconstruct the Simulation Mechanics:**
      *   *Participants:* 18 people.
      *   *Trait:* Let's call it "Bloom Height" (cm). Neutral, botanical.
      *   *Genotype (G):* Needs variation. Let's say values 10, 20, 30.
      *   *Environment (E):* Needs variation. Let's say values 5, 15, 25.
      *   *Phenotype (P):* $P = G + E$.
      *   *Heritability Calculation:* This is the tricky part for a non-statistician workshop. $h^2 = V_G / V_P$. Calculating variance ($V$) manually for 18 people is tedious and error-prone in 75 minutes.
