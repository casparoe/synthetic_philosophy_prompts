      *   *Calculation:* I will provide a simple "Variance Worksheet." Sum of $(Score - Mean)^2$. Divide by 17.
      *   *Time Check:* 18 people calculating variance might take 20 mins. I need to streamline.
      *   *Streamline:* Break into 3 teams of 6. Each team calculates variance for their subset? No, heritability is population-level.
      *   *Streamline:* I will act as the "Computer." They shout scores, I put them in a projected spreadsheet that auto-calculates Variance. *They* do the division ($V_G / V_P$). This satisfies "compute... off their own data" without 18 people doing long division.
      *   *Wait, prompt says:* "how they get a number without me doing stats on the board." Okay, I cannot be the calculator.
