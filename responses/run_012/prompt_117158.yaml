      *   *Decision:* I will design the numbers so the Variance is easy to compute. Or, I will provide a "Variance Calculator" wheel/slide rule.
      *   *Actually, the most robust way:* Give them the G and E values. $P = G + E$.
      *   *Round 1:* $V_G$ is fixed (known from deck construction). $V_E$ is fixed. They calculate $V_P$ from their P scores. Then $h^2 = V_G / V_P$.
      *   *Wait, do they know $V_G$?* If I hand out cards from a known deck, I can tell them "The Genotype Variance in this deck is X." They measure Phenotype Variance. They derive $h^2$.
      *   *Let's refine the Math:*
          *   Deck: 18 Genotype cards (6 of '10', 6 of '20', 6 of '30'). Mean G = 20. $V_G$ is constant.
          *   Deck: 18 Environment cards.
          *   Round 1: Random E (6 of '5', 6 of '15', 6 of '25').
          *   Round 2: Everyone gets E = '15'.
