      *   *Title:* "The Variance Garden."
      *   *Materials:* Cards, Worksheets, Calculators.
      *   *Script:* Step-by-step facilitation.
      *   *Troubleshooting:* What if math fails? What if they argue?
      *   *Limitations:* What this doesn't show (GxE, epigenetics, etc.).

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is calculating variance by hand for 18 people feasible in 15 mins?
      *   *Fix:* I'll provide a **Frequency Tally Sheet**. Instead of 18 individual calculations, they just count how many people have Score 30, 35, 40... The sheet has a column that says "If count is X, Contribution to Variance is Y." This reduces 18 calculations to 5 tally marks.
      *   *Critique:* Round 3 needs to be clear.
      *   *Fix:* Physically separate the room. Left side (Poor Soil), Right side (Rich Soil). Calculate $h^2$ for Left, then Right. Compare Means.
      *   *Critique:* "Without me doing stats on the board."
      *   *Fix:* The Frequency Tally Sheet handles this. It's a tool they use, not me projecting Excel.

  8.  **Final Polish:**
      *   Ensure tone is professional but actionable.
      *   Make sure the "Four Points" are explicitly linked to the rounds.
      *   Add the "Honest Note" on limitations (Twin method assumptions, SNP heritability, etc.).

  *(Self-Correction on Math)*: Calculating variance manually is still risky for time.
  *Alternative:* Use the **Range Approximation**. $Variance \approx (Range / 4)^2$. It's statistically dirty but for a workshop simulation about *concepts*, it's fast and illustrates the *change* in variance effectively.
  *Decision:* No, reporters care about accuracy. I'll stick to the **Frequency Tally Sheet** with pre-computed Sum of Squares contributions. It's the best balance of rigor and speed. I will design the numbers (G and E) to be integers that make the mean an integer to avoid decimals.
