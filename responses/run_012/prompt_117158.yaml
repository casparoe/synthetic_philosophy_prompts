          *   No, they need a number.
          *   *Okay, I will bite the bullet.* I will provide a **Lookup Table**.
          *   Step 1: Calculate Mean (Sum of all P / 18).
          *   Step 2: Everyone finds $(P - Mean)^2$.
          *   Step 3: Sum those up.
          *   Step 4: Look up "Sum of Squares" on a chart that gives "Variance."
          *   Step 5: Divide Known $V_G$ by Calculated $V_P$.
          *   *Wait, Known $V_G$:* I need to tell them the Genotype Variance is a constant value (e.g., 50) because the deck composition doesn't change.
          *   *Okay, Plan:*
              1.  Distribute G and E cards.
              2.  Calculate P.
              3.  Find Mean P.
              4.  Calculate Sum of Squared Deviations (SSD).
              5.  Use provided formula: $V_P = SSD / 17$.
              6.  $h^2 = V_G / V_P$. (I give them $V_G$).
              7.  To save time: I will provide a "Variance Calculator" slip where they just write the counts of each score, and the slip has the math pre-done on the side.

  3.  **Drafting the Rounds:**
      *   **Round 1 (Baseline):** Random G, Random E. $V_G > 0, V_E > 0$. $h^2$ will be moderate (e.g., 0.5).
      *   **Round 2 (Uniform Environment):** Random G, Constant E. $V_E \approx 0$. $V_P \approx V_G$. $h^2 \rightarrow 1.0$. *Lesson: Environment matters, but if it doesn't vary, it doesn't contribute to variance.*
      *   **Round 3 (Stratified Environment):** Random G, Split E (Half Low, Half High).
          *   *Crucial:* Calculate $h^2$ *within* Group A and *within* Group B.
          *   *Observation:* Within-group $h^2$ remains high (because G varies, E is constant *within* the group).
          *   *Observation:* Mean of Group A $\neq$ Mean of Group B. Difference is 100% Environmental.
          *   *Lesson:* Lewontin's Fallacy.

  4.  **Addressing Constraints & Pitfalls:**
      *   *Time:* 75 mins is tight for 3 rounds + math + debrief.
      *   *Math Anxiety:* Reporters might freeze.
      *   *Solution:* Pre-printed "Stats Steward" roles. Assign 3 people to be the "Calculators" for the room. The rest just provide data.
      *   *Trait:* "Stem Height" (mm). Neutral.
      *   *Limitations:* The sim assumes additive $G+E$. No interaction ($G \times E$). No measurement error. Real $h^2$ (SNP-based vs Twin) is messier.

  5.  **Refining the Debrief:**
      *   Map Round 1 $\rightarrow$ Definition (Population specific).
      *   Map Round 2 $\rightarrow$ Environmental Shift (Mean shift vs Variance).
      *   Map Round 3 $\rightarrow$ Between-Group Fallacy.
