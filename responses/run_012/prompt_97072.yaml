prompt: |-
  I have no formal philosophy background, so I would like the wrong-kind-of-reasons problem restated in the vocabulary I actually think in — reinforcement learning — as faithfully as you can manage, followed by a residue report. My working vocabulary: reward functions, policies, environments, trajectories, proxy objectives, specification gaming, reward hacking, Goodhart's law, offline versus online data, state variables versus observations, and the difference between a reward computed from the world and one computed from the agent's own internals. Treat those as my native terms and translate into them.

  The target is the cluster of ideas usually gathered under "the wrong kind of reasons": the buck-passing or fitting-attitude approach to value, on which something is valuable just in case it is fitting to value it, so that any reason to have the valuing attitude threatens to count as a reason for the value; the standard counterexamples in which a threat, a bribe, or a prize gives you a reason to admire or to believe something without making the object admirable or the proposition true; and the distinction commonly drawn between object-given and state-given reasons — reasons that bear on the object of the attitude versus reasons that bear only on the attitude's being had. Map each of these onto my vocabulary as precisely as you can. I am especially interested in whether a reward that reads out the agent's own belief, policy, or internal state — rather than the state of the world — is the right analogue of a state-given reason, and whether the standard counterexamples correspond to a self-referential or otherwise hackable proxy objective.

  Then give me the residue report, which is the part I care most about. Which of the philosophers' claims survive translation cleanly, which survive only with distortion, and which cannot be expressed in my vocabulary at all? My suspicion is that the deepest residue sits at doxastic involuntarism: the reason a prize cannot give you a reason of the right kind to believe something is that you cannot adopt a belief at will, whereas a policy is precisely the sort of thing an optimizer can rewrite for a prize, so the analogue may simply fail to arise. Tell me whether the translation dissolves the problem, relocates it somewhere I should have expected, or exposes the original disagreement as less substantive than it appears. Also tell me whether the distinction I am drawing between world-derived and internally-derived reward is doing the same work as the object-given/state-given distinction or is quietly smuggling in an assumption the philosophers would reject — in particular, whether my framing presupposes a designer's intent where they appeal instead to a standard internal to the attitude itself, such as belief being correct just in case it is true. Be honest about where the mapping is forced; do not paper over the seams.

  Lead with your bottom line in the first sentence, then give the reasoning. No preamble, and do not restate my question.
