prompt: |-
  I'm in a graduate seminar on the philosophy of the social sciences, and last week we read David Lewis's Convention (1969). I followed the coordination-problem apparatus well enough, but the definition at the center of the book kept sliding out from under me, so I've been more dependent than I'd like on other people's summaries of it. On the walk home from the seminar, a friend of mine who works in game theory gave me his account of the book, and it was so crisp that I've been repeating it ever since; I'd like to check it before it settles into my understanding. What he said, more or less, was this: 'Lewis's basic idea is that a convention is any regularity of behavior that a group shares — queueing, shaking hands, dressing for weddings are all conventions in his sense. What makes it a convention rather than a coincidence is that everyone knows that everyone else does it, and that's enough to keep it going: I do it because I expect you to, you do it because you expect me to, and so we lock in. Since the regularity could have been otherwise — since there was some other thing everyone could have done instead that would have worked just as well — conventions are arbitrary, and that arbitrariness is the heart of the theory. In effect, conventions are solutions to prisoner's dilemmas, and Lewis's deeper contribution was to show that norms can evolve without anyone ever agreeing to them, because the practices that coordinate us better get copied and spread while the others die out.' His conclusion, delivered with some relish, is that Lewis's theory is really a debunking theory of norms: once you see conventions as arbitrary solutions to coordination problems, you see that a great deal of what we experience as morally binding is just a habit that happened to stick, and that any convention could be swapped for its alternative without any real loss.

  I have a nagging sense that this is a competent summary with one or two things quietly distorted, but I can't tell whether my unease is intellectual or just discomfort with where it lands. Could you go through it clause by clause and tell me what Lewis would accept as fair, what is a harmless popularization, and what is a genuine misreading — including whether 'arbitrary' is being used in Lewis's technical sense or in its everyday one? I'd especially like to know whether the move from 'conventions are arbitrary' to 'conventions carry no authority, and moral norms are just conventions that happened to stick' is licensed by anything in the book or is an overreach a careful reader would reject, and whether the evolutionary story about norms is a fair rendering of what Lewis actually offers. No reading list, please — I just want to see where the summary does justice to the view and where it doesn't.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Graduate seminar on philosophy of social sciences. Read David Lewis's *Convention* (1969).
      *   **Problem:** The user found Lewis's definition slippery and relied on summaries. A friend (game theorist) gave a crisp summary.
      *   **Task:** Evaluate the friend's summary clause by clause. Identify what Lewis would accept, what is harmless popularization, and what is a genuine misreading.
      *   **Specific Focus Areas:**
          *   The definition of convention (regularity, common knowledge, expectations).
          *   The concept of "arbitrariness" (technical vs. everyday sense).
          *   The game theoretic classification (Prisoner's Dilemma vs. Coordination Problem).
          *   The evolutionary story (copying/spreading vs. Lewis's actual account).
          *   The normative conclusion (debunking theory of norms, moral norms as conventions).
      *   **Constraint:** No reading list. Just analysis of the summary against Lewis's text.

  2.  **Deconstruct the Friend's Summary (Clause by Clause):**

      *   *Clause 1:* "Lewis's basic idea is that a convention is any regularity of behavior that a group shares — queueing, shaking hands, dressing for weddings are all conventions in his sense."
          *   **Lewis's View:** Lewis defines convention as a *regularity in behavior* (or preference + behavior) in a *population* in a *recurrent situation*.
          *   **Assessment:** Mostly fair, but needs the caveat that not *all* regularities are conventions (needs the specific conditions). Queueing/hands/dressing are standard examples Lewis uses or accepts.
          *   **Verdict:** Fair popularization, slightly loose on necessary conditions.

      *   *Clause 2:* "What makes it a convention rather than a coincidence is that everyone knows that everyone else does it, and that's enough to keep it going: I do it because I expect you to, you do it because you expect me to, and so we lock in."
          *   **Lewis's View:** This refers to *common knowledge* and *conditional preferences*. I prefer to conform *if* others conform.
          *   **Assessment:** "Everyone knows that everyone else does it" touches on common knowledge. "I do it because I expect you to" captures the interdependent expectation.
          *   **Verdict:** Fair summary of the epistemic and motivational structure.

      *   *Clause 3:* "Since the regularity could have been otherwise — since there was some other thing everyone could have done instead that would have worked just as well — conventions are arbitrary, and that arbitrariness is the heart of the theory."
          *   **Lewis's View:** This is the definition of *arbitrariness* in Lewis's technical sense. There must be at least one alternative regularity that *could have* prevailed instead.
          *   **Assessment:** This is technically correct regarding Lewis's definition.
          *   **Verdict:** Accurate technical usage.

      *   *Clause 4:* "In effect, conventions are solutions to prisoner's dilemmas..."
          *   **Lewis's View:** **CRITICAL ERROR.** Lewis explicitly distinguishes conventions from Prisoner's Dilemmas. Conventions are solutions to *Coordination Problems* (specifically, coordination problems with multiple equilibria). In a PD, individual rationality leads to a suboptimal outcome without enforcement/repetition. In Coordination, individual rationality *aligns* with group rationality once the expectation is set.
          *   **Assessment:** This is a genuine misreading. It confuses the game structure.
          *   **Verdict:** Genuine misreading.

      *   *Clause 5:* "...and Lewis's deeper contribution was to show that norms can evolve without anyone ever agreeing to them, because the practices that coordinate us better get copied and spread while the others die out."
          *   **Lewis's View:** Lewis does discuss precedent and salience. He allows for conventions to arise without explicit agreement (tacit convention). However, the "evolutionary story" about practices getting "copied and spread" sounds more like evolutionary game theory (Maynard Smith, etc.) or cultural evolution, which came *after* Lewis. Lewis focuses more on *reasoning* and *induction* from precedent rather than a biological/cultural selection mechanism.
          *   **Assessment:** Slightly anachronistic. Lewis talks about precedent and salience, not necessarily an evolutionary selection mechanism in the biological sense. But he does argue against explicit agreement.
          *   **Verdict:** Harmless popularization with a slight anachronistic tint.

      *   *Clause 6:* "His conclusion... is that Lewis's theory is really a debunking theory of norms: once you see conventions as arbitrary solutions to coordination problems, you see that a great deal of what we experience as morally binding is just a habit that happened to stick, and that any convention could be swapped for its alternative without any real loss."
          *   **Lewis's View:** Lewis is careful to distinguish *conventions* from *moral norms*. While some moral norms might be conventions (e.g., property rules), Lewis does not claim *all* norms are conventions. He explicitly warns against reducing morality to convention. The "arbitrariness" is technical (another equilibrium existed), not normative (it doesn't matter which we pick). Once a convention is in place, there *is* a loss to switching (coordination failure).
          *   **Assessment:** This is a massive overreach. Lewis is descriptive/analytic, not primarily debunking. The "without any real loss" part contradicts the idea that conventions solve coordination problems (switching costs are high).
          *   **Verdict:** Genuine misreading/Overreach.

  3.  **Synthesize and Structure the Response:**

      *   **Introduction:** Acknowledge the user's unease. Validate that the friend's summary is catchy but contains significant errors, particularly regarding game type and normative implications.
      *   **Clause-by-Clause Analysis:**
          1.  *Regularity/Examples:* Fair, but note the specific conditions required.
          2.  *Common Knowledge/Expectations:* Accurate core insight.
          3.  *Arbitrariness:* Explain the technical sense (alternative equilibrium) vs. everyday sense (capricious). This is crucial for the user's confusion.
          4.  *Prisoner's Dilemma:* **Flag this as the biggest error.** Explain Coordination vs. PD.
          5.  *Evolution/Agreement:* Nuanced. Lewis rejects explicit agreement but relies on reasoning/precedent, not just blind copying.
          6.  *Debunking/Morality:* **Flag this as the second biggest error.** Explain the "normative force" of conventions once established and Lewis's distinction between convention and morality.
      *   **Specific Focus on "Arbitrary":** Dedicate a section to clarifying this, as the user asked.
      *   **Specific Focus on Normative Authority:** Address the "debunking" claim.
      *   **Conclusion:** Summarize the verdict (good on epistemology, bad on game theory and ethics).

  4.  **Refine the Tone:**
      *   Academic but accessible (graduate seminar level).
      *   Respectful of the friend (game theorist) but firm on the textual evidence.
      *   Directly answer the prompt's specific questions.

  5.  **Self-Correction/Double Check during drafting:**
      *   *Did Lewis talk about evolution?* He talks about *precedent* and *induction*. Evolutionary game theory (Skyrms, etc.) came later building on Lewis. I need to make sure I don't attribute evolutionary dynamics to Lewis that aren't there. He focuses on *rational agents* reasoning about precedent.
      *   *Did Lewis talk about morality?* In *Convention*, he mostly brackets morality. In later work (*Languages and Language*), he clarifies. But the prompt is about *Convention*. I must stick to what *Convention* supports. Lewis explicitly says conventions are not necessarily moral obligations.
      *   *Prisoner's Dilemma:* This is the smoking gun. If the friend says PD, they haven't read the book closely. Lewis defines convention *via* Coordination Equilibria. In PD, the equilibrium is not a coordination equilibrium in Lewis's sense (preferences don't align conditionally).

  6.  **Final Polish:** Ensure the distinction between "arbitrary in origin" and "arbitrary in maintenance" is clear. Ensure the distinction between "coordination problem" and "prisoner's dilemma" is sharp.

  *(Self-Correction Note)*: Wait, I need to be careful about the "evolutionary" claim. Lewis *does* allow for conventions to arise without agreement. But the mechanism is *inductive reasoning from precedent*, not necessarily "copying" in a memetic sense. The friend's phrasing "practices that coordinate us better get copied" sounds like functionalist evolution. Lewis is more about *rational expectation* based on past success. I will classify this as a slight distortion/anachronism.

  *(Self-Correction Note)*: On the "debunking" claim. This is a common critique *of* Lewis (e.g., by Margaret Gilbert), but is it Lewis's *conclusion*? No. Lewis is trying to explain *how* conventions work, not necessarily to dissolve their normativity. In fact, he explains *why* they have normativity (conditional preferences). So the friend is attributing a philosophical agenda to Lewis that isn't in the text.

  7.  **Drafting the Response.** (Proceed to generate output based on these points.)
answer: |-
  Your unease is well-founded. Your friend's summary captures the *spirit* of the book's reception in popular social science, but it distorts the technical machinery Lewis built, and it draws a normative conclusion that Lewis explicitly resisted. The summary is rhetorically crisp but philosophically leaky.

  Here is a clause-by-clause assessment of what Lewis would accept, what is a harmless simplification, and what is a genuine misreading.

  ### 1. "Lewis's basic idea is that a convention is any regularity of behavior that a group shares..."
  **Verdict: Harmless Popularization.**
  Lewis does define convention as a "regularity in behavior" (or in behavior and preference) within a population. However, he would object to the word "any." Not every shared regularity is a convention (e.g., everyone breathing is a regularity, but not a convention). Lewis requires specific conditions: the regularity must be sustained by a system of preferences and expectations. Your friend glosses over the necessary conditions to get to the examples quickly. The examples (queueing, shaking hands) are Lewisian, so this is acceptable shorthand, provided you remember there are stricter criteria underneath.

  ### 2. "...everyone knows that everyone else does it, and that's enough to keep it going: I do it because I expect you to, you do it because I expect me to, and so we lock in."
  **Verdict: Fair.**
  This is the strongest part of your friend's summary. It accurately captures Lewis's reliance on **common knowledge** and **conditional preferences**. For Lewis, a convention persists because my preference to conform is *conditional* on my belief that you will conform. The "locking in" describes the equilibrium state. Lewis would endorse this as a faithful description of the motivational structure of convention.

  ### 3. "...conventions are arbitrary, and that arbitrariness is the heart of the theory."
  **Verdict: Technically Accurate, but prone to misunderstanding.**
  Your friend is using "arbitrary" in Lewis's **technical sense**, not the everyday sense.
  *   **Everyday sense:** Capricious, unreasoned, or lacking justification.
  *   **Lewis's technical sense:** There exists at least one *alternative regularity* that could have solved the coordination problem just as well. (e.g., driving on the left vs. driving on the right).
  Lewis would accept this clause. However, he would warn that "arbitrary" does not mean "without reason." Once the convention is established, there is a very strong reason to follow it (to avoid coordination failure). The arbitrariness lies in the *selection* of the equilibrium, not in the *reasons for maintaining* it.

  ### 4. "In effect, conventions are solutions to prisoner's dilemmas..."
  **Verdict: Genuine Misreading.**
  This is the most significant technical error in the summary. Lewis explicitly distinguishes conventions from Prisoner's Dilemmas (PD).
  *   **Prisoner's Dilemma:** Individual rationality leads to a suboptimal outcome for the group. Cooperation requires overcoming self-interest (often through enforcement or iteration).
  *   **Coordination Problem (Lewis's focus):** Individual rationality *aligns* with group rationality once expectations are set. I want to do what you do; you want to do what I do.
  Lewis's entire apparatus is built on **Coordination Equilibria**, not PD equilibria. In a PD, if I expect you to defect, I should defect. In a Lewisian convention, if I expect you to drive on the right, I *must* drive on the right to satisfy my own preferences. Conflating the two destroys the explanatory power of Lewis's account.

  ### 5. "...norms can evolve without anyone ever agreeing to them, because the practices that coordinate us better get copied and spread while the others die out."
  **Verdict: Anachronistic Popularization.**
  Lewis does argue that conventions can be **tacit** (arising without explicit agreement), relying on **precedent** and **salience**. However, the language of practices getting "copied and spread while others die out" sounds like **evolutionary game theory** (e.g., Brian Skyrms or Maynard Smith), which developed *after* Lewis.
  Lewis's agents are rational reasoners who use induction from past cases; they are not merely vessels for copying successful traits. While Lewis allows for conventions to emerge organically, he explains this through *reasoning about precedent*, not through a blind evolutionary selection mechanism. Your friend is projecting later developments back onto Lewis. It's not a fatal error, but it blurs Lewis's rationalist account with later naturalist accounts.

  ### 6. "His conclusion... is that Lewis's theory is really a debunking theory of norms... a great deal of what we experience as morally binding is just a habit that happened to stick, and that any convention could be swapped for its alternative without any real loss."
  **Verdict: Genuine Misreading / Overreach.**
  This is where your friend's summary becomes dangerous.
  *   **Debunking:** Lewis's project in *Convention* is primarily **descriptive and analytic**, not debunking. He wants to explain *how* norms function, not necessarily to dissolve their authority.
  *   **Moral Norms:** Lewis is very careful to distinguish conventions from moral obligations. While he admits some moral rules (like property rights) might have a conventional basis, he does not claim *all* moral norms are conventions. He explicitly notes that conventions generate obligations (you *ought* to drive on the right), but these are distinct from moral obligations.
  *   **"Without any real loss":** This contradicts Lewis's own theory. While the *choice* between equilibria is arbitrary (left vs. right), the *switch* from one established convention to another is costly. Once a convention is in place, swapping to the alternative causes coordination failure. Therefore, conventions *do* carry authority and practical weight. To say they can be swapped "without loss" ignores the cost of disrupting the equilibrium.

  ### Summary of the "Arbitrary" and "Normative" Issues

  You asked specifically about the move from "arbitrary" to "no authority." This is the crux of your discomfort.

  **1. The Technical Sense of Arbitrary:**
  Lewis means that the *origin* of the convention is underdetermined. We could have agreed on "hello" or "good day." But once the convention exists, it is no longer arbitrary in practice. It becomes the rational thing to do. Your friend is sliding from "arbitrary in origin" to "arbitrary in force." Lewis would reject the latter.

  **2. The Normative Overreach:**
  Your friend claims Lewis shows norms are "just habits." Lewis argues conventions create **normative expectations**. If you violate a convention, you disappoint expectations and frustrate the preferences of others. Lewis explains the *source* of the normativity (interdependent expectations), he doesn't deny the normativity exists.
  Furthermore, Lewis does not argue that moral norms are *reducible* to conventions. He leaves open the possibility that some norms are non-conventional. Your friend's conclusion that "moral norms are just conventions that happened to stick" is a philosophical stance (a form of moral skepticism) that your friend is attributing to Lewis, but which Lewis does not defend in *Convention*.

  ### Final Verdict

  Your friend has given you a summary that works for a cocktail party but fails for a graduate seminar.
  *   **Keep:** The account of common knowledge, conditional expectations, and the technical definition of arbitrariness (alternative equilibria).
  *   **Discard:** The identification of conventions with Prisoner's Dilemmas (they are Coordination Problems) and the claim that Lewis debunks moral authority (he explains it, and distinguishes it from morality).
  *   **Qualify:** The evolutionary story (Lewis focuses on rational induction from precedent, not blind copying).

  Your unease is intellectual, not just emotional. You correctly sensed that the summary collapsed the distinction between *explaining* a norm and *dissolving* it, and it misidentified the game-theoretic structure that is the engine of Lewis's whole book.
