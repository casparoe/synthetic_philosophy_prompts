answer: |-
  Your hypothesis is largely correct, but calling it merely a dispute about individuation risks making it sound like a semantic quibble when the stakes are methodological and ontological. The impasse persists not because philosophers are bad at defining words, but because the two sides are using MR to fight over *what psychology is for*, and they have quietly adopted individuation criteria that guarantee their preferred outcome.

  Here is the concrete diagnosis of the stalemate.

  **1. The Individuation Hypothesis is Right, But It's Motivated**
  You identified the "grain" problem correctly. If you individuate physical states finely (down to the quantum level), every token is unique, so MR is trivially true (everything is multiply realized). If you individuate coarsely (by gross anatomy), MR might be false (mammals share structures).
  *   **Functionalists (Fodor):** Individuate mental kinds *coarsely* by causal role (what pain *does*) because their goal is to protect the **autonomy of psychology**. They need "pain" to be a natural kind that supports laws across humans, octopuses, and aliens, otherwise psychology collapses into neuroscience.
  *   **Reductive Physicalists (Bechtel & Mundale, Polger & Shapiro):** Individuate physical kinds by **mechanistic structure** because their goal is to secure **ontological reduction**. They argue that if you look at actual neuroscience (e.g., nociceptors), the structural commonalities across mammals are sufficient for type-identity, making MR an empirical exaggeration.

  The stalemate happens because when a physicalist says "look, the structures are similar," the functionalist says "you're individuating too finely," and when a functionalist says "look, silicon could feel pain," the physicalist says "you're individuating too coarsely." They aren't just disagreeing on the grain; they are disagreeing on *which grain serves the scientific goal*.

  **2. It Is Not Merely Verbal, It Is "Different-Questions"**
  This isn't a verbal dispute in the sense that it doesn't matter. It is a clash of explanatory interests.
  *   **Question A (Functionalists):** Can psychological generalizations hold across physically diverse systems? (Requires MR to be true).
  *   **Question B (Physicalists):** Are mental states ontologically identical to physical states in any given organism? (Requires MR to be false or irrelevant).

  The debate stalls because MR is being asked to do too much work. It is supposed to prove both that psychology is autonomous *and* that mental states are non-physical kinds. Jaegwon Kim showed decades ago that you can have MR *and* reduction (via "local reduction": human pain = human C-fiber firing, octopus pain = octopus ganglia firing). But functionalists resist this because it threatens the *general* status of mental kinds, while physicalists resist MR because it threatens *global* identity.

  **3. What Counts as Progress**
  Progress will not come from waiting for neuroscience to settle the "true" grain of realization, because neuroscience itself individuates differently depending on whether it is doing clinical work (coarse) or molecular work (fine). Progress requires your group to **disentangle autonomy from identity**.
  *   **Move 1:** Accept Polger & Shapiro's (2016) rigorous criteria for MR (same capacity, same function, different structure). This forces empirical precision.
  *   **Move 2:** Acknowledge that even if MR is rare empirically (as Polger & Shapiro argue), it might still be *metaphysically possible*, which is all the functionalist needs for autonomy.
  *   **Move 3:** Accept Kim's local reduction. This allows the physicalist to say "yes, mental states are physical states" without forcing the functionalist to say "psychology is just neuroscience."

  If your group continues to ask "Is MR true?" you will burn another month. If you ask "What work do we want MR to do for us?" you might move.

  Diagnosis: different-questions — Because functionalists use MR to defend explanatory autonomy while physicalists attack it to secure ontological reduction, they employ incompatible individuation criteria that serve divergent scientific goals rather than tracking a single mind-independent fact.
