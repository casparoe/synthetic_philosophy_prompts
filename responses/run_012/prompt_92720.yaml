answer: |-
  **Project Title:** The Coherence of the Franchise: Testing Unified Principles Across Three Reform Debates

  **Project Overview and Central Question**
  Contemporary political theory debates regarding electoral reform are characterized by significant fragmentation. Arguments for extending the vote to resident non-citizens, lowering the voting age, and instituting compulsory voting typically proceed in separate literatures, governed by distinct normative assumptions. This project proposes that these three reforms are not isolated policy questions but rather concurrent probes into the fundamental nature of the franchise. The central research question is determinate: Can a single normative principle consistently determine both the *boundary* of the franchise (who ought to vote) and the *mode* of the franchise (whether those included ought to be compelled to vote), or do these three reforms rest on incompatible accounts of political membership?

  The hypothesis to be tested is that the three reforms cannot be underwritten by a single principle. Instead, the familiar justifications for the franchise—vote as a right based on affected interests, vote as a right based on subjection to law, and vote as a public office or duty—each pick out different subsets of these reforms. If this hypothesis holds, proponents of specific reform packages may be holding incompatible theoretical commitments, advocating for boundaries justified by one principle while advocating for modalities justified by another.

  **The Gap in Existing Literature**
  Existing positions leave this question open because the normative frameworks used to justify inclusion are siloed from those used to justify obligation. Boundary debates typically rely on "all affected interests" or "subjection to coercive law." These principles appear sufficient to determine who counts but remain silent on whether counting is mandatory. Conversely, debates regarding compulsory voting are framed through a binary of liberty versus civic duty, rarely interrogating whether the underlying justification for the duty aligns with the justification for the boundary.

  For example, if the franchise is grounded in subjection to law, extending it to resident non-citizens and younger citizens follows directly, as both groups are subject to coercive authority. However, this principle does not obviously generate an obligation to vote; subjection generates a claim to protection, not necessarily a duty to participate. If the franchise is grounded in affected interests, all three reforms become harder to reach, as interests may be protected via representation without direct voting, and compulsory voting becomes particularly difficult to justify since one cannot be forced to protect one's own interests. By treating these debates separately, current literature allows theorists to advocate for combinations of reforms that may be logically inconsistent when reconstructed under a single principle.

  **Methodology and Work Plan**
  This project will employ a method of conceptual reconstruction and normative stress-testing rather than a comparative survey. The work will proceed over a five-month semester according to the following schedule:

  *   **Month 1: Reconstruction of Principles.** I will rigorously define the three candidate principles (Affected Interests, Subjection to Law, Vote as Office/Duty). The goal is to strip them of their contingent associations with specific reforms to treat them as free-standing normative claims.
  *   **Month 2: Application to Boundary Reforms.** I will apply each principle to the cases of non-citizen voting and youth voting. I will determine which principles logically necessitate inclusion, which permit it, and which exclude it.
  *   **Month 3: Application to Modal Reform.** I will apply each principle to compulsory voting. I will test whether a principle that mandates inclusion also mandates participation, or if a additional, external premise is required to bridge the gap between having a vote and using it.
  *   **Month 4: Synthesis and Incompatibility Testing.** I will map the results to identify overlaps. The core task is to see if any single principle supports all three reforms. If no single principle supports all three, I will catalog which combinations are theoretically viable and which require mixing incompatible foundations.
  *   **Month 5: Drafting and Refinement.** I will write the final paper, focusing on the implications of any identified incompatibilities for democratic theory and reform advocacy.

  **Justification of Approach**
  The obvious alternative to this method is a straight comparative survey of the three debates, cataloging the arguments currently made for each reform. This approach is insufficient because it describes existing discourse rather than testing its coherence. A survey would report that different authors use different principles; it would not reveal whether those principles *can* be unified or whether the current landscape of argumentation is fundamentally fragmented. My proposed method is reconstructive: it asks not what arguments are made, but what arguments *can* be made consistently. This moves the project from intellectual history to normative theory, allowing for a critique of current reform coalitions that might otherwise appear stable.

  **Expected Results and Conditions of Failure**
  A successful result will look like a mapping of the normative landscape that demonstrates either the existence of a unified theory or, more likely given the hypothesis, a clear demonstration of incompatibility. Specifically, success involves showing that adopting a specific boundary principle logically entails or precludes compulsory voting, thereby revealing that proponents of specific reform packages often hold incompatible commitments. For instance, demonstrating that the "subjection" principle supports expansion but not compulsion would force theorists to choose between consistent expansionism or consistent compulsory voting, rather than advocating for both under the same banner.

  The project would count as a failure if the three principles prove too indeterminate to yield clear implications for the reforms. If "affected interests" or "subjection" can be stretched to justify any combination of reforms through ad hoc qualification, the test would lack discriminative power. Additionally, the project would fail if I cannot clearly distinguish the "boundary" question from the "mode" question, collapsing the analysis into a general discussion of democratic legitimacy rather than a specific test of franchise coherence.

  **Scope**
  The scope is strictly limited to the three specified reforms and the three specified principles. I will not attempt to construct a full theory of democratic legitimacy or address other forms of participation beyond voting. This limitation ensures the project is manageable within a semester while remaining substantial enough to challenge the siloed nature of current literature. By restricting the variables, I can ensure the determinacy of the central question is maintained throughout the analysis.
