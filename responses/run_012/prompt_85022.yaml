prompt: |-
  Next month I'm giving a 40-minute talk at a small workshop on bounded rationality, and I'm basically the token decision theorist in the room. The crowd is mostly experimental and behavioral economists who spend their lives documenting preference reversals, framing effects and intransitive choice in the lab, plus two or three people from the ecological rationality / heuristics side who think the whole expected-utility apparatus is a fantasy imposed on agents who are actually doing something smarter, plus one Bayesian statistician who will want every step made formal. I'm defending a version of the coherence argument for expected utility maximization, but with two twists that I expect will be the entire fight. First, I drop completeness entirely -- I'm happy to say their are genuinely incomparable options and that my argument is simply silent about what you should do with them. Second, I run the argument on choice dispositions rather than on preferences. The constraint I defend is menu-consistency: if you'd pick A from {A,B} and B from {B,C}, you should be willing to pick A from {A,B,C}; if you won't, there's a finite sequence of menu offers that leaves you worse off by your own lights, with no change in your tastes, no new information, and no factual mistake on your part. What I claim to get out of that is a prohibition on a certain class of cyclic choice patterns plus a partial representation result -- not full expected utility maximization, and I say so out loud, repeatedly. (My flatmate, who does experimental econ, thinks the whole thing is a bait and switch, which is definately a preview.)

  What I want from you is a Q&A prep sheet for that specific room: the eight or ten objections these people will actually raise -- not the ones I'd get in a decision theory seminar, and not the ones I'd get from the LessWrong crowd -- ordered by how likely each is times how much damage it does to me, each one phrased the way they'd phrase it, with a two-minute reply and an honest note on where the reply is soft, where I'm going to have to bite a bullet, and which objection I should just concede outright. Tell me what to give away in the first five minutes so the rest of the hour isn't about that, and which single objection has to be defused for the talk to count as having landed at all. Also tell me whether the menu-consistency move actually insulates me from the standard "the pump only works if you keep changing your mind" line, or whether it just relocates the problem, because I genuinely don't know how that goes down with this audience. And give me the question I'm hoping nobody asks -- the one aimed at the weakest joint in the whole thing -- plus what to say if it comes. No reading list, no citations, I've read the stuff; what I need is the actual question period.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Decision theorist (normative focus).
      *   **Audience:** Small workshop on bounded rationality.
          *   Majority: Experimental/Behavioral economists (empiricists, focused on anomalies like preference reversals, framing, intransitivity).
          *   Minority 1: Ecological rationality/Heuristics (Gigerenzer-style, anti-optimization, pro-adaptation).
          *   Minority 2: One Bayesian statistician (wants formalism).
      *   **Topic:** Coherence argument for Expected Utility (EU) maximization, but with twists:
          *   Drop Completeness (allow incomparability).
          *   Focus on *Choice Dispositions* (menu-consistency) rather than abstract Preferences.
          *   Claim: Prohibition on specific cyclic choice patterns + Partial representation (not full EU).
          *   Argument: Money pump/Dutch Book style (finite sequence of menu offers leaves you worse off by your own lights).
      *   **Goal:** Q&A prep sheet (8-10 objections), ordered by likelihood $\times$ damage. Phrased in audience's voice. 2-minute replies. Honest assessment of weaknesses ("bite the bullet," "concede"). Strategic advice (what to concede early, what *must* be defended). Analysis of the "menu-consistency" move against the "changing mind" objection. Identification of the "killer question."
      *   **Constraints:** No reading list, no citations. Focus on the actual question period dynamics.

  2.  **Deconstruct the Argument & Vulnerabilities:**
      *   *Strengths:* Dropping completeness addresses a major behavioral critique (indecisiveness is real). Focusing on dispositions avoids the "preference vs. choice" gap.
      *   *Weaknesses:*
          *   "Worse off by your own lights": How do we know their lights? If they have incomplete preferences, do they *feel* exploited?
          *   Menu-consistency: Is it too strong for bounded agents? Search costs? Cognitive load?
          *   Money Pump: The standard "just stop" objection. Does dispositionality solve this?
          *   Ecological Rationality: Why maximize coherence if heuristics work better in the wild?
          *   Bayesian: Is the partial representation formal enough?
          *   Experimentalists: Is this normative prescriptivism irrelevant to descriptive reality?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Behavioralist/Empiricist):* "People don't do this, so why prescribe it?" -> *Damage:* High (irrelevance). *Likelihood:* Very High.
      *   *Objection 2 (The Money Pump/Stopping Rule):* "I'll just stop the pump." -> *Damage:* High (undermines the core argument). *Likelihood:* High.
      *   *Objection 3 (Ecological/Heuristics):* "Coherence costs cognitive energy. Accuracy > Coherence." -> *Damage:* Medium-High. *Likelihood:* Medium.
      *   *Objection 4 (Incomplete Preferences/Status Quo):* "If preferences are incomplete, how can I be 'worse off'?" -> *Damage:* High (attacks the 'by your own lights' clause). *Likelihood:* Medium.
      *   *Objection 5 (The Bayesian):* "Without completeness, how do you update? What's the math?" -> *Damage:* Low-Medium (technical). *Likelihood:* Low (only one person).
      *   *Objection 6 (Framing/Menu Effects):* "Menus aren't neutral. The offer itself changes the context." -> *Damage:* Medium. *Likelihood:* High.
      *   *Objection 7 (Learning/Regret):* "Maybe I learn during the pump." -> *Damage:* Medium. *Likelihood:* Medium.
      *   *Objection 8 (Normative Force):* "So what if I'm pumpable? I don't care about coherence." -> *Damage:* High. *Likelihood:* Medium.

      *Refining for the specific audience:* The behavioralists care about *psychological plausibility*. The ecological crowd cares about *ecological validity*. The Bayesian cares about *formal coherence*.

  4.  **Ordering by Likelihood $\times$ Damage:**
      1.  The "Stop the Pump" objection (Classic, but dispositionality tries to block it).
      2.  The "Worse off by whose lights?" objection (Crucial for incomplete preferences).
      3.  The "Descriptive Irrelevance" objection (Behavioralists).
      4.  The "Cognitive Cost/Ecological" objection (Heuristics crowd).
      5.  The "Menu as Signal" objection (Framing/Context).
      6.  The "Normative Force" objection (Why care?).
      7.  The "Formal Gap" objection (Bayesian).
      8.  The "Dynamic Inconsistency" objection (Time/Regret).

  5.  **Developing Replies & "Soft Spots":**
      *   Need to be concise (2 mins).
      *   Need to admit where the theory doesn't cover everything (e.g., cognitive cost).
      *   Need to leverage the "disposition" angle.

  6.  **Strategic Advice:**
      *   *Concede Early:* Descriptive accuracy. Don't fight the behavioralists on whether people *do* violate coherence. Fight on whether they *should* (normative).
      *   *Must Defend:* The definition of "worse off" with incomplete preferences. If this fails, the money pump has no teeth.
      *   *Menu-Consistency Analysis:* Does it solve the "changing mind" issue? Yes, *if* dispositions are stable. But are they? Need to address stability.
      *   *The Killer Question:* Something about the *source* of the normativity. If preferences are incomplete, what grounds the claim that cycle A>B>C>A is bad?

  7.  **Drafting the Content (incorporating the "Voice"):**
      *   *Behavioralists:* "We see this in the lab..." "Ecological validity..."
      *   *Ecological:* "Fast and frugal..." "Adaptive toolbox..."
      *   *Bayesian:* "Measure zero..." "Sigma algebra..." (Keep it simpler, just "formal coherence").
      *   *Tone:* Professional, slightly combative but respectful workshop vibe.

  8.  **Refining the "Menu-Consistency" vs. "Changing Mind" point:**
      *   Standard money pump: You choose A over B, then B over C, then C over A. Objection: "At step 2, I changed my mind."
      *   User's move: Dispositions. "If you are *disposed* to choose A from {A,B}..."
      *   Vulnerability: Dispositions can be context-dependent. If the menu *itself* triggers a different disposition, the pump fails. This is the "Menu as Signal" objection.
      *   Verdict: It relocates the problem to the stability of dispositions across contexts.

  9.  **Identifying the "Killer Question":**
      *   It needs to attack the link between *incompleteness* and *exploitability*.
      *   Question: "If I genuinely don't care between A and B (incomplete), how can trading A for B and paying a cent be 'worse by my own lights'? My lights are off."

  10. **Final Review against Constraints:**
      *   8-10 objections? Yes.
      *   Ordered? Yes.
      *   Phrased correctly? Yes.
      *   2-min replies? Yes (summarized).
      *   Soft spots noted? Yes.
      *   Concessions? Yes.
      *   Menu-consistency analysis? Yes.
      *   Killer question? Yes.
      *   No citations? Yes.

  11. **Final Polish:** Ensure the tone matches a "token decision theorist" talking to skeptics. (Self-Correction: Make sure the Bayesian objection isn't too technical, keep it about the *utility* of formalism). Ensure the "bait and switch" comment from the flatmate is addressed implicitly (by clarifying the normative/descriptive split early).

  *(Self-Correction during drafting)*: I need to make sure I don't give the user *too much* ammo. The replies need to be realistic, not perfect. The prompt asks for "honest note on where the reply is soft." I will emphasize that.

  *(Final check on the "Menu-Consistency" move)*: The user claims this avoids the "changing mind" objection. I need to be critical here. If dispositions are defined *per menu*, then consistency is trivial or impossible. If dispositions are *global*, then the objection returns. I need to highlight this tension.

  Okay, ready to write.s
answer: |-
  Here is your Q&A prep sheet, calibrated for a room of behavioralists, ecological rationalists, and one hungry Bayesian.

  ### Strategic Pre-Game Advice

  **What to give away in the first five minutes:**
  Concede **descriptive accuracy** immediately. Do not let the experimentalists spend 20 minutes showing you papers where people violate transitivity. Say explicitly: *"I am not claiming agents actually satisfy menu-consistency. I am claiming that when they violate it, they are vulnerable to a specific kind of exploitation they would themselves reject if pointed out."* If you don't do this, the room will treat you as a naive rationalist ignoring data. Your flatmate's "bait and switch" worry is that you're smuggling a normative claim inside a descriptive model. Disarm this by making the normativity explicit upfront.

  **The single objection that must be defused:**
  **Objection #2 (The "Worse Off" Problem).** If you cannot explain how an agent with *incomplete* preferences can be "worse off by their own lights" after a money pump, your argument collapses into paternalism. You must establish that "worse off" does not require a complete ranking, only that the agent ends up with a strictly dominated outcome relative to their own partial ordering.

  **Does the "Menu-Consistency" move insulate you from "The pump only works if you keep changing your mind"?**
  **Verdict:** It relocates the problem, it does not solve it.
  **Why:** The standard objection is: "At time $t_1$ I prefer A to B, but at $t_2$ I prefer B to C because I've learned something or my mood changed." By moving to *dispositions*, you are claiming the preference is a stable property of the agent, not a momentary state.
  **The New Vulnerability:** The behavioralists will argue that dispositions are *context-dependent*. If the menu $\{A,B,C\}$ triggers a different disposition than $\{A,B\}$, you haven't found an inconsistency in the agent, you've found an inconsistency in your modeling of the choice architecture. You need to argue that the *content* of the options hasn't changed, only the set. If they argue the *meaning* of the option changes with the menu (framing), your pump stops. You must bite the bullet that *some* framing effects are irrational, not just inevitable.

  ---

  ### The Q&A Prep Sheet
  *Ordered by (Likelihood $\times$ Damage)*

  #### 1. The "Stop the Pump" Objection (Ecological/Behavioral)
  **The Question:** "Okay, so you've set up a sequence of trades where I end up with less money. But in the real world, I'm not forced to trade. Once I notice I'm back where I started but poorer, I just stop. Why is this a constraint on rationality rather than just a constraint on not noticing you're being scammed?"
  **The Reply:** "Because the pump doesn't require you to be unaware. It relies on your *dispositions*. If you are disposed to pick A from {A,B} and B from {B,C}, you are disposed to make the trade at each step. To 'stop' the pump, you have to violate your own disposition. That means either admitting your disposition was irrational (which is my point) or accepting the loss. Rationality isn't about avoiding scammers; it's about not having dispositions that make you a willing participant in your own loss."
  **Soft Spot:** This assumes the agent *cares* about the loss more than the act of choosing. If they are indifferent to the money loss (stakes too low), the pump has no bite.
  **Bullet to Bite:** You must insist that 'worse off' is defined structurally, not psychologically. Even if they don't *feel* the pain, the domination exists.

  #### 2. The "Whose Lights?" Objection (Behavioral/Incomplete Preferences)
  **The Question:** "You dropped completeness. You say I can be indifferent or incomparable between A and B. So if I trade A for B and pay a penny, and then B for A and pay a penny, how am I 'worse off by my own lights'? If A and B were incomparable, I didn't downgrade my position. I just moved sideways. Your 'worse off' criterion smuggles completeness back in."
  **The Reply:** "It doesn't require completeness. It requires *non-domination*. Even with incomplete preferences, there are outcomes you strictly prefer to others. If the pump leaves you with an outcome $X$ and you started with $X$, but now you have $X$ minus two cents, and you strictly prefer more money to less (a local completeness assumption), you are worse off. The incompleteness is between the goods, not regarding the cost of the cycle."
  **Soft Spot:** This relies on the agent having *some* complete preferences (e.g., over money). If their incompleteness extends to the transaction costs themselves, you're stuck.
  **Bullet to Bite:** Admit you assume a minimal 'more money is better' completeness. If they reject that, normative theory has no grip anyway.

  #### 3. The "Descriptive Irrelevance" Objection (Experimentalists)
  **The Question:** "We have decades of data showing people violate menu-consistency constantly. Context matters. Framing matters. If your normative theory tells people to ignore the very cognitive shortcuts that allow them to function in a complex world, isn't the theory useless? Why prescribe a cognitive operation that exceeds human capacity?"
  **The Reply:** "A theory of arithmetic is useful even though most people can't calculate 453 $\times$ 891 in their heads. It tells us what the correct answer *is*, so we can build tools to find it. My argument identifies a structural flaw in choice dispositions. It doesn't demand you calculate EU in your head; it demands you arrange your dispositions so you don't shoot yourself in the foot. Heuristics are fine, provided they don't cycle."
  **Soft Spot:** This sounds dismissive of bounded rationality.
  **Concession:** Concede that *satisficing* is often better than optimizing *if* optimization costs are high. But insist that *cycling* is never optimal, regardless of cost.

  #### 4. The "Menu as Signal" Objection (Framing/Behavioral)
  **The Question:** "You assume the menu is just a set of options. But in the lab, and in life, the menu *is* information. If you offer me {A,B,C}, that tells me something different than {A,B}. My choice changes because the *context* changed, not because I'm inconsistent. Your menu-consistency rule treats context as noise, but it's actually signal."
  **The Reply:** "That's a valid descriptive claim, but normatively, you have to separate the *option* from the *news*. If the presence of C changes the value of A, then A-in-presence-of-C is a different option than A-in-presence-of-B. If you define options that finely, consistency is trivial. But if you want to claim A is the same object in both cases, you can't use the menu to justify the reversal. You can't have it both ways."
  **Soft Spot:** This is the hardest fight. The ecological crowd will say option identity *is* context-dependent.
  **Bullet to Bite:** You must hold the line that *some* description of the option must be stable across menus, or choice theory is impossible.

  #### 5. The "Cognitive Cost" Objection (Ecological Rationality)
  **The Question:** "Checking for menu-consistency takes time and energy. In an adaptive environment, speed matters. If I use a fast-and-frugal heuristic that sometimes cycles but usually gets me food quickly, and your EU apparatus takes an hour to ensure no cycles, I starve. Coherence has a cost. Why is it the only thing that matters?"
  **The Reply:** "I agree coherence has a cost. My argument isn't that you must maximize coherence at all costs. It's that *given* your goals, cycling undermines them. If speed is a goal, include it in the options. But if you choose Fast-Option-A over Slow-Option-B in one context, and vice versa in another, purely due to menu framing, you're still vulnerable. We can trade off accuracy and effort, but we shouldn't trade off consistency for nothing."
  **Soft Spot:** Distinguishing 'trade-off for speed' from 'inconsistency' is messy.
  **Concession:** Concede that if the cycle is the price of speed, and the agent values speed over the loss, it's not irrational. But argue most observed cycles aren't speed trades.

  #### 6. The "Normative Force" Objection (Philosophical/General)
  **The Question:** "So I'm pumpable. I know I'm pumpable. I don't care. I like A in some moods and B in others. Why *should* I care about coherence? What's the normative force here other than 'it makes the mathematician happy'?"
  **The Reply:** "Because you care about *your goals*. If you want to achieve X, and your choices systematically prevent X from being achieved (by trading away resources for no gain), then you are frustrating your own agency. It's not about making me happy; it's about instrumental efficacy. If you truly don't care about the loss, then by your own lights, you aren't worse off. But if you claim you want more resources, coherence is the tax on that claim."
  **Soft Spot:** Confronts the Humean view that reason is the slave of the passions.
  **Bullet to Bite:** If they say "I desire to be incoherent," you have no reply. Accept that limitation.

  #### 7. The "Formal Gap" Objection (The Bayesian)
  **The Question:** "You claim a partial representation result. Without completeness, you don't have a unique prior or utility function. You have a set of them. How do you update this set? If I get new information, does the set shrink? Expand? Without a formal updating rule, this is just a qualitative sketch, not a decision theory."
  **The Reply:** "That's a request for a dynamic theory of incomplete preferences, which is work in progress. But the coherence argument doesn't need the full dynamic machinery to work. It works statically. It says 'at this moment, your dispositions are flawed.' We can worry about how the set of priors updates tomorrow. The vulnerability exists now."
  **Soft Spot:** The Bayesian will hate this. It admits the theory is incomplete.
  **Concession:** Admit the dynamic updating for incomplete preferences is an open problem. Don't bluff.

  #### 8. The "Learning During the Pump" Objection (Experimentalists)
  **The Question:** "In your money pump, you say 'no new information.' But the act of being offered the trade *is* information. It tells me someone values what I have. It triggers regret. Real agents learn during the sequence. Your 'no new information' clause creates a vacuum that doesn't exist."
  **The Reply:** "We can construct the pump such that the offers are pre-committed and known. You know the sequence in advance. If you still accept the trades, you aren't learning, you're executing a plan. If you refuse because you 'learned,' then your initial disposition wasn't stable. The argument targets the stable disposition, not the panicked revision."
  **Soft Spot:** Requires assuming pre-commitment knowledge, which is unrealistic.
  **Bullet to Bite:** Insist the argument is about *dispositions*, not single-shot choices.

  ---

  ### The Killer Question (The Weakest Joint)
  **The Question:** "You say you drop completeness. But your money pump argument relies on the agent preferring 'Start + Money' to 'Start'. That's a completeness assumption over the *states of the world*. If I have incomplete preferences over outcomes, don't I also have incomplete preferences over the *trajectories* of the pump? If I'm indifferent between 'Being Pumped' and 'Not Being Pumped', your argument fails. Why is the preference for 'Not Being Pumped' complete when everything else isn't?"

  **Why this hurts:** It attacks the foundation of the "worse off by your own lights" claim. If incompleteness is radical enough, it swallows the money pump itself.

  **What to say if it comes:**
  "That is the precise boundary of my argument. I am not arguing for global completeness. I am arguing for *local* completeness regarding the resources required to pursue *any* ends. If you are indifferent to being exploited, then you are indifferent to the efficiency of your agency. I can't help you there. But if you have *any* goal that requires resources, and you accept that wasting resources hinders that goal, then the pump matters. I'm not defending EU for saints or nihilists; I'm defending it for agents who want to achieve things."

  *(Note: This is a bullet bite. You are admitting the theory doesn't apply to agents who don't care about resource efficiency. That is acceptable.)*

  ---

  ### Summary of Tactics
  1.  **Don't fight the data.** Let them have the descriptive truth. You own the normative structure.
  2.  **Anchor on "Instrumental Efficacy".** You aren't selling "mathematical beauty"; you are selling "not shooting yourself in the foot."
  3.  **Protect the "Worse Off" clause.** This is your jugular. If they convince the room that incomplete preferences make exploitation impossible, you lose.
  4.  **Use the "Disposition" shield.** When they say "people change their minds," you say "I'm talking about stable policies, not momentary impulses."
  5.  **Concede the Bayesian's point.** Admit the dynamic updating is hard. Don't let it derail the static coherence argument.

  Good luck. The room will be hostile, but if you hold the line on *instrumental rationality* rather than *optimization*, you can survive.
