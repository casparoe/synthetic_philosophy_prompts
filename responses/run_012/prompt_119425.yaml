answer: |-
  # Session Design: The Value of Information (90 Minutes)

  **Target:** 12–16 PhD students (Philosophy/Economics).
  **Prerequisites:** Conditional expectation, Bayes' rule, Expected Utility (EU) theory.
  **Goal:** Demonstrate that free, private, non-binding information has non-negative ex-ante value for an EU maximizer, while isolating the specific assumptions that, when violated, make information harmful.

  ---

  ## 1. Materials & Logistics

  **Materials Needed:**
  1.  **Participant Packets:** One per student. Contains:
      *   3 Decision Sheets (one for each "World").
      *   1 Scorecard.
      *   1 "Cheat Sheet" with the Payoff Table and Prior Probabilities (constant across all worlds).
  2.  **Facilitator Envelopes:** 16 large envelopes, each containing 3 smaller sealed envelopes (labeled World 1, 2, 3). Inside each small envelope is a card stating the **State** and (where applicable) the **Signal**.
      *   *Preparation:* You must pre-generate these states/signals according to the probabilities below. Do not randomize live; it takes too long.
  3.  **Timer:** Visible to the room.
  4.  **Prize:** A bag of high-quality chocolate or coffee beans for the top scorer (symbolic, but incentivizes care).

  **The Base Game (Constant Across Worlds):**
  *   **States:** $\omega \in \{G, B\}$ (Good, Bad).
  *   **Prior:** $P(G) = 0.5, P(B) = 0.5$.
  *   **Acts:** $Safe$ ($S$) or $Risky$ ($R$).
  *   **Payoffs (Points):**
      *   If $\omega = G$: $S \to 40$, $R \to 100$.
      *   If $\omega = B$: $S \to 40$, $R \to 0$.
  *   **Uninformed Baseline:**
      *   $EU(S) = 40$.
      *   $EU(R) = 0.5(100) + 0.5(0) = 50$.
      *   *Optimal Uninformed Act:* **Risky**. **Baseline Score: 50.**

  ---

  ## 2. Minute-by-Minute Timeline

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00–10** | **Introduction & Rules** | Distribute packets. Explain scoring. Emphasize: *Maximize expected points.* |
  | **10–25** | **World 1: The Theorem** | Free, private, non-binding, perfect info. Participants choose Accept/Decline, then Act. Reveal states. Score. |
  | **25–40** | **World 2: The Constraint** | Free info, but result triggers an institutional obligation (removes an option). Participants choose. Reveal. Score. |
  | **40–55** | **World 3: The Noise** | Free, private, non-binding, **imperfect** info (75% accurate). Participants choose. Reveal. Score. |
  | **55–75** | **Group Challenge** | "Construct a case where free, private, non-binding info lowers EU." Groups of 3-4. Report out. |
  | **75–90** | **Debrief & Theory** | Map worlds to assumptions. Name the theorem. Discuss escape hatches. |

  ---

  ## 3. The Worlds (Rules & Arithmetic)

  ### World 1: The Standard Case (Theorem Holds)
  *   **Rule:** If you **Accept**, you open the envelope to see the true State $\omega$. You then choose $S$ or $R$ freely. If you **Decline**, you choose $S$ or $R$ without seeing $\omega$.
  *   **Facilitator Prep:** 8 envelopes say $G$, 8 say $B$.
  *   **Arithmetic:**
      *   **Decline:** Optimal act is $R$. $EU = 50$.
      *   **Accept:**
          *   If $G$ (50%): You see $G$, choose $R$. Payoff = 100.
          *   If $B$ (50%): You see $B$, choose $S$. Payoff = 40.
          *   $EU(\text{Accept}) = 0.5(100) + 0.5(40) = 70$.
      *   **Prediction:** Accept dominates. No one should score below 50.

  ### World 2: The Obligation (Theorem Fails via Option Set)
  *   **Rule:** If you **Accept**, you see the State. **However**, the institutional rule states: *If you diagnose the state as Bad ($B$), you are legally prohibited from choosing Risky ($R$).* You must choose $Safe$. If state is $G$, you choose freely.
      *   *Note:* If you **Decline**, you face no restrictions (choose $R$).
  *   **Facilitator Prep:** Same as World 1 (8 $G$, 8 $B$).
  *   **Arithmetic:**
      *   **Decline:** No restriction. Choose $R$. $EU = 50$.
      *   **Accept:**
          *   If $G$ (50%): Free choice. Choose $R$. Payoff = 100.
          *   If $B$ (50%): **Forced** choice $S$. Payoff = 40. (Note: Uninformed you would have chosen $R$ and got 0, but the *constraint* prevents you from optimizing conditional on the info).
          *   Wait, check the dominance:
              *   Uninformed: Choose $R$. Payoff 100 (if G), 0 (if B). Avg 50.
              *   Informed + Constraint: Payoff 100 (if G), 40 (if B). Avg 70.
              *   *Correction:* This constraint actually *helps* in state B (prevents the 0). I need the constraint to hurt.
      *   **Revised Rule for World 2:** *If you Accept the test, you are enrolled in a protocol that **forces you to choose Safe ($S$) regardless of the result**.* (Testing implies a binding commitment to caution).
      *   **Revised Arithmetic:**
          *   **Decline:** Choose $R$. $EU = 50$.
          *   **Accept:** Forced $S$. Payoff = 40 (always). $EU = 40$.
          *   **Result:** Decline dominates. Information hurts because it changes the feasible set.

  ### World 3: The Noise (Theorem Holds, Intuition Fails)
  *   **Rule:** If you **Accept**, you receive a Signal $s \in \{g, b\}$. The signal is **75% accurate**.
      *   $P(s=g | G) = 0.75$, $P(s=b | B) = 0.75$.
      *   You choose $S$ or $R$ based on $s$.
      *   If you **Decline**, choose $S$ or $R$ without signal.
  *   **Facilitator Prep:** You need 16 envelopes with pre-generated State/Signal pairs consistent with the probabilities.
      *   *Target Distribution:*
          *   6 envelopes: State $G$, Signal $g$ (Correct)
          *   2 envelopes: State $G$, Signal $b$ (Error)
          *   2 envelopes: State $B$, Signal $g$ (Error)
          *   6 envelopes: State $B$, Signal $b$ (Correct)
      *   *Total:* 8 $G$, 8 $B$. 8 $g$, 8 $b$. Accuracy = 12/16 = 75%.
  *   **Arithmetic (Ex-Ante):**
      *   **Decline:** Choose $R$. $EU = 50$.
      *   **Accept:**
          *   If $s=g$ (Prob 0.5): Posterior $P(G|g) = 0.75$. $EU(R) = 75, EU(S) = 40$. Choose $R$.
              *   Realized Payoff: If actual $G$ (6 cases) $\to$ 100. If actual $B$ (2 cases) $\to$ 0.
          *   If $s=b$ (Prob 0.5): Posterior $P(G|b) = 0.25$. $EU(R) = 25, EU(S) = 40$. Choose $S$.
              *   Realized Payoff: Always 40.
          *   $EU(\text{Accept}) = 0.5 [ (0.75 \times 100) + (0.25 \times 0) ] + 0.5 [ 40 ] = 0.5(75) + 20 = 57.5$.
      *   **Result:** Accept dominates ex-ante (57.5 > 50).
      *   **The Trap:** In the 2 cases where State=$G$ but Signal=$b$, the Accepting participant chooses $S$ and gets 40. Had they Declined, they would have chosen $R$ and gotten 100. **Information hurt them ex-post.**

  ---

  ## 4. Scoring & Recording

  **Decision Sheet (Per World):**
  1.  **Choice:** Accept / Decline (Circle one).
  2.  **If Accept:** Record Signal (if given). Record Act Chosen ($S$ or $R$).
  3.  **If Decline:** Record Act Chosen ($S$ or $R$).
  4.  **Payoff:** (To be filled after envelope opening).

  **Scoring Method:**
  *   Sum points from all 3 Worlds.
  *   **Leaderboard:** Write top 3 scores on the board.
  *   **Crucial Metric:** In World 3, ask participants to raise hands if their *personal* score on Accept was lower than 50 (the Decline baseline). This visualizes the "Ex-Post Regret."

  ---

  ## 5. Anticipated Failures & Fixes

  **Failure 1: "World 3 proves the theorem false."**
  *   *Symptom:* A participant gets a $(G, b)$ error case, scores 40, and argues loudly that information was harmful.
  *   *Fix:* Do not argue individual cases. Project the **Class Average**.
      *   Calculate the average score of all who Accepted World 3 vs. all who Declined.
      *   The Average Accept will be $\approx 57.5$. The Average Decline will be $\approx 50$.
      *   *Lesson:* The theorem is about **Ex-Ante Expected Utility**, not Ex-Post realized utility.

  **Failure 2: World 2 Confusion.**
  *   *Symptom:* Participants think they can ignore the obligation in World 2.
  *   *Fix:* Frame it as a "Contract." Collect the Decision Sheets *before* opening envelopes. If they wrote "Accept," the Facilitator enforces the rule when scoring. "You signed the waiver; you must take Safe."

  **Failure 3: Group Challenge Stalls.**
  *   *Symptom:* Groups sit silently.
  *   *Fix:* Seed the discussion. If stuck after 5 mins, suggest: "What if knowing changes how you feel?" (Leads to utility function discussion). "What if someone else sees the result?" (Leads to privacy/game theory).

  ---

  ## 6. Debrief Guide (75–90 Minutes)

  **Step 1: Name the Result.**
  *   Reveal the theorem: **The Value of Information Theorem** (often associated with Blackwell, 1951; or Good, 1967).
  *   Statement: *For an expected utility maximizer, the ex-ante expected utility of a decision problem with free, private, non-binding information is at least as high as without it.*

  **Step 2: Map the Worlds to Assumptions.**
  Draw a table on the board:

  | Assumption | World 1 (Standard) | World 2 (Obligation) | World 3 (Noise) |
  | :--- | :--- | :--- | :--- |
  | **Free (No Cost)** | Yes | Yes | Yes |
  | **Private (No Game)** | Yes | Yes | Yes |
  | **Non-Binding (Options)**| Yes | **No** (Forced Act) | Yes |
  | **Perfect Signal** | Yes | Yes | **No** |
  | **Result** | Accept Wins | Decline Wins | Accept Wins (Ex-Ante) |

  **Step 3: The Escape Hatches (Why intuition says info hurts).**
  Ask the group why they felt information could be bad. Map their answers to these categories:

  1.  **Instrumental vs. Intrinsic Value:**
      *   *Theorem:* Utility is over *outcomes*, not *states of knowledge*.
      *   *Intuition:* "I'd rather not know my diagnosis."
      *   *Resolution:* If knowledge itself enters the utility function (e.g., $U(outcome, knowledge)$), the theorem doesn't apply directly. You are paying a "psychic cost."
  2.  **Constraint on Future Self (Time Inconsistency):**
      *   *Theorem:* Assumes the future self acts to maximize the current self's EU.
      *   *Intuition:* "If I know I'm sick, I'll panic and make bad choices."
      *   *Resolution:* This is World 2. Information changes the *effective* option set if you cannot trust your future reaction.
  3.  **Strategic/Privacy Costs (Game Theory):**
      *   *Theorem:* Assumes private information.
      *   *Intuition:* "If the insurance company knows, they raise my rates."
      *   *Resolution:* This violates "Private." Information becomes a move in a game (Aumann/Agreeing to Disagree context).
  4.  **Ex-Post Regret (World 3):**
      *   *Theorem:* Evaluates *Expectation* before the signal.
      *   *Intuition:* "I knew it and still failed."
      *   *Resolution:* Distinguish Ex-Ante (decision to test) vs. Ex-Post (evaluation of outcome). The theorem protects the *decision to test*, not the *outcome of the test*.

  **Step 4: What the Activity Did Not Reproduce.**
  *   **Endogenous Information:** The activity treated information as exogenous. In reality, searching for info costs time/effort (Opportunity Cost).
  *   **Non-EU Preferences:** If agents are ambiguity averse (MaxMin) or have rank-dependent utility, free information *can* have negative value (e.g., Wakker, 1988).
  *   **Moral Hazard:** Information might change incentives in a principal-agent setting (not covered here).

  ---

  ## 7. Facilitator's Cheat Sheet (Arithmetic Verification)

  **World 1 (Perfect):**
  *   Decline: $0.5(100) + 0.5(0) = 50$.
  *   Accept: $0.5(100) + 0.5(40) = 70$.
  *   *Gain:* +20.

  **World 2 (Constraint):**
  *   Decline: $0.5(100) + 0.5(0) = 50$.
  *   Accept: Forced Safe $\to 40$.
  *   *Loss:* -10.

  **World 3 (Noise 75%):**
  *   Decline: 50.
  *   Accept:
      *   $P(s=g) = 0.5$. Given $g$, $P(G)=0.75$. Act $R$. Exp Payoff $75$.
      *   $P(s=b) = 0.5$. Given $b$, $P(G)=0.25$. Act $S$. Exp Payoff $40$.
      *   Total: $0.5(75) + 0.5(40) = 57.5$.
  *   *Gain:* +7.5.
  *   *Regret Cases:* 2 out of 16 participants (State $G$, Signal $b$) will score 40 instead of 100.

  ---

  ## 8. A Frank Note on Limitations

  This activity successfully isolates the **instrumental value of information** within a static, single-agent EU framework. It will *not* convince a student who fundamentally rejects EU theory (e.g., an ambiguity-averse maximizer) that the theorem is normative.

  Furthermore, the activity treats "Utility" as points. It cannot reproduce the **affective cost of knowledge** (e.g., the grief of a diagnosis) without you explicitly modeling that as a negative payoff in the table. If a student argues, "But knowing I have the disease makes me sad," you must concede: *"Correct. In that model, 'Knowledge' is an argument in the utility function with a negative coefficient. The theorem assumes utility is defined solely over material outcomes. Your objection is valid for humans, but it changes the definition of the 'Act' or 'Outcome' space."*

  Finally, ensure you emphasize that **World 3** is the most dangerous for intuition. Students will remember the one time they tested and got the false negative, not the 75% accuracy rate. Use the class average to combat this availability heuristic.
