answer: |-
  ### Preliminary Brainstorming: Plausible Readings and Discards

  Before settling on an analysis, I need to map the logical space. There are three main ways to run the Sokal episode (as you described it) through Rorty's neopragmatism. I will list them, evaluate their viability, and discard the weak ones.

  1.  **The "Relativist Refutation" Reading:** The hoax demonstrates that without a correspondence theory of truth (a check against Reality), inquiry collapses into nonsense. Since Rorty rejects correspondence, the hoax refutes Rorty.
      *   *Decision:* **Discard.** This is the view of Rorty's critics (e.g., Gross, Levitt, Sokal himself), not an internal application of Rorty's theory. It assumes Rorty claims "anything goes," which is a caricature. Rorty explicitly denies that dropping correspondence removes constraints on belief. Using this reading would be attacking a straw man, which violates your request for the "real position."

  2.  **The "Category Mistake" Reading:** The hoax is a confusion of vocabularies. Physics vocabulary was used for political purposes. Rorty distinguishes between vocabularies for *prediction/control* (science) and vocabularies for *solidarity/justice* (politics). The hoax failed because it mixed tools inappropriately.
      *   *Decision:* **Keep.** This aligns with Rorty's distinction between causal explanation and normative justification. It allows us to say the paper was "bad" without appealing to a Mirror of Nature.

  3.  **The "Failed Justification" Reading:** The hoax shows a breakdown in the social practice of justification. The editors of the journal failed to vet the claims against *their own* community standards, not against "Nature." Truth is what survives free and open encounter; the hoax short-circuited the encounter.
      *   *Decision:* **Keep.** This is the strongest internal defense. It locates the error in the *social process* of inquiry (peer review) rather than in a metaphysical mismatch between word and world.

  **Selection:** I will proceed by synthesizing Readings 2 and 3. Reading 1 is external hostility, not internal analysis. The tension between 2 (vocabularies) and 3 (social justification) is where the real philosophical work lies, and where the theory's limits will become visible.

  ***

  ### Part I: Rorty's Antirepresentationalism (Precisely Stated)

  To analyze the episode, we must first clear away the caricature. Rorty's antirepresentationalism is often mistaken for a claim that "there is no reality" or "truth is whatever you want." Neither is accurate.

  **1. Justification vs. Truth**
  For Rorty, "Truth" (capital T) is not a goal of inquiry. It is not a relation of correspondence between a sentence and a non-human reality. Truth is merely a compliment we pay to beliefs that we find good to hold. It is an adjective, not a noun.
  *   **Justification** is always social. It is a conversation between persons. To justify a belief is to offer reasons that your peers accept.
  *   **Truth** is undefinable. We cannot step outside our skin to check if our beliefs match the world. We can only check if our beliefs cohere with other beliefs we hold.
  *   *Implication:* We do not seek Truth; we seek *justified assertibility*. When we say a statement is "true," we are essentially saying, "It is better to believe this than that, given our current purposes."

  **2. The Mirror of Nature is Optional**
  The traditional philosophical view (from Locke to Kant) is that the mind (or language) is a mirror that attempts to reflect nature accurately. Rorty argues this metaphor is optional. We can drop it without losing the ability to do science or live morally.
  *   We can treat language not as a picture of reality, but as a **tool**.
  *   Some tools (physics) are for predicting and controlling the behavior of non-human objects.
  *   Other tools (literature, politics) are for coordinating human behavior and creating social solidarity.
  *   Neither tool is "more real" than the other; they just have different uses.

  **3. Objectivity as Solidarity**
  When philosophers appeal to "Objectivity," they usually mean "view from nowhere." Rorty redefines objectivity as **intersubjective agreement**. To be objective is to seek the widest possible agreement among free inquirers.
  *   There is no constraint from the *world* except causal constraint (you can't jump off a cliff and expect to fly).
  *   There *is* a constraint from the *community* (you must justify your claims to peers).
  *   Therefore, "getting it right" means satisfying the norms of the relevant community of practice, not matching a metaphysical reality.

  **4. What Rorty is NOT Claiming**
  *   He is not claiming that gravity is socially constructed. (Causal power is independent of us.)
  *   He is not claiming that all vocabularies are equal. (Some are more useful for specific purposes.)
  *   He is not claiming that philosophers should judge the sciences. (Philosophy is cultural criticism, not a tribunal.)

  ***

  ### Part II: Mapping the Theory onto the Episode

  Now we apply this framework to the hoax. Let us identify the agents:
  *   **The Knower:** The author (Sokal) and the Editors (*Social Text*).
  *   **The Community:** The cultural left/humanities academy.
  *   **The Claim:** That quantum gravity supports a specific political relativism.
  *   **The Failure:** The claim was nonsense, yet accepted.

  **What the Hoax Does and Does Not Show (A Rortian View)**

  **1. It does not show that "Truth is Correspondence."**
  A critic says: "The hoax proves the paper didn't match reality, therefore correspondence is real."
  **Rorty replies:** The paper wasn't rejected because it failed to correspond to quantum gravity. It was rejected (retroactively) because it failed to correspond to the *norms of the humanities community*. The editors were embarrassed not because they violated the laws of physics, but because they looked incompetent to their peers. The "reality" that bit them was social reality (ridicule), not physical reality.

  **2. It shows a failure of Vocabulary Selection.**
  Rorty insists vocabularies are tools. Using a screwdriver to hammer a nail is not "false," it is just useless or clumsy.
  *   **Analysis:** The author used the vocabulary of high-energy physics (a tool for prediction/control) as a metaphor for political theory (a tool for solidarity).
  *   **The Error:** This is a category mistake. Rorty would argue that borrowing authority from a "hard science" vocabulary to bolster a "political" argument is a bad pragmatic move. It doesn't help achieve the goal of social justice; it risks incoherence. The hoax demonstrates that when you mix tools indiscriminately, you lose the ability to cope effectively.

  **3. The "Peer Approval" Objection (The Pressure Point)**
  Here is the hardest challenge for Rorty, as you noted.
  *   **Objection:** If truth/justification is "what our peers will let us get away with," the peers *did* let Sokal get away with it. The paper was published. Therefore, by Rorty's definition, the nonsense was "justified" at the time of publication. If Rorty says it was still "wrong," he seems to be appealing to a standard outside the peer community (i.e., the very correspondence theory he rejects).
  *   **Strongest Rortian Reply:** Rorty would distinguish between *local* justification and *robust* solidarity. The editors justified the paper relative to a narrow, insular clique. However, a broader community of inquirers (including scientists and reasonable humanists) would not have let it through.
      *   Rorty's norm is not "what my friends say," but "what would survive free and open encounter." The hoax relied on secrecy (the author knew it was a joke, the editors didn't). This violated the condition of the "free encounter."
      *   Furthermore, Rorty evaluates beliefs by their *consequences*. The belief "this paper is profound" had bad consequences (it made the left look foolish, weakened their credibility). Therefore, it was not "good to believe."
  *   **How much objection survives?** A significant chunk. Rorty's reliance on "consequences" is retrospective. At the moment of publication, the consequences hadn't happened yet. Rorty lacks a *prospective* mechanism to distinguish rigorous inquiry from gullibility other than "trust your peers." When peers fail, his theory struggles to explain *epistemic* failure without sliding back into "they didn't match the world." He has to say "they failed their own standards," which is true, but feels thin compared to the scientists' charge of "they ignored reality."

  **4. Can Rorty Object?**
  Yes. Rorty can object on grounds of **intellectual honesty** and **utility**.
  *   He can say: "You are using words you don't understand to impress people. This stops conversation rather than furthering it."
  *   He does not need to say: "You violated the laws of nature."
  *   The distinction between the journal's failure and an ordinary case of being fooled is minimal for Rorty. Being fooled by a hoax is just a specific type of failed justification. It is embarrassing, but it doesn't threaten the fabric of the universe. It just means that specific community needs better vetting procedures.

  ***

  ### Part III: The Episode as a Test of the Theory

  Now we reverse the direction. We treat the Sokal episode not as a puzzle for Rorty to solve, but as a stress test for neopragmatism itself.

  **1. Confirmation, Embarrassment, or Blind Spot?**
  *   **Confirmation:** In one sense, the episode confirms Rorty's view that scientific terms are often used as "fetishes" in the humanities—authority markers rather than tools for inquiry. Rorty often criticized the "cultural left" for thinking that citing chaos theory made their politics smarter. The hoax proved this citation was decorative, not functional.
  *   **Embarrassment:** It is an embarrassment for Rorty's *allies*, not necessarily his theory. However, because Rorty is associated with the "anti-objectivity" camp, he gets guilt by association.
  *   **Blind Spot:** The episode exposes a gap in Rorty's **normative resources**. Rorty is excellent at describing how successful inquiry works (conversation, solidarity). He is less equipped to diagnose *pathological* inquiry from the inside. He can say "this didn't work," but he struggles to say "this was epistemically irresponsible" without sounding like he's appealing to a standard of Rationality he claims to reject.

  **2. The Descriptive/Normative Gap**
  Rorty claims representationalism is *optional* (descriptive/historical claim). But he also wants to recommend *liberal democracy* and *free inquiry* (normative claim).
  *   **The Tension:** The hoax shows that if you treat all vocabularies as merely tools for social cohesion, you might lose the discipline required to keep the tools sharp. If "truth" is just solidarity, why shouldn't a community solidify around nonsense if it makes them feel good?
  *   **Rorty's Defense:** He would say liberal solidarity *requires* honesty. You cannot build long-term trust on lies.
  *   **The Gap:** This relies on a contingent hope (that honesty pays off). The scientists in the Science Wars wanted a *necessary* connection between inquiry and reality. Rorty offers only a *contingent* connection between inquiry and social success. The episode suggests that without a belief in "getting the world right," some inquirers lose the discipline to check their work. Rorty's theory describes the aftermath but doesn't fully explain the *obligation* to be rigorous before the hoax is revealed.

  **3. Philosophy as Tribunal vs. Culture**
  Rorty insists philosophy should not be a tribunal over the sciences.
  *   **The Problem:** In the Science Wars, the humanities *acted* as a tribunal over science (claiming to know what science "really" means socially). They failed.
  *   **Rorty's Relocation:** Rorty would say: "I told you so." He argued that humanities scholars should not pretend to do physics. They should stick to moral criticism.
  *   **The Silence:** Here, Rorty is silent on *methodology*. He can say "Don't mix the games," but he cannot prescribe *how* to play the humanities game better, other than "be honest." He has no epistemology of error. He can't say "You should have checked the math," because checking the math implies there is a right answer independent of the community. He has to say "You should have checked with the physics community," which turns epistemology into sociology.
  *   **Verdict:** The theory is not broken, but it is **relocated**. It moves the problem from "How do we know?" to "Who should we talk to?" This is a valid move, but it leaves many inquirers unsatisfied because it removes the guarantee that talking to the right people yields truth.

  **4. Contested Ground and Uncertainty**
  I must be honest about where interpreters disagree.
  *   **Settled:** Rorty himself criticized the *Social Text* editors. He did not defend the paper. He agreed that misusing physics terms was bad. (Source: Rorty's responses in the late 90s, e.g., in *Philosophy and Social Hope*).
  *   **Contested:** Does Rorty's distinction between "causal" (physics) and "normative" (politics) hold up under this pressure?
      *   *Critics say:* No. If you admit physics has causal authority, you've conceded realism.
      *   *Defenders say:* No. You can admit causal power without admitting that language mirrors that power.
      *   *My Assessment:* This is the weakest link in Rorty's armor. In the Sokal case, the "causal power" of the nonsense was zero, but the "social power" was high (until the reveal). Rorty's theory handles the social power well but struggles to explain why the lack of causal power should have been detected *socially* before the reveal.
  *   **Reconstruction:** My claim that Rorty relies on "retrospective consequences" is a reconstruction. Rorty doesn't explicitly write a "theory of error" for hoaxes. I am inferring this from his general stance on truth as a compliment paid to successful beliefs.

  ### Summary Conclusion

  The Sokal episode does not refute Rorty's antirepresentationalism, because Rorty never claimed that social justification guarantees immunity from foolishness. He claims only that "correspondence to reality" is not the mechanism that saves us from foolishness—*careful conversation* is.

  However, the episode exposes a **normative thinness** in the theory. Rorty can explain why the hoax was bad *after the fact* (it hurt solidarity, it was dishonest), but he lacks a robust account of *epistemic duty* that would have prevented it *before the fact*, other than "listen to more people."

  For a scientist, this is unsatisfying. They want to say, "It was bad because it was false about the world." Rorty forces them to say, "It was bad because it was useless for our shared purposes." The Science Wars happened because one side felt that without the "world" as a constraint, "purposes" were too malleable. Rorty's theory survives the episode, but it survives by retreating from epistemology to ethics. It tells us we should be honest, but it cannot prove that honesty tracks reality—only that it tracks a certain kind of human community. Whether that is enough is the question the episode leaves open.
