answer: |-
  The investigative program of the early Society for Psychical Research, particularly as shaped by Henry Sidgwick, rests upon a complex and somewhat unstable foundation of philosophical commitments that bridge the gap between Victorian scientific naturalism and traditional theological ethics. To reconstruct the implicit theory governing this practice, one must first recognize that the Society operated on a strict methodological presupposition of empiricism, treating claims about telepathy, apparitions, and survival not as articles of faith or metaphysical speculations beyond the reach of observation, but as truth-apt hypotheses subject to evidential verification. This commitment implies that the boundaries of the natural world are not fixed by prior materialist definitions but are expandable through rigorous observation. Consequently, the practice presupposes that the existence of a spiritual order or the persistence of consciousness is an empirical matter rather than a purely transcendental one. It assumes that if personal survival occurs, it manifests through phenomena that can be recorded, measured, and critically analyzed like any other natural event. This naturalization of the spiritual is the core methodological commitment, distinguishing the Society from both dogmatic religion, which protects its tenets from empirical falsification, and reductive materialism, which denies the possibility of such phenomena a priori.

  Regarding the nature of the self, the practice does not strictly presuppose a Cartesian view of the self as an immaterial substance, although such a view fits comfortably with the Society's hopes. The investigative norms are underdetermined on this ontological point because the methods employed seek evidence of continuity in consciousness, memory, or agency, which could theoretically be accounted for by various metaphysical models, including idealism or even a sophisticated form of property dualism, provided that consciousness is not wholly dependent on the functioning brain. What is strictly required is not a specific ontology of the soul but the possibility of the decoupling of mental states from bodily states. However, Sidgwick's personal investment in the research reveals a deeper, more specific philosophical commitment regarding the relationship between metaphysics and morality. For Sidgwick, the practice presupposes that moral philosophy is not entirely autonomous from empirical facts about the universe. In The Methods of Ethics, Sidgwick identified a dualism of practical reason wherein rational egoism and rational utilitarianism appear equally valid yet potentially conflicting. He believed that without a moral government of the universe ensured by a divine power who rewards virtue and punishes vice in an afterlife, there is no rational guarantee that duty and self-interest coincide. Therefore, Sidgwick's participation presupposes that the validity or at least the rational stability of the moral life depends on external metaphysical support. It assumes that the dualism of practical reason is a problem to be solved by facts about the cosmos, rather than a permanent structural feature of practical rationality that must be accepted or managed through non-rational faith.

  This leads to a distinction between what the Society's practice strictly presupposes and what merely fits well with Sidgwick's specific ethical project. Strictly speaking, the Society's norms of exact and unimpassioned inquiry are compatible with a more modest view where psychical research is simply a domain for the application of the ethics of belief, devoid of ethical consequences. A researcher could consistently maintain that determining the truth of telepathy is an intellectual duty without implying that the outcome bears on the authority of morality. This modest view is licensed by the Society's methodological naturalism, which treats psychical phenomena as facts to be cataloged rather than saviors of moral rationality. Thus, the practice is philosophically underdetermined regarding the ethical stakes of the research. It allows for the possibility that one might prove survival without proving a moral government, or prove telepathy without proving the divine. Sidgwick, however, required a stronger link. He needed the evidence to do heavy lifting for his ethical system, specifically to validate the rationality of benevolence against the rationality of self-interest. While the Society's structure allowed for the modest view, Sidgwick's leadership infused the program with the assumption that scientific inquiry could resolve a crisis in practical reason.

  If we were to replace these presuppositions with rival views, the implications for both Sidgwick's ethical project and the Society's norms would be profound. If survival after death were treated as a purely religious hope, akin to a Kantian postulate of practical reason rather than an empirical hypothesis, the Society's investigative program would become category mistaken or even philosophically incoherent. Under a Kantian framework, the truth of immortality is a necessity of moral reasoning that cannot be confirmed or denied by theoretical reason or sensory evidence. Adopting this view would render the Society's labor futile, as the object of their inquiry would be removed from the realm of possible experience. The norms of exact inquiry would have to be abandoned in favor of hermeneutic or theological reflection, and Sidgwick's hope for a scientific resolution to the dualism of practical reason would collapse. He would be forced to accept that morality requires a leap of faith that science can neither support nor undermine, fundamentally altering his project from one of rational synthesis to one of fideistic compartmentalization.

  Conversely, if the dualism of practical reason were taken to be permanent and unremediable by any conceivable evidence, the urgency and philosophical justification for Sidgwick's involvement in the Society would evaporate. If one accepts that egoism and utilitarianism are irreconcilable and that no cosmic justice exists to harmonize them, then evidence for personal survival loses its ethical significance. Survival might remain a curious fact, but it would no longer serve as the linchpin for the rationality of morality. In this scenario, the Society's work could continue under the modest view of mere fact-gathering, but it would cease to be a vital component of moral philosophy. Sidgwick's specific philosophical crisis, which drove him to seek empirical evidence for a moral order, would be acknowledged as unsolvable, likely leading to a form of moral skepticism or a resignation that morality is ultimately grounded in non-rational sentiment rather than cosmic structure. Thus, the early Society for Psychical Research stands as a unique historical artifact predicated on the belief that the methods of natural science could penetrate the metaphysical realm to secure the foundations of ethical life, a commitment that relies on the permeability of the fact-value distinction and the empirical accessibility of the soul.
