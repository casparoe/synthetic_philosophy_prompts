prompt: |-
  For a course on nineteenth-century moral philosophy, I am trying to understand what the early Society for Psychical Research's investigative program—and Sidgwick's central role in it—presupposes philosophically. The practice I have in mind is this: the Society, founded in 1882 with Sidgwick as its first president, treated telepathy, apparitions, mediumistic communications, and related phenomena as objects of exact and unimpassioned inquiry, on a par with the natural sciences, while also treating the results as potentially bearing on the truth of religion and the authority of morality. Sidgwick, who had argued in The Methods of Ethics that practical reason ends in a dualism between egoism and utilitarianism, devoted considerable energy to this research and hoped it might provide evidence for personal survival and a moral government of the universe. What philosophical commitments does that practice presuppose? Does it presuppose that survival after death is an empirical hypothesis whose evidence can be weighed without antecedent metaphysical commitment, or does it presuppose a particular view of the self as a substance capable of persisting beyond bodily death? Does it presuppose that moral philosophy needs external metaphysical support—that the dualism of practical reason cannot be resolved by practical reason alone and requires empirical evidence of a benevolent cosmic order? Or is it compatible with a more modest view on which psychical research is simply one more domain in which the ethics of belief applies, and its results need not bear on ethics at all? I would like you to reconstruct the implicit theory, distinguish what the practice strictly presupposes from what it merely fits well with, and say where the practice is philosophically underdetermined, so that several theories would license it. Then tell me what would have to change in Sidgwick's ethical project, or in the Society's investigative norms, if we replaced the presupposed view with a rival one—for example, if survival were treated as a purely religious hope rather than an empirical question, or if the dualism of practical reason were taken to be permanent and unremediable by any conceivable evidence. Please respond in continuous prose only, with no headings, bullet points, bold text, or tables.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The philosophical presuppositions of the early Society for Psychical Research (SPR), specifically focusing on Henry Sidgwick's role and motivations.
      *   **Context:** A course on nineteenth-century moral philosophy.
      *   **Key Practice:** Treating paranormal phenomena (telepathy, apparitions, etc.) as objects of exact scientific inquiry while viewing results as potentially bearing on religion and morality (specifically personal survival and moral government of the universe).
      *   **Sidgwick's Problem:** The "dualism of practical reason" (egoism vs. utilitarianism) in *The Methods of Ethics*. He hoped psychical research might resolve this by providing evidence for a moral cosmic order.
      *   **Questions to Address:**
          *   What philosophical commitments does the practice presuppose?
          *   Is survival an empirical hypothesis or does it require a substance view of the self?
          *   Does moral philosophy need external metaphysical support (resolution of dualism)?
          *   Is it compatible with a modest view (ethics of belief only)?
          *   Distinguish strict presuppositions from what merely fits well.
          *   Identify where the practice is underdetermined (compatible with multiple theories).
          *   Explain what would change if rival views were adopted (e.g., survival as religious hope, dualism as permanent).
      *   **Constraint:** Continuous prose only. No headings, bullet points, bold text, or tables.

  2.  **Deconstruct the Philosophical Landscape:**
      *   *Sidgwick's Position:* Agnostic empiricist regarding metaphysics, but deeply troubled by the ethical implications of materialism/atheism. He wants rational grounds for morality. If egoism is rational and utilitarianism is rational, but they conflict, morality is undermined unless there's a divine sanction (rewards/punishments after death) that aligns self-interest with duty.
      *   *The SPR's Method:* Scientific naturalism applied to the paranormal. "Exact and unimpassioned inquiry." This implies empiricism, fallibilism, and the idea that these phenomena are part of the natural order (or at least accessible to natural investigation).
      *   *The Tension:* Using scientific methods to prove metaphysical/religious conclusions.

  3.  **Drafting - Section by Section (Mental Outline):**

      *   *Introduction:* Set the scene. Sidgwick, SPR, 1882. The core tension between scientific method and metaphysical hope.
      *   *Strict Presuppositions:* What *must* be true for the SPR to exist as Sidgwick conceived it?
          *   Empiricism: Claims about survival are truth-apt and evidence-sensitive.
          *   Continuity of Law: Psychical phenomena aren't miracles violating law, but extensions of it.
          *   Relevance: Evidence about survival *can* impact ethical reasoning (against strict autonomy of ethics).
      *   *Underdetermined Areas:* What isn't strictly fixed?
          *   Ontology of the Self: Does it require Cartesian substance dualism? Not necessarily. Could be functional persistence.
          *   Strength of Ethical Need: Does morality *collapse* without survival, or just become less motivating? Sidgwick thought the former (rationality of egoism), but the *practice* of research only requires it to be *relevant*, not strictly necessary for the definition of right action.
          *   Modest View Compatibility: One could do the research just for truth (ethics of belief) without the ethical payoff. Sidgwick didn't, but the SPR structure allows it.
      *   *Sidgwick's Specific Commitments:* He needs the "Moral Government of the Universe." This goes beyond the SPR's baseline. He needs the dualism resolved.
      *   *Counterfactuals/Changes:*
          *   If survival is religious hope (Kantian faith): Research becomes irrelevant or blasphemous. Science can't touch faith.
          *   If dualism is permanent: Research loses its ethical urgency. It becomes mere curiosity. Sidgwick's project loses its "practical reason" stake.
      *   *Conclusion:* Summarize the synthesis. The SPR represents a specific moment where empiricism hadn't yet fully severed ties with theological ethics.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I distinguish between what the *Society* presupposed and what *Sidgwick* personally needed? The prompt asks about the Society's program *and* Sidgwick's role. I need to be careful not to conflate the institutional methodology with Sidgwick's personal philosophical crisis, though they overlap.
      *   *Check:* The prompt asks about the "self as a substance." I need to address whether the research *requires* substance dualism. Actually, the SPR often leaned towards a more empirical view of consciousness that didn't strictly demand Cartesian substance, but Sidgwick likely needed persistence of *personal identity* which implies some form of substantial continuity. I should nuance this.
      *   *Check:* The prompt asks about "ethics of belief." I need to explain how a Clifford/James style view fits or clashes.
      *   *Constraint Check:* Ensure no formatting markers (bolding, lists) slip in. Keep it flowing as an essay.

  5.  **Drafting the Content (Iterative Process):**

      *   *Start:* The early Society for Psychical Research represents a fascinating hybrid of Victorian scientific naturalism and traditional theological concern. To understand its philosophical presuppositions, one must look at the intersection of Sidgwick's epistemology and his ethical anxieties.
      *   *Empiricism:* The primary presupposition is methodological empiricism. It treats survival not as an article of faith but as a fact of nature waiting to be verified. This implies that metaphysical claims are reducible to empirical hypotheses.
      *   *The Self:* Does it require substance dualism? Strictly speaking, no. It requires the *possibility* of consciousness persisting without the body. This could be substance-based or a form of idealism. The practice is underdetermined here.
      *   *Ethics:* Sidgwick's specific drive presupposes that ethics is not autonomous. If ethics were purely deontological or internal (Kantian), external facts about the universe wouldn't matter for the *validity* of duty, only perhaps for motivation. Sidgwick needs the "Moral Government" to make Egoism and Utilitarianism coincide.
      *   *Underdetermination:* A member could join the SPR just to catalogue facts (the modest view). Sidgwick joins to save morality. The *practice* allows the modest view; Sidgwick's *motivation* does not.
      *   *Counterfactuals:* If survival is faith-based, the SPR is category error. If dualism is permanent, the SPR is ethically inert for Sidgwick.
      *   *Synthesis:* The SPR sits on the cusp of secularization. It tries to use science to do theology's work.

  6.  **Polishing for Flow and Tone:**
      *   Ensure the transition between the Society's general norms and Sidgwick's specific philosophical crisis is smooth.
      *   Make sure the distinction between "strict presupposition" and "compatible fit" is clear without using bullet points. Use transitional phrases like "strictly speaking," "however," "conversely."
      *   Verify the "continuous prose" constraint rigorously. No line breaks that look like lists.

  7.  **Final Review against Prompt:**
      *   Reconstruct implicit theory? Yes.
      *   Distinguish strict presuppositions vs. fits well? Yes.
