      *   **Context:** 2 years, 3 staff, no chance to reopen design later. High stakes.
      *   **Task:** Create a *defended agenda* (ranked shortlist of 4-5 questions) regarding executive-legislative relations, *not* a survey.
      *   **Specific Constraint/Frame:** Take seriously a colleague's framing: Separate (a) Executive survival (confidence) from (b) Legislative survival (dissolution). Focus on the *asymmetry of exit costs* (who can fire whom more cheaply/unilaterally).
      *   **Criteria for Ranking:** Upstream/downstream logic, conceptual vs. empirical tractability (within 2 years), neglectedness vs. importance, actionability for drafters.
      *   **Required Elements:** Explicit criteria, trade-offs, identification of red herrings, "weedy" sub-questions worth philosophical time, evidence that would change the ordering, the single pivotal question.
      *   **Tone:** Rigorous, pragmatic, philosophically informed but institutionally grounded. Avoid standard "Presidentialism vs. Parliamentarism" tropes unless deconstructed.

  2.  **Deconstruct the Colleague's Framing (The "Asymmetry of Exit Costs"):**

      *   *Standard View:* Presidentialism = Fixed terms both sides (Symmetry?); Parliamentarism = Confidence + Dissolution (Symmetry?).
      *   *Colleague's View:* It's about the *cost* and *unilateralism* of exit.
      *   *Insight:* Pure presidentialism isn't just fixed terms; it's high cost to remove executive, high cost to dissolve legislature. Pure parliamentarism is low cost to remove executive, low cost to dissolve legislature.
      *   *Hybrids:* Semi-presidentialism often creates *asymmetry* (e.g., President fixed, PM confidence-based).
      *   *Pathology:* Rigid asymmetry leads to deadlock (if executive can't be removed but legislature can't be dissolved) or instability (if executive falls easily but legislature is fixed).
      *   *Verdict:* This is a strong heuristic for institutional stability and accountability. It moves beyond labels to mechanisms. I should use this as the organizing principle but test its limits.

  3.  **Determine the Criteria for the Agenda:**

      *   **Upstreamness:** Does answering this determine the answers to others?
      *   **Tractability:** Can a philosopher + 3 staff answer this in 2 years? (Conceptual > Deep Empirical).
      *   **Actionability:** Can this be written into a text?
      *   **Stakes:** Does this prevent democratic backsliding or civil conflict in a fragile transition?
      *   **Neglectedness:** Is this overlooked in standard textbooks but crucial for *this* context?

  4.  **Drafting the Ranked Questions (Iterative Process):**

      *   *Attempt 1 (Standard):* 1. Presidential or Parliamentary? 2. Electoral System? 3. Bill of Rights? 4. Judiciary?
      *   *Critique 1:* Too generic. Ignores the "Asymmetry" frame. Doesn't fit the "philosopher's agenda" brief.
      *   *Attempt 2 (Focus on Asymmetry):* 1. Who dissolves whom? 2. Vote of No Confidence rules. 3. Election timing. 4. Caretaker conventions.
