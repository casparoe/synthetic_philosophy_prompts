          4.  **Caretaker Constraints:** (Interregnum). Crucial for transitions.
          5.  **The "Nuclear Option" (Emergency Powers):** Often the real killer in transitions.

      *   *Refining for "Philosophical Value":* I need to ensure these aren't just legal drafting questions but involve normative trade-offs (stability vs. accountability, legitimacy vs. efficiency).

      *   *Selection:*
          1.  **The Symmetry of Exit (The Colleague's Frame):** This is the upstream conceptual anchor.
          2.  **The Threshold of Constructive vs. Destructive Confidence:** How hard is it to fire the executive? (Conceptual/Normative).
          3.  **The Discretion of Dissolution:** Who pulls the trigger on the legislature? (Agency/Principal problem).
          4.  **The Fiscal Confidence Link:** Is money supply tied to survival? (Functional necessity).
          5.  **Caretaker Conventions & Interregnum:** What happens in the gap? (Often neglected, high risk).

      *   *Wait, let's look at the "Red Herrings":* The prompt asks to identify what *not* to spend time on. Standard "Presidentialism is bad" literature is often empirical/historical and not actionable for a specific design. The specific title of the Head of State is less important than their powers.

      *   *Re-evaluating the Ranking based on "Upstreamness":*
          1.  **Symmetry of Exit Costs:** (Decides the regime type effectively).
          2.  **Thresholds of Confidence (Constructive vs. Simple):** (Decides stability vs. accountability).
          3.  **Trigger Mechanisms for Dissolution:** (Decides who controls the cycle).
          4.  **Caretaker/Interregnum Powers:** (Decides transition safety).
          *Maybe combine 2 & 3?* No, keep distinct for clarity.
          *Add the "Single Pivotal Question" requirement.*

  5.  **Fleshing out the Content (incorporating the "Asymmetry" frame):**

      *   *Q1: Symmetry.* If exit costs are asymmetric (e.g., President fixed, PM removable), you get cohabitation risks. If symmetric (both fixed or both removable), you get different risks. This is the *meta-question*.
      *   *Q2: Confidence Thresholds.* Simple majority vs. Constructive (need a replacement). This affects the "cost" part of the exit cost.
