answer: |-
  This is a high-stakes design problem where the cost of error is regime failure, not just academic embarrassment. Your colleague's framing—that the critical variable is the **asymmetry of unilateral exit costs** between executive and legislature—is not half-wrong; it is significantly *more* useful than the standard presidentialism/parliamentarism typology for a drafter. The standard typology describes historical clusters; your colleague's frame describes mechanical incentives.

  However, the frame is incomplete. Exit costs determine *instability*, but they do not determine *legitimacy*. A system can be perfectly symmetric (both sides fixed for four years) and still collapse if the executive lacks the authority to govern or the legislature lacks the authority to represent.

  Below is a defended agenda ranked by **upstreamness** (does this decide the other questions?), **tractability** (can a philosopher and three staff resolve this in two years?), and **risk mitigation** (does this prevent the specific pathologies of a negotiated transition?).

  ### The Criteria for Ranking

  1.  **Upstreamness:** If you answer Question 1, does it constrain the viable answers to Questions 2–4?
  2.  **Conceptual Tractability:** Can this be resolved through normative reasoning and comparative institutional analysis, or does it require 30 years of local political data you don't have? (Prioritize the former).
  3.  **Neglectedness:** Is this a "silent killer" in constitutional texts that standard textbooks gloss over?
  4.  **Actionability:** Can the answer be codified in clear text, or does it rely on unwritten conventions (which are dangerous in new democracies)?

  ---

  ### The Agenda: Four Questions in Order of Priority

  #### 1. The Symmetry of Termination Rights (The "Exit Cost" Question)
  *   **The Question:** Should the cost to remove the head of government be roughly equivalent to the cost to dissolve the legislature?
  *   **Why First (Upstreamness):** This decides the regime type without using the loaded labels. If you choose high exit costs for both (fixed terms), you are designing for stability at the risk of deadlock. If you choose low exit costs for both (mutual dependence), you are designing for responsiveness at the risk of instability. If you choose asymmetry (e.g., fixed President, removable PM), you create the specific "cohabitation" risks your colleague identifies.
  *   **Conceptual vs. Empirical:** Primarily **Conceptual/Normative**. It requires a philosophical decision on what kind of failure is worse: gridlock (symmetric high costs) or churn (symmetric low costs). The literature often treats this as empirical ("presidentialism fails more"), but for a drafter, it is a choice of risk profile.
  *   **Testing the Colleague's Frame:** If you answer this and the rest of the design falls into place, the frame is robust. If you answer this and still face ambiguity about *who* holds the power, the frame is missing the "Source of Legitimacy" variable (see Red Herrings).
  *   **Weedy Sub-questions:** Does a failed budget automatically trigger a confidence vote? (Formalizing the link between money and survival). Should a no-confidence motion require a named replacement (constructive) or just a rejection (destructive)?
  *   **Actionability:** High. This is written directly into articles regarding term lengths and vote thresholds.

  #### 2. The Discretion of Dissolution (The "Trigger" Question)
  *   **The Question:** When the exit cost is low (i.e., elections can be called early), who holds the trigger, and is their discretion bound or unbound?
  *   **Why Second:** Once you decide *that* the legislature can be dissolved (from Q1), you must decide *who* decides. In many transitional systems, the Head of State (President/Monarch) retains discretionary power to dissolve parliament, which can be weaponized against a hostile majority.
  *   **Conceptual vs. Empirical:** **Mixed.** The normative principle is "agency alignment" (the person who risks their seat should have a say in the election). The empirical risk is authoritarian backsliding via "self-coups" using legal dissolution powers.
  *   **Neglectedness:** High. Most debates focus on the *vote of no confidence*; fewer focus on the *decree of dissolution*. In a negotiated transition, the outgoing elite often demand a strong President with dissolution powers as a "safeguard." This is a primary vector for democratic erosion.
  *   **Weedy Sub-questions:** Should dissolution be automatic upon a certain number of failed government formations? Should the Head of State be required to consult party leaders before dissolving?
  *   **Actionability:** High. Codify whether dissolution is mandatory (automatic) or discretionary, and if discretionary, whose advice binds the Head of State.

  #### 3. The Threshold of Constructive Confidence (The "Replacement" Question)
  *   **The Question:** To remove the executive, must the legislature simultaneously agree on a successor?
  *   **Why Third:** This modifies the "exit cost" established in Q1. A simple majority vote of no confidence creates low exit costs (instability). A *constructive* vote of no confidence (requiring a majority for a new PM before firing the old one) raises the exit cost without requiring fixed terms.
  *   **Conceptual vs. Empirical:** **Conceptual.** This is a mechanism to balance accountability against governability. It addresses the "negative majority" problem (where everyone hates the PM but can't agree on a replacement).
  *   **Neglectedness:** Moderate. The German model is well-known, but its applicability to fragmented, post-single-party systems is under-theorized. In a system with many small parties, constructive confidence can lead to long interregnums.
  *   **Weedy Sub-questions:** Should the threshold be an absolute majority of all members or a majority of those present? (This matters immensely for boycott strategies).
  *   **Actionability:** High. Specific voting rules.

  #### 4. Caretaker Constraints and Interregnum Powers (The "Lame Duck" Question)
  *   **The Question:** What powers does the executive retain after losing confidence or dissolving the legislature, but before a new government is seated?
  *   **Why Fourth:** This is the "endgame" scenario. If Q1–3 function well, this matters less. But in a fragile transition, the period between a fallen government and a new one is when extra-constitutional action is most tempting.
  *   **Conceptual vs. Empirical:** **Risk Management.** This is less about political theory and more about preventing looting or policy radicalism during a vacuum.
  *   **Neglectedness:** Very High. Constitutions often say nothing about caretaker governments. Conventions fill the gap, but new democracies lack stable conventions.
  *   **Weedy Sub-questions:** Can a caretaker government appoint judges? Sign international treaties? Move funds between budget lines?
  *   **Actionability:** Medium. Harder to enforce legally, but essential to codify to provide a legal basis for judicial intervention if violated.

  ---

  ### Red Herrings: Where Philosophical Work Won't Help

  1.  **The Label ("Presidentialism" vs. "Parliamentarism"):**
      *   *Why:* As your colleague noted, these are bundles of traits. Arguing over the label obscures the specific mechanics of exit costs. A "Parliamentary" system with a directly elected President who controls the military is functionally semi-presidential regardless of the text.
      *   *Action:* Ignore the taxonomy. Focus on the powers.

  2.  **The Electoral System (PR vs. Majoritarian):**
      *   *Why:* While crucial for representation, it is *downstream* of the executive-legislative relationship. You can have PR with a fixed-term President or FPTP with a removable PM.
      *   *Caveat:* Do not ignore it entirely, but do not let it drive the executive design. The executive design must be robust enough to survive the party system the electoral rule produces.

  3.  **The Title and Ceremonial Powers of the Head of State:**
      *   *Why:* In transitional contexts, the "reserve powers" of the Head of State matter more than their title. Whether they are called "President" or "Chairman" is irrelevant; whether they can dismiss the Prime Minister without cause is existential.
      *   *Action:* Strip discretionary powers unless they are explicitly bound by counter-signature requirements.

  ---

  ### The Pivotal Question and Evidence

  **The Single Pivotal Question:**
  *Does the symmetry of exit costs predict stability better than the source of legitimacy in negotiated transitions?*

  Your colleague's frame assumes that *mechanics* (exit costs) drive outcomes. The counter-hypothesis is that *legitimacy* (who was directly elected) drives outcomes. If a directly elected President (high legitimacy) faces a removable Parliament (low legitimacy), asymmetry in exit costs might not matter because the President will dominate regardless of the rules.

  **Evidence That Would Reorganize the Agenda:**
  Over the next two years, the advisory panel should commission a targeted review of **post-communist and post-authoritarian transitions in the last 30 years** (e.g., Eastern Europe, Latin America, Southeast Asia), specifically looking for cases of **asymmetric exit costs** (e.g., fixed President, removable PM).

  *   **If the data shows:** Asymmetric systems in *negotiated* transitions consistently lead to deadlock or executive usurpation (because the outgoing elite use the fixed presidency to veto the new parliament), then **Question 1 (Symmetry)** becomes the absolute priority, and you must recommend symmetric low costs (Parliamentarism) or symmetric high costs (Pure Presidentialism).
  *   **If the data shows:** Asymmetric systems stabilize the transition by providing a "guardian" (fixed President) while allowing political churn (removable PM), then the agenda shifts to **Question 2 (Discretion)**, focusing on limiting that guardian's powers.

  **Why this changes the ordering:**
  Currently, political theory often assumes asymmetry is bad (the "perils of semi-presidentialism"). But in a *negotiated* transition (where the old elite still hold power), asymmetry might be the *price* of the deal. If the empirical work suggests asymmetry is the only viable path to ratification, the philosopher's job shifts from designing the "ideal" symmetry to designing the "safest" asymmetry (e.g., binding the President's dissolution powers).

  ### Summary of the Philosophical Contribution

  Your role is not to predict which party will win, but to define the **normative trade-off between stability and accountability**.
  *   **Question 1** forces the assembly to choose their preferred failure mode (Gridlock vs. Chaos).
  *   **Question 2 & 3** provide the mechanical levers to tune that choice.
  *   **Question 4** ensures the system doesn't break during the tuning.

  By adopting your colleague's "Exit Cost" frame, you move the debate away from ideological labels ("We want a strong leader" vs. "We want people's power") toward institutional incentives ("How hard should it be to fire the boss?"). This is actionable, conceptually rich, and directly addresses the risk of a constitution that cannot be reopened.
