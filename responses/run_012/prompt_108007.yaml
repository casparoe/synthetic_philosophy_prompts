      *   Colleague's frame integrated? Yes, as the foundation.

  10. **Final Review of the "Colleague's Frame":** The prompt says "I suspect this is at least half wrong." I need to be critical of it, not just adopt it.
      *   *Critique:* Exit cost isn't the *only* variable. *Legitimacy sources* matter too. If the President is directly elected and the PM is parliamentarily selected, asymmetry exists even if exit costs are similar.
      *   *Adjustment:* I will place the Symmetry question first but note that it must be coupled with *Source of Legitimacy*. Actually, the prompt asks to build the ranking *in a way that would reveal whether it is wrong*. So I should treat it as the primary hypothesis to test. I will rank it #1 but define the criteria such that if it fails to predict stability, the whole agenda shifts.

      *(Self-Correction)*: Better to treat the "Asymmetry of Exit" as the *lens* for Q1, but acknowledge that *Source of Legitimacy* is the confounding variable. I will make Q1 about the *Configuration of Exit and Entry*.

      *Let's stick closer to the prompt's request:* "Take seriously a framing... build the ranking in a way that would reveal whether it is [wrong]."
