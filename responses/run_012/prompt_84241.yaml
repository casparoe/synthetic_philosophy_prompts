answer: |-
  ### I. The Board: Corwin as Nomic Rule-Set

  To map the Corwin Amendment onto Peter Suber's *Nomic*, we must first treat the Constitution not as a sacred text but as the current state of the game board. In *Nomic*, the game is defined by a set of rules, some mutable (changeable by standard vote) and some immutable (changeable only by special procedure or not at all). The core dynamic is **transmutation**: the process by which an immutable rule becomes mutable, or vice versa.

  **The Mapping:**
  *   **The Players:** The States (ratifying bodies) and Congress (proposing body). In *Nomic* terms, they are the agents authorized to execute rule changes.
  *   **The Meta-Rule:** Article V. This is Rule 2 in *Nomic*—the rule that dictates how rules change. It establishes the threshold (two-thirds proposal, three-fourths ratification).
  *   **The Corwin Clause:** This is an attempt to introduce a new **Immutable Rule** regarding a specific domain (slavery/domestic institutions). It does not merely raise the threshold (e.g., requiring unanimous consent); it attempts **Closure Entrenchment**. It declares a domain *off-limits* to the meta-rule itself.
  *   **The Operative Sentence:** "No amendment shall be made..." This is a negative constraint on the Players' ability to utilize the Meta-Rule (Article V).

  ### II. Entrenchment: Threshold vs. Closure

  In Suber's apparatus, **Threshold Entrenchment** makes a rule harder to change (e.g., requiring a 90% vote instead of 51%). **Closure Entrenchment** removes the subject matter from the domain of amendability entirely.

  The Corwin Amendment is **Closure Entrenchment**. By stating "No amendment shall be made," it attempts to place the institution of slavery outside the logical universe of Article V. Crucially, because it restricts *all* amendments, it implicitly covers its own repeal. To repeal Corwin, one must pass an amendment; but Corwin forbids any amendment that interferes with domestic institutions (which repealing Corwin would do).

  In *Nomic*, this creates a logical lock. Unless there is a higher-order transmutation rule (a "Rule 0" that allows the immutable to become mutable), the game state regarding slavery is frozen. Article V contains no such transmutation mechanism for itself. It is a procedure for change, not a procedure for altering the limits of change.

  ### III. The Counterfactual: Corwin vs. The Thirteenth

  **Scenario:** Corwin is ratified in 1861. In 1865, the Thirteenth Amendment (abolishing slavery) is proposed and ratified.

  **Nomic Analysis:**
  1.  **Validity:** Under strict *Nomic* logic, the Thirteenth Amendment is void *ab initio*. It violates an Immutable Rule (Corwin). A move that violates an immutable rule is an illegal move; it does not count.
  2.  **Repeal Route:** Could an amendment have been passed solely to repeal Corwin? No. Because Corwin is Closure Entrenchment, the act of repealing it is an act of interfering with the protection of "domestic institutions." The shield covers the shield-bearer.
  3.  **The Licensed Route:** *Nomic* guarantees a route. Rule 2 in *Nomic* usually allows players to change the rules of change. Article V does not. Therefore, Article V + Corwin **does not** leave an equivalent licensed route.
  4.  **Revolution vs. Interpretation:** Without a transmutation rule, the only way to adopt the Thirteenth Amendment is **revolution dressed as interpretation**. The Players (the Union States) must effectively declare that Corwin is no longer in force, not because the rules allow it, but because the Players have changed the nature of the game itself. In *Nomic*, this is akin to players agreeing to ignore Rule 1 and start a new game. In law, this is the Civil War.

  **The Disanalogy:**
  This disanalogy does not defeat the model; it validates the model's warning. Suber built *Nomic* to show that rules are only as strong as the players' agreement to obey them. If the rules forbid a change the players desperately want, the players will break the rules. The Corwin Amendment demonstrates that **legal closure cannot bind political will.** *Nomic* assumes a closed system; the Constitution exists in an open system where the "players" can walk away from the board (secession) or burn the board (war).

  ### IV. The Verdict: Sponsors and Silence

  **What the Sponsors Were Doing:**
  The sponsors of Corwin were attempting to use a Mutable Rule (Article V) to create an Immutable Rule (Corwin). They were trying to bind the future sovereignty of the People to the present political preference of the 36th Congress. In *Nomic* terms, they were trying to win the game by removing the opponent's pieces from play permanently.

  **Where Nomic Misdescribes Law:**
  1.  **The Referee:** *Nomic* has a judge (or consensus) to rule on moves. The Constitution has Courts. But Courts may decline to decide (political question doctrine). A Court might have ruled Corwin void as incompatible with the "spirit" of the Constitution, or valid. *Nomic* assumes rule application is deterministic; Law admits of indeterminacy.
  2.  **Execution:** In *Nomic*, a rule change executes itself. In Law, a Constitutional amendment requires enforcement. If the South had won the war, Corwin would have been "law," but the Union would have ceased to exist. If the Union won, Corwin was politically dead regardless of its text.
  3.  **Silence:** The apparatus falls silent on **violence**. *Nomic* has no mechanic for a player flipping the table. The Corwin Amendment failed not because of logical inconsistency, but because the cost of obeying the rule (perpetual slavery) exceeded the cost of breaking it (war). Where the apparatus falls silent, we must acknowledge: **Entrenchment is a political fact, not a logical necessity.**

  ### V. The Second Case: The Equal Rights Amendment (ERA)

  **The Facts:** Congress proposed the ERA with a seven-year ratification deadline in the *proposing resolution* (not the amendment text). Later, Congress extended the deadline by simple majority vote.

  **Nomic Mapping:**
  *   **Corwin:** A High-Ranking Rule (Constitutional Text) trying to bind the Meta-Rule (Article V) from *above*.
  *   **ERA Deadline:** A Low-Ranking Act (Statutory Resolution) trying to bind the Meta-Rule (Article V) from *below*.

  **The Account's Prediction:**
  1.  **Corwin (Top-Down):** Predicts a logical lock. If valid, it blocks change unless broken by force. It claims to be Immutable.
  2.  **ERA (Bottom-Up):** Predicts mutability. The deadline was not in the Constitutional text (the Rule); it was in the resolution (a move made *under* the Rule). In *Nomic*, a move cannot restrict future moves unless the Rule says so. Since Article V is silent on deadlines, Congress imposing one is a mutable policy decision, not an immutable constraint. Therefore, Congress should be able to extend it by simple majority (changing its own prior move).

  **One Paradox or Two?**
  These are **one paradox manifesting in two directions.**

  The paradox is **The Sovereignty of the Present.**
  *   **Corwin** asks: Can the present bind the future *permanently*? (The answer is No, because the future can always break the rule).
  *   **ERA** asks: Can the present bind the future *procedurally*? (The answer is Yes, but only as long as the present agrees).

  Both cases reveal that Article V is not a machine that runs itself; it is a power exercised by living majorities.
  *   In Corwin, the 36th Congress tried to kill the 39th Congress's power to amend. The 39th Congress (and the 13th Amendment) proved that a subsequent majority can ignore the prior attempt at closure.
  *   In ERA, the 92nd Congress tried to bind the ratification timeline. The 95th Congress proved it could unbind it, because the constraint was self-imposed and not textually entrenched.

  **Synthesis:**
  Suber's *Nomic* reveals that no rule is truly immutable unless the players agree to make it so. Corwin tried to make a rule immutable by text; it failed because the players (the Nation) withdrew agreement. ERA tried to make a rule mutable by practice; it succeeded because the players maintained agreement.

  The Corwin Amendment is a **failed attempt at Closure Entrenchment**. The ERA extension is a **successful exercise of Mutable Procedure**. Together, they prove that in the American game, there are no Immutable Rules, only rules that the Players have not yet chosen to break. *Nomic* predicts that if a rule prevents the game from continuing, the rule will be discarded. Corwin prevented the Union from continuing; it was discarded. The ERA deadline did not prevent the game; it was adjusted.

  **Final Verdict:** The apparatus holds, provided we acknowledge its silence on the cost of rule-breaking. *Nomic* assumes players prefer playing to winning. Constitutional history shows players prefer winning to playing. Corwin was not logically defeated; it was politically overrun. The model correctly identifies the logical lock; it cannot measure the force required to break it.
