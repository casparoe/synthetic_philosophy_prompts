answer: |-
  Dev, since you asked what happened Friday: imagine football, but every time someone scores, they can change the offside rule. Most changes need a simple vote (mutable), but some are written in permanent marker (immutable).

  We broke it.

  Someone proposed: "You need a two-thirds vote to change rules, except this one."
  Then another rule kicked in: "Any rule surviving three turns becomes immutable."
  We hit turn three mid-debate.

  Now the rule says it's easy to change, but the meta-rule says it's locked. Priya says it's elegant recursion. I say the floor has given way.

  We tried to vote to go home, but the motion failed because the rule allowing us to stop is mutable, but the rule defining 'mutable' is currently immutable. So we're legally obligated to continue until the heat death of the universe, or until someone brings biscuits. Whichever comes first.
