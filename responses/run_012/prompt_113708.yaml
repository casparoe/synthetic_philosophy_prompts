answer: |-
  # HANDOUT: Specifications for Rational Choice Under Extreme Uncertainty
  **Topic:** Pascal's Mugging & The Limits of Expected Value
  **Context:** Decision Theory Reading Group

  ## I. The Desiderata (The Spec)
  *What an adequate theory of choice must deliver in the domain of tiny probabilities ($\epsilon$) and enormous stakes ($V$).*

  **1. Exploitation Immunity (The Mugging)**
  *   **Requirement:** The agent must not be compelled to surrender finite resources to satisfy every claim of astronomical value backed by negligible probability.
  *   **Consideration:** A theory that mandates paying the mugger renders rational agency impossible; the agent becomes a money pump for any storyteller capable of inflating $V$.

  **2. Consistency Under Competition (Many Muggers)**
  *   **Requirement:** The theory must handle incompatible obligations without contradiction.
  *   **Consideration:** If Mugger A demands \$5 to save $10^{100}$ lives in Universe X, and Mugger B demands \$5 to save $10^{100}$ lives in Universe Y (where X and Y cannot both exist), the theory cannot prescribe paying both. Agglomeration of obligations must fail gracefully.

  **3. Continuity of Verdicts (Finite vs. Infinite)**
  *   **Requirement:** The verdict should not undergo a discontinuous jump merely because stakes transition from astronomically finite to actually infinite.
  *   **Consideration:** If a theory rejects the Mugging at $10^{100}$ utility but accepts Pascal's Wager at $\infty$ utility without a structural change in reasoning, it relies on a mathematical singularity rather than a decision-theoretic principle.

  **4. Ordinary Prudence (The Precaution Principle)**
  *   **Requirement:** The theory must prescribe preventive action for low-probability, high-cost physical risks (e.g., seatbelts, asteroid deflection, insurance).
  *   **Consideration:** A fix that solves the Mugging by ignoring tiny probabilities must not also render standard safety measures irrational.

  **5. Evidence Sensitivity (Source of Probability)**
  *   **Requirement:** The theory should distinguish between a well-modeled physical risk (e.g., meteor impact) and an untestable testimonial claim (e.g., magic powers).
  *   **Consideration:** Treating a stranger's bare assertion as equiprobable to a calculated physical frequency seems epistemically naive; the "weight" of the probability matters, not just the number.

  **6. Cognitive Tractability**
  *   **Requirement:** The decision rule must be usable by agents who cannot precisely distinguish $10^{-30}$ from $10^{-40}$.
  *   **Consideration:** If the solution relies on precise calculation of probabilities beyond human (or AI) resolution, it is normative but not action-guiding.

  ---

  ## II. Status & Tensions
  *Which requirements are foundational, and which form impossible clusters?*

  **Core Constraints (Non-Negotiable)**
  *   **Consistency:** Logical coherence is mandatory (Addresses *Many Muggers*).
  *   **Tractability:** A theory requiring impossible calculation is useless (Addresses *Cognitive Limits*).

  **Substantive Intuitions (Contested)**
  *   **Exploitation Immunity:** Rejected by strict Expected Value (EV) maximizers who accept unbounded utility.
  *   **Continuity:** Rejected by theories that treat Infinity as a distinct category (e.g., standard Pascal's Wager defenses).
  *   **Evidence Sensitivity:** Rejected by strict Bayesians who hold that "probability is probability" regardless of source.

  **The Impossibility Result (The Trilemma)**
  *The following three desiderata appear jointly unsatisfiable without introducing an arbitrary parameter:*
  1.  **Never-Pay:** Do not pay the mugger (Exploitation Immunity).
  2.  **No-Arbitrary-Cutoff:** Do not ignore probabilities below a specific threshold (e.g., $10^{-100}$).
  3.  **Precaution:** Do wear the seatbelt (Ordinary Prudence).

  *Why:* If you accept Precaution, you admit that Small $P \times$ Large $V$ can override Small Cost. If you accept No-Arbitrary-Cutoff, you admit this holds for *any* non-zero $P$. If the Mugger's $V$ exceeds the Seatbelt's $V$, and you treat the $P$'s similarly, consistency demands you pay the Mugger. To save both Never-Pay and Precaution, you must introduce a **Cutoff** (violating 2) or a **Source Distinction** (violating strict Bayesianism).

  ---

  ## III. Solution Family Scorecard
  *Brief evaluation of standard approaches against the spec.*

  **1. Bounded Utility Functions**
  *   **Verdict:** Caps the value of outcomes so $P \times V$ never exceeds finite costs.
  *   **Score:** Solves Mugging and Many Muggers; preserves Prudence for finite risks. Fails Continuity (breaks at Infinity) and is often rejected as ad-hoc constraint on value.

  **2. Probability Thresholds (Lexical Ignoring)**
  *   **Verdict:** Treats probabilities below a certain floor as zero for decision purposes.
  *   **Score:** Solves Mugging and Tractability. Fails Precaution (kills seatbelts/insurance) and violates No-Arbitrary-Cutoff (the floor is unjustified).

  **3. Evidential Weight / Robust Credences**
  *   **Verdict:** Distinguishes between precise probabilities and vague/unsupported hypotheses; discounts the latter.
  *   **Score:** Solves Mugging and Source Sensitivity. Preserves Prudence (physical risks have weight). Hard to formalize mathematically; risks violating "Probability is Probability" norms.

  **4. Unbounded Expected Value Maximization**
  *   **Verdict:** Bite the bullet: if $P \times V > Cost$, act, regardless of how small $P$ is.
  *   **Score:** Satisfies Precaution and Continuity. Fails Exploitation Immunity (pays the mugger) and Consistency (succumbs to Many Muggers). Demands impossible Tractability.
