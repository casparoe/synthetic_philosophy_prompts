prompt: |-
  I'm putting together a handout on Pascal's mugging for a decision theory reading group, and before we start arguing about fixes I want the spec on the table. Write me the desiderata for a theory of rational choice under tiny probabilities of enormous stakes -- what any adequate account has to deliver, with the case or consideration behind each requirement. I want it to cover: the mugging itself; the many-muggers problem, where two strangers make incompatible enormous offers at negligible probability and you can't pay both; the infinite-stakes version versus the merely astronomical finite one, and whether the theory's verdict should jump as the stakes go from huge to infinite; the precaution cases, where a rule that ignores tiny probabilities would also make ordinary prudence (seatbelts, insurance against rare disasters) irrational; how the probability arises -- a well-modelled one-in-a-billion physical event versus a stranger's untestable claim -- and whether a theory can use that distinction without it being arbitrary; and the fact that any fix has to be usable by an agent who can't really estimate 1-in-10^40. Mark which requirements are non-negotiable and which are just commitments of one camp, and if some subset looks jointly unsatisfiable -- I suspect never-pay plus no-arbitrary-cutoff plus the precaution requirement is trouble -- say so, thats the part I care about most. Then score the usual families in a line or two each (bounded utility, ignoring tiny probabilities or lexical thresholds, credences that carry a separate measure of how much evidence backs them, and biting the bullet and maximizing expected value). Keep it tight and no citations, I'm not asking for a bibliography.
reasoning: |-
  Here's a thinking process that leads to the suggested handout:

  1.  **Analyze the Request:**
      *   **Topic:** Pascal's Mugging (decision theory under tiny probabilities of enormous stakes).
      *   **Goal:** Create a handout specifying *desiderata* (requirements) for an adequate theory.
      *   **Specific Content to Cover:**
          *   The Mugging itself (single agent, huge stake, tiny prob).
          *   Many-Muggers problem (incompatible offers).
          *   Infinite vs. Astronomical Finite stakes (continuity/discontinuity).
          *   Precaution Cases (seatbelts, insurance vs. ignoring tiny probs).
          *   Source of Probability (modeled physical event vs. untestable claim).
          *   Computability/Cognitive Limitations (agents can't estimate $10^{-40}$).
          *   **Crucial:** Mark requirements as Non-Negotiable vs. Camp Commitments.
          *   **Crucial:** Identify Joint Unsatisfiability (trilemmas/impossibility results).
          *   **Crucial:** Score standard families of solutions (Bounded Utility, Ignoring Tiny Probs/Thresholds, Evidential Weight/Robustness, Maximize EV).
      *   **Constraints:** Tight, no citations, no bibliography.

  2.  **Deconstruct the Desiderata (The "Spec"):**
      *   *Requirement 1: Avoid Exploitation (The Mugging).* Don't hand over your wallet to every stranger claiming godlike powers.
      *   *Requirement 2: Consistency (Many Muggers).* Don't accept incompatible obligations.
      *   *Requirement 3: Continuity (Infinite vs. Finite).* Don't have a verdict flip wildly just because a number goes to infinity (or don't treat finite huge numbers like infinite ones).
      *   *Requirement 4: Ordinary Prudence (Precaution).* Must allow for seatbelts/insurance (tiny prob $\times$ large cost > small cost).
      *   *Requirement 5: Evidence Sensitivity (Source).* Distinguish between a calculated risk (asteroid) and a bare assertion (magic).
      *   *Requirement 6: Tractability (Cognitive Limits).* Humans can't calculate $10^{-40}$ accurately.

  3.  **Classify Requirements (Non-Negotiable vs. Camp Commitments):**
      *   *Non-Negotiable:* Avoid Exploitation (mostly), Consistency, Ordinary Prudence, Tractability.
      *   *Camp Commitments:* Continuity (some accept discontinuity), Evidence Sensitivity (some say prob is prob), Maximize EV (some reject this axiom).
      *   *Wait, refinement:* "Avoid Exploitation" is the core conflict. If you Maximize EV, you *must* pay the mugger (unless utility is bounded). So "Don't Pay" is a desideratum for *anti-mugging* theories, but "Maximize EV" is a desideratum for *orthodox* theories. I need to frame these as tensions.
      *   *Better approach:* Frame them as "The Theory Must..." and then note where they conflict.
      *   *Non-Negotiable:* Consistency (Logic), Tractability (Psychological reality), Ordinary Prudence (Intuition).
      *   *Contested:* Paying the Mugger (EV vs. Intuition), Continuity (Infinity), Evidence Distinction.

  4.  **Identify Joint Unsatisfiability (The "Trilemma"):**
      *   The user specifically suspects: *Never-Pay + No-Arbitrary-Cutoff + Precaution* is trouble.
      *   Let's formalize this.
      *   1. **Dominance/EV:** If $P \times V > Cost$, act.
      *   2. **Prudence:** If $P$ is small but non-zero and $V$ is large (death), act (seatbelt).
      *   3. **Anti-Mugging:** If $P$ is tiny and $V$ is huge (magic), do not act.
      *   *Conflict:* Where is the line between Seatbelt and Mugging? If you set a probability threshold (cutoff), it looks arbitrary. If you don't, you either pay the mugger or skip the seatbelt.
      *   *Explicitly state this tension.*

  5.  **Drafting the Scoring of Families:**
      *   *Bounded Utility:* Solves Mugging (V can't get high enough). Fails Infinite Stakes (Pascal's Wager). Maybe violates Prudence if bound is too low? (Usually okay).
      *   *Ignoring Tiny Probs (Thresholds):* Solves Mugging. Fails Prudence (Seatbelts). Arbitrary cutoff.
      *   *Evidential Weight (Keynesian/Skepticism):* Solves Mugging (low weight). Hard to formalize. Distinguishes Source well.
      *   *Maximize EV (Unbounded):* Solves Prudence. Fails Mugging (pays up). Fails Many Muggers (inconsistent obligations).

  6.  **Refining the Output Structure:**
      *   **Header:** Title/Context.
      *   **Section 1: The Desiderata (The Spec).** List the requirements with the "Why".
      *   **Section 2: Status & Tensions.** Mark Non-Negotiable vs. Contested. Highlight the Impossibility result.
      *   **Section 3: Solution Family Scorecard.** Brief evaluation.

  7.  **Drafting Content (Iterative refinement for tightness):**
      *   *Self-Correction on "Non-Negotiable":* In philosophy, nothing is truly non-negotiable. I should label them "Pre-Theoretic Intuitions" vs "Formal Constraints". Let's use "Core Constraints" (Logic/Consistency) vs "Substantive Intuitions" (Don't pay muggers/Do wear seatbelts).
      *   *Refining the "Many Muggers":* This is about agglomeration. If I ought to do A and ought to do B, I ought to do A+B. But if A and B are incompatible, the theory breaks.
      *   *Refining "Infinite vs Finite":* This is about continuity. Does the function break at $\infty$?
      *   *Refining "Source":* This is about Bayesian priors vs. hypothesis complexity.

  8.  **Final Polish (checking against constraints):**
      *   No citations? Check.
      *   Tight? Check.
      *   Cover all specific points requested? Check.
      *   Highlight the unsatisfiable subset? Check.

  9.  **Final Review of the "Unsatisfiable Subset":**
      *   The user wrote: "never-pay plus no-arbitrary-cutoff plus the precaution requirement is trouble".
      *   I need to confirm this.
      *   If I never pay (Anti-Mugging), I need a reason why $P \times V$ doesn't trigger action.
      *   If I have no arbitrary cutoff, I can't just say "P < 0.0001 doesn't count."
      *   If I need Precaution, I must act on some small $P \times V$ (seatbelt).
      *   So, if Mugging $P \times V$ > Seatbelt $P \times V$, and I act on Seatbelt but not Mugging, I need a difference other than the product. That difference is usually the *source* (evidence) or a *cutoff*. If I deny cutoffs and deny source distinctions (prob is prob), I'm stuck.
      *   I will explicitly label this the "Prudence-Mugging-Cutoff Trilemma".

  10. **Writing the response.** (Proceeding to generate output based on these thoughts).

  *(Self-Correction during drafting)*: Make sure to distinguish between "Infinite Stakes" (Pascal's Wager style) and "Astronomical Finite" (Mugging). The prompt asks about the transition between them.
  *(Self-Correction on Scoring)*: Keep it to a line or two as requested.

  *(Final check on tone)*: Academic, handout style, direct.

  *(Let's assemble the "Unsatisfiable Subset" clearly)*:
  1. **Expected Value Principle:** Act if $P \times V > Cost$.
  2. **Prudence:** Act on small $P$, large $V$ (seatbelts).
  3. **Anti-Mugging:** Do not act on tiny $P$, huge $V$ (mugging).
  *Problem:* If Mugging $V$ is large enough to outweigh the smaller $V$ of death/seatbelt, and $P$ is treated the same, you violate either Prudence or Anti-Mugging. To save both, you need a Cutoff or a Source Distinction. If you ban Cutoffs (No-Arbitrary-Cutoff) and ban Source Distinction (Prob is Prob), you crash.

