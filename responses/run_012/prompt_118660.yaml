prompt: |-
  I run the taxonomy team at a mid-sized company — we own the category system that search, the data warehouse and the pricing models all sit on, about 4000 nodes and growing. Every quarter we have the same fight and it never resolves: is this category real, or did we just make it up? Someone says of course its real, look at the world; someone else says every category is a decision, pick whatever makes the downstream numbers work; then we compromise by adding another node that nobody uses.

  I know philosophers spent an absurdly long time on exactly this — whether there are real universals, or whether properties are just names, or classes of resembling things, or bundles of particular features, and there's that useful-sounding split between the properties that carve nature at its joints and the ones that are only convenient groupings. I want to know if any of that survives translation into something my team can actually run on a Tuesday afternoon.

  So: write me a decision procedure. It takes a proposed category (or a proposed split of an existing one) and walks it through a series of questions in order, saying what counts as a good enough answer at each step, and it ends either in a verdict — treat as real, treat as administrative-only, split, merge, delete — or in an explicit hand-off to a human because the question has turned into a values call rather than a facts call. The tests have to be things a smart non-philosopher can apply, so no jargon that isn't defined inside the procedure itself.

  Constraints on how we actually work: maybe an hour per category, the person running it is a product analyst and not me, and any change to a category that feeds pricing needs sign-off from legal, which mostly means the procedure has to be able to say why a category is or isn't defensible, not just that we like it.

  Run it on three cases, and I want it to have to sweat on all three:
  1. The eternal one — whether our hot dog SKUs belong under sandwiches or get their own top-level node.
  2. A category that's half biological, half commercial: we sell pet food and have to decide whether to key the tree to species, breed, or life stage, and those three cut across each other.
  3. A people-category, which is where I actually lose sleep. We segment customers into a health-and-lifestyle bucket that marketing uses, and after a couple of years the customers in that bucket start behaving more like the bucket than like how they started out. So the category is doing something to the world it's supposed to be describing, and I dont know if that makes it more real or less.

  For at least one of the three I expect the procedure to give an answer I won't like. Say so plainly when it does.

  Then be honest about the limits: where the procedure is really just a judgment call wearing a checklist, what kinds of category it will get wrong, and whether there's a class of disputes it can't touch at all because the disagreement was never about metaphysics in the first place but about who pays for the mistake.

  Skip the citations, I'll dig those up myself if I need them.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Taxonomy team lead at a mid-sized company.
      *   **Problem:** Recurring conflict over category ontology (Realism vs. Nominalism/Pragmatism). 4000 nodes, growing.
      *   **Goal:** A practical decision procedure (checklist/algorithm) for a product analyst to run on a Tuesday afternoon (max 1 hour per category).
      *   **Requirements:**
          *   Must handle "Real vs. Made Up" debates.
          *   Must output a verdict (Real, Admin-only, Split, Merge, Delete) or escalate to human (values call).
          *   Must be defensible to Legal (for pricing implications).
          *   No undefined philosophical jargon.
          *   Must run on three specific, difficult cases (Hot Dog, Pet Food, Customer Segments).
          *   Must admit when the answer is unpalatable.
          *   Must include a "Limits" section (where it fails, where it's just disguised judgment, where it's actually about budget/power).
      *   **Tone:** Pragmatic, direct, slightly weary but authoritative, acknowledging the philosophical heritage without getting bogged down in it.

  2.  **Deconstruct the Philosophical Underpinnings (for internal use, then translate):**
      *   *Realism (Universals):* Categories exist independently of us (Nature's Joints).
      *   *Nominalism:* Categories are just names we assign for convenience.
      *   *Pragmatism:* Categories are tools; their "truth" is in their utility.
      *   *Reflexivity (Soros/Hacking):* Classifying people changes their behavior (Case 3).
      *   *Translation:* Instead of "Real," use "Stable/Predictive." Instead of "Nominal," use "Operational/Administrative." Instead of "Truth," use "Downstream Utility."

  3.  **Drafting the Decision Procedure (The "Taxonomy Triage Protocol"):**
      *   *Constraint:* Max 1 hour. Needs to be linear.
      *   *Step 1: The Downstream Impact Test.* Does this change break pricing or search? (Legal/Safety check).
      *   *Step 2: The Stability Test.* Is the definition stable over time? (Nature's Joints proxy).
      *   *Step 3: The User Intent Test.* Do users search for this distinction? (Pragmatic check).
      *   *Step 4: The Mutual Exclusivity Test.* Can an item belong to two siblings? (Logical check).
      *   *Step 5: The Reflexivity Check.* Does naming this change the behavior? (Social construct check).
      *   *Verdict Logic:* Based on the pass/fail of these steps.

  4.  **Developing the Three Cases:**

      *   *Case 1: Hot Dogs.*
          *   *Conflict:* Culinary definition vs. User expectation vs. Legal/Tax precedent.
          *   *Application:* Stability (high), User Intent (split), Mutual Exclusivity (problematic if under Sandwich).
          *   *Verdict:* Likely needs its own node (Administrative/Pragmatic), but Legal might force "Sandwich" for pricing/regulatory reasons. *Self-Correction:* The prompt asks for an answer I won't like. Let's make the procedure say "It's a Sandwich" based on structural logic, even if everyone hates it, OR say "It's not Real" and move it to a filter. Let's go with: The procedure forces it into "Sandwich" for structural integrity, which the team hates. Or better: The procedure declares it "Administrative Only" because the definition varies by jurisdiction, making it unstable as a "Real" node. Let's aim for the "Unpalatable Truth": The procedure says "Merge into Sandwiches" because distinct nodes create fragmentation, but marketing wants separation. Actually, the prompt says "Say so plainly when it does." Let's make the procedure conclude that the distinction is *purely regulatory*, not taxonomic, which undermines the team's desire for a "Hot Dog" node.

      *   *Case 2: Pet Food (Species vs. Breed vs. Life Stage).*
          *   *Conflict:* Biological reality vs. Commercial SKU management.
          *   *Application:* Stability (Species = High, Life Stage = High, Breed = Low/Messy). Mutual Exclusivity (Breed crosses Species).
          *   *Verdict:* Hierarchy must be Species -> Life Stage. Breed is a tag/filter, not a node. This is standard best practice, might be too easy. Let's make it sweat: What about "All Life Stages" food? That breaks the Life Stage node. The procedure should flag "Life Stage" as a property, not a node, to avoid cross-cutting.
          *   *Unpalatable part:* The procedure might say "Delete the Breed node entirely," which Sales hates.

      *   *Case 3: Customer Segments (Health & Lifestyle).*
          *   *Conflict:* Descriptive vs. Performative (Reflexivity).
          *   *Application:* Reflexivity Check fails (the category changes the thing). Stability fails (behavior shifts *because* of the category).
          *   *Verdict:* This is the hardest one. The procedure should flag this as a "Values Call" or "Administrative/Marketing Construct" rather than a "Real" taxonomy node. It warns that this isn't a description of reality, but an intervention.
          *   *Unpalatable part:* The procedure says "This is not a valid taxonomy node; it is a marketing campaign tag." This undermines the team's existing structure.

  5.  **Refining the Procedure (Iterative Polish):**
      *   Make the steps actionable questions.
      *   Define "Real" as "Stable + Predictive."
      *   Define "Administrative" as "Useful for Reporting/Pricing only."
      *   Ensure Legal defensibility is baked into Step 1.

  6.  **Drafting the Limits Section:**
      *   Acknowledge that this doesn't solve power struggles (who owns the P&L).
      *   Acknowledge that "Nature's Joints" is a metaphor, not a scientific fact in commerce.
      *   Admit that some disputes are about budget allocation, not ontology.

  7.  **Review against Constraints:**
      *   *Hour per category?* Yes, 5 steps.
      *   *Analyst friendly?* Yes, plain English.
      *   *Legal defensible?* Yes, Step 1 focuses on external definitions.
      *   *Three cases run?* Yes.
      *   *Unpalatable answer included?* Yes, specifically on the Customer Segment case (denying its ontological status) and potentially the Hot Dog case.
      *   *Limits section?* Yes.

  8.  **Final Polish (Tone Check):**
      *   Ensure it sounds like it comes from someone who understands the pain of taxonomy governance.
      *   Avoid academic name-dropping (Kant, Locke, Searle) unless explained simply.
      *   Keep it tight.

  *(Self-Correction during drafting Case 1)*: I need to make sure the Hot Dog verdict is specific. If I say "It depends," that's weak. I need the procedure to force a choice. Let's have the procedure force it into "Sandwich" based on structural containment, which contradicts cultural intuition. That's the "answer I won't like."
  *(Self-Correction during drafting Case 3)*: The prompt says "For at least one of the three I expect the procedure to give an answer I won't like." I should ensure the Customer Segment one is the strongest "No." It challenges the validity of their behavioral segmentation as a *taxonomy* issue.

  9.  **Finalizing the Output Structure:**
      *   Introduction (acknowledging the philosophical weight).
      *   The Procedure (The "Ontology Triage Protocol").
      *   The Run-Through (Cases 1, 2, 3).
      *   The Limits (Honest assessment).

  10. **Writing...** (incorporating the "Legal Defensibility" constraint heavily in Step 1).
      *   *Wait, one more thing:* The prompt mentions "pricing models sit on this." If a category changes, pricing might break. Step 1 needs to be a hard gate.
      *   *Reflexivity:* Need to explain "Reflexivity" simply in the procedure. "Does naming it change it?"

  Let's assemble.
answer: |-
  ### The Ontology Triage Protocol (OTP)

  **Purpose:** To determine whether a proposed category represents a stable distinction in the world ("Real"), a useful fiction for operations ("Administrative"), or a values-based intervention ("Construct").
  **Time Budget:** 60 Minutes per proposal.
  **Operator:** Product Analyst.
  **Output:** A verdict and a defensible rationale for Legal/Stakeholders.

  ---

  #### Step 1: The External Anchor Test (Legal & Stability)
  *Goal: Determine if the category is defined by us or by the outside world.*

  **Question:** Is there a binding external definition for this category (Regulatory, ISO, Legal Precedent, or Industry Standard) that we must adhere to for pricing or compliance?
  *   **Yes:** The category is **Real (Regulatory)**. You do not get to decide if it exists. Your job is to map internal SKUs to this external definition.
      *   *Action:* Document the external source (e.g., "IRS Publication 535," "FDA Code of Federal Regulations").
      *   *Verdict:* **Treat as Real.**
  *   **No:** Proceed to Step 2.

  #### Step 2: The Mutuality Test (Logic)
  *Goal: Determine if the category structure is logically sound.*

  **Question:** Can a single item belong to two sibling categories at the same level of the tree without contradiction? (e.g., Can a "Dog Food" item also be a "Cat Food" item?)
  *   **Yes:** Your proposed split is flawed. You are trying to make nodes out of properties.
      *   *Action:* Demote the distinction to a **Filter/Tag**, not a Node.
      *   *Verdict:* **Merge Siblings / Convert to Attribute.**
  *   **No:** Proceed to Step 3.

  #### Step 3: The Search Intent Test (Utility)
  *Goal: Determine if the distinction matters to the user.*

  **Question:** If we hid this category label and only showed the items, would >20% of users fail to find what they came for? (Use search query logs or A/B test data).
  *   **Yes:** The distinction has **Pragmatic Reality**. Users expect this bucket to exist.
      *   *Verdict:* **Treat as Real (Operational).**
  *   **No:** Proceed to Step 4.

  #### Step 4: The Stability Test (Time)
  *Goal: Determine if the category drifts.*

  **Question:** Will the criteria for belonging to this category change significantly in the next 24 months without a change in the physical product?
  *   **Yes:** The category is unstable. It is likely tracking a trend, not a type.
      *   *Verdict:* **Treat as Administrative-Only** (Use for reporting, do not build pricing logic on it).
  *   **No:** Proceed to Step 5.

  #### Step 5: The Reflexivity Check (Intervention)
  *Goal: Determine if the category changes the thing it describes.*

  **Question:** Does assigning an item (or person) to this category change how that item (or person) behaves?
  *   **Yes:** This is a **Performative Construct**. The category is not describing the world; it is editing it.
      *   *Action:* **Hand-off to Human.** This is no longer a facts call; it is an ethics and strategy call. You need leadership sign-off on the *consequence* of the classification, not just the definition.
  *   **No:** Proceed to Verdict.

  ---

  #### Final Verdict Logic
  *   **Step 1 Yes:** **Real.** (Defensible by Law).
  *   **Step 2 Fail:** **Merge/Tag.** (Defensible by Logic).
  *   **Step 3 Yes + Step 4 No:** **Real.** (Defensible by Data).
  *   **Step 3 No + Step 4 No:** **Administrative.** (Defensible by Efficiency).
  *   **Step 5 Yes:** **Escalate.** (Defensible by Transparency).

  ---

  ### The Run-Through

  Here is the protocol applied to your three headache cases.

  #### Case 1: The Hot Dog (Sandwich vs. Top-Level Node)
  *Proposal:* Create a top-level node "Hot Dogs" separate from "Sandwiches."

  1.  **External Anchor:** **No.** There is no federal law defining a hot dog for retail taxonomy (though there is for labeling meat content). New York tax law says it's a sandwich; USDA says it's a sausage. Conflicting external definitions. *Proceed.*
  2.  **Mutuality:** **Fail.** A hot dog fits the structural definition of a sandwich (filling between bread). If you make them siblings, a "Corn Dog" or a "Sausage Roll" creates ambiguity. You are cutting across a structural hierarchy with a cultural one. *Action:* Demote "Hot Dog" to a Tag/Filter under "Sandwiches" or "Sausages."
  3.  **Search Intent:** **Yes.** Users search "Hot Dogs" specifically. *However*, Step 2 already flagged a logical error. You can satisfy search intent with a redirect or a tag without breaking the tree logic.
  4.  **Stability:** **Yes.** A hot dog will likely remain a hot dog.
  5.  **Reflexivity:** **No.** Naming it doesn't change the sausage.

  **Verdict:** **Merge into Sandwiches (with "Hot Dog" as a mandatory Filter).**
  **Rationale:** The tree must reflect physical containment (Step 2) to remain scalable. User intent is handled via search metadata, not top-level ontology.
  **The Answer You Won't Like:** The procedure forbids a top-level "Hot Dog" node. It forces you to admit that culturally distinct does not mean taxonomically distinct. If you keep it top-level, you are admitting your tree is based on vibes, not structure, which Legal will hate when you try to price "Sandwiches" differently than "Hot Dogs."

  #### Case 2: Pet Food (Species vs. Breed vs. Life Stage)
  *Proposal:* A tree structure that allows navigation by Breed (e.g., "Golden Retriever Food").

  1.  **External Anchor:** **No.** AAFCO guidelines focus on nutritional profiles (Life Stage), not Breed.
  2.  **Mutuality:** **Fail.** Breed cuts across Species. A "Poodle" is a Dog. If you have a "Dog" node and a "Poodle" node at the same level, you have overlap. If you nest "Poodle" under "Dog," you create a deep tree where "Life Stage" (Puppy) also needs to nest. You end up with: *Dog -> Poodle -> Puppy*. But what about *Dog -> Puppy -> Poodle*? This creates a combinatorial explosion of nodes.
  3.  **Search Intent:** **Yes.** Owners search by breed.
  4.  **Stability:** **No.** Breed-specific food is often marketing fluff. A "Great Dane" formula is often just "Large Breed Puppy" formula with a label change. The SKU might disappear or rebrand frequently.
  5.  **Reflexivity:** **No.** The dog doesn't care what the bag says.

  **Verdict:** **Split.** Primary Node = Species. Secondary Node = Life Stage/Nutritional Need. "Breed" = **Filter/Tag Only.**
  **Rationale:** Step 2 prevents Breed from being a node because it creates cross-cutting classification issues that break the warehouse logic. Step 4 highlights that Breed-specific SKUs are commercially unstable.
  **The Defensible Line:** Legal can defend "Species" and "Life Stage" (AAFCO standards). They cannot defend "Breed" as a distinct pricing category without risking false advertising claims if the nutritional content is identical to the generic version.

  #### Case 3: Health & Lifestyle Customer Segment
  *Proposal:* A taxonomy node for customers classified as "Health-Conscious" used for pricing and targeting.

  1.  **External Anchor:** **No.** This is an internal construct.
  2.  **Mutuality:** **Pass.** A customer is either in the segment or not (binary).
  3.  **Search Intent:** **N/A.** This is backend taxonomy.
  4.  **Stability:** **Fail.** You noted that customers *start behaving like the bucket*. This means the criteria for being in the bucket drifts as the marketing campaign influences them. The definition is not stable; it is moving target.
  5.  **Reflexivity:** **Yes.** **Hard Stop.** Assigning a customer to this bucket changes their behavior (via targeted offers) and potentially their self-perception.

  **Verdict:** **Hand-off to Human (Leadership/ Ethics).**
  **Rationale:** The OTP flags this as a **Performative Construct**. This is not a description of reality; it is an intervention.
  **The Answer You Won't Like:** The procedure refuses to validate this as a "Real" taxonomy node. It classifies it as a **Strategic Intervention**. You cannot treat this as a neutral fact ("This customer *is* Health-Conscious"). You must document it as a policy decision ("We are *treating* this customer as Health-Conscious to induce behavior X").
  **Why this hurts:** Your pricing models likely treat this segment as a "discovered truth" to justify differential pricing. The procedure forces you to admit it is a *manipulation*. Legal needs to sign off not on the definition, but on the *effect*. If the category creates a feedback loop that disadvantages the customer, that is a compliance risk, not a taxonomy error.

  ---

  ### The Limits of the Procedure

  You asked for honesty about where this checklist fails. Here it is.

  **1. The "Who Pays" Problem**
  The OTP assumes the goal is a clean, defensible system. It cannot resolve disputes where the category is actually a budget battle. If Sales wants "Hot Dogs" as a top-level node because they have a vendor rebate tied to that specific P&L line, the OTP will say "Merge into Sandwiches." Sales will ignore you. The procedure identifies the ontological truth, but it does not have the authority to override the financial incentive. In these cases, the "Verdict" becomes **Administrative-Only**, meaning you create the node for their reporting, but you firewall it so it doesn't corrupt the master data.

  **2. The Judgment Call in Disguise**
  Step 3 (Search Intent) relies on a threshold (>20% users). Where does that number come from? That is a judgment call. If you lower it to 5%, more categories become "Real." If you raise it to 50%, fewer do. This is where philosophy sneaks back in. You (the Team Lead) must set the thresholds once and lock them. If you tweak the thresholds to get the answer you want on a specific Tuesday, you have broken the tool.

  **3. The Reflexivity Blind Spot**
  Step 5 identifies performative categories, but it doesn't tell you what to *do* with them other than "Escalate." In reality, most of your business value comes from these categories (e.g., "High Value Customer," "At-Risk Churn"). These are not real; they are self-fulfilling prophecies. The procedure correctly identifies them as unstable, but the business will demand you use them anyway. The OTP protects you by forcing the "Hand-off," ensuring leadership owns the risk, but it won't stop the category from being built.

  **4. The "Nature's Joints" Illusion**
  Finally, be aware that in commerce, there are no "Real" categories. Even "Species" in pet food is a commercial approximation (wolves vs. domestic dogs). The OTP treats "External Anchor" as Real, but that is just outsourcing the metaphysical burden to a regulator. It solves your legal problem, not your philosophical one.

  **Summary:** Use the OTP to clear the low-hanging fruit and to document *why* you are making a compromise. When the procedure says "Hand-off," do not try to solve it yourself. That is the moment the spreadsheet ends and the management begins.
