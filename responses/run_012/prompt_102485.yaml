  ok so im a backend engineer, no formal philosophy background, and i've been going down a rabbit hole on Moloch / races to the bottom after a coworker sent me some blog posts about it (the shoe factory thing, the arms-race examples, the whole bit). here's where im stuck and i feel like im missing something obvious.

  the way i understand it, a race to the bottom is when every party involved would be happier if they all just stopped doing the thing. but they keep doing it because nobody wants to be the first to stop. so to me that's basically a communication problem — if everyone could just see that everyone else also wants out, they'd all agree to stop and it'd be over. in my job it works like this: all the backend teams hated shipping on fridays, so we all got on a call, agreed to stop, and now nobody ships on fridays. problem solved. same deal with the on-call rotation stuff, we just all agreed.

  so my question is why doesnt this work for the big cases? is it just that people are irrational or dont trust each other? and if so, wouldnt the fix be some kind of transparent pledge system, or a referee that everyone opts into? basically i want to know who you actually negotiate with to shut Moloch down, and whether theres a known best practice for it — like a commitment device where everyone stakes something so nobody defects. is there a standard playbook for this, or is it one of those things where the answer is just 'it depends'?
