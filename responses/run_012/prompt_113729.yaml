  **BELDEN RULE (1971)**

  **Policy:** First-person statements of belief are prohibited in straight news copy. Established following the 1971 libel settlement involving former Managing Editor H. Belden, this rule preserves the distinction between reported fact and internal state. While attribution is permitted, the reporter's own cognitive relationship to the facts must remain invisible to the reader. The goal is to ensure that the newspaper speaks with one voice, rather than amplifying the private doubts of individual staff members. We operate under the assumption that a reporter's belief is neither evidence nor news.

  **1. Present Tense Prohibition**
  Do not use "I believe," "I think," or "I feel" to qualify a factual assertion in the present tense. This applies even if the belief is negated or qualified within the same sentence. The presence of the first-person pronoun in conjunction with a cognitive verb suggests the accompanying fact is unverified. We kill "I believe the zoning board took a bribe" because it implies a lack of evidence. We also kill "The zoning board took a bribe, and I don't believe it did," because the reporter's disbelief is irrelevant to the court record. The story must stand on the bribe, not the reporter's skepticism.

  **2. Past Tense Exception**
  First-person belief is permitted in retrospectives or analytical pieces where the reporter's previous state of mind is the subject of the story. "I believed" is acceptable when contrasting past assumption with current knowledge. This is permitted because the belief is framed as a historical artifact, not a current claim to truth. The tension lies between what was thought then and what is known now, which is a valid narrative arc.

  **3. Third-Party Attribution**
  Statements of belief attributed to sources ("She believes") are permitted without restriction, provided the source is identified. The rule applies only to staff bylines. We run "She believes the board took a bribe and it didn't" on page one without a second thought because the cognitive dissonance belongs to the source, not the paper. We report her confusion; we do not harbor our own.

  **4. Sports Column Exception**
  Sports columnists may use "I believe" when expressing confidence in a team's future performance. We accept this as an avowal of commitment rather than a report on the inside of somebody's head. I admit the sports desk exemption is doing work I can't replicate anywhere else in the paper, but the precedent stands.

