prompt: |-
  I'm taking a seminar on the ethics of war, and I keep noticing a pattern that our readings treat as three unrelated topics. Under the law of armed conflict, a combatant who kills enemy soldiers in accordance with the rules is not criminally liable for doing so, and that immunity holds whichever side was in the right — the aggressor's soldier who fights lawfully commits no crime merely by fighting. Yet the same body of law makes aggression a leadership crime: only those who shape a state's decision to go to war can be prosecuted for it, not the people who carry it out. And in the United States, conscientious objector status is available only to those who oppose war as such; a soldier who objects to one particular war as unjust, however sincerely, does not qualify, as the Supreme Court held in 1971. So the law appears to treat the individual soldier's judgment about whether the war should be fought as irrelevant both to what he may lawfully do and to what he may refuse to do.

  What does this arrangement presuppose about the moral standing of the individual combatant? Does it commit the law to the moral equality of combatants, or could reciprocity, the humane treatment of prisoners, soldiers' limited access to information about the justice of the cause, or the state's authority to decide on war do the same work without that thesis? Which rival views does the arrangement actually rule out, and which does it merely fail to accommodate? And are its parts consistent with one another, or does the leadership-crime rule quietly concede something that combatant immunity denies?

  Finally, consider a reform I have heard proposed: permit selective objection, but only where a recognized international body has declared the war illegal. If we adopted it, would we have replaced the presupposed view or simply relocated the same deference to authority? And if we accepted instead the view that a soldier fighting an unjust war is doing something seriously wrong, what in this arrangement would have to change?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Context:** A seminar on the ethics of war.
      *   **Observation:** Three legal doctrines seem disconnected but share a pattern:
          1.  *Combatant Immunity:* Lawful killing by soldiers is not a crime, regardless of *jus ad bellum* (justice of war).
          2.  *Crime of Aggression:* Only leaders are liable for starting an unjust war, not soldiers.
          3.  *Conscientious Objection (US):* Only universal objection to war counts; selective objection (to a specific war) does not.
      *   **Core Insight:** The law treats the individual soldier's judgment about the *justice of the war* as irrelevant to both their permissions (what they can do) and their obligations (what they must do/refuse).
      *   **Questions to Answer:**
          1.  What does this presuppose about the moral standing of the individual combatant?
          2.  Does it commit the law to the "moral equality of combatants" (MEC), or can other factors (reciprocity, humane treatment, epistemic limits, state authority) explain it without MEC?
          3.  Which rival views does it rule out vs. merely fail to accommodate?
          4.  Are the parts consistent, or does the leadership-crime rule contradict combatant immunity?
          5.  Evaluate the proposed reform (selective objection only if an international body declares war illegal): Does it replace the presupposed view or relocate deference?
          6.  If we accepted the view that fighting an unjust war is seriously wrong, what would have to change in the current arrangement?

  2.  **Analyze Question 1: Moral Standing of the Combatant:**
      *   The law treats soldiers as *instruments* of the state rather than independent moral agents regarding *ad bellum* decisions.
      *   They are "privileged belligerents."
      *   Presupposition: Soldiers lack the standing, authority, or epistemic capacity to judge the war's justice. Their moral sphere is restricted to *jus in bello* (conduct in war).
      *   This creates a "division of moral labor."

  3.  **Analyze Question 2: Moral Equality of Combatants (MEC) vs. Alternatives:**
      *   *MEC (Walzerian):* Soldiers on both sides have equal right to kill and equal liability to be killed, regardless of the war's justice.
      *   *Does the law commit to MEC?* On the surface, yes (Combatant Immunity).
      *   *Alternative Explanations:*
          *   *Reciprocity/Pragmatism:* If we punish aggressor soldiers, defender soldiers will be punished if they lose. Better to immunize all to encourage compliance with *in bello* rules.
          *   *Epistemic Limits:* Soldiers can't know the complex diplomatic reasons for war.
          *   *State Authority:* The state holds the monopoly on violence; soldiers are agents of the state.
      *   *Conclusion:* The *legal* structure doesn't necessarily commit to the *moral truth* of MEC. It can be justified by pragmatic/administrative reasons (epistemic limits, reciprocity) even if morally, one side is wrong. However, the *leadership crime* element complicates this.

  4.  **Analyze Question 3: Rival Views (Ruled Out vs. Not Accommodated):**
      *   *Ruled Out:* "Revisionist Just War Theory" (e.g., Jeff McMahan). This view holds that unjust combatants have no right to kill and are morally liable to attack. The law explicitly rejects this by granting immunity to aggressor soldiers.
      *   *Ruled Out:* Individual moral discretion to refuse specific wars (currently).
      *   *Not Accommodated (but not strictly ruled out):* A system where soldiers *could* be liable but we choose not to prosecute for pragmatic reasons. The law *could* accommodate a moral distinction without changing the immunity, but the *leadership crime* suggests the law acknowledges the war *can* be criminal, just not the soldier's participation.
      *   *Nuance:* The law rules out the idea that the soldier is a full moral agent regarding *ad bellum*.

  5.  **Analyze Question 4: Consistency (Immunity vs. Leadership Crime):**
      *   *Tension:* If aggression is a crime, how can carrying it out be immune?
      *   *Standard Defense:* "Superior Orders" / Agency. The leader is the mind; the soldier is the hand.
      *   *Inconsistency?* If the war is criminal, the acts constituting the war (killing) seem tainted. But the law separates the *decision* to fight from the *fighting*.
      *   *Quiet Concession:* The leadership crime *does* concede that the war itself has moral/legal weight. It undermines pure MEC by admitting one side is legally "wrong" at the macro level, even if the micro level (soldiers) is equalized. It suggests the soldier's immunity is a *privilege* granted by law, not a *right* derived from moral innocence.

  6.  **Analyze Question 5: Proposed Reform (Selective Objection + International Body):**
      *   *Proposal:* Allow selective objection *if* the UN/ICC says the war is illegal.
      *   *Effect:* Shifts judgment from individual conscience to international authority.
      *   *Relocating Deference:* Yes. Instead of deferring to the *national* state, the soldier defers to the *international* body. It doesn't grant the soldier independent moral judgment; it grants them the right to align with a higher authority.
      *   *Does it replace the presupposed view?* No. It still denies the soldier the standing to judge for themselves. It maintains the "epistemic limitation" argument but changes the source of truth.

  7.  **Analyze Question 6: If Fighting an Unjust War is Seriously Wrong (Revisionist View):**
      *   *Premise:* Accept McMahan's view (Unjust combatants are morally liable/criminals).
      *   *Required Changes:*
          1.  *End Combatant Immunity for Aggressors:* Aggressor soldiers could be prosecuted for murder.
          2.  *End Moral Equality:* Defender soldiers have right to kill; aggressor soldiers do not.
          3.  *Expand Conscientious Objection:* Selective objection becomes a right/duty.
          4.  *Leadership Crime:* Becomes less distinct; if the act is murder, leaders are accomplices, but soldiers are principals.
          5.  *POW Status:* Might be denied to unjust combatants (though pragmatically dangerous).
      *   *Pragmatic Check:* This would likely collapse the LOAC (Law of Armed Conflict) because aggressors would have no incentive to follow *in bello* rules if they are criminals anyway.

  8.  **Synthesize and Structure:**
      *   *Introduction:* Acknowledge the sophistication of the observation. It touches on the "Separation Thesis" (Walzer) vs. Revisionism.
      *   *Section 1: Moral Standing.* The soldier as an instrument/agent of the state. Epistemic humility.
      *   *Section 2: MEC vs. Pragmatism.* The law mimics MEC but might rest on pragmatic grounds (reciprocity, compliance).
      *   *Section 3: Consistency/Tension.* The Leadership Crime creates a fissure. It admits the war can be criminal, making soldier immunity a legal fiction/pragmatic shield rather than moral absolution.
      *   *Section 4: The Reform.* Relocating deference, not empowering the individual.
      *   *Section 5: The Revisionist Challenge.* If unjust fighting is wrong, the whole LOAC architecture (Immunity, POW status, CO rules) collapses or requires radical transformation.
      *   *Conclusion:* The current arrangement is a pragmatic compromise that prioritizes order and humanitarian protection over retributive justice regarding *ad bellum*.

  9.  **Refine the Argument (Self-Correction/Nuance):**
      *   *Correction:* Be careful not to say the law *is* moral. It's a legal regime. Distinguish between legal liability and moral liability.
      *   *Nuance on Leadership Crime:* The crime of aggression is about *planning/preparing*, not just fighting. This helps explain the separation. The soldier fights; the leader plans.
      *   *Nuance on CO:* The US Supreme Court case is *Gillette v. United States*. Mentioning it adds precision.
      *   *Key Philosophical Reference:* Michael Walzer (*Just and Unjust Wars*) vs. Jeff McMahan (*Killing in War*). This is the underlying philosophical debate.

  10. **Final Polish:** Ensure tone is appropriate for a seminar context (analytical, rigorous, engaging with the questions directly). (Drafting the response based on these points.)
answer: |-
  This is a remarkably sharp observation that cuts to the heart of the tension between **Traditional Just War Theory** (often associated with Michael Walzer) and **Revisionist Just War Theory** (associated with philosophers like Jeff McMahan). Your seminar readings are likely treating these as separate doctrinal silos (LOAC, International Criminal Law, Domestic Conscription Law), but you have correctly identified that they form a coherent, mutually reinforcing architecture regarding the individual soldier.

  Here is an analysis of the presuppositions, consistency, and implications of the arrangement you describe.

  ### 1. The Moral Standing of the Individual Combatant
  The arrangement presupposes that the individual combatant is **not a full moral agent regarding *jus ad bellum* (the justice of going to war).**

  Legally and structurally, the soldier is treated as an **instrument of the state**. This rests on two key assumptions:
  *   **Epistemic Limitation:** Soldiers are presumed incapable of accessing the classified intelligence, diplomatic context, and legal reasoning required to judge the war's justice. Therefore, requiring them to judge it would be unjust.
  *   **Division of Moral Labor:** The moral burden of the war's justice is assigned exclusively to the political leadership. The soldier's moral sphere is restricted entirely to *jus in bello* (conduct in war).

  By granting immunity regardless of the side, and denying selective conscientious objection, the law constructs a "status-based" morality. You are a combatant; therefore, you have the privilege to kill and the liability to be killed, independent of the cause you serve. Your individual conscience is legally irrelevant to the justice of the conflict.

  ### 2. Moral Equality of Combatants (MEC) vs. Pragmatic Alternatives
  Does this commit the law to the **Moral Equality of Combatants** (the thesis that soldiers on both sides have an equal right to kill and equal liability to be killed)?

  **Superficially, yes.** The law operates *as if* MEC is true. However, the legal regime does not necessarily commit to MEC as a *moral truth*. It can be justified by three alternative pillars that do not require believing aggressor soldiers are morally innocent:

  1.  **Reciprocity and Incentive:** If aggressor soldiers knew they would be prosecuted for murder simply for fighting, they would have no incentive to follow the rules of war (*jus in bello*). Granting immunity encourages compliance with humanitarian norms (e.g., treating POWs well) by ensuring that following the rules offers legal protection.
  2.  **Epistemic Humility:** As noted above, the law assumes soldiers cannot know the truth. Therefore, treating them as equals is a procedural necessity, not a moral endorsement.
  3.  **State Authority:** Under the Westphalian system, the state holds the monopoly on legitimate violence. If the state commands it, the act is legally "public" rather than "private."

  **Conclusion:** The law mimics MEC but could theoretically rest on pragmatic grounds. However, the **Crime of Aggression** complicates this. If aggression is a crime, it implies one side is legally "wrong." If the war is criminal, how can the acts constituting the war (killing) be immune? This suggests the law adopts MEC not because it believes it is morally true, but because it is the only way to maintain a functional system of warfare regulation.

  ### 3. Consistency: Immunity vs. Leadership Crime
  You ask if the parts are consistent or if the leadership-crime rule concedes something combatant immunity denies.

  **There is a deep tension here.**
  *   **Combatant Immunity** says: "The killing you did is not a crime."
  *   **Crime of Aggression** says: "The war you fought in was a crime."

  Standard legal theory resolves this via the **principle of agency**: The leader is the "mind" and the soldier is the "hand." The criminality lies in the *initiation* of the conflict, not the *execution* of hostilities (provided they are lawful).

  However, this is a fragile distinction. It implies that the soldier's immunity is a **legal privilege**, not a **moral right**. The law effectively says: *"We know this war might be criminal, and we know you are participating in that criminal enterprise, but we will not prosecute you for policy reasons."*

  This arrangement **rules out** the Revisionist view (that unjust combatants are morally liable to attack and have no right to kill). It **fails to accommodate** the view that soldiers have a duty to investigate the justice of the war. It does not necessarily rule out the idea that soldiers *are* morally culpable but legally immune (a pragmatic shield), but it definitely rules out the idea that they are legally culpable.

  ### 4. The Proposed Reform: Selective Objection via International Body
  The proposal is: *Permit selective objection, but only where a recognized international body (e.g., UN Security Council, ICC) has declared the war illegal.*

  **Does this replace the presupposed view?**
  No. It **relocates the deference.**
  *   **Current System:** Soldier defers to the **National State**. (If the State says fight, you fight.)
  *   **Proposed System:** Soldier defers to the **International Authority**. (If the UN says illegal, you refuse.)

  In neither case is the soldier granted the standing to judge the war for themselves. The presupposition that the individual soldier lacks the epistemic or moral authority to determine *jus ad bellum* remains intact. The "conscience" is still not the final arbiter; an external authority is. This avoids the chaos of every soldier becoming a general, but it fails to empower the individual moral agent.

  ### 5. If Fighting an Unjust War is Seriously Wrong (The Revisionist Challenge)
  If we accepted the Revisionist view (that a soldier fighting an unjust war is committing a moral wrong akin to murder, lacking the right to kill), the current legal arrangement would have to collapse or change radically:

  1.  **End of Combatant Immunity for Aggressors:** Soldiers fighting for the aggressor state could be prosecuted for murder or manslaughter by the victor. The "privileged belligerent" status would vanish for the unjust side.
  2.  **Expansion of Conscientious Objection:** Selective conscientious objection would not just be permitted; it might be a **moral duty**. The law would need to protect those who refuse to fight unjust wars, likely requiring a mechanism for soldiers to petition against deployment based on *ad bellum* concerns.
  3.  **Asymmetric Liability:** The "Moral Equality" would be replaced by "Moral Asymmetry." Just combatants have a right to kill; unjust combatants do not. This would fundamentally alter the rules of engagement and the status of Prisoners of War (POWs). If unjust combatants are essentially criminals, do they deserve POW protections? (Most Revisionists argue they still do for pragmatic reasons, but the theoretical basis shifts).
  4.  **Re-evaluation of Leadership Crime:** If the soldiers are liable for murder, the leadership crime becomes less distinct. Leaders would be accomplices to mass murder, rather than perpetrators of a distinct "crime against peace."

  ### Summary for Your Seminar
  The pattern you noticed is the **Legal Separation Thesis**. It separates *jus ad bellum* from *jus in bello* at the individual level to preserve the functionality of the Law of Armed Conflict.

  *   **Presupposition:** Soldiers are state instruments, not independent moral judges of war.
  *   **Consistency:** It is pragmatically consistent but morally tense. The Crime of Aggression admits the war can be criminal, while Immunity pretends the fighting is not.
  *   **Reform:** Moving selective objection to an international body keeps the soldier subordinate to authority; it does not grant moral agency.
  *   **Implication:** To accept that fighting an unjust war is inherently wrong requires dismantling the concept of "privileged belligerency" entirely, which risks making wars more brutal (as unjust combatants would have no incentive to follow rules if they are criminals anyway).

  The law chooses **order and humanitarian protection** (by treating soldiers equally) over **retributive justice** (by punishing unjust soldiers). Your observation reveals that this choice requires suppressing the individual soldier's moral judgment about the cause.
