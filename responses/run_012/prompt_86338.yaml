answer: |-
  You're right to be suspicious. Your intuition is tracking correctly: the summary gets the surface-level math right but glosses over the theoretical machinery, makes a factual error on the probabilities, and conflates a few distinct decision-theoretic lessons into a "rationalist soup."

  Here is the claim-by-claim breakdown, followed by an explanation of where the actual "joints" of the problem are.

  ### 1. The Math and Probabilities
  **Claim:** *"Continues with probability 2/3... earns him an expected 4/3, better than always continuing (1) or always turning off (0)."*
  **Verdict:** **Correct.**
  The algebra holds. If $p$ is the probability of continuing:
  $$EU = p \cdot [(1-p) \cdot 4 + p \cdot 1] = 4p - 3p^2$$
  Maximizing this yields $p = 2/3$ and $EU = 4/3$. This beats $p=1$ (payoff 1) and $p=0$ (payoff 0).

  **Claim:** *"Since he turns off with probability 1/3, he makes it to the good outcome about a third of the time."*
  **Verdict:** **Wrong.**
  This is a basic probability error. To get the good outcome (Exit 2), you must *reach* the second intersection AND *turn*.
  *   Probability of reaching Intersection 2 = $2/3$ (you must continue at Int 1).
  *   Probability of turning at Intersection 2 = $1/3$.
  *   Total probability of good outcome = $(2/3) \times (1/3) = 2/9$.
  $2/9$ is roughly 22%, not 33%. The blogger confused the conditional probability of turning with the joint probability of succeeding.

  ### 2. The "Real World" Dismissal
  **Claim:** *"A real driver would leave himself a note or check his phone and the whole thing dissolves."*
  **Verdict:** **Trivializing.**
  This misses the point of the thought experiment. AMD isn't about navigation; it's about **information states**. The constraint is that the agent *cannot* distinguish the nodes. Adding memory or external tools changes the problem into a trivial one, just as saying "a real agent in Newcomb's Problem would just open both boxes" misses the point of the predictor. Dismissing the constraint dismisses the theory.

  ### 3. The "Contradictory Advice"
  **Claim:** *"If you reason act by act, at the first intersection you should obviously continue... and at the second you should obviously turn off... and if you did that you'd earn 4... So expected utility maximization gives contradictory advice here."*
  **Verdict:** **Wince / Misleading.**
  This is the sloppiest part of the summary.
  *   **The Error:** You *cannot* reason act-by-act differently at the two intersections because, by premise, you are in the exact same information state at both. You cannot say "If I'm at 1 I do X, if I'm at 2 I do Y" because you don't know which one you're at.
  *   **The Real Tension:** The tension isn't that EU gives contradictory advice; it's that there is a conflict between the **Ex-Ante Perspective** (planning at home) and the **Ex-Interim Perspective** (deciding at the intersection).
      *   *Ex-Ante:* You choose a policy ($p=2/3$).
      *   *Ex-Interim:* You arrive at an intersection. You might try to update your belief about whether this is Int 1 or Int 2. If you update your beliefs based on the fact that you are *at* an intersection, your calculation of the optimal $p$ might shift.
  *   **The Conclusion:** EU maximization does not contradict itself if you define the "act" as **choosing a policy**. It only seems contradictory if you try to maximize utility locally at the node without respecting the logical constraint that your decision here *is* your decision there.

  ### 4. The Jump to UDT and Newcomb
  **Claim:** *"Why people say this is really just Newcomb's problem in disguise and that what you need is something like UDT."*
  **Verdict:** **Partially Correct, but Overstated.**
  *   **Newcomb Connection:** It is *not* Newcomb's Problem in disguise. Newcomb involves an external predictor simulating you. AMD involves **self-locating uncertainty** and **logical correlation across time**. In AMD, your decision at Int 1 is logically correlated with your decision at Int 2 because it's the *same algorithm* running twice. In Newcomb, the correlation is causal/evidential via a predictor. They are cousins, not twins.
  *   **UDT Necessity:** You do not strictly *need* UDT to solve this. You can solve AMD with standard Causal Decision Theory (CDT) **if** you treat the choice as selecting a global policy rather than a local action. However, UDT (and TDT) makes this natural by design. UDT says "choose the output of your algorithm," which automatically enforces the policy constraint. The blogger is right that UDT handles it elegantly, but wrong to imply standard decision theory *breaks* here. Standard theory breaks only if you naively apply it to local actions without accounting for the logical link between your temporal selves.

  ### 5. The Precommitment Lesson
  **Claim:** *"He'd do even better if he could commit to a plan in advance... don't ask what to do, ask what kind of agent to be."*
  **Verdict:** **Correct.**
  This is the solid takeaway. The "planning self" (at home) has more power than the "acting self" (at the intersection) because the planning self can bind the acting self to a mixed strategy. The acting self, if it tries to re-optimize based on its limited local information, might be tempted to deviate (e.g., "I'm probably at the second intersection, I should turn!"), which ruins the plan.

  ---

  ### Where the Actual Joints Are

  You mentioned you keep going in circles. That usually happens because there are two distinct puzzles tangled together here. The blogger mashed them up. Here is how to separate them:

  #### Joint 1: Policy vs. Action (The Easy Joint)
  If you accept that your decision at Intersection 1 *must* be the same as your decision at Intersection 2 (because you can't tell them apart), the problem is trivial. You just maximize $4p - 3p^2$.
  *   **Lesson:** Always optimize over policies (strategies), not atomic actions, when your actions are logically constrained.
  *   **Blogger's Mistake:** They implied this is hard or requires UDT. It doesn't. It just requires defining the decision variable correctly.

  #### Joint 2: Belief Updating (The Hard Joint)
  This is the part the blogger glossed over, and it's where the "contradiction" actually lives.
  When you arrive at an intersection, should you update the probability that you are at Intersection 1 vs. Intersection 2?
  *   If you plan to continue with $p=2/3$, you visit Int 1 100% of the time and Int 2 66% of the time.
  *   So, given that you are *at* an intersection, the odds are 3:2 that it is the first one. (Probability Int 1 = $3/5$).
  *   **The Paradox:** If you use these updated odds ($3/5$) to calculate expected utility *at the intersection*, do you still want to choose $p=2/3$?
      *   Piccione & Rubinstein (who invented the problem) argued that if you update your beliefs this way, you might calculate a different optimal $p$ at the intersection than you did at home.
      *   If your optimal $p$ changes once you arrive, you are **time-inconsistent**. Your future self will want to violate the plan your past self made.
  *   **The Resolution:** This is where UDT/Updatelessness actually matters. To solve AMD robustly, you must refuse to update on the fact that you have arrived at an intersection. You must reason as if you are still "at home" choosing the policy. If you update on your location, you introduce a conflict between your past and future selves.

  ### Summary of Trustworthiness

  1.  **Trust:** The optimal mix ($2/3$), the value ($4/3$), and the general lesson about precommitment/policy selection.
  2.  **Discard:** The probability of success ($2/9$, not $1/3$), the claim that real-world notes dissolve the theoretical problem, and the claim that EU maximization is inherently contradictory.
  3.  **Treat with Caution:** The UDT/Newcomb claim. It's true that UDT solves it cleanly, but it's not the *only* way, and the analogy to Newcomb is imprecise. The real issue is **updatelessness** regarding self-locating beliefs, not prediction.

  **The Bottom Line:** The puzzle isn't that you can't distinguish the intersections. The puzzle is that **arriving at an intersection gives you evidence about where you are, but acting on that evidence undermines the policy that got you there.** The rational move is to ignore the evidence (stay updateless) and stick to the policy chosen from the prior state. The blogger sensed this but muddled the explanation.
