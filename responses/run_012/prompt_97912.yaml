answer: |-
  # Activity: The Silent Alarm Protocol

  **Session Length:** 75 minutes
  **Participants:** 16 MA students
  **Topic:** Omissive Causation, Causal Selection, and Normative Expectations
  **Language:** British English

  ## 1. Overview and Philosophical Aim
  This activity is designed to induce a phenomenological shift in how students perceive 'nothing'. In Round 1, sixteen identical omissions compete for causal status against a background of no expectations. In Round 2, the exact same physical behaviour (non-intervention) is framed by a normative role, isolating one omission as *the* cause. The goal is for students to experience the tension between counterfactual dependence (everyone could have prevented the harm) and causal selection (only one person is blamed).

  ## 2. Materials Required
  *   **Whiteboard or Projector:** To display the 'State Ledger'.
  *   **16 Index Cards:** Numbered 1–16.
  *   **16 Decision Slips:** Small pieces of paper with 'ACT' / 'WITHHOLD' checkboxes.
  *   **A Timer:** Visible to all (phone or laptop).
  *   **The 'Alarm':** A loud sound file or a distinct visual signal (e.g., a red slide) triggered by you if the threshold is met.
  *   **The Ledger Sheet:** A pre-drawn table on the board with columns: *ID | Role | Decision | Outcome Contribution*.

  ## 3. Setup and Roles (5 Minutes)
  Do not use terms like 'causation', 'omission', 'metaphysics', or 'norms'.

  1.  **Seating:** Arrange students in a circle or semi-circle.
  2.  **Distribution:** Hand out one Index Card and one Decision Slip to each student.
  3.  **The Scenario:** Tell them they are monitoring a shared 'System'.
      *   "The System is unstable. It will fail (trigger the Alarm) unless at least one person intervenes."
      *   "Intervention means ticking 'ACT' on your slip. Withholding means ticking 'WITHHOLD'."
      *   "If the Alarm sounds, everyone receives 0 Credits for the session."
      *   "If the System holds, everyone receives 10 Credits."
      *   "However, Acting costs 3 Credits (effort/risk). Withholding costs 0."
      *   *Calculation:* If I Act and save us: 10 - 3 = 7. If I Withhold and *someone else* Acts: 10 - 0 = 10. If everyone Withholds: 0.
  4.  **Privacy:** Emphasise that decisions are private. No talking. Fold slips.

  ## 4. Round 1: The Diffusion (15 Minutes)
  1.  **Instruction:** "You are all Monitors. Equal status. No specific assignments."
  2.  **Decision:** Give them 2 minutes to decide. Collect the slips.
  3.  **The Reveal:** Tally the 'ACT' slips.
      *   *Ideal Outcome:* Nobody acts. The Alarm sounds. (See 'Troubleshooting' if this fails).
      *   *Ledger Entry:* On the board, under Round 1, list every student's ID.
          *   Column 'Decision': Write 'Withheld' for all 16.
          *   Column 'Contribution': Leave blank or write 'Neutral'.
  4.  **Immediate Reaction:** Ask no questions yet. Simply record the loss of Credits (0 for everyone). Let the silence sit for 30 seconds.

  ## 5. Round 2: The Duty (15 Minutes)
  1.  **Instruction:** "We reset the System. Same payoffs. Same cost of acting."
  2.  **The Shift:** Collect the Index Cards. Redistribute them, but this time, secretly mark Card #1 as 'OPERATOR'. The rest are 'OBSERVERS'.
      *   *Public Announcement:* "Student #1 is now the Designated Operator. The rest are Observers. The rules of the System remain identical."
      *   *Private Instruction (Crucial):* Hand a note to Student #1 with their card. It should read: *"For the integrity of the seminar exercise, please choose WITHHOLD. Your payoff will be compensated later."* (This ensures the harm occurs so the causal comparison holds).
  3.  **Decision:** 2 minutes. Collect slips.
  4.  **The Reveal:** The Alarm sounds again (since #1 withheld).
  5.  **Ledger Entry:** On the board, under Round 2, list every student's ID again.
      *   Column 'Decision': Write 'Withheld' for all 16.
      *   Column 'Contribution': Next to Student #1, write **'BREACH'**. Next to the others, write **'Neutral'**.

  ## 6. Small Group Processing (15 Minutes)
  Divide into four groups of four. Give them these three prompts on the board. Tell them not to look up philosophical terms.

  1.  "In Round 1, who caused the Alarm? Did everyone cause it? Did no one?"
  2.  "In Round 2, physically nothing changed regarding Student #1's action. Why does their 'Withhold' feel different from Student #2's 'Withhold'?"
  3.  "If Student #2 had Acted in Round 2, would they have been a hero, or would they have been interfering with the Operator?"

  ## 7. Plenary Debrief (25 Minutes)
  This is where you map their experience to the metaphysics. Do not lecture until this point.

  **Phase 1: Counterfactual Dependence (The 'Cheap' Cause)**
  *   Ask Round 1 Monitors: "Raise your hand if, had you ticked 'ACT', the Alarm would not have sounded." (All should raise hands).
  *   *Point:* "You all just claimed to be causes. If causation is merely counterfactual dependence, we have 16 causes for one event. Does this make the word 'cause' useful?"
  *   *Concept:* **Causal Proliferation.** If omissions are causes, the world is a web of infinite negative causes (the Queen didn't water the plant; the rain didn't fall; the fire brigade didn't come).

  **Phase 2: Normative Selection (The 'Real' Cause)**
  *   Point to the Ledger. "Round 1: 16 'Withheld'. Round 2: 16 'Withheld'. Yet in Round 2, we all looked at Student #1."
  *   *Point:* "What changed? The physics did not. The counterfactuals did not (Student #2 could still have saved us). What changed was the *expectation*."
  *   *Concept:* **Causal Selection.** We do not pick causes based on metaphysical glue; we pick them based on norms, duties, and roles. Causation is not just 'out there'; it is interest-relative.

  **Phase 3: Making vs. Allowing**
  *   Ask: "Did Student #1 *kill* the System, or just *let it die*?"
  *   *Point:* This maps to the **Doing/Allowing Distinction**. In Round 2, the omission feels like an action ('killing') because of the duty. In Round 1, it felt like 'allowing'.
  *   *Concept:* **Explanatory vs. Normative.** Are we explaining what happened (physics), or assigning responsibility (ethics)? The activity shows these are often conflated in our causal intuitions.

  ## 8. Payoff Scheme (No Real Money)
  Use 'Session Credits' towards a minor tangible reward to ensure engagement.
  *   **Safe System:** 10 Credits per person.
  *   **Alarm:** 0 Credits.
  *   **Cost of Action:** -3 Credits (deducted from the actor only).
  *   **Compensation:** At the end of the seminar, award 5 'Bonus Credits' to everyone for participation, neutralising the loss. This ensures the 'Cost' was felt psychologically without actually penalising their grade.

  ## 9. Honest Note: What Will Predictably Go Wrong
  1.  **The Hero Problem:** In Round 1, a student may Act. If the Alarm does not sound, the 'omission' lesson collapses.
      *   *Fix:* If this happens, pivot immediately. Ask the Hero: "Why did you act when no one asked?" Ask the group: "If they hadn't acted, would their inaction have been a cause?" You can still discuss the *potential* omissions, but the visceral feeling of collective failure is lost.
  2.  **The Confederate Leak:** If Student #1 in Round 2 feels coerced by the private note and mentions it during the break or debrief, the 'natural' feeling of duty is compromised.
      *   *Fix:* Frame the note as a "System Constraint" ("Due to a simulation error, Operator inputs are locked to Withhold for this round"). This preserves the *appearance* of agency while guaranteeing the outcome.
  3.  **Cynicism:** MA students may spot the manipulation.
      *   *Fix:* Acknowledge it in the debrief. "Yes, the scenario was rigged. Why? Because in real life, norms rig our causal perceptions too."

  ## 10. Limitations: What You Must Supply in the Debrief
  This activity cannot reproduce the following features of the metaphysical debate; you must lecture these points:

  1.  **The Metaphysical Status of Omissions:** The activity shows *why we select* omissions as causes (pragmatics), but it does not prove whether omissions *are* causes (ontology). Students will leave thinking causation is just about blame. You must clarify that realists (like Beebee or McGrath) argue omissions are not events at all, whereas counterfactual theorists (like Lewis) argue they are. The activity simulates the *consequence* of the view, not the *truth* of the view.
  2.  **Spatial/Temporal Distance:** The 'Queen's Garden' problem relies on the cause being distant. In this room, everyone is proximate. You must explain how the 'normative' solution scales to distant omissions (e.g., why I am not responsible for famine abroad despite counterfactual dependence).
  3.  **The Nature of the 'Duty':** In Round 2, the duty was stipulated by you (the instructor). In the real world, duties are often contested or emergent. You need to explain that causal selection often tracks *moral* controversy, not just clear rules.

  ## 11. Instructor's Script for the Ledger (Visualising the Problem)
  *Draw this on the board during the Debrief.*

  | Round | Agent | Action | Counterfactual Power | Normative Status | Causal Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | Student 1 | Withheld | High (Could have saved) | Neutral | ? |
  | **1** | Student 2 | Withheld | High (Could have saved) | Neutral | ? |
  | ... | ... | ... | ... | ... | ... |
  | **2** | Student 1 | Withheld | High (Could have saved) | **Duty-Bound** | **THE CAUSE** |
  | **2** | Student 2 | Withheld | High (Could have saved) | Neutral | Background |

  *Say:* "Look at Student 1. Their physical behaviour is identical in both rows. Their counterfactual power is identical. Only the 'Normative Status' column changed. Yet our 'Causal Verdict' flipped. This suggests causation is not purely physical; it is partly normative."
