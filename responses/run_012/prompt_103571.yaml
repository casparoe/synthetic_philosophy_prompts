  You've put your finger on precisely the thorniest issue in the whole programme, and I'd be a fool to pretend it isn't. You're quite right that the choice of metric is inherently normative; deciding whether we measure GDP, median welfare, or a composite of footfall and air quality is a value judgement, not a factual one. But that is precisely why the voting stage exists. The split isn't between 'important things' and 'trivial things', it's between aggregating preferences and aggregating information. When the polity votes on the metric, they are deciding whose losses count. If the disabled resident is left out of that equation, that is a failure of the democratic voting stage, not the betting market. The market's job is merely to say, 'Given this definition of success, how likely is policy X to achieve it?' It doesn't decide who matters; it only calculates the odds of satisfying the criteria we've already agreed upon. The fact/value split survives because the market is blind to justice; it only sees truth. Justice is the voter's job.

  As for gaming the metrics, Goodhart's Law is a serious concern, I'll grant you. But consider the alternative. In our current system, politicians game metrics all the time—moving air quality sensors, massaging employment figures—without any financial penalty for being wrong. In a futarchy, if a council moves a sensor to inflate the reading, you'd structure the market contract to pay out on verified outcomes, perhaps via randomised audits or longer-term health data rather than immediate sensor readings. More importantly, prediction markets attract arbitrageurs who profit from spotting manipulation. If everyone knows the sensors are being moved, the market price will reflect the *actual* air quality, not the *reported* figure, provided the contract is written to reward truth-telling. It's not immune to corruption, but it forces the corruption to be priced in, whereas now it's simply hidden.
