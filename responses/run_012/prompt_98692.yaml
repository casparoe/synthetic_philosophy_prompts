  So I can't tell what rule she's actually running. Here's what I want. If I sit her down and show her a bee swarm — thousands of bees acting like one animal — does she say it's a thing? What about a virus, which isn't alive but is basically a nasty little machine? A hurricane? A Portuguese man o' war, which looks like one animal but is really a colony of tiny ones stuck together? A lichen, which is a fungus and an alga living as one body? And the bacteria inside her own cat's gut — are those part of the cat-thing, or seperate things just sitting inside it?

  I don't care much about the yes/no answers on their own. What I want is the candidate rules that fit everything she's already said, what each one predicts about the swarm, the virus, the hurricane, the man o' war, the lichen, and the gut bacteria, which rule I should actually bet on and why, and — if I only get to ask her about one more case — which single case would do the most to settle it. Also tell me if any of the earlier verdicts I listed are actually inconsistent with each other, cause I might've misremembered one.
