  2. It is distinct from displacement because the total population under control grows instead of moving, and it differs from straightforward failure because the original goal of reducing severe punishment is technically met while overall surveillance increases.
  3. This is not merely a statistical artifact from redefined counting because the individuals processed are genuinely new to the system, such as students receiving conferences for behavior that previously warranted only a verbal warning.
  4. The label still applies even when the newly caught people are genuinely better off, as the core sociological concern is the expansion of institutional authority over a larger segment of the population.
  5. Boundaries blur if the process is entirely voluntary and unrecorded, but if participation is required to avoid worse penalties, it remains net widening regardless of the lighter touch.
