answer: |-
  ### Scratch Brainstorming (Internal Memo)

  **The Crux:** The students' biggest failure mode will be conflating *ontology* (what exists) with *explanation* (how we account for it). They'll think "Naturalism = Crane" and "Emergence = Skyhook." That's wrong. You can be a thoroughgoing materialist and still use a skyhook if you assert an identity or a threshold that does explanatory work without showing the gears.

  **The Trap:** Programme (a) is the killer. It sounds like reductionism ("Consciousness IS information integration"), but the clause "asking for a mechanism... is a category error" makes it an explanation-stopper. That's a skyhook disguised as an identity claim. If they miss that, they fail the question.
  Programme (b) is the standard "strong emergence" target. Easy to spot as a skyhook if they know Dennett.
  Programme (c) is the "Greedy Reductionism" trap. It claims to be a crane (neurons do the work), but if it deletes the higher-level patterns (beliefs) without showing how they emerge as real patterns, it's a *broken* crane (greedy).

  **The Meta-Question:** Is "Crane vs. Skyhook" just a fancy way of saying "Show your working"? Essentially, yes. But the value is in spotting when a theory claims to be naturalistic while secretly relying on a free lunch. The distinction works if it forces mechanistic steps; it fails if it becomes a mere insult ("Your crane isn't tall enough!").

  **Taxonomy Check:**
  (a) Ontological Naturalist / Explanatory Skyhook (Identity Stopper).
  (b) Ontological Naturalist / Explanatory Skyhook (Brute Threshold).
  (c) Ontological Naturalist / Explanatory Crane (but potentially Greedy).
  *Verdict:* The taxonomy holds. (a) and (b) are skyhooks for different reasons; (c) is the only candidate for a crane, but needs qualification.

  ***

  ### Exam Question: Philosophy of Science (Final Year Seminar)

  **Time Allowed:** 60 Minutes
  **Marks:** 20

  **Question 1**

  The fictional *Speculative Cognitive Science Unit* (SCSU) proposes three research programmes regarding consciousness:

  *   **(a)** Consciousness *is* information integration. To ask for a mechanism underlying this identity is a category error; the integration constitutes the explanation.
  *   **(b)** Consciousness is an emergent property arising at a specific complexity threshold. No further decomposition of this property is possible or needed.
  *   **(c)** The system is "just" neurons firing. Talk of beliefs and desires is a useful fiction that could, in principle, be deleted without explanatory loss.

  **Part A:** Using Dennett's distinction between *Cranes* and *Skyhooks*, analyse these three programmes. Specifically, determine whether each programme places the "skyhook" in the **ontology** (what exists) or in the **explanation** (how we account for capacities). Explain why Programme (a) might be considered a skyhook despite its reductive language. (12 marks)

  **Part B:** Critically evaluate the Crane/Skyhook distinction itself. Is it a robust tool for diagnosing "greedy reductionism," or is it merely a rhetorical device for demanding mechanisms? (8 marks)

  ***

  ### Model Answer

  The Crane/Skyhook distinction is not primarily about what exists (ontology), but about how explanatory work is done (leverage). A crane lifts heavy loads using other heavy things (prior steps, mechanisms); a skyhook hangs from nothing, providing lift without support. All three SCSU programmes are ontologically naturalistic—none posit non-physical substances. The distinction lies in whether they offer explanatory leverage or explanation-stoppers.

  Programme (b) is the paradigmatic skyhook. By asserting a "complexity threshold" where decomposition stops, it treats emergence as a brute fact. It claims naturalism but offers no account of *how* complexity generates consciousness, only *that* it does. The skyhook is in the explanation: the threshold does the work without gears.

  Programme (a) is the subtler skyhook. It uses reductive language ("Consciousness *is*..."), tempting students to classify it as a crane. However, by declaring further mechanistic inquiry a "category error," it functions as an explanation-stopper. It asserts an identity without showing the constructive steps that validate it. Like (b), the skyhook is in the explanation: it re-labels the mystery rather than solving it. It claims the "what" is settled to avoid answering the "how."

  Programme (c) attempts to be a crane by grounding phenomena in neurons. However, it risks "greedy reductionism." If it deletes higher-level patterns (beliefs) without demonstrating how those patterns are real and causally efficacious within the neuronal substrate, it is a broken crane. It claims to lift the load of cognition but drops the very things (intentionality) that need lifting. It is a crane only if it reconstructs the higher levels; otherwise, it is merely eliminativist.

  Regarding Part B: The Crane/Skyhook distinction is robust only if understood as a demand for *design processes*, not just mechanisms. It is not simply an insult for "reductionism I dislike." Its utility lies in spotting "free lunches"—claims that complexity or capacity appears without an evolutionary or constructive history. However, it becomes rhetorical if used to dismiss legitimate higher-level laws that are not yet reduced. The criterion is not "has a mechanism now," but "is a mechanism possible in principle." If a theory blocks that possibility (like (a) and (b)), it is a skyhook. If it attempts it but oversimplifies (like (c)), it is greedy. The distinction holds, provided we judge the *potential for leverage*, not just current technical success.

  ***

  ### Marking Scheme

  **Total: 20 Marks (5 Points x 4 Marks each)**

  | Point | Criteria for Full Marks (4 marks) | Common Error / Deduction |
  | :--- | :--- | :--- |
  | **1. Diagnosis of (b)** | Identifies (b) as an **Explanatory Skyhook**. Notes that "threshold" without decomposition is brute emergence/magic, despite naturalistic ontology. | Treating (b) as a valid crane because it mentions "complexity" or "systems." Missing that "no decomposition" is the skyhook flag. |
  | **2. Diagnosis of (a)** | Identifies (a) as an **Explanatory Skyhook**. Crucially notes that identity claims ("is") are skyhooks if they block mechanistic inquiry ("category error"). | Assuming (a) is a crane because it sounds reductive/physicalist. Failing to spot the "category error" clause as an explanation-stopper. |
  | **3. Diagnosis of (c)** | Identifies (c) as a **Crane** that risks **Greediness**. Notes it offers a substrate (neurons) but fails if it deletes higher-level patterns without reconstruction. | Calling (c) a skyhook because it's eliminativist. Or calling it a perfect crane without noting the risk of ignoring real patterns (greed). |
  | **4. Ontology vs. Explanation** | Explicitly distinguishes **Ontological Naturalism** (all three have this) from **Explanatory Strategy** (where the skyhook hides). This is the core conceptual pivot. | Conflating materialism with cranes. Arguing that because (a) and (b) are physicalist, they cannot be skyhooks. |
  | **5. Meta-Evaluation** | Evaluates the distinction's utility: It works as a check for **design history/leverage**, not just "mechanism." Acknowledges risk of it being rhetorical if it blocks valid higher-level science. | Dismissing the distinction as "just semantics." Or accepting it uncritically as "Reduction Good, Emergence Bad" without nuance. |
