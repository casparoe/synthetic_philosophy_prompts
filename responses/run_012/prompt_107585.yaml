      *   *Programme (c):* "Just neurons." This is classic eliminative reductionism. Is it a crane? Yes, if it shows how neurons build up to behavior. Is it greedy? Only if it denies the reality of the higher level *without* showing the bridge. But usually, this is the "crane" baseline.
      *   *Programme (b):* "Emergent at threshold." This is the standard emergentist claim. Dennett usually attacks this if it implies the threshold *itself* does the work without a mechanism. If "complexity" is just a label for "we don't know how it works yet," it's a skyhook.
      *   *Programme (a):* "Consciousness IS Information Integration." This is the IIT (Integrated Information Theory) vibe. The prompt says "asking for a mechanism beyond that is a category error." *This is the critical one.* If you say "X is Y" but Y doesn't explain the *features* of X (e.g., qualia, unity) without just asserting identity, you've hung a skyhook on an ontological claim. It's a "definitional skyhook."
