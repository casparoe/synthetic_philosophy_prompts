          *   Camp 2: All-Subjected Principle (ASP) -> Coercion/Binding (e.g., citizens subject to law).
      *   **The Examples:** Transboundary pollution (kills AAP, saves ASP) vs. Minor prosecution (kills ASP, saves AAP). Neither side budges.
      *   **User's Hunch:** It's not a disagreement about criteria, but about *questions*. One answers "who is bound?" (obligation), the other "who decides?" (participation). Also notes the circularity issue (ASP accepts it, AAP tries to escape it).
