      *   **Task:** Diagnose the disagreement (verbal, conceptual, empirical, or bedrock normative?). Be concrete about commitments. Then, prescribe a path to progress (distinction, dropping a question, admitting pseudo-problem, or stalemate).
      *   **Constraint:** Don't just survey literature. Be concrete.

  2.  **Deconstruct the Two Camps:**
      *   **All-Affected (AAP):**
          *   *Core Intuition:* Democratic legitimacy requires that those whose interests are at stake have a say. Prevents externalities.
          *   *Commitment:* Legitimacy is consequentialist/interest-based.
          *   *Weakness:* "Affected" is infinitely elastic (butterfly effect). Requires a pre-political metric of "interest."
      *   **All-Subjected (ASP):**
          *   *Core Intuition:* Democratic legitimacy requires that those forced to obey have a say. Prevents tyranny.
          *   *Commitment:* Legitimacy is deontological/coercion-based.
          *   *Weakness:* Ignores externalities (can tyrannize neighbors). Relies on the existence of a state apparatus to define the boundary (circular).

  3.  **Evaluate the User's Hunch:**
      *   *Hunch:* One answers "who is bound?" (obligation), the other "who decides?" (participation).
      *   *Critique:* This is insightful but slightly off. Both camps claim to answer "who decides." The difference is *why* they think that group should decide.
      *   *Refinement:* It's more about the *source of the claim to legitimacy*. AAP says legitimacy comes from protecting interests. ASP says legitimacy comes from justifying coercion.
      *   *Biology Analogy:* Is "demos" doing double duty? Yes. It's both the *beneficiary* of protection (AAP) and the *author* of coercion (ASP).

  4.  **Diagnose the Disagreement:**
      *   Is it verbal? Partially. They use "demos" to point at different normative functions.
      *   Is it empirical? No. They agree on the facts of the dam or the emissions; they disagree on which fact matters morally.
      *   Is it bedrock normative? Yes. It's about the *point* of democracy. Is democracy a tool for welfare maximization (AAP) or a constraint on power (ASP)?
      *   *The Circularly Point:* The user is right. ASP accepts the state defines the boundary. AAP tries to find a boundary outside the state. This is a fundamental metaphysical split about political ontology.

  5.  **Formulate the Diagnosis:**
      *   The stalemate persists because they are solving different problems under the same label.
      *   **Problem A (The Problem of Power):** How do we justify forcing people to do things? (ASP's home turf).
      *   **Problem B (The Problem of Scope):** How do we ensure decisions don't wreck lives outside the power structure? (AAP's home turf).
      *   The "Boundary Problem" conflates these.
      *   The User's biology analogy is strong: "Demos" is acting as both *Replicator* (the source of authority) and *Interactor* (the thing impacted by the environment).

  6.  **Develop the Path to Progress:**
      *   *Option 1: Pick a winner.* (Bad idea, leads to more fighting).
      *   *Option 2: Admit pseudo-problem.* (Too dismissive).
      *   *Option 3: Functional Separation.* (Best option).
      *   Suggestion: Split the concept of "Demos" into two functional roles.
          1.  **The Sovereign Body (ASP):** Who votes? Who holds the monopoly on legitimate coercion? This must be fixed/circular to function.
          2.  **The Stakeholder Constellation (AAP):** Whose interests must be weighed? This is fluid.
      *   *Progress:* Stop asking "Who is the demos?" Ask "For *which function* are we drawing the boundary?"
      *   *Institutional Implication:* You need a fixed voting body (ASP) but robust mechanisms to internalize externalities (AAP) without giving them the vote (e.g., treaties, courts, compensation).

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Respectful, rigorous, matching the user's theoretical level. Avoid intro-poli-sci 101 definitions.
