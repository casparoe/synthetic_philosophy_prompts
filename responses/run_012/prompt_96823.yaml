      *Wait, one more thing:* The user asked about "voluntarist vs non-voluntarist." I should address that. ASP is non-voluntarist (you are subject whether you like it or not). AAP is closer to voluntarist/consent (your interests imply a claim to consent). Actually, AAP is more utilitarian. ASP is more Kantian/Republican. I should clarify this normative grounding.

      *Final Plan:*
