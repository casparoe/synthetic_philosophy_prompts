  6.  **Refining the Procedure (Self-Correction during drafting):**
      *   Make sure I explicitly mention the "Stopping Rule."
      *   The stopping rule is: "When the relationship has no properties other than the identity of the things it relates."
      *   Make sure to highlight the "Curator Decision" points (e.g., "Do we care about the history of this link?").

  7.  **Refining the Cases:**
      *   *Collected By:* Keep as Field (Foreign Key). Why? Because the *event* details (date, loc) are on the Specimen. The link itself has no extra metadata.
      *   *Growing On:* Make it an Entity. Why? Because "growing on" isn't uniform. A host plant implies a taxonomic link; a rock implies a geological link. You need to store "Relationship Type" *on the link*. This is the "unwanted" outcome (more complexity).
      *   *Annotated By:* Make it an Entity. Why? It has date, author, taxon concept. It's a classic "Determination" object.

  8.  **Final Review against Constraints:**
