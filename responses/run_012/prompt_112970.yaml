          3.  Do we need to track the history/validity of the relationship itself?
          4.  *The Stop:* If no to above, it's a field (foreign key). If yes, it's an entity.
          5.  *The Philosophical Truce:* Acknowledge that making it an entity doesn't solve the regress; it just pushes the boundary of what we care to track.

  4.  **Apply to the Three Cases:**

      *   **Case 1: 'Collected By' (Person <-> Specimen)**
          *   *Standard view:* Field (Foreign Key to Agent table).
          *   *Complication:* Same person = collector, determiner, donor.
          *   *Analysis:* Does the *act* of collecting have metadata? (Date, location, method). Usually, that's on the specimen. Does the *link* itself have metadata? Rarely.
          *   *Verdict:* Keep as Field (Role-based links to Agent).
