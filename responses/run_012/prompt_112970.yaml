          *   *Constraint Check:* I need one outcome the user "doesn't want." Let's push 'Growing On' to be an Entity (Associative) because of the biotic/abiotic split requiring different metadata (Host Taxon ID vs. Substrate Type). Or, conversely, force 'Annotated By' to be a simple field (unlikely).
          *   *Better Twist:* 'Collected By' seems safe as a field. 'Annotated By' *must* be an entity (determination history). 'Growing On' is the ambiguous one. Let's make 'Growing On' an Entity *only if* it links to another Specimen, otherwise a field. Wait, the prompt asks for a decision on the relationship itself.
          *   *Refined Decision:* 'Growing On' should be an Entity (Association) because the *nature* of the attachment (parasitic, epiphytic, saprophytic) is metadata *about the relationship*, not the plant or the substrate alone. This might annoy the curators who just want a "Substrate" text box.

      *   **Case 3: 'Annotated By' (Specimen <-> Determination)**
