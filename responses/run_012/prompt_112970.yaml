          *   *Complication:* Competing claims, wrong later annotators.
          *   *Analysis:* A determination is an *event*. It has a date, a person, a cited taxon, and a confidence/flag.
          *   *Decision:* Must be an Entity (Determination History).
          *   *Constraint Check:* This is standard practice. Maybe I need to challenge the "never erases anybody" rule? No, that's curatorial policy.
          *   *Alternative:* Maybe 'Collected By' needs to be an entity? If we need to track the *expedition* as an object.
          *   *Let's go with the prompt's request:* "I'd like at least one of the three to come out the way I don't want it to."
