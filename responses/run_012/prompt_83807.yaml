      *   **Developing the "Causation vs. Agency" Point:**
          *   Microhistory asks: "How did *this* specific thing happen?" It's about mechanism and contingency. (e.g., A specific riot started because of a specific baker's price hike).
          *   History from Below asks: "Who gets to count as a historical actor?" It's about representation and dignity. (e.g., The working class made the revolution, not just the leaders).
          *   *Key Insight:* You can do microhistory on a King (what he had for breakfast) and History from Below on a mass movement (without focusing on one individual).

      *   **The Archive Problem (The Strongest Point):**
