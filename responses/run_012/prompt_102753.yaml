answer: |-
  **Title:** The Distinct Wrong of Agenda Control: A Taxonomy of Non-Deceptive Influence

  **Project Summary**
  Standard accounts of manipulative influence typically locate the normative wrong in one of three features: deception (falsehood), bypassing rationality (appealing to emotion/habit over reason), or coercion (raising the cost of dissent). This project argues that these accounts are jointly insufficient. They are over-inclusive, flagging benign influences like teaching or art, and under-inclusive, missing subtle influences that rely entirely on truth and rational deliberation. I propose that the core wrong in these residual cases is *agenda control*: shaping which considerations enter a subject's deliberation and how they are weighted, without asserting falsehoods or raising the cost of dissent. This proposal outlines a term paper (~6,000 words) that tests whether agenda control constitutes a distinct, non-reducible normative wrong, or whether it collapses into existing categories.

  **The Research Question**
  The project seeks a determinate answer to the following question: **Is there a distinct, non-reducible normative wrong associated with agenda control, or do all instances of agenda control collapse into deception, rationality-bypassing, coercion, or permissible influence?**

  A "distinct" wrong means the normative force cannot be fully explained by the other three categories. A "non-reducible" wrong means it persists even when deception, bypassing, and coercion are explicitly controlled for.

  **The Gap in Existing Accounts**
  Current frameworks leave this question open because they rely on features of the *content* or the *mechanism* of influence, rather than the *structure of deliberation*.

  1.  **The Deception Account:** This view holds that manipulation is wrong because it lies.
      *   *The Gap:* It cannot handle the "Truthful Salesperson." Consider a salesperson who sequences truthful information so that an expensive option feels obvious, or a friend who shares only true negative facts about an ex to engineer a breakup. No falsehoods are asserted, yet the intuition of manipulation remains strong. Existing accounts must stretch the definition of "lie" to include misleading implicatures, but this risks over-inclusion.
  2.  **The Rationality-Bypass Account:** This view holds that manipulation is wrong because it subverts the target's rational capacities (e.g., triggering phobias, habits, or raw emotion).
      *   *The Gap:* It cannot handle the "Good Teacher." A teacher often bypasses a student's current reasoning to install a new framework. An artist aims to make you feel rather than argue. These are instances of bypassing current rationality that are not merely permissible but valuable. If "bypassing" is the wrong-maker, we must explain why teaching is exempt without ad hoc stipulations.
  3.  **The Coercion/Pressure Account:** This view holds that manipulation is wrong because it restricts freedom or raises the cost of dissent.
      *   *The Gap:* It cannot handle "Low-Cost Framing." In a campaign ad that makes a single true statistic vivid, the voter is free to ignore it. The cost of dissent is zero. Yet, the deliberative field has been skewed. Coercion accounts miss the wrong because the agent's freedom of action remains intact, even if their freedom of deliberation is compromised.

  Because these accounts focus on *what* is said (truth), *how* it is processed (reason vs. emotion), or *what happens if you say no* (cost), they miss the prior question: *what is available to be thought about?*

  **Methodology**
  To answer the research question, I will construct a comparative taxonomy of influence cases and test them against competing explanations.

  1.  **Case Construction:** I will build a matrix of 12–15 specific cases divided into three categories:
      *   *Benign Influence:* (e.g., A teacher simplifying a complex concept; a doctor reassuring a patient).
      *   *Paradigm Manipulation:* (e.g., A gaslighter; a predatory lender).
      *   *The Contested Middle:* (e.g., The truthful salesperson; the strategic friend; nudges that hide opportunity costs).
  2.  **Variable Control:** For the "Contested Middle" cases, I will explicitly stipulate that: (a) all assertions are true, (b) no emotional triggers are exploited, and (c) no threats are made. This isolates agenda control as the only remaining variable.
  3.  **The Test:** I will apply the "Agenda Control" hypothesis to these cases.
      *   *Hypothesis:* Agenda control is present when an influencer intentionally alters the salience or availability of considerations in the target's deliberation to align with the influencer's ends, without the target's awareness of that alteration.
      *   *Comparison:* I will check if standard accounts (Deception, Bypass, Coercion) predict our intuitive judgments on these cases. If standard accounts say "permissible" but intuition says "wrong," and Agenda Control says "wrong," the hypothesis gains support.
  4.  **Principled Line-Drawing:** If the hypothesis holds, I will attempt to draw a principled line between permissible agenda setting (e.g., a therapist guiding a patient to focus on strengths) and impermissible agenda control. The likely candidate for the dividing line is *authority* or *consent to the deliberative structure*.

  **Possible Outcomes**
  The project is designed to yield a clear result in one of three directions:

  1.  **Positive Result (Distinct Wrong):** Agenda control tracks our intuitions in the "Contested Middle" where other accounts fail.
      *   *Implication:* We need a new category in the ethics of influence. The wrong is a violation of *deliberative autonomy* rather than epistemic accuracy or freedom of action.
  2.  **Negative Result 1 (Collapse into Withholding):** It turns out that "agenda control" is merely a subset of withholding relevant information.
      *   *Implication:* The project fails to find a new category, but successfully refines the "deception by omission" account. I will argue that this is insufficient if the withheld information isn't strictly "relevant" but merely "counter-weighting."
  3.  **Negative Result 2 (Over-inclusion):** It turns out that agenda control is ubiquitous in benign relationships (parenting, teaching, friendship).
      *   *Implication:* If teachers and friends necessarily control agendas, then agenda control cannot be the *wrong-maker*. I would then have to argue that the wrong lies not in the control itself, but in the *ends* served (self-interest vs. other-interest). This would shift the project from a structural account to a teleological one.

  **Failure Conditions**
  I will consider the project to have failed if:
  *   I cannot distinguish agenda control from standard framing effects without relying on the influencer's intent (which is often epistemically inaccessible).
  *   The "Distinct Wrong" turns out to be reducible to "paternalism." If every case of agenda control is just paternalism, the specific mechanism of agenda control does no normative work.
  *   I cannot articulate why the target is harmed. If the target ends up making the "right" choice (by objective standards) via agenda control, and I still claim a wrong occurred, I must justify the harm without relying on outcome-based metrics.

  **Scope and Feasibility**
  For a 6,000-word term paper, the scope must be tightly constrained to ensure completion.
  *   **In Scope:** Dyadic, interpersonal influence (A influences B). Moral phenomenology (our intuitions about wrongness). Normative classification.
  *   **Out of Scope:** Structural or political propaganda (too broad for this word count). Psychological mechanisms (I will treat psychology as a black box; I am interested in the normative structure, not the cognitive science). Legal implications (I will not propose policy, only moral classification).
  *   **Risk Management:** The biggest risk is conceptual drift, where "agenda control" becomes a catch-all term for "influence I don't like." To prevent this, I will stick to the strict definition: *altering the salience/availability of considerations without falsehood or coercion.* If a case requires emotional exploitation to work, it is excluded from the analysis.

  **Conclusion**
  This project does not aim to solve the entire problem of manipulation. It aims to isolate a specific residue that current theories cannot explain. By testing the "agenda control" hypothesis against a controlled taxonomy, I intend to show either that deliberative autonomy is a distinct moral value worth protecting, or that our intuitions about manipulation are more fragmented than we assume. Either result clarifies the ethics of influence.
