answer: |-
  Here is a 50-minute battle plan designed for physics grad students. It treats them as ontological peers who just haven't read the literature.

  ### The Single Example: **The Hamiltonian of the Standard Model**
  **Why this pick:**
  It is the object they actually use. It separates the **dynamical structure** (the operators, the coupling constants) from the **history** (the specific field configurations over time).
  *   **The Law:** The form of the Hamiltonian $\hat{H}$ (e.g., QED terms).
  *   **The Mosaic (Facts):** The specific values of the fields $\psi(x,t)$ at every spacetime point.
  *   **The Accident:** A regularity like "All electrons in this lab currently have spin-up." This is true, but it's not in $\hat{H}$; it's a boundary condition.

  **The Tempting-but-Wrong Pick:** *Planetary Orbits (Kepler's Laws).*
  **Why avoid it:** It smuggles in classical trajectories. In QM, there are no trajectories, only wavefunctions. If you use orbits, the Entanglement objection later will look like you're mixing categories. Using the Hamiltonian keeps the ontology consistent with their actual research.

  ---

  ### The Whiteboard Layout
  Divide the board into three vertical columns. Do not erase the middle column.
  1.  **Left:** The Mosaic (The "What Happened")
  2.  **Center:** The Best System (The "Summary")
  3.  **Right:** The Tension (Explanation & Priority)

  ---

  ### The Sequence (50 Minutes)

  #### 1. The Epistemic Hook (0–5 mins)
  **Goal:** Disarm the intuition that "Laws" are observable.
  *   **Action:** Draw a grid on the **Left Column**. Label it "Spacetime." Fill it with dots.
  *   **Say:** "You are empiricists. What do you actually measure? Detector clicks. Spectral lines. Field values at points. You never measure a 'Law.' You measure the Mosaic of particular facts."
  *   **The Humean Move:** "The Humean says: Stop there. The universe is just this mosaic. 'Laws' are not extra entities hovering above the dots. They are *human descriptions* of the dots."
  *   **Pre-empt Misconception:** Explicitly state: "This is not saying physics is fake. It is saying 'governing power' is metaphysical baggage. Occam's Razor: Do not multiply entities beyond necessity."

  #### 2. The Accident Problem & Best System Analysis (5–20 mins)
  **Goal:** Make them feel the need for a criterion to distinguish laws from accidents, then show the Humean solution.
  *   **The Trap:** Ask: "If laws are just summaries, what's the difference between 'Electrons repel' (Law) and 'All coins in my pocket are silver' (Accident)? Both are true universal generalizations about the mosaic."
  *   **Student Reaction:** They will say "One is fundamental, one is contingent."
  *   **The Humean Reply (Center Column):** "Fundamental how? If you can't point to it in the mosaic, it's magic."
  *   **Introduce BSA (Best System Analysis):** Draw a balance scale.
      *   **Strength:** How much of the mosaic does it capture?
      *   **Simplicity:** How short is the equation?
      *   **The Definition:** A Law is an axiom in the system that best balances Strength and Simplicity.
      *   **Apply to Example:** "The Standard Model Hamiltonian is short (Simple) and predicts almost everything (Strong). 'All coins in my pocket are silver' is Strong (for that pocket) but adds huge complexity to the system for zero gain elsewhere. It doesn't make the cut."
  *   **The Awkward Question:** Write "Who decides Simplicity?" on the board.
      *   **Answer:** "Not us. It's an objective feature of the information content of the universe. If aliens exist, they should converge on the same Lagrangian."

  #### 3. The Anti-Humean Counter-Strike (20–35 mins)
  **Goal:** Hit the explanatory gap. This is where Humeanism usually dies for physicists.
  *   **The Move:** Go to the **Right Column**. Write: **Explanatory Priority**.
  *   **Say:** "When you solve the Schrödinger equation, you say the Hamiltonian *determines* the time evolution. The Law makes the Facts happen."
  *   **The Humean Circle:** "But for the Humean, the Facts (the mosaic) make the Law (the best summary) true. The summary cannot explain the data it summarizes."
  *   **The Dilemma:** Draw a circle arrow. "Facts $\to$ Laws $\to$ Facts."
  *   **Anti-Humean Claim:** "Laws must be *prior* to the facts. They constrain what is possible. If the SM Hamiltonian is a Law, it *forbids* certain mosaics from existing. For the Humean, those mosaics are just 'unlikely' because they don't fit the summary."
  *   **Pre-empt Misconception:** Students will think Anti-Humeanism implies "magic powers." Clarify: "Anti-Humeanism isn't magic; it's the claim that relations between universals (or dispositions) are real ontological ingredients, not just linguistic shortcuts."

  #### 4. The Entanglement Objection (35–45 mins)
  **Goal:** Address the specific physics constraint.
  *   **Decision:** This is a **Real Objection to Classical Humean Supervenience**, but not a death blow to Humeanism *about laws*.
  *   **Where it goes:** Here, as a constraint on the "Mosaic."
  *   **The Argument:** "Classical Humeanism says the Mosaic is local intrinsic properties at points (e.g., field strength at $x$). Bell's Theorem/Entanglement says the world is non-separable. The state of particle A depends on B instantaneously."
  *   **The Humean Survival:** "A Humean can survive this, but at a cost. They must change the definition of the Mosaic. The 'facts' are not local points; the fundamental fact is the *Global Wavefunction*."
  *   **The Cost:** "If the fundamental fact is the Global Wavefunction, you lose Locality as a fundamental feature of reality. You save Humeanism, but you make the 'Mosaic' incredibly holistic."
  *   **Why this matters:** It shows Humeanism isn't static; it adapts to physics, but the 'price' of admission changes.

  #### 5. Closing & The Distinction Check (45–50 mins)
  **Goal:** Ensure they leave with the philosophical distinction, not just vocabulary.
  *   **What to Skip:** Do **not** discuss the Problem of Induction. That is about *justifying belief* in laws. Humeanism is about *what laws are*. Conflating them will confuse sharp students.
  *   **The Closing Question:** Write this on the board and ask for a show of hands.
      > *"If the universe vanished right now, leaving no future facts:*
      > *1. Would the Standard Model Hamiltonian still be true? (Anti-Humean: Yes)*
      > *2. Would the Standard Model Hamiltonian cease to exist because there is no longer a history to summarize? (Humean: Yes)"*
  *   **The Takeaway:** "If you voted 1, you think laws *govern*. If you voted 2, you think laws *describe*. Both agree on the math. They disagree on the ontology."

  ---

  ### Misconception Head-Offs
  1.  **"Humeans think regularities are coincidences."**
      *   *Correction:* "No. Humeans think the regularity is real. They deny the *necessitation* relation. The electron doesn't repel *because* of a law; the law is true *because* the electron repels."
  2.  **"Simplicity is subjective."**
      *   *Correction:* "In BSA, simplicity is information theoretic (Kolmogorov complexity). It's about the shortest code to reproduce the data. It's language-relative, but we assume the language of mathematics is the optimal compression language."
  3.  **"Anti-Humeans believe in magic."**
      *   *Correction:* "They believe in *dispositions* or *relations between universals*. It's a richer ontology, not a supernatural one."

  ### Summary of the Flow
  1.  **Mosaic First:** Establish that facts are all we see.
  2.  **Laws as Compression:** Introduce BSA to solve the "Accident" problem.
  3.  **The Explanatory Circle:** Show why physicists hate this (Laws should explain facts, not vice versa).
  4.  **Entanglement:** Show how modern physics forces the Humean to update their "Mosaic."
  5.  **The Vanishing Universe:** Test their ontological commitment.

  This order makes Humeanism feel like a serious, parsimonious scientific stance (appealing to their training) before hitting them with the explanatory cost (appealing to their intuition).
