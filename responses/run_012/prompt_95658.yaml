answer: |-
  **Office of Contractualist Review**
  **FAQ: Meridian Avenue Light-Rail Extension (Project #882-B)**

  **1. Why was the Meridian Avenue Extension canceled?**
  Following a public hearing period, the Office determined that the project could not be justified to every affected resident individually. Under Charter Provision 14.B, a policy is permissible only if it rests on principles no single affected party could reasonably reject. Ms. Eleanor Gable (Zone 4) submitted a reasonable rejection based on nocturnal noise pollution affecting her sleep cycle. As her burden was not offset by benefits to others, the project failed the justification test.

  **2. Why couldn't the benefits to commuters offset Ms. Gable's burden?**
  The Charter explicitly forbids "netting." We cannot aggregate the minor conveniences enjoyed by forty thousand projected riders to outweigh the significant disturbance borne by one resident. To do so would treat individuals as mere vessels for utility rather than sovereign justificatory communities. The gain to the many does not license the burden imposed on the few. Justification is owed to each person separately, not to the collective.

  **3. Were there other objections?**
  Yes. Mr. Arthur Alston objected to construction dust (a physical burden). Mr. David Pure objected on principle to the practice of quantifying human complaint (a philosophical burden). Additionally, Ms. Gable's neighbor, Mr. Henderson, objected to the Office's own existence, citing the stress of reviewing these notices. Under Section 14.B, procedural burdens count as burdens. We cannot reject Mr. Henderson's complaint without invoking the very authority he rejects.

  **4. A structural engineer asked: "Why do forty thousand projected riders not simply outweigh one objector?"**
  This is the central difficulty of the non-aggregative framework. Currently, the Office has no principled metric to sum small complaints into a large justification. If we allow numbers to decide, we risk violating the individual veto power guaranteed by the Charter. However, we acknowledge that if every small benefit is ignored, no public good can ever be built. We do not have a tidy reply. The framework suggests that numbers matter only insofar as they affect the *generality* of the principle, not the *sum* of the outcome. Whether forty thousand small gains constitute a principle anyone could reject is an open question we are currently studying. We cannot simply do the math.

  **5. Does this mean any single resident can veto any project?**
  Technically, yes, provided their rejection is reasonable. We are aware this creates a potential paralysis. However, granting a veto to the aggregate would violate the requirement to justify power to each person separately. We are exploring whether a "threshold of reasonableness" might allow us to disregard frivolous rejections without reintroducing aggregation, but no consensus has been reached. To define the threshold would require a principle some could reasonably reject.

  **6. What is the next step?**
  The Office will remain open to receive objections regarding the Office's continued operation. Please submit Form 12-C if you wish to register a complaint about this FAQ. We cannot guarantee a response that will not itself be subject to reasonable rejection.
