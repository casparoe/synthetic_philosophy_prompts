      P2: "Unauthorized entry is treated as a specific wrong against sovereignty itself, distinct from the state of being present. This is why crossing without permission is often criminalized while overstaying is civil. The wrong is the breach of the gate, not merely the residence. The law punishes the manner of arrival because the manner determines whether the state retained control over the selection process. By punishing the crossing more severely than the staying, the law signals that the violation of the state's will to choose is worse than the physical fact of presence. If these commitments were not held, the apparatus would look radically different. If presence itself generated legitimacy, borders would be porous, and status would be regularized by time spent on the ground. If the right to exclude were not property-like, the state could not delegate enforcement to private actors without violating their liberty. The system assumes the state owns the space and rents access conditionally. It presumes intent is knowable and judgeable by officers. It assumes that mobility is not a fundamental human right but a privilege granted by the destination. The machinery rests on the view that communities are discrete units entitled to protect their shape and wealth from external dilution, prioritizing the security of the insider over the freedom of the outsider. The delegation to airlines and landlords confirms that membership is a status verified continuously, not just at the line. The distinction between entry and overstay reveals that the state cares more about maintaining the integrity of its screening mechanism than about the physical location of the body once inside. Ultimately, the theory holds that political membership is contractual, not inherent. The state is a club, and the border is the bouncer. This theoretical structure allows the state to act as a gatekeeper who decides which forms of life are compatible with the existing order. It treats the territory as a resource to be managed rather than a space to be shared." 
