          To settle this, we would need evidence not from the law's text but from its administration. We would need to see how discretion is exercised when categories overlap. If officers consistently favor high-income visitors over family members, the theory is economic. If they favor certain nationalities regardless of income, the theory is cultural. We would also need data on deportation priorities. If overstayers are rarely removed compared to unlawful entrants, it suggests the machinery cares more about the border line than the population inside. The silence on the *value* of the categories allows the system to function despite political disagreement about what makes a stranger desirable. The apparatus provides the how, but remains agnostic on the why, allowing different ideologies to inhabit the same structure without resolving their fundamental conflicts. (278 words).

