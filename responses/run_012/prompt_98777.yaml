          What would survive? Security screenings for weapons or diseases might remain, but only as health and safety measures, not border controls. Registration might exist for census purposes, but not for permission. The system would resemble domestic travel within a large country. The replacement would be a notification system rather than a permission system. You would tell the state you are here, not ask if you may be. The entire architecture of suspicion—proving you will leave, proving you have funds—would be replaced by a presumption of innocence regarding movement. The state would retain the right to punish crimes committed within the territory, but not the right to punish the act of arriving. This shift transforms the border from a gate into a membrane, permeable to people but still regulating goods and security threats. (435 words).

