          Not every feature of the border regime is strictly required by its core theory; some are merely accommodations. The strict requirement is that the state retains final authority to select who enters. However, the specific reasons for exclusion are flexible. The machinery accommodates both nationalist theories (protecting culture) and economic theories (protecting wages) without needing to commit to either. For example, a visa category for "skilled workers" fits an economic utility theory, while a ban on entrants from specific regions fits a cultural or security theory. Both operate through the same paperwork and officer discretion.

