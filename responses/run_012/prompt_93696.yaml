      *   *Premise 1:* Individuals satisfy vNM expected utility axioms.
      *   *Premise 2:* Social preferences satisfy vNM axioms.
      *   *Premise 3:* Pareto Indifference (if everyone is indifferent, society is indifferent).
      *   *Conclusion:* Social Welfare Function (SWF) is a weighted sum of individual utilities ($W = \sum a_i U_i + c$).
      *   *Harsanyi's Utilitarianism:* Adds the "Veil of Ignorance" assumption (equal probability of being anyone) to argue weights *should* be equal ($a_i = 1/n$).
