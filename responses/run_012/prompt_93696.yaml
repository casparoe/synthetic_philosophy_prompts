  # Session Plan: The Shape of Aggregation
  **Topic:** Harsanyi's Aggregation Theorem & The Veil of Ignorance
  **Time:** 90 Minutes
  **Class Size:** 18 Students (plus 1 Absentee Position)

  ## 1. Learning Objectives
  By the end of this session, students will be able to:
  1.  Distinguish between the *Aggregation Theorem* (Social Welfare is a weighted sum of utilities) and *Utilitarianism* (Weights are equal).
  2.  Explain how the "Veil of Ignorance" (known equal probabilities) generates equal weights mathematically.
  3.  Identify why the theorem requires cardinal, interpersonally comparable utility, and what happens when that scale is missing.
  4.  Contrast Harsanyi's Expected Utility approach with Maximin (Rawlsian) reasoning under uncertainty.

  ## 2. Materials & Setup
  *   **19 Envelopes:** Numbered 1–19. (18 for students, 1 marked "ABSENTEE" placed visibly at the front).
  *   **Identity Cards (Inside Envelopes):**
      *   **Position ID:** (e.g., "You are Position 4").
      *   **Token Payoff Table:** Shows how many "Social Tokens" Position $X$ receives under **Policy Red** vs. **Policy Blue**.
      *   **Private Conversion Chart:** A unique function converting Tokens $\to$ "Happiness Points" (0–100).
          *   *Constraint Check:* These charts vary. Some are linear ($1T = 1P$), some concave ($\sqrt{T}$), some convex ($T^2$). Some Positions prefer Red, some prefer Blue.
  *   **Public Board:** Two columns: "Policy Red" and "Policy Blue."
  *   **Currency:** "Social Tokens" (poker chips or slips of paper). "Happiness Points" are abstract.
  *   **Snacks:** A communal bowl of snacks to be distributed at the end based on the winning policy (adds tangible stakes).

  ## 3. The Payoff Scheme (Instructor Master Sheet)
  *Do not distribute this. Keep it hidden until the Debrief.*

  | Position | Type | Policy Red Tokens | Policy Blue Tokens | Conversion Function (Tokens $\to$ Points) | Preference (based on Exp. Tokens) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1–10 | Majority | 100 | 80 | Linear ($1:1$) | Red |
  | 11–15 | Middle | 50 | 80 | Concave ($\sqrt{T} \times 10$) | Blue |
  | 16–18 | Vulnerable | 10 | 80 | Linear ($1:1$) | Blue |
  | **19** | **Absentee** | **500** | **80** | **Linear ($1:1$)** | **Red** |

  *   **Total Tokens Red:** $1000 + 250 + 30 + 500 = 1780$
  *   **Total Tokens Blue:** $80 \times 18 + 80 = 1520$
  *   **Minimum Token Red:** 10 (Positions 16-18)
  *   **Minimum Token Blue:** 80 (Everyone)
  *   **Note:** Policy Red has a higher *Sum* (driven by the Absentee and Majority). Policy Blue has a higher *Minimum*. Preferences diverge (10 prefer Red, 8 prefer Blue).

  ## 4. Timeline & Activity Flow

  ### 0:00 – 0:10 | Introduction & Distribution
  *   **Action:** Hand out the 18 envelopes. Place Envelope 19 at the front.
  *   **Instruction:** "Open your envelope. Do not show anyone your Conversion Chart. You may discuss Token numbers, but remember: your Points are private. Position 19 is an absent stakeholder (e.g., a future generation). Their payoff counts toward the group total, but they cannot vote."
  *   **Concept:** Establishes the *Private Units* constraint. Students realize they cannot simply add up each other's happiness.

  ### 0:10 – 0:35 | Round 1: The Veil (Known Probabilities)
  *   **Scenario:** "Imagine a Constitutional Convention. You must choose one Policy (Red or Blue) for the group. **Condition:** Before the policy is enacted, I will draw 19 names from a hat. Each of you has exactly a **1/19 chance** of being assigned to Position 1, a 1/19 chance of Position 2... including Position 19. You will receive the Tokens for that Position, converted to Points via your private chart."
  *   **Task:** "Discuss for 10 minutes. Then, write your vote on a slip of paper. You are voting for the rule that maximizes your *Expected Personal Happiness*."
  *   **Mechanism:** Collect votes. Tally publicly.
  *   **Predicted Outcome:** Most will vote **Red**.
      *   *Why:* With equal odds ($1/19$), Expected Utility is $\frac{1}{19} \sum U_i$. Since Tokens are the proxy for Utility here, and Red has the higher Token Sum (1780 vs 1520), rational vNM agents maximize the Sum. The Absentee's large payoff sways the Sum.
  *   **Instructor Role:** Do not confirm the correct answer. Just record the class choice.

  ### 0:35 – 0:55 | Round 2: The Fog (Unknown Probabilities)
  *   **Scenario:** "We reset. Same Policies. Same Tokens. **Condition:** The positions have already been assigned. You *are* Position $X$. However, you do not know which one. Furthermore, **you do not know the odds.** Nature might have assigned you to the Vulnerable group with 90% probability, or 0%. The distribution is unknown and potentially adversarial."
  *   **Task:** "Discuss for 10 minutes. Vote again. You are voting to protect your interests under radical uncertainty."
  *   **Mechanism:** Collect votes. Tally publicly.
  *   **Predicted Outcome:** Shift toward **Blue**.
      *   *Why:* Without known probabilities, Expected Utility cannot be calculated. Rational agents often switch to **Maximin** (maximize the minimum outcome). Blue guarantees 80 Tokens for everyone. Red risks 10 Tokens.
      *   *Absentee Factor:* Students may choose to exclude Position 19 from consideration to raise the group minimum (if they view the Absentee as a drag on the minimum), or include them out of principle.
  *   **Instructor Role:** Note the shift in voting patterns.

  ### 0:55 – 1:20 | The Debrief (Mapping to Theory)
  *   **Step 1: Reveal the Master Sheet.** Show the Token distributions and the Absentee's stake.
  *   **Step 2: Map Round 1 to Harsanyi.**
      *   *Question:* "Why did Round 1 drift toward the Sum (Red)?"
      *   *Theory:* You acted as vNM expected utility maximizers. $E[U] = \sum p_i U_i$. Since $p_i = 1/19$ for all $i$, $E[U] \propto \sum U_i$.
      *   *Key Insight:* "The Aggregation Theorem says Social Welfare is a **Weighted Sum** ($W = \sum a_i U_i$). It does **not** say weights must be equal. You chose equal weights ($a_i = 1/19$) only because I **told you the odds were equal**. If I had said Position 19 was twice as likely, your 'Social Welfare' function would have weighted them double."
  *   **Step 3: Map Round 2 to Uncertainty.**
      *   *Question:* "Why the shift to Blue?"
      *   *Theory:* Without probabilities ($p_i$), you cannot maximize Expected Utility. You defaulted to Maximin ($W = \min(U_i)$). This violates the vNM continuity axiom required for Harsanyi's theorem.
  *   **Step 4: The Interpersonal Comparison Problem.**
      *   *Question:* "In Round 1, you summed Tokens. But your Conversion Charts differed. Did anyone actually calculate the Sum of *Points*?"
      *   *Reveal:* "No, you couldn't. You assumed Tokens were comparable. Harsanyi's theorem *requires* cardinal, comparable utility. If Person A's 100 Points is 'more intense' than Person B's 100 Points, the Sum is meaningless without a scaling factor. The theorem assumes the scaling is solved; it doesn't solve it for you."
  *   **Step 5: The Absentee.**
      *   *Discussion:* "Position 19 had 500 Tokens in Red. In Round 1, they helped Red win (adding to the Sum). In Round 2, did you count them? If you used Maximin, their 500 Tokens didn't help the minimum. Did you exclude them? This shows how the *aggregation rule* determines who counts."

  ### 1:20 – 1:30 | Wrap Up & Snack Distribution
  *   **Action:** Distribute snacks according to the *actual* winning policy of Round 1 (as Harsanyi is the standard benchmark for the course).
  *   **Final Thought:** "Harsanyi gives us the *form* of rational social choice (Weighted Sum). He does not give us the *weights*. We supply the weights through our ethical assumptions about probability (the Veil)."

  ## 5. Troubleshooting: What Will Go Wrong
  1.  **Collusion/Trading:** Students may try to trade "I'll vote Red if you vote Red."
      *   *Fix:* Remind them in Round 1 that their identity will be randomized. Trading is useless because they won't know who they are when the policy hits.
  2.  **Ignoring the Absentee:** Students may forget Position 19 exists.
      *   *Fix:* In Round 1, explicitly ask: "Does the Absentee's chip count toward the pot?" If they say no, point out that violates the "1/19 chance" rule (since 1/19 of the time *you* would have been the Absentee).
  3.  **Confusing Tokens and Points:** Students will argue "My 100 Points is worth more than your 100 Points."
      *   *Fix:* Use this! This is the *Interpersonal Comparison* problem. Acknowledge it during the debrief as the limitation of the activity vs. the theorem's assumptions.
  4.  **Round 2 Stagnation:** Students might stick with Round 1's choice.
      *   *Fix:* Prompt them: "In Round 1, you knew the odds. Now, imagine I am a malicious nature trying to minimize your payoff. Do you still trust the Average?"

  ## 6. Limitations: What You Must Supply
  This activity cannot reproduce the **mathematical proof** of the theorem. Specifically:
  1.  **Pareto Indifference:** The activity assumes Pareto efficiency implicitly. You must explicitly state in the debrief: "The theorem holds *if* society is indifferent when all individuals are indifferent. We didn't test that; we assumed it."
  2.  **Linearity Proof:** Students felt the *result* (Sum), but not the *necessity*. You must explain that any other aggregation rule (e.g., multiplicative) would violate the vNM independence axiom.
  3.  **The "Weights" Nuance:** The activity makes Equal Weights feel natural due to the Veil. You must explicitly decouple them: "Harsanyi says $W = \sum a_i U_i$. The Veil says $a_i = a_j$. You can have Harsanyi without the Veil (e.g., a weighted voting system), but then it's not Utilitarianism."

  ## 7. Instructor Script Snippet (For the Debrief)
  *"Look at your votes in Round 1. You acted like Utilitarians. You maximized the total token count. But look at your private cards. Your 'happiness' per token is different. By summing tokens, you implicitly assumed an interpersonal scale that doesn't exist in the room. Harsanyi's theorem is powerful, but it demands that we *can* compare utilities. If we can't, the 'Weighted Sum' is just a sum of numbers, not a sum of welfare. The theorem gives you the engine; the Veil gives you the fuel. Don't confuse the two."*
