answer: |-
  **Project Title:** Dynamic Fairness: Impossibility and Stability in Iterative Decision Systems

  **1. Research Question and Objectives**
  Standard impossibility results in algorithmic fairness establish that, given differing base rates across groups, a classifier cannot simultaneously satisfy calibration and equalized odds (or error-rate balance). These results, however, assume a *static* setting: a fixed population distribution where the classifier's output is the terminal event. In real-world deployment, decisions are iterative. A loan approval affects credit history; a pretrial release affects recidivism risk; a hospital admission affects health outcomes. The policy alters the population distribution, which in turn alters the base rates for the next round of training and deployment.

  This project asks: **Does the introduction of feedback dynamics resolve, exacerbate, or transform the static fairness impossibility?**

  Specifically, I propose to formalize and evaluate a third condition alongside the standard fairness metrics: *Equity Stability*. A policy is equity-stable if its iterative application converges to a stationary population distribution where the fairness constraints (calibration and error-rate balance) hold endogenously, without requiring the base rates to be equalized by exogenous intervention. The primary objective is to determine whether there exists a decision policy that is simultaneously (i) calibrated, (ii) compliant with equal opportunity, and (iii) equity-stable.

  The deliverable will be a formal characterization theorem. This theorem will either prove a *dynamic impossibility* (showing that no such policy exists under general feedback conditions) or identify the *necessary and sufficient conditions* on the feedback mechanism under which a stable fair equilibrium is possible.

  **2. Background and Motivation**
  The static impossibility results rely on the assumption that group membership is correlated with the target variable in a way that the classifier cannot disentangle without violating one metric or the other. In a single-shot context, this is a mathematical constraint on conditional probabilities. However, this framework treats the base rates as exogenous constants.

  In iterative settings, base rates are endogenous variables. If a fairness-constrained policy allocates resources (e.g., loans) to a disadvantaged group, and those resources improve the group's qualification rate over time, the base rates may converge. If they converge, the static impossibility may vanish. Conversely, the feedback loop might introduce a new tension: a policy might satisfy fairness metrics at round $t$ but shift the population distribution at $t+1$ in a way that violates the very norm the policy was designed to uphold (e.g., by creating a dependency where fairness is only maintained by perpetual resource transfer).

  Existing literature on "performative prediction" and strategic classification acknowledges feedback but typically optimizes for accuracy or stability alone, not for the compatibility of multiple fairness metrics over time. The philosophical literature on non-ideal theory emphasizes the importance of dynamic transitions rather than static end-states, but lacks the formal machinery to evaluate specific algorithmic policies. This project bridges that gap by treating the fairness constraints not as properties of a snapshot, but as properties of a dynamical system.

  **3. Methodology and Work Plan**
  The formal apparatus will be a discrete-time dynamical system over population distributions. I will model the population as two groups, $A \in \{0, 1\}$, with a qualification rate $q_{a,t}$ at time $t$. The classifier is a threshold rule on a score $s$. The feedback mechanism will be modeled as a function $q_{a,t+1} = f(q_{a,t}, \text{Allocation}_{a,t})$, where allocation depends on the classifier's positive predictions.

  *   **Months 1–3: Formalization.** Define the state space of population distributions and the map induced by a fairness-constrained policy. I will rigorously define *Equity Stability* as a fixed point of this map where the fairness constraints hold. I will select a specific, tractable feedback function (e.g., linear improvement in qualification rate proportional to resource allocation) to ensure the problem is solvable within one year.
  *   **Months 4–6: Existence Analysis.** I will analyze the system for the existence of fixed points. This involves determining if the intersection of the "fairness manifold" (policies satisfying calibration and equal opportunity) and the "stability manifold" (policies where $q_{t+1} = q_t$) is non-empty.
  *   **Months 7–9: Proof or Counterexample.**
      *   *Path A (Theorem):* If the intersection is empty under general conditions, I will construct a proof of dynamic impossibility, likely leveraging Brouwer's fixed-point theorem or contradiction via the dynamics of the base rates.
      *   *Path B (Counterexample/Construction):* If the intersection is non-empty, I will construct the specific class of feedback functions and policies that allow for stable fairness. This will look like a constructive existence proof.
  *   **Months 10–12: Interpretation and Writing.** I will translate the formal results into normative implications. If stable fairness is impossible, what does that imply for policy (e.g., the need for exogenous intervention)? If possible, what are the costs (e.g., convergence time)? I will draft the final paper and fellowship report.

  **4. Criteria for Success and Falsifiability**
  A successful outcome is a determinate answer to the compatibility question. However, I must acknowledge the risk of asking the wrong question. I will consider the research direction misguided if:
  1.  **Triviality:** The model shows that *any* policy converges to fairness regardless of constraints, implying the feedback mechanism dominates the decision rule. This would suggest the choice of classifier is normatively irrelevant.
  2.  **Instability by Definition:** If the only stable fixed points are trivial (e.g., $q=0$ or $q=1$ for all groups), the model fails to capture meaningful social dynamics.
  3.  **Sensitivity:** If the result hinges entirely on the specific functional form of the feedback $f(\cdot)$, the result may be mathematically sound but philosophically thin.

  To mitigate this, I will test the robustness of the result against a family of feedback functions (e.g., concave vs. linear returns on investment) rather than a single specification.

  **5. Scope and Feasibility**
  This proposal is scoped for a one-year fellowship with a teaching load. I am not attempting to model general multi-agent strategic behavior or complex causal graphs. I am restricting the analysis to binary classification with a single scalar qualification rate per group and a deterministic feedback loop. This reduction is necessary to derive analytical results rather than relying solely on simulation. While simulations may accompany the final paper, the core contribution will be analytical. This scope ensures that the project is finishable while still capturing the essential tension between static fairness metrics and dynamic population changes.

  ***

  ### Advice on Outcomes and Strategy

  **Which outcome is most valuable?**
  For a mixed CS/Philosophy audience, the **Characterization Theorem** (Path B in your methodology, but framed broadly) is the most valuable.
  *   A pure **Impossibility Theorem** ("It's impossible, give up") is mathematically clean but normatively depressing. Philosophers might find it interesting, but CS reviewers might view it as a negative result that stalls progress.
  *   A pure **Possibility/Counterexample** ("Here is a case where it works") is risky. Reviewers may argue your feedback model is unrealistic ("toy model").
  *   A **Characterization** ("It is possible if and only if the feedback mechanism satisfies condition X") is the sweet spot. It gives the CS reviewers the formal boundary conditions they love, and it gives the Philosophy reviewers the normative leverage they need (i.e., "If we want fair AI, we must engineer the *environment's response* to satisfy condition X, not just the classifier"). It shifts the burden from the algorithm to the system design.

  **Should you hedge or commit?**
  **Commit to the question, hedge on the answer.**
  Do not write "I expect to prove impossibility." Write "I will determine whether..." or "I will characterize the conditions under which..."
  *   **Why:** If you commit to impossibility and find a possibility, you look like you failed. If you commit to possibility and find impossibility, you look naive.
  *   **The Pitch:** Your pitch is that the *static* results are incomplete because they ignore time. Your goal is to complete the picture. Whether the completed picture is bleak or optimistic is a matter of mathematical fact, not proposal promise. The value is in resolving the uncertainty, not in confirming a bias.

  **One final tip for the "Equity Stability" term:**
  In the proposal text above, I kept your term but defined it rigorously. In the final write-up, consider adding a parenthetical synonym like "(distributional fixed-point consistency)" just once. It signals to the CS reviewers that this maps to existing dynamical systems literature without alienating the philosophers who like "Equity Stability."
