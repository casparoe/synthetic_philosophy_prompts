  # Aequitas Flow: Governance for Algorithmic Risk

  **Certifiable Fairness at Enterprise Scale**

  Deploy risk models with confidence. Aequitas Flow provides continuous auditing for machine learning pipelines, ensuring your scoring systems align with internal governance and external regulatory frameworks. Our platform ingests model outputs and protected attribute mappings to generate compliance certificates in real-time.

  **Secure Protected Class Ingestion**
  Upload your sensitive attribute file directly to our encrypted enclave. Aequitas Flow never uses these features for training or inference; they are utilized exclusively for post-hoc audit trails. This ensures your model remains attribute-agnostic while your organization remains compliant. Simply map your internal IDs to our standard schema. We assume provided ground truth labels are accurate for the purpose of certification.

  **Platform Features**
  *   **The Fairness Slider:** Adjust the weighting between competing metrics via our intuitive dashboard. Shift priority from calibration to parity instantly.
  *   **Intersectional Scaling:** Audit over single or multiple protected classes. Pricing adjusts dynamically based on the cardinality of subgroup combinations.
  *   **Drift Detection:** Receive alerts when metric performance degrades over time.

  ---

  ### Pricing Plans

  | **Parity Guard** | **Odds Match** | **Calibrate Pro** |
  | :--- | :--- | :--- |
  | **$5,000 / mo** | **$12,000 / mo** | **$25,000 / mo** |
  | Demographic Parity | Equalized Odds | Calibration within Groups |
  | Selection Rate Monitoring | TPR/FPR Balance | Risk Score Reliability |
  | Single Attribute Class | Single Attribute Class | Single Attribute Class |
  | *Ideal for hiring pipelines* | *Ideal for lending models* | *Ideal for risk assessment* |
  | **+$1,500 per additional subgroup intersection** | **+$1,500 per additional subgroup intersection** | **+$1,500 per additional subgroup intersection** |

  ---

  ### Customer Success

  > "Before Aequitas Flow, our disparate impact ratio fluctuated weekly. Now we lock our selection rate at the 80% threshold and generate audit logs for regulators automatically. It turned a policy debate into a configuration setting."
  > — **VP of Risk, FinTrust Corp**

  ---

  ### Frequently Asked Questions

  **Q: Can we enable Demographic Parity and Equalized Odds simultaneously?**
  A: You may toggle both metrics in the dashboard. However, the system will flag a "Constraint Conflict" if base rates differ between groups. In these instances, please use the Fairness Slider to designate which metric takes precedence. This choice is recorded in your compliance log as a business decision.

  **Q: Our model code hasn't changed, but our fairness metrics drifted this month. Why?**
  A: This indicates a population shift rather than model decay. If the prevalence of the target outcome changes within a protected group, error rate parity and calibration cannot remain stable simultaneously. Your model is behaving consistently; the underlying distribution has not.

  **Q: Does using protected attributes for auditing expose us to legal risk?**
  A: No. Because attributes are processed in a separate enclave and never touch the training pipeline, this constitutes safe harbor under current guidance. You are auditing outcomes, not influencing decisions.

  ---

  ### Terms of Service and Limitations of Liability

  **Section 14.2: Mathematical Feasibility**
  Customer acknowledges that certain fairness metrics are mutually exclusive under conditions of imperfect prediction. Specifically, simultaneous satisfaction of Calibration within Groups and Equalized Odds is mathematically impossible when base rates differ across protected groups. Customer acknowledges that simultaneous satisfaction of Demographic Parity and Calibration within Groups is mathematically impossible when base rates differ across protected groups. Customer acknowledges that satisfying Demographic Parity via constant prediction rates voids the Accuracy SLA.

  **Section 14.3: Indemnity**
  Aequitas Flow guarantees the accurate calculation of selected metrics based on provided data. Aequitas Flow does not guarantee that selected metrics can be satisfied simultaneously. Customer assumes all liability for policy choices enacted via the Fairness Slider. Customer indemnifies Aequitas Flow against claims arising from the inherent trade-offs between error rate constraints and calibration constraints.

  **Section 14.4: Data Integrity**
  Audit validity is contingent upon the accuracy of uploaded protected attribute files. Aequitas Flow is not liable for compliance failures resulting from mislabeled ground truth data, proxy variable leakage, or the assumption that uploaded categories reflect legal definitions of protected classes.

  **Section 14.5: Intersectionality**
  Customer acknowledges that adding protected classes increases the number of subgroups exponentially. Aequitas Flow does not guarantee statistical significance within sparse subgroup cells. Empty cell warnings do not constitute compliance failures.

  ---

  *© 2024 Aequitas Flow Systems. All rights reserved. Patents Pending.*
