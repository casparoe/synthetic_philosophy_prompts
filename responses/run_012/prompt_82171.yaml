  7.  **Final Polish:** Ensure the distinction between *concept definition* and *concept application* is clear. The concept "Successor" doesn't change; the *application* of the rule involving "Successor" shifts to "Predecessor" because the context forces it. Wait, actually, in Copycat, the *concept* "Successor" can slip to "Predecessor" in the mapping. I need to be precise: the *role* filled by the concept slips.

      *Refined thought:* In the Slipnet, nodes are concepts. Links have weights. Activation spreads. If "Successor" is highly active but blocked (z has no successor), activation spills to "Predecessor". If "Predecessor" becomes active enough, a codelet might propose a mapping that uses "Predecessor" instead. That *is* the slip. It's a dynamic re-routing of the conceptual path.

