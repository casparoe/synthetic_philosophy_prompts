answer: |-
  Here is a breakdown of the phrase "judge them by the standards of their time." It is not a single argument; it is an ambiguity fallacy that smuggles in five distinct claims. Some are trivial truths, some are defensible nuances, and one is a flat-out falsehood used to shield power.

  You can paste the section below directly into a reply.

  ***

  ### The "Standards of Their Time" Menu
  When someone says this, they are usually conflating the following five claims. Here is the verdict on each.

  #### 1. The Epistemic Claim ("They Couldn't Have Known")
  *   **The Claim:** They lacked the factual information or philosophical concepts we have now. They literally could not conceive that their actions were wrong.
  *   **Verdict:** **False (in moral contexts).**
  *   **The Dissection:** This works for science (you can't blame a 17th-century doctor for not using germ theory). It fails for morality. In almost every era cited (slavery, colonialism, genocide), there were contemporaries explicitly arguing that these things were wrong.
      *   *Example:* Thomas Jefferson knew slavery was wrong; he called it a "moral depravity" and a "hideous blot." He chose to do it anyway.
      *   *The Kicker:* If you argue they "couldn't know," you ignore the abolitionists, indigenous critics, and religious dissenters who *were* alive at the time and *did* know.

  #### 2. The Relativist Claim ("Morality Is Time-Bound")
  *   **The Claim:** Right and wrong are defined by the era. Slavery was objectively "acceptable" in 1780, so it wasn't actually wrong then, even if it is wrong now.
  *   **Verdict:** **False (and Self-Defeating).**
  *   **The Dissection:** This is hard moral relativism. If you accept this, you lose the ability to praise the figure as well as condemn them. If morality is just local custom, then Churchill wasn't "brave" in 1940; he was just following the 1940 script.
      *   *The Kicker:* You cannot use this to defend them without also invalidating your admiration for them. Heroes require universal virtues, not local ones.

  #### 3. The Conformity Claim ("Social Cost Was Too High")
  *   **The Claim:** They might have known it was wrong, but the social, economic, or political cost of dissent was too high. They were "shaped not to care" because caring was suicidal.
  *   **Verdict:** **Defensible (but mitigates, doesn't erase).**
  *   **The Dissection:** This is a claim about moral luck and pressure. It is true that dissent was dangerous. However, this claim *mitigates* blame; it does not *eliminate* it. It explains why they failed, it doesn't prove they succeeded.
      *   *The Kicker:* This applies less to the powerful. Jefferson, Churchill, and Columbus were elites. They had *more* safety to dissent than the average person, not less.

  #### 4. The Selection Bias Claim ("Whose Standards?")
  *   **The Claim:** "The standards of the time" refers to the norms of the dominant class. Dissenters (abolitionists, victims, radicals) are excluded from counting as part of "the time."
  *   **Verdict:** **False (Question-Begging).**
  *   **The Dissection:** This is the move you identified. It defines "the time" as "the people in charge." It pretends history is a monolith when it is always a debate.
      *   *The Kicker:* If an abolitionist existed in 1780, then "the standards of the time" included abolitionism. To ignore them is to rig the definition of "time" to protect the powerful.

  #### 5. The Relevance Claim ("Don't Focus on Flaws")
  *   **The Claim:** We should judge them primarily on their achievements, not their moral failings, because the moral failings don't change their historical impact.
  *   **Verdict:** **Platitude (True but Toothless).**
  *   **The Dissection:** This isn't actually about moral standards; it's about prioritization. It says, "Their badness doesn't cancel their greatness."
      *   *The Kicker:* This concedes the criticism! It admits they did the bad thing, but argues it doesn't matter for the specific point at hand. It is not a defense of the action, only a request to change the subject.

  ***

  ### The "Checkmate" Test
  Your opponent uses the slogan to imply criticism is **off the table**. Here is which claims actually support that conclusion:

  *   **Claims 1 & 2 (Couldn't Know / Relativism):** These are the only ones that theoretically make criticism **impossible**. But they are factually false. Contemporaries *did* know better, and morality isn't purely local.
  *   **Claim 3 (Conformity):** This makes criticism **less harsh**, but not impossible. It turns a monster into a coward, but not into a saint.
  *   **Claim 4 (Selection Bias):** This makes criticism **illegitimate** by definition, but only by cheating. It excludes the evidence (the dissenters) that proves the criticism is valid.
  *   **Claim 5 (Relevance):** This admits criticism is **valid** but asks you to ignore it.

  **Verdict:** The slogan only works as a "checkmate" if you rely on False claims (1 & 2) or Cheating (4). If you rely on the Defensible claims (3 & 5), you have admitted the figure was flawed and are only arguing about the *weight* of that flaw.

  ***

  ### Deep Dive: The "Whose Time?" Trap
  This is the specific move where "his time" quietly means "the powerful people of his time."

  *   **The Fiction:** It treats an era as having a single moral consensus.
  *   **The Reality:** Every era has a "Dominant Standard" (what the powerful do) and a "Dissenting Standard" (what the critics say).
  *   **The Trick:** When you point out a contemporary critic (e.g., "But there were anti-slavery writers in Jefferson's Virginia"), the opponent will say, "Yes, but they were fringe."
  *   **The Counter:** "Fringe" is a judgment made by the winners. If we judge Jefferson by the standards of the *slaveholders*, he looks normal. If we judge him by the standards of the *slaves* or the *Quakers*, he looks criminal. To choose the slaveholder's standard as the "Standard of the Time" is to side with the oppressor in the historical debate.

  **The Line to Use:**
  > "When you say 'standards of their time,' do you mean the standards of the *oppressors* of their time, or the *victims*? Because they didn't agree. If you pick the oppressor's standard, you aren't defending history, you're defending power."

  ***

  ### Copy-Paste Summary for Twitter/Debate
  "If you say 'judge them by the standards of their time,' you need to specify which claim you're making:

  1.  **They couldn't know better?** False. Contemporaries (abolitionists, victims) told them explicitly.
  2.  **Morality is relative?** Then you can't praise them either. Heroism requires universal virtue.
  3.  **Social pressure was too high?** Maybe, but elites like Jefferson/Churchill had *more* freedom to dissent, not less.
  4.  **Whose standards?** The masters' or the slaves'? Choosing the masters' norms as the 'standard' is bias, not history.

  The slogan only works as a 'checkmate' if you ignore contemporary dissenters. If you acknowledge them, the defense collapses into 'he was a product of his class,' which is an admission of guilt, not innocence."
