answer: |-
  **Materials**
  *   **Two opaque bags.** Label them "Bag 1" and "Bag 2".
  *   **40 poker chips** (20 Red, 20 Black).
  *   **Preparation:** Put 10 Red and 10 Black in Bag 1 (show this to the class). Put the remaining 20 chips in Bag 2 in any fixed ratio (e.g., 14 Red, 6 Black) *before* class, sealed so the mix is invisible.
  *   **Choice Slips:** Half-sheet papers with two checkboxes:
      *   *Q1: To win, I need a RED chip. I choose Bag [1] [2]*
      *   *Q2: To win, I need a BLACK chip. I choose Bag [1] [2]*
  *   **Payoff:** Candy bars (one per winner).

  **Rules & Payoff Scheme**
  1.  **Stakes:** Each student plays for themselves. If their chosen bag yields the target color, they get a candy.
  2.  **Independence:** Emphasize that Bag 2's composition was fixed before class and has not changed. It is not being randomized *now*; it is merely unknown.
  3.  **Anonymity:** Do not put names on slips. You want honest preferences, not performance.
  4.  **Execution:** Collect slips. Do not draw chips yet. Tally the choices on the board live.

  **Timeline (75 Minutes)**

  *   **0–10: Setup.** Display Bag 1 (count chips visibly). Display Bag 2 (sealed, explain contents are fixed but hidden). Distribute slips.
  *   **10–25: The Choice.** Students mark Q1 (Red) and Q2 (Black). Collect slips. Shuffle them.
  *   **25–35: The Reveal (Beat 1).** Tally results on the board.
      *   *Expected Pattern:* Majority pick Bag 1 for Red AND Bag 1 for Black.
      *   **The Trap:** Ask a volunteer: "If you prefer Bag 1 for Red, you must believe Bag 1 has more Reds (or equal). If you prefer Bag 1 for Black, you must believe Bag 1 has more Blacks. How can it have more of both?" Let the silence sit. They are committed to inconsistent subjective probabilities.
  *   **35–45: The Fixed Composition (Beat 2).** Open Bag 2. Count the chips publicly.
      *   Reveal the actual ratio (e.g., 14 Red).
      *   Ask: "Knowing this now, did the risk change? No. The chips were sitting there the whole time. You weren't avoiding risk; you were avoiding the *gap* in your knowledge."
  *   **45–75: Debrief & Theory.**

  **Debrief: Mapping the Experience**
  1.  **Risk vs. Uncertainty:** Define Knightian uncertainty. Bag 1 was **Risk** (known probabilities). Bag 2 was **Uncertainty** (unknown probabilities, though ontologically fixed).
  2.  **The Violation:** Walk through the **Sure-Thing Principle** (Savage). If you prefer Bag 1 regardless of whether Bag 2 is Red-heavy or Black-heavy, you should pick Bag 1 always. But most people pick Bag 1 only because they don't know Bag 2's mix.
  3.  **Formalizing the Inconsistency:**
      *   Let $P(R)$ be subjective prob of Red in Bag 2.
      *   Choice 1 (Bag 1 for Red) implies $0.5 > P(R)$.
      *   Choice 2 (Bag 1 for Black) implies $0.5 > P(Black)$, so $0.5 > 1 - P(R)$, meaning $P(R) > 0.5$.
      *   Students hold $P(R) < 0.5$ and $P(R) > 0.5$ simultaneously.
  4.  **Rationalizing It:** Introduce **MaxMin Expected Utility** (Gilboa & Schmeidler). Students aren't maximizing expected utility; they are maximizing the *minimum* possible payoff. They treat the unknown distribution as an adversarial move against them. This requires dropping the Independence Axiom.

  **Predictable Problems & Fixes**
  *   **"Bag 2 is probably 50/50 anyway."** Students assume uniform priors. *Fix:* Emphasize during setup that the mix was determined by a random process they didn't see, but it is *not* necessarily uniform. Ask: "Would you bet your own money it's exactly 10/10?"
  *   **"I just wanted variety."** Some switch bags to feel diverse. *Fix:* In the tally, highlight the "Bag 1 / Bag 1" consistency vs. the "Bag 1 / Bag 2" split. The paradox relies on the majority choosing Known/Known.
  *   **Payoff Apathy.** If candy doesn't matter, they randomize. *Fix:* Bring good candy. Or use "Points toward a final exam bonus" if policy allows.

  **Limitations: Where the Game Ends**
  Be honest with them: This activity proves **inconsistency**, not **irrationality**.
  1.  **Descriptive vs. Normative:** The game shows that Subjective Expected Utility (SEU) cannot describe their behavior. It does not prove SEU *should* describe their behavior.
  2.  **The Normative Gap:** You must argue why adhering to the Sure-Thing Principle is necessary for rationality. Is avoiding ambiguity a cognitive bug, or a robust heuristic for a world where unknown distributions often signal manipulation? The game generates the puzzle; your argument must resolve whether the puzzle is a mistake or a feature.
  3.  **Single Shot:** Real learning happens with repetition. One-off games capture intuition, but stable preferences require repeated trials. This session captures the intuition; the reading list must handle the stability.

  **Word Count Check:** ~950 words.
  **Tone Check:** Instructional, direct, respects the "show don't tell" constraint.
  **Constraint Check:** No "ambiguity" until debrief. Beat 2 included. Limitations honest.

  *Ready to run.*
