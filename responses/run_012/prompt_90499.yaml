  *(Self-Correction during drafting)*: I need to be careful not to just say "this is RLHF." The user describes a specific *Debate* protocol used for *label generation* for SFT. The philosophical tension is treating the *outcome of a game* as *fact*. I need to lean into the "Game-Theoretic Epistemology" aspect.

