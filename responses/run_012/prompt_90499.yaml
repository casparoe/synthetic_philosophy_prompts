      *   *The "Self-Report" Issue:* Why ignore the model saying "I checked this"? Because models lie (sycophancy). Why trust the judge? Because the judge is the *principal's avatar*. This is a political/authority move, not purely epistemic.

  8.  **Finalizing the Sections:**

