answer: |-
  You have identified the exact fracture point in liberal theory. Your friend's "Paradox of Tolerance" is a blunt instrument that fails to distinguish between *odious speech* and *structural threats*. Your own intuition is more nuanced, but as you suspected, it harbors a contradiction: you are prioritizing the *structure of debate* (Case 7) over *physical safety* (Case 3).

  You asked for a simple principle that forces a choice rather than a complex one that saves everything. Here is that principle.

  ### The Principle of Reciprocal Rights

  > **"A group forfeits the protection of tolerance when the successful realization of its core goals necessitates the systematic denial of a fundamental human right to others."**

  **Fundamental Rights** are defined here as: Life, Liberty, Political Participation (Vote), and Freedom of Conscience/Speech.

  This principle does not ask if the group is offensive, hateful, or even dangerous in the abstract. It asks only: *If this group got exactly what they wanted, would someone else lose a basic right?*

  ### The Cost: Which Verdict You Must Drop

  To apply this principle consistently, **you must abandon your verdict on Case (3).**

  *   **Case (3) (Church teaching death for apostates):** If their goal is realized, apostates lose the **Right to Life**. Under the Principle of Reciprocal Rights, this group is not protected, regardless of their current political weight. Belief is protected; doctrine that mandates rights-violation is not.
  *   **Case (7) (Movement to make criticism illegal):** If their goal is realized, citizens lose the **Right to Speech**. They are not protected.

  **Why this is the necessary trade-off:**
  Your current stance (Protect 3, Ban 7) implies that the *Right to Speech* is more vital to the social contract than the *Right to Life*. You feel this is "monstrous" because, ethically, it is. If you ban a group because they would jail critics (7), you must logically ban a group because they would kill apostates (3). If you protect the church because "it's just belief," you must protect the movement because "it's just a platform." You cannot have both.

  Most liberal democracies actually fudge this by protecting private belief (3) while banning anti-democratic platforms (7). But since you asked for a principle that resolves your internal contradiction, you must align your hierarchy of values. **Life trumps Speech.** Therefore, if 7 is banned, 3 must be banned.

  ### Application to Your Nine Cases

  1.  **Neo-Nazis marching:** Goal is assembly/expression. Does not necessitate denying others' rights. **Protected.** (Matches your verdict).
  2.  **Abolish elections:** Goal necessitates denying **Political Participation**. **Banned.** (Matches your verdict).
  3.  **Death to apostates:** Goal necessitates denying **Right to Life**. **Banned.** (**Contradicts your verdict**).
  4.  **Expel ethnic group:** Goal necessitates denying **Liberty/Safety**. **Banned.** (Matches your verdict).
  5.  **Genetic inferiority lecturer:** Goal is expression/research. Does not necessitate denying rights (students can opt-out). **Protected.** (Matches your verdict).
  6.  **Ex-Muslim critics:** Goal is expression. Does not necessitate denying rights. **Protected.** (Matches your verdict).
  7.  **Ban criticism of religion:** Goal necessitates denying **Freedom of Speech**. **Banned.** (Matches your verdict).
  8.  **Muhammad cartoon:** Goal is expression. Does not necessitate denying rights. **Protected.** (Matches your verdict).
  9.  **Opt-out community:** Goal is separation. Does not necessitate denying rights of outsiders. **Protected.** (Matches your verdict).

  ### Application to Your Two New Cases

  **Case A: A popular, entirely tolerant movement that wants to ban a hostile foreign state's TV channel from broadcasting here.**
  *   **Analysis:** The movement itself is tolerant, but its *goal* is to use state coercion to restrict the **Right to Receive Information** (a corollary of Speech). Even if the foreign state is hostile, a blanket ban enforced by the domestic state denies citizens access to information.
  *   **Verdict:** **Banned (as a policy platform).** The movement can exist, but this specific plank violates Reciprocal Rights. You cannot vote for a platform that censors, even for "good" reasons, without establishing the precedent that the state decides what information is permissible.
  *   **Nuance:** If the "ban" is a sanction on the *foreign broadcaster* (not domestic receivers), it might pass, but if it prevents citizens from accessing it, it fails the principle.

  **Case B: A satirical party that runs on abolishing the senate as a joke and then genuinely wins seats.**
  *   **Analysis:** Their *core goal* is satire, not the actual denial of **Political Participation**. The "abolition" is not intended to be realized in a way that harms rights; it is performance art.
  *   **Verdict:** **Protected.** The principle hinges on the *necessitation of rights denial*. Since the abolition is a joke, no rights are actually threatened. However, if they pivot from joke to serious legislation, they immediately cross into Case (2) territory and lose protection.

  ### Summary

  The **Principle of Reciprocal Rights** saves your intuition on the political cases (2, 4, 7) and the speech cases (1, 5, 6, 8, 9), but it forces you to confront the moral cost of Case (3).

  You cannot consistently hold that a movement should be banned for threatening the *conversation* (7) while a church is protected for threatening the *participants* (3). If the Paradox of Tolerance means anything, it means the system must defend the existence of the people within it, not just the rules of the game. Drop Case (3), and the contradiction disappears.
