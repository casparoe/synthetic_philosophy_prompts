answer: |-
  **Interview Questions for Visiting Scholar on the Gibbard-Satterthwaite Theorem**

  **1. Resoluteness and Social Choice Correspondences**
  "Professor, the Gibbard-Satterthwaite theorem applies specifically to *resolute* social choice functions, meaning rules that always select a single winner. A common technical response is to move to social choice *correspondences*, which can return a set of tied outcomes. If a rule returns a menu of acceptable candidates rather than a single name, does this not technically circumvent the theorem? And if so, why should we view the inevitable tie-breaking procedure as part of the same logical problem rather than a separate administrative step?"

  *   **Follow-up:** (Anticipating he will argue that tie-breaking reintroduces resoluteness and thus manipulability.) "If the manipulability is located entirely in the tie-breaking rule, does that not suggest the core problem is *agenda control* rather than aggregation? If so, isn't the theorem actually a result about the power of the chairperson, which seems distinct from the impossibility of democratic will-formation you are critiquing?"

  **2. Randomization and the Gibbard 1977/78 Results**
  "You characterize allowing randomization as a 'change of subject.' However, Gibbard's later work shows that with lotteries, the only strategy-proof mechanisms are random dictatorships. While this preserves strategy-proofness, it seems to abandon the democratic ideal of deliberation. Is your objection that randomization fails to solve the *normative* problem of legitimacy, or are you claiming that a random dictatorship is logically equivalent to a deterministic one in terms of informational requirements?"

  *   **Follow-up:** (Anticipating he will argue that democracy requires deterministic accountability.) "But if the deterministic alternative is a *dictatorship* in the social-choice sense (one voter decides), isn't the random lottery normatively superior? By dismissing randomization as a change of subject, are you implicitly privileging certainty over fairness, even when certainty guarantees oligarchy?"

  **3. Domain Restrictions and Multidimensionality**
  "Restricting the domain to single-peaked preferences is often taught as the primary 'escape route' from the theorem, yielding the Median Voter Theorem. You suggest this is merely relaxing a background condition. Given that many political scientists argue real-world politics is inherently multidimensional—where single-peakedness generally fails—doesn't your dismissal of domain restrictions actually concede that the theorem *does* apply to most real-world legislatures? How do you reconcile calling the theorem 'overread' while admitting its conditions hold in the multidimensional cases that matter most?"

  *   **Follow-up:** (Anticipating he will argue that multidimensional chaos proves the theorem's conditions are too strict for a theory of *stable* democracy.) "If stable democracy requires one-dimensional issues, and the theorem shows one-dimensional issues are fragile, isn't the theorem telling us that stability is the exception rather than the rule? Does your 'overread' claim risk minimizing the severity of the instability problem in complex policy spaces?"

  **4. Dominant Strategies vs. Bayesian Incentive Compatibility**
  "Your positive proposal distinguishes strategy-proofness from 'strategy-proofness for the right reasons,' focusing on informational robustness. This brings us to the distinction between dominant-strategy incentive compatibility (DSIC) and Bayesian incentive compatibility (BIC). If we accept BIC, we allow manipulation when voters have specific priors about others. Do you view BIC as a genuine weakening of the theorem's force, or merely as shifting the burden from the mechanism designer to the voters' epistemic state?"

  *   **Follow-up:** (Anticipating he will argue that BIC is fragile because priors are rarely common knowledge.) "But if voters *never* possess the information required to verify dominant strategies, isn't DSIC a vacuous ideal? If 'strategy-proofness for the right reasons' requires robustness to *all* informational assumptions, aren't you simply reconstructing the dominant strategy requirement under a different name, without solving the impossibility result?"

  **5. Transfers and the VCG Mechanism**
  "Clarke-Groves (VCG) mechanisms achieve strategy-proofness by introducing monetary transfers. You classify this as changing the subject because politics is non-market. However, political scientists often model 'logrolling' as an implicit transfer of utility. If side-payments occur informally in legislatures, does excluding explicit transfers in the theoretical model not blind us to the actual mechanisms of manipulation? Is the 'no transfers' condition a normative constraint on democracy, or an empirical falsehood?"

  *   **Follow-up:** (Anticipating he will argue that formalizing transfers corrupts the equality of political voice.) "If informal logrolling is ubiquitous and manipulable, but formal VCG is strategy-proof, doesn't your position imply we should *avoid* formalizing exchanges? That seems to suggest we should keep corruption informal to preserve the 'purity' of the voting rule, which is a counterintuitive normative stance."

  **6. Individual vs. Group Strategy-Proofness**
  "The Gibbard-Satterthwaite theorem concerns *individual* strategy-proofness. Yet, in modern party systems, voters act as coalitions. There are stronger impossibility results for group strategy-proofness. If a mechanism is immune to individual manipulation but vulnerable to coalitional manipulation, does your distinction regarding 'right reasons' survive? Or does the existence of parties make individual strategy-proofness irrelevant?"

  *   **Follow-up:** (Anticipating he will argue that coalitions are harder to coordinate, so individual SP is the necessary baseline.) "But parties are highly coordinated institutions. If a voting rule is individually strategy-proof but fails against coalitions, isn't it functionally manipulable in any realistic democracy? Does focusing on the individual level grant the theorem a significance it doesn't warrant in a partisan environment?"

  **7. The Revelation Principle and Equilibrium Concepts**
  "Mechanism design often relies on the Revelation Principle to argue that we can focus on direct revelation mechanisms without loss of generality. However, this principle depends heavily on the equilibrium concept employed (e.g., Nash vs. Dominant Strategy). Given your emphasis on informational assumptions, which equilibrium concept do you believe the Gibbard-Satterthwaite theorem actually relies upon? Does the theorem lose its force if we reject the assumption that voters can solve for a Nash equilibrium?"

  *   **Follow-up:** (Anticipating he will argue that the theorem is a combinatorial result that doesn't strictly need equilibrium concepts, but applies to the SCF directly.) "If it is a combinatorial result about functions rather than equilibria, doesn't that make it *more* robust, not less? If the impossibility holds regardless of what equilibrium voters play, how does varying our 'informational assumptions'—as your positive proposal suggests—actually mitigate the theorem's constraints?"

  **8. Empirical Predictions: Too Much or Too Little?**
  "Moving to empirical terrain: Does the Gibbard-Satterthwaite theorem predict too much or too little observed strategic voting? Behavioral evidence suggests many voters vote sincerely despite incentives to manipulate. If the theorem predicts universal manipulation but we observe sincerity, is the problem with the theorem's psychological assumptions, or does it suggest that 'manipulability' is not the primary driver of institutional design?"

  *   **Follow-up:** (Anticipating he will argue that voters are often too ignorant to manipulate, which supports his 'informational assumptions' view.) "If voters are too ignorant to manipulate strategically, why is strategy-proofness a desirable property at all? If the threat of manipulation is low due to cognitive limits, isn't the entire search for strategy-proof mechanisms a solution to a problem that rarely manifests in practice?"

  **9. Normative Upshot and Democratic Theory**
  "Finally, regarding the normative upshot: You reject the libertarian conclusion that we should defer to markets or experts, but you also reject the elitist conclusion that democracy is impossible. If the theorem is overread, and the escape routes are changes of subject, what is the positive institutional recommendation? Are we to design mechanisms that are manipulable but transparent, or does your concept of 'strategy-proofness for the right reasons' point toward a specific type of deliberative process that standard social choice theory ignores?"

  *   **Follow-up:** (Anticipating he will argue for institutions that manage manipulation rather than eliminate it.) "If we accept that manipulation is inevitable and merely manage it, doesn't that collapse the distinction between 'voting' and 'bargaining'? If the normative upshot is simply 'manage the manipulation,' what work is the social choice framework doing that a realist political theory of power and bargaining wouldn't do better?"
