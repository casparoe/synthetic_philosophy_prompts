answer: |-
  **Project Title:** Probabilistic Belief and Performative Promises: Resolving the Surprise Exam Paradox

  **Research Question**
  The Surprise Exam Paradox arises when a teacher announces a surprise exam next week, leading students to reason via backward induction that the exam is impossible, yet the exam occurs and surprises them. My project asks: **Can the paradox be dissolved by modeling "surprise" as a threshold of subjective probability rather than binary certainty, and by interpreting the teacher's announcement as a commitment to act rather than a prediction of fact?**

  **Background and Motivation**
  Standard solutions typically attack the students' logic (claiming a step is invalid) or the teacher's truthfulness (claiming the announcement was self-defeating). Epistemic logic approaches often rely on complex modal operators beyond my current training. However, these approaches share a flaw: they treat "surprise" as the total absence of knowledge (certainty = 0). In reality, students feel surprised even if they assigned a non-zero chance to an event. Furthermore, standard analyses treat the announcement as a static proposition about the world. I hypothesize that the announcement is performative: it creates an obligation for the teacher, meaning the "fact" of the exam is not fixed until the teacher acts. This distinction is often overlooked in logical analyses that assume a fixed timeline. By combining a probabilistic view of belief with a volitional view of the announcement, I aim to show the students' backward induction fails because it treats a future intention as a past fact.

  **Methodology**
  Over three months, I will develop a formal model using basic probability theory accessible at the high school level.

  1.  **Month 1: Conceptual Framework.** I will refine the distinction between *knowledge* (binary) and *degree of belief* (0 to 1). I will define "surprise" operationally: an exam on day $d$ is surprising if the student's subjective probability $P(Exam_d) < T$, where $T$ is a threshold (e.g., 0.5).
  2.  **Month 2: Building the Model.** I will construct a five-day model. Instead of assuming the exam *must* happen (which triggers backward induction), I will model the teacher's choice as a variable. The students update their probabilities daily using Bayes' Rule as days pass without an exam. Crucially, I will model the teacher's announcement not as "There is an exam," but as "I commit to choosing a day where $P(Exam_d) < T$."
  3.  **Month 3: Analysis and Writing.** I will test if there exists a probability distribution where the teacher can fulfill her commitment. I will write up the results, focusing on where the backward induction breaks down under these new definitions.

  **Expected Results and Success Criteria**
  A successful project will produce a coherent probability distribution where the teacher can select a day such that the students' probability assignment remains below the surprise threshold $T$. Specifically, the model should demonstrate that as the week progresses, the students' rising anxiety (increasing probability) does not necessarily reach certainty (1.0) before the week ends, allowing the teacher to act.

  The project would fail if:
  1.  The math inevitably forces probabilities to 0 or 1, recreating the original paradox.
  2.  The "promise" interpretation proves logically incoherent (e.g., if a promise about a surprise inherently contradicts itself).
  3.  I cannot formalize the model without using advanced mathematics beyond my current scope.

  **Feasibility**
  This project requires only algebra and basic probability, which I have covered in school. The three-month timeline allows for deep reading in the first month, ensuring I do not duplicate existing probabilistic solutions, followed by iterative modeling. The scope is narrow enough to be completed after school hours but substantial enough to contribute a fresh perspective to a classic problem.
