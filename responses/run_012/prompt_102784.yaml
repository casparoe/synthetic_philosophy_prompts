answer: |-
  **Title:** The Normative Transfer: A Defense of Promissory Obligation in Parfit's Hitchhiker

  **Introduction**

  The standard resolutions to Parfit's Hitchhiker case share a common defect: they attempt to solve a normative problem with psychological or prudential tools. Whether by suggesting the hitchhiker cultivate a trustworthy character, care about long-run reputation, or pre-commit via a "resoluteness pill," these accounts accept the premise that the hitchhiker lacks a reason to pay upon arrival. They seek to manufacture a motive where self-interest runs dry. This approach misunderstands the ontology of a promise. A promise is not a prediction of future behavior, nor is it a prudential investment in a social standing. It is an undertaking that transfers to the promisee a claim over the promisor's future conduct. This transfer is completed the instant the promise is made. On this "Transfer Account," the hitchhiker who refuses to pay is not exhibiting a tension between rationality and morality; he is simply refusing to honor a claim he has already alienated. The money, normatively speaking, is no longer his to keep.

  This paper argues for the Transfer Account by testing it against two limiting cases: one where the promisee cannot enforce the claim (the Dead Driver), and one where the promisor cannot violate it (the Pre-commitment). I will demonstrate that the Transfer Account preserves the binding nature of the promise in the first case and explains the intuitive distinction in the second. Finally, I will defend the view against the strongest objection from instrumentalist theories of trust, arguing that only the Transfer Account can explain the directed nature of promissory wrongs.

  **The Mechanics of the Transfer**

  To understand why the hitchhiker is obligated to pay even when it is not in his interest, we must reject the idea that obligations are grounded in the promisor's continuing reasons for action. On the Transfer Account, the act of promising is a normative transaction analogous to a property transfer. When the hitchhiker says, "I promise to pay," he does not merely describe his future intent; he grants the driver a right to his payment. Before the promise, the hitchhiker has full authority over his money. After the promise, that authority is divided: the hitchhiker retains possession, but the driver holds the claim.

  This explains why the "moment of action" (arrival in the city) is not the moment of obligation creation. The obligation was created in the desert. The payment in the city is merely the discharge of a debt that already exists. Consequently, the hitchhiker's lack of self-interested reason to pay is irrelevant. To ask, "Why should I pay?" at the moment of arrival is like asking a debtor, "Why should I repay this loan now that I have spent the money?" The reason was secured at the inception of the agreement. The hitchhiker's refusal is not a rational calculation; it is a violation of the driver's right.

  **Test Case 1: The Dead Driver**

  Consider the first modification: The driver suffers a heart attack and dies immediately upon arrival. He leaves an estate, but no one knows the promise was made. The hitchhiker can keep the money without detection or social sanction. Does the promise still bind?

  Prudential and character-based accounts struggle here. There is no reputation to protect, no character to cultivate in the eyes of others, and no future interaction to secure. If the obligation were based on the utility of the practice, a secret violation that harms no one's trust seems permissible.

  The Transfer Account, however, yields a clear verdict: the hitchhiker is obligated to pay the estate. Because the promise transferred a claim to the driver, that claim becomes an asset of the driver's person. Upon death, personal assets transfer to the estate. The normative status of the money changed in the desert; it became the driver's property, held in trust by the hitchhiker. The fact that the claimant is dead and the estate unaware does not negate the ownership right. A theft is not rendered morally null because the victim is unconscious; similarly, a promissory violation is not nullified because the promisee cannot enforce the claim.

  The hitchhiker might object that no harm is done. But on the Transfer Account, the wrong is not defined by harm, but by the violation of authority. The hitchhiker is acting on resources over which he no longer has sole authority. To keep the money is to assert a right he explicitly surrendered. The binding force of the promise survives the death of the promisee because the right created is an objective normative fact, not a subjective psychological state dependent on the promisee's awareness.

  **Test Case 2: The Pre-commitment**

  In the second case, the hitchhiker leaves an irrevocable instruction with his bank to pay the driver on arrival. At the moment of arrival, the hitchhiker has no choice; the payment is automatic. Does the promise bind, and why does this case feel morally different from the standard Hitchhiker scenario?

  The Transfer Account says the obligation is satisfied, but it acknowledges a crucial distinction in moral agency. In the standard case, the hitchhiker retains the power to violate the driver's claim. He must choose to recognize the driver's authority over his will. In the Pre-commitment case, the hitchhiker has engineered the situation so that the driver's claim is satisfied causally rather than volitionally at the moment of performance.

  Does the promise still bind? Yes, because the transfer of the claim occurred when the instruction was given and communicated to the driver. The driver was given assurance and a right to payment. However, the feeling that this case is "different" is not an illusion; it marks the difference between *fidelity* and *functionality*. In the standard case, the hitchhiker exercises the virtue of fidelity by subordinating his present self-interest to the claim he created. In the Pre-commitment case, he removes the possibility of infidelity.

  The Transfer Account explains this without resorting to prudentialism. The obligation exists in both cases because the claim was transferred. But the *moral worth* of the action differs because morality requires the possibility of doing otherwise. By removing his own agency at the moment of payment, the hitchhiker ensures the driver gets his due, but he deprives himself of the opportunity to honor the claim *as a moral agent* at that specific moment. The feeling of difference is the recognition that while the debt is paid, the relationship of trust was bypassed by a mechanism. The Transfer Account validates the obligation (the debt is real) while explaining the intuitive gap (the moral exercise is absent).

  **The Objection: Trust and Cooperation**

  The strongest objection to the Transfer Account comes from the instrumentalist or practice-consequentialist view. This objection holds that promises bind only insofar as they serve the social practice of trust and cooperation. On this view, the "Transfer" is a metaphorical fiction. There are no metaphysical claims floating in the ether; there are only expectations and the social utility of meeting them.

  The objector argues: "If the driver is dead and no one knows (Case 1), the practice of trust is not undermined by your silence. If you pay, you gain nothing; if you don't, the practice loses nothing. Therefore, you have no reason to pay. Your 'Transfer Account' posits a mystical obligation detached from human welfare. Promises are tools for cooperation, not ends in themselves."

  This objection is powerful because it appeals to a naturalistic understanding of reasons. Why should I care about a "normative fact" if it helps no one?

  **The Reply: Directed Duties vs. Social Goods**

  The instrumentalist objection fails because it cannot account for the *directed* nature of promissory obligation. If promises are merely about maintaining a useful social practice, then when I break a promise to you, I primarily wrong *society* by degrading the institution of promising. You are merely a bystander who suffers collateral damage.

  But this contradicts our moral experience. When the hitchhiker refuses to pay, the driver does not complain that "social trust has been weakened." He complains, "You lied to *me*." He feels personally wronged, not statistically disadvantaged. The instrumentalist view flattens the relational specificities of promising. It explains why we should have a practice of promising, but it cannot explain why *I* owe *you*.

  The Transfer Account captures this directionality. By promising, I do not just add to the general stock of social trust; I give *you* authority over *me*. This explains why the Dead Driver case still binds: even if the social practice isn't harmed by a secret violation, the specific right held by the driver (and now his estate) is violated. The estate has a grievance against the hitchhiker that no one else has. The instrumentalist cannot explain why the estate has a special standing to complain that a random observer does not.

  Furthermore, the instrumentalist view makes obligation too fragile. If I discover that breaking a specific promise would actually *increase* trust (perhaps by revealing a dangerous truth), the instrumentalist suggests I should break it. But the Transfer Account holds that the claim I transferred to you restricts my action regardless of the net social utility. The hitchhiker cannot justify keeping the money by arguing that his wealth will be put to better use. The driver's claim acts as a side-constraint on the hitchhiker's maximization of utility.

  **Conclusion**

  Parfit's Hitchhiker is not a puzzle about how to trick oneself into being rational. It is a puzzle about the source of normative reasons. Prudential accounts fail because they look for reasons in the wrong place: in the future consequences for the promisor. The Transfer Account locates the reason in the past act of the promise itself. By testing this view against the Dead Driver and Pre-commitment cases, we see that it preserves the binding nature of obligations even when enforcement is impossible and distinguishes between mechanical satisfaction and moral fidelity. Finally, by rejecting the instrumentalist objection, we affirm that promises create specific rights between persons, not just general social goods. The hitchhiker must pay not because it is useful, and not because he is a certain kind of person, but because the money is no longer his.
