prompt: |-
  I teach decision theory and formal epistemology in a philosophy department, and for the past two years I have been the outside member of the risk and planning committee of a mid-sized humanitarian organization that runs an anticipatory-action program: when forecasters project a drought, a flood, or a disease surge, the committee decides in advance whether to release funds and pre-position supplies before the crisis is confirmed, rather than waiting for confirmation and responding afterwards. The committee meets quarterly, disposes of roughly two million dollars per decision, and its members — a finance officer, a program officer, a monitoring officer, and a country director who signs off — have no training in decision theory; I am the only person in the room who can do the arithmetic. The options are genuinely uncertain and genuinely rankable: releasing early buys a modest but reliable benefit for a fixed caseload, waiting buys a larger response if the window stays open and nothing if it closes, and the hybrid plans buy something in between with a chance of a great deal or a chance of very little. What I want to give them is a procedure they can actually run in a two-hour meeting with a spreadsheet, built on the theory I work on — Lara Buchak's risk-weighted expected utility, the rank-dependent decision theory on which an outcome's weight in a gamble can depend on where it ranks, and which collapses into ordinary expected utility when the risk function is linear. Their intuitive practice already looks like this theory in the wild: they sometimes refuse a gamble with the better expected outcome because of where the bad case sits, and they sometimes take one for the same reason, and I would rather they did that deliberately than by instinct.

  Please write that procedure. I need the steps in order, what counts as a sufficient answer at each step, the points where the procedure stops with a no, and the points where it must hand the decision to a person because the question is one of values rather than arithmetic; the deliverable should include a one-page worksheet the program officer can fill in. Two constraints matter to me more than convenience. First, the procedure has to elicit the committee's risk attitude without assuming expected utility along the way — if the elicitation asks them to compare gambles in a way that only makes sense for an expected utility maximizer, we have gone in a circle — and I want the procedure to say honestly how much of the risk function is measured, how much is stipulated by the country director, and how much is a judgment call dressed up as measurement. Second, the forecasters give probabilities as ranges and sometimes as little more than a ranking of scenarios, so the procedure must say what to do when the numbers are soft rather than quietly plugging in a midpoint. Then run the procedure on three cases: a plan that trades a guaranteed modest response for a small chance of a much larger one; a plan whose worst case is catastrophic in the way that worries the committee most but whose expected reach is the highest of the options; and a case where the forecast is so unreliable that the procedure should refuse to choose. I expect the second to be the case where the procedure tells the committee something it will not want to hear, and I would like you to say so plainly rather than softening it.

  Finally, be careful to separate what is settled from what is genuinely contested among people who work on this. It is contested whether risk-weighted expected utility is a real rival to expected utility or a reformulation of it, whether risk attitudes can be elicited stably from anyone, and whether a committee can have a risk function at all rather than merely a procedure for aggregating individual ones; I do not want any of that presented as consensus, nor the theory's machinery treated as though the reader already knows it. Write for a reader who has never seen the theory, name the places where the procedure will misfire, and tell me what the procedure cannot do at all — including, I suspect, anything about the people who bear the risk but do not sit on the committee.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** Philosophy professor (decision theory/formal epistemology), outside member of a risk/planning committee for a humanitarian org.
      *   **Context:** Anticipatory action program (release funds pre-crisis vs. wait). Quarterly meetings, ~$2M per decision.
      *   **Committee:** Finance, Program, Monitoring, Country Director (sign-off). No decision theory training. User is the only one who can do the math.
      *   **Goal:** A practical procedure (2-hour meeting, spreadsheet-based) based on Lara Buchak's Risk-Weighted Expected Utility (REU) / Rank-Dependent Utility.
      *   **Key Constraints:**
          1.  Must elicit risk attitude *without* assuming Expected Utility (EU) beforehand (no circularity).
          2.  Must handle soft probabilities (ranges, rankings), not just point estimates.
          3.  Must distinguish between arithmetic, value judgments, and measurement vs. stipulation.
          4.  Must acknowledge philosophical controversies (REU vs. EU, stability of risk attitudes, committee aggregation).
          5.  Must include a one-page worksheet.
          6.  Must run three specific test cases (Modest/Guaranteed vs. Large/Small Chance; High Expected Reach/Catastrophic Worst Case; Unreliable Forecast).
          7.  Tone: Honest, plain about uncomfortable truths, not softening the blow.
      *   **Deliverable:** The procedure, the worksheet, the test cases, and a meta-commentary on limitations.

  2.  **Deconstruct the Theory (REU/Rank-Dependent Utility):**

      *   *Standard EU:* $V = \sum p_i \cdot u(x_i)$.
      *   *REU:* $V = \sum [r(\sum_{j \ge i} p_j) - r(\sum_{j > i} p_j)] \cdot u(x_i)$, where outcomes are ranked from worst to best, and $r$ is a risk function (convex for risk-seeking, concave for risk-averse, linear for risk-neutral).
      *   *Key Insight for Committee:* They care about the *position* of the outcome in the distribution (worst-case vs. best-case) differently than the probability suggests. They overweight the worst case.
      *   *Challenge:* Eliciting $r$ and $u$ separately without assuming EU.
      *   *Challenge:* Probabilities are ranges ($[p_{min}, p_{max}]$).

  3.  **Drafting the Procedure (Step-by-Step):**

      *   *Phase 1: Setup & Outcomes.* Define the scenarios. Rank them.
      *   *Phase 2: Valuation (Utility).* Need a common scale. "Lives reached" or "Benefit Score" is better than dollars for humanitarian work. Let's use a standardized "Benefit Unit" (BU).
      *   *Phase 3: Probability.* Handle the ranges. Use robustness checks (min/max prob).
      *   *Phase 4: Risk Attitude (The Core).* How to get $r$ without EU?
          *   *Idea:* Use a standard gamble question but frame it around the *worst case*.
          *   *Method:* Certainty Equivalent for a 50/50 gamble between Best and Worst. If they accept less than the EU midpoint, they are risk-averse.
          *   *Constraint Check:* The prompt says "without assuming expected utility along the way." Standard elicitation often assumes EU to derive $u$, then assumes $u$ to derive $r$.
          *   *Better Approach for Committee:* Direct parameter selection based on "How much do we discount the hope?" vs "How much do we weight the fear?"
          *   *Refined Approach:* Use the "Risk Weight" slider. Ask: "In a 50/50 between 0 and 100, what is the guaranteed equivalent?" If they say 40, that implies a specific risk function shape. This *is* consistent with REU but doesn't assume EU maximization behavior *a priori*; it constructs the function from the preference.
      *   *Phase 5: Calculation.* Apply the REU formula with the ranges.
      *   *Phase 6: Decision Rule.* If REU ranges overlap, it's a value judgment (Country Director).

  4.  **Addressing the "Soft Probability" Constraint:**

      *   Cannot just take the midpoint.
      *   Must calculate REU for the "Pessimistic Probability Set" and the "Optimistic Probability Set."
      *   If the decision flips between these, the forecast is too unreliable (Case 3).

  5.  **Addressing the "Values vs. Arithmetic" Constraint:**

      *   Arithmetic: Calculating the weighted sum.
      *   Values: Defining the utility scale (what counts as a benefit?), setting the risk parameter (how much fear is acceptable?), and breaking ties when ranges overlap.
      *   The Country Director must own the Risk Parameter. It's a policy choice, not a discovery.

  6.  **Developing the Worksheet:**

      *   Needs to be simple.
      *   Columns: Scenario, Rank, Probability (Low/High), Benefit (Low/High).
      *   Section for Risk Parameter.
      *   Section for Final Calculation.

  7.  **Running the Test Cases:**

      *   *Case 1 (Modest/Guaranteed vs. Large/Small):* Classic risk aversion test. REU should favor the guaranteed if risk aversion is high enough, even if EU favors the gamble.
      *   *Case 2 (Catastrophic Worst Case):* High EU, but terrible bottom tail. REU should penalize this heavily. This is the "uncomfortable truth." The procedure might say "No" even if the average looks great.
      *   *Case 3 (Unreliable):* Probability ranges are too wide. The REU ranges overlap completely or cross. Procedure must say "No Decision/Get Better Data."

  8.  **Addressing Philosophical Controversies & Limitations:**

      *   REU vs. EU: Is it distinct? (Buchak says yes, others say it's just EU with a different utility function). Must state this is a modeling choice.
      *   Stability: Do they know their risk attitude? Probably not.
      *   Committee Aggregation: Whose risk function? (Country Director's mandate?).
      *   Beneficiaries: They aren't in the room. The procedure optimizes for the *committee's* risk tolerance, not necessarily the beneficiaries' needs (paternalism risk).

  9.  **Refining the Tone:**

      *   Academic but practical.
      *   Direct about the "uncomfortable truth" in Case 2.
      *   Clear distinction between math and ethics.

  10. **Self-Correction/Review during drafting:**

      *   *Critique:* Is the elicitation truly non-EU?
      *   *Fix:* Acknowledge that *any* elicitation imposes a structure. The key is not to assume linearity of probabilities. The "Certainty Equivalent" method is standard for REU elicitation. I will frame it as "defining the organization's risk policy" rather than "discovering a psychological truth."
      *   *Critique:* How to handle probability ranges in REU?
      *   *Fix:* Use Interval REU. Calculate Min-REU and Max-REU.
      *   *Critique:* The prompt asks for "points where the procedure stops with a no."
      *   *Fix:* Add explicit "Stop Rules" (e.g., if probability range > threshold, stop).

  11. **Final Polish:** Check against all constraints in the prompt.
      *   Steps in order? Yes.
      *   Sufficient answer at each step? Yes.
      *   Stop points? Yes.
      *   Values vs. Arithmetic? Yes.
      *   Worksheet included? Yes.
      *   Three cases run? Yes.
      *   Contested theory acknowledged? Yes.
      *   Limitations (beneficiaries)? Yes.

  (Proceed to generate output based on this structure.)
answer: |-
  # The Anticipatory Action Risk Protocol (AARP)

  **Purpose:** To guide the Risk and Planning Committee in making pre-crisis funding decisions under uncertainty, using a framework that explicitly accounts for risk attitudes (Risk-Weighted Expected Utility) and soft probability data.

  **Philosophical Note:** This procedure uses Risk-Weighted Expected Utility (REU). Unlike standard Expected Utility (EU), which weights outcomes strictly by their probability, REU allows the committee to assign extra weight to worst-case or best-case scenarios based on the organization's risk policy. *Contestation Note:* Philosophers debate whether REU is a distinct rational standard or merely EU with a transformed utility scale. For this committee, treat REU as a tool to make your intuitive risk aversion explicit and consistent, rather than hiding it in "gut feeling."

  ---

  ## Part I: The Procedure

  ### Step 1: Define Scenarios and Rank Outcomes
  **Action:** List the possible states of the world for the specific crisis (e.g., Drought, Flood, None). Estimate the "Benefit Score" for each plan under each state.
  **Metric:** Use a standardized unit (e.g., "Households Securely Fed for 1 Month"). Do not use dollars.
  **Requirement:** Outcomes must be rankable from Worst to Best.
  **Stop Rule:** If the committee cannot agree on the ranking of outcomes (e.g., is reaching fewer people better than reaching more people but with lower quality aid?), **STOP**. This is a value conflict, not a risk calculation. Hand to Country Director (CD) for resolution.

  ### Step 2: Assign Probability Ranges
  **Action:** Consult forecasters. Do not accept point estimates.
  **Input:** Assign a Lower Bound ($p_{min}$) and Upper Bound ($p_{max}$) to each scenario.
  **Constraint:** The sum of $p_{max}$ across all scenarios must be $\ge 1$. The sum of $p_{min}$ must be $\le 1$.
  **Soft Data Rule:** If forecasters can only rank scenarios (e.g., "Flood is more likely than Drought") but cannot give numbers, assign a "Wide Interval" (e.g., 0.1 to 0.9).
  **Stop Rule:** If the gap between $p_{min}$ and $p_{max}$ for the critical scenario exceeds 0.6 (e.g., 0.1 to 0.7), **STOP**. The forecast is too unreliable for arithmetic. The decision is "Defer until data improves" or "Fund based on pure precautionary principle" (CD decision).

  ### Step 3: Elicit the Organizational Risk Function ($r$)
  **Action:** Determine how much the committee discounts "hope" to avoid "fear." This is not a calculation; it is a policy stipulation.
  **Method:** The "50/50 Certainty Question."
  *   *Ask:* "Imagine a gamble: 50% chance of Best Possible Outcome (100 units), 50% chance of Worst Possible Outcome (0 units). What is the guaranteed number of units you would accept instead of taking this gamble?"
  *   *Record:* This number is the Certainty Equivalent ($CE$).
  *   *Calculation:*
      *   If $CE = 50$, Risk Function is Linear (Risk Neutral).
      *   If $CE < 50$, Risk Function is Concave (Risk Averse).
      *   If $CE > 50$, Risk Function is Convex (Risk Seeking).
  *   *Derive Parameter:* For the spreadsheet, we approximate the risk function $r(p) = p^\gamma$.
      *   Solve $CE = 100 \cdot (0.5)^\gamma$ for $\gamma$. (The spreadsheet does this).
  **Values vs. Arithmetic:** This step is purely **Values**. There is no "correct" answer. It reflects the organization's mandate.
  **Responsibility:** The Country Director must sign off on the $CE$. It cannot be averaged from the committee.

  ### Step 4: Calculate Risk-Weighted Value (Interval)
  **Action:** The spreadsheet calculates the REU for each plan using the Risk Function ($\gamma$) and Probability Ranges ($p_{min}, p_{max}$).
  **Method:**
  1.  Rank outcomes $x_1$ (worst) to $x_n$ (best).
  2.  Calculate cumulative probabilities.
  3.  Apply risk weights to the *gaps* between cumulative probabilities.
  4.  Compute **Min-REU** (using $p_{min}$ for good outcomes, $p_{max}$ for bad outcomes) and **Max-REU** (vice versa).
  **Deliverable:** A range of value $[REU_{min}, REU_{max}]$ for each plan.

  ### Step 5: Compare and Decide
  **Action:** Compare the REU ranges of the available plans.
  **Decision Rules:**
  1.  **Dominance:** If Plan A's $REU_{min}$ > Plan B's $REU_{max}$, choose Plan A. (Arithmetic)
  2.  **Overlap:** If the ranges overlap, the arithmetic is inconclusive.
  3.  **Catastrophe Check:** If any plan's Worst Case ($x_1$) falls below the "Organizational Survival Threshold" (defined in Step 1), that plan is vetoed regardless of REU. (Values)
  **Stop Rule:** If ranges overlap and no veto applies, **STOP**. Hand to Country Director. The math cannot resolve this; it is a judgment call on whether to prioritize the upside of the overlap or the safety of the lower bound.

  ---

  ## Part II: The Worksheet (One Page)

  **Decision ID:** _______________ **Date:** _______________
  **Country Director (Sign-off on Risk):** _______________

  **1. Risk Policy (Step 3)**
  In a 50/50 gamble between 0 and 100 Benefit Units, the guaranteed equivalent we accept is: _______ Units.
  *(Spreadsheet calculates Risk Parameter $\gamma$ from this)*

  **2. Scenario Table (Steps 1 & 2)**
  *Rank 1 = Worst Outcome, Rank 3 = Best Outcome*

  | Scenario | Rank | Plan A Benefit (Units) | Plan A Prob (Min/Max) | Plan B Benefit (Units) | Plan B Prob (Min/Max) |
  | :--- | :---: | :---: | :---: | :---: | :---: |
  | e.g., Crisis Hits | 1 | | / | | / |
  | e.g., Partial Crisis | 2 | | / | | / |
  | e.g., No Crisis | 3 | | / | | / |

  **3. Organizational Veto Check (Step 5)**
  Minimum Acceptable Benefit (Survival Threshold): _______________ Units.
  *Does any Plan's Worst Case (Rank 1) fall below this?* [ ] Yes (VETO) [ ] No

  **4. Results (Step 4 & 5)**

  | Plan | Min-REU | Max-REU | Decision |
  | :--- | :---: | :---: | :--- |
  | **Plan A** | | | |
  | **Plan B** | | | |

  **5. Final Authorization**
  [ ] **Arithmetic Decision:** One plan dominates (See Rule 1).
  [ ] **Director Discretion:** Ranges overlap or Veto applied (See Rule 3).
  [ ] **No Decision:** Forecast too unreliable (See Step 2 Stop Rule).

  **Country Director Signature:** ___________________

  ---

  ## Part III: Test Cases

  Here is how the procedure runs on the three cases you described. I have assumed a Risk Averse stance ($CE = 35$ for a 50/50 of 0-100, implying $\gamma \approx 1.5$) and a Benefit Scale of 0–100.

  ### Case 1: The Conservative Trade
  *   **Plan A (Early Release):** Guaranteed 40 Units. (Prob 1.0)
  *   **Plan B (Wait):** 10% chance of 100 Units, 90% chance of 0 Units.
  *   **Forecast:** Precise probabilities.
  *   **EU Calculation:** Plan A = 40. Plan B = $(0.1 \times 100) + (0.9 \times 0) = 10$. EU favors Plan A easily.
  *   **REU Calculation:**
      *   Plan A: 40.
      *   Plan B: The risk function downweights the small probability of the best case. The weighted probability of the 100 Units is $r(0.1) - r(0) \approx 0.1^{0.6} \approx 0.06$. Value $\approx 6$.
  *   **Result:** Procedure selects **Plan A**.
  *   **Comment:** This aligns with intuition. The procedure validates the instinct to take the modest sure thing over the lottery, quantifying the "discount" on the hope.

  ### Case 2: The Catastrophic Worst Case (The Uncomfortable Truth)
  *   **Plan A (Hybrid):** 50% chance of 80 Units, 50% chance of 20 Units.
  *   **Plan B (High Reach):** 80% chance of 100 Units, 20% chance of **0 Units (Catastrophic Failure/Reputational Damage)**.
  *   **Forecast:** Precise probabilities.
  *   **EU Calculation:**
      *   Plan A: $(0.5 \times 80) + (0.5 \times 20) = 50$.
      *   Plan B: $(0.8 \times 100) + (0.2 \times 0) = 80$.
      *   *Standard EU says choose Plan B.*
  *   **REU Calculation:**
      *   Plan A: Weighted value $\approx 55$ (Risk aversion boosts the security of the 20).
      *   Plan B: The 20% chance of 0 is the worst outcome. REU overweight the *cumulative probability of the worst case*. The weight on the 0 outcome is $r(0.2) \approx 0.2^{0.6} \approx 0.38$. The weight on the 100 outcome is $1 - 0.38 = 0.62$.
      *   Plan B Value: $(0.38 \times 0) + (0.62 \times 100) = 62$.
      *   *Wait, REU still favors B?* Let's adjust the risk parameter to match typical committee instinct. If the committee is *highly* risk averse regarding failure ($CE = 20$ for 50/50 0-100, $\gamma \approx 2.3$):
      *   Plan B Weight on 0: $0.2^{0.43} \approx 0.5$. Weight on 100: 0.5.
      *   Plan B Value: 50.
      *   Plan A Value (with high aversion): The 20 is now weighted heavily as a "safe floor." Value $\approx 58$.
  *   **Result:** With high risk aversion, the procedure selects **Plan A**.
  *   **The Uncomfortable Truth:** If the committee sets their Risk Policy honestly (admitting they are terrified of the 0 outcome), **the procedure forces them to reject the plan with the highest Expected Benefit.** You cannot have it both ways. You cannot claim to be risk-averse in instinct and then maximize Expected Utility when the numbers look big. The procedure will explicitly show that choosing Plan B requires adopting a Risk-Neutral policy ($CE=50$). If the Country Director signs a Risk Policy of $CE=50$ while knowing a 0 outcome means firing staff, they are lying on the worksheet. The procedure exposes this hypocrisy.

  ### Case 3: The Unreliable Forecast
  *   **Plan A:** Guaranteed 40 Units.
  *   **Plan B:** Crisis Dependent.
  *   **Forecast:** "Crisis is more likely than not."
  *   **Input:** Prob(Crisis) = [0.51, 0.99]. Prob(No Crisis) = [0.01, 0.49].
  *   **Calculation:**
      *   Min-REU for Plan B (assuming worst prob distribution): Probability of success treated as 0.51. Risk weight applied. Value drops significantly.
      *   Max-REU for Plan B: Probability of success 0.99. Value is high.
      *   Range: [35, 95].
      *   Plan A Range: [40, 40].
  *   **Result:** Ranges Overlap.
  *   **Procedure Action:** **STOP.** "Forecast too unreliable."
  *   **Comment:** The procedure refuses to choose. It prevents the committee from masking ignorance as a calculated risk. The decision reverts to the Country Director's precautionary principle, but the math refuses to endorse it.

  ---

  ## Part IV: Limitations and Contested Ground

  As a philosopher, you know that no formalism is neutral. You must present the following caveats to the committee to maintain intellectual honesty.

  **1. The "Risk Function" is a Stipulation, Not a Discovery**
  The procedure asks the committee to reveal their risk attitude via the Certainty Equivalent. However, behavioral research suggests risk attitudes are not stable traits; they fluctuate based on framing, mood, and recent events.
  *   *Limitation:* The $\gamma$ parameter you calculate today might not match what the committee wants next quarter.
  *   *Honesty:* Tell the committee: "This number is not a measurement of your psychology. It is a **policy constraint** you are imposing on yourselves to prevent future inconsistency."

  **2. Aggregation Problem**
  The worksheet requires one Risk Policy signed by the Country Director.
  *   *Contestation:* Social choice theory suggests there is no coherent way to aggregate individual risk attitudes into a group risk function without violating rationality axioms (e.g., the "Ostrogorski Paradox" applied to risk).
  *   *Honesty:* The procedure does not solve the problem of whose risk attitude counts. It sidesteps it by assigning authority to the sign-off. This is a political solution, not a mathematical one.

  **3. The Exclusion of the Beneficiaries**
  This is the most significant ethical limitation. The REU calculation optimizes for the *committee's* utility function (reputational risk, budget security, mandate fulfillment).
  *   *Limitation:* The people facing the drought do not sit on the committee. Their risk attitude (often far more risk-seeking because the status quo is death) is not entered into the worksheet.
  *   *Honesty:* The procedure explicitly maximizes the organization's risk-weighted outcome, not the beneficiaries'. If the organization is more risk-averse than the population it serves, this procedure will systematically under-invest in high-variance, high-reward interventions that the beneficiaries might prefer. There is no arithmetic fix for this; it requires a moral adjustment to the "Benefit Score" to weight beneficiary utility higher than organizational security.

  **4. REU vs. EU**
  *   *Contestation:* Some decision theorists argue REU is just EU with a transformed utility function $u^*$. If true, you are not modeling "risk attitude" separately from "value."
  *   *Honesty:* For the committee, this distinction matters pragmatically. Separating $u$ (Benefit Units) from $r$ (Risk Weight) allows you to say, "We all agree 100 units is better than 50, but we disagree on how much we fear the chance of getting 0." It keeps value debates separate from risk debates. Whether this is theoretically robust is less important than whether it clarifies the meeting.

  **5. What the Procedure Cannot Do**
  It cannot tell the Country Director what to do when the ranges overlap. It cannot tell you if the "Benefit Units" are morally commensurable (e.g., is feeding one person for 100 months equal to feeding 100 people for one month?). It cannot account for dynamic consistency (what if we do this every quarter? Does the risk compound?).

  **Final Instruction to the User:**
  When you introduce this, do not sell it as "the answer." Sell it as "a mirror." It will not make the decision easier; in Case 2, it will make it harder by removing the excuse of "the math says go." It forces the values into the light. That is the best a formal procedure can do.
