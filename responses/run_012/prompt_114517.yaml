answer: |-
  **Joint Statement on Created Causation**

  **Part 1: Agreed Claims**

  1.  **Regularity:** Observable sequences exist where event B reliably follows event A. These **regularity** patterns are stable enough for scientific inquiry.
  2.  **Divine Dependence:** Every entity depends entirely on God for existence at every moment. Nothing exists independently of divine sustenance.
  3.  **Causal Language:** To call A a "cause" of B is to identify a reliable predecessor within a **regularity**, without necessarily settling the metaphysics of **production**.
  4.  **Human Agency:** Humans act voluntarily. We are morally responsible for our actions regardless of the underlying metaphysics of **production**.
  5.  **Miracles:** A miracle is an event where divine will suspends established **regularity** without altering the essential nature of creatures.
  6.  **Evidence:** No empirical observation alone definitively proves whether **production** is immediate (divine only) or mediated (creaturely powers).

  **Part 2: Disagreements Table**

  | Crux | Occasionalist Formulation | Concurrentist Formulation | Shared Case / Thought Experiment | Predictions & Falsification |
  | :--- | :--- | :--- | :--- | :--- |
  | **Ontology of Powers** | Creatures lack causal powers; they are **occasions** for divine action. | Creatures possess real powers activated by divine **concurrence**. | **Twin Worlds:** World O (God **produces** all effects directly on **occasion** of prior states) vs. World C (God sustains creatures who **produce** effects via **concurrence**). | **Occ:** Worlds are empirically identical. Falsified if a creature acts without God.<br>**Con:** Worlds are ontologically distinct. Falsified if **regularity** holds without divine **concurrence**. |
  | **Divine Action** | God **produces** every effect immediately. Creaturely action is metaphorical. | God **produces** effects mediately by sustaining creaturely **production**. | **Radium Decay:** An atom decays at *t*. | **Occ:** Decay is God's act on the **occasion** of time passing.<br>**Con:** Decay is the atom's power exercised via **concurrence**. |
  | **Human Agency** | God creates the act; the human "acquires" it. Responsibility lies in acquisition. | God concurs with the human will's **production** of the act. | **Raising an Arm:** A person wills and lifts an arm. | **Occ:** Will is the **occasion**; God moves the arm.<br>**Con:** Will exercises power via **concurrence** to move the arm. |
  | **Ground of Regularity** | **Regularity** is grounded in Divine Habit (God's consistent will). | **Regularity** is grounded in Creaturely Natures (sustained by God). | **Miracle:** Fire does not burn a prophet. | **Occ:** God breaks His habit.<br>**Con:** God suspends the fire's nature via withheld **concurrence**. |

  **Part 3: Applications and Verbal Analysis**

  **Paired-World Thought Experiment**
  In World O and World C, observable **regularity** is identical. In World O, God **produces** every effect directly upon the **occasion** of prior events. In World C, God grants creatures real powers, continuously sustained by **concurrence**, to **produce** effects.
  *   **Distinguishability:** Both camps agree no internal observer can distinguish the worlds empirically.
  *   **Evidence Against:** The Occasionalist would concede error if a creature **produced** an effect without divine will. The Concurrentist would concede error if creatures were shown to be inert **occasions** lacking sustained potency.

  **Specific Applications**
  *   **Radium Decay:** Both agree the atom decays at *t*. The dispute is whether the atom possesses the **production** capacity (Concurrentist) or is merely the **occasion** for God's **production** (Occasionalist).
  *   **Raising an Arm:** Both agree the agent is responsible. The Occasionalist sees the will as an **occasion** for God to move the limb. The Concurrentist sees the will as exercising power through **concurrence**.
  *   **Miraculous Event:** Both agree **regularity** is broken. The Occasionalist sees a change in Divine Habit. The Concurrentist sees a suspension of creaturely power via withheld **concurrence**.

  **Collaborative Note on Verbal Dispute**
  We acknowledge that a portion of this dispute may be verbal. If "creaturely power" is defined merely as "the consistent divine will to act through this entity," the Concurrentist position collapses into Occasionalism. However, if "creaturely power" denotes an ontological weight distinct from divine will, though dependent on it, the dispute is substantive. We agree that unless "power" implies independence from God (which both deny), the practical difference lies solely in the metaphysical description of **concurrence** versus **occasion**, not in the observable **regularity** or the attribution of ultimate **production** to God.

  **Signed:**
  *The Occasionalist Camp*
  *The Concurrentist Camp*
