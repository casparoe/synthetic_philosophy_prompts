prompt: |-
  I run a weekly 50-minute "life studies" seminar for about thirty 16-year-olds at a school with no philosophy department, and the whole gimmick is that we read one biography or one saint's life a week and try to get something out of it for our own lives. The problem is the kids (and honestly me) end up either saying "wow, inspiring" or "well, different times," and nothing lands. I want to steal the actual machinery behind this instead of reinventing it: the way Plutarch wrote paired lives and then a comparison of the pair, the way hagiographers built a saint's life so it could be imitated on a feast day rather than just admired, and the older idea that reading a life is holding a mirror up to yourself rather than watching someone else.

  So turn that into a proceedure I can actually run in a session. Give me the questions to ask in order -- about the person, about the particular deeds, about the gap between their situation and ours -- what counts as a good enough answer to each, where the procedure should stop and say this life has nothing to teach us here, and where it should stop and hand the thing over to my own judgement because it's a values question the method can't settle. I don't want a lesson-plan template or a worksheet, I want the reasoning in order with the failure modes named.

  Then run it on two cases. First the standard edifying saint's life, the Francis of Assisi kind of story, where the whole point of the genre is that you're supposed to imitate it. Second a morally mixed modern life: a genuinely great scientist or reformer who was, by all accounts, a monster to his own family. I suspect the procedure will tell me the first is less usable than it looks and the second more usable than the kids expect, and if it doesn't, tell me why I'm wrong.

  Also be straight with me about what this can't do. If the Plutarch-and-hagiography machinery only works because those authors already knew what a good life looked like and were just illustrating it, say so, because then my seminar is doing something different from what they were doing and I need to know that.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Runs a weekly 50-minute "life studies" seminar for thirty 16-year-olds. No philosophy department.
      *   **Current Problem:** Discussions stagnate at "wow, inspiring" or "well, different times." Nothing lands.
      *   **Goal:** Steal the *machinery* of Plutarch (paired lives, comparison) and Hagiography (imitation on feast days, mirror up to self) to create a usable procedure.
      *   **Deliverables:**
          1.  A step-by-step procedure (questions in order, criteria for good answers, stop conditions, hand-off points for value judgments).
          2.  No lesson-plan templates or worksheets; wants the *reasoning* with named failure modes.
          3.  Run the procedure on two cases: (A) St. Francis (edifying saint), (B) A morally mixed modern figure (great scientist/reformer, monster at home).
          4.  Honest assessment of limitations (does this machinery require pre-existing consensus on the "good life"?).

  2.  **Deconstruct the "Machinery":**
      *   *Plutarch:* Not just biography, but *synkrisis* (comparison). Focus on character (*ethos*) revealed through action (*praxis*), not just outcomes. The goal is moral agency.
      *   *Hagiography:* Not history, but *paradigm*. The saint is a type. The life is structured around virtues/vices to be copied/avoided. The "feast day" aspect implies ritualized imitation.
      *   *The Mirror:* Reading is self-examination.
      *   *The Problem:* Modern relativism ("different times") and superficial admiration ("inspiring").
      *   *The Fix:* A procedure that forces specificity, translation of context, and admission of cost.

  3.  **Drafting the Procedure (The "Engine"):**
      *   Need to move from *Admiration* -> *Analysis* -> *Translation* -> *Decision*.
      *   *Step 1: The Deed, Not the Glory.* Focus on a specific action, not the general vibe.
      *   *Step 2: The Cost.* What did they give up? (Crucial for 16-year-olds who think success is free).
      *   *Step 3: The Context Gap.* Acknowledge "different times" but force a translation.
      *   *Step 4: The Mirror.* Where does *my* life hurt in the same place?
      *   *Stop Conditions:* When do we quit? (When the virtue is inaccessible or the vice is structural).
      *   *Hand-off:* When do we admit this is a value judgment? (When the procedure identifies a conflict but can't resolve it).
      *   *Failure Modes:* "The Halo Effect" (ignoring flaws), "The Museum Piece" (too historical), "The Superhuman" (unimitable).

  4.  **Running the Procedure on Case 1: St. Francis:**
      *   *Expectation:* User thinks this might be *less* usable than it looks.
      *   *Why?* Radical poverty/vow of obedience is structurally impossible for a modern teen. It triggers the "Museum Piece" failure mode.
      *   *Procedure Application:*
          *   Deed: Giving up cloak/wealth.
          *   Cost: Security, family ties, future.
          *   Gap: We can't all be beggars.
          *   Mirror: Where am I clinging to security?
          *   *Verdict:* High admiration, low imitability *in form*, high imitability *in spirit* (detachment). The procedure exposes that copying the *action* is absurd, but copying the *orientation* is hard.

  5.  **Running the Procedure on Case 2: The Mixed Modern Life (e.g., Darwin/Newton/Steve Jobs type):**
      *   *Expectation:* User thinks this might be *more* usable.
      *   *Why?* It forces trade-off analysis. It kills the "Hero" myth.
      *   *Procedure Application:*
          *   Deed: Scientific breakthrough vs. neglecting child.
          *   Cost: Family intimacy for public good.
          *   Gap: Modern work-life balance issues.
          *   Mirror: What am I willing to sacrifice for my "greatness"?
          *   *Verdict:* High utility. It teaches *selection* of virtues. You can steal the work ethic without stealing the neglect. It forces a value judgment (Hand-off point).

  6.  **Addressing the Limitations (The "Straight Talk"):**
      *   Plutarch/Hagiographers *did* have a fixed telos (The Good, God).
      *   Modern classroom does not.
      *   Therefore, the seminar cannot tell them *what* to value, only *how* to value.
      *   If the teacher pretends the text decides the value, it's indoctrination. If the teacher admits the text offers a trade-off, it's education.
      *   The machinery works for *clarity*, not *truth*.

  7.  **Refining the Tone:**
      *   Direct, professional, slightly academic but practical.
      *   Avoid educational jargon ("learning outcomes").
      *   Respect the teacher's intelligence.
      *   Ensure the "Failure Modes" are clearly named.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I provide questions in order? Yes.
      *   *Check:* Did I say where to stop? Yes.
      *   *Check:* Did I run the two cases? Yes.
      *   *Check:* Did I address the "fixed telos" issue? Yes.
      *   *Critique:* Make sure the distinction between "imitating the act" and "imitating the virtue" is clear in the Francis section.
      *   *Critique:* Ensure the "Monster Scientist" section doesn't justify the monster behavior, but uses it for ethical calibration.

  9.  **Final Polish:** Organize into clear sections: The Procedure, The Failure Modes, The Test Cases, The Limitations. (Proceed to generate output).

  *(Self-Correction Note during drafting the response)*: I need to make sure I don't just give a list of questions. The prompt asks for "the reasoning in order." I need to explain *why* question B follows question A. I also need to be specific about the "Hand-off" point—where the teacher's judgment takes over because the method is neutral.

  *(Refining the "Mixed Life" case)*: Let's pick a specific archetype, like a driven surgeon or a visionary tech founder, to make it concrete for 16-year-olds. Let's go with a "Visionary Reformer/Scientist" archetype (e.g., Lise Meitner or Oppenheimer or even a genericized Steve Jobs figure) to keep it broad but specific enough. Actually, the prompt suggests "great scientist or reformer who was... a monster to his own family." Let's use a composite of the "Absent Father Genius" archetype.

  *(Refining the Limitations)*: Be very clear: Plutarch knew what *Virtue* was. You don't. That changes the game from "Discovery" to "Negotiation."

  10. **Final Output Generation** (incorporating these thoughts).
answer: |-
  Here is the machinery, stripped of the pedagogy and built for moral mechanics.

  ### Part 1: The Procedure (The Engine)

  The goal of this procedure is to move the student from **Spectator** (watching a movie) to **Judge** (weighing evidence) to **Agent** (making a choice). The failure of your current seminar is that it stalls at Spectator.

  You need four distinct phases. Do not move to the next phase until the current one yields a specific kind of friction.

  #### Phase 1: The Specific Act (Not the General Vibe)
  **Reasoning:** "Inspiring" is a feeling, not a thought. Hagiography works because it focuses on specific *ascesis* (training acts), not general holiness. Plutarch focuses on specific *apophthegms* (sayings/deeds).
  **The Question:** "Identify one specific thing this person *did* that cost them something. Not what they achieved, but what they endured or gave up to do it."
  **Good Answer:** "He gave up his inheritance," or "She worked 18 hours a day and missed her daughter's childhood."
  **Bad Answer:** "He was really dedicated," or "She was very holy."
  **Failure Mode: The Halo.** If they can only describe the person's reputation, stop. You cannot imitate a reputation. Force them to find a concrete transaction (time, money, safety, relationship).

  #### Phase 2: The Translation of Context
  **Reasoning:** This addresses the "different times" objection. Plutarch wrote about Greeks for Romans; he knew the context gap. He didn't ignore it; he bridged it by focusing on the *motive* behind the act, not the act itself.
  **The Question:** "If you performed that exact same physical action today, would it be virtuous or insane? If it's insane, what is the underlying principle that made it virtuous *then*?"
  **Good Answer:** "Giving away all money today is irresponsible, but the principle was 'not being owned by possessions.'"
  **Bad Answer:** "It was different back then." (This is a conversation stopper).
  **Stop Condition:** If the virtue is structurally impossible to translate (e.g., martyrdom in a non-persecuted society), admit the *form* is dead. You must hunt for the *function*.

  #### Phase 3: The Mirror (The Cost to You)
  **Reasoning:** This is the hagiographic "feast day" element. Imitation requires pain. If there is no cost, it's consumption, not imitation.
  **The Question:** "To copy the *principle* you just identified, what specific thing in *your* life would have to hurt or change this week?"
  **Good Answer:** "I'd have to stop checking my phone during dinner," or "I'd have to admit I was wrong to my friend."
  **Bad Answer:** "I'd try to be nicer." (Too vague to be painful).
  **Failure Mode: The Superhuman.** If the cost is "I would have to become a different species," the life is a monument, not a mirror. Discard it for imitation purposes; keep it for admiration only.

  #### Phase 4: The Verdict (The Hand-Off)
  **Reasoning:** Plutarch ends with a *Synkrisis* (comparison) to declare a winner. You cannot declare a winner on values. You can only declare clarity.
  **The Question:** "Knowing the cost you just identified, is this price one you are willing to pay? Yes or No."
  **Good Answer:** "No. I want the achievement, but I don't want the loneliness." (This is a moral success).
  **Bad Answer:** "Maybe."
  **The Hand-Off Point:** This is where your method ends and your judgment begins. The method exposes the trade-off. It cannot tell them if the trade-off is *worth it*. That is a values question. If a student says, "I'm willing to neglect my family to be a great scientist," the procedure has done its job by making the neglect explicit. You must now step in as the adult and say, "That is a coherent choice, but here is why our community rejects it."

  ---

  ### Part 2: Running the Procedure on Two Cases

  Here is how the machinery grinds through the two types of lives you proposed.

  #### Case A: The Edifying Saint (Francis of Assisi)
  *Expectation: High usability.*
  *Reality: Low usability for direct imitation, high usability for diagnosis.*

  1.  **Specific Act:** Francis strips off his clothes in the town square and returns them to his father.
  2.  **Translation:** If a 16-year-old did this in 2024, they would be detained for mental health evaluation or exposed to the elements. The *form* (public nudity/renunciation) does not translate. The *principle* is the severing of financial dependence to gain spiritual autonomy.
  3.  **The Mirror:** To copy the principle, the student must identify where they are "owned" by something.
      *   *Result:* Most students realize they cannot renounce wealth because they have none. They are already dependent.
      *   *Friction:* The Saint's life assumes you *have* something to give up. The modern teen often feels they have nothing.
      *   *Pivot:* The renunciation shifts from "wealth" to "reputation" or "digital identity."
  4.  **The Verdict:** Are you willing to be seen as a fool to be free of peer approval?
      *   *Outcome:* This is where the Saint becomes usable. It stops being about robes and birds and becomes about social courage.
      *   *Why it feels less usable:* The "Halo Effect" is strong. Students expect Francis to be "nice." The procedure reveals Francis was radically disruptive. If they want "nice," Francis fails. If they want "freedom," Francis works. The procedure breaks the "Inspiring" gloss and reveals the sharp edge.

  #### Case B: The Mixed Modern Life (The Brilliant Monster)
  *Example: A Nobel Prize winner who emotionally abused their spouse and ignored their children to focus on work.*
  *Expectation: Low usability (too messy).*
  *Reality: High usability for ethical calibration.*

  1.  **Specific Act:** Working 100-hour weeks during a critical discovery while a child is sick at home.
  2.  **Translation:** This translates perfectly. Modern "hustle culture" glorifies this. The context gap is zero.
  3.  **The Mirror:** Where are you prioritizing "achievement" (grades, likes, sports) over "care" (friends, family, sleep)?
      *   *Friction:* The student sees that the "Greatness" they admire was purchased with a specific cruelty.
      *   *Crucial Turn:* The procedure forces them to decouple the *Work* from the *Worker*.
  4.  **The Verdict:** Do you want the discovery enough to accept the cruelty?
      *   *Outcome:* Most will say "No."
      *   *Why it's more usable:* It kills the "Hero" myth. It teaches **Selection**. You can steal the work ethic without stealing the neglect. It forces the student to admit that *virtues compete*. You cannot have Maximum Career and Maximum Family.
      *   *The Hand-Off:* If a student says, "Yes, I would neglect my family for greatness," the procedure has succeeded. It has revealed their value hierarchy. You must then challenge that hierarchy, but you cannot pretend the text forbids it. The text proves it's possible.

  ---

  ### Part 3: The Limitations (Straight Talk)

  You asked to be told where this machinery breaks. Here is the break point.

  **1. The Telos Problem**
  Plutarch and the Hagiographers operated with a fixed *Telos* (End Goal). Plutarch assumed "Virtue" was a knowable, objective thing (mostly Stoic/Republican virtue). The Hagiographers assumed "God" was the objective good.
  *   **Their Machine:** Input Life -> Compare to Standard -> Output Imitation.
  *   **Your Machine:** Input Life -> Compare to ??? -> Output Choice.
  *   **The Consequence:** You cannot use this method to tell the kids *what* is good. You can only use it to show them *what they value*. If a student reads about a Saint and decides, "I don't want that much pain," the Plutarchan method would call them vicious. Your method must call them honest.
  *   **Risk:** If you pretend the text decides the value, you are indoctrinating. If you admit the text offers a trade-off, you are educating.

  **2. The Fragmentation Problem**
  Ancient lives were often written to show a unified character. Modern lives (and modern psychology) suggest people are fragmented. A person can be brave in war and cowardly in love.
  *   **The Fix:** Your procedure must explicitly allow for **Compartmentalization**. Do not force the students to find a "unified soul" in the subject. Let them steal the bravery and leave the cowardice. Plutarch might frown at picking and choosing; you must encourage it.

  **3. The "Nothing to Teach" Stop Condition**
  You asked where the procedure should stop and say "this life has nothing to teach us."
  *   **Condition:** When the *Cost* (Phase 1) is invisible or the *Principle* (Phase 2) is incoherent.
  *   **Example:** A biography of a lucky heir who did nothing but inherit wealth and give some away.
  *   **Diagnosis:** There is no *ascesis* (training/struggle). Without struggle, there is no moral weight. If the subject didn't pay a price, there is no mirror. Discard the life. It is entertainment, not study.

  **4. The Teacher's Burden**
  In the Plutarchan model, the author guides the judgment. In your model, **you** are the only guide.
  *   When the procedure hands off the values question (Phase 4), you cannot remain neutral. If a student decides that "Success is worth any cruelty," you cannot say, "That's an interesting perspective."
  *   The machinery gives you the *leverage point*. It shows you exactly where their values diverge from the community's. That is where you must speak. The text exposes the wound; you must decide whether to bandage it or cauterize it.

  ### Summary of the Workflow
  1.  **Find the Cost.** (If no cost, discard).
  2.  **Translate the Principle.** (If no translation, admire only).
  3.  **Locate the Pain.** (If no personal pain, no imitation).
  4.  **Make the Choice.** (If choice conflicts with community values, teacher intervenes).

  This turns the seminar from a "Gallery of Wax Figures" into a "Gymnasium of Moral Weightlifting." Some weights will be too heavy (Francis). Some will be dirty (The Monster). But the students will be lifting, not just looking.
