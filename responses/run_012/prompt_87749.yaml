answer: |-
  The frost had killed the blossoms before they could set, leaving the gnarled branches of the heritage apples bare and black against the grey sky. Mara stood on a ladder, shears in hand, hacking away the dead wood. She moved with a ferocity that frightened her brother, David. Two years ago, she had been unable to lift a teacup, let alone a pair of loppers. The illness had hollowed her out, and when she returned, she returned to this place.

  "You're cutting too deep," David said, holding the base of the ladder. He watched her hands. They were steady, but white-knuckled.

  "It's dead weight," Mara said. "It's taking from the living branches."

  "You ignored this orchard for twenty years," David said. He didn't mean it as an accusation, but it landed like one. "You called it a mosquito trap. You said we should sell the land for condos."

  "I was wrong."

  "Were you?" David stepped closer, looking up at her. "Or did you just finally see what was always there? The trees didn't change, Mara. The soil didn't change. The value was here while you were in that hospital bed. You just couldn't feel it."

  Mara stopped. She looked down at him, her breath pluming in the cold air. "If I couldn't feel it, David, then it wasn't a reason for me. It was just noise. If I look at a star and feel nothing, I have no reason to study astronomy. The star is there, but the *reason* isn't. I didn't find a reason here. I made one. The illness broke me open, and now this matters. Before, it didn't."

  "That's dangerous," David said. "That means if you wake up tomorrow and stop caring, the trees deserve to die."

  "It means," Mara said, resuming her cutting, "that reasons are things we carry, not things we find."

  They worked in silence until the gravel crunched under tires. Claire arrived. She was a friend from the city, wearing boots too clean for the mud. Mara had asked her to come, hoping for help with the harvest records. Claire looked at the rotting windfalls on the ground, the skeletal trees, and the shivering siblings. She looked bored.

  "I don't get it," Claire said, kicking a moldering apple. "You want me to catalog these? Mara, half of them are diseased. It's a lost cause. You're grieving a version of your childhood that doesn't exist."

  "It's not about nostalgia," Mara said, climbing down. "It's about preservation."

  "It's about labor," Claire corrected. "I have a job in the city. I have a life. Coming here... I look at these trees and I feel nothing. They're just wood. I have no reason to spend my weekend freezing my ass off for wood."

  David stepped in. He saw the look in Claire's eyes—the flat, impenetrable wall of indifference. He knew Mara couldn't convince her; Mara's passion was too feverish, too born of trauma. It required a cooler hand.

  "Come here," David said to Claire. He didn't wait for an answer. He walked toward the oldest tree, the one they called the Matriarch. Its trunk was split, held together by rusted wire and hope.

  "David, really," Claire said, staying by the car. "I'm not going to catch your religion."

  "It's not religion," David said. He knelt by the base of the trunk. He brushed away the leaves until the exposed roots were visible. "Look at this graft."

  Claire sighed but walked over. She stood over him, arms crossed.

  "Thirty years ago," David said, "my father tried to save this tree. He failed. The branch died. But look." He pointed to a small shoot emerging from the scar tissue, no thicker than a pencil. "It's trying again. It doesn't know it's supposed to be dead. It's just pushing."

  "It's a plant, David," Claire said. "It doesn't know anything."

  "We're not different," David said. He stood up, wiping dirt on his jeans. He looked at her, not with anger, but with a strange, quiet certainty. "You think you're here because Mara asked. But you're here because you know what it is to try when you're broken. You told me about your firm. The merger. How they tried to push you out."

  Claire's jaw tightened. "That's different."

  "Is it?" David stepped into her space. He wasn't shouting. He was offering her a mirror. "You stayed. You fought. You kept showing up when you had no reason to believe you'd win. You told me you did it because it was yours. Because walking away would mean letting them decide your value."

  Claire looked at the shoot. It was green, vivid against the grey bark.

  "This orchard isn't about apples," David said. "It's about the refusal to let things die just because it's easier. You know that. You live that. You're just pretending you don't see the connection because you're tired."

  "I am tired," Claire said. Her voice was low. "I have no reason to be here."

  "You do," David said.

  The air between them seemed to tighten. Mara watched from the ladder, holding her breath.

  "I have no reason to," Claire repeated. She sounded exhausted, definitive. She was stating a fact about her own motivation. There was no fire in her, no desire. To her, the statement was a description of reality.

  "You do," David replied. He didn't sound like he was arguing. He sounded like he was pointing out a hidden step on a staircase.

  Claire looked at him. Then she looked at the green shoot. She reached out, her clean glove hovering over the fragile stem. She didn't touch it. She just let her hand hang there.

  If David was right, the reason had been there all along, buried under her fatigue and cynicism, waiting for someone to brush away the leaves. He had simply shown her what was already true. The value was objective, anchored in the act of resilience itself, and she was merely recognizing her own reflection in the wood.

  But if Mara was right, David had just performed a trick. He had manipulated her history, reframed her pain, and sparked a new emotion. The reason didn't exist until this exact second, created by the friction of his words against her defenses. He hadn't found a reason; he had built a bridge where there was only a gap.

  Claire dropped her hand. She walked back to the car, opened the trunk, and pulled out a clipboard. She walked back to David without looking at him.

  "Show me the records," she said.

  "Okay," David said.

  "Don't make it sentimental," she warned, but her voice lacked the earlier edge.

  Mara climbed down from the ladder. She watched Claire open the clipboard, pen poised. She watched David stand beside her, pointing out the rows. They looked like people who shared a purpose. They looked like people who were humoring a grieving woman.

  Mara walked over to the Matriarch. She touched the split trunk. She felt the rough bark, the cold wire. She wondered if the tree knew why it was growing. Did it grow because the sun demanded it, or because it decided to reach?

  "Did you mean it?" Mara asked David, when Claire was busy measuring a branch.

  "Did I mean what?"

  "That she had a reason."

  David watched Claire write. The pen scratched against the paper, a dry, rhythmic sound. "She's working, isn't she?"

  "That doesn't answer me."

  "It answers the only part that matters," David said. He picked up a bucket of mulch. "We have work to do."

  Mara looked at Claire. Claire was frowning at the data, biting her lip. She looked engaged. She looked like she cared. But Mara remembered the look in Claire's eyes five minutes ago—the hollow certainty that there was nothing there. That look hadn't vanished; it had just been covered over by action.

  Was the reason the feeling, or the act?

  Mara picked up her shears. The metal was cold in her palm. She looked at the dead branch above her. It needed to come off. It was heavy. It was useless. But if she cut it, the tree might live.

  She raised the shears. She felt the weight of them. She felt the choice.

  "Ready?" David called out.

  Mara squeezed the handles. The steel bit into the wood. The branch cracked and fell into the grass with a dull thud.

  "Ready," Mara said.

  She didn't know if she was saving the tree because it mattered, or because she decided it did. She only knew that the branch was on the ground, and her hands were still moving. The sun broke through the clouds, casting long shadows across the orchard, illuminating the rot and the green shoot equally, offering light to both of them without saying which one was real.
