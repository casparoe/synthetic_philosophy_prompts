answer: |-
  You have independently rediscovered the central problem in the contemporary philosophy of language and semantics regarding slurs and pejoratives. What you are describing is the intersection of **projection**, **non-cancellability**, and **social indexicality**.

  There is no single, settled term in the literature that captures all four features (sticky, projective, graded, identity-licensed) perfectly, because this is currently a live battleground between semanticists and pragmatists. However, there are three established frameworks that get close, and I can offer a synthesized term for the specific cluster you've identified.

  ### 1. The Closest Established Concept: Conventional Implicature (CI)
  Proposed most famously for this context by Chris Potts (2005) and applied to slurs by others.

  *   **What it gets right:**
      *   **Projection:** CI content survives negation, questions, and conditionals (e.g., "That bastard isn't here" still implicates contempt).
      *   **Non-cancellability:** You cannot say, "He's a [slur], but I don't mean anything negative by it." The content is attached to the word itself, not the speaker's immediate intent.
      *   **Gradability:** Expressives (a subset of CI) come in intensities (*damn* vs. *fucking*).
  *   **Where it breaks:**
      *   **Identity Licensing:** Standard CIs are "conventional," meaning they should fire regardless of who says them (like the word *but* always signals contrast). CIs do not naturally account for **reclamation** (why the word is harmless when used in-group). If the meaning is conventional, an outsider using it "affectionately" should still trigger the semantic content, yet intuitively, the harm is different.

  ### 2. The Runner Up: Presupposition
  This was the early go-to explanation for why the insult survives embedding.

  *   **What it gets right:**
      *   **Projection:** Presuppositions are defined by their ability to survive negation and questions (the "Family of Sentences" test you performed).
  *   **Where it breaks:**
      *   **Cancellability:** Presuppositions *can* be cancelled with background info (your smoking example: "He didn't quit smoking, because he never smoked"). Slurs cannot be cancelled this way. Uttering the word *is* the harm, regardless of the truth conditions.
      *   **Identity:** Presuppositions are generally truth-conditional background facts, not social permissions.

  ### 3. The Competitor: Expressivism (or Hybrid Expressivism)
  Associated with philosophers like Blackburn, and applied to slurs by Christopher Hom and Robert May.

  *   **What it gets right:**
      *   **Attitude:** It captures that the word primarily signals the speaker's psychological state or moral stance rather than a descriptive fact.
      *   **Identity:** It handles reclamation better. If the meaning is "I, the speaker, hold this contemptuous attitude," then an in-group member saying it might express solidarity rather than contempt.
  *   **Where it breaks:**
      *   **Embedding:** Pure expressivism struggles to explain why the insult survives inside an *if-clause*. If I say, "If he is a [slur], I will leave," I am not necessarily expressing contempt myself, yet the sentence still feels "contaminated."

  ### The Missing Piece: Social Indexicality
  The feature you noticed regarding *who* is talking is known in sociolinguistics as **indexicality** (specifically, **social indexing**). The word points not just to a referent, but to the social relationship between speaker, hearer, and target.

  ### The Coined Term: "Normatively Indexed Projectives"
  Since no single existing term captures the *stickiness* (CI), the *survival* (Projection), and the *identity constraint* (Indexicality), here is a proposed term with defined edges.

  **Term:** **Normatively Indexed Projectives (NIPs)**

  **Definition:**
  Lexical items whose content projects out of logical embedding (negation, conditionals), cannot be cancelled by hedging, and whose felicity conditions are bound to the moral/social authority of the speaker relative to the target.

  **The Edges (What it includes):**
  *   **Group Slurs:** The primary example.
  *   **Reclaimed Terms:** The same lexical item, when the indexical condition (speaker identity) is met, shifts from NIP to neutral/descriptive.
  *   **Certain Profanities:** Words like *bastard* or *bitch* function as NIPs when used as insults, but lose the "Normative" weight when used descriptively (e.g., a female dog), showing the indexical shift.

  **What it Rules Out (The Exclusions):**
  *   **Ordinary Presuppositions:** "The King of France" is projective, but it is not *normatively indexed*. Anyone can assert it without moral sanction; it is cancellable ("...if there is one").
  *   **Pure Implicatures:** If I say, "It's cold in here" to imply "Close the window," I can cancel it ("...but I'm not asking you to close the window"). NIPs cannot be cancelled.
  *   **General Profanity:** Saying *damn* is an expressive projective, but it lacks the *group-targeted normative constraint*. An outsider saying *damn* isn't appropriating a marginalized identity's term; the "Identity Licensing" edge excludes generic swear words that lack a target demographic.
  *   **Descriptive Pejoratives:** Words like *terrorist* or *cult*. These are gradable and negative, but they are arguably truth-conditional and cancellable ("He's a terrorist, but I mean that in the legal sense, not the moral sense"). NIPs resist this separation.

  ### Why this fits your observation
  You noted that the nastiness "rides along." In linguistics, we call this **not-at-issue content**. You noted it won't come off with a hedge. That is **non-cancellability**. You noted it depends on who talks. That is **indexical authority**.

  The literature is currently split between **Semantic Externalists** (who say the word *contains* the racism, making reclamation impossible semantically) and **Pragmatic Prohibitionists** (who say the word is banned by social norm, making reclamation a change in norm).

  Your observation supports a third view: **Context-Sensitive Expressivism**. The word carries a normative load that is *indexed* to the speaker's social position. By coining **Normatively Indexed Projectives**, you capture the logic (projective), the ethics (normative), and the sociology (indexed) in one package.
