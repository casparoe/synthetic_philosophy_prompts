  Based on the track record you've described, here is the breakdown of your friend's logic, the predictions for your new cases, and the ultimate test case to settle the debate.

  ### 1. The Underlying Rule
  Your friend is almost certainly using **Rule (b): Collapse = the political order/elite structure disappearing.**

  Here is why Rule (a) (Population Drop) doesn't fit his logic as well:
  *   **Western Rome:** You noted he calls this a collapse *even though* "plenty of people just keep living their lives." If population drop were the defining rule, Rome would be a weak "collapse" or a "transformation." The fact he insists it's a collapse suggests he cares about the *Empire* dying, not the *people* dying.
  *   **Ming to Qing / Tokugawa to Meiji:** In both these cases, the population remained stable or grew. He calls them transformations. This fits Rule (b) perfectly because the *State* (the bureaucracy, the imperial institution) survived even if the leaders changed.
  *   **Easter Island:** He specifically mentions the "chiefly order comes apart." He focuses on the hierarchy, not just the body count.

  Archaeologists generally define collapse as a **loss of socio-political complexity**. It's when the system that organizes the society (palaces, writing, kings, tax collection) vanishes, regardless of whether the peasants survive.

  ### 2. The Predictions
  Here is how the two rules would judge your new cases, and what your friend will likely say:

  **Case 1: The Classic Maya (800–1000 CE)**
  *   **Rule (a) Population:** **Collapse.** (There was a significant population decline in the southern lowlands, even if Maya people survived elsewhere).
  *   **Rule (b) Political Order:** **Collapse.** (The divine kingship, the monument building, and the city-state network vanished).
  *   **Your Friend's Verdict:** **Collapse.**
      *   *Why:* This fits his "Late Bronze Age" criteria. The palaces were abandoned, the writing stopped, and the political system ended. The fact that Maya people survive today is irrelevant to him, just as Greek people surviving the Bronze Age collapse was irrelevant to his verdict on the Mycenaeans.

  **Case 2: The Black Death (14th Century Europe)**
  *   **Rule (a) Population:** **Collapse.** (30–50% of the population died; this is a massive demographic crash).
  *   **Rule (b) Political Order:** **Transformation.** (The Kings, the Church, the Guilds, and the Feudal structure all survived. In fact, the labor shortage often strengthened the surviving peasants' hand, changing the system, but not ending it).
  *   **Your Friend's Verdict:** **Transformation (Not Collapse).**
      *   *Why:* This is the critical divergence. Because the *institutions* survived, he will likely classify this as a crisis or transformation, similar to how he views the change from Tokugawa to Meiji. The "State" did not die.

  ### 3. The Definitive Test Case
  To definitively separate the two rules, you need a case where the **Political Order definitely ends**, but the **Population definitely stays stable.**

  *   **Rule (a)** will say: **Transformation** (Because the people are still there).
  *   **Rule (b)** will say: **Collapse** (Because the State is gone).

  **The Case to Run Past Him: The End of the Indus Valley Civilization (c. 1900 BCE)**

  *   **The Setup:** The great cities (Mohenjo-daro, Harappa) were abandoned. The standardized weights, measures, and writing system disappeared. The state-level organization vanished.
  *   **The Population:** There was no mass extinction. The population didn't die out; they de-urbanized and moved east to the Ganges plain. The people survived, but the *Civilization* did not.
  *   **The Verdict:**
      *   If he says **Collapse**, he is confirmed as **Rule (b)**. He cares about the loss of the system (cities/writing), not the death of the people.
      *   If he says **Transformation**, he is secretly using **Rule (a)** (or a hybrid), because the population continuity suggests the society "continued" in a new form.

  **Alternative Modern Test Case: The Dissolution of the Soviet Union (1991)**
  *   If you want to avoid ancient history ambiguities, use this.
  *   **Population:** Did not crash.
  *   **Political Order:** The State ceased to exist entirely.
  *   **Rule (a):** Not a collapse.
  *   **Rule (b):** Collapse.
  *   *(Note: Some archaeologists study the "contemporary past," so this might still be fair game for him.)*

  **Recommendation:** Stick with the **Indus Valley Civilization**. It is the classic archaeological example of "Collapse without Death." If he calls it a collapse, you have definitive proof he defines collapse as the **death of the State, not the people.**
