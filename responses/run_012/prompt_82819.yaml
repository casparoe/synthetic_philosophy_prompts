answer: |-
  **Start at Question 1.** Follow the arrows until you hit a **Bold Outcome**.

  **Q1. In the empty universe, is the fact that there are *two* spheres a basic fact that needs no explanation, or must there be some difference between them to make them two?**
  *   **Basic fact (no explanation needed):** Go to **Outcome A**.
  *   **Must be a difference:** Go to Q2.

  **Q2. If there must be a difference, but you cannot find any (no spatial, no internal), do the two spheres collapse into being just one object?**
  *   **Yes, only one sphere exists:** Go to **Outcome B**.
  *   **No, two still exist:** Go to Q3.

  **Q3. Is the difference that makes them two something about *where* they are (space/relations), or something about *what* they are (internal nature)?**
  *   **Where they are:** Go to Q4.
  *   **What they are:** Go to Q5.

  **Q4. If you dropped a third, different object into the universe, would that *create* the difference between the spheres (by giving them different relations), or would it just *reveal* a difference that was already there?**
  *   **Create the difference (relations count):** Go to **Outcome C**.
  *   **Reveal existing difference (space was already absolute):** Go to **Outcome D**.
  *   *(Note: Outcomes C and D often do the same work in practice, just disagree on whether space exists without objects.)*

  **Q5. Is this internal difference something you could detect in principle (like a hidden atomic variation), or is it invisible to any measurement?**
  *   **Detectable:** Go to **Outcome E**.
  *   ** Invisible:** Go to Q6.

  **Q6. (The Invisible Difference) Does it matter whether the spheres are simple blobs or made of parts?**
  *   **Yes, parts matter (objects are bundles of properties):** Go to **Outcome B** (You looped back; if properties match, it's one object).
  *   **No, parts don't matter (objects have a "substrate"):** Go to Q7.

  **Q7. If the spheres swapped places instantly, is there a fact about which specific sphere moved to which spot?**
  *   **Yes, there is a fact:** Go to **Outcome F**.
  *   **No, swapping changes nothing:** Go to **Outcome G**.

  ***

  **OUTCOMES**

  **Outcome A: Brute Distinctness (Max Black's View)**
  There are two things, full stop. Distinctness is primitive. IoI is false.
  *(Matches your friend's view.)*

  **Outcome B: Bundle Theory**
  Objects are just bundles of properties. If all properties match, it's the same object. There is only one sphere.
  *(IoI is true by definition.)*

  **Outcome C: Relational Individuation**
  They are distinct because they relate to things differently. Without a third object (or absolute space), they might not be distinct.
  *(IoI holds via relations.)*

  **Outcome D: Absolute Space (Substantivalism)**
  Space is a container. They are distinct because they occupy different "slots" in space, even if nothing else is there.
  *(IoI holds via location.)*

  **Outcome E: Empirical IoI**
  They differ, but you haven't looked hard enough. If you truly couldn't detect a difference, they would be one object.
  *(IoI holds via hidden variables.)*

  **Outcome F: Haecceitism (Substratum Theory)**
  They have an invisible "thisness" (haecceity) beyond their properties. Swapping them changes reality, even if no one can tell.
  *(IoI fails on properties, holds on "thisness".)*

  **Outcome G: Anti-Haecceitism / Incoherent**
  *   **If you came from Q1 (Basic Fact):** This is consistent (Black's view). Swapping doesn't matter because distinctness is brute.
  *   **If you came from Q5 (Invisible Difference):** This is generally considered **incoherent**. If there is an invisible difference making them distinct, swapping should matter. If swapping doesn't matter, the difference isn't real.

  ***

  **Summary of Positions**
  *   **Your Friend:** Likely **Outcome A**.
  *   **You (suspecting a trick):** Likely looking at **Outcome B** or **Outcome F**.
  *   **The "Cheating" Charge:** People call **Outcome F** cheating because it invents an invisible property just to save the theory. People call **Outcome A** cheating because it refuses to explain *why* there are two.
