prompt: |-
  Right, I've left it far too late to write anything proper for our departmental metaontolgy reading group next week, so I want to do a parody piece instead. Could you write me a mock internal case file from the 'Committee for Ontological Conciliation' at a fictional university — a committee whose entire remit is to resolve philosophical disputes by declaring them merely verbal. The file should cover one case: a philosopher who insists there's a table in the seminar room and another who insists there isn't, only atoms arranged table-wise. The committee's clerk (a committed deflationist, earnest and a bit pompous, not a cartoon) has to process the complaint, interview both parties, apply the committee's standard 'No-Fault Verbal Dispute' finding, and issue a ruling. I'd like the file to include the committee's one-page 'Guidance for Mediators', with its three tests for a verbal dispute: (i) the parties' truth-conditions diverge only over the meaning of 'exists'; (ii) each party can charitably reinterpret the other; (iii) neither party's view changes any prediction or practice. The piece should show those tests quietly failing, whilst the clerk keeps insisting that the committee is neutral. The humour should come from the actual metaontology, not wacky names: quantifier variance, the internal/external question, the difficulty of saying what 'exists' means in each party's idiolect, the worry that the conciliation procedure itself takes a substantive metaontological stand, the risk that the two are talking past each other, and the question of whether a dispute can really be merely verbal if neither party accepts the other's translation manual. I'd also like a short dissenting note from one committee member arguing that the committee's finding is itself a substantive metaphysical claim. Around 700-800 words, formatted like a formal case file with headings, numbered findings, and a final 'Disposition'. No citations, reading lists, or references — I want it to stand on its own. And for the love of all that is deflationary, don't make it a smug 'both sides are silly' piece; the satire should land on the practice of declaring disputes verbal, but it should also make a reader feel why that practice is tempting. British English, please. Cheers.
