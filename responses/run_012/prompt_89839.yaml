      *   *Section 3: The Specific Clauses.* Discuss how he handled the "dirty parts." He argued they were ambiguous enough to be read liberally. Was it rhetorical? Yes, but grounded in legal canons of construction (favoring liberty).
      *   *Section 4: Originalism vs. Natural Law.* Explain why "originalist" is wrong. Originalism binds you to the past. Douglass used the text to *transform* the present. He is a "Living Constitutionalist" in some sense, but more accurately a "Natural Law Constitutionalists."
      *   *Section 5: The Relativist Conclusion.* This is the philosophical crux. If Douglass thought meaning was just "chosen," his moral urgency collapses. He believed the text *compelled* liberty. The lecturer imposes modern skepticism on a man of conviction.
      *   *Conclusion:* Summarize the "subtly wrong" parts.

  5.  **Refining the Scholarship:**
      *   Need to reference key scholars. **William Wiecek** (*The Sources of Antislavery Constitutionalism*), **David Blight** (Biographer), **Lucas Morel** (*Lincoln and the American Founding* - discusses Douglass's view of the Founding), **Andrew F. March** (*Frederick Douglass: A Life in Letters* / political theory work).
      *   Specific Douglass texts: "Change of Opinion Announced" (1851), "The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?" (1860).
      *   Key distinction: Garrison said "No Union with Slaveholders" because the Constitution *was* slavery. Douglass said "The Constitution is Glorious" because the text *allows* for abolition.

  6.  **Self-Correction/Nuance Check:**
