answer: |-
  Your intuition is excellent. The lecturer's account is a sophisticated version of a common interpretation, but it contains a fundamental philosophical error regarding Douglass's legal theory, and it projects modern anxieties (specifically legal realism and critical legal studies) onto a 19th-century natural law thinker.

  A historian of American abolition or a constitutional theorist would accept the biographical timeline but would wince at the characterization of Douglass's jurisprudence and reject the relativist conclusion outright.

  Here is a breakdown of the account claim-by-claim, followed by a detailed address of your three specific uncertainties.

  ### Part 1: Claim-by-Claim Analysis

  **Claim:** *Douglass began as a disciple of Garrison, denouncing the Constitution as proslavery.*
  *   **Verdict:** **Accepted.**
  *   **Comment:** This is standard historical fact. From 1845 to roughly 1851, Douglass adhered to the Garrisonian view that the Constitution was a "covenant with death and an agreement with hell" (based on clauses like the Three-Fifths Compromise and the Fugitive Slave Clause).

  **Claim:** *In the early 1850s he reversed himself and declared the Constitution a charter of liberty.*
  *   **Verdict:** **Accepted.**
  *   **Comment:** The shift is documented in his 1851 announcement "Change of Opinion Announced" and solidified in his 1852 speech "What to the Slave is the Fourth of July?"

  **Claim:** *The explanation is that Douglass came to believe the framers were antislavery men who kept "slave" out of the text to signal extinction.*
  *   **Verdict:** **Subtly Wrong / Misleading.**
  *   **Comment:** This is the first major point of friction. Douglass did not argue that the framers were *secretly* antislavery. He argued that the framers were compromised men who created a text that did not *legally* establish slavery. He distinguished between the historical compromises of 1787 and the legal authority of the text itself. He argued that because the words "slave" and "slavery" do not appear, the document cannot be read to sanction a property right in man without violating the rules of legal interpretation.

  **Claim:** *This makes him an originalist avant la lettre (meaning fixed by intentions).*
  *   **Verdict:** **Straightforwardly Mistaken.**
  *   **Comment:** As detailed below, Douglass explicitly rejected "intent" as the primary driver of meaning in favor of "text" read through "natural law." Calling him an originalist is an anachronism that obscures his actual argument.

  **Claim:** *Douglass's reading requires averting eyes from how the Constitution was actually applied.*
  *   **Verdict:** **Wince.**
  *   **Comment:** Douglass did not ignore the proslavery application; he characterized it as a **usurpation**. In legal theory, acknowledging a usurpation presupposes a legitimate order that has been hijacked. If he were simply "averting his eyes," he would be engaging in fantasy. Instead, he was engaging in a counter-legal argument that the courts had erred.

  **Claim:** *Constitutional meaning is never simply found but always chosen... interpretation is political rhetoric rather than a genuine constraint.*
  *   **Verdict:** **Straightforwardly Mistaken.**
  *   **Comment:** This is the lecturer's philosophical projection. Douglass believed meaning was *found* through the application of natural law principles to the text. He believed the text *constrained* the proslavery reading. To say his view supports relativism is to misunderstand his conviction that there was a *right* answer, not just a politically useful one.

  ---

  ### Part 2: Addressing Your Three Uncertainties

  #### 1. Did Douglass rely on Framers' Intent or set it aside?

  **The Lecturer's View:** Douglass relied on the secret antislavery intent of the framers.
  **The Scholarly Consensus:** Douglass explicitly set intent aside in favor of textualism and natural law.

  In his definitive 1860 speech, *"The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?"*, Douglass addresses this directly. He notes that the Garrisonians argued the Constitution was proslavery based on the *intent* of the framers (who were slaveholders or compromised with them). Douglass replies:

  > "I care not for the intent... I take the text... If the Constitution were intended to be by its framers and adopters a slaveholding instrument, why would neither slavery, slaveholding, nor slave be anywhere found in it?"

  Douglass's theory of meaning was not "original intent" (what the drafters thought in their heads) but **"plain meaning constrained by natural law."** He argued that in a legal system predicated on liberty (as declared in the Preamble's "secure the Blessings of Liberty"), any ambiguity must be resolved in favor of liberty. This is a canon of legal construction (*in dubio pro libertate*), not a historical excavation of intent.

  **Correction:** A defender of Douglass would reject the claim that he relied on framers' intent. They would argue he relied on the **public text** interpreted through the **Declaration of Independence**. For Douglass, the Declaration provided the "interpretive key" to the Constitution. The Constitution was the machine; the Declaration was the blueprint of principles (natural rights) by which the machine must be operated.

  #### 2. Was his treatment of specific provisions textual or rhetorical?

  **The Lecturer's View:** It was rhetorical and requires ignoring the actual application.
  **The Scholarly Consensus:** It was a technical legal argument that was weak *positively* (under existing case law) but strong *normatively* (under legal maxims).

  Douglass engaged with the three main "proslavery" clauses:
  1.  **The Three-Fifths Clause (Art. I, Sec. 2):** Douglass argued this referred to "persons," not "slaves." By counting enslaved people as three-fifths of a person for representation, the Constitution implicitly acknowledged their humanity, undermining the property claim.
  2.  **The Fugitive Slave Clause (Art. IV, Sec. 2):** Douglass argued the text refers to persons "held to Service or Labour." In common law, "service" implies a contract. A chattel slave cannot enter a contract. Therefore, the clause legally referred to indentured servants, not slaves.
  3.  **The Slave Trade Clause (Art. I, Sec. 9):** He noted this allowed Congress to prohibit the trade after 1808, which it did. He argued this showed the Constitution gave the federal government power to restrict slavery, not protect it.

  **Does it survive precision?**
  *   **Historically/Legally:** At the time, this was a minority view. The Supreme Court in *Prigg v. Pennsylvania* (1842) and later *Dred Scott* (1857) rejected Douglass's reading. The "service or labour" argument was legally tenuous because the context of 1787 clearly implied enslaved people.
  *   **Theoretically:** Douglass's argument survives as a robust example of **"Abolitionist Constitutionalism."** Scholars like William Wiecek (*The Sources of Antislavery Constitutionalism*) argue Douglass was using established legal canons: statutes in derogation of common law (liberty) must be strictly construed. Since slavery violated common law liberty, the Constitution had to speak explicitly to authorize it. It did not.

  **Correction:** It was not merely rhetorical; it was a **canon-based textualist argument**. However, the lecturer is right that it required rejecting the *precedent* of the Taney Court. Douglass would say he wasn't ignoring application; he was arguing the application was unconstitutional.

  #### 3. Does the Relativist Conclusion follow?

  **The Lecturer's View:** Douglass shows meaning is chosen/political rhetoric.
  **The Scholarly Consensus:** Douglass's position presupposes objective moral constraints that *embarrass* the relativist conclusion.

  The lecturer is channeling **Legal Realism** or **Critical Legal Studies (CLS)**: the idea that law is politics by other means and texts are indeterminate.
  Douglass was a **Natural Law** theorist. He believed:
  1.  There is a universal moral law (God's law/Nature's law).
  2.  Liberty is the default state of man under this law.
  3.  Slavery is a violation of this law.
  4.  The Constitution, to be legitimate, must be compatible with this law.

  If Douglass believed interpretation was merely "political rhetoric" where one could choose any meaning, his moral crusade would collapse into mere power politics. He argued that the proslavery reading was not just politically bad, but **legally erroneous** and **morally void**.

  **Correction:** A defender of Douglass would reject the relativist conclusion outright. They would argue that Douglass demonstrates that constitutional meaning is **constrained by moral truth**. The text *cannot* mean "slavery is property" because that violates the pre-political rights the Constitution was established to secure. The lecturer mistakes Douglass's *flexibility* (shifting from disunion to unionism) for *relativism*. It was actually **strategic consistency** toward a fixed moral end.

  ---

  ### Part 3: Is "Originalist" the Right Label?

  **Verdict:** **Anachronistic and Misleading.**

  Calling Douglass an "originalist" is a common trick in modern political theory (used by both conservatives and liberals to claim his mantle), but it fails under scrutiny.

  1.  **Modern Originalism:** Generally seeks to bind the present to the public meaning or intent of the past. It is often conservative regarding social change.
  2.  **Douglass's Method:** He used the text to *transform* the present. He did not want to be bound by the "original understanding" of 1787 if that understanding included compromise with slavery. He wanted to bind the present to the *principles* of 1776 (Declaration) as realized through the text of 1787.

  **Better Labels:**
  *   **Natural Law Constitutionalism:** This is the most accurate. He believed the Constitution was valid only insofar as it conformed to natural rights.
  *   **Textualist (with a Liberty Canon):** He focused on the words on the page, but insisted they be read through a presumption of liberty.
  *   **Living Constitutionalist (in a specific sense):** He believed the Constitution's principles (liberty) must expand as moral understanding expands, though he grounded this in the text itself, not just evolving standards.

  Scholar **Lucas Morel** (in *Lincoln and the American Founding*) argues Douglass is best understood as a **Founders' Principles** advocate. He didn't worship the framers' *actions* (which were compromised), but he worshipped the *principles* they professed (all men are created equal) and argued the Constitution was the vehicle to fulfill those principles.

  ### Summary for Your Discussion with Friends

  You can tell your friends that the lecturer got the **biography** right but the **jurisprudence** wrong.

  1.  **The "Intent" Error:** Douglass didn't think the framers were secret abolitionists; he thought the *text* was cleaner than the *history*. He argued we are bound by the written law, not the secret motives of the writers.
  2.  **The "Originalist" Error:** Douglass wasn't looking backward to 1787; he was looking upward to Natural Law and using the text to get there. He is better called a **Natural Law Textualist**.
  3.  **The "Relativist" Error:** This is the most important correction. Douglass did not believe meaning was "chosen." He believed the proslavery reading was a **lie** and the antislavery reading was the **truth**. He believed the text *constrained* judges from supporting slavery. The lecturer is imposing a modern cynical view of law onto a man who believed law was a tool of moral redemption.

  **The "Nagging" Feeling:**
  Your suspicion was correct. The lecturer's account makes Douglass sound like a modern postmodernist (meaning is constructed/chosen). In reality, Douglass was a 19th-century moral realist (meaning is discovered through reason and text). The lecturer mistakes Douglass's *political ingenuity* for *philosophical skepticism*. Douglass would have been offended by the suggestion that his reading was just a "story" to serve a political end; he believed it was the only *legal* reading available.
