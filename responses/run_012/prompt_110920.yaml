  **The Scenario**
  Consider a senior architect leading a bespoke, decade-long restoration of a historic landmark, a project where the cultural value of the completed building is not fixed but is constitutively determined by the continuity of the vision; if abandoned, the structure is demolished (value $0), but if completed, its prestige and utility are a direct function of the total resources historically invested, such that a building finished after $9 million in prior work (sunk) and $1 million to complete (marginal) is valued by the city at $12 million, whereas the same building finished after only $1 million prior work would be valued at merely $1.5 million due to the loss of historical fidelity. You are at the $9 million mark; the marginal cost to finish is $1 million, but the direct future utility of the building's use is only $500,000. A standard expected-value calculation comparing marginal cost ($1m) to direct future utility ($0.5m) dictates abandonment, yet honoring the sunk investment is rationally required because the *magnitude* of the past expenditure is a constitutive variable in the payoff function of the completed good, not merely a signal of quality or a psychological anchor.

  **The Demonstration**
  The agent faces two options: **Quit** or **Finish**.
  *   **Quit:** Payoff = $0. (The building is demolished; the sunk $9m yields no residual value).
  *   **Finish:** Payoff = Total Value - Marginal Cost.
  *   **Textbook EV Analysis:** The textbook reasoner isolates the *marginal* transaction. They argue the $9 million is gone (sunk). They compare the *Marginal Cost* ($1 million) against the *Marginal Benefit* (the direct use value of $500,000). Since $1m > $0.5m, the textbook verdict is **Quit**. To the textbook reasoner, the $12 million total valuation is irrelevant because $9 million of it is "already spent."
  *   **My Case Analysis:** The rational agent recognizes that the *Total Value* ($12 million) is not a fixed future prize but a function $V(I_{sunk} + I_{marginal})$. The value is emergent from the *entire trajectory* of investment. The calculation is: Expected Utility(Finish) = $12m (Total Value) - $1m (Marginal Cost) = $11m Net Gain relative to the *current state of the asset*. Expected Utility(Quit) = $0. Since $11m > $0, the rational choice is **Finish**.
  *   **Why the Maximizer is Wrong:** The textbook maximizer errs by assuming the utility function is additive over time periods ($U_{total} = U_{future} - C_{marginal}$). In this scenario, the utility function is *holistic* ($U_{total} = f(I_{total}) - C_{marginal}$). By ignoring the sunk cost, the textbook reasoner ignores a variable that mathematically determines the magnitude of the future benefit. They are not maximizing value; they are maximizing a truncated subset of the value equation.

  **The Working Feature**
  The feature doing the work is **Constitutive Dependency**: the property that the *value* of the future outcome is ontologically dependent on the *magnitude* of the past investment, not just causally or informationally. The past investment is not a "signal" that the building is good (information); the past investment *makes* the building good (constitution).
  *   **Counterfactual:** If we remove this feature—i.e., if the building's value were fixed at $12 million regardless of whether you spent $1 million or $9 million to get there—the textbook verdict returns. In that fixed-value case, the $9 million is truly irrelevant, and if Marginal Cost ($1m) > Direct Future Utility ($0.5m), you should quit (assuming the $12m is only realizable if *someone* finishes it, but your specific contribution isn't the value-driver). Wait, if Value is fixed at $12m, then EV says Finish ($12m - $1m = $11m).
  *   *Correction for Isolation:* The variable is the **Scaling of Value**. If Value scales with Sunk Cost (My Case), Stay. If Value is Fixed (Textbook Assumption), the calculation changes. In the Textbook Assumption, the Sunk Cost is irrelevant to the *Value*, so you only look at Cost vs. Value. In My Case, Sunk Cost *is* Value.
  *   *Refined Counterfactual:* If the city valued the building at a flat $12 million regardless of prior investment (no fidelity premium), then the Sunk Cost is truly sunk. But if the Value is *only* $12 million *because* $9 million was spent, then the Sunk Cost is a productive input that matures only upon completion. If you flip this to a scenario where the $9 million buys no fidelity premium (Value = $500k regardless), the textbook verdict (Quit) holds.

  **The Strongest Objection**
  A defender of the textbook line would argue: **"You have merely redescribed the Sunk Cost as a Precondition for a Future Benefit."** They would claim that the $9 million isn't doing normative work; rather, the *Rule* ("High Fidelity requires High Investment") creates a *Future Benefit* (the $12 million valuation) that is contingent on meeting a threshold. The rational agent is still maximizing *future* utility (the $12m payout); they are not valuing the *past* $9m. The $9m is just a state variable indicating proximity to the threshold. Therefore, the agent is not "honoring a sunk cost"; they are "purchasing a high-value asset at a discount." The textbook rule stands because the agent is ignoring the *irrecoverability* of the $9m and focusing entirely on the *net future gain* ($12m - $1m). The term "Sunk Cost" is being misused to describe a "Necessary Accumulated Input."

  **Conclusion**
  This case shows that the textbook rule is **stated too crudely**, not strictly false. The rule "Ignore Sunk Costs" is a heuristic for *additive* utility functions where past costs do not alter the *quality* of future outcomes. It fails in **non-additive, trajectory-dependent** contexts where the history of investment is a constitutive element of the good's value. The rational requirement isn't to "love the past," but to recognize that in some real-world structures (craftsmanship, relationships, legacy projects), the future value is mathematically inseparable from the past cost. The textbook rule should be amended to: "Ignore sunk costs *unless* the value of the completion is a function of the total investment."
