answer: |-
  Aristotle would likely reject the situationist conclusion that virtue is empirically empty, arguing that his ethics never promised cross-situational behavioral consistency for the unhabituated majority and that the experiments fail to capture the perceptual shift that defines true character. He would treat the demand for predictive regularity as a category error regarding the precision ethical theory can achieve. He would insist that the data describes those lacking practical wisdom rather than refuting the possibility of acquiring it.

  To understand why he would take this line, you have to start with his methodological commitments in the opening book of the Nicomachean Ethics, where he explicitly warns against expecting the same degree of exactness in ethics as in mathematics. He argues that we must be content to indicate the truth roughly and in outline, and that looking for scientific laws of human behavior is a sign of an untrained mind. If you showed him the situationist literature, he would likely agree with the empirical findings that most people are swayed by trivial situational factors, but he would deny that this bears on the existence of virtue because his theory is not a description of how the many actually behave, but an account of what human flourishing looks like for those who have successfully completed the process of habituation. The experiments you mention test theology students who are presumably still in training or are merely continent, meaning they act correctly but struggle against contrary desires, rather than the practically wise person whose desires are fully aligned with reason. For Aristotle, the virtuous person is the measure of what is truly good, much like a healthy person is the measure of what is truly wholesome, so finding that sick people react poorly to certain foods does not refute the theory of nutrition. He would argue that the situationists are measuring the moral equivalent of invalids and then concluding that health does not exist.

  This connects directly to your puzzle about habituation, where it seems circular to say we become just by doing just acts if doing a just act properly requires already being just. Aristotle is aware of this tension and distinguishes between doing the things a just person does and doing them in the way the just person does them. The beginner performs the external action, perhaps under guidance or compulsion, but without the firm internal state or the choice of the act for its own sake. What habituation actually does, on a defensible reading of his text, is train your perception rather than just stamping in a behavioral reflex. Through repeated exposure to fine and base actions, your emotional responses are calibrated so that you begin to see the morally salient features of a situation that the unhabituated person misses. The theology student rushing to the lecture sees only the clock and the obligation to be on time, whereas the habituated person sees the suffering human being as the primary demand of the moment. So your suspicion is correct that this is about perception; the disposition is not a blind trigger that fires regardless of context, but a refined sensitivity that allows the agent to read the situation correctly. The situationist challenge assumes traits are supposed to override context, but for Aristotle, the virtue is precisely the capacity to respond appropriately to the context, which means consistent behavior across wildly different situations is not the goal if the situations themselves call for different responses.

  Regarding your friend's point about globalism, Aristotle is not committed to the strong globalist claim that a trait must manifest identically across all domains regardless of situational variance. He explicitly states that virtue is a mean relative to us, determined by reason as the practically wise person would determine it, which implies that the output depends heavily on the specific variables of the circumstance. However, he is committed to a kind of stability within the moral domain; the virtuous person should not be easily shaken from their course by fear, pleasure, or haste. The situationist experiments suggest that even seemingly minor pressures can disrupt moral behavior, which threatens this stability. Aristotle would likely concede that such fragility exists in the majority of people but would maintain that the experiments do not address the case of the fully formed character who has undergone the years of proper upbringing and training he describes. If the experiments show that almost no one achieves this state, Aristotle might concede that the practically wise person is rare, perhaps as rare as he sometimes suggests, but he would not concede that the ideal is therefore empty. The ethics could survive intact even if the weight shifts slightly, because the core of his system is not the statistical frequency of virtuous acts but the teleological structure of human function. If dispositions are more situation-specific than he hoped, the requirement for practical wisdom becomes even more central, as the agent must constantly judge what is required rather than relying on a robotic disposition.

  I should be explicit about where this prediction gets shaky, since I am extrapolating from texts written for a different purpose to a question their author never imagined. The weakest point in this defense is Aristotle's reliance on the existence of the spoudaios, the serious or excellent person, as the empirical anchor for his theory. He assumes that such people exist and can be observed, using their judgments as data points for what is truly good. If the situationist literature is correct that situational variables overwhelm character traits even in those we consider mature and responsible, then Aristotle's primary evidence for the content of virtue collapses. He might be overly optimistic about the power of habituation to inoculate a person against social pressure or urgency, given that he lacked controlled experiments to test the limits of human will. Furthermore, his teleological view of nature assumes that human beings have a function they are naturally fitted to fulfill, whereas the situationist data suggests a fragmentation of the self that might be more fundamental than he allows. If human psychology is inherently situation-responsive to the degree the experiments suggest, then the idea of a unified character capable of flourishing across a lifetime might be a metaphysical hope rather than a biological reality. You are right to be suspicious of the reply that makes the theory immune to evidence, because if Aristotle defines the virtuous person in a way that makes them impossible to identify empirically, he risks turning ethics into a fiction. Nevertheless, his methodological caution about precision offers a genuine shield against the demand for predictive laws, provided he is willing to accept that his ethics describes a rare achievement rather than a common human property.
