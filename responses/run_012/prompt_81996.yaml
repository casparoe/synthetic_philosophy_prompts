      *   **Body Paragraph 5: The Counter-Argument (Convergence/Functionalism):**
          *   Address the view that commerce demands efficiency, so they would have converged anyway.
          *   Refute it: If efficiency were the driver, the switch would have happened during a crisis or technological shift. The fact that it didn't proves the lock-in.
      *   **Conclusion:**
