prompt: |-
  I run user research at a mid-size software company: think-aloud sessions, five or six a week, and each one has to turn into a one-page readout that a product director signs off on and that actually moves the roadmap. What I can never do is decide how much weight to put on what a participant says about their own head. I know the standard moves — people have access to what they're thinking but not to why, so a fluent account of a choice is usually a story built afterward; confidence doesnt track accuracy, and the slicker the explanation the more I should suspect it; and there's the classic result where people give confident reasons for a choice that was really determined by something they never noticed — but I can't put a paragraph of theory next to every quote, and "self-report is unreliable" is useless when I still have to write the doc.

  So give me a procedure I can run on one line of transcript in under a minute: the questions in order, what counts as a good enough answer to each, where it stops, and where it hands the call back to me because it's a judgment and not a rule. I want it to seperate a report about what someone is experiencing right now ("this text is too small to read") from a report about why they did something, and to do something useful with the third kind, the verdict — "it was pretty easy, I'd use it" — which I suspect is nearly contentless but I keep putting in the doc anyway. One test I half-believe and want in there: if the participant could have worked out what they say from the same stuff I can see — the screen, their clicks, the task — then it isn't privileged access, it's just them guessing about themselves the way I'd guess about them.

  Then run it on three from last week: a guy who says, unprompted and very smoothly, "I clicked the third result because I always trust official-looking sources"; a woman who insists she never saw the cookie banner, which was on screen the whole time; and "honestly the whole thing felt pretty easy." Flag the places where it can't help and I just have to decide, and if it says something about my own instincts I won't like, say it anyway. No follow-up studies and no more participants — this has to work on what's already in the transcript.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User Role:** User Researcher at a mid-size software company.
      *   **Task:** Produce one-page readouts from think-aloud sessions (5-6/week) that influence the roadmap.
      *   **Problem:** Struggles with weighting self-reported data (what participants say about their own heads). Knows the theory (Nisbett & Wilson, etc.) but needs a practical, sub-1-minute procedure for transcript lines.
      *   **Goal:** A procedure to distinguish between:
          1.  *Experience* ("Text is too small").
          2.  *Causal Explanation* ("I clicked X because Y").
          3.  *Verdict/Satisfaction* ("It was easy").
      *   **Specific Test:** If the participant could have inferred their statement from observable data (screen, clicks), it's not privileged access.
      *   **Output:** A step-by-step procedure + Application to 3 specific examples + Honest feedback on the researcher's instincts.
      *   **Constraints:** No follow-up studies, no new participants. Work with existing transcripts.

  2.  **Deconstruct the Theory into Practice:**
      *   *Theory:* People know *what* they are doing/feeling better than *why*. Post-hoc rationalization is common. Confidence $\neq$ Accuracy.
      *   *Practice:* I need a filter.
      *   *Step 1: Categorize.* Is it Observation, Explanation, or Verdict?
      *   *Step 2: The "Observable Test".* Could I have guessed this without asking them?
      *   *Step 3: The "Privilege Check".* Is this internal state or external inference?
      *   *Step 4: Weighting.* How much does this count for the roadmap?

  3.  **Drafting the Procedure (The "60-Second Transcript Triage"):**
      *   Needs to be fast.
      *   Needs clear stop points.
      *   Needs to handle the three types of statements.
      *   *Drafting Step 1 (Type):* Ask: "Is this about the *world* (UI), the *mind* (reason), or the *score* (verdict)?"
      *   *Drafting Step 2 (Observability):* Ask: "If I mute the audio, do I see evidence of this?"
      *   *Drafting Step 3 (Privilege):* Ask: "Is this information only they could know?"
      *   *Drafting Step 4 (Action):* Assign weight. High for Experience, Low for Explanation (unless corroborated), Zero for Verdict.

      *Refining the Procedure:* Let's make it a flowchart style but in text.
      *   Q1: What kind of claim is this? (Experience vs. Cause vs. Verdict).
      *   Q2: The "Mute Test" (Observability).
      *   Q3: The "Privilege Test" (Internal Access).
      *   Decision Rule.

  4.  **Applying to the Three Examples:**

      *   *Example 1:* "I clicked the third result because I always trust official-looking sources."
          *   Type: Causal Explanation.
          *   Mute Test: I see the click. I don't see "official-looking." That's an interpretation.
          *   Privilege: They know their trust heuristic. But is it the *real* reason?
          *   Weight: Low/Medium. It's a hypothesis, not a fact.
      *   *Example 2:* "I never saw the cookie banner." (Banner was visible).
          *   Type: Experience/State.
          *   Mute Test: Banner is visible on screen.
          *   Privilege: Only they know their visual focus.
          *   Conflict: Physical reality vs. Internal experience.
          *   Weight: High for UX failure (banner blindness), not high for truthfulness. It proves the banner failed to capture attention.
      *   *Example 3:* "Honestly the whole thing felt pretty easy."
          *   Type: Verdict.
          *   Mute Test: Maybe they hesitated? Maybe they clicked wildly?
          *   Privilege: They feel the effort, but "easy" is vague.
          *   Weight: Near Zero. It's a social pleasantry unless backed by metrics.

  5.  **Addressing the Researcher's Instincts:**
      *   The user suspects verdicts are contentless but keeps writing them. Why? Probably to please stakeholders who want "happy users."
      *   The user knows self-report is unreliable but feels pressure to document it.
      *   *Hard Truth:* You are likely over-valuing smooth narratives because they make your report look definitive. You are under-valuing friction because it's harder to explain.

  6.  **Refining the Output Structure:**
      *   **Part 1: The Procedure.** (The 60-Second Triage). Clear steps, stop conditions.
      *   **Part 2: The Application.** Running the three examples through the procedure.
      *   **Part 3: The Hard Truth.** Addressing the researcher's instincts and the "why" of their struggle.

  7.  **Polishing the Content (Self-Correction during drafting):**
      *   *Critique:* Is the procedure too academic?
      *   *Fix:* Use plain language. "Mute Test" is good. "Privilege Check" is good.
      *   *Critique:* Did I answer the specific constraint about "could they have worked it out from the screen"?
      *   *Fix:* Make that the core of Step 2.
      *   *Critique:* The user wants to know where *they* have to decide.
      *   *Fix:* Explicitly mark "Judgment Call" zones in the procedure.

  8.  **Final Review against constraints:**
      *   One line of transcript in under a minute? Yes, the procedure is designed for speed.
      *   Separate Experience, Why, Verdict? Yes.
      *   Run on 3 examples? Yes.
      *   Flag where it can't help? Yes.
      *   Say something about instincts they won't like? Yes.

  9.  **Final Polish:** Ensure tone is professional, empathetic, but direct (matching the user's sophisticated understanding of the field). (Proceed to generate output).

  *(Self-Correction on Example 2)*: Wait, if the banner was there and they didn't see it, is that "Experience"? Yes, it's a report on their perceptual field. It's crucial data for *design*, even if it's factually wrong about the *screen*. I need to make sure the procedure highlights that distinction. It's not "Truth vs Lie," it's "Design Failure vs User Error."

  *(Self-Correction on Example 1)*: "Official-looking" is subjective. The procedure needs to flag that this is an interpretation of the UI, not just a reason for the click.

  *(Self-Correction on Example 3)*: "Easy" is the classic "satisfaction" metric. The procedure should tell the user to delete this from the readout unless backed by time-on-task or error rates.

  10. **Finalizing the "Hard Truth":** The user keeps putting verdicts in because Product Directors want "validation," not "insight." I need to point out that by including verdicts, they are diluting the signal.

  Let's write it.cw
answer: |-
  Here is the procedure, the application, and the hard truth about your instincts.

  ### Part 1: The 60-Second Transcript Triage

  Run every significant quote through these three questions in order. If you hit a **STOP**, you have your weight. If you hit a **JUDGMENT**, the procedure ends and you must decide.

  **Step 1: The Category Sort**
  *   **Question:** Is this a report on the *Interface* (Experience), the *Mind* (Cause), or the *Score* (Verdict)?
      *   *Interface:* "This text is small," "I can't find the button."
      *   *Cause:* "I clicked here because...," "I thought this meant..."
      *   *Score:* "It was easy," "I liked it," "I'd use this."
  *   **Action:**
      *   If **Interface**: Go to Step 2.
      *   If **Cause**: Go to Step 2.
      *   If **Score**: **STOP.** Weight = 0. Do not put this in the readout unless contradicted by behavior (e.g., they struggled but said it was easy).
      *   *Why:* Verdicts are social lubricants, not data. They tell you how the participant wants to be perceived, not how the software performed.

  **Step 2: The Mute Test (Observability)**
  *   **Question:** If I mute the audio and watch the video, could I have inferred this statement just by looking at the screen and their mouse?
      *   *Yes:* They are narrating the visible state (e.g., "It's loading" while spinner spins).
      *   *No:* They are revealing hidden state (e.g., "I'm confused" while clicking confidently).
  *   **Action:**
      *   If **Yes**: **STOP.** Weight = Low. This is commentary, not insight. It confirms what you already know.
      *   If **No**: Go to Step 3.

  **Step 3: The Privilege Check (Access)**
  *   **Question:** Is this information physically impossible for me to know without them speaking?
      *   *Experience:* Pain, confusion, reading difficulty. (Only they feel this).
      *   *Cause:* Heuristics, past habits, trust triggers. (Only they know their history, *but* they may be lying to themselves).
  *   **Decision Rule:**
      *   If **Experience** (e.g., "I can't read this"): **Weight = High.** This is a bug report. Believe them.
      *   If **Cause** (e.g., "I clicked because..."): **JUDGMENT CALL.**
          *   *The Test:* Does their explanation match the visible friction?
          *   *If Match:* Treat as a **Hypothesis** for the roadmap, not a fact. (e.g., "User *believes* trust drove the click; design should test trust signals.")
          *   *If Mismatch:* Discard the reason, keep the behavior. (e.g., They say "I trusted it" but they hesitated for 10 seconds. The hesitation is the data; the trust is the story.)

  ***

  ### Part 2: Running the Tape (Last Week's Examples)

  **1. The Smooth Explainer**
  *   **Quote:** "I clicked the third result because I always trust official-looking sources."
  *   **Step 1 (Category):** Cause. (Why they clicked).
  *   **Step 2 (Mute Test):** No. I see the click, but I don't see "official-looking." That is their interpretation of the UI.
  *   **Step 3 (Privilege):** They have access to their heuristic ("I trust official..."). But could they have worked this out from the screen? Yes. The result likely *looked* official. They are inferring their own motivation from the same visual cue you can see.
  *   **Result:** **JUDGMENT CALL.**
  *   **How to Write It:** Do not write: "Users trust official sources." Write: "User selected result #3. They *attributed* this to the 'official' design aesthetic."
  *   **Roadmap Move:** Test the aesthetic, don't build the roadmap on the trust claim. The claim is a post-hoc rationalization of a visual preference.

  **2. The Blind Spot**
  *   **Quote:** "I never saw the cookie banner." (Banner visible on screen).
  *   **Step 1 (Category):** Experience. (Report on their perceptual field).
  *   **Step 2 (Mute Test):** No. The banner is visible to *you*, but their statement proves it was invisible to *them*.
  *   **Step 3 (Privilege):** High. Only they know what entered their conscious awareness.
  *   **Result:** **Weight = High.**
  *   **How to Write It:** This is not a lie; it is a usability failure. "Banner failed to capture attention despite visibility."
  *   **Roadmap Move:** Redesign banner placement/contrast. This is the most valuable quote of the three. It proves "visible" does not mean "seen."

  **3. The Verdict**
  *   **Quote:** "Honestly the whole thing felt pretty easy."
  *   **Step 1 (Category):** Score/Verdict.
  *   **Action:** **STOP.**
  *   **Result:** **Weight = 0.**
  *   **How to Write It:** Delete it. Unless they struggled visibly (errors, long pauses) and *still* said this (which indicates low standards), this sentence contains zero information.
  *   **Roadmap Move:** None. If you put this in the readout, you are padding the document to make the Product Director feel good.

  ***

  ### Part 3: The Hard Truth About Your Instincts

  You asked me to flag where the procedure can't help and to tell you something about your instincts you won't like.

  **Where the Procedure Fails (The Judgment Zone)**
  The procedure cannot solve the **Cause** category definitively. When a user says *why* they did something, you are stuck in the Nisbett & Wilson trap. You cannot know if they are lying to you or to themselves.
  *   **The Call:** You must decide if the explanation is *actionable*.
  *   **The Rule:** If the explanation suggests a design change that aligns with the observed behavior, keep it as a **hypothesis**. If the explanation contradicts the behavior (e.g., "I was in a rush" but they took 5 minutes), discard the explanation.

  **The Instinct You Won't Like**
  You said: *"I keep putting [verdicts] in the doc anyway."*

  You are doing this because you are afraid of the roadmap meeting.

  You suspect verdicts are contentless, but you include them because Product Directors want **validation**, not **insight**. A readout that says "The user was confused by the banner" creates work. A readout that says "The user thought it was easy" creates comfort.

  By including the "easy" quotes, you are signaling safety. You are acting as a stakeholder manager, not a researcher.

  **The Fix:**
  Stop trying to make the one-pager "balance" the good and bad. If 80% of the findings are friction and 20% are smooth, the one-pager should be 80% friction. If you include the "it was easy" quote to soften the blow, you are diluting the signal that moves the roadmap.

  **Your new rule:** If a quote doesn't suggest a specific change or confirm a specific risk, it doesn't go on the page. Even if the Product Director asks, "Did they like it?" your answer is, "They completed the task; their satisfaction score is irrelevant to the bottleneck we found in step 2."

  **Summary for your next readout:**
  1.  **Kill the verdicts.** ("It was easy" = Delete).
  2.  **Trust the blindness.** ("I didn't see it" = Design Failure).
  3.  **Demote the reasons.** ("I clicked because" = Hypothesis, not Fact).

  This will make your readouts shorter, sharper, and more uncomfortable. That means they will work better.
