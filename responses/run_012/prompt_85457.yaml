  5.  **Refining the Nuance (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say Bell's Theorem *requires* Realism. Bell's theorem assumes Local Causality (which implies a form of realism/hidden variables). The slogan says "Locality + Realism + Free Will -> Contradiction with QM."
      *   *Clarification on Realism:* The philosopher who said "giving up realism is incoherent" is likely arguing that you need *an* ontology to make sense of the theory, even if it's not "classical realism." I need to capture that distinction.
