answer: |-
  A student asks Ramsey how to evaluate the conditional: "If my life has meaning, then the stars are insignificant."

  "Apply the test," says Ramsey. "Add 'my life has meaning' to your stock of beliefs and see if the stars become insignificant."

  "I did," says the student. "But by mass, they still dominate."

  "Then you haven't added the belief," Ramsey replies. "You're looking for a fact about the universe. But meaning isn't a fact that follows; it's the perspective from which you draw. If you truly accepted the antecedent, the stars would shrink to coins—not because they changed, but because you stopped comparing your capacity to love with the size of things that cannot."
