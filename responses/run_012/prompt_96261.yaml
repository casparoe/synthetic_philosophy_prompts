      *   *Challenge 2 (The Oracle):* An oracle predicts undetermined events perfectly. If it knows, there's a fact (violates open future). If it doesn't know, it's miraculous luck.
      *   *Challenge 3 (Past Indeterminacy):* Past events were once future. If they were open then, what closed them? If "happening" closes them, what makes it true they happened? If later events settle them, future events provide truth-makers (violates asymmetry).

  3.  **Formulate the Defense (adhering to tenets 1-3):**
      *   *Tenet 1 (Truth Value Gaps):* Need to distinguish truth *simpliciter* from truth *at a time* or assertibility. The statement "She will accept" lacked a truth value *at the time of utterance*. Once the event occurs, we can look back and say "It was true that she would accept" *from the perspective of now*, but we must be careful not to say the *past utterance* changed its intrinsic semantic property. Rather, the property of "having been true" is acquired relative to the branching structure collapsing. Actually, a better move is to distinguish *truth* from *determinate truth*. Or use the "truth at a history" vs. "truth at a moment" distinction (Thomason/Kaplan style), but keep it plain. Let's stick to the prompt's requirement: Classical logic holds, but bivalence fails. So "True or False" is true, but neither disjunct is true.
      *   *Response to 1:* The utterance didn't change. At $t_1$, it was neither true nor false. At $t_2$ (after acceptance), we can say "It was true at $t_1$ that she would accept" is *false* (because at $t_1$ it wasn't true). But we can say "She accepted, so the prediction was correct/vindicated." The work "true" does is track metaphysical settledness. "Vindicated" tracks correspondence with later facts. The past utterance is fixed as *having been indeterminate*.
      *   *Response to 2 (Oracle):* This is a strong challenge. If the oracle is *perfect*, it implies determinism. I must deny the possibility of such an oracle in an indeterministic world. A device cannot track what does not exist. If it predicts correctly, it's either guessing (lucky) or the event was determined (contrary to hypothesis). I should bite the bullet: In an indeterministic world, a perfect oracle for *undetermined* events is metaphysically impossible. Its success would imply the events were determined.
      *   *Response to 3 (Past Indeterminacy):* This is the "Branching Time" problem. When a future becomes past, the branch narrows. What closes it? The *occurrence* of the event. But what makes it true? The *fact* of the event. The asymmetry is that future facts don't exist yet. Past facts do. The transition from future to past is the transition from potentiality to actuality. The truth-maker for "It happened" is the event itself, which now exists in the past. The truth-maker for "It will happen" (when open) is nothing.
      *   *Which is most damaging?* Challenge 1 is the most technical regarding truth predicates. Challenge 2 is an intuition pump about knowledge. Challenge 3 attacks the core metaphysics of time. Challenge 1 is often the stickiest for the "no truth value" view because of the intuition that if $p$ happens, "It was true that $p$" must hold. I need to deny "It was true that $p$" holds if $p$ was open.
      *   *Wait, Tenet 2:* Classical logic intact. Excluded Middle holds. "She will accept or she will not" is true. But neither disjunct is true. This is non-bivalent classical logic (like supervaluationism or similar).
      *   *Refining Challenge 1:* If I say "It was true," I imply determinacy. I should deny that "It was true" is the correct retrospective assessment. The correct assessment is "It turned out true." The utterance itself remains semantically fixed as indeterminate.
      *   *Refining Challenge 3:* The asymmetry is ontological. Past entities exist (tenselessly or in the growing block); future entities do not. What closed the past? The passage of time/actualization.

      *   *Selection:* I will argue Challenge 1 is the most serious because it threatens the coherence of truth-talk over time. Challenge 2 is easily dismissed (oracle impossible). Challenge 3 is just the definition of the view. Challenge 1 requires the most nuanced distinction between truth and vindication.

