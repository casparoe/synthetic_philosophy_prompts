      *   *Wait, one nuance on Challenge 1:* The user asks "what work 'true' is doing that 'vindicated' is not already doing." I need to answer this directly. "True" tracks the state of the world *at the time of utterance*. "Vindicated" tracks the relation between utterance and later world. In an open future, you can be vindicated without having been true. That's the work: distinguishing settledness from accuracy.

      *   *Wait, one nuance on Challenge 2:* If I say the oracle is impossible, am I conceding too much? No, if the future is open, there is no fact to know. So knowledge is impossible. The device would be a predictor, not a knower. If it predicts perfectly, it implies determinism. I must insist that the hypothetical describes an impossible world if it claims the events are undetermined *and* known.

