          4.  Address Challenge 2: The oracle is impossible in this metaphysics. If it works, the world is deterministic. Don't accept the hypothetical.
          5.  Address Challenge 3: The asymmetry is ontological. Past facts exist; future facts do not. The "closing" is the coming into existence of the fact.
          6.  Out-of-character note.

      *   *Self-Correction on Challenge 1:* The user says: "If instead it became true, then a piece of the past... has changed." I must deny it became true. It was *indeterminate*. Now it is *settled*. The proposition "She will accept" lacked a truth value. The proposition "She accepted" has a truth value. We must not confuse the two. But what about "It was true that she would accept"? I should deny this sentence is true. "It was true that..." implies "It was settled that...". Since it wasn't settled, "It was true that..." is false. This is a hard pill to swallow but necessary for the view.
      *   *Wait, Tenet 2 again:* Classical logic. If "It was true that P" is false, and "It was false that P" is false (because it was indeterminate), then Bivalence fails for past-tensed statements about future contingents? The prompt says "Statements about the settled past... have determinate truth values." So "My utterance was indeterminate" is a statement about the past. That is true. "My utterance was true" is a statement about the past. That is false. Okay, that works.
      *   *Refining the "True" vs "Vindicated" point:* The work "true" does is mark metaphysical settledness. "Vindicated" marks correspondence with later outcome. In deterministic worlds, they coincide. In indeterministic worlds, they come apart.

      *   *Refining Challenge 3:* "What closed them?" The actualization of one branch. "What made it true?" The existence of the event. Future events don't exist yet, so no truth-maker. Past events exist, so truth-maker exists.

      *   *Tone:* Careful analytic philosopher. Plain prose. No citations.

