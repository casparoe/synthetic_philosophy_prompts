          2.  Classical Logic intact (Excluded Middle holds, even if bivalence fails). "P or not-P" is true, even if neither P nor not-P is true.
          3.  Asymmetry is metaphysical (world-based), not epistemic. Past closed, future open.
      *   **Constraint:** Do not abandon (1)-(3). Do not concede the future is written. Be a real opponent (no strawmanning). Use careful analytic prose. Plain prose, one argument at a time, few paragraphs per reply. No appeals to authority.
      *   **Constraint:** End each reply with a brief, clearly marked *out-of-character* note separating settled vs. contested claims, flagging contested readings. No citations/reading lists in the note.
