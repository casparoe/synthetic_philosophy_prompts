answer: |-
  I will take the first challenge to be the most damaging, because it strikes at the coherence of our retrospective discourse. If we cannot make sense of how we talk about past predictions once the events have occurred, the view loses its grip on linguistic practice. The second and third challenges are serious, but they rest on metaphysical intuitions that I can block by insisting on the ontological distinction between existence and non-existence. The first challenge, however, threatens to make the notion of truth itself unstable over time.

  Let us begin with the hiring committee. You ask what work "true" is doing that "vindicated" is not. The work is this: "true" marks metaphysical settledness at the time of utterance, whereas "vindicated" marks correspondence with outcomes at a later time. In a deterministic world, these coincide. In an indeterministic world, they come apart. My claim is that when you said, "She will accept," the world was not yet settled on that matter. There was no fact of the matter. Therefore, your statement lacked a truth value. It was not true. When she accepted, your statement was vindicated—it matched the outcome—but it did not become true *retroactively*. To say "It was true that she would accept" is to say "It was settled that she would accept." Since it was not settled, that retrospective claim is false. The past utterance does not change its semantic properties; it remains an utterance that was indeterminate when made. We simply update our assessment of its accuracy. This preserves the fixed past: the past contains the fact that you made an indeterminate statement, not the fact that you made a true one.

  Regarding the oracle: I deny the possibility of the device you describe. Knowledge requires a fact to be known. If the future is open in the metaphysical sense I defend, there is no fact about her acceptance until she accepts. A device cannot track what does not exist. If the device announces the outcome correctly ten thousand times, there are only two options: either the events were determined all along (in which case the oracle is tracking causal chains, not open futures), or the device is guessing with impossible luck. I am willing to bite the bullet here: in an genuinely indeterministic world, a perfect predictor of undetermined events is metaphysically impossible. Its success would be proof that the events were not undetermined. You say you would sooner believe in facts about the future than in such coincidence; I say you should sooner believe in coincidence than in a metaphysics that eliminates freedom and openness. The oracle scenario begs the question by assuming knowability entails existence of truth-makers.

  Finally, the asymmetry of the past. You ask what closed the past events that were once open. The answer is: their actualization. When a potential event becomes present, it acquires existence. Once it exists, it is a fact. Truth-makers are entities or states of affairs. Future contingents lack truth-makers because the relevant states of affairs do not yet exist. Past contingents have truth-makers because the states of affairs now exist (in the past). The asymmetry is ontological. You ask what made it true that they happened. The event itself makes it true. But the event only makes it true once it occurs. Before it occurs, there is no event to serve as a truth-maker. You suggest that if later events settle them, the future provides truth-makers. But the settling event is not "future" when it does the settling; it is present. When we look back from today, the event is past. The truth-maker is the event *as it exists in the timeline*, not as it was anticipated. The openness lies in the non-existence of the future event, not in a lack of causal power.

  ***

  **Out-of-character note:**
  *Settled:* The distinction between truth as settledness and vindication as accuracy is a standard move in this literature, as is the denial of the possibility of knowing future contingents (often linked to the principle that knowledge entails truth).
  *Contested:* My claim that "It was true that she would accept" is strictly false (rather than true relative to the present) is contested even among open futurists; some allow retroactive truth assignments to preserve intuitive speech patterns. The impossibility of the oracle is also debated; some argue probabilistic knowledge is possible without determinate truth. The ontological status of the past (whether past events "exist" in a way future ones do not) is a major metaphysical dispute (Presentism vs. Growing Block vs. Eternalism), and my defense leans heavily on a Growing Block or Presentist ontology which is not consensus.
