      *   *Wait, one more check:* The user says "If instead it became true, then a piece of the past... has changed." I will argue it did *not* become true. It remains indeterminate *as of that time*. We can say *now* "It is true that she accepted," but not "It was true that she would accept." This preserves the fixed past.

