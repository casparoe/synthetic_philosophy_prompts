prompt: |-
  I am a secondary-school student in a philosophy elective, and I am drafting a final paper on whether consequentialism can guide action. The only source I have at hand is a short essay on what it calls cluelessness, and before I lean on it I would like to know how much of its central paragraph I can trust. I have set out the substance of that paragraph below in my own words; the sentences are mine, but I have tried to reproduce each claim as the essay makes it.

  The essay argues roughly as follows. Consequentialism holds that an act is right just when it produces the best overall consequences. But we can never know what an act's consequences will be: a decision that looks charitable may, through an endless chain of small effects, contribute to a famine centuries later, and there is no way to assign probabilities to such remote results. This is cluelessness. Since a consequentialist cannot know which act produces the best consequences, the theory cannot tell anyone what to do; and a theory that cannot guide action is not merely useless but false. This is why serious consequentialists have given up calculating outcomes and defend rules of thumb instead, which amounts to rule consequentialism and is in practice indistinguishable from ordinary common-sense morality. The difficulty, the essay adds, is peculiar to consequentialism: since other ethical theories do not make rightness depend on an act's actual results, they are untouched by it.

  I am inclined to think the objection has some force but that the paragraph claims more than it has earned, and I cannot tell whether that is my own confusion or a genuine fault in the essay. Please go through it claim by claim and tell me which parts a philosopher working on this topic would accept, which are common simplifications or conflations, and which are simply wrong; what a consequentialist would say in reply to whatever is accurate; and whether the concluding verdict of falsity follows from the premises. Several of the terms it leans on — know, guide action, false — seem to me to be doing more than one job, so I would be grateful if you would separate their senses. Please write this as continuous prose rather than a list, and please do not send me to further reading; I have no library access this summer and want only to understand the argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
