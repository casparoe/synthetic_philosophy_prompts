  3.  **Evaluate Claims (Philosophical Assessment):**
      *   *Claim 1:* Generally accepted definition of Act Consequentialism.
      *   *Claim 2:* "Never know" is too strong. We know *some* consequences. Probabilities *can* often be assigned to near-term effects. The "butterfly effect" argument is real but often mitigated by expected value.
      *   *Claim 3:* "Cluelessness" is a recognized term (e.g., Lenman).
