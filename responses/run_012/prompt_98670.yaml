answer: |-
  **Project Title:** Tractability and Invariance: Re-evaluating the Formalization of Occam's Razor

  **Project Summary**
  The standard formalization of Occam's Razor in algorithmic information theory identifies simplicity with Kolmogorov complexity: the length of the shortest program generating the data on a universal Turing machine. This underpins Solomonoff Induction, where priors are assigned proportional to $2^{-K(h)}$. The received view holds that this justifies Occam's Razor objectively, as the choice of universal machine affects priors only by an additive constant. This project challenges that view. It argues that description length alone fails to capture a crucial dimension of scientific simplicity: computational tractability. A hypothesis that is compact but requires astronomical time to yield predictions is scientifically useless compared to a slightly longer but tractable one. This project asks whether a resource-bounded complexity measure can replace Kolmogorov complexity in a universal prior without losing the machine-invariance required for objectivity. I will formalize three candidate modifications, test them against specific counterexamples where description length and runtime diverge, and evaluate their stability under changes of reference machine.

  **The Central Question**
  The project is driven by a single, determinate question: **Is there a resource-bounded complexity measure that satisfies a robust Invariance Theorem (machine-dependence bounded by a constant or low-order polynomial) while strictly penalizing hypotheses with high evaluation costs?**

  This is not merely a request for a new definition, but a test of compatibility between two desiderata:
  1.  **Objectivity:** The ranking of hypotheses should not depend arbitrarily on the choice of universal machine (the standard defense of Solomonoff Induction).
  2.  **Tractability:** The ranking should favor hypotheses that generate predictions within feasible computational bounds.

  If the answer is negative, it implies a fundamental tension between the objectivity of algorithmic probability and the practical constraints of scientific inference. If positive, it requires identifying the minimal modification to the Solomonoff prior that achieves both.

  **Critique of the Received Picture**
  The standard defense of Solomonoff Induction relies on asymptotic convergence. In the limit of infinite data, the true hypothesis (if computable) will dominate regardless of the prior, and the $O(1)$ constant difference between machines becomes negligible. This defense stalls when applied to actual scientific practice for two reasons:

  1.  **Finite Data Regimes:** Science operates in the pre-asymptotic regime. In finite samples, the $O(1)$ constant can swamp the signal if the constant encodes a massive computational overhead.
  2.  **Prediction vs. Compression:** Kolmogorov complexity measures compressibility, not predictability. A hypothesis can be a short program that implements a one-way function or a cryptographic pseudo-random generator. Its description length is low, but extracting the next bit is computationally infeasible. Standard Solomonoff Induction assigns this hypothesis a high prior, treating it as "simple." Scientific practice treats it as intractable and effectively complex.

  Current defenses ignore the cost of *using* the hypothesis. They assume that once a hypothesis is stated, its predictions are immediately available. By putting the cost of computation on the table, the equivalence between "short program" and "simple hypothesis" breaks down.

  **Candidate Modifications**
  I will evaluate three formal modifications to the standard prior $P(h) \propto 2^{-K(h)}$:

  1.  **Time-Bounded Complexity (Levin Style):** Modify the complexity measure to $Kt(h) = \min \{ |p| + \log(time(p)) \}$. This penalizes runtime logarithmically.
      *   *Hypothesis:* This preserves invariance up to a polynomial factor but may not penalize "hard" problems enough to match scientific intuition.
  2.  **Logical Depth:** Define simplicity via the time required to run the *shortest* program, rather than the length of the program itself.
      *   *Hypothesis:* This captures the "work" done by the hypothesis but may lose the Invariance Theorem entirely, as simulation overheads multiply time linearly rather than additively.
  3.  **Two-Part Code with Computation Cost:** A Minimum Description Length (MDL) variant where the code length is $L(model) + \lambda \cdot Cost(computation)$.
      *   *Hypothesis:* This is flexible but introduces an arbitrary parameter $\lambda$ (the trade-off rate), threatening objectivity.

  **Methodology and Deliverables (One Semester)**
  This project is designed to be executable within a single semester by focusing on formal properties and restricted toy models rather than general proofs over all Turing machines.

  1.  **Formalization (Weeks 1-4):** Precisely define the three candidate priors. Explicitly state the Invariance Condition required for each (e.g., is multiplicative constant acceptable? Polynomial blowup?).
  2.  **Construction of Divergence Cases (Weeks 5-8):** Construct specific finite binary strings and hypothesis classes where $K(h)$ is identical but computational costs differ vastly.
      *   *Case A:* A linear congruential generator (short, fast) vs. a cryptographic PRNG (short, slow).
      *   *Case B:* Polynomial curve fitting vs. high-degree spline interpolation where the spline is compressible but evaluation is costly.
      *   *Goal:* Demonstrate that standard Solomonoff Induction ranks these equally, while scientific intuition ranks them differently.
  3.  **Stability Analysis (Weeks 9-12):** Test the candidate priors on these cases under a change of reference machine (e.g., changing the instruction set of the Turing machine).
      *   *Metric:* Does the ranking of hypotheses flip when the machine changes? If so, the modification fails the Objectivity desideratum.
  4.  **Deliverables:**
      *   A formal proof (or disproof) of the Invariance Condition for the most promising candidate.
      *   A comparative table showing the ranking of the Divergence Cases under each prior.
      *   A 20-page paper arguing for or against the viability of resource-bounded priors in philosophy of science.

  **Failure Conditions**
  The project will be deemed to have failed to find a solution if:
  1.  **Arbitrariness:** All tractable modifications introduce parameters (like $\lambda$) that cannot be fixed without appealing to pragmatic, non-epistemic values.
  2.  **Machine Dependence:** The ranking of hypotheses in the Divergence Cases flips under trivial changes to the reference machine, implying the "tractability" is an artifact of the encoding rather than the hypothesis.
  3.  **No Bite:** The candidate modifications agree with standard Kolmogorov complexity on all constructed cases, implying the distinction between description length and runtime does not affect the prior in the finite regime.

  **Scope Assessment**
  This is **dissertation-chapter scope** masquerading as a semester project, but it is manageable if strictly bounded. The trap lies in attempting to solve the general case of resource-bounded Solomonoff Induction, which touches on open problems in complexity theory (e.g., $P$ vs $NP$ implications for induction).

  To keep this feasible for a fellowship prospectus (and a semester's work), I will not attempt to prove general convergence theorems. Instead, I will focus on the *adequacy conditions*. The goal is not to derive the "One True Prior," but to demonstrate that the standard justification for Occam's Razor is incomplete and to map the specific trade-offs required to fix it. If the semester ends with a rigorous proof that *no* such invariant measure exists, that is a successful negative result. The risk is getting bogged down in the technicalities of Turing machine encodings; I will mitigate this by working with specific, high-level machine models (e.g., Python-like pseudocode with step counts) where the overhead constants are transparent.

  **Conclusion**
  If scientific simplicity tracks usability rather than just compressibility, the standard formalization of Occam's Razor is fundamentally mistaken. This project isolates the technical cost of correcting that mistake. By testing whether tractability can be formalized without sacrificing objectivity, it clarifies whether the "razor" is a theorem of logic or a pragmatic heuristic disguised as one.
