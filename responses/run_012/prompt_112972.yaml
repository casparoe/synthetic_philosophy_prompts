answer: |-
  Your intuition is spot on. You've identified a "seam" that trips up a lot of smart people, including physicians who read a lot of pop science. The doctor in your book club got the **definitions** right but failed the **logic** when applying those definitions to groups and social policy.

  Here is the breakdown of what a geneticist would nod at, what is subtly confused, and what is fundamentally wrong.

  ### 1. The Green Light: What He Got Right
  A geneticist would agree with the first half of his statement. These are the standard textbook definitions of heritability.

  *   **"It's not about you as an individual, it's about a population."**
      *   **Verdict:** **Correct.** Heritability ($h^2$) is a population statistic. It describes variance, not determination. You cannot say "60% of *my* height is genetic."
  *   **"70% of the differences between people in that group trace back to genetic differences."**
      *   **Verdict:** **Correct.** This is the definition of variance partitioning. It is $V_G / V_P$ (Genetic Variance divided by Total Phenotypic Variance).
  *   **"It says nothing about whether a trait can change."**
      *   **Verdict:** **Correct.** This is the "malleability" caveat. PKU (a metabolic disorder) is 100% heritable but 100% treatable with diet. High heritability does not mean immutable.
  *   **"Heritability is only ever measured against the range of environments people happen to be in."**
      *   **Verdict:** **Correct.** Heritability is context-dependent. If you clone a bunch of plants and grow them in identical soil, heritability is 0 (because there is no genetic variance). If you grow different seeds in identical soil, heritability is 1 (because all variance is genetic).

  ### 2. The Yellow Light: The "Fairer World" Confusion
  This is the subtly off part. It sounds intuitive, but the math works the opposite way he described.

  *   **His Claim:** "As we make society more equal... heritability should go down, because we're squeezing out the environmental differences. So a fairer world literally means genes matter less."
  *   **The Error:** He is conflating **inequality of outcome** with the **heritability coefficient**.
  *   **The Genetics:** Remember the formula: $h^2 = \text{Genetic Variance} / (\text{Genetic Variance} + \text{Environmental Variance})$.
      *   If you make society more equal, you reduce *Environmental Variance* ($V_E$).
      *   If $V_E$ gets smaller, the denominator gets smaller.
      *   Therefore, **$h^2$ (heritability) goes UP, not down.**
  *   **The Reality:** In a perfectly equal environment, 100% of the remaining differences between people would be due to genes. Heritability would approach 1.0.
  *   **Why it feels true:** He is thinking that if environments are equal, genes become less *important* for success. But statistically, genes become *more* explanatory of why people differ.
      *   *Example:* In a country with terrible, random nutrition, height differences are mostly due to who got enough food (Environment). Heritability is low. In a country with perfect, equal nutrition, height differences are mostly due to genetics. Heritability is high.
      *   *Correction:* A fairer world means **environmental luck matters less**, but it means the **heritability statistic goes up**.

  ### 3. The Red Light: The Group Gap Fallacy
  This is the "seam" you were looking for. This is the most famous error in behavioral genetics, often called **Lewontin's Fallacy** (after geneticist Richard Lewontin, who debunked it in 1970).

  *   **His Claim:** "When a trait is strongly heritable inside a group, that's good evidence the differences between groups are genetic too."
  *   **The Error:** **Within-group heritability tells you *nothing* about between-group differences.**
  *   **The Logic:** You cannot use variance *inside* Group A and variance *inside* Group B to explain the average difference *between* Group A and Group B.
  *   **The Classic Analogy (The Two Fields):**
      1.  Take a bag of genetically diverse corn seeds.
      2.  Plant half in Field A (rich soil, perfect sun).
      3.  Plant half in Field B (poor soil, no sun).
      4.  **Inside Field A:** The tall stalks are tall because of their genes. Heritability is high (say, 0.8).
      5.  **Inside Field B:** The tall stalks are tall because of their genes. Heritability is high (say, 0.8).
      6.  **Between Field A and Field B:** The average height difference is 100% due to the soil (environment).
      7.  **Conclusion:** You can have high heritability *within* both groups, but the gap *between* them is entirely environmental.
  *   **Application to Humans:** Even if IQ is 0.7 heritable within Group X and 0.7 heritable within Group Y, the average difference between Group X and Group Y could be 100% environmental (e.g., systemic bias, wealth disparity, test bias, pollution, stress). The within-group statistic provides zero evidence for the between-group cause.

  ### Summary: Where the Argument Breaks
  Your book club doctor is not a crank; he understands the *definition* of heritability better than 95% of the public. However, he made two critical errors:

  1.  **The Direction Error:** He thinks equalizing environments lowers heritability. (Actually, it usually raises it).
  2.  **The Scale Error:** He thinks statistics describing individuals within a group apply to the average difference between groups. (This is statistically invalid).

  **The "Seam":** The seam is exactly where he moves from **variance** (why do *I* differ from *you*?) to **means** (why does *Group A* differ from *Group B*?). Heritability explains variance; it does not explain means.

  If you want to push back gently, the corn seed analogy is usually the most persuasive. It grants his premise (yes, heritability is high within the groups) while dismantling his conclusion (therefore the gap is genetic).
