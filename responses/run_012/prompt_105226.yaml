answer: |-
  This is a sharp pedagogical bottleneck. You are correct that most literature on Quantum Immortality (QI) is polemical: it either assumes the Many-Worlds Interpretation (MWI) entails QI or assumes QI is absurd so MWI must be false. To teach this rigorously, you need a framework that isolates the metaphysical and physical commitments required to make the claim coherent.

  Here are the desiderata for an adequate theory of personal survival across branches, structured by the cases you specified.

  ### The Desiderata List

  **1. The Unitary Constraint**
  *   **Requirement:** The theory must not invoke wavefunction collapse or non-unitary evolution to explain survival.
  *   **Case/Consideration:** *No consciousness collapses anything.* If survival depends on a collapse to the "alive" state, it is not QI; it is standard Copenhagen with a magic observer.
  *   **Status:** **Non-Negotiable** (Physics).

  **2. The Branching/Classical Distinction**
  *   **Requirement:** The theory must explain why survival is guaranteed (or probable) in a quantum split but not in a classically deterministic world with epistemic uncertainty.
  *   **Case/Consideration:** *The Classical Coin Flip.* In a deterministic world, if a coin flip kills you, you die. In MWI, both outcomes occur. The theory must articulate why the *ontology* of branching changes the *expectation* of survival compared to classical ignorance.
  *   **Status:** **Non-Negotiable** (Logic/Physics).

  **3. The Measure/Weight Constraint**
  *   **Requirement:** The theory must account for the Born Rule weights (amplitudes) without rendering them irrelevant to the agent.
  *   **Case/Consideration:** *The Spin-Triggered Gun.* If the "alive" branch has amplitude $10^{-100}$, does the agent still expect to find themselves there? If weights don't guide expectation, the theory disconnects from quantum mechanics.
  *   **Status:** **Non-Negotiable** (Physics).

  **4. The Fission/Identity Constraint**
  *   **Requirement:** The theory must specify whether survival requires *numerical identity* or merely *psychological continuity*.
  *   **Case/Consideration:** *Parfitian Fission.* Branching is structurally identical to teletransportation fission. If "I" am the pre-branch person, do I survive as *both* successors, *neither*, or *one*? QI requires a specific answer to avoid the "I die in one branch" counter-claim.
  *   **Status:** **House Rule** (Metaphysics of Identity).

  **5. The First/Third-Person Decoupling**
  *   **Requirement:** The theory must reconcile the third-person fact of death with the first-person fact of survival.
  *   **Case/Consideration:** *3rd Person Fact vs. 1st Person Fact.* To an external observer, the subject dies in most branches. To the subject, they only experience survival. The theory must explain how these perspectives coexist without contradiction.
  *   **Status:** **Non-Negotiable** (Phenomenology).

  **6. The Decision-Theoretic Constraint**
  *   **Requirement:** The theory must yield a actionable recommendation for high-stakes choices.
  *   **Case/Consideration:** *The Poison Pill.* Should a rational agent take a pill that kills them in 99% of branches but makes them rich in 1%? If QI holds, is this rational?
  *   **Status:** **House Rule** (Pragmatics/Rationality).

  **7. The Selection Effect Constraint**
  *   **Requirement:** The theory must distinguish between *anthropic selection* and *causal survival*.
  *   **Case/Consideration:** *Survivorship Bias.* Just because I only observe worlds where I exist doesn't mean I was *guaranteed* to exist there. The theory must explain why this isn't a trivial tautology ("I observe what I observe").
  *   **Status:** **Non-Negotiable** (Probability Theory).

  ---

  ### The Incompatibility Flag

  You suspected the tension lies between **Born Rule Credence** and **Certainty of Survival**. You are right.

  **The Conflict:**
  1.  **Born Rule Credence:** A rational agent's degree of belief in finding themselves in a specific branch should match the branch's Born weight (squared amplitude).
  2.  **Certainty of Survival:** In a suicide experiment, the agent's degree of belief that they will *experience* survival should be 1 (100%), regardless of the weight of the survival branch.

  **Can they be jointly satisfied?**
  Strictly speaking, **no**, not within standard decision theory. If you are certain you will survive, your credence in the "death" branch is 0, which contradicts the Born weight (which is $>0$).

  **Is there a way out?**
  There is only one viable "way out" that isn't merely positing two unrelated probabilities: **Redefining Probability as Caring Measure.**
  Proponents like David Wallace or Hilary Greaves argue that probability in MWI isn't about *which* world becomes actual (all do), but about how much an agent should *care* about their successors.
  *   *The Move:* You assign Born weights to your *concern* for future branches, but you assign credence 1 to *having* a future experience.
  *   *The Cost:* This requires abandoning the idea that probability tracks "chance of occurrence." It tracks "measure of existence." If your students hold a classical view of probability (chance of truth), this solution will look like word games. If they accept a functionalist view of probability, it holds.

  ---

  ### The Most Exclusionary Requirement

  **The Measure/Weight Constraint (Desideratum #3).**

  This is the filter that kills the most candidates.
  *   **Why:** It is easy to say "I always survive" (Strong QI). It is easy to say "Weights determine probability" (Standard MWI). It is extremely difficult to say "I always survive *and* weights matter."
  *   **The Exclusion:** If weights matter, the agent should fear low-weight survival branches (Quantum Russian Roulette becomes irrational). If weights don't matter, the theory violates the physics of MWI. Most QI arguments fail here by implicitly setting the weight of the "dead" branch to zero for the subject, which violates unitarity.

  ---

  ### Scorecard: Main Lines Against Desiderata

  **1. MWI + Self-Locating Uncertainty (e.g., Sebens/Carroll)**
  *   **Verdict:** **Fails QI.**
  *   **Score:** Satisfies Born Weight and Unitary constraints. Fails Certainty of Survival. Agents should expect to die in high-death-weight scenarios. Treats branching like classical uncertainty regarding *which* branch is "mine."

  **2. Survival-is-Certain Reading (Strong QI / Tegmark)**
  *   **Verdict:** **Fails Physics.**
  *   **Score:** Satisfies Certainty of Survival and First/Third-Person Decoupling. Fails Measure/Weight Constraint. Implicitly treats low-amplitude branches as having zero measure for the observer, violating the Born Rule.

  **3. Collapse / No-Branching Reading (Copenhagen / Single World)**
  *   **Verdict:** **Fails Premise.**
  *   **Score:** Satisfies Born Weight and Classical Distinction. Fails Unitary Constraint and Fission/Identity (no branching occurs). QI is simply false here; you die when the wavefunction collapses to the dead state.

  **Pedagogical Note:** The unit will likely stall at Desideratum #3. If students accept that "probability" in MWI is about *measure of existence* rather than *chance of occurrence*, QI becomes coherent but decision-theoretically inert (you survive, but you should still fear the gun). If they insist probability is *chance of occurrence*, QI is incoherent.
