answer: |-
  ### The Pain Badness Decision Tree

  Start at the top and follow the path that matches your intuition about the cases.

  **Q1. Consider the pain asymbolia case: the patient feels the sharp sting but does not mind it. Is the *sensation itself* bad for them, even though they are smiling?**
  *   **Yes:** Go to **Leaf A**.
  *   **No:** The badness must lie in their reaction or context. Go to **Q2**.

  **Q2. Consider your 'Healing Pain' case: the pain is intense, but you welcome it because it means recovery. Is the pain *intrinsically* unpleasant (a negative element), or is it neutral until you react?**
  *   **Intrinsically unpleasant (it's bad but worth it):** Go to **Leaf B**.
  *   **Neutral (it's only bad if I mind it):** Go to **Q3**.

  **Q3. Imagine a human infant in pain. They cannot form complex thoughts. Do they feel *bad* pain, or just raw sensation?**
  *   **Yes, they feel bad pain:** Judgement is not required. Go to **Q4**.
  *   **No, without judgement it isn't bad:** Go to **Leaf C**.

  **Q4. Imagine a masochist who enjoys pain. They feel the sensation and desire it to continue. Is the pain still bad for them?**
  *   **Yes, despite their desire:** Go to **Leaf D** (or **Leaf B** if you changed your mind).
  *   **No, if they desire it, it isn't bad:** Go to **Leaf E**.

  **Q5. Imagine 'Secret Pain': you feel pain, but it causes no distraction, no damage, and no one knows. Is it bad?**
  *   **Yes, the experience itself is enough:** You likely belong at **Leaf B** or **Leaf E** (re-evaluate Q2/Q4).
  *   **No, only because of what it causes (missed work, distress):** Go to **Leaf F**.

  **Q6. (Tie-Breaker) Is the badness located in the *command* to stop (imperative) or the *representation* of damage (evaluative)?**
  *   **Command:** **Leaf G (Unnamed)**.
  *   **Representation:** **Leaf B**.

  ---

  ### The Leaves

  **Leaf A: Sensory Hedonism**
  *   **Awkward commitment:** You must claim the smiling asymbolic patient is suffering just as much as a screaming one.

  **Leaf B: Evaluativism (Unpleasantness View)**
  *   **Awkward commitment:** You must explain why the 'badness' in the Healing Case doesn't motivate avoidance.

  **Leaf C: Judgement View**
  *   **Awkward commitment:** You imply infants and animals cannot suffer bad pain because they lack cognitive judgement.

  **Leaf D: Imperativism (Strong)**
  *   **Awkward commitment:** You must distinguish clearly between 'unpleasantness' and 'command', which often feel identical.

  **Leaf E: Desire Satisfaction View**
  *   **Awkward commitment:** If you change your mind and desire the pain, it ceases to be bad for you instantly.

  **Leaf F: Externalism (Effect View)**
  *   **Awkward commitment:** A pain that causes no trouble (secret pain) is not bad at all.

  **Leaf G: Unnamed (Imperativist Variant)**
  *   **Awkward commitment:** Struggles to explain why we obey the command to stop pain if it isn't already bad.

  ---

  ### Indistinguishable Leaves
  **Leaf C (Judgement View) and Leaf E (Desire View):** In concrete cases, these are nearly impossible to tell apart. If you judge pain bad, you usually desire it to stop; if you desire it to stop, you usually judge it bad. The tree forces a split at Q3/Q4, but your intuitions may wobble between them.

  ### The 'Healing Pain' Case Test
  **Does the tree handle it?** Yes, it handles it without breaking.
  The case is explicitly tested at **Q2**. If you feel the pain is *intrinsically* unpleasant despite the good news, you are directed to **Leaf B (Evaluativism)**, which accommodates the idea that pain is bad *qua* pain but can be outweighed. If you feel the pain is *neutral* because of the context, you are directed down the reaction-based path (Leaves C, E, or F). The tree does not break; it successfully isolates whether you view the badness as inherent to the feeling or dependent on the attitude towards it.
