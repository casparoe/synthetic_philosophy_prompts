  *(Self-Correction during drafting)*: I initially thought about separating the procedure from the application. But the prompt asks for the procedure *and* then to run it. I should structure it so the procedure is defined, then applied, without breaking the prose flow. I need to be careful not to use numbered lists even implicitly. I will use paragraph breaks to signal shifts in logic. I must explicitly mention which parts of Hume don't survive the fiat translation.

