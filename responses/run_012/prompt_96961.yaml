answer: |-
  My dear colleague, I share your weariness, and I share your suspicion that the standard apparatus of our trade is too sterile for the political heat of the cabinet room. You ask for a Humean decision procedure, and it is a sharp instinct, though you warn me that your Hume is a caricature of the quantity theory. Let us begin by correcting that gently, for if you proceed with the caricature, you will miss the weapon's edge. Hume did not merely say that an increase in money raises prices; he said that the increase first quickens industry, that there is an interval between the injection of money and the rise of wages and prices, and that during this interval, the dealers and manufacturers who receive the new money first are enriched at the expense of those who receive it last. This is the core of the procedure you need, but we must be honest about where his eighteenth-century metallic world breaks against your inconvertible paper and floating rate. Hume's Price-Specie-Flow Mechanism, which argues that a trade deficit naturally drains gold until prices fall and competitiveness returns, does not survive translation intact. In your regime, the gold does not flow; the exchange rate collapses. The self-correction remains, but the pain is distributed differently, landing immediately on the purchasing power of the import-dependent poor rather than gradually on the wage levels of the exporting sector. Furthermore, Hume wrote of public credit as a danger to the state's survival, fearing that high debt would lead to high taxes or inflationary repudiation, a warning that survives perfectly well in your context of a state development bank financed by money creation. So, here is the procedure, woven as a series of interrogations you must pose to the text of any proposal before it reaches the cabinet.

  The first question you must ask is whether the proposal confuses the quantity of money with the increase of real wealth. Hume was relentless on this point: money is nothing but the representation of labour and commodities. If the minister's note suggests that printing currency or blocking the exit of foreign notes creates wealth, you must stop the process immediately with a negative verdict. This is not a judgment call; it is a categorical error in Humean terms. However, you must distinguish this from the claim that money stimulates industry. If the proposal argues that a temporary increase in liquidity will mobilize idle resources in the informal sector, Hume would allow that this might work in the short interval before prices adjust. Here lies your first judgment call dressed as procedure: you must estimate the length of that interval. In a small open economy with a large informal sector holding foreign cash, the interval may be vanishingly short because expectations of depreciation are already priced in. If you judge the interval to be negligible, the proposal fails on the grounds that it will produce inflation without the stimulating quickening of industry. If you judge there is slack, you may pass it to the next question, but you must mark this clearly for the minister as a gamble on expectations, not a certainty of growth.

  The second question concerns the rate of interest. You will often see proposals, like the state development bank you mentioned, claiming that money creation will lower lending rates to spur investment. Hume argues that interest rates are determined not by the quantity of money but by the supply of real capital relative to the demand for borrowing, which is to say, by the thrift and industriousness of the people. If a proposal claims to lower rates by printing money, it is fundamentally mistaken about the nature of interest. This part of Hume's reasoning survives the translation to fiat currency perfectly well, as modern loanable funds theory agrees with him here against the liquidity preference theorists. If the proposal relies on this mechanism, you should recommend a no, unless the minister explicitly accepts that the lower rates are a temporary subsidy funded by inflation, which is a redistribution of wealth from savers to borrowers. This is where economics ends and politics begins. If the minister acknowledges that he is taxing the informal sector's foreign savings via inflation to subsidize state-chosen borrowers, you cannot stop the proposal on economic grounds alone; you must hand the decision to the cabinet as a distributive choice. But if they claim it is a permanent structural fix to the cost of capital, you must strike it down as a delusion.

  The third question addresses the jealousy of trade. When you see a tariff wall proposed to close the current-account deficit, you are looking at pure mercantilism, which Hume ridiculed as a fear that one's neighbour's gain is one's own loss. In your floating rate regime, a tariff might reduce imports, but the exchange rate will likely appreciate or the domestic price level will rise, choking off exports elsewhere, leaving the balance unchanged but the efficiency lower. Hume's argument that the balance of payments self-corrects holds, though via your exchange rate rather than specie flows. If the proposal claims to permanently eliminate the deficit through protectionism, it fails the Humean test. However, if the proposal admits the deficit is a symptom of low domestic savings and argues for tariffs as a temporary shield for infant industries, Hume might pause, though he generally preferred open competition. Here you face a second judgment call: is the informal sector's hoarding of foreign banknotes a sign of low confidence that a tariff might exacerbate? If the tariff signals further autarky, the informal sector may hoard more foreign cash, draining the domestic circuit of money. You must assess whether the policy will drive more wealth into the informal foreign-currency shadow economy. If the answer is likely yes, the proposal is self-defeating. This is not purely economic; it is sociological, but it determines the efficacy of the monetary transmission.

  The fourth question concerns public credit and the sustainability of the state's obligations. Hume feared that public credit would allow states to wage wars they could not afford and burden posterity with debt, eventually leading to bankruptcy or inflation. In your context, a state development bank financed by money creation is a form of public credit that bypasses the bond market. You must ask whether this creates a claim on future output that cannot be met. If the bank lends to projects with returns lower than the inflation rate it generates, it is a destruction of capital. Hume would view this as a danger to the constitution of the economy. If the proposal lacks a clear mechanism for the bank to be recapitalized from real profits rather than further money creation, you should flag it as a threat to long-term stability. This is where you must be blunt: if the minister intends to use the bank as a fiscal slush fund, Hume's warning about the death of public credit applies. You cannot stop a government from choosing inflation, but you can label it as what it is: a default on the currency held by the public.

  Now let us run this procedure on the three proposals troubling your afternoon. Start with the tariff wall intended to close the deficit. The first question asks if it confuses money with wealth; it does not explicitly, but it implies that retaining foreign exchange is equivalent to increasing national riches. This is a mercantilist error. The second question on interest is irrelevant. The third question on the jealousy of trade is where it fails. The proposal treats the current-account deficit as a humiliation rather than a reflection of investment and savings balances. In a floating rate regime, the deficit is financed by capital inflows or reserve drawdowns; blocking imports does not fix the underlying savings gap. Furthermore, given your large informal sector, tariffs will likely increase smuggling and drive more savings into foreign banknotes outside the banking system. The interval of benefit to domestic producers will be swallowed by the immediate rise in input costs for everyone else. This proposal should receive a no. It is economically incoherent in your specific institutional context, even if Hume were not in the room.

  Next, consider the state development bank financed by money creation. The first question passes if they admit the money is to mobilize idle capacity, but the second question on interest is fatal. The proposal claims to bring lending rates down. Hume tells us this is impossible in the long run; money creation does not increase real capital. It merely raises prices. If the minister claims permanent lower rates, you must issue a no. If they admit it is a temporary subsidy, you move to the fourth question on public credit. Financing a bank by money creation is inflationary debt. In an economy where the informal sector already distrusts the currency, this risks accelerating the flight to foreign banknotes. The judgment call here is whether the inflation will remain contained. Given your history and the inconvertible nature of the currency, the market will likely anticipate the debasement immediately, shortening Hume's interval to zero. The result is stagflation, not development. This proposal should also come out badly, quite possibly the one your minister likes best because it offers the illusion of free money. You must tell him that he is not lowering the cost of capital; he is taxing the holders of your currency to subsidize the borrowers, and since the poor hold the currency and the connected borrow, it is a regressive transfer.

  Finally, the rule requiring exporters to surrender foreign earnings and residents to keep savings at home. This is a capital control. Hume did not deal with inconvertible paper, but he argued against forcing money to stay where it is not wanted, as money will find its level. If you force exporters to surrender forex, they will underinvoice exports or move transactions to the informal market. This shrinks the formal tax base. The first question asks if this increases wealth; it does not, it only changes the location of the accounting. The second question is irrelevant. The third question on trade suggests this is an attempt to manipulate the balance of payments by force rather than price signals. In a floating rate regime, this prevents the exchange rate from adjusting to clear the market. It creates a black market premium. The judgment call is on enforcement. If your state capacity is low, this rule will simply expand the informal sector you already worry about. If the informal sector grows, the government's ability to tax or manage the economy shrinks. This proposal is a political decision about state control versus market freedom. Hume would likely oppose it as an impediment to the circulation of wealth, but he might acknowledge the state's right to defend its currency if it is under speculative attack. However, since you have a floating rate, the speculative attack is a daily feature, not an emergency. This proposal should be handed to the minister with a warning that it will increase the size of the informal economy and reduce the accuracy of your economic data, making future policy harder. It is not an economic no, but it is a strong caution.

  You asked me to close by telling you what this procedure cannot do. It cannot tell you the optimal rate of inflation, for Hume had no concept of a Phillips Curve or an inflation-targeting regime. It cannot tell you how to manage the transition of the informal sector into the formal economy, as Hume assumed a relatively unified market. It cannot predict the political fallout of angering the informal savers who hold foreign banknotes, for Hume wrote for a polity of merchants and landowners, not a dual economy of cash and contraband. Most importantly, it cannot save you from the minister's need to be seen acting. Hume's wisdom is that money is a veil, but politicians believe the veil is the face. The procedure can tell you when a proposal is a delusion about the nature of wealth or interest, and it can tell you when a proposal is merely a redistributive political choice disguised as technical economics. But it cannot stop a cabinet from choosing inflation over unemployment, or control over efficiency. It can only ensure that when they make that choice, they do so with their eyes open to the fact that they are redistributing wealth, not creating it, and that the bill will come due when the interval closes and the prices rise. I hope this serves you for the afternoon; I suspect you will need it again before the month is out.
