  **TO:** Content Standards Panel
  **FROM:** [Your Name], Independent Lay Member
  **DATE:** 24 October 2023
  **SUBJECT:** Decision Memo: Complaint 2023/44 (Religious Affairs Slot)

  **1. Purpose**
  This memo sets out my recommendation regarding Complaint 2023/44 concerning a segment on spiritual healing. It addresses the central philosophical disagreement within the panel regarding the status of religious utterances under our Editorial Code, specifically the distinction between 'contested claims of fact' (Clause 4.1) and 'personal belief or opinion' (Clause 4.2).

  **2. The Status of the Utterance**
  The complainant contends that the contributor's statement—"God healed me"—is a medical hypothesis competing with oncological science. The broadcaster contends it is personal testimony. I recommend we reject the complaint, but only if we clarify *why* this testimony does not trigger the impartiality rule.

  There is a philosophical distinction here that our current code obscures. When the contributor states she was healed by God, she is not offering a differential diagnosis to compete with the oncologist's expertise. Drawing on later Wittgensteinian insights, we might view her words not as a scientific hypothesis awaiting verification, but as a 'picture' that governs her life. Her utterance functions within a religious form of life; it expresses a framework of meaning rather than a causal mechanism accessible to empirical falsification. The distance between her and the complainant is not merely a disagreement over evidence, but a divergence in grammatical rules. She is bearing witness to a transformation in her world-view; he is assessing tumour regression. To demand 'balance' here is to category mistake. It requires a scientist to debate a theologian on grounds where neither possesses authority over the other.

  **3. The Objection**
  However, I must articulate the strongest version of the counter-argument, which gives me pause. To classify religious assertions as non-factual 'pictures' risks being deeply patronising. Most believers understand themselves to be describing reality, not merely expressing an attitude. If we rule that religious claims are exempt from impartiality because they are not 'really' claims about the world, we undermine the sincerity of the faithful. We effectively tell them: 'We protect your speech only by denying you mean what you say.'

  Furthermore, our primary duty is audience protection. If we accept that religious testimony is immune from factual scrutiny, we risk licensing harmful misinformation. A viewer hearing that prayer cures cancer may delay treatment. If the panel begins distinguishing between 'real' claims and 'religious pictures', we entangle ourselves in adjudicating metaphysics. We risk deciding which believers are sincere and which are merely expressing themselves. If the objection is right—that religious claims are indeed factual claims about the world—then we lose the ability to protect religious expression from scientific imperialism, but we gain a stronger defence for vulnerable audiences against potentially lethal misinformation. We cannot have it both ways without clarity.

  **4. Recommendation on Complaint**
  Despite these risks, I recommend we **reject** the complaint. The context is decisive. This was a religious affairs programme, not a health advisory slot. The presenter did not validate the medical causality; she asked only about the impact on faith. The audience would reasonably understand this as testimony, not medical advice. Upholding the complaint would set a precedent requiring sceptical counter-weights to all personal religious experiences, rendering religious broadcasting impossible. However, this rejection relies on the specific framing. Had the presenter suggested prayer as a *alternative* to treatment, the decision would differ.

  **5. Recommendation on Code Amendment**
  This case reveals a structural flaw. The binary between 'fact' and 'opinion' is insufficient for religious testimony, which claims factual efficacy but functions experientially. We will continue to meet cases of this shape. I propose we introduce a third category of guidance: **First-Person Religious Testimony**.

  **Draft Guidance Note:**
  *“Accounts of personal religious experience, including attributions of divine causality, are treated as expressions of belief rather than contested claims of fact, provided they are clearly framed as first-person testimony. Such items must not present religious intervention as a proven alternative to established medical or scientific advice, nor discourage adherence to professional treatment.”*

  **Difficulties:**
  Wording this is perilous. The phrase 'expressions of belief' may still offend believers who view their testimony as factual. Conversely, 'must not present... as a proven alternative' requires editors to judge theological intent. There is also the risk of a loophole: broadcasters could dress up advocacy as testimony to bypass impartiality. We would need to monitor whether the 'first-person' framing is genuine or a regulatory shield.

  **6. Conclusion**
  We must reject this complaint to preserve the integrity of religious broadcasting, but we cannot rely on the current code to justify it. We need a category that acknowledges the unique grammar of religious language without surrendering our duty to prevent harm. We lose some philosophical purity by creating this exception, but we gain a workable standard that respects belief while safeguarding the audience.

  I invite the panel to consider this recommendation prior to Thursday's hearing.
