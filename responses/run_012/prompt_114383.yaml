answer: |-
  **Project Title:** Counterfactual Baselines and the Fischer Controversy: A Philosophical Analysis of Historical Responsibility

  **Project Summary**
  This project proposes a conceptual analysis of the Fischer Controversy, the long-standing historical debate regarding Germany's responsibility for the outbreak of the First World War. While historians have traditionally treated this as a dispute over evidence and chronology, I argue it is fundamentally a philosophical disagreement over counterfactual baselines. To assign causal responsibility is to claim that, holding a specific background course of events fixed as 'normal', the war would not have occurred but for a specific state's action. Historians agree on the chronology but disagree on which background conditions constitute the 'normal' baseline. This project seeks to determine whether a principled method exists for selecting such a baseline. If no such method exists, the question 'who started the war' is ill-posed, carrying profound implications for the ethical and political use of historical verdicts.

  **Statement of the Research Question**
  The primary research question is: *Is there a principled, non-arbitrary method for selecting the counterfactual baseline required to assign causal responsibility for the outbreak of the First World War?*

  This question admits a determinate answer. Either one can demonstrate a criterion for selecting a baseline that is neutral with respect to the competing historical narratives, or one can demonstrate that any selection necessarily imports normative assumptions that preclude objectivity. The project does not seek to answer 'who started the war', but rather to establish the conditions under which such a question can be meaningfully asked.

  **Background and Existing Positions**
  Since the 1960s, the historiography of the First World War has been polarised. On one side, the Fischer school argues that German leadership sought hegemony and actively precipitated the conflict. On the other, revisionists argue that Germany was encircled and that the war was a systemic failure of the alliance structure. Crucially, both camps largely agree on the factual chronology: the dates of mobilisation, the content of ultimatums, and the sequence of declarations.

  The persistence of the disagreement suggests the divergence lies elsewhere. My preliminary analysis indicates that proponents of German guilt tacitly fix a baseline of a stable European status quo, wherein German aggression is the deviation. Revisionists fix a baseline of inevitable systemic tension, wherein German action is a reaction to external pressure. Neither side explicitly defends their choice of baseline; it is assumed as part of the narrative framework. Consequently, the debate is a disguised and undefended dispute about which counterfactual world is the appropriate comparator for the actual world. Existing historical method lacks the tools to resolve this, as it is equipped to verify facts, not to validate the metaphysical presuppositions of causal attribution.

  **Methodology and Work Plan**
  This project employs conceptual analysis rather than archival research. Archival work is inappropriate here because the dispute is not evidential; adding more documents regarding the July Crisis will not resolve the disagreement over which background conditions should be held fixed. The work is philosophical, drawing on the metaphysics of causation and the logic of historical explanation.

  The term will be divided into three phases:

  *Weeks 1–4: Reconstruction of Implicit Baselines.*
  I will analyse key texts from the Fischer controversy to explicitly reconstruct the counterfactual baselines implicit in their arguments. The goal is to catalogue the specific 'normal' conditions each historian assumes. For instance, does the historian treat the alliance system as a fixed constraint or a variable choice? Is domestic instability treated as a constant or a contingency? This phase produces a taxonomy of the baselines currently in play.

  *Weeks 5–8: Evaluation of Selection Criteria.*
  I will test these baselines against philosophical criteria for causal selection. I will examine theories of counterfactual dependence to see if any offer a neutral mechanism for baseline selection. Can we appeal to statistical normality? Moral expectation? Legal status? I will argue that statistical normality fails because the pre-war period was unique; moral expectation fails because it begs the question of guilt; and legal status fails because international law was indeterminate. This phase aims to demonstrate that the choice of baseline is inherently normative.

  *Weeks 9–12: Synthesis and Implications.*
  The final phase involves drafting the core argument. If the choice of baseline cannot be made principled, I will articulate the consequences. Specifically, I will explore how the vocabulary of guilt, innocence, and reparations rests on this shaky foundation. The output will be a draft article of approximately 8,000 words suitable for a high-impact interdisciplinary journal.

  **Expected Results and Failure Conditions**
  A genuine result will be achieved if the project successfully demonstrates that the Fischer Controversy is structurally undecidable on historical grounds alone. A positive outcome is not limited to finding a principled baseline; indeed, proving that *no* principled baseline exists is the more significant finding. It would establish that 'who started it' is not a well-posed historical question but a political one masquerading as history.

  The project would fail if it merely restates the historical positions without isolating the philosophical mechanism (the baseline) driving the disagreement. It would also fail if it retreats into abstract metaphysics without remaining grounded in the specific historiography of the First World War. The risk is producing a critique that historians find irrelevant. To mitigate this, the analysis will remain tightly focused on the logic of the historical arguments themselves, ensuring the philosophical critique is immanent to the discipline.

  **Feasibility and Assessment of Scope**
  Is this a term's work? It is ambitious, but feasible provided the scope remains strictly limited to the *logic* of attribution rather than the history itself. I am not re-evaluating the evidence of the July Crisis; I am evaluating the structure of the arguments built upon that evidence. This reduces the workload from archival discovery to textual analysis and argument reconstruction.

  However, there is a risk of overreach. The literature on causation in history is vast. To complete this in twelve weeks, I must resist the temptation to survey the entire philosophy of history. I will restrict my theoretical framework to counterfactual theories of causation relevant to the specific problem of baseline selection. Furthermore, writing a polished article in the final four weeks is tight. If the conceptual work in weeks 5–8 reveals unexpected complexity, the writing phase may need to produce a detailed position paper rather than a finished article. Nevertheless, the core thesis—that the dispute is about baselines—is sufficiently formed that the term should be spent testing and refining this specific claim, rather than generating new historical data.

  **Significance**
  The significance of this project extends beyond the historiography of the First World War. If the choice of counterfactual baseline cannot be principled, the ethical and political uses to which historical verdicts are put rest on considerably shakier ground than suppose. National memory, reparations, and the moral standing of states often rely on definitive assignments of 'war guilt'. This project suggests that such assignments are not discoveries of historical fact but impositions of narrative structure. By exposing the philosophical fragility of these verdicts, this research offers a clearer understanding of the limits of historical knowledge in the public sphere. It clarifies that when we argue about who started a war, we are not merely arguing about the past, but negotiating the normative frameworks through which we view political agency. This buy-out would allow me to finalise this argument, moving it from a half-formed idea to a rigorous contribution to the philosophy of history.
