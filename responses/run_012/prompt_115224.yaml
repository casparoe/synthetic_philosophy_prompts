answer: |-
  Here is a decision tree designed for your reading group. It avoids jargon in the questions so participants sort themselves by intuition, but maps their answers onto standard positions in hinge epistemology.

  ### The Hinge Commitment Flowchart

  **Start:** *We all agree that some commitments (e.g., "The world exists," "I have two hands") function as the scaffolding of our thought. We don't prove them; we use them to prove other things.*

  **Q1. The Nature of the Grip**
  When you rely on one of these basic commitments, is your mind holding a **truth** that is too obvious to check, or is your body following a **rule** that is too deep to question?
  *   **(A) It's a Truth:** I am believing a proposition about the world; it just happens to be immune to doubt. *(Go to Q2)*
  *   **(B) It's a Rule:** I am acting in a certain way; calling it a "belief" or "truth" is a mistake. *(Go to Q2)*

  **Q2. The Scope of the Bedrock**
  Imagine a human being raised in complete isolation from our culture (a "wild child"). Once they learned to speak, would they necessarily share your basic commitments?
  *   **(A) Yes, Universal:** These commitments are grounded in human biology or rationality. Any sane human ends up here. *(Go to Q3)*
  *   **(B) No, Relative:** These commitments are grounded in our specific history, language, or community. A different form of life could have a different bedrock. *(Go to Q3)*

  **Q3. The Possibility of Change**
  If a future generation stops holding one of these basic commitments (e.g., they no longer treat "physical objects exist" as certain), have they made a **mistake** or simply become **different**?
  *   **(A) A Mistake:** The old hinges were correct, the new ones are wrong. Reason can correct the bedrock. *(Leaf)*
  *   **(B) Different:** The "riverbed" of thought has shifted. You can't say they are wrong, only that they are no longer playing our game. *(Leaf)*

  ---

  ### The Leaves (Positions)

  Here are the eight possible endpoints. I have marked the "Empty/Unstable" slots where the combination of answers creates philosophical tension.

  #### 1. Truth + Universal + Mistake
  *   **Name:** **Classical Foundationalism** (Moorean Realism)
  *   **Description:** Basic beliefs are objective truths shared by all humans, and denying them is irrational error.
  *   **Most Awkward Commitment:** You must claim that anyone who genuinely doubts "the world exists" is simply broken or irrational, leaving no room for deep conceptual disagreement.
  *   **Status:** **Viable.**

  #### 2. Truth + Universal + Different
  *   **Name:** **[EMPTY SLOT: Universal Dogmatism]**
  *   **Description:** Basic beliefs are objective truths shared by all, but changing them isn't an error, just a difference.
  *   **Most Awkward Commitment:** If they are objective *truths*, how can abandoning them not be a *mistake*? This view collapses into incoherence.
  *   **Status:** **Incoherent.** (If it's true, denying it is false).

  #### 3. Truth + Relative + Mistake
  *   **Name:** **Epistemic Contextualism** (Crispin Wright's "Entitlement")
  *   **Description:** Basic beliefs are truth-claims, but we are only "entitled" to them within our specific system. However, some systems are still rationally superior to others.
  *   **Most Awkward Commitment:** You have to explain how we can judge another community's bedrock as "mistaken" without using our own bedrock as the measuring stick (circularity).
  *   **Status:** **Viable.**

  #### 4. Truth + Relative + Different
  *   **Name:** **Historicist Propositionalism** (Kuhnian Relativism)
  *   **Description:** Basic beliefs are truth-claims specific to a time/place. When they change, it's a "paradigm shift," not a rational correction.
  *   **Most Awkward Commitment:** You cannot claim science is "progressing" toward truth, only that it is moving from one self-justifying system to another.
  *   **Status:** **Viable.**

  #### 5. Rule + Universal + Mistake
  *   **Name:** **[EMPTY SLOT: Evolutionary Rationalism]**
  *   **Description:** Basic commitments are biological instincts shared by all, but abandoning them is a rational error.
  *   **Most Awkward Commitment:** If these are pre-rational *instincts* (rules of action), how can they be subject to rational *correction*? You can't argue an instinct out of someone.
  *   **Status:** **Unattractive/Strained.**

  #### 6. Rule + Universal + Different
  *   **Name:** **Hinge Epistemology** (Standard Wittgenstein / Moyal-Sharrock)
  *   **Description:** Basic commitments are animal certainties (ways of acting) shared by all humans. They don't change via reason, they just evolve or persist.
  *   **Most Awkward Commitment:** You cannot criticize a community for its basic instincts, only describe them. This makes moral or epistemic condemnation of "alien" practices difficult.
  *   **Status:** **Viable.**

  #### 7. Rule + Relative + Mistake
  *   **Name:** **Pragmatic Constructivism**
  *   **Description:** Basic commitments are local habits, but some habits work better than others. We can rationally argue for better "rules of action."
  *   **Most Awkward Commitment:** If the rules define what counts as "working," you struggle to define the standard by which one rule is "better" than another without begging the question.
  *   **Status:** **Viable.**

  #### 8. Rule + Relative + Different
  *   **Name:** **Radical Fideism** (Peter Winch / Kierkegaardian)
  *   **Description:** Basic commitments are local practices. Different practices are incommensurable. Reason cannot cross the boundary between them.
  *   **Most Awkward Commitment:** You cannot argue with a fanatic or a conspiracy theorist; you can only wait for them to convert or exclude them.
  *   **Status:** **Viable.**

  ---

  ### Addressing Your Two Cases

  Here is how the tree sorts the specific situations that are bothering you.

  **(a) The Brother-in-Law (The Delusional Hinge)**
  *   **The Deciding Branch:** **Q2 (Universal vs. Relative).**
  *   **The Analysis:**
      *   If you land on **Universal** (Leaves 1, 2, 5, 6): Your brother-in-law is *not* operating on a hinge. Since hinges are shared by all sane humans (biology/rationality), his specific belief ("The government is fake") is a delusion, not a bedrock commitment. He is malfunctioning.
      *   If you land on **Relative** (Leaves 3, 4, 7, 8): Your brother-in-law *might* be operating on a hinge. If hinges are determined by community/practice, and he belongs to a community that treats sovereignty theories as bedrock, then functionally, it *is* a hinge for him.
      *   **The Awkward Truth:** If you end up in **Leaf 8 (Radical Fideism)**, you have to admit that arguing with him is category mistake. You aren't proving him wrong; you are just two different forms of life colliding. This is likely why the argument felt futile.

  **(b) The Scientific Revolution (The Shifting Bedrock)**
  *   **The Deciding Branch:** **Q3 (Mistake vs. Different).**
  *   **The Analysis:**
      *   If you land on **Mistake** (Leaves 1, 3, 5, 7): When physics moved from Newton to Einstein, we corrected a mistake. The old bedrock was false; the new one is true (or more entitled). Rationality drives progress.
      *   If you land on **Different** (Leaves 4, 6, 8): When physics moved from Newton to Einstein, the "riverbed" shifted. We didn't prove the old bedrock wrong (you can't prove a hinge); we simply started acting differently.
      *   **The Awkward Truth:** If you land on **Leaf 4 or 8**, you lose the comfort that science is "getting closer to reality." You are just swapping one set of unprovable assumptions for another.

  ### Indistinguishable Views Warning
  **Leaf 6 (Rule+Universal+Different)** and **Leaf 8 (Rule+Relative+Different)** are notoriously hard to pull apart in practice.
  *   **Why:** Wittgenstein often oscillates between "human animal certainty" (Universal) and "specific language games" (Relative).
  *   **The Test:** Ask the group: *"Is 'I have two hands' a hinge for a human raised in a culture that believes bodies are illusions?"*
      *   **Leaf 6** says: Yes, eventually their biology will force them to act as if they have hands.
      *   **Leaf 8** says: No, if their practice holds, their hinge holds.
      *   If your group can't agree on this hypothetical, they are effectively holding the same view but using different words for "human nature."

  ### How to Use This in Your Group
  Don't show them the leaf names initially. Have them answer Q1, Q2, and Q3 silently. Then reveal the leaves. The friction usually happens at **Q2**. Most people *want* to be Universal (to condemn the brother-in-law) but *feel* Relative (when they look at history). Forcing them to pick exposes the tension in *On Certainty* itself: Wittgenstein never fully settled whether hinges are biological or cultural. Your group has to decide which Wittgenstein they want.
