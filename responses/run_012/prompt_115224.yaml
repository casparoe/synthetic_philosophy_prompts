  So my brother-in-law has gone deep down the flat-earth / sovereign-citizen rabbit hole and we had a blow-up over Thanksgiving, and honestly the thing thats been eating at me since isnt him — it's that I couldn't even figure out what I was doing when I argued with him. I've been rereading On Certainty (okay, skimming — the numbered-remark format is killing me) and I want to bring something to my reading group that actually forces us to commit. Could you build me a decision tree / flowchart that starts from the one thing everyone in the group already grants — that some beleifs are so basic that doubting them isn't a mistake but more like a kind of nonsense, that they're closer to the way you stand than to a claim you could check — and leads to the real positions people end up in about what these hinges actually are?

  Make every branch a question a person could answer without already knowing which view it lands them in, so it sorts us by what we actually think rather than by which label we like. The branches should cover at least: whether hinges are propositions with truth-values at all, or something more like skills, instincts, or ways of acting; whether our relation to them is a kind of knowing or entitlement, or whether it's outside the epistemic game altogether (Wittgenstein's point that saying you know, here, is out of place — roughly); whether there's one set of hinges for all humans or whether they're relative to a practice or form of life; and whether hinges can ever be rationally revised or criticized, and by whom. Name each leaf if it has a standard name, otherwise just describe it and mark it unnamed, and give each one a sentence on its most awkward commitment.

  Two cases I really want the tree to be able to place, because they're what's bugging me: (a) a person whose delusion plays exactly the functional role of a hinge — it's never questioned, it structures everything else they believe, doubting it would unravel their whole picture — is that a hinge or not, and which branch is doing the deciding there? and (b) a whole community that one day stops treating something as a hinge, the way a scientific revolution changes what counts as basic. If some combination of answers doesn't correspond to any position anyone actually holds, don't force it — mark the empty slot and say whether that's because the view is incoherent, unattractive, or just unexplored. And flag any two views your tree can't genuinely pull apart. Doesn't need to be exhaustive; six to eight leaves is plenty.
