      *Least Sure Point:* The exact intent behind Friedman's "more unrealistic" claim. Is it a rhetorical flourish or a rigorous methodological rule? Scholars like Uskali Maki have spent careers unpacking this. I am least sure about the *best* charitable reconstruction of that specific sentence, though I am sure the popularizer's reading is the common *criticism*. I will frame the uncertainty around whether Friedman meant it as a *prescriptive rule* or a *descriptive observation* about successful theories.

      *Wait, one more check:* The prompt asks about the relation between testing assumptions and predictions. Friedman says we test predictions, not assumptions. But he also says assumptions *describe* the environment. If the environment changes, the assumption might fail. I need to clarify that Friedman distinguishes between *testing validity* (predictions) and *determining scope* (assumptions).

      *Let's finalize the "Least Sure" point.* It's often debated whether Friedman was a *realist* about the mechanism or an *instrumentalist*. The popularizer says instrumentalist. Most philosophers agree. But some (like Hoover) argue Friedman wanted causal explanations. I'll stick with the Instrumentalist label being "standard but contested" as the uncertainty. Actually, the "more unrealistic" claim is the most contentious textual interpretation. I'll pick that.

