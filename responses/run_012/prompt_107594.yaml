      *   Actually, **Tipping** is clearer. The service is already done. The tip doesn't coordinate an outcome; it rewards/punishes.

      *   *Let's stick with Tipping.* It's relatable and murky.

      *   *Evolution:* Yes, norms can conventionalise (sanctions fade) and conventions can normativise (sanctions added).

      *   *Tone Check:* Keep it conversational but precise. "Lobbing examples", "hardens into rules".

      *(Final thought on British English)*: Ensure "behaviour", "colour", "programme" (where applicable), "favour", "analyse". Avoid Americanisms like "gotten" or "fall" (season).

      *(Final thought on the Lewis Tradition)*: Lewis is specific. He distinguishes conventions from norms enforced by punishment *unless* the punishment is part of the coordination equilibrium. But the prompt says "nobody's doing it because it sorts out a coordination problem". I must honour that constraint.

