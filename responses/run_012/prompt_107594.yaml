          4.  The Crucial Test Case (Tipping or Dress Codes).
          5.  The Evolution Question (Fluidity).

      *   *Wait, one more check on the "School Fashion" example.* Why was that not a convention? "Vanishes". Lewis conventions need stability. But also, is it a coordination problem? Wearing cool clothes isn't necessarily coordination (I want to be distinct). That supports the "Coordination" rule.
      *   *Sleeping at night:* Not arbitrary. Supports "Arbitrariness" rule.
      *   *Strangers stepping aside:* Not a standing regularity. Supports "Regularity" rule.

      *   *So the Philosopher's Rule is:* Arbitrary + Standing Regularity + Mutual Expectation + **Coordination Payoff**.
