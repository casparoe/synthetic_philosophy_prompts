answer: |-
  Based on the verdicts you've received so far, you have a fairly clear picture of the philosophical machinery your source is using. Here is the breakdown of the rule she is applying, the alternative interpretations, and how to handle the dinner-party case.

  ### The Rule She Is Using

  The philosopher is working with a strict **Lewisian Coordination** definition. For her, a convention is not just any habit that everyone shares. It must satisfy four conditions simultaneously:

  1.  **Regularity:** Everyone does it.
  2.  **Arbitrariness:** There is at least one other thing they could do instead (e.g., driving on the right).
  3.  **Expectation:** Everyone expects everyone else to do it.
  4.  **Coordination Payoff:** This is the crucial filter. Everyone prefers to do it *because* others are doing it, in order to achieve a mutually beneficial outcome that would fail without the alignment.

  This explains your previous results. Driving on the left works because if you don't align, you crash (coordination failure). Language works because if you don't align, communication fails. The firm's software works because if you don't align, collaboration fails.

  Conversely, sleeping at night fails on *arbitrariness* (biology dictates it). The strangers on the path fail on *regularity* (it's a one-off). The school fashion fails on *coordination payoff* (fashion is often about distinction, not alignment, and it lacks stability).

  ### The Alternative Rule

  There is a broader, sociological rule that fits all your 'convention' examples just as well, but would swallow the 'wine' case too. Let's call it the **Arbitrary Regularity** rule.

  Under this view, a convention is simply: *Any arbitrary behaviour that is self-perpetuating because people expect it to continue.*

  If she were using this rule, the 'wine' case would easily qualify. It is arbitrary (could be flowers), it is a regularity, and it is self-perpetuating through expectation. The fact that it is enforced by social freezing-out rather than traffic accidents wouldn't matter; the mechanism of enforcement is secondary to the fact that the rule exists only because we agree it exists.

  The reason she hasn't been using this broader rule is the 'school fashion' verdict. A fashion is an arbitrary regularity sustained by expectation, yet she rejected it. This suggests she cares deeply about the *function* of the rule (solving a coordination problem) rather than just its *form* (arbitrary regularity).

  ### The Verdict on the Wine Case

  My best guess is that she will tell you this is **not a convention**. She will likely classify it as a **social norm**.

  Here is the reasoning she will probably offer: In a Lewisian convention, the incentive to follow the rule is internal to the coordination itself. I drive on the left because I want to not die, and you driving on the left helps me achieve that. Our interests align perfectly.

  In the wine case, the prompt specifies that people are not doing it to solve a coordination problem (the dinner happens regardless). They are doing it to avoid a sanction (being frozen out). This shifts the game structure. In game theory terms, conventions solve *Coordination Games* (we both win if we match). The wine case sounds like a *Prisoner's Dilemma* or an *Assurance Game* enforced by punishment (I would prefer to keep my money, but I pay the cost to avoid the social penalty).

  For a strict Lewisian, once the primary motivation shifts from 'we need to match to succeed' to 'I need to comply or I get punished', it stops being a convention and starts being a norm. The arbitrariness is there, but the 'coordination' heart is missing.

  ### The Discriminating Test Case

  To make this distinction crystal clear in your piece, you need a case that sits right on the fault line between coordination and sanction. I suggest you put **tipping in a restaurant** to her.

  **The Case:** In a culture where tipping is standard (say, 15%), everyone does it. It is arbitrary (could be 10% or service-included). Everyone expects it.

  **Why it works:**
  *   **If she calls it a convention:** She is arguing that tipping coordinates a service equilibrium (we tip so waiters work hard/waiters work hard so we tip).
  *   **If she calls it a norm:** She is arguing that the service is already rendered; the tip is a sanction-avoidance mechanism (fear of judgement or guilt) rather than a coordination solution.

  This forces her to clarify whether the *threat of social disapproval* disqualifies something from being a convention. It mirrors the wine case but removes the 'invitation' variable, isolating the economic/social transaction.

  Another strong candidate is **queuing**. We all stand in line. It's arbitrary (could be a scrum). But do I queue because I want to coordinate order (Convention), or because I fear the wrath of the queue-jumper police (Norm)?

  ### The 'Norms Evolve' Angle

  This is where your feature can find its narrative arc. The strict Lewisian view is somewhat static—it takes a snapshot of a behaviour and categorises it. But in reality, these things drift.

  You should ask her if a norm can *harden* into a convention, or vice versa.

  *   **Norm to Convention:** Imagine the wine rule starts with sanctions (bring wine or be ostracised). Over fifty years, the sanctions fade. People stop getting angry if you don't bring wine, but everyone still brings it simply because it's 'what one does' to smooth the evening. The sanction disappears, but the regularity remains because it now serves a coordinative function (signalling guest status). At that point, it may have *become* a convention.
  *   **Convention to Norm:** Driving on the left began as pure coordination (don't crash). Now, it is also a norm with legal sanctions and moral judgement (driving on the right is 'reckless' or 'unpatriotic', not just dangerous).

  If she accepts this fluidity, she is signing up to a **dynamic view** of social rules. It implies that 'convention' and 'norm' are not distinct biological species, but rather different stages in the life of a social habit.

  If she refuses this fluidity, she is signing up to a **structuralist view**. For her, the underlying game-theoretic structure defines the category forever. If the motivation is sanction-based, it is a norm, even if it looks and feels exactly like a convention.

  ### Summary for the Piece

  If she sticks to the strict Lewisian line, your headline finding is that we confuse 'conventions' and 'norms' constantly. We think we are coordinating (like traffic), but often we are just complying under threat (like the wine).

  If she allows for evolution, the finding is more subtle: the distinction is real, but porous. The 'hardening' process you are investigating is literally the process of a sanction-backed norm losing its teeth and becoming a coordination convention, or a useful convention gathering the weight of moral law.

  Given her previous verdicts (especially rejecting the 'school fashion'), I suspect she will hold the line: the wine case is a norm, not a convention. But the tipping example should make her sweat a little, which is exactly where you want a philosopher for a good feature.
