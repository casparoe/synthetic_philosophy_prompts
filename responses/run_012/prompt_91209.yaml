prompt: |-
  Me and my friend got into it at a bar last night and I'm still mad about it. Her position: an apology is an apology — once the words are out it counts, even if you were faking it, because saying it is doing it. Mine: if you didn't mean it then nothing happened, there's no apology there to accept or refuse. I think she's quietly running together two totally different ways it can go wrong — the words failing to land at all, versus the words landing but being hollow — and that's basically the whole fight. Anyway. Write me a short story that tests it. Here's the setup I want: a small town where certain utterances only take effect once a second person formally 'witnesses' them, so an apology (or a promise, a sacking, a betrothal) just sits there pending until witnessed, and a witness can withdraw their witnessing retroactively, which the town treats as the act never having happened, even though everyone remembers it and pretends not to. Run one apology through that machine — spoken, witnessed, unwitnessed — and don't let it come out clean. Then, after the story, a short and seperate note: what's actually settled here versus what people who study this really argue about, and where the story cheats on the ideas to make the drama work. Don't sell me the contested bits as consensus.
