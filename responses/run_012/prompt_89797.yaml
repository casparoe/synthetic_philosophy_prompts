      *   **The Conflict:** Intuition says micro-level (simms) does all the causal work (reductionism/physicalism). Hofstadter argues macro-level (simmballs) does genuine causal work (emergence/downward causation).
      *   **The Task:**
          1.  Take the user's position (causal exclusion/reductionism) and specify what would count *against* it (falsification conditions).
          2.  Focus on concrete items: observations, experiments, formal results, intuitions about causation.
