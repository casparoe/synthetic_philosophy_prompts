answer: |-
  - **Where I actually are** — You're holding a strict Augustinian deontological view: lying is intrinsically disordered speech (mind and tongue mismatch) and therefore always sinful, regardless of consequences. However, you distinguish between *asserting* falsehoods and merely *withholding* truth (allowing protective deception), and you argue that while all lies are sins, their severity varies based on intent and outcome. You try to reconcile this with biblical examples by suggesting God blesses the mercy behind the lie, even if the lie itself remains technically wrong.

  - **The real tensions** — 
      1. **(1) vs. (5):** This is a direct contradiction. Claim (1) says lying is "always wrong, full stop, no exceptions." Claim (5) says the rule "can't be as absolute as it sounds" because God blesses liars. If God blesses the act, it functions as a moral exception, which undermines the "always wrong" axiom. You can't claim absolutism while simultaneously admitting the rule bends under divine approval.
      2. **(2) vs. (4):** There is a theoretical friction here. Claim (2) grounds the wrongness in the *act itself* (internal structure of speech), independent of outcomes. Claim (4) says the severity depends on "what it does" (consequences). While you can grade sins, relying on consequences to determine "how bad" it is nudges you toward consequentialism, which weakens the intrinsic wrongness argument in (2).

  - **Tensions that aren't real** — 
      1. **(1) vs. (4):** Your friend likely claimed "always wrong" contradicts "almost innocent." It doesn't. "Always wrong" refers to moral *category* (sin vs. virtue), while "almost innocent" refers to moral *weight* (venial vs. mortal). Stealing is always wrong, but stealing a penny is less bad than stealing a life savings.
      2. **(1) vs. (3):** This is definitional, not logical. If you define lying as "asserting what you know to be false," then speaking ambiguously to mislead a murderer isn't a lie. Your friend calls this splitting hairs; you call it precision. As long as you stick to that definition, there's no contradiction.

  - **Cheapest fix** — 
      1. **For (1) vs. (5):** Edit (5) to say: "God rewards the *charity*, not the *lie*." This keeps (1) intact by clarifying that the sin remains, but the motive is blessed. **Cost:** It makes divine justice look complicated (God rewarding someone despite their sin), but it saves your absolutism.
      2. **For (2) vs. (4):** Edit (4) to say: "Severity depends on *intent*, primarily." This aligns better with (2)'s focus on the agent's mind rather than external outcomes. **Cost:** You lose the ability to call a well-intentioned lie with disastrous results "less bad" based on outcomes alone.

  - **Bottom line** — Claim **(5)** is doing the most damage. It tries to have it both ways: maintaining an absolute rule while winkingly admitting exceptions based on divine behavior. To keep your Augustinian framework, you must drop the idea that the rule "can't be as absolute." You have to say the rule *is* absolute, the act *was* a sin, but God's mercy covers it. If you can't stomach calling biblical heroes "sinners" even technically, you have to give up (1).
