  4.  **Addressing the "Distortions" and "Inexpressible":**
      *   *Crucial Step:* I must explicitly flag where the analogy breaks. Processes don't feel pain. Processes don't have moral standing. "Arbitrary" is a legal/moral term, not a bitwise one.
