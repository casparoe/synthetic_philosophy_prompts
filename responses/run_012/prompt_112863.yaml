      *   *Defect or Confusion?* It's likely a fusion in philosophy. "Freedom" conflates "capacity to act" (Negative/OS) with "status of the agent" (Republican).
      *   *Survivor:* Republican liberty survives best because it maps to structural constraints on authority (capabilities).
      *   *Redundant:* Positive liberty does the least work in this framework; it requires too much stipulation about "true will." Negative liberty is a subset of Republican (if you aren't dominated, you aren't interfered with, usually).

  8.  **Refining the Tone:**
      *   Must be precise, technical, respectful of the user's expertise.
      *   Avoid philosophical jargon unless defined in OS terms.
      *   Maintain the "Honest Translation" constraint (don't hide the gap between person and process).

  9.  **Self-Correction/Review during drafting:**
