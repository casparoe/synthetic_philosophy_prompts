  I'm reading Herodotus for fun, book 2, in the Godley translation (the Loeb one, 1920 — it's the copy I've got), and I've got stuck on the bit about Helen. As I understand the set-up: the Egyptian priests have told him that Helen never went to Troy at all, that she spent the whole war in Egypt, and that they'd had the story straight from Menelaus himself, though they also apparently said they'd learned some of it second-hand and were only sure about the parts that happened in their own country. Then he says this:

  "The Egyptians' priests said this, and I myself believe their story about Helen, for I reason thus: had Helen been in Ilion, then with or without the will of Alexandrus she would have been given back to the Greeks. For surely Priam was not so mad, or those nearest to him, as to consent to risk their own persons and their children and their city so that Alexandrus might cohabit with Helen. Even if it were conceded that they were so inclined in the first days, yet when not only many of the Trojans were slain in fighting against the Greeks, but Priam himself lost to death two or three or even more of his sons in every battle (if the poets are to be believed), in this turn of events, had Helen been Priam's own wife, I cannot but think that he would have restored her to the Greeks, if by so doing he could escape from the evils besetting him. Alexandrus was not even heir to the throne, in which case matters might have been in his hands since Priam was old, but Hector, who was an older and a better man than Alexandrus, was going to receive the royal power at Priam's death, and ought not have acquiesced in his brother's wrongdoing, especially when that brother was the cause of great calamity to Hector himself and all the rest of the Trojans. But since they did not have Helen there to give back, and since the Greeks would not believe them although they spoke the truth—I am convinced and declare—the divine powers provided that the Trojans, perishing in utter destruction, should make this clear to all mankind: that retribution from the gods for terrible wrongdoing is also terrible. This is what I think, and I state it."

  What I can't get my head round is what he thinks he's doing. He says he believes the priests, but none of the support he offers actually comes from them — it's all about what Priam and Hector would have done. So is the testimony doing any work here at all, or is he really just backing his own hunch about how people behave against a story everyone knows? And what sort of evidence is "Priam wouldn't have been so mad" supposed to be — is that an argument from probability, an inference to the best explanation, a bit of both? Is it the sort of thing that can get you anywhere with the distant past, or does it just beg the question against the tradition? Then those last two sentences bring in the gods arranging Troy's fall as a lesson to mankind, which seems to come out of nowhere after all that reasoning about a king's incentives. Is that part of the argument or a separate claim bolted on, and should it change how I read the rest?

  One more thing, and I'm probably misremembering it: I'm sure he says somewhere that "it is my business to set down that which is told me, to believe it is none at all of my business." If that's his rule, why is he happy to say "I believe" here? Is there a distinction between reporting a story and endorsing it that rescues him from inconsistency, or is he just being inconsistent?

  I'd realy like this laid out properly. I'm not a classicist and not a philosopher, so don't assume I know the jargon, but please don't dumb it down either — I want to know what he's actually committed to, what the argument is worth, and whether someone doing history today would do anything like this or would find it naive. Write it as continuous prose, please: no headings, bullet points, bold text or tables, just an ordinary email-style answer. British English, since I'm in the UK.
