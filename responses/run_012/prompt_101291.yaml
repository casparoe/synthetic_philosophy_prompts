      2.  Detachment of Consequents (you can't detach Q from a false P in counterfactuals).
      3.  Selection functions (nearest world).

      *Let's write it.*
answer: |-
  **Title:** The Nearest Possible Couch

  **Characters:**
  *   **MARK:** A husband who thinks he's clever with logic.
  *   **JEN:** His wife, who actually took the semantics course.

  **Setting:** Their living room, late at night. Mark is holding a single, slightly crushed rose. Jen is sitting on the sofa, arms crossed.

  **MARK:**
  Look, I know I forgot the anniversary. But consider the conditional: "If I had remembered, I would have bought you flowers."

  **JEN:**
  That's a counterfactual, Mark. The antecedent is false. You didn't remember.

  **MARK:**
  Right, but the *statement* is true! We agree on that. In the nearest possible world where I remember, I am buying you flowers. That's a fact about my dispositions.

  **JEN:**
  It's a fact about a different world.

  **MARK:**
  But worlds overlap! If I hand you this rose *now*, doesn't that update the context? I'm essentially making the antecedent true retroactively. If "If P, then Q" is true, and I give you Q, surely I've satisfied the condition.

  **JEN:**
  You can't Modus Ponens a subjunctive. You can't detach the consequent just because you're holding a clearance-rack rose at 11 PM. That's an indicative move. You're treating the outcome as if it's still up for grabs.

  **MARK:**
  But isn't it? If I give you the flower, aren't we in the world where I bought you flowers?

  **JEN:**
  No. In the world where you bought me flowers, you bought them *yesterday*. In this world, you're begging. The similarity metric doesn't work that way. You can't just swap the antecedent and keep the consequent.

  **MARK:**
  Okay, fine. Let's try contraposition. "If I didn't love you, I wouldn't have bought the flower."

  **JEN:**
  I didn't say that.

  **MARK:**
  But it's implied! So, I bought the flower. Therefore, I love you. Therefore, the anniversary is forgiven.

  **JEN:**
  Mark, you're conflating the evidence relation with the causal relation. Look, let's simplify. Here is an indicative conditional: "If you were the kind of husband who remembered anniversaries, you would know where the rest of the bouquet is."

  **MARK:**
  ...I don't know where the rest of the bouquet is.

  **JEN:**
  Exactly. So, by contraposition on the indicative, you're not the kind of husband who remembers.

  **MARK:**
  But what if I'm in a world where I remember, but the florist lost the rest of the order?

  **JEN:**
  Then you'd be calling the florist right now. Instead, you're calling on logic to save you.

  **MARK:**
  I'm just trying to align the actual world with the nearest possible one!

  **JEN:**
  (Sighs) In the nearest possible world where you align the actual world with the nearest possible one, you're sleeping on the couch.

  **MARK:**
  Is that a prediction? Or a command?

  **JEN:**
  It's a performative. Get up.

  **MARK:**
  (Standing up)
  Fine. But just so you know, "If I had slept in the bed, I would have been warmer."

  **JEN:**
  True. And "If you don't shut up, you'll be warmer somewhere else."

  **MARK:**
  ...Indicative?

  **JEN:**
  Oh, absolutely.

  **(Mark walks to the couch.)**
