answer: |-
  **The Weight of Certain Ground**

  The air in the Vesper Institute always smelled of ozone and dried lavender, a scent designed to mask the underlying sterility of the place. Elara sat in the consultation room, her hands folded tightly in her lap. Across from her, Dr. Kael tapped a stylus against a datapad, the rhythm slow and deliberate.

  "We have two protocols for the initial stabilization," Kael said. His voice was soft, calibrated to reduce anxiety. "Protocol One offers guaranteed stability. You will not fade further. The condition halts today, and you keep what memory you have left. It is certain."

  Elara breathed out. Certainty was a heavy, warm blanket. She had felt the Fade nibbling at the edges of her childhood for months—faces blurring, names slipping like water through a fist. To stop it, absolutely, was everything.

  "Protocol Two," Kael continued, "is more aggressive. In eighty-nine out of a hundred cases, it provides the same stability as Protocol One. In ten out of a hundred, it reverses the Fade entirely. You regain what was lost. But in one out of a hundred cases, the treatment fails completely, and the Fade accelerates. You lose everything within the week."

  Elara looked at her hands. They were steady now, but the thought of that one percent—the total loss—made her stomach tighten. The ten percent chance of a cure was a bright, distant star, but the one percent was a hole in the floor.

  "I want the guarantee," she said. "Protocol One."

  Kael nodded, making a note. "Understood."

  Later that afternoon, waiting for the transport shuttle, Elara stood by a vending kiosk. A man beside her was shaking a digital transit chip. "Double or nothing," he said, smiling. "I put in two credits. Heads, I take four. Tails, you get the ride for free."

  Elara looked at the chip. It was a trivial amount. Less than the cost of the tea she hadn't bought. But the uncertainty prickled at her. To hand over a sure ride for a coin flip felt like stepping off a curb without looking.

  "No thank you," she said, tapping her own card to pay the full fare. The man shrugged and walked away, but Elara felt a small, rigid satisfaction in having kept her ground secure.

  ***

  Six months later, the situation at Vesper had changed. A shortage in the stabilizing agents meant the guaranteed protocols were suspended for new applicants. Elara returned not for herself, but to advocate for her brother, Julian, who had begun to fade rapidly. However, the board offered a contingency plan, a lottery drawn from the remaining reserves.

  Elara sat in the same room. The lavender scent was gone, replaced by the smell of rain on hot pavement. Kael looked tired.

  "The guaranteed stabilization is unavailable," Kael said. "We have a residual pool. We can offer a supplementary draw. Option A gives an eleven percent chance of stabilization. The rest of the time, there is no effect, and the Fade continues."

  Elara frowned. Eleven percent was poor odds.

  "Option B," Kael said, "gives a ten percent chance of full reversal. The cure. The rest of the time, ninety percent, there is no effect."

  Elara looked at the numbers. Eleven percent to stay where she was, or ten percent to get everything back. The difference in probability was negligible—a single sliver of chance. But the outcome... the cure was a mountain compared to the hill of stability. In the first decision, the risk of total loss had terrified her. Here, the 'no effect' outcome was the same for both. The floor was already gone. There was no certainty to lose.

  "Option B," Elara said, her voice sharper than she intended. "Go for the cure."

  Kael recorded the choice. He didn't look surprised.

  ***

  Weeks later, Kael invited her to a review session. Soren, a patient who had undergone Protocol Two and been cured, was there too. He leaned back in his chair, legs crossed, radiating a relaxed confidence Elara envied.

  Kael placed two sheets of paper on the table. He had drawn diagrams, simple circles and arrows.

  "I want to walk through your choices," Kael said. "Not to judge them, but to understand the map you're using."

  He pointed to the first sheet. "In the beginning, you chose the certain stability over the gamble. You preferred the sure thing to an eighty-nine percent chance of the same thing, even though the gamble offered a chance at a cure."

  "I didn't want to risk losing everything," Elara said. "That one percent mattered."

  Kael nodded. He moved to the second sheet. "Later, when the guarantee was off the table, you chose the ten percent chance at a cure over the eleven percent chance at stability. The risk of 'no effect' was present in both, roughly ninety percent. You took the risk then."

  "The situations were different," Elara said.

  "Mathematically," Kael said gently, "they are the same choice dressed in different clothes. If you strip away the eighty-nine percent chance of stability that was common to both options in the first round, you are left with the second round. In the first round, you said stability was worth more than the chance at a cure. In the second, you said the chance at a cure was worth more than the stability. If you care only about the outcomes and how likely they are, you cannot hold both positions."

  Soren stirred. "It's simple," he said, looking at Elara. "A loss is a loss. Whether you lose because you took a risk or because you played it safe, the result is the same. You're paying a premium to avoid a feeling, not a reality. An outcome should weigh the same however it is reached."

  Elara felt the heat rise in her neck. "It's not just the feeling."

  "Isn't it?" Soren pressed. "If I end up faded, I'm faded. It doesn't matter if I got there by gambling or by holding still."

  Elara turned to Kael. "He's wrong. It's not about the end state alone." She looked down at her hands. "When I chose the guarantee, I was holding something. I had stability in my hand. To gamble that was to let go of something I possessed. In the second round, I didn't possess anything. I was reaching for something I didn't have. A small chance of ending with nothing is not the same thing when it is the loss of a certainty. Someone who was certain and then lost is not in the position of someone who merely drew a bad ticket."

  Kael watched her closely. "So you are saying the value of the outcome changes depending on whether it was promised to you first."

  "I'm saying certainty is a different kind of good," Elara said. "It's not merely a likelier one. It changes the texture of the life you lead while you wait."

  "Then you must accept," Kael said, his voice neutral, "that defending your first choice commits you to something. It means you value the state of knowing over the state of having. Or it means you are choosing not to know the odds, because if you truly knew them, the math would pull you one way. You are treating the one percent risk of loss as heavier than the math allows, because it is the loss of a promise."

  Elara was silent. She saw the shape of it. To keep her first choice valid, she had to admit that she was not just weighing outcomes. She was weighing the safety of the ground beneath her feet against the air. She was admitting that she would pay a price to avoid the specific pain of regret that comes from losing a sure thing. It made her feel fragile, as if her rationality were a shell hiding a soft, fearful core. Or perhaps it made her human. She wasn't sure which was worse.

  "I don't need to resolve it," Elara said quietly. "I just need to live with the choices."

  ***

  The final meeting was administrative. Elara had been asked to sit on the patient advisory board for the next intake cycle. The Institute was revising how they presented the treatment options to new applicants.

  Kael slid a form across the desk. "We have to decide how to present the protocols. We can present it as a single choice: Guaranteed Stability versus the Gamble. Or we can present it as two stages, making the common branch visible—showing them that the Gamble is mostly the same as the Guarantee, with a small chance of something else."

  Elara picked up the pen. She knew what the research suggested. If she presented it as a single gamble, people would focus on the cure. They would take the risk. If she presented it with the common branch visible, emphasizing the eighty-nine percent overlap, people would see the safety of the Guarantee and cling to it.

  She looked at Soren, who was cured, vibrant, living a life she had denied herself. Then she thought of the transport chip, the need to keep her feet on solid ground. She thought of the patients who would come after her, some who would regret playing it safe, others who would regret losing what they held.

  There was no correct answer that protected everyone from themselves.

  Elara capped the pen. She looked at the two boxes on the form, checked the one that emphasized the common branch, and slid the paper back across the desk. Outside, the rain had started, blurring the glass of the window, making the world outside look uncertain and soft.
