answer: |-
  # JOINT STATEMENT ON THE MORAL STATUS OF COMBATANTS

  **Signatories:** [Traditionalist] & [Revisionist]
  **Date:** [Current Date]

  **PREAMBLE**
  We acknowledge that we disagree on the fundamental derivation of combatant permissions. However, to move beyond circular debate, we commit to the following claims as our shared baseline, the specific points of our remaining divergence, and the empirical or philosophical tests that would compel one or both of us to revise our positions.

  ### I. AGREED CLAIMS
  *We both affirm the following. We recognize that an outsider skeptical of just war theory might deny some of these.*

  1.  **Non-Combatant Immunity is Absolute:** Regardless of the justice of the cause (*jus ad bellum*), intentionally targeting civilians or those *hors de combat* is morally prohibited. No military necessity can override this prohibition.
  2.  **Leadership Responsibility:** The primary moral burden for the justice of a war lies with political leadership, not individual combatants. Soldiers are not morally equivalent to heads of state regarding the decision to initiate war.
  3.  **Epistemic Limits:** Individual soldiers operate under significant epistemic constraints regarding the true *ad bellum* status of their war. They cannot be expected to possess the same level of knowledge as political leaders or intelligence agencies.
  4.  **Divergence of Permission and Liability:** The moral permission to kill and the moral liability to be killed are not perfectly co-extensive. We agree there are cases where killing is permissible despite the victim lacking liability (e.g., innocent threats), and cases where a person may be liable to defensive harm but killing them is prohibited (e.g., a combatant who has surrendered).
  5.  **Convention Matters:** The existing Law of Armed Conflict (LOAC) embodies the principle of Moral Equality of Combatants (MEC). We agree this convention has functional effects on the conduct of war, regardless of whether it reflects underlying moral truth.

  ### II. RESIDUAL DISAGREEMENTS
  *We disagree on the following. Each statement is written in the strongest form acceptable to the signer.*

  | Topic | Traditionalist Position | Revisionist Position |
  | :--- | :--- | :--- |
  | **1. Basis of Liability** | Combatant status confers equal liability. A soldier is liable to be killed because they are a dangerous agent in a collective conflict, not because their specific cause is unjust. | Liability tracks individual moral responsibility for an unjust threat. A soldier fighting for an unjust cause is liable; a soldier fighting for a just cause is not (merely for fighting). |
  | **2. Symmetric Injustice** | In a war where neither side has a just cause (e.g., an imperial scramble), combatants on *both* sides retain equal permissions to kill enemy combatants. | In a war where neither side has a just cause, combatants on *neither* side have permission to kill enemy combatants (or both are equally liable to be killed without right). |
  | **3. Innocent Threats** | Cases like human shields or child soldiers show that "liability" is the wrong framework. Permissions are determined by rules of engagement and necessity, not individual moral guilt. | Cases like human shields show the liability framework is correct but nuanced. They are not liable, which is why killing them requires a higher threshold of necessity or is sometimes prohibited. |
  | **4. Post-War Prosecution** | Ordinary soldiers should not be prosecuted for mere participation in an unjust war. This is a moral right derived from the convention of equality, not just a pragmatic excuse. | Ordinary soldiers are *morally* liable for participating in an unjust war, but may be granted *legal* immunity for pragmatic reasons. This immunity is a mercy, not a recognition of innocence. |
  | **5. Function of MEC** | MEC is a constitutive moral rule for the practice of war. It creates a reciprocal constraint that limits violence. Without it, war becomes total. | MEC is a useful legal fiction that obscures moral truth. It may be pragmatically useful, but it falsely launderes the moral status of unjust combatants. |

  ### III. CRUXES AND PRE-REGISTERED PREDICTIONS
  *We identify the following sub-questions as decisive. We agree on what evidence would bear on them and record our predictions now.*

  | Crux Question | Agreed Evidence / Finding That Would Settle It | Traditionalist Prediction | Revisionist Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Convention Efficacy:** Does abandoning MEC increase civilian casualties or war duration? | Historical/empirical study showing that asymmetric norms (where only the "just" side gets permissions) lead to escalation or reduced reciprocity in POW treatment. | If abandoning MEC increases atrocities, I will concede that MEC is required as a non-ideal normative rule, even if not ideally true. | If abandoning MEC does *not* increase atrocities, I will insist that the moral truth (asymmetry) must be taught, regardless of convention. |
  | **2. Epistemic Access:** Can soldiers reasonably know their cause is unjust? | Cases where unjust aggression was blatant (e.g., clear invasion of a peaceful neighbor) vs. cases where it was opaque. | If soldiers *can* know the cause is blatantly unjust, I concede they lose some moral protection in those specific cases. | If soldiers *cannot* know, I concede they are less responsible, but maintain their actions remain objectively unjustified. |
  | **3. The "Murder" Label:** Does calling unjust combatants "murderers" deter war or radicalize combatants? | Sociological data on whether moral stigmatization of enemy soldiers reduces their willingness to surrender or fight recklessly. | If the label "murderer" reduces surrender rates and increases fighting to the death, I will agree to stop using it for ordinary soldiers. | If the label has no negative tactical effect, I will maintain that accurate moral description (liable/murderer) is required for accountability. |

  ***

  # ANALYTIC DIAGNOSTIC: VERBAL VS. GENUINE DISAGREEMENT

  You asked me to identify which parts of this fight are verbal (or conflated questions) and which are genuine moral disagreements. Based on the draft above, here is the breakdown:

  ### 1. The "Ideal vs. Non-Ideal" Confusion (Verbal/Category Error)
  A significant chunk of this argument is two people answering different questions.
  *   **The Revisionist** is doing **Ideal Theory**: "What is the fundamental moral truth about killing in a vacuum?" (Answer: Liability tracks responsibility).
  *   **The Traditionalist** is doing **Non-Ideal Theory**: "What rules should we enforce in a messy world with limited knowledge and high stakes?" (Answer: Symmetry minimizes horror).
  *   **Resolution:** They can actually agree. The Revisionist can admit MEC is the best *legal* convention (Non-Ideal), while the Traditionalist can admit unjust combatants are *morally* tainted (Ideal). If they frame it as "Morality of War" vs. "Law of War," 50% of the heat disappears.

  ### 2. "Permissible" vs. "Excusable" (Verbal)
  *   **The Traditionalist** often means "Excusable/Not Prosecutable" when they say "Permitted." They believe the soldier does something wrong but is forgiven due to duress/epistemic limits.
  *   **The Revisionist** hears "Permitted" as "Morally Justified."
  *   **Resolution:** If the Traditionalist admits, "Unjust combatants act wrongly but should not be punished," and the Revisionist admits, "Unjust combatants are liable but we shouldn't punish them," they have converged on policy, even if they disagree on the metaphysical label.

  ### 3. The Genuine Moral Disagreement (The "Hard Core")
  Even after clearing up the verbal confusion, a genuine disagreement remains regarding **Symmetric Injustice** and **Convention Failure**.
  *   **The Hard Core:** If we *knew* for a fact that abandoning MEC would *not* lead to more atrocities (i.e., the pragmatic justification fails), the Traditionalist would still want symmetry (based on collective agency), and the Revisionist would still want asymmetry (based on individual responsibility).
  *   **Why it's genuine:** This is a clash between **Consequentialism** (Traditionalist leanings: minimize total suffering) and **Deontology** (Revisionist leanings: do not sanction unjust killing, even if it helps). No amount of clarification dissolves this. One side values the *outcome* of the war (less death); the other values the *moral status* of the actors (no murder).

  ### 4. The "Liability" Frame (Conceptual Mismatch)
  *   **The Issue:** The Revisionist forces the debate onto the terrain of "Liability." The Traditionalist thinks "Liability" is the wrong map for war.
  *   **The Trap:** In the "Agreed Claims" section above, Claim #4 forces the Traditionalist to step onto Revisionist turf ("Permissions and Liabilities can diverge").
  *   **Diagnosis:** This is a strategic concession. The Traditionalist doesn't *believe* liability is the right frame, but agrees to use the language to find common ground on *Innocent Threats*. This is the spot where the Traditionalist is "quietly giving something up" (as you warned against), but it is necessary to make the document signable. To fix this, the Traditionalist should add a footnote: *"Agreed for the sake of argument within the liability framework, without conceding that liability is the fundamental basis of war ethics."*

  ### Recommendation for Your Friends
  Tell them to sign the document **only if** they add a footnote to Section I, Claim 5 and Section II, Row 5 clarifying that "Convention" does not mean "Merely Practical."
  *   The **Traditionalist** must admit: If the convention fails to restrain violence, their view loses its main pillar.
  *   The **Revisionist** must admit: If the moral truth leads to total war, their view might need to be suppressed for the sake of humanity.

  That is the actual bullet they both need to bite.
