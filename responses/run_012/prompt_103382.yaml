answer: |-
  Dear Colleague,

  It is a profound privilege to correspond with you on this matter, and I write this with the utmost respect for your expertise in personal identity, knowing full well that any procedural instrument we devise for a hospital board will necessarily be a blunt tool compared to the nuanced arguments you engage with daily. The challenge before the board is not to solve the metaphysical problem of personal identity once and for all, but to establish a working heuristic that allows clinicians and administrators to act with moral confidence within a ninety-minute window. We must accept from the outset that we are constructing a policy framework rather than discovering a metaphysical truth, and thus the procedure I propose is designed to prioritize safety and continuity of care while flagging genuine indeterminacies for higher review. The goal is to create a sequence of questions that moves from the most objective, engineering-based facts to the most subjective, phenomenological reports, with specific off-ramps where the board should either deny the presumption of identity or defer to the ethics committee.

  The procedure begins with what we might call the Functional Isomorphism Check, which should take up the first thirty minutes of the review. The board must ask the engineering team to demonstrate that the silicon prosthetics are not merely input-output equivalent but dynamically isomorphic to the biological neurons they replace, meaning the internal state transitions of the prosthetic match the causal powers of the biological substrate across the range of expected operating conditions. A sufficient answer here requires data showing that the replacement does not introduce latency, noise, or architectural bottlenecks that would alter the computational structure of the network. If the engineering team cannot demonstrate this dynamic isomorphism, the procedure stops immediately with a clear no regarding identity preservation, as a break in functional organization is a break in the only plausible physical basis for continuity we have access to. If this condition is met, the board moves to the second step, the Psychological Continuity Audit, which relies on the neuropsychological batteries administered every ten percent of the replacement process. The board does not need to see raw data but rather a summary report from the clinical lead indicating whether there are statistically significant deviations in memory recall, personality traits, preference structures, or reasoning capabilities compared to the baseline. A sufficient answer here is a clinical certification that the patient remains within the normal range of intra-individual variation observed over time in healthy adults. If the report indicates significant drift, such as the loss of core autobiographical memories or a fundamental shift in moral character, the procedure stops with a clear no, as the psychological connectedness required for moral and legal standing has been severed.

  If both the functional and psychological checks are passed, the board proceeds to the third step, the Phenomenological Self-Report, which is where the procedure becomes most delicate and where your functionalist intuitions may clash with the safeguards we must put in place. The board must review transcripts or video recordings of the patient responding to a standardized question about their sense of self at the final stage of replacement, specifically asking whether they feel they are the same person who entered the procedure. A sufficient answer for the presumption of identity is an affirmative report of continuity, such as I feel like myself or I remember being the one who consented. However, if the patient reports a sense of discontinuity, alienation, or describes themselves as a new entity or an upgrade, the procedure does not issue a no but instead triggers a mandatory hand-off to the ethics committee. This is because a first-person report of discontinuity creates a genuine indeterminacy that a review board of clinicians and engineers cannot resolve; it becomes a values question about whether we privilege the third-person functional facts over the first-person experience of selfhood. The final step is the Social Recognition Check, where the board considers statements from the spouse or parents regarding whether they recognize the patient as the same person. If the family reports profound alienation or inability to relate to the patient despite clinical normalcy, this also triggers a hand-off to the ethics committee, as this indicates a breakdown in the relational constitution of the person that has legal implications for surrogate decision-making. If all four steps are passed, the board recommends a presumption of identity for legal and moral purposes, acknowledging that this is a pragmatic presumption rather than a metaphysical guarantee.

  Let us now run this procedure on the first protocol involving the patient with progressive neurodegenerative disease. In this case, the engineering team demonstrates that the silicon prosthetics are designed to mimic the degraded biological neurons they replace, restoring function to a baseline level rather than enhancing it, and they provide data confirming dynamic isomorphism within the expected range of the patient's original healthy state. The Functional Isomorphism Check is passed. The psychological batteries show that as biological neurons fail, the prosthetics maintain the patient's memory and personality profiles, keeping them within the normal range of variation relative to their pre-disease baseline, so the Psychological Continuity Audit is passed. When asked about their sense of self, the patient reports that they feel they have been saved or restored, explicitly stating they are the same person who was facing decline, satisfying the Phenomenological Self-Report. Finally, the family reports relief and recognition, noting that the person they loved has returned rather than been replaced, passing the Social Recognition Check. The procedure yields a recommendation that the person who emerges is the same person who consented, validating the original consent and the standing of their advance directives. I suspect this outcome aligns with your view that functional organization preservation secures identity, and it is the kind of case where the procedure works smoothly to support therapeutic intervention.

  Now consider the second protocol involving the healthy adult volunteer seeking life extension through total neuronal replacement. Here, the engineering team demonstrates perfect dynamic isomorphism, perhaps even superior to the biological baseline, so the Functional Isomorphism Check is passed without issue. The psychological batteries show no degradation; in fact, some metrics show slight improvement in processing speed and recall, but within the bounds of normal intra-individual variation, so the Psychological Continuity Audit is passed. However, during the Phenomenological Self-Report, the volunteer states that while she remembers her past, she feels she has shed a mortal coil and views her pre-replacement self as a previous version of herself, using language like I have upgraded my substrate and feel more durable than the person who signed the form. Under the procedure I have outlined, this triggers a mandatory hand-off to the ethics committee because the first-person report indicates a break in phenomenological continuity, even if functional continuity is intact. This is the case where the procedure yields an answer you will not like, because your functionalist commitment suggests that since the functional organization is preserved, the identity is preserved regardless of the patient's narrative interpretation of the change. The procedure, however, prioritizes the patient's own authority over their identity in cases of non-therapeutic enhancement, recognizing that if the subject themselves claims a discontinuity, the board lacks the standing to override that claim for legal purposes without a deeper values judgment. The board cannot decide if the volunteer is mistaken about her own identity; it can only note that her testimony creates an indeterminacy that affects the validity of the original consent for the resulting entity.

  It is crucial that we are explicit about what this procedure cannot decide, and I want to be clear about these limitations in our communication to the ethics committee. The procedure cannot determine the metaphysical truth of personal identity; it cannot tell us whether the soul persists or whether consciousness is truly continuous in a way that matters for ultimate moral desert. It operates entirely on proxies: functional dynamics, psychological performance, self-report, and social recognition. Consequently, it cannot resolve cases where the functional facts and the phenomenological facts diverge, as seen in the healthy volunteer case; it can only flag that divergence as a site for ethical deliberation rather than technical review. Furthermore, the procedure cannot account for long-term drift beyond the scope of the protocol, meaning it offers no guidance on the identity status of the patient five years post-procedure if further changes occur. It also cannot adjudicate between competing theories of identity; if a family member holds a somatic view of identity and claims the person died when the first neuron was replaced, the procedure treats this as a values conflict for the ethics committee rather than a factual error on the part of the family. Ultimately, this instrument is designed to manage risk and uncertainty rather than to provide philosophical closure, ensuring that when the board says yes, it is because the evidence for continuity is robust across multiple dimensions, and when it says hand-off, it is because the question has moved from what is the case to what we ought to do about a case that is genuinely ambiguous.

  I hope this draft provides a workable framework for your board meetings, balancing the need for decisive action with the humility required when intervening in the constitution of the self. The tension in the healthy volunteer case is intentional, serving as a safeguard against the assumption that functional equivalence automatically grants moral and legal continuity in contexts where the subject's own intentions may be to transcend their previous identity. While I know this may frustrate your theoretical commitment to functionalism, in a clinical setting, the subject's testimony carries a weight that engineering specs cannot override without risking a profound violation of autonomy. We are building a policy for humans, not just for organisms, and sometimes the human experience of discontinuity must be respected even if the metaphysician sees continuity. Please feel free to adjust the weighting of the steps as you see fit, but I urge you to keep the hand-off condition for phenomenological discontinuity, as it is the safest harbor for a board that lacks the authority to define the self against the will of the subject. I look forward to hearing how the committee responds to these recommendations and wish you the very best in this groundbreaking and daunting work.

  Warmly,

  Your Colleague
