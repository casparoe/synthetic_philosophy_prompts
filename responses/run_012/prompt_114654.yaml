      *Better interpretation of Prompt:* "A genuinely diachronic pump needs something to change between choices... make them articulate afterwards what, if anything, the earlier and later selves owe each other."
      Okay, I will design the game so the context *does* change (making it diachronic), but the *cost* of the cycle remains. The debrief question is: "Did the context change justify the loss?"
      This allows me to hit Point 2 hard.

      *Final Plan Check:*
      - 18 Students.
      - Currency: "Equity Points" (EP).
      - Goods: Cards (Alpha, Beta, Gamma).
      - Confederate: "Market Analyst."
      - Robustness: Sealed envelopes for valuations? No, public announcements but distinct framing.
      - Debrief: Mapped to specific rounds.

