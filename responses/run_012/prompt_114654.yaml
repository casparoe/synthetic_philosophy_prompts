      *Wait, one constraint check:* "Make the difference between a loop of choices made at a single time and a sequence of choices made across time feel like a substantive difference."
      If I only run the Diachronic version, they don't feel the difference.
      *Idea:* In the Debrief, ask: "Imagine I offered you all three trades at once at the start. Would you have taken the bundle?"
