      The Chips represent these.
      Red = Liquidity.
      Blue = Growth.
      Green = Security.
      Narrative: You are a CFO.
      Round 1: Market is booming. Need Growth. (Trade Red for Blue).
      *Task:* Read a news clip about a recession scare.
      Round 2: Market is volatile. Need Security. (Trade Blue for Green).
      *Task:* Read a news clip about a cash crunch.
      Round 3: Market needs cash. Need Liquidity. (Trade Green for Red).
      This makes the preference shift *contextual*, not just arbitrary. It tests Dynamic Consistency.

      *Wait, one constraint:* "Every trade a participant makes must be one they have a real, local reason to accept."
      If the context changes, the reason is real.
      *Constraint:* "Make the difference between a loop of choices made at a single time and a sequence of choices made across time feel like a substantive difference."
      If the context *actually* changes, is it a money pump?
      A money pump exploits *intransitive* preferences. If preferences change due to context, it's not intransitive.
      *Crucial Nuance:* The prompt asks to make them feel the force of the argument *and* distinguish synchronic/diachronic.
      If I make the context change *legitimate*, the pump argument fails (it's rational to adapt).
      If I make the context change *trivial*, the pump works, but the diachronic distinction feels fake.
      *Resolution:* The context change must *appear* substantive to the student in the moment, but in the debrief, we reveal that the underlying valuation metric (the "True Utility") never changed, only the *framing* did.
