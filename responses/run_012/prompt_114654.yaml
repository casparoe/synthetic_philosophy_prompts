      Then: "But you took them one by one. Why?"
      This creates the contrast mentally without needing two physical game versions.
      *Better:* I will explicitly ask this in the debrief as a thought experiment. It saves time.

      *Okay, ready to draft.*
      Structure:
      1. Game Overview & Materials.
      2. Timeline (Minute-by-minute).
      3. Roles (Instructor, Confederate, Students).
      4. Script/Narrative (Crucial for hiding the trick).
      5. Debrief (Mapped to constraints).
