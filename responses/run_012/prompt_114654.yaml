      Okay, that works.

      *Re-evaluating the "Diachronic" requirement:*
      "Build in at least one round where a participant's situation or valuation shifts in a way I control."
      The News Clips do this.
      Round 1: "Expansion Phase." (Value Growth).
      Round 2: "Recession Phase." (Value Safety).
      Round 3: "Acquisition Phase." (Value Cash).
      The *Card* doesn't change, the *Environment* changes.
      This satisfies the requirement.

      *Let's check the constraints again.*
      "Nothing in the rules... should use the vocabulary of consistency..."
      I will scrub the script.
      "Every trade... real, local reason."
      The News Clips provide the reason. "In a recession, Safety is better than Growth."

      *Okay, let's write it.*
answer: |-
  # Game Design: "The Venture Portfolio"

  ## 1. Overview & Materials

  **Goal:** Students manage a venture portfolio through three market phases. They will make locally rational trades that result in a global loss of value, demonstrating the money-pump structure within a dynamic context.

  **Participants:** 18 Students, 1 Instructor, 1 Confederate ("Alex").
  **Duration:** 75 Minutes.
  **Currency:** "Venture Points" (VP).
  **Payoff:** The class pool of VP determines the budget for an end-of-term pizza party. (100 VP = $5). Individual "Top 3 Portfolios" get to choose pizza toppings. This creates individual incentive within a collective pot.
  **Assets:** Three colored index cards per student (Red, Blue, Green).
  **Materials:**
  *   18 Envelopes (containing starting card + 100 VP slip).
  *   54 Trade Slips (pre-printed, distinct designs for each round).
  *   3 "Market News" Projector Slides (distinct visual themes).
  *   18 "Portfolio Ledger" sheets (to track VP).
  *   Confederate Script.

  **The Trap:**
  *   **Start:** Red Card + 100 VP.
  *   **Round 1:** Market favors Blue. Trade Red $\to$ Blue (Cost 5 VP).
  *   **Round 2:** Market favors Green. Trade Blue $\to$ Green (Cost 5 VP). *Includes micro-steps.*
  *   **Round 3:** Market favors Red. Trade Green $\to$ Red (Cost 5 VP).
  *   **End:** Redemption. Only Red Cards have value (50 VP). Blue/Green = 0.
  *   **Net Result:** Students end with Red Card + 85 VP. They lost 15 VP for no net gain in assets.

  ## 2. Roles

  **Instructor (The Market):** Controls the narrative, announces market phases, sets redemption values. Never explicitly justifies the trades, only the *market conditions*.
  **Confederate ("Alex"):** Introduced as a "Graduate Assistant managing logistics."
  *   *Task:* Distributes envelopes, collects trade slips, updates VP ledgers.
  *   *Hiding:* Alex does not speak during the narrative. Alex wears a generic university hoodie. Alex sits among students during the "Intervening Tasks."
  **Students (Venture Managers):** Individual traders. No talking during trading windows.

  ## 3. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Hand out Envelopes. Explain VP $\to$ Pizza Fund. Rules: No talking during trades. |
  | **05-15** | **Round 1** | **"Expansion Phase."** Project Slide 1 (Bull Market). Offer Trade: Red $\to$ Blue. Cost 5 VP. |
  | **15-20** | **Task 1** | **"Risk Assessment."** Students solve 3 logic puzzles individually. (Breaks pattern recognition). |
  | **20-30** | **Round 2** | **"Volatility Phase."** Project Slide 2 (Bear Market). Offer Trade: Blue $\to$ Green. Cost 5 VP. **Includes 3 Micro-upgrades.** |
  | **30-35** | **Task 2** | **"Regulatory Review."** Students read a dense paragraph of text and answer 2 comprehension questions. |
  | **35-45** | **Round 3** | **"Liquidity Event."** Project Slide 3 (Cash Crunch). Offer Trade: Green $\to$ Red. Cost 5 VP. |
  | **45-50** | **Redemption** | Collect Cards. Reveal Redemption Values. Calculate Final VP. |
  | **50-75** | **Debrief** | Structured discussion mapping game events to theory (see Section 5). |

  ## 4. Rules & Narrative Script (Excerpts)

  **Introduction (Instructor):**
  "You are Venture Managers. You hold a portfolio asset and liquid capital (VP). Your goal is to maximize your portfolio's final value. The market changes; you must adapt. Alex will handle the paperwork. Do not discuss your holdings with neighbors."

  **Round 1 Script (Instructor):**
  "Market Report: Tech sector is surging. Assets with high growth potential are outperforming. Your current asset (Red) is stable but low growth. The Blue asset is indexed to the tech surge. Holding Red now carries an *opportunity cost*."
  *(Alex distributes Trade Slips: "Swap Red for Blue. Fee: 5 VP. Local Value Increase: High.")*
  **Local Reason:** Avoiding opportunity cost in a bull market.

  **Round 2 Script (Instructor):**
  "Market Report: Volatility spike. Regulatory uncertainty. Growth assets are now risky. Safety-indexed assets are preferred. Your Blue asset is exposed. The Green asset is hedged."
  *(Alex distributes Trade Slips. **The Dial:** The slip offers "Green Basic." Then, 2 minutes later, Alex whispers to each student: "You can upgrade to Green Plus for 1 VP." Then "Green Premium for 1 VP." Total cost 7 VP for this round).*
  **Local Reason:** Risk mitigation. The micro-upgrades feel like negligible improvements.

  **Round 3 Script (Instructor):**
  "Market Report: Liquidity crunch. Investors are fleeing to cash-equivalents. Only legacy assets (Red) are being accepted for settlement. Green and Blue are illiquid."
  *(Alex distributes Trade Slips: "Swap Green for Red. Fee: 5 VP. Local Value Increase: Liquidity Access.")*
  **Local Reason:** Ensuring the asset can be sold at all.

  **Redemption (Instructor):**
  "Market Close. Settlement values: Red = 50 VP. Blue = 0. Green = 0."

  ## 5. The Debrief (25 Minutes)

  *Do not use the words "pump," "cycle," or "transitivity" until the very end.*

  **1. Market Assumptions (5 mins)**
  *   **Ask:** "Why did you make the trades?" (Answers: "To keep up with the market," "To avoid loss.")
  *   **Map:** Point to the fact that *I* was always willing to take the other side of the trade.
  *   **Question:** "What if, in Round 2, the Bank had closed? You would be stuck with Blue. Does the pump work if the counterparty disappears?"
  *   **Point:** The argument relies on a frictionless, always-open market. If trading has costs (spread) or limits, the cycle breaks. The inconsistency is costly *only* under these specific market conditions.

  **2. Synchronic vs. Diachronic (7 mins)**
  *   **Ask:** "Imagine I offered you all three trades at once at the start: 'Give me 15 VP, I'll swap Red for Blue, then Green, then back to Red.' Would you have done it?" (Most will say No).
  *   **Map:** Point to the **Logic Puzzles (Task 1)** and **Regulatory Review (Task 2)**.
  *   **Question:** "You said 'No' to the bundle, but 'Yes' to the sequence. What happened between Round 1 and Round 2?"
  *   **Point:** Time passed. Information changed (the News Slides). Your *situation* shifted. A synchronic loop (all at once) feels irrational. A diachronic sequence (over time) feels like adaptation.
  *   **Deep Dive:** "Does your 'Round 2 Self' owe anything to your 'Round 1 Self'? If the market really changed, was the loss just the cost of doing business?" (Let them debate if the News Slides justified the cost).

  **3. The Escapes (5 mins)**
  *   **Ask:** "Did anyone consider refusing a trade?"
  *   **Map:** Point to the Trade Slips. They were optional.
  *   **Question:** "What was the cost of refusing?" (Answer: Fear of underperforming the market/opportunity cost).
  *   **Point:** You could have escaped by:
      1.  **Refusing to Price:** "I won't trade at any price." (Costs potential gain).
      2.  **Pre-commitment:** "I promised my Round 1 Self I wouldn't sell Red." (Costs flexibility if the market *really* did change).
      3.  **Indifference:** "Red and Blue are equal to me." (Hard to maintain when I tell you Blue is 'surging').
      *   Each escape has a price. Rationality isn't free.

  **4. The Dial (Sorites) (3 mins)**
  *   **Ask:** "In Round 2, some of you paid extra for Green Basic, then Plus, then Premium."
  *   **Map:** Point to the micro-upgrades.
  *   **Question:** "At which step was it rational to stop?"
  *   **Point:** If every step is a small improvement, stopping is arbitrary. But the sum of small costs leads to the same loss. This shows the pump doesn't need big jumps; it works on slippery slopes too.

  **5. Limits of the Game (5 mins)**
  *   **Instructor Confession:** "I set the Redemption Values arbitrarily at the end. In the real world, who sets the value?"
  *   **Point:**
      1.  **Costly vs. Irrational:** The game shows cycling is *costly* here. It doesn't prove your preferences are logically broken, only that they are expensive in *this* market.
      2.  **Generality:** I used specific cards (Red/Blue). The theory claims this applies to *anything* (careers, relationships). I cannot show that generality in a game; I have to assert it.
      3.  **Dynamic Consistency:** If the market news was fake (it was), your adaptation was based on false premises. If the news was real, cycling might be rational. The pump argument assumes preferences are stable; this game showed what happens when *context* manipulates the expression of preferences.

  ## 6. Predictable Failure Modes & Fixes

  **Failure 1: The "Spotter"**
  *   *Risk:* A student realizes Round 3 mirrors Round 1 and refuses to trade.
  *   *Fix:* The "News Slides" must be visually distinct and use different jargon (e.g., "Tech Surge" vs. "Liquidity Event"). If a student refuses, Alex says, "Noted. You are opting out of the settlement phase. Your asset remains illiquid." This imposes a *consequence* (uncertainty) without breaking the game. In debrief, use this student as the hero of "Pre-commitment."

  **Failure 2: The "Hoarding" Strategy**
  *   *Risk:* Students value VP more than Cards and refuse to pay the 5 VP fee.
  *   *Fix:* Ensure the "Local Value Increase" on the Trade Slip is quantified as "Expected Value +10 VP." If Cost is 5 VP and Gain is 10 VP, rational EUT maximizers *must* trade. Make the math explicit on the slip.

  **Failure 3: Time Overrun**
  *   *Risk:* The Micro-upgrades in Round 2 take too long.
  *   *Fix:* If running late, skip the "Green Premium" step. Keep only one micro-step. The Sorites point can still be made theoretically in the debrief if the physical step is cut.

  **Failure 4: Confederate Blown**
  *   *Risk:* Students realize Alex is working for the Instructor.
  *   *Fix:* Alex should make a minor "mistake" in Round 1 (e.g., hand out a slip to the wrong person, apologize). Human error builds cover. Alex should sit with students during Task 1 and complain quietly about the puzzle difficulty.

  **Failure 5: Apathy**
  *   *Risk:* Students don't care about the Pizza Fund.
  *   *Fix:* Bring the actual pizza menu to class. Place it on the desk. Make the connection tangible. "The difference between Pepperoni and Cheese is 200 VP."

  ## 7. Instructor Prep Checklist

  1.  **Recruit Confederate:** Brief them on silence and logistics. Ensure they know the script for "Local Value Increase."
  2.  **Print Materials:**
      *   18 Envelopes (1 Red Card, 100 VP slip).
      *   Trade Slips (3 sets, different colors/fonts).
      *   Ledger Sheets.
      *   News Slides (PowerPoint).
  3.  **Pizza Menu:** Print a local pizza menu with prices.
  4.  **Room Setup:** Seats arranged so students cannot easily see neighbors' cards during trading.

  ## 8. Why This Meets Your Constraints

  *   **No Vocabulary:** Rules use "Portfolio," "Market," "Settlement." No "transitivity."
  *   **Local Reason:** Each trade is framed as avoiding a specific loss (Opportunity, Risk, Illiquidity).
  *   **Synchronic vs. Diachronic:** The Tasks (Puzzles/Reading) create genuine cognitive time gaps. The debrief explicitly contrasts the "Bundle Offer" (Synchronic) vs. "Sequence" (Diachronic).
  *   **Robustness:** Information asymmetry (students don't know redemption until end) and distinct framing prevent easy pattern recognition.
  *   **Debrief Mapping:** Every theoretical point is tied to a specific physical moment in the game (The Bank, The Tasks, The Refusal, The Micro-upgrades, The Instructor's Confession).
