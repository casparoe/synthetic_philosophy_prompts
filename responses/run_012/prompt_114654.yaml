      45-75: Debrief. (30 mins is good for deep debrief).

      *Addressing "Non-traders stay involved":*
      Everyone trades. No spectators.
      *Addressing "Memorizing the bundle":*
      Use physical cards that are collected and swapped. They don't hold the history, the Bank does. They only see their *current* holding.
      *Addressing "Spotting the trick":*
      The "Market Reports" provided at each stage must look distinct. Different fonts, different "analysts."
      The Confederate handles the distribution so I can maintain the "Big Picture" narrative.

