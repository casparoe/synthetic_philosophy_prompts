      3. Escapes: Who refused a trade? Why? Did you lose points?
      4. Dial: The Micro-steps in Round 2.
      5. Limits: I (Instructor) set the redemption values. In real life, who sets them?

      *Failure Modes:*
      1. Student refuses all trades. (Solution: Make the first trade overwhelmingly obvious).
      2. Student hoards credits and doesn't care about chips. (Solution: Chip value > Credit cost).
      3. Confederate blown. (Solution: Scripted lines).
      4. Time overrun. (Solution: Cut Round 2 Micro-steps if needed).

