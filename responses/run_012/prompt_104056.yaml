prompt: |-
  I sit on the research risk review committee at a mid-sized university. We're the people who have to weigh in before a lab publishes something with obvious dual-use potential, releases a dataset or a tool, or starts a line of work a funder has flagged. We meet once a month, 45 minutes, usually four or five items, and most of the people in the room are not specialists in whatever the item is about — there's a chemist, a lawyer, a comms person, me. Right now we basically improvise, and the same fight eats the meeting every time. Someone says we shouldn't let X happen because X is bad if it happens at all. Someone else says fine, but if we say no, a lab in another country, or a company, or some hobbyist will just do it, so what does our no even accomplish. Then a third person says well if everyone reasons like that then of course it gets done. We never resolve it, we take a vote, and the vote tracks whoever spoke last.

  I recently ran into an idea that I think is about exactly this, the unilateralist's curse. As I understand it: when lots of different agents can each independently do some thing, and the thing is bad whenever anyone does it, then the sheer number of possible doers makes it likely at least one of them will do it — even though most of them, individually, think it shouldn't be done. And I half-remember there being a proposed remedy, something like a principle of conformity — act the way you think the consensus of people in your position would act, instead of on your own read of the situation. I don't remember it well and I might be mangling it, so please don't lean on the name or on anyone's version of it. Work from the shape of the idea, and if the idea as I've stated it is confused, say so and fix it.

  What I want from you is a decision procedure my committee can actually run. The questions to ask, in order, and what counts as a good enough answer to each one; where the procedure stops and the answer is no; and the places where it has to stop and hand the call to a person because it's a values question, not a facts question. It has to tell us when the curse actually applies and when it doesn't — in particular I think there must be a mirror-image case where the thing is good if at least one agent does it, and then everyone hanging back is the failure, so the whole logic flips and someone should just go. It has to handle the fact that we usually have no idea how many other actors could do the thing, or how likely they are to. And it has to say something about private information: if I know something the others don't, does that license me to ignore the conformity step, or is the whole point that it doesn't, and I have to put the information in the room first. Keep it to something we can run in a few minutes per item, with no numbers, for an audience that hasn't read anything about this. The output should be a recommendation plus a short written record we can defend, and the VP for research signs off at the end.

  Then run it on three items, including one where it gives an answer I won't like:

  1. A lab wants to publish a paper describing a method for making a common organism considerably more dangerous. Nothing is actually released into the world but the method becomes public.
  2. A group wants to openly release a piece of software that several other teams are racing to release anyway, and that has an obvious benign use and an obvious ugly one.
  3. Our own group's project — a study whose result I have private, unpublished reason to think is both safe and genuinely valuable, but which the procedure, followed honestly, would probably tell me to shelve.

  Finish with what the procedure can't do and where judgment can't be squeezed out of it, and give me the one-page version we can paste into the minutes.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Member of a research risk review committee at a mid-sized university.
      *   **Problem:** Current process is improvised, leads to circular arguments (Unilateralist's Curse dynamics), votes track who spoke last, no resolution.
      *   **Concept:** Unilateralist's Curse (Bostrom et al.). Key idea: When many agents can act, and the act is bad if *anyone* does it, individual rationality leads to collective harm. Remedy: Principle of Conformity (act as you think the consensus *would* act if informed).
      *   **Requirements:**
          *   A concrete decision procedure (questions in order, stop conditions).
          *   Must distinguish between "bad if anyone does it" vs. "good if anyone does it" (mirror image).
          *   Must handle uncertainty about other actors.
          *   Must handle private information (do I defect or share?).
          *   Must be fast (few minutes per item), no numbers, accessible to non-specialists.
          *   Output: Recommendation + short written record.
          *   **Task:** Run the procedure on three specific items (including one where the user won't like the answer).
          *   **Ending:** Limitations of the procedure + a one-page summary for minutes.

  2.  **Deconstruct the Unilateralist's Curse & Principle of Conformity:**
      *   *The Curse:* $N$ agents. Action $A$. Harm $H$ occurs if $\ge 1$ agent does $A$. Each agent thinks $A$ is bad. But each thinks "If I don't, someone else will." Result: $A$ gets done.
      *   *The Remedy:* Don't act on your own judgment alone. Act on what you believe a *coordinated group* of similarly situated agents would decide.
      *   *The Mirror Image:* Benefit $B$ occurs if $\ge 1$ agent does $A$ (e.g., curing a disease, publishing a safety patch). If everyone waits for others, $B$ never happens. Here, unilateral action is *good*.
      *   *Private Info:* If I have private info that changes the value of $A$, the Principle of Conformity says I should try to share it to form a consensus. If I can't share it (time/privacy), I must act conservatively regarding harm, but proactively regarding benefit? Actually, the standard Bostrom view is: If you have private info suggesting it's *safe*, you still shouldn't act unilaterally if the default consensus is "don't do it." You must try to align. But for the committee context, "private info" usually means "I know something you don't." The procedure needs to force disclosure or default to caution.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Goal:* Fast, binary branching, handles the "curse" logic.
      *   *Step 1: Categorize the Risk/Benefit Structure.* Is this a "Threshold Harm" (bad if anyone does it) or "Threshold Benefit" (good if anyone does it)? This is the crucial fork.
      *   *Step 2: Assess Competence/Consensus.* Can *we* actually judge this? Do we know if others are doing it?
      *   *Step 3: The Conformity Test.* If we say "No," would we expect responsible peers to say "No"? If we say "Yes," would we expect them to say "Yes"?
      *   *Step 4: Private Information Handling.* If a member holds back info, the procedure fails. Must mandate disclosure or recusal.
      *   *Step 5: The Decision.*
      *   *Refinement for Speed:* Keep it to 4 questions.
      *   *Refinement for "Mirror Image":* Explicitly ask: "Does the value vanish if someone else does it first?" (Harm) vs. "Does the value exist even if only we do it?" (Benefit).
      *   *Refinement for Private Info:* "Is there information in this room that, if known to peers, would change their mind?" If yes, share it. If you can't share it, you can't use it to override caution.

  4.  **Developing the Three Test Cases:**
      *   *Item 1 (Dangerous Organism Method):* Classic Threshold Harm. Bad if anyone does it. Publishing makes it available to everyone.
          *   *Expected Outcome:* Block/Redact.
          *   *Why:* Unilateralist curse applies strongly. Even if *this* lab is safe, the method spreads.
      *   *Item 2 (Dual-Use Software):* Threshold Ambiguity. Others are racing. Benign + Ugly.
          *   *Expected Outcome:* Conditional Release / Mitigation.
          *   *Why:* If others *will* do it, our "No" doesn't stop harm, but our "Yes" adds capacity. Need to check if we can add safety layers others won't. This is the messy middle.
      *   *Item 3 (Private Info/Valuable Study):* The "User Won't Like It" case.
          *   *Setup:* User thinks it's safe/valuable (Threshold Benefit?). But procedure says shelve.
          *   *Why:* If the *consensus* of peers (without the private info) would be "Wait," and the user can't disclose the private info (e.g., classified, privacy, IP), the Principle of Conformity dictates caution. You can't use secret knowledge to bypass collective safety norms. This illustrates the burden of the curse.

  5.  **Refining the Procedure for the Committee Context:**
      *   They are a gatekeeper, not the actor. The "agent" is the University/Lab. The "peers" are other Universities/Labs.
      *   The procedure needs to output: *Approve, Reject, or Modify.*
      *   It needs a "Record" section for the VP.

  6.  **Writing the Content - Section by Section:**
      *   *Introduction:* Acknowledge the problem (the circular fight). Validate the Unilateralist's Curse intuition.
      *   *The Procedure:* "The Conformity Protocol." 4 Steps.
          1.  **Type Check:** Harm vs. Benefit logic.
          2.  **Substitutability:** If we don't, will they? (Crucial for the "what does our no accomplish" argument).
          3.  **Information Symmetry:** Can we justify this to peers?
          4.  **Verdict.**
      *   *Running the Cases:* Apply the protocol strictly.
          *   Case 1: Clear "No/Redact."
          *   Case 2: Nuanced. "Yes, with guardrails" OR "No" depending on substitutability. Let's make it "Modify" to show the tool's utility.
          *   Case 3: The hard one. "No/Shelve." Because private info cannot override the conformity principle if it can't be shared. This hits the user's requirement.
      *   *Limitations:* It doesn't solve moral disagreement. It doesn't work if *no one* else is responsible. It relies on honest disclosure.
      *   *One-Pager:* Condense for the minutes.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the "Mirror Image" clear?
      *   *Fix:* Make sure Step 1 explicitly distinguishes between "Harm scales with *any* actor" vs "Benefit scales with *first* actor."
      *   *Critique:* Is the private info handling strict enough?
      *   *Fix:* Emphasize that if you can't share the info, you must act as if you don't have it regarding safety. This is the counter-intuitive part the user needs to see in Case 3.
      *   *Critique:* Is it too abstract?
      *   *Fix:* Use specific "Yes/No" prompts.
      *   *Tone:* Professional, pragmatic, slightly academic but actionable. Respect the user's time constraints (45 mins, 5 items).

  8.  **Final Polish:** Check against constraints.
      *   No numbers? Check.
      *   Few minutes per item? Check.
      *   Defensible record? Check.
      *   Case 3 outcome disliked? Check. (I need to ensure the logic forces the "No" even if the user thinks it's valuable).
      *   One-page version? Check.

  *(Self-Correction on Case 3)*: To make sure the user "doesn't like" the answer, I need to frame it so the *value* is high, but the *procedural constraint* blocks it. The constraint is: "You possess private information that justifies safety, but you cannot disclose it to establish consensus. Therefore, you must defer to the default caution of the peer group." This aligns with the Unilateralist's Curse remedy (don't act on private judgment if the stakes are collective harm).

