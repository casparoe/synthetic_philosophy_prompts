answer: |-
  The single sequencing decision the whole session turns on is forcing the group to squeeze three distinct uses out of the *same* analogy before you give them the vocabulary to name those uses.

  If you define the taxonomy first, programmers will treat it as a classification schema to be memorized; if you make them feel the friction of using "Printing Press" to predict frequency, then to highlight features, then to list policy moves, the taxonomy becomes a relief mechanism. Here is the 75-minute plan, the evaluation of your material, and the management of misconceptions.

  ### 1. Session Sequence (75 Minutes)

  **0:00–0:15: The Trap (Whiteboard: "Is AI like the Printing Press?")**
  *   **Action:** Ask the group to debate the aptness of the Printing Press analogy for AI. Do not intervene. Let them argue about whether AI will cause a Reformation or whether the physics are different.
  *   **Goal:** Generate heat and confusion. You want them to collide over whether the analogy is "true."
  *   **Intervention:** At 0:10, stop them. Point out that half the room is arguing about *outcomes* (frequency of upheaval) and half is arguing about *mechanisms* (copying costs). Tell them: "You are arguing past each other because you are using the same tool for different jobs."

  **0:15–0:30: The Reveal (Whiteboard: Base Rate | Frame | Repertoire)**
  *   **Action:** Introduce your friend's three modes. Define them strictly by *question type*:
      *   **Base Rate:** "How often does X happen in this class?" (Reference class selection).
      *   **Frame:** "What features should I be looking at?" (Attention direction).
      *   **Repertoire:** "What moves did actors have then, and do we have them now?" (Strategy space).
  *   **Crucial Move:** Insert your "Outside View" point here. Explicitly state: "Choosing the analogy *is* choosing the reference class. The outside view does not save you from the analogy; it relies on it."
  *   **Goal:** Equalize the modes. Prevent them from treating Base Rate as the only "rational" mode.

  **0:30–0:50: The Drill (Whiteboard: Printing Press vs. AI)**
  *   **Action:** Force the Printing Press example through all three modes sequentially.
      *   *Base Rate:* How often did information technologies cause violent religious upheaval? (Don't fact-check; ask what class we are counting).
      *   *Frame:* If we use this frame, what do we look for? (e.g., Decentralized production, vernacular translation).
      *   *Repertoire:* What did the Church do? (Licensing, Index Librorum Prohibitorum). Can we do that?
  *   **Goal:** Show that the analogy can be "wrong" on Base Rate but "useful" on Frame.

  **0:50–1:00: The Disanalogy (Whiteboard: Atoms vs. Bits)**
  *   **Action:** Introduce your specific disanalogy: Matter vs. Zero-Marginal-Cost Copy.
  *   **Instruction:** Do not let this kill the analogy. Ask: "Which of the three modes does this disanalogy break?" (Answer: It breaks Base Rate and some Repertoire moves like physical confiscation, but leaves Frame intact).
  *   **Goal:** Lodge the disanalogy as a boundary condition, not a kill switch.

  **1:00–1:10: What We Are Leaving Out**
  *   **Action:** State explicitly: "We are leaving out historical accuracy. We are leaving out AI safety specifics. We are leaving out other analogies (Nuclear, Industrial)."
  *   **Reasoning:** You cannot teach historical fidelity in 75 minutes, and shopping for other analogies invites "analogy hunting" rather than tool usage.

  **1:10–1:15: The Check**
  *   **Action:** Ask the final question (see below).

  ### 2. Material Evaluation & Example Selection

  **Does the material survive contact?**
  Yes, but with one risk: Programmers will privilege **Base Rate** as the only "rational" mode because it quantifies. You must aggressively defend **Frame** and **Repertoire** as equally valid reasoning tools. The "Outside View" point is your strongest lever here—it validates their rationalist instincts while showing the limitation.

  **Is Printing Press the right example?**
  Your instinct is correct. Keep it.
  *   **Why not Nuclear:** Too emotionally charged; the "existential" prior swamps the exercise.
  *   **Why not Industrial Revolution:** Too diffuse; hard to isolate specific actor moves (Repertoire).
  *   **Why Printing Press works:** Everyone knows the *myth* (Luther, censorship, spread), which is sufficient for the exercise. You are teaching analogy *usage*, not history.
  *   **Requirements:** The example must have clear **actors** (for Repertoire), clear **outcomes** (for Base Rate), and clear **mechanisms** (for Frame). Printing Press has all three.
  *   **Constraints:** You must forbid historical pedantry. If someone says "Actually, the Press wasn't the main cause of the Reformation," shut it down: "We are using the *analogy of the Press*, not the history of the Press."

  ### 3. Misconceptions Management

  You identified four misconceptions. Two are identical. Here is the order they will surface and where to kill them:

  1.  **"This technology is unprecedented, so no analogy applies."**
      *   **Surface:** 0:00–0:15 (The Trap).
      *   **Intervention:** Pre-empt this in the opening instructions. "We are not asking if history repeats. We are asking what history illuminates."
  2.  **"Apt versus inapt is binary."**
      *   **Surface:** 0:15–0:30 (The Reveal).
      *   **Intervention:** This is the core reason for the 3-mode framework. Kill it by showing how the same analogy is "apt" for Frame but "inapt" for Base Rate.
  3.  **"One disanalogy kills it."**
      *   **Surface:** 0:50–1:00 (The Disanalogy).
      *   **Intervention:** **This is the same mistake as #2** (Boolean thinking vs. Dimensional thinking). Do not treat it as a new error. When they say "But bits aren't atoms," ask: "Which *mode* does that break?" If they say "The analogy," correct them: "It breaks the Repertoire of physical confiscation. It does not break the Frame of decentralized distribution."
  4.  **"An analogy is an argument whose conclusion follows if the mapping holds."**
      *   **Surface:** Throughout.
      *   **Intervention:** Frame analogies as **queries**, not **proofs**. An analogy doesn't prove AI will cause a Reformation; it queries whether we should look for decentralized production nodes.

  ### 4. What to Leave Out

  Say this out loud at 1:00:
  *   **Historical Accuracy:** We are not testing if the Printing Press *actually* caused the Reformation. We are testing if believing it did helps us reason about AI.
  *   **AI Probability:** We are not debating whether AI *will* be transformative. We are debating how to reason *if* it is.
  *   **Other Analogies:** Do not let them pivot to "What about Nuclear?" Keep the cognitive load on the *tool*, not the *data*.

  ### 5. The Final Check (1:10–1:15)

  **The Question:**
  "Take the analogy 'AI is like a corporate merger.' Construct a sentence where this is a useful **Frame** but a misleading **Base Rate**."

  **What a Wrong Answer Looks Like:**
  *   **The Boolean Fail:** "It's not useful because companies aren't algorithms." (This fails to separate the modes).
  *   **The Vague Fail:** "It works because both involve consolidation." (This doesn't show the *tension* between Frame and Base Rate).
  *   **The Correct Answer:** "It's a useful Frame because it highlights power consolidation and regulatory capture, but a misleading Base Rate because mergers rarely cause global economic upheaval." (This demonstrates mode-switching).
