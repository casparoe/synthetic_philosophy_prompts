      *   *Nuance:* Modern dispositionalism (e.g., Mumford, Bird) often accepts defeasibility but tries to ground it in the nature of the power itself (tendentiality) rather than just adding clauses to a conditional.
      *   *Is it dodging?* It depends on whether you can specify the defeaters non-circularly. If you say "it breaks unless masked," you need to define "mask" without referencing the disposition itself.

  6.  **Drafting the Response (Iterative Process):**

