  **The Anchor Line**

  The tickers along the Harbor Walk never stopped clacking, a wooden rain falling on the cobblestones. They listed the welfare index components in scrolling columns: grain bushels, school terms completed, wage averages, the quarterly contentment surveys. People walked past without looking up, but Elias knew they listened to the rhythm. A staccato burst meant grain prices were spiking; a slow, steady cadence meant the schools were reporting full terms.

  Elias sat in the Chamber of Reconstruction, three floors above the noise. He was the newest arbitrator, seated at the end of the long oak table where the wood was worn smooth by elbows. His job was to settle the debts of the past.

  Two years ago, the city had voted on the Iron Tariff. The markets had run for a week while the council debated. The "Pass" shares traded higher than the "Reject" shares, so the tariff became law. Now, the "Pass" holders were paid out based on the actual welfare index, which anyone could read on the Harbor Walk. The "Reject" holders, however, were waiting on this room. They were owed the value of the index *had the tariff failed*. Since that world did not exist, Elias and the four senior arbitrators had to build it.

  "Case 44-B," said Heston, the Chair. He was a man of gray beard and gray logic, never raising his voice. "The Iron Tariff. Actual index settled at forty-two."

  A low number. Forty-two meant dockworkers were idle, the grain reserves were thin, and the contentment surveys showed a city holding its breath.

  "We need the counterfactual," said Mara, the senior analyst. She shuffled a stack of papers thick with testimony from merchants and guild masters. "The convention is to start with the actual and adjust for the policy's contribution."

  Elias watched them. This was the routine. They never started from a blank slate. They started from the ruins, or the gardens, that actually existed, and then tried to prune away the branches of the policy to see what lay beneath.

  "The yards are half-empty," Heston said, tapping the report. "Unemployment is up twelve percent since the tariff."

  "Because foreign iron was priced out," Mara said. "Ships aren't being repaired. They go to the free ports south."

  "So the tariff hurt," Elias said. He hadn't meant to speak, but the number forty-two sat heavy in his stomach.

  Heston looked at him kindly. "We aren't judging if it hurt, Elias. We are judging what would have happened without it. If we reject the tariff now, in hindsight, what is the number?"

  Mara leaned forward. "If the tariff hadn't passed, foreign iron floods in. Local yards undercut immediately. Wages collapse."

  "But the wages are already low," Elias said.

  "Exactly," Mara said. "Because the tariff failed to protect them. Without the tariff, the collapse would have been total. The yards would have closed, not just slowed."

  She picked up her pen, hovering over the ledger. "If the actual is forty-two, the counterfactual must be lower. If the yards closed, unemployment hits eighty percent. Grain demand drops. Contentment plummets."

  "Thirty?" Heston suggested.

  "Twenty-five," Mara said. "Maybe twenty. A collapse of that magnitude triggers riots. The index doesn't just measure money; it measures order."

  Elias looked at the window. Down below, a group of teachers were gathering. He knew what they were doing. The school reform measure was up for debate next week. The index counted "years of schooling." To boost the "Pass" price, the teachers' union had extended the term by two weeks and added a mandatory summer module. It was transparent gaming, everyone knew it, but it was legal. It nudged the index up, making the markets believe the city was improving. It was background noise, the static of a city trying to look healthy for the cameras.

  But in here, the noise was different.

  "If we set it at twenty," Elias said quietly, "the difference is twenty-two points. The tariff looks like it saved us from ruin."

  "It did save us from ruin," Heston said. "Look at the streets. Are there riots? No. The tariff held the line."

  "But the line is low," Elias said.

  Heston sighed, a sound like wind in the rigging. "We must be **anchored to the actual**. We cannot imagine a thriving city when the streets are quiet. The counterfactual must reflect the conditions of the time. The economic sentiment was fragile. Without the tariff, the fragility becomes breakage."

  Elias wrote down the number. Twenty-five.

  It made sense. Each argument was defensible. If the city was struggling, it was because the winds were against them. If the winds were against them, then removing the sail (the tariff) would have capsized the ship. The worse the sea, the more necessary the sail, even if the ship wasn't moving forward.

  Over the next few months, Elias saw the pattern repeat.

  There was the Harbor Dredge. The actual index was thirty-eight because the debt service ate the budget. The Board set the counterfactual at fifteen. *Without the dredge, the ships couldn't dock at all. Trade stops. Famine.* The dredge was validated as a survival measure.

  There was the School Consolidation. Actual index forty-five. Counterfactual set at thirty. *Without consolidation, the buildings would have collapsed. Injuries. Deaths.* The consolidation was validated.

  The city was not getting richer. The grain prices remained high, the wages stagnant. But the markets kept approving interventions. Elias watched the traders on the Harbor Walk. They knew how the Board worked. They knew that when the index dipped, the Board would reconstruct a nightmare scenario for the "Reject" price. They knew that in a crisis, the "Pass" price would always look superior because the counterfactual would be dragged down into the mud with the actuals.

  It wasn't corruption. No one took bribes. Heston prayed before sessions. Mara checked her citations three times. They were being honest. They were looking at the pain in the city and saying, *It would have been worse.* And because the city was in pain, it was easy to believe it could have been agony.

  One rainy Tuesday, they convened for the Water Tax. The actual index had slipped to thirty-five. The pipes were leaking, but the tax had burdened the poor.

  "Actual is thirty-five," Heston said. He looked tired. The weight of reconstructing history was wearing on him. "We need the counterfactual."

  Mara opened her file. "Without the tax, the infrastructure fails. Waterborne illness. Workdays lost."

  "Illness is already up," Elias said. He pointed to the health column in the welfare composite. "Respiratory issues are high. Water quality is marginal."

  "Which proves the need," Mara said. "Without the tax revenue, the filtration plants stop. Cholera returns."

  "In a city already sick?" Elias asked.

  "Especially in a city already sick," Heston said. "Immunity is low. The mortality rate would spike."

  Elias looked at his ledger. The page was filled with numbers that balanced perfectly. Actual minus Counterfactual equaled Benefit. The Benefit was always positive. The system always proved that action was better than inaction.

  If the city were thriving, say at ninety, the counterfactual might be eighty-five. *Without the tax, the pipes leak a little. Annoyance.* The benefit is small.
  But at thirty-five, the counterfactual was zero. *Without the tax, death.* The benefit is huge.

  The mechanism rewarded the decline. A sinking ship justifies any bail bucket, because the alternative is the bottom.

  "We need a number," Heston said.

  Elias picked up his pen. He thought about the teachers extending the school term. He thought about the merchants hoarding grain to spike the price index before the settlement date. They were gaming the components. The Board was gaming the history. Neither was illegal. Both were **anchored to the actual**.

  "If the filtration stops," Elias said, his voice flat, "and the immunity is low... mortality doubles."

  "Conservative estimate," Mara noted.

  "Index drops to ten," Elias said.

  Heston nodded. "Ten. Agreed."

  They wrote it down. The Water Tax was validated. The traders on the Walk would see the settlement tomorrow. They would see that the crisis had been managed. They would see that the intervention produced a twenty-five point benefit. They would bid accordingly on the next measure.

  Elias closed the ledger. The leather was cool under his hand. Outside, the rain beat against the glass, blurring the lights of the harbor. The ships rocked in their berths, tied tight to the docks. They weren't going anywhere, but they weren't sinking. Not yet.

  "Same time Thursday," Heston said, standing up. He gathered his papers. "The Grain Reserve proposal. Actuals are coming in low."

  "Understood," Elias said.

  He walked to the window. Below, the tickers clacked on, counting the school terms, the wages, the grain. The numbers moved, but the city stayed still. Elias placed his hand on the glass. He could feel the vibration of the machines, the pulse of the market measuring the welfare of a city that was learning how to survive its own salvation.

  He turned back to the room. The ledger sat on the table, open to the next page. The column for the counterfactual was empty, waiting for the world to happen so it could be rewritten.

  "See you Thursday," Elias said.

  He turned off the light, leaving the room in the gray glow of the city below.
