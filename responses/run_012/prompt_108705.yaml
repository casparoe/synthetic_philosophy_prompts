  *   **Round 4 Decision:** Pat (Yes/No)? Quinn (Yes/No)? | *Reasoning:* _________
  *   **Round 5 Justification:** (Text) | *Vote Result:* (Pass/Fail)

  ### 6. The Debrief (25 Minutes)
  *Do not lecture. Ask questions that force them to articulate the theory based on their data.*

  **A. The Floor/Ceiling Flip (5 mins)**
  *   **Ask:** "Look at applicant Noah (ID 14). What happened to them from Round 2 to Round 3?"
  *   **Point:** In Round 2, the number '4' was a **floor** (helped Noah). In Round 3, the number '3' (or '4' if you kept your original plan) became a **ceiling** (hurt Noah).
  *   **Concept:** Quotas are not inherently "good" or "bad"; they are constraints that bind differently depending on the distribution of scores and the political mandate. The *same* group can be protected by a floor and victimized by a ceiling.

  **B. The Incidence Question (5 mins)**
  *   **Ask:** "In Round 2, who paid the cost for the Group M floor? Did the top-scoring Group K students lose their seats?"
  *   **Point:** Likely not. The cost was borne by the *marginal* Group K applicant (Gale, ID 07), not the elite.
  *   **Concept:** **Incidence.** Affirmative action rarely hurts the privileged elite; it hurts the working-class/marginal members of the dominant group. This explains the political rage.

  **C. Remedy vs. Diversity (5 mins)**
  *   **Ask:** "In Round 5, those who tried to justify exceeding the cap—what argument did you use? 'We need diversity' or 'We need to fix past wrongs'?"
  *   **Point:** 'Diversity' is often accepted more easily than 'Remedy.'
  *   **Concept:** **Justificatory Regimes.** Courts/Publics often accept diversity (benefits everyone) but reject remedy (costs someone for past sins).

  **D. The Definitional Problem (5 mins)**
  *   **Ask:** "How did you vote on Pat and Quinn? Why was it annoying?"
  *   **Point:** If you said Yes to Quinn (1 grandparent), why No to Pat (private school)? You are making sociological judgments, not legal ones.
  *   **Concept:** **Essentialism vs. Experience.** Is the benefit for *blood* or for *shared disadvantage*? If it's disadvantage, why use group labels at all?

  **E. Reveal (5 mins)**
  *   **Reveal:** "Group K = Majority/Dominant. Group M = Minority/Protected. Round 2 = Affirmative Action. Round 3 = Anti-Discrimination Law / Prop 209."
  *   **Close:** "You felt the tension because the system is tension. It's not a bug; it's the feature."

  ### 7. What Will Go Wrong (And How to Fix It)

  **1. The Moral Refusal ("This is discrimination.")**
  *   **Predict:** In Round 2 or 3, a student will say, "I refuse to do this, it's immoral."
  *   **Fix:** Do not debate. Say: "I hear you. For the next 10 minutes, you are not students; you are bureaucrats. Your job is to simulate the outcome of the rule, not to judge the rule. We judge the rule in the debrief."

  **2. The Rubber Stamp (Round 5)**
  *   **Predict:** Tables write "Diversity is good" and everyone votes Accept. The burden of explanation fails.
  *   **Fix:** **Seed the Rejection.** Before Round 5 starts, tell Table 1 secretly: "You are the 'Taxpayer Watchdog' group. You must reject any justification that doesn't mention 'Score Merit' specifically." This guarantees conflict.

  **3. Time Creep**
  *   **Predict:** Round 4 (Wildcard) becomes a 20-minute debate on identity.
  *   **Fix:** Hard stop. "You have 2 minutes left to vote. If no majority, they are defaulted to Group K."

  **4. Gaming the Scores**
  *   **Predict:** Students ignore scores entirely in Round 2 and pick the "best bios."
  *   **Fix:** Circulate. "The rule says 'Highest Scoring Applicants provided...' You must maximize scores within the constraint. You can't just pick anyone."

  ### 8. Limitations (Be Honest in Debrief)
  *   **Scores are Fixed:** In reality, scores are manufactured upstream (prep schools, funding). This sim treats scores as exogenous/natural.
  *   **No Pipeline:** We aren't simulating who *applied*. Quotas often work on the applicant pool, not just the admit list.
  *   **No Stigma:** We aren't simulating the psychological cost to the beneficiaries (imposter syndrome) or the long-term network effects.
  *   **One-Shot:** Real admissions is iterative. This is static.

  ### 9. Instructor Design Notes (For Your Eyes Only)
  *   **Why Max 3 instead of Max 6?** In your sketch, you suggested Max 6. If the natural merit outcome is 3 Moons (as designed above), a Max 6 cap never binds. The students will say "This rule changes nothing." To teach that a floor can become a ceiling, the ceiling must *bite*. Changing the rule to **Max 3** in Round 3 ensures the exact students who benefited in Round 2 are cut in Round 3. This is the only way to make the "Floor/Ceiling" distinction visceral.
  *   **The Wildcards:**
      *   **Pat (ID 16):** High cultural capital, clear Group M blood. Tests *Descent vs. Class*.
      *   **Quinn (ID 17):** Low cultural capital, partial Group M blood. Tests *Disadvantage vs. Identity*.
      *   *Tip:* If they struggle, ask: "Is this policy for *genes* or for *inequality*?"
  *   **Room Management:** With 20 loud undergrads, you need a "gavel." Use a timer alarm. When it dings, pens down. If you lose control of time, cut Round 5. It is the least critical for the core "Floor/Ceiling" lesson.
