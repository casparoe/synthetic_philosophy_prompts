      *   Aristotle: Master/Slave is private, economic, for the sake of leisure/virtue.
      *   Valladolid: Conquest, Sovereignty, *Encomienda* (labor extraction/tribute).
      *   *The Gap:* Aristotle's slave is part of the master's moral unit. Sepúlveda's "slave" is a subject of an empire, a source of revenue, or an enemy to be subdued. The *telos* is different (virtue vs. gold/evangelization/power).

