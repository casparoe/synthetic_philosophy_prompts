      *   *Key nuance to hit:* Sepúlveda isn't just "bad Aristotle"; he's using Aristotle to solve a problem Aristotle never had (colonial administration). Las Casas isn't just "good Christian"; he's using empirical observation to block a theoretical category that was always shaky.

