      *   *Analogy:* Soul rules body, master rules slave. It's beneficial for both.
      *   *Scope:* It is a relationship of *oikos* (household management), not *polis* (political rule) or *polemos* (war/conquest).
      *   *Identification Problem:* Aristotle admits it's hard to identify natural slaves empirically. Convention (law/conquest) often gets it wrong.
      *   *Purpose:* The slave is a "living tool" for the sake of life's necessities, allowing the master to pursue virtue/politics.

  3.  **Analyze Sepúlveda's Argument (through an Aristotelian Lens):**
      *   *Sepúlveda's Claim:* Indigenous people are barbarians, practice sacrifice/cannibalism, are militarily weak $\to$ therefore natural slaves.
      *   *Aristotelian Check:*
          *   Does cultural "barbarism" equal defective *bouleutikon*? Not necessarily. Aristotle distinguishes between vice/error and incapacity.
          *   Does military defeat prove natural slavery? Aristotle explicitly says no (slavery by conquest is conventional, not necessarily natural).
          *   *The Slide:* Sepúlveda moves from *actions* (sacrifice) and *outcomes* (defeat) to *nature* (incapacity). This violates Aristotle's caution about identifying natural slaves.
          *   *Scale:* Sepúlveda applies this to *peoples/nations*, whereas Aristotle talks about *individuals* within a household.

  4.  **Analyze Las Casas's Argument (through an Aristotelian Lens):**
      *   *Las Casas's Claim:* Indigenous people have reason, built cities, have laws, can receive faith.
