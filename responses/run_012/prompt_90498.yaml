answer: |-
  ### Brainstorm: The Informational Map

  Before we dig into the mechanics, we need to clear the conceptual underbrush. When we talk about "comparability," we are really talking about **admissible transformations**. We are asking: *What can I do to the numbers representing utility without changing the ethical truth of the situation?*

  Here are the distinctions we need to hold in mind:

  1.  **Ordinal vs. Cardinal:**
      *   *Ordinal:* Only the ranking matters. If $u(x) > u(y)$, then any transformed scale $\phi(u)$ must preserve that order ($\phi$ must be strictly increasing). The *distance* between points is meaningless.
      *   *Cardinal:* The size of the interval matters. If the gain from $x$ to $y$ is twice the gain from $y$ to $z$, that ratio must hold after transformation. This restricts $\phi$ to linear transformations ($\phi(u) = a + bu$, with $b > 0$).

  2.  **Level vs. Unit Comparability:**
      *   *Level:* Can we compare where two people sit on their scales? (Is Ann's 50 "higher" than Ben's 30?) This fixes the *origin* (zero) across persons.
      *   *Unit:* Can we compare the *size* of a step on two people's scales? (Is Ann's 10-point gain "bigger" than Ben's 10-point gain?) This fixes the *slope* (unit size) across persons.

  3.  **The Social Welfare Function (SWF) Requirement:**
      *   To sum utilities ($W = u_A + u_B$), the operation must be **invariant** to the admissible transformations. If changing the scale changes the policy choice, the sum is mathematically illegitimate.

  Your three tiers map roughly to standard social choice taxonomy:
  *   (i) **ONC** (Ordinal Non-Comparable): Pure preference orderings, no interpersonal contact.
  *   (ii) **OLC** (Ordinal Level Comparable): We can rank persons against each other, but not measure gaps.
  *   (iii) **CUC** (Cardinal Unit Comparable): We can measure gaps and compare them, assuming a common unit.

  ***

  ### Why Ordinal Comparability (ii) Isn't Enough for Utilitarianism

  Your instinct that tier (ii) feels like "enough" is a very common trap. It feels like if I can say "Ann is happier than Ben," I should be able to add them up. But utilitarianism isn't just ranking people; it's summing *quantities*.

  Under **Ordinal Level Comparability (OLC)**, we agree on who is better off, but we disagree on *how much* better off. Mathematically, this means we can apply *any* strictly increasing transformation $\phi$ to each person's utility function, provided we keep the ranking of levels consistent.

  If you try to calculate a "total sum" under OLC, you are calculating $\sum \phi_i(u_i)$. Because $\phi$ can be non-linear (curved), you can stretch the scale for Ann in the high regions and compress it in the low regions, while doing the opposite for Ben.

  **What (iii) buys you:**
  Cardinal Unit Comparability (CUC) restricts the transformations to linear ones: $\phi_i(u) = a_i + b u$. Crucially, the $b$ (the unit size) must be the **same** for everyone. This ensures that a "10 util" gain for Ann is ethically identical to a "10 util" gain for Ben. Without this constraint, the "sum" is sensitive to arbitrary choices of measurement units. If I measure Ann's welfare in "happiness points" and Ben's in "kilohappiness," the sum is nonsense. Tier (iii) forces us to use the same ruler.

  ***

  ### Stress-Testing the Hypothesis: "It's Secretly Just About the Zero"

  **Your Hypothesis:** *Once you've fixed a "neutral" point (zero) on each person's scale, ordinal comparisons quietly give you everything the cardinal folks wanted.*

  **Verdict:** **False.** Fixing the zero is necessary, but it is nowhere near sufficient.

  **The Reason:** Even if we agree that $u=0$ means "neutral existence" for both Ann and Ben, ordinal measurability still allows us to stretch the distance between 0 and 10 differently than the distance between 0 and 100. Utilitarianism requires that the *marginal* ethical weight of a utility gain is constant (or at least comparable). Ordinal scales allow the marginal weight to vary arbitrarily as you move away from zero.

  **The Concrete Counter-Example:**

  Let's construct a two-person society (Ann, Ben) choosing between Status Quo and two Policies. We assume **Ordinal Level Comparability with a Fixed Zero**. This means:
  1.  We can compare levels (Ann's 10 > Ben's 5).
  2.  Zero is fixed (0 = 0 for both).
  3.  But we can apply any strictly increasing transformation $\phi$ where $\phi(0)=0$.

  **The Setup:**
  *   **Status Quo:** Ann = 0, Ben = 0.
  *   **Policy X:** Ann gains 10, Ben loses 9.
      *   Raw Utilities: $u_A = 10, u_B = -9$.
      *   Raw Sum: $10 + (-9) = \mathbf{1}$.
  *   **Policy Y:** Ann gains 2, Ben gains 2.
      *   Raw Utilities: $u_A = 2, u_B = 2$.
      *   Raw Sum: $2 + 2 = \mathbf{4}$.

  **Initial Verdict (using raw scales):**
  Policy Y (Sum 4) is better than Policy X (Sum 1). A utilitarian calculator chooses **Y**.

  **The Transformation:**
  Now, let's apply an order-preserving transformation that respects the zero. Let $\phi(u) = u^3$. (This is strictly increasing and $\phi(0)=0$). This represents a different but "ordinally equivalent" way of measuring the same welfare facts.

  *   **Policy X (Transformed):**
      *   Ann: $10^3 = 1000$.
      *   Ben: $(-9)^3 = -729$.
      *   New Sum: $1000 - 729 = \mathbf{271}$.
  *   **Policy Y (Transformed):**
      *   Ann: $2^3 = 8$.
      *   Ben: $2^3 = 8$.
      *   New Sum: $8 + 8 = \mathbf{16}$.

  **New Verdict:**
  Policy X (Sum 271) is now vastly better than Policy Y (Sum 16). The choice **flips**.

  **Analysis of the Flip:**
  *   **Why did it happen?** Because the cubic transformation exaggerates large numbers. Policy X relies on a large gain for Ann to offset Ben's loss. The transformation made Ann's large gain "count" much more than Ben's large loss, swamping the small gains in Policy Y.
  *   **Which tier fixes this?**
      *   Tier (i) (No comparability): The comparison is impossible anyway.
      *   Tier (ii) (Ordinal + Fixed Zero): As shown, the choice flips. This tier is insufficient.
      *   **Tier (iii) (Cardinal Unit Comparability):** This tier forbids the transformation $\phi(u) = u^3$. It only allows $\phi(u) = b u$ (since zero is fixed, $a=0$). If we multiply both scales by $b$, the sum becomes $b \times \text{Original Sum}$. Since $b > 0$, the *sign* of the difference between Policy X and Y never changes. The ranking becomes invariant.

  So, fixing the zero does not stop you from curving the scale. To do utilitarian arithmetic, you need to fix the **unit** (linearity), not just the zero.

  ***

  ### The Diminishing Marginal Utility (DMU) Argument for Redistribution

  Now, let's look at the standard applied-ethics argument: *We should redistribute wealth from rich to poor because the poor gain more utility from a dollar than the rich lose.*

  **Which tier is it assuming?**
  This argument is silently assuming **Tier (iii): Cardinal Unit Comparability** (and often sneaking in Full Comparability).

  **Why?**
  The argument rests on comparing *marginal* utilities: $MU_{poor} > MU_{rich}$.
  1.  **Cardinality:** You cannot speak of a "marginal" gain (a derivative) without cardinal utility. Ordinal utility has no defined interval size, so "diminishing marginal utility" is technically meaningless in a pure ordinal framework (you can always transform a concave function into a convex one ordinally).
  2.  **Unit Comparability:** Even if we grant cardinality, we need to know that a "util" for the poor person is the same size as a "util" for the rich person.
      *   Imagine the Poor Person's utility is measured in "cents of happiness" and the Rich Person's in "dollars of happiness." The Poor Person might show a huge number for a $1 gain, and the Rich Person a small number. But if the units aren't calibrated, that difference is just an artifact of measurement, not ethical weight.
      *   To claim the *sum* of utility increases, you must assume that $1 \text{ util}_{poor} = 1 \text{ util}_{rich}$.

  **Is this assumption pulling more weight than people admit?**
  **Yes, massively.**

  Proponents of the DMU argument often treat it as a psychological fact ("Of course a starving man enjoys bread more than a satiated man!"). While the *intrapersonal* diminishing return is plausible (Tier i/ii), the *interpersonal* comparison required to sum those returns is a heavy ethical postulate, not an empirical observation.

  By invoking DMU to justify redistribution via utilitarian summation, you are doing two things:
  1.  **Asserting Cardinality:** You are claiming welfare is measurable like temperature, not just rankable like beauty.
  2.  **Asserting a Common Scale:** You are claiming that the intensity of satisfaction is comparable across different consciousnesses.

  If you retreat to Tier (ii) (Ordinal Level Comparability), the DMU argument collapses. You could say, "The poor person is happier than the rich person after the transfer," but you could not say, "The *gain* to the poor outweighs the *loss* to the rich." You would need a different ethical framework (like Rawlsian Maximin, which only requires ordinal level comparability) to justify the transfer.

  **Summary:** The DMU argument is a "Trojan Horse." It looks like a soft, psychological observation, but it smuggles in the hard, controversial metaphysical commitment of Cardinal Unit Comparability (Tier iii). Without that commitment, the arithmetic of "net social gain" is undefined.
