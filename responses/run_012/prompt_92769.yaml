answer: |-
  **The Scenario**

  Alex stands in the grocery aisle facing a routine choice: **Option A is a Grain-Fed Chicken Breast**, and **Option B is a Grass-Fed Beef Steak**. For the sake of this experiment, stipulate that price, nutrition, and taste are identical. We also hold the direct death of the eaten animal fixed as a constant moral cost (one animal dies for your meal in either case) to isolate a single variable: **the collateral toll on wild animals** (mice, insects, rabbits) caused by producing the food. 

  Option A (Chicken) requires intensive grain agriculture. Stipulate that producing the feed for this meal disturbs 1 hectare of cropland, involving annual harvesting, pesticides, and habitat clearance that kills or displaces **100 wild sentient units**. Option B (Beef) comes from permanent pasture. Stipulate it requires only 0.1 hectares of cropland (for minimal finishing) plus pasture land that involves no annual harvest, resulting in only **10 wild sentient units** killed or displaced. The only variable changing is the body count in the fields.

  ***

  **The Analysis**

  **(a) The Total-Welfare Utilitarian**
  *   **Conclusion:** Alex should buy the **Beef**.
  *   **Why:** This view sums all suffering and death. Since we held the direct death of the eaten animal constant (1 unit), the decision rests entirely on the collateral wild toll. 100 wild deaths (Chicken) outweigh 10 wild deaths (Beef). The Beef meal minimizes total harm.
  *   **Heavy Lifting:** The **intensity of land disturbance**. The reversal relies on cropland requiring annual violent harvesting (combines, poisons) versus pasture remaining static. 
  *   **Sensitivity:** This is robust across a wide range. As long as the crop-induced wild death rate is significantly higher than the pasture rate (e.g., anywhere from 5x to 50x), the Beef wins. It only flips back if grain yields become so efficient that land use drops precipitously, or if pasture management involves widespread culling of wild grazers.

  **(b) The Animal-Rights Theorist**
  *   **Conclusion:** Alex should buy the **Chicken** (or neither).
  *   **Why:** Rights views prioritize the intentional violation of individuals over aggregate numbers. While both options cause collateral wild deaths, the Beef option involves using a cow—a being with higher cognitive complexity and social depth—as a mere resource. The wild animal deaths are foreseeable side effects, but the cow's death is the *means* to the meal. The rights violation of the cow outweighs the numerical difference in collateral mouse deaths.
  *   **Heavy Lifting:** The **distinction between intended use and collateral damage**. Even if the chicken option kills more mice, those deaths are incidental to growing grain, whereas the cow is intentionally slaughtered. Changing the wild death count doesn't flip this verdict; only changing the status of the eaten animal would.

  **(c) The Ordinary Shopper**
  *   **Conclusion:** Alex buys the **Chicken**.
  *   **Why:** The shopper's moral circle rarely extends beyond the plate. Wild animals in the field are invisible to the calculus. The choice defaults to habit, perceived health benefits, or the intuition that "smaller animal = less harm."
  *   **Heavy Lifting:** **Salience**. The wild toll is physically and psychologically distant. Unless the packaging explicitly stated "This meal killed 100 mice," this variable carries zero weight. Changing the field death count has no effect unless it becomes marketing copy.

  ***

  **Steelmanning the "Worst" View (The Utilitarian)**

  To the general reader, the Utilitarian conclusion ("Eat the cow to save the mice") sounds like a monstrous parlor trick. Here is the defense:

  It is not a trick; it is consistency. If you claim to care about suffering, location shouldn't matter. We accept that building a hospital kills some workers and displaces some wildlife, but we do it because the net welfare gain is positive. The Utilitarian argues that hiding the blood in the fields doesn't wash it off. If industrial cropping is a massacre of small sentient lives, continuing to fund it because the victims are uncharismatic is speciesism disguised as virtue. The Beef option isn't "good," but it is the *least bad* available technology for feeding a human without razing the wild. To reject this math is to prioritize the *purity* of the consumer's hands over the actual bodies on the ground.
