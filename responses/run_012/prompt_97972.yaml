      *   **Task:** Deconstruct the phrase "the wanting is the wound" into precise claims/readings. Evaluate each reading (trivial, plausible, false, contradictory to Bodhisattva ideal). Identify which reading is necessary for the teacher's conclusion ("stop trying to do good") to hold.
      *   **Format:** A "menu" of interpretations.

