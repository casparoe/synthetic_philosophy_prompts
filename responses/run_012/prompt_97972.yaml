  5.  **Identifying the Teacher's Necessary Premise:**
      *   For the teacher to say "Stop trying to do good," they need to equate *effective altruism* (strategic compassion) with *tanha* (selfish/craving-based suffering).
      *   They need to claim that *any* strategic intention is a form of ego-grasping.
