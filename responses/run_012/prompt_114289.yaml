      *   **25-35 min: The Diagnosis.** Why did it break? Address Misconceptions (a) and (b) here. It's not wordplay; it's logic. It's not just self-reference; it's *unrestricted* comprehension.
      *   **35-50 min: The Repair (Axiomatics).** Introduce the idea of "Safety Rules." Zermelo's fix (Separation). Show how the paradox becomes a theorem ($R$ is not a set). Address Misconception (c) and (d).
