      *   *The Adjective Example:* I need to be honest with the user. It's the Grelling-Nelson paradox. It's isomorphic, but for a group wanting to understand why *mathematics* needed fixing, linguistic examples reinforce the "it's just language" error. I will advise using it as a *sidebar* or *analogy*, not the main event. The main event must be about *membership*.
      *   *Misconceptions:*
