answer: |-
  This is a remarkably precise formulation of a problem that usually dissolves into hand-waving. You have correctly identified that the "shrug" of your colleagues is not a failure of rigor, but a signal that the phenomenon sits at a boundary where current categories (shape vs. meaning, feature vs. system) break down.

  Given your constraints (three specialists, one year, limited compute/participants), you cannot solve the metaphysics of the letter. You can, however, build a model that forces the metaphysics to reveal itself through behavior.

  Here is the argument for which questions to pursue, which to discard, and the hidden question that underpins them all.

  ### The Hidden Foundational Question
  **You have not listed the question on which most others depend: *The Locus of Invariance.***

  Before you can ask about representation (2) or vagueness (4), you must determine *where* in the processing stream the variable ink becomes the invariant letter. Is letterhood a property of the early visual encoding (retinal/V1), the structural description (LOC), or the lexical access (semantic)?

  *   **Why this comes first:** If letter identity is resolved early (shape-based), then Question (2) is likely about templates or features. If it is resolved late (system-based), then Question (2) is about relational contrasts.
  *   **Impact on your team:** This dictates the Psycholinguist's experimental design (masking priming vs. lexical decision) and the Modeler's architecture (perceptual input layer vs. conceptual mapping layer).
  *   **Why it wasn't listed:** You listed the *layers* (6), but not the *process* of collapsing those layers. Question (6) is a taxonomy; the Locus of Invariance is a mechanism. You must treat (6) as a definitional prerequisite, not a research question. Agree on terms in week one, then never speak of them again.

  ### The Selection: Questions (2) and (4)

  I recommend you dedicate the year to **Question (2) Representational Format**, operationalized through **Question (4) Vagueness and Degree**.

  #### 1. Question (2): Representational Format (The Theory)
  Specifically, you should test the **Relational/Contrastive Hypothesis** against the **Prototype/Template Hypothesis**.
  *   **The Argument:** Your observations about 'b'/'d' and 'Q'/'O' strongly suggest that letter identity is not intrinsic to the shape but defined by its difference from its neighbors. A 'Q' is an 'O' plus a tail *only because* 'O' exists. If letters are relational (like phonemes), then identity is a function of the system, not the shape.
  *   **Why this fits the team:**
      *   **The Modeler:** Hofstadter's analogy models are inherently relational. This is the natural home for a computational approach that doesn't rely on pixel-matching but on structural mapping.
      *   **The Psycholinguist:** Can test this via priming. Does seeing a specific 'O' shift the recognition threshold for a 'Q'? Does seeing a 'b' inhibit 'd'?
      *   **The Typographer:** Can generate the stimuli. If identity is relational, then changing the 'O' in a font should legally force a change in the 'Q' to maintain distinctness.
  *   **Feasibility:** High. You do not need to model the whole alphabet. You need to model specific *pairs* or *triplets* (a/o, b/d, n/u) where the topological ambiguity is highest.

  #### 2. Question (4): Vagueness and Degree (The Measure)
  *   **The Argument:** "70% 'a'" is not a metaphysical state; it is a psychophysical threshold. By treating letterhood as a category boundary rather than a binary switch, you turn the "shrug" into data.
  *   **Why this fits the team:**
      *   **The Typographer:** This is your primary contribution. Creating ecologically valid morphs between letters (e.g., gradually closing the bowl of an 'a' to become an 'o', or straightening the tail of a 'Q') requires a designer's eye. Standard psychophysics stimuli (Gabor patches, generic sans) will fail to capture the "style" constraint you noted.
      *   **The Psycholinguist:** Can measure the "tipping point" where recognition flips. Crucially, they can test if this point *moves* based on context (linking back to Question 2).
      *   **The Modeler:** Can attempt to predict the tipping point. If the model is relational, it should predict that the 'a'/'o' boundary shifts if the rest of the alphabet is present vs. absent.
  *   **Feasibility:** High. Threshold experiments are standard, but doing them with high-fidelity typographic stimuli is rare and valuable to both fields.

  ### The Discards (and Why)

  *   **(1) Metaphysics:** **Downstream.** Do not spend time on "Artefact vs. Essence." If you solve (2) and (4), the metaphysics will look after itself. If the data shows identity shifts with context, the "Essence" argument dies. If it shows stability, the "Artefact" argument weakens. Let the data decide the philosophy.
  *   **(3) Style:** **Downstream of (2).** You cannot define style computationally until you know what is being styled (the Identity). Style is the variance *around* the identity. Solve Identity first.
  *   **(5) Alphabet as a System:** **Too Broad.** Asking "why alphabets have the inventories they do" is evolutionary history. Asking "what constraints the visual system" is good, but it is answered by (2). If 'b' and 'd' are distinct, it's not because the eye can't see the mirror, but because the *system* assigns them different values. Narrow this to the perceptual constraints tested in (2).
  *   **(6) Ladder of Abstractions:** **Terminological.** As noted, this is a prerequisite. If you conflate 'glyph' and 'grapheme' in your experimental design, the data will be noise. Define it, freeze it, move on.
  *   **(7) Empirical Question:** **Method, not Goal.** This is what the Psycholinguist *does*, not what you *study*. It is the means to answer (2) and (4).
  *   **(8) Normative Question:** **Matters of Taste.** "Good" design is culturally and temporally contingent. "Well-formed" is often just "familiar." This is downstream of recognition. A "bad 'a'" is still an 'a' if it is recognized as one. Separate legibility (empirical) from quality (aesthetic).

  ### The Reasoning: Upstream, Downstream, and Neglect

  **Why (2) and (4) are the right leverage points:**
  1.  **Neglect:** Cognitive science often uses simplified stimuli (letters as arbitrary symbols) ignoring typographic reality. Typography often uses complex theory ignoring perceptual reality. Meeting in the middle (high-fidelity stimuli + rigorous thresholds) is genuinely neglected.
  2.  **Upstream/Downstream:** (2) is upstream of (3) and (8). You cannot model style or judge quality without a model of identity. (4) is the empirical handle on (2).
  3.  **Team Fit:** This is the only combination where all three members are *essential*.
      *   Without the **Typographer**, the stimuli are psychologically sterile (solving the "pixel grid" problem you mentioned).
      *   Without the **Psycholinguist**, the "intuition" remains anecdotal.
      *   Without the **Modeler**, the data remains descriptive rather than mechanistic.

  ### The First Three Months: A Validation Plan

  You should spend the first quarter trying to falsify the **Relational Hypothesis**.

  1.  **Month 1 (Typographer):** Generate two sets of stimuli. Set A: Isolated letters morphing from 'a' to 'o'. Set B: The same morphs embedded in a full alphabet where the 'o' is distinctly different.
  2.  **Month 2 (Psycholinguist):** Run a pilot identification task. If the Relational Hypothesis is true, the 'a'/'o' boundary in Set B should shift compared to Set A (because the system context stabilizes the categories).
  3.  **Month 3 (Modeler):** Attempt to train a simple analogy model on Set A. If it fails to generalize to Set B without retraining, it suggests the model lacks the "systemic" constraint humans possess.

  **Move Up:** If the boundary *shifts* with context, you have struck gold. This proves identity is systemic (Question 2) and vague (Question 4). You proceed to map the "force field" of letter identity.
  **Move Down:** If the boundary is *stable* regardless of context, then letter identity is intrinsic to the shape (Template Theory). You must then pivot to Question (1) Metaphysics, because you have proven the "Essence" lies in the form, not the system.

  ### Summary
  Take up **(2) Representational Format** and **(4) Vagueness/Degree**.
  Treat **(6) Ladder of Abstractions** as a definitional constraint.
  Treat **(1), (3), (5), (8)** as downstream consequences to be discussed in the paper's conclusion, not the research focus.
  Keep the **Locus of Invariance** in mind as the hidden variable controlling your experimental design.

  This approach respects the designer's intuition (that context matters), the cognitive scientist's demand (for measurable thresholds), and the modeler's need (for structural rules). It turns the "shrug" into a slope.
