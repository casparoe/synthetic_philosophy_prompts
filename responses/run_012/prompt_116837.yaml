  **Ranking of Solutions to the Nonidentity Problem**

  **1. Identity doesn't matter (Score: 0.9)**
  Shifts the metric to impersonal outcomes, logically resolving the paradox though it invites other counterintuitive results like the Repugnant Conclusion.

  **2. Look at the action, not the outcome (Score: 0.85)**
  Bypasses the comparative trap entirely by grounding wrongness in the agent's recklessness rather than the victim's comparative status.

  **3. Harm without the worse-off test (Score: 0.8)**
  Preserves the person-affecting intuition by redefining harm non-comparatively, though it requires contested metaphysical commitments about states of being.

  **4. The contingency discount (Score: 0.4)**
  Attempts a compromise by scaling moral weight to contingency, but lacks a clear principled basis for why existence-dependence dilutes a complaint.

  **5. A life worth living isn't a harm (Score: 0.3)**
  Merely reinforces the counterintuitive conclusion that no wrong occurred without explaining why the reckless choice remains morally objectionable.

  **6. Wrongness needs a victim (Score: 0.1)**
  This is the premise that generates the paradox rather than a solution, as accepting it requires abandoning the intuition that the risky policy is wrong.

  ***

  **Note on Move 6 (The Contingency Discount)**
  This lands in the middle-low tier because it mitigates the counterintuitive result without fully resolving the logical tension. Honestly, it is not a distinct move; it is simply the **Person-Affecting View (Move 1) wearing a hat**. It retains the core requirement that wrongness depends on effects on particular people but adds a scalar modifier to avoid the all-or-nothing bullet bite. It lacks the metaphysical machinery of Move 4 or the structural shift of Move 2, functioning instead as an ad hoc adjustment to Move 1.
