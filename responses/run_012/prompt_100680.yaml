prompt: |-
  I have spent my career as an actuary at a midsize property-casualty insurer, so I am comfortable with loss distributions, premiums, reserves, retentions, capital charges, ruin probabilities, and, when a single number is demanded, value-at-risk and expected shortfall. A recent diagnosis in my family forced me to make a set of high-stakes decisions about treatment, savings, and insurance coverage, and I noticed that my own choices did not look like expected-utility maximization. A colleague then pointed me toward risk-weighted expected utility, and I have been trying to understand it ever since. I would like you to restate that theory, as faithfully as you can, in the vocabulary I actually use.

  Treat the agent as an insurer or reinsurer choosing among contracts, and map the theory's primitives onto the objects I already work with: loss distributions, deductibles, retentions, premium loadings, capital requirements, and risk measures. Say explicitly what corresponds to the risk function, what corresponds to the utility function, and how the ranking of prospects is constructed from them. Then give me the residue report. Which claims translate cleanly into actuarial language, which translate only with distortion, and which have no counterpart at all? In particular, is the theory's distinction between risk aversion and diminishing marginal utility something my risk measures can capture, or does it require a separate object that actuarial practice does not currently have? Finally, tell me whether the residue is a defect of actuarial vocabulary, something it should be able to express but cannot, or a sign that the original theory is less clear than it looks. I want the translation to be honest: do not quietly replace the theory with expected utility or with a standard coherent risk measure and call that a translation.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Experienced actuary (midsize P&C insurer). Comfortable with technical terms: loss distributions, premiums, reserves, retentions, capital charges, ruin probabilities, VaR, Expected Shortfall (ES/TailVaR).
      *   **Context:** Personal high-stakes medical/financial decision-making revealed deviations from Expected Utility (EU) maximization. Colleague suggested Risk-Weighted Expected Utility (REU).
      *   **Task:** Restate REU theory faithfully using actuarial vocabulary. Map primitives (risk function, utility function, ranking) to actuarial objects (loss distributions, retentions, capital, etc.).
      *   **Specific Requirements:**
          *   Provide a "Residue Report" (what translates cleanly, what distorts, what has no counterpart).
          *   Address the distinction between risk aversion and diminishing marginal utility (can standard risk measures capture this?).
          *   Evaluate the residue (defect of actuarial vocabulary vs. defect of theory).
          *   **Constraint:** Be honest. Do not collapse REU back into EU or standard Coherent Risk Measures (CRM).

  2.  **Deconstruct Risk-Weighted Expected Utility (REU):**
      *   *Origin:* Lara Buchak (2013), building on Quiggin (Rank-Dependent Utility) and Yaari (Dual Theory).
      *   *Core Idea:* EU = $\sum p_i u(x_i)$. REU modifies how probabilities are weighted *before* being applied to utility.
      *   *Formula:* $REU = \sum [r(P(X \ge x_i)) - r(P(X \ge x_{i+1}))] u(x_i)$. Or in integral form for continuous variables: $\int u(x) d(r(F(x)))$.
      *   *Primitives:*
          1.  Utility function $u(x)$: Captures diminishing marginal value of money/outcomes (risk *neutral* valuation of outcomes).
          2.  Risk function $r(p)$: Captures attitude toward risk *itself* (distortion of probabilities). $r$ is increasing, $r(0)=0, r(1)=1$.
          3.  If $r(p) = p$, we get EU.
          4.  If $r(p)$ is convex, the agent is risk-averse (overweights bad tails). If concave, risk-seeking.
      *   *Key Distinction:* Separates *valuation of outcomes* ($u$) from *attitude toward risk distribution* ($r$). EU conflates these.

  3.  **Map REU to Actuarial Vocabulary:**
      *   *Outcomes ($x$):* Surplus, Net Income, or Negative Loss (Profit). Let's stick to *Loss* ($L$) since the user thinks in P&C terms. But REU is usually defined over wealth. Let's define the object of choice as the *Net Position* (Assets - Liabilities).
      *   *Utility Function $u(x)$:* In actuarial terms, this is the *economic value of capital*. It's not just \$1 = 1 utility. It reflects the marginal cost of capital or the marginal value of surplus. If the company is near ruin, \$1M is worth more than if capital is abundant. This maps to the *cost of capital* or *frictional costs* curve, but strictly speaking, it's the *valuation of the final surplus state*.
      *   *Risk Function $r(p)$:* This is the *probability distortion*. In actuarial terms, this looks like a *distortion risk measure* (like Wang Transform or Proportional Hazard). It maps the *cumulative distribution function (CDF)* of losses to a *distorted CDF*.
      *   *Ranking:* Instead of ranking by Expected Net Present Value (ENPV) or Expected Utility, we rank by the *Risk-Weighted Value*.
      *   *Risk Measure:* Standard actuarial risk measures (VaR, ES) are functionals of the loss distribution. REU produces a *single number* (certainty equivalent) derived from $u$ and $r$.
      *   *Capital Charges:* In REU, the "loading" for risk isn't just a variance loading; it's embedded in the shape of $r(p)$.

  4.  **Drafting the Translation (Iterative Process):**
      *   *Attempt 1 (Mental):* Tell him $u$ is like the utility of money and $r$ is like the Wang Transform.
      *   *Critique 1:* Too simple. Wang Transform is a specific distortion. REU is the general theory. Need to distinguish $u$ (value of surplus) from $r$ (aversion to volatility/ruin).
      *   *Attempt 2 (Closer):* Map $u$ to the marginal value of surplus (often assumed linear in pricing but non-linear in capital management). Map $r$ to the risk loading applied to the survival function.
      *   *Refinement:* In P&C, we usually minimize Loss or maximize Surplus. Let's frame it as *Surplus* ($S$).
      *   $u(S)$: The economic value of a dollar of surplus at level $S$. (Diminishing marginal utility of capital).
      *   $r(p)$: The weighting applied to the probability of achieving at least surplus $S$.
      *   REU Value = $\int u(S) \cdot d(r(1 - F_L(S)))$.
      *   Actuarial equivalent: A *Distorted Risk Measure* applied to the *Valued Surplus*.

  5.  **Addressing the "Residue Report":**
      *   *Clean Translations:* Distortion functions ($r$) map well to Distortion Risk Measures (Wang, Gini). Utility ($u$) maps to Economic Capital valuation.
      *   *Distortions:* REU assumes a single agent preference. Actuarial practice splits "Pricing" (risk neutral + loading) vs. "Capital Management" (ruin prob). REU unifies them. This might feel like a distortion to a practitioner who keeps pricing and capital separate.
      *   *No Counterpart:* The *separation* itself. Actuaries often conflate risk aversion into the discount rate or the loading. REU says they are distinct parameters.
      *   *Risk Aversion vs. Diminishing Marginal Utility:* This is the crux.
          *   EU: Risk aversion comes *only* from concave $u$.
          *   REU: Risk aversion comes from convex $r$. $u$ can be linear (risk neutral valuation of money) while $r$ is convex (hate uncertainty).
          *   Actuarial Practice: We use VaR/ES (coherent risk measures). ES is essentially REU with linear $u$ and specific $r$. But standard "Risk Measures" in regulation (SCR) often mix the two implicitly. The *distinct* parameter for risk attitude ($r$) separate from capital valuation ($u$) is not standard in basic pricing models (which usually assume linear $u$ and add a load).

  6.  **Evaluating the Residue (Defect of Vocabulary or Theory?):**
      *   Is it a defect of actuarial vocabulary? Partially. We speak in "Loadings" and "Capital" but rarely separate the *psychological/strategic weight on tail probabilities* from the *value of the dollars in the tail*.
      *   Is it a defect of theory? REU is normatively controversial (violates Sure Thing Principle/Independence Axiom). It allows dynamic inconsistency.
      *   *Honest Assessment:* The residue highlights that actuarial practice is a patchwork of EU (pricing) and Risk Measures (capital). REU exposes that this patchwork lacks a unified axiomatic foundation for *preference*. The "defect" is that actuarial vocabulary is *instrumental* (how to calculate) rather than *preference-based* (why we choose).

  7.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the user's expertise and the specific theory (Buchak/Quiggin).
      *   **The Translation:**
          *   Prospect $\to$ Net Loss Distribution (after reinsurance/retention).
          *   Utility Function $u$ $\to$ Marginal Economic Value of Surplus.
          *   Risk Function $r$ $\to$ Probability Distortion / Risk Loading Curve.
          *   Ranking $\to$ Risk-Weighted Surplus Equivalent.
      *   **The Residue Report:**
          *   Clean: Distortion functions (Wang Transform).
          *   Distorted: Separation of Pricing vs. Capital.
          *   Missing: Explicit separation of Risk Attitude from Valuation.
      *   **Risk Aversion vs. Marginal Utility:** Explicitly answer this. Standard risk measures (ES) capture $r$ with linear $u$. Traditional pricing captures $u$ (via discounting) + implicit $r$ (via loading). REU demands they be separate.
      *   **Conclusion:** Is it a vocabulary defect or theory defect? It's a vocabulary limitation regarding *preference structure*, but REU has its own normative issues (dynamic inconsistency).

  8.  **Self-Correction/Nuance Check:**
      *   *Caution:* Don't confuse REU with Dual Theory of Choice (Yaari). They are closely related (REU is essentially Rank-Dependent Utility). Yaari assumes linear $u$. REU allows non-linear $u$. I must ensure I don't simplify to Yaari unless specified. The prompt asks for REU.
      *   *Caution:* Don't confuse with Coherent Risk Measures (Artzner et al.). ES is coherent. REU is not necessarily coherent (depends on $r$). If $r$ is convex, it satisfies subadditivity? Actually, REU violates the Independence Axiom, which is why it was created. I need to make sure I don't claim it's "Coherent" in the Artzner sense unless the risk function satisfies specific properties.
      *   *Tone:* Professional, peer-to-peer, rigorous. No condescension.
      *   *Key Insight:* The user noticed their *own* choices didn't match EU. This suggests descriptive accuracy is valued over normative purity.

  9.  **Final Polish:** Check the mapping of "Capital Charges." In REU, the "cost" of risk is the difference between the Expected Value and the REU Certainty Equivalent. This acts like a capital charge.
      *   Make sure to explicitly address the "Residue" section as requested.
      *   Ensure the distinction between $u$ (value of money) and $r$ (weight on probability) is sharp.

  **(Self-Correction during drafting):** I need to be careful with the sign convention. Actuaries think in Losses ($L$). REU usually thinks in Wealth/Gains ($W$). I will define the object as *Final Surplus* ($S = Assets - Liabilities$) to align with REU's "good is up" convention, but acknowledge the Loss distribution context.

