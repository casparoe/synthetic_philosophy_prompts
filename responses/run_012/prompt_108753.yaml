      *   **Context:** The speaker is a novelist who previously wrote a book set on this river, inventing a mussel bed for a character. Now a real mussel is extinct, and the speaker is asked to speak.
      *   **Audience:**
          1.  Malacologists/Field Biologists (skeptical about taxonomy, extinction date, species validity).
          2.  Trust Volunteers/Donors (want clear mourning, find nuance cold/evasive).
          3.  Local Neighbors (remember the river before the dam, family history with shell trade).
      *   **Key Themes/Constraints:**
          *   Hold two opposing thoughts: 1. Species are arbitrary categories (extinction count changes without death). 2. Species are individuals/lineages (this was a specific "somebody" that died).
          *   Live in the tension/pull between these thoughts, not resolve it.
          *   Genuine mourning without relying on essence, single moment of death, or defensible natural order.
          *   Give donors/neighbors something to hold (emotional resonance) without lying to biologists.
          *   **Structural Element:** The mussel's lifecycle (larva on host fish gills, adult luring fish with mantle mimicking a minnow). The host fish and the lure remain; the bench is for the "third party" (the mussel itself).
          *   **Format:** Spoken word (rhythm, pacing), ~800 words, 5-6 minutes aloud. No citations/footnotes.
      *   **Tone:** Honest, mournful, nuanced, respectful, grounded.

  2.  **Deconstruct the Themes & Audience Needs:**
      *   *Biologists:* Need acknowledgment that taxonomy is messy. Don't claim absolute certainty about the "species" status. Acknowledge the debate without dismissing the loss.
