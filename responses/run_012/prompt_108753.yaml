answer: |-
  Good morning. Look at the water. It is moving the same way it moved before any of us were born, and it will move this way after we are gone. We are here to put a name on a stone and set it against that current.

  I am a writer of stories, not a scientist. Some years ago, I wrote a novel set on this bend. I needed a mussel bed for a character to worry over, so I invented one. I gave myself the liberty of making up a piece of the river because it served the plot. Today, we are gathered to mark a loss that is not invented. But even here, among the granite and the water, the line between what is made and what is found is not as straight as we might wish.

  To the biologists here, I know this name on the plaque is a argument. I know that what counts as a species is a decision humans make, not always a boundary nature draws. You have watched this creature classified, un-classified, and classified again. You know that extinction is not always a moment of death, but sometimes a date chosen on a clipboard. I will not stand here and tell you that this species was an eternal, unchanging essence. Science tells us otherwise. The number of extinctions in this river can change without a single organism having died, simply because we changed our minds about how to count them.

  But to the neighbors and the donors, I must say this: a decision is not a dismissal. Even if a species is a category, it was also a life. There is a way of seeing where a species is not a box, but a lineage—a single individual stretched out through time, the way your body is stretched out across space. If you see it that way, then this bench is not dedicated to the loss of a category. It is dedicated to the death of somebody.

  We are holding two truths that do not fit together comfortably. One says this creature was a flicker of classification. The other says it was a unique history that has now ended. I ask you to hold both. Grief does not require certainty. You can mourn a neighbor even if you disagree on where their property line stood.

  Consider how this animal lived. For the first weeks of its life, it was not itself. It was a larva clamped to the gills of a host fish, breathing through another creature's blood. It traveled the river hidden inside a swimmer. When it settled into the gravel, it could not move. It was anchored. Yet, to survive, it had to lure the host back. It grew a flap of flesh, shaped and twitched to look exactly like a small minnow. It pretended to be prey to invite the predator close enough to spread its young.

  Look at the river today. The host fish is still there. You can see them flashing in the riffle. The minnow-shaped thing that was never a minnow is still there, too, in the logic of the water, in the evolutionary memory of the bend. The trick remains. The host remains. The bench is for the third party. It is for the creature that made the lure, that rode the fish, that anchored itself here for four generations, and then did not.

  To the neighbors who remember the river before the dam, who remember the button trade and the shells sold by the bushel: you know that a river is not just water. It is a history of use and loss. To the volunteers who funded this stone: you wanted the loss named plainly. Here it is. We are marking an absence.

  We cannot say exactly when the last one died. We cannot say definitively that it was distinct from its cousin in the next bend. But we can say that the river is quieter now. The specific tension this animal held between the fish and the gravel is gone.

  So let us sit on this bench. Let us acknowledge that the name might be debated, but the silence is real. Let us admit that we are mourning a definition even as we mourn a life. We are here for the third party, the one who cannot speak, who cannot move, who only knows how to wait for a fish that still swims by.

  The water moves on. The fish swim on. We sit here for the one that does not. Thank you.
