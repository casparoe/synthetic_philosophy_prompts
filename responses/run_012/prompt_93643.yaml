          *   *Translation:* An actor's identity is not a static PID independent of its state. Instead, the actor *is* the aggregation of its active capabilities and session types. There is no "bare process" underneath; existence is defined by the set of open channels and held leases.
      *   *Claim 2 (Virtue):* Virtue = correct behavior within a role.
          *   *Translation:* Correctness isn't a global property of the node (e.g., "honest node"). It's defined by adherence to the session type specific to a channel. A node behaves "virtuously" only relative to the protocol of the specific connection it holds.
      *   *Claim 3 (Ritual/Protocol):* Ritual = Li. Not hard rules, but enactment/repair.
          *   *Translation:* Protocols are not just static type signatures. They include handshake mechanisms, heartbeat leases, and recovery routines (like 2PC abort/commit phases) that allow the relationship to persist through state changes. It's the runtime enforcement of the session.
      *   *Claim 4 (Harmony):* Harmony = System stability/consistency without central coercion.
