prompt: |-
  I'm an undergraduate, and last term I began keeping records with a county naturalist group that maintains a shared log of species sightings. The group's working rule is that any member's report stands unless someone has a particular reason to doubt it: entries note who reported what, but none of us is expected to gather independent evidence before repeating an entry as fact. I've noticed that I keep checking other people's identifications against field guides before I'll pass them on, and a friend says this is silly — if everyone demanded independent confirmation of every entry, the log would be empty, and nearly everything I know about local birds I know because someone told me. It doesn't help that one member has a reputation for over-claiming. I'd like to know which of us has the better grip on how I ought to treat what the group tells me, and what would have to be true for my re-checking to count as reasonable rather than compulsive.

  Answer in one paragraph of no more than 180 words.
