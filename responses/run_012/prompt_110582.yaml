answer: |-
  You are right to be suspicious, because the slogan people repeat is indeed a smoothed-over version of a much more technical result, usually attributed to I.J. Good. The core intuition is sound, but it rests on a stack of assumptions that are easy to violate without noticing. If we rank the objections by how threatening they are to the claim that a perfectly ordinary Bayesian is worse off for knowing, we have to distinguish between cases where the math breaks, cases where the model is misspecified, and cases where the assumptions are openly violated. The most threatening category, the one that keeps decision theorists up at night, is what I will call the feedback loop problem, which merges your points about other agents observing you and your inability to commit to not acting on what you learn. This is more dangerous than the mathematical pathologies because it suggests the theorem fails even when the math is perfect, simply because the world is not passive. In scenarios like Newcomb's Problem or Parfit's Hitchhiker, or even in certain game-theoretic equilibria, the act of knowing changes the probability distribution of the outcome in a way that is not captured by simple conditionalization on a fixed state space. If your knowledge of your own future action makes that action inevitable, and that action is suboptimal in a strategic context, then having that knowledge prevents you from being the type of agent who would have won. This isn't a violation of expected utility maximization per se, but it challenges the causal structure assumed by the theorem, implying that information can be negatively valuable if it restricts your logical counterfactuals rather than just refining your empirical beliefs. This is the most insidious because it looks like a standard decision problem but hides a dependency between the observer and the observed that the standard framework struggles to model without expanding the definition of agency itself.

  Slightly less threatening but mathematically more rigorous is the angle you mentioned about weird probabilities, specifically finitely additive priors. The standard proof of the value of information relies on countable additivity to ensure that conditional expectations behave nicely. If you allow for finitely additive priors, which some subjectivists like de Finetti argued are more fundamental, there are proven cases where conditionalization can lower expected utility. This is a genuine counterexample within a coherent probabilistic framework, showing that the theorem is not a universal truth of logic but a consequence of specific measure-theoretic choices. However, I rank this second because most ordinary Bayesians explicitly assume countable additivity, so dismissing this as a niche mathematical violation is easier than dismissing the feedback loop problem, which arises in plain English decision scenarios. It threatens the universality of the claim, but only for agents who deviate from the standard Kolmogorov axioms, whereas the feedback problem threatens agents who are otherwise perfectly standard but situated in a reflective or strategic environment.

  Below those two are the issues of infinite or undefined expected values. If your utility function is unbounded and the probabilities allow for St. Petersburg-style gambles, the expected value of information might be undefined, making the inequality meaningless. This is a significant limitation on the theorem's applicability, but it does not contradict the logic where expectations do exist. It is a domain error rather than a counterexample, showing that the theorem requires bounded utility or sufficiently fast-decaying probabilities to function. It is less threatening than the first two because it is easily patched by requiring bounded utility, a constraint many theorists accept for independent reasons. It tells us the theorem isn't everywhere, but it doesn't tell us it's wrong where it applies.

  The least threatening category merges your points about information costing money or thinking time with the idea that utility functions change upon learning. These are straightforward violations of the explicit premises of Good's theorem. The theorem specifically concerns free information and a fixed utility function. If reading the comment section costs you time that has negative utility, or if learning a fact makes you depressed and changes your utility weights, you have simply stepped outside the conditions required for the result to hold. These are not counterexamples to the theorem; they are cases where the theorem was never claimed to apply. Grouping them together highlights that they are essentially the same objection: the setup is not the one the theorem describes. They are important practical caveats but carry no weight against the theoretical claim itself.

  If I had to bet on which single one of these will still look like a live problem in fifty years, it would be the feedback loop cluster, specifically the version involving logical uncertainty and self-knowledge. We are getting better at handling infinite utilities and we have settled the measure theory debates for most practical purposes, but we still do not have a consensus decision theory that handles logical correlations and self-reference smoothly. As we build agents that can reason about their own source code or interact in highly transparent strategic environments, the question of whether knowing your own decision algorithm is beneficial or harmful will remain open. The other objections are either solved math or clear assumption violations, but the tension between rationality, knowledge, and control in a reflective setting is a philosophical knot that hasn't been untied.

  As for the slogan, it has definitely been quietly narrowed. The version people repeat is that information is never bad, but the actual technical claim is much weaker: free, private, costless information that does not causally influence the state of the world and is processed by a countably additive expected utility maximizer with a fixed utility function has non-negative expected value. Every single one of those qualifiers matters. In practice, the slogan has retreated from a universal principle of rationality to a specific property of a specific mathematical model, though you will still hear it quoted as if it were a law of nature. The survival of the feedback problem suggests that even this narrowed version might need further contraction to exclude logical information, leaving us with a theorem that is robust only for empirical data about a passive world.
