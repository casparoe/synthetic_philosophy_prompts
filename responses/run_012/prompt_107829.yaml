answer: |-
  The gravel crunched underfoot, a dry, rhythmic sound that seemed too loud for the silence hanging between them. The sky was bruising over with twilight. Elias pulled his coat tighter; Diana walked with her hands deep in her pockets, staring at the path ahead.

  "He was forty," Diana said. Not a question.

  "Biologically," Elias replied. "But strictly speaking, he is no age. The concept doesn't apply."

  "Don't start with the syntax, Elias. We just watched them lower him. It is a tragedy. He was in the middle of his best work."

  "It is a tragedy for us. For the department. For his students. But for him? He has lost nothing. You cannot lose what you do not hold. He does not hold life now, nor does he feel the absence of it."

  "That's the Epicurean mantra," Diana said, stepping over a root. "But it assumes harm is a sensation. A sting. If I slip a drug into your coffee that shortens your life by ten years, but you never know you took it, have you not been harmed?"

  "I would say I have been harmed *while* I am alive, by the chemical process. But death itself? When I am dead, I am not. If I am not, I cannot be worse off. Tell me, Diana: when exactly does this harm befall him? Is it before he dies? No, he is alive then. Is it after? No, he is gone. If you cannot locate the harm in time, you are speaking poetically, not metaphysically."

  Diana stopped walking. She turned to him. "You're obsessed with the container. You think harm must be an event *in* a life. I'm saying harm is a comparative relation between a life that was and the life that could have been. The harm occurs at the moment the possibility is extinguished. It's the snapping of the thread."

  "The snapping is an event for the snipper. For the thread? There is no thread to be snapped. Look, apply your logic to the past. You do not mourn the years before you were born. You did not exist then. You were deprived of those years, by your own metric. Why do you not view your pre-natal non-existence as a tragedy equal to your post-mortem one?"

  "Lucretius' asymmetry," Diana said, resuming the walk. "It's clever, but it fails because time has a direction. The years before my birth were never *mine* to have. They were closed off by the conditions of my origin. The years after my death were open. They were part of my narrative trajectory. I had projects, desires, a momentum moving into that future. Death doesn't just take time; it severs the vector."

  "So the harm is in the severing of the vector?"

  "Yes."

  "Then tell me about his manuscript. The one he asked you to edit. Suppose I burn it tonight. He never knows. He is dead. Has he been harmed?"

  "Obviously. He wanted it published. His agency is thwarted."

  "By whom? He has no agency. He is dust. You are the agent now. You are the one who feels the frustration of his thwarted wish. If I burn it, and you secretly rewrite it and publish it under his name, and the world cheers... has he been helped?"

  "In a sense."

  "In what sense? He feels no pride. He knows no acclaim. If the harm of the burning and the help of the publishing are both unfelt, then you are admitting that 'he' is not the subject of these verbs. You are talking about the *memory* of him. You are mourning the erosion of a statue, not the pain of the man."

  Diana kicked a stone off the path. "You're reducing welfare to consciousness. That's the flaw. If your spouse cheats on you for twenty years, and you die never knowing, were you not harmed during those twenty years?"

  Elias paused. "I was not harmed *in experience*."

  "You were harmed *in fact*."

  "This is the pivot," Elias said, pointing a gloved finger. "You want to say harm is a fact independent of the subject. But if the subject ceases to exist, the facts about him cease to be *about* him. They become facts about the history of the universe. If harm can exist without a subject to endure it, then harm is not a property of a person. It's a property of a story. And stories don't die; people do."

  "But the story *is* the person," Diana countered. "We are narrative entities. The value of a life isn't just the sum of its pleasurable moments. It's the coherence of the whole. Death at forty makes the narrative incoherent. It's a sentence cut off mid-word. The badness isn't located in a specific second of suffering; it's located in the shape of the whole. It's an atemporal fact about the life."

  Elias stopped. He looked at her, really looked at her, for the first time since the cemetery. "An atemporal fact. So you concede the harm is not in time."

  "I concede the *valuation* is atemporal."

  "Then why does it matter that *he* is the one deprived? If it's an atemporal fact, then the universe is slightly less valuable because Julian is gone. But that is a loss for the universe, not for Julian. You keep saying 'He is worse off.' But if the harm is atemporal, and he is temporal, the two never meet. You are trying to predicate a timeless property of a non-existent subject."

  Diana frowned. She slowed her pace. "I'm saying the subject *was* there, and the relation holds between the subject-that-was and the future-that-is-not."

  "But the subject-that-was is gone. If I destroy a painting, is the painting harmed? No. The painting is gone. The value is lost. But to say the *painting* suffers a loss is category confusion. You want to have it both ways. You want the harm to be real enough to justify our grief, but detached enough from experience that the dead man doesn't need to feel it. But if it's detached from experience, and detached from time, what work is the word 'harm' doing? You could just say 'The world is poorer.' Why insist 'Julian is worse off'?"

  "Because it matters whose life it is," Diana said, her voice tightening. "It's not just generic value. It's *his* loss."

  "Whose loss? If he doesn't exist, he can't possess the loss. You're holding a bag of coins and saying 'Julian is rich,' but Julian isn't here to take the bag."

  Diana stopped at her gate. She put her hand on the latch. "Elias, if you truly believe death is nothing to the one who dies, then you must believe that dying at forty is no different than dying at ninety, for the deceased."

  "Correct. In both cases, they do not exist."

  "And you'd prefer to live to ninety?"

  "Obviously. While I exist, I prefer to continue existing. That is a preference of the living."

  "But if you die at forty, you lose the chance to have that preference for fifty more years."

  "I lose nothing. The preference evaporates."

  Diana opened the gate. "That's where you lose. You admit you prefer to live. That preference is a fact about you. Death destroys the possibility of satisfying that preference. If harm is the frustration of rational preferences, and death frustrates the fundamental preference to continue, then death harms the preference-holder. Even if the holder is gone when the frustration is total, the frustration is real."

  Elias stood on the sidewalk. He looked down at his shoes. "You are arguing that the *destruction of the subject* is a harm *to the subject*."

  "I'm arguing that the destruction of a capacity for value is a negative value event, and the locus of that value was the person."

  Elias sighed. It was a sound of resignation, not fatigue. "If you define harm as 'the reduction of potential value in a locus that no longer exists,' you win. But you have stripped 'harm' of any connection to welfare. You are saying a man can be worse off in a state where 'off' and 'on' have no meaning. You have saved the tragedy, Diana, but you have lost the man."

  "I saved the truth," she said. "The man is gone. The truth remains that he was cheated."

  Elias nodded slowly. "Then we disagree on what 'cheated' means. Goodnight, Diana."

  "Goodnight, Elias."

  She went inside. Elias stood on the pavement for a moment, watching the light turn on in her hallway, then turned toward his own dark house.

  ***

  **Post-Script Analysis**

  I believe Diana (the Deprivationist) has the better of the argument, primarily because Elias (the Epicurean) is forced into a concession that undermines the intuitive force of his own position. Elias wins the metaphysical point regarding the *location* of harm—he successfully shows that there is no temporal moment where the dead subject experiences a deficit. However, Diana wins the axiological exchange by forcing Elias to admit that his definition of harm is restricted solely to *felt experience*.

  The damaging concession for Elias comes when Diana introduces the case of the unfaithful spouse or the betrayed trust. When Elias admits that a person can be harmed without *knowing* it (or that he must deny such harm exists to maintain consistency), he alienates his theory from our robust moral intuitions about welfare. If harm requires a subject to feel it, then coma patients, the deeply deceived, and the dead are all in the same metaphysical boat. Diana successfully argues that welfare is objective and narrative-based, not merely experiential. By framing harm as the frustration of rational preferences and the truncation of a narrative vector, she allows the "badness" of death to be a timeless fact about a life, rather than a timed event in a consciousness. Elias is left defending a view where death is "nothing" only by defining "something" so narrowly that it excludes most of what we care about in a human life.
