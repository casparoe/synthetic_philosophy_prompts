      *   **Specific Requests:**
          1.  A checklist of requirements for a "good" theory of distributive justice (cases it must handle, puzzles to address, distinctions to maintain, economic realities to respect).
          2.  Examples for each requirement to show *why* it's required.
          3.  Distinction between non-negotiable requirements vs. contested/ideological ones.
          4.  Identification of incompatible requirements (trade-offs), specifically addressing the "liberty vs. pattern" claim.
          5.  Application to a specific case: The "Viral Dance Girl" (created value, no obvious harm, became rich).
          6.  Format: List or table.
          7.  Tone: Informative, analytical, neutral (don't rank theories, just provide the "spec").

  2.  **Deconstruct the "Checklist" (The Spec for Distributive Justice):**
      *   What makes a theory of justice robust? It needs internal consistency, external plausibility, and practical applicability.
      *   *Key Distinctions:* Desert vs. Entitlement, Equality of Opportunity vs. Outcome, Procedural vs. End-State.
      *   *Key Economic Realities:* Incentives, Production vs. Distribution, Information problems.
      *   *Key Moral Intuitions:* Harm, Consent, Need, Effort.

  3.  **Drafting the Requirements (Iterative Process):**
      *   *Req 1: The Starting Point.* You can't just distribute what exists; you have to acknowledge how it got there. (Nozick's point).
      *   *Req 2: The Worst Off.* You can't ignore suffering. (Rawls' point).
      *   *Req 3: Incentives.* If you tax too much, people stop working. (Economic reality).
      *   *Req 4: Liberty/Rights.* You can't violate rights to achieve equality. (Libertarian constraint).
      *   *Req 5: Moral Arbitrariness.* Luck (birth, talent) shouldn't dictate everything. (Rawls' point).
      *   *Req 6: Distinction between Desert and Entitlement.* Did they *earn* it morally, or do they have a *right* to keep it legally?

  4.  **Addressing the "Liberty vs. Pattern" Claim:**
      *   This is Nozick's famous argument. Liberty upsets patterns. If you enforce a specific distribution (pattern), you have to constantly interfere with people's free choices (liberty). This is a genuine incompatibility.

  5.  **Addressing the "Viral Dance Girl" Case:**
      *   This is a stress test.
      *   *Nozick:* Perfectly fair. Voluntary exchange, entitlement theory.
      *   *Rawls:* Fair *if* the tax revenue helps the worst off. Unfair if it creates a caste system.
      *   *Luck Egalitarianism:* Problematic. She got lucky (viral). Should she keep it all?
      *   *Requirement Check:* Tests "Desert vs. Luck," "Harm Principle," "Incentives."

  6.  **Structuring the Response:**
