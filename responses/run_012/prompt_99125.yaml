      *   *Clarification:* The user mentioned "Deserves it" vs. "Allowed to keep it." I need to make sure that distinction is a specific line item.
      *   *Economic Reality:* Ensure I mention that distribution isn't just slicing a pie; it's about baking the pie (incentives).
      *   *Tone Check:* Keep it accessible but rigorous. The student is smart but needs the scaffolding.

