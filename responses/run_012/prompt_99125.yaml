prompt: |-
  ok so in civics we spent like a week on "what makes a society fair" and the teacher kept saying there's no one right answer, but I actually want to know what a good answer would even look like before I pick a side. The two things we did were the Nozick Wilt Chamberlain thing (somebody gets paid to play basketball, and suddenly the money's all lopsided even though everyone agreed to it) and Rawls and the difference principle (inequality is only ok if it helps the worst off). I can't tell which one to believe and I think its because I don't know what a theory of "who should get what" is even supposed to do.

  So can you write me the checklist? Like, for any theory of distributive justice to count as actually good, what does it have to get right — the cases it can't fumble, the puzzles it has to at least say something about instead of dodging, the distinctions it can't just mush together (I keep seeing people slide between "he deserves it" and "he's allowed to keep it" and those seem like different claims?), the stuff about how markets and incentives and taxes actually work that it can't contradict. For each one, give me the case or example that makes it a requirement, so I can see why it's on the list and not just someone's opinion.

  Then two things I really want: which requirements are non-negotiable and which are just stuff one camp cares about, and whether any two of them can't both be satisfied at once. Our teacher said something like "you can have liberty or you can have a pattern but not both" and moved on before I could ask, so if that's a real thing please explain it in the list.

  Oh and here's a case I keep thinking about that I've never seen in any of the readings, and I want a theory that can handle it: a girl at my school made up a dance, posted it, it went viral, and now she's making money off merch and brand deals. As far as I can tell nobody got hurt and nobody was worse off, she just started from nothing special and now she's rich. Does that count as a problem for a theory of fairness or not, and which of the requirements decide it?

  You don't have to rank the theories for me, I'll do that part on my own, I just want the spec first. A list is fine, or a table, whatever's easier.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
