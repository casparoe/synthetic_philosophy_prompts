      *   **Part 1: The Spec (Checklist):** Group into "Foundational," "Economic/Practical," and "Moral/Conceptual." Use the requested format (Requirement + Why/Example).
      *   **Part 2: Non-Negotiable vs. Contested:** Distinguish between logical coherence (non-negotiable) and value prioritization (contested).
      *   **Part 3: Incompatibilities (The Trade-offs):** Explain the Liberty vs. Pattern tension clearly.
      *   **Part 4: The Viral Dance Case:** Apply the checklist to this specific scenario.
      *   **Conclusion:** Encouraging wrap-up.

  7.  **Refining the Content (Self-Correction during drafting):**
