  The two theories are Hobsbawm's invented tradition and Anderson's imagined community. Map the episode onto both: who's inventing what, for whom, and in service of what. Then tell me where each one grinds. My hunch is neither fits clean. Rawlinson isnt a state legitimizing itself, he's a businessman with a practical annoyance; and the tartan revival looks like it was made largely from outside the Highlands — Lowland and English enthusiasm, diaspora money — and then re-imported as the authentic original, which is basically the pizza effect. So: does this case confirm these theories, break them, or show they were answering a different question than the one this case actually poses? And whats the general lesson for a tradition that gets fabricated and then genuinely becomes the thing it was faking?

  Lead with your bottom line in the first sentence, then give the reasoning. No preamble, dont restate the question.
