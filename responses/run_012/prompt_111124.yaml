answer: |-
  Hobsbawm's theory comes out worse because its functionalist core assumes elites invent traditions to legitimize power, whereas the Highland revival was driven by commercial utility and romantic consumption that the state initially suppressed and only later co-opted.

  Hobsbawm's framework maps cleanly onto the *Vestiarium Scoticum* and the George IV visit, where forged continuity and state pageantry serve to stabilize social order after the disruption of the Industrial Revolution and the Jacobite risings. However, the theory grinds significantly on the genesis of the symbols themselves: Thomas Rawlinson was not an elite imposing social control but an industrialist solving a logistical problem, and the Dress Act represents a state attempting to *erase* a tradition rather than invent one. The revival was not a top-down imposition of legitimacy but a bottom-up, outside-in cultural commodity— Lowland and English romanticism consuming a sanitized Highlandness—which Hobsbawm's model of state-centric social engineering struggles to accommodate without stretching the definition of "elite intent."

  Anderson's *Imagined Community* fits the mechanism of transmission better, as the revival was mediated through print capitalism (Scott's novels, the *Vestiarium* book) allowing strangers in the diaspora and Lowlands to imagine a shared kinship via tartan. It handles the "Pizza Effect" well, explaining how a culture exported, romanticized, and re-imported can still bind a community together through shared symbols rather than shared blood. Where Anderson grinds is on the political telos: his theory usually predicts nationalism leading to sovereignty, whereas this imagined community served to integrate Scotland deeper into the British Empire (e.g., Highland regiments), turning a potential separatist identity into a brand of Unionism.

  Ultimately, this case shows both theories were answering different questions than the one posed by the "Pizza Effect" of tradition. Hobsbawm asks "who benefits from the stability?" while Anderson asks "how do strangers feel connected?" but neither fully captures how a fabrication becomes ontologically real through consumer belief rather than state decree or political mobilization. The general lesson is that authenticity is not a property of origin but a contract of performance; a tradition becomes "true" not when it is historically verified, but when the community agrees to invest it with the authority of the past, regardless of who forged the deed.
