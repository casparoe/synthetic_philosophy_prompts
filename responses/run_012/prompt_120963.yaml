          *   *Critique:* It might be a "category error." Pleasure in art $\neq$ Pleasure in sorrow. Hume claims they merge. Does he prove they merge? He asserts they do. So, yes, it relocates the problem to "How does eloquence convert pain?" which is still mysterious. But it solves the specific problem of "Why tragedy and not real life?" (Because real life lacks the eloquence).
