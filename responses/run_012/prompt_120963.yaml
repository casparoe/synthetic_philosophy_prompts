  7.  **Final Polish:** Organize with clear headings matching the user's three requests. Ensure the brainstorming section comes first as requested. (Wait, the prompt asks to brainstorm *before* answering the three things, as part of the reasoning process shown to the user). I will structure the response to show the reasoning first, then the three points.

