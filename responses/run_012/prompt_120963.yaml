          *   *Distinction:* Hume isn't worried about *whether* we feel the emotion (he assumes we do). He's worried about the *hedonic tone* (painful vs. pleasant). Moderns worry about the *object* of the emotion.
          *   *Continuity:* Hume's solution (eloquence) doesn't solve the modern paradox (belief). But his insight about "psychological distance" or "aesthetic framing" anticipates later theories. He is asking a narrower question about *tragic pleasure*, not *fictional emotion* generally.

