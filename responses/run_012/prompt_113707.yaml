prompt: |-
  I'm in my third year and I'm taking a translation studies module where the entire second half is about translation under formal constraint — we've spent weeks on Hofstadter's Le Ton beau de Marot and every seminar dissolves into the same argument about what you're actually supposed to be preserving when the source is written inside a form. For my final project I want to turn that argument into a decision tree, so my classmates can find out which position they actually hold rather than just repeating whichever translator's preface they liked best. To keep it from turning into a tour of the famous examples everyone's already read, and because we're assessed on our own reasoning, I've built my own test case to hang it on: a fourteen-line source poem in an invented language where line n must have exactly n syllables, the first and last word of every line must rhyme with each other, and the initial letters spell out the addressee's name. So "preserving the form" could mean reproducing all three constraints, reproducing what it feels like to be trapped inside them, reproducing whatever those constraints were doing in the source, or something else entirely.

  Here's what I need. A decision tree that starts at one question and branches down to 7-9 leaves, with 6-9 internal nodes, and at least half the nodes phrased as concrete mini-cases rather than abstract questions — nothing like "do you think form matters?" that you could answer by announcing your position. Phrase every node so someone can answer it without knowing where it leads. The leaves should be named in plain English (no author names anywhere — I can't cite anyone and I don't want it looking like a "which theorist have you read" quiz), and these ones have to be in there somewhere: form-is-content (a text that breaks the constraint isn't a translation of this poem at all, it's a paraphrase of its subject matter); sense-first (the constraint is ornament, fidelity is to what's said); reader-experience equivalence (fidelity is to what happens in the reader, so a different constraint that produces the same effect counts); transcreation (the target has to have some binding form of its own, not necessarily the source's); process-not-product (the constraint binds what the translator does, and whatever text falls out is the translation — the target text itself doesn't have to satisfy anything); brief-relativism (there's no fact of the matter, the right trade-off is set by whoever commissioned the thing and what it's for); and outright refusal/untranslatability. Keep the node wording jargon-free — no "skopos", no "equivalence", no "domestication", no "literalism" — and save the technical vocabulary for the leaf names. Also: flag any two leaves your tree can't actually pull apart (I'd much rather see a flagged pair than a fake question that pretends to separate them), and tell me which combinations of answers come out empty and whether that's because the view is incoherent, unattractive, or just nobody's bothered.

  I want the cases below to do real work in the tree — each one should be what at least one node asks about, or at least the point where two leaves split: (A) a target text that nails all three constraints but ends up asserting something the source never asserts; (B) a target text that says exactly what the source says, in free verse, and is genuinely beautiful; (C) a target text that keeps the syllable counts but swaps the rhyme scheme for an alliteration pattern that's just as audible; (D) a target text that satisfies the acrostic using filler lines that mean nothing; (E) a target text that satisfies every constraint only by making the poem land like a nursery rhyme in the target language, which it doesn't in the source. Give it back to me as a single JSON object with no prose around it, using these fields: "nodes", an array of objects with "id" (like "Q1"), "question" (the node text, plain English), "answers" (array of objects with "text" and "leads_to", where leads_to is another node id or a leaf id), and "uses_case" (the letter of the case it's built on, or null if it's a general question); "leaves", an array with "id", "name", "one_line_commitment", "route" (the ordered list of answer texts that gets you there, so I can check the tree is actually walkable), and "most_awkward_commitment"; "empty_branches", an array with "combination", "diagnosis" (one of "incoherent", "unattractive", "unexplored") and "why"; and "unseparable_pairs", an array with "a", "b" and "why_the_tree_cant_split_them". If two different routes land on the same leaf, just say so in that leaf's "route".
