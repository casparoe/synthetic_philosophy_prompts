answer: |-
  1. **The Core Claim**
  You insist this isn't just a metaphor—that culture is Darwinian 'all the way down', with variation, selection and inheritance operating as mechanically as they do in biology. But metaphors are useful precisely because they don't have to be literally true. What explanatory work is the literal claim doing that the metaphorical one isn't?

  *Follow-up:* He'll likely say it allows for rigorous prediction rather than just loose analogy. Press him: "If the prediction is just 'successful traits spread', haven't you simply defined success as spread and called it a theory? Where's the independent measure of success?"

  2. **The Replication Problem**
  Selection needs copying with decent fidelity, yet the standard objection is that cultural transmission is reconstructive—we don't copy the tune, we rebuild it. If that rebuilding is constantly pulled back towards psychological attractors, has selection got anything left to do, or is this really just an epidemiology of representations?

  *Follow-up:* He'll argue fidelity is 'good enough' for selection to act. Push back: "Good enough for what? If the reconstruction is driven by human psychology, isn't selection just a shadow of the mind rather than an external force? You're smuggling the explanation in through the back door."

  3. **Blending vs. Particulate Inheritance**
  Genes are particulate, which stops the whole thing collapsing; culture looks much more like paint—mix two ideas and you get a blend. If variance halves every generation, you can't accumulate anything. Is cultural inheritance actually particulate enough to carry a Darwinian story?

  *Follow-up:* He'll claim ideas are discrete units. Challenge him: "Show me the discrete unit. If you have to draw the boundary yourself to make the math work, isn't that bookkeeping rather than biology? You're imposing particulate structure on a blending system."

  4. **The Grain Problem**
  How many memes are there in a symphony, or a poem, or the concept of Tuesday? If there's no principled way to count them, is 'meme' doing any explanatory work, or is it just a label we stick on things after we've already understood them?

  *Follow-up:* He'll say context defines the unit. Corner him: "If the unit shifts depending on the question, how is it a unit at all? It sounds like you're moving the goalposts to save the theory from falsification."

  5. **Cumulative Culture**
  The thing that looks special about human culture is the ratchet—improvements that don't slip back, which seems to need high-fidelity imitation. Is the ratchet the real thing you need to explain, and does your Darwinian machinery explain it or just redescribe it?

  *Follow-up:* He'll say selection preserves the improvements. Ask: "Or does the existence of the ratchet explain why we *see* selection? Which is the cause and which is the effect? You might be mistaking the outcome for the mechanism."

  6. **The Meme's-Eye View**
  If memes are selected for their own spread and not for our benefit, we should expect cultural items that harm their hosts—celibacy, suicide cults, chain letters. Do you bite that bullet, and how do you square it with the intuition that most culture is useful to us?

  *Follow-up:* He'll admit harmful memes exist. Press: "But most culture isn't harmful. So why posit a mechanism that predicts harm when the data shows benefit? Is your theory only visible in the exceptions, and invisible in the rule?"

  7. **The Demarcation Question**
  There's a live debate about what makes something a Darwinian population at all—how much heredity you need, how continuous it has to be. Where does culture sit: paradigm case, marginal case, or not a case at all?

  *Follow-up:* He'll argue it's a paradigm case. Counter: "If it's a paradigm, why does it require so many caveats about fidelity and blending? Sounds more like a marginal case demanding centre stage. Why force it into a box it doesn't fit?"

  8. **Rivalry vs. Redescription**
  Is memetics a rival to gene–culture coevolution or just a fancy way of describing the same data? If it's the latter, what's the extra content?

  *Follow-up:* He'll say it offers a new perspective. Be blunt: "Perspective isn't prediction. What can you calculate that a coevolutionist can't? If the answer is 'nothing', isn't this just semantics dressed up as science?"

  9. **The Unfalsifiability Worry**
  Memetics has a reputation for explaining everything after the fact. Ask him, flatly: what observation would count against your view?

  *Follow-up:* He'll likely say 'we need more data' or 'it's early days'. Don't let him off: "Name one specific finding that would make you burn the book. If there isn't one, isn't this philosophy dressed up as science?"

  10. **The Utility Question**
  Suppose you're right. What changes? Does this change how we teach, or govern, or treat mental illness?

  *Follow-up:* He'll promise long-term gains. Finish with: "If it doesn't change practice today, are we just arguing about ontology? Is that worth the fight?"
