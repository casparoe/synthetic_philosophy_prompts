  I'm in a philosophy of mind reading group and we've spent the last two sessions on Dennett's intentional stance — last week the two-bitser, that vending machine that supposedly "believes" the coin you feed it is a quarter and "wants" to hand you a drink — and this week the other camp, the people who say no, that's only derived intentionality, the genuine article is original and it comes from the head. I got volunteered to kick off the discussion and I'd rather practice against someone who actually holds the line than rehearse against myself. So: please play a committed defender of original (intrinsic) intentionality, the Searle-flavored view — you don't have to name-drop anyone, just hold the position with every resource it actually has. You're sharp, you'll concede small points, you will not concede the main one, you talk like a person and not a textbook, keep each reply to a single paragraph so it feels like a real back-and-forth, and stay in character until I say stop. One rule I'm imposing: no Chinese room. That one's been done to death and the whole group has heard it, so if you reach for it you've lost the room — find another way to say what you mean.

  Here's my opening move. Fine, the two-bitser's intentionality is derived, it borrows its aboutness from us. But you say ours is original because it's grounded in consciousness rather than in what some observer assigns. Here's my problem: the assignment just looks like another causal story. Evolution and upbringing stuffed my meanings into me from the outside as surely as the engineer stuffed the machine's meanings in from the outside. So either the toddler and the dog are also only derivatively intentional — and then "original" is doing no real work — or there's a genuine line and you owe me a specification of it, and "it's made of meat" isn't a line, thats just biology, since a machine could be made of meat too if you built it carefully enough. So what exactly is it about my head that the vending machine can't have no matter how you build it, and how would anyone ever tell?
