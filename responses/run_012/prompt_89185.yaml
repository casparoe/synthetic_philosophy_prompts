answer: |-
  **THE JOURNAL OF CONSTRUCTIVE REASON**
  **Referee Report: Manuscript #402**
  **Title:** *Geometrica Civilis: The Quadrature of Authority*
  **Referee:** Dr. Elias Vance, Reader in Natural Philosophy

  I have reviewed the submitted manuscript with the care its ambitions require. The author proposes a two-part demonstration: first, a geometric construction solving the quadrature of the circle; second, an application of this same method to prove that sovereign power must be absolute and indivisible. The argument rests on the premise that certainty is only possible in domains where the reasoner constructs the object of study.

  Regarding the geometric section, the construction is elegant but untenable. The author divides the quadrant into diminishing sectors, arguing that as the arc shortens, it becomes indistinguishable from a straight line. At Proposition 4, the proof slides from "sufficiently close" to "equal" without establishing a limit. Specifically, the construction assumes the quantity it is supposed to produce; the straight line is treated as equivalent to the curve once the error becomes "civilly negligible." I must note that while the author cannot be aware of future developments in transcendental number theory (specifically the 1882 proof regarding π), the method relies on an approximation disguised as an identity. As mathematics currently stands, the quadrature is impossible. However, given the author's historical position, I will not reject the manuscript on this ground alone, provided the political corollaries do not depend strictly on the arithmetic precision of the circle.

  Here, the argument falters more significantly. The transition from geometry to politics relies on definitions that function as stipulations rather than descriptions. The author writes, "Let Sovereignty be defined as that Power which cannot be divided without Destruction." Having laid down this definition as a command, the subsequent demonstration merely unfolds the implications of the command. Every theorem follows conditionally: grant me that sovereignty means such-and-such, and lo, sovereignty turns out to be such-and-such. The necessity lies in the language, not in the world. The manuscript treats these linguistic constraints as physical laws. When the author asserts that "to divide the Sword is to blunt it," he offers no evidence beyond the initial definition of the Sword as indivisible. The demonstration is circular, though the circle is drawn in words rather than compasses.

  The author anticipates resistance. The manuscript includes a substantial appendix attributing previous rejections to "the envy of chair-men," "the awkwardness of truth to merchants," and "malice in the universities." These claims are asserted with the same confidence as the geometric proofs, yet they are offered without demonstration. There is no evidence provided for the conspiracy, only the assertion that any denial of the proof must be motivated by corruption. This undermines the scientific posture the text attempts to maintain.

  Nevertheless, I must concede a point of significant weight. The author's central insight—that we can only demonstrate what we make ourselves—possesses a compelling coherence. We know geometry because we draw the figures; we know the commonwealth because we make it; whereas nature we merely find. There is real pull in the idea that political obligation could share the certainty of mathematics if only we acknowledged that we are the architects of the state. The demand for a standard of demonstration in politics is not silly. It is a tragic ambition, seeking in the civil world the stability denied us by the natural. While the specific proofs fail, the desire to ground authority in construction rather than discovery remains a formidable philosophical position.

  ***

  **THE JOURNAL OF CONSTRUCTIVE REASON**
  **Office of the Editor**
  **Decision Letter**

  Dear Author,

  Thank you for submitting *Geometrica Civilis* to *The Journal of Constructive Reason*. We have now received the referee reports and regret to inform you that we cannot accept the manuscript for publication.

  While the referee finds the philosophical ambition of the work notable, the mathematical foundation is insufficient to support the weight of the conclusions. As noted in the review, the geometric construction relies on an equivalence between curve and line that cannot be sustained under scrutiny. Consequently, the political corollaries, which depend on the certainty of the initial geometric method, lose their demonstrative force. To treat political conclusions as theorems requires a rigor that the current definitions do not provide. We appreciate the elegance of treating the Commonwealth as a constructed figure, but we cannot publish stipulations as discoveries.

  We thank you for the opportunity to consider this work and wish you success in placing it elsewhere.

  Sincerely,

  **The Editorial Board**
